canonical_text:
  quote: ''
  summary: The passage contrasts divine guidance with human inability to guide, recalls
    destroyed unjust cities after apostolic warning, depicts resurrection judgment
    against those who associated others with God, describes night and day as divine
    mercy, narrates Korah's wealth, arrogance, and destruction when the earth cleaves
    for him and his palace, and closes with warnings to worship God alone and return
    to Him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the addressed person cannot guide whom he desires,
    while God guides whom He wills and knows those who yield to guidance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some speakers say that if they follow the guided way they will be driven from
    their country; the passage answers by referring to a sacred secure precinct where
    fruits of every kind are gathered as support.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says many flourishing cities were destroyed, their dwellings mostly
    left uninhabited, and God became their heir.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Lord did not destroy cities until an apostle had been
    sent to a mother-city to rehearse signs, and that cities were destroyed only when
    their people were unjust.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Present-life enjoyment and pomp are contrasted with what is with God, which
    is described as better and more lasting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage contrasts one who receives a good promise with one who has present-life
    enjoyments and is brought up for punishment on the day of Resurrection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On that day God calls to them and asks where His supposed companions are.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those on whom doom is pronounced say that they led others astray as they themselves
    had been led astray, and deny that they were the ones worshipped.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The supposed companions are called upon but do not answer; the people see
    the punishment and wish they had been guided aright.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: God asks how the apostles were answered; the people are too confused to give
    an account or ask one another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A person who turns to God, believes, and does right may be among the happy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says God creates what He wills and has free choice, while the
    false gods have no power to choose.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says God knows what people conceal and what they bring to light,
    and that to Him they will be brought back.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage asks who besides God could bring light if God made a long night
    until resurrection, and who besides God could bring night if He made a long day
    until resurrection.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Night is described as made for rest, and day as made for seeking what is needed
    from divine supplies and giving thanks.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: A witness is brought up from every nation, proofs are demanded, and the gods
    of their own devising desert them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Korah is identified as being of the people of Moses, behaving haughtily, and
