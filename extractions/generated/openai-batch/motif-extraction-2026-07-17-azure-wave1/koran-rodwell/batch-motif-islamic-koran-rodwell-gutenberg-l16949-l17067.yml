  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chiefs of Pharaoh's people object to Moses and his people, and Pharaoh
    says male children will be slain while females are preserved alive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Moses tells his people to cry to God for help, bear patiently, and remember
    that the earth belongs to God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moses' people say they have been oppressed before and after his coming, and
