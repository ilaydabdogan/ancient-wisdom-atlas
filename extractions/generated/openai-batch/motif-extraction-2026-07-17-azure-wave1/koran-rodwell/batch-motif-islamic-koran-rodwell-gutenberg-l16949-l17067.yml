  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Flood, locusts, lice, frogs, and blood are sent as clear signs, but Pharaoh's
    people behave proudly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When plagues fall, Pharaoh's people ask Moses to pray for removal and promise
    belief and release of the children of Israel; after relief, they break the promise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vengeance is taken on Pharaoh's people by drowning them in the sea because
    they treat the signs as false and are heedless.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people who had been brought low receive the eastern and western blessed
