canonical_text:
  quote: ''
  summary: 'The passage recounts a Qur''anic Moses narrative: the enchanters believe
    and are threatened by Pharaoh; Pharaoh''s people continue oppression; Moses counsels
    patience; plagues and signs come upon Pharaoh''s people; promises are broken;
    Pharaoh''s people are drowned; the oppressed people inherit blessed lands; the
    children of Israel cross the sea, encounter idol-worshippers, and later make a
    calf idol; Moses meets his Lord for forty nights, Aaron is appointed deputy, the
    mountain is overwhelmed by divine manifestation, and tablets of monition are given.'
  language: English
  quote_policy: summarized
