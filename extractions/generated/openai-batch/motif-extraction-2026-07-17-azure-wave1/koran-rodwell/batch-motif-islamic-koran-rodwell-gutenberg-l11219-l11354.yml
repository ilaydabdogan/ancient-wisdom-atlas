  claim: The notes connect the Qur'anic Seven Sleepers material with a tradition in
    which sleepers enter a cavern under Decius and awake under Theodosius.
  claim_level: same_motif
  target: Seven Sleepers tradition
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs:
