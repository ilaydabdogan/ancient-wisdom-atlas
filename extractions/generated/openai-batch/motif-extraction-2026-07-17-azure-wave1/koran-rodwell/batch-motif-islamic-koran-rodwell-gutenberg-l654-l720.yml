  text: Ancient writers and early collectors of traditions are described as the principal
    sources for authentic information about Muhammad's life; later records are treated
    as unreliable by comparison.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that, apart from more poetical parts, the Koran's materials
    are derived from local legends, Jewish traditions based on the Talmud, and Christian
    traditions of Arabia and South Syria.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people of Mecca are described as taunting the Koran as poetic work, antiquated
    or fabulous legends, or sorcery, and as accusing Muhammad of having confederates.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Salman the Persian and the Christian monk Sergius, called Boheira by Muslims,
    are named as alleged foreign coadjutors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Salman the Persian is linked in the passage with descriptions of Heaven and
    Hell said to be analogous to those of the Zendavesta.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sergius or Boheira, and perhaps other Christians, are linked with Muhammad's
    access to the Apocryphal Gospels and popular traditions expressed in those gospels.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Chadijah and Waraka are said to have been well acquainted with Jewish and
    Christian doctrines and sacred books.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Muhammad is said to have travelled with Abu Talib to Bostra, where he may
