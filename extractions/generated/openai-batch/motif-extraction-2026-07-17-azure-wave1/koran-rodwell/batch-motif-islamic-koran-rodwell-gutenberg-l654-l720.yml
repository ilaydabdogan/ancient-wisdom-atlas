  summary: A preface section evaluates early sources for Muhammad's life, argues that
    later authorities are unreliable, and presents source-critical claims about the
    Koran's relation to Arabian legends, Jewish/Talmudic traditions, Christian and
    apocryphal traditions, Zoroastrian afterlife descriptions, and the Hanyf movement
    associated with Abrahamic monotheism and the Books of Abraham.
  language: English
  quote_policy: summarized
