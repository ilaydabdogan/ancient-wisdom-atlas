  text: The Hanyfs are also termed Sabeites in a cited treatise and are said to have
    received the Volumes or Books of Abraham.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says commentators considered some Koranic passages borrowed from
