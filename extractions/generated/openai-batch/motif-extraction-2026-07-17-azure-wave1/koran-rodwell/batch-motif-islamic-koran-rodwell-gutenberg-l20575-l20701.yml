canonical_text:
  quote: ''
  summary: The passage addresses believers in a battle setting. It describes sleep
    and water from heaven as divine security and cleansing, divine speech to angels,
    commands not to flee, attribution of victory and projectiles to God, warnings
    of punishment and Hell for opposition or desertion, remembrance of earlier weakness
    and divine aid, warnings about temptation and false dealing, hostile plotting
    against the apostle countered by God, disputes over signs and the holy temple,
    judgment of unbelievers, possible forgiveness if they desist, allocation of one-fifth
    of booty, and a battlefield scene involving a valley, caravan, hosts, and a dream
    showing the enemy as few.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sleep is described as a sign of security from God, and water from heaven is
    sent to cleanse the faithful, remove Satanic pollution, strengthen hearts, and
    steady feet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord speaks to angels, says he will be with them, commands them to establish
    the faithful, and says dread will be cast into the hearts of infidels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Opposition to God and his apostle is linked with severe punishment and the
    torture of fire for infidels.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Believers are warned not to turn their backs when meeting the marshalled hosts,
    except to fight or rally to another troop; turning back is linked with divine
    wrath and Hell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The slaying of enemies and the shooting of shafts are attributed to God rather
    than to the human fighters or the apostle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says God brought the craft of the infidels to nothing, and tells
    the Meccans that their forces will not avail because God is with the faithful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The faithful are told to obey God and the apostle, to answer a call that gives
    life, and are told that God comes between a man and his heart and that they will
    be gathered to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Temptation is warned against, and the faithful are reminded that they were
    once few and weak before God took them in, strengthened them, and supplied good
    things.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Believers are told not to deal falsely with God and the apostle and are told
    that wealth and children are a temptation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Unbelievers are said to have plotted to detain, kill, or banish the apostle;
    the passage says they plotted and God plotted.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Opponents say the rehearsed signs are tales of the ancients and ask God to
    rain stones from heaven or send grievous chastisement if the message is true.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: God is said not to chastise them while the apostle is with them or when they
