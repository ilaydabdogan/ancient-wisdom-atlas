canonical_text:
  quote: ''
  summary: 'The passage first warns that God delays the wicked only until a terrifying
    day of punishment and recompense, when the earth and heavens are changed and the
    wicked are chained, clothed in pitch, and surrounded by fire. It then begins the
    Sura of Joseph: Joseph reports a vision of celestial bodies bowing to him; his
    father warns him against telling his brothers. The brothers, jealous of Joseph,
    plot against him, place him in a well, and deceive their father with a false wolf
    story and a bloodied shirt. Wayfarers discover Joseph, sell him cheaply, and an
    Egyptian buyer brings him into his household. Joseph is described as receiving
    judgment, knowledge, and instruction in interpretation. The woman in the house
    attempts to seduce him, accuses him, and a witness uses the torn direction of
    Joseph’s shirt as evidence.'
  language: English
  quote_policy: summarized
