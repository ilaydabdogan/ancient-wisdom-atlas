canonical_text:
  quote: ''
  summary: The passage instructs worshippers to complete pilgrimage rites, honor sacred
    ordinances, sacrifice cattle and camels while invoking God, and understand that
    piety rather than flesh or blood reaches God. It sanctions defense for wronged
    believers, recalls earlier communities that rejected prophets and were chastised,
    identifies ruined cities as warnings, describes the Prophet as a warner, contrasts
    the fate of believers and unbelievers at divine judgment, explains Satanic interference
    as a trial that God nullifies, promises provision to those who flee or die for
    God, and presents the alternation of night and day as a sign of God’s truth.
  language: English
  quote_policy: summarized
