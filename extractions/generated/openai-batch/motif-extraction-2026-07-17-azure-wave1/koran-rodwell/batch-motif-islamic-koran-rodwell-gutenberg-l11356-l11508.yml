candidate_motifs:
- id: motif:1
  label: inescapable fiery punishment for denial
  taxonomy_refs:
  - divine_judgment
  basis: Sinners who denied the torment are returned to the fire whenever they desire
    escape, and enemies of God are later gathered to fire.
  evidence_refs:
  - ev:1
  - ev:12
  - ev:14
  confidence: high
  cautions: The passage emphasizes punishment and confinement, not a detailed geography
    of the afterlife.
- id: motif:2
  label: day of resurrection as final decision
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The Lord decides disputes on the day of resurrection, and on the day of decision
    the faith of infidels no longer avails them.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage gives the decision's finality but few narrative details of
    resurrection itself.
