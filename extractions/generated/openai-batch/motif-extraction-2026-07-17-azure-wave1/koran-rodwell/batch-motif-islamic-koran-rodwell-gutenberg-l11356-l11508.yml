canonical_text:
  quote: ''
  summary: 'The passage describes punishment in fire for sinners, a nearer and greater
    punishment, Moses receiving the Book as guidance for Israel, divine decision on
    the day of resurrection, signs in destroyed generations and rain-fed land, and
    the opening of Sura XLI: a made-plain Arabic revelation, rejected by opponents.
    It then recounts divine creation of earth, mountains, provision, heaven from smoke,
    seven heavens with lights and guardian angels; warns by comparison with the tempest
    of Ad and Themoud; and depicts enemies of God gathered to fire, where ears, eyes,
    and skins testify against them, followed by punishment and recompense for unbelievers.'
  language: English
  quote_policy: summarized
