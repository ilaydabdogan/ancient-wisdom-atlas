  quote: ''
  summary: The passage states that God sent prophets and the Book of Truth to guide
    human disputes; describes trials before entering Paradise; gives rulings on alms,
    war, apostasy, wine and games of chance, orphans, marriage, purity, oaths, abstention,
    and divorce; and repeatedly frames these rulings as signs, wisdom, and bounds
    established by God.
