canonical_text:
  quote: '"Verily, Jesus is as Adam in the sight of God. He created him of dust: He
    then said to him, ''Be'' and he was."'
  summary: The passage describes Jesus as taught scripture and wisdom, sent to Israel
    with signs including making a bird from clay by God's leave, healing, quickening
    the dead, and revealing hidden provisions. It recounts disciples professing belief,
    Jewish plotting and divine counter-plotting, God's promise to cause Jesus to die,
    take him up, deliver him, and judge believers and unbelievers. It compares Jesus
    to Adam as created from dust by divine command. It then addresses disputes with
    the People of the Book about Jesus, Abraham, scripture, truth, trust, oaths, and
    the improper elevation of prophets or angels as lords beside God.
  language: English
  quote_policy: quoted
