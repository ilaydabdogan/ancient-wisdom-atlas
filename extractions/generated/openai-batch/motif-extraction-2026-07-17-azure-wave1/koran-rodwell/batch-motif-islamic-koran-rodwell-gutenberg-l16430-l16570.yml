  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage asks whether people have journeyed in the land and seen the end
    of former peoples who were mightier in strength.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: God would not leave even a reptile on the earth if he chastised humans according
    to deserts, but he respites them until an appointed time.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: At the start of Sura VII, a Book is sent down to the addressee for warning
    and as a monition to the faithful, and people are told to follow what was sent
    down from their Lord.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Many cities are said to have been destroyed when wrath reached them by night
