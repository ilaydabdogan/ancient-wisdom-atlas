  text: God is said to know hidden things in the heavens and earth and the secrets
    of the breast.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Humans are appointed as God's vicegerents in the earth, and unbelief is said
    to increase hatred and perdition for unbelievers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage challenges invoked gods beside God by asking what part of earth
