    a Book as proof.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: God is said to hold fast the heavens and the earth so that they do not pass
    away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Those who swore they would accept guidance from a preacher are described as
