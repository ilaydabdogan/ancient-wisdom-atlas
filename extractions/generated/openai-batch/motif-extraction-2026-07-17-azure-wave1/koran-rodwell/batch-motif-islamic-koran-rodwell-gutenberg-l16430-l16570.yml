canonical_text:
  quote: ''
  summary: The passage contrasts chosen servants who inherit the Book and enter Eden
    with infidels punished in Hell; asserts God's knowledge, creative sovereignty,
    and restraint of heaven and earth; recalls warnings, destroyed peoples, judgment,
    and respite; then opens Sura VII with the revealed Book, destroyed cities, reckoning,
    weighing of deeds, human establishment on earth, the creation of Adam, angelic
    prostration, Eblis's refusal on grounds of fire versus clay, his expulsion, respite
    until resurrection, and vow to ambush humans on God's straight path.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Book is described as an inheritance given to chosen servants, who are
    divided into wrongdoers, those midway between good and evil, and those who outstrip
    in goodness by God's permission.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rewarded enter gardens of Eden, wear gold and pearl bracelets and silk
    garments, and praise God for removing sorrow and placing them in an everlasting
    abode without toil or weariness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Infidels are assigned the fire of Hell, where death is not decreed for them
    and torment is not lightened.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The punished cry for removal and promise righteousness, but are answered that
    they had time for warning and that a preacher came to them.
  category: speech
  evidence_refs:
  - ev:4
