  quote: ''
  summary: The passage exhorts humans to believe in an apostle who has come with truth;
    addresses the People of the Book about Jesus, divine unity, and rejection of saying
    “Three”; contrasts humble service with pride before God; promises mercy, grace,
    recompense, and chastisement; and gives a rule for inheritance among distant kindred.
    Translator notes in the same passage add historical and comparative comments on
    inheritance traditions and prayer practices.
  language: English
