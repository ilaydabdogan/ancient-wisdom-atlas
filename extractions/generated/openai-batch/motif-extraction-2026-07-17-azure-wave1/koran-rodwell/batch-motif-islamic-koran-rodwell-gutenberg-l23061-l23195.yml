- id: obs:1
  text: Humans are addressed and told that an apostle has come with truth from their
    Lord; belief is urged, and God is described as owner of what is in the heavens
    and earth, knowing and wise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The People of the Book are told not to overstep religious bounds and are instructed
    that the Messiah, Jesus son of Mary, is an apostle of God, God’s Word conveyed
    into Mary, and a Spirit proceeding from God; they are told not to say “Three,”
    and God is described as one God without a son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Messiah and the angels near God are said not to disdain being servants
    of God; those who disdain service and are proud will be gathered to God, while
    believers who do right receive recompense and increase, and the proud receive
    grievous chastisement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A proof and a clear light are said to have been sent down; those who believe
