candidate_motifs:
- id: motif:1
  label: moral choice as two paths and two sides
  taxonomy_refs:
  - duality
  - divine_judgment
  basis: The passage gives humans two highways and distinguishes right-hand and left-hand
    people, with fire surrounding disbelievers.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The exact symbolic scope of the two highways is supplied by the translator’s
    note as good and evil.
- id: motif:2
  label: steep path of mercy to captives and the poor
  taxonomy_refs: []
  basis: The steep is defined as ransoming captives, feeding in famine, aiding orphans
    and the poor, and practicing steadfastness and compassion.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: No broader taxonomy family is assigned because the passage presents ethical
    duties rather than a narrative quest.
- id: motif:3
  label: divine defeat of a hostile army through birds and stones
  taxonomy_refs:
  - divine_judgment
  basis: The Lord foils the army of the Elephant and sends birds that hurl claystones,
    leaving the army like eaten stubble.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: The translator’s historical and medical interpretation in the note is
    distinct from the literal poetic action of the sura.
- id: motif:4
  label: protected sacred house and provision for a trading community
  taxonomy_refs: []
  basis: The Koreisch are told to worship the Lord of the house because he fed them
    against hunger and secured them against alarm; a note links this to the inviolability
    of the Haram.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: medium
  cautions: The passage supports sacred protection and provision, but does not explicitly
    frame a covenant formula.
- id: motif:5
  label: sacred night of revelation and angelic descent
  taxonomy_refs:
  - wisdom
  basis: The Night of Power is the night on which the Koran descends; angels and the
    spirit descend for every matter and peace lasts until dawn.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The taxonomy reference to wisdom is based on revelation and discriminating
    discourse, not on a named wisdom figure.
- id: motif:6
  label: resurrection and exposure of secrets
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: God is said to be able to restore man to life on a day when all secrets are
    searched out and the person has no helper.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives a compact doctrinal statement rather than an extended
    afterlife itinerary.
- id: motif:7
  label: cosmic witnesses and the morally divided soul
  taxonomy_refs:
  - duality
  basis: The Sun invokes paired cosmic images and says the soul is balanced and given
    wickedness and piety, with opposed outcomes for purity and corruption.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The cosmic oaths and inner moral division are adjacent in the text; their
    interpretive relationship should be reviewed.
- id: motif:8
  label: violation of a sacred animal followed by collective punishment
  taxonomy_refs:
  - divine_judgment
  basis: Thamoud reject the messenger, are warned to let the Camel of God drink, hamstring
    her, and are destroyed by their Lord for the crime.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not call the camel a sacrifice, so no sacrifice taxonomy
    is assigned.
comparison_claims:
- id: claim:1
  claim: A translator note explicitly links the phrase “companion of the fish” with
    Jonah passages elsewhere in the Koran.
  claim_level: same_motif
  target: Jonah passages in Sura xxxvii.139-148 and Sura xxi.87
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The selected passage contains only the note and not the Jonah narrative
    itself.
- id: claim:2
  claim: The translator compares the priority of ransoming captives in The Soil with
    a Jewish legal text that gives captive ransom precedence over feeding and clothing
    the poor.
  claim_level: same_function
  target: Hilchoth Matt'noth Aniim, chapter 8, on ransoming captives
  evidence_refs:
  - ev:2
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the translator’s note; the sura itself
    presents the act as part of an ethical exhortation.
- id: claim:3
  claim: The translator places the Night of Power near a rabbinic pattern of a sacred
    time when books of destiny are opened and sealed.
  claim_level: same_function
  target: Babylonian Talmud, Rosh Hashanah I, books opened on New Year’s Day
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The sura mentions descent, peace, and matters by divine permission;
    the explicit book-inscription imagery appears only in the translator’s comparative
    note.
