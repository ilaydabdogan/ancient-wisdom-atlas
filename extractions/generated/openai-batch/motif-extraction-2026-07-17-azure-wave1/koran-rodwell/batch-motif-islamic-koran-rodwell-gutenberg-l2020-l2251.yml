canonical_text:
  quote: ''
  summary: 'The passage contains translator notes and several short Meccan suras:
    The Soil, The Elephant, The Koreisch, Power, The Night-Comer, and The Sun. It
    presents moral testing, mercy to captives and the poor, right-hand and left-hand
    outcomes, divine punishment by fire, the defeat of the army of the Elephant, protected
    caravans and worship at a sacred house, the descent of revelation and angels on
    the Night of Power, creation and restoration to life, cosmic oaths, moral duality
    within the soul, and the punishment of Thamoud after the Camel of God is hamstrung.'
  language: English
  quote_policy: summarized
