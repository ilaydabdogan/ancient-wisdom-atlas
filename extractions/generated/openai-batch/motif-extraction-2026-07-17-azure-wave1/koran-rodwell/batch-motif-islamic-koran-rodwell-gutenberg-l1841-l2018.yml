candidate_motifs:
- id: motif:1
  label: Selfless almsgiving as purification before God
  taxonomy_refs:
  - sacred_exchange
  basis: The giver parts with substance to become pure and seeks the Lord's face rather
    than recompense from people.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage denies ordinary recompense; the taxonomy link to sacred exchange
    is therefore functional and should be reviewed.
- id: motif:2
  label: Accused messenger vindicated by divine assurance
  taxonomy_refs: []
  basis: The Prophet is accused of possession by opponents but is addressed as not
    possessed, noble in nature, and due recompense.
  evidence_refs:
  - ev:3
  - ev:14
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available list does
    not contain a precise messenger-vindication category.
- id: motif:3
  label: Greedy gardeners punished by ruined harvest
  taxonomy_refs:
  - divine_judgment
  basis: Owners who plan to harvest while excluding the poor find the garden desolated
    by the Lord and confess transgression.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is extracted from a parable-like exemplum within the passage.
- id: motif:4
  label: Eschatological judgment separating pious and offenders
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The God-fearing receive gardens of delight, offenders are challenged, and
    a day is described when people cannot bow and shame covers them; the passage also
    mentions oaths until the day of resurrection.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage emphasizes judgment more than an extended resurrection narrative.
- id: motif:5
  label: Sacred writing as revelatory authority
  taxonomy_refs:
  - wisdom
  basis: The opening oath invokes the Pen and writing, and later references Scripture
    and the Book of God in relation to truth and judgment.
  evidence_refs:
  - ev:2
  - ev:10
  - ev:12
  confidence: medium
  cautions: The role of the Pen is explicit, but the broader wisdom classification
    is inferential and needs review.
- id: motif:6
  label: Distressed figure in a fish delivered by divine favor
  taxonomy_refs: []
  basis: The one in the fish cries to God in distress, receives favor from the Lord,
    and is chosen as just; a translator note connects this with Jonas.
  evidence_refs:
  - ev:13
  - ev:16
  confidence: medium
  cautions: The passage gives only a brief allusion rather than a full fish-deliverance
    narrative.
comparison_claims:
- id: claim:1
  claim: The translator explicitly compares the passage's teaching that almsgiving
    purifies with Luke xi. 41 and suggests a possible relation to Jewish oral law.
  claim_level: same_function
  target: Luke xi. 41 and Jewish oral law on almsgiving
  evidence_refs:
