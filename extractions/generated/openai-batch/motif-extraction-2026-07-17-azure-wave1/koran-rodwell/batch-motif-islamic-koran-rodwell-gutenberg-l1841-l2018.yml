  limitations: The passage only alludes to the figure and does not recount the full
    surrounding narrative.
- id: claim:3
  claim: The initial Nun is linguistically conjectured by the translator to relate
    to fish, potentially linking the sura opening with the later fish allusion.
  claim_level: linguistic_similarity
  target: Nun as 'fish' and the Jonas fish allusion
