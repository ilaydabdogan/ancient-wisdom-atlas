- id: claim:2
  claim: The fish allusion is cautiously comparable to the Jonas/Jonah fish tradition
    because the passage mentions a figure in the fish and the translator identifies
    the fish as the one that swallowed Jonas.
  claim_level: same_motif
  target: Jonas/Jonah swallowed by the fish
  evidence_refs:
  - ev:13
  - ev:16
  counter_evidence_refs: []
