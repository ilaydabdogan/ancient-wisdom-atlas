canonical_text:
  quote: ''
  summary: The passage closes a prior section on selfless giving and purification,
    then presents Sura LXVIII, opening with an oath by Nun and the Pen, defending
    the Prophet against accusations of possession, warning against a slanderous opponent,
    recounting the punishment and repentance of the owners of a garden who planned
    to exclude the poor, contrasting the God-fearing with offenders, describing a
    day when people cannot bow in worship, and alluding to the figure in the fish
    who cried to God and was chosen as just.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The God-fearing person gives away substance to become pure, not for recompense
    from others, but seeking the face of the Most High Lord, and is promised contentment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sura opens with Nun and an oath by the Pen and what they write.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Prophet is addressed as not possessed, as having a boundless recompense,
    and as being of noble nature.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hostile man is described as oath-taking, despicable, slanderous, obstructive
    of good, transgressive, criminal, harsh, and impure by birth, despite riches and
    sons.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When wondrous verses are recited to the hostile man, he calls them fables
    of the ancients, and the passage says he will be branded on the nostrils.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Meccans are said to have been proved as the owners of a garden were proved
    when the owners swore to cut its fruits in the morning without adding a reserve.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An encircling desolation from the Lord swept around the garden while the owners
    slept, and in the morning it appeared as if its fruits had already been cut.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The garden owners went out at daybreak with the stated purpose that no poor
    man should set foot in their garden that day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the owners saw the ruined garden, they acknowledged fault, blamed one
    another, confessed transgression, and hoped the Lord would give them a better
    garden in exchange.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says the God-fearing will have gardens of delight in the presence
    of their Lord and asks whether those surrendered to God should be dealt with like
    offenders.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Opponents are challenged about whether they have a Scripture, binding oaths
    until the day of resurrection, a guarantor, or associate-gods they can produce.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: On a day when men's legs are bared, they are called to bow in adoration but
    cannot, and shame covers them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Prophet is told to await the Lord's judgment patiently and not be like
    the one in the fish, who cried to God in distress, received favor, and was chosen
    as one of the just.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:14
  text: Infidels are said almost to strike the Prophet down with their looks when
    they hear the warning of the Koran, and they say he is possessed.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Translator notes compare the passage's view of almsgiving with Luke xi. 41
    and suggest possible relation to Jewish oral law.
  category: other
  evidence_refs:
  - ev:15
- id: obs:16
  text: Translator notes report a conjecture that Nun means fish and may refer to
