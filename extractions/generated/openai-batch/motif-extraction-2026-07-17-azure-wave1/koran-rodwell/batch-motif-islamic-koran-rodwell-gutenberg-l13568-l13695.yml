  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: The brothers mention an earlier alleged theft by a brother, while Joseph keeps
    his secret from them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The brothers ask the Prince to take one of them instead of Benjamin because
    Benjamin has a very aged father; Joseph refuses to take anyone except the one
    with whom the property was found.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the brothers despair of Benjamin, the eldest recalls their pledge before
