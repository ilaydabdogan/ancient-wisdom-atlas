canonical_text:
  quote: ''
  summary: Jacob hesitates to send Benjamin with his sons, requires an oath before
    God, and instructs them to enter by different gates. Joseph privately identifies
    himself to his brother, places the prince's cup in the brother's pack, and retains
    him through the resulting charge. The brothers return to Jacob, who grieves for
    Joseph yet sends them to seek Joseph and his brother. Joseph reveals himself,
    forgives his brothers, sends his shirt to restore Jacob's sight, and receives
    the family into Egypt.
  language: English
  quote_policy: summarized
