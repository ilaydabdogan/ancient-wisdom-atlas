  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narration states that entering by different gates did not avert what God
    decreed but satisfied a desire in Jacob, who possessed knowledge taught to him.
  category: sequence
  evidence_refs:
  - ev:2
