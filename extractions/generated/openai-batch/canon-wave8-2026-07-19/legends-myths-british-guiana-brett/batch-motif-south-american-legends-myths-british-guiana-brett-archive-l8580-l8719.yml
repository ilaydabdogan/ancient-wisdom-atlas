canonical_text:
  quote: ''
  summary: A village above a great waterfall neglects a helpless old man whose feet
    are infested with insects. The villagers decide to put him and his property in
    a wood-skin and send him down the river toward the fall, saying the river may
    bear him to the spirit-land. As the vessel goes over the fall, later tellers say
    a power intervenes and turns the man, the vessel, and its freight into stones
    visible at the cataract associated with Kaieteur or Old Man's Fall.
  language: English
  quote_policy: summarized
