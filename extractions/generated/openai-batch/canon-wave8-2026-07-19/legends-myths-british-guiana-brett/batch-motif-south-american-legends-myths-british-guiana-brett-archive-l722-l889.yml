canonical_text:
  quote: ''
  summary: Verse retelling of two catastrophes. First, the Maker's wrath at violent
    wrongdoing brings a sweeping fire; a warned chieftain leads a small band to prepare
    a sand-roofed vault and a cleared firebreak, enabling survival while others perish.
    Later, after renewed wrongdoing, a flood warning is ignored except by Marerewana,
    who builds a roofed canoe for his family, moors it to a great tree as instructed
    by a voice, survives the flood, and lands near his former home.
  language: English
  quote_policy: summarized
