canonical_text:
  quote: ''
  summary: In a sequel framed by the narrator's encounter with an old Warau storyteller,
    Abore travels over the sea to a new land, settles among impoverished white people,
    teaches them clothing-making and crafts in wood and iron, improves boats into
    large ships, and sends goods. The passage says he remains alive in the white people's
    land because a spirit would claim him if he returned. It also connects annual
    colonial presents to the Waraus with Abore, then gives an editorial explanation
    and missionary closing about Warau traditions and Christianized Waraus.
  language: English
  quote_policy: summarized
