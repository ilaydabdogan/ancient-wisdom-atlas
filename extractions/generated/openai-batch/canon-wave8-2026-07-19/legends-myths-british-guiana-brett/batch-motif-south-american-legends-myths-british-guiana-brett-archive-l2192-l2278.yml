canonical_text:
  quote: ''
  summary: A force of Caribs comes to avenge prior defeats. The narrator's people
    meet them on the Waiini, with the Waraus serving as scouts and spies rather than
    fighters. The narrator's side wins by ambush. Bohirasiri, a famed champion, wounds
    and captures the Carib chieftain Manarwa. A council debates Manarwa's fate; he
    promises that his people will make peace if he is spared. The council releases
    him with four surviving men, and the passage says he keeps his promise and the
    region has peace.
  language: English
