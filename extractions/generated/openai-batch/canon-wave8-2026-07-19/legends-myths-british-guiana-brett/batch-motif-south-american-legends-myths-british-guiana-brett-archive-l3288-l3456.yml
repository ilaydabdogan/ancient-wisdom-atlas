canonical_text:
  quote: ''
  summary: 'The passage recounts a Warau-related tale in which a mother mourns and
    protects the remains of a serpent child; the body-mound stirs, and the son rises
    as a fully armed warrior identified as the first Carib, who defeats Waraus and
    takes wives and goods. It then describes Warau ideas about the dead: weapons are
    placed in graves so the soul can pass hostile souls on the way to spirit land.
    A contrasting Trinidad legend says good men''s souls were enclosed in hummingbirds
    until Chaymas molested them and sank beneath the ground, leaving the pitch lake.'
  language: English
  quote_policy: summarized
