canonical_text:
  quote: ''
  summary: An old man forbids his people to fight on his behalf and faces Ekahruwa
    in single combat. Ekahruwa's arrows fail, he hesitates before a sting-ray spine
    weapon, then charges and is killed by the old man's arrow. Ekahruwa's brother
    publicly clears the old man, balances the deaths on each side, and calls for peace.
    Later, blood-feuds resume, groups disperse northward and toward Demerara, Arawaks
    receive some migrants, and further conflict and secret murders follow.
  language: English
  quote_policy: summarized
