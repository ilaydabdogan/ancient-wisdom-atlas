canonical_text:
  quote: ''
  summary: A verse retelling describes a Warau defensive victory against Carib raiders
    on the Haimara-Cabura. After long oppression and annual raids, the defenders place
    women and children on a hill, prepare weapons, and conceal a heavy log just under
    the surface of a narrow stream. A small fishing canoe draws the Carib canoes into
    the passage, where the leading boats strike the hidden log, are overturned, and
    are attacked with arrows, hooked poles, clubs, and blades. The Carib chieftain
    Manarwa escapes with a few canoes, while the defenders hold the battlefield and
    bury the dead; later erosion exposes human bones said to be relics of the fight.
  language: English
  quote_policy: summarized
