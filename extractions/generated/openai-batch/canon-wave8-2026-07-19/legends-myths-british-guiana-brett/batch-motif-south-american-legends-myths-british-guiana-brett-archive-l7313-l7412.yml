canonical_text:
  quote: ''
  summary: Birds and humans ally to kill an immense water serpent. A cormorant chief
    dives, wounds the serpent with a line-tied arrow, and enables it to be hauled
    out and skinned. After the humans challenge the cormorant's claim to the promised
    skin, the birds fly away with it, divide it, and receive varied plumage from its
    colors; the cormorant receives the dark head.
  language: English
