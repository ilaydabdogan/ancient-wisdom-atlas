canonical_text:
  quote: ''
  summary: Two Warau sisters ignore their brothers' warning not to bathe in a fatal
    lake. Korobona, the elder sister, breaks a charmed wooden rod in the water, releasing
    a bound water spirit who seizes her and takes her below while allowing the sister
    to go. Korobona later bears children connected with the spirit; her brothers threaten
    or kill them. The spirit appears by the lake in serpent, human, and mixed forms
    and captures Korobona again. A later son, partly resembling his father, is hidden
    in the woods, survives an initial arrow wound through his mother's care, grows
    unusually in wisdom and size, and is eventually tracked and killed by Korobona's
    brothers while she tries to shield him.
  language: English
  quote_policy: summarized
