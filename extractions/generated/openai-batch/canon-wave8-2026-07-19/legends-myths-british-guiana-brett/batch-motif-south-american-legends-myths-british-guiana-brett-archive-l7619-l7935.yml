canonical_text:
  quote: ''
  summary: A verse legend recounts how To-eyza, wife of a chieftain, summons a lover
    disguised as the animal called Walyarima, sees him killed by her husband, organizes
    women to poison their husbands, and leads a migrating armed female band that calls
    itself the Woman's nation and establishes rules excluding settled men and sending
    away boys.
  language: English
  quote_policy: summarized
