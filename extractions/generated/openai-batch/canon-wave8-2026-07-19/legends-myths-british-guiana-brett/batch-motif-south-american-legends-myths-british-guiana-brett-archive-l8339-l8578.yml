canonical_text:
  quote: ''
  summary: 'The passage completes a legend in which the maimed Serikoai follows signs
    left by avocado pear seeds, finds his wife with the Wailya in tapir form, kills
    the Wailya, and pursues the wife and the Wailya''s shadow to the edge of the earth
    and into the sky. The figures are then identified with visible constellations:
    the woman with the Pleiades, the Wailya or tapir with the Hyades and Aldebaran,
    and Serikoai with Orion. The passage then shifts to a descriptive introduction
    to Potaro''s cataract, called the Old Man''s Fall, and states that an Indian tale
    explains the name.'
  language: English
  quote_policy: summarized
