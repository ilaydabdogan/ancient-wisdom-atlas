canonical_text:
  quote: ''
  summary: The passage recounts the descent of the first people from above, their
    stranding on earth, the divine provision of food and a wondrous tree containing
    cultivated plants, the discovery and felling of that tree, the appearance of a
    Water-Mother and a protective speaking rock, the warning not to answer spirits
    from the wood, the loss of possible youth-renewal, and a destructive flood survived
    only by a few on a komoo palm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mankind descended from on high intending to cleanse the world, but the clouds
    that had borne them withdrew and they remained below.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunger led the people to take clayey earth, make fire, and try to bake it
    into cakes, which turned out like sand or crumbling stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tamosi had provided wild fruits, and beasts and birds guided people to the
    trees whose fruits each creature preferred.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tamosi made a wondrous tree bearing many kinds of fruit, with plantains, bananas,
    maize, cassava, yams, potatoes, and other cultivated plants around its trunk and
    roots.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Maipuri, identified in the passage as the tapir, first observed the wondrous
    tree and secretly ate fallen fruit from it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Woodpecker was sent as a scout but was heard by Maipuri; Rat silently tracked
    Maipuri, shared the food, and later was made to reveal the feeding ground after
    food was found on his lips.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: An oracle commanded the people to cut the tree down, and they used sharp stones
    until it fell after ten months.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the tree fell, people divided slips and cuttings from its branches,
    roots, and sides for their fields.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Under the roots of the great tree some saw a sacred grot, associated with
    the Water-Mother and swelling waters.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: A rugged rock stopped the mighty water-flow and then gave oracles to the people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The rock warned that spirits in the wood would tempt the people and instructed
    them not to answer the spirits if they feared swelling waters.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The rock said the people could cast off age and renew youth like a serpent
    shedding its slough.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: After time passed, the people obeyed voices from the wood and despised the
    grey rock-stone.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Yarrekaru, glossed as the monkey, came from the grove and undermined the guardian
    stone while the people did not prevent him.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Mocking cries from the grove were answered by the people; then waters rushed
    in, and the stone declared it could no longer help them.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Floods, tempests, and torrents overwhelmed mankind; three or four survived
    on a komoo palm, while those not saved by that tree sank beneath the wave.
  category: sequence
  evidence_refs:
  - ev:16
