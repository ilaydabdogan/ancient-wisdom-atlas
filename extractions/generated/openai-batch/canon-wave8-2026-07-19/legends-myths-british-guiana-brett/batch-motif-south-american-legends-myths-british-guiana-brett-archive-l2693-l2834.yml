canonical_text:
  quote: '"came down the rope ladder to this world below"'
  summary: Okonorote sees animals on the lower ground from above, has the Waraus make
    a rope ladder, descends to explore, kills and cooks deer, returns with game, and
    persuades the Waraus to descend. During the migration a woman becomes wedged in
    the hole through which they passed; after failed rescue attempts and a warning
    about danger, she remains there, blocking the hole and explaining why people cannot
    see through the sky.
  language: English
  quote_policy: quoted
