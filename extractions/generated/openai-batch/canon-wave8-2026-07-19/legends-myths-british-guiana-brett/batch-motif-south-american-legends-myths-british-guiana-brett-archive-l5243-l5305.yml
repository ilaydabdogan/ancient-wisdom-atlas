  quote: ''
  summary: The conclusion describes the remnant of a once-great clan forced to flee
    by Brazilians after receiving instruction from an English Christian teacher. They
    come grieving to Georgetown, where the narrator sees their youthful chief beside
    his pastor, wearing an ancestral crescent ornament. Macusis are said to be among
    the displaced group. The passage then alludes to an omitted near-war and to the
    Christian teacher’s fate, and closes with missionary reflections on Caribs on
    other rivers, contrasting Christian teaching and love with clubs, arrows, and
    the conquering sword.
