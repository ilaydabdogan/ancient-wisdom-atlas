  quote: ''
  summary: The passage is a verse account of a customary Carib war path. It describes
    Carib raiders traveling by canoe and overland through named river regions, plundering
    settlements, killing or enslaving people, joining with allied groups, using concealed
    rafts or fallen trees for surprise attacks, and finally mobilizing a large force
    after a message claims their warlike fame has been diminished. The warriors discard
    ornaments, carry weapons, hammocks, and food, paint their faces red, and leave
    their families for war. An inserted note provides seventeenth-century colonial
    context for Surinam, Essequibo, Berbice, Demerara, and New Holland.
  language: English
