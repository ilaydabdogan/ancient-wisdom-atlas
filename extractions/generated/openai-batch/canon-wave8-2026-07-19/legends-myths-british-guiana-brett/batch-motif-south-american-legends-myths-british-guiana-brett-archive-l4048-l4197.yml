canonical_text:
  quote: ''
  summary: A verse historical sketch describes Carib resistance to early European
    colonists, focusing on Bretigny, a harsh French governor at Cayenne. After Caribs
    vow to kill him, he learns of the plan from a woman, orders Caribs seized, pursues
    escaping Caribs by canoe, lands and sleeps in an Indian cabin, and is surrounded
    at morning by Carib warriors who kill him and his guards. The passage closes by
    saying French settlement at Cayenne succeeds only after many years.
  language: English
