canonical_text:
  quote: ''
  summary: Carib forces gather allies to fight the Cabres near the Orinoco region.
    After an initial Carib defeat, a spared survivor is forced to witness the victors
    eating the slain and is released by the chieftain Tep with a taunt. The Caribs
    gather a larger force, defeat the Cabres, and begin exterminating them. The narrator
    adds a note distinguishing accusations of cannibalism among Caribs, Cabres, inland
    tribes, and island Caribs. The passage then describes a Carib feast with paiwari,
    adornment, dance, music, and old men recounting older battles and themes.
  language: English
  quote_policy: summarized
