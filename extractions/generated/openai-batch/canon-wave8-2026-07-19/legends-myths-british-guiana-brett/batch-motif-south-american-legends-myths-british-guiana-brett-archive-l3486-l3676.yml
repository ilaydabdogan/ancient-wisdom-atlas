canonical_text:
  quote: ''
  summary: Abore, a clever young man reared and controlled by Wowtah, is sent to gather
    honey. In the forest he meets a young woman who reveals herself as a spirit and
    says Wowtah is also a spirit who deceived his parents, magically raised him, and
    intends a coercive marriage. Abore tries to flee and then to kill Wowtah, but
    she compels his return and survives the trap. Remembering that only escape across
    the wide sea may free him, he studies floating objects, designs a wax canoe from
    a seed-pod model, and has it destroyed by Wowtah at the waterside.
  language: English
  quote_policy: summarized
