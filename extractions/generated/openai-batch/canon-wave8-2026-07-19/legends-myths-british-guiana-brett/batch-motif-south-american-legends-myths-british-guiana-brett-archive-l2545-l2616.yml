canonical_text:
  quote: "“But they first lived on high, / Above yonder blue sky, / Ere they came
    down the good things of this world to try.”"
  summary: The narrator introduces an effort to obtain Warau mythological traditions
    from McLeod, described as a learned Warau. McLeod answers a question about Warau
    origins by saying that, although enemies later caused the Waraus to flee, they
    first lived above the blue sky and came down to try the good things of the world,
    thereby losing their high station in heaven.
  language: English
  quote_policy: quoted
