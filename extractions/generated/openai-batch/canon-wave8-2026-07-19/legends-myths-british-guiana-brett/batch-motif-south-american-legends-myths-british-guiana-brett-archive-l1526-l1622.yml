canonical_text:
  quote: ''
  summary: 'The passage closes a feast of legend-telling, then gives an editorial
    note explaining that a chain of Arawak legends accounts for the peculiarities
    of Guiana animals. It summarizes the fragmentary tale of the Royal Vultures: an
    Arawak hunter captures a royal vulture who becomes his wife, carries him to her
    sky country, and is later separated from him by her family. Helpers rescue him
    from a prickly tree; birds later support his attempt to regain his wife; he is
    slain by his unknown son; the house of the royal vultures burns. The note then
    gives etiological episodes explaining features of the kiskedee, trumpeter bird,
    another grey bird, and owl, and comments that such legends are now fragmentary
    and locally variable.'
  language: English
  quote_policy: summarized
