canonical_text:
  quote: ''
  summary: Arawanili, chief of Kaieri, mourns by the sea because Yauhahu afflict the
    dead and living. Orehu, the Water-Mother, rises from the sea and instructs him
    to plant an ida branch, rear the tree, take its first fallen fruit, and return
    to the shore. He brings the calabash; Orehu supplies a feathered handle, shining
    white stones, tobacco, and charms that make the Yauhahu dread him.
  language: English
  quote_policy: summarized
