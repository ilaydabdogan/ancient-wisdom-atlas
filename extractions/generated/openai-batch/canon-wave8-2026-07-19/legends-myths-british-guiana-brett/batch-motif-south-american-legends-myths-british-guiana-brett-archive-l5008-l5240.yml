canonical_text:
  quote: ''
  summary: A verse retelling recounts Manarowa/Mandrowa, a Carib chief, attempting
    to reach and raid the Taruma by hauling canoes over dangerous falls; the Taruma
    evade him by sinking beneath the tide and hiding with their woodskins in underwater
    caverns. The narrative then describes his later dealings with British colonial
    authorities, a peace intervention, a cannon test of composure, gifts including
    a gold crescent, the decline of his slave-trading power, and his death after smallpox
    and rum consume his clan.
  language: English
  quote_policy: summarized
