  summary: The conclusion frames the collected legends as preserving the old beliefs
    of multiple Indigenous peoples before Christian mission influence. It names several
    groups, says their tales give glimpses of mythical heroes, presents the lore as
    offered in return for received Christian teaching, describes the places and circumstances
    in which the selection was made, and asks readers to respond kindly to the old
    tales.
