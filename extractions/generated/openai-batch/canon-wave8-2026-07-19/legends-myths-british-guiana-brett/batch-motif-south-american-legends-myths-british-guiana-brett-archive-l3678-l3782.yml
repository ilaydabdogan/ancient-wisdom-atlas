canonical_text:
  quote: ''
  summary: Abore prepares to flee by canoe with a young cousin; he traps Wowtih/Wowtah
    in a hollow tree using honey, warns his companion not to look back, and departs
    across the sea after showing the Waraus the proper form for vessels. The community
    later refuses to free Wowtah and says Abore’s lost knowledge included clothing
    made from woven fibers; Wowtah escapes as a frog and is later heard croaking in
    the swamps.
  language: English
  quote_policy: summarized
