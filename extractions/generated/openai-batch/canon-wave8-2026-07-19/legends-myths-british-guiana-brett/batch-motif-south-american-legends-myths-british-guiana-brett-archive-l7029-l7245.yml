canonical_text:
  quote: ''
  summary: 'The passage opens with a voyage and camp scene in Guiana, where Indian
    companions pray, make camp-fires, and tell legends at night. The narrator summarizes
    legends about animal-form sprites and living beings turned to stone. The main
    tale, “Bahmoo and the Frog,” explains a social separation: Bahmoo boasts that
    he can kill a huge frog without weapons, but the frog-chief, a spirit, tricks
    him, carries him across the water, and leaves him on the opposite shore. Bahmoo
    refuses to return because of shame and fear, and the old people say this explains
    why his children are separate.'
  language: English
  quote_policy: summarized
