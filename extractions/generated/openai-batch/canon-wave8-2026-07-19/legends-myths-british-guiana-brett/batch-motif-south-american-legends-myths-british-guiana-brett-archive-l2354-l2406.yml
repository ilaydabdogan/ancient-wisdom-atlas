canonical_text:
  quote: ''
  summary: The conclusion remembers Sacibarra, later called Cornelius, as an aged
    chief who told ancient legends of an unseen High Lord, came to hear Christian
    teaching, and helped establish a mission church. The narrator states that nearly
    all who gathered there and told these tales are now dead, recalls the abandoned
    riverside place, imagines the storytellers waiting on another shore, and transitions
    to Warau lore.
  language: English
