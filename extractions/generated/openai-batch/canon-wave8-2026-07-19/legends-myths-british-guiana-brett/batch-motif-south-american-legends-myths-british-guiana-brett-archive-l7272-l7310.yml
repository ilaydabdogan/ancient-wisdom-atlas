canonical_text:
  quote: "“My blood will take root, and avengers abound.”"
  summary: A father takes his son fishing and discovers that fish die wherever the
    boy swims. The fish plan revenge and kill the boy on a log with spines, especially
    the sting-ray’s wound. As he dies, the boy says his blood will root into strange
    plants that will avenge him. The passage identifies this as the origin of the
    Haiarri root, used in water to make fish prey.
