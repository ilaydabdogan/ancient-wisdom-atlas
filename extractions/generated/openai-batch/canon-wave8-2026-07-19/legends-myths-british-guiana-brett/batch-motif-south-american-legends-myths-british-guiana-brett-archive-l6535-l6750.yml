canonical_text:
  quote: ''
  summary: A verse passage describes Kanaima or Kandima as a deadly vow or spell binding
    a votary to leave family, pursue and kill a victim, poison the victim's mouth,
    and afterward pierce the grave and taste blood as an offering. It gives an anecdote
    of a murderer marked with feathered crown and red spots, and reports sorcerers'
    claims that such a killer can change into a jaguar. It then describes consequences
    when the required offering is not made. A following section on blood revenge introduces
    inherited vengeance and narrates Wahmoro's troubled reception of his poisoning,
    wife-taking brother, who threatens kinship boundaries and poisons old Orubu after
    being refused his young wife.
  language: English
  quote_policy: summarized
