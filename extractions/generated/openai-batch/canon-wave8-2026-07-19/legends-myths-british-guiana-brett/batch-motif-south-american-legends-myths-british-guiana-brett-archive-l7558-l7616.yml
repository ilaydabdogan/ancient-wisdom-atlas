canonical_text:
  quote: ''
  summary: A human-born man joins a mystic dance, courts an elfin Demaredu maiden,
    and accepts her father's challenge to share the family's home beneath earth or
    wave. Notes connect this union with the origin and marriage customs of the Demarena
    family and mention Ebesotu and the Ebesoana. A separate Korobohana legend says
    the family came from above the clouds by a rope; the rope broke under a heavy
    woman, stranding some above, whom the Great Spirit changed into Koriouka parrots.
    The narrator identifies this as another Guiana belief in descent from a higher
    region or state.
  language: English
  quote_policy: summarized
