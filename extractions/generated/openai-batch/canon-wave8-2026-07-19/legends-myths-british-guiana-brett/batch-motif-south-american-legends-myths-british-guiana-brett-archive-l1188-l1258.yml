canonical_text:
  quote: ''
  summary: 'The passage says Arawanili owed unusual power and gifts to the Orehu,
    who are still said to be seen in waters, while Arawanili rests high above. It
    compares this relationship to Numa and Egeria: as Egeria taught Roman sacred rites,
    the sea-spirit taught Arawanili through love. An old man then describes sorcerers
    receiving that word, former beliefs in a creator too high to hear human calls,
    the need to propitiate or fight sickness-causing demons, and Christian teaching
    that God hears the poor and weak so people need not seek demons.'
  language: English
  quote_policy: summarized
