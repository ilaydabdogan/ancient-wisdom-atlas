canonical_text:
  quote: ''
  summary: A verse retelling says that old men, beneath a sacred Ceiba tree, told
    how the Mighty One stood before a lifeless world, caused the vast Komaka tree
    to grow as his seat, and scattered its twigs and bark into air, land, and water,
    after which fishes, birds, beasts, reptiles, and humans appeared. Early humans
    ate wild fruit and drank water, with no hunting or killing. Wadili later arrived,
    took maidens as wives, and taught hunting, fishing, and husbandry.
  language: English
