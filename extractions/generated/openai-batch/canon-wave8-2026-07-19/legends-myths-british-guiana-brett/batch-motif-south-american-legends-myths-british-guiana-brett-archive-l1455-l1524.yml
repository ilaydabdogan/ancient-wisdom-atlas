canonical_text:
  quote: Adaili is the glorious sun
  summary: The passage recounts a legend in which Adaili, the sun, is called Arawidi
    when on earth in human form. Arawidi makes a fishing dam in a stream; otters break
    it, and he appoints the woodpecker as watchman. Hearing tapping from the sky,
    he descends, finds an alligator, seizes and beats it with a club. The alligator
    begs for life and promises a maiden bride, supplied by water-sprites. The legend
    closes by explaining the visible marks on the alligator's head and tail as traces
    of Arawidi's blows.
  language: English
  quote_policy: quoted
