canonical_text:
  quote: ''
  summary: Okonorote, a feather-ornamented archer, goes out to hunt a rare bird for
    its flesh and plumage. In an upper-sky setting where the young Warau race has
    been placed by the Maker, he searches many days, shoots the bird, then discovers
    that both bird and arrow have vanished. He finds a steep deep pit and, transfixed,
    sees daylight and a lower landscape of forests, plains, savannahs, and flowing
    rivulets.
  language: English
