canonical_text:
  quote: ''
  summary: A verse retelling describes Carib raiders coming yearly from the Essequibo
    to Bowruma, the local Arawak/Lokono people appointing a war chief, preparing a
    fortified trap with a central house, cut-tree barricade, canoes, arrows, and bucklers,
    and defeating the Caribs after luring them into battle. The passage also comments
    on Carib raiding reputation, their war cry/name, and their threats to seize lives,
    daughters, and goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caribs are said to come from the Essequibo banks to Bowruma in a recurring
    yearly season and to harry the people living there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The local fathers appoint a war chief whom all should obey so that he can
    find a way to rid them of the scourge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The war chief chooses a forest place, has the ground cleared, arranges cut
    trees in a circle with branches turned outward, and places a strong house in the
    middle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leader orders men to prepare weapons, gather many arrows, and make bucklers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The defenders gather at the prepared house, leave canoes at the river for
