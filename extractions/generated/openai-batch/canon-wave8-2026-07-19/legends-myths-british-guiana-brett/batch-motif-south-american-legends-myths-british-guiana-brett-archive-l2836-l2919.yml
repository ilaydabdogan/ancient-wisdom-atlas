canonical_text:
  quote: ''
  summary: The passage describes the Warau race beginning life in a new world below
    after having come from on high. They have hunted food but face dangerous animals
    and, especially, scarce and unclean water. In fear of thirst, they call on their
    Maker, addressed as Father and Master, acknowledging that they have forsaken his
    heavenly place. Kanonatu, the Maker, hears from on high, sends rain, and makes
    rivers that bring water, fish, and abundance.
  language: English
  quote_policy: summarized
