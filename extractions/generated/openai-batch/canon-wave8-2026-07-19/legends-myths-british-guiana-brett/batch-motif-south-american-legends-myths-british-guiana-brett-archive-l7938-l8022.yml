canonical_text:
  quote: ''
  summary: 'The passage comments on a legend of Amazons: some Indians say male infants
    were destroyed and fathers warned away, while girls were reared as successors
    and the tale of Walyarima continued near Parima. The narrator proposes that warfare
    may have left women to organize mutual defense with bows, producing accounts of
    fights with Amazons, while noting that this does not explain alleged husband-murder
    or rejection of marital authority. A second legend, “The Kanaima Father,” tells
    of Old Tounawai appearing as a Kanaima tiger or jaguar, attacking his hunting
    son, being wounded by the son’s bone-tipped arrow, and later being identified
    when a bone from his mouth fits the son’s broken arrowhead. The son accuses his
    father of using the Kanaima charm to kill him in order to gain the son’s wife.'
  language: English
  quote_policy: summarized
