  quote: ''
  summary: The passage describes the Orinoco delta as a flooded, lagoon-filled landscape
    with abundant ita palms. It says the Warau live in dwellings above rising floodwaters,
    use the ita palm for food and building materials, subsist chiefly on fish and
    crabs, and were formerly driven from higher land by enemies. It also notes Warau
    provision grounds, distribution from the Orinoco toward Moruca and Surinam, and
    a missionary encounter at Waramuri described in colonial and derogatory terms.
  language: English
