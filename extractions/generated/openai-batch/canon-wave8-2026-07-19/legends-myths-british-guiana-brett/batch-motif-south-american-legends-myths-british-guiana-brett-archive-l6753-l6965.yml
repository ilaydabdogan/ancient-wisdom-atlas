canonical_text:
  quote: ''
  summary: A dying old man commands Wahmoro and a chieftain's son to avenge him with
    weapons. The murderer is slain after threatening that he too will have avengers,
    and his sons die defending him. Neighbours urge the chief to kill the remaining
    children, but he refuses and sends their mothers away to rear them elsewhere.
    Later, an impostor claiming to show the Lord draws Wahmoro's family and their
    tribe. After disappointment, they seek instruction near Bowruma's giant tree;
    Christian teaching and printed materials spread among several tribes. Descendants
    of the slain appear among the inquirers, while sorcerers urge revenge against
    those spreading Christ's words. One descendant of Wahmoro is stalked and attacked
    by a Kanaima/Kandima figure with club and knife; carrying an empty gun, he survives
    by striking the attacker with the gun-stock and flees. The passage ends by noting
    fear of Kanaima and Christian counsel for the oppressed.
  language: English
  quote_policy: summarized
