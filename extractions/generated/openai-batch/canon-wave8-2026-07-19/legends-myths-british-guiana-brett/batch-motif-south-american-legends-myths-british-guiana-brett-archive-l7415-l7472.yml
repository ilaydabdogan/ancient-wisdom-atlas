canonical_text:
  quote: ''
  summary: 'The passage presents a brief catalogue of stories told at night: hunters
    and listeners hear tales of animals and bold men, including a cayman crossing,
    jaguar bravery, and snake-catching. A note identifies the jaguar-slayer and snake-catcher
    as recent non-mythical converts. The passage then summarizes legends of mermen
    or mermaidens who draw or snatch humans beneath the water, and a comic Peaima
    episode in which a man strips Peaima''s hair, plants pepper seeds on his bare
    head, flees, and later outwits the pursuing monster by deceitful speech.'
  language: English
  quote_policy: summarized
