canonical_text:
  quote: ''
  summary: The passage gives a satirical verse account of two white men attempting
    to learn the methods of a piai-man by feigning illness. The piai-man performs
    a ritual cure using a rattle, sacred fire, sacred weed, incantations, tobacco
    smoke, rubbing, and sucking at the body, then bites the patient and is paid. The
    narrator then generalizes about piai-man treatment and apprenticeship. A following
    fragment describes drink preparation, feathered dancing, sorcerers chanting ancient
    lore, and a note on an Arawak Maquarri funeral game involving reciprocal whipping.
  language: English
  quote_policy: summarized
