canonical_text:
  quote: ''
  summary: The passage opens with an evening river scene in which Indigenous children
    swim and play while birds and animals are observed in the forest. A canoe arrives
    carrying Arawak men, their wives, children, gear, and two aged parents. The aged
    patriarch, a clan chief and former ritual specialist called Maraka-kore or Red-rattle,
    brings a palm-wrapped maraka rattle. He says he now turns away from evil spirits
    after hearing Christian teaching from Cornelius, and he and his wife wish to be
    baptized before death. The narrator then asks him about traditions concerning
    the first sorcerer and the use of the rattle; the old man is about to tell the
    tradition.
  language: English
  quote_policy: summarized
