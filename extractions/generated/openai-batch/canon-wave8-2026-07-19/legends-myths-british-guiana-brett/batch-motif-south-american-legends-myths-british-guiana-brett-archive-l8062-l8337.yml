canonical_text:
  quote: ''
  summary: 'The passage first describes Oroan, a demon of darkness, attacking the
    sun and moon and being driven off after human cries and prayers bring spirits
    of the air. It then introduces native constellation narratives and begins the
    legend of Serikoai: Wawaiya, wife of Serikoai, is seduced by Wailya, a tapir who
    claims another manly form and a distant sky-edge country. Wailya charms her axe;
    she wounds Serikoai, flees with Wailya, and Serikoai is revived and aided by a
    spirit, a bird made from his eyelash and tear, and his mother.'
  language: English
  quote_policy: summarized
