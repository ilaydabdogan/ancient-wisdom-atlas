canonical_text:
  quote: ''
  summary: 'The passage recounts animal mishaps and transformations during the end
    of a primitive state: a howling monkey fears rising waters, a trumpeter bird is
    injured by ants, a marudi pecks a coal, and an alligator loses its tongue after
    being accused of taking fire. The animals then rebel against their guardian and
    become wild. Later, hostile men pursue the good man, who shares bread with them
    but finally ascends a high cliff with a faithful few and leaves the evil men below.'
  language: English
  quote_policy: summarized
