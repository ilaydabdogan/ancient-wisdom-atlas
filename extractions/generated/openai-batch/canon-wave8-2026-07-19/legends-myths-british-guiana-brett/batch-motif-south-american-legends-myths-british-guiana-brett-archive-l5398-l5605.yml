canonical_text:
  quote: ''
  summary: The passage recounts a primordial time in which the Creator makes animals,
    gives them laws and common speech, and places the first man, called Makonaima’s
    son, over them. Makonaima makes a cloud-capped tree bearing many fruits. Ahkoo
    finds the tree, the first man brings it down, and the animals help plant around
    it. Iwarreka the brown monkey misbehaves, is sent away to fetch water, and later
    lifts a basket that the first man had placed over a hollow stump to restrain waters
    found inside the felled tree. A flood bursts out with fish, the animals flee to
    a hill, trees, and a cave, and the first man waits until the waters subside, testing
    the water level by dropping cocorite seeds.
  language: English
  quote_policy: summarized
