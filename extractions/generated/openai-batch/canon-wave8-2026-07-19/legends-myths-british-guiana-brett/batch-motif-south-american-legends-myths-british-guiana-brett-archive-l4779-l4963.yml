canonical_text:
  quote: ''
  summary: 'The passage first recounts an attempted ascent of a cocorite palm whose
    top reached heaven; a poor woman becomes stone midway, others who try to pass
    become rocks, and survivors escape by climbing the komoo. A frame scene then imagines
    youths asking about ancient rock figures near the Orinoco, and an old western
    sorcerer explaining them through a Tamanac mythic figure. The Legend of Amalivaca
    follows: as flood waters subside, Amalivaca arrives in a large canoe, carves high
    rock sculptures from the water level, teaches humans carving, reshapes rugged
    post-flood land with his brother, advises people to settle by streams and use
    canoes, and unsuccessfully tries to change the Orinoco’s current and tides; the
    river resists and warns of submersion.'
  language: English
  quote_policy: summarized
