  quote: ''
  summary: The passage describes Moravians and then English bringing the Christian
    message, called the Saviour's word or word of peace, to Indigenous communities
    in Berbice and Essequibo. Some oppose it while a few accept and spread it. The
    speakers carry words of peace to former foes, the Caribisce, and then carry the
    red cross by sea to the Waraus, hoping that all Indigenous people become Christians
    and that peace abounds.
