canonical_text:
  quote: ''
  summary: A powerful sorcerer gives his love-sick daughter a magic skin so she can
    appear as the dog of a young hunter she loves. While the hunter is away, she returns
    to his cottage, cleans it, bakes cassava bread, and tends the fire. The hunter
    investigates, sees her through the thatch wall, finds the charmed skin, burns
    it, and says he will follow her to her father to claim her as his bride. The passage
    also contains an inserted note about an Araidai and Pahndun that appears separate
    from the main narrative.
  language: English
  quote_policy: summarized
