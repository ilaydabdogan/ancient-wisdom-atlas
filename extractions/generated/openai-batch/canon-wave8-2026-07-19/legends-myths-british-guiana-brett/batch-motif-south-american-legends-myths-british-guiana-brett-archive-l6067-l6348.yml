canonical_text:
  quote: ''
  summary: 'The passage first closes a war episode: warriors report deaths without
    survivable wounds, find blackened ruins, new graves, and Carib dead, and conclude
    that the Caribs burned the house and fled. It then begins a civil-strife narrative:
    an aged Puruni host called Kod/Koe receives a Masaruni chief as guest, the guest
    dies, and the guest''s elder son Ekahruwa accuses Koe of killing him by poison,
    charm, dreams, and secret arts. Ekahruwa leads Masaruni men in a raid, kills neighbours
    when Koe is absent, takes maidens and plunder, is pursued by Puruni men who rescue
    the maidens, and later returns with a larger force. Chiefs attempt mediation,
    while Koe''s family offers single combat in his defence.'
  language: English
  quote_policy: summarized
