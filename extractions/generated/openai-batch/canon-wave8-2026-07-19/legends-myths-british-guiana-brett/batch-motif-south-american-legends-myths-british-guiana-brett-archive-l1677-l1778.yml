canonical_text:
  quote: ''
  summary: The passage describes the discovery and excavation of the Waramuri shell
    mound, including shells, animal bones, artifacts, and split human bones interpreted
    as evidence of cannibal habits. It then recounts a Christian evensong procession
    at the opened mound, the display of Lamb and Dove emblems on school banners, the
    filling of the cutting, and a later attempt to photograph an elder wearing a toucan-feather
    crown before the narrator hears war legends from elders and leaders.
  language: English
  quote_policy: summarized
