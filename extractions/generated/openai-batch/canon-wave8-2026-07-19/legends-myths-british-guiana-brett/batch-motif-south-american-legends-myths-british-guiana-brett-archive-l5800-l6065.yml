canonical_text:
  quote: ''
  summary: A verse retelling recounts an Acawoio ancestral war with the Caribs. The
    ancestors formerly lived near the Masaruni and were forced to flee by Carib pressure.
    After a first Carib inroad, the Acawoios fortify a house and build a concealed
    underground passage to a ravine. At Cuyuni they ambush Carib boats and kill many
    attackers. Later, during a siege of the fortified house, the chief sends women
    through the tunnel, defenders kill many attackers with poisoned arrows, and the
    Caribs burn the house with flaming arrows. The defenders escape through the floor
    to the Puruni shore; the Caribs find no bodies and call the escape sorcery.
  language: English
  quote_policy: summarized
