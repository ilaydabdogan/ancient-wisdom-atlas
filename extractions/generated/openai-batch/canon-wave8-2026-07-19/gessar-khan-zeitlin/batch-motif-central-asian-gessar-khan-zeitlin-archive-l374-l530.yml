canonical_text:
  quote: "“Go now to prepare thyself for mortal birth, Tagus, Kormuzda’s child...”"
  summary: In the heavenly court, Tagus is chosen and equipped to descend to mortal
    birth as the future Gessar Khan. In Tibet, Chotong betrays his brother Sanglun,
    seizes wealth, contests Amurtsheela, and banishes Sanglun and Amurtsheela to the
    meeting place of three rivers, where a voice prophesies Amurtsheela will bear
    three daughters and a son destined for great deeds.
