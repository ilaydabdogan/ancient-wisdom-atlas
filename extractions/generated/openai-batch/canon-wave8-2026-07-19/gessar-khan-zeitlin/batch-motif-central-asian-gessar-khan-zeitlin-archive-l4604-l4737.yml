canonical_text:
  quote: ''
  summary: Lady Rogmo, traveling among her captors toward the Shiraigol Khans, writes
    a blood message on Gessar's golden arrow and sends it to him. Gessar remains in
    the giant's castle with Lady Aralgo while his brown wonder-steed is imprisoned
    in a dungeon. A crone and a rook reveal that nine years have passed, that a charm
    holds him, and that he has abandoned Rogmo, Shikeer, his heroes, and his people.
    The enchanted arrow reaches Gessar and reports Rogmo's captivity, Shikeer's disappearance,
    the slaughter of the thirty heroes through Chotong's treachery, and Rogmo's plea
    for deliverance. Gessar awakens from his darkness; his lament rouses the wonder-steed,
    which breaks its bonds, rebukes him, and flees. Gessar calls on his sisters from
    Sumeru, is told to pursue the offended steed on another mount, takes the giant's
    copper-green mule, and demands his arms from Aralgo so he may depart.
  language: English
  quote_policy: summarized
