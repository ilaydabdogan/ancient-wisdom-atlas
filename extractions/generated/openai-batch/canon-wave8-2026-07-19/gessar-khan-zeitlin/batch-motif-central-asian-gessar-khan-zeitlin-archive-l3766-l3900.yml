canonical_text:
  quote: ''
  summary: A buzzard reports that the Shiraigol hosts have harried the birds near
    the Chatun Stream. Shumar fears the enemy's vast numbers, but Nantsong answers
    boldly. Shikeer divides the Tibetan forces into three attacks against Tsagan Khan,
    Sheera Khan, and Chara Khan, assigning different body-part trophies and a return
    to the Mountain of Sand. The heroes charge, defeat great numbers of enemies, and
    capture horses. Shumar is pursued by Mergen of the Six Thumbs, demonstrates extraordinary
    archery by killing three eagles beyond a mountain with a returning arrow, and
    compels an exchange for Mergen's anvil-bound stallion. Nantsong then defeats Chara
    Khan's forces and returns with captured steeds.
  language: English
  quote_policy: summarized
