canonical_text:
  quote: ''
  summary: Gessar and Lady Rogmo return into Tibet in disguise. A herdsman reports
    that Chotong occupies Gessar's dwelling and throne. Gessar produces a rich encampment,
    prompting Chotong to send Sanglun to demand tribute. Sanglun and his aged speaking
    steed arrive; Rogmo provides miraculous fodder and hospitality while Gessar listens
    unseen. Sanglun recognizes Gessar's blade and horn bowl and mourns, believing
    Gessar dead.
  language: English
