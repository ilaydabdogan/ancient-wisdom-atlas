canonical_text:
  quote: ''
  summary: Gessar approaches Shiraigol, sends an enchanted arrow to destroy three
    superhuman border sentinels, disguises himself as an aged lama near the Khans’
    castle, is recognized by Lady Rogmo, sends her away on the arrow to the Chatun
    Stream, and releases a golden spider to warn the Shiraigol Khans that vengeance
    is coming.
