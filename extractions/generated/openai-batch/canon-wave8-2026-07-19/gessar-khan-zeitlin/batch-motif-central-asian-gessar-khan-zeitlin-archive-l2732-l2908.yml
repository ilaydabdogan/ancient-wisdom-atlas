canonical_text:
  quote: ''
  summary: Gessar travels toward the realm of the twelve-headed giant who has stolen
    Lady Aralgo. He climbs a mountain and calls to his three sisters, who appear as
    a cuckoo and advise him that he must first slay the Wild Bull of the Forest. After
    a dark night, the bull despoils Gessar’s wonder-steed and arrows. The sisters
    rebuke Gessar’s lament, restore the arrows, and instruct him how to restore the
    steed. Gessar and the steed pursue the bull; Gessar shoots the mark on the bull’s
    brow and kills it.
  language: English
