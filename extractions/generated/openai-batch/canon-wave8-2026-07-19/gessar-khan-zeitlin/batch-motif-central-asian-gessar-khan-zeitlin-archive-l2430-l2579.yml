  evidence_refs:
  - ev:1
- id: obs:2
  text: At midnight, the swineherds fill three wooden troughs with blood, thrice-distilled
    brandy, and sour milk, and set them before Aralgo’s portal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The swineherds repeatedly wake Aralgo with claims that the kine suckle their
    young, increasing the number from a hundred to a thousand to all the kine.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aralgo rushes out because she fears her people will lack milk; when she crosses
    the threshold, she overturns the troughs and their fumes are carried by an unfriendly
    wind into Tibet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Tibet are struck with disease and pestilence, and Gessar Khan
    is described as the most grievously afflicted.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rogmo asks the Tibetan soothsayers to identify the source of the scourge;
