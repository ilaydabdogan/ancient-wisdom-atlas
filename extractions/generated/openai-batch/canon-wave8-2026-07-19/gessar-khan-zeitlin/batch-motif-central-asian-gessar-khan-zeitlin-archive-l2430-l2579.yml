- id: obs:8
  text: Rogmo sends two couriers to tell Aralgo that the evil afflicting Gessar and
    the people proceeds from her and that she must depart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aralgo asks whether Gessar, Rogmo, or Chotong sent the order; when the couriers
    say Gessar did, she calls them liars and says the sorrows sown for her will be
    reaped by the senders.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Aralgo leaves the Valley of Pleasant Winds alone and unbefriended and wanders
