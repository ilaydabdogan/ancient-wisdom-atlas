canonical_text:
  quote: ''
  summary: Chotong deceives swineherds into staging a midnight disturbance at Aralgo’s
    dwelling with troughs of blood, brandy, and sour milk. Aralgo overturns the troughs,
    and fumes are carried to Tibet, causing disease that especially afflicts Gessar
    Khan. Rogmo consults soothsayers, who identify a curse connected with Aralgo and
    say healing requires her expulsion. Couriers order Aralgo to leave; she denies
    that Gessar commanded it and departs alone. She wanders through white, blue, and
    rainbow-colored lands, guided by a white hare, blue wolf, and magpie to a dark
    sea. After burning and icy winds assault her, she prays, the darkness lifts, and
    she encounters a twelve-headed giant, whom she addresses with calculated flattery.
  language: English
  quote_policy: summarized
