    Winds, where Aralgo dwells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The soothsayers say Gessar and the people will not be healed until Aralgo
    is driven out, because a bitter curse has been laid upon her and their magic cannot
    destroy it.
  category: speech
  evidence_refs:
