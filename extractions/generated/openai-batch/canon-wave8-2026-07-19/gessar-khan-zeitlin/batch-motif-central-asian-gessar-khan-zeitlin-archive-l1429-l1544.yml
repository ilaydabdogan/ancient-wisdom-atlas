canonical_text:
  quote: ''
  summary: Chotong is exposed when the magic tail he presents lacks three strands
    that Yoro had withheld. A messenger reports seeing the Garuda Bird in a tall pine.
    Sengeslu Khan’s soothsayer declares that heaven bids him give his daughter to
    the man who can pluck golden plumage from the magic bird’s tail by the will of
    the high gods. The assembled heroes fail with arrows, while Yoro flatters the
    Garuda Bird, draws her near, and plucks two golden feathers. He binds the plumes
    into Lady Rogmo’s headdress. A darkened sky, fiery divine arrows, thunderous dragon-steeds,
    and waters of life follow, with a cry that the gods have triumphed and evil is
    routed. When the storm clears, Yoro is revealed as Gessar Khan, son of heaven,
    sent by Buddha to rule and uproot evil.
  language: English
  quote_policy: summarized
