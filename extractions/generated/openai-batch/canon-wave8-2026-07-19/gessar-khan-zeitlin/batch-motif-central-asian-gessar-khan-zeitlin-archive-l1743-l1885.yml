canonical_text:
  quote: ''
  summary: 'A smith tells Gessar that the wife of China''s ruler has died and that
    the ruler''s excessive mourning has disordered the realm. Gessar rebukes the smith
    and demands three rare treasures before he will help: eagle blood in a stag''s
    horn, milk from the eagle''s mate in a goat''s horn, and tears from the eagle''s
    fledgling in a sheep''s horn. After failing for two days, the smith receives dream-guidance
    to the mouth of the river Nyrandsa, traps a black eagle at a cow carcass, collects
    blood from its beak, and secures the mate''s milk and fledgling''s tears as ransom
    for the eagle''s release. He returns to Gessar.'
  language: English
  quote_policy: summarized
