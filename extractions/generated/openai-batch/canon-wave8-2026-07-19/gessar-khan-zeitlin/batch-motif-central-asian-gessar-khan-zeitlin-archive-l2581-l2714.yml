canonical_text:
  quote: ''
  summary: Aralgo tells the twelve-headed giant she has come to serve him after losing
    Gessar Khan's favor. The giant declares he will make her his wife, carries her
    to his mountain castle, destroys most of his existing wives, and seats Aralgo
    beside him. Gessar, restored from illness after Tibet is freed of disease, learns
    Aralgo has left the Valley of Pleasant Winds and may dwell with the giant. He
    resolves to determine whether she went freely or was taken by force, rejects warnings
    not to go, instructs his followers, arms himself, mounts his wonder-steed, and
    receives provisions and stern exhortation from Rogmo.
  language: English
  quote_policy: summarized
