canonical_text:
  quote: ''
  summary: Aralgo reproaches Gessar for killing her husband, the twelve-headed giant.
    Gessar destroys the giant's castle by a mighty cry and fire, spares Aralgo, recovers
    armor and weapons, and leaves the peak. He finds his brown wonder-steed, who recounts
    Lady Rogmo's kindness and Aralgo's imprisonment of him for nine years. Gessar
    avenges the steed by giving Aralgo leather and mire as false food and drink, then
    banishes her to the Lonely Desert. Continuing through the wilderness, he encounters
    a human-headed hawk-bodied creature who identifies himself as Shikeer, Gessar's
    decapitated brother. Gessar proposes sacrifice to Kormuzda, his father, to restore
    Shikeer, but Shikeer says his spirit cannot rest until his vanquisher and kin
    are destroyed. Gessar rides on to avenge him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aralgo addresses Gessar from a casement, calls him a beggar from Tibet, and
    says he slew her husband, the twelve-headed giant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gessar answers with a cry that rocks the earth; the giant's castle spins eighty-eight
    times and bursts into flame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aralgo throws down the helmet, armor, and spear; Gessar commands the flames
    to let her come out unscathed, and the castle is consumed to ashes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gessar dons the armor, mounts the copper-green mule, seats Aralgo behind him,
    and descends the lofty peak past ridges formerly guarded by giants, men, and sons
    of gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After traveling a night, a day, and an hour, Gessar finds a herd of chigitai
    with the brown wonder-steed crouched among them, trying to hide.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brown wonder-steed speaks to Gessar and recounts Lady Rogmo's care, separation
    from Rogmo, Shikeer, the thirty heroes, and comrades, and Aralgo's imprisonment
    of him in iron gyves for nine years.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gessar accepts the wonder-steed's anger as just, says the wrongs shall be
    avenged, mounts him, and turns north toward the Shiraigol realm while Aralgo follows
    on the mule.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Aralgo complains of hunger and thirst, Gessar offers a leather stirrup
    as food and mire from a dry streambed as water, and she spits both out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gessar states that Aralgo's treatment is requital for the wonder-steed's wrongs
    and for a draught of forgetfulness by which she enslaved the son of heaven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Aralgo is transported to the Lonely Desert, where she wanders until her years
    are spent, while Gessar continues toward the Shiraigol Khans.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the wilderness, a voice twice calls for Gessar to stay; he sees a creature
    with a man's head and a hawk's body and tail descend and alight on his saddle-bow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The creature identifies himself as Shikeer, Gessar's brother, and says he
    has awaited Gessar since his head was struck from his body at the Chatun Stream.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Gessar embraces Shikeer, and their weeping shakes the earth; mountains and
