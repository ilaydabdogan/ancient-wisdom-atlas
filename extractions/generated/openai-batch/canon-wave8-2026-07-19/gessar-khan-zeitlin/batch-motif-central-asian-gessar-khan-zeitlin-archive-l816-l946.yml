canonical_text:
  quote: ''
  summary: Yoro travels with his mother Amurtsheela to the country of seven alwins,
    makes seven magic wands from a sapling, and lures the alwins with an inexhaustible
    feast. The wands carry the alwins across sky, mountains, and sea, then throw them
    into the ocean depths and the dungeons of dragon-princes. Yoro returns with Amurtsheela
    and the alwins’ steeds to Chotong’s betrothal feast, where they are denied hospitality.
    Chotong refuses Yoro meat and sends a deadly wasp against him; Yoro captures the
    wasp, which contains Chotong’s soul. Altantu has Lady Kimsun plead for Chotong’s
    life, but Yoro rebukes her unveiled appearance and turns away.
  language: English
  quote_policy: summarized
