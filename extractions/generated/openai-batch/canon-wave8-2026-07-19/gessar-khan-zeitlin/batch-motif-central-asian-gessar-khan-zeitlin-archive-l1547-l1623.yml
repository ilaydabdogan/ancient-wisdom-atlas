  summary: Gessar Khan recounts earlier feats against alwins, Chotong, Lady Rogmo’s
    forces, the Wild Boar, and the Garuda Bird as signs that he was marked by the
    gods. He then commands all ranks of people to bow, declaring himself Kormuzda’s
    son, Buddha’s servant, judge, warrior leader, and healer. The people bow in awe,
    and Lady Rogmo reacts with joyful laughter and tears. The end of the supplied
    range contains apparent illustration/OCR fragments and a following chapter heading.
