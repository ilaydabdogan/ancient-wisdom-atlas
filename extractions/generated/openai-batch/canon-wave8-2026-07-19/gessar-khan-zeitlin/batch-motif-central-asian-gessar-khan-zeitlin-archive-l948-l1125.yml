canonical_text:
  quote: ''
  summary: The passage first shows Altantu cursing those who deny Yoro aid, after
    which Yoro releases a wasp and compels Chotong to beg Amurtsheela's pardon. The
    narrative then turns to Lady Rogmo, who travels to Tibet to choose a husband among
    heroes. She recounts wondrous birth signs and requires suitors to surpass her
    warriors and archers. Yoro enters despite warnings, is aided by his blessed sisters,
    defeats the warriors, and wins the archery contest with a dart held on Sumeru
    and returned with birds that darken the sun. The tribesmen hail him as defender
    of Tibet's valor.
  language: English
  quote_policy: summarized
