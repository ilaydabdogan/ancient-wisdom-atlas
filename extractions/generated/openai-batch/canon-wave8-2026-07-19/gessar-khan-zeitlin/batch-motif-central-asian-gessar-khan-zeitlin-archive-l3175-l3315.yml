canonical_text:
  quote: ''
  summary: 'Gessar hides beneath a jewel-covered pit in a giant''s castle while Aralgo
    draws out the giant''s account of his layered protections: two sisters, a beetle
    that is his soul, two fish that leave his nostrils while he sleeps, and his twelve
    heads. After the giant departs, Aralgo releases Gessar. The brown wonder-steed
    descends from heaven and carries Gessar east to the Tree of Delight, where he
    tricks the giant''s younger sister into descending, strangles her with bowstrings,
    and burns her reptile-transformed body together with the tree.'
  language: English
  quote_policy: summarized
