  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The giant says Gessar cannot slay him until Gessar has slain the giant's younger
    sister in the Tree of Delight, slain the elder sister in the western kingdom,
    obtained and destroyed the beetle that is the giant's soul, killed the golden
    and silver fish that emerge from his nostrils while he sleeps, and severed his
    twelve heads.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the giant sleeps and later leaves to hunt, Aralgo touches the jewel
