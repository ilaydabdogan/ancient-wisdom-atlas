canonical_text:
  quote: ''
  summary: Nantsong cuts shining queues from fallen enemies and fastens them to his
    horse. Teergen confronts him, proposes an archery wager, but treacherously shoots
    Nantsong. Nantsong binds his wound, shoots Teergen so that he can return to report
    his defeat before dying, and then rides wounded toward the Mountain of Sand. His
    dappled steed supports him, guards his fallen body from wolves and ravens, bargains
    with ravens to carry news to Shikeer, and later kills the wolves when Shikeer
    and Kinggen the Healer arrive.
  language: English
  quote_policy: summarized
