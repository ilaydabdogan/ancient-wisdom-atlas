  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods answer Gessar’s prayer with lightning, thunder, and a hailstorm;
    the giant sentinels fall to the earth and their heads are crushed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gessar enters a dark forest where shimnus in the guise of beautiful maidens
    beckon and call to him, but he pays no attention to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a mist-shrouded peak where day and night are indistinguishable, Gessar
    casts his nets into the sky and catches the sun in a golden net and the moon in
    a silver net, using their light to ascend to the summit.
  category: action
  evidence_refs:
  - ev:5
