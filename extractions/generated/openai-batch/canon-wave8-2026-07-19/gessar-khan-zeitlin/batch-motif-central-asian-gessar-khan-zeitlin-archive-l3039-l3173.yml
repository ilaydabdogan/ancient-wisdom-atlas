canonical_text:
  quote: in his golden net he snared the sun, and the moon in his silver net
  summary: Gessar journeys through guarded ridges, prays for divine aid against giant
    sentinels, ignores deceptive maidens in a dark forest, uses golden and silver
    nets to catch the sun and moon for light, and has his wonder-steed carry him over
    the wall of a giant’s castle. The steed ascends by chain ladder to Sumeru. Inside
    the silver castle, Gessar reunites with Aralgo, learns she was wronged, and prepares
    to challenge the giant while Aralgo plans to draw out the giant’s secrets.
  language: English
  quote_policy: quoted
literal_observations:
