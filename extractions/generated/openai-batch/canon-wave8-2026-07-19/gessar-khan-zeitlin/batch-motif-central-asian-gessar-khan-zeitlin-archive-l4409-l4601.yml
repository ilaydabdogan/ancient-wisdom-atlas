canonical_text:
  quote: ''
  summary: Shikeer reports that the Shiraigol Khans have slain Gessar's thirty heroes
    and captured Lady Rogmo through Chotong's treachery. Sanglun offers to fight but
    is told to await Gessar. Shikeer rides to the Mountain of Sand, sees the vast
    retreating host and captive Rogmo, and is urged by her to seek Gessar, who can
    revive the slain heroes. Tsagan Khan taunts Shikeer into attacking. Shikeer kills
    many enemies, but his and Tsagan's related horses refuse to fight each other.
    Shikeer swoons after drinking blood-defiled stream water. Tsagan traps him under
    a felled pine and beheads him; Shikeer's life enters a hawk, which flies away.
  language: English
  quote_policy: summarized
