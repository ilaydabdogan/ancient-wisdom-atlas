canonical_text:
  quote: "“Gessar is not dead, but lives.”"
  summary: Gessar secretly reassures Sanglun that he lives and will return to avenge
    wrongs. Sanglun returns with a transformed speaking steed and a sheep carcass,
    denounces Chotong, and is beaten. Amurtsheela discovers Gessar by an identifying
    feature he cannot disguise. Gessar then confronts Chotong, casts off a merchant
    disguise, appears in heroic armor, and summons opposed clouds whose whirlwind
    removes Chotong’s yurta to the mountain ridge where Rogmo and Amurtsheela watch.
  language: English
  quote_policy: quoted
