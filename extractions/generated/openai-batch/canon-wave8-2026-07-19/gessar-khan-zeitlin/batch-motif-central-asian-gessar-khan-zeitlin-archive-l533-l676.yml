canonical_text:
  quote: "“And from beneath her arm a son was born...”"
  summary: Amurtsheela asks Sanglun to remain with her because of forebodings, but
    he leaves to hunt and pasture the animals. At nightfall she gives birth to three
    beautiful daughters who are carried upward to Sumeru by three richly adorned elephants
    descending amid drums, cymbals, incense, and clouds. She then gives birth from
    beneath her arm to a strange son who explains the meaning of his bodily signs
    and his mission against evil. Sanglun returns, accepts the child as possibly heaven-blessed,
    and names him Yoro. Yoro prospers as a herdsman, causes animals to multiply by
    striking them with plants and speaking fertility commands, is joined by Sanglun’s
    escaped sons Shikeer and Rongsa, and later slaughters nine wethers, prepares their
    flesh and bones, builds a fire, scatters incense, and invokes Kormuzda, dragon
    princes, and deities of Iswara.
  language: English
  quote_policy: quoted
