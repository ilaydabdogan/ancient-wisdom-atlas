canonical_text:
  quote: ''
  summary: The passage recounts Chotong stealing from the Shiraigol camp, being pursued
    and captured by Ulan of the Red Eyes, and bargaining for his life by offering
    the Shiraigol Khans a plan to deceive Shikeer and capture Lady Rogmo. Chotong
    returns with old steeds as false evidence of Shiraigol retreat; Shikeer accepts
    his report despite Lady Rogmo's warning. The hosts are disbanded, the heroes feast
    and sleep, and Arigon is killed while trying to warn of the advancing Shiraigol
    forces.
  language: English
  quote_policy: summarized
