canonical_text:
  quote: ''
  summary: Kormuzda receives a golden chalice containing blessed arshaan and entrusts
    it to three sisters, who descend to Gessar on the battlefield. Following Buddha's
    instructions, Gessar sprinkles the bones of his fallen heroes three times, restoring
    their bodies, breath, and life. The revived heroes honor Gessar and recount their
    deaths. Shikeer, appearing with a human head and hawk body, declines restoration
    to mortal form and ascends to the abode of the high gods, dwelling thereafter
    on Sumeru. Gessar holds a long feast and is finally shown enthroned, ruling with
    righteousness and peace.
  language: English
  quote_policy: summarized
