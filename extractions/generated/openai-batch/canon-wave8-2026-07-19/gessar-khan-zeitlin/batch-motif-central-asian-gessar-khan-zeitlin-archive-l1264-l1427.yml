canonical_text:
  quote: ''
  summary: 'A ruler decrees a horse race for Lady Rogmo’s hand. Yoro prays and sacrifices
    to Kormuzda, who sends his heavenly brown wonder-steed in the form of a stunted
    foal. Mocked by the others, Yoro rides the foal, overtakes the racers, topples
    Chotong’s blue-black steed, and reaches the goal first. A second test is proposed:
    the winner must slay the Wild Boar of the Wilderness and bring its thirteen-strand
    tail. Yoro kills the boar, but Chotong flatters him into handing over the tail.
    Yoro secretly keeps three strands. Chotong then claims the kill and Lady Rogmo;
    Yoro challenges him to show the complete thirteen-strand tail.'
  language: English
  quote_policy: summarized
