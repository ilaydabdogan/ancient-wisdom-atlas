canonical_text:
  quote: "“let one of thy three sons descend in mortal guise to rule the earth”"
  summary: The passage opens with contents headings, then narrates Kormuzda descending
    from Sumeru to worship Buddha. Buddha commands him to feast for five hundred years
    and then send one of his three sons to earth in mortal guise when evil arises
    among humans. Kormuzda forgets, a heavenly wall collapses, and he recognizes this
    as Buddha’s chastisement. A messenger asks Kormuzda’s sons Ameen, Weele, and Tagus
    to descend to earth; the first two refuse or deflect, while Tagus expresses willingness
    but hesitates out of respect for his brothers. Kormuzda summons the sons and rebukes
    them.
