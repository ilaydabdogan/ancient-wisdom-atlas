canonical_text:
  quote: I am Gessar Khan, the son of heaven, sent by Buddha to uproot the tenfold
    evil
  summary: Yoro performs a sacrifice that brings gods in mortal guise to his feast.
    Rongsa falsely reports that Yoro has wasted Sanglun's animals, but Yoro restores
    the slaughtered rams and disarms Sanglun. Amurtsheela defends Yoro, Sanglun punishes
    Rongsa, and the family returns to Nulumtala. Chotong challenges Yoro to go to
    the seven man-devouring alwins with his mother. Shikeer offers to accompany Yoro,
    and Yoro privately reveals that he is Gessar Khan, son of heaven, sent by Buddha,
    while instructing Shikeer to guard Sanglun.
  language: English
  quote_policy: quoted
