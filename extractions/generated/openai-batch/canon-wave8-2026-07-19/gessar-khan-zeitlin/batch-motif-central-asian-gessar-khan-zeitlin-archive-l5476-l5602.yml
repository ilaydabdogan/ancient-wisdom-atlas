canonical_text:
  quote: ''
  summary: Gessar discovers Chotong hidden in a sack, wounds him, accuses him of betraying
    kin and Gessar's wife, and is restrained from killing him by Sanglun's plea. Gessar
    orders his wonder-steed to swallow and release Chotong nine times, leaving him
    powerless. Gessar then laments over the bones of his thirty slain heroes. The
    wonder-steed advises him to seek help from his sisters on Sumeru. Gessar makes
    offerings, the sisters petition Kormuzda, and Kormuzda petitions Buddha, who gives
    blessed arshaan and instructs that three sprinklings will restore the heroes'
    bones, breath, and renewed life.
  language: English
  quote_policy: summarized
