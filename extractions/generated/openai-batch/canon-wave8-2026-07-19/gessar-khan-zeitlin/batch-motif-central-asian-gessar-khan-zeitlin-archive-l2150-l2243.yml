canonical_text:
  quote: ''
  summary: Gessar passes through the Valley of Pleasant Winds, pauses on a high mountain,
    and is reminded by his three sisters of his divine and royal obligations. He sends
    a dream to Lady Rogmo announcing his nearness. Rogmo and Arigon prepare a public
    welcome, summoning kin, heroes, and chieftains. Gessar arrives on his wonder-steed,
    is greeted with embraces, gifts, feasting, and music, and remains among his people
    to rule according to the law of Buddha.
  language: English
  quote_policy: summarized
