canonical_text:
  quote: ''
  summary: Keeme Khan's wife dies, and his grief leads him to impose universal mourning
    on his kingdom while holding her body. Ministers propose funerary rites, almsgiving,
    and remarriage, but cannot name anyone able to comfort him. A meddlesome bald
    smith overhears, declares that only Gessar Khan can heal Keeme Khan's grief, evades
    his wife's objections, petitions the council, and is sent with a steed and companion
    to Tibet. On arrival, Gessar already knows his errand and terrifies him with a
    baleful look before questioning him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Keeme Khan's wife sickens and dies; Keeme Khan holds her body, and the passage
    says her spirit has departed to Erleek Khan's dread kingdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Keeme Khan sends criers to command travelers, householders, feasters, and
    fasters to remain in mourning for the khanin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people resent Keeme Khan's edict, and his ministers gather in council.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief minister says the khanin's body should be burned, lamas should read
    Buddha's word for forty-nine days over her ashes, alms should be given, and Keeme
    Khan should take another wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ministers cannot name a person who can comfort Keeme Khan and restore
    his reason.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A baldheaded smith at Keeme Khan's court overhears the council from outside
    the council-chamber.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The smith tells his wife that only Gessar Khan, called all-healing, lord of
    the ten regions, and Buddha's messenger, can solace Keeme Khan.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The smith's wife reproaches him, calls him sinful and of little worth, and
    tells him to return to his forge and be silent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The smith feigns anger, orders his wife to fetch water from the stream, and
    returns to the council-chamber to seek an audience.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before the council, the smith names Gessar Khan as the one able to heal Keeme
    Khan; when asked who will fetch him, the smith agrees if he receives a steed and
    companion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ministers give the smith a swift steed and a companion, and he journeys
    many moons to the mountains of Tibet and Gessar Khan's shining yurta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Gessar knows the smith and his errand before the smith speaks; Gessar's baleful
    glance makes the smith quake and unable to move, bow, or sit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gessar addresses the smith as a blundering baldhead and asks where he is from
    and why he has come.
  category: speech
  evidence_refs:
  - ev:7
