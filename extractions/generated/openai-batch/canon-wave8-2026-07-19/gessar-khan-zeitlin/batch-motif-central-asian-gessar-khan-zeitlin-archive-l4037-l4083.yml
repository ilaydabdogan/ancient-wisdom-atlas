canonical_text:
  quote: ''
  summary: 'Nantsong is healed with herbs, remounts his dappled steed, and returns
    with companions to the Mountain of Sand. The warriors rejoice at his return and
    at the captured enemy trophies. Shumar the Eagle reports the approach of Lady
    Rogmo and Prince Chotong. Rogmo says she has come to join the warriors because
    Gessar''s chosen wife should not remain at home during the battle; Chotong claims
    he followed out of concern for her safety. Shikeer rebukes Chotong for cowardice
    and opportunism. Captured herds are allotted: nine to the gods in thanksgiving,
    nine to Lady Rogmo, shares to heroes, chieftains, warriors, and foot-soldiers,
    and a special stallion from Shumar to Shikeer; Chotong receives no steed. Night
    falls on the Mountain of Sand.'
  language: English
  quote_policy: summarized
