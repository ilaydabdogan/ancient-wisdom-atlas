canonical_text:
  quote: ''
  summary: The Shiraigol Khans debate and then pledge an expedition to Tibet to seize
    Lady Rogmo for Gereltu. Rogmo brings Shikeer the feathers of a strange vulture;
    Shikeer identifies the bird as the Shiraigol Khans in magical guise and connects
    it with a raven that reported her beauty. Shikeer rejects Chotong's proposal that
    Rogmo flee, summons the Tangut and Tibet forces, and advances with heroes and
    chieftains until he sees a cloud that proves to be a horde of wounded wild beasts.
  language: English
  quote_policy: summarized
