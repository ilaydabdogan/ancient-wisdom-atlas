canonical_text:
  quote: ''
  summary: After Yoro wins Rogmo by defeating her champions, Shikeer compels Rogmo
    to honor her pledge. Yoro seals a public troth with blood from his finger and
    a band woven from three horse-tail hairs. Rogmo flees by night toward her father’s
    realm, but Yoro secretly rides behind her, cloaked in darkness. Near Sengeslu
    Khan’s kingdom, Yoro raises a dust cloud that Sengeslu first reads as the approach
    of a great royal retinue, then as a lesser escort. On arrival, Sengeslu and his
    knights mock Yoro. Meanwhile Chotong discovers Rogmo and Yoro are gone, accuses
    Yoro of guile, rallies Tibetan nobles, and demands that Sengeslu surrender Rogmo,
    threatening him when he hesitates because Yoro had met the challenge.
  language: English
  quote_policy: summarized
