canonical_text:
  quote: ''
  summary: Gessar survives Keeme Khan’s attempts to kill him in the Den of Wild Beasts
    and at the ramparts. He uses a crimson parrot tied to an invisible silken thread
    to feign a message calling his Tibetan allies to avenge him. Keeme Khan and his
    people fear divine protection around Gessar and negotiate for the parrot’s recall.
    Gessar demands funerary rites for the khanin, Keeme Khan’s remarriage, and Aralgo
    as his second wife. He recalls the parrot, peace is restored, and after three
    years in China he departs with Aralgo toward his own country.
  language: English
  quote_policy: summarized
