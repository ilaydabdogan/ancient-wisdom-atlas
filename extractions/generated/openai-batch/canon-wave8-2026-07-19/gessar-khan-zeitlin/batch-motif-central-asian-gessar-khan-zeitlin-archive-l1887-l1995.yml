canonical_text:
  quote: ''
  summary: After the smith declares the quest complete and gives Gessar three horns,
    Gessar travels to China to aid Keeme Khan. He finds Keeme holding the body of
    his dead khanin and urges cremation, rites, charity, and remarriage. Keeme refuses.
    Gessar secretly removes the body and leaves an ape in its place while the sentinel
    is unable to cry out. Keeme condemns Gessar first to the Hole of Wasps and then
    to the Pit of Serpents, but Gessar kills the wasps with tears of the black fledgling
    and kills the serpents with milk of the black eagle’s mate. Keeme then orders
    him cast into the Den of Wild Beasts, where the passage breaks off as the beasts
    begin to attack.
  language: English
  quote_policy: summarized
literal_observations:
