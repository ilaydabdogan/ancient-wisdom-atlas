- id: obs:3
  text: Gessar, the smith, and the smith’s companion set out; the smith rides beside
    Gessar and the companion rides behind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In China, Gessar enters Keeme Khan’s palace and reaches a jeweled hall with
    marble columns, bronze casements set with crystals, silver and ivory ceiling,
    jeweled walls, and an emerald throne.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Keeme Khan sits on the emerald throne holding the body of his khanin in his
    arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gessar tells Keeme Khan that a house where the living consort with the dead
    is ill-omened and urges him to burn the khanin’s body, have lamas perform rites
    above her ashes, distribute bounty to the needy, and take another wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gessar says the khanin’s spirit has departed to the kingdom of Erleek Khan.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Keeme Khan refuses to put his wife from his arms, even after one or ten years.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ministers bow to Gessar and ask whether he has brought healing for their
    master; Gessar replies that Keeme Khan’s soul is sick unto death and none can
    heal him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At night, while Keeme Khan sleeps on his throne, Gessar secretly enters the
    hall, removes the khanin’s body from Keeme’s arms, and leaves an ape there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sentinel tries to cry an alarm, but his tongue cleaves to the roof of
    his mouth and no sound comes out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At dawn, Keeme Khan wakes with the ape dancing in his arms and first interprets
    this as divine punishment transforming his wife into an ape.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After his tongue is loosened, the sentinel tells Keeme Khan that Gessar took
