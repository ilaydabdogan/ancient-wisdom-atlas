- id: ev:3
  type: summary
  locator: 1898-1907
  quote_or_summary: In distant China, Gessar enters Keeme Khan’s palace and a richly
    decorated hall, where Keeme Khan sits on an emerald throne holding the body of
    his khanin.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:4
  type: summary
  locator: 1909-1917
  quote_or_summary: Gessar says the dwelling is ill-omened where the living consort
    with the dead; he tells Keeme Khan to give the khanin’s body to the flames, have
    lamas perform rites over the ashes, give bounty to the needy, and take another
    wife, saying her spirit has departed to the kingdom of Erleek Khan.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:5
  type: summary
  locator: 1919-1921
  quote_or_summary: Keeme Khan rejects Gessar’s counsel and says he will not put his
    wife from his arms, even after one or ten years.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:6
  type: summary
  locator: 1923-1929
  quote_or_summary: The ministers bow before Gessar and ask whether he has brought
    healing for their master; Gessar answers that the master’s soul is sick unto death
    and none can heal him.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:7
  type: summary
  locator: 1931-1936
  quote_or_summary: At night, while Keeme Khan sleeps on the throne, Gessar secretly
    removes the khanin’s body from his arms and leaves an ape there; the sentinel
    tries to cry out but cannot because his tongue cleaves to his mouth.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:8
  type: summary
  locator: 1938-1951
  quote_or_summary: At dawn Keeme Khan wakes to the dancing ape and thinks the gods
    have transformed his wife; once his tongue is loosed, the sentinel reports that
    Gessar took the body and left the ape, and explains that he could not cry out.
  source_text_path: texts/public-domain/mongol/project-gutenberg/gessar-khan-zeitlin.md
  rights_note: Public domain source; summarized for extraction.
- id: ev:9
  type: summary
  locator: 1953-1960
  quote_or_summary: Keeme Khan orders Gessar cast into the Hole of Wasps to have his
