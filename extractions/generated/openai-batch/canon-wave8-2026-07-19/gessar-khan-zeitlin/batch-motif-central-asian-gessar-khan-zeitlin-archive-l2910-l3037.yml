canonical_text:
  quote: ''
  summary: After killing the Wild Bull, Gessar is stopped by his sisters from eating
    before making sacrifice. He offers flesh to the gods, then proceeds alone through
    an enchanted river, crushing rock walls, and successive guarded ridges toward
    the twelve-headed giant’s mountain castle. Captive children of gods give him counsel
    and golden and silver nets to snare the sun and moon against the peak’s darkness.
  language: English
  quote_policy: summarized
