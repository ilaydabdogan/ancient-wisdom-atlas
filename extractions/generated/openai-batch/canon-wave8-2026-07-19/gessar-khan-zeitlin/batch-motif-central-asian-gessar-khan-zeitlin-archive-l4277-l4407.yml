canonical_text:
  quote: |-
    Thus was the Lady Rogmo taken captive by the three
    Khans of Shiraigol.
  summary: Enemy forces attack the sleeping heroes of Tibet. Gessar's heroes are slain
    after fighting on foot; Bodotshi the Fire-hero burns enemies by transforming to
    flame and then is consumed by his own fire. Lady Rogmo arms herself with a steel
    sabre and Gessar-enchanted golden arrows, kills chieftains and warriors, is surrounded,
    transforms into a wasp, is pursued by the three Shiraigol Khans in hawk forms,
    and is captured. She sends an eyebrow hair as a wind-borne message to Shikeer,
    reporting Chotong's betrayal, the heroes' deaths, and her captivity.
  language: English
  quote_policy: quoted
