canonical_text:
  quote: ''
  summary: The three Shiraigol Khans seek a bride for Prince Gereltu and send animal
    couriers to examine royal women. A raven returns from Tibet blinded by the sight
    of Lady Rogmo and urges the Khans to seize her while Gessar Khan is absent. The
    Khans transform together into a huge vulture and fly to Rogmo’s yurta. Rogmo summons
    the Tiger-hero, who falters before the bird and only wounds its wing. The vulture
    withdraws and the Khans resume their forms, with Sheera Khan wounded.
  language: English
  quote_policy: summarized
