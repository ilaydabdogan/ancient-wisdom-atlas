canonical_text:
  quote: ''
  summary: In the Valley of Pleasant Winds, Chotong twice attempts to persuade Aralgo
    to pledge herself to him by claiming Gessar has abandoned her. Aralgo rejects
    him and has her vassals and herdsmen beat and expel him. After recovering, Chotong
    seeks vengeance by going to the Cavern of Curses, where the Spirit of the Cavern
    eventually appears in a dream and gives him guidance. Chotong returns under the
    spirit’s protection, confronts the herdsmen, and then approaches the swineherds
    in the marshland, promising to exalt them if they obey him.
  language: English
  quote_policy: summarized
