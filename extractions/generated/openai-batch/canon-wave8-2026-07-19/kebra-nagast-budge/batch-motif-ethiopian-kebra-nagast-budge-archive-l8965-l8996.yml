  summary: The passage recounts the merchant’s wife becoming pregnant by Karmin, her
    intention to dispose of the child in a river and deny wrongdoing, a Solomonic
    proverb about hidden tracks and the adulterous woman, and a parallel account of
    the wife of Bala'on of Babylon giving birth to a wingless eagle-like offspring
    and secretly sending it in a wicker-basket to be cast into the river. The merchant’s
    wife then gives birth to a comely boy and calls a handmaiden.
