canonical_text:
  quote: ''
  summary: 'A royal speaker describes a plan for Solomon’s seed to rule in three kingdoms,
    to send priests and laws, and to make the young man king with the children of
    nobles sent to Ethiopia. The priests, officers, and councillors agree. The young
    man is crowned: instruments sound, he enters the Holy of Holies, holds the horns
    of the altar, receives sovereignty from Zadok and Joas/Benaiah, is anointed with
    royal oil, receives the name David, rides Solomon’s mule around the city, and
    is blessed. Zadok then instructs him to obey God and warns that disobedience will
    bring divine punishment and curses on city, field, offspring, livestock, land,
    sky, and rain.'
  language: English
  quote_policy: summarized
