  summary: The passage interprets Davidic sayings about the beloved, horns, and the
    unicorn as referring to kingdoms and an irresistible sovereign over kings. It
    then interprets Habakkuk's image of horns in the hands as the pierced palms of
    Christ. The section shifts to prophecies concerning the wickedness of the Jews,
    citing David on self-destructive iniquity, Solomon on the deceptive and violent
    man of iniquity, David on betrayal by a trusted companion, and an incomplete introduction
    to Isaiah's prophecy.
