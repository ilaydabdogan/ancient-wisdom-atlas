canonical_text:
  quote: ''
  summary: The passage cites Isaiah, Moses, and Acts to contrast external worship,
    failure to keep the Torah, and divine mercy. It interprets Stephen's words about
    the Torah and angels as a foreshadowing of heavenly Jerusalem, describing the
    throne of the Most High, fire, beasts, and sixth and seventh heavens. It then
    explains the Tabernacle, altar horns, table, offering, covering, and priestly
    invocation as liturgical similitudes of Christ's burial, body, blood, and participation
    in eternal life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isaiah and Moses are cited as witnesses to external worship, estrangement
    of the heart, divine anger, and a people whose counsel is destroyed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who said they had no Law are said to have received the Law, because
    God is described as the giver of the Law to everyone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: God is said to reward the Jews according to their wickedness and to treat
    the Gentiles according to their simplicity, while showing mercy to those who call
    on Him, take refuge in Him, purify themselves, weep, and repent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Stephen is identified as one of the Seventy Disciples, and he is described
    as speaking to the Jews while standing for martyrdom as they killed him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Stephen accuses the Jews of not keeping the Torah according to the ordinance
    or order of the angels, and Acts is cited as saying that the hearers became angry
    and gnashed their teeth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Stephen's statement about the Torah and the angels is presented as a form
    and foreshadowing of the heavenly and free Jerusalem, the habitation of the Most
    High.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The heavenly Jerusalem is described as incomprehensible to mortal heart in
    its situation and construction.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The throne of the Most High is described as surrounded with fire and borne
    in place by four beasts in the sixth heaven.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A throne is said to go up to the seventh heaven, described as the habitation
    of the Father, where He who is with His Father and the Holy Spirit dwells; the
    Holy Spirit is described as vivifying everything.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Tabernacle of the Church and the Church of the Gentiles are each called
    a similitude of the Jerusalem in the heavens.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tabernacle is said to symbolize the horns of the altar, where holy priests
    offer sacrifice and place the table.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The table is called a similitude of the grave in which Christ was buried in
    Golgotha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The offering on the table is identified as a symbol of the firstling, the
    Body of Emmanuel, described as pure and unmixed and taken from Mary.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Christ is represented as telling His holy Apostles to eat His Body and saying
    that one who does not eat His Body has no portion with Him and no everlasting
    life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: One who has eaten Christ's Body is said to live forever even if dead, to be
    associated with His Body and Blood, to become His heir, and to call God Father,
    who answers, 'Thou art My Son.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The covering above the offering is called a similitude of the stone with which
    the Jews sealed the grave.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: When the priest says, 'Send the Holy Spirit,' the Holy Spirit is said to be
    sent and the Body of the Lord becomes perfect or complete.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Those who receive are said to become participators in the Body and Blood of
    the Lord and Redeemer Jesus Christ, the Son of the Living God, and the Holy Spirit.
  category: relationship
  evidence_refs:
  - ev:8
