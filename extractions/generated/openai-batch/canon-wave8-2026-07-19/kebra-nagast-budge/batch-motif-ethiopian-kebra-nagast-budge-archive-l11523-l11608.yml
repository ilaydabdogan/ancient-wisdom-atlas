- id: claim:2
  claim: The passage explicitly compares the altar table to Christ's grave in Golgotha,
    the offering to the Body of Emmanuel, and the covering above the offering to the
    stone sealing the grave.
  claim_level: same_function
  target: Altar furniture and Eucharistic offering as likenesses of Christ's burial
    and body
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is typological and liturgical; the passage does not
    claim literal identity of table and grave or covering and stone.
- id: claim:3
  claim: The passage links eating or receiving the Body and Blood with living forever,
    becoming an heir, and being addressed by the Father as son, supporting a comparison
    between sacred meal participation and divine kinship.
  claim_level: same_function
  target: Sacred meal participation and divine parent-child status
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim remains within the passage's Christian sacramental theology
    and should not be generalized to unrelated sacred meal patterns without additional
    evidence.
