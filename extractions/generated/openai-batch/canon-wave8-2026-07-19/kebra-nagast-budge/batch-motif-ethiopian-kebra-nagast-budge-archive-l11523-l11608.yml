candidate_motifs:
- id: motif:1
  label: Divine Law given and judged across peoples
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The passage says the Law is given to those who said they had no Law, that
    God gives the Law to everyone, and that Jews and Gentiles are treated according
    to different moral conditions.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not narrate a formal covenant-making ceremony; the motif
    is inferred from explicit Law and judgment language.
- id: motif:2
  label: Earthly sanctuary as likeness of heavenly Jerusalem
  taxonomy_refs:
  - world_center
  basis: The Tabernacle of the Church and the Church of the Gentiles are explicitly
    called similitudes of the Jerusalem in the heavens, the habitation of the Most
    High.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The available taxonomy term 'world_center' is only approximate; the passage
    emphasizes heavenly-earthly similitude rather than naming a world center.
- id: motif:3
  label: Layered heavens and divine throne borne by living beings
  taxonomy_refs:
  - ascent
  basis: The passage describes the throne of the Most High in relation to the sixth
    heaven, four beasts, and a movement of the throne to the seventh heaven.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: No human ascent or journey is narrated; the 'ascent' taxonomy reference
    is limited to the throne's upward movement and the layered heaven imagery.
- id: motif:4
  label: Sacrifice, burial, and sacramental body
  taxonomy_refs:
  - sacrifice
  - death_rebirth
  - resurrection
  basis: Priests offer sacrifice; the table is likened to Christ's grave; the offering
    is identified with Christ's Body; eating the Body is linked to eternal life even
    after death.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The resurrection element is expressed through promised life and participation
    rather than a direct retelling of the resurrection narrative.
- id: motif:5
  label: Sacred meal producing divine kinship and inheritance
  taxonomy_refs:
  - sacred_exchange
  - divine_parent_child
  basis: Eating Christ's Body is said to make the recipient associated with His Body
    and Blood, an heir, and one who may call God Father and receive the answer 'Thou
    art My Son.'
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The kinship transformation is liturgical and theological in this passage;
    it is not presented as a biological birth story.
- id: motif:6
  label: Invocation that brings divine presence into ritual matter
  taxonomy_refs:
  - sacred_exchange
  basis: When the priest says 'Send the Holy Spirit,' the Holy Spirit is sent and
    the Body of the Lord becomes perfect or complete.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage supports a ritual-consecration pattern, but the taxonomy reference
    is approximate.
