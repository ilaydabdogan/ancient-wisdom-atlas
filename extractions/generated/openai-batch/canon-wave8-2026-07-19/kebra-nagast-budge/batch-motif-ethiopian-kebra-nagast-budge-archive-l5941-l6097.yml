  quote: ''
  summary: The passage first presents divine prohibitions concerning sexual relations,
    kinship boundaries, Moloch, pollution, and bodily sanctification. It then narrates
    civic reaction to Solomon making his son David king over Ethiopia, ordering firstborn
    children or noble sons to be given to him, arranging their ranks after the pattern
    of their fathers at Solomon's court, naming appointed officials, and giving David
    personnel, animals, vehicles, wealth, apparel, and precious materials for Ethiopia.
  language: English
  quote_policy: summarized
