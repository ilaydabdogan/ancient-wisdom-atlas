canonical_text:
  quote: ''
  summary: Makeda’s reign is celebrated in Ethiopia; Zion is set and guarded at Dabra
    Makeda. Makeda transfers horses, wealth, lawful possessions, and the throne to
    her son David. She requires the Ethiopian nobles to swear by heavenly Zion that
    only the male seed of David, son of Solomon, will rule Ethiopia. Priestly offices
    are appointed, the kingdom is renewed, and the Ethiopians abandon idols, magic,
    and omens to worship their Creator.
  language: English
  quote_policy: summarized
