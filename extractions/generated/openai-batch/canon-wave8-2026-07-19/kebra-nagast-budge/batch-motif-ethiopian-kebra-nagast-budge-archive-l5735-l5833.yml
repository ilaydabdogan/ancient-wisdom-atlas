canonical_text:
  quote: ''
  summary: A speech headed as Zadok giving commands to King David sets out punishments
    for failing to hearken to the Lord and blessings for obedience. The curses include
    defeat, disease, loss of family, property, crops, livestock, and constant fear.
    The blessings include prosperity, fertility, rain, victory over enemies, rule
    over nations, and exalted royal glory. An inserted plate caption identifies St.
    Luke the Evangelist painting portraits of Christ and the Virgin Mary.
  language: English
  quote_policy: summarized
