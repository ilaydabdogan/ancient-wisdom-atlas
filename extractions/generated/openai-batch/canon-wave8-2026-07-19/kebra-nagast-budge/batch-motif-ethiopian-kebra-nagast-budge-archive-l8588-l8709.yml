  summary: The passage gives a genealogy leading from Darius to Solomon, tells how
    Zanbares foresaw a transfer of rule to David's seed, and explains how Solomon
    sent his son 'Adrami to Rome. Baltasar/Baltasor, king of Rome, lacking a male
    heir, receives 'Adrami, gives him his daughter 'Adlonya, and establishes him over
    Rome. The passage ends with Baltasar testing 'Adrami's judicial knowledge in a
    vineyard-and-sheep dispute.
