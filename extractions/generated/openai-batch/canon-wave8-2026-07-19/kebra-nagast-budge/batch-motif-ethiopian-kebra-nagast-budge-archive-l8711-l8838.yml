candidate_motifs:
- id: motif:1
  label: wise judgment confers kingship
  taxonomy_refs:
  - wisdom
  - divine_judgment
  - royal_legitimacy
  basis: "'Adrami's judgment is admired, identified with the people of the God of
    Israel, and leads to his authority and kingship in Rome."
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The judgment is not delivered directly by a deity; divine sanction is
    inferred within the passage through Baltasar's praise and the Will of God statement.
- id: motif:2
  label: dynastic legitimacy through ancestral seed
  taxonomy_refs:
  - royal_legitimacy
  basis: Rome is assigned to 'Adrami and his generations, and the passage repeatedly
    explains rule through the seed of Shem and other ancestral lines.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage gives a theological-genealogical explanation rather than a
    full coronation myth.
- id: motif:3
  label: birthright lost through appetite and exchange
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Esau loses the right of the firstborn to Jacob for pottage, and the narrator
    interprets the loss as caused by greed of the belly.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage moralizes the exchange; it does not narrate all details of
    the wider Jacob-Esau episode.
- id: motif:4
  label: body-soul duality and ascetic restraint
  taxonomy_refs:
  - duality
  - wisdom
  basis: The passage contrasts greedy body and temperate soul, quotes Paul on their
    conflict, and urges walking in the Spirit rather than bodily lust.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a moral-theological motif rather than a narrative episode.
- id: motif:5
  label: renunciation rewarded with supernatural apostolic powers
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: Disciples who forsake everything are promised authority to raise the dead,
    heal the sick, trample the Enemy, and judge the Twelve Tribes at the second coming.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage presents this as quoted teaching rather than a performed miracle
    in the immediate scene.
- id: motif:6
  label: righteous person envied by Satan
  taxonomy_refs: []
  basis: Karmm is introduced as righteous, generous, wealthy, and without evil before
    him; Satan becomes envious after seeing his good life.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage segment ends before the subsequent conflict is narrated, so
    the motif is only introduced here.
