canonical_text:
  quote: ''
  summary: The passage recounts a dispute over sheep damaging a vineyard, 'Adrami's
    conditional judgment, his elevation to kingship in Rome, and a dynastic allocation
    by divine will. It then explains the King of Medyam through Esau and Jacob, moralizes
    on appetite, temperance, body, and soul, cites Christian apostolic authority,
    and begins an account of the King of Babylon through the righteous wealthy man
    Karmm and Satan's envy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vineyard owner claims the sheep ate tendrils, grape-bearing branches,
    and left only twigs by the root; the sheep owner replies that the sheep ate only
    leafed tendrils and blossoms before grapes formed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: "'Adrami questions the parties and gives a conditional judgment about compensation
    depending on whether roots, leaves, blossoms, wool, or young of the sheep are
    involved."
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who hear the judgment marvel, and Baltasar praises it as a judgment
    of the people of the God of Israel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Baltasar authorizes 'Adrami to judge cases, wage war, rule, preserve life,
    pass judgment, and take the city for himself and his descendants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men of Rome make 'Adrami king and rejoice; the passage says this happened
    by their will and by the Will of God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Baltasar is seized by fever, sends 'Adrami to war and other tasks, later dies,
    and 'Adrami directs the kingdom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The city of Rome becomes the possession of 'Adrami and his generations after
    him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator states that, by the Will of God, the kingdom of the world was
    given to the seed of Shem, slavery to the seed of Ham, and handicrafts to the
    seed of Japheth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The King of Medyam is identified as being of the seed of Shem, through Isaac
    and Esau.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Esau is described as coming from his mother's womb with Jacob clinging to
    the sole of his foot, and Jacob is said to have carried away the right of the
    firstborn for a mess of pottage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator connects the name Edom with lentils and says Esau lost the right
    of the firstborn through greed of the belly.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage teaches that the body is greedy, temperance restrains the soul,
    and body and soul contend against each other.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: Christ is described as the head of every man traveling on the straight road,
    and the disciples are told to walk in the Spirit rather than perform bodily lusts.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The disciples say they have forsaken everything and followed the Lord, and
    the Saviour promises them angel-like bodies, authority to raise the dead, power
    to heal the sick, power over the Enemy, and future judgment over the Twelve Tribes
    of Israel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The King of Babylon is identified as being of the seed of Shem.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Karmm is described as a fearer of God who gives alms and offerings sincerely,
    gives double tithe, and has no evil before him.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Satan, called the enemy of all good, becomes envious of Karmm when he sees
    Karmm's good way of life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Karmm is said to be very rich in animals, precious metals, and apparel, and
    he leaves Judah to live in 'Armatem because of love for wealth.
  category: attribute
  evidence_refs:
  - ev:9
