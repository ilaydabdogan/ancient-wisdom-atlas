canonical_text:
  quote: ''
  summary: God rebukes angels who compare themselves favorably to Adam, grants them
    a test in human form, warns them against transgression, and describes Satan as
    a tempter of thoughts. The angels descend, join the daughters of Cain, sin, and
    are bound in Sheol until the Great Day. Their offspring become giants, after which
    God announces the Flood, while Noah is instructed to build a four-sided, three-storey
    ark of wood and is saved with his household.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God contrasts humans, who have mixed good and bad intentions, with angels
    whose minds are directed toward praising God, except for an arrogant being who
    produced evil and was driven from their assembly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The angels state that they will not transgress God’s commandment and ask to
    be tested.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: God warns the angels that if they transgress, Jahannam, fire, sulphur, heat,
    whirlwind, and unbreakable chains will be their habitation until the Great Day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: God says Satan cannot physically seize, fight, drag, or beat, but can make
    thoughts germinate silently in the mind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: God gives the angels the mind and body of a man and warns them not to defile
    themselves through eating, drinking, fornication, or other transgression.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The angels receive flesh, blood, and human hearts, leave the height of heaven,
    and come down to earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On earth the passage describes dancing, singing, tambourines, flutes, pipes,
    shouting, and daughters of Cain enjoying orgies without shame.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men take women whom they choose as wives and commit sin with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: God becomes angry and binds the offending angels in the terror of Sheol, in
    a state of judgment, until the Great Day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The daughters of Cain conceive by the angels but cannot give birth normally;
