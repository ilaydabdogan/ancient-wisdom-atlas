canonical_text:
  quote: ''
  summary: 'The passage recounts pursuit and inquiry after the Tabernacle or Box of
    the Covenant, reports its rapid travel with a king and soldiers, describes the
    young man''s safe arrival in his country, his mother''s abdication, his accession
    to David''s throne in Abyssinia, and the Tabernacle remaining there. It then links
    this transfer to later Christian history: Christ''s dispensation and ascension,
    the preaching of the disciples, the baptism and preaching of the eunuch of Kandakes
    by Philip, and the later baptism, ordination, and ecclesiastical establishment
    by Parmenas.'
  language: English
  quote_policy: summarized
