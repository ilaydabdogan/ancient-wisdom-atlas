- id: claim:1
  claim: The narrator explicitly connects the liars' peaceful speech and hidden evil
    with a Davidic psalmic pattern of recompense according to evil works and thoughts.
  claim_level: same_function
  target: Psalm xxviii, 3-4 / Davidic prophecy cited in the passage
  evidence_refs:
  - ev:11
  - ev:17
  counter_evidence_refs: []
