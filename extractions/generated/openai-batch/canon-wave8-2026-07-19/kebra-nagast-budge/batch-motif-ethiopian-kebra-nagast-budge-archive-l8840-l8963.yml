  limitations: This is an internal citation made by the passage itself, not an independent
    cross-cultural comparison.
- id: claim:2
  claim: The narrator frames proper royal inquiry into accusation as consistent with
    a Mosaic legal command.
  claim_level: same_function
  target: Mosaic legal command to investigate accusations, as cited in the passage
  evidence_refs:
  - ev:9
  - ev:8
  counter_evidence_refs:
