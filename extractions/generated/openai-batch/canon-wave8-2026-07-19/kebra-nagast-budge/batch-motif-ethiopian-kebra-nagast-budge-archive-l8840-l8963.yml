- id: obs:12
  text: After inquiry, the king ordered the captain of his host to surround Karmin's
    house at dawn, prevent escape, kill the people there, behead Karmin, and seize
    his possessions.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The liars returned to Karmin's house, spoke peaceful words, complimented him,
    jested before him, and hid evil in their hearts.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage says this fulfilled a prophecy of David concerning those who speak
