canonical_text:
  quote: ''
  summary: Benyas, aided by envious neighbors and two named witnesses, falsely accuses
    Karmin of insulting King Manasseh's legitimacy. The king questions the witnesses
    and orders Karmin's household destroyed and possessions seized. The false witnesses
    visit Karmin with peaceful words while hiding evil intent. An angel warns Karmin
    to flee. Karmin escapes by night with treasure, sends his wife and sons toward
    Jerusalem, and reaches Babylon, where King Bala'on receives him. The lying witnesses
    are killed in Karmin's house.
  language: English
  quote_policy: summarized
