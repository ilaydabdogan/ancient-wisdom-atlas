candidate_motifs:
- id: motif:1
  label: false witness against an innocent man
  taxonomy_refs: []
  basis: Karmin is accused of words the narrator says he never uttered or thought,
    and multiple men swear or agree to support the lie.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the testimony as false, but it does not provide an
    external trial record beyond the narrator's statement.
- id: motif:2
  label: conspiratorial oath to accuse
  taxonomy_refs:
  - covenant
  basis: The neighbors make a covenant and swear to Benyas that they will bear false
    witness against Karmin.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy term 'covenant' is used because the passage uses the word
    covenant; the covenant here is a wrongful conspiracy, not a sacred covenant.
- id: motif:3
  label: coordinated lying testimony rehearsed in detail
  taxonomy_refs: []
  basis: The witnesses plan matching answers about location, time, date, drinking
    vessels, and seating before being questioned by the king.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a narrative pattern of rehearsed testimony rather than a named
    taxonomy family in the supplied list.
- id: motif:4
  label: royal judgment corrupted by false testimony
  taxonomy_refs:
  - divine_judgment
  basis: The king investigates by questioning witnesses but nonetheless issues a lethal
    order based on their lying testimony.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The judgment is royal rather than directly divine; the divine-judgment
    taxonomy is only partly applicable because the passage later invokes divine command,
    angelic warning, and psalmic recompense.
- id: motif:5
  label: divine messenger warns innocent victim to flee
  taxonomy_refs:
  - departure
  basis: An Angel of God wakes Karmin and tells him to leave, take what he can carry,
    and flee into another country.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The supplied taxonomy has 'departure' but no more specific 'angelic warning'
    category.
- id: motif:6
  label: night escape with household and treasure
  taxonomy_refs:
  - departure
  basis: Karmin wakes his wife, sons, and chosen servants, loads them with valuables,
    and leaves by night.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The household separates after the departure, with the wife and sons sent
    to Jerusalem while Karmin travels toward Babylon.
- id: motif:7
  label: exile and refuge at a foreign court
  taxonomy_refs:
  - departure
  basis: Karmin travels a three-month distance to Babylon, gives Bala'on a gift, tells
    his story, and receives a habitation.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage describes refuge but does not narrate a return.
- id: motif:8
  label: retributive death of false witnesses
  taxonomy_refs:
  - divine_judgment
  basis: After the narrator invokes David's prophecy of recompense for those with
    evil in their hearts, the men who bore lying testimony are killed in bed in Karmin's
    house.
  evidence_refs:
  - ev:11
  - ev:17
  confidence: medium
  cautions: The immediate agents of the killing are not named in the final sentence;
    the connection to divine judgment is inferential but supported by the narrator's
    psalmic framing.
- id: motif:9
  label: attack on royal legitimacy through alleged slander
  taxonomy_refs:
  - royal_legitimacy
  basis: The false accusation claims Karmin said the king was not the son of a free
    woman but of an old woman servant purchased for labor.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The legitimacy attack is embedded inside a false accusation and is not
    developed as an independent dynastic claim in this passage.
