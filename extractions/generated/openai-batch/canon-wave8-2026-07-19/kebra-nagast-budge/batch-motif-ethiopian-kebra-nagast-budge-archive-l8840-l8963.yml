    and servants, and wanted to drive him from the region.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The neighbors told Benyas that Karmin had blasphemed the king and attacked
    the king's parentage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The neighbors made a covenant with Benyas and swore to bear false witness
    against Karmin.
