canonical_text:
  quote: ''
  summary: The passage summarizes episodes in which David II and his company reveal
    that they have carried off the Tabernacle Zion, honor and transport it miraculously
    toward Ethiopia, while idols fall before it. Solomon and Zadok discover the loss
    in Jerusalem, Solomon attempts pursuit, and the elders counsel that the Tabernacle
    could not have departed against God's will. A substitute box containing a copy
    of the Law is installed in secrecy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: David II's companions reveal that they have carried off the Tabernacle Zion
    and that it is present with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Azaryas tells Elmeyas to beautify and dress “our Lady,” and David II dances
    before the Tabernacle as his grandfather David I had done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When local people hear that the Tabernacle of the Law of God is among them,
    they play instruments, shout, and temple pylons and idols in the forms of men,
    dogs, and cats fall and break.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Azaryas dresses Zion, spreads gifts before her, and sets her on a wagon draped
    with purple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the journey resumes, men, beasts, and wagons are lifted one cubit above
    the ground and pass through the air while people run beside Zion and worship her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the Red Sea, Zion passes over the waters; the company is lifted three cubits,
    and waves, billows, breakers, and sea creatures acclaim or worship her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The company reaches a place opposite Mount Sinai, encamps in Kades, passes
    through Medyam and Belontos, and comes to Ethiopia, where it is received with
    rejoicing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator states that the route described for David II is vague and that
    Isaac's geographical knowledge was incomplete.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Zadok returns from the Temple to Solomon's palace and finds Solomon sorrowful
    because he fears the glory of Israel has departed or is about to depart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Zadok inspects the Holy of Holies and finds only the substitute box made by
    Azaryas in place of the Tabernacle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After seeing that Zion has departed, Zadok faints, revives, puts ashes on
    his head, and laments at the Temple doors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Solomon orders men to pursue those who stole Zion and to kill them if they
    are found.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Solomon's scouts and an envoy of Pharaoh report that David II's company had
    passed through the air and that Egyptian statues of kings and gods fell and broke
    before the Tabernacle of Zion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Solomon returns to Jerusalem, and he and Zadok weep in the House of God before
    the elders recount the past history of the Ark of the Covenant, identified with
    the Tabernacle Zion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The elders argue that the Tabernacle Zion could not have been carried away
    against God's will and that it can take care of itself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Solomon accepts the elders' statement about the irresistible will of God,
