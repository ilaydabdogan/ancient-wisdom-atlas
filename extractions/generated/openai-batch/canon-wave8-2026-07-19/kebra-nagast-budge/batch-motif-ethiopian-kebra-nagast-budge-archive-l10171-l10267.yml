canonical_text:
  quote: ''
  summary: A speaker praises Wisdom as a maternal and protective benefactor granted
    by the God of Israel, then states that Zion has come to Ethiopia by God's will
    as a guide for King David. Azariah summons jubilee trumpets, fills a horn with
    the oil of sovereignty, anoints David, and a public celebration renews the kingdom
    of David in Mount Makeda, in the House of Zion. The Law and ordinances are established
    according to the Jerusalem model, the boundaries and enduring dominion of the
    Ethiopian king are described, and the Law and names are written down as a memorial
    for later days.
  language: English
  quote_policy: summarized
