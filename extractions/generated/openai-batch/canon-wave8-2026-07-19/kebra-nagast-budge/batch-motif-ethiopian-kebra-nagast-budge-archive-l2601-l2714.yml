canonical_text:
  quote: ''
  summary: The passage summarizes Makeda/the Queen of Sheba as a wealthy southern
    trading queen who hears Tamrin’s report of Solomon’s wisdom and temple works,
    travels to Jerusalem, gives gifts, learns about the God of Israel, renounces her
    former worship, vows that her descendants will adore the Tabernacle, and later
    enters an oath-bound banquet episode with Solomon involving thirst and a vessel
    of water. It ends with Solomon’s dream of the sun descending from heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen from the south is described as shrewd, intelligent, beautiful, exceedingly
    rich, and engaged in trade by caravans and ships with merchants of India, Nubia,
    and Aswan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tamrin is described as the head of the Queen’s trading caravans and as directing
    520 camels and 73 ships.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Solomon sought gold, ebony, and sapphires for the Temple of God in Jerusalem,
    negotiated with Tamrin, and was employing 700 carpenters and 800 masons on the
    Temple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Tamrin reported Solomon’s power, wisdom, and magnificence, the Queen
    developed a desire to see him and to imbibe his wisdom; she loaded many animals
    and went to Jerusalem.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Queen met Solomon she gave him rich presents; Solomon lodged and
    supplied her, and she marveled at his knowledge, his instruction of workmen, and
    his actions as judge and ruler.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Makeda conversed daily with Solomon, learned from him about the God of the
    Hebrews as Creator, renounced worship of the sun, moon, stars, trees, and idols,
    and worshiped the God of Israel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Makeda vowed that her seed after her would adore the Tabernacle of the God
    of Israel, described as the abode of God upon earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Birds and beasts came to hear Solomon’s wisdom; Solomon spoke to them in their
    own languages, and they returned to their native lands to report what they had
    seen and heard.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Makeda announced her return, Solomon determined to company with her because
    he loved her beauty and intelligence and wished to beget a son by her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Solomon invited Makeda to a splendid banquet in a great tent; after the guests
    left, he offered her a couch, and they made reciprocal conditions about his not
    touching her by force and her not taking anything from his house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After eating highly spiced food, Makeda became violently thirsty, found no
    water except a vessel by Solomon’s bed, took it, was accused by Solomon of breaking
    her oath, retracted the oath, drank, and slept on Solomon’s couch with him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that Makeda was a virgin queen who had reigned six years
    when Solomon took her to wife.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: That same night Solomon dreamed that the sun came down from heaven and shone
    brilliantly.
  category: other
  evidence_refs:
  - ev:10
