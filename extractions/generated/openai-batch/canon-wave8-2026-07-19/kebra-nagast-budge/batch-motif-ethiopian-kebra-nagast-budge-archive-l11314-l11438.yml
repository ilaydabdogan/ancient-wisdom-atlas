literal_observations:
- id: obs:1
  text: The passage says God could have saved Noah by lifting him into the air or
    by keeping the Flood waters from one mountain, but instead was pleased that salvation
    occur through sanctified wood, namely the ark and the wood of the Cross.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: God is represented as telling Noah to make the thing by which he would be
    saved, which the passage identifies as the Tabernacle of the Church.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four-sided form of the ark is said to show the fourfold Sign of the Cross,
    and the four corners of the ark are identified with the horns of the altar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Moses was commanded to make the ark from indestructible wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: God instructs Moses and his house to sanctify themselves from impurity, falsehood,
    fornication, vindictiveness, and other defilements before offering a clean sacrifice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: God says that those who approach with purity of heart, love, peace, and right
    relations with neighbours will have their prayers heard, and that God will be
    with them, walk among them, dwell in their hearts, and be their God.
  category: speech
  evidence_refs:
  - ev:3
