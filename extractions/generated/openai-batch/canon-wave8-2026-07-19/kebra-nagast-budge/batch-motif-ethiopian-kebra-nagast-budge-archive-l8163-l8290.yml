canonical_text:
  quote: ''
  summary: Gabriel tells Solomon that he protects the Pearl transmitted from Adam
    to Hanna, while Michael guards Zion and Uriel guards the wood that will become
    the Cross. Solomon gives thanks for mercy, accepts death without grief, and expects
    the Saviour to bring him and his ancestors out of Sheol. In response to Solomon's
    questions, the angel says the Saviour will come after thirty-three generations
    from Solomon's kin and seed, will be hated, crucified, killed, and will rise again
    to deliver his people. The angel also says Israel will be scattered after pouring
    out the Saviour's blood on the Cross, and Solomon laments the guilt and judgment
    of his people.
  language: English
  quote_policy: summarized
