canonical_text:
  quote: ''
  summary: Solomon receives the Queen and her retinue near his palace. She visits
    him to hear his wisdom. Solomon desires her, she refuses because she came as a
    virgin, and he proposes a covenantal condition under which she would become his
    wife if she comes to him at night by his bed. He later orders highly seasoned
    food prepared and secretly forbids palace personnel to leave water for her anywhere
    except by his couch. Overcome by thirst, she goes to Solomon's place and drinks
    the water while he pretends to sleep. Solomon then claims the covenant has been
    fulfilled; she remembers it and yields. She becomes pregnant. Before she returns
    to her kingdom, Solomon gives her his ring as a future identifying token for a
    son, whom he says he will make king and send back to her.
  language: English
  quote_policy: summarized
