canonical_text:
  quote: ''
  summary: A son of Solomon asks for the Tabernacle of the Covenant of God as protection
    for his journey and kingdom. Solomon says that if God wills it, the removal will
    be easy, but asks not to be informed. The young man secretly prepares a golden
    replica case, kills the craftsmen involved, deceives and binds four priests, enters
    the House of God by night, has the priests carry away the Tabernacle, and leaves
    the replica in its place. The narration frames the event as occurring by divine
    dispensation for the protection of the holy Tabernacle and the Davidic kingdom.
    In the morning, priests discover the absence, identify the substitution, infer
    that Solomon's son took it, and ask Solomon for soldiers to pursue him after Solomon
    swears he did not authorize or know of the act.
  language: English
  quote_policy: summarized
