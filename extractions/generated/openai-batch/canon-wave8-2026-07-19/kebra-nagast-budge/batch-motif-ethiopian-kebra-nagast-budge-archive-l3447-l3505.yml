canonical_text:
  quote: ''
  summary: 'The passage summarizes later chapters: Christ is identified with a unicorn;
    prophecies concern the Crucifixion, Resurrection, Ascension, and Second Coming;
    biblical patriarchs and prophets are described as forerunners and symbols of Christ.
    The chariot of Zion, bearing the Tabernacle of the Law, is located in Ethiopia,
    while the Cross is in Rome. Gregory answers the Archbishops with prophecies about
    Rome, Persia, the Cross, the continued presence of Zion in Ethiopia, the return
    and opening of the Tabernacle at Mount Zion, judgment on Jews and Christians,
    wars involving Rome, Armenia, Ethiopia, Nagran, and the meeting and title exchange
    of Justinus and Kaleb.'
  language: English
  quote_policy: summarized
