canonical_text:
  quote: ''
  summary: A speaker explains that the holy and heavenly Zion, the Tabernacle of the
    Law of God, has come to Ethiopia by God’s will and will guide the king and his
    descendants if they keep God’s command. The Tabernacle is described as autonomous,
    protective, maternal, and salvific. Azaryas instructs Elmeyas to adorn it for
    the king. King David of Ethiopia responds with prayer, ecstatic rejoicing, and
    a prophetic salute to Zion, asking it to intercede, guide, teach, strengthen,
    and protect his people.
  language: English
  quote_policy: summarized
