canonical_text:
  quote: ''
  summary: Solomon confines a young Rukh bird beneath a brass pot. The mother Rukh
    searches for it, obtains a piece of wood from below Paradise, and uses it to split
    the pot and rescue her young. Solomon then uses the holy wood to split stones
    for the Temple, after which the wood remains honored though its power ceases.
    The passage then explains that God wills the Davidic-Solomonic kingdom to be transferred
    to Abyssinia and moves the Queen to visit Jerusalem to hear Solomon's wisdom.
    The Queen's mother had desired a goat during pregnancy, and the Queen is born
    with one human foot and one goat foot. Solomon learns of this and fills the Temple
    courtyard with water as a stratagem to see her foot.
  language: English
  quote_policy: summarized
