candidate_motifs:
- id: motif:1
  label: Mother bird rescues captive young using a sacred object
  taxonomy_refs: []
  basis: A mother bird searches for her trapped young, retrieves wood from below Paradise,
    breaks the brass pot by divine miracle, and carries the young away.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the episode as a miracle and an example of instinct
    granted by God; wider Rukh-bird traditions are not established from this passage
    alone.
- id: motif:2
  label: Miracle-working Paradise wood in sacred construction
  taxonomy_refs:
  - sacred_tree_axis
  basis: The wood from below Paradise splits the pot and then splits stones for the
    Holy Temple; after construction it remains respected.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage calls the object a piece of wood, not a living tree or explicit
    axis; the taxonomy reference is therefore provisional.
- id: motif:3
  label: Divinely sanctioned royal transfer and Davidic legitimacy
  taxonomy_refs:
  - royal_legitimacy
  - covenant
  - divine_judgment
  basis: God is said to will the transfer of David and Solomon's kingdom to Abyssinia,
    while Israel's covenant failure results in loss of prophecy, priesthood, and sovereignty.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage gives a theological explanation of dynastic legitimacy rather
    than a detailed political narrative.
- id: motif:4
  label: Royal journey to seek wisdom
  taxonomy_refs:
  - wisdom
  - departure
  basis: The Queen is stirred by God to journey from Abyssinia to Jerusalem to hear
