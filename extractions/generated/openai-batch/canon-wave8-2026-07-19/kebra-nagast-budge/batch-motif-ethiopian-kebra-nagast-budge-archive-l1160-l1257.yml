literal_observations:
- id: obs:1
  text: The passage argues that an Arabic form of the Kebra Nagast may have been translated
    from Coptic manuscripts of the Patriarchal Library at Alexandria and reached Ethiopia
    via the Blue Nile.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The principal theme is stated to be the descent of the kings of Ethiopia from
