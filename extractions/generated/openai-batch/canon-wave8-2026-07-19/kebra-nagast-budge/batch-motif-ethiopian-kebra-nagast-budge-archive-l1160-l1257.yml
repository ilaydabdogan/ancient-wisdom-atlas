  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says this descent theme was known in Ethiopia for centuries before
    the Kebra Nagast was compiled and that its treatment was influenced by Coptic
    and Syrian supplementary legends.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Solomonic line is described as ruling Ethiopia until Esther or Judith
    dethroned Delna'ad and placed Mara Takla Haymanot, first of the eleven Zague kings,
    on the throne.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Zague kings are described as dispossessing the Solomonic kings for three
