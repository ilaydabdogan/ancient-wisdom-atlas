  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Blood from the slain dragon falls on Eteye Azeb's heel, after which her heel
    becomes like the heel of an ass.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After being freed, Eteye Azeb is rejected by the village, spends the night
