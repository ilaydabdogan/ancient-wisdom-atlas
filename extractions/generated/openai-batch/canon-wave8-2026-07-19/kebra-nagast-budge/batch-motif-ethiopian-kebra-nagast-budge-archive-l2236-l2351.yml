canonical_text:
  quote: ''
  summary: The passage summarizes traditions about Solomon and Balkis, including a
    transported and altered throne, a glass palace with water that exposes Balkis's
    hairy legs, and later commentary about her possible marriage. It then recounts
    a Northern Abyssinian legend in which Eteye Azeb is offered to a dragon, rescued
    by seven saints who kill the monster with a cross, becomes chieftainess, travels
    disguised as a man to Solomon for healing, is detected by a honey test, and lies
    with Solomon, who gives tokens to her and her companion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Solomon sees the throne of Balkis before him and has it altered so that she
    may not recognize it when she arrives.
  category: action
  evidence_refs:
  - ev:1
