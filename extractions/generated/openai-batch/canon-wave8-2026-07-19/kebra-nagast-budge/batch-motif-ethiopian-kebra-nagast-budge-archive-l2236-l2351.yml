  text: A palace built for Balkis has white glass walls, a glass floor, and running
    water with fish over the floor.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Balkis lifts her garments because she thinks the glass-covered water is deep,
    exposing legs described as hairy like an ass's coat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Balkis declares submission to God with Solomon; some commentators explain
    the words as repentance for sun worship or fear of drowning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jalal ad-Din reports that Solomon considered marrying Balkis but hesitated
    because of the hair on her feet and legs; devils remove the hair, but the marriage
    remains doubtful.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Northern Abyssinian legend identifies Menyelek's mother as Eteye Azeb, a
    Tigre girl also glossed as Queen of the South.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eteye Azeb's people worship a dragon or serpent and require each man in turn
    to offer his eldest daughter with sweet beer and milk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eteye Azeb is tied by her parents to a tree where the dragon comes for food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Seven saints sit beneath the tree; after a tear falls from Eteye Azeb, they
    ask who she is and learn that she is a human victim bound for the dragon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The saints kill the dragon by smiting it with a cross, with Abba Mentelit
