canonical_text:
  quote: ''
  summary: The preface discusses traditions of divine or sacred royal legitimation,
    including Nectanebus appearing as Amen to Olympias and begetting Alexander, Makeda's
    relation to Solomon as a divinely empowered custodian of the Heavenly Zion, comparisons
    between the Tabernacle of the Law and Babylonian and Egyptian divine arks, Piankhi's
    ritual viewing of Ra, and Ethiopian traditions about Menyelek's theft of the Ark
    and the Ark's typological relation to the Virgin Mary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nectanebus is said to have appeared to Olympias at night in the form and attributes
    of Amen of Libya and to have begotten Alexander the Great.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says tradition transferred the horns of Amen to Alexander, and
    that Arab writers call Alexander by a title meaning 'provided with two horns.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Makeda, described as the virgin queen of Saba, is said to have given herself
    to Solomon because she believed him to be of divine origin and as a god to her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Solomon is described as custodian of the Heavenly Zion, the Tabernacle of
    the Law of God, from which he received daily renewal of divinity, power, and authority.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tabernacle of the Law is said to have much in common with Babylonian and
    Egyptian arks or divine tabernacles that housed divine figures or characteristic
    emblems.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ark of Bel in Babylon is described as containing a figure of the god;
    the king visited it annually, sought forgiveness with tears, and grasped the sacred
    figure's hand or hands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Egyptian arks of gods are described as kept in special chambers, containing
    seated divine figures on thrones, and being carried by priests on sledges or in
    boats during festivals or solemn days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ark of Amen is described as having bolted and sealed doors, which the
    king could sometimes unseal and open to look upon the face of the god.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Piankhi is described as ritually prepared, ascending to the ark of Ra, opening
    its sealed doors, looking upon Ra's face, closing and sealing the doors, and being
    recognized by Ra as king of all Egypt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states uncertainty about whether Piankhi saw a figure of Ra or
    the benben stone, and notes that some Egyptian arks contained symbolic objects
    or portions of Osiris's body rather than divine figures.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ark of the Law that Menyelek covered and stole from the Temple of Jerusalem
    is described as probably a copy of the ark made by Moses and as a gold-plated
    wooden rectangular box.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the Kebra Nagast does not mention the Mercy seat and
    Cherubim, but says Moses made a case shaped like the belly of a ship for the Two
    Tables of the Law.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'The passage states that Ethiopians understood the Mosaic case as symbolizing
    the Virgin Mary: the case carried the Word in stone, and Mary carried the Word
    Incarnate.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says one should not assume that the Ark stolen by Menyelek was
