  summary: Gregory gives an eschatological prophecy about a Roman king and archbishop
    who pervert apostolic faith, the loss of a victorious sacred object into the sea,
    Ethiopia’s perseverance in orthodoxy, the future return and manifestation of Holy
    Zion, the resurrection of the dead, witnesses at judgment, the judgment of the
    Jews who crucified Christ, and the final fate of believers and sinners.
