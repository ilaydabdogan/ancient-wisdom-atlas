canonical_text:
  quote: ''
  summary: A young man, named later in the passage as Bayna Lehkem, arrives in his
    mother’s country and is honored because the people believe he exactly resembles
    King Solomon. Reports of his resemblance cause dispute, and spies confirm that
    Solomon is still in Jerusalem. Solomon is moved by news of the visitor from Ethiopia
    and sends his commander with gifts to bring him. The narrator frames the Ethiopian
    king as Solomon’s eldest son and links him to Davidic promise, Zion, and divine
    providence. Bayna Lehkem expresses trust that the Lord of Israel will let him
    see Solomon and return safely to his mother, the Queen, and Ethiopia.
  language: English
  quote_policy: summarized
