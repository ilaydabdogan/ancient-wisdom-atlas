canonical_text:
  quote: ''
  summary: 'The passage opens with a plate description of the Last Judgement: God
    sits centrally with angels, the blessed on His right, the damned on His left,
    and Diabolus with fiends at His feet. It then describes punishment according to
    the burden of sin, with some tested and absolved. In section 116, Archbishops
    ask Gregory whether the chariot of Ethiopia will remain until the Coming of Christ,
    as Zion and the faith of Ethiopia have been discussed. Gregory says it will not
    disappear and foretells conflict involving Jews in Nagran and Armenia. In section
    117, the King of Rome, the King of Ethiopia, and the Archbishop of Alexandria
    are informed of a campaign in which the kings are to fight the Jews, lay waste
    lands, and build churches; the passage ends mid-sentence.'
  language: English
  quote_policy: summarized
