    taken from Shem’s land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: God is said later to have taken vengeance on Canaan’s sons and made the sons
    of Shem inherit their country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage says Canaan’s descendants lost their memorial because they transgressed
