  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Canaan is said to have taken the kingdom from the children of Shem and to
    have broken the oath made by Noah.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
