canonical_text:
  quote: ''
  summary: The passage presents divine speech about Zion, the Tabernacle of the Covenant,
    and the rainbow as signs of mercy; a declaration by church authorities that Zion
    was created before all things and typologically resembles Mary; a narrative of
    Canaan’s oath-breaking and loss of land; a genealogy leading to image-making,
    demonic speech, and child sacrifice; and an account of the young Abraham rejecting
    idols while sent by Terah to sell them. It also contains a plate caption describing
    Moses receiving the Table of the Law from God on Sinai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The divine speaker swears by Himself and by Zion, identified as the Tabernacle
    of the Covenant, and says it was created as a mercy seat and for human salvation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The divine speaker says the Tabernacle of the Covenant will come down to the
    addressee’s seed and remain with them forever.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bow of the Covenant, explained as the rainbow, is said to appear when
    clouds arise so that people will not fear another Flood.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rainbow is also described as a sign by which divine anger is put away
    and compassion is sent when sins multiply.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Archbishops tell Gregory that the Tabernacle of the Covenant was created before
    the angels, heaven, earth, the pillars of heaven, and the sea abysses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The three hundred and eighteen Orthodox Fathers declare that the Tabernacle
    of the Covenant was the first created thing and that Zion was created before everything
    else as the habitation of divine glory.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The declaration says that the plan of the Covenant included God putting on
    Adam’s flesh and appearing to created beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Heavenly Zion is explicitly called a similitude of Mary, the Mother of the
    Redeemer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The built Zion is said to contain the Ten Words of the Law, while the Creator
