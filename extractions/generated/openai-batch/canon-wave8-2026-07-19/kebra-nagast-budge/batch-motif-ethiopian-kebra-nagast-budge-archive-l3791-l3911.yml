candidate_motifs:
- id: motif:1
  label: Rainbow as covenant sign averting flood-fear and divine wrath
  taxonomy_refs:
  - covenant
  - flood_and_renewal
  basis: The Bow of the Covenant is identified as the rainbow, appears with clouds
    to prevent fear of a Flood, and marks divine remembrance, anger set aside, and
    compassion sent.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage emphasizes covenantal mercy more than a full flood narrative.
- id: motif:2
  label: Primordial heavenly sanctuary
  taxonomy_refs:
  - covenant
  - world_center
  basis: The Tabernacle of the Covenant and Zion are said to have been created before
    every other created thing and to serve as the habitation of divine glory.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy has no exact sanctuary category; world_center is used cautiously
    for a primordial divine habitation.
- id: motif:3
  label: Heavenly sanctuary as type of Mary’s womb
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The text explicitly calls heavenly Zion a similitude of Mary and links built
    Zion’s deposited Law with the Creator dwelling in Mary’s womb.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is an internal Christian typological reading stated by the passage.
- id: motif:4
  label: Law preserved or received in sacred place
  taxonomy_refs:
  - covenant
  - wisdom
  basis: The Ten Words are deposited in Zion, and the plate caption shows Moses receiving
