comparison_claims:
- id: claim:1
  claim: The passage explicitly connects the Bow of the Covenant/rainbow material
    with Genesis flood-covenant tradition through its wording about clouds, Flood
    fear, and a Genesis citation in the note.
  claim_level: same_motif
  target: Genesis flood-covenant rainbow tradition
  evidence_refs:
  - ev:2
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This claim is limited to the explicit intertextual citation and shared
    motif; it does not infer a separate historical transmission beyond the passage’s
    own biblical reference.
- id: claim:2
  claim: 'The passage itself presents heavenly Zion as a typological similitude of
    Mary, assigning both a sacred dwelling function: Zion contains the Law, and Mary’s
    womb contains the Creator.'
  claim_level: same_function
  target: Mary as Mother of the Redeemer and dwelling-place of the Creator
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal theological comparison stated by the passage rather
    than an external cross-cultural comparison.
- id: claim:3
  claim: The plate caption and the reference to the Ten Words connect the passage
    with the Mosaic law-giving pattern centered on Sinai and the divinely given law.
  claim_level: same_motif
  target: Mosaic Sinai law-giving tradition
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The caption is a manuscript illustration description within the passage,
    not part of the surrounding Canaan-Abraham narrative.
