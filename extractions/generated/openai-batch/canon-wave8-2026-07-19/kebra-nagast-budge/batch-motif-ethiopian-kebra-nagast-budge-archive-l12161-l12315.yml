  quote: ''
  summary: The passage assembles prophetic citations interpreted as witnesses to a
    new divine act, water in the wilderness, universal worship, a new covenant on
    the mountain of God, the unity of God as Trinity, Christ’s entrance into Jerusalem,
    Christ’s Davidic/Judahite kingship under the name Beloved, and His descent, choice
    of apostles, ascension to the seventh heaven, and reception by angels. A plate
    caption describes Christ taking Adam from Sheol and trampling the Devil.
  language: English
  quote_policy: summarized
