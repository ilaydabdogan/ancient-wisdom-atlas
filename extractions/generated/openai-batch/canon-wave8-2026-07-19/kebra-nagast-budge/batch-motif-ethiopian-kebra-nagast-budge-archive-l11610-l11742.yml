canonical_text:
  quote: "“God had ordained salvation through the wood of His Cross, in the Tabernacle
    of His Law”"
  summary: The passage answers accusations that Christians worship wood by presenting
    the Ark, wood, Cross, Zion, and the Tabernacle of the Law as divinely ordained
    instruments and symbols of salvation. It lists biblical episodes involving the
    Ark or wood, describes the Tabernacle as refuge, mercy-seat, ship, haven, and
    place of prayer, reports a Marian and angelic devotional claim, and gives Cyril’s
    response using Christ’s teaching on spiritual kinship and the holiness of martyrs’
    memorials and consecrated churches.
  language: English
  quote_policy: quoted
