canonical_text:
  quote: ''
  summary: The passage narrates preparations for departure to Ethiopia with Solomon's
    firstborn son and the firstborn sons of Israelite nobles. The Israelite nobles
    privately resent Solomon for seizing their sons, but publicly praise his wisdom
    and invoke the Abrahamic blessing. The text then reflects on God as universal
    sovereign and judge, the king as divinely empowered ruler, and the impropriety
    of reviling the anointed king, including rewards for a good king and punishments
    for a bad one.
  language: English
