canonical_text:
  quote: ''
  summary: Solomon reflects on the decay and forgetfulness that follow death, advises
    Rehoboam to do good and worship God alone, and commands Zadok to anoint Rehoboam
    as king. Rehoboam is publicly enthroned, Solomon dies and is buried in David's
    tomb, and Israel asks the new king to lighten heavy labor. Rehoboam rejects elder
    counsel for graciousness and hears young martial companions recommend a harsh
    reply.
  language: English
