candidate_motifs:
- id: motif:1
  label: honouring the absent sacred object
  taxonomy_refs:
  - covenant
  basis: The passage says Zion remains with the speakers perpetually, yet must be
    honoured and revered even when not physically present; ritual prayer and sacrifice
    are directed toward Jerusalem and holy Zion.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The passage does not fully define Zion’s material identity here; the motif
    is based on stated ritual reverence and orientation.
- id: motif:2
  label: divine judgment for priestly contempt
  taxonomy_refs:
  - divine_judgment
  basis: The cited speech to Eli warns that contempt for divine offerings leads to
    God turning away and destroying Eli’s seed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a cited biblical exemplum embedded in the speech, not the main
    narrated action of the passage.
- id: motif:3
