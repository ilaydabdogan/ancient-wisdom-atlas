  quote: ''
  summary: The passage gives instructions about honouring Zion and praying toward
    Jerusalem, recounts Zadok delivering the covering of Zion and Solomon's commands
    to David, describes a covenant granting Azaryas's son priestly and protective
    roles, and narrates the company’s miraculous departure under Michael the Archangel's
    guidance until they reach the water of Ethiopia, where the sons of the warriors
    of Israel identify the event as God’s will.
