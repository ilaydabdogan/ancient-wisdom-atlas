canonical_text:
  quote: "“it was impossible to carry Zion away unless she wished it and God wished
    it.”"
  summary: The passage recounts Israel’s request for a king, Samuel’s anointing of
    Saul and David, Saul’s defeat and death, an attempted removal of Zion by Saul’s
    remaining sons, David’s joyful transfer of Zion to Jerusalem, and an argument
    that Zion’s movement to Ethiopia or return depends on the will of God and Zion
    herself. It closes with counsel to Solomon about Jerusalem, the house of God,
    and wisdom contrasted with foolish speech.
  language: English
  quote_policy: quoted
