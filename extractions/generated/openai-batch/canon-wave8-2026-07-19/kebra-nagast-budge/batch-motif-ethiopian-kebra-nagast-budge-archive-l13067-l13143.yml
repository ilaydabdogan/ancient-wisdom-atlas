canonical_text:
  quote: ''
  summary: The passage describes a prophetic sequence in which the Jewish kingdom
    ends, the Kingdom of Christ is established until the False Messiah, the kings
    of Rome and Ethiopia meet in Jerusalem to make offerings, exchange peace and gifts,
    divide the earth, and share royal titulature. It then recounts Kaleb’s return,
    thanksgiving, monastic withdrawal, and appointment of Gabra Maskal; a conflict
    over Zion; God’s judgment assigning Zion and open kingship to Gabra Maskal and
    the chariot with secret rule to Israel; and a concluding claim that Ethiopia receives
    glory because of Zion, the Tabernacle of the Law of God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the kingdom of the Jews will end and the Kingdom of
    Christ will be constituted until the advent of the False Messiah.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Justinus, King of Rome, and Kaleb, King of Ethiopia, meet together in Jerusalem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Archbishop is to prepare offerings; the kings are to make offerings, establish
    the Faith in love, exchange gifts and the salutation of peace, and divide the
    earth from the half of Jerusalem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two kings are to hold a joint royal title connected with Ethiopia, to
    be named with David and Solomon, and this is compared to the manner of the Four
    Evangelists.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After becoming united in a common bond and establishing the right faith, the
    kings determine that Jews are no longer to live, and each leaves a son there;
    the Ethiopian king leaves his firstborn son Israel and returns home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Upon returning to his royal house, the Ethiopian king gives thanks to God,
    offers his body as praise, remains undefiled, enters a monastery, makes his youngest
    son Gabra Maskal king, and shuts himself up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The King of Nagran, son of Kaleb, comes to reign over Zion; Gabra Maskal raises
    armies, journeys in a chariot, and the forces meet and fight at the narrow end
    of the Sea of Liba.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the same night, the two opponents pray from sunset until dawn; God looks
    on both prayers and on the penitent prayer of their father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: God says that one is the elder who stood to perform his father’s will, while
    the younger loved his father and prayed to God for him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: God tells Gabra Maskal to choose between the chariot and Zion, causes him
    to take Zion, and he reigns openly on his father’s throne.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: God makes Israel choose the chariot; Israel reigns secretly, is not visible,
    and is sent to those who have transgressed God’s commandment.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The people associated with Israel’s mission do not build houses, live in tents,
    do not suffer fatigue or thirst, have days double those of ordinary men, and use
    bows and arrows against one whom God hates.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage concludes that God gave the King of Ethiopia more glory, grace,
    and majesty than other kings because of Zion, described as the Tabernacle of the
    Law of God and heavenly Zion.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Respondents affirm that the speaker has spoken well, that the revelation came
    by help of the Holy Spirit, and that it agrees with the book of Damotiyos of Rome.
  category: speech
  evidence_refs:
  - ev:10
