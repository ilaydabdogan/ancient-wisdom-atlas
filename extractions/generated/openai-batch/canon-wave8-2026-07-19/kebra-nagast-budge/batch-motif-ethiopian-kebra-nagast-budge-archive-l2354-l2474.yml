canonical_text:
  quote: ''
  summary: The passage summarizes traditions about Solomon, the Queen of Sheba’s son
    Menyelek, Menyelek’s recognition of Solomon through resemblance and a mirror,
    his later disagreement with Solomon in judgment, the sending of first-born sons
    to Abyssinia, Menyelek’s taking of the Ark of Mary by changing Ark covers, the
    Ark’s refusal to move until a deacon’s body is fully enclosed in its coffin, the
    Ark’s arrival at Aksum and Satan’s abandonment of a building project, and the
    opening theological contents of the Kebra Nagast concerning Zion, the Trinity,
    Adam, Satan, and Christ as the second Adam.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen of Sheba gives her son a mirror and instructs him to use it when
    he goes to Solomon, who is expected to hide from him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon seats a friend in royal robes on the throne while he himself sits
    in a stable dressed in rags.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Menyelek does not honor the throne occupant, compares the occupant’s features
    with his own in the mirror, recognizes Solomon in the stable, and pays homage
    to him there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Solomon identifies Menyelek as his true son and says the other youth is also
    his son but foolish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Menyelek helps Solomon rule, but the people object to being ruled by two chiefs
    after differing judicial decisions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Menyelek advises Solomon to send him away only if the people send their first-born
    sons with him; the people agree to send first-born sons to Abyssinia with Menyelek.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Solomon tells Menyelek to take the Ark of Michael, but Menyelek changes the
    covers of the Ark of Michael and the Ark of Mary and takes the Ark of Mary.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After Menyelek’s departure, Solomon checks for the Ark of Mary during a storm,
    discovers that the Ark present is Michael’s, and sends a messenger after Menyelek,
    who refuses to return the Ark of Mary.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Kayeh Kor, a deacon carrying the Ark of Mary dies and is buried.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Ark of Mary refuses to move until the deacon’s body is reburied with a
    finger that had been left outside the coffin.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: At Aksum, Menyelek and his party find Satan building a house to fight against
    God.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: When Satan hears that the Ark of Mary has come, he stops building, throws
    down what he has built, and leaves; Menyelek uses the collected stones to build
    a church for the Ark of Mary.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: The contents description states that the Trinity lived in Zion, the Tabernacle
    of the Law of God, before God made anything else.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: The contents description states that man was made in God’s image, to take
    Satan’s place and praise God, and that Christ, the second Adam, was born of Mary
    the Virgin, the Second Zion.
  category: other
  evidence_refs:
  - ev:14
