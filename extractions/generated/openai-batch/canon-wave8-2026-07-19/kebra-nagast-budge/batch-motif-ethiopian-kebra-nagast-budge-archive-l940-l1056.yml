  summary: Introductory material recounts scholarly work on Kebra Nagast manuscripts,
    the Ethiopian legend of Solomonic descent through Makeda, the removal of manuscripts
    from Makdala, King John IV's request for the book's return, its restoration by
    the British Museum, and Menyelek II's authorization of Le Roux's French translation.
  language: English with some French quoted material
  quote_policy: summarized
