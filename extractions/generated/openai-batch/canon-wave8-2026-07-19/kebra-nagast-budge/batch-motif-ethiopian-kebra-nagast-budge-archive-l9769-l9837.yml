canonical_text:
  quote: ''
  summary: Elmeyas and Azariah bring out and read a writing before Makeda and Israelite
    leaders. The audience bows and glorifies God, and Zion is described as present
    among them, blessing and protecting them. The Queen counsels her son to follow
    the God-given right, love God, and trust in God and Zion. She asks Elmeyas, Azariah,
    and the mighty men of Israel to protect and teach him. The sons of mighty men
    pledge loyalty to the Queen, the King, and Zion, renouncing reliance on their
    birth country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elmeyas and Azariah bring forth a writing and read it before Makeda and the
    great men of Israel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who hear the words bow down, make obeisance, and glorify God for making
    them hear the commandment and perform divine justice and judgment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zion is said to be among them, to be the habitation of the glory of God, and
    to deliver, bless, protect, and help vanquish enemies; the people of Ethiopia
    rejoice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Queen tells her son that God has given him the right and instructs him
    to walk in it and love the Lord his God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Queen asks Elmeyas, Azariah, and the mighty men of Israel to protect her
    son, teach him the path of the kingdom of God, and preserve the honour and service
    of Lady Zion from generation to generation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Queen warns her son not to be made foolish by drink, women, pride in clothing,
    horse trappings, or weapons, and tells him to place confidence in God and Zion
    for victory, offspring, and the overthrow of adversaries.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sons of mighty men answer with one voice, pledge to remain with the Queen,
    remember the King, and teach him good works if God helps him and he listens to
    his mother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sons of mighty men say the Queen drew them to her as servants with Lady
    Zion, compare this to a loaded camel drawn by a nose-cord, ask not to be treated
    as strangers, and declare hope only in the Queen and Zion.
  category: speech
  evidence_refs:
  - ev:7
