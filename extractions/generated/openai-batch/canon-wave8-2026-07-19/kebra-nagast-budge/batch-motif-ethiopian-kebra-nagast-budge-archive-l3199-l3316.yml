canonical_text:
  quote: ''
  summary: The passage summarizes episodes involving Samson and his son Akamhel, then
    returns to Menyelek’s journey from Jerusalem to Ethiopia with Zion, Makeda’s abdication
    in his favor, Ethiopian adoption of the Hebrew religion, Azaryas’s lawgiving,
    Menyelek’s proclamation as David II, deposition of the Law and Creed in the Ark,
    and Menyelek’s subsequent campaigns with the Ark at the head of his army.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Samson marries a Philistine woman, is made to act as a buffoon by the Philistines,
    and kills large numbers of Philistines in revenge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Samson’s death, Delilah and Maksaba each bear a male child; Akamhel
    is identified as Samson’s son and Tebreles as Maksaba’s son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Akamhel states an intention to reign over Philistia.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During a meal, Akamhel kills Tebreles after Tebreles snatches meat from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maksaba gives Akamhel purple cloths and promises him the throne of Philistia;
    Akamhel takes possession of the throne that evening and is acclaimed king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage notes that the story of Abraham’s visit to Egypt with Sarah is
    told, with an added description of Ishmael’s kingdom.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Menyelek, his company, and Zion travel from Jerusalem to Wakero in one day
    and then proceed toward Makeda’s seat of government.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Menyelek pitches his tent in the plain at the foot of the mountain, and a
    large feast is made with slaughtered oxen and bulls.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Seven hundred swordsmen are appointed to watch over Zion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the third day, Makeda abdicates in favor of Menyelek and gives him horses,
    mares, mules, robes of honor, gold, and silver.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Makeda makes the nobles swear that no woman will rule Ethiopia and that only
    male descendants of her son David will be kings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Zion’s arrival in Ethiopia, the people abandon idols, divination, sorcery,
    magic, and omens, and adopt the religion of the Hebrews.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Menyelek swears obedience to Makeda; Azaryas is assigned as high priest and
