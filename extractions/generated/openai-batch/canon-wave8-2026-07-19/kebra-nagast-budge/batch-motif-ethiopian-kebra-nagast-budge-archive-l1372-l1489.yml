canonical_text:
  quote: ''
  summary: The passage summarizes Menyelek's departure from Solomon, the planned founding
    of an Israel-modeled Ethiopian kingdom, Makeda's request for a talismanic fringe
    from the Tabernacle Zion, and the conspiracy to steal the Tabernacle and carry
    it to Ethiopia. It also notes Solomon's failed pursuit, Menyelek's reception in
    Ethiopia, Makeda's abdication, the establishment of laws associated with Moses,
    later claims about Ethiopian dynastic continuity, symbolic interpretation of Mary
    as the Tabernacle, and the opening of an Arabic account explaining the transfer
    of David's kingdom to Abyssinia and Solomon's problem in building the House of
    the Lord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menyelek saw that Rehoboam would succeed Solomon on the throne of Israel and
    pressed Solomon for permission to depart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon arranged for eldest sons of his nobles to accompany Menyelek to Makeda's
    capital, Dabra Makeda, and for a duplicate Jewish kingdom to be established in
    Ethiopia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Makeda had learned in Jerusalem that Tabernacle Zion in the Temple was the
    abode and dwelling place of the God of Israel, and she requested a portion of
    its covering fringe as a holy talisman.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Menyelek, Tamrin, and eldest sons of Jewish notables entered a conspiracy
    to steal Tabernacle Zion and take it to Ethiopia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stated purpose of stealing the Tabernacle was to keep the God of Israel
    with the conspirators.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tabernacle is described as made of gold and wood after the pattern of
    a heavenly Spirit-Tabernacle, and as containing the Two Tables of the Law, the
    pot of manna, Aaron's rod, and other items.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: An unnamed conspirator removed the Tabernacle from beneath its curtain and
    substituted a wooden construction of the same size and shape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The theft was not discovered until Menyelek, Tamrin, and their company were
    on the road to the Red Sea; Solomon pursued them, but they escaped, and Solomon
    returned to Jerusalem in grief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Menyelek and Tabernacle Zion were received in Makeda's capital with rejoicing;
    Makeda abdicated in favor of Menyelek.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Menyelek established in Ethiopia a kingdom modeled on Israel and introduced
    laws, admonitions, and regulations associated with God and Moses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The introduction says the Kebra Nagast gives little information about Menyelek
    after his coronation except for campaigns against enemies, and is silent about
    Makeda after her abdication.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The introduction states that the author expects readers to assume a long Solomon-and-Makeda
    dynasty in Ethiopia and Hebrew-like religion, law, and customs there.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: The introduction notes chapters that attempt to prove Semitic origin for kings
    of several neighboring and imperial peoples, while criticizing the chapters as
    containing falsified history and bad philology.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The introduction says another group of chapters applies Old Testament prophecies
    about the Messiah to Jesus Christ and identifies the Virgin Mary symbolically
    with the Tabernacle of the Covenant.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Arabic-text heading describes an explanation for the transfer of the kingdom
    of David from Solomon and Jerusalem to the country of the Negus, Abyssinia.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the beginning of the Arabic account, Solomon is commanded to build the
    House of the Lord, but the workmen cannot hew immense stones, their tools break,
    Solomon prays to God for a means, and he commands hunters to bring a young Rukh
    bird.
  category: sequence
  evidence_refs:
