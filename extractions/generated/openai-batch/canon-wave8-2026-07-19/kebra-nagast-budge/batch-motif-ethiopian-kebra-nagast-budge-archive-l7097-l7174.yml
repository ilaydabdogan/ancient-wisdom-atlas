canonical_text:
  quote: ''
  summary: Solomon pursues Ethiopian men after a theft, sending soldiers and horsemen
    to find them. Witnesses in Egypt and Gaza report that the Ethiopians and their
    king, whom Solomon calls his son, traveled with extraordinary speed in wagons
    moving through the air and above the winds. Solomon asks whether Zion, the Tabernacle
    of the Law of God, was with them; the witnesses say they did not see it. An Egyptian
    envoy from Pharaoh also reports seeing the Ethiopians arrive at Cairo after a
    three-day passage on the Takkazi, blowing flutes and traveling like heavenly beings.
  language: English
  quote_policy: summarized
