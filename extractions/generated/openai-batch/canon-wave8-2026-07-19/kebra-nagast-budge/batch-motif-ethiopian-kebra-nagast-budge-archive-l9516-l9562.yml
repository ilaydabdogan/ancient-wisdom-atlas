  quote: the heavenly Zion sending forth light like the sun
  summary: A plate caption identifies the Transfiguration with Christ conversing with
    Moses and Elias on Mount Tabor. The narrative then reports that messengers announce
    to Queen Makeda that her son has become king and that the heavenly Zion has been
    brought. Makeda proclaims the news, summons Ethiopia to meet her son and the heavenly
    Zion, prepares perfumes, and joins the people in rejoicing. David the King arrives
    at his mother's city, sees the radiant heavenly Zion, and Makeda gives thanks
    and performs gestures of praise and celebration.
