canonical_text:
  quote: ''
  summary: The passage includes a plate caption describing Mary with the Child and
    the archangels Michael and Gabriel. In the narrative, Solomon’s son refuses to
    remain in Jerusalem because he longs for his native country and mother, asks for
    a portion of the covering fringe of Zion/the Tabernacle of the Law of God, and
    reports that his mother has removed idol worship and turned her people toward
    Zion. Solomon privately questions why he wants to leave, argues that divine will
    can legitimate irregular lineage, offers him succession, marriage, covenantal
    blessing, and continued access to the Tabernacle. The son answers that he swore
    by his mother’s breasts not to remain or marry there and asks to depart safely
    with Solomon’s blessing.
  language: English
  quote_policy: summarized
