canonical_text:
  quote: ''
  summary: The passage exhorts the audience to worship no other gods, keep God's commandments,
    avoid sinners, teach neighbors to do good, give without usury, distinguish clean
    from unclean foods, and observe purity. It links obedience and blessing in the
    land to the heavenly Zion and the Tabernacle of the Law. It praises Makeda's wisdom,
    says she drew the mighty men of Israel and the Tabernacle by understanding, overthrew
    idols, cleansed her people, and interprets her name as a rejection of sun worship,
    divination, magic, sacrifices to stones and trees, and bird augury in favor of
    trust in God.
  language: English
  quote_policy: summarized
