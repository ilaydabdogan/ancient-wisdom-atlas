  text: God is described as exceedingly angry with Israel and as abhorring the counsel
    of Dathan and Abiram.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Word of God signals the earth, and the earth opens its mouth and swallows
