  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those swallowed go down alive into Sheol, and the earth closes over them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: People associated with the rebels and who had heard their revilings are struck
    by a plague and die immediately.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moses and Aaron come with incense and censers, weep before God, and ask forgiveness
    for the people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In their prayer Moses and Aaron invoke Abraham, Isaac, and Israel and ask
