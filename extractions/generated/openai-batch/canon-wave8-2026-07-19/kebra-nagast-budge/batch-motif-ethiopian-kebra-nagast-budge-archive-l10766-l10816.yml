canonical_text:
  quote: ''
  summary: Israel threatens Moses and Aaron; God judges the rebels Dathan and Abiram
    and their company by the opening earth and by plague. Moses and Aaron intercede
    with incense and prayer, invoking the patriarchs. God has compassion and commands
    rods to be brought and marked by ancestral houses, with Aaron's rod marked and
    Moses' rod unmarked so that a miracle and sign of life may be shown.
  language: English
  quote_policy: summarized
