canonical_text:
  quote: ''
  summary: 'Solomon and the Queen exchange oaths: he will not take her by force, and
    she will not take anything from his house by force. Solomon has water placed where
    she can see it, pretends to sleep, and waits until thirst leads her to take the
    water. He declares that she has broken her oath; she releases him from his oath
    so that she may drink, and they sleep together. Solomon then dreams of a brilliant
    Sun that shines over Israel and then moves to Ethiopia. A later authorial comment
    describes another Sun from Judah that Israel rejects, attacks, entombs, and then
    sees come forth and ascend.'
  language: English
  quote_policy: summarized
