  quote: the majesty of the city had been carried off with them
  summary: A departing caravan secretly places Zion on a wagon and leaves Jerusalem,
    causing citywide lamentation. Solomon grieves that his glory, son, and city majesty
    have departed and interprets the event through prophecies about Ethiopia. He then
    orders Zadok to bring the covering of Zion and sacred associated items and give
    them to his son David, saying Zion will guide him wherever he goes.
  language: English
  quote_policy: quoted
