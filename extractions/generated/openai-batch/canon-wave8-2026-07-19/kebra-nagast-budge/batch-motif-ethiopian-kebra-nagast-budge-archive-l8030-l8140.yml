- id: obs:12
  text: The passage assigns moral descriptions to several lineage figures, including
    Isaac as pure, Esau as arrogant, Jacob as lowly, Judah as innocent, Perez as patient,
    and David as innocent and humble.
  category: attribute
  evidence_refs:
