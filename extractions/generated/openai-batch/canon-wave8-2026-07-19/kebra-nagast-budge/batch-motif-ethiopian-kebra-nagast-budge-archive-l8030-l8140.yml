- id: obs:11
  text: The Pearl is said not to pass into Cain or Abel, but into Seth, and then through
    selected descendants including Abraham, Isaac, Jacob, Judah, Perez, Jesse, David,
    the addressed figure, Rehoboam, and eventually Joachim and Hanna.
