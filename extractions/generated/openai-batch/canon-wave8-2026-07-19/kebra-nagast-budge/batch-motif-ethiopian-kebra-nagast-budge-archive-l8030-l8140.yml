canonical_text:
  quote: Your salvation was created in the belly of Adam in the form of a Pearl before
    Eve.
  summary: The passage presents typological parallels between Moses and Joshua and
    the future Saviour, especially deliverance from Sheol, defeat of Satan and devils,
    Paradise, resurrection, and judgment. It then describes Mary under the title “Our
    Lady of Salvation” and narrates the Pearl of salvation passing through a selected
    ancestral line from Adam toward Joachim and Hanna, with the Saviour’s crucifixion,
    resurrection, and descent to Sheol enabling deliverance.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says that as Moses brought his kinsmen out of servitude in Egypt,
    the Saviour will bring the addressed people out of the servitude of Sheol.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says Moses worked ten plagues before Pharaoh and that the Saviour
    from the addressee’s seed will work ten life-giving miracles before the people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says Moses smote the sea so the people passed as on dry land,
    and that the Saviour will overthrow the walls of Sheol and bring the addressed
    people out.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explicitly interprets the sea as Sheol, Pharaoh as Satan, and
    Pharaoh’s Egyptian hosts as devils.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says the Saviour will feed the delivered people with the food
    of the Garden or Paradise forever and make them dwell without toil after the Resurrection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says Joshua brought the people into the Land of Promise, while
    the Saviour will bring the addressed people into the Garden of Delight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says Joshua slew seven kings of Canaan and destroyed the Canaanites,
    while the Saviour will slay the seven heads of Iblis, destroy sinners, and shut
    them in the fortress of Sheol.
  category: speech
  evidence_refs:
  - ev:4
