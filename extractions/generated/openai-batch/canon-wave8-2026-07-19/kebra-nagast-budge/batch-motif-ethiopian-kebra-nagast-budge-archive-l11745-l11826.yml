  quote: ''
  summary: The passage argues that consecrated wooden tabernacles and scriptural rods
    can become holy or living through divine action. It recounts Moses' rod becoming
    a serpent and overcoming the magicians' serpent-rods. It then presents Abraham
    as justified by faith and as receiving, through Melchizedek at Salem, a sign involving
    water, bread, wine, an altar, branches, and palm, interpreted as a similitude
    of Christ's coming and Christian salvation.
