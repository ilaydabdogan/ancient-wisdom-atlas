canonical_text:
  quote: ''
  summary: 'The passage narrates two infants or offspring being sent in boxes to be
    cast into a river, an exchange between two handmaidens, and the raising of the
    merchant''s beautiful child as the queen''s son under the name Nabukednasar. It
    then describes Nabukednasar/King of Babylon as descended from Shem, his conquest
    of Jerusalem, arrogance, idolatry, divine abasement, beast-like condition for
    seven years, repentance, and restoration. A new section introduces the King of
    Persia as also descended from Shem and retells the Judah and Tamar episode: a
    levirate refusal punished by God, Tamar''s widowhood, her disguise, Judah''s pledge
    objects, conception, accusation, and her production of the pledge tokens.'
  language: English
  quote_policy: summarized
