candidate_motifs:
- id: motif:1
  label: Infant exposure in a container on water
  taxonomy_refs:
  - ark_vessel
  basis: Children or offspring are placed in boxes and sent to be cast into the river;
    the beautiful child survives the intended exposure through an exchange and is
    brought to the queen.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage says 'box' rather than ark and does not describe the child
    floating or being rescued from the water; the water-exposure pattern is present
    but altered by the handmaidens' exchange.
- id: motif:2
  label: Substituted child raised as royal heir
  taxonomy_refs:
  - royal_legitimacy
  basis: The merchant's beautiful child is exchanged for the queen's bird-like offspring,
    presented to the king as the queen's son, raised in the royal house, and identified
    with the King of Babylon.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not narrate a later recognition of the substitution within
    this excerpt.
- id: motif:3
  label: Genealogical explanation of royal descent
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage explicitly uses descent from Shem to explain the King of Babylon
    and then introduces the King of Persia as likewise of the seed of Shem.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The excerpt begins the Persian genealogy but ends before completing the
    explanation.
- id: motif:4
  label: Arrogant ruler humbled by divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The King of Babylon boasts, worships idols, and is abased by God, placed
    among beasts for seven years, then restored after repentance.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The moral interpretation is explicit in the passage, but details of the
    abasement are summarized briefly.
- id: motif:5
  label: Levirate refusal punished by God
  taxonomy_refs:
  - divine_judgment
  basis: Judah's younger son refuses to raise seed for his brother, spills his seed
    on the ground, and is slain when God sees the act.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The episode is only part of a larger genealogy that is not completed in
    the excerpt.
- id: motif:6
  label: Disguise and pledge tokens reveal concealed paternity
  taxonomy_refs: []
  basis: Tamar changes from widow's clothing into splendid veiled apparel, receives
    Judah's staff, ring, and cap as pledge objects, conceives, and later produces
    the objects when accused.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The excerpt ends abruptly after she produces the objects, so the recognition
    outcome is not included here.
- id: motif:7
  label: Seed, succession, and controlled lineage
  taxonomy_refs:
  - royal_legitimacy
  basis: 'The passage repeatedly frames events through seed and descent: Babylon and
    Persia are tied to Shem, Judah''s son is commanded to raise seed for his brother,
    and Tamar''s pregnancy becomes central to the lineage narrative.'
  evidence_refs:
  - ev:4
  - ev:6
  - ev:10
  confidence: medium
  cautions: The royal consequence of Tamar's pregnancy is not fully developed within
    the excerpt.
comparison_claims:
- id: claim:1
  claim: The box-and-river episode is functionally comparable to an infant-exposure-on-water
    motif family, because the offspring are enclosed in boxes and sent toward a river,
    although the surviving child reaches the palace through exchange before immersion.
  claim_level: same_function
  target: infant exposure in a container on water / ark-vessel pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself does not name another version of the motif and does
    not show a floating rescue; the comparison is functional, not a claim of historical
    contact.
- id: claim:2
  claim: 'The Judah and Tamar material functions as a lineage-and-recognition-token
    pattern: levirate seed is at stake, a veiled encounter occurs, pledge objects
    are retained, and those objects are produced when pregnancy is judged.'
  claim_level: same_function
  target: levirate succession and recognition-token narrative pattern in Israelite
    patriarchal tradition
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt names Judah and Tamar but ends before the full recognition
    scene is resolved; no external source comparison is asserted beyond the nearby
    Israelite narrative pattern present in the passage.
