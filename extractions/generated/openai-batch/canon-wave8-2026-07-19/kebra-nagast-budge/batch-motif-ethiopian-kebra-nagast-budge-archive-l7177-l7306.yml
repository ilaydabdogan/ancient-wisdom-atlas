canonical_text:
  quote: ''
  summary: The passage reports that the Tabernacle of the God of Israel causes Egyptian
    gods and idol towers to fall, and then presents Solomon lamenting that the Tabernacle
    of the Covenant, Zion, or “our Lady” has been taken from Israel. Solomon appeals
    to God’s covenants with the patriarchs and priests, recalls the heavenly origin
    and earthly dwelling of the Tabernacle, remembers building the house for God,
    and interprets the loss as divine anger and removal of glory because Israel failed
    in proper worship and justice.
  language: English
  quote_policy: summarized
