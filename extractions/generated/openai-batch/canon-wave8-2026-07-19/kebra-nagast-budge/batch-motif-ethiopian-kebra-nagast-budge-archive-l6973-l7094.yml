canonical_text:
  quote: ''
  summary: 'Zion is carried toward Ethiopia with cosmic and angelic celebration: the
    sea, sea creatures, birds, angels, spirit beings, and Ethiopians rejoice. Solomon
    tells Zadok a vision in which a sun moves from Judah to Ethiopia and elsewhere,
    and he identifies the sun as a symbol of holy Zion. Zadok inspects the sanctuary
    and finds wooden boards made to resemble Zion''s pedestal instead of Zion. Zadok
    collapses and laments. Solomon orders pursuit of the Ethiopian party to recover
    his son and Zion, while groups in Israel weep because the Tabernacle of the Law
    has been taken away.'
  language: English
  quote_policy: summarized
