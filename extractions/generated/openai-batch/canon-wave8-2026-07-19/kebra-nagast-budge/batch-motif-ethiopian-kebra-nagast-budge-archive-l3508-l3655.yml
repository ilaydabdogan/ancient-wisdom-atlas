canonical_text:
  quote: ''
  summary: The passage opens the Kebra Nagast with praise of the Trinity, describes
    the glory of kings and Zion, presents a divine agreement concerning creation,
    incarnation, and prophetic indwelling, and then moves to reflections on royal
    greatness through Gregory, Adam’s kingship, and the envy of Cain toward Abel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening praises God the Father, Jesus Christ the Son, and the Holy Spirit,
    and states belief in and adoration of the Trinity as one God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The interpretation of the Three Hundred and Eighteen Orthodox Fathers concerns
    splendour, greatness, dignity, and especially the greatness and splendour of Zion,
    described as the Tabernacle of the Law of God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Father, Son, and Holy Spirit are said to have made Heavenly Zion the habitation
    place of their Glory before created things.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Father, Son, and Holy Spirit say, “Let Us make man in Our similitude and
    likeness”; the Son says he will put on the body of Adam; the Holy Spirit says
    he will dwell in the hearts of the Prophets and Righteous; this agreement and
    covenant is fulfilled in Zion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: David is quoted asking God to remember an ancient agreement for salvation
    in Mount Zion where God dwells.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: God makes Adam in his image and likeness, with the purpose of removing Satan
    and establishing Adam and the righteous for praise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the Son will become man and abide in flesh, and that the
    second Adam, Saviour Christ, is born in the flesh of the Second Zion.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Gregory, described as a worker of wonders and miracles, is cast into a cave
    or pit for love of the martyrdom of Christ and suffers tribulation for fifteen
    years.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: While in the pit, Gregory meditates on the greatness of kings and questions
    whether royal greatness consists in soldiers, possessions, or rule over cities
    and towns.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: God appoints Adam as king over everything he created, then drives him out
    of the Garden because of apostasy through the sin of the Serpent and the plotting
    of the Devil.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cain is born at a sorrowful moment and is described as having an ill-tempered
    face and evil appearance; Abel is born later and is described as having a good
    appearance and good-tempered face.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Adam says Abel is his son and the heir of his kingdom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Satan envies Abel and casts envy into Cain’s heart.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cain’s envy is attributed to Adam’s heir statement, to the sister-marriage
    arrangement, and to God accepting Abel’s sacrifice while rejecting Cain’s offering.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Cain kills Abel; the passage describes this as the first fratricide, created
    through Satan’s envy of the children of Adam.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: After killing Abel, Cain trembles, is horribly frightened, and is repulsed
    by his father and his Lord; Seth is then born.
  category: sequence
  evidence_refs:
  - ev:10
