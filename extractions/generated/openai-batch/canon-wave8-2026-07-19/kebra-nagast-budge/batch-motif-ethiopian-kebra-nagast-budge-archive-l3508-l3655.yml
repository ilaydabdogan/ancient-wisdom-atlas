candidate_motifs:
- id: motif:1
  label: Heavenly Zion as covenantal dwelling of divine glory
  taxonomy_refs:
  - covenant
  basis: The passage says the Trinity made Heavenly Zion the habitation of their Glory
    and that a common agreement and covenant was fulfilled in Zion.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage uses Christian theological language; the record should not
    generalize beyond the given Zion-covenant framing.
- id: motif:2
  label: Divinely grounded royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage frames glory and greatness as given by God, asks how kings should
    be judged, and says God appointed Adam king over all creation.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: high
  cautions: This passage begins an argument about kingship but only the opening portion
    is included.
- id: motif:3
  label: Incarnation and sacred birth from Second Zion
  taxonomy_refs:
  - sacred_birth
  basis: The Son says he will put on the body of Adam, and Christ is said to be born
    in the flesh of Second Zion, glossed as the Virgin Mary.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage supports a birth/incarnation pattern, but the phrase “sacred
    birth” is a taxonomy alignment rather than the passage’s own term.
- id: motif:4
  label: Cave confinement as setting for contemplation of wisdom
  taxonomy_refs:
  - wisdom
  basis: Gregory is cast into a cave or pit for fifteen years and there meditates
    repeatedly on the greatness of kings.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not describe a formal initiation or visionary descent;
    it only states confinement, suffering, and meditation.
- id: motif:5
  label: Serpent-linked fall or apostasy
  taxonomy_refs:
  - serpent
  basis: Adam is driven out of the Garden because of apostasy through the sin of the
    Serpent and the plotting of the Devil.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage is brief and does not narrate the Serpent episode in detail.
- id: motif:6
  label: Accepted and rejected sacrifice as trigger for envy
  taxonomy_refs:
  - sacrifice
  basis: Cain envies Abel partly because God accepts Abel’s offering and rejects Cain’s
    offering.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The type of offerings is not described in this passage.
- id: motif:7
  label: Envious sibling fratricide
  taxonomy_refs:
  - sibling_pair
  basis: Satan casts envy into Cain’s heart; Cain kills his brother Abel, and the
    passage calls this the first fratricide.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives a theological cause for the fratricide through Satan’s
    envy; broader comparative use should preserve that context.
- id: motif:8
  label: Chosen heir by favorable appearance
  taxonomy_refs:
  - royal_legitimacy
  basis: Adam judges Abel’s appearance and face as good and names him heir of his
    kingdom, while Cain is described negatively.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage reports Adam’s statement but does not elaborate a full succession
    law.
