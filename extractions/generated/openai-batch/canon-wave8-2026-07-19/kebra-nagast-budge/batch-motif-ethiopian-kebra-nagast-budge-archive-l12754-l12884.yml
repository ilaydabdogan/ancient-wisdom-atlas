canonical_text:
  quote: ''
  summary: 'The passage presents a series of Christian typological readings of biblical
    figures and events: Isaac’s binding, Jacob’s journey, Moses’ rod and revelation,
    Jonah and Daniel’s deliverances, Joseph’s sale and preservation of kin, and patriarchal
    burial practices are interpreted as signs of Christ, resurrection, salvation,
    and inheritance. It closes with a question to Gregory about the Roman royal bridle
    made from Cross nails and the Ethiopian royal chariot containing Zion, both described
    as sources of victory and greatness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isaac commands that he be bound, is offered as a sacrifice, does not die,
    and is redeemed by a ram said to have come down from heaven.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Son of God is described as obedient to His Father unto death, bound, nailed,
    pierced, and made a ransom, while His Godhead does not suffer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jacob departs to Laban’s land with only his staff, gains livestock, begets
    twelve sons, reveals baptism, returns to his own country, and receives Isaac’s
    blessing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that Jacob’s staff signifies both Lady Mary and the wood
    of the Cross, by which Christ redeems His flock and takes possession of people
    from Jews, heathen, and Gentiles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Moses departs to Midian, converses with God, receives knowledge concerning
    resurrection, and is given miracle-working power by means of his staff or rod.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The divine saying about being the God of Abraham, Isaac, and Jacob is interpreted
    in the passage as indicating the Trinity and the resurrection of the dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jonah is swallowed by a great fish, and this is paired with the Redeemer’s
    descent into the heart of the earth and rising on the third day.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Daniel is cast into a sealed lions’ pit and emerges without being devoured;
    this is paired with Christ being placed in a sealed grave and coming forth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Joseph is sold by his brethren and delivers them from famine; Christ is said
    to be sold by Judah and to deliver believers, making them heirs and brethren.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Abraham buys a tomb for his kin’s dead bodies so that they may be joined in
    resurrection, and Sarah, Abraham, Isaac, and Rebekah are associated with burial
    there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Jacob asks Joseph not to bury him in Egypt but in the tomb of his fathers,
    so that his death and subsequent life may be with them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Jacob makes his brethren and children swear not to leave his bones in Egypt
    but to take them to the grave of his fathers when God returns them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Archbishops say that Ethiopian kings became glorious and great through
    Zion, while Roman kings became great through the Cross nails made by Helena into
    a bridle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The bridle made from the nails and the chariot containing Zion are both described
    in relation to vanquishing enemies and royal possession.
  category: object
  evidence_refs:
  - ev:9
