candidate_motifs:
- id: motif:1
  label: bound sacrifice redeemed by substitute
  taxonomy_refs:
  - sacrifice
  basis: Isaac is bound and offered but does not die because a ram redeems him; Christ
    is then described as a ransom.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this through Christian typology rather than as an
    independent sacrificial ritual account.
- id: motif:2
  label: obedient divine son as ransom
  taxonomy_refs:
  - divine_parent_child
  - sacrifice
  basis: The Son of God is obedient to His Father unto death and becomes a ransom.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif label reflects the passage’s theological language.
- id: motif:3
  label: sacred staff as salvific sign
  taxonomy_refs: []
  basis: Jacob’s staff is interpreted as Lady Mary and as the wood of the Cross by
    which Christ redeems His flock; Moses’ staff or rod gives miracle-working power.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage connects two staffs or rods but gives distinct interpretations
    for Jacob and Moses.
- id: motif:4
  label: descent, enclosure, and third-day return
  taxonomy_refs:
  - hero_descent
  - resurrection
  - death_rebirth
  basis: Jonah’s fish, Daniel’s sealed lions’ pit, and Christ’s descent into the earth
    and sealed grave are linked with rising or emergence.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The third-day timing is stated for the Redeemer, not explicitly for Daniel.
- id: motif:5
  label: sold kinsman becomes savior of kin
  taxonomy_refs: []
  basis: Joseph is sold by his brethren yet delivers them from famine; Christ is sold
    by Judah and delivers believers as heirs and brethren.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The kinship and salvation language is explicitly Christianized by the
    narrator.
- id: motif:6
  label: ancestral burial as sign of resurrection reunion
  taxonomy_refs:
  - resurrection
  basis: Abraham’s tomb purchase and Jacob’s burial and bones requests are explained
    as signs that the dead will be raised and reunited with their kin.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage emphasizes resurrection rather than a developed afterlife
    journey.
- id: motif:7
  label: royal power through sacred victory object
  taxonomy_refs:
  - royal_legitimacy
  basis: Rome’s kings are great through the Cross nails made into a bridle, and Ethiopia’s
    kings are glorious and great through Zion and the chariot containing Zion; both
    are linked with vanquishing enemies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage asks about the duration of these objects’ possession but does
    not narrate their origins in detail beyond Helena’s bridle.
- id: motif:8
  label: biblical foreshadowing of Christ
  taxonomy_refs: []
  basis: The section explicitly frames patriarchs and prophets as foreshadowing Christ
    through repeated comparisons introduced by phrases such as in like manner and
    similarly.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: This is an internal interpretive pattern in the passage, not a separate
    taxonomy family supplied in the request.
