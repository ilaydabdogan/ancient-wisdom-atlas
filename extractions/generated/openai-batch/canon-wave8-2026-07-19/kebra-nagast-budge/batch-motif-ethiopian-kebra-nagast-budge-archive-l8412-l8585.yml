canonical_text:
  quote: ''
  summary: The passage presents Rehoboam threatening harsher service and confiscation,
    the people of Israel rejecting his rule and making Jeroboam king by lot, and the
    kingdom dividing. It then argues that God's promise to David remains true through
    Christ, Mary and Joseph's Davidic genealogy, the Ethiopian king as Solomon's firstborn,
    and the Roman line. It closes by introducing the Roman kingdom, Japheth's portion,
    Constantine's building of Constantinople, and a heavenly sign of the Cross in
    battle.
