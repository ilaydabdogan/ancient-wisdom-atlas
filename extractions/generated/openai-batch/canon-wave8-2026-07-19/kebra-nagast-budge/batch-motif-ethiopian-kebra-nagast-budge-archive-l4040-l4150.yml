canonical_text:
  quote: ''
  summary: The passage describes Zion, the Tabernacle of the Law of God, as a heavenly
    and spiritual habitation of divine glory brought down to earth. God commands Moses
    to make an ark or tabernacle of worm-resistant wood overlaid with gold to contain
    the Covenant, including the Two Tables. The passage lists sacred contents and
    furnishings, recounts the Ark being carried to Jerusalem and through the Jordan
    as the waters stand upright, and presents Sinai as the place where God shows Moses
    the pattern and speaks from the cloud. A council of orthodox fathers and bishops
    affirms the descent of the Tabernacle as salvation and connects Zion with Davidic
    promises.
  language: English
  quote_policy: summarized
