canonical_text:
  quote: ''
  summary: The Queen dismounts before the House of God, steps into courtyard water,
    and her goat-like foot is changed after touching a submerged piece of wood. Solomon
    welcomes her, explains that the water was arranged so he could see her foot, and
    the wood is later honored with silver collars and placed in the Temple. The passage
    then says the collars are given to Judas for betraying Christ, the wood is made
    into the Cross, and Christ redeems Adam through the wood, in contrast to Adam's
    fall through the fruit of a tree. The wood and the Cross are described as powerful,
    protective, and connected with resurrection, Judas's death, and the potter's field.
  language: English
  quote_policy: summarized
