canonical_text:
  quote: ''
  summary: The passage contrasts the rejection of Israel with the honoring of Ethiopia
    because Zion has come to Ethiopia. Makeda gives the Ethiopian kingdom to her son
    David/Menyelek, whom she identifies as chosen by God and keeper of the divine
    Pavilion. The king submits to his mother, warns that Ethiopia’s welfare depends
    on obedience to God and proper conduct toward Zion, recounts his anointing by
    Zadok and the appointment of associated priestly and legal figures, and describes
    the commandments as carrying both death and life, likened to fire in one hand
    and water in the other.
  language: English
  quote_policy: summarized
