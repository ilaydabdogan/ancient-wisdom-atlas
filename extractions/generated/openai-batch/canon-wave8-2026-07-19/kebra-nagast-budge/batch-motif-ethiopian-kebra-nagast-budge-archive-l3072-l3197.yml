canonical_text:
  quote: ''
  summary: The passage summarizes introductory material on Jerusalem, the loss of
    the Tabernacle Zion, Solomon's decline under Makshara's influence, angelic rebuke
    and prophecy before Solomon's death, dynastic succession through Rehoboam, genealogical
    links to Mary and Joseph, traditions about Byzantium and Semitic descent, and
    later narratives involving legal judgment, false swearing, exchanged children,
    and royal origins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jerusalem is described as the Gate of Heaven, and the people resolve to do
    God's will so that God may watch over and protect Israel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The loss of the Tabernacle Zion has a sad effect on Solomon; his love for
    God wanes, his wisdom leaves him, and he devotes himself to women late in life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Makshara, an Egyptian princess, seduces Solomon's household into worshipping
    her idols and influences Solomon through her beauty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Makshara reminds Solomon that his Lady Zion has been carried off and urges
    him to worship the gods of her fathers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Makshara ties a scarlet thread across the door of her gods and places three
    locusts in the house of her gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Solomon enters without breaking the thread and kills the locusts; the introduction
    says this somehow becomes an act of worship of Egyptian gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Solomon is said to be regarded in some respects as a type of Christ and is
    enumerated with the Patriarchs despite his weakness and sin.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: When Solomon is sixty and sick, the Angel of Death draws near; Solomon weeps
    and prays for mercy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Angel of God rebukes Solomon for excessive love of women and for marrying
    alien women.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The Angel refers to Solomon''s three sons: David, Rehoboam, and Adrami, the
    son of a Greek slave.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Angel explains that Joseph, Moses, and Joshua were types of Christ, and
    that Christ would spring from Solomon's seed and redeem mankind.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Angel prophesies concerning the Virgin Mary and narrates the history of
    the Pearl passing through a line of bodies from Adam through Joachim to Hanna,
    mother of Mary.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Angel says Michael will remain with the Tabernacle in Ethiopia, Gabriel
    with Rehoboam, and Uriel with Adrami.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Solomon asks when the Saviour will come; the Angel answers that it will be
    after thirty-three generations.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: When told that the Israelites will crucify the Saviour and be scattered over
    the earth, Solomon weeps and laments.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: After Solomon's death, Zadok anoints Rehoboam king and lays a wooden tablet
    bearing Solomon's name upon the Tabernacle.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The people place Rehoboam on the royal mule and acclaim him as royal father.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Because of Rehoboam's arrogant behavior, the people revolt, arm themselves,
    go to Beth Efrata, and make Jeroboam king.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: The Virgin Mary and Joseph the carpenter are described as kin, each descended
    from David, King of Israel.
  category: relationship
  evidence_refs:
  - ev:19
- id: obs:20
  text: A tradition says Byzantium was originally the inheritance of Japhet, son of
    Noah.
  category: relationship
  evidence_refs:
  - ev:20
- id: obs:21
  text: Zanbares, an astrologer and clockmaker, prophesies that Byzantium will pass
    into possession of the sons of Shem.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:22
  text: Zanbares's daughter marries Solomon and bears Adrami, who later marries Adlonya,
    daughter of Baltasor, king of Byzantium.
  category: relationship
  evidence_refs:
  - ev:22
- id: obs:23
  text: Baltasor tests Adrami's ability as a judge by assigning him a difficult property
