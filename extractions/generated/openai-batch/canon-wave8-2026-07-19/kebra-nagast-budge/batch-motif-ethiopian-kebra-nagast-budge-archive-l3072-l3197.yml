  category: action
  evidence_refs:
  - ev:23
- id: obs:24
  text: Adrami decides the case in a way that wins Baltasor's approval and later reigns
    in his place.
  category: sequence
  evidence_refs:
  - ev:24
- id: obs:25
  text: The passage reports narratives concerning false swearing, flight to Babylon,
    a merchant's wife's infidelity, and exchange of children by nurses.
  category: sequence
  evidence_refs:
  - ev:25
