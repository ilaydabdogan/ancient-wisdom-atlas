canonical_text:
  quote: ''
  summary: After the removal of Lady Zion, Solomon speaks of making a substitute in
    the manner of Zion, placing the Book of the Law within it, and trusting God's
    will and covenant mercy. The elders agree not to disclose that Zion has been taken
    away, and they establish a covenant with Solomon. The passage then describes Solomon's
    love for Makshara, daughter of Pharaoh, her richly adorned house, her idol worship,
    Solomon's failure to rebuke her, and God's wrath causing Solomon to forget wisdom.
    Makshara attempts to persuade Solomon to worship Egyptian gods, but Solomon answers
    that such gods are human-made objects and says he will worship only the Holy God
    of Israel and Lady Zion. She accuses Solomon's son by an Ethiopian woman of carrying
    away Zion; Solomon replies that God's will gave Zion to them for worship and refuses
    her idols.
  language: English
  quote_policy: summarized
