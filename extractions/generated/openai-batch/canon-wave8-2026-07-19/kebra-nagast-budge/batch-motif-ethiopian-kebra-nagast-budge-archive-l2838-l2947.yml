canonical_text:
  quote: ''
  summary: Solomon resolves to make Bayna-Lehkem king of Ethiopia and sends Israelite
    first-born sons with him. After anointing, legal and covenantal instructions,
    and sorrow over departure, Azaryas plans and carries out the removal of the Tabernacle
    Zion from the Holy of Holies using a substitute box. The sacred object is carried
    away concealed on a wagon, the covering is given to Bayna-Lehkem for the Queen
    of Sheba, and the departing company is miraculously conveyed under Archangel Michael’s
    guidance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Solomon summons the elders of Israel, states his intention to make Bayna-Lehkem
    king of Ethiopia, and asks that their eldest sons accompany him to establish a
    Jewish colony and kingdom there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zadok the priest and Benaiah anoint Bayna-Lehkem in the Holy of Holies, and
    he receives the name David II.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Solomon orders Zadok to describe curses for disobedience, blessings for obedience,
    the Ten Commandments, and laws concerning sexual and marital conduct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people approve the anointing, but those whose first-born sons must leave
    Jerusalem grieve and secretly curse Solomon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The departing children of Israel grieve over leaving their country, and are
    especially troubled by leaving the Tabernacle of the Law of God behind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Azaryas proposes that they take Zion with them, swears the others to secrecy,
    and devises a plan to replace the Tabernacle with a box of the same size and shape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Azaryas collects money and employs a carpenter to construct the substitute
    box.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage notes an Arabic version in which Solomon’s son has the box made
    and kills the carpenter after the work is completed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Azaryas dreams that God tells him to make Bayna-Lehkem offer a sacrifice before
    departure and to bring the Tabernacle out of the Holy of Holies during the ceremony.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Angel of the Lord appears to Azaryas, opens the doors of the Holy of Holies
    with keys, and instructs him to bring in the replacement box.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Azaryas, Elmeyas, Abesa, and Makari remove the Tabernacle, carry it to Azaryas’s
    house, return to assemble the substitute box, lock the doors, and leave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bayna-Lehkem bids Solomon farewell and receives his father’s blessing after
    the removal has been accomplished.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Azaryas places the Tabernacle Zion on a wagon, covers it with baggage, and
    it leaves Jerusalem amid cries, wails, howls, and screams.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Solomon and his people know instinctively that the glory of Israel has departed
    with the Tabernacle Zion.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Zadok fetches the covering of the Tabernacle and gives it to Bayna-Lehkem,
    together with a gold chain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Archangel Michael leads the company, cuts a path, shelters them from heat,
    and the people, animals, and wagons travel above the ground with great speed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Michael halts the company at Gaza, and another day’s march brings them to
    the Nile frontier after a journey usually requiring thirteen caravan days.
  category: sequence
  evidence_refs:
  - ev:12
