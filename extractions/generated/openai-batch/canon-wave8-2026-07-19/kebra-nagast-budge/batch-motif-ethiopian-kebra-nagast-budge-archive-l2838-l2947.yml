candidate_motifs:
- id: motif:1
  label: Solomonic royal legitimation of Ethiopian kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Bayna-Lehkem is made king of Ethiopia by Solomon’s decision, anointed in
    the Holy of Holies, and named David II, linking him to Davidic lineage.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is an introductory summary rather than the full narrative
    chapters.
- id: motif:2
  label: Covenantal kingship through commandments, blessings, and curses
  taxonomy_refs:
  - covenant
  basis: The new king receives instructions concerning curses for disobedience, blessings
    for obedience, the Ten Commandments, and laws attributed to Moses.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage summarizes legal instruction and does not provide the full
    wording of the commandments or laws.
- id: motif:3
  label: Secret removal of a sacred national object using a decoy
  taxonomy_refs:
  - sacred_theft
  - ark_vessel
  basis: Azaryas plans to take Zion from the Holy of Holies and install a same-sized
    substitute box, and the plan is later carried out.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage also presents divine and angelic authorization, so the episode
    should not be reduced to ordinary theft without qualification.
- id: motif:4
  label: Sacred object as departing national glory
  taxonomy_refs:
  - ark_vessel
  - covenant
  basis: When the Tabernacle Zion leaves Jerusalem, Solomon and his people perceive
    that the glory of Israel has departed with it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The text uses the term Tabernacle Zion; identification with broader Ark
    traditions should be reviewed in the wider work.
- id: motif:5
  label: Sacred gift sent to a queen through a royal son
  taxonomy_refs:
  - sacred_exchange
  basis: The Queen of Sheba requests part of the Tabernacle covering, and Solomon
    sends the full covering to her through Bayna-Lehkem, with a gold chain.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage notes uncertainty about associated objects called five mice
    and ten emerods, so those are not treated as part of the motif extraction.
- id: motif:6
  label: Angelic escort and miraculous rapid journey
  taxonomy_refs:
  - departure
  basis: Archangel Michael leads the company, shelters them, and the travelers and
    wagons move above the ground with extraordinary speed, reaching distant stations
    quickly.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The available taxonomy has no exact label for angelic aerial transport;
    classified under departure only because it occurs during the migration journey.
- id: motif:7
  label: Exodus of first-born companions to found a new kingdom
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: The elders’ eldest sons are sent with Bayna-Lehkem to Ethiopia to found a
    Jewish colony and kingdom, though their families grieve.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage frames this as royal relocation and colonization; broader
