canonical_text:
  quote: ''
  summary: A speaker promises divine support, victory, majesty, and answered petitions
    to an obedient addressee, then gives counsel on patience, righteousness, rebuking
    wrongdoing, protecting the poor and orphans, and judging without bribery or partiality.
    The passage then introduces the Ten Commandments addressed to Israel, including
    exclusive worship of God, prohibition of images, false oaths, Sabbath observance,
    honoring parents, and prohibitions on sexual misconduct, killing, stealing, false
    witness, and coveting. It closes by identifying these commands as God's law and
    ordinance and by describing divine rebuke of sinners.
  language: English
  quote_policy: summarized
