  quote: '"the whole kingdom of the world [belonged] to the Emperor of Rom and the
    Emperor of Ethiopia"'
  summary: Demateyos reports finding a manuscript in the Church of Saint Sophia that
    assigns world dominion to the emperors of Rom and Ethiopia. The passage divides
    the earth from the middle of Jerusalem into their portions, grounds both rulers
    in descent from Shem, Abraham, David, and Solomon, privileges Ethiopia as Solomon's
    firstborn and eldest son, and introduces the Queen of the South as a figure mentioned
    by the Evangelist and by Jesus in connection with the Day of Judgment.
