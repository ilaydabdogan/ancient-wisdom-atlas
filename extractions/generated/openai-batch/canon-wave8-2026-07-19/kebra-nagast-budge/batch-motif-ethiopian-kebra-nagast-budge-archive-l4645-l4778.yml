  quote: ''
  summary: Solomon instructs the Queen that only the Creator should be worshipped
    and speaks about the Tabernacle of the God of Israel and written commandments.
    The Queen renounces sun worship, declares allegiance to the Creator and to the
    Tabernacle for herself, her seed, and her kingdoms, and continues to seek Solomon's
    wisdom. After six months she wishes to return home. The passage then describes
    Solomon's wisdom attracting people and animals, Solomon's desire for seed through
    the Queen, his many wives and concubines, and a later Christian reflection on
    marriage law.
