canonical_text:
  quote: ''
  summary: 'The passage opens with a doctrinal statement by the Three Hundred and
    Eighteen about orthodox faith and Christ''s direction. The narrative then returns
    to Solomon and the Queen of Sheba: Solomon invites the Queen to observe the administration
    of his kingdom and receive further instruction in wisdom. The Queen replies that
    she has become wise, chosen through faith, and will worship only the God of Israel.
    Solomon prepares his court and royal table with splendor. The Queen is placed
    where she can see and learn without being seen; the space is richly adorned and
    perfumed. Solomon gives her food and drink designed to make her thirsty. After
    the banquet and the departure of attendants, Solomon approaches her privately
    and invites her to remain until daybreak for love''s sake. The Queen asks him
    to swear by the God of Israel that he will not take her by force.'
  language: English
  quote_policy: summarized
