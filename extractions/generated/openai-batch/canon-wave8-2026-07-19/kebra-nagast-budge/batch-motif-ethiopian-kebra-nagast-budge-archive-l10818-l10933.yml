canonical_text:
  quote: ''
  summary: 'The passage narrates Moses'' test of twelve rods before the Tent of Witness,
    where Aaron''s rod blooms and marks him as chosen priest. It then gives an extended
    Christian typological interpretation: Aaron''s rod, Zion, the Tabernacle, the
    pot of manna, the tablets, the pearl, the rock struck by Moses, and the streams
    of water are interpreted in relation to Mary, Christ, the Cross, and the Apostles.'
  language: English
  quote_policy: summarized
