  quote: ''
  summary: The passage combines a list of manuscript plates depicting episodes from
    the life and passion of Christ, Sheol, the Ascension, and the Last Judgement with
    the beginning of Budge's introduction to the Kebra Nagast. The introduction states
    that the book has long been highly esteemed in Abyssinia, is regarded there as
    the history of the Solomonic line and the conversion of Ethiopians from celestial
    worship to the God of Israel, and then surveys early European knowledge of the
    text and its manuscripts.
  language: English
