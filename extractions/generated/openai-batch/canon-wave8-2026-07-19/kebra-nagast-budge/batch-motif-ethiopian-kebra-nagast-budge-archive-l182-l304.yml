canonical_text:
  quote: ''
  summary: The preface explains political reasons for delayed Ethiopic translation
    under the Zague kings, then describes an Ethiopian legend of a Pearl placed by
    God in Adam and transmitted through holy bodies to Hanna and the Virgin Mary.
    It connects Solomon, Christ, Menyelek, and Ethiopian royal descent to divine origin.
    The passage then compares this idea with Egyptian and related traditions in which
    kings are sons of gods such as Ra, Amen, and Ptah-Tanen, including accounts of
    divine conception, royal birth in an egg, temple reliefs, and Alexander’s recognition
    as son of Amen at Siwah.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Kebra Nagast was written to glorify the Solomonic line,
    and that a vernacular translation under the Zague kings would have endangered
    its producers and the work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A legend states that God placed a Pearl in Adam’s body, intending it to pass
    through holy men until it entered Hanna and formed the substance of the Virgin
    Mary.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Pearl passed through Solomon, and identifies Menyelek
    as Solomon’s son by the Queen of Sheba.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Christ was the Son of God, and reasons that Menyelek was
    divine because he was kin to Christ through Solomon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Isaac the Ethiopian is described as maintaining that Ethiopian kings descended
    from Menyelek were of divine origin and that their words and deeds were those
    of gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage presents the divine origin of kings in Ethiopia, the Sudan, and
    Egypt as an old idea, and cites a Westcar Papyrus legend in which three Egyptian
    Fifth Dynasty kings were sons of Ra by Ruttet.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says some Egyptian kings claimed to have reigned in the egg before
    birth, with the egg deposited in the mother by a form of the Sun-god.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes bas-reliefs showing Amen with the mothers of Hatshepsut
    and Amenhetep III, and says Amenhetep III regarded his divine origin as certain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Amenhetep III is said to have placed an effigy of himself with the great gods
    of Egypt and to have shared worship with the gods and goddesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Rameses the Great is said to have been held to be the son of Ptah-Tanen, who
    addresses him as fathering and begetting him like the gods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A later Egyptian story is said to have made Alexander the Great the son of
    Amen; after recognition at Siwah, Egyptians accepted him as king without battle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage begins a Pseudo-Callisthenes version in which Nectanebus II flees
    to Macedon, becomes a magician, and meets Queen Olympias.
  category: sequence
  evidence_refs:
  - ev:10
