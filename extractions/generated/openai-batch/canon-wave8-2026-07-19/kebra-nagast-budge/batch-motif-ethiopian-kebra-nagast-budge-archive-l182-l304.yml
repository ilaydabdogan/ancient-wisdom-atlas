- id: motif:2
  label: royal legitimacy through divine descent
  taxonomy_refs:
  - royal_legitimacy
  - divine_parent_child
  basis: Menyelek’s divinity and the divine origin of Ethiopian kings descended from
    him are used to authorize their status; Egyptian and Alexandrian examples likewise
    link kingship to divine parentage.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is a comparative preface rather than a single mythic episode.
- id: motif:3
  label: god begets ruler with human mother
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The passage reports Ra fathering kings by Ruttet, Amen companying with royal
    mothers, Ptah-Tanen fathering Rameses, and Amen acknowledged as Alexander’s father.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: Some examples are summarized from inscriptions or later stories rather
    than narrated directly.
- id: motif:4
  label: pre-birth royal existence in an egg
  taxonomy_refs:
  - sacred_birth
  basis: Some Egyptian kings are said to have reigned in an egg before birth, the
    egg being deposited in the mother by the Sun-god.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The egg is not described as a cosmic egg in this passage; no cosmic-creation
    function is stated.
- id: motif:5
  label: oracle or priesthood validates foreign ruler as divine son
  taxonomy_refs:
  - royal_legitimacy
  basis: Alexander is brought to Amen at Siwah, the god acknowledges him as son, the
    priesthood accepts the declaration, and he gains Egyptian kingship without battle.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage reports the tradition as a later story and a political use
    by Alexander’s councillors.
- id: motif:6
  label: threatened sacred or dynastic text under rival rule
  taxonomy_refs:
  - royal_legitimacy
  basis: The Kebra Nagast is said to glorify the Solomonic line, and its vernacular
    translation during Zague rule is imagined as risking death and destruction because
    the Zague were opposed to that lineage’s claims.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a preface’s historical explanation, not a mythic narrative episode.
