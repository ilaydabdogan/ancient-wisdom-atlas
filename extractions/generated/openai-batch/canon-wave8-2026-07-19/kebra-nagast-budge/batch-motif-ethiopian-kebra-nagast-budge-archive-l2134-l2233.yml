canonical_text:
  quote: ''
  summary: The passage summarizes a Qur'anic and commentarial account of Solomon and
    the Queen of Sheba. Solomon is described as divinely gifted with knowledge, mastery
    over birds, men, and genii, and aerial travel by windborne carpet. A lapwing reports
    the land of Saba, Queen Balkis, her jeweled throne, and her people's sun worship.
    Solomon sends the lapwing with a perfumed, sealed letter demanding submission.
    Balkis consults her nobles, sends rich gifts, then resolves to submit after Solomon
    rejects the gifts and threatens invasion. Before she arrives, Solomon asks who
    can bring her guarded throne; an Ifrit offers, and a person with knowledge of
    books offers to do it even faster, with commentators debating that figure's identity.
  language: English
  quote_policy: summarized
