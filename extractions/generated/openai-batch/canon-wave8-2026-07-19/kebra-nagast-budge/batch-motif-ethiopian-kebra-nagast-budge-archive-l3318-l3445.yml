canonical_text:
  quote: ''
  summary: The passage summarizes chapters in which Isaac asserts Ethiopian royal
    exaltation through heavenly Zion, lists Christian typological interpretations
    of Hebrew Bible figures and objects as symbols of Christ and Mary, recounts the
    rebellion of angels who become embodied and beget giants destroyed by the Flood,
    describes God and Christ in cosmic creator terms, and presents several wooden
    objects, especially arks and the Cross, as instruments of salvation. It also notes
    Abraham's visit to Melchizedek and the mystery of bread and wine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isaac states that the King of Ethiopia is more exalted than other earthly
    kings because of the glory and greatness of heavenly Zion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Christ's coming was known to the Prophets of Israel,
    that the Law proclaimed Christ, and that the Holy Spirit existed at Creation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several figures and objects are explicitly said to symbolize Christ, including
    the brazen serpent, Isaac, the ram of sacrifice, coals in a censer, Aaron's rod-bud,
    manna, the rock struck by Moses, and the offering on the altar.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
- id: obs:4
  text: Several figures and objects are explicitly said to symbolize Mary, including
    the closed door, burning bush, censer, Aaron's rod, Ark made by Moses, and pot
    holding manna.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The rock struck by Moses, Moses' rod, water from the rock, the three days
    of darkness in Egypt, the Amalekites, and Aaron and Hor are each assigned Christian
    symbolic correspondences.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rebel angels are angered by Adam's creation, ask to be made like Adam and
    tested, receive flesh, blood, and human-like hearts, descend to earth, and mingle
    with the children of Cain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The daughters of Cain conceive children who emerge by splitting open their
    mothers' bodies, grow into giants whose height reaches the clouds, and are destroyed
    by the waters of the Flood after 120 years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: God tells Noah to build an Ark, and the passage says the wood of that Ark
    saved Noah as the wood of the Cross saved mankind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: God is described as everywhere and in everything, above the Seven Heavens,
    beneath the deepest deep and thickest darkness, and as balancing all creation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Christ is described as the Beginning, Maker, Creator, Light of Light, God
    of God, Refuge, Feeder, and Director.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ark or Tabernacle symbolizes the horns of the altar and the tomb of Christ;
    the altar offering symbolizes and is the Body of Christ.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Noah's Ark wood, the wood of Manbar, the thicket that caught the ram, Jacob's
    rods in running water, the wood of Moses' Ark, and the wood of the Cross are placed
    in a sequence of salvific wooden objects.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Abraham visits Melchizedek, who gives him the mystery of bread and wine, connected
    in the passage with Passover.
  category: action
  evidence_refs:
  - ev:8
