canonical_text:
  quote: ''
  summary: The passage teaches that priests and bishops should not be reviled, because
    they belong to God’s house and are charged with rebuking sins. It describes priests
    with images of salt, lamp, light, and sun, contrasts them with fiery Seraphim,
    and instructs priests to rebuke kings and prominent sinners without fear. It cites
    Isaiah, Samuel, and Elijah in relation to royal rebuke, contrasts old Israel’s
    reviling and crucifixion of the Saviour with peaceful Christian believers, and
    says the king’s enemies will be scattered by the Cross of Jesus Christ.
  language: English
  quote_policy: summarized
