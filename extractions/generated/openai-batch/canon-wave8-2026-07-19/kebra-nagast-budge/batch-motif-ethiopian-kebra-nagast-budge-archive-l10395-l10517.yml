canonical_text:
  quote: ''
  summary: The passage presents ecclesiastical attestation for the text, affirms the
    exalted status of the Ethiopian king as King of Zion and firstborn of Shem, recounts
    Christ’s incarnation, miracles, crucifixion, resurrection, ascension, and future
    judgment, contrasts Jewish rejection with Ethiopian belief, identifies Ethiopia
    and heavenly Zion as chosen divine habitation, and introduces Gregory’s explanation
    of Mary as likeness of heavenly Zion and of the Law placed in Zion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A manuscript is said to have been found in the Church of Sophia in Constantinople,
    and ecclesiastical authorities affirm its written tradition from Solomon’s time
    and later prophets.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Kebra Nagast teaches that the King of Ethiopia is honourable,
    King of Zion, firstborn of the seed of Shem, and connected with God’s habitation
    in Zion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The King of Rome is described as anointed of the Lord because of the wood
    of the Cross.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A figure called the Pearl is said to give birth to the Sun of Righteousness,
    who hides himself in a human body, becomes like humans, and walks among them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sun of Righteousness performs signs and wonders, including raising the
    dead, healing the sick, giving sight to the blind, opening the ears of the deaf,
    cleansing lepers, and feeding the hungry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wicked children of Israel are said to envy him, crucify him on the wood
    of the Cross, and kill him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: He rises from the dead on the third day, goes up into heaven in glory, and
    receives an incorruptible kingdom from the Father over all created beings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says he will judge the living and the dead and reward each person
    according to works; it also contrasts condemnation of Jews with rejoicing of Orthodox
    believers who walk in Christ’s commandments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The saints say the Ethiopian king is more exalted than other kings because
    of heavenly Zion, and that God loves Ethiopia because Ethiopians destroyed idols
    and believed one trustworthy disciple.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bishops state that the people of Ethiopia are the chosen ones of the Lord
    and that heavenly Zion is the habitation of God, the Tabernacle of His Law and
    Covenant, and a mercy-seat for creation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gregory says salvation is given to Christian believers who believe in Lady
    Mary, the likeness of heavenly Zion; he says the Lord dwelt in the Virgin’s womb
    and was born without carnal union.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Gregory says the Ten Words of the Law were written by the Finger of God and
    placed in Zion, the Tabernacle of the Law of God.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gregory proposes to declare from Moses and the Prophets the prophecies concerning
    Christ and to begin with the beginning of the Book.
  category: speech
  evidence_refs:
  - ev:7
