- id: obs:1
  text: Solomon tells the Queen that wisdom and understanding spring from her, while
    his own wisdom is given by the God of Israel because he asked for it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Solomon describes himself as a vassal and slave of his God who serves around
    the sanctuary, the Tabernacle of the Law of the God of Israel, called holy and
    heavenly Zion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Solomon says he speaks, goes, acts, and understands only according to what
    God makes him do or know.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Solomon says God made him flesh from dust, a solid man from water, and fashioned
    him from an ejected drop into God's likeness and image.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A labourer passes before Solomon carrying a stone on his head, a skin of water
    on his neck and shoulders, food and sandals at his loins, and pieces of wood in
    his hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
