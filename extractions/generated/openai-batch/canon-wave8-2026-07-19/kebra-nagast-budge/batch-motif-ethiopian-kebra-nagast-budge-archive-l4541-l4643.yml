  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Solomon says he and the labourer are both human beings with the same death
    and life, and that the labourer is stronger for work because God gives power to
    the feeble as He pleases.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Solomon instructs the Queen that humans should exercise kindness and love
    on earth and compares humans to grass that withers and is burned in fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Solomon says disobedience, iniquity, magic, sorcery, and idol worship make
    the honoured contemptible; doing good makes a person like God, while sin makes
    a person like the Devil.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Solomon says the arrogant will be judged with the Devil, while the lowly-minded
    and humble will rejoice in God's kingdom, and he defines wisdom as compassion
    and fear of God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Queen praises Solomon's voice and words and asks whom it is right for
