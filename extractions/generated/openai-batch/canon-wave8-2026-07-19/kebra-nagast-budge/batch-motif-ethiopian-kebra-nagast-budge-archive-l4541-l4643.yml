canonical_text:
  quote: ''
  summary: Solomon tells the Queen that wisdom comes from the God of Israel and that
    he serves the divine will at the sanctuary, the Tabernacle of the Law. Seeing
    a labourer, Solomon compares himself with the man to teach shared mortality, humility,
    kindness, and divine judgment. The Queen praises Solomon's speech and asks whom
    she should worship, describing her people's sun worship and other object worship,
    and reporting what she has heard of Israel's God, heavenly Tabernacle, Tablet,
    Moses, and commandments.
  language: English
  quote_policy: summarized
