  quote: ''
  summary: Introductory prose reviews manuscript catalogues, Bezold's Ethiopic edition,
    the manuscript basis of the translation, uncertainty about the compiler and date,
    and scholarly debate over a colophon that claims a Coptic-to-Arabic-to-Ethiopic
    transmission history for the Kebra Nagast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Catalogues of Ethiopic manuscripts in Oxford, London, and Paris supplied information
    about the Kebra Nagast, but chapter headings alone were considered insufficient
    for judging the work's literary and historical value.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1882 C. Bezold undertook an edition of the Ethiopic text from the best
    manuscripts, with a German translation; the work appeared in 1909.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief manuscript authority for Bezold's edition is described as a manuscript
    sent as a gift to Louis Philippe by Sahla Dengel, King of Ethiopia, and as the
    oldest known codex of the Kebra Nagast.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Budge collated much of British Museum Codex Oriental 818 against Bezold's
    text and describes the variants as numerous but mostly not important, chiefly
    due to scribal haste, carelessness, or fatigue.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bezold's text is said to represent the form of the Kebra Nagast considered
    authoritative by Ethiopian priests and scribes, and Budge states that his English
    translation is made from it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The codices are said to give no definite information about the compiler, date,
    or circumstances of compilation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Scholars cited in the passage proposed or discussed dates around the fourteenth
    century and around the restoration of the so-called Solomonic line under Tasfa
    'Iyasus or Yekuno 'Amlak.
  category: speech
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:8
  text: A colophon found in several codices states that the Ethiopic text was translated
    from Arabic, and that the Arabic was translated from Coptic by Abu 'l-'Izz and
    Abu 'l-Faraj during the reign of Gabra Maskal, when George was Patriarch of Alexandria.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dillmann rejected the colophon, Zotenberg saw no general reason to doubt it
    but suggested the claim of a Coptic archetype may have added authority, and Wright
    regarded the Kebra Nagast as an apocryphal work of the fourteenth century.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
