canonical_text:
  quote: I will not tell the matter to the king until we have travelled far.
  summary: Azaryas devises a plan involving wooden planks and a carpenter so that
    Zion, the Tabernacle of the Law of God, can be removed without informing King
    Solomon. In a dream the Angel of the Lord instructs him to offer prescribed sacrifices,
    says David should petition Solomon, and explains that the Tabernacle will depart
    from Israel by God's will. Azaryas reports the dream to his companions; David
    petitions Solomon to depart and sacrifice; Solomon prepares extensive offerings
    and David asks that Azaryas offer them.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Azaryas tells his companions to give him money so he can pay a carpenter to
    prepare planks of wood according to the height, breadth, length, and size of Zion,
    while giving the carpenter a raft explanation connected with sea travel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Azaryas says he will take the wooden framework, set it in the habitation of
    Zion, drape it with Zion's draperies, take Zion, hide Zion in a hole in the ground,
    and not tell the king until they have travelled far.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The companions each give Azaryas ten didrachmas; he gives the money to a carpenter,
    who makes a piece of work from remains of the wood of the house of the sanctuary.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: While Azaryas sleeps, the Angel of the Lord appears and instructs him to take
    four yearling goats, four pure yearling sheep, and an ox that has never borne
    a yoke, and to offer them around Zion in specified positions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Angel says David should ask Solomon for permission to offer sacrifice
    to Jerusalem and Zion, and that David should request the son of the priest to
    offer the sacrifice on his behalf.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Angel instructs Azaryas to bring forth the Tabernacle of the Law of God
    after offering the sacrifice and says that this is from God because Israel has
    provoked God to wrath.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After waking, Azaryas rejoices, remembers the dream, and remembers that the
    Angel had sealed him with the sign of the Cross, strengthened him, and heartened
    him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Azaryas tells his companions that the Tabernacle of the Law of God has been
    given to them, that God has made blind His eye regarding the kingdom of Israel,
    that its glory has been given to others, and that Solomon's kingdom will be divided.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: David, son of Solomon, sends Yoas to Solomon and asks to depart to his own
    country with Solomon's gifts and to offer a propitiatory sacrifice in Jerusalem
    and Zion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Solomon rejoices, commands the altar of offering to be prepared, and gives
    David large numbers of animals, clean birds, flour, and bread for sacrifice; David
    again asks that Azaryas offer the sacrifice on his behalf.
  category: action
  evidence_refs:
  - ev:6
