  quote: ''
  summary: Abraham and Sarah travel to Egypt during famine. Abraham asks Sarah to
    identify him as her brother to preserve his life. Pharaoh takes Sarah, but an
    angel with a fiery sword confronts him and orders him to return her with gifts.
    Pharaoh returns Sarah, gives Hagar and wealth, and sends Abraham away in peace.
    Hagar bears Ishmael; Sarah later bears Isaac; God promises Ishmael many descendants
    and establishes the covenant with Isaac.
