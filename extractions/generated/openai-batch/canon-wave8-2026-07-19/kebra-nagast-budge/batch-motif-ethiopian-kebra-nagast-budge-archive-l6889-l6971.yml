canonical_text:
  quote: '"for thou art the habitation of the God of heaven."'
  summary: David, son of Solomon, praises Zion as splendid, desirable, and the habitation
    of God; his words are described as prophetic. The people of Ethiopia rejoice with
    instruments and songs. Their handmade idols and high towers fall and break when
    Zion shines like the sun. Zion is dressed, placed on a purple-draped wagon, and
    carried onward with song. The wagon resumes its journey, the people are lifted
    up, Egyptians see Zion moving in the heavens like the sun, and the procession
    reaches the Red Sea. The passage recalls Moses and Israel crossing the divided
    sea and says that when holy Zion crosses with her attendants, the sea receives
    them with leaping, roaring, and thunderous waves.
  language: English
  quote_policy: quoted
