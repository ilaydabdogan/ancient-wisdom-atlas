  text: The Queen says she and her people will follow the addressees' commandments,
    withdrawing from what displeases God and drawing near to what pleases God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Queen asks the addressees to instruct all the people and teach them words
    of knowledge.
  category: action
  evidence_refs:
