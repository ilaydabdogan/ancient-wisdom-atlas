canonical_text:
  quote: ''
  summary: The Queen addresses the Children of Israel as guardians and teachers of
    the Law of God, asks them to instruct her people, praises wisdom and knowledge
    through images of water, nourishment, protection, descent into the sea, a pearl,
    a lamp, a star in the womb, and sun-fire, then claims divine habitation and honor
    for Ethiopia through Zion and Jacob. She exhorts nobles to righteousness and forbids
    former practices of augury, charms, incantations, portents, and magic, then asks
    Azariah to speak of love for Our Lady and her Heavenly King.
  language: English
  quote_policy: summarized
