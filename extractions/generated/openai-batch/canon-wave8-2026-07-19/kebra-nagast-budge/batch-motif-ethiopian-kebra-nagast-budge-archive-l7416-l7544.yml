canonical_text:
  quote: ''
  summary: An angelic message comforts Solomon with the Davidic throne promise and
    tells him to return and build God's house. Solomon returns to Jerusalem and mourns
    with the elders and Zadok over Zion. The elders console him by recounting an earlier
    episode in which the Philistines captured Zion, placed the Tabernacle of the Law
    in Dagon's house, suffered Dagon's destruction, mice, and sores, then returned
    Zion with gold offerings by means of a wagon drawn by two she-camels whose straight
    path showed divine compassion.
  language: English
  quote_policy: summarized
