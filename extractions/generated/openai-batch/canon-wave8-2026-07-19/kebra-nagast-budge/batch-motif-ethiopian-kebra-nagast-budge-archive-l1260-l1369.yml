canonical_text:
  quote: ''
  summary: The introduction explains the Kebra Nagast as presenting the heavenly Zion
    or Tabernacle of the Law as voluntarily coming from Jerusalem to Ethiopia, and
    as grounding Ethiopian kingship in descent from Solomon, David, Abraham, and kinship
    with Christ. It describes Zion as a heavenly habitation copied by Moses in wood
    and gold, housed in Solomon’s Temple, and treated as the visible emblem of God.
    It then summarizes how Solomon’s wisdom became famous through trade, how the Queen
    of the South, called Makeda in Ethiopian writings, came to Jerusalem to test him,
    became his wife, bore Menyelek, and later sent the young man to Solomon, where
    he was recognized as Solomon’s son and honored royally.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Kebra Nagast presents the spiritual and heavenly
    Zion as coming of its own free will from Jerusalem to Ethiopia and links the Ethiopian
    king to Solomon, David, Abraham, and the early Patriarchs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Ethiopia was to be believed specially chosen by God as the
    new home of the spiritual and heavenly Zion after the Jews had become unworthy
    of it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zion is described as originally immaterial in heaven, the habitation of God;
    Moses made a wood-and-gold copy under divine directions and placed in it the Two
    Tables of the Law, the pot of manna, and Aaron’s rod.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The material Zion was placed by Solomon in the Holy of Holies of the Temple
    and treated as the visible emblem of God and the material duplicate of the heavenly
    Zion.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Solomon’s wisdom became widely known through merchants and caravans that traded
    around the Red Sea and supplied materials for the Temple and palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tamrin is identified as a caravan leader who managed the business affairs
    of the Queen of the South; Arab writers call her Balkis and Ethiopian writers
    Makeda, while the passage expresses doubt about these names and her origin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After hearing Tamrin’s account of Solomon’s wisdom, the queen decided to go
    to Jerusalem and ask Solomon difficult questions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Jerusalem the queen lodged in quarters prepared by Solomon, conversed frequently
    with him, and was impressed by his appearance, piety, wisdom, and eloquence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After a banquet Solomon took Makeda to wife; when she knew she was pregnant,
    she received a ring as a token from Solomon and returned to her own country, where
    Menyelek was born.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: When Menyelek reached early manhood, he pressed Makeda to let him see Solomon;
    she gave him Solomon’s ring and sent him to Jerusalem under Tamrin’s care.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Gaza and Jerusalem people recognized Menyelek’s likeness to Solomon and
    paid him royal honors; Solomon proclaimed his parentage, embraced him, clothed
    him royally, and seated him on the royal throne with him.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
