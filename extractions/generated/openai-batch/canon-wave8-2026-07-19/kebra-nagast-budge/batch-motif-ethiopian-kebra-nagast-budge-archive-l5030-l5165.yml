canonical_text:
  quote: she brought forth a man child
  summary: The Queen returns toward her own country, gives birth to a son later named
    Bayna-Lehkem, restores order in her kingdom, and eventually sends the grown youth
    with Tamrin to visit Solomon. The passage states a dynastic law favoring Solomon's
    male seed, rejects worship of natural and made objects, asks for the fringes of
    the covering of holy Zion, and describes the Queen giving the youth Solomon's
    ring as a sign for recognition and covenant memory.
  language: English
  quote_policy: quoted
