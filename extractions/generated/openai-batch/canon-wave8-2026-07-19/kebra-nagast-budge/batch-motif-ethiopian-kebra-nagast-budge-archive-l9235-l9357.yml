canonical_text:
  quote: ''
  summary: The passage recounts how Delilah and her sister Maksaba, both widowed and
    pregnant, live together after the deaths of Samson and Kwolason. Maksaba rules
    the remaining Philistines until her son Tebreles is born and later enthroned.
    Delilah's son Akamhel challenges his exclusion from the throne, kills Tebreles
    during a meal, is pacified with royal purple clothing, and is then substituted
    for the dead king. The passage closes by claiming that the Philistine kingdom
    became the possession of the son of Samson and his descendants, and therefore
    belonged to the seed of Shem.
  language: English
  quote_policy: summarized
