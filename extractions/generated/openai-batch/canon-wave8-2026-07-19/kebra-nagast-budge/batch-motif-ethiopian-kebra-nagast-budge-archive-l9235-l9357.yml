candidate_motifs:
- id: motif:1
  label: Widowed queen regent and unborn royal successor
  taxonomy_refs:
  - royal_legitimacy
  basis: Maksaba rules after the Philistine warriors are dead, while the people identify
    the child in her belly as the future ruler.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents a political succession expectation, not a miraculous
    or sacred birth.
- id: motif:2
  label: Rival children raised together in a royal household
  taxonomy_refs:
  - royal_legitimacy
  basis: The two sons are raised together in royal state, but Akamhel later challenges
    why he does not reign on the throne given to Tebreles.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The boys are cousins, not brothers; the passage does not label them as
    twins or siblings.
- id: motif:3
  label: Meal-time quarrel leading to royal murder
  taxonomy_refs: []
  basis: A quarrel over flesh taken from a dish leads Akamhel to behead Tebreles during
    the meal.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy family directly matches the food quarrel and beheading
    sequence.
- id: motif:4
  label: Royal regalia used to pacify and authorize a claimant
  taxonomy_refs:
  - royal_legitimacy
  basis: Maksaba gives Akamhel purple clothing worn by kings and tells him that he
    will sit on the Philistine throne.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly describe a formal coronation ritual at
    the moment the clothing is given.
- id: motif:5
  label: Dynastic transfer by murder, concealment, and substitution
  taxonomy_refs:
  - royal_legitimacy
  basis: Tebreles is secretly buried, his absence is explained as sickness, and Akamhel
    is seated in his place before the court.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage reports the substitution but does not state whether the court
    knows about the murder.
- id: motif:6
  label: Lineage claim over a kingdom through seed descent
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage states that the kingdom became Akamhel’s and his seed’s after
    him, and concludes that the Philistine kingdom belongs to the seed of Shem.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The genealogy is asserted by the narrator within the passage; no external
    corroboration is supplied here.
