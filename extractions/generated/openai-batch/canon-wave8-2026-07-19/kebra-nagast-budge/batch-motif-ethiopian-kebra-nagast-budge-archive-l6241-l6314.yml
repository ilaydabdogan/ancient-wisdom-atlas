canonical_text:
  quote: ''
  summary: The children of the nobles of Israel, ordered to depart with the king's
    son, secretly deliberate about their departure, their loyalty to Lady Zion, and
    the danger of opposing royal and paternal commands. Azaryas asks them to swear
    secrecy, proposes taking Lady Zion with them, and receives their support. Zechariah
    discusses Azaryas's access to the House of God, the keys, hidden openings made
    by Solomon, and the prospect of departing with Zion to Ethiopia.
  language: English
  quote_policy: summarized
