canonical_text:
  quote: "“God hath taken the Tabernacle of His Covenant away from us”"
  summary: Solomon laments collective sin and loss of honor, condemns priests, governors,
    and people for preferring impure and worldly practices over God’s commandment,
    says God has removed the Tabernacle of the Covenant and given it to obedient people,
    recalls an oath about cosmic order and non-destruction by flood or fire, then
    weeps while the Spirit of Prophecy says the event occurred by God’s will and Zion
    was given to Solomon’s firstborn son.
  language: English
  quote_policy: quoted
