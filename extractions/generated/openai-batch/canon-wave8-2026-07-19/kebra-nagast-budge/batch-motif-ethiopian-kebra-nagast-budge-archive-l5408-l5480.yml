canonical_text:
  quote: ''
  summary: Solomon's son is recognized through his Davidic likeness and a ring given
    by his mother. The son asks for part of the Tabernacle covering so his mother's
    kingdom may worship it. Tamrin relays the Queen's request that Solomon anoint
    and bless the young man as king over her country, end female rule there, and send
    him home safely. Solomon refuses to return him to the Queen, claims him as his
    firstborn son, and says he will make him king over Israel. Solomon gives him food,
    garments, gold, and silver and urges him to stay where the House of God and Tabernacle
    are; the son replies that he came to hear Solomon's wisdom, see him, honor him,
    and then return to his mother and country.
  language: English
  quote_policy: summarized
