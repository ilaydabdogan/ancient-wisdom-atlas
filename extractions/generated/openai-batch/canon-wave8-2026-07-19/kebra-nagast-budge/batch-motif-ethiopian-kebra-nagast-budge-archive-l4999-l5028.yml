canonical_text:
  quote: '"this ring shall be unto it a sign"'
  summary: The Queen prepares to depart from Solomon. Solomon privately gives her
    a ring as a token of remembrance and as a sign for any child conceived by them,
    especially a male child who should come to him. He reports a dream in which a
    sun rises over Israel, leaves, and lights Ethiopia, and he says Ethiopia may be
    blessed through the Queen. He exhorts her to worship God and describes God’s power
    to judge, humble, exalt, give life and death, and rule all realms. Solomon and
    the Queen then separate.
  language: English
