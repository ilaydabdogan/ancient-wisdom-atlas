canonical_text:
  quote: ''
  summary: An unnamed woman presses Solomon to fulfill her request, obtains an oath
    by the God of Israel, and sets a task involving a scarlet thread and three locusts
    in the house of her gods. Solomon performs the act, which she describes as sacrifice
    and worship to her gods. The narrator explains the act as sin caused by oath-bound
    compliance and expands into a warning against foreign women, idolatry, seduction,
    and the fall of great biblical men. A later section discusses Solomon's idolatry,
    divine mercy, and comparison with David's sin and repentance.
  language: English
  quote_policy: summarized
