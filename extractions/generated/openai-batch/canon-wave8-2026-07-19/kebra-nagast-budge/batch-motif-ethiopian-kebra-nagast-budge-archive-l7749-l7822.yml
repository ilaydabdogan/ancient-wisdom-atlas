- id: obs:1
  text: The woman repeatedly seeks something from Solomon, while he continues to refuse
    her request despite her gracious behavior.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman beautifies and scents herself, then behaves haughtily and disdainfully
    toward Solomon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Solomon asks what she wants and promises to do it; she requires him to swear
    by the God of Israel, and he swears to give and do what she asks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The woman ties a scarlet thread at the middle of the door of the house of
    her gods and places three locusts inside.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman tells Solomon to come without breaking the scarlet thread, bend
    down, kill the locusts, and pull out their necks; Solomon does so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman states that Solomon has sacrificed to her gods and worshipped them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The narrator states that Solomon acted because of his oath, even though he
    knew entering the house of her gods was an offence or sin.
  category: other
  evidence_refs:
  - ev:2
- id: obs:8
  text: The narrator reports a divine command to the children of Israel not to marry
    strange women, lest they be corrupted through those women's gods, works, voices,
    and forms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The narrator lists Solomon, David, Samson, Amnon, and Adam as men seduced
    by women, and attributes the origin of such seduction to Eve.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that Solomon committed a very great sin through idol worship
