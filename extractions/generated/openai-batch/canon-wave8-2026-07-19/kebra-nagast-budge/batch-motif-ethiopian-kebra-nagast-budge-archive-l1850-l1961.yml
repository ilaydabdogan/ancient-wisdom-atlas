canonical_text:
  quote: ''
  summary: The Queen of Sheba bears a son named David, reveals Solomon as his father,
    gives him Solomon’s ring, and sends him to Jerusalem. Solomon recognizes the young
    man through the ring, crowns him, and seats him on David’s throne. The passage
    then describes the Tabernacle of the Covenant in the House of the Lord, its sacred
    contents, and its miraculous rising as a sign of accepted prayer. The son sees
    this and resolves to carry the Tabernacle to his own country, but Solomon warns
    that only priests may carry it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen returns to her country, gives birth to a male child, names him David,
    and raises him in great state and splendour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the son reaches manhood, he is described as hale, strong, wise, and understanding
    like his father.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son asks his mother who his father is, and she identifies Solomon, son
    of David, Prophet of God and King of Israel, as his living father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Queen says she holds the seal of the father’s kingdom for her son so that
    he may become king over Abyssinia, and she attributes this transfer of kingship
    to God’s will.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Queen sends her son to Jerusalem with gifts and soldiers to pray, see
    his father and his father’s kingdom, hear Solomon’s wisdom, and be made king according
    to a covenant between Solomon and the Queen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Queen places Solomon’s ring on her son’s right hand before his journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Solomon’s palace, the young man mounts Solomon’s riding beast and takes
    up a sword, which displeases Solomon though he conceals it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After seeing the ring and becoming certain of its significance, Solomon embraces
    the young man, welcomes him as son of David, crowns him with David’s crown, seats
    him on David’s throne, and has him publicly proclaimed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tabernacle of the Covenant is located in the House of the Lord built by
    Solomon and contains the two stone Tablets written by the Finger of God, Aaron’s
    rod, and a pot or chest of manna.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tabernacle is covered with gold plates and draped with cloth woven with
    gold.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: When priests pray and finish prostrations, the Tabernacle’s rising from the
    ground signals that supplications have been accepted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the Tabernacle does not rise, priests understand that sin has been committed,
    continue supplication, identify and punish the guilty person, and recognize restored
    divine favor when it rises.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The son of Solomon enters the House of the Lord to pray, sees the Tabernacle
    rising, is pleased by it, and determines to carry it to his own country.
  category: sequence
  evidence_refs:
  - ev:8
