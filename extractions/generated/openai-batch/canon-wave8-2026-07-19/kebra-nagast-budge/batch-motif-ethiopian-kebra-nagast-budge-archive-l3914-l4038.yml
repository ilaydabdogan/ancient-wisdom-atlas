  quote: ''
  summary: The passage presents Abraham testing and rejecting idols, praying to the
    Creator, receiving a fiery divine manifestation, and entering into covenant with
    God. God commands him to leave his father’s land, gives him the name Abraham,
    and promises descendants, land, and the future Tabernacle of the Covenant. The
    passage then summarizes Abraham’s departure with Sarah, righteous rule in Salem,
    and dynastic succession through Isaac and Jacob. Reuben loses royal status because
    of transgression, while Judah and his descendants receive the flourishing kingship
    that leads to David.
