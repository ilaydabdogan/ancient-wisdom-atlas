canonical_text:
  quote: ''
  summary: Azaryas prepares offerings and, after sacrifice, receives a night command
    from the Angel of the Lord to wake three brethren, take pieces of wood, and remove
    Zion, the Tabernacle of the Law of God. The sanctuary doors are found open; Zion
    is carried to Azaryas's house while wood is left in its place and covered. Zion
    is then kept secretly with lamps, sacrifice, incense, and purple cloths for seven
    days and nights. The King of Ethiopia asks his father for a blessing before departure;
    the father blesses him with ancestral and royal language and declares that Lady
    Zion will guide him in all circumstances.
  language: English
  quote_policy: summarized
