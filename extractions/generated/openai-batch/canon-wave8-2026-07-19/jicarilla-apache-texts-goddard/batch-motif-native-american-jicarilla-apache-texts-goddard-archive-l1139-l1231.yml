canonical_text:
  quote: ''
  summary: Raven flies toward a skyhole and then east to the Black Mountains, watched
    especially by Rattlesnake and Bat. The people find that Raven has meat but he
    will not tell them about the buffalo. They transform an Apache into a puppy with
    obsidian eyes; Raven’s child adopts it, and after Raven tests it with a heated
    poker, it is accepted as only a dog. Raven has buffalo shut up behind a door.
    At night the dog opens the door, the buffalo escape, and the transformed man escapes
    by clinging to an old buffalo. He returns to the people, who hunt the released
    buffalo and are no longer hungry. Raven assigns his children leftover parts of
    buffalo. In a second version, Raven has hidden the buffalo; the smallest child
    removes a stone from the opening to the lower world, and the buffalo appear as
    a herd on the plain. Raven says he has been made poor and now eats what others
    kill. The passage then begins another tale in which a gambler with a little turkey
    is warned by the turkey, repeatedly chops a tree that restores itself overnight,
    and is addressed by a talking god near a cliff.
  language: English
  quote_policy: summarized
