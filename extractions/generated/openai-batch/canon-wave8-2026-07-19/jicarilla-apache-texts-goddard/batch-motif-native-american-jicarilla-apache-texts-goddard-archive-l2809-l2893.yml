canonical_text:
  quote: ''
  summary: The passage reports Ute and enemy trophy-taking practices, a note on travois
    use, and a narrative of Apache hunting, tracking, ambush, combat, burial-platform
    evidence, a knife duel, the killing of an Apache advance party, the captivity
    of one child, and later recovery of bodies and arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that enemies sometimes removed Ute ears and fingers to
    wear, and that the Ute did the same in response; it reports a Ute explanation
    that this would make the enemy weak and easily frightened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote says the travois was used only for transporting the wounded and
    infirm, while packing loads on horses was adopted from Mexicans.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Apache group hunted buffalo, killed isolated buffalo bulls, divided into
    westward and eastward groups, found mule and horse tracks interpreted as enemy
    evidence, and moved camp west toward Tseintcincyihi mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three Apache men turned back to hunt deer; enemy riders discovered them and
    took their horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Of the three deer hunters, one hid, one escaped through thick brush, and one
    was pursued and attacked near arroyos.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pursued Apache fought from an arroyo, was shot in the back, pulled out
    the arrow while the small flint head remained in his body, shot two enemies from
    their horses, and the enemies withdrew.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the fight, stones with enemy blood on them had been turned over, and
    bloody grass had been pulled up and thrown into brush.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A platform had been built on a small hill, and a body had been placed on it
    with personal belongings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: An Apache advance group consisted of two men, two women, and three children,
    seven people in all.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: One Apache man rode back to identify travelers, saw they were enemies, stopped
    when pursued, removed his clothes, put on a warbonnet, and challenged them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An enemy chief and the Apache challenger rode close together, drew knives,
    tried to pull each other from their horses, stabbed each other, and both died.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The enemy surrounded the remaining Apache; one Apache man continued shooting,
    was not hit by arrows or bullets for a time, was later shot in the sole of the
    foot, killed many enemies, and was eventually killed near two white horses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: All members of the advance party were killed except one small child whose
    body was not found and who was said to have been taken captive.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The arms and legs of two children had been cut off.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A party of eight Apache later found the bodies, brought home four large bundles
    of arrows, distributed some among the Ute, and the Ute commented that they had
    never found so many arrows even after fights involving several combatants.
  category: sequence
  evidence_refs:
  - ev:9
