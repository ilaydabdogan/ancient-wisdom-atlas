  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group moved camp to the lakes, hunted in different directions, brought
    back antelope and deer, dried much meat, packed it in parfleches, and later camped
    at Rio Bonito.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some Jicarilla were camped at Ruidosa with the Mescalero, and a hunting camp
    was established near plains below a ridge where there were many deer.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hunters went in different directions, returned with meat including white-tailed
    deer, killed many animals, dried the meat, placed it in parfleches, and returned
    to Ruidosa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Seven men rode south to Tsemtc’icI, where there were many elk tracks and many
    deer; they killed many animals and brought the meat home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the hunters returned among the Mescalero, the Mescalero asked for meat,
