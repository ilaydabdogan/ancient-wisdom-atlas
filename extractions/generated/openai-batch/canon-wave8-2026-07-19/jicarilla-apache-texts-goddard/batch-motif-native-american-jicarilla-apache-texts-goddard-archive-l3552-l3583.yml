  quote: ''
  summary: A first-person account describes repeated hunting trips by Jicarilla groups,
    the killing of deer and antelope, drying and packing meat in parfleches, returning
    to Ruidosa, and giving meat to Mescalero people who ask for it and line up at
    the tent.
  language: English
  quote_policy: summarized
