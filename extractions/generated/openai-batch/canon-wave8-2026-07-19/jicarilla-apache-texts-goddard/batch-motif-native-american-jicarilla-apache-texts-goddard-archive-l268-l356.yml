- id: claim:1
  claim: The passage itself frames these figures as part of a Southwestern culture-hero
    complex with varying Apache and Navajo versions.
  claim_level: same_function
  target: Apache tribes and Navajo variants of the culture-hero tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
