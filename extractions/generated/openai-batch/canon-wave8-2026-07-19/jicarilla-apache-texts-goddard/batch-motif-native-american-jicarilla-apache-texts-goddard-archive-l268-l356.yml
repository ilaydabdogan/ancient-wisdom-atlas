canonical_text:
  quote: ''
  summary: Editorial notes describe variable Apache and Navajo traditions about one
    or two culture heroes and their parentage. In the narrative fragment, Owl and
    his wife try to cook two boys in boiling water and then roast them in ashes and
    fire, but the boys remain unharmed and converse. Owl gives them hoop and pole
    to play with. In the section titled “The Killing of the Monsters,” Naiyenesgani
    kills a people-killing Elk with the help of a partner, uses Elk’s hide and blood,
    and is then carried by an eagle to the eagle’s young.
  language: English
  quote_policy: summarized
