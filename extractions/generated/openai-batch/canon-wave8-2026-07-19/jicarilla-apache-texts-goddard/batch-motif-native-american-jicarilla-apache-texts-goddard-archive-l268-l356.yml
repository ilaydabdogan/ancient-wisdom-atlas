- id: motif:1
  label: Variable paired culture-hero origin
  taxonomy_refs:
  - culture_hero
  basis: The passage explicitly calls the figures culture heroes and reports variant
    accounts in which they may be one person with two names or two persons with water
    and sun as fathers and female ancestor relations.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports variation rather than a single fixed genealogy.
- id: motif:2
  label: Supernatural survival of cooking and fire ordeals
  taxonomy_refs: []
  basis: The two boys remain unharmed while boiled in a pot and roasted in ashes and
    fire, and Owl attributes this to supernatural power preventing death.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The beginning of the episode is fragmentary in the supplied passage.
- id: motif:3
  label: Hoop and pole circuit around a hill
  taxonomy_refs: []
  basis: Owl gives hoop and pole to the boys and directs them to go around the hill;
    they play with it until sunset.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explain the larger ritual or narrative function of
    the game object.
- id: motif:4
  label: Culture hero kills a people-killing monster animal
  taxonomy_refs:
  - culture_hero
  basis: In a section titled “The Killing of the Monsters,” Naiyenesgani kills Elk,
