canonical_text:
  quote: ''
  summary: The passage gives procedural accounts of making a sinew-backed bow, constructing
    and inaugurating a tipi with communal labor, fire-making, singing, and feasting,
    and preparing corn, peas, beans, wheat, and amole fruit in several ways. It includes
    brief spoken formulas during tipi-cover placement and during the handling of corn
    mush on a metate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bow is shaped from wood, covered at the middle with split yucca leaves,
    heated under ashes, and bent backward by pressing a foot on the middle while bending
    both ends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rawhide is scorched, cut up, boiled in water for a day to make glue, and applied
    to the roughened back of the bow before prepared sinew is added.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sinew is soaked, shredded, dried on a pole, applied to the bow, dried in the
    sun, and the bow is then given a string.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buffalo hides for a tipi are scraped, treated with brains, softened, dried,
    arranged into a cover, and sewed together with prepared sinew thread.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many women assemble to help sew the tipi cover and later take hold of the
    cover when it is attached to the back pole.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: As the women pull the tipi cover toward the center, one whistles and they
    say, “Make it lap.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tipi cover is fastened with pegs, poles are inserted to hold the smoke-hole
    flaps, and a place is dug for the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A medicineman starts the fire with a firedrill while others are sitting about.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women prepare food for a feast, people gather in the evening, and the medicineman
    sings with others from about dark until dawn.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gathered people eat about midnight and again in the morning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Leftover sewing sinew is tied with eagle down to the inside of the tipi.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The tipi is described as a house-like dwelling that keeps out winter cold,
    can be softened by hand-working the cover, and can be folded and packed on a horse
    when camp moves.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: In olden times corn is roasted in the ear, ground with a metate, stirred into
    hot water, cooked, served in bowls, and eaten from the hand.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: One preparation combines corn meal with sprouted ground wheat, cooks the mixture
    in a large pot, and adds sugar when serving.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Corn mush is sometimes poured into a hollow in snow or onto a metate.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: When mush runs off the metate, people say to it, “Run far off from the stone,”
    and the account states that it does not run very far when told so.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Peas and corn may be cooked with deer feet in a pot, peas may be roasted and
    ground into soup, beans may be roasted and made into mush, and bread may be eaten
    with bean soup.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: Wheat flour may be kneaded, spread, twisted, and buried in ashes; dried amole
    fruit is softened in water and placed in ashes.
  category: sequence
  evidence_refs:
  - ev:13
