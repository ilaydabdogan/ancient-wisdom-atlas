canonical_text:
  quote: ''
  summary: The passage recounts an Apache party traveling through named places to
    Maxwell, receiving clothing and war-bonnets, then moving onto the plains toward
    an enemy. They find signs of an enemy camp, including bones, a killed horse, and
    a stone-covered burial; Mexicans accompanying the party disturb the burial and
    take clothing and bracelets. Snow, cold, lack of wood, and lack of provisions
    force the party to return hungry, after which Maxwell provides food and supplies.
    A second section, titled "The Apache Meet a Texan," describes a camp moving east,
    securing antelope meat, capturing wild horses, mistaking buffalo for an enemy
    camp, losing meat and property in a flood, and resolving a horse-taking dispute
    with Texans through compensation and a warning not to disturb buffalo or property.
  language: English
  quote_policy: summarized
