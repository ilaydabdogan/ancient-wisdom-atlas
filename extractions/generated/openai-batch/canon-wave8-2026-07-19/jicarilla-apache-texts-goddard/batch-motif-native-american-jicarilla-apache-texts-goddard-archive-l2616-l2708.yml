canonical_text:
  quote: ''
  summary: A Jicarilla Apache account describes conflicts with American soldiers and
    allied enemies after the killing of a bell-wearing cow and the refusal to surrender
    four chiefs. The narrative follows battles, movements through named places, alliance
    and separation with Ute groups, raids, starvation, scattering, and a peace-making
    event in which Americans distribute goods. The passage then begins a separate
    account in which Navajo steal Apache horses and Apache and Ute pursue or counter-raid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Jicarilla were camped at Alora; after Apache killed a bell-wearing cow,
    American soldiers demanded four chiefs, and the Jicarilla refused to give them
    up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the first fight, Americans passed canteens, drank whisky, became drunk,
    rode toward the Apache, and shot at them; the Apache returned fire, killing three
    Americans, while one Apache had a finger shot off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the Jicarilla moved to a mountain east of Picuris, an American approached
    with a paper; an Apache took it and tore it up, and the paper bearer was wounded
    in the arm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Picuris-area battle, the soldiers halted on a plain with their horses
    while the Indians surrounded them; the Apache kept shooting until only two soldiers
    were left, four Apache were killed, and the Apache took soldiers' arms and money.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Apache moved through several named places, including the west side of
    the Rio Grande, El Rito, Vallecitos, Coyote, Conejos, Saikanyediye, and areas
    near Pike's Peak and Pueblo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A company made up of Mexicans, Pueblos, and soldiers followed and shot at
    the Indians during their movements.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After mingling with Ute in a canyon, the Apache rode to a place where a Mexican
    was living, killed the people there, brought back a scalp, and danced with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In later fighting, the Apache climbed to the top of a mountain on foot, later
    moved westward, and were again attacked by soldiers, Mexicans, and Pueblo Indians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ute withdrew from the Apache; the Apache broke into small bands and scattered
    in different directions, while the Ute went to Mexican towns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Apache stayed in the mountains while enemies fought them; many old women
    and children died of starvation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Cangillon near Abiquiu, American soldiers made peace with the Apache by
    distributing goods from wagons, and each Indian received a present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: An American asked whether these were all who were left, and after an Apache
    answered yes, the American said they had been nearly exterminated and warned them
    not to become enemies again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the beginning of the next tale, the Navajo came to an Apache camp at Cimarron
    in spring and drove away Apache horses; Apache pursued and recovered only poorer
    horses left behind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the fall, Ute and Apache together pursued the horse thieves; at KoLtsoye,
    'yellow river,' they drove away Mexican horses and hid two mules in brush.
  category: action
  evidence_refs:
  - ev:7
