canonical_text:
  quote: ''
  summary: 'The passage contains three Coyote tales: Coyote captures turkeys but his
    youngest child is killed instead; Porcupine kills Buffalo from inside, disputes
    the carcass with Coyote, revives after being killed, steals the meat, and kills
    Coyote’s children; Coyote throws away his eyes, receives pitch eyes, disobeys
    a warning about sunshine, and gains cheek marks while the original eyes become
    plums. Editorial notes cite related versions, especially for the eye-loss tale.'
  language: English
  quote_policy: summarized
