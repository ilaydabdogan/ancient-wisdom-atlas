canonical_text:
  quote: ''
  summary: A god helps a man make a hollow sealed log from a tree and sends him downstream
    through dangerous places. After landing, the man survives beside the river, receives
    corn from a turkey in four directional rows, and sees repeated fires near an eastern
    rocky ridge. He later encounters a girl at a mountain stream, uses a flute borrowed
    from cicada, follows her into an opened rock, and meets an old woman who flees
    from him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening editorial note says a Navajo myth given by Matthews is detailed,
    accompanied by songs, and evidently connected with an important ceremony.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A god fells a tree with four motions, cuts off a man-length section, and restores
    the remaining tree to the stump as if it had not been cut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds that peck trees hollow the log; after repeated passes the hole is large
    enough for the man, and he distributes beads among the birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The god smooths the log with water foam, Spider closes both ends, and the
    god puts the man inside the log into the water after warning of four bad places.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The sealed log carries the man downstream through a whirlpool, a waterfall,
    an encounter with Pueblo Indians pulling driftwood, and floating driftwood; the
    god intervenes when the log is stuck or removed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After landing, the man walks beside the river, catches ducks, uses their feathers
    for bedding, eats the birds, and saves leg sinew for arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After four days the man sees his turkey, and the turkey produces rows of corn
    from the east, south, west, and north in different colors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The planted corn sprouts and matures rapidly over four days, and the turkey
    goes around gobbling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man repeatedly sees a fire near an eastern rocky ridge, but when he goes
    there he finds no fire and no tracks; he uses a forked stick to take bearings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the corn and tobacco are ripe, the man goes to the place of the fire
    and finds a girl sitting where a stream flows from the mountains, rubbing a deerskin.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man is initially unseen by the girl and blows a flute loaned by cicada;
    she searches for the cicada, later sees the man, opens solid rock, and enters
    it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man follows the girl into the opened rock, leaves his arrows by the door,
    and an old woman inside runs out because she is afraid of her son-in-law.
  category: sequence
  evidence_refs:
  - ev:6
