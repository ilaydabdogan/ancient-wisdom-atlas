canonical_text:
  quote: ''
  summary: The passage closes one episode in which people are selected and Naiyenesgani
    goes west with four girls, then narrates how Naiyenesgani proves power among Pueblo
    people by transforming corn into snakes, receives turquoise-covered clothing,
    drains a monster-inhabited lake with four colored hoops, enters the exposed place,
    silences a crane guard, overcomes the monster YeLagoLtsode, and uses smoke from
    a firedrill to drive hidden captives out through four doors. The next episode
    begins with a monster fish swallowing Naiyenesgani; from inside it he sings and
    cuts its heart so it rushes to shore.
  language: English
  quote_policy: summarized
