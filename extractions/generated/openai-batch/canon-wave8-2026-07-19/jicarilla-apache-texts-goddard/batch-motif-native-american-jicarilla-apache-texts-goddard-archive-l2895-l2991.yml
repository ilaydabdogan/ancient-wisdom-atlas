canonical_text:
  quote: ''
  summary: 'The passage contains several prose accounts: a Jicarilla scout and an
    enemy scout parley by signs, lay down weapons, then fight, after which the Jicarilla
    kills and scalps the enemy; a Ute company encounters enemies near the Canadian
    and Salt Rivers, an old captive woman attempts to make peace, fighting resumes,
    an Apache woman mutilates a wounded enemy, and the Ute take scalps and hold a
    dance; the excerpt then begins an account of the Ollero setting out on a buffalo
    hunt with animals loaned by Maxwell and catching two buffalo calves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a buffalo hunt, one man scouting for enemies sees an enemy scout, and
    the two communicate by sign language from a distance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two scouts place visible weapons on the ground, the Jicarilla signs that
    he has no knife, and they agree to meet in the center to make friends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After meeting and talking by signs, the two men begin fighting with their
    fists; the enemy carries the tired Jicarilla toward the place where weapons are
    lying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Jicarilla has a knife suspended about his neck, draws it, stabs the enemy
    under the arm, and the enemy dies near his weapons.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Jicarilla scalps the enemy, takes the enemy's weapons to camp, and a scalp
    dance is later made with the scalp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note says Casa Maria explained that a Mescalero Indian who had been with
    the enemy later told of the encounter, and that the Ute killed him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Ute company traveling down the Canadian River is met near Salt River by
    enemies from the east; two enemies ride up to a tipi where a Ute woman is alone,
    and her relatives pursue them on selected horses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note says the Ute woman was alone because of her condition and broke an
    established custom in time of peril.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: An old woman who is a captive from the enemy rides out between two facing
    lines and says she came to make peace; after some agree, fighting starts at the
    other end of the line.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Ute pile their property close to the road edge and take a position behind
    it, with their horses tied by an arroyo.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: When a wounded enemy falls from his horse, an Apache woman with an ax cuts
    off both his arms, removes his wrist guard, and throws it on his stomach.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Ute drive the enemy, capture four horses, pursue enemies who are on foot,
    then kill their enemies when they come within shooting distance, take scalps,
    move to Cimarron, and hold a dance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note says the story explains the giving of names to children; it says the
