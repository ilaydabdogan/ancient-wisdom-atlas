- id: motif:6
  label: Women as wartime agents
  taxonomy_refs: []
  basis: A Ute woman warns relatives after enemy riders approach; an old captive woman
    attempts peace; an Apache woman mutilates a wounded enemy, and a note connects
    the account to name-giving and a custom involving women and the dead.
