canonical_text:
  quote: ''
  summary: A war party turns back from an enemy country while dying of thirst, leaving
    one weakened survivor. He sleeps under trees inhabited by ravens and hears them
    speak about men who killed buffalo. A prairie dog gives him water. He then travels
    with a buffalo calf, reaches a red mountain ridge or red place, and repeatedly
    follows buffalo camps that appear at night as tipis but leave only buffalo-lying
    signs by morning. A white buffalo chief speaks of the man having married a brave
    man’s wife, orders bows and arrows to be made, and a shooting confrontation occurs
    before gathered chiefs. The man is then told that four named rivers will be his
    chiefs. Editorial notes connect the story with an Assiniboine narrative and with
    a Jicarilla infant ceremony, while stating that part of the myth was omitted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group on a war expedition turns back without finding the enemy because they
    are dying of thirst; only one man remains alive, weak from thirst, and he lies
    down under a clump of trees at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ravens live in the trees above the man and, near morning, he hears them speak
    about men who have killed buffalo and name men one by one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At about noon, the man reaches a prairie dog village; a prairie dog comes
    from its hole with a small dish of water, which the man drinks before continuing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The man sees a buffalo calf, travels with it, and reaches a red mountain ridge
    or red place; during this travel the buffalo becomes fully grown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The man enters a plain with many buffalo where, at evening, the ground is
    white with tipis; by morning no tents remain, only signs that buffalo had lain
    there. This pattern of following the buffalo and reaching their camp again at
    evening repeats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When it is dark, a white buffalo speaking as chief says the man has married
    a very brave man’s wife and reports the condition that any man braver than he
    may marry his wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The buffalo chief comes to his house and instructs the man to make arrows
    with falcon tail feathers and mixed feathers, and bows from several kinds of wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chiefs gather; the man and the largest buffalo face each other, and the
    man shoots until he has used up the arrows he made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the shooting, the man is told that the Pecos, Canadian, Rio Grande,
    and Chama Rivers will be his chiefs; a note identifies these as sacred Jicarilla
    rivers and describes male and female pairings in ceremonial dry paintings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: An editorial note states that a probably connected story was published by
    Dr. R. H. Lowie, that the fight with the Buffalo chief is pertinent in the Assiniboine
    narrative, and that the narrator omitted a latter portion connected with an infant
    ceremony.
  category: other
  evidence_refs:
  - ev:9
