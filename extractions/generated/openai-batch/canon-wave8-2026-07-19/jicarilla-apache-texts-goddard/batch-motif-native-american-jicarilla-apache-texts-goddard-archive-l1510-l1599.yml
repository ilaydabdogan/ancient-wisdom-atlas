canonical_text:
  quote: ''
  summary: 'The passage closes a deer/fawn origin episode in which a mother releases
    the animals and assigns them seasonal colors and bodily features. It then gives
    the story of a boy given a medicine-related gift by his mother: he produces abundant
    antelope through a corral hunt, refuses to return the gift, is cursed, and becomes
    associated with a lake where poles protrude from the water. Later, a war party
    meets a lake-associated supernatural speaker through smoke and pipe ritual; he
    provides buffalo meat, directs them to an enemy horse camp, requests a black horse,
    and instructs them to blow smoke toward his home by Sheep Horn Mountain when in
    need.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fawns or deer address a mother figure, say they belong to her, and she calls
    them her children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animals return repeatedly; the mother says they have destroyed her fence
    four times and sends them away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother says she has made the animals red in summer, blue in fall, black
    in mid-winter, and brown in spring, and has given them black hoofs and noses,
    horns, ears, faces, teeth, gait, tails, white hips, and eyes of coals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note states that this myth is the foundation of the deer-hunting ceremony
    and that its substance is sung before a hunt.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old woman gives her boy a present so that he may become a medicineman;
    while the group is hungry on the plains, she asks him for food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy makes a corral near a river, gathers men, and has antelope driven
    in and killed over several days; eventually antelope run in by themselves or when
    whistled at, producing a large pile of meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the old woman asks her son to return her gift, he says he has already
    given it to the supernatural one; she curses him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After being cursed, he goes to a place called “sticks swim around,” where
    tent poles stick out of the water; the text says he lives on the bottom of the
    lake, and people who follow his tracks cannot find him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note identifies the lake as a regular place of offering where Jicarilla
    people threw beads and other property when traveling to the buffalo hunting grounds.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Two years later, a war party on the plains builds a fire, smokes a pipe, and
    hears a voice identifying them as his own people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The speaker drops a buffalo nearby, asks the war party to make smoke for him,
    smokes with them, and gives them a forequarter of the buffalo to eat.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The speaker tells the war party that the enemy camp is close, instructs them
    to surround the horses at noon, requests an all-black horse without a white spot,
    and says to blow smoke toward his home by Sheep Horn Mountain if they need anything.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The war party reaches the enemy in daylight, drives away horses, identifies
    the black horse, and when they pass the speaker’s home the black horse runs immediately
    to the lake.
  category: sequence
  evidence_refs:
  - ev:10
