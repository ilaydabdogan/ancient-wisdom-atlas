canonical_text:
  quote: ''
  summary: The passage first recounts a victory dance after warfare, a fire-pit incident
    involving tc’actcini, a hidden girl, searches in four directions, the arrival
    of named gods, and the use of eagle down and a flint sword to locate and recover
    hidden persons. It then describes a medicine ceremony with sand images, feathers,
    paints, water, rattle, song, medicine, and healing; a second description of the
    medicine ceremony with a lodge, sand pictures, animal-making, herb use, grizzly
    impersonation, four-night dancing, and abundant foods; and the beginning of an
    adolescence ceremony in which a holy girl, a boy, elders, pollen, L’ectcic, smoking,
    and prayers for renewal and long life appear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening narrative says people lived long ago at Tseyakinehl, where everything
    grew, then went eastward to war on the plains, returned with an enemy scalp, and
    danced a victory dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cooking pit was dug, a large fire was built in it, and corn was placed in
    it to cook.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tc’actcini drove girls to the dancing place; one girl remained at the
    fireplace despite attempts to drive her to the dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: One tc’actcini jumped into the pit and was burned, and another tc’actcini
    searched for him unsuccessfully.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Searchers went toward the east, south, west, and north, returned without finding
    the missing one, and called on supernatural beings on earth to help.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl was placed in a hole, covered with a flat stone, and covered over
    with ashes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'Messengers returned from under the sunrise, the south, under the sunset,
    and the north with four named gods: the talking god, white god, yellow god, and
    variegated god.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Eagle down placed on a stick was carried during the search; the feathers pointed
    toward the fire pit when the searchers came above it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The searchers put their ears to the ground and heard the burned one laughing
    beneath or at the fire pit location.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The eagle feathers also pointed toward the hidden girl, after which XastcInyaLkldn
    faced four directions with a flint sword and pulled her out from the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the medicine ceremony, smooth sand was spread out, eagle tail feathers
    were set in a circle, colored paints, pollen, L’ectcic, and blue coloring were
    prepared, and a clay vessel containing water was placed in the center.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Colored materials were strewn to make all animals on the earth, and the people
    checked that none had been omitted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Patients sat in a row on the animal images while the medicineman shook a rattle
    and sang; the patients cried and showed bodily symptoms, then received rattle
    contact, embracing, medicine to drink, and medicine on their bodies, after which
    they got well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A second description says a lodge is made, sand pictures are made inside,
    two men make every kind of animal, an herb is pounded, a grizzly-like action with
    the sound “wa” is performed, and a person with supernatural power makes the patient
    well again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The second medicine description includes making the tc’actcini and the ts’anat’i,
    dancing four nights, and a statement that the rite should not be discontinued
    as long as the world stands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The second medicine description says cherries, yuccas, rabbits, bread, and
    mush are made; mush put in a pot becomes full, and the tc’actcini have peas and
    dog manure used as butter on bread.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: The second medicine description concludes that they dance four nights, are
    happy, and that this is what is done at the fiesta, the grizzly dance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: In the adolescence ceremony, people come early in the morning to the holy
    girl, who becomes Yolkaisdzan; a young boy, an old man, and old women are also
    brought or come together.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:19
  text: Old women sit outside, smoke, and pray for the girl and the boy, asking for
    renewal, well-being, happiness, old age, and pollen on the feet.
  category: speech
  evidence_refs:
  - ev:11
