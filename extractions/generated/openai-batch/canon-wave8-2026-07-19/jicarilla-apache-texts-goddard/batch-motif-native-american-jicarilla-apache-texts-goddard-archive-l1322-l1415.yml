canonical_text:
  quote: ''
  summary: An old man repeatedly offers pipe smoke to a young man, who refuses and
    later gives the old man smoke from his own cigarette. The old man is strengthened
    by it. The young man returns in repeated visits with cigarettes, unusual tracks
    are noticed, and he and a woman later cross a river on top of the water, gather
    corn and tobacco, and exchange corn for deer with the father-in-law. The woman
    assigns deer their sense of smell, declares turkeys and deer to live in the mountains
    as food for people, summons animals from the directions, kills many, and leaves
    corn as what belongs to them. The passage ends with the heading and opening lines
    of a second version of the origin of corn and deer, in which a man and small turkey
    travel down the Rio Grande toward four bad places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man comes home, fills pipes with tobacco, blows smoke, repeatedly
    invites the young man to smoke, and asks where people came into existence; the
    young man refuses each invitation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man smokes a cigarette tied to his belt, gives it to the old man,
    and the old man’s legs straighten after inhaling; the young man also blows smoke
    against the soles of his feet and palms of his hands, after which the old man
    stands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man eats a dish of food in one mouthful, takes his arrows, leaves,
    and only one footprint is seen outside; an explanatory note says he traveled with
    lightning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man makes cigarettes and returns on repeated nights; after one visit
    two tracks are seen outside, and the old man says he does not think the visitor
    is a human being.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: On a later visit the young man carries four cigarettes; after the old man
    smokes them, the woman goes back with the young man the next morning.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The man and woman walk across the river on top of the water, gather much corn
    and tobacco, and the woman later wades through the river while carrying corn back
    to her people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man gives corn to his father-in-law, and the father-in-law gives
    him the deer he possesses in return.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:8
  text: The old man is named DinideyiniLt’j^nne, translated as “Game he raised,” and
    the other man is named AtdiLdeyeseLdli, translated as “He floated down.”
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Deer eat the leaves from the woman’s brush house and brush shelter; she strikes
    the deer with a fire poker and says deer will have a sense of smell.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The woman declares that turkeys shall live in the mountains and that people
    will live upon them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The woman goes to the east, south, west, and north calling for her children
    by shared horns, bodies, tails, and ears; animals return from the north and west,
    surround her, and she kills many of them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After killing many animals, the woman tells them to live in the mountains,
    says people will live upon them, and says they shall have a sense of smell.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage begins a second version titled “The Origin of Corn and Deer,”
    in which a man accompanied by a small turkey travels down the Rio Grande, where
    there are four bad places to pass.
  category: sequence
  evidence_refs:
  - ev:10
