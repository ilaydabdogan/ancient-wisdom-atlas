canonical_text:
  quote: ''
  summary: A group waits for Okadi, accuses Old-woman-white-hands of causing his absence,
    and finds Okadi jailed with a ball and chain. After release and travel with horses
    and bells, the party repeatedly asks Old-woman-white-hands where to camp. Okadi
    scouts the enemy camp and obtains meat and water from it. The next morning four
    men attack an enemy camp divided by an arroyo, kill those on one side with war
    clubs, spare others by declaring friendship, and distribute captured goods and
    horses before returning to their shade.
  language: English
  quote_policy: summarized
