canonical_text:
  quote: ''
  summary: 'The passage contains several Coyote episodes: Coyote visits Buffalo, Elk,
    and a red-feathered bird and then attempts to imitate their distinctive powers
    or appearances when they visit him; Turkey alters Coyote’s message to his family,
    causing the killing and eating of Coyote’s youngest child; Coyote unsuccessfully
    pursues turkeys from tree to tree; the next tale begins with Coyote finding a
    small brown bird feathering arrows.'
  language: English
  quote_policy: summarized
