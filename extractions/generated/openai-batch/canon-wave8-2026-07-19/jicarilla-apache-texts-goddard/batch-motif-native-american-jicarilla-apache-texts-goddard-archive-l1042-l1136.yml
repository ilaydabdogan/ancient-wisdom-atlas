candidate_motifs:
- id: motif:1
  label: Small food or drink proves sufficient
  taxonomy_refs: []
  basis: A tiny piece of ice satisfies the thirsty man, and the eagle father also
    provides food in a very small clay dish after the visitor thinks it too little.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage explicitly states satisfaction only for the ice; the result
    of the small dish is not fully described in this excerpt.
- id: motif:2
  label: Ascent through sky hole with animal helpers
  taxonomy_refs:
  - ascent
  basis: Eagles carry the man upward toward a sky hole, and Panther pulls him through
    it by lowering his tail.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The excerpt begins in the middle of a larger narrative, so the full purpose
    of the ascent is not supplied here.
- id: motif:3
  label: Removable animal garment mediates form or ability
  taxonomy_refs:
  - shapeshifter
  basis: The eagle episode includes a coat removed and given in connection with flight,
    while the Bear-Man episode reveals a human wearing a bearskin and stick armor
    to appear as a bear.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: medium
  cautions: The Bear-Man case is explicitly disguise and armor rather than confirmed
    supernatural transformation.
- id: motif:4
  label: Combat against colored hornet enemies
  taxonomy_refs: []
  basis: Black and yellow hornets with corresponding houses are enemies; the man,
    protected by Panther’s buckskin armor, fights and kills them.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: No wider mythic function for the hornet battle is explained in the excerpt.
- id: motif:5
  label: Animal-skin impostor exposed by tracking
  taxonomy_refs: []
  basis: The bear-like killer is tracked, his bearskin and protective sticks are found,
    and he is revealed as a man using a bear’s coat.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The narrative calls him like one of the people but an enemy; broader identity
    details are limited to a footnote.
- id: motif:6
  label: Releasing or retaining buffalo and other game animals
  taxonomy_refs: []
  basis: The section title is “Releasing the Buffalo,” and the source notes compare
    versions where buffalo or other animals are released or induced to leave the lower
    world.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: Only the opening of the story is included in the passage; the release
    action itself is not narrated here.
- id: motif:7
  label: Raven arrives at hungry camp with entrails in quiver
  taxonomy_refs: []
  basis: Hungry campers are playing hoop and pole when Raven arrives from an unknown
    place and removes a quiver containing intestines.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage stops before explaining what Raven’s quiver and intestines
    do in the story.
comparison_claims:
- id: claim:1
  claim: The source note connects this “Releasing the Buffalo” story with a version
    obtained by Russell in which many other animals are released.
  claim_level: same_motif
  target: Russell version of the release-of-animals story
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief note and not the text of Russell’s version.
- id: claim:2
  claim: The source note links the story to a Mescalero version where Coyote fails
    and Naiyenesgani succeeds in inducing buffalo to leave the lower world.
  claim_level: same_function
  target: Mescalero version involving Coyote, Naiyenesgani, and buffalo leaving the
    lower world
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the editor’s summary; the Mescalero narrative details
    are not included in the passage.
- id: claim:3
  claim: The source note reports Blackfoot and Gros Ventre variants concerned with
    buffalo retention or release, with the Gros Ventre version naming an old woman
    and daughter rather than Raven.
  claim_level: same_motif
  target: Blackfoot and Gros Ventre buffalo-retention or buffalo-release variants
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The note says the Blackfoot version is somewhat different and provides
    only a short comparison for Gros Ventre; it also states the story seems not to
    be known to the Western Apache and Navajo.
