canonical_text:
  quote: ''
  summary: The passage contains the end of a narrative in which DagonadeL is hosted
    by eagle beings, carried upward toward a sky hole, rescued by Panther, armed against
    hornet enemies, and honored after battle. It then gives the story of the Bear-Man,
    in which a man using a bearskin and stick armor kills people until trackers expose
    and kill him. The final section begins a story titled “Releasing the Buffalo,”
    where hungry campers are approached by Raven with a quiver containing intestines,
    followed by notes comparing related versions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A thirsty man hears someone below, jumps to him, receives a small piece of
    ice, drinks it, is satisfied, and lies beside the little eagles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father of the eagles thanks DagonadeL for staying with his children, opens
    a house behind solid rock, and gives him food in a very small clay dish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A coat is removed and hung on the wall; after removal, the wearer is like
    any other man. The coat is then given to the visitor in connection with running
    with the children and flying.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many eagles come down from the center of the sky, wings are put on the man,
    and eagles carry him upward; when he tires near the sky hole, Panther lowers his
    tail and pulls him up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Panther has a home above; hornets are described as enemies, with black and
    yellow groups and houses matching those colors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Panther makes thick buckskin shirts with eye holes for the man, who wears
    one while fighting hornets with a quirt and strings killed hornets on sticks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the fighting, Panther calls the man his brave grandchild, the group
    dances in a circle, Meadowlark dances sunwise, and Meadowlark is told to go down
    because he says bad words against the people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: People living across the Rio Grande near Nahianye are raising a crop, and
    a bear kills people one by one, including people who went for cherries.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The pursuers follow tracks, find a bearskin coat and braided sticks, and track
    the killer to a camp with holes in a row by an arroyo.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: An old man says the killer is like one of their people but will be killed
    as an enemy; the people shoot him and learn he had killed a bear, taken its coat,
    and used sticks under the coat to stop arrows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the beginning of “Releasing the Buffalo,” people are camping on the plain
    without food, playing hoop and pole, when Raven arrives and takes off a quiver
    containing intestines.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The source notes compare other versions involving released animals, buffalo
    leaving the lower world, and different figures connected with buffalo retention.
  category: other
  evidence_refs:
  - ev:11
