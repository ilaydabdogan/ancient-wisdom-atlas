canonical_text:
  quote: ''
  summary: 'The passage contains several short Jicarilla Apache tale translations:
    Coyote first helps and then harms a mistreated dog; Mole wins a race for a girl
    with Heron’s help; Frog defeats Antelope in a footrace by using many frogs in
    a line; several birds serve as chiefs whose speech affects weather and game; Woodpecker
    describes his tree-dwelling habits.'
  language: English
  quote_policy: summarized
