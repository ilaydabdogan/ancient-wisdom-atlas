  confidence: high
  cautions: The passage frames the outcome etiologically, but gives few details about
    the identities of all players.
- id: motif:2
  label: etiology of animal markings and daily habits
  taxonomy_refs: []
  basis: Roadrunner and Crane’s red cheeks are explained by fire-rubbing, beings struck
    by sun rays become red, and defeated no-day singers become night-going beings.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: Only Roadrunner, Crane, and Owl are named; other affected beings remain
    unnamed.
- id: motif:3
  label: Coyote obtains fire from exclusive fire-holders
  taxonomy_refs:
  - sacred_theft
  - trickster_boundary
  - culture_hero
  basis: Fireflies alone have fire; Coyote prepares cedar bark, ignites it at their
    dance fire, escapes while pursued, and the result explains the availability of
    fire from trees.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage describes deception and taking fire, but does not explicitly
    use the word theft.
- id: motif:4
  label: bending tree as access route
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: A cedar tree bends down when addressed, allowing passage into and out of
    the otherwise inaccessible rock-ringed camp.
  evidence_refs:
  - ev:8
  - ev:13
  confidence: medium
  cautions: The tree functions as a route over a rock barrier; the passage does not
    explicitly identify it as a cosmic axis.
- id: motif:5
  label: world-burning fire explains fire in wood
  taxonomy_refs:
  - world_destroying_fire
  basis: Coyote runs with fire until the whole world burns black, and this burning
    explains why fire can be made from all kinds of trees with a drill.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The world is burned, but the passage does not describe a full world-ending
    destruction of beings.
- id: motif:6
  label: hide wager with water restoration
  taxonomy_refs:
  - death_rebirth
  basis: Players who lose their hides jump into the river and return dressed as before;
