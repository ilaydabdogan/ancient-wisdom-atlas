canonical_text:
  quote: ''
  summary: 'The passage contains a myth in which a moccasin game stakes daylight against
    darkness, resulting in daybreak, red animal markings, and a division between daytime
    and nighttime beings. It also contains a Coyote fire myth: Fireflies alone possess
    fire; Coyote learns a cedar-tree route, ignites cedar bark tied to his tail, escapes
    with fire, spreads it across the world, and the burning explains why fire can
    be made from trees and why petrified wood does not burn.'
  language: English
  quote_policy: summarized
