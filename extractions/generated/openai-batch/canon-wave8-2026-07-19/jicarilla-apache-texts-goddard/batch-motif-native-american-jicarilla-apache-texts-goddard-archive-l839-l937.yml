- id: obs:5
  text: Those struck by the sun’s rays become red; Roadrunner and Crane are said to
    have red cheeks because they rubbed them with fire.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: Those who sang that there would be no daylight are beaten and are said to
