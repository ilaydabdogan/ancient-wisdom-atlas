canonical_text:
  quote: ''
  summary: The passage contains the end of one version of a tale in which antelopes
    repeatedly evade Coyote and take arrows away, a second version in which Coyote
    has killed Owl and taken the only arrows before Antelope's children carry off
    the bow and quiver for the people's safety, and the beginning of a tale in which
    Coyote tries to imitate Deer by exposing his children to cedar fire to make them
    spotted, killing them instead.
  language: English
  quote_policy: summarized
