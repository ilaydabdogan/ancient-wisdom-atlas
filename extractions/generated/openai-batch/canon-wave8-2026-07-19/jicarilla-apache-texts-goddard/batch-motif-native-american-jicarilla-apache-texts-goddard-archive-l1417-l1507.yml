canonical_text:
  quote: ''
  summary: A man and a turkey arrive in a new land. The turkey produces rows of colored
    corn from the four directions, and the man plants corn and raises tobacco. The
    man sees a recurring night fire across a river, finds a woman and her father,
    and exchanges corn and tobacco with the woman's family. The woman becomes his
    wife. His in-laws guide him in a hunt involving colored blinds and passing animals.
    His father-in-law gives him many tame deer and declares that people on earth will
    live on deer. The man and wife settle on a hill; the deer repeatedly gather around
    the woman's fire and shelter, and she strikes them above the nose, saying deer
    will always have a sense of smell.
  language: English
  quote_policy: summarized
