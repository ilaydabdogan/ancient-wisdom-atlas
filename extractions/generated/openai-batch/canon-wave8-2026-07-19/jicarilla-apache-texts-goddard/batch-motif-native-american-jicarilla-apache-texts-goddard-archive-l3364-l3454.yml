  summary: A first-person narrator recounts several hunting trips around mountains,
    rivers, lakes, canyons, and named places. Hunters kill deer and elk, butcher and
    dry meat, carry it to camps and settlements, sell or distribute it, and attend
    feasts where multiple groups gather.
