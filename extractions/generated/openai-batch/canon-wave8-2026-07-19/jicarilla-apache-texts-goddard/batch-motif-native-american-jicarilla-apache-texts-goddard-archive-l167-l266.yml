canonical_text:
  quote: ''
  summary: The passage includes comparative notes on lower-world and diviner incidents,
    an episode in which a lower-world old couple gives lice that cause sleep, a narrative
    of two chiefs in conflict followed by healing, kinship formation, battle death,
    report, and mourning, and the opening of a Culture Heroes and Owl episode in which
    two companions receive a hoop-and-pole game from their sun father, violate a northward
    prohibition, and reach Owl's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that the Navajo tell of a hermaphrodite twin who dies, is later
    seen sitting in the lower world, and becomes ruler of ghosts.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old couple of the lower world gives four lice; two are placed in hair and
    two in clothes, and the lice biting causes sleepiness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: People are described as living near the head of the Arkansas River, along
    the Sangre de Cristo Range, and west of the Rio Grande; two chiefs are named on
    the east side of the river.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Indayedittsidn makes a corral and feast and invites everyone, while Indakadigaui
    refuses at first and then arrives with an arrow held on a stretched bow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indakadigaui shoots an arrow through Indayedittsidn's arm and goes home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wounded chief repeatedly sends for the shooter; on the fourth message
    he tells him not to be afraid and to bring medicine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Indakadigandn selects an herb from his medicine bag, removes the arrow, applies
    medicine, predicts the swelling will be gone in four days, and the wounded man
    recovers and becomes his grandson.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Indakadigandn gathers five hundred men, takes ten horses for his own use,
    goes to fight an enemy, and selects four men to stay out of battle and report
    the outcome.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In battle, horses are repeatedly killed under Indakadigandn; after his people
    are all killed, the enemy pulls him down and kills him with a knife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The four selected men return and report that all their people are dead; Indayedittsidn
    cuts off his hair and says he will mourn for his grandson properly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kubatc'istcine and Naiyenesgani are companions who visit their grandmother
    Yolgaiisdzan and ask her to make something to play with.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The grandmother sends them to their father; at the house of the sun they ask
    for playthings, and the sun makes a hoop-and-pole game and arrows, warning them
    not to roll the hoop toward the north.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The two boys roll the hoop north; it continues into Owl's house and falls
    behind the fire, and Owl orders them to be put in the pot to cook.
  category: sequence
  evidence_refs:
  - ev:9
