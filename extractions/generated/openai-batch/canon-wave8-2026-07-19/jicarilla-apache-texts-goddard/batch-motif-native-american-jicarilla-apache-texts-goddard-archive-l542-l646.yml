canonical_text:
  quote: ''
  summary: 'The passage gives the close of one monster-fish episode, a second version
    of the monster-fish episode, and several episodes in which Naiyenesgani removes
    dangers: a trail monster beside a stream, a woman with toothed vulvae, and closing
    rocks guarding reeds for arrows. It then begins an episode in which a child becomes
    a bear, kills children, and hides his heart near oak trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says this fish exploit is not known to other Southern Athapascan
    tribes who regard fish and water animals as taboo, and mentions Mooney's account
    of a predatory fish leaving the water and flying.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first fish episode ending, Naiyenesgani cuts openings in the fish's
    neck with an obsidian knife, exits with the heart in his hand, gives the heart
    to the sun, and returns to his grandmother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fish's series of openings on the sides of its neck is explained as resulting
    from the cuts made by Naiyenesgani.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The firedrill blazes up and dies down; a note explains that it was a sign
    to Naiyenesgani's grandmother of his danger or safety.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the second version, the monster fish swallows Naiyenesgani, lies in deep
    water, has its heart cut off from inside, swims to shore, and is left without
    a heart after Naiyenesgani exits through slits in its neck.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Naiyenesgani brings the fish heart to his grandmother; she says she will carry
    it inside the moon when the moon rises so that people will look at it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A trail passes between a cliff and a stream, where TsedagediLisdihi sits;
    his home is in the large stream flowing nearby.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: TsedagediLisdihi kicks passersby into the water, where his children eat them
