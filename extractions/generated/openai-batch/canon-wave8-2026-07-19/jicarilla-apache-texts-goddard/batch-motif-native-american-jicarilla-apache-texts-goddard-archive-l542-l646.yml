candidate_motifs:
- id: motif:1
  label: Slayer escapes from inside a swallowing monster
  taxonomy_refs:
  - culture_hero
  basis: Naiyenesgani is swallowed by the monster fish, removes its heart from inside,
    cuts openings or slits in the neck, and exits carrying the heart.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents an internal monster-slaying episode, but does not
    explicitly label it as a descent or underworld journey.
- id: motif:2
  label: Monster's heart placed in celestial custody
  taxonomy_refs: []
  basis: In one version the fish heart is given to the sun to carry away; in another,
    the grandmother says she will carry the fish heart inside the moon as it rises.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The two versions assign the heart to different celestial handling figures,
    so the exact form varies within the passage.
- id: motif:3
  label: Dangerous passage monster defeated by reversal
  taxonomy_refs:
  - culture_hero
  basis: TsedagediLisdihi kills travelers at a narrow trail by kicking them into water,
    but Naiyenesgani avoids the kicks and kicks him into the same water, where his
    own children eat him.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The evidence is strong for a reversal pattern; broader taxonomy beyond
    culture-hero danger removal is not explicit.
- id: motif:4
  label: Toothed sexual organ neutralized by substitute object
  taxonomy_refs: []
  basis: The woman's toothed vulvae had killed men; Naiyenesgani inserts twisted sumac
    sticks first, the teeth cut the sticks, and he destroys the teeth.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage itself and its note support the motif, but the available taxonomy
