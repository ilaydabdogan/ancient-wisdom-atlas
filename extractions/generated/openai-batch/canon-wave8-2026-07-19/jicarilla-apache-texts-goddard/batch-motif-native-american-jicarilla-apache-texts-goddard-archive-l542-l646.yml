- id: motif:5
  label: Closing rocks guarding a needed resource
  taxonomy_refs:
  - culture_hero
  basis: Rocks close on people seeking arrow reeds; Naiyenesgani safely obtains reeds
    after four feints and distributes arrows to everyone.
  evidence_refs:
