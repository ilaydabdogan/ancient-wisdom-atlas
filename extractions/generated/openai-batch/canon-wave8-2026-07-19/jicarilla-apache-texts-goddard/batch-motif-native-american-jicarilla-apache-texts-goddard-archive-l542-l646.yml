comparison_claims:
- id: claim:1
  claim: The editorial note cautiously links the fish exploit to Mooney's account
    of a predatory fish, while also noting that this exploit is not known to other
    Southern Athapascan tribes who taboo fish and water animals.
  claim_level: same_function
  target: Mooney's account of a fish leaving the water and flying to secure prey
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: The note gives only a brief comparison and explicitly says the exploit
    seems not to be known to other Southern Athapascan tribes; it does not establish
    a full shared motif.
- id: claim:2
  claim: The passage's note identifies Yongaiisdzan with the moon and mentions Mescalero
    songs using moon-associated names for her.
  claim_level: linguistic_similarity
  target: Mescalero song names for Yongaiisdzan, including moon-associated names
  evidence_refs:
  - ev:3
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The note concerns identification and naming, not a detailed parallel
    narrative.
- id: claim:3
  claim: The trail-monster incident is said by the editor to be similar to an incident
    in Matthews and to have been recorded from the San Carlos Apache.
  claim_level: same_motif
  target: Matthews p.122 and a San Carlos Apache recorded version of a similar incident
  evidence_refs:
  - ev:4
  - ev:5
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note states similarity but provides no detailed parallel text in
    this passage; it also says the similar incident is not associated with a stream.
- id: claim:4
  claim: The toothed-vulvae episode is explicitly identified in the note as a very
    widespread conception.
  claim_level: same_motif
  target: Widespread toothed-vulvae conception cited to Lowie and Dorsey
  evidence_refs:
  - ev:6
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides a general comparative note with citations but
    does not reproduce the other versions.
- id: claim:5
  claim: The closing-rocks danger is compared by the note to a usual form in which
    approaching rocks are encountered on the journey to the sun.
  claim_level: same_motif
  target: Approaching-rocks danger on the journey to the sun in Matthews p.109
  evidence_refs:
  - ev:7
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage's episode concerns arrow reeds at a canyon junction, while
    the note says the usual setting is a journey to the sun.
