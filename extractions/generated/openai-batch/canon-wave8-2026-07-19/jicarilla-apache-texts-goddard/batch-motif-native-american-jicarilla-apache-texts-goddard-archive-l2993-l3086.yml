canonical_text:
  quote: ''
  summary: The passage recounts travel eastward, buffalo hunting, a night horse raid
    by enemies, failed pursuit, capture of wild horses, return toward Cimarron, recurring
    fighting and victory dances, a multi-group expedition with Kit Carson against
    an enemy camp, and the opening of an expedition led by Maxwell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traveling party broke camp, went east to Red River by way of named camps,
    encountered buffalo, killed several, and brought meat home on three successive
    days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night, enemies came and drove away half of the party's horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The party pursued the enemies for two days, did not overtake them, returned
    to the place of the theft, and those with extra horses lent them to those without
    for packing loads.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men riding out on the sides of the main party discovered a band of wild horses,
    and the main party pursued, surrounded, and captured many of them near the south
    side of a dry lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A colt stopped when the wild horse it followed was caught, and everyone laughed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Returning westward up Canadian River, the party saw more wild horses near
    Salt River and caught two.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Ollero went westward to their own country, while the narrator's group
    camped by Cimarron on the other side of the Rio Grande, described as their country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator says enemies used to come after them at Cimarron, but they did
    not move westward because of this and instead went east to fight them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When enemies were killed, their horses were taken; when the party returned
    with scalps, they camped around Cimarron, danced, and kept watch toward the east.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: An expedition from Cimarron with Gidi, identified as Kit Carson, included
    Ute, Apache, soldiers, and Mexicans going after enemies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Scouts were sent to observe the enemy camp, and the party later saw campfires
    near daybreak.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Apache horsemen fought enemies at two camps, drove them from the upper camp
    to the lower camp, took horses, and fought until night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The fight resulted in many soldiers killed, one Apache killed, two Apache
    wounded as described, many enemies killed, and tents and goods brought home on
    wagons.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the Kit Carson expedition, the party returned to Cimarron and danced
    until tired.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The next section opens with fourteen Apache men leaving on horseback from
    the same area for an expedition associated with Maxwell.
  category: sequence
  evidence_refs:
  - ev:8
