canonical_text:
  quote: ''
  summary: The passage contains several hunting and travel accounts. A group camps
    on the plains for buffalo, kills many animals, then returns because their arrows
    are depleted. A second account describes a successful eastward hunting journey
    from the Taos area and a sunwise return with meat. A third first-person account
    describes a mountain hunting party with named companions, limited weapons, kills
    of cattle-like game, a fawn, and an antelope buck, and a communal meal provided
    by the narrator's wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the fall, a camp moved onto the plains for buffalo and stopped at the Canadian
    River and several named places before coming among the buffalo.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bulls ahead of the buffalo herd were killed, and the meat was brought back
    to camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief told the camp to stay two days, prepare everything, and then move
    toward the buffalo in the evening.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After moving east and camping in an arroyo, the group found that buffalo had
    run away during the night, but scouts later reported buffalo in large numbers
    in all directions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hunters rode among the buffalo and killed many animals over several days,
    bringing back much meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chief said the arrows were gone and warned that the group could not shoot
    if an enemy saw them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The group became afraid and returned while some meat was still fresh, leaving
    some flour behind and traveling with few or no arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The group traveled by day and night, reached Cimarron in four days with the
    meat, and made many arrows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the account titled 'A Successful Hunt,' a camp beyond Taos moved east after
    buffalo through a long sequence of named places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The successful-hunt group brought in deer, white-tail deer, elk, buffalo,
    antelope, and more white-tail deer meat.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The successful-hunt group turned sunwise and came back with much meat, and
    the narrator says they were not hungry.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a later first-person account, the narrator hunted on a mountain with four
    tipis of people, named companions, two young men, horses, and only one gun.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The young men killed a cow and calf, the narrator killed a fawn, and on the
    next day young men killed a large antelope buck.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The narrator moved camp to the top of the mountain and camped by a stream;
    when the others arrived, the narrator's wife gave them meat, which they ate happily
    while shouting.
  category: sequence
  evidence_refs:
  - ev:8
