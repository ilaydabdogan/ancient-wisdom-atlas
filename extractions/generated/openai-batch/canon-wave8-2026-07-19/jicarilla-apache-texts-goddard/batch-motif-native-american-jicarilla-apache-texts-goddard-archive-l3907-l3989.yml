canonical_text:
  quote: ''
  summary: The passage describes ceremonial treatment of a boy and girl in a tipi,
    including dressing, painting, offerings toward the rising sun, repeated running
    and whistling, distribution of corn, collection of grass and horse manure from
    four directions, prayers, smoking, singing, dancing, eating, and final washing
    and painting. It then describes observances in butchering buffalo, including throwing
    a piece of yellow back meat toward the east and not taking certain pieces home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy and girl sit behind the fire in the tipi, with the girl on the south
    side and the boy on the north side; clothing and ceremonial items are placed in
    front of them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest sprinkles the clothing and items with L’ectcic and pollen before
    dressing the boy and girl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl's items include moccasins, leggings, shirt, beads, bracelets, earrings,
    feathers, and yellow paint; the boy's items include moccasins, leggings, shirt,
    feathers, arrows, quiver, and white paint.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The priest dresses the girl and boy, ties feathers to their crowns, puts buckskin
    on the girl’s shoulders, places the quiver strap across the boy’s breast, and
    paints the girl’s face yellow and the boy’s face white.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest leads both children eastward and strews pollen and L’ectcic toward
    the rising sun in repeated arcs of a circle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman calls out, the girl runs forward with the boy behind her, they turn
    back, and the woman whistles into the girl’s mouth; this sequence is repeated
    four times before they return to the tent.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A pile of corn outside the tent is distributed by the girl among all the women
    using a horn spoon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy runs successively toward the east, south, west, and north, each time
    returning with grass and horse manure and placing them behind the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man addresses the boy as grandson and speaks of practicing herding
    horses on foot, roping a good horse, and saying that the horses and property will
    like him and remain fat.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Over several evenings and days, the priest, old man, other men, and gathered
    people smoke, pray, sing, dance, eat, and drink tiswin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At dawn, the priest removes the feathers from the boy and girl, their hair
    is washed with amole, red paint is rubbed on their cheeks, pollen is put on their
    crowns, L’ectcic cross marks are made on their faces, and all present are painted
    red.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the buffalo butchering observance, a piece of yellow meat from along the
    back is cut off and thrown toward the east, and that piece and the biceps muscles
    are not carried home, while the remainder is used.
  category: action
  evidence_refs:
  - ev:10
