canonical_text:
  quote: ''
  summary: 'The passage contains short ethnographic notes and ceremonial descriptions:
    a rule against throwing horse gear used in bringing meat; a buffalo ceremony using
    manure, pollen, L’ectcic, prayer, singing, and communal requests for nearby buffalo
    and meat; a buffalo prayer with smoke, singing, horn gestures, and a song for
    a young yellow calf; a warning about illness from mishandling eagles; an infant
    ceremony with water, powders, red paint, blanket, and string; an explanation of
    mother-in-law and son-in-law avoidance; and a burial procedure involving dressing
    the dead, red face paint, grave goods, a horse, grave covering, horse killing,
    and relatives cutting hair.'
  language: English
  quote_policy: summarized
