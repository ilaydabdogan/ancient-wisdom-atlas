candidate_motifs:
- id: motif:1
  label: animal guardians institute a curing ceremony
  taxonomy_refs: []
  basis: Named animals and all animals in charge of fruits gather and celebrate a
    medicine dance for three sick men.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage identifies the animals and their ritual action but does not
    elaborate their mythic status beyond fruit guardianship.
- id: motif:2
  label: restricted ritual enclosure with taboo against looking
  taxonomy_refs:
  - forbidden_knowledge
  basis: The brush fence is not to be looked through from outside; people who look
    through the fence become pine trees, explaining the ongoing prohibition.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The taxonomy reference is based on a forbidden-viewing rule rather than
    a stated quest for knowledge.
- id: motif:3
  label: taboo violation punished by transformation into trees
  taxonomy_refs: []
  basis: Men who look through the ceremonial fence are transformed into pine trees.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The transformation is involuntary; no broader shapeshifter role is stated.
- id: motif:4
  label: miraculous accelerated plant growth in ritual
  taxonomy_refs: []
  basis: Corn, cherries, and amole seed placed in a hole become mature by the fourth
    entrance, and corn in the later ceremony grows and puts out leaves.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage presents ritual plant growth but does not explicitly connect
    it to a seasonal-cycle myth.
- id: motif:5
  label: body part or remnant becomes living animal
  taxonomy_refs:
  - death_rebirth
  basis: A rabbit tail placed in a clay pot is followed by a live rabbit jumping out
    of the pot.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives only a brief event; it does not describe the rabbit
    as dead or narrate a full death-and-rebirth sequence.
- id: motif:6
  label: ritual object broken and restored
  taxonomy_refs: []
  basis: The ts’anat’i break a muller in two and make it whole again.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The event is presented as a ceremonial feat without further explanation.
- id: motif:7
  label: stone objects become bread and are distributed
  taxonomy_refs:
  - sacred_exchange
  basis: Mullers become bread, are broken up, and are distributed to the people; the
    passage also says medicine was made good for all.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The sacred-exchange taxonomy is tentative because the passage emphasizes
    distribution but does not state reciprocity or exchange.
- id: motif:8
  label: fourfold ritual ordering
  taxonomy_refs: []
  basis: The passage repeats four nights, a fourth entrance, four ears of corn, four
    circuits around a fire, and gestures to east, south, west, and north.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The significance of the number four is not explicitly explained in the
    passage.
- id: motif:9
  label: harmless weapon demonstration
  taxonomy_refs: []
  basis: A participant cuts an arrow across, and another is shot with it without being
    killed.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives no further details about the action’s meaning or performers.
comparison_claims:
- id: claim:1
