canonical_text:
  quote: ''
  summary: The passage describes preparation of a fermented corn drink, then gives
    accounts of the origin and performance of a medicine ceremony. Animals associated
    with fruits hold a medicine dance for sick men. Ritual actions include fenced
    enclosures, a covered basket over a hole, moccasins used for beating, rattles,
    painted dancers, four-night and four-direction patterns, miraculous growth of
    corn and fruits, a rabbit emerging from a tail placed in a pot, harmless shooting
    with an arrow, taboo-breaking spectators becoming pine trees, and a later witnessed
    ceremony in which corn grows, stones are restored or become bread, and food is
    distributed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shelled corn is soaked in water, sprouted, dried in the sun, ground, cooked
    with water, strained, cooled, placed in a barrel, allowed to bubble, and drunk
    after bubbling stops.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Black Bear, Turkey, Rattlesnake, and all animals living on the earth who are
    in charge of various fruits gather in one place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gathered animals celebrate a medicine dance for the benefit of three sick
    men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A fence is made around the dancing grounds, and a buffalo hide is spread over
    a basket placed over a hole in the back of the tipi.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The moccasins of the three sick men are tied together and used to beat on
    the basket covered with buffalo hide.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A singer uses a rattle made from buffalo tail and rattlesnake tails while
    singing; the beating and singing continue for four nights.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A medicine ceremony is said to have been held west of Taos where mountains
    stand near each other.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brush fence around the ceremony is described as something through which
    no one outside is allowed to look.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A leg bone of a mountain sheep is rubbed along a notched stick to make a noise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tc’actcini and ts’anat’i enter twice while sticks are being rubbed and
    dance until morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The tc’actcini are described as four in number, painted with horizontal black
    stripes on white clay, with hair projecting from the sides of their heads like
    horns.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ts’anat’i are described as usually twelve in number, covered with white
    clay, wearing yucca-leaf bands and two eagle feathers in their hair.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: A note states that the tc’actcini and ts’anat’i do not wear masks as the Navajo
    do.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Men called masked men in the narrative put corn, cherries, and amole seed
    into a hole in the ground and put a rabbit tail in a clay pot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At the fourth entrance, the amole and cherries are ripe, the corn is hard,
    and a live rabbit jumps from the pot where the rabbit tail had been put.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: One participant cuts an arrow across, and they shoot another participant with
    it without killing him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Men who look through the ceremonial fence turn into pine trees; the passage
    gives this as the reason people must not look through the corral fence from outside
    while the medicineman is singing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Several mountains at the place are named after the account of the transformed
    spectators.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:19
  text: In a later witnessed ceremony west of the Rio Grande opposite Taos, two old
    men conduct a ceremony for two persons.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The two old men put corn in a deep hole and make it grow, introduce tc’actcini
    and ts’anat’i, give each dancer four ears of corn, build a large fire, and use
    an enclosure near the river.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: Dancers place corn into a pot away from the fire; when the pot is poked, crackling
    is heard and smoke comes out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: Dancers dance around the fire four times, the pot fills with corn, and corn
    begins to grow and put out leaves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:23
  text: The ts’anat’i hold mullers toward the east, south, west, and north, break
    a muller in two, and make it whole again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:24
  text: Corn from the pot is thrown to the people; afterward no corn is left in the
    pot, and the corn is not cooked.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:25
  text: The ts’anat’i go to their tipi and return; the mullers have become bread,
    which is broken up and distributed to the people.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:26
  text: The account states that they made medicine good for all and made the corn
    grow up.
  category: speech
  evidence_refs:
  - ev:11
