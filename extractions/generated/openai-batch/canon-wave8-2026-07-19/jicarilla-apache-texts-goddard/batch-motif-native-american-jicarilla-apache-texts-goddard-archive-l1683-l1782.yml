canonical_text:
  quote: ''
  summary: 'The passage contains contiguous tale material: Coyote takes a man''s wife
    after the man is stranded on a rock raised to the sky; the man later follows the
    camp trail, recovers his wife, and kills Coyote with fire-heated stones wrapped
    in fat. A second tale tells how Coyote tricks Owl, takes Owl''s arrows, disables
    Owl''s returning club, and kills Owl. A third tale begins with two young antelopes
    placed in Coyote''s path; Coyote proposes a footrace and gives them a quiver and
    bow before they run off.'
  language: English
  quote_policy: summarized
