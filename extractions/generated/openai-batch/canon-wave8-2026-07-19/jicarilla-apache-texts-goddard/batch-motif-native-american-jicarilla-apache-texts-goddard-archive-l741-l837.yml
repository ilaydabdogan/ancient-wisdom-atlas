canonical_text:
  quote: ''
  summary: Naiyenesgani assigns foods and plants to animal caretakers, identifies
    the homeland as the heart of the world, describes having made the world strong
    for the people, warns that removal from this place will lead to perishing, and
    leaves for his grandmother. A second version recounts his killing of a rolling
    rock that swallowed people, searching sacred mountains for remaining dangers,
    naming Balgai, returning to Taos, and telling the people that he has killed the
    monsters and made foods for them.
  language: English
  quote_policy: summarized
