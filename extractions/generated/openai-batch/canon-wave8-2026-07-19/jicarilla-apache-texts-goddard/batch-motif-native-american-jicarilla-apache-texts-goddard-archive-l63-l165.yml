canonical_text:
  quote: ''
  summary: 'The passage narrates an emergence: a mountain and vertical reeds are made,
    four girls twist the reeds, colored ladders are placed, scouts report water in
    the upper world, Beaver and Badger inspect the receding water, and the people
    ascend by four ladders. An old woman and old man are left behind and are identified
    in a note as rulers of the world of the dead. The people then travel east along
    four parallel trails under four chiefs. A following section begins with a divination
    about whether people would die, using a floating stick and a sinking stone muller.'
  language: English
  quote_policy: summarized
