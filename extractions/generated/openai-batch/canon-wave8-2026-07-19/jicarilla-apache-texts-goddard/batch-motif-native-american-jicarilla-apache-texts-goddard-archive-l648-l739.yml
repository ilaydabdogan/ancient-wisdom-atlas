  summary: The passage includes an editorial comparison note and the end of a bear
    episode in which Naiyenesgani kills a bear by striking its detached heart. It
    then gives the narrative of the Traveling Rock, repeated attacks on Jicarilla
    camps, the defeat of a killing stone, the medicinal use of material from that
    stone, the origin of yucca, sheep, and cattle after the monsters are gone, and
    the beginning of Naiyenesgani's leave-taking at the center or heart of the world.
