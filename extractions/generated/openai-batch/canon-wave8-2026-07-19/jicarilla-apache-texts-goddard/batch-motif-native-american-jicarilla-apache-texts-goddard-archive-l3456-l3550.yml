canonical_text:
  quote: ''
  summary: A first-person narrator recounts seasonal deer hunting near Gallinas, Cebolla,
    and Tierra Amarilla, repeated camp movements, packing meat by horse, and sharing
    meat with Navajo visitors and Apache people. A second account describes travel
    through Mescalero country, camping near soldiers and Mescalero, evading soldiers,
    searching for water, then hunting with Luna and others, killing and butchering
    deer and bringing meat back to camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In fall, the narrator went deer hunting near Gallinas and Cebolla, killed
    a deer, and moved camp several times, including to TsekeL, described as “stone
    flat.”
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During winter, the narrator killed deer near camp, packed meat with two horses,
    and Navajo visitors came on horseback to eat and take meat home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In spring, the narrator hunted once more, killed ten deer, brought the meat
    on three pack horses, and his wife gave Apache visitors meat and sinew; people
    also asked for bird feathers he had killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A later travel sequence begins at Tierra Amarilla and proceeds through multiple
    named places including Cebolla, Cangillon, El Rito, Cuchilla, Española, Santa
    Fe, TseLkaihuaye, Alamo Gordo, Bosque, Rio Bonito, and Carrizo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Rio Bonito the party camped among soldiers’ houses for four days; at Carrizo
    they camped among Mescalero, who were drinking tiswin.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hunting party including Carilla set out after deer; while camped near soldiers,
    the party was nearly caught and moved camp before daybreak in the rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The party separated into two bodies and camped where there was no water; after
    a failed search, three people found a little water in the plain, then followed
    the moved camp to the edge of water by Turkey Mountain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before daylight, the narrator and Luna went hunting together, found deer in
    the timber, separated to either side, and lost sight of each other.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator climbed among standing trees for visibility, missed shots at
    deer, adjusted the gun sight, then shot a deer from behind trees, butchered it,
    and placed the meat on a tree for later retrieval.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: On returning past an arroyo, the narrator saw a band of deer, shot from the
    edge of rock, killed seven, butchered them, got a horse, and brought them back
    to camp.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Other hunters also returned with meat; Luna killed five animals, including
    three antelope and two deer, while other men killed one, two, and three animals
    respectively.
  category: action
  evidence_refs:
  - ev:11
