canonical_text:
  quote: ''
  summary: 'The passage contains several Coyote tales: Coyote deceives and kills prairie
    dogs, cooks them, and loses most of them when Wildcat steals them; Coyote later
    retaliates against Wildcat; Coyote and Beaver each strand the other away from
    safety; Coyote imitates Kingfisher''s ice-diving hospitality, dies, and is revived
    by Kingfisher. Editorial notes compare one story with a Blackfoot Old Man story
    and mention a Sia version of another incident.'
  language: English
  quote_policy: summarized
