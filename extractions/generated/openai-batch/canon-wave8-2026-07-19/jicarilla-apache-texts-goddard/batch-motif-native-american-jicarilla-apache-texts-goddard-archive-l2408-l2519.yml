canonical_text:
  quote: ''
  summary: The passage contains several short first-person animal descriptions, including
    a tree-dwelling bird, Flicker, Lewis Woodpecker, and Owl; an account of Owl producing
    meat in a basket; a tale of Panther as an abundant deer hunter visited by Wolf;
    and the beginning of a tale in which four men at Taos travel with their minds,
    attack enemies from four directions, and send a messenger to the governor Old-woman-her-hand-white,
    who disbelieves and shackles him.
  language: English
  quote_policy: summarized
