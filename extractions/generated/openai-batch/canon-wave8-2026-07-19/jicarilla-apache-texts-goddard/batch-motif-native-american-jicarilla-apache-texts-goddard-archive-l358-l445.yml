canonical_text:
  quote: ''
  summary: Xaiyenesgani kills the eagle father and mother after learning where they
    sit, then imposes speechlessness and other conditions on the young eagles. His
    grandmother, identified as bat, carries him down a cliff in her basket. He gives
    her feathers but she repeatedly ignores his instruction about the path, loses
    the feathers to birds, and receives poor feathers and a rock-cleft dwelling as
    her condition. Xaiyenesgani then goes to a bad place where people ask him to recover
    captives sunk in a marsh. He stands at the four directions, the water disappears,
    and he compels the marsh monster to release the people, then orders the monster
    to remain silent like soft mud.
  language: English
  quote_policy: summarized
