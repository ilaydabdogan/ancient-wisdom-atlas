  claim: An editorial note reports a Kiowa-Apache version in which Thunder kills the
    swallowing monster with a thunderbolt.
  claim_level: same_motif
  target: Kiowa-Apache telling of the swallowing-monster episode
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:7
  confidence: medium
  limitations: The comparison is based only on the note in this passage; the main
    Jicarilla passage has Spider tear the monster to pieces rather than Thunder killing
    it.
- id: claim:2
  claim: An editorial note states that the swing incident is also found among the
    Assiniboine.
  claim_level: same_motif
  target: Assiniboine swing incident cited to Lowie
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note identifies the incident but does not provide the Assiniboine
    narrative context in this passage.
- id: claim:3
  claim: An editorial note connects the eagle story with Matthews’s 'The Great Shell
