  - trickster_boundary
  basis: Coyote takes fire by means of his tail; the fire is relayed by Duck, Dove,
    and Kingfisher; people then obtain fire and use it for food.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents acquisition of fire but does not explicitly call
    it theft in analytical terms; the classification rests on the described action
    of taking and fleeing.
- id: motif:2
  label: tree route between vertical levels
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: The children show Coyote a piñon tree by which people travel up and down,
    and Coyote uses it to descend.
  evidence_refs:
