canonical_text:
  quote: ''
  summary: The passage includes the end of a Coyote fire episode, a swallowing-monster
    episode, and the beginning of an eagle-nest episode. Coyote obtains directions
    to a trail marked by a piñon tree, marks his face with white clay, joins dancers,
    steals fire with his tail, and the fire is relayed by Duck, Dove, and Kingfisher
    for the benefit of people. In the swallowing-monster story, a girl repeatedly
    finds deer near a spring; a monster pursues the camp, is delayed by personified
    implements, swallows many people, and is destroyed by Spider, who saves the girl.
    Spider’s jealous wife later causes the girl to fall into water and become a frog.
    The final section begins with a poor Apache man lowered by Pueblo people to an
    eagle nest, where he stays with two young eagles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote asks three children to show him the upward trail, gives them beads,
    and they show him a piñon tree used by people for going up and down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote goes down by the piñon tree, finds white clay, and whitens his face
    with zigzag lines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote joins dancers; after being warned that his tail is burning, he says
    he has supernatural power for it, pokes the fire with his tail until it catches,
    and runs away with the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire is passed from Coyote to Duck, from Duck to Dove, and from Dove to
    Kingfisher; Kingfisher flies around the border of the sky with it and says that
    fire came from him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: People use the acquired fire for eating, their food becomes sweet, and people
    throughout the world are pleased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the monster story, people camp near a spring while hunting deer; a girl
    finds a dead deer there on four occasions, and the deer are brought in and eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After seeing the monster in the dark, the people build a large fire and instruct
    a fire poker, hide-dressing pole, muller, and pestle to make human-like sounds
    after they flee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The monster is repeatedly drawn back to the old camp by the sounds of the
    implements, then swallows the implements and later swallows all the fleeing people
    except the little girl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spider hides the surviving girl under the knot of his hair braid, denies seeing
    her when questioned, and after being threatened tears the monster to pieces and
    takes the girl home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Spider’s wife is jealous of the girl, makes a swing with a poor rope tied
    to a tree by a lake, and the girl falls into the water on the second swing and
    becomes a frog.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A poor Apache man is fed by Pueblo people, goes with them to an eagle nest
    on a sheer cliff, is lowered by rope to two young eagles, removes the rope, and
    remains there while the others fail to retrieve him.
  category: sequence
  evidence_refs:
  - ev:11
