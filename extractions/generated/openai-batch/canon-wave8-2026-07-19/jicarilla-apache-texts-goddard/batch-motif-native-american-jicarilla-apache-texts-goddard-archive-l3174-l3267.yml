literal_observations:
- id: obs:1
  text: A group moves camps through named places, finds buffalo, kills buffalo, dries
    the meat, ties it in parfleches, packs it on horses, and returns by way of several
    river locations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A medicine ceremony takes place east of Picuris near houses by a river, with
    many people present and dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the ceremony, the Apache move camp to the top of a mountain and then
    through a succession of named camps toward Cimarron.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Ute from the Cimarron camp goes to town to buy whisky in canteens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Enemies coming from the east meet the Ute, and he begins fighting them while
    alone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ute’s people arrive at the fighting place on the Canadian River just as
    he is shot through the chest; he catches the horse’s neck and falls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Someone unties the medicine the Ute was wearing across his chest; he spits
    blood and sits up.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The medicine is put in the Ute’s mouth four times with a spear of grama grass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wounded Ute asks for a pipe, smokes, the blood stops flowing, and a cloth
    is tied around his chest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Apache and Ute pursue the enemy eastward; one enemy is killed on the bank
    of the Canadian River.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The retreating enemies throw away weapons and clothing, and the Apache take
    property and many horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: They dance with the scalp after the pursuit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pesita and another Indian shoot at each other; the other man is shot in the
    shoulder with an arrow and killed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Ollero come near Pesita’s tipi, shoot at him, and Pesita is hit by a musket
