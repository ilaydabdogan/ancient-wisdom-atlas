  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Coyote returns without meat, and the narrative states that he had been telling
    lies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coyote is caught for lying, put in a sack, and carried to the house of a judge
