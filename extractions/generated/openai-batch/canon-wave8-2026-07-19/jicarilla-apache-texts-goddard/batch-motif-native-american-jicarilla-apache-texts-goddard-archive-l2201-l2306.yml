canonical_text:
  quote: ''
  summary: 'The passage contains several short Coyote-cycle episodes and a Mosquito
    episode: Coyote is shot through by an arrow after challenging its power; Coyote
    insults and soils a rolling rock and is pursued until he cleans it; Coyote and
    Mosquito each obtain or keep wives through false claims; Coyote fakes hunting
    success with blood; and Coyote, captured for lying and brought to a judge, transforms
    into a girl, bites the judge, steals money, and throws money onto trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote shoots arrows into the underside of a tree limb where turkeys sit,
    cuts down the tree, recovers the arrows, and repeats this four times according
    to an editorial addition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote says an arrow will not kill anything, asks to be shot with it, runs
    away after being shot, and is left with only a rim of hair after the arrow passes
    through him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rolling rock says it will roll over Coyote; Coyote denies that it can overtake
    him and then defecates and urinates on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rock rolls after Coyote over hills until Coyote becomes tired; Coyote
    then licks the rock clean and leaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote asks for a girl in marriage, displays his leg muscles to meet the father’s
    stated condition, and is given the girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a horse whinnies, Coyote claims it is his horse; later he claims to have
    followed his horse and describes rich riding equipment on it.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Mosquito marries the man’s daughter, comes to her at night, repeatedly claims
    to have hunted, and returns with blood but no meat or bones.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mosquito says ravens ate the meat and bones or that meat put in a tree was
    eaten by ravens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mosquito’s wife uncovers his face at sunrise and sees his long slender mouth
