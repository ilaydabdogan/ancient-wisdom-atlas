canonical_text:
  quote: ''
  summary: The passage describes a Chippewa flute-like instrument called hibl'gwiln,
    its provenance, dimensions, tonal range, and an old melody furnished for it. It
    then summarizes the character, themes, verbal flexibility, and musical statistics
    of recorded Chippewa love songs, emphasizing sadness, disappointment, departure,
    loss, longing, and distinctive melodic traits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A musical instrument called hibl'gwiln is described as commonly called a flute
    but constructed more like a flageolet and blown at the end rather than at the
    side.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instrument was procured at Lac du Flambeau from a middle-aged woman who
    said it had belonged to her grandfather.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A test of the instrument found a lowest tone near G, clear tones in the next
    octave, no response in the second octave, and faulty intonation especially on
    the fourth and seventh.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rev. C. H. Beaulieu furnished a melody played on this instrument, and the
    melody was said to be very old.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Chippewa love songs are plaintive and usually express
    sadness and disappointment; of thirty recorded examples, only one is inspired
    by happiness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The summarized love-song subjects include promise, request, departure of a
    lover, loss and longing, jealousy and offense, fickleness, and attempts to drown
    disappointment in drink.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Love-song words are sometimes impromptu, and new words may be fitted to old
    tunes while retaining the same general idea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage treats the love songs as a distinct phase of musical culture and
    practice because expression by words and music is freer in this group than in
    other groups.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage gives musical statistics for the love-song group, including major
    tonality in forty percent, frequent beginnings on tonic, octave, or dominant,
    and frequent endings on tonic or dominant.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage notes that most love songs have a compass of an octave or more,
    many contain all tones of the octave, five-toned scales are relatively infrequent,
    and the flat third associated by the author with sadness does not appear.
  category: attribute
  evidence_refs:
  - ev:6
