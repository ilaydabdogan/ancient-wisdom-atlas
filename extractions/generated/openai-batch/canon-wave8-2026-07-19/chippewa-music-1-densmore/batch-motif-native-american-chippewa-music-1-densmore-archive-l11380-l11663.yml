canonical_text:
  quote: ''
  summary: The passage presents three Chippewa war-related songs sung by Odjib'we.
    No. 34 describes Sioux women wailing while gathering wounded men. No. 35 is framed
    as a song composed on the Chippewa homeward journey, remembering pursuing feet
    and describing war as a game. No. 36 is associated with an exhausted warrior who
    cannot travel, uses medicine, rises, sings a newly composed song, and continues
    with the returning war party. The passage also includes musicological analysis
    of renditions, tonality, rhythmic units, and comparisons to other songs in the
    same work.
  language: English with transliterated Ojibwe song words
