  summary: 'The passage presents several Chippewa war-related songs and their contexts:
    a pipe-smoking episode and a war messenger''s return, the gathering of warriors
    near a leader''s lodge, a feast and final pledge that formally inaugurate an expedition,
    nightly dances before reaching the enemy, a song declaring fearlessness when death
    is mentioned, and a shaming song about a man who stayed home.'
