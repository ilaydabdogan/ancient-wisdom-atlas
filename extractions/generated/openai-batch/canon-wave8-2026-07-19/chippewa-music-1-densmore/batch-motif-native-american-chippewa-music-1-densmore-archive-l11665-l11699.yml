canonical_text:
  quote: ''
  summary: 'The passage describes the return of a victorious war party: runners announce
    the approach, the warriors prepare songs and clothing, women meet them, receive
    and carry scalps on poles, lead a procession, arrange a feast called “feasting
    the Sioux,” and later honor the victors with gifts and a song whose indirect meaning
    is explained by Odjib''we.'
  language: English
  quote_policy: summarized
