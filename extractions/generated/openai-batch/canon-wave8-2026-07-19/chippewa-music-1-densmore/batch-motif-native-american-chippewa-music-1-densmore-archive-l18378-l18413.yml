canonical_text:
  quote: ''
  summary: 'The passage describes rules for the moccasin game at White Earth, Minnesota:
    one side hides bullets, the other guesses the location of a marked bullet, score
    is counted with sticks, special endgame rules apply, and stakes are settled after
    an agreed series of games.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One side continues hiding bullets until the guessing side guesses correctly,
    and then the score is counted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The guesser with the striking-stick holds it in his right hand and holds counting-sticks
    in his left hand; the counting-sticks are initially twenty in number.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each side receives counting-sticks according to the score to which it is entitled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When three or fewer counting-sticks remain, the man holding the bullets does
    not guess, and the game depends on the player with the striking-stick.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the marked bullet is under an end moccasin and the player with the striking-stick
    guesses correctly, the game is his; if it is under a middle moccasin and he fails
    to locate it, his opponents win.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The score depends on whether the marked bullet is under an end or middle moccasin,
    the number of guesses required, and whether the guesser and his partner agree
    or disagree in their choice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the bullet is under a middle moccasin and both guessers fail to locate
    it, the hiding side adds eight counting-sticks to its score; if only one guesser
    fails, the score is six.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the conclusion of each game, a stick about ten inches long is placed into
    the ground at the edge of the blanket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Stakes are settled after a number of consecutive games agreed on at the beginning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The term “double crack” is said to be mentioned in the words of song No. 175,
    Bulletin 45.
  category: speech
  evidence_refs:
  - ev:5
