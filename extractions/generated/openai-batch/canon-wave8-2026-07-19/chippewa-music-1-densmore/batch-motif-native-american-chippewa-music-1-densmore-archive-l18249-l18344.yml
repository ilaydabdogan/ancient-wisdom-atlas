  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The game may be played by two men, but usually has four contestants, with
    two partners on each side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each side hides four bullets under four moccasins laid in a row on a blanket,
    and one of the bullets is marked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The game uses counting-sticks, a striking-stick, hidden bullets, and additional
