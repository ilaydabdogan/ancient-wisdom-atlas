- id: obs:2
  text: A wife appeared to a man and told him that four bullets were hidden somewhere
    in the woods, would bring success in the moccasin game, and must lie in water
    before use.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man searched in the woods day after day, found four bullets, placed them
    in water at the edge of a lake, used them in a game, won everything, and was thereafter
