canonical_text:
  quote: ''
  summary: 'The passage identifies a moccasin game at White Earth, Minnesota, and
    gives an origin account for soaking game bullets: a wife appears to a man and
    tells him of four hidden bullets that will bring success if laid in water before
    use. The man finds them, soaks them at the edge of a lake, and thereafter wins.
    The passage then describes a related dream of money under moccasins, the rules
    and implements of the moccasin game, the roles of hiding and guessing sides, observational
    strategies for detecting the marked bullet, wagers, and the use of song and drum
    while bullets are hidden.'
  language: English
  quote_policy: summarized
