  summary: The passage describes a Chippewa-Sioux peace pact ceremony involving processions,
    women moving between opposing warriors, reciprocal praise songs naming the other
    side’s leaders, guns fired into the air and not reloaded, reciprocal peace-pipe
    offerings, handshakes, hospitality, and post-pact social dances.
