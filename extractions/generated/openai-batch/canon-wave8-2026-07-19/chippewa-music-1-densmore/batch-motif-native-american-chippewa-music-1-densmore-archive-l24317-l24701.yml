canonical_text:
  quote: ''
  summary: 'The passage describes the woman''s dance among Minnesota Chippewa, including
    reported Sioux acquisition, circular movement around a drum, gender arrangements,
    and gift exchange. It then presents and analyzes four songs: a woman''s dance
    song, an old war-return song, a southern dance song, and an older dance song with
    a lyric saying the entire world weeps for the singer.'
  language: English with Ojibwe song words and names
  quote_policy: summarized
