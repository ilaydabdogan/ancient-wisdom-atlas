canonical_text:
  quote: ''
  summary: The passage presents two songs associated with a boy's fasting vigil. The
    first is sung before the boy goes alone from camp after blackening his face; its
    words mention a receding sound from a nest. The second is sung after the boy and
    other boys return from fasting. They dance around a medicine pole while E'niwub'e's
    grandfather sings; water flows from a hole in the pole into a birchbark dish,
    and the boys drink it to break their fast. The songs are said to have been composed
    in dreams, and the medicine pole was made to match a vision. A footnote reports
    a similar Assiniboin Sun-dance pole water practice.
  language: English
  quote_policy: summarized
