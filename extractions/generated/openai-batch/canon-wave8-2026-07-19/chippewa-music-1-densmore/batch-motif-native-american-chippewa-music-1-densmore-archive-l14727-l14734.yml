  summary: After listening to songs in E'niwilb'e's house, the writer goes outside
    at night. The lake and pines are visible in moonlight. A group carrying a drum
    comes down the road; the writer learns they had been dancing at Bi'jikens's house
    and are bringing the drum to E'niwub'e's, where singing would take place with
    both drums.
