canonical_text:
  quote: ''
  summary: The passage describes a comic children's song with disconnected images,
    including a pig in a tree, fighting Frenchmen, a rich man traveling toward water,
    and a rabbit speaking safely against a lynx. It frames Indian children listening
    near a fire in a wigwam and falling asleep. The passage then discusses Chippewa
    children's folk-tales, animal characters who sing, stories of We'nabo'jo and windigo,
    possible adaptations of European tales, and narrates the beginning and outcome
    of the tale of the Coon and the Crawfish, in which crawfish ignore an old female
    crawfish's warning, attack a seemingly sleeping coon, and are eaten while the
    old female remains safe in water.
  language: English
  quote_policy: summarized
