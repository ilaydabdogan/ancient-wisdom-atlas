- id: obs:2
  text: White Feather says that a person who believes in the drum and has lost friends
    cannot attend a dance unless invited, and that he asked for the mourners to be
    invited and their mourning ended.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: White Feather says he came, spread his own blanket on the ground for the mourners,
    and thanked his people and Manido for the warriors’ generosity in bringing the
    mourners to share happiness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman painted a row of dark blue dots below the eyes of the man who had
    lost his wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two younger women were painted with a horizontal red line below the eyes;
    one also had the parting line of her hair painted red. The passage states that
    red means blood, life, and long life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A song titled “Song of Painting the Faces” was sung while the faces were being
    painted, and the passage names Mec'kawigabau as the singer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eldest woman among the mourners was White Feather’s mother, mourning White
    Feather’s father, so White Feather asked an old man to make the speech before
    her face was painted.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old man, described as having fought in the Civil War, spoke of his bravery
    and said he would give the mourning woman the strength and power that upheld him
    in battle.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the old man’s speech, he handed paint to a woman, who knelt before the
    aged mourner and traced scarlet lines on her face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that a man distinguished in war may give the full result
    of his prowess, or the right to wear a similar feather, to a friend without losing
    it himself.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A “Mourners’ Song” was sung during the ceremony, with Mec'kawigabau named
    as singer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the face painting, White Feather told the mourners to lift their eyes,
    look at their friends, not cling to sorrow or unkind feeling, and have faith;
