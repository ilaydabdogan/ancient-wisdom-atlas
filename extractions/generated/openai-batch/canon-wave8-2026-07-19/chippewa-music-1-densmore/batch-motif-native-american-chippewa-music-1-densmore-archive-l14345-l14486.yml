canonical_text:
  quote: ''
  summary: The passage includes an etymological note translating a name as “sky in
    commotion,” then describes a ceremony for ending mourning among people associated
    with the drum. White Feather arranges for mourners to be invited, spreads his
    blanket for them, and thanks the people and Manido. Mourners’ faces are painted
    with blue and red marks while songs are sung; red paint is explained as blood,
    life, and long life. An old man speaks in White Feather’s place for White Feather’s
    mother and offers her the strength and power gained in battle. The passage explains
    that war prowess and the right to wear a feather may be shared without the giver
    losing them. White Feather then counsels the mourners to lift their eyes from
    sorrow, and they are seated with friends while gifts are silently placed beside
    them.
  language: English
  quote_policy: summarized
