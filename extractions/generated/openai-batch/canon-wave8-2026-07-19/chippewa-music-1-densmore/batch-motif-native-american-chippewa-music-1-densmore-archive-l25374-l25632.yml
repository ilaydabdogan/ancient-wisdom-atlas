  summary: The passage presents song transcriptions and analysis from Chippewa music
    materials. One song names chiefs from Sioux, Winnebago, and Chippewa groups and
    is explained as remembering them during a pleasurable dance occasion rather than
    indicating their presence. The passage then gives songs titled “Little Plover”
    and “Why?”, with analysis of dance imitation, text glosses, melody, rhythm, and
    rendition details. It ends with the beginning of a “Mide’ Burial Song” recorded
    without drum.
