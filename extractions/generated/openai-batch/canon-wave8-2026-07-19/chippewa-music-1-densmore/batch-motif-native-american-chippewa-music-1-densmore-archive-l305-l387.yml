    and plover and beetle calls.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Chippewa songs, minor thirds in ascending and descending progressions
    are reported as more than twice as frequent as major thirds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author interprets the Chippewa song data as suggesting interval relation
