- id: obs:1
  text: Most analyzed songs are described as diatonic; 85 percent contain no accidentals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When accidentals occur, the sixth is most frequently affected, and accidentals
    occur more often in love songs than in any other group.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Songs are classified by accented-tone relations as harmonic, melodic, or intermediate;
    the passage reports 83 harmonic songs, 222 melodic songs, and 35 intermediate
    songs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author notes that melodic boundaries and the persistence of the third
    and fifth suggest chord relation, but only a small percentage of songs are harmonic
    in structure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage reports a downward trend: 70 percent of first progressions are
    downward, 65 percent of all progressions are downward, and in 90 percent of songs
    the last tone is the lowest tone.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The second is the most frequent interval, but the minor third is next in frequency,
    making up 34 percent of downward progressions and 29 percent of upward progressions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage cites reported minor-third or non-major-third patterns in Asaba
