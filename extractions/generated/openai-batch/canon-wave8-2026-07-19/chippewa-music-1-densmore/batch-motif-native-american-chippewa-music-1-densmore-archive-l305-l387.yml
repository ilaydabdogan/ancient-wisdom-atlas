  summary: The passage gives a statistical musicological analysis of Chippewa songs,
    emphasizing mostly diatonic tone material, a predominance of melodic over harmonic
    structure, a downward trend in melodic progressions, and the prominence of the
    minor third, with comparisons to other musical corpora and animal calls.
  language: English
  quote_policy: summarized
