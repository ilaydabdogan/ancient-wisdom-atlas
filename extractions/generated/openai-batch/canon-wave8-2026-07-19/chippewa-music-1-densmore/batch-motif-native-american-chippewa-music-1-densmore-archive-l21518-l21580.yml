canonical_text:
  quote: ''
  summary: The passage describes Midewiwin observance at Waba'cing, including grave
    fires and grave offerings, then reports Waba'cing dancing, drumming, food distribution,
    named singers, phonograph playback, and a section on dream songs, noting that
    many recorded songs were said to have been composed in dreams and that Chippewa
    dream songs were probably often used in war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most Indians at Waba'cing are described as members of the Mide'wiwin, whose
    rites are closely observed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The writer saw two women tending a fire at the head of a newly made grave;
    the passage states that Mide' teaching requires this fire to be kept burning four
    nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near the newly made grave was the grave of a little child, where embers remained;
    a crude rattle loved by the child was on the grave, and a paper bag containing
    food was beside it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Waba'cing Chippewa dancing is described as free and individualized, with some
    dancers using the whole body and movements beginning in the shoulders and progressing
    to the feet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The drum was native-made, about 24 inches in diameter and 12 inches high,
    covered with untanned hide, suspended between four crotched sticks, and ordinarily
    accompanied by six or eight singers; leaders began alone before others joined.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: During dancing, food was distributed, including unsalted boiled beef, triangular
    skillet-cooked bread, and fried bread dough; older Waba'cing Indians are said
    not yet to like salt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Awtin'aktim'igicklifi', a Canadian Indian also glossed as 'fog covering the
    earth,' said he learned songs by sitting with old men as a boy and now sang songs
    made up in dreams by men of his village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Other singers are named and briefly characterized: A''jide''gijig, Ki''miwiin,
    Ki''miwiina''nakwad, and Gegwe''djibi''tim.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Playback of the recorded songs on a phonograph pleased the Indians, who gathered
    outside while the phonograph stood in the doorway of the carpenter shop where
    the songs had been recorded.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Forty songs were recorded at Waba'cing, twenty-six of them said to have been
    composed in dreams; the passage adds that most Chippewa dream songs were probably
    used in war and refers to a young man having a dream during a fasting vigil.
  category: sequence
  evidence_refs:
  - ev:10
