canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Chippewa-to-Menominee drum-presentation
    ceremony: a pipe is offered skyward while the Song of the Pipe is sung; food and
    delicacies are presented to the drum and later divided; a loosened drumhead is
    ritually addressed by song, dance, and heat; Bi''jikens presents the drum to Wis''kino,
    gives him personal items, and Chippewa participants contribute gifts; Wis''kino
    appoints a pipe custodian; the drum and pipe are transferred, gifts are distributed
    among Menominee participants, and the Menominee set up and lightly drum on the
    instrument.'
  language: English
  quote_policy: summarized
