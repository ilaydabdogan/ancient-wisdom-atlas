canonical_text:
  quote: "“the older Indians who understand the origin of the games and songs still
    hold them in reverence as a gift from the Manido'.”"
  summary: The passage introduces Chippewa game songs by stating that gambling was
    believed to have been taught by a Manido' to relieve hunger and ill fortune. It
    names three games, notes that songs accompanied the hand and moccasin games but
    not the plate game, and contrasts present-day pastime use with older reverence
    for their sacred origin. It then begins E'niwub'e's narrative of an unnamed Chippewa
    hunter whose children and wives die during a remote hunting expedition; bereaved,
    he rejects immediate suicide and instead wanders without drinking water until
    he collapses. A footnote cites A. T. Cringan on Iroquois musical accompaniment.
  language: English
  quote_policy: quoted
