canonical_text:
  quote: ''
  summary: The passage compares the musical structure and stated purposes of Chippewa
    dream songs with Mide', war, woman's dance, and gift-related songs. It then introduces
    war songs, describing their drum accompaniment in different settings and classifying
    them into dream-derived, charm/medicine, expedition-conduct, and success-commemoration
    categories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dream songs are described through statistical musical features, including
    harmonic feeling, downward progressions, minor thirds, changes of time, triple
    drum rhythm, and voice-drum metric relations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dream-song structure is described as more centralized than that of the
    Mide' songs, with harmonic form and many songs on five-toned scales referring
    tones to a keynote.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Mide' songs were generally used to affect persons
    other than the singers, while the dream songs in this group, except doctors' songs,
    were generally for securing a more personal advantage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The analysis states that dream songs resemble Mide' songs in some respects
    and resemble woman's dance songs and gift-connected songs in other respects.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the warpath, war songs were accompanied by a small drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At village dances before the departure and after the return of a war party,
    a large drum was used and drummers sat around it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: In recent years, war songs are described as being sung at tribal social dances
    with a drum similar to that used in the Drum-presentation Ceremony, though less
    elaborately decorated according to the writer's observation.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'War songs are divided into four general kinds: dream songs of individual
    warriors, songs concerning war charms and medicines, songs of the conduct of the
    war expedition, and songs commemorating its success.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first two kinds of war songs are described as connected with the supernatural
    element, while the success-commemoration songs are described as having no supernatural
    element.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage reports a statement that in earlier times no warrior would have
    dared sing a war song that was not composed in a dream, referring to the first
    two classes of war songs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The third class includes songs of the war messenger, dog feast, and departure
    of the war party; the fourth includes songs composed by a returning war party
    or in victory dances after a successful expedition, with class boundaries described
    as not strongly marked.
  category: sequence
  evidence_refs:
  - ev:6
