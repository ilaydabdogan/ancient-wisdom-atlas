literal_observations:
- id: obs:1
  text: An aged woman at Lac du Flambeau who made the moccasins cut a pattern and
    explained that formerly deerskin was cut with a knife rather than shears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman stated that no pattern was used in the old days; people made a foot
    covering and gathered it up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The moccasin was sewn up the instep, piped to hold it firm, moistened inside,
    molded with the back of a knife, and flattened at the gathered front with tepid
    water and pressure on the knee.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A fastening strip passed through two slits at the front of the instep, was
    tied there, and its long ends were passed around the ankle and tied at the back
    when worn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that in old days, when deerskin was plentiful, moccasins
    were cut in one piece, and that sewing was done with sinew according to old custom.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: After discussion and hesitation, a blind woman sang the song, and it was recorded
    by phonograph.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The song is identified as No. 113, a love song sung by O^gabea^sino'kwe, whose
    name is glossed as “woman of the breeze that blows to the end,” and it was recorded
    without drum.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The English gloss of the song says that the speaker will go and talk with
    a sweetheart identified as a widow and says that the speaker loves the sweetheart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The musical analysis says the metric unit is more rapid than in most love
    songs, with frequent prolonged tones, nearly the full octave except the third,
    and a freely melodic structure.
  category: attribute
  evidence_refs:
  - ev:5
