  summary: The passage analyzes Chippewa songs in terms of interval formation, prominence
    of the minor third, phonographic pitch calibration, key and vocal range, drum-accompanied
    rhythm, accented openings, and counts in the first measure. It includes cautious
    musical comparisons to other traditions and to Omaha music, but contains no narrative
    myth episode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A test of interval-formation included 40 songs recorded at Waba'cing, 50 war
    songs of Odjib'we recorded at White Earth, and 14 songs recorded by E'niwub'e
    at Lac du Flambeau.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Odjib'we war songs showed no instance of interval-formation, while 4 Waba'cing
    songs and 3 Lac du Flambeau songs showed the feature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the songs and singers at Waba'cing and Lac du Flambeau
    appeared to represent an older culture than the Odjib'we war songs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The minor third is described as prominent in Chippewa music and as approximately
    the average interval in Chippewa songs, with an average progression of 3.1 semitones.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For pitch analysis, the writer describes calibrating a spring-motor phonograph
    to 160 revolutions per minute and recording a known tone C from a pitch-pipe before
    the song record.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The last tone of a song is said to be usually the lowest tone and the tonic;
    most songs are said to be in the major keys of F, G flat, and G.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that 95 percent of the songs were recorded by men and that
    the table may indicate the range of voice among Chippewa men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: In rhythm analysis, the passage notes that most songs were recorded with drum
    accompaniment, while attention is directed first to vocal rhythm and the beginning
    of the measure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sixty-three percent of the remaining songs begin on the accented part of the
    measure; most have the rhythmic unit in the first measure, and the first tone
    is usually high.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that some Chippewa songs diminish in interest as they proceed
    and that some closing measures contain characterless phrases repeated indefinitely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After deducting outline transcriptions, 50 percent of the remaining songs
    begin in double time and 40 percent in triple time.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Measures with 5 or 7 counts are described as single units without secondary
    accent, not as combinations of shorter measures.
  category: attribute
  evidence_refs:
  - ev:7
