canonical_text:
  quote: ''
  summary: This analytical passage describes the measurement of Chippewa song tempo
    for voice and drum using metronome and phonograph methods. It reports tempo ranges
    and averages for voice and drum, states that the drum is generally faster than
    the voice without a clear proportion, notes independence between vocal and instrumental
    tempo, and discusses a possible but not recalled Chippewa example of two-against-three
    rhythm while citing comparable rhythms in other traditions.
  language: English
  quote_policy: summarized
