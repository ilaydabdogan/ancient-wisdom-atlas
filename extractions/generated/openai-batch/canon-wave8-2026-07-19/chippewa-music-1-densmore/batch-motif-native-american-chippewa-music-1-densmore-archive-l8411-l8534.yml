canonical_text:
  quote: ''
  summary: A Chippewa war party scouts a Sioux camp, follows the Sioux by night, and
    attacks at dawn. A day-long fight follows; a Chippewa chief is killed, three Sioux
    scalps are taken, and the Chippewa return home with trophies. The victory is celebrated
    with dances and a song sung by Odjib'we, whose words state that the singer will
    start out again in his canoe. The passage then introduces a later group of songs
    connected with another Sioux-Chippewa fight involving Little Six and Niski'gwun.
  language: English with Ojibwe song text/transliteration
  quote_policy: summarized
