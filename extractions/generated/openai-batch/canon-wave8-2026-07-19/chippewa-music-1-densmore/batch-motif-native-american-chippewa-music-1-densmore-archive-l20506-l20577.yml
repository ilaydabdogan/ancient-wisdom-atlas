  summary: The passage gives a musical analysis of No. 126, a Moccasin Game Song,
    then presents No. 127, a lullaby sung without drum. The lullaby is compared with
    a White Earth Chippewa version, described as wordless with the repeated vocable/root
    “wewe,” and a note explains that this root implies swinging motion. The note also
    describes Chippewa cradle-board practices in which a baby fastened in a cradle-board
    is swung in a blanket hammock or moved back and forth by a seated woman’s feet.
