canonical_text:
  quote: ''
  summary: The passage presents analysis and narratives for Chippewa songs connected
    with deer and buffalo. One deer-dance song is said to have come in a dream to
    an old man who hosted a feast; another old man led a dance imitating deer, and
    hunters formerly performed such a dance before hunting. A second deer song represents
    a deer walking alone and proud of shining horns. A buffalo song is said to have
    originated when a fasting man heard buffalo singing, saw them circling in mud,
    joined them, became a buffalo, and received their song.
  language: English
  quote_policy: summarized
