  summary: The passage compares musical features of Mide' songs with other Chippewa
    song groups, emphasizing tone material, downward melodic motion, rapid unaccented
    drumbeat, rhythmic units, and possible links to motive and mental state. It then
    introduces Dream Songs, described as songs that come to mind in a dream or trance
    after isolation and fasting, and notes a comparison with Ghost Dance songs reported
    by James Mooney.
