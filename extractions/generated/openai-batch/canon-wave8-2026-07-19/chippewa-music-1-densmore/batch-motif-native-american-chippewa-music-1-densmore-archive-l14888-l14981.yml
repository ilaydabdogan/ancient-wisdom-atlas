canonical_text:
  quote: ''
  summary: The passage describes Chippewa visitors reaching Menominee country, camping
    near a dancing circle, and being ritually received by the Menominee. Wis'kino
    sends a messenger, the Menominee form reception lines under a flag, the Chippewa
    arrive in procession with flags, pipes, and drums, White Feather speaks of meeting
    peacefully before Manido, pipe bearers perform a shared pipe rite, all exchange
    handshakes, and ritual objects are placed in or near the dancing circle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The arriving Chippewa are described as footsore, dusty, tired, bedraggled,
    and carrying packs after reaching Menominee country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A temporary Chippewa camp is established about a quarter mile from the dancing
    circle, with tents under pine trees, camp fires, and steaming kettles.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Menominee assemble in the dancing circle and dance intermittently before
    Wis'kino sends a messenger to invite the visitors to proceed.
  category: action
  evidence_refs:
