canonical_text:
  quote: ''
  summary: The passage describes nineteenth-century Chippewa-Sioux territorial conflict,
    the organization and motives of war parties, and the career and war-honor regalia
    of Odjib'we, a Chippewa warrior leader associated with Hole-in-the-day. It explains
    that war parties were often organized for revenge after a kinsman's death, that
    war honors were tallied through scalps, and that eagle feathers, notches, rabbit-skin
    dots, and ribbons marked specific war achievements.
