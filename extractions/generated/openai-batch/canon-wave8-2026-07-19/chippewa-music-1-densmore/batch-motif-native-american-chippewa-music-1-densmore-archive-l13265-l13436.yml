  summary: The passage presents three Chippewa/Ojibwe war-related songs, Nos. 51-53,
    with musical analysis and ethnographic notes. It describes a boys' sham battle
    between Chippewa and Sioux children preceded by song, adult singing and a start
    command, and a related little girls' war song associated with mimetic dancing
    and jumping around.
  language: English with Ojibwe song words and glosses
  quote_policy: summarized
