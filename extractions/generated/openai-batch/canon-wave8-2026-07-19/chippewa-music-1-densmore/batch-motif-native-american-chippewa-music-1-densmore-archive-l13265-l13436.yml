  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A following song was used as a preliminary to a sham battle between Chippewa
    and Sioux boys.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boys participating in the sham battle were unclothed and arranged in facing
