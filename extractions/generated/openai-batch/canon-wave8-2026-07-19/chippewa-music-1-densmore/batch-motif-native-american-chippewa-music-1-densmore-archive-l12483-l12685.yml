canonical_text:
  quote: ''
  summary: The passage describes the ca^wuno^ga as an old dance originally used for
    healing after being taught by the South Manido^ to a young man whose relatives
    recovered. It then gives musical examples and analyses of ca^wuno^ga songs. A
    later section narrates a story associated with a war song concerning Bica^ganab,
    a Chippewa woman who fought during a Sioux attack, escaped in the water, returned
    to the battlefield, scalped dead Sioux, gathered trophies, and returned to the
    Chippewa camp.
  language: English
  quote_policy: summarized
