canonical_text:
  quote: ''
  summary: 'The passage describes stages in a Chippewa-Menominee drum-presentation
    ceremony: Wis''kino ceremonially touches the drum after feigned strikes, leading
    drummers strike it, and the Song of the Owner of the Drum marks Menominee ownership.
    Gifts are exchanged, Wis''kino speaks about caring for the drum, pipe bearers
    present and pass pipes, and the Song of Departure ends the day''s ceremony. The
    chief drum is placed in the Menominee chief''s house beside a ready pipe. The
    following day a warrior drum is presented. On the fourth day there is dancing,
    presentation of adornments, and a Song of the Closed Door that restricts leaving
    the enclosure without a fee. The passage then notes the Dog Feast as sometimes
    associated with the fourth day, including statements that it was received from
    the Sioux and that feather garments used by leaders came from the Sioux.'
  language: English
  quote_policy: summarized
