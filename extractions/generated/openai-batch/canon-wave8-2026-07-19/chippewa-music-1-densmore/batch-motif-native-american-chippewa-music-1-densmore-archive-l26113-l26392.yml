  quote: ''
  summary: The passage gives musical and textual material for a song titled "He Is
    Going Away" and for a children's "Song of the Game of Silence." The first song
    concerns a lover going to a distant land and returning. The second includes animal
    and landscape images, including a pig, hollow-tree dwellers, a rich pack-carrier,
    a rabbit, a lynx track, and an escape trail. The passage also describes the children's
    game of silence, its prizes, setting, timing, and outcome.
