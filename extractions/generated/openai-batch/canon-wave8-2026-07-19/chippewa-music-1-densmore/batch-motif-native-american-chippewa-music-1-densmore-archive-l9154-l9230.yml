canonical_text:
  quote: ''
  summary: The passage describes training and restrictions for young Chippewa warriors
    on a first war expedition, including a blindfolded bone-breaking contest for marrow,
    mandatory mittens and a scratch stick, rules against stepping over another's articles,
    and snake omens. Ma'djigi'jig recounts a night reconnaissance and dawn attack
    on a Sioux village, including calling wind to conceal the approach, a whistle
    signal, and taking scalps. The passage also describes a war leader using pipe
    smoking and a dream song to obtain deer meat, and calling on the thunderbird to
    send rain before an attack.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A marrow bone, usually a leg bone, was placed on the ground for a breaking-bone
    contest in the recruits' camp.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A contestant walked eight paces from the bone, was blindfolded, and struck
    toward it with a hatchet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young warrior on his first expedition could obtain a taste of fat only by
    successfully breaking the bone and receiving the marrow prize.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men on their first war party were required to wear mittens tied at the wrist
    until they entered a fight with the Sioux.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small scratch stick was hung from the wrist, and recruits were ordered to
    use it for scratching the head or body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says failure to use the scratch stick was associated with breaking
    out in boils or sores, and Ma'djigi'jig attributed the rule to recruits lacking
    protective medicines carried by warriors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the recruits' camp, stepping over another person's article, especially
    a gun, was avoided and could be punished because it was said to render the weapon
    useless.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: It was considered a bad omen for a recruit to see a snake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: During Ma'djigi'jig's first war expedition, experienced men reconnoitered
    a Sioux village at night, counted tipis, and estimated the number of warriors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before daybreak the Chippewa party approached the Sioux village after the
    scouts' report.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The leader called for wind, and the wind's sound through the tipi poles and
    canvas concealed the soft tread of the Chippewa entering the camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A tiny whistle making a quavering birdlike note served as the signal for the
    Chippewa to fire.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: After firing, the attackers rushed the tipis, tore them down, killed wounded
    people, severed a head, and later removed scalps.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The scalp lock is described as located just behind the crown and difficult
    to remove, but removable by a skillful warrior with one knife motion.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: When provisions were short, a leader camped near a lake, smoked a pipe, sang
