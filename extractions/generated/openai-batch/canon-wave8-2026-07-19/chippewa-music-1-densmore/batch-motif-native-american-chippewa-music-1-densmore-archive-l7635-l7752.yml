  summary: The passage describes Ojibwe war-honor objects, a weasel-fringed warrior
    shirt, warrior medicines obtained from Midewiwin-associated old men, and an origin
    account in which a male Midewiwin member dreams of cattle-like beings under water
    who teach the preparation of cattle herb medicine. It also describes the associated
    song, cattle-noise practice, and botanical ingredients used by Main'gans.
  language: English
