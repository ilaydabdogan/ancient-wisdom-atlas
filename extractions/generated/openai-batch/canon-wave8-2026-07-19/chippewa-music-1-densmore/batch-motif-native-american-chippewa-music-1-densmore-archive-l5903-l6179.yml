canonical_text:
  quote: ''
  summary: The passage introduces a group analysis of 340 Chippewa songs, especially
    Grand Medicine or Mide' songs. It discusses relationships among Mide', dream,
    and war songs; describes the Mide'wiwin as the Grand Medicine order; notes a Mide'
    rattle; and explains Mide' song classes connected with initiation and special
    medicines. The passage states that these songs aim to secure definite results
    through supernatural power, including transfer and renewal of spirit power, prolongation
    of life, healing the sick, and producing effects through charms. It also summarizes
    musical features of the Mide' song group.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The section analyzes 340 songs to test whether there is evidence of connection
    between the motive for singing a song and the song's form, considering the song's
    origin and use.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mide', dream, and war songs are described as the song groups most nearly
    related in origin, because many songs said to have been composed in dreams were
    used in Mide' ceremonies and practices and on the warpath.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dream songs were identified as such by singers, had no special assigned use,
    and were probably first used by individuals in dances before becoming general
    in the tribe, usually after the composers' deaths.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Mide'wiwin, or Grand Medicine, is described as the embodiment of the native
    religion of the Chippewa, with adherents in 1912 and with members admitted and
    advanced to higher degrees.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage mentions musical instruments accompanying the Mide' songs and
    describes a Mide' rattle, including an all-wood example formerly belonging to
    a prominent Mide'wiwin member at Waba'cing.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The principal classes of Mide' songs are said to be songs of the initiation
    ceremony and songs connected with special medicines.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Songs connected with special medicines are sung by Mide'wiwin members for
    curing the sick, working charms, and in dances following meetings for feasts or
    initiations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that affirmation is strong throughout these songs and that
    many have a triumphant tone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the underlying idea of the Mide' songs is securing
    a definite result through supernatural power, with music as an indispensable factor.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: In initiation, the desired result is the transfer of spirit power to the candidate,
    renewal of that power in members witnessing the ceremony, and prolonging their
    lives to old age.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For songs connected with special medicines, the intended results are healing
    the sick and producing effects on one or more persons through charms; the passage
    says the means is supernatural and the singer has confidence in its efficacy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The musical analysis reports that 72 percent of Mide' songs are major in tonality,
    70 percent begin on the dominant, 12 percent begin on the octave, 63 percent end
    on the tonic, and 50 percent have a range of either 12 or 5 tones.
  category: other
  evidence_refs:
  - ev:9
