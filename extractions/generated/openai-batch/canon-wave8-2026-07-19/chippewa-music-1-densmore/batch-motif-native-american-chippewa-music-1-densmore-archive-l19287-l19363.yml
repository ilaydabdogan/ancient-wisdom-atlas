canonical_text:
  quote: ''
  summary: The passage lists plate captions for Chippewa dress items, analyzes a song's
    melodic traits, and describes old and later Chippewa women's dress forms. It recounts
    Mrs. Gauthier's reconstruction of an old-style costume, E'niwub'e's demonstration
    of a blanket garment, changes in ornamentation and materials, floral and geometric
    decorative patterns, and reports that the star pattern and a war-drum decoration
    had dream origins.
  language: English
  quote_policy: summarized
