canonical_text:
  quote: ''
  summary: The passage analyzes Chippewa war songs statistically and comparatively,
    describing tonal, melodic, and rhythmic traits; noting correspondences with Mide',
    dream, woman's dance, begging dance, and moccasin game song groups; attributing
    some correspondences to supernatural communication, intertribal transmission from
    the Sioux, or excitement; and beginning a section on love songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The war songs are described by percentages for tonality, opening and ending
    tones, compass, scales, melodic structure, downward first progression, and interval
    patterns.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the triple rhythm is said to be the drum-rhythm of
    the victory dance, commonly known as the scalp dance, but occurs in only 35 percent
    of the war songs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seventy-one percent of the war songs are said to contain a rhythmic unit;
    voice and drum metric units are compared in speed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The war-song group is described as less homogeneous than other groups, with
    diverse correspondences to other song groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The strongest relation is said to be with the Mide' songs, both melodically
    and rhythmically; a melodic correspondence is also stated with dream songs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The relation of war songs to Mide' and dream songs is attributed in the passage
    to a common element of communication with the supernatural.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Both Mide' and war songs are described as principally melodic in structure,
    but with feeling for the dominant in the Mide' songs and for the tonic and octave
    in the war songs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that definiteness of idea and assurance of success are suggested
    by the prominence of rhythmic unit and major tonality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The correspondence with the woman's dance is said to possibly come from the
    dance's popularity during periods of peace between the Chippewa and the Sioux;
    the dance was said to have been given to the Chippewa by the Sioux.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The begging dance is said to have been received from the Sioux, and the war
    songs are said to show both melodic and rhythmic correspondence with that group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The relation to moccasin game songs is described as limited to compass and
    attributed to excitement in both groups; the passage says this excitement does
    not affect the war-song tempo or relative speed of voice and drum as it does in
    moccasin game songs.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: As a whole, the war songs are characterized as showing control, definiteness,
    and strong centralization, with melody tones referable to a keynote.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The following love-song section states that love-charm songs of the Mide'
    are not included, and that love songs were unaccompanied by instruments.
  category: attribute
  evidence_refs:
  - ev:9
