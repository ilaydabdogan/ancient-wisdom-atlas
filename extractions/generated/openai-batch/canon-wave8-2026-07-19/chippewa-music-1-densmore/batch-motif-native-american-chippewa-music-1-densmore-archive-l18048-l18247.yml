canonical_text:
  quote: ''
  summary: The passage analyzes songs associated with the moccasin game, including
    songs said to have been taught by a manido or stranger to a man who had been dead
    so that he could play successfully. It describes song and drum behavior during
    the game, notes a bear-form appearance of the manido, and summarizes present and
    former attitudes toward the moccasin game, including an incident in which a successful
    player's dead wife returned in a dream with the secret of success.
  language: English
  quote_policy: summarized
