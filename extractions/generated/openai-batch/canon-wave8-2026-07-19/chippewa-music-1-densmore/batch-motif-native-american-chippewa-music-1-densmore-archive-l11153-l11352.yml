canonical_text:
  quote: ''
  summary: The passage describes Chippewa war practices and songs. It first explains
    how warriors received credit for kills. It then recounts how Odjib'we became helpless
    in battle after entering without his medicine, and how Niski'gwun revived him
    with medicine mixed with water and sprayed on his limbs while singing a help song.
    The passage then introduces songs connected with an expedition against a Sioux
    village. It describes the battle, retreat, poisoned arrows, and the mortal wounding
    of Name'bines. Left in bushes with his gun, Name'bines shot a pursuing Sioux,
    gave a final war whoop, sang a death song, and asked his comrades to sing it at
    home for the women to dance by and to tell how he died.
  language: English
  quote_policy: summarized
