canonical_text:
  quote: ''
  summary: After the Drum-presentation Ceremony on the Menominee Reservation, the
    writer returned to the place of assembly. The Menominee had hosted the Chippewa,
    who decided to remain four more days. Custom required each tribe to continue dancing
    for four days, and they danced together despite snow. The Chippewa then faced
    a difficult return toward the railroad with lighter packs, gifts already given
    away, incomplete return gifts, missing provisions, and inadequate protection from
    a north wind. The passage closes by noting their return to Lac du Flambeau after
    giving two drums to the Menominee.
