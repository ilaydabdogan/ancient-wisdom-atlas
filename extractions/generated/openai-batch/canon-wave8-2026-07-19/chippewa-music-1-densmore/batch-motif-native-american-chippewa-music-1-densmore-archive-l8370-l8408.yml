  quote: ''
  summary: The passage recounts a Chippewa war expedition organized by Ge'miwunac,
    the joining of men from several bands, departure by canoe, an evening war dance
    and song, rapid travel and concealment, scout reconnaissance near Sioux country,
    the discovery of a fresh Sioux trail, and the later reading of traces at an abandoned
    Sioux camp and council site.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song is described as concerning a war expedition organized by Ge'miwunac,
    a member of the Pillager Band of Chippewa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A party of twenty Pillagers came to the Mississippi village and asked them
    to join; ten Mississippi and seven Mille Lac men also went, and all started from
    Crow Wing in canoes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After traveling a few miles down the Mississippi River, the party made its
    first camp and held its first war dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Odjib'we sang the song of the dance and said it was sung every evening while
    the party was away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some men danced around the fire, others sat still, and all sang before going
    to bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The next morning the party broke camp, traveled rapidly through the woods,
    then rested concealed by day and traveled by night on reaching the prairie.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near Sioux country, two scouts were sent ahead with instructions to return
    and report if they saw signs of the enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Odjib'we demonstrated the attitude of a scout, shading his eyes with one hand
    and signaling with the other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The scouts returned and reported a wide new trail, inferring that the Sioux
    had passed that day; one estimated one hundred people and the other estimated
    forty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The party remained in a grove until morning, then cleaned and loaded their
    guns before following the Sioux trail.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: They found four green-bough lodges, a place where the Sioux had danced, a
    place where a council had been held, and forty-two stones in a circle indicating
    the number of warriors present at the council.
  category: object
  evidence_refs:
  - ev:5
