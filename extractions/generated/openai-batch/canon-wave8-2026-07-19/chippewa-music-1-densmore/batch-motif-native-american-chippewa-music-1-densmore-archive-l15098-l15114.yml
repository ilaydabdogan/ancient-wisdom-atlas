canonical_text:
  quote: ''
  summary: In a drum-presentation ceremony, officials sit near the entrance with painted
    faces and ornaments. Bi'jikens opens with a formal speech, distributes tobacco
    to the assembly, performs an invocation toward the drum, repeats it as drum owner
    while circling the drum three times, and the leading drummer starts the Song of
    the Pipe. Pipe bearers present pipes to the circle of the sky, light them, and
    offer them in order to drummers and then to the company.
  language: English
  quote_policy: summarized
