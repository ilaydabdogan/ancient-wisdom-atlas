  quote: ''
  summary: The passage presents several Lac du Flambeau Chippewa war songs with word
    translations and musical analysis. One song concerns a man urged by friends to
    join warriors while undecided and wondering whether his wife would weep for him.
    Another song says the Sisseton Sioux are likely following behind the speaker.
    A following song says the speaker walks in the sky and accompanies a bird. The
    editor notes that the latter two songs suggest dream composition.
