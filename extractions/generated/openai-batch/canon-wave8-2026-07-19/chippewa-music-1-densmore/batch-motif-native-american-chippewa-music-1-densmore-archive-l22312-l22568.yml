  summary: The passage presents analysis and texts of several Chippewa songs sung
    by Ki'miwun, including doctor's songs used in treating the sick. Song images include
    a body lying in the east, sitting with a turtle, being carried by wind around
    the sky, swallowing and issuing bones in a healing treatment, and the approach
    of thunderbirds.
