canonical_text:
  quote: ''
  summary: The passage introduces Odjib'we and other White Earth informants connected
    with Chippewa war songs, medicinal herb songs, dream songs, and reminiscences
    of warfare with the Sioux. It also summarizes the final Chippewa-Sioux conflicts
    in Minnesota and links the warfare to Chippewa westward migration and Dakota resistance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we is described as both musician and warrior; more than seventy of his
    songs were recorded, and these were only part of his repertoire.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During years of blindness at the Old People's Home at White Earth Agency,
    Odjib'we loved to sing, and companions there recalled earlier times on the prairie.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Niski'gwim, also rendered Niski'gwun in the passage, fought beside Odjib'we
    at Ca'gobens' village and later contributed a dream song and other songs to the
    collection.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Maih'gans came from Mille Lac, had lived at White Earth for almost a generation,
    loved old ways and songs, and was crippled from frozen feet in boyhood.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Maih'gans attributed his strength to continued use of a native remedy called
    cattle herb medicine, described as a medicine used by warriors in former times.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maih'gans described cattle herb medicine, secured herb specimens, and sang
    songs connected with its origin and use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Na'waji'bigo'kwe sang island herb medicine songs and remembered herbs being
    dug to make this medicine for departing warriors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Na'waji'bigo'kwe is described as highly skilled in native medicine lore on
    the White Earth Reservation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Meja'kigi'jig, Ma'djigi'jig, and A'kiwen'zi gave personal reminiscences; all
    had taken part in wars against the Sioux, and the two last named fought under
    Odjib'we's leadership.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Odjib'we died in April 1911; many preserved songs were known only to him,
    and he is described as a preeminent figure among his tribe in northern Minnesota.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Odjib'we never lifted his hand against the white man
    but led his people to victory over the Sioux.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The final battles between the Chippewa and Sioux were fought in central Minnesota;
    the passage attributes the warfare's origin to Chippewa westward migration being
    blocked by the Dakota, and says it ended after removal of the Minnesota Sioux
    by the United States Government.
  category: sequence
  evidence_refs:
  - ev:8
