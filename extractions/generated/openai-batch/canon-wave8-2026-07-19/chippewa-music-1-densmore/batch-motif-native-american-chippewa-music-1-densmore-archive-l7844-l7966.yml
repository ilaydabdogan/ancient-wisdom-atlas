- id: obs:2
  text: A young man wanted to join the Mide'wiwin to gain hunting power, but his father
    opposed him as too trifling for a solemn matter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man went away, fasted many days, and was visited by a manido' from
    the east who told him about a medicine with both good and bad properties.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The youth gathered men into an alliance known as Wa'hunog; they held dances
    and used the medicine unscrupulously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eight men were destroyed at the first dance, which was given by a man who
    knew the secret of the medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The medicine is said to kill or cure those who took it, to work as an evil
