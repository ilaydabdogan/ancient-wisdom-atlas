canonical_text:
  quote: ''
  summary: The passage recounts an origin tradition for Wa'hunowuck, an eastern herb
    medicine with both good and harmful uses, then describes Odjib'we's personal war-related
    dream song. In the medicine tradition, a youth seeks Mide'wiwin power, fasts after
    paternal opposition, receives medicine knowledge from an eastern manido', forms
    an alliance of Wa'hunog, and harmful use of the medicine leads to deaths. In Odjib'we's
    account, after relatives are killed by the Sioux he chooses the warrior path,
    fasts alone for visions, dreams of a woman whose rush guns fired by Sioux release
    harmless horseflies, receives a prophecy of protection, and later uses the dream
    song in battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wa'hunowuck is described as an eastern herb medicine distinct from two other
    medicines, with originally good offices but later prevailing evil uses.
  category: object
  evidence_refs:
