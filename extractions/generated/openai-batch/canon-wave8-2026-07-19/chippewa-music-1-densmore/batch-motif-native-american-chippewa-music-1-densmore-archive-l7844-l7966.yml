  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: To prepare for war, Odjib'we repeatedly fasted alone in the woods for several
    days while hoping for a dream or vision.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After a four-day fast, Odjib'we dreamed of a woman carrying several guns made
