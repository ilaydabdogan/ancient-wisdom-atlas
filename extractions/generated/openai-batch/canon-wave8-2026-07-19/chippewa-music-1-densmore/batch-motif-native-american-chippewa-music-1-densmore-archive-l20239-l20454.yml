canonical_text:
  quote: ''
  summary: 'The passage gives musical analyses of two Southern Dance Songs, describes
    their paired performance, continuous repetition, closing calls, accelerating dance
    movement, and steady drumbeat. It then describes songs used when a pony is to
    be given away: a man dances around the drum with a stick representing an imaginary
    pony, presents the stick to a friend, and the actual pony transfer occurs later.
    The passage also describes how a beaded suit can create an obligation to return
    a pony, how dancing can obligate participants to give ponies, and how the recipient
    of the pony-stick leads a thanks dance while past pony donors display counts of
    ponies given.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Southern Dance Songs Nos. 121 and 122 are stated to have been always sung
    together and were recorded consecutively.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described dance songs could be repeated an indefinite number of times
    without interruption, and dancers were said sometimes to dance all night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prolonged closing call or ejaculation may close a song, beginning on a high
    tone and descending glissando; a variant may be accompanied by rapid drum beating.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the second Southern Dance Song the voice-rhythm is more rapid, while the
    drumbeat remains even and moderate as the dance seems to gather speed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When people at a dance hear the pony-gift song, they know that a pony is to
    be given away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man dances around the drum holding a little stick, mimes whipping an imaginary
    pony, presents the stick to a friend, and the actual pony transfer occurs later.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If people are slow to volunteer ponies, the head drummer may start the song
    and someone may give a beaded suit to the owner of a desirable pony, for which
    the proper return is a pony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those who have given away ponies join the dance; others who dance at that
    time are required to part with their ponies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man who received the pony-stick leads the dance while carrying it, and
    previous pony donors may hold up fingers to show the number of ponies they have
    given at dances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage identifies the following Moccasin Game songs as ordinary game
