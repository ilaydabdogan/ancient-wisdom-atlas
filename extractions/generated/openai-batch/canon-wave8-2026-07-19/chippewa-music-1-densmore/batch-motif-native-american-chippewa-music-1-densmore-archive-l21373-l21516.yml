literal_observations:
- id: obs:1
  text: A person seeking long life brings a garment with tobacco folded in it and
    ties the garment around a pole; an autumn feast may also be held, though frozen
    ground can prevent taking the pole down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Friends of a sick person place tobacco in one of the sick person's garments
    and fasten it high on a medicine pole; they may scrape a weathered pole white
    and smooth or replace it with a new pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A pole associated with Me'dweya'suh's illness had been scraped, redecorated,
    given renewed banner cloth, and supplied with an offering; Me'dweya'suh did not
    recover and died of old age.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Me'dweya'suh's own medicine pole consisted of an uprooted tree placed horizontally
    between two forked poles about five and one-half feet above the ground, with strips
    of his garments attached.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Me'dweya'suh dreamed in youth that he led a war party, conquered enemies,
    and leaped over a fallen tree; later, because he had not fulfilled the dream,
    he set up a tree at the height of the dreamed fallen tree.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ki'tciodja'nimwewegi'jig said that as a boy he fasted and dreamed of a bird;
    because he never went to war, he later erected a medicine pole beside his dwelling
    and drew the bird on its cloth banner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the bird design had been torn and nearly effaced by weather, Ki'tciodja'nimwewegi'jig
    redrew its outline so the story of his dream and medicine pole would be known.
  category: action
  evidence_refs:
  - ev:6
