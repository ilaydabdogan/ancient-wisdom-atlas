canonical_text:
  quote: ''
  summary: The passage describes Chippewa medicine poles used with tobacco and garments
    in efforts to obtain long life or aid sick persons. It gives examples involving
    Me'dweya'suh, whose illness prompted offerings and whose own medicine pole materialized
    an unfulfilled war dream, and Ki'tciodja'nimwewegi'jig, who fasted, dreamed of
    a bird, and made a bird design on a medicine-pole banner. The passage then introduces
    the Waba'cing village context for recorded songs.
  language: English
