  summary: The passage introduces war songs of the Mississippi Band of Chippewa as
    sung and narrated by Odjib'we, described as the last great warrior of that band
    in Minnesota. It explains the recording and repetition of his songs, notes conventions
    about preserving tune and meaning while allowing some verbal alteration, and includes
    footnote material on the name Odjib'we/Ojibway/Chippewa and possible etymologies.
  language: English
