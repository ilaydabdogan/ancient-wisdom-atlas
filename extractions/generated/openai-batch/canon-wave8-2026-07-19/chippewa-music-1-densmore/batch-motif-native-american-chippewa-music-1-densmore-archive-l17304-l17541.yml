canonical_text:
  quote: Brother, come here with us.
  summary: The passage gives rhythmic tables, then describes dream songs. One man
    fasts ten days with his face painted in charcoal, dreams of manido' in clouds
    rising in the south, goes up into the clouds, sees thunderbirds, and learns their
    song. Another man fasting for a dream hears voices beyond a hill, sees deer in
    a circle preparing a seasonal dance after the leaves have fallen, hears a young
    buck sing, learns the song, and later sings it while hunting deer. The passage
    also includes musical analyses of the thunderbird and deer songs.
  language: English
  quote_policy: quoted
