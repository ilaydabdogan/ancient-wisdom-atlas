canonical_text:
  quote: ''
  summary: The passage describes a Dog Feast sequence within a Drum-presentation Ceremony.
    An oc'kabe'wis presents dog meat to the drum owner after dancing around the drum.
    The dog's head is placed in a pan on the eastern side of the dancing circle, four
    distinguished warriors are selected to eat from it, and each warrior later dances
    around the dog's skull, speaks of a victory, and sings a commemorative war song.
    The remaining dog meat is then distributed to women and men, concluding the feast.
    The passage also gives musical catalog and analysis notes for several songs sung
    during these actions.
  language: English
  quote_policy: summarized
