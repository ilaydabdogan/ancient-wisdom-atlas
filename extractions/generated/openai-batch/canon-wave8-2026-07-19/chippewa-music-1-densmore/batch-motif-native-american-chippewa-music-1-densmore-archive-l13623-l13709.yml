canonical_text:
  quote: ''
  summary: 'The passage first explains the term manido'' as spirit or ghost and notes
    Chippewa and Midewiwin associations with many spirits, cardinal directions, and
    animal vision medicine. It then gives an origin narrative for the drum used in
    the Drum-presentation Ceremony: a Sioux woman hides in water for four days, is
    summoned by a voice, eats unseen among soldiers, meets a manido'' in the form
    of a white man, receives directions for making a drum and its songs, and learns
    that two men must be offered in return. When the first drum is struck, the manido''
    appears and the two makers die. The passage then describes later intertribal drum
    transfer and song teaching, with Sioux ceremonial songs and Chippewa war songs
    distinguished in the ceremony.'
  language: English
  quote_policy: summarized
