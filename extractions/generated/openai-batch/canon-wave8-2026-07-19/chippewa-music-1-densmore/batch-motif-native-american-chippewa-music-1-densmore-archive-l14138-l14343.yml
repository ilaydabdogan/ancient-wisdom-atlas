canonical_text:
  quote: ''
  summary: The passage gives musical entries and analyses for several Chippewa songs
    sung by Mec'kawiga'bau, then describes the Lac du Flambeau ceremony called Restoring
    the Mourners. The ceremony ends a mourning period so mourners may rejoin the dance.
    It includes a fenced dancing circle with four drums, mourners seated in the center,
    bright clothing and gifts, the leader White Feather, washing with water and soap,
    hair combing, and the singing of a restoring song.
  language: English
  quote_policy: summarized
