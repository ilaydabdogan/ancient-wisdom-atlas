canonical_text:
  quote: ''
  summary: 'The passage summarizes two groups of Chippewa songs: songs accompanying
    gifts, usually a pony, performed by giver or recipient with singers at the drum
    in social dances; and songs for the entertainment of children, generally humorous
    and imitating tribal interests and occupations, including war games and war between
    animals. It also gives musical analysis of tonality, scale, rhythm, drum use,
    and voice-drum metric relations.'
  language: English
  quote_policy: summarized
