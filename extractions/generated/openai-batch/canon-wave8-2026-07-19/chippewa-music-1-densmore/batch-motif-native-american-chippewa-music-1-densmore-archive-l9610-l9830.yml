  quote: ''
  summary: The passage describes Chippewa war-party preparations, including appointed
    aids, equipment, a shared eagle-feather war banner, a dog feast treated as a pledge
    before departure, and songs and dancing connected with readiness for the warpath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The analysis describes one song as a taunting, mocking melody and explicitly
    compares it with another song of derision.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war leader appointed four men called oc'kabe'wis to act as aids during
    the expedition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The appointed aids handled preparations, arranged pre-departure dances, carried
    the leader's pipe and the drum on the march, and arranged camps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The war party carried medicine and moccasin-making and mending materials,
    while the leader provided part of the equipment and borrowed the banner or flag.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The war banner was made of eagle feathers sewn on a cloth strip about four
    feet long and fastened lengthwise to a pole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A banner made by Gaga'giwigwun was described as common property of the warriors,
    with Gaga'giwigwun as custodian in peacetime, and was preserved in his family
    after hostilities ceased.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A war flag preserved at White Earth was said to have been carried against
    the Sioux by Mi'gisins' and later possessed by his daughter; the passage notes
    that a woman would not have carried such a banner in actual warfare.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dog feast was the final event before the war party left the village; only
    the head was eaten, and only men going on the expedition partook of it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Participation in the dog feast was considered equivalent to a pledge that
    the warriors were prepared for the full fortune of war, including death or worse
    at the hands of the enemy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The words of the pledge song state that the braves feed the speaker.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the dog feast, all the warriors danced with guns in hand and sang a
    wordless song; their final preparations had been made and they were ready to start
    their journey.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The dance song is described as slow in tempo, with drum and voice in consonance,
    and as dignified yet vigorous.
  category: attribute
  evidence_refs:
  - ev:8
