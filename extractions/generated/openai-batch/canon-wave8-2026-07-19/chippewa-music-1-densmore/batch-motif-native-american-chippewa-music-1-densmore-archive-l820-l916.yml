canonical_text:
  quote: ''
  summary: The passage analyzes Chippewa song contents and functions. It notes invocations
    to manido' spirits, Mide' songs in which spirit animals or birds speak or become
    visible, and the reported older practice of receiving important songs in dreams
    for use in danger, war, medicine, and serious undertakings. It categorizes love,
    dance, home-life, war, Mide', moccasin-game, and dream songs; summarizes references
    to nature, animals, birds, water, and Mide'wiwin shell and water associations;
    and compares song subject matter with minor tonality and sadness.
  language: English
  quote_policy: summarized
