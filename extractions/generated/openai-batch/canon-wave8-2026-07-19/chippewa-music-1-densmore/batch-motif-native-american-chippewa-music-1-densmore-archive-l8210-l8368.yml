canonical_text:
  quote: '"An eagle feather I see"; "Mo''kadjiwens took a Sioux scalp which is hanging
    in a marsh."'
  summary: The passage presents two Chippewa songs sung by Odjib'we. The first refers
    to seeing an eagle feather and a brave, with a note explaining that the feather
    marks a warrior who took an enemy's scalp. The second song commemorates a war-party
    incident in which a Sioux man was killed, Mo'kadjiwens removed the scalp, then
    forgot it during the journey home; the resulting victory-dance song both credited
    and ridiculed him.
  language: English with Ojibwe song text and glosses
