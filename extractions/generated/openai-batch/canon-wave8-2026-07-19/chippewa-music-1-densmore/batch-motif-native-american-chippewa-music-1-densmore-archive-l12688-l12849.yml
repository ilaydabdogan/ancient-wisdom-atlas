canonical_text:
  quote: ''
  summary: The passage gives musical analysis of one melody, then presents two songs
    associated with a war expedition from Odjib'we's youth. One song concerns a Wapeton
    Sioux woman who seized an ax to defend her children during a battle. Another concerns
    a captive Sioux woman who was led out to be shot, allowed to sing, and rescued
    when her song moved Odjib'we's elder brother. At the first camp on the return
    journey she expressed gratitude to the warriors with handshakes, kisses, and a
    newly composed song. The passage also records musical features and rendition history
    for the songs.
  language: English
  quote_policy: summarized
