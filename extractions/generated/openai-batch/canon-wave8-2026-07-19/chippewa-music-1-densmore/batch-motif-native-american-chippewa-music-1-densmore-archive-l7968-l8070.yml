  quote: ''
  summary: The passage recounts Odjib'we's early participation in a public dog-feast
    courage test for aspiring warriors. It then describes how, at about age 20, he
    and his cousin secretly departed on the warpath under the pretense of hunting,
    intending to avenge dead friends, and sang a war song on each of four nights while
    camped.
