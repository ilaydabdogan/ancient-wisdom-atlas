canonical_text:
  quote: The Symbols of Songs Which Never Were Sung
  summary: The passage describes Chippewa medicine poles at Lac du Flambeau, explains
    their visible banners and symbols, and recounts an origin and later custom in
    which a fasting dream, war success, an unsung dream-song, and healing power are
    connected to the pole.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tall poles stand beside many houses in the Chippewa village at Lac du Flambeau,
    each with a cloth-covered frame fastened so it can swing in the wind.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some banners bear red and blue outlined figures; recognizable figures include
    the sun, moon, stars, and birds, while bundles of faded rags are tied high on
    many poles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Questions about the poles are described as likely to receive evasive answers,
    and local non-specialist explanations connect them superficially with death or
    evil spirits.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the story of a medicine pole would include a man's boyhood
    dream, failure to fulfill that dream, and struggle against sickness and death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the stated origin, a young man blackened his face, went away to fast, and
    dreamed of thunderbirds and the tall tree on which they lived.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After returning home, the young man cut down a tall straight tree, made it
    into a pole, placed it at his door, and fixed a deerskin image of the dream-birds
    at the top.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a later custom, the young man waited to see whether the dream came true;
    if he fulfilled a war dream, he did not erect a pole and instead first sang the
    dream-song on the warpath.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If he lacked the opportunity to go to war, he pictured the dreamed objects
    on deerskin or cloth, and the song was never sung.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man associated with such an unsung dream-song was supposed to have special
    power to cure the sick.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In spring, the owner of a pole may take it down, lay it on the ground, make
    a feast, invite friends, and speak about the pole.
  category: action
  evidence_refs:
  - ev:9
