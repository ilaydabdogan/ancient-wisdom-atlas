canonical_text:
  quote: ''
  summary: A man who has lost everything dies, then regains consciousness when a black-clad
    stranger identified as a manido approaches. The stranger teaches him several gambling
    games, but the revived man wins each one. The stranger reveals himself as a large
    black bear, sends the man to an Indian village to gamble, and the man wins back
    persons described as his dead.
  language: English
  quote_policy: summarized
