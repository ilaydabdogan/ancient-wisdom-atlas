literal_observations:
- id: obs:1
  text: The unclassified song group includes songs connected with the southern dance,
    a divorce ceremony, visits between bands, and a historical incident, and the author
    does not treat the diverse group as a unit.
  category: other
  evidence_refs:
  - ev:1
