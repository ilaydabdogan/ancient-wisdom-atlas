- id: obs:3
  text: Mide' songs are said to resemble begging dance songs; the stated common idea
    is desire for acquirement, with Mide' songs seeking supernatural power and begging
    dance songs seeking gifts of food.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Begging dance songs are described as allied to woman's dance songs, pipe dance
    songs, and songs for the entertainment of children, combining acquirement with
    pleasure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Begging dance and pipe dance songs are said to share many ascending-fourth
    intervals; these intervals are described as characteristic of songs concerning
    motion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: People in the begging dance made a circuit of the entire camp, and the pipe
    dance is described as a contortion dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Songs for the entertainment of children are described as allied to pleasure
    songs and war songs; half of the songs in that group relate to mimic warfare or
    warfare between animals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The general motive of Mide' songs is stated as securing a definite result
    through supernatural power, usually affecting someone other than the singer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The general motive of dream songs is stated as securing supernatural aid in
    personal undertakings.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: War songs are classified as individual warriors' dream songs, songs concerning
