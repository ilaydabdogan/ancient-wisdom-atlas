  summary: The passage describes a miscellaneous group of Chippewa songs, then presents
    Densmore's comparative analysis of melodic and rhythmic resemblances between song
    groups. It highlights possible relationships between song ideas and musical form,
    including Mide' songs, dream songs, begging dance songs, pipe dance songs, songs
    for children, and war songs.
  language: English
