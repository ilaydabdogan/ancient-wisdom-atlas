canonical_text:
  quote: ''
  summary: The passage describes seating, musical roles, ceremonial objects, gendered
    singing practices, officials and aides in a Chippewa Drum-presentation Ceremony.
    It then explains obligations created by giving and receiving a drum, including
    reciprocal gifts, feasts, food for guests, messengers, and a later return visit
    with equivalent gifts. It also notes a pre-presentation sending of messengers
    with warrior pipes, a departure dance and song, and identifies Mec'kawiga'bau
    as singer of the ceremonial songs discussed in the narrative.
  language: English
  quote_policy: summarized
