canonical_text:
  quote: ''
  summary: The passage describes an evening Chippewa gathering at Lac du Flambeau
    after the ceremony of Restoring the Mourners, with drumming, singing, dancing,
    and war songs associated with the presentation of a warrior drum to the Menominee.
    It then gives song texts and analyses for several songs, including a dream song
    connected to a Thunderbird vision and a tobacco gesture toward a storm, a song
    about ravens singing in the sky, a war song, and a song whose text says the singer
    is small and comes from the south.
  language: English with Ojibwe lyric transcriptions and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the evening after the ceremony of Restoring the Mourners, the writer went
    to the Lac du Flambeau village; a drum was audible from about four miles away,
    and there was a full moon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gathering was identified by the light in E'niwub'e's window and the sound
    of the drum; four or five drummers sat around a warrior drum that was to be presented
    to the Menominee.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second drum of similar type was on a table, and the decorations of the two
    drums were described as vivid spots of color.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women sat behind the drummers with bowed heads and shawls held over their
    mouths while singing in a high falsetto.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Men in the room rose from time to time and danced in place with bent knees
    and rhythmic shifting of weight from one foot to the other.
  category: action
  evidence_refs:
  - ev:1
