  summary: The passage describes Chippewa dream songs as songs heard or learned in
    dreams from trees, crows, animal or thunderbird beings, and manido' in human form.
    It notes dream-song themes of flight, explains vision as a desired source of supernatural
    aid summoned through song, compares dream-song expectancy and acquirement with
    women's dance and gift songs, and summarizes musical features of dream songs in
    relation to other song groups.
