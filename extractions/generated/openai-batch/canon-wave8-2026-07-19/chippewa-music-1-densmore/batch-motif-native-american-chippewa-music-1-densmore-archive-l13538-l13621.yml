canonical_text:
  quote: ''
  summary: The passage describes a 1910 drum-presentation ceremony in which Lac du
    Flambeau Chippewa gave two drums to Menominee recipients. It explains the associated
    dancing schedule, the veneration of the drum, the relation of the “drum religion”
    to peace and ritual law, Wis'kino's duties as drum owner, tobacco and pipe observances,
    earlier Sioux-to-Chippewa transmission of the drum and songs, and a briefly mentioned
    origin tradition involving a woman and a manido'.
