- id: obs:1
  text: In October 1910, the writer witnessed a ceremony accompanying the presentation
    of two drums by the Lac du Flambeau Band of Chippewa to the Menominee Indians
    in Wisconsin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony was enacted partly on the Lac du Flambeau Reservation and partly
