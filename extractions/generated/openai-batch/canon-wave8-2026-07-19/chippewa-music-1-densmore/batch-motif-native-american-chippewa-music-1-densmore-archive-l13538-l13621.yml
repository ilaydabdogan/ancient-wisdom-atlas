  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before departure and arrival, each group danced for four days; there were
    also four days of dancing at the presentation and four days of dancing together
    afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The drum and its ceremonies are described as highly venerated and as giving
    rise to what is called the “drum religion.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The “drum religion” is said not to supplant the Mide', but to introduce a
    new element concerned with broader responsibility and peace between peoples formerly
