  summary: The passage describes a remembered drum-dance setting, a simple Chippewa
    divorce ceremony accompanied by songs, musical notes on two recorded divorce songs
    sung by Mec'kawiga'bau, and the departure of a Chippewa drum party carrying drums,
    equipment, and gifts toward a Menominee ceremony after a pipe-presentation interval.
  language: English
