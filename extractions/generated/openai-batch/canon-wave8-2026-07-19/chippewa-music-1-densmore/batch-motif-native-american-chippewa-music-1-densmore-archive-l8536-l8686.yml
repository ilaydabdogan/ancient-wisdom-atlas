canonical_text:
  quote: ''
  summary: The passage gives historical context for the Battle of Shakopee, then presents
    and analyzes a Chippewa war medicine song sung by Niski'gwun. It describes a warrior's
    birdskin war charm filled with personal medicine, worn around the neck for protection,
    connected with a dream song, and associated with the kingbird's aggressive behavior.
    The song text includes images of bird-plumage rising and 'balls' explained as
    enemy heads.
  language: English
