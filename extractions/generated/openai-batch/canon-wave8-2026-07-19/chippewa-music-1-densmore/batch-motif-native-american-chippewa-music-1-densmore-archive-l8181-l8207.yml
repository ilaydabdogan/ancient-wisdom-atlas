- id: obs:1
  text: A small war party was organized by Bti'gonegi'jig, also called Hole-in-the-day,
    and Odjib'we was one of its members.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war party went to a point on the Minnesota River near the site of present-day
    St. Paul and took a position near a road used by Sioux travelers between their
    village and a white settlement.
  category: setting
  evidence_refs:
  - ev:1
