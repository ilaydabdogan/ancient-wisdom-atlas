canonical_text:
  quote: ''
  summary: A Chippewa war party led by Hole-in-the-day sets an ambush near a Sioux
    route. Under orders to wait for a signal and not shoot a woman, Odjib'we fires
    on a lone Sioux man, helps handle the wounded victim, receives entitlement to
    a skunk-skin war-honor badge, takes the scalp, and joins the Chippewa escape across
    the river. On the opposite shore they dance, wave the fresh scalp, taunt the Sioux,
    and Odjib'we sings a song composed at that time.
  language: English
  quote_policy: summarized
