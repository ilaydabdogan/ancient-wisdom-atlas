canonical_text:
  quote: ''
  summary: The passage classifies several Chippewa song groups by emotional or performance
    context and by melodic and rhythmic resemblances. It describes love songs as expressing
    disappointment, loneliness, and sadness; moccasin game songs as involving excitement,
    desire for success and gain, pleasure, and confidence in supernatural aid; women’s
    dance and begging dance songs as connected with pleasure and acquisition or gifts;
    pipe dance songs as involving ludicrous pantomime and contortion; and songs connected
    with gifts as sung when a valuable gift is given or received at a social dance.
