literal_observations:
- id: obs:1
  text: A quoted statement from Charles S. Myers says words in so-called primitive
    music may be subordinated to tune, altered, replaced by meaningless syllables,
    or become archaic or symbolically obscure through transmission across generations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The analysis states that recorded Chippewa songs usually show a relation of
    tones to a keynote, with evident tone-material and melodic relation, while harmonic
    relation can be very complicated or absent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The analysis says most songs close with a simple tonic chord; openings of
    major songs may contain minor intervals, and openings of minor songs may contain
    major intervals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies rudimentary elements of key in the songs, including
    the third and fifth above the keynote, correct octave intonation, and frequent
    occurrence of the tonic triad.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author determines a song's probable keynote by ear and classifies tonality
    by the third above the keynote, with the sixth also examined.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The third occurs in about 97 percent of songs; on the stated basis, 57 percent
    are major in tonality and 42 percent are minor, while three songs change between
    major and minor by altering the third and retaining the same keynote.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sixth occurs in 81 percent of the songs and corresponds as major or minor
    with the third; the seventh occurs in only about 9 percent of minor songs, either
    a semitone or a whole tone below the tonic.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Fifty-four percent of the songs begin on the dominant, and 15 percent begin
    on the octave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sixty-seven percent of songs end on the tonic, and in 90 percent the final
    tone is the lowest tone occurring in the melody.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The largest group of songs has a compass of 12 tones, the next smaller group
    has an octave range, and the author says the majority melodic boundary corresponds
    to a fundamental tone and its principal upper partial tones.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports that octave, fifth, and twelfth were sung accurately by
    men who gave other intervals with uncertain pitch, and says later observation
    confirmed this.
  category: attribute
  evidence_refs:
  - ev:9
