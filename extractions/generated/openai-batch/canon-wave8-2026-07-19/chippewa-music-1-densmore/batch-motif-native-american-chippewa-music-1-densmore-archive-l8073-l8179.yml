canonical_text:
  quote: ''
  summary: 'The passage gives a transcription and analysis of a Chippewa song associated
    with Odjib''we, then narrates two war episodes: a successful expedition on the
    fourth morning followed by scalp-taking, feast, and dance; and a later skirmish
    in which Odjib''we first sang his dream song and later composed another song while
    carrying a scalp in a victory dance.'
  language: English
  quote_policy: summarized
