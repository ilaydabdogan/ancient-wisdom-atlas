canonical_text:
  quote: ''
  summary: 'The passage presents analyses and lyrics for several Chippewa songs, including
    a song about returning home safely, a song about uncertainty concerning someone
    from whom the speaker flies or rises, and a war-charm song. It also describes
    Chippewa battle preparations: care for wounded men, an old man carrying medicine
    and water, a feather flag carried by a brave warrior, drumming and singing during
    battle, conspicuous feathered headgear, and a bird-skin charm containing secret
    medicine that is exposed and sung over before battle.'
  language: English
  quote_policy: summarized
