canonical_text:
  quote: ''
  summary: The passage lists Chippewa song titles containing ritual and natural images
    such as a pipe, spring, Mide lodge, shell, flame, spirit-land journey, bear lodge,
    and dance. It then classifies songs concerning animals, describes war-dance songs
    in which warriors imitate wild cattle and animal calls to decoy Sioux, gives a
    Bi'jikiwuck' dancing song with curved-horn imagery, and introduces island-herb
    medicine songs sung before battle to make the medicine effective as a charm, including
    a raven-feather flight image and a heaven/rising fragment.
  language: English with Ojibwe terms
  quote_policy: summarized
