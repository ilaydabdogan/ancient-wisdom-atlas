canonical_text:
  quote: ''
  summary: The passage gives song texts and analyses for Chippewa songs connected
    with maple sugar, travel, and thanks for food. It describes maple sap being boiled
    and made into several forms of sugar, stored in birch-bark containers, and notes
    the movement to summer camps near lakes after sugar-making. It also describes
    a begging dance context in which food is given and a song of thanks is sung before
    the people continue on their way.
  language: English
