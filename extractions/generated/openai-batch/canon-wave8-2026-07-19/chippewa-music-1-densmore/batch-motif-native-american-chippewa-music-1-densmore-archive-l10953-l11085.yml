canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa war songs and related battle practices
    as reported and sung by Odjib''we: subdued drum singing before a dawn ambush,
    a war cry in open fight, a song about making brave men dance, a warrior''s self-exposure
    as a target to inspire others, and a battle song of courage. It also recounts
    a woman, Omiskwa''wegi''jigo''kwe, singing and dancing in battle beside her leader-husband,
    wishing to scalp a slain Sioux despite a custom forbidding Chippewa women to use
    the scalping knife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Chippewa are described as singing before attacking when possible; in a
    dawn attack they crept to an ambush, beat the drum softly, sang in subdued tones,
    yelled, and rushed the sleeping enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In open fight the Chippewa war cry is given as “Bwan, Bwan,” a word used to
    designate a Sioux.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Odjib'we stated that the leader started the drum song; the gloss of the song
    text says, “I make them dance / those brave men / every one of them.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man could inspire others to bravery by making himself a target, throwing
    aside weapons and clothing, and rushing toward the enemy; if not killed by the
    first shot, he was allowed to try to escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man named Ogima'wudjiweb', translated as “chief of the mountains,” is said
    to have had this target-making experience and escaped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gloss of Song No. 30 addresses friends not to flee and states, “I am strong-hearted.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: During a fight, a man frequently sang his dream song or a song composed about
    a former victory; Odjib'we said that in great excitement a man would sing louder
    but probably not faster than usual.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Omiskwa'wegi'jigo'kwe, translated as “woman of the red sky,” is said to have
    composed and sung a song on a battlefield; she was the leader's wife and went
    into the fight singing, dancing, and urging him on.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Omiskwa'wegi'jigo'kwe saw her husband kill a Sioux and wanted to scalp the
    slain, but custom forbade Chippewa women to use the scalping knife, though women
    carried scalps in the victory dance.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The analysis of Song No. 30 states that a slow metric unit is found in other
    songs of self-control under excitement.
  category: attribute
  evidence_refs:
  - ev:10
