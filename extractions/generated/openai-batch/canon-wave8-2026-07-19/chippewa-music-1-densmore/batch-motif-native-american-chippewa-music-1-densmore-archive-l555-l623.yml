canonical_text:
  quote: ''
  summary: The passage analyzes rhythmic units in Chippewa songs, including repeated
    units, modified units, answering phrases, and sectional repetition. It compares
    some Chippewa rhythmic patterns with Sioux songs, especially songs connected with
    Waba'cing and with Sioux ceremonial song collections, and cautiously attributes
    rhythmic correspondence to intertribal contact rather than melodic similarity.
    Opening footnotes cite physiological descriptions comparing heartbeat rhythm to
    musical meter.
