canonical_text:
  quote: ''
  summary: The passage describes Chippewa war-party preparations and travel, including
    a leader's pipe rite directed toward enemy country, an address to the drum, the
    ordered departure of the party, scouting before attack, the singing of medicine
    songs, red medicine applied to arrowheads, and preparation of the war medicine
    bi'jikiwuck with a song whose gloss refers to arising from a flowing spring. It
    also includes Densmore's musical analysis of the songs.
  language: English with Ojibwe terms and song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before departure, the leader filled and lighted a pipe, took a puff, held
    the stem toward the enemy's country, spoke a death formula concerning Sioux who
    might puff the pipe, and passed the pipe to all the warriors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leader spoke to the drum in a low muttering tone, asking it to be faithful
    or true.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the ceremony, the drum gave the signal; the pipe-bearer led the way,
    while the leader walked last carrying a rattle of deer hoofs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Once underway, the drum stopped beating and the party walked mostly in silence
    except for the leader's rattle; the party stopped to rest and smoke, camped if
    possible before attack, and scouts watched the Sioux.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the warriors neared the enemy, they prepared for warfare by singing medicine
    songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: War arrowheads were dipped in red medicine while the Arrow Song was sung.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The gloss for the Arrow Song identifies the arrowhead as scarlet or red.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The principal war medicine named bi'jikiwuck, glossed as cattle herb medicine,
    was said to make men strong and to be a powerful healing medicine; warriors chewed
