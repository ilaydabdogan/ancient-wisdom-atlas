literal_observations:
- id: obs:1
  text: The drum was accompanied by four leading-drummers' drumsticks covered with
    soft brown deerskin and decorated with otter fur and long ribbon streamers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A longer stick, used only by the owner of the drum in a specific part of the
    ceremony, was more than 3 feet long and had a curved end covered with loon neck
    skin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The drum pipe had a flat decorated stem with geometric drawings and red woodpecker
    feathers; a second pipe, called the warrior pipe, was not shown because it had
    been sent ahead for the ceremony.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A turtle shell contained tobacco mixed with the inner bark of red willow;
    a wooden box held tobacco, red willow, and matches; another similar box kept feathers
    for decorating the drum stakes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Bi'jikens received the drum from a leader of the Bad River Chippewa and, after
    parting with it, retained the right to make duplicates and give them away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mec'kawiga'bau said he intended to make a duplicate drum and give it away;
    he stated that no songs or ceremonies accompanied the making of a drum, but the
    songs for a new drum had to be those received with the original.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Me'dweya'sun, an elderly chief of the Lac du Flambeau Chippewa, publicly transferred
    a drum to Mec'kawiga'bau because he could not fulfill the obligations associated
    with it and wanted it kept safely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Similar drums seen on several Minnesota reservations were said to have been
    received from the Sioux and were used in social dances.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Minnesota drums described lacked decorated drumsticks and a pipe belonging
    to the drum, and their significance as peace symbols was said to have been lost.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A drum party originally consisted of 29 persons, and it was formerly not customary
    for one person to belong to more than one drum.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The listed drum-party personnel included a chief, drum owner, speaker, aid,
