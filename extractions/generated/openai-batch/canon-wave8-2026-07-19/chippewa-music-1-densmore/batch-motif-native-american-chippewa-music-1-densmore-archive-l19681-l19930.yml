canonical_text:
  quote: ''
  summary: The passage gives rhythmic analysis tables, then introduces Begging Dance
    songs. It reports that the first song and the dance were said to have come from
    the Assinniboin or Rock Sioux and to have become practiced among the Chippewa.
    E'niwub'e describes a custom in which a newborn boy lay outside the wigwam among
    dogs; the dogs kept him warm, caused him to know a song, and later followed him
    as he sang from camp to camp with a deer-hoof rattle. He and the dogs were given
    food, which is presented as the origin of the begging dance. Later dancers represented
    themselves as dogs and could receive food when dancing from wigwam to wigwam.
  language: English
  quote_policy: summarized
