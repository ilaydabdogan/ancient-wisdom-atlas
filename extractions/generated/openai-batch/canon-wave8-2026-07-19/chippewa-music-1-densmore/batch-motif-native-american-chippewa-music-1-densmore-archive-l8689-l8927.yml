  summary: The passage presents an Ojibwe dream song associated with a ten-day vigil
    and obscure dream-song words, then gives Odjib'we's account of a Chippewa attack
    on Ca'gobens's camp by the Minnesota River. In the fight, Ga'witayac' is mortally
    wounded, carried on a pole litter, sings his death song, and dies while still
    singing. His large bear manido animal is identified in connection with the death
    song. The passage also notes later songs composed about the fight and sung in
    dances after the warriors returned.
