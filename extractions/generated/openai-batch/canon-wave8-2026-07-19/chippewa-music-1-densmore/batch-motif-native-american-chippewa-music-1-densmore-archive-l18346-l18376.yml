canonical_text:
  quote: ''
  summary: 'The passage describes rules and signals in a moccasin game: a marked bullet
    is hidden under a moccasin, players indicate guesses through hand positions and
    gestures, and a correct guess by both players is called a “double crack” that
    grants an additional turn at hiding the bullets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guessing player holding the striking-stick may choose to risk the score
    on his own judgment if he believes he knows where the marked bullet is hidden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the striking-stick holder makes this independent choice, he extends his
    right hand with two fingers spread, and his partner does not indicate a guess.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the usual practice is for each of the guessing players
    to decide where he thinks the marked bullet is hidden.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The guesser holding the bullets places the marked bullet in a hand position
    corresponding to the moccasin where he thinks the opponent’s marked bullet is
    concealed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A marked bullet placed between the first and second fingers corresponds, in
    the given example, to the moccasin next to the right end of the row.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The man holding the bullets is allowed only one guess.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man with the striking-stick is allowed three guesses and may toss aside
    two moccasins without revealing the marked bullet before turning another moccasin
    for the score.
  category: sequence
  evidence_refs:
  - ev:3
