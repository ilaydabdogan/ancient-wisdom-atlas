- id: obs:2
  text: The Menominee beat their drums, sang, and danced around them; afterward the
    Chippewa sang opening songs used at four days of dancing at Lac du Flambeau, including
    songs of drum-party officials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Menominee listened while the Chippewa sang, and the women sat with heads
