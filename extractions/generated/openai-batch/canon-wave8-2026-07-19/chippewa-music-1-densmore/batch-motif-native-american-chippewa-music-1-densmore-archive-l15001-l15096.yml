canonical_text:
  quote: ''
  summary: The passage describes the arrival and reception of Chippewa participants
    at a Menominee drum-presentation ceremony. The Menominee and Chippewa sing, dance,
    exchange hospitality, organize a feast for the visiting Chippewa, suspend the
    ceremony because of rain, and then prepare the dancing circle, drums, pine branches,
    tobacco reception, and feather garments for presentation of the chief drum.
  language: English
  quote_policy: summarized
