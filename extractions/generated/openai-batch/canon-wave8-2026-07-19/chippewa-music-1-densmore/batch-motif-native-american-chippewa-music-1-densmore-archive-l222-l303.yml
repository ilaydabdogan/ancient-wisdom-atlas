literal_observations:
- id: obs:1
  text: The passage states that 131 songs, about 39 percent of the full set, contain
    tones of pentatonic or five-toned scales, described according to five Helmholtz
    varieties that differ by keynote.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The largest pentatonic subgroup is the fourth five-toned scale, also called
    the major pentatonic or Scotch scale, with 88 songs; the second or minor pentatonic
    has 40 songs; two songs use the fifth five-toned scale; one song uses the first
    five-toned scale.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies a smaller group, the major triad and sixth, as comprising
    12 percent of the songs and lacking the second tone of the fourth five-toned scale.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the major-triad-and-sixth group, the sixth is described either as a passing
    tone between tonic and dominant in descending progression or as combined with
    the tonic triad above it before resolving toward the tonic major triad.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Only 6 percent of the songs contain all seven tones of the diatonic octave.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fifth is present in 338 songs, the third in 329 songs, the sixth in 276
    songs, the second in 210 songs, the fourth in 135 songs, and the seventh in 110
    songs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives the order of diatonic tone persistence in the Chippewa songs
    as fifth, third, sixth, second, fourth, seventh.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage notes similarity between the Chippewa interval-frequency results
    and Doctor Baker's analysis of songs from several Indian tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Dr. C. S. Myers is cited for a Murray Island finding that use of the fourth
    preceded use of the fifth, but that with development of the tonic, the fifth above
    it became more often used than the fourth above it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A group classified as octave complete except seventh and fourth omits the
    same tones lacking from the fourth five-toned scale, but has minor third and sixth
    intervals, making those songs minor in tonality rather than major.
  category: relationship
  evidence_refs:
  - ev:4
