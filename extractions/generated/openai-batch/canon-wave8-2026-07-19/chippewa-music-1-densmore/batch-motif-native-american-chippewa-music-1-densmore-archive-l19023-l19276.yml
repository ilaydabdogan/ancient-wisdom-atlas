canonical_text:
  quote: ''
  summary: The passage gives musical analyses and free translations for several Chippewa
    songs. It describes recurring rhythmic units, songs of sadness and love-longing,
    an invitation to sing, and a song in which a woman or mother asks for Bugac's
    daughter and mentions a large brass kettle as valued property connected with her
    son.
  language: English with transliterated Ojibwe song words
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening analysis describes a song of 29 measures in five irregular periods;
    its rhythmic unit occurs three times and resembles rhythms in intervening parts
    of the song.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Song No. 109 is titled "I am Thinking of Her," was sung by Mec^kwawiga^bau,
    recorded without drum, and its free translation says the speaker sits thinking
    of a woman and is sad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The analysis of No. 109 says it was considered particularly old, has many
    whole-tone intervals, uses a prominent subdominant associated here with sadness,
    and has a rhythmic unit that influences the whole song although repeated only
    once.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Song No. 110 is titled "Weeping for My Love," was recorded without drum, and
    its free translation says the speaker goes around weeping for the speaker's love.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The analysis of No. 110 says three recorded renditions vary slightly, the
    long rhythmic unit occurs four times, the middle part has similar progressions
    with a different rhythm, and the subdominant is prominent.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Song No. 111 includes words glossed as a beseeching call to come, a proposal
    to sing, and a question asking why the addressee is offended; its analysis says
    it moves from chiefly double time to triple time and has no rhythmic unit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Song No. 112, titled "Song of an Ambitious Mother," includes words about asking
    for Bugac's daughter, a big brass kettle, and someone giving; the prose note says
    the brass kettle was highly valued and that the woman singer appears to bestow
    her own property while representing her son.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The analysis of No. 112 says it begins and ends on the same tonic tone, is
    one of comparatively few songs composed by women, and has slight variation in
    repetitions of its rhythmic unit.
  category: attribute
  evidence_refs:
  - ev:8
