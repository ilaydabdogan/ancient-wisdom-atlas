canonical_text:
  quote: ''
  summary: Wis'kino makes a Chippewa speech of welcome, thanking Ki'jie Manido' that
    former enemies now meet in peace, leave differences behind, and shake hands. He
    describes the presentation of a drum between tribes as a ceremony done in the
    sight of Ki'jie Manido'. He says he is delaying unfinished farm harvest work in
    order to serve Ki'jie Manido' first and expects to return to his work in good
    spirit.
  language: English with Chippewa names/terms
