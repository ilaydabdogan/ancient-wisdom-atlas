canonical_text:
  quote: ''
  summary: The speaker addresses earth-born people, urging them to leave Death, Error,
    Ignorance, Darkness, and Destruction and to share in Deathlessness. Some mock
    and depart on the Way of Death, while others ask for instruction and fall at the
    speaker’s feet. The speaker raises them, becomes a leader of the Race toward home,
    teaches saving words/logoi, sows words of wisdom in them, and gives them Deathless
    Water to drink. At evening the speaker directs thanksgiving to God, after which
    each returns to rest. The speaker then records Man-Shepherd’s benefaction in the
    heart and rejoices; the excerpt ends mid-sentence about bodily sleep.
  language: English
  quote_policy: summarized
