canonical_text:
  quote: ''
  summary: The commentary describes a tradition in which Hieroglyphic Egyptian is
    treated as a divine or magical language. It links the tractate's framing to Hellenistic
    traditions about Thoth-Hermes or Taautos, secret temple writings, sacred characters,
    and translations made for King Ammon. It compares accounts attributed to Philo
    of Byblus, Sanchuniathon, Thabion, and Jamblichus, and notes a pattern of hidden
    Hermetic teachings discovered in temple spaces and translated into a current language.
  language: English
