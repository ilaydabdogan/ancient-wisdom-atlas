canonical_text:
  quote: ''
  summary: Hermes instructs Tat on the soul, mind, spirit, and body. The infant soul
    is described as still near the Cosmic Soul, while the growing body draws the soul
    downward into forgetfulness and vice. At death the mind takes a fiery body, the
    soul is subject to judgment and chastisement, and pious and impious souls have
    different post-mortem states. The pious soul becomes entirely mind and is guided
    to the light of gnosis, while the impious soul is scourged by its own sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hermes describes an infant's soul as not yet cut off because its body is still
    small and not fully grown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The infant soul is described as beautiful, not yet befouled by bodily passions,
    and almost hanging from the Cosmic Soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the body grows, it draws the soul down into its mass; the soul cuts itself
    off, forgets, and the forgetfulness becomes vice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the soul withdraws from the body, the mind is stripped of its wrappings,
    takes a fiery body, traverses every space, and leaves the soul to judgment and
    deserved chastisement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In an earthy body, mind cannot sit naked by itself; it uses the soul as an
    envelope, the soul uses spirit as an envelope, and spirit pervades the living
    creature.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When mind frees itself from the earth-body, it puts on its proper robe of
    fire, which it could not wear while dwelling in an earth-body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Earth is said not to bear fire, and water is described as poured around earth
    as a guard and wall against blazing fire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mind is called builder and is said to use fire as a tool for construction;
    the Mind of all constructs all things, while the mind of man constructs things
    on earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A pious human soul, when freed from the body after fighting the fight of piety,
    becomes entirely mind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fight of piety is defined as knowing God and doing wrong to no person.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An impious soul remains in its own essence, is chastised by itself, and seeks
    an earthy human body to enter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage denies that a human soul passing from the body is changed into
    a beast.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The chastised impious soul is depicted as crying that it burns, is ablaze,
    is devoured by surrounding ills, and neither sees nor hears.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: When mind becomes a daimon, it takes a fiery body to execute the services
    of God and scourges the impious soul with whips made of its sins.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: On the pious soul, mind mounts and guides it to the Gnosis' Light; the soul
    praises God, blesses all people, and does good in word and deed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Hermes tells Tat to praise God and pray for Good Mind, saying the soul passes
    to a better state and cannot pass to a worse one.
  category: speech
  evidence_refs:
  - ev:10
