literal_observations:
- id: obs:1
  text: When the soul departs from the body, the judgment and weighing of its merit
    pass into the power of its highest daimon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the highest daimon sees the soul as pious and just, it permits the soul
    to rest in appropriate places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the soul is stained by evil deeds and vice, the highest daimon drives it
    from Above into the Depths and hands it over to warring hurricanes and vortices
    of Air, Fire, and Water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The punished soul is dragged between Heaven and Earth on the waves of Cosmos
    in contrary directions and suffers ceaseless pains and torture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker warns that people should dread and guard against these toils,
    and says unbelievers will be driven to believe by actual punitive sufferings rather
    than by words or threats.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Asclepius asks whether the faults of men are punished by human law alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Trismegistus answers that all things on Earth must die and that embodied beings
    receive rewards or punishments according to the merits or demerits of life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Trismegistus says punishments are more severe when misdeeds were hidden during
    life, because after death the divinity makes the guilty fully conscious of all
    things according to the punishments allotted to their crimes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Trismegistus contrasts violent death under human law with the righteous person,
    whose defense is serving God and deepest piety; God guards such people from every
    ill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: God, called the Sire of all and Lord, loves to show Himself and sheds light
    on a person through the mind’s intelligence; the person shakes the clouds of Error
    from the soul, sees the brilliancy of Truth, mingles with the All-sense of Divine
    Intelligence, gains freedom from the part ruled by Death, and receives the seed
    of assurance of future Deathlessness.
  category: sequence
  evidence_refs:
  - ev:5
