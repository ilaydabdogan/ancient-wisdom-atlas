  text: The passage says Sibylline literature often consists of traditional history
    written in a prophetical tense, allowing the writer's date to be detected when
    historical correspondence ends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For the Hermetic prophecies discussed here, the commentator says there is
    no such dating guide and suggests only that they seem most probably written when
    Trismegistic communities were being persecuted.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first prophecy is said to be addressed to Asclepius and to lament that
