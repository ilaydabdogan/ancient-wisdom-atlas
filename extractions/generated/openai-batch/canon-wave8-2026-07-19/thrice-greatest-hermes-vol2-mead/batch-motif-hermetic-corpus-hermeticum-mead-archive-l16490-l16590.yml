canonical_text:
  quote: ''
  summary: Commentary identifies the All-sense or Whole Sense of Divinity with the
    Likeness of God and the intelligible cosmos, describes its relation to human memory
    and consciousness, then discusses the difficulty of interpreting the Hermetic
    prophetic utterances, including a lament over the disappearance of Pure Philosophy
    and a prophecy of legal proscription of the worship of the Gods in Egypt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The All-sense is described as the same as the Whole Sense of Divinity and
    as the Likeness of God; man is said to have to make himself like this Likeness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Likeness is identified by the commentator as the Aeon or Intelligible
    Cosmos, and the Cosmic Sense is described as the container of all sensibles.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In man, the chief normal characteristic of this Sense is said to be memory,
    through which man is made ruler of the Earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The same Sense is described as man's continuum, germ of everlastingness, root-ground
    of consciousness, and Single Sense of the intelligence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The commentator states that reliance on a translation prevents too much stress
    on details and that the chief general points include the prophetic utterances.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prophetic utterances are described as difficult, and the passage notes
