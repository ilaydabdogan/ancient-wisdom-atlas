canonical_text:
  quote: ''
  summary: The passage foretells a period when a holy feminine figure or place becomes
    identified with barbarism, humanity despises the Cosmos, values are inverted,
    the soul’s immortality and the Religion of the Mind are mocked or persecuted,
    gods depart, harmful angels remain with humanity, and cosmic order fails. It then
    describes God restoring the Cosmos to its ancient form by removing evil through
    flood, fire, or disease, naming this restoration the rebirth and renewal of the
    Cosmos. A closing dialogue discusses Will, Determination, God as willing all good,
    and the World as the Image of the Good.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A feminine figure or place is described as beloved by God, a sole colony of
    holiness, and teacher of religion on earth; it is said that she will become the
    type of what is most barbarous.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human beings are said to stop wondering at and praising the World and to despise
    and cease loving the Cosmos, though it is described as God’s changeless work and
    a unified divine construction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage states a reversal of values: darkness is set before light, death
    is preferred to life, the pious person is considered mad, the impious a sage,
    the frenzied strong, and the worst best.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Teachings about the soul and its deathlessness are said to be treated as sport
    and vanity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A death penalty is said to be decreed against one devoted to the Religion
    of the Mind, and new laws will reject hearing or believing anything sacred, pious,
    heavenly, or divine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods are said to depart sorrowfully from humans, while bad angels remain,
    mingle with humanity, and drive people toward wars, robberies, deceits, and other
    things opposed to the soul’s nature.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Earth, sea, heaven, the courses of stars, divine voice, earthly fruits, fertility,
    and air are all described as failing or becoming inactive.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The described condition is named the World’s old age and is characterized
    as impiety, irregularity, and lack of rationality in good things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: God is said to check crime, call error back from corruption, end ill by washing
    it away with flood, burning it with fire, or using pestilent diseases, and recall
    the Cosmos to its ancient form.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The rebirth of the Cosmos is described as the making new of all good things
    and the bringing-back of Nature through a set course of time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Asclepius asks about God’s Nature, Will, Determination, and the Highest Good;
    Tris answers that Will and Determination are related, that God wills and thinks
    all good, and that the World is the Image of the Good.
  category: speech
  evidence_refs:
  - ev:7
