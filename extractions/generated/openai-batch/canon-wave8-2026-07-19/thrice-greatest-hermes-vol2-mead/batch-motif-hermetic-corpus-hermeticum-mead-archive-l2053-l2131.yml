  summary: The passage comments on cosmic generation under Fate and Providence, identifies
    Love as the motive power that can lead either to material darkness or knowledge
    of Light, explains mortality through body, water, darkness, and death, and describes
    the Way of Deathlessness as self-knowledge preceded by purification. It also discusses
    Mind, the disciple and Master, lower desires, the Avenging Daimon, and a comparison
    to the Platonic Vision of Er.
