canonical_text:
  quote: ''
  summary: In a dialogue, the teacher explains that ignorance remains in Darkness
    and Death because material embodiment derives from Darkness and Moist Nature.
    Self-knowledge of origin in Life and Light enables return to Life. Mind aids pious
    people with gnosis and restrains bodily sense-operations, while remaining far
    from impious mindless people.
  language: English
  quote_policy: summarized
