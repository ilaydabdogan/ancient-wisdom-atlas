canonical_text:
  quote: He is both Supreme, and One, and Only, the truly wise in all
  summary: The speaker says he will summarize earlier teaching in a more mystical
    way for an advanced addressee. He argues that manifest made things are multiple,
    different, and made by another; therefore there is a maker who cannot be made,
    is more ancient than made things, is supreme, one, only, wise, ruling over their
    measures and continuity, and invisible unlike makeable things.
