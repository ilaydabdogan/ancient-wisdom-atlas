  summary: 'Commentary on the Hermetic treatise titled “Sacred Sermon”: the commentator
    notes textual corruption, interprets the title as suggesting a doctrinal foundation,
    compares it with Orphic and Pythagorean sacred sermons, relates the treatise to
    the “Shepherd” cosmogony while acknowledging contradictions, and introduces a
    section on the Trinity as a theological proem before cosmogenesis.'
