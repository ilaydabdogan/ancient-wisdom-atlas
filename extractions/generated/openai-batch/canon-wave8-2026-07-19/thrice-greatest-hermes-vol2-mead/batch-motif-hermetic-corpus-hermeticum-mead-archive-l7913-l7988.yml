canonical_text:
  quote: ''
  summary: The speaker addresses Hermes and explains that the Cosmos changes without
    dissolution through revolving and concealment. The Cosmos is all-formed and changes
    forms within itself. God, as maker, is described as possessing a single unseen
    bodiless idea or form that manifests ideas through bodies. The passage compares
    this bodiless idea to reason and to painted mountain-tops that appear raised though
    actually flat. It further states that God’s life and motion consist in doing good,
    moving all things, and making them live, and that all things are in God not spatially
    but in relation to the bodiless.
  language: English
  quote_policy: summarized
