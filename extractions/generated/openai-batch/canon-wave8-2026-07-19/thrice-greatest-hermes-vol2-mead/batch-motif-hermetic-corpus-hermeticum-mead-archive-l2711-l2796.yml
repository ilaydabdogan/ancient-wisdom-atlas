canonical_text:
  quote: ''
  summary: The passage discusses Good Shepherd iconography as rooted in earlier Greek
    and Hermetic forms, especially Hermes, and compares Christian representations
    with the Abercius inscription, Naassene Attis material, and a Christian lamp or
    gem showing Christ as Good Shepherd amid planets, lambs, Noah imagery, Jonah imagery,
    and a gourd-tree. The author interprets this grouping as a symbol of mysteries
    and rebirth.
  language: English
  quote_policy: summarized
