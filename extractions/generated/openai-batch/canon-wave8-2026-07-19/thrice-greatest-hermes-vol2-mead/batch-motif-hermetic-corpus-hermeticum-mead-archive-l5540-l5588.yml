canonical_text:
  quote: ''
  summary: The commentary explains a Hermetic treatise in which the Cosmos is treated
    as a “Second God” while still subordinated to God as source, limit, and constitution
    of all things. It describes Cosmos as a great sphere or perfect form, figured
    as cave or womb of generated things, and says cosmic life is preserved by restoration,
    ever-becoming, and cyclic renewal. It distinguishes privation of sense from loss
    of body and relates God, Cosmos, and Man through image, sense, and mind.
  language: English
  quote_policy: summarized
