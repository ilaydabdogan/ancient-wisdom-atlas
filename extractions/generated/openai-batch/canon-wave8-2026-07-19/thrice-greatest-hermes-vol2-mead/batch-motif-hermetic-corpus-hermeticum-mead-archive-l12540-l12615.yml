  quote: ''
  summary: The passage urges the return of divine blessings to their source through
    praise of the all-pure God, Father of souls. It compares human insufficiency in
    praising God to newborn babes thanking a father, then applies the same pattern
    to the King as sire. It also describes Gnosis as distributing life and the power
    to bless God, and says God sends tidings to the lower world urging praise that
    brings souls home, while divine Thought, Prescience, Mind, and Sense are one.
  language: English
  quote_policy: summarized
