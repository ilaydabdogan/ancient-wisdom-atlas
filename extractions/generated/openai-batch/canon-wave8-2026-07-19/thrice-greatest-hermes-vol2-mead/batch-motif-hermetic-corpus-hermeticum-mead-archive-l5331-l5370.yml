  quote: ''
  summary: The commentary describes a short sermon as an appeal to stop the drunkenness
    of physical sensations and awaken to Light. It notes Reitzenstein’s view that
    the sermon is a prophetic preaching not explicitly ascribed to Hermes in the manuscripts.
    The commentator compares its style and spirit with a passage in the Poemandres
    treatise that addresses earthborn people as drunk, asleep, and ignorant, and then
    suggests a possible common stock with an Oxyrhynchus logion in which Jesus says
    he found all people drunken and none athirst.
