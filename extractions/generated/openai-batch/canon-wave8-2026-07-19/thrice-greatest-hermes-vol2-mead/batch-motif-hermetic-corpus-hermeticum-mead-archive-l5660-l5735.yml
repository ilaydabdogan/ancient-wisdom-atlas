canonical_text:
  quote: ''
  summary: 'The passage contrasts evil deeds attributed to evil daimones with the
    few but good seeds of God: virtue, self-control, and devotion identified as God-gnosis.
    Those in Gnosis are rejected by the many, while the devotee of God bears all things
    and makes bad things good by referring them to Gnosis. The passage distinguishes
    material humans, who receive thought-seed from daimons, from substantial humans,
    who consort with the Good and are saved by God. It also states that God makes
    all things like Himself, while the Cosmic Course befouls some becomings with bad
    and cleans others with good; Cosmos has its own sense-and-thought.'
  language: English
  quote_policy: summarized
