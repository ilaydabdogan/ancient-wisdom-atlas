canonical_text:
  quote: ''
  summary: In a dialogue titled “Mind unto Hermes,” Hermes asks Mind, addressed as
    master, for the truth about the All and the Good. Mind teaches a cosmological
    order in which God makes Aeon, Aeon makes Cosmos, Cosmos makes Time, and Time
    makes Becoming. The passage assigns qualities and functions to each term, describes
    nested containment among them, states that God is the source of all, and identifies
    God’s Wisdom with the Good, the Beautiful, Blessedness, Virtue, and Aeon.
  language: English
  quote_policy: summarized
