canonical_text:
  quote: Space is a Plenum
  summary: 'Mead''s commentary discusses the lost or uncertain title and introduction
    of a Hermetic tractate addressed to Asclepius, then summarizes its doctrine: space
    is a plenum, God is not space but its cause, all motion occurs in what is stable,
    Reason orders the motion of the World-Soul, and soul moves otherwise inert bodies.'
  language: English
  quote_policy: quoted
