canonical_text:
  quote: |-
    By ''Space" I mean that in which are all
    things.
  summary: The passage describes Space and Cosmos as containing all things and the
    births of all things, discusses evil and the divine endowment of human minds with
    sense, science, and intelligence, presents Spirit as governing and quickening
    the Cosmos under Highest God, explains the Cosmos as a sphere with an invisible
    lower part called Hades or Inferi, and concludes that Cosmos nourishes bodies,
    Spirit souls, and Higher Sense the mind.
  language: English
  quote_policy: quoted
