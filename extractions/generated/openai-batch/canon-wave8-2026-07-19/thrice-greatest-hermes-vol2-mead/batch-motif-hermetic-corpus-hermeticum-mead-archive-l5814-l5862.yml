canonical_text:
  quote: To understand is to believe, to not believe is not to understand.
  summary: The speaker describes God's sense-and-thought as continually moving all
    things and states that nothing exists outside God. Addressing Asclepius, the speaker
    links understanding with belief, says the word or logos leads toward truth, and
    describes the mind as reaching belief and rest in Fair Faith when it reasons over
    these teachings.
