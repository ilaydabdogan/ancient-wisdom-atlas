canonical_text:
  quote: Baptize thyself with this Cup's baptism... thou that hast faith thou canst
    ascend to Him that hath sent down the Cup.
  summary: Hermes teaches Tat that God created the world through Logos, sent humankind
    to earth, and distributed Reason to all but set Mind as a prize in a divine Cup.
    A Herald proclaims that those able should baptize themselves in the Cup, receive
    Mind, gain Gnosis, ascend toward the sender, and become perfect. Those lacking
    Mind remain bound to bodily impulses. Tat asks for baptism, and Hermes explains
    the required choice between body and divine Self, perishing and bodiless realities.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Hermes says the World-maker made the universal World with Reason or Logos,
    not with hands, and describes Him as everywhere, ever-being, the Author of all,
    One and Only.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The World-maker's Body is described as untouchable, invisible, immeasurable,
    inextensible, unlike any other frame, and not identical with Fire, Water, Air,
    or Breath, though these come from it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: God sends man down to Earth as a cosmos or ordered being of the divine frame;
    man is described as both deathless and mortal and as excelling by Logos and Mind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Man becomes a contemplator of God's works, marvels at them, and strives to
    know their Author.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hermes says Logos has been distributed among all men, while Mind has been
    set up in the midst for souls like a prize.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: God fills a mighty Cup with Mind, sends it down, joins a Herald to it, and
    commands the Herald to proclaim to the hearts of men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The proclamation calls those hearts able to do so to baptize themselves with
    the Cup's baptism, to have faith they can ascend to the sender, and to know why
    they came into being.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those who understand the Herald's tidings and douse themselves in Mind become
    partakers in Gnosis and are made perfect men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who do not understand the tidings possess Reason only and not Mind,
    and are said to be ignorant of why and whereby they came into being.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men without Mind are described as having senses like irrational creatures
    and as centering thought on bodily pleasures and appetites.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Those receiving a portion of God's gift are said to win release from Death's
    bonds, embrace earth, heaven, and what is above heaven in Mind, sight the Good,
    and speed toward the One and Only One.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hermes identifies the Gnosis of the Mind as Vision of Divine things and God-knowledge,
    and says the Cup is God's.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Tat says he too would be baptized.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Hermes tells Tat that he cannot love his Self unless he first hates his Body,
    and that one cannot give oneself both to perishing things and to divine things.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Hermes frames existing things as twofold, Body and Bodiless, with a required
    choice between them; the waning of one allows the growth of the other.
  category: relationship
  evidence_refs:
  - ev:10
