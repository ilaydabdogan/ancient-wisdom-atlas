canonical_text:
  quote: ''
  summary: The passage describes Nature, embraced by Man, bringing forth seven male-female
    beings corresponding to the Seven. It then explains their elemental formation,
    the transformation of Man from Life and Light into soul and mind, the loosening
    of a bond at the end of a period, the separation of male-female creatures into
    male and female, God's command to increase and multiply, and the teaching that
    the man with Mind should know himself as deathless while misdirected bodily love
    leads astray.
  language: English
  quote_policy: summarized
