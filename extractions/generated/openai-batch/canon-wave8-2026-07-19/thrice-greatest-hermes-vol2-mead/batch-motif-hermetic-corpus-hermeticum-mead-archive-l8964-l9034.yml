  summary: Hermes instructs Tat that God can be contemplated through the ordered Cosmos,
    that all energies and beings are energized by God, that Matter, Body, and Essence
    are also divine energies, and that God is the All beyond limitation by size, space,
    quality, form, or time. The passage ends by identifying the proper worship of
    God as not being bad.
