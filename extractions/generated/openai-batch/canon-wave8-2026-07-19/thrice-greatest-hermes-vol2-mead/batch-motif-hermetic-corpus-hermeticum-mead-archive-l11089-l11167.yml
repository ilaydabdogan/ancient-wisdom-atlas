canonical_text:
  quote: "“For all things are [these] twain, Maker and made”"
  summary: In a letter attributed to Hermes to Asolepius, the divine is described
    as unseen because it continually makes. The passage urges comprehension, marvel,
    and blessed recognition of one’s Sire. It names the divine as God, Maker, and
    Father, correlating these with Power, Energy, and Good. It then reduces all things
    to Maker and made, with no third term, and states that these are inseparable;
    the Maker is Alone, Simple, and Uncompound, making to itself. A translator’s note
    discusses an uncertain term rendered as things in obscuration and compares it
    with symbolic language about chambers, caverns, doors, and soul genesis/decease.
  language: English
