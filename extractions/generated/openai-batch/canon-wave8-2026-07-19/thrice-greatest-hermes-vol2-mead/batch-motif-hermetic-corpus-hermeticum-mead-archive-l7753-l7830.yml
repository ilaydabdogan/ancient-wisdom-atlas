canonical_text:
  quote: One, then, is God.
  summary: Mind argues to Hermes that the ordered unity of living bodies, soul, matter,
    life, and the cosmos implies a single maker. Living bodies are described as composed
    of soul and matter, while God alone puts Soul into lives and makes life, soul,
    deathlessness, and change.
  language: English
