canonical_text:
  quote: ''
  summary: The speaker tells Asclepius that the Good is not found in the world, which
    is described as full of bad, but belongs to God. The Beautiful and Good are identified
    with God and cannot be separated from Him. Visible worldly things are called images,
    while unseen realities, especially the Beautiful and Good, are presented as true.
    The one path to God and the Beautiful is Devotion joined with Gnosis. People who
    lack this knowledge mistake bad things for good and try to preserve and increase
    them.
  language: English
  quote_policy: summarized
