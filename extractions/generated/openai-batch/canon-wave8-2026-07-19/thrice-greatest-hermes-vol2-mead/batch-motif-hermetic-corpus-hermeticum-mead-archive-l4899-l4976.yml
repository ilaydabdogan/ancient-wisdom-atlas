canonical_text:
  quote: In God alone, is, therefore. Good, or rather Good is God Himself.
  summary: The passage argues that God alone is Good because God lacks superior, peer,
    anger, envy, and passion. Created or generated things are passible and mixed with
    bad; the cosmos is good only insofar as it makes all things. Human good is described
    as an impure, lesser portion of bad, and the body is bound by labours, pains,
    desires, passions, error, and foolish thoughts. Asclepius is told that the name
    of Good is found among humans, but not the thing itself.
  language: English
  quote_policy: quoted
