  quote: ''
  summary: The commentary notes that God is named Good and Father, rejects immediate
    literary contact between two scriptural sets despite similarities, and discusses
    the duty to beget children before contemplative retirement. It compares this duty
    with Jewish, Egyptian priestly, Pythagorean, and Hindu life-stage teachings, suggests
    Asclepius may represent married pupils, and records a medieval scribe’s marginal
    objection.
