canonical_text:
  quote: ''
  summary: In a Hermetic dialogue, Asclepius asks whether Cosmos is good. Trismegistus
    teaches that God apportions good things such as Sense, Soul, and Life, while Cosmos
    bestows mortal goods including seasonal fruits and life stages. The passage maps
    regions beyond Heaven, between Heaven and Earth, and Earth and Sea under divine
    rulers called Zeus Above and Zeus Below, then mentions earth-rulers gathered in
    a western Egyptian/Libyan hill community. It turns to death, defining ordinary
    death as bodily dissolution and loss of corporeal sense, while also alluding to
    another unavoidable death that humans ignore or disbelieve.
  language: English
  quote_policy: summarized
