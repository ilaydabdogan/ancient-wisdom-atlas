canonical_text:
  quote: ''
  summary: The commentary describes the founder as a personification of a teaching-power
    or spiritual illumination rather than a historical person. It characterizes this
    illumination as heightened intuition capable of receiving cosmic consciousness
    and retaining it after returning to ordinary consciousness. The teaching is framed
    as ordered apocalyptic, an Inner Mysteries vision revealed by a Great Initiator
    or Master-Hierophant. The passage explains that such visions are ineffable, interpreted
    through each seer's inherited intellectual and religious materials, and commonly
    transmitted in anonymous or pseudepigraphic literature shaped from personal illumination
    and gathered traditions.
  language: English
  quote_policy: summarized
