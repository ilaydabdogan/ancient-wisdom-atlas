canonical_text:
  quote: This is the sole salvation for a man — God's Gnosis. This is the Way Up to
    the Mount.
  summary: Hermes contrasts the soul's vice of ignorance with the virtue of Gnosis,
    describes Cosmos and man within a hierarchy of God, Cosmos, and man, outlines
    the nested principles of human constitution and bodily death, and identifies God's
    Gnosis as salvation and the upward way to the Mount.
  language: English
  quote_policy: quoted
