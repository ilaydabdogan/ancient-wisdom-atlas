canonical_text:
  quote: '"the soul''s rational part is set above the lordship of the daimons"'
  summary: The passage describes daimons of mixed good and bad natures who have authority
    over earthly affairs, create turmoil among nations and individuals, and shape
    embodied human souls. At birth, daimons associated with the moment of the wheel
    of Genesis and ranged under the stars take hold of each person. They change continually
    and circle back. They descend through the body into parts of the soul and set
    it in motion, while the rational part of the soul remains above their lordship
    and is made to receive God.
