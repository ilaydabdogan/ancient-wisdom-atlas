canonical_text:
  quote: ''
  summary: The passage distinguishes incorporeals and bodies with respect to motion,
    action, passion, and passibility. It states that release from body frees a person
    from passion. Her. tells Tat that God gave humans mind and speech/logos, equal
    to immortality, for knowing and praising God; proper use of them guides the departing
    person to the Choir of Gods and Blessed Ones. The passage then distinguishes human
    speech from the voices of other living things, asserts one human speech across
    Egypt, Persia, and Greece, and cites Good Daimon on the nested relation of body,
    soul, mind, reason/logos, and God.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Incorporeals are said to be moved by Mind and by movement's passion; both
    mover and moved are subject to passion, with the mover ruling and the moved ruled.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who has freed himself from body is also said to be freed from passion,
    although the speaker then states that nothing is impassible and all are passible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Passion is distinguished from passibility as active versus passive, while
    action and passion are also described as the same thing under different terms.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tat addresses the speaker as father and says that the teaching has been set
    forth clearly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'God is said to have bestowed two things on man beyond all mortal lives: mind
    and speech/logos, described as equal to immortality.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mind is assigned the function of knowing God, and uttered speech/logos is
    assigned the function of eulogizing God.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One who uses mind and speech/logos rightly will not differ from the immortals
    and, on departing from the body, will be guided by the two to the Choir of Gods
    and Blessed Ones.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other living things are said to use voice rather than speech/logos; speech
    is general among humans, while voice differs by class of living thing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Human speech is described as one and interpreted, and as found the same in
    Egypt, Persia, and Greece.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Good Daimon is cited as declaring a nested order: soul in body, mind in soul,
    reason/logos in mind, mind in God, and God as Father of these.'
  category: relationship
  evidence_refs:
  - ev:6
