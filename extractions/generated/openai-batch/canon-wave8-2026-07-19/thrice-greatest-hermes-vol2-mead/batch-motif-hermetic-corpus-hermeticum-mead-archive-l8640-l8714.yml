  quote: ''
  summary: A Hermetic dialogue explains that one who has Mind may be freed from vice,
    reports Good Daimon's saying that all things are one and that Mind is the Soul
    of God, and applies this to the question of Mind's rule over Fate. Tat then asks
    whether Mind becomes passion when it co-works with irrational impulses, and Hermes
    answers by distinguishing incorporeal movers from bodies moved.
