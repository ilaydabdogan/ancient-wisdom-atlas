canonical_text:
  quote: ''
  summary: Opening portion of the Asclepius in which Trismegistus gathers Asclepius,
    Ammon, and one other hearer for a restricted divine sermon. The passage teaches
    the unity of All and One, the deathlessness of souls, elemental processes of descent
    and ascent, and the formation of the cosmos from four elements under one Cosmos,
    one Soul, and one God.
  language: English
  quote_policy: summarized
