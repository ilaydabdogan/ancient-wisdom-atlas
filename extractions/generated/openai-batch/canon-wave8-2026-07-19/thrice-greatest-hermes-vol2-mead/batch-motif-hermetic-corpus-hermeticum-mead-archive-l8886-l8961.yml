canonical_text:
  quote: "“Now dissolution is not death, but dissolution of a compound ... that it
    may become renewed.”"
  summary: Hermes teaches Tat that compound bodies dissolve for renewal rather than
    destruction; life is motion, Earth is both stable and rapidly moving, all cosmic
    parts move toward increase or decrease, and death is forgetfulness rather than
    change. He describes Matter, Life, Spirit, Mind, and Soul as immortal constituents,
    says man receives God and is coessential with Him, and explains that God foretells
    the future through visions, tokens, birds, inward parts, wind, and tree. Other
    creatures inhabit single elemental domains, while man uses earth, water, air,
    and fire and senses heaven.
  language: English
  quote_policy: quoted
