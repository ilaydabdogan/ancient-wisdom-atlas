canonical_text:
  quote: ''
  summary: 'The passage presents a Hermetic account of ordered ontological levels:
    Reason, Mind, God, Body, Form, Soul, Air, and Matter stand in image and encompassing
    relations. It describes Necessity, Providence, and Nature as instruments of cosmic
    ordering, explains number and units in composition and decomposition, and states
    that the Cosmos is a living divine image of the Father with no dead thing in it.
    Tat asks whether living beings in the Cosmos die, and the father/speaker corrects
    him as being misled by ordinary terminology.'
  language: English
  quote_policy: summarized
