  summary: The commentary compares an All-form or Omniform divine power with Hermetic
    passages on an omniform circle of life-types and with a prayer to Thoth as Logos.
    It emphasizes that the central issue is not only the Logos's power to create,
    destroy, and transmute forms, but also the potential of man as microcosm to share
    this magic power through a discipline of Egyptian Wisdom. It contrasts a philosopher-mystic
    acting by self-achievement with a theurgist petitioning a god.
