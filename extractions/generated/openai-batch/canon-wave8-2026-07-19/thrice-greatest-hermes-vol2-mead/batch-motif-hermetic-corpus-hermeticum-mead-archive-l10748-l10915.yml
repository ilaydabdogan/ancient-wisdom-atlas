  quote: ''
  summary: The passage is a commentary on the Hermetic Secret Sermon. It explains
    the New Birth as a secret transformation of consciousness, links it with the Essential
    Birth of the divine Son, describes Tat’s desire to hear the Praise-giving of the
    Powers at the Ogdoadic stage beyond fate, and interprets the hymn as a secret
    morning and evening prayer to the Spiritual Sun, to be heard in silence. It also
    compares Ogdoad language and ritual silence or timed prayer with Christian Gnostic,
    magical, Therapeutae, Apollonian, and Pythagorean examples.
  language: English
