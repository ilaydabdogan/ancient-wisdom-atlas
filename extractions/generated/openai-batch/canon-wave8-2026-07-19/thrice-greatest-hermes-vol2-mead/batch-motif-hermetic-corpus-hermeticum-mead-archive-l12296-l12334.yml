  summary: 'The passage states that God does not grow weary. It then presents a musical-contest
    analogy: trumpeters, flautists, pipe, and plectrum perform a composition; if something
    goes wrong, blame is not placed on the music-maker''s inspiration, but on the
    defective instrument that hinders excellent performers and deprives listeners
    of the song''s sweetness. The analogy is then introduced as applying to the speaker''s
    own case.'
