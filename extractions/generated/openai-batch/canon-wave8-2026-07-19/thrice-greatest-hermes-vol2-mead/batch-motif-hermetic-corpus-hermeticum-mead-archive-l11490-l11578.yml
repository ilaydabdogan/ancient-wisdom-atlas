  quote: "“For thus the Demiurge — I mean the Sun — eternally doth order Heaven and
    Earth”"
  summary: The passage describes visible natures of Fire, Water, and Earth depending
    from one Root; Earth as a treasury of matter; and the Demiurge, identified as
    the Sun, as ordering Heaven and Earth through the circulation of Essence and Matter.
