canonical_text:
  quote: ''
  summary: Commentary on the Definitions of Asclepius identifies the Sphere as the
    Instrument or Wheel of Genesis/Samsara; describes daimones ruling lower soul energies
    while the rational soul is set above them as receptacle of God, Ray, or Mind;
    quotes Valentinus on the heart purified of evil essences and compared to a neglected
    inn until the Good Father sanctifies it; and comments on an Egyptian dependency
    scheme in which God is Sire of all and the Sun is Demiurge or Creative Logos,
    not the All-god.
