canonical_text:
  quote: ''
  summary: The passage explains Logos, Light or Mind, Father, and Son as apparently
    distinct but ultimately one in an emanative relation. Hermes receives expanded
    sight through the Master's Word and sees Powers within the Light, as well as a
    boundary restraining the elements and Fire. The passage then presents Chaos, Discord,
    Concord, and Cosmos as arising from God's Will, and describes a feminine divine
    aspect, named Wisdom, Nature, Generation, and Isis in related tractates, as Mother
    or Desire united with Fullness or impregnated by the Word to generate the sensible
    cosmos. Mead compares this pattern with the Gnostic Sophia myth and with Egyptian
    and related traditions.
  language: English
  quote_policy: summarized
