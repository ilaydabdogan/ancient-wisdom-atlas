canonical_text:
  quote: "“In every case the Mountain is no physical mountain, but the height of contemplation,
    an interior state of spiritual consciousness.”"
  summary: 'The commentary explains terms and stages in a Hermetic initiation: a way
    out of ignorance, moral and mental purification, the suppliant-disciple’s relation
    to the master, the holy mountain as an interior contemplative state, and Tat’s
    regeneration through birth from above and the virgin womb. It compares these themes
    with Philo, apocalyptic and Gnostic mountain scenes, New Testament rebirth language,
    and the Naassene description of regeneration.'
  language: English
  quote_policy: quoted
