  summary: The narrator enters a meditative, sense-withdrawn state in which thought
    is raised upward. A vast Being addresses him, identifies himself as Man-Shepherd
    and Mind of all-masterhood, and promises instruction. The narrator asks to learn
    the nature of things and to know God. The Being’s aspect changes, a limitless
    vision of light appears, and then darkness descends, coils like a snake, and changes
    into a turbulent moist nature emitting smoke as from fire.
