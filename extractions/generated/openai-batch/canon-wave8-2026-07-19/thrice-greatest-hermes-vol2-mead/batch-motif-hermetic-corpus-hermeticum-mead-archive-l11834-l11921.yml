canonical_text:
  quote: ''
  summary: 'Commentary on the title and transmission of a Hermetic treatise: it discusses
    Patrizzi''s arrangement of sections, manuscript content lists, Reitzenstein''s
    source-critical view, Lactantius'' report about Asclepius and a sermon to the
    King, and a tradition that Hermetic teaching was Egyptian and later interpreted
    into Greek modes of thought.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Patrizzi is described as combining sections under a title for the Definitions
    of Asclepius and assigning later headings to Books II and III despite doubts about
    their fit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later manuscript hand is said to have added a contents catalogue including
    God, Matter, Evil, Fate, the Sun, the Pleroma, the Seven Stars, and the Man after
    the Likeness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Reitzenstein is reported as attributing the contents list and similar headings
    to a Byzantine scribe who also interpolated a section.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lactantius is cited as saying that Asclepius, the hearer of Hermes, explained
    the doctrine of daemon incursions in a Perfect Sermon written to the King.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The treatise is compared with The Key of Hermes as an epitome, and Asclepius
    is said to have previously written sermons to the King.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: References to conversations between Hermes, Asclepius, and Tat are said to
    presuppose a Hermetic dialogue class and to suggest that the Asclepius-King correspondence
    is a later deposit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The introduction is said to claim that Asclepius' literary activity was authorized
    by Hermes and originally written in Demotic Egyptian; the commentator denies that
    the Greek is a direct translation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentator states that the author was probably in contact with a living
    tradition that the Hermes-teaching was originally Egyptian and was interpreted
    into Greek modes of thought.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author is described as showing contempt for the Greek language and Greek
    philosophizing.
  category: attribute
  evidence_refs:
  - ev:9
