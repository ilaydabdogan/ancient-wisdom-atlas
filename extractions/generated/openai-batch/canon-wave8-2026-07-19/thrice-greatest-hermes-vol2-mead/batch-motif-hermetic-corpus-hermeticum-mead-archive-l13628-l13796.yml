canonical_text:
  quote: there are two images of God — Cosmos and man.
  summary: The passage presents God as first, Cosmos as second, and man as third.
    God makes and rules the Cosmos, while man, as a compound and dual-natured being,
    knows himself and the world, cares for the lower world, practices piety, renounces
    alien possessions and bodily desire, investigates divine things, and may be restored
    after deathly bonds to his higher divine nature.
  language: English
  quote_policy: quoted
