  summary: The passage is Mead's commentary on Poemandres. It treats the text as a
    redacted but spiritually intended composition, then describes the disciple's meditative
    initiation by the Master of the masters/Great Man and cites a Gospel of Eve passage
    about a gigantic Man, a dwarf, a lofty mountain, and a voice declaring reciprocal
    identity. It closes by describing the disciple's renunciation of lower desires
    and desire for Gnosis of Cosmos, nature, and God.
