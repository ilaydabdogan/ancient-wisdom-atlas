- id: obs:2
  text: Mind says the soul can mount to heaven without wings, pass unhindered through
    cosmic obstacles, cut through star-bodies, reach the last Body, and, if willed,
    contemplate what is beyond the Cosmos.
  category: action
  evidence_refs:
