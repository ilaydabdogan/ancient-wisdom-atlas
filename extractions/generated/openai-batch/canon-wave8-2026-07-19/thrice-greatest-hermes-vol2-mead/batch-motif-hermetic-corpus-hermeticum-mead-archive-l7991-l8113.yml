  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mind contrasts this expansion with locking the soul in the body and declaring
    ignorance, fear of the sea, inability to scale the sky, and ignorance of past
    and future identity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mind says that being able, willing, and hoping to know the Good is a Straight
