canonical_text:
  quote: ''
  summary: 'Mind instructs Hermes that the soul can travel instantly to land, ocean,
    heaven, and beyond the cosmic limit. Mind then teaches that God is known by becoming
    like God: transcending body and time, conceiving oneself as deathless, gathering
    all senses and states into oneself, and knowing all times, places, qualities,
    and quantities at once. The passage contrasts this with locking the soul in the
    body and ignorance. It describes knowledge of the Good as a Straight Way and says
    God is manifest through all created things.'
  language: English
  quote_policy: summarized
