- id: obs:4
  text: Mind instructs Hermes to become the same stature as transcendent Greatness,
    leap forth from every body, transcend all Time, and become Eternity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mind instructs Hermes to conceive nothing impossible, think himself deathless,
    and able to know all arts, sciences, and ways of life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mind instructs Hermes to collect into himself the senses of all creatures,
