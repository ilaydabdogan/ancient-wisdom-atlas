canonical_text:
  quote: ''
  summary: The passage is commentary on the sermon "On Thought and Sense." It discusses
    the sermon’s textual placement, explains a doctrine in which human sense is joined
    with thought while mind can rise beyond sense and be illumined by God’s Light,
    likens mind to a womb or woman impregnated either by Seeds of God or by Daimonial
    Energy, connects this to Philo and the theme of Sacred Marriage, and comments
    on the social opposition faced by those in Gnosis in comparison with Synoptic
    sayings about persecution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Lactantius had a collection in which two sermons
    stood in close connection.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports Reitzenstein's view that the sermon may be an extract,
    while the commentator notes that its formal beginning and ending suggest a complete
    tractate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The doctrine summarized says that "sense-and-thought" together constitute
    human "sense."
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Normal human thought is described as bound to sense-impressions, while mind
    alone is described as able to soar beyond the senses and be illumined by God's
    Light.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mind is compared to a womb or woman that may be impregnated by the Seeds of
    God or by Daimonial Energy and bring forth virtues or vices.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that the Seeds of God are Virtue, Self-control, and Devotion
