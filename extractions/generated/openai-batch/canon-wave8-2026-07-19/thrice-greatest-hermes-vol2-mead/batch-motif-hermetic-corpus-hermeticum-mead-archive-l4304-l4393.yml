canonical_text:
  quote: ''
  summary: Commentary on the Hermetic Cup or Monad passage describes the Cup as God’s
    gift, links it to an inner baptism and ascent through Gnosis of Mind, explains
    the discipline of “hating the body” as nonliteral, develops a Middle Way of balance
    between Body and Mind, and compares the language of hatred or leaving family to
    Christian and Gnostic interpretive traditions. It also presents the union of Heaven
    and Earth as a Sacred Marriage.
  language: English
  quote_policy: summarized
