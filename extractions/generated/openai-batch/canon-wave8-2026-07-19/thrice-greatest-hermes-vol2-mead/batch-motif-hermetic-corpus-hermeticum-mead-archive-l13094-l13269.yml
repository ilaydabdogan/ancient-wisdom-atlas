canonical_text:
  quote: "“man is a mighty wonder”"
  summary: The passage presents a cosmological hierarchy in which Sun and Moon regulate
    bodily increase and decrease, while God rules Heaven, its Soul, and the Cosmos
    as maker of all things. It describes the Cosmos as a receptacle of forms, divides
    beings into genera and species, distinguishes immortal genera from mortal species,
    explains relations among gods, daimons, humans, animals, and earth-life, and praises
    man as a mixed earthly and divine being able to draw near to gods through piety
    and mind.
  language: English
  quote_policy: quoted
