canonical_text:
  quote: Naught is, naught could have been, naught ever will be void.
  summary: The speaker rejects the existence of a void, describing the cosmos as completely
    full of diverse bodies. Even a hypothetical extra-cosmic region is said to be
    filled with intelligible things, while the sensible cosmos is filled with bodies
    and animals. Daimones and heroes are assigned abodes near humans and in the pure
    air between earth and heaven. Asclepius is instructed not to call anything void
    except relative to a specified absence such as fire or water, since nothing can
    be void of spirit and air.
  language: English
  quote_policy: quoted
