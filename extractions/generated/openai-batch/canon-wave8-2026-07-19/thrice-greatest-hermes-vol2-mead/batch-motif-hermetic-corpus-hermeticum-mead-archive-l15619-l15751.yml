canonical_text:
  quote: ''
  summary: 'The passage argues that Space is not meaningful or existent as void apart
    from that of which it is the space. It distinguishes a bodiless Intelligible or
    Higher Cosmos from the Sensible Cosmos, presents God as the source and quickener
    of all things, and describes sensible things as wrapped by the Higher Cosmos.
    It then explains classes, forms, and images: divine idea is bodiless and unchanging,
    while individual forms differ according to moments in the cosmic revolution.'
  language: English
  quote_policy: summarized
