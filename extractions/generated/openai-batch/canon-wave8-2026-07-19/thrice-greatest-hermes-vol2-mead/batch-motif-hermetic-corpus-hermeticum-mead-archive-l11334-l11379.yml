  summary: Commentary on the Letter of Hermes to Asclepius compares its doctrine with
    Mind unto Hermes, especially statements about a deity working by himself and divine
    power. It then compares the Good Husbandman image with an invocation naming the
    Good Husbandman, Good Daimon, Harpocrates, and Chnouphis, and with alchemical
    passages in which a Husbandman teaches that what is sown is what is reaped.
