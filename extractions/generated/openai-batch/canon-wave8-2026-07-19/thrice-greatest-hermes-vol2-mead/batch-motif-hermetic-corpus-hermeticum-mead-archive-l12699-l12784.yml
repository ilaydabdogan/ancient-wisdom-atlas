canonical_text:
  quote: ''
  summary: The passage is Mead’s commentary on the Hermetic “Encomium of Kings.” It
    reports Reitzenstein’s view that the Eulogy was appended by an Egyptian Trismegistic
    rhetor to show imperial rulers that the Hermes religion was harmless and encouraged
    loyalty. It then discusses uncertain addressees and dating, including Reitzenstein’s
    Diocletianic proposal. The passage closes by comparing Encomium §6 with Clement
    of Alexandria’s story of Eunomus the Locrian and the Pythic grasshopper, in which
    Greeks gather at Pytho to celebrate the death of the Serpent while Eunomus sings
    or plays in a contest and grasshoppers sing nearby.
  language: English
  quote_policy: summarized
