  quote: ''
  summary: Hermes, in dialogue with Asclepius, explains that motion comes from an
    interior animate principle such as soul or spirit rather than from bodies alone.
    He denies that existent things are void, rejects the example of empty vessels,
    and identifies air as body.
  language: English
  quote_policy: summarized
