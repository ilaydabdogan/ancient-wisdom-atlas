- id: obs:2
  text: Hermes says the cosmos and every other hylic animal are moved by interior
    causes such as soul, spirit, or something similar, not by exterior things.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hermes denies that a body by itself moves a living thing and says a lifeless
