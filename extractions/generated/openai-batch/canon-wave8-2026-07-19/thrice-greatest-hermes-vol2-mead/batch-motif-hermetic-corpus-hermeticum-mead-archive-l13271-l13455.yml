  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Man is described as the sole twofold animal: one part is simple or essential
    and called the form of Divine Similitude, while another is hylic or cosmic and
    corporal.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The divine in man, including the godhead of Mind and the senses of Pure Mind,
