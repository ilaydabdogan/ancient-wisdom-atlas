canonical_text:
  quote: "“man hath his place in the more blessed station of the Midst”"
  summary: The passage describes humanity as placed in a cosmic middle station, joined
    to other beings by love and capable through mind and reason of ranging through
    heaven, earth, air, and water. It distinguishes animal and stationary life by
    roots and nourishment, states that spirit gives life and that reason is given
    to humans alone, contrasts true reason with its counterfeit, explains humanity
    as both divine similitude and embodied cosmic materiality, and begins an account
    of God making and loving a second visible and sensible God.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Man is described as kin to other things through a heavenly order in him, binding
    them to himself with bonds of love and turning his gaze to Heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Man is placed in the blessed station of the Midst, where he loves those below
    himself and is loved by those above.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Man tills the Earth, mingles with the Elements through the mind, plunges into
    the Sea’s depths, assigns values to all things, and is not obstructed by Heaven,
    Air, Earth, or Water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Animal species are described as having roots stretching from above below,
    while stationary species send branching greenery upward from one living root.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two forms of food are named, one for soul and one for body; soul is nourished
    by the motion of the World, while bodies grow from water and earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Spirit is said to fill and interblend with living bodies and make them live;
    sense is added, and reason is given to man alone as a fifth part from the ether.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: God is said to adorn, extend, and exalt the sense of man alone toward understanding
    the Divine Reason.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some men consciously enjoy the gods’ regard through union with the Gods and
    through a share of Divine Sense of intelligence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Not all men possess true reason; those pursuing its counterfeit are deceived,
    and this evil transforms the best of animals into beast-like nature and brute
