canonical_text:
  quote: '"God, Father and the Good," then, Tat, hath the same nature, or more exactly,
    energy.'
  summary: Hermes addresses Tat after a prior discourse to Asclepius. He teaches that
    God, Father, and the Good are one in energy, that the Good wills all things into
    being, and that the Sun and human parents are only secondary causes through the
    Good. Tat responds to the vision of the Good with language of the mind's eye.
    Hermes describes the Good as seen only in silence, with the senses stilled, drawing
    the soul out of the body and making it like God. He then teaches that individual
    souls derive from the All-soul and undergo transformations through forms of life,
    with human souls changing into daimones and circling toward the choir of the Inerrant
    Gods.
  language: English
  quote_policy: quoted
