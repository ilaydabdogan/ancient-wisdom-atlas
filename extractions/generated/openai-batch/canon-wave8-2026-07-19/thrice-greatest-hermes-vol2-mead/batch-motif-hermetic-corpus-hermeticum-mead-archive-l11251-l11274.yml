canonical_text:
  quote: ''
  summary: Hermes explains that God, identified as the Good, makes all things. He
    offers an image of a husbandman sowing different seeds and planting vines, apple
    trees, and other trees. In the same way, God is said to sow Immortality in Heaven,
    Change on Earth, and Life and Motion in the universe; these four, together with
    God and Genesis, contain all things.
