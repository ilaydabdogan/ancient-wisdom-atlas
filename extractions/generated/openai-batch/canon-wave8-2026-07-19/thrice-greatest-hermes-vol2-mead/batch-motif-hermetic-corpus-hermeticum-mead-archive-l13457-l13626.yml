canonical_text:
  quote: ''
  summary: 'The passage describes God making man as an imitator of divine Reason and
    Love, enclosing him in a body, and forming him from mortal and immortal natures.
    Humanity is assigned a double function: to worship and contemplate Heaven while
    cultivating and governing earthly things through arts, sciences, and mutual services.
    Human worship delights Heaven and its hosts. The Muses are said to have been sent
    down so that earthly praise might have music and harmony. A few people endowed
    with Pure Mind contemplate Heaven, while others study the elements and lower things;
    holy minds grasp the Perfect and True.'
  language: English
  quote_policy: summarized
