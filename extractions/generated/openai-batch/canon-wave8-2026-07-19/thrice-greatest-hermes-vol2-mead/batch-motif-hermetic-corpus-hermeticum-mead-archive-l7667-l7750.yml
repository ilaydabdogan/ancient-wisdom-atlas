canonical_text:
  quote: ''
  summary: 'Mind instructs Hermes to contemplate the Cosmos and its ordered beauty:
    the maker is present in all made things, the seven worlds are ordered by Aeon,
    light is born through the blending of contraries, the Moon and Earth have cosmological
    functions, and all bodies are ensouled, moved, and subject to Genesis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maker is described as being in all things made, making all rather than
    only one thing, energizing in the things made, and having those made things subject
    to him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mind tells Hermes to gaze through Mind upon the Cosmos visible to him and
    to regard its beauty as a perfect body, ancient and ever young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seven subject worlds are presented as ordered by Aeon's order and as fulfilling
    Aeon through their varied course.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: All things are said to be full of light and nowhere fire; light is said to
    be born from the love and blending of contraries and dissimilars by God's energy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: God is called the Father of all good, the Leader of all order, and Ruler of
    the seven world-orderings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Moon is described as forerunner, instrument of nature, and transmuter
    of lower matter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Earth is described as set in the midst of all, as foundation of the beautiful
    Cosmos, and as feeder and nurse of things on Earth.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage distinguishes deathless lives, lives subject to death, and the
    Moon midway between immortal and mortal lives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: All things are described as full of Soul and moved by it, each in its proper
    way, with motions not crossing from right to left, left to right, above to below,
    or below to above.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: All these bodies are said to be subject to Genesis, to have souls, and to
    be moved; they cannot come together into one without someone to bring them together.
  category: relationship
  evidence_refs:
  - ev:9
