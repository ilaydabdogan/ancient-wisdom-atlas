canonical_text:
  quote: The death or vice of the soul is ignorance, the virtue or life of the soul
    is Gnosis.
  summary: The commentary describes a Hermetic doctrine in which the soul passes through
    graded forms of existence, compares this with Pauline teaching on resurrection
    and differentiated bodies, discusses transmigration and liberation through Gnosis,
    and compares Hermetic psychology with Platonic, Brahmanical/Buddhistic, Jivanmukta,
    and Upanishadic patterns.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the soul undergoes multitudinous transformations through
    stages called animal, human, daimonic, and god-like, with further grades among
    gods and a final stage of glory or power.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents a Pauline passage in which resurrection is explained
    through the image of a seed that must die before being made alive, with God giving
    each seed its proper body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pauline quotation distinguishes kinds of flesh, celestial and terrestrial
    bodies, and differing glories of sun, moon, and stars.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary interprets resurrection of the dead as reaching a first step
    of deathlessness and states that ignorance is the soul's death or vice while Gnosis
    is its virtue or life.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies an apparent difficulty between a teaching that a vicious
    or ignorant soul returns to animal bodies and another teaching that a human soul
    cannot do so.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The commentary resolves the difficulty by distinguishing the ignorant soul
    from the human soul that has the Good Mind, and states that the ignorant soul
    should not be called a man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says metempsychosis, described as continued revolution on the
    wheel of life and death, applies to one who persists in vice or ignorance, while
    Gnosis means freedom from samsara.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ignorant soul is described as not seeing the Light because it is blinded
    by bodily passions and tossed about.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the one who knows is good, pious, and divine while still
    on earth, and compares this to liberation while living.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The vehicles of man's Soul are listed as Mind, reason, soul, spirit, and body,
    arranged one within another as increasingly intimate to the true nature of man.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage compares the Hermetic sequence of vehicles with an Upanishadic
    hierarchy and with koshas composed of food, life, impulse, discrimination, and
    bliss.
  category: relationship
  evidence_refs:
  - ev:8
