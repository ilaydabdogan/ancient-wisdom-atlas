canonical_text:
  quote: ''
  summary: Hermes’ letter argues that Maker and made are paired principles united
    as leader and follower. God is the all-making Maker and the Good; evil, decay,
    and impurity are described as accompaniments of the making process rather than
    products of God. Change is described as a cleansing of genesis, and a painter
    analogy is used to defend God’s making of all things.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that without the Maker, the made is neither made nor exists,
    because each loses its nature without the other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: All things are described as two terms, “that which is being made” and “that
    which makes,” and also as one in a union of leader and follower.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The making God is identified with “that which leadeth,” while whatever is
    being made is identified with “that which followeth.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: God’s glory is described as making all things, and the making of all things
    is called, as it were, God’s body.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that the Maker does not think or make what is bad or base;
    such things are described as passions accompanying the making process.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rust with brass and filth with body are used as analogies for accompaniments
    not made by the brass-smith or begetters; the passage similarly says God does
    not make evil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Continuance in the state of being made is said to cause things to lose their
    bloom, and God is said to have made change as a cleansing of genesis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A painter is said to be able to make heaven, gods, earth, sea, humans, animals,
    lifeless things, and trees; this is used to ask why God should not make all things.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Those who worship and praise God but do not ascribe the making of all things
    to Him are said not to know God and to commit impiety by attributing passion,
    arrogance, or impotence to Him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: God is said to have one passion only, Good, and the Good is said to have all
    power of making all.
  category: attribute
  evidence_refs:
  - ev:7
