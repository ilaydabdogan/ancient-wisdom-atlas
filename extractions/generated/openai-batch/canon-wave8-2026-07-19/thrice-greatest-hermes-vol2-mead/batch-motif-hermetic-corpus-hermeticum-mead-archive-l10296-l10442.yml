canonical_text:
  quote: No physical sight, even of the greatest intensity, can penetrate the Veil
    of this Mystery.
  summary: The commentary explains the Hermetic rebirth as an inner transformation,
    describes Tat's preparation through spiritual senses and inward inversion, contrasts
    the Logos as author of rebirth with the maker of mortal birth, and interprets
    repentance through the expulsion of vices by invoked virtues and through a numerical
    scheme of Twelve, Ten, Seven, Three, and One.
  language: English
  quote_policy: quoted
