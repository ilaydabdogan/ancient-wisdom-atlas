canonical_text:
  quote: ''
  summary: The passage presents God and Æon/Eternity as principals, describes Cosmos
    and Cosmic Sense as a moveable order and container of sensibles, distinguishes
    human memory and intellect from cosmic and divine sense, places the Truth of God
    beyond the temporal cosmos, thanks God for light to see Divinity, commands Tat,
    Asclepius, and Ammon to keep divine mysteries hidden in the heart, and says humans
    perceive heavenly things through a mist until fuller self-consciousness.
  language: English
  quote_policy: summarized
