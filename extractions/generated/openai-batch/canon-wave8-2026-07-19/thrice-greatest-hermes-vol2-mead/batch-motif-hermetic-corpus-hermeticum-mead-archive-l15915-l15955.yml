canonical_text:
  quote: Thus is it that man is the maker of the Gods.
  summary: Asclepius asks about the nature of terrene gods. Tris answers that they
    consist of plants, stones, and spices containing their own divine nature; they
    are pleased by sacrifice, hymns, praise, and harmonious sounds. Heavenly nature
    is drawn into images through heavenly practices so that it may dwell with mankind
    for long periods. Tris states that man is the maker of the gods, and distinguishes
    heavenly gods dwelling in heaven from these gods who aid humans through care,
    oracles, prophecy, foresight, and help.
  language: English
  quote_policy: quoted
