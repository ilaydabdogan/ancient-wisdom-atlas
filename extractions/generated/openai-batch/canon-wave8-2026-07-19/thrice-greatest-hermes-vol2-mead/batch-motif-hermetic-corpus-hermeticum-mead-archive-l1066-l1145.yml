canonical_text:
  quote: ''
  summary: A speaker asks Mind, addressed in the reply as Man-Shepherd, about the
    Way Above. The answer describes dissolution of the material body, return of senses
    and passions to their sources, ascent upward through the Harmony, surrender of
    de-energized traits to seven zones, arrival at the Eighth, hymning of the Father,
    and final self-surrender to Powers so as to be in God. An opening continuation
    describes an Avenging Daimon tormenting an unnamed figure with fire and through
    the senses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Avenging Daimon sharpens fire, adds fire upon an unnamed figure, and torments
    him through his senses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tormented figure is described as meeting greater torment and continuing
    to desire inordinate appetites while striving in the dark.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A questioning speaker says that Mind has taught him and asks for further teaching
    about the nature of the Way Above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Man-Shepherd answers that when the material body is dissolved, the body is
    surrendered to change, the former form vanishes, and the way of life is surrendered
    to a Daimon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The body’s senses pass back into their sources, become separate, and resurrect
    as energies, while passion and desire withdraw to a nature without reason.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After these changes, man goes upward through the Harmony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At seven zones, the ascending man gives up or de-energizes growth and waning,
    device of evils, guile of desires, domineering arrogance, unholy daring and rash
    audacity, evil wealth-striving, and ensnaring falsehood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: With the energizings of the Harmony stripped from him and clothed in his proper
    Power, the man comes to the Nature belonging to the Eighth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Eighth, the man hymns the Father with those who are there; they welcome
    him with joy, and he hears higher Powers singing praise to God.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A band goes to the Father’s home, surrenders itself to Powers, becomes Powers,
    and is in God; this is called the good end.
  category: sequence
  evidence_refs:
  - ev:7
