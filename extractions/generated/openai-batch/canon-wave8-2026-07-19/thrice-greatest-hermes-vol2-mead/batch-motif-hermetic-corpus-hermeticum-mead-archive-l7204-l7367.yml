canonical_text:
  quote: ''
  summary: 'The passage comments on Hermetic anthropology and eschatology: spirit
    is aligned with individualized life or prana; mind, soul, and spirit are described
    as layered envelopes; a quoted Hermaic teaching presents two souls; the Supreme
    Principle is described as standing perpetually; gnosis is named the saving Way
    Up; and at death mind becomes a daimon, takes a fiery body, and leaves the soul
    to judgment, chastisement, remorse, and consequences.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that spirit corresponds to life or prana, bestows motion
    and support on the living creature, and is not Life itself but individualized
    life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this life-principle is related to animal life and is a principle
    of soul that humans share with animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A quoted Hermaic teaching says that man has two souls: one from the first
    Mind that partakes of the Creator''s power, and another constrained soul from
    the revolution of the celestial spheres.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The quoted teaching says that the soul descending from the worlds keeps time
    with their circuit, while the soul from Mind is free from the whirl of genesis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same quoted teaching says that the soul from Mind bursts the bonds of
    Destiny and brings to birth the path up to the Gods visible to mind alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage quotes Hermes as saying that mind takes soul as an envelope, soul
    uses spirit as an envelope, and spirit pervades the living creature.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Supreme Principle is described as the One and Only One who stands perpetually
    and as the cause of the perpetual motion of the hylic cosmos.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that gnosis is the only path of salvation or safety and
    calls it the Way Up to the Mount or the Olympian Path.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explains that at death mind is stripped of its wrappings, takes
    a fiery body, traverses every space, and abandons the soul to judgment and deserved
    chastisement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that when mind becomes a daimon, law requires it to take
    a fiery body to execute the services of God.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The commentary says that at death the mind becomes a servant of God and that
    the human being is his own judge and chastizer.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The commentary interprets the fire of hell as the reflected light of mind,
    burning remorse, and the inevitable return of selfish actions, thoughts, words,
