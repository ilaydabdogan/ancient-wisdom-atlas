  summary: In a dialogue, Asclepius asks what God is. Hermes answers that God is not
    the named principles themselves, but the cause by which they are. He distinguishes
    being from non-being, says God is not Mind, Spirit, or Light but the cause of
    each, and teaches that God alone should be honored as Good and Father.
