canonical_text:
  quote: ''
  summary: The commentary analyzes the dialogue-persons and setting of the Perfect
    Sermon, identifying Asclepius as chief disciple, Tat as hearer, and Ammon as an
    admitted recipient of instruction. It emphasizes a sacred teaching scene in a
    holy place, secrecy around divine mysteries, possible ascetic community grades,
    doctrinal parallels within the Hermetic corpus, and teachings on the Will of God,
    Spirit, Matter, and the All-Sense.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentator suggests that the sermon was originally addressed to Asclepius
    alone and that narrative indications were later added for wider circles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asclepius is described as the chief disciple, already advanced beyond the
    Hearer stage, because he questions Hermes; Tat is described as one who listens
    only.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ammon is said to be added on Asclepius' proposal and admitted because he had
    already received much in writing but not oral teaching.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The teaching is located in a holy place or shrine, and the teacher and pupils
    together constitute the sacred four.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hermes teaches in an exalted state; the place is filled with God's presence;
    Love Divine instructs through Hermes' lips in response to the Love of Philosophy
    in the pupils' hearts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pupils are warned to keep the divine mysteries silent and hidden in the
    secret places of their hearts.
  category: speech
  evidence_refs:
