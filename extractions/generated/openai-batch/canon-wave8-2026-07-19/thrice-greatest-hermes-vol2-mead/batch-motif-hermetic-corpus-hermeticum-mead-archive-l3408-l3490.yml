  summary: The passage comments on a difficult Hermetic section by explaining a doctrine
    of Plenum and denial of Void, then identifies the Bodiless, Mind, Reason, or Logos
    as the container of all things and the Spouse or Son of Deity. It further states
    that God is not Spirit but the cause of Spirit and is Good alone, then compares
    this language with gospel sayings and explains the similarities as common Hellenistic
    theological diction rather than plagiarism or direct controversy.
