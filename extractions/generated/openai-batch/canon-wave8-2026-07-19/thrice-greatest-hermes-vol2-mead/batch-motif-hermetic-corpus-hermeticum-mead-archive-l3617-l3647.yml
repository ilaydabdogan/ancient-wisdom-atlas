canonical_text:
  quote: ''
  summary: The passage describes embodied souls under the revolution of the Cyclic
    Gods, given lordship and gnosis so they may observe Heaven, divine revolutions,
    God's works, Nature's energy, moral fates, and good arts. Their life, wisdom,
    and death occur according to cyclic fate. Human handiworks leave traces when cycles
    are renewed. Ensouled flesh, seed-fruit, and handiworks decay and necessarily
    renew through divine renovation and Nature's rhythmic wheel. Godhead and Nature
    are described as jointly involved in the ever-renewal of the cosmic mixture.
  language: English
