  quote: ''
  summary: A hymn of praise addresses Gnosis, Light, Life, the Father/God, Logos,
    Mind, Word, and inward Powers. The speaker offers reasonable oblation through
    the divine Reason, describes God’s Man crying through the elements and Spirit,
    and then Tat reports seeing praise-giving in the cosmos visible to mind alone,
    with Hermes instructing him to say it in that inward cosmos.
