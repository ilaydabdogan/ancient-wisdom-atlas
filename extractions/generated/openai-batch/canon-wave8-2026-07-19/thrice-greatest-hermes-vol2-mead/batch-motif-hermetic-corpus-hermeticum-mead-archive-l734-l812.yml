canonical_text:
  quote: ''
  summary: Nature receives the Word/Logos, copies the Beautiful Cosmos, and becomes
    a cosmos through her elements and soul-births. God-the-Mind, described as male
    and female and as Light and Life, brings forth another formative Mind, who forms
    Seven Rulers enclosing the sensible cosmos. The Logos rises from the downward
    elements and joins the Formative Mind, while the lower elements become reasonless
    matter. The Formative Mind turns the spheres, Nature and the elements generate
    living beings, and All-Father Mind brings forth Man as coequal, beloved child
    and image. Man desires to enform what he sees, receives the Father's assent, and
    changes to the formative sphere.
  language: English
  quote_policy: summarized
