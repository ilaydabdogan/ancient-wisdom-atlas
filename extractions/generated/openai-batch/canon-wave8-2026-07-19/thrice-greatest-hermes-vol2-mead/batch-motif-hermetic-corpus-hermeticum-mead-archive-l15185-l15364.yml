  summary: The passage contrasts the good and the bad, describes the good as shining
    in piety and seeing True Reason, presents the Sun as a second God who gives light
    and rules vital powers, and develops a metaphysical account of God, Cosmos, Eternity,
    Time, Order, motion, stability, deathlessness, and cyclical renewal.
