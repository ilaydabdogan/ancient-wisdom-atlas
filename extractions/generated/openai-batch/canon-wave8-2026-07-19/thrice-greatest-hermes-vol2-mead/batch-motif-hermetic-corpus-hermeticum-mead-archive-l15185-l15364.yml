  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Sun, like the Cosmos, is said to last forever and to rule or distribute
    vital powers; God is described as the eternal ruler and giver-forth of Life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: God is said to have bestowed Life once for all time on vital powers and to
