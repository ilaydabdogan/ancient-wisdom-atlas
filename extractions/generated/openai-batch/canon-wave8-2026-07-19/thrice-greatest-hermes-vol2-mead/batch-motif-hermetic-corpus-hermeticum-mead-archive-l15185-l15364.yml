  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: All spaces are said to be in God, and God alone is in them all; immovable
    Eternity is described as that into which the motion of all times returns and from
    which it begins.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Eternity is described as unchanging and containing ingenerate Cosmos, while
