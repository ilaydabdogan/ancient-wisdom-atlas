  quote: "“let him first raise himself unto the highest King — the God of wholes.”"
  summary: The passage instructs a singer of royal praises to begin with God, the
    highest King, then descend in orderly praise to earthly kings who hold sceptre-power
    after His likeness. God is described as deathless, everlasting, victorious, and
    the source from whom victories descend. Earthly kings are presented as divinely
    established rulers and peace-givers. The discourse then returns to its beginning
    by blessing the Better One, using an analogy of the Sun gathering first-fruits
    with its rays and concluding with the reception of a stream of wisdom for the
    garden of souls above.
