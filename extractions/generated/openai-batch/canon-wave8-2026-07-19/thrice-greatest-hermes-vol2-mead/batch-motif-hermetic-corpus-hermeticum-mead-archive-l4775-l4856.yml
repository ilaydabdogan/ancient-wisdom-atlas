  summary: Commentary on a Hermetic treatise discusses terminology of manifest and
    unmanifest divinity, explains the translator's rendering of phantasia as a manifesting
    power, compares this doctrine to Vedanta Maya and the Logos as Maker, quotes related
    hidden/manifest formulations from the Codex Brucianus and Simonian Gnosis, compares
    divine non-grudging with Corpus Hermeticum and Plato, and notes a panmonist address
    to the Logos and a concluding Hymn to All-God.
