canonical_text:
  quote: ''
  summary: The passage describes Man receiving shares from the Brother's creatures,
    crossing the boundary of the spheres and descending through Harmony to show God's
    form to Nature. Nature and Man behold and love Man's reflected form in Water and
    Earth, Man vivifies the irrational form, and Nature intermingles with him. The
    Shepherd then explains that earthly man is twofold, mortal in body and immortal
    in essential Man, yet subject to Fate, Harmony, and sleep. The frame returns to
    the narrator asking Mind to teach, and the Shepherd calls the matter a hidden
    mystery.
  language: English
  quote_policy: summarized
