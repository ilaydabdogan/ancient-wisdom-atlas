canonical_text:
  quote: ''
  summary: The passage comments on Hermetic psychology, after-death illumination,
    a fiery or astral body of purification, and the soul being chastised by its own
    sins. It interprets Christ's scourge as the soul's realization of the consequences
    of prior misdeeds. It then describes the dispensation of the universe as graded
    communion among God, Cosmos, and Man, with rays or powers proper to each. Human
    realization culminates in sacred marriage, deification, reception of the Fullness
    or Pleroma, and illumination by Mind or Spirit; souls empty of God are described
    as lacking true humanity.
  language: English
  quote_policy: summarized
