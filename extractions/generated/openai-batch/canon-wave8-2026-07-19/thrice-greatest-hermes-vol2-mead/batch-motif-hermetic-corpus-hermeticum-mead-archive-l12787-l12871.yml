canonical_text:
  quote: ''
  summary: The passage comments on a story in which a grasshopper fills a missing
    harp-string during Eunomus' performance, distinguishing naturalistic explanation
    from miracle. It then comments on divine kingship, describing subjects as children
    or members of the true King's body, and compares the unity of rulers or intelligible
    beings with Plotinus' account of mutual transparency and all-in-all containment
    in the intelligible world.
