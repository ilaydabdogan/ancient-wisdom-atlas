  summary: The passage describes an unnamed supreme principle as beyond appraisal,
    support, tracking, and ordinary knowledge. It then says Eternity transcends Time,
    while Time is also unbounded by number, change, or a secondary revolution and
    so shares the nature of Eternity. Both Time and Eternity are called boundless
    and eternal. Stability, though fixed, is said to sustain things in motion and
    therefore to hold the chief place.
