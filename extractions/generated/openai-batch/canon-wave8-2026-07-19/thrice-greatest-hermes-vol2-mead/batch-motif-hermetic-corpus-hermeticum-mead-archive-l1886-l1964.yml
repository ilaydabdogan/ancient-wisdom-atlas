canonical_text:
  quote: ''
  summary: The passage describes Mind or the One Form appearing in the Form of Man
    to save and gather the cosmos back into the Pleroma. It states that Word, Formative
    Mind, and Man are co-essential with one another and with the Father. Man, called
    the Beloved, descends clothed with powers, learns the limits of the Spheres, seeks
    to break through the Great Boundary, and descends further into matter. He seeks
    Nature below, shows her his radiant Divine Form, and Nature winds around its reflection
    in water and shadow on earth. This is compared to Darkness winding like a Great
    Serpent around Light. The passage then includes commentary identifying Nature
    as World-Soul, spouse of Mind, and Darkness as spouse of Light.
  language: English
  quote_policy: summarized
