    contrasts Greek argumentative words with Egyptian sounds filled with deeds, begins
    with an invocation to God as Lord, Maker, Sire, and Encompasser, and teaches that
    All is One and cannot be separated without destroying the Fullness. It ends by
    pointing to Earth containing founts of Water and Fire in its midst.
