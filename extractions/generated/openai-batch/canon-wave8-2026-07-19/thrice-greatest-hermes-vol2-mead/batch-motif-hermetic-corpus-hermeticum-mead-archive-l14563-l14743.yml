canonical_text:
  quote: Egypt is the image of the Heaven
  summary: In a dialogue with Asclepius, Trismegistus teaches that humanity has power
    in relation to the gods, including constructing temple gods or statues that are
    ensouled, spirit-filled, prophetic, and able to harm or heal. He then describes
    Egypt as an image or descent of heaven and the shrine of the world, but prophesies
    that divinity and the godly company will withdraw to heaven, Egypt's cults will
    be proscribed and forgotten, foreigners will occupy the land, tombs and corpses
    will multiply, and the holy river will overflow with blood.
  language: English
  quote_policy: quoted
