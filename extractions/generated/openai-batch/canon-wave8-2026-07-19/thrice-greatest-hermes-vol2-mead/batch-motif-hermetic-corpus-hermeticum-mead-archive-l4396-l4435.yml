canonical_text:
  quote: ''
  summary: 'Commentary on “The Cup or Monad” argues that “hate” and “body” should
    not be read literally, assigns evil to human choice rather than God or body, compares
    a statement about Gnosis with a Naassene logos, and describes the effects of receiving
    the Baptism of the Mind: becoming “perfect men,” knowing life’s purpose and immortality,
    gaining freedom from Death and Fate, and knowing the cosmos up to the Threshold
    of the Good and Plain of Truth.'
