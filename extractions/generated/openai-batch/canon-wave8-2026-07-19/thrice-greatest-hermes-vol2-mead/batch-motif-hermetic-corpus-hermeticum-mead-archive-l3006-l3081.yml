canonical_text:
  quote: For that resistance is the rest of motion.
  summary: Hermes explains to Asclepius that God should not be conceived as space
    but as an energy containing all space. He then argues that motion depends on stability
    and contrariety, using errant and inerrant spheres, the circumpolar Bears, and
    a swimmer resisting moving water as examples.
  language: English
  quote_policy: quoted
