canonical_text:
  quote: ''
  summary: In a secret sermon on the mountain, Tat asks Hermes to explain rebirth.
    Hermes describes rebirth as arising from understanding wisdom in silence, the
    True Good, and the Will of God. He says the race is not taught but remembered
    by God, describes being born in Mind after the former compounded form is dismembered,
    and instructs Tat to withdraw into himself, set aside bodily senses, and purge
    material torments so that divinity may come to birth.
  language: English
  quote_policy: summarized
