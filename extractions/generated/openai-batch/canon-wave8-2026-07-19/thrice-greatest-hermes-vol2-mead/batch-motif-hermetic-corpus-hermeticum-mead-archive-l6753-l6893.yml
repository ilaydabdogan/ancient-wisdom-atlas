canonical_text:
  quote: ''
  summary: The commentary discusses the Hermetic treatise called “The Key,” its possible
    place in a collected sequence of sermons to Asclepius and Tat, its transmission
    through Stobaeus and Chalcidius, and its possible status as advanced teaching.
    It then summarizes a doctrine in which the universe depends on the immutable Will
    or Energy of God, quotes Basilides on Non-Being and divine willing, and distinguishes
    God as transcendent Creator or Willer from the ordinary conception of a Maker
    or Demiurge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary states that the identity of “yesterday’s sermon” addressed
    by Hermes to Asclepius cannot be decided, but notes a similarity to the opening
    of another Corpus Hermeticum sermon and suggests a possible chronological collection
    of sermons to Asclepius and Tat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary says that “The Key of Thrice-greatest Hermes” was considered
    an important document and that the apocryphal “Books of Moses” plagiarized its
    title.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary reports that Stobaeus reproduced five extracts from the treatise
    and that Chalcidius quoted it as a treatise of Hermes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary says the treatise purports to be an epitome or abridgment of
    the “General Sermons” addressed to Tat, while the commentator judges it to be
    complete and fundamental rather than abridged.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentator suggests that introductory references to the “General Sermons”
    may be an editor’s gloss and that “The Key” may be further teaching presupposing
    prior instruction.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary describes “The Key” as a more intimate exposition of inward
    doctrine for higher grades of the school.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The commentary reports Reitzenstein’s view that the doctrine of two sermons
    is intermediate between dualism and pronounced pantheistic mysticism, but responds
    that different points of view and grades of instruction may coexist.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The commentary says the treatise begins by stating that the universe and all
