  summary: A speaker addresses a son, lists twelve Torments that afflict the embodied
    human, and describes their departure through God's mercy as the manner of Rebirth.
    The son is instructed to keep solemn silence while the Powers of God purify him
    for the articulation of the Logos. Gnosis, Joy, Self-control, Continence, Righteousness,
    Sharing-with-all, and Truth are invoked as powers that expel corresponding torments
    such as Not-knowing, Sorrow, Intemperance, Desire, Unrighteousness, Avarice, and
    Error.
