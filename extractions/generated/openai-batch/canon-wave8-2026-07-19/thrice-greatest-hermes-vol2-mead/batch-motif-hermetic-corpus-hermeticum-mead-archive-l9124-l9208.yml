canonical_text:
  quote: ''
  summary: A commentary section explains restricted Hermetic instruction by grades,
    lost treatises related to "Mind to Hermes," Heracleitus as a figure of direct
    revelation through Logos or Mind, and parallels between Hermetic and Basilidean
    teachings on the Mind-led or perfect person who suffers despite no outward sin
    because of latent will or capacity for sin. It also compares Basilides' babe with
    a Hermetic image of the infant soul still unbefouled and near the Cosmic Soul.
  language: English
