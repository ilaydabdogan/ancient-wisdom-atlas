canonical_text:
  quote: Gods are immortal men, and men are mortal Gods
  summary: The commentary describes a Hermetic sermon on the Common or General Mind,
    also called Great Mind, Good Mind, and Good Daimon. It notes that Hermes quotes
    Sayings of the Good Daimon, connects one saying with Heracleitus, discusses Logos
    as all-pervading Reason, highlights the formula “All are One,” and compares the
    style of a third saying with the Hermetic tractate called “Mind to Hermes.”
  language: English
  quote_policy: quoted
