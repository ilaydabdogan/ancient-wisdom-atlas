canonical_text:
  quote: ''
  summary: The speaker teaches Asclepius that only God is properly called Good, that
    God and the Good are one by nature, and that God gives all things while receiving
    nothing. God is also named Father because he makes all. The passage then treats
    child-making as pious, childlessness as a postmortem misfortune punished by daimons,
    and concludes that these teachings introduce gnosis of the nature of all things.
  language: English
