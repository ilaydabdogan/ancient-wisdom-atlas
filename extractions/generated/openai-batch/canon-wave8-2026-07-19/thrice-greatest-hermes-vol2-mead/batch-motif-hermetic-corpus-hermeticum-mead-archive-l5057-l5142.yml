canonical_text:
  quote: ''
  summary: Commentary on a Hermetic sermon titled from its opening proposition, grouped
    with Asclepius material. The passage discusses whether the sermon is genuinely
    or only formally dualistic, contrasts statements about the cosmos as a fullness
    of evil with other Hermetic passages that place evil on earth rather than in the
    cosmos, proposes a metaphorical reading, and compares Hermetic uses of cosmos
    with the opposition of cosmic and essential man and with a Christian logion about
    fasting to the world.
  language: English with Greek excerpts
  quote_policy: summarized
