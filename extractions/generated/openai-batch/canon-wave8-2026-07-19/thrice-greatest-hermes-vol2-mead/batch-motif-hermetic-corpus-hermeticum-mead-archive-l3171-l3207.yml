  quote: ''
  summary: Hermes argues that what is called void is not truly empty but hollow and
    filled with air and spirit, since body and air pervade and fill things. Asclepius
    accepts that air is a body and asks what to call the space in which the all moves.
    Hermes answers that it is the Bodiless, defined as Mind and Reason, self-embracing,
    free from body and error, containing and preserving beings. A note explains the
    four elements as earth, air, water, and fire.
