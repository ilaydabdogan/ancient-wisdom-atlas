canonical_text:
  quote: ''
  summary: Sections 7-10 instruct Tat on choosing the Better rather than the Worse,
    locating evil in human preference, and urging passage through bodies, daimones,
    and star-courses toward the One and Only God. The Good is described as boundless,
    bodiless, invisible, and known through Gnosis; Oneness is described as Source
    and Root of all.
  language: English
  quote_policy: summarized
