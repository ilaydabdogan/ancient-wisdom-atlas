canonical_text:
  quote: ''
  summary: A speaker tells Tat that God, though unmanifest and not seen by outer eyes,
    may be discerned by contemplating the ordered sun, moon, stars, Bear constellation,
    sea, earth, elements, and human formation in the womb. These visible orders are
    attributed to a Maker and Lord, and the passage describes the unmanifest as made
    manifest through cosmic order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that what is within the self may be unmanifest and that He
    who is within the self is not made manifest by outer eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker instructs the addressee to consider the sun, the moon's course,
    and the order of the stars, and asks who watches over that order.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every order is said to have boundaries marked out by place and number.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sun is described as the greatest god of gods in heaven, to whom the heavenly
    gods give place as to a king and master.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stars are described as having courses that are not alike or equal, and
    the speaker asks who marks out their manner and extent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bear is described as turning round itself and carrying the whole cosmos
    with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker asks who owns this instrument, who set bounds around the sea,
    and who set the earth on its seat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker states that someone is Maker and Lord of all these things, and
    that number, place, and measure cannot be kept without someone to make them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The orderless is said not to be without a lord, because it lacks the path
    of order and is beneath the one who has not yet ordained it order.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker wishes it were possible for Tat to get wings, soar into the air,
    and be poised midway between earth and heaven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: From that imagined vantage, Tat would behold the earth's solidity, the sea's
    fluidity and streams, the spaciousness of air, fire's swiftness, the coursing
    stars, and heaven's circuit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The imagined sight is described as seeing all these beneath one sway, with
    the motionless in motion and the unmanifest made manifest.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: To see Him through mortal things, the speaker directs Tat to consider a man
    being fashioned in the womb and to scrutinize the art of the one who fashions
    him.
  category: speech
  evidence_refs:
  - ev:8
