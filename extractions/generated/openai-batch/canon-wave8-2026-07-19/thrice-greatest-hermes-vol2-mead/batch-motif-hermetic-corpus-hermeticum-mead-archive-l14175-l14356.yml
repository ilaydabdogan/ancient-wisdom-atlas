  summary: The passage compares solar illumination with the illumination of the human
    mind by a higher Light, describes the union of Higher Sense with the soul, and
    presents a teaching on divine hierarchies, celestial rulers, fate, and the dependence
    of all things on the One, Matter, and divine Will. It ends by describing God as
    transcendent beyond definite names.
