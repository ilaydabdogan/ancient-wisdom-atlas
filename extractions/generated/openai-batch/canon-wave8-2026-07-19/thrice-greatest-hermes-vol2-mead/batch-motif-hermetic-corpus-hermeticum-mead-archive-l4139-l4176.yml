canonical_text:
  quote: '"thoult find the Path that leads above"'
  summary: The passage describes the Oneness as source of number and unengendered
    by anything else. It contrasts engendered things as imperfect and divisible with
    the Perfect One. Hermes tells Tat that God's Image has been sketched for him;
    if Tat contemplates it with the heart's eyes, he will find the upward path, and
    the Image will become his guide. Divine Sight draws those who open their eyes
    like a magnet draws iron. A note observes that this simile also appears in the
    Naassene Document and in Plutarch's On Isis and Osiris.
  language: English
  quote_policy: quoted
