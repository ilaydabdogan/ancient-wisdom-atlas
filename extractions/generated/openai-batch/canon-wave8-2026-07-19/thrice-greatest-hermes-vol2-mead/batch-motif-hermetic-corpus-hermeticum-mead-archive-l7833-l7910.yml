canonical_text:
  quote: ''
  summary: Mind addresses Hermes concerning the unity of human functions, God's non-inactivity
    and making of all things, the one divine work identified with Life, the Beautiful,
    the Good, and God, God's solitary continual working, One Life in heaven and earth,
    Life as the making-one of Mind and Soul, death as dissolution rather than destruction,
    life withdrawing to the unmanifest, and image-relations among Man, God, Cosmos,
    Aeon, and Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A single human being is described as performing smelling, speaking, touching,
    walking, thinking, and breathing, rather than separate humans performing each
    function.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: The passage states that none of these functions could be apart from God, and
    that if God ceased from them he would no longer be God.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is described as not inactive, perfect, and as making all things.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks Hermes to give himself to the speaker for a little while
    so that Hermes may understand that God's work is one.
  category: speech
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:5
  text: God's one work is connected with all things being made, having been made,
    and going to be made, and is identified with Life, the Beautiful, the Good, and
    God.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hermes is told to observe what occurs when he desires to beget, but the passage
    says this is not like God, because God does not enjoy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: God is said to have no other one sharing in his work; he works by himself,
    is always at work, and is himself what he does.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: If God separated himself from his work or creation, all things would collapse
    and die because Life would cease.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: All things are called lives; Life is one; lives in Heaven and on Earth are
    said to be made by God, and God is identified with that One Life.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Life is defined as the making-one of Mind and Soul, while Death is defined
    as the dissolving of their union, not the destruction of what has been at-oned.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Man is called God's image; Cosmos is called Aeon's image; the Sun is called
    the image of Cosmos; and Man is called the image of the Sun.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: People are said to call change death because the body is dissolved and life
    withdraws to the unmanifest.
  category: sequence
  evidence_refs:
  - ev:10
