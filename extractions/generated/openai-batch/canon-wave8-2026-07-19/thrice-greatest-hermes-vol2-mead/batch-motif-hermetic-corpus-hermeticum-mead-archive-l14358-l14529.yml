  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nature, Sense, and Cosmos are said to possess the power of being born and
    preserving all things that are born.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Either sex is said to be full of procreation, and their union or unity is
    named Eros or Aphrodite, or both.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: From the Universal God of Universal Nature, other things receive the mystery
    of bringing forth, in which Charity, Joy, Merriment, Longing, and Love Divine
    are innate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage describes a generative moment in which one nature pours young
    into another, the other absorbs and hides it, females attain the nature of males,
    and males grow weary with female listlessness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The consummation of the generative mystery is said to be wrought in secret
    so that the deity of either sex is not exposed to vulgar jests or impious sight.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The pious are described as very few, while badness inheres in many through
    lack of Gnosis and Discernment.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ignorance and unknowingness are said to strengthen vice and wound, infect,
