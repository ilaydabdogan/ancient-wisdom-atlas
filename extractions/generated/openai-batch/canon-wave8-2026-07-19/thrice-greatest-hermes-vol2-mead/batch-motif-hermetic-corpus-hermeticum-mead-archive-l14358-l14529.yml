canonical_text:
  quote: ''
  summary: The passage explains spoken words and the divine Name, presents God as
    nameless yet all-named, One and All, fertile in either sex and always bringing
    forth by Will. It extends fecundity to all living and inanimate things, names
    the incomprehensible union of sexes Eros or Aphrodite, treats natural generation
    as a secret divine mystery, contrasts piety and Gnosis with ignorance and vice,
    and describes humans as made from a mixture of divine and less pure cosmic elements
    while the gods are deathless and ordered by law.
  language: English
  quote_policy: summarized
