  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Divinity is said to have shared science and intelligence with men alone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: God made man, after the gods, from an equal mixture of a less pure cosmic
