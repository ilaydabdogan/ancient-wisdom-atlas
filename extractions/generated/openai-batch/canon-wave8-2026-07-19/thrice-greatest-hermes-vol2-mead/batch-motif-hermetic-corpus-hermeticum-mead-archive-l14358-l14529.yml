- id: obs:1
  text: A spoken word is described as sound from air struck by breath, denoting human
    will or higher sense, and serving as a link between voice and ear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Name of God is said to consist of Sense, Spirit, Air, and all things in,
    through, or with them.
  category: attribute
  evidence_refs:
  - ev:1
