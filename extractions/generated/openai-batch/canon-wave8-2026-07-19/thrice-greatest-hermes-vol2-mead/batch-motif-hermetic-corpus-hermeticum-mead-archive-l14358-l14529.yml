    to be unnameable or callable by every name, and to be One and All.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: God is described as alone yet all-complete in the fertility of either sex,
    ever with child of His own Will, and bringing to birth whatever He wills to procreate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: God's Will is identified with All-goodness and the Goodness of all things,
    born from the nature of His Divinity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Asclepius asks whether Trismegistus is speaking of God; Trismegistus answers
