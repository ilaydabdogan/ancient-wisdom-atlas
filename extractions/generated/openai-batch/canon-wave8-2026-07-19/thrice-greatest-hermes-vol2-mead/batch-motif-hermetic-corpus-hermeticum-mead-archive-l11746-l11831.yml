canonical_text:
  quote: ''
  summary: Sections 16-18 state that a few who have a divine ray in the rational part
    are beyond the power of daimons or gods, while the rest are led by daimons through
    soul and body. The passage describes an ordered cosmology in which the intelligible
    world depends from God, the sensible world from the intelligible, the Sun transmits
    God's good or demiurgic operation, and spheres, daimones, and men depend in sequence.
    It concludes that God is the Sire of all and the ceaseless maker whose making
    has neither beginning nor end.
  language: English
  quote_policy: summarized
