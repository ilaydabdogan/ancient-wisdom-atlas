  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Upon the Cry for Light, a Holy Word, described as the Seed of the future Cosmos,
    is dropped into the Heart of Dark-Moist-Fiery-Nature.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Holy Word is described as articulate, reasonable, and ordering; Cosmic
