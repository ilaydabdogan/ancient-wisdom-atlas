  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pervading Light of Supernal Reason orders the Chaotic Elements into Pure
    Fire, Pure Air, and Pure Water-Earth; Nature is said to see the Word in Fire and
    Air and hear him in Water-Earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Shepherd explains that Light is Mind and Mind is God; the Unity of Light
