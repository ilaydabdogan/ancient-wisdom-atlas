canonical_text:
  quote: "“Space, then, is bodiless. But bodiless must either be some godlike thing
    or God [Himself].”"
  summary: Hermes questions Asclepius about motion, arguing that what is moved must
    be moved in something and by something, that the container must exceed the moved,
    and that the mover has greater power. He applies this reasoning to the cosmos,
    described as a vast body that is moved. The space in which the cosmos moves must
    be still vaster and, as the contrary of body, bodiless. Hermes concludes that
    the bodiless is godlike or God, clarifying that by godlike he means the ingenerable
    rather than the generable.
  language: English
  quote_policy: quoted
