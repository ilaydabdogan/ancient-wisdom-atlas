- id: obs:3
  text: The first mental question is how the cosmos came into being.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The answer is described as the changing of the Boundless Presence into sweet,
    joyous Light, causing the seer to lose sight of all things and enter ecstasy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the seer sought Gnosis and Wisdom, including understanding
    and reconciliation of great Opposites.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Within the Infinitude of Light, a Shadow of the Unknown appears to the seer
    as Darkness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Darkness spreads downward in sinuous folds like a Great Snake, with spiral,
