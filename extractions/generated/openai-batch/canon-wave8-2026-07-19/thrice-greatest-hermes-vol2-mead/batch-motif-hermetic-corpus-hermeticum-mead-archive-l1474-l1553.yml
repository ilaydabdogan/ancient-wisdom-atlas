    or Moist Nature.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Moist Nature wails and groans, and the passage explains this as motion
    not yet harmonized.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Primal Undifferentiated or Chaotic Sound develops under the brooding power
    of Boundless Light into thunderings, murmurings, and then a Cry or Voice of Fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage names Darkness, Moist Essence, and Fire as the three most primal
