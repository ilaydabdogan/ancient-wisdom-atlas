canonical_text:
  quote: ''
  summary: 'Commentarial exposition of the Poemandres creation vision: a seer seeking
    Gnosis hears an unseen Presence, encounters the Boundless Presence as joyous Light,
    then Darkness emerging within Light as chaotic serpentine moist matter. The passage
    interprets the scene through images of Great Mother or Primal Matter, wailing
    inchoate nature, Sophia myth, and a Voice of Fire longing for union with the Cosmic
    Word.'
  language: English
  quote_policy: summarized
