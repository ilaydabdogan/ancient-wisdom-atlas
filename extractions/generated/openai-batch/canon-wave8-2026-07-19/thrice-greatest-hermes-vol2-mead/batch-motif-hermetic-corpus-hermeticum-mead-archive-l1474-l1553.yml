    Nature, the Great Mother, and God, the Father of the worlds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seer is described as conscious of a Presence that is felt and heard rather
    than visually seen, speaking Mind to mind.
  category: relationship
  evidence_refs:
