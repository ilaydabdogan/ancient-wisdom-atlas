  summary: The passage describes the post-mortem fate of impious souls, the soul's
    imprisonment through bodily attachment, the loss or confusion of true philosophy,
    the definition of pure philosophy as piety and gnosis of divinity, cosmic order
    as harmony with God's song, and a brief cosmological account of God, Matter/Cosmos,
    Spirit, and self-generating fecundity.
