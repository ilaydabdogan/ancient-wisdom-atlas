canonical_text:
  quote: '"Come unto us, for we are thy fellow-members. We are all one with thee."'
  summary: The passage describes a perfected person reaching the consummation of earthly
    pilgrimage, receiving heavenly investiture, and entering a final initiation in
    which purified personalities unite as powers of a New Man or Son of Man. It then
    describes the Shepherd as Christ of God and Son of the Father, able to assume
    all forms to carry out the Divine Will, and compares this state with Christian
    Christ-language and Buddhist Buddhahood, especially the three bodies and the Body
    of Transformation.
  language: English
  quote_policy: quoted
