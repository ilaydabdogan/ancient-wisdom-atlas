canonical_text:
  quote: ''
  summary: The passage compares Hermetic material with Valentinian Christian Gnostic
    traditions, including a report of Valentinus questioning a newborn babe who identifies
    itself as the Logos and a Valentinian psalm describing dependencies among Spirit,
    Soul, Air, Aether, Deep, Womb, and Babe. It then discusses Hermetic sermons on
    Fate, Providence, Necessity, and Justice, and closes with a doctrinal claim that
    Matter and Body are divine energies, supporting pan-monism rather than essential
    dualism.
  language: English
  quote_policy: summarized
