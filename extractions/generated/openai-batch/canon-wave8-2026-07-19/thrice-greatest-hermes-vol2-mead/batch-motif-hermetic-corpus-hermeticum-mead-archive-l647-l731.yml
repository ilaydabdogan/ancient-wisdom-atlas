canonical_text:
  quote: ''
  summary: 'The passage describes a visionary cosmogonic scene: a Holy Word or Logos
    descends from the Light onto Nature; Fire and Air rise from Moist Nature while
    Earth-and-Water remain mingled; Man-Shepherd explains the identities of Light,
    Mind, and Logos, instructs the narrator to understand the Light, and later explains
    a vision of Light, Powers, Cosmos, subdued Fire, and the Archetypal Form. The
    elements are said to come from the Will of God.'
  language: English
  quote_policy: summarized
