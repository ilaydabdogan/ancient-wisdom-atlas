canonical_text:
  quote: ''
  summary: Hermes and Tat discuss rebirth, in which the Ten Powers drive out the Twelve
    torments of Darkness, bodily perception is replaced by perception in Mind, and
    the reborn one is described as divine and untouched by death. Tat asks for the
    secret hymn of rebirth, and Hermes gives ritual directions before invoking the
    whole cosmos to receive praise of the One and All.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Upon Truth's coming, Envy is said to have gone away, while Good, Life, and
    Light are joined to Truth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Torments of the Darkness are described as no longer approaching and as having
    fled after being vanquished.
  category: action
  evidence_refs:
  - ev:1
