  text: Hermes says the manner of Rebirth is known when the Ten comes and drives out
    the Twelve, completing the birth in understanding.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hermes says that one who gains Birth in God abandons the body's senses, knows
    himself as Light and Life, and is filled with bliss.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tat says he no longer looks with ordinary eyesight but with the energy given
    by Mind through the Powers.
  category: speech
  evidence_refs:
  - ev:3
