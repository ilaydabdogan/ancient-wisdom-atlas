canonical_text:
  quote: Mind counteracting it doth work good on the soul, as the physician health
    upon the body.
  summary: The passage explains that Mind benefits the soul by counteracting evil
    impulses. Souls without Mind as pilot follow irrational desires. God has set Mind
    over passions and irrational desires as judge and executioner. Tat questions how
    punishment can be justified if evil deeds are fated. Hermes replies that all bodily
    works occur by Fate, and that suffering for wrongdoing is also fated. He then
    distinguishes between men led by reason and unreasoning men, saying all are subject
    to Fate, genesis, and change, but reason-led men do not suffer bad because they
    are freed from viciousness.
  language: English
  quote_policy: quoted
