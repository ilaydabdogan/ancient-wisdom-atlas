canonical_text:
  quote: ''
  summary: 'The passage describes a Hermetic cosmological sequence: within a World-Egg
    encircled by a Mighty-Power, cosmic elements develop after the Logos descends
    into disorder. A Second Outpouring of Mind appears as Light and Life, Male-Female,
    and as an Enforming Mind or Demiurge that ensouls ordered elements. The Mighty
    Power marks a cosmic boundary, the Ordering Mind differentiates into seven spheres
    connected with soul-fashioning and Fate, and the passage explicitly states a repeated
    pattern of descent followed by ascent. Nature then develops physical elements
    and irrational lives, and the fragment ends as a Third Outpouring, the descent
    of Man, begins.'
  language: English
  quote_policy: summarized
