canonical_text:
  quote: ''
  summary: The passage describes Eternity as beginningless, unceasing, spherical,
    and revolving into itself, with good and bad issues mingled in cosmic things.
    The speakers end a sacred discourse, leave a holy place, orient themselves for
    prayer, reject material offerings of incense and unguents as unnecessary for God,
    and offer thanksgiving for gnosis, divine light, consecration to Eternity, and
    continuing knowledge of God before going to a pure fleshless meal.
  language: English
  quote_policy: summarized
