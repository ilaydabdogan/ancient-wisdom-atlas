canonical_text:
  quote: ''
  summary: 'The passage comments on Gnosis as a transformative understanding: the
    Christ or true devotee bears all things, sees Good and God in all, and transmutes
    evil into good. It states that each human contains a material and a spiritual
    “man,” describes evil as a process of becoming good, and presents the world-process
    as God making all things like himself through the Cosmic Course, ending in union.
    Cosmos is described as Logos, Good Gardener of Life, Mother and Father, Son of
    God, and God’s very self. The passage argues that God can be known through sense
    and thought because God is all things, and compares this doctrine with a passage
    from the “Perfect Sermon” and, in a note, with Sabæan Gnosis.'
  language: English
  quote_policy: summarized
