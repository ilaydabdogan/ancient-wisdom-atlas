canonical_text:
  quote: ''
  summary: The passage describes intercourse among souls, a hierarchy of God, Cosmos,
    gods, humans, and irrational creatures, and a dispensation flowing through Mind.
    It distinguishes the Good Mind from a service mind, states that souls filled with
    Mind are blessed while mind-empty souls cannot truly act or understand, and concludes
    with claims about true man’s divine status and ascent to heaven without leaving
    earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Souls of gods are said to have intercourse with souls of men, and souls of
    men with souls of creatures that possess no reason.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The higher are said to have charge of the lower: gods look after men, men
    after irrational animals, and God has charge of all.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cosmos is subject to God, man to Cosmos, and irrationals to man; God is over
    all and contains all.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: God’s rays are described as energies, the Cosmos’s rays as natures, and man’s
    as arts and sciences.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Energies act through the Cosmos, nature-rays through the elements, and man
    acts through sciences and arts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dispensation of the universe depends from the nature of the One and pervades
    all things through Mind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mind is described as a means for at-oning men to gods and gods to men, and
    is called the Good Daimon.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: A soul most filled with Mind is called blessed, while a soul empty of Mind
    is called wretched.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tat asks Hermes what he means, and Hermes distinguishes the Good Mind from
    a service mind sent down for the soul’s chastisement.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A soul without mind is said to be unable to speak or act; when mind leaves
    the soul, the soul neither sees nor understands and is like a thing without reason.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mind does not endure a sluggish soul and leaves such a soul tied to the body
    and bound by it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A soul without Mind is said not to be called a man; true man is described
    as a divine thing of life measured with heavenly gods.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says true man is higher than the gods, or at least equal in power
    with them.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Gods in heaven do not come down to earth over heaven’s limit, while man mounts
