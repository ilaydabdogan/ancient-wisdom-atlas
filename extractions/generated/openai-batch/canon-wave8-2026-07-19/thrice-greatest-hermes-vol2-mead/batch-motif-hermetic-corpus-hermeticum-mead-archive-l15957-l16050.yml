canonical_text:
  quote: "“there is naught without the interblend of Order.”"
  summary: Asclepius asks Trismegistus about the place of Heimarmene or Fate. Trismegistus
    defines Fate as the necessity affecting born things and explains a sequence in
    which Fate gives beginnings, Necessity compels ends, and Order arranges and preserves
    the structure of things. These three are said to be effected by God's Will and
    to function as instruments of Eternal Reason rather than through wrath or favour.
  language: English
  quote_policy: quoted
