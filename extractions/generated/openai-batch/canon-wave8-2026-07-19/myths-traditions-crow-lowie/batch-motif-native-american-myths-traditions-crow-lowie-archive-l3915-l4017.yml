canonical_text:
  quote: ''
  summary: 'The range ends one tale in which a boy remains in a tree because a calf
    is tied below him, then kills two men, goes above, becomes the Morningstar, and
    is said to be absent in early spring until animals have young. It then begins
    the tale of Lodge-Boy and Thrown-Away: a hunter’s pregnant wife is repeatedly
    visited by a woman who eventually kills her, removes and separates two unborn
    boys, one behind a lodge curtain and one into a spring. The father later discovers
    the curtain child, and the curtain child meets the spring child.'
  language: English
  quote_policy: summarized
