canonical_text:
  quote: ''
  summary: A young woman follows a man through repeated stopping places marked by
    smoke, shelters, roasted meat, and water. At first they eat, drink, and sleep
    separately; at the fourth stop he invites her to sit by him, eat and drink with
    him, and sleep with him, saying that if she is powerful he will marry her. They
    reach his camp, where he is identified as Worms-in-his-face. His mother receives
    the woman. The woman later sees that her husband has no nose and worms come from
    the hole in his face. He hunts a buffalo bull and orders his wife to tan and quill-embroider
    the hide in one day for a blanket. When she cries over the impossible task, a
    badger and other animal and insect helpers come and begin preparing the hide.
  language: English
  quote_policy: summarized
