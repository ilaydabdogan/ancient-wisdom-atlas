canonical_text:
  quote: ''
  summary: Spotted-rabbit learns songs from a clansman, attracts married women, publicly
    dresses and dances with his horse while other men resent him, then goes against
    a dangerous Sioux enemy during a horse-stealing raid and is killed. Two-faces
    makes medicine and helps in the killing of the Sioux. Spotted-rabbit’s mother
    retrieves and transports his unburied body, while women mourn and cut themselves;
    later she confronts men who had wished to kill him by asking whether Spotted-rabbit
    or his horse was better.
  language: English with Crow song text and English translations
  quote_policy: summarized
