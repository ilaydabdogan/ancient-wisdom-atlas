canonical_text:
  quote: ''
  summary: The passage contains the end of one Crow buffalo tale and a second buffalo
    tale. In the first, a man pursued by a buffalo takes refuge in a tree while the
    buffalo attacks the tree, rolls in dust and colored substances, then leaves and
    appears through a sequence of painted horse forms before becoming a buffalo again.
    In the second, a hunter shoots a buffalo, is injured by it in a washed-out trail,
    then sees a painted rider associated with buffalo regalia perform against rocks
    that become people; afterward the man’s pain ceases, the figure becomes a buffalo
    and vanishes, and the event is linked to a named medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first tale segment, the man flees from a buffalo through a cliff area,
    a cleft in the rocks, a creek or riverbank, and finally climbs a tree hanging
    over the water because the bank is too high to jump.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo comes to the tree, hooks it repeatedly, rolls in the dirt, and
    causes red paint, then dirt, then white clay to fly up; the man’s arrow glances
    off the buffalo, and he cries and begs for mercy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After leaving the tree, the buffalo or animal form is described with white-painted
    eyes and a buffalo tail around its neck, then appears through roan, black, bay,
    and gray horse forms before becoming a buffalo again on a hilltop.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the second tale, a hunter shoots a buffalo; the buffalo paws the ground,
    hooks dirt over the man in a washed-out trail, licks off his shirt and skin until
    blood runs, and urinates on him with a burning effect.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wounded man then sees a singing rider on a black horse painted with white
    clay; the rider’s face is painted with white clay, and he wears or carries buffalo-associated
    regalia including a horned cap, spear, tail, shirt, and shield.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rider charges rocks that shoot at him and emit smoke; he strikes or stabs
    them, and at one point the rocks become people. The rider says, “This is the way
    I am,” and asks the Crow man whether he saw him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the rider departs, the sore on the Crow man’s back no longer hurts;
    the horseman is said to change into a buffalo, the buffalo vanishes near the place
    where a buffalo had died, and the man thinks he has seen the ghost of the dead
    buffalo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that the medicine belongs to Shows-a-fish and Knows-his-coups.
  category: relationship
  evidence_refs:
  - ev:8
