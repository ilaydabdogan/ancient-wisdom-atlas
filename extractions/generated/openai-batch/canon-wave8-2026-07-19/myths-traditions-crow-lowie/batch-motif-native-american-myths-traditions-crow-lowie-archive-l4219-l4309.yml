canonical_text:
  quote: ''
  summary: Two brothers confront and kill a dangerous buffalo, later kill Red-woman
    using her digging-stick and burn her shelter. Their mother then warns them about
    a dangerous white tipi. Spring-boy goes toward it, exchanges eyes with a jack-rabbit,
    receives advice from Old-Man-Coyote to sit on a flat stone, and enters a tipi
    inhabited by snakes, where the stone prevents snakes from entering his body while
    storytelling proceeds.
  language: English
  quote_policy: summarized
