canonical_text:
  quote: ''
  summary: A young man whose face was burned in childhood leaves camp for the mountains
    to seek a vision and relief from his disfigurement. After encounters at supernatural
    tipis that redirect him, he reaches a high hill where an eagle promises help in
    exchange for aid against a lake-dwelling threat to the eagle’s young. A spirit
    warns him not to drink from water, a bear carries him onward, the eagle washes
    him with supernatural rain so he can speak with the Sun, and a little bird instructs
    him how to address the Sun. The segment ends as he is sent to a riverside place
    where four ducks are present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy falls into fire while playing and burns his face; as an adult, one side
    of his face remains disliked by him while the other side is described as good-looking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man stays inside his tipi and paints his face whenever he goes out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He asks his mother to make many moccasins because he wants to go away; his
    father supports the request, and his mother makes them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: He leaves camp, goes to the mountains, makes a shelter among pines, hangs
    meat and moccasins from poles, and goes out for a vision.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a big white tipi, he sees many kinds of medicine tied to curtain-strings;
    when offered medicine, he says he hates one side of his face, and the speaker
    sends him farther into the mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a second place, tipi occupants ask what he is trying for; after he says
    he hates one side of his face, they also tell him to go farther.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At a third place below and on a high hill, an eagle circles down, sits beside
    him, asks why he is crying, and promises to come to his shelter and tell him things.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eagle states that he will help the young man if the young man helps him
    with a lake-island nest where something from the lake eats his young; the nest
    contains two eggs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the young man approaches clean water to drink, a spirit tells him not
    to drink it, and he jumps across.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A bear says he has been waiting for the young man, tells him to get on his
    back, and carries him toward the place shown by the eagle.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The eagle says the bear is dangerous, says the Sun will speak to the young
    man, and washes him by making rain fall without visible clouds so he can talk
    to the Sun.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: A little bird tells the young man to say to the Sun, “You love your son,”
    and then tell the Sun his troubles.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: At sunset the Sun turns to the young man and says he will run four times and
    then reach the Sun’s place.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The little bird says they are waiting for the young man by the river; he goes
    there, and four ducks are present at the place.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
