canonical_text:
  quote: ''
  summary: After made buffalo disappear, Ci'rape' finds their den in rocks and two
    men follow the herd to another land inhabited by giants who use buffalo as horses.
    The visitors eat buffalo, defend the giants from bird enemies, and later bring
    buffalo back through a tunnel to earth. The passage then explains buffalo-hide
    preparation, tipi construction, foods, weapons, winter coverings, horses, parfleches,
    ropes, and moving camp, including a medicine man's predictions about whites and
    future tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The made buffalo disappear; the people decide to search for them, and Ci'rape'
    finds their den in rocks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two men make many moccasins and follow buffalo tracks for three or four days.
  category: action
  evidence_refs:
