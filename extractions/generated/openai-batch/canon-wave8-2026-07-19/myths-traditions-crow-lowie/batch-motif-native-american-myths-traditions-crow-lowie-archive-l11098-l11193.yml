- id: obs:3
  text: The pursuers see light ahead and follow the buffalo to another land containing
    a big camp of giants.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The giants call the buffalo their horses, offer the visitors animals from
    the herd, and show disgust while the visitors prepare and eat buffalo meat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Every creature on earth except buffalo is described as an enemy of the giants;
    attacking creatures cause the giants to retreat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Small birds can kill the giants with the least scratch; the little people
    use clubs to kill birds and drive them back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the bird fight, the giants fear the little people, carry them rather
    than let them stand on the ground, and warn one another not to offend them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A herd is driven to the hole, and the two men bring buffalo back through a
    tunnel to the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women prepare buffalo hides using brain, liver, fat, scrapers, boiled water,
    wringing, rubbing, and sewing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A woman goes to the mountains with her husband, who captures horses in a big
    lake; she prepares poles, sews hides, adds pegs, streamers, buffalo tails, and
    a stepladder to make a tent form later used by the Crow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man described as medicine names plant foods and foretells future bearded
    people who will provide harder tools and a tubular weapon; he also describes a
    bow and arrow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Buffalo hides are used for cold-weather curtains and comforters; horses multiply;
    parfleches and ropes are devised; a chief announces that the camp will move to
    hunt buffalo.
  category: sequence
  evidence_refs:
  - ev:7
