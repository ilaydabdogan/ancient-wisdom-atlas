candidate_motifs:
- id: motif:1
  label: animal-led ascent to a celestial spouse
  taxonomy_refs:
  - ascent
  - stolen_beloved
  basis: The youngest Hidatsa woman follows a porcupine up a tree until she reaches
    near Sun, who takes her from earth to his sky tipi.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explicitly state whether the porcupine acts intentionally
    on Sun’s behalf.
- id: motif:2
  label: celestial-earthly marriage and birth of a child
  taxonomy_refs:
  - sacred_marriage
  - divine_parent_child
  basis: Sun and Moon plan marriages with earthly or nonhuman women; Sun’s Hidatsa
    wife gives birth to a boy whose father is Sun.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage presents the marriage narrative plainly and does not elaborate
    ritual or theological meanings.
- id: motif:3
  label: food contest between rival wives
  taxonomy_refs: []
  basis: The Hidatsa woman and Frog are tested by eating boiled buffalo guts in the
    dark; Frog attempts to fake eating by chewing bark, and Moon rejects her as a
    poor eater.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy reference closely matches this contest.
- id: motif:4
  label: broken prohibitions reveal hidden origin and route home
  taxonomy_refs:
  - forbidden_knowledge
  basis: Sun forbids meadowlark shooting and turnip digging; after both are violated,
    the boy and mother learn about the place below, which the mother identifies as
    her place of origin.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not say the prohibitions were given specifically to conceal
    the earth below, though the events are sequenced that way.
- id: motif:5
  label: descent from the sky by rope
  taxonomy_refs:
  - return
  basis: The mother obtains a spider-made sinew rope, opens the sky-hole, and climbs
    down with the boy toward the earth, but the rope is too short.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The available taxonomy has no exact “sky descent by rope” label; “return”
    is used because the mother calls the lower world the place she came from.
- id: motif:6
  label: punitive stone sent from above
  taxonomy_refs:
  - divine_judgment
  basis: Sun shapes a stone, speaks to it, and sends it down to kill the escaping
    woman while sparing the boy.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The act is punitive in sequence, but the passage does not explicitly frame
    it as judgment.
- id: motif:7
  label: surviving celestial child taken in by old woman
  taxonomy_refs:
  - miraculous_child
  basis: After his mother is killed, the boy survives, remains by the corpse, and
    is later caught, fed, and kept by an old woman.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage identifies divine parentage and survival but does not yet
    describe later heroic deeds within this line range.
- id: motif:8
  label: child’s identity tested by choice of gendered objects
  taxonomy_refs: []
  basis: The old woman sets out a ball, shinny stick, bow, and arrow to learn whether
    the child is a boy or a girl; his choice of bow and arrows identifies him as a
    boy.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No supplied taxonomy reference closely matches this recognition test.
