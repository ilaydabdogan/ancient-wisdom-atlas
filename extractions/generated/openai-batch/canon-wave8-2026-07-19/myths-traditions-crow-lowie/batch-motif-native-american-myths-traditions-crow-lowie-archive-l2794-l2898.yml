canonical_text:
  quote: ''
  summary: 'The beginning of the Crow hero tale “Old-Woman’s-Grandchild”: Sun takes
    a young Hidatsa woman to the sky after she climbs after a porcupine; Moon receives
    a frog woman. After an eating test, Sun’s wife bears a son. Sun forbids the mother
    and child to dig wild turnips or shoot meadowlarks, but both prohibitions are
    broken, revealing a view back to the earth below. The mother has spider make a
    sinew rope and tries to descend with the child through a sky-hole, but the rope
    is too short. Sun kills the woman with a stone, while the boy survives and is
    later caught and kept by an old woman near a garden.'
  language: English
  quote_policy: summarized
