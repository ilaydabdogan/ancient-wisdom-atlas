canonical_text:
  quote: ''
  summary: The passage continues a tale in which a boy moves through sky camps of
    bird-people to find his captive brother, who is to be eaten by Long-arm and the
    black eagles. The rescuer confronts and kills Long-arm, burns him, sends the birds
    down to earth, returns home through a sky-hole by means of arrows, and the family
    becomes celestial bodies. The passage then begins another tale about a hunter,
    his pregnant wife, a child speaking from the womb, and a two-faced visitor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman tells the boy that Long-arm brought a captive boy from earth through
    several camps where medicine was made, and that the captive will be eaten at the
    fourth camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy asks whether he may obtain a piece of the captive to eat or at least
    look on, and he is told that only prominent people may eat but that he may follow
    people going there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the second camp, an old woman is making parfleches, feeds the boy, and
    allows him to continue toward the place of eating; the people in this camp are
    storks.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the third camp, an old woman is dressing a skin, says people are going
    to eat the person brought from earth, and the camp people are eagles.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the fourth camp, the people are black eagles and Long-arm is their chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large crowd gathers around Curtain-boy, who is breathing hard as if in pain,
    and a young man lifts the rescuer so he can see him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Curtain-boy recognizes Rattling-head, asks why he waited so long, and says
    he has been suffering for a long time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Long-arm has his arms wound around Curtain-boy so that only the captive's
    head shows, refuses to release him, and threatens to eat the rescuer too.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rattling-head rubs his bow and arrows so that they become good ones, shoots
    a stone so that blood is seen coming from it, and then shoots Long-arm twice,
    killing him.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: After Long-arm dies, Spring-boy orders wood brought to burn him and commands
    the birds from all four camps to come down to earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narration explains that birds are on earth instead of in the sky because
    Spring-boy told the bird camps to come down.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The rescuer takes his brother homeward; at the sky-hole he lends Curtain-boy
    two arrows and descends himself on two arrows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The brothers tell their parents that they had a hard time above.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: 'The sons arrange for the family to live forever: their mother becomes the
    moon, their father the morningstar, Curtain-boy the last star in the Dipper, and
    Spring-boy the eveningstar.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the next tale, a man leaves camp with his pregnant wife and family, goes
    hunting, and tells his wife not to answer anyone who comes to the rear of the
    lodge.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: The child in the woman's womb speaks in the Hidatsa language, identifies the
