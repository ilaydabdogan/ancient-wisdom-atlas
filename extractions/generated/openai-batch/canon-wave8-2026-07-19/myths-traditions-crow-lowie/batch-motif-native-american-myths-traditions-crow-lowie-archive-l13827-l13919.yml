canonical_text:
  quote: Thus they found each other.
  summary: A Hidatsa war party encounters a camp identified as Crow through speech,
    material culture, and remembered traditions about separated relatives; the groups
    recognize kinship, intermarry, exchange horses and agricultural goods, and maintain
    relations. A brief clan-origin account explains the name U'wutace through Old-Man-Coyote's
    instruction to marry and an orphan boy's greasy spittle falling into a fire. The
    passage then begins a peace tradition in which a Crow camp is destroyed and captives
    are taken.
  language: English
  quote_policy: quoted
