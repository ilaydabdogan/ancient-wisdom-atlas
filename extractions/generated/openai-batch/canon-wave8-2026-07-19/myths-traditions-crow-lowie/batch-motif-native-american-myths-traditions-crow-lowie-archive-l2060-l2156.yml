canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Old-Man-Coyote gives and
    then reclaims a blanket from a rock, is pursued by the animate rock, deceives
    several animals into fighting it, and is saved when a small night bird shatters
    the stone, explaining the scattering of medicine-stones. It then gives a tale
    in which Old-Man-Coyote joins painted geese in flight, falls into a camp, escapes
    while being plucked, and transforms into a wolf. A following tale begins with
    hungry Old-Man-Coyote visiting Owl chief, whose wife prepares bark that becomes
    meat after grease flows from Owl's pierced eyes.
  language: English
  quote_policy: summarized
