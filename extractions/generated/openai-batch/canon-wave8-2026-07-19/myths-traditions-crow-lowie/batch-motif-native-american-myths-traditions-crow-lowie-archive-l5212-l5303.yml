canonical_text:
  quote: ''
  summary: A young woman who is married to the Sun takes a young human lover and reveals
    her marriage to him. The Sun becomes angry, withdraws game animals, and threatens
    starvation for the people. The community hunts unsuccessfully, eats dogs, and
    moves. A poor young man, later called an orphan, performs rites involving fat
    thrown into fire and seven buffalo chips carried by a sexually inexperienced young
    man; the next morning seven buffalo are found where the chips had been placed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl had been married to the Sun before the day she was kissed by the
    boy; the Sun later saw his wife asleep with someone else, became angry, and went
    out.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy secretly entered the girl's lodge, slept with her, and repeatedly
    asked about a secret she had not previously disclosed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young woman told the young man that she had been married to the Sun for
    three winters and three summers and warned that the Sun wanted to do something
    to both of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man said he did not care about the Sun and claimed to be greater
    than the Sun; the young woman warned him not to say that.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Sun confronted his wife, said he would give trouble to the Crow Indians,
    and went away taking grouse, deer, and other game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hunters found no game, the people ate their dogs, and the camp moved away;
    the young man and the young woman knew the cause of the trouble but did not tell
    the others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young woman rode back toward her husband, met the Sun, and heard him say
    he would make the people starve except perhaps one or two; she then found her
    husband sleeping, awakened him, and brought him home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At a council, a cunning man said that the Sun, Morningstar as printed, or
    Old-Man-Coyote had given the people trouble and identified the woman and young
    man as the cause of the trouble.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The people moved toward the mountains where grouse stay; after they moved,
    the young man was left behind, walked with a stick as a cane during a snowstorm,
    and reached the campsite where his wife had saved a corn ball for him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man asked the crier to get him a little fat; none was found until
    a child was found to have some guts with fat in a quiver.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people piled up firewood and burned it; the young man divided the fat
    into four balls, threw them one at a time into the fire, and ordered the young
    men to shout as the fire rose higher each time, reaching the heavens on the fourth
    time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man sang a song of joy after the fire rose into the heavens, while
    the snowstorm was still continuing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young man told the women to dig up seven buffalo chips, had the tipi swept
    clean, made seven buffalo tracks inside it, and asked the herald to find a young
    man who had not yet known a woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sexually inexperienced young man carried the seven buffalo chips to the
    first hill and left them apart; before sunrise he returned and saw seven buffalo
    lying there.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: A source note says the narrator stated that the people in the story were Hidatsa.
  category: other
  evidence_refs:
  - ev:8
