canonical_text:
  quote: ''
  summary: A boy is directed by snakes to a white tipi full of snakes, protects himself
    with a flat stone, tells stories that put the snakes to sleep, and kills all but
    one. The surviving snake later attacks him while he sleeps. The boy endures bodily
    dismemberment, uses rain, wind, and the Sun's heat to force the snake out, grinds
    down its face, and the story explains why snakes bite only sometimes. The boy
    becomes the Morningstar. A second tale begins with a woman climbing a tall ash
    tree after a porcupine until she reaches the sky, where a young man marries her.
    Their fast-growing son receives prohibitions about meadow larks, breaks one by
    shooting a bird, and is told he belongs elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy hunting on a path encounters two snakes, who address him as brother
    and direct him to a big white tipi containing many snakes with their heads on
    sticks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy brings a flat stone, sits on it, and a snake attempting to enter his
    anus strikes the stone instead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The snakes ask the boy to tell stories learned from his grandmother; his stories
    about sleep-inducing conditions put successive quarters of the snakes to sleep
    until all are asleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the snakes are asleep, the boy cuts off the heads of all but one; the
    surviving snake escapes into the ground and warns against sleeping in the daytime.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Later the boy becomes sleepy on a high hill, sets four arrows around himself
    as watchers, and sleeps while the surviving snake approaches.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The arrows fall or strike him one by one; he wakes when the fourth hits his
    face, as the snake crawls into him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy breaks himself in two at the waist, plays dead, and eventually only
    his skull remains while the snake is still inside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy causes rain, wind, and more rain; Moon tells Sun of the boy's long
    suffering, and the boy prays for Sun to make it very hot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sun comes close to earth and makes water boil in the hole, causing the snake
    to put out its head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boy seizes the snake, grinds its face below the eyes on stones, releases
    it after it promises to be good, but the snake says it will bite once in a while.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The tale gives this as the reason snakes bite only once in a while.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy becomes the Morningstar, absent in summer and present in winter mornings.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Two women sit under a tall ash tree making and quill-embroidering moccasins;
    one sees a porcupine in the tree and climbs after it.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The porcupine keeps moving farther away as the woman climbs until the other
    woman can no longer see her and she reaches the sky.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: On the other side of the sky, the land resembles earth but has good water
    and better conditions; the woman sees a large tipi.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: A young man inside the sky tipi says he sent for the woman and wants to marry
    her; she stays, becomes pregnant, and bears a boy who grows larger every morning.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The father makes the boy a bow and arrows, warns him that the meadow larks
    speak his language, and forbids him to shoot them; he also tells his wife never
    to move buffalo chips.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: A meadow lark sits on the boy while he is hunting, injures his eyes with its
    wings, and the boy shoots it despite the warning.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: The shot meadow lark tells the boy that he does not belong there and should
    go where he belongs; the boy cries and later asks his father why the bird said
    this.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:20
  text: The next morning, after a buffalo hunt, the woman pours water on the hide,
    folds it, and lays it in a certain place.
  category: action
  evidence_refs:
  - ev:13
