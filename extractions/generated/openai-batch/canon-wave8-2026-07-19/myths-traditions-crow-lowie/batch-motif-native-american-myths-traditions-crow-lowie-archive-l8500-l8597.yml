canonical_text:
  quote: ''
  summary: A young man raised by parents who are later shown not to be his real parents
    shoots at a raven despite warning and learns from it that he is a person of the
    earth. He later sees his foster mother transform into an owl, after which the
    parents decide to send him home. He receives raven feathers and instructions for
    a journey involving buffalo offerings to old women, who give him stones, wood,
    advice, and food instructions for an encounter with three young women and dangerous
    dogs identified as a tiger and a bear.
  language: English
  quote_policy: summarized
