candidate_motifs:
- id: motif:1
  label: Theft of summer and negotiated seasonal division
  taxonomy_refs:
  - sacred_theft
  - seasonal_cycle
  basis: Summer and winter are kept in bags; Old-Man-Coyote steals the Summer bag
    with animal helpers, and the conflict ends with each country having summer for
    half the year.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage is an abstract and does not describe ritual or cosmological
    context beyond the seasonal arrangement.
- id: motif:2
  label: Trickster transformations and etiological alteration of animals
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: Old-Man-Coyote transforms into an elk, larger dogs, and Sun; he also causes
    geese to have long necks by pulling one goose's neck.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The abstract groups several separate Old-Man-Coyote episodes, so each
    transformation belongs to its own narrative context.
- id: motif:3
  label: Trickster deception involving food and bodily inversion
  taxonomy_refs:
  - trickster_boundary
  basis: Old-Man-Coyote cooks buried bears, turns food-bodied men into soup, is cheated
    out of the soup by his comrade, and retaliates physically.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The abstract is compressed and refers elsewhere for part of the conclusion,
    so the full episode is incomplete here.
- id: motif:4
  label: Animal-wife marriage in an underwater dwelling with taboo violation
  taxonomy_refs:
  - shapeshifter
  basis: The Otter Sisters are transformed otters who take a human husband to an underwater
    tipi; one wife warns him not to use a bad name and leaves in otter form after
    he does so.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: No taxonomy item exactly names animal spouse or taboo-wife tales; shapeshifter
    is used because the passage explicitly states transformation.
- id: motif:5
  label: Medicine received through animal affinal relationship
  taxonomy_refs:
  - sacred_exchange
  basis: The otter father-in-law gives instructions for a scalplock tied with otterskins,
    and the young man returns as chief and healer.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The exchange is affinal and medicinal in the abstract, but the term sacred
    is not used in the passage.
- id: motif:6
  label: Woman carried off by animal husband and recovered with animal aid
  taxonomy_refs:
