canonical_text:
  quote: ''
  summary: An appendix gives brief abstracts of several Crow tales recorded by Mr.
    Simms, including Old-Man-Coyote episodes, the Otter Sisters, the Buffalo Husband,
    and the Stump-horn and the Bladder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The appendix states that the following items are brief abstracts of stories
    recorded by Mr. Simms and appended for comparative material.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one Old-Man-Coyote tale, winter is local and summer is in the south; a
    woman keeps both summer and winter in bags.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old-Man-Coyote recruits deer, coyote, jack-rabbit, and wolf, turns himself
    into an elk, and the Summer bag is stolen and carried homeward by the helpers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pursuers and thieves reach an agreement that each country will have summer
    for half the year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old-Man-Coyote imitates bears burying each other, has himself released by
    whistling, then buries the bears, builds a fire, cooks them, and ignores their
    whistling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old-Man-Coyote meets four men whose bodies are made of fat and other food,
    transforms into increasingly large dogs, bites them, and knocks them into a lake
    bed where they become soup.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Old-Man-Coyote's comrade drinks all the soup while Old-Man-Coyote is away
    getting a spoon, flees, and is later punished by Old-Man-Coyote.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old-Man-Coyote protects Sore-Tail in war, transforms himself into Sun, directs
    face-painting with bright red circles, and enemies are killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old-Man-Coyote gives power to White Robe in a vision and lengthens night by
    splicing it with White Robe's shield so White Robe can reach camp before daybreak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Old-Man-Coyote wrings the necks of geese crossing a lake, but elongates the
    last goose's neck by pulling; the passage explains this as the origin of long
    goose necks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Otter Sisters tale, a rich young man encounters two beautiful women
    who are long otters with fine fur transformed to ensnare a husband.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The otter women force the young man through an air hole, where he finds himself
    in a tipi under water and marries them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The otter father-in-law receives meat from a buffalo hunt and instructs the
    man to plait his scalplock and tie it with otterskins so he can disappear underground
    when threatened.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The young man returns to his people, is made chief, and cures wounded warriors
    at water with his medicine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: One otter wife has a boy child and warns her husband not to call her a bad
    name; after he does so, she becomes an otter and leaves him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the Buffalo Husband tale, a chief's daughter promises to marry a buffalo
    skull, and the buffalo carries her off.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The woman's human husband, aided by moles, seizes her and takes her away underground
    while buffalo pursue them down a river.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The fleeing couple climb a tree; the woman urinates on the last buffalo and
    is discovered; a night-hawk advises shooting the buffalo leader, which scatters
    the buffalo.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: In the Stump-horn and the Bladder tale, two poor boys obtain an elk stump-horn
    and bladder, marry the chief's daughters, and later provide meat by driving buffalo
    into a corral.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: The boys' medicines are stars enclosed in the bladder, which come out and
    perform required deeds, including appearing as warriors who defeat enemies.
  category: object
  evidence_refs:
  - ev:12
- id: obs:21
  text: The keeper of the bladder disappears with the medicine into the sky, where
    he belonged and was formerly a big star.
  category: sequence
  evidence_refs:
  - ev:12
