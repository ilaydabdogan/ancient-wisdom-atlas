canonical_text:
  quote: ''
  summary: A woman described as one-eyed and unattractive says she will marry a handsome
    young man and is mocked. Hu'arawic, also named Comes-all-the-time or Coming-all-the-time
    in the passage, visits her shelter, eats with her, refuses other women, marries
    her, and has a son. After years away from his own band, five comrades come to
    bring him home. They find him dirty, poorly dressed, unresponsive, and holding
    the baby. Using his blanket, flute, incense, songs, and whistling to the four
    directions, they restore him to his senses. He expels unwanted material from his
    mouth, washes, dresses well, receives gifts, and returns home; the woman runs
    away and is said to have man-bewitching power.
  language: English
  quote_policy: summarized
