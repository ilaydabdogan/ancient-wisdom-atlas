canonical_text:
  quote: ''
  summary: Two mischievous brothers are inside a bad buffalo that has swallowed many
    people. They perform a dance beneath its heart, cut off its heart and kidneys,
    kill it, cut through its ribs, and lead the swallowed people out. Later one brother
    has stones sewn into his head so it rattles, frightening his mother as a prank.
    After their father warns them not to separate, Spring-boy is taken up to the sky
    by Long-arm. Curtain-boy tracks him to a knoll, sees a hole in the sky, shoots
    an arrow at it, climbs into the sky, and passes through camps of raven, crane,
    white-hawk, and eagle people while asking old women about the captive brother.
  language: English
  quote_policy: summarized
