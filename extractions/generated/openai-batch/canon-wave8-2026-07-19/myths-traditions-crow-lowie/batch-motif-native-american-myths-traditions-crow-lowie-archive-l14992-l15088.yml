canonical_text:
  quote: ''
  summary: 'The passage recounts early trade and intermarriage involving White men,
    including Iron-ball’s warning that buffalo and deer would disappear and Crow children
    would learn White men’s ways. It then tells of Batco''sana''pua, a Crow warrior
    who said he did not want to grow old or fearful, fought from a hole in the ground,
    and later rode a white horse over a rocky bank to die. The passage begins Spotted-rabbit’s
    story: after his father is killed and his mother publicly mourns, Spotted-rabbit
    gives away horses to obtain Crazy Dog clothing and prepares with an elder clansman
    outside the camp.'
  language: English
  quote_policy: summarized
