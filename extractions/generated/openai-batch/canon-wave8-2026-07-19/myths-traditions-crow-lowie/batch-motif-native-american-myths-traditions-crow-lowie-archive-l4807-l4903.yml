candidate_motifs:
- id: motif:1
  label: ascent to the sky by successive arrows
  taxonomy_refs:
  - ascent
  basis: Curtain-boy shoots arrows through the smoke hole and follows them upward
    until the fourth arrow lands him in the sky.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives an ascent method but does not generalize it beyond this
    episode.
- id: motif:2
  label: sibling rescue from an intended cannibal feast
  taxonomy_refs:
  - sibling_pair
  basis: Curtain-boy follows Spring-boy into the sky after learning he is to be eaten,
    then frees him from Long-arm at the feast.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The cannibal-feast frame is literal in the passage, but broader sibling-pair
    classification is taxonomic.
- id: motif:3
  label: defeat of dangerous sky beings and acquisition of their implements
  taxonomy_refs:
  - culture_hero
  basis: Curtain-boy kills the fire-moccasin possessor and the long-knife possessor,
    later kills Long-arm, returns with the implements, and tells his parents how to
    use them.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage says the boys killed bad things above and on earth, but does
    not explicitly call Curtain-boy a culture hero.
- id: motif:4
  label: celestial object made from a severed body part
  taxonomy_refs: []
  basis: A severed arm of Long-arm is given to the Moon, who places it in the sky;
    the passage identifies it as Hand Star.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference directly names a star-origin or body-part
    constellation motif.
- id: motif:5
  label: external body or life connected to an arrow
  taxonomy_refs: []
  basis: One boy disappears when his arrow goes into a snowbank, and the passage states
    that the arrow was his body and had been taken by Old-Woman’s-Grandchild.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The episode is incomplete in this passage range and does not explain the
    full mechanics of the arrow-body relation.
- id: motif:6
  label: tree refuge from threatening buffalo foetus
  taxonomy_refs: []
  basis: The boys flee from the calf foetus and climb a tree, while the men hang the
