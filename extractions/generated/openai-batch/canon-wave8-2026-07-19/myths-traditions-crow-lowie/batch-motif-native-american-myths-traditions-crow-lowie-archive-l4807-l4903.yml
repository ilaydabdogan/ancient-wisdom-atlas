canonical_text:
  quote: ''
  summary: Long-arm carries Spring-boy upward, leaving an arrow and feather trace.
    Curtain-boy discovers the route, follows arrows into the sky, is adopted by an
    old woman later identified as the Moon, learns Spring-boy is to be eaten, kills
    two dangerous sky figures and takes their implements, rescues Spring-boy from
    Long-arm at a feast, and returns to earth after the Moon places one of Long-arm’s
    severed arms in the sky as Hand Star. Later, one boy disappears when his arrow,
    described as his body, is taken by Old-Woman’s-Grandchild. Curtain-boy becomes
    Old-Woman’s-Grandchild’s comrade, encounters buffalo butchers and a frightening
    calf foetus, then helps enter the snakes’ tent where storytelling puts the snakes
    to sleep before Old-Woman’s-Grandchild beheads them, except one that wakes.
  language: English
  quote_policy: summarized
