canonical_text:
  quote: ''
  summary: A young man who must obtain Red-hair's hair in order to marry a girl receives
    help from animal-associated advisers. They transform him into a woman and advise
    him how to pass Red-hair's guards by becoming an ant. He marries Red-hair in disguise,
    withstands suspicion from Red-hair's brothers, kills Red-hair while lousing him,
    takes his hair, escapes through a sequence of helper stations and misleading reports,
    and returns to marry the girl who had demanded the hair.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man says that a girl will not marry him unless he fetches some of
    Red-hair's hair.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group of four helpers debates how the young man can get the hair; one says
    they should make use of the lecherousness of earth people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two young women are identified as a white-tail deer and an ant; the helpers
    alter the young man's body with breasts and a vulva, and wolverene changes him
    into a woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The advisers warn that Red-hair has watchers including coyote, crane, dogs,
    a big wolf, and a snake watcher; they tell the young man to become a little ant
    at a ridge and pass while coyote and crane sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man becomes an ant, passes the watchers, appears to Red-hair as
    a woman, and says she has come to marry Red-hair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red-hair's brothers suspect the disguised spouse because of scarred arms,
    masculine breath, and a masculine step, while Red-hair defends the spouse as a
    woman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: While lousing the sleeping Red-hair, the transformed young man finds the tender
    part at the back of his head, stabs him with a knife, and takes his hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The crane sees Red-hair bald-headed through the smoke hole and hoots; the
    coyote howls; the young man, said to have deer power, runs away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Red-hair's brothers pursue the fugitive, but ants, the white-tailed deer woman,
    and advisers give reports about a deer, an eagle, and a white hawk, after which
    the brothers give up.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A swallow watches the brothers return home; the young man then comes out,
    returns to his people, gives Red-hair's hair to the girl, and marries her.
  category: sequence
  evidence_refs:
  - ev:9
