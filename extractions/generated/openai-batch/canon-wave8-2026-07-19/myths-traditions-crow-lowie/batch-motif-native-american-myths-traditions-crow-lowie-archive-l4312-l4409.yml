canonical_text:
  quote: ''
  summary: Spring-boy lulls a group of snakes to sleep with repeated descriptions
    of people falling asleep, kills them, restores Running-jack-rabbit’s eyes, but
    one escaped snake later enters his body. Spring-boy uses rain, wind, sun-heated
    water, and stones to catch and alter the snake; afterward Curtain-boy places little
    stones in Spring-boy’s head, giving him a rattle and the name Rattling-head. Later
    Long-arm takes Curtain-boy into the sky. Spring-boy seeks help from Old-Man-Coyote
    and the birds, then sees a hole in the sky and ascends by four colored arrows
    to look for his brother, disguising himself as a poor boy near a camp of little
    birds.
  language: English
  quote_policy: summarized
