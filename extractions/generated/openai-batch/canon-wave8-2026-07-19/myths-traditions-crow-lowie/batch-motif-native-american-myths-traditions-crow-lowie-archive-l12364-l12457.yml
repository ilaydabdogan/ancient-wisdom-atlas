canonical_text:
  quote: ''
  summary: 'The passage begins with the close of a tale in which a young man returns
    with a woman''s brother, the camp hears his account, and a marriage follows. It
    then presents a tale of four Crow brothers who pursue four different ritual practices:
    offering to the Sun, fasting and thirsting, building sweatlodges, and giving feasts
    to clan fathers. The Sweater organizes sweatlodge rites for children against a
    coming disease, helps Running-rabbit''s infant through smoke and naming, continues
    making sweatlodges every day, and later joins Red-bear on a warpath, where he
    keeps building sweatlodges and brings back many horses.'
  language: English
  quote_policy: summarized
