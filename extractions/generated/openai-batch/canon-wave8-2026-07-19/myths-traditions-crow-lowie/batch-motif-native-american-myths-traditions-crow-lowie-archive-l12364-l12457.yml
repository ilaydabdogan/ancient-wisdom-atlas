candidate_motifs:
- id: motif:1
  label: Return from enemy camp followed by public narration and marriage
  taxonomy_refs:
  - return
  basis: The opening fragment describes a return from the enemy's camp, public announcement
    and narration, and a marriage after the ordeal.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-tale, so the full structure and causes of the return
    are not present in this excerpt.
- id: motif:2
  label: Four ritual paths tested for prosperity
  taxonomy_refs:
  - sacred_exchange
  basis: The four brothers undertake different religious practices, including offerings,
    fasting, sweatlodges, and feasting, to see who will be wealthy and get along in
    the world.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the purpose of prosperity, but does not explicitly
    formulate a reciprocal bargain with a deity for every practice.
- id: motif:3
  label: Ritual sweatlodge protection against communal disease
  taxonomy_refs:
  - initiation
  basis: The Sweater gathers children and young people for sweatlodge rites and states
    that a disease is coming and that he is trying to prevent death and allow them
    to grow up.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The available taxonomy term 'initiation' only partly fits; the passage
    emphasizes protection and survival more directly than initiation.
- id: motif:4
  label: Protective smoking and naming of an infant
  taxonomy_refs:
  - sacred_exchange
  basis: Running-rabbit petitions the Sweater for help so his infant will grow up;
    the Sweater smokes the infant with bear-root incense four times and names him,
    while Running-rabbit promises a future horse.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The rite is literal in the passage, but its broader mythic classification
    requires human review.
- id: motif:5
  label: Unbroken ritual observance during a war expedition brings successful horse
    capture
  taxonomy_refs: []
  basis: The Sweater insists on building a sweatlodge every day while on the warpath,
    does so, and then brings many horses from the hostile camp, including Red-bear's
    dreamed pintos.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage implies association between observance and success but does
    not explicitly state a causal rule.
- id: motif:6
  label: Dreamed animals obtained in waking raid
  taxonomy_refs: []
  basis: Red-bear dreams of a buckskin pinto and a mule pinto, and the Sweater brings
    horses including two pintos from the hostile camp.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain the dream's source or mechanism.
- id: motif:7
  label: Abandoned infant found and adopted
  taxonomy_refs: []
  basis: Running-rabbit leaves the infant on the old campsite, another family finds
    him, and Other-woman adopts him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The later life of the adopted child is not included in this excerpt.
