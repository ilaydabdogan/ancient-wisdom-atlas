canonical_text:
  quote: ''
  summary: 'The passage recounts a Crow-Sioux peace tradition in which two Crow boys
    dressed in Crow fashion return to the Sioux, urge movement toward the Crow camp,
    carry messages between camps, and help arrange a joint encampment. Gifts are exchanged,
    a Crow wife taken by a Sioux is returned with property, and the text states this
    was the first peace between Crow and Sioux. A second, unfinished Nez Perce-Hidatsa
    peace tradition begins: a Hidatsa war party captures a Nez Perce boy and horses
    on a mountain; the boy is adopted among the Hidatsa; his father mourns, fasts,
    learns where he is, visits with horses, and later returns with Nez Perce people
    bearing horses, roots, and berries to recover him.'
  language: English
  quote_policy: summarized
