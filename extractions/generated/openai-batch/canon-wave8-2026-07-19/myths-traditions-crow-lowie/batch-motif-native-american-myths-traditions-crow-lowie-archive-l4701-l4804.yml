canonical_text:
  quote: ''
  summary: Two boys, including Spring-boy, retaliate against a man, repeatedly seek
    out forbidden dangerous places, destroy or neutralize a deadly tree and a closing
    coulee, obtain a beaver tail, are swallowed by a buffalo and escape by cutting
    its organs, and are pursued by a destructive wind that blows one boy apart into
    a blood clot. The blood clot grows, is found by an old woman, and becomes a boy
    again when boiled. Later the stars plan to eat the boys, and Long-arm abducts
    Spring-boy through the smoke hole.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys kill a man with arrows, spare his wife, destroy his tipi, take back
    their hoop, take his scalp, tie it to their lodge poles, and throw the rest of
    his skull into a spring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father warns the boys not to go to a tree that falls and kills anything
    passing under it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys approach the tree, cause it to fall, break off its branches, burn
    it, and bring back some limbs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father warns the boys about a deep coulee that spreads and closes over
    anyone who steps over it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Spring-boy tests the coulee repeatedly; after he shoots arrows across it,
    he and his brother leap over it until it no longer widens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A beaver that can cut anything in two with its tail gives the boys its tail,
    and they use it to cut wood for their mother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father warns that a buffalo on a high hill sucks anything into its mouth
    and swallows it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The buffalo swallows the boys, and inside its stomach they find many animals
    and touch its kidneys, heart, and windpipe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boys cut off the buffalo’s organs, cut a hole between its ribs, come out,
    and Spring-boy takes the heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A storm blows rocks and stones; the boys travel as fast as arrows they shoot,
    but the wind carries one boy into the air until only a clot of blood remains.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spring-boy survives by running into a hole and returns home with the buffalo’s
    heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The blood clot grows larger near an old woman’s garden; she brings it home
    to cook, and when it boils the boy jumps out of the kettle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Spring-boy later finds the restored boy and takes him back to their tent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The two boys hunt for their father by shooting arrows over a hill and killing
    buffalo and other game.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The stars know the boys have killed bad things on earth and plan to eat them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Long-arm reaches through the smoke hole while the boys sleep and takes Spring-boy
    up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The remaining boy searches with his arrows for Spring-boy but does not find
    him, and the family mourns.
  category: action
  evidence_refs:
  - ev:8
