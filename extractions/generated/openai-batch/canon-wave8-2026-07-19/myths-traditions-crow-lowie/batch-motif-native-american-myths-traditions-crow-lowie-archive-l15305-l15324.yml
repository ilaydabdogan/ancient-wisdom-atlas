  summary: The passage praises Spotted-rabbit as the best-looking Crow man, his bobtail
    or horse as the best horse, and his mother as the best crier or mourner. Her wailing
    makes the camp cry. After a fighting expedition toward the Hidatsa, an unnamed
    man tells her to bury her son, and she does. The passage repeats four distinctions
    about Spotted-rabbit, says he had a comrade whom his mother adopted as her own
    child, and states that Two-faces was older than Spotted-rabbit.
