canonical_text:
  quote: ''
  summary: The passage contains the end of one tale and the beginning of another.
    In the first, a boy later named Big-iron tells his mother that his father or stepfather
    forced him to an eagle nest on a high bank by rope, abandoned him there, and that
    an eagle eventually brought him home. His mother has the account publicly heralded,
    and the people blame the stepfather, Good-clouds. Big-iron later asks to receive
    presents and prayers after death; people give the right kidney when praying to
    him, and their requests are granted. In the second tale, during an early Crow
    buffalo-hunting setting along the Big Horn, a fatherless boy’s stepfather leaves
    him on a rock, then tricks and throws him down a cliff in Bighorn Canon. The boy
    lands on a ledge and clings to a pine. A sparrow-hawk, a squirrel, an eagle, and
    then four mountain-sheep approach him as possible rescuers or adopters, though
    the first three attempts fail before the passage breaks off.
  language: English
  quote_policy: summarized
