canonical_text:
  quote: ''
  summary: A weakened young man leaves his pregnant wife expecting death, encounters
    a dwarf who heals him with deer blood and food, and is instructed to heal his
    wife likewise. The couple visits the dwarf’s rock house; the wife gives birth
    to a son whom the dwarf names and ritually treats with fire, bear-root incense,
    and the four quarters. The dwarf and his household provide goods, lodge materials,
    horses, a stone body, special garments, four colored arrows, and instructions
    for dealing with the threatening husband from whom the couple fled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man lays his pregnant wife by a rock near tall grass, says he will
    go die elsewhere, and leaves crying while using his gun as a cane.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After crossing a ridge, the young man approaches a stranger who is butchering;
    the stranger is identified as a short, muscular dwarf who has killed a black-tailed
    deer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dwarf gives the young man deer blood to drink, makes a large fire, roasts
    ribs for him, and tells him to stand and stretch; the young man is then no longer
    weak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dwarf points out his house as a big rock near the mountain and instructs
    the young man to take blood to his wife, make her drink it, and return with her
    the next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife drinks the blood, stretches, recovers strength, and the next day
    the couple reaches the dwarf’s rock house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dwarf says the pregnant wife cannot enter his house; the young man enters
    and finds tanned hides inside and a woman who says the dwarf almost brought her
    son too late.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The young man’s wife gives birth to a boy, and the dwarf names him His-arrows-plenty-of-lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The child is washed and brought inside; the dwarf uses bear-root incense,
    moves the fire, causes the child to stand over it, and places the child toward
    the four quarters while giving the name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dwarf gives the young woman many elk teeth, and the dwarf’s household
    helps provide hides and materials for a lodge and comforters.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The young man explains that the woman had a husband who wanted to kill him;
    the dwarf identifies that man as his adopted child and says he made his body of
    stone with holes in it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dwarf sends the young man to bring horses from behind the mountain, where
    some Shoshoni are located, and tells him to keep the horses.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The dwarf says the young man’s body is now of stone, makes him a cut-back
    blanket and a shirt with holes, gives him four arrows colored black, red, yellow,
    and blue, and tells him to wait until the fourth attempt before killing the threatening
    man.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The young man moves with his wife and child, camps near the people, and has
    a fine tent, bird tail-feathers, elk teeth, and horses of various colors.
  category: sequence
  evidence_refs:
  - ev:11
