  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brothers send the young woman home because she is human and warn her not
    to pick up any baby found on the road, saying it is part of Worms-in-his-face
    that had blown away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: On her journey home, the young woman repeatedly encounters crying or smiling
    babies or children; after one falls and bleeds, she cleans its nose, takes it
    on her back, and carries it home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the child is brought to camp, chiefs are found dead with holes in their
