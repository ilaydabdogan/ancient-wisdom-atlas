- id: obs:3
  text: The boy ignores Red-woman’s instruction to shoot her side and instead shoots
    at the feather, described as the place where her heart and lungs are; Red-woman
    falls and dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy has the young woman gather wood, makes a sweatlodge, places his brothers’
