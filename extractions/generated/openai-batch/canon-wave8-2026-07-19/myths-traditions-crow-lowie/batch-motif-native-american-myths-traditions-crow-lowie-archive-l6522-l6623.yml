canonical_text:
  quote: "“The seven brothers went up to the sky and became stars, but the boy remained
    separate, near the Seven Stars.”"
  summary: Red-woman kills seven brothers after directing them to shoot her in the
    side. A sparrow tells the boy where Red-woman is vulnerable, and the boy kills
    her by shooting the feather at her head, where her heart and lungs are. The boy
    restores his brothers to life in a sweatlodge. The brothers ascend and become
    stars, while the young woman is sent home with a warning not to pick up any baby
    on the road. She eventually takes a crying child home; the child later eats chiefs’
    hearts. Medicine men use arrows and rain to identify the child, and a marksman
    shoots the child’s little finger. The camp burns the child.
  language: English
  quote_policy: quoted
