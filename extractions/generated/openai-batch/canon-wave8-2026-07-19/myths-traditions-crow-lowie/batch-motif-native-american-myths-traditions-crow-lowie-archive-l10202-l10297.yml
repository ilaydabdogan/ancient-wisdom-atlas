canonical_text:
  quote: ''
  summary: A young man loses all his property and his wife in the hoop game, seeks
    power, and receives aid from a white-headed eagle and associated birds. With a
    warm stone used as a hoop and other instructed wager goods, he wins back what
    he lost. His rival's father, Morningstar, investigates the source of his power,
    arranges a raid that fails because of a bird-painted shield, and later waits until
    the birds migrate; the young man then dies and is buried on a scaffold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young men play the hoop game, and one young man repeatedly loses, staking
    two horses, his tipi, and finally his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After losing everything, the young man goes upstream looking for power; birds
    and animals speak with him and say the opponent's father is too powerful for them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man comes to a white-headed eagle's nest with unfledged young and
    mourns around the tree for four days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The white-headed eagle dives into the middle of the water and brings up a
    blue, round, warm stone for the young man to use as his own hoop.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eagle instructs the young man to wrap the hoop in male antelope hide and
    to wager two stray horses, a white buffalo, and tail feathers from a dead eagle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man follows the instructions by obtaining an albino buffalo hide,
    stray horses, dead eagle tail feathers, and a male antelope hide for the hoop.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Using the new hoop, the young man wins repeated games, breaks his rival's
    hoop, and wins back horses, wife, and lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The rival's father, Morningstar, sends a chicken-hawk to trace the young man's
    steps to the tree with young eagles and questions his son about the warm hoop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Birds appear to the young man in a vision and tell him to paint their picture
    on his shield to protect his face against an expected enemy attack.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the raid, an enemy's sword strikes the shield, and the young man kills
    the enemy and several followers with a tomahawk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Morningstar says he will wait until the birds have gone home; after the birds
    migrate, the young man gets a headache, dies in winter, and is buried on a scaffold
    outside camp.
  category: sequence
  evidence_refs:
  - ev:7
