canonical_text:
  quote: ''
  summary: The passage recounts Crow warpath episodes involving Barl'te and the fourth
    brother later named Kills-with-his-mother. Barl'te joins a six-man raid, wishes
    for safe return and gifts for clan fathers, scouts Sioux enemies, participates
    in killing two men, captures horses including one matching a dreamed horse, steals
    more horses, returns, and gives horses to a clan father. The fourth brother watches
    Sioux from a hole near a bank, warns the Crow, later kills an enemy horse-thief
    with help from his mother and receives his name. He then takes part in mock battle
    and war exploits, uses medicine, passes through a corral unharmed, becomes distinguished,
    but dies of disease before completing a fourth repetition. The passage closes
    by stating that the four brothers became eminent men.
  language: English
  quote_policy: summarized
