canonical_text:
  quote: the Sun and the Morningstar had adopted them
  summary: A Crow chief's wife is captured by Sioux and married within the Sioux camp.
    Two Crow boys grow up as captives among the Sioux, herd horses, and secretly receive
    adoption from the Sun and Morningstar. One boy, Eats-sinew, becomes a Sioux captain
    and chief but later hears an old man reveal that he, his brother, and his mother
    are Crow. After his mother confirms this, Eats-sinew gathers other Crow captives,
    urges them to remember their origin, and the two brothers travel to the Crow camp,
    where they identify themselves through their fathers' Crow names and are received
    by kin.
  language: English
  quote_policy: quoted
