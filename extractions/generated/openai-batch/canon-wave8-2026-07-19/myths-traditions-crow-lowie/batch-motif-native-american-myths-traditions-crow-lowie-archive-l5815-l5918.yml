canonical_text:
  quote: ''
  summary: Looks-down follows his wife and son through repeated barriers, is denied
    food and speech, enters the grandmother's stone-doored lodge in feather form,
    identifies his child, wife, and bed with help from the child, survives a deadly
    sweatlodge ordeal, and completes a dangerous wood-gathering task from a thunder-nest
    tree after praying to his father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman repeatedly puts up a tipi or lodge, builds a fire, and cooks; she
    refuses to feed, look at, or talk to Looks-down, while the boy sleeps with his
    father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Looks-down flies into the air to locate the woman and child, comes down to
    them, and the passage states that the boy does not know his father is a bird.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman and child repeatedly search for and find passageways through obstacles,
    including a flat, a big wood, and a sea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy warns Looks-down that beyond the hill are many lodges and a bad grandmother
    who is going to eat him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the camp, the grandmother opens a stone door; Looks-down puts a feather
    on his forehead and enters after the door is shut by blowing in as a feather.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Inside the lodge are ten buffalo and ten calves; the grandmother requires
    Looks-down to identify his child, his wife, and his bed, and the calf-boy gives
    signals to guide him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ten buffalo are described as women who bring home husbands for the old
    woman to eat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The grandmother prepares a sweatlodge with very hot stones, a thick cover,
    and seven buffalo guarding it; Looks-down uses a louse and an ant in the ordeal,
    and the grandmother faints after her frog earrings run out of water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The grandmother sends Looks-down for wood from an old tree with a thunder
    nest that kills anything coming near; after he prays to his father, a storm comes
    and lightning breaks the tree into pieces.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The grandmother repeatedly says that her daughter has brought something powerful.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
