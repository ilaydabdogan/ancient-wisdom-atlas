canonical_text:
  quote: ''
  summary: Ka/ricbapi'tuac returns to the place where his mother and little brother
    died, restores them through repeated arrow-shots and warnings, resumes hunting,
    and has his mother make a tipi. In spring a bird warns him that Long-arms will
    take him by his father’s orders. After the younger brother is abducted, Ka/ricbapi'tuac
    ascends to the sky by means of arrows and bow, enters a sky dwelling in smaller-boy
    form, is carried by an old woman to a Sun dance where Long-arms holds the younger
    brother for eating, kills the old woman, cuts off Long-arms’s arms, rescues his
    brother, and returns to earth by arrows. The passage also gives etiological explanations
    for morning eating and for children fighting relatives, and states that Long-arms
    had been taking animals and people from earth to kill and eat them.
  language: English
  quote_policy: summarized
