canonical_text:
  quote: ''
  summary: A young man is carried by successive groups of ducks across expanses of
    water and islands to the shore of a great sea, where children take him to their
    mother’s dwelling. He makes playthings and weapons for the children, uses their
    father’s looking-glass to restore his damaged face, receives instructions from
    the Sun, and returns by the duck route. Back near the lake, an eagle helps him
    prepare for a water monster. The young man kills the long-otter by throwing four
    hot stones into its mouth; thunder carries the dead creature away, and the eagle
    tells him to wait for the young eagles he had saved.
  language: English
  quote_policy: summarized
