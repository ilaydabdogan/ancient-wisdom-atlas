canonical_text:
  quote: ''
  summary: The passage contains connected Crow narrative episodes involving Coyote
    or Old-Man-Coyote and Cl'rape'. In one episode wolves enlist Spider, whose cocoon
    causes Old-Man-Coyote to sleep while other animals consume his meat and robe.
    In another, Old-Man-Coyote instructs Cl'rape' in making a sweatlodge that cures
    him, and the narrator connects this to the continuing first sweatlodge seen in
    fasting dreams. In a longer episode Cl'rape' owns a buffalo paunch containing
    ants that become men and kill buffalo; Old-Man-Coyote repeatedly tries to take
    it, later exchanges medicines for it, misuses it, tears it, and loses the ants
    back to Cl'rape'.
  language: English
