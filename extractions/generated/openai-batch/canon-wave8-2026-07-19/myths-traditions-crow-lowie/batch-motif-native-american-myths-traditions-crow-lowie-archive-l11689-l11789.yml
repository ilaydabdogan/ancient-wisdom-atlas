canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which Black-elk returns to his family,
    distributes feathers, recounts abandonment and hardship, gains White-mountains''
    wife as a second wife after a conflict, travels with his brother by means of ground-cedar,
    and later White-mountains'' new war party disappears. It then begins another tale:
    a young man crossing the Yellowstone is taken into the river by unidentified agents,
    Warm-blanket attempts a rescue and is harmed, and Has-medicine-thunder announces
    that he will bring the young man back.'
  language: English
  quote_policy: summarized
