canonical_text:
  quote: ''
  summary: An orphaned Crow young man goes to a Sioux camp to recover a young woman's
    captive brother. The captive has been tied high in a Sun Dance structure as an
    offering to the Sun. The rescuer frees him but both are caught; a chief says the
    Sun has saved the boy, and the captives are made to walk over seven buffalo skulls
    under threat of death. The captive is said to have been adopted by the Sun and
    wears a plume. The pair escape pursuit by hiding, recover animals, travel homeward
    while the rescuer feeds and treats the weakened captive, and later avoid a Sioux
    war party after seeing sun dogs. The young woman dreams of seeing part of her
    brother, and the rescuer returns to camp and finds his grieving grandmother.
  language: English
  quote_policy: summarized
