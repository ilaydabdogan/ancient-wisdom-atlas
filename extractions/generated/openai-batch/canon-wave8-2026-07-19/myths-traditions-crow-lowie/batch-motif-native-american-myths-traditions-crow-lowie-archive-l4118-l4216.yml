canonical_text:
  quote: ''
  summary: Two boys, Spring-boy and Curtain-boy, repeatedly act despite warnings about
    dangerous persons, objects, and places. They seize a deadly jug from an old woman,
    take a killing digging-stick from another woman, restore their mother at her burial
    site with ritualized threats from implements, overcome a falling tree, neutralize
    a spreading coulee, and take fire-moccasins from a sleeping man, burning him and
    his tipi. The passage ends as their mother begins to tell them of a dangerous
    buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys are warned that an old woman uses a jug to draw passersby into it,
    boil them, and eat them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spring-boy puts a stone into the jug when it is pointed at him, stopping it,
    and Curtain-boy later points the jug at the old woman so that she enters it and
    is boiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys bring the jug home and report to their father how they got it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hunter warns the boys about a woman with a digging-stick that kills animals
    when swung.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boys become a butterfly and a fly, approach the sleeping woman, return
    to boy form, take the digging-stick, and kill her with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Curtain-boy proposes that they make their mother get up; the boys obtain a
    stone maul and stone anvil, and take the jug and a flesher to the burial site
    under a pine tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The boys throw or threaten to drop implements on their mother; she first moves,
    then sits up, and says she has slept for a long time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boys bring their mother home, hide her, and prompt their father to call
    for his wife; she comes out of hiding and goes to bed with him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The father stays for four days watching the restored woman and does not go
    away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The father warns that a leaning tree drops on and kills anything passing beneath
    it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The boys shoot arrows over the tree, race toward it, stop before reaching
    it, cause it to drop, play on it, and bring home some limbs.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The mother warns that a coulee spreads when someone jumps over it and can
    drown anyone who cannot reach the other side.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The boys trick the coulee into spreading, jump over it, play with it, drink
    from it, and return saying it no longer has power.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The mother warns of a dangerous man whose one moccasin is made of fire.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Spring-boy turns into a whirlwind, obtains the fire-moccasins from the sleeping
    man, and uses them to burn the tipi and the man.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The boys plan to take the fire-moccasins home for their mother to help with
    making fire.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: At the end of the passage, the mother begins to tell the boys of a buffalo
    called Bull-dead-wolf.
  category: speech
  evidence_refs:
  - ev:17
