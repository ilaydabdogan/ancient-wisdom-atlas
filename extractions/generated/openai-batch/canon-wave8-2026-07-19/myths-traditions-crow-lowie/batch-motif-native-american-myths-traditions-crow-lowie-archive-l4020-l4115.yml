canonical_text:
  quote: ''
  summary: A boy living with his hunter father repeatedly calls his brother from a
    spring. The brother has been adopted by a being inside the spring. The brothers
    eat meat, play, gamble with bows and arrows, and later the father learns that
    their mother was killed by a visiting woman who placed one child in the spring
    and one behind a curtain. The father helps Curtain-boy capture Spring-boy using
    rawhide protection and offerings thrown into the spring when it bursts and releases
    fog. Spring-boy's sharp teeth are filed down, the fog remains for ten days, and
    the boys later ask about their mother's burial and kill a buffalo. The passage
    ends as the father warns them about a dangerous old woman with a jug.
  language: English
  quote_policy: summarized
