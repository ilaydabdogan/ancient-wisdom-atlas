canonical_text:
  quote: ''
  summary: The passage presents several Crow cosmogonic variants. A shining medicine
    stone is identified as an ancient, self-reproducing part of earth. A star-being
    or Tobacco-man is found on the ground and becomes the Tobacco plant, which is
    linked to Crow livelihood and ritual. Other variants describe Sun and Old-Man-Coyote
    sprinkling dirt over water, creating people from mud, bringing the Crow from a
    tree hole, using earth-diving helpers to obtain mud from primordial or flood waters,
    and organizing animals, tipis, reproduction, tribes, enmity, and Crow war practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shining object on the plains is identified as a medicine stone, described
    as part of the earth, the oldest part of the earth, a separate being, and able
    to reproduce itself.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A being seen as human and identified as one of the Stars above transforms
    into a plant; the plant is identified as Tobacco, said to be the first plant,
    to be raised in spring, used in dancing, cared for, and to care for the people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After man has been made, the maker finds there is no grass and makes mountains,
    hills, and trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A poor boy goes out to fast, and the Sun adopts him; the noted narrative then
    shifts to the organization of the Tobacco dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a briefer version, the informant wavers over the identification of Sun
    and Old-Man-Coyote; after earth has been brought up, Sun declares that everything
    proceeds from left to right and sprinkles fine dirt four times over water from
    left to right, which is given as the reason for beginning incense use at the left.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the same briefer version, the Tobacco-man is found before any living being
    has been made; as Sun and Old-Man-Coyote approach, he shrinks until only the white-flowered
    Tobacco plant is discovered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sun and Old-Man-Coyote say they will make the Crow, and declare that the Tobacco
    plant shall be the Crow people's mainstay and everything to them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mud is fashioned into dolls and given life; these clay people are told to
    tear open one another's eyes, and most are described as having strong hearts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Crow are made from a hole in a tree; the first one to come out has his
    eyes opened and is told to do the same for the rest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Medicine-tail's version, Old-Man-Coyote dispatches a little swallow, a
    crow, a wolf, and a duck as earth-divers; he then makes human beings, one male
    and one female, from mud, and instructs them to marry and multiply.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In a flood-and-boat version, Old-Man-Coyote makes a boat; rain covers all
    the mountains, the boat grounds on a high mountain when the waters go down, and
    ducks are sent to obtain earth or mud, with mud successfully brought on the fourth
    trial.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Old-Man-Coyote throws earth around to make the earth, marks rivers and creeks,
    makes mountains and hills, makes buffalo, horses, other animals, people, and a
    wife from mud, and changes leaf tipis into real tipis.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Old-Man-Coyote and his wife make arrows and other equipment, instruct people
    to have intercourse and have children, divide numerous people into tribes set
    in a circle, leave the Crow in the middle, make the others their enemies, and
    establish dancing after killing enemies and taking horses.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At the start of the Old-Man-Coyote and Ci'Rare' account, the earth is all
    covered with water; Old-Man-Coyote travels alone on the water, meets a little
    coyote, seeks companionship, and later has ducks dive for earth, which is brought
    four times and used to make the earth.
  category: sequence
  evidence_refs:
  - ev:14
