candidate_motifs:
- id: motif:1
  label: Primordial self-reproducing medicine stone
  taxonomy_refs: []
  basis: The medicine stone is described as the oldest part of earth, a separate being,
    and able to reproduce itself.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives little narrative action for the stone beyond discovery
    and description.
- id: motif:2
  label: Star-being transforms into sacred Tobacco plant
  taxonomy_refs:
  - shapeshifter
  basis: A being from the Stars appears as human, transforms or shrinks into Tobacco,
    and is identified as a plant that will care for the people and sustain the Crow.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy label is used for the explicit change of form, not for a
    broader shapeshifter cycle.
- id: motif:3
  label: Cosmogonic precedent for ritual direction
  taxonomy_refs: []
  basis: Sun's left-to-right sprinkling of dirt over water is explicitly given as
    the reason people begin at the left when using incense.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports an etiological link to incense practice but does not
    provide the full ritual context.
- id: motif:4
  label: Earth-diver creation from mud brought up through water
  taxonomy_refs: []
  basis: In multiple variants, diving helpers are sent into water to bring earth or
    mud, which is then used to make land or the earth.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:14
  confidence: high
  cautions: No specific earth-diver taxonomy reference is supplied in the available
    motif list.
- id: motif:5
  label: People and living beings made from mud
  taxonomy_refs:
  - culture_hero
  basis: Old-Man-Coyote or the creator figures fashion people, animals, and a wife
    from mud, and one version makes mud dolls and gives them life.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:12
  confidence: high
  cautions: The available taxonomy supports the creator/culture-hero aspect more directly
    than the material of mud itself.
- id: motif:6
  label: Crow emergence from a tree hole
  taxonomy_refs: []
  basis: The Crow are made when Old-Man-Coyote pounds a hole in a tree and commands
    them to come out and look around.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Although the literal tree is clear, the passage does not describe an axis
    mundi or sacred-tree structure.
- id: motif:7
  label: Flood and boat renewal with mountain landing
  taxonomy_refs:
  - flood_and_renewal
  - ark_vessel
  basis: A boat made by Old-Man-Coyote survives rain that covers the mountains, comes
    to rest on a high mountain, and is followed by mud retrieval and renewed earth-making.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage does not state that all prior beings perish in the flood;
    the renewal reading is based on the subsequent creation actions.
- id: motif:8
  label: Culture hero establishes material culture, reproduction, tribes, and warfare
  taxonomy_refs:
  - culture_hero
  basis: Old-Man-Coyote makes or helps make tipis, arrows, people, reproductive rules,
    tribal divisions, Crow centrality, enemy relations, war dances, and horse-taking.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The account is etiological and social-organizational, not only cosmogonic.
- id: motif:9
  label: Sun adopts fasting boy
  taxonomy_refs:
  - divine_parent_child
  - initiation
  basis: A poor boy fasts and is adopted by the Sun, after which the narrative is
    said to enter the organization of the Tobacco dance.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives only a brief notice and omits the subsequent initiation
    or adoption details.
- id: motif:10
  label: Primordial loneliness and companion before world-making
  taxonomy_refs: []
  basis: Old-Man-Coyote travels alone on the water, says he is looking for a companion,
    meets the little coyote, and then participates in earth-making.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage provides only the opening of the named account.
