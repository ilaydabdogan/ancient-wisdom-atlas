  text: As an eagle, the man stays by the big water and dives for things in the water;
    later, while lousing himself on a bent tree limb over a river, an arrow point
    goes into his nose and he comes to awareness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
