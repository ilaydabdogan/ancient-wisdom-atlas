canonical_text:
  quote: ''
  summary: The line range contains the end of one tale in which Thunder and birds
    transform a man into a bald eagle and later a chicken-hawk; he kills water animals,
    is captured and corrected by a big elk called Old Man Hidatsa, and is told to
    return home as a human. It then begins a second tale in which a skilled young
    hunter bursts a strange water-filled skin, wakes on a rock in the middle of a
    lake, meets Thunder’s young and Thunder parents, and prepares to fight recurring
    water monsters that eat the young birds.
  language: English
  quote_policy: summarized
