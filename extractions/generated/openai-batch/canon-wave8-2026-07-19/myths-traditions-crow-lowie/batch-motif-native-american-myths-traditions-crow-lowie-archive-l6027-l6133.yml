canonical_text:
  quote: ''
  summary: The passage gives related Crow accounts of a buffalo cow or buffalo woman
    who bears a human or calf-like child by a Crow man after an encounter in mud.
    The child seeks his father in a Crow camp and identifies him by recalling the
    mud encounter. In one account the buffalo wife leaves after being insulted, and
    the husband follows animal tracks with animal helpers, passes recognition tests
    among buffalo calves and cows, and brings wife and child back. In the translated
    account the buffalo mother and child transform into human form, the child leads
    the father to the mother, and the father remembers and marries her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo cow says the father of her child is a human being and brings the
    child to the edge of a camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buffalo mother instructs her son to call a young man father and to answer
    that he was his father at the time of the mud.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child addresses the young man as father; the young man asks when he was
    the father; the child answers with the mud reference; the young man goes to the
    mother, and they stay in his tipi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The buffalo wife tells her husband not to call her names; after he marries
    again and quarrels arise, he calls the buffalo cow like a ghost.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the insult, the buffalo wife and her child disappear at night, and the
    man finds tracks of a buffalo and a calf at the edge of camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A winter sparrow identifies the tracks as the wife’s tracks and says they
    have reached a big herd; later a little wolf takes the man to the buffalo herd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The calf-son tells his father that many similar calves will pass and that
    he will shake his left ear so the father can identify him; he warns that the bulls
    will trample the father if he fails.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The calf-son says he will mark his mother with mud after going to water; when
    the cows pass, the man sees mud on her thigh and identifies her as his wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the man identifies both the son and the mother, he is allowed to take
    them back and thereafter does not call the buffalo wife names.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the translated account, a scabby female buffalo is stuck in a muddy place
    by a spring, and a youth who has never known a woman possesses her twice and calls
    her wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The buffalo becomes pregnant in winter and gives birth in spring to a male
    human-looking child who stands immediately; because they are medicine, the child
    is transformed into a calf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The child asks where his father is; the mother says he is an Indian and a
    Crow, and the child asks to go to him because the calves mock him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The buffalo mother and child seek the Crow camp, and the buffalo turns into
    a fine-looking Crow woman while her child also appears human.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The child takes hold of the identified father, but the father asks how he
    is his father; the mother tells the child to explain that she was a buffalo stuck
    in mud, that the man possessed her twice, and that the child was born from that
    event.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The mother reminds the young man that he called her wife during the mud encounter;
    he recollects the event, goes into his lodge with her, and they get married.
  category: sequence
  evidence_refs:
  - ev:8
