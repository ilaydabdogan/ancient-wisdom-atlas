  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Old-Man-Coyote later remains among wolves for a time, turns into a person,
    and approaches the camp again.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A man watering horses tells Old-Man-Coyote that the only bad thing in camp
