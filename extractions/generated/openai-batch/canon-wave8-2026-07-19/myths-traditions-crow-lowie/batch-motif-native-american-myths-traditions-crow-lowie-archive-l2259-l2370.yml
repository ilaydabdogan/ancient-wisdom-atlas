canonical_text:
  quote: Old-Man-Coyote pretended to die, he married his daughter, they found out
    and wanted to kill him
  summary: The passage first completes a crow episode in which Old-Man-Coyote produces
    meat and grease for a crow visitor. The main tale, “Old-Man-Coyote and his Daughters,”
    tells how Old-Man-Coyote gives deathbed instructions about a future suitor for
    his daughter, appears to die, leaves his body place, disguises himself as the
    described suitor, marries his daughter, is recognized by a boy through a scar
    and his voice, is denounced and pursued, changes into a wolf, later resumes human
    form, and hears his own act condemned as the camp’s sole evil event.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Old-Man-Coyote covers bark with a blanket; after the blanket is removed the
    bark has become fresh meat, which his wife cooks over her fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After his wife pierces his nose, grease comes from Old-Man-Coyote’s nose,
    and he gives the grease and meat to the crow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The crow tells Old-Man-Coyote that what he had heard was not true, and Old-Man-Coyote
    says the elk and the owl had lied to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old-Man-Coyote marries a woman; she gives birth to a girl who grows into a
    young woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: While sick, Old-Man-Coyote instructs his wife that their daughter should marry
    a young man on a gray horse who carries a skull and has a water-mark sash-fashion
    mark on the horse.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old-Man-Coyote tells his wife not to tie him up after death, to place him
    on sticks, and to put pemmican with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After he is laid out and the camp moves away, Old-Man-Coyote sits up, eats
    the pemmican, packs his clothing, leaves, and goes to the camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Old-Man-Coyote tells the camp to dance, paints his face, puts medicines on
    his head, rides a gray horse, and carries a skull by his sash.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old-Man-Coyote’s wife and daughter see the skull-bearing rider; the wife says
    he is the one named in Old-Man-Coyote’s dying instructions and brings the daughter
    to him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The man identified as the skull-bearing rider accepts the proposed marriage,
    saying it is good to carry out the wishes of dying persons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The daughter lies down with the man; later she bathes, eats, paints her face,
    and lies down again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A little boy examines the man’s face and says that the man is his father,
    identifying him by a scar among the eyelashes and by his voice.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the family recognizes him, the woman calls him ghostlike and announces
    that Old-Man-Coyote has married his daughter.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: People come to look at Old-Man-Coyote; he runs away, young men fire guns many
