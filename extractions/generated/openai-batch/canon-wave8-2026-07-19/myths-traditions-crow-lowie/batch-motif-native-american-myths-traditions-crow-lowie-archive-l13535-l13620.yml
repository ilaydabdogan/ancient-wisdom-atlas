canonical_text:
  quote: ''
  summary: A young Crow man named Knife seeks to marry Comes-from-across, who refuses
    him and is later captured by enemies. Knife mourns, travels to the captors' camp,
    speaks with her, and later raids horses. Comes-from-across escapes from her captor
    husband during a buffalo chase by using a water-coulee and riding away on a prized
    horse; she returns to Knife and accepts him as husband. The passage then begins
    a separate buffalo-hunting episode in which a young man shoots a buffalo bull
    four times without injuring it.
  language: English
  quote_policy: summarized
