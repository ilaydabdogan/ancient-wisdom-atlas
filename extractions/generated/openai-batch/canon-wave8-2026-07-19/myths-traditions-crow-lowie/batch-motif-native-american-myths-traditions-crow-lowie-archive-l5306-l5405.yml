canonical_text:
  quote: ''
  summary: 'The passage ends one tale in which a young man helps the camp obtain buffalo,
    defeat animal visitors, and survive a snowstorm while the Sun and Old-Man-Coyote
    control the return of animals. It then begins the tale of Yellow-Dog and the Morningstar:
    Yellow-Dog violates or attempts to violate a former sweetheart who is married
    to Morningstar; Morningstar removes the animals, causing snow, famine, deaths,
    and migration. The woman later helps the weakened Yellow-Dog with corn balls,
    and a boy''s turtle-shell medicine provides fat that Yellow-Dog begins to prepare.'
  language: English
  quote_policy: summarized
