  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Yellow-Dog entered the lodge of a former sweetheart who was alone at quillwork
    and stated that he would have his will of her, despite her refusal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The woman had been married to Morningstar; when Morningstar came at night,
    he knew she had been unfaithful, rejected her, gathered the animals, and took
    them away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A continuing snowstorm followed; provisions were used up, some people died
