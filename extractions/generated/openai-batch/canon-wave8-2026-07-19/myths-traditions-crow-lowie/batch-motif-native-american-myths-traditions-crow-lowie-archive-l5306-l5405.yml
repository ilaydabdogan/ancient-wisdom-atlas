  text: The young man predicted arrivals of a little bird, a fox, a magpie, and a
    crow, and instructed the boys or people to kill or catch them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun sent Old-Man-Coyote, who changed into a person to find out who the
    medicineman in camp was; the camp caught him, made him marry a woman, and kept
    him there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the young man sent people out with buffalo chips, buffalo appeared;
    after a sore buffalo was butchered, buffalo later came by themselves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Old-Man-Coyote was fed, schemed to return to the Sun, changed into a wolf,
    and reported that the people could not be starved because they had plenty to eat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Sun wondered where he had forgotten animals and then released the buffalo,
    deer, and grouse so that they returned to earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Big Dogs gathered in a tipi, sang, and planned to take and eat meat that
