candidate_motifs:
- id: motif:1
  label: Enemy woman’s marriage followed by temporary peace
  taxonomy_refs: []
  basis: A Sioux woman comes to marry a Crow warrior feared by the Sioux, her relatives
    visit, gifts are exchanged, and the Sioux and Crow live in peace for a time.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames this as a historical-hero tale episode rather than
    an explicitly supernatural or sacred marriage.
- id: motif:2
  label: Prestige display through praise songs and captured enemy weapons
  taxonomy_refs: []
  basis: Crow-on-the-forehead’s parents sing praise songs while carrying bows and
    guns taken by their son from the enemy during the marriage celebration.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the action but does not state an explicit ritual meaning
    beyond praise.
- id: motif:3
  label: Marriage conditioned on obtaining a dangerous person’s hair
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: A prospective bride says the suitor may marry her only if he brings Red-hair’s
    hair; the suitor departs toward the distant target.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: Only the opening of the tale is present, and the passage has not yet shown
    whether Red-hair is supernatural.
- id: motif:4
  label: Sequential helpers gained through game offerings
  taxonomy_refs: []
  basis: The suitor kills and brings game to a series of tipi residents, who then
