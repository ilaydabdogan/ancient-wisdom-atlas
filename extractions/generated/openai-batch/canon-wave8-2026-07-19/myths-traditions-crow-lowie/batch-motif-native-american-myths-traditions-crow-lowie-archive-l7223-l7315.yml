canonical_text:
  quote: ''
  summary: The passage concludes a Crow-on-the-forehead episode in which a Sioux woman
    comes to marry him, gives property to his parents, summons her kin, and the Crow
    and Sioux exchange gifts and live in peace for a time. It then begins the tale
    “Red-hair’s Hair,” where a young suitor must obtain Red-hair’s hair as a marriage
    condition and travels through a sequence of tipis, giving game to residents who
    provide directions and advice.
  language: English
  quote_policy: summarized
