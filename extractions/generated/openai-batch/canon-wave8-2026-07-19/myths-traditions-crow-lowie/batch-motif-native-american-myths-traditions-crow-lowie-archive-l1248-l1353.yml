canonical_text:
  quote: ''
  summary: The passage recounts several Old-Man-Coyote episodes involving Ci'rape',
    a mouse Sun dance, buffalo killed by laughter at a dance, Ci'rape's apparent death
    and return, a violent revenge episode, and a later encounter with a little coyote
    who produces fat from ice by means of a rock and a stick-game exchange.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ci'rape' hid a paunch after Old-Man-Coyote arrived, and Old-Man-Coyote said
    a paunch with ants had come back to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old-Man-Coyote took Ci'rape's arrow and ran away, but each time he slept and
    woke he was back in Ci'rape's tent; he later made another arrow and took back
    the first.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old-Man-Coyote heard drums by a river, entered a clearing, and found mice
    holding a Sun dance with a chief.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mice ran away when Old-Man-Coyote put his head in, and his head became
    stuck in a buffalo skull.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old-Man-Coyote's wife laughed and ran away, while boys teased him and then
    broke the skull off by striking it with stones as they danced around him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Old-Man-Coyote taught Ci'rape' to dance, called him his little dog, and made
    him dance before buffalo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The buffalo laughed at the dancing until two died; Old-Man-Coyote and Ci'rape'
    then returned and ate the two buffalo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During a snowstorm Old-Man-Coyote placed Ci'rape' in a pile of buffalo stomach
    contents; Ci'rape' froze, and Old-Man-Coyote cried, mourned, and buried him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Old-Man-Coyote left, Ci'rape' rose, ate pemmican, threw the rest into
    a creek, and ran off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Old-Man-Coyote tracked sleeping Ci'rape', pulled out and staked his intestines,
    set a fire nearby, and told him the fire was coming so that he ran until his guts
    were pulled out and he died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old-Man-Coyote mistook a lump in Ci'rape's guts for pemmican, ate it, discovered
    it was feces, and vomited.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Old-Man-Coyote and Ci'rape' agreed to search separately along the river for
