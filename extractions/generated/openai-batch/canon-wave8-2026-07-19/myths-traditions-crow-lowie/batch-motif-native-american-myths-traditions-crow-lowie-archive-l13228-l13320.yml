canonical_text:
  quote: ''
  summary: A young man, aided by an unnamed man in hunting, obtains many animals and
    materials. He and his wife process skins, teeth, meat, poles, horses, and other
    goods into a well-supplied camp. The couple raids a Nez Perce camp for horses,
    kills and scalps enemy men, and displays the scalps on lodge poles. Later they
    seek their own people, are guided by the young man’s dream and observation, identify
    a Crow camp by society songs, prepare their tipi and food, and are recognized
    by Cunning-man as the missing Crow man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man instructs the young man about when to return, drives elk toward
    rocks, and tells him to skin elk while he gathers teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several hundred elk go over a cliff, and the young man and helper skin some
    of them and gather many teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man and his wife haul skins, tan hides, make an elk-tooth dress,
    sew hides into a tipi cover, obtain poles, and move from a shelter into a tipi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man kills eagles, mountain lions, and buffalo, finds horses and
    a mule with ropes on their necks, and brings two horses home.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The woman makes parfleches, and the couple obtains pine poles and keeps the
    two horses they found.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the young man sings and asks his wife to go on a war party, both ride
    to a Nez Perce camp and take about fifty horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rain begins after the horse raid, and the couple travels until they reach
    a place without rain, then watches from a mountain and sees no pursuit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The couple observes enemy war parties; the young man kills and scalps pairs
    of men in two separate encounters and ties the scalps to the end of a lodge pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the fall the couple breaks camp and moves to look for their people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The young man dreams that the camp is coming toward them, later sees the camp
    by a river, and returns to tell his wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At night the couple approaches the camp, hears the Foxes and Lumpwoods singing,
    and identifies the people as Crow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The couple prepares their tipi, dresses up, and readies meat and pemmican
    before people from the Crow camp approach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: People avoid the tent because scalps are displayed at the pole ends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Cunning-man asks who is in the tent, recognizes the young man as the missing
    Crow man, enters, and receives meat and pemmican.
  category: action
  evidence_refs:
  - ev:7
