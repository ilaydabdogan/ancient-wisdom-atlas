  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Two young men talked away from the river at night, expressed dislike of the
    other people, and proposed moving camp upstream toward the mountains and the Yellowstone
    River.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The young men asked the chief to break camp with them and argued that in the
    mountains they could hunt animals by driving them toward rocks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: While the other people slept, the departing group broke camp, scattered in
