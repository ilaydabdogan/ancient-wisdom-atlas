canonical_text:
  quote: ''
  summary: Two Crow historical traditions explain the separation of Crow and Hidatsa.
    In both, a dispute over buffalo stomach or manifolds precedes Crow departure toward
    the mountains. One account also tells of a Crow man receiving a supernatural dream-gift,
    obtaining a shining star identified in a note as sacred Tobacco, planting it,
    and distributing it. The second account describes secret night migration, reassembly,
    mountain hunting, and eventual acquisition of horses.
  language: English
  quote_policy: summarized
