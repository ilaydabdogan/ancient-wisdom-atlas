canonical_text:
  quote: ''
  summary: 'A sequence of Old-Man-Coyote episodes: he exchanges sexual organs with
    a mouse to win a young woman, is exposed when the mouse drags away his original
    organ, kills the mouse, and flees. In a second episode, Old-Man-Coyote approaches
    two berrying girls who refuse him; he disguises or presents part of his body as
    a large sweet strawberry, the girls taste it, and later they plan a retaliation
    by pretending to be dead or unconscious to make him approach them.'
  language: English with some Latinized sexual phrasing in the source passage
  quote_policy: summarized
