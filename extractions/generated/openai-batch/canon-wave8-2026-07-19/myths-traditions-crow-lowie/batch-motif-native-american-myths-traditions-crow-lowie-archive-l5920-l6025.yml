- id: claim:2
  claim: An editorial note compares the race episode with Arapaho, Arikara, Pawnee,
    and Omaha variants, including shared features such as a buffalo-against-human-lives
    wager, the old woman’s cane, and the magpie.
  claim_level: same_motif
  target: Plains variants of the buffalo race involving Arapaho, Arikara, Pawnee,
    and Omaha traditions
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is based on Lowie’s note within the passage; the parallel
    versions are not reproduced here.
- id: claim:3
  claim: A note says the buffalo-wife motive appears elsewhere in the volume in a
    different setting, with Corn-woman as the second wife, and that Simms’ version
    substitutes an elk cow for Corn-woman.
  claim_level: same_motif
  target: Other Crow/Simms buffalo-wife settings involving Corn-woman or an elk cow
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The note identifies variants but does not provide their full narrative
