canonical_text:
  quote: ''
  summary: 'Looks-down survives several trials set by an old woman who wants to eat
    him: he retrieves a dangerous red-breasted wolf, obtains sticks from a closing
    hollow identified with the old woman’s body, wins a race around the world with
    bird helpers, and is carried upward by birds until he sees the whole world and
    wins the buffalo. Corn-woman explains the availability of corn and the disappearance
    of buffalo. The passage then begins a Buffalo-Wife tale in which a young Crow
    man mates with a buffalo cow stuck in mud, helps her out, and she later bears
    a male calf, described as the child of the Crow.'
  language: English
  quote_policy: summarized
