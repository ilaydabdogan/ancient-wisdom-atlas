  claim: An editorial note states that in a Pawnee version, this test likewise immediately
    follows the sweatlodge episode.
  claim_level: same_function
  target: Pawnee version of the test sequence following a sweatlodge episode
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
