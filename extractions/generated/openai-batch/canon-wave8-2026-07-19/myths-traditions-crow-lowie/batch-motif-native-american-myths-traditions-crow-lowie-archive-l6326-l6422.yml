canonical_text:
  quote: ''
  summary: A woman receives aid and warnings from animals who prepare hides and instruct
    her how to survive her husband's attempted killing. At a cliff trap involving
    a buffalo skull, an underground hole, badgers, and alligators below, the woman
    escapes and the husband falls. She flees with prepared objects that transform
    into landscape obstacles. She reaches a mountain tipi, circles it as instructed,
    and gains refuge. A boy inside defends her with guardian animals and then, using
    her medicine and weapons, kills the pursuing man. The woman and boy burn the man's
    body. The passage ends by noting the boy's seven brothers are out hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beavers, a porcupine, ants, and other animals help prepare and decorate a
    hide with quillwork and scented yellow material from pines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The helpers tell the woman to wear long moccasin strings and a loose blanket
    and warn her about an underground hole leading to a high cliff with a buffalo
    skull.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The helpers say mice will dig the underground hole and badgers will wait near
    the buffalo skull.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The helpers tell the woman to prepare stomach parts, sticks intended for arrows,
    and an arrow-smoother or rough stone before the next morning.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The husband leads the woman to the river and cliff, has her stand on the buffalo
    skull, and pushes her forward after pointing out alligators below.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman slips into the prepared hole while the badger holds her long moccasin
    strings; the husband falls over with her loose blanket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The woman returns to her tent, takes the prepared items, and runs away; the
    females who tanned for her give her their speed.
  category: sequence
  evidence_refs:
  - ev:2
