canonical_text:
  quote: ''
  summary: Old-Man-Coyote visits the lodges of the elk, condor, and crow, where bark
    is transformed into meat or fat and animal body parts supply grease or edible
    shavings. He brings food home to his wife and children and invites the hosts to
    visit him. Later the owl, elk, and condor visit Old-Man-Coyote. His attempts to
    reproduce their food-giving methods lead to an eye injury, bleeding neck, deliberate
    trickery, and one successful feeding of the condor.
  language: English
  quote_policy: summarized
