  text: Old-Man-Coyote goes hungry to the elk chief’s yellow lodge, where bark becomes
    fat and meat, and shavings from the elk’s neck are cooked into pudding for him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old-Man-Coyote visits a yellow tent with a black top belonging to the condor;
    bark covered with a blanket becomes fresh meat, and grease comes from the condor’s
    pierced nose.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old-Man-Coyote visits the crow’s black tent, is given water, receives meat
    and fat made from bark, and receives grease from the crow’s bill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
