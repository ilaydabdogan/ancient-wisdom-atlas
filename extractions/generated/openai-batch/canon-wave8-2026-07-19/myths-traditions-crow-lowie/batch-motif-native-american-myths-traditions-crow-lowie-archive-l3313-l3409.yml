canonical_text:
  quote: ''
  summary: A boy defeats an old woman’s dangerous bucket, then repeatedly goes to
    places an old woman warns him not to visit. A jack-rabbit exchanges eyes with
    him and gives instructions for surviving a snake lodge. The boy uses a flat stone,
    storytelling, sleep, and beheading to overcome the snakes, except for one that
    escapes. He then neutralizes a killer leaning tree and a widening creek/coulee
    with repeated arrow-and-bow tactics and commands them not to kill. At the end
    of the passage, the old woman warns him about a lake monster identified as a buffalo
    that eats people by opening its mouth.
  language: English
  quote_policy: summarized
