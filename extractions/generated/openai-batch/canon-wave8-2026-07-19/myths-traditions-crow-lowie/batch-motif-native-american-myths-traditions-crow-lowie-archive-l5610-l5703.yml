canonical_text:
  quote: ''
  summary: A woman travels with moccasins and corn balls toward a dangerous husband.
    Three mouse lodges warn that he kills his wives but cannot help her. A fourth
    lodge of badgers accepts her food and gives instructions for surviving a river
    bath death-trap involving a buffalo skull and a water monster. At the husband’s
    tipi, his mother welcomes her and asks him not to kill her. On the fourth morning
    the woman follows the badgers’ instructions, pushes the skull into the river,
    and is protected underground by the badgers when her husband becomes a bird and
    tries to seize her. She tears off his shell necklace, described as his medicine,
    and he loses power. Later she bears a son and returns with her husband to her
    home. The badgers had told her to keep the necklace hidden because it was his
    heart, but during a later swim the son finds it and the husband recovers it, then
    flies up as a bird.
  language: English
  quote_policy: summarized
