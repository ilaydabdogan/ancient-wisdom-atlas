candidate_motifs:
- id: motif:1
  label: Reversal of the rejected or insulted suitor
  taxonomy_refs: []
  basis: The young woman who previously insulted Plenty-badger later seeks to marry
    him, while he repeats the insulting language back to her and refuses her offers
    before eventually accepting marriage.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The earlier insult episode is referred to but not fully included in this
    excerpt.
- id: motif:2
  label: Marriage negotiation through gifts and kin mediation
  taxonomy_refs: []
  basis: The young woman's family offers horses and a big tipi; the grandmother defers
    to Plenty-badger; an old man advises acceptance; marriage follows the negotiated
    gifts.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents social negotiation, not necessarily a sacred exchange.
- id: motif:3
  label: Grandmother as domestic mediator
  taxonomy_refs: []
  basis: The grandmother manages access to Plenty-badger, decides whether to accept
    gifts according to his wishes, shelters the young woman, and later persuades Plenty-badger
    to live with his wife.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: This is a role pattern within the passage rather than a cross-text comparison.
- id: motif:4
  label: Child originator of a burial-visitation custom
  taxonomy_refs:
  - culture_hero
  basis: Black-elk's desire to return to his grandmother's tree burial site is followed
    by the statement that Crow people return to relatives' burial sites and that he
    started this custom.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage supports an origin-of-custom reading, but Black-elk is not
    otherwise described as a broad culture hero in this excerpt.
- id: motif:5
  label: Ritual adornment at naming
  taxonomy_refs: []
  basis: After the child is born and named Black-elk, Plenty-badger makes a braided
    switch with elk teeth and paints the boy's forehead yellow.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives the actions but does not explain their ritual meaning.
- id: motif:6
  label: Medicine conferring attractiveness in sham battle
  taxonomy_refs: []
  basis: Plenty-badger makes medicine for four male figures, and the passage then
    says they are the most handsome men in sham battle and attract women by whistling.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The causal relationship between the medicine and attractiveness is suggested
