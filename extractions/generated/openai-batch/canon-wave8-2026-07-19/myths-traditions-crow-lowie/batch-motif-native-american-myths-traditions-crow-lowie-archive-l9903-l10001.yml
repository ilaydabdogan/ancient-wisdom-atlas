canonical_text:
  quote: ''
  summary: A young woman who had earlier insulted Plenty-badger tries repeatedly to
    marry him, offering horses and other gifts through his grandmother and her own
    kin. Plenty-badger rejects and humiliates her at first, then accepts marriage
    after an old man's advice and gift negotiations, but delays cohabitation until
    winter. Their child Black-elk is named and ritually adorned. After the grandmother
    dies and is buried on a tree, Black-elk wants to return to the burial place, and
    the passage says he began the Crow custom of revisiting relatives' burial sites.
    Plenty-badger later makes medicine for selected male relatives and companions.
  language: English
  quote_policy: summarized
