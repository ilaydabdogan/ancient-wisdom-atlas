canonical_text:
  quote: ''
  summary: The passage contains the close of a Crow tale in which two enemy scouts
    shelter by a rock, communicate by signs, agree not to kill each other overnight,
    gamble with property and scalps, and then resume conflict; the scalped man later
    pursues the scalper and is killed. A note connects the story with Cunning-man
    and compares it to a Gamblers motive. The passage then gives short Cunning-man
    tales explaining cleaning advice, a custom of having both wife and mistress, and
    a marriage arrangement for Cunning-man’s son through hospitality and public witnessing.
  language: English
  quote_policy: summarized
