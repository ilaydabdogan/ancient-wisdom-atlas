candidate_motifs:
- id: motif:1
  label: Enemy truce at night before renewed conflict
  taxonomy_refs: []
  basis: The two warpath scouts agree not to harm each other during the night and
    sleep together before deciding what to do in the morning.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The wider beginning of the tale is outside this passage.
- id: motif:2
  label: Gambling substitutes for immediate combat
  taxonomy_refs: []
  basis: In the morning the Water-scraper proposes gambling rather than killing, and
    the two play the button game.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not present the game rules beyond naming the button game
    and mentioning sticks.
- id: motif:3
  label: Escalating wagers ending in a scalp
  taxonomy_refs: []
  basis: The betting progresses from guns and property to clothes and then to the
    gamblers' scalps.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No external motif number is supplied in the passage.
- id: motif:4
  label: Scalp-taking followed by pursuit and battlefield reversal
  taxonomy_refs: []
  basis: The scalped man brings mounted comrades to chase the scalper, counts coup
    on him, and is then killed by the man who took his scalp.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The relation between the gambling episode and later combat is clear, but
    the passage gives no additional explanation of the recognition at the end.
- id: motif:5
  label: Cunning-man as source of bodily and social practices
  taxonomy_refs:
  - culture_hero
  - trickster_boundary
  basis: Cunning-man gives prescriptive cleaning advice, and another Cunning-man episode
    is explicitly said to originate the present custom of keeping a mistress as well
    as a wife.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage labels the tales as Cunning-man stories but does not explicitly
    define Cunning-man as a culture hero or trickster; taxonomy mapping is functional
    and should be reviewed.
- id: motif:6
  label: Marriage secured through hospitality and public witnessing
  taxonomy_refs: []
  basis: Cunning-man draws the unmarried girl to his tent, seats her on his son's
    bed, summons old men to smoke around her, and the public report makes her married
    to his son.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage states the resulting marriage but does not explicitly describe
    the social rule behind the witnesses' declaration.
