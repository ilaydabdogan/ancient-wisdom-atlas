  text: The two men agreed not to harm each other during the night, put their knives
    away at the foot of the bed, and slept with their bodies touching.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the morning the Water-scraper proposed gambling instead of killing, using
    sticks for the button game.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gamblers wagered guns, a powder sack, a belt, clothes, and finally parts
    or all of their scalps.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Carrot-eater won back his property, stripped the Water-scraper, and then
