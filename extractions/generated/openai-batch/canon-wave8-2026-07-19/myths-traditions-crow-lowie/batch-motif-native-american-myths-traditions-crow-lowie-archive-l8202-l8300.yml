candidate_motifs:
- id: motif:1
  label: Human hosted by bird people and given avian powers
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: The man lives among bird beings, receives arrows, wings, eagle feathers,
    and several bird medicines, and is taught how to use the medicines.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage calls these powers medicine but does not provide a full doctrinal
    explanation of their source.
- id: motif:2
  label: Opening a sky-earth boundary with a ritual object
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: At the place where the sky touches the earth, the man uses a pipe and song
    to lift the sky so the birds can pass under it.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes passage under the sky rather than a full ascent
    through multiple heavens.
- id: motif:3
  label: Sweatlodge initiation after return from supernatural patrons
  taxonomy_refs:
  - initiation
  - return
  basis: The man returns to his people with the Seven Cranes, requires seven sweatlodges
    and pemmican, enters hot lodges, imitates a crane, and receives further instruction.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The exact ritual meaning of the seven sweatlodges is not explained in
    the passage.
- id: motif:4
  label: War medicine confirmed by omen test and songs
  taxonomy_refs:
  - sacred_exchange
  basis: Before raiding, the man performs four songs and climbs a buffalo-chip pile;
    the condition that falling chips would require retreat is not triggered.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call the chip-pile act an omen, but the
    conditional test is stated.
- id: motif:5
  label: Foretold captive bride identified by dress and horse
  taxonomy_refs: []
  basis: The Cranes foretell that a specific woman in the enemy camp, marked by a
    pinto horse and elkskin dress, must not be harmed because she will be the man’s
    wife; she is captured and later married.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The motif is a war-captive marriage in this passage; it should not be
    generalized to romantic quest patterns without more evidence.
- id: motif:6
  label: Transmission of medicine from father to son
  taxonomy_refs: []
  basis: The man gives his medicine to his son, who also becomes a war captain.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only the result of transmission is given; the ritual process of transfer
    is not described.
- id: motif:7
  label: Secretly born child abandoned in a buffalo wallow and approached by bulls
  taxonomy_refs:
  - miraculous_child
  basis: The young woman hides pregnancy, gives birth away from camp, the child is
    placed in a buffalo wallow, and seven bulls come along.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: This passage contains only the opening of the tale; later protection or
    miraculous development is not included in the supplied lines.
