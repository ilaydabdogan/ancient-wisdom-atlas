canonical_text:
  quote: ''
  summary: A Crow visionary lives among bird people, receives avian gifts and medicines,
    returns with the Seven Cranes for sweatlodge rites, then uses the medicine as
    a war captain to raid an enemy camp and marry a foretold captive woman. The passage
    then begins a separate tale, “The Bulls’ Ward,” in which a young woman secretly
    bears a child, leaves it in a buffalo wallow, and seven bulls approach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man stays in the Cranes’ tent, visits other bird tents, and sees tents
    marked by bird figures or colors.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cranes make arrows for the man, show him where deer are, and he kills
    a deer that is not afraid of him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cranes and other birds begin eating meat with the man; the bird country is
    described as having no winter and plenty of cherries and plums.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the man explains that Indians value eagle feathers, the cranes give
    him many eagle feathers, and he makes two war-bonnets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The birds make wings for the man, and he flies with the Seven Cranes to the
    place where the sky touches the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Big Crane gives the man a pipe; the man sings, lifts the sky with the
    pipe, and the birds pass under it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The man is told to choose medicine and receives medicine connected with a
    crane, a hawk, a condor, and the Big Crane.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: At the place where he had fasted, the bird medicine-givers tell the man what
    to do and how to use the medicine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The man sends word to prepare seven sweatlodges and pemmican, comes to camp
    with the Cranes, enters hot sweatlodges, makes a crane-like noise, and is told
    to dive facing upstream.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: After eating pemmican at the young Crow’s lodge, the Seven Cranes fly away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Seven Cranes tell the man to go on the warpath right away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before the raid, the man tells his followers to pile buffalo chips high; after
    four songs he climbs the pile, and none of it falls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Cranes have told the man that in four days he will kill a whole enemy
    camp, but he must not hurt a woman who will ride a pinto horse and wear an elkskin
    dress because she is to be his wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The war party attacks a camp while the men are buffalo hunting, kills the
    men, takes horses, tears tipi covers, breaks poles, and captures the woman wearing
    the elk-dress.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The man makes the captured woman ride the pinto horse; during the return he
    causes a storm and rain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The man later marries both the captive woman and a Crow woman, and he gives
    his medicine to his son, who also becomes a war captain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: In the beginning of “The Bulls’ Ward,” a young woman refuses marriage proposals
