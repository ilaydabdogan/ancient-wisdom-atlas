canonical_text:
  quote: ''
  summary: A boy repeatedly ignores his grandmother's warnings, obtains a beaver-tail
    knife and a stone kettle, enters a white tent of snakes, tricks and kills most
    of them, is later invaded by the surviving snake, lies as bones and skull until
    Thunder, rain, and sun help expel the snake, then alters and releases it, explaining
    why snakes sometimes bite. The passage ends with the boy encountering two men
    butchering buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman warns the boy not to go to a creek with dangerous beavers, but
    he goes there and kills a sleeping beaver.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The beaver's tail is a knife used for cutting; the boy cuts it off and gives
    it to the old woman.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At another prohibited creek, the boy takes a sleeping woman's stone kettle,
    faces it toward her, and she burns up after flying to it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman is afraid of her grandson, cannot find anything to kill him,
    and tells him not to go to a white tent on a ridge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy goes to the white tent carrying the beaver-tail knife and takes a
    flat stone inside.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Snakes in the tent direct the boy to sit in the rear, and one tries to enter
    his body from underground, but strikes the flat stone and retreats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The snakes give the boy food into which they have put their teeth; when the
    boy burns the food, the snakes suffer pain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy tells the snakes to lie in a circle around the fire with their necks
    on a stick while he tells stories; after they cease answering, he cuts off their
    necks with his knife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: One snake escapes underground and warns the boy not to sleep in the daytime.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy later sleeps in the daytime with arrows set up to watch him; the surviving
    snake enters his body and then his head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy breaks his own body at the waist and neck while trying to stop the
    snake, but his body lies in three parts until the skin has worn off, and the snake
    remains in his skull.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy's father sees the bones, sends Thunder, and Thunder's shot, rain,
    and the sun's heat fill and boil the skull so the snake begins to emerge.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boy seizes the snake by the neck, rises to his feet, grinds the snake's
    face against a stone, and releases it after it promises not to do anything more.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After release, the snake says that once in a while it will bite, and the passage
    states this is why snakes bite occasionally.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After returning to his grandmother, the boy hunts and meets two men butchering
    buffalo; the passage breaks off after one man offers him a buffalo foetus and
    chases him.
  category: sequence
  evidence_refs:
  - ev:9
