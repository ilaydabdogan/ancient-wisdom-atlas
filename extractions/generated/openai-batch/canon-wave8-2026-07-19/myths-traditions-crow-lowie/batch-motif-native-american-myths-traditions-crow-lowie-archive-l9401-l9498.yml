canonical_text:
  quote: ''
  summary: Raven-face shelters a rabbit from a sparrow-hawk. The hawk, rabbit, and
    later a male deer each transform into human form and grant or demonstrate running
    power. Dangling-foot, a marksman and Raven-face's comrade, hunts buffalo with
    Raven-face's horse, and the two confront Birik-o'oce enemies; Dangling-foot kills
    the named man Honest. Later Cheyenne destroy Dangling-foot's separated group.
    During a later buffalo hunt, Raven-face recognizes a mysterious dangerous buffalo
    bull, sends others away, and draws the bull toward the mountains. He uses in succession
    the powers or imitations of hawk, rabbit, and deer until his medicine is exhausted.
    The buffalo kills his horse and advances on Raven-face as the excerpt ends.
  language: English
  quote_policy: summarized
