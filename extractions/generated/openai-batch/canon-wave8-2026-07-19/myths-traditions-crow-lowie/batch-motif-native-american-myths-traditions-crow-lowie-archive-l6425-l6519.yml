canonical_text:
  quote: ''
  summary: A powerful boy revives his two dogs and presents a young woman as his sister
    to seven brothers led by Black-wolf, after saying he killed Worms-in-his-face.
    The young woman, who has tanning medicine from female animals, makes clothing
    and quill-work. While the brothers hunt, a threatening woman carrying an old man
    repeatedly visits, sings or says that a child will eat Black-wolf's liver, and
    rubs mucus from the old man's nose onto the quill-work. The young woman repeatedly
    forgets to report the visits until she uses a feather as a reminder. Black-wolf
    learns the visitor came four times, declares they cannot avoid death, sends the
    dogs away, and the brothers flee by shooting arrows through the smoke hole and
    following them. Red-woman arrives with owl feathers, sees evidence of their departure,
    and follows through the smoke hole with a digging-stick.
  language: English
  quote_policy: summarized
