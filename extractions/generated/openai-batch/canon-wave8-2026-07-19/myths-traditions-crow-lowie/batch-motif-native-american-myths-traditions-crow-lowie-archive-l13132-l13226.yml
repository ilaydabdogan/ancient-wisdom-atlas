canonical_text:
  quote: ''
  summary: A husband sees a poor young man near his wife's lodge, accuses his wife,
    and strikes her. Cunning-man treats her wound and advises her to marry the young
    man and leave camp. The couple flee into the woods and mountains, where they become
    starving. The young man encounters an unnamed hunter who kills antelope, gives
    him blood and manifolds, and instructs him to feed the same to his wife. The wife
    recovers, the young man dreams of the helper, and afterward he succeeds in killing
    antelope, deer, and eagles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man sits among horses tied at the young woman's lodge and hears
    her husband singing with others in camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband sees the young man leaving, returns to listen, and later asks
    his wife why she gave turnips to the young man; she denies involvement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband strikes his wife on the head, causing bleeding, and she goes to
    her parents' lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some people say the event is fitting because the rich man had taken his friend's
    wife too.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Cunning-man treats the woman's head wound and later tells the young man that
    they have done well so far and that he will speak to the woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cunning-man advises the woman to marry the young man or take him as her lover
    because her husband had hurt her for nothing, and she agrees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Cunning-man warns that the husband's brothers might make trouble and instructs
    the woman and young man to prepare for an absence from camp of about ten days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: At night the young woman comes to the young man; they ride double, stay in
    the woods, watch from a high hill by day, and continue toward the mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In a canyon shelter in the mountains, the young man cannot kill elk, deer,
    or rabbits; their calf meat is gone, his wife cannot walk from hunger, and he
    walks with a cane.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After lying on rocks and crying, the young man sees two antelope and an unnamed
    man who kills both antelope with arrows.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: The unnamed man gives the young man blood to drink twice and two mouthfuls
    of manifolds, then tells him to give the same to his wife, who is still living.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The unnamed man tells the young man to pack the antelope home; the young man
    expects the load to be impossible but finds it very light.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Magpies fly out of the shelter, leading the young man to think his wife is
    dead, but she is alive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After drinking blood and eating manifolds, the woman becomes well again, walks
    about, and can cook.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The young man dreams of the unnamed man and tells his wife the next morning
    that they will live.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Later the young man returns to the hunting place, kills two antelopes with
    arrows, brings them home, and cooks blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: On another hunt he kills an eagle, then kills a deer and uses it to attract
    and kill another eagle.
  category: action
  evidence_refs:
  - ev:8
