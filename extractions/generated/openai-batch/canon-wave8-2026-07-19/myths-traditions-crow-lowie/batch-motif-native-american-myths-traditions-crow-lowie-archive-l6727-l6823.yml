canonical_text:
  quote: ''
  summary: A dwarf searches for his adopted boy, using an eagle plume and a tiny ant
    to scout the witch’s tent. A mourning sister swallows a white stone near the mountains
    and gives birth to a rapidly maturing boy. The boy gains a feather-turned-sword,
    travels through the air to the witch’s tent, prepares with red clothing, paint,
    plume, and a lightning-marked horse, then splits the tent, frees the captives,
    and defeats the witch, from whose head red stones fall.
  language: English
  quote_policy: summarized
