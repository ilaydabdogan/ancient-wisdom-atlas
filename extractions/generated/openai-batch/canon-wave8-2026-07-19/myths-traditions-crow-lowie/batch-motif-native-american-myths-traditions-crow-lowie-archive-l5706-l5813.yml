candidate_motifs:
- id: motif:1
  label: Bird-man ascent and aerial observation
  taxonomy_refs:
  - ascent
  basis: The opening bird husband circles upward, and the grown Looks-down later flies
    up as a bird from his rock pile to observe his wives and their child.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage presents flight and upward movement, but not an explicit journey
    to a heavenly realm.
- id: motif:2
  label: Shape-shifting spouse and child
  taxonomy_refs:
  - shapeshifter
  basis: Buffalo-woman turns into a buffalo to give birth, her calf becomes a baby,
    her child later turns into a calf, and Looks-down is also shown flying as a bird
    and returning as a man.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: Corn-woman’s transformation is not directly described; she is associated
    with the cornfield rather than explicitly changing form.
- id: motif:3
  label: Marriage to women from above and below
  taxonomy_refs: []
  basis: Two good-looking singing women approach the young man from opposite directions,
    sit on opposite sides, bring paired gifts, and both become his wives.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly call the two women deities; their other-than-human
    nature is inferred only from their names, origins, and later events.
- id: motif:4
  label: Paired gifts accepted in ritual order
  taxonomy_refs:
  - sacred_exchange
  basis: The wives present paired left and right moccasins and corn balls to Looks-down
    and then to his mother; both recipients wait or are advised about which gift to
    accept first.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage narrates a formalized gift sequence, but it does not explain
    the exchange’s ritual meaning.
- id: motif:5
  label: Buffalo and corn co-wife opposition
  taxonomy_refs:
  - duality
  basis: The wives are distinguished by below/above, left/right, black/yellow hair,
    buffalo/corn names and gifts, and later quarrel with contrasting claims about
    labor and starvation.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  confidence: medium
  cautions: The opposition is strongly patterned in the passage, but broader cosmological
    meaning is not stated here.
- id: motif:6
  label: Departure after quarrel between supernatural wives
  taxonomy_refs:
  - departure
  basis: After the boys fight and the mothers quarrel, Buffalo-woman leaves with her
    son, and Corn-woman also prepares to depart while directing Looks-down to follow
    Buffalo-woman.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only the beginning of the departure sequence is included in this passage
    range.
