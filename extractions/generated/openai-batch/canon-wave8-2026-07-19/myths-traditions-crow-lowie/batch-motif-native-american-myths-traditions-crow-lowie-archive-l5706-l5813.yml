canonical_text:
  quote: ''
  summary: A bird-like husband named Looks-down departs upward after promising help
    and saying his boy will be like him. The boy grows up, repeatedly sits on a rock
    pile above camp, and is approached by two singing women, one from below and one
    from above, who bring paired moccasins and corn balls. They become his wives,
    later named Buffalo-woman and Corn-woman. Both women give birth outside the lodge
    in places associated with their names; the husband flies up to watch. Buffalo-woman
    becomes a buffalo and gives birth to a calf that becomes a baby, while Corn-woman
    returns from a cornfield with a baby. The two sons later quarrel over a game,
    the mothers quarrel, and the women leave; Buffalo-woman's son turns into a calf,
    and Looks-down flies as a bird to observe them near thorny bushes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Looks-down circles higher in the air, speaks to his wife from above, promises
    to help her, and says his boy will be the same kind of man as himself; when the
    woman and boy return from the river, people mock her because her husband is a
    bird and has gone away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy grows into a man, dresses up daily, goes to a little hill, piles rocks
    for a seat, sits looking down on the camp, and returns at sunset; his mother dresses
    and paints herself, plays the ball-kicking game alone, and is described as loving
    her son, who looks like his father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the young man stays until nightfall, he hears one singing voice from
    below and another from above; a black-haired woman from below sits on his left,
    and a yellow-haired woman from above sits on his right.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two women sing about the young man’s mother loving her own son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman from below brings a left moccasin and corn balls on a plate made
    of a buffalo head; the woman from above brings a right moccasin and corn balls
    on a wooden plate.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After advice about which gift to take first, the young man puts on the left
    moccasin, eats that corn, then puts on the right moccasin and eats the other corn;
    he says they should go home, and both women are his wives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Looks-down’s lodge, each woman gives her mother-in-law a corresponding
    moccasin and corn balls; the older woman puts on the left moccasin and eats that
    corn first, then puts on the right moccasin and eats the other corn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman from below is named Buffalo-woman, and the woman from above is named
    Corn-woman.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night, Buffalo-woman lies next to the tipi cover and Corn-woman on the
    other side; both rest their heads on their husband’s shoulders, he has his arms
    around both, and Corn-woman tells him to turn to Buffalo-woman first.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Looks-down’s mother later orders separate beds, and the husband sleeps with
    the two wives on alternate nights; after a while both women are pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Buffalo-woman becomes sick, she leaves with her blanket; Looks-down flies
    up from his rock pile and sees her at a buffalo wallow turn into a buffalo, give
    birth to a calf, then turn back into a woman while the calf turns into a baby.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When Corn-woman becomes sick, she goes out to a cornfield and returns with
    her baby wrapped in a deer hide; Looks-down watches her from above in order to
    learn what sort of wife he has, and both children are boys.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Buffalo-boy is named Calf and has a batsl' kisua game; the other boy is
    jealous, the boys fight over it, and the mothers quarrel.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the quarrel, Buffalo-woman says Corn-woman has made many people tired,
    and Corn-woman replies that she has saved many people from starving while Buffalo-woman
    has a black, wet nose and has caused many people to starve.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Buffalo-woman takes her son outside; Corn-woman prepares to leave and tells
    her husband to follow Buffalo-woman, not her, saying she is far back in the ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the women leave, Buffalo-woman’s child turns into a calf; Looks-down
    goes to his rock pile, flies up as a bird, and sees Buffalo-woman with her calf-child
    on a flat near thorny bushes, where they look for and find a passageway.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: An editorial note in the passage says the names Buffalo-woman and Corn-woman
    occur in an Omaha version of the Piqued Buffalo Wife tale and that more distinctive
    analogies occur in Skidi and Oglala variants.
  category: other
  evidence_refs:
  - ev:10
