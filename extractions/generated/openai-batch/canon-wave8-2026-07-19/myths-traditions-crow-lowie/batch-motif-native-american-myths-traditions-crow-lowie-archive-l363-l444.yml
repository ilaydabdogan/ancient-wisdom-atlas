  quote: ''
  summary: The passage is an introductory comparative discussion of Crow, Hidatsa,
    and related Plains and Siouan traditions. It notes close Crow-Hidatsa tale relationships,
    shared or similar character names, parallel incidents in Grandchild, trickster,
    and Thunderbird materials, and weighs recent borrowing against older common inheritance.
    It also cautions that reconstructing an original Siouan mythology is difficult
    because later borrowing and neighboring influences obscure older material.
  language: English
