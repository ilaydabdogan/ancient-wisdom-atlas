    a Birik-o'oce boy, and the boy's departure to get a vision.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: In the variant, the boy stays through winter at a Rocky Mountains peak after
    a being tells him to wait there until his father comes when the animals have young.
  category: sequence
  evidence_refs:
  - ev:10
