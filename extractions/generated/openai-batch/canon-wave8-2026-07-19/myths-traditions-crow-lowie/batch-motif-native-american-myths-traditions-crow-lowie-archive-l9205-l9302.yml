canonical_text:
  quote: ''
  summary: The passage recounts a boy's repeated race with One-eye at an ice-hole,
    One-eye's failed offers to avoid the race, the boy's use of a sacred whip to make
    One-eye's horse fall, and One-eye's death. The boy then restores horses and women
    taken by One-eye and becomes a defender of the camp. A second fasting boy receives
    medicine and songs after a mountain ordeal involving hail and lightning, returns
    to marry two girls, and joins the first boy as a chief. A numbered variant introduces
    hostile clans, a boy's winter vision quest in the Rocky Mountains, instructions
    to build seven sweatlodges, and a controlled display of fire power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One-eye tells the boy that they will race, turn at the hole, and that the
    one who falls or slips will be killed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy is not afraid; One-eye sees the boy's paint, becomes scared, and offers
    a tent, an elk dress, and horses if the boy will not race.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: One-eye is described as having six wives whom he had taken from parents and
    husbands, including the boy's present wife from her parents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One-eye is described as unable to be killed by shooting; being shot does not
    hurt him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy refuses One-eye's gifts and insists that the race be run and finished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One-eye makes medicine and sings during the racing sequence, and the boy sings
    the same songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The racers repeatedly run to the ice-hole and back without either one falling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before reaching the ice-hole on a later run, the boy whips One-eye's horse
    with a sacred whip; the horse slips and falls, and the boy shoots One-eye and
    breaks his head with a club.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boy drags One-eye to another hole and throws him in; a bear and mountain
    lion living in the tipi below eat him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After killing One-eye, the boy tells the frightened people he will not do
    what One-eye had done and instructs them to take back horses and wives taken by
    One-eye.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy says that when the fasting boy returns he should marry the two girls
    whom One-eye had taken from their parents.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The boy later kills enemies who come to the camp, is said not to be shot,
    and is described as one of the bravest men in camp.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The other boy fasts in the Bighorn Mountains, dreams that he is wanted on
    the Wolf Mountains, and goes there to fast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: During a hailstorm on the Wolf Mountains, lightning strikes the fasting boy
    and he lies unconscious; the hail does not touch him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the fasting boy gets up, he sees a man who gives him medicine, teaches
    him songs, says he had adopted One-eye and taken his medicine back, and gives
    instructions for the boy's return to camp.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The returning fasting boy marries the two girls, receives better clothes,
    owns One-eye's horses, and later joins the other boy in war parties; the two become
    chiefs of the camp.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The numbered variant describes the Ack-a'mne and Birik-o'oce as hostile clans,
