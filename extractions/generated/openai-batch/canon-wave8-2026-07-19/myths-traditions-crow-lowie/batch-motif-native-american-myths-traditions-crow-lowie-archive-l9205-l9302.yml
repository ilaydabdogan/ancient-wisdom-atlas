candidate_motifs:
- id: motif:1
  label: lethal contest with feared oppressor
  taxonomy_refs: []
  basis: The passage centers on a race governed by a death rule, repeated attempts
    by One-eye to avoid the contest, and the boy's eventual killing of One-eye during
    the race.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage begins mid-sentence, so the earlier setup for the contest
    is outside this extraction range.
- id: motif:2
  label: restoration after tyrant's defeat
  taxonomy_refs: []
  basis: After One-eye is killed, the boy explicitly says he will not act like One-eye
    and has horses and wives taken by One-eye returned to families or husbands.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The label 'tyrant' is supported especially by the variant's wording and
    by One-eye's actions in this passage.
- id: motif:3
  label: mountain fasting vision and empowered return
  taxonomy_refs:
  - mystical_quest
  - initiation
  - return
  basis: The second boy fasts in mountain settings, undergoes hail and lightning,
    receives medicine and songs from a man, returns to camp, marries, and becomes
    a chief; the variant also has a boy go out to obtain a vision and return with
    power.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage uses the terms fasting and vision, but the full ritual context
    is only partially represented in this excerpt.
- id: motif:4
  label: supernatural sanction for bad deeds
  taxonomy_refs:
  - divine_judgment
  basis: The man who appears to the fasting boy says he had adopted One-eye, had taken
    back One-eye's medicine, and that One-eye had been killed for many bad deeds.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage calls the figure a man, not a deity; the taxonomy reference
    is approximate and should be reviewed.
- id: motif:5
  label: invulnerable or hard-to-shoot warrior protector
  taxonomy_refs: []
  basis: One-eye is described as unharmed by shooting before his death; after One-eye
    is killed, the boy who protects the camp is also said not to be shot.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The exact nature of invulnerability is not explained in this excerpt.
- id: motif:6
  label: controlled fire as display of power
  taxonomy_refs: []
  basis: In the variant, the boy states he will only show his power, blows pipe smoke
    over stones, sets fire to the other side of camp, and stops the fire.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The fire affects the camp, not the world; no world-destroying fire taxonomy
    is assigned.
- id: motif:7
  label: ritual or adoptive kinship linked to power
  taxonomy_refs: []
  basis: The passage includes One-eye offering to make the boy his brother, the medicine
    giver saying he had adopted One-eye, instructions to call the boy thrown under
    the ice younger brother, and the variant boy calling a horse-owner father.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:11
  confidence: medium
  cautions: The passage gives several kinship statements, but their precise ritual
    or social meaning is not fully explained.
