canonical_text:
  quote: ''
  summary: Old-Man-Coyote obtains fat associated with ice, becomes stuck, summons
    animals by claiming to have created them, uses their actions to free himself,
    kills and cooks fat animals, and later retaliates against Ci'rape' for eating
    his food. An editorial note identifies the securing of fat as a recurring motive
    in the Old-Man-Coyote cycle. The variant 7a describes coyotes using rocks or bells
    tied to their tails to make fat come from ice; Old-Man-Coyote imitates the practice
    despite a warning not to do it four times, becomes stuck, and summons prairie-chickens
    and a raven to gather and announce food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old-Man-Coyote returns to the ice, eats fat while going around four bends,
    then slips and freezes stuck to the ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While stuck, Old-Man-Coyote calls the animals and says he created them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old-Man-Coyote describes the prairie-chicken, mouse, and beaver as beings
    made by him from clay, a rose-bush, foam, and other materials.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old-Man-Coyote instructs the prairie-chicken to gather bull-berries, tells
    the beaver to cut a cottonwood tree for a club, and tells mice to get under his
    rump while he sings and strikes the ice.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The mice's action loosens Old-Man-Coyote; after standing up, he kills the
    fattest animals he can reach, builds a fire, and cooks them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ci'rape' eats the remaining food while Old-Man-Coyote rests and runs away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Old-Man-Coyote tracks Ci'rape', finds him sleeping after eating, pins him
    to the ground with a sharp stick, and builds a fire so the wind blows it toward
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ci'rape' leaps up and runs away with his guts scattering; Old-Man-Coyote later
    says he has eaten his comrade's excrements.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An editorial note states that the securing of fat described here is a favorite
    motive of the Old-Man-Coyote cycle, and that in other versions Ci'rape' is absent
    or subordinate.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the variant, coyotes have rocks or bells tied to their tails; when these
    strike the ice, fat comes out and they eat it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Old-Man-Coyote trades his game dart to have the fat-producing arrangement
    made for him, eats fat, retrieves the dart, and runs off.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Old-Man-Coyote repeats the practice at several creeks and, despite a warning
    not to do it four times, performs it a fourth time, falls on his rump, and becomes
    stuck in the ice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After becoming stuck in the variant, Old-Man-Coyote asks prairie-chickens
    to bring rose berries and asks a raven to announce to all animals that he has
    food and is inviting them.
  category: speech
  evidence_refs:
  - ev:8
