  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family exactly names the magic-flight obstacle sequence.
- id: motif:5
  label: Monster or witch destroyed by guardian animals and complete burning
  taxonomy_refs: []
  basis: The little boy’s tiger and bear kill Red-woman; her body is burned, and every
