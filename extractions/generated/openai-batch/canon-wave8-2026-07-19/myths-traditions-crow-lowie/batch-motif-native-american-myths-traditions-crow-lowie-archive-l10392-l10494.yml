canonical_text:
  quote: ''
  summary: 'The passage gives the Crow tale of Red-woman: a transformed water-animal
    man courts a young woman at a spring; an old woman helps the wife complete an
    impossible buffalo-hide task; the husband attempts a river-bank killing but is
    eaten and revived; the wife flees Red-woman using objects that become obstacles;
    a child helper’s tiger and bear kill Red-woman, whose body is burned; seven brothers
    then ascend and become the Seven Stars. The passage then begins a separate Bear-woman
    tale with two sisters and a request to imitate a bear.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red-woman adopts a good-looking young man as her younger brother; he is described
    as originally a water animal transformed into a man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young woman steps on an old buffalo skull while going to dip water at a
    spring, and a young man appears beside her and courts her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An old woman warns the young woman that the man’s sister is bad and that she
    will be required to tan the hide of a large buffalo bull within four days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old woman instructs the young woman to call on Grandmother for help when
    staking and tanning the hide.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the husband kills a large bull and gives the hide to the young woman,
    ants come when she calls for help and clean, scrape, and tan the hide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red-woman urges her brother to hurry because she is anxious to get rid of
    the young woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband takes his wife out for a bath and tells her to stand on a buffalo
    skull, but she refuses to die on it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Moles dig where the young woman’s feet are, softening the ground, and the
    husband calls to the fathers on the river bank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young woman slips through the hole; the husband goes over the bank into
    the river, and the fathers eat him despite his saying who he is.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The young woman retrieves concealed porcupine quills, powdered stuff, digging-sticks,
    and a root-digger supplied by the old woman, then runs away.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: After the fathers realize whom they have eaten, they make the man alive again,
    and he tells Red-woman what happened.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: During Red-woman’s pursuit, the fleeing woman throws porcupine quills that
    become cactus, powder that becomes thistle-like trees, a digging-stick that becomes
    a gulch, and draws a line with a root-digger that becomes a swift stream.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The fleeing woman reaches a white tipi, asks a little boy outside for help,
    runs around four times as instructed, and enters.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Red-woman seizes the little boy, but he tells the woman to release his dogs,
