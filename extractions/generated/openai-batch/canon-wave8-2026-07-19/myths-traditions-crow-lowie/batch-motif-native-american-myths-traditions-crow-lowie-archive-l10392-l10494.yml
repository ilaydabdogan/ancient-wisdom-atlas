  confidence: high
  cautions: The passage does not explain who the fathers are or how the revival is
    performed.
- id: motif:4
  label: Magic flight with thrown or used objects becoming obstacles
  taxonomy_refs: []
  basis: The fleeing woman delays Red-woman by causing quills, powder, a digging-stick,
