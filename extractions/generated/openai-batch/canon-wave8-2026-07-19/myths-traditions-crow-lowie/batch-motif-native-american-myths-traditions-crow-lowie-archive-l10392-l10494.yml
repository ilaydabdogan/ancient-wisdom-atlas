- id: motif:2
  label: Impossible hide-tanning task completed by animal helpers
  taxonomy_refs: []
  basis: The young woman is required to prepare a large buffalo bull hide; when she
    follows the old woman’s instruction to call for help, ants clean, scrape, and
    tan it.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family exactly matches this task-helper pattern.
- id: motif:3
  label: Mistaken devouring followed by revival
  taxonomy_refs:
