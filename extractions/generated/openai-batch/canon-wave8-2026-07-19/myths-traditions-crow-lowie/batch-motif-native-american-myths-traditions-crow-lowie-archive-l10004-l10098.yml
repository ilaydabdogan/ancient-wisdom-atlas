canonical_text:
  quote: ''
  summary: The passage begins with the close of a prior account involving vision-like
    dress, whistles, and a girl becoming a medicine woman. The main tale concerns
    Hii'ara'wic, also glossed as All-the-time-coming or Comes-all-the-time, who is
    humiliated by a young woman at a spring. After recovering, he sets out seeking
    medicine. Several animal figures redirect him until a bull elk, who becomes an
    elk-man, gives him medicine, a flute-centered demonstration, and instructions
    to strike coups before approaching the young woman. Hii'ara'wic follows the instructions,
    returns with prestige, uses incense and flute medicine, and the young woman enters
    his tipi. The tale ends with her kin bringing horses and property, his marriage
    to her, and their son becoming a chief.
  language: English
  quote_policy: summarized
