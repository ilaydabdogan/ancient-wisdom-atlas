canonical_text:
  quote: ''
  summary: The passage first closes a preceding tale in which a squirrel-man reports
    that his comrade became cannibalistic and was later found fleshless, dangling
    from a tree. The main tale follows two young men who encounter a huge animal blocking
    their way. One eats its burned flesh and gradually transforms into a hairy, horned
    being. He asks his comrade to throw him into the river, where he becomes enormous
    and disappears. After two days he reappears as a person, says his father has sent
    instructions, gives two unfailing arrows, and directs his comrade in a future
    war party, river crossing, and buffalo offering. The comrade follows the instructions,
    offers a special buffalo to the father, crosses shallow water, and obtains horses.
    A final sentence begins a later visit to the transformed friend but is cut off.
  language: English
  quote_policy: summarized
