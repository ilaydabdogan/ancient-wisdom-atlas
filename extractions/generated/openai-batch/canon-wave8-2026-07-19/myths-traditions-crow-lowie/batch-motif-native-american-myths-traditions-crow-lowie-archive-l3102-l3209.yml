canonical_text:
  quote: ''
  summary: A woman in the sky uncovers a hidden hole, sees people below, and longs
    to return. Her husband prepares a rawhide bucket and braided buffalo sinew to
    lower her and her son through the sky-hole, but the cord is too short and is broken
    by a thrown stone; the woman dies and the boy survives. The boy wanders, damages
    a garden, and is eventually fed and taken in by an old woman identified as the
    Moon. The passage ends with the boy discovering an alligator-like being under
    a covered box eating pudding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo chip lies over a hole in the sky; when the woman moves it, she can
    look down and see many people below.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After looking through the hole, the woman remembers her people, cries, cannot
    eat, and feels homesick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband says the woman has done what he told her not to do and says he
    will send her back home in four days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband kills a buffalo, uses the hide to make a bucket with a wooden
    rim and handle, and has buffalo sinew braided and dried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband's mother asks him to send the wife alone and leave the son behind,
    but he says that if the boy goes down he will come back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman reopens the sky-hole, ties the braided sinew to the rawhide bucket,
    gets into the bucket with her boy, and is lowered toward the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One sinew, identified as the sinew from the loins, has been forgotten, and
    the lowering cord runs out before the bucket reaches the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband throws a round stone; it strikes the woman, breaks the sinew string,
    and she falls to the ground and dies, while the boy survives and calls to his
    mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy wanders alone, throws stones at birds, enters a garden, and breaks
    squashes, corn ears, and leaves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old woman who owns the garden sees damage and tracks; she leaves a ball,
    bow, and arrows, and later finds the ball still there but the bow and arrows gone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old woman hides near the garden, speaks to the boy as her grandson, gives
    him corn cake and pemmican, and leads him to her tipi.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The narrator identifies the old woman as the Moon and says she is afraid the
    boy may someday kill her.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Moon leaves pudding under a covered box by the door; the boy later sees
    something moving there and finds a kind of alligator eating the pudding.
  category: action
  evidence_refs:
  - ev:11
