canonical_text:
  quote: This woman was skilled at everything, her name was Turtle-woman. This is
    a true story.
  summary: A brother-in-law urges a husband to kill and eat his wife, but the husband
    refuses. Warned by her sister-in-law, the woman leaves for a high hill and establishes
    a shelter in a place with game and little or no snow. She hunts deer, feeds and
    rescues her weakened husband, and later helps him recover. The hostile brother-in-law
    is reported dead. The husband resumes hunting, and the passage names the woman
    Turtle-woman.
  language: English
  quote_policy: quoted
