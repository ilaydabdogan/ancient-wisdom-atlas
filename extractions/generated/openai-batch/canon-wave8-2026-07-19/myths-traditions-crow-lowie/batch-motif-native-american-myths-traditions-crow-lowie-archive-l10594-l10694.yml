canonical_text:
  quote: ''
  summary: A younger sister tells her elder brothers that her elder sister has become
    a bear, destroyed many people, and threatens to eat her unless she performs a
    difficult jack-rabbit task. The brothers help her meet the demand, then instruct
    her to set awls in a crooked escape path. After the younger sister strikes the
    elder sister's shinbone, the elder sister turns into a bear and pursues her. The
    girl and her brothers delay the bear with awls, porcupine quills, and buffalo
    manifolds that become flat rocks, but the bear eventually escapes because of supernatural
    power and follows their tracks.
  language: English
  quote_policy: summarized
