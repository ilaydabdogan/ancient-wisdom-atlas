canonical_text:
  quote: ''
  summary: A battle ends with Looks-at-the-white-buffalo discarding his weapons and
    being killed and burned by Sioux enemies while two Crow witnesses observe. His
    people mourn and, fearing One-eye, arrange a kin-mediated peace through One-eye’s
    sister, a medicine-pipe, and shared smoking. One-eye agrees to peace and the camps
    join, but later he nearly kills a young man at a creek. The injured young man
    leaves to fast and seek dreams against One-eye. In winter One-eye uses medicine
    to bring buffalo to the ice, and boys find dead buffalo along the river.
  language: English
  quote_policy: summarized
