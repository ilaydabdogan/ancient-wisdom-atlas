candidate_motifs:
- id: motif:1
  label: Heroic self-offering after laying down weapons
  taxonomy_refs:
  - sacrifice
  basis: Looks-at-the-white-buffalo discards his weapons, asks the Sioux to kill him,
    and is later said to have wished to die because he did not want to kill his own
    people.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The passage presents his death as intentional and kin-related, but does
    not explicitly frame it as ritual sacrifice.
- id: motif:2
  label: Body continues moving after beheading
  taxonomy_refs: []
  basis: After the enemies cut off Looks-at-the-white-buffalo’s head, his body still
    moves before it is burned.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No resurrection or return is described in this passage.
- id: motif:3
  label: Peacemaking through sacred pipe and smoke
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: A medicine-pipe and tobacco pipe are used in the approach to One-eye; smoking
    accompanies the stated desire to make peace, and One-eye agrees.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy link to covenant or sacred exchange is interpretive; the
    passage itself describes peace-making, pipe handling, and smoking.
- id: motif:4
  label: Child summons dangerous figure into ritualized encounter
  taxonomy_refs: []
  basis: The little boy calls One-eye four times to come eat, causing One-eye to enter
    under the medicine-pipe despite his reluctance.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explain why the child’s repeated call is effective
    beyond the narrated sequence.
- id: motif:5
  label: Kin-mediated reconciliation of separated related peoples
  taxonomy_refs:
  - covenant
  basis: The husband says the groups are the same kind of people, separated and at
    war for a long time, and asks to make peace; One-eye agrees and the camps join.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The kin relationship is stated in social terms; broader historical or
    mythological implications are not established in the passage.
- id: motif:6
  label: Treacherous attack at a water crossing
  taxonomy_refs:
  - water
  basis: One-eye waits at the creek, tells the young man to drink, then holds his
    head down until he cannot move.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The water symbolism is limited to the creek setting; the passage does
    not explicitly interpret the creek.
- id: motif:7
  label: Fasting quest for dream power after injury
  taxonomy_refs:
  - initiation
  - mystical_quest
  basis: After being harmed, the young man leaves for two or three seasons, fasts
    at many places and in a mountain shelter, and has dreams while seeking ability
