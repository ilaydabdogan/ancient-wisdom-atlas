canonical_text:
  quote: ''
  summary: The passage concludes a Nez Perce-Hidatsa adoption and friendship account
    through repeated visits and exchanges that end former enmity. It then tells of
    a Flathead child captured by a Hidatsa war party, adopted by a Hidatsa chief,
    sought by his birth father with horses, and eventually returning to the Flathead
    and becoming a chief. The final portion begins a Crow-Sioux horse-raiding episode
    in which Little-head and Bull-snake are surrounded near a poor shelter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nez Perce and Hidatsa parties repeatedly visit one another, exchange horses,
    corn, food, and other presents, and are said not to be enemies afterward.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A boy with both a Hidatsa adopter and a Nez Perce father asks where he should
    stay; the Hidatsa father lets him choose, and the boy goes with his Nez Perce
    father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Hidatsa war party attacks a tipi near many horses, kills the woman there,
    takes the child and horses, and gives the child to their chief to be raised.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Flathead father later learns the Hidatsa have his son, travels with good
    horses, signals the Hidatsa camp with flashing lights, and tries to buy the child
    back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hidatsa chief refuses to give up the adopted young man, gives the horses
    to the young man, and the Flathead father leaves crying.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The adopted young man hears that his father had come and gone crying, feels
    bad, leaves the Hidatsa, follows his father’s trail, and becomes a chief among
    the Flathead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Little-head and Bull-snake remain near a Sioux camp after other Crow raiders
    flee, enter the camp to take horses, and are driven to a small tree-shelter where
    they are surrounded.
  category: sequence
  evidence_refs:
  - ev:7
