  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:2
  type: summary
  locator: lines 9308-9312
  quote_or_summary: The beaten wife goes to the young man; after One-eye has a herald
    ask for her return, the young man tells the herald to announce that Bear-comes-fromafar
    has her, that she was ill-treated, and that he will marry her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:3
  type: summary
  locator: lines 9312-9316
  quote_or_summary: One-eye says the couple must be about the same age and sends them
    a horse; the young man refuses it, but his comrade accepts it.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:4
  type: summary
  locator: lines 9316-9320
  quote_or_summary: The young man invites old people and asks where there are many
    horses; one says they are far away among the Ackapka-wia clan.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:5
  type: summary
  locator: lines 9320-9324
  quote_or_summary: The young man says One-eye will be dead by the time they return;
    they capture many horses, and the narrator says this explains how the Crow got
    many horses and how the sweatlodge originated.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:6
  type: summary
  locator: lines 9326-9336
  quote_or_summary: Raven-face, living in the narrator's grandmother's time, is good-looking;
    his younger brother Arrow-head is also good-looking. Raven-face owns a fast bay
    horse named It-has-a-rabbit-foot-necklace, and the Birik-o'oce dislike him because
    their wives are infatuated with him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:7
  type: summary
  locator: lines 9336-9341
  quote_or_summary: A young man friendly to Arrow-point warns him that the Birik-o'oce
    will kill him if he goes to their separate camp; the camp is later seen upstream.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: lines 9342-9349
  quote_or_summary: A young woman, the sweetheart's comrade and a tabooed relative
    by marriage, passes Arrow-point without looking but says that people are waiting
    to kill him; he replies that they have no reason and will not kill him.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: lines 9354-9358
  quote_or_summary: Birik-o'oce men smoke in camp, say they will kill Arrow-point
    if he passes, and shoot him as he passes; he falls and his horse runs away.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:10
  type: summary
  locator: lines 9359-9365
  quote_or_summary: Raven-face is flirting in his own camp when his brother's horse
    comes up and a voice says Arrow-point is killed; Raven-face makes a bridle, takes
    bow and arrows, and sets out.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:11
  type: summary
  locator: lines 9366-9372
  quote_or_summary: The Birik-o'oce arm themselves and walk toward Raven-face; he
    passes through them, shoots one through the spine, and is hit in the arm.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:12
  type: summary
  locator: lines 9372-9378
  quote_or_summary: At the last man, his best friend Left-hand, Raven-face asks him
