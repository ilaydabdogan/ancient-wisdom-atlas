    already killed Raven-face's good brother.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summary only.
- id: ev:13
  type: summary
  locator: lines 9379-9386
  quote_or_summary: After healing, Raven-face shortens a gun barrel and spends winter
    sleeping and mourning in different places seeking a vision; in a sleety storm
