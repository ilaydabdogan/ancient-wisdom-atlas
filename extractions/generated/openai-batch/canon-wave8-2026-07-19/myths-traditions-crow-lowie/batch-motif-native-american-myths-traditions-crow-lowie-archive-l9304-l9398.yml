canonical_text:
  quote: ''
  summary: 'The passage closes an account in which Bear-comes-fromafar takes in an
    ill-treated wife of One-eye, sends public notice that he will marry her, refuses
    a horse gift that his comrade accepts, and leads a horse-taking expedition said
    to explain how the Crow got many horses and how the sweatlodge originated. It
    then begins the tale of Raven-face: Raven-face and his brother Arrow-head/Arrow-point
    are handsome men. Men of the Birik-o''oce clan, jealous because Raven-face attracts
    their wives, warn and then kill Arrow-point when he comes to their separate camp.
    Raven-face learns of his brother''s death from the brother''s horse, arms himself,
    rides against the Birik-o''oce, wounds one enemy, is wounded, and is spared by
    his friend Left-hand. Later, while mourning and seeking a vision in winter, he
    shelters in a bear cave with cubs. The parent bears do not harm him; the male
    bear lifts him up while singing, asks him whether he sees the whole world, and
    tells him he has nothing to fear as a cause of death while he has teeth.'
  language: English
  quote_policy: summarized
