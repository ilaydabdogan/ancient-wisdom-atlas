candidate_motifs:
- id: motif:1
  label: origin of horse wealth and sweatlodge
  taxonomy_refs:
  - culture_hero
  basis: The narrator explicitly states that the events explain how the Crow got many
    horses and how the sweatlodge originated; the young man organizes the inquiry
    and horse capture.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage names an origin function but the available taxonomy has no
    specific horse-wealth or sweatlodge-origin category; 'culture_hero' is a broad
    fit only for the origin-bringing function.
- id: motif:2
  label: rescue or transfer of an abused wife from a coercive man
  taxonomy_refs: []
  basis: One-eye beats a wife; she goes to the young man, who announces that he has
    her and will marry her.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not elaborate the woman's agency beyond going to the
    young man, and no available taxonomy reference directly matches this social episode.
- id: motif:3
  label: jealous clan kills attractive brother
  taxonomy_refs: []
  basis: The Birik-o'oce dislike Raven-face because their wives are infatuated with
    him, and they kill his younger brother Arrow-point after warnings.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: This is a local plot pattern in the passage, not tied to an available
    motif-family reference.
- id: motif:4
  label: horse announces a death
  taxonomy_refs: []
  basis: Arrow-point's horse runs away after he is shot; later the horse comes to
    Raven-face and a voice says Arrow-point has been killed.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not clarify whether the voice belongs to the horse or
    is otherwise associated with its arrival.
- id: motif:5
  label: brother avenges murdered brother
  taxonomy_refs:
  - sibling_pair
  basis: After learning Arrow-point is killed, Raven-face takes weapons, rides against
    the killers, and shoots one of them.
  evidence_refs:
  - ev:10
  - ev:11
