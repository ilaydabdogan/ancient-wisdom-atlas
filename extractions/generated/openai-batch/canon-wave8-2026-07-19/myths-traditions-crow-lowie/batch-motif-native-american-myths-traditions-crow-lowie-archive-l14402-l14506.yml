canonical_text:
  quote: ''
  summary: The passage first recounts Humpback reporting events at the Crow camp,
    after which Holds-the-tail mourns and undertakes a Sun Dance with ritual preparations,
    plumes, paint, dancing, and fasting. It then gives a historical tradition about
    the Hidatsa warrior Lifts-heart, who refuses to surrender to Sioux enemies, survives
    with a boy companion, kills multiple Sioux chiefs in night raids, is recognized
    by his song, and later repels Sioux at a lake pit until they move away in fear.
  language: English
  quote_policy: summarized
