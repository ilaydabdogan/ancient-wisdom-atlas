  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the buffalo's stomach, the boy touches dead bodies and living people
    and urges the living people to look for a way out.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boy touches the buffalo's heart and kidneys, cuts them off, cuts up the
    kidneys for the people inside, and the buffalo dies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy cuts openings between the buffalo's ribs and brings out four living
