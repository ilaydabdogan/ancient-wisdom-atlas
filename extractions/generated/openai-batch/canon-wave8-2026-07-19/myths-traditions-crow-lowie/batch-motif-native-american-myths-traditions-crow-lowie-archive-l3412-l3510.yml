canonical_text:
  quote: ''
  summary: A boy identified in the passage as Ka'ricbapi'tuac enters a people-eating
    buffalo, kills it from inside, rescues four living men, and teaches them to hunt
    buffalo with bows, arrows, and knives. The passage then lists harmful beings and
    states that he was sent from above to kill bad things on earth. Later, despite
    setting arrows and a bow as guards while sleeping, he is killed when a snake enters
    his body. His sky father, aided by bird and animal messengers, locates his bones
    and has his skull placed toward the sun. Rain and heat draw the snake out; the
    boy catches and subdues it, but the snake's later partial defiance explains continuing
    headaches, infant sickness, worms, and biting snakes.
  language: English
  quote_policy: summarized
