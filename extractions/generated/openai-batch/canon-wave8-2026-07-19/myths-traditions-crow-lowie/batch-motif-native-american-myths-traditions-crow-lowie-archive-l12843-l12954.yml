canonical_text:
  quote: ''
  summary: The passage contains a short account of four young men testing different
    ritual practices for chiefly status and longevity, a tale in which a skeptical
    husband disbelieves repeated dangers and warnings until a Sioux raid separates
    him from his wife, and the opening description of Cunning-man as a wise knower
    of character and the future.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Four young men who had not yet joined a war party agree that each will follow
    a different practice: fasting, mourning, and self-torture; prayer to the Sun;
    tending and praying to the sweatlodge; or giving presents to and feeding a''sa''ke.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The different practices are followed by different life outcomes: early prominence
    and death, fame and death, chiefly status with normal lifespan, and old age as
    a great chief with very strong power.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Leaves-camp-all-the-time camps on a mountain side before the main camp moves,
    goes hunting, and his wife goes out to pick sarvis berries near thick brush.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife repeatedly encounters bears while berry picking; the first two bears
    chase her to the tipi and wait outside, and her husband kills them; a third bear
    is also killed after she reports seeing it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crow hunters warn the wife to move back to camp, but her husband does not
    believe the warning when she tells him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sioux come at night, steal horses, surround the tipi, and one touches the
    woman under the tipi cover while her husband assumes it is only comrades teasing
    her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife hides, escapes with her boy to the thicket, and the Sioux hear the
    boy crying but she and the child get away into the bushes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After waking, Leaves-camp-all-the-time makes medicine, arms himself, fights
    the Sioux, takes horses, and brings Crow men back to the camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wife is found after three days without food; she says she stayed away
    because she is angry with her husband, refuses to return to him, and leaves him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Cunning-man is described as originally one man who knew a man's character
    on sight, knew the future, and was consulted by people about their fortunes.
  category: attribute
  evidence_refs:
  - ev:7
