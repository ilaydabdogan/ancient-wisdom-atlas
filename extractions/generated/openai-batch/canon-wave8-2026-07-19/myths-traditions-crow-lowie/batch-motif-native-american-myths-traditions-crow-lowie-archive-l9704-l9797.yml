canonical_text:
  quote: ''
  summary: A weakened boy and an injured blinded woman are near death. A white-tailed
    deer restores the woman's ankle tendons, and an owl-woman restores her eyes. The
    boy meets a buffalo-hunting man who feeds him blood and paunch, gives him marked
    arrows, and identifies himself as a snake. The boy brings food and blood to the
    healed woman; they marry, gain horses and eagle feathers, and return home. The
    passage explains Crow arrow markings as deriving from the snake's arrows. A new
    tale begins in which the poor orphan Plenty-badger offers wild rhubarb to a wealthy
    young woman, who rejects and insults him, leaving him crying.
  language: English
  quote_policy: summarized
