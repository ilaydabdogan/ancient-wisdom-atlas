canonical_text:
  quote: "“Now I want to die on this high hill.”"
  summary: Black-elk, a young Hidatsa, is hated by White-mountains because of visits
    to White-mountains’ wife. On a war party, White-mountains sends Black-elk back
    for medicine and leaves with the rest of the party. Exhausted, Black-elk crawls
    onto a high hill expecting death. A little boy finds him, obtains his parents’
    help, and the father carries Black-elk home, where he is healed. Black-elk later
    guards and helps the boy while trapping black eagles, makes him bow and arrows,
    follows the father’s leaf-to-arrowhead instruction, kills a deer, and shares the
    meat with the boy.
  language: English
  quote_policy: quoted
