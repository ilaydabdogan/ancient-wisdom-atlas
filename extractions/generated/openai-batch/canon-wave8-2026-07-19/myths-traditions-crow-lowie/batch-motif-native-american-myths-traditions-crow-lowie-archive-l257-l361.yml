  summary: The passage introduces the Historical Traditions section and then characterizes
    Crow mythology as Plains Indian in cast, emphasizing buffalo hunting, warpath
    themes, quests and interventions by supernatural saviors, human heroes, unstable
    identifications among supernatural beings, trickster-transformer episodes involving
    Old-Man-Coyote, monster-destroying heroes, Thunderbirds who require a human hunter’s
    aid, and Crow ritual-origin accounts based on individual experiences with powers
    rather than widespread plot narratives.
