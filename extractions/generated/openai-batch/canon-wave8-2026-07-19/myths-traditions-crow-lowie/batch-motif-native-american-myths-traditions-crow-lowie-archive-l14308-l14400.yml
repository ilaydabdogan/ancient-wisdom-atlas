canonical_text:
  quote: ''
  summary: 'The passage first recounts Red-face’s alliance with Crow people against
    Black-cricket, including adoption, medicine, painting for battle, defeat of Black-cricket,
    a vow not to fight the Crow, and the handing down of names. It then begins the
    tale of Holds-the-tail’s Sun Dance: Holds-the-tail’s brother Size-of-iron goes
    on a war party, kills and scalps a Piegan scout, repeatedly drives back Piegan
    enemies, deliberately returns to fight and die, and only Humpback escapes, taking
    shelter in a dead buffalo skin during snow.'
  language: English
  quote_policy: summarized
