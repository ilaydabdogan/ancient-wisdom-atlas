canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Little-head and Bull-snake
    escape encircling Sioux by an unexplained transit, cross water, and recover from
    a snakebite through weed medicine; both are then identified as medicine men. It
    then gives a Crow account of Shoshoni shamans and a young Crow visionary whose
    red deer-hide medicine, spear, horse, and weapons turn back a Shoshoni attack,
    capture Red-face, obtain a transfer of power, and establish peace through adoption
    and exchange of gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little-head began to sing; Bull-snake opened his eyes and found himself across
    the creek on a hill, without knowing how he got there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bull-snake looked back and saw the Sioux still surrounding the same place;
    he and Little-head escaped while hearing shooting behind them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little-head said he did not know how to swim; the two made a raft from forked
    logs, placed clothing on it, and Bull-snake swam with the raft while Little-head
    held on.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Little-head said the water was shallow and was described as walking or treading
    on the water; when Bull-snake tried to find footing, he went under.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A snake bit Bull-snake; Little-head chewed a weed, spat on the bite, and Bull-snake
    came to his senses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After being left, Bull-snake went to water, obtained a weed, doctored himself,
    improved, and eventually reached camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Bull-snake and Little-head were medicine men, and
    that Little-head could not be shot; it also reports that Little-head later killed
    himself with a six-shooter while drunk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Shoshoni were said to have nearly destroyed the Crow because two Shoshoni
    men, Lowerhalf-of-the-face-red and Black-cricket, had supernatural powers and
    were shamans.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A young Crow was mourning and had a vision; he ordered that a crooked-horned
    deer in a herd not be touched, then had a red-painted suit made from two crooked-horned
    deer skins and possessed a spear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the Shoshoni attacked the Crow unawares, the young Crow asked his mother
    to get his medicine and prepared himself in his tipi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young Crow caught a gray horse, rode it, drove back Shoshoni attackers,
    stabbed some with his spear, dismounted them, and later killed several with a
    tomahawk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Shoshoni reported to Red-face that the Crow had a red-painted powerful
    man; Red-face advanced with a big knife, and the young Crow stabbed him in the
    neck and had him guarded.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young Crow brought Red-face to his tipi, seated him well, gave him the
    best food, asked for his power, and gave him a horse and property; Crow people
    also brought property and horses.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Red-face said that because he had adopted one of the Crow there would be no
    more fighting, that his camp would move over, that the groups would move together,
    and that his boys would give horses.
  category: speech
  evidence_refs:
  - ev:9
