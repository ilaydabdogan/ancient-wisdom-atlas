canonical_text:
  quote: ''
  summary: A boy later identified as Plenty-badger cries after a girl has struck and
    insulted him. Speaking plants, a man, and a bear send him onward until he reaches
    a deep creek and an elk skull. The elk becomes a handsome man, teaches him medicine,
    gives him a whistle-power for attracting females, and says he may turn into an
    elk four times. Plenty-badger returns, repeats parts of the elk instruction with
    a comrade, transforms into an elk, bathes/dives in fourfold sequence, whistles
    women to him, and rebuffs the girl who had insulted him. A source footnote compares
    the elk patron of spurned lovers with Hidatsa, Ankara, and Pawnee material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy sits crying toward morning after telling the rhubarb plants that a
    girl had hit him in the face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rhubarb plants direct him to a nearby high hill; on the fourth day a man
    asks why he is crying and sends him farther.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a thick pine wood he cries while staying for a vision, and a bear directs
    him toward a creek with deep water and a big pine tree on the other side.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fifth day without food or drink he crosses the creek, finds an old
    elk skull with antlers, holds a prong, cries, and hears the skull speak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elk asks for a stick with roots, takes it to the woods, and transforms
    into a fine-looking man with elk skin as a blanket, a feather, yellow face paint,
    and deer-track marks on his cheeks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The elk makes a whistle marked with an elk picture and fastened with two female
