  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The elk tells the boy that nothing is hard for him to get, that the boy will
    be the same, and that the boy may turn into an elk four times but no more.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The elk shows the boy how to make medicine and then goes away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: While Plenty-badger is gone, his grandmother cries and people blame the girl
    for ill-treating him; after he returns, his grandmother takes him home and feeds
    him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the Bighorn camp, Plenty-badger has his comrade pull up a stick with roots;
    the girl says she does not like the orphan and wishes he had died, while others
    sympathize with him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Plenty-badger takes the rooted stick to the woods, turns into a big elk, and
    his frightened comrade seizes him by the neck as instructed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Plenty-badger says he is not a man but something else, instructs his comrade
