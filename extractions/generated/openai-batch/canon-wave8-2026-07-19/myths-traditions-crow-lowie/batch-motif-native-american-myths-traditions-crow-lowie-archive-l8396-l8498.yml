candidate_motifs:
- id: motif:1
  label: abandoned child raised by nonhuman or supernatural patrons
  taxonomy_refs: []
  basis: The young man states he was put in a buffalo wallow and covered with dirt,
    then raised by his fathers, who later appear as seven buffalo bulls.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage calls them fathers and buffalo bulls but does not explicitly
    label them as deities.
- id: motif:2
  label: return and recognition of exposed child
  taxonomy_refs:
  - return
  basis: The grown young man returns to camp, makes his mother acknowledge the past
    exposure, and is recognized through resemblance and testimony.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The narrative begins mid-instruction, so earlier birth details are outside
    this extracted passage.
- id: motif:3
  label: protected patron animals must not be harmed
  taxonomy_refs: []
  basis: The young man warns the people not to disturb seven bulls identified with
    his fathers; a rider who attacks and wounds one is killed by the bull.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the event as a warning and consequence, but does not
    explicitly use the word taboo.
- id: motif:4
  label: human transformation into buffalo forms
  taxonomy_refs:
  - shapeshifter
  basis: The young man dives into water and becomes a bull; his son becomes a calf;
    both later return as persons.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The transformation is brief and localized to this episode.
- id: motif:5
  label: origin explanation for adoption of relatives’ children
  taxonomy_refs: []
  basis: After the son is taken to the buffalo fathers and raised by buffalo grandfathers,
    the narrator says this is how people nowadays adopt the children of relatives.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The social custom is stated, but the passage gives no further procedural
    detail.
- id: motif:6
  label: lost child taken into rocks and raised by hidden person
  taxonomy_refs: []
  basis: In 'The Dwarf’s Ward,' the child disappears from the dog travois; a person
    has taken him inside the rocks and keeps him until he grows up.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The title names the tale as 'The Dwarf’s Ward,' but the body of this excerpt
    calls the adopter only 'a person.'
- id: motif:7
  label: fostered child becomes exceptional hunter-provider
  taxonomy_refs: []
  basis: The child raised inside the rocks receives bow and arrows, kills large game,
    carries whole carcasses, and feeds adoptive parental figures.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The excerpt stops before the tale’s completion, so later developments
    are not represented.
