canonical_text:
  quote: ''
  summary: The passage concludes a tale of a young man abandoned in a buffalo wallow,
    raised by buffalo fathers, recognized by his human mother and kin, protected by
    seven buffalo bulls, and later transforming with his son into buffalo forms before
    the son is taken to the buffalo grandfathers. It then begins 'The Dwarf’s Ward,'
    in which a child is lost from a dog travois near Pryor, taken inside rocks by
    a person, raised there, and becomes a strong hunter who feeds adoptive parental
    figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man is instructed to provoke recognition by calling a ball-playing
    woman his mother and later to state that she put him in a buffalo wallow and covered
    him with dirt.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At camp, young women are playing ball; one woman retrieves the ball, and the
    young man calls her mother, causing her to cry.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When questioned, the young man says he was put in a buffalo wallow, covered
    with dirt, raised by his fathers, and has now returned as an adult.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: People in the lodge compare the young man with his mother and judge that they
    look very much alike.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man identifies a poor young man as his father, and the poor young
    man marries the mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: During hunger in camp, the boy requests seven buffalo chips, sends young men
    to scout, and announces that seven bulls will walk along and must not be disturbed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people spare the seven bulls and kill the rest of the buffalo herd.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young man’s fathers warn that they will be on the left side of the herd
    and that a crazy young horseman must not bother them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A crazy young man riding a white horse charges the seven bulls, shoots Crazy-bull
    in the thigh, and is killed along with his horse by the bull.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The young man dives into water and becomes a bull; his son becomes a calf;
    afterward both return as persons.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young man later takes his son to his fathers, and the child is raised
    among his buffalo grandfathers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narration explicitly connects the preceding episode with the present custom
    of adopting the children of relatives.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: In 'The Dwarf’s Ward,' a child is seated on a dog travois; the dog breaks
    loose to chase two white-tailed deer, and the child disappears.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The parents search for the missing child for two days, fail to find him, and
    continue on while mourning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The lost child is said to have fallen off at Pryor and to have been taken
    inside the rocks by a person, who keeps him until he grows up.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The rock-dwelling person makes a bow and arrows for the boy, who hunts deer,
    elk, and mountain-sheep and brings the game back.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:17
  text: The boy is directed to a mountain with white rocks where he is wanted to feed
    others, and he stays there killing game for a second father.
  category: action
  evidence_refs:
  - ev:12
