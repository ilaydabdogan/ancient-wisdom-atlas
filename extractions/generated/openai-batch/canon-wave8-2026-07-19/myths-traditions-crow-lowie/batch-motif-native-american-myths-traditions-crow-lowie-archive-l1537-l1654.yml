canonical_text:
  quote: ''
  summary: Old-Man-Coyote assigns places and roles to animals, defeats and places
    Alligator in the river with aid from Beaver, establishes or explains animal habits,
    hunting, fire-making, tipi-making, clothing, camp organization, warfare, and mourning
    customs. In a subsequent dialogue, Red-woman and Old-Man-Coyote’s wife debate
    whether human life and the world should be effortless or require labor, and the
    wife’s preferences explain work on hides, firewood, grease, mortality, mourning
    rites, winter, air, rivers, trees, plants, flowers, and medicinal roots.
  language: English
  quote_policy: summarized
