canonical_text:
  quote: "“We are human beings, we don’t eat this meat.”"
  summary: The passage concludes a tale in which two human young men live among nonhuman
    water-associated people, reject their food, kill buffalo and alligator-like game,
    and are later cursed by the pursuing girl. It then begins the tale of Sharpened-leg,
    where two hungry comrades continue on the warpath; one secretly eats flesh from
    his own calves, sharpens his shinbone, and pursues the other, who survives by
    climbing trees with aid from sparrows.
  language: English
  quote_policy: quoted
