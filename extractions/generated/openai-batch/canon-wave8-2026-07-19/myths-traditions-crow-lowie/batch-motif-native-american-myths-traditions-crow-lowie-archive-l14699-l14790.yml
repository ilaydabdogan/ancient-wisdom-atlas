canonical_text:
  quote: ''
  summary: A boy is rescued from a cliff by four mountain-sheep who carry him down
    to a water-surrounded island. There an aged supernatural man renews himself through
    repeated immersion in water, explains a four-life pattern, gives the boy the name
    Big-iron, power, future offerings, and animal kinship, and sends him home. Big-iron
    later overcomes a shaman’s wolverene medicine, revives the shaman, marries the
    chief’s daughter, kills his stepfather, and renews himself through water until
    his fourth cycle ends in death.
  language: English
  quote_policy: summarized
