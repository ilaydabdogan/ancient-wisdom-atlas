canonical_text:
  quote: ''
  summary: Spring-boy and Curtain-boy use arrows and spring-water washing to restore
    their mother. Later they disobey their father's prohibition about a hoop, follow
    it to a tipi on a lake, and survive repeated attempts by a man to cook, drown,
    and roast them. The man's wife repeatedly urges that the boys be released.
  language: English
  quote_policy: summarized
