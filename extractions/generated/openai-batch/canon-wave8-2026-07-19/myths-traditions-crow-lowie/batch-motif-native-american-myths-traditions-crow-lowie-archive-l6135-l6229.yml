canonical_text:
  quote: on the near side their tracks were human, farther on they were those of buffalo.
  summary: The passage completes a Crow tale in which a buffalo wife leaves her Crow
    husband after he violates her request not to mock her as ghostlike. He follows
    her and their child to a buffalo camp, receives directions from buffalo kin, and
    recovers them through a recognition test. The passage then begins another tale,
    “The Woman who married Worms-in-his-face,” in which a woman who has refused suitors
    jokingly names Worms-in-his-face as her desired husband; he hears, comes to her
    camp, appears handsome, lies with her at night, and she follows him toward a high
    peaked hill.
  language: English
  quote_policy: quoted
