canonical_text:
  quote: ''
  summary: 'The passage finishes one Crow tale in which a young man survives a dangerous
    sexual encounter, is threatened by his wife''s seven brothers, and is saved by
    a raven-feather helper that brings a blizzard. It then gives an etiological return
    episode involving an adoptive dwarf father, followed by the beginning of another
    tale: Old-Man-Coyote made the people; a child is lost at Pryor Gap when a dog
    chases antelope; dwarfs raise the child rapidly, arm him, and warn him not to
    shoot a meadow lark, which later speaks to him.'
  language: English
  quote_policy: summarized
