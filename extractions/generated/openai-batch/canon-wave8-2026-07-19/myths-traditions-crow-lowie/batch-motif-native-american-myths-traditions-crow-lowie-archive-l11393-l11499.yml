canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a group of lost children raid enemies,
    acquire horses and goods, grow into a camp, locate the Crow, reveal themselves
    to their parents, and form a separate camp under their leader. It then gives a
    tale of a dog and a wolf trading insults about domestic dependence and wild scavenging
    while an old woman listens. A final obscene tale describes a buffalo hunter whose
    penis begins speaking and is cured when his mother-in-law sings and handles it;
    an editorial note compares the incident to Assiniboin, Pawnee, and Kiowa Apache
    variants.
  language: English
  quote_policy: summarized
