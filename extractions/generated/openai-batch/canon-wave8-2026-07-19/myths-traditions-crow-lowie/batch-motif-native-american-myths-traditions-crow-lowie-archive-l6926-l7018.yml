canonical_text:
  quote: ''
  summary: A friend repeatedly cooks buffalo portions and plants them in the ground
    for Camp-boy while others mock him. Camp-boy appears, scouts enemies, and repeatedly
    wins first coup in attacks. As many companions turn back, he continues with a
    smaller group, raids horses, enters a forest, reaches a same-language camp that
    first threatens to kill the strangers, and is eventually spared. Camp-boy marries
    the chief’s daughter and the party is gone for a year.
  language: English
  quote_policy: summarized
