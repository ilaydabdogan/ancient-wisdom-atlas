canonical_text:
  quote: ''
  summary: 'The passage presents Crow traditions in which Old-Man-Coyote and a younger
    coyote brother make the earth, animals, people, waterways, and Indian ways. A
    second creation account begins with a water-covered earth: four ducks dive for
    mud, form land, and take Old-Man-Coyote as adviser. Old-Man-Coyote shapes landscape
    and plants, releases people from hollow trees and opens their eyes, arranges clothing
    and animal food through helpers, teaches tools, fire-making, and hunting, and
    later tricks buffalo into falling over a cliff.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old-Man-Coyote and the little coyote name one another elder and younger brother
    and are said to have made the earth together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Animals, people with nostrils, mouths, and feet, rivers, springs, and creeks
    are made and placed on earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old-Man-Coyote fools people with a magical araco'ciru stick and is described
    as chief of the breechcloth-wearers, a great trickster, and a ruler.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old-Man-Coyote is credited with making the ways of the Indians, putting people
    to sleep, making them dream, and putting dangerous stars into the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In another account, all earth is covered with water; four ducks meet, one
    dives and brings up mud in his nostrils, and the ducks scatter it to form flat
    earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Old-Man-Coyote advises the ducks and proposes or makes rivers, trees, hills,
    mountains, rocks, and many food plants for people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Old-Man-Coyote has people in hollow trees, chops a tree, and people come out
    without eyes; he opens their eyes and instructs them to do likewise for later
    people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When humans lack tools and weapons, Old-Man-Coyote consults his brother, someone
    is called down from above, and people are clothed, reportedly with moss.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Several animals are made as food or inhabitants, including beaver, jack-rabbit,
    deer, elk, antelope, mountain-goats, bear, and buffalo living in holes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Old-Man-Coyote teaches people to make arrows with feathers and stone points,
    to chip stone knives, to make fire by drilling, and to catch antelope with a ridge
    and corral.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After buffalo disappear, Ci'rape' finds their den in rocks, and two men prepare
    moccasins and follow buffalo tracks.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A hungry Old-Man-Coyote proposes a race to buffalo near a cliff, tells them
    to shut their eyes, and the buffalo fall over; he then feigns injury and is accused
    by a young buffalo of killing them and being mischievous.
  category: sequence
  evidence_refs:
  - ev:12
