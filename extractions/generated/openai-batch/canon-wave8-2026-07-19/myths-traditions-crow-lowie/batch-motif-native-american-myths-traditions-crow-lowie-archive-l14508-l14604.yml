canonical_text:
  quote: ''
  summary: 'The passage contains related Crow narrative episodes: a father enters
    the river and recovers his dead child from water-associated beings; a hostile
    stepfather abandons his stepson at an eagle nest; the boy''s mother seeks him
    through search and dream; a female eagle feeds the boy, makes arrows for him,
    carries him back to his mother, and authorizes vengeance; the boy kills his stepfather,
    survives a Sioux attack, and his stepfather''s corpse becomes dangerous to approach,
    with a relative killed by rain and lightning after handling it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child disappeared while children were swimming at the canon of the Bighorn,
    and people thought an alligator had taken the child into the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child's father, Runs-near-the-camp, went to the canon, put both hands
    into the water, cried there, and on the fourth day was taken into the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father was told that an alligator had taken the boy to the mouth of Woody
    Creek, that the boy was dead, and that water-beings wanted to eat him but were
    waiting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father went through the water to the mouth of the creek, got the boy's
    body, emerged where he had entered, and brought the body back to camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another man forced his stepson down to an eagle nest on a steep hill, threw
    away the rope so the boy could not climb back, and returned home without him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stepfather told the mother a false account of the boy's whereabouts, and
    the mother had a crier call men to search for the boy.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The mother cut off her hair and went on a vision quest; in dreams she was
    told that her child had been suffering for a long time.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: A female eagle came to the nest, spoke to the boy, told him to stop crying,
    and brought deer meat for him and for her young.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy put pieces of deer meat in the sun, where they were cooked, and after
    eating he felt well.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The eagle planned for her young to take the boy down after they grew strong,
    but when they could not lift him, she decided to carry him herself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The eagle had the boy make a bow and arrows from four sticks; she painted
    two arrows white, one yellow, and one red, and the white arrows were described
    as his best arrows.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The eagle carried the boy over the camp, found his mother on a high hill,
    and set him down beside her; the mother recognized and kissed him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The eagle told the boy that he could kill or trouble the person who had caused
    him trouble, and told him to kill and cut open a buffalo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boy later shot his stepfather with a white arrow, killed him, dragged
    him away, and warned that no one should go near the body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: During a buffalo hunt, an eagle swooped down near the men; the boy understood
    this as a warning to hide, but his companion went back to camp.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Sioux fighters attacked the boy, and the boy killed nine enemies before they
    withdrew.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A relative of the slain stepfather tried to take and bury the bones; although
    there were no clouds, rain fell on him and lightning killed him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The crier announced that people should keep away from the dead bodies, and
    the passage states that everyone feared the boy because he was a medicineman.
  category: speech
  evidence_refs:
  - ev:10
