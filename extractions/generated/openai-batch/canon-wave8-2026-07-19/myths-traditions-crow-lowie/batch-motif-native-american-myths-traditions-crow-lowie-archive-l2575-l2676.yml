canonical_text:
  quote: ''
  summary: 'The passage recounts a river-swimming animal transformation performed
    by a young man and imitated unsuccessfully by Old-Man-Coyote. It then gives a
    sequence in which Old-Man-Coyote demands second names from a turnip, rose berries,
    a mouse, and a prairie-chicken, mistreats or challenges them, and suffers effects
    matching their names: wind and levitation, itching, hair loss, and fright. The
    hair-loss episode is linked to the practice of clipping hair when relatives die.
    After being frightened into a beaver dam, Old-Man-Coyote changes into a baby,
    is taken in by beavers, and kills and eats two young beavers while the beaver
    mother is away.'
  language: English
  quote_policy: summarized
