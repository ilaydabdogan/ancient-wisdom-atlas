canonical_text:
  quote: "“I am very eager to die and catch up with my father.”"
  summary: Spotted-rabbit is bathed, groomed, dressed, painted, mounted on an ornamented
    horse, and instructed in songs and performance by his clansman. He is publicly
    recognized as a Crazy Dog, repeatedly dismounts and dances when told not to, his
    mother laments his choice, and he explains that he wants to die and catch up with
    his father.
  language: English
  quote_policy: quoted
