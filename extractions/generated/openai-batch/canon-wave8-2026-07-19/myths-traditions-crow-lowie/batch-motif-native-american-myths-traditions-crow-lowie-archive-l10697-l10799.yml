- id: obs:4
  text: After the pursuer is trapped, the girl goes to where her elder brothers are
    sitting on the pointed hill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The siblings say they have no lodge and ask what they should become; six have
