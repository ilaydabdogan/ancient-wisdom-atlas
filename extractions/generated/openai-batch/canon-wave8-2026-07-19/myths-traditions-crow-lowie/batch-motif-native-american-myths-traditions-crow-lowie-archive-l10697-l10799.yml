canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a younger sister uses a
    stomach part that becomes holes in the ground to trap a supernatural bear/ghost
    pursuer; a Dipper origin episode in which siblings choose to become the Dipper
    and receive smoke offerings; a second short Dipper variant about the Seven Stars
    seeking an everlasting form; and the opening of a Splinter-foot tale in which
    two young men remove a deer-horn splinter from a wrapped young woman's foot and
    she claims both as husbands.
  language: English
  quote_policy: summarized
