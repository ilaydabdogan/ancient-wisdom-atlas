canonical_text:
  quote: ''
  summary: 'The passage closes a Camp-boy war-and-return episode, then begins a tale
    titled “The Reformed Idler.” Camp-boy pursues the hostile chief’s daughter who
    rides a spotted mule between battle lines, captures and marries her, later returns
    home after several winters, and learns which wives have remarried. In the second
    tale, an idle young man is repeatedly struck on the shinbone by his father and
    then performs socially valued acts: first killing deer by using a horned buckskin
    mask, then stealing many horses from the Nez Perce and giving them to his father
    and relatives. The passage ends during another rebuke and departure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Enemy attack is expected in spring; mirror flashes from a hill signal preparation
    for battle, and the hostile chief’s daughter rides a spotted mule between the
    two lines before battle begins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Camp-boy says he is after the girl on the spotted mule; in the battle his
    left-handed friend kills an enemy with a tomahawk, and Camp-boy captures and marries
    the girl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After another seasonal attack and victory, the party packs horses and starts
    home; three members remain because they are married and have children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On returning to their own country, two young men inspect the camp to learn
    whether warriors’ wives have remarried; Camp-boy learns one former wife has remarried
    and another remains at his old home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In “The Reformed Idler,” a young man sleeps late and does nothing; his father
    reproaches him by saying no one will ask for meat killed by his son and strikes
    his shinbone with a stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After his mother intervenes, the young man asks her to make deer horns for
    a buckskin mask; he paints the mask with white clay, puts on the horns, and the
    next morning takes his father’s gun and knife away on horseback.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a little lake with salty water, deer do not flee because they think the
    masked boy is a deer; he kills, skins, cleans, and brings home deer before the
    sun is high.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy repeats the deer kill for three days; his father approves but tells
    him to stop because a young man ought not to smell like a deer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After another shinbone beating, the boy prepares moccasins, takes a comrade
    on a war party to the Nez Perce, and repeatedly brings back increasing numbers
    of horses, giving them to relatives and his father.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father sings praise songs after receiving horses and later tells his son
    to stop because he has listened to what he was told.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A further shinbone beating occurs, after which the boy goes up the river toward
    a place where there are many Crow; the narrative is incomplete in this passage.
  category: sequence
  evidence_refs:
  - ev:7
