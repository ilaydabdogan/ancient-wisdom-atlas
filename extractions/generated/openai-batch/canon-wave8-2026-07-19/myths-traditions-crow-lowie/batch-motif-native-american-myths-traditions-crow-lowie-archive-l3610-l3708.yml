canonical_text:
  quote: ''
  summary: The passage contains the close of one tale and the opening of another.
    In the first, a boy is urged by his mother to approach hunters, refuses to eat
    a buffalo fetus offered by a butcher, spends a summer in a tree, withdraws intended
    benefits from human people, and ascends with his mother, brother, and dogs by
    arrows to become stars with seasonal appearances. In the second, a young woman
    follows a porcupine up a box-elder tree into the sky, is unable to return, marries
    the sky man who sent the porcupine, bears a son, and the son learns from Crow-speaking
    meadow larks that he belongs on earth; a forbidden turnip reveals a hole down
    to earth.
  language: English
  quote_policy: summarized
