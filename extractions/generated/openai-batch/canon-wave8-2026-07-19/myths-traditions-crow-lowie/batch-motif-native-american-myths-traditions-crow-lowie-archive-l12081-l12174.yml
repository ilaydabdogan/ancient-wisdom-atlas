canonical_text:
  quote: ''
  summary: 'A woman follows named landmarks and river crossings to reach On-top-of-the-bull,
    who has been abandoned with his younger brother. Her night singing is first taken
    for a ghostly presence, but she enters, gives food and tobacco, and stays with
    him. After danger from hostile buffalo hunters, she and the boy take horses from
    the hostile camp during snowfall, and the three return to their own tribe, where
    On-top-of-the-bull''s father rejoices. A pinto horse is given to the girl''s husband
    or chief, who accepts the situation without resentment. The passage then begins
    another tale: a girl promises to marry whoever brings back part of her brother''s
    body after his war party is destroyed; a young man sets out to search for the
    remains.'
  language: English
  quote_policy: summarized
