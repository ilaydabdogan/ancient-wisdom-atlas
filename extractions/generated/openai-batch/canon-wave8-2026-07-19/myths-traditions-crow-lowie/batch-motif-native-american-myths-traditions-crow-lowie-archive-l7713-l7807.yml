canonical_text:
  quote: ''
  summary: A young man is repeatedly assigned difficult tasks by his father-in-law.
    A bear, called his father, helps him obtain out-of-season fruits, magically made
    bow-and-arrow equipment, and finally a spotted buffalo. When the father-in-law
    tries to shoot the buffalo, the arrows fail and the buffalo kills him. The young
    man later reports what happened, and the people understand that the old man had
    previously destroyed other young men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man travels upstream in a blizzard, crying, to obtain ripe sarvis-berries
    and leafy branches for a covering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the source near rocks and a cave, a bear calls the young man, takes him
    into the cave, and provides many sarvis-berries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bear tells the young man that he will be given four tasks, and that one
    of them is hard but will be accomplished.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Four days later the old man assigns a second task: filling the sack with
    ripe plums and covering it with fresh chokecherries.'
  category: action
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: The young man returns to the bear den, obtains the plums and chokecherries,
    and brings them back; the old man eats the plums himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old man assigns a task requiring a cedar bow with sinew backing and ten
    smooth arrows with eagle tail feathers and blue points.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bear asks an eagle for feathers, uses plant materials to make arrow parts,
    and a snake transforms itself into the cedar bow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The final task is to drive a spotted buffalo to the old man's door so the
    old man can kill it with the bow and arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bear instructs the young man to approach the buffalo with the wind coming
    from the buffalo and to circle four times crying.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The spotted buffalo separates from its companions and is driven to the father-in-law.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The old man tries to shoot the buffalo four times, but the arrows crumple;
    the buffalo horns him and tears him to pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The young man gathers the old man's remains in a bundle and throws them into
    the spring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the young man later returns without his father-in-law and tells his story,
