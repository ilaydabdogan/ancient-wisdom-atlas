  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a hilltop, Old-Man-Coyote sings that what he looked at looked like a crow;
    when the old woman suspects the song is about her, he denies it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the place where he claimed the war party would stop, no one is present;
    Old-Man-Coyote builds a fire and shelter and tells the old woman he will look
    upstream for the others.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Old-Man-Coyote instructs an owl to come when the fire is out, break sticks,
    strike the shelter, and command them to sleep together under threat of death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The owl carries out the instructed actions; the old woman trembles and moves
