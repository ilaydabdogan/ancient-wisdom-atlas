  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next morning Old-Man-Coyote acts as if searching for the rest of the party,
    reports seeing no tracks, and returns home with the old woman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the daughter asks where her husband is, the old woman says he went to
