canonical_text:
  quote: ''
  summary: 'The passage contains the end of a water-injury episode in which an unnamed
    male ignores a warning, drinks or dips water, loses his lip and fingers, and replaces
    them with mud. It then gives a Crow Old-Man-Coyote tale: he fabricates a war-party
    pretext to travel with his mother-in-law, tricks her at a river, sings about what
    he saw, stages an empty camp, instructs an owl to threaten them, has intercourse
    with her, and returns home; the narrator adds a comment about women not telling
    what they have done. A shorter variant repeats the warpath, owl command, and intercourse
    episode. Footnotes compare the water-injury motif with Assiniboin and Hidatsa
    material and note the intensity of the Crow mother-in-law taboo.'
  language: English
  quote_policy: summarized
