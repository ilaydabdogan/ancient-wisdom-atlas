canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a handsome young man, later called
    Flint-like-young-man, steals an oppressive chief's sister-in-law, defeats the
    chief in combat, restores wrongfully taken property, and becomes chief. He later
    rescues a drowned boy from water-monsters after an aerial journey and guidance
    from an old woman. The passage then begins the Camp-Boy tale, describing a handsome
    stay-at-home young man whose father burns himself in anger, after which Camp-Boy
    prepares to join a raid and sends instructions for food to be prepared on the
    trail.
  language: English
  quote_policy: summarized
