candidate_motifs:
- id: motif:1
  label: Defeat of an oppressive invulnerable chief and transfer of leadership
  taxonomy_refs: []
  basis: The chief rules because he is invulnerable, abuses access to girls and food,
    attacks the boy unsuccessfully, is killed, and is replaced by the boy, who restores
    property.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: No taxonomy family is assigned because the passage describes chiefship
    rather than explicit kingship or divine legitimation.
- id: motif:2
  label: Stolen woman as trigger for armed conflict
  taxonomy_refs:
  - stolen_beloved
  basis: The boy steals the chief's sister-in-law, the chief demands her return, and
    the dispute leads to combat.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The woman is called a sister-in-law and stolen girl; the passage does
    not present her as a mutually consenting beloved.
- id: motif:3
  label: Aerial quest to a water realm with supernatural guidance
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The boy rides toward the four quarters, ascends into the air, receives advice
    from an old woman in the air, and travels to the ocean to recover the captive.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes ascent into the air and travel to the ocean, not
    a fully mapped cosmological itinerary.
- id: motif:4
  label: Return alive of a person drowned for a year
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: A person drowned for a year is expected by relatives to be recoverable only
    as bones, but the boy brings him home alive.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The text says the boy had drowned and was held captive; it does not explicitly
    describe death, ritual resurrection, or rebirth mechanics.
- id: motif:5
  label: Combat with water-monsters and escape from pursuing water
  taxonomy_refs: []
  basis: The rescuer finds water-monsters holding the captive, kills five, escapes
    on horseback, and makes the pursuing water recede by charging at it.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The beings are called water-monsters, with no further zoological or cosmological
    identification in the passage.
- id: motif:6
  label: Delayed warrior initiation after shame and paternal self-injury
  taxonomy_refs:
  - initiation
  basis: Camp-Boy stays home while peers gain renown; after his father burns himself
    in anger over the lack of praise songs, Camp-Boy decides to go on the raid.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage begins but does not complete the raid or any formal initiation
    sequence.
- id: motif:7
  label: Prepared trail food for an absent or approaching hero
  taxonomy_refs: []
  basis: Camp-Boy instructs his friend to cook a buffalo blood-sack and plant it in
    the ground for him at the second stop; the friend does so despite mockery.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage fragment does not yet explain the function of the planted
    food.
- id: motif:8
  label: Coyote howl as sign associated with Camp-Boy
  taxonomy_refs: []
  basis: After preparing food for Camp-Boy, the friend hears a coyote howling and
    says, 'There's Camp-Boy.'
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The text reports the friend's identification but does not yet explain
    whether the coyote is Camp-Boy, a messenger, or an omen.
