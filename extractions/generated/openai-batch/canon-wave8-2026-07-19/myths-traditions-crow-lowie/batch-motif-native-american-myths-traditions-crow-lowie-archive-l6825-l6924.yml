  locator: lines 6825-6833
  quote_or_summary: In spring a large tipi is built; the handsome boy's mother's brothers
    take him to the main camp, where an invulnerable chief uses his status to take
    the prettiest girls and best food.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: lines 6833-6838
  quote_or_summary: A woman warns the boy that the man is bad; the chief has a sister-in-law
    and kills anyone who loves her.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 6838-6848
  quote_or_summary: The left-handed man advises the boy to steal the woman; the woman
    speaks as if called, insults him, and calls him fatherless; the left-handed man
    says to bring the wife and have a battle.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 6848-6857
  quote_or_summary: The boy seizes the woman and sleeps with her; the chief searches
    and sends demands; the left-handed man defies him, and an old woman advises sending
    the stolen girl back.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 6857-6869
  quote_or_summary: The chief shoots arrows that glance off and throws a knife that
    breaks; the boy cuts off his head, orders restitution of wrongfully taken property,
    keeps the girl and his own property, and becomes chief called Flint-like-young-man.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 6870-6880
  quote_or_summary: At the Bighorn, people offer ten horses for the boy to look for
    a boy drowned for a year; he prepares a gray horse with lightning streaks, red
    clothing, red face paint, sword, and eagle plume, rides toward the four quarters,
    ascends into the air, and turns north.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 6880-6893
  quote_or_summary: An old woman in the air tells him the drowned boy has been taken
    to the ocean and held at a hill in the water with six captives; she explains that
    the water goes down at sunrise and advises him about attacking the captors.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 6893-6905
  quote_or_summary: At the beach the water-monsters are asleep and hold the drowned
    boy; the rescuer rides over and chops up five, warns the last, escapes with the
    saved boy while water pursues, charges the water so it recedes, ascends, and brings
    the boy home alive.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 6906-6915
  quote_or_summary: Camp-Boy is introduced as a handsome young man who stays home
    while peers go on the warpath; clansmen name him Camp-Boy, and a left-handed friend
    invites him to join a raid.
  source_text_path: texts/public-domain/native-american-plains/project-gutenberg/myths-traditions-crow-lowie.md
  rights_note: Public domain source; summarized.
