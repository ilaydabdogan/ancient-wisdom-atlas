candidate_motifs:
- id: motif:1
  label: celestial parent warns a child against dangerous weather
  taxonomy_refs:
  - divine_parent_child
  basis: Morningstar is explicitly described as coming to his child and warning him
    not to go out when clouds come up.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage begins mid-tale, so the full prior relationship between Morningstar,
    the birds, and the child is not supplied here.
- id: motif:2
  label: fatal consequence after ignoring or outlasting an avoidance warning
  taxonomy_refs: []
  basis: The child stays safe after the warning through winter but later goes out
    in spring as clouds gather and is struck by Thunderbird.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not state the action as a moral transgression; it only
    narrates the warning and later death.
- id: motif:3
  label: excessive hunting success followed by danger
  taxonomy_refs: []
  basis: The young man catches ten eagles, more than the others, and the party leader
    warns that something might happen; he remains behind and is then trapped in the
    pit.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage implies but does not explicitly explain a causal link between
    catching too many eagles and the later entrapment.
- id: motif:4
  label: initiatory ordeal with confinement, helper, task, and medicine gifts
  taxonomy_refs:
  - initiation
  basis: The eagle-catcher is isolated and weakened in a pit, rescued and restored
    by a small boy, sent on an elk-killing task with mole assistance, and receives
    medicine, skills, and strength before returning.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The word initiation is not used in the tale, but the sequence of ordeal,
    instruction, task, and medicine gift is explicit.
- id: motif:5
  label: underground animal helpers enable a hunt
  taxonomy_refs: []
  basis: Moles remake the arrows, dig an underground passage to the sleeping elk,
    instruct the young man, and butcher the elk after it is killed.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No broader taxonomy reference is assigned because the supplied taxonomy
    has no specific mole-helper or underground-hunt category.
- id: motif:6
  label: small amount of food and drink satisfies and restores strength
  taxonomy_refs: []
  basis: The little boy gives only a little water and two mouthfuls of pemmican, yet
    the young man drinks and eats until full and becomes as strong as ever.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explain the mechanism of the abundance; it only describes
    the result.
- id: motif:7
  label: fourfold hunting equipment and medicine
  taxonomy_refs: []
  basis: The boy’s father makes four arrows, the elk is shot four times, and the father
    later gives four kinds of medicine.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The recurrence of the number four is literal, but its symbolic meaning
    is not explained in the passage.
