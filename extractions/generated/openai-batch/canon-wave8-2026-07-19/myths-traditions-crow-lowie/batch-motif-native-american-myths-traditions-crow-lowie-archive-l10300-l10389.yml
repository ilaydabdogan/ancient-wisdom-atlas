canonical_text:
  quote: ''
  summary: 'The passage first concludes a bird/Morningstar tale in which bird figures
    search for a missing child, a scaffold is struck by Thunderbird, Morningstar warns
    his child to avoid clouds, and the child is later struck by Thunderbird. It then
    gives the tale of an eagle-catcher: a young man catches unusually many eagles,
    remains behind, is trapped in his eagle pit by a rock, is rescued and fed by a
    very small boy, is sent to kill an elk with help from moles, receives medicines
    and skills, and returns to the Hidatsa.'
  language: English
  quote_policy: summarized
