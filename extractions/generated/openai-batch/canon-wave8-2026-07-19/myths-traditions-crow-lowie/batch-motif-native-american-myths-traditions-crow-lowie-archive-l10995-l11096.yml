- id: obs:1
  text: In the opening fragment, a comrade tells a man to return with another war
    party, kill a designated buffalo, throw the whole buffalo in, and speak a formula
    addressing a father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man returns, kills the designated buffalo, throws the body in, and remains
    at the same place as before.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The comrade says a river crossing will be shallow, directs the man to destroy
    one tipi, take a young woman wearing an elk-tooth dress and a spotted mule, and
    throw both into the water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man destroys the lodge, takes the young woman captive, crosses shallow
    water, bandages the eyes of the woman and mule, pushes them over, and they are
    not seen again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The comrade tells the man that when pursued across deep water, if he names
    the comrade, the water will become shallow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the titled tale, the Crow camp follows buffalo, chooses four men to follow
    the herd, and the four men see the buffalo enter a large hole in the side of a
    hill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The four Crow men decide to follow the buffalo into the cave, travel downhill
    in darkness, sleep, emerge at another mouth of the cave near a river, bathe, and
    sleep in the shade.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: A giant sees the four Crow men, speaks Crow, asks where they came from, and
    takes them in his hand to his tipi among other very large people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The giants have no arrows or guns and ask the Crow to shoot them in the breast;
