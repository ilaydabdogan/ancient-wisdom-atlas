canonical_text:
  quote: ''
  summary: The passage begins with the end of a tale in which a man is instructed
    by a comrade to make offerings, including a buffalo and later a captive young
    woman with a spotted mule, and is promised aid in crossing deep water. The titled
    tale that follows tells how four Crow men follow buffalo through a cave to the
    other side of the earth, meet giants who treat buffalo as horses, help the giants
    against animal enemies, and return with buffalo for the Crow people, explaining
    why buffalo came to be found throughout the country.
  language: English
  quote_policy: summarized
