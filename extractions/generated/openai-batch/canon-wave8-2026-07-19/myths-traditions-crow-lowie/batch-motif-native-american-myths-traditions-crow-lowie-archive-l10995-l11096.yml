    robes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A giant says he does not eat buffalo because buffalo are his horses, and a
    young man drives buffalo into a corral for the Crow to eat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: One Crow man kills a buffalo with an arrow, causing the giants to run away;
