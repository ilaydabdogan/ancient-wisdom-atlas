  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sweater catches the enemy horseman, shoots him twice in the back, takes
    his horse, bonnet, and feathered stick, strikes a coup, and returns to the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the Sweater kills the bravest Sioux man, the Crow pursue the Sioux and
    obtain many mules and horses.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
