canonical_text:
  quote: ''
  summary: The passage concludes one Cunning-man tale in which a young warrior returns,
    distributes captured goods and horses, reconciles with a comrade, becomes a chief,
    and later gives his son dwarf medicine. It then presents episodes in which Cunning-man
    chooses unusual brother-like protectors for his son on a war party, predicts an
    enemy ambush, and the son returns safely. Another episode shows Cunning-man killing
    an enemy by distracting him with a story while preparing an arrow. A further fragment
    introduces Cunning-man as the people's only war captain and begins a tale about
    rival scouts caught by rain on the same peak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After eating, Cunning-man asks the young man where he has been, and the young
    man reports being in the mountains, killing four enemies, going on a war party,
    and bringing horses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man gives Cunning-man a captured gun, a war-bonnet he has made,
    and horses for Cunning-man and Cunning-man's wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man gives horses to his comrade, his brother, and his wife's relatives,
    and he invites Cunning-man to smoke and eat pemmican while hearing about his deeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man says his wife struck coups after him and that he had taken guns,
    and he says he wants to be a chief someday.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The two comrades become friends again, go on war parties together, kill enemies,
    bring horses, and remain together.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young man's wife has a child; when the boy grows up, his father is described
    as the biggest chief in camp and leader when the camp moves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief paints his tipi with a picture of a man, keeps scalps at the ends
    of his poles, and later gives his son medicine identified as the dwarf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cunning-man says his own boy is not very able and that he will find a protector
    for him before the boy goes on the warpath.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cunning-man calls in a foolish-acting young man with a coupstick and another
    young man carrying many arrows, and he wants them to accompany his boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Cunning-man's wife objects to his choices, but Cunning-man tells her to keep
    quiet and calls the foolish young man an elder brother as it were.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cunning-man predicts that enemies will surprise the party at noon, that the
    coupstick man will not run, and that his child will come home while enemies try
    to kill the coupstick man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: At noon the war party is surprised; the spear-holder remains at the fire,
    enemies gather toward him, and he is killed while some associates flee to the
    woods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A returning warrior reports that the arrow-man was behind Cunning-man's son
    and tried to get the boys into the woods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Cunning-man says the boy will come back, and both the boy and his companion
    return with meat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: While lying on his back on a river bank, Cunning-man sees an enemy preparing
    to shoot him from above.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: Cunning-man tells his wife a story about once shooting a bird while holding
