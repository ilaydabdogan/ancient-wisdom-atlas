candidate_motifs:
- id: motif:1
  label: War deeds followed by redistribution and rise to chiefship
  taxonomy_refs: []
  basis: The young warrior reports enemies killed, a war party, captured goods, and
    horses; he redistributes horses and later becomes the biggest chief in camp.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives social and narrative outcomes but does not state a formal
    rule linking gift distribution to chiefship.
- id: motif:2
  label: Medicine patron transmitted to young warrior
  taxonomy_refs:
  - initiation
  basis: A chief gives his son medicine when the son becomes a young man, and the
    son then goes on war parties; the medicine is identified as the dwarf.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage is brief and does not describe the rite or the dwarf's actions.
- id: motif:3
  label: Fictive elder-brother protector for a vulnerable warrior
  taxonomy_refs:
  - sibling_pair
  basis: Cunning-man says his boy needs a protector, calls selected companions brother-like,
    and the arrow-man helps the boys into the woods during the attack.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The relationship is explicitly quasi or functional, not a biological sibling
    pair.
- id: motif:4
  label: Decoy who draws enemy attack so others can escape
  taxonomy_refs:
  - sacrifice
  basis: Cunning-man predicts that the coupstick man will not run and that enemies
    will try to kill him while the son returns; the spear-holder stays at the fire
    and is killed as enemies gather toward him.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents a tactical death, not an explicit ritual sacrifice.
- id: motif:5
  label: Storytelling as a combat stratagem
  taxonomy_refs:
  - wisdom
  basis: Cunning-man tells a story while holding an arrow as if illustrating it, causing
    the enemy to listen before Cunning-man shoots him; he is then called the great
    storyteller of his time.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The motif concerns cunning and narration in battle; no supernatural power
    is stated in this episode.
- id: motif:6
  label: War captain as behavioral model for the people
  taxonomy_refs:
  - culture_hero
  basis: The passage states that Cunning-man was the only war captain and that everything
    the people did was modeled on him.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage identifies him as a model for war conduct, but does not narrate
    a broader origin of culture.
- id: motif:7
  label: Enemies forced into neighboring shelters by storm
  taxonomy_refs: []
  basis: Rival tribes send scouts to the same peak, and hard rain forces the scouts
    into separate rock-shelters near each other.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The tale is fragmentary in the supplied passage and its outcome is not
    included.
