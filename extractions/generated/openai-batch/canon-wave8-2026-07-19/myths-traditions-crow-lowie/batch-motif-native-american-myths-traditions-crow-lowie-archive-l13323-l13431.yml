  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage states that Cunning-man was the great storyteller of his time.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:18
  text: The passage states that Cunning-man was the only war captain the people had
