canonical_text:
  quote: ''
  summary: 'The supplied passage first concludes an episode in which survivors of
    a snow-covered camp find ownerless horses, ruined tents, dead relatives, and foul-smelling
    remains. It then begins the tale titled “The Faithful Mistress”: a Hidatsa war
    party raids upstream in fall; On-top-of-the-bull breaks his shinbone and is left
    in a hide hut with water, firewood, a hooked limb, and ammunition. His younger
    brother refuses to abandon him. Back home, the wounded man’s mistress secretly
    prepares moccasins and food, asks an honest man for directions, receives a detailed
    river-and-landmark route drawn on the ground, and begins traveling toward him
    along the Yellowstone route.'
  language: English
  quote_policy: summarized
