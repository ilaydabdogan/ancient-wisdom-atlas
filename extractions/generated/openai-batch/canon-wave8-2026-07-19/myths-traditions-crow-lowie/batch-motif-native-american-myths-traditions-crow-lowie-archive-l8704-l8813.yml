canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a boy learns he is Crow, is told
    that a dwarf captured him at Eagle’s request so he can kill a dragon or long-otter
    that eats young eagles, kills it with red-hot rocks, receives Eagle’s adoption
    and blessings, and leaves arrow and stone marks connected with Pryor place names.
    It then gives a short account of dwarf tracks and dwarf medicine obtained after
    a dream and fasting at a cave, followed by the opening of a tale in which a tyrannical
    man falsely accuses a poor young man and causes him and a young woman to depart.
  language: English
  quote_policy: summarized
