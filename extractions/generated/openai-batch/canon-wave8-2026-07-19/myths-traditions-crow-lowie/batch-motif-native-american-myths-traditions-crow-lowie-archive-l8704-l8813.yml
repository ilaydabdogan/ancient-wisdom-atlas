candidate_motifs:
- id: motif:1
  label: captive child’s true identity revealed
  taxonomy_refs: []
  basis: The boy is told by the meadow lark that he is Crow and asks the dwarf who
    he is and to be sent home.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-story, so the earlier circumstances of the boy’s
    capture are only summarized through the dwarf’s speech.
- id: motif:2
  label: hero kills nest-threatening monster with heated stones
  taxonomy_refs: []
  basis: The boy is assigned to kill the dragon or long-otter that eats young eagles
    and defeats it by dropping red-hot rocks as it climbs toward the nest.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The creature is glossed as dragon or long-otter; no further taxonomy such
    as serpent should be assumed from this passage alone.
- id: motif:3
  label: service to supernatural patron repaid by adoption and blessing
  taxonomy_refs:
  - sacred_exchange
  basis: Eagle promises adoption and return home if the boy kills the predator, then
    blesses him with headmanship, favorable hunting wind, and abundance.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The patron is Eagle rather than a named deity; the taxonomy reference
    is limited to exchange structure.
- id: motif:4
  label: supernatural initiation into leadership and hunting success
  taxonomy_refs:
  - initiation
  basis: After the monster-slaying and bird assembly, Eagle confers future headmanship
    and hunting success on the boy, and the boy later rules his camp.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly call this an initiation; the motif is
    inferred from the sequence of ordeal, blessing, and changed status.
- id: motif:5
  label: deeds preserved as arrows, stones, and place names
  taxonomy_refs: []
  basis: Arrows in rock and piled stones are described as still visible marks of the
    boy’s deeds and are connected with names for Pryor.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is an etiological place-marking motif, but no supplied taxonomy family
    directly names it.
- id: motif:6
  label: fasting dream quest to dwarf medicine patron
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: A woman dreams she is wanted at childlike tracks by a cave, fasts for four
    days, is adopted by a small woman, and receives medicine.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The account is brief and framed as reported testimony rather than a full
    tale.
- id: motif:7
  label: medicine gift followed by prosperity
  taxonomy_refs:
  - sacred_exchange
  basis: After adoption by the small woman and receipt of medicine, the woman comes
    to own large tipis and many horses.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The exact reciprocal obligation or ritual terms of the medicine relationship
    are not described.
- id: motif:8
  label: tyrant’s false accusation causes departure
  taxonomy_refs:
  - departure
  basis: A man who seizes property and women accuses the poor young man concerning
    his younger wife and orders departure, after which the young man and woman leave
    at night.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only the beginning of the tale is included, so later narrative function
    is not yet available.
- id: motif:9
  label: fleeing couple enters hunger and failed hunting
  taxonomy_refs: []
  basis: The departing pair consume their food, the woman becomes pregnant, and the
    man misses all game until ammunition and arrows are exhausted.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage ends before any resolution, rescue, or transformation is given.
comparison_claims:
- id: claim:1
  claim: The footnote cautiously links the Dwarf Tracks place with a nearby reported
    practice in which barren women deposited baby moccasins there in hope of children,
    suggesting the same dwarf-associated place could be connected with petitions for
    supernatural benefit.
  claim_level: same_motif
  target: Simms, 316 report about the same place north of Plenty-coups’ camp at Pryor
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is only a brief footnote; it does not provide a full
    parallel narrative, and the benefit differs from the medicine-and-wealth result
    in the main Dwarf Tracks account.
