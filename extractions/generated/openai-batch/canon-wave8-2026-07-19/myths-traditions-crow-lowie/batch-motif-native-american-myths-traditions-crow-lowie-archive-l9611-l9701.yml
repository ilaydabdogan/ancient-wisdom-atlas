canonical_text:
  quote: ''
  summary: 'The passage first concludes a narrative in which men, aided by a powerful
    man and prompted by the Moon’s instruction to a poor woman, obtain horses and
    status while those who refused help are excluded. It then begins “The Compassionate
    Brother-in-Law”: Gray-old-man, identified as an eagle, visits a bird-trapping
    camp. A plain wife properly receives him and her household receives advice and
    hunting success, while a pretty wife refuses his reception and her household fails.
    Her husband maims her, and his younger brother refuses to abandon her.'
  language: English
  quote_policy: summarized
