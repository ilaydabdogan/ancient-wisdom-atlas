canonical_text:
  quote: ''
  summary: The passage concludes episodes about Raven-face and buffalo encounters,
    including a wounding, a supernatural speech granting doctoring power, a cliff
    danger, and confirmation of a bear's earlier warning. It then begins the tale
    of a poor nearly blind man and his wife, who are helped by the Moon. The Moon
    appears as a woman, advises the wife to seek helpers, and the couple recruits
    young men for a journey toward horses at the Musselshell River fork.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo digs at the earth over Raven-face, licks the skin from his back,
    makes water on his wounded back, and Raven-face goes into a trance and cries out
    in pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bull painted with white clay speaks to Raven-face, says Raven-face shot
    him, says he killed Raven-face's horse in response, grants Raven-face power to
    doctor people wounded by bullets or arrows and own horses thereby, and says he
    is going back.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the canyon of the Bighorn, Raven-face shoots a buffalo; near a cliff he
    loses his footing, slides under the buffalo, and his buffalo-hide belt catches
    on the buffalo's horn.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven-face dangles over the cliff until the buffalo throws him toward his
    frightened companion; the buffalo then goes down over the cliff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the near-death event, the narrator says a bear's earlier statement to
    Raven-face—that he need not fear death until he had lost his teeth—came true.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A large Crow camp travels toward the mountains; a nearly blind poor man and
    his wife travel with one horse, a small lodge, little meat, and the wife digs
    roots while they follow after the main camp.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Moon appears to the poor woman as a plainly dressed woman in an elkskin
    robe, with a large blue-handled knife, befriends her, and advises her to look
    for someone to work for them because her husband is nearly blind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wife tells her husband that horses are available for him at the fork of
    the Musselshell River; the husband asks her to prepare turnip pudding and call
    four brave young men, whom he tells they may have some of the horses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Of the four young men, two reject the poor man's claim because of his condition,
    while the other two decide to go with him because it may come true.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wife cuts up the tent cover to make moccasins, makes a padded saddle for
    her husband, brings out a Moon-given bag shaped like a halved hourglass, sings,
    and directs the party toward the Musselshell fork where the roan is expected.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After dark the travelers set out; on the Yellowstone three of them kill a
    fat buffalo, cook and save the meat, and eat without building a fire.
  category: action
  evidence_refs:
  - ev:8
