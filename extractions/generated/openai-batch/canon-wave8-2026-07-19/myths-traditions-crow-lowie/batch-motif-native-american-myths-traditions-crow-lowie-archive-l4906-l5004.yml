canonical_text:
  quote: ''
  summary: The passage contains the end of a serpent episode in which a snake invades
    Old-Woman’s-Grandchild’s body, is forced out through water and heat, and is punished,
    explaining why snakes bite only occasionally. It then begins a tale of twin boys
    violently removed from their pregnant mother by a witch; one twin survives behind
    a curtain and the other in a spring. The father discovers them, captures Spring-boy,
    makes an offering to Spring-boy’s water-associated father, and the twins later
    revive their mother before going toward a man-swallowing buffalo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake travels underground and enters Old-Woman’s-Grandchild’s body through
    the anus; as Old-Woman’s-Grandchild breaks parts of his body, the snake moves
    upward into the skull.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Curtain-boy takes the head to a hollow and watches while rain fills the skull
    with water and the sun heats the water until the snake comes out.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After the snake emerges, Curtain-boy seizes it, Old-Woman’s-Grandchild comes
    to life, and the snake is taken to rocks where its face or nose is rubbed down.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The snake begs for mercy and says it will bite only once in a while; the passage
    states this as the reason snakes do not often bite people now.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A pregnant wife cooks meat for a visiting woman, who says pregnant women are
    her plates and eats the food from the wife’s belly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The visiting woman cuts open the pregnant wife’s abdomen, removes two little
    twins, throws one behind the curtain and one into a spring, and props the woman
    up with sticks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband returns, touches the motionless wife, sees that her belly is empty,
    and later hears a small boy behind the wall ask for food and explain what happened.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father leaves food for the boy, finds two different tracks, makes bows,
    and learns that Spring-boy plays with the first boy but flees back to the well
    or spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Using rawhide gloves and a planned ambush, the father and the first boy capture
    Spring-boy; Spring-boy returns his sharp teeth to his father and asks that a complete
    buffalo be put into the spring for that father to eat.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After the boys grow up, Lodge-boy and Spring-boy attempt to revive their mother
    by speaking domestic prompts; she rises, goes outside with them, drinks, eats,
    stretches, and says she is well.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The father warns the boys not to go to a buffalo on the other side because
    it swallows anyone who goes there; the boys go with long willows packed crosswise
    and are swallowed by the buffalo.
  category: sequence
  evidence_refs:
  - ev:9
