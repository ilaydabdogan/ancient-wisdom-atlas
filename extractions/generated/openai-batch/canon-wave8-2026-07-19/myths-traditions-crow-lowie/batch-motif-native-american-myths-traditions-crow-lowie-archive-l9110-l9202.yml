canonical_text:
  quote: ''
  summary: One-eye throws an orphan boy into a hole in the ice. The boy falls into
    an underwater tipi, where a man, a woman, and two dogs that are really a bear
    and a mountain lion are present. The man says One-eye has misused his medicine
    power, gives the boy medicine objects, and instructs him to provoke One-eye over
    buffalo meat before killing him. The boy returns, repeatedly takes buffalo tongues
    and meat, sends meat through the ice-hole to the man below, and receives further
    instructions about a black horse for a life-staked race on the ice. One-eye’s
    injured youngest wife leaves him and marries the boy, leading One-eye to challenge
    the boy to the race.
  language: English
  quote_policy: summarized
literal_observations:
