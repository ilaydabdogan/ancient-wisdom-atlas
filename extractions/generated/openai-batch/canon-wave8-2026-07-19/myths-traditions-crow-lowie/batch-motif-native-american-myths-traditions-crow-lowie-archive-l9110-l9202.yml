  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man tells the boy that One-eye will make buffalo run into the ice three
    more times; the boy is to take tongues and meat, anger One-eye, and kill him the
    third time, throwing him into the same ice-hole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy returns to his tent, where his comrade and grandmother had mourned
    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the camp lacks meat, One-eye makes medicine and buffalo come; the people
    kill many buffalo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the first occasion after the boy’s return, the two boys take tongues, meat,
