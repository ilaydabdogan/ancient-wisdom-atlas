- id: obs:2
  text: Inside the underwater tipi are a man, a woman, and two dogs described as really
    a bear and a mountain lion; the animals growl until the man tells them to be still.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man says he did not tell One-eye to treat his tribesmen that way, but
    told him to fight other people; he also says he and Thunder had adopted One-eye.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy stays in the tipi for four days, and the man says he has taken away
    One-eye’s medicine and will also tell Thunder to take back One-eye’s medicine
    powers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man lays out medicines for the boy to choose; the boy chooses a club,
