canonical_text:
  quote: ''
  summary: 'The passage recounts successive encounters between Crow people and Whites:
    an early meeting associated with a remembered prediction that iron would appear;
    Crow experimentation with iron arrow points; intergenerational instruction to
    remember these events; later encounters involving flintlock guns, powder, and
    predictions of future White arrivals; Crow acquisition of guns through the Hidatsa;
    and the arrival of Crane, a White chief who lives among the Crow, marries an Indian
    woman, and brings goods by river, with Long-knife also approaching by boat.'
  language: English
  quote_policy: summarized
