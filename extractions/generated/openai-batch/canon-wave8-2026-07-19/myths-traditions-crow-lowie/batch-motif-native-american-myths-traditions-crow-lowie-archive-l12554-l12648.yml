canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving Bare''ate, called the Sun-worshiper:
    a fight with Sioux, his rescue and celebration, his use of medicine with a hoop,
    water, fog, sagebrushes, darkness, ashes, and sun-directed gestures to steal or
    recover horses, the return celebrations, the birth and naming of his son, and
    a brief comparison with Awucte/the Sweater before a move toward the Hidatsa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crow and Sioux forces fight after horses are stolen; Bare'ate remains in a
    hollow, kills two Sioux, has his roan horse killed, and is rescued by the Crow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the fight, the Sun-worshiper paints a black circle on his face, a black
    spot on his nose, black stripes on his arms and legs, carries a pole with a scalp
    tied to it, sings thanks, and acts as the “son” of the Sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Sun-worshiper knew what was going to happen and
    told people in advance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: On a later warpath, Bare'ate makes an offering, takes a hoop to a hill, sticks
    it into the ground, makes medicine, and then knows where the camp is.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When boys ask Bare'ate to make the night dark, he has one boy take water into
    his mouth and sprinkle medicine on him; soon a fog rises and visibility becomes
    poor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The raiding party steals horses at night, returns near daybreak, and meets
    at the hill Bare'ate designated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bare'ate uses four sagebrushes one after another by pointing them toward the
    sun and laying them down; each time the sun disappears and it becomes dark during
    the party’s flight.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After the final sunrise, the party swims the Bighorn Canon, crosses with all
    the horses, kills buffalo, builds a fire, eats, and returns to the Crow camp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Piegan steal Crow horses, the owner of a bobtail pinto asks the Sun-worshiper
    for help by laying his hand on his head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For the horse-recovery expedition, Bare'ate asks for a willow stick to make
    a hoop and a red blanket, leads the men, examines fresh horse droppings, throws
    ashes toward the enemy to put them to sleep, and marks his face after touching
    his tongue and extending his finger toward the sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Crow catch up with the Piegan at the Yellowstone River, kill six of twelve
    Piegan while they are swimming, and recover all the stolen horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sun-worshiper captures two guns and one bow, and the returning Crow sing
    and dance at several places before reaching home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: When Bare'ate returns home, his wife gives birth to a boy, and he names the
    child Ax’ac iaxpa’riac, glossed as “Sun-is-his-medicine.”
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Bare'ate is described as like a chief, and people want him to lead for good
    luck, but he refuses one request because his time has not yet come.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says Awucte was never hurt in war, while Bare'ate’s horse was
    once killed, and concludes that the Sweater was a little better off than the Sun-worshiper.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: A large group moves toward the Hidatsa; the four brothers go to the Hidatsa,
    and Awucte marries a Hidatsa girl.
  category: sequence
  evidence_refs:
  - ev:9
