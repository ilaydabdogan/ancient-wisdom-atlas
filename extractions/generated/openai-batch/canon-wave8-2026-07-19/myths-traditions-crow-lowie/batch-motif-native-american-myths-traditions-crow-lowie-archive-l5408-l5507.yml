canonical_text:
  quote: ''
  summary: Yellow-dog performs a fire ritual using four balls, communal shouting,
    and a white wolf apparition, after which a warm Chinook wind comes. He then directs
    repeated searches using buffalo chips and hill scouts, leading to buffalo herds
    that are killed for food. A wounded buffalo escapes to Morningstar, who sends
    animal messengers to investigate; a wolf warns Yellow-dog, and the messengers
    are killed or trapped.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yellow-dog orders able people to pile firewood, gather in a circle around
    it at night, and start the fire from all points.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yellow-dog paints himself red before standing at the edge of the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yellow-dog sings and throws four balls into the fire one at a time while the
    people shout; the fire and balls rise higher with each throw until the fourth
    goes out of sight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A white wolf comes out of the fire, barks, and disappears back where it came
    from.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yellow-dog announces that a Chinook wind will come to melt the snow, and a
    warm wind blows that night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Yellow-dog has seven buffalo chips brought to his tipi and tells men to climb
    the highest hill they can see.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Scouts repeatedly return howling like wolves and report buffalo herds; Yellow-dog
