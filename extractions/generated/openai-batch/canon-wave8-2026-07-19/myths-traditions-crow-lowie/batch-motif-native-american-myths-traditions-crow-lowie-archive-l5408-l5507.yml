  text: A four-year-old buffalo escapes from one of the killings with arrows in his
    body and reaches Morningstar’s buffalo corral.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wounded buffalo tells Morningstar that about two hundred buffalo had been
