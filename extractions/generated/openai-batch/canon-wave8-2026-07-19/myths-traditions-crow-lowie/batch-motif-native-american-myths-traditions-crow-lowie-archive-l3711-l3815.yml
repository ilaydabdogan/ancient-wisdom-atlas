canonical_text:
  quote: ''
  summary: A woman disobeys her husband and sees her people below through an opening.
    She and her son are lowered by sinew rope, but the rope breaks after a stone is
    commanded to strike; the woman dies and the boy survives. The boy later enters
    Red-woman's garden, is trapped, and is adopted by her. She repeatedly warns him
    away from dangerous places or beings; he deliberately goes there, kills bears,
    stills a closing coulee, kills a fog-causing long-otter from the spring, stops
    a deadly leaning tree, and takes burning moccasins from a sleeping man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman sees earth and her people through an opening associated with a turnip
    and moved buffalo chips after her husband tells her not to move the chips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman and her son are tied together with sinew and let down through an
    enlarged hole; the rope does not reach the ground, and a stone breaks the rope,
    causing the woman to die while the boy reaches the ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy enters woods, follows a path to a clearing with a garden, eats corn
    there, and is later caught in a leaf-covered pit by the garden's owner, Hicictawia,
    called Red-woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red-woman keeps the boy after he says he has no relatives, and he begins to
    live with her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy brings whole buffalo bodies, but the meat disappears within a few
    days and no bones are visible.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Red-woman is afraid of the boy and tells him not to go to a thicket where
    bears are present; he goes there, kills the bears, cuts off their claws, and brings
    the claws home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Red-woman tells the boy of a coulee that closes on anyone crossing it; the
    boy jumps back and forth until it remains still and commands it to stay still
    forever.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Morning fog is said to come from the spring; a long-otter from the spring
    eats hidden pudding and had also eaten the meat, and the boy kills it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Red-woman identifies the long-otter as her husband and tells it to live in
    the rivers because God's son is there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Red-woman warns of a leaning tree with many bones under it; the boy makes
    it fall, jumps on it, and commands it not to rise and fall again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy takes fire-moccasins from a sleeping man, uses them, burns the man
    after he begs for them, and keeps the burning moccasins tied to a tree outside
    the tent.
  category: sequence
  evidence_refs:
  - ev:7
