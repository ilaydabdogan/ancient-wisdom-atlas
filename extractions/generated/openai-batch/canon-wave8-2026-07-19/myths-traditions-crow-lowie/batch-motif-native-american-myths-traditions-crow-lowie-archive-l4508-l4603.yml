canonical_text:
  quote: ''
  summary: A man deceives a pregnant woman, kills her with a heated stone, removes
    two children, and throws one behind a lodge screen and one into a spring. The
    husband returns, finds his wife dead, and places her on a scaffold. The child
    behind the screen emerges and lives with the father. He repeatedly summons Spring-boy
    from the spring, and the brothers play. After the father learns of the second
    child, he and the first boy trap Spring-boy, who has dangerous teeth. Spring-boy
    returns to the spring to give back the teeth; the father throws buffalo meat into
    the spring, and Spring-boy is released to live with his human father and brother.
    The boys later tamper with the father’s small bag of white powder, replace it
    with ashes, and decide to raise their mother to life, beginning by taking her
    from the scaffold.
  language: English
  quote_policy: summarized
