canonical_text:
  quote: ''
  summary: 'The passage first concludes an Old-Man-Coyote episode in which he enters
    a Crow camp in elaborate finery, displays himself with a horse that later proves
    to be a brush-deer, is recognized, turns into a wolf, and leaves decorations that
    become bark; the Crow thereafter adopt the style of dress. It then presents the
    tale headed “Old-Man-Coyote and the Whirlwind”: Old-Man-Coyote marries a ghost
    woman who moves her lodge by night through thickets and mountains and can make
    day into night. He escapes, is hidden by medicine mice through transformation
    into a mouse, and an old mouse tells the ghost woman that her husband is the one
    who made the animals and fools whatever he sees, after which she gives him up.'
  language: English
  quote_policy: summarized
