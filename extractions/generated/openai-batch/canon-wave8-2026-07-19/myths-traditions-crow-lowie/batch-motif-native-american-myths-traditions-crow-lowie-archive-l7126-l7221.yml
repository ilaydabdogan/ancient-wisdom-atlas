canonical_text:
  quote: ''
  summary: A young Crow warrior prepares feathers, medicine objects, a spear, a black
    horse, paint, songs, and fourfold ritual acts before repeated fights. Enemy weapons
    fail against him; he kills enemies, takes horses and finery, and gains the name
    Crow-on-his-forehead. A young Sioux woman hears of him, refuses other marriages,
    and travels to the Crow camp, where he invites her into his black tipi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man gathers fallen feathers, has his mother cover and fringe a stick
    with buckskin, attaches feathers, makes head ornaments and a spear, and ties medicines
    to the end of a lodge pole beside his tipi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fine black horse comes into the horse bunch while the boy is tending horses;
    he rides it and asks his father not to cut it out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before battle the young man alters the horse’s mane and tail with white material,
    rubs its body with black earth, wears feathered and black-skin items, rides around
    camp, and is praised and named Crow-on-his-forehead by old men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man prepares four bullets with powder in four small bags and four
    bowstrings; his mother later paints the horse with white clay and sings four songs
    with him before he leaves for the fight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the first described fight, he throws out contents from a small bag and
    a bullet, passes through enemy lines four times, is not hit, and enemy bowstrings
    or guns fail.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: He kills enemy warriors with a spear and takes their horses, while telling
    others not to take anything from those he has killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A woman formerly captured by the Crow returns to her people and identifies
    the warrior as Crow-on-his-forehead, saying it was his first fight.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a later fight he again uses the black horse, white clay, medicine, and
    four songs; he puts water from his mouth into a small bag, throws it out, cuts
    a string, and the narrative says he made the enemy’s powder wet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After later victories he gives horses and finery to his father, who wears
    one bonnet, has his wife wear one, and sings praise songs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A young woman in the hostile camp refuses to marry anyone there, throws food
    into the fire when she eats, and says she wants to marry Crow-on-his-forehead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Before another battle the young man paints his tipi black, ties feathers to
    its door, and places war-bonnets and other finery around the lodge.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The young Sioux woman obtains her father’s consent, travels toward the Crow
    camp with a horse, mule, and moccasins, learns how to recognize the warrior’s
    black tipi and medicine pole, sits outside it at night, and is invited in by him.
  category: sequence
  evidence_refs:
  - ev:10
