canonical_text:
  quote: ''
  summary: A Porcupine and Old-Man-Coyote tale recounts a disputed buffalo butchery,
    Porcupine’s escape with the meat into a nest above a river, Old-Man-Coyote’s failed
    dives at Porcupine’s reflection, the injury and death of members of Coyote’s wolf
    family by falling meat, and an etiological curse explaining porcupines’ bark-eating.
    A following Old-Man-Coyote and Jack-Rabbit tale begins with a storytelling sleep-wager
    involving a sexual penalty; Rabbit lulls Old-Man-Coyote to sleep through descriptions
    of restful natural settings and escapes.
  language: English
  quote_policy: summarized
