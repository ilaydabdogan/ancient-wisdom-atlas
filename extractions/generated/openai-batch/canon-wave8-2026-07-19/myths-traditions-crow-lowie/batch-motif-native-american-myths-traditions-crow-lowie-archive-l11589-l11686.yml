canonical_text:
  quote: ''
  summary: A young man associated with Black-elk brings meat to people who have eaten
    birds, helps catch an eagle, and cures a boy wounded by the eagle using willow
    sweatlodges and bear-root. A returning horse-raiding party causes Black-elk’s
    family to believe him dead. After winter, an old man sends Black-elk home with
    the boy, first requiring a strange death and skin-shedding transformation of the
    boy. Black-elk travels with sagebrushes, feathers, closed eyes, and the boy’s
    guidance to a hill overlooking his home camp. His father and wife are seeking
    visions because they think him dead. Black-elk and the boy walk across water to
    camp; a fire goes out. A bird’s repeated song leads the father back, and Black-elk
    calls to his mother, who does not answer.
  language: English
  quote_policy: summarized
