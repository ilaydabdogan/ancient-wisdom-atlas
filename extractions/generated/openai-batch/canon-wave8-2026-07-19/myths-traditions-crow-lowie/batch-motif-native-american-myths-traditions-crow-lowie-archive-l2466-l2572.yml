canonical_text:
  quote: ''
  summary: The passage contains several Crow narrative episodes. In the first, a male
    figure encounters two girls who appear motionless, handles them, leaves to get
    stones, and is outwitted when they dress and escape. In the next, Old-Man-Coyote
    attempts to possess a disrobed beautiful girl, who becomes a box-elder tree and
    traps him; a winter-bird and three female beavers help free him, and the episode
    explains blood-like red material in box-elder wood. In the final tale, an abandoned
    child is raised by seven buffalo, returns as a capable boy, wins animal-killing
    challenges set by a chief, while Old-Man-Coyote falsely claims the trophies and
    receives the elder daughter; the boy marries the younger daughter and later outperforms
    Old-Man-Coyote in medicine-making displays involving buffalo and elk.
  language: English
  quote_policy: summarized
