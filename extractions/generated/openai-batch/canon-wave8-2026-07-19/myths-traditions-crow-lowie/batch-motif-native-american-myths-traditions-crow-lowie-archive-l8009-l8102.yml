canonical_text:
  quote: ''
  summary: 'The passage closes an eagle-patron tale in which a young man is sent home
    by eagles, receives eagle medicine and objects, reunites with his parents, marries,
    paints eagles on a tipi, and gains weather-forecasting power. It then begins a
    tale titled “A Visit to the Sun”: two ducks create human beings from mud in tribal
    pairs; a Hidatsa faster is carried eastward by cranes toward the Sun, receives
    guidance from the Moon, enters the Sun’s tipi, experiences supernatural hospitality,
    learns that the Sun and his wife eat human bodies, and sees the Sun’s son cause
    fog.'
  language: English
  quote_policy: summarized
