canonical_text:
  quote: ''
  summary: A young woman, urged by another girl to become a bear, uses a buffalo-hide
    covering and posture to take on bear form. The apparent play becomes lethal as
    she charges, kills boys, attacks camp inhabitants, and drives many people away.
    She has hidden her younger sister in a lodge and instructed her to make bear-root
    incense when she returns as a bear. The incense, repeated four times, restores
    her human body. Later the two sisters are alone and hungry; the elder sister threatens
    to eat the younger unless she spears a young jack-rabbit with a digging-stick.
    The younger sister goes out crying and encounters her six elder brothers returning
    from a war party.
  language: English
  quote_policy: summarized
