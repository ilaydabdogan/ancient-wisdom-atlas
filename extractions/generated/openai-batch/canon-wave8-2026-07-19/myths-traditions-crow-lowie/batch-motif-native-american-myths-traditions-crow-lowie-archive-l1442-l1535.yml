canonical_text:
  quote: ''
  summary: 'The passage first closes an Old-Man-Coyote episode in which he manipulates
    animals during a dance, captures some for food, is trapped by a tree, and loses
    his meal to Cl''rape''. It then gives the tale “Day and Night”: in primordial
    darkness Old-Man-Coyote gathers birds and brings four-legged animals to gamble
    over daylight and night. Turtle initially wins for the animal side by hiding elk
    teeth, but Dragonfly intervenes, exposes the hiding place, and helps the bird
    side win. The sun begins to rise, and Old-Man-Coyote assigns animal kinds their
    habitats, foods, and later relations to him, including removing bows and arrows
    from wolves and coyotes.'
  language: English
  quote_policy: summarized
