canonical_text:
  quote: ''
  summary: The passage begins with brief notes on the origin of stomach-kneading and
    on Red-woman’s sharp-pointed weapon. It then narrates a Crow tale in which seven
    brothers and their sister are left without adult care. One by one, brothers go
    hunting over a hill, kill buffalo, and encounter Red-woman, who forces them to
    carry heavy meat to her lodge. The brothers are found detained and starving. A
    left-handed brother uses medicine-arrows, obtains water and meat, feeds his brothers,
    and fights Red-woman, who wounds him with a shorter weapon.
  language: English
  quote_policy: summarized
