candidate_motifs:
- id: motif:1
  label: Origin of a healing practice
  taxonomy_refs: []
  basis: The passage explicitly explains the woman’s stomach-pushing and root-drinking
    treatment as the beginning of stomach-kneading.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This motif applies only to the brief introductory note, not to the subsequent
    Red-woman narrative.
- id: motif:2
  label: Armed supernatural woman as dangerous patron or opponent
  taxonomy_refs: []
  basis: Red-woman is introduced with a sharp-pointed weapon, associated with medicine
    sticks, and later acts as a threatening witch figure.
  evidence_refs:
  - ev:2
  - ev:16
  - ev:17
  confidence: medium
  cautions: The passage calls her a witch in speech but does not provide a full cosmological
    explanation of her status.
- id: motif:3
  label: Siblings orphaned and left vulnerable
  taxonomy_refs: []
  basis: After the father is killed and the mother dies, seven brothers and their
    sister have no caretaker, and the sister fears being left alone.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:15
  confidence: high
  cautions: The sibling group is larger than a simple pair; the available taxonomy
    ref 'sibling_pair' is therefore not applied.
- id: motif:4
  label: Sequential disappearance of hunters at the same place
  taxonomy_refs: []
  basis: Brother after brother goes over the same hill to hunt buffalo, meets Red-woman,
    is compelled to carry meat, and does not return.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage segment ends before the full outcome of the sequence is shown.
- id: motif:5
  label: Forced carrying of an impossible or injurious burden
  taxonomy_refs: []
  basis: Red-woman repeatedly commands brothers to carry heavy buffalo parts; the
    loads cut their shoulders and cause pain.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: Interpretation is limited to the literal pattern of coerced labor and
    injury.
- id: motif:6
  label: Medicine-aided sibling rescuer
  taxonomy_refs: []
  basis: The left-handed brother uses medicine-arrows, reaches Red-woman’s house,
    obtains water and food, and feeds the detained brothers.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage shows rescue-like actions but ends during the confrontation,
    so the final rescue is not present in this excerpt.
- id: motif:7
  label: Combat with witch using matched weapons
  taxonomy_refs: []
  basis: The left-handed brother and Red-woman both take sharp weapons and come to
    blows; Red-woman changes to a shorter stick and wounds him.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The fight’s final resolution is outside the provided passage.
- id: motif:8
  label: Stone-boy myth variant
  taxonomy_refs: []
  basis: A source note explicitly states that this is a variant of the Stone-boy Myth
    and cites related versions.
  evidence_refs:
  - ev:18
  confidence: medium
  cautions: The note supports the identification, but the excerpted narrative title
    is 'Red-Woman and Flint-like-young-man' and the full Stone-boy pattern is not
    fully visible in this line range.
