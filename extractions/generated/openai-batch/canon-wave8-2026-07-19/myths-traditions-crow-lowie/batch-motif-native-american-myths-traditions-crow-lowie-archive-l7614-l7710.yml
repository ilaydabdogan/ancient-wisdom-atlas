canonical_text:
  quote: ''
  summary: A Crow protagonist, aided or observed by Thunder, kills two long-otter
    monsters with arrows, red-hot stones, and water. Birds are summoned to divide
    and eat the monsters and return his arrows. The protagonist is transformed into
    a condor, later remembers he is an Indian, and is punished by an elk and underwater
    beings for killing water creatures before being restored to human form and sent
    home. The passage then begins a separate tale, "The Son-in-law's Tests," in which
    prior husbands vanish and a new son-in-law is sent on a task by his father-in-law
    during deep snow.
  language: English
  quote_policy: summarized
