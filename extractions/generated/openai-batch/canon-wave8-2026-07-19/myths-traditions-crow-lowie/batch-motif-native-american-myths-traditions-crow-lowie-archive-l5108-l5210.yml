canonical_text:
  quote: They were all eagles; their tipis were black and white.
  summary: In the first narrative segment, a small boy adopted by an old woman learns
    that Long-arm has captured his brother in another world and intends to eat him.
    The boy is carried to the performance place, confronts Long-arm, destroys Long-arm’s
    medicine stone, kills him, recovers his brother, strikes down the eagle people,
    orders them to scatter, and returns home through a sky opening. In the second
    segment, a good-looking woman with several failed marriages encounters a poor
    orphan boy at swimming and river-bathing places; their interactions become sexual,
    and the boy’s comrade warns him about her.
  language: English
  quote_policy: quoted
