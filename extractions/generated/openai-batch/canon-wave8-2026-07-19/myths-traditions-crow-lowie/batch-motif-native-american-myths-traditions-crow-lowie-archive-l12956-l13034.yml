canonical_text:
  quote: ''
  summary: A plain or ugly young man is betrayed when his handsome comrade steals
    the wife he helped him marry. The plain man asks Cunning-man for advice, and Cunning-man
    devises a carrot stratagem that causes the handsome man to accuse and beat his
    own wife. Cunning-man doctors the wounded woman, counsels her to elope with the
    plain man, and helps arrange their departure. The eloping couple later suffers
    hunger in the mountains until a dwarf hunter kills deer and gives the man food
    and hunting gear.
  language: English
  quote_policy: summarized
