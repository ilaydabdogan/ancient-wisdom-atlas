canonical_text:
  quote: ''
  summary: A crying baby is found and raised by buffalo bulls. The child is tested,
    nurtured, strengthened by a bear, given powers by an eagle, and grows into a handsome
    young man. After he drinks the water of All-bones' wife despite a warning, All-bones
    defeats the buffalo fathers. A sparrow reveals All-bones' vulnerable places, and
    the young man kills him with arrows. The young man cures his buffalo fathers in
    a sweatlodge and is adorned by animal patrons before returning toward his human
    people for marriage.
  language: English
  quote_policy: summarized
