- id: obs:1
  text: Buffalo bulls find a crying baby; the last bull, called Crazy-bull in the
    passage, throws the child into the air three times, after which the child progresses
    from sitting to walking and then running.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child follows the buffalo, lies on a buffalo in cold weather where the
    hair is thickest, and sits between the horns when they travel.
