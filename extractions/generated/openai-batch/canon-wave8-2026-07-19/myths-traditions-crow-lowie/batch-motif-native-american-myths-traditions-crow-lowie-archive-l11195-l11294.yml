  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a second account, men returning afoot from a war party see a shining large
    turtle with large claws on a high peak; one man mounts it, others follow, and
    one man stays apart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the second account, the riders become glued to the turtle, shots and axes
    fail, the turtle takes them into its lake home, and they drown while the man who
    stayed away survives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The survivor reports the deaths, an old man relays the story, and the camp
    mourns for the dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people choose a chaste woman, prepare a separate lodge spread with ground-cedar,
