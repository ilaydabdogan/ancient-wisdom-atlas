canonical_text:
  quote: ''
  summary: The passage begins with a fragment about buffalo hunting, mountain camping,
    trade goods, iron tools, traps, and White men giving practical and social advice.
    It then gives two accounts of young men returning from war parties who disrespect
    or mount a large turtle despite warnings. In both accounts the riders cannot get
    off, weapons do not stop the turtle, and the turtle takes them into a lake where
    they drown, while one or more men who did not ride survive to report the event.
    The Crow camp mourns, chooses a chaste woman, sets her apart in a cedar-strewn
    lodge, and offers her to Thunder as wife in exchange for help against the turtle.
    Thunder comes and gives ritual instructions involving seven sweatlodges, smoke
    to the cardinal directions, tobacco bundles, and a clan-by-clan camp at the lake.
  language: English
  quote_policy: summarized
