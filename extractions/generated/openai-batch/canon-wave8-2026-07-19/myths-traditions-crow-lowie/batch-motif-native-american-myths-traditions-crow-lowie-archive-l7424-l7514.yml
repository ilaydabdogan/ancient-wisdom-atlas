canonical_text:
  quote: ''
  summary: A young marksman is transported to a high island rock after touching a
    white moving object. There he meets two young birds, is aided and fed by their
    eagle parent, and learns that water monsters have repeatedly devoured the eagle’s
    young. The young man prepares hides, water containers, pine splinters, forked
    cherry sticks, fires, hot stones, and arrows. When two monsters arrive in fog,
    he sings his arrow song, shoots arrows into their mouths, throws hot stones into
    them, pours water into them, and kills both. Birds are summoned to feast on the
    dead monsters, and several birds attempt to cut one of the bodies.
  language: English
  quote_policy: summarized
