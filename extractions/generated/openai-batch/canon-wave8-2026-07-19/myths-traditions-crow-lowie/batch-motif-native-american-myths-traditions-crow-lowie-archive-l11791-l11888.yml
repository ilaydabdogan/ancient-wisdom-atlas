canonical_text:
  quote: ''
  summary: 'The passage contains adjacent tale segments. An unnamed medicineman enters
    the water to recover traces of a lost young man and punishes a turtle with a thunderbird-associated
    willow. Later, wounded on the warpath, he asks to be wrapped in buffalo hide and
    placed in ice-free water, but companions refuse; he dies where a spring emerges
    from a rock crack. A tale called "The Woman-Snatcher" follows: a tall left-handed
    wanderer kills women gathering firewood, is identified by a dying victim, tricked
    into joining the Big Dogs, seized, dismembered, and burned. The passage ends with
    the opening of "The Wicked Brother-in-law," where a woman exits by the smoke hole,
    catches rabbits in treetops, brings firewood, and feeds her household.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The medicineman asks for the exact place, rubs himself, takes a young willow,
    warns the others not to look, whistles upstream and downstream, and walks on water
    up to his ankles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The medicineman disappears under the water near the place where the young
    man had been taken and later reappears walking on the water with the lost man's
    necklace and a fleshless leg.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the medicineman's account, underwater speakers say the body had been given
    to another one from near Aides City, who ate it, and that a big turtle had captured
    the lost man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicineman brings out the turtle with the willow, touches and strikes
    it, says it is treacherous, and the turtle's hind legs are paralyzed; the willow
    is said to belong to the thunderbird and to strike like lightning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a winter warpath after the Flathead are sighted, the medicineman is shot
    in the abdomen and his spine is broken; he asks to be wrapped in a young buffalo
    hide and thrown into ice-free water, saying he will overtake the others in two
    days, but they refuse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The companions place the wounded medicineman in a crack on a high rock; the
    crack grows larger, a big spring comes out there, and he dies; a note says this
    was called a true story.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women who go to the woods for firewood fail to return and are found with arrows
    through them; a very tall, large, left-handed wanderer watches for women, ravishes
    them, and kills them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A dying young girl identifies the man as the one who ravished and shot her
    and says earlier missing women must have met the same fate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men hold council and ask the Big Dogs to recruit the dangerous man so that
    he can be tricked; four strong men become his particular friends and feed him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During a planned neck-hug walk after camp moves, the four seize the man by
    the wrists and legs; young men shoot him, strike him with hatchets, break his
    neck, cut his back, find his spine made of a young cherry tree, cut him up, and
    burn him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the opening of the next tale, a woman in a snowy winter camp shuts herself
    in, exits through the smoke hole, catches cottontail rabbits at the tops of trees,
    brings firewood, roasts the catch, and feeds her husband, brother-in-law, and
    sister-in-law.
  category: action
  evidence_refs:
  - ev:6
