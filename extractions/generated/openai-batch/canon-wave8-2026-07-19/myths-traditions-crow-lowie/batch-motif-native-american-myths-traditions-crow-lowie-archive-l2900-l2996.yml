canonical_text:
  quote: ''
  summary: A little boy repeatedly acts despite an old woman's prohibitions and warnings.
    Forbidden red corn becomes blackbirds, which he kills and the old woman revives.
    He kills two otters who are revealed as her husbands; their removal is linked
    to mourning custom and to the origin of a small river. He defeats a dangerous
    woman by turning her boiling jug against her. Later, two sharpshooter-runners
    frighten him with a buffalo calf foetus and bargain for access to his grandmother,
    who avoids them by becoming a pumpkin; Old-Man-Coyote suspects the deception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman tells the little boy that he may eat all kinds of corn except
    the red corn while she is in the garden.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy cooks red corn; it bursts, turns into blackbirds, and some fly out
    through the smoke hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy closes the smoke hole, shoots many blackbirds, and tells the old woman
    they will eat flesh from what he killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman plucks the blackbirds, makes them alive again by talking and
    praying to them, and releases them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy looks behind curtains in the tipi, finds two big otters eating corn,
    and kills both with arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman packs away the otters, who are identified as her husbands, and
    cuts her fingers and legs in mourning; the passage says Crow Indians have done
    the same since then.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The otters speak while being packed, warn that the boy is powerful, and the
    place where the old woman carries them becomes a little river called Short-river
    by the Hidatsa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman warns the boy about a dangerous comrade whose little rawhide
    jug boils anyone toward whom its opening is turned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy approaches the dangerous woman with birds as a gift, takes her jug,
    and uses it so that she is drawn into her own jug and boiled.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The boy brings the jug to his grandmother and says it will let her carry more
    squashes than she can carry in two armfuls.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old woman warns that two nearby sharp-shooters can shoot anything and
    are good runners who run all day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The boy finds the two men butchering a young buffalo; the bad man chases him
    with a calf foetus, and the boy climbs a tree while the foetus is hung about the
    middle of it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boy remains in the tree until he is bones and skin; the men agree to remove
