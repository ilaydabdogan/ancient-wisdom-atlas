canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a woman conveys Thunder’s
    instructions for draining a lake, after which Thunder dries it and exposed water-demons
    are killed while the bones of lost Indians are recovered. It then begins “The
    Deserted Children”: children left behind when camp flees an enemy take supplies,
    go to the mountains, build shelters, fast, receive dreams or supernatural aid
    from a dwarf and a hawk, hunt game, fight Piegan enemies, acquire horses, marry,
    have children, and prepare for further war-party action.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thunder comes at night making noise, and the next morning the woman reports
    instructions attributed to her husband.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each clan digs a ditch from the lake, breaks the earth barrier at the shore,
    and the lake water streams out and falls low.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman orders people to tie door flaps fast and secure dogs inside; Thunder
    then shoots into the lake all night until dawn, and the lake is dry by morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The dried lake exposes a water-coyote, a beaver-demon, other beings, many
    striped tipis, and water-demons without water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young men shoot the surviving beings until all are killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a striped tipi, bones of lost Indians are piled up, and the turtle said
    to have captured them is present; a shaman kills the turtle, and the bones are
    taken home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Children playing away from camp are left behind when the people break camp
    and flee from an approaching enemy, thinking the children have been killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deserted children return, find the camp gone, collect sinew, a knife,
    and other objects from the campsite, go to the mountains, and make shelters of
    sticks and grass.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four of the oldest boys fast on a mountain for four days and report dreams
    or supernatural encounters concerning war leadership, doctoring, camp leadership,
    hunting skill, strength, and medicine power in battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The boy aided by the dwarf makes two new flint-headed arrows, goes with three
    other boys, kills two mountain sheep, and the children drink blood and eat meat
    cooked over a fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The same boy later kills two buffalo at a time, and the children make larger
    shelters covered with leaves and animal skins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four boys encounter Piegan men butchering buffalo; the two-arrow boy kills
    both, and the hawk-adopted boy counts coups, scalps them, and throws their bodies
    down a cliff.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The children acquire horses, grow older, marry within the group, spend a winter
    hunting, have children, move to a wooded river place, and the oldest prepares
    to lead a war party.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: An editorial note describes the deserted-children tale as a familiar Plains
    Indian theme, says this Crow version has no close parallel, and mentions related
    Assiniboin and Blackfoot variants.
  category: other
  evidence_refs:
  - ev:9
