candidate_motifs:
- id: motif:1
  label: Thunder-assisted draining of a monster-inhabited lake
  taxonomy_refs: []
  basis: The woman organizes ditch-digging and Thunder shoots into the lake until
    it dries, exposing water-demons and other beings.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage begins at the end of an earlier tale, so the wider narrative
    cause and full context are not included.
- id: motif:2
  label: Human remains recovered from the dwelling of a water-being
  taxonomy_refs: []
  basis: Bones of lost Indians are found piled in a striped tipi, and the turtle that
    captured them is killed by a shaman before the bones are taken home.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The excerpt does not include the earlier capture episode, only the recovery
    and killing of the turtle.
- id: motif:3
  label: Deserted children survive apart from the main camp
  taxonomy_refs: []
  basis: Children are left behind when the camp flees, then gather leftover tools,
    move to the mountains, make shelters, hunt, and form a continuing group.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage is truncated before the full ending of the tale.
- id: motif:4
  label: Mountain fasting leads to dreams and life roles
  taxonomy_refs:
  - initiation
  - mystical_quest
  - ascent
  basis: Four older boys go on a mountain to fast for four days and report dreams
    or supernatural encounters that designate war, healing, camp leadership, hunting,
    strength, and medicine power.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The text describes fasting and dreams but does not itself use an analytic
    term such as vision quest.
- id: motif:5
  label: Supernatural patrons grant hunting and war powers
  taxonomy_refs:
  - initiation
  basis: A dwarf teaches one boy to shoot game and gives strength against enemies,
    while a hawk gives another boy medicine power to fight and not be shot.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: Only two patron encounters are described in detail in the excerpt.
- id: motif:6
  label: Two flint arrows associated with repeated double kills
  taxonomy_refs: []
  basis: The dwarf-adopted boy makes two flint-headed arrows and subsequently kills
    two mountain sheep, two buffalo at a time, and two Piegan enemies.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage links the arrows to the boy’s medicine work by sequence, but
    does not explicitly state that the arrows themselves are supernatural.
- id: motif:7
  label: Abandoned youths become hunters, warriors, spouses, and parents
  taxonomy_refs:
  - initiation
  basis: The children progress from abandonment to hunting, enemy killing, horse use,
    marriage, winter residence, births, and war-party preparation.
  evidence_refs:
