canonical_text:
  quote: ''
  summary: The passage includes the end of an Old-Man-Coyote episode, the tale “The
    Hoodwinked Birds,” and the tale “Old-Man-Coyote and Porcupine.” In the bird tale,
    Old-Man-Coyote seeks food, receives help from mice in making a bloodied disguise,
    falsely presents himself as bereaved, and kills several birds before the remaining
    birds identify him and flee. In the Porcupine tale, Porcupine persuades a buffalo
    to carry him across a river by letting him enter through the buffalo’s anus, then
    kills the buffalo from within with his quills.
  language: English
  quote_policy: summarized
