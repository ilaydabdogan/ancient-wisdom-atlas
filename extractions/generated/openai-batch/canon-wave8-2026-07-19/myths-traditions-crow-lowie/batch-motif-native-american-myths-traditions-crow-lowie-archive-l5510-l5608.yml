canonical_text:
  quote: ''
  summary: Yellow-dog receives Old-Man-Coyote with prepared food, his wife, and a
    pipe; after this encounter Coyote advises him how to survive Morningstar’s attempts
    to destroy him through a storm and later through battle. Yellow-dog stops the
    storm with a pipestem, uses a poor boy as a decoy in battle, and kills Morningstar’s
    son. The passage then begins the tale of Corn-Silk, a Hidatsa girl who refuses
    suitors and says she wants One-feather-gone-from-his-wing.
  language: English, with Crow lexical forms in transliteration
  quote_policy: summarized
