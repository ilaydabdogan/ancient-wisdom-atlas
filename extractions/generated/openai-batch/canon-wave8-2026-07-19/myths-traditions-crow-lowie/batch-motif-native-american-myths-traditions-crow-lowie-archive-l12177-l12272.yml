canonical_text:
  quote: ''
  summary: The passage closes one Crow tale in which a young man infiltrates an enemy
    Sun dance, finds a boy hanging from the center pole as an offering to the Sun,
    is captured during an attempted rescue, passes an ordeal involving four buffalo
    skulls, kills the chief’s father, escapes with the rescued boy, hides from pursuers,
    steals a horse, returns home, reunites the boy with his mourning sister, and marries
    her. It then begins another tale in which a Crow girl refuses suitors, her brother
    is captured by Sioux who intend to offer him to the Sun, and she promises marriage
    to anyone who brings back a finger or other body part of her brother; a poor orphan
    adopted by an old woman is introduced.
  language: English
  quote_policy: summarized
