canonical_text:
  quote: ''
  summary: The passage concludes a Crow hero tale in which an unnamed young man returns
    with horses and scalps, resists a medicine-powered antagonist, kills him, restores
    property and wives to the people, and becomes a prosperous chief. It then begins
    the tale of One-eye and Looks-at-the-white-buffalo, rival invulnerable warriors
    whose conflict leads Looks-at-the-white-buffalo to a death-seeking raid and trench
    fight in a Sioux camp.
  language: English
  quote_policy: summarized
