canonical_text:
  quote: ''
  summary: In a creation-style dialogue, Old-Man-Coyote’s wife and Red-woman establish
    fruits, hide-softening methods, gendered differences, medicines, vision practices,
    horse mortality, buffalo butchering, hunting materials, bowstrings, arrow points,
    and the Crow Indians’ position among tribes. A following tale explains the joking-relationship
    through Old-Man-Coyote’s encounter with a yellow buffalo calf. A third episode
    describes Old-Man-Coyote visiting the Crow camp he says he made, transforming
    a mountain-goat into a decorated horse, and making regalia from bark, leaves,
    dirt, and a buffalo shoulderblade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old-Man-Coyote’s wife proposes making many kinds of fruit among trees and
    strawberries among grass to prevent starvation, and the dialogue states that the
    sun will ripen fruit and turn it black when ripe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers prescribe buffalo brains, a prairie plant with grease, and liver
    as substances used to soften a buffalo hide.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Red-woman wanted men and women to be the same size and way,
    while Old-Man-Coyote’s wife says women will have dress and leggings tied above
    the knee, will not run as well, and will not be as strong as men; it also says
    a mistake produced half-men, identified in the text as bate or berdaches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speakers discuss medicines, wishes for Indians, presents to the Sun, sweatlodge,
    and Tobacco, and the future reward of tears shed by people going out for visions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that horses will grow old and die at any time, and that
    buffalo will be arranged so people know where to cut and can butcher them easily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage assigns chokecherry trees or any wood for arrows, stones for arrowheads,
    sinew for bowstrings, and explains the presence of rocks by saying arrow points
    can be found anywhere.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Crow Indians are to be put in the middle of other tribes so they can fight
    the rest of the tribes.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Old-Man-Coyote finds a yellow calf lying in a buffalo track with swollen feet,
    calls it his younger brother, carries it, becomes tired, and refuses the calf’s
    suggestion that he kill and eat it because joking-relatives would laugh at him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator says Old-Man-Coyote’s father is not known and connects this with
    the practice of the joking-relationship, stating that people say what Old-Man-Coyote
    said.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the Crow camp has grown large, Old-Man-Coyote visits, says he will visit
    the Crow Indians whom he made, and finds women getting bark from cottonwoods and
    drinking sap.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Old-Man-Coyote changes a mountain-goat into a decorated horse, commands the
    horse to prance and neigh, fashions horse trappings from bark and leaves, paints
    himself with dirt, decorates himself, and makes an eagle-tail fan from an old
    buffalo shoulderblade.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
