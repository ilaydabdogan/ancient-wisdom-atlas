canonical_text:
  quote: ''
  summary: The passage is a comparative introduction assessing Crow tale parallels
    with Omaha, Assiniboin, Dakota, Arapaho, Hidatsa, Arikara, Gros Ventre, Kiowa,
    and other Plains traditions. It distinguishes weak or widespread resemblances
    from stronger cases attributed to contact or diffusion, especially Crow/Hidatsa
    links with Arapaho and the distribution of the Grandchild or Porcupine-pattern
    complex.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage identifies four Crow parallels to the Omaha trickster cycle:
    hoodwinked birds, Rabbit covering the trickster, the bungling host, and the false
    suitor.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage qualifies the Omaha-Crow parallels by assigning some to Dakota
