    from the rolling rock incident.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Shoshoni, Blackfoot, and Arapaho equivalents of Lodge-Boy
    and Thrown-Away are closer to the Crow plot than the Ponca version.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the buffalo-woman and corn-woman story has parallels, but
    fewer than Pawnee and Oglala equivalents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes Crow-Assiniboin folklore as having a greater series
    of resemblances, with some close enough to imply direct connection.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage explains Crow-Assiniboin similarities through contact, noting
