canonical_text:
  quote: ''
  summary: 'The passage begins with the close of a tale in which a woman revives,
    a young man hunts with pygmy arrows, steals horses from a foreign camp, returns
    after being presumed dead, and a dispute involving wife-taking is settled through
    horse compensation and speech by Cunning-man. A new tale follows: a rich young
    man takes the wife of his poor friend; the wronged man repeatedly feasts and gives
    gifts to Cunning-man, who brings medicines but instead instructs him in ruses
    involving peeled turnips and later a nighttime action near the woman’s tent to
    make the husband suspicious.'
  language: English
  quote_policy: summarized
