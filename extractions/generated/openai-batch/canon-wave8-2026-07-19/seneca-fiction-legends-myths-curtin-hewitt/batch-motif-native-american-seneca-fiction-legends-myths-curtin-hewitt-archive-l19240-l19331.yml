canonical_text:
  quote: ''
  summary: During a hunting season, a Stone Coat Woman helps hunters obtain beavers,
    warns them that her angry husband will attack, and instructs them to kill him
    with a fire-hardened basswood spear. After his death she warns that his brothers
    will come, and the people escape by canoe from a cannibal pursuer. A following
    Genonsgwa account tells of a Stone Coat who brings hunting luck, magically compresses
    hunters' loads, later sends for a Seneca hunter to marry his daughter, strengthens
    the son-in-law by rubbing his body with objects or substances, and aids him in
    a race against a Stone Coat rival who threatens to behead him and take his wife;
    the Seneca wins and beheads the rival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Stone Coat Woman goes with hunters to a beaver pond, cuts a small circular
    hole in the ice, calls beavers out, kills them, and eats their bodies raw while
    the men keep the furs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Stone Coat Woman warns the hunters that her angry husband is coming and
    tells them to prepare a basswood stick, sharpen it, and harden it in the fire
    to spear him from behind when he throws her down.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband arrives, speaks with his wife, becomes jealous when he sees two
    men, fights, knocks his wife down, and is killed when the men thrust the basswood
    spear into his body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the husband's death, the Stone Coat Woman says his two brothers know
    he is dead and will come to kill them, so the people should escape by canoe on
    the open river.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: As the people depart by canoe, a man on shore calls them back; when they refuse,
    he says he came to eat them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In a second account, a Stone Coat asks to stay with Seneca hunters and says
    they will have good luck, all the skins and meat they need, while he will take
    the rest.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunters have great hunting luck, and when they leave, the Stone Coat packs
    each man's meat and skins into bundles, shakes the bundles until they become small,
    and says they will become large again when cast down at home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The next winter, another Stone Coat says his father sent him to bring one
    hunter home as a son-in-law; one Seneca volunteers and marries the old Stone Coat's
    daughter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The old Stone Coat rubs the Seneca son-in-law's hands, feet, and body with
    an object like a bone and later rubs a substance from a stone box over his body
    before a race.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: A Stone Coat rival who loves the old Stone Coat's daughter challenges the
    Seneca to a foot race, declaring that the winner may cut off the loser's head
    and that he will take the wife if he wins.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:11
  text: During the race, the rival holds onto the Seneca's hand as their locked arms
    bend over a hemlock tree; when released, the tree springs back and throws the
    rival backward, allowing the Seneca to win and cut off the rival's head.
  category: sequence
  evidence_refs:
  - ev:12
