canonical_text:
  quote: ''
  summary: 'The passage closes a serpent-combat episode: two transfigured warriors
    use all their orenda against an enchanted rock, after which the old man who transformed
    them returns carrying the head of a great horned snake. The passage then begins
    the story of Hodadenon and his elder sister Yenyent''hwus. She keeps him protected
    inside their bark lodge. A hidden, weakened brother, Hadjisgwas, lies in the attic
    and is fed carefully with chestnut mush from an enlarging pot and given tobacco
    in a pipe. Hodadenon later imitates the feeding and smoking with all the remaining
    chestnut and tobacco, strengthening Hadjisgwas but causing Yenyent''hwus to warn
    that the brother may die because of this mischief.'
  language: English
  quote_policy: summarized
