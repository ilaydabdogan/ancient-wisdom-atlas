canonical_text:
  quote: ''
  summary: An old man instructs his young nephew to divide seed corn, beans, and squash
    seed among ten small baskets and to plant them in clearings. Twice, while the
    nephew is planting, the old man sings that he has arisen. The nephew first returns
    and restrains him, but on the second occasion the roots holding the uncle down
    break, and the uncle disappears. The nephew finds his uncle's deep tracks leading
    west, follows them for three days to a lake shore, and sees a canoe propelled
    by twelve wild geese carrying a man who commands the geese as servants.
  language: English
  quote_policy: summarized
