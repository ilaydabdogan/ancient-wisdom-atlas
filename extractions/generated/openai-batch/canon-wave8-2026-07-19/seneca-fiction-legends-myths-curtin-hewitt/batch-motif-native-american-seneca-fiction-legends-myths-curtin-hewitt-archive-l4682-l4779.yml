canonical_text:
  quote: ''
  summary: An old woman and her grandson live poorly in a forest lodge. The grandmother
    reveals a forbidden room of clothing, weapons, lacrosse gear, and a drum, warning
    the boy not to enter or touch anything. The boy disobeys, plays with the drum
    and lacrosse gear, and learns that Deadoendjadases, a far-eastern devourer, has
    eaten their relatives. The boy sets out east, reaches a strawberry clearing and
    long lodge guarded by a skin-man sentinel, borrows a mole skin to approach him,
    and learns that Deadoendjadases and his three witch sisters keep their hearts
    hidden under the wing of a loon in a lake beneath a bed. The boy plans a deception
    to obtain the hearts.
  language: English
  quote_policy: summarized
