canonical_text:
  quote: ''
  summary: Two brothers travel an extraordinary distance to a spring despite an uncle's
    warning. The elder brother drinks, pulls two hair-covered water creatures from
    the spring, kills and burns them, and continues with Turkey Brother. Later an
    old man uses an apparent raccoon and a tree hole to trick the elder brother, pushes
    him into a hollow tree, steals his garments and pouch, grows younger, and heads
    toward a chief's lodge. The trapped elder brother finds bones of prior victims,
    recalls dream promises from a spider and a blacksnake, and calls them for help;
    the spider's web ladder breaks, and the blacksnake lowers its tail into the hollow.
  language: English
  quote_policy: summarized
