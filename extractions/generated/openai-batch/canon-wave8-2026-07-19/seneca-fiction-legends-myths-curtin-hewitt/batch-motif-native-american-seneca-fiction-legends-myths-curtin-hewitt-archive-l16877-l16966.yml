canonical_text:
  quote: '"Now, I am rising. Now, I am rising."'
  summary: Okteondon, a youth hidden from babyhood beneath the roots of a large tree
    in his maternal uncle's forest lodge, repeatedly tries to arise at puberty. His
    uncle delays him until the tree falls. Visitors and young men arrive, food and
    garments are prepared, and Okteondon leads companions through deep snow to the
    camp of four young women. He disrupts their fires and kettles, obtains bear meat,
    warns his companions not to take meat to their wives, and joins the youngest woman
    while Hot'hoh chooses the eldest.
  language: English
  quote_policy: quoted
