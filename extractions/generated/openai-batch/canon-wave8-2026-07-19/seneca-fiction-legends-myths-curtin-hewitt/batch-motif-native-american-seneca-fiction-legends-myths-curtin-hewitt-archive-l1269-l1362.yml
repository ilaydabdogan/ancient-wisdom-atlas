canonical_text:
  quote: ''
  summary: The passage explains how personified things and processes are treated as
    gods or first people in Seneca/Iroquoian mythic thought, how these beings teach
    culture and reveal divine knowledge through dreams, visions, and theophanies,
    and how later narratives may substitute human heroes for natural-force beings.
    It also distinguishes history, legend, tale, and sacred legend, noting Seneca/Iroquoian
    names for sacred legend and the taboo restricting its telling to certain seasons,
    with punishment attributed to offended first people.
  language: English
  quote_policy: summarized
