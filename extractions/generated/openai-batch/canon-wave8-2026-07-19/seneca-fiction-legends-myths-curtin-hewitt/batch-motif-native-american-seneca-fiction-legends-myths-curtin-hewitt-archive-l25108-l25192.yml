canonical_text:
  quote: ''
  summary: A young wife in a lodge is visited by an unusually large woman carrying
    an unusually large child. The visitor reassures the frightened wife, sits on the
    opposite side of the fire, refuses ordinary food, and eats raw venison supplied
    by the hunter husband. The next morning the visitor gives her child to the hunter,
    saying it is his own and that she came so he could look at it; the hunter reluctantly
    accepts the child, then returns it to her and leaves to hunt.
  language: English
  quote_policy: summarized
