canonical_text:
  quote: ''
  summary: A dog-man disguised in a man's garments defeats an oppressive chief in
    a ball game, kills him, returns to dog form, and enables the human family he aided
    to take the chief's lodge and status. A narrator adds that dogs possess orenda
    and can help or harm people depending on whether they are loved. The passage then
    begins the story of Ganyadjigowa, who travels along a lake, steals meat from Twentgowa,
    befriends Hongak, tricks and abandons Hongak on a narrow rocky path, and later
    falls into water before sheltering in a hollow tree.
  language: English
  quote_policy: summarized
