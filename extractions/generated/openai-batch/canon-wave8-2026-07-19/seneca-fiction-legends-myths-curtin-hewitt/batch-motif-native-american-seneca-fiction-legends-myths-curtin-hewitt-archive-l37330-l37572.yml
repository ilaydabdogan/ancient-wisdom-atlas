canonical_text:
  quote: ''
  summary: A figure identified in the gloss as Sagowenota orders servants, described
    as dogs, to go seek the place where a human being's bones lie. The dogs take the
    scent from tracks and pursue a great child. The great child hears Sagowenota and
    hears him tell wild geese, called his servants, to go seek their own food; the
    wild geese fly away. Sagowenota follows the dogs' path, hears distant barking
    or yelping, reaches a place where something has happened to a dog, and remarks
    that it seems bad and smells bad; the passage ends as more distant barking is
    heard.
  language: Seneca with English interlinear glosses
  quote_policy: summarized
