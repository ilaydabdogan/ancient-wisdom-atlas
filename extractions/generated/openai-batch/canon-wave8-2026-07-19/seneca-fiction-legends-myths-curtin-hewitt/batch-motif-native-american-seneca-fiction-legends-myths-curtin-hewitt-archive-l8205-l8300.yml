canonical_text:
  quote: ''
  summary: Hodadenon kills three man-eating witches, reports his victories to his
    sister Yenyent'hwus, and then travels to obtain chestnuts. On the way he passes
    a river, a mountain wall, giant beings, herons, and a platform watch-woman by
    giving offerings or using a mole to move underground. He takes half a chestnut,
    escapes pursuing sisters and their mother by disappearing into the ground, and
    returns to his sister. He later hears his brother Hotgoendaqsais, who is tied
    in the east and tormented for wampum tears. Yenyent'hwus says tobacco was stolen
    to the other side of the world by Deagahgweoses, a great wizard; Hodadenon prepares
    to travel there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three man-eating women try to strike Dagwanoenyent with clubs; Hodadenon wills
    their death, and the boy and his uncle cut off their heads and burn their lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dagwanoenyent and Hodadenon become friends, and Dagwanoenyent says he will
    come to help if Hodadenon thinks of him in trouble.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hodadenon tells his sister that he has ended or defeated several uncles and
    killed the three witches; his sister thanks him because many people had been deceived
    and killed by them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yenyent'hwus prepares parched corn meal and two dumplings with bear's fat
    for Hodadenon before he goes to get chestnuts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a river crossed by a fallen tree, two rattlesnakes rattle; Hodadenon gives
    each one a Tsohoqgwais and tells them they are free, and the snakes leave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At a mountain wall pass, Hodadenon gives dumplings to two very tall S'hagodiyoweqgowa
    and tells them they need not guard the place any longer; they leave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hodadenon brings wild beans to two Djoasha, called herons in the passage,
    tells them to be free, and they leave.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hodadenon makes slippery-elm bark turn to wampum, uses a mole to travel underground
    to a platform, gives wampum to the woman on watch, and takes half a chestnut from
    piles near a tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The watch-woman first says she has seen someone, then says she has lied; the
    mother tells her daughters it must be Hodadenon and urges them to kill him and
    finish his family.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Three sisters and then the old woman try to strike Hodadenon with clubs, but
    he disappears into the ground; each strikes her own kneepan and is disabled.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Hodadenon returns unharmed to Yenyent'hwus and gives her the half chestnut,
    telling her to make plenty of mush for their brother.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Hodadenon hears his brother Hotgoendaqsais singing and calling his name; Yenyent'hwus
    says the brother is tied to a stake in the east and burned with firebrands so
    that his wampum tears fall.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Yenyent'hwus says tobacco grows on the other side of the world where Deagahgweoses
    lives, and that Deagahgweoses stole their tobacco and is a great wizard.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Hodadenon asks for parched corn meal, receives a heavy food bundle from Yenyent'hwus,
    begins his road, and disappears from her sight after she expects him to return.
  category: sequence
  evidence_refs:
  - ev:14
