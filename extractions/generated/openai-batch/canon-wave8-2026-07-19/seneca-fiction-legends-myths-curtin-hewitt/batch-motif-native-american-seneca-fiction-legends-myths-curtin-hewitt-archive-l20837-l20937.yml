canonical_text:
  quote: ''
  summary: 'The passage contains the end of one narrative about a woman fleeing a
    pursuing man and dog with help from several beings, followed by her protected
    return home. It then begins the narrative of Gaqga and Sgagedi: a guarded sister
    leaves the lodge for water, is abducted through the air by Gaqga to an island,
    and receives warning and escape instructions from another man when Gaqga plans
    to kill her.'
  language: English
  quote_policy: summarized
