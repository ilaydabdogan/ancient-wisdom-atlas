canonical_text:
  quote: ''
  summary: A boy, later called Hodadenon, leaves his elder sister and travels south
    along a dangerous path. He camps at places marked by old fireplaces and forked
    rods bearing food left by previous travelers whom he believes to be dead brothers.
    He repeats the act by setting up bread on a rod. He kills or disables a giant
    cuckoo at a tree marked by many arrows, then survives a night attack by a small
    dog with a knuckle rattle and a woman who calls the dog her slave and wants Hodadenon's
    head. The boy kills the dog, removes its rattle, throws the body into water, and
    continues until meeting a man who greets him peacefully.
  language: English
  quote_policy: summarized
