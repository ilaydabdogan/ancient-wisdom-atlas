canonical_text:
  quote: ''
  summary: Doonongaes refuses to marry the chief's daughter despite pressure. The
    girl's crying spreads to Doonongaes, the old widow, her granddaughter, and the
    chief. Doonongaes cries through the night, and in the morning his tears are found
    to have become beautiful wampum, which he says can console a sad person when strung
    and given. He refuses the chief's offer of rulership, states that he is second
    in magic power to Tsodiqgwadon of Dedyosdenhon, and later directs the widow to
    seek a poor 'Shabby Man' as a husband for the chief's daughter.
  language: English
  quote_policy: summarized
