candidate_motifs:
- id: motif:1
  label: Tears transformed into wampum
  taxonomy_refs: []
  basis: The captive woman's tears fall to the ground and become beautiful wampum
    that the people gather.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports the transformation but does not explain an origin
    or ritual meaning for wampum.
- id: motif:2
  label: Rescue during captors' distraction
  taxonomy_refs: []
  basis: Deoyadastat'he rescues his mother while the people are on their knees gathering
    wampum.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The evidence is limited to this episode and does not state a broader formula.
- id: motif:3
  label: Spoken command transforms enclosure into deadly heat
  taxonomy_refs: []
  basis: Deoyadastat'he speaks a command that the lodge become flint and heat to white
    heat, killing the people trapped inside.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Although fire and heat are central, the destruction is local to a lodge
    and should not be equated with a world-destroying fire.
- id: motif:4
  label: Birds emerge from the dead
  taxonomy_refs: []
  basis: After the people in the lodge die, their heads burst and owls come out and
    fly through the smoke-hole.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explicitly call this an origin of owls or a shapeshifting
    act.
- id: motif:5
  label: Dismembered attacker prevented from rejoining
  taxonomy_refs: []
  basis: The blue lizard is torn apart, and the dog carries the pieces away so they
    will not fly back into place again before becoming cool.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the action but not a broader identity or significance
    for the blue lizard.
- id: motif:6
  label: Central sacred tree as light source and passage-maker
  taxonomy_refs:
  - sacred_tree_axis
  - world_center
  basis: A sacred white-blossoming tree stands in the middle of the sky village, gives
    light through its flowers, and when uprooted leaves a hole through which the woman
    falls to another realm.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The tree is explicitly central and sacred, but the passage does not use
    an abstract axis or world-center terminology.
- id: motif:7
  label: Repeated dream command requiring communal obedience
  taxonomy_refs: []
  basis: The woman dreams three times that the tree must be uprooted, and the people
    ultimately accept the counsel after initial resistance.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The Ongwe's nature and authority are not explained in the passage.
- id: motif:8
  label: Sky woman cast down through tree-hole
  taxonomy_refs:
  - departure
  basis: After the tree disappears, the chief orders the dreaming woman cast into
    the dark hole, and she falls from the sky world into the sky above this world.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The departure is forced rather than voluntary, and the passage fragment
    does not complete the later outcome.
- id: motif:9
  label: Pre-earth water world with no land
  taxonomy_refs: []
  basis: After emerging below, the woman sees a great expanse of water with water
    beings but no land.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not yet describe the creation of land.
- id: motif:10
  label: Water animals cooperate to rescue falling human
  taxonomy_refs: []
  basis: Loon summons the water folk, and Fishhawk and his warriors catch and hold
