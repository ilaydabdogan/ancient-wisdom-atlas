- id: ev:5
  type: summary
  locator: 17861-17865
  quote_or_summary: Before the earth exists, human beings dwell in the center of the
    sky above; a tree covered with white blossoms stands in the middle of the sky
    village.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 17866-17877
  quote_or_summary: A woman dreams that an Ongwe says the white-blossoming tree must
    be pulled up by the roots; the tree's flowers give light when blooming, darkness
    follows their fall, and the people regard the tree as sacred. A second dream calls
    for a circular trench and promises better light.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 17878-17885
  quote_or_summary: A third dream repeats the command to uproot the tree; one man
    advises that heeding the dream may bring better light and rejoicing, and the people
    adopt his advice.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 17886-17896
  quote_or_summary: Men cut around the tree roots; when the last root is cut, the
    tree sinks from sight. The chief orders the dreaming woman cast into the dark,
    apparently bottomless hole, and she falls for a long time.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 17897-17903
  quote_or_summary: The falling woman emerges into bright light in this world's sky
    and sees below her a great expanse of water with loons, ducks, and water folk,
    but no land.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 17904-17912
  quote_or_summary: Loon sees a human being falling from above and calls the water
    folk together to help her. Loon sends Fishhawk and his warriors to catch her in
    the air; Turtle offers to care for her, but Loon objects that Turtle eats flesh.
  source_text_path: texts/public-domain/native-american-northeast-woodlands/project-gutenberg/seneca-fiction-legends-myths-curtin-hewitt.md
  rights_note: Public domain source; summarized.
