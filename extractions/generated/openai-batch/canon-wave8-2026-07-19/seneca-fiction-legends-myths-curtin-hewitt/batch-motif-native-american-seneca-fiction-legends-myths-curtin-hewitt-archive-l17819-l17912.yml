canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which Deoyadastat''he rescues his mother
    during an attempted torture, destroys the hostile lodge, defeats a blue lizard,
    and returns home. It then begins a Genesis fragment: before earth exists, people
    live in the sky around a sacred white-blossoming tree; a woman repeatedly dreams
    that the tree must be uprooted; after the tree sinks and leaves a dark hole, the
    chief has the dreamer thrown into it; she falls into a lower sky above a water-covered
    world and is caught by fishhawks at Loon''s direction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief Dihdih tells the people to be ready for beads, and his two daughters
    light torches for people intending to burn the woman's feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When torches are held under the woman's feet, her tears fall to the ground
    and become beautiful wampum, which the people rush to gather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Deoyadastat'he watches for an opportunity, unbinds his mother while the people
    gather wampum, and leads her out of the lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Deoyadastat'he commands the lodge to become flint and heat to white heat;
    the people inside cannot escape, die, and owls come from their burst heads and
    fly out through the smoke-hole.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Deoyadastat'he, his mother, and his dog leave; a blue lizard attacks them,
    Deoyadastat'he tears it apart, and the dog carries away the pieces so they will
    not join again before cooling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At old Yeqsinye's lodge, Deoyadastat'he says he has killed the people of the
    wicked village so she may live in peace; she thanks him. He then returns to his
    own lodge with his mother and dog and finds his six brothers there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the earth exists, human beings dwell in the center of the sky, and
    a tree covered with white blossoms stands in the middle of their village.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The tree's flowers give light when they bloom, darkness comes when the flowers
    fall, and the people regard the tree as sacred.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman repeatedly dreams that an Ongwe says the great tree must be pulled
    up by the roots and that better light will come afterward; the people resist the
    instruction before finally accepting it after a man's counsel.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Men dig and cut around the roots; when the last root is cut, the tree sinks
    and disappears, leaving a hole.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The chief orders the woman who had the dreams to be cast into the hole, which
    appears bottomless and dark; she falls for a long time.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After passing through the hole, the woman emerges into bright light in the
    sky of this world and sees only a great expanse of water below, with water beings
    and no land.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Loon sees the falling human being and calls the water folk to help her so
    she will not sink when she reaches the water.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Loon's request, Fishhawk and his warriors meet the falling woman in the
    air and receive her on their backs, holding her there while the water folk decide
    what to do.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Turtle says he will take care of the woman, but Loon answers that Turtle cannot
    do so because Turtle is too fond of eating flesh.
  category: speech
  evidence_refs:
  - ev:10
