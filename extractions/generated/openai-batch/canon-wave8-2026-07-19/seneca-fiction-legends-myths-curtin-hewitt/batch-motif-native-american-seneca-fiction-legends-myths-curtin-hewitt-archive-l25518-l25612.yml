canonical_text:
  quote: ''
  summary: A returning young hunter uses enchanted objects to restore a canoe and
    oars to small size and goes home. He is invited back to the chief's shooting match,
    where the chief's tutelar hen-harrier hawk serves as a high aerial target. After
    all others fail, Djengo'se reluctantly shoots the bird and is awarded the chief's
    daughter as bride. Jealous rivals hire sorcerers to kill him; he dies at dawn
    in his wife's arms. His widow sees him leave the lodge and follows his trail for
    three days and nights into a place identified as not the land of the living. At
    a narrow passageway two men question her, hear her story, and give her roasted
    pheasants as toll for a later passage guarded by panthers, directing her onward
    toward a third passageway.
  language: English
  quote_policy: summarized
