canonical_text:
  quote: ''
  summary: A hunter with a wife and children in the woods returns to his mother’s
    lodge with meat and resists pressure to remarry once, then later yields and marries
    a beautiful stranger. His first wife had warned that betrayal would make him lose
    his hunting orenda and never see her again. After the second marriage, his meat
    disappears, hunting fails, and the new wife suffers hunger. He returns to the
    forest cabin, finds it empty with moccasins and ash signs, and follows traces
    left by the children until he reaches another cabin where his first wife recognizes
    him.
  language: English
  quote_policy: summarized
