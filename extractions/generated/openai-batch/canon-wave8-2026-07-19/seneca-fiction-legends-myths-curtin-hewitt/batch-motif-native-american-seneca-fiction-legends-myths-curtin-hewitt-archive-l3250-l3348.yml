canonical_text:
  quote: ''
  summary: A hunting party reaches Kingfisher's Place, observes hunting injunctions,
    and petitions the Stars, Moon, and Sun for success. One stubborn hunter disregards
    his leader's warning not to go beyond the usual bounds. Camping alone by a stream,
    he sees two apparent women, one carrying and nursing a baby. He suspects they
    are Genonsgwa, avoids giving them a reliable crossing route, and repeatedly uses
    the stream, a fallen-log footbridge, and a ford to keep away from them. At his
    camp, one of the women handles his tomahawk and asks whether it can kill; he warns
    her to put it down. He continues to evade the two figures by recrossing the stream.
  language: English
  quote_policy: summarized
