canonical_text:
  quote: ''
  summary: A young man accompanies a party of twenty warriors traveling north. After
    he dreams that a man warns the party to change course or perish, the headman rejects
    the warning. The party encounters the tracks of Ganiagwaihegowa, a deadly bear-being,
    and turns aside while the young man continues alone. He meets the great bear,
    strikes it, is chased to a stream, and defeats it by repeated crossings and by
    shooting its forefoot. He takes hairs and a tooth from the carcass. The warriors
    later burn the body and take ashes and bones as medicine for desired powers, and
    they come to respect the young man as one with great orenda.
  language: English
  quote_policy: summarized
