canonical_text:
  quote: We die and become alive again
  summary: Djainosgowa seizes Doonongaes from Tsodiqgwadon's lodge to test his orenda.
    Tsodiqgwadon follows, becomes invisible, rescues Doonongaes, and later drives
    Djainosgowa away through superior orenda. Doonongaes explains a long fight with
    Skahnowa over his lodge. Tsodiqgwadon confronts Skahnowa, explains Doonongaes's
    renewed life as normal for people of potent orenda, and Skahnowa agrees not to
    quarrel. After finding Doonongaes's home disturbed, Tsodiqgwadon assigns him two
    undesirable women; Doonongaes leaves during the night and travels south for ten
    days and nights.
  language: English
  quote_policy: quoted
