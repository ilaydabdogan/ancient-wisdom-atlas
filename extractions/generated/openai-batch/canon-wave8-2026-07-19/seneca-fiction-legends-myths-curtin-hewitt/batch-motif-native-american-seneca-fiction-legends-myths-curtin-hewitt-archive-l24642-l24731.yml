canonical_text:
  quote: ''
  summary: A husband visits his wife for seven nights and then asks her to return
    with him to his mother's lodge. On the way, his body divides into two forms along
    two parallel trails and reunites when the paths join. At his mother's lodge, the
    wife gives birth to male twins; the witch grandmother casts the twins beneath
    separate beds, later gives them balls and lacrosse clubs, and they become active
    ball players. A ball enters the lodge of their blind maternal uncle, who says
    he drew them there by sorcery and explains that their grandmother took his eyes.
    The twins attempt to restore his sight by borrowing the eyes of the Horned Owl,
    but the attempt fails; they next meet the Barred Owl.
  language: English
  quote_policy: summarized
