canonical_text:
  quote: ''
  summary: An old man brings two ambassadors before a village council. The ambassadors
    confirm that they were sent to propose ending bloodshed between their people and
    the village. The chiefs debate whether to accept peace or reject it; one chief
    urges vengeance for slain kin, while another stops him and argues that all were
    made of one flesh, form, and reddish color. The peace proposal is accepted, with
    a plan to bury war implements deeply and meet in joint council at a river halfway
    between the two peoples. Both sides prepare, count the days, and set out with
    all their people toward the river meeting place.
  language: English
  quote_policy: summarized
