  summary: The passage opens a story titled with a gloss referring to the Spirit of
    the Tides. In ancient time an uncle and nephew live in a large lodge. The ancient
    uncle lies supine, with a large tree and several roots on his body so that he
    cannot rise. After a long time he speaks to his nephew, directs him to plant food
    crops, and then tells him to fetch a basket of seed-grain from under the bed or
    couch.
