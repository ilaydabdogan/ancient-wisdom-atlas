  quote: "“What I do now shall be the practice of our people hereafter...”"
  summary: The passage first gives an autumn sign in which blood and oil on oak leaves
    are linked to a bear. It then tells of two devoted brothers living alone in the
    forest. The younger brother directs the elder, obtains turkey feathers for headgear,
    secretly sings and dances, learns songs from birds, receives a turkey-skin pouch
    or robe, and declares that his songs and feather-wearing will become the practice
    and insignia of their future people. He then sings and identifies a war song.
