canonical_text:
  quote: ''
  summary: An unnamed woman is led to a rock-opening lodge and told she has become
    a man's wife. After living there, she explores while he is away and is warned
    by an old man that her husband is a great horned snake. From a high place she
    watches water rise, the horned snake approach, and thunder and lightning destroy
    the rocks. The old man, later identifying himself as Hinon, and two other men
    purify her by drink and rubbing; snakes and foul creeping things leave her body.
    She is returned home and instructed to use native tobacco as a cleansing plant
    and offering. The passage then begins another tale in which a younger brother
    discovers that a woman secretly takes the elder brother's hunted game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man tells the woman that she has become his wife and cannot help herself,
    and says his home is near.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: They descend a precipice wall to a large opening in the rocks; inside, the
    place seems to the woman to be a lodge with fine things and a skin couch assigned
    to her.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After some time in the lodge, the husband leaves every day as soon as the
    sun rises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the husband says he is going far away, the woman goes outside to look
    around but does not know where she is or the direction from which she came.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man finds the woman, calls her his grandchild, says he was sent to
    warn her of danger, and tells her that her husband is a great horned snake.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old man tells the woman that he will kill the husband and destroy his
    lodge, and instructs her to sit in a high place and watch.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While the woman watches, a large body of water rises to the level of the rock
    opening, and a great horned snake with a glistening face approaches the rocks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman recognizes the great horned snake as her husband; thunder and lightning
    then strike the rocks, blowing them apart, and the water subsides.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old man says the husband is killed, that there are three rescuers, and
    that the woman must be purified before she can return home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old man gives the woman liquid from a small vessel to drink and rubs the
    rest on her lower back; three large snakes then pass from her reproductive organs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A further beverage causes the woman to vomit worms, ants, maggots, and other
    foul creeping things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old man says the woman is saved from evil orenda, and the three men say
    she is freed from the evil power of her husband and his people.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The old man identifies himself as Hinon, gives instructions about whom she
    should marry and that she must tell her friends what happened, and the three men
    take her home in a journey that seems to her like flying through the air.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After her return, her family finds her in the lodge, and she recounts that
    she became the wife of a great horned snake and was rescued by Hinon.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Hinon gives her a basket to fill with native Indian tobacco, says the plant
    is used for cleansing, and instructs her to leave small quantities in the woods
    as offerings to him.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the beginning of the next tale, two brothers live in the forest; the elder
    hunts but brings home no game, and the younger discovers that a woman from a side
    path takes the elder brother's game.
  category: sequence
  evidence_refs:
  - ev:10
