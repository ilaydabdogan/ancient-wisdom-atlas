canonical_text:
  quote: ''
  summary: A grandson reaches the Eagle people's mountain dwelling, is transformed
    into a panther to reach his grandfather, searches through Wolf country, restores
    his grandfather from bones under a hickory tree, then experiences separation,
    repeated conflict, marriage and family dispersal, food refusal, pursuit, death
    by hunters, and retaliatory killings that produce hostility between Panther people
    and the hunters' people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The grandson reaches the Eagle people's dwelling on a mountain and is told
    that his grandfather had been expelled and rolled down the mountain to the Wolf
    tribe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old chief of the Eagle people warns the grandson to go home, saying that
    otherwise he will lose his mind and become something or someone else.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the grandson consents, the Eagle people change him into a panther and
    roll him down into Wolf swamp, where Wolf people attack him but cannot kill him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandson searches Wolf country for his grandfather, finds his bones, places
    them under a large hickory tree, calls for him to arise, and the grandfather springs
    up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grandfather and grandson fight and separate; the grandfather later returns
    to former acquaintances, is killed and eaten a second time, and his bones are
    left on the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The grandson continues seeking people of his own tribe and escapes a hunter
    by killing the hunter's three dogs one by one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The grandson marries a woman of his own tribe and has several children, but
    the parents and children quarrel, and the family disperses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Panther-tribe woman refuses to share deer meat with the hungry grandson;
    later, when he has venison and she asks for some, he growls and snarls until she
    leaves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hunters with three dogs pursue the grandson; he climbs a tall tree, is shot,
    falls dying, and says the act will cause hostility and deaths between the hunters'
    people and his tribe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Panther kinsmen kill and devour the hunters and dogs; the hunters' kin later
    find bones and the Panther man's body, report sleeping Panther men nearby, and
    organize to destroy the Panther tribe.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
