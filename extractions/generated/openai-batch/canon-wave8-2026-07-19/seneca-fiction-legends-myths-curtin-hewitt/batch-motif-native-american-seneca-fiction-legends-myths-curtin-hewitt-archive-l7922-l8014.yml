canonical_text:
  quote: ''
  summary: 'The passage first gives a warning map to chestnuts at the eastern end
    of the world and to the lodge of wizards, listing a river crossing, paired rattlesnakes,
    a steep rocky mountain with a single pass, large beings, alarm-givers, and a singing
    woman on a platform. It then narrates Hodadenon''s early hunting outings under
    Yenyent''hwus''s care: he kills a roof creature identified as a chickadee, is
    forbidden to eat his first game, and then goes out with a belt and repeated boundary
    warnings, killing increasingly larger birds. The final line is incomplete as he
    identifies an approaching creature.'
  language: English
  quote_policy: summarized
