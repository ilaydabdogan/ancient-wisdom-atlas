canonical_text:
  quote: ''
  summary: The passage closes a preceding tale with Ongwe Hangesha hunting while a
    mother and daughter live peacefully. It then begins the Seneca legend of Gajihsondis,
    in which an old man trains his very small grandson with a bow and arrows, gives
    him a raccoon-foot target and the word 'Gajihsondis,' releases him from tutelage,
    and tells him of distant kinsmen who went to a place of a great beast in a spring
    of water. The youth departs with his bow, crosses a mountain, reaches a lake,
    shoots a white waterfowl, retrieves it with a cord made from his hair, brings
    it home, learns it is not the object of vengeance, returns it to the lake, and
    tells it to come to life again.
  language: English
  quote_policy: summarized
