canonical_text:
  quote: ''
  summary: A persistent singing woman on a mountain prompts a community council to
    send a respected old man to investigate. On the summit he encounters a young woman
    who invites him near, promises to empower him, and says a plant called White Corn
    will grow where she has lain and become a food boon for his people. After an embrace
    and swoon, she vanishes; the old man later returns, tends the corn plant, harvests
    three ears, distributes the grains, and teaches planting. A following tale begins
    with peoples dividing hunting territories by compact; a hunter violates the boundary,
    causing war and near extermination, and one survivor flees into a cavern where
    he sees a lodge and woman.
  language: English
  quote_policy: summarized
