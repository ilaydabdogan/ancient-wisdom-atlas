canonical_text:
  quote: ''
  summary: 'S''hodieonskon moves through several communities and repeatedly deceives
    people: he reports dangers or sicknesses, sells urine as bear''s oil medicine,
    uses bears to injure a man, appears as a man covered in hemlock boughs, creates
    panic about a spear-bearing destroyer, kills a chief, takes the chief''s wives
    and property, then stages burial and a return from the grave to justify marrying
    the widows. The passage then begins a separate tale about an uncle and nephew
    living in a divided forest lodge; the nephew learns the uncle is a man-eater.'
  language: English
  quote_policy: summarized
