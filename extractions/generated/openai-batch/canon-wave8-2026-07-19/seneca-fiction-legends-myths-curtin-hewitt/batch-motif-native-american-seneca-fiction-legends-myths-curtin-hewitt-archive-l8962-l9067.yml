canonical_text:
  quote: ''
  summary: Hodadenon and his sister escape across a lake from Ongwe Ias; a hook and
    line pulls their canoe back, but Hodadenon breaks the hook and later makes thick
    ice over the lake, causing Ongwe Ias to strike and crush his head. Hodadenon melts
    the ice and brings his sister home. A new tale begins in which an uncle and nephew
    live alone; the uncle says western sorcerers captured their tribe. The nephew
    secretly watches the uncle bring a hidden young man from under an old couch, feed
    him, and accompany his dancing with a turtle rattle. The next day the nephew calls
    the young man out despite warnings that western women will hear him and carry
    him off. Two women arrive from the west in a canoe through the air and question
    the boy, who denies the brother’s presence. Later the uncle questions the boy
    about what happened.
  language: English
  quote_policy: summarized
