canonical_text:
  quote: ''
  summary: Hagowanen meets Handjoias after losing his canoe. Handjoias blames an island
    man and offers to return the canoe for meat, though the narrator states Handjoias
    himself had taken it. Hagowanen later marries a Hongak woman who brings marriage
    bread, and they have ten sons. Hagowanen leaves across the Big Lake. The sons
    go northward in succession to seek their father and brothers; the older sons encounter
    a lodge with four smoking old men in the corners, are lured by promises of seeing
    their father, and are killed. The youngest son asks to follow, and his mother
    warns him about four old men brothers called Hadiiades, or Blacksnakes, who live
    on the road and have great magic.
  language: English
  quote_policy: summarized
