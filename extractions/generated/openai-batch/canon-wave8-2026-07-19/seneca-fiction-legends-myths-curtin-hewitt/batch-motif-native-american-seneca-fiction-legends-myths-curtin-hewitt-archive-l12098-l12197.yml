canonical_text:
  quote: ''
  summary: A nephew flees with his wife while his uncle pursues her as prey. The nephew
    uses a clamshell to contract a lake so they can cross, but the wife silently pities
    the uncle and he hears her thought, imitates the shell action, crosses, and kills
    her. The uncle finds twins in her body, hides them with parts of their mother
    in a hollow tree, and returns with her body. The nephew later finds signs of the
    murder, hears blood speak from willows, and discovers two small children stealing
    meat and hiding in a hollow log; one child refers to him as father.
  language: English
  quote_policy: summarized
