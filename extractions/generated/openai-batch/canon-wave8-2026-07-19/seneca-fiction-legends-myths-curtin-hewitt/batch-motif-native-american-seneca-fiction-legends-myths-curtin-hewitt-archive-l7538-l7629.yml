canonical_text:
  quote: ''
  summary: A hunter leaves his village, camps, and hunts successfully. At night his
    two dogs discover a dreadful creature in a hollow broken elm tree. The dogs speak,
    ask to be marked with coal, warn that they will die, prepare the man for flight
    by licking his feet and instructing him about moccasins and muddy water, and fight
    the pursuing tree-leaping monster. One dog dies, then the other, while the man
    gives the death cry near the village. Villagers hear him, come with torchlight,
    and the man faints as he reaches them.
  language: English
  quote_policy: summarized
