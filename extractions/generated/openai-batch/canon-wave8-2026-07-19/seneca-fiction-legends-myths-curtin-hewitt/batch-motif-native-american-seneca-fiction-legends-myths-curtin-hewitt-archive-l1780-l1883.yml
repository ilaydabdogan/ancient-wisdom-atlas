canonical_text:
  quote: ''
  summary: A son of Dagwanoenyent instructs a young woman to bring three white chert
    stones and a doll when drawing water so that she can escape an old woman. The
    young woman places the doll at the spring, boards the young man's canoe, and flees.
    The old woman discovers the deception, pursues the canoe with fishhooks three
    times, and each hook is broken with one of the stones. The old woman then drinks
    up lake water to draw the canoe back, but the young man kills her with a knife.
    The pair reaches the mainland, where the young man hides his wife in a hollow
    stump before introducing her to his mother, whose wolves detect a human smell.
    Later the wife bears male twins, who grow quickly and are given lacrosse sticks,
    bows and arrows, and a raccoon foot target by their grandmother.
  language: English
  quote_policy: summarized
