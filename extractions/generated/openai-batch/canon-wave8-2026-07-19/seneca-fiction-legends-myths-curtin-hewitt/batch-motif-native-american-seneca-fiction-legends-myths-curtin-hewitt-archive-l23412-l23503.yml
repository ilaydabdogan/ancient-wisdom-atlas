  quote: ''
  summary: The passage describes brothers living in a long lodge, their daily hunting
    and meat-drying routine, the confinement and archery practice of the youngest
    brother Little Burnt Belly, Honenhineh's unsuccessful hunting and fast, a nighttime
    episode in which Little Burnt Belly secretly watches Honenhineh eat after sparks
    fall on him, and Honenhineh's northward departure to hunt, ending with his arrival
    near clearings and a deep gorge or valley.
