canonical_text:
  quote: ''
  summary: Ganyadjigowa wakes wet and troubled after dreaming that Dahdahwat attacks
    him. At noon he goes fishing by canoe, catches a fish after confusion with its
    shadow, becomes lost on the lake, and reaches an unfamiliar shore. After walking
    until night, he finds a hut where Gaasyendiet'ha boasts of superior magic power,
    world-knowledge, speed, flight, and authority under the Blue Sky. Ganyadjigowa
    enters, taunts and deceives him with remarks about stones, persuades him to allow
    an overnight stay, repeatedly violates an order not to speak, comments on tobacco
    smoke, and asks what the world is made of.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa dreams that Dahdahwat approaches, chases him, throws him down,
    and bites him; he wakes wet, in sunlight, sad and worried about his dreams.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ganyadjigowa goes far out into the lake in a canoe to catch fish and initially
    dives after fish unsuccessfully.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He discovers that a fish beside the canoe has a shadow visible in the water,
    catches the fish, eats it, and then realizes he does not know the way back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After reaching a shore where he sees no lodge, he leaves the canoe, walks
    all day toward what he supposes is home, and finds a hut in the woods at night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man in the hut says he knows how to get great magic power, knows the whole
    world, can give magic power, and wishes Ganyadjigowa would come.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gaasyendiet'ha says he is the greatest runner and flyer, can make light go
    through the world, has the greatest magical strength, killed the Duck people who
    tried to chase him, and was appointed chief of all people under the Blue Sky.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ganyadjigowa enters the lodge and asks whether the strange man was talking
    about him; the man denies it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Outside the hut, Ganyadjigowa strikes two stones together and says he would
    do that to the man if pursued, but when questioned he gives a different explanation
    involving a friend and stones carried in travel and thrown away in water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gaasyendiet'ha partly believes Ganyadjigowa's explanation, and Ganyadjigowa
    laughs because he thinks the man believes him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ganyadjigowa asks to stay until morning; Gaasyendiet'ha objects, calls him
    mean, and finally permits him to stay only on condition that he not talk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At night Gaasyendiet'ha sits by the fire with a pipe, puts coals into it,
    and puffs smoke while Ganyadjigowa repeatedly asks about tobacco, taste, and the
    movement of smoke.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After being told not to speak and almost expelled, Ganyadjigowa laughs and
    asks what the world is made of; he then begins another question about people saying
    that a man lives up in the Blue, but the excerpt breaks off.
  category: speech
  evidence_refs:
  - ev:9
