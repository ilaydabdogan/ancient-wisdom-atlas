canonical_text:
  quote: ''
  summary: Two twin boys disregard their grandmother's warning not to go north, encounter
    Dagwanoenyent in a pine-tree nest, survive a rain of darts, and retaliate with
    a rain of fire that kills him. Later they find blind relatives in a cave-lodge
    whose eyes have been taken for a robe by false women, while their younger sister
    has been robbed by Shagowenotha. One twin infiltrates the eye-robe makers by becoming
    a small blue duck and then a newborn child, steals the robe of human eyes, and
    restores the eyes to the blind uncles. The reunited group lives happily and finally
    becomes rabbits.
  language: English
  quote_policy: summarized
