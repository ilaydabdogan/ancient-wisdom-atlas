canonical_text:
  quote: ''
  summary: In the supplied passage, an elder brother makes deer, wild animals, and
    a human being from earth and animates some creations by blowing on them. A younger
    brother repeatedly attempts to make humans but produces strange or monstrous beings,
    some of which he directs against the elder brother's humans and animals. The elder
    brother creates a female companion, gives the first pair blood and pain after
    they cut off arms, ordains children, hunting, death, and a sky destination for
    spirits. He confines the younger brother's hostile monsters underground, but S'hagodiyoweqgowa
    remains on earth after promising healing service with fire ashes. The younger
    brother declares that he will cause evil-mindedness and torment evil dead, while
    good dead go to the elder brother in the sky.
  language: English
  quote_policy: summarized
