canonical_text:
  quote: ''
  summary: Water beings debate how to care for a woman. Turtle offers his carapace
    if earth can be found; water folk dive, Hell-diver retrieves earth, and Beaver
    and Duck people spread it on Turtle. The earth grows into an island where the
    woman descends and gives birth to a daughter. The daughter grows rapidly, marries
    a young man later perceived as a turtle, and becomes pregnant. Twins converse
    in her body; one is born naturally, while the other exits through her armpit,
    killing her and bearing a flint-shaped head. The dead mother’s burial produces
    white and red corn from her breasts. The younger twin later creates a grasshopper
    and birds from earth or clay by commanding and blowing on them.
  language: English
  quote_policy: summarized
