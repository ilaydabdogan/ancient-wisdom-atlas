- id: obs:4
  text: On a later errand with 22 loaves of marriage bread, two girls ask the Ohohwa
    man the way to Doendjowens’s lodge, and he shows them his own lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the Ohohwa lodge, the girls find Ohohwa’s wife and a little boy and place
    the marriage bread near the woman, thinking she is Doendjowens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ohohwa tells his wife to move to the other side of the fire and pretend he
