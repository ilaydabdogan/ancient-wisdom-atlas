canonical_text:
  quote: ''
  summary: In the first episode, an Ohohwa man deceives daughters carrying marriage
    bread by inventing a lost arrow, stealing the basket, misdirecting them to his
    own lodge, and falsely claiming the identity of Tagonsowes. The girls recover
    the basket, use elm logs as bed decoys, find Doendjowens’s council lodge, and
    deliver the bread. They live with Tagonsowes, while Doendjowens later sends meat
    and grants a fire for their mother. In the following creation passage, God creates
    the sun and moon, becomes lonely, forms a human being from earth caught among
    the roots of an uprooted hemlock, breathes life into him, and is displeased with
    the result.
  language: English
  quote_policy: summarized
