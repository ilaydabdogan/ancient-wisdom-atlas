    leaving.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At an open place, the girls look into a council lodge and see Doendjowens,
    her son, two fireplaces, many people, and Ohohwa dancing while people give him
    meat and fat.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The girls enter the council lodge, place the basket of marriage bread near
