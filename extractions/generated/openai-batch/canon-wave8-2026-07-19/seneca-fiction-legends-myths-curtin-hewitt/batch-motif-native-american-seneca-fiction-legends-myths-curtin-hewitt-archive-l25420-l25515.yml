canonical_text:
  quote: ''
  summary: A boy uses an enchanted arrow that hunts game and provides food for his
    household. After he wins an exceptional hunting result in a contest connected
    with the chief's daughter, envious young men lure him to a remote island and abandon
    him. At night he survives in a pine tree by distracting the dogs of a Son of the
    Winter God with partridges. In the morning he produces a tiny canoe from his stomach
    and enlarges it by striking it with enchanted arrows.
  language: English
  quote_policy: summarized
