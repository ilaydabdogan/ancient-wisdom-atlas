canonical_text:
  quote: ''
  summary: A young man visits two dangerous uncles in succession. The second uncle
    challenges him to a head-wager race, loses after both step on a sharpened deer
    horn, and is beheaded and burned; an owl flies from his burst head. The third
    uncle challenges him to a head-wager hiding game, but the youth changes into a
    woodtick and repeatedly finds him. The uncle tries to delay midday by pushing
    the sun east with a pole, but loses, is beheaded and burned, and an owl flies
    from his head. Bones of the uncle's victims are found. The grandmother warns of
    a fourth uncle more evil and more potent in orenda.
  language: English
  quote_policy: summarized
