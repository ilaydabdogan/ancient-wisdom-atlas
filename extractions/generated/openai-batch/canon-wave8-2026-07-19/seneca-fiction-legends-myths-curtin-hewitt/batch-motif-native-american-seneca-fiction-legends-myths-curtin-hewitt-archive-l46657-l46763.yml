canonical_text:
  quote: ''
  summary: 'Editorial notes explain Seneca terms and story details: reptile fasting
    in hibernation; a partridge appellative; a feast pole reaching the clouds used
    by wizards to test orenda of visitors seeking Partridge''s daughter; sorcerous
    contamination of an arrow and neutralization by a woman; Iroquoian marriage supervision
    by female kin; island, animal, bee, sky, cloud, worm, wind, star, sun, and moon
    names; reed sorcery; Thunder People counted as seven or four; a muckworm named
    as punisher of mankind; and a personified Cloud Man.'
  language: English
  quote_policy: summarized
