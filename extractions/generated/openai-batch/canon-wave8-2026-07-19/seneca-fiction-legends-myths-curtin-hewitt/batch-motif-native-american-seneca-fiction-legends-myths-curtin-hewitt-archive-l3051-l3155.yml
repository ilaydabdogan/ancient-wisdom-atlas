canonical_text:
  quote: ''
  summary: A woman enters a Crow village, presents herself as young, marries a chief's
    son, and denies her earlier husband and children. Her first husband is killed;
    her sons are hidden and raised by the Crows, become successful hunters, and later
    confront their mother during a deadly snow journey. A second tale begins in which
    a man pursued by a self-declared man-eater escapes by sending his moccasins ahead
    and becoming a dead rabbit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman comes to a Crow village, says she seeks a place to live and a husband,
    and is sent to the chief's lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman is described as looking young because her hair is tied tightly back
    and her breasts are cut off; one of the chief's sons marries her.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Her earlier husband arrives looking for his wife; she denies prior marriage,
    and the chief orders warriors to kill him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Feathers in a bowl become bloody, and a boy understands this as showing that
    his father is dead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The two boys travel westward, find two cubs on the ground, and the younger
    boy sees breasts on a tree and knows they belong to his mother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman denies having children; the chief orders the boys killed, but the
    Crow household hides them from the warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Crows care for the boys, move deep into the woods, plant corn and beans,
    and prosper while the boys grow up and hunt successfully.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After several years the chief sends people to find the Crow family, and they
    discover them living in happiness and plenty far away in the woods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the village party travels toward the Crow family's place, heavy snow
    and cold overtake them; many die, are buried, or turn back.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The woman, her husband, and a child reach the Crow lodge nearly frozen; the
    elder brother pushes his mother back with a forked stick and throws the baby into
    the snow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: An old Crow woman tells the elder brother not to act wickedly even if his
