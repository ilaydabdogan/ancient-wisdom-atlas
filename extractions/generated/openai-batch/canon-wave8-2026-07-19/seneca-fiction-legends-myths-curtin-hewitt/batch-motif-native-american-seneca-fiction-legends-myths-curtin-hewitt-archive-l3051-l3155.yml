  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the next tale, one man in winter is pursued by another who announces himself
    as Ongwe Ias, a man-eater.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The pursued man tells his moccasins to run ahead, lies down, and becomes a
