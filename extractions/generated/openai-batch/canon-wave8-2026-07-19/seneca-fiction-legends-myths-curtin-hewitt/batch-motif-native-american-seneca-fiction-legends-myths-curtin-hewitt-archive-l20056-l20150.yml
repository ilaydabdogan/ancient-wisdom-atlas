canonical_text:
  quote: ''
  summary: 'A woman escapes from a lodge with her baby after her husband is killed,
    receives warnings from dogs, hides in a hemlock tree while three blood-associated
    hunters pass below, returns to the village, and identifies the men during a dance
    arranged by an old man; the men are killed and scalped, and the dead husband’s
    body is brought home. A new narrative begins: an orphan boy, regarded as peculiar
    and knowledgeable, says he can see Hinon walking in the clouds, asks for a red
    willow bow and arrow, shoots into the storm clouds, and later alone pulls the
    arrow from the ground, revealing a small feather-ornamented dead human being shot
    through the heart.'
  language: English
  quote_policy: summarized
