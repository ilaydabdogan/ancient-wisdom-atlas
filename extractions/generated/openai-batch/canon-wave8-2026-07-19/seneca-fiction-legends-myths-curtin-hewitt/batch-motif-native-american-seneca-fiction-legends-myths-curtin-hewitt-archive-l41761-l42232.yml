canonical_text:
  quote: ''
  summary: An elder or uncle sends his nephew/youth to listen at a place described
    as a valley-cliff or bluff. The youth sits there, hears a human woman's song from
    a distance, runs back, and reports it. The elder has his pipe lit, asks the youth
    to relate what he heard, and interprets the song as referring to or naming him.
    He sends the nephew back to listen again; on the second visit the song is nearer,
    and the woman halts and sings.
