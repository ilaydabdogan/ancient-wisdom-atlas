canonical_text:
  quote: ''
  summary: Has'honyot is approached for his powerful magic after Doonongaes has been
    killed. He agrees to restore Doonongaes to life in exchange for two beautiful
    women, who are delivered to him and restrained by his bloodsucker attendants.
    At night he treats the corpse with washing, a pounded weed, water, breath, speech,
    tobacco burned to the Complete Power, and singing; after a repeated rite Doonongaes
    revives. The next morning Doonongaes learns that the women were given as payment,
    declares it wrong, and confronts Has'honyot, who refuses to release them and draws
    a flint knife.
  language: English
  quote_policy: summarized
