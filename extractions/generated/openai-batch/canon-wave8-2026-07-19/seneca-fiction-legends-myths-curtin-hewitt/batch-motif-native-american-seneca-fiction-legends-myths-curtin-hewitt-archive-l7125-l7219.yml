canonical_text:
  quote: ''
  summary: A magically powerful youth defeats an ice-race antagonist by using an oak-tree
    ball, wind, and white flint, leaving the antagonist as a stone monument. He then
    travels to a marriage gathering where his mother is presiding while his father,
    sister, and dog are being tortured. With his grandmother’s help, he uses sympathetic
    moccasins and fire to make his mother suffer when she orders his father branded.
    After she dies, he rescues his father, sister, and dog, and destroys the lodge,
    whose magic-powered inhabitants die and whose spirits fly away as ill-omen birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A rule is stated for a race on ice: whoever reaches the end first wins, and
    the loser loses his head.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth takes a ball from an oak tree, calls for a high wind, enters the
    ball, and crosses the ice before the old man has crossed halfway.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youth throws a white flint toward the pond and commands it to melt the
    ice and boil the water; the old man sinks, cries for mercy, and is left as a great
    stone monument after the water disappears and dry land appears.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the ice-pond episode, the youth sets fire to the cabin and goes home,
    still remembering his father and sister and knowing where they are.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A runner comes to the lodge of the two sisters and announces that the chief
    has called people to the marriage of a certain woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sisters know the boy has orenda and try to keep him from the gathering,
    warning that bad people and games will be there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy says he has destroyed the dice man, the ball man, and the ice-pond
    man, and says that his mother, father, sister, and dog are at the gathering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the journey to the gathering the crowd grows; when the travelers are hungry,
    the youth kills game for the men to bring in and the women to prepare.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youth sees a woman whom the sisters had described as having power over
    all men; men crowd around her, but he looks at her and passes on.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The grandmother explains that at the Long Lodge the chief's daughter is to
    be married and that she has nearly destroyed her husband, daughter, and dog.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The grandmother says the husband is hung up for branding, his tears become
    wampum beads, the daughter hangs over the fire roasting, and the dog is kicked
    by passersby, sick, and singed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: At the gathering the boy pretends to be a little boy playing with children
    and enters the Long Lodge, where he sees his mother on a high seat, his father
    secured to a stake, his sister over the fire, and his dog barely alive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The grandmother gives the boy moccasins made from the skin of a woman's private
    parts and explains that they have sympathetic power; she tells him to put his
    foot into the fire when his mother orders his father branded.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the mother orders the father branded, the boy puts his foot into the
    fire, and the mother screams with pain; this is repeated until she dies.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: After the mother dies, the boy removes his father, sister, and dog from the
    building.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The boy commands the building to become red-hot flint; the lodge burns, the
