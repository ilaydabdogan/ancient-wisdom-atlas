canonical_text:
  quote: ''
  summary: A little boy is given a club that crushes or kills whatever he strikes.
    Despite repeated warnings from his father, he explores dangerous directions, kills
    northern frog-beings with red-hot stones, kills a Thunder family in a pine-top
    bed, brings home a Thunder child as a prospective pouch, and then encounters the
    giant Stone Coat, his dog, his lodge, and a bear-eating challenge before being
    taken toward a slippery hill ending in a cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little fellow comes out from a hollow tree or stump to catch mice, and the
    stump suddenly becomes a man who catches the boy and runs home with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father pacifies the boy by putting a small club in his hand and telling
    him to strike a tree; the boy strikes a large hickory, which falls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Everything the boy strikes with the club is crushed or killed, and he becomes
    delighted rather than distressed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father warns the boys not to go north while he is hunting because dangerous
    people live there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys go north into wooded, marshy ground; beings call out to the little
    boy as if addressing his father, and he kills them with red-hot stones. The beings
    are identified as frogs and as singing noTiqwa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the northern episode, the father angrily warns that the boys must not
    go west because it is dangerous there too.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boys go west and find a very tall pine tree with a bed of skins in its
    top.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the pine-top bed are two naked children, a boy and a girl, who call for
    their father and mother when pinched or frightened.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The boy strikes the father Thunder and mother Thunder on the head with his
    club, and both fall dead.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The boy says the Thunder boy would make a good tobacco pouch for his father
    and brings home a dead Thunder baby; the father says Thunders bring rain and do
    good, and fears revenge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The father warns the boy not to go north to the country of the Stone Coats;
    the elder brother refuses to go, so the little boy goes alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Stone Coat's dog, described as as tall as a deer, barks at a chestnut tree
    where the boy is hiding, and Stone Coat splits the tree open with his club.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Stone Coat is enormous and carries two great bears in his belt as if they
    were two squirrels to an ordinary man.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: In Stone Coat's large lodge, Stone Coat skins two bears and tells the boy
    to eat one or else be eaten with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The boy hides the bear meat by running in and out, then claims he has finished
    before Stone Coat; Stone Coat delays by offering to show him how to slide down
    a slippery hill that ends in a cave.
  category: sequence
  evidence_refs:
  - ev:7
