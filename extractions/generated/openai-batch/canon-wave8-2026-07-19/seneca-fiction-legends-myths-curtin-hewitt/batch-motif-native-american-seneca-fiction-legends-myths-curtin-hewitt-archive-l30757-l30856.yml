canonical_text:
  quote: ''
  summary: A spy encounters nonhuman enemies with stone garments and agrees to a midday
    fight in a deep valley. The Seneca party leader offers native tobacco on the fire
    and prays to the Creator for aid. At midnight a voice gives instructions involving
    the cliff edge, a running bear, and a shouted cry. The men obey; the valley walls
    collapse, burying the Genonsgwa. The Creator says the request has been granted,
    identifies himself as Our Master, and warns the Seneca to stop their aggressive
    course and settle differences peacefully.
  language: English
  quote_policy: summarized
