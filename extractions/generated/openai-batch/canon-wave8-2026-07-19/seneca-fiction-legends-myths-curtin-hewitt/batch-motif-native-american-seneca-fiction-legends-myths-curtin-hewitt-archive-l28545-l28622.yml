canonical_text:
  quote: ''
  summary: 'The passage first preserves part of a thanksgiving address for the Creator''s
    decrees concerning the sky, sun, moon, stars, protectors, and Great Feather Dance
    singers, ending with a wish for peace and health until the next ceremony. It then
    begins a flood story: a three-month rain floods the dry land; one man survives
    by climbing a tree; another tract remains with a small starving village that eats
    slippery-elm bark; a young man repeatedly hears heavy footsteps from the east
    and announces a coming visitor; a strange woman arrives despite the surrounding
    waters and enters the lodge of the young man''s brother.'
  language: English
  quote_policy: summarized
