canonical_text:
  quote: ''
  summary: A guide warns two men that a powerful person's orenda reaches the dangerous
    place where they are and leads them away. Ganiagwaihegowa destroys the tree they
    had avoided. The men then travel to the highest rocks, where the old man Has'honyot
    lives. One companion falls from the spiral ledge and is killed when the survivor
    dislodges a round stone. The survivor reaches Has'honyot's lodge, overturns it,
    falls, survives by means of a hickory tree, then tries to burn the lodge. Has'honyot
    burns tobacco and calls on Hasdeaundyet'ha for rain, which extinguishes the fire.
    The survivor carries the lodge toward Broken Land, where the chief enters and
    addresses the powerful old man inside.
  language: English
  quote_policy: summarized
