canonical_text:
  quote: ''
  summary: 'The passage concludes a narrative about Hinon Hohawaqk, the Son of Thunder:
    he returns from a western mountain, rescues an uncle from a witch and an elm tree,
    marries, has a son who is taken and later returns, and finally carries his family
    by thunder, lightning, and east wind to western mountain caves where old grandfather
    Hinon lives. The passage then begins a separate tale in which Hagowanen, a man
    with potent orenda, hunts many bears and deer, dries the meat, shrinks the meat
    and skins into small belt bundles, and returns to find his canoe missing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman hears thunder in the west; her grandson comes to the lodge and
    says he has been at a great mountain far west with his father, helping nations
    and protecting men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandson stays with his grandmother through the summer, sometimes going
    away when storms begin and returning when the weather turbulence ends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandson says an uncle living in the west was stolen by a witch, and he
    goes west to search for him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a western lodge the grandson sees a woman sitting by a fire; after she
    does not answer his question, he takes a war club from his pouch and kills her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While searching around the lodge, the grandson hears a man moaning and finds
    him held down by the roots of a large slippery-elm tree, with his head and feet
    protruding between roots.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The trapped man asks for a smoke; the nephew kicks over the tree, tells his
    uncle to rise, and the uncle rises well. The nephew then gives him a smoke, which
    pleases and strengthens him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The uncle says the woman lured him by pretending she wanted to marry him,
    then ate him and put his bones under the elm tree.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The uncle and nephew return to the long lodge, and the old grandmother is
    surprised and glad to see them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Son of Thunder goes off in a storm and returns with a wife; she later
    gives birth to a son.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The uncle whose bones had lain under the elm tree teaches the boy, who soon
    becomes able to make a noise like thunder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy follows his mother out of the lodge and is seized by an unidentified
    person; the small dog chases after him, seizes his feet, pulls off his moccasins,
    and carries them home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hinon Hohawaqk says he did not take the boy and says the boy has many relations
    around the world; the boy stays away all winter and returns after winter with
    his father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hinon Hohawaqk tells his family they must move to live with his father; the
    old woman says she is too old and the distance is too far, and he says he will
    carry her there quickly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hinon Hohawaqk thunders, lightning flies, the lodge is torn apart and burns,
    rocks and lodges in the opening break, and he and his people rise into the air.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The east wind carries Hinon Hohawaqk and his people to lofty mountains in
    the west, where old grandfather Hinon is found; the passage says they live in
    caves of the rocks to this day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: 'A new tale begins: Hagowanen lives at Hetgen Tgastende, has potent orenda,
    belongs to the Donyonda people, crosses a broad lake by canoe, travels five days
    west, and makes a camp.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Hagowanen kills large numbers of bears and deer over several hunting days,
    brings them to camp, skins them, and dries the meat by roasting.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Hagowanen ties the meat and skins with bark ropes, tells each package to be
    small, and the packages shrink so he can hang them from his belt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: When Hagowanen reaches the lake on his way home, he cannot find his canoe.
  category: action
  evidence_refs:
  - ev:10
