canonical_text:
  quote: ''
  summary: The passage closes a Buffalo-people episode in which a man kills a Buffalo
    Man, is released by his Buffalo affines, returns to his people, and later the
    apparently killed Buffaloes leave carcasses while their spirits return home. It
    then begins the story of a woman who visits a Bear lover in a hollow tree; her
    husband kills the Bear, feeds her its entrails, exposes her, and later follows
    signs after she gives birth to bear cubs and leaves body parts on an ironwood
    tree.
  language: English
  quote_policy: summarized
