- id: motif:2
  label: Animal spirits survive apparent killing and re-form
  taxonomy_refs:
  - death_rebirth
  basis: The people think they have killed the Buffaloes and eat the carcasses, but
    the spirits return to the old man and are Buffaloes again.
  evidence_refs:
