canonical_text:
  quote: ''
  summary: A man identified as Ongwe' Hanges'ha' commands his human or woman's skin
    to light his pipe; after smoking, he disgorges wampum beads, which are collected
    on buckskins and contested by the people. Later he and his wife plan to return
    to his uncle's home, bringing his mother-in-law, whom he proposes as a wife for
    the uncle. The uncle is found alive and accepts the arrangement, and the group
    enters his lodge.
  language: English
  quote_policy: summarized
