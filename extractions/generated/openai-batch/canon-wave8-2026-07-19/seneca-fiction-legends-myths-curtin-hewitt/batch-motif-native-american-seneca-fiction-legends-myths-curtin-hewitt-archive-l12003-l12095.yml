canonical_text:
  quote: ''
  summary: In a divided lodge, an uncle makes soup from bones while a nephew plans
    to leave with his wife. The nephew, possessing orenda, has prepared a distant
    lodge and sends his wife east inside an arrow connected with the Owenhgwenhonh
    bird. The arrow leaves a visible rainbow-like trail, and the wife emerges at the
    distant lodge, where an invisible brother receives her. The nephew follows through
    the air. The invisible brother warns that the uncle intends to pursue them and
    eat the wife’s flesh. The uncle attempts to follow but is led around in circles
    near his own lodge.
  language: English
  quote_policy: summarized
