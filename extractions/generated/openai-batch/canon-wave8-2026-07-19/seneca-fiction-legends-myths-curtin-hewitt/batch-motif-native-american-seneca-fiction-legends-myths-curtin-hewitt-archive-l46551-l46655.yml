canonical_text:
  quote: ''
  summary: 'The notes explain Seneca and Iroquoian terms and story references: the
    term for human being may apply to personified phenomena and deities; an opening
    may mean a clearing or settlement; one song line is glossed as a cannibalistic
    reference; sorcerers use pipe-smoking and magic herbs for protection; a lake charged
    with orenda causes delirium or unconsciousness; several mythic or animal beings
    are named, including a huge bear-like monster, a Great Lizard, snakes, and a Great
    Serpent; reptiles are linked with the power of becoming alive again; cornered
    sorcerers are said to resume their true natures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Seneca, like other Iroquoian peoples according to the note, apply a term
    meaning “man” or “human being” both to ordinary humans and to beings arising from
    personified phenomena of nature and life that have human form, faculties, and
    activities.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A qualifying adjective meaning native, original, true, or natural distinguishes
    real human beings from poetic or imaginative creations, and later distinguishes
    Indian people from trans-Atlantic newcomers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The word rendered “opening” is glossed as a clearing around a lodge or village,
    and in formal or ceremonial speech may mean village or settlement.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A song line is glossed as meaning that a game animal has come in to visit,
    and the note identifies the reference as cannibalistic.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An exclamation is described as marking recognition that a sorcerer’s act is
    involved and expressing surprise at the power shown.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Reputed sorcerers are said to smoke in order to gain immunity from an anticipated
    spell or enchantment in the presence of strangers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sorcerer’s tobacco is described as prepared with magic herbs thought to
    protect against malign influence that visitors might exercise.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A lake or its waters are described as charged with magic power or orenda in
    order to defend its owner.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The lake’s defensive power is described as rendering victims unconscious or
    delirious, making sorcerers’ allied haunts impenetrable to those with lesser orenda.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A mythic monster is described as a huge bear, vulnerable only in the soles
    of its forefeet, keen of scent, hairless except for its tail, and having a ridge
    or fold of flesh over its forequarters.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The huge bear-like monster is said never to let anything escape that crosses
