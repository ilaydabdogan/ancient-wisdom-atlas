canonical_text:
  quote: ''
  summary: In this excerpt, a youth is abused around the cooking fire by an old uncle,
    seeks guidance from another uncle whose skull protrudes from the ground, learns
    that he must remember the names of game animals he kills, successfully brings
    home and names a turkey, cooks it, and then reverses the old uncle's previous
    fire-related abuse. The next morning the old uncle is silent, and the youth goes
    again toward the skull uncle's place.
  language: English
