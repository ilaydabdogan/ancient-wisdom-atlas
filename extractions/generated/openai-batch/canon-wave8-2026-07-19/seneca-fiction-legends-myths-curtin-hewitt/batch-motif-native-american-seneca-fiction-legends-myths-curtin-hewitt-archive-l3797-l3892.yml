canonical_text:
  quote: ''
  summary: 'The range first recounts a conflict between a human village and a mass
    of snakes: a man overhears the snakes planning battle because Djisdaah challenged
    them; the village prepares fire and stakes, fights, loses Djisdaah, and then accepts
    terms from a giant snake chief. The range then begins a tale of two brothers in
    a hunting lodge: the elder brother separates their living space, declares he will
    hunt and eat humans, kills women who come to the younger brother''s side, and
    is resisted by a warned woman who marks the younger brother with a squash shell
    before an expected life-and-death struggle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man sees many kinds of snakes moving in one direction and hears them say
    they will have a battle because Djisdaah has challenged them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man reports to the village; scouts see snakes spread several feet deep
    and moving toward a rendezvous.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The human chief says the fight cannot be avoided and has the village prepared
    with two rows of close-set stakes, long piles of wood, and fires set on the fourth
    day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The snakes advance through the fire; many burn, but living snakes climb over
    dead snakes and continue the attack.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The snakes first kill Djisdaah, then press toward the village until the human
    chief announces surrender.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A giant snake comes up from the ground, identifies himself as chief of the
    snakes, and says the snakes will go home if the humans never again call a man
    Djisdaah and do not maltreat his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two brothers hunt in the woods, find game, build a lodge, and initially share
    everything in common.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The elder brother proposes a partitioned lodge with separate doors, says each
    will live for himself, declares that the younger may hunt animals while he will
    hunt and eat humans, and forbids either brother to marry or bring a woman to the
    lodge.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The elder brother tracks a woman to the younger brother's room, catches her
    at the door, drags her into his own room, kills her, and eats her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On another day the elder brother asks a woman in the younger brother's room
    for arrows by claiming there is an elk outside; when she opens the door, he kills,
    cooks, and eats her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The younger brother warns the next woman not to open the door; when the elder
    repeats the arrow request with a bear as the pretext, she remains by the fire
    and does not open.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The younger brother tells the woman that he and his elder brother will have
