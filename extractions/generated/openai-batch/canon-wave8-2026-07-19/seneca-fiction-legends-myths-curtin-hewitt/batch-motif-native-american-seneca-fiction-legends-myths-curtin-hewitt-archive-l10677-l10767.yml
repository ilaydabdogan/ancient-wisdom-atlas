canonical_text:
  quote: ''
  summary: A Gadjiqsa helper instructs two young men how to kill the magically powerful
    great bear Ganiagwaihegowa by using basswood manikins, felled trees, and shots
    to white spots in the soles of its feet. The men follow the instructions, kill
    the bear, dismember and burn parts of it, and smoke the hide to prevent its return
    to life. A Gadjiqsa person explains that the bear would have destroyed the people
    and warns of another enemy. At a river camp, one man discovers a gathering of
    Stone Coats planning to go to his village for a feast on the inhabitants. The
    men flee, warn the village, and continue watching the Stone Coats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Gadjiqsa helper advises making basswood manikins with bows and arrows, placing
    felled trees in front of them, and shooting Ganiagwaihegowa in white spots on
    the soles of its feet, where its heart is said to be.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two men make two basswood manikins with the help of a friend and wait
    near their brush lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ganiagwaihegowa roars from a ravine, frightens the men, and tears trees apart
    or knocks them down as it approaches.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The men remain hidden and leeward of Ganiagwaihegowa while it moves toward
    the manikins.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: As Ganiagwaihegowa raises its feet to cross the logs, the two men shoot the
    white spots in its soles; it bites the manikins, tears through the lodge, and
    falls dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the bear falls, the men cut off its hind legs and feet, see its body
    quivering, and observe that its ribs form one solid bone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men burn the bear's hind quarters and bones to ashes and smoke the hide
    thoroughly because they had been told that any remaining bone or unsmoked hide
    could make Ganiagwaihegowa live again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Gadjiqsa person says the bear would have destroyed the men, the Gadjiqsa,
    the village, and all people in the world, and says Hawenniyo gave the Gadjiqsa
    power to aid men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same helper warns that another enemy remains and tells the men they will
    come to a river where they should camp and stay on guard.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the river camp, one man hears loud speaking, goes toward the sound, and
    sees many people in a valley with a speaker standing on an elevated place.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker says that the next day they will follow the trail to the place
    from which the two men came and will have a great feast at the journey's end.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The listening man understands the gathered people to be Stone Coats intending
    to go to his village and eat the inhabitants; he puts out the fire and warns his
