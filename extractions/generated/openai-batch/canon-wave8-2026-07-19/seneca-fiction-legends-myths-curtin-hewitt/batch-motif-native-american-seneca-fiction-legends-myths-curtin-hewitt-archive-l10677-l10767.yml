  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The two men flee ahead of the Stone Coats, whose approach sounds like thunder
    and whose chief says they must reach the village the next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: One man runs to the village to warn the people, then returns to his comrade,
    while the other stays near the Stone Coats and listens to their halting-place
    orders.
  category: sequence
  evidence_refs:
  - ev:8
