canonical_text:
  quote: ''
  summary: A youth brings home a partridge but cannot name it when his uncle asks.
    The uncle prepares it and pulls the youth over the fire while offering him food.
    The next day the youth hunts again and meets a speaking skull, who warns him that
    the uncle will overcome his orenda unless he remembers the names of the animals
    he kills. The skull identifies itself as the uncle's brother, directs the youth
    to kill a raccoon, and tells him to repeat the animal's name. The youth forgets
    the name after stumbling at the lodge entrance, and the uncle repeats the naming
    question, prepares the raccoon, and begins the same food-over-fire action as the
    passage breaks off.
  language: English
  quote_policy: summarized
