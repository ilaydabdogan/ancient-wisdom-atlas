canonical_text:
  quote: ''
  summary: A youth meets a stranger in a canoe who claims shared kinship through Okteondon
    and proves their likeness by comparing their bodies, bows, arrows, and speed.
    After a race in which both catch their arrows before they fall, the stranger summons
    wild geese and later abandons the youth on an island, offering him as flesh to
    beings in the lake. The youth finds human bones and a half-decayed man, who addresses
    him as nephew, tells him he has great orenda, and gives instructions for hiding
    from S'hagowenot'ha's midnight visit.
  language: English
  quote_policy: summarized
