canonical_text:
  quote: ''
  summary: A White Pigeon visits old man Wild Cat, later returns and explains that
    the bird tribes and the Maker have assigned wild pigeons to provide a food tribute
    to humans. The White Pigeon gives rules for seasonal communal pigeon hunts, including
    selection of a hunt master, use of a painted rod to regulate the march, and offerings
    of ornaments, trinkets, burned tobacco, and invocation near the roost. When people
    first disregard the rules, accidents, sickness, and death occur. Later obedience
    brings many seasons without major trouble, but dissenting factions eventually
    reject the rites or kill pigeons improperly, after which disease and death increase
    among them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A White Pigeon visits Wild Cat's lodge, stands where he chooses, and flies
    away without speaking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wild Cat tells his neighbors that the unusual visit portends something out
    of the ordinary, though nothing unusual happens for a year.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the same season the next year, the same White Pigeon returns, and Wild
    Cat believes the visitor is a man or one of his own kind of beings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: White Pigeon tells Wild Cat that the tribes of birds held a council and decided
    that wild pigeons should furnish a tribute to mankind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated reason for choosing pigeons is that the Maker selected them and
    that pigeons nest and rear young in a single community, unlike other birds described
    as dispersed or having little to offer.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: White Pigeon says young pigeons are to be taken for food at the proper season
    and in the proper manner.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The people are instructed to select a suitable superintendent or master of
    the hunt during the season of the roost, when young pigeons are of suitable size
    for eating.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The communal hunting party moves on a common path, and the leader places a
    suitably painted rod across the path whenever the party halts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: No one is permitted to pass over or go around the painted rod until the leader
    removes it, and breaking this injunction is said to bring misfortune to the party.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near the pigeons' roost, the people collect ornaments and trinkets as gifts,
    place them in a bark bowl, carry them into a swampy forest place, spread them
    on elm bark, burn native tobacco, and make an invocation to the pigeons and their
    Maker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the first hunting expedition, some people go around the painted rod, others
    withhold presents from the offering, and many accidents, illnesses, and deaths
    occur.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the first expedition, Wild Cat questions the people, says they brought
    the ills upon themselves, and urges strict observance of White Pigeon's rules.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the following season the people carefully observe the rules, and for twenty
    springs the expeditions continue without marked untoward events.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Later, factions arise: some young people question the need for the rites
    and offerings, some people kill pigeons whenever and wherever they find them,
    and another group refuses to join pigeon hunting or eat pigeon meat.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The group refusing pigeon meat dies off one by one; the passage states that
    before White Pigeon's visit they had seemed immortal, but now disease and death
    abound because the regulations were not obeyed.
  category: sequence
  evidence_refs:
  - ev:9
