canonical_text:
  quote: ''
  summary: In a morning dream-word seeking contest, a youth refuses to give his uncle
    any clue to his dream desire. The uncle asks whether the desired thing is various
    possessions, foods, furs, or a hunting fetish, and the youth rejects each guess
    as midday approaches. The youth sings a barter/exchange song; flames rise around
    and pursue the uncle until he identifies the desired item as planted native squashes.
    The youth accepts this fulfillment, and the two discuss the custom that the divined
    dream object must be given up, while the uncle attempts to propose an identical
    substitute.
  language: English
  quote_policy: summarized
