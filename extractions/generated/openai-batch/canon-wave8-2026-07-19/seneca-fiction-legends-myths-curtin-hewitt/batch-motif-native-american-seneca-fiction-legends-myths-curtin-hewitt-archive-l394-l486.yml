  summary: 'The introduction characterizes the collection as largely fictional narratives
    containing myth-like elements. It identifies recurring narrative devices: a hero
    revives failed predecessors from bones by invoking a falling hickory or pine tree;
    a pupil of a sorcerer or witch violates a forbidden direction, contests other
    magic powers, defeats family enemies, and revives kindred.'
  language: English
