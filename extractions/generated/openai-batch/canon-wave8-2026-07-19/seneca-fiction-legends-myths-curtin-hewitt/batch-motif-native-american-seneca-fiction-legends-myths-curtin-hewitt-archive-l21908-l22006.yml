canonical_text:
  quote: ''
  summary: In a Seneca legend, two brothers leave their village lodge in autumn to
    hunt deer in a distant forest. The younger brother demonstrates exceptional speed
    by killing deer after running them down, but he boasts despite his elder brother's
    warning. After a second hunt, he encounters a man, or what he takes to be a man,
    standing in a roadlike opening in the forest. The stranger challenges him to a
    life-wagered race with two-day pursuit conditions, and the youth accepts.
  language: English
  quote_policy: summarized
