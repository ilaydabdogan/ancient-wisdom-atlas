canonical_text:
  quote: "“the pieces flew together, becoming the chief again”"
  summary: The passage closes one tale in which enemies celebrate over a dismembered
    chief, but his body briefly reassembles and kills five before being beheaded;
    surviving followers decide to remain home and live in peace. A new tale begins
    with an aged grandmother and her grandson living alone in a forest lodge. She
    gives him his dead uncle’s bow and arrows, repeatedly forbids him to go north
    because of dangers and sorcery, and he hunts birds and larger game until he decides
    to disobey and turns northward.
  language: English
  quote_policy: quoted
