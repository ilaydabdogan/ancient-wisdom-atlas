  quote: ''
  summary: The passage first recounts two episodes in which scattered bones are gathered
    and a dead man is restored to life beneath a tree by a spoken command. It then
    begins the tale of an Iroquois village whose crops fail; an old Matron hears the
    Corn, Bean, and Squash people weeping and complaining that the humans have neglected
    their proper care.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bitter conflict occurs between village people and the Panther tribe, and
    many brave people on both sides are killed; during the struggle, the bones of
    the grandson lie bleaching on a forest path.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the dead man's sons recognizes his father's bones, gathers them under
    a large hickory tree, sets them in order, and brings his father back to life by
    pushing against the tree and calling for him to arise lest the tree topple on
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the father arises, he has the form he had when he left home; the son
    is frightened and flees, while the revived man returns to his own people and tells
    his adventures.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old Eagle travels to the Wolf people’s country to look for old man Wild Cat,
    finds his scattered bones, and decides to restore him to life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Old Eagle gathers Wild Cat’s bones, places them in order under a great elm
    tree, calls for him to arise lest the tree fall on him, and Wild Cat leaps up
    in his original form and mind as a man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Old Eagle leads Wild Cat back to his own people; Wild Cat finds his grandson,
    tells his adventures, and says the Pigeon tribe should be highly esteemed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In a fertile Iroquois village, people had long raised corn, beans, and squashes,
    but the crops begin to fail and the people go hungry because field food and game
    are scarce.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: A very old woman who is Matron and Chief of her clan walks near her planted
