    the field.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The old woman finds that the Corn, Bean, and Squash people are weeping, has
    compassion for them, and asks Corn why it weeps.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: 'Corn says the people place the crops in the ground but fail in further duties:
