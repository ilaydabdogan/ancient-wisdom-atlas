canonical_text:
  quote: ''
  summary: A young woman chooses to marry a handsome man, travels to his lodge, and
    discovers that he appears as a serpent among other serpents. An old man calling
    her grandchild tells her the man is an evil sorcerer, one of seven brothers whose
    hearts are hidden outside their bodies. She steals the tied bunch of hearts and
    flees. Her grandfather and allied men use storm powers to kill the serpent and
    his progeny, cut up the serpent, and carry its flesh home.
  language: English
  quote_policy: summarized
