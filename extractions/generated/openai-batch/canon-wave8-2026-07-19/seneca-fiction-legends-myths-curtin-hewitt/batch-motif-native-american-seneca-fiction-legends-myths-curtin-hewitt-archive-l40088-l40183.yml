canonical_text:
  quote: ''
  summary: The passage describes an uncle and nephew in a lodge. The uncle asks the
    nephew to report what he has heard only after the uncle lights tobacco in his
    pipe. When the nephew reports an owl’s hooting, the uncle pours hot coals and
    ashes on his head and says that is not what he meant. The next day the uncle sends
    the nephew back to a valley to listen again. The nephew hears mysterious whispered
    cries attributed to Tcoktcoii'khwen, returns, waits while the uncle lights his
    pipe, and reports the sounds. The uncle again pours burning coals and ashes on
    the nephew, and the nephew laments that the uncle has overmatched his orenda.
  language: English
  quote_policy: summarized
