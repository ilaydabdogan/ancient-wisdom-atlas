canonical_text:
  quote: ''
  summary: A chief's younger daughter finds an old-appearing sleeping man whose spittle
    becomes wampum and brings him to the lodge. The elder sister's household mocks
    or rejects him. After he exchanges garments and a name with the elder sister's
    husband, he appears as a fine-looking man, smokes publicly, animates a pouch or
    duck and a manikin, and again produces wampum by spitting. He then hunts with
    the younger daughter, ordering her not to look while he summons wild animals by
    song and kills them by pointing. The community receives the meat, and the elder
    sister accuses her own husband of stealing the young man's garments and drives
    him out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief's younger daughter goes out to gather wood, sees smoke, and finds
    an apparently old sleeping man whose spittle becomes wampum when it falls to the
    ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger daughter reports the sight to her father, who sends her back to
    bring the man to the lodge; she gathers the wampum and tells the man to accompany
    her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the lodge, the elder sister and her husband sit on one side of the fire
    while the younger daughter and the old-appearing man sit on the opposite side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder sister's husband says the younger sister should be ashamed of having
    the old man, and the elder sister later withholds prepared meal because she dislikes
    the looks of the younger sister's man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger daughter's husband proposes changing garments and names with the
    other man; after the change, he becomes a fine-looking man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The younger daughter's husband asks that the people be assembled because he
    is going to smoke.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the assembly, his pouch comes to life or is addressed as a duck, a manikin
    brings an ember, and the man smokes a pipe filled with dried red-willow bark.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While smoking, the man spits on both sides, and the spittle turns into dark
    wampum that the people gather from the floor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before hunting, the man tells his wife to lie down, cover her head, and not
    look at what is happening, warning that something evil would befall him if she
    looked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man sings for wild beasts to come; bear, elk, and deer arrive, and selected
    animals fall dead when he points his magical finger at them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man sings for the remaining wild beasts to return to their homes, after
    which they vanish quickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the hunt, he tells his wife the people may take as much meat as they
    desire, and villagers carry home meat and venison.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The younger daughter tells her elder sister that the elder sister's husband
    had stolen the garments, that the garments have been recovered, and that they
