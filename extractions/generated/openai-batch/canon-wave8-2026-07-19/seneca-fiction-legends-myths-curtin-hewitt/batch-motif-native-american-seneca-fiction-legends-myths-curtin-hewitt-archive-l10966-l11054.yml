  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The elder sister says she will turn away her husband and marry the younger
    sister's husband; she then accuses her husband of stealing the young man's garments
    and drives him out with a corn-pounding pestle.
  category: action
