canonical_text:
  quote: ''
  summary: Honenhineh descends into a valley after hearing tapping and a voice. A
    speaking yellowhammer mocks his shooting, and his arrows miss. He breaks his bow
    and proceeds to a smoky lodge, where an old man welcomes him, seats him beside
    a young maiden as her husband, and has the maiden feed him. At night the old man
    chants a story, finds the guest asleep, kills him with a war club, quarters the
    body, and cooks it while speaking of eating rare game animals.
  language: English
  quote_policy: summarized
