canonical_text:
  quote: ''
  summary: An exhausted hungry man is aided by a man who twice directs him to a fire
    and kettle of food, warning him not to share even a bit with the surrounding beggars.
    After he obeys, the helper promises safety and is revealed as S^hagodiyoweqgowa.
    The man regains strength by killing deer, later marries a young woman brought
    by her mother, and comes to a village connected with a Little Buffalo chief. A
    jealous Buffalo Man challenges him to a life-staked race after he speaks to the
    chief's wives at the stream.
  language: English
  quote_policy: summarized
