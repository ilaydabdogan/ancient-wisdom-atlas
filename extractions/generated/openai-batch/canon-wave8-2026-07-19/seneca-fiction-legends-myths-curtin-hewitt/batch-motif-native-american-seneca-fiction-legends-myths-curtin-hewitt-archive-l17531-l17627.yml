canonical_text:
  quote: ''
  summary: A youth with orenda is thrown into a deep walled ravine, survives attacks
    by a flesh-biting bird, receives dream instructions from an old woman to raise
    a hemlock tree from a leaf, revives bones into men, leads survivors upward with
    a warning not to look back, then goes to confront the woman and witch mother who
    deceived him and completes a task involving two white otters identified as the
    witch's wizard brothers.
  language: English
  quote_policy: summarized
