canonical_text:
  quote: ''
  summary: Ganyadjigowa enters a life-wager canoe race with an old man using white
    flint canoes, follows him to the place where the sun goes down after the old man
    takes the more powerful canoe, returns to the Great Lake, and cuts off the old
    man's head. He then travels northwest, encounters beings at rocks, a hemlock forest,
    and a brook, and gives them the names Gaga, Hihi, and Genonsgwa, the Stone Giant.
    The final encounter includes dialogue about Hanisheonon and the earth resting
    on the Turtle's back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man describes an amusing game in which visitors wager their necks and
    race in white flint canoes on the waters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ganyadjigowa accepts the game and says it is what he used to play.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ganyadjigowa chooses a poor old canoe, which the narrator says actually has
    the greatest power and is the canoe the old man wanted to use himself.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first lake race, Ganyadjigowa's canoe goes faster and the old man is
    left behind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While Ganyadjigowa pretends to sleep, the old man enters Ganyadjigowa's boat,
    commands it to go where the sun goes down, and the boat rushes off through the
    air.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ganyadjigowa strikes the bow of the old man's boat with a white flint stone;
    the canoe becomes alive and flies faster than the old man's boat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the place where the sun goes down, Ganyadjigowa accuses the old man of
    cheating, and the old man denies it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the return race, the old man names the lake Ganyodaigowane, translated
    as Great Lake, and Ganyadjigowa cuts off the old man's head with a basswood knife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ganyadjigowa travels northwestward in his boat to rocks and a lodge, where
    a man says he steals game from people; Ganyadjigowa names him Gaga.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a hemlock forest, Ganyadjigowa sees someone in a tree and gives him the
    name Hihi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At a brook with rocky banks, an ugly-looking old man says he is hungry and
    will eat Ganyadjigowa; Ganyadjigowa questions him about falling rocks, Hanisheonon,
    and whether the earth rests on the Turtle's back.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ganyadjigowa says Hanisheonon was killed; the old man and his people cry,
    and Ganyadjigowa gives the old man the name Genonsgwa, translated as Stone Giant.
  category: sequence
  evidence_refs:
  - ev:9
