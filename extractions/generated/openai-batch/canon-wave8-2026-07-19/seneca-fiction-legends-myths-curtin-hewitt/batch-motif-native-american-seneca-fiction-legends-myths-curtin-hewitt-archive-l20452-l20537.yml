canonical_text:
  quote: ''
  summary: Two sisters first take the wrong route, see False Faces dancing, and escape
    a pursuer by dropping bread and clothing. On a second attempt they reach the correct
    lodge and marry two brothers by offering bread. After being warned to remain indoors
    for ten days, the sisters go outside on the ninth day and are lured away by S'hagodiyoweqgowa;
    they are returned, then later captured again. Hot'hoh, Cold Weather, fights S'hagodiyoweqgowa
    and forces him to stop troubling the wives. A new tale begins in which a woman
    burns her hand, tastes her own blood and flesh, develops a cannibal appetite for
    herself, and sends the faithful dog to warn her husband to flee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two girls come to a fork, continue on the straight path, look through
    cracks in a lodge, see False Faces dancing, become frightened, and run away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: S'hagodiyoweqgowa pursues the girls; they slow him by throwing down baskets
    of bread and then pieces of clothing, which he stops to eat or examine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girls reach their mother's lodge naked; the mother says they did not do
    as instructed and sends them to try again after making bread.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the second attempt the sisters reach the right lodge, place baskets of
    bread before two men, state that they have come to marry them, and the men eat
    the bread and thank them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers live in a partitioned lodge and repeatedly call and answer each
