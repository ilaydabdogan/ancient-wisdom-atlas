    do not.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After nine days indoors, the sisters sit outside; S'hagodiyoweqgowa comes
    unrecognized, invites them to eat with him, and captures them, after which the
    elder husband asks for their return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hot'hoh, identified as Cold Weather and as a brother of the men, goes naked,
    carries a tomahawk in a slit in his hip, and is said to make trees crack in winter
    by striking them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When S'hagodiyoweqgowa again lures the sisters away and shuts them in his
    woods lodge, the younger sister escapes and runs to Hot'hoh.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hot'hoh and S'hagodiyoweqgowa fight with mallet and rattle, uproot trees for
    miles toward the east, and S'hagodiyoweqgowa is conquered and promises not to
    trouble the wives again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the next tale, a husband hunts while his wife tends corn and beans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A spark from the hearth burns the wife's hand; after tasting her blood, she
