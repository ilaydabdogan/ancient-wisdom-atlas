  summary: The passage presents an editorial account of Iroquois deity concepts. It
    argues that humans anthropomorphized gods and spirits, sometimes confused primal
    gods with ancestors, and, in Iroquoian mythology, imagined early cosmic periods
    populated by anthropic man-beings on the upper surface of the sky before a cataclysmic
    transformation into the present order. It also states that divine societies reflect
    human social institutions.
