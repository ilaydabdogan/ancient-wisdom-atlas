canonical_text:
  quote: ''
  summary: Hodadenon leaves his brother and companions resting, visits Deagahgweoses,
    an old tobacco maker, asks for tobacco, is refused, is attacked, and kills him
    with arrows. Hodadenon sends the tobacco westward to his sister Yenyent^hwus,
    burns Deagahgweoses's lodge, returns to the people he had brought to life, and
    leads them home. He creates lodges and provisions by marking spaces and wishing
    them into being. He keeps secret his intention to seek his father, mother, and
    sister, who were killed at chestnut trees. After about a year he hears the tobacco-pounding
    sound again and decides to check whether Yeqsinye Honwande is keeping an agreement
    about using human flesh for food.
  language: English
  quote_policy: summarized
