- id: obs:1
  text: Hodadenon and the others wait at a comfortable spot; he hunts, provides abundant
    meat, and tells his brother to rest while he goes away for a short time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hodadenon hears the sound “Dum, dum, dum,” which he identifies as Deagahgweoses
    pounding tobacco with a mallet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Deagahgweoses sits in his lodge hammering tobacco, singing, and tying tobacco
    rolls with bark cords.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Deagahgweoses initially gives Hodadenon no recognition; after repeated blows
    he raises long upper lids, ties them back with bark cords, and cleans his eyes
    with a clamshell.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hodadenon asks Deagahgweoses for tobacco; Deagahgweoses refuses, threatens
    to kill him, and pursues him with a large club.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hodadenon outruns Deagahgweoses and kills him by shooting two arrows into
    his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hodadenon casts a large quantity of tobacco into the air toward the west and
    tells it to go to the lodge of his sister Yenyent^hwus; she receives the rolls
    at her doorstep and thanks him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After sending the tobacco home, Hodadenon burns up the lodge of Deagahgweoses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hodadenon returns to his newly recovered brother and the other men he had
    brought to life; some return to remembered homes, while others ask him to take
    them with him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hodadenon tells his sister that he brought to life their captive relatives
    and saved their brother from the tortures of wizards, and he says they must prepare
    to welcome the returning people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hodadenon marks lodge spaces with his feet, wishes for lodges with provisions
    and needed things, and the lodges come into being as desired.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hodadenon gives each person a home, gives his relations couches in his own
    lodge, and observes that not all who belong there have come home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The absent ones are identified as Hodadenon's father, mother, and sister,
    who had been killed at the chestnut trees; Hodadenon intends to go after them
    but avoids saying this aloud so the killers will not learn his plan.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: About a year later Hodadenon again hears the sound “Dum, dum, dum,” remembers
    Yeqsinye Honwande's agreement concerning human flesh as food, and decides to see
    whether he is keeping his word.
  category: sequence
  evidence_refs:
  - ev:9
