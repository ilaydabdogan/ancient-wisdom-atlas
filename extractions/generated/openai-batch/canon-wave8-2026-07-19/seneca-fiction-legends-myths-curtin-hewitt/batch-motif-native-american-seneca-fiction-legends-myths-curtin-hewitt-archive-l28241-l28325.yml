- id: obs:1
  text: Dehaenhjoweos or Dehaenhyowens and companion(s) continue a quest for someone
    who knew them and reach a very old man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They ask the old man whether he remembers warriors who departed long ago on
    an expedition along the path of the Sun, and the old man says he remembers the
    matter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man's account says young men about sixteen years old formed a war
    party and bound themselves by an oath or vow; this account gives their number
    as thirty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The departing group caused the community to assemble at the Long Lodge of
    public gatherings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the departure speech, Dehaenhyowens says the group enlisted by notching
    the stick, commingled their minds, and became as one head, one body, and one life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the same speech, the group renounces kindred and lives and sets its course
    westward toward the sunset, where the Diurnal Light Orb goes to and fro.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speech says the band appointed Dehaenhyowens and his brother as chiefs
    and that they vowed to pass onward regardless of the situation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old man doubts the returning men's claim because they look as if they
    have only just reached manhood, although the event occurred very long ago.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dehaenhyowens names Dagaidoii'dye as the chief at the time of departure; the
    old man says Dagaidoii'dye was his grandfather and is then convinced.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The present chief is informed and sends runners to summon the people to the
    Long Lodge for a public assembly on the following day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the assembly, the chief ceremonially greets the newly arrived men and asks
    to hear the whole account from the leader of the party.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Dehaenhyowens says that eighty started on the expedition along the path of
    the Sun, but only three returned: himself, his brother, and their friend.'
  category: speech
  evidence_refs:
  - ev:6
