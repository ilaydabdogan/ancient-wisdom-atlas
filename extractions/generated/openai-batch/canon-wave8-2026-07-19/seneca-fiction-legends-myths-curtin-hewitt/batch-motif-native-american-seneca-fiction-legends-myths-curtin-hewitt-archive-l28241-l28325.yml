canonical_text:
  quote: ''
  summary: Returned travelers seek an elder who remembers a long-ago expedition along
    the path of the Sun. The elder recounts how young men bound themselves by oath,
    notched a stick, announced their departure west toward the sunset, and appointed
    Dehaenhyowens and his brother as chiefs. After testing their identity by the name
    of a former chief, the elder accepts them as returning survivors. The present
    chief summons a public council, where Dehaenhyowens names the three survivors
    and says one expedition member remained in skyland and cannot return to earth.
  language: English
  quote_policy: summarized
