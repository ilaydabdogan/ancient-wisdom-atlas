canonical_text:
  quote: ''
  summary: A youth fleeing a life-or-death foot race with a nonhuman pursuer returns
    toward his kin, finds them fled, and encounters an ill menstruating woman left
    in his path. He positions her body toward the approaching animal and hides behind
    a tree. The large tailless, nearly hairless creature stops at the woman, reacts
    violently to the menstrual blood, vomits blood, and dies. The people return; the
    ancients identify the animal as Ya'gwai'he and burn its carcass in a great fire.
  language: English
  quote_policy: summarized
