canonical_text:
  quote: ''
  summary: A strange bride explains that her mother in the south sent her to marry
    a young man and provide for a destitute village by restoring corn. After the bridegroom's
    younger brother abuses her and throws her corn bread into the fire, she resolves
    to return to her mother, taking back all she brought. The village's corn disappears.
    The bridegroom, seeking relief for his people, follows his wife's trail across
    surrounding waters despite warned difficulties, while the mother-in-law knows
    of his approach; after many days he reaches a cornfield.
  language: English
  quote_policy: summarized
