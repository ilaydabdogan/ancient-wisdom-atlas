canonical_text:
  quote: '"he and I are bartering by exchange"'
  summary: A youth refuses an artificial substitute for what his dream-word commands,
    sings a barter song that makes flames rise around his uncle, and compels the uncle
    to surrender a squash from a hidden patch under his bed. The youth brings it to
    another uncle, whose skull protrudes from the ground; the skull uncle confirms
    the object and tells him that his sister is also hidden in a bark case under the
    first uncle’s bed. The youth returns, prepares a great fire, and continues the
    dream-word contest while the old man delays by naming possessions and the youth
    repeatedly raises and dismisses flames around him.
  language: English
  quote_policy: quoted
