canonical_text:
  quote: ''
  summary: A grandfather sends a young man south to find a wife. The youth finds an
    empty village and a Long Lodge containing a decorated dead young woman, takes
    her ornaments, and is repeatedly brought back until he returns them. He spends
    the night in the Long Lodge, feeds an unseen being, wrestles it until dawn, and
    finds it reduced to a blood-clot. He dissolves the blood in heated water and gives
    it to the dead woman, who revives and explains that rejected northern suitors
    enchanted her. The youth accompanies her south to her father's village, where
    Crow reports her return to life to her parents.
  language: English
  quote_policy: summarized
