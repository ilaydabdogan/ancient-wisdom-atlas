canonical_text:
  quote: ''
  summary: A returning chief convenes a Long lodge council and reports an expedition
    against distant stone-garmented Genonsgwa. After encountering a challenger, the
    chief offers native tobacco on the fire and receives midnight aid attributed to
    the Master of Life. Following instructions involving a valley, a bear sign, and
    withdrawal, the warriors see the cliffs and forests collapse on the advancing
    Genonsgwa. The chief tells the assembly that the Master of Life commanded them
    to cease such war enterprises, make peace with all tribes, and bury war weapons
    deep in the earth.
  language: English
  quote_policy: summarized
