canonical_text:
  quote: ''
  summary: An old Dagwanoenyentgowa woman discovers that Yenonsgwa enemies intend
    to attack. She and her grandson go to the dead Yenonsgwa body containing the granddaughter,
    burn tobacco by a fire, summon Dagwanoenyentgowa relatives, and recover the girl
    from the body. Later a Yenonsgwa scouts the old woman's lodge. The old woman calls
    more Dagwanoenyentgowa kin, who arm themselves with round stones and fight a vast
    number of Yenonsgwa. She directs a retreat to a high mountain, where the Dagwanoenyentgowa
    attack from several sides and drive the Yenonsgwa into a ravine and river, uprooting
    trees and sweeping earth and stones down upon them.
  language: English
  quote_policy: summarized
