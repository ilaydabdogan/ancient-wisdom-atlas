- id: obs:10
  text: Dagwanoenyentgowa S^hagodigendji says that each fighter should have a round
    stone heavy enough to handle well.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Thousands of Yenonsgwa appear; the Dagwanoenyentgowa separate, are chased,
