canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a young man is aided by a night
    visitor later identified as an otter. The visitor foretells the wife's return,
    instructs the young man to choose a bearskin-wrapped claw or finger from the father-in-law's
    fetishes, and receives it back, granting friendship and future success. The passage
    then begins a tale of seven sorceress sisters living on a high mountain, gathering
    huckleberries, excluding men and married women, and being observed by a young
    man who falls in love with the youngest sister.
  language: English
  quote_policy: summarized
