canonical_text:
  quote: ''
  summary: 'The passage first concludes a cloudland expedition: two boys recover their
    uncle’s stolen eyes, descend to earth after changing into fleas and using dandelion
    seed heads, and return the eyes. It explains that the boys killed a child who
    was actually the life of a great witch, thereby destroying her. The passage then
    begins the Legend of the Misogamist: a successful hunter living with his mother
    repeatedly rejects marriage proposals brought with marriage bread despite his
    mother’s warnings, while his hunting success brings prestige and trade.'
  language: English
  quote_policy: summarized
