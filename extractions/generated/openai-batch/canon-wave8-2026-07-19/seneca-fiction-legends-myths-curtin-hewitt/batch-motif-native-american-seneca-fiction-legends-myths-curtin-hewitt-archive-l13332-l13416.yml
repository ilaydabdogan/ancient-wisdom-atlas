canonical_text:
  quote: ''
  summary: Doonongaes visits a feather-headdress village, joins a war party, flees
    while serving as night guard, and returns after the warriors are killed and scalped.
    He attempts to marry the slain men’s wives, but avoids the resistant Diagoisiowanens.
    Traveling onward, he hides in a hollow tree, changes into a snake before Hononeowanen,
    lies about his magic power, and escapes confrontation. He later finds an empty
    smoking village and meets Hostoyowanen, who says Niagwaihe has eaten that village
    and may destroy his own.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After ten days, Doonongaes arrived at a large village where the people wore
    feather headdresses, and the chief Gasaisdowanen questioned him about his visit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man in the village agreed to take Doonongaes to his lodge, and Doonongaes
    lived with him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: News and a challenge came that people from the far west were going to make
    war on Gasaisdowanen, and 500 volunteers, including Doonongaes, set out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women accompanied the warriors until the first night, then returned home the
    next morning while the warriors continued.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the warriors stopped for the night, Doonongaes volunteered to be the
    one man on guard and kept the fires burning.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: About midnight, Doonongaes heard a war whoop, said he did not want to die,
    and ran away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The western people, identified as Dagwanoenyents, killed and scalped the sleeping
    warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Doonongaes found his friends dead and scalped and decided to go to their wives
    and take them all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Doonongaes told the women their husbands had been killed and that he would
    marry all of them; after discussion, all except one were willing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Doonongaes threatened the unwilling woman with beheading if she would not
    marry him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The unwilling woman, Diagoisiowanens, was described as a great woman and told
    Doonongaes he would have to overpower her first.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Doonongaes claimed to be magically the most powerful man in the world, referring
    to his orenda, but left and did not return after Diagoisiowanens challenged him
    to try her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Traveling south, Doonongaes spent a night in a hollow tree and later heard
    someone announce the possibility of Hononeowanen coming.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A great noise of falling trees was heard and the earth was torn up on every
    side as Hononeowanen approached.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: When Hononeowanen told him to come out, Doonongaes turned himself into a snake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Hononeowanen saw Doonongaes in snake form and said he was one of his people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: Doonongaes claimed to be chief of his people and the most powerful person
    on earth, and he lied that he had overpowered a powerful western person.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:18
  text: Hononeowanen said the western person had more orenda than he did and withdrew
    rather than meddle with Doonongaes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Doonongaes considered returning to his wives but decided against it because
    Diagoisiowanens might kill him, then continued southward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: After walking two nights and days, Doonongaes saw smoke on the eastern side
    of a plain and turned himself into a man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: In the village with smoke, Doonongaes found no people, though each lodge had
