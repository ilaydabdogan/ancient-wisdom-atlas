canonical_text:
  quote: ''
  summary: Dehaenhyowens and his party travel with hosts who explain that Hawenniyo
    charged them to water and preserve the living things on earth. They see a lower
    earth, thunder, lightning, rain, and a huge horned serpent. The hosts explain
    that such malign beings must remain beneath the earth, pursue and kill the serpent
    with thunder and lightning, and describe a future time near the earth's end when
    their duties will cease, waters will be polluted, and growth will decay. The party
    returns to the lodge and reports completion of the work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visitors are instructed to accompany the hosts, to be kept from harm, and
    to be shown things of interest during the journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men of the lodge and their guests depart with implements and weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One host says Hawenniyo has charged them to tend what he planted on earth,
    make water fall, keep river waters fresh, and water the things on which humans
    live.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dehaenhyowens and his party look below and see another earth far beneath them,
    while thunder-like noises, lightning flashes, rain, and falling raindrops occur.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The party sees a huge serpent with formidable horns protruding from its head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A host says the serpent would cause great misfortune and many human deaths
    if it permanently emerged from the earth, and that preventing such emergence is
    one of their duties.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hosts pursue the serpent amid loud thunder and vivid lightning; it seeks
    shelter beneath trees and mountains but is repeatedly struck and finally killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hosts explain that malign beings called otkan move beneath the ground
    and are doomed to remain below the earth's surface.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hosts say the Evil-minded One formed the bodies of these beings, while
    Hawenniyo decided that they must abide beneath the earth while the earth endures.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hosts say that near the end of the earth their duties will cease, the
    beings may come forth, waters will become polluted, and living growth will become
    old, withered, and decayed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After returning to the lodge, the party reports to the old woman that they
    have completed the task of making growing things moist and mellow.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man in an adjoining room asks whether the work is complete and tells the
    returned men to rest until another day, when they must resume their duties.
  category: speech
  evidence_refs:
  - ev:9
