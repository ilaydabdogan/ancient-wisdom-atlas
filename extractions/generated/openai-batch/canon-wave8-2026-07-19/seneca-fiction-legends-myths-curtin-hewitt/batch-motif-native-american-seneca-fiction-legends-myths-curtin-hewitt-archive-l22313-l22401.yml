canonical_text:
  quote: ''
  summary: A boy named Gajihsondis imitates his uncle’s food preparation with a small
    kettle and a scraped food substance. His blowing and stirring make the mush expand
    uncontrollably until it fills the lodge and drives him onto the roof. The uncle
    returns, reduces the mush by blowing on it, and says the boy has consumed his
    remaining food. The boy asks where the food comes from. The uncle names it Chestnut,
    says it is far to the west among beastlike beings with otkan power and dangerous
    ambushers along the path, and the boy declares he will go get it, leaving two
    fastened limbs as a sign of his fate.
  language: English
  quote_policy: summarized
