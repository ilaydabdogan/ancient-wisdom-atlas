canonical_text:
  quote: ''
  summary: A hunter confronts two Genonsgwa women, demonstrates his power by breaking
    rock and striking a tree, then evades them through water, flight, and concealment
    in a tree. The women cannot look upward because of their stony body covering.
    The elder woman uses an animate finger to locate him, but the hunter steals it
    and escapes. The finger becomes his guide back to the camp of his companions.
    As the party leaves by canoe, the elder woman asks for the return of the stolen
    object and promises good luck if it is returned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two women cannot walk side by side; one follows the other, and the younger
    carries a baby.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the hunter's own fire, the women are enraged; one threatens him, and he
    says they kill human beings and that this is why he does not want them to reach
    him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hunter strikes a huge rock with a tomahawk so that it crumbles into small
    stones, and he shoots a tree with great force.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After seeing the hunter's feats, the younger woman says that they seem to
    have come into contact with Thunder, identified parenthetically as Hinon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In darkness the hunter cannot see the women but can hear them, and he hides
    under the water while they recross the stream by the footbridge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After daylight the hunter runs toward his fellow hunters' camp, but the elder
    woman pursues him and her voice and orenda cause him to fall to the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hunter climbs into a tree, and the Genonsgwa women do not see him because
    their stony body covering prevents them from looking upward.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The younger woman arrives with the baby and nurses the child beneath the tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder woman takes a small animate finger from her bosom, places it on
    her palm, asks where the man is, and the finger points toward the man in the tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hunter descends, snatches the animate finger, and escapes while the women
    call for him to return it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the hunter takes the finger, it serves as his adviser and guide, pointing
    out the direction to his companions' camp.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the camp the hunter eats, regains strength, tells his comrades about the
    pursuing Genonsgwa women, and the chief says they should gather their things and
    go home the next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next day the party loads a canoe and pushes off; the elder woman calls
    from the bank asking for the return of what was stolen and promising success and
    good luck if it is returned.
  category: speech
  evidence_refs:
  - ev:8
