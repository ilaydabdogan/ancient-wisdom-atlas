canonical_text:
  quote: ''
  summary: A Seneca war chief identified by others as a Stone Coat leads expeditions
    after prophetic dreams. In one northern expedition, a dream warns him to attack
    at dawn; he and his warriors surround the enemy camp. The chief duels a large
    enemy warrior whose severed limbs return to place, as do the chief's own. The
    chief kills the opponent by tearing off flesh and keeping the pieces away until
    they cool. Later, in a southern expedition, a dream foretells a more powerful
    enemy and an owl appears as warned, announcing the enemy's nearness. The chief
    and the strong man fight; the chief is thrown, his arm returns after being torn
    off, then his head is thrown off, and some of his men flee while five remain hidden.
  language: English
  quote_policy: summarized
