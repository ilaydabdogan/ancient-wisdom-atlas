canonical_text:
  quote: ''
  summary: An elder uncle sends his nephew back to a valley-cliff to sit and listen.
    The nephew hears a fish-hawk cry, returns to the lodge/fire, and is asked to report
    what he heard. The elder prepares tobacco in his pipe before the youth repeats
    the cry. The elder then sets aside the pipe, takes fire from the kindled fire,
    applies it at the nephew’s head, and the nephew weeps. The nephew later says his
    uncle has overmatched his orenda or magic power; the two lie down and eat at dawn.
  language: English with Seneca interlinear/OCR text
  quote_policy: summarized
