canonical_text:
  quote: ''
  summary: 'Tsodiqgwadon and Doonongaes go to Broken Land. They discuss Doonongaes''s
    prior killing, revival, violence against his reviver, and the women he left behind.
    Doonongaes returns to his mother-in-law''s lodge and regains two women who had
    gone back to earlier husbands. He learns that a council will reconsider the chieftaincies
    because of his conduct. At the council, leadership of the whole world is debated:
    Deanohdjes is proposed, defers, then recommends Doonongaes, while Tsodiqgwadon
    objects on moral and orenda grounds.'
  language: English
  quote_policy: summarized
