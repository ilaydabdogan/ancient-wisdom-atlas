canonical_text:
  quote: ''
  summary: Ganyadjigowa repeatedly questions Gaasyendiet'ha about cosmological and
    traditional beliefs. Gaasyendiet'ha resists answering, becomes angry, strikes
    and ejects him, then follows him. The passage ends with further dispute over wind,
    a lodge, and whether the earth is held above water on the Turtle's back.
  language: English
  quote_policy: summarized
