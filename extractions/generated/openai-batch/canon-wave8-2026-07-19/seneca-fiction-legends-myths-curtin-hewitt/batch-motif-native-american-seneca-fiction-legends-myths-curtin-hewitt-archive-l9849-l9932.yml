  text: Ganyadjigowa continues asking about wind, Hinon making rain, trouble coming
    to those who do not answer, and Hanisheonon being alive; Gaasyendiet'ha reacts
    angrily and strikes him with a club.
  category: sequence
  evidence_refs:
