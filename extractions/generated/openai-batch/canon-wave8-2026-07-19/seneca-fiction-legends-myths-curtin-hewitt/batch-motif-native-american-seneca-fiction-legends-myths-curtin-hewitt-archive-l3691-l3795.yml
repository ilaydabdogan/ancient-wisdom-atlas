canonical_text:
  quote: The old man was an owl, but the nephew was an eagle.
  summary: Two sisters go to propose marriage to a chief's son after their mother
    warns them that his hooked-nosed uncle closely resembles him and will try to deceive
    them. The uncle diverts them to his poor lodge, but they discover his mouse-eating
    behavior, trick him with ant-filled logs, and then marry the nephew. The uncle
    later kills the nephew with a sharpened beech rod thrown down the smoke-hole,
    becomes chief, and tries to marry the widows, who escape. The passage then begins
    another tale in which a hunter tortures and burns a rattlesnake while challenging
    the snake people to fight.
  language: English
  quote_policy: quoted
