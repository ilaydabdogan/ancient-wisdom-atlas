canonical_text:
  quote: ''
  summary: The passage concludes an episode in which an unnamed orphan hunter is aided
    by a ghost woman who lives with him as a wife, gives him hunting success, warns
    him to remain faithful, and then leaves after he marries the chief's daughter.
    It then begins a tale of Hahnowa, the Turtle, who sets out on the warpath by canoe
    and tests would-be companions by making them run to mountains and back.
