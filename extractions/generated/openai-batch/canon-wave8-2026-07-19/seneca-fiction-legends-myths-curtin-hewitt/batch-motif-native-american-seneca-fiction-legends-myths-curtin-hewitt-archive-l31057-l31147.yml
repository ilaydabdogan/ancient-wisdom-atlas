canonical_text:
  quote: ''
  summary: Two visiting men approach an enemy settlement after hiding their weapons
    and removing face paint. They reassure a frightened woman, children, and an old
    man that they come peacefully, then propose ending mutual killing by burying weapons
    deep in the earth. The old man carries the message to the chiefs assembled in
    the Long-lodge.
  language: English
  quote_policy: summarized
