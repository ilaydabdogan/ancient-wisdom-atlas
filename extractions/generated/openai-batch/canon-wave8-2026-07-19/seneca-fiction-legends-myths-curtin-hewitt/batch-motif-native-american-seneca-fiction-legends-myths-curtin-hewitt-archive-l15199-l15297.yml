canonical_text:
  quote: ''
  summary: The passage closes an episode in which black wolves kill a great white
    deer and a man, after which the man's grandmother sees a red western sky as an
    evil sign, follows the trail, and finds only bloody deerskin. It then gives the
    tale of a young hunter warned not to go northeast because of an evil woman. He
    goes there, is magically caught and heart-squeezed, is relieved through instructions
    for a naked dance and pot ritual, then returns with a mole's help, reverses the
    heart-squeezing attack on the woman, and kills her during a similar ritual. The
    passage ends with the opening of a tale in which a hunter challenges Hot'ho, the
    Wind God, to make him freeze.
  language: English
  quote_policy: summarized
