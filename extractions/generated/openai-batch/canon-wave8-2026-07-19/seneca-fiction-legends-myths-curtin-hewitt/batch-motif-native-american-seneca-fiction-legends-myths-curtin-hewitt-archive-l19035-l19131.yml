canonical_text:
  quote: ''
  summary: Ne Hononhsot, identified as Hawenniyo, instructs Hatcinondon about battle,
    arrows, and ending war. Hatcinondon returns to his war party, fights Cherokee
    warriors, is later captured and condemned to be burned, but an old woman who says
    she was a toad he once rescued frees him by means of a rainstorm. He escapes by
    water and a hollow tree, then later kills and scalps three sleeping men.
  language: English
  quote_policy: summarized
