canonical_text:
  quote: ''
  summary: The younger boy’s elder brother leaves in a canoe with two women toward
    the west. The younger boy pursues by throwing scraped red-willow bark into a fire
    and riding the resulting smoke. He reaches the canoe, commands it to return, bargains
    with the women for moccasins made from their sexual organs, and later uses their
    power to travel west again. There he meets an identical boy who becomes his brother,
    hears from a grandmother that the chief’s daughters have brought a man from the
    east whose tears are wampum, and enters the Long Lodge where the man hangs from
    a post.
  language: English
  quote_policy: summarized
