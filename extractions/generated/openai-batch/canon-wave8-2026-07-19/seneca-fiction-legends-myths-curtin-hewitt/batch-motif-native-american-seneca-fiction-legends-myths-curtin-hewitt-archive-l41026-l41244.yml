canonical_text:
  quote: ''
  summary: In this interlinear Seneca-English passage, a youth or nephew is associated
    with a kindled fire, speaks in distress about his uncle, seats himself by a steep
    cliff and remains quiet for a long time. An owl vocalizes and is described as
    speaking. The youth hears it, thinks it may refer to his uncle, and runs back.
    The elder or uncle asks what was heard, delays the telling while he lights tobacco
    in a pipe and smokes, then asks again. The uncle and nephew retire for the night,
    lie down, and rise when day dawns.
