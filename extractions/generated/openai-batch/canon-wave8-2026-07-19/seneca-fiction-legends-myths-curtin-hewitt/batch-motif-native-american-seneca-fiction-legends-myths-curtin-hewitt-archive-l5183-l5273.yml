canonical_text:
  quote: ''
  summary: An Ohohwa man follows a woman north to a lodge, where she is no longer
    visible and two old men treat him as game. After he repeatedly knocks them down
    but cannot kill them, he escapes, follows apparent tracks in a circuit, returns
    to the same lodge, and is captured in a canoe. An unseen helper reveals that the
    old men's hearts hang on a string at the canoe's end, teaches him a canoe song,
    and tells him how to crush the hearts. The man frees himself, destroys the hearts,
    and the next morning uses the orenda-powered canoe to fly north. When the canoe
    rises and accelerates dangerously because he keeps repeating the song, the helper
    boards from the rear, explains how to change the song to guide it, and disappears
    into the air.
  language: English
  quote_policy: summarized
