canonical_text:
  quote: ''
  summary: In this passage Hodadenon defeats Odjineowa pursuers with animated sticks
    and fire, protects his sister and lodge from a wizard's rain of spears, counterattacks
    the wizard by underground approach and fire, wins a head-stakes dice game against
    another old man, and begins a hide-and-seek contest with Dagwanoenyent by making
    himself into a flea and hiding in the opponent's hair.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Odjineowa men see the boy, say they should kill him, rush out with clubs,
    and the boy escapes to the woods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the edge of the woods, Hodadenon's sticks become people and fight, killing
    all the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hodadenon drags the killed men into their lodge and sets fire to it, burning
    them up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hodadenon takes the sticks back to his sister's woodpile before continuing
    onward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Hodadenon comes to a tall stump of a broken tree, where a man addresses him
    as nephew and identifies himself as Hodiadatgon, a great wizard.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wizard asks what Hodadenon would do if spears rained on him; Hodadenon
    answers that he and his sister would be glad because they lack spears for fishing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Near his lodge, Hodadenon says the lodge should be stone, and then a rain
    of spears falls, with some breaking on the roof and others falling to the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: After the spear shower, the sister says Hodadenon has gone toward the north,
    and he replies that he will not go again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Hodadenon later calls a mole, enters its body, travels underground to the
    roots of the stump, and challenges the wizard with the possibility of fire burning
    the stump and woods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Thick smoke appears, the woods blaze, the wizard falls from the stump, his
    head bursts, and an owl comes out and flies away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: In another clearing, an old man with closed eyes invites Hodadenon in and
    proposes a dice game in which the winner will take the loser's head.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The old man's dice are six night owls' eyes; Hodadenon's dice are woodcocks'
    eyes; the throws go through the smoke-hole, and Hodadenon's dice all return the
    same color so the old man loses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The old man asks for one more smoke, Hodadenon refuses, and Hodadenon cuts
    off the old man's head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: In a third opening, Dagwanoenyent sits on a great rock near a lodge, addresses
    Hodadenon as nephew, and proposes a game of hide and seek.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: Hodadenon makes himself into a flea and hides in Dagwanoenyent's long bushy
    hair while Dagwanoenyent searches in the air, trees, knots, clouds, and an island
    in the sea without finding him.
  category: action
  evidence_refs:
  - ev:5
