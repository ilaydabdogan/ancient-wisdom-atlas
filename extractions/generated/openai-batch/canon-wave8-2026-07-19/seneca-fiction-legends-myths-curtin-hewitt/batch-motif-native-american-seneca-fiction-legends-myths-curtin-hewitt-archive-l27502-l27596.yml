canonical_text:
  quote: ''
  summary: A man disciplines a violent ball player by placing him in a tree and later
    releasing him. The same man greets Dehaenhyowens' traveling party, explains that
    one member's continual appeal to the Master of Life enabled their safe arrival
    in the elder country, and offers to restore or refit their lives. One traveler
    volunteers; the host strips bark from a tree, lays the man on it, takes apart
    and cleans his body and bones, reassembles him, and declares that what belonged
    to the other world has been removed. The renewed man proves his new condition
    by catching a deer. The remaining three travelers request and receive the same
    remodeling, after which the host leads them to a large lodge presided over by
    a very old woman.
  language: English
  quote_policy: summarized
