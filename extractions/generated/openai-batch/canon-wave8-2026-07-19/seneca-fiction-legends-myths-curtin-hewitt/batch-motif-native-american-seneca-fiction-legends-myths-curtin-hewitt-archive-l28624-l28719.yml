canonical_text:
  quote: ''
  summary: A young woman from the south says her mother sent her to help a starving
    people obtain food and to become the wife of an elder son. After the marriage
    she directs the household to prepare corn bins, sends a brother-in-law to catch
    a fish, and has a small loaf, fish, and broth served to the whole village. The
    food suffices for all, the people regain strength, thank her, and declare that
    future good food should be shared equally. She then has villagers clear their
    own corn bins.
  language: English
  quote_policy: summarized
