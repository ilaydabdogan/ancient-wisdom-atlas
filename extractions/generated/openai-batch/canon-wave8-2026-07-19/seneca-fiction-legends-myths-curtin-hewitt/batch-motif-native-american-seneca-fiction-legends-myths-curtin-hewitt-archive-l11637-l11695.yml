  quote: ''
  summary: The younger brother learns songs and dancing from birds, speaks of songs
    the people will sing, warns that songs can be dangerous if mishandled, and later
    increasingly identifies with turkeys through a turkey-skin robe that finally cannot
    be removed because it has grown to his body.
