canonical_text:
  quote: ''
  summary: An old woman says her Dream Being requires her son-in-law to kill the Great
    White Beaver of the Lake of the Enchanted Waters and serve it at a feast. The
    young husband kills the beaver, escapes the pursuing enchanted waters, and learns
    that the beaver was the old woman's son, a sorcerer in animal form. He serves
    the beaver at an eat-all feast for the Dagwanoenyent and Gaasyendiet'ha. The old
    woman then tries to destroy him in a sweat-lodge ordeal, but he survives and she
    is burned to death. His wife carries him back to his grandfather, where they live
    peacefully.
  language: English
  quote_policy: summarized
