canonical_text:
  quote: ''
  summary: Gaqga wanders through several camps, eats children, steals meat from four
    hunters by making them sleep, loses the meat when the hunters follow a dream,
    deceives another bereaved family, then watches Hanisheonon attack his people before
    they rescue him and kill Hanisheonon. The next tale begins with two sisters, their
    widowed mother, poverty food, and the mother's advice that a daughter should marry
    the chief's son.
  language: English
  quote_policy: summarized
