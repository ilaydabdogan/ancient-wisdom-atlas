canonical_text:
  quote: ''
  summary: 'The passage first continues an Odegwiyo episode: a boy uses a mole to
    travel underground, deceives a dried woman''s skin with a wampum-like belt, secretly
    enters the lodge of the Seven Sisters and their Mother, is exposed by a voice
    from the fire and by the dried skin, escapes with tobacco, and is pursued until
    his pursuers give up. The passage then begins the story of Djogeon and his uncle:
    Djogeon learns to hunt, is lured to rest by a woman in the forest, falls asleep
    while she searches his head, is carried away in a basket, and later crosses a
    lake in a magically enlarged canoe toward the woman''s home with her mother and
    three sisters.'
  language: English
  quote_policy: summarized
