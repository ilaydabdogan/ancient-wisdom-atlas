canonical_text:
  quote: ''
  summary: A living woman follows her husband's trail into the land of the dead. She
    passes panther guardians with pheasants, receives gourds and oil from passageway
    warders, meets the Mother of Ghosts in a strawberry field, hides in her lodge
    during a ghost dance, and receives her husband's ghost or life sealed in a gourd.
    On her return, a warder instructs her how to reanimate her husband's body by sealing
    its openings, rubbing it with oil, and releasing the life from the gourd into
    his mouth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman takes two pheasants, thanks two men, follows her husband's trail,
    and throws one pheasant to each of two couchant panthers guarding the way of death
    and the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the third passageway, a male guardian asks why the woman is there although
    she is not dead, and she says she is following her husband's trail.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The third passageway guardian gives the woman a closed gourd for carrying
    back her husband's soul and a smaller gourd bottle containing the fat or oil of
    man.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The third passageway guardian tells the woman to rub the oil on her palms
    when she reaches a large strawberry field and to show her palms to an elderly
    woman picking berries there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the strawberry field, the woman oils her palms, raises them toward the
    elderly berry picker, identifies herself as seeking her husband, and gives the
    two gourds to the Mother of Ghosts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mother of Ghosts says she will put the woman's husband into the empty
    gourd bottle so the woman may take him back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mother of Ghosts hides the living woman under bark in a lodge and warns
    her to keep quiet because ghosts come there every night to dance and would flee
    if they discovered her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At night ghosts enter the lodge; the Mother of Ghosts sings and beats a drum
    used in the Great Feather dance, and the ghosts dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ghost of the woman's husband is initially outside the lodge and bashful,
    then is brought inside and joins the dance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ghosts smell the odor of a human being and begin to flee, but the Mother
    of Ghosts persuades them that they smell only her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After an initial failed attempt, the Mother of Ghosts seizes the husband's
    ghost, compresses it into the gourd bottle, and closes the bottle with a tendon
    stopper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Mother of Ghosts gives the woman the gourd containing her husband's life
    and the small gourd containing oil, and tells her to leave quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the first passageway, a warder instructs the woman to seal the openings
    of her husband's body with fine clay, rub the body with oil, and uncork the gourd
    into his mouth so his life will reenter and reanimate the body.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The first passageway warder gives the woman two roasted pheasants as sops
    for the two couchant panthers guarding the middle passageway and sends her on
    the journey home.
  category: action
  evidence_refs:
  - ev:6
