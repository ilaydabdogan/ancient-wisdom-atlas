canonical_text:
  quote: ''
  summary: The passage first concludes a conflict in which Ganyadjigowa tries to burn
    Gaasyendiet'ha's lodge and is killed by him. It then begins the tale of two shunned
    young friends who leave their village, travel south through hardship, discover
    a hemlock tree from which an aerial trail leads upward, reach a higher world,
    and meet Kaahkwa, the Sun, who says he called them and directs them onward. They
    next reach a lodge where an old woman offers them squash and corn bread.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa says he killed the old man known as magically powerful, then
    goes to Gaasyendiet'ha's lodge and hears him singing and speaking about killing
    Ganyadjigowa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ganyadjigowa piles brush and sets Gaasyendiet'ha's lodge on fire; Gaasyendiet'ha
    springs through the fire and confronts him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ganyadjigowa denies making the fire, saying he came to blow it out, but Gaasyendiet'ha
    does not believe him and pounds him to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After killing Ganyadjigowa, Gaasyendiet'ha whoops that he is the most powerful
    man under the blue sky because he has the most powerful orenda.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: People all over the world hear Gaasyendiet'ha's outcry and say that Ganyadjigowa
    is dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Two young men in a village are great friends; because of this, people dislike
    and shun them, and they cannot find a lodge in which to live.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The two young men decide to leave the village and go toward the south.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: During their journey they sleep where dry leaves have fallen, eat evergreens
    and lichens, make bows and arrows, kill small birds, and pass through woods and
    marshy ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: At a large hemlock tree, one young man climbs up, sees a beautiful trail leading
    through the air, and calls his companion to see it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that in whatever they undertook they had to be of one mind;
    when they are of one mind, they start along the aerial trail.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The trail from the tree seems as solid as earth and extends as far as they
    can see; the two travel on it without knowing they are going upward until they
    reach another pleasant world.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: In the higher world they pass game without stopping and come to a bark lodge
    with smoke rising from it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The lodge inhabitant says he knows their troubles, says he called them from
    the lower world, and says he influenced them to follow the trail upward.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The lodge inhabitant identifies himself as Kaahkwa, the Sun, the Elder Brother
    in the sky, and says he makes light for people by Hawenniyo's command.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: Kaahkwa says the lodge is his resting place at midday, says he goes toward
    the west, under the earth, and comes out in the east, and instructs the young
    men to stop at the next lodge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: At the second lodge, an old woman greets the young men as grandchildren, says
    their brother sent them, and gives them boiled squash and corn bread, saying it
    will be enough for both.
  category: action
  evidence_refs:
  - ev:6
