canonical_text:
  quote: ''
  summary: 'The passage describes seasonal movement from summer pigeon hunting to
    autumn deer hunting, winter provisioning from venison and buckskin, and a set
    of natural signs used to forecast weather, abundance, and direction. It attributes
    these signs to the Porcupine clan of the Wan''dat tribe, noted for wisdom and
    foresight. It then begins a legend, reported by a Seneca shaman, about the origin
    of Bear songs and dances: a nearly two-year-old boy at a hunters'' temporary camp
    is taken by a strange man to a lodge where two small boys receive him as a playmate,
    and he observes their foods and customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After summer pigeon hunting, a leader tells the people that deer have gone
    in a certain direction, are fat, and should be sought for food and skins.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group leaves the pigeon-roost grounds early in autumn and journeys to
    deer-feeding lands, where temporary camps are erected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Good hunters lead small parties in search of deer and kill large numbers of
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Venison is dried for winter food, and deer skins are tanned into buckskin
    for leggings, moccasins, and other garments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deer are shot with bows and arrows, and some are caught with traps.
