canonical_text:
  quote: '"I am corn; I am native corn; I am sweet corn."'
  summary: A husband reaches his wife and mother-in-law in an abundant cornfield,
    is fed, and later receives food and seed corn, beans, and squash to take back
    to his hungry people after the flood-renewed earth. A second episode tells of
    a young woman rescued from midstream, later found transformed into an ear of corn,
    who instructs a grandmother in dreams to plant and care for her so that she may
    provide for human beings.
  language: English
  quote_policy: quoted
