  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The young man wondered whether his mother's warning about punishment for refusing
    marriage had come to pass and decided to return home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: During his return journey he camped, kindled a fire, heard approaching noises,
    added dry sticks to increase the light, and saw a very large woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The very large woman asked for a portion of meat; he threw a quarter of meat
    over the fire, and she caught and ate it while blood dripped on her breast and
    garments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After eating, the very large woman told him to return to that place in autumn,
    when the season changed again, and then she went away into the darkness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man stayed awake all night, returned home, and told his mother that
    he had come back because he was homesick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother reported that three maidens had visited her to propose marriage
    with him; he agreed to marry and chose one of them.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
