  quote: ''
  summary: A young man who has refused marriage is visited at night by a mysterious
    young woman, then encounters a very large woman at a campfire who asks for meat
    and tells him to return in autumn. Frightened, he returns home and agrees to marry
    one of the women who have sought him.
  language: English
