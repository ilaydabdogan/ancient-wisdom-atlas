literal_observations:
- id: obs:1
  text: A bird named S^hadahgeah is described as dwelling above the clouds and mists
    and as chief of all birds; the chief of crows is chosen as notifier, and the eagle
    is another chief under the great bird.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When trees and plants begin to show new life, the presiding chief says enough
    has been sung and that someone must put the medicine into the man’s body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chickadee drinks the medicine, enters the man by the mouth into the stomach,
    and emits the medicine while others rub the dead man’s body with medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The birds and beasts sing for two days and two nights until the body becomes
    warm again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After resuscitation, the man says he felt as if aroused from sleep, heard
    the birds and beasts, came to life, and understood the words in the sorcerers’
    chants.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief says the medicine is bestowed on the man and his people for healing
    injuries, and that it must be renewed by appointed feasts and burning old-kind
    tobacco for birds and beasts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The birds and beasts teach the man how to use the medicine and the songs that
    put it in action, then send him home to inform his people through their authorities.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: People who had heard the man was scalped and killed gather around him when
    he returns alive and ask how he returned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man says birds and animals made the medicine that revived him in return
    for his earlier kindness to them, then teaches selected wise men how to use and
    preserve it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man warns that the medicine songs must not be treated lightly or sung
    without the medicine; the medicine is named nigahnegahah, glossed as “small dose,”
    and is said to remain respected among the Iroquois.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Dipper story, six men go hunting far from home, find no game, carry
    a man who claims sickness, and the sixth member comes behind carrying a kettle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hunters find a bear track, drop the sick companion and burdens, chase
    the bear, and the supposedly sick man follows, passes them, overtakes the bear,
    and kills it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The hunters do not notice that they are going upward; people see them rising
    in the air, and when they overtake the bear they have reached the heavens and
    remain there near the Polar Star.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The kettle-carrier is identified with the bend of the Great Dipper, the kettle
    with a small nearby star, and the bear with a star at the lower outside corner.
  category: relationship
  evidence_refs:
  - ev:9
