  quote: ''
  summary: The supplied range contains the end of a narrative in which bird and animal
    sorcerers revive a killed man with medicine, songs, and ritual obligations involving
    feasts and tobacco, followed by the opening of “The Seven Stars of the Dipper,”
    where hunters pursuing a bear ascend into the sky and remain as stars near the
    Polar Star.
  language: English
