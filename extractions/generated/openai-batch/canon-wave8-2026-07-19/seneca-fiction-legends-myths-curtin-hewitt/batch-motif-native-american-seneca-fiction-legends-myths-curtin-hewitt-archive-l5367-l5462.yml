canonical_text:
  quote: ''
  summary: A young nephew uses a wand and magical words to make a kettle and its mush
    grow, after using up his uncle’s rare chestnut food. The uncle explains that only
    one such chestnut tree exists, owned by seven sorcerer sisters and watched by
    a great eagle. The nephew sets out toward the sunrise, kills a deer for venison,
    summons a mother mole as helper, enters the mole’s body after shrinking himself,
    reaches the guarded tree underground, distracts the eagle with venison, steals
    chestnuts, and escapes while the sisters punish the eagle.
  language: English
  quote_policy: summarized
