canonical_text:
  quote: ''
  summary: Doonongaes encounters hostile Odjieqda women, escapes their attacks, and
    burns their lodge. He then joins Tsodiqgwadon in a ball game against two old Dagwennigonhge
    men, wins, cuts off their heads, and burns a lodge. The heads burst and Dagwanoenyents
    rush out; a cliff collapses. Doonongaes and Tsodiqgwadon confront Hahnyusdais,
    master of the dwellers under the cliff, and stretch him until he becomes Haunhdji.
  language: English
  quote_policy: summarized
