  quote: ''
  summary: The passage contains the end of a tale in which Hinon's son goes away with
    his storm father and becomes associated with thunder; a tale in which Crawfish
    are deceived by an enemy feigning death and are eaten; a tale in which a mud turtle
    deceives a fox who becomes a bear, loses a race through a decoy trick, and is
    beheaded, explaining bears' stub tails; and the opening of a hunting-family tale.
