canonical_text:
  quote: ''
  summary: The passage first recounts a wife rescuing her husband after a sister-in-law
    disobeys a no-looking command and animals carry him away. The wife borrows a white
    deer's coat, becomes a white deer, overtakes the animals, retrieves her husband,
    and restores the coat. The passage then begins the tale titled “The Horned Snake
    and the Young Woman,” in which a proud young woman near Cayuga Lake is visited
    at night by a glistening stranger who persuades her to become his wife and later
    leads her toward his home beyond a hill.
  language: English
  quote_policy: summarized
