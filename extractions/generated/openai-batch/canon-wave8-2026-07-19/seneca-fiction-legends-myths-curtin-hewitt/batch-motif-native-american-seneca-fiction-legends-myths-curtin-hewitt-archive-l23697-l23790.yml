canonical_text:
  quote: ''
  summary: An old man has a young man and young woman sleep in his lodge, sings a
    song about a doomed group, kills the sleeping young man with a war club, and cooks
    the body in a pot over the fire. The passage states that he eats human flesh and
    has hypnotized a captive granddaughter about the food she eats. Meanwhile, a brother
    of Honenhineh goes north to seek missing brothers, follows their tracks through
    clearings toward the Great Valley, hears an unknown singer beating a dead tree,
    then encounters a talking flicker on a tree. The flicker mocks his archery and
    claims no one can kill it, but he shoots it with an arrow, carries it still transfixed,
    and continues to a smoking lodge where his brothers' tracks lead.
  language: English
  quote_policy: summarized
