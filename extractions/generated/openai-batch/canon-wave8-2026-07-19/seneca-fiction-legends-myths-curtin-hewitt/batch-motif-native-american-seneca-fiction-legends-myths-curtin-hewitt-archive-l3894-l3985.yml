canonical_text:
  quote: ''
  summary: A younger brother and an elder brother fight while a woman cannot distinguish
    them until she sees a squash shell and strikes the elder. The younger burns the
    elder's body, sends the woman west in a cat-tail flag on an arrow, and flees with
    her. The elder returns as a pursuing ghost or revived brother. The younger disguises
    the woman as a stump, sends his moccasins as decoys, and creates obstacles from
    a beaver jaw and a pigeon feather. The fleeing pair then receive route guidance
    from an old man and an aunt, including passage through moving rocks, a river crossing
    by canoe, a harmless army, a dog guide, and the mother's lodge.
  language: English
  quote_policy: summarized
