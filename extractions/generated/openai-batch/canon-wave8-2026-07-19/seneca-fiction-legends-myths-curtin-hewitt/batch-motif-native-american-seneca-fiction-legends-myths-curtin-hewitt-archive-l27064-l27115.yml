canonical_text:
  quote: ''
  summary: In severe winter weather, an old man has his nephew Gadjis'dodo' lie on
    a bark sledge, wraps and ties him in it, and drags him swiftly around a lodge
    while singing and repeatedly asking whether he is alive. After repeated circuits,
    including a ninth where the youth pretends to be nearly dead and a tenth decreed
    by the old man's dream word, the youth answers strongly that he is alive. The
    old man unfastens him and says the dream command has been fulfilled.
  language: English
