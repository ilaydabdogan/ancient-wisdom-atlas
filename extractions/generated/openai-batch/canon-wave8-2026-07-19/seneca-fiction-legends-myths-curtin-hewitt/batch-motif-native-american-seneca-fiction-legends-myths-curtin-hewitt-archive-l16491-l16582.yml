canonical_text:
  quote: ''
  summary: A youth, Ot'hegwenhda, uses an animated fetish to kill a six-foot Spider-being
    by sending an enlivened tree limb to split its hidden heart beneath a lodge. He
    restores his skeletal father with spittle, burns the Spider's lodge and sees something
    become a Sandpiper, then sets a spring-water and red-flower trap at a crossroads
    where the skeleton of Djainosgowa falls apart.
  language: English
  quote_policy: summarized
