  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fetish says Hagowanen is only a skeleton and instructs Ot'hegwenhda to
    rub spittle over him; after this, flesh returns and Hagowanen becomes well.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Hagowanen returns home, his wife does not believe he is alive and drives
    him out to the rocks, thinking he is a ghost.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Ot'hegwenhda burns Djieien's lodge, something shoots up from the coals,
    flies west, lands on a plain, and becomes a Dowisdowi, or Sandpiper.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a four-corner trail crossing, the fetish directs Ot'hegwenhda to use a
