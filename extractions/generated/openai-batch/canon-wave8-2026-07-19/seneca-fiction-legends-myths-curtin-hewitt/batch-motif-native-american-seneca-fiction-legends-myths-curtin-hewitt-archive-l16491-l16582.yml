- id: obs:1
  text: A dust cloud precedes the appearance of a six-foot Djieien, identified parenthetically
    as Spider, who returns to a slightly sunken lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ot'hegwenhda listens outside the lodge and hears crying that he thinks resembles
    his father's voice.
  category: action
  evidence_refs:
