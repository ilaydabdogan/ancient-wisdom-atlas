  text: The fetish comes to life, stands up, answers Ot'hegwenhda's question, and
    gives instructions for killing Djieien.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Djieien's heart is said to be in the ground under the lodge, and the fetish
    instructs Ot'hegwenhda to throw a tree limb with a command to split it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ot'hegwenhda spits on the cut limb; it becomes alive, goes under the lodge,
    splits Djieien's heart, and Djieien dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the lodge, Hagowanen is found under a couch in a dying condition, with
