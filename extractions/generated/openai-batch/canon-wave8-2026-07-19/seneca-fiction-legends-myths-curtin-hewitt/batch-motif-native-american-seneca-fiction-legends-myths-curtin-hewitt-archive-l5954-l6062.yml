canonical_text:
  quote: ''
  summary: A boy abandoned in a lodge is helped by an unseen friend named Gaha, who
    supplies food, advises him how to kill a bear, warns him not to boast of his speed,
    and later rescues him in a race against a great bear by carrying him in a whirlwind.
    The boy gives burned tobacco to Gaha and is carried home. The passage then begins
    another tale in which an old man prepares for a long journey and a boy asks to
    accompany him.
  language: English
  quote_policy: summarized
