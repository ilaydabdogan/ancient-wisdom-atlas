canonical_text:
  quote: ''
  summary: 'The passage concludes an episode involving Big Earth, two women, deceptive
    bed-substitution with rotten logs and ants, and the women living with Big Earth''s
    son. It then begins the tale of Hinoñ and Seneca warriors: a hungry Seneca war
    party follows a bear into a den, meets an old man with other men around a fire,
    brings tobacco to him, and witnesses him dismember and restore warriors into youthful
    lightness. The old man then tells them of a world-spanning opening containing
    a rock with a horned man, tests their orenda by having them shoot a rock and a
    tree, and says he protects trails and causes rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People enter a lodge, place a basket before the old woman Big Earth, and Big
    Earth is pleased after the dancing ends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dancing man thinks two girls are in his bed, but when he gets into bed he
    finds two rotten logs and many ants, scolds his wife, and throws the logs outside.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two girls live with Big Earth's son; he prepares small packages of bear meat
    and deer meat as two loads for his wives, and they visit the women's mother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women's mother had been uneasy because she thought her daughters had been
    deceived again, but she is pleased when they arrive with their husband.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Seneca war party on the warpath against the Cherokee becomes hungry, sees
    a bear, chases it into its den, and one warrior follows it inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the den the warrior no longer sees the bear, but sees a brisk fire
    and three men sitting around it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eldest man says the bear was one of his men, sent to entice the warrior
    into the den, and asks for tobacco to be brought from the Seneca camp.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The next day the warrior returns with five companions, each carrying native
    tobacco, and the old man thanks them for the tobacco gift.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a warrior says he is tired and sleepy, the old man tells him to lie down;
    the others also lie down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old man rubs a warrior's body from feet to head, dismembers him joint
    by joint, pounds his bones to jelly in a mortar, pours the result into a bowl,
    and carries vessels to another part of the den.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After smoking, the old man calls the warrior his nephew and tells him to come
    out; the warrior returns light, fresh, and lithe like a boy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Other Seneca warriors ask for the same treatment and are renewed, but the
    old man later refuses another request for transformation.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The old man describes a large opening extending from one end of the world
    to the other, with a great rock in it and a man with enormous horns inside the
    rock.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old man wants two warriors to crush the rock and kill the horned man,
    but first sends them to test their strength in orenda.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The warriors shoot at a rock, which crumbles, and at an enormous tree, which
    falls and leaves only a stump.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The old man says the remaining companions may stay in the den because they
    will not die there, and says that he helps his grandchildren, covers trails, and
    causes rain.
  category: speech
  evidence_refs:
  - ev:8
