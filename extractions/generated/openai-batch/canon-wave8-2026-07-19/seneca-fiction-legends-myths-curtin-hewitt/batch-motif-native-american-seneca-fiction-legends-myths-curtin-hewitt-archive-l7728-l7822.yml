  cautions: The preceding setup is outside the provided passage, so the agent and
    purpose of the deception are unclear.
- id: motif:2
  label: animal entices hunter-warrior into hidden supernatural dwelling
  taxonomy_refs:
  - shapeshifter
  - mystical_quest
  basis: A bear leads a warrior into a den; the old man says the bear was one of his
    men sent to entice the warrior.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The text does not explicitly describe a visible shape-change; the shapeshifter
    reference is based only on the bear being called one of the old man's men.
- id: motif:3
  label: tobacco gift to supernatural host
  taxonomy_refs:
  - sacred_exchange
  basis: The old man requests tobacco and is glad when Seneca warriors bring pouches
    of native tobacco as a present.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage shows exchange and gratitude, but does not explicitly state
    a formal ritual contract.
- id: motif:4
  label: dismemberment followed by rejuvenated return
  taxonomy_refs:
  - death_rebirth
  - resurrection
  - initiation
  basis: The old man dismembers warriors, pounds their bones, removes the vessels,
    and later calls them forth fresh, lithe, light, and youthful.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage emphasizes renewal and bodily lightness; it does not explicitly
