canonical_text:
  quote: ''
  summary: 'The passage first closes a pursuit sequence in which an elder brother
    is delayed by a net, crushing rocks, a river crossing, and finally destroyed by
    S''hagodiyoweqgowa with turtle-shell rattles, after which a mother welcomes her
    son and his wife. It then begins the tale of Haiendonnis and Ybnogbauns: Haiendonnis
    wanders north carrying his effects, sleeps in his bundle or in hollow trees, survives
    a comic descent at a precipice using a basswood-bark strand, builds a cabin, and
    obtains food and fuel through commands and a killing gesture directed at game.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder brother rudely pushes an old man mending a net, asks whether anyone
    passed, strikes him with a club, and is entangled when the old man throws the
    net over him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At rocks that open and close, the elder brother asks an old woman to stop
    them; she refuses, and when he jumps, half his body is crushed before he cures
    it with spittle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a river, the elder brother shouts to a man in a canoe, receives no response,
    and swims across.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the far side of the river is an immense forest of withered trees stripped
    of bark and killed by the hammering of turtle-shell rattles while S'hagodiyoweqgowa
    dance.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The S'hagodiyoweqgowa turn on the elder brother and hammer off his flesh and
    bones until no trace remains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother is happy to see her son and his wife and says she had feared the
    elder brother would kill the son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Haiendonnis walks north through the forest with his effects, without knowing
    his origin or destination, and spends nights in his bundle or a hollow tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a steep precipice, Haiendonnis makes a long strand from basswood bark,
    ties it to a hemlock tree, lowers himself, thinks he cannot descend, releases
    his grip, and then discovers he was already on the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After further travel, Haiendonnis chooses a place where trees stand close
    together, builds a small cabin, puts his pack inside, and arranges skins, furs,
    bowls, a pouch, and weapons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Haiendonnis points his finger at a deer, and the deer falls dead; he carries
    it home and orders it to skin itself, which it does.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Haiendonnis lacks firewood, he speaks aloud that wood for fuel should
    come and pile itself beside his doorway, and the wish is immediately accomplished.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The passage states that Haiendonnis has influence over every kind of game:
