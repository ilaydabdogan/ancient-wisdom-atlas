canonical_text:
  quote: ''
  summary: The passage concludes one tale in which a pursued young man is protected
    in a lodge by an old woman, the pursuing woman dies in a kettle of boiling bear's
    oil, twins are later born and restore family relations by fetching an uncle. It
    then begins the story of Bloody Hand, a famed Iroquois hunter and war captain
    who feeds carnivorous birds and animals. After he is killed and scalped in war,
    the birds mourn him, retrieve his scalp, and prepare a medicine through offerings
    of their own flesh, testing it with plant growth and holding a sanctifying council
    with animals, birds, wolves, and snakes.
  language: English
  quote_policy: summarized
