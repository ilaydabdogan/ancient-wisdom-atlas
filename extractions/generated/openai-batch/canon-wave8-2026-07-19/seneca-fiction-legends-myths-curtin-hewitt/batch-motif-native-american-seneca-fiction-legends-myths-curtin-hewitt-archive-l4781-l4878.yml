canonical_text:
  quote: ''
  summary: A youth deceives the sisters of Deadoendjadases, takes hidden hearts from
    a loon beneath a bed, kills the sisters and the man-eater by crushing their hearts
    against a rock, raises slain people from bones, restores Hadjoqda, and establishes
    villages around a great strawberry patch. The passage then begins another tale
    about an uncle sending his near-puberty nephew to listen in a ravine.
  language: English
  quote_policy: summarized
