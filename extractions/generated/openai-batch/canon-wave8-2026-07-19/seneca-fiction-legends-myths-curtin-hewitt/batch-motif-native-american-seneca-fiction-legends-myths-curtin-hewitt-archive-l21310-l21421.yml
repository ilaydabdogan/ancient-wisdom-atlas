canonical_text:
  quote: ''
  summary: 'A fragment tells of an old man who has eaten a great monster, tends enormous
    corn and squash fields, and sends a healed grandson onward; the grandson reaches
    a village and is reunited with the wife he had sent away as vapor. A second tale
    tells of an elder woman, Dagwanoenyentgowa S''hagodigendji, whose grandchildren
    are attacked by a Yenonsgwa: the girl is swallowed and the boy is carried away
    on the Yenonsgwa''s back. The grandmother tracks them, follows as a whirlwind,
    uncovers their underground hiding place, kills the Yenonsgwa by tearing her stone
    covering with stones, rescues the boy, instructs him to use his orenda, and is
    later threatened by the Yenonsgwa''s people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man finishes eating the great Djainosgowa, thanks the grandson for
    the meat, and says the grandson must remain until rested and cured because the
    monster's orenda has infected him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man shows fields with giant corn, many varieties of corn, and very
    large squashes before returning to his lodge.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After leaving the old man, the young man reaches a village, is received by
    the chief, and is recognized by the chief's daughter as the wife he had sent away
    in vapor form.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dagwanoenyentgowa S'hagodigendji, described as the eldest woman of her people,
    lives in the woods with a boy and a girl who are her grandchildren.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: While the grandmother is away, a Yenonsgwa comes to the lodge, speaks kindly
    to the girl, swallows her, and then persuades the boy to climb onto her back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy becomes fastened to the Yenonsgwa's back, cannot get down, and remains
    out of reach while the Yenonsgwa travels for many days and wants to eat him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The grandmother returns, finds the children gone, discovers Yenonsgwa tracks
    near the lodge, and follows the trail to recover her grandchildren.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Yenonsgwa tries to remove the boy by rubbing him against a hickory tree,
    but stops when he says he likes it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The grandmother follows in the form of a whirlwind, and the Yenonsgwa hides
    with the boy in an earth-covered hole or cavern in a deep ravine.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The boy calls out to his grandmother, who turns back, blows earth from the
    hiding place, and reveals the Yenonsgwa on the surface.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The grandmother commands the boy to get off the Yenonsgwa's back, hurls great
    stones at the Yenonsgwa, rends her rock clothing, kills her, and takes the boy
    home.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: On the way home, the grandmother tells the boy not to let himself be maltreated
    and says he can master such people by using his orenda because he is a Dagwanoenyentgowa
    like her.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Yenonsgwa's people later find her dead; her spirit reports that the old woman
    killed her and rent her stone coating, and Yenonsgwa's men resolve to gather a
    company to kill the old woman.
  category: sequence
  evidence_refs:
  - ev:12
