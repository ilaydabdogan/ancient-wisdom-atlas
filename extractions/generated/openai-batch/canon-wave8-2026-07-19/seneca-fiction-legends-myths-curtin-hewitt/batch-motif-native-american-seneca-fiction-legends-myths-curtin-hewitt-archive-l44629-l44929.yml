canonical_text:
  quote: ''
  summary: A fragmentary interlinear Seneca-English passage describes an elder woman
    speaking to an old man about a woman gathering wood for fire with her husband's
    people. The old man gives thanks and says they are wealthy. Several named or glossed
    figures are noticed, including He the Listener, He the Scorched Patmeh, and Two
    Feathers. An old woman instructs children or sisters about going to fetch someone
    as a spouse, with the eldest to go first. The sisters make and pound bread; the
    bread is finished, called marriage bread, and counted as twenty loaves. The old
    woman then calls her daughter to come and stand nearby.
