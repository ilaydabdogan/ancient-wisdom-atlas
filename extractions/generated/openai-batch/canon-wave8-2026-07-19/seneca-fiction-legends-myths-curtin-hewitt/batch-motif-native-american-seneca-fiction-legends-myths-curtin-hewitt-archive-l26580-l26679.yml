canonical_text:
  quote: ''
  summary: A youth prepares magically transformed bear entrails from a grapevine for
    a dangerous barter with his old uncle. In the lodge, the uncle sings a bartering
    song; flames threaten the youth until he names and gives the prepared bear entrails
    in exchange for meat. The next morning the youth consults the skull of another
    uncle, who warns him that the old man will make a large fire and dream of bear
    liver; the youth prepares two transformed bear livers from fungi. That night the
    old man enters a violent dream-state, throws himself onto the fire, scatters burning
    wood, and is stopped when the youth strikes his moving head with the old man’s
    war club.
  language: English
  quote_policy: summarized
