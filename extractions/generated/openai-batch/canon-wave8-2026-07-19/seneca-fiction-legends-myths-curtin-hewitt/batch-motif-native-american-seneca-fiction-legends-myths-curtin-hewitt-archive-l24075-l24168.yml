canonical_text:
  quote: ''
  summary: A young hunter follows a raccoon through snow to a cavern in a rocky river
    bank, enters a long downward passage, and emerges into a different country with
    ripe black raspberries. He follows the raccoon tracks, marking the path, and reaches
    a lodge where an aged man and woman welcome and feed him. The aged man, a chief,
    invites him to a council lodge but warns him to leave when dancing begins and
    to sleep in an elevated hut, pull up the ladder, and never let it down for anyone.
  language: English
  quote_policy: summarized
