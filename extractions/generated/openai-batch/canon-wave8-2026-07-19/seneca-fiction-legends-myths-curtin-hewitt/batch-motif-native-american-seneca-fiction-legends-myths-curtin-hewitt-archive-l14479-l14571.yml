canonical_text:
  quote: ''
  summary: Haiwanenqgwi, under Tsodiqgwadon's direction, travels to multiple regions
    of the world, including places associated with the Blue Sky, an eastern island,
    the far north, and the southern end of the earth, to invite various peoples to
    a great council at Broken Land. Peoples from all quarters, above, and below gather
    around a council fire and choose chiefs. The passage then begins a separate tale,
    Genonsgwa, in which a strange boy of unknown origin grows up neglected in a warlike
    village and insists on joining a war party despite being refused.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haiwanenqgwi goes down through an opening under a door in the Blue Sky and
    tells the old man Shagoewatha about the great council at Broken Land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haiwanenqgwi also notifies S'hagodiyoweqgowa and Niagwaihegowa, who agree
    or promise to attend the council.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsodiqgwadon tells Haiwanenqgwi that he has not notified everyone and sends
    him east to a great island with many people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the water at the end of the earth, Haiwanenqgwi walks on the air to Tgawenosdenh
    and notifies many kinds of people there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsodiqgwadon next sends Haiwanenqgwi to Othowege in the far north, requiring
    travel on the air; the place is cold, windy, and snowy, and Hathogowa is chief
    there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Haiwanenqgwi delivers the invitation to the Otho people, who say they will
    go to Broken Land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tsodiqgwadon sends Haiwanenqgwi to Onenonhge at the southern end of the earth;
    he finds a warm, flower-filled country with many people who look like Ongwe Honwe
    and who agree to attend the council.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the set time, people from all parts of the world, from the four quarters,
    and from above and below gather around the great council fire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tsodiqgwadon announces that the purpose of the council is to choose a chief
    of all peoples dwelling above and below.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After lengthy deliberation, Gaasyendiet'ha is chosen as chief of all the people
    of the world above and below, and Hinon is later chosen as second chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Each locality then chooses chiefs: the Stone Coats choose Ongwe Hanyos, the
    Ongwehonwe choose one of their principal men, other peoples keep their former
    chiefs, and Tsodiqgwadon is chosen chief of the Snake People only.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the opening of Genonsgwa, a small strange boy of unknown origin comes to
    a warlike village, moves among lodges, is little cared for, and grows into a young
    man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: When twenty men prepare to go on the warpath, the young man asks to join,
    is refused by several people, and says he will go anyway.
  category: action
  evidence_refs:
  - ev:7
