canonical_text:
  quote: ''
  summary: The passage closes a tale in which a young hunter, after staying with rattlesnake
    hosts in a cavern, returns home and tells a council that rattlesnake people take
    human form and live under human institutions. It then begins the tale of a family
    of seven brothers and one sister. While most are absent, the daughter of the witch
    Gahoʹdjiʹdaʹhoʹk enters with marriage-proposal bread and, despite instructions
    to sit on the recluse youngest brother's bed, shifts among the beds until she
    reaches the eldest brother's bed; the siblings interpret her sitting there as
    a marriage choice.
  language: English
  quote_policy: summarized
