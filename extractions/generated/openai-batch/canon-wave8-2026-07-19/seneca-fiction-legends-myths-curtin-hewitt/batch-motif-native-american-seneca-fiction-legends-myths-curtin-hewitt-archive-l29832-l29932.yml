  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The white pigeon says the pigeons do not object to humans taking young pigeons
    for satisfaction and that the Creator ordained pigeon flesh for human welfare
    and contentment.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The white pigeon identifies itself as the oldest among its people and says
    it was chosen to tell the pigeons' wishes and teach their songs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The white pigeon instructs the humans to dance in circuits around their fires,
