canonical_text:
  quote: ''
  summary: 'The passage closes an origin account of the Bear ceremony, in which a
    child who lived with Bear people explains a forked rod and the ceremony to humans.
    It then begins an origin account of Pigeon songs and dances: humans visit a pigeon
    roost, an upright young man is addressed by a white elder pigeon, and the pigeon
    instructs humans in moral conduct, thanksgiving to the Creator, songs, dances,
    tobacco offerings, fire offerings, and joint prayer with the pigeon people.'
  language: English
  quote_policy: summarized
