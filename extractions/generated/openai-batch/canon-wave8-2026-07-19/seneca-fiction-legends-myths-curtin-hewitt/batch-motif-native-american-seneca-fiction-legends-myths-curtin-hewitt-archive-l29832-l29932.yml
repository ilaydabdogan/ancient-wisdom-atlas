  evidence_refs:
  - ev:5
- id: obs:8
  text: The white pigeon says many humans at the roost do not remember the Creator
    and have evil thoughts, and warns that those who do not put away such longings
    will suffer grave misfortune.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The white pigeon explains that the pigeons' morning and evening tumults, circling,
