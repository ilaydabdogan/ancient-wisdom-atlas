canonical_text:
  quote: ''
  summary: 'The passage presents an introductory theory of American creation mythology:
    the first people or gods develop individual character, enter conflict, and are
    transformed into natural beings and things. Their institutions are inherited by
    humans. Some former people remain unchanged and depart above or beyond the sky.
    The author frames these myths as a broad religious-philosophical system and compares
    them with other traditions.'
  language: English
  quote_policy: summarized
