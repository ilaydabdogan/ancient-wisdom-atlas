canonical_text:
  quote: ''
  summary: The passage closes one story by describing charred animal bones distributed
    as powerful hunting fetishes, then begins the story of Ongwe Hangesha and his
    nephew Gajihsondis. The uncle confines the boy in the lodge and makes him shoot
    at a bear's foot while the uncle is away. The boy secretly watches at night and
    sees the uncle retrieve a hidden bark case, use a small kettle and an unidentified
    object to cook mush, eat alone, shrink the kettle by blowing on it, and hide it
    again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire burns down, leaving only a few charred bones of a huge animal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest man tells the assembly to take portions of the bones and make them
    into fetishes for hunting named kinds of game.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Members of the assembly assign bone fragments to uses such as hunting bear,
    deer, raccoon, otter, raven, fishing for sturgeon, trapping minks, winning women,
    and other bodily functions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An ill woman is placed on a pack-cradle for wounded persons, and the group
    returns safely home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ongwe Hangesha, an old man, and Gajihsondis, his nephew, live together in
    a lodge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When leaving for some time, the uncle fastens his nephew securely in the lodge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The uncle gives the nephew a bear's foot and instructs him to shoot at it
    all day, saying the name only when he hits it and eating available food when hungry
    before resuming the task.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The nephew follows the instructions and calls out when he hits the bear's
    foot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The nephew wonders what his uncle eats, since he has not seen him eat, and
    decides to watch him through the night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At night the boy wraps himself in a skin near the fire and watches his uncle
    through a very small hole without sleeping.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Around midnight the uncle blows strongly on the fire, causing sparks to rise;
    he warns the nephew that he may burn, apparently testing whether he is awake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The uncle retrieves a bark case from beneath his couch, removes a small kettle
    and an unidentified object, places water in the kettle, and hangs it over the
    fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The uncle blows on the fire until it is hot enough and scrapes material from
    the unidentified object into the kettle, making something compared to chestnut
    mush.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After eating, the uncle blows on the kettle, causing it to grow small again,
    then wraps it with its contents, returns it to the bark case, and hides the case
    under his couch.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The next morning the uncle prepares to go hunting and repeatedly tells the
    nephew to eat whenever he is hungry.
  category: speech
  evidence_refs:
  - ev:10
