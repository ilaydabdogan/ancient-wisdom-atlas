canonical_text:
  quote: ''
  summary: In an upper-world lodge, an old woman tells Dehaenhyowens and his party
    that before returning home they must tour the upper world. She explains that she
    is weaving a mantle from human hair, with one hair arriving when each human dies
    below, while her small cur repeatedly undoes the work. The party tours a fruitful,
    blossom-lit landscape, sees shades, and visits a village where Dehaenhyowens's
    mother and relations dwell. The old woman sends them home by way of the Sun's
    lodge. The Sun identifies himself, the men of Thunder escort the humans, and Daga'e"'da'
    sings so that the returning humans see earth below and hear people announce spring,
    warm wind, and distant Thunders.
  language: English
  quote_policy: summarized
