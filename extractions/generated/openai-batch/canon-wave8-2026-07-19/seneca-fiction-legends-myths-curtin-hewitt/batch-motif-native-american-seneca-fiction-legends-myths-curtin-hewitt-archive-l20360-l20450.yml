canonical_text:
  quote: the breath of the West Wind had entered her person, causing conception
  summary: A woman who had been cast down from the upper world settles in a shelter
    and bears a daughter. The daughter conceives through the West Wind and bears twins,
    Othagwenda/Flint and Djuskaha/Little Sprout. The twins grow, shape the island
    and its beings, alter one another's creations, and finally fight, resulting in
    Othagwenda's death. A following story fragment begins with a mother directing
    two daughters to carry marriage bread to two brothers in a double lodge.
  language: English
  quote_policy: quoted
