canonical_text:
  quote: ''
  summary: A young man and his sister flee the Ganiagwaihegowa. Dream instruction
    and thrown objects create temporary world-spanning barriers. They then pass through
    a dead forest and receive aid from successive uncle figures, while the pursuing
    monster overcomes obstacles and kills old men before the siblings are sent onward
    to their grandfather.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man overtakes his sister while they are fleeing; the sister becomes
    weak with fear when they hear the Ganiagwaihegowa roaring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman appears to the young man in a dream and tells him that he and his
    sister will not die and that he should use a stone with spoken words to defend
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man finds the dreamed stone in the morning and at noon throws it
    behind him, producing a ridge of rocks across the world that no living thing can
    climb over.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ganiagwaihegowa cannot cross the rock ridge, searches north and south
    for an end or opening, and by morning finds only a small stone in the way, which
    she grinds to powder in her mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young man throws a pigeon feather behind him, producing a high rampart
    of pigeon droppings; the pursuing bear cannot climb it and is nearly smothered
    trying to pass through it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: By morning the rampart of pigeon droppings is gone, leaving only a feather,
    which the monster chews to pieces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brother and sister enter a dead, leafless forest and find a lodge where
    their old uncle is chipping flints; the passage says he killed the forest with
    flint chips by witchcraft.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ganiagwaihegowa kills the flint-chipping old man after he denies seeing
    the fugitives, then finds their tracks and regrets killing him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another uncle sets three traps on the trail to delay the Ganiagwaihegowa;
    the monster is caught in each one and escapes after struggling.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the trap episode, the monster kills an old man with her teeth, finds
    the fugitives' tracks again, and says she is sorry she killed him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brother and sister reach a third uncle who is making a net, has closed
    matter-filled eyes and long upper eyelids, and finally hears them after the brother
    strikes him with a corn pounder.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The third uncle says he will help as far as he can but that their nearby grandfather
    can do more, and he tells them to run to him.
  category: speech
  evidence_refs:
  - ev:8
