canonical_text:
  quote: ''
  summary: 'Doonongaes and Tsodiqgwadon continue a world journey through several encounters:
    a provisioned but apparently empty village made by a Great Power, an attack by
    Stone Coats defeated with basswood weapons, a confrontation with Hinon at a high
    rock, a war-song episode among old men, and an encounter with Nanisheonon, who
    encourages the companions to strike and scold each other and to pursue people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doonongaes and his companion reach a village where no one is found, although
    smoke rises from every lodge smoke-hole.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsodiqgwadon says the village is kept for people traveling around the world
    so they may eat what they like, and says a Great Power in the Blue Sky made it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The companions enter a lodge and take meat in a bowl; Tsodiqgwadon laughs,
    becomes what Doonongaes was, and goes outside.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Doonongaes sees Stone Coats sitting around, sharpening chert knives, and they
    say they are going to kill him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsodiqgwadon tells Doonongaes that the Stone Coats are afraid of a basswood
    weapon, not of flint.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Doonongaes makes a basswood knife and club; when the Stone Coats see them,
    they flee north, and he pursues and kills them all.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After killing the Stone Coats, Doonongaes says he can chase Tsodiqgwadon too,
    but when Tsodiqgwadon appears, Doonongaes says Tsodiqgwadon is his best friend.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a very high rock, Doonongaes changes into a buck, rubs his horns on the
    rock, and says he can kill Hinon; when Hinon comes out of the rock, Doonongaes
    says the rock-dweller is his best friend.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tsodiqgwadon warns Doonongaes to stop fooling everybody because he does not
    know what orenda other persons have.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a lodge of many old men singing a war song, Doonongaes assumes their form
    and sings a war song with different words.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old men call Doonongaes an enemy, seize flint knives, and run after him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Doonongaes becomes a snake; the old people run back, and Tsodiqgwadon tells
    him to leave them alone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A large man named Nanisheonon makes the companions strike each other, scold
    each other, and then tells them to pursue whatever people they see as they go
    around the world.
  category: sequence
  evidence_refs:
  - ev:8
