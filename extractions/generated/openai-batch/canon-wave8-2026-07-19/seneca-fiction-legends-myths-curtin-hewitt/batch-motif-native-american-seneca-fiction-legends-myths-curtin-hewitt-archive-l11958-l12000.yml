canonical_text:
  quote: "“My nephew has two ways of breathing.”"
  summary: A woman comes to the nephew’s room. The uncle detects her presence, calls
    her wild game, and goes out. The nephew warns his wife that the uncle is a man-eater
    who has killed previous women, supplies her with water, wood, and a vessel, and
    tells her not to go outside. After the nephew leaves, the uncle tries to force
    her out by commanding necessity and making her cooking water boil away, but she
    remains inside. The nephew returns, sees smoke from his part of the lodge, and
    thanks his wife for obeying. The uncle returns without prey and mutters that the
    nephew is hiding game.
  language: English
  quote_policy: quoted
