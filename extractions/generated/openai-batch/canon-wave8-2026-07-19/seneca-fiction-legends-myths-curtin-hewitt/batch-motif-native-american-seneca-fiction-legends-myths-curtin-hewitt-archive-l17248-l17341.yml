canonical_text:
  quote: ''
  summary: Okteondon is warned that his mother-in-law, Kahenchitahonk, will impose
    a severe ordeal by dreaming that he is killed, skinned, and made into a pouch.
    He instructs his wife to place the bowl containing his flesh on the lodge roof.
    The old witch kills and flays him, makes his skin into a pouch, hangs it over
    the fire, and the pouch flies out through the smoke-hole; Okteondon then appears
    alive. Okteondon later dreams that he must kill Ganiagwaihe and hold a feast.
    After cooking the creature, he has his wife and friends flee, traps the invited
    villagers in a lodge he makes stone and red-hot, and the people inside burn; owls
    and foxes spring from their bursting heads. The passage explains that sisters
    in a canoe had lured men to the village to be devoured. Okteondon, his wife, and
    friends then gather men's bones near a hickory tree and warn them to rise as the
    tree is pushed toward them.
  language: English
  quote_policy: summarized
