canonical_text:
  quote: ''
  summary: The band of Dehaenhyowens stays at an old woman's lodge. While walking,
    they find a spring forming a deep pool, and one member thrusts a bow into it.
    Men of the lodge later smell game on the bow, go to the pool, and kill an uncanny
    being there amid thunder-like noise and lightning. They report that the being
    was an Otkon, the Great Blue Lizard. The next morning the old woman consults about
    the time of year for making growing things mellow and moist, receives approval,
    and prepares by placing corn husks around a lake and setting them on fire before
    the men's accustomed journey.
  language: English
  quote_policy: summarized
