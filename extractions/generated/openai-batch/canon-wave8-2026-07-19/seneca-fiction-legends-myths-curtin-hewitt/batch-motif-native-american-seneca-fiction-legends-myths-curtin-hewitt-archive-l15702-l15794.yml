canonical_text:
  quote: ''
  summary: 'The passage first concludes a story in which a man recognizes his Moose
    wife, asks forgiveness, is accepted back, meets his daughter born during his absence,
    and remains faithful in the woods. It then gives an origin account for the Society
    of False Faces: travelers meet a S*hagodiyoweqgowa, who says Hawenniyo placed
    him there to help people and instructs them to make a mask like his asymmetrical
    face for curing those troubled by such beings. The next tale begins with a jealous
    stepmother abandoning her stepson in a sealed cave. A Mother Porcupine in the
    cave feeds and comforts him, later calls for help, and many birds and animals
    try unsuccessfully to move the stone; the passage ends as the she-bear, who has
    been waiting nearby with her cubs, begins to speak.'
  language: English
  quote_policy: summarized
