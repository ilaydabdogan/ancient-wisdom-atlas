- id: obs:1
  text: The chief assembles the people, brings the two strangers to the gathering,
    and says that the strangers have messages from an unknown place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people do not recognize the young men and are surprised because they believe
