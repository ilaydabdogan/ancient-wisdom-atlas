canonical_text:
  quote: ''
  summary: Two transformed young men reveal to an assembled people that they are the
    despised youths who disappeared, report journeys to other worlds and a meeting
    with Hawenniyo, teach moral duties toward orphaned children, institute Green Corn
    dances and rules, and travel among villages teaching righteousness and justice.
    Later, while journeying south of a hemlock tree and hunting from a camp, the Speaker
    follows a youthful stranger down a cliff to a hidden rock lodge, where an old
    man warns that Ganiagwaihegowa is pursuing the Speaker's companion and will come
    to devour them.
  language: English
  quote_policy: summarized
