  text: An old woman states that two despised and shunned young men disappeared and
    have not been seen since.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: One transformed young man says that they are the two who disappeared, that
    they traveled to the other world and the southern world, and that a guide returned
    with them to their starting place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young men rebuke the people for leaving them alone and desolate and ask
    whether homeless children should continue to be deserted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One companion states a rule that poor families' children should not be forsaken
    when the parents die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men tell the assembly that they visited the Long Lodge, saw Hawenniyo,
    and were directed to describe what they saw to friends in the lower world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The men instruct the people to learn the Green Corn dances that Hawenniyo
    wishes his children to know; one young man is to sing songs heard in the upper
    world, and the other is to teach the dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The second transformed young man is named Hadent'heni, the Speaker, and the
    first is named Hanigongendat^ha, the one who explains matters touching Hawenniyo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The transformed men say that what was done in the upper world should be done
    below; the people dance, adopt the rules, and their religion is formed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two young men continue traveling through many villages, speak to the people,
    and say they have spoken righteousness and justice to all the tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After returning to their birthplace, the two young men set out southward,
    specifically south of the hemlock tree, after visiting the people north of it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the southern journey they decide that their food will be game, build a
