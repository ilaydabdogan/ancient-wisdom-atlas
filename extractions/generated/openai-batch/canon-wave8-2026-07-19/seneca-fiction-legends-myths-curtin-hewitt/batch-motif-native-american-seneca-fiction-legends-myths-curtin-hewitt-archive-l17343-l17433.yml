canonical_text:
  quote: ''
  summary: 'Okteondon uses magic power to make bones become living men and sends them
    home. He then returns with his wife and two friends to his uncle Haient''hwus,
    who had monitored his condition through a wampum belt and tests the visitor before
    recognizing him. A second version begins: Okteondon lives with Haient''hwus near
    a tall elm whose roots bind Okteondon to the ground. Haient''hwus feeds and cares
    for him. Twice, while away at work, Haient''hwus hears Okteondon sing that he
    is rising, runs home, loses carried materials, gives the thirsty Okteondon water,
    and straightens the leaning tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: By Okteondon's orenda, bones sprang up as living men, and he told them they
    could go to their homes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Okteondon went with his wife and two friends to the lodge of his uncle Haient'hwus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Haient'hwus had hung a wampum belt in the lodge and stated that it would hang
    lower as Okteondon's trouble deepened and touch the ground if he died.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The belt had touched the ground, so Haient'hwus concluded that Okteondon was
    dead and mourned; at the time of the return it was hanging high again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Because pretenders had come claiming to be Okteondon, Haient'hwus tested the
    visitor by asking him to put his arm through the door opening and tying it before
    opening the door-flap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Haient'hwus recognized Okteondon, his wife, and two friends, expressed delight,
    and cleaned inside the lodge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second version, Okteondon lived with Haient'hwus in the forest beside
    a large, tall elm tree, and the tree's roots grew over and around his body, binding
    him to the ground.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Haient'hwus regularly brought Okteondon foods and drinks and performed notably
    strong work with corn, firewood, and gathering.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: While planting seeds, Haient'hwus heard Okteondon sing that he was going to
    rise, rushed home, lost the seeds along the trail, found Okteondon resting on
    one elbow and the tree leaning with roots starting from the ground, gave him water,
    and pushed the tree upright.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: While stripping slippery-elm bark for cords, Haient'hwus again heard Okteondon
    sing that he was rising, rushed home, lost the bark bundle, found Okteondon and
    the tree in the same condition, gave him water, and straightened the tree.
  category: sequence
  evidence_refs:
  - ev:9
