canonical_text:
  quote: ''
  summary: Hadjowiski's wife follows him and discovers another woman in a lodge. She
    leaves home in a panther-skin robe; Hadjowiski follows her westward but is killed
    after an old man sends him away in a living flint canoe. Hadjowiski's sons then
    disappear one by one until only Deoyadastat'he remains. He hears his mother crying
    in the far west, flies there with his flea-dog companion, finds shelter with an
    old grandmother, and learns that a woman, apparently his mother, is to be tortured
    while people gather wampum from her tears.
  language: English
  quote_policy: summarized
