  text: The two men bring the pouch to the place where Doonongaes lies, and Skahnowa
    says the remains show that he is dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two men seeking their grandfather mistake a small lake for the end of the
    earth and repeatedly go around the lake, encountering their own tracks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One traveler says something is in his foot and stops; the other continues
    around the lake and later meets him again while still thinking he has stayed on
    the trail.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The travelers watch the sun, take a straight course from the lake, reach the
    limit of the land, and see a clearing, smoke, and a lodge.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: An old man inside the lodge calls the travelers his grandsons, asks why they
    stay outside, and knows they have a message; the travelers wonder how he saw them
    while his back was turned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The travelers say their people are assembled in a condoling council because
    their chief has fallen and they want to make him alive again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old man, identified as one of the Oanos or Spring-frog people, brings
    from a hole in the ground a white flint in the form of a canoe containing black
    paint and medicine powder.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old man instructs them to color their faces, paint the dead chief's face,
    place powder on the wound edges, wash his face with cold water, blow on him, and
    then give him powder mixed in water to drink after he opens his eyes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The travelers return quickly in the boat to Broken Land and explain that the
    lake hindered them; the new chief says few people escape that lake because it
    puts men out of their minds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A later pair of men come to an opening in the trail with people sitting around,
    pass unharmed, enter a hollow tree for the night, and are addressed by a rapping
    unseen speaker who asks about the Ganiagwaihegowa.
  category: sequence
  evidence_refs:
  - ev:6
