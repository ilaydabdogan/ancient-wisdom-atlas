canonical_text:
  quote: ''
  summary: Skahnowa is directed to Broken Land to view Doonongaes's body while two
    men recover a pouch from Doonongaes's lodge. Another pair of men seek their grandfather,
    are delayed by a mind-confusing lake, then reach an old Oanos man at a lodge near
    the limit of the land. The old man gives a white flint canoe containing black
    paint and medicine powder and instructs them how to revive their fallen chief
    with paint, powder, cold water, breath, and a drink. They return by boat to Broken
    Land, and a new chief identifies the lake as a delirium-making lake. A later pair
    of travelers encounter an opening, shelter in a hollow tree, and are addressed
    by an unseen speaker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skahnowa is told that the body is at Broken Land, where the laughing man lives,
    and he says he will go to see whether the man is dead.
  category: speech
  evidence_refs:
  - ev:1
