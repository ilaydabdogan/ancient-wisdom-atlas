canonical_text:
  quote: ''
  summary: The passage recounts a return to Mother Bean's lodge, where beans are given
    to be carried to a distant land already associated with seed corn. An unnamed
    maiden sings for a husband beside a planted field, rejects Wolf, Bear, and Deer
    because their foods would kill her, and accepts a man named Corn because corn
    will be her sustenance. She says her grandmother appointed her to care for mankind,
    that she and Corn will be planted together and provide food, and that they must
    teach mankind harvest songs and dances. The passage then gives instructions and
    song themes for the Corn dance ceremony and begins a following tradition in which
    people near a river hear the Bean-Woman singing downstream.
  language: English
  quote_policy: summarized
