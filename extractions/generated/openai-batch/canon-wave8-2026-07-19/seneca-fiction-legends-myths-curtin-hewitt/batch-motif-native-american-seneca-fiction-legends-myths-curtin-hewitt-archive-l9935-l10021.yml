canonical_text:
  quote: ''
  summary: Gaasyendiet'ha threatens and attacks Ganyadjigowa, throws him west through
    the air, and later causes him to become S'hodieonskon. Ganyadjigowa travels north,
    meets Djothowandon and Dagwanoenyent at a lodge on a great rock, and hears of
    a servant sent to quiet churlish people at the southern end of the earth. After
    Ganyadjigowa is killed by Dahdahwat, Djoniaik revives him with powdered roots.
    Ganyadjigowa then returns to Dagwanoenyent, claims that S'hodieonskon soon comes
    to life after dying, and is sent toward the churlish people.
  language: English
  quote_policy: summarized
