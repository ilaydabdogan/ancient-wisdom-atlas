canonical_text:
  quote: ''
  summary: Hat'hondas continues along a trail, eventually stays with a stranger, and
    is robbed of his magical garments after the mantle changes into a panther. The
    stranger injures him by thrusting hickory bark down his backbone and goes to claim
    the eagle-shooting prize. Hat'hondas, made decrepit, reaches his sister and niece,
    provides food by shooting birds, and is healed when the bark is removed. From
    his sister's lodge he shoots the eagle at a distant hickory tree, but the stranger
    steals the fallen eagle and claims the youngest daughter. The daughter rejects
    him as the wrong man, while the great woman enforces her promise; the stolen magical
    items appear weakened, and the impostor fails a thaumaturgic test. An uncle at
    home reads the red sky as a sign of Hat'hondas's danger and later partial relief.
  language: English
  quote_policy: summarized
