canonical_text:
  quote: ''
  summary: 'The passage first concludes a cold-weather contest in which a man uses
    fire and boiling hemlock tea through the night until Hot''ho, identified as the
    god of cold weather, concedes at dawn and the thaw begins. It then begins a tale
    of S''hagodiyoweqgowa and his three brothers: three younger brothers unsuccessfully
    court Turtle''s sister; S''hagodiyoweqgowa then tries to take her by force, but
    Turtle bites him, grows larger when struck, swallows him, and later flees with
    his sister before S''hagodiyoweqgowa recovers and pursues them.'
  language: English
  quote_policy: summarized
