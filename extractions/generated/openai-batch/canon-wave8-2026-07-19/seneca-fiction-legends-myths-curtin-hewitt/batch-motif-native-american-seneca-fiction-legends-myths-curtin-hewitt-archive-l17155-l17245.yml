canonical_text:
  quote: ''
  summary: Okteondon brings a bird to the lodge, cooks it, and summons Dagwanoenyents
    to an eat-all feast where everything is consumed. The witch Kahenchitahonk attacks
    the guests and later dreams that Okteondon must kill White Beaver and return before
    the door-flap stops swinging. Okteondon uses a string made from his wife's hair
    so she can keep the flap moving, challenges beings in a lake with a butternut,
    shoots White Beaver when the water rises, returns with it, cooks it, and summons
    the Dagwanoenyents to another eat-all feast.
  language: English
  quote_policy: summarized
