canonical_text:
  quote: ''
  summary: Doonongaes encounters armed boys and throws them over a precipice. A laughing,
    elusive man taunts him, evades him around cliffs and trees, and kills him while
    he sleeps. Doonongaes's blood runs down to his people below, who climb to the
    top, find their great chief dead, and organize efforts using orenda, fire, a white
    pebble, a fisher-skin pouch, distant helpers, and pursuit of the killer. The passage
    then follows two messengers to a lake where Skahnowa challenges them over fish
    and claims to watch the lake for Doonongaes.
  language: English
  quote_policy: summarized
