canonical_text:
  quote: ''
  summary: A hunter kills a she-bear and discovers that one apparent cub is a human
    boy who says he was abandoned as an infant and raised by the bear. The hunter
    adopts the boy, who later helps him find male bears while avoiding female bears.
    The boy rejects his biological mother when she tries to reclaim him, returns to
    the hunting lodge, and receives a younger playmate. The two boys later see a westward-moving
    body of land with animals on it, including a coon that wards off their arrow.
    The hunter finally brings home a bear for the boys to help kill; they torment
    and kill it, and he approves.
  language: English
  quote_policy: summarized
