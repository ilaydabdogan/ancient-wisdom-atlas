canonical_text:
  quote: ''
  summary: The passage closes an episode in which Dagwanoenyentgowa summons Dagwanoenyent
    relatives, uses fire and tobacco at a dead Genonsgwa's head, and the missing granddaughter
    comes out of the Genonsgwa's belly. A later Genonsgwa threat leads the Dagwanoenyents
    to arm themselves with stones, attack vast numbers of Genonsgwa, drive them from
    a mountain into a ravine and river, and create a lake identified as the grave
    of the Genonsgwa people. The next tale begins with a destitute old woman whose
    daughters are gone or dead; she finds a naked baby crawling from the grave of
    her dead daughter, not knowing the daughter had been pregnant.
  language: English
  quote_policy: summarized
