  text: The granddaughter does not appear until after Dagwanoenyentgowa summons relatives
    and they perform actions around the dead Genonsgwa's body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dagwanoenyent relatives remove and discard the dead Genonsgwa's clothing,
    build a fire at its head, burn tobacco, and each circles the fire while throwing
    tobacco into it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young girl starts up in the Genonsgwa's belly, walks out panting, asks
    how long she has been there, and inhales tobacco smoke until she regains full
    strength.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Genonsgwa visitor comes to the lodge, learns that only three people are
    there, and returns home thinking they will be easy to kill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dagwanoenyentgowa warns her grandchildren that many Genonsgwa are allied against
    them, calls Dagwanoenyent relations, and sixty Dagwanoenyents arrive besides the
    old woman and her two grandchildren.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dagwanoenyentgowa instructs each person to carry a stone of manageable weight
    and to trust that each Genonsgwa can be killed with one blow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Dagwanoenyents retreat in different directions while striking and killing
    Genonsgwa, then follow the old woman's plan to move toward a high southern mountain.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: At the mountain, the Dagwanoenyents attack from east and west, join behind
    the Genonsgwa, uproot trees, sweep earth from the mountain top, and hurl rocks,
    trees, and Genonsgwa into the ravine and river below.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Afterward the Dagwanoenyents blow additional trees, stones, and earth into
    the ravine; the river piles the debris into a dam, making a lake called the grave
    of the Genonsgwa people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the following tale, a very poor old woman lives in the woods, has seven
    daughters, loses six to hostile people, and the seventh dies.
  category: setting
  evidence_refs:
  - ev:5
