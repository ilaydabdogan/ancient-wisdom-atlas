canonical_text:
  quote: ''
  summary: Two young men, guided through an otherworldly settlement, are told they
    cannot enter their dead relatives’ lodge because they have not died. They visit
    Hawenniyo’s Long Lodge, observe praise and a Green Corn dance, and learn that
    good people come there after death. Returning by way of the Sun’s lodge, they
    learn that ten days in that place equal ten years below. The Sun escorts them
    back to the trail’s hemlock-tree beginning, renews their moss-covered bows and
    arrows, and directs them to their relocated people. The young men confirm their
    disappearance with elders, reveal that they have returned, and ask for an assembly
    so they can report what they saw.
  language: English
  quote_policy: summarized
