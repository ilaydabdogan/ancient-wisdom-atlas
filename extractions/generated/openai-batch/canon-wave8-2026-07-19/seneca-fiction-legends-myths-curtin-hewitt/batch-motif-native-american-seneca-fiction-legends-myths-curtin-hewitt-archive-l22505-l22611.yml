canonical_text:
  quote: ''
  summary: A youth later named Gajihsondis deceives a hanging dead woman’s skin that
    guards chestnuts by giving it a bark object represented as a wampum belt. After
    taking a bark case full of chestnuts, he is pursued by an old woman and her three
    daughters. He sings a song that makes them dance and rise into the air; after
    he stops singing and leaves, their bodies fall to the earth. He returns to his
    uncle’s lodge with the chestnuts.
  language: English
  quote_policy: summarized
