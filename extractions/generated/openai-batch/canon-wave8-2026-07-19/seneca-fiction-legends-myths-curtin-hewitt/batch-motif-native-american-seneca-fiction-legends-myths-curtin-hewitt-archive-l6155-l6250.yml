  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hinon invite the old man and the boy to a dance and say they will carry
    them along in the clouds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the council lodge, the Hinon dance and shake their heads so that lightning
    plays and flashes around the lodge, frightening the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Hinon leave the old man but take the boy with them; Seneca speakers say
    they hear the boy after great thunder, burn tobacco to him, and thank him and
    the Hinon for rain.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Yegondji tells her three grown daughters that she wants meat and wants two
    of them to marry Tagonsowes, son of the rich woman Doendjowens.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Yegondji prepares twenty-two cakes, dresses the girls' hair, paints their
