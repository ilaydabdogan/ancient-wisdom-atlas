canonical_text:
  quote: ''
  summary: 'A little boy uses his orenda and arrows to defeat three enemies of the
    Hinon: a tree-dwelling porcupine, a river sunfish that prevents access to water,
    and a giant sickness-bringing butterfly. The Hinon dance in a council lodge, producing
    lightning, and later take the boy with them; Seneca speakers say they hear his
    voice after thunder and burn tobacco to him in thanks for rain. The passage then
    begins a new story in which an old woman, Yegondji, prepares two daughters to
    travel with marriage bread to marry Tagonsowes, the hunter son of Doendjowens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little boy goes down into the ground beneath the porcupine's tree, shoots
    arrows into the porcupine, and hides underground when the porcupine shoots quills
    in every direction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the porcupine dies, the Hinon and the old man cut it open, save its
    quills, eat its flesh, and wonder at the boy's orenda.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Hinon says a great and terrible sunfish lives in the river, prevents people
    from coming near for water, devours things, and catches birds flying over the
    river.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy shoots the sunfish under a fallen tree trunk in the river; the sunfish
    dies, and the Hinon pull it to land, take it to Old Hinon's lodge, and feast on
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Old Hinon says an enormous butterfly as big as a cloud passes over, carries
