canonical_text:
  quote: ''
  summary: The passage contains the close of a tale in which a young hunter keeps
    an animate finger after causing a Genonsgwa woman to fall into a stream, followed
    by a tale explaining chipmunk stripes through scratches from an animate bear-skin,
    a tale in which a wife becomes a snake after eating fish and drinking water, fights
    a lake serpent, and is briefly replaced by a dream-directed basswood woman, and
    the opening of a Crow tale in which Gaqga steals meat from hunters.
  language: English
