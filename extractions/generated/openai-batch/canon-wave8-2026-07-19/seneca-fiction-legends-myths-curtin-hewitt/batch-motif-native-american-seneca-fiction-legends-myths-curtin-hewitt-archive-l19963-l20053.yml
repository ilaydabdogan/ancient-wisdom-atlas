canonical_text:
  quote: ''
  summary: The passage concludes a story in which Gadata follows a hunter, resists
    Djogeon's nighttime teasing and attempted seduction, marries the hunter, and the
    hunter later steals and returns Djogeon's tiny baby, receiving a tiny arrow that
    brings good fortune. It then begins a second story in which a hunter with his
    wife and child camps in the woods, obtains much game, refuses hungry hunters meat,
    and the wife feeds Genonsgwa, who later seems to threaten the camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Djogeon approaches the sleeping Gadata, tells her the man she seeks is nearby,
    shakes and teases her, and tries unsuccessfully to seduce her before leaving at
    daylight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gadata finds the hunter's camp, explains that her grandmother told her to
    try to become his wife, is welcomed by him, and after their union his hunting
    luck is described as very good.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunter enters a small lodge, is fed green-corn hominy by a small woman,
    sees a tiny baby, takes the baby into his bosom, and runs away while the woman
    pursues him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the baby is taken, a tempest arises, with wind twisting trees, uprooting
    them, and sending them through the air.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small man identified as Djogeon tells the hunter that he stole his baby;
    after the hunter returns it, Djogeon gives him a tiny arrow promised to bring
    success in hunting, warfare, and other undertakings, and the tempest ceases.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the next story, a man, his wife, and their child go to the woods to hunt;
    they build a fire, the man hunts along a stream, and they accumulate dried venison
    and bear meat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The man dreams of nearby hunters who cannot kill game, later meets them, and
    refuses their request for meat or food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: While the wife is away for wood, a large naked woman sits by the child's swinging
    cradle, asks for meat, eats raw venison, says she will return, and identifies
    herself as Genonsgwa.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At night the dogs bark and become frightened; the husband says Genonsgwa may
    come to kill them, the wife chooses to stay with him, and he hears bushes breaking
    and wind blowing down the smoke-hole.
  category: sequence
  evidence_refs:
  - ev:8
