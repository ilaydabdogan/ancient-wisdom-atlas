canonical_text:
  quote: ''
  summary: The Moon, encountered in her lodge, explains her light-making duty and
    warns two young men to stay on a dangerous path without heeding distractions.
    The young men pass speaking fruit, enchanted food, game, and animals, then reach
    a lodge where an uncle-like man transforms and purifies them by separating flesh
    from bones and reconstituting them. After both catch a deer as a readiness test,
    a conductor arrives to lead them rapidly toward a great assembly in the upper
    world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman identifies herself as the Moon, is in her lodge sewing skins,
    and says Hawenniyo ordered her to make light for people on earth at night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Moon warns the young men that the path ahead is dangerous and tells them
    not to look at or heed anything outside their path.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: As the young men travel, fruit and game appear; each fruit calls out to them
    to stop and eat, but the young men pay no heed because of the old woman's words.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first fruit is described as full of witchcraft or enchantment, while at
    a later place the young men eat plums and huckleberries and feel refreshed; animals
    along the path do not harm them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At another lodge, a man who calls himself their uncle says they cannot join
    the large upper-world assembly unless he transforms them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The first young man lies on a long strip of bark; the uncle blows through
    his hand onto the youth's head, separates bones and flesh into heaps, cleans the
    bones, and then blows on the skeleton so that it becomes a man again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second young man is reluctant but undergoes the same treatment; his body
    is harder to clean, more uncleanness is removed from him, and he is restored as
    a beautiful young man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Outside the lodge, the uncle tests each young man by telling him to catch
    a deer; both young men catch it and are declared ready for the people or assembly
    of this world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man approaches and says the young men's mission will be accomplished, that
    their Elder Brother wished them to come, and that he has been sent to conduct
    them to the great assembly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The approaching man says the person in charge of the assembly is also the
    one who made the lower world, and the group travels at incredible speed toward
    the sound of many voices.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
