canonical_text:
  quote: ''
  summary: A husband misuses a white wampum bowl, while Wildcat and Fox attempt to
    seize Turkey Brother and fail. The husband of the chief's youngest daughter obtains
    the chief's bow and arrows, kills many deer, and distributes the meat. During
    a council he recovers his stolen enchanted garments from the eldest daughter's
    husband, whose aged owl-like form is revealed. Wearing his restored garments,
    he displays powerful orenda, announces his return to his uncle in the far east,
    has Turkey Brother remove his turkey-skin robe, and leads the chief and people
    to his homeland, where they settle in peace.
  language: English
  quote_policy: summarized
