canonical_text:
  quote: ''
  summary: A young man traveling east is enticed by a young woman despite his grandfather's
    warning. She repeatedly puts him to sleep with stories, carries him in a bag through
    the air, and places him on a narrow mountain cliff among other deceived men whose
    flesh is being eaten without their dying. The young man calls on a Great Spider
    remembered from a protective dream; the spider weaves a rope by which he escapes
    and rescues other living men. He later seeks the deceiving woman, marries her
    after she says her mother commanded the cliff episode, and a later episode begins
    in which the mother-in-law feigns pain and is struck with a corn-pounding pestle.
  language: English
  quote_policy: summarized
