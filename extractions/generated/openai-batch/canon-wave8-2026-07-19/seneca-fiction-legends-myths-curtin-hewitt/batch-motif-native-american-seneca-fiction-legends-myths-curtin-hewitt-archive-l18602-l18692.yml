- id: obs:1
  text: The young man travels eastward, reaches a second tree full of raccoons, kills
    many, and sees again the woman who had accosted him at another tree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman urges him to come down and sit closer; although he recalls his grandfather's
    warning, he eventually descends and sits beside her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman tells stories of wonders and magic power until the young man falls
    asleep, puts him in a bag, carries him through the air, and later tests whether
    he recognizes a fishing place; the passage says he bewitches her eyes so that
    she believes him after seeing poles and an old kettle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman again puts him to sleep with stories, carries him in her bag, and
    sets him on a narrow cliff under a mountain with only enough room to lie down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: From the cliff the young man sees mountain peaks with bodies of men, including
    living, half-dead, half-eaten, and skeletal bodies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A living man on a nearby cliff says a woman deceived and brought him there,
    other women brought the other men, their flesh is being eaten from their bones
    without their dying, and the young man and speaker will be eaten later.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young man remembers a past dream in which a Great Spider promised to protect
    him in trouble, and he calls to the Great Spider for help.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An enormous spider as large as a man arrives, weaves web into a rope, suspends
    it from the mountain, and the young man climbs to the top and draws up the living
    men below.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young man later finds the deceiving woman living with her mother in an
    isolated old lodge, asks to marry her, and she says she carried him to the cliff
    in obedience to her mother's command; they become husband and wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: One night the old mother-in-law pretends to be in pain; her daughter tells
    the young man to strike her mother on the head with the corn-pounding pestle,
    and he does so.
  category: action
  evidence_refs:
  - ev:8
