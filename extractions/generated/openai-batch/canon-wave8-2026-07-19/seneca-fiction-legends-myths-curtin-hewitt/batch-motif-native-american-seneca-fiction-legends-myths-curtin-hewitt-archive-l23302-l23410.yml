canonical_text:
  quote: ''
  summary: A youth regains consciousness after an attack, returns stealthily to an
    old man's lodge, and leaves with the old man's war club, lodge possessions, and
    a small white deer that enters his bosom. The old man prepares for combat by pounding
    dead coals and painting his face, pursues the youth, and is killed by him. The
    youth returns to his living grandfather, who reveals that the dead old wizard
    was his brother and later shoots the sleeping youth with three arrows. The youth
    departs with the animated possessions, reaches a village, befriends a similar
    young man, and goes with him to the place of the great beast, where the village
    youth releases controlled animals to roam and multiply over the whole earth. The
    passage then begins a new legend about Honenhineh and his younger brothers dwelling
    in a long bark lodge with three fires.
  language: English
  quote_policy: summarized
