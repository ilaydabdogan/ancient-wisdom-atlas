canonical_text:
  quote: ''
  summary: Hodadenon spends successive nights in hollow trees, is warned of dangerous
    beings, kills a large Ganiagwaihe and a S'hagodiyoweqgowa with his arrow, retrieves
    the arrow from their bodies, crosses a lake inside an oak puffball, stays with
    a poor widow and her grandson, kills a bear for their household, helps create
    an exchange of bear meat for corn bread, and is then summoned by a herald to a
    Long Lodge associated with a man whose eyes shed wampum.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon looks for hollow trees in which to spend the night on two successive
    evenings.
  category: setting
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: A stranger comes to the hollow tree and asks what Hodadenon would do if a
    dangerous being came to eat or kill him; Hodadenon replies that he would have
    fun or sport with it.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: A very large Ganiagwaihe comes to the tree; Hodadenon shoots it in the neck,
    later follows a trail of uprooted trees to its dead body, removes his arrow, and
    leaves the carcass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A very large S'hagodiyoweqgowa comes to the second hollow tree; Hodadenon
    shoots it with his magic arrow, later finds it dead, notes its terrifying face,
    removes the arrow, and continues on his way.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hodadenon reaches a great lake with a village on the far side, enters an oak
    puffball placed at the water's edge, and causes wind to blow it across the lake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the village, Hodadenon goes to the last lodge, where an old widow named
    Yeqsinye and her grandson live; he asks to stay overnight and says he does not
    want food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hodadenon and the grandson go hunting, find a hollow tree frequented by a
    bear, call the bear out, kill it with an arrow, and carry the carcass home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The widow's household cooks bear meat and broth; a young girl eats with them
    and receives meat to take to her mother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The girl's mother sends corn bread in exchange for meat, and Hodadenon says
    others may trade corn bread for meat because corn bread is what the household
    wants.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A herald named Hadyuswus comes to the doorway and announces a summons to the
    Long Lodge, where a man sheds wampum instead of tears and fallen wampum may be
    gathered.
  category: speech
  evidence_refs:
  - ev:9
