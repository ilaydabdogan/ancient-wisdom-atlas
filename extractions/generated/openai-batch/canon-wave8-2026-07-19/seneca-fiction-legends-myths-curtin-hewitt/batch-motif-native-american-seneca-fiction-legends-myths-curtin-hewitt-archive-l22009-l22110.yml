canonical_text:
  quote: ''
  summary: A younger brother, Hayanowe, returns dejected to his elder brother after
    a strange man challenges him to a two-day foot race because he has repeatedly
    claimed to be swift of foot. The elder brother laments that the younger brother
    ignored warnings against such boasting and fears the challenger may not be human.
    The younger brother prepares with two pairs of moccasins and parched corn. At
    midday he meets the strange man, chooses to run east toward the sunrise, and begins
    the race. The challenger remains close behind, urging him on. At night they camp
    separately, kindle fires, and the youth sees the stranger’s fire nearby. Unable
    to sleep, he plans to choose deep thickets to slow his opponent, and the next
    morning both resume the race.
  language: English
  quote_policy: summarized
