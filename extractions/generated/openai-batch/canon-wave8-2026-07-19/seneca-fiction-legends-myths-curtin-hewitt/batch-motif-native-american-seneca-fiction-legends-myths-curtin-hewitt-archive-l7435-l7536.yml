canonical_text:
  quote: ''
  summary: A young hunter living with his uncle marries a woman who arrives with customary
    marriage bread. While hunting, he is repeatedly approached by a woman who uses
    magic power to put him asleep and carry him in a basket to dangerous rock-and-water
    places. He escapes once by becoming a bass, later survives on a rock ledge, shoots
    a fisherman, grows a hemlock tree from a leaf to rescue other men, and grows berries
    from a strawberry leaf to feed them. The men confront a woman near a lodge, bind
    her to an adult-size board, and place her near a fire, but the hunter's wife frees
    her and crosses a lake on bloodsuckers. The excerpt then begins a separate tale
    about a hunter with two strong dogs.
  language: English
  quote_policy: summarized
