canonical_text:
  quote: ''
  summary: Hahadodagwat'ha cannot make a clinging stranger get off his back, fails
    to scrape him off against a hickory tree, and fails to burn him off with a hot
    fire. Remembering a small black dog in his bosom, he cuts a red-willow rod and
    strikes the dog until it grows very large. At his command the dog tears the clinging
    man from his back and saves him. Hahadodagwat'ha and the dog travel home, hunt
    and eat together, and arrive at a lodge where the dog is recognized as a returned
    lost brother. The group agrees to live as one family. The passage then begins
    the next story, about a boy who hunts birds.
  language: English
  quote_policy: summarized
