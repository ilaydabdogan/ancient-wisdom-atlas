canonical_text:
  quote: ''
  summary: Doonongaes accepts an old man's head-wager foot race, secretly copies the
    old man's use of a milk-like fluid from a lizard-shaped living object, wins the
    race, and beheads him. Continuing north, he repeatedly changes into a long horned
    snake to travel, hide from Hinon, cross water, and later fight. He pursues a woman,
    Ganos, to a lodge where her Cyclone grandfather tries to kill and cook him as
    game. After a chase in which the old man heals knife wounds with spittle, Doonongaes
    becomes a snake, tears him apart, and turns his body into birds. He lives with
    Ganos for a month, resumes his northward journey, and reaches the cold edge of
    the earth, where another old white-haired man is introduced.
  language: English
  quote_policy: summarized
