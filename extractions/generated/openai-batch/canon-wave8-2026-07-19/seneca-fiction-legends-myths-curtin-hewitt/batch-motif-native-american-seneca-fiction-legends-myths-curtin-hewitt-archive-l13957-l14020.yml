canonical_text:
  quote: ''
  summary: Doonongaes and Tsodiqgwadon travel east and meet two men tracking the Laughing
    Man for killing their chief, Doonongaes. Doonongaes reveals that S'hodieonskon
    returns to life after death and tells the trackers to stop. The travelers later
    encounter an old woman in a lodge; Doonongaes frightens and drags her out but
    leaves her after Tsodiqgwadon advises restraint. The passage then describes the
    pair as magically powerful shape-changers, and Tsodiqgwadon removes a flint knife
    from Doonongaes's sore neck, curing him of a bewitchment associated with a lodge.
  language: English
  quote_policy: summarized
