canonical_text:
  quote: ''
  summary: A youth asks his grandfather for directions to a dangerous spring and lair.
    The grandfather warns that the path shrinks back and that flesh-eating beings
    live there. At the spring the youth loses both legs to a scaled being, then uses
    his own flesh as bait to catch two powerful beings, compels them to restore his
    legs, and burns them, after which owls fly from their heads. He then stops fighting
    panthers and elk, enters a long lodge with owls on top, sees an old man resembling
    his grandfather and a white deer entering that old man, and leaves as objects
    in the lodge depart. The old man pursues him, strikes him unconscious with a club,
    returns home, and restores what the youth disturbed.
  language: English
  quote_policy: summarized
