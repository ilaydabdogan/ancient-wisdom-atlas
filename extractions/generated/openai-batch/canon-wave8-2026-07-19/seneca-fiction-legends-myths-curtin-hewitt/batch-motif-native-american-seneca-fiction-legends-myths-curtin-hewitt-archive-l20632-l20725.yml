canonical_text:
  quote: ''
  summary: A hunter remains with a young woman as her husband and encounters her troublesome
    grandmother. The grandmother beats the granddaughter, tries to smother the husband
    under an airtight skin, and later abandons him on an island where water rises
    at night and monsters wait to devour him. The hunter survives through a hidden
    false face fetish and by appealing to the Morning Star, who had promised him aid
    in a dream. Daylight comes, the waters subside, and the hunter hides in sand,
    steals the canoe, and escapes. The old woman is then trapped on the island as
    the waters rise and appeals to the Morning Star.
  language: English
  quote_policy: summarized
