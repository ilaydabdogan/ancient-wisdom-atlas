canonical_text:
  quote: ''
  summary: An old uncle tells his nephew that he can hunt game because he is not susceptible
    to evil orenda. The nephew hunts raccoons from claw-marked trees, carries them
    home with a forehead strap, and the household dresses, cooks, and eats them while
    the uncle gives thanks and plans a robe from the skins. Later, a mother tells
    her daughters to seek Doadanegen as a husband; the sisters prepare marriage bread,
    and the eldest daughter is groomed and sent with a basket of bread toward Doadanegen,
    with mention of a lake crossing. Some middle lines are OCR-corrupt, so only clear
    events are extracted.
  language: English
  quote_policy: summarized
