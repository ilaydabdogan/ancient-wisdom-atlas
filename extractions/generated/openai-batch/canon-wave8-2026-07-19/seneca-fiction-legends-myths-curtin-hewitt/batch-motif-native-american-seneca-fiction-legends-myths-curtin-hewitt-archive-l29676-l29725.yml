canonical_text:
  quote: ''
  summary: An embedded speech explains that humans may direct prayers through objects
    of creation and asks Bears and their allies to aid peace and healing. It gives
    procedures for a Bear ceremony involving sweetened berry drink, tobacco cast on
    fire, exsufflation, thanks to Bears, and unseen Bear aid. A strange man sings
    songs that a stolen child learns and brings back. The narrative then describes
    the child's mother and other searchers looking for the missing boy by the lodge,
    river, and forest, and the father proposing a reunion feast because the child
    seems to have died.
  language: English
  quote_policy: summarized
