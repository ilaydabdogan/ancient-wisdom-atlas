canonical_text:
  quote: ''
  summary: 'The passage concludes Hatcinondon''s return to his Seneca companions with
    three scalps, then gives several traditions about S''hagodiyoweqgowa: their healing
    arrangement with Godiont, punishment of a man who falsely summons them, instruction
    to make masks through which they will work, a tobacco-pact episode, and an Onondaga
    statement that they live in a cave and are represented by Iroquois False Faces.
    It then begins a Genonsgwa or Stone Coat Woman story in which a stone-dressed
    woman bites and restores a child and later helps hunters find game.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hatcinondon goes to a neighboring stream, makes a fire, dresses in garments
    taken from slain men, cooks and eats, and prepares and paints three scalps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next morning Hatcinondon travels in a great circle, finds the path by
    which his party came, and sees fresh tracks leading both ways.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hatcinondon sees smoke, listens for Seneca speech, displays three scalps on
    a stick, calls out three times, reunites with his friends, and returns home with
    them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Godiont is described as the principal woman in the village at Dedioitgeon,
    where the Seneca people lived.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: S'hagodiyoweqgowa tell Godiont that it would benefit her people if they settled
    permanently at Dedioitgeon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: When someone is sick, Godiont calls the S'hagodiyoweqgowa, prepares a pot
    of corn soup, and they come to the lodge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The S'hagodiyoweqgowa asperge the patient with ashes, blow on him, and then
    eat the corn pudding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The S'hagodiyoweqgowa instruct Godiont that whenever they are invited, the
    pot must already be ready because they do not wish to wait.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A man with little substance falsely invites the S'hagodiyoweqgowa; they find
    no patient and nothing ready, conclude they have been trifled with, and say the
    offender must die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The oldest S'hagodiyoweqgowa tells Godiont to make masks as near like their
    faces as possible, to let men wear them, and says they will work through the masks
    to help the people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man who trifled with the S'hagodiyoweqgowa runs to them in a crazy fit,
    falls down, vomits blood, and dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the man's death, the people know it is wrong to make fun of the S'hagodiyoweqgowa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In another episode, villagers see an enormous S'hagodiyoweqgowa approaching
    and prepare bows and arrows to shoot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The enormous S'hagodiyoweqgowa says arrows cannot kill him, says he has not
    come to harm them, and asks for voluntary contributions of tobacco.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The villagers give tobacco, and the S'hagodiyoweqgowa promises not to trouble
    them again if they set aside a portion of the tobacco harvest for him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The Onondaga say that S'hagodiyoweqgowa live in a cave among rocks near their
    reservation and that they have seen them entering the cave.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage states that S'hagodiyoweqgowa are represented by the so-called
    False Faces, or maskers, of the Iroquois.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: In the Genonsgwa story, three men are hunting; one married hunter has his
    wife and a small child swathed to a cradleboard with him.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: The mother returns to the lodge with water from a nearby stream and sees a
    woman dressed in stone holding and rocking the baby.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: The stone-dressed woman sings that the child is good eating, bites the child's
    cheek, then spits on her hand and rubs the cheek so that it becomes whole again.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:21
  text: The Stone Coat Woman tells the mother not to be afraid and later tells the
    returning hunters that she has come to help them in hunting.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:22
  text: The group lives together, and the hunters have good luck finding game and
    bringing home meat.
  category: sequence
  evidence_refs:
  - ev:10
