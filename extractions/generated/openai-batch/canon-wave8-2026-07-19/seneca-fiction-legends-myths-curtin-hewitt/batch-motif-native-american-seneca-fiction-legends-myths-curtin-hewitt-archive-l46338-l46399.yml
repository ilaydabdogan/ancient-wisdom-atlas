canonical_text:
  quote: ''
  summary: 'Editorial notes explain episodes and cultural details associated with
    Hat''hondas: four successive spring bird sounds, women seeking him, an eagle-shooting
    test of orenda, precautions against spells, marriage proposal bread, name meanings,
    Dooehdanegen''s protective tutelage and counter-magic against a witch, and a brief
    comparative note about feasts for the names of the dead near Missilimakinak.'
  language: English
  quote_policy: summarized
