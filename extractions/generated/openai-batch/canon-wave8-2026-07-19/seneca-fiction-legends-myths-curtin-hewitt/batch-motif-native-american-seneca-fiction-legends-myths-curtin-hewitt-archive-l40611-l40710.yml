canonical_text:
  quote: ''
  summary: A young woman repeatedly has Doadanegen rest with his head in her lap,
    after which he falls into deep sleep; she wraps him in a bag and carries him to
    the lodge of her mother and sisters. Doadanegen's younger wife learns that distant
    women have taken him, follows his trail while singing a search song, reaches the
    lodge, and finds him being tortured with fire so that his tears become wampum
    beads collected by the old woman. The wife pulls him out, calls her guardian beings,
    described as small humming birds, and the lodge is sealed, made red hot, and burned
    with the mother and daughters trapped inside.
  language: English
  quote_policy: summarized
