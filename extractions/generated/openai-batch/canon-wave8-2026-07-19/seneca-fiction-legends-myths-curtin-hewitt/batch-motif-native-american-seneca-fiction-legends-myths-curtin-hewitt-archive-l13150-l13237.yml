canonical_text:
  quote: ''
  summary: Doonongaes returns claiming to have come back to life, but Skahnowa doubts
    he is the dead master and tests him with a bear-meat errand. Doonongaes fails
    the test, is expelled, returns to take the lodge, and fights Skahnowa for a month
    because their magical strength is equal. A dream warns Doonongaes that people
    of magic power are stirred up and tells him to seek Tsodiqgwadon before sunrise.
    At Tsodiqgwadon's lodge, two visitors, one called Dagwanoenycnt and another called
    Niagwaihe, come looking for Doonongaes, but Tsodiqgwadon denies seeing him and
    drives them away.
  language: English
  quote_policy: summarized
