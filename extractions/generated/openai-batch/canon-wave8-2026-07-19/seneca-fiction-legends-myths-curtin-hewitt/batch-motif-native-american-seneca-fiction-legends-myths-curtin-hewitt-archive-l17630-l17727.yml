canonical_text:
  quote: ''
  summary: 'The passage closes one narrative: a grieving uncle is repeatedly deceived
    by animal-form visitors, while his nephew completes a mother-in-law''s dream-command
    by killing a magical black eagle, destroys the hostile women by fire, rescues
    related men, and returns to be recognized by his uncle. It then begins another
    narrative about Hadjowiski, his hungry family, the tiny child Deoyadastat''he
    with a flea-dog, and the wife''s suspicion that Hadjowiski is secretly killing
    game.'
  language: English
  quote_policy: summarized
