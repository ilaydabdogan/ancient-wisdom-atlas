candidate_motifs:
- id: motif:1
  label: mourning with ashes by the fire
  taxonomy_refs: []
  basis: The uncle mourns the believed-dead nephew by dropping ashes on his face while
    sitting before the evening fire.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a mourning action but does not explicitly explain its
    ritual meaning.
- id: motif:2
  label: animal-form deception at the threshold
  taxonomy_refs:
  - shapeshifter
  basis: Apparent nighttime returns at the door turn out to be fox or owl visitors,
    and the uncle later describes previous deceivers as wizards in animal form.
  evidence_refs:
  - ev:2
  - ev:11
  confidence: medium
  cautions: The passage links animal forms with wizards only later; it does not explicitly
    identify each fox or owl visitor individually.
- id: motif:3
  label: time-constrained task managed by keeping the door moving
  taxonomy_refs: []
  basis: The youth is warned that return after the door stops swinging will bring
    a strange event, so he ties a hair to the door while completing the eagle-killing
    task.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage presents
    the task literally without naming an initiation or test type.
- id: motif:4
  label: magical bird on a tree killed by a second shot
  taxonomy_refs: []
  basis: The black eagle sits at the top of a great tree; its magic power repels the
    first arrow, but the second arrow kills it.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The tree is prominent, but the passage does not mark it as a cosmic or
    sacred axis.
- id: motif:5
  label: revenge by fiery enclosure and burning at a tree
  taxonomy_refs: []
  basis: The youth burns the old woman and daughters in a white-hot flint lodge, then
    the men bind the daughter or wife to bark and burn her with piled fuel.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The fire is punitive and local; the passage does not support a world-destroying
    or divine-judgment classification.
- id: motif:6
  label: return of the presumed-dead kinsman
  taxonomy_refs:
  - return
  basis: The uncle believes the nephew dead and mourns him, but the nephew returns
    with his brothers and is recognized after a test.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not state that the nephew was literally dead, only that
    the uncle believed he was dead.
- id: motif:7
  label: hidden diminutive child with tiny animal companion
  taxonomy_refs: []
  basis: Deoyadastat'he is very small, never leaves the lodge, stays under the bed,
    and plays with a flea described as his dog.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The supplied passage only introduces the child and does not yet show later
    miraculous action.
- id: motif:8
  label: secret hunting success uncovered by suspicious spouse
  taxonomy_refs: []
  basis: Hadjowiski claims poor hunting and lack of orenda, but his wife sees blood
    on his back, follows him, and observes him killing a bear with a small stone.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: The passage ends mid-action, so the consequences of the discovery are
    not included.
