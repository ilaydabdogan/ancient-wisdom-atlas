  text: The old woman warns that if the son-in-law returns after the slammed door
    stops swinging, something strange will happen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son-in-law ties a hair to the door, goes to the tall tree, and sees a
    black eagle at the very top.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first arrow is driven back by the eagle's magic power, while the second
    arrow strikes the eagle in the heart and brings it down.
  category: sequence
  evidence_refs:
  - ev:5
