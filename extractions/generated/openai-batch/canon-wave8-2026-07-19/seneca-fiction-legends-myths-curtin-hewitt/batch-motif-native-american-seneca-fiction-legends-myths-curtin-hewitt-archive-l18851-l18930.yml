canonical_text:
  quote: ''
  summary: The passage describes kinship assignments among Cherokee women and Ganon’s
    recognition by a son and woman, followed by contests between Cherokee, Seneca,
    and Seoqgwageonon people. A Seoqgwageonon challenger from the East initiates ball
    games and races with wagers; Cherokee lose first, Seneca win several games and
    a race, and Cherokee deliberately allow one long-race loss to avoid trouble. Later
    Seoqgwageonon challenge to combat; Cherokee are beaten, and Seneca later respond
    to a reported boast that a Seoqgwageonon fighter is a “double man” with two virile
    members. Guided by Cherokee, Seneca capture a Seoqgwageonon hunter, inspect him,
    and reject the boast. A further war challenge begins, but the excerpt breaks off
    during the Seneca journey.
  language: English
  quote_policy: summarized
