canonical_text:
  quote: ''
  summary: A young man attempts to escape from a young woman who is pursuing him.
    His elder brother removes a fishhook from his neck, hides him in an arrow, and
    shoots him away. The pursuer tracks him, but he repeatedly delays her by sending
    his moccasins ahead, transforming into a stump, creating a rock ridge from a stone,
    creating a pigeon roost from a feather, and using a double among bathers in a
    lake. A man called Nosgwais then offers further aid by carrying and throwing him
    with his enormously stretched legs.
  language: English
  quote_policy: summarized
