canonical_text:
  quote: ''
  summary: 'The passage concludes the story of Hat''hondas: kin recover his garments,
    a false husband is exposed, Hat''hondas marries the young woman, displays magical
    animal transformations and wealth production, hunts abundantly, and returns to
    his uncle with expandable venison after the uncle has been deceived by animal
    impersonators. The passage then begins the story of the Ohohwa people, describing
    a quarreling couple, a visitor, the husband''s jealousy and violence, his false
    hunting errand, and his pursuit of a swift Djohkwehyanih woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hat'hondas's niece visits the great witch woman, hears news about the marriage
    and the young woman's refusal to approach the designated husband, and reports
    it to her mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hat'hondas's sister enters the great witch woman's lodge while the strange
    man is asleep, takes the panther-skin coat and garments, thrusts hickory bark
    into the sleeping husband's back, and returns home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hat'hondas puts on his garments, takes his bow and arrows, and goes to the
    great witch woman's lodge, where the daughter recognizes him joyfully as the man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The designated husband does not appear by noon and is found on the couch doubled
    up, old, miserable, and coughing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: An arrow still in an eagle is unlike the old man's arrows but like those in
    Hat'hondas's quiver, so the people judge the old man to be a deceiver and throw
    him out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the marriage is proclaimed, the wife throws Hat'hondas's moccasins and
    garments onto a crossbeam; the moccasins become owls, the panther-skin coat becomes
    a panther, the leggings become wildcats, and the cap becomes an otter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When Hat'hondas opens his pouch, two girls and two pigeons emerge; the girls
    bring coals for a pipe, the pigeons perch on the pipe, and Hat'hondas's spittle
    falls as wampum beads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hat'hondas goes hunting and kills enough deer, bear, and elk for all the people,
    also sending a large supply to his sister.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For Hat'hondas's journey to his uncle, his sister compresses venison into
    a small pouch; striking a small portion later restores the meat to natural size.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: While Hat'hondas is away, animals torment his uncle by calling from the door
    as if the nephew has returned; when the uncle opens the flap, he finds a fox,
    rabbit, or other creature.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: To verify the return, the uncle cuts a hole in the door-flap, asks the visitor
    to put a hand through, ties the wrist to a fireplace pole, and prepares to strike
    before recognizing Hat'hondas.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: After Hat'hondas is admitted with his wife, the venison is increased by striking
    it on the ground and becomes so plentiful that a new storage lodge is needed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the start of the Ohohwa story, a husband and wife living in a forest lodge
    quarrel all night but are pleasant again in the morning.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:14
  text: A visitor comes to the Ohohwa lodge; the husband leaves when he sees the visitor,
    and the visitor departs saying he will return another time.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The jealous husband scolds and beats his wife over the visit; she fights in
    self-defense, and after he starts out to seek another wife, she follows him weeping
    until he returns with her.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: In the morning the husband says his dream spirit commanded him to kill a large
    bear and return before the dew leaves the grass, but after leaving sight of the
    lodge he spends the day at another Ohohwa woman's lodge.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: Toward evening the husband meets a fine-looking woman, asks to go home with
    her, and she says he may if he can overtake her; she then runs away quickly and
    is identified as Djohkwehyanih.
  category: sequence
  evidence_refs:
  - ev:16
