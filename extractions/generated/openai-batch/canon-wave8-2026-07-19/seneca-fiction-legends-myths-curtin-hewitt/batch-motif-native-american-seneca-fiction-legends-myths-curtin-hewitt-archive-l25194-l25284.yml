canonical_text:
  quote: ''
  summary: Two women with children stay in a lodge. The strange woman gathers fuel
    by carrying and breaking up a whole dead tree. She warns that her husband is trailing
    her, directs the hunter's wife to prepare three fire-hardened basswood poles,
    and fights him at the doorway. When he overpowers her, the hunter's wife uses
    the burning poles as instructed; the husband weakens, and the strange woman strangles
    him. She removes his body and leaves with her child for distant forest kin. Later,
    the hunter returns with his wife, and they travel home to his mother's lodge.
  language: English
  quote_policy: summarized
