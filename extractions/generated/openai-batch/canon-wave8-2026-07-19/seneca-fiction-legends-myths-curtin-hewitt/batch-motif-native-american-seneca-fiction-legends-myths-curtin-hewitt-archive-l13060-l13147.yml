canonical_text:
  quote: ''
  summary: Doonongaes challenges Has'honyot, who refuses to release captive women.
    After a failed attack with a reed called owl's arrow, Doonongaes recruits the
    Djihonsdonqgwen people from a mound lodge to attack Has'honyot and free the women.
    The women become Doonongaes's wives and bear children. Later Doonongaes climbs
    to Has'honyot's former high-rock dwelling, sees far across the earth, and confronts
    Tsodiqgwadon, a man killing people in the west. Doonongaes and Tsodiqgwadon test
    their orenda by commanding cliff rocks to fall; Tsodiqgwadon wins and claims every
    woman. Doonongaes relinquishes his wives and returns to Ganyodaes, where his servant
    Skahnowa has claimed the lodge because he believed his master dead.
  language: English
  quote_policy: summarized
