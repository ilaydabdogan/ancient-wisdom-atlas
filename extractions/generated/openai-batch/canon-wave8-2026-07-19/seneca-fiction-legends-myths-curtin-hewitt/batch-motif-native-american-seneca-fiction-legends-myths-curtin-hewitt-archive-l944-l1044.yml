canonical_text:
  quote: there was no thing then which was not a person
  summary: The introduction summarizes a mythic prior order in which nonhuman persons
    divide into good and bad camps. Good figures originate foods and institutions
    for humans, while harmful figures are overcome but not destroyed. Before the present
    human race appears, many former persons become animals, plants, objects, powers,
    and phenomena, while another party departs beyond the sky or westward beyond the
    setting sun to a painless, deathless place. The passage frames this as a New World
    creation-myth cycle and compares its primordial innocence to a widespread golden-age
    pattern.
  language: English
  quote_policy: quoted
