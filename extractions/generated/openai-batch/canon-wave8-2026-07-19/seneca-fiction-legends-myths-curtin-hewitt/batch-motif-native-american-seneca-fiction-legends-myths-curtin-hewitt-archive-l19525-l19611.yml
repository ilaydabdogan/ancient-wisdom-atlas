- id: obs:10
  text: The Genonsgwa eat the roasted boys completely, leaving no particle uneaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After eating, the Genonsgwa suffer terrible pain and groan through the night,
    saying there is some mystery about the game that made them sick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: By morning the two boys are born again, and both Genonsgwa have died from
    the pain of giving birth to them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: One boy says the Genonsgwa, whom he calls their uncles, were reputed to be
