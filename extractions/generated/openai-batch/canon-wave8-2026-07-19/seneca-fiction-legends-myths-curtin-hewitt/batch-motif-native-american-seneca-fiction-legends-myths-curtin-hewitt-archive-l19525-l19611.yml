canonical_text:
  quote: "“The two boys were born again, and both Genonsgwa had died...”"
  summary: Two boys ignore a warning not to go far from the lodge and ride a moving
    stream of dry land into a Genonsgwa lodge. They are killed, roasted, and eaten,
    but are born again through the Genonsgwa, who die from the birth. The younger
    boy then stops the moving land stream with red paint, declares that people should
    not eat people, and the lodge burns while the Genonsgwa burst.
  language: English
  quote_policy: quoted
