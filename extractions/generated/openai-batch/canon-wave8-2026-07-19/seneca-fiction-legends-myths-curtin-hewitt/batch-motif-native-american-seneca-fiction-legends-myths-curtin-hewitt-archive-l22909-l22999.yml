canonical_text:
  quote: ''
  summary: Ongwe' Hanges'ha' hunts deer with his brothers-in-law and brings venison
    and pelts to his mother-in-law's lodge. The mother-in-law thanks him by arranging
    the customary marriage feast called the feast of eat-all-up, at which invited
    neighbors eat all their portions as a good omen for the newly married couple.
    The following day Ongwe' Hanges'ha' asks that neighbors be gathered to watch him
    smoke and disgorge wampum beads. He sits on a block, displays a woman's skin with
    head and moving eyes, prepares a fragrant tobacco mixture, and instructs that
    wampum falling on a spread buckskin will belong to his mother-in-law while other
    wampum may be seized by the assembly.
  language: English
  quote_policy: summarized
