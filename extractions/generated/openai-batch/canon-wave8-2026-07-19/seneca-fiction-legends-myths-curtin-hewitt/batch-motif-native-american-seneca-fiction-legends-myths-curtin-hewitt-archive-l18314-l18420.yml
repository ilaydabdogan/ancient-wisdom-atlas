canonical_text:
  quote: ''
  summary: The passage first recounts how a young orphan appeases Dagwanoenyent with
    a horned owl, saving a mother panther and her cubs; the grateful panther directs
    him to deer, enabling him to feed his starving wife and later her starving brothers,
    after which the family prospers. The passage then begins a separate tale in which
    a boy repeatedly feeds a large many-colored worm, which grows from a tree-dwelling
    creature into a huge monster that consumes birds, rabbits, and anything within
    reach.
  language: English
  quote_policy: summarized
