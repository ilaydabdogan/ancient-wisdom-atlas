canonical_text:
  quote: ''
  summary: Two brothers are together in a lodge. The younger brother, associated with
    a turkey-skin robe and later called Turkey Brother, warns the elder that a dangerous
    woman is coming. He appears as or acts like a turkey to deceive her. The woman
    takes the elder brother westward despite the warning. Turkey Brother follows,
    later travels to the western lodge, observes from a gable perch, tells his brother
    that the women are starving and planning to kill him, and promises to take him
    away.
  language: English
  quote_policy: summarized
