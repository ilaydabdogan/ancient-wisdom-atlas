canonical_text:
  quote: ''
  summary: The passage first recounts a young man pursuing his cousin, who has become
    a harmful Ganiagwaihe, until the being promises to leave and stop harming the
    people. It then begins a tale in which a brother murders his look-alike friend,
    hides the body under the fireplace, deceives the victim's mother, sends his sister
    eastward inside an arrowhead, and flees. The dead man speaks to his mother through
    the fire, revealing the murder; she finds the body, becomes a Ganiagwaihegowa,
    and begins pursuit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man, identified as the cousin of the man who had become a Ganiagwaihe,
    is provisioned with parched corn, new moccasins, a bow, and twelve arrows before
    going to the pond to kill it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night, the Ganiagwaihe appears to the young man in a dream in the form
    of a man, questions his purpose, threatens him, and tells him to pursue it at
    daylight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man follows the Ganiagwaihe's route, sees its tracks by midday,
    and continues the pursuit until night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man discovers that his corn flour has become ants, and the passage
    states that the Ganiagwaihe caused this to deprive him of food.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ganiagwaihe asks to be spared, promising to leave that part of the country
    forever and stop injuring the people; the young man agrees to spare it if it is
    sincere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man returns and tells the people they may fish in the pond without
    trouble, and the Ganiagwaihe keeps its word.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In another village setting, an old woman's son and a brother in another lodge
    look so alike that they can scarcely be distinguished, and they are great friends.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brother learns that his friend is thinking of marrying his young sister
    in the future, becomes displeased, kills him, digs a deep hole under the fireplace,
    places the body there, covers it with earth, and makes a fire over the spot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the old woman searches for her son, the brother lies that he left for
    home or went to cut arrow wood; he then goes to her lodge and impersonates the
    son closely enough that she does not detect a difference in voice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brother warns his sister of impending danger, tells her to make many tracks
    at the spring, then makes her very small, places her inside an arrowhead, and
    shoots the arrow east through the smoke-hole.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The arrow lands on a stone far to the east, bursts, and the girl comes out
    and runs away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After making many tracks around the lodge, the brother goes up the smoke-hole,
    sees the long trail made by the arrow through the air, follows it to the stone,
    and then follows his sister's tracks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The murdered son's mother sits by the fire in the empty lodge and hears a
    voice from the flames saying that his friend killed him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The mother digs under the hearth, finds her son's body, goes home, becomes
    a Ganiagwaihegowa, follows the girl's tracks to the spring and back, sees the
    arrow trail through the smoke-hole, and runs eastward.
  category: sequence
  evidence_refs:
  - ev:8
