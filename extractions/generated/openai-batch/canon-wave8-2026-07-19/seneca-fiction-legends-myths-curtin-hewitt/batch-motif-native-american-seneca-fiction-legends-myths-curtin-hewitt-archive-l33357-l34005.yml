canonical_text:
  quote: ''
  summary: A great child returns toward an old lodge, hears a loud sound associated
    with a broken root where his uncle had been lying, and later finds that his maternal
    uncle is gone. Grieving, the child searches around the lodge for tracks, sees
    the uncle's deep trail running toward the sunset, takes his bow and arrows, and
    follows the trail through the forest for three nights. The trail ends at a lake.
    While standing by the lake, the child sees a swift canoe far away, paddling toward
    him, with a human being aboard; the canoe stops near him.
