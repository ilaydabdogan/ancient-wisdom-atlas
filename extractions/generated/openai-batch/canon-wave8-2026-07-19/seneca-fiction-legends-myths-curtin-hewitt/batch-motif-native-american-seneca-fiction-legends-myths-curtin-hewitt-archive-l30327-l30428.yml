canonical_text:
  quote: ''
  summary: An old woman returns home and hears owl pets utter warnings about the young
    man and his younger sister. The young man dismisses them, then flees after his
    sister. The old woman later finds her son hidden dead beneath the fireplace, strengthens
    herself with hickory-nut meat, becomes a huge bear, and pursues the fugitives.
    The young man uses a wild pigeon feather to summon a vast pigeon roost whose droppings
    form a rampart that blocks the bear temporarily, but the rampart disappears and
    the pursuit resumes.
  language: English
  quote_policy: summarized
