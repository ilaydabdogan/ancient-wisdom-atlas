canonical_text:
  quote: ''
  summary: A Thanksgiving Ceremony address gives thanks to the Creator or Master of
    Life for chiefs and their duties, for female and male life and offspring, for
    the earth, waters, food plants, medicines, flowers, shrubs, trees, forests, animals,
    maple sap, sunflowers, and for the Thunderers who watch over the earth and bring
    rain from the west.
