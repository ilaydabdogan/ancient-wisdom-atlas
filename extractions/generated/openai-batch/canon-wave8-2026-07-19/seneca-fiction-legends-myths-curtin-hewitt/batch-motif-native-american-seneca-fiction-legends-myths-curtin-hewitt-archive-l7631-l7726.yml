canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which villagers with torches see and
    shoot at a terrible unknown animal; it disappears, and later they find dogs torn
    apart and most camp meat eaten. A new tale begins: an old woman, identified in
    the title as Mother Swan, sends her daughters with marriage-bread to seek Big
    Earth’s handsome hunter son. The daughters are repeatedly warned not to speak
    to anyone. On the first journey, two sisters are tricked by a pleasant old man
    with a bow-and-arrow ruse and lose their basket. On the second journey, the old
    man misdirects the sisters to his lodge, disguises his wife with ashes, and is
    called Gesagwe by a runner. The younger sister suspects deception, leaves bed
    decoys made of slippery-elm sticks, and continues to a Long Lodge, where Gesagwe
    is dancing and people throw corn into his mouth; she identifies an attractive
    young man by the fire as the one sought.'
  language: English
  quote_policy: summarized
