canonical_text:
  quote: ''
  summary: A man uses a rock and underground passage to watch a destructive Black
    Monster/Dagwanoenyent attack a village, then kills it with arrows and takes part
    of its scalp as a helper. He later meets Gaasyendiet'ha, receives a tooth that
    grants shapeshifting power, lives alone, then transforms into several forms, devours
    another village, and abducts a woman by changing her into a gnat and carrying
    her home under his wing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the tenth day the man sits on a large level rock, hears a great noise from
    the south, sees smoke-like appearance and trees uprooted over a wide area, and
    goes under the rock near an underground passage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Through the underground passage the man sees a village as if nearby; he hears
    people screaming, sees huts hurled into the air and torn apart, and sees the Monster
    eating people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man strings his bow and shoots through the underground passage until his
    last arrow; the great Black Monster falls and says the man has killed it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The man examines the Monster's head, finds every arrow in it, cuts part of
    the scalp from the crown with long hair attached, ties it around his body, and
    asks it to help him and keep him from being overpowered.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After taking the scalp, the man climbs the hill quickly, builds a brush hut,
    hunts deer, bear, and other game, and dries meat on hurdles in brush arbors.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At dark, following what his dream had said, the man travels north and comes
    to a fallen tree with roots turned up, where he sees Gaasyendiet'ha with its great
    mouth open and angry appearance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gaasyendiet'ha laughs when the man is not frightened, changes itself into
    a human being, and tells him to take out one of its back double teeth, saying
    the tooth will let him change himself into any form he wishes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gaasyendiet'ha tells the man he shall live, possess full magical power, and
    counsel with Gaasyendiet'ha especially in trouble; then it resumes its natural
    form and flies away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After living in the hut for one year, the man becomes lonely, decides to look
    for people, changes himself into a Gadjidas, and flies southwest while looking
    down on the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near a village the man says he will eat all the people but take home a good-looking
    woman if he finds one; he changes into a Ganiagwaihegowa and eats people from
    house to house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At a little hut with smoke, the man finds and eats an old man, a woman, and
    several children; later he meets a handsome woman who is their daughter, and she
    cries when she finds only blood at the hut.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man touches the woman's head, making her senseless, shakes her into a
    small gnat, changes himself into a hen hawk, carries the gnat under his wing to
    his home, restores the woman to human form, and orders her to care for the meat
    and lodge.
  category: action
  evidence_refs:
  - ev:7
