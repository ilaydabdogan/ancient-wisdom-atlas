canonical_text:
  quote: ''
  summary: The passage is an editorial discussion distinguishing fiction, legend,
    and myth in Seneca/Iroquoian narratives. It explains Stone Coats, Stone Giants,
    or Genonsgwa as legendary or fictitious figures derived from an etymological reinterpretation
    of an Ice-clad Winter Man-being in the Iroquoian Genesis myth. It connects ice,
    flint, chert, stone canoes, the northern homeland of Stone Coats, the death and
    burial of the Winter God after defeat by his twin brother the Life God, and later
    tales that make Stone Coats from perverse humans covered with pitch and sand.
  language: English
  quote_policy: summarized
