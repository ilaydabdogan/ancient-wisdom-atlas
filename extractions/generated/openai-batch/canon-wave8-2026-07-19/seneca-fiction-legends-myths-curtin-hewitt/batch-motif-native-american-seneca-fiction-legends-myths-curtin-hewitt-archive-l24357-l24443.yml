canonical_text:
  quote: ''
  summary: A young bride repeatedly tries to entice a recluse youth in the lodge while
    the others are away. When he refuses, she fabricates accusations against him and
    wounds herself to support the false story. The passage explains that her mother,
    Gaho°*dji'da"ho"k, sent her to gain power over the youth and destroy him before
    he reached manhood, because recluses of his kind possess potent orenda at puberty.
    The youth foresees the plot and resists her advances to avoid witchcraft and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the other lodge members except the bride and the recluse have gone into
    the forest, the bride crosses to the other side of the fire and uncovers the head
    of the sleeping covered figure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride sees a handsome sleeping youth, wakes him, and asks him to arise
    and come to her couch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth does not arise or speak to the bride despite her repeated entreaties
    throughout the day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride returns to her own couch before the other lodge members return,
    and the passage says she does not love her husband after learning of his misfortune
    and her mistaken couch choice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the family returns, eats supper, and retires, the bride tells her husband
    an invented story accusing the recluse brother of improper proposals and attempted
    assault; the husband makes no reply.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the next day, the bride again wakes and urges the recluse to come to her
    couch; he replies that she should be satisfied with her own husband and recalls
    that she rejected him when first instructed to sit on his bed as a marriage proposal
    sign.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After being refused, the bride returns to her couch angry and lacerates and
    bruises her neck, face, breasts, and arms with her own hands and fingernails to
    support an intended accusation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: That evening the bride repeats the accusation and shows her wounds as corroboration;
    the husband remains silent and later tells his brothers, who also receive the
    information silently.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: On the third day the bride still hopes to entrap the recluse, and the passage
    states that her mother sent her to marry him in order to get him into her power
    and destroy him before manhood.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that those regarded as deanoa'do were believed to possess
    potent orenda, or magic power, which they would use when they reached puberty.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The recluse youth had foreseen the events, knew the great witch's purpose,
    resisted the daughter's advances, and feared bewitchment and death if defeated.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The bride again begs the youth tearfully to come to her couch, but he repulses
    her and she returns to her own side of the fire.
  category: action
  evidence_refs:
  - ev:8
