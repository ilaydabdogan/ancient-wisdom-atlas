canonical_text:
  quote: ''
  summary: A nephew carries his sister in a bark case to consult an uncle whose skull
    protrudes from the ground. The skull-uncle instructs him to guard his sister,
    make a great fire, feign a midnight dream-command, and compel another old uncle
    to be dragged naked around the lodge in a bark sledge. The youth follows the instructions,
    keeps his sister with him, stages the fire episode, persuades the old uncle through
    the claimed dream-command, binds him to the sledge, and drags him around the lodge
    at great speed. Sorcerers and wizards declare that the youth has overmatched his
    uncle's orenda, or magic power.
  language: English
  quote_policy: summarized
