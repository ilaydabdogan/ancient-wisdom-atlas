canonical_text:
  quote: ''
  summary: A young human woman is received by an old man and his people after helping
    kill a great serpent. The old man removes young serpents from her body by rubbing
    her with orenda. She later accompanies his sons to attack a bloodsucker in deep
    water, kills it with arrows from the clouds, and frees their brother. After about
    a year she returns to her mother with a ten-day prohibition on work; on the tenth
    day she works and breaks a mortar because Thunder orenda remains in her. The passage
    then begins a new tale in which an orphan hunter, rejected by other hunters, sleeps
    in an empty lodge and is visited by a woman who says she has passed out of this
    world and has come to help him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party enters what seems to the young woman to be a lodge, where an old
    white-haired man thanks her for helping kill the great serpent and its progeny.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man rubs the young woman's body with hands fortified by orenda; several
    young serpents crawl from her and are killed, and he says she is well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the young woman stays in the lodge, the younger people bring her corn
    because she cannot eat their usual food, which is largely serpent flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man tells his sons to take the young woman hunting so that she may
    secure more orenda.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sons describe a terrible bloodsucker lying on a rock deep in great waters;
    it has caught one of their number, and they say they cannot save him or kill it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The men go high into the clouds and shoot arrows down into the water but miss;
    the young woman shoots, and her second shot kills the bloodsucker, freeing their
    brother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After about a year, the old man says the young woman should return to her
    mother and commands her not to work, pound, or chop for ten days.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The young woman is escorted near her mother's lodge; after a heavy rain she
    sees she is standing in water, and her mother is delighted to see her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the tenth day, family women urge the young woman to help; one blow with
    a corn-pounder splits the mortar, which the narration explains by saying the orenda
    of the Thunders has not entirely left her.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A new tale begins with a young orphan man who has no relatives or home and
    is left behind when other men go hunting.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The orphan goes out alone, finds an apparently empty lodge with wood and a
    comfortable interior, makes a fire, and lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: At midnight a woman enters, says she has come to help the orphan and that
    he should not be afraid, and states that she has passed out of this world.
  category: speech
  evidence_refs:
  - ev:12
