canonical_text:
  quote: ''
  summary: A young wife and her injured husband, Doadanegen, summon a great leech
    at a lake; the leech carries them across to their home shore and is thanked and
    released. Doadanegen returns to his lodge, where his uncle is mourning him as
    dead and burning himself with coals and ashes. After Doadanegen identifies himself,
    the uncle recognizes him, rejoices, and tells him to stay near home because the
    elder wife is near childbirth. The passage then begins an interlinear Seneca section
    for a legend of Doadanegen and Hotkwisdadegen, describing an uncle-nephew pair
    dwelling and hunting together and a command to go to a stream-washed bluff to
    listen.
  language: English; Seneca with English interlinear glosses
  quote_policy: summarized
