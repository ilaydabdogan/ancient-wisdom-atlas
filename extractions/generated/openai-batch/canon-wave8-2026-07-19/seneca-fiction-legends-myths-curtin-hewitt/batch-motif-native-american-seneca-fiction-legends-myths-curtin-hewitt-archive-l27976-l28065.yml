canonical_text:
  quote: ''
  summary: An old woman in a lodge proposes that one visiting man remain as a coworker
    because the visitors accomplished the killing of the Otkon. The remaining visitor
    receives the name Daga'e'da', the Thaw or Warm Spring Weather, and is transformed.
    The old woman instructs the lodge men and Daga'e'da' to journey and bring spring
    moisture to the earth below. She reveals herself as the Moon, identifies the lodge
    men as the Thunderers, and says Hawenniyo/Deaunhyawagon commissioned their fixed
    cosmic duties and will one day transform what he established.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman tells the lodge men that the visitors accomplished something
    for them and that one visitor should remain as one of them and work with them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reason given for retaining the visitor is that he killed the squirrel,
    identified parenthetically as the Otkon, after the lodge men had long failed to
    do so.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dehodyadgeowen says he confirms the proposition if the visitor is freely willing
    and volunteers to have his life pounded in a mortar, which would allow him to
    help continually.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman asks the visitor to remain while his companions return home
    and says she will give him the new name Daga'e'da', glossed as the Thaw or Warm
    Spring Weather.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After transformation, the man sings, and Dehaenhyowens and his remaining friend
    hear the sound as like approaching thunder, though less loud.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old woman instructs the lodge men, now including the transformed person,
    to begin a journey to make the growing things on the earth beneath mellow and
    moist again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Daga'e'da' is instructed to take the lead, and people on earth below are said
    to name him first in spring as the warm or hot spring wind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Daga'e'da' is said to continue changing future days and nights at the boundary
    between snowtime and summertime.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old woman identifies herself as the Nocturnal Light Orb, the Moon, and
    says Hawenniyo/Deaunhyawagon commissioned her to provide some light and warmth
    during earthly darkness so growing things are not harmed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old woman identifies the inhabitants of the place as Hadiwennoda'dye's,
    the Thunderers, and says the world-establisher decreed that they come to the lower
    world from the west and move east.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The old woman says that if the Thunder men come from the east, earth dwellers
    should understand this as a sign that the time is near when Hawenniyo will take
    the earth to pieces.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Sun and the Moon are described as appearing to the lower world from fixed
    directions until Hawenniyo transforms what he established.
  category: attribute
  evidence_refs:
  - ev:10
