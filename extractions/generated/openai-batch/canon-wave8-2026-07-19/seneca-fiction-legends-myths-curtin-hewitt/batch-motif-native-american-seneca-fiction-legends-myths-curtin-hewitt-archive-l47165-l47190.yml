  summary: 'A notes section gives editorial explanations: a correct translation is
    said to appear in the introduction; a word for flint or chert is explained as
    poetic license for ice; a recital concerns ambassadorial customs toward hostile
    tribes; an unspecified symbol is linked to Iroquois League dedicatory language;
    an island incident is said to recur in other stories, especially Hayanoweh; another
    incident is interpreted as showing that the dead were not really dead and knew
    earthly events; one incident is compared to the biblical-style “Fear not”; and
    magical servitude is explained as hostile use of orenda, or magic power, related
    to the sense of “spellbound.”'
