canonical_text:
  quote: ''
  summary: The uncle sends his nephew to a valley to listen. The nephew hears a woman's
    song announcing that she is seeking a young male person at Doadanegen's home,
    later identified in song as He-who-listens. The uncle, Doadanegen, prepares the
    lodge to make himself appear noble while placing the scabbed nephew among dirt
    and filth. Two sisters enter, dispute the men's identities, and choose to sit
    beside Hat'hondas/He-who-listens despite the uncle's attempts to mislead them
    and take the seat between them.
  language: English
  quote_policy: summarized
