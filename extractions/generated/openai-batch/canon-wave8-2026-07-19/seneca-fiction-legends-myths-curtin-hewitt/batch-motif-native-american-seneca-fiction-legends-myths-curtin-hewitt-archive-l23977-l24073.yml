canonical_text:
  quote: ''
  summary: The passage closes a cannibal episode in which Little Burnt Belly kills
    a cannibal whose life is in a bird, frees a drugged prisoner, revives his devoured
    brothers, and returns to Honenhineb's lodge. It then tells the legend of Godasiyo,
    a woman chief in a primordial age of one language and peace. A dispute over her
    white dog leads her adherents to emigrate upstream by canoe. At a river fork the
    people divide, Godasiyo's platform falls into the water, she becomes a great fish,
    and the divided people can no longer understand one another, explaining the origin
    of many languages. The passage ends with the opening notice of a legend about
    anthropomorphic rattlesnakes and subterranean caverns in ancient Oneida country.
  language: English
  quote_policy: summarized
