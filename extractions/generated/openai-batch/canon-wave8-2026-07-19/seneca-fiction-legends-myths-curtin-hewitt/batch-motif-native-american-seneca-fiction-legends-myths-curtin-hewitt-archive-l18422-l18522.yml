canonical_text:
  quote: ''
  summary: The passage first tells of boys whose worm becomes an immense monster that
    swallows children and villagers until survivors burn tobacco and call Hinon, the
    Thunder god, who destroys it with lightning and its pieces form a lake. It then
    tells how Bear boasts of orenda enough to stop sunrise, is mocked by Chipmunk
    when the sun rises, and leaves claw marks on Chipmunk's back. The final portion
    begins a tale of a grandfather guarding his grandson after their tribe has been
    carried away by sorcery, and teaching him the sequence of a young hunter's first
    game animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While boys were throwing food to the worm and wrestling, the youngest boy
    was thrown near the creature and swallowed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The missing child's parents searched for him and asked among the boys, but
    the other boys only said they had seen him the previous day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boys later pushed two or three other boys near the worm, and the worm
    devoured them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The worm became very large and ferocious, ruled the boys by a spell, and was
    found to have killed and eaten a deer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The village stood on a large mound-like hill, and after the boys failed to
    feed the worm the people found the village surrounded by a terrible monster.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many villagers rushed into what seemed to be an opening, but it was the worm's
    mouth and they were swallowed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The remaining people burned tobacco and called on their grandfather Hinon,
    the Thunder god, asking him to save them from the worm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hinon approached in a great black storm cloud with noise, struck the worm
    with lightning, tore it to pieces, and the pieces rolled into the valley, which
    became a lake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bear is described as believing herself very powerful in orenda and as trying
    to exhibit this power before other animals.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bear claimed she could prevent the sun from rising, and Chipmunk denied that
    she could do it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sun rose at the usual time, and Chipmunk laughed at and mocked Bear's
    boasting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bear chased Chipmunk to his burrow and left three claw marks on his back,
    which the passage says Chipmunk carries to this day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A grandfather and grandson lived in a lodge in a forest far from any village
    after the rest of their tribe had been carried away through sorcery, and the grandfather
    guarded the boy from witches and wizards.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The grandson heard something crying 'Kidji'de,' and the grandfather identified
    it as Chickadee, the first kind of game a young hunter kills.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The boy killed the chickadee, and the grandfather dressed it, broiled it on
    sticks before the fire, sang and danced, and said his grandson would become a
    great hunter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The boy next saw Dju'a'ka', described with four legs, a black face, and four
    stripes around its tail; the grandfather called it the second kind of game a young
    hunter kills.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The boy killed Dju'a'ka', and the grandfather again sang and danced, cooked
    it before the fire, and both ate its flesh.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The boy later saw Ohsoon, described as walking on two legs with red skin on
