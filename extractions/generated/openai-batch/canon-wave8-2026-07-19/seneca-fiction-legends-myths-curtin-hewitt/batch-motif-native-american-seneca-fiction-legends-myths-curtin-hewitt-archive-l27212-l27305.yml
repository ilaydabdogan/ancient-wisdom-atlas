canonical_text:
  quote: ''
  summary: The end of the Gadjis'dodo' narrative describes the nephew completing a
    final circuit with a bark sledge, finding the old uncle dead or unresponsive,
    leaving the sledge outside, returning to his sister in a bark case, restoring
    another uncle whose skull protrudes from the ground, freeing and restoring his
    sister, and declaring the family reunited after the evil sorcerer has departed.
    The next legend begins with Dehaenhyowens, a young man from Dyohnyowanen, organizing
    a westward war expedition along the path of the sun, joined by his brother and
    28 other young men; the party departs toward sunset and attacks two unknown settlements,
    killing and scalping inhabitants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nephew returns to the doorway for the ninth time and asks whether his
    uncle is still alive; receiving no reply, he sees that the uncle's eyes are frozen
    hard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nephew begins a tenth circuit with the bark sledge, moving fast enough
    that the sledge flies high and turns over repeatedly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youth swings the sledge away from the lodge and leaves it on the ground,
    where the cold causes only a crackling of ice when it strikes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gadjis'dodo' returns to the lodge where his sister remains fastened in a bark
    case.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sister smiles and says she is thankful that she and her elder brother
    are both still alive after what they have gone through.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gadjis'dodo' carries the bark case on his back with a forehead strap to the
    place where another uncle's skull protrudes from the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gadjis'dodo' says he has overcome the evil potency, or orenda, of the old
    uncle, who is now no more.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gadjis'dodo' draws the other uncle up, makes him stand, and strokes his body
