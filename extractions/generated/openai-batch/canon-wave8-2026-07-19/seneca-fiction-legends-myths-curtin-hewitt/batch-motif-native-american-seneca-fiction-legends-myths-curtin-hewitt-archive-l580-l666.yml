  summary: The introduction presents the editor’s recollection of Curtin and quotes
    Curtin’s views on mythology as a science. It argues that myths and tales preserve
    religion, philosophy, social life, and worldviews; that comparative mythology
    requires collecting materials from peoples outside Aryan and Semitic traditions;
    and that American Indian traditions contain extensive literature of unique value.
    It also states that mythological study should identify the actors hidden under
    disguises in myth-tales.
