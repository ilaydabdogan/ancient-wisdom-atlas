canonical_text:
  quote: ''
  summary: In the closing part of the CUBTIK episode, a young man flees the Great
    Head, luring it to a lodge where he and his elder brother pound it. The Great
    Head then helps restore a brother, leads the young man to women whose bones are
    transformed into birds, and instructs him to assemble skeletons that rise when
    commanded. The missing brothers are restored and the twelve brothers are reunited.
    The passage then begins the next myth, introducing an old man, Ongwe Ias, his
    three nephews, a partitioned lodge, and signs that the old man eats human bodies.
  language: English
  quote_policy: summarized
