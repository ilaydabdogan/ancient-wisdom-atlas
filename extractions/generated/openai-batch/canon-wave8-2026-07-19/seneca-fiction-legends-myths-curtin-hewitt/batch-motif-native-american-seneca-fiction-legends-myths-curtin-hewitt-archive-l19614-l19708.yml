canonical_text:
  quote: ''
  summary: Two boys return home to their father, who had thought them dead, and recount
    earlier exploits against the Genonsgwa. Despite their father's warnings about
    dangerous uncles with orenda living in lodges beyond, the boys depart to visit
    another uncle. They reach his quiet lodge, enter, and are challenged to a deadly
    hide-and-seek game in which the loser loses his head. The boys hide in uncanny
    places, a log and behind the sun, and the uncle fails to find them. The uncle
    then hides, apparently in a small hanging bag, and the younger boy strikes it
    with the club.
  language: English
  quote_policy: summarized
