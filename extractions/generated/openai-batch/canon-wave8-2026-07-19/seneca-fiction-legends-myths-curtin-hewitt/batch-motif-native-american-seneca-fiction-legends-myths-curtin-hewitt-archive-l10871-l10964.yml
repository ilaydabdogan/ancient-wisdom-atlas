canonical_text:
  quote: ''
  summary: A young man demonstrates magic with a manikin, pipe, wampum, and a feather
    headdress bearing an animated duck. His uncle instructs him about two young women
    and a hunting procedure involving a taboo on looking. On the way to the chief's
    lodge, a stranger posing as an uncle tricks him at a night fire and steals his
    magic garments and pouch. The thief then tries to impersonate him before the chief's
    household and community, but the duck, manikin, and wampum-producing smoke fail
    to work for him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The manikin runs to the fire, brings an ember, and puts it into the pipe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nephew smokes the pipe and expectorates wampum first on one side and then
    on the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feather headdress has a duck on top that droops when the headdress is
    not worn, becomes alive when it is put on, and calls out when told to speak.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The uncle tells the nephew that two young women are thinking of him and gives
    instructions for a hunt in which one young woman must lie down with her head covered
    and must not look.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nephew travels toward the chief's lodge wearing his uncle's garments and
    headdress and camps at night in the forest by a fallen tree and a fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A stranger comes to the fire, calls the young man nephew, asks to stay opposite
    him, and tells life stories through the night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stranger uses sparks from the fire and a warning about the young man's
    clothes to persuade him to remove and conceal his garments.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the young man falls asleep, the stranger puts on the young man's garments
    and leaves his own worn and soiled things in their place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the stranger knew the young man's destination and
    the orenda, or magic power, of the garments and pouch.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the morning the young man finds himself alone, without his garments and
    pouch, and continues toward the chief's lodge in the stranger's shabby clothing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the old man arrives in the stolen garments and headdress, the elder sister
    accepts him as the expected man, while the younger sister suspects that he is
    not the right man and moves to the other side of the fire.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The chief summons people to the public assembly lodge to meet his new son-in-law
    and see him smoke, and buckskins are spread to receive the expected wampum.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During the public smoking attempt, the duck on the stolen headdress appears
    lifeless, the manikin does not move, the old man lights the pipe himself, and
    he spits no wampum.
  category: sequence
  evidence_refs:
  - ev:7
