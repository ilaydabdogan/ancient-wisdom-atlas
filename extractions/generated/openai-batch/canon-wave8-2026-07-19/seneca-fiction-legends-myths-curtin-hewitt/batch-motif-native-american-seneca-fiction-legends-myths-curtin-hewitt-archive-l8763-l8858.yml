canonical_text:
  quote: ''
  summary: Shagowenotha abandons Hodadenon on an island and tells lake creatures to
    eat him if he swims away. Hodadenon encounters speaking bones that call him nephew,
    request tobacco smoke, and instruct him to make red willow manikins armed with
    bows and arrows, place them in trees, and hide by an overhanging cliff reached
    through the water. A cannibal, Ongwe Ias, arrives with three dogs and pursues
    Hodadenon’s trail. The dogs repeatedly attack the manikins; Ongwe Ias shoots them
    and finds they are made of red willow or rotten wood. The manikins kill two of
    the dogs, and Ongwe Ias pounds the bones, accusing them of deceiving him after
    he had eaten their flesh.
  language: English
  quote_policy: summarized
