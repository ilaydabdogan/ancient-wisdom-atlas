canonical_text:
  quote: ''
  summary: Two youths kill an uncle who has lost a wager, attach his severed head
    etiologically to tree knots, burn his home, defeat man-eating witches by commanding
    a mallet to strike them, purify themselves in red river water, and then challenge
    a village to a lacrosse-ball game wagered for heads, using a spider web to turn
    back the ball and win.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man acknowledges that the boy has found him, and the younger boy says
    the man has lost his head under the terms of a bet.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger boy cuts off the old man's head; the elder boy strikes the head
    against a tree and commands that trees should thereafter have heads or knots usable
    for ladles and bowls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youths burn the old man's home and say the encounter has delayed their
    journey.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The youths reach a lodge occupied by four witches, including an old woman
    and her daughters; the younger boy enters first.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder boy calls his fetish, the mole, to take him underground to the lodge
    where the younger boy has gone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman takes a mallet to strike the younger boy, but he commands the mallet
    to strike the old woman and then the sisters, causing the women to fight until
    all are dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the women die, the brothers say they have ended man-eaters who killed
    many of their people and decide to burn the lodge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before undertaking one remaining task, the younger brother says they must
    go to the river to bathe and purify their bodies because people where they are
    going have evil magic power.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the river they find thick red water; the elder youth enters against warning,
    becomes covered with filth, sinks, and must be saved and washed clean by his brother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brothers come to an opening with a pole at the center and many people
    nearby; the younger boy challenges the chief and asks the rules.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief says the people wager heads, and the younger boy notices animals
    that are fed with heads.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The younger boy commands a spider to weave a web across the ball ground so
    the ball cannot pass; the ball hits the web, returns, and the elder boy scores
    the first point.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The younger boy asserts that one inning wins the game and claims the heads
    of those for whom the chief wagered.
  category: speech
  evidence_refs:
  - ev:7
