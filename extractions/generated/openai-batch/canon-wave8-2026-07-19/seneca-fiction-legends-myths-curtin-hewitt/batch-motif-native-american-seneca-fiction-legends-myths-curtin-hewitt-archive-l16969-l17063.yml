canonical_text:
  quote: ''
  summary: After a woman steals one man's leggings and moccasins, the sisters travel
    away in canoes through the air, leaving a visible trail. Okteondon supplies replacement
    clothing, leads the men in pursuit, hunts after game has been driven away, and
    later retaliates by placing the women's clothing-canoe in the top of a commanded,
    ice-covered tree. The women fail to recover it until they promise to stop their
    conduct, after which Okteondon returns it. The sisters then camp on an icy lake
    to test the men's orenda, and Okteondon creates fire, lodge, and beds from gathered
    leaves and hemlock boughs.
  language: English
  quote_policy: summarized
