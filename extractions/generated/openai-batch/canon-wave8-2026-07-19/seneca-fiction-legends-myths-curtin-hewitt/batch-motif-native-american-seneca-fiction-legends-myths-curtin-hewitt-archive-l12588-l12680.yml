canonical_text:
  quote: ''
  summary: Two sisters escape after the younger sister drives a flint knife into a
    neck joint and retrieves a strip of Djainosgowa skin described as their magic-power
    container. Doonongaes discovers their flight, tracks them, suffers neck pain,
    and seeks them until he finds the lodge of the old man Gwidogwido, the sisters'
    grandfather. Gwidogwido challenges him to fight. Their combat moves through clearings
    and forest, uprooting trees and smashing lodges, until Djihonsdonqgwen villagers
    attack; they kill Gwidogwido, while Doonongaes escapes and continues onward to
    another lodge where he sees two boys playing.
  language: English
  quote_policy: summarized
