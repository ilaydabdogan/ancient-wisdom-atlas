canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, in which a captive young man
    is tortured, his tears become wampum, his younger brother rescues him by magical
    means, and a fox tormenter is caught. It then begins a tale in which a woman is
    entered by a rattlesnake, loses later husbands, attempts suicide at Niagara Falls,
    is rescued and healed by Hinon beneath the Falls, returns to her mother while
    pregnant, and gives birth to a boy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man tied to a post smiles when he sees his brother; he is burned with
    firebrands, and his falling tears turn into wampum beads that the people gather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before renewed torture, the little brother gives one moccasin to his friend
    and keeps the other; when each puts a foot into the fire, one of two sisters screams
    in severe pain until the foot is removed.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The boy and grandmother command that all sleep soundly; while the people sleep,
    the boy cuts down his brother, takes him outside, and commands the lodge to become
    red-hot flint, burning those inside.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: At the uncle's lodge, a fox who has come to torment the uncle enters, runs
    toward the fire for ashes, and is caught, tied, and hung up by the boy before
    the story breaks off.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: In a second tale, a married hunting couple build a brush lodge in a dense
    wood, and the husband repeatedly warns his wife not to sleep during the day.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:6
  text: The husband returns early, finds his wife asleep with a great rattlesnake
    among the skins on which she lies, and the snake disappears into her body when
    he tries to pull it away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: After the first husband separates from her, the woman marries two other men,
    each of whom is found dead on the morning after the marriage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: After hearing what the first husband reported, the woman is ashamed and resolves
    to kill herself by going over Niagara Falls in a canoe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Hinon, who dwells under the Falls, takes the woman from the water, brings
    her home, gives her medicine, and causes a dead snake to drop from her person.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: Hinon roasts the dead snake on the coals of his hearth and eats it.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The woman lives with Hinon for some time; because she cannot eat his food,
    he brings corn and squash taken from her mother's field and fireside.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: When the woman is far advanced in pregnancy, Hinon sends companions to take
    her only to her mother's field; she reunites with her mother and later gives birth
    to a boy.
  category: sequence
  evidence_refs:
  - ev:12
