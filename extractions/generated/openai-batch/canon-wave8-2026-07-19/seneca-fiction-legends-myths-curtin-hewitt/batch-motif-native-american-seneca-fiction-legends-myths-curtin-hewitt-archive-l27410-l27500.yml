- id: obs:2
  text: Dehaenhyowens says their path leads into a farther country and that they must
    pass under the sky while it rises so they are not caught when it falls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first four men individually time their runs under the rising and falling
    sky and pass beyond the barrier.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fifth and last man miscalculates the distance to the passageway and is
