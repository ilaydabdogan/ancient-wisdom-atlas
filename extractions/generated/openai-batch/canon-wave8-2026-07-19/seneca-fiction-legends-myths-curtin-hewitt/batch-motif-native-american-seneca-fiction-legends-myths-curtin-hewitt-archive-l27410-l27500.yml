canonical_text:
  quote: ''
  summary: A band led by Dehaenhyowens hides its packs of scalps, then attempts to
    pass under a sky that rises and falls on the way into a farther country. Four
    men pass safely, but the fifth is crushed. The survivors enter a strikingly bright
    land with large blooming trees, light-giving flowers, fine animals, abundant plants,
    and large strawberries. They then encounter a multitude of human beings gathered
    for lacrosse; one violent player is admonished by a person from the crowd.
  language: English
  quote_policy: summarized
