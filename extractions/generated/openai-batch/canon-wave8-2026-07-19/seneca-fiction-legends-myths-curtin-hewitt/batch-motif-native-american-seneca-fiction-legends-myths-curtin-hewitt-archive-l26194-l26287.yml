canonical_text:
  quote: ''
  summary: Hodadenon and his companion cross a frozen lake, are challenged by lake-dwellers
    to a wagered snowshoe race, win through Hodadenon's commanded snowshoes, kill
    the wicked people, arrange bones, and raise people who then return with him. At
    his long lodge he orders places for the returned people and establishes paired
    dwelling of men and women. The excerpt then begins another legend, introducing
    S'hogo'gwa's and his nephew in a long lodge.
  language: English
  quote_policy: summarized
