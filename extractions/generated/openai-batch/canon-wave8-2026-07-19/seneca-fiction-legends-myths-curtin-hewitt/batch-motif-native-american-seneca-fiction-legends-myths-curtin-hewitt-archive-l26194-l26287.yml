    crossed the lake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the shore lodge, the inmates state a custom of entertaining visitors by
    betting beads on a race around the lake on snowshoes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hodadenon makes very small, fine snowshoes and agrees to run alone, while
    the lake-dwellers put four men against him.
