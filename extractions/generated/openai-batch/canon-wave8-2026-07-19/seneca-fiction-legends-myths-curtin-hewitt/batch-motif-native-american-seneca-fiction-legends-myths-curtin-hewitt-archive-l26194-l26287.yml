- id: obs:1
  text: Hodadenon and his companion unstring their bows, start across the ice, and
    use the bows as walking sticks by striking them on the ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People on the shore come onto the ice to meet the two visitors and shout that
