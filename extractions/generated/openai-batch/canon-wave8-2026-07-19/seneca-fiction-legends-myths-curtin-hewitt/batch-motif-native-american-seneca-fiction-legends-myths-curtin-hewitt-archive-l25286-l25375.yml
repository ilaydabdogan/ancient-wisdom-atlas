canonical_text:
  quote: ''
  summary: 'The passage closes one narrative in which a bride returns to her clan,
    reports her husband''s connection with a mysterious Oenonsgwa woman and child,
    is advised to remain with her own kin, and the husband is socially shunned. It
    then begins the story of the seventh son Djbngo"se^: an old man forbids his sons
    to hunt in one direction; the six elder sons and then the father vanish there;
    the youngest son and his sister set out in winter, after the boy transforms his
    tiny dog into a large dog and sends it away, and they find lodges with embers
    and broiled venison on successive nights.'
  language: English
  quote_policy: summarized
