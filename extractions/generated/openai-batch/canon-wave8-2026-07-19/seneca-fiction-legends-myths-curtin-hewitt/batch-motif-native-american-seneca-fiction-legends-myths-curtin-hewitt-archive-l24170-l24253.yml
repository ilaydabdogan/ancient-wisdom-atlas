canonical_text:
  quote: ''
  summary: An aged chief and a young hunter attend a council in the Long-lodge, where
    the Fire-keeper chief opens and closes the council fire with formal speech and
    thanks to the Master of Life. The hunter ignores young women who try to draw his
    attention, leaves quickly after the council, and is pursued by four women. He
    reaches a raised hut, climbs a tree ladder, pulls it up, and bars the door while
    the women fail to climb greased posts. At dawn he sees four huge female rattlesnakes
    where the women had been. He then visits his hosts' lodge, sees the aged host
    in rattlesnake form, and is reassured by the old woman, who has taken human form
    again and directs him to wash before the meal.
  language: English
  quote_policy: summarized
