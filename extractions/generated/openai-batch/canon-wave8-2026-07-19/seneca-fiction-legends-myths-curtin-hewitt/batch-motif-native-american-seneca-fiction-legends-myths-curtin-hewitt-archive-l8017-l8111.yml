canonical_text:
  quote: ''
  summary: Hodadenon repeatedly goes hunting while his sister Yenyent'hwus plants,
    prepares food, and warns him not to go north or far from the lodge. He kills named
    game animals—turkey, raccoon, deer, and bear—and his sister identifies, carries,
    butchers, cooks, and uses parts of them. After going farther north, he finds a
    clearing with a lodge where naked Odjineowa men are dancing; they notice him and
    want to kill him. He flees to the woods, then plants many sticks at the edge of
    the opening and commands them to fight the men when they chase him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon shoots a creature later identified by his sister as Osoont, a turkey;
    he tells the dying animal not to break his best arrow, and his sister carries,
    dresses, stores, and cooks it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next morning Yenyent'hwus puts a belt on Hodadenon and warns him against
    going north or far from the lodge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hodadenon finds tracks that fit his feet, follows the trail, shoots a striped-tailed
    or spotted-faced animal, retrieves his arrow, and his sister identifies the animal
    as Djoeaga, a raccoon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yenyent'hwus makes corn bread to eat with the raccoon meat, skims oil from
    the cooking meat, and rubs the oil into her hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a later day, after the customary warning, Hodadenon goes a little farther,
    shoots a game animal, follows it after it disappears, and finds it dead; his sister
    identifies it as Onogengowa and uses a hemp-bark strap to carry the meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yenyent'hwus cuts off the feet of the deer, ties them together, gives them
    to Hodadenon to carry, and carries the rest of the meat in two trips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the next day, Hodadenon shoots another game animal that runs out of sight;
    he follows and finds it dead with the arrow point sticking out, and Yenyent'hwus
    identifies it as Ghiniagwaihe, a bear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yenyent'hwus skins the bear, gives Hodadenon the forefeet to carry, carries
    the meat in portions, and obtains more hair oil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After finding no game, Hodadenon looks north, sees a pleasant opening or clearing,
    enters it, and finds a lodge in its middle.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Peeping through a crack in the lodge wall, Hodadenon sees many naked Odjineowa
    men dancing; they notice someone is watching and say they should kill him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hodadenon flees back to the woods while the men chase him to the edge of the
    opening and then turn back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hodadenon takes sticks from a pile made by his sister, plants them at the
    edge of the opening, and speaks to them, instructing them to fight the men with
    clubs and help him when the men run after him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Across the hunting episodes, Hodadenon repeatedly goes a few steps or a little
    farther than before despite recurring warnings.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
