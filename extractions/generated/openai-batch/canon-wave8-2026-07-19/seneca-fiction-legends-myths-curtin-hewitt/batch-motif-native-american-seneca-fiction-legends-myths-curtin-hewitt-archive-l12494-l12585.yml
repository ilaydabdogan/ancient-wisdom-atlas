canonical_text:
  quote: ''
  summary: Doonongaes has a servant, Skahnowa, who patrols the long lake Ganyodaes.
    Skahnowa finds Djidjogwen fishing and reports him. Doonongaes confronts Djidjogwen,
    kills him with a club, cooks and eats his flesh, and orders Skahnowa to treat
    future trespassers likewise. Doonongaes then journeys west, approaches a lodge
    underground, steals it by lifting it on his horns, and carries away two old Gwidogwido
    sisters. The sisters identify him, leave through the smoke-hole with clubs, and
    begin attacking his body; when the younger pounds fin-like protrusions near his
    tail, a milk-like fluid turns into foam and flows strongly.
  language: English
  quote_policy: summarized
