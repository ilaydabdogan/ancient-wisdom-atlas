canonical_text:
  quote: ''
  summary: Oanyadjigowa/Ganyadjigowa taunts pursuers, flies up to the clouds, speaks
    with a cloud-dwelling man who can see over the world, and is warned about a powerful
    lake-side being and the Wind. He descends, questions and names a ground-dwelling
    winged being, then visits Gaasyendiet'ha, strikes him with a mallet and later
    with a flag stalk after learning the old man's stated vulnerability. Finally he
    encounters a man living in a lodge in a high rock, names him Gwiyee, and tells
    him to be quiet and not chase people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oanyadjigowa tells Genonsgwa and his people he would be glad if they caught
    him; angry pursuers follow but cannot catch him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oanyadjigowa begins to fly upward until he reaches the clouds, where he sees
    people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man in the clouds wears beautiful downy clothes, asks Oanyadjigowa where
    he came from, and is later associated with the name S^hadahgeah in the narration.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: From the cloud place, Oanyadjigowa looks straight down and sees all over the
    world; it does not seem far down to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cloud man warns Oanyadjigowa not to act against the lake-side man, who
    is said to have great orenda and to be chief of all gods; he also warns that the
    Wind will kill Oanyadjigowa if he stays.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After going down, Oanyadjigowa sees someone coming out of the ground and questions
    him about living there and about Hanisheonon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ground-dwelling being says he can kill people; Oanyadjigowa names him
    Onoqgontgowa, and the narration identifies him as a winged Djihonsdonqgwen who
    buzzes or cries.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Ganyadjigowa enters Gaasyendiet'ha's lodge, finds an old man asleep, strikes
    him on the head with a mallet, then calls him grandfather and is told to sit by
    the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ganyadjigowa asks what can kill Gaasyendiet'ha; after being told a swamp flag
    stalk can do so, he finds one and strikes the old man with it while the old man's
    face is red from cranberries.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Ganyadjigowa sees a lodge in the side of a high rock, talks with its inhabitant,
    names him Gwiyee, and tells him to be quiet and not chase people.
  category: action
  evidence_refs:
  - ev:9
