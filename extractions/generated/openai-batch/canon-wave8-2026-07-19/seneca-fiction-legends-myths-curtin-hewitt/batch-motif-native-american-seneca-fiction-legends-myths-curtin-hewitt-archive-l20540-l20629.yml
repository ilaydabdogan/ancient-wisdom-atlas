canonical_text:
  quote: ''
  summary: A hunter flees his wife after she becomes a cannibal. He hides his dog
    in a hollow tree, receives help from an old river man who demands fish and groundnuts,
    eats an empowering meal, and crosses the river on the old man's stretched neck.
    The cannibal wife pursues, refuses the cooked food, attempts the same crossing,
    falls into the dangerous river, and is devoured except for her stomach, which
    contains her life and is destroyed by the hunter's three aunts. The hunter continues
    and meets a young woman gathering fuel.
  language: English
  quote_policy: summarized
