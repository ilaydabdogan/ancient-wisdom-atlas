canonical_text:
  quote: ''
  summary: A brief closing episode describes Haiendonnis using spittle and opposing
    orenda to manipulate his wife Yenongaa’s hair, making it long and neutralizing
    her orenda. A new tale begins with an uncle and two nephews living in the forest.
    The elder nephew makes a turkey-skin robe for the younger, who comes to look and
    move like a turkey and is called Turkey Brother. When the elder is old enough
    to marry, the uncle sends him toward a chief’s daughters, equips him with magical
    animal-skin garments and weapons, and warns him about a dangerous spring and an
    old sorcerer-robber on the path.
  language: English
  quote_policy: summarized
