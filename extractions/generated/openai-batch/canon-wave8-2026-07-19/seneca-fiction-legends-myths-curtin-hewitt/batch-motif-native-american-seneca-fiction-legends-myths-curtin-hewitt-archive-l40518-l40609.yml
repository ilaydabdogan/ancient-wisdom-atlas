canonical_text:
  quote: ''
  summary: An eldest daughter secretly follows Doadanegen to a hunting tree but fails
    to capture him and returns home. Her mother then prepares the youngest daughter
    with a basket of twenty marriage cakes and instructions. The youngest daughter
    tracks Doadanegen, approaches him at the tree without being perceived, induces
    him to rest with his head in her lap while she dresses his hair, and after he
    sleeps places him in a bag and carries him to a steep rock, where she tries to
    wake him.
  language: English
  quote_policy: summarized
