canonical_text:
  quote: This rock is on the edge of the Blue Sky, where it meets the waters, just
    where the sun sets.
  summary: Haiwanenqgwi visits several peoples and chiefs to invite them to a great
    council at Broken Land. After returning, Tsodiqgwadon sends him westward inside
    an arrow to the Rock in the Blue Sky, where Gaasyendiet'ha lives under a red-hot
    white flint rock above a cavern. Gaasyendiet'ha accepts the council invitation
    and sends Haiwanenqgwi back in the arrow. Tsodiqgwadon then tells him that more
    distant eastern, northern, northeastern, and western island peoples still must
    be notified.
  language: English
  quote_policy: quoted
