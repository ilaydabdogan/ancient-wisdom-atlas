canonical_text:
  quote: ''
  summary: S'hodie'o'sko' and Ongwe' Hanges'ha' camp by a fire. During the night S'hodie'o'sko'
    blows sparks and coals onto Ongwe' Hanges'ha' and denies responsibility. The two
    then reach a gathering where people are shooting at a hawk or bird perched atop
    an old woman's tree; the old woman promises her youngest daughter to the one who
    hits it. Ongwe' Hanges'ha', described as immune from hostile orenda or enchantment,
    shoots the bird, withdraws his arrow when others cannot, and is declared the old
    woman's son-in-law. He is led to the lodge and to the daughter, who is described
    as born with a caul and therefore noble or 'down fended.' He takes up residence
    in his wife's family and later announces a hunt to his three brothers-in-law.
  language: English
  quote_policy: summarized
