canonical_text:
  quote: ''
  summary: A bereaved mother and father repeat a memorial feast for their lost child
    at the hunting camp where he disappeared, setting aside food for him. While returning
    home by canoe, the mother sees the child on a shrub-covered mountain by the river.
    The parents pursue and recover him; he is frightened, unable to answer, and partly
    covered with fine fur like a bear. After returning home, he gradually regains
    speech and tells that a strange man carried him away to strange people. He brings
    back a message enabling his people to perform the ceremony of the Bears and teaches
    them the Bears' songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother prepares food, places it on the ground in the customary eating
    place, sets aside a portion, and says the child becomes the owner and disposer
    of that food during a feast called the reunion of the living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the earlier feast, the parents leave the hunting place by canoe and
    return to their own people because the mother is not at peace about what happened.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near the anniversary of the child's disappearance, the mother proposes returning
    to the place where the child was lost to prepare food there again; the husband
    agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the former camp, the parents kindle fire in the same place again, and on
    the anniversary they hold another feast, set aside food for the lost child, and
    give thanks for life and food.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: While traveling home by canoe, the woman sits in the bow, sees a mountain
    by the river covered with dense shrubs and undergrowth, and recognizes her lost
    child walking near the undergrowth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The father also recognizes the son, brings the canoe to shore, and both parents
    pursue the child when he flees into the shrubbery.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The father catches the child; the child does not answer questions and appears
    too frightened to understand the parents.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The recovered child's face, hands, and feet appear natural, while the rest
