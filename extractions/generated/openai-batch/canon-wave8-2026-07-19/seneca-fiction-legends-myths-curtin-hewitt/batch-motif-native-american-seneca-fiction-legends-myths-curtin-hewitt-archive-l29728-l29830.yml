  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: After returning to the home lodge, neighbor children visit and play with the
    recovered child; at first he cannot converse, but later he regains the ability
    to talk.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The child later tells his parents that a strange man carried him away to his
    home, and he describes strange things, travels with strange people, and their
    food.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The child says the strange man instructed him to carry back a detailed message;
    this message enables the people to perform the ceremony of the Bears, and the
