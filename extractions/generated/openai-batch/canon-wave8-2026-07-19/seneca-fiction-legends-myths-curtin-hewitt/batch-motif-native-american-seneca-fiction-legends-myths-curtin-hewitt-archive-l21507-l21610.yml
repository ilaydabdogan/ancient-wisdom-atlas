canonical_text:
  quote: ''
  summary: A brief opening fragment describes debris forming a dam so that a river
    becomes a lake beside a mountain. The main tale introduces twelve brother-hunters
    with magical powers. The eldest is lured by a red-headed woodpecker that becomes
    a beautiful woman and is destroyed by another woman at a rock where many human
    bones lie. Other brothers disappear; one is put alive into the ground by two women
    until mold grows over him. When only the second brother and the youngest remain,
    the youngest insists on seeking their great uncle Dagwanoenyent, who knows everything
    but is dangerous. The youngest prepares hickory bark for the uncle, makes six
    arrows from whole trees, discovers a living mold-covered man underground, and
    then begins traveling north, using magical power over a mole to go underground
    near the uncle.
  language: English
  quote_policy: summarized
