  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the burning, Yenongaa stands looking in one direction as if spellbound
    until Haiendonnis takes her by the arm and tells her to go home with him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: People skilled in sorcery and enchantment, even at the edge of the world,
    know when Haiendonnis has killed the old woman and her daughters; a great shout
