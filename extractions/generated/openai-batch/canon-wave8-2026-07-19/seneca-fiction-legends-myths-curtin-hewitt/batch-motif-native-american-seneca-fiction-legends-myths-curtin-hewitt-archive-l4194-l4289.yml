canonical_text:
  quote: These were owls in human form.
  summary: Haiendonnis repeatedly deceives Yenongaa when she comes to his lodge, first
    by pretending to be an old man, then by changing into a small boy, and then by
    making himself invisible. After Yenongaa leaves a basket of corn bread behind
    and is sent back by her mother, she sees Haiendonnis in his real shape and says
    her mother sent her to live with him as his wife. The passage describes the couple
    as wicked sorcerous people full of orenda. Yenongaa’s mother later works to give
    her more evil-working orenda and instructs her to enslave her husband. Haiendonnis
    detects this, follows Yenongaa to her mother’s lodge, fights the mother with war
    clubs, and burns the lodge after the mother and two elder daughters are dead.
    Three owls fly from the embers to a nearby tree and are described as owls in human
    form. Distant sorcerers and people know the deaths have occurred and rejoice.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Haiendonnis expects Yenongaa to enter his lodge, gets his pipe, pretends to
    be an old man, and answers her in an old man’s voice that Haiendonnis is away
    for ten days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On Yenongaa’s next visit, Haiendonnis says he will change himself into a small
    boy; she ignores animated pouches representing Gaasyendiet'ha, Panther, and Fox,
    and a small-boy voice tells her Haiendonnis has gone to the other side of the
    world for about ten days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a later visit, Haiendonnis makes himself invisible; Yenongaa enters, sets
    down her basket, sits on his couch, hears him laugh, becomes frightened, and flees
    home without her basket of corn bread.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yenongaa’s mother asks about the missing basket, prepares to wash her daughter,
    sees deer intestines from Haiendonnis’s lodge clinging to her, takes them as good
    meat, and tells Yenongaa to return the next day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When Yenongaa returns, she sees Haiendonnis in his real shape and says her
    mother sent her to live with him as his wife; he agrees, and they live together
    as man and wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage characterizes Haiendonnis and Yenongaa as evil-minded and full
    of the orenda, or magic power, of sorcerers, and says all wizards and witches
    in the world know the moment they become man and wife.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yenongaa’s mother works over her to endow her with more evil-working orenda,
    instructs her how to enslave her husband, and tells her to urge him to come live
    with them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Haiendonnis perceives that Yenongaa is being equipped to enslave him, repeatedly
    foils the attempts, grows weary of the conduct of Yenongaa and her mother, and
    decides to destroy her people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Haiendonnis follows Yenongaa by a circuitous route, reaches her mother’s lodge
    before she does, challenges the old woman to fight, and fights her with war clubs
    while Yenongaa stands powerless to help either combatant.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Haiendonnis continues fighting until he is certain that the old mother and
    two elder daughters are dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After sending Yenongaa a little way off, Haiendonnis sets the lodge on fire;
    after the fire lessens, explosions occur among the embers and a horned owl, a
    common owl, and a screech owl fly to the upper limbs of a nearby tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that the three owls are owls in human form and that the
