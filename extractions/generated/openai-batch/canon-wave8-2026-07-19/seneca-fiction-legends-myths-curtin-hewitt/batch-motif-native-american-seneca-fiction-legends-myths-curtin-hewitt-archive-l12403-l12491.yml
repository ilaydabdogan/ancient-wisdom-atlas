canonical_text:
  quote: ''
  summary: 'A man and his dogs go west after the dogs have left two children near
    a village. A young woman and her grandmother hear the children crying, find them,
    and adopt them as their own. The boys grow quickly as hunters, foresee or discuss
    their father’s coming, and later recognize him. They search for his missing dogs,
    find them, and the dogs lead them home in the dark. The household is revealed
    as kin: the young woman is the man’s sister and the old woman his grandmother.
    The passage then begins another tale, naming Doonongaes and Tsodiqgwadon and introducing
    Doonongaes as a powerful claimant of Long Lake and its water life.'
  language: English
  quote_policy: summarized
