canonical_text:
  quote: ''
  summary: 'The passage concludes an episode about Sgagedi, who divides his body while
    traveling by canoe and reunites when the canoe lands; his wife bears twin boys
    who survive repeated immersion in the lake, grow quickly, take over his work,
    recover an old man identified as their uncle, and restore him to the household.
    The passage then begins the tale of Dagwanoenyent and Gaastendiet''ha: a disregarded
    man receives dream warnings from his Dream Spirit that his village will be destroyed,
    is instructed to hide in a cavern in a high hill, shoot at the approaching monster
    Dagwanoenyent, take part of its skin and hair for their orenda, and later finds
    the cavern refuge and kills a deer nearby.'
  language: English
  quote_policy: summarized
