canonical_text:
  quote: ''
  summary: Ot'hegwenhda asks his mother for her magic power so that he may kill old
    men who are connected with the deaths of his brothers. His mother obtains a small
    slate-rock figurine, tells him to carry it as a fetish, and says it will let him
    change form. Traveling north and east, he encounters a dust-cloud being identified
    as a Djieien or Spider and kills it with wasp-sting arrows from a tree. He then
    reaches a lodge where four old Hadiiades or Blacksnakes sit in the four corners.
    The fetish instructs him to go onto a high rock, gather sharp flints, and throw
    them with commands. After hiding at the smoke-hole and unsuccessfully shooting
    the old men, he uses the flints to set the lodge and forest on fire and to cut
    off the old men’s heads. After the burning, a Dagwanoenyent bursts out, knocks
    him from the rock, flies up to the Blue Sky, falls back, and is killed by him
    with a white flint. He searches the coals, finds only fire, and follows a northwest
    trail as the passage ends.
  language: English
  quote_policy: summarized
