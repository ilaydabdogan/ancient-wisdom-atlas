canonical_text:
  quote: ''
  summary: The passage describes a powerful Seneca medicine tested in water, its rules
    for administration by hochinagen, taboos protecting its potency, tobacco offerings
    to the medicine and a running stream, supporting songs, and a recovery feast honoring
    the medicine and curing spirits. It also identifies the medicine as the one made
    by birds to bring Bloody Hand to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A minute portion of medicine powder was placed into a cup of water, with portions
    sprinkled on the east side, west side, and side nearest the patient's lips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the powder stayed on the water's surface and the water became syrup-like,
    the patient was expected to die; if the powder dissolved and the water remained
    clear, the patient was expected to live and drink the solution.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The medicine is identified as the same medicine made by birds when they brought
    Bloody Hand to life, and it is described as very powerful in orenda.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A patient who took the medicine was forbidden to eat colored food and could
    eat pure white beans and pure white cob corn; eating black or otherwise colored
    food broke the taboo and destroyed the medicine's virtue, causing death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who had stopped to see a corpse and then looked at the patient would
    make the patient worse and shortly cause death; a skin or blanket could be hung
    to prevent such sight.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The smell of burning or broiling meat harmed the medicine's virtue, and a
    woman during her catamenial period was not permitted to look at the patient.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A patient who had taken the medicine was not to be seen by anyone for four
    days except the caretaker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the medicine was tried, the sick person or a friend gave native tobacco
    and another small present to the medicine holder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The medicine holder burned a piece of tobacco and addressed the medicine before
    visiting the patient.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The medicine holder made a tobacco offering to a running stream in the patient's
    name and dipped water with the current, not against it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the patient was very ill, other medicine holders assisted, white beans
    were cooked for the ritual group, and tobacco was burned to strengthen the medicine
    as directed by the birds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Songs accompanied the medicine, including words announcing that the medicine
    is to be taken and should begin working over the patient's body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: If the patient recovered, a feast with hulled corn and meat or venison was
    prepared, and the medicine holders sang and danced in honor of the medicine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Feast songs say that spirits came and cured the ill person, dismiss them with
    thanksgiving, and include lines about the plant place, mountain, falls, beyond
