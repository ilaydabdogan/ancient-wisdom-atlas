canonical_text:
  quote: ''
  summary: A young wife, angered by the youngest brother's refusal of her seduction,
    wounds herself and falsely accuses him. The older brothers decide to kill him
    but cannot cut his throat because of his orenda. He says only his sister can kill
    him and instructs the brothers to place his body and his living sister in a strongly
    built log lodge. The sister beheads him; later a witch-caused hurricane arrives,
    his head reunites with his body, and he comes back to life. The sister tries to
    protect his eyes, but his eyes are taken during the storm; the older brothers
    are destroyed, while the sealed log lodge remains intact.
  language: English
  quote_policy: summarized
