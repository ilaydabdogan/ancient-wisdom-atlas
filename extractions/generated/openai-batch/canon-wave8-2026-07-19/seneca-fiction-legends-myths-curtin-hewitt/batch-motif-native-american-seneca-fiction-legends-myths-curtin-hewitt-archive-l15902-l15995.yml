canonical_text:
  quote: ''
  summary: A prior tale fragment ends with a hunter rescuing a speechless child from
    a tree and returning him to his father. In the main tale, an old woman living
    in the forest with two grandchildren loses the girl when a female Genonsgwa swallows
    her. The Genonsgwa carries the boy on her back into the woods, intending to eat
    him but unable to reach him while he clings fast. The grandmother tracks them,
    follows in the form of a Whirlwind, exposes the Genonsgwa’s hiding place, directs
    the boy to get off, and kills the Genonsgwa by breaking her stone clothing with
    rocks. The grandmother tells the boy he is also a Dagwanoenyentgowa and can master
    the Genonsgwa if he uses his power. Genonsgwa people plan revenge, while the grandmother
    and boy begin an effort to recover the swallowed sister, burning tobacco on a
    small fire and fanning smoke toward the dead Genonsgwa.
  language: English
  quote_policy: summarized
