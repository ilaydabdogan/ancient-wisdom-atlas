canonical_text:
  quote: ''
  summary: The passage closes one episode in which the younger of two brothers kills
    a chief associated with man-eaters, frees captive carnivorous animals, assigns
    the bear to cliffs and mountains, and the brothers are accepted as chiefs before
    returning home. It then begins a new episode about a bald-headed old man chief
    living on a mountain, his wife and children near a lake, and the chief’s council
    request for someone to learn the size of the world. A young man travels for two
    months, reaches an all-white country that hurts his feet, turns back, and the
    chief doubts that he has gone around the world.
  language: English
  quote_policy: summarized
