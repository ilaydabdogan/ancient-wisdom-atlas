  summary: The introductory passage criticizes hurried and indiscriminate collection
    of American Indian oral literature, argues that sacred and poetic lore requires
    the confidence of knowledgeable teachers, priests, shamans, statesmen, and wise
    community members, rejects the claim that morally elevated myths result from Christian
    influence, praises sympathetic collectors such as Cushing, Matthews, and Curtin,
    and lists several Seneca persons from whom Curtin obtained material.
