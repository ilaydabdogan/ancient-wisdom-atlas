canonical_text:
  quote: ''
  summary: After eating, Hodadenon is left alone while his elder sister gathers fuel.
    He hears a male person in the loft ask for tobacco, finds him with a large head
    and enormous hair, and gives him all the remaining tobacco in a pipe. Smoke covers
    the man’s head and many mice emerge from his hair. The sister returns, rebukes
    Hodadenon for using all the tobacco, and explains that the man smokes only once
    a year and depends on the tobacco to live. She reveals that the distant tobacco
    region is full of female sorceresses and that many kin and brothers have been
    lost there. Hodadenon insists on attempting the journey, receives provisions in
    a wrapped bundle, delays his departure once, and is then told that the path leads
    south and is marked by old fires, forked rods, and pieces of bread.
  language: English
  quote_policy: summarized
