canonical_text:
  quote: ''
  summary: A father secretly observes his wife sending their son for water, then follows
    her to a dry black ash tree where she strikes it four times and summons a bird
    that becomes a man. After the husband shoots at the lover, the lover turns back
    into a bird and vanishes. The wife beats the husband, burns the lodge, creates
    a snowstorm by throwing ashes into the air, leaves the children with a dog, and
    departs. The father rescues the children, instructs the boy to feed the dog, carry
    his sister, and heed the dog’s uneasiness, then pursues the mother. The children
    receive ready-made meals, but during an outing the boy briefly unstraps his sister
    to pursue turkeys, and a bear carries her off. After losing the bear and dog,
    the boy tries to die by leaping into a lake; he is swallowed by a great fish,
    which later enters a stream and is caught by two sisters at their fish dam.
  language: English
  quote_policy: summarized
