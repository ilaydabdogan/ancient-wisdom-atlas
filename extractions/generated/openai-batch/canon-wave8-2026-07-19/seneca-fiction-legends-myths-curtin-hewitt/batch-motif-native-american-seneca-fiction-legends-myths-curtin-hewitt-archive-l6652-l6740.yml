canonical_text:
  quote: ''
  summary: 'A pursuing Ganiagwaihegowa woman is delayed by an old man and then follows
    a brother and sister toward a lodge of powerful Djogeon helpers. The helpers trap
    and burn her with boiling bear oil, kill her with red-willow arrows, and burn
    her bones so she cannot revive. The siblings are later escorted home. A note describes
    a yellow hair tuft containing orenda that makes arrows return home. A new tale
    begins: after a woman dies giving birth to a tiny lively boy, the father leaves
    the infant in a hollow tree. The older brother feeds and strengthens him, clothes
    him in fawn skin, and the father later tries to catch the timid child by turning
    into an old stump full of mice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man lays a long net across the trail, catches the approaching Ganiagwaihegowa
    for a time, and denies having seen the two fugitives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brother and sister reach their grandfather and find S'hagodiyoweqgowa,
    who has rattles and directs them to a lodge whose people have strong sorcery and
    great orenda.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bear or Ganiagwaihegowa reaches S'hagodiyoweqgowa and kills him after
    a hard fight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fugitives reach a lodge where a very small old Djogeon woman has three
    sons and much bear fat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Djogeon woman instructs her sons to make fires on the siblings' tracks,
    boil bear oil in kettles, and make red-willow arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Djogeon woman tells the Ganiagwaihegowa to pass through the fires and
    kettles the same way the tracked fugitives did; the Ganiagwaihegowa overturns
    both kettles and is badly burned by boiling oil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The three boys kill the Ganiagwaihegowa with red-willow arrows and burn her
    bones to powder so that she cannot come to life again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Djogeon woman says the old Ganiagwaihegowa woman had stolen a young boy
    and girl and wanted the girl to marry her son; the Djogeon sons escort the siblings
    partway home and direct them the rest of the way.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Ganiagwaihegowa woman's boy had a tuft of yellow hair; after it was cut
    off and fastened to another man's head, the possessor's arrows could return home
    by themselves because the orenda was in the tuft.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the next tale, a man, his wife, and their older son live in an ugly lodge
    in the woods; the wife gives birth to a second boy who is no longer than a hand
    and is bright and lively.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The father wraps the tiny baby and places him in a hollow tree because he
    thinks he cannot live; he then burns the mother’s body after her death in childbirth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The older brother hears the baby crying in the hollow log, feeds him deer-intestine
    soup, and the baby becomes stronger and comes out to play.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The older brother makes the little boy a fawn-skin coat; the father later
    notices small tracks and reduced provisions and learns that the little brother
    is alive.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The father plans to catch the timid little child by luring him to hunt mice,
    fills himself with mice, and turns himself into an old stump full of mice.
  category: action
  evidence_refs:
  - ev:13
