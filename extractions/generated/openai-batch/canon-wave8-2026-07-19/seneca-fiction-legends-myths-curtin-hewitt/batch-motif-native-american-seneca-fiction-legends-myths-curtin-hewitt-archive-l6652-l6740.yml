candidate_motifs:
- id: motif:1
  label: fugitive siblings aided by successive helpers against a pursuing monster
  taxonomy_refs:
  - sibling_pair
  basis: The brother and sister flee the Ganiagwaihegowa and receive aid or direction
    from an old man, their grandfather’s location, S'hagodiyoweqgowa, and the Djogeon
    lodge.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:7
  confidence: high
  cautions: The extracted passage begins in the middle of the pursuit, so earlier
    circumstances of the flight are outside the provided text.
- id: motif:2
  label: pursuer tricked into following a dangerous path
  taxonomy_refs: []
  basis: The Djogeon woman insists that the Ganiagwaihegowa follow the same route
    as the tracked fugitives, through the fires and kettles, which burns the pursuer.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not state whether the siblings themselves actually passed
    through the fires; the command functions as the stated trick.
- id: motif:3
  label: monster destroyed so it cannot revive
  taxonomy_refs:
  - resurrection
  basis: After killing the Ganiagwaihegowa, the boys burn her bones to powder so that
    the monster cannot come to life again.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage refers to preventing revival rather than narrating an actual
    resurrection.
- id: motif:4
  label: abduction for forced marriage
  taxonomy_refs:
  - stolen_beloved
  basis: The Djogeon woman says the Ganiagwaihegowa stole a young boy and girl and
    wanted to make the girl marry her son.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The girl is abducted with her brother; the passage gives this as an explanation
    after the rescue rather than as a fully narrated marriage episode.
- id: motif:5
  label: power contained in a body token
  taxonomy_refs: []
  basis: The yellow hair tuft contains orenda, and when transferred to another head
    it transfers the power that makes arrows return home.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No broader taxonomy reference is assigned because the passage frames the
    object specifically as a tuft with orenda.
- id: motif:6
  label: miraculous tiny child survives exposure
  taxonomy_refs:
  - miraculous_child
  basis: A baby no longer than a hand is bright and lively, is left in a hollow tree
    because his father thinks he cannot live, and survives until his brother feeds
    him.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage has only the opening of the tale, so later proof of the child’s
    potency is not included here.
- id: motif:7
  label: elder sibling rescues and nurtures younger sibling
  taxonomy_refs:
  - sibling_pair
  basis: The older brother finds the little brother, feeds him deer-intestine soup,
    helps him grow stronger, and makes him clothing.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: This motif is confined to the provided opening episode.
- id: motif:8
  label: shapeshifted lure to catch a child
  taxonomy_refs:
  - shapeshifter
  basis: The father gathers mice around his body and turns himself into an old stump
    full of mice in order to catch the timid little child.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage ends before the outcome of the attempted capture is given.
