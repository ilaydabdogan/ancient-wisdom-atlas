canonical_text:
  quote: ''
  summary: A nephew uses his mole guardian to hide from a furious woman or witch who
    comes as tempest and whirlwind. The witch twice kills him by lifting earth and
    casting him down, but the mole restores him by breath. The nephew travels north,
    finds his uncle pinned beneath a great elm tree, releases him, and later learns
    the witch's path and limits. He kills and burns her, but she revives. He finally
    kills her again, burns and powders her remains, divides the powder into three
    skin bags, and warns that the portions must remain apart during storms so her
    force cannot reunite. The nephew, uncle, and boy then live prosperously at the
    Long Lodge.
  language: English
  quote_policy: summarized
