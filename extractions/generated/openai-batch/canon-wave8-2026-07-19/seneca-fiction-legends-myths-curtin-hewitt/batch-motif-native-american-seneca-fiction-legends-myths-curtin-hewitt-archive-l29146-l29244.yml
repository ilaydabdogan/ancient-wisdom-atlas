canonical_text:
  quote: ''
  summary: 'The Bean-Woman seeks a husband and asks each suitor what food he will
    provide. Panther-Man, Deer-Man, Bear-Man, and Wolf-Man are rejected because their
    foods are unsuitable to her. Corn-Man offers corn, and Bean-Woman accepts him,
    embraces him, and says this condition was established by the creator from the
    new-earth time; the passage explains that this is why bean vines entwine around
    cornstalks. A new legend begins in ancient Tuscarora land: Corn-Woman is said
    to have declared an event involving a lonely sick man without fire or food. While
    lying ill, he hears unseen women discuss helping him because he had formerly honored
    and cared for their lost sisters.'
  language: English
  quote_policy: summarized
