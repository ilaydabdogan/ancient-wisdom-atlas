canonical_text:
  quote: ''
  summary: A found man is adopted as a brother despite the household uncle being a
    man-eater. Three brothers disappear after encountering an old woman in a clearing
    who turns them into bones. The-Found-One summons Dagwanoenyent, the Great Head,
    by arrows and a stone-filled platform. Dagwanoenyent kills the old woman, directs
    The-Found-One to assemble the bones and use a hickory tree command, and the dead
    relatives come back to life. The man-eater renounces eating people, and the group
    returns home.
  language: English
  quote_policy: summarized
