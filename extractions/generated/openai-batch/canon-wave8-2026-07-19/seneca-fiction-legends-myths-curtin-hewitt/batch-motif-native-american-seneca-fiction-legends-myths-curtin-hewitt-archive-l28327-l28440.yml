canonical_text:
  quote: ''
  summary: The passage concludes a story in which Dehaenhyowens and two companions,
    the only surviving returnees after a long absence, are ceremonially welcomed by
    a chief and the people. The community greets them by stroking their bodies, promises
    equality and peaceful association, celebrates with lacrosse and the Song of the
    Pigeons, and rejoices in their safe return. The passage then begins an address
    of thanksgiving, giving thanks to the Earth, sky, day and night light orbs, Thunderers,
    protective servants of the Master of Life, and the Finisher-of-our-lives. It introduces
    the Great Feather Dance as a ceremony given for human benefit and performed in
    honor of the Master of Life, with song, festival attire, painted faces, feather
    headdresses, and officials who promote the Six Ceremonies.
  language: English
  quote_policy: summarized
