canonical_text:
  quote: ''
  summary: 'A mother teaches her son how to enlarge and reduce a tiny dog that will
    protect and carry him. She instructs him to obtain oil from a live wild turkey
    gobbler to reunite the severed parts of her body. The son captures the turkey,
    summons the Black Chief of the Crows to retrieve his mother’s lower body from
    an assembly lodge where people are taking wampum from it, and returns home on
    the giant dog. The turkey oil is applied to the severed surfaces, the body parts
    join, and the woman becomes whole. The passage then begins another tale: Seneca
    hunters abandon an orphaned infant in a hunting lodge with wood and meat; a chief
    sends a man who becomes a bear to check on him; the child survives by fire and
    cooked meat until supplies run low and someone comes to the door.'
  language: English
  quote_policy: summarized
