canonical_text:
  quote: ''
  summary: Dehaenhyowens and his companions are brought by Teharonhiawagon to the
    lodge of an aged woman, who accepts them under her care. The visitors observe
    her making a mantle from human hair while a small cur unravels it when she leaves.
    Male household members return from hunting, greet the visitors, and later eat
    by absorbing only the odor of food. The old woman produces corn and squash from
    single seeds within hours and cooks them with venison brought for the human guests.
    She later burns corn husks around a round lake in an adjoining room, causing the
    water to be consumed, then sends the hunters out with a warning not to injure
    anyone.
  language: English
  quote_policy: summarized
