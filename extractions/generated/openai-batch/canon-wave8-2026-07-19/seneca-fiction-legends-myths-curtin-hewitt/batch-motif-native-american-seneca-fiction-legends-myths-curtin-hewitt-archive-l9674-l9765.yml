canonical_text:
  quote: ''
  summary: 'Hongak confronts Ganyadjigowa at a tree, fights him, and pursues him into
    swift water, where Hongak dies while Ganyadjigowa survives. Later Ganyadjigowa
    has two dreams involving two powerful animals: first they threaten him, then he
    controls them as conveyance to the end of the earth. He visits old men named Djothowandon
    and Dagwanoenyent; Dagwanoenyent warns him to leave before midday because something
    will chase him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hongak comes to the tree where Ganyadjigowa is staying, calls him out, and
    asks whether Ganyadjigowa knows who he is.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hongak accuses Ganyadjigowa of having done something to stop him and shows
    that the feathers are gone from the part of his back where a stone had been secured.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hongak begins fighting Ganyadjigowa; Ganyadjigowa runs away because he does
    not want to fight, but Hongak overtakes him and the fighting continues until dark
    the next day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ganyadjigowa tries to swim a swift river, is carried into rough water, and
    remains all night on a stone in the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hongak tracks Ganyadjigowa to the water, tries to swim after him, is carried
    to the same stone, fills with water, dies, and floats to shore.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Hongak dies, Ganyadjigowa says that he has more orenda than Hongak had
    and then travels home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: In a dream, Ganyadjigowa is going west, sees a Ganiagwaihe approaching from
    the southeast, identifies it as a bear that may eat him, and then sees a Djainosgowa
    coming from the northwest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the same dream, the two animals fight, move near Ganyadjigowa, and he falls
    into a hole with the animals on him before waking wrapped in his skin blankets
    on the floor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In a second dream, the same creatures are in the woods and belong to Ganyadjigowa;
    he places a stick across them, sits on it, and orders them to go westward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The animals carry Ganyadjigowa quickly to the end of the earth, where he leaves
    them and goes south to a lodge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the southern lodge, Ganyadjigowa meets a fine-looking old man named Djothowandon,
    says he is traveling around the earth from the Great Lake, and is told that Djothowandon's
    master lives nearby.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Ganyadjigowa reaches a lodge standing on a big rock by following a narrow
    ledge around the rock and meets an old man by the fire named Dagwanoenyent.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Dagwanoenyent identifies Djothowandon as his servant, says the servant has
    gone to the southern end of the world to make very cross people peaceful, and
    warns Ganyadjigowa to go home because something will chase him if he remains there
    at midday.
  category: speech
  evidence_refs:
  - ev:5
