canonical_text:
  quote: ''
  summary: Doonongaes redirects a chief's daughter, who had agreed to marry him because
    he killed an eagle, to marry the Shabby Man. After staying with an old woman,
    he journeys toward the southern end of the earth, encounters a Djainosgowa family
    guarding an opening, flees to Tsodiqgwadon, and is hidden from a Djainosgowa tracker.
    Tsodiqgwadon sends him north to summon Deanohdjes for a world council at Broken
    Land, but by sorcery makes him travel in circles. On a second attempt Doonongaes
    crosses long openings and reaches a lodge where an Osigweon old man smells a human
    being and invites him in as nephew.
  language: English
  quote_policy: summarized
