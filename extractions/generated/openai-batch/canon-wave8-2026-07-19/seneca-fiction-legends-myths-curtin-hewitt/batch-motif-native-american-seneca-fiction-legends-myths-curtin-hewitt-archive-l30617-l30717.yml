canonical_text:
  quote: ''
  summary: 'A boy hears a man speaking from a rock, gives a bird as payment, and returns
    to hear legends. Others accompany him, and the practice of gathering at the rock
    to hear legends spreads. The boy grows old and receives wood, meat, bread, and
    tobacco from people who come to hear him tell legends. The narrator explains that
    legends are stories of people from a former world who possessed powerful orenda.
    The passage then begins another legend: a hunter camps in a forest with four dogs;
    a dog warns him of large stealthy beings called Genonsgwa and instructs him to
    flee with three torches, using nearly burned-out torches placed in forked branches
    to delay the pursuer.'
  language: English
  quote_policy: summarized
