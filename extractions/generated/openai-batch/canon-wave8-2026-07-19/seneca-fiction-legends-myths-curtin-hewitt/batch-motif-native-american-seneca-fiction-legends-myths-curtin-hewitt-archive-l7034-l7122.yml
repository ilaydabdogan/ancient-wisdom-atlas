canonical_text:
  quote: ''
  summary: A boy is found inside a fish and adopted by two sisters. He becomes a skilled
    hunter but is repeatedly warned not to go toward the setting sun. He disobeys,
    encounters strange old men in successive clearings, accepts head-wager games,
    wins, beheads the defeated old men, burns their cabins, and continues farther
    west to a third cabin near an ice-covered pond.
  language: English
  quote_policy: summarized
