canonical_text:
  quote: ''
  summary: A youth visits a fourth older uncle, wins a head-stakes bone-dice game
    using borrowed duck eyes as dice, kills and burns the old man, and restores the
    eyes to the ducks. Later, while the youth summons game animals by singing, his
    grandmother violates his warning not to look; a great white deer carries him away
    on its antlers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth begins by seeming to travel south, then changes course northward,
    circles his home, and reaches a fourth opening with a lodge in its center.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the fourth lodge is a man older than the youth's other uncles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man says he plays the bone-dice game with visitors, each person has
    one throw, and the wager is their heads.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The youth asks ducks for magical aid and requests the temporary loan of six
    right eyes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Six ducks remove their right eyes and give them to the youth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The youth instructs the eyes to fall one way for the old man's throw and all
    right side up for his own throw.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The game is played with a bowl placed on a deerskin, using the youth's dice.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: During the throws, the dice rise as quacking ducks and then return to the
    bowl as dice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The youth's throw returns all the dice right side up, and he declares that
    he has won the game.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The youth cuts off the old man's head with a flint knife, places the head
    and body in the lodge, and sets the lodge on fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the old man's head bursts open, an owl flies out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The youth moistens the borrowed eyes with spittle, replaces them in the ducks'
    heads, thanks the ducks, and dismisses them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The grandmother says she is pleased and states that the youth's brothers had
    been destroyed by their uncles.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The youth makes many white-ash arrows and says he will sing so that game will
    come to him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The youth seats his grandmother on a deerskin, covers her head with it, and
    warns her not to look out or he will leave and never return.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: As the youth sings for elk, bears, raccoons, and deer, many animals run toward
    him and he shoots arrows at them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The grandmother removes the covering and looks through the smoke-hole; immediately
    a great white deer carries the youth away on its antlers into the forest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The other animals follow the youth while he continues singing, and the grandmother
    later sees killed game but does not find her grandson.
  category: sequence
  evidence_refs:
  - ev:8
