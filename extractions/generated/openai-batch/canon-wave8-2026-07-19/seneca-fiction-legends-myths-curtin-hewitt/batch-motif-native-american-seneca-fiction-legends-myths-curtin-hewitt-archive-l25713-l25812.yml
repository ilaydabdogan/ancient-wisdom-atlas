canonical_text:
  quote: ''
  summary: The passage closes one tale in which a wife returns through passageways
    guarded by panthers, restores her husband's body by preparing it and pouring his
    life from a gourd bottle into his mouth, and the couple later dies and goes to
    the land of the Mother of Ghosts. It then begins the legend of Hodadenon and his
    elder sister, two remaining siblings living alone in a long lodge after sorcerers
    have destroyed their kin. The boy receives a bow and arrow from his sister, kills
    a large animal called O'soont, repeatedly asks its name and whether it tastes
    good, and eats it with his sister before planning another hunt.
  language: English
  quote_policy: summarized
