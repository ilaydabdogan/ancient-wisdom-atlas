canonical_text:
  quote: ''
  summary: A young man receives instructions from his maternal uncle for a dangerous
    journey and for a conditional son-in-law ritual involving pipe smoke, buckskin,
    and wampum. After asking for the uncle's orenda, he sets out along a route marked
    by ten fireplace camps. He quickly reaches the first camp, returns for clarification,
    is described by the uncle as immune to sorcery, and receives a new name. He then
    passes the camping places to the tenth, hears eastbound travelers, and meets a
    very old, very small ragged man identified as S'hodie'o'ko. The old man says travelers
    go in pairs toward a place where Hawks on a woman's tree foretell. The two travel
    together; the old man leads, diverts into the forest, and asks the youth to shoot
    a treed fisher. The youth kills it, worries that his arrow has lost orenda, and
    the old man returns the arrow, claiming he cannot de-magicize it.
  language: English
  quote_policy: summarized
