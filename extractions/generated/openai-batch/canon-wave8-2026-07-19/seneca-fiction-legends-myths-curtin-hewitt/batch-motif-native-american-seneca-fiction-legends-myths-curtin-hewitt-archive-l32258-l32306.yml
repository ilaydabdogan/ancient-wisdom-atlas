canonical_text:
  quote: ''
  summary: A young man shoots an arrow into the great swollen body of S'hagowenot'ha,
    releasing waters and enabling the canoe carrying him and his sister to reach the
    destination. He frees the wild geese whom S'hagowenot'ha had made servants, invokes
    the Creator's will against bondage, and establishes their future wedge-shaped
    movement. The brother and sister then travel home, where he reflects on their
    uncle Okteondon, their sibling relationship, and their future camp roles.
  language: English
  quote_policy: summarized
