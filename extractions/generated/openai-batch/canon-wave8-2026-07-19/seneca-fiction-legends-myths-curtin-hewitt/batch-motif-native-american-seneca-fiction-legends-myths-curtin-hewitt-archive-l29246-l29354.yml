canonical_text:
  quote: ''
  summary: An ill man dreams of a beautiful woman who says that Corn, Bean, and the
    Seed of the Ancient Squash will repay his past kindness by helping him recover.
    He is instructed to collect and drink rainwater, recovers, hears Corn women singing
    from dried ears of corn, learns Corn songs and dances, and transmits them to his
    people, whose elders establish the ceremony. Later he sees Corn, Bean, and Squash
    people dancing in a planted field. The passage explains the seasonal use of the
    Corn dances and songs called Gonda'gonwi'sas. The excerpt then begins a separate
    tale, titled as the origin of White Corn, in which a community below a high cliff
    hears a mysterious woman singing to an old respected man from the mountain top.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ill man dreams of a woman of low stature, fine appearance, and long hair,
    who tells him that aid will come for his illness and that he should stop thinking
    he is about to die.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dream woman instructs the man to place a receptacle for coming raindrops
    and drink all the water collected in it as the cure for his illness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says that Corn, Bean, and the Seed of the Ancient Squash are sisters
    and are repaying the man because he formerly picked them up and pitied them when
    they lay lost on trails.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dream speaker says the crop sisters sing and dance Corn dances when they
    are happy and give thanks during stages of human cultivation, harvest, drying,
    and storage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dream speaker tells the man to instruct human beings to sing and dance
    the Corn dances as thanksgiving when the crops mature, because the crops assist
    humans by furnishing food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After waking, the man sees an approaching rainstorm, places a bark bowl outside
    the lodge, drinks the collected rainwater, and begins to recover.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The following night he hears women singing; strings of ears of corn on drying
    poles in the lodge sway slightly, and the singing comes from grains of corn in
    the guise of women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man returns to his people, recounts his experiences, and sings the songs
    he heard from the Corn women; the Council of Ancients says the ceremony should
    be performed regularly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Later the man hears the Corn women singing again in the planted field and
    sees a large company of Corn people, Bean people, and Squash people appearing
    as perfect human beings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The crop people dance slowly and gently in imitation of corn stalks waving
    in the ground, with women and girls taking part.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that from this time Corn dances and songs were known and
    used at seasonal anniversaries from planting corn grains through storing strings
    of ears of corn in lodges; the ceremony is named Gonda'gonwi'sas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The excerpt then introduces a tale titled the origin of White Corn, set in
    a community at the foot of a high, steep, rugged cliff where people hear a woman
    singing from the mountain top to an old respected man.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The mountain-top woman’s song addresses the old man as a kinsman of her father’s
    brother and says that she greatly desires to become his wife.
  category: speech
  evidence_refs:
  - ev:9
