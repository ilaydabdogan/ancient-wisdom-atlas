canonical_text:
  quote: ''
  summary: In an interlinear Seneca-English passage, speakers discuss likeness, brotherhood,
    an uncle, and Okteondon, then propose going to a place to amuse themselves. A
    human speaker summons wild geese to a canoe and describes them as his several
    slaves or attendants. The geese alight beside the canoe, attach themselves to
    it, and carry or accompany it toward an island. The human instructs them about
    returning with the canoe when called. At the island a large white stone is noticed.
    The human says he will amuse himself there, undresses, throws the white stone
    into the water or depth, and then casts his own body into the water while a nephew
    or observer is present. The passage ends with Okteondon again mentioned.
  language: English with Seneca interlinear text and English glosses
