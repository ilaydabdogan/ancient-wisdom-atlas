canonical_text:
  quote: creation is described as Spring on a universal scale
  summary: The passage discusses American Indian origin myths as accounts of a prior
    order involving sky-world “first people” or “ancients.” It explains the Seneca
    figure S'hagodiiowe'gowa/S'hagodiiowe'qgowa, associated with protection from disease
    and with the Wind or Air, and distinguishes this figure from masked ceremonial
    societies. It then presents the “ancients” as anthropic divine beings or personified
    natural powers whose metamorphosis produced the present order of animal, plant,
    and natural life.
  language: English
  quote_policy: quoted
