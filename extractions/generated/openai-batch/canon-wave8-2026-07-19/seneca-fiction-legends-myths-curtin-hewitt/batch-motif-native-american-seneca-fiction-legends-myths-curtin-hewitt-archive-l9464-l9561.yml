canonical_text:
  quote: ''
  summary: A hunter guided by a speaking little dog stays with a poor old couple,
    is adopted after providing game, and is warned about a magic chief. The chief
    challenges the hunter to a foot race and later to a ball game. Dogs take the hunter's
    garments and appear as him for the contests; in the race the dog-man defeats the
    chief after both are struck in the foot by a thrown horn. The stakes include life,
    possessions, and chiefship.
  language: English
  quote_policy: summarized
