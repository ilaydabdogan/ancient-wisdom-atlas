canonical_text:
  quote: ''
  summary: A young man later identifies himself as Hahadodagwat'ha and arranges an
    escape for his sister. He takes a very small black dog from a case, taps it with
    a red willow rod until it grows large enough to carry her, and instructs her to
    travel directly eastward, resting when the dog stops beside trees. He says the
    dog is their brother and warns that an old woman is immune to sorcery and may
    overcome their orenda. The sister rides the dog, follows the instructions for
    a time, then is distracted by a fine-looking bird and loses the dog. Hahadodagwat'ha
    overtakes her. Later the old woman enters a lodge and asks where his wife is.
  language: English
  quote_policy: summarized
