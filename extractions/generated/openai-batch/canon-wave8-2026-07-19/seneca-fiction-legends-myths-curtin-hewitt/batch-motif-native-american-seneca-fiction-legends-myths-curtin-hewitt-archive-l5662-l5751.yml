canonical_text:
  quote: ''
  summary: A young man secretly meets the youngest of seven sisters while they gather
    huckleberries. The youngest sister falls in love with him, but her sisters repeatedly
    detect that she has been near a man by his odor, scold her, and threaten exclusion
    from their lodge. She decides to accept the young man as her husband, hides a
    small bundle of belongings, and after further accusation is barred from the lodge
    and leaves weeping.
  language: English
  quote_policy: summarized
