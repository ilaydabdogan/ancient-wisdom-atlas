canonical_text:
  quote: ''
  summary: During a pursuit, Turtle repeatedly has his sister leave him near fallen
    trees. By means of orenda, Turtle makes S'hagodiyoweqgowa pass within reach, bites
    his foot, grows larger when beaten against the tree, swallows him, excretes him
    after two days, and delays him until he regains consciousness after ten days.
    The fleeing woman reaches a lake, sits on a stone, and expects to die. S'hagodiyoweqgowa
    finds her, calls her his wife, and burns tobacco as an offering to the stone and
    other stones. A man rises from the lake and leads the woman into the water to
    a lodge in the depths. There, Turtle remains in a basket, is fed by his sister,
    later emerges as a full-grown man, and marries the rescuer's sister, while the
    woman marries the rescuer.
  language: English
  quote_policy: summarized
