  summary: An unnamed woman arrives and encounters or carries a bundle/pack. She returns
    to a place associated with a mother and another person. A pack is set on the floor
    and is said to contain the figure named Two Feathers. Someone is instructed to
    loosen him from his container. A mother gives thanks, Two Feathers stirs, and
    a repeated chant-like speech names Two Feathers. Later the woman reaches a lodge
    area, recognizes her spouse’s voice, runs to the lodge, looks through an opening
    or crevice, and sees Two Feathers inside while someone is weeping.
