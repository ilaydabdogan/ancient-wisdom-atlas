canonical_text:
  quote: ''
  summary: 'The passage contains the end of one tale, in which mice retrieve a skull
    for a disguised man, who resumes youthful form and curses a wicked woman''s village
    with destructive fire before returning the skull to his brother. It then begins
    “The Orphan”: a poor Seneca orphan marries a rich chief''s daughter after a brother''s
    prank, is prepared as her husband, joins a deer-hunting party, spends his days
    swinging instead of hunting, is abandoned with his wife, and shoots a great horned
    owl as hunger grows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An army of mice eats corn, beans, and squash seed, tunnels through the ground
    to a lodge, finds a skull, and draws it out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pretended old man takes the skull, dismisses the mice with thanks, leaves
    sight of the lodge, and becomes a young man again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man speaks a curse that fire should destroy the wicked woman's property,
    lodges, and people; the village is consumed in flames.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man tells his brother that he has recovered the skull and instructs
    him not to let anyone see it again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An orphan boy in a Seneca village lives by charity, moves from lodge to lodge,
    sleeps by a brush fire, and eats what people give him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A rich chief in the village has a daughter and sons.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: One of the chief's sons jokingly asks whether the orphan would like to marry
    his sister, and the sister unexpectedly agrees to marry the orphan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young woman prepares leggings, moccasins, washing water, and hair arrangement
    for the orphan before directing him to her bed and warning him about a trick-playing
    brother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: During a fall deer hunt, the orphan husband makes a swing from wild grape
    vines and swings all day instead of hunting, while his wife's brothers kill many
    deer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The brothers discover the swinging, see the worn ground around the swing,
    and move their camp a day's journey away, leaving the couple only one piece of
    venison.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the venison is eaten, the wife fears starvation; the husband shoots
    a great horned owl and places its body under the swing.
  category: sequence
  evidence_refs:
  - ev:9
