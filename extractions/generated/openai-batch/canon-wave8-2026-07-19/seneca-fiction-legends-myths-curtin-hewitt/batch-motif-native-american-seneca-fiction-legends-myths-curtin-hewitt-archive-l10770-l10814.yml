canonical_text:
  quote: ''
  summary: A frightened settlement faces the approaching Stone Coats. Two transformed
    young men witness the arrival of a smiling man who says Hawenniyo sent him to
    save the people. He fights the Stone Coats alone, destroys them, identifies himself
    as Lightning/Hinon/Thunder, and explains that he is sent against sorcery. The
    remains of the Stone Coats are said to be stones found across the earth. The passage
    then begins a new tale about a hunting expedition in which a young man regarded
    as foolish is refused permission to join.
  language: English
  quote_policy: summarized
