canonical_text:
  quote: ''
  summary: After all the brothers return except the eldest, Hohenhineh/Honenhineh,
    the next younger brother follows his trail toward the Great Valley. He hears a
    war-club blow and a singing voice across the valley, is taunted by a small flicker
    or yellowhammer in a tree, loses all his arrows and breaks his bow, then continues
    toward a smoky lodge. An old man receives him as grandson, says his elder brother
    has passed toward another lodge, directs his granddaughter to prepare food, and
    declares that the visitor and the maiden are to become husband and wife. The visitor
    eats corn soup, and night arrangements begin.
  language: English
  quote_policy: summarized
