canonical_text:
  quote: ''
  summary: Hodadenon survives a night pursuit, receives instructions from his uncle
    who is described as bones, steals a duck-paddled canoe, strands Shagowenotha,
    and travels to the lodge of Ongwe las. A woman there helps him enter without leaving
    tracks and hides him under her couch while Ongwe las and his dogs return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At dawn Ongwe las says he will return at night, revives his dead dogs, takes
    them into his canoe, and sails away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hodadenon remains hidden through the night and hears dogs, shouting, and blows
    striking his uncle, the bones; after daylight he returns to the uncle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The uncle asks Hodadenon to bring his pouch and light his pipe; smoke comes
    out through openings and sutures in the skull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The uncle instructs Hodadenon to bury himself in sand at the canoe landing
    with only his nose exposed, then board the canoe after Shagowenotha leaves and
    have the ducks paddle him away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hodadenon follows the instruction, calls and sings to the ducks, and the canoe
    moves swiftly over the lake while Ongwe las calls to be let aboard.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hodadenon speaks to monsters in the lake depths and tells them to devour Shagowenotha
    if he tries to swim after him; voices from the water agree.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shagowenotha cannot escape the island, climbs a tall tree, is found by Ongwe
    las and his dogs, declares his name, and is shot dead by Ongwe las.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hodadenon travels by the duck-paddled canoe to a wooded shore where a lodge
    stands near the water, hides the canoe underwater, and dismisses the ducks until
    called.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman uses two pieces of bark to lead Hodadenon from the water to the lodge
    without leaving tracks; inside, Hodadenon says he is her brother and has come
    after her, and she agrees to go with him after a delay.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The woman hides Hodadenon under her couch; when a dog enters she throws a
    bone into its mouth and hits it, and Ongwe las later says his niece seems to have
    two breaths.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The next morning Ongwe las says he will stop hunting on that island, goes
    to the other side of the country, and his prisoners are relieved.
  category: sequence
  evidence_refs:
  - ev:10
