  quote: ''
  summary: An unnamed male figure says that two will suffice, handles a body or bodies
    with a forehead strap, makes and wraps a bundle, carries the bundle homeward to
    a lodge, and arrives indoors. An old person, identified in the glossing with the
    figure’s mother’s brother or uncle, speaks of eight and raccoon. The old person
    removes skins, stretches them, waits for them to dry, tans them, and completes
    the work; the result is described as fine or beautiful.
