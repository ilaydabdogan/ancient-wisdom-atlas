canonical_text:
  quote: ''
  summary: A youth enforces a dream command against his uncle by singing a song that
    brings flames from the ground. The uncle first offers to make a substitute bark
    case and doll, then yields a real small woman hidden under his bed. The youth
    wraps her in furs and carries her to a mysterious skull-uncle, who warns him about
    a coming fire, dream episode, war-club action, and a naked bark-sledge ordeal
    around the lodge.
  language: English
  quote_policy: summarized
