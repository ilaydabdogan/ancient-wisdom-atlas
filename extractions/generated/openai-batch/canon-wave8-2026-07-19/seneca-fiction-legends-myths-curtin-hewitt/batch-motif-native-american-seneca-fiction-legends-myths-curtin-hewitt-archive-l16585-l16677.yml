canonical_text:
  quote: ''
  summary: Ot'hegwenhda sees named skeletons destroyed after eating blossoms, consults
    a living fetish, enters underground openings along southern and eastern trails
    to restore flesh to two groups of three brothers, avoids and burns winged snakes
    carried by whirlwinds on the northern trail, and then enters another opening near
    a birch tree where an old man with a rattle proposes to test his luck or orenda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skeleton identified as Tsodiqgwadon goes to a plant, eats a blossom, shakes,
    falls apart, and becomes a pile of bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cloud of dust and a third wind from the east bring the skeleton of Ganiagwaihegowa
    to the crossing; it eats a blossom, trembles, becomes disjointed, and becomes
    a heap of bones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ot'hegwenhda consults a fetish, which says the trails are clear and directs
    him to the southern trail.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the end of the southern trail, Ot'hegwenhda finds a rock opening, enters
    it, goes down into the ground, and reaches lit underground rooms.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the southern underground rooms, three brothers say a skeleton has eaten
    their flesh and that they cannot walk; their limbs are bare bones.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ot'hegwenhda rubs the three southern brothers with his spittle, their flesh
    is restored, and they become well and strong.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The restored southern brothers go home; their mother thinks they are ghosts,
    cries, and drives them out with a club; they find their father on the rocks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the eastern trail, Ot'hegwenhda finds an opening in the ground, descends
    into darkness, reaches rooms lit by rotten wood, and finds three brothers too
    weak to move because their flesh has been eaten away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ot'hegwenhda restores flesh to the eastern brothers by means of his spittle
    and sends them home, where their mother again thinks they are ghosts and drives
    them to the rocks.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: On the northern trail, a whirlwind drives Ot'hegwenhda to shelter behind a
    great maple tree; an Onwi or Winged Snake in the whirlwind strikes the tree and
    dies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A later whirlwind carries a multitude of winged snakes; Ot'hegwenhda avoids
    them by sheltering behind a tree and lying on its roots.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The fetish stands alive on Ot'hegwenhda's hand and advises him to make a large
    fire across the snakes' trail.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Ot'hegwenhda gathers boughs and sticks, sets fire to the western end of the
    pile, asks the wind addressed as his grandfather for a breeze, and the snakes
    rush into the fire and are killed.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the snakes are killed, Ot'hegwenhda continues north, rejects side trails
    after consulting the fetish, and finds an opening near a birch tree.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Inside the opening near the birch tree, Ot'hegwenhda finds an old man smoking;
    the old man says he thought the Hongak family were dead and announces that he
    will test the boy's luck or orenda with a rattle made of Dagwanoenyent.
  category: speech
  evidence_refs:
  - ev:13
