- id: obs:5
  text: Crow scouts from above, drives ten deer toward the young man, and the young
    man kills all ten with one arrow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Crow complains that the village gives him only refuse; the young man gives
