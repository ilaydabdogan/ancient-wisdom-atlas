canonical_text:
  quote: ''
  summary: The passage concludes a story in which a newly married young man gives
    magical wampum to his father-in-law, hunts ten deer with Crow's aid, is sunk into
    the ground by hostile hunters, and is rescued by Crow and Turkey before the chief
    leaves with the good people. It then begins a story in which a boy meets Djogeon
    little people who hunt dangerous underground buffaloes, followed by an episode
    where a Seneca fast runner survives a battle and escapes a human-eating Ganiagwaihegowa
    by leading it into a deer lick where it sinks.
  language: English
  quote_policy: summarized
