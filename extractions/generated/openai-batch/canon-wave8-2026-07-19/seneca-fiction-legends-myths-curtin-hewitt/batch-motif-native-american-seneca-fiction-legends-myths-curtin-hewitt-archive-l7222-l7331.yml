canonical_text:
  quote: ''
  summary: The passage closes one tale with a young man restoring his father, sister,
    and dog by spitting on his hands and rubbing them. It then begins the tale of
    Dagwanoentent, Daughter of the Wind, in which a nephew living with a harsh uncle
    discovers the uncle's secret chestnut-pudding pot, disobeys a prohibition against
    going north, repeatedly visits a Long Lodge containing meat, bear oil, a silent
    woman, and a boy who is later revealed as his cousin. After the nephew provokes
    the silent woman by spilling bear oil on her and later overuses the pudding pot,
    the uncle warns that the woman is an unkillable witch. A destructive tempest comes
    with the woman in its midst; she tears up the lodge and carries the uncle away
    while the nephew hides. The nephew later learns she will come for him next morning.
  language: English
  quote_policy: summarized
