canonical_text:
  quote: ''
  summary: 'Hat''hondas repeatedly reports bird calls to his uncle after the uncle
    lights a pipe. He then hears two women singing that they are going to marry Dooehdanegen,
    and they come through the air to the uncle''s lodge. The uncle prepares the lodge
    and hides Hat''hondas near the ashes. The women bring marriage bread but lie down
    with Hat''hondas, fondle him, and leave at daybreak, after which he has become
    a strong adult man. The uncle instructs him to follow the women to a sorcerous
    mother who seeks a husband for her daughter through a contest: bringing down an
    eagle on a hickory tree. The uncle gives Hat''hondas magical animal-skin garments,
    a pouch and pipe that summon helper beings, a power to spit wampum, never-missing
    arrows, and instructions to travel east alone. Hat''hondas sets out, finds the
    trail, and meets a man making a fire by the way.'
  language: English
  quote_policy: summarized
