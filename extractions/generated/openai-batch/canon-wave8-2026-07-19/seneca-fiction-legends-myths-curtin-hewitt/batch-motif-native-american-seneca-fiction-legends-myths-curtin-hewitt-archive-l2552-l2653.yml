canonical_text:
  quote: ''
  summary: The passage continues a Turtle warpath episode. Turtle tests would-be companions
    by running to a second mountain, rejects Degiyahgon, accepts Sigwaon, and leads
    a canoe-borne war party against the Seven Sisters. The attackers choose positions
    at the hearth, woodpile, corn bucket, and spring. The Seven Sisters and their
    mother defeat Senon, Kahehda, and Hagonsadji, though one sister dies from Hagonsadji's
    bite. Turtle seizes a sister at the spring, is brought to the lodge, tricks the
    household into throwing him into the creek instead of the fire, survives in the
    water, and disappears. The passage then begins a new tale about a grandfather
    and grandson who are the only survivors of their tribe after sorcerers killed
    the others.
  language: English
  quote_policy: summarized
