canonical_text:
  quote: ''
  summary: A hidden Porcupine asks assembled animals to take charge of her human grandson.
    After other animals are rejected because they flee too quickly from danger, an
    old mother bear is chosen as foster caregiver. The boy lives with the bear and
    her cubs through summer and winter, learns bear-like climbing skills, and shelters
    in a hollow tree. When hunters approach near spring, the bear says separation
    is near because the boy is human and they are bears; her protective power fails
    as the cubs leave the tree under arrow fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed female animal removes a blocking stone, looks inside, sees a Porcupine
    and a human being, and retreats in fear; other animals also look in and retreat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Porcupine says she and her grandson are poor, that her food is exhausted,
    and asks the animals to take charge of the boy if they can feed him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds are thanked but dismissed because the Porcupine says the boy could not
    live on what they could give him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf and deer present food, but each says or shows that it would run in
    danger; the Porcupine rejects them because the boy could not run fast enough.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old bear offers to feed the boy as she feeds her cubs and demonstrates
    that, in danger, her cubs crouch still beside a log while she watches.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Porcupine chooses the old bear to care for the child, then goes for food;
    the boy never sees the Porcupine again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy thinks the bear takes him by the hand and appears like a human being,
    and that the animals are like real people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bear leads the boy and cubs to places with berries and chestnuts; the
    cubs become fond of the boy, sleep near him, and teach him to climb and run up
    trees.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The cubs pull the boy's nails to make them long and sharp like theirs; after
    the bear finds him high in a tree, she scolds the cubs and makes his nails as
    they originally were.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In winter the bear takes the boy and cubs into a tall hollow tree, where they
    remain in a comfortable place while the bear sleeps much of the time.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the bear hears a sound, she warns that a hunter is near and tells the
    children to keep still.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy sees the mother bear draw out a two-pronged object and thrust it through
