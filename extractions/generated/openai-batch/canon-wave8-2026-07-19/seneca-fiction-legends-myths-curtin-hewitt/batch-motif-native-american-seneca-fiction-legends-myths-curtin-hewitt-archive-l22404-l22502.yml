canonical_text:
  quote: ''
  summary: 'A boy travels westward on a narrow path to obtain chestnuts. He encounters
    successive pairs of guardians blocking the path: rattlesnakes, bears, and firedragons.
    In each case he hunts food, gives it to the pair, commands them to withdraw, and
    says they should not be enslaved by sorcerers. He then reaches a clearing with
    chestnut trees, a lodge, women, and the hanging skin of a dead woman that watches
    the pathway and raises an alarm.'
  language: English
  quote_policy: summarized
