canonical_text:
  quote: ''
  summary: Ot'hegwenhda visits a man and woman who ask him to free people confined
    under their lodge. He heals the fleshless captives with spittle, sends the freed
    groups toward their homes, frees the coerced guardians, and makes deceptive trails
    vanish. He returns home, reconciles his mother with his father and brothers, then
    travels over Rough Lake on a slate to Dionondadenion. There he confronts the man-eater
    Djiniondaqses, fights until both are reduced to skulls, defeats him, and restores
    his own body. Honigoneowanen thanks him and gives him his daughter for future
    marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man and his wife welcome the youth, address him as kin, and say they want
    him to free many people under their lodge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The youth passes through an opening in a corner into a large room containing
    a multitude of people without flesh and almost dead.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: He rubs the confined people with spittle, cures them, brings them out, and
    tells them they are free because the evil people are dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The freed people identify several home places, and the youth gives different
    travel directions to the groups.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The former guardians thank the youth; they had been forced by Dewaqsent'hwus
    to capture and confine people for him to eat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ot'hegwenhda commands that all trails disappear so that trails will not cross
    the world to deceive people, and the trails vanish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At his own lodge, Ot'hegwenhda finds his father and nine brothers outside
    because his mother drove them out; after he questions her, she invites them in
    and the family is happy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ot'hegwenhda says he must visit his friends, the Djoqgweani, and his family
    lets him go because he possesses very potent orenda.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Rough Lake, Ot'hegwenhda puts a piece of slate on the water, asks it to
    carry him across, rides it to the other side, and tells it to wait for his return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Dionondadenion, Honigoneowanen says a man who looks like Ot'hegwenhda,
    though older, has been eating his people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Djiniondaqses enters with his mouth smeared with fresh blood, and Ot'hegwenhda
    challenges him to fight before he can kill the people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The combat reduces both opponents first to skeletons and then to skulls; Djiniondaqses's
    skull is crushed, while Ot'hegwenhda's skull remains sound.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ot'hegwenhda's bones reattach to his skull, then flesh and blood grow back
    after the skeleton rolls where the fight occurred.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Honigoneowanen thanks Ot'hegwenhda and gives him his daughter, saying he shall
    marry her when he is old enough.
  category: speech
  evidence_refs:
  - ev:8
