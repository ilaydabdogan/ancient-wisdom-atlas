canonical_text:
  quote: ''
  summary: A sister and her blind brother escape after removing logs, then travel
    south toward home. The sister carries her brother in a handmade carrying-chair.
    On the journey, the brother repeatedly kills turkeys after the sister positions
    him, while he refuses to eat and she cooks, eats, and makes temporary shelters.
    They reach their former lodge beside a tall chestnut tree. Later, while gathering
    fuel, the sister meets a handsome young man who proposes marriage. Her brother
    advises accepting because the suitor is a noted wizard, son of the witch Gaho°*dji'da'*ho"k,
    an enemy of their kin, and refusal would endanger them.
  language: English
  quote_policy: summarized
