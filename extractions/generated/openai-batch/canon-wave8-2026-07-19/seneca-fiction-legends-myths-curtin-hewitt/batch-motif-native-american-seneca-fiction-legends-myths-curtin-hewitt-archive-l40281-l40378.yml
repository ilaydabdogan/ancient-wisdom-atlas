canonical_text:
  quote: ''
  summary: An old uncle arranges his nephew's marriage to two women, cleans and furnishes
    the nephew's place, receives the customary twenty loaves of marriage bread, anoints
    and cleans the nephew's scab-covered head with sunflower oil, removes red and
    blue forehead feathers, anoints his face, names him Doadanegen, and identifies
    him as a renowned hunter. The wives respond to his beauty, the household eats
    by the fire, and the uncle tells the nephew to begin traveling over the earth
    carefully.
  language: English
  quote_policy: summarized
