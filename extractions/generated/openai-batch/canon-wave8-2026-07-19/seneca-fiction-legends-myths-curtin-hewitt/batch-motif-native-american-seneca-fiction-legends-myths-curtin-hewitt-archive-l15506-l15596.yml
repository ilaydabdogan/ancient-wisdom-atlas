canonical_text:
  quote: ''
  summary: The passage begins with an editor note about unidentified figures in a
    preceding context, then starts the story “The Moose Wife.” A young man leaves
    his mother to hunt for a year in the forest, builds a cabin, and cures meat. He
    repeatedly returns to find his cabin fire tended and food prepared by an unseen
    helper. By watching secretly, he discovers a beautiful young woman who says she
    came because he lacked a woman’s aid and asks to become his wife. They live together,
    have a son, and she prepares him for a promised visit to his mother, warning him
    to remain faithful. At the river she produces a tiny canoe that expands into a
    large canoe for transporting meat.
  language: English
