canonical_text:
  quote: ''
  summary: A youth reports to a speaking skull how he retaliated against his living
    uncle by pulling him toward the fire while offering food. The skull warns that
    the uncle is preparing a great night fire and instructs the youth to stay awake,
    seize the uncle's war club, and strike him if a dangerous dream overtakes him.
    During the night the old uncle enters a dream-state, pushes firebrands toward
    the youth's sleeping place, and is stopped by the youth's blow. The uncle then
    reports a dream command requiring them to hazard their lives. The next morning
    the skull explains that the uncle is trying to outmatch the youth's orenda and
    gives instructions for transforming a wild grapevine into bear entrails.
  language: English
  quote_policy: summarized
