canonical_text:
  quote: "“This woman was a panther and the children were her cubs, but she seemed
    to the man to be of the human kind.”"
  summary: 'A poor hunter helps a crying woman and her two boys by killing a hawk
    and giving it to the terrifying owner of a stolen feather. The woman is then identified
    as a panther whose cubs had offended Dagwanoenyent; she rewards the hunter with
    abundant game. The passage then begins a separate tale in which a shaman uncle
    instructs his grown nephew to go marry a chief’s two daughters and to test orenda-endowed
    objects: a panther-skin robe, a spotted fawn-skin pouch, and a manikin-decorated
    pipe.'
  language: English
  quote_policy: quoted
