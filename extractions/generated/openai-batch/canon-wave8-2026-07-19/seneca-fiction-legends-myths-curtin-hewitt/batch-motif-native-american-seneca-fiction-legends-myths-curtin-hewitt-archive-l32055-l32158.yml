canonical_text:
  quote: ''
  summary: A weak elder uncle instructs a young man stranded on an island to make
    three humanlike dolls with bows and arrows, set them in tree forks, lay misleading
    tracks, and hide near the landing place. S'hagowenot'ha, a cannibal pursuer, arrives
    with dogs and wild geese. The dogs follow the tangled trail and are killed by
    arrows from the decoy figures. S'hagowenot'ha interprets the deaths as signs of
    orenda or sorcery and flees toward the canoe landing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder tells the young man that S'hagowenot'ha will land with dogs, command
    them to find him, and follow their tracking from place to place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder instructs the young man to make three human-body-like dolls from
    rough bark and soft wood, each with a small bow and arrows, and to place each
    in a tree crotch as if shooting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elder is described as very weak and like a pile of bones; he has a fisher-skin
    pouch containing a knife, a fire flint, and punk, and he gives the knife to the
    young man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The young man fashions the three dolls and their bows and arrows to deceive
    S'hagowenot'ha when he comes seeking to devour him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young man runs over the island in a way meant to mislead the enemy and
    his dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The young man fixes the dolls in forks of trees far from the landing place
    so that from the ground they may look like persons hiding in the trees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At dark the young man digs a body-sized trench near the landing place, conceals
    himself in sand, and leaves his mouth sufficiently uncovered to breathe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After midnight the young man hears the wild geese that had propelled the canoe,
    the impatient dogs, and the landing of his pursuers; S'hagowenot'ha orders the
    dogs to find the man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The dogs follow the young man's tangled trail over the island while S'hagowenot'ha
    sends the wild geese away to seek food and follows the dogs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the barking places, S'hagowenot'ha finds his dogs dead with arrows fallen
    into their mouths from the dolls in the trees.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: S'hagowenot'ha responds to the dead dogs by saying the young man's body has
    orenda or that he is a sorcerer; after the last dog dies, fear comes over him
    and he flees toward the canoe landing.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
