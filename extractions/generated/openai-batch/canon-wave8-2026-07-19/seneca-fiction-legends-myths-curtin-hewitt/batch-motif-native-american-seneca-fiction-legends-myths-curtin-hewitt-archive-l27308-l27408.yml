canonical_text:
  quote: ''
  summary: A war band continues attacking villages and carrying scalps. Burdened by
    the scalps, they discuss seeking a larger “scalp of all scalps.” They meet a towering
    man, fail to harm him, and receive his warning to cease killing innocent people.
    The band continues its vowed journey toward the place where the sun sinks, crosses
    a large lake by following a quiet member of the band, and reaches a far shore
    where the sky rises and falls like a barrier at the apparent end of the earth.
  language: English
  quote_policy: summarized
