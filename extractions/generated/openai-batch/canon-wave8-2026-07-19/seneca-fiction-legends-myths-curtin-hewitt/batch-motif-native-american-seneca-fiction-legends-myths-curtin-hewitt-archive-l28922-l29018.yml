canonical_text:
  quote: ''
  summary: An old woman receives dream instructions from the Corn Maiden about planting,
    cultivating, distributing, and honoring corn. The Corn Maiden is abducted by a
    tall Stone Giant and rescued by another brother. After her return, she directs
    a feast and Corn dances, declares that corn will endure so humans need not starve,
    returns by river to her home, and later marries Sumac Tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman plants the corn and follows the Corn Maiden's directions for
    caring for it so it can mature and not be choked by weeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In autumn the old woman harvests her corn, divides it into portions for the
    village families, gives portions to chief matrons, and explains seed use, planting,
    and cultivation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a second dream the Corn Maiden says human beings must not waste corn and
    must honor and care for her, or she will leave and take away corn and other seed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old woman warns her nephew not to travel about because roaming beings
    with orenda can overcome and destroy men; the nephew denies that such beings can
    kill men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A human being described as tall beyond measure arrives, summons the Corn Maiden
    out of the lodge, examines a stone ax and a flint arrowhead, and asks whether
    such simple things can kill a person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tall being, named in the passage as the Stone Giant, carries away his
    youngest sister captive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another brother of the Corn Maiden takes a stone ax, bow, and arrows, asks
    his grandmother to follow, pursues the Stone Giant, and shoots him with a flint
    arrow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Stone Giant confesses that he did wrong in stealing the maiden and surrenders
    her to her brother, who leads her home with the grandmother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After returning, the Maiden tells her grandmother to prepare food from one
    grain of corn, saying it will suffice for all human beings at the celebration
    banquet.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Maiden orders a feast in her honor and directs women to dance the Corn
    dances; the people rejoice with her.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The Maiden says she is returning to the place whence she came and that corn
    shall exist forever so mankind will never again die from starvation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Maiden returns on the river and sings words identifying varieties of corn,
    beans, and squashes as mothers of the peoples of the whole world, to teach the
    people what to sing in Corn dances.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: After returning home, the Corn Maiden accepts a marriage proposal from Sumac
    Tree, marries him, and asks him to love or regard her as precious; he agrees.
  category: relationship
  evidence_refs:
  - ev:11
