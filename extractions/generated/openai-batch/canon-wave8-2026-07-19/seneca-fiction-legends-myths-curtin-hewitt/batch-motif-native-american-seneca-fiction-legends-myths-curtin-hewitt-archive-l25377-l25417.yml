canonical_text:
  quote: ''
  summary: A boy and his sister travel during a snowstorm, shelter under fallen trees,
    maintain a fire, and eat quail found in the shelter. An old woman living alone
    notices smoke from the snowbank, rescues and feeds the children, and asks them
    to stay with her as her own children. The next morning the boy spits on an arrow
    three times, casts it through the smoke-hole, and commands it to hunt a deer for
    food.
