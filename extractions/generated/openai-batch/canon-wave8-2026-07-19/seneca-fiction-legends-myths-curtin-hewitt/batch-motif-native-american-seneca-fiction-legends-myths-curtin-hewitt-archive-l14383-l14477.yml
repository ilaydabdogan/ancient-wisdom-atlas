canonical_text:
  quote: ''
  summary: Haiwanenqgwi is sent by Tsodiqgwadon to notify multiple peoples and beings
    of a council at Broken Land. He visits Sun Island, is attacked by fishing men
    with bewitching reeds at Gainhdoya, escapes into water, and continues delivering
    the message. After returning, he is told he has notified only half the tribes
    and must ascend to the Land in the Blue Sky. Tsodiqgwadon gives him a flesh-like
    substance with great orenda; after chewing it, Haiwanenqgwi ascends, walks through
    the air, visits sky and cloud dwellers, passes through a central sky door, and
    meets an old man and a light-giving runner who agree to attend the council.
  language: English
  quote_policy: summarized
