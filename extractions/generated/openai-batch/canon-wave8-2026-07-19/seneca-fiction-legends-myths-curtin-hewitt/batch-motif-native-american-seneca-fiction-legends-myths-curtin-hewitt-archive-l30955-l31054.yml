canonical_text:
  quote: ''
  summary: A council debates a proposal to make peace with an enemy tribe. After an
    overnight recess, a chief urges the people to bury their weapons and send two
    ambassadors to ask the enemy to cease war. Two men volunteer. The chief instructs
    them to leave their weapons and wash off face paint before entering the enemy
    village. At night the two depart by separate routes, coordinating through animal
    forms or sounds, one as a night owl and the other as a fox, and they approach
    the enemy territory.
  language: English
  quote_policy: summarized
