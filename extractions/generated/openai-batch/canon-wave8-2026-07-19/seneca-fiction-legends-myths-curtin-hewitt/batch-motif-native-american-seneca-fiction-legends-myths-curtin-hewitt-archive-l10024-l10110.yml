canonical_text:
  quote: ''
  summary: Ganyadjigowa, also called S'hodieonskon in the passage, overturns or disturbs
    several lodges, confronts old or hostile inhabitants, questions cliff-dwelling
    Sigweont brothers and Disdis about Hanisheonon, Hayadagwennio, the Turtle, earth,
    water, and old traditions, and finally arrives at Ganenaitha's lodge, where the
    old man by the fire calls him nephew and invites him inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ganyadjigowa takes hold of a rock, overturns it, and breaks Dagwanoenyent's
    lodge to pieces; Dagwanoenyent is wounded on the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dagwanoenyent identifies the disturbance as his friend, says he must kill
    him, tries to pursue, and falls because his head is dizzy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ganyadjigowa sees blood flowing from Dagwanoenyent's head, laughs, and says
    he is stronger magically than Dagwanoenyent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the churlish people's earth lodge, Ganyadjigowa lifts up one end; the people
    run out, bite him, pursue him, and he escapes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ganyadjigowa walks westward, descends a cliff, sees a hole in the cliff wall,
    enters, and finds a series of rooms containing old men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old men in the cliff are identified as seven brothers called Sigweont.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ganyadjigowa tells the cliff dwellers that he goes around the world to make
    all quiet and happy; they say they do not believe him and do not want him there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ganyadjigowa and the Sigweont discuss whether Hanisheonon is alive, whether
    Hanisheonon is Hayadagwennio, whether the earth is thin and stands on a Turtle,
    who made the earth or world, and whether anyone has lived covered in the earth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Sigweont deny several propositions asked by Ganyadjigowa and say that
    they are the fathers of Hanisheonon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ganyadjigowa looks into Disdis's lodge and sees an old man pounding something
    into a thin piece of wood and putting the wooden object into his face; Ganyadjigowa
    identifies the action as making a mask.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ganyadjigowa takes the roof off Disdis's lodge and shakes his wings in a nearby
    spring so that water flies up and falls onto the lodge like rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Disdis thinks rain is entering because his lodge is old, leaves his work,
    goes toward the spring, and tells Ganyadjigowa that the spring is his and that
    he will kill him if he does not leave.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: Ganyadjigowa says he is not afraid of Disdis and claims Disdis is too old
    and no longer strong magically.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ganyadjigowa questions Disdis about Hanisheonon, the earth resting on a Turtle,
    the motion of water, mud in swamps, and whether the old folk went all over the
    world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: Disdis says he is Hanisheonon, says he himself holds up the earth, and gives
    an explanation in which water stops at a lake, goes into the ground, and comes
    out in springs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: After traveling, Ganyadjigowa reaches Ganenaitha's lodge; Ganenaitha sits
    by the fire, calls him nephew, and invites him inside.
  category: sequence
  evidence_refs:
  - ev:6
