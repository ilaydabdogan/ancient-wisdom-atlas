  text: The passage says the tales form a complete series in which the mental and
    social life of the people is evident.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage proposes comparison between Indian and Gaelic systems of thought,
    and more broadly among races, as a way to build a history of the human mind.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that ethnic religions do not provide true information about
    physical changes in the world but do provide evidence about the history of the
    human mind.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: A primitive religion is described as belonging to people of one blood and
    language and including knowledge, custom, institution, and art.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that every aboriginal nation has gods, is under their care
    and supervision, communicates with them, and receives from them what it has, practices,
    and knows.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes bonds of faith between a nation and its gods and bonds
    of blood among individuals of that nation as the strongest social bonds known
