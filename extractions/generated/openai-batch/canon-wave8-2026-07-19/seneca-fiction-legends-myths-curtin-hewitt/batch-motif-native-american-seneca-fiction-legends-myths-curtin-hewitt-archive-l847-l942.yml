canonical_text:
  quote: ''
  summary: The introductory passage argues that Native American mythic and religious
    materials preserve evidence for the history of the human mind and can be compared
    with other systems of thought. It describes ethnic religion as encompassing gods,
    knowledge, custom, institution, and art; gives examples of divine objects and
    transformed vegetable beings; mentions maize as a transformed god eaten ceremonially;
    and summarizes a myth in which a cruel old personage is transformed by a good
    hero into wild parsnip.
  language: English
  quote_policy: summarized
