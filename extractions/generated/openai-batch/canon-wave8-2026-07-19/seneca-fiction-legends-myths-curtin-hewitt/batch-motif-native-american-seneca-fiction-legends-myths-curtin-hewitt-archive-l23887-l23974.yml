canonical_text:
  quote: ''
  summary: During a hunt, deer fall dead before two brothers with arrows in them,
    and one brother handles an arrow carefully to avoid removing its charm. Little
    Burnt Belly prepares to seek missing brothers, taking his orenda-filled bow and
    arrows and using medicine for clear vision. He follows their trail north through
    a dark forest and valley, encounters a taunting bird that pretends to be a flicker,
    shoots it, and finds his brothers' arrows and broken bows nearby. He then reaches
    a lodge where an old cannibal man and a young maiden are present; the old man
    proposes that Little Burnt Belly marry the maiden and asks for the body of the
    killed creature, but Little Burnt Belly refuses until he sees his missing brothers.
  language: English
  quote_policy: summarized
