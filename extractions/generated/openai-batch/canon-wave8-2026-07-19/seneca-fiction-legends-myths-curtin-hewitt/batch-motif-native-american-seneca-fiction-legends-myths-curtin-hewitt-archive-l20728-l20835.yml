  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: When the husband returns above ground, he discovers the moccasin has been
    speaking for the woman and follows her tracks to the spring.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The husband orders his dog Onhagwio to find the woman; the dog eventually
    sniffs into the air and follows a faint scent northward.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: When the pursuers near the woman, the helper puts her into an arrow again
    and says she will land on an island in a lake and must run in all directions.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: At the lake, the husband changes himself into a flea, enters the hair behind
