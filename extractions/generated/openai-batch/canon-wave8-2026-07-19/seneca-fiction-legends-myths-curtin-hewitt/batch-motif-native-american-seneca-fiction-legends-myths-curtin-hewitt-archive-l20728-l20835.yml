  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: As the helper turns to go away, the woman sees that he is a Djondjongwen.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:20
  text: The passage breaks off after the dog reaches the place where the woman’s tracks
