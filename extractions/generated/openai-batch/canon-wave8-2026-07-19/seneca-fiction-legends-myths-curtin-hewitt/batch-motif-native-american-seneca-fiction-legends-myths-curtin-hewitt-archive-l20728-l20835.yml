    trunk and head of a man.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The three men cut up, boil, and eat the body, while the husband, their brother,
    does not talk or eat with them and never eats their kind of food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: On following days the three brothers go hunting, return in the evening, and
    eat what they have killed or leftovers from the previous meal.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At a spring, a man tells the young woman that her husband will go into the
    ground the next day and is magically powerful and evil.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The spring man instructs the woman to put her moccasin exactly in the center
    of the lodge and tell it to answer whenever her husband speaks, then to hurry
    back to the spring.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The husband announces that he is going into the ground, orders his wife to
    stay in the lodge, and disappears into the ground by turning where he stands.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The wife follows the spring man’s instructions, goes to the spring, and the
    helper puts her into the top of an arrow and shoots it into the air.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: While the husband is away for several days, he repeatedly calls to his wife,
