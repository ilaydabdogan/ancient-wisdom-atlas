  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A stranger comes to a lodge where a man, his wife, and four children live,
    asks to marry the young daughter, and marries her after both parents consent.
  category: action
  evidence_refs:
  - ev:3
