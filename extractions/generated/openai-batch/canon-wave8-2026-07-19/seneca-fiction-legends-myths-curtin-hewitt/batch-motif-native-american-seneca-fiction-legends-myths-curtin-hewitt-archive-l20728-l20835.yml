canonical_text:
  quote: ''
  summary: 'The passage first concludes a prior tale in which Morning Star denies
    promising help to a little old woman, sleeps, and the island water rises until
    the woman is eaten by lake inhabitants. Tale 101 then begins: a stranger marries
    a young woman with her parents’ consent and takes her to his cabin. His brothers
    return from hunting, cook and eat what the woman sees is part of a human body,
    while her husband does not join them in eating. A man at a spring warns the woman
    that her powerful and evil husband will go into the ground and instructs her to
    use a moccasin as a voice-decoy. After the husband disappears underground, the
    helper repeatedly transports the woman by arrow while the husband and his dog
    track her, including by scent in the air. During pursuit across a lake, the husband
    changes into a flea behind the dog’s ear; the helper finally reveals himself as
    a Djondjongwen before the text breaks off.'
  language: English
  quote_policy: summarized
