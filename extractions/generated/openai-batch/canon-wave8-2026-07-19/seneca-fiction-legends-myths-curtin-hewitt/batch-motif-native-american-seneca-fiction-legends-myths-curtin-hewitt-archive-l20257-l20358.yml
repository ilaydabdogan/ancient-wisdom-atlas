canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which a woman escapes from a man-eating
    dead being, leading to explanations of changes in Seneca mortuary practice. It
    then begins a sky-world creation tale: a chief''s sick daughter is placed beside
    a corn-bearing tree, falls through the hole left by the uprooted tree into a watery
    world, is received by waterfowl and Turtle, and land is made when Toad brings
    up soil from beneath the primal sea.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman makes a hickory-bark torch, takes a pail as if to fetch water, drops
    the pail outside, and runs through the woods toward home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man, described as a vampire and a man-eating skeleton, discovers
    that the woman is gone and pursues her while whooping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman reaches a lodge where a dance is in progress, falls inside, faints,
    and later reports what happened to herself and her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men find the husband's bones with the flesh eaten away, and find the dead
    man's skeleton with bloody face and hands in a bark box.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chief orders the man-eating skeleton buried, has the husband's bones buried,
    and orders that dead people thereafter be buried in the ground.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that earlier scaffold burial frightened people because
    the dead would rise and run after the living.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes a former practice in which a surviving spouse watched
    with a corpse in a hillside chamber, while friends brought food every ten days
    for a year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In another burial account, a man watching his wife's body hears crunching
    and eating; investigators find eaten bodies and a deep hole thought to have been
    made by a great serpent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When bodies were placed in bark lodges, the husband or wife had to remain
    there for a year; afterward bones were fastened upright to a post and a great
    dance was held around them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the sky-world tale, human beings live high up in what is called heaven
    under a great chief whose daughter becomes gravely ill.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A great tree near the chief's lodge bears corn used for food each year.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: A friend dreams that the chief should lay his daughter beside the tree and
    have the tree dug up; the advice is followed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A young man objects to destroying the food-bearing tree and shoves the sick
    young woman into the hole made by digging it up.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The hole opens into a world that is all water, with many waterfowl floating
    on it and no land.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: Waterfowl join their bodies together to receive the falling young woman; later
    the Great Turtle holds her.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The animals decide to make a permanent resting place by bringing soil from
    the bottom of the primal sea and placing it on Turtle's carapace.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Toad dives to the bottom of the waters, brings up soil, and the soil is spread
    over Turtle's carapace, where it begins to grow in size and depth.
  category: action
  evidence_refs:
  - ev:17
