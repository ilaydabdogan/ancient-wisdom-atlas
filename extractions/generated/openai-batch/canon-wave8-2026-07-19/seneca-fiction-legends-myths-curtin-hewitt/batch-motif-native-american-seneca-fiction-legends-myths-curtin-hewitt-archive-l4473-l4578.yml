canonical_text:
  quote: ''
  summary: A Great Blacksnake brings the elder brother safely upward and disappears.
    The elder brother then disguises himself in the old man's worn-out clothing while
    the old thief, wearing the stolen panther-skin robe, reaches the chief's village
    and marries the eldest daughter. The elder brother and Turkey Brother later cross
    the river with the youngest daughter, who recognizes the disguised elder brother
    as the expected man and marries him. The elder brother produces black and white
    wampum gifts for the chief, while the old thief's imitation produces foul decayed
    animals and is rejected.
  language: English
  quote_policy: summarized
