canonical_text:
  quote: ''
  summary: 'Editorial notes identify and explain motifs and beings in a Seneca mythic
    narrative: a Son of the Whirlwind marries a human woman; malign and beneficent
    Whirlwind beings are distinguished; cannibalistic devices, robes of eyes, animal
    metamorphosis, soul-journey guardians, wampum belts, sorcerers’ vermin, witch
    or wizard death-immunity devices, Thunder Man’s serpent-eating sons, and several
    named mythic animals or beings are glossed.'
  language: English
  quote_policy: summarized
