canonical_text:
  quote: ''
  summary: A grandfather teaches his grandson progressively to hunt and prepare Ohsoon
    birds, Neogen/deer, and bear. After recognizing the youth’s manhood, he forbids
    him to hunt eastward because wicked women live there and have killed their people
    by sorcery. The youth goes east anyway, hunts raccoons in a hollow tree, avoids
    a calling young woman by changing into a red-headed woodpecker and using an arrow
    as a decoy, then returns home and is reprimanded.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lad catches an Ohsoon bird, looks for soup in its legs, finds none, and
    releases it; his grandfather explains that the bird must be killed, dressed, and
    cooked for soup.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lad brings home another Ohsoon; the old man kills, dresses, and cooks
    it, then sings and dances while saying the lad will be a great hunter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lad sees a strange creature with long thin legs and something on its head
    like tree branches; his grandfather identifies it as Neogen and says it is the
    fourth and greatest kind of game a hunter kills.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lad kills Neogen, brings the body home, and receives solemn instruction
    from his grandfather in dressing the deer and preparing its skin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the youth brings home a bear, the grandfather says the youth has reached
    manhood, noting the change in his voice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The grandfather permits hunting in every direction except east, warning that
    wicked women there killed all their people through sorcery.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young man begins a southward hunt but changes course eastward while thinking
    about the wicked women and his destroyed kindred.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the eastward journey, he finds a tree covered with scratches and nail marks,
    climbs it, discovers raccoons in the hollow trunk, and kills several with a club.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A beautiful young woman sits on a log at the foot of the tree and repeatedly
    calls for the young man to come down and speak with her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: To avoid the woman, the young man changes into a red-headed woodpecker, climbs
    higher, pecks at the bark, and shoots an arrow toward home with a woodpecker-like
    sound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young woman mistakes the arrow for the young man and flies after it; he
    returns to his own form, descends, gathers his clothing, weapons, and raccoons,
    and goes home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The grandfather is pleased by the raccoons but becomes angry when he learns
    where they were taken, warning the young man not to go there again because harm
    and evil would follow.
  category: speech
  evidence_refs:
  - ev:8
