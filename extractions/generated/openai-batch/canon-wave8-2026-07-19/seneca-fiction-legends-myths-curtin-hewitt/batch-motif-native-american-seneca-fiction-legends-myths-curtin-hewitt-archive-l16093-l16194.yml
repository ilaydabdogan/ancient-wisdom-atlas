canonical_text:
  quote: ''
  summary: A rapidly growing boy learns that Hinon is his father and later acts as
    a thunder-helper. After hearing that his six aunts and many others lost their
    heads to an old woman and her son in gambling contests, he travels west, wins
    a dice game with transforming plum-stone dice and then a ball game, and has the
    two opponents beheaded. He brings his grandmother and the people to live at the
    captured dwelling and field; his grandmother becomes young-looking after putting
    on the dead woman's clothing, and the boy later stays with Hinon through the winter.
  language: English
  quote_policy: summarized
