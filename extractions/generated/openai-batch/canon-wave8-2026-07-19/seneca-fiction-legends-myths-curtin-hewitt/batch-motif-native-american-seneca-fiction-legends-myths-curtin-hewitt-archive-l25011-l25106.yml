canonical_text:
  quote: ''
  summary: A mother arranges for a maiden to marry her son and move to his lodge and
    fire, then instructs the son not to mistreat his wife. After a year the wife gives
    birth to a strong daughter. In autumn the husband prepares to go to his hunting
    grounds with wife and child; his mother prepares corn provisions. The couple travel
    with the child, camp overnight, reach the hunting lodge, make it warm and habitable,
    and live there while the husband hunts successfully and the wife prepares food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man's mother enters the maiden's lodge, states that her son has
    consented to marry the maiden, and asks the maiden to come to their lodge and
    fire and dwell with her spouse's people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden agrees to the marriage and returns with the young man's mother
    to the young man's lodge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother tells her son to continue loving his wife, have compassion for
    her, and never vex, abuse, or kill her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife remains there for one year, fulfills the duties of a good wife, and
    gives birth to a daughter described as handsome, large, healthy, and strong.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In autumn, men capable of doing so go out to their hunting grounds, and the
    husband plans to take his wife and child with him because the child is strong
    enough to be carried in a cradle board.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man's mother prepares journey food, including boiled corn bread
    and parched corn meal sweetened with honey or maple sugar, and makes a wrapped
    pack.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the journey, the wife carries the child on her back by cradle board and
    forehead strap, while the husband carries the wrapped pack by forehead strap.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At an overnight stopping place, the husband repairs a temporary shelter and
    kindles a large fire, while the wife warms meat and corn bread; they eat and sleep
    on a couch of bark and boughs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the hunting camp, the husband repairs the hunting lodge, kindles a large
    fire, and fills crevices with moss to make it warm, especially for the baby.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The husband goes out hunting while the wife and child remain in the lodge;
    he returns before sunset with a deer, skins and quarters it, hangs the meat to
    cure, and selects pieces for supper.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Over many days the hunter brings home large quantities of venison, bear, moose,
    elk, and other game, and the lodge accumulates curing meat, furs, and skins.
  category: sequence
  evidence_refs:
  - ev:9
