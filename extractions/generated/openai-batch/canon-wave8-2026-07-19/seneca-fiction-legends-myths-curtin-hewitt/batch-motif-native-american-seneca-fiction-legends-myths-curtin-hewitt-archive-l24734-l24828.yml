canonical_text:
  quote: ''
  summary: 'The twins attempt to restore their blind uncle''s sight by borrowing eyes
    from Ke''k^''howa and from the Eagle, but these attempts fail. Each twin then
    lends one of his own eyes, allowing the uncle briefly to see them. The uncle tells
    them where his own bloodshot eyes are: attached as ornaments to the swaddling
    wrappings of a female child on a cradle board in a fox-skin-marked lodge in cloudland,
    guarded by the warder Hane^hwa''. The twins ascend by burning swamp grass and
    riding the smoke to cloudland, enter mice to approach the lodge, bribe the warder
    with wild beans, transform into fleas, and cause their paternal aunts to fight
    one another with pestles. They then enter the fox-skin lodge and find the child
    with many persons'' eyes on the wrappings.'
  language: English
  quote_policy: summarized
