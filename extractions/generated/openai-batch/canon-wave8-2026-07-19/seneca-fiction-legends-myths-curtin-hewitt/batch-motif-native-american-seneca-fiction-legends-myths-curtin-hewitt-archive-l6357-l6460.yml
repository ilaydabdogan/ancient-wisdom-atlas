canonical_text:
  quote: ''
  summary: The passage first describes God making human beings from earth under uprooted
    trees and approving the third, identified as an Indian. It then recounts a Seneca
    warrior’s disappearance, a cave-dwelling Ganiagwaihegowa driven out by fire and
    killed only through the soles of its forefeet, and a tale in which a young warrior
    eats a strange trout from a hollow tree, becomes unbearably thirsty, transforms
    into a fish in a spring that becomes a pond, and later becomes a Ganiagwaihe that
    preys on fishers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God finds an uprooted walnut tree that has raised a mound of black earth and
    makes another human being from that earth, but is not satisfied because the being
    is black and has too much color.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: God finds an uprooted sugar maple with fine deep-colored earth, makes a third
    human being from it, approves the being’s appearance, and the passage identifies
    this being as an Indian and the native human being.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Seneca warrior is missing; skilled men investigate, find great tracks near
    the village, and follow them to a cave in the woods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The investigators make a large fire and throw burning brands into the cave,
    after which a Ganiagwaihegowa comes out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arrows do not injure the Ganiagwaihegowa until the men shoot it in the forefeet;
    the passage states that its life is in the soles of its forefeet and that it is
    vulnerable nowhere else.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ganiagwaihegowa is said to eat common bears and to differ from other bears
    in being killable by shots in the feet.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two young warrior cousins on a hunting expedition hear a peculiar sound like
    a whirlwind from a hollow tree and find a spotted trout leaping in water inside
    the hollow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: One cousin warns that the fish may bring harm, but the other takes it to camp,
    cleans it, cooks it, and eats it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After eating the fish, the young man becomes intensely thirsty and repeatedly
    asks his cousin for water, including water carried in moccasins.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: At the spring, the eater’s mouth becomes fishlike, then his body becomes fishlike
    to the waist, and finally he completely changes into a fish and enters the spring;
    by morning the spring has grown into a large pond.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The great fish raises its head from the pond, speaks to the cousin, asks him
    to tell the parents what happened, and promises that the pond will always be full
    of fish for him when needed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The great fish later tells the people that it will soon become a Ganiagwaihe,
    and after a short time it becomes one, with hair only on its back and feet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Ganiagwaihe remains around the lake, kills and eats one person from groups
    who come to fish, and young men who try to kill it do not return; searchers find
    only their garments.
  category: sequence
  evidence_refs:
  - ev:7
