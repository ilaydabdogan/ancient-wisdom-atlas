canonical_text:
  quote: ''
  summary: Hodadenon uses magical stealth, a mole helper, and wampum to pass a woman
    on watch; he discovers and destroys the hearts of four witches, revives dead people
    including his sister from bones and skin beneath a hickory tree, sends chestnuts
    to another sister, gives a guarded chestnut hidden in an arrow to two men, and
    then begins a westward journey to recover one missing person, meeting an old man
    near a great lake who summons white ducks to paddle a canoe to an island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon turns slippery-elm bark into wampum before approaching the woman
    on the raised platform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hodadenon asks a mole to carry him unseen beneath the ground, after he has
    reduced his own size by magic.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman on the platform accepts wampum in return for not giving the usual
    alarm, though she later does give an alarm.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: Hodadenon searches with the moles in the lodge of four women and finds hearts
    fastened to a string under the couch of the eldest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the daughters and their mother pursue Hodadenon, each falls dead when he
    bruises one of the hearts on the string.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the four witches are dead, Hodadenon grinds their hearts to powder and
    burns the lodge, bodies, and powdered hearts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman on watch is identified as Hodadenon's own sister and is described
    as only a pouch of human skin without bones and flesh.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hodadenon places bones of dead persons and his sister's skin at the foot of
    a large hickory tree, pushes the tree, and calls for them to arise; they immediately
    leap up alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hodadenon sends a chestnut and then other chestnuts to his sister Yenyentwus
    in the west, where she stores them in the lodge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Hodadenon returns home with parents, sister, and friends, one place remains
    vacant.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hodadenon gives two men a chestnut hidden in an arrow and warns them to protect
    it from a man they will meet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The warned-about man addresses the two men as nephews and tries to seize their
    arrows, but they shoot the arrows away and save the chestnut.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Hodadenon says one more labor remains because there is still an empty seat
    in the lodge, and he goes west.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: On his westward journey, Hodadenon reaches a clearing, a large lake, and a
    smoking lodge where an old man is mending moccasins.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The old man says he has expected Hodadenon, says he is ready to go home, and
    says he comes from the same place as Hodadenon.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: After Hodadenon and the old man eat corn, beans, and bear meat, the old man
    proposes hunting on a little island.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Small white ducks with black heads come and paddle the canoe to the island
    while the old man sings.
  category: action
  evidence_refs:
  - ev:12
