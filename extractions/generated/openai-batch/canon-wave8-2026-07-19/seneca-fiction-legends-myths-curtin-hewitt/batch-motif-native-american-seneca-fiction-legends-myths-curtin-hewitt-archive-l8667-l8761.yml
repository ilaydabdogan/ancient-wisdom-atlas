candidate_motifs:
- id: motif:1
  label: hidden external hearts determine the witches' lives
  taxonomy_refs: []
  basis: The witches' hearts are stored on a string under a couch; each witch dies
    when one heart is bruised.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage explicitly links bruised hearts and deaths, but no broader
    taxonomy ID for an external-soul motif is supplied.
- id: motif:2
  label: magical animal helper enables secret entry
  taxonomy_refs: []
  basis: A mole carries the magically reduced Hodadenon underground and emerges beneath
    the watch platform; moles also accompany the lodge search.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage supports animal assistance and stealth, but does not itself
    frame the mole as a named spirit or totem.
- id: motif:3
  label: bribed or delayed sentinel
  taxonomy_refs:
  - sacred_exchange
  basis: Hodadenon gives wampum to the woman on watch as a reward not to give alarm.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The exchange is explicit, but the sacred or ritual character of the exchange
    is not explained in this passage.
- id: motif:4
  label: resurrection from bones and skin beneath a tree
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Hodadenon places bones and his sister's skin at the foot of a large hickory
    tree, calls them to arise, and they leap up alive.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents restoration to life, but it does not explain whether
    the tree is cosmological or merely instrumental.
- id: motif:5
  label: life-saving food object guarded from interception
  taxonomy_refs: []
  basis: A chestnut is requested for a person in danger of death, hidden in an arrow,
    and protected from a stranger who tries to seize the arrows.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The chestnut's exact curative mechanism is not described in the provided
    passage.
- id: motif:6
  label: missing household member recovered through a westward quest
  taxonomy_refs:
  - departure
  - return
  - mystical_quest
  basis: An empty seat remains; Hodadenon says one more labor remains, travels west,
    and meets an old man who says he is from the same place and ready to go home.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage segment ends before the old man's return is completed.
- id: motif:7
  label: water crossing to island with bird helpers
  taxonomy_refs: []
  basis: The old man calls small white ducks with black heads, which paddle the canoe
    across the large lake to the island.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The destination and purpose of the island hunt are only introduced at
    the end of the passage.
