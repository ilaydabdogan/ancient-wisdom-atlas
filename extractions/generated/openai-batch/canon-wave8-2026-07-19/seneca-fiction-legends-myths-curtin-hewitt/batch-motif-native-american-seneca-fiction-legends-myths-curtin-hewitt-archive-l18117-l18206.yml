canonical_text:
  quote: ''
  summary: Two brothers live in a secluded forest lodge. The elder warns the younger
    not to show a hidden human skull and other sacred things. Visiting women twice
    induce the younger to show the skull and steal it; the first pair are killed and
    the skull recovered, while the second theft leads to the elder shooting an arrow
    through the smoke-hole. The elder then disguises himself as an old man, finds
    the skull-carrying woman suffering from the arrow, extracts it and cures her,
    asks for crop seeds, and begins directing mice to dig a tunnel toward her lodge.
  language: English
  quote_policy: summarized
