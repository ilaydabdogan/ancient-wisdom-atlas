- id: obs:6
  text: A second pair of young women comes to see curious possessions; one snatches
    the skull and flies out through the smoke-hole, followed by the other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The elder brother asks for his bow and quiver of arrows and shoots an arrow
    up through the smoke-hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The elder brother sets out toward the place where the women carried the skull
    and transforms himself into a wretched-looking old man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At a large assembly, the disguised elder brother learns that the woman who
    carried off the skull is suffering from an arrow lodged in her body and that no
    one can remove it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The pretended old man draws the arrow out with his teeth little by little;
    when bystanders touch it, it returns into the woman's body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old man warns the people not to touch the arrow, finally removes it, declares
    it to be his arrow, and the woman becomes well.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the cure, the old man remains outside, is brought food and drink, asks
    for corn, bean, and squash seed, receives the seed wrapped in skin, and calls
    mice to dig an underground tunnel toward the woman's lodge.
  category: sequence
  evidence_refs:
  - ev:6
