canonical_text:
  quote: ''
  summary: A boy receives permission and equipment for a journey with an old man.
    They travel, cross a vast lake in a bark canoe, and after a mysterious nighttime
    movement of water are guided to a long lodge of the Hinon, rain-bringing beings.
    The Hinon say they influenced the journey and ask for help killing enemies because
    the visitors have great orenda. They explain how they take the spirit of small
    portions of crops. A youngest warrior proposes attacking a huge porcupine living
    in an immense hemlock tree, whose dart-like quills kill those who approach; the
    boy is encouraged to try first.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy asks his mother for permission to go; after thinking, she permits
    him and gives him new moccasins for the journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy’s friend washes him, trims his hair, paints his face, adds new feathers
    to his headdress, gives him a new bow and arrows, and then travels with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two travelers make a fire in the woods at night, eat, sleep, travel in
    this way for five days, and reach a lake whose far shore they cannot see.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The old man strips bark from a large bitternut hickory tree and makes a large
    canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy and old man cross the lake in the canoe with their bows, arrows, and
    fur robes, then fasten the canoe to bulrushes near a low island without landing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy asks whether the water is safe; the old man says there are fish in
    the water and evil things extending from the bottom of the water to the home of
    the Master of Life, but says they are safe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At midnight the boy hears a rushing sound and finds the water running very
    fast; he wakes the old man, who tells him to lie down and says no harm will come
    to either of them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At daybreak a decorated middle-aged man stands at the bow of the canoe, which
    is then on dry land; he wakes the old man and leads both travelers to a long lodge
    with many people inside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The lodge elder says the inhabitants are the people called Hinon, that they
    bring rain for corn, beans, and squashes, that they sent their young man and influenced
    the visitors to come east, and that they want help killing enemies because the
    visitors are powerful in orenda.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the meal, the lodge elder says the Hinon take a little from many fields,
    specifically the spirit of corn, beans, and squashes, leaving shells or husks
    behind.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The youngest warrior says a terrible great porcupine lives on an immense hemlock
    tree on a hill; its quills are like long darts, it kills those who approach, and
    the Hinon cannot kill it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: When the group goes toward the tree, the boy walks ahead with his small bow
    and arrows; the others stop at a distance, and the old man jokingly suggests that
    the boy try first.
  category: action
  evidence_refs:
  - ev:10
