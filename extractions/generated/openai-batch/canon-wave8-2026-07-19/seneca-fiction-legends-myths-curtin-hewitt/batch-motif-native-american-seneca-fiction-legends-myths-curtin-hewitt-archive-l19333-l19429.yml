canonical_text:
  quote: ''
  summary: 'The passage contains three Genonsgwa or Stone Coat-related episodes: a
    hunter escapes a pursuing Stone Coat by taking and later returning its magical
    pointing finger; three Seneca on the warpath are warned and then saved from a
    Stone Coat army by a man who identifies himself as Hawenniyo; and a Canandaigua
    village, warned of disaster, flees during an attack, while a mother places her
    newborn in a tree-hole bear den.'
  language: English
  quote_policy: summarized
