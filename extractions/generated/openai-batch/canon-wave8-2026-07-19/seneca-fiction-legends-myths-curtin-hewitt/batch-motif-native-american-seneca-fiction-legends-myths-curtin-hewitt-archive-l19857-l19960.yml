canonical_text:
  quote: ''
  summary: An old bald-headed chief repeatedly sends travelers to learn about distant
    regions, especially the White Country, until a strong uncouth man gathers reports
    from his whole tribe and claims to have gone around the world. The chief rewards
    him by making him second chief; the chief is identified as Bald Eagle and the
    second chief as Mud Turtle. The passage then begins a new tale about an unsuccessful
    hunter mocked by a young woman, encouraged by her grandmother, and followed by
    the young woman, who later hears an approaching pleasant voice at night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People dissatisfied with an earlier report send additional men to learn more
    about the world and the White Country.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The second messenger is gone four months, reaches the White Country, travels
    there for two months, and says he could not have lived had he gone farther.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The third messenger reports that people in the White Country live in white
    houses and dress in furs that make them look like animals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fourth messenger crosses white rivers and white lakes, runs through the
    White Country, is gone eight months, and returns by a straighter route.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fifth messenger passes beyond the White Country into a rocky region, climbs
    up and down until his moccasins wear out, and navigates home by observing hemlock
    tops leaning eastward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The old bald-headed chief continues seeking reports until a strong uncouth
    man promises to go around the world; that man and his tribe travel for forty months
    and gather reports from different directions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the strong man reports having seen many kinds of people, game, woods,
    and rivers, the chief rewards him by naming him second chief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrative identifies the old chief as Bald Eagle, the new second chief
    as Mud Turtle, the first traveler as Deer, and the other travelers as kinds of
    animal and bird people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the next tale, an unsuccessful hunter prepares for autumn hunting with
    ten days of medicine and emetics made from tree bark and carries parched cornmeal
    in case he kills no game.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A granddaughter mocks the hunter as a poor hunter and calls him by a nickname
    based on his medicines, while her grandmother praises him and wishes he were the
    granddaughter's husband.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The young woman follows the hunter with bread in a basket, sleeps beside a
    log at night, and hears someone with a pleasant voice calling from a distance
    and approaching.
  category: action
  evidence_refs:
  - ev:10
