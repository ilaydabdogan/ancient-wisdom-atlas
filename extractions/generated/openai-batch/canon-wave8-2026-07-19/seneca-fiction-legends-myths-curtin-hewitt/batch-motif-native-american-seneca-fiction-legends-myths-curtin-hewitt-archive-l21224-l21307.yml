canonical_text:
  quote: ''
  summary: A man flees the monster Djainosgowa through trees, mountains, valleys,
    darkness, and storm. The monster attacks his footprints and repeatedly causes
    him to fall, while a friend named Gaasyendiet'ha, the Meteor, appears to raise,
    encourage, and guide him. The man falls into a hole and after a long descent lands
    in a beautiful country, where the pursuer briefly turns into a man. He enters
    a lodge where an old man calls him grandson, takes over the fight, heals from
    bites, tears the monster apart, and cooks its meat while preparing bear meat for
    the grandson. The passage ends mid-action with corn being pounded.
  language: English
  quote_policy: summarized
