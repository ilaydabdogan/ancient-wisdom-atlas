canonical_text:
  quote: ''
  summary: A visiting friend warns a magically powerful man of monster attacks and
    gives protective instructions. The man survives a pursuit by an enormous bear
    at a stone hill when the bear fails a leap and is crushed by a rock. Later the
    friend warns of renewed danger, instructs the man to transform his wife into Os'hada
    and send her away, and the man uses a tooth from Gaasyendiet'ha to see a subterranean
    Djainosgowa climbing toward him through a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man enters the hut at night, says he has come again, warns that a great
    monster envies the husband and plans to overpower and eat him, and directs the
    husband to a nearby stone hill as his only refuge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife is present during the first warning but neither sees nor hears the
    visitor; the passage says only the two powerful in orenda heard what was said.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At noon the husband goes to the rocks, waits on the highest rock, hears howls
    approaching, and gives a defiant whoop claiming no one can overpower him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The approaching monster is identified as a bear, the oldest and strongest
    of the great bears.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband and the monster bear leap from rock to rock until the bear falls
    short of a leap and strikes its jaws on the edge of a rock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the husband jumps down, the rock from which he leaped turns over and
    falls on the monster bear, killing it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On another day the friend comes to the hut while the couple sits by the fire,
    and the wife sees him for the first time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The friend warns that the man's life is again in danger and instructs him
    to rub his hands on his wife's head so that she will become Os'hada, then send
    her away and later flee south.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the morning the man rubs his wife's head, speaks that she should become
    Os'hada, and she immediately becomes Os'hada resting on his hand; he then rubs
    it off in the direction it is to go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man piles up his meat and announces that he gives it to all flesh-eating
    animals that live in the woods.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The man goes southeast to a very large elm tree, climbs to a high crotch,
    and later feels faint and weak at intervals.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The man uses a tooth given by Gaasyendiet'ha, dampening it with spittle and
    passing it over his eyes, saying he can see everything, even down in the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Looking into the ground, the man sees a deep tree with a great monster on
    it, later identified as a Djainosgowa, the greatest of the Djainos family of monsters.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Djainosgowa has determined to overpower the man's orenda and climbs up
    out of the ground into the heart of the tree on which the man is sitting; the
    man leaps to another tree as it nears.
  category: action
  evidence_refs:
  - ev:8
