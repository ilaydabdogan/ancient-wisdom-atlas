canonical_text:
  quote: ''
  summary: 'The passage presents Curtin’s general account of myth-tales. It states
    that original myth heroes were not human but extra-human beings or nature-force-like
    actors. It describes North American Indian tale groups as a collective creation
    myth of the New World: before humans, the world was occupied by numerous ''first
    people'' or ''outside people'' who lived harmoniously, gradually changed, entered
    into conflict, and through powerful perception, knowledge, thought, wish, and
    word brought about the present order of things. The passage also says these tales
    concern extra-human existences rather than human adventures and compares the ''first
    people'' to the earliest gods of other peoples.'
  language: English
  quote_policy: summarized
