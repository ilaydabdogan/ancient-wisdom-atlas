canonical_text:
  quote: ''
  summary: 'A boy, identified in the passage as Hodadenon, leaves the lodge to hunt
    after breakfast, returns saying he has killed an unknown large game animal, and
    brings his elder sister to the body. She identifies it as a deer or Neogen, says
    he is immune to its orenda, and processes the animal with him: skinning, quartering,
    carrying meat home, stretching the hide, cooking the meat, and teaching him how
    these tasks are done.'
  language: English
  quote_policy: summarized
