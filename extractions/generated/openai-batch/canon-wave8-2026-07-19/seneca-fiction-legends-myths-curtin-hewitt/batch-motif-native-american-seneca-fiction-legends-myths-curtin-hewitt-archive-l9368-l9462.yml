canonical_text:
  quote: ''
  summary: 'A man keeps three dogs described as his brothers. His wife mistreats and
    starves them when he is away. The smallest dog reports this and later the dogs
    plan punishment. Through the dogs'' orenda and influence, the woman becomes a
    man-eater: she consumes her own blood and flesh, kills and eats her daughter,
    pursues her husband, and devours people who ignore his warning. The man and dogs
    escape across a river on a small raft; the pursuing woman misses the raft and
    drowns.'
  language: English
  quote_policy: summarized
