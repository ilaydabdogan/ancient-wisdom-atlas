canonical_text:
  quote: ''
  summary: Djogeon arrives at his wife's mother's lodge, is accepted as son-in-law,
    fulfills dream-imposed tasks involving a bear and a feast for the Dagwanoenyent,
    then traps the old woman and the Dagwanoenyent by making the lodge flint and red
    hot. He later crosses a thin-iced lake with his wife and companions by entering
    puffballs and calling the west wind. The passage then begins a tale titled 'The
    Woman Who Married a Great Serpent,' introducing a proud daughter, her mother,
    a forest overnight camp, and a beautiful adorned stranger who comes to marry the
    daughter.
  language: English
  quote_policy: summarized
