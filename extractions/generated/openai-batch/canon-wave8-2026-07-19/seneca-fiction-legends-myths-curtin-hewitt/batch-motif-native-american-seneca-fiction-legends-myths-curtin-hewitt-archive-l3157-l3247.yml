canonical_text:
  quote: ''
  summary: The passage contains the end of a pursuit tale in which a pursued figure
    deceives a man-eater through moccasins, disguise, and a corpse substitute; the
    tale of a two-headed snake fed by a boy until it devours his sister and most of
    a village before being killed by a surviving man with arrows prepared using his
    sister's bodily materials; and the beginning of a hunting-expedition tale involving
    four canoe-traveling warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man-eater follows tracks after a dead rabbit disappears and comes upon a
    man making cords from bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cord-maker gives no answer until pushed over; he then says someone passed
    recently, while the text states that the pretended cord-maker had sent his moccasins
    onward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pursued figure runs ahead, turns into an old tree with dry limbs, and
    later blood is found where the man-eater had broken off a limb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man-eater follows the moccasins, then realizes the tree may have been
    the man he sought.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fleeing man places a dead man's body on the path; the man-eater eats the
    putrid carcass, allowing the other man to escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bracketed note identifies the man with moccasins as a rabbit and the man-eater
    as a fox.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A boy who shoots birds finds a two-headed snake and feeds half of a bird into
    each mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy continues hunting to feed the snake; the snake grows very large, and
    the boy eventually pushes his little sister toward it, whereupon one head catches
    and eats her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The snake continues growing, encircles the village, and eats people at the
    palisade gate until only one man and his sister remain; then it moves to the top
    of a mountain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The surviving man dreams instructions to make bow and arrows, wrap hairs from
