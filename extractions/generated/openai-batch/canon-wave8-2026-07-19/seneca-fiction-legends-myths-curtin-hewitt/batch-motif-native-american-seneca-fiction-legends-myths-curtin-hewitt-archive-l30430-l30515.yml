canonical_text:
  quote: ''
  summary: A pursued young man creates a world-spanning cliff to delay a great bear
    who is an old woman in bear form. A singing man helps delay the monster with pikes.
    The young man rejoins his exhausted sister, shrinks a dog with a red willow rod,
    and reaches a cavern where their mother shelters them. The mother kills the pursuing
    bear with boiling bear fat, and the family is reunited. The passage then begins
    a new encounter in which the young man finds an ill prostrate stranger with his
    feet in water and offers to carry him to dry ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After hearing a threat that he will die, the young man casts a piece of rock
    behind him and commands a rock cliff to rise across the world; the cliff appears
    after he speaks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great bear cannot pass through the rock cliff, runs along it, becomes
    weary, and returns to the place where the young man's track disappears under it.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: By morning the cliff is gone; the great bear places her paw on the young man's
    track, calls him a mighty wizard, and the fugitive reels and staggers while the
    old woman in great bear form pursues him again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A singing man addresses the young man as nephew, tells him his younger sister
    has already passed, says his mother's lodge is nearby, and promises to detain
    the monster with difficulties.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The singing man sets many pikes; the bear assaults them, the man assumes his
    true character, and the two grapple until the pikes break and the bear runs onward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young man overtakes his nearly exhausted sister, seizes her arm, encourages
    her, and flees with her a long distance before camping.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the morning the young man cuts a red willow rod, strikes the dog three
    times, and the dog becomes very small; he places it in his bosom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The brother and sister see a rock cliff with an open cavern; a female personage
    invites them in and says they will live if they enter.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The woman at the cavern helps draw the exhausted sister inside, and the young
    man also enters; she says she is thankful that the two have returned alive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A kettle of boiling oil, identified as bear's fat, is over the fire in the
    cavern scene.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the bear thrusts her nose into the cavern opening, the mother throws
    boiling oil into the bear's face and then pours the rest on her; the bear dies
    in agony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother says the long-absent children have returned home and that they
