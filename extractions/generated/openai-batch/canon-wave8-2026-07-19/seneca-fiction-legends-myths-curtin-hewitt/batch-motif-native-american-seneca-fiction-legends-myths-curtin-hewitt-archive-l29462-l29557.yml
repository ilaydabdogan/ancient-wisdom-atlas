canonical_text:
  quote: All were delighted with the bounty of nature — the gift of the Master of
    Life.
  summary: A fugitive hiding at a cavern entrance is discovered by two women from
    a lodge within or near the cavern, welcomed by their brother, married to the elder
    sister, and later returns with his wife and children to the outer forest. The
    family is recognized by visiting hunters as a new Wan'dat/Waii'dat people of the
    Porcupine clan, becomes numerous, and thrives through hunting, gathering, and
    seasonal wild-pigeon harvests.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man watches a lodge from a passageway to a cavern; two women approach the
    cavern entrance but turn back after saying they smell smoke from a fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man from the lodge comes out, shakes himself like a dog coming out of water,
    and tells the women that the scent at the entrance is human rather than smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two women find the concealed man near the cavern entrance; the elder woman
    asks where he came from, and he says he came to hide from enemies after all his
    people were killed in a day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The elder woman invites the fugitive to their home, and he accepts the invitation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the lodge, the brother of the two women greets the fugitive, assures him
    that no harm or want will come to him, offers marriage with his elder sister,
    and mentions abundant food and a store-cache.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fugitive accepts the proposals, lives with the three people, marries the
    elder sister, has an infant son with her, and later has several children over
    about fifteen years.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:7
  text: After about fifteen years, the brother-in-law tells the man to return to the
    place from which he fled and to take his wife and children, describing them as
    the man's own people while also of the cavern family's blood.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man, wife, and children pack small belongings, say farewell to their kindred,
    pass through the cavern mouth, emerge into a dense forest, make camp, and live
    by the father's hunting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The husband meets other hunters and invites them to visit his camp; the visitors
    bring their wives and are surprised that the wife and children speak a language
    they do not understand, though the husband understands it.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: When asked the wife's clan, the husband replies that she is of the Porcupine
    clan of the Wan'dat/Waii'dat tribe, says he is of that tribe too, and says the
    Porcupines gave him that name.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The visitors declare that they have found a new people called Wan'dat/Waii'dat
    and say they must love and greet them as friends.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Porcupine clan family gains many friends, becomes numerous, and is described
    as powerful, well-fed, physically strong, skilled at hunting, and knowledgeable
    about edible plants and wild-pigeon roosts.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: When the season comes, leaders and chiefs call the people to go to wild-pigeon
    roosts, where the flocks are numerous enough to darken the sun and sound like
    an approaching tornado.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At the roosts, the people make temporary camps, kill squabs, bring them to
    lodges, and eat them with boiled corn bread and corn soup.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage closes by describing the food abundance as a bounty of nature
    and as the gift of the Master of Life.
  category: attribute
  evidence_refs:
  - ev:11
