canonical_text:
  quote: ''
  summary: A party traveling with the Thunder men looks down from above the sky and
    clouds and sees rain and swollen waterways caused by the Thunder men's songing.
    The human travelers are set down on earth and told they have been safely returned
    home, but that the former inhabitants have moved to another settlement. Before
    separating, the Thunder men instruct the humans to remember them through native
    tobacco offerings and thanksgiving, a regulation attributed to Deaunhyawagon,
    Hawdiini'yo, The Master. The Thunder men depart to their lodge in cloudland. Dehaenhyowens
    and his companion find the old home overgrown, go east toward village smoke, and
    ask local inhabitants about an old expedition of thirty warriors led by Dehaenhyowens
    and Gaenhyakdondye along the path of the Sun. A lodge master refers them to an
    old woman, who confirms the tradition from her grandmother and directs them to
    a long-lived man for more information.
  language: English
  quote_policy: summarized
