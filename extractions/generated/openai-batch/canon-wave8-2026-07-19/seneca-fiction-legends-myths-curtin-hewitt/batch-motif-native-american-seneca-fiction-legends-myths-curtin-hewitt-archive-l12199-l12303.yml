canonical_text:
  quote: ''
  summary: A father traps two children who had been living near a log and learns that
    his uncle killed their mother and dismembered her. The children survived among
    her intestines by drawing milk from her severed breasts and have been feeding
    meat to her remaining head. The head becomes insatiable and dangerous, and the
    boys flee west with the aid of speaking dogs while the father flees south, warned
    that the Head will pursue him with powerful witchcraft.
  language: English
  quote_policy: summarized
