canonical_text:
  quote: ''
  summary: 'The passage closes a prior episode in which Haient''hwus hears Okteondon
    singing that he is rising; an elm falls, and Okteondon is found standing. A new
    tale begins: an uncle and nephew, the last of their people, live in the woods.
    The uncle equips and instructs the nephew as a hunter, warning him to keep to
    the sun side and never go north. The nephew hunts successfully, aided by a flute
    that foretells the next day''s game. He eventually disobeys the northward prohibition,
    chases elk in a circular path, and encounters a woman who lulls him to sleep.
    She places him in a basket and flies away with him; his long hair, tied secretly
    to a root, first pulls them back. After she discovers and loosens the hair, she
    repeatedly carries him through the air to a river, an island, and finally the
    edge of a deep ravine.'
  language: English
  quote_policy: summarized
