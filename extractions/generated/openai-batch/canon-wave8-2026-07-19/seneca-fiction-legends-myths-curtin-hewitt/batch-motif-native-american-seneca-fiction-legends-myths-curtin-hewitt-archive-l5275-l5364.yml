canonical_text:
  quote: ''
  summary: The passage first closes an earlier tale in which a youth controls a flying
    canoe by changing the words of a song, causing it to descend, rise northward,
    and attempt to stop. A new tale begins with a man and his nephew in a forest lodge.
    The uncle secretly makes his own food with a tiny kettle, a small substance later
    identified by the nephew as chestnut, a wand, water, fire, and a sung command
    that makes the kettle and its contents grow. The nephew feigns sleep, watches
    the procedure, and later begins to imitate it while the uncle is away hunting.
    The excerpt ends mid-action.
  language: English
