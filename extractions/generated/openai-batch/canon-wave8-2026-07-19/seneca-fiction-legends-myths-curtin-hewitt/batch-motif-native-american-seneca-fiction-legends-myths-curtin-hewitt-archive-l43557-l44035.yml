  quote: ''
  summary: In a fragmentary interlinear passage, an old man directs a youth to go
    yonder, look at or upon his body, and return. The old man says he is not yet satisfied,
    performs careful action involving the youth, sends him again, and gives him the
    name Dooa'dane'ge', saying his name is famous in connection with peoples, hunters,
    and game. Two maidens or women then praise the youth as handsome and speak of
    marriage and cherishing him. At night Dooa'dane'ge' lies between the two maidens;
    the elder cannot sleep and watches him. In the morning the two maidens prepare
    food and eat.
