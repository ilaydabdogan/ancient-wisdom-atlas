- id: obs:1
  text: The passage states that Seneca political history was largely that of the League
    of the Iroquois, while individual tribes retained a large measure of autonomy
    within the federal government.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Montagnais, Algonkin, and Hurons sought peace with the Iroquois; after
    an armistice, continued Algonkin guerrilla warfare was followed by the Seneca
    killing an embassy, and war was renewed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After defeating the Hurons in spring 1634, the Seneca made peace with them;
    a Huron embassy later went to Sonontouan to ratify the peace, and other Iroquois
    nations wished to become treaty parties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes renewed war with the Hurons, identifies the Seneca as
    feared enemies of the Hurons, and discusses relative military numbers and power
    among Iroquois and Huron groups.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Three hundred Seneca attacked the Aondironnon, killing or capturing inhabitants,
    although the Aondironnon were a dependency of the Neuters, who were then at peace
    with the Seneca.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage credits Seneca warriors with major roles in campaigns against
    the Huron tribes, the Tionontati or Tobacco tribe, the Neuters, and the Erie between
    1648 and 1656.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During war against the Neuters in 1651, the Seneca were defeated so severely
