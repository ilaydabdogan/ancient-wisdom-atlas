canonical_text:
  quote: ''
  summary: A youth repeatedly goes north despite his grandmother's warning and encounters
    an uncle-like man seated in tied tree-tops, who challenges him with destructive
    storms of spears and stones. The youth and grandmother escape through a spring
    to an underground rock shelter, then the youth restores their ruined lodge by
    command. Later, with a mole's help and after shrinking to flea size, the youth
    challenges the uncle with a whirlwind, hides again with his grandmother, calms
    the whirlwind, and finds the trees uprooted. He believes the uncle destroyed,
    but his grandmother says the uncle has a brother farther north.
  language: English
  quote_policy: summarized
