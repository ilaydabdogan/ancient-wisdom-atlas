canonical_text:
  quote: ''
  summary: A youth enters an old man's lodge, where he finds a young woman whom the
    old man identifies as his granddaughter and proposed wife for the visitor. The
    old man repeatedly asks for the bird body the youth carries, but the youth refuses
    until he sees his brothers. After food is prepared and eaten, the old man threatens
    the youth, kills him with a war club, restores life to the bird, and cooks and
    eats the youth's flesh when it will not cook thoroughly. Meanwhile, the brothers'
    lodge is anxious over the missing brothers; Little Burnt Belly sits silently by
    the fire, then rises and shoots two arrows up through the smoke-hole.
  language: English
  quote_policy: summarized
