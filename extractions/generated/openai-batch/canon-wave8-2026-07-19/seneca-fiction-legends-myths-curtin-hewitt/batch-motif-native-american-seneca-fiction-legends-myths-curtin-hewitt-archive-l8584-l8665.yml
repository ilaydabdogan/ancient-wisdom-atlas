canonical_text:
  quote: ''
  summary: Hodadenon follows a sound into an empty village and finds an old man and
    the old man's hidden niece as the only survivors. A look-alike companion, identified
    as the old widow's grandson, has been eating human flesh and has mutilated the
    old man. Hodadenon instructs the niece to prepare boiling dog fat and battles
    the companion for ten days until both are reduced to skulls. The niece correctly
    pours the fat on Hodadenon's skull, restoring his body. Hodadenon heals the old
    man with orenda, marries the niece, and then gathers scattered human bones by
    a hickory tree and calls them back to life as men who return home.
  language: English
  quote_policy: summarized
