canonical_text:
  quote: ''
  summary: Ganon, a Seneca war chief, leads a male delegation seeking peace with the
    Cherokee. The men purify themselves for ten days, obtain S'hadahgeah tail feathers
    through a concealed baiting method, travel to the Cherokee fort, dance and sing
    at the assembly lodge, present wampum as credentials for peace, share food with
    the Cherokee, and receive the Cherokee decision to accept the wampum, bury weapons,
    and establish adopted kinship ties.
  language: English
  quote_policy: summarized
