  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Long Lodge becomes red-hot flint; the wizards cannot escape through the
    smoke hole or the ground, the roof falls in, and their heads burst from the heat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: From the heads of the dead wizards come a horned owl, other owls, a red fox,
    a gray fox, and a nighthawk.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The old woman says Hotgoendaqsais is her own grandson and that she had been
