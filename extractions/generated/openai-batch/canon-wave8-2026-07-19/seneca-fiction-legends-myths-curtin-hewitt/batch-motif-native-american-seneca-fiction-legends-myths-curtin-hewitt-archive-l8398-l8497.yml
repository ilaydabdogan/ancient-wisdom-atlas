canonical_text:
  quote: ''
  summary: Hodadenon enters a Long Lodge where Hotgoendaqsais is being tortured by
    firebrands and producing wampum from his eyes. He warns kin to stay away, rescues
    the captive, magically seals and heats the lodge so the wizards inside die, then
    kills remaining maneaters, burns their lodges, and restores murdered victims from
    piles of bones near a hickory tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadefion/Hodadenon goes with an old woman and her grandson to the Long Lodge,
    where Hotgoendaqsais is tied to a post and tormented with firebrands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys gather dry reeds to light pipes and carry fire or coals for people
    smoking in the assembly hall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hotgoendaqsais smiles when he sees Hodadenon, and an old woman present says
    the smile suggests one of the boys may be Hodadenon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two women alternately burn Hotgoendaqsais from two fires; when he cries out,
    wampum falls from his eyes instead of tears, and the people rush and fight to
    gather it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the way home, Hodadenon tells his companion that the tortured young man
    is his brother and that he will destroy the place and all the people in it the
    next day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hodadenon instructs his companion to have the grandmother warn their relations
