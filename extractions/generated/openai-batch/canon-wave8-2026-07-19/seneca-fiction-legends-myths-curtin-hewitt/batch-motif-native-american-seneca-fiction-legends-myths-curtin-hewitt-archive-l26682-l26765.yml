canonical_text:
  quote: ''
  summary: An old uncle reports that a dream commands him and his nephew to exchange
    before midday or calamity will occur. In the morning, after the nephew kindles
    a fire, the uncle sings and requests the exchange; the nephew delays and then
    gives him a package of fat bear liver. The nephew then consults the skull of another
    uncle protruding from the ground, who instructs him to stage a reciprocal dream-test.
    The skull tells him to make a great fire, wait until midnight, let the uncle strike
    him with a war club, and then demand that the uncle divine the dream’s desired
    object by midday. The object is a small round squash on a vine beneath the uncle’s
    bed, prized because the uncle believes his life depends on it. At midnight the
    nephew groans, throws himself onto the fire, scatters firebrands, is struck, and
    announces the divination challenge.
  language: English
  quote_policy: summarized
