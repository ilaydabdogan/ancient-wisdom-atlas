canonical_text:
  quote: ''
  summary: A chief and council institute proper planting, hilling, and weeding of
    corn, beans, and squash after a Matron’s explanation of failed crops. When the
    crops are later stolen, warriors capture thieves, punish them, and follow corn
    thieves to a forest village. The narrative explains raccoon markings and rabbit
    split lips as results of punishment. A traditional statement says trees, shrubs,
    plants, corn, beans, and squash have human life and family relations and may depart
    if offended. The next legend begins with an uncle immobilized by tree roots instructing
    his nephew to plant beans, corn, and squashes in a clearing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief called a council after hearing the Matron’s statement, and the council
    resolved that corn, beans, and squashes should be planted with enough earth and
    then cared for by hilling and removing weeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the following spring the people agreed to follow the council’s agricultural
    advice, planted the crops sufficiently deep, and later hilled them and destroyed
    weeds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Toward harvest, a nation of people carried away the corn and beans and left
    only some squash shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the next crop season, theft began again when the green corn was ready
    to eat, and the people suspected who had taken the crops.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief’s council appointed stout and alert warriors to watch the fields,
    and the watchmen captured persons stealing ears of corn, bean pods, and squashes
    before dawn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The captured thieves told the chief that they lived far away in the forest
    and belonged to a large nation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The corn, bean, and squash thieves were bound and were struck daily with staffs
    by chiefs and people, causing them to weep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After a long time, the corn thieves agreed to guide warriors to their nation
    in return for being set free.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Warriors followed the corn thieves to a forest settlement, killed many people
    there, released the thieves who had guided them, and carried the dead home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Warriors were ordered to split the upper lips of the squash stealers so they
    would not be able to eat squashes again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The narrative identifies the corn thieves as raccoons and says their striped
