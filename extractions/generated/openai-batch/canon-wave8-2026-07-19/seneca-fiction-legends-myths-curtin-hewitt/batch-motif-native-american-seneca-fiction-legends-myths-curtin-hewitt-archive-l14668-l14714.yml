  text: The young man told every man to hang his bundle on the tree, and after this
    was done the fight began.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young man watched for the large man described in the dream and saw him
    holding a sort of medicine in front of his face like a shield to ward off arrows.
  category: object
  evidence_refs:
