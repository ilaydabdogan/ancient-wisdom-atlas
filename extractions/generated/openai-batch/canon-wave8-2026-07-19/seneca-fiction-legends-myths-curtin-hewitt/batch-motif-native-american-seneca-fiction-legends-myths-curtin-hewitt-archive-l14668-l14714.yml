- id: obs:5
  text: When the sun was high, a bear rose, stretched, looked at the party, spoke
    to them, turned, and disappeared; the passage says it was evidently one of the
    enemy who had come to warn them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The headman told his men the enemy was probably near, urged courage, and said
