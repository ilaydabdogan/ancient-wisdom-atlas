- id: obs:10
  text: The passage states that the large man's defense was larger than the young
    man's, and that a smaller defense had more power; the young man's magic power,
    or orenda, is described as a tiny hand put in the palm of his own hand and born
    with him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The large enemy man called the young man a Stone Coat and threatened to kill
    and punish him for treachery.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The two opponents watched each other, paid no attention to the rest of the
    people, came hand to hand, and fought with clubs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young man snatched the stranger's club, hurled it away, threw him down,
    and killed him; when the enemy saw their chief man overpowered, they ran, many
