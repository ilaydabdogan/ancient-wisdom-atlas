  text: The dream told the young man that at noon the next day they would meet an
    enemy party greater in number and containing a very large man of great magic power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dream instructed that, when the enemy was seen, every man should hang
    up his bundle and then fight until they conquered.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the morning the young man did not tell the dream and the party continued
    after eating.
  category: sequence
  evidence_refs:
