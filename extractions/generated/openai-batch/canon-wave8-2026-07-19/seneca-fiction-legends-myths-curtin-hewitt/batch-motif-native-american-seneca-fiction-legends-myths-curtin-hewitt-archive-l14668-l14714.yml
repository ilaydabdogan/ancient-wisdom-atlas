canonical_text:
  quote: ''
  summary: A young man receives a dream warning that his party will meet a more numerous
    enemy and a very large man with magic power. The dream instructs them to hang
    up their bundles before fighting. The next day a speaking bear appears and disappears,
    identified in the passage as one of the enemy. The parties meet in battle; the
    young man follows the dream's instruction, recognizes the large enemy by his magical
    defense, and defeats and kills him in hand-to-hand combat. The enemy flees, many
    are killed, and none of the twenty men in the young man's party is injured.
  language: English
  quote_policy: summarized
