canonical_text:
  quote: ''
  summary: 'A pursued hunter, nearly out of torchlight, hears evidence that another
    dog has been killed and realizes the Genonsgwa is near. He cries a distress signal
    toward his nearby settlement; his people run to him, and he reaches their circle
    just as the Genonsgwa tears flesh from his leg before fleeing. The next legend
    begins: three warriors travel to kill people and take scalps, conceal themselves
    near settlements, and use night scouts to investigate distant lights and plan
    attacks.'
  language: English
  quote_policy: summarized
