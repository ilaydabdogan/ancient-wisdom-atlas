canonical_text:
  quote: ''
  summary: The passage recounts Seneca messengers deceiving and escaping Seoqgwageonon
    pursuers, a Seneca ambush, and later friendship with Cherokee hosts. It then begins
    the tradition of Hatcinondon, a great Seneca warrior, who raids in Cherokee country,
    flees pursuers into reeds, is summoned at night to the lodge of Heron or Ne Hononhsot,
    receives food that restores itself as he eats, and witnesses the bright arrival
    of the Sun, who hurries east because it is night on earth.
  language: English
  quote_policy: summarized
