  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At an opening called Odaiadon, Seneca people are arrayed in the form of a
    horseshoe and close in when pursuers enter the formation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Seneca capture and kill all the pursuers except one horseman, who turns
