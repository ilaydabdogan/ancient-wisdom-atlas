canonical_text:
  quote: ''
  summary: A Turkey Brother resumes human form, calls his tutelary Moose, and sends
    it to rescue his captive brother from an old woman and her daughters. The Moose
    returns with the weakened brother, and the brothers are reunited. A following
    section introduces S'hodieonskon, identified as the Trickster, who deceives several
    communities or groups with false cures, bodily tricks, and harmful imitations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Turkey Brother is anxious about his brother, becomes enraged at the woman,
    and seeks a way to cast off a turkey-skin robe that has grown to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Turkey Brother frees himself from the turkey-skin garment, hangs it up,
    puts his plumed chin-band on his head, and acts in human form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Turkey Brother calls on his tutelary Moose for aid, and the Moose appears
    before him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Turkey Brother sends the Moose westward to the place where an old woman
    and her daughters hold his brother captive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Turkey Brother instructs the Moose to carry his brother on its back and
    to exchange its horns for the Turkey Brother's plumes because the horns are too
    heavy for swift running.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Moose returns with the brother hanging on its neck, and the brother is
    so weak that he cannot stand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Turkey Brother restores the Moose's horns, receives back his own plumes,
    dismisses the Moose, and brings his brother into the lodge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Turkey Brother chides his brother for going with the woman and says that
    the brothers are now free from the woman and can live happily together.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: S'hodieonskon goes on a journey to distant places for adventures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At one village S'hodieonskon tells people that a disease can be cured by married
    persons sleeping with other people's spouses, and the people believe and follow
    this instruction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At a second village S'hodieonskon announces a plague and tells families to
    cut holes in lodge walls and place their buttocks in the holes; the people do
    so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: S'hodieonskon mocks the second-village people as fools and thrusts his walking-stick
    through the lodge-wall holes before leaving.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: S'hodieonskon appears with hair reaching the ground and claims that he lengthened
    it by tying it to a tree limb and jumping down.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man imitates S'hodieonskon's hair-lengthening method, has his scalp torn
    off, falls, and is killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: People identify the deceiver as S'hodieonskon and run after him to overtake
    and kill him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The pursuers see a man in a creek spearing fish with a sharpened leg, and
    he claims he can heal the leg by spitting on it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The men ask to have their legs sharpened to spear fish; after entering the
    water they become sore, catch nothing, cannot heal their wounds by spitting and
    rubbing, and S'hodieonskon disappears.
  category: sequence
  evidence_refs:
  - ev:8
