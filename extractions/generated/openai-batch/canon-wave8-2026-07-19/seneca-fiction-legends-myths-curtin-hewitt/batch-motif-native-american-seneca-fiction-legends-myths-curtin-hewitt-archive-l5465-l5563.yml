canonical_text:
  quote: ''
  summary: The passage closes a chestnut-stealing episode in which a youth uses a
    mole’s body to spy on sisters, returns with chestnuts to his starving uncle, and
    later succeeds as a hunter through the mole’s aid. A note gives an alternate version
    involving geese, bodily entry into the youngest sister, pregnancy, birth, and
    mastery of chestnuts. The passage then begins a tale in which a chief’s fawn-skin
    pouch fetish is used for hunting declarations; the chief’s son-in-law kills two
    otters before daylight, eats their hearts, breaks the pouch’s orenda through a
    taboo violation, is abandoned naked, and receives help from a stranger who directs
    him to a bear in a hollow tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youth entered the body of the mole, had it travel underground to the lodge,
    and listened from the mole while people spoke inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters discussed the stolen chestnuts, compared the youth’s success with
    his uncle’s earlier success, and decided to let the stolen chestnuts go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth returned home with a bag of chestnuts while his uncle was sitting
    by the fire and singing that he would die of hunger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The uncle welcomed the youth, thanked their guardian spirits, and the passage
    states that the youth later became a great hunter because the mole was his guardian
    spirit and aid.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note states that another version has a tree guarded by geese; the lad enters
    a goose and then the youngest sister, who becomes pregnant, and by being born
    of her he becomes master of the chestnuts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A prominent chief with six or seven families went to distant hunting grounds
    in the fall, found no game for many days, and possessed a fawn-skin pouch fetish
    or charm.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief asked people to touch the pouch and declare what each intended to
    kill the next day; despite his wife’s attempt to stop him, the son-in-law touched
    it and declared he would kill two otters before daylight.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: At midnight the son-in-law went to a loop in the neighboring stream, killed
    two otters, removed their hearts, roasted them, and ate them before daylight.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that eating the otter hearts destroyed or spoiled the orenda
    of the pouch, and the others returned without game.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief discovered that the otters’ hearts had been removed and became angry;
    his daughter hid dog flesh and a knife for her husband in case of need.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chief said the son-in-law had nullified the pouch’s orenda by eating a
    taboo that was the earnest of the compact with it; after the daughter objected
    to killing him, the group stripped him and left him without provisions.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At midnight, while the son-in-law was alone, a stranger approached on snowshoes,
    told him he would not die, and instructed him to follow tracks to a hollow tree
    where he would find a bear.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The next morning the young man found only rabbit tracks, followed them to
    a hollow tree, killed the bear inside, and made a robe and moccasins from its
    skin.
  category: sequence
  evidence_refs:
  - ev:9
