canonical_text:
  quote: ''
  summary: A young man escapes by canoe across a lake with wild geese as his servants
    and propellers while S'hagowenot'ha calls after him. He reaches home at dawn,
    enters a lodge, and meets a young woman who identifies herself as his younger
    sister and says Okteondon, their uncle, stole her. The siblings attempt to return
    home by canoe, concealing tracks with bark strips. The sister's husband pursues
    them first with a fishhook and line and then by drinking up the lake water, drawing
    the canoe toward his mouth.
  language: English
  quote_policy: summarized
