canonical_text:
  quote: ''
  summary: Two allied young men, including Hodadenon, travel toward a dangerous place
    associated with evil-minded women in order to obtain tobacco and recover lost
    kin. They stop by a fire, arrange food, and perform a tobacco offering with an
    invocation for aid. They enter a tobacco lodge, encounter an enslaved old man
    who works tobacco, obtain a twist of tobacco, send it to Hodadenon's sister, and
    receive a warning about a slippery ice-covered lake and a bone-rain curse near
    the wicked women's lodge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hodadenon and a companion affirm friendship, speak of having no remaining
    relations, and agree to travel together to obtain tobacco from the place associated
    with women of evil minds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two stop near remains of a fire, eat bread and meat, and prepare a ritual
    called a feast of Reunion of the Living by placing provisions around the fire
    and hiding part of the food in the dark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hodadenon casts tobacco into the fire and invokes animals, forest inhabitants
    immune to enchantment, and beings who made the lives of himself and his friend,
    asking for assistance and saying they will fetch those who perished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At midnight the two resume travel, hear sounds ahead, and approach a lodge
    in the place where those with evil minds dwell.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Inside a lodge they find an old man singing about making tobacco, beating
    a drum, and pounding tobacco with a mallet; after Hodadenon strikes him, the old
    man calls them nephews and says he is a slave working in tobacco.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hodadenon takes a twist of tobacco and sends it to the chimney opening of
    the lodge where his sister is; the tobacco drops into the ashes, and the sister
    picks it up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The old man says the wicked women's lodge stands across a lake with very slippery
    ice and warns that a voice can command bone-rain, after which a person becomes
    a pile of bones if that person is a sorcerer.
  category: speech
  evidence_refs:
  - ev:7
