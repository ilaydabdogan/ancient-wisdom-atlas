canonical_text:
  quote: ''
  summary: Women return from the men's camp and identify Okteondon as the husband
    with the most orenda. Okteondon warns his companions not to look up as they cross
    the ice toward the shore; after a sung warning about bones, one companion is lost
    and the shore crowd vanishes except for the witch mother-in-law Kahenchitahonk.
    At her ice lodge, Okteondon makes fire, refuses to let his companions eat sorcerous
    food, and neutralizes the food with a reed through the ice. His wife warns that
    her mother will test his orenda and try to kill him. Kahenchitahonk stages a dream-command
    requiring Okteondon to kill S'hadahgeah and return before the door-flap stops
    swinging. Okteondon uses a cord made from his wife's hair to keep the door-flap
    moving while he goes out and shoots S'hadahgeah perched on a cloud.
  language: English
  quote_policy: summarized
