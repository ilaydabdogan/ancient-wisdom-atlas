canonical_text:
  quote: ''
  summary: Doonongaes consults an old man who is a white bear about Deanohdjes, travels
    through extreme cold to Deanohdjes in an ice lake, and carries a message about
    a council at Broken Land. He returns to Tsodiqgwadon, and the pair travel, stretch
    and rename a decorated stranger, transform an unsuccessful hunter and his arrow,
    then descend to a three-pointed plain beneath a cliff where Doonongaes disrupts
    an old bowl-maker's lodge.
  language: English
  quote_policy: summarized
