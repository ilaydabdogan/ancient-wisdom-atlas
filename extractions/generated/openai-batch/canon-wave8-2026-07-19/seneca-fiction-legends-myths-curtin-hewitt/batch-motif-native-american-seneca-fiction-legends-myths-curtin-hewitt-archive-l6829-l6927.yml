canonical_text:
  quote: ''
  summary: A little boy called the Potent One defeats Stone Coat in a log-kicking
    contest, takes Stone Coat's dog, then ignores his father's warnings against going
    southwest to a gambling place and east to a ball-playing country. He defeats a
    big-headed dice player who kills losers for their heads, frees the people, and
    later wins the eastern country in a ball game between animal-named clans. The
    next tale opens with a hunter, wife, son, and daughter living in a hemlock-bough
    lodge; the wife repeatedly sends the fearful son for water, adorns herself, goes
    away for bark for the fire, becomes cruel to him, and the son reports this to
    his father.
  language: English
  quote_policy: summarized
