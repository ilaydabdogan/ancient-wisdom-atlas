canonical_text:
  quote: ''
  summary: A child left alone in a forest lodge hears a hidden man asking for tobacco.
    The child finds a skeletal man in the loft, who explains that tobacco is held
    by Seven Sisters and their mother beyond a path guarded by deadly trees, snakes,
    beings at a rock passage, alarm-giving herons, and a singing human skin. The boy
    undertakes the journey and passes several guardians by rushing past one transformed
    tree and giving offerings to snakes, rock-guardians, and herons.
  language: English
  quote_policy: summarized
