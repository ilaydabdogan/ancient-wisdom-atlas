canonical_text:
  quote: ''
  summary: The passage describes a man fleeing his wife, who has changed into a powerful
    Flying Head. Dogs, kin at successive lodges, and an invisible brother help delay
    the pursuer. The Head kills and devours helpers, but is finally killed when boiling
    bear oil is thrown on it. The mothers then call for a thanksgiving ball game using
    the Head as the ball, and wild beasts play with it until it is worn out. Afterward
    the dog says the wife is dead, and the invisible brother directs the man westward
    toward his children before disappearing.
  language: English
  quote_policy: summarized
