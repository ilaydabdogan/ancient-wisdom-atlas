canonical_text:
  quote: ''
  summary: A cast-out young woman becomes the wife of a young man. His mother grows
    jealous, and the couple withdraws to the forest, where a son is born. The husband
    later visits his mother repeatedly and eventually does not return. Years later
    the son finds his mother alive but cut in half. She explains that two men sent
    by her six sisters stole her lower body so that wampum beads might be gathered
    from it. She says the body can be restored if the stolen half is recovered, gives
    her son orenda to summon aid, and gives him a tiny black dog as a helper.
  language: English
  quote_policy: summarized
