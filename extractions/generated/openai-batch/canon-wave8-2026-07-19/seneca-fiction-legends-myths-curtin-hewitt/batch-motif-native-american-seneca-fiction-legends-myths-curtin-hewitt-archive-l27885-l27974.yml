canonical_text:
  quote: ''
  summary: In a lodge, an aged matron explains that Dehodyadgaowen, also called Owisondyon,
    is a cloven-bodied being whose icy side brings cold wintry weather and whose other
    side brings warmth. The lodge members, identified with Thunder, awaken with thunder-like
    sounds and warm breeze. They take Dehaenhyowens and his party to see a powerful
    tree-dwelling Otkon, appearing as a squirrel, which the Thunder men have long
    failed to kill despite thunder, lightning, and storm. Dehaenhyowens kills it with
    a knob-headed arrow. The body is brought back, and the old woman receives the
    prepared skin as a precious couch robe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A strange man is described as human-like in some respects, while the other
    half of his body is crystal ice, and a chilling breeze comes from the doorway
    when he appears.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The aged matron identifies the strange man as Dehodyadgaowen, the Cloven-bodied
    Man, also named Owisondyon, Falling Hail.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The matron says that the being's exposed icy feature causes cold and wintry
    days and nights, and that when the other side is shown a hot breeze will blow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lodge members say the guests have been there many days and that humans
    call the time springtime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At morning Dehodyadgaowen appears again and calls the sleepers to wake; their
    yawning and loud cries are compared in the passage to Thunder on earth, and a
    warm breeze arises.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The men of the lodge invite the visitors to see an Otkon that inhabits trees
    and say they have long tried to kill it because it has powerful orenda.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the Otkon's lair, one host strikes a tree with a club, the being emerges
    partly, and the visitors conclude that it is what they call a squirrel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The men of Thunder attack the Otkon with thunder, lightning, and storm effects,
    but fail to hit it; the squirrel flees between trees and returns to its lair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dehaenhyowens says his side will attempt to kill the Otkon, despite the men
    of Thunder warning that the attempt may injure them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: One of Dehaenhyowens's party taps the tree, the squirrel emerges, and Dehaenhyowens
    shoots it in the head with a knob-headed arrow, causing it to fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The men of Thunder carry the squirrel's body home and report that the visitors
    have killed the Otkon which they had long failed to kill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old woman asks that the Otkon's precious skin belong to her as the robe
    of her couch, and Dehaenhyowens skins, prepares, dries, and presents it to her.
  category: sequence
  evidence_refs:
  - ev:6
