canonical_text:
  quote: ''
  summary: Ot'hegwenhda defeats the old man Dewaqsent'hwils/Dewaqsent'hwus after a
    contest of magic power, cures the last three of his brothers, consults a fetish
    about trails, encounters an Onweaunt old woman in a deep lake, receives a divinatory
    point from her tail, heals many imprisoned people in her lodge, learns that her
    man-eating husband had confined them, and then proceeds to a northeastern lodge
    where a man and woman play with huge white flints.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ot'hegwenhda says he will try the old man's orenda or magic power; the old
    man insists on trying first, and their dispute becomes a fight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the old man strikes or kicks Ot'hegwenhda, his arms and legs fall or
    break off; Ot'hegwenhda prevents the limbs from rejoining the body, shoots an
    arrow through him, and the arrow takes root as a small tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the old man's head flies off, Ot'hegwenhda pounds the body to bits and
    says that his uncle is all in pieces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the old man's lodge, Ot'hegwenhda finds the last three of his brothers
    weak and wretched, cures them, and sends them home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ot'hegwenhda consults a fetish about the northeastern and northwestern trails,
    and the fetish answers that he will save some people if he goes on one trail and
    that there is some trouble in the northwest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the end of the northwestern trail, Ot'hegwenhda finds a lodge without a
    door and sees an Onweaunt old woman inside singing that he is coming.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old woman goes into a small, very deep lake; her tail appears circling
    on the water, and two fin-like objects on the tail make music when rubbed together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old woman asks Ot'hegwenhda not to kill her, says she never killed any
    of his people, and gives him one point from her tail in exchange for her life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old woman explains that the tail point is used by putting it under the
    head during sleep, after which a dream will tell the user what he wants to know.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside the old woman's lodge, Ot'hegwenhda goes through an opening in the
    ground and finds many people almost dead; he rubs them with hands on which he
    has spat, and they become well.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ot'hegwenhda asks the restored people where they came from and directs named
    groups toward their homes by different routes and journey lengths.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old woman says that her husband, a man-eater named Dewaqsent'hwus, shut
    up the people; Ot'hegwenhda says he has already killed him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old woman says she is glad the man-eater is dead, and Ot'hegwenhda warns
    that he will kill her if she ever chases his people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the northeastern trail, Ot'hegwenhda hears a man and woman singing that
    the youngest son of Hongak is going all over the world and that they wish he would
    visit them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The man and woman play by throwing white flints as large as a lodge; the stones
    strike or are caught without harming them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After returning to the lodge, the man senses that someone is present, goes
    outside, finds Ot'hegwenhda, and addresses him as his grandson.
  category: sequence
  evidence_refs:
  - ev:8
