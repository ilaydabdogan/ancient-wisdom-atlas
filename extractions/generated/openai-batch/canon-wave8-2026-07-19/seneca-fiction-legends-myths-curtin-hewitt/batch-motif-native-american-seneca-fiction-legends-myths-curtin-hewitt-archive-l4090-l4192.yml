canonical_text:
  quote: ''
  summary: Haiendonnis kills Gaasyendiet'ha, a panther, and a fox by pointing at them,
    makes their skins into pouches, and later commands the pouches to stand alive.
    A nearby witch mother sends each of her three daughters with corn bread to ask
    whether Haiendonnis will marry them. Haiendonnis stations the animated animal-skin
    pouches as frightening obstacles. The first two daughters flee and lose their
    bread, but the youngest strikes the figures and reveals them to be only animated
    skins or pouches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While hunting, Haiendonnis points his finger at Gaasyendiet'ha, who falls
    dead, and Haiendonnis removes the skin for a pouch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haiendonnis kills and skins a panther and a fox in the same manner, makes
    three pouches from the skins, and hangs them on the wall of his cabin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haiendonnis commands the Gaasyendiet'ha pouch to stand upright, and Gaasyendiet'ha
    appears alive before him; he makes the other two pouches come to life in the same
    way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rumor spreads that Haiendonnis has potent orenda, mighty magic power, and
    is a sorcerer whose potency works good for friends and evil for enemies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near Haiendonnis's cabin lives a woman with three daughters; the mother is
    reputed to be a great witch and lives there because people in her own settlement
    did not want to live near her.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother and daughters make corn bread, and the mother sends her eldest
    daughter, Deyondenni-gongenyons, with a basket of bread to learn whether Haiendonnis
    will marry her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the eldest daughter approaches, Haiendonnis stations Gaasyendiet'ha beside
    a tree, Panther nearer the cabin, and Fox in the doorway.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The eldest daughter sees a fierce-looking figure, turns back, flees, loses
    the bread from her basket, and Haiendonnis laughs as he watches her run home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother later sends the second daughter, Yonwithahon, with corn bread to
    ask whether Haiendonnis will marry her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The second daughter passes Gaasyendiet'ha and Panther but is frightened at
    the doorway by what she thinks is a man rubbing something against the door; she
    screams, flees, and loses the bread.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Haiendonnis customarily cleans intestines of game, fills them with blood and
    pieces of fat and meat, cooks them, and hangs many over his couch.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The mother makes another trial and sends the youngest daughter, Yenongaa,
    with corn bread, telling her not to notice or fear anything but to go directly
    to Haiendonnis's lodge.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Yenongaa strikes Gaasyendiet'ha and Panther so that each falls, recognizing
    them as animated skins.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: At the doorway Yenongaa strikes Fox, who falls; the passage explains that
    Fox was a fox-skin pouch whose tail had been brushed by the wind against the doorway
    flap, frightening her sister.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage states that the older sisters had thought living beings stood
    before them.
  category: relationship
  evidence_refs:
  - ev:12
