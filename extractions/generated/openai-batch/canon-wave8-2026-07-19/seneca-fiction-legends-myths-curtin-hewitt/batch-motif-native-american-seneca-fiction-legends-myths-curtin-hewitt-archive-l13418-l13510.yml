canonical_text:
  quote: ''
  summary: Hostoyowanen warns Doonongaes to leave southward. Doonongaes instead turns
    west, sees what looks like his wife's reflection in spring water, becomes frightened,
    runs south, and after extreme hunger changes from a man into a great snake. He
    enters a poor widow's lodge, uses an old bow and arrows to summon a bear, and
    later wins a contest by shooting a black eagle perched on a pole reaching to the
    clouds. His arrow cannot be pulled out by the men, but the widow's granddaughter
    retrieves it easily. The chief then sends for Doonongaes to marry his daughter,
    but Doonongaes resists, saying he already has many wives.
  language: English
  quote_policy: summarized
