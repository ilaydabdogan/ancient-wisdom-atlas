canonical_text:
  quote: ''
  summary: A Seneca tale opens with a sister and six elder brothers living in an east-west
    lodge. The eldest brother marries and gives his wife rules about the fire and
    doorways; she violates them, after which he is injured and the wife is sent away.
    In pursuit she blinds the brothers with her skin robe. The young sister cares
    for the blind brothers, then is lured into a canoe, taken to an island lodge,
    and warned by another girl that the residents will kill and eat them.
  language: English
  quote_policy: summarized
