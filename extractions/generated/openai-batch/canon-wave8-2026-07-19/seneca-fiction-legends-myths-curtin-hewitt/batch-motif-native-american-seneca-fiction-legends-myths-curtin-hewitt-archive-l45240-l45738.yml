  quote: ''
  summary: A maiden prepares and adorns herself, receives encouragement from an old
    woman to overcome and bring back a named figure called Two Feathers Together,
    travels to his dwelling area, hides and follows him, invites him to rest and have
    his head searched, waits until he sleeps soundly, then empties a pouch, encloses
    him in it, fastens it to a forehead band, and carries him away toward a distant
    sharp rock.
