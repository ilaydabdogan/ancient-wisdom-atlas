canonical_text:
  quote: ''
  summary: White Pigeon makes a final visit to the old man and announces death and
    hunting rules tied to disobedience of the Pigeon people. The community remains
    divided over these rules. A stranger takes the old man to the Eagle people on
    lofty mountains. A disbeliever is guided there by a Crow man and is thrown onto
    the moon. The old chief, Wild Cat, later becomes unwelcome among the Eagle people,
    is rolled down the mountain, changes into wolf form, lives among the Wolf people,
    and is eventually devoured by them. His grandson grows up and begins an eastward
    quest to find him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: White Pigeon visited the old man twenty years after a previous visit and appeared
    to him in all respects as a man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: White Pigeon told the old man that people would die because they had disobeyed
    the rules proclaimed by the Pigeon people, and that people must not kill white
    pigeons and must observe pigeon-hunting rules.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After White Pigeon's departure, factions among the people continued; some
    observed the hunting rules, some partly observed them, and others ignored or mocked
    them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stranger came to the old man's lodge, told him to accompany him, and led
    him over several days to the stranger's people on the top of very lofty mountains.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stranger's people were identified as the Donyohda or Eagle people, though
    they appeared to the old man as men like himself, and they received him with respect
    and kindness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Crow man told a disbeliever from the old man's people that the old chief
    was living among the Eagle people and offered to conduct him there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old chief recognized the disbeliever but refused contact with him and
    said the man's mind worked differently from theirs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief man of the Eagle people ordered a warrior to take the disbeliever
    away and throw him onto the moon; the warrior carried him there and left him on
    the moon's side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old Chief Wild Cat lived among the Eagle people for years, then became morose
    and despondent, and the Eagle people decided to send him away because his thoughts
    did not harmonize with theirs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An Eagle man rolled Old Chief Wild Cat down the mountain; at the foot of the
    mountain he was transformed into the bodily form of a wolf and found himself in
    a swamp inhabited by the Wolf tribe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Wolf people first welcomed Wild Cat, but later became angry with him,
    tore him in pieces, devoured him, and left his bones gnawed clean on the ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wild Cat's grandson, who had been a child when the Eagle man visited, grew
    up remembering his grandfather and began a journey toward the sunrise to find
    him.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: On his eastward journey, the grandson met men who asked where he was going
    and where he was from; the second man said he had seen the grandfather living
    among the Eagle people.
  category: speech
  evidence_refs:
  - ev:10
