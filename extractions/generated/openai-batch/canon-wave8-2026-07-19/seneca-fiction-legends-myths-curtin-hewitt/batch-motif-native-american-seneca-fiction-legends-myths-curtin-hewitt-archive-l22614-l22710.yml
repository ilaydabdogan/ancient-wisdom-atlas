canonical_text:
  quote: ''
  summary: The nephew returns with chestnuts, cooks mush, and restores his starving
    uncle’s health. The uncle says he watched a branch as an index of the nephew’s
    condition. They return to the women’s empty lodge, uncover stored chestnuts, and
    scatter them so all people may eat them. The uncle restores a woman’s hanging
    skin to human form by rubbing it with orenda. After returning home, the uncle
    instructs the now-grown nephew to undertake a dangerous eastward ten-day journey
    toward marriage, warning him of a trickster on the path and equipping him with
    oil, a human-skin pouch, a skull pipe, fire-making items, an awl, and a knife.
    At the destination is a woman’s tall tree with three mysterious hawks, also her
    daughters; the man who hits one may marry her youngest daughter.
  language: English
  quote_policy: summarized
