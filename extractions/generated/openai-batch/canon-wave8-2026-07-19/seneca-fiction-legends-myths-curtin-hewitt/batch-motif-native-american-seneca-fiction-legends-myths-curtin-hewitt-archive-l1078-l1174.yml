  quote: ''
  summary: The passage gives an introductory account of Seneca-Iroquoian myth-making
    as the personification and socialization of natural bodies, elements, and forces.
    It illustrates this with an Iroquois and Algonquian image of snow, the God of
    Winter, and the God of Life; lists several classes of beings in Curtin's Seneca
    narratives; and discusses creation myths as accounts of elder or first people,
    later called gods, whose activities explain the present order of nature.
  language: English
  quote_policy: summarized
