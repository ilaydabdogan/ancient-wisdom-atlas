canonical_text:
  quote: ''
  summary: Two peoples assemble on opposite sides of a river. Their chiefs speak about
    ending bloodshed, acknowledge a maker of their lives whose dwelling is unknown,
    and agree to bury war implements deep in the earth. They prepare a symbolical
    field of peace, cross the river, grasp arms, dance through the night, give thanks
    at dawn, return safely home, and the peace is said to have lasted. The passage
    then begins a new story by stating that white pigeons are chiefs among wild pigeons
    and that one white pigeon flew into the forest lodge of Wild Cat.
  language: English with a transcribed song line
  quote_policy: summarized
