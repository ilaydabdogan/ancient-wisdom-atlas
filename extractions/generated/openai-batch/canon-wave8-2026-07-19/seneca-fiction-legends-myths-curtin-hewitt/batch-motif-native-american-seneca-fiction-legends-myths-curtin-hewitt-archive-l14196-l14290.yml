canonical_text:
  quote: ''
  summary: A council scene presents Tsodiqgwadon as a figure of great orenda who directs
    Haiwanenqgwi to notify all peoples of a great council at Broken Land. Haiwanenqgwi
    first notifies the Dagwanoenyents at the eastern high rocks, then is instructed
    to visit Stone Coats and multiple island peoples. At the western edge of the earth
    he changes into a snake to cross water, then into a Hahnowa when thunder and lightning
    threaten him. He reaches islands, resumes human form, and delivers invitations
    to chiefs, who accept.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deanohdjes says Tsodiqgwadon has more orenda than anyone else, and Tsodiqgwadon
    tells the meeting to choose the person thought to have the greatest orenda.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council is adjourned for ten days, and Haiwanenqgwi is sent to notify
    all kinds of people in the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haiwanenqgwi reports that he has not seen the Dagwanoenyents, and Tsodiqgwadon
    says they live at Gaha Gastende, the high rocks in the east.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the mountain region of Wind Cliff, the Dagwanoenyents chief calls a meeting
    at a smooth place without trees or grass, and hundreds of Dagwanoenyents agree
    to attend the council.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsodiqgwadon instructs Haiwanenqgwi to notify the Stone Coats and several
    island peoples in a specified route before returning quickly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the western end of the earth, Haiwanenqgwi becomes a snake and enters the
    water; when thunder and lightning halt him, he says Hinon wants to kill him and
    changes into a Hahnowa, after which the threat stops and the sky clears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On Stone Island, Haiwanenqgwi resumes human form, is asked where his wampum
    is, says he has none, and is directed to the Stone Coats chief in a large rock
    opening.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Haiwanenqgwi travels over water in Hahnowa form to additional islands, resumes
    human form to deliver invitations, and chiefs including Hoonkgowanen and Deanohsgwis
    accept.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
