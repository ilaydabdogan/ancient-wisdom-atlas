canonical_text:
  quote: ''
  summary: The passage describes marriage and descent patterns in Guiana, contrasting
    female-line descent and residence with a father-in-law after marriage against
    traces of bride capture. It discusses gendered vocabularies among island Caribs
    and slight parallels in Guiana, legends of Caribs carrying off women as wives,
    and two possible explanations for the coexistence of family-based marriage and
    bride capture, with the author favoring occasional wife-taking by marauding male
    groups over a strict ethnic division.
  language: English
  quote_policy: summarized
