canonical_text:
  quote: ''
  summary: A first-person travel narrative describes a visit to a hut with two Macusi
    women, a food offering of farine boiled in milk, the corralling and slaughter
    of cattle, an overnight camp with beef cooking over fires that the Indigenous
    companions will not eat, travel to Anaikim/St. Anton, heavy rain and swollen rivers,
    canoe travel toward Quatata, efforts to keep clothing dry, and a flooded river
    carrying logs and a dead tree trunk with a turtle on it, likened by the narrator
    to a wrecked ship with a last survivor.
  language: English
  quote_policy: summarized
