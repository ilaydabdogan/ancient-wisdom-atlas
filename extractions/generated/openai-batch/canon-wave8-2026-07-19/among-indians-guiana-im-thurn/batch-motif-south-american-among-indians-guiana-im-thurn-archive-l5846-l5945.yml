literal_observations:
- id: obs:1
  text: Interior Guiana is described as having many fish species, while ordinary travelers
    are most likely to notice several forms caught for food, including pacu, haimara,
    lowlow, and arapaima.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Three fishes are singled out as dangerous enemies rather than primarily as
    food: the perai, the electric eel, and the sting-ray.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The perai is described as swarming in nearly all rivers away from the sea
    and as extremely voracious, biting ducks, iguanas, alligators, wounded perai,
    shot animals, hooked fish, and drowned human bodies.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Bathing or wading in waters frequented by perai is described as dangerous;
    the passage gives examples of a boatman and the narrator being bitten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The perai’s teeth are described as sharp enough that Indians use a jaw to
    sever poisoned points from blow-pipe darts.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The electric eel is described as a fish to avoid because it can inflict a
    severe electric shock; the narrator reports being shocked after seizing one during
    fish-poisoning at a dammed creek.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Electric eels are said to be abundant in some places, where convicts sometimes
    receive shocks while bathing; long confinement is said to make the eels lose their
    electric power.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sting-ray is described as a flat fish with a whip-like tail armed with
    a barbed spine, lying on sand in shallow water and striking when trodden on or
    disturbed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sting-ray wounds are described as severe, sometimes fatal, and possibly poisonous
    or unwholesome; the narrator reports a prolonged foot wound suffered by an Indian
    in his service.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The sting-ray spine is described as being used by Indians in place of a lancet
    and as retaining irritating power after removal from the animal.
  category: object
  evidence_refs:
  - ev:8
