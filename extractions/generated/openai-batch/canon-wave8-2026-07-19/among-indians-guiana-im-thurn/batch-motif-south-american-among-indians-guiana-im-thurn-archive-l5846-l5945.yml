  summary: 'The passage surveys fishes of interior Guiana, then focuses on three dangerous
    aquatic animals: the perai, electric eel, and sting-ray. It describes their habitats,
    attacks or injuries to animals and humans, and Indigenous practical uses of perai
    jaws and sting-ray spines.'
