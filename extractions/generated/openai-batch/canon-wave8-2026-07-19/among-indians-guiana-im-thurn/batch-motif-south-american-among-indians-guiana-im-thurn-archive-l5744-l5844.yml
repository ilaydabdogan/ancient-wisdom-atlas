literal_observations:
- id: obs:1
  text: The labarria is described as a small but very venomous snake, dull in colour
    and resembling a dead stick, so that it may go unnoticed until it strikes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A file of nine men passed over or near a coiled labarria on a forest path;
    after it was killed and removed, another labarria was later found in the same
    place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that a labarria bite may cause death or loss of the bitten
    body part; an Arawak man lost one foot and the leg up to the knee but remained
    active with a stick.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A rattlesnake once occupied a basket used for storing bread and escaped without
    harming anyone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some snakes are described as visually beautiful, including a bright green
    parrot-snake and a coral snake with brilliant pink bands.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtles are abundant in most rivers; their eggs and flesh are used, and the
    mata-mata has a rugged shell and strong smell that can be removed by washing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jaguars are said to eat turtles, with freshly emptied scratched shells and
    jaguar tracks observed as evidence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A forest tortoise is commonly brought home by hunters, is valued as food,
