  quote: ''
  summary: The passage discusses a Guiana Amerindian belief, as described by the author,
    that animals speak, possess spirits like humans, and may retaliate against humans.
    It also describes water-dwelling monstrous beings such as the di-di or water-mama
    and the omar, and extends spirit belief to plants, stones, and rivers. The author
    compares these patterns with Brer Rabbit tales and with European fabulous creatures.
