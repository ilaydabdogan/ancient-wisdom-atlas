canonical_text:
  quote: ''
  summary: The passage gives a natural-history account of reptiles in Guiana. It argues
    that snakes and other reptiles are usually not dangerous to humans, describes
    alligators and caymans in mud, water, and rivers, notes tail regeneration or tail
    anomalies in reptiles, and describes iguanas as tree-dwelling riverbank lizards
    hunted for flesh and eggs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Snakes are said to be numerous in Guiana but seldom seen and only rarely harmful
    to humans; they are described as shy and retiring before people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alligators are numerous in coastal mud-and-water areas, can grow larger in
    remote swamps, and are described as rarely harmful to humans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Caymans on interior rivers are described as floating on the water surface
    and sometimes raising and striking their tails on the water; the suggested fish-attraction
    explanation is presented as needing confirmation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that bathing near basking caymans in shallow water is not
    dangerous if the bather watches them and is ready to run when they move.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lizards are said to regrow lost tails, and sometimes to develop a secondary
    tail from an injured spot; the narrator reports seeing a double-tailed alligator
    on a sandbank in the Corentyn River.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The iguana is described as a large tree-dwelling herbivorous lizard living
    near riverbanks, green when young and dull grey-green later, with a jagged back
    ridge and large dewlap especially in males.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Iguana flesh is compared to delicate chicken and is said to be appreciated
    by both Indians and Europeans; iguanas are scarce in peopled districts but abundant
    along some interior rivers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the Cabalebo, iguanas are observed lying in upper branches overhanging
    water and often throwing themselves into the water with a loud splash when approached.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Iguana eggs are found buried in holes in sandbanks; the men dig out many eggs,
    and Indians may dig four or five feet or more to reach them.
  category: action
  evidence_refs:
  - ev:7
