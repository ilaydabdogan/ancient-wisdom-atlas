canonical_text:
  quote: "“Each took the name of some object near; and the representative of this
    family took the arara tree...”"
  summary: The passage lists Arawak family names and proposed meanings. Many are explained
    as being “from” or “sprung from” animals, insects, birds, trees, palms, plants,
    or other sources. Several entries report disputed explanations from different
    informants. One account says that persons of different families once met to assign
    family names and each chose the name of a nearby object; the Aramokéna representative
    chose the arara tree because its leaves were on the ground where he sat.
  language: English
  quote_policy: quoted
