  quote: ''
  summary: The passage warns that European and missionary recorders may have mistaken
    Christian-influenced elements in Indigenous Guiana stories for original Indian
    traditions. It discusses possible misreadings or post-contact additions involving
    a rain prayer, world-flood stories, and Arawak world-fire stories, and says the
    following folklore will try to exclude material of doubtful Indian origin.
  language: English
