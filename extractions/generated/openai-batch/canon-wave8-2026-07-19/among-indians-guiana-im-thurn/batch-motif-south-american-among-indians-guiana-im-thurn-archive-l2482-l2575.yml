  quote: ''
  summary: The narrator describes travel during the rainy season near the Pirara,
    crossing flooded ground and the bed of Lake Amoocoo with Indian companions, reaching
    Quatata, and later preparing to return to Georgetown amid scarcity, rumours, a
    missing canoe, illness, and rapidly rising waters on the downstream journey.
  language: English
  quote_policy: summarized
