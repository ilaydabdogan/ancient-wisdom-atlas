canonical_text:
  quote: ''
  summary: The passage describes social authority among Guiana Indians as layered
    among fathers, peaiman, settlement headmen, and colonial-recognized captains.
    It also describes social norms of obedience, mutual rights, treatment of women
    and children, family affection, public opinion, and blood-revenge obligation as
    mechanisms of order.
