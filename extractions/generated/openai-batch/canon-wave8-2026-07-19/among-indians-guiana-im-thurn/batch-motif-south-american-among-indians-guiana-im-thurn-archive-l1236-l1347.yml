canonical_text:
  quote: ''
  summary: A travel narrative section describes Nikari-karu settlements, bat attacks
    during sleep, the Indians’ amused response to a sponge, collecting and eating
    turtle eggs, engraved rock-pictures at Warrapoota, a night search for an omar
    or evil being that proves to be a labba, the feared Paiwarikaira boulder whose
    sight or disrespect is said to bring misfortune, and a reported rock in which
    God has shut up a man until he ceases swearing. The passage ends as a peaiman
    or medicine man is introduced.
  language: English
  quote_policy: summarized
