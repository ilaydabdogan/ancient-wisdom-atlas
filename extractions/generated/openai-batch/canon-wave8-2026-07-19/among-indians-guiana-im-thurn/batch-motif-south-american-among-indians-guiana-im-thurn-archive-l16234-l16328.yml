canonical_text:
  quote: ''
  summary: The passage describes Guiana shell-mounds, their sizes, shell and burned-layer
    structure, excavated contents, human and animal remains, implements, ornaments,
    pigments, pottery, a damaged skull, and a European-manufactured tobacco-pipe stem
    used as chronological evidence for later additions to one mound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named mounds are compared by size and shape, including Warramoori,
    Sireeki, Piracca, and Pawaiéykémoo.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The examined mounds are described as similar in character and contents, chiefly
    consisting of accumulations of small black-and-white Neritina lineolata shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shell mass is described as lying in distinct layers separated by thin
    hard strata of an apparently burned substance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author rejects the suggestion that the hard slabs were baking-slabs and
    proposes instead that fires were periodically made on the mounds.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Cabacaboori mound contained multiple shell types, crab-shells, fish and
    mammal bones, and human bones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The human bones are said to be scattered rather than found as complete skeletons,
    and to have been split for marrow extraction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stone implements, charcoal, red body-pigment called faroah, and sharp-edged
    quartz fragments are reported from the mounds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The quartz fragments are interpreted as possible cutting implements brought
    from a distance because they do not occur naturally nearby.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Peculiar Cabacaboori finds include silver ornaments, carved bone implements,
    puzzling rod-like bodies, one Purpura coronata shell, and pottery fragments apparently
    from one vessel.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Sireeki skull was found in twenty-seven pieces and reassembled; it had a
    hole in the top apparently made by an implement such as a stone hatchet.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Piracca, a European-manufactured tobacco-pipe stem was found three feet
    below the surface and treated as evidence that the mound was added to after European
    presence began.
  category: sequence
  evidence_refs:
  - ev:8
