canonical_text:
  quote: ''
  summary: 'The passage describes Guiana Amerindian dart, arrow, bow, and ornament
    manufacture. It notes ourali/curare poison for darts and some arrows, details
    reed arrows with wooden fore-shafts, pitch, cotton binding, varied points, and
    notches, then describes two feather headdress types: one crown-like and one halo-like,
    both built on wickerwork frames with ordered feather rows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dart apparatus is described as simple, skillfully made, and able to propel
    a dart forcefully into the air.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ourali, also called curare or urari, is identified as a poison used for darts
    and for some bow-shot arrows.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arrows are described with long reed shafts, short hard-wood fore-shafts fastened
    with karamanni pitch, and cotton binding at the point of union.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arrow points may be formed from notched or barbed fore-shafts, or from separate
    points of iron, hardened bamboo, or rarely turtle-bone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The arrow notch is made by crossing slits in the reed, removing pith, inserting
    a notched hard-wood plug, and binding the reed rind with cotton.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Arawaks, Ackawoi, and True Caribs are named as making the neatest arrows
    among the various tribes mentioned.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bows are long, straight, made of hard wood such as purpleheart or letter-wood,
    and use crowia-fibre bowstrings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ornaments are generally said to consist of feathers, teeth, or seeds tied
    together.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Feather ornaments include two headdress forms and ruffs or mantles worn round
    the shoulders.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: One headdress type has feathers standing crown-like around the head; the other
    has feathers standing straight out, compared by the author to a saint's halo in
    an old picture.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The crown-like headdress uses a light wickerwork frame, a cotton band, rows
    of sorted feathers, and a narrow white earth-coated cotton fillet.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The crown-like headdress has three long red macaw tail feathers at the back;
    their tips may be clipped into shapes or replaced with white feather tips.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the crown-like headdress is not in use, the feather band can be removed
