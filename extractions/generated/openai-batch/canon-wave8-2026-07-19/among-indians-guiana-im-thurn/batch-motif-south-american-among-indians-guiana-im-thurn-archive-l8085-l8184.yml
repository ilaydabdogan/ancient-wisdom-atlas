canonical_text:
  quote: ''
  summary: 'The passage describes clothing and adornment among Indigenous groups of
    Guiana: men’s laps, women’s queyus, older bark, cotton, and seed variants, European
    cloth and beads, utilitarian eta-palm sandals, gendered and occasional ornament
    use, body painting, limited tattoo marks, surgical scars, pigments, face and body
    paint patterns, and common male ornaments such as bush-hog tooth necklaces and
    armlets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men’s laps are described as usually made of blue salemporas cloth obtained
    from Europeans, with Warrau exceptions made from beaten inner tree bark.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that bark laps and possible cotton laps are probably survivals
    or predecessors of current cloth laps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women’s queyus are described as usually made of European beads, while Warrau
    women use bark, some Arecuna women use loose cotton strings in a fringe, and Pianoghotto
    women use small bright-colored seeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage records tribe-specific color and pattern tendencies in bead queyus,
    including Ackawoi dark blue with red and white rows and Macusi white ground with
    a red or blue pattern.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sandals are cut from the leaf-stalk of the eta palm and worn on very stony
    savannah ground to protect the feet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sandals are tied by a string passing between the great toe and the next
    toe, wear out within a few hours, can be quickly replaced, and are made to the
    wearer’s foot measurement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that ornaments are more abundantly used by males than by
    females.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some people are described as always wearing ornaments, while others wear them
    only for special occasions such as feasts and ceremonial visits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Body painting is described as the simplest adornment and as widely practiced;
    tattooing or permanent skin alteration for ornament is said to be very limited.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Small permanent marks at mouth corners or on arms are identified as distinctive
    tribal marks, while many straight incised lines on adults are described as surgical
    scars rather than ornaments.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pigments used for painting include red faroah, blue-black lana, carmine caraweera,
    white clay, and a yellow substance, with oils scented by natural resins used as
    vehicles.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A well-dressed man may paint feet, trunk, nose, eyebrow area, forehead, and
    other parts of the face with red or blue-black paint in masses, streaks, spots,
    lines, or intricate patterns.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Women, especially Ackawoi women, are described as favoring blue-black body
    paint, including a broad band edging the mouth and extending from mouth corners
    to ears.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Some women use small figures compared by the author to Chinese characters;
    the passage says the Indians are unable or unwilling to explain them.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: Two ornaments worn frequently by men of all tribes are identified as a necklace
    of bush-hogs’ teeth and a pair of armlets.
  category: object
  evidence_refs:
  - ev:12
