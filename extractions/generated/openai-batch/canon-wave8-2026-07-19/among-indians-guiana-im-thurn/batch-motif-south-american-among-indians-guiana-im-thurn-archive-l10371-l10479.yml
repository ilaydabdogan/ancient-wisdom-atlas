  summary: The passage describes domestic food preparation and meal service, emphasizing
    that ordinary cooking is women’s work and that men are served pepper-pot and cassava-bread.
    It then explains that fire is usually kept burning or carried, but when a new
    fire is needed it may be made with jasper and knife or by friction of two dried
    wooden sticks. The author gives a detailed practical account of the fire-stick
    apparatus and the sequence by which dust smokes, ignites, and is blown into flame.
    A footnote mentions speculation about the first origin of fire and reports a West
    Indian claim that bamboo stems can make natural fire through rubbing in high wind.
  language: English
