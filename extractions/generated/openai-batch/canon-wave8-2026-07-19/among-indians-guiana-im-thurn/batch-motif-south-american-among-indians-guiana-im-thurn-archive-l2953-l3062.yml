canonical_text:
  quote: Our two Indians who had visited the place before gasped out ‘ Kaieteur, he
    dry.’
  summary: The passage describes portaging a boat, entering the Kaieteur ravine through
    high sandstone cliffs, observing lush plants and sparse bird life, comparing cliff
    forms to Roraima, and then approaching a distant cliff where the expected Kaieteur
    fall appears absent except for rising white mist.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The party had to carry the boat across a roughly quarter-mile portage over
    a hill; men laid rollers, harnessed themselves by a rope to the boat's bows, and
    pulled it across.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: At Amootoo the party passed between two high hills into the Kaieteur ravine,
    where the Potaro has cut through a high sandstone plateau.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:3
  text: The ravine is described as ending in a complete amphitheatre at the great
    fall, with a column of water dropping from the plateau.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sandstone ravine is described as very moist, with streamlets, ferns, mosses,
    aroids, orchids, and parasitic gentians growing among the rocks.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A cliff face in the ravine reminded the narrator of Roraima; an Indian companion
    who had been to Roraima pointed to one rock and called it ‘little Roraima.’
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Animal life is described as not abundant, though cocks of the rock, a hawk,
    maroodi, kingfishers, and a pair of green toucans are observed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Waratoo cataract the party carried goods past the cataract and dragged
    the boat up in the water rather than using the short portage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: From a distant viewpoint where the Kaieteur fall was expected, the observers
    saw no water, only dense white mist rising toward the cliff face.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two Indians who had visited the place before said that Kaieteur was dry; the
    group looked solemn and laughed nervously.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator reflects that the difficult journey and expectations had led
    to the prospect of seeing a fall where no fall was visible.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A turn in the river soon hid the Kaieteur cliff, and the party paddled gloomily
    toward the landing place at Tookooie cataract while the white clouds remained
    the narrator's only hope.
  category: sequence
  evidence_refs:
  - ev:10
