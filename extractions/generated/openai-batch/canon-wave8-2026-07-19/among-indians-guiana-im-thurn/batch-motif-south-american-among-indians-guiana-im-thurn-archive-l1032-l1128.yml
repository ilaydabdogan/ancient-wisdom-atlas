  summary: The passage describes travel through sparsely inhabited river country in
    British Guiana, forest camping at night, fires and hammocks, nocturnal animal
    sounds, dawn preparations and bathing in the river, morning birds and a passing
    canoe, and the hunting, eating, and smoking of a young tapir.
  language: English
  quote_policy: summarized
