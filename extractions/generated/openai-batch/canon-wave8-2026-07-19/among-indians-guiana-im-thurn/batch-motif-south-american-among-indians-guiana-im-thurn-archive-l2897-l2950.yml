canonical_text:
  quote: ''
  summary: The narrator describes avoiding a difficult river portage by hauling the
    boat up the falls and carrying goods across, then encountering several Ackawoi
    settlements. At a large settlement near Aykooroo creek, a crowd at a multi-day
    paiwari feast greets the travelers; people wear varied clothing, body paint, and
    ornaments. In the captain’s house, troughs of paiwari stand at the center while
    men and women move in procession with drums or rattles, stamping and chanting.
    The passage ends with the travelers approaching Amootoo fall and cataract.
  language: English
