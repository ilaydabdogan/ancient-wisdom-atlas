  summary: The passage describes practical fire-making and fire-maintenance methods,
    Indian meat cooking as pepper-pot with cassareep and peppers, cassava as a staple
    vegetable food, and women’s work peeling, washing, grating, and pressing cassava
    pulp in a matapie.
