literal_observations:
- id: obs:1
  text: Warraus choose particular woods for fire-making because their friable grain
    produces inflammable dust; the Macusi Apeiba wood produces little dust, so tinder
    must be placed under the stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When travelling, the upright fire-making stick is kept unpeeled, and only
    the amount needed is peeled each time so that it remains dry and usable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After rain, dry heartwood is obtained by stripping fallen wood; other wood
    is dried around the fire and then used as fuel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A palm-leaf fan of definite shape is used instead of bellows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Most mammals, birds, and fish are treated as meat, except introduced European
    animals and a few tabooed indigenous animals described as unclean.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The described proper Indian meat dish is pepper-pot, made by boiling meat
    or fish with peppers and cassareep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cassava roots are described as the staple vegetable food, made into bread
    by most tribes and into farine by others.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women prepare cassava by peeling, washing, grating the roots on a stone-studded
    board, collecting the pulp, and placing it in a wicker-woven matapie.
  category: sequence
  evidence_refs:
  - ev:6
