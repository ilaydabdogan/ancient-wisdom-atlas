canonical_text:
  quote: ''
  summary: The passage discusses Guiana Indian attitudes toward spirits, emphasizing
    harmful spirits as active causes of misfortune and harmless spirits as inactive.
    It describes avoidance practices involving speech, sight, food taboos, ritual
    blowing on meat, and rubbing irritants into the eyes at dangerous or unfamiliar
    places to avoid attracting malignant spirits.
  language: English
  quote_policy: summarized
