  quote: '"a peculiar, complex, and not very obvious figure occurs in many examples"'
  summary: The passage argues that recurrent, unusual figures in rock-engravings are
    unlikely to be idle marks. It compares a repeated coiled line in Northumberland
    rock-engravings with a repeated figure in the shallow engravings of Guiana, and
    notes a visually similar figure in Mexican picture-writings. The author suggests
    that understanding the Mexican figure might help interpret the Guiana engravings,
    while rejecting the view that such engravings are equivalent to schoolboy scribbles.
