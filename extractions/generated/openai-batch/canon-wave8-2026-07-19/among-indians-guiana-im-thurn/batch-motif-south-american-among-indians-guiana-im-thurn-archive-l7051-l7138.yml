canonical_text:
  quote: ''
  summary: The passage is a colonial-era ethnographic classification of several Guiana
    Indigenous groups. It compares Warraus, Arawaks, Wapianas, Carib-branch groups,
    True Caribs, Ackawoi, Macusis, and Arecunas by bodily descriptions, dwellings,
    cleanliness, European contact, trade and craft specializations, food preparation,
    warlike reputation, intertribal enmity, and territorial distribution. It contains
    no explicit myth narrative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator states that physical differences alone would be insufficient
    to distinguish the groups, and that differences in habit are not very great.
  category: other
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The Warraus are described as the shortest of the listed groups, thickly built,
    with long trunks relative to the legs and broad, flat feet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Warraus are associated with houses raised on piles over swampy ground
    or water and with canoe-building for surrounding tribes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Arawaks are described as slightly taller than the Warraus, comparatively
    cleaner, living in cleaner houses, sometimes using partitions, tables, and benches,
    speaking English, and wearing European clothes in the presence of white men.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:5
  text: The passage states that the Arawaks have an aversion to other tribes and especially
    hatred of the True Caribs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Wapianas are described as unusually tall for Indians, slight and well-built,
    with more regular facial features.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:7
  text: The Wapianas, with the allied Atorais and Amaripas, are described as averse
    to intercourse in many matters with other tribes, while also serving as great
    traders and middlemen.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Wapianas and allied groups are associated with interior canoe-making and
    with eating cassava chiefly as rough meal called farine rather than as bread or
    cakes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Carib branch is described as darker-skinned, and Carib tribes generally
    are described as more warlike and feared than other tribes.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:10
  text: The True Caribs are described as taller and stronger than the Arawaks, most
    warlike and dreaded in reputation, scattered through the country rather than occupying
    a special district, and major makers of pottery.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:11
  text: The Ackawoi are described as like the True Caribs but shorter and slighter,
    and as kindred of the True Caribs who make pottery to a small extent.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:12
  text: The Macusis are described as darker than True Caribs and Ackawoi, taller,
    slighter, better made, and somewhat timid in expression; the Arecunas are described
    as darkest-skinned, more powerful, and bold and warlike in expression.
  category: attribute
  evidence_refs:
  - ev:1
