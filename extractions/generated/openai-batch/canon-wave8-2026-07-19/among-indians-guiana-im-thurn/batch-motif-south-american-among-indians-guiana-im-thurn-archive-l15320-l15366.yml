canonical_text:
  quote: ''
  summary: An Arawak account describes repeated Carib attacks on Arawaks of the Pomeroon.
    In one episode the Arawak chief hides women and children, sets an underwater tree-trunk
    barrier, and uses a light boat as bait so pursuing Carib canoes break on the hidden
    obstacle. A later Carib chief is captured and released unharmed, which is said
    to end the feud, though the narrator adds that peace was incomplete and that the
    story is from Arawak tellers.
  language: English
  quote_policy: summarized
