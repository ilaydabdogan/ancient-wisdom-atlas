  summary: The passage describes preparation of cassava-based paiwari by burning,
    breaking, chewing, boiling, and fermenting cassava bread; preparation of casiri
    from sweet-potatoes and sugar-cane; observed physical effects attributed to heavy
    cassava consumption; salt procurement, barter, and use; and occasional foods,
    especially reptile eggs gathered seasonally from river sandbanks.
  language: English
  quote_policy: summarized
