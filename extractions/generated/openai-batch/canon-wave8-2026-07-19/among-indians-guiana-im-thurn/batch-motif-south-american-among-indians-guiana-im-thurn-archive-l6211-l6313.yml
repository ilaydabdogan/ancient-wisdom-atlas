canonical_text:
  quote: ''
  summary: 'The passage describes several kinds of ants in the Guiana forest: solitary
    manoorie ants with painful stings, social Yackman ants that hunt in vast moving
    columns, cooshie ants that forage for leaves and strip cultivated plants, and
    another ant associated inseparably with a mauve orchid. The narrator reports personal
    encounters with these ants and notes an Indian warning that the orchid could not
    grow without the insect.'
  language: English
  quote_policy: summarized
