canonical_text:
  quote: Every object in the whole world is a being, consisting of a body and spirit
  summary: The passage describes a reported Guiana Indian belief that spirits can
    separate from proper bodies and enter animals or inanimate objects. It focuses
    on the kenaima taking animal form or entering disease-causing objects, the peaiman
    extracting such objects, and a broader ontology in which humans, animals, and
    inanimate objects all possess body and spirit and differ chiefly by bodily form.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that a spirit may pass from its proper owner's body into
    an animal or even an inanimate object.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kenaima is described as not necessarily keeping human shape while following
    a victim and often assuming an animal form, usually a jaguar or tiger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indian speakers are reported to use the expression 'kenaima-tiger' and to
    distinguish killing an ordinary tiger from killing a kenaima-tiger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The peaiman is described as extracting from a patient an animate or inanimate
    object said to cause disease; the object is identified as a bodily form entered
    by the kenaima's spirit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that an ordinary Indian does not believe he can voluntarily
    transfer his own spirit into another body, though he may believe that other men,
    a kenaima, or possibly a peaiman can do so.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says some animals are regarded as men in disguise, supporting
    the belief that other men can transmit their spirits into chosen bodies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says there is no sharp distinction, in the described belief, between
    humans, other animals, and inanimate objects; all are beings with body and spirit,
    differing chiefly in bodily form.
  category: attribute
  evidence_refs:
  - ev:5
