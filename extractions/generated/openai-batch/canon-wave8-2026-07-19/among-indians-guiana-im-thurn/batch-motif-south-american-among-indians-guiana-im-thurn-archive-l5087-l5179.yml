  quote: ''
  summary: The passage describes the difficulty of seeing bright bird colours in Guiana,
    especially in high-canopy birds and humming-birds whose iridescence appears only
    at certain angles. It then contrasts the scarcity of sweet bird song with the
    abundance of striking bird cries, noting that Indian names for birds often reproduce
    each bird's cry.
  language: English
