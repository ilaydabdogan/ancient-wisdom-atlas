  summary: Travel narrative describing a delay at Apooterie, a sudden storm over a
    forest clearing, a canoe journey through side-streams and swamp to a remote Wapiana
    household for cassava, and later high-water travel through difficult falls and
    rapids, including preparations by Indigenous canoeists and use of side channels.
