  summary: The passage gives an ethnographic description of canoe-building and related
    watercraft. It describes West Indian canoes made and used by Caribs and creole
    crews, canoe tents for long journeys, corials, buckshells, and bark woodskins,
    with notes on materials, construction methods, uses, and possible borrowing of
    a waterproof tent-cover technique from Brazilian Indians.
  language: English
