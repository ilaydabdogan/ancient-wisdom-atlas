literal_observations:
- id: obs:1
  text: In St. Vincent, St. Lucia, and Grenada, canoes are described as commonly used
    along the coast, carrying passengers and cargo and being rowed by crews of four
    or six men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Canoe shells in St. Vincent are said to be furnished by Caribs, and the gommier
    tree is identified as a canoe material.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The St. Vincent method described includes hollowing the trunk with fire and
    axe, hauling the shell to the beach, spreading it with wet sand, and fitting boards
    and supports.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For long canoe journeys, a tent may be added for the protection of goods rather
    than for the Indians themselves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The canoe tent can be made with bent sticks, cross-sticks, and palm-leaf thatch,
    or with a waterproof cover made from wickerwork mats and leaves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The waterproof wickerwork tent-cover method is said to seem learned from Brazilian
    Indians and is rarely seen far from the border land.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A corial resembles the dug-out body of a canoe without the side-raising plank,
    is generally smaller, and is used for short excursions such as fishing, hunting,
    or going to the field.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A buckshell is dug out like a canoe or corial but has pointed and closed ends;
    it is described as more easily upset, lighter to pull, and faster than canoes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arawaks and True Caribs are said to make buckshells that differ slightly in
    shape.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Woodskins are made from bark strips, often from locust-tree or purpleheart,
    shaped by cutting wedge-shaped pieces, raising the ends, sewing the slits with
    bush-rope, and adding bark pieces for seats or rests.
  category: sequence
  evidence_refs:
  - ev:6
