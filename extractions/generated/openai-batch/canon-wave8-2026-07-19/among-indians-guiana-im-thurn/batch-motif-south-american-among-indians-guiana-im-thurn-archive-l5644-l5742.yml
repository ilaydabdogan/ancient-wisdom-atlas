canonical_text:
  quote: ''
  summary: The passage describes iguana nesting on exposed river sandbanks, Indian
    methods for finding and digging out eggs and iguanas, dangers from snakes in the
    holes, jaguars and voracious fish as enemies of iguanas, and several observations
    and anecdotes concerning feared snakes, especially the water-camoodi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iguanas go or swim to exposed river sandbanks, dig narrow tunnels in the sand,
    lay oval eggs with elastic skins, leave the eggs untended, and the young later
    emerge upward through the sand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indians locate iguana nests by following tracks, noticing slight disturbance
    at the hole mouth, probing the sand with a pointed stick, and digging by hand
    where the sand yields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Indians dig cautiously because they say a poisonous snake that also likes
    the eggs is sometimes encountered in the holes and has bitten and killed people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An iguana may still be in the hole after laying eggs; when dug out it may
    bite, dig deeper to escape, hold fast by the tail, lose the tail, and eventually
    be drawn out.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Indians assert that jaguars dig out iguana eggs; the author notes jaguar tracks
    mixed with iguana tracks but thinks jaguars more likely prowl for adult lizards.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Perai or houma fish frequently bite off the ends of iguana tails as the iguanas
    swim between sandbanks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Snakes are described as abundant but retiring, and four commonly dreaded
    kinds are named: land-camoodi, water-camoodi or culnacanaro, labarria, and rattlesnake.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The water-camoodi is more often noticed than the land-camoodi and may grow
    very large; one account concerns a thirty-foot camoodi coiled around a kitchen
    corner post.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Young camoodies are sometimes found in houses near the forest; water-camoodies
    frequent water, often swim, and are much dreaded by Indian bathers.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a night anecdote, the narrator's companion says he has heard a snake snore
    in a tree; the narrator hears the sound and sees a moderate-sized snake curled
    around a branch, but it is gone by morning.
  category: sequence
  evidence_refs:
  - ev:10
