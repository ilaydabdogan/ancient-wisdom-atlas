canonical_text:
  quote: ''
  summary: The passage cites an economic account of cattle breeding in Brazil, applies
    it to the savannahs of British Guiana, discusses food, labor, horses, and transport
    difficulties, then narrates a halt at a fort farm where the travellers obtain
    farine and buy a young bull from a Venezuelan and a Macusi farm-keeper. It closes
    with a description of the savannah landscape, vultures on corrals, mountains,
    and stone axe-heads from a place called Toucana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cattle breeding in Brazil is described as profitable because outlay and current
    expenses are limited.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A meadow of 9,000,000 square metres is said to graze 1,000 cattle with two
    herdsmen and to produce fifty oxen and fifty cows yearly.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: About 14,000 square miles of savannah near the upper Takootoo and Cotinga
    rivers are said to lie within the author's territory, with more high ground and
    detached hills than the Brazilian plains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The savannah district is described as having abundant cattle food and potential
    human food including cassava, yams, plantains, fruits, game, birds, and fish.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indians living in the district are described as possible cowherds if treated
    with care and kindness, and horses are said to be obtainable from the Brazilian
    side of the boundary.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The main obstacle to cattle farms is said to be getting produce to town because
    the rivers are rocky and difficult; living cattle would be hard to move except
    in the wet season without a river-road or overland road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The travellers halt at a farm attached to the fort, under the joint charge
