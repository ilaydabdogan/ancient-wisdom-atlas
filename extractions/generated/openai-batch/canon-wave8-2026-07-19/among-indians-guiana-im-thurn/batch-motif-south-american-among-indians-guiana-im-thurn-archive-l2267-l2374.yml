  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Macusi's son is described as speaking both Macusi and Portuguese fluently
    and as having filed and painted teeth after the Indian manner.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The travellers obtain a small quantity of farine after offering gunpowder,
