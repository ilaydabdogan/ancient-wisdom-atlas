canonical_text:
  quote: ''
  summary: The passage discusses Guiana Amerindian origin legends and authorial comparisons.
    It summarizes an Arawak account in which an unnamed being throws silk-cotton tree
    fragments that become animals and humans; a Warrau account in which people descend
    from sky-land to earth after a hunter discovers the land below; a True Carib variant
    of descent to clean the earth; and a Warrau account of the first Carib born from
    Korobona and an animate tree stump, killed and later rising from the grave as
    a fierce ancestor whose descendants war against the Warraus. The passage also
    includes an authorial note about independently recurring flood-and-boat traditions.
  language: English
  quote_policy: summarized
