canonical_text:
  quote: ''
  summary: 'An ethnographic passage describes permanent and temporary house construction
    among Indians of Guiana: upright posts, lashed cross-pieces, sloping roof poles,
    leaf thatch, optional piles, walls, and mudwork; several forms of temporary benaboo
    shelters; a proposed developmental sequence from rough leaf shelter to mud-walled
    house; and palm-leaf thatching materials including troolie and dealibanni.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Permanent dwelling-houses are described as variations on a common framework
    of upright posts, lashed cross-sticks, sloping roof poles, and leaf thatch.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some houses are raised on piles by using unusually high corner-posts and hanging
    a platform part-way up as a floor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ground-level houses may have leaf walls, mud-plastered leaf walls, bark sheets,
    wattle-work, or more substantial mud walls.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that savannah houses are round rather than rectangular and
    offers wind resistance or copying from Brazilian tribes as possible explanations.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says that one large house may occasionally be built for many families
    instead of one small house for each family, probably copied from other tribes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When away from home during the rainy season, especially on hunting or fishing
    expeditions, an Indian may build a temporary night shelter called a benaboo or
    benab.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The simplest benaboo consists of a few palm leaves laid together with their
    bound stalks stuck into the ground at an angle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A larger overnight benaboo for several men may use three upright poles arranged
    as a triangle, cross-sticks joining their tops, and palm leaves laid over the
    structure.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A benaboo for repeated brief use at a fishing ground, turtle place, useful
    plant site, or similar location may use four upright poles in a square, cross-pieces,
    a ridge-pole, and two sloping bundles of leaves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author presents the house forms as a sequence from a rough shelter made
    by sticking leaves into the ground to a complete mud-walled savannah house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Troolie palm leaves are described as large leaves that can overlap like tiles
    to make a roof, and they were formerly traded between Indians and coastal planters
    for thatching estate buildings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dealibanni leaves can be tied by their stalks to booba-palm laths in long
    rows that overlap and can be removed and reattached to a new framework quickly.
  category: object
  evidence_refs:
  - ev:8
