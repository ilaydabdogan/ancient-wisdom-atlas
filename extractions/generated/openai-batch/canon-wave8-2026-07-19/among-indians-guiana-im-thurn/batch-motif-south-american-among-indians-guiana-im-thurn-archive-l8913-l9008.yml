canonical_text:
  quote: "“the couvade or male child-bed”"
  summary: 'The passage first describes night life in an Indian settlement: women
    tend fires, men tell stories, younger males play horns and flutes, dogs and children
    are repeatedly awakened, and hunters make noise before dawn. It then describes
    birth customs, especially couvade: the father abstains from foods before birth
    and, after the child is born, lies in a hammock under restrictions on work, food,
    smoking, washing, scratching, and weapons, because of a stated belief that his
    actions can affect the newborn.'
  language: English
  quote_policy: quoted
