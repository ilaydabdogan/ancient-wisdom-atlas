canonical_text:
  quote: ''
  summary: The chapter opening describes Guiana Indian folk-lore as tales told at
    night around fires by ritual specialists, headmen, and old women. It frames these
    tales as partly mythological, connected with animistic ideas about persons, animals,
    trees, rocks, winds, and storms as living beings with bodies and spirits, and
    partly historical. The author then cautions that some recorded legends show likely
    European and Christian influence, especially motifs resembling Creation and Flood
    traditions, and argues that such elements may have been adopted after contact
    rather than inherited from pre-contact tradition.
  language: English
  quote_policy: summarized
