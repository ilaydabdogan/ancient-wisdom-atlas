canonical_text:
  quote: ''
  summary: A travel narrative describes a crowded Indian stopping place with fires,
    hammocks, adornment, children’s necklaces exchanged for beads, reports of famine,
    changing river and savannah scenery, a mountain, a water-lily pond with birds,
    arrival at Pirara landing, and the summoning and arrival of Macusi family parties
    to carry goods toward Quatata.
  language: English
  quote_policy: summarized
