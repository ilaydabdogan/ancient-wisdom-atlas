  text: The presence of the mosquito-worm is first felt as intermittent needle-like
    pricking, followed by swelling like a tumour.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mosquito-worm is described as an inch-long worm-like larva with stiff
    hairs or bristles, developing from an unnoticed egg that is said to be deposited
    when the subject is bathing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the mosquito-worm can be removed by excluding air from the
    affected spot with sticking-plaster or forest resin, after which the insect is
    drawn away dead or loosened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The jigger or chigoe is a flea that lives in dust on the ground where humans
