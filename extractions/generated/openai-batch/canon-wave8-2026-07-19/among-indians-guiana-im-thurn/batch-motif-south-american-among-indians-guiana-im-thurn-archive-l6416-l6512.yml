canonical_text:
  quote: ''
  summary: 'The passage gives a natural-history and ethnographic account of several
    troublesome animals and insects in Guiana: mosquito-worm larvae in flesh, jiggers
    or chigoes that penetrate the skin and lay eggs, bush-ticks that attach to passersby
    and can be removed by fire, and spiders, scorpions, and centipedes that are abundant
    but rarely attack humans. It also notes settings such as Indian settlements built
    on loose sand, reported methods of extraction, and reported dangerous bites of
    certain spiders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mosquito-worm or ssstus-worm is described as the larval form of a gadfly
    and as occurring in the flesh of humans and other animals.
  category: attribute
  evidence_refs:
  - ev:1
