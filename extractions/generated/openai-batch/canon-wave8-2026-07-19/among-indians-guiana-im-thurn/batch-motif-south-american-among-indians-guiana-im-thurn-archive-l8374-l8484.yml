  quote: ''
  summary: The passage describes the distribution of Indigenous settlements in forest
    and savannah regions of Guiana, distinguishes three main house types adapted to
    swamp, forest, and savannah environments, quotes a description of Warrau pile-dwellings,
    and gives details of forest houses and Arawak houses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Forest families generally live in separate settlements of one or more houses,
    often far from neighbours; savannah families may also be scattered, but several
    families more often form villages of twenty to thirty houses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes three chief house types: Warrau pile-dwellings
    in low swampy coastlands, wall-less forest houses, and thick clay-walled savannah
    houses.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Warrau pile-dwellings are described as huts on platforms of interlaced manicole
    palm stems, supported by piles or tree-trunks over water or swampy ground.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the described pile-dwelling, earth in the centre of the hut serves as a
    hearth and prevents the continuously burning fire from reaching the wooden floor.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A notched tree-trunk functions as a ladder to the pile-dwelling, and a canoe
    is tied to it when the water is high.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A forest house or group of houses stands in a clearing enclosed by tall forest
    trees and connected by a narrow path to the nearest water.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The usual forest house is square or rectangular, with four posts, cross-beams,
