canonical_text:
  quote: cassava, plantains, and all useful vegetables grew on one huge tree
  summary: The passage reports Carib and Ackawoi variants about a food-bearing tree,
    its discovery by animals, its felling, and a flood issuing from its stump. In
    the Ackawoi version a basket contains the water until a monkey lifts it, releasing
    a flood from which a man and animals take refuge in a palm. Subsequent incidents
    explain animal features such as the howling-monkey throat, trumpet-bird legs,
    bush-turkey throat, alligator tongue, and alligator scales in a separate Arawak
    example involving the Sun.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Carib account says the Caribs first arrived on earth from sky-land and
    that cassava, plantains, and other useful vegetables grew on one huge tree.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tapir first discovered the food-tree and grew fat from its fallen fruits;
    a woodpecker sent to watch the tapir failed because its tapping warned the tapir.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rat traced the tapir to the food-tree, agreed with the tapir to share it
    secretly, denied success to the Caribs, and was later forced to reveal the tree
    after being found asleep with corn in its mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Caribs cut down the food-tree with stone axes after long labor, took pieces
    of it, planted them in their own fields, and this is given as the origin of individual
    cassava-fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ackawoi account substitutes the acourie as original discoverer and one
    ancestral man, aided by animals, as the tree-cutter; both True Carib and Ackawoi
    versions then have a flood flow from the stump of the felled tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The water from the stump is said to have been stopped either by mysterious
    beings in the True Carib version or, in the Ackawoi version, by a man who inverted
    an empty basket over the spring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A brown monkey lifted the basket out of curiosity, causing the flood to rush
    out, carry the monkey away, and overflow the whole land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A man and many animals took refuge in a tall kokerite palm during the flood;
    the red howling-monkey roared until its throat swelled, explaining the animal's
    throat structure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man dropped single palm-seeds into the floodwater to judge its depth,
    and after the waters subsided the trumpet-bird descended into an ants' nest, where
    insects gnawed its legs thin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man rubbed two pieces of wood to make fire; a bush-turkey swallowed the
    first spark, mistaking it for a fire-fly, which explains its red throat wattle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The alligator was blamed for taking the spark, had its tongue torn out by
    the man, and this is used to explain alligators' rudimentary tongues and hostility
    toward other beasts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The narrator introduces further Arawak stories as explanations of animal peculiarities,
    including one in which the Sun strikes an alligator with a club, producing the
    marks regarded as scales.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
