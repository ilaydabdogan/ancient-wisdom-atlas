candidate_motifs:
- id: motif:1
  label: origin of cultivated food from a single food-tree
  taxonomy_refs: []
  basis: The passage says useful vegetables grew on one huge tree, which is felled
    and divided into planted pieces, explaining individual cassava-fields.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents this as crop-field origin, but does not explicitly
    identify the tree as a world-axis or sacred tree.
- id: motif:2
  label: animal discovery and concealment of a life-sustaining food source
  taxonomy_refs:
  - trickster_boundary
  basis: Animals discover or track the food-tree; the rat conceals its success and
    secretly shares with the tapir until exposed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The rat's deception supports a trickster-like reading, but the passage
    does not call the rat a trickster.
- id: motif:3
  label: flood released from a contained spring at a felled tree stump
  taxonomy_refs:
  - flood_and_renewal
  basis: The Carib and Ackawoi accounts coincide in saying that water began flowing
    from the tree stump; in the Ackawoi version the water is contained under a basket
    until the monkey lifts it and releases a land-covering flood.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage emphasizes flood release and survival rather than a full cosmic
    renewal cycle.
- id: motif:4
  label: tree refuge during flood with depth testing before descent
  taxonomy_refs:
  - flood_and_renewal
  basis: The man and animals survive the flood in a tall kokerite palm, and the man
    drops palm-seeds into the water to judge when it has subsided.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The refuge is a palm tree rather than an ark or vessel.
- id: motif:5
  label: animal bodily traits explained by mythic accidents or punishments
  taxonomy_refs: []
  basis: The passage explains the howling-monkey throat, trumpet-bird legs, bush-turkey
