literal_observations:
- id: obs:1
  text: The travelling party paddles down the Takootoo for two days, passing turtles,
    ibis, spoonbills, porpoises, manatees, iguanas, lilies, and passion-flowers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator reports that the men said the porpoises were omars, or water-women,
    and that they had frocks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the third day the Takootoo widens and meets the Rio Branco; a little stone
    fort called St. Joaquim stands on the left high bank at the river junction.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: St. Joaquim is described as a Portuguese-built fort more than a century old;
    a former Jesuit mission had disappeared, and the remaining fort is neglected and
    militarily inactive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The commandant receives the travellers hospitably, is interested in Indians,
    and is isolated from other white neighbours except by rare steamer communication
    or Indian canoes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cattle on the surrounding farms are largely left to roam and breed; younger
    animals are periodically driven into stockaded pens, branded, released by day,
    and kept in at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some cattle are transported down the Rio Branco to Manaos, while other cattle
    are slaughtered on the farms, sliced, salted, sun-dried, and sold along the Amazon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Farm labor is described as supervised by a government official with few assistants;
    many cowherds are Indians of the district, and work is done from horseback.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage describes local food sources including meat, small amounts of
    milk, game, cassava made into farine, and crops grown especially in Indian fields.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A quoted Brazilian government account presents cattle-raising as profitable
    and largely dependent on nature, with labor chiefly involving periodic collection
    and marking of calves.
  category: speech
  evidence_refs:
  - ev:7
