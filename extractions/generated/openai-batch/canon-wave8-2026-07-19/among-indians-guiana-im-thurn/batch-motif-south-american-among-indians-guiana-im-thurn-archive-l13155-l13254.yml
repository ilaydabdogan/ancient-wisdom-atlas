  - ev:3
- id: obs:3
  text: The boy’s body was carried to an open place, and a circle was formed around
    it while the father cut off specific fingers, toes, and heel pieces from the corpse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cut pieces were placed in a new pot filled with water and boiled over
    a fire.
  category: action
  evidence_refs:
