canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and practices concerning kenaimas: every
    death or illness may be attributed to a kenaima; relatives may perform a boiling-water
    rite with parts of a corpse to locate the supposed killer; a real kenaima is described
    as stalking and killing by club, arrow, or poison; an imaginary kenaima is said
    to act invisibly through a separated spirit, through animal bodies, or through
    small beings or objects entering the victim’s body.'
  language: English
  quote_policy: summarized
literal_observations:
