canonical_text:
  quote: the really primitive idea naturally would be that all objects are animate.
  summary: The passage describes an ethnographic account of Guiana Indian beliefs
    that rocks, waterfalls, streams, and other material bodies may have both body
    and spirit. It gives examples of dangerous or tabooed rocks, then discusses disease
    as a moving embodied spirit-form, especially in relation to kenaima spirits, peaiman
    healing, and path-blocking against buck-sickness.
  language: English
  quote_policy: quoted
