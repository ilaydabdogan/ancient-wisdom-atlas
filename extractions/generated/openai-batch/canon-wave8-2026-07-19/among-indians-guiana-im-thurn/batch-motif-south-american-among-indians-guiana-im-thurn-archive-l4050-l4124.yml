  summary: The passage describes the distribution of colour in Guiana tropical forest
    foliage and flowers, contrasting it with seasonal colour in English woods. It
    emphasizes year-round leaf change, scattered flowering trees, several striking
    individual trees and creepers, and the fact that bright colour appears as separated
    spots within a generally green forest.
