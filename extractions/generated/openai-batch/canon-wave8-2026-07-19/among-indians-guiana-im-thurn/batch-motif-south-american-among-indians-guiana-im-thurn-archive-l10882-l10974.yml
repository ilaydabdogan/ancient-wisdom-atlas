  quote: ''
  summary: The passage describes Guiana Indian crafts and material arts, the decline
    of older technologies under the influence of European manufactured goods, the
    alternation of men's subsistence work and leisure craft-making, and an intertribal
    division of labor in which specialized goods are exchanged, traders pass through
    hostile territory, and news spreads rapidly among tribes.
  language: English
  quote_policy: summarized
