canonical_text:
  quote: ''
  summary: The passage describes practical thatching materials and methods for houses
    and temporary shelters in Guiana, including portable thatch used to prevent others
    from occupying a shelter, trade in prepared leaf-laths, substitution of less durable
    materials in trade, regional use of several palm and plant leaves, and the preservative
    effect of smoke from household fires on thatch.
  language: English
  quote_policy: summarized
