canonical_text:
  quote: ''
  summary: The passage gives practical advice for reaching Kaieteur, including portage
    upkeep, Indigenous crews, seasonal timing, routes to the foot and top of the fall,
    camping and viewpoints. It then describes Mount Roraima as a flat-topped sandstone
    table-land with perpendicular cliffs, unknown circumference, forested summit,
    waterfalls on its sides, and possible biological isolation if inaccessible.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author proposes improving portage paths and a path from Tookooie landing
    to the foot of Kaieteur, with annual presents to Indigenous people along the route
    in return for keeping portages open, maintaining boats, and assisting travellers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the expedition above Toomatoomari, the author recommends using only Indigenous
    crew members and one or more small boats, optionally fitted with stanchions and
    a movable awning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dry season is preferred for visiting Kaieteur because travel is easier
    and the Potaro river scenery is seen more fully, although the water volume is
    reduced.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The route to the foot of Kaieteur is described as difficult and suitable only
    for a young and fairly active man; the author advises most travellers to prefer
    the view from above.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The route to the lower fall follows a beaten track, a creek with flat sandstone
    ledges, the river edge over boulders, a forest detour near Serikabaroo cataract,
    and a ravine, ending near the mouth of the amphitheatre.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fall’s amphitheatre may be entered by swimming from rock to rock until
    the edge of the pool below the fall is reached.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The top of Kaieteur is reached from Tookooie by a beaten path, and a camping
    place lies across the savannah near the edge of the fall; the best view is from
    the edge of the cliff of the amphitheatre.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Roraima lies near the western edge of the colony and has drawn attention because
    of its peculiar form and circumstances; the passage lists several visitors or
    observers between about 1840 and 1881.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Roraima is described as a sandstone table-land rising in perpendicular cliffs
    above a higher savannah, with a flat-topped sandstone mass, unknown circumference,
    apparently forested summit, and waterfalls down its sides.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some people suppose Roraima’s summit to be inaccessible to humans and unwinged
    animals, and therefore possibly isolated enough to preserve primitive animal forms.
  category: other
  evidence_refs:
  - ev:9
