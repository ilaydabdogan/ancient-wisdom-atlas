canonical_text:
  quote: ''
  summary: 'The passage discusses explanations for rock-engravings in Guiana and elsewhere:
    their placement near striking natural features such as cataracts, their occurrence
    on apparently inaccessible rock faces, possible commemorative links to drownings
    and fishing expeditions at falls, a suggested technique using stone wedges for
    high engravings, and the loss or forgetting of the art after stone-working declined
    with the introduction of metal implements.'
  language: English
  quote_policy: summarized
