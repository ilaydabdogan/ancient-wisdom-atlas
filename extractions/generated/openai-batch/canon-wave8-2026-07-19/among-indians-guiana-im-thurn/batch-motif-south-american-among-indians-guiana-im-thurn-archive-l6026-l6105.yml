  quote: ''
  summary: 'The passage describes insects in and around Guianese houses and in the
    interior: hidden destructive wood-ants, less harmful ants and cockroaches, seasonal
    swarms of hardback beetles, spiders, centipedes, wasps, bête rouge, and abundant
    tropical butterflies.'
  language: English
  quote_policy: summarized
