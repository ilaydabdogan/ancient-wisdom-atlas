canonical_text:
  quote: ''
  summary: 'The passage recounts several Guiana Amerindian folklore narratives: a
    young Arawak marries a king-vulture woman and becomes involved in a sky-land bird
    war; birds acquire markings through ash, darkness, skin, or a white bandage; men
    and birds kill a huge water-snake and divide its skin; the haiarri fish-poison
    plant grows from the blood of a boy killed by fish; Kaieteur landforms originate
    from an abandoned old man’s boat and basket; and Macusi statements identify dew
    as star-spittle and the Southern Cross as a being.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young Arawak chooses a king-vulture as wife, follows the custom of living
    with his wife's father, goes to sky-land, and is initially well received by the
    vulture people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Arawak says he intends to visit his own people, the vultures place
    him on top of a tall thorn-covered awarra-palm; spiders pity him and spin a cord
    by which he descends.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other birds later carry the Arawak to sky-land and help him fight the vultures;
    the vultures are driven into their houses and their settlement is burned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The trumpetbird and heron roll each other in ashes during a quarrel, explaining
    their grey coloring in the tale.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The owl opens a carefully wrapped package, and darkness comes out; the owl
    thereafter lives in that darkness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Arawak for whom the sky-land war is fought is killed by his own son, born
    of the vulture wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The keskedie avoids fighting by bandaging his head with white cotton and pretending
    illness; the big birds compel him to keep the bandage, and he continues to attack
    big birds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another tale, combined men and birds make war on a huge water-snake; a
    duckler begins the attack underwater and the snake is drawn out and killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The duckler claims the snake's skin as spoil, but the birds divide the bright
    skin among themselves; most become bright-colored parrots and macaws, while the
    duckler receives the head and remains dingy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An Indian boy kills fish wherever he swims, and his father uses this to obtain
    edible fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fish attack the boy while he sits on a log; a sting-ray wound proves fatal,
    and drops of his blood become haiarri plants used for poisoning streams to catch
    fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Kaieteur, an island is described as shaped like a woodskin or bark-boat,
