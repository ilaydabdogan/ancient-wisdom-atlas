canonical_text:
  quote: ''
  summary: A travel party reaches Ouropocari falls, where rock drawings and a portage
    are noted. The passage describes portage labor, a naturally fluted boulder, an
    encounter with a jaguar near a wooded island, and a later camp episode in which
    a fire set in a fallen tree spreads, ignites a large mora-tree, and causes it
    to burn and fall near the river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party reaches the falls at Ouropocari, where rocks beside one channel
    have rock-drawings described as similar in character to those at Warrapoota.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Loaded canoes often cannot pass the channels at Ouropocari, so a portage path
    is used for carrying canoes and goods separately from the bottom to the top of
    the fall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Where travelers must make a portage, trees are felled, ground is cleared,
    skids are laid, and a rope attached to the boat's bow is used to draw the boat
    over.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the highest point of the portage path stands a huge boulder with regular,
    deep natural flutings on one side.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator is lying in fever under the canoe tent when Indians shout, pull
    him out, and reveal a large jaguar on the bank of a small wooded island.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The jaguar leaves the island, fords the shallow river, passes across the canoe
    bows, is struck by an arrow from one Indian, shakes the arrow out, roars, and
    disappears into the forest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fever worsens among some of the party that night, and the group rests the
    next day from canoe travel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the morning the Indians set fire to the trunk of a fallen dead tree; the
    flames spread along the log, into bush on the bank, and toward the camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fire catches brushwood around a huge half-dead mora-tree and leaves it
    standing in the center of a cleared circle of trees whose tops meet overhead.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: After dusk the central mora-tree bursts into flame, its trunk forms a pillar
    of fire, sparks fall, and birds, butterflies, moths, and bats move among the burning
    masses and sometimes fall into the fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The fire rises into dried leaves overhead, the trunk creaks and falls with
    a crash toward the river, and blazing fragments continue falling through the night.
  category: sequence
  evidence_refs:
  - ev:8
