  summary: The passage describes the savannah landscape near Quatata, scarcity of
    food and water, the former settlement and political-religious dispute at Pirara,
    the form of Quatata houses, and a hospitality practice in which women offer paiwari
    to visitors, who are expected to drink it before freely examining the house and
    asking questions.
  language: English
