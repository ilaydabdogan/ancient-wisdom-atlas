canonical_text:
  quote: ''
  summary: The passage describes rock engravings on granite boulders at Warrapoota
    cataracts and other river locations in Guiana and nearby regions. It notes their
    relation to water levels, their displacement from original positions, common anthropomorphic
    or monkey-like figures, linear and spiral patterns resembling body-painting designs,
    rare figures such as a rayed sun, animal figures elsewhere, and two unusual engravings
    reported by Schomburgk, including a Rio Negro depiction interpreted as European
    ships, possibly connected with Orellana's 1540 vessel.
  language: English
  quote_policy: summarized
