canonical_text:
  quote: ''
  summary: 'The passage describes pottery and basketry among Indigenous peoples of
    Guiana: women make large casiri-jars and other customary clay vessel forms; children
    imitate pottery-making with small vessels; the author compares some Guiana vessel
    forms with North American earth-mound pottery; men make baskets and cassava-processing
    implements, including pegalls, sieves, matapies, and tray-like baskets.'
  language: English
  quote_policy: summarized
