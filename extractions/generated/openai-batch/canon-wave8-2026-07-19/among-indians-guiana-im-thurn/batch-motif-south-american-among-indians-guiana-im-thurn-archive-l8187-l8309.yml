canonical_text:
  quote: ''
  summary: 'The passage describes ornaments and personal dress among Guiana Indigenous
    groups: animal-tooth necklaces, armlets, seed and bead strings, paint, feathers,
    ear, nose, and lip ornaments, feather crowns, mantles, women’s and children’s
    adornment, and individual or tribal variation in attention to appearance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A necklace of filed bush-hog teeth is described as beautiful, commonly worn
    outside the house, and valued because it is supposed to show the wearer’s own
    hunting success.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Upper-arm armlets are described as common, relatively low-value ornaments,
    sometimes cotton bands and more often string loops with a disc of bone, shell,
    or metal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other ornaments are said to have no special significance and to be used according
    to individual taste, especially at feasts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men wind strings of seeds or beads around ankles and wrists and dress the
    hair with palm oil, red paint, and white curassow down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men wear long straws or sticks through the ear lobes and polished metal nose
    ornaments suspended from a stick through the nose cartilage.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Crescent-shaped nose-pieces are attributed to Carib tribes, while round ones
    are attributed to the Wapianas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A small bell-like ornament of white bone or shell, with a red or white cotton
    streamer, is hung by a string through the under lip.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men’s dress includes feather crowns, trailing strings ending in bird skins
    or beetle-wing tassels, jangling seed strings, crossed shoulder strings, additional
    necklaces, and sometimes a palm-leaf skirt.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Macaw tail-feather ruffs, short woven cotton mantles with down tufts, and
