canonical_text:
  quote: ''
  summary: The passage describes reports about real or mythical animals called warracaba
    tigers, including explanations of their name, a quoted camp encounter in which
    Indians flee to a boat because the animals are believed to be approaching, statements
    that the animals hunt in packs and avoid water, later witness accounts of their
    appearance and tracks, and the author's cautious suggestion that such stories
    may derive from puma families moving together. It then briefly notes the distribution
    of small deer species in Guiana.
  language: English
