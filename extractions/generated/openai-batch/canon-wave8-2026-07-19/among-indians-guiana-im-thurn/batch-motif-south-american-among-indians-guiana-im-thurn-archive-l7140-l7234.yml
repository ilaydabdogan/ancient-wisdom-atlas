canonical_text:
  quote: ''
  summary: The passage classifies several Guiana Indian tribes by perceived habits,
    languages, geographic distribution, habitat, inter-tribal relations, and hammock-making
    materials. It distinguishes coast, forest, and savannah regions; describes which
    tribes occupy each; and introduces the author's distinction between 'native' tribes
    and 'stranger' Carib tribes.
  language: English
  quote_policy: summarized
