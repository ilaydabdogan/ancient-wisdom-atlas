canonical_text:
  quote: ''
  summary: The passage describes Guiana Indian techniques for shooting fish with several
    forms of fish-arrow. It explains a detachable harpoon-arrow with a floating shaft
    and line, dry-season pacu shooting at rapids, smooth-water arrows, the use of
    floating lana fruit as bait in turbid high water, and trident-like arrows used
    for small or spawning fish, followed by processing and smoking of fish or roes.
  language: English
  quote_policy: summarized
