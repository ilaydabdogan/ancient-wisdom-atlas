canonical_text:
  quote: ''
  summary: 'The passage describes hunters returning from the savannah, using a large
    fire as a signal, bringing meat home to women, and resting. It then describes
    Guiana Indian agricultural fields: clearings that appear overgrown, men felling
    and burning trees to make fields, women planting cassava at the wet season with
    dogs as protection, further planting and weeding, and vigorous wild growth reoccupying
    the clearing.'
