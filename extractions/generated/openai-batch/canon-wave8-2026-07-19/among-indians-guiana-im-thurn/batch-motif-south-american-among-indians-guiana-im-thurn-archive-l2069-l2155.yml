canonical_text:
  quote: ''
  summary: The passage describes a travel party crossing savannah and rivers to Euwari-manakuroo,
    arranging for Chirura as guide and canoe lender, observing the settlement, its
    houses, surrounding mountains and waterfall, local customs, children’s games,
    stone implements, and a departure practice in which men give wives knotted strings
    used to count days until their expected return. The party then begins a canoe
    journey down the Takootoo into the Amazon watershed and discusses the frontier
    boundary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fear of capture and enslavement by Brazilians is given as a reason some people
    were reluctant to cross the frontier.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party walked for three days across mostly uninhabited savannah, crossed
    small rivers including the Nappi near its source, and reached Euwari-manakuroo
    near the Takootoo river.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travelers wanted Chirura, a Nikari-karu headman, to serve as guide and
    interpreter and to lend them a canoe; they succeeded after waiting several days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Euwari-manakuroo is described as three very large houses on open savannah
    high ground near the Canakoo mountains, with a waterfall audible from the houses.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Nikari-karu are described by the author as having a Portuguese-corrupted
    language, as sometimes filing teeth to sharp points, and as living several families
    together in large houses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women and children sometimes held onto one another and marched around the
