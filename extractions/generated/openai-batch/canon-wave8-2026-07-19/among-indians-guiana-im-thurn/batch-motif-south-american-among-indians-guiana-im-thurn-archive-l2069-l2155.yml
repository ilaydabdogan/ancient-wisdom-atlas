  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Stone hatchets and similar stone instruments were found comparatively often
    in the neighborhood, though the passage says such implements were no longer used
    in Guiana.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men leaving Euwari-manakuroo gave their wives knotted strings or quippus;
