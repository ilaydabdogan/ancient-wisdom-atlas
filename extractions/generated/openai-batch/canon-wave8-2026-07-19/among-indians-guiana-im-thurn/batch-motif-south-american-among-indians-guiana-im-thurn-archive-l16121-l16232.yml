canonical_text:
  quote: ''
  summary: The passage describes Guiana shell-mounds as kitchen-middens similar in
    structure and contents to European examples but later in date. It defines middens
    as refuse heaps containing shells, bones, and sometimes tools, notes that most
    contemporary Guiana Indians do not create large long-used refuse mounds, and locates
    known Guiana shell-mounds mainly between the Pomeroon and Orinoco. It lists known
    mounds, describes their defensive positions near running water, and summarizes
    several openings or excavations.
  language: English
  quote_policy: summarized
