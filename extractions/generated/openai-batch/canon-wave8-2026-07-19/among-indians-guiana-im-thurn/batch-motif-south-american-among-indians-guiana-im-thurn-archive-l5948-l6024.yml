canonical_text:
  quote: ''
  summary: The passage contrasts anticipated animal dangers while bathing in Guianese
    rivers with the comparatively rare occurrence of serious harm, then surveys insects,
    especially mosquitoes, as household and outdoor annoyances whose severity varies
    by place, season, time of day, and person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A nervous bather is described as imagining exposure above the water to mosquitoes,
    sandflies, and other stinging insects, and exposure below the water to aquatic
    animals and other hazards.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Possible aquatic harms listed include perai bites, electric eel shock, sting-ray
    spine wounds, cayman or alligator attack, crushing by a huge water serpent, and
    deposition of a worm egg on the flesh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the named dangers are real, but that most regular
    bathers do not experience even the smaller harms and serious or permanent harm
    is very rare.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator argues that insects can annoy or repel people but are not sufficiently
    numerous or vicious to make life burdensome.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: For an ordinary householder, the passage lists mosquitoes, termites, ants,
    cockroaches, hardback beetles, spiders, centipedes, and jack-spaniard wasps as
    insect or arthropod foes, ordered by annoyance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mosquitoes are said to be unevenly distributed, rare in many interior places,
    more numerous on parts of the coast, and especially abundant on muddy banks of
    the Pomeroon near the sea.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: White settlers near the Pomeroon protect hammocks with close-fitting stout
    calico curtains, while an Indian going onto mud flats to catch crabs covers his
    body with mud.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mosquito trouble is said to occur chiefly in the rainy season and especially
    at night, with attacks varying greatly between individuals.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage gives an example of two similar adjacent bedrooms, one filled
    with mosquitoes around a person subject to attacks and the other with hardly any
    around a person free from such attacks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Even people seldom stung by mosquitoes may be annoyed by their buzzing, which
    the narrator calls highly irritating.
  category: attribute
  evidence_refs:
  - ev:6
