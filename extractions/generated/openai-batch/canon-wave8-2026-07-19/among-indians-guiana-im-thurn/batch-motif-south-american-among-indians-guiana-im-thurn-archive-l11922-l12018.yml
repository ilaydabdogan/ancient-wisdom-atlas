canonical_text:
  quote: ''
  summary: 'The passage describes Guiana Amerindian wooden objects and material practices:
    portable woodskin boats for rocky rivers, carved paddles from paddle-wood buttresses,
    occasional palm-pith sails, low wooden benches shaped for comfort and sometimes
    carved as animals or a human figure, and polished ornamental war-clubs with tribe-associated
    forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Woodskin boats are used chiefly by Ackawoi and Arecunas, and also by other
    Indians living on rocky rivers broken by falls and rapids.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woodskin large enough for several people and goods is described as light
    enough to be lifted from the water and carried past falls or other obstructions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Woodskins are kept sunk under water when not in use to prevent splitting or
    warping in the sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paddles are generally the sole means of propelling the boats and are hewn
    with cutlass or knife from timber or from the buttresses of the paddle-wood tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Most Guiana tribes use paddles with broad oblong blades, round shafts, and
    small semilunar handles, while Wapiana paddles are described as having circular
    blades and straight cross-handles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The text states that similar paddles are used among Brazilian Indians of the
    Rio Branco and infers Wapiana adoption from them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some paddles are roughly ornamented with painted figures and patterns.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Square sails made from strips of eta palm pith are sometimes used on lower,
    broader river sections near the sea-coast to drive canoes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Warraus are described as more skilled in making and using these palm-pith
    sails than other Indians, though True Caribs and Arawaks also sometimes use them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Low wooden benches are common in houses and are made from solid blocks of
    wood.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The benches raise the sitter away from jiggers on house floors and may be
    shaped to fit the body comfortably.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Benches are often carved into grotesque animal forms including tortoises,
    frogs, armadilloes, alligators, and other animals.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: One Carib bench in the Christy collection is described as a man on all fours
    with the middle of his back forming the seat.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Bright seeds and sometimes pebbles are inserted into carved benches to represent
    eyes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: Weapons receive greater care than larger wooden articles and are smoothed
    and polished carefully.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: The war-club, called tuk by Carib tribes, is the only war weapon said to be
    still seen in the passage, and is probably carried more as an ornament than for
    use.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: War-clubs are made from hard heavy wood and may be ornamented by engraving,
    white earth infill, polished surfaces, cotton bindings, fringes, streamers, and
    feather tassels.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:18
  text: The passage says war-club shapes originally differed by tribe, but those distinctions
