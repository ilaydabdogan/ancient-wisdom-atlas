canonical_text:
  quote: ''
  summary: The passage classifies and discusses several Guianese stone implements,
    especially forms found in shell-mounds, surface contexts, and Indigenous possession.
    The author describes common forms, grooves or notches, fractured blade ends, possible
    domestic use, possible socketing into wooden war-clubs, analogies with house-lashing
    notches, comparison to island Carib stone implements, and a hand-grasped foot-shaped
    stone possibly used as a tool or close-combat weapon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that stone implements from the listed occurrence classes
    do not show a reliable difference in form or finish.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Types shown as Figs. 1 and 3 are described as the two most common forms, with
    No. 3 the most abundant and shaped like a section of a button mushroom.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: No. 3 has a groove or notch on each side and is said to be especially abundant
    in shell-mounds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author proposes that No. 3 may have been a domestic implement for pounding
    or cracking mollusc shells and animal bones, because it is abundant in shell-mounds
    and seems unlikely to have been a formidable weapon.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: No. 1 is described as common in Guiana and elsewhere, occurring in shell-mounds,
    as a surface implement, and in the possession of Indians.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: No. 2 is flatter and more knife-blade-like than No. 1, and its narrow handle
    end is peculiarly fractured in the examples seen by the author.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports an Indian tradition that wooden war-clubs were formerly
    made more formidable by adding a stone blade; it also mentions a Christy collection
    example with a small stone blade inserted into one side.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author argues that the fracture pattern of No. 2 blades supports the hypothesis
    that they formed part of war-clubs and were socketed into the wood.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: When asked to show how such implements should be fastened into handles, some
    Indians fitted examples into light wooden handles; the author says the resulting
    weapon looked weak but showed fastening like that proposed for war-clubs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: No. 4 is a small, well-finished grooved blade whose notches are described
    as suitable for fastening to one side of a stick and similar to lashing notches
    on house cross-beams.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: No. 5 is a grooved implement with projecting shoulders, described as ornamental
    and as approaching the elaborate stone implements of the island Caribs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: No. 6 is described as resembling a human foot and leg to the knee, with a
    cutting edge where the knee would be and a hollow sole fitting the thumb.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author states that No. 6 was probably grasped rather than hafted, and
    could serve as a chisel, adze, or close-quarter offensive weapon.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: Mr. Tylor is reported as noting that some Indians in British Columbia fought
    with stones grasped in the hand, and the author says his implement was possibly
    used in this way.
  category: speech
  evidence_refs:
  - ev:8
