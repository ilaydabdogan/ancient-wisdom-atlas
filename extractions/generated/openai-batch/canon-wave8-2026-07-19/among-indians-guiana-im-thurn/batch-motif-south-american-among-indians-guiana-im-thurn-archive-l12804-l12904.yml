  quote: ''
  summary: The passage describes guests arriving by boat for a multi-day feast that
    also functions as a fair, a formal reception by the headman, hospitality with
    paiwari and food, morning body-painting and ornamentation, use of rattles, drums,
    flutes, pan-pipes, and image-topped sticks, and a procession circling a liquor
    trough with chant, stamping, repeated drinking, and later dancing outside.
  language: English
