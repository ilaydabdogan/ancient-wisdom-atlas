canonical_text:
  quote: ''
  summary: 'The passage first describes a shield-wrestling contest in which two opponents
    feint, clash shields, and try to push each other from position. It then introduces
    kenaimas and peaimen as paired figures in Guiana Indian life: the kenaima is associated
    with injury, death, vengeance, and separable spirit power, while the peaiman cures
    such harms and functions as doctor, priest, or magician. The passage explains
    a belief that tangible things have separable body and spirit, describes other
    spirit-bearing sources of evil, and presents the kenaima system as a recognized
    form of retaliatory justice compared by the author to vendetta, Israelite retaliation
    law, and Saxon were-gild.'
  language: English
  quote_policy: summarized
