canonical_text:
  quote: ''
  summary: 'Ethnographic description of pottery among Indians of Guiana: named vessel
    forms and uses, tribal differences in materials and skill, exchange value of clay
    from different places, hand-building by clay rolls, shaping with calabash shell,
    polishing with water-worn stones or old axe-heads, decoration with bark juices,
    glazing, coloring, and baking over fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Guiana Indian clay vessels as having a few simple, mostly
    unvaried forms, with the buck-pot identified as the most universal form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buck-pots are used for cooking food and stand in a saucer that can also serve
    as a lid.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Large buck-pot-like vessels are used for holding casiri or paiwari and may
    be bound around the lower part with bush-rope to prevent breakage when filled
    with heavy liquor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author suggests that some pottery elsewhere with basket-work-like exterior
    marks may have been bound for strength, as with the casiri jar, rather than made
    by lining baskets with clay.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Goglets are clay bottles with globular bodies and long straight necks, used
    by forest tribes for liquids; savannah Indians use empty gourd and calabash skins
    instead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sappoora is basin-shaped, made chiefly by True Caribs and Arawaks, and
    used for holding food rather than cooking.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women of different tribes show different degrees of pottery skill, with the
    True Caribs described as the most skillful.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Clay from certain places on the Cuyuni river is described by Indians as the
    best in the colony and commands more goods in exchange, while Pomeroon river clay
    is described as bad and fragile.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Vessels are formed by hand alone: a flat circular clay foundation is laid
    on a board, rolls of clay are added around the edge, and the walls are gradually
    built up and curved by finger and thumb.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cut piece of calabash shell is used to smooth the vessel lip, and shaped
    edges of the shell can make projecting ledges or grooves as ornament.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After shaping, vessels are smoothed and polished by rubbing with a water-worn
    pebble, preferably porphyry, or with an old Indian stone axe-head, and then dried
    in the sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author proposes that some so-called charm stones obtained from Indians
    may actually be natural water-worn pebbles used by potters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Patterns are drawn on vessels with tree-bark juices that produce red, brown,
    pink, or black markings; rude animal figures and geometric spiral, curved, or
    straight-line patterns are mentioned.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Some True Caribs produce a fine glaze by applying juices, and finished vessels
    are slowly baked over fire, which brings out glaze or pattern or produces black
    or natural yellow color depending on preparation.
  category: sequence
  evidence_refs:
  - ev:7
