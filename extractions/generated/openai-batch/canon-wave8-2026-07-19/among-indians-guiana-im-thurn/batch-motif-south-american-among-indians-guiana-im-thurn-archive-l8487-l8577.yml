  summary: The passage describes forest and savannah house forms in Guiana, including
    palm-leaf or bark walls, round or oval mud-walled savannah houses, separate kitchens
    and visitor sheds, clay preparation by women and children, dark interiors with
    hammocks and fires, larger communal houses near the Brazilian border attributed
    to Rio Negro influence, and dry-ground pile houses compared to Warrau and coastal
    forms.
