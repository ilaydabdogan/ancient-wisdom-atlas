canonical_text:
  quote: far too fearful of its supposed supernatural character
  summary: The passage describes an expedition near Kaieteur Falls. Boats cannot continue
    beyond the rapids; an Ackawoi party at the landing is said to avoid the fall because
    of its supposed supernatural character. The expedition makes a difficult trackless
    approach through boulders, forest, crevasses, and ravine terrain, then views the
    fall, its cliff amphitheatre, dark pool, and a cave behind the falling water.
  language: English
