canonical_text:
  quote: ''
  summary: The passage describes plaiting, gendered craft labor, woodworking, and
    especially canoe-building among Indians of British Guiana. It explains materials
    used for belts and head fillets, notes that men do woodwork, identifies canoe
    types and specialist boat-building groups, and gives a sequence for making a dug-out
    canoe from a tree, including hollowing, dragging to water, spreading the sides
    with fire, wet sand, or running water, and finishing with wood pieces, caulking,
    resin, pitch, and wax.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Plaiting is described as used chiefly for men's waist belts, made from materials
    such as cotton, fibre, basketry strips, human hair, or monkey hair.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that monkeys' hair had become more common than human hair
    for belts, probably because intertribal war had almost ceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cotton fillets worn by women around their heads are stated to be made only
    by men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Woodworking is described as work done only by men, using simple tools such
    as an axe, cutlass, knife, and sometimes an adze or nails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Boat-building is described as the most important form of carpenter's craft
    because much of the people's life is spent on the water.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Four kinds of boats are named: canoe, corial, buckshell, and woodskin.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Warraus on the coast and the Wapianas in the interior are identified as
    especially apt boat-builders whose canoes are a principal barter article with
    other tribes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A canoe is made by seeking a suitable tree in the forest, felling it, roughly
    shaping it where it falls, hollowing it partly with tools and partly by burning,
    and dragging it down a prepared path to the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The canoe sides are spread apart by methods including inversion over fire,
    filling with wet sand, or soaking in running water and forcing the sides apart
    with wedge-shaped timbers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hard-wood bars and benches are fixed across the canoe to keep its sides from
    closing again.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Triangular pieces close gaps at bow and stern; an added plank raises the sides
    and ends; seams are caulked with bark shreds and pitched with hyawa resin or karamanni
    mixed with wild bee wax.
  category: sequence
  evidence_refs:
  - ev:8
