  summary: 'The passage records observations at Kaieteur: low water reveals a cave
    and pool behind the fall; bromeliads retain water on parched rock; sundews catch
    insects; swifts descend at dusk to roost by and behind the fall; a new bird species
    is collected; moonlit nights, roaring water, and cloud-filled valleys are described;
    the narrator leaves and later plans another ascent of the Potaro with companions
    and boats.'
