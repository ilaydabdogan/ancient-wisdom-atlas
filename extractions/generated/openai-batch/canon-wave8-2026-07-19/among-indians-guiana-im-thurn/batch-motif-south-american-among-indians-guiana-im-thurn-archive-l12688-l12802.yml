canonical_text:
  quote: ''
  summary: The passage describes tobacco cultivation and cigarette-wrapper preparation,
    then introduces paiwari feasts, including invitations by knotted strings or notched
    wood, reciprocal food and beverage preparations, and large canoe-shaped paiwari
    troughs prepared chiefly by women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tobacco leaves are grown in clearings, picked, sometimes dipped in honey,
    hung under the house roof to partly dry, arranged in bundles, and tightened as
    they dry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tobacco is smoked in cigarettes made as needed by wrapping half an uncut leaf
    in a paper-like wrapper from cakaralli-tree bark or manicole-palm spathe.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Cakaralli wrapper material is prepared by removing rough bark and striking
    the cut edge of the inner bark to separate it into even-surfaced sheets called
    queeka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Younger men and boys are reported to practice the craft of preparing queeka
    at night when camping near cakaralli-trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Paiwari feasts are occasions for drinking paiwari and may be held for marriages,
    funerals, new settlements, or simply because a headman wishes to entertain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Invitations to a paiwari feast are sent to neighbouring settlements of the
    same tribe, with knotted strings distributed to headmen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each invitation string is knotted according to the number of days before the
    feast, and one knot is untied each day until the feast day arrives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Knotted strings or notched sticks are also used to record items such as debts,
    with knots or notches removed as payments are made.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before the feast, guests prepare bread, hunt game and fish, and smoke meat
    to contribute to the entertainment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hosts supply paiwari and gather provisions; women prepare the paiwari days
    before the guests arrive.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Paiwari troughs stand in the middle of many houses, are shaped somewhat like
    canoes, sometimes are actual canoes, and may hold 150 to 200 gallons.
  category: object
  evidence_refs:
  - ev:8
