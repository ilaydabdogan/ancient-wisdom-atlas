  text: A man from the Canakoo mountains suddenly climbed the ladder with a gun, stood
    upright and silent for nearly an hour, then left immediately.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Canakoo visitor is described as a short, sturdy Macusi man with shaggy
    hair bound by a cotton fillet and a defined moustache.
  category: attribute
  evidence_refs:
