canonical_text:
  quote: ''
  summary: The passage describes visits by Indigenous people to the narrator’s house,
    barter and silent observation, a distinctive Macusi visitor from the Canakoo mountains,
    jokes about the narrator’s hairy legs, repair and careful use of trade guns, a
    sunrise view over the plain called Lake Amoocoo or Parima where mist appears like
    a glittering city on the supposed site of El Dorado or Manoa, the seasonal nature
    of the so-called lake, a brief reference to treatment by a peaiman or medicine
    man, famine conditions, renewal after rain, and the beginning of a journey toward
    St. Joaquim.
  language: English
  quote_policy: summarized
