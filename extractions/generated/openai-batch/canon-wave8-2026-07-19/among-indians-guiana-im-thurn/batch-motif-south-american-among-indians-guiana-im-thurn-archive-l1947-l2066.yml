- id: obs:1
  text: Indigenous visitors came from Quatata and distant places, some from curiosity
    and others to barter; they brought provisions, hammocks, tame birds and animals,
    manufactures, dress, and ornaments, and sometimes sat silently observing the narrator’s
    movements.
  category: action
  evidence_refs:
  - ev:1
