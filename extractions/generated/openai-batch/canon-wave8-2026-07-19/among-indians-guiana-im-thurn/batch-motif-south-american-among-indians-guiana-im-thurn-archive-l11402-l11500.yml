canonical_text:
  quote: ''
  summary: The passage describes the cultivation, gathering, extraction, preparation,
    and use of cotton, eta/tibisiri fibre, and crowia/silk-grass fibre among Indians
    of Guiana. It details palm and leaf fibre processing, gendered differences in
    Arawak peeling practices, thigh-rolling methods for twisting cord, uses for hammocks
    and bow-lines, and women’s cotton spinning with a spindle, bone whorl, and hook.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small quantity of cotton is grown and spun by almost all Indians, while
    a larger portion used by them is prepared by the Arecunas and distributed among
    other tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ata palms grow in swampy places; silk-grass is cultivated in many Indian fields;
    tibisiri and crowia are gathered and prepared as needed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eta fibre, called tibisiri by Arawak Indians, is taken from the young folded
    leaf spike of the Mauritia flexuosa palm; fibre from young plants is described
    as stronger than fibre from old plants.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eta/tibisiri fibre is separated from the spike, boiled, dried in the sun,
    and twisted into strings; fibre from about twelve spikes can make a large hammock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crowia, called silk-grass fibre in the colony, is extracted from bromelia
    leaves and sometimes from anannassa leaves by splitting the leaf, passing it through
    a noose tied to a tree, and pulling so that the green skin and soft matter are
    removed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After extraction, crowia fibre is washed, dried in the sun, and becomes very
    white; the passage contrasts it with tibisiri, which turns yellow in water.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Arawaks, men are said to peel the leaf from the bottom upward, while
    women peel from the point downward to the base.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Tibisiri and crowia fibres are twisted into string by holding fibres in the
    left hand, resting them across the naked right thigh, and rolling them with the
    palm of the right hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Single strands are used for hammocks; three strands make bow-line string;
    three triple cords, sometimes nine strands, make hammock-ropes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that smooth, hairless, naked thighs make the cord-making
    method easy for Indians, while a European attempting it would have hairs caught
    among the fibres.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Indian women are described as responsible for preparing twine for hammock-making,
    but women who begin wearing dresses are said to give up this work.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Silk-grass fibre string is described as more even and regular than eta string,
    made in smaller quantity, and used only for the most important purposes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cotton is gathered and spun by women using a loose cotton band, a pair of
    wooden spindles, a bone whorl, and a hook at the spindle end.
  category: sequence
  evidence_refs:
  - ev:7
