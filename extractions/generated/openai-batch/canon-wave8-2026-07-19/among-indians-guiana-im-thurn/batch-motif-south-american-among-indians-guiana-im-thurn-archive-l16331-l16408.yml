  summary: The passage summarizes observed features of shell-mounds between the Pomeroon
    and Orinoco and then infers that their makers were temporary, sea-arriving strangers,
    possibly Island Caribs later known as Caribisi or True Caribs. It argues from
    layered shell deposits, fire-hardened surfaces, scarce mammal bones, lack of pottery,
    swamp locations, and human remains indicating cannibalism.
