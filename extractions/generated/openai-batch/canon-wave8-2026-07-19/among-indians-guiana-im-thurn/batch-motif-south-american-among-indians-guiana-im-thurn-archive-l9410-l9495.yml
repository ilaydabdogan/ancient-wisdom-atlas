  summary: 'The passage discusses beenas as hunting preparations intended to ensure
    success, including forms that involve inflicting pain on hunters or dogs. The
    author speculates that voluntary pain trains hunters to withstand danger and compares
    this to coming-of-age tortures among North and South American Indians. The passage
    then describes Indian hunting dogs in Guiana: their mixed ancestry, differential
    treatment, training, breeding by the Tarumas, barter value, specialization by
    game type, and use in driving game from forest to water where the hunter waits
    in a canoe.'
