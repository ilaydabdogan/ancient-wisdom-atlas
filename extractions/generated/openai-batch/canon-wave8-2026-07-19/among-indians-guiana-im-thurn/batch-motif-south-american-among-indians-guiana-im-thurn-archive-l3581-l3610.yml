  summary: The narrator describes a cliff-edge camp during heavy cloud, mist, rain,
    and wind. A rocky ravine is obscured by moving clouds; a river rushes over the
    cliff through white mist; swifts disappear into the cloud; the waterfall sounds
    from an unseen pool below. The scene is described as unreal, grand, and like a
    new, barely formed universe. Increasing rain drives the travelers to wet hammocks
    for the night.
