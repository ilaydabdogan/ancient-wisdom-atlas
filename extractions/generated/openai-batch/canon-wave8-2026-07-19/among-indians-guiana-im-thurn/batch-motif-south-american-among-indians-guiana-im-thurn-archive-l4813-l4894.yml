canonical_text:
  quote: ''
  summary: 'The passage describes several Guianese animals and reported Indigenous
    observations about them: tapirs near rivers, arboreal monkeys, roaring howler
    monkeys, anteaters, and local cats called tigers or tiger-cats. It emphasizes
    jaguars as feared predators, recounting reports of attacks on cattle and household
    beings, and describes Indians sleeping high in trees with fire around the roots
    when jaguars are suspected nearby.'
  language: English
  quote_policy: summarized
