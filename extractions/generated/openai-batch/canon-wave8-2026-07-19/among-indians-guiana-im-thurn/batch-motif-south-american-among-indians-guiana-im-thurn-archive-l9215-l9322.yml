canonical_text:
  quote: ''
  summary: The passage describes old age, death, mourning, burial, grave sanctity,
    special burial sites for peaimen, and the opening framing of hunting and agriculture
    among Indians of Guiana. It reports house burial in hammocks, grave goods, fire
    and feasting over graves, abandonment of houses after burial, and social importance
    of hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old persons past work are described as remaining in hammocks and being fed
    by younger relations, but receiving little further care or respect.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Survivors are said usually to show few outward signs of grief, though the
    author suggests reticence may conceal feeling.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In some deaths, survivors raise prolonged wailing, crop their hair, and, according
    to Schomburgk, paint themselves heavily with faroah.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body is wrapped in its hammock and put into a hole dug in the house and
    lined with palm leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Burial position varies: sitting if the hole permits, standing in the Ackawoi
    case, or bent into any convenient position if the hole is small.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Various property of the deceased is placed in the grave; one reported grave
    included a cord for a murdered man to bind his murderer if met beyond the grave.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The True Caribs are said formerly to have cleaned and preserved bones of dead
    relations in their houses, but the passage says they no longer do this.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the grave is filled, fire is made over it, a feast with dancing, drinking,
    and songs is held, and the house is deserted forever.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Covered graves are regarded as sacred and normally are not disturbed, with
    the stated exception of a kenaima associated with body-snatching.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Among the Macusis, bodies of peaimen are said to be buried on a special isolated,
    wooded hill near the Canakoo mountains; Karenacroo is also said to have a special
    burial place.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The following chapter frames Guiana Indians as living by both agriculture
    and hunting, rather than by hunting alone.
  category: other
  evidence_refs:
  - ev:9
- id: obs:12
  text: Women are said to cultivate plants such as cassava, while men hunt; a man’s
    rank in a village or settlement is linked to his skill in the chase.
  category: relationship
  evidence_refs:
  - ev:9
