canonical_text:
  quote: ''
  summary: The passage describes Guiana Indigenous game arrows, including iron spear-headed
    arrows, older bone/shell/stone points, rappoo bamboo-headed arrows believed by
    some to be poisonous, and ourali-poisoned arrows with protective carrying methods
    and target-specific point forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Big game arrows are described as having diamond-shaped spear-like heads, with
    spear-headed arrows said to be used by most tribes and more common among Caribs
    and Ackawoi than among Macusi and Arecunas.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says currently mentioned arrowheads are filed from barrel hoop
    iron or other old metal, while formerly they were probably made from turtle or
    other animal bone, mollusc shell, or stone.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A True Carib captain is reported as saying that he saw bone-, shell-, or stone-pointed
    arrows in common use as a boy and that he still used a bone-pointed arrow to shoot
    iguanas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Savannah tribes are described as using long lance-shaped arrowheads made from
    rappoo bamboo for big game; the bamboo is cut, dried, shaped, and hardened in
    fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage records an Indigenous assertion that rappoo arrows are poisonous,
    reports a peccary allegedly dying after being struck by one, and then reports
    the author's fowl experiments that did not confirm a poison effect.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ourali arrow points are described as long, narrow, flat strips of light wood
    smeared with vegetable poison and inserted into the socket of a reed shaft.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ourali arrow points are carried separately in a small hollow-bamboo quiver
    or covered by a hollow-bamboo sheath when in the shaft to prevent the handler's
    hand from contacting the poison.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Ourali is described as a vegetable substance prepared by Indigenous people,
    especially Macusis, and as diminishing and finally stopping heart action when
    it enters an animal's blood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage distinguishes stout ourali points for monkeys, slender many-notched
    points for birds, and very slender lightly poisoned points for birds and small
    animals intended to be tamed rather than eaten.
  category: object
  evidence_refs:
  - ev:7
