canonical_text:
  quote: ''
  summary: The passage describes several shallow and deep rock-drawings in Guiana,
    especially near Temehri, Temehri island, the Cabalebo, the Corentyn, and the Berbice.
    Shallow examples are large, faint, often line-based, generally on smooth rock
    surfaces, and reportedly tend to face eastward. Deep engravings are smaller grouped
    depictions that include human forms, monkeys, snakes, other animals, and simple
    line patterns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A large figure on Temehri rock is described as thirteen feet high and five
    feet seven inches wide; figures of this sort vary in size but are much larger
    than the deep sculptures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Temehri rock figure is very indistinct and is nearly invisible except
    under certain conditions; water poured over the rock and white chalk marking were
    used to make it visible for photography.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Downer’s 1844 map of Berbice represents two unusual rock-drawings on Temehri
    island: one with an upright line and volutes, and another apparently composed
    of straight-handled tridents; the author did not find the latter figure on the
    island.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author found the original of the six-volute figure; when carefully traced,
    it differed from the map representation and was classified by depth as a shallow
    engraving, though unlike typical shallow and deep examples.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several other shallow drawings occur on Temehri island; some were too indistinct
    to decipher, and one was almost hidden by a tree until the tree was cut down.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A shallow rock-drawing at the first fall on the Cabalebo is on the eastern
    face of a gneiss boulder at the edge of the fall, partly surrounded by shallow
    water and partly submerged when the river is full.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Cabalebo drawing is worn and only slightly incised; additional nearly
    obliterated strokes make it resemble the figure on Temehri rock.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other shallow examples are reported along the Corentyn and Berbice rivers,
    and the author says these may be regarded as confined, in Guiana, to the eastern
    district.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shallow figures are said to occur on comparatively large, smooth rock surfaces,
    to be generally larger than deep figures, to consist of elaborate combinations
    of straight or curved lines, and not to represent animals.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that all shallow examples he had seen faced more or less
    accurately eastward, while noting uncertainty about the significance of that fact.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Deep engravings are described as grouped rude drawings depicting human forms,
    monkeys, snakes, other animals, simple line combinations, and occasionally more
    elaborate combinations; individual figures average twelve to eighteen inches high.
  category: object
  evidence_refs:
