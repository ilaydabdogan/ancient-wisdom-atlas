literal_observations:
- id: obs:1
  text: One war-club type has a rounded shaft and a broad, flat, somewhat oval blade,
    with the shaft tapering to a sharp point said to be used after a blow from the
    blade.
  category: object
  evidence_refs:
  - ev:1
