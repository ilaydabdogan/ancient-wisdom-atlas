  text: Different varieties of the described war-club type are associated in the passage
    with the Wapiana and the Arecuna.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A third war-club kind is wedge-shaped, has an unknown original tribal affiliation,
    and is described as the rarest form.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some museum specimens from Guiana and nearby South American regions show clubs
    made more formidable by adding a stone axe-blade or later an iron blade fixed
    into the side.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hunting weapons are said to be made in greater number than war weapons because
    warfare has nearly ended while hunting remains necessary.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A complete blow-pipe set includes the blow-pipe, a quiver with darts, and
    a small basket containing fibre used to balance the dart.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The main reed for the blow-pipe is said to grow only near the sources of the
    Orinoco, and the Arecunas are described as procuring the reeds and making or distributing
    blow-pipes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The blow-pipe barrel is made from a dried hollow reed inserted into a bored
    palm tube, with added details such as a palm-seed end-piece, peccary-teeth sights,
    and sometimes decorative basketwork.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The quiver is dice-box-shaped, made of coated wickerwork, has a tapir-hide
    lid, and contains darts, a perai-fish jaw, and crowia fibre.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The darts are made from sharpened cokerite palm midrib splinters dipped in
    urari poison and are bundled with a guard to prevent contact with their poisoned
    points.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before firing, fibre from the small basket is tied onto the blunt end of a
