- id: obs:3
  text: Indians know that fish gather under certain fruiting trees and plants when
    ripe fruit drops, and they use seeds from such plants as hook bait.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arecunas living on the savannahs near Roraima use small hooks and often take
    very small fish from small streams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arecunas catch small stream fish with landing-net-like nets and with small
