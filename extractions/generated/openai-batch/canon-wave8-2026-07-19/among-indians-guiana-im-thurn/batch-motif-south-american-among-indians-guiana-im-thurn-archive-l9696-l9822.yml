canonical_text:
  quote: ''
  summary: 'The passage describes Guiana Amerindian fishing and hunting practices:
    hook-and-line fishing with plant seeds as bait; Arecuna use of small hooks, nets,
    and wicker traps; a Macusi man''s hand-capture of fish; shooting turtles with
    a detachable-line arrow; shooting iguanas from riverside branches; and the use
    of guns alongside bow, arrows, and blow-pipe.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hooks and lines are described as useful barter items, and hook-and-line fishing
    is said to be frequently practised; some large hooks are made by Indians for very
    large fish.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimara are caught with a hook on a short line and spring rod, fastened on
