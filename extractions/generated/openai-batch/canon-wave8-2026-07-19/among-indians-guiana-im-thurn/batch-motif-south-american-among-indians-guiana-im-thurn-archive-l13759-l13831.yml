canonical_text:
  quote: the body remained and that it was ‘ something inside him’ which went up
  summary: 'The passage reports a Macusi man''s frightening vision of Arecunas, then
    discusses peaiman practice: fasting, solitude, stimulants, and narcotics induce
    an ecstatic condition in which the peaiman''s spirit is believed to leave the
    body, ascend, and communicate with other spirits. The narrator concludes that
    the Indians described believe in a spirit within the body and in voluntary or
    involuntary separation of spirit and body.'
  language: English
