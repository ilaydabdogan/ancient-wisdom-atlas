canonical_text:
  quote: "“the firm belief of the Indian in the separability of the spirit from the
    body during sleep”"
  summary: The passage describes several incidents in which Guiana Indians treat dream
    experiences as real events, including dream labor, dream assaults, and dream-based
    requests or acts of punishment. The narrator then explains these as evidence for
    a belief that the spirit can separate from the body during sleep, that others’
    spirits can be present in dreams, and that waking visions are similar in status
    to dreams. It also distinguishes natural visions from intentionally induced visions
    produced through fasting, stimulants, or narcotics.
  language: English
  quote_policy: quoted
