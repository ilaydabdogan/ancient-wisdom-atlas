canonical_text:
  quote: ''
  summary: 'The passage describes careful bodily adornment by young Indian men and
    women, a figure caption for a cotton mantle, and a three-stage account of adopting
    European clothing: beads, single European garments, and then full shirt-and-trousers
    or dress forms. It also notes the spread of beads through barter and distinguishes
    the limited spread of the second and third stages among specific coastal or mission-associated
    groups.'
  language: English
  quote_policy: summarized
