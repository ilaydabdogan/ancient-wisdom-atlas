literal_observations:
- id: obs:1
  text: Children may not be weaned until the third or fourth year, and one reported
    account says a grandmother may relieve a mother of an elder child when too many
    children claim food from one mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother commonly carries a young child against her hip in a small hammock
    slung from her neck or shoulder, while a father may bring seeds, fondle the child,
    and make necklaces and ornaments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When children can run about, they are left largely to themselves and begin
    to mimic their parents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boys play with mimic bows and arrows, while girls help older women with tasks
    such as peeling cassava, watching a pot on the fire, and carrying firewood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young child receives a proper name soon after birth; the peaiman is said
    to be the proper giver, though parents often choose the name, and the selected
    word is generally a plant, bird, or other natural object.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Owners strongly object to telling or using their proper names because the
    name is described as part of the person and as giving power to whoever knows it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: People commonly address one another by relationship terms or general terms
    such as boy, girl, or companion, and may ask a European to give them a name for
    dealings with Europeans.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some people who cannot pronounce or remember an English name preserve a written
    paper bearing the name and show it when asked.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Boys and girls may be betrothed early; the boy or young man brings game and
    other presents to the girl, but at marriage age the youth is free to choose another
    wife and may reclaim durable presents from the earlier betrothed girl.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before choosing a wife, a youth must prove manhood and ability to work by
    enduring wounds, a hammock full of fire-ants, or similar tests, and by clearing
    cassava ground and bringing game and fish.
  category: action
  evidence_refs:
  - ev:7
