canonical_text:
  quote: ''
  summary: A travel party in British Guiana struggles through drought-lowered river
    passages, sandbanks, hunger, and fatigue. Messengers find famine at Morai, and
    Eddington goes to Quartama for aid. After several days, including a thunderstorm
    and a nocturnal animal encounter, he returns with Macusi helpers and cassava.
    The party reaches the waterside near Quartama, where Macusi visitors gather with
    hammocks at a riverside camp shaded by trees and climbing palms.
