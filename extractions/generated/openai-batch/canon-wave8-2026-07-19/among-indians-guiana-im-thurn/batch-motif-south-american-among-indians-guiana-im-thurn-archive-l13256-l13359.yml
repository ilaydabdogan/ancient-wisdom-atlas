canonical_text:
  quote: ''
  summary: The passage describes Guiana Indian ideas of illness, kenaima hostility,
    and the peaiman’s role as protector, healer, priest, initiate, and ritual practitioner.
    It explains that pains may be attributed to foreign bodies understood as materialized
    hostile spirits; that kenaimas are feared as real or imagined attackers; that
    peaimen counteract imagined attacks and hold medicinal, ritual, and hunting knowledge;
    that peaiman training includes fasting, solitary forest wandering, tobacco-juice
    ingestion, voice training, and ecstatic performances; and that one cure begins
    in a closed dark house with tobacco leaves, water, green boughs, hammocks, an
    audience, and warnings about kenaimas on the floor.
  language: English
  quote_policy: summarized
