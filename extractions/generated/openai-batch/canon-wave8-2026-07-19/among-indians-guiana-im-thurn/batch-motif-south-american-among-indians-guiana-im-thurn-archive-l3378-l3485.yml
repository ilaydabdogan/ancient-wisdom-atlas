  summary: The narrator describes a journey up the Essequibo and Potaro rivers during
    heavy rains and high water. Rapids, cataracts, falls, sandbanks, rocks, foam,
    and dark floodwater are observed. A large camoodi snake is found on rocks and
    shot. The passage also describes the flowering season along the Potaro, with cakeralli
    trees, Petrea martiana, and Posoqueria longiflora reflected in or growing near
    the river water.
