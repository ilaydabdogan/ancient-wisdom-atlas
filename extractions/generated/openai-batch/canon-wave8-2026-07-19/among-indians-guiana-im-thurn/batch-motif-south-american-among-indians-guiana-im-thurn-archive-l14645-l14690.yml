canonical_text:
  quote: ''
  summary: 'The passage summarizes the author''s account of Guiana Indian animism:
    humans and perceptible objects have both body and spirit; spirits can separate
    from bodies during life and after death, continue on earth after death, and may
    be active, malignant, or quiescent. Communication with spirits is attributed to
    the peaiman in an ecstatic state. The author also notes beliefs about dream reality,
    a country beyond the sky attainable by living persons, spirits in portions of
    natural phenomena such as water, and ancestral spirits.'
  language: English
  quote_policy: summarized
