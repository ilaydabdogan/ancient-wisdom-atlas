  quote: ''
  summary: 'The passage describes peaiman practices involving kenaimas, spirit-summoning,
    healing, and village protection, then introduces a chapter on Guiana Indian religion
    framed as animism: belief in spirits distinct from bodies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A kenaima is described as having entered a victim in the body of a caterpillar;
    killing the caterpillar is said not necessarily to kill or injure the kenaima,
    whose spirit may pass back into its own body or another body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ritual rattle is described as a gourd-shell containing hard seeds and decorated
    with long wreaths of bright-colored feathers; a drum is sometimes also used.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The peaiman is said to have powers of summoning, banishing, and correcting
    kenaimas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The peaiman is supposed to call and question the spirit of a sleeping Indian
    of his own tribe, including to learn what an absent friend is doing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The peaiman may send his own spirit to obtain information while his body remains
    present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When an Indian is ill, the peaiman first blows three times on the invalid,
    intending to blow away the evil spirit of the illness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If one peaiman fails, a second or sometimes three peaimen may perform noisy
    rites on following nights.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When signs such as the whistling of certain birds are taken to indicate kenaimas
    near the village, the peaiman walks around the houses by night, shouting and using
    a drum or rattle to drive them away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The peaiman receives payment for cures and expulsions, and also gains influence
    such that people dare not refuse requests for food or even another man’s wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chapter outline lists beliefs in body and spirit, separability of spirit
    in death, sleep, and visions, transmission of spirit into other bodies, and spirits
    of animals, fabulous animals, inanimate objects, and disease.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage defines animism as belief in spirits as distinct from bodies and
    states that the Indians of Guiana are abundantly animistic.
  category: attribute
  evidence_refs:
  - ev:8
