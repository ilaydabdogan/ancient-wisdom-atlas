  summary: The passage gives the narrator's ethnographic description of the physical
    appearance, skin color, hair, facial expression, endurance, health, aging, and
    lifespan of Indigenous people in Guiana, with brief comparisons among forest and
    savannah groups and with Europeans, Africans, and Chinese/Mongolian features as
    perceived by the narrator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator mentions a young canoe-crew member described as half-Indian and
    half-negro who appeared athletic among the Indians.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator describes the skin color of the Indians as difficult to define,
    commonly called copper-colored or red-skinned, and approximates it as red cinnamon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that skin shade differs among tribes and that forest Indians
    are generally fairer than those on open savannahs, with exceptions noted for Warraus
    and some individuals whose color is obscured by dirt.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator reports seeing an Indian's skin darken within six months after
    he stopped wearing clothes, changing from unusually fair to similar to his fellows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator describes scalp hair as thick, long, very straight, very black,
    and usually cut evenly around the head at right angles to the neck.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narrator compares facial features to those he calls Chinese or Mongolian,
    and describes the expression as gentle, downcast-eyed, restrained, changeless,
    and monotonous.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator states that, by European standards, most faces are not considered
    handsome or beautiful, though rare men and women are described as having regular
    and pleasing features.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator describes the Indians as constitutionally weak despite occasional
    severe labor.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The narrator says they can paddle for several consecutive days and nights
    with short rests when exertion is not very great, but severe work soon tires them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator says they may walk over savannahs day after day but cannot cover
    a given distance as quickly as an ordinary European or negro, according to his
    comparison.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The narrator explains prolonged hammock-rest after hunting as a real need
    for excessive rest following unusually violent exertion.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The narrator states that slight chills, blows, or wounds that might be insignificant
    to others can be fatal to some Indians.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The narrator states that they rarely attain considerable age and estimates
    average life duration at about forty to fifty years, while noting they do not
