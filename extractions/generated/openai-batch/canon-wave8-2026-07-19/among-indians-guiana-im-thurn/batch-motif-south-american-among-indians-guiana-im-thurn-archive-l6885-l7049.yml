canonical_text:
  quote: ''
  summary: Ethnographic discussion of Guiana Indian nomenclature and classification.
    The passage explains place-name meanings, clarifies that “Caribisi” denotes places
    where True Caribs live rather than a tribe name, proposes naming conventions for
    True Carib and True Wapiana groups, and compares languages, dialects, and physical
    distinctions among Warrau, Arawak, Wapiana, and Carib groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage gives examples of Guiana names interpreted as meaning the home
    of an animal, including a howling monkey term and Aroabisci as the home of the
    jaguar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arawak companions are described as identifying certain settlements by saying
    “Caribisi,” meaning that True Caribs live there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Travellers are said to have mistaken “Caribisi” for a tribal name, and the
    author says it should be removed from ethnological lists.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies “Carinya” as the True Caribs’ own name for themselves,
