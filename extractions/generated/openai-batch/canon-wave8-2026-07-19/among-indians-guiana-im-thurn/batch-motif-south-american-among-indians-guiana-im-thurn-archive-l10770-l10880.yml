canonical_text:
  quote: ''
  summary: The passage describes foods and drinks used by Indigenous peoples of Guiana,
    including insects gathered by fire or nest-probing, palm fruits and famine foods,
    cultivated crops said to be introduced from Europeans, and beverages made from
    eta palm sap, maize, cashew fruit, and honey. It ends with the opening heading
    of a chapter on manufactures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists true ants, white ants or termites, grasshoppers, wasp and
    beetle grubs, and caterpillars as insects that are eaten.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
- id: obs:2
  text: At the beginning of the rainy season, large evening fires are used to attract
    winged white ants and true ants; the insects lose or scorch their wings, fall,
    are swept up, and are eaten.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At other seasons, a pointed stick may be pushed into an ant or termite nest,
    withdrawn with living insects on it, and licked clean.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator says this nest-probing technique may have been learned from ant-eaters,
    which insert long tongues into nests and eat adhering ants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large black ant is eaten by holding the insect by the head and biting off
    its abdominal segment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wasps’ nests are knocked down from trees so that grubs can be picked from
    the cells and eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The gru-gru worm is identified as the grub of a palm-damaging beetle living
    in palm heartwood and is described as a delicacy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In times of famine, smooth-skinned caterpillars are collected, boiled, and
    used as food.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cokerite seeds, called mareepa by Carib tribes, may form almost the sole food
    during famines and are then boiled to increase their bulk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The eta palm’s fleshy seed covering is scraped off and pressed into a cake
    for eating.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some Arawaks and other coastal Indians grow peach-palms near their houses,
    though the passage says the plant is not indigenous and that the Indians do not
    know its source.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Yams, sweet-potatoes, plantains, bananas, sugarcane, and maize are grown and
    eaten in small quantities, and the passage reports that the Indians say these
    came from Europeans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Eta palm wine is made by cutting an eta palm, grooving the upper trunk as
    a trough, covering the groove with leaves, collecting the sap, and drinking it
    fresh or after fermentation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says eta palms are cut reluctantly for wine because the tree produces
    many useful things.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Other beverages are made by fermenting boiled and crushed maize in water,
    crushing wild cashew fruit in water, or mixing wild honey with water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A note states that the eta tree and the drink from it share the same name
    in Macusi and Warrau usage.
  category: speech
  evidence_refs:
  - ev:7
