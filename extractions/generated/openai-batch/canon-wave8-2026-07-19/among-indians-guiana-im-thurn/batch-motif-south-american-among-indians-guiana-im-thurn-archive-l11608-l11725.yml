canonical_text:
  quote: ''
  summary: The passage describes hammock and textile manufacture in British Guiana,
    including cotton and tibisiri fibre hammocks, gendered stages of hammock-making,
    tribal variations in technique, child-carrying bands, close-textured cotton bands
    and ceremonial fillets, rare patterned feast cloths, and garment materials such
    as woven cotton and Lecythis inner bark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cotton hammocks are attributed to the Macusis and Wapianas, and occasionally
    to the True Caribs, while hammocks in the region are said to be made of cotton
    or tibisiri fibre.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cotton hammocks are made on an adjustable square frame formed from four wooden
    bars.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cotton thread is wound around the frame in parallel, equidistant lines, and
    cross-bars are plaited from three cotton strands with the longitudinal bars inserted
    into the plaits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women do the hammock work up to removal from the frame, after which the
    hammock is handed to the men, who prepare and add the scale-lines.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The scale-line loops must be measured so that the centre loop is shortest
    and successive loops toward the outside are longer, allowing the hammock to hang
    evenly and comfortably.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arawaks make tibisiri fibre hammocks with parallel threads; similar hammocks
    are said to be probably made by remote Woyawais and Tarumas, but the passage states
    uncertainty about their kind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Warraus make a tibisiri fibre hammock in which the thread is netted rather
    than arranged in straight lines, with the whole hammock netted from one continuous
    string on a square frame lying on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each tribe makes small hammocks or broad endless bands of the same kind, worn
    by women over the shoulder to carry children.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some True Caribs make close-woven, often coloured cotton Brazilian hammocks,
    and the passage states that this art was copied from Brazilian-Indian half-breeds
    settled on rivers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some tribes make broad cloth-like cotton bands worn around legs and arms,
    woven onto the limbs without a seam, and narrow cotton fillets worn by women around
    the hair on festal occasions and by men around the lower edge of feather crowns.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Certain men’s shoulder-to-shoulder cotton strips worn during feasts have distinct
    patterns made by varied stitches; the passage states that the making of this cloth
    has been lost and that the cloths are rare.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says that before Europeans supplied ready-made cloth, some people
    probably wove men’s narrow garments and women’s aprons; in rare cases soft inner
    bark of Lecythis was used, and remote Arecuna women still make cotton aprons adorned
    with seeds instead of beads.
  category: relationship
  evidence_refs:
  - ev:10
