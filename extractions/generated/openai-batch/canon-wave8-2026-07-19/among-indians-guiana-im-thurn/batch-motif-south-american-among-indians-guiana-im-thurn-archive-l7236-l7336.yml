  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the arrival of the warlike Carib branch, the passage places Warraus
    in swamps south of the Orinoco mouth, Arawaks along a south-east coastal line,
    and Wapianas, Atorais, Amaripas, and related groups in the interior savannahs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage presents two theories of Carib migration and says the author prefers
    the theory that the Carib tribes now in Guiana reached the mainland from the islands.
  category: speech
  evidence_refs:
  - ev:2
