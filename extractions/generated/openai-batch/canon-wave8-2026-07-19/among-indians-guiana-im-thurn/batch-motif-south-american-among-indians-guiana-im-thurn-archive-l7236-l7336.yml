canonical_text:
  quote: ''
  summary: The passage presents an ethnographic-historical reconstruction of tribal
    distributions and migrations in Guiana. It describes earlier Warrau, Arawak, and
    interior savannah occupations, then argues that Macusis, Arecunas, Ackawoi, and
    True Caribs reached the mainland from the West Indian islands in distinct migrations,
    following different routes and producing later displacement and settlement patterns.
  language: English
  quote_policy: summarized
literal_observations:
