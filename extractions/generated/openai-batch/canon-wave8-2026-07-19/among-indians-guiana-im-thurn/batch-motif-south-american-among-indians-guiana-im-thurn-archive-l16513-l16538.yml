canonical_text:
  quote: ''
  summary: The passage argues that True Caribs repeatedly raided from islands to the
    mainland and gradually settled in Guiana, using this to explain the stratified
    and geographically concentrated shell-mounds. It considers and rejects the suggestion
    that Warraus made the mounds, despite their swamp habitation, fish diet, and small
    kitchen-middens, citing island oyster-shells, lack of evidence for Warrau sea
    crossings, and the claim that the mounds were made by outsiders in Warrau country.
  language: English
  quote_policy: summarized
