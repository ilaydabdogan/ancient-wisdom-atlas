  quote: ''
  summary: The passage describes travel by government-subsidised steamer from Georgetown
    toward the Essequibo and Bartica Grove, the appearance and inhabitants of Bartica
    Grove, the narrator’s preference for a Macusi crew over local river-men, and the
    party’s movement upriver through forested scenery, the narrow current called the
    Monkey Jump, an overgrown path toward Kaieteur fall, and Moraballi, described
    as the last civilised houses they would see for six months.
  language: English
