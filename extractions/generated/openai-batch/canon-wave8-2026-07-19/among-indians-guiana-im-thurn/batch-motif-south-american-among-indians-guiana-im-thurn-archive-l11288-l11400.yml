canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana Indian baskets and related implements:
    raised baskets, suriana load-baskets, quake storage baskets, cotton-fibre baskets,
    materials and weaving methods, waterproof leaf lining for provisions, Nikari-karu
    palm-leaf pegulls, the decline of basket-work, cassava-graters made by Woyowais
    and Tarumas and distributed by Wapianas, and fibres used for thread or string.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deeper baskets raised above the ground on wooden legs are made and used for
    the same purpose by Arawaks, True Caribs, and most other forest Indians.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The suriana is a slipper-shaped carrying basket used for heavy cassava and
    root loads, firewood, hammocks, cooking utensils, and travelling goods; it has
    a laced open side and a broad forehead band cut from inner tree bark.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The quake is a rounded-bottom, open wicker basket used for storing provisions,
    confining young birds and animals being tamed, and many everyday purposes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Special round, shallow, saucer-shaped baskets are made to hold cotton fibre
    after seed separation and before spinning.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Most baskets are made from split iturite stems, sometimes natural, peeled
    and bleached, or stained black, and close weaving can make the basket walls dense
    and patterned.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rough surianas and quakes intended for brief use may be woven from strong
    bush-rope, roughly prepared iturite strips, or leaflets of a single palm leaf.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Quakes used for provisions such as farine, salt, and cassava bread are lined
    and covered with broad iturite leaves in ordered layers to guard the contents
    against damp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Nikari-karus are described as living on the Brazilian borders and making
    square or oblong pegulls from leaves of a palm rare in British Guiana but found
    near the Oorooa rapids on the Roopoonooni.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that Indian basket-work is very neat and that the art is
    fast dying out where white influence is felt; it recommends missionary efforts
    to revive and retain native arts.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cassava-graters are said to be made only by the Woyowais and Tarumas and distributed
    through the interior by the Wapianas.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cassava-graters are oblong curved boards with small holes holding angular
    stone fragments fixed by black vegetable pitch; cassava roots are scraped on them
    into pulp.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thread or string is described as needed for fishing-lines, bow-strings, tying,
    and cloth-making; Guiana Indian string is made from cotton, tibisiri from the
    eta palm, and crowia from silk-grass.
  category: object
  evidence_refs:
  - ev:10
