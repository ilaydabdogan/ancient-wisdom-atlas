canonical_text:
  quote: ''
  summary: 'The passage surveys stone implements in Guiana: their occurrence in shell-mounds,
    on the ground surface, and in Indian houses; compares shell-mound examples with
    more elaborate island Carib examples; proposes travel and collection explanations;
    notes surface distributions near the Orinoco and Toocano; suggests possible specialist
    manufacture and intertribal exchange; and describes retained axe-heads, polishing
    pebbles, ornamented stones, and possible superstitious value.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Stone implements are said to occur in three contexts: within shell-mounds,
    scattered on the ground surface, and stored in the houses of modern Indians.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shell-mounds are described as probably made by Caribs from the West Indian
    islands.
  category: relationship
  evidence_refs:
