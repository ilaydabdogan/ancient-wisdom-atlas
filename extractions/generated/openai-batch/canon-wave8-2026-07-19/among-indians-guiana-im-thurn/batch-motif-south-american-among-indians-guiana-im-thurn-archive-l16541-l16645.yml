- id: obs:3
  text: Museum examples from the islands are described as more elaborately finished
    and more ornamental than those from the shell-mounds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that Indians of Guiana make ornamental weapons and utensils,
    keep them at home, and travel with less labor-intensive implements.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author proposes that Carib raiders from the islands carried less elaborate
    implements to the mainland, explaining the simpler implements found in shell-mounds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Surface finds are reported throughout the country except the eastern district
    about the Corentyn River, with greater numbers near the Orinoco and at Toocano.
