    with other tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Stored stone implements are said no longer to be used for their original purpose;
    stone-pointed arrows are mentioned as being used only as toys.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Stone axe-heads are described as valued for smoothing and polishing clay in
    pottery-making, with smooth water-worn pebbles used when axe-heads are unavailable.
  category: object
  evidence_refs:
  - ev:8
  - ev:12
- id: obs:10
  text: Some stone implements are kept among men’s separate personal property; the
    passage notes that these cannot be potters’ implements because pottery is practiced
    only by women.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A number of stone implements are described as ornamented with red pigments
    or with more elaborate painted patterns.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author infers that useless preservation and ornamentation of the stones
    indicate special value not dependent on usefulness, and says this value can hardly
    be other than superstitious.
  category: other
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote reports a prior supposition that some so-called charm-stones were
