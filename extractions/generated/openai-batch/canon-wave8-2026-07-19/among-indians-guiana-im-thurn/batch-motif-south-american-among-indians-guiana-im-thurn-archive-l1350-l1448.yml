canonical_text:
  quote: ''
  summary: A travel party experiences conflict with a peaiman, who threatens to kill
    them in a stated order. Soon afterward supplies fail and members of the party
    become ill in that same order. The narrator suspects intentional human agency
    but says it cannot be proved, while Indigenous companions attribute the misfortune
    to disrespectful treatment of Paiwarikaira. The passage then discusses fever,
    dysentery, ophthalmia, arrival at Arinda, remnants of an old Dutch settlement,
    and routes used by Indians between rivers.
  language: English
  quote_policy: summarized
