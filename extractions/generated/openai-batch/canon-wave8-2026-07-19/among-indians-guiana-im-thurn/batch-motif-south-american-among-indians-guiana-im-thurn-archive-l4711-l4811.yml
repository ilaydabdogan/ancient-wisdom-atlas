canonical_text:
  quote: ''
  summary: The narrator argues that reports of tropical animal life can mislead by
    emphasizing exceptional danger or beauty. He then describes Guiana animal life
    as abundant but generally unobtrusive and harmless, focusing on rodents such as
    the labba, acouri, adourie, and water-haas, and on peccaries whose river-crossing
    habits and defensive herd behavior can endanger a lone attacker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says travellers can create wrong impressions by recounting exciting
    or harmful incidents while omitting long uneventful periods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that he wants to show Guiana animal life as abundant and
    beautiful, but also as slightly prominent and generally harmless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Three rodents are identified as the most prominent animals in Guiana: the
    labba, the acouri, and the water-haas.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The labba is described as a large guinea-pig-like animal with brown skin spotted
    with white, living on river banks, resting by day in hollow fallen trees, and
    foraging at night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The labba's flesh is highly esteemed by Indians and colonists, and colonists
    attach a proverb to eating labba and drinking creek water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The acourie is described as rabbit-like with long legs and coarse chestnut-colored
    hair; it lives mainly in the forest, drinks at water, and feeds by day on fallen
    fruits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The adourie is described as a smaller, similar species to the acourie and
    less common.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The water-haas or capybara is described as a much larger guinea-pig-like animal
    that lives in mud among tree roots at the river-side, swims well, is often seen
    in water, and has skin suited to frequent immersion.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The common rodents described are said to be retiring, so a traveller may go
    many days without seeing one until he learns their habits.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Two kinds of peccaries are described: the smaller abouyah, living in parties
    of five or six, and the larger kairooni, living in large herds sometimes of a
    hundred.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Peccary herds swim across rivers by day, but if they reach a river at night
    they wait until daylight before crossing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A lone attack on a herd of kairooni may be dangerous because they use their
    tusks, are said to kill jaguars, and may wait around a tree where an attacker
    has taken refuge.
  category: action
  evidence_refs:
  - ev:8
