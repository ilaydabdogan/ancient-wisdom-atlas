canonical_text:
  quote: ''
  summary: 'The passage describes Guiana Amerindian paiwari-feast dances and related
    activities: communal line dances with chanting and stamping, paired grotesque
    movements, animal-imitative dances including monkey and jaguar dances, Ackawoi
    animal-representation sticks, drinking and disorder during feasts, restraint of
    disruptive participants in hammocks, multi-day renewal of feasting until paiwari
    is exhausted, Macusi foot-races and ball games, and an Arawak macquarie-whip dance
    involving reciprocal calf-lashing as a test of endurance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dance forms are described as differing by tribe, with each tribe having several
    dances more or less peculiar to it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: In one simple dance, men and women form two opposing linked lines, advance
    and retreat for hours, chant monotonously, and stamp in time on hard ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At intervals, a man and woman may link arms and strut slowly together while
    bending their bodies in several directions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some dances imitate animals, including monkey movements and the slow stealthy
    gliding of a jaguar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the jaguar dance, one man represents the jaguar, creeps around and among
    the other dancers, springs with a roar, and carries off dancers from the circle
    until he alone remains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In an Ackawoi dance, each performer represents a different animal and carries
    a stick bearing the figure of that animal.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dancing is accompanied by chanting, and the end of a dance is marked by a
    loud uproar that signals renewed drinking.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When people are inflamed by paiwari, quarrels may escalate into abuse and
    slapping blows with an extended arm; both striker and struck person may fall because
    of intoxication.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a fallen intoxicated participant continues to cause trouble, less-intoxicated
    people may sew that person into a hammock, leaving the person helpless but still
    shouting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the night’s revel, participants retire to hammocks and renew the revel
    the next morning for many days until the available paiwari is exhausted.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Among the Macusis, paiwari feasts are generally accompanied by foot-races
    in which racers wear long white heron-feather or black powis-feather collars and
    start one behind another.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Ball games are also played at these occasions, using a ball made from part
    of an ear of Indian corn or from native indiarubber.
  category: object
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Arawak paiwari feasts are described as having a painful dance, possibly
    funerary according to Schomburgk though the author expresses doubt; the dancers
    are all men in two opposing rows, each holding a macquarie whip with a strong
    fibre lash.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: In the macquarie-whip dance, pairs retire from the rows and lash each other’s
    calves until weals and bleeding appear, after which they drink together; the author
    says the practice was probably devised to test endurance.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Collections are said to contain simple canes identified as macquarie whips
    from the Maiongkong, and the author suggests that this tribe may also play a similar
    game using different whips.
  category: other
  evidence_refs:
  - ev:14
