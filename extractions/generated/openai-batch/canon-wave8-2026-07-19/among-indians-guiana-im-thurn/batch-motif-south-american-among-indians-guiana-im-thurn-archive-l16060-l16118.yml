  summary: The passage argues that Guiana rock-engravings may have had intention,
    commemorative or religious significance, even if their original purpose is now
    forgotten. It notes a rite of rubbing red-pepper juice into the eyes in the presence
    of engraved rocks, compares engraved and painted rock figures, suggests painting
    may have followed the loss of engraving, and states that the figures may indicate
    a slight connection with Mexican civilisation.
