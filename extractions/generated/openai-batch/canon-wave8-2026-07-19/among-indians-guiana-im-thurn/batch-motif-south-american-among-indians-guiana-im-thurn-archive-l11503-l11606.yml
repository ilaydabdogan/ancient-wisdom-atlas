canonical_text:
  quote: ''
  summary: The passage describes spinning cotton with a spindle, making different
    thicknesses of cotton thread for arrows, ornaments, bands, and hammocks, and storing
    prepared cotton. It contrasts spindle-spinning with thigh-rolling of other fibres,
    then offers an authorial explanation linking cotton and spindle use especially
    with Carib tribes and thigh-twisting of palm or silk-grass fibre with earlier
    non-Carib inhabitants. It also lists practical uses of tibisiri, crowia, cotton,
    natural creepers, and hammocks.
  language: English
