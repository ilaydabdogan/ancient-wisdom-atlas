canonical_text:
  quote: Toomatoomari cataract is one of the gates of Fairyland.
  summary: The narrator describes a journey from Georgetown up the Essequibo and Potaro
    rivers toward Kaieteur, including stops at Toomatoomari, Chowrah, Mowraseema,
    and the approach to Pacoutout. The passage emphasizes cataracts, portages, clear
    red water, rock islands, sand banks, forested banks, deserted Ackawoi settlements,
    wildlife, and a flowering tree near the narrator's hammock.
  language: English
  quote_policy: quoted
