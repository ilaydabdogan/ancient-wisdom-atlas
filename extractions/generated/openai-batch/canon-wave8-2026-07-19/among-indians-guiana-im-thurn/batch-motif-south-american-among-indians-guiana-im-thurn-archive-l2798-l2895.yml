  text: Kaieteur had seldom been visited in the ten years after its existence became
    known, and the narrator states that he visited it twice, once in a dry season
    and once in a wet season.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The party left Georgetown, went up the Essequibo to the Potaro, and reached
