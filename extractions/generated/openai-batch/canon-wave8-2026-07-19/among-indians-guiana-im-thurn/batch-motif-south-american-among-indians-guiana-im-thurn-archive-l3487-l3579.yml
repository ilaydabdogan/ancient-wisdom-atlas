canonical_text:
  quote: ''
  summary: A travel party ascends the Potaro route toward Kaieteur, portaging and
    hauling boats through rapids and cataracts, receiving woodskins from Indians at
    Pacoutout, and being delayed by illness. They reach Tookooie, walk through a burned
    but recovering savannah, view the greatly swollen Kaieteur waterfall from the
    cliff edge, camp near the fall, and see a coloured arch formed by sun and rain
    across the ravine.
  language: English
  quote_policy: summarized
