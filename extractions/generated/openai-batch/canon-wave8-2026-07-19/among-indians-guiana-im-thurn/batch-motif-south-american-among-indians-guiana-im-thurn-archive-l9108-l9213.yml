  summary: The passage describes marriage arrangements, residence with the wife’s
    father, settlement formation, a Macusi marriage ceremony, premarital meat abstinence,
    marital fidelity and polygamy, and the accumulation of wives by peaimen whose
    ritual authority gives them social power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that a wife is sometimes obtained by purchase from her parents,
    with goods requested for the father and beads for the daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A girl may also be given by her parents to a man as recompense for some service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After marriage, the husband moves his possessions to his father-in-law’s house
    and lives and works there under the authority of his wife’s father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage distinguishes separation before children from desertion after
    children are born if the husband leaves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the married couple’s family becomes too large, the husband builds a house
    beside his wife’s father’s house; when a household head dies, the house-fathers
    separate and make new houses, because living where a man has died is described
    as uncanny.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In one Macusi marriage ceremony, grass and stones were cleared from a small
    area of savannah, eta-palm-pith mats were spread, the bride and bridegroom were
    placed there, and the village gathered around.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man abstains from meat for some time before marriage; one prospective husband
    refused venison and went without food rather than break the restriction.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author describes husbands and wives as generally faithful and affectionate,
    while also stating that a wife is held as the man’s property and may be sold,
    though she can gain influence with him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports polygamy among some groups, names Warraus and Wapiana
    as polygamists, describes Macusis and Ackawoi as generally not polygamous, and
    says the first wife is usually favored when there are multiple wives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Younger girls may be taken into a household nominally as wives and taught
    domestic duties by the old wife so that one may replace her later.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Peaimen are said to use their influence to obtain many wives; an Indian asked
    by a peaiman for his daughter, or sometimes his wife, is described as not daring
    to refuse.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a peaiman travels, women carry the baggage while the peaiman walks ahead
    adorned with feathers and paint and carrying his magic rattle, and perhaps bow
    and arrows.
  category: sequence
  evidence_refs:
  - ev:7
