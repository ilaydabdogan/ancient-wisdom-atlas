  summary: The passage describes the scenery around Moraballi, Moraballi creek, and
    the Aretaka rapids on the Essequibo, including river water, forest, rocks, islands,
    birds, and settlements. It also describes Indian and Cobungru inhabitants at the
    rapids, especially Cephas, a mostly Carib Cobungru serving as rural constable
    and chief, who bears a long-lasting wound from a large snake bite.
