  summary: The passage describes an Aretaka settlement, hospitality with cassava-based
    drink, the expedition's departure upriver, difficult hauling of canoes through
    the Aretaka rapid, an unnamed woman swept under a canoe and recovering, terminology
    for rapids and falls, and the Macusi boy Moé returning toward home and resuming
    local dress and habits after time in Georgetown.
