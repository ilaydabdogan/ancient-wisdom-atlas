canonical_text:
  quote: ''
  summary: The passage describes a visit near Gluck Island to a Victoria regia pond,
    the discovery and eating of cayman eggs, a night camp in which Indigenous companions
    fear Ackawoi kenaamias, a dawn chant that Moé attributes to a heron understood
    as a peaiman or medicine man, an unsuccessful attempt to hunt a mother tapir,
    and river scenery with islands, sandbanks, turtle egg-laying, and razor-bill nesting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Gluck Island the narrator observes a pond formerly known for the Victoria
    regia lily; most lilies have disappeared, probably because dry weather dried the
    pond and sun heat killed the plants.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cayman nest is found in a dark, damp mass of rotting leaves and decaying
    vegetable matter on the pond bank; it contains thirty-seven large, long eggs with
    thick porcelain-like shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The True Caribs seize the cayman eggs as a delicacy, and the narrator later
    eats part of one boiled hard, finding it similar to a duck egg with a faint musk
    flavor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night the narrator's companions load guns and place them near the hammocks,
    saying Ackawoi kenaamias or murderers are nearby; the narrator says the specific
    suspicion is unfounded but that such intertribal accusations are common.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The companions sit in a circle around camp fires eating late into the night
    and later sleep in hammocks with morsels of meat hung close to their mouths.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before dawn the narrator hears a monotonous chant with repeated syllables
    and grunts; Moé is identified as the singer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Moé points to a heron flying high over the river and explains that the honuré,
    the heron, is a peaiman or medicine man singing as it flies; the passage states
    that no Macusi will eat its flesh.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After all meat is finished, the group waits while the best huntsman tries
    to get the mother tapir, but he returns empty-handed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: During river travel the banks are described as dense forests on flat land,
    rocky slopes, and mountains, with hilltop views over a wide sea of tree-tops and
    mist marking streams.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The river contains many islands and channels; in the dry season yellow sandbanks
    emerge, and twice each year after wet seasons river turtles lay eggs in the sand
    while razor-bills make uncovered nests there.
  category: sequence
  evidence_refs:
  - ev:8
