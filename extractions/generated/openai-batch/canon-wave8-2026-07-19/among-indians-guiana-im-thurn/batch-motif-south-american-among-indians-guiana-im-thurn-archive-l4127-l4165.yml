  summary: The passage discusses the visibility and beauty of flowers in Guiana. It
    argues that conspicuous masses of flowers may be missed in deep shade, but open
    spaces by rivers, streams, fallen trees, glades, and savannahs often reveal striking
    blooms. It also emphasizes the individual beauty of flowers, using a posoqueria
    shrub as an example of blossoms easily overlooked in forest shade.
