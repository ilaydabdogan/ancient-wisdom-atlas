  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: From a steep-sided hill above the forest, the roof of the forest appears as
    a level sea of tree-tops woven together by creepers.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some trees and creepers are seen with flowers, and orchids grow on sun-exposed
