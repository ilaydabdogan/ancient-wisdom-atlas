  summary: 'The passage gives a descriptive account of Guiana forest vegetation: buttressed
    mora trees, palms, creepers, epiphytes, sparse forest floor growth, the canopy
    viewed from above, and eta and troolie palm swamps characterized by mud, dark
    water, shade, and large palm leaves.'
  language: English
