  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Small palms occur in the described forest scene, including a tangled thicket
    of Geonoma palms and individual slender prickly Bactris palms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Looking upward, the observer sees epiphytes, branch forkings, a dark leaf-roof,
    hanging creepers, and epiphyte masses on creeper-ropes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The forest floor is often bare mud or covered only by dead leaves, fallen
