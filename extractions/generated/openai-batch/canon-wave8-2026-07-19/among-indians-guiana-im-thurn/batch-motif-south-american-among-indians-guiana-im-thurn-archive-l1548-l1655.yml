canonical_text:
  quote: ''
  summary: The passage recounts travel past Akramukra and Rappoo, reports a local
    claim about bamboo arrow-heads and an Indian story of a plant-stick that kills
    when pointed, then describes passage toward the Roopoonooni, hospitality at Apooterie
    where twins are born, tame animals in the settlement, seasonal river conditions,
    sandbank obstacles, and biting kaboori flies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rappoo cataracts are said to take their name from a bamboo growing on islands
    there, used by savannah Indians to make arrow-heads reputed to be poisonous like
    ourali-tipped arrows.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator tested a rappoo arrow on a fowl and saw no symptoms of poison;
    a nearby Indian said such an arrow is poisonous only when it enters far enough
    into the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Indian story says a plant grows somewhere whose stick is fatal to any living
    thing at which it is pointed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the story, an Indian woman attacked by a jaguar seizes a stick, points
    it at the animal, and the jaguar immediately falls dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The falls above the Roopoonooni junction near the Essequibo source are described
    as high, difficult, and an insuperable barrier to travellers attempting the higher
    Essequibo.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Apooterie, a Carib head man receives the party hospitably, and within an
    hour his wife gives birth to twins.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Apooterie settlement contains numerous tame animals, including parrots,
    macaws, trumpet-birds, troupials, monkeys, powis or curassow birds, and a sunbird.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The Roopoonooni is contrasted with the Essequibo: its water is opaque and
    yellowish-white, its banks are less luxuriantly wooded, and palms are prominent
    in the scenery.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage contrasts low-water conditions with the rainy season, when banks
    go under water, sand ridges lie deep below the surface, and trees rise directly
    from flood water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sandbanks delay canoe travel, sometimes forcing the party to drag canoes or
    dig channels with paddles.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Small black kaboori flies, also called pium, bite exposed flesh and wound
    the paddling Indians severely.
  category: action
  evidence_refs:
  - ev:10
