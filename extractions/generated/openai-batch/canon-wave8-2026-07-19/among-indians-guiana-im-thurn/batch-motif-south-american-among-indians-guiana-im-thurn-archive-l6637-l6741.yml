  summary: The passage clarifies tribal and group names used in British Guiana, distinguishing
    synonyms, autonyms, exonyms, hybrid labels, and groups beyond the border. It then
    defines the author's technical terms race, branch, tribe, and family chiefly by
    linguistic criteria, with one example comparing True Carib and Macusi words for
    fire.
