canonical_text:
  quote: ''
  summary: 'The passage describes resins and pigments used by Indians of Guiana: karamanni
    and twara as adhesive resins; hyawa-tree resin for lighting fires, torches, and
    scented oil; and several plant or mineral dyes used for body-painting, implement
    decoration, hammock staining, or rare line-and-dot markings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karamanni is used like pitch or glue for crevices in woodwork, boat-building,
    fixing arrowheads into shafts, and similar work.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A whip-saw whose handle had parted from the blade was repaired with karamanni
    strongly enough for the saw to work again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Macusis call a similar whitish resin twara; it is rarely used in place
    of karamanni.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: White resin from the hyawa-tree is inflammable and is collected for lighting
    fires, making torches in hollow sticks, and scenting oil used on bodies and hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The listed dyes for bodies and sometimes implements are red faroah, purple
    caraweera, blue-black lana, white felspathic clay, and a rare yellow vegetable
    dye.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Faroah is deep-red pulp around the seed of Bixa orellana, mixed with oil,
    stored in lumps or bamboo tubes, and applied by hand or with a stick; True Caribs
    also use it to stain hammocks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Caraweera is a purplish-red dye prepared by boiling plant leaves, bark, and
    twigs, settling the mixture, drying the purple sediment, and storing it in small
    palm-leaf baskets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lana is Genipa americana fruit juice used without further preparation to draw
    blue-black patterns or stain larger skin surfaces for about a week.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: White and yellow pigments are used rarely and sparingly, mainly in lines or
    dots, by some Savannah Indians.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The white pigment is semi-liquid felspathic clay from savannah pockets, dried
    in pierced and threaded lumps; the yellow dye is said to come from a tree used
    by a tribe beyond the Wapianas.
  category: object
  evidence_refs:
  - ev:8
