canonical_text:
  quote: ''
  summary: The passage describes Guiana Amerindian feather shoulder and neck ornaments,
    tooth and seed necklaces, and several musical instruments. It notes activity contexts
    for heron and powis feather collars, details the construction and value of peccary-tooth
    necklaces, records a Macusi objection to a necklace said to be True Carib-made,
    and describes drums, flutes, pan-pipes, trumpets, and a palm-fiber Aeolian harp
    made from animal, plant, and bone materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A macaw-feather shoulder ruff is described as stretched from shoulder to shoulder
    on a man's back, with feathers standing out from the body.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: White heron-feather collars are worn especially by men running foot races;
    black powis-feather collars are worn when dancing and sometimes when paddling
    in canoes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The most important necklace is made from many bush-hog or peccary upper canine
    teeth, sometimes over one hundred teeth, representing the spoils of about fifty
    animals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peccary teeth are filed, set closely into a fiber-woven cord, kept white,
    and sometimes removed and reset for cleaning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Macusi man refused to wear a necklace because he believed it had been made
