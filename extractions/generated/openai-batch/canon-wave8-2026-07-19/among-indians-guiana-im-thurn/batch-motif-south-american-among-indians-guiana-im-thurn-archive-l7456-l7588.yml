canonical_text:
  quote: ''
  summary: The passage lists several Arawak family or clan names and proposed meanings,
    many derived from trees, animals, places, spirits, or transformation traditions.
    It notes a legendary lawful intermarriage between the Demarena and Karobahana
    families and compares this to regulated clan marriage among the Iroquois. It also
    reports traditions involving a transformed ancestress and a plant transformed
    into a rapid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haiawafona is explained as meaning from the hyawa tree, a resin-producing
    tree used for kindling fire, torches, and scented body oils.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Demarena is interpreted by one explanation as from the water-mama or from
    certain spirits, described as legendary beings usually underground; the water-mama
    is said to live under river water and can stand for supernatural beings generally.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Demarena family is said to intermarry with the Karobahana family according
    to an old legend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author compares the Demarena-Karobahana intermarriage tradition to a reported
    Iroquois clan marriage rule in which members of a clan could marry only into certain
    other clans.
  category: other
  evidence_refs:
  - ev:3
