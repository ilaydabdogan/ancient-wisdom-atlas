canonical_text:
  quote: ''
  summary: 'The passage presents the author''s account of Guiana Indian animism: morality
    and religion are described as separate; humans are said to consist of body and
    spirit; death and sleep are treated as occasions when the spirit leaves the body;
    dreams are treated as real actions of the spirit; and appearances of the dead
    in dreams are used to explain belief in the continued activity of the dead person''s
    spirit.'
  language: English
  quote_policy: summarized
