canonical_text:
  quote: ''
  summary: The passage discusses whether Guiana peoples attribute authority to spirits
    or gods. It describes Arawak men making noise during a solar eclipse to separate
    the sun and moon, mentions a water-being named G@nicidu addressed during rain
    or flood, lists names taken by missionaries as names for a supreme being, and
    argues that these more likely refer to ancestral founders or remembered dead rather
    than gods.
