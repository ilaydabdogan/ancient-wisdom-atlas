canonical_text:
  quote: ''
  summary: 'The passage describes the preparation of cassava bread: poisonous juice
    is pressed from cassava pulp in a woven matapie, the juice may be boiled into
    cassareep, the dried pulp is sifted and baked into cakes, and the cakes are sun-dried.
    It also notes residue cakes, tribal variations, scarcity substitutions, farine
    preparation, and the transformation of cassava bread into paiwari, a beverage
    used at drinking bouts, on returns from hunting, and when strangers arrive.'
  language: English
  quote_policy: summarized
