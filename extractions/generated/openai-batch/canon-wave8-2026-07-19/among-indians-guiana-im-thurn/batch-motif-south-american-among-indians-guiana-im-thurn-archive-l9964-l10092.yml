  summary: The passage describes several varieties of bird arrows used by Guiana Indigenous
    groups, then describes the distribution, equipment, preparation, and use of the
    blow-pipe and poisoned darts for bird hunting. It also notes how parrots may be
    located by the sound of fruit falling from feeding trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four varieties of unpoisoned arrows are described for bird hunting and are
    organized into two pairs.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: One savannah bird arrow has a long tapering wooden point with notches and
    is said to penetrate large birds; another has crosswise slips near the point to
    limit penetration in smaller birds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Arawak and True Carib bird arrows described in the second pair end in
    a large wooden knob and are intended to stun birds rather than pierce them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author reports the blow-pipe as chiefly associated in Guiana with savannah
    tribes, rare among forest tribes, and common among many other South American tribes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author suggests that Macusis, Arecunas, and other savannah Carib-family
    tribes probably adopted the blow-pipe from earlier inhabitants of the territory
    they occupied, while several coastal groups did not adopt it because they had
    little interior contact.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Blow-pipes are described as very long tubes, often twelve to sixteen feet
    or more, through which small darts are blown.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A blow-pipe hunter carries a tube, a quiver of ourali-tipped wooden darts,
    a perai-fish jawbone, and a small basket of cotton or other plant fibre, often
    including silk-cotton tree fibre.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before shooting, the dart point is twisted between teeth of the perai jawbone
    so that a small part of the point will break off in the animal, allowing the dart
    shaft to be reused; fibre is wound around the other end as feathering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dart is inserted into the blow-pipe, aimed, and blown; the passage states
    that birds almost invariably fall and gives a range of forty to fifty feet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Parrots feeding in fruit trees may be located by the sound of fruit falling
    like heavy raindrops, because they bite fruit once and let it fall.
  category: action
  evidence_refs:
  - ev:8
