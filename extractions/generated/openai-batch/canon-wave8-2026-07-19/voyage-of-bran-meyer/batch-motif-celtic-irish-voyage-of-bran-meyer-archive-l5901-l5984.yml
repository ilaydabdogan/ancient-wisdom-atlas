canonical_text:
  quote: ''
  summary: The passage introduces later didactic and romantic uses of the Happy Otherworld
    conception, then summarizes Baile an Scail. Conn the Hundred Fighter, at Tara
    with three druids, stands on the stone Fal, which screams prophetically. A mist
    and darkness surround the party, a horseman approaches and throws spears, then
    welcomes Conn and leads him to a beautiful plain with a rath, golden tree, and
    splendid house. Inside are a young woman identified as the sovereignty of Erin
    and the Scál, who identifies himself as Lug son of Ethlenn, come after death to
    reveal the succession of Tara’s sovereigns. The maiden gives Conn an ox rib and
    a hog rib.
