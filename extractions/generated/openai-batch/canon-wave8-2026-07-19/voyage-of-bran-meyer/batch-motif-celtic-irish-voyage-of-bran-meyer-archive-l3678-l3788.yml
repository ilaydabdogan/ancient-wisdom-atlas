  quote: ''
  summary: The passage surveys Irish heroic and post-heroic story cycles, linking
    figures such as Art, Ailill Olum, Tadg, Cormac, Finn, and Cairbre with battles,
    dynastic tales, and living folk-tale traditions. It then describes the Christian
    legendary period, the role of Patrick and earlier Christianity in Ireland, and
    the continuation of pre-Christian-style king stories among Christian rulers and
    chiefs.
  language: English
  quote_policy: summarized
