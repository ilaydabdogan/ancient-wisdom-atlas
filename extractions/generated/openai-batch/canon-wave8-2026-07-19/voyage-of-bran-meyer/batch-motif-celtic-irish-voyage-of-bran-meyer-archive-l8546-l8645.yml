canonical_text:
  quote: ''
  summary: The passage summarizes and critiques Rohde's account of Greek afterlife
    belief, contrasting Homeric Hades with an Elysian happy land accessible by divine
    favor and living translation rather than ordinary death. It then compares this
    Greek pattern with Irish heroic epics, where happy Elysium is associated with
    figures such as Bran, Connla, and Oisin rather than the greatest tragic heroes,
    and uses Cuchulinn as an example of a hero whose tragic death is not softened
    by fairy rescue.
  language: English
  quote_policy: summarized
