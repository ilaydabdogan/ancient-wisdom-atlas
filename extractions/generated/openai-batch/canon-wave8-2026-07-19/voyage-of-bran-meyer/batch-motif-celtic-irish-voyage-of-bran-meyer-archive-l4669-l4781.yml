canonical_text:
  quote: The hero is caught away to the fairy land of the living by the loving entreaty
    of Niam, daughter of its king.
  summary: 'The passage summarizes the Oisin narrative: Niam brings Oisin to the Land
    of Youth across the western waves; he remains there for three hundred years; when
    he wishes to return to Ireland, Niam warns him not to touch the ground or leave
    the horse, because he would become old, withered, and blind and could not return.
    The passage also discusses Oisin and Caoilte in Fenian and Ossianic tradition,
    Blai in doe shape, and contrasts the preceding Otherworld stories with the forthcoming
    Cuchulinn episode.'
  language: English
  quote_policy: quoted
