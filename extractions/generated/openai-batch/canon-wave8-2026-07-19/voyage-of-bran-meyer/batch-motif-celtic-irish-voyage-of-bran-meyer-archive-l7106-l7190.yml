canonical_text:
  quote: ''
  summary: The passage describes a radiant heavenly city with glass rails, precious
    stones, music, flaming lights, and angels; it characterizes the city as a kingdom
    free from moral, bodily, and meteorological defects. It then comments on parallels
    between Christian descriptions of the Beatific City and Irish Happy Otherworld
    or Elysium descriptions, especially absence of earthly imperfections, music, and
    a fiery enclosure. A following excerpt from the Tidings of Doomsday distinguishes
    four moral groups of humanity and describes heaven as eternal light, joy, health,
    feasting, angelic company, and ranked golden, glass, and silver stations.
  language: English
