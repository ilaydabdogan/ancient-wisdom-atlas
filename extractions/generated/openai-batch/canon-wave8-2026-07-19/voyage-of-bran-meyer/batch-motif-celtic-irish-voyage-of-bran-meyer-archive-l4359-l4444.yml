  quote: ''
  summary: A scholarly passage discusses the dating and transmission of Bran's Voyage
    and the stories of Mongan. It cautions against relying too much on apparent historical
    precision, links Mongan with Arthur and Finn, notes parallels between Arthurian
    and Fenian material, argues from Latin loan words and Christian allusions for
    a likely eighth-century form of the tale, and identifies the Happy Otherworld
    and Rebirth as leading conceptions shared with other Irish romantic narratives.
  language: English
