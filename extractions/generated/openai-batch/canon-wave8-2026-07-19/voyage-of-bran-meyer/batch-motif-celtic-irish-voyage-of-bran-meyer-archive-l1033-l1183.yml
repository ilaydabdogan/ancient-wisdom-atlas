canonical_text:
  quote: ''
  summary: The passage gives prophetic verses about a hero taught by Moninnan son
    of Ler, his death, and his conveyance by a white host to a sorrowless gathering,
    then turns to Bran’s voyage. Bran and his company encounter the Island of Joy,
    where one companion joins laughing inhabitants and is left behind. They reach
    the Land of Women, where the women’s leader draws Bran’s coracle ashore with a
    ball of thread, hosts them in a house with abundant food and many beds, and time
    passes differently. Homesick companions persuade Bran to return to Ireland despite
    warning not to touch land. At Srub Brain, Irish people know only the ancient story
    of Bran’s voyage. A man who steps from the coracle onto Irish soil becomes a heap
    of ashes.
  language: English
  quote_policy: summarized
