canonical_text:
  quote: ''
  summary: The passage first gives source-critical comments on an Oxford manuscript
    version and on Irish Otherworld beings being used in prophecy and Christianized
    as sons of Adam. It then introduces The Adventures of Cormac in Faery as a tale
    about Tuatha De Danann and mortals. Cormac Mac Airt meets an aged grey-haired
    knight at Tara on a May morning. The stranger carries a silver branch with three
    golden apples whose music can lull the wounded, women in labour, and the sick
    to sleep. The stranger says he comes from a land of truth without age, sin, sorrow,
    care, envy, jealousy, hatred, or pride. Cormac asks for the branch, and the stranger
    grants it in exchange for three future wishes. Over three returns, the stranger
    takes Cormac's daughter, son, and wife. Cormac uses the branch to soothe grief.
    When he pursues the stranger after his wife is claimed, mist separates him from
    his men, and he finds himself alone on a great plain. After seeing marvels, he
    reaches a stately palace, meets a noble husband and a golden-haired wife, and
    is bathed although no bather is visible.
  language: English
  quote_policy: summarized
