canonical_text:
  quote: ''
  summary: In an Irish prose passage concerning Mongán, Dubh-Lacha, the king of Leinster,
    Mac an Daim, and Cuimne of the mill, Mongán refuses to recover the woman by battle
    and instead undertakes a plan of cunning. He and Mac an Daim encounter an old
    mill-woman with a dog. Mongán uses a druidic wand and magical alteration to transform
    the dog and to present Cuimne in the appearance of a young woman with fine apparel,
    horses, and a rich saddle. The party enters the Leinster fort under reported identities
    as Connacht and Munster nobility seeking protection. Mongán induces the king of
    Leinster to desire the transformed woman, and the king sends her a valuable cup
    despite his household’s objection.
  language: Irish
  quote_policy: summarized
