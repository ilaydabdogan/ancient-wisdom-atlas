  text: Maelduin and his companions reach a large island with a grassy tableland,
    a strong fortress near the sea, and an adorned house with couches.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seventeen grown-up girls prepare a bath, and a richly dressed dame arrives,
    enters the fortress, and bathes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seafarers are invited inside, bathe, receive food and drink, and at night
    form eighteen couples, with Maelduin sleeping with the queen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The queen urges the visitors to stay, promising that age will not fall on
    them, that they will have lasting life, and that the night’s experience will recur
    every night without labor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
