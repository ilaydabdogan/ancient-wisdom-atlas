canonical_text:
  quote: ''
  summary: The passage summarizes episodes from Maelduin’s voyage involving visits
    to marvelous islands inhabited by women or maidens. One island has a fortress,
    bath, queen, seventeen daughters, food, drink, sexual pairing, an offer of ageless
    lasting life, and an attempted escape stopped by a clew. Two related adventures
    describe islands with precious fences, desired food and drink, sleep, disappearance
    of the island, a brazen door, glass bridge, water-bearing woman, music that induces
    sleep, and a beautiful lady who knows the visitors’ names. The commentary identifies
    these as variants of a damsel-land episode and compares the pattern to Bran’s
    Voyage.
  language: English
  quote_policy: summarized
