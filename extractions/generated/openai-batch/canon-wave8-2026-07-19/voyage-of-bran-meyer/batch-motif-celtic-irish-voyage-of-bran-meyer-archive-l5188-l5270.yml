  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Maelduin and his men remain three months, which seems to them like three years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the men try to leave while the queen is judging, she rides after them
