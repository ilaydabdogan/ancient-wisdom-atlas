canonical_text:
  quote: ''
  summary: 'The passage summarizes Cormac in Manannan''s realm: true tales cook a
    magical swine, other true tales describe inexhaustible corn, milk, wool, and Cormac''s
    carried-off family; the host tests a golden goblet that breaks for lies and is
    restored by truths, reveals himself as Manannan, gives Cormac his family, a goblet,
    and a silver branch, and Cormac wakes back at Tara. The commentary then treats
    these marvels as archaic abundance elements resembling a land of Cockayne and
    transitions to Happy Otherworld material in the Ossianic cycle.'
  language: English
  quote_policy: summarized
