canonical_text:
  quote: ''
  summary: 'A comparative discussion of Bran and Maelduin focuses on a mysterious
    island episode in which visitors imitate inhabitants. The passage summarizes three
    Maelduin island episodes: a rich fort guarded by a cat that burns a thief, an
    island of wailing that absorbs visitors, and an island of laughter where a companion
    is left behind. The author argues that Bran and Maelduin need not have a direct
    literary relation and instead may draw on common story-material.'
  language: English
