canonical_text:
  quote: ''
  summary: The passage introduces parallel mythic tales of the happy Otherworld and
    summarizes Echtra Condla, in which Connla, son of Cond, is approached by an Otherworld
    damsel, receives an invitation to a deathless land, is temporarily restrained
    by druidic chants, lives for a month on an undiminished apple, and finally departs
    in the damsel's glass ship across the sea, never to be seen again. The passage
    also frames Connla as the closest parallel to Bran's Voyage and comments on manuscript
    juxtaposition and legendary context.
  language: English
  quote_policy: summarized
