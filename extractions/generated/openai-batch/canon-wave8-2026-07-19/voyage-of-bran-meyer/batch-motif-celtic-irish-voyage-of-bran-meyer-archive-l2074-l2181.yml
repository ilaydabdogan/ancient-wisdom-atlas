canonical_text:
  quote: ''
  summary: Mongan and Mac an Daimh travel, encounter Tibraide the priest with Gospel
    books and clerics, and Mongan creates a river and bridge to divert him. Mongan
    then assumes Tibraide's form, makes Mac an Daimh appear as a cleric, gains welcome
    from the King of Leinster, enters the fort where Dubh-Lacha is, and meets her
    privately. A hidden old woman witness is killed through Mongan's magic. When the
    real Tibraide arrives with clerics, Mongan's impersonation causes confusion and
    the clerics are killed or wounded. The King of Leinster later learns that Mongan,
    not Tibraide, was present; Mongan returns home and becomes ill for a time.
  language: Irish
  quote_policy: summarized
