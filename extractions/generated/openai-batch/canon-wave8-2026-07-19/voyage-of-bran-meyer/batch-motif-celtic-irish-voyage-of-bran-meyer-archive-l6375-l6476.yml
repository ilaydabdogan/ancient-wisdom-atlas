canonical_text:
  quote: ''
  summary: 'The passage summarizes a Fenian tale in which a giant woman from a western
    Land of Women seeks Finn''s protection but is killed by her husband, who escapes
    in a western galley. The narrator comments on giant dwellers in a Western Marvel
    Land and the Happy Otherworld in Fenian romance. The passage then introduces the
    Adventures of Teigue son of Cian: Cathmann raids Munster and abducts Teigue''s
    kin and people; Teigue builds a currach, departs by sea to recover them, encounters
    marvel islands, loses his bearings, and arrives at a pleasant land where fragrant
    branches satisfy hunger and thirst.'
  language: English
  quote_policy: summarized
