canonical_text:
  quote: ''
  summary: 'A scholarly passage compares Greek, Irish, and Roman accounts of the Happy
    Otherworld. It cautions that close Greek-Irish parallels do not by themselves
    prove direct relation, then surveys Roman and classical examples: Sertorius and
    St. Brendan’s isle as an analogy; Horace’s western happy fields and rich isles;
    Claudian’s solar garden; Virgil’s Orphic-Pythagorean underworld descent, golden-age
    child, Elysium of the blessed, and doctrine of purified souls returning after
    Lethe.'
  language: English
  quote_policy: summarized
