  summary: A comparative scholarly passage argues that Irish, Greek, and Norse heroic
    traditions can contain divergent accounts of the afterlife side by side. It notes
    Irish translated heroes and Menelaus-like Greek figures as lacking cult or influence
    on mortal affairs, discusses a Christianized Cuchulinn addition, presents the
    Helge and Sigrun barrow episode as a Norse parallel, and turns to Greek Elysium,
    Hesperides, and Hesiod's golden age as evidence for blessed otherworld motifs.
