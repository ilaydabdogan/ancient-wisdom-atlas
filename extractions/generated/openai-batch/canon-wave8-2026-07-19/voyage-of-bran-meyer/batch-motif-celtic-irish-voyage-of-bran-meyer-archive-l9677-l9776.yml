candidate_motifs:
- id: motif:1
  label: remote otherworld encounter with a supernatural beloved
  taxonomy_refs:
  - divine_beloved
  basis: Helge meets Ingeborg in a far northern forest, stays with her, later spends
    happy days in Gudmund's realm, and is blinded by her before his forced departure.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage identifies Ingeborg as a maiden and Helge's love, but does
    not explicitly call her divine.
- id: motif:2
  label: journey beyond ordinary world into darkness and Chaos
  taxonomy_refs:
  - afterlife_journey_map
