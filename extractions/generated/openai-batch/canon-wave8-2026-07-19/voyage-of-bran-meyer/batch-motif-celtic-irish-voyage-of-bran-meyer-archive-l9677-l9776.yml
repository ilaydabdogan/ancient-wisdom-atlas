canonical_text:
  quote: ''
  summary: The passage recounts Helge's encounter with Ingeborg and Gudmund's realm,
    his supernatural abductions and return blind, followed by the story of King Gorm
    and Thorkill's dangerous voyage to Geirrod's and Gudmund's lands, where warnings
    against speech, food, sexual contact, garden entry, and treasure-taking are repeatedly
    tested, with madness, death, and partial return as consequences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Helge travels to the far north on the coast of Finmark, becomes lost in a
    great forest, and meets twelve red-clad maidens on horseback with gold-like horse-trappings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ingeborg is named as chief of the maidens and as daughter of Gudmund of the
    Glittering Plains.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Helge stays three days with Ingeborg and receives two chests full of gold
    and silver when they part.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the next Yule night after Helge's return, a storm occurs and two men carry
    Helge away to an unknown place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A year later at Yule, Helge returns with two strangers bearing two gold-plated
    horns as gifts from Gudmund to King Olaf Tryggvason.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Olaf fills the horns with drink and has his bishop bless them, Gudmund's
    messengers cast the horns away; noise and confusion follow, the fire is extinguished,
    and Helge and his companions disappear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After another year, Helge is brought back to the king blind; he had spent
    happy days in Gudmund's realm, and Olaf's prayers had forced his host and love
    to let him depart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ingeborg blinds Helge before his departure so that Norway's daughters will
    not fall in love with his eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: King Gorm hears of a mysterious land owned by King Geirrod containing many
    riches and resolves to seek it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gorm is told that he must sail across the ocean, leave the sun and stars behind,
    journey down into Chaos, and pass into a land without light.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Gorm sets out in three ships with Thorkill as guide.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After hunger, the travellers reach a land full of herds; sailors kill more
    beasts than needed despite Thorkill's injunctions, and Gorm gives three men chosen
    by lot to appease giant inhabitants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Geirrod's land, Gudmund, the king's brother, greets the travellers, and
    Thorkill forbids his companions to speak.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The travellers pass a river crossed by a bridge of gold, but Thorkill denies
    them access to the bridge.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: At Gudmund's hall, Thorkill warns the travellers not to eat, drink, touch
    the hosts, servants, or cups, or otherwise have contact with them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Gudmund has twelve sons and twelve daughters and offers his daughters and
    household women to the guests; four travellers accept and lose their wits.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Gudmund praises the delights of his garden, but Gorm refuses the invitation
    to enter because Thorkill warns him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The travellers cross the river to Geirrod's land and enter a gloomy cavern
    of horrors, where Geirrod and his daughter suffer punishment inflicted by Thor.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:19
  text: Treasures in the cavern include gold-hooped butts, a gold-tipped tusk, a gem-decked
    stag horn, and a heavy bracelet; when seized, the treasures turn into serpents
    and swords and avenge themselves.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: In another chamber, Thorkill seizes a royal mantle, a handsome hat, and a
    crafted belt; the cavern shakes, its inmates attack, and all but twenty travellers
    are torn to pieces.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: Broder and Buchi, two archers, enable the twenty survivors to escape.
  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: The survivors are ferried back across the river by Gudmund and entertained
    again.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:23
  text: Buchi embraces one of Gudmund's daughters, loses his recollection, and is
    later destroyed in violent river eddies when his carriage wheels sink while fording
    the river.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:24
  text: Only after further peril and suffering do Gorm, Thorkill, and a few of their
    men reach their own country again.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:25
  text: A note in the passage states that certain episodes are greatly similar to
    analogous episodes in the Odyssey and that possible direct literary influence
    should be borne in mind.
  category: other
  evidence_refs:
  - ev:14
