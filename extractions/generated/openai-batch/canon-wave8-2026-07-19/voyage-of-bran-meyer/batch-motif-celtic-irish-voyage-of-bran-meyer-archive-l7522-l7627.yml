canonical_text:
  quote: ''
  summary: The passage argues that Irish Otherworld legends were not wholly derived
    from Christian writings, though they were repeatedly Christianized. It compares
    Irish happy Otherworld material with Arthurian Avalon/Glastonbury descriptions,
    including the isle de Voirre, Geoffrey's Insula Pomorum, and Pseudo-Gildas's ocean-girt
    paradise. It notes parallels with Manannan's land and with healing-woman episodes
    involving Arthur and Cuchulinn, while leaving the historical explanation of Brythonic-Gaelic
    kinship uncertain.
  language: English
  quote_policy: summarized
