canonical_text:
  quote: ''
  summary: Mongan returns with white cattle. The king of Leinster comes to seek Dubh-Lacha,
    and Mongan permits him to take her after Dubh-Lacha invokes honour. Dubh-Lacha
    secures a one-year condition preventing shared lodging or intimacy. Mongan becomes
    ill, and Mac an Daimh complains that his own wife, Dubh-Lacha's foster-sister
    and attendant, has also gone into Leinster. Mongan devises a stratagem involving
    a cave, a basket, and sods from Ireland and Scotland to mislead the king's wizards.
    They travel to Leinster, encounter Tibraide the priest with gospels and a clerical
    attendant, and Mongan magically creates a river and bridge. The bridge collapses,
    the gospels are sent downriver, and Mongan begins a disguise by taking Tibraide's
    shape and giving Mac an Daimh the cleric's shape.
  language: English
  quote_policy: summarized
