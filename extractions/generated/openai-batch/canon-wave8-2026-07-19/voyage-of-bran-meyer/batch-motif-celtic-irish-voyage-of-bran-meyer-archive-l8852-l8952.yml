canonical_text:
  quote: ''
  summary: The passage surveys Greek accounts of a happy Otherworld or afterlife,
    especially in Pindar, Sophocles, the Pseudo-Platonic Axiochus, and Platonic references
    to Orphic and mystery traditions. It describes Elysium, the Isles of the Blest,
    Hyperborean felicity, Zeus' garden, the abodes of the just, and underworld destinies
    conditioned by righteousness, initiation, and purification. The author also compares
    Pindar's material Otherworld imagery with Manannan's isle or Midir's sid.
  language: English
  quote_policy: summarized
