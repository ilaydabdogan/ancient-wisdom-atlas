  quote: ''
  summary: The passage compares Irish, Scandinavian, Greek, and Iranian accounts of
    a Happy Otherworld or land of delights. It describes guarded objects such as Heimdall's
    horn, punishments for mortals who steal or awaken sleepers too soon, Mimer's later
    transformation into Gudmund, differences between Irish and Scandinavian Otherworld
    geography and food or love taboos, and introduces Yima in Iranian mythology as
    a first man and guide of humanity entrusted by Ahura Mazda with care for humankind.
  language: English
  quote_policy: summarized
