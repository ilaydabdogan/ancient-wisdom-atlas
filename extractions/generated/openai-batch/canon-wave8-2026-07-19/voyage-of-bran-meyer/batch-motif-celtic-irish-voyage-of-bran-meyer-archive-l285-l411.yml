literal_observations:
- id: obs:1
  text: The passage lists Irish grammatical categories and examples, including present
    subjunctive, s-future, b-future, verbal nouns, and passive forms.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author notes an old syntactic usage involving adjective and substantive
    attributes placed before the noun, and discusses dissyllabic word usage while
    warning that this usage alone is not proof of great antiquity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that the forms previously listed are taken almost exclusively
    from poetry, while the prose preserves many old-Irish forms but also contains
    much of middle-Irish origin, especially in verbal forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage gives examples of later verbal phenomena, including preterites
    without the particle ro and j-preterites, and says that all manuscripts contain
    such Middle-Irish forms.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author concludes that The Voyage of Bran was originally written down in
    the seventh century; that a tenth-century copy left the poetry almost intact but
    partially modernized the prose; and that all surviving manuscripts derive from
    that tenth-century copy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that the loanwords occurring in the tale are all of Latin
    origin and divides them into an older group from Irish contact with Roman civilization
    before Christianity and a later group associated with Christianity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists older Latin-origin examples such as aball, arggat, drauc,
