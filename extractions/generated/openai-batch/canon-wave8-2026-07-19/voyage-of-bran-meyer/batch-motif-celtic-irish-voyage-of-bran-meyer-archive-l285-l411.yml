  summary: This introduction passage gives philological notes on grammatical forms
    in The Voyage of Bran, distinguishes older poetic language from partially modernized
    prose, argues for a seventh-century original and a tenth-century copy behind the
    manuscripts, lists Latin-origin loanwords in two chronological groups, and closes
    with acknowledgments.
  language: English
