canonical_text:
  quote: ''
  summary: A woman’s song describes sea-crossing hosts, deathless lands, women, music,
    western islands, a prophesied sacred birth, purification by water, and wisdom
    addressed to Bran. She urges Bran to voyage over the sea to the Land of Women.
    The woman then departs with her branch, which springs from Bran’s hand back to
    hers. Bran sails the next morning with three companies of nine and, after two
    days and nights, meets Manannan son of Ler in a chariot over the sea. Manannan
    says that Bran sees sea where he sees a flowery plain, and he foretells Mongan
    son of Fiachna.
  language: English with embedded Old Irish notes
  quote_policy: summarized
