canonical_text:
  quote: ''
  summary: Teigue and his company move through a wondrous landscape to three hills
    crowned with forts. At the first fort a beautiful white-bodied lady greets Teigue,
    promises provision, and identifies the fort and land. At the golden second fort,
    Cesair greets him, says his journey was foretold, explains her identity and the
    paradisal land, and describes its righteous inhabitants. The company then proceeds
    toward a third hill with a beautiful seat and a youthful golden-haired couple.
  language: English
