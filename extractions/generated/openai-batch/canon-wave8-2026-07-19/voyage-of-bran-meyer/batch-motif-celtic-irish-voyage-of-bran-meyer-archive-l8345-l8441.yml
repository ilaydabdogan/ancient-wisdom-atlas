canonical_text:
  quote: No snow is there, nor yet great storm, nor any rain
  summary: 'The passage surveys Homeric and related Greek images of a happy otherworld:
    Menelaus is prophesied to be conveyed by the gods to the Elysian plain at the
    world''s end because of his connection with Helen; other remote fertile lands
    such as Syria, Phoeacia, and Calypso''s isle are described as unusually blessed;
    goddesses are shown desiring mortal lovers and offering freedom from death and
    age; and Olympus is described as a divine mountain realm free from bad weather.
    The passage also explicitly compares Greek motifs with Irish accounts of immortal
    women, Manannan, the sid, and the Tuatha De Danann.'
  language: English
  quote_policy: quoted
