canonical_text:
  quote: ''
  summary: The passage recounts the births of Mongán, Mac an Daimh, and Dubh-Lacha;
    Manannán’s taking of Mongán to Tír Tairngire for fosterage; Fiachna Dubh’s killing
    of Fiachna Find and seizure of Ulster; Mongán’s return, vengeance, and kingship;
    and a later episode in which Mongán obtains wondrous cattle from the king of Leinster
    in exchange for Dubh-Lacha, who negotiates delayed and restricted contact with
    the Leinster king.
  language: Irish
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fiachna Find returns to Ireland, finds his wife pregnant, and she bears a
    son named Mongán; the wife of Fiachna’s servant Damli bears a son the same night,
    named Mac an Daimh, and the two boys are baptized together.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fiachna Dubh mac Demáin has a daughter born on the same night; she is named
    Dubh-Lacha Lámhgel and is placed in connection with Mongán as his intended spouse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After three nights, Manannán comes for Mongán, takes him to be reared in Tír
    Tairngire, and gives an undertaking that Mongán will not return to Ireland until
    a fixed term has passed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fiachna Dubh attacks Fiachna Find, burns and destroys his fort or encampment,
    kills Fiachna Find, and takes the kingship of Ulster.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ulstermen seek Mongán’s return; after his return, Ulster nobles arrange
    peace by granting Mongán half of Ulster and Dubh-Lacha as wife and queen in compensation
    for his father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: While Mongán and Dubh-Lacha are playing fidchell, a dark little cleric appears
    at the doorway and urges Mongán to avenge his father on Fiachna Dubh by burning
    the fort and killing him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mongán goes with the cleric; Fiachna Dubh is killed, Mongán takes the kingship
    of Ulster, and the cleric is identified as Manannán.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mongán travels among the provinces and reaches Leinster, where King Brandubh
    mac Echach receives him and feasts with him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mongán sees a herd described as one hundred and fifty white, red-eared cows,
    each with a white calf at its foot, and he desires them greatly.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The king of Leinster says Dubh-Lacha would be a fitting exchange for the cattle,
