  quote: ''
  summary: The passage discusses Irish Christian and non-Christian afterlife conceptions,
    including a fourfold division of the dead, a Happy Otherworld or Elysium, Elijah
    in Paradise beneath the tree of life, the island of Enoch and Elijah in the Voyage
    of Snegdus and Mac Riagla, a distinct Christian heaven, and the terms tir tairngiri
    and tir innambeo as overlapping designations of a promised or living land.
  language: English
  quote_policy: summarized
