canonical_text:
  quote: ''
  summary: The passage compares Irish and Scandinavian Otherworld conceptions, discusses
    possible but unproven Scandinavian influence on Irish voyage episodes, and summarizes
    Viktor Rydberg's theory of Odainsakr as a deathless refuge preserving a human
    pair for a renewed world after the final catastrophe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, in Irish material, the wonderland is associated with
    the kin of the gods and may be assigned to Manannan, Lug, Midir, or Angus depending
    on type.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, in Scandinavian material, the comparable realm is
    associated with beings alien from, and in the Tartarus element hostile to, the
    god clan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts Ireland as lacking a Tartarus counterpart to Elysium
    with Scandinavia, where Gudmund's Elysian realm is connected with Geirrod's Tartarus
    realm.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author argues that fundamental differences bar deriving the twelfth- to
    fourteenth-century Scandinavian account from eighth- to eleventh-century Irish
    accounts, or deriving Bran and the Wooing of Etain from the Scandinavian system.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author considers possible sporadic influence of Norse Otherworld journey
    material on Irish romance, especially certain episodes in Maelduin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: One Maelduin episode mentioned is a visit to a deserted island-palace guarded
    by a silent cat that punishes theft committed by an intruder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another Maelduin episode mentioned involves Isles of Imitation where two companions
    are left behind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author states that the Maelduin story has a loose texture, making interpolations
    or contamination difficult to distinguish.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that no definite argument supports the Scandinavian-influence
    hypothesis except that theft and abandonment episodes form a logical sequence
    in the Thorkill-Gudmund saga but are disconnected in Irish stories.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note states that possible influence from the Odyssey could also account
    for the Maelduin episode.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage identifies Viktor Rydberg as practically the only scholar to have
    investigated Odainsakr's relation to the wider Scandinavian mythological system,
    while cautioning about his reconstructions.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Rydberg's theory, as summarized, presents the Volospa as describing creation,
    human creation, divine strife, resulting ills, and the final disappearance of
    the present order to make way for a better world.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage states that the survival of part of the kin of the gods is provided
    for, and that a human pair, Lif and Leifthraser, is secluded before corruption
    in a deathless land.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The passage identifies Odainsakr as the acre of the not dead and the earth
    of living men, guarded by the seven sons of Mimer.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:15
  text: The seven sons of Mimer are described as giant smiths who made primeval weapons
    and ornaments and who sleep until the Dusk of the gods, when they awaken for the
    final conflict.
  category: sequence
  evidence_refs:
  - ev:13
