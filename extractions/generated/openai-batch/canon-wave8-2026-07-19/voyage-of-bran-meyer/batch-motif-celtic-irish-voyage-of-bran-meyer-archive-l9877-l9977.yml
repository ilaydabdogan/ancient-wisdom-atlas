comparison_claims:
- id: claim:1
  claim: 'Irish and Scandinavian materials are compared as Otherworld systems, but
    the passage emphasizes structural differences: Irish wonderland is tied to gods''
    kin and lacks a Tartarus counterpart, while the Scandinavian system links Elysium
    with Tartarus.'
  claim_level: same_motif
  target: Irish gods' land in Bran/Wooing of Etain and Scandinavian Gudmund-Geirrod
    Otherworld
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  limitations: The passage uses the comparison mainly to stress difference, not direct
    equivalence or dependence.
- id: claim:2
  claim: The author rejects the theory that the later recorded Scandinavian account
    depends on the earlier Irish account, and also rejects deriving Bran or the Wooing
    of Etain from the Scandinavian mythological system.
  claim_level: historical_contact
  target: Irish Otherworld accounts and Scandinavian Otherworld accounts
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author's argued conclusion within the passage, not an independent
    demonstration supplied by the extraction.
- id: claim:3
  claim: The passage allows a possible but unproven late ninth- or tenth-century Scandinavian
    influence on some Irish Otherworld voyage episodes, especially in Maelduin and
    possibly Bran's Isle of Joy episode.
  claim_level: historical_contact
  target: Norse Journey to the Otherworld influencing Irish voyage romance episodes
  evidence_refs:
  - ev:4
  - ev:8
  counter_evidence_refs:
  - ev:7
  - ev:8
  confidence: low
  limitations: The author explicitly states that there is no definite argument in
    favor beyond narrative sequencing.
- id: claim:4
  claim: The theft of Otherworld treasures followed by punishment is presented as
    a comparable episode in the Thorkill-Gudmund saga and in Irish stories such as
    Maelduin, though structurally integrated in the Norse saga and disconnected in
    the Irish stories.
  claim_level: same_motif
  target: Maelduin island-palace theft episode and Thorkill-Gudmund saga
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs:
  - ev:8
