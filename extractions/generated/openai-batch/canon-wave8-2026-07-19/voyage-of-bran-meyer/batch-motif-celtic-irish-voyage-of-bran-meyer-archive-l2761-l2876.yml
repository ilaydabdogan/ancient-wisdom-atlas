  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mongan puts a love-charm into Cuimne's cheeks, and after looking at her the
    king of Leinster becomes filled with love for her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king sends an attendant with a message declaring his love and saying that
    a king is better than a king's heir; Mongan understands the whispered message
    and instructs Cuimne how to answer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cuimne asks for gifts and receives the king's drinking-horn; Mac an Daimh
