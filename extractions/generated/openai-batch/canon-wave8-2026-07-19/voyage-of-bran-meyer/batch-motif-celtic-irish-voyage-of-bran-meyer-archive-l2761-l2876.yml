canonical_text:
  quote: ''
  summary: Mongan and Mac an Daimh go to the king of Leinster's house during preparations
    for Dubh-Lacha's marriage. Mongan chooses disguises by transforming Cuimne of
    the mill, her dog, a mare, and their own appearances. Under these assumed identities
    they enter the king's fortress. Mongan uses a love-charm so the king desires the
    transformed Cuimne, then instructs her to ask for treasures, including a horn
    and a protective girdle, which Mac an Daimh takes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mongan and Mac an Daimh set out to the king of Leinster's house while a feast
    is being prepared for the marriage of Dubh-Lacha, whom the king has vowed to marry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the green outside, Mac an Daimh asks Mongan what shape they should take;
    they see Cuimne of the mill, her chain-dog Brothar, and a hack mare with an old
    packsaddle carrying corn and flour.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mongan tells Cuimne that he can put her into the shape of a young girl, and
    Cuimne agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: With a magic wand, Mongan changes the dog into a small white lapdog with a
    silver chain and gold bell, and changes Cuimne into a very beautiful young girl
    named Ibhell of the Shining Cheeks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mongan takes the shape of Aedh, son of the king of Connaught; Mac an Daimh
    is put into the shape of his attendant; a palfrey, saddle, and other steeds are
    also made from the available animals and equipment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Door-keepers announce the disguised party to the king of Leinster as Aed the
