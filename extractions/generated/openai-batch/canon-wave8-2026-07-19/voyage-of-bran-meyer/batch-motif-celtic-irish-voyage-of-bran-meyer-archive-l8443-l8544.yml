- id: obs:7
  text: Rohde's view, as summarized, is that after the body is burnt the Psyche goes
    to a remote place from which there is no return and has no power over the living.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The summary contrasts Homeric lack of ghost cult with post-Homeric cult of
