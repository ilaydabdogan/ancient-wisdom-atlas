  quote: ''
  summary: The passage surveys Greek epic and Hesiodic accounts of heroes or exceptional
    mortals transferred to Elysian or island otherworlds, then summarizes Rohde's
    view of Homeric afterlife belief as a no-return shadow-existence in Hades, contrasting
    it with post-Homeric hero cult and Hesiod's differentiated after-death statuses.
  language: English
  quote_policy: summarized
