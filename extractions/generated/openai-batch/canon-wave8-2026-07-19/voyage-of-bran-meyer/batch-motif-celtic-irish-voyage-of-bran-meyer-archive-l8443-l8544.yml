  text: The passage states that post-Homeric epics frequently describe heroes being
    transferred to an Elysian land, while Proteus' prophecy to Menelaus is named as
    the only definite Homeric instance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists Artemis carrying off Iphigenia, Zeus granting deathlessness
    to Memnon at Eos' request, Thetis carrying Achilles' body to Leuke, and Circe
    carrying Telegonus to Aeaea, where he lives undyingly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Hesiodic account summarized here, some heroes die around Thebes or
    in Troy, while Zeus grants others a dwelling at the world's end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The blessed heroes dwell by deep Ocean in the Isles of the Blessed, where
    Kronos reigns and the earth yields honey-sweet fruits three times yearly.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that the Odyssey supplies parallels to the salient traits
