canonical_text:
  quote: ''
  summary: 'The passage gives notes and a narrative in which Mongan sends a man on
    a staged journey through fairy knolls and named places to retrieve a stone and
    gold while receiving silver for himself. The man is welcomed by couples at the
    stages, uses a key to enter a marvellous chamber, obeys the restriction on what
    he may take, and returns to Mongan. The passage then introduces the occasion of
    Mongan''s Frenzy: Findtigernd asks Mongan for the truth of his adventures, he
    obtains a seven-year delay, a great gathering occurs at Usnech, a hailstorm creates
    twelve enduring streams, and Mongan leaves the cairn with companions and sees
    a prominent stronghold.'
  language: English
  quote_policy: summarized
