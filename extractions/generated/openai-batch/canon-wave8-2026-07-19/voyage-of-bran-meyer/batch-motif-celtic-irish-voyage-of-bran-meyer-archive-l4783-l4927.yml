canonical_text:
  quote: ''
  summary: 'The passage recounts Cuchulinn’s sick-bed episode: magical birds appear
    at Samhain, two linked birds induce sleep, and two women beat Cuchulinn in a vision
    or sleep-state. After a year of silence, a stranger and then Liban invite him
    toward the Plain of Delight, where Fann and Labraid dwell. Laeg scouts the otherworldly
    land by bronze boat and describes its shining trees, birds, palace, steeds, and
    ever-full mead. Cuchulinn later fights for Labraid, stays with Fann, and is confronted
    by Emer; Fann yields to Emer before Manannan appears to seek Fann.'
  language: English
  quote_policy: summarized
