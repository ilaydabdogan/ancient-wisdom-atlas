  summary: The passage opens a literary-historical investigation of Bran's voyage,
    situating early Irish literature within annalistic traditions. It describes the
    Pre-Milesian period as a sequence of immigrations or invasions ending with the
    sons of Mil dominating Ireland, notes Biblical and classical influence on those
    traditions, and says they have been understood as pre-Christian Irish mythology
    cast in pseudo-historical form. It then begins the Milesian and Heroic period,
    mentioning the foundation of Emania by the Amazon Macha.
