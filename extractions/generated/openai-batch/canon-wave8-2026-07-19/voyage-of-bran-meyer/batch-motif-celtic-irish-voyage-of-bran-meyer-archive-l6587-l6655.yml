  summary: The passage is secondary commentary on Irish voyage and vision literature.
    It praises a narrative for dreamlike natural magic, Irish literary learning, and
    Christian symbolic reshaping of older legend. It then contrasts the Vision of
    MacConglinne, described as a comic parody of Voyages to the Otherworld, in which
    Anier MacConglinne tells a vision of transport to Cockayne to cure Cathal of a
    demon-caused voracious appetite.
