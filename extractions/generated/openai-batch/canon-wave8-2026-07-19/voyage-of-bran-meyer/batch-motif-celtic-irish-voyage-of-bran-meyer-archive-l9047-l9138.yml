canonical_text:
  quote: ''
  summary: 'The passage first summarizes Greek literary accounts of the Hyperboreans,
    especially their association with Apollo, song, exemplary remoteness, and later
    localization in India. It then quotes Lucian''s True Story describing a fantastic
    voyage to the Isle of the Blessed: fragrant air, harbours, rivers, meadows, woods,
    rose fetters, Rhadamanthus as king, a jewel-like city, perpetual spring, fountains
    and rivers of water, honey, oil, milk, and wine, and banquets in the Elysian Field.
    The passage concludes with the author''s claim that Greek literature shaped late
    Jewish and Christian apocalyptic otherworld descriptions.'
  language: English
  quote_policy: summarized
