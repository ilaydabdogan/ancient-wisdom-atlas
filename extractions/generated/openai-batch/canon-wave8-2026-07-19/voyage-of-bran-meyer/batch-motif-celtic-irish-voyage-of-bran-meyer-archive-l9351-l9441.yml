canonical_text:
  quote: ''
  summary: The passage argues that Irish Otherworld legend is not adequately explained
    as borrowing from Christian or late classical literature. It compares Irish legend
    with earlier, Homeric Greek patterns, emphasizing shared features such as an island
    Elysium, a mountain home of gods, favoured mortals admitted by divine relationship
    or caprice, association with amorous goddesses, the mortal not dying, deathlessness,
    absence of ethical-philosophical doctrine, and simple sensuous delights. It contrasts
    this with post-Homeric Elysium, which is linked to death, hell, underground Tartarus,
    and an ethical cosmic scheme.
  language: English
  quote_policy: summarized
