canonical_text:
  quote: ''
  summary: The passage surveys the development of Irish Happy Otherworld traditions.
    It contrasts tales emphasizing warfare and death with oversea and under-wave Otherworld
    types marked by water, amorous Faery beings, supernatural lapse of time, and perilous
    return. It also describes the Tuatha De Danann as both historicized pre-Christian
    kings and immortal superhuman Otherworld beings, and notes later preservation
    and adaptation of these patterns in the Dinnshenchas, Cormac's Adventures, Oisin's
    Tir na n-Og, imrama literature, and later romances.
  language: English
  quote_policy: summarized
