  quote: ''
  summary: The passage summarizes Avestic and later Iranian accounts of Yima, death-free
    realms, Yima's catastrophe-preserving enclosure, altered time within the enclosure,
    Eran Vej as a paradisaical region, regeneration after world catastrophe, and the
    separate heaven of the righteous. It also records scholarly comparisons with Faery
    time-lapse traditions, Hesiodic golden age traditions, and Scandinavian Odainsakr.
