literal_observations:
- id: obs:1
  text: Yima accepts a charge to rule and watch over living beings and says that in
    his realm there will be neither cold wind nor hot wind, neither sickness nor death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahura Mazda gives Yima a golden seal and a gold-incrusted sword as tokens
    of empire, and Yima later enlarges the habitable earth three times for increasing
    human and animal life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahura Mazda warns Yima that an evil winter and hard killing frost will come
    upon the material world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yima is instructed to make an enclosure and to bring into it seed and selected
    cattle, humans, dogs, birds, fires, plants, and fruits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The enclosure is described as excluding certain crooked, hunchbacked, impotent,
    lawless, wicked, deceitful, envious, jealous, malformed, leprous, or demon-marked
    persons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Inside Yima's enclosure, the sight of stars, moon, and sun is lacking, and
    a year passes as a day.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Every forty years, offspring are born to each couple, human or animal, and
    men in Yima's enclosure lead the fairest of lives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The author states that Yima is associated with two death-free realms: Eran
    Vej at the beginning of human history and the enclosure preserving animal life
    during the killing frost.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Rain Yasht summary, Yima invokes Vajush, the heavenly breeze, for a
