    Yima's reign lacks heat, cold, old age, death, and demonic envy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Minokhird description of Eran Vej gives it long human and cattle lifespans,
    little suffering or disease, no lying or grief, no bodily rule by want, one loaf
    satisfying ten men, and childbirth every forty years.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Minokhird says that after the world's conflagration and the beginning
    of regeneration, the garden made by Yima opens its gates and men, animals, and
    plants fill the devastated world again.
  category: sequence
  evidence_refs:
  - ev:7
