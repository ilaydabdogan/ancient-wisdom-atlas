canonical_text:
  quote: ''
  summary: The passage gives a chronological and comparative scholarly synopsis of
    Indian, Greek, Persian, Jewish-Christian, Irish, and Scandinavian ideas of Elysium,
    heaven, hell, and the Happy Otherworld. It emphasizes developments from golden-age
    or divine-land ideals toward eschatological heaven and hell, notes Irish non-Christian
    Elysium texts without heaven or hell, and closes by contrasting the mainly eschatological
    non-Irish Aryan material with Greek and Irish forms in which Elysium can be detached
    from future-life doctrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents Vedic Yama's realm as a golden-age form of the Elysium
    ideal that later develops into a heaven form; it also states that post-Vedic India
    develops Yama's realm into a definite heaven sometimes associated with Yama and
    sometimes with Indra.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Greek entries describe a gods' land, realms to which mortals may be transported
    by special divine favor, a golden age, an Elysium for specially meritorious mortals
    after death, and a later coalescence of Elysium with the gods' land.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Persian/Avestic entry describes Yima's realm as a paradisaical golden
    age and Yima's grove as a cosmological Elysium where human and animal life is
    stored against a great natural catastrophe.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Hellenistic entry states that Greek thought influenced Jewish eschatology
    and that Greece had contact with Persia and India, producing Greek-Jewish eschatological
    literature in which previous elements mingled and developed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Irish timeline distinguishes earliest purely Christian eschatological
    texts from later Irish non-Christian Elysium texts, in which Elysium is a land
    accessible to mortals by divine favor and also the gods' land, with no trace of
    heaven or hell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that Christianity may have influenced the survival and
    presentation of northern and western European otherworld material, including a
    possible suppression of non-Christian Irish hell traditions, although the author
    says this explanation is unlikely.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage contrasts a well-developed Scandinavian hell, said to differ from
