canonical_text:
  quote: ''
  summary: The passage opens a chapter on non-Irish Christian and Jewish analogues
    of the Happy Otherworld. It recounts a Maelduin episode in which voyagers see
    a great bird renewed after eagles cleanse it and it washes in a lake, then identifies
    the episode as a reminiscence of the Phoenix story. It then introduces the Anglo-Saxon
    Christian Phoenix poem and quotes its description of the Phoenix's remote paradisiacal
    eastern land, a place without decay, harmful weather, old age, death, sin, sickness,
    or want, protected by God from flood and associated with final fire and judgment.
  language: English
  quote_policy: summarized
