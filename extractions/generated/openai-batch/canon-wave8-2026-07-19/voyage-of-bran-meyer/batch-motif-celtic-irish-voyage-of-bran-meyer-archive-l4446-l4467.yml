canonical_text:
  quote: ''
  summary: 'The passage summarizes the Happy Otherworld in Bran''s Voyage: mortals
    may be summoned there by an Otherworld damsel with sweet music and a magic apple-branch;
    the land is deathless, delightful, and made of western isles guarded by Manannan.
    Bran''s party reaches the Island of Joy and the Land of Women, where Bran is drawn
    ashore by a magic clew and kept for a seeming year. On return to Ireland, after
    a warning not to set foot on land, the voyagers discover centuries have passed;
    one who touches earth becomes ashes, and Bran recounts the adventure before disappearing
    again.'
