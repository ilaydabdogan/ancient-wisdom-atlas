  summary: The passage is a comparative discussion of early Irish accounts of the
    Happy Otherworld, especially erotic happiness, absence of judicial underworld
    hierarchy, and the lordship of the western wonderland. It compares these Irish
    features with Homeric and post-Homeric Greek Otherworld beliefs, Christian Heaven,
    and figures such as Manannan, Lug, and the Greek sun-god.
  language: English
