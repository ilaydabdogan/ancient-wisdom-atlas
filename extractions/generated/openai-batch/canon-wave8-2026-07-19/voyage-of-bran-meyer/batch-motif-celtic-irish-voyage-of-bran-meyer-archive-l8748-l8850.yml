canonical_text:
  quote: ''
  summary: 'The passage surveys Greek accounts of Elysium and the Happy Otherworld:
    Hesiodic golden-age beings become protective divine ministers after death; later
    Greek literature uses otherworld images for heaven and utopia; early mythical
    accounts locate Phoebus'' garden and the Hesperides at the bounds of ocean, with
    Atlas, golden apples, dragon, nectar, and undying food; the sun also has eastern
    associations; and the Leucadian white rock is linked with souls and death. A footnote
    briefly recounts a Celtic tale in which Young Manus is thrown from rocky precipices
    and later found playing on the shore.'
  language: English
  quote_policy: summarized
