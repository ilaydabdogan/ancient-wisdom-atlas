canonical_text:
  quote: ''
  summary: The passage preserves parts of two Mongán narratives in the notes. In the
    first, Mongán reassures his distressed wife that help is approaching, repeatedly
    locating the helper’s movement through named rivers and waters. At night a warrior
    arrives, leaps across the ramparts with a headless spear-shaft, and proves that
    Forgoll’s claim about Fothad Airgdech’s death is wrong. The warrior identifies
    the place of battle, burial, grave goods, stone pillar, and Ogam inscription;
    these are found as he says. The narrator identifies him as Cáilte, foster-son
    of Find, and adds that Mongán was Find, though he concealed it. In the second
    fragment, Mongán sees a poor bardic scholar in a sackcloth cloak, recites a stanza
    about completing studies, takes pity on him, and begins to test whether he will
    be a truthful messenger.
  language: English
  quote_policy: summarized
