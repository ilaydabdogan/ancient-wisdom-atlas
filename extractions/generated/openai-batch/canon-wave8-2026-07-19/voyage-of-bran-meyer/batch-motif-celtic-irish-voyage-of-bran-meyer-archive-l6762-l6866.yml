canonical_text:
  quote: ''
  summary: 'The passage surveys traditions about a burial-place of Irish kings and
    Tuatha De Danann rulers, then recounts several Otherworld-related narratives:
    Angus gains the Brugh from the Dagda through a night-and-day bargain; the Brugh
    contains undying abundance; domestic animals and gifts of civilisation are linked
    to the Otherworld; Falga is connected with the Land of Promise and Manannan; Sinend
    seeks Connla''s Well of wisdom under the sea and dies after being overwhelmed;
    Boand tests Nechtan''s Secret Well, is maimed by its waves, and flees with its
    waters toward the sea.'
  language: English
  quote_policy: summarized
