canonical_text:
  quote: ''
  summary: 'The passage first concludes an Irish-language episode involving Mongan,
    Dub-Lacha, Mac an Daimh, the king of Leinster, and a substitution involving a
    hag, a dog, and a horse. It then begins the English tale of Fiachna Finn: he travels
    from Ireland to Lochlann, where a sick king can only be helped by a red-eared
    shining-white cow belonging to the Black Hag. Because the hag will accept no replacement
    unless Fiachna stands security, he becomes bound to the bargain. A year later
    she comes to Ulster, saying the king of Lochlann has deceived her, and demands
    that Fiachna make war on him. Fiachna leads Ulster forces to Lochlann, where venomous
    sheep kill many warriors. Fiachna resolves to fight the sheep himself, and a richly
    dressed warlike stranger appears offering to keep the sheep away.'
  language: English with preceding Irish text
  quote_policy: summarized
