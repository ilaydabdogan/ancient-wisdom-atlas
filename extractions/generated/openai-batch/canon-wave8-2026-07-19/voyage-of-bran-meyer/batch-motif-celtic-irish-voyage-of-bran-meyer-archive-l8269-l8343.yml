  quote: ''
  summary: A scholarly discussion argues that Christian visions of Hell draw heavily
    from Greek, especially Orphic-Pythagorean, eschatological conceptions. It describes
    Greek Hell as gloomy, purificatory, and governed by punishments suited to crimes,
    with fire understood as lustral, while later Christian visions retain many features
    but treat fire chiefly as torture. The passage then considers how Greek, Christian,
    and Irish mythic materials may be compared, noting possible routes through Christian
    influence on Ireland, prehistoric shared beliefs, Hellenic-Celtic contact, or
    later classical influence.
