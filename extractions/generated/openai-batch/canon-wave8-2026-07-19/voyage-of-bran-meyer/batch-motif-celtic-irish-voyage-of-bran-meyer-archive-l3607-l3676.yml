  summary: 'The passage surveys Irish literary-historical cycles around the turn of
    the common era and after: Connaire Mor and his death in a named tale, the Ultonian
    cycle centered on Conchobor Mac Nessa and Cuchulinn, the survival of Ulster-hero
    stories in Gaelic popular tradition, the appearance of mythological figures as
    supernatural beings in quasi-historical cycles, the Boroma tribute cycle connected
    with Tuathal Techtmar, and Conn''s wars against Mog Nuadat.'
