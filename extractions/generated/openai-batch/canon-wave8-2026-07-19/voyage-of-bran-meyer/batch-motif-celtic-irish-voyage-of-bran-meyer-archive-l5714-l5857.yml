canonical_text:
  quote: ''
  summary: The passage summarizes the tale of Laegaire mac Crimthainn's visit to the
    fairy realm of Mag Mell. Fiachna mac Retach of the sid appears through mist to
    the men of Connaught and asks Laegaire for aid because his wife has been carried
    off by Goll son of Dolb. Laegaire and fifty men dive into the loch, fight through
    to the fort of Mag Mell, and recover the imprisoned woman. Laegaire remains in
    the sid for a year, is paired with Fiachna's daughter Sun-tear, returns briefly
    on horseback under an instruction not to dismount, refuses Crimthann's offer of
    earthly kingship, and re-enters the sid, where he rules jointly with Fiachna.
    The passage also includes scholarly comments comparing the warlike sid host to
    a Viking band and noting possible Viking-era influence in the horse-riding motif.
  language: English
  quote_policy: summarized
