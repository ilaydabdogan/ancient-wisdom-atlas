canonical_text:
  quote: ''
  summary: Teigue encounters Veniusa and Connla in a joyful otherworld dwelling sustained
    by an inexhaustible golden apple. He is shown a splendid mansion intended for
    righteous future kings, with an apple-tree that bears fruit and blossom together.
    Cleena Fair-head appears, identifies herself, gives the wanderers musical birds
    and an emerald cup that changes water into wine, and explains that what seemed
    one day was a year without hunger, thirst, or cold. The wanderers depart by boat;
    the birds comfort them, and the land is hidden behind a magic veil. A closing
    summary reports that Teigue and his men later rescue captives and slay ravishers.
  language: English
  quote_policy: summarized
