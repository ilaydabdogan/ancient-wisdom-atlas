canonical_text:
  quote: ''
  summary: The passage contrasts the Irish conception of a happy otherworld across
    water with another form located in the fairy mound or hollow hill, identifies
    the Tuatha De Danann as mound-dwelling superhuman beings, and summarizes part
    of The Wooing of Etain. In that tale Etain, formerly Mider's wife, is reborn as
    a mortal and marries Eochaid Airem; Mider wins her by gaming with Eochaid and
    sings of a wonderland of beauty, youth, drink, food, and hidden inhabitants. The
    passage then compares this Elysium with the otherworlds in Bran and Connla.
  language: English
  quote_policy: summarized
