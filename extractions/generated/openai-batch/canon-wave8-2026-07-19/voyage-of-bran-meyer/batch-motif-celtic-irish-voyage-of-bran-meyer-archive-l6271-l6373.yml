  summary: The passage gives and comments on two Irish dinnshenchas episodes, one
    about Clidna and one about Tuag Inbir. In both, a woman is placed asleep by supernatural
    or magical means, is connected with a boat journey or attempted boat journey,
    and is drowned or possibly abducted by a wave. The commentary links these episodes
    with the Happy Otherworld and with other Irish figures and traditions.
