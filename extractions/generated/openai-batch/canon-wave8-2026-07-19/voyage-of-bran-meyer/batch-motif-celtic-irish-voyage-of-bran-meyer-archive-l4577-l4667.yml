  quote: ''
  summary: The passage compares Echtra Condla and Imram Brain/Bran's Voyage, discussing
    variant explanations for Art's epithet, shared narrative handling, the fairy messenger,
    the Isle of Joy and Isle of Fair Women, invisibility of Otherworld beings, and
    a common Irish conception of the Happy Otherworld as a deathless place reached
    by selected mortals, associated with magic food and unsafe return. It also notes
    Oisin in the Land of Youth as a later close variant.
  language: English
