canonical_text:
  quote: ''
  summary: 'The passage first describes Mongan entering a marvellous house with ancient
    trees, bronze covering, seven men, rich furnishings, jewels, and wine; he and
    his wife experience what seems one night but is a full year, then awaken at Rathmore
    of Moy-Linny. The passage then gives an Irish note about Fiachna Find in Lochlann:
    the Lochlann king falls ill and requires a bright white red-eared cow; the Black
    Hag owns the only such cow and demands Fiachna as surety. After a broken promise,
    Fiachna leads forces against Lochlann, where deadly sheep kill many of his men.
    A richly dressed warrior identifies himself as Manannan mac Lir, bargains for
    Fiachna’s ring as a token to Fiachna’s wife, says a child will be begotten by
    him and named from Fiachna, takes Fiachna’s shape, and provides a hound that destroys
    the sheep. Fiachna gains rule over Lochlann, Saxons, and Britons.'
  language: English and Irish
  quote_policy: summarized
