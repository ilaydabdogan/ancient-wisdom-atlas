  quote: ''
  summary: The passage is a scholarly discussion of Bran's Voyage and the Mongan episode.
    It argues that literary transmission was damaged by Viking disruption, notes that
    Bran's Voyage contains Manannan's prophecy concerning Mongan, links those allusions
    to The Conception of Mongan and other Mongan stories, considers whether the Mongan
    episode is an interpolation into Bran's Otherworld voyage, and cites annalistic
    testimonia about Mongan's death and later rationalizing interpretations of his
    supernatural attributes.
  language: English
  quote_policy: summarized
