canonical_text:
  quote: ''
  summary: 'The passage recounts how Fiachna Lurga goes to aid Aedan in warfare, while
    a noble-looking visitor comes to Fiachna''s wife and says that union with him
    will produce Mongan and save Fiachna in battle. The visitor later defeats the
    opposing warrior, and Mongan is born and identified as son of Manannan mac Lir
    though called son of Fiachna. A second, incomplete story begins: Mongan is king
    at Rathmore, Forgoll the poet visits him, and a dispute over the death of Fothad
    Airgdech leads Forgoll to threaten destructive satire and demand Mongan''s wife
    unless redeemed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fiachna Lurga is described as sole king of the province and as a friend of
    Aedan son of Gabran; he crosses to Scotland to aid Aedan in warfare and leaves
    his queen at home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the hosts are fighting in Scotland, a noble-looking man goes to Fiachna's
    wife in the stronghold at Rathmore of Moylinny and asks her to arrange a meeting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiachna's wife first refuses to do anything that would disgrace her husband's
    honour, but says she would help him if she saw him in danger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visitor says Fiachna is in great danger, that union between himself and
    the woman will produce a famous son named Mongan, and that he will save Fiachna
    by defeating the warrior in the battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the battle, the noble-looking man appears before the army of Aedan and
    Fiachna, tells Fiachna about the previous conversation, goes toward the opposing
    side, vanquishes the soldier, and the battle is routed before Aedan and Fiachna.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fiachna returns home; his wife is pregnant and bears Mongan. The passage states
    that Mongan is a son of Manannan mac Lir, though he is called Mongan son of Fiachna.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A subsequent story heading says it is a story from which it is inferred that
    Mongan was Find mac Cumaill.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mongan is described as being in Rathmore of Moylinny in his kingship; Forgoll
    the poet comes to him, recites stories nightly from Halloween to May-day, and
    receives gifts and food from Mongan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mongan asks Forgoll about the death of Fothad Airgdech; Forgoll answers that
    Fothad was slain at Duffry in Leinster, and Mongan says this is false.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Forgoll threatens to satirise Mongan and his family and to sing spells on
    their waters, woods, and plains so that fish, fruit, and produce will fail.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mongan offers valuables and land; the poet refuses all except the woman, and
    Mongan consents for the sake of honour. Breothigernd is sorrowful, and Mongan
    tells her help will certainly come.
  category: sequence
  evidence_refs:
  - ev:6
