  text: The king of Leinster welcomes the disguised visitor as Tibraide, asks him
    to read the gospel, and has Ceibhin Cochlach accompany him; Mac an Daimh repeatedly
    says only “Amen.”
  category: action
  evidence_refs:
  - ev:1
