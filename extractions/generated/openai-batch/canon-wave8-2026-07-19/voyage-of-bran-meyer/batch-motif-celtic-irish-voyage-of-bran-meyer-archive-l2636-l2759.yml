  quote: ''
  summary: The passage narrates Mongan’s entry to the king of Leinster’s fortress
    under a clerical or Tibraide-like guise, his private meeting with Dubh-Lacha,
    the silencing and killing of an old woman witness, the confusion caused by a second
    Tibraide’s arrival, and later episodes of separation, longing, attempted communication,
    a chessboard meeting, and proposed warfare for Mongan’s wife.
  language: English
  quote_policy: summarized
