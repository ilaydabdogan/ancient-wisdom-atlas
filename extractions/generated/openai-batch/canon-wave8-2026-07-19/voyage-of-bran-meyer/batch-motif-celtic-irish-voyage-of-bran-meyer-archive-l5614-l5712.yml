  summary: A scholarly discussion evaluates Professor Zimmer's hypothesis about Irish
    otherworld beliefs, Christian reclassification of older mythic beings, the relation
    between mound or side dwellings and oversea Elysium, possible roots in natural-feature
    and funeral-mound veneration, and a possible Scandinavian-contact explanation
    for fairy belief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports Zimmer's view that the Irish pantheon was once organized
    like that of the Germanic races and included beneficent and malevolent immortal
    beings.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Zimmer's account, Christianity caused malevolent older beings to become
    giants and monsters, while beneficent beings became local friendly powers dwelling
    in mounds and hillocks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the life of beings in the hollow hill was described as enriched
    with attributes formerly attached to other dwelling-places, especially oversea
    Elysium.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The author notes mixed examples: Connla''s summoning maiden calls her kindred
    aes side, and Fann and Liban are called women of the hill though they dwell across
    water.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The oversea Elysium is described as lacking strife, contention, death, and
    pain, while the Tuatha Dé Danann are said to have passions, wars, contentions,
    and possible death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author argues that varying visions of a god's land may naturally share
