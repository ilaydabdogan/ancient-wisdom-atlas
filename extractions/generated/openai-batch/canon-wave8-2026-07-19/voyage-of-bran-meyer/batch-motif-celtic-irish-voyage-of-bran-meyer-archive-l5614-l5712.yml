    divine personages.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: One proposed element of side belief is veneration of great natural features,
    such as mountains and rivers, conceived either as animated or as homes of beings
    wiser and more powerful than humans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another proposed element of side belief is respect and worship paid to the
    funeral mound where ancestral shades dwell.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author states that the earthly presentation of the god's land may be as
