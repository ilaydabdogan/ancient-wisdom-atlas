  text: The bow and arrow is described as effective for shooting ptarmigan and hare
    at about 25 yards, with arrows striking birds forcefully.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In former years, arrows were used against deer in water or deep snow after
