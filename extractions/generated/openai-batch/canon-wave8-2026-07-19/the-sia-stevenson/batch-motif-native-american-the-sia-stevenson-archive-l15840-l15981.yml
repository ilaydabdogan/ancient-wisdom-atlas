  quote: ''
  summary: 'The passage describes hunting weapons and techniques: bows and arrows
    for birds, hares, and deer; spears for swimming reindeer and white whales; snares
    for deer; children’s use of bows and crossbows; and notes on beaver scarcity in
    the Ungava district.'
  language: English
  quote_policy: summarized
