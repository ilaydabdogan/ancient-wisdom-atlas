canonical_text:
  quote: ''
  summary: A curing observance for a sick boy is prepared and begun after a rain ceremonial.
    A sand-painting, fetiches, medicine bowl, bear-related objects, sacred blanket,
    food, water, meal lines, pigments, necklaces, and straws are arranged and used
    by named ritual officers and society members. The vice-ho'naaite brings the sick
    child, who is set on the blanket and instructed to throw meal toward the altar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The assembly begins ritual observances that continue for four consecutive
    nights for curing the sick by the brushing process.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sand-painting is made at the east end of the room, with ya'ya, stone fetiches,
    a medicine bowl, bear-leg skins, and a white embroidered sacred Tusayan blanket
    arranged near it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Female members serve refreshments to the male members before the ti'amoni
    places stewed meat and bread near the painting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five men sit in line behind the fetiches, with the ho'naaite as the central
    figure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ti'amoni brings a vase of water and a gourd, and the ho'naaite empties
    six gourdfuls of water into the medicine bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ho'naaite prays while holding two eagle plumes, scatters bread dipped
    in stew before the fetiches, and throws food outside as an offering to animals
    of the cardinal points.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The vicar spreads the Tusayan blanket and sprinkles meal lines from and across
    it; the passage states that four of these lines are symbolic of the four winds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fresh meal ground by a woman in an adjoining room is placed in an Apache basket,
    and meal remaining from the pottery bowl is added to it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the portion emptied from the older meal bowl is deemed
    sufficient to lend a sacred character to the freshly ground meal.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ho'naaite puts on a necklace of bear claws with a reed whistle and eagle
    plumes after waving it around the white bear fetich; the other members put on
    similar necklaces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ti'amoni uses red pigment on his face, and the other members apply galena
    to parts of the face; the passage says this is done to insure correct singing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Corn husks are handed along, and the narrator says they may have been made
    into funnels holding tiny pebbles from ant hills.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The ho'naaite divides a bunch of straws into five parts, reserving one share
    for the absent vice-ho'naaite.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The vice-ho'naaite returns carrying the sick child, walks on the line of meal,
    and sets the child on a low stool on the embroidered band of the blanket.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The child receives the basket of meal and, under the vice-ho'naaite's instructions,
    throws a pinch toward the altar with a few words.
  category: action
  evidence_refs:
  - ev:10
