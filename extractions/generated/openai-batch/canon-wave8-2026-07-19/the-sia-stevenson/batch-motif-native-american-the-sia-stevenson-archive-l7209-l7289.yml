canonical_text:
  quote: ''
  summary: A coyote catches a hare, but the hare delays him with speech, feigned trembling,
    and escape to a stone house. The coyote attempts to kill the hare by fire, finally
    using burning piñon gum, but the hare tricks him into coming close and throws
    the boiling gum in his face before escaping. The coyote then travels across a
    mountain, finds a sleeping lynx, gathers fat from the lynx with a stick, reshapes
    its mouth, ears, tail, limbs, and body, and calls it awake.
  language: English
