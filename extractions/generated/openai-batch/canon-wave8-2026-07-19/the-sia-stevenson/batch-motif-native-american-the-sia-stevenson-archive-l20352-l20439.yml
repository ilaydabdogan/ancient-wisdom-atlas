canonical_text:
  quote: ''
  summary: The passage catalogs sacred and mystic trees and plants in several Native
    North American traditions. It describes Omaha and Ponka uses of ash and cottonwood
    in sacred poles and pipes, cedar's associations with destructive powers and ritual
    dread, Osage cedar as tree of life in initiation, Dakota and Athapascan cedar
    uses, Hidatsa names and reverence for red cedar and cottonwood, and plant names
    in several tribal name lists.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha are said to have two sacred trees, ash and cedar; ash is linked
    with beneficent natural powers, while cedar is linked with destructive agencies
    such as thunder, lightning, and wars.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Part of the Omaha and Ponka sacred pole is ash, another part is cottonwood,
    and the stems of the sacred pipes of friendship are made of ash.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During an Omaha tribal-circle pipe circuit, a group described as bad wore
    plumes and cedar branches around their heads; the pipe-bearer passed them by and
    gave the pipe to a group described as good.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Osage traditions, cedar symbolizes the tree of life, and an initiation
    includes four sips of water interpreted as the river by the tree of life, cedar-needle
    rubbings, and the pronouncing of a sacred name of Wakanja.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage records groups or names associated with cedar, including Osage
    Red Cedar people and a Kansa gens described as wearers of cedar branches on the
    head.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cedar is reported as used by the Santee Dakota in a four-winds ceremony, and
    Teton Dakota belief gives cedar smell or cedar smoke efficacy in scaring away
    ghosts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In an Athapascan creation myth from Oregon, cedar smoke takes the place of
    food for two gods who made the world; red cedar and ash are sacred because they
    were first discovered by the gods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hidatsa name for red cedar is glossed as mysterious or sacred tree, and
    the passage asks readers to compare Hidatsa cottonwood reverence with the Omaha
    sacred pole.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cottonwood is presented as a mystic tree for Omaha and Ponka as well as Hidatsa;
    the Omaha and Ponka sacred pole was made from a tall cottonwood with an ash piece
    fastened to it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: For the Hede watci dance, the Ilke-sabe people sought a cottonwood, rushed
    on it, felled it, carried it to the center of the tribal circle, and planted it
    there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mystic names derived from cottonwood occur in named Ponka and Omaha gentes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Personal or group names in Omaha, Ponka, Winnebago, Iowa, Oto, Missouri, Kansa,
    and Osage lists refer to plants or trees such as white oak, a tea-making plant,
    pine or cedar, cedar, corn, pumpkin, elm, black hawthorn, red oak, and sycamore.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
