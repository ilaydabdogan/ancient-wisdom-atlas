canonical_text:
  quote: ''
  summary: 'The passage describes games and implements among the people discussed:
    communal football involving all ages; wrestling rules and strength contests; stone
    throwing; card gambling, especially among women; a hidden-object guessing game
    played by young girls; an ivory cone-and-peg dexterity game compared to cup and
    ball, sometimes using a hare skull; children drawing lines in snow while reciting
    foreign-sounding numerals; and the construction and use of a football and whip
    in winter play.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Football is described as drawing participation or attention from people of
    every age, from elderly women to toddlers.
  category: action
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: Male wrestlers remove extra garments, seize each other around the waist, lock
    hands behind the opponent's back, and try to throw the opponent flat so that the
    head touches the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Using the feet for tripping in wrestling is forbidden by custom, and witnesses
    would stop such a procedure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eskimo and Indians are said to engage in comparative wrestling tests of strength,
    with the Eskimo reported as the better men in those contests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Younger men throw stones at a mark, and some acquire notable dexterity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When playing-cards are available, people play games learned from white people;
    small stakes are wagered, and women are described as especially passionate gamblers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women may wager clothing until the loser is nude; the winner usually returns
    at least part of the clothing and advises the loser to play more and lose less.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Young girls play a game in which one hides an object in a closed hand and
    another asks about its size, color, and other traits until she guesses it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A dexterity game uses an elongated conical ivory piece with notches, holes,
    a thong, and an attached ivory peg; the player swings the piece and tries to catch
    it on the peg a set number of times.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hare skull with perforations may be substituted for the ivory ball in the
    dexterity game.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Children sometimes make straight lines in newly fallen snow with a sharp object
    while repeating words described by the narrator as gibberish.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The repeated words are identified by the narrator as German numerals known
    through Labrador Moravian missionaries and transmitted among Eskimo groups.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The football is made from buckskin or sealskin, stuffed with dry moss or feathers,
    and driven by the foot or by a specially constructed whip with a wooden handle
    and sealskin thongs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Fort Chimo the football game is played on late winter afternoons in temperatures
    reported as 30 or 40 degrees below zero.
  category: setting
  evidence_refs:
  - ev:9
