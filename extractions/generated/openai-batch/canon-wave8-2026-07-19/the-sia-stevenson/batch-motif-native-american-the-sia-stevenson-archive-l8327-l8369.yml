  summary: 'The passage gives a zoological and economic account of mammals in a northern
    region: marine mammals and seals are known and pursued, white whales are captured
    and processed by Indians and Eskimo at Little Whale River and Fort Chimo, reindeer
    provide subsistence and winter skins, bears occupy different ranges, and smaller
    mammals vary by habitat and food supply.'
