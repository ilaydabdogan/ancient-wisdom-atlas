canonical_text:
  quote: ''
  summary: The passage describes methods used by the people/Indians/Nenenot to capture
    beavers from lodges and water settings, including opening a hut after closing
    underwater holes, draining a pond or lake, shooting beavers on moonlit water,
    and using a deerskin purse-like net. It also notes the danger of beaver bites,
    the value of beaver flesh as food, and the making and use of the crooked knife
    as an important tool.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When beaver dams and structures are found, the people devise ways to capture
    the beaver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One capture method closes the underwater holes leading to the structure, opens
    the top of the hut, lifts the animal out by the hind legs or tail, and kills it
    with a blow to the head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the hunter pauses after taking hold of the animal, the beaver may bite
    with sharp, powerful teeth and cause a severe cutting and crushing wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another method drains water from the pond or lake by damming off the supply,
    leaving the beaver house dry so the occupant emerges and is killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Beavers are sometimes shot while on the water during moonlit nights.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A special net is made from fine deerskin thongs, with small meshes, an outer
    thong, and a spruce-root ring wound with sinew.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: When water is too deep and only one beaver is in the lodge, the net is placed
    over the exit so the animal enters it as it leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The net tightens like a purse through the slipping ring and either strangles
    the beaver or causes it to drown while struggling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The net is described as effective even when the beaver has become too wary
    to be shot on the water surface.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The flesh of the beaver is valued as food, and the flesh of the female is
    preferred to that of the male.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The crooked knife is described as one of the most important tools used by
    the Nenenot and is made from steel files or knife blades by grinding, edging,
    heating, and bending the blade.
  category: object
  evidence_refs:
  - ev:8
