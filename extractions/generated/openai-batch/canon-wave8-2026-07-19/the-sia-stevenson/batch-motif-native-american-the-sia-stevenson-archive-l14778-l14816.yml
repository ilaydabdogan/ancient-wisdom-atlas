canonical_text:
  quote: ''
  summary: The passage describes Nenenot steam baths in a dome-shaped sweat house
    made from bent poles and tent skins, using heated stones and water to produce
    intense steam and perspiration. It notes frequent use, even delaying journeys,
    recounts a Fort Chimo incident in which reindeer drove an old man and wife out
    of a sweat house, and observes that remains of former sudatories are common along
    long-used paths.
