- id: obs:1
  text: After birth, the woman receives a changed gown and bedding, and later drinks
    cedar-twig tea prepared by the grandmother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the designated tea-drinking period, water is not drunk and continence
    is observed for two, three, or four months depending on clan practice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that if a woman breaks continence, an animal would enter
    her abdomen and she would die, according to the first mother of her clan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The infant is nursed from birth; in the described case another nursing woman
