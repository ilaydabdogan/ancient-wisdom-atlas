canonical_text:
  quote: ''
  summary: 'The passage describes Sia postpartum practices: cedar-twig tea, restrictions
    on water and sexual continence, care by relatives, early nursing, purification
    with ashes and charcoal, handling of stone fetiches and sacred meal, paired ears
    of corn associated with the child, a fourth-morning presentation of the infant
    toward the rising sun and Ko''pishtaia, and a baptismal prayer naming the child.'
  language: English
  quote_policy: summarized
