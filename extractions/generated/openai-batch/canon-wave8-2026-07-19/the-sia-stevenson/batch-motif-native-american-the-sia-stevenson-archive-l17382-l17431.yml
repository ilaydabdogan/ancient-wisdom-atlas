canonical_text:
  quote: ''
  summary: A poor hare living with his grandmother catches an abundance of fish in
    a net and promises to obtain fire to cook them. He crosses a wide river by commanding
    whales to line up as a bridge, wets his fur, feigns capture by Indian children,
    is placed near a bright fire, causes a spark to fall on his net, and escapes through
    a round hole while the Indians realize they have been outwitted.
  language: English
  quote_policy: summarized
