literal_observations:
- id: obs:1
  text: Pulmonary disease is attributed to crowded, poorly ventilated huts and repeatedly
    breathed air; scurvy and blood-devitalizing diseases are also described.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Openings in huts are closed quickly to conserve heat, and a new snow hut is
    preferred over a cold abandoned hut whose doorway was not closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Relief for sickness is usually attempted by a shaman or conjurer working on
    the sick person's imagination, with will power and faith emphasized.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the magnitude of disease is generally measured by
    the amount of the patient's worldly wealth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Koksoagmyut are described as usually peaceful, with rare affrays, but
    jealousy is said to arouse passions and commonly lead to murder of the offender.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person whose character is no longer tolerated may be excluded from huts,
    food, and intercourse; a murderer may be surprised and killed by several men,
    usually by stoning, with community support.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: For premeditated murder, the next of kin is described as obligated to avenge
    the deed, even after years of delay.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Akpatok island is avoided after a murder of shipwrecked crew members because
    the ghosts of the victims might appear and ask for relief, while the people lack
    proper offerings to appease them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Aged people without relatives may be neglected and left behind during a sudden
    move; a discovered corpse may have stones piled around it and be bound with thongs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A one-eyed old woman at Fort Chimo was proposed to be strangled as relief
    from misery, but the plan was postponed when her eye improved.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Suicide is described as not rare, with cliff-jumping, strangulation, and sometimes
    a gun as methods; remorse and disappointed love are named as causes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: During scarcity, a man found that his wife had hidden and eaten fish; he blocked
    the snow-hut entrance, and she remained inside and starved because she expected
    to be killed if she came out.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: In great scarcity, families are reported to have resorted to cannibalism after
