  summary: The passage describes diseases, shamanic treatment, social sanctions for
    murder, vengeance, taboo associated with a murder site and ghosts, treatment of
    aged or unwanted people, suicide, a starvation killing after hidden food is discovered,
    cannibalism during scarcity, and expulsion from camp.
  language: English
