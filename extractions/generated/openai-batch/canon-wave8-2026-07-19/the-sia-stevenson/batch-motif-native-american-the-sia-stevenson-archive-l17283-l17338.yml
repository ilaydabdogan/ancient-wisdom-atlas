  - ev:3
- id: obs:7
  text: While entering the water, the Indian does not feel the water touching him;
    he and the beaver swim to her home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Inside the beaver’s home, the beaver serves food that the Indian does not
    recognize as willow bark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After two nights, the Indian’s brother searches for him, follows his track,
    finds his clothing on the stream bank, and returns believing he has drowned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The brother dreams that the missing man is living with a beaver, asks his
    wife to make new clothing for him, makes snowshoes, and begins a search alone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The searching brother makes a dam across the stream to lower the water around
