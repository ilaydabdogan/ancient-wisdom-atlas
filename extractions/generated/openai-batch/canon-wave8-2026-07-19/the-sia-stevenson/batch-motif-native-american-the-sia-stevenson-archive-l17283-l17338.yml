    dense forests away from people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Indian hunter travels along a stream bank, sees a beaver house, and aims
    at a beaver swimming toward him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beaver speaks, asks not to be shot, and asks the Indian whether he would
    take her as a wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Indian says he cannot live in water or eat willows and wood like a beaver;
    the beaver replies that he will not perceive the water or willow food in the ordinary
    way and says she has a good house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The beaver tells the Indian to remove his clothing and leave it on the bank
