canonical_text:
  quote: ''
  summary: The passage first gives the close of a marten story in which a man overhears
    a marten with his wife, scalds it, and the marten retreats to dense forests. It
    then begins the tale of an Indian hunter who follows a speaking female beaver
    into the water as her husband, lives in her house, and is later sought by his
    brother, who dreams of him, prepares clothing, finds the beaver house, and dams
    the stream while the beaver wife’s children are warned of danger.
  language: English
  quote_policy: summarized
