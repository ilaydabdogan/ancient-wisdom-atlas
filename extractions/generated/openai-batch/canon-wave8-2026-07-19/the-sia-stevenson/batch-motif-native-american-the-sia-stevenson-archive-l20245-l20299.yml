canonical_text:
  quote: ''
  summary: A set of Omaha trapping invocations addresses a supernatural originator
    of beaver medicine, beavers, the medicine itself, a trap, a pack-strap, a tent
    entrance, a tent pole, and a fireplace. Tobacco is repeatedly offered while each
    addressee is asked to aid in obtaining, carrying, or cooking quadrupeds. The passage
    also makes an authorial comparison to Habakkuk's report of Chaldeans making offerings
    to their nets.
  language: English
  quote_policy: summarized
