canonical_text:
  quote: ''
  summary: 'The passage describes part of a Knife Society ceremonial sequence: songs
    appeal to cloud people for rain and crops; ritual leaders handle ya''ya, rattles,
    plumes, water vessels, medicine and cloud bowls, pollen, corn meal, pebble fetiches,
    and sprinkling actions at the altar; novitiates and boys are present, and two
    boys later prepare cigarettes near the fireplace.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song is described as an appeal to cloud people of the cardinal directions
    and the world to gather and send rain to water the earth so mankind may have the
    fruits of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ho'naaite leans over the altar, takes two central ya'ya, raises them alternately
    in time with the song, and extends them over the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young novitiate is said to hold neither rattle nor plumes, while a boy who
    had passed through two degrees holds a rattle and a miniature crook.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The vicar and another man move rattles and feathers in harmony with the ho'naaite,
    swaying and extending their arms outward and upward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some boys at the east end of the line fall asleep, and a man attempts to keep
    them awake by brushing their faces with eagle plumes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A boy brings a vase of water and a gourd from the southwest corner and places
    them near the altar west of the line of meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ya'ni'siwittanni pours repeated gourdfuls of water into the medicine bowl
    and cloud bowl, dances, waves plumes and rattle, and gives bird-like trills calling
    for cloud people to gather.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: 'Two small medicine bags are given to each member, one containing corn pollen
    and one containing meal from six varieties of corn: yellow, blue, red, white,
    black, and variegated.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pollen and meal are sprinkled into the medicine bowl, with shrill calls for
    the cloud people to gather; this sprinkling is repeated four times, and the novitiates
    do not participate in this feature.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The ya'ni'siwittanni drops pebble fetiches alternately into the medicine and
    cloud bowls until each contains six fetiches, then stirs water and sprinkles the
    altar from both bowls; the sprinkling is repeated six times.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The man at the right of the ho'naaite and then the ho'naaite sprinkle the
    altar with medicine water and eagle plumes; afterward each member sprinkles the
    altar four times with exhortations to the cloud people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the song's close two boys prepare cigarettes before the fireplace using
    corn husks, saliva, and tobacco.
  category: action
  evidence_refs:
  - ev:11
