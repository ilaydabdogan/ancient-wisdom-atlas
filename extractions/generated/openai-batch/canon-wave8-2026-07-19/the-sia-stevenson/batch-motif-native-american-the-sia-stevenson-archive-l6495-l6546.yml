canonical_text:
  quote: ''
  summary: The passage describes a Sia childbirth rite observed in May 1890. A pregnant
    woman’s family waits in the living room, prepares objects and infant gifts, and
    the woman chooses an officiating ho'naaite theurgist. She holds shell mixture
    in her right hand, breathes on it four times for the expected child’s well-being
    and straight path, and gives it as the theurgist’s compensation; in this case
    she chooses her father.
  language: English
  quote_policy: summarized
