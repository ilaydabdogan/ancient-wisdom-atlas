canonical_text:
  quote: ''
  summary: The passage describes a Rain Ceremonial of the Giant Society in a ceremonial
    chamber. The ho'naaite prepares a sand painting and altar, arranges ya'ya fetiches
    and other ritual objects, prepares plume and yucca-ring offerings with assistance
    from his vicar, a woman, and a girl, sprinkles the altar and offerings with medicine
    water, prays for animal powers to intercede with cloud people for rain, and casts
    food outdoors to animal Ko'pishtaia of the cardinal points.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite leaves his fireside seat in the ceremonial chamber, makes a
    sand painting at the east end of the room, and erects a slat altar while the vicar
    continues preparing ha'chamoni.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacks taken from the wall contain ya'ya; one ya'ya is said to have been captured
    from the Navajo and is described as representing tTt's6t, the mother of all Indians.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Five ya'ya are placed in line before the altar on the sand painting; miniature
    bows and arrows, bear-leg skins, bear-claw necklaces, reed whistles, and eagle
    plumes are arranged with them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A medicine bowl, stone fetiches, and a cloud bowl are set near the sand painting,
    and the woman and girl prepare pigments with water and paint the ha'chamoni.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite lays out plume groups, including turkey, eagle, and cardinal-point
    bird plumes; he and the vicar tie the piles during a low chant, and the ho'naaite
    waves each completed group in a left-to-right circle before his face.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman and child make four yucca rings, dip them in yellow paint, and the
    ho'naaite adds a hummingbird wing plume; the passage states these rings are offerings
    to the cloud children and emblematic of wheels on which they ride over ti'nia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ten ha'chamoni are described as bearing messages to cloud rulers of the cardinal
    points and to named beings including Ho'channi, SCis'sIstinnako, t^t'sCt, and
    the sun.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ho'naaite places the ha'chamoni and rings in a basket before the altar
    and cloud bowl, posts a stuffed parrot on the central slat, receives additional
    ya'ya from other officials, pours water into the medicine bowl, adds corn pollen,
    and sprinkles the altar and offerings with eagle plumes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the ho'naaite and vicar eat in the ceremonial chamber, the remaining
    bread and meat are placed before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night the ho'naaite and vicar sprinkle the altar and food with medicine
    water, and the ho'naaite prays to Cougar of the North, Bear of the West, Badger
    of the South, Wolf of the East, Eagle of Heaven, and Shrew of the Earth to intercede
    with cloud people so the earth and crops may be watered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The vicar gives the ho'naaite bits of bread and meat; the ho'naaite leaves
    the house holding food and eagle plumes and casts the food to animal Ko'pishtaia
    of the cardinal points while asking them to intercede with the cloud people for
    rain.
  category: action
  evidence_refs:
  - ev:7
