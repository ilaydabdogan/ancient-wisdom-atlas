canonical_text:
  quote: ''
  summary: 'The passage describes Sia cosmogonic and ritual beliefs: the spider/Sus''sistinnako
    is identified as a primordial creator; supplication occurs through a mediator
    and fetish, with various invoked beings present in images; the Sia are distinguished
    from ancestor worship despite beliefs about Shipapo and masked beings; witchcraft
    is described as shapeshifting and causing disease by intrusive objects, countered
    by secret-society theurgists who can extract such objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the spider is an important actor in Sia, Zuni, and
    Tusayan mythology and that, in Sia cosmogony, the spider was the primus and creator
    of all.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: S&s'slstinnako is described as a man, or more properly as a being possessing
    all power, who created first man and then other beings to serve the first creation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: SCls'sIstinnako must be supplicated through the mediator t^ts^t, who is present
    in the fetish I'arriko.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ko'shairi and Quer'ranna appear for the sun and moon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: War heroes, warriors of the six mountains of the world, women of the cardinal
    points, and animals, insects, and birds holding medicine secrets are present in
    images of themselves when invoked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Sia cannot be said to practice ancestor worship; the
    road to Shipapo is crowded with spirits returning to the lower world and unborn
    infants coming from the lower world, but ancestors do not return once they enter
    Shipapo.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kokko are described as immediate ancestors of the Zuni and personated by masked
    persons, while the Sia Ka'suna are also personated by masked men and women but
    are described as a distinct creation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those possessing witchcraft are said to assume the form of dogs and other
    beasts and to create disease by casting snakes, worms, stones, bits of fabric,
    and other things into the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hair must be burned so that wizards or witches cannot find it, combine it
    with other things, and cast it into the person from whose head it was cut, causing
    illness or death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Theurgists of secret cult societies are said to have esoteric power as a panacea
    for such afflictions, and the passage reports a man whose chest pain was relieved
    when a snake was supposedly drawn from his body.
  category: action
  evidence_refs:
  - ev:7
