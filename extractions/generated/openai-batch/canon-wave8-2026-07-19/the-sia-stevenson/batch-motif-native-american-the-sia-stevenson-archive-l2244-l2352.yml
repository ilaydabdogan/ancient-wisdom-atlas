canonical_text:
  quote: ''
  summary: 'The Sia migration continues after four years: rising waters turn the earth
    into a vast river, the people take refuge on a mesa, offerings fail, and a youth
    and maiden cast from the mesa are followed by receding waters. The earth remains
    soft until the Ka''pina theurgist hardens it. The Sia travel from the northern
    white-house toward the center of the earth, build villages, and found Koasaia
    after Si''sika the swallow surveys the northern white-house. The completed village
    includes a chita for thanksgiving; the cougar remains guardian of the northern
    village and is represented at Koasaia by a lynx. The passage then introduces Po''shaiyanne,
    born at Pecos of a virgin who conceived after eating two pinyon nuts; rejected
    as a child, he lingers near ritual elders in the chita and listens while serving
    them.'
  language: English
  quote_policy: summarized
