canonical_text:
  quote: ''
  summary: The passage describes shamanic influence over marriage and illness accusations,
    examples of widows blamed for husbands' illnesses, interpretation of a rapping
    sound as a dead brother seeking food, the belief that all things and animals have
    attendant spirits, and a great spirit in bear form who controls reindeer spirits
    and future game supply.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The community shaman is described as possessing great influence and frequently
    deciding the course of relations between husband and wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a person becomes ill, a wife may be accused of working a charm on her
    husband so she can favor another man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman whose first husband had died married another man who became violently
    ill; after nursing him until convalescence, she was blamed by his mother and old
    women and forced to leave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A widow married to a Koksoak Eskimo was accused by the shaman of causing his
    illness because the spirit of her deceased husband was jealous.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Koksoak example, recovery was said to require the widow being sent
    off and another woman leaving her husband to marry a man who already had two of
    her sisters as wives; the latter couple avoided divorce by fleeing camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many old women are said to have reputations for interpreting dreams.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman heard rapping as if someone wanted entry, but no person was found
    as the source of the sound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old woman interpreted the rapping as the woman's dead brother, said he
    was hungry, and instructed her to prepare tea and bread for the child’s nurse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The nurse-girl was to be known as Nakvak, and through her the dead were said
    to procure food whose accompanying spirit relieved their hunger.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that everything in the world is believed to have an attendant
    spirit, and that lower animal spirits are like human spirits but inferior.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Because animal spirits are not destroyed when animals are killed, the passage
    says the people believe slaughter does not really decrease game numbers.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: A great spirit controls the reindeer, dwells in a huge cavern near Cape Chidley,
    obtains the spirit of every deer that is slain or dies, and determines future
    supplies by his goodwill.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The reindeer-controlling spirit is said to have the form of a huge white bear,
    and the shaman can prevail upon the spirit to send deer to suffering people.
  category: attribute
  evidence_refs:
  - ev:6
