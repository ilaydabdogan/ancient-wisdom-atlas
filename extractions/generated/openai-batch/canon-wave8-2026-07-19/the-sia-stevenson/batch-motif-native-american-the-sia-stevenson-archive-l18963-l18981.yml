  quote: ''
  summary: The passage quotes a note stating that a personal name implies relationship,
    protection, affiliation, and access to influence from the source of the name.
    It describes a ceremony in which a superhuman presence overshadows or encloses
    a child, addresses the wakan man as father, and is called child by the wakan man,
    who invokes protection for the boy and offers gifts and feast honors. The passage
    notes this as an apparent reversal of usual seniority and juniority terms.
