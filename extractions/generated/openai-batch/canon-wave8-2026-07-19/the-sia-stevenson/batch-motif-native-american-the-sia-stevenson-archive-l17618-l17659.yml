canonical_text:
  quote: ''
  summary: In an animal-camp episode, a wolverene is hosted among wolves. Deer meat
    is provided and cooked; the wolverene is given more than he can eat, secretly
    hides a remnant despite a warning, and later finds bark in its place after wolves
    substitute it. The wolves break camp in a hidden way, travel across a river, follow
    a leader's track, find stripped deer bones, and reach a marked tent site.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unidentified actor goes outside for snow to melt for water, returns with
    it, sets down a kettle, jumps over brush, and the brush immediately blazes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old wolf says that the wolverene wonders where meat for supper will come
    from, and a young wolf brings in a brisket of deer meat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deer meat is cut up, cooked in the kettle, and served; the choicest portions
    are placed before the wolverene with an instruction to eat all of them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The quantity of meat is too great for the wolverene to finish, and he attempts
    to put the remaining portion away.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A wolf warns the wolverene not to put the meat in a certain place because
    it would change into bark.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wolverene lays the meat on clean brushwood, then secretly inserts it between
    the tenting and the pole when he thinks the wolves are not looking.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wolves see the wolverene hide the meat; after he falls asleep, one wolf
    removes the meat and puts a piece of bark in its place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the morning the wolverene reaches for the food remnant, finds only bark,
    and agrees when a wolf reminds him of the warning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The wolves have a second kettle of meat cooked; the leader mentions fresh
    deer tracks, and the wolverene tries to watch how the tenting is packed, but the
    tent disappears while his back is turned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The animals travel with the young ones leading and the four old ones and the
    wolverene behind; they cross a river and follow the leader's track toward a sign
    for the camp site.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Near sundown the party finds bones of a freshly killed deer stripped of meat,
    and then comes upon the mark for the tent site.
  category: sequence
  evidence_refs:
  - ev:8
