  summary: The passage describes a seal being brought to camp after a successful hunt,
    communal processing and eating of the seal, tobacco and snuff use with associated
    sealskin and ivory implements, and the umiak as a Hudson Strait Eskimo watercraft,
    including its use, proportions, and construction.
  language: English
