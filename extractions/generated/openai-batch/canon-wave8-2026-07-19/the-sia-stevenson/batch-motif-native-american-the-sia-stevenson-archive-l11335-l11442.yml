literal_observations:
- id: obs:1
  text: A hunter who has killed a seal signals his success from a distance, and people
    in camp respond with a joyous shout.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seal is drawn ashore and skinned; its flesh is eaten raw during the process
    or divided among people, and its blood is collected and mixed with the hot liquid
    from boiled meat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feast continues until the flesh is consumed and people are full; stories
    are told and good humor prevails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fish from the shallow waters of the bays are also used as food.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Adults are described as using tobacco for smoking, chewing, and snuff, though
    not every person uses it in all three ways.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Plug tobacco for smoking and chewing is carried in a small sealskin pouch
    attached to the belt; watches may also be carried in the same receptacle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Snuff may be made by shredding and drying tobacco, enclosing it in a fold
    of sealskin, and pounding it with a stone or stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snuff is kept in a purse-shaped bag with a thong closure, and a small ivory
    spoon is used to place snuff near the nostril for inhaling.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old women are described as appearing more addicted to snuff than the men,
    and strong snuff is said to show its effect quickly in the face.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The umiak is described as the principal water conveyance of the Eskimo of
    Hudson Strait; the text says 'family boat' would be more accurate than 'woman's
    boat.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women use the umiak alone only rarely and for short trips in quiet water,
    while men are nearly always in it and guide it on long journeys.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Hudson Strait umiak is said to differ greatly in form from that of the
    Eskimo of Bering Sea; its keel length varies from about 10 to 25 feet, and bow
    and stern are nearly alike except that the bow is somewhat wider at the upper
    edge.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The umiak is constructed from a wooden keel, stem and stern posts, rails,
    crosspieces, ribs, sealskin lashings, boards, seats, and a thwart that can steady
    the mast.
  category: object
  evidence_refs:
  - ev:8
