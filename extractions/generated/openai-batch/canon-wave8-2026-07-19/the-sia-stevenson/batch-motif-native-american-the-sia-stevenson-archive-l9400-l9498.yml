canonical_text:
  quote: ''
  summary: The passage describes disease conditions, shamanic treatment, and marriage
    and child-rearing practices among a group identified within the passage as Eskimo
    or Hudson Bay Eskimo. It discusses pulmonary illness and scurvy, treatment by
    a shaman or conjurer, wealth as a measure of disease magnitude, coerced marriage
    practices, gift-based parental sanction, abduction and confinement of women, child
    betrothal, monogamy, separation, and care of children by older women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says pulmonary troubles are the principal diseases and attributes
    them chiefly to crowded, ill-ventilated huts and accumulations of decomposing
    animal food.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that hut openings are closed quickly to keep in heat and
    that a person would prefer a new snow hut over a deserted one whose doorway had
    not been tightly closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says people breathe repeatedly in air filled with poisonous gases
    and that about half die of pulmonary troubles; it also names scurvy-like blood
    devitalization and sores as prevailing diseases.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman or conjurer is described as trying to relieve sickness by working
    on the imagination of the sick person, with will power and faith presented as
    important to the cure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the magnitude of disease is generally measured by
    the amount of the patient's worldly wealth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Marriage is described as occurring after puberty when a male has enough physical
    strength to force a woman to become his wife; some females are said to be taken
    before puberty.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Parental sanction for marriage is sometimes obtained by favor or bought with
    presents of skins, furs, and other valuables; the girl is sometimes asked for
    consent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a girl refuses after other obstacles are removed, the passage describes
    her disappearing with a sympathetic female friend, returning, and later being
    abducted by her lover until she is subjected to his will.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An example is given in which a girl was tied in a snow house for two weeks
    until she submitted, then later left her husband after violent conflict.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The same woman is described as later being tied to a sled to make her accompany
    another man, while older women pushed and persuaded her and younger women tried
    to obstruct the action.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Children are described as sometimes being mated at an early age, including
    arrangements by friends for unborn children to be mated.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says monogamy is generally the rule but that separation is common;
    rare pairs remain together for life, and illegitimate children are often cared
    for by an aged woman.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
