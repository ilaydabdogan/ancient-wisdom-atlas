canonical_text:
  quote: ''
  summary: The supplied passage contains two narrative segments. In the first, after
    water recedes, an attacking brother or uncle reaches a lodge, kills two children
    and their mother, and the husband keeps the killed wife's right hand and arm skin.
    The bodies are treated as beavers; later the husband is forced to eat female beaver
    flesh, a river emerges from his side, and he swims beside his wife, who had been
    a beaver. In the second, a deserted child is brought back to his parents by a
    grandfather spirit, who rebukes the parents, later departs, and tells the child
    that a spirit cannot dwell among living people. The child tries to follow him
    across a frozen lake, but is later tied to a tree and forgets him.
  language: English
  quote_policy: summarized
