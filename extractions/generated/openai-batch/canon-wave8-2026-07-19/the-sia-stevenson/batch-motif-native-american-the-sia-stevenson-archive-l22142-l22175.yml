canonical_text:
  quote: They supposed the Thunder-being to be a large bird.
  summary: The passage describes Iowa, Oto, and Winnebago names and cult associations
    for the Thunder-being as a wakanta or sacred power. It notes spring feasting at
    the first thunder, Winnebago Thunder-being sub-gens names, enmity between Thunder-beings
    and submarine powers, a story of a human archer aiding a Thunder-being against
    a subaquatic power with costly consequences, and a warrior grass-plaiting custom
    probably associated with Thunder-being worship.
  language: English
  quote_policy: quoted
