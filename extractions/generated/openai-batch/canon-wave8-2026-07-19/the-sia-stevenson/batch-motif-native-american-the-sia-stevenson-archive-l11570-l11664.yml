canonical_text:
  quote: ''
  summary: The passage describes the equipment of a kaiak hunter, including detachable
    spear points, thongs, lines, floats, a trident, a hand board or spear thrower,
    a paddle, and a hook staff for retrieving sunken animals. It then describes how
    a young man’s acquisition of hunting equipment, a kaiak, skins, an umiak, and
    a tent can lead to household leadership, while men unable to obtain a kaiak remain
    dependent or socially neglected. The excerpt ends with a note on a collected full-sized
    kaiak and models.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The whale or seal spear has detachable parts connected by thongs, and a long
    line allows the struck animal to struggle until exhausted.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the sea is rough or the hunter cannot cope with the quarry, a float is
    thrown over, and the hunter follows while harassing the animal with a hand spear
    when possible.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A wooden shaft with three barbed iron prongs is used to kill small seals,
    white-coated young seals, and sometimes birds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hand board or thrower supports and releases the spear; if the spear strikes,
    it remains attached to the struggling animal while the board is retained on the
    kaiak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The paddle has long narrow blades that are alternately dipped in water, and
