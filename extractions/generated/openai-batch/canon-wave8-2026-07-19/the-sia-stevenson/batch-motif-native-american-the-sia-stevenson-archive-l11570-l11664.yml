  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After acquiring a kaiak, umiak, and tent, a successful hunter may direct others
    and become head of a gens or family group that travels with its possessions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Brothers may live together and jointly own the tent and umiak, while other
