canonical_text:
  quote: ''
  summary: In a Coyote myth episode, ka'wate reports a dead coyote to the hares, who
    verify and gather around the body. While the hares dance over the apparently dead
    Coyote, ka'wate makes them look upward and throws mephitic fluid into their eyes;
    Coyote rises and, with ka'wate, kills them with clubs and cooks them by a rock.
    In a later episode fragment, Deer explains that cedar-fire sparks made her children
    spotted; Coyote imitates the act with his own children in a cave, but they burn
    to death.
  language: English
  quote_policy: summarized
