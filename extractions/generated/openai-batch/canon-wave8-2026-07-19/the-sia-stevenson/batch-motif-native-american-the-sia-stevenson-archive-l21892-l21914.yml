  summary: 'The passage describes shamanic practices: a voluntary patient is shot,
    appears dead, and is revived with an otterskin sacred bag that produces the bullet;
    Mange zi performs a snake-and-grass sleight-of-hand act; NixUdje-yiuge lists eight
    objects used by shamans for “shooting.”'
