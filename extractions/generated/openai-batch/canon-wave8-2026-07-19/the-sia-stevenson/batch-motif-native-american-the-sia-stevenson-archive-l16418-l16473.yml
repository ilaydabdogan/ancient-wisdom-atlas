canonical_text:
  quote: ''
  summary: 'The passage frames storytelling as a winter indoor practice around the
    fire for instruction and entertainment. It then gives two wolverene stories: in
    the first, a wolverene joins birds in feathered flight, ignores a warning not
    to look below, falls among shouting Indians, and is exposed as a dead wolverene
    after being mistaken for a brant. In the second fragment, a wolverene on the seashore
    lures water birds ashore with the promise of a bees'' nest and asks them to dance
    with their eyes shut while he sings.'
  language: English
  quote_policy: summarized
