canonical_text:
  quote: ''
  summary: The passage describes the Red Medicine Dancing Society. It says that Indians
    formerly obtained a small red bean- or hazelnut-sized object in prairies toward
    the Bocky Mountains. Mr. Hamilton was told it grew on bushes, was considered alive,
    and was regarded as a mysterious animal. In the red medicine dance, the medicine-maker
    kills these animals by crushing the beans and boiling them in water. A few members
    drink the hot liquid, which produces an intoxicating effect, makes them feel full
    of life, and enables prolonged dancing.
