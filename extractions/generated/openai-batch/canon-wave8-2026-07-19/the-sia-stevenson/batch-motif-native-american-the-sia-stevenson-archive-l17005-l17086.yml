canonical_text:
  quote: ''
  summary: 'A fragmentary animal tale sequence: an otter’s wolf-wife worries about
    starving brothers; a mark is made so her wolf kin can find the otter’s tent; the
    wolf family arrives hungry, frightening young otters and consuming food. The passage
    then breaks into corrupted fragments involving deer, a wolverine striking a female
    figure, and a rabbit encountering a frog whose wives are away hunting.'
  language: English, OCR-corrupt
  quote_policy: summarized
