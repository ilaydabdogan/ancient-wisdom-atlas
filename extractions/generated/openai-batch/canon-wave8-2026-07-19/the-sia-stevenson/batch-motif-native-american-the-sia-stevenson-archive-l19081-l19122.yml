canonical_text:
  quote: ''
  summary: The passage lists beliefs and practices said not to be found among the
    Omaha, Ponka, Kansa, and Osage. It states that ancestors were reverently addressed
    but not worshiped, that Satan or devil terminology was learned from white people
    and used in sayings about bad conduct, that Omaha mothers invoked two named heroes
    to frighten children though hero worship was unknown, and that various cultic
    practices such as demigod worship, altars, human sacrifice, and cannibalism were
    absent. It also mentions possible incense-like tobacco smoke to the Thunder being
    and cedar fronds in the sweat lodge.
  language: English
  quote_policy: summarized
