canonical_text:
  quote: ''
  summary: The passage reports that the Iowa regard high rocks as dwellings of gods
    and cites a Winnebago tradition of a woman with her child turning into a rock
    and receiving offerings. It then describes acts of worship involving tobacco smoke
    directed to the sky, tobacco thrown into fire, food portions offered before feasts,
    and dogs or goods offered to Wakanta/God during smallpox.
