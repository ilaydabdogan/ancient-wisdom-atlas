canonical_text:
  quote: ''
  summary: Po'shaiyanne repeatedly appears in the chita wearing rare bracelets. The
    ti'amoni desires each bracelet and offers houses in exchange. In successive games
    involving concealed stones, sticks, sand mounds, Wash'kasi, and blocks in a bowl,
    Po'shaiyanne succeeds and the ti'amoni fails. Po'shaiyanne obtains the houses
    of the south, east, zenith, and nadir in this passage, and the ti'amoni finally
    says Po'shaiyanne has all his houses and is equal with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Po'shaiyanne takes his usual place, but the ti'amoni invites him to sit among
    them and says he is more than an ordinary man because he has two houses that belonged
    to the ti'amoni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Po'shaiyanne proceeds to light a stick for lighting cigarettes, and a red
    bracelet, described as beautiful and not coral, is discovered on his wrist.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ti'amoni offers his house in the south in exchange for the red bracelet,
    and Po'shaiyanne accepts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A game is played with four hollow-ended circular sticks, a blanket, and a
    round pebble; Po'shaiyanne selects the stick containing the pebble, while the
    ti'amoni fails in repeated turns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the game, the house in the south goes to Po'shaiyanne.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The next day a bracelet of rare black stone beads is noticed on Po'shaiyanne's
    wrist, and the ti'amoni envies it and offers his house in the east.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ti'amoni makes four little mounds of sand, conceals a small round stone
    in one, and the game is repeated four times; Po'shaiyanne is successful each time
    and the ti'amoni fails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The people are sad when they know that the house in the east is gone, but
    they say nothing because they believe the ti'amoni knows best.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: On another morning Po'shaiyanne wears a turquoise bracelet of marvelous beauty,
    and the ti'amoni offers his house of the zenith for it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The house of the zenith is said to contain many precious things; Po'shaiyanne
    and the ti'amoni play Wash'kasi, and Po'shaiyanne is successful.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the following morning Po'shaiyanne wears large white translucent beads,
    and the ti'amoni offers his house of the nadir for them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Po'shaiyanne and the ti'amoni play a game with six blocks in a large bowl;
