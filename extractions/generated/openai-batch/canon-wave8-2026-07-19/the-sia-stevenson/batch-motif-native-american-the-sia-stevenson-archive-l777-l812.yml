  summary: The passage describes a weekly Sia practice involving horses kept in pasture,
    the war chief’s selection of horses and herders for a round-up, the return of
    herders with horses and colts bearing wood rats tied to their necks, an excited
    scramble by women and children to take the rats, and the preparation of the rats
    as a delicacy.
