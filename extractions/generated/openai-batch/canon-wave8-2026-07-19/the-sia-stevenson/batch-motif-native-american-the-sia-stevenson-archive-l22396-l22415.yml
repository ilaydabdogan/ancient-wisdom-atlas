canonical_text:
  quote: ''
  summary: The passage introduces dancing societies and describes the Otter Dancing
    Society. Members are said to shoot at one another with otter-skin bags, a practice
    compared to the Wacicka dancing society of the Omaha. Some reports say the bags
    were waved to infuse the spirit of the otter into a bead, causing participants
    to be knocked down. Practitioners also professed to keep a small round object
    in the breast, cough it up before or during the dance, shoot a companion in the
    neck with it, and swallow their own shell or pebble at the end.
