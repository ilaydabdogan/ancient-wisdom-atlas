canonical_text:
  quote: ''
  summary: 'The passage reports Dakota and Assiniboin beliefs about the Wakinyan or
    Thunderers: their enmity with the Unktehi, their role as war powers, their gift
    of war implements and protective pigments, dream obligations involving combat,
    circle-dance rituals with a thunder-bird image, Heyoka associations, and accounts
    that thunder is produced by enormous thunder birds.'
  language: English
  quote_policy: summarized
