canonical_text:
  quote: ''
  summary: In this cosmogonic passage, the people of Ha'arts live in darkness and
    dig dwellings in rock and earth because they cannot see. Two northern mothers,
    one elder and larger and the other younger with better mind and heart, consult
    in the chita and decide to make light. Inspired by Sussistinnako, they create
    the sun from shells and stones, carry him east, and release him from behind a
    high mountain so that he rises and lights the world. They then create the moon
    to light the night and be companion and brother to the sun, create star people
    with crystal eyes, and make four houses or villages in the four directions. The
    passage closes with the elder mother hiding a picture under a blanket, asking
    the younger to guess it, and becoming displeased when the younger eventually identifies
    it.
  language: English
  quote_policy: summarized
