canonical_text:
  quote: ''
  summary: The passage describes an irregular football; an Inuit matching game using
    marked ivory pieces; rules for play, matching, and wagering; children's doll and
    snow-hut play; a locally made violin modeled on an outside instrument; and a brief
    assessment of ornamentation and artistic skill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ball is described as two irregular hemispheres joined into a sphere that
    rolls only in a particular direction and has an erratic course.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Inuit called the "Northerners" have a game using sets of irregular ivory
    pieces marked on one face with spot patterns; set size varies from 60 to 148 pieces.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two or more players sit down, pile the pieces, and one player mixes them in
    plain view before the players take portions of the set.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Play proceeds by laying down a piece and requiring opponents to match it with
    a piece bearing a similar design; the game continues until one person exhausts
    all pieces taken.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The game pieces are designed in pairs with named designs, including sled,
    canoe, navel, many, and numbers one through five, and special matching rules are
    noted for a line or bar mark.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The game is known in the Ungava district, but only people who learned it from
    the Northerners are said to be able to play it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Northern Eskimo players are described as wagering possessions and, in some
    cases, temporarily or permanently relinquishing wives to the victor; wives are
    also reported to sometimes play and win themselves back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Little girls are described as playing with dolls, building small snow huts,
    and playing at keeping house; the collection includes eleven dressed dolls and
    doll clothing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The only musical instrument observed is a locally made violin or fiddle, made
    of birch or spruce with two sinew strings, a whalebone bow strip, and spruce gum
    resin, and held across the lap when played.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: An old woman from whom the instrument was obtained could play several airs
    on it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says art is only slightly developed among these people, noting
    that weapons and implements are not adorned with animal carvings or conventional
    patterns, while garment trimming and dolls show artistic skill.
  category: attribute
  evidence_refs:
  - ev:8
