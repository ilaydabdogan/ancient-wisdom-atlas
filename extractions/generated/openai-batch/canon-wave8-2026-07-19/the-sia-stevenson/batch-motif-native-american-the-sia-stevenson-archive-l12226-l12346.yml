  quote: ''
  summary: The passage describes Koksoagmyut/Eskimo tools and implements, including
    older stone, ivory, antler, and horn tools; newer iron and steel tools obtained
    through traders; specialized snow knives, back-scratchers, needle cases, thimbles,
    cushions, and sewing bags; and a brief note on attachment to homeland and recreational
    games between hunts.
  language: English
  quote_policy: summarized
