canonical_text:
  quote: ''
  summary: 'The passage describes ordinary sleeping and eating practices, then gives
    an ethnographic account of Nenenot sweat houses: dome-like structures made from
    bent poles and tent skins, set over heated stones, with water poured on the stones
    to create steam. It notes frequent use, possible delay of travel for a bath, an
    incident in which reindeer nearly run into a sweat house occupied by an old man
    and wife, and the presence of old sudatory remains along traveled paths.'
  language: English
  quote_policy: summarized
