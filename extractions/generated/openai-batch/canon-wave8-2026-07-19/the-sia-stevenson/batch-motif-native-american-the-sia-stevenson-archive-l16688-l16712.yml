canonical_text:
  quote: ''
  summary: A wolverene runs along the seashore and sees geese, brant, ducks, and loons
    sitting in the water. He calls them brothers, says he has found a pretty bees'
    nest, and promises to give it to them if they come ashore and dance. The birds
    go on land. The wolverene says he will sing and instructs them to keep their eyes
    shut until the dance is over. A footnote describes people making loud clamor at
    flocks of brant, frightening them so that they fall and are killed, especially
    during spring migrations.
