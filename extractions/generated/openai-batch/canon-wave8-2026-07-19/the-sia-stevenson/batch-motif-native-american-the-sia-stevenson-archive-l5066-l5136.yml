canonical_text:
  quote: invoke the cloud people to water the earth
  summary: 'The passage describes a rain ceremonial of the Quer''ranna Society: the
    ho''naaite prepares offerings and an altar with a cloud-symbolic meal painting,
    fetishes, bowls, antlers, baskets, feathers, and other ritual objects; participants
    sit at the altar, make a meal path for the being of Quer''ranna, pray and sprinkle
    pollen, move a wand toward the directions and vertical points, and sing with a
    child joining the rite.'
  language: English
  quote_policy: quoted
