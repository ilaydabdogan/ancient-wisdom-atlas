canonical_text:
  quote: ''
  summary: The passage describes a feast given to celebrate success in hunting and
    trapping. The host displays many animal skins, guests sit inside a specially built
    tent, drum songs are performed, pemmican is distributed, and a rule forbids taking
    remnants away because this would cause deer to leave the vicinity. Women are initially
    excluded but later invited to eat remnants. The feast ends after two days with
    a dance. The passage also describes checkers as a common men’s amusement during
    hunting waits and winter evenings, and mentions sleepers waking to relate dreams
    for interpretation.
  language: English
  quote_policy: summarized
