canonical_text:
  quote: ''
  summary: The passage describes polygyny among prosperous men, conflicts between
    co-wives, separation and exchange of spouses, community pressure and conjurer-mediated
    marital transfers, strategies for couples to avoid forced separation, the treatment
    of cast-off or reputedly unlucky wives, seniority in household hierarchy, and
    the formation of extended-family communities under a head man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prosperous husband may take additional wives, sometimes without the first
    wife's approval; three or four wives are sometimes attained, and one case of five
    wives is reported.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Co-wives living in a single snow house are said to come into close contact
    and often quarrel.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that women outnumber men, and that close local relationships
    lead some men to seek wives from other localities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Separation of couples may occur when one spouse leaves, though the departing
    person may sometimes be sought and compelled to return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Temporary wife-taking and exchange of wives are described as frequent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman may be pressured by community sentiment to leave her chosen partner
    and join another man who has bribed a conjurer to connect her presence with relief
    from an illness-causing evil spirit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A couple targeted by such a plot may flee to another locality until the sick
    person recovers or dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A designing woman may cause a man to cast off a legal wife to whom he is attached
    and live with her instead.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Children of a cast-off woman may go with her to live with her relatives, where
    she accepts poor support so that the children may be cared for.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some wives are considered unlucky and may be cast off; a woman with this reputation
    is avoided by men lest she work a charm on them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In social relations the head of the family ranks first, the oldest son second,
    and other sons follow by age.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sons of a first wife take precedence over sons of later wives, while sons
    of a deceased first wife and a later wife may be treated as sons of one wife in
    their mutual relation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a father becomes old or his sons are able to support him, management
    devolves on the eldest son, with the second son delegated second place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The extended family may dwell in one or more tents and move where the leader
    directs.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: Sons, their wives and children, and relatives of sons' wives may form a community
    locally called the head man's gang.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Families reduced by death or marriage may join such a community for protection
    and acknowledge dependence on its leader.
  category: sequence
  evidence_refs:
  - ev:10
