canonical_text:
  quote: ''
  summary: The passage describes a Sia Snake society rain ceremonial in a ceremonial
    chamber, including seating around an altar, ritual dress and implements, rattle-song,
    invocation of cloud people, use of plumes, yaya fetishes, and water. It also gives
    contextual rules for cult society initiation, snake handling, gender restrictions
    in some societies, healing methods, and compensation of the theurgist.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Snake society was joined by the Kaplna in the ceremonial chamber and formed
    a seated line behind the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The h6naaite sat behind a central slat figure, and other members sat near
    corresponding symbolic figures of the cloud and lightning people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An eight-year-old boy was awakened to take his place in the line, while a
    four-year-old boy was led out because he had not entered the degree allowing him
    to hear the songs or see the medicine water being made.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men and boys held gourd rattles in the right hand and eagle plumes in the
    left; women held turkey-plume wands and wore ritual dress and bead ornaments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The vicar stood before the altar, shook his rattle, and waved it in a circle
    over the altar six times for the cardinal points.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the circle indicated an invocation of all cloud people
    of the world to water the earth.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the third stanza, the h6naaite took a yaya in each hand while men swayed
    rhythmically and women waved their wands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the close of the long stanza, the h6naaite called for the cloud people
    to gather, participants drew breath from their plumes, and a woman placed a vase
    of water and gourd before the altar.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says one must pass through three degrees before being permitted
    to handle snakes, and minors cannot enter the third degree until the h6naaite
    judges them amenable to the rules.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women may belong to various orders except the Snake, Cougar, or Hunters and
    Warriors societies; the Snake division of the Snake Society is described as having
    no female members.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Upon entering the medicine order, a new member is presented with the yaya
    fetish by the theurgist, who observes continency for four days before preparing
    it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Cult societies cure disease by sucking or by brushing the body with straws
    and eagle plumes, depending on the stated cause of illness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage distinguishes the medicine ceremonials of the cult societies from
    their rain ceremonials.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The only compensation described for the theurgist's treatment of invalids
    is the sacred shell mixture.
  category: object
  evidence_refs:
  - ev:8
