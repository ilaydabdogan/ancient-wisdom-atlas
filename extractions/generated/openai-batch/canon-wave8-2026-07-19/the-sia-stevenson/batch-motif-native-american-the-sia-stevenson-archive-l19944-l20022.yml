canonical_text:
  quote: ''
  summary: 'The passage describes Kansa rituals addressed to the Thunder-being: cedar
    smoke and prayers at the first spring thunderstorm, a sacred gray hawk-skin bag
    and mystery pipe, war leaders using a chart of mystery songs, restricted sacred
    songs and an invocation gesture, a sacred clam shell that receives pipe smoke,
    a chart figure of Wakanda as first singer and intercessor, warpath petitions,
    and songs to stop or cause rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first spring thunderstorm, the Lu people put green cedar on a fire
    to make great smoke; the storm ceased after members of other gentes offered prayers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buffalo or Tcedunga gens aided the Lu gens by sending a man to open the
    sacred gray hawk-skin bag and remove the mystery pipe; Kinuyinge kept these objects
    but was not allowed to open the bag.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Paha°le-gaqli of the Large Hanga gens and Ali°kawahu of the Small Hanga are
    named as leaders in matters pertaining to war.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paha°le-gaqli had a war chart representing symbols of mystery songs; he said
    a fire should be shown in the middle but he was afraid to draw it without fasting
    and other precautions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The songs connected with the chart are described as very mysterious and not
    to be sung on common or profane occasions, lest the offender be killed by the
    Thunder-being.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A line sung by the Hanga men is identified as an invocation of the Thunder-being;
    the arms are held up toward the sky with palms outward, and each arm is rubbed
    from wrist to shoulder by the other hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the three songs, Paha°le-gaqli carries the sacred clam shell on his
    back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second figure on the war chart is the venerable man or Wakanda, said to
    be the first singer of all the Hanga songs; while the named leaders sing, they
    think he walks behind them, raises his hands to the Thunder-being, and prays for
    them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a Hanga man smokes the war pipe, he holds the pipe in his right hand,
    blows smoke into the sacred clam shell in his left, and the smoke is said to ascend
    to the Thunder-being and be pleasant to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before going on the warpath, the Kansa used to cry to the Thunder-being; the
    captain smoked his pipe and addressed Wakanda while wishing for a Skidi or Pawnee
    Loup to die.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men of the two Hanga gentes sing songs to stop rain when fair weather is needed
    and songs to cause rain during drought.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A footnote reports that the song and Thunder-being invocation are used by
    the Ponka as well as by the Kansa, and contrasts a Hunkpapa Dakota hand motion
    for giving thanks.
  category: other
  evidence_refs:
  - ev:8
