  summary: The passage describes several forms of ritual self-denial and self-injury
    performed while seeking divine assistance, visions, dreams, or revelations. It
    then cites comparable reports about Mandan, Hidatsa, Arikara, Assiniboin, and
    Dakota practices involving bodily sacrifice, offerings, and devotional images.
