  text: Another class passes knives through flesh and waits silently with fixed mind
    for a dream or revelation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some stand near a stream bank with ropes attached to arm and breast muscles,
    gaze into space, and go without food or drink for days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another form of haijmdepi is described as prolonged mental concentration,
