literal_observations:
- id: obs:1
  text: A person fixes the mind on the desired object, waits for a vision from above,
    and is checked daily by an assistant; motion signals that a vision or revelation
    has occurred and leads to release.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some attach a buffalo hair rope to a freshly severed buffalo head, fasten
