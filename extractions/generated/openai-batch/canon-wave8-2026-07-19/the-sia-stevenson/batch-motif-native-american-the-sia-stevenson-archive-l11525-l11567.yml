canonical_text:
  quote: ''
  summary: The passage describes the construction and outfitting of a kaiak, including
    the rower’s position, crossbars, thongs for securing paddles and hunting gear,
    seasonal use in open water, and associated spears. It includes an anecdote near
    Fort Chimo in which a woman sees a wolf damaging a kaiak at a great distance,
    after which the wolf approaches the post and is shot. The passage then describes
    the construction of a spear used for white whales and large seals.
  language: English
