  quote: ''
  summary: The passage describes Omaha nikie tent and robe decorations associated
    with the Pipe subgens, including pipes with feathers attached at right angles,
    the peacemaking importance of sacred pipes, an eagle image on Waqaga's robe, eagle
    birth names, and remarks on the sacredness and restricted character of nikie names
    in Omaha, Osage, and Kansa contexts.
