canonical_text:
  quote: ''
  summary: The passage reports that Omaha and Ponka ancestors believed in a Supreme
    Being called Wakanda, whose location and manner of existence were not specified.
    Belief was described as inward and individual rather than organized in public
    worship. Some people addressed the sun or the Thunder-being as Wakanda. A cited
    Kansa account says Wakanda had not been seen or personified, but was heard in
    thunder, and that a shell was worn in honor or representation of him without being
    considered a likeness.
