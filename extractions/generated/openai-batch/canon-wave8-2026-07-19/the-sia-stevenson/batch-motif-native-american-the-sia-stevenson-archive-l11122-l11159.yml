canonical_text:
  quote: ''
  summary: 'The passage describes the organization and seasonal use of a skin tent:
    guests are assigned places by the host, a central fireplace is reserved for cooking
    and heating, and the tent is moved by umiak as food supplies change. It also describes
    the social importance and vulnerability of tent ownership, storage and damage
    of skins, and ruins of former permanent winter houses said to have been inhabited
    by ancestors, though their abandonment is unexplained.'
  language: English
  quote_policy: summarized
