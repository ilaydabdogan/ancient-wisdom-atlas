canonical_text:
  quote: ''
  summary: The Sia suffer attacks from Skoyo and animals until the Sun father decides
    to relieve them by becoming father of twin boys. Ko'chinako, a virgin, conceives
    after the Sun embraces her and gives birth to male twins, who mature quickly.
    The twins seek their father, cross a spider-web bridge made by their grandmother,
    descend to the Sun's house at the center of a river, and are acknowledged by the
    Sun after surviving ordeals in a heated sweat-house and in houses filled with
    animals. The Sun gives them weapons and powerful rabbit sticks with a warning
    not to use the sticks until they return home; Ma'-a-se-we tests one anyway and
    stops it with shells from his mouth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children who left their homes or villages were captured and eaten by the Skoyo
    and animals, but some parents' vigilance saved the race and the people increased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun father determined to relieve the people and became the father of twin
    boys.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ko'chinako, described as a virgin and the yellow woman of the north, was embraced
    by the Sun while resting during a journey and became pregnant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ko'chinako showed signs of pregnancy in four, eight, and twelve days, gave
    birth to male twins, and the boys could walk four days after birth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spider woman, Ko'chinako's mother, was angry about the pregnancy, left
    near the time of labor, and then returned after her heart softened.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ko'chinako named the first-born twin Ma'-a-se-we and the second U'-yuuyew?,
    and the children grew rapidly in intelligence while remaining small in stature.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The twins repeatedly asked their mother where their father was and were eventually
    told that he lived far away to the east.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The twins insisted on visiting their father, and their grandmother, the spider
    woman, made each of them a bow and arrows before they began the journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the river, the spider woman appeared, spun a web bridge, tested it, and
    the boys crossed it and descended to the center of the river, where they found
    their father's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Sun's wife questioned the boys, became angry when they said the Sun was
    their father, and gave them only scraps of food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Sun returned, acknowledged the boys as his children in a broad statement
    that all people are his children, and ordered that they be given proper food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Sun ordered a large fire in a turquoise-lined sweat-house with hot rocks,
    had the boys shut inside, and ordered water poured on the rocks through the roof.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boys survived the heated sweat-house by spitting tiny shells from their
    mouths to cool it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Sun placed the boys in a house filled with elk, deer, antelope, and buffalo,
    and then in a house filled with bear, cougar, and rattlesnakes; in both places
    he saw them riding the animals without fear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the animal ordeals, the Sun said the boys were surely his children,
    released them, and asked what they wanted.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The boys said they had come only to find their father, and the Sun gave each
    of them a bow, arrows, and three rabbit sticks, warning them not to use the sticks
    until they reached home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Ma'-a-se-we urged testing the sticks; U'-yuuyew? refused because of the father's
    warning; Ma'-a-se-we threw one, and when it traveled far away he stopped it by
    throwing shells from his mouth.
  category: sequence
  evidence_refs:
  - ev:7
