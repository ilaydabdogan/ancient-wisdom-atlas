  quote: ''
  summary: The passage describes preserved bear-lip mementos, seasonal travel to Fort
    Chimo for trade, allocation of goods and winter hunting advances, summer and fall
    dispersal, and reliance on reindeer/deer for food, clothing, and seasonal hunting.
  language: English
