literal_observations:
- id: obs:1
  text: The under lip of the bear is preserved as a memento; the skin is cut off,
    dried flat, painted with powdered hematite mixed with water or oil, edged with
    colored beads, and fitted with a fish-shaped pendant.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bear mementos are obtained with difficulty from hunters because capturing
    the barren-ground bear is dangerous.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In spring, Indians of both sexes come to Fort Chimo to trade the winter hunt
    of fur-bearing animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old men, women, and children approach the post in camp groups by easy stages,
    while other parties arrive from April into May or June.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the post, separated parties meet, rest, and trade furs and other articles
    for guns, ammunition, tobacco, cloth, foodstuffs, molasses, needles, beads, calico,
    and cloth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After receiving an advance allowance for the next winter hunt, the parties
    help raft wood for the next winter’s fuel supply until about mid-July.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men select summer and fall locations, each party head announces an intended
    location, and the parties gradually leave the post.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some Indians formerly assisted with salmon fishing, but were replaced by Eskimo
    because the passage says they were unreliable at that work.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The parties disperse in different directions so the district can provide products
    for them; the passage says they know animal habits and localities well.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Reindeer provide much of the food and skins for clothing; deer are described
    as the main reliance even when other food is abundant.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: In September and October, deer are procured chiefly with lance or spear when
    herds gather near the Koksoak River area.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage describes a seasonal movement of female deer to treeless hills
    and mountains for birthing, followed by return with their young to meeting places
    where males also arrive.
  category: sequence
  evidence_refs:
  - ev:12
