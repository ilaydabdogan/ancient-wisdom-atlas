canonical_text:
  quote: ''
  summary: The passage describes mortuary handling, mourning, dream divination, drum-associated
    trance, and propitiation of patron spirits among the people described. It also
    contrasts their attitude toward corpses with that attributed to Eskimo/Innuit
    and reports that subterranean burial was introduced by missionaries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the ground is frozen too hard to dig, the dead are suspended from tree
    branches, with an effort to return in summer for interment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A distinguished person may be buried where a long-kept fire inside a tent
    has thawed the ground enough to cover the body; the tent is then moved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Indians do not show the same dread of a corpse attributed
    to the Eskimo, and reports taking clothing or implements from deceased Eskimo/Innuit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports scaffold burial and tree suspension as former practices,
    while subterranean burial is said to have been introduced by missionaries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mourning varies according to the dead person's position in life; a mother
    may mourn a favored child for many days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Friends take the body to its final resting place, while relations are said
    seldom to accompany it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people are described as guided by dreams, which are understood as indirect
    nighttime communication with spirits watching over daily occupations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Certain persons gain renown for interpreting dreams and are consulted with
    confidence.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A drum is used while a person enters stupor or trance and then reveals the
    meaning of another person's dream.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that every object and each person has a patron spirit that
