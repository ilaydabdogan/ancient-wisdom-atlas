canonical_text:
  quote: ''
  summary: The passage describes Sia accounts and rituals concerning the Ka'suna,
    including their lower-world creation, their westward dwelling, their role in rain
    or snow dances, requirements for personators, and a child's initiation in which
    masked beings are revealed, ritual discipline and purification occur, and feather
    offerings are deposited at a shrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youth membership in the Kok'ko society is described as obligatory to secure
    admittance to a dance house in the lake of departed spirits; females sometimes
    but seldom join.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sia Ka'suna are said to have been created by Ct'sCt in one night in the
    lower world, to have accompanied the Sia to this world, and to have been directed
    to make their home in the west.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ka'suna are solicited to influence the cloud people, and their dances
    are usually held for rain or snow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ti'amoni controls the appearance of the Ka'suna, while the ho'naaite of
    the Quer'ranna selects men and women for dancing and rehearses songs and dances
    with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those selected to personate the Ka'suna are chosen for grace, endurance, and
    memory for songs, and both sexes must first be initiated into the mysteries of
    the Ka'suna.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before initiation, personators are believed by the Sia to be the actual Ka'suna.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Instruction lasts four to eight days; continency is required, and married
    participants drink an emetic each morning for purification from conjugal relations.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the Ka'suna appear, they are accompanied by Ko'shairi and Quer'ranna
    attendants who assist with apparel and amuse spectators with witty sayings and
    buffoonery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A parent asks the ho'naaite of the Quer'ranna and the ti'amoni for approval
    before telling a child it is time to know the Ka'suna.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ho'naaite prepares a covered meal painting, and the child may enter the
    ceremonial chamber carrying a ya'ya fetish pressed to the breast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the initiation, the Sa'iahlia stamp in the room, the child is led before
    the covered meal painting, and the Ka'suna strike the child's back with Spanish
    bayonet unless the child is already an official cult-society member.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Masks are raised for the child to see, one mask is placed over the child's
    head, and the personators instruct the child to keep the matter secret and to
    have good thoughts and a good heart.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Meal from the painting is rubbed on the child and then on those present for
    mental and physical purification.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The child deposits a ha'chamoni of eagle and turkey plumes at a western shrine
    in a rock fissure, says that the offering is payment for knowing the Ka'suna,
    and the opening is covered with a rock.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
