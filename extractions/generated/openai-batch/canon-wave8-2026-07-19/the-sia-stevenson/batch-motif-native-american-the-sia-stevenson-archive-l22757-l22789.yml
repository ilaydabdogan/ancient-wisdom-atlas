canonical_text:
  quote: ''
  summary: The passage describes the Unktehi giving the Indians a mystery sack and
    instituting the Wakan waipi, or mystery dance, after the production of the earth
    and people. It lists the sack’s animal skins and sacred medicines, describes their
    powerful wakan influence, states that violators of dance obligations are punished
    by beings in forest, earth, air, and water, and adds comparative ethnographic
    remarks about Dakota, Winnebago, and Omaha forms of the medicine or mystery dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Immediately after the production of the earth and human beings, the Unktehi
    gave the Indians the mystery sack and instituted the Wakan waipi, or mystery dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mystery sack is ordained to consist of skins from otter, raccoon, weasel,
    squirrel, loon, one kind of fish, and serpents.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sack is ordained to contain four species of medicines with wakan qualities,
    representing fowls, medicinal herbs, medicinal trees, and quadrupeds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The four representative materials are female swan down, grass roots, bark
    from tree roots, and hair from the back or head of a buffalo.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The combined contents of the sack are said to produce a wakan influence so
    powerful that no unaided human being can resist it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Members who violated their obligations in the Mystery Dance were said to be
    certain of punishment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The passage assigns punitive encounters by domain: in forests, the black
    owl as servant of the Unktehi; under the earth, the serpent; in the air, the eagle;
    and in water, the Unktehi themselves.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A quoted report states that Dakotas belonging to the medicine dance esteem
    the Unktehi as the greatest divinity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the Omaha lack the sun dance but have the wacicka
