canonical_text:
  quote: ''
  summary: 'The passage lists Omaha nikie and related Kansa gens customs: harvest
    protection by Blackbird people, a fog-dispelling turtle drawing with cloth and
    tobacco, breeze-making by Wind people, child naming and first-haircut rites with
    prayers to Wakanda, Hanga buffalo-food restrictions connected with the sacred
    pole, and a Kansa blizzard rite in which a red-painted youth rolls in snow to
    stop the storm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During harvest, birds were said to devour corn, and men of the Blackbird sub-gens
    chewed grains of corn and spat them around the field to prevent this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During fog, a group of men drew a turtle figure on the ground with its head
    toward the south.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small pieces of red breechcloth and tobacco were placed on the turtle figure's
    head, middle of the back, and each leg.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A gens described as Wind people flapped blankets to start a breeze when mosquitoes
    were abundant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One gens had a form for naming a child on the fifth morning after birth, according
    to Lion, a chief of that gens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hanga men belonging to the sub-gens that kept the sacred pole ate buffalo
    tongues, although the buffalo was their grandfather and the eponym of their gens,
    but they could not eat buffalo sides.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other Hanga men, who could not eat the tongues, were allowed to eat consecrated
    buffalo sides after ceremonies connected with thanksgiving and anointing of the
    sacred pole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: An Omaha child's hair was not cut until the child was taken to an old man
    of the Ictasanda gens for first locks to be cut, first moccasins to be put on,
    and prayers to be said.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prayers over the child ask Wakanda to pity the child and ask that the
    child's feet rest or tread on the ground for a long time, with one form adding
    that the child may go ahead or live hereafter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: During a blizzard, Kansa people asked members of the Tcihacin or Ka"ze gens,
    described as Wind people, to interpose and cause one of their children to be decorated
    for good weather.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A youngest son of one of the Ka"ze men, if tall enough, was chosen, painted
    red, and rolled over in the snow, reddening it around him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The red-painted youth rolling in the snow was supposed to stop the storm.
  category: other
  evidence_refs:
  - ev:8
