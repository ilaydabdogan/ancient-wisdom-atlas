canonical_text:
  quote: ''
  summary: The passage recounts alternating tests of knowledge between elder and younger
    sisters. The younger sister uses the Chas'ka bird and its east-west footprints
    to test the elder. The sisters then test each other with blanket-covered or concealed
    objects, including a human figure, an altar, and a covered object containing all
    things necessary for the future. The younger sister is aided by Sussistinnako,
    the Spider Woman. The passage culminates in the younger sister revealing a room
    full of Ka'suna beings, followed by a classification of Sussistinnako's creation
    into three divisions and a note that Ka'suna are personated by masked Sia men
    and women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger sister summons the Chas'ka and instructs it to go from the house
    of the sun in the east along the road to the sun's house in the west and to remain
    there until called.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger sister shows the elder sister bird footprints running in a straight
    line between the sun's eastern and western houses and asks four times which way
    the bird went.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder sister cannot determine the direction of the bird's travel and finally
    guesses that it went east.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The younger sister says the bird is in the west, calls it, and the Chas'ka
    comes running from the west.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The elder sister says the younger sister is greater that day because she knew
    where the bird was and could call it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder sister presents a blanket-covered figure with only crossed feet
    showing and asks the younger sister four times what it is.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prompted by Sussistinnako, the younger sister answers that the covered figure
    is neither man nor woman but something the elder sister has made; the elder sister
    says this is correct and reveals a human figure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The younger sister prepares a covered altar under Sussistinnako's direction
    and asks the elder sister four times to identify it; the elder sister cannot tell,
    and the younger sister uncovers the altar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder sister presents a covered object, and the younger sister, accompanied
    invisibly by Sussistinnako, says it contains all things necessary for all time
    to come; the elder sister says the answer is correct and praises the younger sister's
    head and heart as wise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The younger sister opens an inner room filled with Ka'suna beings with monster
    heads, which she had created under Sussistinnako's direction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Sussistinnako''s creation is classified into three divisions: Pai''-a-ti-mo,
    Ko''-pish-tai-a, and Ka''suna.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that Sussistinnako is referred to as both father and mother,
