  summary: 'The passage reports a statement that there were seven great Wakandas:
    Darkness, Upper World, Ground, Thunder-being, Sun, Moon, and Morning Star. It
    adds that the principal Wakanda is in the upper world above everything, notes
    that this was denied by Joseph La Fleche and Two Crows, and summarizes the author''s
    later view that some or all of these powers had many believers among the Omaha
    and cognate tribes.'
