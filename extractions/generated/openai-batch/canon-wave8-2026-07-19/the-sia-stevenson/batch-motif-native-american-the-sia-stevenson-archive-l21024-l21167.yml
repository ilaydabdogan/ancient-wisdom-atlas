comparison_claims:
- id: claim:1
  claim: The passage itself groups Omaha and unnamed other tribal usage, an Osage
    corn-bestowal tradition, and a similar Arikara corn belief as related examples
    of corn associated with buffalo grandfathers or buffalo-linked sacred kinship.
  claim_level: same_function
  target: Osage tradition of four buffalo bulls or grandfathers bestowing corn and
    Arikara belief about an ear of corn
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The Arikara belief is only mentioned as similar, and the unnamed other
    tribes are not identified in the passage.
- id: claim:2
  claim: The passage cautiously infers that Kansa and Osage beliefs about pipe-dance
    pipes may have functioned like Omaha and Ponka beliefs that regarded such pipes
    as Wakanda-related, with a possible former requirement of vision before undertaking
    the pipe dance.
  claim_level: same_function
  target: Omaha, Ponka, Kansa, and Osage beliefs about calumet or pipe-dance pipes
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The Kansa and Osage comparison is explicitly presented as an inference,
    and the vision prerequisite is introduced only as a possibility.
