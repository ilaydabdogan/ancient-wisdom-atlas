canonical_text:
  quote: ''
  summary: The passage describes links between corn and buffalo in Omaha, Osage, and
    Arikara reports, then catalogs Omaha and Kansa mystery decorations on robes and
    tents associated with visions, animal imagery, inherited decoration rights, color
    conventions, pipe-dance participation, and ritual pipes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Corn is described as a mother and buffalo as a grandfather among the Omaha
    and other tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Osage tradition says corn was bestowed on the people by four buffalo bulls
    or grandfathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports a similar Arikara belief about an ear of corn, without
    giving the full account.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nifactage, a member of the Buffalo order, had a robe with a red band at the
    top, black spots representing buffalo wallows, and blue buffalo hoofs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Duba-ma'i's father had a vision of horses and wished to depict horse tails
    and tracks on his tent, but died before finishing it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father of Ma''tcu-na''ba had a vision of horses and bequeathed his son
    the right to decorate a tent in the associated style; yellow was connected with
    the vision, and a horse-tail was displayed on a pole above a lodge or tent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wacka''hi, as a young child, fell asleep while playing and was aroused by
    the sounds of chickens; in remembrance, he painted his tent with a personal decoration.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An unnamed Omaha had a vision of deer and decorated his tent accordingly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: J,ebi'a, called Frog, was a member of the order of Grizzly Bear shamans; the
    top of his tent was painted yellow and had no other decoration.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The tent of Two Crows' father depicted a grizzly bear emerging from its den
    or from the ground; the ground was painted blue and part of the tent was painted
    as a yellow band.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Kansa man fasted, held mysterious communication with an eagle that gave
    him feathers, danced the pipe dance once, and had a tent showing peace pipes,
    a black bear, and a large turtle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A second Kansa tent belonged to a man who had danced the pipe dance three
    times and displayed buffalo tails, feathers, shields, and stars.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: A third Kansa tent belonged to a man who had danced the pipe dance four times;
    the passage says stars on Kansa tents probably indicate visions, and that after
    dancing the pipe dance twice a man could decorate his tent with four cornstalks.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says the pipes used in the calumet or pipe dance were regarded
    as Wakanda-related by the Omaha and Ponka, and infers that the Kansa and Osage
    had a similar belief; it adds that perhaps the pipe dance once required a vision.
  category: other
  evidence_refs:
  - ev:11
