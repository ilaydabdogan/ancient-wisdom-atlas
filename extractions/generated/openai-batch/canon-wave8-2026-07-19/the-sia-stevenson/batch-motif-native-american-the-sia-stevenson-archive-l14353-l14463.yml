canonical_text:
  quote: ''
  summary: 'The passage describes tools and procedures for preparing animal skins:
    scraping the flesh side with a serrated bone or metal tool, removing and drying
    subcutaneous tissue, tanning with brain, liver, and fat, softening and powdering
    skins, sorting skins for sale or household use, assessing damage from gad fly
    larvae, and smoking selected skins for resistance to moisture.'
  language: English
  quote_policy: summarized
literal_observations:
