  text: A special instrument is used to remove adherent particles from the flesh side
    of a skin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instrument may be made from a hind-leg tibia or large bone shaped into
    a serrated edge functioning like a saw, chisel, and gouge.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some versions use a serrated iron or steel piece set into a bone cavity, or
    a wooden handle with a metal point and a thong loop to keep the hand from slipping.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: For use, the skin is placed flesh-side up over a stake, while the worker kneels,
    lifts an edge, and strikes with the tool to separate subcutaneous tissue.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The removed subcutaneous tissue is washed, dried, and used as coverings for
    bundles of dried meat and other articles.
  category: action
  evidence_refs:
  - ev:3
