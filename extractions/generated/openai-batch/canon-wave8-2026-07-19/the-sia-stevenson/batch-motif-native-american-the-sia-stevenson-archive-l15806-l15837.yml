  quote: ''
  summary: The passage describes weapons used by the Indians discussed in the excerpt.
    It says they formerly used bow and arrow exclusively, but now mostly use guns
    obtained from traders. It describes the bow’s wood, dimensions, elasticity, repairability,
    and deerskin string; the arrows’ length, feathering, and head shape; and notes
    that bow and arrow remain useful for small game because ammunition is costly.
    A round-end snowshoe caption also appears in the passage text.
