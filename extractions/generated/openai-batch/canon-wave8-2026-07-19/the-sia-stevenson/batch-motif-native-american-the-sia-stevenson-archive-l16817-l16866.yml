canonical_text:
  quote: ''
  summary: A young man who lives by hunting deer tells a doe that he needs a tent,
    fire, and water. The doe says her people have fire, water, meat, and enough deer
    for the man's father, and the man consents to go with her. She leads him by a
    valley path to a deer home associated with a large hill, after he leaves his deerskin
    mantle, snowshoes, and arrows behind but keeps his bow. The doe's father, an old
    buck, feeds him and promises deer to the young man's father. The human father
    finds the discarded gear and tracks, concludes that his son has gone to live with
    the deer, and joins other Indians in setting snares on the path. The old buck
    deliberately brings the deer and the young man through the valley to give deer
    to the old man; some deer are caught and killed, but the young man escapes with
    the herd, and his father lets him go.
  language: English
  quote_policy: summarized
