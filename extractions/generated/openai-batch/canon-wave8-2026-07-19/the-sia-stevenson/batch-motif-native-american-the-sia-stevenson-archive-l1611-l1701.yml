canonical_text:
  quote: ''
  summary: The mother warns the two boys against an eastern lake and later a northern
    canyon. Ma'asewe repeatedly persuades his younger brother to go anyway. At the
    lake they encounter and kill a wolf, and at the canyon they outwit and kill a
    cougar who has killed others there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother and grandmother are pleased to see the boys again, while the boys
    want to travel and try the bows their father gave them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother warns the boys not to go near an eastern lake where many skoyo
    and their animal companions live and get water at midday.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ma'asewe says he will not go toward the lake, but after leaving home he urges
    his younger brother to go there, and they follow the indicated road until they
    find it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At about midday a great wolf comes to the lake to drink; the boys first see
    what is later identified as the wolf's reflection in the water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wolf throws a large stick at the boys, and the boys avoid it; the wolf
    wears a stone shirt that can be penetrated only at certain points.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: U'yuuyewe strikes the wolf with a stick, temporarily destroys the protective
    shirt, and then kills the wolf with a second stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ma'asewe cuts open the wolf with a stone knife, removes its heart, and preserves
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the boys return home, their mother questions them, is distressed that
    they went to the lake, and then embraces them after Ma'asewe says they killed
    the wolf.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before another trip, the boys ask where to find good arrow-shaft wood; their
    mother says it is in a northern canyon but warns of a bad man on the narrow road
    who kicks passers into the canyon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ma'asewe again says he will not go, but then persuades U'yuuyewe to accompany
    him to the canyon despite U'yuuyewe's reluctance to disobey their mother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The bad old man is identified as the cougar; he points the boys toward wood
    below and tells them to pass by him along the narrow way.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The boys insist on passing behind the cougar, make him lean forward, press
    on his shoulders, and throw him into the canyon, where he dies.
  category: action
  evidence_refs:
  - ev:9
