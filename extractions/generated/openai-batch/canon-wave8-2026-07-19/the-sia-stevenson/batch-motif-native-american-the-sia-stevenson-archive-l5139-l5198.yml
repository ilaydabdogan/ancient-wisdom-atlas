canonical_text:
  quote: ''
  summary: At the altar of the Suer'-ran-na Society, participants sing and prepare
    medicine water using water, se'wili, pollen, and meal while invoking Quer'rjinua
    and the cloud people to gather and water the earth. The rite includes directional
    waving, sprinkling with plumes and feathers, repeated invocations, administration
    of medicine water, and depositing of offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is set at the altar of the Suer'-ran-na Society and describes
    a ceremony directed toward the cloud people watering the earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: All participants stand while a song continues without cessation for an hour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman brings a vase of water and a gourd from the southwest corner and places
    them before the altar on a line of meal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite takes four medicine bags from the west side of the altar, gives
    bags to a man and a boy, and gives a shell containing pollen to the woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman sways with a wand and shell, pours water into the medicine bowl,
    and invokes Quer'rjinua to intercede with the cloud people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ho'naaite adds se'wili to the medicine bowl; the boy and vicar add pollen
    or meal while petitioning the cloud people.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Successive gourds of water are waved toward the north, west, south, and east
    before being emptied into the medicine bowl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman performs the making of the medicine water because the vicar is described
    as a paralytic and unable to perform the duty.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ho'naaite dips plumes into the medicine bowl and sprinkles the altar three
    times by striking the plumes with a rattle; others repeat the sprinkling while
    he chants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ho'naaite, boy, and vicar dip plumes or feathers into the medicine water
    while calling on the cloud people to gather and water the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sprinkling is repeated alternately six times by each member, and the ho'naaite
    points to the cardinal points during the exhortation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After singing until midnight, the ceremony closes with administering medicine
    water dipped with a shell.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Because the society is depleted, the ho'naaite deposits the hii'chamoni and
    plume offerings himself.
  category: relationship
  evidence_refs:
  - ev:10
