canonical_text:
  quote: the boys tumbled over and over into a lower world.
  summary: Ma'asewe and his younger brother trick the Sko'yo woman into looking into
    a fire and push her into the coals. They enter her large house, find a small circular
    floor-door, and fall into a lower world. After orienting themselves by reference
    to the sun's evening return, they reach a village feast, enter an empty chi'ta,
    take bows and arrows, are pursued, and are carried back up through the door by
    a whirlwind before returning toward their mother.
  language: English
  quote_policy: quoted
