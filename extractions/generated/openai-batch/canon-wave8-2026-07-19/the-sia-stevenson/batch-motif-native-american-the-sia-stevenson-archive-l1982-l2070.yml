canonical_text:
  quote: ''
  summary: Ma'asewe and U'yuuyewg shoot beautiful red lightning arrows, alarming their
    mother and grandmother. Cloud people later bring the arrows back with heavy rain.
    The boys then leave despite their mother's warning about a dangerous western antelope.
    With the help of Ohi'na the mole, who makes an underground road and peephole,
    Ma'asewe shoots the antelope through the heart. The wounded antelope searches
    in the four directions, tears at the tunnel opening with his horn, and dies; the
    mole verifies the death and covers himself with blood as proof.
  language: English
  quote_policy: summarized
