canonical_text:
  quote: ''
  summary: 'The passage contains the end of a wolverene tale, in which wolverene brings
    meat and fat home, violates an injunction by looking at a loaded sled, and loses
    most of the stored food to wolves. It then gives a famine tale: a band lacking
    stored food begs from a provident old man; he feeds a hungry boy, offers food
    in exchange for the boy''s sister as wife, hosts a feast, and helps set thirty
    deer snares that all catch deer as abundance returns.'
  language: English
  quote_policy: summarized
