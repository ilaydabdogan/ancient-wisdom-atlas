canonical_text:
  quote: ''
  summary: The passage contrasts lower-world water deer with deer in this world, narrates
    ritualized deer and rabbit hunts involving Po'shaiyanne, Ma'asewe, 0yuuyew6, the
    ti'amoni, the coyote, fire, meal, and prayer to the sun father, then recounts
    a feast at which Po'shaiyanne's food and water appear miraculously and transform
    some diners. Afterward Po'shaiyanne departs, promises to return first to the Sia
    village, and warns the ti'amoni to leave before another people arrive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the deer found by the Sia in this world are different
    from the lower-world deer, which are called water deer, lived in water, grazed
    over mountains, and were larger with greater antlers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A circle is entered from the southeast; Ma'asewe passes left with half the
    people, 0yuuyew6 passes right with the remainder, and Po'shaiyanne closes the
    opening while standing by the entrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deer are gathered into a close group, shot with arrows, flayed, and carried
    as flesh and skins to the village; Po'shaiyanne instructs that the largest deer
    go to the ti'amoni and smaller ones to the houses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the deer hunt, Po'shaiyanne destroys the circle of meal and returns
    to the ti'amoni, who says they will kill rabbits the next day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the rabbit hunt, a large fire is made; the coyote speaks to the fire,
    throws meal to the cardinal points, zenith, and nadir, and prays that the sun
    father cause rabbits to gather nearby.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people pass their rabbit sticks through the flames, Ma'asewe directs them
    to start, they form a large circle around the rabbits, and many rabbits are secured.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ti'amoni announces a feast; the women work for it, dividing their labor
    between the ti'amoni and Po'shaiyanne, and the feast is ultimately held at the
    ti'amoni's house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the feast the ti'amoni provides mush, bread, and meat, invites Po'shaiyanne
    to bring food, and Po'shaiyanne's food immediately appears on tables in beautiful
    bowls.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: People prefer Po'shaiyanne's table; his water is described as better than
    the ti'amoni's, and those who drink his water and eat his food become whiter,
    while those who cannot eat from it remain as before.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the feast, Po'shaiyanne visits all the pueblos and goes on to Chihuahua
    in Mexico.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Before leaving, Po'shaiyanne tells the Sia that he leaves but will return,
    that the village is his for all time, and that he will return first to that village.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Po'shaiyanne tells the ti'amoni that both of them are ti'amoni and like brothers,
    that the people belong to both, and that the ti'amoni should watch for his return
    and depart the village before another people come near.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: An editorial footnote says the reference to tables may indicate a later date
    for this portion of the cosmogony and a coloring from Christian or biblical teaching.
  category: other
  evidence_refs:
  - ev:11
