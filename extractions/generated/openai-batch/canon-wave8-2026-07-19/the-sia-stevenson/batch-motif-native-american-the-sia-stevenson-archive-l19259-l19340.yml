  text: At the burial of Mazi-kide, a speaker addressed the corpse and said that Wakanda
    had caused the death; an informant later corrected the form to a plural expression
    for the Mysterious Powers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old Omaha and Ponka custom called Abicude involved blowing smoke downward
    to the ground while praying.
  category: action
  evidence_refs:
  - ev:4
