canonical_text:
  quote: ''
  summary: The passage describes pre-ceremonial continence, emetics, bathing, and
    yucca washing; then a rain ceremonial after grain planting in which cries, meal
    or corn pollen, fetishes, medicine water, stone knives, plumes, rattles, tobacco
    smoke, and invocations to Snake ho'naaite(s) and cloud rulers are used to ask
    that the earth be watered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For four days before the ceremonial, continence is observed and an emetic
    is taken each morning for purification from conjugal relations; on the fourth
    day married members bathe and have their heads washed in yucca suds for physical
    purification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described ceremonials occurred after grain planting, and the narrator
    states that rain ceremonials of secret cult societies share songs of supplication
    for rain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cry repeated four times invokes cloud rulers of the cardinal points to water
    the earth, and meal is sprinkled into the medicine bowl with each cry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Members hold small buckskin bags of meal or corn pollen taken from a bear-leg
    skin; the Snake Division sprinkles corn pollen rather than meal because the pollen
    is described as especially acceptable to the Snake ho'naaite.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the preparation of medicine water, the ya'ni^siwittanui dances before
    the altar, keeps south of the line of meal, and holds six pebble fetiches in each
    hand from two small sacks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ya'ni^siwittanui touches two front ya'ya and drops fetiches into the medicine
    bowl and cloud bowl while crying or petitioning Snake ho'naaite(s) of the directions
    to invoke or intercede with cloud rulers to send their people to water the earth.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Two large stone knives are struck together, carried across the line of meal,
    dipped into medicine water, and used to sprinkle the altar and throw water eastward.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: A ho'naaite dips plumes into the medicine bowl and sprinkles the altar four
    times by striking the plumes with a rattle held in the right hand.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a long song closes, men make cigarettes near the fireplace; a boy lights
    a fire-stick for them, and each man blows the first smoke toward the altar and
    waves the cigarette in a circle as he extends it to the altar.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the smoke, the song and rattle resume, and the man at the north end
    of the line cries out; the supplied passage ends mid-sentence after mentioning
    the women.
  category: sequence
  evidence_refs:
  - ev:9
