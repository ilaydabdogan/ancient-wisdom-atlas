  summary: The passage gives a song text and free translation in which ancient ones
    say they ascended from the world below through an entrance. The singers address
    cloud, lightning, thunder, and associated peoples, asking that their thoughts
    come to the singers so the songs may reach cloud priests, who may cover the earth
    with water and make it fruitful. The song names lightning arrows, thunder as wing-flapping,
    and directions or regions such as north, above, and the horizon.
