canonical_text:
  quote: ''
  summary: The passage describes rules and examples concerning Omaha personal mystery
    decorations on robes, blankets, and tents. Vision-derived designs authorize membership
    or use, while unauthorized use may bring anger, misfortune, or lightning danger.
    Examples include bear-cave, lightning, bear-paw, aurora, star, moon, night, and
    Thunder-being related decorations, with some designs treated as personal or kin-transmitted
    property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A decorated robe is described as transferable to certain male descendants
    or grandsons near or at puberty, but not to a daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man could become eligible for membership in the order of Thunder shamans
    through a vision.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An eligible man who wore the decorated robe without inviting order members
    to a feast incurred their anger and subsequent misfortune.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who wore a decorated robe without having had a vision of the relevant
    mystery object risked being killed by lightning when the object was connected
    with the Thunder-being.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: People feared decorating robes, tents, or blankets with objects seen by another
    person in a dream or vision.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tent decoration was identified as the personal mystery of Hupefa, Sr.; after
    his death it became the property of his kinsman Agaha-wocuce.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tent decoration included a top circle representing a bear's cave, four
    zigzag lightning lines of different colors, bear paw prints, a lower part blackened
    with ashes or charcoal, and an association of red with the east.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wanukige had a vision of the aurora borealis and depicted it on robes and
    a tent using seven stripes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: jahe-iapti had a vision of two stars and the new moon, decorated his buffalo
