canonical_text:
  quote: ''
  summary: 'The passage describes the Bain ceremonial of the Snake Society: preparation
    of ha''chamoni and plume offerings, sand paintings before a slat altar, unwrapping
    and arranging ya''ya fetiches and other altar objects, invocation of pai''atamo
    and Ko''pishtaia through images, and a footnoted procedure for collecting willow
    twigs with a plume payment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the morning, the ho'naaite and his vicar prepare ha'chamoni and plume offerings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ha'chamoni are described as symbolic of the beings to whom they are offered,
    with messages or prayers conveyed through notches on the sticks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some ha'chamoni have slender hrr'rotuma sticks, representing official staffs,
    bound to them with yucca threads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: About 4 p.m., the ho'naaite and his younger brother are joined by the third
    member of the society, and the ho'naaite begins two sand paintings before the
    slat altar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the paintings are completed, long buckskin sacks are opened and six
    ya'ya are removed; four belong to the ho'naaite and the others to the vice ho'naaite
    and the third member.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ya'ya are carefully preserved, partly because they are sacred and partly
    because their parrot plumes are costly and difficult to obtain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ya'ya are wrapped in cloth, buckskin, another cloth, splints, and a buckskin
    string.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Three ya'ya are placed on a meal parallelogram at the base of the altar, described
    as seats for the ya'ya.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Altar objects include a sacred honey jug, basket of sacred meal, shell of
    corn pollen, medicine bag, arrow point, pottery bowl, feather wands, a basket
    of offerings, five stone knives, a white stone bear, and a parrot on the central
    slat figure.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women later hold feather wands and form lines on the north and south sides
    of the room.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the altar is complete, the ho'naaite and associates stand before it and
    supplicate the presence of pai'atamo and Ko'pishtaia, whose images are said to
    become abiding places of the invoked beings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the prayer, the ho'naaite and vicar sit near a fireplace where a low
    fire burns, with tobacco and corn husks for cigarettes.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: A footnote describes a selected society member attaching plumes to a willow,
    saying he pays for twigs, then cutting a nearby twig with an ancient stone knife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote states that Sia sand-painting preparation does not differ from
