canonical_text:
  quote: that the cloud people might gather and water the earth
  summary: The passage describes a Knife Society shrine rite in which participants
    drink medicine water, the ho'naaite and vicar exchange the bowl while clasping
    the ya'ya, the vicar sprays medicine water toward the cardinal directions, zenith,
    nadir, and all the world for the cloud people to water the earth, and plume offerings
    are distributed and deposited at shrines. A later readable section describes a
    poor household and states that the Quer'riinna possess se'-wili medicine made
    from mythical medicine plants of the sun and mineral or shell ingredients.
  language: English
