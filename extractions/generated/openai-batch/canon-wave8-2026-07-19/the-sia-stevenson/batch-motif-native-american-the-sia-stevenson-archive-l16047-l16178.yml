canonical_text:
  quote: ''
  summary: 'The passage is an OCR-imperfect ethnographic description of tools and
    practices attributed to Hudson Bay Eskimo and Indians: crooked knives, awls, snow
    shovels, ice-picks, combs, hair boards, swimming boards, fish-hooks, and boys''
    harassment of women with occasional retaliation by women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crooked knife is described as a curved blade set in an upward-bent handle,
    with a thong and wooden button for belt attachment; the passage says no man goes
    on even a short journey without it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crooked knife is held across or at right angles to the body and drawn
    toward the user for whittling or shaving wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Strips and slats for canoes, paddles, snowshoes, and other wooden items are
    said to be made with the crooked knife, requiring skill and thumb pressure to
    steady the blade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The crooked knife is described as an implement used by Indians and Eskimo
    alike and as one of the few implements they have in common.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Awls are described as steel or iron tools, often made from a pocketknife spring
    or small file, fastened in deer-horn handles and used to pierce holes in woods
    used for manufacture.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says the Indian prefers to make simple articles himself rather
    than pay the trader, and can obtain notable results with self-made rude tools.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wooden snow shovels are used in winter to clear paths from tents and bank
    snow around tents; in spring, many aged people carry them to clear paths or as
    walking aids.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A special snow shovel is described for cleaning ice from fishing holes, with
    a blade made from reindeer horn or antler and attached to a wooden handle with
    thongs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Ice-picks are described as formerly made of reindeer horn or bone and later
    of iron or steel, attached to wooden staffs and sometimes usable as walking staffs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Combs are bought from traders, highly prized, kept in birchbark bags, cleaned
    with porcupine tail hair, and sometimes imitated in wood by the natives.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: After a woman's hair is combed, it is divided on both sides of the head, wound
    on small boards, and held by strands of beads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A pair of boards from Little Whale River Indians is reported to assist swimming,
    with one board held in each hand like a paddle; the observer states he has not
    personally seen them used.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A fish-hook is described with a steel or iron barb, while smaller hooks may
    use a rib from a larger trout.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says boys treat females of their age as inferiors, harass women
    with water in summer and snowballs in winter, scatter fuel bundles, and are sometimes
    retaliated against by women who strip a boy of clothing.
  category: action
  evidence_refs:
  - ev:9
