  quote: ''
  summary: On the night before a party leaves Sia, the vicar of the Snake Society
    visits the camp repeatedly, waits until other visitors are gone, directs the tent
    to be secured and a listener posted, handles a vase secretly, places a plume offering
    and meal in it, prays tearfully, and the vase is later taken to Washington and
    deposited in the National Museum.
