canonical_text:
  quote: ''
  summary: 'The passage describes amusements, disgrace, and contests: a severe disfigurement
    imposed on a male produces jokes and ridicule; boys engage in practical jokes,
    running, jumping, wrestling, and weapon practice; girls keep away from boys and
    toss stones or chips; Eskimo/Inuit people are said to practice the same tossing
    amusement; wrestling is treated as a test of strength, sometimes conducted with
    Eskimo opponents, and the contests are said to occur in good humor.'
  language: English
