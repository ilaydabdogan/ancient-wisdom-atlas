  quote: ''
  summary: 'The passage describes weapons and hunting implements: firearms have replaced
    the bow and arrow; a formerly used bow is compared to an East Main Innuit specimen;
    the bow’s larch, sinew, and reindeer-skin construction is described; seven arrows
    are categorized by materials and intended prey; and bow-drawing and carrying methods
    are noted.'
