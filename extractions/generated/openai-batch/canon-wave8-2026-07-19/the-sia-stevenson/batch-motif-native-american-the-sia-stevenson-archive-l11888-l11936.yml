    reindeer skin; the bowstring is twisted sinew with loops at both ends.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Three of the seven arrows are for reindeer and wolves and have iron points
    set in short reindeer-antler foreshafts with wooden shafts.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Three arrows are pointed with large nails, one beaten to a chisel-shaped point,
    and are intended for large game at short range or small game such as hares and
    ptarmigan.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Six of the arrows are feathered with raven tail feathers.
  category: object
  evidence_refs:
  - ev:4
