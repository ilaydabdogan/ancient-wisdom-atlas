  summary: The passage describes snowshoe forms, straps, sizing, fitting, skilled
    use, travel hazards, and seasonal functions. It states that men, women, and children
    wear snowshoes and that winter travel would be impossible without them. It also
    describes flat spruce-board snowshoes from Little Whale River, their use on soft
    snow, their usefulness in spring slush, and notes that Koksoak valley Indians
    do not use wooden snowshoes.
