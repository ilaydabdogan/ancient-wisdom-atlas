canonical_text:
  quote: ''
  summary: 'The passage describes a hunting talisman: a shaman erects on a pole an
    image representing a noted conjurer-hunter, with attached paraphernalia meant
    to help control deer movement. The object includes clothing, a polar-bear-skin
    belt, beads, amulets, a small wooden doll, wooden pieces with bead and lead attachments,
    three bullets, and a semicircular wooden ''hastener'' associated with supernatural
    hunting speed. The whole hanging object is identified as a materialization of
    a Tung ak.'
  language: English
  quote_policy: summarized
