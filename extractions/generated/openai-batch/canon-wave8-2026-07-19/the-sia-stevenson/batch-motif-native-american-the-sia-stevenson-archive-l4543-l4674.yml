canonical_text:
  quote: ''
  summary: The passage describes Knife Society ritual actions around an altar, including
    invocation of cloud people, placement of a cloud bowl, parrot, white stone bear,
    pollen, smoke, and medicine. It then explains an Ant Society sand painting used
    for healing a sick person, in which an ant chief speaks to the invalid, ants are
    drawn to the body surface and eaten by an eagle, and the painting materials are
    disposed of and used for purification. The passage ends with an evening food offering
    to an animal Ko'pTshtaia and a prayer to the cloud people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite held the cloud bowl above his head and invoked cloud people
    of the north, west, south, east, zenith, nadir, and whole world to water the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cloud bowl was set on a yucca pad, with a reed laid across it from northeast
    to southwest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The vice ho'naaite reduced a bit of root to powder and placed it in a heap
    before the cloud bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite returned with a parrot and a white stone bear, and these were
    deposited before the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite prayed, sprinkled corn pollen on the bear and parrot, and the
    bear and bird had eagle plumes attached to their necks with cotton cord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cigarettes of native tobacco and corn husk were lit from a long stick held
