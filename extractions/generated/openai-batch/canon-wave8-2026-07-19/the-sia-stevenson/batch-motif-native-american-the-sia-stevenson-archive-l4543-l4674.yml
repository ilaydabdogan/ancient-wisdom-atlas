  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Ant Society healing painting included a cloud meal emblem, bear-leg skins,
    an ant chief carrying lightning, ant houses, and an eagle.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: In the described healing sequence, the ant chief's words are directed to the
    invalid, songs ask that the malady leave, prey animals are implored to draw ants
    to the surface of the body, the ants are brushed off, and an eagle is asked to
    feed on them.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: After the healing rite, painted elements are gathered into the blanket and
