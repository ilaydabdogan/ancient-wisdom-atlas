    and cardinal points.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The vicar and boy sprinkled the bear and parrot with pollen, and the vicar
    used eagle plumes, a medicine bowl, and a rattle in a fourfold sprinkling action.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: All members prayed before the altar at the close of the afternoon ceremony.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that two slat altars belonged to the Knife Society, and
