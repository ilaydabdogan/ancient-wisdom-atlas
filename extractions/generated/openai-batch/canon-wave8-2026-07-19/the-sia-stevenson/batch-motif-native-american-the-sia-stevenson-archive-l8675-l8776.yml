canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Indian inhabitants divided
    into groups, including Mountaineers and Indians southwest of Ungava. It describes
    territory, subsistence, clothing, trade, relations with Inuit and neighboring
    Indians, contact with missionaries and traders, canoe use, whale processing, and
    polygamy practices affected by missionary intervention.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Indian inhabitants of the region are described as divisible into three
    groups, differing slightly in speech and less in habits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mountaineers roam south of Hamilton Inlet and toward the Gulf of St. Lawrence,
    with imperfectly known western limits, and trade at accessible coastal stations.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mountaineer subsistence is described as relying on reindeer, porcupines, birds,
    hare, and other game, with reindeer scarcity making food supply precarious.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mountaineer clothing is made from tanned deer skin when available, and purchased
    parchment-condition reindeer skins are cut into lines for snowshoe netting and
    other purposes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mountaineers obtain and barter furs of several animals and use the barter
    to procure goods made necessary by contact with white people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mountaineers are described as quiet and peaceable, with many professing
    regard for Roman missionary teachings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that bloody warfare formerly occurred between the Mountaineers
    and the Innuit, and that the Mountaineers used 'Naskopie' as a reproach term for
    more northern Indians.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Indians southwest of Ungava are described physically and in dress, with
    women said to imitate clothing styles of white women at Moose Factory.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The men of the southwest Ungava group hunt and fish, and reindeer scarcity
    near Fort George has led many Indians to move eastward near or with the Naskopies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: These Indians are often employed in capturing white whales and are described
    as eating the whale flesh and blubber, unlike the Naskopies, who refuse it as
    too fat.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Little Whale River Indians' birch-bark canoe is described as turned up
    at each end and well adapted to swift river currents; its occupants are skillful
    boatmen.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage describes some of these Indians as practicing polygamy, outwardly
    conforming to Christianity near the missionary, sending second wives away when
    reprimanded, and taking them back after the missionary departed.
  category: sequence
  evidence_refs:
  - ev:12
