canonical_text:
  quote: ''
  summary: The passage describes ritual paint colors, then summarizes beliefs about
    the Unktehi as powerful aquatic and subterranean beings associated with water,
    earth, creation, offerings, ritual power, mystery sacks, mystery dances, and subordinates.
    It also reports a legend in which children are drawn beneath a river and recovered
    through white-dog offerings, with eating the deity's food affecting the outcome.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paint is described as important in worship; red or scarlet is linked with
    sacrifices, blue with some women's ceremonies, and Dakotas are said to claim that
    gods taught the use of paints.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Unktehi are described as many gods, the most powerful of all, externally
    ox-like, immense, and able to extend horns and tails to the skies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Unktehi are said to inhabit deep waters, especially great waterfalls,
    and buffalo robes are reported as sacrifices to the Unktehi at the Falls of St.
    Anthony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: One account says male Unktehi dwell in water and female spirits animate the
    earth; offerings to water or earth are described as worship to this family of
    gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One Unktehi is said to dwell beneath the Falls of St. Anthony in a large iron
    den.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Dakota cosmogony attributes the making of dry land
    from mud raised from deep water to the Unktehi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Yankton legend, the wife of a special Unktehi covets an Indian child
    and draws him beneath the river; the father offers a white dog, but the recovered
    son dies after emerging because he ate Unktehi food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The parents later lose a daughter in the same manner, but she is recovered
    after an offering of four white dogs because she did not eat Unktehi food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Unktehi are said to send an irresistible wakan influence called tonwan,
    and this power is said to be infused into each mystery sack used in the mystery
    dance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Unktehi are thought to feed on human spirits, and the mystery feast and
    mystery dance are said to have been received from them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The sacrifices required by the Unktehi include swan down reddened with vermilion,
    deer skins, dog, the mystery feast, and mystery dances.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The subordinates of the Unktehi are listed as serpents, lizards, frogs, ghosts,
    owls, and eagles; the Unktehi are also said to have made the earth and men, given
    the Dakota the mystery sack, and prescribed pigment application.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage reports uncertainty about whether Dakota prayers to lakes and
    rivers address the visible waters themselves or the Unktehi believed to dwell
    in them.
  category: other
  evidence_refs:
  - ev:7
