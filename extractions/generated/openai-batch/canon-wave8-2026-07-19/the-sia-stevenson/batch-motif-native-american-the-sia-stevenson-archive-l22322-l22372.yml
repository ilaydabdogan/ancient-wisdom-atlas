canonical_text:
  quote: ''
  summary: 'The passage describes Winnebago symbolic earth formations and related
    ritual forms: a Buffalo dance in which women bring earth to create two truncated
    mounds near the eastern entrance and fire, dancers imitate buffalo and form herd-like
    movement, and the dance is described as a prayer for buffalo abundance. It also
    describes a great mystery lodge fire made from four compass-oriented sticks, an
    initiation sequence framed as death to an old life and raising to a new life,
    a conical ash mound, and an east-oriented sacred depression with a cedar tree
    where visions and spirits are said to tarry.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Winnebago sacred dance tent is described as long and narrow, not more
    than 20 feet wide and 50 to 100 feet long.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buffalo dance is said to be performed four times in May and early June,
    with four men and many women as dancers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: As dancers enter, each woman brings a handful of fine earth, and two truncated
    conical mounds are raised near the east, between the eastern entrance and the
    fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old man explains that this is how all mounds were built and that this is
    why they build in this way for the buffalo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mounds are about 4 inches high and about 18 inches in diameter, and headgear,
    claws, tails, and other articles used by the male leaders are placed on top.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The male dancers imitate the buffalo by wild tramping and roaring, while women
