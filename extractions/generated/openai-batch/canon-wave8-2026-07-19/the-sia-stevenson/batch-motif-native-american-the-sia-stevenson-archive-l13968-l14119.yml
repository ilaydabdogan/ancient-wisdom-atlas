canonical_text:
  quote: ''
  summary: The passage describes the manufacture, ornamentation, and practical use
    of deerskin mittens, head coverings, bead headbands, visors, caps, winter skin
    coats, collars, and hoods. It also notes the adoption or exchange of clothing
    between Indigenous people, white men, and Eskimo clothing traditions in cold or
    wet weather.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Smoked deerskin mittens are made by folding the skin, cutting the mitten shape
    along the fold, sewing the edges, and constructing the thumb from a palm piece
    and a fitted insert.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mittens may be ornamented with red or black cloth strips at the wrists, painted
    lattice-like designs on the backs, rows or zigzags of beads, pendant bead strands,
    and wool tassels.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Severe-weather mittens may be lined with thin fetal reindeer skin, but sweat-moistened
    hair can freeze when the mitten is removed and can endanger the fingers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men's summer head covering may be a gaudy cotton handkerchief wound like a
    turban, or a deerskin thong used to keep long hair from blowing over the face.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Girls and newly married wives make beaded headbands for lovers or husbands;
    the bands are worn over the forehead and tied behind with skin strips.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A deerskin cap may be worn in wet weather, and a stiff deerskin visor may
    be worn over the eyes in spring to reduce glare from snow.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some men wear a high conical red cloth cap ornamented with bead patterns,
    though many men prefer no head covering.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The winter coat for males is made of skins with the hair inside, using front
    and back skins joined by side and shoulder seams, with a neck opening and possible
    inserted pieces to widen the garment.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A square piece at the back of the neck may function as a collar or as extra
    shoulder protection against piercing winds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some winter coats have a hood sewn to the back of the neck, serving as both
    cap and protection; collars and hoods are made from deer head-side skins and may
    be fringed or shaped from multiple head skins.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage contrasts the Indian coat with Eskimo clothing, stating that the
    Indian coat is less adapted for protection and that white men in the region adopt
    Eskimo clothing in cold weather.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Indians accept cast-off or traded clothing from white men; trousers are in
    demand and coats are prized, especially in wet seasons when moisture can damage
    skin garments.
  category: action
  evidence_refs:
  - ev:7
