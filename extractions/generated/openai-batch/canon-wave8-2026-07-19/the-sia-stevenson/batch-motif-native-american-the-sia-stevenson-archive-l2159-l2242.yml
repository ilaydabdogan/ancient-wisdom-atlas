canonical_text:
  quote: ''
  summary: Two boys, Ma'asewe and U'yuuyew6, go to a Ka'suna dance despite warnings
    from their mother and spider-woman grandmother. Their father, the sun, sends them
    quickly by arrows. At the village they are not fed except by one household, which
    they warn to leave. The village is converted into stone. The brothers then ascend
    by rainbow to their father, the sun, who approves their deeds and directs them
    to live in Sandia mountain. Ma'asewe organizes upper-world cult societies; the
    boys remain in the mountain and travel on the rainbow. Their footprints and provisions
    in their mountain house are visible only to certain pure-hearted ritual authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys learn that a great Ka'suna dance is to occur at a ruin village north
    of Sia, whose ti'amoni had invited people from many villages.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their mother and grandmother, identified as the spider woman, warn that the
    boys are disobedient and had previously converted people at Oraibi into stone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boys carry bows and arrows from their father, the sun; the sun tells each
    boy to get on an arrow and shoots both arrows near the dance place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the village, people are eating but do not invite the boys in; the boys
    go from door to door and become angry.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A household apart from the village, consisting of a man, woman, and children,
    invites the honey-disguised boys to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ma'asewe thanks the household and instructs the man, woman, and children to
    leave the village and go a little way off.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the family obeys, the people of the village are converted into stone
    while moving about, and the Ka'suna stand in dance formation; the fate of the
    Ka'suna beings is not known.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ma'asewe says he does not think they should return to their mother and grandmother
    after converting two villages into stone, and the brothers decide to visit their
    father.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A rainbow with its feet on earth and head touching the heavens carries the
    boys quickly to their father, the sun, in midheavens.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sun recognizes them as his children, says they destroyed earth-giants
    who ate his people, approves the petrification of the two villages, and directs
    them to live high above the earth at Sandia mountain.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ma'asewe organizes the cult societies of the upper world before the tiny heroes
    make their home in Sandia mountain, where they continue to travel on the rainbow.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Small footprints at the entrance of their mountain house, identified with
    the crater, can be seen only by the good of heart, especially the ti'amoni and
    certain theurgists; they report seeing fresh melons, corn, and other things inside.
  category: attribute
  evidence_refs:
  - ev:12
