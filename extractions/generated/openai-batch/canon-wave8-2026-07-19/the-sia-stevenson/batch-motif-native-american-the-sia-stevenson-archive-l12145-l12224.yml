  quote: ''
  summary: The passage gives an ethnographic description of deer being speared in
    water, dragged ashore, skinned, butchered, and processed for food and materials.
    It notes the removal and drying of sinew, the tongue as a prized food, caching
    meat under stones for winter use, and moving to another hunting station when deer
    stop crossing.
