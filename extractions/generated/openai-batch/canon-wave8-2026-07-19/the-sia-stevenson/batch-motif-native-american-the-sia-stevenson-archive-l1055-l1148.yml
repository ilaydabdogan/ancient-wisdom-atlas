canonical_text:
  quote: ''
  summary: The passage recounts rivalry between two sisters, the creation of Ko'shairi
    and Quer'ranna as messengers connected with the sun, moon, and Ka'suna, a dawn
    contest manipulated through the bird Shuah-kai, factional fighting, the younger
    sister's killing of the elder sister, the transformation of the elder sister's
    heart into rats associated with cacti, the organization of cult societies by Sus'sistinnako,
    and a later period when the earth becomes filled with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder sister tells the younger to come to her house the next day, and
    Sus'sistinnako warns the younger that she will see fine but bad things there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters plan to go before sunrise to see the sun, each wearing vertical
    wands made of long white eagle under-tail feathers on her head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The younger sister says the elder should go first because the elder is taller
    and greater, while the narration states that the younger knows herself to be greater
    and more important.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sus'sistinnako tells the younger sister that after creating the Ka'suna she
    must create one man as messenger between the sun and the Ka'suna and another as
    messenger between the moon and the Ka'suna.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ko'shairi is created first and is described as courier between the sun and
    the Ka'suna, companion, jester, flute musician, mediator between earth people
    and the sun, chief for the sun in some duties, and servant of the sun during daily
    travel.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Quer'ranna is created second and is described as having duties identical to
    Ko'shairi except that the moon is his particular chief, while both are subordinate
    to the sun.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The younger sister instructs Shuah-kai, a small black bird with white wings,
    to pluck a feather from the left wing and stand before the sun as it leaves its
    house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sisters go early to greet the rising sun, accompanied by men and youths
    carrying bows and arrows; the people divide into factions aligned with each sister.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The elder sister declares that whichever sister the sun looks on first will
    claim the people on her side, and those people will destroy the other side.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shuah-kai obscures the sun's light except through the gap left by the missing
    feather, causing the light to cover the younger sister's wand and face while barely
    touching the elder sister's plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The younger sister's people destroy the elder sister's people after the sunlight
    falls first on the younger sister.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The men fight in a grassy park while the women remain on the mountain top;
    the younger sister later stops the men from fighting and challenges her sister
    to wrestle in the park.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the younger sister grows tired, her people throw the elder sister down
    and bind her hands; the younger sister then kills the elder sister, cuts her breast
    with a stone knife, and removes her heart.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The younger sister cuts the heart into pieces, says it will become rats because
    it was bad, and rats immediately run in all directions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The younger sister finds cactus in the center of the heart and says rats will
    forever live with cacti.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Sus'sistinnako organizes cult societies, teaches all societies rain songs,
    and gives only some societies the secrets for extracting disease by sucking and
    brushing processes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: For eight years after the fight the people are happy and things flourish,
    but in the ninth year the whole earth is filled with water.
  category: sequence
  evidence_refs:
  - ev:11
