canonical_text:
  quote: ''
  summary: The passage describes an Osage and Kansa practice in which selected gentes
    consecrated rows of fireplaces before ordinary village fireplaces could be made.
    Four sticks were placed in a fireplace in directional order, with speeches naming
    winds and associated buffalo or deer figures. It also notes wartime prayers connected
    with fire paint and buffalo-bull decoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a permanent village of earth lodges was established among the Osage and
    Kansa, a certain number of fireplaces were consecrated before ordinary fireplaces
    could be made by common people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The consecrated fireplaces were arranged in two parallel rows, beginning in
    the west and ending in the east.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kansa arrangement is described as seven fireplaces on one side and six
    on the other, while the Osage arrangement is described as apparently seven on
    each side.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Osage, the Tsiou Wactaʇe and Pa°qka gentes are identified as the
    roadmakers who consecrated the two rows of fireplaces.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old Tsiou man made a speech concerning parts of a lodge, including the
    fireplace, building materials, and implements.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Four sticks were placed in the fireplace, and each stick pointed to a cardinal
    direction.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: For the Tsiou leader, the west-pointing stick was accompanied by speech about
    the west wind and a young buffalo bull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the Tsiou leader, the north-pointing stick was accompanied by speech about
    gray buffalo horns or a buffalo bull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the Tsiou leader, the east-pointing stick was accompanied by speech about
    a large buffalo bull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: For the Tsiou leader, the south-pointing fourth stick was accompanied by speech
    about a buffalo cow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A similar ceremony was performed by an aged Pa°qka man for the gentes on the
    right side of the tribal circle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: For the Pa°qka ceremony, sticks pointing east, north, west, and south were
    accompanied by mention of corresponding winds and deer-associated names.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In time of war, prayers were made about the fire when a warrior painted his
    face red with fire paint.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The left or Tsiou side used fire paint, while the right or Haiiʇa side used
    a young buffalo bull decoration.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A warrior’s quoted words identify his little grandfather as dangerous and
    describe the speaker as standing close and ready to attack.
  category: speech
  evidence_refs:
