canonical_text:
  quote: '"Walk ye in remote places, crying to Wakanda."'
  summary: The passage describes an old fasting custom in which youths approaching
    manhood abstain from food and water, put clay on their faces, and cry or pray
    to Wakanda in remote places for aid or power. It also describes later fasting
    practices connected with visions, war parties, visionary animals, and isolated
    fasting lodges among Omaha, Ponka, and Kansa contexts mentioned in the passage.
  language: English with Indigenous-language terms and translated invocations
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Two Crows and Joseph La Fleche heard the fasting custom described as ancient,
    transmitted from old men to youths by earlier elders and said to have been practiced
    for unnumbered generations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old men directed sons, sisters' sons, or grandsons approaching manhood to
    abstain from food and drink, put clay on their faces, and go to remote places
    crying to Wakanda.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The translated instruction says not to eat or drink for three or four days
    and says Wakanda will aid or help the fasters if they act as poor men and pray
    while crying.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After fasting, the youths are described as having dry throats, failing voices,
