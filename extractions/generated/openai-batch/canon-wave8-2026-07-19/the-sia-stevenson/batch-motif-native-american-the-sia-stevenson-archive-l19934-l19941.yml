canonical_text:
  quote: ''
  summary: Shamans are said to know whether an undertaking will result in good or
    evil. A person who wants to join a large hunting party fills a pipe with tobacco
    and offers it to a shaman to prompt prophecy. The shaman may be induced to sing
    sacred songs about the result of traveling in a certain direction, and sometimes
    the predicted event occurs; for example, game may be foretold as given by the
    Thunder-beings.
