canonical_text:
  quote: ''
  summary: A mother wolf sends her daughter to seek the otter as her lover because
    the family is starving. The daughter finds the otter in a lake ice hole, threatens
    to smother him if he will not live on land, and keeps one breathing hole open
    while snow and ice stop the others. Exhausted, the otter comes out and agrees
    to live with her. He then uses a fishing line to catch many fish while the wolf
    prepares a tent, and she brings the fish back to the tent.
  language: English
  quote_policy: summarized
