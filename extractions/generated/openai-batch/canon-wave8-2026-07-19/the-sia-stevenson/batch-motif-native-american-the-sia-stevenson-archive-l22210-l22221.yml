  quote: ''
  summary: The passage reports that the Iowa regarded buffaloes as gods and addressed
    them as Grandfathers. It also describes a doctor handling a joint-snake, calling
    it his god and good medicine, putting its head into his mouth, and biting it twice.
    A final note says human beings may become gods and compares this idea, in that
    respect, to Mormons.
