canonical_text:
  quote: ''
  summary: The passage records beliefs about auroras as spirit torches guiding newly
    dead souls across an abyss to an abundant land, communication with those spirits,
    a hard sky dome and bounded world, rain and thunder controlled by two old women,
    winds caused by directional spirits, and historical traditions concerning the
    Nenenot/Naskopie, neighboring groups, migration, conflict, and later relations
    with Eskimo and white traders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auroras are described as torches held by spirits who wake the souls of people
    who have just died.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirits lead newly dead souls over an abyss at the edge of the world along
    a narrow pathway to a land of brightness, plenty, abundant food, and no disease
    or pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that none but the dead and the raven can go to the land
    beyond the abyss.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the spirits wish to communicate with people on earth, they whistle, and
    the earth people answer in whispers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Eskimo are said to be able to call the aurora, converse with it, and send
    messages to the dead through the spirits.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sky is described as an immense hard dome over the earth, longer east to
    west than north to south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The edges of land and sea are bounded by high precipitous sides that prevent
    living beings on earth from reaching the region beyond, where the source of light
    and heat is located.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sky is described as very cold and sometimes covered with frost crystals
    that fall to earth as snow or frost films.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Clouds are described as large bags of water controlled by two old women; water
    escaping from the seams falls as rain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Thunder is described as the voice of the two old women, and lightning as their
    torch; if a spark falls on someone, that person dies and goes to the region above.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: At each corner of the earth dwells an immense invincible spirit whose breath
    causes wind, with some producing violent storms and others gentle zephyrs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Male wind spirits are said to dwell at the north, northeast, northwest, and
    west, while female wind spirits dwell at the remaining points, each with many
    lesser attendants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Nenenots call themselves by a name glossed as true or ideal red men; neighboring
    western people and mountaineers differ from them in customs and speech to varying
    degrees.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Nenenots are said to have been driven to their present location by wars
    against them, remembered in tradition, and to have fled from their ancestral land
    until a remnant reached the Height of Land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After arriving in the new region, the Nenenots encroached on land held by
    Eskimo, leading to warfare; in later times the groups became more peaceably disposed
    after the arrival of white traders.
  category: sequence
  evidence_refs:
  - ev:8
