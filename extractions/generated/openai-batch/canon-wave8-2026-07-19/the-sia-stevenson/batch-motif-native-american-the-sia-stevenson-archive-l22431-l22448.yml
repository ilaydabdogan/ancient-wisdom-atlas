canonical_text:
  quote: ''
  summary: The passage describes a Green Corn Dance said not to have originated with
    the Iowa but to have been obtained by the Sac from the Shawnee. It is held at
    night, with men and women dancing together, and participants may leave consorts
    and choose new mates without censure. It then describes an Iowa buffalo dance,
    comparing accounts of the dance, buffalo doctors, and a buffalo-hide medicine
    or mystery bag with the Omaha order of buffalo shamans. The passage states it
    is probable that only people with buffalo visions participated and that the dance
    society, buffalo doctors, and buffalo-hide bag were connected. Iowa buffalo doctors
    are described as the only surgeons.
  language: English
