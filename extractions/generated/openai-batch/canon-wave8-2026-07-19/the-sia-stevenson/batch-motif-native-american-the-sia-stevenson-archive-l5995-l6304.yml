canonical_text:
  quote: ''
  summary: The passage gives healing-song material for sickness, including refrains
    asking who is present and requesting that disease be taken away through animal
    theurgists. A free translation describes a human theurgist appealing to the lion/cougar
    of the north for mind and heart to discover and remove disease, with the appeal
    repeated to the other named animals. The passage then gives rain songs in which
    corn pollen passes over directional roads to springs of directional mountains
    so that cloud people may ascend and water the earth. Another rain song locates
    cloud people in directional trees at north, west, south, east, zenith, and nadir,
    with singers pointing to those directions; it notes that the Quer'ranna has the
    same song.
  language: English with transcribed song terms
