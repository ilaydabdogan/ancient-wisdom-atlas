canonical_text:
  quote: ''
  summary: The passage introduces winter storytelling around the fire for instruction
    and entertainment. It then gives a story in which a wolverene calls birds his
    brothers, dresses them in feathers, makes wings for himself, and flies with them.
    The brant warns him not to look below when they hear noise over a point of land.
    On the second turn he looks down at shouting Indians, falls, is mistaken for a
    brant, plucked and disemboweled by an old woman, rejected as rotten, and later
    found to be only a dead wolverene.
  language: English
  quote_policy: summarized
