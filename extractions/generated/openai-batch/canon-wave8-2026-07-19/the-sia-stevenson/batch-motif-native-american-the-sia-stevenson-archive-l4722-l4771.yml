canonical_text:
  quote: ''
  summary: A Sia Knife Society ceremonial passage describes the ho'naaite making a
    smoke offering, distributing medicine water, handling six stone fetiches, arranging
    members and novitiates behind an altar, and directing ash-sprinkling with eagle
    plumes toward the cardinal points, zenith, and nadir for purification. The vice-ho'naaite
    then invokes the cloud people with a gourd rattle through repeated directional
    and circular motions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite and his younger brother put on white cotton embroidered Tusayan
    kilts as breechcloths, while other members wore plain white cotton.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ho'naaite sat behind the altar, lit a cigarette from a long stick, blew
    smoke over the altar, and offered the smoke to Pai'at&mo and Ko'pXshtaia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ho'naaite spoke an offering formula telling the named recipients to smoke
    and be contented.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite administered medicine water to all present with a shell; the
    vice-ho'naaite drank the last draft directly from the bowl and left no drop in
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the drinking, the ho'naaite removed six stone fetiches from the bowl
    and returned them to a buckskin bag.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage states that preparing medicine water is substantially similar
    among Sia cult societies and contrasts Sia practice with Zuni and Tusayan ceremony
    around fetich worship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Members and novitiates formed a line behind the altar; official members held
    two eagle plumes in the left hand and a gourd rattle in the right hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy placed ashes from the fireplace near the altar, east and west of the
    line of meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The boy and an adult member dipped ashes with eagle plumes and sprinkled them
    toward the north, west, east, south, zenith, and nadir, with dancing before the
    altar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ash-sprinkling sequence to the cardinal points, zenith, and nadir was
    repeated fifteen times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explains that this ash-sprinkling was to carry off impurities
    of the mind so that songs would be pure and pass straight over the road of meal,
    called the one road.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The vice-ho'naaite stood before the altar, shook and waved his rattle, invoked
    the cloud people, made directional motions, raised the rattle above his head,
    formed a circle, and repeated the rattle-waving sequence sixteen times.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before each rattle motion, the vice-ho'naaite held the rattle still, resting
    it on eagle plumes in his left hand.
  category: sequence
  evidence_refs:
  - ev:8
