canonical_text:
  quote: ''
  summary: The passage describes Sia theurgistic rites, including explanations of
    disease as caused by witches or angry animals and insects, the organization of
    cult societies, ritual altars and sand paintings, rain invocations involving cloud
    people and offerings, modes of admission and initiation into societies, snake-handling
    degrees, healing by sucking or brushing with plumes, and compensation with sacred
    shell mixture. It also compares selected Sia practices with Zuni and other Pueblo
    practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Disease is described as being produced chiefly by the occult powers of wizards
    and witches or by the anger of certain animals, often insects.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plant medicines are said to be known, but any medicinal use by a theurgist
    is described as requiring fetich medicine and magical craft as supplementation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Zuni have thirteen secret cult societies, while Sia
    have eight, and that both have a Society of Warriors with somewhat different functions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sia and Zuni cult societies are both described as having altars and sand paintings;
    Zuni altars are guarded during ceremonies by members of the Society of Warriors,
    while Sia altars and fetiches are protected only by the theurgists and vice-theurgists
    of their respective societies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The director and vicar of the Society of Warriors are described as representatives
    of mythologic war heroes who are small, invulnerable, and associated with the
    heart of the sun; the director is termed elder brother and the vicar younger brother.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: For rain invocation, cult societies draw a line of meal from the altar to
    the entrance of the ceremonial chamber, associated with the passage of beings
    who influence the cloud people and with images standing before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stated purpose of the rain rite is that the cloud people water the earth
    so that the earth may become pregnant and yield fruits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: To obtain the service of ritual beings, the passage lists offerings including
    a ha'chamoni or notched stick with plumes, gaming blocks, cigarettes, down, and
    bits of precious beads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Eagles are kept caged and turkeys are kept for the purpose of obtaining plumes
    for offerings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Adults or children may join a cult society after restoration to health by
    a theurgist, and parents or guardians may request admission for a child or young
    person using sacred shell mixture.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Most societies are divided into orders; in the Snake division, a person must
    pass through three degrees before being permitted to handle snakes, and minors
    may not enter the third degree until judged able to observe strict rules.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Women may be members of various orders except in the Snake division of the
    Snake Society and in the Cougar or Hunters and Warriors societies, which are described
    as male-only.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A new member entering the medicine order receives the fetich ya'ya from the
    theurgist, who must practice continency for four days before preparing it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: 'Two curing modes are described: sucking when witches have caused illness
    by casting worms, stones, yarn, or similar objects into the body, and brushing
    the body with straws and eagle plumes when angry ants or other insects have caused
    affliction.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Medicine ceremonials of the cult societies are described as distinct from
    their rain ceremonials.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: The only compensation specified for the theurgist's healing practice is sacred
    shell mixture.
  category: object
  evidence_refs:
  - ev:11
