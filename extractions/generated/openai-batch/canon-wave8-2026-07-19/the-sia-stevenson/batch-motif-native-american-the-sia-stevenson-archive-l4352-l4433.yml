canonical_text:
  quote: ''
  summary: A four-night ceremonial sequence for a feverish boy with a severe sore
    throat is described. Ritual officers and members sing, use rattles, eagle plumes,
    straws, medicine water, meal, a blanket, bear-leg skins, and animal fetiches.
    The boy's illness is attributed to ants that entered his body after he urinated
    on their house. The participants invoke the cougar of the north for power over
    the ants, brush the boy repeatedly with plumes and straws while pebbles represent
    extracted ants, purify the boy's house, handle and wave the blanket, lead the
    boy to sprinkle the fetiches with meal, and return him to his mother. The ho'naaite
    is said to remain in the chamber to guard the fetiches and medicine during the
    four days and nights.
  language: English
  quote_policy: summarized
