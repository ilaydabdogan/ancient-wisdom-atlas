  quote: ''
  summary: The passage describes household wooden vessels, bark baskets, buckskin-topped
    storage baskets, deer-leg-skin bags, and ordinary eating practices. It also notes
    that one kind of wooden vessel is identical in shape and function to vessels made
    by Yukon River Indians of Alaska.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each household has wooden vessels of various sizes used as water buckets and
    drinking cups.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wooden vessels are made from thin spruce or larch board strips that are
    steamed, bent into oval or circular forms, overlapped at the ends, sewn with split
    roots, and fitted with a wooden bottom in a groove.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that these wooden vessels are identical in shape and function
    with vessels manufactured by Yukon River Indians of Alaska.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Berry dishes or baskets are made from spruce bark peeled in spring, when the
    bark is flexible enough to bend into shape.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The corners of the bark baskets are sewn with coarse roots from the same tree,
    and the rim is strengthened with a root strip sewn around it with a finer strand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bark baskets are used when women pick berries; during that season both
    women and men are often seen with mouths stained blue by the berries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some baskets of the same shape have buckskin tops sewn to them and closed
    with drawstrings, and they hold trinkets and small articles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Large objects are carried in long or basket-shaped bags made from deer-leg
    skins that are scraped, worked pliable, and sewn together at the edges.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Meals have no regular hours; food is taken directly from a pot or kettle,
    each person helps himself, forks are not used, and food is divided with a knife
    or torn with the fingers.
  category: action
  evidence_refs:
  - ev:6
