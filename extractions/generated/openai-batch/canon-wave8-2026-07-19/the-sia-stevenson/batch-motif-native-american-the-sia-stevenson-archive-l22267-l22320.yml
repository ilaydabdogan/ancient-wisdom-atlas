canonical_text:
  quote: ''
  summary: The passage inventories public or tribal fetishes, including sacred pipes,
    sacred bags called waruxawe, and a concealed sacred stone or iron. It describes
    their ritual use in war, healing, oath-taking, tabooed handling and sight, wrapping
    in skins, repeated sets of seven, and named keepers of sacred pipes among Missouri/Oto-related
    groups.
  language: English
  quote_policy: summarized
