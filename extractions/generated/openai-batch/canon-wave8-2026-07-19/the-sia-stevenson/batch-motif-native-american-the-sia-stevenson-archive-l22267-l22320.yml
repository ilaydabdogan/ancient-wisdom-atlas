  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Iowa claim to possess a mysterious iron or stone used to test men or make
    them swear truthfully; it had not been seen in living memory in 1848, was wrapped
    in seven skins, could not be seen by women even in its outer covering, and was
    dangerous for Mr. Hamilton to look at.
  category: object
  evidence_refs:
  - ev:12
