  quote: ''
  summary: The passage reports Osage, Kansa, and Omaha practices and statements in
    which the sun is addressed as Wakanda or associated with Wakanda. It describes
    Kansa war petitions to the rising sun, a ritual attack on a stick representing
    an enemy, directional prayer toward the rising and setting sun, east-west symbolism
    in corpse and lodge orientation, and Omaha fasting prayer to the sun for superhuman
    power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in Osage traditions the “mysterious one of day” is
    invoked as “grandfather” and that this being replies that he is not the only Wakanda.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a Kansa war-related ritual, a war captain addresses the rising sun,
    asks to kill a Pawnee and return with horses, and promises a calico shirt, a robe,
    and a blanket to Wakanda if he returns safely.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says members of the Lii or Thunder gens could not participate
    in the attack on the stick representing the foe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the described Kansa ceremony, a sacred bag is carried, bundles of sticks
    are laid in the road, a circle is drawn around the bundles, one stick is set up,
    and warriors attack it as if it were a Pawnee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that among the Osage and Kansa, prayer was made toward
    the rising sun in the morning and toward the setting sun in the afternoon and
    evening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Omaha and Kansa corpse and lodge orientations are
