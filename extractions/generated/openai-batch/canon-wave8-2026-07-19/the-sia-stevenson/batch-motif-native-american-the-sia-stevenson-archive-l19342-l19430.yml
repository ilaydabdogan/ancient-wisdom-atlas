  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gahige reported that Omaha people prayed to the sun with hands raised and
    palms toward the sun, saying “O Wakanda, pity me.”
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Omaha men described abstained from eating, drinking, and ordinary smoking
    from sunrise to sunset, and the restrictions were removed after sunset.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men who prayed in this way did not sleep at home for four nights; after
