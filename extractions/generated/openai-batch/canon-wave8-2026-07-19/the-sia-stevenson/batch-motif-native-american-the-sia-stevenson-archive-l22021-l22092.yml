  quote: ''
  summary: The passage describes Omaha, Ponka, and Kansa beliefs and customs concerning
    ghosts, offerings, death, and future life. It includes instructions to a departing
    spirit, ancestral oversight, offerings of soup to ghosts, denial of bodily resurrection
    for Omaha and Ponka, reports of invisible ghosts, a Kansa mourning act involving
    a lock of hair called the ghost, Kansa thunder-related death beliefs, afterlife
    paths, burial provisions for travel, apparent-death journeys to strange villages,
    and localized Kansa spirit villages.
  language: English
  quote_policy: summarized
