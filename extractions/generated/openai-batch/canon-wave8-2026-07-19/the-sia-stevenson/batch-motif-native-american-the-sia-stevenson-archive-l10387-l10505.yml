canonical_text:
  quote: ''
  summary: The passage describes tattooing practices associated with women and puberty,
    including seclusion, skin-pricking with a soot-and-oil mixture, a four-day operation,
    and menstrual clothing and touch restrictions. It then describes clothing materials,
    garments, infant clothing, footwear, exchange of footwear-making between Eskimo
    and Indian women, and a birdskin cap obtained from northern traders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In former years women were tattooed with curved lines and rows of dots on
    the face, neck, arms, and legs up to mid-thigh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tattooing custom declined after some dhanuin declared that a prevailing
    misfortune resulted from tattooing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the time described, tattooing was limited to a few single dots on the body
    and face.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a girl reaches puberty, an old woman versed in tattooing takes her to
    a secluded locality and removes her clothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A half-charred moss lamp wick is mixed with lamp oil, a needle pricks the
    skin, and the mixture is smeared over the wound; the blood mixes with it and leaves
    a dark-bluish spot after one or two days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The puberty tattooing operation lasts four days, and the girl's return to
    the tent indicates that she has begun to menstruate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A menstruating woman must alter her lower garments, partially glove her right
    hand, leave her left hand uncovered, and avoid touching certain skins and foods
    in use during that season.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Koksoagmyut are described as clothed mostly in animal skins, with reindeer
    skin favored and seal skins also used.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Young boys and girls dress alike, and females do not wear adult garments until
    puberty.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Infants carried in the mother's hood may wear garments made from reindeer
    fawn skins.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Eskimo women sometimes employ Indian women to make moccasins and give sealskin
    boots in return.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A cap obtained from northern traders is described as copied from a white man's
    cap and made with guillemot, sea-pigeon, and sealskin parts.
  category: object
  evidence_refs:
  - ev:12
