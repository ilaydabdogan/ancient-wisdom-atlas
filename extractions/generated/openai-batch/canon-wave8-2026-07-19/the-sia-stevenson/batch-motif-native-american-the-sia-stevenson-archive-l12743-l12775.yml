  text: The children's increased shouting frightens the seals, which dive out of sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: An angry man wishes that the cliff would topple over and bury the noisy children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The cliff tips over, the children fall among rocks and stones, and they are
    changed into guillemots or sea-pigeons with red feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The guillemots are said to dwell among debris at the foot of cliffs next to
    sea water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:8
  text: The raven is described as having been a man who repeatedly called out that
    people moving camp had forgotten a lower deerskin bed blanket called kak.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When told to get the blanket himself, the man hurries and is changed into
    a raven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The raven's present call is interpreted as the sound 'Kak! kak!' and as a
    reminder not to forget the blanket.
  category: speech
  evidence_refs:
