canonical_text:
  quote: ''
  summary: Three short etiological accounts explain the origin or present traits of
    guillemots, ravens, and loons. Children whose shouting scares seals are transformed
    after a cliff collapses into guillemots living among rocks by the sea. A man repeatedly
    saying the word for a deerskin bed blanket is transformed into a raven whose call
    repeats that sound. A loon receives a white breast and square spots on its back;
    after being laughed at by a raven, it escapes to the water and hides its back.
  language: English
  quote_policy: summarized
