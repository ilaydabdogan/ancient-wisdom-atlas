canonical_text:
  quote: ''
  summary: 'The passage gives a technical ethnographic description of a Nenenot sled
    and snowshoes: sled construction with boards, bars, thongs, traces, load placement,
    and use in journeys and camp changes; and snowshoe styles, frame materials, netting,
    needles, toe openings, straps, and single-bar variants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sled is constructed from two boards strengthened with bars, twisted thongs,
    notches, side lines, and long thongs used as traces for dragging.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sled bottom is shaped with a narrow nose, a wider section near the first
    and second bars, and a narrowing heel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two boards are used because a single broad board is unavailable and would
    split; the two-board construction makes the sled less stiff and able to bend over
    rough ground.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The load is placed so that its weight rests chiefly on the ground-bearing
    portion of the sled, and the sled's length helps the person guide it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On journeys, younger women and men drag the sled; when men return to the station
    to trade, men alone drag it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A small dog is sometimes hitched to the sled by a thong, gives little assistance,
    and is kept from wandering in search of game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Household effects, including a tent, cooking utensils, clothing, and other
    articles, are put on the sled when people change camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Four snowshoe styles are named: swallow-tail, beaver tail, round end, and
    single-bar.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Snowshoe frames are wooden, usually in two pieces joined by lap splices and
    wrapped with deerskin thongs; birch is preferred, but spruce and larch are generally
    used.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Snowshoe netting is made of hairless dried deerskin cut into strips, and a
    flat bone, horn, or iron needle with a central eye is used for netting.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Different parts of the snowshoe use different mesh fineness, and toe and heel
    netting are held by lines, loops, bars, and frame attachments.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A semicircular opening near the toe-bar admits the wearer's toes and allows
    free action while walking.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The snowshoe is held to the foot by a wide buckskin thong adjusted around
    the toe and heel to avoid slipping or painful pressure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Single-bar snowshoes are little used because they are difficult to make; the
    described styles place the bar either under the center of the foot or in front
    of the toes.
  category: attribute
  evidence_refs:
  - ev:7
