canonical_text:
  quote: ''
  summary: Coyote, described as industrious but deceitful, seeks to become a ho'naaite
    under Cougar. During ritual preparation he is supposed to fast and deliver food
    offerings to Ko'pishtaia, but secretly eats the offerings. After being ordained,
    he fails to catch a deer, while Cougar's companion succeeds quickly. Cougar exposes
    the eaten offerings, excludes Coyote from the meat, removes him from office, and
    declares that he will roam and hunt game unsuccessfully thereafter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the world was new, Coyote was industrious, always traveling and working,
    but his thoughts were described as not good.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote falsely told different camps that he belonged to the Corn people and
    to the Knife people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote asked Cougar, who is presented as an authority connected with all game,
    to make him a ho'naaite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cougar said Coyote could become a ho'naaite when his thoughts were good, and
    told him to return in four days to make ha'chamoni.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Coyote and Cougar worked for eight days preparing ha'chamoni while practicing
    fasting and continency; Coyote was also supposed to abstain from food, drink,
    and smoking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each night Cougar gave Coyote food to offer to Ko'pishtaia; after the first
    night, Coyote ate the food himself and kept this secret.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Cougar's body changed so that he became straight and had no belly, while Coyote
    did not change in appearance; Cougar began to suspect Coyote was not making the
    offerings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: After continued work and singing, Cougar taught Coyote the song of the Coyote
    Society ho'naaite, and Coyote was ordained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cougar told Coyote to kill a deer and bring back the meat; Coyote chased a
    deer all day without catching it and returned tired.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Cougar said Coyote had eaten the food intended for Ko'pishtaia and stated
    that this was why Coyote failed to catch the deer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At dawn, one of Cougar's people went out, saw a deer nearby, sprang on it,
    caught it before sunrise, and brought back the meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cougar was pleased, said Ko'pishtaia would be paid with plumes, and led the
    eating of the deer meat; Coyote was not given meat because his thoughts were not
    good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cougar told Coyote that he was no longer a ho'naaite and that he would travel
    quickly, work much, but never understand how to kill deer, antelope, or other
    game.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage ends by saying that since that time Coyote always hunts deer,
    rabbit, and other game, but is not successful.
  category: sequence
  evidence_refs:
  - ev:7
