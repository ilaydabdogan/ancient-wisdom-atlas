literal_observations:
- id: obs:1
  text: Marriage is described as consent to live together, sought by request when
    possible and by force when necessary.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The suitor seeks consent from the girl's parents or nearest relatives and
    may win them over with presents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If an unmarried girl does not wish to comply, the prospective husband is told
    her relatives cannot change her heart, and she is later taken forcibly to his
    or his father's tent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The couple's bond is described as loose and dissolvable by either party on
    slight provocation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Taking second, third, or fourth wives is described as not uncommon, mainly
    among wealthy men, with additional wives taken principally for labor connected
    with a successful hunter's household.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several wives may live in the same tent, and jealousies among them may lead
    to fighting.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes reciprocal domestic violence and says public ridicule
    after being beaten is especially hard to endure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In one incident near Fort Chimo, an enraged wife stripped her husband, dismantled
    the tent, took property to a canoe, paddled upstream, then later relented and
    resumed relations with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rivalry for the favor of a woman or man may lead to serious affrays; one reported
    case involved two men fighting from canoes with deer spears, after which one died
    and the other obtained the woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women are described as performing drudgery, bringing home animals killed by
    husbands, fetching wood and water, tanning skins, making clothing, erecting tents,
    hauling sleds, and doing most manual labor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women are explicitly said to be considered inferior to men in the described
    social life.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Females are said to reach puberty at fourteen or fifteen and to be taken as
    wives at even earlier ages.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The newborn child is not allowed nourishment until the third day, and no water
    is allowed to touch its body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The infant is swaddled in skins and cloths, with sphagnum moss placed next
    to the body and changed every other day.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Girls are described as neglected, while boys are given advantages and later
    show domineering behavior toward the other sex.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Twins are said to be rare, and the husband of the woman at the time of birth
    is treated as the father when paternal origin is obscure.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage reports that Naskopie mortuary customs were imperfectly learned,
    and that at the trading station a body was buried like a white man's in a shallow
    sandy grave, in a rudely made coffin, covered with dirt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: A small branch from a tree was placed at the head of the grave, but the narrator
    could not determine its signification; the reply given was that white men put
    something at the head of graves, and so do the Indians.
  category: object
  evidence_refs:
  - ev:9
