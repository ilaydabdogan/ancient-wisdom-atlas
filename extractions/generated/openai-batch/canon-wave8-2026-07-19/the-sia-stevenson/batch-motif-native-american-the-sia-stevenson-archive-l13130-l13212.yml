  summary: The supplied passage describes marriage negotiation and coercion, polygyny,
    spousal and co-wife conflict, gendered labor, childbirth and infant care, child
    status, twins and paternity, and a reported Naskopie burial practice involving
    a shallow grave, coffin, and a tree branch placed at the grave head with uncertain
