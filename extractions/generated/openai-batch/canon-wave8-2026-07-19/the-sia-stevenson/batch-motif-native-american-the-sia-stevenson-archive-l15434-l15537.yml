literal_observations:
- id: obs:1
  text: Each canoe differs according to the maker's personal taste or need, but it
    must be able to transport the owner, family, and household property when camps
    are changed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Canoes may be small or large and may be owned in common by two or more individuals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Construction begins with selected trees that are split into straight-grained
    slats, shaved to thickness, and seasoned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bark is cleaned of outer layers, soaked in fresh water, and laid over an earth
    mold shaped like the canoe interior.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bark is sewn with prepared spruce roots, and the root threads are soaked
    so they become flexible.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rails, bow and stern pieces, longitudinal strips, ribs, and thwarts are fitted
    to form and stiffen the canoe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The builder watches the symmetry and balance of the canoe by eye, lets it
    season and dry, and may wet it to prevent rapid splitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Seams are sealed with a hot mixture of spruce gum or resin and seal oil.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the gum has seasoned, the canoe is tested on water for speed and seaworthiness,
    and leaks or needed repairs are addressed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: People without canoe-building skill employ experienced builders known for
    making excellent boats.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two canoe types differ only in the shape of stern and prow; a later form is
    described as influenced by neighboring East Main Indian canoes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Because birch suitable for canoe bark is unavailable near Fort Chimo, traders
    import bark bundles from St. Lawrence river and gulf stations.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: A black fox skin is given as the value needed to purchase one bundle of bark.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: In spring, men prepare strips and bark for the canoe before river ice breaks
    and navigation opens.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The paddle has one blade and is used with both hands on alternate sides; during
    portage, the canoe is carried on the shoulders with a center thwart resting near
    the back of the neck.
  category: action
  evidence_refs:
  - ev:7
