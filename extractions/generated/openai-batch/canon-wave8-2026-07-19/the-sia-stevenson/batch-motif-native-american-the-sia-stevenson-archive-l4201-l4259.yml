canonical_text:
  quote: ''
  summary: 'A ritual sequence in a rain/healing ceremonial: the ho''naaite and other
    participants sprinkle an altar with medicine water, call on cloud people and animals
    of the cardinal points, chant, distribute medicine water to those present, cast
    medicine water toward the directions, divide offerings, send two men to deposit
    offerings at a Ko''pishtaia shrine, and end with food and a feast.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite dips plumes into medicine water, sprinkles the altar, and calls
    for cloud people to gather and water the earth so it may be fruitful.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each member repeats the altar sprinkling with a prayer; the little girl participates
    with strong vocal effort.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Men strike plumes in their left hands with rattles held in their right hands,
    while the woman and child strike one wand with another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each person repeats the altar sprinkling six times, with appeals to animals
    of the cardinal points.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The choir remains arranged so that no more than one member is absent from
    the singing line at a time during the sprinkling sequence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After a sung stanza, the altar is again sprinkled six times by each member
    while the choir is grouped before the altar and the ho'naaite remains seated behind
    it in song.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the conclusion of the chant, the ho'naaite sprinkles the altar four times
    from his seated position by leaning forward to dip his plumes into the medicine
    water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ti'amoni and the ya'ni^siwittanni advance from opposite ends of the line
    and sprinkle toward the cardinal points along the line of meal; the sprinkling
    is repeated twice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ya'ni^siwittanni moves the bowl of medicine water, places it before the
    fetiches and on the meal line, and administers medicine water to those present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The girl receives the first draught of medicine water from an abalone shell,
    the woman and infant receive water next, and the ho'naaite receives the last draught.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The ya'ni^siwittanni leaves the house with the bowl, fills his mouth from
    it, and throws medicine water through his teeth toward the cardinal points before
    returning the bowl and ya'ya to their place before the altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ho'naaite gathers ha'chamoni, takes meal, offers silent prayer before
    the altar, sprinkles the altar and ha'chamoni, and divides the offerings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The ti'amoni and a companion clasp the ho'naaite's hands and respond to a
    low litany; the ho'naaite draws breath from the plumes and lays them on blankets
    over their left arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The ti'amoni and companion leave the ceremonial chamber in darkness to deposit
    offerings at a shrine of the Ko'pishtaia.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the offering-bearers return, they stand before the altar and pray; all
    members gather before the altar and ask that their prayers be answered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The woman and girl arrange bowls of food in a line, and a feast closes the
    ceremonial at 2 a.m.
  category: action
  evidence_refs:
  - ev:8
