  text: One cited myth says that an orphan killed a Wakandagi with seven heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Omaha tradition reports a Wakandagi seen in a lake into which Blackbird
    creek empties, near the Omaha agency.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The source says it is impossible to determine whether the Wakandagi and the
    j^ande or Ground were differentiated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kansa Mialucka are described as dreadful beings with large heads and long
    hair, dwelling in remote places and enticing unwary solitary travelers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The source says an enticed victim became crazy and later lived in a role named
    in the source as mi"quga or c'atamite.
  category: sequence
  evidence_refs:
  - ev:3
