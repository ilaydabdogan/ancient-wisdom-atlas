canonical_text:
  quote: ''
  summary: 'The passage describes Omaha, Ponka, and Kansa accounts of subterranean,
    aquatic, forest, and other fearful beings: Wakandagi beneath bluffs and in water;
    Kansa Mialucka as dreadful beings, some underground or aquatic, with an ancient
    benefactor who creates buffalo and teaches archery; and the Ponka Inddafiuga as
    a forest bogy. It also notes Omaha child-warning figures, Two Faces, Ictinike,
    and comparisons with Dakota beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha and Ponka are said to believe in Wakandagi, monsters dwelling beneath
    bluffs and in the Missouri river, with very long bodies and horns on their heads.
  category: attribute
  evidence_refs:
