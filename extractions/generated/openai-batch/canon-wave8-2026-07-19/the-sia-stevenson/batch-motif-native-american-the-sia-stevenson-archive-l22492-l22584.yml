canonical_text:
  quote: ''
  summary: The passage surveys external accounts of Dakota and Assiniboin religious
    practices. It disputes a simple pre-contact Dakota belief in one Great Spirit,
    describes reports of Wahconda appearing in animal forms and granting medicine,
    summarizes varied spirit and sacrificial practices, and explains god-seeking as
    a religious quest for dream or revelation involving purification, fasting, seclusion,
    and sometimes severe bodily ordeal.
  language: English
  quote_policy: summarized
