canonical_text:
  quote: ''
  summary: 'The passage contains three folk narratives: a jealous man pursues two
    fleeing women and violently controls them near a whale carcass; an abused orphan
    boy receives secret help from a girl and supernatural empowerment from a man in
    the moon, then takes revenge and spares the girl; and an origin account explains
    the sun, moon, stars, and eclipses through a brother and sister who flee and pursue
    one another into the sky.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in love with two women is described as so jealous that he forbids them
    to look at or speak to others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two women grow weary of the restrictions, flee along the coast, become
    faint from hunger, and decide to stay near a whale carcass on the shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A conjurer tells the deserted man to go to a place with a whale carcass, hide
    nearby, and watch for the women.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man finds the women, seizes one, binds her with thongs, and puts out the
    eyes of the other so she cannot look at any man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Animals come to feed on the whale remains, and the man catches foxes and other
    valuable furs before returning to camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An orphan boy without living relatives is maltreated, kept like a dog, denied
    a knife, and given poor food or scraps.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A little girl secretly gives the orphan boy a knife and better food when she
    can do so without being noticed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In despair, the boy gazes at the moon, sees what he thinks is the face of
    a man, and asks him for help escaping his miserable life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The man from the moon descends, beats the boy, and the beating makes the boy
    grow larger and stronger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After gaining strength, the boy throws rocks along the beach and changes the
    character of the water's edge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The enlarged boy kills his former persecutors by dashing them against rocks,
    but leaves alive the little girl who had helped him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The helpful girl becomes the boy's wife, and the boy returns to natural size
    and lives in comfort.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says the orphan story was obtained from a man from Labrador and
