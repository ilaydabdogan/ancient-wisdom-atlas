- id: obs:4
  text: The person seeks the good will of the evil spirit by offerings of food, water,
    and clothing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spirit is often represented in a material form as a doll carried on the
    person, and may be carried in an ammunition bag to insure success in the chase.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: If misfortune occurs, it is attributed to the attending spirit; if the spirit
