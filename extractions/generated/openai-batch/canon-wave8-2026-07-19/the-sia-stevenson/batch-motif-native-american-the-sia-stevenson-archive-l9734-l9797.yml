canonical_text:
  quote: ''
  summary: The passage describes a society in which a recognized leader and a conjurer
    or medicineman determine collective action. It explains a spirit system in which
    all affairs are controlled by spirits under a greater spirit. Each person is attended
    by a malignant guardian spirit that may be propitiated, embodied in a carried
    doll, punished, deprived, or transferred unknowingly to another person through
    an object. Nature places and elements also have malignant guardian spirits requiring
    offerings. The lesser spirits are under the great spirit Tung ak, identified with
    death, whom only the shaman can deal with.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says there is no chief, but there is a recognized leader influenced
    by a conjurer or medicineman; these two decide what shall be done.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: All affairs of life are described as being under the control of spirits, each
    ruling a certain element, with all spirits under a greater spirit.
  category: relationship
  evidence_refs:
