  quote: ''
  summary: The passage describes the Sia emergence into the upper world, the accidental
    release and later arrangement of stars, the closing of the lower-world doorway
    against the waters, the cloud, lightning, thunder, and rainbow peoples and their
    work in Ti'nia, offerings and ritual correspondences between cloud people and
    Sia ceremonies, the northern emergence opening called Shi-pa-po, and the origin
    of corn from tTt'set's heart as nourishment for her people.
  language: English
  quote_policy: summarized
