    stole the secret of the wheels, referring to bicycles, from the cloud people.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:6
  type: summary
  locator: lines 1277-1284
  quote_or_summary: Cloud people keep behind masks of different cloud forms; H6n'nati
    are white floating clouds for pleasure, and Ile'lish are plain-like clouds behind
    which cloud people water the earth.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:7
  type: summary
  locator: lines 1284-1288
  quote_or_summary: Men, women, and children bring water in gourd jugs and vases from
    mountain-base springs, ascend to the tree base, pass through the trunk to the
    top reaching Ti'nia, and go to sprinkle the appointed place.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:8
  type: summary
  locator: lines 1288-1298
  quote_or_summary: Weather peoples have priestly rulers and theurgists, subordinate
    to cloud-priest structures and to Ho'chiinui; cloud ceremonials are said to be
    similar to the Sia, and Sia slat altars represent cloud and lightning cult society
    members.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:9
  type: summary
  locator: lines 1299-1308
  quote_or_summary: A cloud priest directs requests for thunder and lightning assistance;
    people of Ti'nia are compensated by Ha'arts with shrine offerings, including reed
    cigarettes filled with bird down, precious beads, and corn pollen.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:10
  type: summary
  locator: lines 1309-1317
  quote_or_summary: Lightning people shoot arrows to increase rain, thunder people
    have human forms with wings of knives that make noise, rainbow people make beautiful
    bows, and war heroes traveled on those bows.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:11
  type: summary
  locator: lines 1319-1324
  quote_or_summary: The Sia enter this world in the far north through the opening
    called Shi-pa-po, gather into camps, move a short distance, and build a village.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
- id: ev:12
  type: summary
  locator: lines 1324-1337
  quote_or_summary: With only grass seeds for food, tTt'set makes fields north, west,
    south, and east of the village, plants bits of her heart, corn evolves, and she
    declares the corn her heart and like milk from her breasts for her people.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/the-sia-stevenson.md
  rights_note: Public domain source; summary provided.
