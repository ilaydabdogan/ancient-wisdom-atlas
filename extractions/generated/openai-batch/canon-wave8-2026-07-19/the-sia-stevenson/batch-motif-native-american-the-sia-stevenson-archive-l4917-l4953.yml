canonical_text:
  quote: ''
  summary: The passage describes a Knife Society shrine ceremony in which songs accompany
    sprinkling of the altar and directional sprinkling with medicine water and suds,
    social smoking toward the altar, directional waving of baskets of ha'chamoni,
    and a vicar's stirring of medicine water while holding a ya'ya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man west of the ho'naaite dips eagle plumes in medicine water and sprinkles
    the altar four times while the song is resumed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men take part in a social smoke, and each man waves his lit cigarette
    toward the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two boys stand in front of the altar, one on each side of the line of meal,
    as the choir sings again.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy on the west side uses plumes dipped in medicine water, and the boy
    on the east side uses a crook dipped in medicine water to sprinkle the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys dip into the cloud bowl and throw suds to directions, and also dip
    medicine water to sprinkle toward directions including the zenith and nadir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boys cross to opposite sides, reverse positions, and repeat the sprinkling
    of the cardinal points, zenith, and nadir twelve times, alternating medicine water
    and the cloud bowl.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: By command of the ho'naaite, the boys take baskets of ha'chamoni that were
    resting on the backs of cougar fetiches on either side of the altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boys hold the baskets, shake rattles, and move the baskets in time to
    the choir's song and rattles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ho'naaite directs the boys to wave the baskets toward north, west, south,
    east, zenith, and nadir, repeating this twelve times before depositing the baskets
    beside the cloud bowl.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The vicar places the bowl of medicine water in front of the cloud bowl on
    the line of meal, takes a ya'ya in his left hand, stirs the medicine water with
    an abalone shell, passes his hand over the ya'ya, and draws a breath from it.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
