canonical_text:
  quote: ''
  summary: The passage describes an Omaha Ictasanda custom in which people fearful
    during a shower fill a pipe with tobacco and offer it to the Thunder-beings while
    invoking sacred names. If they do not offer tobacco, they cry toward the clouds
    with raised arms and palms down. Other Omaha gentes fear to use the Ictasanda
    names or invoke the Thunder-beings unless they are Thunder shamans, who may sing
    Thunder songs and perform similar pipe rites.
  language: English with Omaha transcription and interlinear gloss
  quote_policy: summarized
