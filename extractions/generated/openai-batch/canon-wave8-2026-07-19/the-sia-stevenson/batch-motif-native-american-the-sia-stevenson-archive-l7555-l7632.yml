  quote: The coyote's house was near the house of the rattlesnake.
  summary: A coyote and rattlesnake exchange visits and food offerings. The coyote
    fears the snake, then tries to imitate the snake's rattle and pollen-eating practice,
    but fails and leaves hungry while the snake secretly laughs. The passage then
    begins a notice about the ska'tona, a monster plumed serpent in the mountains
    that draws people to itself with its breath and devours them.
