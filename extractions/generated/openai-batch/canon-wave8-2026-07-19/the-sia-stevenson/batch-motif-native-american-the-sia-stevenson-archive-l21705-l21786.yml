canonical_text:
  quote: ''
  summary: The passage reports stick-laying petitions addressed to a grandfather figure,
    then describes Kansa tribal fetiches including a war pipe and sacred clam shell,
    Omaha personal fetiches made from animal and bird materials, medicines said to
    be wise and communicative, a war club ritually empowered and brandished toward
    enemies, red medicine beans associated with luck and return to their owner, and
    secret rites of dancing societies with costly initiation.
