canonical_text:
  quote: ''
  summary: 'The passage describes Sia childbirth rites: a woman in labor is seated
    before a fire; relatives, a doctress, and a ho''naaite/father participate; medicine
    bags, eagle plumes, ashes, corn, medicine, and meal are used with prayers for
    the child, safe delivery, purification, and blessings from mother earth, Ko''plshtaia,
    Ashes man, and sun father.'
  language: English with transcribed ritual prayer
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the first stage of labor, the woman's mother made a fire, a low stool was
    placed before it, and the woman sat on the stool with her back to the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctress and the husband's sister arrived; the father sat before the woman;
    the doctress sat to her left holding an ear of yellow and purple corn; the writer
    held a medicine-stone.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband sat by the wall with two sons and his sister, who had an infant
    and a young child with her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ho'naaite placed three buckskin medicine bags on the floor, containing
    a shell mixture, plant pollen, and powdered plant medicine, and held two eagle
    plumes while praying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prayer and explanation refer to the child's sand bed, mother earth as
    giver of food, Ko'plshtaia, Ashes man, receiving the child into arms, and the
    child's growth, beauty, happiness, and good thoughts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ho'naaite gave powdered-plant medicine to the woman; her mother placed
    ashes from the fireplace on the floor; the father used eagle plumes to throw ashes
    to the cardinal points and pass the plumes along the woman's sides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that ashes are used to discover diseased parts and that
    scattering ashes to the cardinal points casts impurities from those present and
    purifies the chamber.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a repeated rite, the ho'naaite passed the plumes from the top of the woman's
    head down the center of her body with a prayer for safe delivery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The doctress passed the ear of corn from the top of the woman's head down
    the center of her body four times with a prayer that the child pass through the
    road of life promptly and safely.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The ho'naaite placed medicine in the woman's mouth, went to the end of the
    placita, sprinkled meal to the east, and prayed that the sun father would bless
    the child.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After these rites, the woman moved down the long room in pain while maintaining
    composure.
  category: sequence
  evidence_refs:
  - ev:10
