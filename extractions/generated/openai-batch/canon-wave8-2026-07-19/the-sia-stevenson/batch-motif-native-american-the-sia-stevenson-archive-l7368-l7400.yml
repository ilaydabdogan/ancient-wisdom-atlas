canonical_text:
  quote: ''
  summary: Coyote asks the cloud people for a river and floats from the mountains
    to hare land. There he pretends to be dead near the river, meets a woman ka'wate
    who has come for water, and persuades her to work with him. He hides four clubs
    beneath his body, covers himself with black grass seeds to look worm-eaten, and
    instructs the ka'wate to lure the hares to dance around him and throw her poison
    like rain into their faces.
  language: English
