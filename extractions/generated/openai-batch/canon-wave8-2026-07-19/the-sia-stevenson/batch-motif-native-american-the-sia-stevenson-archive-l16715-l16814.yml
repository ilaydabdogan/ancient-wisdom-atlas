canonical_text:
  quote: ''
  summary: 'The passage frames winter storytelling as instruction and entertainment,
    then gives several animal tales: a wolverene tries to fly with birds and falls
    after looking down; the wolverene deceives water birds into a dance and kills
    them, but a loon escapes and a jay later exposes him so humans eat the cooked
    birds; a reindeer names animals and the squirrel’s crying explains its white lower
    eyelids; a young man dreams that deer invite him to live with them, and a doe
    confirms the invitation while he is hunting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During long winter nights or cold weather, people sit around a fire and tell
    stories for the instruction and entertainment of younger people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older men have many stories, and some women are noted for entertaining children
    who listen in the arms of parents or elders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The collector states that the stories came directly to her and that she tried
    to render them in English as close to the original form as possible.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: In one story, a wolverene calls the birds his brothers, offers to dress them
    in feathers, makes wings for himself, and proposes that they fly together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brant instructs the wolverene not to look below when noise is heard while
    flying over a point of land, and to turn when the birds turn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wolverene follows the first turn but looks below at the second turn when
    he hears shouting, and he falls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Humans identify the fallen body as a brant; old women pluck and disembowel
    it, reject it because it smells rotten, and later find only the dead wolverene.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another story, the wolverene invites water birds ashore with the promise
    of a bees’ nest, directs them to dance with shut eyes, sings, and kills birds
    while they dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A loon opens one eye, sees headless ducks, escapes into the water by diving,
    and calls out from a distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The wolverene cooks the killed ducks, threatens a whisky-jack with a firebrand,
    and the jay tells hungry humans where the sleeping wolverene and cooked ducks
    are.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Humans eat the cooked duck meat, put bones back in the kettle, and leave;
    the wolverene wakes expecting food and finds only broth and bones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A reindeer announces that he will give names to mammals and birds; the squirrel
    asks for the same name as the black bear, is told it is too small, and cries until
    its lower eyelids become white.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A young man dreams that a deer asks him to live with deer; his father interprets
    the dream as a good sign for hunting, and a young doe later tells him not to shoot
    because her father sent her to invite him to live with the deer forever.
  category: sequence
  evidence_refs:
  - ev:8
