canonical_text:
  quote: ''
  summary: Ma'asewe and his brother kill a people-eating antelope, divide its flesh,
    and command that antelope will henceforth eat vegetation and serve as food for
    their people. After the destruction of giant enemies brings safety and rejoicing,
    the brothers attend an Oraibi feast disguised with honey. Only one household feeds
    them; Ma'asewe instructs that family to go to an isolated round house. The rest
    of the village is transformed into stone, and the beings from those bodies ascend
    and become Canada jays. Ma'asewe later admits destroying the village because of
    its failure to feed them, and his mother approves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ma'asewe cuts the antelope with a stone knife, the boys flay it, and Ma'asewe
    throws pieces of its heart and flesh toward the north, west, south, and east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ma'asewe declares that the antelope will no longer be an enemy to his people,
    commands it to eat vegetation instead of flesh, and assigns its intestines as
    food for the mole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning home, Ma'asewe tells his mother that they have killed the
    people-eating antelope and that all the giants who devoured their people are destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the giant enemies are destroyed, people are no longer afraid to travel,
    children can go anywhere, and villages hold feasting and rejoicing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ma'asewe and U'yuuyewfi go to an Oraibi feast, enter the bee's home, find
    honey, and cover their bodies with it so that they will be unknown and appear
    poor or dirty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the Oraibi feast, the boys see feasting in the houses but are invited to
    eat in only one house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After eating, Ma'asewe thanks the hospitable woman and her household and tells
    them to go stay for a while in an isolated round house away from the village.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman and her family drink from the bowl used by the boys, find the water
    sweet, and decide to obey the boys' instruction to go to the round house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: While the Oraibi people are dancing and feasting, they are transformed into
    stone; the beings leaving the bodies ascend and become the pinonero, identified
    as the Canada jay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ma'asewe first denies and then confesses to his mother that he destroyed the
    village because the boys were not invited to eat except in one house; the mother
    says she is glad the people were destroyed because they were mean and bad.
  category: speech
  evidence_refs:
  - ev:8
