canonical_text:
  quote: ''
  summary: 'The passage describes seasonal housing and outdoor life: uncomfortable
    but protective snow-houses; spring melting and makeshift shelters; hunger and
    wandering until shore ice breaks; the construction, transport, and use of sealskin
    tents; and the internal arrangement of such tents by household and relationship.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Snow-houses are described as uncomfortable but necessary protection; they
    become cold when open and intolerably hot when closed with several persons inside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Family work occurs within the snow-house, including dressing and tanning animal
    skins; refuse, offal, and hair accumulate and putrefy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In spring, snow huts melt, may be patched briefly with deerskin, and eventually
    fall down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When snow structures fall, occupants build temporary shelters of deerskin
    or cloth on rocky ridges; poorer people may have only a deerskin blanket stretched
    over poles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People remain in temporary shelters until shore ice breaks from coves and
    bays, allowing hunters to procure seals from the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Poor wanderers search for food by day and camp at night under rock walls with
    little covering, sometimes with clothing soaked by spray or rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Toward the end of winter, some weakened and emaciated people starve before
    reaching the sea and are left to perish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When weather becomes warm enough, people who possess sealskin tents move into
    them for the season.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A skin tent is usually made from large square-flipper seal skins; ten to fifteen
    skins may form a family-sized tent.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tent includes sewn skin widths, a separate door piece, pairs of poles,
    braces, a ridgepole, and shorter supports; eleven poles are said to be necessary
    for a long tent.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: During continued rains, skins are arranged to nearly meet over the ridge;
    when taken down, the skin widths are folded, rolled, carried by a person with
    assistance, and loaded into the umiak.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The skin tent is the usual shelter from the first rain until sufficient early-winter
    snow permits construction of an iglu gheak.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Inside the skin tent, the far end may contain bedding for the owner, his wives,
    and children; other occupants lie along the remaining sides, arranged by relationship.
  category: relationship
  evidence_refs:
  - ev:7
