canonical_text:
  quote: ''
  summary: The passage describes Omaha and Ponka personal mystery decorations restricted
    to shamanic orders, especially the order of Thunder shamans. Rights to wear, paint,
    copy, or transmit such designs depend on dream or vision experiences, inheritance
    limits, war-party actions, ritual songs, and public recognition through a feast
    and display of a painted robe or blanket.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Omaha and Ponka are described as having personal mystery decorations worn
    on garments and appearing on tents.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The makers and wearers of these decorations must be members of orders of shamans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little Soldier wore a buffalo robe with his personal mystery decoration, and
    even members of his gens feared to imitate it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Little Soldier promised to paint the decoration on four white blankets for
    George Miller but died before painting the fourth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: George Miller retained the right to decorate and wear the fourth blanket and
    other white blankets in the same style, but he could not transmit the right to
    his children unless he himself later saw the objects in a dream or vision.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The right to use such designs on robes, blankets, tents, and similar objects
    is said to originate with a dream or vision in which the mystery objects are manifested.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The order of Thunder shamans is composed of people who have had dreams or
    visions involving the Thunder-being, the Sun, the Moon, or other superterrestrial
    objects or phenomena.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person who saw the Thunder-being or another mystery object kept the matter
    secret for a time, then joined the first war party from the camp or village and
    revealed the dream or vision in enemy territory or trouble.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A dreamer or seer who killed or grasped a foe, or who brought back an enemy
    horse, had the right to make a Thunder song.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: After returning, the seer painted the mystery objects on a robe or blanket,
    prepared a feast, invited the members of the order of Thunder shamans, displayed
    the robe, and was thereafter a member of the order who could wear the robe safely.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A father could give his son the right to wear such a robe, but the son could
    not transmit the right to the next generation unless he had a similar vision.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Two Crows could wear and copy a decorated robe received from Little Soldier,
    but he could not transmit the right to his own son.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
