  quote: ''
  summary: The passage gives a technical description of preparing animal-skin floats,
    attaching them to tracking or harpoon lines, preparing oil and fat bags from sealskins,
    reusing oil bags, and using a small sealskin pouch for gun caps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An animal skin intended for a float is scraped, inflated with air, hung to
    dry, turned hairy side out, and inflated again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The float’s openings are sewn; an ivory button-like mouthpiece with a bored
    hole is fitted at the mouth, a wooden stopper plugs it, and small sticks bound
    into the hind flippers and tail serve as stoppers and handles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When attached to a tracking line, the float prevents the line from fouling
    among beach rocks and stones while towing a boat or umiak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When attached to a harpoon line for large marine mammals, the float retards
    the speared animal and marks the place where it sinks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hair may be removed from the skin by pouring boiling water on small patches
    and pulling the hair away; care is taken because detached black scurf would make
    the skin less waterproof.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Oil and fat bags are prepared similarly to floats, except that the hair is
    left on the skin and the hairy side remains inside.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Large sealskins may be used as oil bags and may hold as much as 300 pounds
    of fat or oil.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When oil is sold, the bag is usually returned to the seller, who may refill
    it or convert the skin into bootlegs or soles; oil-impregnated leather is described
    as moisture-resistant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A small sealskin pouch shaped somewhat like a leg of mutton is used for carrying
    gun caps, with a neck narrow enough to release one cap at a time.
  category: object
  evidence_refs:
  - ev:6
