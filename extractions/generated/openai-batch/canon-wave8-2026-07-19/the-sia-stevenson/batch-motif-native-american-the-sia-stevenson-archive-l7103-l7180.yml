candidate_motifs:
- id: motif:1
  label: afterlife journey on a marked road with provisions
  taxonomy_refs:
  - afterlife_journey_map
  basis: The spirit begins a fourth-day journey on the north road to the lower world
    and receives a ha'chamoni and food for the journey.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives an ethnographic description rather than a narrative
    episode.
- id: motif:2
  label: credential required for entrance to the lower world
  taxonomy_refs:
  - afterlife_journey_map
  basis: Entrance guards require the ha'chamoni credential; without it the spirit
    cannot enter and must roam in the north.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No external parallel is asserted here.
- id: motif:3
  label: moral judgment of the dead at the afterlife entrance
  taxonomy_refs:
  - divine_judgment
  basis: The guards read hearts and minds, admit or deny spirits, and wicked spirits
    are destroyed despite possessing a credential.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The guards rather than a named deity perform the immediate judgment in
    the cited passage.
- id: motif:4
  label: destruction of wicked spirits by underworld fire
  taxonomy_refs:
  - divine_judgment
  basis: Wicked spirits are placed into a great fire in the earth near Shipapo and
    are entirely destroyed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The fire is punitive and local to the underworld entrance; it is not described
    as world-destroying.
- id: motif:5
  label: temporary postmortem purification through isolation and deprivation
  taxonomy_refs:
  - divine_judgment
  basis: Ritual officers with unwilling hearts live apart without nourishment for
    years until the mother considers them worthy to enter peace.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage applies this specifically to ti'amonis and ho'naaites, not
    to all spirits.
- id: motif:6
  label: reciprocal traffic of dead and unborn spirits
  taxonomy_refs:
  - death_rebirth
  basis: Dead spirits travel to their first home while unborn spirits pass along the
    same crowded road toward villages where they will be born.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The text does not state that the dead spirits are reborn; it only juxtaposes
    dead and unborn spirits on the road.
- id: motif:7
  label: ritual cleansing of bereaved kin
  taxonomy_refs: []
  basis: Surviving spouses and parents of a deceased child are bathed after death-related
    rites; for the surviving spouse, the bathing cleanses sorrow and leaves only a
    little sadness.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is described as a mortuary custom, not explicitly as symbolic purification
    beyond the stated cleansing of sorrow.
- id: motif:8
  label: animal souls follow human-like afterlife protocol
  taxonomy_refs:
  - afterlife_journey_map
  basis: Animal spirits go to the lower world, and prey animals receive and carry
    a ha'chamoni credential like a human spirit.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives more detail for prey animals than for all animal spirits.
- id: motif:9
  label: immortal cloud people
  taxonomy_refs: []
  basis: Cloud people are said never to die, and no one is said to have seen or known
    of a cloud person dying.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives only the assertion of immortality, without a narrative
    or rite.
comparison_claims:
- id: claim:1
  claim: The passage explicitly contrasts the Sia reason for bathing a surviving spouse
    with a Zuñi practice, stating that the Zuñi bathing is done for a very different
    reason.
  claim_level: same_function
  target: Zuñi/Zuni bathing of a remaining husband or wife after a spouse's death
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explain the Zuñi reason, so only the shared act
    of bathing and explicit contrast can be recorded.
- id: claim:2
  claim: The passage states that a prey animal's ha'chamoni functions as a credential
    in the same way as the ha'chamoni carried by a human spirit.
  claim_level: same_function
  target: human spirit's ha'chamoni as afterlife credential
  evidence_refs:
  - ev:5
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the passage, not evidence for
    contact or common inheritance between traditions.
