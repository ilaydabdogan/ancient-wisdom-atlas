canonical_text:
  quote: ''
  summary: The passage describes Sia mortuary handling of the body, bathing of bereaved
    relatives, fourth-day rites for the dead person's spirit, the northward road to
    the lower world, credentialed entry through guards, reception by Sussistinnako
    and relatives, punishment or purification of certain spirits, animal spirits'
    journey to the lower world, and the immortality of cloud people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The corpse is wrapped and tied with a rope, and two men carry and bury it
    without further ceremony while wailing continues in the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A surviving spouse is bathed after burial by a female member of the spouse's
    clan so that sorrow may be cleansed and reduced.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a child dies, both paternal and maternal parents are bathed; children
    are not bathed when a parent dies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth day after death the spirit begins its journey to the lower world
    after hovering around the pueblo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A ceremony is held by the deceased person's society or by a selected ho'naaite
    if the deceased did not belong to a cult society.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A ha'chamoni made by the theurgist on the third day is placed on the north
    road for the spirit to carry to its future home.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A vase of food is deposited to feed the spirit on the journey.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Remaining clothing is cut and thrown over the north road, because whole clothing
    would prevent the spirit of the clothing from leaving the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The road to the lower world lies to the north and is described as the route
    by which the dead return to the world whence they came.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The north road is crowded with spirits of the Sia and of all Indians; dead
    spirits travel to their first home while unborn spirits pass toward villages where
    they will be born.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the entrance to the lower world two guards ask the spirit for credentials
    and examine the ha'chamoni.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A spirit without a ha'chamoni cannot enter the lower world and must roam somewhere
    in the north.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the guards accept the ha'chamoni, the spirit may enter Shipapo and go
    to its mother in the lower world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: A first being in the lower world asks to see the ha'chamoni and then hands
    it to Sussistinnako.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Sussistinnako approves the ha'chamoni and directs the spirit to join its dead
    relatives and be happy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: A very wicked person is not allowed into the lower world even with a ha'chamoni.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The guards can read hearts and minds and put wicked spirits into a great fire
    in the earth below near Shipapo, where the spirit is entirely destroyed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Ti'amonis and ho'naaites who performed duties with unwilling hearts are made
    after death to live apart without nourishment for a period of purification.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: All animal spirits go to the lower world; domestic animals serve their masters
    there, and Sussistinnako knows the property of all.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: A prey animal receives a ha'chamoni when killed and carries it as a credential
    like a human spirit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: Cloud people are said never to die, and no one is said to have known or seen
    a cloud person die.
  category: attribute
  evidence_refs:
  - ev:10
