canonical_text:
  quote: ''
  summary: 'A Sia rain-ceremonial sequence is described: an officiant waves ritual
    ya''ya at the altar and petitions a named being to instruct the cloud people;
    a woman moves a water vase along a meal line; a dancer pours water into a medicine
    bowl while invoking directional animal figures; participants add corn pollen and
    meal with cries for rain; six pebble fetiches are dropped into the medicine water,
    which is stirred and sprinkled over offerings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ho'naaite takes two ya'ya from near the altar, waves them, and appeals
    to Ct's^ to instruct the cloud people to come and water the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The choir stands during the appeal, then sits, smokes native-tobacco cigarettes
    wrapped in corn husks, and later resumes singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman sprinkles the altar with meal and moves a vase of water five times
    along a line of meal, ending immediately before a basket of offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ya'ni^siwittani dances before the altar with eagle plumes and a rattle,
    lifts gourdfuls of water from the vase, waves them, and empties them into the
    medicine bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water-pouring appeals are directed to the cougar of the north, bear of the
    west, badger of the south, wolf of the east, eagle of the heaven, and shrew of
    the earth so that they will intercede with the cloud people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members take corn pollen from medicine bags and throw it on the altar and
    into the medicine bowl while crying out invocations for the cloud people to water
    the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Meal from the meal bowl is thrown into the medicine bowl six times with continued
    invocations to the cloud people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ti'Jimoni takes six small pebble fetiches from a bear leg skin and passes
    them through the men to the ya'ni^siwittani.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ya'ni^siwittani drops the six fetiches into the medicine water, alternating
    hands, and gives an animal-like growl each time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The growl is explained as a call upon the prey animals of the cardinal points
    to exhort the cloud people to gather and water the earth so it may be fruitful.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ya'ni^siwittani stirs the medicine water with eagle plumes and sprinkles
    the offerings by striking the plumes with a rattle four times while the cloud
    people are invoked.
  category: action
  evidence_refs:
  - ev:5
