canonical_text:
  quote: ''
  summary: The Sia seek to travel to the center of the earth, but the moist earth
    cannot bear them. Ut'set asks several animals to harden the road, but they fail.
    She consults Sus'sistinnako in the lower world, who directs her to the Ka'pina,
    or spider, society. A female member makes a suspended cotton road, which the people
    fear to use; a male member then uses a serpent fetish and the Na'pakatsa in directional
    placements, after which the earth is firm. Ut'set appoints a corn-clan man as
    Ti'amoni, gives him her wisdom and insignia, instructs him to lead the people
    on the straight road, and instructs him concerning the P'arriko or ya'ya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After remaining at a village for a year, the Sia desire to pass to the center
    of the earth, but the earth is too moist for travel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ut'set asks the cougar, bear, badger, shrew, and wolf to use their medicine
    to harden the earth; each attempt fails, with the animals sinking into the wet
    earth or returning unable to proceed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ut'set returns to the lower world to ask Sus'sistinnako how the earth can
    be hardened for the people's travel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sus'sistinnako tells Ut'set that a woman of the Ka'pina, or spider, society
    should use her medicine to harden the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A female Ka'pina member denies knowing the secret three times, then on the
    fourth questioning agrees to try and summons the society members.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The female Ka'pina member makes a road of fine cotton from her body and suspends
    it a few feet above the earth, but the people are afraid to trust the fragile-looking
    road.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ut'set asks for a male member of the Ka'pina society to work for her after
    the people fear the cotton road.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A male Ka'pina member throws out a serpent fetish that expands and contracts;
    when extended, it reaches to the middle of the earth and is thrown toward the
    south, east, and west.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Na'pakatsa fetish is thrown on the ground, stamped upon, and placed to
    the south, east, west, and north, with the final placement close behind the people
    in the far north.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After these rites, the earth is firm enough for the people to travel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ut'set selects a man of the corn clan as Ti'amoni to take her place with the
    people and lead them to the center of the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ut'set says she will return to her home below, will hear what is said to her,
    and gives the appointed representative her wisdom, thoughts, heart, and mind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Ut'set gives the new Ti'amoni a crooked staff as an insignia of office, and
    the people clasp the staff and draw a breath from it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ut'set gives the Ti'amoni the precious things she brought to the world and
    instructs him to follow the straight road, listen to good things, work for good
    things, and turn from bad things.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Ut'set instructs the ruler to make the P'arriko, also called ya'ya, which
    the note describes as a perfect ear of corn covered and ornamented with plumes,
    cotton, shells, and precious beads.
  category: object
  evidence_refs:
  - ev:7
