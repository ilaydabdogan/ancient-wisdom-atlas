canonical_text:
  quote: ''
  summary: The passage describes fasting and visionary experience among Omaha and
    related Siouan-speaking groups. People are said to see or hear ghosts, animals,
    celestial beings, weather beings, and other named powers, which may become personal
    guardian spirits. It describes Thunder shamans, Buffalo shamans, animal-named
    shamanic societies, degrees of visionary power, the Ghost Society and Ghost Dance,
    and related Kansa and Kwapa practices involving animal visions, shield images,
    and shamanic orders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fasting for several days is presented as probably producing the mental and
    bodily condition for supposed superhuman communications.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some persons thought they saw or heard ghosts, animals, or mysterious voices,
    including voices that roused men from sleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists claimed interviews with named beings including the Ancient
    of Darkness, Ancient of Clouds, Ground Being, Thunder-being, Sun, Moon, Morning
    Star, and several animal Ancients.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A being or animal seen in dream or vision is said to have been regarded as
    the special guardian spirit of the person who claimed the interview.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those who had interviews with the Thunder-being did not dance at society meetings;
    they invited one another to feast and sang while seated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Thunder shaman order claimed the power to make rain.
  category: attribute
  evidence_refs:
