canonical_text:
  quote: ''
  summary: The passage describes Kenenot steam baths in a temporary domed sweat house
    made of bent poles and tent skins, with fire-heated stones and water used to create
    intense steam. It notes that such baths are frequent and can delay a journey.
    It also recounts a spring 1882 Fort Ohimo incident in which reindeer fleeing through
    the camp nearly ran into a sweat house occupied by an old man and woman, prompting
    their escape and a noisy commotion. The passage closes by noting traces of former
    sudatories along long-used paths.
  language: English
