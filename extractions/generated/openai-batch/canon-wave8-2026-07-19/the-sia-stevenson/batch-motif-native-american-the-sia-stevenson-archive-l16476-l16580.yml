canonical_text:
  quote: ''
  summary: The passage frames winter fireside storytelling for instruction and entertainment,
    then gives wolverene tales. In the first, a wolverene equips birds and himself
    for flight, is warned by a brant not to look below, looks down at shouting people,
    falls, is mistaken for a brant or goose, and is later found as a dead wolverene.
    In the second, an incomplete tale begins with a wolverene luring water birds ashore
    with a promised bees' nest, a dance, closed eyes, and song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During long winter nights or cold, inclement weather, people sit around a
    fire and tell stories for the instruction and entertainment of younger people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older men are described as having many stories, and many women are described
    as able entertainers of children who sit with parents or elders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The recorder states that the stories came directly to him and that he tried
    to give them as close to the original form as English allowed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first tale, a wolverene calls birds his brothers, offers to dress them
    in feathers, dresses them, makes wings for himself, and proposes that they fly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brant tells the wolverene not to look below while flying over a point
    of land when noise is heard, and to turn when the birds turn.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wolverene does not look below on the first turn, but on the second turn
    looks down at the noise of shouting people and falls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: People run to the fallen animal and identify it as a fallen brant.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old woman plucks and disembowels the fallen animal, smells a bad stench,
    declares the goose already rotten, and gives the carcass to a child to throw away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another old woman asks where the brant goose was thrown, checks for herself,
    and finds only the dead wolverene.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the second tale, a wolverene running along the seashore sees geese, brant,
    ducks, and loons in the water and lures them ashore by promising a bees' nest
    and a dance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wolverene in the second tale tells the birds to shut their eyes during
    the dance and begins to sing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note says that loud clamor by people can frighten brant so that they lose
    their senses, fall to the ground, and are killed.
  category: other
  evidence_refs:
  - ev:9
