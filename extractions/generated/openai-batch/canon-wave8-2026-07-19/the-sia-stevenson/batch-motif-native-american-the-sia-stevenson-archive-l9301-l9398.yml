canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of illness, healing, social punishment,
    taboo around a murder site, treatment of vulnerable elders, suicide, starvation
    during scarcity, cannibalism, and expulsion among groups identified in the passage
    as Eskimo, Innuit, and Koksoagmyut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage attributes widespread pulmonary illness to crowded, poorly ventilated
    huts whose openings are kept closed to preserve heat, and also reports scurvy-like
    conditions and rapidly worsening sores.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Relief for illness is usually said to be sought through a shaman or conjurer
    who works on the imagination, will power, and faith of the sick person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text states that the perceived magnitude of disease is generally measured
    by the amount of the patient’s worldly wealth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person judged intolerable by the community may be excluded from huts, food,
    and intercourse; a murderer may be surprised and put to death, usually by stoning,
    with public support.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For premeditated murder, the next of kin is described as having a duty to
    avenge the deed, even after years; Akpatok is said to be taboo after a murder
    because ghosts of victims might appear and ask for relief that the people lack
    offerings to appease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Aged people without relatives are reported to be quietly put to death or abandoned
    during a move; a recovered body may be found with stones piled around it and bound
    with thongs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: An old one-eyed woman at Fort Chimo was proposed for strangling to relieve
    her misery, but the proposed act was postponed when her eye improved.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Suicide is reported as not rare, with cliff-leaping, strangulation, and sometimes
    a gun named as methods; remorse and disappointed love are given as causes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: During scarcity, a man found his wife secretly eating stored fish, blocked
    the snow-hut entrance, and she remained inside and died of starvation because
    she expected to be killed if she came out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In severe scarcity, some families are said to have resorted to cannibalism
    after eating dogs, clothing, and skin objects; unlucky or disliked women are reported
    to be driven from camp.
  category: sequence
  evidence_refs:
  - ev:10
