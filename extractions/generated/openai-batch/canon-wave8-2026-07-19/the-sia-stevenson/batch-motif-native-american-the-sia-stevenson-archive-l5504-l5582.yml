canonical_text:
  quote: ''
  summary: The passage describes the Sia Society of Warriors and its alliance with
    the Knife Society, including a victor's required trophies, procession, prayers
    to the enemy's spirit, treatment of the scalp, use of war-hero fetiches, washing,
    body painting, plaza dance, arrow-point rite, and final admission into the Society
    of Warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Society of Warriors and the Knife Society share a ceremonial chamber and
    both take part in the initiation of a victor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Society of Warriors is said to have originally had Ma'asewe and U'yuuyewC,
    twin children of the sun, as presiding officers; the Knife Society is said to
    derive its name from arrows given by the sun father to the invulnerable twins.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Killing an enemy is described as insufficient for admission; the victor must
    return with trophies such as the scalp and buckskin apparel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The victor carries the scalp on an arrow and later transfers it to a pole
    about five feet long near the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the victor arrives after the sun has eaten its midday meal, he waits near
    the village until morning while food is carried to him by the war chief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the morning the Knife Society, Warriors, and male populace join the victor;
    the Knife Society ho'naaite offers prayer and addresses the enemy's spirit as
    no longer an enemy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At sundown the Warrior ho'naaite, his vicar, and the victor carry the pole
    and scalp toward the village, followed by members of the societies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The party encircles the village from right to left before entering the ceremonial
    chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The scalp is deposited before the meal painting, and fetiches are arranged
    around the painting.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two large stone images of Ma'asewe and U'yuuyewC are brought out only for
    the initiation of a victor into the Society of Warriors and are not looked upon
    by women.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Knife Society sits on the west side of the room, the Warriors on the east
    side, and the victor sits still beside the vicar of the Warriors without joining
    the song.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: At sunrise the scalp is washed in yucca suds and cold water by each member
    of the Knife Society, and the victor's hands are bathed for the first time since
    the scalping.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The victor paints his face and lower legs red, the rest of the body black,
    and spreads galena over much of the face.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Knife Society wears white embroidered Tusayan kilts and carries rattles,
    while Warriors and the victor wear buckskin items and carry bows, arrows, and
    the scalp pole.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Knife Society ho'naaite places an arrow point in the victor's mouth before
    the group proceeds to the plaza.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: In the plaza the victor dances between the two lines, raises the scalp on
    the pole, and does not sing or speak.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Village men add war clubs and firearms to the dance, and women also join in
    the dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: After return to the ceremonial chamber, the final epic ritual completes the
    initiation; the Knife Society ho'naaite declares the victor a member of the Society
    of Warriors and removes the arrow point from his mouth.
  category: sequence
  evidence_refs:
  - ev:7
