canonical_text:
  quote: ''
  summary: The passage describes household vessels, bark baskets, buckskin-topped
    containers, deer-leg-skin bags, and meal practices. Wooden vessels serve as water
    buckets and drinking cups and are constructed from spruce or larch strips and
    roots. Spruce-bark baskets are used for berry picking and may be fitted with buckskin
    drawstring tops for small items. Larger objects are carried in deer-leg-skin bags.
    Meals have no fixed hours; people serve themselves from a pot or kettle, using
    knives or fingers rather than forks.
  language: English
  quote_policy: summarized
