canonical_text:
  quote: ''
  summary: 'The passage describes the nearly extinct Society of the Cougar, its officers,
    and the ceremonial sequence connected with hunting: offerings and prayers to the
    cougar and sun, announcement by the war chief, night planning around a fire, purification
    and continence, departure of hunters, prayers and household support, and the hunters''
    return with river-bank thanksgiving and procession into the village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Society of the Cougar is described as nearly extinct, with membership
    consisting of the ho'naaite and his vicar.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before a game hunt, the society holds a two-day ceremonial, and on the third
    morning the vice ho'naaite deposits ha'chamoni and plume offerings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cougar is appealed to as the great father and master of all game and is
    said to draw or send game by mental control rather than spoken words.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sun is said to give the Sia power to capture game.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ho'naaite decides when the hunt will occur and communicates through the
    war chief, who heralds the message.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Offerings are deposited to cougars of directions, and rabbit-stick or arrow-point
    offerings are deposited to the sun depending on the kind of hunt.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the hunt is announced, selected huntsmen gather at night in a circle
    around a fire on the east side of the village to plan, sing epic songs, and tell
    stories.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hunt occurs four days after the night gathering, and continence is observed
    until after the hunt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fifth morning, people preparing for a rabbit hunt have their heads
    bathed in yucca suds and dress in their best apparel; only men hunt larger game.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A deer and antelope hunting party leaves in the afternoon, led by the vice
    war chief, with the ti'amoni included as a member; three days pass before game
    is obtained.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before departure, the ho'naaite visits each hunter's house, embraces him,
    and repeats a short prayer for success addressed to the cougar and then to the
    sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wives and relatives prepare food for the hunters; wives attend to personal
    needs and hand guns to mounted husbands, while an unmarried man's father hands
    him his gun.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The huntsmen are absent thirteen days and send a courier ahead on their return
    to notify the war chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the river, the returning hunters are received by the vice ho'naaite of
    the Society of Warriors and the war chief, who offer prayers and sprinkle meal
    in thanksgiving for success and safe return.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Children meet their returning fathers at the river bank, and the hunters ascend
    in single file to the village, where household and war-chief assistance occurs
    as individuals reach their homes.
  category: sequence
  evidence_refs:
  - ev:10
