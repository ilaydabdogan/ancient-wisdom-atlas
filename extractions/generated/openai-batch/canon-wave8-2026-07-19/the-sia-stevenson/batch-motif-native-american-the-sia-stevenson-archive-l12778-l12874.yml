canonical_text:
  quote: ''
  summary: The passage gives several brief folk-lore accounts explaining the origins
    or present traits of gulls, hawks, swallows, hares, wolves, lice, and mosquitoes;
    a story of a hunter and a fox wife who leaves after a complaint about her odor;
    and a Labrador story of rival men whose feats create and move an island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman left near a cliff with her children becomes confused, keeps crying
    the last words she heard, changes into a gull, and is said now to shout sounds
    like “go over.”
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman teased for having a short neck often sits on high places, changes
    into a hawk, and cries out about the insult when she sees anyone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Extraordinarily wise children building toy houses near a cliff are changed
    into small birds that continue building mud houses on rocks; the raven does not
    molest them, and Eskimo children watch them build.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hare is described as formerly a long-eared child who was abused, went
    to live alone, lays its ears back when seeing anyone, and has no tail because
    it formerly had none.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wolf is described as formerly a poor woman with many hungry children;
    they become wolves roaming for food, and the mother’s cry is heard consoling the
    children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lice are said to drop from the body of a huge spirit in the regions above
    who is punished by being tormented by pests; in rage he drops lice onto the people
    who condemned him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A negligent wife fails to clean her husband’s skin clothing properly; he throws
    dirt from the coat after her, and the particles change into mosquitoes that gather
    around women cleaning clothes in spring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A solitary hunter repeatedly finds his house cleaned and food prepared; when
    he watches, he sees a fox enter, then finds a beautiful woman inside with a fox
    skin hanging on a line, and she says she is his wife.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the husband remarks on a musky odor, the fox wife says she will leave
    if faulted, removes her clothing, resumes the fox skin, and goes away.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Two rival men compete in strength: one hurls an immense rock into the sea
    where it becomes an island, and the other pushes it with his foot onto another
    island, leaving a visible footprint and a place name.'
  category: sequence
  evidence_refs:
  - ev:10
