literal_observations:
- id: obs:1
  text: Mittens are described as hand protection made from smoked deerskin, folded,
    cut, and sewn, with the thumb formed from a tongue-shaped palm piece and a fitted
    additional piece.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Breeches are described as not painted because they are usually not exposed
    to view.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Leggings extend from the upper thigh to the ankles, are made as open-ended
    bag-like pieces, are tied to the breeches, have an outer seam with a fringed deerskin
    strip, and are painted like the coat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a person of importance, or when the maker attempts skillful work, the
    foot is measured before making a moccasin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The moccasin sole is cut as a parallelogram, the edges are turned up, creases
    are made around the toes and part of the side, and sinew thread holds the creases
    in place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The moccasin tongue is shaped like a tongue, sewn to the creased edges, sometimes
    joined with a narrow welt, and paired with an ankle top and deerskin thong for
    fastening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Different parts of the animal skin are assigned to different footwear uses:
    neck skin is too thick for toe creases but useful for tongues, sides are used
    for bottoms, and flanks or scarred back portions are used for tops and strings.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Young children's moccasins may use a seam parallel with the toes instead of
    creasing, while tent or dry-camp moccasins may lack tops and be held by a drawstring.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The moccasin tongue bears much of the walking strain and is usually ornamented
    with black, blue, or red cloth; beadwork may appear there but is said to be little
    used.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A single deerskin is said to make five to seven adult pairs of moccasins,
    which last only two or three weeks, requiring many pairs for each adult.
  category: attribute
  evidence_refs:
  - ev:8
