canonical_text:
  quote: ''
  summary: The readable portion describes a Sia Snake Society third-degree rite in
    which a snake is placed on a novitiate, addressed by the ho'naaite, asked to give
    wisdom and intercede with cloud rulers for water and crops, then placed in a vase
    and taken to a grotto. The passage also describes seasonal invocations, beliefs
    about the rattlesnake as peaceful, and the dress and body painting of society
    members and the novitiate.
  language: English
  quote_policy: summarized
