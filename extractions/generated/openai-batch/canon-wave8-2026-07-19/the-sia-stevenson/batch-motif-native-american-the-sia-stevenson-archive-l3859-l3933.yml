canonical_text:
  quote: '"Go to your home; go far and be contented."'
  summary: The passage describes a Sia Snake society ceremonial in which a ho'naaite
    presents snakes to novitiates and members, who carry them through repeated movements;
    the snakes are then taken from ceremonial vases and released toward the four directions.
    The vases are stored in a cave sealed by a stone slab and are described as ancient
    objects decorated with snakes and cougars. The passage also records a refusal
    to give away the vases because doing so was believed to anger the snakes and endanger
    the community.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At the opening of the song and dance, the ho'naaite procures a snake at the
    entrance of the grotto and presents it horizontally to a novitiate, who receives
    it while clasping the throat with the right hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ho'naaite and novitiate pass back and forth north of the line from the
    grotto four times, and the snake may wrap itself around the novitiate's throat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If another novitiate is present, he names a member of the Snake division as
    father and companion, and the ceremony with the snake is repeated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each member of the Snake division then takes a turn passing back and forth
    four times with a snake until every snake has passed through the ceremony.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two bearers take the vases from the grotto to a cave about half a mile away
    and release each snake separately on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The snakes are deposited in a repeated order of north, west, south, and east,
    and the vases are then placed in the cave and covered by a large slab.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the snake rite, the ho'naaite takes the ya'ya from the tail of a sand-painted
    cougar, draws a breath from the cougar image, rubs his breast, and members erase
    the sand-painting and rub their bodies with the sand for mental and physical purification.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The snake house is described as a hidden rectangular log structure with a
    fireplace and two niches in the north wall where the vases stand during the indoor
    ceremonial.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The cave storing the vases is concealed by a stone slab, and a channel or
    flume brings waters from ti'nia into the vases.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two vases are described as ancient pottery decorated with snakes and cougars
    on a creamy ground.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The vicar says the vases cannot be parted with because they are very old,
    made by the people's ancestors, and the snakes would be angry if the Sia parted
    with them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The council later refuses to give a vase to Mr. Stevenson because doing so
    was believed to anger the snakes and perhaps cause women and children to be bitten
    and die.
  category: speech
  evidence_refs:
  - ev:10
