canonical_text:
  quote: ''
  summary: Po'shaiyanne wins a bracelet exchange and game from a ti'amoni, who gives
    him all his people. Po'shaiyanne later visits the Sia, learns that they cannot
    capture game, sees animals from a western mountain, and prepares a ritual hunt
    with fasting, bows, arrows, fire, meal offerings to the four directions, a meal
    circle, and flute-playing that draws deer into the circle.
  language: English
  quote_policy: summarized
