canonical_text:
  quote: ''
  summary: 'The passage describes mortuary beliefs and customs: a desired lower region
    where the dead can communicate with the living, a four-year grave rest for spirits
    of those who die naturally, grave offerings and grave goods, burial or exposure
    locations near water and rocks, disapproval of disturbing bones, grave rifling
    for deposited goods, and a brief contrast with more elaborate Alaskan Eskimo festivals
    of the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that all desire to go to a lower region, where they may
    later communicate with the living, while this privilege is denied to those who
    go above.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If death results from natural causes, the spirit is supposed to rest in the
    grave for four years and then dwell on the earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the grave-rest period, the grave may be visited, food offered, songs
    sung, and offerings of oil, flesh, and tobacco consumed by the living at the grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Clothing may be deposited near the grave, and useful items may be placed in
    the grave at interment for the departed soul.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The spirit of the dead man is said to appropriate the spirits of deposited
    articles after the articles decay; lost objects may be attributed to a named deceased
    person taking them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some dead are exposed on a high point extending into the water; others are
    placed along the shore under rocks or on rocky ridges near a large glacial boulder,
    with stones piled around and upon the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people are described as having little fear of a dead man's bones but disapproving
    of others disturbing them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Indians are said to rifle Eskimo graves to obtain goods such as guns and clothing
    placed there by relatives of the deceased.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The people of Hudson Strait are described as lacking elaborate ceremonies
    pertaining to festivals of the dead, unlike the Eskimo of Alaska.
  category: relationship
  evidence_refs:
  - ev:7
