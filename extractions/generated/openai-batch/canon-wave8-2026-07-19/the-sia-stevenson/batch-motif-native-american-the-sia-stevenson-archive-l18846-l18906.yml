  quote: ''
  summary: An expository ethnographic passage argues for dividing phenomena, from
    an Indigenous point of view, into human and superhuman rather than natural and
    supernatural. It then surveys Siouan terms related to mysteriousness, holiness,
    lightning, serpent terminology, deity names, thunder beings, shamans, and water
    or subterranean monsters, with comparisons to Iroquoian, Dakota, Omaha-Ponka,
    Kansa, and Winnebago terms.
  language: English
