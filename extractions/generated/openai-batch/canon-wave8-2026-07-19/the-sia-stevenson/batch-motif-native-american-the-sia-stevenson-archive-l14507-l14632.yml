canonical_text:
  quote: ''
  summary: The passage describes paint containers, pigment sources, preparation of
    mineral colors and fish-roe paint vehicle, paint application with a stick, a hematite
    source near George's river, and the construction and interior arrangement of Neuenot
    deerskin tents, including central fire placement, seating order, storage, and
    sleeping orientation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wooden block with bowl-shaped cavities and small wooden bowls are used to
    hold mixed paints, especially when several colors are used in succession.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pigments include traded indigo, washing blue, vermilion, other colors, and
    locally occurring red earth; they are finely reduced and kneaded before mixing
    with water and sometimes oil or tallow.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prepared roe from sucker fish is used as a paint vehicle; it can be strained,
    dried, later dissolved in water, mixed with pigments, or used alone for a yellowish
    color and glaze.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Crude mineral colors are prepared by rubbing material between smooth stones,
    with water added to hold particles together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For application, paint is placed in the palm, a paint stick is drawn through
    it, and hand motion guided by the eye produces the desired lines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The artist may imitate delicate designs seen on a bandana handkerchief or
    similar fabric.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The principal hematite source is described as a lake near the headwaters of
    George's river where water can be lashed into blood-red foam by wind.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Neuenot are described as living in summer and winter in deerskin tents
    made from poles arranged in a circle and covered with sewn reindeer skins.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The tent apex is left uncovered so smoke from the central fire can escape.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Young spruce branches usually cover the floor; women lay this flooring and
    some are noted for skill in arranging the branches.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The tent center is reserved for a fire built among stones.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'Occupants sit according to family importance: the owner or head man sits
    opposite the fire, guests may be invited to that place of honor, and adopted family
    members occupy positions near the doorway.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Kettles, pots, hunting gear, animal skins, women's articles, and blankets
    are suspended or placed around the tent interior.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Occupants sleep with their feet toward the fireplace, and brush is kept away
    from the fire area to avoid burning the tent during sleep.
  category: action
  evidence_refs:
  - ev:11
