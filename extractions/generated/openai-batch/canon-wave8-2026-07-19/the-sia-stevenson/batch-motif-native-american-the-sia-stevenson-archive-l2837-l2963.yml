canonical_text:
  quote: ''
  summary: The passage describes the origin and succession of Sia cult societies in
    the lower world, their association with animal groups and medicine secrets, the
    roles of directional serpents, Ko'shairi and Quer'ranna as rain and fertility
    specialists and attendants of Ka'suna personators, and Ma'asewe's later organization
    of similar societies in the upper world after destroying hostile beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ct'sêt, under the direction of Sussistinnako, originates cult societies in
    the lower world and gives certain societies healing secrets.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cult societies are presented in a line of succession, and most are named
    for the animals of which they are composed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first society is Ka'pina, composed only of spider people, with Sussistinnako
    as its theurgist; its members know his medicine secrets.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bear and cougar societies are consolidated into a knife society, with
    the cougar placed before the bear because of the cougar's calmer behavior toward
    people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Six snake societies are assigned to north, west, south, east, heavens, and
    earth, with named serpents associated with those directions or regions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The northern and southern serpents have influence over cloud people and bear
    cloud emblems on their bodies.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The western and eastern serpents have esoteric relations with the sun and
    moon and are painted with crescents.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The serpent of the heavens is crystal-like, brilliant, and closely allied
    to the sun; the serpent of the earth is spotted like the earth and retreats into
    an earth house when approached.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Seven ant societies follow the snake societies; several animal, snake, ant,
    and eagle societies are given medicine secrets.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ko'shairi receives rain medicine directly from the sun, and Ko'shairi songs
    are described as invocations for rain to fructify the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Quer'ranna has an office similar to Ko'shairi but is associated with the moon;
    the sun gives him medicine connected with making the earth and women pregnant.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the Sia, animals, and Ka'suna enter this world, the Ka'suna are directed
    west; masks are made to represent them before their departure.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ct'sêt sends Ko'shairi and Quer'ranna east, placing Ko'shairi near the house
    of the sun and Quer'ranna slightly north of it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ko'shairi functions as courier between the sun and Ka'suna and as mediator
    between the Sia and the sun.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Two orders named for Ko'shairi and Quer'ranna wait upon Ka'suna personators;
    their representatives are treated as exact reproductions of the originals.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Ko'shairi and Quer'ranna representatives have distinctive body paint,
    hair arrangements, and clothing; their behavior includes attending Ka'suna personators
    and performing buffoonery.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: After Ma'asewe kills bad people of the world, he proposes organizing societies
    like those of the lower world to learn medicine secrets from animals.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Ma'asewe first organizes the upper-world Knife society because knives or arrows
