canonical_text:
  quote: ''
  summary: The passage gives a legend of Tung ak's origin as a bereaved father transformed
    into a destructive spirit, describes the fasting ordeal through which a would-be
    Angekok or shaman gains life-preserving secrets, and reports healing, compensation,
    penance, animal-blood appeasement, weather knowledge, and hunting functions attributed
    to shamans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father loved his son and daughter; the children fell ill and died despite
    his care.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the children's death, the father became a vicious spirit who roamed
    the world to destroy people because his own children had died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tung ak visits people of all ages, places obstacles in their paths, provokes
    illness and death, and imagines people he meets to be his own children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Famine, disease, and death are described as being sent abroad to search for
    Tung ak's lost children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People discover that fasting, abstinence from contact with others, and retreat
    to a lonely spot can endow a person with supernatural powers and knowledge of
    Tung ak's secrets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the ordeal, Tung ak is supposed to stand near, reveal knowledge, threaten
    seizure if the person fails, then spare the person and impart the secret of preserving
    life or driving out death-causing evil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The newly made Angekok returns to the people, recounts the ordeal, and demands
    compensation for services, saying greater pay brings greater good.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In healing, the shaman is blindfolded or covered, the patient lies on the
    ground, and the shaman enters frenzy and prostrates himself on the afflicted person.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The shaman chases the evil from one part of the patient's body to another,
    making loud noises; the patient may receive severe blows and jerks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a patient dies, the shaman may attribute failure to outside interference
    such as auroras, snow, or a dog acting as an instrument of a spirit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person may wear a dog harness as penance, and the tail of a living dog may
    be cut so fresh blood can be cast on the ground to appease the harmful spirit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Shamans are also consulted for weather lore, charms for hunting success, and
    attracting deer or other game.
  category: action
  evidence_refs:
  - ev:9
