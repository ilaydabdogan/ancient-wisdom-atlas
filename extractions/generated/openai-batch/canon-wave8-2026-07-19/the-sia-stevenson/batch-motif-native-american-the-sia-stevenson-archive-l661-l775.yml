canonical_text:
  quote: ''
  summary: The passage describes Sia marriage procedure, including a gift bundle,
    parental counsel, private marriage, a later feast, and the custom of the groom
    living with his wife's family. It then describes Pueblo-style dress and hair,
    children's work, girls carrying water, women and children participating in house
    building, gendered construction tasks, detailed floor-making methods, and individual
    livestock herding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The groom goes alone to the girl's house with gifts wrapped in a blanket after
    his parents have preceded him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl receives the bundle, the girl's mother deposits it in the room, and
    the groom then sits beside the girl.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The parents of the bride and groom speak in turn, counseling the couple to
    be as one, avoid bad words, and live for one another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the strictly private marriage, invited guests assemble for a feast whose
    elaborateness depends on family wealth and prominence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tribal custom requires the groom to make his home with his wife's family,
    although some husbands later provide a separate house for their family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage describes men's and women's hair arrangements as conventional
    Pueblo dress, with some younger women adopting a Mexican-style arrangement.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Boys assist elders in farming and pastoral pursuits, girls perform domestic
    duties, and children care for younger siblings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each little girl has her own water vase when old enough to accompany her mother
    to the river as an assistant water-carrier.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women and children are said to enjoy house building; women do most of the
    work, while men make adobe bricks, do carpentry, lay heavy beams, and sometimes
    assist otherwise.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sia houses are made of adobe and small boulders gathered from ruins, and older
    houses are remodeled and smoothly plastered inside and outside.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Floor-making includes breaking the earth, removing rocks, bringing clay, mixing
    it with loosened earth, brushing, sprinkling, leveling, stamping, pounding with
    smooth stones, and plastering by hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: House floors may be improved with a coating of beef's or goat's blood, but
    such floors require frequent renovation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sheep herds and cattle are individually owned or herded; boys from different
    families sometimes herd their stock together.
  category: relationship
  evidence_refs:
  - ev:7
