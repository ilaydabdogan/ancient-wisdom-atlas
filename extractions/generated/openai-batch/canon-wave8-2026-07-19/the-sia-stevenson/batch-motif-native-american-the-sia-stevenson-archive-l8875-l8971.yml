canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of people around Port Chimo,
    including bodily proportions, facial features, seasonal changes in skin color,
    hair, cleanliness, scarring, and aging. It then describes social responses to
    jealousy, murder, bad character, kin vengeance, community execution, the tabooing
    of Akpatok because of murdered victims' ghosts, and the neglect or killing of
    aged people without relatives, including a Fort Chimo example of a proposed strangling
    postponed when the woman's eye improved.
  language: English
  quote_policy: summarized
