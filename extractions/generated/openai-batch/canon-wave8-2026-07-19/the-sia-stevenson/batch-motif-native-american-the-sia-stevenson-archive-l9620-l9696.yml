canonical_text:
  quote: ''
  summary: The passage describes mortuary treatment of the body, precautions against
    the returning spirit, exposure of the corpse with stones to protect it from animals,
    social responses to dying and bereavement, and beliefs that death separates soul
    from body, with spirits going either upward to the sky or downward into the earth
    according to conduct and manner of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a person dies, the body is bound with cords, with knees drawn up, heels
    placed against the body, arms tied down, and a deerskin or sealskin covering wrapped
    and fastened around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nearest relatives move an invalid outside the house as death approaches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a person dies inside the house, the body is not to be carried out through
    the door but through a hole cut in the side wall, which is then closed to prevent
    the spirit from returning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body may be exposed in the open air beside a large rock or taken to the
    shore or a hilltop.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stones of different sizes are piled around the body to keep birds and animals
    from reaching it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: It is considered a great offense if a dog is seen eating flesh from a body.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: A beloved dead child may sometimes be taken along with its people if they
    move to another locality before decomposition has progressed too far.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dying person is described as calmly resigning himself to fate and seldom
    complaining during illness or pain.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Friends often show strong grief, though much weeping is said to occur only
    in exceptional cases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The loss of a husband may cause hardship for a wife and small children, who
    depend on help from others with limited means.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people are said to believe in a future state and to regard death as the
    separation of the soul and the material body.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Spirits of the soul are described as going either upward to the sky or downward
    into the earth, with names given for the two classes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The two classes of spirits are said to be able to communicate with each other.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The soul’s destination is said to depend on the person’s conduct on earth
    and especially on the manner of death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Those who die by violence or starvation and women who die in childbirth are
    said to go to the region above.
  category: sequence
  evidence_refs:
  - ev:8
