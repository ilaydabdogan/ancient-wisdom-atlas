canonical_text:
  quote: ''
  summary: The passage describes Nenenot sweat houses used for steam baths, including
    their dome-shaped construction, heating process with fire, stones, and water,
    the exhaustion of the bather, frequent use including before journeys, an incident
    at Fort Chimo in 1882 involving reindeer rushing toward an occupied sweat house,
    and the presence of old sudatory traces along travel paths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nenenot habitually take steam baths in a structure called a suda-ory or
    sweat house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sweat house is made from flexible willow or alder poles bent into a hemispherical
    or dome-shaped frame and covered with tent skins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sandy or snow-free place is selected; a fierce fire heats stones, the fire
    is removed, and the structure is erected over the hot stones with its edges fastened
    down by stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Water from a kettle is poured over the hot stones, producing intense heat
    and perspiration; water is not used for bathing except sometimes in a small amount
    on the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bather remains inside the hut until the heat has nearly exhausted him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: These baths are taken frequently and may delay a journey when the head of
    the family desires a bath after starting out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Fort Chimo in spring 1882, numerous reindeer were crossing toward the northeast
    to drop fawns, and panicked herds rushed among tents and station houses with dogs,
    women, and children at their heels.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: An old man and his wife were in a sweat house when a large drove of deer headed
    toward it; after a warning, they exited as the animals reached the spot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After exiting, the man tore up the bath-house tenting and whirled it in the
    air, while the old woman made striking movements; the whole population witnessed
    and increased the tumult.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Signs of former sudatories are common along paths where the Indians have traveled
    for many years.
  category: setting
  evidence_refs:
  - ev:4
