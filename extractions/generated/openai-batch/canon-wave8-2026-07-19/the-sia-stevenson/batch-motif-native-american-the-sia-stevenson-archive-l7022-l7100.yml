canonical_text:
  quote: ''
  summary: The passage reports Sia beliefs about the dead, including a single past
    occasion when departed spirits returned for a feast, descriptions of the spirit
    world and its entrance, ideas about aging back toward infancy before entering
    the other world, accounts of temporary death, and mortuary procedures involving
    bathing, lamentation, painting, corn pollen, cut clothing, food offerings, and
    wrapping the body for burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Sia generally do not believe dead spirits return
    after entering Shipapo, but it introduces one exception.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the exceptional account, spirits of the dead came to the village for a
    great feast with bodies like those they had before death, and relatives recognized
    one another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spirits arrived mostly after dark, remained until near dawn, and stayed
    only one night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The account says husbands and wives among the living and dead did not sleep
    together, because doing so would have caused the living to die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At separation, the living wanted to go with the dead, but the dead said the
    living must wait and must die or grow old and become little children before passing
    through the door of the departed world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The future home of the dead is described as having large fields, beautiful
    pastures, high mountains, clear lakes and rivers, and flourishing wheat and cornfields.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The departed spirits are said to sleep during the day and work in the fields
    at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The moon is called father to the dead, while the sun is called father to the
    living; the dead world is said to be below and to be the world first inhabited
    by the Sia.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Some people are said to have died only temporarily: the heart becomes still,
    the lips cold, the spirit reaches the entrance of the other world, looks in, and
    returns to the body.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If death occurs before sundown the body is buried as soon as prepared; if
    death occurs after dark the body is not touched until after sunrise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: An elderly woman of the clan usually bathes the body with cold water, washing
    the head first in yucca suds, while immediate relatives and clan members lament.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Deceased official members of cult societies are painted after death as they
    were at initiation, and corn pollen is sprinkled on the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: For non-official men, each clan man or woman who looks on the body sprinkles
    corn pollen under each eye and on the top of the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Relatives cut the corpse's apparel and blankets into strips and lay them on
    the body; food is placed under the left arm before the body is wrapped in a blanket.
  category: action
  evidence_refs:
  - ev:8
