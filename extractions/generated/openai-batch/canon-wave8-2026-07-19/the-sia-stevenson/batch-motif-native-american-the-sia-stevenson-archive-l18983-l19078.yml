canonical_text:
  quote: ''
  summary: The passage is an ethnographic discussion distinguishing ordinary myths,
    legends, and stories from Wakanda-related sacred or superhuman matters among Omaha,
    Ponka, and related groups. It discusses myth-telling conditions, loss and variation
    of traditions, comparisons with Cherokee, Zuni, and Navajo classifications of
    sacred knowledge, and a possible link between personal names, myth, sweat-bath
    prayers, Four Peaks, and two Wakanda beings above and in the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Omaha, Ponka, and cognate tribes distinguish myth
    and legend or story from Wakanda-related or superhuman matters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first class of myth and legend is described as told for amusement, called
    lying tales, and regarded as pertaining to the ludicrous.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author reports having found some Indian myths with obscenity and no stated
    connection to natural origins, mystery, or religion; their origin is left unresolved.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Omaha and Ponka customs and beliefs are disappearing, and
    ranks Ponka, Kansa, and Osage as relatively more conservative than Omaha in the
    author's estimation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Indians are reported to have said myths should be told only on winter
    nights, but the author says he obtained myths by day in various seasons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: James Alexander is reported as saying Winnebago myths have changed materially
    in transmission; the author also reports multiple current versions of a single
    myth and a narrator's additions to the Big Turtle myth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that no fasting or prayer is required before telling a
    myth, unlike matters that are Wakanda-related or connected with visions or secret
    societies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that Zuni people distinguish folk-lore and mythic tales
    from cult-lore, creation dramas, and religious observances, assigning special
    names to each class of knowledge.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When Zuni people enact the creation story, the passage says they believe they
    are repeating the represented circumstances and are surrounded by the beings referred
    to in sacred stories.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says there appears to be a connection between certain myths and
    nikie personal names, giving Four Peaks as an Omaha example linked to the myth
    of Haxige and sweat-bath stone prayers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: In gathering stones for the sweat-bath, each stone was invoked as a venerable
    man; Four Peaks were mentioned, and two superior deities or chief mysterious ones
    were invoked.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The two superior deities are explained as Wakanda residing above and Wakanda
    in the ground; the author says a former lack of differentiation between myth and
