  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Most Omaha governmental instrumentalities are described as Wakanda-related,
    while some Wakanda-related things, such as catamenial seclusion, are not governmental
    instrumentalities.
  category: relationship
  evidence_refs:
  - ev:10
