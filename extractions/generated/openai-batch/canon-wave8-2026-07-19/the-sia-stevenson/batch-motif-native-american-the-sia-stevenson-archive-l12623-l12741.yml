canonical_text:
  quote: ''
  summary: 'The passage describes small Hudson Bay Eskimo ivory carvings, household
    storytelling practices among the Koksoagmyut, and several legendary accounts:
    the origin of the Innuit from a man created from nothing and a woman from another
    land; a prophecy and arrival of white people involving two puppies set adrift;
    origins of animals from moving tree chips; origins of plants after water once
    covered the earth; and origins of sea mammals and white bears from the severed
    fingers of an abandoned woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collection includes small ivory carvings of waterfowl, a polar bear, tattooed
    women, and bags of oil; the passage states the carvings are tests of skill and
    toys for children, not observed as game pieces.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Koksoagmyut are described as fond of storytelling, with old men and old
    women narrating while younger members listen at night in the hut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One story says a man was created from nothing, found a woman in another land,
    married her, and that all the people dwelling there descended from them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the account of the coming of the white people, the Eskimo are near starvation
    and the greatest Tungaksoak prophesies that light-haired, white-skinned people
    will come in an immense umiak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The greatest Tungaksoak sets two puppies adrift, one on a chip and one on
    an old sealskin boot; one returns with the Indians, and the other later appears
    as a man announcing people in a vessel before becoming a dog.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In one account of living things, chips cut from a tree move as they fall;
    chips falling into water become water inhabitants, and chips falling on land become
    land animals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In another account, water formerly covered the earth, then went away; seaweeds
    became trees, shrubs, bushes, and grass, with grass later placed in various locations
    by a walrus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A widowed woman living on charity is cast overboard by strangers traveling
    by umiak; when she grasps the boat, the others cut off her fingers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman's severed fingers fall into the water and change into seals, walrus,
    whales, and white bears; the thumb becomes a walrus, the first finger a seal,
    and the middle finger a white bear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says seals and walrus try to escape humans, while the white bear
    feels revenge and seeks to destroy a human when it perceives one.
  category: attribute
  evidence_refs:
  - ev:7
