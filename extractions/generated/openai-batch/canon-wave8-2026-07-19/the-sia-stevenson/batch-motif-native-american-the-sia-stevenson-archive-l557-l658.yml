  quote: ''
  summary: The passage describes the reduced number of Sia clans, lists extinct clans,
    discusses pressure to preserve the population despite older marriage laws, describes
    a puberty observance for girls, reports courtship and sexual customs as observed
    by the writer, and begins an account of marriage preparations involving the groom
    and parental clans.
  language: English
  quote_policy: summarized
