canonical_text:
  quote: Prayer to Wakanda was not made for small matters... but only for great and
    important undertakings.
  summary: The passage describes Omaha and Ponka prayer to Wakanda for major undertakings
    such as war or travel. A traveler prays alone on a bluff for protection of his
    family and success on the journey. In famine, Horse-with-yellow-hair prays to
    Wakanda on a hill near Stony Butte. Prayer places are described as rocks, high
    bluffs, and mountains; people smoke toward the invoked object and place gifts
    on it. The passage also notes a Dakota custom of invoking a prairie boulder as
    Grandfather, symbolizing the Earth-being, and reports that Omaha and Ponka inform
    various Wakandas, including bluffs and living beings, when first-warpath names
    are changed.
  language: English
  quote_policy: quoted
