canonical_text:
  quote: ''
  summary: 'The passage reports suicide methods and causes in a northern locality,
    then gives examples of behavior during scarcity: a man traps his wife in a snow
    hut after discovering she has hidden and eaten fish, families are said to have
    resorted to cannibalism after consuming dogs and skin articles, and unlucky or
    disliked women may be expelled from camp to seek relief or die.'
