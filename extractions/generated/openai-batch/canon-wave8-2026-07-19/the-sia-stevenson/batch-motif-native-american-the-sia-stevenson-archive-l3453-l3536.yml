canonical_text:
  quote: ''
  summary: The passage describes a Snake Society ceremonial sequence at an altar.
    Participants sprinkle meal and medicine water, pollen is offered to the Snake
    ho'naaite, a cloud-maker is purified with ashes, prepares cloud-symbolic suds
    in a bowl, dances while casting suds toward directions, ritual places, and participants,
    and repeatedly calls the cloud people to gather. A cigarette is lit from the fire
    and smoke is blown over the suds; the song ends, and a later song begins with
    two women dancing and sprinkling the altar with wands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants take pinches of meal from a meal bowl, sprinkle the altar, and
    return to their seats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ya'ni^siwittanni waves a rattle along a line of meal and out the door,
    passes a hand over the line, and throws pollen from the fingers as an offering
    to the Snake ho'naaite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ho'naaite dips plumes into medicine water and sprinkles the altar by striking
    the plumes with a rattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cloud-maker, identified as a member of the Spider Society, crosses the
    line of meal, holds eagle plumes, a rattle, and a reed, and prays while standing
    still.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The vice ho'naaite dips ashes from the fireplace with eagle plumes, sprinkles
    the cloud-maker for purification, and throws remaining ashes toward the choir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cloud-maker puts to'chainitiwa root and corn pollen into water and stirs
    with a reed to make snowy-white froth described as symbolic of clouds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cloud bowl stands on a yucca pad after a circle of meal, described as
    symbolic of the heart or life of the water, has been made; the reed is kept in
    the bowl during stirring and then placed upright in the suds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The cloud-maker dances and throws suds toward multiple directions, ritual
    locations, and participants, while invoking the cloud people.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Other participants dip plumes or a wand into medicine water to sprinkle the
    altar or members and petition the cloud people to gather.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The cloud-maker places suds on the heads of the white bear and parrot and
    then stirs the suds briskly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ti'iimoni lights a cigarette from a coal at the fireplace and gives it
    to the cloud-maker, who blows initial smoke over the suds, smokes briefly, and
    lays part of the cigarette beside the cloud bowl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: After an almost continuous song of about three hours ceases, participants
    return to their seats and continue smoking.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the beginning of a succeeding song, two women at the east end of the south
    line dance before the altar and sprinkle it by striking one wand with another;
    one woman is sometimes unable to participate because of her infant.
  category: action
  evidence_refs:
  - ev:9
