  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The old man and wife exited just as many deer reached the spot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The man tore up the bath-house tenting and whirled it in the air, while the
