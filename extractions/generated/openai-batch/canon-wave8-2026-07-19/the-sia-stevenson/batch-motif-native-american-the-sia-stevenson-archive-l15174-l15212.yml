canonical_text:
  quote: ''
  summary: The passage describes Nenenot steam baths in dome-shaped sweat houses made
    of bent poles and tent skins, heated stones, fire, and water. It notes frequent
    use, including delays before journeys, recounts a Fort Chimo incident in which
    deer disrupted an old couple in a sweat house, and states that remains of old
    sudatories are common along travel paths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nenenot are described as habitually taking steam baths in a suda-ory or
    sweat house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sweat house is described as a hemispherical or dome-shaped structure made
    from flexible small poles, usually willow or alder, and covered with tent skins.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sandy or snow-free place is selected, a fierce fire is built, and stones
    are heated in the fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the stones are hot, the fire is removed, the structure is erected over
    the stones, and someone outside fastens the tenting edges down with stones to
    retain heat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water from a kettle inside the bath house is poured over the stones, producing
    intense heat and perspiration.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The bather does not bathe in water, though a little water may be poured on
    the head, and remains inside until nearly exhausted by heat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The baths are taken frequently, and the head of a family may halt a journey
    until a bath is completed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Fort Chimo in spring 1882, numerous reindeer were crossing toward the northeast
