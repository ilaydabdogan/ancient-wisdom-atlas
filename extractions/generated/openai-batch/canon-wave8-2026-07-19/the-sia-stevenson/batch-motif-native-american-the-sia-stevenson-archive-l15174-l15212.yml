  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The whole population witnessed the incident and increased the tumult.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Signs of former sudatories are said to be common along paths where the Indians
