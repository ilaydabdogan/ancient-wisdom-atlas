  summary: The passage describes diseases, crowded snow-hut living conditions, shamanic
    treatment, social responses to murder, taboo of a haunted island, abandonment
    or killing of aged people, suicide, starvation punishment in a food-scarcity anecdote,
    famine cannibalism, and expulsion of disliked women.
