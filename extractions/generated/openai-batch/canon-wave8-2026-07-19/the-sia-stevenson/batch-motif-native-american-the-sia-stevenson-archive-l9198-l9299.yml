literal_observations:
- id: obs:1
  text: Pulmonary troubles are described as the principal diseases, linked to crowded,
    poorly ventilated huts whose openings are kept closed to retain heat.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman or conjurer is described as relieving sickness by influencing the
    imagination of the sick person, with both patient and shaman exerting will power
    and faith.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the magnitude of disease is generally measured by
    the amount of the patient's worldly wealth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person judged intolerably bad may be excluded from huts, food, and social
    intercourse; a murderer may be surprised and put to death, usually by stoning,
    with community support.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In premeditated murder, the next of kin is said to have the duty of avenging
    the deed, even after years have passed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Akpatok is described as tabooed after the murder of shipwrecked crew members
    because the ghosts of the victims might appear and ask relief, while the people
    lack proper offerings to appease them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Aged people without relatives may be neglected, abandoned during a move, or
    found dead with stones piled around the corpse and the body bound with thongs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An old woman at Fort Chimo was proposed to be strangled to relieve her misery,
    but the plan was postponed when her sore eye improved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Suicide is described as occurring by throwing oneself from a cliff, strangulation,
    or a gun; remorse and disappointed love are named as causes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a scarcity anecdote, a man discovers his wife secretly eating stored fish,
    blocks the snow-hut entrance, and she remains inside until she dies of starvation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: During great scarcity, some families are reported to have resorted to cannibalism
    after eating dogs, clothing, and other skin articles.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Unlucky or disliked women are described as being driven from camp and forced
    to travel until they find relief or perish.
  category: action
  evidence_refs:
  - ev:12
