canonical_text:
  quote: ''
  summary: The passage describes variations in a multi-night Snake Society ceremonial
    involving offerings, ashes, plumes, meal lines, directional animal songs, a child
    participant, and dancers with bear-leg skins. It then begins a Knife Society rain
    ceremonial in which officials and members prepare songs, a slat altar, sand painting,
    ya'ya, fetiches, water, sacred meal, stone cougars, bear-leg skins, a cloud bowl,
    and consecrated sprinkling rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vicar lifts ashes from the fireplace, uses two plumes to sprinkle the
    altar, and repeats a long, scarcely audible prayer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bread dipped in stew is scattered to animal fetiches and also thrown toward
    the cardinal points; the stew bowl and bread basket are moved to the northwest
    corner.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The floor is swept with two eagle plumes; a blanket is laid; meal lines are
    drawn from the altar area over the blanket toward the entrance and from the center
    toward the north and south walls.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The child is brought into the room by the man seated between the ho'naaite
    and the vicar and is led out by the ti'amoni; on the second, third, and fourth
    nights the child walks in and out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The second-night songs are addressed to the bear of the west, with the cougar
    of the north named as the earlier contrast.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The third and fourth nights are described as coinciding with the second night,
    with variations; songs are addressed on the third night to the badger of the south
    and on the fourth to the wolf of the east.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Dancers wear bear-leg skins on arms where amulets are worn, and their dancing
    and incantations are described as more turbulent and weird than on the former
    nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Knife Society ceremonial, the ho'naaite and his vicar make hi'chamoni
    and rehearse songs in undertones; the society membership is enumerated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Knife Society ho'naaite sets up a slat altar, removes ya'ya and other
    fetiches from buckskin sacks, unwraps his ya'ya, and prepares a sand painting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Five ya'ya are placed on a special line, each with a miniature bow and arrow
    before it; human and animal fetiches, a medicine bowl containing water, sacred
    meal, and a meal line are arranged before the altar.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Two large stone cougars, a smaller cougar with lightning cut in relief, a
    concretion, bear-leg skins, a cloud bowl, a reed, hi'chamoni, and plume offerings
    are deposited in the altar arrangement.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The ho'naaite consecrates the bowl of water by prayer, drops six fetiches
    into it, dips eagle plumes into the water, strikes them with his rattle, and sprinkles
    the altar and cardinal points; the vicar forms a circle of meal.
  category: action
  evidence_refs:
  - ev:10
