canonical_text:
  quote: ''
  summary: A wolverene taunts an animate rock, is chased and pinned beneath it, and
    is freed only when lightning shatters the rock, tearing his coat or skin. He has
    his coat sewn by frog and mouse sisters, rewarding the mouse's successful work.
    In a separate origin narrative, a wolverene marries a muskrat woman; their five
    children are born through different bodily exits and become fathers of named peoples.
    A final fragment begins an etiological tale in which a marten courts a married
    woman and the husband prepares a boiling-water trap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wolverene insists that the rock can walk, taunts it, strikes it with his
    paw, and challenges it to catch him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rock says it cannot run but can roll, rolls after the wolverene, and comes
    to rest on him after he trips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wolves and foxes come when called, say the wolverene deserves his situation,
    and cannot move the rock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolverene calls lightning and thunder his brother; a dark cloud comes
    from the southwest, and lightning breaks the rock into pieces while stripping
    and tearing the wolverene's coat or skin.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The wolverene asks his frog sister to sew the torn coat, rejects her work,
    and knocks her into the water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wolverene's younger sister, the mouse, sews the coat well; he says she
    will live in tall green grass in summer and in grass houses in winter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wolverene meets a muskrat woman swimming at the edge of a river, declares
    that he will take her as wife, and they establish a home.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Five children are born to the muskrat woman and are designated by the wolverene
    as fathers of white people, Indians, Eskimos, Iroquois, and Negroes.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: 'The five children are born through different bodily exits: natural exit,
    mouth, ano, nose, and ears.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The children's mother sends them to different parts of the land and instructs
    them to go to white men when in need of anything.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A marten repeatedly enters a man's home while the man is away and tries to
    persuade the wife to leave her husband and live with him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The husband tells his wife to boil water on the fire, hides near the house,
    and sees the marten enter.
  category: sequence
  evidence_refs:
  - ev:7
