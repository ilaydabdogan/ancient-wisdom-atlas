canonical_text:
  quote: ''
  summary: The passage describes Omaha-specific forms of decoration, especially tent
    and coyote-skin designs associated with sacred visions. It explains painted bands
    and figures as signs of night, stars, moon, sun, a ghost seen in the moon, deer
    rattles, a Thunder-being vision, rainbow, hail spots, and an ascent to a world
    above.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tent decoration is described in which the blackened part represents night
    and a star denotes the morning star; additional stars were placed at the left
    back and right side of the tent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that black and blue are sometimes interchangeable in Omaha
    symbolism, and gives a blue band on a coyote skin as another representation of
    night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The decoration is said to refer to a "qube" or sacred vision.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Little Cedar is described as belonging to an Omaha gens and to an order of
    Sun and Moon shamans, probably identical with the order of Thunder shamans.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Little Cedar's vision decoration is explained as including a black band for
    night, a circle for the moon, a circumscribed figure representing a ghost seen
    in the moon, and dots above the moon representing white light above the rising
    sun or moon.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another decoration of Little Cedar has a red circle representing the sun,
    with a man standing in it holding deer rattles; a real feather was tied to the
    painted man's head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The blue band at the bottom of the same decoration may represent night, but
    the passage says this is uncertain.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ni-ku-^i-b^ is described as one of two leaders of the order of Thunder shamans
    and as very mysterious; his tent decoration has a black band for night, with the
    moon and a star above it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ni-ku-^i-b^ named a grandchild Ha-akipa, translated as Meets the Night, after
    the vision connected with the tent decoration.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An account attributed to George Miller and to Ni-ku-^i-b^'s widow says that
    Ni-ku-^i-b^ had a vision of the Thunder-being and made a rainbow in the decoration.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same account says that the top of the tent near the smoke-hole was painted
    with spots, and the interlinear explanation says the spots represent hail.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Thunder-being is said to have carried Ni-ku-^i-b^ up on high, to a world
    above this one that resembled this world.
  category: action
  evidence_refs:
  - ev:8
