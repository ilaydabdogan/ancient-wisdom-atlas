  quote: ''
  summary: The passage introduces sources for information on X3iwere and Winnebago
    cults, then quotes William Hamilton's report that he did not hear the Iowa use
    the term “Great Spirit.” He says they speak of God as Wakanta, sometimes as Great
    God or Bad God, sometimes as creator of the earth or Grandfather, and sometimes
    speak of the sun and moon as gods. In response to a question, an Iowa person says
    the Iowa have seven gods.
