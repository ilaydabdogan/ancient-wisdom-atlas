canonical_text:
  quote: the use of amulets is universal
  summary: 'The passage describes a shaman mediating with a deer guardian spirit,
    rules for handling the first deer killed and keeping dogs from the meat, and several
    kinds of amulets: charms against harmful spirits, headless-doll remembrances of
    deceased relatives, images or parts of natural objects connected with personal
    names, success-bringing curiosities, and examples including a wooden kayak model
    and a four-headed healing charm.'
  language: English
  quote_policy: quoted
