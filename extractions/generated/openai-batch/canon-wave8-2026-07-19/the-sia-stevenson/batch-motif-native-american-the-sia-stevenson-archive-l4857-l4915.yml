canonical_text:
  quote: this froth is always referred to by the Sia as clouds
  summary: At the shrine of the Knife Society, participants prepare native tobacco
    and cigarettes. The viceho'naaite or vicar sits before the cloud bowl, is sprinkled
    with ash from eagle plumes, and receives a white eagle feather tied to his forelock.
    He uses powdered root, corn pollen, a reed, and water in the cloud bowl to make
    froth, described as clouds, then distributes suds toward the altar, directions,
    zenith, nadir, the white bear, and the parrot. The choir sings to the cloud peoples.
    The vicar smokes native tobacco toward the directions, returns the feather, and
    boys distribute cigarettes to the members.
  language: English
  quote_policy: quoted
