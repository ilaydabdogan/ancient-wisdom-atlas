canonical_text:
  quote: ''
  summary: In an OCR-noisy animal tale fragment, Rabbit repeatedly becomes frightened
    by smoke and relies on Frog, who boasts of hunting abilities. Rabbit carries Frog
    to beaver and deer locations. Frog survives being shoved under ice, kills beavers,
    later kills and skins deer, and deceives or tests Rabbit with staged animal remains
    and frozen lungs. Rabbit eats all the beavers and later eats the frozen lungs,
    becoming violently ill. The fragment ends as Rabbit walks and addresses a rock
    that replies.
  language: English
