  summary: The passage describes a cup-and-ball-like game using animal-bone and fur
    implements, the construction and preparation of a drum with hoops, membrane, thongs,
    quill snares, and a reindeer-horn stick, the frequent sounding of the drum in
    daily and communal circumstances, drumming at death to prevent a deceased spirit
    from returning to trouble the living, singing with drumbeat, and a constructional
    comparison between Little Whale river and Ungava drums.
  language: English
