    because seals may take offense and leave the hunting locality.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage frames the material as a year in the life of Eskimo people in
    the immediate vicinity of Fort Chimo and notes that some Koksoagmyut do not engage
    in the described occupations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before undertaking journeys for themselves, the people deliberate, consult
    one another, compare localities for game, and consider possible illness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Once a journey destination is resolved upon, only serious obstacles are said
    to thwart the purpose.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women are described as bringing wood, water, and nearby food, making skins
    into clothing and other articles, and cooking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a hunt lasting several days, the family watches for the husband's return,
    the load is taken from sled or boat, and incidents of the chase are recited to
    listeners.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In early spring, women make boots for summer wear from seal skins that were
    prepared in the preceding fall and stored until needed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Seal-skin preparation includes fermenting a liquid in vessels, cleaning the
    skin of fat and flesh, removing hair, dressing the skin with a tool, rubbing or
    chewing it until pliable, soaking it, drying it, and softening it again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Boot dimensions are measured with the hand and fingers, and the skin is cut
    with a round knife called olo; the passage notes metal blades in current use and
    slate, flint, or ivory blades formerly.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Worn boots are turned inside out, dried, chewed and scraped by an old woman
    for biscuit payment, and stitched or patched with sinew thread when leaking or
    worn through.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some women excel at boot-making and may specialize in making boots while others
    prepare other garments in return.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: During spring sealskin clothing work, women must not sew any piece of deerskin
    that has not already been sewn, because the seals might take offense and leave
    the selected spring seal-hunt locality; deer flesh may be used, but the skin must
    be discarded.
  category: relationship
  evidence_refs:
  - ev:7
