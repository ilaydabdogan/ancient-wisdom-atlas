canonical_text:
  quote: The moon is addressed as a "grandfather" and is described as the "Wakanda
    of night" in "Osage Traditions."
  summary: The passage reports that Omaha and Ponka moon invocations have not been
    found, but that the moon is considered sacred through robe and tent decorations,
    and that Osage tradition addresses the moon as grandfather and Wakanda of night.
    It then describes Omaha beliefs about Mi°-qu-ga, whose status is attributed to
    being affected by the Moon Being during a puberty fast vision involving bow and
    arrows and a women's pack strap. The passage adds statements from named informants,
    a Ponka child, a Kansa comparison reported by Say, and an account from Fletcher
    of a man who resisted this imposed life.
  language: English
  quote_policy: quoted
