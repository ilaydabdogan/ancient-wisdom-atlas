canonical_text:
  quote: ''
  summary: 'The passage describes household containers, berry baskets, deer-skin bags,
    pestles, spoons, pothooks, tobacco practices, and stone pipe manufacture. It notes
    materials such as spruce, larch, roots, deer leg skins, reindeer antler, stone,
    slate, tobacco, molasses, water, and fire, and includes two explicit comparisons:
    wooden vessels like those of Yukon River Indians of Alaska and one ladle shape
    perhaps copied from a non-Indigenous ladle.'
