canonical_text:
  quote: ''
  summary: The passage describes reported sorcery, love potions, sleight of hand,
    and shamanic legerdemain among Omaha, Ponka, and Kansa figures. It includes reports
    of love magic using bodily substances, doctors pretending to remove disease-causing
    objects, named chiefs and shamans performing celestial, hunting, projectile, swallowing,
    self-wounding, and fetish-bag acts, and the use of medicines, animal parts, stones,
    water, and other objects in such acts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sorcerers are described as preparing love potions for purchasers and as being
    thought able to cause the death of persons who displeased them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A reported love potion ingredient was a small quantity of the catamenial discharge
    of a virgin, said to make a man court a woman against his own knowledge of not
    loving her.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sleight of hand is described as occurring in secret societies and in connection
    with medicine, government, and religion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some Omaha and Ponka doctors are said to pretend to draw sticks from patients'
    bodies or worms from aching teeth as causes of disease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Whip is reported to have said he would make the sun blue and pull hair from
    the man in the moon, after which bloody hair appeared in his hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Buffalo Bull is reported to have made a pile of earth, shot four arrows into
    it, and thereby caused a large deer to be slain for food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cramped Hand appeared to be shot by a revolver, fell as if wounded, was manipulated
    by Bent Horn, and coughed up a bullet into a basin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bent Horn displayed a large stone-like object, was struck in the mouth by
    it, appeared in pain, and later small stones fell into a basin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nixudje-yinge reported that Kansa shamans had round pebbles blown from their
