  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A red medicine owned by John Kickapoo's father was said to be used for women
    desiring pregnancy, for horses, and for good dreams; Nixudje-yinge's mother had
    a pebble and clam shell for mystery acts.
  category: object
  evidence_refs:
  - ev:7
