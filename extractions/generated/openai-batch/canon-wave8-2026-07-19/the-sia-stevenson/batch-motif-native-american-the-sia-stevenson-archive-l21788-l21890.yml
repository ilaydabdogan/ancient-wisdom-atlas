candidate_motifs:
- id: motif:1
  label: Coercive love potion using bodily substance
  taxonomy_refs: []
  basis: The passage describes a love potion mixed with a virgin's catamenial discharge
    and administered to compel courtship.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Reported as ethnographic belief and sorcery practice, not as a mythic
    narrative episode.
- id: motif:2
  label: Disease caused by intrusive object removed by specialist
  taxonomy_refs: []
  basis: Doctors are said to draw sticks or worms from bodies or teeth and identify
    them as causes of disease or pain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The author frames the action as pretended sleight of hand; extraction
    records the reported pattern without validating the act.
- id: motif:3
  label: Performer manipulates celestial body or celestial figure
  taxonomy_refs: []
  basis: Whip is reported to make the sun blue and produce bloody hair from the man
    in the moon.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Single reported performance, mediated through an informant.
- id: motif:4
  label: Magical procurement of game in famine or scarcity
  taxonomy_refs: []
  basis: When food was lacking, Buffalo Bull performs an earth-and-arrows act followed
    by the slaying of a large deer.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a brief anecdote and does not explain the rite's wider
    structure or meaning.
- id: motif:5
  label: Projectile wounding followed by extraction or recovery
  taxonomy_refs: []
  basis: Cramped Hand appears to be shot and coughs up a bullet; Bent Horn is struck
    by a stone-like object and small stones appear; Gahige-wadayiiiga is wounded and
    later no wound is found.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: medium
  cautions: The author explicitly treats these as juggler or legerdemain performances
    rather than literal miracles.
- id: motif:6
  label: Mouth as passage for magical objects or beings
  taxonomy_refs: []
  basis: 'Multiple acts involve objects or beings passing through the mouth: bullets,
    stones, pebbles, a knife, a snake, and water.'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: This is a pattern across reported performances in the passage; its ritual
    interpretation is not supplied.
- id: motif:7
  label: Serpent drawn from the mouth after swallowing grass
  taxonomy_refs:
  - serpent
  basis: Sa°-si-le is said to swallow grass and draw a green snake from her mouth.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only one snake instance appears, and it is embedded in a legerdemain context.
- id: motif:8
  label: Fetish-empowered shamanic missile
  taxonomy_refs: []
  basis: Round pebbles and the Mi-pa-ha missile are described as shamans' projectiles,
    and Wakanda-zi's bear skin retrieves a pebble shot from the mouth.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage does not provide a full mythic origin for the missile or fetish.
- id: motif:9
  label: Animal part or animal skin as ritual implement
  taxonomy_refs: []
  basis: The passage describes a turtle-part missile, a flat fish skin necklace, and
    a small black bear skin sacred bag used in shamanic acts.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
