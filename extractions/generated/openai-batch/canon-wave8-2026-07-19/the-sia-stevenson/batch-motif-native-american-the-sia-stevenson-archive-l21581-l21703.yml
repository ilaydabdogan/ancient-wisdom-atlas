  quote: ''
  summary: The passage defines fetichism as spirits embodied in, attached to, or working
    through material objects; distinguishes tribal or gens fetiches from individual
    ones; and describes Omaha and Osage tribal fetiches, including a sacred pole and
    white buffalo hide, a sacred tent, stone arrows used for divination, mysterious
    sacred bags addressed as grandfathers, war-related bag rites, and stick-based
    testing of warriors.
  language: English
