canonical_text:
  quote: ''
  summary: The passage describes Sia offices and rituals around the installation of
    the ti'amoni, including declarations of ritual parenthood, presentation of a crooked
    staff attributed to mother Ct'set and the first ruler, drawing sacred breath from
    the staff, meal sprinkling, communal support, norms of office, appointment of
    officials, duties of the war chief and governor, restrictions around a Ka'-suna
    dance, punishment of witchcraft, and a list of clans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The incoming ti'amoni is accompanied by ritual officials to the ancestral
    official chamber, where war priests, theurgists of several cult societies, and
    their vicars have assembled for the installation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war priest declares the installed man to be the people's priest and both
    father and mother, and states that he is no longer to work in the fields or bring
    wood because the theurgists and his other children will labor for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ensign of the ti'amoni's office is a slender staff or cane crooked at
    the end; the passage says it is supposed to be the same staff presented to the
    first ruler by mother Ct'set, and that the crook symbolizes longevity.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ti'amoni draws sacred breath from the staff; the war priest embraces him,
    sprinkles meal on the cane, prays that Ct'set's thoughts and heart be conveyed
    from the staff to the new ruler, and also draws sacred breath from it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The theurgists, civil authorities, and then the populace, including women
    and children, repeat the embracing, meal sprinkling, and drawing of sacred breath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the following day, all members of the pueblo, including children, collect
    wood for the ti'amoni and place it by his dwelling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage contrasts customary expectations for a ti'amoni, whose mind should
    be absorbed in religion and the people's interests and who should leave the village
    only for pilgrimages, with the present young ti'amoni's hunting, field work, and
    pleasure rides.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Theurgists hold office for life, and each vicar succeeds to the function of
    his theurgist; vicars are appointed with the ti'amoni's approval.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Civil and subordinate military officers are selected through a December meeting
    of the ti'amoni, vicar, war priest, and vicar, followed by notice to the theurgists
    and public announcement.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The war chief patrols the town during cult society meetings and surrounds
    the village with mounted guards during a dance of the Ka'-suna; the passage says
    that a Mexican especially must not look upon these anthropomorphic beings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The war chief directs the hunt under the instruction of the war priest and
    vicar, while the governor oversees civil law and announces next-day duties in
    the plaza at sunset.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wizards and witches are tried and punished by the war priest; the passage
    reports that a man and wife had recently suffered death for this craft, and that
    their young son became a pauper while also belonging to the knife cult society.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage lists existing clans with names including corn, tobacco, coyote,
    squash, bear, and eagle.
  category: other
  evidence_refs:
  - ev:9
