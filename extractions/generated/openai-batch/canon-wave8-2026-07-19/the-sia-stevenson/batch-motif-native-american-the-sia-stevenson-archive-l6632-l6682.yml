canonical_text:
  quote: ''
  summary: 'The passage describes preparations and actions during a Sia childbirth
    rite: sand is shaped into a circular bed, water vessels, sheepskins, blankets,
    and a fireplace are arranged, the laboring woman is attended by a doctress, father/ho''naaite,
    sister-in-law, and mother, and Sussistinnako is described as bestowing new life.
    During pains, the woman kneels on the sand bed, is supported by her father and
    doctress, while the sister-in-law blows on an ear of corn placed to the woman''s
    head to hasten birth.'
  language: English
  quote_policy: summarized
