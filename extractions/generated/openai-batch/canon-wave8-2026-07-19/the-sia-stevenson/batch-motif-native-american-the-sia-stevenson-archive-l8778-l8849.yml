canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic observations on several Indigenous groups:
    family customs, a note that beliefs and traditions were not learned by the observer,
    bear trophies, a white-whale harpoon compared to Innuit equipment, the self-name
    and speech style of Ungava district Indians known as Naskopie, goose-call hunting,
    linguistic classification, and contact without intermarriage between Indians and
    Innuit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls are described as often taken as wives before puberty; families usually
    have two to four children; a male first child is preferred, and contempt may be
    applied to mothers of only female children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The observer states that the group's beliefs and traditions were not learned
    because other work occupied his time at Fort Chimo.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black bears are procured in great numbers, and the under lip is preserved,
    dressed, and ornamented as a trophy of prowess.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A harpoon used for striking white whales in rivers is described as peculiar
    to the people and as resembling that of the Innuit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The third division of Indians is described as dwelling mostly in the Ungava
    district, numbering about 350, self-applying the term glossed as 'true, ideal
    men,' and being known as Naskopie by an epithet applied by Mountaineers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Their speech is described as rapidly uttered, with abrupt inflections, vehement
    gestures, loud shouting, and penetrating voices that may be heard across the Koksoak
    river at Fort Chimo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The observer reports that words scarcely louder than a whisper were nevertheless
    understood across a great distance, as people on the opposite shore obeyed commands.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When women gather during trading, old women are described as trying to make
    their voices heard above the rest, and those outside the store shout at the top
    of their voices.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In spring, hunters imitate Canada goose notes so closely that the birds are
    lured to the spot; different party members imitate different notes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The observer says the limited vocabulary collected is sufficient to classify
    the people of the region, excluding Innuit and whites, as belonging to the Cree
    branch, with Mountaineers and Little Whale River Indians belonging to the same
    stock.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Indians and Innuit in the region are described as being in direct contact,
    especially at Fort Chimo, but not intermarrying; one Naskopie stayed briefly with
    an Innuit camp and then returned to his own people.
  category: relationship
  evidence_refs:
  - ev:11
