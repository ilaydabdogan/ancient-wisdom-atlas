canonical_text:
  quote: ''
  summary: The passage describes ritual treatment of antelope game after a hunt among
    the Sia. The ho'naaite of the cougar society visits returned hunters, embraces
    them, prays in thanksgiving, uses a cougar fetich with the antelope meat, and
    addresses the cougar as the sender of game that may be offered as payment to the
    cloud people for rain. Antelope remains are arranged with skins, beads, blanket,
    sacred meal, corn pollen, sacred breath, and cigarette smoke. Later the game is
    distributed among society leaders, cooked in ceremonial chambers, accompanied
    by ha'chamoni and night supplications to the cloud people, and deposited at directional
    cougar shrines, to the sun father, and in fields as requests or payment for watering
    the earth and crop growth.
  language: English
  quote_policy: summarized
