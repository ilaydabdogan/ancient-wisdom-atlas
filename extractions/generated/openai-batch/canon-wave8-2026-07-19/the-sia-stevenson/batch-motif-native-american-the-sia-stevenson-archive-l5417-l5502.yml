  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Antelope meat and bones from the hunter's sack are placed on a sheepskin or
    bear skin in the houses described.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: The ho'naaite touches a small cougar fetich to antelope meat many times and
    prays to the cougar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer thanks the cougar for sending his children over the land so that
    the Sia can secure them as payment to the cloud people for watering the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In one house the antelope skull and antlers are placed at one end of the arranged
