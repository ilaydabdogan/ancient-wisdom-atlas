    beads over the skull.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A white embroidered Tusayan blanket is spread over the carcass, and a small
    bowl of sacred meal is placed in front of the head.
  category: object
  evidence_refs:
