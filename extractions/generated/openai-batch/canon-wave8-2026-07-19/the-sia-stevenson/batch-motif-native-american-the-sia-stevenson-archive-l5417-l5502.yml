- id: obs:8
  text: The ho'naaite clasps his hands four times over the antelope skull, draws a
    breath, blows the first whiff of a cigarette over the antelope, and extends the
    cigarette toward it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ho'naaite repeats the prayer in the houses of four successful hunters
    and also embraces two other returned men with thanksgiving for their safe return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The war chief visits the houses, sprinkles the antelope with corn pollen,
    draws a sacred breath from the game, and offers the first cigarette whiff toward
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When game is shot, the hunter dips his fetich into the blood and tells it
