canonical_text:
  quote: ''
  summary: The passage describes hunters tracking migrating deer, intercepting them
    at water crossings with canoes, driving and spearing them, then processing carcasses
    into skins, dried meat, fat, marrow, trade goods, food stores, and tanning materials.
    It also describes a seasonal May deer crossing near Fort Chimo and the excitement
    of the camp when the herds arrive.
  language: English
  quote_policy: summarized
