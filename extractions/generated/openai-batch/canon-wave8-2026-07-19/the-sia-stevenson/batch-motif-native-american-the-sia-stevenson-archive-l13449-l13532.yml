- id: obs:2
  text: Deer enter the water, swim with the current in a compact body, and their antlers
    are compared visually to tree branches floating with the current.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hunters use canoes, row quietly below and behind the herd, and drive the deer
    toward the shore where the camp is located.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hunters spear deer in the water; wounded animals may reach shore, die in bushes,
