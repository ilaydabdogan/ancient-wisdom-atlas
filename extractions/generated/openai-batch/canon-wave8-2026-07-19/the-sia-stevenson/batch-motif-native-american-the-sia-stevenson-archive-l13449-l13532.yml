  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Carcasses are stripped of skins and fat, viscera are removed, and skins are
    piled, dried, or reserved for tanning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Meat is stripped from bones, dried over smoke and hot air from a fire, bundled,
