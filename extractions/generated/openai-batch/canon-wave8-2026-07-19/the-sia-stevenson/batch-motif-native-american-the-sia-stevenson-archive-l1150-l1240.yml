canonical_text:
  quote: ''
  summary: A flood rises around the mesas; the creator figure orders the sun to test
    possible sky roads and establishes the daily east-to-west course. The sun and
    moon are described as masked. The people, ritual specialists, animals, and star
    people ascend through a huge reed toward the upper world, while locust and badger
    make an opening through the earth and large animals test it.
  language: English
  quote_policy: summarized
