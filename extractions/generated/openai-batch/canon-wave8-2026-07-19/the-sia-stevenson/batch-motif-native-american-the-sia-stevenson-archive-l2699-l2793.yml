canonical_text:
  quote: ''
  summary: Po'shaiyanne meets a chief in Chihuahua, marries the chief's daughter,
    is killed by jealous men, returns alive, and survives a second attempt to drown
    him when an eagle feather rises with him. The Sia revere him as a culture hero
    and expect his return. The passage then describes the founding of the present
    Sia pueblo with a stone heart, burial rites and an after-death road to the north
    for a ti'amoni, carved stone animals at a ruined village, and commentary on Sia
    religious practice, speech ethics, clan origins, comparison with Zuni beliefs,
    and personified kinship among beings and objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Po'shaiyanne enters the plaza in Chihuahua, meets the great chief, is invited
    to the chief's home, and becomes acquainted with the chief's daughter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Po'shaiyanne asks to marry the chief's daughter; the chief states that mutual
    desire is sufficient, and the daughter answers affirmatively when questioned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief announces the marriage through an official, many people assemble,
    and a feast is held in the chief's house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men who are pleased with the chief's daughter envy Po'shaiyanne, discuss killing
    him, carry him away to their camp, and pierce his heart with a spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The day after his death, Po'shaiyanne returns alive to his wife's home; those
    who tried to destroy him become angry and alarmed and capture him again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: His captors bind gold and silver to his feet and cast him into a lake so that
    his body will not rise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A white fluffy eagle feather falls to Po'shaiyanne; when he touches it, the
    feather rises with him, and he lives again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says that Po'shaiyanne still lives, will come to the Sia at some
    time, is held in greatest reverence, is regarded as their culture hero, and is
    appealed to in daily prayers.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: After Po'shaiyanne's departure from Sia, the ti'amoni decides to leave his
    village, moves the people, and has a square of stone laid as the heart of the
    present Sia pueblo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the ti'amoni's death, he is buried reclining in the ground with raw cotton,
    an eagle plume, corn pollen, cotton at the soles of his feet and over the heart,
    food in the grave, objects planted over the road to the north, and food on the
    road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: All night people sing and pray in the house of the departed ti'amoni, and
    in the morning the singers are bathed in cold-water yucca suds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the ruined village said to have been visited by Po'shaiyanne, there are
    two rudely carved stone animals; the Sia call them cougar but say that they are
    actually lynx, while the cougar remained at the white-house in the north.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage characterizes Sia religion as supplication for favors, payment
    for them, and doing the will of the prayed-to beings, and says children are taught
    to speak with one tongue as straight as a line of prayer.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that the Sia did not derive clan names from animal ancestors
    and did not believe their people evolved from animals other than the Sia themselves;
    it also states that the Zuni hold a similar belief.
  category: other
  evidence_refs:
  - ev:10
- id: obs:15
  text: The authorial commentary says mythological heroes were frequently offspring
    of a mortal and the sun or another revered object, and that animate beings, inanimate
    objects, and elements are endowed with personality and treated as kin.
  category: other
  evidence_refs:
  - ev:11
