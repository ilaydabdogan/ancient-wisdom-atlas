canonical_text:
  quote: ''
  summary: The passage describes a difficult Sia childbirth attended by a doctress,
    relatives, and a ho'naaite. Ritual objects and actions include an ear of corn
    passed along the body, meal sprinkled in prayer, heating remedies with coals,
    medicated water, repeated blowing, abdominal pressure, fetiches placed with the
    woman, and a moccasin rubbed downward to hasten the placenta. The child is born
    after prolonged labor and is taken by the doctress.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The doctress manipulates the abdomen, blows on an ear of corn, and passes
    it down the middle of the woman's body four times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The laboring woman stands over coals treated successively with cobwebs, beam
    scrapings, and fat from a castrated sheep; the passage says these remedies fail
    and that two of them are claimed by the Sia to be very old.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman sometimes assists herself with a short circular stick wrapped with
    cotton.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father holds the ear of corn, prays, runs it from the crown of the woman's
    head down her body, and holds it while she sprinkles meal on it and prays for
    safe passage through parturition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A ho'naaite adds medicine to a small bowl of water, has the woman drink it,
    blows on her head and down the front center of her body four times, presses her
    abdomen, says a short prayer, and leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fetiches of Quer'ranna and of the cougar are placed under the woman's pillow,
    and a third fetich is placed in her right hand.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: After eating and drinking gruel, the woman kneels beside the pallet and the
    child is born before her knees reach the floor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The writer is called to rub the father's moccasin down the woman's back with
    the toe downward to hasten the placenta, which then follows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A sheepskin is placed under the child, and the child is taken by the doctress
