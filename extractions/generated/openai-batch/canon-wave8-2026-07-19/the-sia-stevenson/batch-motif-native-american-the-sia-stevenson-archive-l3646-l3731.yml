canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Snake Society ceremonial: offerings
    of ha''chamoni, shell mixture, and plume offerings are given and deposited at
    shrines with prayers for cloud-rulers to water the earth. At the altar, participants
    draw sacred breath from a sand-painted cougar and ritual objects for purification.
    Sand is collected and rubbed on children. Plume wands are later planted in the
    four directions for Sus''sistinnako. The passage then reports an initiation account
    in which illness and dreams of many snakes lead a person to seek membership in
    the Snake Society; after two years learning songs and passing degrees, the person
    is initiated into the third degree at the house of snakes. Snake ceremonials are
    said to be for third-degree initiation and to occur after the ripening of corn.'
  language: English
  quote_policy: summarized
