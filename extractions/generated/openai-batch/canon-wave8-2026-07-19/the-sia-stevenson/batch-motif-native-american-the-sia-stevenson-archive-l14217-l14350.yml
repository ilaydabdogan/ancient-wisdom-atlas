canonical_text:
  quote: ''
  summary: The passage describes clothing, ornamentation, travel bags, load-supporting
    headbands, and the preparation of deer skins for clothing. It includes details
    on women’s gowns and leggings, children’s and infants’ clothing, tobacco bags,
    portage straps, and scraping hides with a deer-bone tool.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women wear a winter sleeveless gown reaching a little below the knees and
    up to the chin, with separate sleeves made like leggings, usually of red or black
    cloth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gown is decorated with red ocher, painted designs, deerskin borders, beads,
    strings of ornaments, and colored tassels.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women’s leggings extend higher than men’s, cover the tops of moccasins, and
    include free crescent-shaped flaps or “wings” edged and decorated with beads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Moccasins are described as alike for both sexes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For additional cold protection, shoulders may be covered with a mantle of
    soft young-deer skins or with purchased blankets over the shoulders or waist.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children are clothed like adults, while infants commonly wear garments in
    a combination form with a close-fitting separate cap.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When traveling, men and women smoke or snuff; tobacco and other necessary
    articles are carried in a cloth bag called a fire bag, trimmed with beads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Headbands or portage straps are made for men by wives and sweethearts; a sealskin
    example is said to be procured from the Eskimo and used to support loads carried
    on the back.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The headband passes over the forehead and attaches to the load; birch bark
    may be placed under the strap where it touches the forehead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Deer skins intended for buckskin or parchment are set aside in a heap until
    decomposition loosens the hair for removal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A woman scrapes the pelt over a round stick with a spoke-shave-like tool made
    from the radius bone of a deer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The flesh side of the pelt is worked to remove flesh, blood, and moisture;
    skins must be attended to before excessive decomposition or putrefaction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dried skins are moistened before scraping, and fur-bearing or clothing skins
    must be scraped to prevent fat from soiling the hair.
  category: sequence
  evidence_refs:
  - ev:6
