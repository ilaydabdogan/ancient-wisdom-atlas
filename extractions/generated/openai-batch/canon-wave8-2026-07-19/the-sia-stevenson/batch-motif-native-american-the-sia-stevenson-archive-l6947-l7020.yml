  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the first days after birth, the infant is bathed by the doctress, then
    by the grandmother, and on the tenth morning by the mother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the sixth day the remnant of the umbilical cord is removed and a finely
    powdered bluish-gray pigment is rubbed on the umbilicus under a cotton cloth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: If suppuration appears, the mother applies a few drops of breast milk to the
