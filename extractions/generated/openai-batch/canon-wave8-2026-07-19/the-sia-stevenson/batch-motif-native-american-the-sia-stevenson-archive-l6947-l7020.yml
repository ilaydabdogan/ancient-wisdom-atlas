  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The infant is strapped to a cradle, placed on the mother's lap, and nursed
    by the mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The grandfather brings an Apache basket containing a pyramid of meal and holds
