canonical_text:
  quote: ''
  summary: 'The passage describes Sia childbirth and newborn rites: an infant is named
    by a doctress, washed with yucca suds and water, rubbed with ashes, given warm
    water, placed in a cradle, and nursed. Grandparents and the doctress bless a basket
    of meal, which becomes the doctress''s compensation. The passage also describes
    postnatal bathing practices, care of the umbilical cord with bluish-gray pigment
    and sometimes breast milk, the mother''s gradual recovery after childbirth, and
    family care for mother and child.'
  language: English
  quote_policy: summarized
