canonical_text:
  quote: ''
  summary: 'The passage describes postbirth rites: severing the umbilical cord, treatment
    and river disposal of the placenta and sand-bed materials, bathing and wrapping
    the infant, prayer and meal rites, cradling with ritual objects, cotton cords
    tied to identify the child with Sus''slstinnako, an obsidian-strengthening rite,
    and the infant''s first sacred medicine given by the grandfather.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sister-in-law brought the placenta four times to her face while expressing
    a wish that the umbilical cord might be severed without danger to the child; the
    mother removed her belt and dress and lay down on a prepared bed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband sharpened a knife and handed it to the doctress, who placed the
    child on the sand-bed, tied the umbilical cord, cut it, and removed the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister-in-law placed the placenta on a sheepskin, added raw cotton, folded
    it into a bowl, and carried it out with a boy who carried the sand-bed materials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sand and placenta were cast into the river, and the woman addressed the
    placenta with a wish that future childbirths promptly follow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doctress bathed the infant with warm water, yucca suds, and water thrown
    from her mouth, rubbed the child by hand, wrapped it in a blanket, and patted
    it dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Relatives admired the infant during the bathing; the remaining umbilical cord
    was drawn through raw cotton, cotton was wrapped around it, and ashes were rubbed
    over the child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The infant is described as a boy of about eight or nine pounds, with black
    silky hair, a red mark on the forehead, and unusual alertness according to the
    narrator.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The grandfather brought the cradle, the child was received by the writer during
    a prayer and meal rite, and the grandfather declared the child a gift to the writer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The grandfather arranged the cradle with blankets and cotton cloths, the infant
    was placed nude on the cradle bed, covered, strapped to the cradle, and set to
    the mother's left on a white sheepskin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: An ear of corn that had been important before the birth was placed at the
    right side of the child.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The grandfather sat at the foot of the cradle, placed three medicine bags
    before him, held eagle plumes, and prayed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two cotton cords prepared by the father were later tied around the infant's
    ankles to indicate that the infant was a child of Sus'slstinnako and might know
    this father.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The grandfather touched the cradle and child's body four times with an obsidian
    spear point for strength, and passed the spear point over the mother's limbs and
    body for the same purpose.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The grandfather gave the infant its first food by transferring sacred medicinal
    pollen from his mouth to the infant's mouth, and also placed some in the mother's
    mouth for the quality of her milk and the child's heart and mind.
  category: action
  evidence_refs:
  - ev:10
