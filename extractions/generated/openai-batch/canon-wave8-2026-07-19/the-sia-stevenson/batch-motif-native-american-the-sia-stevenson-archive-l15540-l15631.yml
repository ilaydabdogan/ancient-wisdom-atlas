  summary: 'The passage describes practical transport technologies: carrying and repairing
    birch-bark canoes during travel, the importance of the canoe for subsistence,
    paddle forms and repair methods using gum, bark, and fire, and the construction
    and use of large snow sleds or toboggans.'
