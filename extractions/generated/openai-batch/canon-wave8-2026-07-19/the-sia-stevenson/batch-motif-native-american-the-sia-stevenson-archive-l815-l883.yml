canonical_text:
  quote: ''
  summary: The passage introduces a Sia cosmogony in which a spider creator is alone
    in the lower world, draws crossed meal lines, places two precious unknown parcels,
    and sings. The parcels shake like rattles and produce two first women, after which
    people, animals, birds, and animate beings appear. The creator names the two women
    as mothers of different peoples, divides people into clans, and creates cloud,
    lightning, thunder, and rainbow peoples to bring rain for the earth. These weather
    peoples are divided among six directions, living in springs within great mountains
    topped by giant trees, and are given the middle plain of a three-part world.
  language: English
  quote_policy: summarized
