canonical_text:
  quote: ''
  summary: Ct'set instructs the people to make and plant hii'chamoni so messages may
    go to their mother below, then assigns six Sia women to the cardinal and vertical
    directions to intercede with cloud rulers. The Sia take the straight road and
    settle in a white stone village, where the tiamoni first causes children to be
    killed and later oversees a quarrel and separation between men and women across
    a great river. After years apart the men return. Children born during the separation
    are unlike the Sia, are driven out, mature into skoyo or giant cannibals, and
    attack the Sia with the help of angry animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ct'set says that when the people wish for anything they should make and plant
    hii'chamoni, which will bear their messages to their mother in the world below.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before leaving this world, Ct'set selects six Sia women and sends one each
    to the north, west, south, east, zenith, and nadir.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The six selected women are to live near the cloud rulers and intercede for
    the people in times of need.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sia alone follow Ct'set's command and take the straight road, while other
    pueblos travel by various routes to the center of the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sia build a village of beautiful white stone and remain there for four
    years or a long duration.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the white house, the tiamoni objects to the increase of his people and
    for a time causes children to be put to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men and women quarrel over work, desire, and how long they could remain apart
    from one another.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After three days of quarreling, on the fourth day the women go to one side
    of the pueblo and the men and boys gather on the other side, each group entering
    a separate chi-ta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tiamoni has all men and male children no longer nourished by their mothers
    cross the great river, while the women remain in the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The women are compelled to send male infants over the river as soon as the
    infants cease being nourished by their mothers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: During the separation, men hunt and have much game, while women lack animal
    food; the men become stout and the women become thin.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the fourth year is half gone, the women ask the tiamoni for the men to
    return; the men recross the river and the women recover their flesh in four days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Children born to women during the separation are unlike the Sia, are driven
    from their homes, and mature quickly into skoyo or giant cannibals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The skoyo roast children and parents in fires and eat them; angry animals
    also join the skoyo in attacks on the Sia.
  category: action
  evidence_refs:
  - ev:10
