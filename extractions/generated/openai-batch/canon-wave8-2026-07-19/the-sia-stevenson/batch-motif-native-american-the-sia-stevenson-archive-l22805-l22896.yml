canonical_text:
  quote: ''
  summary: The passage reports Teton beliefs about Missouri River and lake water monsters
    called Miniwatu or related names, including fatal effects of seeing them, composite
    buffalo and serpent traits, and their role in river ice breakup. It then describes
    the Wakinyan, thunder-beings whose voices are thunder and whose missiles are lightning,
    their four external varieties, plant creation, mountain dwelling with four directional
    animal sentinels, cloud residence, weapons, and conflict with giant rattlesnakes
    and prehistoric water monsters. A final narrative describes thunderers battling
    a lake monster, leaving fish and huge serpents on the shore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water monsters are said to push water toward lowlands, draw people into their
    mouths, and make people prefer encampments on or near bluffs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night a red object shining like fire was seen in the Missouri River, making
    the water roar as it passed upstream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seeing the monster by daylight is said to make a person crazy, cause writhing
    or bewilderment, close the eyes, and lead to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: One reported description gives the monster red hair all over, one eye, a horn
    in the middle of the forehead, a buffalo-like body, and a flat notched backbone
    like a saw or cog wheel.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Teton are said to think the Miniwatu is still in the river and causes
    the river ice to break up in spring.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bones of the Uŋktegila or related water-monster being are said to be found
    in the bluffs of Nebraska and Dakota.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Wakinyan are named as flying ones; thunder is identified as their voices,
    and lightning as their missile.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Four external varieties of thunder-being are described: black with a long
    beak, yellow without a beak, scarlet with eight wing joints, and blue globular
    without eyes or ears but with lightning lines and down-like wing plumes.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The thunderers are said to have created wild rice and a prairie grass with
    rice-like seed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the western extremity of a circular earth surrounded by water stands a
    high mountain with a mound and the Wakinyan gods' dwelling, which opens toward
    the four quarters.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: A butterfly, bear, reindeer or deer, and beaver stand as sentinels at the
    east, west, north, and south entrances, and each sentinel is covered except the
    head in scarlet down.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Some ancient cloud-dwelling beings are said to open their eyes when they make
    lightning and to be armed with arrows, mysterious irons, and coal-like stone missiles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The thunder-beings are said to kill mysterious beings and humans, and their
    ancient foes are identified as giant rattlesnakes and prehistoric water monsters.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: At a deep lake, a huge eye bright as the sun was seen in the roaring water;
    looking at it caused vomiting of black earth-like wet matter and death.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Thunderers came to the lake with terrible crashing sounds; the next morning
    the shore was covered with fish, some larger than men, and huge serpents.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The lake water monster fought by the thunderers is described as resembling
    a rattlesnake, with short legs and rusty-yellow fur.
  category: attribute
  evidence_refs:
  - ev:12
