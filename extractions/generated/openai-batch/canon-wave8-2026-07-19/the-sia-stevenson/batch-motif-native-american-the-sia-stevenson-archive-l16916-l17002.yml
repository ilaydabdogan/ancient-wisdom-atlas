canonical_text:
  quote: ''
  summary: The passage contains the end of an otter-and-wolf household tale, a tale
    headed as a devil punishing a lying bear mother, and the beginning of a wolverine
    stratagem tale. In the first, an otter husband and wolf wife have animal offspring,
    obtain deer and skins, and the otter later leaves under the lake ice after being
    mocked. In the second, a mother bear hides the arrival of summer from her cubs;
    the cubs discover the deception from green leaves in her mouth, escape, and the
    devil kills her with a stone. In the third, a hungry wolverine tries to approach
    a bear by falsely calling her sister.
  language: English
  quote_policy: summarized
