canonical_text:
  quote: ''
  summary: The passage describes dog-sled construction, runner repair, dog harnesses,
    traces, bridles, loading practices, rough-ice travel management, and the construction
    and use of dog whips. It includes a brief comparison between rare local bone-shod
    runners and a practice attributed to Eskimo groups farther north and west.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bone-shod sled runners are described as uncommon in the observer's experience,
    with one observed example using bone and reindeer horn fastened by pegs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mud on sled runners may loosen with warmth, while rough ice or sand can damage
    the polished running surface.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Runner damage is repaired by applying water to the runner and rubbing it evenly
    until a thin ice coating is formed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dog harnesses consist of two nooses, connecting straps, and sealskin traces
    whose lengths vary according to each dog's position in the team.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The traces attach to a stronger thong called the bridle, which uses an ivory
    toggle and additional thong to hold the trace ends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rear end of the bridle is attached to the sled runners by yoke loops placed
    over toggles.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Loads are arranged so they do not project much over the side and are distributed
    to avoid excessive weight at the front or rear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'On very rough ice, several people may be needed: two to attend the sled,
    one to free traces, and one to lead or drive the dogs.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The driver is described as always armed with a whip, and whips vary according
    to their makers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The whip includes a handle, wrist loop, inserted lash, and a complex plaited
    lash that can be very long and heavy.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Some native whip users are described as highly dexterous, and children practice
    with the whip as soon as they can manage it.
  category: action
  evidence_refs:
  - ev:8
