canonical_text:
  quote: ''
  summary: After returning from the eagle house, the two brothers soon travel again
    despite their mother's warning. A sko'yo woman lures them into her pack and carries
    them toward her home. Ma'asewe tricks her into going through wooded mountains,
    where the boys escape by hanging from a tree, but she finds them and takes them
    home. She builds a fire in a small conical house, pushes the boys inside to cook
    them, and closes the doorway. The boys protect themselves from the heat with shells
    from their mouths, hide, and leave excrement where the woman expects cooked flesh.
    She eats it, believing it to be their flesh, until the boys reveal the deception
    and she vomits.
  language: English
  quote_policy: summarized
