  quote: ''
  summary: 'The passage describes subsistence occupations: coordinated deer drives
    through a defile, rapid loading and use of muzzle-loading shotguns, snaring and
    snowbank hunting, gathering and hunting of smaller animals, fishing, food preparation,
    preservation of meat, use of bones in tanning, and consumption of eggs, embryos,
    and unborn reindeer.'
