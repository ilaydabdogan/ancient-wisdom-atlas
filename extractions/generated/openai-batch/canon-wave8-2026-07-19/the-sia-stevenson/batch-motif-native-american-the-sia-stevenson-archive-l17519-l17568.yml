canonical_text:
  quote: ''
  summary: Two Indian men, unsuccessful in winter hunting and short of food, leave
    to seek their friends' camp. After one dreams of porcupines, porcupines appear
    at their tent and they kill and eat some. Later an arrow shot in sport reveals
    a bear den; they kill and skin the bear but leave most of it, taking only fat.
    At the next camp, cooking the fat over a fire reveals it to be good, so they return
    for the carcass, but wolves and foxes have eaten the meat. They blame each other
    and continue, becoming thirsty at a creek.
  language: English
  quote_policy: summarized
