literal_observations:
- id: obs:1
  text: The annual routine is organized from the spring breakup of the Koksoak River
    ice, whose timing varies with bay ice, winds, and weather upriver.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Families gather their belongings and move them by sled to the edge of remaining
    ice, storing tents, dogs, umiak, kaiak, and personal property on shore until outside
    ice is free.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men hunt land game, waterfowl, and seals, then move alongshore by umiak and
    kaiak as weather, floating ice, and food supply allow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children search islets and coves for edible items and collect eggs
    from accessible bird nests during the seabird nesting season.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the white-whale season, natives are summoned to a whaling station, encamp
    there, drive whales into a net enclosure, spear them, drag them ashore, skin them,
    and help transport oil and skins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After whaling, some of the same natives attend salmon nets, then go upriver
    to spear reindeer crossing the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When ice begins forming and snow falls, the head of a family chooses winter
    quarters; the group moves there, may build a sled, constructs a snow house, sets
    traps, and hunts ptarmigan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Furs are sold to the company in exchange for provisions, clothing, and ammunition,
    and Eskimo dog teams are hired to haul company wood to the riverbank.
  category: relationship
  evidence_refs:
  - ev:6
