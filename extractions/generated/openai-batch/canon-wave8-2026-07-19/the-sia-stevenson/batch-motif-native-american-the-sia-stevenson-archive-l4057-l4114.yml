canonical_text:
  quote: ''
  summary: 'A Sia rain ceremonial is described in a ceremonial chamber: food is offered
    and prayer is made to Ko''pishtaia so that cloud people will water the earth;
    participants smoke, eat, arrange themselves by an altar and meal line, sing with
    rattles, use eagle plumes and feathered wands, sprinkle ashes toward directions,
    and a dancer again calls on the cloud people.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker in the ceremonial chamber prayed before the altar on the south side
    of a meal line, saying food had been offered and asking Ko'pishtaia to exhort
    the cloud people to come and water the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male members smoked cigarettes; a bowl of stew and a basket of bread were
    placed in the center of the room, and the group ate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The vicar drew a fresh line of meal from the altar to a door on the south
    side near the west end, and the members formed in line behind the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman sat on the north side near the altar, and the little girl sat opposite
    her on the south side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ho'naaite, the ti'amoni, the vicar, and the other men wore specified cotton
    garments and held eagle plumes and gourd rattles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman and little girl wore ordinary dresses and each held turkey wands
    tipped with lemon-dyed fluffy eagle plumes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The vicar gave meal from a pottery meal bowl to the ho'naaite, who sprinkled
    the altar without rising.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The song began with rattle accompaniment; the rattle was transferred to the
    right hand, eagle plumes were held in the left, and each stanza ended with a short
    rapid rattle shake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator notes the absence of the pottery drum in Sia cult society ceremonials
    and contrasts this with Zuni and Tusayan usage.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men from the ends of the line moved to the fireplace, lifted ashes with plumes,
    and deposited or sprinkled ashes before the altar and around the meal line.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The ash sprinkling included directions named as north, south, west, zenith,
    and nadir, and the passage says the sprinkling of the cardinal points was repeated
    four times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The second man from the north end danced while others sang with rattles, and
    he called on the cloud people to come and water the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The woman and child waved their wands to the rhythm; the woman held a sick
    infant much of the time, was awakened by the vicar with eagle plumes, and the
    sleeping infant was laid on a sheepskin.
  category: action
  evidence_refs:
  - ev:7
