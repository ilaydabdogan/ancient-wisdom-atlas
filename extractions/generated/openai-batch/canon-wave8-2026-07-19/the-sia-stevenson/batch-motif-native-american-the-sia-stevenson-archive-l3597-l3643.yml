canonical_text:
  quote: "“invoking the cloud people to gather”"
  summary: A ritual sequence in the Snake Society rain ceremonial describes dancers
    facing directions, sprinkling an altar and cardinal points with medicine water,
    placing plume offerings, administering medicine water to participants, drawing
    sacred breath from ritual objects, and concluding with a litany involving the
    ho'naaite and two young men near the altar and snake fetish.
  language: English
  quote_policy: quoted
