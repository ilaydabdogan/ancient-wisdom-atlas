canonical_text:
  quote: ''
  summary: 'A section on taboos reports that Iowa informants told Mr. Hamilton that
    members of any gens could not eat the flesh of their eponymic animal. It then
    records taboos obtained from a Missouri informant: members of a Black Bear gens
    among Oto and Missouri groups cannot touch a clam shell, and Momi people, a subgens
    of the Missouri Bird gens, avoid small birds killed by large birds and the feathers
    of those small birds.'
