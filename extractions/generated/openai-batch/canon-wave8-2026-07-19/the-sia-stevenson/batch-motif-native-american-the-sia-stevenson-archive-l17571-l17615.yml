canonical_text:
  quote: ''
  summary: The excerpt first closes a preceding tale in which an unidentified group
    drinks until their lips freeze to an icy water hole and they die. It then begins
    the tale of a starving wolverene who, after failing to store food before winter,
    leaves his wife and children to seek food from wolves he calls his brothers. He
    meets wolves on an ice-covered river, is directed to a camp sign, watches elder
    and young wolves prepare a tent, and wonders how they will obtain a tent covering
    and make fire. The passage ends as a young wolf leader prepares brush for a fire
    and takes up a kettle.
  language: English
  quote_policy: summarized
