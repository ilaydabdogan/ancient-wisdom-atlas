canonical_text:
  quote: ''
  summary: 'The passage describes a Knife Society ceremonial sequence: food is offered
    to Ko''plshtaia beings associated with directions and realms; prayers request
    health, prosperity, crops, and water from cloud people; the ho''naaite prays before
    the altar for protection and thanksgiving; participants feast; the war chief receives
    medicine water and an official staff before patrolling; boys clear the bowls and
    sweep the floor; the vice-ho''naaite renews the meal line so songs may pass straight
    out of the house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Food is offered to Ko''plshtaia beings named with directional or realm associations:
    Cougar of the North, Bear of the West, Badger of the South, Wolf of the East,
    Eagle of the Heavens, and Shrew of the Earth.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer says that when the beings eat they will be contented and will pass
    over the straight road, explained as the line of meal leading to images of themselves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer asks for food, good health, prosperity, animal health, large crops,
    and for the cloud people to water the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After returning to the ceremonial chamber, the ho'naaite stands before the
    altar and prays to Ma'asewe, CyuuyewC, and the six warriors of the mountains of
    the cardinal points for protection from enemies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ho'naaite offers thanksgiving at the end of the food line while holding
    eagle plumes in his left hand, then sits west of the meal line and smokes.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Food is brought in by the wives of members, and those present, including minor
    members, join the feast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The war chief enters wrapped in a Navajo blanket and carrying his bow and
    arrows, stands before the altar on the west side of the meal line, and prays.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The vice-ho'naaite gives the war chief a draft of medicine water and the society's
    official staff, which the war chief holds with his bow and arrows until the ceremonial
    closes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The war chief leaves to patrol the town and prevent anyone not privileged
    from entering or approaching the ceremonial chamber.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the meal, three boys remove the bowls, and one boy sweeps the middle
    of the floor, destroying most of the meal line while leaving about two feet before
    the altar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The vice-ho'naaite renews the meal line using meal from a bowl while carrying
    two eagle feathers; the stated purpose is for the songs to pass straight over
    the line and out of the house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The men smoke, while the writer notes that Sia boys were not observed smoking
    in these ceremonials or at any other time.
  category: action
  evidence_refs:
  - ev:8
