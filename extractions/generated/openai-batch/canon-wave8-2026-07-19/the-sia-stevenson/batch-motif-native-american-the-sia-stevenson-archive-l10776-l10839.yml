canonical_text:
  quote: ''
  summary: The passage describes waterproof hand coverings and outer garments made
    from seal materials. Black sealskin mittens are described as worn by men, not
    women. Men engaged in late fall seal hunting use long waterproof gauntlets reaching
    over the forearm to protect their hands from spray, paddle drip, and immersion
    in cold water. A waterproof hooded frock is made from seal intestines, preferably
    from bearded seals, with preparation involving washing, scraping, inflating, drying,
    rolling, splitting, trimming, and sewing strips into body, hood, and sleeves.
