canonical_text:
  quote: ''
  summary: Two brothers, Ma'asewe and U'yuuyewfi, make arrows, seek plumes despite
    their mother's warnings, kill a dangerous bear, and later confront giant eagles
    in a high rock. They use deer intestines to survive being dropped on a sharp ledge,
    kill the young eagles and both eagle parents, and are helped down by a ground
    squirrel who plants a piñon nut that quickly grows into a tall tree-road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys report that they have killed a cougar; Ma'asewe confirms their statement,
    and their mother embraces them with pride and joy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys make arrow shafts and Ma'asewe asks their mother where eagle plumes
    can be found for the shafts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Their mother says plumes are found at a western canyon brink where there is
    a very bad man; U'yuuyewfi also mentions bears there, but Ma'asewe persuades him
    to go.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: At the canyon house, Ma'asewe draws out the bear, U'yuuyewfi shoots it through
    the heart, and Ma'asewe removes and cuts up the bear's heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brothers collect feathers, flay the bear, keep the lower leg skins with
    claws, stuff the body with grass, and drag it home, where their mother is frightened
    until told the bear is dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Their mother warns them that to the south, in a high rock, live very large
    eagle parents with two children, and that the parents eat all little ones they
    find.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The brothers kill a deer, cleanse its intestines, and wrap the intestines
    around their necks, arms, breast, shoulders, and waists before approaching the
    eagle house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The eagle parents carry the brothers up and drop them on a sharp stone ledge;
    the deer intestines break, blood falls, and the eagles believe the brothers are
    dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the eagle parents leave, the brothers question the young eagles about
    the parents' return, kill the young eagles, and then shoot both returning eagle
    parents through the heart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the eagle family is killed, Ma'asewe says the road down to earth and
    the road to the rock above are both very long.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ma'asewe asks a ground squirrel for help getting down and offers beautiful
    eagle plumes as payment.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The ground squirrel plants a piñon nut, and because the squirrel knows medicine,
    a tall tree grows almost immediately and becomes a road that the squirrel and
    the boys use.
  category: action
  evidence_refs:
  - ev:12
