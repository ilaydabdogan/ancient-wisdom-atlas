canonical_text:
  quote: ''
  summary: A brother or outside man attacks a mud-walled lodge, kills two children
    and their mother, who asks her husband to preserve the skin of her right hand
    and arm. The husband returns with the brother to their people, receives the beaver-wife’s
    right hand and arm, and later is forced to eat female beaver flesh. A river gushes
    from his side, he jumps into it, and witnesses see him swimming beside his wife,
    who had been a beaver.
  language: English
  quote_policy: summarized
