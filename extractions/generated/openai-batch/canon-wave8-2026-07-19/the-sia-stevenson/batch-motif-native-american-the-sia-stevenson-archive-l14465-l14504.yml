canonical_text:
  quote: ''
  summary: The passage describes a process for smoking deerskins with smoldering rotten
    wood, the resulting coloration and seasoning of the skins, the effect of insect
    scars on the smoked surface, uses of lower-quality skins, and tools used to paint
    buckskin garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Portions of a skin are suspended from a pole, with the head and neck portions
    left free or open, and cloth sewn to the edges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rotten wood is placed in a pan or vessel and made to smolder without blazing,
    producing pale blue pungent smoke that rises into the cavity of the deerskin bag.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cloth functions as a conduit for smoke, and the skin is kept from being
    too near the fire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the smoking process, the skins are inspected between the stitches and
    taken down when the operation has progressed sufficiently.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After sufficient smoke exposure, the surface of the skin becomes a clear brown
    color, with the shade depending on the duration of exposure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the cloth is removed, the skins are folded with the smoked side inside
    and stored for several days to season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the smoked skin is left exposed to air, the coloring matter disappears
    and the color becomes only slightly different from its pre-smoking color.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Scars made by insect larvae do not take the smoke as well as healthy portions
    and produce a pitted or scaly appearance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Skins with many scars are used for tents, inferior moccasins, and the tops
    of better footwear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Paints for decorating buckskin garments are applied with specially shaped
    bits of bone or horn.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two-, three-, and four-tined antler tools are used to make complicated patterns
    of parallel lines, while the simple form is sometimes made of wood.
  category: object
  evidence_refs:
  - ev:7
