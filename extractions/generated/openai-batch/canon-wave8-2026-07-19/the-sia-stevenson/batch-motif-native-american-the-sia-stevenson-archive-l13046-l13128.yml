  summary: The passage compares Indian and Eskimo endurance, travel skills, relations,
    family behavior, illness, attitudes toward death, and healing practices. It describes
    shamanic drum-beating and mumbling as remedies, with the shaman claiming control
    of a spirit that causes disease and death, alongside belief in medicines supplied
    by a white trader.
