canonical_text:
  quote: ''
  summary: A wolverene stays with wolves who make fire by jumping over brush, test
    him with deer fat, feed and shelter him, then send him home with a large sledload
    of meat and a conditional fire-making aid. The wolverene successfully imitates
    the fire-making method for a time, discards his flint and steel, later fails to
    make fire by jumping, retrieves the tools, inspects the sled despite the warning
    not to look back, and finds he cannot move it, so he carries only part of the
    meat toward his hungry family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wolverene rests, watches for returning hunters, sees a tent, and is sent
    by the wolves to gather dry brush while they gather green branches for the tent
    floor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After brush is placed down, the wolf leader jumps over it and a bright, crackling
    fire starts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wolves place deer fat around the inside edges of the tent and leave the
    wolverene alone to see what he will do with it.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The wolverene selects a large piece of fat and begins swallowing it; when
    questioned by the wolves, he can barely answer because his mouth is full.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolves cook meat and give the wolverene fatty portions; after eating frozen
    fat and hot food, he vomits, becomes weak, chilly, and unable to sleep.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A wolf places his bushy tail on the wolverene as a covering; the wolverene
    rejects it and is given a soft skin blanket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wolverene says he must return to his family because they may die from
    hunger, and the wolves prepare a very large sledload of meat for him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the wolverene asks for fire, the wolf leader asks how many nights the
    journey will take, tells him to lie in the snow, jumps over his body three times,
    and warns him not to look back at the sled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After leaving the wolves, the wolverene arranges dry brush as he saw the wolves
    do, jumps over it, and produces a large blaze; he later makes fire this way again
    at another camp.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Feeling confident in his new fire-making ability, the wolverene throws away
    his flint and steel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the wolverene later jumps repeatedly over a large heap of twigs and branches,
    no blaze or spark appears, and he becomes exhausted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wolverene retrieves his discarded flint and steel and uses them to start
    a fire near daylight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The wolverene examines the sled, cannot see the far end of the load, finds
    he cannot move it, blames his curiosity, and reduces the load to dry meat and
    fat he can carry.
  category: sequence
  evidence_refs:
  - ev:8
