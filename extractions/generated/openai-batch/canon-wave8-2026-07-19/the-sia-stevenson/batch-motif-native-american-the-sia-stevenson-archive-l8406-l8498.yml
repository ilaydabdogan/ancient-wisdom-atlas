canonical_text:
  quote: ''
  summary: An ethnographic sketch describes Inuit/Eskimo groups along the Labrador,
    Hudson Strait, and Ungava Bay coasts, explains several self- and place-based group
    names, contrasts groups glossed as people of sun/light and people of shade/shadow,
    and describes a winter-spring sledge caravan that carries furs to Fort Chimo for
    barter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that northern coastal portions of the region are inhabited
    by people designated as Eskimo, who call themselves Innuit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inhabited region is described as strictly littoral, and the Innuit distribution
    is organized into three subtribal distinctions.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first subdivision is located on the Labrador coast proper and along the
    south side of Hudson Strait to the mouth of Leaf River.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name Sft hi' nl myut is glossed as derived from a word for the sun plus
    a people/dwelling suffix, yielding the sense of people of the sun or sunny side
    because the sun reaches them first.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sft hi' nl myut are described as confined at the time to the seashore
    and adjacent islands, where they go for seals and other food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several small communities are said to bear names compounded from the name
    of their home and myut, meaning the people of that place.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The inhabitants of Cape Chidley are named from a word glossed as wounded,
    cut, incised, lacerated, or serrated, explained by the rough rocks and mountains
    of the place.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second subdivision occupies the area from the mouth of Leaf River northward
    along the south side of Hudson Strait, with a western and southern limit around
    latitude 60 degrees.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The second subdivision is called Ta hdg myut, a term glossed as derived from
    a word for shadow and interpreted as people of the shade or shadow, contrasted
    with the people of light or sunshine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Ta hdg myut region is described as rugged, with mountain spars, ranges,
    deep valleys, and ravines through which travel to trading stations occurs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Certain persons who have made the trip and know the trail are selected from
    camps to carry furs and barter them for specified goods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sledges gather along the coast into an arctic caravan, then travel south toward
    Leaf River and Fort Chimo.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The visitors are expected at the trading post in late April or early May,
    usually stay only long enough to barter, and return before melting snow increases
    the labor of travel.
  category: sequence
  evidence_refs:
  - ev:6
