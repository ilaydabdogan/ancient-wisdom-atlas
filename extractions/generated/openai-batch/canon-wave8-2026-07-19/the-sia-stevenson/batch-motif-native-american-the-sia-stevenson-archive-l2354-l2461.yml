  summary: Po'shaiyanne appears in the chita with valuable bracelets on successive
    mornings. The ti'amoni offers houses and their contents in exchange for the bracelets,
    then plays games with Po'shaiyanne. Po'shaiyanne wins the games and thereby gains
    the houses.
