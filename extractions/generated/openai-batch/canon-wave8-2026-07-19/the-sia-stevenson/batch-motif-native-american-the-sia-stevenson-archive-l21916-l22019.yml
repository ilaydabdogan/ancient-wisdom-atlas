canonical_text:
  quote: ''
  summary: The passage reports Omaha and Ponka statements about spirits after death,
    including good and bad ghosts, a four-night road and Milky Way account, forked
    roads in the spirit land, grave fires and offerings, special beliefs about suicides,
    murderers, wounded dead, lightning victims, and deathbed addresses among buffalo
    gentes. It also records disagreements among named informants and brief authorial
    comparison notes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each person is said to have a wanaxe or spirit that does not perish at death;
    good persons go to good ghosts and bad persons to bad ghosts, with no stated dwelling
    with Wakanda or demons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One reported view says retribution is in this life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tradition is reported in which a man came back to life and described the
    spirit land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In that report, a ghost travels a very dark road for four nights after death,
    then reaches the Milky Way where there is light; people are said to aid the deceased
    by keeping fires at graves for four nights.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After traveling along the Milky Way, the ghost reaches a forked road where
    an aged man in a buffalo robe silently points out the requested road; one short
    road leads to the good ghosts and another endless road is traveled by crying ghosts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: One account says spirits of suicides can travel neither road and hover over
    their graves; another statement says a suicide ceases to exist and has no hereafter.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: Some believe the spirit immediately starts toward the spirit land, while others
    believe it hovers near the grave; food and water are placed at the head of the
    grave for several days and are not to be touched by others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says a ghost may punish a person who takes grave food by paralyzing
    the mouth, twisting the face, pursuing the offender, or causing food to lose taste
    and hunger to persist.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spirits of persons who died of wounds or their results are said to float to
    a cliff near the Missouri, make rock pictures showing their manner and place of
    death, and then fly to the hereafter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some Ponka statements say ghosts surround a murderer and whistle, the murderer
    cannot satisfy hunger, and the murderer should not roam at large lest high winds
    arise.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A person struck by lightning is said in one account to be buried where he
    fell with no mound; an Omaha account adds burial face down and slitting the soles
    of the feet so the spirit goes to the spirit land without troubling the living.
  category: action
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: Named informants rejected or qualified parts of the Milky Way and endless-road
    account, saying they had not been to the spirit land, no one had returned to tell
    them, and they had only heard the old story about the forked road.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A dying member of a buffalo gens is addressed as going to the animals or buffalos,
    to ancestors, and to the four living ones or possibly the four winds, and is told
    to be strong.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: One chief was understood to speak of four spirits or souls to each person,
    while Joseph La Fleche and Two Crows said the Omaha believed a person had only
    one spirit.
  category: attribute
  evidence_refs:
  - ev:10
