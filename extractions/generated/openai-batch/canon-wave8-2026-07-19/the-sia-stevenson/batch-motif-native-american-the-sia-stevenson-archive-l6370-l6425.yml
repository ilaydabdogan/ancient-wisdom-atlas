  quote: White floating clouds. Clouds like the plains come and water the earth.
  summary: A rain song invokes clouds, the Sun, Moon, directional and vertical animal
    powers, war heroes, ritual vessels, a meal road, named mother/father figures,
    and colored women of the directions, asking for intercession with the cloud people
    so that the earth will be watered and fruitful.
  language: English with transliterated Sia/Keresan terms
