canonical_text:
  quote: ''
  summary: The passage describes charms and ritual actions used by specialists for
    wallaby hunting, communal fishing, banana cultivation, rain control, and paiha
    war magic. It also identifies named Waima paiha chiefs and their associated ceremonial
    houses or marea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wallaby hunting medicine is described as consisting of leaves, barks of different
    trees, and white stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a month before a wallaby hunt, the expert avoids intercourse with his
    wife, makes a new perineal bandage, and adds grass or leaves from the thatch of
    the marea to the medicine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wallaby expert burns off grass, scatters the medicine on the bare area,
    calls a wallaby name, and summons wallabies of all sizes, sexes, and ages to come
    to that place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After wallaby tracks and young grass appear, the expert scatters more medicine,
    including wallaby and turtle heads, and buries a wallaby skull and a white wallaby
    stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the hunt begins, the wallaby expert sleeps or pretends to sleep in
    the cleared area while covered in native cloth; hunters rouse him and ask where
    the wallaby are, after which he eats areca nut and smokes, and many wallaby are
    hunted and killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before larger communal fishings, food is presented to the fish expert; he
    and his relatives eat it, and the refuse is put into the creek where fishing will
    occur.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fish expert and his relatives eat little after the food present until
    the expert gives the word and invites everyone to participate in proceedings he
    directs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Banana experts receive food when gardens are made and receive some young banana
    suckers when those suckers are planted out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage explains that giving banana suckers to the banana expert is considered
    good policy because his own bananas will share the favorable conditions he secures.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: If the rain expert is lazy and remains in his house wrapped in a blanket,
    rain is likely to come; by getting up and walking about the village he can stop
    rain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The rain expert has charm stones suspended over vessels full of water; the
    stones are lowered to touch the water when rain is required and raised again when
    enough rain has fallen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bats are said to frequent the rain expert's house and to move to his new house
    if he builds one.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Paiha chiefs have their own clubhouses, but in their paiha functions they
    are described as departmental experts whose business is to ensure success in war
    by magical powers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Waima is said to possess two named paiha chiefs, each with a paiha marea,
    while two other original itsubu are said to have lacked paiha experts and paiha
    marea.
  category: relationship
  evidence_refs:
  - ev:7
