canonical_text:
  quote: ''
  summary: The passage describes rules and actions surrounding cannibal feasts among
    Wagawaga-related clans, including maiha taken as payment for a death, restrictions
    by clan-group and kinship, handling and display of skulls, seclusion and abstentions
    by the killer or captor because of feared blood-related influence, ornaments made
    from human remains, and different rules for victims killed and eaten outside the
    revenge-payment context. A footnote gives comparative ethnographic notes for Wedau
    and Wamira.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During preparation of a corpse for a cannibal feast, successful warriors danced
    to drum beats and conch blowing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skulls from previous feasts were brought from the potuma, decorated with croton
    leaves, mounted on a paddle handle or long stick through the foramen magnum, and
    held above dancers' heads.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the burning, the victim's captor made a return present to the next of
    kin of the man for whom maiha was taken.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Participation in eating maiha followed clan-group restrictions: the feast
    was limited to the dead man''s clan-group, and intermarrying or outside clans
    were excluded.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Paternal relatives of the dead man for whom maiha was exacted should not take
    part in the cannibal feast, while the mother and maternal relatives would eat
    the son's maiha.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: No one would eat a man of his own killing or a prisoner he had taken.
  category: action
  evidence_refs:
  - ev:5
