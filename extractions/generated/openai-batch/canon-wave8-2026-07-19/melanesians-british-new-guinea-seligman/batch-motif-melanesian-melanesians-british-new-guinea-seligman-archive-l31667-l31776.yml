candidate_motifs:
- id: motif:1
  label: Revenge-payment body as restricted feast
  taxonomy_refs:
  - sacred_exchange
  basis: Maiha is described as taken for a dead clansman, eaten only by the appropriate
    clan-group, accompanied by a return present to next of kin, and governed by kinship
    exclusions.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage is ethnographic and does not explicitly call the transaction
    sacred; the taxonomy reference is a cautious fit based on payment and return-gift
    structure.
- id: motif:2
  label: Killer's pollution-like abstention and seclusion
  taxonomy_refs: []
  basis: The killer or captor avoids eating his own victim, stays secluded for about
    a month, follows food and sexual-sleeping restrictions, and fears death from blood-related
    influence.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage states that the influence was not expressed by the word for
    ghost; broader pollution interpretation should be reviewed.
- id: motif:3
  label: Display and wearing of human remains after killing
  taxonomy_refs: []
  basis: Skulls from previous feasts are decorated and held above dancers, while jawbone
    armlets and vertebrae hair ornaments are worn by specified relatives.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: The symbolic meaning of these remains is not explained in the passage.
- id: motif:4
  label: Cannibal feast bounded by place and house taboo
  taxonomy_refs: []
  basis: Entry to each clan's cannibal gahana was restricted, and human flesh could
    not be taken into a house; excluded participants ate on or around the potuma.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The passage describes spatial rules but does not provide a mythic explanation
    for them.
comparison_claims:
- id: claim:1
  claim: The footnote presents Wedau and Wamira enemy-body eating as comparable in
    function to the main passage's distinction between ordinary enemy eating and revenge-payment
    eating, with stricter clan limitation for revenge-payment cases.
  claim_level: same_function
  target: Wedau and Wamira cannibal feast practices
  evidence_refs:
  - ev:10
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the ethnographic note in the passage;
    details differ by locality and the footnote itself expresses uncertainty about
    clan versus clan-group.
- id: claim:2
  claim: The footnote reports a shared restriction against eating human flesh in ordinary
    houses at Wedau and in the main passage, though exceptions and locations differ.
  claim_level: same_function
  target: House restriction in Wagawaga and Wedau cannibal feasts
  evidence_refs:
  - ev:12
  - ev:14
  counter_evidence_refs:
  - ev:14
  confidence: medium
  limitations: Wedau allowed taking the body to the potuma during heavy rain, so the
    restriction is not identical across contexts.
