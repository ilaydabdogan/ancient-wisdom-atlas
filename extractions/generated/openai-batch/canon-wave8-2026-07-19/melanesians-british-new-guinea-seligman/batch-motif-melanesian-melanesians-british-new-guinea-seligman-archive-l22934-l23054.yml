canonical_text:
  quote: ''
  summary: 'The passage contains the end of a tale in which Faisi Uri and the ogre
    Gwarigwaridona share pig meat, Gwarigwaridona serves water in skulls, Faisi Uri
    escapes after learning of a planned attack, villagers arm themselves with wooden
    shields, and Gwarigwaridona dies when his forehead spears break against a hard
    shield. It then begins the Taupota tale of the Black Cockatoo: a boy follows his
    mother to the garden, greedily eats an entire wild cucumber plant, becomes too
    heavy and pained to be carried home, is left covered up, and is found and carried
    away by the ogre Wavineruatonu, who owns the plant and intends to eat him.'
  language: English
  quote_policy: summarized
