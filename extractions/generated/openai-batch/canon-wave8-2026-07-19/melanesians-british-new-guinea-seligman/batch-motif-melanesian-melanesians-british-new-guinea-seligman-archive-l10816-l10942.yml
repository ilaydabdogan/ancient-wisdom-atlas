canonical_text:
  quote: ''
  summary: The passage describes Kolta beliefs about malicious localized beings, especially
    tadti and tabu, including water- and bush-associated forms, illness attributed
    to them, precautions around Hara Tabu hill and Agure Tabu water hole, and a legend
    in which Hara Tabu appears as a huge carpet snake, is trapped in a hole, and becomes
    a hill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kolta are described as believing in multiple malicious mythical beings,
    including tadti, which inhabit definite areas and may have limited spheres of
    influence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Places inhabited by these beings are said to be discovered when sickness or
    death follows camping, eating, sitting, or urinating there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fits and convulsions called inunu are attributed to the agency of tabu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tabu may exist in fresh-water springs as starfish or crabs, or in the bush
    as snakes; they are said to have no sua and an indefinitely long existence.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:13
- id: obs:5
  text: Urita is described as living in wells and springs as a cephalopod or fish-like,
    snake-like being, and the water of such sources is attributed to its presence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If urita were killed, the well or spring it inhabited would dry up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hara Tabu is said to be immanent in a small hill near Waifana village, and
    local people would not approach it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When white men ascended Hara Tabu hill, nearby Kolari predicted harmful consequences,
    and Ahuia's later fall from a horse was attributed to the anger of the tabu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A club or spear made from a tree growing near Hara Tabu hill is thought to
    inflict an especially severe wound.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Blood from a wallaby killed near Hara Tabu hill must not be left on the ground;
    contaminated dust, dirt, or leaves are gathered and thrown into the river to protect
    later eaters from sickness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explains that if wallaby blood or any portion were left behind,
    the tabu could eat or absorb it and then inflict illness on people eating the
    same wallaby.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Hara Tabu legend, the being originally lived in the Laloki River and
    appeared as a huge carpet snake claiming prawns caught by a man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The snake pursued the man, caught up with him, announced it would accompany
    him everywhere, and entered his house with him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Villagers arranged a barbecue platform over a deep hole so that a single blow
    to a prop would make the platform collapse.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: After eating, the snake was invited onto the platform, dropped into the hole,
    and the men filled the hole with earth and stones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the snake was buried, only a slight earthquake occurred, and in the
    morning the hill called Hara Tabu had arisen where the barbecue had stood.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A man returning from the bush with fever is said to have become temporarily
    unconscious while a tabu took his sua.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: At Agure Tabu water hole, drinkers must pinch a hole in the rolled leaf used
    as a cup so the tabu may fall out; otherwise the tabu may enter the person, causing
    swelling and death.
  category: sequence
  evidence_refs:
  - ev:12
