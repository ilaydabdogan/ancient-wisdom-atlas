canonical_text:
  quote: ''
  summary: 'The passage describes eriam and kimta arrangements at Wedau and Wamira:
    marriage-like restrictions on eriam partners, mutual aid obligations, hereditary
    continuation with possible dissolution, limited rights involving wives, mourning
    by wives, kimta eating arrangements for women, and local variation in whether
    eriam includes marital rights or only exchange of food and presents.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage defines the true eriam relationship as involving a man's access
    to the wife of his eriam and mutual duties and privileges of help and assistance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At Wedau, eriam relationships are said to have limitations like marriage:
    a man cannot have an eriam of his own clan, one whose wife is of his own clan,
    or a partner whose wife is of the same clan as his own wife.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man may be eriam to a man of a younger kimta, but is said more often to
    be eriam to men of his own kimta.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eriam relationship is described as hereditary in ordinary circumstances,
    but descendants may mutually dissolve it, and new non-hereditary eriam relationships
    may be inaugurated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If one eriam partner is in want, the other feeds him, and the needy man's
    wife takes the initiative rather than the man himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a man with one wife is eriam to a man with several wives, his rights extend
    only to the first or one wife and not to the others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A wife mourns for her husband's eriam as for a near relation or as a widow,
    with a note that this mourning is shorter than widow's mourning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Wamira and Wedau, unmarried women eat as one kimta, while married women
    form kimta corresponding to those of their husbands.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Married and unmarried kimta mates eat together ceremonially.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Wamira, eriam is said not to carry marital rights; intercourse with the
    wife of an eriam would be punished as ordinary adultery.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Wamira, a man may be eriam with men of other tribes, but this only implies
    an exchange of food and other presents.
  category: action
  evidence_refs:
  - ev:7
