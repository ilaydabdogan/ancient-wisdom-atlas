  summary: The passage describes battlefield corpse-avoidance by a man who has killed
    an enemy, due to fear that contact with the dead man's blood would cause illness
    or death. It also describes a woman saving a man struck down in battle by throwing
    her inner grass petticoat over his body, with two reported examples involving
    Wedau and Wamira people.
