canonical_text:
  quote: ''
  summary: The passage describes the return journey of Motu lakatoi trading vessels,
    including continued voyage restrictions, ritual bathing and adornment when taboos
    are lifted, watching for returning vessels from Huhunamo hill, wives meeting the
    vessels and receiving sago, exchanges and hospitality at Kaimare, reconstruction
    of the lakatoi, acquisition of sago, and a final homeward food-sharing act near
    Jokea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'On the return journey, the bow-end of the lakatoi depends on wind direction:
    the baditauna end remains bow-end with a northerly wind, while the doritauna end
    becomes bow-end with a southerly wind.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baditauna, doritauna, and their two udiha resume the same status and restrictions
    as on the outward voyage, and the taboo is not lifted until the vessel reaches
    Boera or Borebada.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Boera or Borebada the baditauna and doritauna bathe in the sea, adorn themselves
    with coconut oil, red pigment, hebala leaves, and newest sihi, and the food taboo
    is removed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A final meal of sago and grated coconut is cooked in the keikei; sometimes
    the keikei and kibo are broken and thrown into the sea, though the passage says
    this may not always be done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Men of the Koita tribe keep intermittent watch for returning lakatoi from
    Huhunamo hill and pass the news to Port Moresby villages when vessels are sighted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a returning lakatoi is recognized offshore, the wives of the baditauna
    and doritauna bathe, put on ornaments, and go out in canoes with wives and relatives
    of the crew to meet it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each woman receives a kokohara of sago from her husband, takes it back to
    the village, divides it among her relations-in-law, and reserves a portion to
    cook for her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Kaimare, men come aboard the lakatoi, embrace the visitors, and receive
    toia, ornaments, and pots from the baditauna and doritauna through two Kaimare
    notables.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two Kaimare notables go ashore and kill a pig or dog, which is eaten on
    the lakatoi by the Motu party and shared with Kaimare men when given by the crew.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The lakatoi is converted into a house by tying a spar between the masts as
    a ridge pole and adding thatch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Asi are obtained through negotiations in which an armshell may be given to
    a Kaimare man; Kaimare men identify and fell trees, float them to the lakatoi,
    and the Motu shape them into asi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kaimare women and girls sing through the night while sitting together, beating
    drums, and the men do not take part in the singing or dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Houses are built for the Motu on piles in the river, the lakatoi is taken
    to pieces, and an enlarged lakatoi is reconstructed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Kaimare people go into the bush to make sago, while the Motu remain waiting
    and obtain sago from Koriki and Vaimuru people in exchange for pots and beads.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the Kaimare return with prepared sago, each Motu takes his share aboard
    by dug-out, and Kaimare women cook food in the village for the Motu to eat ashore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: On the homeward voyage the lakatoi does not anchor, and off Jokea the baditauna
    and doritauna place sago and areca nuts in the mitahuna and call everyone to eat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage states that no sexual intercourse takes place between the Motu
    and women or girls of the Gulf villages they visit.
  category: relationship
  evidence_refs:
  - ev:7
