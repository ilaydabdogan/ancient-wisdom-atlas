  quote: ''
  summary: The passage discusses former warfare, chiefly status and movable wealth,
    trade and manufacturing specializations among Trobriand villages and islands,
    and a footnoted case in which valuables were paid after a shark killed a boy following
    a canoe-owner's spear strike.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that fighting formerly occurred on a large scale in the
    Trobriands, and later adds that prisoners were apparently not taken, with 'no
    quarter' described as the rule.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: The author says neither he nor Mr Bellamy found evidence that Taolu or Enamakala
    held supreme authority over all Kiriwina or the whole Trobriand Group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Taolu is described as a member of the Tabalu family of the Malasi clan, a
    family that provides chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Taolu possesses native jewellery and ceremonial axe blades, much inherited
    from his brother Enamakala; the author states this property is Taolu's own and
    can be sold or given away, rather than being sacred royal emblems.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Trobriand islanders are generally keen traders, but that
    the amount of foreign trade differs among islands and villages.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vakuta is said to breed bold sailors whose canoes travel to the Amphlett,
    Fergusson, and nearby Dawson Straits islands, while Kadawaga people are described
    as less bold sailors; a Koma waga owner planned only coastal use.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Different places are associated with different products, including Vakuta
    shell discs and carving, Luia hand baskets, Boitaru wooden bowls and combs, Oabutuma
    gourd lime bottles, Vilalima bananas, and Koma sugar-cane.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rough adze blades from Suloga were ground in five named Kiriwina villages
    using maia sand brought from the D'Entrecasteaux group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote says accidents could be atoned for by payment of native valuables,
    often accepted as full discharge of responsibility, though vendetta occurred in
    some cases.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the example given, a canoe-owner speared a shark in shallow water; the
    shark struck the canoe, knocked a youth into the water, killed him, and the canoe-owner
    paid the boy's relatives as if he himself had speared the boy.
  category: sequence
  evidence_refs:
  - ev:8
