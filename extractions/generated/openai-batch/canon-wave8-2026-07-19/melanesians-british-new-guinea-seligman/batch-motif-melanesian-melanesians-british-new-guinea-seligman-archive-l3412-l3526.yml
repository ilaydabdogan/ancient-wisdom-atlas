canonical_text:
  quote: ''
  summary: The passage describes a Koita group's movements among Nara, Obo, Poreporena,
    Koke, and Hohodai in response to unsuitable sites, sickness, and epidemic; notes
    transport by lakatoi and settlement-building activities; describes Koita village
    size, pile-built houses, former tree houses used defensively, Koita-Motu co-settlement,
    intermarriage, borrowing of Motu language and activities, inland and coastal village
    layouts, and the four-village Poreporena system.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Koita group migrated under Ova Abau's leadership to Nara, lived inland at
    Sobu Kau', moved to Obo after sickness killed many children, and was carried by
    lakatoi to Poreporena.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Hohodai the group built houses, made gardens, built a dubu, and Dubara
    iduhu held a tabu feast before the section later returned to Koke.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After some years and two tabu feasts at Koke, an epidemic occurred and the
    group returned to Hohodai to build the present settlement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hohodai and Guriu are described as Koita settlements in the Port Moresby village
    system, with house and inhabitant counts given for each.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Koita houses in the Hanuabada village system stand on piles and include a
    shaded verandah reached by ladder, with another shorter ladder leading from the
    verandah to the house door.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tree houses formerly existed in inland villages and were used as refuges and
    fortresses during raids; only one is said to remain at the time of description.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Many Koita villages are built in direct continuity with Motu settlements,
    while some Koita and Motu village sites are distinct but close together.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that intermarriage between Koita and Motu has occurred
    freely and that borrowing of Motu activities has followed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Practically all Koita speak Motu; many Koita women make pots; Koita men may
    join hiri voyages and may captain lakatoi, but few Koita take part in turtle and
    dugong fishing and no Koita is said to possess the large-meshed net used for those
    animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In inland Koita-only villages, houses are arranged in two parallel rows facing
    each other across a central open space.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Where Koita and Motu settle together in coastal villages, Koita houses, like
    Motu houses, are usually built in compact masses near or below high-water mark.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Poreporena is described as the proper collective name for the Port Moresby
    village-system commonly but incorrectly called Hanuabada; it consists of four
    villages grouped into two subdivisions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Between Hanuabada and Tanobada, the houses are described as built on piles
    on the sandy foreshore and mostly below high-water mark.
  category: setting
  evidence_refs:
