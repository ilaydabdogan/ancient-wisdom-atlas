canonical_text:
  quote: ''
  summary: The passage describes a formal peace-making between Wagawaga and Maivara
    involving armed canoes, offshore negotiation, presentation of valuables, reciprocal
    visits and gifts, and restored permission to visit each other's hamlets. It then
    describes warfare distinctions in Bartle Bay and preparations for battle involving
    ingestion of a foul mixture, drinking liquid made with pieces of a named stone,
    and testing spears against a special coconut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Formal peace-making was said to occur during severe inter-community feuds
    when respite was needed, and each side paid for persons it had killed even when
    casualties were equal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: About twenty Maivara canoes came to Wagawaga carrying spears and shields and
    lined up silently across Discovery Bay about 200 yards from shore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Older Wagawaga men went out in a small canoe, discussed whether the result
    should be peace or war, and decided for peace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wagawaga collected valuables including armshells, benam, samakupa, and bagi,
    called Maivara canoes to shore, tied them to stakes in the sand, waded into the
    water, and presented valuables.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Wagawaga also provided young coconuts for the Maivara men before the Maivara
    canoes left the bay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maivara instructed Wagawaga to come to their hamlet-group in three days, where
    the Wagawaga performed a similar ceremony and received corresponding-value gifts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Going ashore from canoes on the first visit would have been considered an
    attack, while after the double ceremony the communities could freely visit each
    other's hamlet-groups.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: An incomplete Tubetube account is said to show a procedure closely resembling
    the Wagawaga peace-making.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bartle Bay warfare is divided into neighbourly warfare and warfare between
    enemies.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In neighbourly warfare, there was no cannibalism, the dead were buried by
    either side, and a man would not knowingly kill a clansman.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In warfare between enemies, the dead could be eaten, women could not save
    wounded persons by throwing a grass petticoat over them, and a man might unknowingly
    kill a clansman.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Before battle, fighters ate a mixture including human urine, pig excrement,
    dog excrement, and scraped coconut to make them fierce.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Pieces of a stone called Warorovuna were chipped off and boiled, and fighting
    men drank the liquid.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Fighting men threw spears at a special coconut called waduwadu; spears that
    hit it were called lucky spears and used in fighting, while those that missed
    were rejected.
  category: action
  evidence_refs:
  - ev:9
