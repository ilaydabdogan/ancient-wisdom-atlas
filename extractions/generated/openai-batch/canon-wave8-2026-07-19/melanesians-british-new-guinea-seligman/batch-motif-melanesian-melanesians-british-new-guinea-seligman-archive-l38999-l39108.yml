candidate_motifs:
- id: motif:1
  label: Courtship by prolonged cohabitation before formal marriage
  taxonomy_refs: []
  basis: Both Trobriand and Marshall Bennet sections describe courtship as more or
    less prolonged cohabitation prior to formal marriage arrangements.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: This is an ethnographic social pattern rather than a mythic narrative
    motif.
- id: motif:2
  label: Marriage alliance through asymmetric gift exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly describes valuable transfers from the bridegroom's
    side to the bride's kin, followed by smaller return gifts of food, pigs, shell
    ornaments, or other property.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: 'The taxonomy reference is provisional: the passage describes customary
    and ceremonial exchange but does not explicitly call the exchange sacred.'
- id: motif:3
  label: Clan exogamy and inter-island marriage alliance
  taxonomy_refs: []
  basis: The Marshall Bennet section states that islanders intermarry between islands
    and that no one marries into their own clan, with a former restriction on marrying
    into the father's clan.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a kinship rule and alliance pattern, not a mythic episode.
- id: motif:4
  label: Bride's postmarital movement to husband's village and garden-making
  taxonomy_refs: []
  basis: The Trobriand section states that a woman comes first to her husband's village
    and that gardens are first made on the husband's land before a garden is started
    on the wife's land.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives social custom only; symbolic meaning of gardens or residence
    is not stated.
- id: motif:5
  label: Kin redistribution of bridewealth
  taxonomy_refs: []
  basis: The passage states that received bride-price may be distributed among the
    bride's parents, siblings, uncles, and aunts, and gives a named example in which
    the bride's mother distributes valuables to her siblings.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: Distribution rules are described pragmatically; no ritual explanation
    is provided.
