  claim_level: same_function
  target: Massim area courtship practice
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supports functional similarity only; it does not establish
    origin, diffusion, or symbolic interpretation.
- id: claim:2
  claim: The Marshall Bennet courtship pattern is explicitly aligned with the usual
    south-eastern district pattern of prolonged cohabitation and proposal from the
    girl or her father.
  claim_level: same_function
  target: South-eastern district courtship practice
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the courtship and proposal pattern reported
    by the ethnographer.
- id: claim:3
  claim: 'The passage reports uneven marital contact between Marshall Bennet islands
    and the Trobriands: Kwaiawata intermarried with Kiriwina, while Gawa did not intermarry
    with the Trobriands to much extent.'
  claim_level: historical_contact
  target: Marshall Bennet and Trobriand/Kiriwina marriage network
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This is contact through reported intermarriage, not evidence for shared
    myths or motifs.
- id: claim:4
  claim: The Trobriand and Marshall Bennet sections share a marriage-gift pattern
    in which the bridegroom's side gives more valuable property and the bride's side
    gives a smaller return present.
  claim_level: same_motif
  target: Regional asymmetric marriage exchange pattern
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: Details vary by island and example; the claim is limited to the exchange
