canonical_text:
  quote: ''
  summary: The passage describes Trobriand and Marshall Bennet courtship and marriage
    practices, including prolonged cohabitation, parental involvement, bridewealth
    and return gifts, postmarital residence, clan and inter-island marriage rules,
    and distribution of marriage valuables among kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Trobriands, courtship is described as more or less prolonged cohabitation,
    with the girl receiving her lover's night visits in her parents' house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trobriand parents suggest marriage when the relationship appears not to be
    merely a temporary intrigue.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a Trobriand marriage, the boy takes the girl to spend a night in his father's
    house, and the bridegroom's father sends a present to the girl's relatives the
    next day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Trobriand return present is usually food, and the valuable shell jewellery
    sent by the boy's people is not repaid in equal kind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Named Trobriand examples list armshells, steel axes, ceremonial axe blades,
    and a sapisapi or karob necklace as marriage valuables.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: In the Makuniga example, the bride's mother received the gift and was said
    to keep the armshells while distributing other valuables to sisters and brothers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Trobriand bride first comes to her husband's village and gardens are first
    made on the husband's land; a garden on the wife's land may be started later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stated Trobriand postmarital residence and garden rule applies to paramount
    chiefs, village chiefs, and commoners.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A married Trobriand man visiting his wife's village stays with his father-in-law,
    and a divorced woman returns to her parents' house, usually with her children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marshall Bennet islanders are said to intermarry freely despite former fighting
    between some islands, but marriage into one's own clan is not allowed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: For the Marshall Bennets, courtship is also described as prolonged cohabitation,
    with the marriage proposal apparently coming from the girl or sometimes her father.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Marshall Bennet marriage exchanges, the boy's father gives a large present
    to the bride's parents, who return uncooked vegetable food, a large pig, and usually
    some shell jewellery.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Marshall Bennet examples emphasize that the girl's parents generally receive
    more value than they give in return.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Marriage valuables may be collected from the bridegroom's relatives, and received
    bride-price may be distributed among the bride's parents, siblings, uncles, and
    aunts.
  category: relationship
  evidence_refs:
  - ev:10
