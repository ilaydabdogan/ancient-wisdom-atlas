canonical_text:
  quote: ''
  summary: The passage introduces an annual Motu trading expedition, the hiri, in
    which large sailing canoes leave Port Moresby and nearby Motu villages near the
    end of the south-east trade wind season, carrying earthenware pots and other goods
    to the Papuan Gulf. After about three months, they return during the north-west
    monsoon with sago obtained by barter. The text notes that the custom is old, that
    Motu and Gulf peoples use a common trading dialect, and that many Koita now participate
    in the expedition.
  language: English
