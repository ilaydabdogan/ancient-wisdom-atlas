canonical_text:
  quote: reciprocal presents of food are made by the two families for years
  summary: The passage describes Koita marriage-night decoration and sleeping arrangements,
    named payments and reciprocal gifts between bride and bridegroom families, transfer
    and possible return of a woman's iduhu affiliation, payments required for widow
    remarriage, preferred but non-levirate remarriage patterns, and polygyny with
    separate houses for wives.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: On the marriage night the bride prepares a sleeping mat for the bridegroom,
    who comes to her publicly before the house is quiet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride is specially decorated with dressed hair, scarlet hibiscus blossoms,
    coconut oil, many earrings, red facial paint, reddened armlets with scented leaves,
    oiled genitals and thighs, and a new petticoat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bridegroom wears cassowary feathers, a frontlet of three rows of tautau,
    white cockatoo feathers, dried village-pig tails in his ears, red and yellow facial
    streaks, and reddened armlets.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: At dawn husband and wife go to the husband's house, usually his father's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Before leaving, the boy leaves two toia or doa, called gabuato, on the sleeping
    mat; these are kept by the girl's parents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband's mother, sisters, and yaiya later bring a damuy to the bride's
    parents' house, and this is divided among the iduhu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each female relative of the bride takes a hodu pot full of water to the house
    of a bridegroom's relative, later takes food there, cooks it, and the householder
    and family eat it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two days after marriage the bridegroom's relatives send a betube present to
    the bride's parents, consisting of ornaments and nets or spears or a dog or pig
    with vegetable food, and it is divided among the bride's local group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The next day the bride's parents make a return betube of equal value and,
    as far as possible, similar objects to the bridegroom's parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For about the first fortnight, bride and bridegroom sleep in the bride's father's
    house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Food presents continue reciprocally between the two families for an indefinitely
    long period and cease only if one party omits its part of the exchange.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a woman marries she takes her husband's iduhu; as a widow she may stay
    in it or return to her relatives and resume her maiden iduhu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a widow with children returns to her old iduhu, she takes only children
    who have not attained puberty; the children keep their father's iduhu and later
    return to build on the site of their father's house.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A widow's second husband must pay the usual damu to her maiden iduhu, and
    the relatives of her first husband can demand laraha payment.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage states that no levirate exists and that marriage with a deceased
    husband's brother does not occur.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: Marriage of a widow with a son of a brother or sister of her deceased husband's
    father is considered especially suitable though not compulsory.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Polygyny is said to be not uncommon; each wife usually has her own house on
    her husband's village site, and these houses are said to descend to her children.
  category: relationship
  evidence_refs:
  - ev:11
