  quote: ''
  summary: The passage describes grounds and procedures for divorce, including neglect
    of garden work or cooking, barrenness, chronic disease, infidelity, laziness,
    and departure to the relevant hamlet. It notes violence associated with marital
    conflict and adultery, and states that divorce has no special ceremony.
  language: English
