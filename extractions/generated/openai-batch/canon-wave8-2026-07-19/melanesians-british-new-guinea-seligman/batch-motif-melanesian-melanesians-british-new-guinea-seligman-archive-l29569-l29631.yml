literal_observations:
- id: obs:1
  text: A man may divorce a woman for prolonged neglect of her garden or continual
    carelessness or unpunctuality in cooking his food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says such neglect or carelessness may be used by a woman who likes
    or has an intrigue with another man and wants to be rid of her husband.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before separation, many husbands are said to try one or more severe beatings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may also get rid of his wife if she is barren or has a chronic disease
    severe enough to incapacitate her.
  category: action
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: When a man separates from his wife, he generally returns to his own hamlet-group
    with his personal property, while the woman remains in the house if it is in her
    hamlet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man might divorce his wife for infidelity; public opinion is described as
    condoning the slaying of an unfaithful wife in some cases, and the husband of
    an adulterous wife is said to have an admitted right to kill her lover.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A woman may divorce her husband for confirmed laziness in garden work or for
    infidelity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a woman is living in her husband's hamlet, she may take her children, petticoats,
    and cooking pot and go to her mother's hamlet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In this situation, the man has no right to bring his wife back by force or
    to take vengeance on the people of her hamlet.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the couple lives in the woman's hamlet and she wants to be rid of her husband,
    she tells him to go, and the passage says he would leave without difficulty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: There is no special form or ceremony of divorce; separation is enacted by
    sending the wife back to relatives or by leaving the house, depending on residence.
  category: action
  evidence_refs:
  - ev:6
