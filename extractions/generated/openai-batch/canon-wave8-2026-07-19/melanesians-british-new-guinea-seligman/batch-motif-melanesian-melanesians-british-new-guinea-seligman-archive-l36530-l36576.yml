canonical_text:
  quote: ''
  summary: The passage describes beliefs about the aru, a man's spirit or soul, its
    journey after death to Maraiya and to Wamira spirit-world villages, the signaling
    of death by an object falling from a tree, the route up the Uruam river into the
    mountains, questioning by an older dead man, and conditions in the other world.
    It also notes that aru can mean shadow or reflection, and gives beliefs about
    sneezing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man's spirit or soul is called aru; after death it goes to Maraiya in the
    southeast, where Tauurnariri, the Lord of the dead, prepares and assigns a place
    for each person.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Wamira people, spirits in the spirit world know of a death when
    something called obu falls from a tree, and one spirit remains on watch for the
    newcomer from the upper world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The arriving spirit passes up the Uruam, described as the further river, into
    the mountains, and the passage says that the soul knows its way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An older dead man sits with his back to the newcomer and asks why he has come;
    the newcomer answers by naming a witch or sorcerer who has sent him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After further conversation, the newcomer is taken to a village where he lives
    henceforth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The spirits' skins are white; there is plenty to eat; sickness and evil do
    not assail them; and earthly wealth status is said to continue in the other world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each community has its own place in the other world, and spirits can go out
    fighting as they did in life.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Anyone killed in otherworld fighting is destroyed forever, and the passage
    says all could die again, which would be the end.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dead know their own friends, and life in the other world is described
    as generally repeating life here.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man's shadow or reflection in water or a mirror is also called aru; sneezing
    may occur with anger and is otherwise considered a sign of approaching illness.
  category: other
  evidence_refs:
  - ev:8
