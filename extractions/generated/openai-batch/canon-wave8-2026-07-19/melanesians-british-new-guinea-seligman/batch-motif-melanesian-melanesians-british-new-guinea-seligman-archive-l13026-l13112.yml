canonical_text:
  quote: ''
  summary: 'The passage describes the construction and inauguration of a new marea
    clubhouse: chiefs and age groups divide labor, areca nut is sent to summon helpers
    and guests, posts and roof are raised, carvings are concealed until the opening,
    food and feast animals are prepared, dances occur through the night, chiefs speak
    from the platform, carvings are uncovered, and pigs are apportioned the next morning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A new marea has an inauguration ceremony before it is used for ceremonial
    purposes, although men may gossip and sleep there before the ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Construction labor is divided: chiefs and old men carve posts and make rope,
    while younger men dig holes and perform rougher work.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ovia itsipana takes the lead in matters concerning the marea and sends
    areca-nut bunches to neighboring chiefs as notice that their clans' help is needed.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The owning local group and outside helpers carry carved heavy posts and set
    up the piles, while the owning group provides food for the visitors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the first day, posts, piles, and rafters are raised; pig and dog meat is
    distributed that evening; men and women dance; women gather leaves and men fasten
    them to the marea posts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After initial work, the owning itsubu continues construction, later summoning
    chiefs again by areca nut to help put on the roof.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The front platform is built shortly before the official opening, and the carvings
    on posts and rafters are concealed by coconut-leaf mats or dry banana leaves until
    the opening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the opening, men fish and smoke the catch, and they erect bamboo poles
    hung with food and palm-leaf streamers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chiefs invite friendly villages with areca nut; each visiting chief is expected
    to bring banana bunches and receives food from the inaugurating itsubu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women collect wood for fires, men prepare feather gear, pigs are caught for
    the feast, visitors are received informally, and a small local dance precedes
    the main dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the main night dance, coconut-leaf curtains are drawn aside, local
    chiefs speak from the platform, carvings are uncovered, and the dance may become
    an endurance contest between rival villages or clans.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The following morning, pigs supplied by the local group are placed on coconut
    leaves in front of the marea and apportioned by local chiefs.
  category: action
  evidence_refs:
  - ev:8
