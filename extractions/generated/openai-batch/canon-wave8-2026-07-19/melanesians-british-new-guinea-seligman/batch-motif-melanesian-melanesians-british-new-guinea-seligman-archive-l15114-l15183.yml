canonical_text:
  quote: ''
  summary: 'The passage describes aruaru initiation practices: male initiates remain
    secluded in or near the marea, leave only at night under coverings, perform named
    dances over a monsoon cycle, and complete initiation when one member has sexual
    connection with a girl who later becomes his wife. After release they receive
    a changed status name, make gardens for marea chiefs, and wear or use named basket-work
    head ornaments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The initiates stay in the bush and approach the village only at dusk, when
    they slip into the marea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief asks the initiates whether they are weary of seclusion, and the aruaru
    give no answer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The initiates understand that ending the seclusion rests with them, and the
    seclusion ends when one of their number has had connection.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:4
  text: When initiates leave the marea at night, they are wrapped so that they are
    unrecognizable or completely covered.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: The initiates move in couples at night and look for girls willing to receive
    them, whom they usually marry later.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Initiation is considered complete when seclusion ends; the initiates are previously
    called miori and afterwards called buiapu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Waima, every male formerly had to go through the aruaru ceremonial, usually
    before marriage, beginning about the south-east monsoon and lasting about a year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the initiation period four ceremonial dances are held; initiates perform
    special dances with special decorations while older men dance ordinary dances
    at some distance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The named dances are bite, oare, aunapaka, and vakivaki, each associated with
    a stage of the monsoon season and particular decorations or coverings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Soon after release from the marea, the initiates make gardens called iciama
    for the chiefs of the marea in which they had been secluded.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A circular basket-work object called lopo is worn on the head with hair passed
    through the opening, plastered flat, and marked with lime and perhaps red ochre.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A half-moon-shaped basket called kokoai is worn vertically on the head while
    walking and as part of full dress at one ceremonial dance.
  category: object
  evidence_refs:
  - ev:9
