canonical_text:
  quote: ''
  summary: The passage describes ufuapie chiefs and dancers entering a mourning village,
    receiving food gifts, dancing despite ritual remonstrance, preparing and distributing
    feast foods, presenting offerings at a central kou structure, and ceremonially
    ending mourning abstinences, including a widower's return to smoking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chiefs of the ufuapie leave their ufu chewing areca nut and make a loud
    clicking noise by rubbing lime spatulae against lime gourds; the sound warns people
    to keep the track clear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs repeatedly stop after a few steps, pretend to be too tired to continue,
    receive food presents, and are urged to continue toward the mourning village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Painted ufuapie men wearing dance ornaments and sometimes great kangakanga
    headdresses hold drums at eye level and enter the village beating them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The family, widow, and near relations of the deceased ask the performers not
    to dance, say the visitors have come to take away the village's cold, and feign
    attacks, including threats with glowing embers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dancers continue despite remonstrances; if mourning pretence lasted too
    long, the dancers might retire and require fresh presents for their services.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dancing continues all night, and each performer is later given a boiled sago
    ball called ketsiketsi, which the dancer must share with kinsfolk who lent feathers
    and ornaments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the great headdress dancers rest, men with smaller headdresses dance
    until the feast-giving chief asks them to rest and offers areca nut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women and girls cook vegetable food, and pigs are killed during the feast
    preparations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A central village structure called kou is made from planted bamboos whose
    short branch stubs form hooks for hanging food, fish, and meat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Late in the evening the clicking of lime spatulae and gourds sounds again,
    the crowd becomes quiet, and ornamented ufuapie chiefs approach the kou and stand
    motionless.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The feast-giving chief places a pig limb, pig fat, and other presents at the
    visiting chiefs' feet and speaks of the village becoming warm after their arrival.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: The ufuapie spokesman replies that the food and game are poor but reminds
    the hosts that the ufuapie previously gave twenty pigs and should later receive
    as many back.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the speeches, the period of mourning is ceremonially ended, and abstainers
    arrange themselves in a semi-circle holding foods or items from which they abstained.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: For a widower, the ufuapie chief lights a pipe, swings it around the widower's
    head, declares the mourning over, and the widower smokes again.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
