canonical_text:
  quote: ''
  summary: Ethnographic passage on clans, clan-groups, totems, address terms, exogamy,
    and related traditions at Wagawaga, Tubetube, and Gelaria. It describes Wagawaga's
    named clans and linked animal and plant totems; a decayed dual clan-group system
    governing address, marriage, and former cannibal revenge feasts; comparative remarks
    on Tubetube and phratries; and a Gelaria legend in which a great snake born on
    a double-peaked mountain creates humans, beasts, earth, and separates and names
    mankind into clans. The provided passage ends mid-legend.
  language: English
