  summary: The passage reports Seligman's inquiry into gumasi/gumagi, first thought
    to be island inhabitants but later identified as commercial agents. Bromilow's
    note describes reciprocal agency arrangements among Dobu, Bwalo, southern communities,
    the Amphletts, and the Trobriands for obtaining bagi and moari shell valuables,
    with Gaganumore named as a principal gumagi.
