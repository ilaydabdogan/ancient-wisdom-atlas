  summary: The passage describes Koita morality as communal rather than individual,
    with informal authority among chiefs and elders, moral judgment of homicide and
    theft based on effects on the community, children's conformity to tradition without
    initiation ceremonies, and limited transformation despite long contact with European
    government, missionaries, traders, and other outsiders.
