canonical_text:
  quote: ''
  summary: The passage classifies several kinds of marea or clubhouses, including
    ordinary chiefly marea, battle marea, and special houses for initiation or warfare
    magic. It discusses the meanings and possible Mekeo derivations of some marea
    names. It describes the marea as a male clubhouse tied to chiefly offices, clan
    badges, hereditary carved boards, ceremonial feasts, evening gatherings, stranger
    reception, war-chief taboos, and funerary exposure with mourning restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes ordinary marea of the ovia itsipana and ovia awarina
    from battle or spear marea held by certain ovia awarina as war chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Special marea are described as buildings that only a few clans have the right
    to build, though all male community members use them ceremonially on appropriate
    occasions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The special classes named are artiani marea, formerly used for initiation
    ceremonies, and paiha marea, concerned with warfare in its magical aspect.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Several marea names are glossed: Burebure is linked with being ungovernable
    or derelict, Airava with hornbill, Haurama with black snake, Rabi with night,
    and Rabau or Ravau with Yule Island.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that names of some Waima marea appear to derive from Mekeo
    clubhouse names, including Maivauku from Maipa ufu and Oaibua from Oafua.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Socially, a marea is described as a clubhouse whose members are all men of
    the local group by birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The titles ovia itsipana, chief of the right, and ovia awarina, chief of the
    left, refer to positions taken on the marea verandah during important ceremonies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Clan badges are carved on marea posts, and boards carved with hereditary patterns
    belonging to the ovia itsipana are hung inside.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ceremonial feasts are held on the marea platform, and men gather there in
    the evening to chew areca nut and discuss village affairs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ibitoe sleep within the closed inner chamber of the marea of the ovia
    awarina until marriage and sometimes after marriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Strangers are received in the marea of the ovia itsipana and usually sleep
    and are fed there; official visitors are expected by etiquette to sleep there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the old days, a stranger who first entered a village and stepped on the
    platform of a war-chief marea was killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dead men are exposed on the marea platform and mourned there by relatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Members of a family in which a death has occurred are forbidden to enter the
    marea until after one of the ceremonial mourning feasts.
  category: action
  evidence_refs:
  - ev:7
