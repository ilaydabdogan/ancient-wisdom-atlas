canonical_text:
  quote: ''
  summary: The passage describes labuni sorcery, in which a disease-producing gidana
    object is sent into a victim, sometimes by a woman’s labuni. It describes animal
    transformation, fear at night, dogs as detectors, payment and placation of the
    sender, the healing process called gweri, divination to identify the sender, retaliatory
    use of labuni, a related Maisin farum note, and a similar male-associated agency
    called baravu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A gidana may be a sliver or fragment of bone, stone, or coral; human bone
    or a man’s tooth is described as specially potent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The labuni is said to throw the gidana at the victim from a distance; the
    spiritual part enters the body, while the material form may later be removed by
    a medicine man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person with a gidana inside aches all over, and labuni-caused sickness is
    often, though not always, fatal; people fear going out at night because of labuni.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: If anyone sees a labuni, it turns into a snake, wallaby, or bandicoot, wanders
    in that form until it can find the gidana, and then resumes human form.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Labuni rarely enter houses and may be frightened away by the howling of dogs,
    which are said to see them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Failure to find game while hunting may be attributed to a labuni having crossed
    the track.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman may be bribed to send her labuni against someone for whom she has
    no personal grudge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A sick person who believes a gidana is inside him seeks to identify the woman
    responsible by guesswork or divination, beseeches her, and gives substantial presents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The gidana is said to be removable only by the process called gweri; the woman
    associated with the labuni is paid so that she will not send it again after the
    cure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gweri consists of massaging the body until an imagined lump under the skin
    is sucked out through closed hands; the extracted gidana is shown to the sick
    person, then crushed or broken and thrown away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the gidana cannot be extracted, it is believed to have dissolved in the
    body, and death follows.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sender of a labuni does not herself perform gweri; without her consent
    to let the victim recover, the healer’s work is said to be ineffective because
    the labuni may be sent again.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Some women are described as being supported by people who believe they have
    suffered from their malice and wish to avoid their ill-will.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage reports no known physical punishment of a woman who sent a labuni
    and gives an example of a man seeking poison for a woman said to have bewitched
    his pig.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: One cited case says that a woman who thought her child had been killed by
    a neighbour’s labuni used her own labuni to kill the neighbour’s child.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Divination to discover the responsible woman is described by placing a stone
    in a bundle of grass, swinging it around the head, and reading the direction in
    which the stone flies as the direction from which the labuni came.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Adepts at gweri may teach the process to others, but the number of practitioners
    in a locality is said to be small.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:18
  text: Old men are said to have within them an agency called baravu, which they can
    expel at will; it is essentially similar to labuni, visible to men who know gweri
    but not to ordinary people, and less frequently used.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:19
  text: A note says that among the Maisin a related noxious emanation is called farum,
    and in a Maisin story the farum is a limbless old woman who becomes a mosquito
    at night and sucks a victim’s blood until killed by the victim’s sister’s son.
  category: sequence
  evidence_refs:
  - ev:14
