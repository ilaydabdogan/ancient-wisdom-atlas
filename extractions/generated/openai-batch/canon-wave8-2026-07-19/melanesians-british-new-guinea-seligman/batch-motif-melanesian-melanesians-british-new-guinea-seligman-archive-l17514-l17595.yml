canonical_text:
  quote: ''
  summary: The passage gives an ethnographic history of Inawi and Inawae village formation
    through migration, fission, incorporation of fugitives, factional movement, and
    war. It then describes a Roro-origin family at Inawae descended from children
    of a chief taken after conflict, and explains a broader Mekeo practice in which
    child prisoners, unusually taken in war, were adopted into captor villages and
    could later remain, marry, or return to their original people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waiaka men and their families are described as among the first to leave loiovina,
    said to be the original home of the Biofa tribe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Paiapaia split from loiovina and settled on the present site of Inawi while
    the Waiaka settlement was then farther downstream.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Families of the Okope clan came down the river as war-driven fugitives, were
    received by Waiaka, moved upstream with them, and built houses contiguous with
    the Paiapaia settlement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ongofoina and Ngangai families later joined the growing settlement after being
    unable to agree with the majority of their own villagers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage identifies Ipange as an immigrant stock from the Biaru river region
    and reports Father Egidi's account that Ungo belongs to an emigrant stock; the
    exact timing of their joining is uncertain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The recent settlement by Inawefia is attributed to constant harassing wars
    waged by Waima against Afai.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Inawae village is described as containing three local groups, with Inawae
    Ipiau the dominant pangua, and as having formed through successive divisions of
    an original Inawae pangua.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some Ikoiko families, identified as Vee, settled at Inawae, preserve some
    autonomy there, and are said probably to have moved because of faction fights
    in their own village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A single Roro-origin family at Inawae is said to descend from one of the children
    of the chief of a former Roro coastal settlement, whose young children were carried
    off as prisoners of war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: As a general rule, Mekeo tribes are said not to have made prisoners of war;
    when exceptions occurred, the captives were young children adopted into the captor's
    village.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Aiai, a boy carried off from Waima and adopted into the Waiaka pangua of Inawi,
    was considered a brother of Opungu Ongopaina because he had been adopted by Opungu's
    uncle.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Young girls are said to have been carried off and adopted even more commonly
    than boys.
  category: other
  evidence_refs:
  - ev:4
- id: obs:13
  text: A group of Roro natives formed a settlement on the Ariopa creek between Babiko
    and Waima and controlled the coastal plain in a way that prevented free intercourse
    between coastal and inland villages.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: Coastal people decided to attack the Roro settlement; the Roro appealed for
    help to Inawi and Inawae, into which Roro had at that time freely married.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The Roro, helped by Inawi and Inawae, repulsed their adversaries, but a dispute
    over the distribution of loot led the Mekeo men to attack and defeat the Roro.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After defeating the Roro, the Mekeo men killed everyone except the chief's
    children, carried those children off, brought them up at Inawae, and temporarily
    held the Roro settlement site.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: As the adopted children grew up, the elder ones returned to their father's
    village, one resumed the dignity of chief, and the youngest boy remained at Inawae
    with his sister, who had married into the village.
  category: sequence
  evidence_refs:
  - ev:7
