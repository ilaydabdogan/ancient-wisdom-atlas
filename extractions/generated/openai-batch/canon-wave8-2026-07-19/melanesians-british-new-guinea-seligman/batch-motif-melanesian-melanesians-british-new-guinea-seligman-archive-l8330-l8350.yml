canonical_text:
  quote: "“the neighbours of a dead man ... may not go to any new garden until after
    the lahidairi ceremony”"
  summary: 'The passage describes a death-related taboo: neighbours of a dead man,
    and strangers visiting nearby houses, must avoid new gardens until after the lahidairi
    ceremony, though old gardens may still be visited for food. Ahuia explains the
    avoidance as due to the corpse’s proximity, described as highly aina or helaga;
    the custom is called taubu.'
