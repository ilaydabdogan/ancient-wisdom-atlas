canonical_text:
  quote: ''
  summary: The passage describes the paiha marea as a war-related building used for
    arms, warrior meetings, feasts, and the partial seclusion and purification of
    homicides. It gives a sequence of restrictions, water and sea-shore cleansing,
    removal of paint by older warriors, investiture with a turtle-shell ornament reserved
    for homicides, and a firebrand chase intended to drive away spirits of the hostile
    dead. It also notes a custom of returning warriors throwing spears at marea roofs
    and sides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arms were kept in the paiha marea, where warriors met before battle and where
    a feast took place after successful fighting.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Homicides underwent ceremonial seclusion in the paiha marea while being purified
    from a blood taint believed to cling to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During daylight the secluded warriors could paint and adorn themselves, assemble
    outside the marea, and dance, but they had to sleep inside the marea and not go
    out at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The secluded warriors were expected to eat little and avoid handling food
    directly, using a bone fork with a handle wrapped in banana leaf.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At one stage the homicides stood painted and drumming before the marea while
    the paiha chief addressed them and spurted water from his mouth over them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The homicides then went to the sea-shore, entered the water with two older
    warriors each, and had their paint rubbed off by the older warriors with the backs
    of their hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a further period of sleeping in the marea, during which food restrictions
    were relaxed, the young homicides were repainted and again taken to the sea-shore
    to have paint rubbed from their bodies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Warriors who had not previously killed a man then assumed the fretted turtle-shell
    ornament called kotyu, which only homicides were allowed to display in their headdress
    in a particular way.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the kotyu was tied to each warrior’s headdress by the paiha chief and
    a feast and dance occurred, the newly decorated homicides were chased about the
    village with embers and firebrands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ember and firebrand chase is described as intended to drive away spirits
    of the hostile dead, which were understood as connected with or immanent in the
    homicide’s headgear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Warriors returning from a successful campaign threw spears at the roofs and
    sides of the paiha and war marea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A reported former distinguishing mark of paiha marea was gaps left in the
    roof, which were filled when successful warriors threw spears at them.
  category: object
  evidence_refs:
  - ev:6
