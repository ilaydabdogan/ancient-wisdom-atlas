  summary: The passage introduces Chapter XXXIII on folk tales collected from mainland
    South-eastern British New Guinea. It describes methods of recording and translating
    tales from Wagawaga, Taupota, Awaiama, and Goodenough Bay; comments on lack of
    white influence; proposes regional grouping of tale collections; cautions against
    using rock or cave-dwelling figures as evidence of antiquity; and notes belief
    patterns involving human-animal similarity, surviving human spirit, and malevolent
    non-human beings called ogres by the authors.
  language: English
