canonical_text:
  quote: ''
  summary: The passage describes warfare in south-eastern New Guinea and nearby archipelagoes
    as feud-based raiding, usually to avenge homicide. It details canoe raids, killing
    or capturing enemies, occasional destruction or plunder, cannibal consumption
    of captives or slain enemies, war-party appearance and weapons, and a Rogea stratagem
    involving secrecy, scouts, encirclement, attack, and withdrawal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Long feuds between communities were presented as the commonest cause of homicide
    and the usual basis of warfare.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each hamlet-group is described as having a traditional enemy, with fighting
    theoretically undertaken to avenge losses caused by that enemy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: This warfare was carried out through canoe raids in which attackers sought
    captives and pigs as food and sometimes burned houses or destroyed crops and gardens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says property destruction was not always essential; the central
    aim was usually to avenge a specific homicide by killing or capturing an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Night attack followed by rapid retreat to canoes is described as the usual
    method over a considerable coastal and archipelagic area.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note reports that distinguishing features of this kind of fighting included
    property damage and the eating of prisoners and slain fighters.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that strangers from non-enemy communities might sometimes
    be killed and eaten for food when immediate reprisals were not feared.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: There was no special war dress, but war-party members were usually blackened
    all over and sometimes wore cassowary-feather plumes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each warrior carried spears and a keripa wooden sword, and many carried shields.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the voyage, attackers took care not to be seen; if they camped at night
    they landed silently and lit no fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Brave men called Tau Tahutahuloro spied on the enemy and reported back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Two warriors called Boe led the advance in stages, with one remaining forward
    while the other returned to signal the main party.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a solitary enemy approached, the Boe warned the group, who hid in the bush
    and attacked to capture or kill him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Children and old men who accompanied the expedition guided the canoes to a
    position before the village to cut off retreat by sea.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Near the village, warriors divided into parties, surrounded it, attempted
    surprise, captured or killed people, stole valuables and animals, damaged gardens,
    and burned the village.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: If the assailants captured or killed one person, they might withdraw to the
    canoes carrying that person and saying they would eat him.
  category: speech
  evidence_refs:
  - ev:12
