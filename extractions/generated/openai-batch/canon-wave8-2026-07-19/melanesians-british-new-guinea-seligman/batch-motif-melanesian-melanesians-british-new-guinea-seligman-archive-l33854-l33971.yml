canonical_text:
  quote: ''
  summary: An ethnographic account describes the killing, singeing, cutting, and distribution
    of pigs at the Diwari walaga feast; the walaga mango is taken down, its leaves
    and property of dead men are burned, pork and taro are distributed as payments,
    certain food-taking privileges are noted, and sorcery-related charms and comments
    are mentioned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seventy-one pigs were counted on the Tuesday; not all were killed at the walaga,
    and some were connected with banivi payments, private debt settlement, or other
    business at the gathering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dancing had stopped at daylight or shortly after, and the killing of the
    pigs began before the observer arrived.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The walaga mango was taken down from the dawati, its leaves were cut off,
    and the leaves and property of dead men that had hung from the dawati were burned
    in the fire used to singe the pigs whole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pigs were carried whole to the platform and cut up there; the helpers
    appeared to belong to the clans that owned the pigs, and taro was heaped around
    the foot of the dawati.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the distribution, some village groups decorated themselves, marched
    in procession to the feast place, and took positions in groups; Wedau and Wamira
    people arrived shortly before the distribution.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pork had been set apart for the observer, and the Dogura boys took this pork
    before the general distribution began.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Diwari event is described as lacking the sort of religious ceremony observed
    at Gelaria, where a taniwaga climbed the dawati and appeared to pray while those
    on the platform responded.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: During distribution, names of important men in families were called, pork
    and some taro were thrown down, and the phrase “am bova,” glossed as “your payment,”
    was often used.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Younger family members collected the pork and taro and heaped it before the
    recipient; no recipient’s whole supply seemed to be given all at once or consecutively.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the distribution ended, young people packed the gifts in baskets or
    bags or carried them by hand or on sticks, and the crowd dispersed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: People waiting for the walaga, if without food, were said to be allowed to
    raid the hosts’ gardens and coconut palms; if challenged, they called “oiara,
    oiara” and were not interfered with.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the walaga mango was taken down and stripped of leaves, a charred stick
    about twelve inches long was observed tied to its butt; the observer was told
    only that the stick had been used to thrust at something, but the object and occasion
    were not determined.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Many old men present had a few hairs tied in a knot with string as a charm
    against sorcery; the knots were believed to have been tied by medicine men.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote reports that at the larger torela, a person who picks up property
    or food can say “gerio, gerio” and claim it without being charged with theft.
  category: speech
  evidence_refs:
  - ev:10
