canonical_text:
  quote: ''
  summary: Ethnographic passage on infancy and youth, including ear and nose perforation,
    absence of formal puberty initiation, age-status terms, infant sleeping and feeding
    practices, naming and nickname practices, and Tubetube procedures for ear and
    nose boring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A child's ears are pierced while the child is still a baby; in the Tubetube
    description, the mother bores the ears before weaning by placing komakoma on the
    ear lobe.
  category: action
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:2
  text: Nose boring is described as of no great importance in one general note, often
    delayed until about or after puberty; in the Tubetube account it may occur from
    the fourth to eighth or tenth year.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:12
- id: obs:3
  text: Boys are said to have no puberty initiation ceremony; when pubic and axillary
    hair begins, they begin sleeping in the potuma if they have not already done so.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gabiau, described as a case of precocious puberty, sometimes sleeps in the
    potuma and sometimes in his parents' house.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Girls are not tattooed and no initiation or seclusion ceremonies occur at
    puberty; they were said not to abstain from gardening, cooking, or fetching water
    during the first period.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A list of status terms classifies babies, children, and adolescents by approximate
    age, sex, and pubertal condition; some terms also serve as terms of address.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Boys may chew areca and wear armbands while still called koko, may be told
    their totems at the koko or tewera meameana stage, and generally begin smoking
    shortly before puberty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Tubetube baby usually sleeps in the hollow of the mother's arm, on a petticoat,
    and may be covered or placed within folded mats during the day.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Children are named within a few days of birth, often after a maternal uncle;
    a clansman or clanswoman may propose that the child receive that person's name.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: As a child grows up, a nickname derived from a physical peculiarity may replace
    the real name; Mwakasoki is given as an example of a nickname meaning large teeth
    or tusks.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A child is usually suckled until several teeth have appeared, but may also
    receive taro, yam, or banana first masticated by the mother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Each komakoma is a turtleshell ring with a sapisapi disc; when used for ear
    perforation, it grips the ear lobe until a slough forms and perforates the tissue.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: In Tubetube nose boring, komakoma are placed on the nasal septum until perforation
    occurs; afterward the wound is washed and a small stick, gradually increased in
    size, is inserted.
  category: action
  evidence_refs:
  - ev:12
