canonical_text:
  quote: ''
  summary: 'The passage reports conflicts among Kiriwina/Kitava communities: a planting-ground
    dispute settled by spear combat; an attempted ambush of a government party; revenge
    warfare against the chief Enamakala and destruction of villages; and a peace-making
    custom involving exclusion of the defeated and an atonement offering by the defeated
    chief at the conqueror''s village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kadukwaikera and Gumalababa quarrelled over ownership of a planting ground
    claimed by both sides; after diplomatic settlement failed, combat with spears
    was chosen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The combat field was selected and cleared, then replaced when the afternoon
    sun would have faced one side; a new field was cleared with the sun crossing obliquely.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the battle, two men of Kadukwaikera were killed, several were wounded,
    wounds were made by spears on the legs, and some shields were split by spears.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A government party was attacked or nearly ambushed by men with shields and
    spears; shots scattered the attackers, and a blood-marked shield with a bullet
    hole and some spears were recovered.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Moliasi later stated that he and his men attacked because they had heard about
    fighting with rifles and wanted to know what it was like.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The rising against Enamakala is explained as revenge for earlier burning and
    harrying of villages; the dissatisfied party also complained about Enamakala's
    food distribution and about his brother and successor Tauulu, whom they called
    a sorcerer and bad man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Enamakala was driven from Omarakana, which was burned; gardens, coconut and
    areca palms, pigs, fowls, houses, yams, and other villages were destroyed or looted,
    while the church and dwelling-house at the mission station were not burned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After large-scale warfare, the defeated party could be kept from its village
    sites for at least a year; peace involved equal presents at a meeting and an atonement
    offering by the defeated chief after receiving permission to enter the conqueror's
    village.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
