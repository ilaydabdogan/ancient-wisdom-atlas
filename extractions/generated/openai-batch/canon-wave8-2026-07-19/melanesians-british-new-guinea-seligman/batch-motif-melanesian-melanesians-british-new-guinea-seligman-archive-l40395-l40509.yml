literal_observations:
- id: obs:1
  text: After marriage, gardens are made on the bride's hamlet land and also on the
    bridegroom's land, with the bridegroom's land becoming more important after he
    builds in his own hamlet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two or three days after consummation, the bridegroom's people bring food and
    New Guinea valuables to the house of the bride's parents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Return presents of similar value are made, and reciprocal food presents continue
    for an indefinite time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A wife's sister may take her brother-in-law's property without objection and
    may even borrow and damage a big canoe without blame.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bride's brothers have similar rights of taking from the brother-in-law;
    the bride's mother has less defined rights and the bride's father is not expected
    to ask for anything.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A son-in-law avoids his mother-in-law, and a father-in-law avoids his daughter-in-law.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A wife avoids her husband's brothers, and a husband avoids his wife's maternal
    and paternal aunts and his wife's sisters' daughters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man is said to have the right to marry his brother's widow after mourning
    is complete, without making a new payment to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If another man marries the widow, he must pay the deceased man's brother the
    amount previously paid by the deceased for the woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a woman dies, her husband may take an unmarried sister of the deceased
    wife without fresh payment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the deceased wife's younger sister marries someone else, that husband must
    pay bride-price to the dead sister's husband rather than to the girl's own people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A man should not closely approach, hold prolonged conversation with, or speak
    alone in the bush with his wife's sister during the wife's lifetime.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A dead man's land goes to members of his clan, including brothers, sisters,
    and sisters' children, while some personal property may be directed to his children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A woman's land passes to her children, with older relatives looking after
    it if the children are young.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A man's house goes to his brother, sister, or sister's son, though it is often
    allowed to rot or is destroyed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A widow returns to her hamlet with her children; no burial or mourning details
    were elicited.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Mukaua community consists of six settlements west of Bartle Bay, with
    some hamlets containing households of a single clan and others containing two
    clans.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:18
  text: Mukaua and Bogaboga houses are built on piles, thatched with sago leaf, and
    have a roof-covered front platform.
  category: object
  evidence_refs:
  - ev:10
- id: obs:19
  text: Mukaua and Bogaboga speak the same language and observe the same customs.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:20
  text: Neither Mukaua nor Bogaboga has stone circles, current clubhouses, or obvious
