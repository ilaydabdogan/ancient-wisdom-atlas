canonical_text:
  quote: ''
  summary: 'The excerpt recounts several Wagawaga narratives: a red eel who takes
    human form, steals and eats a newborn, and brings a storm after his underwater
    village is burned; a cannibal named Kwahohofi who is killed when relatives exploit
    his fear of an earthquake wave; an ogre named Kuporu whose corpse is eaten by
    a schooner crew, after which all eaters die except an abstaining Sariba man; and
    the opening of a story about the ogre Gwarigwaridona meeting the pig-hunter Faisi
    Uri.'
  language: English
  quote_policy: summarized
