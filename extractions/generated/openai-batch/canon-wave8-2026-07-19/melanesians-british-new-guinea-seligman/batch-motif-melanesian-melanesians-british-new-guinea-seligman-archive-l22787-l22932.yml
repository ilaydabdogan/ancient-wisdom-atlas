  text: The woman, in a dark house, mistakes Tuisuheaia for her husband and gives
    him her child when he asks for it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tuisuheaia kills the child on a rock and eats it; the parents later find blood
