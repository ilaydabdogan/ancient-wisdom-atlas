canonical_text:
  quote: ''
  summary: 'The passage describes preparations for a walaga feast: men and women practice
    the dance; the feast is timed after several months, apparently with the taro crop
    and full moon; the taniwaga and fasting men cut and carry timber, dig holes, and
    set posts for the platform; medicine men use charms and spells at the post holes
    to prevent sickness, with one reported procedure involving removal and release
    of a dead person’s spirit from a post; bull-roarers are reportedly swung in some
    places during post setting; messengers announce the feast; fasting men clear a
    path to a chosen mango tree, place nets and mats to catch falling fragments, and
    one fasting man cuts the tree with a stone adze without spells.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men and women practice the dance steps for the walaga on a section of log,
    usually at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The interval before the walaga is described as about three to six months,
    probably determined by the ripening of the taro crop, and the announcement is
    made five or six days before a full moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The taniwaga and fasting men go to the jungle to cut the posts and timber
    for the walaga platform, and only they may cut and carry these materials to the
    village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The holes for the platform piles are dug by the fasting men after the taniwaga
    has notified the district’s gweri ravai that the piles are to be stepped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gweri ravai bring charms called ginauri, including leaves, bones, fragments
    of ash, and similar items.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: One or more gweri ravai squat by each hole, mutter spells, and place some
    ginauri at the bottom of the hole to prevent people who attend the walaga from
    becoming sick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fasting men put the posts in the holes, fill the holes with earth, and
    stamp them down while the gweri ravai stand by muttering spells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that information about what the gweri ravai did was difficult
    to obtain and that their actions appeared to vary at different times and by place
    of origin.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Mr Newton’s reported account, the gweri ravai rubbed the posts, sucked
    through their hands, extracted the arua of any dead man present in a post so it
    would not be injured, and released the soul in the grass or bush.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Awaiama and Taupota, fasting men are said to swing bull-roarers during
    the whole time the posts are being stepped; the passage says no reason for this
    use was elicited and that they were said to be used at no other time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The platform edge planks are generally made from the wood of a tree called
    dabedabe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Messengers announce in nearby and surrounding districts that the walaga has
    been built and that the feast will occur in five or six days.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Visitors generally arrive the day before the feast proper, and on that day
    the fasting men cut a track to the chosen mango tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After clearing the path, the fasting men place nets on the ground to catch
