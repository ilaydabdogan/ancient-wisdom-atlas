canonical_text:
  quote: ''
  summary: 'The passage describes land tenure at Wagawaga and Tubetube: community
    and clan rights in ground, bush, gardens, reefs, and hunting areas; stranger incorporation
    depends on adopting host-clan totems before receiving land or making gardens;
    an example concerns Nuakata men with a dove totem who settled at Dobuapa because
    of famine and some joined the Modewa clan.'
  language: English
  quote_policy: summarized
literal_observations:
