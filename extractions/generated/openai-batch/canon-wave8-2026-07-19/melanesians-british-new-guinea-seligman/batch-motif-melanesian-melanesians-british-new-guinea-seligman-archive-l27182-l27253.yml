  text: Ground near each hamlet-group is described as community property, while land
    near a particular hamlet's gardens is described as property of that hamlet's clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uncultivated bush is common property within the community, and clearing and
    making gardens gives the clearer's hamlet a complete hereditary right to the land.
  category: relationship
  evidence_refs:
  - ev:2
