canonical_text:
  quote: ''
  summary: The passage describes Mekeo ufu clubhouses in relation to warrior invocation,
    postwar seclusion and purification, feasting, chiefly designs, a mountain-representing
    architectural ornament, and borrowed Papuan Gulf ceremonial decorations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A warrior may call out the name of his ufu when striking a blow, and returning
    warriors may embrace the main piles of the ufu while invoking and praising them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tired or stiff man may speak the name of his ufu or more often invoke his
    village by its geographical name; the passage glosses inaenga as belly or centre
    and equates the ejaculation with the heart of the village, while noting an alternative
    freer translation expressing a wish to be in the village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Newly returned warriors entering their villages throw their spears at and
    into the ufu of war and faia chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The returning warriors are described as ngove and spend a period of strict
    seclusion in the ufu of the faia chiefs, with the front of the ufu closed by plaited
    coconut leaves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During seclusion the warriors are said to squat around the fire, eat little,
    and convey food to the mouth with a fork rather than touching it with the hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the end of the secluded period the warriors wash in water infused with
    fefu leaves and another herb, after which they may leave by daylight but still
    return at night and remain under restrictions on work, ornaments, and approaching
    wives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After two or three months a feast is made in one or more ufu of clans engaged
    in the war; pigs are probably killed, and particular chiefly ufu are set apart
    by old custom for the feast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men who killed a man in the recent fighting are decorated with kefe after
    the feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ufu are said to have no special designs of their own; carvings on the poles
    and other parts are the property and distinctive badge of the chief with hereditary
    charge of the ufu.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A special ornament on Popungapi, the ufu of Mangemange's pangua, is made by
    carrying the front central post through the roof and building a structure around
    it; the ornament is said to represent Mount Drew, called Kafarua by the Mekeo
    people.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: In some Mekeo villages ceremonial ufu decoration may mimic Papuan Gulf decoration;
    one Aipiana ufu is described as having borrowed decorations including bull-roarer
    derivatives portraying conventional human figures that represent ancestors of
    the Elema tribes.
  category: relationship
  evidence_refs:
  - ev:10
