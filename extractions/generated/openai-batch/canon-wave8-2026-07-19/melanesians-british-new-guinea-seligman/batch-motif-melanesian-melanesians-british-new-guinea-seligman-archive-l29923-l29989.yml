  text: The author says the 'harvest rejoicing' almost certainly corresponds to the
    toreha feast of Milne Bay and to the soi of Tubetube, Basilaki, and Rogea, while
    adding that his knowledge about Suau is uncertain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stones are hafted into either light artistic handles or heavier larger
    handles, both described as unsuitable for practical use.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Massim area visited, the lighter form of haft was much more commonly
    seen than the heavier form.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: Mr Gilmour identifies the slighter handle as the old Kiriwina handle called
    valela vaigua, glossed as 'its handle is wealth,' and identifies the other as
    a form from farther east and south, associated with Misima and called taramasima.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Old and well-carved handle specimens are described as valuable, though much
