canonical_text:
  quote: ''
  summary: The passage discusses Massim ceremonial stones called benam, their display
    by women at feast dances, their hafting into light and heavy non-practical handles,
    and the names and distribution of these handle forms. It then describes how value
    is attributed to Massim property, especially stone and shell objects, through
    durability, labor, skill, rarity, and use as currency.
  language: English
  quote_policy: summarized
