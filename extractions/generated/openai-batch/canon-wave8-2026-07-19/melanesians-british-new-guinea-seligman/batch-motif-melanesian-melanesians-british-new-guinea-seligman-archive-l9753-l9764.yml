canonical_text:
  quote: ''
  summary: The passage describes a mourning practice in which relatives and friends
    slept in the dead man's house as a sign of sympathy for the widow. It contrasts
    this with a newer government-influenced burial practice requiring graves in a
    recognized graveyard away from the village; the grave is lightly thatched against
    rain, no one sleeps on or near it, and relatives sleep in the dead man's house,
    with fear of the remote location also given as a reason for the change.
