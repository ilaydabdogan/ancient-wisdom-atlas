canonical_text:
  quote: ''
  summary: The passage reports Trobriand beliefs about barom, the shades or spirits
    of the dead, who go to Tuma, descend below the earth, and reach the place of shades
    associated with Topileta. It describes Topileta, variant local accounts of him,
    ideas about souls in humans and animals, temporary soul travel to Tuma, Marogus's
    return from such a visit, a prohibition on eating with the shades if one is to
    return, dream communications from the dead, and a feast at which food is left
    for visiting spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The shades of the dead are called barom and are said to go to Tuma, then descend
    below the earth and follow a track to the place of the shades.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The place of the shades is described as presided over by Topileta, who first
    sent men into the upper world with their totem animals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Topileta is described in one account as manlike with huge continually flapping
    ears; at Koma and Osiwasiu he is described as much bigger than a mortal man and
    covered with tattoo.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Topileta lives with his wife Tenupanupaia, who looks after his garden.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Topileta is said to cause earthquakes at will and to make medicine that restores
    youth to himself, his wife, and children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Koma and Osiwasiu, the village of the dead on Tuma is called Wilakatutara.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: All people are said to come at last to Topileta and to share equally in the
    other-world life, whether good or bad, strong or weak.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Chiefs are said to retain their authority in Tuma, while Topileta is described
    as important but not clearly as a ruler over the dead.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Lobua, an old man said Topileta asks the barom why they have died, and
    they answer that they do not know and have come to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some Osiwasiu accounts say pigs, dogs, birds, fish, and humans have barom,
    while some Kiriwina men say only humans have barom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports that shadows may have a subtle essence also called barom,
    and that the breath, called kaiyawos, accompanies the barom to Tuma.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Barom may leave the body without death, including in sleep or intentionally,
    and its experiences may become dreams.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Marogus of Kavatari was said to lie motionless and scarcely breathing for
    seven days while his barom visited Tuma, saw Topileta, and was sent back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Marogus reportedly said that the dead in Tuma make gardens, marry, and beget
    children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Living visitors to Tuma are said not to be able to return if they eat or smoke
    with the shades.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The dead are said to appear in dreams, speak in a whistling speech, invite
    the living to Tuma, and praise its crops and yams.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: At a feast after a death, food is cooked for the barom, left overnight, and
