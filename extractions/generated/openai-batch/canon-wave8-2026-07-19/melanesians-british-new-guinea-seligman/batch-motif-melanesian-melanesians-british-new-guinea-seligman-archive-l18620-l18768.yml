canonical_text:
  quote: ''
  summary: The passage describes the formation and subdivision of pangua and ikupu
    through factional conflict, migration, dual social groupings, genealogy, chiefly
    offices, and the transfer of chiefly authority with an emblem. It gives the Waiaka
    clan as an example, tracing constituent ikupu to named ancestors and describing
    the generic emergence of an ikupu from a larger parent group.
  language: English
  quote_policy: summarized
