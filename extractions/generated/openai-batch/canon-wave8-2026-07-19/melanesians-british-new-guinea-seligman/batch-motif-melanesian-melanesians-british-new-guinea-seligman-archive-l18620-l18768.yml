  text: The passage states that the first division in the Veifa example was the ordinary
    division into fdangiau and ekei sections.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the fdangiau section fought among themselves; the defeated party,
    led by the lopia fda, returned to Inawi and formed Ongofoina Kipo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The victorious party remained at Veifa, reorganized the village, and formed
    three new ikupu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A later conflict among the ekei ikupu led one party to move to Amoamo and
    form Igniuma pangua, while the other remained at Veifa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: 'The passage describes an additional dual grouping: fda or lopia aui contains
    the lopia fda''s ikupu, while io aui contains the war chief''s ikupu.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Waiaka, the lopia fda and the io lopia are said by genealogy to descend
    from a single ancestor, Maino Amaa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'Waiaka is described as having eight ikupu: five from a single named ancestor
    and three from an asserted common stock whose common ancestor is not named.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two sons of Maino Amaa, Amewa Kaiokuau and Opungu Kaiokuau, left Loiovina,
    crossed the river, and settled between the present sites of Inawi and Inawae.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The high chieftainship entered Amewa Kaiokuau's line after a lopia fda was
    publicly shamed by one of his wives at a feast and transferred authority and its
