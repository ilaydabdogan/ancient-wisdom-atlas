    be eaten without penalty.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The gariatma place stones on the edge of the mat folded over the body, after
    which earth is put into the grave and stamped down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A small shelter of coconut leaves is built on the grave, and a fence is placed
    around it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Relatives formerly slept by the grave for several nights to prevent pigs from
    disturbing it, and in theory the watchers were supposed to wail all night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Each clan-group has its own grave; graves are often reopened, and bones are
