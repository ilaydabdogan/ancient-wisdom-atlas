canonical_text:
  quote: ''
  summary: The passage describes burial practices in which low-value ornaments and
    foods eaten during the last illness are placed with the corpse, explains reported
    reasons for the food as both journey provision for the dead and a notice of taboo
    foods for widows, describes grave closing and protection, and records night-movement
    restrictions after a death with a possible belief about the soul seeking a new
    habitation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Low-value personal ornaments and foods eaten by the sick person during the
    final illness are placed with the corpse on the mat that is rolled around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that the buried food is understood as sustenance for the
    deceased on the way to the other world, and notes that the term tamaina also means
    provisions for an ordinary journey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same burial food is also said to identify the foods eaten during the dead
    man's last illness, which become taboo for his widow or widows until after the
    final banivi funeral feast.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Widows are described as actually abstaining from the taboo foods, sometimes
