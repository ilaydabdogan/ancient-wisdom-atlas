canonical_text:
  quote: ''
  summary: 'The passage describes Koita funeral and mourning procedures: messengers
    summon relations; visitors touch the dead man’s face with their noses; the corpse
    is shaved, oiled, painted, ornamented, watched, and mourned with dirges; the body
    is seated on a bisa death chair with close female relatives beside it; broken
    possessions are arranged as a tobi; a native drawing of the scene is described;
    rules for making a tobi are stated; ornaments are removed for later distribution;
    and the corpse is rolled in a mat and tied to a pole for carrying.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a Koita dies, messengers from the dead man’s local group are sent to
    relations in neighbouring villages, including Koita/Kolta and Motu relations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visitors come without painting or decorating themselves and touch the dead
    man’s face with their noses, without inhaling as when greeting the living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A younger brother, or failing him the henamo of the deceased, prepares the
    corpse for exposure on the bisa death chair.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corpse’s face and pubes are shaved, a new sihi is put on, the face is
    rubbed with grated coconut, and red paint lines are applied to the face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The corpse is given a garahota-wood nose ornament, shell armlets, strings
    of tautau, a boar’s tusk ornament, and gana on the legs and upper arm.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The corpse lies on its back on a mat in the house, with its head supported
    in the widow’s lap while she sits with one leg on either side of the body.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men and women watch and wail through the night, sing dirges, avoid eating,
    and stop wailing at sunrise before resting and eating.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dead man’s nana, roro, and iha make the bisa, a rough wooden framework
    or bench arranged to support the body in a sitting posture.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The corpse is carried by people who are not closely related to the dead man,
    placed in the centre of the bisa, with the wife on the right and the eldest sister
    on the left; if there are two wives, one sits on each side and the sister squats
    at the feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Villagers and friends form a half circle facing the bisa, beat drums and sing
    dirges for about an hour, and then the corpse is carried back to the house while
    the eldest brother steadies the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dead man’s chief possessions, except certain excluded valuables, are carefully
    broken and arranged beside the bisa as a tobi, with broken spears thrust into
    the ground at the centre and other objects wrapped and tied around them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Objects noted in a tobi include spears, arrows, bows, a bamboo pipe, a netting
    needle, a bamboo dancing staff, coconut drinking cups, a drum, koda and dakwai
    nets, and broken pots; a Bible was included but not torn up, while valuable personal
    ornaments and a costly reke net were excluded.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: A native drawing of a bisa shows red colouring on alternate feathers and face-paint
    lines, a fruiting papaw tree beside the bisa, a small tobi with a drum and two
    nets, three women wiping tears, and a man with a lit baubau whose glowing brand
    is coloured red.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: A tobi is made for a married man, a married woman, and an adult unmarried
    male, but not for an unmarried girl or a child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the body returns to the house, the dead man’s sister removes the ornaments
    except for the gana and nose ornament; the sihi also remains, and the removed
    ornaments are put in a kiapa string bag for later division among near relatives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The corpse is again touched with noses by everyone present, then lifted onto
    a new mat, tightly rolled in it, and roped to a longer pole for carrying.
  category: sequence
  evidence_refs:
  - ev:8
