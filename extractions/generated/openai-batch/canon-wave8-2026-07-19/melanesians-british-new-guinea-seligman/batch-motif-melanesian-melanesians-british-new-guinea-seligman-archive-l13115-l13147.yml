canonical_text:
  quote: ''
  summary: 'The passage describes a marea inauguration feast: pigs are killed, cut
    up, and assigned as named portions; vegetable foods are prepared and laid out;
    visiting chiefs eat while local chiefs abstain; the feast-giving chief assigns
    portions with a banana haulm; women cook and help carry food; areca nut and sometimes
    dancing follow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pigs are beaten to death with clubs; the club specified for this purpose is
    the ibarapu made from a palm, not the black wood pur'da club.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ovia akiva cut up the pigs, and pieces of pig-flesh are laid in rows and
    named as portions for various persons in the chief's itsubu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Female relatives of each named individual take charge of, and eventually carry
    away, that person's portion of pig-flesh.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The feast-giving ovia itsipana is said to reserve one or two pigs for his
    own people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The local group provides a large amount of vegetable food, and specially large
    gardens may be made a year before the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women of the village cook pig entrails with bananas; visiting chiefs eat this
    with yams and mashed bananas at midday on the itara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Chiefs of the local group inaugurating the marea do not eat, and the ovia
    itsipana verbally invites the other chiefs to eat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the end of the feast, areca nut is distributed and chewed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the afternoon, cooked yams and bananas are laid out in two or three lines
    down the village street, on leaves or in pots, with portions grouped in twos or
    threes; this laying out is called wakaro.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: All chiefs inspect the laid-out food, and the ovia itsipana of the new marea
    walks around with a banana haulm, striking each food collection and naming its
    recipient.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women help each man carry off his assigned portion to be eaten with his own
    people in his own village; sometimes there is a dance in the evening.
  category: sequence
  evidence_refs:
  - ev:5
