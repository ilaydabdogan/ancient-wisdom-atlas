  quote: ''
  summary: 'The passage describes several Massim ceremonial and exchange objects:
    potuma and gabaiera lime spatulae, dona pig-tusk ornaments, and benam ceremonial
    axe blades. It details materials, use in dance and bride-price, valuation and
    naming of blades, exchange uses, funerary and afterlife uses involving Topileta,
    display for departed spirits, burial with the dead, and concealment to prevent
    inheritance.'
