canonical_text:
  quote: ''
  summary: 'The passage contains the end of one narrative in which an old woman detects
    the birth of her grandchild by smoke, takes food to the child''s mother, snatches
    the baby, and leads the family into a cave at Kamkarago opened by charm words.
    The family eventually leaves; later the boy''s inability to open the cave indicates
    the grandmother''s death. A Taupota sorcery tale follows: a witch-wife flies home
    from the garden by spell while carrying her husband, withholds part of the spell,
    and the husband dies when he tries to use the incomplete formula. A new Frog-Witch
    tale begins with two girls adorning themselves and going to an inland dance.'
  language: English
  quote_policy: summarized
