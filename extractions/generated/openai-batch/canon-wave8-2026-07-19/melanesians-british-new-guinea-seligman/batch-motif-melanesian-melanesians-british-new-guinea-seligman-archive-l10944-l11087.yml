candidate_motifs:
- id: motif:1
  label: captured or stolen sua causing sickness
  taxonomy_refs: []
  basis: The sick man's illness is linked to a stolen sua captured by the tabu, and
    a child's convulsions may be linked to a sua taken by Atani Tano.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage uses the term sua without fully defining it in this excerpt.
- id: motif:2
  label: ritual exchange of ornament-sua for human sua
  taxonomy_refs:
  - sacred_exchange
  basis: Ahuia states that the tabu may accept the sua of ornaments in exchange for
    the man's sua, after which recovery is expected.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The taxonomy reference is limited to the explicit exchange structure in
    the passage and should not be read as a broader doctrinal claim.
- id: motif:3
  label: healing rite with fire, vessel breaking, and groaning
  taxonomy_refs: []
  basis: The ceremony includes a pot containing grass and a live firestick, the breaking
    of the pot with stones, and communal groaning.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage explicitly says no meaning could be elicited for the pot-breaking
    portion.
- id: motif:4
  label: ritual return without looking back
  taxonomy_refs: []
  basis: After the pot-breaking action, the sick man and attendants return to the
    village and may not look behind them.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives the rule but does not explain its purpose.
- id: motif:5
  label: tree-immanent sickness power
  taxonomy_refs: []
  basis: A tabu with sickness-making power is regarded as immanent in a large Ficus
    tree and sometimes human-like.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage supports tree association but not an axis mundi or world-tree
    interpretation.
- id: motif:6
  label: bush or sea beings as causes of illness, bad luck, and death
  taxonomy_refs: []
  basis: Atani Tano, Godiva, and vata/vadavada are each linked to taking sua, bad
    luck, stabbing, sudden illness, killing, or delayed death.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: The beings differ in setting and description; the grouping is functional
    rather than asserting a single identity.
- id: motif:7
  label: temporary revival by attackers before final death
  taxonomy_refs:
  - resurrection
  basis: Vadavada or vata are said to kill victims and bring them to life again, after
    which the victim becomes sick and dies within days.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: The revival is harmful and temporary; it is not presented as saving restoration.
- id: motif:8
  label: ambiguous human and non-human night attackers
  taxonomy_refs: []
  basis: The passage reports that vadavada may be treated as non-human beings, predatory
    bushmen, Koiari, bogies, or sorcerers, while also looking and dressing like ordinary
    men and traveling at night.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The ethnographer explicitly emphasizes variation and lack of a definite
    conclusion.
comparison_claims:
- id: claim:1
  claim: The cited Motu Vata account and the Koita/vadavada material share the function
    of explaining sudden illness or death through a bush-associated harmful being
    or agent.
  claim_level: same_function
  target: Turner's Motu Vata account cited within the passage
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  limitations: The passage stresses elastic belief and disagreement over whether vata/vadavada
    are spirits, non-human beings, predatory bushmen, Koiari, or sorcerers.
- id: claim:2
  claim: Within the passage, vata/vadavada are compared across human and non-human
    categories, supporting a cautious boundary-blurring pattern rather than a fixed
    spirit classification.
  claim_level: same_function
  target: predatory bushmen, Koiari, non-human vada/vadavada, and sorcerer interpretations
    in the passage
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison of reported interpretations, not evidence
    for historical contact or common inheritance.
