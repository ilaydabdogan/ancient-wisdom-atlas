canonical_text:
  quote: ''
  summary: The passage describes a sickness-making tabu associated with a large Ficus
    tree, a sese ceremony intended to recover a captured sua through ornament offerings,
    and several beings or categories of beings linked to illness, bad luck, bush dangers,
    or ambiguous human/non-human status, including Atani Tano, Godiva, Devase, and
    vata/vadavada.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tabu with the power of making people sick is said to be immanent in a large
    Ficus tree and is thought of as having human form to some extent or at certain
    times.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A special ceremony is performed to induce the tabu to give up a sua it has
    captured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A long bamboo decorated with valuable ornaments is called sese and is taken
    by the sick man and his friends to the place where he says he fell down and lost
    consciousness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sese is supported horizontally over a pot containing siriho grass and
    a live firestick.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: As the grass crackles and burns, men standing around the pot strike and break
    it with stones while everyone groans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the return to the village, neither the sick man nor his attendants may
    look behind them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the sick man reaches the village, he lies down in his house and the sese
    is hung above him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ahuia states that the tabu keeps the sick man's sua in the ground and may
    accept the sua of the ornaments in exchange for the man's sua, after which the
    invalid is expected to recover in a couple of days.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says no meaning could be elicited for the part of the ceremony
    in which the pot is broken.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Children may be attacked by tabu, and the same kind of sese may be made for
    them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A child's convulsions and fall from a verandah may be explained by saying
    that the child's sua has been taken by Atani Tano.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Atani Tano is said to live in the sea and to resemble a man with very long
    hair but without arms or legs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Godiva resembles a man with long frizzly hair and no toes; mentioning his
    name while fishing or hunting is said to bring bad luck.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Godiva wanders in the bush carrying a short spear with which he stabs people,
    who then go home, become sick, and die.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The sua of the forgotten dead are described as almost harmless and as wandering
    in the bush where men have died.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Devase are a class of beings without arms and legs, or sometimes with arms
    and legs but no hands or feet; all have long hair.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Vadavada or vatavata are described as creatures frequenting the bush, and
    Turner's cited Motu account links sudden illness to an evil spirit called Vata
    who lives in the bush.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The name vada or vadavada is also said to have been applied to predatory bushmen
    and to non-human beings who kill men with an egg-shaped stone club, make medicine
    of the body, and bring the victim to life again.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: A man attacked by vada returns to his village desperately weak and ill and
    dies in three to six days.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: Vadavada look and dress like ordinary men but invariably travel at night.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:21
  text: The passage reports uncertainty and variation about whether vadavada are non-human
    beings, bogies, Koiari, or human sorcerers.
  category: other
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:22
  text: Ahuia states that a vata is really a man, not a ghost or spirit, and that
    vata are sorcerers who may kill and revive an inmate, after which the inmate becomes
    sick and dies.
  category: speech
  evidence_refs:
  - ev:13
