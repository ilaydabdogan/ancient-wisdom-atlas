canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a snake identified as a
    woman's mother watches over a baby, lengthens and shortens the child's legs, and
    produces abundant garden food by enchantment; an explanatory note connects this
    to the food of mountain people. It then gives the tale of the Rat and the Butterfly,
    in which the two make a canoe, sink it through bodily acts, reach shore, and the
    rat later dies in a sugar-cane patch and is buried by butterflies.
  language: English
  quote_policy: summarized
