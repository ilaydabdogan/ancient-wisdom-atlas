canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking village architecture, house construction,
    fences, clan organization, settlement grouping, and the distribution and meanings
    of some Roro clan names. It includes comparisons with Motu villages and Motu/Koita
    clan units, and notes an unusual Waima house probably associated with a chief
    because of a carved and painted board.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro-speaking villages are described as architecturally similar to Motu villages,
    except that houses are not built directly on the beach or in the sea, and Waima
    houses are rarely raised on piles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Typical houses are rectangular or oblong, usually about twice as long as broad,
    with steep thatch, a rear wall formed by thatch, a sago-leaf-midrib front, a raised
    sill, and a plaited coconut-palm-leaf door.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An unusual Waima house photographed in 1898 is described as having a front
    resembling a beehive form, though such houses are not circular.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The unusual Waima house had an ornamental projection around the ridge pole,
    a feature compared to clubhouses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A pole supporting the anterior roof projection had a carved and painted board
    attached, leading the author to state that the house probably belonged to a chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Waima garden fences are described as good enough to be pig-proof while in
    repair.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some houses have stout high fences, some have low fences, and most have no
    fence; unfenced houses may be bordered by a rectangle of bamboo laid on the sand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Roro-speaking tribes are divided into itsubu clans, with descent in the
    male line and formerly strict clan exogamy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The itsubu are stated to correspond to the iduhu clans of the Motu and Koita
    tribes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some Waima and probably Kevori local groups tend to speak of themselves as
    units equivalent to an itsubu, even when they are only local parts of one or more
    itsubu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Waima, Kevori, and Bereina are described as communities where people live
    in multiple small settlements grouped compactly within a limited area, often with
    each settlement made up of householders from a single itsubu.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Roro and Paitana tribes are described as numerically weaker groups whose
    habitations are spread over a considerable area, with a tendency toward compact
    multi-clan villages while some single-clan settlements also occur.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Roro clan names include Ovia Pokina, Koae Kupunu, Parama Kupunu, Aitsi Noobera,
    and Aitsi Kupunu; the terms pokina, kupunu, and ovia are glossed as origin/beginning,
    origin/root/lower tree trunk, and chief respectively.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Siria, on Yule Island, with Erierina usually considered part of it, contains
    representatives of each Roro clan; Pinupaka and Pokama each contain part of Parama
    Kupunu, while Delena contains representatives of Koae Kupunu, Ovia Pokina, and
    Aitsi Noobera.
  category: relationship
  evidence_refs:
  - ev:11
