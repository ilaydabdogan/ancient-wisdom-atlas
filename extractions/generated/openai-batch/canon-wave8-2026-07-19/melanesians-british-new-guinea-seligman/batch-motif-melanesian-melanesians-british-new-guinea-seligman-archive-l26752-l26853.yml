canonical_text:
  quote: ''
  summary: The passage describes Wagawaga potuma, male clubhouses or talking places
    that women may not enter. It notes their construction, decoration, interior furnishings,
    displayed animal and human skull trophies, associated watara platforms used for
    eating and food sharing, restrictions on young men in old men's potuma, and the
    theoretical allocation of potuma by clan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wagawaga, certain houses are identified as men's clubhouses and talking
    places, and women may not enter them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The potuma are similar in size and construction to better dwelling houses
    but have painted or carved decorative boards.
  category: object
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: Wagawaga houses are built on piles, sometimes with a flat disc between the
    floor and pole-top to hinder rats and mice; some potuma may stand in the sea below
    high-water mark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Decorative boards on potuma represent birds, snakes, and fishes, and are not
    limited to the totem animals of the builders or owners.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside a potuma there may be one or two fireplaces, pandanus-leaf sleeping
    mats, wooden pillows, and fishing nets along the side walls.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fish backbones, turtle leg bones, and fish and pig skulls are hung inside
    as evidence of food eaten in the potuma; pig jaws were formerly arranged outside
    the front thatch.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Human skulls taken by the men associated with the potuma were reportedly attached
    to an inner board, or in some bush communities lashed to potuma poles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A stated belief held that if a woman entered a potuma, it would catch fire
    and be destroyed, though the author heard of no case in which this was said to
    have happened.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A watara platform is generally built either in front of the potuma as a verandah
    or beneath the floor.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ceremonial feasts are not held and food is not cooked in the potuma, but men
    often eat in the potuma or on its platform.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man may ask his wife or mother to send food to the potuma; other men present
    have no right to demand a share, but he usually invites them to join him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: An important man returning from a large neighboring feast is expected to bring
    much of the pig meat given to him to the watara, where it is eaten by those who
    attend.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Young men do not enter the old men's potuma or go onto its watara unless specially
    invited; in one example, no man under about thirty-five approached while old men
    ate pig meat there.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that, in theory, each clan should have its own potuma,
    though this allotment had broken down in the author's present-day account.
  category: relationship
  evidence_refs:
  - ev:10
