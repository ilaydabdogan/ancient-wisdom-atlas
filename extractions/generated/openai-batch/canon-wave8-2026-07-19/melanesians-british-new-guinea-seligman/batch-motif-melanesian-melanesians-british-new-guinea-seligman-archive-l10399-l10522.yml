canonical_text:
  quote: ''
  summary: 'The passage describes agricultural charms used for coconuts, yams, bananas,
    and gardens: abekeru leaves are placed under coconuts; water is passed over stones
    or charms and onto yam and banana seedlings; incantations may be recited; many
    kinds of stones and objects are catalogued as yam or banana charms; some charms
    require touching a yam, carrying a charm around a garden, or merely being present
    during planting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When coconuts are planted, a few leaves of the abekeru tree are placed under
    the coconut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The abekeru tree is described as bearing a large quantity of fruit that is
    not edible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yam and banana crops are said to be favorably influenced when water drips
    over certain stones or charms and falls on seedling yams and banana suckers before
    planting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An incantation supplied by Chalmers is said to be repeatable while the water-dripping
    procedure is done, though the passage states it was not always considered necessary.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Yam stones are usually rounded, oval, or oblong and almost always waterworn;
    their materials include volcanic or highly metamorphic rock, basic tuff, trachytic
    lava, vein quartz, and giant clam blisters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: When giant clam blisters are used as charms, they are sometimes reddened,
    water is left in them briefly, and the water is then sprinkled on the yams.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spherical stones with a slight conical or rounded projection are especially
    valued as yam charms, and dumb-bell shaped stones are described as highly prized.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports an allegation that ownership of one dumb-bell shaped yam
    charm alone could ensure abundant and excellent yams, without water needing to
    drip from the charm onto seed yams.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Certain highly polished elongated stones are used by touching a specially
    big yam with the stone; the yam is put away, later develops many shoots, and those
    shoots are planted to produce more large yams.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ballantine collection includes many banana charms, such as fossil coral,
    a banana-shaped pebble, a marble-like object, calcite, limestone, quartz, volcanic
    rock, beekite, laterite, pebbles in a netted cover, a boar's tusk, shell ornaments,
    resin, and iron ore.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: For one disc-shaped banana charm, water is not sprinkled; instead, to ensure
    a good banana crop, a person walks around the garden counterclockwise with the
    charm in the left hand and turned toward the garden center.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some charms are considered beneficial for everything in the garden, and their
    presence in the gardens during planting time is described as sufficient.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Chalmers records an incantation repeated in the plantations when the yams
    are just above the ground.
  category: speech
  evidence_refs:
  - ev:10
