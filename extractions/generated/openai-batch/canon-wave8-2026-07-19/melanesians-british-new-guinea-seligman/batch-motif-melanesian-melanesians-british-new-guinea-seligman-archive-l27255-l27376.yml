canonical_text:
  quote: ''
  summary: The passage describes the eriam relationship at Wagawaga and Tubetube as
    a reciprocal bond between men, involving close friendship, practical aid, quasi-kinship
    terms, and restrictions around wives and sisters. It notes uncertainty about how
    the bond is formed and gives one named example involving Ipunesa and his eriam.
    It then describes the Bartle Bay kimta as a same-sex, age-based class or association
    with rights to fellowship and help, recognized across several settlements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga and Tubetube, certain men call each other eriani or eriam and
    stand in a particular reciprocal relationship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that at Wagawaga and Tubetube no feature resembling the Bartle
    Bay right of access to an eriam's wives could be elicited.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, eriam are said never to be of the same clan, but their friendship
    is close enough to confer practical rights and produce results approaching consanguinity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a man is short of food or tobacco, his eriam will help him and may provide
    for him and his family.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Eriam were said to stay together in battle, and formerly did not call each
    other by personal names but addressed each other as eriam.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Wagawaga there is said to be no levirate between eriam, and a man may not
    marry the widow of his eriam because she is to be regarded as a sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man should not usually go to his eriam's house unless the eriam is expected
    to be home, and should not speak to the eriam's wife alone; if the eriam is away,
    giving tobacco and speaking to the wife should occur only in public.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In one example, Ipunesa has bird totems siai and kulokulo, while his three
    eriam, Demes, 'Tom,' and Porewarutu, are Garuboi men with bird totems whaiwhai
    and boi, the clan of Ipunesa's father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Wagawaga, eriam relationships are mapped through reciprocal kin terms applied
    to wives, children, sisters, brothers, fathers, mothers, and affines of an eriam.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Tubetube, the author could not determine how the eriam relationship was
    constituted; one reported explanation involving two boys and two girls in the
    same house is explicitly treated with grave doubt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Tubetube, eriam do not marry or sleep with each other's sisters, and the
    relationship between a man and his eriam's sister is said to be much like that
    between sister and brother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Bartle Bay communities, including Gelaria, people of the same sex and
    approximately the same age, born within a given period, are considered members
    of a class called a kimta.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Members of a kimta form an association or company with rights to each other's
    fellowship and help.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Bartle Bay, male children born in a period of about two years constitute
    a kimta.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Bamdiri of Wedau states that his kimta relationship would be recognized in
    named coastal and inland settlements, with stated eastern and western limits.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: A kimta may be identified by the name of any of its members; there is no formal
    admission of a child to a kimta and no exchange of birth presents between parents
    of kimta mates.
  category: sequence
  evidence_refs:
  - ev:9
