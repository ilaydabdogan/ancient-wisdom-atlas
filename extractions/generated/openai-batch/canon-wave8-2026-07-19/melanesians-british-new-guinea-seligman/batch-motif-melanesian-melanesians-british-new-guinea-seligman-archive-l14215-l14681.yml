  summary: A tabular ethnographic passage lists Waima and Roro-speaking settlements,
    their itsubu, oaoa, marea names, and remarks. It records marea associated with
    animal or object badges, carved posts, effigies, a vulva carving, snake and crocodile
    carvings, battle or war marea, aruaru and paiha marea, ruined or absent marea,
    and marea used for feasts and ceremonies.
  language: English
