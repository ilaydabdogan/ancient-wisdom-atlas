canonical_text:
  quote: ''
  summary: The passage explains terms for likeness, spirit, ghost, vital force, and
    shadow; describes tsirama and beriwa as dead-person spirits associated with villages,
    luck, soul-theft, illness, night fear, and post-mortem travel to Ariyo; describes
    Ariyo as an abundant garden in the bush where dead spirits are happy; and describes
    Boubou, an evil spirit like fire, intercepting spirits on the way to Ariyo, questioning
    them about bodily piercings and manner of death, and directing them along roads
    that all reach Ariyo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Auba is explained as a man's likeness or reflection rather than the spirit,
    shade, or ghost of a dead man; tsirania or tsirava, and sometimes beidwa, are
    given as terms for a dead man's spirit or ghost.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsirava is also described as a term for the vital forces or essence within
    an individual, and tsirama are sometimes said to be seen as shadows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsirama are said to frequent their people's villages; if they desert a village,
    the inhabitants have no luck, and measures may be taken to bring them back.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If annoyed, for example by too many quarrels among women, tsirama send bad
    luck in hunting and fishing, and in such circumstances may be conjured out of
    the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seeing the tsirama of a dead relative in dreams is described as terrifying
    but not unlucky.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tsirama steal away the souls of others and make them ill; beriwa are said
    in some cases to behave in the same way and may be considered identical with tsirama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fear of tsirama and beriwa is said to prevent people from leaving the village
    after dark unless accompanied.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tsirama or beriwa of dead men go to Ariyo in the bush behind Waimatuma,
    where a large garden is cultivated by shades, food is abundant, and all are happy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a living man reaches Ariyo he dies; in one account plants from Ariyo brought
    to mortal gardens are transported back by spirits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In another account, living men reached Ariyo and brought back plants, but
    the plants withered and died when transplanted, and mortal gardens then produced
    only small crops for a time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Boubou is called an evil spirit like fire who intercepts the tsirama on its
    way to Ariyo, asks whether its ears and nose were pierced during life, asks how
    the person died, and directs the spirit to one of several roads, all of which
    reach Ariyo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author reports that nothing was discovered about Boubou's origin or physical
    characteristics and that there was no reason to believe the figure derived from
    misunderstood mission teaching.
  category: attribute
  evidence_refs:
  - ev:6
