canonical_text:
  quote: ''
  summary: Ethnographic account of Wagawaga and Tubetube totemism, emphasizing greater
    avoidance of a father's totems than one's own, including restrictions concerning
    birds, fish, snakes, plants, marriage, sexual relations, feather ornaments, ceremonial
    headdresses, and linked hamlet totem sets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, a man is said to pay more ceremonial attention to avoiding his
    father's totems than to avoiding his own totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Disrespect toward a father's bird and fish totems is said to cause severe
    boils; companions would call the offender foolish and greedy, but strong public
    resentment is not described.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: One adopted man avoided both his father's former totems and the totems acquired
    through adoption into a Wagawaga clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man respects and avoids his father's totem snake and would not kill it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man generally avoids injuring his father's totem plant, though Modewa men
    with Garuboi fathers said they would destroy okioki if it interfered with garden-making.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lying-in women eat a decoction of yams and okioki fruit or leaves during the
    puerperium, regardless of whether okioki is their own or their father's totem
    plant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man would not marry a woman with the same totems as his father; one informant
    described women of his father's totem as 'half-mother' to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The former rule against sleeping with a woman of a man's father's totem is
    described as a minor clan-law infringement whose breach was not thought to harm
    the lovers or their clansfolk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man and wife may eat one another's totem fish as they would their own; a
    wife's totem snake is said to frighten a man no more or less than any other snake
    in which he has no special interest.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Feathers of cassowary, lory, cockatoo, pigeons, cassowary, cockatoo, and bird
    of paradise are described as ornaments used for dancing, visiting girls, or formerly
    for fighting.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men do not wear feathers of birds that are their father's totem birds, including
    in ceremonial hornbill-beak headdresses and waiapa bird-of-paradise feather use;
    substitutions may be made with other white feathers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: No origin information is given for bird, fish, and snake totems in this passage;
    the origin of plant totems is referred to another chapter.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Tubetube, as at Wagawaga, individuals have linked bird, fish, and snake
    totems; plant totems are absent except at Dekwasoso, where the plant totem is
    said not to be respected.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage includes tables arranging clan or hamlet totems under bird, fish,
    snake, and plant headings for Wagawaga and Tubetube.
  category: object
  evidence_refs:
  - ev:10
