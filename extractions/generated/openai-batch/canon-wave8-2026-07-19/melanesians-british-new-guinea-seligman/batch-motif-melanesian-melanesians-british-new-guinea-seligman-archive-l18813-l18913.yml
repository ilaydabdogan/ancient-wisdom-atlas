canonical_text:
  quote: ''
  summary: 'The passage describes Mekeo chieftainship: ranked offices within clans,
    the relation of high chiefs, war chiefs, experts, and lopia ekei assistants, ceremonial
    privileges at feasts, chiefly insignia including the faonga lime gourd and lopia
    pao ornament, loyalty to chiefly families, and an account of a Walaka high chief
    resigning after a ceremonial food obligation was breached by his wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Each clan is said to have or to be expected to have two chiefs: the lopia
    fda as high chief and the io lopia as war chief.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The faia lopia are described as departmental experts who exercise powers to
    give victory to the community rather than for gain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lopia ekei is the head-man or leader of the ekei section and is regarded
    as a chief, but his described duties are those of a henchman to the lopia fda.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In small or weak pangua, war chiefs may be absent, or high-chief and war-leader
    functions may be united in one person.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lopia fda has rights that are not deputed to the lopia ekei; if he is
    ill, a substitute is chosen from his own family rather than from the lopia ekei.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At feasts given by his clan's ufuapie, the lopia fda takes precedence, while
    the lopia ekei carries and spreads the bread-fruit bast-cloth on which he sits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lopia ekei receives food gifts, especially pork, passes them to the high
    chief, sits on the high chief's left, and serves mainly as spectator and assistant
    in ufuapie ceremonies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At big feasts the lopia fda carries a special lime gourd, the faonga, and
    makes a nearly continuous rattling sound with a grooved lime spatula.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The faonga is described as larger than ordinary lime gourds, covered with
    dark wax, studded with animal teeth, kept wrapped in the high chief's ufu, and
    brought out only for ceremonial occasions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mekeo chiefs also wear the lopia pao ornament, identified in the passage with
    the Roro-speaking tribes' eaii rove.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Families closely related to the lopia fda are described as loyal to the chief,
    and the pre-eminence of chiefly families is recognized.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Walaka lopia fda resigned his chieftainship and left his village after it
    was discovered that his wife had secretly reserved a pig joint that should have
    been ceremonially presented to guests.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The family nobility of the resigned chief is still recognized, and his descendant's
    name is linked with the present chief's name during ceremonial calling from the
    ufu.
  category: sequence
  evidence_refs:
  - ev:8
