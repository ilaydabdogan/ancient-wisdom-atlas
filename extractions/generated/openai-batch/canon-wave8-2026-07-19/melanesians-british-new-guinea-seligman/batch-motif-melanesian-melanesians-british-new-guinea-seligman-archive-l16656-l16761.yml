canonical_text:
  quote: ''
  summary: The passage describes kaivakuku and Elema/Papuan Gulf harihu as hereditary
    masked specialists who enact and enforce taboos on vegetable or garden produce,
    including harvest restrictions, taboo signs, punishments, secrecy about their
    human identity, and instruction of initiates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kaivakuku are described as men and taboo experts with the power to pronounce
    a highly dreaded taboo on vegetable food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Roro-speaking tribes, kaivakuku are reported at Waima, Hisiu, and perhaps
    Kevori; the passage says the custom was introduced from the Elema tribe of the
    Papuan Gulf, while noting some local disagreement about origin.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:3
  text: Kaivakuku officiate in huge masks covering the whole body; masks are reported
    kept in a special hut or in the closed inner chamber of the marea, and one bark-cloth
    mask portion was seen over a dead chief's death-chair.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Waima, kaivakuku punish taboo breakers by formally complaining to the ovia
    itsipana, raiding the culprit's possessions, killing pigs and dogs, and stopping
    when given a present.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kaivakuku promenade in the afternoon while disguising their gait and walking
    on the sides of their feet; at night they swing bull-roarers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The decision to proclaim a taboo rests with chiefs and old men; kaivakuku
    translate that decision into action and punish transgressors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Elema tribes, harihu impose taboo on garden produce after planting,
    fencing, and completion of yam-vine trellises, forbidding digging or removal until
    they decide the crop is ripe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Harihu test crop readiness by occasionally digging up a plant, inform the
    chief when the crop is fit to eat, and the chief announces from the clubhouse
    verandah that people may gather food; a village feast follows while the harihu
    remain apart in the clubhouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For coconuts, harihu warn of an intended taboo by planting a ripe nut upright;
    owners may collect nuts until the first shoot appears, and the taboo remains until
    the harihu remove it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A tabooed garden is marked by a small specially shaped stone at the entrance,
    bearing private marks of the harihu; tampering with it is said to make the offender
    liable to instant death at the hands of the vada, though the passage cautions
    that the term's precise significance is unclear here.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Gulf villages, the harihu office descends from father to son, or, if there
    is no male issue, to a brother's or sister's children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Only men of the tribe know the harihu are human beings; women and uninitiated
    youths are taught that they are spirits from the bush and are described as very
    afraid of them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A woman coming near a harihu would be killed, and children who approach are
    beaten; before appearing, harihu live in a scrub shelter visited by a few old
    men, and initiates secluded in the eravo are instructed about them.
  category: sequence
  evidence_refs:
  - ev:7
