canonical_text:
  quote: ''
  summary: The passage transcribes seven songs sung on lakatoi and gives brief, often
    uncertain ethnographic notes. The notes connect some songs with named lakatoi,
    places near Port Moresby and Boera, fishing equipment, drought memory, lakatoi
    legends involving quarrel, division, return, disappearance at sea, mourning, voyage
    preparation, and obscure song terms.
  language: English with transcribed song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the material as songs sung on lakatoi, with spelling
    and word division based on how the songs sounded to the recorder.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the commentary on Song I, Bogebada is explained as the Motu word for fish-hawk
    and as a commonly used name for a lakatoi; the lakatoi Bogebada appears to be
    addressed and told to go toward Anal or Hanai on Daugo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The site called Anal or Hanai is said to remain as an accumulation of broken
    pottery and sea shells; Motu tradition says that during a great drought their
    forefathers went there and lived for a long time on fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Song II is described as associated with a legend; Idiha and Bava are two adjacent
    islands on the barrier reef off Boera, and dakwai is a bag net used for catching
    jumping mullet.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The commentary on Song II glosses the phrase translated literally as an instruction
    to throw something down.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Song III is linked to a lakatoi legend in which Kaimegore and Idogore went
    as baditauna and doritauna of a lakatoi named Bogebada of Boera, then quarrelled
    while waiting at a Gulf village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the quarrel in the Song III legend, the parties split a set of items
    into six and six, each made his own lakatoi, Idogore reached home, and Kaimegore's
    lakatoi disappeared over the horizon with its people never seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Song IV is described as a sad song apparently about the loss of a lakatoi
    at sea with those on board, and about mourning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Song V is interpreted as probably referring to preparation of a lakatoi for
    a voyage; the commentary mentions the ilimo tree, swimming, a lakatoi sail, and
    caulking, while stressing that the meaning is obscure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For Song VI, vamo is identified as a sweet-smelling herb worn in an armlet,
    but the recorder says he can make nothing of the song.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Song VII is called a favourite song, but its meaning is said to be obscure.
  category: speech
  evidence_refs:
  - ev:8
