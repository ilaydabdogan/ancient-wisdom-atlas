canonical_text:
  quote: ''
  summary: The passage describes several physical taboo signs used in Wagawaga, Tubetube,
    Rogea, and nearby districts. Signs made from coconut or sago leaves, plaited leaflets,
    shell strings, sugar-cane stalks, Y-shaped branches, shells, and pig skulls mark
    protected trees, plants, reefs, tracks, produce reserved for a mourning feast,
    and pigs. The passage also notes local names, geographic spread, and social effects
    such as respecting a finder’s right or seeking compensation rather than killing
    tabooed pigs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Community members are said to know roughly who owns each garden and each areca
    or coconut tree, making accidental intrusion difficult.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many taboo signs are described as widely spread through the district, with
    place names given where definite information was obtained.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Wagawaga sign named hato is made by fastening a short coconut leaf, or sometimes
    a sago leaf, around a coconut or areca palm; a modified form uses two leaves on
    opposite sides of the trunk.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A sign called gwara or gwala at Wagawaga and Tubetube is made by stretching
    a coconut leaf between trees or stakes; when erected on a reef it protects the
    fish there.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another sign is made from roughly plaited coconut leaflets shaped like a round
    basket and placed upside down on low stakes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:6
  text: The first three signs are said to be used for areca and coconut trees or other
    plants, and in old Tubetube usage they were supposed to denote the presence of
    “medicine.”
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: One or two coconut leaflets tied to the lower branch of a bearing fruit tree
    mark the finder’s right, which subsequent comers are expected to respect.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: At Tubetube, a string of dunali shells tied around a dead man’s coconut tree
    taboos its produce until the rigariga mourning feast; gardens may also be tabooed
    this way if enough food remains for the family.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: A footnote reports that two sugar-cane stalks may be tied across a track to
    prevent its use when adjacent sugar-cane is ripe, either with a spell or simply
    as a barrier.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: At Wagawaga, tabooed pigs are marked by a Y-shaped branch or young tree with
    Triton or Cassis shells, a coconut or sago leaf, and pig skulls; if such pigs
    enter a neighbor’s garden, the neighbor seeks compensation rather than killing
    them.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
