canonical_text:
  quote: ''
  summary: The passage catalogues valuable property and exchange goods in the South-eastern
    Massim area, including ceremonial axe blades, pigs, armshells, shell-disc ornaments,
    bagi, samakupa, nose ornaments, and whale-bone lime spatulae. It describes materials,
    regional origins, names, values, and uses of these objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Apart from house and garden lands, valuable property includes canoes, spears,
    fishing nets, durable personal adornments, ceremonial axe blades, shell ornaments,
    and pigs used in payments.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finely polished ceremonial axe blades are made in certain Murua villages,
    called benam in Tubetube, and traded over the Massim area.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Armshells are made from Conus shell and are divided into three grades: masiwaru,
    kaipapa, and bwabwakipa.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The largest armshell grade, masiwaru, is made in the Trobriands, where it
    is known as mwale.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Masiwaru armshells are valuable enough to receive individual names; examples
    in the passage are Gaigaiba and Siai.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that armshells are named by their makers but are not thought
    of as possessing a soul, spirit, or ghost.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Armshells are commonly traded in pairs, and the two superior kinds are generally
    counted in pairs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sapisapi are small red or purple shell discs, worn singly as earrings or made
    into ornaments such as bagi and samakupa.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bagi are imported ornaments and are described as among the most valuable portable
    property a man can acquire at Tubetube or Milne Bay.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Women wear bagi at certain feasts, with shell-bead strings tied around the
    neck and the cone and pendants hanging down the back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wanepa are nose ornaments worn in the nasal septum and made from the yellowish
    hinge-area shell material of the giant clam or related Tridacna species.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Potuma are lime spatulae made from whale bone and commonly ornamented with
    sapisapi discs around the handle.
  category: object
  evidence_refs:
  - ev:8
