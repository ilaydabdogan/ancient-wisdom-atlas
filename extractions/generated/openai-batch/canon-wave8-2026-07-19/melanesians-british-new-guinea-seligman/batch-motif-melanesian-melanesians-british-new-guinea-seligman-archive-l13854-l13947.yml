  text: Marea are described as usually decorated with carved posts and boards, often
    colored black, with low-relief work and intaglio areas picked out in white or
    red.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The edge of the kaiva is usually hung with closely set strips of dried palm
    leaf cut to the same length, and a similar fringe may continue along the eaves.
  category: object
  evidence_refs:
