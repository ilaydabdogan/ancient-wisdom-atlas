canonical_text:
  quote: ''
  summary: 'The passage describes ornaments in and upon marea clubhouses: carved and
    colored posts and boards, palm-leaf fringes, non-dada decorative post carvings,
    a sun-and-vulva design, human-headed posts, a dogs''-teeth pattern, and roof-frame
    ornaments made from palm material or dried grass. A note proposes a crocodile
    derivation for part of the sun-and-vulva design. The passage also notes confusion
    between two fish names used as oaoa or clan-badges.'
  language: English
  quote_policy: summarized
literal_observations:
