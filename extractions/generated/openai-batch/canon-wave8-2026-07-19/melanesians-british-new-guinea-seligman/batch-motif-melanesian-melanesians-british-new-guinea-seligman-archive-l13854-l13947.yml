- id: obs:3
  text: Most carvings upon marea are described as dada, but some post carvings are
    said not to be daba at the present day and to be decorative when used on newly
    built marea.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: One recently made post design for Kevori marea was said to represent the sun
