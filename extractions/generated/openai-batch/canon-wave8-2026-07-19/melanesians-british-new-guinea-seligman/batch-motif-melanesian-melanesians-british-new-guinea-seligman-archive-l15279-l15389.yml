canonical_text:
  quote: ''
  summary: 'Ethnographic account of Roro marriage arrangements and ceremonies: marriage
    range, bride-price collection and negotiation, acceptance through shared areca
    nut chewing, redistribution of bride-price, a wedding-day mimic assault and bride
    capture, maternal lament, procession to the groom''s father''s house, public recognition
    of the marriage, and initial avoidance between bride and groom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro men generally married women from their own or other Roro villages, with
    some marriages to named neighboring groups and fewer to Mekeo; outside-tribe marriages
    are said to have become somewhat more common in later years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a youth is of marriageable age, his father asks members of his local
    group to help collect the bride-price for the son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bridegroom's father carries the bride-price with two or three companions
    to the house of the girl's father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride-price is laid on the verandah, and the bridegroom's party sits silently,
    leaving the next move to the girl's father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The offered gifts include shell ornaments or currency, birds of paradise feathers,
    dancing petticoats, and invariably a panicle of ripe areca nut.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl's family comes out, criticizes the presents, and avoids touching
    them before acceptance because touching would imply acquiescence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bargaining continues, with the bridegroom's people adding valuables until
    the girl's people are satisfied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: If the girl's family opposed the marriage, they could silently retire into
    the house, after which the boy's people would leave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the marriage is accepted, the girl's father heaps the bride-price, takes
    an areca nut from the bunch, splits it with his teeth, gives half to the bridegroom's
    father, and both men chew their halves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the shared chewing, relatives of the bride and bridegroom smoke and
    chew together, boast about pigs to be killed for the marriage, and discuss a possible
    fat dog for the feast.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: After the bridegroom's relatives leave, the bride's father distributes the
    bride-price among his relatives and members of his local group.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: On the wedding day, men from the bridegroom's local group, excluding the bridegroom,
    surround the girl's parents' house and take it by mimic assault with shouting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The bride runs away, is overtaken and caught, and defends herself with hands,
    feet, and teeth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: A sham fight occurs between adherents of the bride and adherents of the bridegroom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The bride's mother carries a wooden club or digging stick, strikes inanimate
    objects, curses the ravishers of her daughter, then collapses weeping; other women
    join the weeping.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The bride's mother is expected to maintain the appearance of extravagant grief
    for three days and does not accompany the bride to the father-in-law's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Members of both local groups form a procession with the bride; her kin give
    advice, her young female friends regret her future absence from dances, and disapproving
    relatives may refrain from joining.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: When the bridegroom sees the procession, he hides in the marea; his companions
    drag him out, paint and decorate him, and take him to his father's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The bridegroom is seated near the bride while onlookers call out that the
    named pair are married; the source notes this as formal tribal recognition of
    the marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: Bride and bridegroom do not attend to each other; that evening the bridegroom
    sleeps in the marea and the bride sleeps in her father-in-law's house.
  category: relationship
  evidence_refs:
  - ev:8
