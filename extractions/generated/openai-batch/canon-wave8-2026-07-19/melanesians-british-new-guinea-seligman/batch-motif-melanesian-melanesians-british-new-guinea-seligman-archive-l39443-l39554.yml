canonical_text:
  quote: "“take the bone to Tuma”"
  summary: The passage describes mourning rules, funeral feasts, burial procedures,
    bone removal and distribution, and the making or wearing of objects from human
    bones in several Northern Massim contexts, especially for paramount chiefs and
    at Kavatari.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Children do not cut hair, blacken their bodies, or abstain from food when
    their mother dies; a woman does not blacken or cut hair when a child dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: No outward signs of mourning are described for the death of a brother or sister,
    while the death of sisters’ children may involve blackening and possibly hair-cutting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a paramount chief’s death, village chiefs attend the burial and burial
    feast; chiefs of the deceased’s own totem bring yams, areca nut, and bananas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of other totems attending the feast do not bring food, and the dead
    man’s totem members do not partake of the feast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coconut palms are not destroyed in subject villages, but coconuts are cut
    down in the dead chief’s own village and nuts are thrown down from other trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead paramount chief is carried to the grave and buried in the same way
    as a commoner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Black mourning pigment is worn by subjects of the dead chief, except those
    belonging to his own clan, for about one month.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the death of a paramount chief, his father or sister’s husband removes
    bones from the arms and legs and perhaps some ribs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Removed bones are distributed to people of all totems except the dead chief’s
    totem; eligible village chiefs each receive one bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports a statement that distributed bones would be placed in
    a near relative’s grave, and that this relative would take the bone to Tuma; the
    author also records uncertainty because no evidence of such bone-burying was found
    by Mr Bellamy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some bones are reserved to make lime spatulae used ceremonially by the dead
    chief’s father, children, and sisters’ husbands.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A figured specimen is a lime spatula made from a humerus and collected in
    the Marshall Bennet Group.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The body of a paramount chief is placed in the grave in the early morning,
    lightly covered with planks and mats, removed after a few hours with more wailing,
    and may be placed and removed again before final placement around sundown.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After some time in the grave, the body is exhumed and the skull is made into
    a lime-pot by the deceased’s children, who may use it; widows may perhaps also
    use it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The corpse of a village chief is treated in the same manner as that of a paramount
    chief.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Bones from the first wife, brother, or son of a paramount chief may be removed
    by specified affinal or paternal relatives and made into lime spatulae.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: At Kavatari a man is buried on the morning after death; the following night
    the grave is opened and leg and forearm bones are removed by the dead man’s father
    or possibly sister’s husband.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: At Kavatari, the father, brother-in-law, and children place a man in the grave
    and make removed arm and leg bones into lime spatulae that only they may use ceremonially.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: At Kavatari, terminal finger or toe joints of a dead man are worn by his children,
    and in some cases the jaw is worn as a bracelet, though the scope of this custom
    is uncertain.
  category: object
  evidence_refs:
  - ev:11
- id: obs:20
  text: Children avoid food from their dead father’s village for some time after his
    death, but the author notes that his notes on this point are unsatisfactory.
  category: action
  evidence_refs:
  - ev:12
