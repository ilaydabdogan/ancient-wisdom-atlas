  taxonomy_refs:
  - sacred_exchange
  basis: At the paramount chief’s funeral, food offerings and participation are differentiated
    by totem affiliation, and chiefs of the dead man’s totem bring specified foods
    while not partaking of the feast.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy link to sacred exchange is broad; the passage presents social-ritual
