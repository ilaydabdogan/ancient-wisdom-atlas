comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the local mourning practice for a dead paramount
    chief with Kitava, stating that black mourning pigment is worn by subjects except
    those of the chief’s own clan.
  claim_level: same_function
  target: Kitava black mourning pigment custom
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the mourning-pigment rule is compared; the passage gives no wider
    Kitava burial description here.
- id: claim:2
  claim: The Kavatari account shows a similar funerary pattern in which graves are
    reopened, limb bones are removed, and the bones are made into lime spatulae for
    restricted ceremonial use by relatives.
  claim_level: same_motif
  target: Kavatari bone removal and lime-spatula practice compared with the earlier
    paramount-chief bone-spatula practice
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The earlier description centers on chiefs and their relatives, while
    the Kavatari section describes 'a man' and gives a different timing and set of
    officiating relatives.
- id: claim:3
  claim: The passage states that the corpse of a village chief is treated in the same
    manner as that of a paramount chief, suggesting shared chiefly mortuary treatment
    within the described setting.
  claim_level: same_function
  target: village-chief corpse treatment compared with paramount-chief corpse treatment
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The statement is brief and does not restate every procedure included
    in the paramount-chief description.
