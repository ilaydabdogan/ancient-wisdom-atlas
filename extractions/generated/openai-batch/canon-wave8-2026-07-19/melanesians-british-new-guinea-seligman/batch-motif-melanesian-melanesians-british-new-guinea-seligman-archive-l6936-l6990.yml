canonical_text:
  quote: ''
  summary: The passage gives two brief untranslated verse sections, then describes
    return visits by Toaripi people using lakatoi similar to Motu lakatoi. It reports
    seasonal canoe voyages carrying sago from Elema groups to Motuan villages, ritual
    conciliation of Avaralaru, god of the north-west wind, and a sea god before departure,
    and the presence of two sacred old men who accompany expeditions to appeal for
    safety. It closes by introducing a trading language used by Elema people and their
    visitors.
  language: English with untranslated vernacular lines
  quote_policy: summarized
