canonical_text:
  quote: ''
  summary: 'Ethnographic description of Wagawaga banahivi mourning feasts: preparation
    after a death, reciprocal food return called melum, distribution between the deceased''s
    gariauna and hamlets of the deceased''s totem, changing exchange relations among
    hamlets, clan concerns over children eating gariauna food, coconut taboo and its
    ending, and an observed Yabarawa feast involving a borrowed pig, conch-shell blowing,
    pig killing, and taro melum.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two to four weeks after a death, the dead man's family, including his father
    and widow, prepare the first banahivi feast using vegetable food from their gardens
    and the dead man's gardens; pigs belonging to them are killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the last banahivi, the remaining pigs belonging to the dead man must be
    slaughtered, and the dead man's coconut palms cease to be taboo.
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: Each banahivi is cooked by the widow and other people of her hamlet; those
    who fetch and eat it give a return present of food called melum.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a banahivi, half the food is placed in one heap for the gariauna of the
    deceased, and the other half goes to one hamlet of the dead man's totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Particular hamlets customarily exchanged banahivi; the passage says no reason
    was elicited for the practice.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eating banahivi could be extended from one particular hamlet of the dead man's
    totem to other hamlets of that totem, especially when the hamlets were closely
    related or recently split from a parent hamlet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The described exchange relations among named hamlets changed over time; one
    exchange between Yabarawa and Modewa ceased after Modewa failed to make an adequate
    return for a feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Part of the food of the gariauna might be given to small children, though
    wives might object that the children belonged to their clan and not their father's.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Banahivi occur at intervals of one or two months; after a particular feast,
    usually the third, a gwara taboo is placed on all coconuts in the dead man's hamlet,
    while property of his clansmen in other hamlets is unaffected.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The last banahivi, ten or twelve months after the first, is larger; ten or
    twelve pigs may be killed, all the dead man's coconuts are knocked down and hung
    on fences and cane strips, and the taboo ends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an observed Yabarawa banahivi, the dead man's sister provided a borrowed
    pig, the pig was brought with conch-shell blowing, killed and cut up, and its
    flesh with vegetables formed the banahivi fetched by people of the immigrant stock
    of Hehego.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the observed Yabarawa case, the people fetching the banahivi brought three
    pots of cooked taro as melum; some of it had to be eaten by the dead man's brothers
    and sisters.
  category: action
  evidence_refs:
  - ev:7
