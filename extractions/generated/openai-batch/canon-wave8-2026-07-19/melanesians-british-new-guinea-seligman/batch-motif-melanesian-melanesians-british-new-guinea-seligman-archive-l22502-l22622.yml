canonical_text:
  quote: ''
  summary: The passage contains the end of a snake story in which a community uses
    canoes and a waterless island to lure a snake out of a girl and kill him; the
    snake's pieces become reefs. It then gives the Wagawaga story of Hagwai, a boy
    also described as a cuscus, who is underfed, moves through trees, and turns into
    a cuscus, after which his ail kills the negligent wife. It begins another Wagawaga
    story in which jealous villagers trap a favored man in a bat cave by cutting the
    rattan; with two dogs and taro he survives until the dogs dig a tunnel, emerges
    weak, is found by an old woman after a dream, recovers, and secretly plans to
    poison the villagers' water.
  language: English
  quote_policy: summarized
