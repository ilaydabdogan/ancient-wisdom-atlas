canonical_text:
  quote: ''
  summary: The passage inventories objects from sorcerers' bags, including quartz,
    animal remains, bamboo cylinders, red paint, bone needles or pointers, netted
    bags, charm-stones, seeds, wood fragments, arrow fragments, and cassowary claws.
    It then describes cases in which leaves or other material called medicine were
    combined with bodily or personal traces taken from intended victims, and notes
    paired male and female charm-stones whose significance was not explained.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One inventoried sorcerer's bag or mahawa contained quartz, a large lizard
    jaw, a bird claw in a carved wooden case, bamboo cylinders, red paint, bone pointers
    or needles, cloth, netted bags, seeds, fragments of wood, and packets of medicine.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bag of another sorcerer, seized by the government, contained fragments
    of broken arrows and many cassowary claws.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that bone needles in one mahawa suggest some form of pointing
    magic, but says no information could be obtained about such sorcery or about most
    objects in the bag.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a Kevori case, an accused man admitted that leaves in a bamboo cylinder
    were medicine obtained from Oiyapu and used in sorcery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kevori accused admitted collecting fragments of sugar cane chewed and
    spat out by the prosecutor, placing them with the leaves, and expecting the prosecutor
    to suffer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same bamboo cylinder contained fibres from a woman's petticoat; the accused
    refused to explain them, while natives in court agreed they were intended to harm
    the woman from whose petticoat they came.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some smaller stones carried in a sorcerer's mahawa, especially water-worn
    vein quartz, were enclosed in tightly fitting nets, and paired stones could be
    called male and female.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author reports that no information could be obtained about the significance
    of assigning sex to the charm-stones or about how it affected their magical properties.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A cited account by Chalmers describes a sorcerer producing a net bag with
    two seeds, one associated with a clear crystal and shells and called male, the
    other unadorned and called female; they were said to be appealed to for death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Inawi case, one old man collected another man's faeces and asked Mangemange
    to treat them so that the source man would die; Mangemange refused and ordered
    the faeces returned to Inawi and thrown into the river.
  category: action
  evidence_refs:
  - ev:7
