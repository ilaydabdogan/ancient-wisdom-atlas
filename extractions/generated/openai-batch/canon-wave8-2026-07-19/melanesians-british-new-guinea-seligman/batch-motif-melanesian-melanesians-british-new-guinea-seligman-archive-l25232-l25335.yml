canonical_text:
  quote: ''
  summary: The passage lists clan names under Wamira and Wedau, includes a note on
    the Taubi people’s origin from Paiwa, and states that single clan-group members
    may not intermarry. It further states that at Wamira and Wedau only members of
    a dead man’s clan-group could eat the funeral feasts called banivi, and cautiously
    reports a similar clan-group restriction on eating the body of a man killed in
    revenge.
  language: English
