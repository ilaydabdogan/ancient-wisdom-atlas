canonical_text:
  quote: ''
  summary: 'The passage describes kinship duties and borrowing privileges: a boy receives
    his first perineal band from his maternal uncle and owes services; maternal uncles
    hold stronger authority than fathers or paternal uncles in the given example;
    reciprocal raimu kin and in-laws have specified borrowing and return rights; and
    a henamo friendship bond is noted as involving services discussed elsewhere.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy usually receives his first perineal band from his maternal uncle, called
    raimu, and owes him services in return.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When with his maternal uncle in a canoe, the younger man does most of the
    work and prepares and cooks food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On land, the younger man helps his maternal uncle with garden work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The younger man generally performs the same services for his mama, defined
    as father or paternal uncle, but the maternal uncle is said to exert more authority
    than any mama.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Ahuia's hiri example, a man or boy might refuse to accompany his father
    or paternal uncle but would go with his maternal uncle without demur.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: People who are reciprocally raimu freely borrow valuable articles, including
    nets or canoes, from each other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When borrowed property is returned between reciprocal raimu, any damage is
    mentioned, and the owner decides whether the borrower must make it good.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Men and women do not avoid their relations-in-law; waru and siba associate
    freely in houses and gardens.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Siba take food from each other's gardens and borrow each other's canoes or
    other property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Loans from a man to his sister-in-law are stated not to be part of the bride-price,
    because the articles are returned, including when borrowed by a woman from her
    son-in-law or brother-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man has an equal privilege regarding the property of his siba and waru.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ordinarily, borrowed property should be returned in good condition or repaired,
