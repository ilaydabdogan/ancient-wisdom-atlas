canonical_text:
  quote: ''
  summary: 'The passage describes Trobriand chieftainship and rank: Taolu''s authority
    after warfare and government intervention, the role of marriages, lineage, seniority,
    wealth, and fear of bwagau or poisoning, and the restricted chiefly rights to
    decorate houses and yam houses with carved boards and shells and to wear certain
    shell ornaments.'
  language: English
  quote_policy: summarized
