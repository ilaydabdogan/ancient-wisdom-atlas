canonical_text:
  quote: ''
  summary: 'Ethnographic passage on Wagawaga infancy and youth practices: newborn
    handling, first-born umbilical-cord placement in a banana plant, sipupu feasts
    for maternal uncles, maternal and paternal food/contact taboos, first-born food
    restrictions, treatment of twins, naming after kin or friends, name replacement
    by assumed names or nicknames, and a note on dead-name avoidance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Soon after birth, the infant's joints are extended and flexed, the head is
    stroked front to back, and the muscles are gently kneaded once; the passage says
    this is not apparently intended to alter head shape.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a first-born child, the fallen umbilical-cord stump is taken by the father
    or mother to the garden and placed in the sheath of a leaf near the base of a
    banana plant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the banana plant bears fruit, a sipupu feast is given to the child's
    maternal uncles; produce from that plant forms part of the feast, and sipupu feasts
    are held only for the first child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For at least a month after childbirth, the mother is restricted to boiled
    taro mixed with okioki fruit; after each sipupu, additional foods are added, and
    after two or three months she may eat fish and work in the garden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the case of a first-born child, the father stays in the potu7na for about
    six months and observes food taboos; violation of the taboos is said to cause
    the child's illness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father does not see the child for about its first month, avoids approaching
    his wife while she has the child, and does not touch the child until the mother
    has tied sapisapi shell-bead strings around the infant's wrists and above its
    elbows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sapisapi strings are described as a sign that the father may handle the
    child without its ceasing to thrive or becoming dangerously ill; this contact
    taboo applies only to a first-born child.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A first-born child is called halafwau, while other children are called halabeafa;
    the first-born child observes food taboos for several years.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Twins are generally regarded with disfavour, and former public opinion permitted
    the mother to suffocate one twin soon after birth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Children are named soon after birth, often after near relatives and friends;
    boys are commonly named after maternal uncles and girls after maternal aunts,
    but not after their mother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Naming a child after a friend is considered a compliment, and an adult may
    assume a friend's name as a sign of admiration or friendship, discarding the old
    name.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A birth name may be replaced by a nickname based on a physical peculiarity,
    and the original name may be remembered only by intimate friends and relations.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note from Bartle Bay says a father ordinarily does not touch his child until
    the umbilical cord has dropped off, does not travel before then, and later may
    nurse or swing the child while the mother is away; an unmarried woman must not
    nurse a first-born child unless she gives it a present.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A note says the names of the dead may not be mentioned before their surviving
    relatives, and that naming children after maternal uncles and aunts caused confusion
    and renaming when one of them died.
  category: relationship
  evidence_refs:
  - ev:12
