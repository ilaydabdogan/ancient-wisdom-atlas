canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking sorcery objects, including stones connected
    with seasons, sickness, death, and fertility; a secret quartz “death stone”; lay
    avoidance and fear of such objects; an account of charm stones causing fear during
    a boat journey and later being blamed for fever; reported beliefs and doubts about
    poison plants; and beliefs about human remains, including a prepared skull used
    as a charm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some stones are described as affecting seasons and producing plenty or scarcity;
    when a large stone fell during handling, incantations had to be repeated.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cup-like spongiole from a pandanus aerial root contained a carefully handled
    wrapped stone; it was paired with another stone, identified as female, and together
    the pair produced sickness and death.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cloth parcel contained a stone, two small stones in a net-bag, and another
    leaf-wrapped substance; these were said to bring children, were appealed to by
    barren people, and were not to be seen by women.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A large piece of clear quartz in a small net-bag was displayed in secrecy
    and called the death stone feared by the Maivians.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lay people were said to avoid touching or looking at sorcerers’ stones and
    other objects, because contact was feared as deadly or unlucky.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chalmers bought charm stones from Veata, and others warned that keeping them
    could make the boat sink, kill the travelers, or harm Motu.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A crew member refused to keep rowing after learning the charm stones were
    under his feet; during dark, bad weather the crew attributed the danger to Veata’s
    objects and wanted them thrown overboard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A later fever suffered by Chalmers was generally attributed to the charms
    bought from Veata.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author reports that careful inquiry found no evidence that Roro-speaking
    sorcerers knew vegetable or mineral poisons, and that toxic properties of jequirity
    were apparently unknown locally.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Despite lack of evidence, there was a common belief that sorcerers knew plants
    which caused illness or death; one plant was said to cause delirium and idiocy
    in repeated small doses or death in a large dose.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: People generally believed sorcerers tried to obtain freshly dead bodies for
    charm materials; the author heard only one specific report of a fresh-body part
    used in sorcery, a penis enclosed in clay as a love charm.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Skulls were used as charms, and one example was described as a young adult,
    probably female skull that had lain exposed in the jungle, with roots still intertwined
    in cranial cavities.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The prepared skull was mounted between split cane uprights and cross-pieces,
    with a cane-hoop framework covered in reddened bast supporting it on the occipital
    bone.
  category: object
  evidence_refs:
  - ev:13
