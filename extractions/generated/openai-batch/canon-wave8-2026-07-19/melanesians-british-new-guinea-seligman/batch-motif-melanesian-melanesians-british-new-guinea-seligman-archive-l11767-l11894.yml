  summary: The passage gives an ethnographic account of clan, settlement, and migration
    histories among Roro-speaking groups, including Paitana, Babiko, Bioto, Waima,
    and related settlements. It records clan derivations, offshoots, immigrant groups,
    water-bounded sites, a settlement split over a woman, and a new settlement formed
    after an older village was overwhelmed by a tidal wave.
