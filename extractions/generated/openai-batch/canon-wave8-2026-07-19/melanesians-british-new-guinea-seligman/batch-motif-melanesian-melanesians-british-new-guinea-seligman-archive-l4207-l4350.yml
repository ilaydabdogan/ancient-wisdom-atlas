literal_observations:
- id: obs:1
  text: The dubu is described as the structure around which much of village ceremonial
    life centered.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A typical dubu consists of an oblong rectangular platform supported by horizontals
    passing between opposite pairs of massive carved wooden uprights, with one upright
    at each corner.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The platform height is said to vary from 3 to 10 feet, and many old dubu had
    two platforms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Few Koita dubu were extant at the time described; many old dubu survived as
    charred remains or stick platforms, but some new dubu were built in 1904-1906.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each local group of an iduhu may have its own dubu in its proper village,
    and a dubu name is normally transferred to later replacement structures.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Different iduhu, including some that do not acknowledge relationship, may
    have dubu with the same name.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dubu is described as sacred in a limited sense, and spirits of the dead
    are supposed to resort to it at certain times.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dubu is the meeting place of men for serious matters, and the successful
    homicide formerly sat on it in newly won glory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women may not come on the dubu except during the tabu ceremonial, and even
    then access is limited to unmarried girls specially related to the master of the
    feast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The corner posts of each dubu are named and ranked; the front right post is
    called the most honourable.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each corner post and every plank of the dubu is hereditary property of a particular
    individual responsible for its upkeep, while the corner posts alone have ceremonial
    importance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Prestige attached to possession of the corner posts, and the owner or master
    of the left front post is said to have been regarded as second in the iduhu to
    the iduhu rohi.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: When several iduhu join to build one dubu, the corner posts may be allotted
    among dominant and other iduhu, and the common dubu may take the dominant iduhu's
    dubu name.
  category: sequence
  evidence_refs:
  - ev:7
