canonical_text:
  quote: ''
  summary: The passage gives an origin account and choreography for the Koita dance
    song maginogo. It says the ancestors of the Yarogaha and Gorobe sections inhabited
    a giant erimo tree near Nebira/Saddleback Hill; maginogo was invented inside the
    tree by Gorobe men, later exchanged so that it became Yarogaha property. It also
    describes the selection of bamboo staffs as accompaniment and the dance formation
    in two columns led by two men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the named songs mentioned to the author, maginogo was the only one for
    which an origin story could be obtained, and it is now regarded as the dance song
    of the Yarogaha section.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: According to legend, the ancestors of the Yarogaha and Gorobe sections of
    the Koita originally inhabited a giant erimo tree near Nebira, identified as Saddleback
    Hill, a few miles from Port Moresby.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within the tree, maginogo was invented by men of the Gorobe section, while
    the Yarogaha dance song at that time was called mada.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: 'The Yarogaha and Gorobe sections exchanged dances: mada came to belong to
    Gorobe, while maginogo became Yarogaha property.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Legend states that maginogo was sung inside the tree without accompaniment,
    but when danced outside, accompaniment was felt to be necessary.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Drums and sede were tried unsuccessfully, then two sticks were beaten together;
    after these failed, a Yarogaha suggested bamboo staffs, which proved satisfactory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The dance begins with two parallel columns, with men and women alternating
    as far as possible; in the observed performance more males than females took part.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two men identified as group A stand a few paces from one end of the columns
    and face them; the column dancers identified as group B stand at right angles
    to these men while facing each other.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Group A advances toward group B, group B moves sideways to meet them, and
    the two A men either split to pass up the sides of the columns or pass together
    between the columns.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The dancers follow the A man who initiates the movement until two columns
    reform; a half turn inward then restores two parallel columns facing each other.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a period of singing and stamping bamboos, terminal members from one
    end of the two columns, with some neighbours, pass inward and down the columns;
    the other dancers follow until two parallel lines are again formed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note says that the word mada has no meaning in Koita but in Motu signifies
    bandicoot.
  category: attribute
  evidence_refs:
  - ev:4
