  quote: ''
  summary: The passage describes Tata Ko, a Walma man regarded by Mou villagers as
    a dangerous sorcerer, and then outlines Roro-speaking distinctions among harmful
    sorcery, specialized beneficent magic, and minor everyday charms. It gives examples
    of hunting and crocodile-protection charms and notes hereditary training of departmental
    magical experts.
