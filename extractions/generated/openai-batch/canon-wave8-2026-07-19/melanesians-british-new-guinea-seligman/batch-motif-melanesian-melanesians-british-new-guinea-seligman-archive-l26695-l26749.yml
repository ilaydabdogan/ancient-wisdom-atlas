canonical_text:
  quote: ''
  summary: The passage describes work obligations, feasts, present distribution, chiefly
    and headman status, deferential conduct toward a gulau, restrictions around a
    gulau's property and lime pot, labor on a chief's garden, and prescribed portions
    of wild pig given to a gulau and taniwaga. The end of the excerpt contains plate
    captions for a house and carving at Maivara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bahada direct laralaraga in desired work, and after the work a bada may provide
    a feast for the laralaraga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a new canoe is made and launched, laralaraga take it to visit different
    places; people give presents, which are distributed among the canoe workers, while
    the bada retains some and gives some to his children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Babada expect laralaraga to help with garden work and house-building; the
    laralaraga do nearly all the house-building work, and a feast follows special
    work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each Gelaria clan is said to have a taniwaga or head man, and the taniwaga
    of clan Garuboi is said to be gulau of all Gelaria.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Yauyau, with the same applying to Wamira, a man does not come close to
    his gulau unless he wishes to speak, keeps some distance, and in passing may turn
    his face toward him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When speaking to a gulau, a man approaches with neck or body somewhat bent
    and speaks in a low voice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man does not touch the property of a gulau unless specially directed to
    do so.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A gulau does not eat in public and does not pass his lime pot to commoners;
    with other gulau he refers to the lime pot using an inclusive plural expression.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A taniwaga passes his gulau guardedly and does not look back or turn his head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Much of the heavy work of making a chief's garden is done by near relatives;
    the chief may stand and watch, while his wives also do their share of the labor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Other men assist with a chief's garden because it is said that their own gardens
    will be good if they do so; present custom also has the chief make a small feast
    for these helpers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A man who kills a wild pig presents his gulau with all or part of its head
    and a portion of flank or belly meat; his taniwaga also receives some flesh, but
    no special part is reserved for him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The excerpt includes plate captions naming a house at Maivara, Milne Bay,
    and a carving on a house at Maivara.
  category: object
  evidence_refs:
  - ev:7
