canonical_text:
  quote: ''
  summary: 'The passage describes chieftainship on Gawa and nearby Northern Massim
    islands: the fish-hawk totem chief is recognized as paramount chief of the island;
    chieftainship is hereditary; chiefs receive deference, food, labor, and larger
    feast portions; clan chiefs charm gardens using spells and crop-specific sticks;
    and authority in hamlets may also rest with senior family heads.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fish-hawk totem is described as the most important on Gawa, and its chief
    is recognized as chief of the whole island community.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The term for a chief is given as guyau and is applied to all clan chiefs,
    including Yoseli, who is both fish-hawk totem chief and island chief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chieftainship is described as strictly hereditary, passing first to a reigning
    chief's brothers and then to the sons of his sisters.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: People who were not clan chiefs approached Yoseli slowly, quietly, and in
    a stooping attitude, unlike their less formal approach to other clan chiefs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A clan chief receives deference and privileges, including fish from men of
    his own clan if he has none in his house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men of the paramount chief's clan clear bush for his garden, and clan members
    contribute seed yams and bananas and assist in planting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At inter-clan feasts, a clan chief receives a larger share of food than any
    commoner, except that members of the host clan do not eat the feast food.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Clan chiefs are said not to possess special weather powers, rain or wind charms,
    or the ability to guarantee a successful trading voyage.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Each clan chief is said to have the duty of charming his clan's gardens, receiving
    garden labor and presents of produce and fish in return.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Garden charming involves turning up ground with a long stick while muttering
    a spell, usually in three places, without putting medicine into the ground.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'Different woods are used as sticks for different crops: bus for sugar cane,
    kaiboga for bananas, tabarua for yams, and beawam for coconuts.'
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: For coconut planting, effectiveness is linked to the stick having previously
    rested in contact with a germinating coconut or young coconut palm.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that senior old men may hold authority as heads of families
    in hamlets, and informants sometimes spoke of them as though they were chiefs.
  category: relationship
  evidence_refs:
  - ev:13
