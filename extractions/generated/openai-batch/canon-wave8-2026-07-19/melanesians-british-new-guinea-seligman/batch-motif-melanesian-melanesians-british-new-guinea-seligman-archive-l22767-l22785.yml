canonical_text:
  quote: ''
  summary: At night, while everyone is in a cave, an old woman charms the cave walls
    so that the entrance closes. A child wakes and wants to go outside; his mother
    cannot find the opening and, by rekindling the fire, sees rock on every side.
    The trapped people are afraid and have only a small roof hole. An old man attributes
    the closure to the old woman's revenge for their greediness. Without food, the
    people die; the last old man asks boys outside for food, but they refuse, and
    he dies too.
  language: English
  quote_policy: summarized
