canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing preparations for a Motu/Koita lakatoi
    before the hiri voyage: night charming of the vessel, mast and sail construction,
    sacred handling of the anchor, clan-based naming and decoration, cowrie mast ornaments,
    and competitive trial sailings with singing, dancing, steering, and prescribed
    participation or absence of named specialists.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the asi are lashed together into a lakatoi, a night ceremony of charming
    is performed by a lakatoi sorcerer.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sorcerer burns a wild-plant root with pieces of cassowary claw and garfish
    snout in a potsherd, then uses the smoke to fumigate the gunwale of the asi associated
    with the doritauna and baditauna mats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same wild plant is also tied as green leaf parcels inside dry banana leaves
    and fixed in square gunwale holes where deck cross-beam lashings pass.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The charming and leaf parcels are stated to bring good luck and superior sailing
    powers to the lakatoi.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Masts are made from a mangrove-like tree growing near high-water mark in Port
    Moresby harbour, with roots retained and lashed to deck cross beams for stability.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Crabclaw-shaped sails are made in the village by sail captains from plaited
    mats sewn together and attached to long tapering mangrove poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each sail is measured during construction so that the two horns are equal
    in length.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lakatoi is moored or anchored from the end belonging to the doritauna.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The anchor is a large stone in heavy lashings, with a rattan cable; anchors
    are described as highly helaga.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the anchor is down, three men related to the doritauna watch the cable,
    and no one may step across the cable.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lakatoi names are assigned according to the iduhu of the baditauna and doritauna,
    with half-vessel naming when the two captains belong to iduhu with different lakatoi
    names.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lakatoi are decorated with pepe, specific iduhu clan badges belonging to the
    captains' iduhu; after the expedition the captains remove the pepe and hang them
    from ridge poles in front of their houses.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: A cane framework mounted with large white cowrie shells fits over the top
    of each mast.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Before departure, several Port Moresby lakatoi make competitive trial sailings
    across the harbour amid the sound of sede being beaten and singing voices.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Young girls dance vigorously on the projecting maramara platform at the temporary
    bow, while steersmen occupy the after platform with heavy steering oars.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The vessel reverses ends rather than going about in the usual manner, and
    the steersmen and girls change places accordingly.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: The baditauna, doritauna, and sail captains do not take part in the celebration;
