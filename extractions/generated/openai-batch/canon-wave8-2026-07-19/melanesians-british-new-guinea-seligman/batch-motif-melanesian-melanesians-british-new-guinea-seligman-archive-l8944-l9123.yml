canonical_text:
  quote: ''
  summary: 'The passage describes preparation and performance of the tabu feast around
    a dubu platform: food is piled on and around the structure; pigs are killed; hosts
    wash, decorate themselves, and eat; armed visitors enter at a conch signal; sugar-cane
    bearers deflect weapons; women and girls perform petticoat-swinging and yam presentation;
    hosts distribute yams, pork, bananas, and netted food bundles; dancing follows;
    and two smaller closing feasts are later held.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young trees are planted around the dubu, enclosed by sugar-cane palisades,
    and loaded with yams, bananas, coconuts, areca nuts, sugar cane, and fishing nets
    filled with food.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the morning of the feast, pigs are killed near the dubu, their flesh is
    piled on the platform, and the tabu biagu with his clansmen washes in the sea
    before painting, ornamenting, assembling on the dubu, and eating specially cooked
    pig flesh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Visitors from neighbouring villages wait in the bush and enter only after
    a conch shell called kibo is blown on the dubu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The entering visitors are armed and beat drums while brandishing spears and
    clubs; fighting at this stage is described as contrary to etiquette, though fights
    sometimes occurred in former times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Couples of men holding bundles of sugar cane knock down the spears and clubs
    of the entering visitors, after which continued hostile demonstrations are said
    not to be good form.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women swing their petticoats and carry a large yam in each hand, presenting
    the yams to the idichu rohi and other important men of the visiting villages.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Girls described as game, nana or roro to the tabu biaguna climb the dubu posts
    or capitals and swing their petticoats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The feast-giving men sit on the dubu while visitors enter; later they call
    the visiting women, descend, and fill the visitors' large string bags with yams
    in an act called gidu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The idtchu rohi and grown visiting men receive pieces of pork tied to bunches
    of bananas, lowered by rope as each recipient's name is called; the men do not
    take notice, and youths of their clan carry the presents away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Additional pork joints tied to lengths of fishing net containing yams are
    lowered by rope after each man's name is called three times; after every adult
    receives a share, women carry it back to the village and dancing begins.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Two smaller feasts follow the main tabu: one for the feast-giving clan''s
    men using reserved pig lower jaws on the dubu, and another on the tabu biaguna''s
    verandah after decorations and food supports are taken down and wild meat is obtained.'
  category: sequence
  evidence_refs:
  - ev:9
