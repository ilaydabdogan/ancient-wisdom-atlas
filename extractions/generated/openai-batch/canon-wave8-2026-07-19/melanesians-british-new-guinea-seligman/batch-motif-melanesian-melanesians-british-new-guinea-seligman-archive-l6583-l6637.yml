canonical_text:
  quote: ''
  summary: 'The passage describes customs observed at Port Moresby while lakatoi are
    absent: wives of baditauna/doritauna observe washing and food restrictions, work
    in husbands'' gardens, keep household arrangements, mark days with knots in fibre,
    hold tenth-day feasts, expect return after fifty days, and interpret bodily signs,
    dreams, and events aboard the lakatoi as good or bad omens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the lakatoi fleet's absence, the wives of the baditauna/doritauna refrain
    from washing themselves and observe the same food taboos as their husbands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each morning at sunrise the wives work in their husbands' gardens and return
    to the village earlier than the customary hour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the wives are in the gardens, a daughter or niece keeps the house doors
    shut and tends a fire that is not allowed to go out until the lakatoi return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A length of doi fibre is hung from a rafter, and one knot is tied in it for
    each day the lakatoi are absent; every tenth knot is specially marked.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On each tenth day a small feast called boioda is held, with food brought by
    relatives of the men who joined the crew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When food is brought for the boioda, men may enter the house but must eat
    on the verandah; only women may eat inside the house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wives of the baditauna and doritauna may visit one another's houses but
    may not enter any other house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After fifty days, when the fifth large knot has been tied, the return of the
    fleet is expected daily.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Twitchings or ticklings of the body, especially in the feet or hands, are
    treated as omens: right-side sensations are good signs and left-side sensations
    are bad omens.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dreams are taken to a sorcerer or sorceress for interpretation as good or
    bad omens.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: On the lakatoi, nocturnal seminal emissions are regarded as bad omens, and
    a baditauna or doritauna who experiences one tells the people aboard.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bad omen of a nocturnal seminal emission is counteracted by the man refraining
    for one or two nights from sleeping on his mat.
  category: sequence
  evidence_refs:
  - ev:8
