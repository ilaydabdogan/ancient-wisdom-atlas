canonical_text:
  quote: ''
  summary: 'The passage narrates episodes of warfare involving Koitabuan/Koltabuan,
    Douran, Kabadi, and Manumanu groups: an initial attack with killings, looting,
    burning, and attempted canoe withdrawal; pursuit and counterattack near Manumanu;
    rescue of some fugitives by chiefs or kin; child participation in killing and
    tattooing; and a later attack in which trusted messengers falsely announced peace
    before a massacre.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first episode, Koitabuan/Koltabuan men seized arms and shields, broke
    through the enemy, and left women and children behind; fifteen were killed in
    the rush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dourans and Kabadis killed women and children, then looted and burned before
    preparing to leave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The departing attackers embarked in canoes and, while moving upriver, engaged
    in horn-blowing, dancing, and singing until they encountered a Koitabuan canoe
    fleet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A strong south-east gale and heavy sea at the creek bar caused some canoes
    to get through, while others drifted and were abandoned.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Koitabuan pursuers and Manumanuans joined forces after messengers had warned
    Manumanu of the earlier killings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Seri and Taera, two young Manumanu chiefs, acted to save fugitives hidden
