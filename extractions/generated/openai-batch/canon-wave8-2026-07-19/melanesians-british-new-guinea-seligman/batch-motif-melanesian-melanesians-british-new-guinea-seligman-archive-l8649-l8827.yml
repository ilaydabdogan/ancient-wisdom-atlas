canonical_text:
  quote: ''
  summary: The passage describes the hekarai as a rare ceremonial series of feasts
    structured by friendly rivalry between two important men and their supporting
    iduhu groups. It details the opening challenge at a fire, reciprocal food-giving,
    erection of the geva for displaying bananas, night guarding of the display, feast
    piles, exchange of valuables, hunting for wallaby, adjudication by equal banana
    quantities, yam compensation, and visual comparison with lakatoi ceremonial equipment
    and decoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hekarai is described as a feast, or series of feasts, brought about by
    deliberate but friendly rivalry between two important men who can secure the assistance
    of their iduhu followers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ahuia is said to have recalled one hekarai, between Taubada and Hedu Ramika.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: One protagonist boasts that he has a better garden with more food than his
    rival.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the boast, the challenger descends from his house platform, sits on
    the ground in front of the house, makes a little fire, and smokes; he is called
    baditauna.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The challenged man watches for the challenger's action, comes to the fire,
    squats by it, and is called doritauna.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Adherents of both baditauna and doritauna gather with their leaders and all
    smoke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: For about six days, each rival gives food presents to the other whenever possible,
    and each is expected to return a similar quantity and kind as soon as possible.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The food presents are given and received politely and are eaten by the recipient
    and his family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A structure called geva is made from vertical poles along one side of the
    village street with horizontal poles lashed between them six or eight feet above
    the ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rivals collect as many bananas as possible from their own gardens and
    from the gardens of friends, and much of the village becomes divided into two
    opposing parties.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each side hangs bananas at one end of the geva, marks where its bananas end,
    and leaves the bananas on the geva for one or two days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Youths of each party watch their portion of the geva at night because opponents
    would otherwise remove bananas to their own section.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the feast, each rival gathers bananas and sugar cane into a large pile
    called tarirako at one end of the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The rivals exchange valuables such as toia, doa, and kiapa string bags, each
    attempting to meet and outdo the other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: No pigs are killed for this occasion; hunting parties bring in wallaby.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: If the two banana piles are judged even, the hekarai ends; if they are not
    even, further hekarai may be held until equal numbers of bananas are provided.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Large numbers of yams are also heaped by the rivals, and etiquette requires
    the man with fewer yams to later give enough yams to make up the difference.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: The discussion of Ahuia's drawings notes streamers resembling iduhu dagina
    and pepe displayed on lakatoi, and says another drawing shows men standing on
    the banana support.
  category: other
  evidence_refs:
  - ev:8
