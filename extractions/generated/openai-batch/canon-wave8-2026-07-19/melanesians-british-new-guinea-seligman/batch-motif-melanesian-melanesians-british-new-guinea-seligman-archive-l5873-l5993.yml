canonical_text:
  quote: ''
  summary: The legend tells how Edai Siabo of Boera is taken under water by the dirava
    Edai, instructed in building lakatoi and making the hiri voyage, revived and returned,
    then teaches Boera people to build, equip, sing for, and sail a lakatoi westward
    to barter pots for sago.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Edai Siabo lives at the Motu village of Boera and sails with other men to
    Bava and Idiha to catch turtle; after failing, he sleeps alone in the canoe while
    the others sleep ashore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Edai Siabo is described as varo biaguna, the master of the turtle net.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A being named Edai, of the kind called dirava, arises from the water, seizes
    Edai Siabo, and carries him under water to a cave among rocks that is his abode.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dirava says he has brought Edai Siabo there to tell him about lakatoi
    and says he may return after the instruction is complete.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dirava explains how lakatoi should be made and how a westward voyage in
    one could obtain sago for the season of scarcity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Edai Siabo's companions see his feet at the cave entrance, repeatedly dive
    down, and try to pull him out, while the dirava holds his shoulders until the
    teaching is finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After all has been told, the dirava allows the men to haul Edai Siabo to the
    surface; he is placed in the canoe, appears dead, and later opens his eyes and
    revives.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Edai Siabo tells his companions that the dirava Edai took him into a rock-cave
    and instructed him in making a lakatoi and in the hiri.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Boera, Edai Siabo builds a model lakatoi according to the spirit's instructions;
    it sails quickly, and he says the dirava taught him to make a big vessel and sail
    west for sago.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Edai Siabo explains how to lash canoes together, step the mast, make the sail,
    and related details; the people then build a lakatoi named Oalabada.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: A Koita brother-in-law of Edai Siabo tries to dissuade him from going west
    by pointing to bananas and yams available locally, but Edai Siabo remains stubborn.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The lakatoi is loaded with earthenware pots; when people want drums, Edai
    Siabo forbids drums on the vessel and instructs them to use bamboo sede instead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Men make and beat sede, pole the lakatoi through shallow water, and sing;
    Edai Siabo teaches the lakatoi song as the dirava Edai taught it to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The hiri voyagers sail west for many days to a large river-bank village, where
    people welcome them because they had not had pots for boiling sago; the pots are
    bartered for sago.
  category: sequence
  evidence_refs:
  - ev:8
