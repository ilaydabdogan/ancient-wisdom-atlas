canonical_text:
  quote: ''
  summary: The passage describes totemic muara spells used in fishing, fighting, and
    raiding; an origin story in which a shrimp and a frog give birth to clan totems
    and ancestors; Kubiri crocodile totemism with food offerings, subsidiary totems,
    and taboos; and Mukaua chiefly organization, hunting leadership, food exchange,
    game distribution, deference gestures, and burial practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each fish-totem has a named muara spell; during fishing the spell is used
    when a seen fish resembles the totem fish in appearance, movement, or color, and
    is expected to help the fisher catch successfully and spear straight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In fighting, the muara of the manubada fish-hawk is prayed so that the human
    spear will dart straight and pierce deeply like the bird descending on prey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a raid, the muara of the kisakisa hawk is repeated so the raider may seize
    spoil from the enemy as the hawk snatches meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A reported origin story says a shrimp and a frog held a jumping match; the
    shrimp, the better jumper, gave birth to the totems of one clan, while the frog
    gave birth to totems and ancestors of other Bogaboga clans.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Kubiri, the crocodile is a totem whose intercession is sought by
    placing food in rivers for it to eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The crocodile clan has subsidiary totems linked to the crocodile by shell-scale
    resemblance, by being eaten by crocodiles, by being a variety of taro, or by being
    a banana with the same name as the crocodile and used to feed it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Subsidiary totems may not be eaten, and in some cases may not be touched.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Mukaua, clan chiefs and a paramount chief discuss war, raids, and grave
    matters; the paramount chief voices the final decision, while clan chiefs decide
    the timing and amount of food for certain clan feasts.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hunting leaders are often appointed by clan chiefs; they arrange the meeting
    place, manage the hunt, divide the game, and a portion of game is given to chiefs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women or youths bend their bodies when passing chiefs talking together; chiefs
    and commoners are not distinguished in burial method.
  category: action
  evidence_refs:
  - ev:9
