canonical_text:
  quote: women may be chiefs.
  summary: The passage describes variation in village idubu or clubhouses, the relation
    of head men and chiefs to clubhouse posts and house placement, duties of loe kaima
    in feasting and repairs, names of Oroi idubu, and an example of female chiefly
    authority and succession through Kaloka and her son Naime.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The number of idubu varies by village: Alaala and Diumana are said to have
    one, Bokama two, and Oroi four.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Where there is only one idubu, the same name may serve for both the idubu
    and the clubhouse; Diumana's single name is given as Elevai.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each idubu had a head man, but one of these men was the head and chief of
    the village.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The head/chief of the village owned the right-hand front post of the clubhouse.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Diumana and Bokama the chief's house faced the front of the clubhouse;
    in Oroi, Alaala, and Lalime it was the house to the right of the clubhouse.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men called loe kaima were responsible for the upkeep of the loe, assigned
    food contributions for feasts, and supervised repairs when needed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The loe kaima are said to correspond to the diibii tauna of farther east.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Oroi idubu names supplied in the passage are Rumabada, Miakeni, Avoolana,
    and Uboolana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Although descent is commonly described as male-line, the reverse is sometimes
    reported in chiefly families, and women may be chiefs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kaloka is described as head of her clan, influential in Oroi, presented with
    the regulation bdtou, and made village constable by the Government.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: After Kaloka's death, her authority is expected to pass to her son Naime,
    who belongs to Kaloka's clan, Rumabada, rather than to his father's clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A note states that one of the posts was brought home and is now in the British
    Museum.
  category: object
  evidence_refs:
  - ev:5
