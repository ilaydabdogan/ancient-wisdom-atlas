canonical_text:
  quote: ''
  summary: The passage describes named taboo signs used for trees, gardens, firewood,
    game, and tracks. Some signs may carry magical sanction, while others operate
    through custom, elder approval, public discussion, or public opinion. Physical
    markers include knotted grass wisps, plaited leaves, sticks, creepers, felled
    trees, and broken branches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The general term for taboo applied to trees and garden produce is given as
    tora, with a Motu equivalent, and the coconut-tree sign requires consent from
    village elders after public discussion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bodibo, with a Motu equivalent, is described as a common single-tree taboo
    sign made from a loose knotted wisp of grass and a string tied around the trunk;
    older use involved magical ceremony and infringement could bring sickness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Garabi is described as an ordinary single-tree taboo sign made by plaiting
    coconut or sago leaves around the trunk, or by tying a single leaf around a small
    trunk.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bodibo and garabi may or may not be magically sanctioned, depending on the
    maker, but their protective effect is attributed chiefly to fear of infringing
    possible magical properties.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tora is an imposing sign placed beside a path or in a garden to protect coconut
    palms or garden produce; it is described as having no direct magical power but
    functioning as native law backed by elders and public opinion.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Water itself was not tabooed, though a tora could be placed near a water hole
    to taboo surrounding trees.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: A track to a new garden could be tabooed by two sticks, a creeper between
    them, and suspended bodibo wisps; a rough recognized method was also to fell a
    tree so that it blocked the road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Firewood could be tabooed with a grass wisp, while game left beside a track
    could be covered with broken branches or placed in a tree fork; these examples
    are described as lacking magical protection but still being respected.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage concludes that little or no difference in respect is shown between
    magically enforced property taboos and those backed only by custom or public opinion.
  category: relationship
  evidence_refs:
  - ev:9
