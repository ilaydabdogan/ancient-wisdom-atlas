canonical_text:
  quote: rurepo was formerly danced during the cutting up, cooking and eating of an
    enemy.
  summary: The passage describes dances at Wagawaga, Tubetube, and Bartle Bay. At
    Wagawaga men with drums formed a circle and one dancer leaped holding a drum overhead.
    A rehearsal of rurepo involved skulls mounted on sticks or canoe paddles, conch
    and drum accompaniment, jumping and stamping, and white face paint with a dark
    central line. Tubetube informants said dancing had ceased because a native teacher
    opposed it and took dancing feathers. Bartle Bay dances are described as often
    pantomimic and conventionalized, with a noted lizard dance, though walaga ceremony
    dances were said not to be pantomimic.
  language: English
  quote_policy: quoted
