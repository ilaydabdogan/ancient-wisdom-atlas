canonical_text:
  quote: ''
  summary: The passage describes Wagawaga and Tubetube practices of avoiding the names
    of deceased persons. The avoidance affects speech, personal naming, common vocabulary,
    object names, and substitutes or periphrases used after a death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, names of the dead become taboo immediately after death and may
    be dropped from common spoken language while memory of the person lasts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mentioning the name of a man's dead father or paternal uncle is described
    as a deadly insult, and mentioning a dead husband or wife before the surviving
    partner is described as particularly unfriendly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The name of the dead is especially avoided in the deceased person's hamlet,
    with less constraint away from possible relatives.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Because children are often named after a maternal uncle or aunt, the death
    of an eponym leads to name-changing for living namesakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Wagawaga, a new name after the death of an eponym is often the name of
    an object of common use, and when the person bearing that name dies, the object's
    name must be changed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Foreign words and pidgin-English words are used as substitute names for persons
    or objects whose names are avoided.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A custom called polo la replaces a word resembling a deceased person's name;
    a child or stranger who repeats the name may be corrected.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Tubetube, no man's name is mentioned after death, and naming after elder
    clansmen creates much name-changing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Mwakasoki example, the nickname, real name, associated song, pig's
    tusk term, and possible posthumous reference name are all affected by anticipated
    post-death avoidance.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
