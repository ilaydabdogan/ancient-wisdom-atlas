canonical_text:
  quote: The following species of non-human beings were believed to exist.
  summary: 'The passage notes a Taupota tree legend and a gloss of banaua as unusual,
    spiritual, or supernatural, then gives a Bartle Bay catalogue of non-human beings:
    Badabada, Yagarua/Yagarita, Taudombi, and Yoyo. It describes their bodies, habitats,
    behaviors, relations with humans, and, for Yoyo, an explanation of earthquakes
    and volcanic phenomena. It ends by reporting no cannibal beings except story ogres
    and no discovered garden or fertility agencies.'
  language: English
  quote_policy: quoted
