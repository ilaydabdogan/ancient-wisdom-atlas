canonical_text:
  quote: ''
  summary: 'The passage records a pregnancy and early-childhood cohabitation taboo
    at Wagawaga and Tubetube, then describes several ceremonial feasts: Ogatara feasts
    connected with war-party departure or surplus food redistribution, Hiwoga feasts
    connected with canoe building, and Tubetube soi feasts involving seasonal preparation,
    exchange procurement, dance, pig cutting, and distribution of food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga and Tubetube, cohabitation ceases when a woman becomes pregnant
    and is not to resume until the child can toddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ogatara is described as the name of a feast before a war party starts and
    also as the name of a non-war feast given by one hamlet to people from other hamlets.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A non-war Ogatara may be held when one hamlet has a surplus of a particular
    food item.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: For an Ogatara, a hamlet may build a platform called a watara and pile cooked
    vegetable food and areca nut panicles on it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Old men from the hamlets assemble on the watara to eat and chew areca, and
    visiting hamlets may receive areca nuts and vegetable food if enough remains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hiwoga is a small feast held when a canoe is to be built; the future canoe
    trunk is roughly shaped in the bush and dragged to the water's edge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: For Hiwoga, the future canoe owner kills a pig if possible, or otherwise provides
    vegetable food, with help from his hamlet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Hiwoga, food is laid on the beach near the canoe, a conch shell is blown
    as a signal, and people from other hamlets come to take shares of the food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The hamlet of the canoe owner eats none of the Hiwoga food, although its people
    help prepare the tree and canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: At Tubetube, the big feast called soi is held occasionally at irregular intervals
    and is said to occur during the south-east monsoon.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Before a soi, canoes go from Tubetube to friendly communities to buy pigs
    and vegetable food, paying largely with pots and also with currency items called
    benam and sapisapi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The night before the soi ceremony, a large dance is held for people from neighboring
    communities.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the day of the soi ceremony, pigs are killed and cut up on the nakanaka,
    around which the ground is covered with heaps of sprouting coconuts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Sprouting coconuts, pig flesh, and yams are distributed among visitors and
    men of Tubetube clans other than the clan giving the soi.
  category: action
  evidence_refs:
  - ev:5
