canonical_text:
  quote: ''
  summary: The passage describes postpartum seclusion, washing, afterbirth disposal,
    infant feeding, food taboos for mother and father, household support by the husband's
    sister, and delayed resumption of cohabitation after childbirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After childbirth, a woman is confined to the house for a period, but she goes
    into the sea to dispose of the afterbirth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reported seclusion is longer after a first birth than after later births,
    with suggested durations of about three weeks for a first child and ten to fourteen
    days for subsequent children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young mother is washed daily by her mother with hot water, and the vulva
    is cleaned over a large shallow open pot called nau.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Green banana leaves are worn under the petticoat to retain the lochia.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the puerperium, the husband's sister looks after the husband by fetching
    water and garden food and cooking for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband's sister also cooks for the young mother in different vessels
    but at the same fire, until the mother leaves the house without ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children are regularly suckled for twelve months or more, may receive occasional
    breast-feeding for another year, and are gradually given roasted ripe banana,
    vegetable food, small fish, and later pig or kangaroo flesh.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During puerperium, the woman must avoid foods forbidden during pregnancy,
    as well as large fish, pig, and kangaroo, with child illness given as the expected
    consequence of violation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: While his wife is secluded, the child's father must abstain from chewing betel
    and observe the same food taboos as his wife, with child illness given as the
    penalty for violation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father does not avoid the newborn child or stay away from the house; he
    lives in the house and may see the child as soon as it is born.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Cohabitation is not supposed to resume until the child can toddle; earlier
    resumption is said to cause the child to weaken, sicken, and perhaps die.
  category: action
  evidence_refs:
  - ev:7
