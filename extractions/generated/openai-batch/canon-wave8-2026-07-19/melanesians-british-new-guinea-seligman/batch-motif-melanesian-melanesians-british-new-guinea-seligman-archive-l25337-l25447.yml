canonical_text:
  quote: ''
  summary: The passage describes regional totemic arrangements involving linked bird,
    fish, snake, and often plant totems; discusses whether people are thought to share
    qualities of their totems; notes the absence of shrines or ceremonies for increasing
    totems; describes the use of a fish-hawk feather in a fishing float; gives examples
    of totem animals carved on objects, especially by Taumawai of Tubetube; and records
    a strong avoidance of naming dead paternal relatives, apparently connected with
    clan identity.
  language: English
  quote_policy: summarized
