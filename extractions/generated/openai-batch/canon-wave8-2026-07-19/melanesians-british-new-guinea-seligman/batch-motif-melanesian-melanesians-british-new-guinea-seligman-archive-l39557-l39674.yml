canonical_text:
  quote: ''
  summary: The passage describes mourning-name practices, temporary substitute terms
    for living relatives of the deceased, widow relocation and inheritance after death,
    and Marshall Bennett Islands mortuary practices. For Iwa, it reports burial by
    affinal kin, a feast, reopening the grave, removing and cleansing selected bones,
    keeping the skull in the widow and children's house, making long bones into ceremonial
    lime spatulae, and wearing the jawbone, vertebrae, and phalanges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that names of dead persons were not dropped from spoken
    language, and gives examples of a village chief speaking the names of dead relatives
    and a predecessor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mr Bellamy is reported as saying that there was some delicacy about speaking
    the names of the dead and that an exact relationship term might be used instead
    of the actual name.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain living near relations or connections of a deceased person were temporarily
    referred to by special terms after a death, with some terms lasting until remarriage
    or removal of black mourning pigment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man whose child or brother's child dies is said to lose his name and be
    called tomakapa during mourning; his wife is called namakapa.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One explanation given for the name observances was that the dead were in the
    habit of calling a person's name; one man also explained the practice in terms
    of being ashamed to hear names when the dead could no longer call them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A widow does not remain in her husband's house after his death but goes to
    the house of one of his relatives, if possible a brother or a sister's child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The dead man's house is not burnt, avoided, or allowed to rot, but passes
    to a brother or, if there is no brother, to a sister's child.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead man's garden property, yam houses, and many valuable personal goods
    are divided among his brothers, sisters, and sisters' children, while children
    may already have received property from him before death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For the Marshall Bennett Islands, the passage identifies removal of the skull
    and certain bones, keeping the skull, wearing bones, and making some limb bones
    into spatulae as a striking feature of funeral customs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage notes that burial in the hamlet or village was associated with
    these customs and had caused friction with the Government, and that information
    about treatment of the body was difficult and incomplete.
  category: setting
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:11
  text: At Iwa, a man's grave is dug by his lubai, described as relations-in-law including
    at least his mother-in-law and his wife's brothers and sisters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At or soon after burial, a feast is made by the mother, brothers, sisters,
    and sisters' children of the deceased and is said to be eaten by members of clans
    other than that of the dead man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The lubai and the widow open the grave and remove the skull, forearm bones,
    fibulae, and cervical vertebrae, then take them to the beach to be cleansed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After cleansing, the skull is given to the widow and children to keep in their
    house.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The lubai make long bones into spatulae and redden the blades to imitate spatulae
    actually used to convey lime to the mouth.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage states that these bone spatulae are not really used for lime because
    doing so would make the eaters' teeth fall out.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The reddening is done by chewing areca nut and lime, filling the mouth with
    red saliva, and lightly passing the spatula between wetted lips so that red coloring
    is deposited.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The dead man's jawbone is worn by his widow, while his vertebrae and phalanges
    are worn by his wife's brothers and his own children of both sexes.
  category: object
  evidence_refs:
  - ev:9
