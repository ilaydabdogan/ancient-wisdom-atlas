canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic account of sexual morality: sexual activity
    is described as acceptable unless it involves adultery, prohibited kinship relations,
    or social-custom restrictions; rape is said to be rare and, in one specified unmarried
    case, unpunished; adultery is treated as a serious offense that may lead to beating,
    expulsion, killing of a lover, inter-hamlet fighting, and compensation with shell
    ornaments. A footnote gives an example of a husband killing his wife in a rage
    and her kin demanding retaliatory payment before colonial authorities intervene.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that sexual acts were not considered reprehensible so long
    as they did not involve adultery or violate consanguinity or social custom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, within those limits, an unmarried girl before marriage
    might dispose of her person as she pleased.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rape or attempted rape is described as very rare, and an attempt by an unmarried
    man on an unmarried woman is said not to have been punished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Tubetube informant is reported as saying that the parents would not be angry
    and that people would laugh at the boy for acting when the girl did not want him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that most married women were considered faithful wives,
    while adultery was said to be becoming commoner under conditions where killing
    adulterers conflicted with Government law.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Colonial law is described as punishing adultery by fine or imprisonment, which
    the passage says seemed inadequate and cumbersome to local people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stated proper course for an unfaithful wife was to send her back to her
    parents' hamlet or to beat her, and in theory a husband had no right to kill her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a man did not send away an unfaithful wife, any child born to her was regarded
    and treated as his, even if he suspected the child was not his own.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A married woman's lover could be killed, even if he belonged to the same clan
    or hamlet as the aggrieved husband.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says a man might be killed for talking to another man's wife if
    he met her alone in the bush or on the seashore.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When an adulterer was killed, the injured husband is described as pursuing
    him openly, while the husband's hamlet turned out armed and fights between hamlets
    often followed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the adulterer was killed and his hamlet did not kill a man from the opposing
    hamlet, a vendetta usually did not begin because public opinion was against the
    adulterer and shell ornaments could atone for his death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The footnote describes a wife preparing food for a pig, a dog eating it, the
    wife throwing a stone at the dog, and the husband killing the wife with a pointed
    stick in a rage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the footnote, the woman's relations demanded payment by killing the husband,
    but he was instead handed over to the village constable for conveyance to Samarai.
  category: sequence
  evidence_refs:
  - ev:8
