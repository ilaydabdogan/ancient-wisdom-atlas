canonical_text:
  quote: ''
  summary: The passage describes Tokunu settlement totem affiliations, ceremonial
    platforms, and mortuary practices connected with the death of Agiatau of Wapuru.
    Coconuts displayed on the Wapuru platform mark taboo and supply a later funeral
    feast. The feast involves imported pigs, collected vegetable food, distribution
    by Kamtau, visitor eating, dancing, and abstention by specified relatives. Further
    rules prohibit eating food connected with a dead father and avoid naming the dead.
    The passage also records Murua cliff burials in limestone crevices, shelters,
    and caves, with cleaned bones, red-painted skulls and long bones, clay pots, and
    turtle-shell ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wapuru, Roguau, and Lasinawia are described as predominantly belonging to
    the frigate-bird totem, while Sipwararo belongs to the blue pigeon totem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Except for Lasinawia, each Tokunu settlement has a ceremonial platform called
    a nakanaka; in mixed-clan settlements the platform is said to belong to local
    representatives of the frigate-bird totem.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Wapuru nakanaka was covered with sprouting coconuts, surrounded by coconuts
    impaled on sticks, and decorated with a pendant row of white Ovulum ovum shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wapuru platform decoration was explained as being on account of the death
    of Agiatau, the principal man of the settlement.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The coconuts of Wapuru were to be preserved until the last funeral feast;
    the coconuts on the nakanaka served as a taboo sign for settlement coconuts and
    as a supply for the feast.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that at Tokunu only the coconuts of the dead man's settlement
    become taboo at his death, with a footnote caution that this may apply only to
    coconuts belonging to members of the dead man's totem in that settlement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sprouting coconuts on the Sipwararo nakanaka were explained as unrelated to
    Agiatau and intended for a feast at Murua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pigs for the Wapuru feast were to be brought from several distant islands,
    while vegetable food was to be collected by all Tokunu settlements and stored
    in Kamtau's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After pigs were killed, singed, washed, and taken to the nakanaka, the vegetable
    food was piled there, and Kamtau distributed pork and vegetables by calling each
    person by name.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Visitors ate some or all of the pork, and dancing continued through the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: No one of the dead man's clan partakes of the funeral feast, and the deceased's
    sons-in-law and their children also abstain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man may not eat pig from his dead father's settlement or coconuts, yams,
    and bananas from his dead father's garden; infringement is said to cause swelling
    of the belly and face and death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The same food rule applies to the dead man's brothers' children, and everyone
    avoided mentioning the names of the dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Cliff burials between Suloga and Wanai Bay occur among sharp limestone pinnacles
    with crevices, hollows, shallow rock shelters, and caves.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Many shelters and caves contained human bones that had apparently been scraped
    clean before placement there.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: The smaller bones of the extremities were generally absent, while scapulae,
    pelvic bones, larger long bones, and skulls were most numerous.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Many skulls and some long bones had been painted red in part.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:18
  text: Bones of more than one individual were often contained in large clay pots
    identified as coming from Kwatota in the Amphlett Group; some pots had small round
    holes.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:19
  text: One skull had large turtle-shell ornaments removed from the zygoma.
  category: object
  evidence_refs:
  - ev:10
