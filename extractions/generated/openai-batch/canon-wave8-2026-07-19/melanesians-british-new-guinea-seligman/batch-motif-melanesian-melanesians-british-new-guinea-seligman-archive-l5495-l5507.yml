canonical_text:
  quote: ''
  summary: 'The passage describes women''s relation to land: women are said not to
    own land, but daughters may use and cultivate a share of their father''s land;
    their children may garden there with kin permission; a married orphan raised by
    maternal relatives may cultivate and keep produce from part of her father''s land;
    land is not used as dowry or adultery-price payment; widow customs are referred
    elsewhere.'
