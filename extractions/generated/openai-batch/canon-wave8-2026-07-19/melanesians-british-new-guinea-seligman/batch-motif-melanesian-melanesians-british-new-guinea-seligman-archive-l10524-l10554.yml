  text: Pieces of mullet may be added to the dogs' food mixture because the fish jump
    “quick and strong,” qualities said to be desirable especially for cassowary hunting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ahula reports that the use of some charm barks was learned from men of the
    Papuan Gulf, and that many such barks come from there; a valuable object may be
    paid for a small piece of bark.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Stones removed from the stomach of the Goura pigeon, and stones said to come
