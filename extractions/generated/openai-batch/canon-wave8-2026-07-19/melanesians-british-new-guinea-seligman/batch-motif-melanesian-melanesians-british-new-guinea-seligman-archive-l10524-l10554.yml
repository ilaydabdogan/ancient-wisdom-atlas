canonical_text:
  quote: ''
  summary: 'The passage describes several hunting charms: pungent bark scrapings fed
    to dogs, mullet added for desired qualities, stomach stones used on dogs'' teeth,
    a pig bone worn while hunting pigs, and charcoal face-blackening before wallaby
    hunting. It also reports that some bark charms were learned from and acquired
    through Papuan Gulf contacts.'
  language: English
  quote_policy: summarized
