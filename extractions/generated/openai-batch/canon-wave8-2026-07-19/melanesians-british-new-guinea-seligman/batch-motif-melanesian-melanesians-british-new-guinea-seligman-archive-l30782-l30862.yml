  summary: The passage describes Tubetube sea-going trading voyages by waga, including
    craft suitability, wind and seasonal travel, daily harbor planning, island-based
    navigation, storm response, and routes to Murua, Basilaki, the mainland, Salaoni,
    and Milne Bay.
