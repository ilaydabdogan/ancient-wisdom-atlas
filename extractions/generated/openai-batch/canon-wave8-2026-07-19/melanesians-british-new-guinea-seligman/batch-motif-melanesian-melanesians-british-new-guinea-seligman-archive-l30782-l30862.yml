literal_observations:
- id: obs:1
  text: Waga are described as sea-going craft intended for offshore and deep-water
    voyages and built to suit their expected work.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that shipwrecks were so rare that the oldest inhabitants
    could not remember one.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tubetube seamen tried to depart with a fair wind and could also work the waga
    to windward, though slowly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Crews arranged itineraries so as to make a harbor every evening, though they
    sometimes spent a night at sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night they did not sail by the stars; in clear weather they used visible
    land for guidance, and in thick darkness they lay to until daylight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During sudden north-west monsoon storms, if no haven was available, crews
    lowered sail, kept the waga head to the sea, and rode out the storm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Under favorable conditions the longest voyages to Duau and Murua could be
    made in four days, but the Murua voyage could take two or three weeks because
    of weather, business, or pleasure at ports.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The trade route to Murua is described as about 120 to 135 miles, with overnight
    stages at Ore, Panamoti, Tokunu, and then Murua if weather allowed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Basilaki could be reached from Tubetube in about a day; from there routes
    continued by coasting to Sariba, Rogea, the mainland, Suau, or north by Salaoni
    toward Milne Bay.
  category: sequence
  evidence_refs:
  - ev:8
