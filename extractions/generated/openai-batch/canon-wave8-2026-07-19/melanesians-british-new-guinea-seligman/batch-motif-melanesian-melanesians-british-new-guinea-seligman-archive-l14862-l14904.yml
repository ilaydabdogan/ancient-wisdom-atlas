canonical_text:
  quote: ''
  summary: The passage describes the status of boys after assuming the itaburi and
    before or during puberty, including the terms miori, ibitoe ibitoe, and ibitoe.
    It lists rules and restrictions concerning sleeping place, movement through the
    village, eating, labor obligations, subsistence, dance preparation, drum-making,
    seclusion from women, food and drink restrictions, and penalties associated with
    taboo-breaking during drum-making.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy who has assumed the itaburi is still called miori until or just before
    puberty, when at Roro he is called ibitoe ibitoe; as puberty advances he becomes
    an ibitoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ibitoe may still take part in childish games, but spends less time on them
    as puberty advances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An ibitoe should stop sleeping in his father's house and use the marea instead.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Except when dancing, an ibitoe should not use the open space between houses
    that forms the main village street, but should enter or leave by the clear space
    behind the houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ibitoe must not be seen eating by members of the opposite sex and generally
    do not eat with or in the presence of married men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ibitoe are expected to obey their clan chief during major fishing, hunting,
    or bush-clearing operations, and may assist in building the marea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In theory ibitoe should obtain food for themselves from the bush and sea;
    in practice they catch fish and also make small raids on gardens and houses if
    not caught in the act.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dancing and preparation for dancing are important in the life of an ibitoe,
    and many make their own drums.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: While making drums, usually in groups of three or four, ibitoe must live in
    the bush and avoid being seen by women.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Many foods are forbidden to ibitoe during drum-making; they may drink only
    water found in banana-leaf axils or coconut milk.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the drum hollow is charred and scraped into shape, ibitoe should avoid
    contact with fresh water, or the embers used for charring will refuse to glow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Their food must be cooked in a small pot called eiei; otherwise they will
    become too stout to dance well.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: If one of them eats fish, a fishbone will puncture the tympanum of the taboo-breaker's
    drum.
  category: sequence
  evidence_refs:
  - ev:7
