canonical_text:
  quote: ''
  summary: 'The passage describes Wamira and Wedau totemism: the term dariaua is applied
    to ogres, totems, and white men; certain animals or birds may be spoken of as
    ancestors and avoided as food or prey; Irlkl people share fowl, dove, and poisonous
    snake totems; descent is matrilineal and exogamous; Gelaria clans receive maimaitua
    totems from the snake Garuboi, who separated humankind into clans; and a list
    of Wamira and Wedau clans records linked bird, fish, snake, animal, tree, and
    sun totems.'
  language: English
  quote_policy: summarized
