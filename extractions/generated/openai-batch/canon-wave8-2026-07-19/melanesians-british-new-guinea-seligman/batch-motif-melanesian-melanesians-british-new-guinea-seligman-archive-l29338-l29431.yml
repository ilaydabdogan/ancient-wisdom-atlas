canonical_text:
  quote: ''
  summary: The passage describes marriage restrictions at Wagawaga and Tubetube. Wagawaga
    formerly prohibited marriage within one’s own clan-group and into one’s father’s
    clan, with the example of Ipunesa showing required marriage outside his hamlet-group.
    It also notes consanguinity and affinal restrictions, later changes, and a reported
    Buhutu contrast. Tubetube rules are described as similarly prohibiting marriage
    within the clan and father’s clan, with named non-marriageable categories based
    on kinship and totem, and with specified limits on permitted consanguineous marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, former rules prohibited a man or woman from marrying a member
    of the same clan-group or a member of the father’s clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ipunesa, described as a man of Modewa clan, could not marry into Modewa, Hurana,
    or Garuboi, and therefore would formerly have had to marry outside his own hamlet-group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, consanguinity was a further marriage limitation, and the passage
    says third cousins seemed not to be allowed to marry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Wagawaga, a man might not marry his wife’s sister, even as a widower, and
    might not marry his brother’s widow.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports that Buhutu bushmen would marry their wives’ sisters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the time described as present, Wagawaga clan-group restrictions had broken
    down, but same-clan marriage, marriage into the father’s clan, and consanguinity
    restrictions were still observed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage notes present-day sexual connection between people who could not
    marry, and says this existed to some extent before white influence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Tubetube, as at Wagawaga, no man marries within the clan or into his father’s
    clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For Tubetube, the passage states that no evidence was elicited for a former
    dual or multiple grouping of clans, so no comparison with Wagawaga can be made
    in that respect.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Rev. J. T. Field’s account lists three Tubetube classes of non-marriageable
    persons: Natunatuleia, Karidiatupuana, and Kariianasa.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Natunatuleia includes those related as Natu and Nubai; Karidiatupuana, glossed
    as “part of the womb,” includes those related as Game, Du, Kava/Katia, and Tubu;
    Kariianasa includes those of the same totem, connected under toto, a term glossed
    as brotherhood.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: All others outside the named non-marriageable Tubetube categories are called
    Kasoriegogoli, meaning marriageable.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: At Tubetube, the nearest permitted consanguineous marriage is between children
    of Nubaili in the third generation, but grandchildren of two sisters cannot intermarry.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Tubetube, grandchildren of two brothers can marry grandchildren of two
    sisters if they do not belong to the same totem.
  category: relationship
  evidence_refs:
  - ev:6
