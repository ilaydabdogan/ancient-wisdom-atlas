canonical_text:
  quote: ''
  summary: The passage describes Koita and Motu village division into patrilineal
    iduhu, lists iduhu names and glosses for sections of the eastern Koita, and explains
    local iduhu extinction, absorption, settler incorporation, and garden-land access.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The inhabitants of every Koita village, and also the Motu, are divided into
    groups called iduhu, within which descent is counted in the male line.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists iduhu names composing sections of the eastern moiety of
    the Koita, including names glossed as well or spring, banana, crab, river, hill,
    and other place or descriptive terms.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: A local group of an iduhu can become extinct without every male member dying,
    because a greatly reduced iduhu may be absorbed into a stronger iduhu.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: In Hohodai village, Vaiau and Tupa are described as absorbed into Dubara iduhu,
    although some men born Vaiau or Tupa were still living.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: An individual or group settling in a village where their own iduhu was not
    represented could, after a time, assume the iduhu of immediate neighbours with
    whom they had friendly relations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Taubada reported that Amago's parents, originally Badili, assumed Tupa in
    one village and later were considered Dubara at Hohodai because they built beside
    Dubara houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: New-comers needed to identify with one of the established iduhu before they
    would usually be permitted to take up land and make gardens.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: New-comers formally identified with an iduhu were not limited to that iduhu's
    garden land; men formerly of Tupa, then part of Dubara, made gardens on Dubara,
    Taurama, and Vaiau land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: No meaning was obtained for the iduhu name Vaiau, while Tupa is explained
    as roasted blocks of the interior of the sago palm eaten in scarcity.
  category: object
  evidence_refs:
  - ev:9
