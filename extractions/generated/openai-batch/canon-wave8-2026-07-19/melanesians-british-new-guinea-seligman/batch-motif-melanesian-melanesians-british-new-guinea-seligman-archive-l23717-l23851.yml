canonical_text:
  quote: ''
  summary: The passage continues a tale in which a hungry hag tries to reach children
    in a tree, is repeatedly injured after following the eldest child's misleading
    instructions, and is later killed by the children's father. The father burns the
    houses, departs by canoe with the children, throws two children overboard in a
    dangerous sea, and then drowns with the eldest. A new tale begins in which a boa
    constrictor bears a human-looking daughter who steals garden food, is caught by
    a man, becomes his wife, bears a son, and warns her husband not to fear if her
    mother comes.
  language: English
  quote_policy: summarized
