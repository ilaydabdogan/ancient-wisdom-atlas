canonical_text:
  quote: Here again the jackass laughed and they moved to Nara
  summary: The passage recounts movements and dispersals among Afai-related Mekeo
    groups, including a reported animal-laughter episode before migration, repeated
    clan splittings attributed chiefly to factional conflict, seizure of settlement
    land by stronger neighbours, and a case in which land was accepted as blood-price
    after a killing under ceremonial restraint connected with mourning rites. It then
    explains why Inawi was selected for study and lists its pangua, including immigrant
    groups.
  language: English
  quote_policy: quoted
