canonical_text:
  quote: ''
  summary: The passage describes Seligman's account of religious ideas and non-human
    beings among Wagawaga and Tubetube communities. It notes an absence of discovered
    cults of a superior being, heavenly bodies, ancestors, or personal relations with
    spiritual beings, while recording belief in many mythical or non-human beings.
    Several named classes are described, including tree-dwelling, swamp-dwelling,
    mourning-associated, and shy canoe-using beings, with varying degrees of harmlessness
    or malevolence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator reports no discovered cult of a superior being or heavenly bodies
    and no definite cult of ancestors or spirits of the dead, though shades at Milne
    Bay and Bartle Bay were said to know when certain feasts were held.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that an idea of essential similarity between men, animals,
    and perhaps trees appears in folk tales from Wagawaga, Taupota, and Awaiama.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage distinguishes many mythical beings, often ogre-like and malevolent,
    from other generally harmless non-human beings that seemed to be regarded as races
    or species capable of perpetuating their kind.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Niatagaigai are said to live among tree branches, to be male or female, and
    to include females with one large and one small breast.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Niatagaigai are not regarded as hurtful; when people are ill, they appear
    and push fingers into the patient's flesh to determine whether the patient will
    recover or die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Matabiri are said to live in swamps and mangroves, to be male and female,
    and to have huge protuberant bellies and swollen cheeks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Matabiri are described as malevolent beings that put 'medicine' on sleeping
    people, after which the belly and face swell and the person dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wagawaga bariaua are tree-dwelling harmless beings, shy of being seen by humans,
    and unable to make sea-going craft, so they borrow mortal canoes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A story says two Wagawaga bariaua borrowed a small dugout canoe, fished all
    night, fled when seen by Burea at dawn, left fish and a net in the canoe, and
    later recovered the net, while no misfortune followed the eating of their fish.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tubetube karawatoniga are said to live in the bush or among rocks near the
    seashore, to be harmless, and to be most often seen after a death when mourning
    wailing attracts them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Karawatoniga are described as human in form and colour, visible only to some
    people, breeding and dying like mankind, and wearing long ringlets associated
    with Tubetube mourning custom.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tubetube susukaikaigeda are said to be male and female, shorter than humans,
    excessively pot-bellied, one-breasted, harmless, born and dying like humans, and
    living in wet and swampy places where they move by day.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tubetube bariaua live within trunks of large old trees but are not regarded
