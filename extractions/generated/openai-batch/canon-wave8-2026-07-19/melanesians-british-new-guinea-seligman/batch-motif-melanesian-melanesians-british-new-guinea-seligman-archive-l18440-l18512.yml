canonical_text:
  quote: ''
  summary: The passage describes ngove as men’s clubhouses belonging to particular
    ikupu or family groups. It explains their construction, hereditary rights of chiefs
    or head-men to build and maintain them, examples of named ngove, occasional elevation
    on very tall piles to counter sorcery, exclusion of women, overnight use by puberty-age
    lads, widowers, and guests, and their similarity to but lesser ceremonial status
    than ufu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each village contains multiple ngove, described as houses of usual size, sometimes
    on especially high piles but often outwardly like ordinary dwellings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each ngove is a men’s clubhouse, but use is limited to the ikupu or family
    group that built it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every chief and each head-man of an ikupu may build a ngove; the men of the
    ikupu participate in building it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The recognized head of the ikupu has the hereditary right to build the ngove,
