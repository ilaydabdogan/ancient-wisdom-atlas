canonical_text:
  quote: ''
  summary: The passage describes feared, unesteemed people of both sexes said to have
    magical powers outside regular magical practitioners. One woman was consulted
    when a Wamira irrigation trench failed to carry water; she bathed in the trench
    while repeating spells and reportedly worked the clay sides, after which water
    flowed and she was paid mother-of-pearl shells. A second example from Wagawaga
    describes a love charm made from hurawa tree bark and coconut, roasted in a leaf
    and applied as juice to the face of a sleeping desired person, causing that person
    to fall in love. A final fragment mentions an assumption about a woman drinking
    from a canal after a water man used an incantation, but the context is unclear.
  language: English
  quote_policy: summarized
