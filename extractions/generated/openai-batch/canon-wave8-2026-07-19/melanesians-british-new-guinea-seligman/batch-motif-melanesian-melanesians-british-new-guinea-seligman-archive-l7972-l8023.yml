canonical_text:
  quote: ''
  summary: 'The passage describes practices concerning a person who has killed another:
    blood is left to dry on the weapon; the killer bathes, returns home, remains secluded
    as aina, avoids women, and uses a bone fork for eating. After about a week he
    lives briefly in a bush shelter, makes a new sihi, participates in a bago dance
    and a dubu gathering, returns home, and ceases to be aina. The passage also records
    homicide tattoos and ornaments that vary with the victim''s sex, a belief that
    a blood-splashed killer wastes as the victim''s corpse rots, and a footnote comparing
    aina to Motu helaga.'
  language: English
  quote_policy: summarized
