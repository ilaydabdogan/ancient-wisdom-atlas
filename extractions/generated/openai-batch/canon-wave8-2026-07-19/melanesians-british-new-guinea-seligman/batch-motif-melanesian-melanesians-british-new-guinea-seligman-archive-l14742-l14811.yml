canonical_text:
  quote: ''
  summary: The passage describes Roro childhood customs concerning personal names,
    naming after kin, friends, foster-mothers, adopters, and natural features; possible
    effects of early adoption on clan and rank; late weaning; and childhood ear and
    nose piercing without ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roro names are derived from animals, plants, and natural features, and may
    be given to girls or boys.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person has no obligation to avoid eating or injuring the plant or animal
    after which they are named.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children are named when young and usually receive two names; the second is
    the father's first name, and the first may be from a relative or from an animal,
    plant, or natural feature pleasing to the parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Choosing a friend's name is considered a compliment, and the friend would
    also be honored if the name were given to a favorite pig.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A child may bear the father's names in inverted order; the passage states
    that name-changing does not occur and that nicknames are not used among the Roro.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman from another clan, connected by marriage, tended a seriously ill mother
    during childbirth and suckled the child for the first days; in gratitude, the
    child was given the foster-mother's name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A name may be agreed before birth, including the name of a dead kinsman, and
    an adopted child may take the adopter's name if the arrangement is made before
    birth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: With early adoption, a child may assume the adoptive father's clan, and if
    the man is a chief the child may assume his rank like an actual descendant.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children are weaned comparatively late and receive vegetable and fish food
    before being weaned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children's ears are pierced at about six to eight years old, and the septum
    of the nose is pierced one or two years later; the operations have no ceremony.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Piercing is performed with a stout thorn; blood is washed away with water,
    and rolls of leaves are inserted into the wounds to keep them open.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A boy called miori from babyhood remains called miori after his ears and nose
    have been pierced.
  category: attribute
  evidence_refs:
  - ev:7
