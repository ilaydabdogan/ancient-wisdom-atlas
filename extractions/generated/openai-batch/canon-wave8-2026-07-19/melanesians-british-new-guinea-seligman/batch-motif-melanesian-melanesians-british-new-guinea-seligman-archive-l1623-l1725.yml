literal_observations:
- id: obs:1
  text: The passage says some northern Massim chiefs or socially trusted men were
    observed as belonging to a tall, long-faced physical type, and that chieftainship
    there can command respect and authority.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Northern Massim islanders are said to share with Louisiades inhabitants the
    craft of building large sea-going canoes called waga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Massim decorative art is described as highly expressed in carved prow ornaments
    for waga and in patterns on Trobriand lime gourds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many Massim dwellings are arranged in scattered hamlets whose members are
    usually close blood relatives of one clan and whose hamlets have names and autonomy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some hamlets may leave a community and settle elsewhere, including on islands
    thirty or forty miles away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage identifies matrilineal descent and a distinctive form of totemism
    as a characteristic Massim cultural feature.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Clan totems are usually a linked series from different classes of living organisms,
    ordinarily a bird, fish, snake, and plant, with possible additions or omissions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Toward the north-western borders of the district, the linked totem series
    is said to disappear in some places, rocks may be added to totem lists, and some
    lists may reduce to one or two totems.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The totem snake is described as especially important in some instances and
    may be regarded as creator of the world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bird totem is described as especially important over much of the Massim
    area, including in common questions about a stranger’s bird and in men naming
    their bird totem when asked for their totem.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Exogamy is said to be strictly observed, and older rules discouraged sexual
    or close social contact with women of a man’s father’s totem, though the passage
    says such rules had relaxed.
  category: relationship
  evidence_refs:
  - ev:6
