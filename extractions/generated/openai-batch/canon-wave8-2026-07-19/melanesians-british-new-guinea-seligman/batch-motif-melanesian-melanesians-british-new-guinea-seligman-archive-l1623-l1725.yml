  summary: The passage describes northern Massim social and physical observations,
    sea-going canoe craft, scattered hamlet organization, matrilineal clan totemism
    with linked totems, local variation in totem lists, special importance of snake
    and bird totems, and rules of exogamy and father’s-totem avoidance.
