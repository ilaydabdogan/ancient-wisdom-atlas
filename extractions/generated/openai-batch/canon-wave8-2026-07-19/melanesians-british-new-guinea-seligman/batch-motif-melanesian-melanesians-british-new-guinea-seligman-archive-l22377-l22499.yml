canonical_text:
  quote: ''
  summary: 'The passage recounts three etiological narratives: fire is recovered from
    the burning tail of the snake Garubuiye and distributed through village firebrands
    that become totems; the first coconut palm grows from a woman''s severed head,
    and coconut oil use is established and later spread by Pwakua, a bird/man who
    steals and distributes nuts; a large underground snake, Sinerogusi Sarasara, pursues
    a girl who has unknowingly eaten its eggs and enters her body. The last narrative
    is incomplete in the supplied passage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snake named Garubuiye lives in a hole in a pandanus tree, and its tail burns
    like a torch; heavy rain puts out surrounding fire but not the snake's tail.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys pull Garubuiye from the pandanus, break off the glowing tail, light a
    large pile of wood from it, and people from villages take fire home with different
    kinds of wood as brands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The trees from which different groups take their firebrands become their totems.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first coconut story, a woman catches fish by removing her head and
    placing it in shallow seawater so fish swim into it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man secretly watches the woman, throws her detached head into the scrub
    behind the beach, and the woman dies when she cannot find it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman's head sprouts where it falls and grows into a coconut palm whose
    nuts are initially full of blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Charcoal does not remove the blood from opened coconuts, but sprinkling them
    with lime and drying them in the sun makes the blood disappear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man scrapes and squeezes coconut meat with water, pours the juice over
    cooked food, and the passage says people have used coconut oil this way since
    then.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pwakua smells scraped coconut, finds the island where it is kept, steals a
    nut, takes it to Nada, and plants it in a clearing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the planted coconut grows, Pwakua returns to the source island, takes
    many ripe nuts, gives them to the people of Nada, and teaches them how to plant
    and tend the trees.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note explains that Pwakua could be either a man or a bird as he wished and
    was also a totem north of East Cape.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: A large snake named Sinerogusi Sarasara lives beneath the ground.
  category: setting
  evidence_refs:
