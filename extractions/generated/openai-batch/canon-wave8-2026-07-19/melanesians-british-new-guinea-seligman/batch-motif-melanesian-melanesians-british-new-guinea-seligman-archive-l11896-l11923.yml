  quote: Kevori furnished colonies to Waima
  summary: 'The passage describes settlement and clan relations among Roro-speaking
    groups: Kevori is said to have supplied colonies to Waima; Korina and Taroba are
    recent colonies from Kevori; Ereere and Arabure are described with possible Kevori
    connections; Bereina is organized into named itsubu across nearby settlements;
    and Kevori is divided into bush and coast groups, with Kevori Kone described as
    a younger settlement derived from Kevori Gunikai.'
