canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Waima paiha war functions: two male paiha
    chiefs with official autai titles lead a war party in right and left positions;
    two related paiha women accompany them and are considered necessary; the chiefs
    chew autai bark, ritually treat men with a topi plant part, carry charms into
    battle, and may receive presents to turn a private quarrel into a communal affair.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rohi Aihi took precedence over Naime Miria in paiha matters, and both had
    official titles applying only to their paiha functions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Autai is described as the name of a bark that, when eaten, makes people 'talk
    plenty'; chewing it by paiha chiefs appears as a preliminary to fighting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Waima attacked another community, the line of battle was led by the autai
    pakana and the autai irina, who were always men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two paiha women, related to the paiha chiefs, walked behind the two male leaders
    and were said not to be afraid because they were paiha.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ovia awarina, described as war chiefs, followed the paiha women, and the
    tuari, the bulk of the war party, followed them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The autai pakana led on the right and was supposed to make the frontal attack,
    while the autai irina stood on the left and was connected with reserve, flank
    attacks, or cutting off retreat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two paiha women were said to be necessary and essential to a war party;
    they danced on the way, did not fight, and if they ran away the men would follow
    them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Aiva Ikupu was attached to Rohi Aihi, the autai pakana; Poni Biri was attached
    to Naime Miria, the autai irina.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage gives distant kinship links between each paiha woman and the paiha
    chief with whom she was officially connected.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The paiha chiefs ritually treated their men before an attack with part of
    the leafy axis of the topi plant.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The paiha chiefs carried charms into battle, including leaves, fragments of
    bark from certain trees, and pieces of broken weapons.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Formerly, presents could be made to paiha chiefs to induce them to take up
    a private quarrel and make it a communal affair.
  category: action
  evidence_refs:
  - ev:12
