  quote: the general rule is that the animal providing the kangakanga may be killed
    but not eaten
  summary: The passage describes kangakanga as clan-badges derived from ornaments,
    shell armlets, animals, or plants; it records food restrictions and clan consequences,
    several explanations for particular badges, legends about the fowl/cock badge
    and Ururi Kefe, and the wearing of badge materials or representations in dancing.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A kangakanga can be constituted by a special arrangement of ornaments normally
    worn singly, including combinations of kefe turtle-shell ornaments and Conus shell
    armlets worn on one arm.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states a general rule that an animal providing a kangakanga may
    be killed but not eaten, while also giving clan-specific exceptions and variations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a person forbidden to eat the animal or plant associated with a kangakanga
    commits the offence, harm is said to affect both the wrongdoer and other clan
    members; examples include unsuccessful hunting and deaths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Married women eat the animals from which their husbands' kangakanga are derived,
    and husbands may give them flesh from such animals; men take no special precaution
    against handling the dead body of their kangakanga animal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The origin and significance of kangakanga are described as unclear to the
    people consulted, though they are called old-time fashion and may in some cases
    be less ancient than iauafangai.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The men of Amoamo are said to have selected the palm funguka as their kangakanga
    because of the strength and toughness of its wood.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the cock/fowl origin story, the fowl and megapode lived together in the
    bush; the fowl stopped protecting its eggs, other animals ate them, the birds
    moved nearer villages for protection, and men adopted a special arrangement of
    their feathers as kangakanga.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: One kangakanga involving the palm im'du refers to a particular two-headed
    individual plant, selected because of its striking and uncommon peculiarity.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A legend explains kefe and auau ornaments as kangakanga by saying that a woman
    at loiovina gave birth to a girl named Ururi Kefe, who was born with armshells
    on her arms and kefe on her head, arms, and legs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When a kangakanga is derived from an animal or plant, clan members wear a
    definite part or representation of the animal or plant as a badge while dancing;
    examples include feather representations and the sword of the swordfish worn in
    the hair.
  category: action
  evidence_refs:
  - ev:10
