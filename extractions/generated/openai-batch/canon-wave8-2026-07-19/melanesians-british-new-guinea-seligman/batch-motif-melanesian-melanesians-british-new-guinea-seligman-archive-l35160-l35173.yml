  summary: 'The passage describes present-day burial practices at Tubetube: graves
    lie irregularly scattered in a sea-facing area at the northern corner of the island;
    hamlet burial areas have no obvious visible divisions but are known locally; burial
    usually occurs on the morning after death, with timing adjusted according to whether
    death occurs at night or in the morning.'
