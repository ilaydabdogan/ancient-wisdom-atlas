canonical_text:
  quote: ''
  summary: Ethnographic passage describing Koita and Motu courtship visits, female-initiated
    marriage proposals, betrothal tattooing, formal areca-nut presentations, kin discussion
    and chewing, collection of bride price, and a pre-marriage V-shaped tattoo mark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koita and Motu unmarried girls are described as free to receive lovers at
    night in their parents' houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The favored boy waits until the house is quiet and the fire is low, enters
    quietly, speaks in low tones, and is expected to leave before daylight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the boy oversleeps, the consequence described is mild teasing, and marriage
    is not treated as an immediate obligation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Betrothal begins when the couple decides to marry; the proposal is said always
    to come from the girl during the night meeting.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A boy who does not wish to marry assents at the time but later sends a friend,
    usually his henamo, to communicate refusal; the girl usually stops receiving his
    visits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Once betrothed, the girl's torso region from navel level to the breasts is
    tattooed with the same pattern among Koita and Motu; a woman accustomed to tattooing
    may officiate and receives food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: During betrothal the boy gives the girl small presents of tobacco and areca
    nut and is expected to make similar small gifts to her relatives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The boy formally announces his wish to marry by sending the girl's brother
    a panicle of areca nuts with pepper and lime through his own brother or sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The girl's brother asks his sister whether he should eat the nuts; if she
    assents, he convenes relatives, distributes the nuts, and the marriage is discussed
    while people chew.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:10
  text: The nuts may be returned if general disapproval is expressed, but the passage
    says this apparently does not happen in practice unless the marriage is to occur.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A second, usually larger, present of areca nuts and pepper follows; if sufficient
    nuts are unavailable, sago may be substituted for the girl's family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The bridegroom collects the bride price, called damu or Motu dava, from near
    relatives and the wider iduhu, borrowing from friends of other iduhu if necessary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage gives examples of bride-price valuables, including armshells,
    toia, pigs, dog's teeth, hatchets, and bush knives.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Shortly before marriage, or once the date is fixed, a V-shaped mark called
    gado is tattooed on the bride-elect.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the boy is ready to receive his bride, he sends his mother, or his sister
    if his mother is dead, to tell the bride's mother.
  category: sequence
  evidence_refs:
  - ev:6
