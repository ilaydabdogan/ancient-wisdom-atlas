literal_observations:
- id: obs:1
  text: At Wagawaga, a dangerously ill man in the potuma is usually moved to a child's
    house, or otherwise to a brother's or sister's house, and is tended by members
    of the hamlet that later eats the funeral feasts called banahivi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Wagawaga dying man is supported in a sitting position by his wife, children,
    or brothers' and sisters' children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After death at Wagawaga, the corpse is propped in the middle of the house;
    the brother cuts off the wapa for preservation in a later toreha ceremony; relatives
    paint the face and add clothing or ornaments according to the deceased's sex and
    possessions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wailing begins as soon as a man or woman is dead, without regard to the deceased
    person's clan or clan-group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Wagawaga, a man's grave is dug by his sisters' children, or by men of his
    clan if they are absent; a woman's grave is dug by her brothers or, failing them,
    by her sisters' children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Wagawaga grave contains a mat at the bottom, the body in a squatting posture,
    canoe planks arranged as a small chamber around the body, one or two mats above,
    and earth over all.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a body is removed for burial, it is placed in a canoe and taken to its
    destination; the ail of the deceased act as bearers when the canoe arrives and
    are then called gariauna in funeral and mourning customs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the grave edge, the gariauna remove ornaments from the body and keep them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Wagawaga body is placed in the grave facing east with the hands under
    the chin; the stated reason is that otherwise the dead person or spirit would
    not be able to reach Hiyoyoa, the other world.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the funeral, the gariauna, widow, and children bathe in the sea; the
    gariauna then cut down three to five of the dead person's coconut trees, and follow
    temporary food and drink restrictions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After bathing, a widow and children shave their heads and may move hamlets
    according to the deceased's residence and sex.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Tubetube, clansmen visit a sick man, bring small food gifts, and sit by
    him; a medicine man may be summoned and paid regardless of the illness's outcome.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At Tubetube, a dying man is propped in a squatting position with his hands
    in his lap by his wife, first-born child, or mother, and this posture is retained
    after death until burial.
  category: action
  evidence_refs:
  - ev:11
