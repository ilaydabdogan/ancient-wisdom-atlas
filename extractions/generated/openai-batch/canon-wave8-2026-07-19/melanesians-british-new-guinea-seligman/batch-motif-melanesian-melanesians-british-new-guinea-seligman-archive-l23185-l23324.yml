  - ev:8
  confidence: medium
  cautions: The available taxonomy has no exact forbidden-path category; the departure
    reference is approximate.
- id: motif:6
  label: dangerous cave nurse kills infant through excessive handling
  taxonomy_refs:
  - cave
  basis: Taumudukoro lives in a rocky cave, eagerly snatches the baby to nurse, and
    hugs and smells it until it bleeds and dies.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The text says Taumudukoro loves nursing young children; it does not frame
