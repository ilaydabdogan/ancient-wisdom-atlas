candidate_motifs:
- id: motif:1
  label: self-destruction by crocodile with uncatchable floating head
  taxonomy_refs: []
  basis: The girl deliberately throws herself to a crocodile after discarding valuables
    and clothing, and her head later floats but cannot be retrieved.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The accompanying note says crocodiles are not usually associated with
    suicide, so the crocodile should not be generalized as a local suicide symbol
    without further evidence.
- id: motif:2
  label: virgin birth from anomalous mother
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: The woman conceives without cohabitation, and the editor’s note explicitly
    calls the episode a virgin birth.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames the mother as a monstrosity in the note; it does not
    state that the birth is sacred in a doctrinal sense.
- id: motif:3
  label: hidden child in tree
  taxonomy_refs:
  - miraculous_child
  - sacred_tree_axis
  basis: The child born without cohabitation is hidden in a hole in a tree and receives
    food there.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The tree is a hiding place in the literal narrative; any axis or sacred-tree
    reading is tentative.
- id: motif:4
  label: serpent-human husband discovered in tree
  taxonomy_refs:
  - serpent
  basis: A long snake’s neck emerges for food, but inside the tree the girls find
    a handsome youth who becomes their husband.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not explicitly describe a transformation, only the coexistence
    of snake-like and human descriptions.
- id: motif:5
  label: warning against forbidden path ignored
  taxonomy_refs:
  - departure
  basis: The mother-in-law identifies the safe well-worn path and the dangerous overgrown
