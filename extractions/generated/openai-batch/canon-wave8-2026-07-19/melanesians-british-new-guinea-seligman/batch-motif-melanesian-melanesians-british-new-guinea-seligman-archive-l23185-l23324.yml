canonical_text:
  quote: ''
  summary: 'The passage ends one story in which a girl gives ornaments, her dog, and
    clothing to a crocodile before throwing herself to it; her floating head cannot
    be caught. It then gives the Taupota tale of Taumudukoro: a mouthless woman conceives
    without cohabitation, hides her child in a tree, gains a mouth through pain, and
    later her son is discovered as both snake-like and a handsome youth who marries
    two women. One wife with a baby takes a forbidden overgrown path to the cave of
    the prickly Taumudukoro, who nurses the child to death. The snake husband later
    sends the young mother diving for a giant clam, which traps and kills her. A following
    tale begins with Buimoremore enchanters and a mother warning that burning coconut
    husks will summon her own mother to take the newborn.'
  language: English
  quote_policy: summarized
