canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of funeral preparation, burial
    by the gariauuna, grave construction, handling of ornaments and disturbed bones,
    and post-funeral coconut-tree cutting and food taboos among the described community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sister closes the corpse's eyes; if no sister is available, a brother performs
    this act and holds the dead man's legs while flexing them into position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wailing begins directly after death and continues for some hours.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body is decorated with armshells, a shell-disc necklace, a nose ornament,
    black face paint, a new perineal bandage, and turtle-shell earrings with sapisapi
    discs; the pubic hair is not shaved or pulled out.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Specified kin perform the toilette: the brother puts on the perineal bandage
    and dresses the hair, while the children place the nose ornament, neck ornaments,
    and armshells.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning the body is placed on a nabanabwau litter, supported in a sitting
    posture, and carried to the grave.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grave is dug by the dead man's sisters' sons, called game and known during
    the rites as gariauuna; four should officiate, and substitutes are chosen by same-totem
    relationship if necessary.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The gariauuna are not painted, wear no special dress, and do not wail or sing;
    they are followed by people of their totem and friends, while the dead man's children
    do not follow the corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gariauuna dig the grave with a new digging stick freshly cut in the bush,
    loosen soil before removing it by hand, make the grave four to five feet deep,
    fence it against pigs, and put a mat at the bottom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The body is wrapped in a daam mat, passed down into the grave, placed squatting,
    and held by a stick under the chin fixed into the sides of the grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before burial the corpse's armshells, samakupa, and wanepa are removed, wrapped
    in a daam mat, left in the deceased's house, and become the property of the gariauuna,
    who wear them without purification.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The gariauuna build a roofed cell over the body with sticks, mats, coconut
    leaves, and other materials; a strong fence is built around the grave, and the
    broken digging sticks are incorporated into it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Formerly, some graves had chamber-like superstructures with hanging mats and
    a central ridge, where the gariauuna could sit; old examples still existed in
    some Rogea hamlets.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: If earlier buried bones are disturbed while digging a new grave, they are
    rolled in a daam mat and reinterred beside the new occupant; a second recent death
    leads to an adjoining grave rather than reopening the same one.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Immediately after the funeral, a brother, son, game, or bara of the deceased
    may cut down two or three of the deceased's coconut trees, and the gariauuna may
    eat the nuts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The deceased's other coconut trees are not yet tabooed for brothers, sisters,
    and other relatives, but children do not eat pig, coconuts, or nearby garden produce
    from the dead father's hamlet; distant garden produce is exempt.
  category: relationship
  evidence_refs:
  - ev:9
