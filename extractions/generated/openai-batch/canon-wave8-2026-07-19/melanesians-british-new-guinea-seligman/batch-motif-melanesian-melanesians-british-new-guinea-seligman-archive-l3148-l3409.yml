canonical_text:
  quote: ''
  summary: The passage describes Koita village distribution, sections, hostilities,
    and eastern/western groupings. It reports a Motu-told origin story involving two
    named ancestors who came from the earth with a female dog, their children, sibling
    marriage, and dispersal of descendants. It also gives eastern Koita origin traditions
    from Koma and Idu, including ancestors emerging from a large erimo tree and dead
    shades returning to hill Idu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koita villages are described as scattered along the coastal Central Division
    from Pari to Manumanu, with Koita territory extending from Taurama to the borders
    of Nara.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Koita are divided into named sections, some named after their villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Namura is described as an extinct Koita section whose people were exterminated
    shortly before annexation by repeated attacks of eastern sections.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author treats Koita settlements as eastern and western moieties because
    hostility between those groups was constant, while noting that informants did
    not state that they recognized such dual grouping.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that his information about the Koita as a whole specifically
    represents eastern-moiety views.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Motu-told story reported by Chalmers says two ancestors named Kirimaikulu
    and Kirimaikape came from the earth with one female dog, which they took unto
    themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Motu-told story, a son, a daughter, another son, and another daughter
    were born; the first son and daughter grew up, married, and had fourteen children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the same story, two descendants went inland and became progenitors of the
    Koiari, two went inland from the coast by the Laroge and became progenitors of
    the Koitapu, and the others went to Elema.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Koma and Idu are given as birthplaces of the eastern Koita sections.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: At Koma, on the northern bank of the Laloki river, a huge erimo tree contained
    the ancestors of the Gorobe and Yarogaha sections; when they emerged, they crossed
    the Laloki and built a village on Nebira.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Badili, Hohodai, and Yawai are said to have originally come from hill Idu,
    to which the shades of their dead still return.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Hohodai section is said to have left Idu and then built, deserted, and
    shifted among several village sites, including Borimana, Ela beach, Motu Motu,
    Tauerina, and Koko.
  category: sequence
  evidence_refs:
  - ev:6
