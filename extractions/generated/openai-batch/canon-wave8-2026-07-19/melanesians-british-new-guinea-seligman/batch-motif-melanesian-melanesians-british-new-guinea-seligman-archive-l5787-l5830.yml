canonical_text:
  quote: ''
  summary: The passage describes former Koita markets at Yarokasaka, exchange between
    Gaseri and Koita groups, the carrying of spears and risk of killing or revenge
    at markets, a safe messenger protocol during anticipated trouble, Koita salt-making,
    and credit/debt practices including tahutahu pig borrowing for a tabu feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Markets called wotogo by the Koita are no longer held and are said never to
    have been very important in the Koita economy.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A former market was held at Yarokasaka near the junction of the Goldie and
    Laloki rivers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The market participants named in the passage were the Gaseri and certain Koita
    villages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Gaseri brought bananas, yams, taro, and wallaby flesh to exchange for
    fish and salt from the Koita.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The market occurred at irregular intervals, and one party could send a message
    saying they would come to Yarokasaka in two or three days prepared to trade.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Spears were taken and carried at the market, and trouble sometimes led to
    a man being killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a killing, the aggrieved tribe might seek revenge either immediately
    or at a later market.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When trouble was expected, the tribe that had killed a man could send a messenger
    to the other tribe, choosing someone not connected with the family against whom
    there was a blood debt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The messenger went directly to a clan chief's house, stated the reason for
    coming, and was considered safe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Informants stated that Koita people formerly made salt by evaporating salt
    water in shallow pots or fragments of larger pots in the sun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Credit was freely given in most transactions and was said to be seldom abused.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: For tahutahu, the borrowing of pigs for the tabu feast, a lender could sleep
    one night in the borrower's house to press for repayment without verbally demanding
    the pig.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the lender slept in the borrower's house, the borrower was expected
    to make strong efforts to repay, even by borrowing from someone else; interest
    or usury is said not to exist.
  category: sequence
  evidence_refs:
  - ev:9
