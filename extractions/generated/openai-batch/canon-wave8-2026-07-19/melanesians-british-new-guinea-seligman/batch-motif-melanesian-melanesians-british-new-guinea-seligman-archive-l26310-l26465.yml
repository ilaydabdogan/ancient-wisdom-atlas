canonical_text:
  quote: ''
  summary: 'The passage reports ethnographic information about Wedau and Gelaria clan
    totems: clan-totem lists, explanations of the totems'' purpose, food and injury
    restrictions, relations with dog and bird totems, a war-strength stone, avoidance
    of totem snakes, clan recognition and restraint in battle, and restrictions connected
    with a father''s totem and clan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists Gelaria clans named Garuboi, Girimoa, and Elewa and gives
    totems including a constrictor snake, pigeon, hornbill, pig, and dog.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gelaria informants agreed that the great snake Garuboi ordained and distributed
    the totems.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Reported explanations for totems included clan signs to prevent clan incest
    and an undefined affinity or shared material between a clan and its totem animal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clan descent is reported as taking place in the female line, and members of
    the same clan might not intermarry.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man was reported not to eat the flesh of his totem animals, though in some
    cases he might kill them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Garuboi man said that if he injured a hornbill, the hornbill would be sorry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Elewa man would not eat dog; dogs were said not to bite him even in strange
    hamlets; Elewa men buried dead dogs, gave dogs the same food they ate, and believed
    their dogs helped them more than other dogs helped their owners.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other examples include a Logaloga man killing and wearing red parrot feathers
    but not eating the bird; an Ianibolanai man not killing or eating the monitor
    lizard but using its skin for a drum; an Iaronai man keeping but not eating white
    pigs; and a Lavarata man not collecting or burning Modewa wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Warorovuna is described as a stone whose pieces were boiled, with the water
    drunk to give strength in war, and this was given only to allies.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same Warorovuna stone is said to be on the ground near where enemies'
    skulls were placed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man would go round his totem snake on the road to avoid touching it, and
    if he saw a dead garuboi he would feel sorry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In battle a man would not throw spears at men of his clan, but would turn
    aside to another part of the fight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a man killed one of his own clan in battle, he would be reproached, but
    it would be taken as an accident and no further action would be done.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A man would not eat or injure his father's totem; if it were a snake he would
    avoid it and likely be frightened, while believing it would not hurt him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage states that a man might not marry into his father's clan.
  category: relationship
  evidence_refs:
  - ev:10
