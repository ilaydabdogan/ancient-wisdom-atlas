literal_observations:
- id: obs:1
  text: The average fleet size for several years is stated as twenty lakatoi.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists villages that equip lakatoi, including Hanuabada, Elevara,
    Tanabada, Borebada, Boera, Lealea, Manumanu, Tatana, Vabukori, and Pari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: All listed lakatoi-equipping villages are said to make pots except Vabukori,
    whose people buy pots from other villages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vabukori people exchange strings of ageva for pots, with one string of ageva
    buying about twelve pots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tatana formerly had to obtain pots from Port Moresby; its women are gradually
    acquiring the craft, but most pots taken west by Tatana lakatoi are still bought
    with ageva made by Tatana people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The average number of men going in a lakatoi is stated as twenty-nine.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In 1885, four Port Moresby lakatoi reportedly carried an average of 1,628
    pots each.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In 1903, the Kwaradubuna iduhu equipped a lakatoi named Bogebada, made of
    four asi and carrying 1,294 pots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author calculates that if twenty lakatoi sailed in that year and each
    consisted of four asi, the total number of pots taken was 25,920.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Kwaradubuna lakatoi also carried 57 toia, 2 mairi, 8 tautau, trade tobacco,
    and other imported articles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the return voyage, the vessel consisted of ten asi, and its sago cargo
    is estimated at about twenty-five tons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ageva are defined in a note as pierced reddish shell discs made from the lip
    of a marine bivalve, with Tatana and Vabukori named as the only Motu-district
    villages making them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A note states that Motu women make pots in seven named shapes or sizes and
