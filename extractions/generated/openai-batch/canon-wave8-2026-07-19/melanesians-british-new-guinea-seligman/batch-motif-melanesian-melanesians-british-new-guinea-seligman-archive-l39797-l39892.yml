canonical_text:
  quote: ''
  summary: 'The passage describes mourning and burial practices, especially at Kwaiawata:
    kin make or remove mourning ornaments; widows, widowers, and children are washed
    at the shore to end mourning; specified relatives retrieve, bury, and feast after
    a death; selected bones are removed, cleaned, kept, worn, made into spatulae,
    and eventually deposited on rock platforms, rock shelters, or a shallow cave above
    the shore.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead woman's sister is described as responsible for making Calamus ornaments
    and giving them to a male mourner; the passage also states that a woman's skull
    and bones are removed from the corpse as in the case of a male.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widow discards mourning ornaments about ten months after her husband's death,
    after she and her relatives make a feast for the dead man's brothers, sisters,
    and sisters' children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The widow's sisters-in-law take her to the seashore, wash her, remove the
    black pigment freshly painted on her, and cut short her long mourning petticoat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A widower undergoes a similar foreshore process at the hands of his dead wife's
    sisters, who scrub black pigment from his body and remove the magula and pegara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dead man's children are similarly treated; the sons of the dead man's sisters,
    called his kada, are said to officiate in this case.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Kwaiawata, when a man dies away from his own village, his sisters' children
    are summoned to fetch the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For a dead man at Kwaiawata, the grave is dug by his mother and sisters' children,
    never by his father, and the corpse is placed in the grave by his mother-in-law
    and sisters' husbands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A sagalz feast is held one or two days after burial, provided by near kin
    of the deceased and eaten by people of all clans except the dead man's own clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The bones removed from a dead man include forearm bones, fibulae, phalanges
    of hands and feet, the skull, and cervical vertebrae; the mother-in-law and others,
    perhaps including the widow, take them to the beach to be cleaned.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Forearm bones and often fibulae are made into spatulae by certain lubai, including
    children or the brother of the dead man, and use of the spatulae is said to be
    confined to these lubai.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The clean skull is kept in the house by the dead man's widow and children;
    the children wear the father's atlas bones and phalanges, and male children wear
    the lower jaw unless there is no son, in which case the widow wears it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The skull, cleaned bones, and spatulae are kept in the house until mourning
    has ceased, perhaps about twenty months, while the skull is regularly oiled and
    rubbed or polished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the end of the keeping period, the skull and many trunk and limb bones
    are deposited on rock platforms and in shallow rock shelters in cliffs above the
    shore; the passage says the remaining bones were probably collected after reopening
    the grave later.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: When a Kwaiawata woman dies, her husband and children dig the grave, the husband
    places the corpse in it, the widower and his brothers and perhaps sisters remove
    the bones, the widower keeps the skull and wears the lower jaw, and later the
    remaining bones are placed in a shallow cave or rock shelter.
  category: sequence
  evidence_refs:
  - ev:7
