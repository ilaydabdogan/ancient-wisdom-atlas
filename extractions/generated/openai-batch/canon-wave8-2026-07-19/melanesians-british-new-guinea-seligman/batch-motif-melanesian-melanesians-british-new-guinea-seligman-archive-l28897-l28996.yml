canonical_text:
  quote: ''
  summary: The passage describes male initiation seclusion, its dwelling, food arrangements,
    instruction, seasonal duration, hunting obligations, cleansing, adornment, and
    return; a Gelaria variant of male abstinence and reintegration; and a former Wamira
    practice of girls' puberty seclusion with movement and food restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Male initiates work in gardens, then build a sleeping hut away from other
    houses near the settlement outskirts; the hut is called potuma and the initiates
    are called agariria.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While the potuma is being built, the boys sleep on the sand, avoid the settlement,
    and may pass through it only at night when everyone is asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the potuma is finished, the boys sleep there but spend days in gardens
    and on the seashore; their mothers cook for them in special small pots and other
    people avoid them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Old men go to the potuma, talk with the boys, answer questions, and repeat
    the taboos that the initiates must not break.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The seclusion has no separation by clan or kimta and lasts from the flowering
    of the orabu rush until the sun reaches its most northerly direction, about four
    to six months.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: During seclusion, initiates may hunt and fish but must give their quarry to
    their mothers, fathers, and mothers' brothers; a hunt also occurs the day before
    seclusion ends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the close of male seclusion, the boys receive back their belts and ara,
    cleanse themselves in the sea, wear a comb for the first time, oil themselves,
    paint their faces black and red, return to their fathers' houses, and the initiation
    potuma is left to rot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Gelaria, a boy called ilaike begins viginana when told by his father; during
    this time he abstains from flesh and fish, eats vegetable food, may hunt, and
    does no garden work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Gelaria initiate may no longer cross to the women's side of the house
    floor; his boiled food is prepared by women and passed to him by a man in a pot
    reserved for his use, which he must return to a man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Gelaria father instructs the boy how to behave as a man, including obeying
    commands in war and sharing food fairly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Gelaria viginana lasts from one flowering of the orabu to the next and ends
    with river bathing, a new belt and ara, public hair combing, comb wearing, hair
    growth, face blackening, ornaments, and a settlement feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: At Wamira, girls formerly known as gidara before catamenia were secluded around
    puberty in an existing house for one to three months; women visited them, they
    could leave by day but not at night, they did not go to gardens, and they abstained
    from flesh food.
  category: sequence
  evidence_refs:
  - ev:5
