canonical_text:
  quote: ''
  summary: 'The passage summarizes Mekeo social organization and history: the Biofa
    and Vee tribes originally comprised clans with associated tauafangai trees and
    reciprocal ufuapie relations; marriage was barred within the same pangua or near
    blood relation. It describes early villages, hereditary chiefs, clubhouses as
    ceremonial centers, differentiated chief roles, warfare magic specialists, clan
    fission, retained and changed clan identifiers, and immigrant stocks with separate
    centers of origin.'
  language: English
  quote_policy: summarized
