  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Murua frigate-bird totem is also linked with a bush dove described as
    having a green body and magenta crown.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The linked totems of Tokunu include a group of frigate-bird, crocodile, a
