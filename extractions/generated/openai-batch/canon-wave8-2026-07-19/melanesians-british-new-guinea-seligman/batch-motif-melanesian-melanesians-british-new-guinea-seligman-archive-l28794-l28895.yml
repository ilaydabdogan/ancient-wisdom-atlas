canonical_text:
  quote: ''
  summary: 'The passage describes menstrual food restrictions and cleansing, then
    reports ethnographic details of Wamira boys'' initiation: a superhuman origin
    is mentioned but not described; neglect of initiation is said to affect boys''
    proper growth; timing follows the flowering of the edible rush and mango ripening;
    boys drink mango scrapings mixed with salt water, dive and drink seawater, drink
    green coconut milk, change into prescribed leaf and coconut-spathe garments, return
    to food prepared by mothers, exchange food portions with fellow initiates, and
    observe food and sexual taboos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A menstruating woman may not eat from the family pot or dish and instead cooks
    her own food at the common fire in a special small pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The menstruation pot is not destroyed after use; it is stored under the roof
    for the woman's future use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the end of her period, the woman washes in sea or fresh water and is then
    considered clean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Wamira, initiation is said to have been instituted by an unnamed superhuman
    being, but no details about him were available to the reporters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a general agreement that if initiation ceremonies were
    neglected, boys would not grow up properly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Initiation formerly occurred about every three or four years, but mission
    schooling and a magisterial order lengthened the interval and made the age of
    initiation later.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Older male sleeping houses, or potuma, are described as formerly differentiated
    chiefly by age or tribal status.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Initiation takes place after the flowering of the edible rush, orabu, and
    when the mango is ripening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fathers decide together that their sons shall be initiated when the year's
    orabu has flowered, and each father tells his son that his orabu has flowered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Each boy obtains an unripe mango, scrapes it into an empty coconut shell,
    mixes the scrapings with salt water at the beach, drinks the mixture, and washes
    it down with more salt water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each boy dives into the water with his mouth open, drinking as he swims beneath
    the surface.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before diving, each boy removes his perineal bandage and waistband, wears
    a leaf girdle, and keeps his armlets on.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The boys drink green coconut milk, which is said to prevent vomiting and promote
    the purging that follows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After leaving the water, the boys put on a coarse coconut-spathe perineal
    bandage fastened to a pandanus-leaf waistbelt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The boys comb their hair, drink green coconut milk again, oil themselves,
    and return home to food cooked by their mothers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: No initiate eats food prepared by his own mother; each boy leaves his portion
    in a pot outside the house of a fellow initiate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Meat, fish, fish-spawn, and taro leaf are forbidden foods for initiates.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: Sexual indulgence is forbidden to initiates, and disobedience is associated
    with the penalty that the hair would not grow well.
  category: speech
  evidence_refs:
  - ev:7
