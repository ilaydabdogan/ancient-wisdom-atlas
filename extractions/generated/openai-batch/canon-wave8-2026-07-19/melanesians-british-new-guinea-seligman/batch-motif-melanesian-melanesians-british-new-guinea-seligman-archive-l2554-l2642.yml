  quote: ''
  summary: 'The passage describes physical measurements and appearance of Oroi and
    Diumana people, argues for immigrant descent despite a stated inland-origin belief,
    notes Kabadi affinities with Roro clubhouses and names, and identifies regional
    social-artistic patterns: ceremonial importance of the right side, predominance
    of geometrical decoration, right-left clan and clubhouse divisions, and a Papuan
    Elema parallel.'
  language: English
  quote_policy: summarized
