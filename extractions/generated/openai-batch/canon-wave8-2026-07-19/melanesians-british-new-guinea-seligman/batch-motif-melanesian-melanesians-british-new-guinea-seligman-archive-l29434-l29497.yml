canonical_text:
  quote: ''
  summary: The passage describes marriage residence and garden-land obligations at
    Wagawaga and Tubetube. At Wagawaga, a husband was expected to work first on his
    wife's garden land, might live in her hamlet, and later often made gardens in
    his own hamlet, sometimes alternating between the two. At Tubetube, similar practices
    are described, including a specific case in which Mwakasoki and Turia moved between
    his parents' house, her hamlet, and his mother's ground, with assistance and maintenance
    from Turia's relatives.
  language: English
  quote_policy: summarized
