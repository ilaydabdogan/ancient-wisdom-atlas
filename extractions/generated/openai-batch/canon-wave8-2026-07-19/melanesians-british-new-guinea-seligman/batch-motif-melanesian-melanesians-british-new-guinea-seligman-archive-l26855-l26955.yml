canonical_text:
  quote: ''
  summary: 'The passage describes the potuma clubhouse and related male spaces at
    Wagawaga: their non-exclusive use across clans, the role of old men''s potuma
    as places of public discussion, the gendered division of dwelling houses, the
    building and upkeep of potuma, the office of the potuma master, the burning of
    a potuma after its master''s death, and an older requirement that a killing and
    skull-smoking precede the first fire in a new potuma.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man of any clan may sleep in any potuma, and boys or young men may use any
    potuma for painting themselves for dances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may retreat to any potuma after a quarrel with his wife and commonly
    sleeps there while she is pregnant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old men's potuma is described as a definite institution where old men
    gather and young men do not come uninvited.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The watara of the old men's potuma at Wagawaga became an evening meeting place
    for important old men from different clans or hamlets, and war and peace were
    discussed there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The front half of a well-built dwelling house is a men-only area called nakanaka,
    while the rear half is a women's area called gwigwi, separated by a low transverse
    rail.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A dwelling house could be decorated somewhat like a potuma and used by men
    from other hamlets, but a true potuma differed by keeping skulls of slain enemies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The men of a hamlet take the main part in building their potuma, while helpers
    from other hamlets and clans may assist and are fed by the host hamlet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each potuma has a recognized master whose office is not hereditary and whose
    responsibilities include food arrangements for builders, wood preparation, providing
    firewood through his womenfolk, and keeping the potuma clean.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The potuma master is said to have no special privileges in the potuma and
    no greater prominence in old men's counsels than other men of similar standing.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the potuma master dies, his potuma is burnt with everything in it, including
    property belonging to any clan and the skulls kept there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A brother or a sister's child of the dead master lights the fire that burns
    the potuma after the master's death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In former practice, a new potuma's fireplace remained open and no hearth or
    fire could be made until a person from another community had been killed, the
    skull dried in the smoke of the new fire, and the body cooked and eaten in the
    cannibal stone circle.
  category: sequence
  evidence_refs:
  - ev:7
