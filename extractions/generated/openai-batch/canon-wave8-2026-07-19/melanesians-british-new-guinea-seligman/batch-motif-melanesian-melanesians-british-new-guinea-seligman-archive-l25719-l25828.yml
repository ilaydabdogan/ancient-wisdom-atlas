comparison_claims:
- id: claim:1
  claim: 'Within the supplied passage, Tubetube totemic practice is explicitly compared
    with Wagawaga: many rules are said to be much the same, while Tubetube differs
    by showing greater respect for a man''s own bird totem.'
  claim_level: same_function
  target: Wagawaga totemic practice
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a condensed comparison and does not provide
    full Wagawaga evidence in this line range.
- id: claim:2
  claim: The Basilaki and Rogea reports cautiously parallel the Tubetube pattern of
    avoiding both one's own and one's father's bird or fish totems.
  claim_level: same_motif
  target: Basilaki and Rogea own/father totem food taboo
  evidence_refs:
  - ev:1
  - ev:4
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Basilaki and Rogea evidence comes from a few young men, and the
    passage notes limited questioning.
- id: claim:3
  claim: The Wamira material on bariaua and King's statement about the totem as family
    father or grandfather support a nearby Bartle Bay pattern in which totems are
    treated as uncanny or ancestor-like beings whose flesh is not eaten.
  claim_level: same_function
  target: Wamira or Bartle Bay totem-as-ancestor food taboo pattern
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to terminology and a quoted unpublished statement;
