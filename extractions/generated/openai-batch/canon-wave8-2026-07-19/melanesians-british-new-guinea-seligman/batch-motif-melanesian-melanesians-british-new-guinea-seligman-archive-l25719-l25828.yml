canonical_text:
  quote: ''
  summary: The passage describes Tubetube totemic practices involving bird, fish,
    human, and plant totems; rules about eating, touching, wearing feathers, marriage,
    and treatment of corpses in war; and related Bartle Bay material on Wamira, Wedau,
    Gelaria, Rogea, and Basilaki clan totems, including the Wamira term bariaua for
    totem or uncanny agency.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tubetube man would not eat his own bird totem or touch it when dead, but
    he would wear its feathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tubetube men at the time of reporting ate their own totem fish, and the passage
    says it was unclear whether this was a modern innovation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Distinguishing totem marks or badges were not painted on men before fighting,
    and no attempt was made to avoid fighting with clansmen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who killed a clansman in battle would regret it and would not help carry
    the body to the canoes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says it was unclear whether a man formerly would have helped eat
    a hostile-community man of his own totem, though opinion tended against it.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man would avoid eating a dead man of his father's totem, although the killing
    itself in battle was said to carry no guilt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prisoners could be questioned about the totem of a dead man; if no information
    was obtained, anyone could help carry away and eat the corpse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man would not eat his father's totem bird or fish and would not wear feathers
    of his father's totem bird.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men made a point of wearing feathers from their own totem birds, and a man
    who killed another clan's totem bird might give its feathers to a friend of that
    clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Marriage did not take place within the clan, and sexual connection within
    the clan was avoided as much as possible.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Clan-incest was recognized as immoral, but the passage says no special bad
    luck or formal punishment was reported.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: A married person customarily abstained from eating the totems of the partner's
    father as a matter of courtesy and convenience.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Two old men of Dekwasoso said that the plant totem kaikuari could have been
    cut down and used as firewood if convenient.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Wamira, Wedau, and Gelaria communities are described as formed of clans named
    from real or hypothetical bush settlements or stocks.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Magala, chief of the Wadubo moiety of Wamira, identified his clan as Iriki
    or Irikie Daba and said they were people of Daba.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Wamira word bariaua was used for totem and for supernatural or uncanny
    agency, including white men, totem animals, and Aetago.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Aetago is described as a one-legged creature who kills men.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:18
  text: An unpublished paper by Rev. Copland King stated that the totem animal, reptile,
    or bird was spoken of as father or grandfather of the family and that the family
    would not eat its flesh.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: Young men from Basilaki and Rogea said they would not eat either their own
