canonical_text:
  quote: ''
  summary: 'Ethnographic note on Pokao or Nara: its geography, villages, trade, social
    organization, reported history of village dispersal and later unification, leadership
    and feast roles, relations with neighboring groups, clubhouse architecture, carved
    posts, fire damage, and clan descent.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pokao or Nara is described as a small district east of Roro and Mekeo, with
    an uninhabited mangrove coast and villages in uplands behind it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pokao and Roro formerly exchanged smoked wallaby flesh for coconuts and other
    garden produce.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The social organization of the Pokao villages is said to resemble that of
    the Koita, and the inhabitants are noted for individuals with wavy or almost straight
    hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The named Pokao villages are Oroi, Alaala, Diumana, Bokama, Tubu, Lalime,
    and Vanuamae; Epa is associated with the dialect but is said not to intermarry
    with the others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nara houses are characterized as oval in section from roof to floor and opening
    onto a verandah, sometimes shared by several houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the reported history, all Nara people formerly lived at Vanuaboada, but
    because the population was too large for the area to support, they split into
    smaller villages at Ova Vala's suggestion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some idubu moved from place to place and were reduced by fighting with Epa,
    Mekeo, and Kabadi before Nemi Oroi gathered many of them and persuaded them to
    unite under him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The three most important idubu in the account are Siagauna, Babu, and Oroi,
    with only one surviving man of Siagauna idubu and two of Babu idubu at the time
    reported.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nemi Oroi of the Oroi idubu was head of the village, Ume Kame of Babu idubu
    was second in command, and the large clubhouse was called Ivamuru.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kaloka, a woman, is described as the current head of the village, but on ceremonial
    occasions her place is taken by her son Naime.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: At a feast, Naime and Ume Kama kill the first two pigs and make the first
    cut in them, after which others join in the killing and Oa Idoa and Taba Oa make
    the distribution.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Nara villages are described as having old friendship with the Koita and
    Waima, and trade with Delena, whose people bring pots and receive yams, bananas,
    and tobacco.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: At the time of observation, the Nara territory is said to have no clubhouses;
    their place is taken by open roofed platforms with diamond-shaped ornaments woven
    under the eaves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: An old Diumana clubhouse, or loe, survived until recently; its carved posts
    remained partly visible after fire damage, and the posts were carved by or under
    the direction of Poa Oa of Waima.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Diumana loe is said to resemble the marea of Roro-speaking tribes in general
    aspect and carved low-relief boards, but to lack the front platform and closed-in
    back compartment of the marea.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The massive side-post terminals of the clubhouse were carved as human heads,
    and each post carried a conventional crocodile carving.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: The loe floor is estimated at about sixteen yards by five yards and about
    four feet above the ground, with a ridge pole at least thirty feet above the floor
    and carved and painted boards under the front roof projection.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Nara clan system is judged probably essentially the same as that of the
    Koita and Motu; in Oroi there are four idubu and descent generally follows the
    male line.
  category: relationship
  evidence_refs:
  - ev:10
