canonical_text:
  quote: ''
  summary: The passage describes premarital courtship and sexual relations in the
    Massim area, including female choice of lovers, intercourse as a normal mode of
    courtship before marriage, low numbers of illegitimate births, abortion and magical
    contraception, a Sinaugolo belief about repeated intercourse and conception, and
    a Wagawaga practice in which bachelors visit potuma, or girl-houses, where girls
    select partners through a messenger.
