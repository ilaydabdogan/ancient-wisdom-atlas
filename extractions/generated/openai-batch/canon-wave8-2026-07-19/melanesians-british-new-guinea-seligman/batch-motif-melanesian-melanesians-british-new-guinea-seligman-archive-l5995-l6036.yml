canonical_text:
  quote: ''
  summary: Edai Siabo sails west and instructs Oiooio that her daughter-in-law should
    watch from Taubarau for the returning lakatoi. Other wives take new husbands,
    while Oiooio remains faithful. The lakatoi returns with sago; Edai admonishes
    the faithless women and the men who took them. The passage ends by explaining
    that lakatoi have since gone west every year, bringing food during the season
    of scarcity.
  language: English
  quote_policy: summarized
