canonical_text:
  quote: ''
  summary: The passage describes friendship relations among Koita and Motu communities,
    including ordinary same-sex friendliness within sections, hereditary friendships
    between families or villages, the contracted vasila friendship sealed by smoking
    and betel chewing, and the closer henamo bond between same-sex children or companions
    established by reciprocal gifts and treated as a kin-like relation with shared
    activities, marriage restrictions, and blood-feud priority.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of a section generally maintain friendly relations with other members
    of their own sex, while taking little public notice of unrelated women or girls.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some villages maintain traditional friendly relations, and some families maintain
    hereditary friendships with families in little-known or formerly hostile villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Specially good friends are called vasila; when visiting other villages, a
    man stays with his vasila regardless of his iduhu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vasila relationship is entered into after discussion and consists ceremonially
    of formally smoking and chewing betel together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states a man does not marry or have connection with the sister
    of his vasila, while a footnote qualifies that he may sometimes marry her but
    not have connection with her otherwise.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: The henamo bond is described as closer than vasila and, strictly, as existing
    between same-sex children born on the same day in certain villages whose fathers
    exchanged presents at their birth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The term henamo is also used more loosely by children playing together, by
    boys for friends met while travelling, and by boys going on a hiri together after
    an interchange of gifts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage lists villages whose people may become reciprocally henamo and
    states that Motu and Koita may be united in the henamo bond.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Soon after the birth of possible henamo, one father gives the other a dog,
    pig, or armshell, and an equal return gift, usually of the same kind, is made.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: As far as circumstances allow, henamo children play and grow up together and
    may receive their first sihi from the maternal uncle of one of them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the example of Ahuia and Waigamu, both received their sihi from Waigamu's
    maternal uncle, and Ahuia then used kinship terms for Waigamu's close family.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man may not marry or have connection with the sister of his henamo; in a
    blood feud a henamo takes precedence over the dead man's brother, but there is
    no special obligation toward the widow or children of a dead henamo.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Girls may become henamo in the same way as boys, but the passage says the
    relationship is less serious and often drops after one party marries.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Henamo share food, go hunting and fishing together, and in battle try to remain
    side by side.
  category: action
  evidence_refs:
  - ev:11
