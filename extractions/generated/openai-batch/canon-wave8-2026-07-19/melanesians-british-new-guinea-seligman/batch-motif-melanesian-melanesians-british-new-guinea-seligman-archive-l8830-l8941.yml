canonical_text:
  quote: ''
  summary: 'The passage describes preparation for a tabu feast: village discussion
    of garden conditions, preliminary games, reciprocal food exchange between women
    and men, construction of a pata platform under the tabu biagu, borrowing and fattening
    of pigs, piling of yams and bananas, participation of unmarried girls and visitors,
    banana presentations to friendly clan youths, dances, and preparation or construction
    of a dubu platform oriented toward another feast-giving iduhu.'
  language: English
  quote_policy: summarized
