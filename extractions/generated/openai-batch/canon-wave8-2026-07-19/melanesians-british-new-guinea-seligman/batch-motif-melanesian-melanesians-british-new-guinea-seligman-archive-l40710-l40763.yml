canonical_text:
  quote: ''
  summary: 'The passage describes Mukaua and Bogaboga betrothal and marriage customs:
    childhood affiance through a banana-leaf dress offered by the boy''s mother to
    the girl’s mother, marriage by moving the bride to the groom’s father’s house
    with gifts to her people, post-marital residence and garden rights, widow residence
    and children’s affiliation, and arrangements for additional wives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mukaua and Bogaboga marriage customs are described as identical in this passage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children may be affianced in childhood, sometimes at eight or nine years old
    or younger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy’s mother makes a dress of banana leaves and offers it to the child-bride’s
    mother; acceptance makes the children betrothed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Parents often consult children before betrothal, but consultation is not considered
    necessary; a surviving betrothed person is usually consulted if the other dies
    and a new spouse is selected.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Marriage occurs when the bridegroom’s people say the children are old enough;
    the boy eventually takes the bride to his father’s house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gifts are given to the bride’s people after the bride is taken to the bridegroom’s
    father’s house.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Typical gifts include pots, sleeping mats, perineal bandages, and food; one
    valuable shell ornament was said to be returnable to the bridegroom’s family when
    his wife died.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bride’s people are said not to make presents to the boy’s people, though
    return presents of food to the bridegroom’s relatives are described as common.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: One informant said he had not yet had sexual relations with his wife because
    people would mock a child born within a year of marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: At marriage, a woman comes to live in her husband’s village, though the young
    couple may visit the bride’s village for a while.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the wife’s land is near the husband’s, he works in both his own and his
    wife’s gardens, and the food belongs to both or either.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: At the woman’s death, her land reverts to her own people.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: If the bride comes from a distance, the husband often does not visit her district
    and usually does not work in her garden; her people cultivate it and eat most
    of its produce.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: On her husband’s death, a widow returns to live with her father, while her
    children remain with their father’s people, with visits between mother and children.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: A man who takes a second wife builds a separate house for her; if he takes
    many wives successively, he usually does not build a new house for each one.
  category: action
  evidence_refs:
  - ev:12
