  quote: ''
  summary: The passage describes valued personal property among Koita/Motu-related
    communities, noting shifts caused by the Port Moresby store and suppression of
    feuds. It lists valued possessions, imported goods, tools, drums, nets, a popular
    camphor wood lock-box, pendant keys used for display, and several named native
    ornaments that retained value.
