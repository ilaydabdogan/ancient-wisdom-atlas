  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man is said not to part readily with his drum and fishing nets, because
    the labour needed to make them has not been greatly reduced by imported trade
    articles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A good spear is associated with articles of personal adornment in the heni
