canonical_text:
  quote: ''
  summary: The passage describes Mekeo relations among iauafangai, kangakanga, and
    ufu. Clans have animal or plant iauafangai, often shared by common-descent ngopu
    groups; they also have kangakanga, distinctive clan-badge ornaments derived from
    animals, plants, or other objects. Badge animals are generally not eaten, though
    they may be killed for feathers used in ornaments. Clan local groups should possess
    clubhouses called ufu, whose names were formerly linked within common-descent
    groups and later changed or confused. The passage also reports contemporary confusion
    among the terms, including confusion between clubhouse names and iauafangai.
  language: English
  quote_policy: summarized
