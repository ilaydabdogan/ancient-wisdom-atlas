canonical_text:
  quote: ''
  summary: The passage describes Koita and Motu terms for shadow, reflection, soul,
    and ghost; beliefs about the soul leaving the body in death or sleep; the Koita
    afterlife at the mountain Idu; the afterlife presence of object-souls; ghostly
    appearances and haunting; an incident of fraudulent ghost evocation; and an etiological
    account explaining why returning souls are now unsubstantial rather than bodily.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person's shadow is named with the same term also applied to reflection in
    water, photograph, or mirror image.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sua is described as something that leaves a person at death and then has
    independent existence as a ghost or shade.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sua may temporarily leave the body or be enticed out; its absence causes
    sickness and, if prolonged, death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Harm done to the sua is said to be reproduced in the person whose vital essence
    it is.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Animals are described as lacking sua, while armshells and other valuables
    are said in one magical context to have sua that can be given to an offended spiritual
    agency.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Koita sua go to a mountain called Idu, while Koiari and Motu shades go elsewhere.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: On Idu, the dead lead a life resembling earthly life, with good and bad, strong
    and weak, warrior and child treated alike.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A dead person buried with an unpierced nasal septum would have a slowworm-like
    creature as a nose ornament, so a postmortem operation might be performed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After death, the newly freed sua returns from Idu with other sua to carry
    away the sua of objects the dead person cared for.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Objects ceremonially destroyed at a death are said to exist on Idu, and the
    sua there have gardens, houses, and wives.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sua on Idu live for an unknown period longer than human life, then weaken
    and cease to exist; the passage suggests this may correspond to loss of memory
    or names on earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sua are seen in dreams; some men identified as sorcerer-like are said to see
    them while awake, and sua may return to villages or haunt the place of death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Tamasi incident, girls persuaded villagers that they could make a dead
    youth appear bodily, received payments, and the apparition was exposed as Mea
    when held and illuminated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A sua may leave the body during sleep; waking before its return may cause
    sickness, and sneezing is treated as a sign that the sua has returned.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A dead man's sua once returned in a decaying bodily condition and asked his
    wife to boil water and wash him; because she refused from fear, returning sua
    can no longer appear bodily and return only unsubstantially.
  category: sequence
  evidence_refs:
  - ev:9
