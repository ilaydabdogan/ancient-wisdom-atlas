canonical_text:
  quote: ''
  summary: The passage is an ethnographic account and tabular list of pangua, ufuapie,
    iauafangai, and ngopu group affiliations in Inawaia and several Biofa villages.
    It describes Inawaia's four pangua, notes that two Lapeka immigrant stocks adopted
    Inawaia ufuapie, and explains Inawi and related ufuapie relations through settlement
    history, immigrant stocks, and cross-ngopu relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Inawaia village is described as having four pangua: Inawaia Laina, Inawaia
    Koko, Ungokapia, and Apangaikoa.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inawaia Laina and Inawaia Koko are said to belong to the Kuapenge ngopu group,
    while Ungokapia and Apangaikoa are immigrant stocks from Lapeka.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: All four Inawaia pangua have the same ufuapie, with the Lapeka stocks said
    to have adopted those of Inawaia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ufuapie named for Inawaia are Inafokoa lapulapu, Inawae Angamea, and Eboa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For the Biofa village lists, the author says the condition of things is much
    the same as among the Vee, but Inawi history allows some seeming discrepancies
    to be explained.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Waiaka and Paiapaia are described as the two most important Inawi pangua,
    whose members are estimated to make up four-fifths of a village of about 450 people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Waiaka is said to have four ufuapie: three from the Inawae ngopu group and
    Inafokoa, part of the immigrant Eboa-Inafokoa stock.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Paiapaia's ufuapie include Inawefae, Ngangai, Inawae Aungako, and Ongofoina
    Kipo; the prose explains two of these as belonging to the Inawae ngopu group.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:9
  text: The passage states that when a foreign stock enters a village it usually establishes
    a ufuapie relation with one of its nearest neighbours, with both parties neglecting
    ngopu grouping in such cases.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ngangai is described as a Vee pangua settled in Inawi village and is listed
    in ufuapie relations with Paiapaia, Ungo, and Okopi/Okope.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:11
  text: Ongofoina Kipo is connected with Paiapaia and with Oala Aivea, Alo Aivea,
    and Ipange through explanations involving settlement history, relation to Ongofoina
    of Veifa, and Ipange's weak immigrant status.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:12
  text: For Veifa, the author says that if immigrant stocks are omitted, there are
    as many ufuapie relations between pangua of different ngopu groups as between
    pangua of the same ngopu group.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In Amoamo, the ufuapie of Amoamo pangua are said to belong to the Inawi ngopu
    group except for Amoamo Inaukina, described as a foreign stock from the upper
    waters of the Biaru River.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The tabular list identifies pangua, their ufuapie, italicized iauafangai,
    and ngopu group abbreviations including Ngangai, Kuapenge, Immigrant stock, Inawae,
    and Inawi.
  category: object
  evidence_refs:
  - ev:10
