canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which the Lavarata clan deceives
    the Aurana clan, departs in a hollow tree trunk with village goods, and is later
    linked etiologically to canoe-making and to white people at Taupota. It then gives
    the Awaiama tale 'The Fig Tree,' in which a sorcerous mother-in-law traps a young
    mother in a fig tree, cuts off parts of her body for food, while the children
    secretly milk her to feed the baby; after she dies, the children escape into a
    palm by means of a bending gomida tree and surround the trunk with stinging creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lavarata clan told the Aurana clan they would rest and feast, but instead
    went to the fallen tree with the best ornaments, pots, weapons, and nets from
    the village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lavarata clan pushed the tree trunk into the water, used branches as paddles,
    and lived inside the hollow trunk because it was very large.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Aurana clan noticed the Lavarata people departing toward the north-west
    and found no fish or utensils left for them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lavarata people are described as having light-coloured skin like albinos.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Lavarata departure, people made canoes to cross the sea, and later
    white people at Taupota were identified as descendants of the old Lavarata clan.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the fig tree tale, a woman had recently given birth, and her husband had
    gone to the islands to fish for turtle and dugong.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband's mother had sorcery powers and urged the still-weak young woman
    to climb a nearby fig tree for ripe figs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While the young woman was in the fork of the fig tree, the old woman called
    words commanding it to hold her, and the viscid fork held her fast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old woman cut off the young woman's hand, took it home, and went to get
    vegetable food to eat with it; on later days she cut off the forearm, upper arm,
    shoulder, and breast.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:10
  text: The children came with coconut cups, milked their trapped mother, and fed
    the baby with the milk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the old woman questioned the children about the cups, they said they
    had been getting stream water for the baby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the children no longer heard their mother's cry, they concluded she
    was dead and that the hag would next try to kill them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The eldest child gathered beetles, spiders, snakes, scorpions, centipedes,
    wasps, ants, and other stinging things; the second-born gathered food, cups, bamboo-knives,
    and utensils.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The eldest child addressed a gomida tree, which bent down so the children
    could enter its branches, then straightened so they could climb into a tall palm.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The children put the stinging creatures around the palm trunk below them and
    ate nuts in the palm top.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The old hag returned, failed to find the children, called for them, and muttered
    that she feared losing her 'little meat' provisions before the children answered
    from the palm.
  category: speech
  evidence_refs:
  - ev:10
