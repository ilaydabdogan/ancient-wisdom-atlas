canonical_text:
  quote: ''
  summary: The passage describes hereditary Mekeo chiefly offices, exceptions in succession,
    a woman holding and transmitting chiefly office, hereditary and purchased rights
    to special house forms and carved displays, a story in which an Afai woman sees
    non-human carvers and has her husband reproduce their boards, and a neighboring
    Waima account of an ornament invented by Bereina and copied or 'stolen' by Mekeo
    people, causing warfare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The offices of lopia fda and io lopia are described as hereditary from parent
    to child or adopted child, with the added old fighting-days qualification that
    a war chief had to be a successful warrior.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief may pass over elder children and transmit office to a younger son;
    the passage gives examples involving Oriropetana and Inafokoa chiefly succession.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman, Inau Oaia, is described as lopia fda in the Inawae Ipiau pangua,
    and she may transmit her office to her children if they are brought up at Inawae.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Children of noble families are said sometimes to assume their mother's pangua;
    this mode of descent is unusual among commoners but not strictly confined to chiefly
    families.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The house of the lopia fda of Inawi is described as an unusual faifanga-style
    house built in the form of an equal-limbed cross, with a hanging plank called
    ipopi and carved side planks called alipa ikanga.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The right to build faifanga houses was once the exclusive hereditary right
    of an Inafokoa chief, but the lopia fda of Inawi acquired an equal right by purchase,
    and that right now descends in his family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The carved planks are said to derive from Afai, where a family owned them
    until an ancestor of the present chief acquired the right to make and display
    them by purchase.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Leaf-like objects near the base of the swinging plank are conventional representations
    of the boar-tusk ornament lopia pao, which every Mekeo chief has the right to
    wear and display.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: An Afai woman planting taro looked down a hole made by her digging stick and
    saw men carving boards like those hanging from the chief's house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Afai woman noted the design and told her husband, who carved similar boards
    under her direction and displayed them at feasts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The beings seen carving the planks through the hole are identified as non-human
    creatures called faifai.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: A Waima legend says the ornament was invented by Bereina and copied or 'stolen'
    by Mekeo people, and that this act caused prolonged warfare between Bereina and
    Waima on one side and Mekeo on the other.
  category: sequence
  evidence_refs:
  - ev:4
