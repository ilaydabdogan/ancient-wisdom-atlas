canonical_text:
  quote: ''
  summary: 'The passage describes mourning and funeral procedures: wailing begins
    immediately after death; female relatives embrace, lick, and sometimes wound themselves
    for the corpse; male relatives arrange the body; a shell trumpet announces the
    death; the corpse may be displayed on a death chair, dressed and painted, with
    chiefly ornaments for a chief. It also describes unrest and vengeance concerns
    after a death attributed to sorcery, the damaging and hanging of the dead man''s
    effects and later vegetables, wrapping and burial of the corpse, a branch-stroking
    act to drive away the spirit, nightly fires on the grave, and grave goods or weapons
    placed with or near the dead.'
  language: English
  quote_policy: summarized
