canonical_text:
  quote: ''
  summary: 'The passage describes funeral and mourning practices: grave-watching by
    gariauna with food restrictions and later gifts; deathbed head support and wailing;
    kimta companions’ gestures and recited charms; preparation of the corpse and grave;
    burial procession, corpse orientation, food placement, and removal of objects
    not to be buried.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gariauna remain at the grave for five to ten days after interment, sleeping
    on or beside it and using the grave shelter in rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the grave watch, food is supplied by the dead man’s brothers, relatives
    of his totem, or other kinsmen; the watchers drink no water and receive only a
    little heated coconut milk and small amounts of vegetable food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the grave watch, the gariauna bathe in the sea and return to their houses;
    they continue receiving food, and at the first feast called kanekapu receive cooked
    vegetables and uncooked pig-flesh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A wife supports the head of her dying husband on her lap, and a husband does
    the same for his dying wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dying man is visited by his kimta mates, and people from the community and
    kimta mates from neighboring communities come to the door and wail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The eyes of the dead are not closed by attendants, because they are said to
    close of themselves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man’s kimta mates stand beside the body, grip the corpse’s nose between
    finger and thumb, slide their fingers down the nose, and say “kapore au kimta.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After death, the father of the deceased, or failing him a son or brother,
    recites a spell; the spell may be a garden charm, spear charm, fish charm, or
    taro, pig, and wallaby pari.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Earlier burials were near the deceased’s house; upright stones, broken pots,
    spears, dishes, cups, and digging sticks, planted crotons or ornamental trees,
    and often a hut were placed at or over the grave.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Family members blacken the corpse’s face, place ornaments on him, and draw
    lines across prominent features without a special pattern.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After painting, the body is placed outside the house on its back on a sleeping
    mat, while a woman supports the head on her lap and the grave is dug.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The grave is dug by gariauna, assisted by kimta mates or clan members; the
    stick used for digging is thrown away in the bush.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The wife lies beside the body, embraces it, and weeps quietly without asking
    why her husband has left her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: If the body must be carried a distance, it is placed on a wooden bier called
    ratirati, lying on its side in a position compared to a foetus in utero.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The gariauna act as bearers; no one precedes the bier, and the community,
    including relatives, follows it to the grave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The corpse is buried on its side, with the head directed toward the legendary
    place of origin of the dead man’s clan and a dish of food near the face.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: At the edge of the grave, the gariauna remove ornaments and objects not to
    be buried and later take them home without special ceremony, since no infection
    is attached to them.
  category: action
  evidence_refs:
  - ev:8
