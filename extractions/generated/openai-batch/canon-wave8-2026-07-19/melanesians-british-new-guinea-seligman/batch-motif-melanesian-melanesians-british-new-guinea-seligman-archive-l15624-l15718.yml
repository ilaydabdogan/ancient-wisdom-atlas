canonical_text:
  quote: ''
  summary: 'The passage describes mortuary and mourning customs: display of a dead
    chief’s hair and possessions, collective village mourning and feasts, restrictions
    and signs of mourning for widows and widowers, food taboos, blackening and mourning
    ornaments, removal of mourning garb, and measures for managing or driving away
    a dead person’s spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Objects belonging to a dead chief, including hair and personal items, could
    be attached to the front central post of a marea after his death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A village may mourn a chief or influential man for six to ten days by reducing
    ordinary productive work, and the period ends when relatives remove coconut leaves
    and hold a small feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Yule Island, the body is described as buried with its feet toward Mt Yule/Kovio
    to prevent the dead man’s spirit from scaring fish by walking along the strand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two men are described as stroking the corpse with a herb to drive away the
    spirit, then chasing it beyond the village with sticks or torches and a final
    curse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Children at Waima may cut off locks of hair as a mourning sign, and both sexes
    shave the head as a sign of mourning.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: A widow or widower remains largely in the house for months, exits by the back,
    keeps the face concealed from the opposite sex, and avoids the main street and
    village center while mourning signs are worn.
  category: action
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: A widow is described as leaving the house in a manner imitating falling or
    rolling, being supported by friends when abroad, and being carried back if she
    heard of her husband’s death while in the garden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Widows and widowers observe different food prohibitions involving yams, bananas,
    wallaby, pig, fish, shellfish, and sweet potatoes.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: At a later feast, relatives provide fish and game, the chief mourner is blackened
    from head to foot, and some movement restrictions are relaxed while avoidance
    of the village center continues.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Widows and widowers wear net collars, armlets, and additional gender-specific
    mourning garments or ornaments; these are removed by a relative at the last mourning
    feast after one or two years.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The passage states that there are no taboos on the name of the deceased; unusual
    noises from the deserted house are taken as a sign that the spirit has returned
    and may be driven away.
  category: speech
  evidence_refs:
  - ev:10
