canonical_text:
  quote: ''
  summary: An ethnographic account describes Taolu's formal reception as guiau, a
    procession to Kabwaku, the kabilula atonement ceremony with exchanges of valuables,
    speeches accepting his authority and ending warfare, and a concluding tobacco
    offering for a pipe of peace followed by return to villages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taolu arrived at Obweria with a large armed retinue while he himself carried
    no weapons and wore royal armlets and wristlets associated with prior supreme
    guiau.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kunol, a Tilataula chief, formally received Taolu and addressed him as acknowledged
    guiau in succession to Enamakala, urging peace and the putting away of spears.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kunol struck his forehead as a pledge, grasped Taolu's hand, and drew him
    toward the path to Kabwaku; the surrounding men acclaimed Taolu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The procession to Kabwaku included warriors, a sorcerer reciting incantations
    to clear the path of evil spirits, women carrying appeasing gifts, chiefs, and
    a crowd.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Kabwaku a cleared village space was surrounded by armed men, with Moliasi
    and chiefs at one end and Taolu and his companions at the other.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Taolu and some companions presented individual valuables as kabilula or atonement,
    naming the recipient chief each time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Taolu said he was weakened by Enamakala's death, offered his own valuables
    as lula, and asked to return to villages and resume gardening in peace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Moliasi and other Tilataula chiefs gave return lula, item for item, matching
    the valuables received, and made speeches accepting Taolu as guiau.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Meiosivalu said fighting had been undertaken as payment for relatives' deaths
    and the burning of his home, but that the present kabilula settled the matter.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Taolu offered tobacco to be distributed for a shared pipe of peace; its acceptance
    completed the kabilula, and later former enemies welcomed Taolu's people back
    with food and help rebuilding.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
