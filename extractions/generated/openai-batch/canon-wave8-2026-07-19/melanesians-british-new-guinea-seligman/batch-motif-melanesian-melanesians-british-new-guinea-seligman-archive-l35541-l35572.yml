canonical_text:
  quote: ''
  summary: The passage describes Dabadabagigira at Wagawaga as a small feast held
    the day after the toreha. Reserved pigs are killed and eaten with gendered preparation
    and eating arrangements. Afterward feast debris is thrown into the sea and women
    sweep the hamlet. The text states that this cleanup is practical, not part of
    the toreha ceremony, and that interpretations about sweeping away spirits of the
    dead were denied. The watara is left to decay, and the name is glossed as meaning
    “sweeping the scraps away.”
  language: English
  quote_policy: summarized
