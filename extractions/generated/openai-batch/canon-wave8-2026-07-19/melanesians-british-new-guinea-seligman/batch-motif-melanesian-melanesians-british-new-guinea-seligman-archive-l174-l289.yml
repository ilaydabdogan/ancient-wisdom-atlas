  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Redlick Islets people divide the south-eastern archipelagoes
    into Konabeai, east of Mewstone and Brooker, and Roroman, west of those islands.
  category: relationship
  evidence_refs:
