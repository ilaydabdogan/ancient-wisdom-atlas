canonical_text:
  quote: ''
  summary: The preface describes Massim regional classifications, a Louisiades east-west
    division reported by Dr H. O. Forbes, the continuity of a linked-totem system
    across the Massim area, inferred connections between Tubetube, Duau, and the D'Entrecasteaux
    Group, and the author's assessment of informants, interpreters, manuscript reviewers,
    and other contributors.
  language: English
  quote_policy: summarized
