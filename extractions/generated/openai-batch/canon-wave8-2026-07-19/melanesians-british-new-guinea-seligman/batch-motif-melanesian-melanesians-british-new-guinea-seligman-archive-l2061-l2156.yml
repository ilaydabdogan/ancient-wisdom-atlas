canonical_text:
  quote: ''
  summary: The passage describes Motu and allied coastal and inland groups, the distribution
    and importance of open ceremonial platforms called dubu, and Sinaugolo traditions
    that the dubu began among them after an emergence from an ancestral cave or hole
    on Mount Taborogoro. It also reports migration and dispersal traditions concerning
    the Sinaugolo and Garia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Motu and closely allied tribes are described as occupying coastal settlements
    from Redscar Head to Kapakapa, with Ikoro, Gaboni, and Sinaugolo nearby or inland.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sinaugolo are described as a powerful and influential tribe with villages
    extending from hilly country behind Kapakapa up the Kemp Welch, Hunter, and Musgrave
    river valleys.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ahuia is identified as the hereditary chief of the Port Moresby Koita and
    as a representative portrait example of a Western Papuo-Melanesian.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Open ceremonial platforms called dubu are said to exist among the Motu and
    their kindred coastal tribes; among the Motu, Tupuselei and Gaile are said to
    have large dubu.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lakatoi are described as composite craft made of several dugout canoes and
    used by the Motu on sago trading expeditions called hiri.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gaile inhabitants state that the settlement founders were two bushmen named
    De Bori and Gai Bori.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that open dubu are larger, better carved, and more important
    in the Rigo district among the Sinaugolo, Garia, and related tribes than elsewhere.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: According to the Sinaugolo, the dubu originated among themselves and was later
    adopted by neighboring tribes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Sinaugolo legend says that the Sinaugolo came from their ancestral cave
    on the slopes of Mount Taborogoro with one carved post, made three more posts
    from its model, and used these as the corner posts of the first Sinaugolo dubu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author suggests that the open dubu may have originated with the Sinaugolo
    or a cognate tribe near Taborogoro and then spread toward the coast and westward
    through mountain territories.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports that Sinaugolo migrated toward the coast from Taborogoro,
    while Garia migrated westward across their track; both are said to have carried
    dubu customs with them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Sinaugolo legend says that the Garia and Sinaugolo once lived in a hole
    in the earth on Mount Taborogoro, increased in number, reached the surface, and
    went in different directions.
  category: sequence
  evidence_refs:
  - ev:9
