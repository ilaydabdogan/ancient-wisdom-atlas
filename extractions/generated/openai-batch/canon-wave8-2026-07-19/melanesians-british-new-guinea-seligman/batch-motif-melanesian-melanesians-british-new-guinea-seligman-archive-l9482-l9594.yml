canonical_text:
  quote: ''
  summary: The passage describes figures in the maginogo dance, especially the tahaka
    or bowl figure. It recounts an origin story in which an unnamed man working in
    his garden finds a stone later called Eyamune, with a bowl-like hollow full of
    unusually clear still water. He drinks, washes, splashes himself, combs his hair,
    composes a song, and later tells his village, whose dancers add the story and
    song to maginogo. The passage then describes a danced version in which men place
    a pot of water on the ground, move squatting around it, splash themselves, and
    repeat the action at several positions before exiting between columns.
  language: English
  quote_policy: summarized
