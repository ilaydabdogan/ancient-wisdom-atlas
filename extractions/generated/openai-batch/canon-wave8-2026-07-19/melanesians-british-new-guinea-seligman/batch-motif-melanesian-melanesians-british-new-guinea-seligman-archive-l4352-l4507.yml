canonical_text:
  quote: ''
  summary: The passage describes Koita dubu construction and social claims around
    corner posts, explains a Tupa iduhu claim to a post at the new Hohodai dubu, states
    that dubu are generally built for tabu feasts and oriented toward the dubu associated
    with a challenging feast, and discusses carved corner-post terminals and iduhu
    dagina or clan-badge carvings, including uncertainty about carved human-head forms.
    It also states that the Koita have no legends of the origin of the dubu known
    to the author.
  language: English
  quote_policy: summarized
