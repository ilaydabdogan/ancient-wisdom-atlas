canonical_text:
  quote: ''
  summary: 'The passage describes parts of a funeral procedure: a grave is dug, grave-diggers
    receive food and mark their claims with sticks kept as a tally by a close male
    relative of the dead man, the body is carried by men who repeatedly exchange places
    because the corpse is considered dangerously contagious with aina, former village
    burial is explained by a statement distinguishing humans from pigs and dogs, and
    fires are lit on and around the grave for the first four nights until the venedairi
    feast. The final sentence is cut off after mentioning the dead man''s wife and
    "near".'
