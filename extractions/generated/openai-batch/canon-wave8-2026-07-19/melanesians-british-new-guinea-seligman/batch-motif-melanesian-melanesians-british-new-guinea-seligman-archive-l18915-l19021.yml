canonical_text:
  quote: ''
  summary: The passage describes Mekeo chiefly succession and war offices within pangua.
    It explains adoption into chiefly families, the roles of the civil chief and war
    chief, the public recognition of a war chief, the relation between military leadership
    and warfare magic, a pre-raid ritual performed by a faia expert, and a pig-cutting
    ceremony connected with hereditary chieftainship. It also makes explicit comparisons
    with Roro-speaking and Paitana offices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adoption is common among chiefly families, and an adopted son is treated as
    the son of the adoptive father and may succeed to chieftainship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief may adopt the son of the leader of an immigrant group joining the
    village, so a lopia fda may sometimes not be of the blood of the hereditary chiefs
    of the clan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The io lopia may send panicles of areca nuts as an invitation to other war
    chiefs; those who accept and chew the nuts must help him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When others accept his areca nuts, the io lopia becomes commander-in-chief
    and an active combatant.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before battle, the io lopia usually invokes the name of his ufu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: During feasts and ceremonies after successful warfare, the io lopia acts as
    chief, receives presents, and takes the lead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The lopia fda usually does not take part in fighting unless the battle results
    from a surprise night attack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The lopia fda can stop hostilities by parading unarmed between the combatant
    lines and shaking lime from his gourd.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: An io lopia becomes possible only after a lopia fda has been officially recognized,
    and public declaration of an io lopia requires a big feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The dignity of io lopia could only be assumed by a man who had killed an enemy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that victory was given by the magic of the faia expert
    rather than by the war chief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The faia expert medicines the warriors of his group of villages before fighting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Only a few pangua possess a faia expert, and one such expert may serve several
    pangua or villages while also holding chiefly functions in his own pangua.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the described pre-raid procedure, the faia expert accompanies the attacking
    force, halts near the hostile village, spits on a leafy axis of ofe, strikes toward
    the village, passes the ofe under his right leg, strikes again, and murmurs low
    spells intended to make the enemy sleep heavily.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When the attackers are near enough to rush the village, the faia expert strikes
    their spears with the ofe, crouches with the ofe doubled under his belly, blocks
    his ears with his fingers to make the enemy deaf, and each warrior jumps over
    him during the rush.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: When a lopia fda cuts up a pig, he removes the fat in large slices.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: A youth undergoing the ceremony qualifying him for hereditary chieftainship
    ceremonially dismembers a pig while an old chief advises him and may guide his
    hand.
  category: sequence
  evidence_refs:
  - ev:7
