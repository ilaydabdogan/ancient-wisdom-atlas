canonical_text:
  quote: ''
  summary: 'The passage recounts actions of Oa Rove: an evening encounter involving
    a woman returning from water; enlargement of a wallaby by blowing on it; fishing
    and travel by canoe near Eboa; making a hill used for exposing the dead; tribes
    coming to recover women from him; distribution of characteristic weapons and sorcery
    to named groups; and the apparent transformation of returned women into hills.'
  language: English
  quote_policy: summarized
