  quote: ''
  summary: The passage describes the Wagawaga toreha, a delayed collective feast after
    deaths. It covers preparatory house-building, dancing, collection of pigs and
    garden produce, pig-killing, construction of a platform, a mock assault by visitors,
    and distribution of meat and vegetables to visitors by name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A toreha is described as a big feast that should occur about a year after
    a death, but may be delayed; one feast covers all deaths in the community since
    the last toreha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: New houses are built before the feast, with the whole hamlet-group helping,
    and youths and girls spend much of each night dancing while the houses are built.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The house-building is timed to finish two or three days after a new moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pigs and garden produce are collected; women gather vegetable food, and young
    men collect firewood for cooking vegetables given as piyo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pigs are caught, secured under the houses, killed for the feast, singed with
    burning coconut leaves, cut up on the seashore, and taken to the watara platform
    with vegetable food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Woka, a Garuboi clan man, is identified as tankiaga, the chief of the feast
    or master of ceremonies, for the Kanabwahi toreha described.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men from other Wagawaga hamlets blacken themselves, wear feathers associated
    with former warfare, and perform a mock assault called waiapa as they enter Kanabwahi.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The Kanabwahi men blow conch shells to begin the ceremony when food is piled
    on the watara.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: During the mock assault, visitors throw spears and stones toward Kanabwahi
    men and houses, and thrust spears into house thatch and the watara, while trying
    not to injure people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Kanabwahi man throws a joint of pig flesh to the ground while calling the
    intended visitor’s name; the recipient takes no notice and another person picks
    it up for him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Meat and vegetable portions called yope are distributed to all visitors alike,
    including gariauna and people who exchanged banahivi and melum.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Visitors and guests from neighbouring hamlets do not dance at the toreha;
    they carry the presented food to their own hamlet to cook and eat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A note reports that insulting remarks added during the naming and flinging
