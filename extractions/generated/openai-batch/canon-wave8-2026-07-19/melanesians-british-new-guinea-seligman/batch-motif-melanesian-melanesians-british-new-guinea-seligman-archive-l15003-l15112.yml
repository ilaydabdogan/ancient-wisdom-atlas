canonical_text:
  quote: ''
  summary: 'The passage describes aruaru initiation ceremonies for boys and older
    lads: red painting, confinement in the back compartment of an aruaru marea, instruction
    by older men, craft-making, controlled feeding, feasting and dancing, periods
    of seclusion, fasting, mask and ornament making, wearing of dancing instruments
    and ornaments, transfer of ornaments to fully initiated men, and a subsequent
    hunting episode. A note also summarizes a related Lese/Elema boys'' initiation
    sequence involving a bark belt, seclusion, craft instruction, red oil, herbs,
    and post-seclusion display.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys about ten years old and older lads approaching puberty, all called miori,
    were initiated together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The initiates were painted red and confined by day for about two months in
    the back compartment of an aruaru marea; at night they could leave but not visit
    their parents' houses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Older men visited daily and directed the initiates in making armlets, belts,
    leglets, anklets, and wristlets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relatives prepared food for the initiates, and younger boys passed it through
    small holes in the side of the back compartment of the marea.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An aruaru chief supervised the process and, when he judged the boys trained,
    ordered a feast with pigs, cooked food, and a dance involving men and women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the dance, men wore the iu, a gong- or rattle-like instrument suspended
    from the waist.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the first seclusion, the initiates left the marea without ceremony and
    returned to their parents' houses, where their mothers initially feigned not recognizing
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After a period in the village, the aruaru were secluded again in the marea
    for about a month and were supposed to fast for one day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: During the fast, pairs of boys were expected to open and eat at least one
    coconut without making noise while breaking the shell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the chief approached noisily, the aruaru assumed postures of hunger and
    fatigue; the chief then called for food, which he and other old men brought to
    them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: During later seclusion, old men showed the initiates how to make iu, mask
    frameworks, dancing plumes, pearl shell crescents, masks, and basket-work ornaments.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The initiates came out at intervals wearing masks and ornaments to dance,
    then returned to the marea and discarded the ornaments.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: The ornaments made by the initiates became the property of older, fully initiated
    men called buiapu, who had taught them.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: The buiapu and initiates went wallaby hunting, with the initiates leaving
    the village at night and meeting the buiapu soon after daybreak.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: A note records a Lese/Elema initiation sequence in which a boy receives and
    later makes a hibiscus bark belt, enters seclusion, learns to make ornaments,
    and later appears with red-colored coconut oil, fragrant herbs, and companions
    from the same seclusion period.
  category: sequence
  evidence_refs:
  - ev:14
