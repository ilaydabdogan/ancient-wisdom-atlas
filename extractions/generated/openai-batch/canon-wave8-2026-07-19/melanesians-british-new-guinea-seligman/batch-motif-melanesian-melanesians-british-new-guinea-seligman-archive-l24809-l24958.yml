literal_observations:
- id: obs:1
  text: Certain Tubetube men are said to have rights in land on Narunaruwari, where
    the Hanawesu stock formerly made a settlement after a quarrel with Lekekeu; the
    Hanawesu later returned to their present Tubetube site.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A recent immigration of a stock or stocks called Koiaria by Tubetube people
    is said to have peopled Naruwaruwari, though the passage says its present inhabitants
    are not certainly only Koiaria.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bartle Bay is described as a shallow crescent-shaped indentation on the south
    coast of Goodenough Bay, with hills, a narrow plain, terraces, the Wamira River,
    another smaller stream, and fertile gardens.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wedau and Wamira settlements stretch along much of the pebbly beach; their
    houses are usually low, oblong, and built on the ground, though some are on piles.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wedau and Wamira people are said to present practically no differences in
    physical character and habit and to share many customs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: People in small settlements in the hills behind Bartle Bay closely resemble
    Wedau and Wamira people, though they speak a different dialect; Gelaria is named
    as an inland district and former settlement, with associated hamlets and upstream
    communities.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wamira is divided into Wadubo, the older western part, and Rumaruma, the eastern
    part; Rumaruma is said to have developed when Wadubo people began living in their
    gardens and building better garden houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rumaruma is said to have become somewhat estranged from Wadubo and to have
    elected its own chief after paying little attention to the Wadubo chief.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: During scarcity, people of Radava came to Wamira, made friends with the Iriki
    clan, received garden land from them, and settled at Wadubo.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wamira melagai may consist of a single clan but more usually contain houses
