canonical_text:
  quote: ''
  summary: 'The passage describes name-giving practices: names are not sex-specific;
    children are usually named soon after birth but may be named before birth; all
    children have two names, one from the father and another from a relative or friend;
    a name may be given in connection with a favor; some male children take both paternal
    names in inverted order; and a name-giver assumes no actual or moral responsibility
    for the child.'
  language: English
  quote_policy: summarized
