canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking marea or clubhouses as named chiefly
    structures associated with office, rivalry, feast reciprocity, carved posts, and
    differentiated weapon storage. It records practices of calling out marea names,
    the building of separate or joint marea by different chiefly figures, the display
    and removal of animal bones after reciprocal feasts, the responsibility of chiefs
    and expert carvers for carved posts, and the exclusion of weapons from the ovia
    itsipana's marea while battle marea and paiha marea stored weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vegetable food was not hung up or displayed in quantity on the marea before
    a feast, unlike the custom in the area of the open dubu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A warrior might call out the name of his marea when striking a blow or when
    very tired.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Father Cochard did not understand the name-calling practice as conscious animism;
    the note instead connects it with mana or virtue inherent in the name of the marea.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Mou, marea other than those of the ovia itsipana were called a term translated
    as 'jealousy marea'; the name Iwamuru of an Aitsi Noobira clan marea was also
    said to mean jealousy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Accounts explain some separate ovia awarina marea as resulting from conflict
    or quarrels with the ovia itsipana.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Two weak clans could unite to build a common marea, with the right side built
    by the ovia itsipana of one clan and the left side by the ovia awarina of another.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Each half of such a common marea bore the proper name of the marea of the
    responsible chief and was considered a marea itself, even when the whole building
    was usually referred to by the name of the right-side group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bones such as pig jaws, pig skulls, or dog skulls could be attached to the
    marea walls or temporarily exhibited there after a feast given by another clan.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Displayed bones served as a memento of the ceremony and as a memorandum that
    the clan or local group should return the compliment with a reciprocal feast.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: After a return feast had been given, a skull could be taken from the marea
    and thrown away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Chiefs were responsible for maintaining the marea and providing carved marea
    posts, while expert craftsmen in each settlement produced the best carving in
    practice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Poa Oa was remembered as an esteemed carver; he taught his son Maoni Poa,
    who was carving posts in 1904 and was expected to teach his son Oa Maoni.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Spears and clubs were not brought into or onto the marea of the ovia itsipana,
    but spears, clubs, bows, and arrows were brought to the battle marea and stored
    there, as also in paiha marea.
  category: action
  evidence_refs:
  - ev:10
