canonical_text:
  quote: ''
  summary: 'The passage describes forms of cannibalism in the southeastern district:
    most often as revenge between enemy communities, sometimes for pleasure or against
    strangers and weak visitors, and more rarely through exhuming recently buried
    bodies. It includes Laido’s testimony about four stranded Kurada people killed,
    cooked, and eaten, and an account of Barabara traders ambushed by Maivara men.'
  language: English
  quote_policy: summarized
