canonical_text:
  quote: ''
  summary: The passage describes mortuary food displays, widow mourning practices,
    the ceremonial ending of food taboos, removal of mourning pigment and ornaments,
    funeral roles when a woman dies, mourning behavior of widowers and siblings, and
    the reciprocal exchange of banivi mourning feasts among named Wedau and Wamira
    clan groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: About thirty food trophies are described, each based on a large basket of
    yams and a stick frame filled and piled with yams, ending in a single yam at the
    top.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional foods, including pigs, coconuts, prepared sago, and yams, are suspended
    over house platforms on wooden frames.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After preparations are complete, the widow throws herself on the ground and
    wails and sobs, joined by several relatives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman presents cooked yam, pork, fish, taro, and sago to the widow in turn;
    the widow smells and eats each item, and the woman publicly names the food eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The eating ceremony ends the period of fasting from those foods by the widow
    and her clan, and mourning tokens or dress are removed from the widow's neck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After removal of black mourning pigment, the widow is free from her taboos,
    and food intended for the gariauuna is given to them by the dead man's brother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Brothers do not wear mourning for each other; a sister mourning for a brother
    wears string mourning neck ornaments but does not blacken herself, wear a long
    petticoat, or abstain from sea-bathing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Women in mourning are associated with hair matting into long curling locks
    called doiona, though the passage notes this hair form may not be strictly limited
    to mourners.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When a woman dies, her bara or game, identified as her gariauuna, take the
    chief part in her funeral ceremonies.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A dying woman is supported by her husband or children; her children close
    her eyes, place ornaments, and arrange her hair, while her sister, mother, or
    daughter puts on a new petticoat.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A dead woman is carried to the grave by her game, or if they are unavailable
    by her children; her children follow her to the grave, but her husband does not.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: For a woman's death feasts, food is provided by her children, with sisters
    supplying any deficit if needed.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: A widower remains in the house wearing a daam mat and an old perineal bandage
    until after the first kanekapu, blackens himself after two or three days, and
    has his black pigment washed off by his children at the rigariga.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At Bartle Bay, a widow wears a coarse shredded coconut-leaf petticoat, blackens
    herself, and wears widow mourning neck ornaments.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: A Bartle Bay widow appears not to wear cane mourning armlets until one or
    more of the dead man's pigs are ready to be killed for the first mourning feast,
    called banivi; one cane armlet is said to correspond to each pig.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The banivi mourning feast is described as reciprocally exchanged between individuals
    of component clans within clan-groups practicing group exogamy.
  category: relationship
  evidence_refs:
  - ev:16
