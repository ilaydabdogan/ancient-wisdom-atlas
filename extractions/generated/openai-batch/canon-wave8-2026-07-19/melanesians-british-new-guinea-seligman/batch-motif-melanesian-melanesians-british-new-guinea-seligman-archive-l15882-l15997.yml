canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking accounts of sorcery involving snakes,
    crocodiles, magical stones, plants, ritual methods for obtaining a snake stone,
    scent-based direction of snakes toward victims, neutralization of the snake stone
    in salt water, and the contents of a seized sorcerer's bag.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In this section, sorcery is limited to magical practices for producing disease
    and death and efforts to cure disease so produced.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two media said to be most frequently used by sorcerers are snakes and
    magical stones; leaves and roots of several plants are also part of a sorcerer's
    kit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The black snake called aiurama is described as the animal commonly employed
    by sorcerers to kill people who have offended them; crocodiles are also reported
    in some cases as sent by sorcerers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sorcerers are said to obtain from the black snake a deadly stone that kills
    any individual touched with it.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:5
  text: One informant said there is a plant known to sorcerers which, when rubbed
    on the hands, enables snake-handling without fear of being bitten.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A sorcerer seeking a snake stone fasts for two weeks, stays alone in the bush,
    avoids seeing women, and dreams of a black snake living in a hollow tree or creek
    bank.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sorcerer protects his limbs with strips of native cloth and uses a multipointed
    spear-like instrument to lift the exposed stone without touching it, then drops
    it into bamboo.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The snake stone is described as red, hot, and about the size of a filbert;
    when dropped into salt water, the water hisses and bubbles until the stone becomes
    harmless.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sorcerers are alleged to keep snakes in cooking pots, either in the bush or
    in a dark corner of the house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cloth fragment or object retaining a victim's body scent is placed in a
    warmed pot with a snake, after which the snake is released near the victim and
    follows the scent to bite him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A related method uses a magic stone smeared with a strong-smelling substance
    to touch the intended victim, then releases a snake attracted by that scent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Magical stones are carried with miscellaneous objects in a mahawa netted bag;
    one seized bag contained a necklace, packets of medicine, a stone in a bamboo
    holder, mourning gear, bone needles, a hair comb, a coconut vessel, and a partly
    made stone adze.
  category: object
  evidence_refs:
  - ev:8
