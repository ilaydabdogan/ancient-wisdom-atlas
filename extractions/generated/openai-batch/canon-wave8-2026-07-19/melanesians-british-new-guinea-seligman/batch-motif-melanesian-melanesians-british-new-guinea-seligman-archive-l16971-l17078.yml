canonical_text:
  quote: ''
  summary: 'The passage recounts Oa Rove’s revenge after being mistreated: he takes
    women, gives weapons and destructive practices to villages, and causes death.
    A variant presents him as a wise, snake-like skin-changing child who is adopted
    elsewhere, excels at fishing and hunting, is robbed and beaten, shapeshifts, raises
    the women to his place, and later gives men weapons, a charm stone, and conditions
    for lost immortality. Other variants explain flies and mosquitoes from fallen
    corpses or from a buzzing bamboo opened in water.'
  language: English
  quote_policy: summarized
