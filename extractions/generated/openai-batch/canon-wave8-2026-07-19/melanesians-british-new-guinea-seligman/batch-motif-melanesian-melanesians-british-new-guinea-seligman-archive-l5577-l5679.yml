canonical_text:
  quote: the ground on which it stands descends rigidly in the male line
  summary: The passage describes Koita rules and examples for disposal of a dead man's
    house, house site, land, coconut trees, floor boards, and personal property, including
    widow residence, male-line succession to house sites, limited claims of daughters
    and their children, and named cases involving Maiago and Ovaketa.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man's house is treated as real property, but among the Koita it is commonly
    allowed to rot; the ground on which it stands descends in the male line.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man dies without wife, brothers, sisters, or children, his house is allowed
    to rot and another house may later be built on its site; if no widow or children
    occupy it, a brother or sister may do so, though this is said to be rare, and
    no one else may occupy it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A widow may remain in her dead husband's house or return to her family; if
    childless and she returns, the use of the husband's land reverts to his nana and
    roro, as it does at her death or remarriage if she remains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a widow with children leaves the house, the floor boards are divided among
    the dead man's nana, roro, raimu, children, and the widow; the boards are described
    as valuable because of the labor needed to make them and are preserved when the
    rest of the house rots.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dead man's coconut trees are divided among his brothers, sisters, and children,
    with boys said to receive more than girls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A dead man's land is divided among his children, but daughters are described
    as having only a life interest; their children may make gardens on their mother's
    land with the understanding that the land belongs to the mother's kinsmen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: If a man dies childless, his land and coconuts go to his brothers, sisters,
    and raimu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The site on which a man's house stands descends to his sons or, failing sons,
    to his nearest male kinsman; a man's hereditary house site is described as the
    only place where he may build a house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Maiago case, no one moved into his house; because he had no son, the
    house was expected to rot, and his half brother Mabata Maiago was expected later
    to build on the site.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maiago's coconut trees were to be divided between his sisters and children;
    his land-use rights were to go to his daughters; his dog, a fine armshell, dugong
    net, knife, dog tooth necklace, and strings of tautau were assigned or divided
    among named kin categories and persons.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Ovaketa case, his son Rabura Kogi took possession of the house, and
    one wife, Keranoboka, continued to live there with that son; the other wife, Diara
    Ova, had run away before Ovaketa's death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rabura Kogi distributed customary armshells and other articles of adornment
    among his father's nana and roro and then was practically residuary legatee; Ahuia
    Ova received nothing because his mother had run away and he had been adopted by
    her brother Taubada.
  category: relationship
  evidence_refs:
  - ev:8
