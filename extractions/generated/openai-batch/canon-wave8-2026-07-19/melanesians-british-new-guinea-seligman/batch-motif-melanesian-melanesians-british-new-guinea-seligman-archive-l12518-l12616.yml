  quote: ''
  summary: The passage describes Roro-speaking chiefly offices, war leadership, feast
    invitations and food distribution, senior chiefly precedence, the ceremonial office
    of pig-cutter, magical war specialists, and hereditary succession rules including
    female interim office-holding and a qualifying ceremony for heirs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In serious intertribal warfare, the ovia ahuahu is described as organizer
    of his clan but subordinate on the battlefield to paiha chiefs; in faction fights
    or quarrels between friendly groups, the ovia ahuahu leads the war party.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Larger questions of campaign policy are discussed by village old men and settled
    with the concurrence of the ovia itsipana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Important feast invitations are issued in the name of the ovia itsipana; the
    ovia awarina is instructed to send messengers carrying bunches of areca nut to
    hang in the marea of invited local chiefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Big feasts are given in the name of two chiefs of the food-providing clan;
    the named chiefs distribute the food and ceremonially taste it but do not eat
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At feast distributions, visiting itsubu chiefs receive pig portions such as
    the head or half head, hams, and forelimbs according to their importance.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Parama Kupunu is described as the oldest Roro itsubu; its ovia itsipana formerly
    exercised authority over the Roro tribe, held the title ovia pakana kauna, and
    still takes precedence at feasts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ovia akiva, called chief of the knife, ceremonially cuts up pigs at big
    feasts but does not kill or cook them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Paiha ovia are described as magical departmental experts, with paiha matters
    treated under magic.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:9
  text: Chieftainship of the right, left, and war, as well as the akiva function,
    is hereditary and passes from father to son as far as possible.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: If an ovia itsipana has no son, his eldest daughter may act until her eldest
    son is old enough; a woman who holds ovia itsipana or ovia akiva does not enter
    the marea, and her husband or son takes her place there and at festivals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A woman cannot be ovia awarina because the office is associated with having
    killed a man and leading the clan in war; if the direct male line ends, a male
    substitute is sought from collateral lines.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A male heir to chieftainship is not recognized as chief at his father's death
    unless he has taken part in the ceremony called at Siria bearai.
  category: sequence
  evidence_refs:
  - ev:10
