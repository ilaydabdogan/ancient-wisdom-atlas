literal_observations:
- id: obs:1
  text: At Wagawaga, the passage says it was denied that any man had more than one
    wife at the present day; in earlier times very few had two wives, because the
    old and new wife were said to quarrel persistently and the first wife might return
    to her parents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Tubetube, polygyny was said to have formerly existed to a limited extent;
    each woman had her own house, and quarrels between co-wives were described as
    uncommon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Tubetube, there was reportedly no rule about how much attention a man should
    give each wife, and it was assumed that one wife would naturally become the favourite.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that in the southeastern district many valid marriages formerly
    lasted only a short time and could be dissolved by mutual agreement or without
    strong opposition; this was said still to occur where government and missionary
    influence had not been exerted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Where no considerable wedding price was paid, wedding celebrations could consist
    of reciprocal presents of equivalent value and often identical nature.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that an individual could be successively married to various
    women in neighbouring hamlet-groups, or within hamlets of one hamlet-group, without
    any of the wives having died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tauyareke first married Bonowaia of Maivara and lived with her for about two
    years at Maivara; their daughter sometimes came to Wagawaga to be with her father,
    but Bonowaia did not accompany her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tauyareke next married Sinebea of the Rabi hamlet-group while she was stopping
    at Wagawaga; she came to his hamlet at Wagawaga Pupuna, lived with him for two
    years, and no children were born.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tauyareke later married Hewaako of Taradiu hamlet, built a house at Taradiu,
    made a first garden on Taradiu ground, later made another garden on Wagawaga Pupuna
    ground, and kept both gardens going while living at Taradiu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tauyareke’s father-in-law lived in the old man’s potuma, and his food was
