  summary: The passage describes limited polygyny at Wagawaga and Tubetube, instability
    of some marriages where substantial wedding payments are absent, and the successive
    marriages of Tauyareke, including movements between hamlets, houses, gardens,
    and affinal obligations.
  language: English
