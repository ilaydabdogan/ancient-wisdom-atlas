canonical_text:
  quote: ''
  summary: 'The passage describes Koita and related song-and-dance practices: dances
    at feasts with instruments, named song classes tied to particular occasions, strict
    ownership of songs and dances, purchase of performance rights, reported borrowing
    from Motu and eastern sources, and short explanations for several named songs.'
  language: English with Koita and Motu terms and song texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dancing occurs at almost all feasts and is commonly accompanied by songs,
    drums, dancing sticks, and rattles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rattles are made from Pangium edule seeds and may be tied to dancing sticks;
    small wooden gongs called sede replace drums in dances associated with the hiri.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Many Koita dances may be performed for amusement, but some dances are said
    to belong to appropriate occasions and formerly may have been less freely performed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Songs for particular occasions are grouped into named classes, and songs and
    dances are often identified by the first few words of a song.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Songs and dances are described as strictly copyrighted; unauthorized use could
    formerly lead to war, and legitimate access could be obtained by purchase.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Hohodai people obtained the right to use the song and dance maginogo through
    a transaction involving Abau Rohi and the Yarogaha chief Keta Vahu.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Named song classes are associated with activities and occasions including
    garden fencing, dirges, lakatoi and hiri contexts, dances, feasts, the tabu feast,
    funeral feasts, hekarai, and homicide.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The origins of most songs are described as obscure, and many words are said
    to be unintelligible; some songs are said to be recent inventions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Vaura group is said to have travelled from the east, but the route is
    uncertain, and its words are said not to resemble modern Koita.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:11
- id: obs:10
  text: Irimabera is sung while fencing a garden only when the singer or singers spent
    the previous night with a girl; when sung as a dirge it does not imply recent
    cohabitation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ogonimabia is said to have been made by a Yawai boy who was returning from
