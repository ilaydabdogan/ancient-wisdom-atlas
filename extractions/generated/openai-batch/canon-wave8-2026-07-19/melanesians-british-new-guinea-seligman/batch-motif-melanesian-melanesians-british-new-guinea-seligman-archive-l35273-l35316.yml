  quote: ''
  summary: The passage describes customs at Wagawaga and Tubetube concerning houses
    formerly occupied by the dead. At Wagawaga, conditions are said to be much the
    same as at Tubetube, though a sister might move into a dead sister's house only
    rarely. Tubetube examples describe surviving spouses or children sometimes continuing
    residence, while houses may later be broken up, burnt, left to rot, or abandoned
    depending on kinship and household circumstances.
