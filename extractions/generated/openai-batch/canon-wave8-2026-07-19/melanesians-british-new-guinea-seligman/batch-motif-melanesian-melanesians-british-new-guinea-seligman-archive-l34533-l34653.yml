canonical_text:
  quote: ''
  summary: The passage describes mourning practices at Wagawaga and Tubetube, including
    blackening the body, wearing mourning ornaments and garments, seclusion or avoidance
    of ordinary paths, food taboos, restrictions on relatives of the deceased, funeral
    feasts, and the removal or alteration of mourning dress near the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, a widow blackens herself a few days after her husband's death
    and wears specified neck ornaments, armlets, and a long petticoat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, before the first banahivi the widow stays in the house or avoids
    ordinary paths and people when going out; after the first banahivi she resumes
    ordinary activities such as fetching water and gardening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Wagawaga, the widow keeps mourning until the last banahivi and avoids taro,
    pig, and kangaroo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Wagawaga, the deceased person's children wear mourning ornaments, blacken
    themselves until the last banahivi, and sons wear an old fishing-net perineal
    bandage as a sign of mourning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Wagawaga, a man avoids coconuts, pigs, and areca nuts from his dead father's
    hamlet for life, and generally avoids the hamlet, potuma, and even ordinary passage
    through it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Wagawaga, fathers, mothers, brothers, and sisters of the deceased observe
    different mourning marks and restrictions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Wagawaga, children of a deceased woman go to their mother's hamlet after
    the first banahivi and stay with their mother's sisters; both sexes wear armlets
    and necklaces until the last banahivi, but black is not worn for a mother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Wagawaga, a widower observes the same food taboo as a widow, blackens himself,
    wears mourning items, and keeps some mourning dress until the last banahivi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Tubetube, the widow and children remain in the house until the first funeral
    feast; if the widow had lived in her husband's hamlet, she then goes with the
    children to her own hamlet.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Tubetube, elder children and the widow are secluded while the gariauuna
    remain on the grave, and when going out they use the back of the house; the widow
    wraps herself in a mat so only a small part of her face is visible.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At Tubetube, on the second or third day after burial the widow and children
    blacken themselves and abstain from fish, taro, and pig.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: At Tubetube, after about ten days, when the gariauuna have left the grave,
    the widow and children go quietly to the garden and later kill a pig for the first
    kanekapu ceremony.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: At Tubetube, after the first kanekapu ceremony the widow and children may
    mix with others, and the widow may return to her own hamlet if she had lived in
    her husband's hamlet.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At Tubetube, the widow wears string necklaces, a basket-work cap, creeper-cortex
    armlets, and a long petticoat; she continues wearing selected mourning items and
    does not wash off the black paint.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: At Tubetube, at the rigariga feast preparation a brother of the deceased takes
    the widow and children to the dead husband's hamlet, where the dead man's sister
    or mother removes their mourning; the widow's petticoat is cut short by the grave
    and the pieces are hung on the grave fence.
  category: sequence
  evidence_refs:
  - ev:15
