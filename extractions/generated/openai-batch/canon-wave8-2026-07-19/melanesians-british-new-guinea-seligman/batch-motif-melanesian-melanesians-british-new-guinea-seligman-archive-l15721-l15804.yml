canonical_text:
  quote: ''
  summary: 'The passage describes Roro-Mekeo beliefs about magic and sorcery, the
    secrecy surrounding such knowledge, the association of some specialists with warfare,
    and the view that ordinary deaths of vigorous people are caused by sorcery. It
    also describes ambivalent social relations with sorcerers: they may be accepted
    as village members and protectors, may inherit power, but may be killed or expelled
    if accused of harmful interference.'
  language: English
  quote_policy: summarized
