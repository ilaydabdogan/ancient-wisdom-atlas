canonical_text:
  quote: ''
  summary: 'Ethnographic discussion of death beliefs and avoidance customs in parts
    of the Massim district: the dead pass under the earth to another world where an
    old man assigns them a place; spirits are not generally propitiated or feared
    as active agents among the living; death feasts and mourning customs affect particular
    hamlets and clans; people outside the dead person''s clan dissociate themselves
    from the dead person, belongings, house, grave, name, and associated food or objects.
    An incident at Tubetube illustrates refusal to reclaim a basket taken near a father''s
    grave.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the district areas known to the author, supernatural beings are not worshipped;
    mythical beings and ogres are believed to exist but are not propitiated.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead are said to pass under the earth to the other world, where an old
    man receives them and assigns each a place; this old man is said to exert no power
    over the living.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spirits of the dead are little regarded, but are considered in an informal
    way to know when important mourning feasts occur; they are not commonly supposed
    to be present at those feasts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The interpretation that mourning ceremonies are held to lay the spirits of
    the deceased is presented by the author only as a working hypothesis.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: An individual's death primarily concerns the dead man's hamlet and one other
    hamlet of his clan, between which certain death feasts are exchanged.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: People who are not of the dead man's clan are said to dissociate themselves
    from him and from everything that belonged to him.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The shades of the deceased are not described as haunting former places, bringing
    disease or bad luck, punishing neglected rites, or helping the living; they are
    said to keep strictly to the other world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The only intelligent communication between the two worlds is said to occur
    when men strong in magical power visit the other world of their own free will.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A house in which a married man or woman has died is commonly allowed to rot
    or is destroyed, either immediately after death or after the surviving partner
    dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author suggests that destroying the house may be connected with avoiding
    intimate association with objects connected with the dead of foreign clans.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: A child may dissociate from everything connected with his father because the
    father belongs to another clan, while the physical relationship and respectful
    treatment of the father are still recognized.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mention of the name of a dead father or paternal uncle in a man's presence
    could lead to a fight, whereas mention of a remote dead relative of the father's
    clan is described as only a breach of etiquette.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Avoidance of taking food from a dead father's hamlet or going there applies
    to that hamlet, not to other hamlets of the dead man's clan.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Tubetube, A. H. Dunning took borrowed baskets near a grave containing the
    father of the owner of a valuable sinapopo basket; the owner refused to take the
    basket back and said he would die if he ate food placed in it.
  category: sequence
  evidence_refs:
  - ev:9
