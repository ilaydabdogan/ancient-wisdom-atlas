  summary: The passage describes how an ikupu may split through the proposal and building
    of a ngove, with support from kin and the assurance of a feast; how weakened groups
    may merge with related groups; how new settlements gain names and recognition
    through feasts, war success, or sorcery specialists; and how smaller or merged
    pangua may be distinct locally while little recognized by outsiders.
