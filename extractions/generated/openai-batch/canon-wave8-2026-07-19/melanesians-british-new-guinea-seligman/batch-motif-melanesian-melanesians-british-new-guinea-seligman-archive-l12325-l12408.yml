canonical_text:
  quote: '"it is sometimes difficult to distinguish between property and dada"'
  summary: The passage describes Roro, Paitana, and Waima practices in which canoe,
    dance, net, bow-and-arrow, and spear names may be group-restricted property or
    dada/oaoa-like badges. It emphasizes uncertainty over whether these names are
    true oaoa, notes associated signs and natural names, and reports that some names
    were bought or stolen from Motu or Toaripi sources.
  language: English
