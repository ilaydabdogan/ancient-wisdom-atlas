canonical_text:
  quote: ''
  summary: The passage describes Biofa, Vee, Mekeo, mountain, Roro-speaking, Lapeka/Rapeka,
    Elema, and Yokea relations through geography, warfare, trade, intermarriage, and
    cultural adoption. It then explains clan distribution and gives an Afai migration
    account in which factional conflict over the origin of the laughing jackass's
    sound leads to bloodshed, village division, and further movement after the bird
    is heard again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Biofa villages are listed as a compact group on the Angabanga, positioned
    between northern and southern Vee villages, and the Vee are said to have often
    been defeated by Biofa in earlier warfare.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mekeo external relations are described as limited by geography; mountain populations
    brought feather ornaments, stone adzes, and clubs for barter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mekeo had fighting, intermarriage, and markets with Roro-speaking and nearby
    coastal groups; at Motura they exchanged bananas and garden produce for fish,
    especially shellfish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lapeka or Rapeka are described as having contributed to the peopling of
    Mekeo villages and as still visiting and intermarrying in the St Joseph River
    valley.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some Mekeo villages, especially Inawi, adopted kaivakuku and Gulf decoration
    for their ufu through contact with eastern Elema tribes of the Papuan Gulf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Biofa are said to be on good terms with Yokea, while Yokea warriors formerly
    attacked the Vee; in one Rarai attack, people climbed coconut trees and were shot
    from the treetops by Gulf natives.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Mekeo villages are described as composed of multiple clans, with parts of
    the same clan in distant villages and Vee clans present in predominantly Biofa
    villages.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The history of Afai is presented as an example of clan portions repeatedly
    coming together, coalescing, separating, fusing again, and wandering apart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The first recorded migration from Afai is traced to faction fights over differing
    explanations of how the laughing jackass's laugh originated.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Old men in Afai assembled in the ufu, lit a fire on the verandah, saw a laughing
    jackass perched on a nearby tree, and debated whether its sound came from its
    mouth or rectum.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Two factions formed, bloodshed occurred, the stronger faction stayed, and
    the weaker party moved near Kevori; after hearing the jackass again, the migrants
    were saddened and moved again.
  category: sequence
  evidence_refs:
  - ev:9
