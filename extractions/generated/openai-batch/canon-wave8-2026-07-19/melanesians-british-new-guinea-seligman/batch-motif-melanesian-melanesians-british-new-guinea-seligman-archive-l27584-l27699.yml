canonical_text:
  quote: ''
  summary: Ethnographic notes describe mourning obligations connected with eriam relations,
    regional terms for kimta and eriam, Bolanai rikam marital privileges, and Mr Newton's
    distinction between kimta as age-cohort membership and eriam as a reciprocal marital-rights
    relationship. The passage also describes am kimta feasts, age-status adjustment
    within kimta groups, and friendly relations among age-mates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a man dies, his own wife and the wives of his eriam mourn him; the wives
    of the eriam use mourning signs but remove them earlier than the deceased man's
    own wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the eriam duties and privileges were collected at Wedau,
    are uncertain for Wamira and Gelaria, and are reported westward around Goodenough
    Bay as far as Mukaua.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Bolanai, kimta is called pata and eriam is called rikam; men of the same
    pata in a community are rikam to one another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Bolanai account, a man abstains from sexual relations with his wife
    from diagnosed pregnancy until the child is weaned, and during this time may have
    access to wives of rikam who are not pregnant and not forbidden by clan.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bolanai account says the man would tell the woman of his proposal, the
    encounter would generally occur in the bush or garden, and the woman would not
    keep it secret from her husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mr Newton distinguishes kimta as a relationship based on being born at about
    the same time in the same year, while eriam is defined by reciprocal rights over
    wives and duties arising from that privilege.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Children of the same age were regarded as belonging to the same kimta, normally
    for life, and males of different kimta ate together at a local feast called am
    kimta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that young people could be degraded into a lower kimta,
    older people could be degraded or advanced, and two or more kimta could be combined
    when age-mates died out.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stated object of am kimta was to impress age positions on the community,
    especially on the rising generation; clan, relationship, and wealth distinctions
    were not applied in the eating groups.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Boys would participate in am kimta around the time they pulled food grown
    by themselves, and they expected invitations to eat with kimta mates in other
    villages.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage characterizes communities as close corporations, with outside
    visits mainly for feasts, commerce, consultation, or other set purposes rather
    than ordinary friendly intercourse.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says kimta relations produced friendly relations from growing
    up together and sharing age-related duties, privileges, memories, and expectations.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says eriam is distinct from kimta, though the terms may overlap
    because same-age men of the same kimta could be mutually eriam and because eriam
    may be used loosely for friends or chums without wife-rights.
  category: relationship
  evidence_refs:
  - ev:10
