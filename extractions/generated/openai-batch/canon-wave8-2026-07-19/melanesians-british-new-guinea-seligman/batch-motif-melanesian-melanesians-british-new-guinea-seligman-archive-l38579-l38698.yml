canonical_text:
  quote: ''
  summary: The passage describes duties, privileges, etiquette, restricted spaces,
    succession rules, and disputed hierarchy among Trobriand and Marshall Bennets
    chiefs, including relations between paramount chiefs, village headmen, commoners,
    clan chiefs, yam houses, platforms, drums, and totem-named clans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's foremost duty is described as presiding at village feasts and ceremonies
    and distributing food suitably to visitors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The toriwaga is said not to be a guyau and not to have the pig privilege,
    but is permitted to build a big yam house, unlike an ordinary person.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moliasi, identified as a toriwaga and commoner, recently disputed Toalu's
    authority, drove him from his village, and burned it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a feast after a house is built for a guyau, the guyau and his toriwaga
    eat together apart from commoners; a guyau may chew betel and eat with toriwaga
    but would not share a lime-pot or eat with a commoner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Toriwaga approaching a paramount chief do so without stooping and speak without
    waiting to be addressed first.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women are allowed on all platforms except those of the yam houses of paramount
    and village chiefs, which are reserved for men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Village drums are habitually kept on the men's platforms or hanging above
    them under the eaves of the yam house.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yams in chiefs' yam houses are stored and removed only by men, usually by
    men of the chief's clan in the case of village chiefs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A commoner approaches his chief in a stooping attitude, often with hands behind
    him or open at his sides, and generally waits for the guyau to speak first.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The office of guyau or toriwaga passes at death to a brother, failing that
    to a sister's son, or to an adopted member of the same clan if direct heirs do
    not exist.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The text states that the chapter's information does not provide evidence for
    a supreme over-lord over the other paramount chiefs of the group.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Several villages denied that Enamakala of Omarakana was an over-lord of other
    paramount chiefs or that other chiefs were subject to him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: It was repeatedly asserted that all paramount chiefs are of equal dignity.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: On each Marshall Bennets island, one man is regarded as head man or chief
    of each clan, and the chief of a traditionally most important clan is recognized
    as chief of the whole island.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: For Gawa, Yoseli of the fish-hawk totem is listed as chief of the whole island,
    while other clan chiefs include Suluyowa of the pigeon totem and Kwadui of the
    frigate-bird totem.
  category: relationship
  evidence_refs:
  - ev:14
