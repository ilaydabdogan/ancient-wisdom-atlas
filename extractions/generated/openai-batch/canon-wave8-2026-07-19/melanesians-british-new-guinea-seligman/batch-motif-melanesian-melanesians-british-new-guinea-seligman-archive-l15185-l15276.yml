canonical_text:
  quote: ''
  summary: The passage describes the tattooing of girls among Roro-speaking groups
    as a gradual process beginning in childhood and culminating in face tattooing,
    a feast, ornamented public display, temporary restrictions, and later recognition
    as ready for marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Girls are put into kiva petticoats without ceremony and before boys assume
    the itaburi; before face tattooing and nubility a girl is called wawaho.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young girls accompany their mothers to gardens and gradually learn garden
    work.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Roro-speaking women are described as tattooed from head to foot; tattooing
    begins at about five to ten years old with the hands and arms.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Later tattooing is done on the belly, chest, and back by an older woman skilled
    in the art, often a relative, who is fed by the girl's mother if the mother does
    not tattoo the girl herself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pigment is soot from the bottom of a pot mixed with water and applied
    with a frayed wooden implement; the color is pricked in using a mallet and thorned
    wooden instrument.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When considered marriageable, the girl has the buttocks, legs, and finally
    the face tattooed; a small feast precedes work on the buttocks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the day of head and face tattooing the head is shaved, and relatives set
    a feast date usually five days later so that soreness and crusting can lessen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the feast day final tattooing touches are added, and that afternoon the
    girl is considered nubile and called waho.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl is adorned with valuable shell and other ornaments borrowed by her
    family from members of both her father's and mother's clans.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: No dance takes place at the feast; the feast is held in the afternoon in the
    girl's father's house, and the girl may eat some food though pain often limits
    her to tasting it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Decked in finery, the girl ceremonially walks up and down the center of the
    village and then should sit on her father's verandah for much of each day for
    five days, wearing her ornaments.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the rove period she may only walk down the center of the village, may
    not help in the garden, cook, or fetch water, and may not touch food with her
    hands but uses a fork with a banana-leaf-wrapped handle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After five days most borrowed ornaments are returned except those from very
    near relatives; she keeps ornaments supplied by her own people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the five-day period she may feed herself and help in gardens, still
    wears ornaments in the afternoon, appears publicly at the village street or her
    father's verandah, and joins dances.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After four or five months, when her hair has grown again, she is considered
    fit for matrimony and her status-term is buiapu at Waima.
  category: sequence
  evidence_refs:
  - ev:8
