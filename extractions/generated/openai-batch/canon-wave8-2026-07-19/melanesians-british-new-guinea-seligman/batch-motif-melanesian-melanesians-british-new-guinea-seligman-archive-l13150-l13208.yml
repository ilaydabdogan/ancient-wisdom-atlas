canonical_text:
  quote: ''
  summary: 'The passage describes dada or oada as clan badges displayed on certain
    marea, then gives local origin accounts for particular badges: a crab-claw form
    derived from canoe sails, an akumu or garfish head established through dreams
    involving Paipai and a snake, and a paia fish tail adopted after it continued
    to flap after death.'
  language: English
  quote_policy: summarized
