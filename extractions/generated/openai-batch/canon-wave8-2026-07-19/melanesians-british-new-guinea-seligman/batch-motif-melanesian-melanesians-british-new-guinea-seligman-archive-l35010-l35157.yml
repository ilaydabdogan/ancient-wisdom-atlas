canonical_text:
  quote: ''
  summary: The passage describes the offer and acceptance of a mortuary banivi, including
    a coconut placed before a taniwaga, reciprocal obligations between groups, pig
    killing and eating, the bibiko food gift, the end of specific mourning after the
    last pig, the widow's removal of armlets and taboos, renewed dancing, the torela,
    and the concluding torda feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead man's avu goes to a settlement of a clan in the same clan-group and
    places a coconut before the taniwaga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The taniwaga may take or reject the coconut according to whether he wishes
    to eat or accept the banivi, but refusal is permitted only when the number of
    banivi exchanged by the two local groups is equal.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: If one group has eaten the other group's banivi and the numbers are not even,
    the other group must accept in return; otherwise the dead man's friends may be
    sent between groups until one accepts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man who accepts the banivi kills the pig or pigs and provides the vegetable
    food gift called bibiko, which is cooked and sent to the dead man's settlement.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: All the pigs must be eaten before the banivi can end, so a deceased rich man
    with many pigs will require more banivi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the last pig has been eaten, specific mourning for the deceased is over
    and dancing, previously forbidden, may resume.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If another person has died in the community, a man may wear a sign such as
    a hair band and two cowrie shells above the elbow until dancing begins again.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The widow removes one armlet for each pig killed, and the lara strips the
    last armlet from her arm when he comes for the last pig.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the last armlet is removed, the widow removes her necklace and washes
    herself, but she does not put on a fresh petticoat until the drums sound for the
    torela.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The widow discards her food taboos after the last banivi, but she does not
    eat pig until the torela.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After her husband's death, the widow goes to live with a near relative, usually
    a brother or sister, and returns ceremonially to her house to meet the lara at
    the banivi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The widow's children divide their time between their father's settlement and
    the houses of their maternal uncles; if there is more than one wife, each wife
    goes through the same ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: If a widow remarries, every member of her late husband's local group must
    give assent or a quarrel will probably result.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The last banivi is determined by the number of pigs left by the deceased and
    is followed by the big feast called torda.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A footnote marks some information as less certain, including the reported
    verbal offer of the banivi and a statement that the accepting man does not eat
    it himself, though some of his relatives may do so.
  category: speech
  evidence_refs:
  - ev:8
