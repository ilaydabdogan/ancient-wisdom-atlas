canonical_text:
  quote: ''
  summary: The passage describes Northern Massim and especially Trobriand burial and
    mourning practices. It notes a Murua practice of exhuming and preserving skulls
    and bones, then details Trobriand male and female burial preparation, the role
    of lubai relatives, mourning gestures, food redistribution, the sagali funeral
    feast, mourning clothing, blackening, abstinence from foods, and the ending of
    widow mourning by seashore washing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A preliminary note says Northern Massim funeral rites included exhumation
    and careful preservation of the skull and certain other bones, with the description
    applying to Murua.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Trobriands, a man is generally buried on the morning after death, after
    a black forehead band, shell ornaments, armshells, a nasal shell ornament, and
    a new perineal bandage are placed on him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lubai prepare the male corpse, dig the grave, remove ornaments before
    burial, and may build a small house over the grave where they sleep for three
    nights.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The body may be kept in the house until burial; women wail, and men express
    grief by pressing their noses, sniffing, and throwing nasal mucus on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a man’s death, yams from his yam house are shared among near relatives
    of his own totem, while several coconut trees are cut down by close kin and their
    products are available for wider use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brothers and sisters’ children of the dead man make a pretence of cutting
    down his house and yam houses, but other relatives stop them before serious damage
    occurs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After burial, near relatives of the deceased’s own totem provide food for
    the sagali feast, and people of other clans eat it; when a chief dies, clansmen
    from neighbouring villages also bring food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Until the sagali feast is over, other men of the village where the death occurred
    may not sit on ceremonial platforms called boimaviaka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The widow, children, and father of a dead man blacken themselves and take
    part in the sagali feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A widow’s hair is cut, she wears a long mourning petticoat, neck ornament,
    leglets, and armlets, and at the end of mourning her husband’s sisters remove
    or cut these items before she washes at the seashore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The children of a dead man have their hair cut, are smeared with black pigment,
    wear a mourning necklet called kua, and avoid fish and yams for one and a half
    months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a woman dies, her lubai dig the grave and bury her, maternal relatives
    provide much of the sagali food, and a widower blackens himself and mourns similarly
    to a widow.
  category: sequence
  evidence_refs:
  - ev:8
