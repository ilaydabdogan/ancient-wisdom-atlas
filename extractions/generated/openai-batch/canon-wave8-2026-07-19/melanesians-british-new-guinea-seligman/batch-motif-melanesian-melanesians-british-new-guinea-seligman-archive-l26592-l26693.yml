canonical_text:
  quote: ''
  summary: 'The passage describes Bartle Bay public status terms and offices: chiefs
    or headmen called gulau, ritual or practical experts called taniwaga or tuakareina
    who possess and control specialized pari charms or incantations, hereditary transmission
    of such knowledge, restrictions and gifts associated with some experts, and lower
    or age-based status categories such as bada, lamolamona, momolakana, and laralaraga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Bartle Bay settlements, certain men are recognized as headmen or chiefs
    called gulau and possess influence and authority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taniwaga are described as experts whose special knowledge benefits their own
    community and sometimes foreign communities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some taniwaga use pari charms or spells associated with crops, water, rain,
    wallaby, fish, and taro; these are known only to special men.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A taniwaga does less hunting and gardening than other men because community
    members do much work for him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Taniwaga are said probably to observe special taboos; the example given is
    that the wallaby taniwaga may not hunt or eat wallaby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The word taniwaga can mean possessor or owner, and it generally includes the
    idea of control over a particular process or thing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A taniwaga generally passes his knowledge to his brother or to his sister's
    son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Bamdiri of Wedau is both gulau of Wedau and taniwaga of pari that bring rain
    and control winds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Bamdiri is greatly respected and receives many presents of awawara, a yellow
    tuber reserved for important men and denied to women and children.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: A taniwaga does not appear to receive authority from that office to decide
    peace, war, or larger policy; the final decision is theoretically left to the
    gulau.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The offices of gulau and taniwaga are described as strictly hereditary and
    often combined in the same person.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: The term taniwaga is also used for leaders chosen for specific purposes, such
    as feasts, war parties, and large hunting parties.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: Newton reports that status terms include bada, taniwaga, tuakareina, gulau,
    lamolamona, and momolakana; age and property affect authority and social position.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Taniwaga and tuakareina are reported as interchangeable terms meaning owner
    or controller of something, including the right to use an incantation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: A gulau is described as a man of substance, marked by good gardens, pigs,
    ornaments, and sometimes multiple wives.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Lamolamona and momolakana are described as nearly interchangeable terms for
    poverty-stricken status, with lamolamona treated as more reproachful.
  category: attribute
  evidence_refs:
  - ev:7
