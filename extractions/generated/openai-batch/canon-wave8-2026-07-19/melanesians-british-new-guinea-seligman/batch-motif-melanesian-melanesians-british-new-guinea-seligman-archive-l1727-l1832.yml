canonical_text:
  quote: ''
  summary: The passage describes clan grouping and totem practices in parts of the
    Massim district. It reports exogamous rules, the decay of dual clan grouping after
    warfare and cannibal feasts ceased, the absence of totem shrines or increase rites,
    stronger avoidance of a father's totem than one's own, rules concerning totem
    animals, plants, feathers, and decorative carvings of totem animals on houses,
    canoes, and utensils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some parts of the Massim district, dual or multiple clan grouping forbids
    marriage within one's own clan and within one's own clan-group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Where dual or multiple clan grouping exists, it regulates address terms and
    formerly determined participation in a cannibal feast held to revenge a villager
    killed by a hostile community.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dual grouping is described as having fallen into decay after the extinction
    of warfare and cannibal feasts, while totem exogamy is still generally observed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men are not usually considered to partake of the qualities of their totem
    birds, fish, or snakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports no totem shrines, no special influence over totem animals,
    no ceremony for increasing the totem, and no earlier practice of taming totem
    birds as pets.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Across the district, a person is said to show more regard for the father's
    totem than for the mother's totem, which is also the person's own.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man might kill his own bird totem, might catch and eat his own totem fish,
    and might kill his totem snake or destroy his totem plant when convenient; actual
    eating of an own bird totem is described as uncertain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: No one would eat or destroy the father's totem birds or approach a fire at
    which they were cooking; a fisherman would avoid touching or eating the father's
    totem fish; the relation to the father's totem plant was less clear but generally
    involved avoiding injury to it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: No man would wear feathers of his father's totem bird, while feathers of his
    own totem bird could be worn and were considered especially appropriate.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Trobriands example records a hungry woman with pigeon as her bird totem
    eating a pigeon shot by Mr. Bellamy; the act was not considered really evil but
    was uncommon and criticized.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Totem birds, snakes, and fishes are commonly represented on houses, canoe
    prows, lime spatulae, net floats, and other wooden utensils and ornaments.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Any skilled man may carve totem representations, and in many places some totem
    animal patterns have become general decorative art used regardless of the user's
    totem connection.
  category: action
  evidence_refs:
  - ev:7
