canonical_text:
  quote: ''
  summary: A tabular ethnographic passage headed “The Roro” lists villages or groups
    with Itsubu, Oaoa, Marea names, and remarks. The remarks identify several marea
    as associated with ovia itsipana or ovia awarina, describe some marea as battle
    marea, and note that several are not built, unfinished, or in poor repair. Footnotes
    clarify that two marea together form the Kevori marea building, that one clan
    is weak and scattered with no recognized chief, and that the Aitsi Kupunu marea
    exists at Mou where the Aitsi Kupunu clan appears to have settled.
  language: English
  quote_policy: summarized
