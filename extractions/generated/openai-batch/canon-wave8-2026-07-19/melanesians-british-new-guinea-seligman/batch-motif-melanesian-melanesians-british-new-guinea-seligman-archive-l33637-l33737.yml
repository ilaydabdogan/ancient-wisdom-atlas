canonical_text:
  quote: ''
  summary: An account of a walaga feast held behind Diwari in 1907 describes the mountain
    site, a temporary square village with clan houses, gender-divided house interiors,
    painted clan or house marks, a potuma for fasting men, the sacred walaga mango,
    a raised dance platform with a central high pole, charms placed in post holes
    by medicine men to prevent sickness, and the cutting of the walaga mango before
    platform construction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The walaga was held in the mountains behind Diwari on September 24 and 25,
    1907.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A temporary village was built in the scrub on a fairly level spot about 1200
    or 1500 feet above sea level.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The village was built in the form of a rough square, with most houses built
    specially for the occasion on piles about six feet from the ground.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The houses belonged to different clans; the Ewa clan had more than one house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each house was divided by a low partition into a men's compartment and a women's
    compartment.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men's doorways faced toward the inside of the square, while the women's
    doorways were generally at the side and their end of the house faced toward the
    scrub.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Raised houses had different marks on their main centre bearers, executed in
    black and white designs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some houses were marked with black circles, including two concentric black
    circles on houses shared by Bolanai and Imara and on the Matakama house, and a
    single black circle on the potuma.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The potuma was identified as the place where fasting men were to sleep, though
    not all fasting men slept there.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chief of the feast, Tebari, slept in his own house rather than in the
    potuma.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The observer saw the sacred mango in the potuma, uncovered, and was allowed
    to handle it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The platform was about seven feet high to the top of the urupou, and its timber
    had been cut and brought in weeks before construction.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The walaga mango was cut down while the platform timber was lying on the ground
    awaiting construction.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Medicine men placed charms in the platform post holes and said that they extracted
    a human bone from one post.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The stated purpose of the charms was to prevent people who came to the walaga
    from getting sick.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: A central high pole called the dawati stood in the ground in the centre of
    the platform and was about thirty feet high from the ground.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: Strings had been tied from the top of the dawati to the gable ends of the
    houses, though most were broken by wind at the time described.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: Poles called urupou were placed around the edge of the platform, and the walaga
    was danced on them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: The walaga mango was cut on August 27, 1907, and the text distinguishes it
    from other mangoes.
  category: sequence
  evidence_refs:
  - ev:12
