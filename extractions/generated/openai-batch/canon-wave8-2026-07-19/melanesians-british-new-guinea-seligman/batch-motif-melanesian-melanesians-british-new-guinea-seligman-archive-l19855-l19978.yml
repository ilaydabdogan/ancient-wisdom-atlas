canonical_text:
  quote: ''
  summary: The passage describes ufuapie relationships among pangua and their functions
    in death and mourning ceremonies. A married woman's body is returned to her own
    village after death. Ufuapie chiefs end mourning by removing mourning ornaments
    and lifting food taboos. Pig feasts, dirges, invitations carried with areca nuts,
    hunting, and presents structure the final ceremony at which mourning is put away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ufuapie group is described as usually composed of two or more pangua,
    with one pangua or section often regarded as principal while other pangua retain
    recognition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a married woman dies, her kin fetch her body from her husband's village
    and carry it back to her own village, where later ceremonies and village-wide
    mourning restrictions occur.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the ceremony ending mourning, a chief of the ufuapie group comes to the
    deceased's village and ceremonially removes waist belts, armlets, and leglets
    worn by relatives of the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ufuapie chief releases mourners from self-imposed food taboos by taking
    a portion of the avoided food, waving it around the mourner's head, and speaking
    permission to resume its use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Domestic pigs must be killed and a feast made for the men of the ufuapie before
    dancing may take place in the deceased's village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the mourning village gives only wild pigs to the ufuapie, dancing with
    drums may not occur, but dances accompanied by chants are allowed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ufuapie pangua usually send women to sing dirges at the funeral, and food
    associated with this occasion is later carried to the ufuapie villages by the
    deceased's pangua.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Any ufuapie clan chief may perform the ceremony ending mourning, but when
    several chiefs are present, the chief from the longest or closest connected ufuapie
    clan acts as master of ceremonies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Before the great feast, men of the mourning village hunt game, messengers
    carry areca nuts to issue invitations, and the ceremony waits for the arrival
    of the ufuapie men, who may delay until they receive presents.
  category: sequence
  evidence_refs:
  - ev:9
