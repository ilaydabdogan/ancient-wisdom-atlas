canonical_text:
  quote: ''
  summary: The passage describes Koita and related accounts of sickness, healing incantations,
    sorcery, and epidemic countermeasures. It reports beliefs that sickness may arise
    from lost sua or from foreign bodies, describes a sorceress invoking spirits and
    removing sickness objects, records an incantation driving inland spirits away,
    recounts communal responses to an epidemic, and gives Ahuia's account of vada
    sorcerers killing and temporarily reviving a victim by means of rope and magical
    medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stated object of one incantation is to restore a wandering sica, glossed
    with Motu lauma, to its owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the incantation can be effective, both the sorceress and her patient
    must become sacred, and one or more spirits are invoked for this result.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Devase is described as apparently becoming immanent in the sorceress, who
    calls herself the wife of Devase.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: With Devase's presence and aid, the sorceress is said to conjure the missing
    sua back into the sick individual.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: 'The passage reports two coexisting explanations of disease: foreign bodies
    may cause disease, and non-epidemic disease may result from the loss of the sick
    person''s sua.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When removing things from the body in sickness, the sorceress may remove stone,
    wood, rope, pieces of spear, blood, or other objects while muttering incantatory
    words.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the removal of sickness objects, the person is said to feel better,
    and the sorceress speaks commands for strength, hearing, sight, and life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Another incantation has the sorceress cry to inland spirits to remain inland,
    with rocks, and on the mountains; the spirit of sickness leaves, and the sorceress
    asks that her hands and feet be clean before taking a circuitous route back to
    the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: During an epidemic at Hanuabada, torches were burned, horns or possibly conch
    shells were blown, and hereditary sorcerers sat up all night cursing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When land spirits were judged to be causing harm, the population moored canoes
    in the bay and slept in them; later they returned and fired arrows at moving objects.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ahuia states that vada sorcerers are men and not spirits or other non-human
    beings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Vada sorcerers may follow an intended victim to a garden or bush, spear and
    club him, kill him, and cut him to pieces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A rope may be looped round the dead man's hand or knee while the other end
    is steeped in medicine called gorto; the medicine's virtue is said to pass along
    the rope and restore the dead man to life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The revived victim is dazed, later returns to his village, does not remember
    what happened, and his friends infer the event from his feeble and silly condition.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ahuia reports fear that Yohia Wagira, charged with sorcery, might be released
    and put magical medicine in all the wells; the narrator distinguishes this from
    European poison.
  category: speech
  evidence_refs:
  - ev:8
