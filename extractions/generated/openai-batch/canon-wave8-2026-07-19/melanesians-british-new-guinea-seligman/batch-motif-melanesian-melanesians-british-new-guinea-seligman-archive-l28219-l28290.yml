canonical_text:
  quote: ''
  summary: An ethnographic account describes functions, obligations, privileges, avoidance
    rules, property rights, labor duties, mourning roles, inheritance, and marriage
    restrictions among certain kin at Wagawaga and Tubetube, with possible wider relevance
    in the south-eastern district.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the customs described for Wagawaga and Tubetube are identical
    and may also apply widely to the Louisiades, Murua, and much of the south-eastern
    district.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man owed obedience and help to his father and maternal uncles.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A father taught his son fishing and garden-making; the wife's brothers assisted,
    and a maternal uncle replaced a deceased father in every way.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A child's maternal aunt replaced its mother, especially when the child was
    a girl.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man would not complain if his sister's child borrowed gear or took garden
    produce, even if borrowed property was returned damaged.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A boy gave part of fish caught or pig speared to his maternal uncle and did
    hard work for him while travelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maternal uncle and sister's son were the proper chief mourners at funerals,
    and a man's sisters' children inherited all his garden land and a large share
    of personal property.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man helped his maternal aunt in gardening and gave fish to his mother, who
    might pass some to her unmarried sisters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Brothers and sisters normally helped one another in garden-making and house-building
    without formal return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man helped his father-in-law and wife's brothers in house-building, garden-making,
    and fencing, but received little help from them in return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man could not come into contact with his wife's sisters or speak of them
    by name, while they could take or borrow his valuable possessions, including nets
    and canoes, without complaint.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A mother-in-law had a smaller right to help herself to a man's belongings,
    while a father-in-law did not have that right.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man and his sister's husband exchanged assistance in garden-making and house-building.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Opposite-sex cousins did not avoid each other and used each other's names,
    but they could not sleep together or marry; the restriction applied to second
    cousins and probably at least to third cousins.
  category: relationship
  evidence_refs:
  - ev:7
