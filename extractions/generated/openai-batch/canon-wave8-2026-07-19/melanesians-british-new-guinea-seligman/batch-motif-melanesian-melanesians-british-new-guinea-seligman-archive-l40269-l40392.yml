canonical_text:
  quote: ''
  summary: Ethnographic passage on Louisiades social organization based on informants
    at Samarai, especially Toakina of Panatinani. It describes hamlets, turtle-backed
    houses, male clubhouses, linked totems involving birds, fish or substitutes, snakes
    or lizards, and trees, uncertainty about clan grouping, Toakina's totemic avoidances
    and clan restrictions, and marriage practices including female proposal, parental
    consent, and childhood betrothal with puberty-linked residence under the future
    mother-in-law.
  language: English
  quote_policy: summarized
