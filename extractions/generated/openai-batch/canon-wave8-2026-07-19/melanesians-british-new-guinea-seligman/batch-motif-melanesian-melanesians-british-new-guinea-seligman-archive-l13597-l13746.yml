canonical_text:
  quote: ''
  summary: The passage describes carved boards in Roro-speaking marea, especially
    boards treated as the baba or dada property of chiefs and their families. It discusses
    their display positions, rights of use, possible sale of rights to other chiefs,
    visual similarities between boards in different settlements, uncertain or forgotten
    meanings of some patterns, named ornament-derived designs, snake imagery on an
    ornamental board, and a bull-roarer-like object in the style of a kaiva board.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A successful fish charmer associated with Koae Kupunu itsubu was allowed to
    carve the conventional figure of his fish bada, akicmit, in Boaiota marea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many marea contain carved boards suspended from the forward roof overhang,
    attached under the thatch, placed under the eaves, or attached to the front of
    the main post.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The designs on these boards generally represent conventional renderings of
    common ornaments, often in series, and usually do not form a recognizable baba
    of a particular local group or itsubu.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Most boards of this class are described as the property and baba of marea
    chiefs, with public opinion limiting their use to the chiefs' families.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The right to use a particular board could be sold, but only to other chiefs;
    no recent sale was found by the author.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author suggests that old forgotten sales may explain similar or identical
    carved boards in marea belonging to chiefs of different local groups, itsubu,
    or tribes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Boards belonging to the ovia itsipana and ovia awarina of Koae Kupunu itsubu
    at Siria were exhibited on Anapua and Boaiota marea respectively and considered
    their dada.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Siria the meanings of the patterns on these boards were said to be forgotten
    or unknown.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The board pattern of the ovia awarina appears to be derived from the fretted
    turtle-shell ornament koiyu, a name used for the pattern at Waima.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Boards under the kaiva of Airava marea at Abotaira represent mairi, koiyu,
    and an unidentified thing called aria’i.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: On Maivauku marea at Waima, two boards bear a low-relief design called rairai,
    property of the ovia awarina, and the design also appears on a kaiva board of
    the same marea.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Some carved and painted boards under the kaiva were regarded as ornamental
    rather than as the personal property of a chief.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: One ornamental board in Airava marea represents a snake.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Some square-ended ornamental boards may pass into bull-roarer form; the cited
    bull-roarer-style specimen was said to come from one of the Roro villages, but
    its history was unknown.
  category: object
  evidence_refs:
  - ev:12
