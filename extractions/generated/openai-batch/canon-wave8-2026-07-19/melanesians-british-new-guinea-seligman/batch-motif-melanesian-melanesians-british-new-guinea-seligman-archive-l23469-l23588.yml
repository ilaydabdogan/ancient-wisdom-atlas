canonical_text:
  quote: ''
  summary: The passage first recounts girls encountering an old witch who appears
    and croaks like a swamp frog, lures them to a cave, and is later killed by their
    father after they escape with a shell necklace. It then begins a Taupota origin
    narrative in which Duagau and his dog find fish where there is no sea; fish are
    discovered inside a huge hollow tree, whose chips restore themselves overnight
    until the men burn the chips and fell it, releasing a great mass of water.
  language: English
  quote_policy: summarized
