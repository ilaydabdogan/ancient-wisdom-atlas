canonical_text:
  quote: ''
  summary: 'The passage describes adoption and temporary adoption practices: fathers
    ask friends to adopt or care for children, adopted children may assume the adopter''s
    iduku and call him father, adopted daughters'' marriage-price goes to the adoptive
    father, dying men may arrange adoption of children, mothers do not initiate adoption,
    Koita and Motu do not ask across group lines, and an example is given of a man
    adopting his wife''s child from a previous marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adoption is described as not uncommon, with girls adopted more commonly than
    boys because fathers are less willing to part with boys.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The usual adopter is a great friend of the child's father, and the father
    asks the friend to help feed one of his children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A request for adoption is said never to be refused.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In full adoption, the child assumes the adopter's iduku and calls the adopter
    father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: If the adopted child is a girl, the adoptive father receives her marriage-price.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: It is not considered etiquette for a man to offer to adopt a child; he should
    wait until asked.
  category: other
  evidence_refs:
  - ev:1
- id: obs:7
  text: A sick man may before dying ask a friend to adopt one of his children, or
    divide his children among friends who take charge of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: If children assigned for adoption are very small, friends postpone the adoption
    until the children are weaned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: The mother is said to have no right to suggest that her children be adopted.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: The passage states that no Koita would ask a Motu to adopt one of his children,
    or vice versa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:11
  text: Temporary adoption occurs when a man with more children than he can comfortably
    feed asks a friend to take charge of one child for some years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: In temporary adoption, the child uses the same kinship terms for the temporary
    adopted father and his relatives as for blood relatives, but keeps the true father's
    iduhu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:13
  text: Although offering full adoption is normally bad form, offering to take charge
    of a child for a few years is not considered bad form.
  category: other
  evidence_refs:
  - ev:3
- id: obs:14
  text: A man who marries a widow with children may adopt one or more of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The passage gives the example of Ganiga Soso, who married Boio Seri and later
    adopted Vaguya Ganiga, her child by a previous husband, after she proved barren
    with him.
  category: sequence
  evidence_refs:
  - ev:4
