literal_observations:
- id: obs:1
  text: The Marshall Bennet Group is presented as five named islands lying between
    Murua and the Trobriands; Kitava is sometimes considered part of the Trobriands
    though separated from them by nine miles.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dugumenu is described as a low coral island without permanent habitation,
    but visited by canoes for fishing and coconut gathering, with temporary camps
    formed for a week or two.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other islands are described as elevated atolls with terraces, steep cliff
    faces, and, in places such as Kwaiawata, ladders used to scale sheer cliffs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old lagoon floors, limestone terraces, and central depressions are described
    as fertile areas with hamlets, gardens, timber, ferns, coconut palms, and Morinda
    fruit used as food.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The islanders have clan organization; each clan has a chief or headman, and
    the chief of the traditionally strongest clan may be chief, or guyau, of the whole
    island.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says chiefs in this group are not obviously distinguished by greater
    stature, unlike what is sometimes reported for the Trobriands.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The islands formerly fought each other; Gawa and Kwaiawata were frequently
    enemies, and the islanders consistently denied that cannibalism had been practiced
    in the group.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two Kitava hamlets, Larena and Kumageya, had longstanding enmity said to have
    begun with a dispute about a pig and to have been complicated by chieftainship
    issues.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Larena defeated Kumageya in a pitched battle, killed six opponents, later
    attacked again, drove Kumageya people out, and took pigs and yams before peace
    was made after further arrests.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Larena wanted its chief to be head chief over the whole island, a claim opposed
    by all the other villages.
  category: relationship
  evidence_refs:
  - ev:7
