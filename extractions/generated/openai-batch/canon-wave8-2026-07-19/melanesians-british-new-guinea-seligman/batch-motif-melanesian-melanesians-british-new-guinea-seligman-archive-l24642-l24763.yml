canonical_text:
  quote: ''
  summary: 'The passage recounts local histories of Wagawaga and related hamlet groups:
    a dispute over stolen taro leads to settlement at Gumeni and a marriage-like attachment
    between Sinedadaiya and a Bwari Keroro man, from whose children the Garuboi stock
    are said to descend. It then gives an origin account for the Modewa stock: Bwari
    island was shattered and mostly sunk by an earthquake; some inhabitants climbed
    a large tree, fragments of which carried survivors by sea to several places, including
    Pihoho, where they were rescued, adopted, and later moved to Wagawaga. The passage
    ends with geographic and settlement notes on Tubetube hamlets.'
  language: English
  quote_policy: summarized
