canonical_text:
  quote: ''
  summary: The passage describes movements and naming of the Sinaugolo from inland
    sites to the coastal plain, then surveys neighboring coastal groups, especially
    Hood Peninsula, Hula/Bulaa, Kerepunu/Keapara, and Aroma. It records pile-dwellings,
    dependence of Bulaa/Alukune on Keapara, unequal exchanges, seizure of women, the
    foundation of Bulaa after a collective departure, the use of house dubu or koge
    rather than open dubu, and the regional association of house dubu with skull trophies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group left Taborogoro, passed through several village sites, took names
    from those sites, reached the mountain Sinaugolo, and later founded Gumori Dobo
    on the coastal plain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains Ligo or Rigo as a clan name connected with coming down
    from the hills; Ligo Taliman is glossed as men who have come down from the hills.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A coastal group is described from the Hood Peninsula eastward at least to
    Aroma, including Kwaipo, Hula, Kerepunu, and Aroma, with the Upugau River provisionally
    treated as an eastern boundary.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bulaa or Hula is described as four groups of pile-dwellings in the sea; its
    people formerly lived at Alukune or Harukunu near Keapara/Kerepunu.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bulaa/Alukune people are described as formerly subservient to Keapara/Kerepunu,
    paying tolls in fish and marine produce, lacking land, and exchanging fish for
    vegetable food on unfavorable terms.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Keapara men are said to have seized women, and half of the oppressed village
    left together, settled at Hood Point, and built Bulaa while the other half remained
    under subjection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The coastal group is distinguished from western neighbors by having house
    dubu or koge, described as steeple-houses with lofty spires, rather than open
    dubu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The koge are described as exceptionally fine buildings with great length and
    massive supporting posts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the area with open dubu, skull trophies are not kept; where house dubu
    replaces open dubu, skulls were collected and hung upon the dubu until Government-enforced
    peace.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that the villages of these peoples are divided into clans
    that are, or recently were, exogamous.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Alukune fisherfolk obtain canoes from Keapara on costly terms, while canoe-making
    is described as a major Keapara industry using stone adzes.
  category: relationship
  evidence_refs:
  - ev:9
