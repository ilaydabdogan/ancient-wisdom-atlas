  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An attempted explanation linking mangoes to spirits as messengers to spirit
    land produced no results, and no legend of the origin of the walaga was found.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: At many feasts near Bartle Bay, the bringing of five pigs is called a “mango,”
    and a young mango or mango branch is carried in procession with the pigs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mango branch is handed to the recipient of the pigs, kept by that recipient,
