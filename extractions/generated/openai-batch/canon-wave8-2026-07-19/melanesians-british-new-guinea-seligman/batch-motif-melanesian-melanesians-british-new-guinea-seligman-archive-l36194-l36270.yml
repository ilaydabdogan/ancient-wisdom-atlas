canonical_text:
  quote: ''
  summary: The passage reports uncertainty about the meaning of a mango cult and the
    walaga ceremony at Bartle Bay. It describes mango food use, weak restrictions
    on felling mango trees, a possible connection between walaga and death feasts
    for spirits of the dead, processions involving five pigs, a mango branch, and
    a stone axe, an abstinence rule for the mango-bearer, and an unverified pig-killing
    sequence in which the fifth pig's squeal is called a “mango.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that no clear meaning could be attached to the cult of the
    mango, though the walaga ceremony at Bartle Bay seems to express it; the ceremony
    or cult is reported as absent at Wagawaga and Tubetube.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mango fruit is described as common, liked, and eaten by men, women, and children,
    but not a standard food, not cultivated, and not apparently sacrosanct as food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports a weak feeling against unnecessary felling of mango trees;
    when a man cuts one down for a canoe, companions may reprove him, with food value
    given as the explanation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The walaga feast is described as in some ill-defined way associated with spirits
    of the dead and as a finale for death feasts in which spirits are gratified by
    knowing duties have been performed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If death-feast duties are not performed, the spirits of the dead are said
