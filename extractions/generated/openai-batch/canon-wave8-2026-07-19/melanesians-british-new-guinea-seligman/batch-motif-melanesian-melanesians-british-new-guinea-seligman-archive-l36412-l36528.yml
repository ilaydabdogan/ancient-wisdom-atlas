canonical_text:
  quote: ''
  summary: The passage reports Wagawaga and Tubetube beliefs about souls or shades
    of the dead, named afterworld locations, living visitors who travel to and return
    from those places, dream appearances of ghosts, food and gardening in the other
    world, a flood-wave prophecy connected with Hiyoyoa, and a spirit-inhabited hill
    at Bebweso.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, the dead person's spirit, shade, or soul is called arugo; breath
    is called yautu; arugo is also used for a man's shadow and reflection.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At death the arugo leaves the body and goes to Hiyoyoa, described as an other
    world under the sea near Maivara at the head of Milne Bay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hiyoyoa resembles the upper world, but its day and night are reversed relative
    to Wagawaga.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tumudurere lives on a hill in Hiyoyoa with his wife and children and receives
    arriving shades, telling them where to make gardens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Living men and women are said to journey to Hiyoyoa and return; the arugo
    alone is said to make the journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wakuri of Wagawaga says he has gone to Hiyoyoa many times by applying bush
    medicine to his body, falling asleep, and waking in Hiyoyoa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wakuri says he has a wife and children in Hiyoyoa; the shades did not at first
    invite him to eat their food because doing so during an early visit would have
    prevented his return.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Certain shrubs were identified as having grown from plants brought back from
    the underworld.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tokeri, who was said to know how to go to Hiyoyoa, warned people that a great
    wave would come from Hiyoyoa, flood the coast, and sweep away dwellings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Different communities responded differently to Tokeri''s warning: some killed
    pigs and built houses in the bush, some only built houses, and some remained skeptical.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Tubetube, yaruyarua denotes the soul, spirit, life, and ghosts of the dead,
    while kwanukwanuna denotes shadows of the living.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The yaruyarua of dead people may be seen in dreams, may talk to dreamers,
    and appear as the dead were in their prime or in perfect physical condition.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The yaruyarua stays near the corpse until burial and is distinguished from
