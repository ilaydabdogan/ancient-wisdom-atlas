canonical_text:
  quote: ''
  summary: The passage describes trade routes and exchanges involving Wagawaga, Milne
    Bay hamlet-groups, Tubetube, Duau, Panamoti, Basilaki, Rogea, and other places.
    It lists imported and exported goods, identifies Tubetube islanders as middlemen,
    and records one waga purchase paid for in installments with armshells, benam,
    pigs, and vegetables, while noting uncertainty about the exact quantities and
    quality of the payments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Articles of currency were brought to Wagawaga by Tubetube canoes in exchange
    for pigs and vegetable food; Milne Bay hamlet-groups were also visited before
    the soi feast by Tubetube, Basilaki, and Rogea people bringing shell jewellery
    to exchange for pigs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states a belief that feathers, especially birds of paradise plumes
    from Buhutu, were formerly exported from Wagawaga and other Milne Bay hamlet-groups.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports possible or occasional trade routes involving the D'Entrecasteaux
    group, Nuakata, East Cape, Mullins Harbour, Milne Bay, and Taupota, while noting
    lack of precise information for some routes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tubetube is said to manufacture only pots and nose ornaments for export, but
    its islanders' middleman position gave them access to many articles made and used
    by trading communities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Imported goods associated with Duau and the Trobriands include wooden dishes,
    bowls, lime implements, drums, wooden swords, armshells, obsidian, hearth stones,
    drill-point stone, and reeds for flutes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Imported goods associated with Panamoti include baskets, small sinapopo baskets,
    and miniature model waga used as toys; wood and tari were also imported from Duau
    and Basilaki, and pigs and vegetable food were imported in large quantities.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Goods were brought to Tubetube in waga, and Tubetube men paid for them with
    armshells, benam, and bagi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The waga named Keworkewor was bought by Mwakasoki from Yabwa at Panamoti after
    Dawia was asked to arrange the transaction; Yabwa had obtained the canoe at Murua
    where it was built.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The recorded payments for Keworkewor included an initial payment of armshells
    and benam, a later armshell installment, another benam payment, and a final installment
    of pigs and vegetables.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author considers the number of installments reliable but suspects exaggeration
