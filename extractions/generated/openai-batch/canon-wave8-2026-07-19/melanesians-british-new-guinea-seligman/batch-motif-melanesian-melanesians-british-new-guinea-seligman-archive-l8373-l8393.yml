canonical_text:
  quote: ''
  summary: 'The passage reports rules concerning place and name taboos: women are
    normally barred from the dubu except during the tabu ceremony; certain tabu-associated
    localities are avoided by both sexes because visiting them may bring evil results;
    place names are freely spoken; there is no taboo on names of the dead, but some
    affinal and kin names are not addressed or mentioned by particular family members;
    younger men often avoid stating their own names publicly and let comrades answer
    for them.'
  language: English
  quote_policy: summarized
