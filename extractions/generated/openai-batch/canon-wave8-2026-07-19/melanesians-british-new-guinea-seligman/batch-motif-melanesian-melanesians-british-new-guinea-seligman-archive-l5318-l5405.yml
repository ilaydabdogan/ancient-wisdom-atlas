canonical_text:
  quote: ''
  summary: The passage records limited instances of polygyny, then describes Koita
    understandings and practices concerning conception, pregnancy restrictions, childbirth
    posture and attendants, remedies for prolonged labour, cutting of the umbilical
    cord, disposal of the afterbirth in the sea, washing and massage of the newborn,
    breastfeeding, and retained placenta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among 76 recorded marriages, four instances of polygyny are reported, with
    the suggestion that the custom may once have been more frequent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pregnancy is diagnosed by darkening of the nipple and areola; cessation of
    menstruation is described as a later and less reliable sign, and continued cohabitation
    for a month is said to be needed to ensure pregnancy.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage attributes to the Koita a connection between menstruation, breast
    development, breast-derived blood, and the formation of the foetus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A pregnant woman is not to cohabit, remains in her husband's house, avoids
    specified animals and fish as food, and avoids walking at night lest labour be
    prolonged.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: During childbirth the woman squats on a coconut husk, grasps a rope from the
    rafters, is supported from behind, has two women apply counter-pressure to her
    legs, and faces her mother, who is ready to receive the child.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: If labour is prolonged, the father is summoned to open boxes, untie his hair
    cord, and remove arm ornaments; if this fails the woman's brother does likewise;
    if that fails a medicine woman chews aromatic bark, spits it over the abdomen,
    embraces the woman, and receives a fee that is returned if the patient dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Immediately after birth, the maternal grandmother cuts the umbilical cord
    with a bamboo sliver at a distance measured by the child's thigh; the cord is
    not tied, twisted, dressed, or tended when the dried portion drops off.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The afterbirth, called momo, is put in a wide-mouthed clay pot until early
    the next morning, when the young mother wades shoulder-high into the sea, breaks
    the pot, and lets the fragments and placenta sink; her mother may act for her
    if needed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The child is washed daily in warm water by a maternal or paternal grandmother
    while the mother remains confined, and after the first washings undergoes towa,
    a gentle massage and limb manipulation with a hand warmed at a fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The child is put to the breast soon after birth; retained placenta is said
    to be infrequent, untreated, and invariably fatal.
  category: sequence
  evidence_refs:
  - ev:10
