canonical_text:
  quote: ''
  summary: 'The passage contains three narrative segments: a green tree lizard repeatedly
    deceives a bird and steals its fish until the bird traps, kills, roasts, and eats
    him; a cock travels to obtain fire for a feast, invites a girl, and is then captured
    by the girl’s father, whose curse explains why some birds, especially the cassowary,
    lost flight; an enormous pig devastates gardens and eats people, causing villagers
    to flee, while a pregnant woman hides in a hollow tree stump and gives birth to
    a son.'
  language: English
  quote_policy: summarized
