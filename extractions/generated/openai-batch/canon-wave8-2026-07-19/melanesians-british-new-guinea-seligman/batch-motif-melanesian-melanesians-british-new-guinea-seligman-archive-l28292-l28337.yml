canonical_text:
  quote: ''
  summary: 'The passage describes rules of name avoidance: names of living relatives,
    dead relatives, and relatives by marriage are not spoken in specified relationships.
    The strongest prohibitions concern fathers and paternal uncles, including dead
    ones; paternal aunts are addressed by relationship terms; and multiple in-law
    and spousal relations also observe name avoidance.'
