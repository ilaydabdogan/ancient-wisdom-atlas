canonical_text:
  quote: ''
  summary: 'The passage describes changing Koita and related village authority under
    government influence: older iduhu offices are diminished, village headmen retain
    links to clan dubu post status, government backing and village constables add
    new power, elders still influence opinion, and Ahuia Ova at Poreporena combines
    hereditary and government office.'
  language: English
  quote_policy: summarized
