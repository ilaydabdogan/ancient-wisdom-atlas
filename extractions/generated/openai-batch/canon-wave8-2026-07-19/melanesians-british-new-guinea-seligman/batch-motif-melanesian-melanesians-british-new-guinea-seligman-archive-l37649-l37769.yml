canonical_text:
  quote: ''
  summary: The passage describes totem-related food avoidances and practices among
    Northern Massim and related Trobriand-area groups, including prohibitions on eating
    totem birds, fish, pigs, dogs, sharks, and sting-rays; penalties such as swollen
    belly and possible death; variable handling of totem plants and animal products;
    pig-color restrictions among Malasi and Tabalu people; a prescribed method for
    killing certain pigs; good treatment and attachment of pigs; and a Lukosisiga
    chief's treatment of dogs before pig-hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says there is no generally recognized physical or psychical resemblance
    between men and their totems, and totems are not generally regarded as omen-giving.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man should not eat his totem bird; the stated penalty is swollen stomach
    and perhaps death, though the passage says there was no actual tribal punishment
    for eating the totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports uncertainty and individual variation in attitudes toward
    less important totems under foreign influence.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man would usually not eat his totem fish; if it were taken alive, he would
    give it to a man of another totem rather than release it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Accounts differ about plant totems: one account says a man would usually
    avoid injuring his plant totem, while Bellamy says a man clearing a garden would
    destroy his totem plant without hesitation.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Katakea, the white cockatoo, is a subsidiary bird totem of the Malasi clan,
    and its feathers are used in an admired dancing ornament; Malasi men use those
