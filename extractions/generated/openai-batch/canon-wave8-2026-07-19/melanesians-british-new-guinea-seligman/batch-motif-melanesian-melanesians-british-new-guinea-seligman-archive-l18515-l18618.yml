canonical_text:
  quote: ''
  summary: The passage describes internal divisions of the pangua at Inawi and related
    villages. The pangua is composed of ikupu family groups, often understood broadly,
    whose members trace descent from a common ancestor. Stronger clans may divide
    into fdangiau, glossed as “first born,” and ek'ei, glossed as “subsequently born.”
    Emerging groups may declare autonomy, seek acknowledgement from ufuapie chiefs
    through a feast, and have their leader recognized as a chief. Some divisions remain
    sections of the old pangua, while others separate, take a new name, and become
    a new pangua.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Within the pangua, the ikupu is described as the unit and as a family group,
    sometimes in a broad sense.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of an ikupu, except those introduced by marriage or adoption, are
    said to be able to trace origin to a common ancestor, though the ancestor may
    be remote or remembered by only a few old men.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Small weak ikupu may include only a few householders, while strong ikupu commonly
    include thirty to fifty households.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In stronger clans, ikupu may be divided into two groups called fdangiau, translated
    “first born,” and ek'ei, meaning “subsequently born.”
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some ikupu form a closer group, acknowledge close relationship, and may publicly
    declare autonomy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An emerging autonomous group may invite chiefs of its ufuapie group to a village
    feast so their presence acknowledges the group’s social and political status.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: If ufuapie chiefs do not assent, the emerging group may approach other pangua
    with whom they are on good terms to establish an ufuapie relationship.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A numerically strong emerging group may pursue independence despite bickering
    with conservatives or conflict with the lopia fda, the chief of the pangua.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The new unit ultimately gives a large feast; chiefs of the district attend;
    the leader is declared a chief; and the new section is declared free and independent
    while retaining the old name.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The dignity of chief is described as hereditary; the old section is called
    fdangiau, the new section ek'ei, and the chief of the new section is officially
    termed lopia ek'ei.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: When a new division separates entirely from the section in which it formed,
    it takes another name and becomes a new pangua.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: New pangua gain recognition for chiefs more easily when they are numerically
    strong and rich enough to be generous to their ufuapie, especially by making a
    feast large enough to please those concerned.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage lists named pangua that currently lack generally recognized lopia
    fda and contrasts them with others that have recognized lopia fda.
  category: attribute
  evidence_refs:
  - ev:5
