canonical_text:
  quote: ''
  summary: The passage discusses whether Papuasian art is primarily aesthetic or has
    non-aesthetic meanings. It describes munkuris fixed to northern Massim canoes
    and believed in the Louisiades to aid safe navigation; canoe carvings from Murua
    and Tokunu depicting birds, fish, and snakes as totem animals; Tubetube importers
    who appreciate such designs while not knowing their makers' meanings; decorative
    borrowing in the Central Division; a Koita community purchasing rights to a dance;
    and hereditary wood carvers whose work and manual effort are valued.
  language: English
  quote_policy: summarized
