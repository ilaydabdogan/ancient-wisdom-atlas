canonical_text:
  quote: ''
  summary: Ethnographic account of the venedairi feast on the fourth day after burial,
    including grave fires, food distribution, widow mourning practices, preservation
    and wearing of the dead man's belongings and hair, six-month restrictions and
    food abstinences, and later provisioning at the bisa until the ita feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The venedairi feast takes place on the fourth day after burial; before it,
    fires are lit nightly on the grave where the widow and nearest relatives formerly
    slept.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man's clansmen collect and cook a large amount of food, deposit it
    before the deceased's house, and distribute much of it to those who dug the grave
    and carried the corpse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the food distribution, the dead man's brother's wife blackens the widow
    from head to foot and shaves her head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dead man's spoon, comb, and lime gourd are broken; fragments, armlets,
    perineal band, and locks of his hair are made into small bark-cloth parcels worn
    by the widow around her neck.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A described buibui collar consists of the dead man's perineal band wrapped
    in bark cloth, with his lime gourd, an armlet, a spoon handle, and small bundles
    of hair attached.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The widow's full mourning costume includes a long petticoat, bead frontlet,
    netted yarasi vests, and a network cap ornamented with seeds and feathers.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: For six months the widow wears mourning ornaments and is restricted in public
    appearance, speech, village movement, and use of the front verandah.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The widow and other relatives abstain from foods especially liked by the dead
    man until the ita feast; other people may abstain from selected foods to assemble
    a large supply of sacred food for that feast.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Between venedairi and ita, a dead man's clansman who obtains notable pig,
    wallaby, fish, or bananas brings the food to the bisa, where it is hung, cooked
    by men, and eaten by men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After such food is cooked, stripped banana haulms or a pig's lower jaw may
    be left hanging on the transverse pole above the seat of the bisa.
  category: object
  evidence_refs:
  - ev:10
