canonical_text:
  quote: ''
  summary: The passage reports that no definite initiation ceremony for the ibitoe
    was found at Yule Island, but that Waima formerly had an elaborate aruaru initiation
    for pubertal boys involving seclusion in specially built marea. It lists Waima
    stocks and named aruaru marea, describes their restricted use and large size,
    notes that all youths were initiated together in one marea, and suggests that
    the custom was influenced by more elaborate Elema initiation practices in eravo
    clubhouses.
