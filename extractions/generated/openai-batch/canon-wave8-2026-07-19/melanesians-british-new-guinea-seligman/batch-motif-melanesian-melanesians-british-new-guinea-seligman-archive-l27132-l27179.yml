canonical_text:
  quote: ''
  summary: The passage describes bolabola stone rows and circles as squatting places
    rather than cannibalism-related structures. Some stones bear lightly incised designs
    interpreted as the morning star, a star or eye, and a starfish, while other designs
    are unnamed or uncertain. The Irere bolabola is a circular arrangement whose upright
    stones are family property inherited through specified kin. Access restrictions
    are noted for women and visitors. The centre of a stone circle may now hold a
    fire, while formerly it held a shallow pottery dish called noma. A quoted letter
    compares bolabola and other stone circles as places for discussion or dry sitting.
  language: English
  quote_policy: summarized
