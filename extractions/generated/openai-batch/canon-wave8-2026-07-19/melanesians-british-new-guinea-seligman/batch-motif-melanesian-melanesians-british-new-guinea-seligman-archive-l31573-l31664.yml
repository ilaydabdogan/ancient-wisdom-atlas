canonical_text:
  quote: ''
  summary: 'The passage describes a Wagawaga revenge war party: a pre-departure feast
    and exhortations, a night canoe raid on Maivara, capture of one man, public wounding
    of the captive by warriors and the dead man''s kin, presentation of gifts to the
    captor, possible transfer of mourning ornaments, execution by burning in a stone
    circle reserved for cannibal feasts, and cutting up and eating the corpse. A note
    reports similar practices for Taupota villages, with added details about forced
    witnessing and burning splinters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rerenia of Wagawaga Pupuna hamlet is named as leader of the war party and
    as taniwaga or master of the feast; he killed the pigs while others contributed
    vegetable food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ogatara was eaten in the afternoon on the lower platform of a potuma by
    the warriors except Rerenia, who ate only in his own house; women and children
    sat around the potuma but did not take part.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Speeches during the feast incited courage, valour, and revenge, but the leader
    of the war party did not himself make a speech.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Near sundown the armed war party departed with drums and conches in ten canoes
    and quietly entered the Maivara river about midnight.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a noiseless landing, the attackers rushed a potuma; the inmates escaped
    except one man, whom Rerenia captured, bound, and placed in a canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At daylight the attackers beat drums, blew conches, danced besa, exchanged
    shouts and insults with Maivara men on shore, and returned triumphantly to Wagawaga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Wagawaga the captive was thrown into shallow water and speared by as many
    warriors as could reach him, while care was taken not to kill him at that stage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the captive had to be wounded by the next of kin of the man
    whose death was being avenged; Bakaiya, brother of Keori, slashed the captive
    across the shoulder with a tomahawk.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: After the maiha was dragged to land, the next of kin made a gift called gudu
    to the captor; Bakaiya paid Rerenia several named valuables and a pig.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: If the dead man left a widow, she was expected to transfer her mourning ornaments
    to the maiha; the passage says no inquiry was made about whether the maiha was
    blinded by the widow as at Tubetube.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The victim was dragged to the clan's stone circle, gahana, reserved for cannibal
    feasts, wrapped in dry coconut leaves, lashed to a tree, and burned when the leaves
    were lit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The spear and shield of the first man killed, when available, were preserved
    and burned with the maiha.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The burnt corpse was placed on a pandanus mat, cut up, and eaten partly inside
    and partly outside the gahana.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A note states that the same description would apply to Taupota villages and
    adds that one of two prisoners might be killed and roasted before the other, with
    burning splinters inserted into the victim's flesh.
  category: other
  evidence_refs:
  - ev:8
