canonical_text:
  quote: The arrival of the lakatoi at its destination in the Gulf is an occasion
    for great rejoicing.
  summary: 'The passage describes procedures when a lakatoi reaches a Gulf village:
    taboos end, crew members wash, ceremonial friendships are selected, ornaments
    and food are exchanged, pots are tallied for later sago payment, new asi are made
    from river trees, the lakatoi is reconstructed, sago parcels are loaded and checked,
    and the tediha retain limited ritual duties over the vaina while ashore restrictions
    are relaxed.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After the lakatoi is moored in the river opposite the destination village,
    taboos cease and the baditauna, doritauna, and their tediha leap into the water
    to wash off accumulated dirt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Head men of the Gulf village, with an escort, make a ceremonial visit to the
    lakatoi, and each crew member selects a tarua or friend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The baditauna and doritauna each select two headmen as tarua and adorn them
    with personal ornaments brought for barter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Crew members decorate their chosen friends with ornaments, and accepted articles
    have recognized exchange values.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Villagers return to their houses, kill a pig or a dog, cook it, and give it
    to the visitors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The next day pots are set in rows on the river-bank, and each man keeps his
    own pots separate from those of others.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: When purchasers select pots, the pot owner breaks short slivers of stick called
    kae as tallies and places two in each pot; seller and purchaser then each keep
    one tally from each pot until sago payment is made.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The tallying system is said to be followed in the Elema district and not in
    the Namau district.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men needing new asi give a large shell armlet to their tarua; Gulf natives
    who accepted payment obtain tree measurements and fell suitable trees if measurements
    are satisfactory.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Asi are made from a large soft-wood tree called ilimo, which grows near rivers
    in low alluvial reaches.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The felled trees are floated downstream to the lakatoi, hauled to the river
    bank, hollowed, and shaped into asi by the visitors; fire is not used in this
    operation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: While the lakatoi crew work on asi, many local people live in swamps making
    sago.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: After new asi are made, the lakatoi is taken apart and reconstructed on a
    larger plan.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Sede may not be beaten and songs may not be sung until reconstruction is complete;
    afterward lakatoi songs may be sung except 'Lara toa.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Sago parcels are loaded onto the lakatoi in named types, and smaller parcels
    are checked by the kae.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: While the lakatoi remains alongside the Gulf village, the tediha lose much
    of the sacredness attached to their office, may go ashore, and have no restricted
    diet.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: The tediha remain in charge of the vaina kept aboard the lakatoi, and when
    going ashore they must remove their sihi and leave them beside the vaina.
  category: action
  evidence_refs:
  - ev:13
