canonical_text:
  quote: ''
  summary: 'The passage describes Roro-speaking clan badges called dada: designs,
    ornaments, or objects worn or displayed by members of an itsubu on ceremonial
    occasions or on a marea. It notes that the term also applies more broadly to signs
    or customs distinguishing groups, including European institutions. Examples include
    feather head-dresses, carved pole designs representing fish parts, turtle-shell
    ornaments, and hornbill mandibles worn in a prescribed manner. The passage states
    that animals serving as dada are not specially protected and may be eaten by members
    of the associated groups.'
  language: English
  quote_policy: summarized
