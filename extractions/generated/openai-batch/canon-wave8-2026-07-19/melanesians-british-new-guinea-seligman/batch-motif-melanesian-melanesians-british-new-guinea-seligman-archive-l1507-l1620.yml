  summary: The passage gives anthropometric notes on Murua, describes an approximate
    map of Papuan and Papuo-Melanesian distribution, offers an explanation for the
    greater variability of Western Papuo-Melanesians through terrain, contact, language,
    and custom transfer, and begins a survey of Massim culture, including its geographic
    boundaries, northern and southern divisions, cannibalism distribution, and northern
    Massim hereditary chieftainship.
