canonical_text:
  quote: ''
  summary: The passage describes iduhu rohi rights to portions of game and fish, the
    presentation and communal eating of such foods on the rohi's verandah, the hanging
    or preservation of some animal remains and feast remains, the ownership of dubu
    corner posts by particular office-holders, and the limited mediating and war-related
    authority of the rohi ketaike.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iduhu rohi are said to have rights to game killed by men of their section
    and less well-defined rights in large fish caught.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a villager kills a pig, he presents the head, half-head, or lower jaw
    to the iduhu rohi of an iduhu other than his own.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Presented pig portions are cooked on the iduhu rohi's verandah and eaten by
    men of the section, including the donor and guests from other sections or tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The text describes failure to present the appropriate portion to an iduhu
    rohi as extremely bad form and relates the practice to food exchanges common throughout
    New Guinea.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Whole pig skulls or lower jaws, when presented, are fixed on the verandah
    or front of the iduhu rohi's house; bones of half-heads are not kept.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wallaby loin with kidneys and tail, and among the Motu one forejoint of each
    turtle, are presented similarly, but their bones are not hung on the verandah.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Large fish are left on the iduhu rohi's verandah, cleaned and cooked at his
    orders, and eaten on the verandah, with an exception allowing a portion to be
    sent to a sick man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fish skulls and often vertebral columns are usually hung from the front eaves
    of the verandah; the tail of the dakudaku fish is carefully prepared and preserved;
    withered banana haulms from feasts may also hang there for a long time.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each iduhu rohi owns the front right corner post of the dubu and is responsible
    for its maintenance and renewal, except where several iduhu build a common dubu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Where a common dubu is built, the iduhu rohi of the strongest or traditionally
    most important clan becomes master of the front right post.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The master of the left front post acts as sub-chief and assists the master
    of the front right post in arranging feasts and dubu ceremonies; masters of the
    back corner posts are not considered chiefs but tend to be influential.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rohi ketaike mediates land disputes between iduhu, while other quarrels
    are not necessarily referred to him and his opinion is often little more authoritative
    than that of other influential elders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In war the rohi ketaike consults with elder men to arrange operations and
    may stop a battle or pursuit if he can make himself heard.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage reports that in earlier times the rohi ketaike could determine
    whether strangers were to be killed and could influence whether a killer of a
    stranger would be surrendered or defended.
  category: action
  evidence_refs:
  - ev:9
