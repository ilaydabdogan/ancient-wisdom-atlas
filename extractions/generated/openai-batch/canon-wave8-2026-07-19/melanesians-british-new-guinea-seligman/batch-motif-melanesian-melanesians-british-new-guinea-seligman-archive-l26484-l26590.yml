canonical_text:
  quote: "“There are no big chiefs either at Milne Bay or Tubetube...”"
  summary: The passage describes public authority and food regulation at Wagawaga,
    Tubetube, and related localities. It emphasizes the absence of formal chieftainship,
    the situational leadership of revenge war parties, the social importance of older
    men, prestige gained through feasting, wealth, travel, fishing, carving, and reputed
    magic, the respectful term taubada, and detailed customary rules distributing
    valued foods to old men and potuma. It also records food prohibitions for younger
    people and women, including some fish taboos explained by custom or perceived
    animal qualities rather than direct totemism.
  language: English
  quote_policy: quoted
