canonical_text:
  quote: the fda chiefs of the ufuapie present a lime gourd ... to the leader of the
    new unit and declare him a chief like themselves.
  summary: The passage describes the ufuapie relationship between pangua or ikupu
    groups, its role in death and mourning ceremonies, its required public assent
    for the recognition of new or partly autonomous groups, reciprocal obligations
    around ufu-building and feasting, and the solemn feast at which ufuapie chiefs
    present a faonga lime gourd and declare a new leader to be a chief.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A pangua, or sometimes certain ikupu within a pangua, may stand in a special
    relationship to other pangua or ikupu and call the linked unit its ufuapie.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the time described, ufuapie take definite parts in certain ceremonies,
    especially those connected with death and mourning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An ekei group cannot be officially recognized as partly autonomous, and a
    new pangua cannot come into existence, without public assent from its ufuapie
    at a big feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ufuapie are expected to assist in building an ufu, but their assistance may
    be avoided because they may expect substantial feasting and entertainment in return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ufuapie relationship may involve an entire pangua or only certain ikupu;
    in some cases the division corresponds to fdangiau and ekei sections within a
    pangua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an ikupu or pangua determines to assert independence, it selects an ufuapie;
    nothing can proceed until the ufuapie consents, and consent of a closely related
    pangua is also usually required.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A new unit usually selects the same ufuapie as the pangua from which it originated,
    but it may select different ufuapie in whole or in part.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The site on which a new unit builds houses may help determine its ufuapie;
    a unit moving to a strange village may become related to nearby clans and may
    take some institutions of its neighbours.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the solemn public ceremonial, the new unit gives a big feast, neighbouring
    chiefs come to the ufu, and fda chiefs of the ufuapie present a faonga lime gourd
    to the new leader and declare him a chief like themselves.
  category: sequence
  evidence_refs:
  - ev:7
