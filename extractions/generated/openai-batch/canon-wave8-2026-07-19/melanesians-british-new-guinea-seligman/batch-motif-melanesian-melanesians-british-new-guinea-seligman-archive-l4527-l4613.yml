canonical_text:
  quote: Among the Koita, the system of kinship is ' classificatory.'
  summary: The passage gives an ethnographic description of Koita classificatory kinship
    terminology, with corresponding Motu terms in brackets. It states that relationships
    were determined from genealogies rather than English glosses, lists terms covering
    ancestors, parents, children, siblings, cousins, maternal and paternal affines,
    in-laws, and spouses, and notes the absence of a special reciprocal term between
    children of two brothers or sisters. A tabular note in the passage also gives
    settlement figures and says the list is incomplete because a page of notes was
    destroyed.
  language: English
  quote_policy: quoted
