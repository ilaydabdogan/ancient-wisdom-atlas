  quote: ''
  summary: The passage reports that people in the Port Moresby villages give a prolonged
    shrill communal cry at the first sight of the new moon. Captain Barton states
    that heavenly bodies are regarded with awe, especially the sun, moon, and morning
    star, but that the cry is made only for the new moon. A footnote adds that nearby
    Sinaugolo people call on ancestors by name while driving pigs and, at Kwalimarupu,
    leave cooked food in gardens for spirits of the dead, especially before a journey.
    The remainder of the supplied passage appears to contain fragmentary or non-prose
    material.
