canonical_text:
  quote: "“And this is why all the birds fear to live in tutuana trees ... and to
    this day lives hidden in the long grass.”"
  summary: The passage first notes the status of the Aurana clan and a form of address
    used by girls. It then narrates an animal tale in which Kukuku is frightened during
    pig hunting, Waima the ant kills a hornbill that tries to seize pig entrails,
    birds seek vengeance, ants shelter in a tutuana tree, many birds are killed by
    ant stings, the crow destroys the ants’ leaf houses by keeping his eyes shut,
    and the tale explains why birds avoid tutuana trees and Kukuku lives in long grass.
