canonical_text:
  quote: ''
  summary: The passage describes Koita community responses to garden theft, killing,
    blood feud, compensation, and the ceremonial surrender and execution of a murderer
    by an injured community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Theft from a fellow villager's garden by a person of a different idiihu could
    lead to loud talk and a scuffle with sticks, stones, and clubs, without an intention
    to kill.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If life were lost in such an intra-community conflict, there might be talk
    of vendetta, but the community led by the rohi ketaike would prevent it and a
    blood price would be accepted after discussion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A stranger, even a Koita, might be killed if caught stealing in a garden,
    and under those circumstances a blood feud would result.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the hypothetical case, a Hohodai man who killed a Baruni man stealing from
    his garden would report to his iduhu rohi, who would discuss the matter with the
    rohi ketaike; the rohi ketaike and old men would decide whether to defend or give
    up the slayer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Baruni might wait for a chance to kill a Hohodai man, woman, or child,
    or might openly approach Hohodai fully armed and announce that they had come to
    avenge their murdered fellow-villager.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A revenge fight would usually stop after one Hohodai man was killed, unless
    earlier Hohodai killings required Baruni to kill one more man than Hohodai; such
    battles could also start new feuds and chronic enmity.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: If the Hohodai chose not to fight, they might agree to give up the murderer,
    who would retire into his house and ornament and paint himself, usually with help
    from his henamo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The murderer's pig, or a pig belonging to his henamo if he had none, was killed;
    Baruni men surrounded the house and lit fires around which they squatted all night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pig was cooked and eaten in the murderer's house by fellow-villagers and
    leaders; the condemned man was expected to eat, while near relatives and friends
    abstained and women wailed through the night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At dawn the murderer was stripped of ornaments, led down the house ladder
    by the rohi ketaike, and then speared and clubbed to death by the Baruni.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the killing, the rohi ketaike declared that the matter was finished
    and that no more men should be killed; the Baruni retired and the victim was buried
    in the usual way.
  category: speech
  evidence_refs:
  - ev:8
