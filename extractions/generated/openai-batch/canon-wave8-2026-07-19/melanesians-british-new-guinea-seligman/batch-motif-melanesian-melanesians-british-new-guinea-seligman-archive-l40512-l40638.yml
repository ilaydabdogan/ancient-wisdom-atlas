canonical_text:
  quote: '"they are our grandparents"'
  summary: The passage describes totemic affiliations among Mukaua and Bogaboga settlements
    and clans. It lists animal, fish, plant, tree, mountain, rock, and rain totems;
    notes patrilineal descent of totems in Mukaua; records prohibitions on killing,
    eating, touching, using, looking at, or stepping on certain totems; and reports
    social anger and boils after totem taboo violation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the Mukaua district, each clan is said to have a number of totems, and
    these totems descend through the father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several Mukaua-area settlements are identified with named clans and enumerated
    totems, including birds, fish, shellfish, reptiles, mammals, bananas, turtle,
    snake, dugong, and sting ray.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:3
  text: Kurakura is described as a settlement of strangers from the D'Entrecasteaux
    Islands and is alleged not to have a totem system similar to that of Mukaua.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mukaua people are said not to kill or eat their totems, but they may use feathers
    of totem birds if found, given, or bought, and may buy cuscus tails or monitor-lizard
    skin even when those animals are totems.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a man with monitor lizard or cuscus as totem killed the animal, the clan
    headman would be angry and the killer would suffer from boils.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A totem fish caught accidentally would be removed by a man of another totem,
    who could keep and eat it; the fish would not be returned to the water, buried,
    or specially considered by the person for whom it was a totem.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man with banana totems would plant and pick those bananas, but he could
    not eat the fruit himself, while his wives could eat it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mukaua people are said to have no forest trees or uncultivated plants as totems,
    while Bogaboga people may have forest trees, and other known people are said to
    have rocks, mountains, and rain as totems.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: No origin story for the Mukaua totems was elicited, but the totems were described
    with the phrase, “they are our grandparents.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bogaboga territory contains three communities and five clans, with totems
    including fish-hawk, hawk, fowl, fish, bananas, plantain, trees, dugong, mountain,
    and birds.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: At Bogaboga, people with tree totems must not use the wood for building, firewood,
    or canoes, and must not chop down or injure such trees.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Bogaboga, people whose totem is a mountain must never look at it or set
    foot on it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A Bogaboga informant and his brother reportedly ate one of their totem fish,
    were reproved by clan and family, and both suffered boils within a week; members
    of other clans were said to eat that fish unharmed.
  category: sequence
  evidence_refs:
  - ev:9
