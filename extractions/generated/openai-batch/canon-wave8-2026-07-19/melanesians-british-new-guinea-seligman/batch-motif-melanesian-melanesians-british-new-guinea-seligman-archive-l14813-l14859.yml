canonical_text:
  quote: ''
  summary: The passage describes a rite in which, after a boy's ears have been pierced
    and while he is still a miori, his father kills and displays a dog, then gives
    it to the boy's maternal uncle. The mother's family eats the dog, and the maternal
    uncle puts the itaburi, or perineal bandage, on the boy in the uncle's house.
    The father and paternal relatives are absent from the initial investiture. The
    dog is described as a kind of payment for the boy's assumption of the itaburi,
    with a pig allowed only as an inferior substitute if a dog is unavailable. A recent
    case is given in which an accidentally killed dog was accepted in advance for
    the future rite.
  language: English
  quote_policy: summarized
