canonical_text:
  quote: ''
  summary: The passage describes a clan turtle-fishing procedure involving nets kept
    and ritually treated in a rupu/dubu by the clan chief, apportionment of the turtle,
    special handling of the turtle head and skull, and storage of the skull in the
    rupu. It then gives ethnographic notes on Keveri/Cloudy Bay, Mailu social divisions,
    mauru skull houses, exclusion of women from those houses, chiefs or headmen responsible
    for clubhouses, Massim-like tattoo patterns among Mailu women, and Mailu linguistic
    features.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before turtle fishing, men of each clan take their nets to the clan rupu,
    where the clan chief lives, and leave the nets there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The clan chief is left alone with the nets for part of the day and “medicines”
    them while wearing armshells, feathers, and bunches of herbs placed between his
    armshells and arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the evening the nets are collected, piled in a large craft, and accompanied
    by smaller canoes containing most of the fishermen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The turtles are driven into the nets, and each clan then takes its nets and
    any turtle caught in them to the house of its clan chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the clan chief’s house the turtle is cut up and apportioned by the clan
    chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The clan chief keeps the turtle head; it is cooked the next day, placed on
    top of the nets, and its flesh is eaten by all the clan except the chief.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief’s wife may receive a portion of turtle that may be cooked and eaten
    in the chief’s house, while the chief himself may not touch it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the flesh of the head has been eaten, the turtle skull is painted red
    and kept in the rupu, often on the fore end of the ridge pole or on a rafter end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The described ceremony is performed every time turtle are caught with a net,
    and after each hunt the nets must remain in the rupu for two or three days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the note, rupu is used as a synonym for house dubu.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Mailu inhabit the area around Port Glasgow and Milport Harbour in Orangerie
    Bay and are described in physical, linguistic, and regional terms.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mailu villages contain divisions called mauru, said to correspond to Motu
    and Koita iduhu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Each mauru possesses, or should possess, a house where skulls were formerly
    kept and which women may not enter.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The mauru houses are described as larger and better built than ordinary family
    houses, with uncarved posts, and may stand in the middle of the village street.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: Each mauru has a chief or headman called vere, who is said to be more or less
    responsible for upkeep of the clubhouse.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Mailu women’s tattoo patterns are described as the same patterns used by the
    Massim of Rogeia, Teste Island, and Tubetube.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Mailu language is described as having no trace of Melanesian grammar but
    containing Melanesian words.
  category: attribute
  evidence_refs:
  - ev:8
