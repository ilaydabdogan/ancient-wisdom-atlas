  summary: The passage describes iduhu dagi or clan badges among eastern Koita groups,
    their forms and placement on houses, rafts, and dubu posts, and then outlines
    clan leadership and succession patterns for Dubara, Keakone, and Taurama iduhu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain iduhu are said to have the right to use conventional designs called
    dagina, made as carvings on wood or arrangements of dried grass, dried leaf streamers,
    and sometimes a shell pendant.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage glosses dagi as a sign or witness and explains iduhu dagi as equivalent
    to a clan badge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that, except for toana flown on lakatoi during hiri voyages,
    iduhu dagi among the eastern Koita seem to be in decay and to have little present
    significance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Designs shown as Fig. 5 are described as dagina on verandah rafter ends in
    Hohodai and are associated with the Dubara, Taurama, and Keakone clans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inquiry in Hohodai and Pari found that dagina were often called toana and
    often linked with an iduhu name, but houses were not usually ornamented mainly
    with the owner's iduhu design.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Taubada's house is described as an exception because all verandah rafter ends
    carried one dagina identified as the Dubara toana; the carvings were made by Hara,
    a Taurama man.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Carvings at the tops of the large corner posts of the dubu were also said
    to be toana.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that there is no dominant chief over all Koita or over
    any group larger than a section; each iduhu has an iduhu rohi or clan chief/headman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The office of iduhu rohi is described as usually hereditary in the direct
    line, with possible succession by a sister's son if there is no child or if the
    eldest son is too young.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Dubara example, Ahuia is treated as the active present iduhu rohi,
    while Taubada, his maternal uncle, remains influential and receives the pig skull
    or jaw trophies; succession is expected to revert to Ova Tau.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the Keakone example, Goro Arua inherited the office, Hedu Gamika is the
    present iduhu rohi, and Homoka Goro is expected to become iduhu rohi after Hedu
    Gamika's death or incapacity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Taurama example, Taurama Vamaga weakened and was absorbed into Taurama
    Vaga, and a childless chief, Maraga Kora, adopted Maraga Ganiga, who later became
    chief.
  category: sequence
  evidence_refs:
  - ev:10
