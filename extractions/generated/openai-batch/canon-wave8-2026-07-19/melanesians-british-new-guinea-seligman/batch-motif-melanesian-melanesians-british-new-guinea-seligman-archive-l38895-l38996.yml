canonical_text:
  quote: There is no initiation ceremony at puberty
  summary: 'The passage describes Northern Massim childhood and adolescence: children
    are taught clan totem privileges and prohibitions, boys receive perineal bands
    and later sleep separately in a boys’ sleeping-place, girls have puberty practices
    including blackened teeth and a special dish, and kinship and friendship terms
    are listed.'
  language: English
