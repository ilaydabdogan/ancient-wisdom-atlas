canonical_text:
  quote: The individual or individuals eaten in revenge for a comrade who had been
    eaten by a hostile community were called maia or maiha.
  summary: The passage describes reported opinions on the taste and digestibility
    of human flesh, then gives an account of Maivara men ambushing a Wagawaga canoe,
    capturing Keori and Bonadiero, publicly displaying and threatening the captives
    near Wagawaga, later eating Keori and adopting Bonadiero. It adds a comparative
    example of a boy protected by women’s petticoats and adopted, then describes Wagawaga
    preparations for revenge, including a required feast before seeking maiha.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Human flesh is reported to resemble pig in flavour, but to be considered more
    delicate and not to cause the same satiety or vomiting when eaten in quantity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Individuals eaten in revenge for a comrade eaten by a hostile community are
    called maia or maiha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maivara men used three canoes at night to ambush a Wagawaga canoe near Seraumi
    and captured Keori and Bonadiero.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prisoners were bound, placed in a Maivara canoe, and taken past Wagawaga
    on the return journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near Wagawaga, the Maivara crew drummed, shouted, gesticulated, blew conch
    shells, halted, and performed the dance called besa or boriri.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The captives were made to stand and were stripped; their garments were waved
    in the air while their captors shouted their names and described how they would
    be cooked and eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bonadiero cried and repeatedly tried to escape, while Keori appeared resigned
    to people watching from shore.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Keori was later eaten after usual preliminaries, while Bonadiero was not injured,
    was adopted by Taumaia, and was later restored to her own people by Rabi guests.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a cited account, women protected a boy who was to be killed by taking off
    their petticoats and throwing them over his body; the men would not touch him
    while he was under that protection, and he was later adopted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Wagawaga, revenge was decided upon, delayed for about six weeks to allow
    suspicion to lessen, and then canoes, weapons, and a required feast called ogatara
    or losuma were prepared before seeking maiha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note says that shared totems could cause sympathy for a prisoner marked
    to be killed and eaten, but ransom required valuable items or mediation through
    an influential connection.
  category: relationship
  evidence_refs:
  - ev:8
