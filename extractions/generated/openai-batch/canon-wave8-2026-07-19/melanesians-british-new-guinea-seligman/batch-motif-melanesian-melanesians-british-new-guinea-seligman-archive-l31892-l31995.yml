candidate_motifs:
- id: motif:1
  label: Victory return with dance and enemy body reception
  taxonomy_refs: []
  basis: The approach of victorious canoes triggers a beach gathering, a named dance,
    and the ceremonial bringing ashore of a dead enemy.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an ethnographic ritual pattern, not a mythic narrative episode.
- id: motif:2
  label: Life-for-life revenge killing on a clan ritual place
  taxonomy_refs: []
  basis: A prisoner selected to die is killed on a naka associated with the clan of
    the man for whom revenge is taken.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames the action as revenge and blood debt, not as an offering
    to a deity.
- id: motif:3
  label: Mourning transferred to victim before retaliatory death
  taxonomy_refs: []
  basis: The widow's mourning necklace and armlets are placed on the victim before
    she attacks the victim's eyes and taunts him.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the symbolic meaning of the transfer.
- id: motif:4
  label: Ceremonial cannibal feast with prescribed abstentions
  taxonomy_refs: []
  basis: Human flesh is distributed and eaten, while the killer or captor and certain
    relatives or game abstain under specified rules.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The account records practice and restrictions but does not provide indigenous
    mythic explanation.
- id: motif:5
  label: Dangerous commensality through shared lime-pot contamination
  taxonomy_refs: []
  basis: The passage describes a risk of death to the gum's provider if people who
    ate the gum later share or contaminate lime-pots or lime gourds in certain ways.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The mechanism is reported through the author's interpretation and informant
    statement, but no full native exegesis is given.
- id: motif:6
  label: Ritual exchange payment for the slain or captured enemy
  taxonomy_refs:
  - sacred_exchange
  basis: A formal gaioiyai payment, typically a pig and four pairs of armshells, is
    made by the dead man's hamlet or clansmen to the killer or captor for the gum.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: 'The taxonomy reference is cautious: the passage shows formal ceremonial
    exchange, but does not explicitly call it sacred or divine.'
- id: motif:7
  label: Post-killing seclusion, food restriction, sea bathing, and blackening
  taxonomy_refs: []
  basis: The killer or captor undergoes a timed sequence of avoidance, self-cooked
    roasted food, seclusion, sea bathing, facial blackening, and final washing.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not call this initiation or purification, though the
    sequence resembles a post-act ritual restriction and release.
- id: motif:8
  label: Enemy remains displayed and worn as trophies
  taxonomy_refs: []
  basis: Victims' skulls are kept above the house entrance, while the lower jaw and
    cervical vertebrae may be worn by the payment recipient.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No additional meaning beyond display and wearing rights is stated.
- id: motif:9
  label: Reluctant fire as bad omen for absent warriors
  taxonomy_refs: []
  basis: Fires that do not readily light are regarded as a bad omen for the success
    of warriors away with the war party.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives only this omen's application, not a wider fire-omen
    system.
comparison_claims:
- id: claim:1
  claim: The author cautiously relates Tubetube ceremonial cannibalism to Milne Bay
    practice only as a possible parallel affected by dual clan grouping.
  claim_level: same_motif
  target: Milne Bay ceremonial cannibalism and possible dual clan grouping influence
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: low
  limitations: The note says nothing was known of Tubetube dual clan grouping at the
    time of the visit, and it does not provide detailed Milne Bay evidence in this
    passage.
