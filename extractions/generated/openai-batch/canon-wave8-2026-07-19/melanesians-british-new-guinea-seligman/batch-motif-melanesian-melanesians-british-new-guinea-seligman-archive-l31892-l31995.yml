canonical_text:
  quote: ''
  summary: The passage describes the return of a victorious war party, the reception
    and distribution of a dead enemy or prisoner as gum, procedures for revenge killing
    on a naka, rules of abstention around eating human flesh, payment for the gum,
    post-killing seclusion and purification of the warrior, preservation and wearing
    of body parts as trophies, and a fire-related omen for absent warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When canoes approached the island and victory signs were recognized, the population
    gathered on the beach and began a dance called railsi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the canoes came close to shore, men brought the dead enemy ashore, placed
    the body on a naka, and left it there until portions were distributed like pig
    flesh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A prisoner could be adopted if the beaten party had paid a blood debt, but
    a prisoner selected to die was killed on a naka belonging to the clan of the man
    for whom revenge was taken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the dead man's widow was still mourning, her mourning necklace and armlets
    were transferred to the victim, who was not blackened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The widow thrust pointed sticks into the victim's eyes while taunting him
    about having seen her husband killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dead man's game, identified as sisters' children, speared the victim to
    death, and men of the clan cut up the body on the naka.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The flesh could be eaten by Tubetube inhabitants except for the person who
    killed or captured the gum and certain relatives of the man for whom payment was
    taken.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The widow and children of the dead man, and the wives and children of his
    game, were included among those who abstained from eating the gum.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some people abstained from eating the gum to avoid later endangering its provider
    through careless use or contamination of lime-pots or lime gourds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An informant described the danger of neglecting the lime-pot custom as being
    full of blood and made an upward motion from stomach to throat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The gaioiyai payment for the gum was made to the person who killed or captured
    the man or woman eaten as gum, not to the war-party leader, and a pig with four
    pairs of armshells was described as usual payment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The warrior who killed or captured a victim entered his own house by the back
    door, avoided the naka where the body lay, ate only self-cooked roasted food,
    and remained secluded for three days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After three days the warrior bathed in the sea, was released from food taboos,
    blackened his forehead, temples, and cheeks for another three days, and then washed
    and moved freely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Participants in the cannibal feast had no food restrictions, ate with bare
    hands, and observed continence for a few days after eating human flesh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After victims' skulls were boiled and cleaned, they were kept above the front
    entrance of the house of the payment recipient; that man could also wear the lower
    jaw as an armlet and cervical vertebrae on leglets.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: People who remained at home during a war party's absence had no taboos, but
    fires that did not light readily were considered a bad omen for the absent warriors'
    success.
  category: other
  evidence_refs:
  - ev:9
