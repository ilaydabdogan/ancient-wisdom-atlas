canonical_text:
  quote: ''
  summary: 'The passage describes divorce and adultery procedures: sanctions for infidelity,
    payment of marriage-price compensation, redistribution of the adultery price,
    post-divorce residence and child affiliation rules, other grounds for divorce,
    repayment of damu when a wife leaves, and the named case of Vanitau leaving a
    neglectful husband.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man may send away his wife for infidelity or give her a severe beating.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a husband catches his wife with a lover in the act, he may kill both; otherwise
    he may divorce the woman and seek damages from the lover.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The usual procedure sends the wife to her lover with a request for the amount
    of the marriage price, called damu, paid for her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The adultery price is called laraha, must be paid, and may require help from
    the lover's local group.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Only part of the laraha is kept by the aggrieved husband; the rest is shared
    among his clansmen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A divorced woman may live with her lover if conditions allow, or may return
    to her own people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children generally remain with their father after divorce, with stated exceptions
    for very young children, boys later sent back, and possible affiliation of a girl
    child with her mother's iduku.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Barrenness is not itself a cause of divorce, while bad temper and idleness
    in a woman may lead to divorce.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a girl runs away because of her husband's infidelity and does not quickly
    return, her father must repay the damu to her husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A woman may leave her husband because of constant neglect; Vanitau is given
    as an example.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Ahuia Ova judged Vanitau justified because her husband did not cohabit with
    her, avoided her, and insulted her by refusing food she had cooked.
  category: speech
  evidence_refs:
  - ev:6
