canonical_text:
  quote: ''
  summary: The passage describes southern Massim burial locations, treatment of visitors'
    bodies, disturbance and reburial of earlier remains, visible grave features, and
    reported practices of partial exhumation, including skull deposits in rock crevasses
    and one case of a father keeping his son's dried body because of affection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Government enforcement of cemeteries is said to have profoundly modified the
    actual process of inhumation in the localities discussed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before government cemetery rules, graves in much of the south-eastern district
    were dug on the outskirts of hamlets and sometimes within a few yards of houses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In ordinary circumstances, natives of a hamlet were buried in that hamlet's
    grave area, except when they died away and their bodies could not be carried back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a visitor died in a foreign community, the body was returned to the visitor's
    own hamlet if possible; otherwise burial depended on clan representation or distance
    from hamlet-group graves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Where burial areas were small, previous burials were frequently disturbed,
    and the remains were handled and reburied in the new grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old graves could be indicated by heaps of stones or shrubs, but the passage
    says these were not intentionally planted or collected as grave markers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: One older Teste Island grave had neat fencing, and a young coconut palm beside
    the grave was probably from a coconut placed on posts around the grave.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author distinguishes the exhumation under discussion from the sporadic
    practice of digging up and eating corpses mentioned elsewhere.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Thirty-four skulls were reportedly procured from what was called a cave at
    Awaiama in Chad's Bay, which the author believes was really a crevasse in the
    rock; no long bones or other bones were seen with the skulls.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Gogowari on Rogea there is reported to be a place of skulls called moiaru,
    described as a deep rock crevasse where skulls are or formerly were deposited.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mr Abel is reported to regard taking skulls from graves and depositing them
    in such places as a sign of love or friendship.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A man of Farm Bay is said to have kept the dried body of his son in his house
    because he had loved him dearly.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The author states that bodies are buried upright in a squatting posture with
    the head only a little below the surface, making later skull removal easy after
    decay.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The author concludes that partial exhumation is not necessarily alien to southern
    Massim beliefs and customs, while also saying the practice is not general throughout
    the district.
  category: relationship
  evidence_refs:
  - ev:12
