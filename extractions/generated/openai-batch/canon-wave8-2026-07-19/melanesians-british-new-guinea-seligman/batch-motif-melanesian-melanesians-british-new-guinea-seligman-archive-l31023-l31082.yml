canonical_text:
  quote: ''
  summary: The passage describes minor forms of warfare and brawling among Southern
    Massim communities. Quarrels may arise from failure to receive expected food at
    a feast, jealousy over love affairs, deliberate insults involving dead fathers
    or incest accusations, or disputes over women and pigs. It notes escalation from
    individual provocation to clan or community fighting, and describes compensation
    with valuables after wounding or killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A milder form of warfare could occur between usually friendly communities
    and might involve little destruction: coconuts were not cut down, houses were
    rarely or never burnt, pigs were usually not carried off, and dead men were not
    eaten or beheaded.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A quarrel could begin when a man did not receive a food present at an important
    feast such as a toreha, expressed dissatisfaction, and injured a man from the
    feast-giving hamlet-group.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The footnote gives an example in which fighting was attributed to a man not
    receiving what he considered his due share of food at a feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the example, Sarokiko of Gomagaboina became angry when his name was not
    called during the distribution of presents, threw a stone at a house, and chopped
    down the platform on which yams were placed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Boasting about love affairs at feast gatherings and the jealousy that resulted
    were recognized sources of minor warfare.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Certain insults, including saying that a man's father was dead, naming his
    dead father, or accusing him of incest with mother or sister, were said to be
    grave enough that the speaker should be ready to fight immediately.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After such an insult, the abused man was expected to attack with whatever
    weapon was handy, and each man's clan or community could join the fight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brawls within a community over women or pigs could lead to wounding or killing
    and were usually settled by handing valuables to the injured man or, if he was
    killed, to his relatives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A homicide in such a brawl was reproved by others and could remain at risk
    of being speared by the victim's relatives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The passage records local terms for these brawls: raua at Taupota, probably
    also at Wagawaga, and sasara ipaua at Tubetube.'
  category: speech
  evidence_refs:
  - ev:5
