canonical_text:
  quote: ''
  summary: 'The passage describes the origins and recognition of charm objects: local
    and Papuan Gulf sources, Vailala-associated yam charms, health and agricultural
    charms, criteria of resemblance, rarity, and unusual shape, dream revelation by
    spirits of dead Koita, and careful handling of highly charged quartz charms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most charm stones are said to be picked up in the district where they are
    used, while some charm materials may come from the Papuan Gulf.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Museum examples include yam charms attributed to Vailala, and Chalmers is
    cited as saying that charms used in planting and fishing at Port Moresby and other
    coastal places were obtained from Vailala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A health-restoring charm used by an old woman near Port Moresby consisted
    of reddened halves of an old broken Gulf coconut charm box tied together.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that natural bodies are generally recognized as charms
    because of similarity to the object influenced, rarity, or unusual shape in otherwise
    common objects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some yam and banana charm stones have contours or projections resembling crop
    forms, including projections compared to the sprouting eye of a yam.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cassowary claws and crocodile teeth are used as adjuncts to other charms and
