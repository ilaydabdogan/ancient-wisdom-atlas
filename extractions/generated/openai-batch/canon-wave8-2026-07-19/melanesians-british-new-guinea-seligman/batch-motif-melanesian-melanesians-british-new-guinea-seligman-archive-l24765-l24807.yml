canonical_text:
  quote: ''
  summary: 'The passage gives geographical and historical notes on settlement movements:
    Lekekeu is deserted after older men died and younger people moved to Hanavesu;
    Tubetube is described as a peaceful colony from Bebwaiya on Duau, first settled
    by Gegera totem men at Dagedagera and later by other totem groups; traffic with
    Duau used Duau-built kebwaii canoes; the founders are said to have lived at Dobu
    before Bebwaiya; a footnote notes shallow dry-season wells behind the beach.'
