canonical_text:
  quote: ''
  summary: The passage describes food taboos and related practices among named communities,
    including prohibitions for unmarried people, pregnant women, mothers after childbirth,
    and husbands during a wife's first pregnancy or childbirth period. It lists forbidden
    and permitted foods, special cooking vessels, naming terms, disposal of peelings
    in running water, and stated consequences for violations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Bartle Bay, unmarried persons of both sexes avoided wallaby because it
    was said to cause dislike by members of the opposite sex, and they avoided a lily-like
    root because it was said to cause rash, weakness, and unsatisfactory intercourse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, a pregnant woman was forbidden fish caught in a net and sugar
    cane, but not fish caught by line or spear, pig, or wallaby; she continued cooking,
    gardening, and fetching water, while her own food was cooked in a special smaller
    saucepan.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Tubetube, a pregnant woman was forbidden turtle, the fish tuai, and fish
    caught in the small-meshed scoop nets called kware; the stated reason was that
    such fish would prolong labour and could cause death undelivered, while fish caught
    in the large-meshed inai net could be eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tubetube information about kware and inai nets is stated in a note to
    apply with equal force to Milne Bay.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Wagawaga, a mother after childbirth ate boiled taro mixed with whole boiled
    okioki, also called demaia, for at least a month, using a small new pot for her
    food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that a Wagawaga mother could eat okioki after childbirth
    even if she belonged to, or was related through her father to, clan Garuboi, whose
    plant totem was okioki.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the first month at Wagawaga, the mother still could not drink cold water;
    she generally kept to taro and okioki juice, with possible additions of warmed
    water mixed with dried coconut scrapings, taro, and dried coconut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Tubetube, the young mother during the puerperium could drink only warm
    water and had to avoid fish, turtle, and pig; violation was said to cause her
    child to sicken and probably die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Bartle Bay, every mother was said to observe fasting customs after each
    birth, especially after the firstborn, with some foods forbidden and other foods
    specially eaten.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a Bartle Bay woman was pregnant with her first child, women friends prepared
    special food and presented it to the husband and wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The pregnant Bartle Bay wife was called meumeu in the husband's hearing until
    the child was born, after which she was called kamoti.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: From the time she was first called meumeu until the child was born, the Bartle
    Bay mother prepared, cooked, and ate her food by herself, and the peelings were
    thrown into running water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The husband of a Bartle Bay meumeu could not plant sugar cane or uri and had
    to avoid tying food bundles with leaves or tops bent down; the husband of a kamoti
    was not restricted in this way.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage also states that old men generally abstained from human flesh,
    referring the topic to another chapter.
  category: action
  evidence_refs:
  - ev:1
