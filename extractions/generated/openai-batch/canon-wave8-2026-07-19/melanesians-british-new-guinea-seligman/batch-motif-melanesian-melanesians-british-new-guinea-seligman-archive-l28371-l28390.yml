canonical_text:
  quote: ''
  summary: The passage describes adoption practices at Wagawaga and Tubetube. Children
    could be adopted by men or women, generally only when sharing the adopter's totem.
    Captive children near puberty could formerly be adopted into the clan and would
    assume the adopter's totems. A female captive adopted by a man was treated as
    his sister, making marriage or prolonged sexual relations with her impermissible.
    Adopted children were usually not removed from their mothers until weaned.
