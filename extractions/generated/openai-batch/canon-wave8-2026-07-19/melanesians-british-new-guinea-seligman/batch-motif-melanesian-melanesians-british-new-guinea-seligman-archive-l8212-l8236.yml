canonical_text:
  quote: ''
  summary: The passage reports that the Koita formerly had no gambling or betting,
    but that at the time of the account young and some middle-aged men gambled heavily
    using cards, often staking wages and property. Young Koita and Motu adults played
    through the night in shelters near Port Moresby, impairing next-day work, and
    a regulation restricted native servants from being outdoors in the white settlement
    after 9:30 p.m. without written permission.
