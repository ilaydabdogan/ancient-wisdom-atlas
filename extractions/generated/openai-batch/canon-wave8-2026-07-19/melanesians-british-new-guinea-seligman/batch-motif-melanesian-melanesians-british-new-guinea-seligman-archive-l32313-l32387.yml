canonical_text:
  quote: ''
  summary: The passage describes responses to garden theft, house theft, theft or
    killing of pigs, concealment of valuables from certain affinal relatives, and
    return or in-kind payment for stolen portable property. Embedded notes describe
    sex-differentiated suicide methods and several suicide examples involving trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Garden theft is described as formerly uncommon; under an older practice, a
    stranger caught stealing in a garden could be killed there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fellow-clansman stealing from gardens would not be killed and usually would
    be reproved, shamed, or sometimes thrashed on the spot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are said to have committed petty thefts from one another's gardens;
    a caught thief might be struck with a digging stick, leading to a small fight
    after which the matter was dropped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Petty house theft involved small items such as fishing lines, tobacco, and
    other trifles; if discovered, the response might be strong talk or a small brawl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man suspecting theft might say nothing and later steal something from the
    suspected man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Valuable personal ornaments were hidden or carried about, partly from fear
    of licensed depredations by a man's wife's sisters, and to a lesser degree his
    wife's mother and maternal uncles.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A cited observation says that the usual male method of suicide was to climb
    a coconut tree and jump, while the usual female method was hanging from a tree
    limb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that suicide is far from rare in the south-eastern district
    and notes a suicide in the folk-tale 'The Lily Root'.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: In one suicide example, a mother reproved a girl associated with her son;
    the girl hanged herself with pliable bark, and the youth then climbed a coconut
    tree and threw himself down.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In another example, a father took sugar-cane from a small boy, after which
    the boy climbed a coconut tree and threw himself to the ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: If a man killed another man's pig, the pig's owner might kill or steal one
    of the offender's pigs or might attack the offender, though matters were generally
    discussed and settled without bloodshed.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Thefts of nets, pots, and similar portable property are described as rare;
    when discovered, the stolen property was returned or paid for in kind.
  category: action
  evidence_refs:
  - ev:11
