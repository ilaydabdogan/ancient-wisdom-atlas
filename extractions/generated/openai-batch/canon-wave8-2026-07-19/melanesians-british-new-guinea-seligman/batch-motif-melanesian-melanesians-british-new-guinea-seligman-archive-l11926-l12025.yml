  summary: The passage describes external relations of Roro-speaking tribes, including
    limited trade, canoe and Lakatoi acquisition, annual au nohi travel, shell and
    armshell exchange routes, markets with Mekeo, indirect acquisition of tools and
    feathers, intermarriage and warfare, attacks by Elema/Lese groups, Waima friendship
    with Oroi, and a guest network for a niarea inauguration.
  language: English
  quote_policy: summarized
