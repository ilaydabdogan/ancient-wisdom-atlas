  quote: ''
  summary: Ethnographic passage describing reported exhumation and eating of buried
    relatives, local claims and disputes about custom, associations of grave-opening
    corpse-eating with sorcery or parauma, reports concerning children, rules and
    abstentions around cannibal feasts, preparation of human flesh, and the author's
    view that public cannibalism in parts of south-eastern New Guinea served vengeance
    and appetite rather than magical transfer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Central Court case at Samarai involved two adult women and a girl accused
    of desecrating a sepulchre; the oldest woman was the mother of the other two.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder daughter's little child had died and been buried, and about a day
    later the accused dug up and ate the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three accused women came from a village near the head of Milne Bay, claimed
    that the act was a custom, and received a short term of imprisonment; evidence
    about whether such practice ranked as a custom was conflicting.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A report attributed to Chalmers mentions a Bonarua woman near South Cape who
    dug up her buried husband to feed her friends, causing indignation among men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that the practice formerly occurred over a wide area, probably
    sporadically, with possible greatest intensity in the D'Entrecasteaux Groups.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports a common district opinion that sorcerers open graves and
    eat corpses; Mr Abel and the author connect this belief with magical significance,
    while noting lack of satisfactory evidence for many grave openings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mr Giblin hypothesizes that the three women may have wanted to become parauma;
    anecdotes in the passage associate becoming or being parauma with eating buried
    bodies or corpses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says children, especially illegitimate children, were sometimes
    killed and eaten, but the author treats the frequency and recent information as
    uncertain or unconfirmed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage points elsewhere in the book for conditions governing participation
    in cannibal feasts and ceremonial abstinence imposed on men who captured or killed
    the person eaten.
  category: other
  evidence_refs:
  - ev:10
- id: obs:10
  text: In non-ceremonial cannibalism, children were not allowed to eat human flesh,
    pubescent men and women were allowed, some women and men avoided it, and toothless
    old men usually abstained and were not normally named during distribution.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Human flesh was generally boiled or cooked in a native oven; certain parts
    were especially valued, and Waieraiena of Wagawaga was noted for insisting on
    eating his portion raw contrary to usual custom.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author states that public cannibalism at Wagawaga and Tubetube had no
    magical significance, did not transfer wisdom or prowess, and was connected with
    vengeance for a hamlet-group member and desire for human flesh.
  category: other
  evidence_refs:
  - ev:9
