canonical_text:
  quote: there is now no effective copyright in this pattern upon bone implements
  summary: The passage describes how hereditary clan or local-group designs called
    oada/dada, often derived from animal emblems such as the hornbill or crocodile,
    have become used more widely as decorative patterns on utensils, marea posts,
    and ornaments. It gives examples from Waima, Abotaiara, Roroaiera, and Hisiu,
    noting disputes over rightful use, copying, hereditary carving, and confusion
    caused by group fusion.
  language: English
  quote_policy: quoted
