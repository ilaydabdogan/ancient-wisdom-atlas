canonical_text:
  quote: ''
  summary: The passage describes Roro-speaking clan badges or distinctive forms expressed
    in feather-dancing headdresses, named headdress frameworks for several Yule Island
    clans, representations on Kaivakuku masks, and restricted architectural details
    whose copying could provoke complaint. It also notes that hornbill mandibles in
    Waima settlements are ordinary ornaments without special significance.
  language: English
  quote_policy: summarized
