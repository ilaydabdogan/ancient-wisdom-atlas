canonical_text:
  quote: ''
  summary: 'The passage describes Koita household composition: a house normally contains
    one family, typically parents and children, sometimes with an older surviving
    relative. Unmarried or widowed siblings may live with married relatives. Household
    size is said usually not to exceed about six people, and Ahuia''s count gives
    an average of a little over or around five people per house in Hohodai and Guriu.'
