  quote: ''
  summary: The passage describes succession discussion for an iduhu rohi, the recognition
    of sectional headmen, and the duties and limits of iduhu rohi in feast organization,
    peacekeeping, and land-permission matters among Koita groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The successor to Ganiga Egahu had not been decided; Arua Ganiga, Hera Maraga,
    and Egahu Vani are each mentioned as proposed successors by different parties.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In each Koita section, one particular iduhu rohi was recognized as chief or
    head man of the whole section and was called rohi ketaike or rohi baugi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sectional chieftainship in Dubara iduhu of the Hohodai section was traced
    to Nagu Kawea and then maintained by his son and successors.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The iduhu rohi is responsible for sharing out food at koriko feasts and helps
    determine feast timing by visiting gardens and watching produce ripen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bananas for koriko feasts are brought to the house of the iduhu rohi and left
    hanging on his verandah before being piled into heaps.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Idhuhu rohi of sections discuss feast and ceremony dates and details, but
    cannot enforce their wishes against the general sense of the older men; their
    detailed ceremonial orders are nevertheless obeyed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Idhuhu rohi act to keep peace and mitigate friction between clans, including
    reasoning with a man accused of maltreating his wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a man refused the iduhu rohi's advice in such a domestic-conflict case,
    the iduhu rohi would withdraw from the matter, and formerly a wider fight between
    relatives could result.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Land questions are formally brought before iduhu rohi, even without active
    quarrel; Tupa families identified with Dubara sought permission to garden on Taurama
    and Vaiu land, with confirmation by the Dubara iduhu rohi.
  category: relationship
  evidence_refs:
  - ev:6
