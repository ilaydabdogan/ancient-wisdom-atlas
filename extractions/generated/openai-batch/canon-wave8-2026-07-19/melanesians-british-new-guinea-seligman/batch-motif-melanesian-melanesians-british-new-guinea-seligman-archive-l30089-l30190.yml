canonical_text:
  quote: ''
  summary: The passage describes inheritance and post-mortem property disposal rules,
    including male and female property categories, transfers to sisters' children,
    limited inheritance by direct children, duties of maternal uncles, Bartle Bay
    funeral practices, widow and orphan residence, and avoidance or alteration of
    houses associated with death because of sorrow and fear of returning spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage distinguishes two categories of a man''s personal property: use-items
    such as drums, lime pots, lime spatulae, canoes, and fishing nets, and valuables
    such as armshells and sapisapi necklaces.'
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A man's drums, lime pots, lime spatulae, canoes, and similar property are
    said to pass to his sisters' children; if he has no sisters' children, his maternal
    uncle takes them before they later revert to the dead man's brothers and sisters.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some valuable property, including shell jewellery and sometimes pigs, may
    pass in part to a man's own children, but previous gifts to them are remembered
    and counted against them after his death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who is ill may express wishes that particular jewellery descend to his
    children, and the passage states that such wishes would be respected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a man is childless and has no surviving brothers or sisters, his sisters'
    children take the whole of his property.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman's garden property is divided equally among her children; if they are
    young, their mother's brothers look after the gardens and may use surplus crops
    not needed for the children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman's personal property may pass to her brothers and sisters if her children
    are small, but later portions of valuable property may be given to the children;
    grown daughters inherit baskets and pots, while both boys and girls may inherit
    valuables.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Bartle Bay, a man's personal property is partly used to pay for burial
    offices, and some is reserved to be burned at the torela completing his death
    feasts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Bartle Bay, coconut palms and fruit trees go to a man's sisters' children,
    though a man can to some extent indicate posthumous wishes for disposal of property.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A widow usually remains only briefly in her dead husband's house and then
    goes to live with a brother, taking her children with her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Maternal uncles are described as natural guardians responsible for boys' education
    and as more responsible for children than the father when a mother dies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In olden days, a house in which a man died was usually shut up and left to
    rot; if it was good and new, it could be used by the dead man's sisters' children
    after the old doorway was closed and a new one cut.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The desertion or destruction of a death house is explained as possibly a sign
    of sorrow and also as a measure to prevent evil spirits, glossed in a note as
    spirits of the dead, from returning and affecting family members.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Orphan children should generally live with their mother's relatives, especially
    her brothers, though the rule has exceptions based on clan strength and capacity
    to support them.
  category: relationship
  evidence_refs:
  - ev:10
