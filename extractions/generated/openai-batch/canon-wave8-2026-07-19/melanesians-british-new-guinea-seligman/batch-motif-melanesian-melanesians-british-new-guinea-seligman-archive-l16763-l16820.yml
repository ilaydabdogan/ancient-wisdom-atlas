canonical_text:
  quote: ''
  summary: 'The passage reports details about harihu masks and several forms of minor
    magic: hunting magic for dogs using stolen food and anger, drum-making taboos
    characterized as sympathetic magic, possible local-group association of kaivakuku,
    and several Siria love charms involving bodily materials, coconut and stingray
    spine, or a human body part kept by sorcerers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Harihu masks are said to differ from one another, often bear the owner's clan
    badge, and are reportedly burnt after each occasion.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: All Elema villages are said to have harihu, but harihu reportedly do not appear
    simultaneously in neighboring villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dogs were medicined before hunting in a way said to resemble a Koita practice
    described elsewhere in the source.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a dog to succeed in hunting wallaby, its owner is said to steal food and
    give it to the dog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the person from whom the food was stolen becomes angry, that rage is believed
    to influence the dog and make it a keen, fierce hunting dog.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Taboos imposed on youths while making drums are described as typical examples
    of sympathetic magic in the district.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: A note cautiously suggests that each local group or itsubu may have had one
    kaivakuku, and reports that Dr Strong was told there were formerly twenty kaivakuku
    in Waima, approximately the number of Waima settlements.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: One Siria love charm is made by mixing dried umbilical cord with tobacco the
    chosen girl will smoke, with lime she will use when chewing areca nut, or with
    dried powdered shark skull.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another love charm has the would-be lover hide in the bush with a view of
    the track on which he expects the girl to pass, carrying a germinating coconut
    and a stingray spine.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In that charm, the young coconut shoot is broken off, and as the girl approaches
    the boy slowly thrusts the stingray spine into the eye of the coconut and moves
    it in the soft substance of the nut.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The coconut and stingray-spine love charm is said to be especially efficacious,
    not widely known, and probably recently introduced.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sorcerers are said to use portions of the human body for magical purposes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A human penis enveloped in clay is described as a potent love charm kept by
    sorcerers, borrowed by a youth, and worn round his neck while he speaks to the
    girl he wants to influence.
  category: object
  evidence_refs:
  - ev:7
