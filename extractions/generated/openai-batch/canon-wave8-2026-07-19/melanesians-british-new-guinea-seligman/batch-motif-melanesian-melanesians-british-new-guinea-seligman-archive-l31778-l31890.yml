  cautions: The passage reports an ethnographic practice rather than a narrative episode;
    no broader symbolic explanation is supplied.
- id: motif:2
  label: mourning through destruction of the deceased’s property trees
  taxonomy_refs: []
  basis: Mourning customs are initiated by felling two coconut trees belonging to
    the deceased.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain the meaning of the tree felling beyond naming
    it as the beginning of mourning customs.
- id: motif:3
  label: same-clan avenger leader for a slain kinsman
  taxonomy_refs: []
  basis: A taniwaga is selected for vengeance and always belongs to the same clan
    as the dead man, generally also the same hamlet.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a social rule for leadership, not a mythic genealogy
    or charter.
- id: motif:4
  label: pre-raid feast and leader’s exhortation
  taxonomy_refs: []
  basis: Before departure the taniwaga and relatives provide food for the losuma feast,
