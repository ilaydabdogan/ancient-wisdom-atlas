canonical_text:
  quote: ''
  summary: The passage describes an ethnographic account of Tubetube practices surrounding
    cannibalism, mourning, vengeance warfare against hostile Basilaki communities,
    preparation of a war party, a nocturnal raid, taking a prisoner and a corpse,
    and return performances involving drums, conch shells, and the besa dance, with
    the killer and captor remaining silent and apart from the dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women and children generally did not eat human flesh, but a small portion
    might be given to a woman so that she might bear a strong child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described scenario assumes that a Tubetube man has been killed by men
    of a hostile Basilaki community after an ambush or hostile shore encounter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The returning canoe crew paddled slowly and wailed for the dead comrade as
    they neared the Tubetube beach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people on shore asked what had happened and were told that a named man’s
    brother had been killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mourning customs began with the felling of two coconut trees belonging to
    the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When vengeance was decided, a war-party leader called taniwaga was selected
    from the same clan as the dead man, generally from the same hamlet.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The taniwaga and his near relatives provided most of the food for the losuma
    feast held shortly before departure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After boarding, the canoes drew offshore in silence while the taniwaga gave
    a short speech urging the men to fight well with spears and receive his payment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At departure there were no conches and no shouting; the canoes left quietly,
    using a dark night and aiming to arrive before daybreak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Basilaki the canoes were moored in a quiet bay, with men left aboard so
    that retreat could be quick if needed.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Armed parties surrounded the hamlet, and the leader mounted a house platform
