  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The noise of alarm from the attacked inmates signaled the raiders to rush
    the houses before the occupants could escape into the darkness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A surprised hamlet usually fled to the bush; the passage says there was no
