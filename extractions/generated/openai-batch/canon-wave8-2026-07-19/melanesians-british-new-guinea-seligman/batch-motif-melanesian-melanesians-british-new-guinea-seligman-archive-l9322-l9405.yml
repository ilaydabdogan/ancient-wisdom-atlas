  quote: ''
  summary: 'The passage gives untranslated song text, followed by S. H. Ray''s linguistic
    comments on some song words, and an ethnographic description of Koita dances:
    slow columnar movement, detached groups, participation by men and unmarried girls,
    use of drums and bamboo dancing sticks, precise rhythmic motion, girls'' petticoat
    and tattoo display during vigorous dancing, comparison with Motu dances, and the
    popularity of the bamboo dance Maginogo among the Hohodai Koita.'
