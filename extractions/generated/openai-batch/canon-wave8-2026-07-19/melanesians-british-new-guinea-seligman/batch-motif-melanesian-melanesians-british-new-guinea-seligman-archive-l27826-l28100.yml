  summary: The passage describes hamlets as social units largely coextensive with
    family groups, explains a genealogy diagram for Wagawaga Pupuna, states that its
    inhabitants largely descend from a single couple three generations earlier, and
    discusses co-residence, hamlet expansion, adoption of strangers into Kanabwahi
    and clan Garuboi, garden land allotment, mixed-stock hamlets, nakanaka, old-site
    prohibitions, and continued respect for a father's totem bird gimo, a dove.
  language: English
