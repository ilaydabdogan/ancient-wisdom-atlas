canonical_text:
  quote: ''
  summary: The passage describes what may be reserved by taboo at Wagawaga and Tubetube,
    the signs used to mark protected things, the distinction between warning signs
    and signs empowered by medicine or spells, and the use and removal of taboos on
    trees, produce, reefs, and fishing grounds. It also notes post-taboo distribution
    of fish catches and footnote comparisons to Awaiama and Dobu practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga and Tubetube, reserved or specially protected things include food,
    garden produce, fish on certain reefs, and at Wagawaga pigs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A taboo requires a visible sign affixed to the protected thing or erected
    nearby; the general names given are hato at Wagawaga and dederi in Tubetube.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The signs are described as warnings rather than inherently forceful objects;
    protection may rest on an owner's wish, public opinion, or medicine understood
    as magic.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicine associated with taboo is said to be made by certain old men reputed
    as sorcerers and paid for their services, although sorcery is legally punishable
    and publicly denied.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One common Wagawaga sign is a sago or coconut leaf tied around a tree trunk;
    in theory this sign has no magical sanction and marks a desire that tree produce
    be protected.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A different sign, giribay, is a sago or coconut leaf knotted around a tree
    trunk and smeared with medicine by an old man who recites the proper formulae.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The giribay sign is said to have disease-producing power and to protect the
    tree absolutely, affecting the owner as well as strangers until removed by the
    medicine man who imposed it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After removing such a taboo, the medicine man receives some of the tree's
    fruit as payment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Wagawaga, Tubetube, and the district lack a developed
    personal-influence mana taboo in which a thing receives a dynamic charge from
    contact with an individual.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Reefs and fishing grounds near a hamlet are considered in a special sense
    that hamlet's property, and its old men can protect them by taboo against the
    whole hamlet-group.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: If no taboo sign is displayed on a reef, anyone may fish there regardless
    of hamlet rights.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After removal of a reef taboo, men from other hamlets commonly join the first
    fishing; the catch is brought to the hamlet with the taboo right and divided into
    equal shares by an old man.
  category: sequence
  evidence_refs:
  - ev:8
