  quote: "“The stone adzes, ready made, swam like fish, and they caught them in their
    nets.”"
  summary: The passage describes lakatoi cargoes of sago, then explains that stone
    adze blades were formerly traded to the Gulf. Motu people obtained them from Koiari,
    who reportedly received them from farther inland, though their ultimate origin
    was unknown locally. A Motu tradition says certain men procured ready-made stone
    adzes by wading in streams with hand-nets, catching the adzes as they swam like
    fish; such catchers could be recognized by scarred legs from adzes attempting
    to evade capture.
