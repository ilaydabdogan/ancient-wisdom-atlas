canonical_text:
  quote: ''
  summary: 'The passage describes the koriko feast at Hohodai in 1904: men gather
    bananas and yams, arrange them in heaps, divide them into smaller portions under
    supervision, distribute them to neighboring communities and selected recipients,
    and cook and eat the reserved portions. It also describes seed-yam handling and
    Ahuia''s drawing of the ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All iduhu of the village take part in the koriko feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men, and men only, gather bananas and pile them in heaps called teri in front
    of an iduhu rohi house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Hohodai, about one hundred bunches of bananas were arranged in eight heaps
    in the village street opposite the house where Taubada and Ahuia live.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yams were piled on the verandah of the same house; pieces called eyes had
    been removed, and those eyed portions were to be planted as seed yams after two
    or three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Every man contributes some yams, but the passage states that not all seed-providing
    yams are distributed at koriko and the distributed yams are not necessarily the
    last of the year's crop.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After deliberation by old men, the teri were divided into smaller heaps called
    karoa under the supervision of Taubada and Ahuia, and yams were added to each
    karoa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The karoa were distributed among neighboring Koita villages, with Hanuabada
    and Tanobada included as a modern exception; these Motu recipients do not return
    karoa but give Hohodai sago.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Eighteen karoa were made; named villages and the local Polynesian missionary
    received portions, and the equivalent of two karoa was kept at Hohodai.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hohodai youths carried distributed karoa to recipient villages and left one
    karoa on each iduhu rohi verandah, where the bananas and yams would be cooked
    and eaten by the men of that village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Hohodai, the reserved food would be cooked on the verandah of the house
    where Taubada and Ahuia live and eaten by all the men of Hohodai.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ahuia's drawing of the koriko ceremony shows sugar-cane uprights, heaps of
    yams and bananas, and open pots called nau; the author notes uncertainty about
    the pot contents and states that no sugar cane or boiled vegetables were distributed
    at the observed feast.
  category: object
  evidence_refs:
  - ev:8
