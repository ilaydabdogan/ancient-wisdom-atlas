canonical_text:
  quote: ''
  summary: The passage describes the heni ceremony for a first-born child, in which
    the decorated infant and mother go to the maternal grandmother's house with a
    sister-in-law carrying ritual objects. Maternal-side relatives strip and receive
    ornaments and objects, redistribute some of them, and make an equivalent return
    present for the father's relatives before mother and child leave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heni ceremony is connected with a first-born child of either sex when
    the child is about three or four weeks old.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The infant is decorated with New Guinea finery, and the mother is similarly
    decorated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother carries the child to her mother's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother's sister-in-law walks behind carrying an empty pot, a spear, a
    petticoat, and a firestick.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child's father remains quietly in his own house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the maternal grandmother's house, the infant's mother and her sister-in-law
    sit, smoke, talk, and chew betel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The infant's yaiya, identified as the wife of its maternal uncle, removes
    the ornaments from the mother and child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ornaments, spear, pot, and petticoat go to maternal-side raimu and wahia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The maternal-side relations keep some of the received items and give the rest
    away to their clansmen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that the distribution repays clansmen who helped make up
    an equivalent return present.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The equivalent return present should be given before the mother and child
    leave the house and is divided among the infant father's relatives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A native drawing of the ceremony is described as showing the child's aunt
    carrying only a firestick and exaggerated tattooing on both figures.
  category: other
  evidence_refs:
  - ev:5
