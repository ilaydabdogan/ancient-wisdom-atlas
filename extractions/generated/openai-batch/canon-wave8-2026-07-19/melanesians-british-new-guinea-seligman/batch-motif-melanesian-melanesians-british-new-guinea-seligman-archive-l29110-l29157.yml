canonical_text:
  quote: ''
  summary: The passage describes courtship practices involving visits to a girls'
    potuma and, for Tubetube, nocturnal visits by a youth to a girl inside her house.
    It emphasizes hospitality toward strangers, formal secrecy, female invitation
    for repeat visits, and possible marriage if a youth is found in the morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A visiting stranger could ordinarily visit the girls' potuma in the evening
    unless he was married and travelling with his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A local man acted as ambassador when introducing the stranger and was expected
    not to disadvantage him by mishandling his name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports no jealousy or snubbing of strangers at the potuma, and
    suggests a stranger may have had a small advantage because he came from a distance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stranger who chose not to visit the potuma was not pressed, and refusal
    was not treated as a breach of etiquette.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Tubetube, where there were no girl-houses, a youth asked a girl whether
    she would receive him, or accepted her advances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the girl assented, the youth waited near the house until talking ceased
    and older occupants were presumed asleep, although this waiting was described
    as a formality.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The youth entered by the back, identified as the woman's door, and found the
    girl waiting near the woman's fireplace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youth and girl stayed together most of the night, speaking quietly so
    as not to disturb the other occupants.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The youth left before daylight by the same door, while decorum required an
    appearance of secrecy even if household members knew and discussed the visit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the youth overslept and was discovered in the morning, marriage was generally
    suggested and often agreed to, though he might also face the situation without
    being threatened or abused.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After a first night together, a second visit depended on the girl asking the
    boy to return; the proposition for a second night did not come from the male.
  category: relationship
  evidence_refs:
  - ev:10
