canonical_text:
  quote: ''
  summary: 'The passage records omen beliefs from Wagawaga, Tubetube, and Bartle Bay:
    totem trees, birds, nocturnal animal cries, fireflies, and blood from accidental
    injury are treated as signs of death, war success, fishing luck, or kin misfortune;
    one fishing-net observation involving beche-de-mer is treated as repeated practical
    observation rather than a true omen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Wagawaga, seeing totem birds was not considered specially lucky before
    fighting or at other times, while omens were taken from the behavior of the totem
    tree.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man working in his garden saw his father's totem tree shed a leaf that
    moved or walked along the ground, he would know that his father was dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a man's own totem tree behaved in the same way, he would expect to hear
    of the death of his mother or sister.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the cry of the bunebune bird was heard while a man or woman was ill, the
    patient was expected to die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A beche-de-mer entangled in a fishing net was said to mean that no fish would
    be caught, but the passage says this seemed more like repeated practical observation
    than an omen.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Tubetube, on a fighting expedition it was good for a man to hear or see
    his totem bird while approaching the shore of a hostile community, and hearing
    the cry was more important than seeing the bird.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If totem birds were not heard or seen on a Tubetube war expedition, the party
    could hardly expect victory; totem fish and snakes did not betoken luck on the
    war-path.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When fishing on the reef at night, hearing the flying fox mariboi was good,
    while hearing the lowiri bird was such bad luck that a fishing party usually returned
    at once.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Bartle Bay, if a firefly entered a house at night, it was a sign that someone
    in the house would die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Bartle Bay, if a man working in the garden or away from home cut himself
    with a digging stick so that blood flowed, he expected that an accident had happened
    to one of his relations at home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note identifies the totem-tree omen as an example of a life token and points
    to the Taupota story of Taukunugegewari as another example.
  category: relationship
  evidence_refs:
  - ev:8
