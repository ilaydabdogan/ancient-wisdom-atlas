canonical_text:
  quote: ''
  summary: The passage describes procedures for loading and sailing a hiri lakatoi,
    including placement of pots, orientation of the vessel, restricted roles of baditauna,
    doritauna, udiha, and cooks, taboo observances, food actions at the masts during
    one 1906 voyage, arrival at Kaimare, and a disputed account of an older Hall Sound
    ceremony involving cassowary feathers and possible spirit-averting purpose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vessels are loaded with pots; pots belonging to the baditauna and doritauna
    are placed in the kalaga, while the rest are packed in dry banana leaves in shelters
    on the lakatoi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the outward voyage the end belonging to the baditauna becomes the bow;
    on the return the end belonging to the doritauna becomes the bow, unless a head
    breeze changes the forward end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The baditauna and doritauna are said probably to interfere little with ordinary
    navigation, but to take charge and give obeyed orders in difficult positions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The two udiha are confined to their shelter beside the kalaga and leave it
    only for bodily necessity; access to that shelter is restricted to them, their
    two masters, and two chosen cooks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cooks chosen for the voyage are to be unmarried youths, and their cooking
    follows restrictions like those applied to women cooking before departure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The vaina hung above the udiha should not swing; if the vessel rocks and sets
    it in motion, it is steadied with guy strings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the voyage the same foods remain taboo to the captains as before departure,
    but the crew has no food taboos imposed on it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the Kevaubada voyage, older men placed bananas and yams at the foot
    of each mast while passing Yule Island; the crew cooked and ate this food the
    same day, but the baditauna, doritauna, and udiha did not eat it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Kevaubada entered the Kaimare creek without awaiting permission, was escorted
    by many Kaimare canoes, and anchored between the Kaimare villages.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Chalmers's account of an older Hall Sound ceremony, a robber-chief took
    his little nephew, handed him cassowary-feather wisps, shook them with bodily
    motion before both masts, and all shouted as if driving something away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Chalmers explained the Hall Sound ceremony as an incantation to drive away
    troublesome Lolo spirits said to detain lakatois at that place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Keori confirmed that a ceremony of that sort was formerly performed at Hall
    Sound, but said it resulted from Edai's command when Edai taught Edai Siabo the
    management of the lakatoi trip, and denied that it referred to spirits of people
    killed by the Motu.
  category: speech
  evidence_refs:
  - ev:9
