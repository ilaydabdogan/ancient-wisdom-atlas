  summary: The passage describes the eaii rove as the exclusive ornament and insignium
    of chieftainship, publicly invested on young chiefs before puberty. It explains
    its boar-tusk form, its wearing on the chest, its carved representation on a marea
    pole, names of chiefs' houses, and a reported Waima succession custom in which
    a brother succeeds when a chief dies without sons.
