canonical_text:
  quote: ''
  summary: The passage classifies oaoa or dada found on marea clubhouses and describes
    how local-group, foreign, and associated badges are displayed on structural parts
    of marea. Examples include garfish, fish-tail, hornbill, lizard, bird, and chelonian
    forms carved on posts, poles, boards, and suspended figures. It also notes former
    representation of participating clan badges in special aruaru marea used for initiation
    ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage classifies oaoa found on marea into four groups: badges of the
    owning local group, foreign badges, property of the ovia itsipana of the owning
    local group, and oaoa associated with a named marea building.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ovia Pokina and Koae Kupunu local-group oaoa are displayed on the Kevori and
    Boaiota marea of Siria village, carved on projecting ends of rounded roof-stringer
    poles over the entrance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bifid free extremity of the Ovia Pokina oaoa represents the jaws of a
    garfish called akumu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Koae Kupunu oaoa is called paia; no meaning was elicited at Siria, while
    at Mou the paia is the oaoa of Aitsi Kupunu and represents the tail of a fish
    called paia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Designs representing clan or local-group oaoa may be carved on side posts,
    ridge pole, longitudinal stringers, main longitudinals, floor rafters, and beneath
    the kaiva, either from the solid or on an attached board.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Airava marea at Abotaiara has side-post capitals carved as hornbill heads
    with exaggerated downward-curving beaks, with space cut through for roof-bearing
    poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men of Abotaiara wear hornbill mandibles on ceremonial occasions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the front central post of Airava marea, upper and lower mandibles of two
    hornbills are secured, a wooden bird figure with extended wings is hung near the
    roof, and nearby posts carry angular designs derived from hornbill mandible markings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In some other marea, airava dada carved on posts had become so degenerate
    as to be unrecognizable.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A board under the kaiva of Tautaa marea is carved with a lizard called ibaboro,
    a bird, and a chelonian; ibaboro is identified as the dada of the men of Herahera
    settlement.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A footnote compares a pipe-panel design with a lizard and birds to the board
    beneath the kaiva of Tautaa marea and suggests the possibility that the pipe design
    was copied from a clubhouse board.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In special aruaru marea used in initiation ceremonies, the badges of clans
    participating in the aruaru ceremonies were formerly represented on the marea.
  category: action
  evidence_refs:
  - ev:9
