  quote: ''
  summary: The passage describes marriage practices involving the bride's movement
    to the bridegroom's hamlet, return presents of food and ornaments, residence with
    the groom's family, garden-making and shared produce, sanctions around garden
    labor, Murua and Tokunu exchanges of marriage valuables, and examples of Tokunu
    marriage across named totem affiliations.
  language: English
