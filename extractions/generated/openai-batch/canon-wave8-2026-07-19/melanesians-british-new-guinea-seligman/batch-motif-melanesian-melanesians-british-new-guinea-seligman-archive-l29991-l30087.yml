  quote: ''
  summary: The passage describes Wagawaga and Tubetube rules for inheritance of garden
    land, houses or house-sites, women’s property, valuables, cooking pots, and crops
    after death, with emphasis on sisters’ children, siblings, maternal kin, widows,
    and practical custodianship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, most or all of a man’s garden land passes to his sisters’ children
    and is divided equally if they are married.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, if a dead man’s sisters’ children are young, some land may temporarily
    pass to his maternal uncle or mother before reverting to the sisters’ children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, a dead man’s house may be destroyed or left to rot; if not destroyed,
    or in the case of the house-site, it commonly passes to a brother, sister, or
    sister’s child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The choice among a brother, sister, or sister’s child for a Wagawaga house-site
    is described as governed by convenience rather than rigid precedence.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: A note reports that a house is deserted or allowed to rot after a corpse has
    been in it for some time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Wagawaga, a woman’s garden property, including coconut trees, is equally
    divided among her children, with elder married siblings holding property in trust
    for younger siblings until marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a dead Wagawaga woman’s children are not grown up, their maternal uncles
    and aunts look after the garden property and feed the children, using surplus
    food themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Wagawaga, armshells and other valuable jewellery connected with a woman
    may pass partly to her sisters and partly to her children, while jewellery given
    by a husband may revert to the husband’s kin or functionaries at his death.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Wagawaga, shell jewellery given by a husband to a wife may return to the
    widower if she dies before him, and he may later distribute some to his own and
    his sisters’ children.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: At Wagawaga, a woman’s cooking pots pass to her adult daughters, or to her
    sisters if the daughters are young.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Tubetube, a man’s landed property is equally divided among his sisters’
    children.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: At Tubetube, a widow is expected to give half of the first crop raised on
    her garden ground after her husband’s death to his brothers, sisters, and mother.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At Tubetube, a dead man’s house in his own hamlet may pass to brothers, sisters,
