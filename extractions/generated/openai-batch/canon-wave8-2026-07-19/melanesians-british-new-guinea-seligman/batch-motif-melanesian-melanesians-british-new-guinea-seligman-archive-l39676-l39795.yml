canonical_text:
  quote: ''
  summary: The passage describes mortuary and mourning practices in Kitava and Gawa,
    including removal and cleaning of bones, keeping or wearing parts of the dead,
    preparation of corpses, chiefly mourning signs and grave treatment, avoidance
    of mourning hamlets, return of bodies to their home hamlet, widow and child mourning
    dress, exhumation, seashore bone cleaning, and a feast connected with removal
    of remains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dead woman's bones are removed and cleaned by her husband and specified
    kin; her skull is finally kept in the widower's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widower's brothers and sisters' sons make spatulae from the dead woman's
    bones, keep them, and colour them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dead woman's lower jaw, cervical vertebrae, and phalanges are worn by
    her husband, mother-in-law, and husband's sisters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Kitava, many people wore signs of mourning after the recent death of the
    island's paramount chief, who belonged to the pigeon totem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Toabiu, the dead chief's sister's child, is named as successor and is described
    as influential, though not yet receiving the full consideration usually shown
    to paramount chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: It was stated that commoners approaching Toabiu would do so with the body
    bent forward and the hands held behind the back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The late paramount chief's grave was open because his skull, fibulae, and
    forearm bones had recently been removed for treatment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Around the late chief's and Toabiu's dwelling and yam houses stood a taboo
    sign made from horizontal coconut leaves with drooping pinules and coconuts impaled
    on upright sticks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The late chief's grave was an oblong open hole with a fitted frame, and large
    white cowrie shells were suspended at its head and foot.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The carved front of the dead chief's yam house had been slashed by Toabiu,
    reportedly because of grief for his uncle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Commoner graves are described as less elaborate; on Kwaiawata a rough fence
    around ornamental foliage plants was the outward burial sign.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: People from other hamlets avoided entering or nearing the hamlet where mourning
    was in full progress.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: At Gawa, a deceased man's eyes are closed by his brother or mother; the body
    is ornamented, given a new perineal bandage, and marked with black facial lines
    by specified kin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: If a death occurs in a strange hamlet, the corpse is wrapped in a mat, returned
    to the deceased's home hamlet, and buried usually in front of the house or yam
    house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The widow and children do not follow the corpse to the grave but wear mourning;
    the widow blackens herself and wears doba and magula, while children blacken themselves
    and wear cross-shoulder belts and armlets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: After burial, the grave is reopened, the skull and certain limb bones are
    removed and taken to the seashore for cleaning, and a sagali feast is provided
    by specified relatives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: When a woman dies away from her hamlet, her body is brought back; her corpse's
    face is painted by her children and sisters' children, and her husband blackens
    himself and wears mourning bands and armlets.
  category: sequence
  evidence_refs:
  - ev:7
