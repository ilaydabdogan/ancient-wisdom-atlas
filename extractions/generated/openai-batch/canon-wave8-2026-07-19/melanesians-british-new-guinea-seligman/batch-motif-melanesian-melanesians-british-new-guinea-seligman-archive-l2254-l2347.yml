canonical_text:
  quote: ''
  summary: The passage lists Aroma clan and dubu names, describes house and open dubu
    structures, and reports ceremonial uses of detached platforms at Babaka and Kerepunu.
    It includes a girls' initiation ceremony involving oil anointing, yams, areca
    nuts, and pigs; mentions skulls hung on certain platforms; describes a restored
    Aroma sacred platform with a fire before it; and states that Koita open dubu are
    associated with tabu festivals and spirits of the dead, while Hood Peninsula house
    dubu may have a similar association but the evidence is lacking.
  language: English
  quote_policy: summarized
