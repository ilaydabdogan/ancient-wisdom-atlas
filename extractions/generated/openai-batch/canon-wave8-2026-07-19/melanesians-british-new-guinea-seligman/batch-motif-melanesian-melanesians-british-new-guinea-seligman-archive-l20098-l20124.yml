canonical_text:
  quote: ''
  summary: 'A chief ritually ends a widower''s mourning restrictions: he addresses
    the widower''s abstention from bananas, swings bananas around his head, puts one
    in his mouth, gives him areca nut, removes mourning ornaments and gear, and replaces
    them with ordinary full dress and permitted male items such as a string bag, pearl-shell
    ornament, lime gourd, and uncovered hair.'
  language: English
