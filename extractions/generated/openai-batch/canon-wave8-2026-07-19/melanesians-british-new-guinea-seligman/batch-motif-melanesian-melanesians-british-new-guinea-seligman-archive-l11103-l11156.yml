canonical_text:
  quote: ''
  summary: 'The passage catalogues Koita and Motu omens, especially for hunting and
    fishing: fish entering or leaping beside a canoe, right and left side signs, sneezing
    counts, named birds, animal cries, and dead aquatic animals are read as good luck,
    bad luck, warnings, or death signs. It explains many omens as sent by spirits
    of dead tribesmen, notes that ancestors are not invoked by Koita and Motu hunters
    or fishers though a neighboring Sinaugolo custom does so, includes a note on Papalau
    abilities, and distinguishes bird alarm calls as a practical warning of strangers
    rather than a nonhuman agency.'
  language: English
  quote_policy: summarized
