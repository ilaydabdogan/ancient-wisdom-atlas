canonical_text:
  quote: ''
  summary: 'Ethnographic account of polygyny among the Northern Massim and related
    observations: chiefly families are theoretically privileged to have multiple wives;
    wealthy or feared commoners may sometimes do so; the first wife may consent to
    and mediate an additional marriage; co-wives receive equivalent parental presents;
    senior wives and older wives receive consideration; wives have separate decorated
    houses; widows of paramount chiefs may pass to successors or brothers, while commoner
    widows relocate to a husband’s relative until remarriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Northern Massim polygyny is described as theoretically restricted to paramount
    and village chiefs, their brothers, and their sisters’ children, defined as men
    in the direct line of chieftainship descent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the Trobriands, wealthy commoners, especially those reputed to be sorcerers,
    are reported to take more than one wife without being challenged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A chief already married would not sleep with unmarried village girls or marry
    one unless his first wife assented.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first wife usually discusses the matter with her own parents and acts
    as intermediary between her husband and the desired girl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The desired girl’s parents are approached first, and the girl is said to have
    at least a theoretical right to refuse the match.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Presents sent to the parents of first and later wives are described as being
    of the same value, and the first wife’s status is said not to appear different
    from that of the others, with an observational caveat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Senior wives are said to direct and exert influence over younger wives.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each wife has her own house, which is regarded as belonging to her husband
    and is carved and decorated like chiefs’ houses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Enamakala’s wives’ houses are described as standing a few yards apart in a
    crescent, with one house for each wife.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each of Enamakala’s wives’ houses contained a sleeping platform, a fireplace,
    and cooking utensils, and the mistress of each house was usually seated at the
    door.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Older and apparently worn-out wives are reported to be treated with greater
    consideration than younger wives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Enamakala and Toura are described as dividing sticks of tobacco among their
    wives with scrupulous evenness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The widows of a paramount chief pass partly to his successor and partly to
    his other brothers; Paolu took over eight of Enamakala’s widows.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A commoner does not take his dead brother’s wife; the widow leaves her late
    husband’s house for the house of one of his relatives, usually his brother, until
    she marries again.
  category: sequence
  evidence_refs:
  - ev:9
