canonical_text:
  quote: ''
  summary: The passage describes forms of practical magic and specialist expertise,
    especially the procedure of a wallaby-hunting expert. It details inherited expertise,
    gift compensation, hunt preparation with nets, coconut, fire, cinders, roots,
    taboos, washing, ancestor invocations, songs, ritual objects, imitation of wallaby
    behavior, and a Mou village note about a spear and areca nuts left for Oa Rove.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists specialists for hunting, fishing, planting, coconuts, bananas,
    rain, and formerly war.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The art and practice of these departments of knowledge is usually passed from
    father to son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Experts are described as not asking for presents or demanding payment, though
    presents are made to them by those who benefit from their efforts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before a big hunt, the wallaby expert is consulted, fixes the date, and villagers
    bring nets to pile before his house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A coconut is placed on the piled nets and broken by the expert with a wooden
    club; cinders from a fire are carried to the place where the hunt is expected
    to begin, and scattered if the hunt is postponed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For about a week, the expert daily visits the place where the hunt will begin
    and burns roots said to attract game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The expert is forbidden cohabitation and specified foods, including food cooked
    by women, yams, wallaby, and pig; he may eat kangaroo-rat and drink milk of roasted
    unripe coconuts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The day before the hunt, the expert washes in sea water or, inland, fresh
    water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night, fires are lit near the future drive area, hunters meet there, thrust
    spears into the ground, and bring nets for the hunting net wall.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The expert stands somewhat in front of the hunters with his spear in the ground,
    and none of the hunters may pass beyond him in the direction of the drive.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The expert recites spells appealing to male ancestors for up to seven generations
    to prosper the hunting, while hunters sing hunting songs called ori.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: During the ceremony, the expert chews areca nut, holds a leafy dracaena axis
    called topi, spits on it after invocations, puts on a long-tailed perineal band,
    and strikes each net with the topi branch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The expert imitates a wallaby by hopping on all fours between two rows of
    hunters; the first men pretend unsuccessfully to catch him, and he is caught and
    immediately released at the far end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The expert leads the hunters toward the starting place, imitates the gait
    and cries of wallaby, and is said to call wallaby together and direct them toward
    the nets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: On return to the beaters, the expert announces that all is ready and that
    many wallaby will be caught because the ancestors will help.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: In a Mou village account, the expert's spear is left where it was thrust into
    the ground, with areca nuts left near it for Oa Rove.
  category: action
  evidence_refs:
  - ev:9
