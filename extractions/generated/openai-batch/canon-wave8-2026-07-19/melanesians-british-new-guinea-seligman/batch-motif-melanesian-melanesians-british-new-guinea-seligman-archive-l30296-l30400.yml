  quote: ''
  summary: The passage describes currency and trade goods among northern and southern
    Massim communities, including shell-disc belts, waga canoes, boar's tusk ornaments
    and shell imitations, armshells, shell-money, and other export goods. It outlines
    Trobriand manufacture and canoe-based trading expeditions through the D'Entrecasteaux,
    Dobu, Tubetube, Murua, and Louisiade regions, distinguishing ordinary trading
    trips from exchanges of circulating native wealth.
  language: English
  quote_policy: summarized
