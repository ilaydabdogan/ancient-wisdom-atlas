canonical_text:
  quote: ''
  summary: 'The passage describes rules and practices concerning Trobriand paramount
    chiefs and village head men: bodily deference to chiefs, chiefly authority over
    labor and first-fruits, collective construction and feasting, garden and rain
    magic, and the more limited influence of village head men in labor, disputes,
    and theft cases.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: No special food, address, or salutation distinguishes a paramount chief from
    other clan members, but commoners must not be physically higher than a chief and
    squat or bend when he appears or is passed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A high platform was built for Pulitari so that people would not need to bend
    so much when he sat on a low platform.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A paramount chief is described as, at least theoretically, the supreme head
    of people in his territory; some named chiefs before government authority are
    described as absolute autocrats.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paramount chiefs could be carried when tired, require heavy garden and house
    work from people of any clan, send young men to fish, and receive first-fruits
    of yam gardens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief fed people who worked for him, while some domestic tasks such as
    making gardens by his wife or wives and fetching food and water were handled by
    his own family.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When a paramount chief required a new house or yam house, villages came with
    their toriwaga after materials had been prepared, built it, and were feasted with
    pork and vegetable food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During these chiefly building feasts, the guyau and his toriwaga ate apart
    from commoners, but the commoners received the same quality of food.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Garden-productivity magic, called megua, is performed by both chiefs and commoners,
    and a megua tau can perform it for anyone able to pay.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The garden magician chews certain herbs and spits them about the garden, while
    others are warned to keep away during the charming.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chiefs were expected in famine to bring rain by magical means, but during
    a recent drought chiefs were unsuccessful and some non-aristocrats were said to
    have been more successful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A toriwaga was said to have considerable influence in his village, but he
    consulted elders in weighty matters and his word did not appear to be law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A village head man could call on villagers of all clans to help build his
    house; he fed helpers with vegetable food and did not provide pork.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Feuds arising over women were not referred first to the toriwaga; an injured
    husband would gather friends for vengeance, while the toriwaga tried to limit
    bloodshed and promote settlement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Repeated garden thefts could be reported to the toriwaga, who cautioned local
    offenders or asked the offender’s own toriwaga to reprove and warn him.
  category: sequence
  evidence_refs:
  - ev:8
