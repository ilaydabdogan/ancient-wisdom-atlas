canonical_text:
  quote: Twins excite no surprise or disgust, and are well treated.
  summary: 'The passage states that twins are accepted and treated well, and that
    twin-bearing is understood as hereditary with possible gaps between generations.
    It then describes Koita land tenure: sections and iduhu hold and allocate garden
    land, inheritance passes to children, land is not sold, permission and crop-share
    arrangements allow gardening on another person''s land, boundary violations require
    remedy, general crossing of uncultivated land is permitted in peaceful relations,
    and hunting or grass-burning by outsiders may cause conflict though groups may
    join for large hunts.'
  language: English
  quote_policy: quoted
