canonical_text:
  quote: ''
  summary: The passage reports that Koita and Motu have no food taboos binding only
    one village, iduhu, or family. It lists fish forbidden to young people and adolescents
    because they are said to make the skin harsh and cause dislike by the opposite
    sex. It also describes restrictions on wallaby intestines and liver, and gendered
    rules concerning two spiny poisonous fish, beke and gani, which boys may eat but
    girls must avoid because of a penalty affecting tattoos. Pregnancy and puerperium
    food taboos are noted as treated elsewhere.
  language: English
  quote_policy: summarized
