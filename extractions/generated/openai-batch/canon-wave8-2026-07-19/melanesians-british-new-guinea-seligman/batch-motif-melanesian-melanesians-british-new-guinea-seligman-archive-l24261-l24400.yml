canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which an old woman kills boys
    born from falling nuts until a fifth boy avoids her instructions, kills her with
    her pearl-shell knife, causes her husband to eat her head, and then kills him
    with a coconut. It then gives the tale of Gamey Leg and Sleepy Leg, where a mocked
    lame man escapes Hill people while the mocker is caught and eaten. It begins another
    tale in which Waima the ant and Kukuku the bird hunt pigs together; Waima blinds
    and spears a pig, Kukuku loses the entrails to a fish-hawk while washing them
    in the sea, and the next hunt reverses their roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman tells a boy to pick two nuts and climb down head first, then
    cuts off his head with a sharp pearl-shell, boils it in a pot, and eats it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman's husband returns, sees fish, asks where she obtained it, and
    she answers that he would get the same fish if he fished where she did.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second, third, and fourth nuts also fall and become boys, and each is
    killed by the old woman in the same way as the first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the fifth nut falls and becomes a boy, he speaks affectionately to the
    tree, says farewell, spears fish, reaches the old woman's village, and asks about
    his four brothers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The old woman tells the fifth boy to pick two coconuts and climb down head
    first, but he picks every nut on the tree and descends feet first.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fifth boy takes the pearl-shell from the old woman, cuts off her head,
    hides her body, cooks the head in a pot, and waits in an areca palm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old woman's husband eats the stew, later finds her body, hears the boy
    reveal what he has eaten, and pursues the boy by cutting down palms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy escapes by jumping from palm to palm and finally kills the man by
    throwing down a coconut that strikes his head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Gamey Leg and Sleepy Leg tale, a man with a game leg is mocked by his
    sound-legged companion about whether he could run from Hill people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Hill people appear, the sound-legged man's leg has gone to sleep; Gamey
    Leg hobbles away, while Sleepy Leg is caught, cut up, and eaten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Waima the ant and Kukuku the bird are described as great friends who make
    a pig-net and go hunting together.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the first hunt, Waima watches by the net while Kukuku beats for pigs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Waima stings a pig in both eyes, spears it when it cannot see, hides it, first
