canonical_text:
  quote: ''
  summary: The passage describes inherited magical specialization, snake propitiation
    and snake-sorcerer beliefs, varying avoidance of paternal totems, clan exogamy
    and sexual shame, the lack of totemic restraint in warfare, bird and human-headed
    bird house carvings, and linked totem-clan names in the Marshall Bennet Group
    and Trobriands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain chiefs and commoners have inherited reputations as medicine men because
    they are said to have been initiated into a secret by predecessors such as fathers,
    mothers, or uncles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: No man is said to limit his magic to property belonging only to his own family
    or clan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Snakes are prominent in the district's art, and the author says there is reason
    to suppose they may once have been totem animals on the Trobriands, although special
    attention to snakes is not usual.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Kavatari, a snake that entered a house was offered peace offerings, but
    the author treats the incident as more likely connected with sorcery than with
    totemism.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bellamy reports that some snakes are thought to be sorcerers in disguise;
    a snake on the track that does not flee is treated as a man and must not be killed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Respect for a father's totems is described as having greatly decayed, with
    varying avoidance of a father's fish, bird, and plant totems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Motuparara of Osiwasiu avoids eating his father's bird and fish totems, avoids
    cutting his father's plant totem, and takes some care not to burn that plant's
    wood in house fires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bokaiakau says that if he ate his father's totem fish and then used his father's
    lime-pot or water bowl, his father would be poisoned, swell in the belly, and
    die.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Avoidance of marriage within the clan is said to persist but weaken; one same-totem
    marriage is mocked as a man marrying his sister, and same-totem sexual connection
    is secret and shameful.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Totemic affiliation is said to have had no recent influence on actual fighting;
    a Malasi could attack another Malasi without thought of brotherhood, and no distinctive
    war-dress was used to protect clansmen.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Rough bird carvings occur on some Trobriand houses; some represent totem birds,
    some non-totem birds, and some birds have human heads.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Marshall Bennet Group is described as having the usual linked totem system,
    and some linked totem clans share names with those on the Trobriands, including
    Malasi.
  category: relationship
  evidence_refs:
  - ev:10
