canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of Roro-speaking beliefs about
    spiritual beings. It notes possible mission influence, describes Oa Rove Maral
    as a powerful spiritual being, describes paipai as malevolent sickness-causing
    beings connected with springs, snakes, human forms, and shape-changing ancestry,
    and explains that beriwa can mean spirits of the dead, nonhuman malicious agencies,
    or a bull-roarer. It also notes Boubou as an agency closely connected with the
    dead.
