canonical_text:
  quote: ''
  summary: The passage describes Massim/Tubetube mourning feasts after burial. A first
    kanekapu feast distributes garden food and pig flesh to people of another hamlet
    of the dead man's totem, with restrictions on who may eat it and a smaller return
    gift. Coconuts are hung on the grave railing and left untouched. A later rigariga
    feast allows the widow to end mourning; older and modified forms include removal
    of mourning gear, food taboos, body blackening, and yam trophies placed near the
    grave or widow's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: About ten days to three weeks after burial, the first feast called kanekapu
    is given by the people of the dead man's hamlet to people of one other hamlet
    of the dead man's totem.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only those of the dead man's totem may eat food given to the gariauuna; food
    taken home by a gariauuna should not be touched by his wife and children, except
    possibly a very young child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kanekapu food consists of garden produce and uncooked joints of pig flesh,
    and recipients make a smaller return present of vegetables to the dead man's hamlet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the kanekapu, one of the gariauuna hangs coconuts on the posts of the
    grave railing; the stated purpose is to indicate the grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: No man or woman may eat or touch the coconuts placed at the grave; they are
    left to rot until the fence decays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A later feast called rigariga is held some months after a death and is the
    occasion for a widow to quit mourning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the rigariga, food from the dead man's gardens is brought, pigs are killed,
    and portions of pork and vegetables are sent to a hamlet of the dead man's totem
    and to the dead man's hamlet for the gariauuna.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A brother of the dead man brings the widow to her dead husband's hamlet, where
    she is stripped of mourning gear; formerly this took place beside the grave, but
    a cemetery policy changed the location.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a described Tubetube case, yams, pork, fish, taro, and sago were taboo
    while mourning tokens were worn and the body blackened.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yam trophies were formerly built around the grave, but in the described case
    they were made in the village and around the widow's house at the old chief's
    direction.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note says that placing coconuts around the grave occurs over a large part
    of the Massim area and mentions possible connection with burden-carrying taboos
    near graves and at Dobu.
  category: other
  evidence_refs:
  - ev:7
