canonical_text:
  quote: ''
  summary: The passage discusses self-expression among Motu, Koita, Massim, and related
    Papuo-Melanesian groups through dance decoration, decorative art, tattooing, and
    boastful speech. It notes the use of face paint and feathers in dancing, references
    the tahaka figure of the Koita maginogo dance, describes naturalistic and geometrical
    tendencies in regional art, identifies representational absences, and discusses
    boasting at feasts and in exchanges with outsiders.
  language: English
