canonical_text:
  quote: ''
  summary: The passage describes Biofa and Vee clan-section clubhouses called ufu,
    their naming rules, earlier ngopu-group naming uniformity, and later name changes.
    It gives examples of clubhouse names used to commemorate events or express conditions,
    including Laila, Angopu, and Aungama, and lists natural-world names such as a
    black snake, a tree, mountain peaks, wind, birds, and ripples. It also notes comparisons
    with Roro niarea, Waima experts, and a Mount Yule practice of naming settlements
    to record events.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each local group of a clan is said to possess, or formerly to have possessed,
    at least one clubhouse called ufu by both the Biofa and Vee; these are compared
    in function with Roro niarea and described as generally smaller and less elaborately
    built.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: War experts or chiefs may have their own ufu, but the passage states that
    these should bear the same name as the ufu of the fda chief, so that each pangua
    adheres to a single name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that formerly the ufu names belonging to pangua of a single
    ngopu group were identical, and that later name changes were attributed to a wish
    to commemorate historical events.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Father Egidi is reported as concluding, after many inquiries, that the ngopu
    groups had original ufu names including Maipa, Apiongai, Popungapi, and Oafua.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:5
  text: The Oala Aivea section of the Oala Aivea pangua of Aipiana village has a present
    ufu called Laila, said to be in memory of a Jokea clubhouse of the same name where
    Oala Aivea visitors were entertained.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:6
  text: The ufu of Afanga pangua of Ififu village is called Angopu, glossed as 'a
    village fallen into decay,' and the name is said to have been given because of
    the weakness of its builders' pangua.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:7
  text: The ufu of the Waiaka pangua at Inawi and Oriropetana, formerly Maipa, was
    changed to Aungama, the black snake Pseudechis, as a public advertisement that
    the clans had begun serious medicine against sorcerers of other villages.
  category: action
  evidence_refs:
  - ev:10
- id: obs:8
  text: For some secondarily acquired ufu names, the passage says the meaning is unknown,
    or the bare meaning is known but the reason for adoption is not; Funguka is identified
    as a durable tree used for ufu piles, but the reason for its use as a name was
    not determined.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:9
  text: Among the Vee, the passage says ufu-name changes occurred more extensively
    than among the Biofa, and gives examples of names that are also mountain peaks,
    the North-west wind, and the hornbill.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:10
  text: The passage states that sometimes the ufu name is identical with the iauafangai
    or kangakanga, and gives table examples such as Funguka, Lainapa, Aikimo, and
    Ongeonge.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:11
  text: A note identifies Maipa as the name of a bird described as a kind of shag,
    and Oafua as meaning rippling or ripples on still water caused by throwing in
    a stone, while cautioning that this may not be the original meaning of the ufu
    name.
  category: attribute
  evidence_refs:
  - ev:6
