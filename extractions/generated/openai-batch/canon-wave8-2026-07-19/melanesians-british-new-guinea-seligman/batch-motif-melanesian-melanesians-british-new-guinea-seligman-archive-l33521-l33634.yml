canonical_text:
  quote: ''
  summary: 'The passage describes later stages of the walaga feast: a preserved mango
    tree is brought from the fasting men''s sleeping house, processed to the temporary
    village, handled by ritual participants, associated with green mango fragments
    spat toward the setting sun, partly burned with old mats and refuse, and then
    kept in the taniwaga''s house for periodic exhibition and gradual burning. Informants
    differ on why the mango is brought out and on the fate of its ashes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an interval, the preserved mango is brought out from the sleeping house
    of the fasting men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Reported explanations for bringing out the mango vary: some informants did
    not know, some connected it with the house rotting, and others said the mango
    spoke to the taniwaga in dreams asking to smell smoking pigs'' fat so pigs and
    crops would prosper.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fasting men prepare a new house nearby, people within about ten miles
    are notified, and visitors begin to arrive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The taniwaga and fasting men, wearing dancing costumes, remove cups, lime
    spoons, pots, bags of refuse, mats with mango leaves and chips, and the wrapped
    mango tree from the former house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men present rush up to wipe dust from the removed objects and smear the dust
    on their bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mango is carried in procession to the centre of the temporary village
    in the same way it had earlier been brought from the jungle when cut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The procession is met near the houses by the pigula, who brandishes a spear;
    the procession stops and puts the mango down without letting it touch the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gugula cuts young green mangoes and places pieces in the mouths or hands
    of the fasting men, who chew the fragments and spit them toward the setting sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: One reported explanation for spitting the mango fragments is that the sun
    should carry the bits over the country so everyone would know.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The taniwaga breaks off part of the mango tree, sets it with old mats, leaves,
    food, and refuse, and the remaining mango is wrapped in new mats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After sundown, the broken-off portion and old mats and refuse are burned in
    an ordinary fire over which no spells are said.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ashes are gathered by the people, and the freshly wrapped remains of the
    mango tree are taken to the taniwaga's house and hung over the fireplace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At later exhibitions, further pieces of the mango are broken off and burned;
    the mango may remain until a new walaga is arranged or until it is finished and
    a new one can be cut.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:14
  text: 'The fate of the ashes is explicitly uncertain: one group said they are mixed
    with pigs'' food, others denied this, and the author says only that they seem
    to be taken to the taniwaga''s house and kept, perhaps indefinitely.'
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: The arrangement for who will give the next walaga is made when the mango is
    cut down.
  category: relationship
  evidence_refs:
  - ev:9
