canonical_text:
  quote: ''
  summary: The passage describes courtship and betrothal practices. In Wagawaga and
    Tubetube, an extended period of a girl receiving the same boy may lead to the
    girl proposing marriage, followed by notification of parents and dependence on
    parental consent. It then describes viagagavu in Bartle Bay-area settlements as
    a premarital or potentially premarital practice in which eligible boys and girls
    sleep together, usually without intercourse, sometimes in a bush shelter or house;
    a Gelaria account gives details of invitation, meeting place, limited caressing,
    separation before dawn, and verbal or tacit acceptance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A period of one to three months in which a girl repeatedly receives the same
    boy may precede marriage; if she still cares for him and considers him suitable,
    she may propose marriage.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For Wagawaga and Tubetube, the passage states that the youth would not ordinarily
    take the initiative in proposing marriage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that intimacy generally did not continue for two or three
    months unless one or both partners were willing for marriage to result; for Milne
    Bay it was said not to continue unless the boy assented to the girl's proposal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When two people wish to marry, each notifies parents; if either set of parents
    refuses consent, marriage does not take place, and the passage reports no known
    cases of elopement or marriage without parental consent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Wagawaga, if the girl's parents refused, she would tell the boy when he
    next visited her in the potunia; he would spend that night with her but would
    not return the next night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the boy's parents remained opposed, the girl was told marriage could not
    take place, though the passage says cohabitation was probably not immediately
    broken off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A custom called viagagavu is reported for Wamira, Wedau, Gelaria, and some
    coastal settlements east of Bartle Bay, though the authors say their information
    is incomplete.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: In viagagavu, a boy and girl pass the night together sleeping in each other's
    arms, either in a rough bush shelter or in the house of the girl's parents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only people from intermarrying clans and people not barred by social restrictions
    from marrying each other come together in viagagavu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says intercourse often does not occur in viagagavu; if it does
    occur, marriage is usual, while without it marriage may or may not follow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Viagagavu may occur as a jest or fun, may be repeated many times by a boy
    or girl, and is not necessarily a preliminary to marriage with the first partner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A widow or widower about to marry would practice viagagavu with the future
    spouse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Gelaria, a boy seeks a private chance to speak to a girl he fancies and
    invites her to sleep together; if she does not strongly dislike him she assents,
    and he names an empty garden house or bush shelter as the meeting place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Gelaria account, the couple meet in usual dress, the boy may caress
    and put his arms around the upper body, and the two separate before dawn; informants
    said intercourse rarely occurs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the Gelaria account, the boy does not raise marriage directly; the girl
    may verbally indicate preference for him or may say nothing, either of which can
    be treated as acceptance unless she explicitly rejects him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: After Gelaria bush-sleeping, the boy tells his parents and the girl tells
    her mother that they have slept with the named partner.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: 'A footnote describes a household sleeping arrangement in families with marriageable
    girls: parents near the front fireplace, girls near the back fireplace, and brothers
    usually in houses of paternal uncles.'
  category: setting
  evidence_refs:
  - ev:11
