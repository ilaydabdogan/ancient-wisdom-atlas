canonical_text:
  quote: ''
  summary: The passage records Wagawaga and Tubetube dancing songs, their partial
    translations, performer and collection context, stated or unknown meanings, and
    notes on song origins from Wagawaga, bush communities, Rogea, Kwararo, and other
    named places. Several songs concern canoe travel, wind, tide, stars, places, people,
    fence-cutting, war-party departure and return, and canoe singing.
  language: English with transcribed local song texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collector reports that Wagawaga singers were more willing to provide song
    words and phonographic records after being taken to the schooner, and that the
    songs listed are sung while dancing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pediri song was stated to concern a man who went to Tubetube and, while
    returning from Dagedagera, encountered a storm requiring constant bailing; the
    canoe is named Porububuni and the lyric includes hard wind and a screeching frigate
    bird.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first Nuauuro song explanation describes high water running out steadily
    until low water is reached.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second part of Nuauuro mentions a star approaching, someone coming down,
    and the morning star coming; the passage says the meaning was unknown and notes
    that bagi is a valued shell ornament while Dumodumoia was said to be a village-system
    or island name.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ogoogo includes a man with long locks and phrases about their land, our land,
    flat land, and the land of Dumodumoia; the meaning of the song is reported as
    unknown.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Damorea contains words that informants described as not proper talk or as
    conveying no meaning, with possible glosses of Sapidobu as earring and budibudi
    as mist.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Four songs are identified as true Wagawaga songs, while three following songs
    are said to have been learned from bush natives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bush-associated songs include words about the people of De talking or
    grumbling, news from Kabiai going eastward, and a fence being cut down and collected;
    the passage reports uncertainty or denial of literal meaning for some of these
    songs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Tubetube, rausi, pediri, and waia are named as favorite dancing songs;
    rausi is especially danced during soi festivities, and pediri and waia are said
    to have been introduced from Rogea.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Besa is named as the dance and song performed on the return of canoes from
    a successful war party, while Losuma is the dance before the start of a war party,
    performed to drums without singing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gumgum is said to have come from Kwararo and is sung without drum or dance,
    commonly in canoes while paddling or sailing.
  category: action
  evidence_refs:
  - ev:9
