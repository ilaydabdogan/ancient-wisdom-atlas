canonical_text:
  quote: ''
  summary: 'The passage describes childhood restrictions and social practices: young
    children are barred from eating turtle and certain fish; totem knowledge is taught
    around age seven or eight by the mother; boys assume a perineal bandage and girls
    petticoats without ceremony; a footnote discusses ear and nose perforation, including
    an anecdote about a boy who had his ears perforated to avoid being mocked as a
    wild pig rather than compared with a domestic pig marked by split ears.'
  language: English
  quote_policy: summarized
