canonical_text:
  quote: ''
  summary: 'The passage describes stages of the Walaga feast: chiefs address spirits
    and the crowd at moonrise; dancing and chanting continue around the mango pole;
    pigs are selected and killed so their cries are heard by the mango tree or mangoes
    for fruitfulness; pork and vegetable portions are distributed from the walaga
    platform; the mango is later wrapped, carried away, and hung; participants remain
    under fasting taboos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At sundown and moonrise, two chiefs stand on adjacent gable ends on the eastern
    side of the square and address evil spirits and the assembled crowd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs charge evil spirits to keep away and do no harm, and bid the people
    keep peace and not disturb the proceedings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dancing resumes and continues through the night, with a choir gathered around
    the mango pole chanting and possibly beating drums.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At daylight pigs are killed by slow spearing so that they squeal for some
    time before dying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pigs' cries are said to be heard by the mango tree or mangoes, and the
    passage states that this is needed for fruitfulness.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:6
  text: The pigs are first viewed and passed as worthy; some are not passed and are
    spared for another feast.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The taniwaga sits on the walaga platform and directs fasting men in making
    portions and calling names as portions are thrown on the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A chief of the feast climbs the mango pole and chants what sounded to the
    observer like a prayer, while other official participants respond.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Portions of pig, and sometimes vegetable food, are distributed to named clan
    or family heads, then taken away by the eaters.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The end of food distribution is described as the end of the ceremony, after
    which guests disperse.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next day the mango is taken down, wrapped in new sleeping mats, carried
    by fasting men to their sleeping house, and hung from the roof.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: People connected with the feast continue fasting from specified foods and
    water, and breaking the fast is said to risk sores.
  category: attribute
  evidence_refs:
  - ev:10
