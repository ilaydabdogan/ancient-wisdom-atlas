canonical_text:
  quote: ''
  summary: 'The passage describes Koita/Motu-area marriage ceremonies: ritual abuse
    and mock plundering after marriage; gifts of animals to pacify affinal relatives;
    ornamenting the bride; delayed cohabitation and post-marital conduct; a later
    procession and exchange of pigs, feather ornaments, shell jewellery, fish, and
    bananas; temporary restrictions on the bride visiting or eating from her father''s
    village; elopement settlements; clan exogamy; and natal kin concern for a married
    woman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride's father stands outside the bridegroom's father's house, abuses
    him, and is pacified by a dog that is given and killed for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mock pillage of the bridegroom's local group takes minor goods and ripe
    fruit, avoids valuable property and permanent crop damage, and is limited to near
    relatives of the bridegroom.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The bridegroom's relatives paint the bride and adorn her with shell ornaments;
    the young couple are brought together but initially ignore one another.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An understanding between the young couple is usually established on the following
    day; one reported sign is the bride handing betel and lime to her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the fourth day the bride's mother visits, weeps and groans until a pig
    is brought and killed for her, after which she praises the generosity of the son-in-law
    and his family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cohabitation is stated not to begin for a few weeks, with the boy sleeping
    in the Tnarea and the wife in her father-in-law's house, although intercourse
    is said usually to occur in or near gardens soon after marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Formerly, a woman was reportedly not expected to have children until her garden
    was bearing well, roughly one to two years after marriage; the narrator states
    uncertainty about adherence and enforcement.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the first few weeks after marriage, the bride decorates herself each afternoon
    and visits and gossips with friends, as she had done when her face was tattooed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A second part of the marriage ceremonies occurs three to eight weeks later;
    the narrator is uncertain whether it corresponds to official consummation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: For the later ceremony, the bride's kin prepare fish and bananas, while the
    bridegroom's local group brings pigs, feather headdresses, and shell jewellery
    in a procession led by the ornamented bride.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pigs, feathers, and shell ornaments are given to the bride's father, who gives
    fish and bananas to the bridegroom's people; the food is taken back and eaten
    by those who helped provide the bride-price.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Until the later ceremony occurs, the bride may not visit her father's village
    or eat food brought from it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The bridegroom's people leave pigs at the bride's father's house; the pigs
    are killed and eaten next day by the men of the bride's local group, with a special
    location specified if the bride is a chief's daughter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the feast, gifts brought by the bridegroom are distributed among the
    bride's near relatives; a few days later the couple visit the bride's village
    and receive presents.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The elaborate ceremony is said to apply when betrothal by parents and regular
    dowry payment have occurred; elopements are also common.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: In elopements, the young couple go to the bush for a couple of days; afterward
    the bridegroom leaves the bride with his clan and seeks peace with her relatives,
    often beginning with a pig gift and then arranging a price acceptable to both
    groups.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Clan exogamy is strictly required, though a widow is said to be allowed to
    remarry into her first husband's clan.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: A married woman's relatives and kin continue to take interest in her and may
    resent injury to her or attempt a vendetta against her husband if he is considered
    responsible for her death.
  category: relationship
  evidence_refs:
  - ev:11
