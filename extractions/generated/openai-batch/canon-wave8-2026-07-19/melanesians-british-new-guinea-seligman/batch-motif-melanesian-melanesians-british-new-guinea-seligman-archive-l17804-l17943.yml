canonical_text:
  quote: ''
  summary: The passage describes Mekeo pangua kangakanga as clan badges with recognized
    exclusive use, occasional sale or exchange of wearing rights, and examples of
    dance ornaments and headdresses that incorporate or imitate animals, plants, or
    mountain outlines. It also notes that kangakanga were not worn in war, when men
    used cassowary plumes and black paint instead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each clan's exclusive right to use its kangakanga as a badge is described
    as generally recognized and usually guarded.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that kangakanga wearing rights could be sold or exchanged
    between pangua.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: At Veifa, people without the swordfish-sword kangakanga were expected to give
    swordfish swords they caught to the men of Ongofoina pangua.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An example is given in which Inaukina pangua sold Ongofoina pangua the right
    to wear the feather kangakanga called fole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another example describes Oala Aivea and Alo Aivea pangua extending the right
    to wear the kefe turtle-shell ornament in exchange for the right to wear the mengunge
    feather headdress, said to represent Mount Boboleva.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Many kangakanga are elaborate headdresses incorporating parts of a specific
    animal or plant, or imitating a characteristic feature of an animal or plant.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a kangakanga represents a mountain or peak, feathers are arranged to
    reproduce a characteristic outline of the mountain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Examples include a kapoc-tree imitation, a double-headed palm outline, bleached
    pingu palm-leaf strips worn at wrists and knees, a swordfish sword worn in the
    hair, and feather forms representing bird crests or feathers.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:9
  text: Kangakanga were not worn in war; in war men of all pangua wore cassowary plumes
    and black paint, and combatants did not try to avoid men of their own iauafangai
    or kangakanga.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says dancer face-painting generally did not refer to iauafangai
    or kangakanga, while reporting one unverified statement about clan variation in
    face-painting at Inaukina.
  category: attribute
  evidence_refs:
  - ev:9
