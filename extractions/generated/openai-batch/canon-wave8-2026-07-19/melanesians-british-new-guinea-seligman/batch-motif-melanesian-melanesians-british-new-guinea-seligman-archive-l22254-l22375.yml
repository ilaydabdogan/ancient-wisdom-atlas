canonical_text:
  quote: ''
  summary: A Wagawaga narrative tells of a woman whose thigh swells after repeated
    contact with a wadumo fish; after her father cuts the thigh, a boy, Dudugera,
    is born. After conflict with village children, Dudugera is given to his fish father,
    warns his kin to shelter under the rock Duyau, ascends by pandanus into the sky,
    and brings deadly heat until his mother sprinkles lime across the sun. A second
    Wagawaga narrative begins by describing an old woman, Goga, who secretly possesses
    fire from her body; after boys discover the cooked food it produces, the youngest
    steals a brand, drops it, and vegetation catches fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman gardens above the beach, sees a large wadumo fish in the surf, enters
    the sea, and repeatedly has the fish rub against her legs and nuzzle her thighs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's thigh swells painfully; her father scarifies it with an obsidian
    fragment, and a boy child bursts from one incision. The woman washes him, cuts
    the cord, lies by the fire, and nurses him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child, Dudugera, plays with village children but throws toy spears at
    his companions rather than at trees or bushes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The other children abuse Dudugera by saying that his father is a fish and
    that he should go back to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dudugera's mother, fearing consequences for his misconduct, consults her mother
    and decides to give him to his father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the beach, the great fish takes Dudugera in his mouth and carries him to
    a far-away country in the east.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before leaving, Dudugera instructs his mother to tell her relations to uproot
    sugar cane, taro, and bananas, to make gardens under the overhang of the great
    rock Duyau, and to live in its shelter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dudugera says he will climb into a pandanus and then into the sky; trees,
    plants, and people in all villages will die, but his friends will be saved if
    they obey him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The prophecy is followed by water drying up, trees withering, gardens ceasing
    to bear, and pigs, dogs, and finally people dying from great heat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dudugera's mother climbs a hill with a lime pot and sprinkles lime from a
    gourd across the face of the rising sun, making the sun shut his eyes; the heat
    lessens, rain falls, clouds appear, and the sun rises behind clouds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the fire narrative, before men have fire, an old woman called Goga dries
    food for ten youths but cooks her own food with fire taken from her body and hides
    the remains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A piece of boiled taro lets the youths discover that cooked food is softer
    and better than dried food; the youngest boy hides and sees the old woman take
    fire from between her legs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boys decide to steal fire, cut down a huge tree, and choose the youngest
    boy because only he can jump over it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The youngest boy snatches a brand from the old woman, jumps over the felled
    tree where she cannot follow, drops the burning brand when it burns his hand,
    and sets the grass and then a pandanus on fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note states that wadumo is a totem through much of the south-eastern district,
    though not of the Wagawaga clans, and that at Tubetube it is called warumo and
    linked with the fish-hawk as bird totem.
  category: relationship
  evidence_refs:
  - ev:9
