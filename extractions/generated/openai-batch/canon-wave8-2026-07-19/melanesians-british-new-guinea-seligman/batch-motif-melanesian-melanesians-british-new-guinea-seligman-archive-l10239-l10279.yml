canonical_text:
  quote: ''
  summary: 'The passage describes a popular body of magic, distinct from more esoteric
    sorcery, practiced in relation to daily needs by adults. It characterizes much
    of this magic as sympathetic: natural objects are treated as containing a virtue
    that can be communicated by contact. A yam charm is said to affect seed yams and
    produce a good crop, though the resulting yams cannot transmit the quality further.
    The passage also describes the acquisition and high value of charms, including
    tree bark from the Papuan Gulf used as hunting charms by Koita people, and notes
    ethnographic collections of local charms around Port Moresby and the Central District.'
  language: English
