canonical_text:
  quote: ''
  summary: The passage describes Koita warfare, especially conflicts involving Arauwa,
    Rokurokuna/Lokurukuna, Kabadi, Doura, Manumanu, and Lealea. It outlines a common
    method of night encirclement and dawn attack, with killing, looting, and burning,
    and quotes Chalmers on cycles of revenge, attempts or possibilities of peace through
    exchange, alliances made with pigs, and attacks by canoe and river routes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Western Koita sections, especially Arauwa and Rokurokuna, are described as
    formerly engaged in almost continual warfare with Kabadi.
  category: relationship
  evidence_refs:
  - ev:1
