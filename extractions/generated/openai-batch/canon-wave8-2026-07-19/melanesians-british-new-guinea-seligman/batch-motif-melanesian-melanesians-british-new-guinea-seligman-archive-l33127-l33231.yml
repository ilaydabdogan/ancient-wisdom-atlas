canonical_text:
  quote: ''
  summary: 'Ethnographic passage on the Walaga feast in the Bartle Bay district: its
    gathering of distant communities, its dancing platform and dance, organization
    by a taniwaga, summoning of those owing pigs and food, selection and clearing
    of a wild mango tree, and taboos and seclusion observed by male and female participants.
    A footnote also mentions related mourning feasts and mango trees used as a tally
    for pigs killed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Walaga is described as the largest and most spectacular feast in the Bartle
    Bay district, bringing together distant communities, including some indifferent
    or hostile to each other.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Walaga was said to be held when a community had many pigs of its own and
    when neighbouring peoples owed it much food, including pigs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feast is named for a large dancing platform built specially for the occasion.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Walaga is also the name of a dance performed in single file by both sexes
    on saplings placed around the outer edge of the platform.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The head man of one of the more powerful clans becomes taniwaga, or chief/master
    of ceremonies for the Walaga ceremonial.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The taniwaga sends messengers to people owing pigs to him or his community
    and begins preparations when enough pigs are expected.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: About five or six weeks before the feast, the taniwaga selects a self-sown
    wild mango tree in the jungle; it must be young and never have flowered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eight to twenty men accompany the taniwaga and clear a circle around the chosen
    mango tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the clearing, the taniwaga and the men are described as set apart or
    holy and are distinguished from all others.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The set-apart men may not wash, drink water, be touched by water, eat boiled
    food, drink cooking broth, or eat mango fruit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The set-apart men may drink only milk of a baked young coconut and may eat
    certain fruits and vegetables only if baked.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fasting men are said to sleep by themselves in a house into which no one
    else may intrude, and their food refuse is stored in baskets there until after
    the Walaga.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the day the men begin their fast, about six to ten women of the taniwaga's
    clan avoid male company and observe taboos against water, boiled food, and mango
    fruit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The women are subject to the same taboos as the fasting men, but they do not
    sleep in a special house and their meal refuse is not treated in the same way.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A footnote says that at the Gelaria ioi feast platforms are built and one
    mango tree is cut down for every five pigs killed, so the number of pigs is later
    counted by the number of mango trees destroyed.
  category: sequence
  evidence_refs:
  - ev:3
