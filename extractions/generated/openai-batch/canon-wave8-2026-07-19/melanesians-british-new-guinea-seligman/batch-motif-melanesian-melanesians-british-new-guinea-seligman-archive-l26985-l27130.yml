canonical_text:
  quote: ''
  summary: The passage describes stone circles, stone heaps, and stone rows in several
    southeastern New Guinea settings as men's sitting, yarning, meeting, and debating
    places; recounts a reported reception and peace-making sequence at Bagofigofi;
    notes some non-cannibal and cannibal uses of named circles; and describes a central
    water vessel formerly kept in a gahana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Rogea and on many southeastern islands, hamlets had large stones or heaps
    of smaller stones used as men's squatting and yarning places.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Rogea these places were called daru or dahi, and their practical value
    was explained as quickly drying when other places were wet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports that Tubetube did not make baru, while similar men's stone
    heaps were found across the D'Entrecasteaux group; a note states that women may
    not approach the Rogea baru.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Many Wagawaga hamlet-groups had non-cannibal gahana, stone circles built entirely
    by clan men and used by the men of a clan as squatting and debating places.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Bagofigofi, warned men were seated within a stone circle; they shouted
    welcome to the visiting party, but nobody rose.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kuania led the visitors around the outside of the stone circle while chewing
    areca nut and spitting around the circle, then addressed the men inside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Room was made for the white visitors inside the circle, while Kuania remained
    outside in front of settlement houses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men from the circle rushed toward Kuania feigning attack; at least one had
    a spear. Kuania placed a trade tomahawk at the village leader's feet, Berigi placed
    two pieces of hoop iron there, grey-headed women embraced Kuania, and peace was
    considered concluded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Taupota non-cannibal gahana formerly had a shallow pottery vessel full
    of water in the center, reportedly used by men as a mirror; some Massim gahana
    had floors of slightly raised stone slabs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Bartle Bay, Wamira stone circles and stone lines were called bolabola and
    are said to correspond to Wagawaga gahana; some were described as old-time men's
    squatting, meeting, and debating places.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that particular bolabola, especially at Irere, were used
    during cannibal feasts.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: For Irere, the reported sequence was that a body was taken to the bolabola,
    cut up, taken to the shore and washed in fresh water, then returned to the bolabola
    for cooking and eating.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: For Wedau, the passage reports that the cannibal feast took place outside
    the village and not on the bolabola.
  category: setting
  evidence_refs:
  - ev:10
