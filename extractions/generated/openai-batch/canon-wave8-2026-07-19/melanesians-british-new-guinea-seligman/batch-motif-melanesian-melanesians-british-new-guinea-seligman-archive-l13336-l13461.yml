canonical_text:
  quote: ''
  summary: The passage describes carved posts and other emblem-bearing elements of
    marea clubhouses, especially Tautaa at Herahera/Waima and Rabau at Mou. Local
    groups or settlements are associated with posts and with carved or modeled representations
    such as hornbill, crab-claw canoe sail, lizard, chelonian, and bird. It also describes
    responsibilities for carving, upkeep, post ownership, reciprocal food exchange
    during work, and a reported aruaru ceremony involving seclusion in a marea, possibly
    affected by recent deaths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The front right lateral post and the second right lateral post of Tautaa marea
    are described as carved to represent the hornbill; the first is linked with Roro
    Aiera of the Arabure stock, and the second with a Hauramiri local group.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The left front lateral post is linked with the Ereere stock and bears a representation
    of a crab-claw canoe sail; another left lateral post is linked with Herahera but
    is broken.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each post was supposed to have been carved by the chief of the group whose
    emblem it bore, but in practice many men assisted, and a skilled non-chief might
    perform much of the work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: While chiefs from outside groups worked on posts in Herahera, Herahera men
    gave them food; the passage states that this was closer to exchange than gift,
    because later the chiefs would present Herahera with as much or more food than
    they had consumed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A board beneath the kaiva of Tautaa marea bears representations of a lizard,
    a chelonian, and a bird; the lizard is central and larger, and represents the
    dam of Herahera settlement.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same discussion links Airava, the hornbill, with several Hauramiri and
    Arabure local groups and describes a hornbill effigy in the marea of Abotaiara
    with wings spread like a flat representation on the kaiva in Tautaa marea.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rabau, a large new marea at Mou, was built in July 1904 and had not then been
    inaugurated; the author treats it as probably an aruaru marea but notes that this
    was not directly confirmed during the visit.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note states that seclusion of initiates in aruaru marea had ceased at Waima,
    and reports that at Mou aruaru was described as a ceremony in which people of
    all itsubu meet and are shut up in a marea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports that the Mou aruaru ceremony could only occur when no
    death had taken place for about a year, and connects this with a Waima statement
    that aruaru marea no longer existed because many people had died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Paitana settlement of Mou is said to have six local groups whose representatives
    are responsible for upkeep of posts in Rabau, and certain posts, perhaps all,
    have the dada of the responsible local group carved on them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rabau has two central posts called kupua and eight lateral posts called meke
    before a closed-in chamber; the two kupua are assigned to Naime Aitsi and Paru
    Oa respectively.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
