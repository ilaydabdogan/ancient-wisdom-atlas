  summary: The passage analyzes the relation between ufuapie groups, ngopu groups,
    pangua, and iauafangai among Vee and Biofa communities. It reports a native-historical
    account in which early Biofa and Vee settlements each had two ngopu groups, paired
    as ufuapie to one another, and then compares that model with later Vee village
    data, especially Rarai.
