canonical_text:
  quote: ''
  summary: The passage describes beliefs about sua, spirits of the dead, who may punish
    neglect of funeral rites or custom, cause sickness or bad luck, assist descendants
    when asked, communicate through dreams and omens, visit feast places, receive
    small food remnants, and appear in dreams as healthy and decorated. It also describes
    harmless spirits of forgotten dead haunting the bush, sometimes perceived as snapping
    sticks, tickling sleepers, or bright bluish flames.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sua of recently dead people are said to punish neglect or infringement of
    funeral rites and may frequent the neighborhood of their former houses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dead person's sua is described as not harming relatives unless annoyed,
    but a son lacking zeal for his father's funeral rites could be punished.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Infringement of tribal custom is said to cause the sua to smite an offender
    with sickness or bring bad luck in hunting or fishing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sua may be asked to help the living; in one recorded case a husband whispered
    to his dead wife asking her to watch and protect people when hunting inland or
    fishing at sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Children playing near a ceremonially deserted house may become sick, and food
    hung in a house where a death recently occurred may cause sickness if eaten by
    non-family members.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sua are said to visit the dubu at feast time and, according to one informant,
    eat the shadow of food hung up there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: People may talk to sua on the dubu; the sua cannot be perceived by waking
    senses but may answer in dreams.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Charms are reported as brought to people in sleep by sua, and a Koita sorcerer
    said a spirit appeared during sleep angry and put two stones on his chest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bird and fish omens during hunting and fishing are said to be sent by the
    sua so people may know where to go and what to do.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Gaile, spirits of the dead could be seen in dreams before feasts and might
    say they would be with their descendants.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In dreams a sua appears as the person was before disease, often painted and
    decorated for dancing.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: At feasts, fragments of food were often left on the dubu for the sua after
    the old men had eaten.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author states that he could not discover that ancestors were invoked before
    hunting or that cooked food was offered to the sua.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: A homicide's fear of his victim is connected in some way with fear of the
    dead man's sua.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: When a homicide resorted ceremonially to the dubu, he was said to seek contact
    with spirits of the mighty dead of his people rather than protection from dead
    kinsfolk.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Certain harmless sua, identified as spirits of the forgotten dead, are thought
    to haunt the bush and cause only slight annoyance by snapping sticks and tickling
    sleepers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Another account says harmless sua wander in the bush at night appearing as
