canonical_text:
  quote: ''
  summary: The passage describes walaga feast practices involving a ritually restricted
    adze, cutting and carrying a mango tree, preserving chips and debris, pearl-shell-led
    processions, decorated houses and vines, pig-bringing guests, branch marking of
    houses, mango poles, and fasting dancers who wash, are oiled, decorated, and dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The adze associated with the walaga need not be new, has a koirepa wood handle,
    is not used for ordinary purposes after the walaga, and an iron adze is said to
    be unwise for this use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the tree is cut down, chips, leaves, and other debris are carefully
    wrapped in sleeping mats that had been arranged around the tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A number of fasting men carry the mango tree toward the village in a procession
    led by two women carrying pearl shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The leading women move forward toward the village, then turn to face the mango
    tree and walk backward while still approaching the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Behind the women come the taniwaga carrying the adze and the fasting man who
    is to lead the dances; other fasting men carry the mango tree, while others carry
    sleeping mats containing debris.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pearl shells are not used again after the ceremony and are stored with
    other walaga things, though they need not be new and appear to have no special
    name.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the specially built houses, dancing occurs and the mango tree is carried
    to the house of the fasting men with care to prevent it from touching the ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Houses around the walaga are decorated, and long vines run from the top of
    the mango to the houses with streamers, tin, and other shining materials attached.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Masters of the feast are painted in contrasting colors, with the eyes and
    nose especially picked out.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Guests bring pigs, approach in procession with conch shells and shouting,
    and are met by people of the host village who accompany the pigs in procession
    with singing and dancing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pigs are laid out in view of the mango tree, although informants state that
    the mango tree could not see them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Men spear house walls with branches they had been waving and leave the branches
    stuck there; the marked house indicates a connection between the household or
    clan head and the pigs in the procession.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A long mango pole with leaves, and possibly some roots, is carried in solemn
    procession; the narrator reports uncertainty about its final placement and repeats
    information about three mango poles.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The dancers, identified as men and women who had fasted since the mango tree
    was chosen, wash in the river, are oiled and dressed, continue fasting until they
    return home, and then dance in decorated attire.
  category: sequence
  evidence_refs:
  - ev:10
