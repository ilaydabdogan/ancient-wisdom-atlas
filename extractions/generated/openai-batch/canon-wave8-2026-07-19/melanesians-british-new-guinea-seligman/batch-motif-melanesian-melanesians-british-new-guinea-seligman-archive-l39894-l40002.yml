canonical_text:
  quote: ''
  summary: 'The passage describes Massim-region mortuary practices and attitudes toward
    human remains: avoidance of old cliff-burial bones, contrasting household care
    of relatives'' skulls and bones, Murua mourning and burial procedures, grave fires,
    exhumation and bone custody, widow restrictions, and a noted grave of Agiatau
    on Tokunu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bones in Kwaiawata cliff exposures were deposited without special arrangement
    and were not treated as hamlet or clan burial places.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skulls kept in houses were oiled and carefully tended, and there was at least
    a pretence of eating lime with spatulae made from bones of certain deceased relatives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: No native would approach closely the cliff-burial sites; the stated explanation
    was that these were old bones and highly dangerous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Murua, a low-status dead person could be exposed in a hut for a couple
    of days while friends came to weep, after which women buried the body in a trench
    near the village and a funeral feast followed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For a person of quality or chief, everyone was expected to weep over the corpse;
    the tribe mourned for months by blackening the whole body with charcoal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In some villages a fire was lit on the grave and tended by the parents of
    the deceased for a fortnight during seclusion and silence, interrupted only by
    funeral songs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: On a fixed day the grave fire was quenched, women exhumed the bones, and the
    nearest relation received them as a sacred trust.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A widow who received her husband's relics placed them in a decorated basket
    and carried it with her, especially at feasts, visits, and receptions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: According to Barton's informants, the body was placed in the grave by women
    of clans other than the deceased's clan.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before burial the widow remained in the dead man's house holding the dead
    man's head upright while the body was supported in a sitting posture; she did
    not sleep and was expected to wail continually.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The body was buried beneath the dead man's house.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two months after burial, women from the same clans as the buriers exhumed
    the body, collected the bones, smoked them over a fire at the seashore or in the
    bush, made a basket, and put the bones inside it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The basket of bones was handed to the widow, who kept it by her side.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Three months after the exhumation, men of the dead man's totem gave a feast;
    only after this feast could the widow go to the gardens.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: When the widow went to the gardens, she gave the basket containing her dead
    husband's skull to one of her children, preferably a girl, to guard until she
    returned.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After ten months in the house, the basket was taken away and placed in a cleft
    of a cliff; the widow painted a horizontal black mark across the forehead of the
    skull before the bones were placed there.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage states that in Murua it was not customary to make spatulae from
    bones or to use the skull as a limepot.
  category: other
  evidence_refs:
  - ev:10
- id: obs:18
  text: Agiatau, of the frigate-bird totem and head man of three Wapuru house settlements
    on Tokunu, had a grave resembling those of Teste Island, though smaller and without
    a roof.
  category: setting
  evidence_refs:
  - ev:11
