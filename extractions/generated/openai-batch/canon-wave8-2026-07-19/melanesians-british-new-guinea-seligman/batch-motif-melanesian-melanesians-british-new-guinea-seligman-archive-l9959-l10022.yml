canonical_text:
  quote: ''
  summary: The passage describes the ita feast held about six months after a death,
    the collection and distribution of food, the robumomomo ceremony that removes
    a widow's mourning with a clean petticoat and coconut water, a later hunting and
    communal meal rite ending concern for the dead, disposal of the tobi, and notes
    on widower mourning costume.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ita feast is held after about six months, approximately the time required
    for a banana crop to ripen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man's kinsmen and the widow's relatives collect yams and bananas;
    the food is arranged in piles before the dead man's house, each pile topped with
    green coconuts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some bananas and yams are boiled and placed in open pots beside the food heaps;
    after inspection, the providers distribute the food among relatives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The robumomomo ceremony is described as the most important part of the ita
    and is said to relieve the widow of mourning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead man's brother's wife, and often his sister, bring a clean ordinary
    petticoat into the dead man's house for the widow to put on.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The attendants lead the widow down the house ladder to the food piles, strip
    off her mourning ornaments, open green coconuts, pour the water over her, and
    rub her down to remove black pigment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the washing, the widow returns to the house; the bisa is burnt, but
    the tobi is not yet destroyed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The plate description says attendant women are about to remove the widow's
    yarasi; one holds a half coconut, another a brush, and vegetable piles appear
    before the group.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: About a month after the ita, the dead man's clansmen hunt; a caught pig or
    kangaroo is brought to the village and left overnight in the dead man's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the morning, bananas are placed on the dead man's verandah; clansmen cut
    up the animal, peel bananas, boil them together, and turn the cooked food into
    a large dish on the verandah.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The cooked food is eaten by villagers including the dead man's clansmen, but
    not by his near relatives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the food is finished, the dead man's brother says that they have eaten
    for and in remembrance of the dead and should no longer worry about him because
    he has ceased from among them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After the speech, the tobi is cast into the bush at the village border, where
    it rots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that the complete costume of a man mourning for his wife
    is no longer worn in the Port Moresby villages; widowers usually blacken themselves,
    while earlier costume included cassowary feathers and special headgear with a
    long pendant.
  category: attribute
  evidence_refs:
  - ev:7
