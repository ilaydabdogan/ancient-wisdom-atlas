canonical_text:
  quote: ''
  summary: The passage reports Koita/Koitapuan beliefs and accounts concerning weather
    influence, drought and sea-weather misfortune, retaliatory killings attributed
    to alleged bewitching, and a powerful rain-and-crop charm associated with pottery,
    stones, a taboo place called Varimana, a tree, a chief-sorcerer named Mabata,
    and offerings or presents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Koita are described as supposed to be able to prevent rain and to influence
    weather over a considerable coastline.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A prolonged drought was attributed to a Koitapuan village; a Motu party killed
    eight or ten people there, and rain soon followed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the returning hiri, rough sea and bad weather forced canoes to throw
    much sago overboard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tribe from Hood Point, angry at receiving little sago, killed the first
    man passing outside the Koitapu village, saying it was revenge for bewitching
    the canoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An old Koita sorcerer is reported as digging up powerful spirits or charms
    said to produce rain and abundant crops; the objects were described as a pottery
    fragment and two small round river stones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Varimana is named as a sacred Koitapuan place in the bush near Port Moresby
    where no one treads, with death said to follow trespass.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A story says mighty men carried a very large stone from Sogeri; many died
    during the journey, and the tribe begged that it be left at Varimana.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stone was later carried to Koiari, where many died; it was returned and
    buried at Varimana beside a young tree, which grew large and covered it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before burial, the stone was wrapped in native cloth and bound with twine.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When grass near the tree was to be burned, Mabata cleared a wide space so
    that fire would not approach the tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mabata’s threat to dig up the stone and turn it over was said to terrify the
    Motu, who brought him many large presents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mabata dug near the tree and uncovered pieces of earthenware containing two
    small pebbles; tobacco was left as a present for the spirit, and the narrator
    carried the objects away.
  category: sequence
  evidence_refs:
  - ev:7
