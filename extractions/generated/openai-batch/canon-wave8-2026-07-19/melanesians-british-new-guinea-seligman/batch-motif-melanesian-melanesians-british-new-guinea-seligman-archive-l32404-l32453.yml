  summary: The passage classifies taboo in southeastern New Guinea into magically
    sanctioned prohibitions and nonmagical prohibitions enforced by public opinion
    and custom. It further describes taboo signs, customary abstentions, and the protective
    effect of uncertainty over whether a sign or object has magical 'medicine.'
  language: English
