canonical_text:
  quote: ''
  summary: Ethnographic account of Trobriand clans, linked totems, clan names, family
    groups, local variation, and a myth in which people and clan totems emerge from
    Tuma, the other world, through a deep hole to colonize the upper world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage describes Trobriand totemism as a system of linked totems and
    identifies four chief bird totems: pigeon, fish-hawk, green parrot, and lory.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four named Trobriand clans are Malasi, Lukuba, Lukosisiga, and Lokulobuta,
    each paired with a chief bird totem.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A table associates each clan with a bird, a four-footed animal, a fish, and
    a plant: Malasi with pigeon, pig, Mawa, Kaiaula; Lukuba with fish-hawk, dog, Mamila,
    Meku; Lukosisiga with green parrot, crocodile, Kaisoa, Girigiri; Lokulobuta with
    lory, monitor lizard, Mwaluya, Butir.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Clan affiliation is expressed with sex-specific forms for clansmen and clanswomen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each clan contains family groups called dalela, whose members trace origin
    to a common ancestor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: On Kiriwina, each clan is said to have additional linked birds; at Osiwasiu
    on Kaileuna each clan has only its chief bird totem, with pig and dog associations
    also reported.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The linked totems are explained by a myth said to resemble one from the Marshall
    Bennets.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The myth says the world was originally colonized from Tuma, the other world;
    Topileta sent men and women to the upper world while remaining underground, because
    Tuma’s population grew rapidly and famine was feared.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A deep hole called Rabai between Mwatawa and Kiriwina is named as the place
    where men first emerged from the lower world.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The clans emerge in sequence: Malasi with bird totem and pig; Lukuba with
    fish-hawk, pig, and dog; Lukosisiga with green parrot and pig; Lokulobuta with
    lory only.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before people came to the upper world, there were no yams and no stones for
    supporting cooking pots; Topileta told the people to bring these from the underworld,
    where people had already learned to build houses and make gardens.
  category: sequence
  evidence_refs:
  - ev:7
