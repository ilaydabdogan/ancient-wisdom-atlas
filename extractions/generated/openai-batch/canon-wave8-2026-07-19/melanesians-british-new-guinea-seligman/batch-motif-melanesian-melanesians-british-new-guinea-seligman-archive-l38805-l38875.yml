canonical_text:
  quote: ''
  summary: The passage describes reported customs and beliefs concerning fertility,
    pregnancy, childbirth, lactation, daughters and sons, twins or triplets, adoption,
    and totem inheritance. It includes fertility treatment by a medicine man, pregnancy
    feasting, childbirth practices, postpartum water avoidance, a lactation-period
    sexual taboo, preference for sons, social and marital consequences for families
    without sons, ridicule of mothers of twins or triplets, and matrilineal totem
    affiliation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are said to be desired, especially boys, and a barren woman's childlessness
    may be used as a reproach in a quarrel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tnegua tau or megua tau may be called to treat barrenness through incantation
