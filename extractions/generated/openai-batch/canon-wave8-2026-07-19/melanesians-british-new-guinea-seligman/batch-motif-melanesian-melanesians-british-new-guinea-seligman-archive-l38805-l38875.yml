  - ev:2
- id: obs:3
  text: Intercourse is recognized as the cause of children, while single girls who
    become pregnant may blame part of their diet.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When pregnancy becomes certain, husband and wife give a feast to friends and
    relatives; no special seventh-month ceremony is reported.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After childbirth for about three months, a woman avoids drinking cold water
