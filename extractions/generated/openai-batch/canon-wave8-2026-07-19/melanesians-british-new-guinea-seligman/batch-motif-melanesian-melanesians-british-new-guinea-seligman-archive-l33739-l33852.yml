  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Male dancers were decorated with red bird-of-paradise plumes, oiled and reddened
    bodies, palm branches, and in two cases spears.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Men decorated themselves secretly in the bush, and one late-arrival procession
