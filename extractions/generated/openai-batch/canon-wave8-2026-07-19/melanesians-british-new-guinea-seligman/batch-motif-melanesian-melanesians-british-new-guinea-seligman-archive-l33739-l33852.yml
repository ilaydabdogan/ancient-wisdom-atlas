canonical_text:
  quote: ''
  summary: 'The passage describes the Diwari walaga feast: preparation and cutting
    of a mango sapling, transfer of responsibility for the next walaga, drying and
    installation of the tree on a platform with associated objects, pig presentations
    described as payments, use of mangoes, axes, sticks, and branches in processions,
    killing of a dog during one pig presentation, and public dancing with decorated
    men and women through the night.'
  language: English
  quote_policy: summarized
