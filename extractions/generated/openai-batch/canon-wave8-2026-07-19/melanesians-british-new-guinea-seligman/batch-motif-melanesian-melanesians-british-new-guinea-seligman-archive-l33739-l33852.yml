candidate_motifs:
- id: motif:1
  label: ceremonial tree as feast focus
  taxonomy_refs:
  - sacred_tree_axis
  basis: The walaga mango is cut, transferred, dried, tied to the dawati, and placed
    beneath a vertical arrangement of belongings and food objects during the feast.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not state cosmological axis symbolism; the taxonomy reference
    is based only on the tree's central ritual placement.
- id: motif:2
  label: ritual transfer of feast responsibility through receiving tree leaves
  taxonomy_refs:
  - sacred_exchange
  basis: After district names were called and Daigogo accepted, Tetebani caught the
    mango leaves and became responsible for the next walaga.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes the transfer but does not explain its full social
    or mythic rationale.
- id: motif:3
  label: animal presentations as payments
  taxonomy_refs:
  - sacred_exchange
  basis: Pigs were brought from many directions, given to a recipient clan, discussed
    or protested over, and described by the narrator as payments of some kind.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: high
  cautions: The exact debts or obligations paid by the pigs are not specified in the
    passage.
- id: motif:4
  label: numeric equivalence of five pigs and a mango
  taxonomy_refs: []
  basis: The passage states that five pigs were called a mango, that a small mango
    tree was cut, and that mango objects accompanied pig processions.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports the equivalence but does not provide an interpretation
    of why five pigs correspond to a mango.
- id: motif:5
  label: animal killing in conjunction with presentation count
  taxonomy_refs:
  - sacrifice
  basis: A dog was killed after pigs were laid down, and the narrator suggests this
    may have made the number up to five.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The passage does not call the dog killing a sacrifice, and the narrator's
    explanation is explicitly tentative.
- id: motif:6
  label: night-long communal dance with adornment, drums, and carried objects
  taxonomy_refs: []
  basis: Men and women danced with plumes, branches, spears, shells, gourds, cloth,
    drums, and singing until daylight.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: high
  cautions: The pattern is described ethnographically; no mythic narrative meaning
    is given in this passage.
comparison_claims:
- id: claim:1
  claim: The passage makes a cautious local procedural comparison between Diwari and
    Gelaria walaga practice by reporting that informants said the same axe was used
    at both and by mentioning an unobserved Gelaria-like night practice.
  claim_level: same_function
  target: Gelaria walaga practice as mentioned in the passage
  evidence_refs:
  - ev:13
  - ev:14
  counter_evidence_refs:
  - ev:13
  - ev:14
  confidence: low
  limitations: Accounts of the axe are described as conflicting, and the narrator
    did not observe the Diwari night events being compared with Gelaria; this does
    not support a broader historical-contact or common-inheritance claim.
