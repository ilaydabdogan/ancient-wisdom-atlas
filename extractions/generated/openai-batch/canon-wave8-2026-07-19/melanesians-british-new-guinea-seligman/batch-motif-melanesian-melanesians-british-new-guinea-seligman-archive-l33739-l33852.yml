  text: A cleared space, mats around the stem, and a string network over the leaves
    were reported as part of the tree preparation.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tebari of the Ewa tribe cut down the tree; the passage reports conflicting
