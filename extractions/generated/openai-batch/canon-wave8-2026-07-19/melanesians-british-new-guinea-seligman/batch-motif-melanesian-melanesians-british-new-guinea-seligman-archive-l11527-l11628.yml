literal_observations:
- id: obs:1
  text: The Roro tribe formerly lived at Maiaera, near the coast and inland from the
    beach.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Roro moved from Maiaera to Araha after continual warfare with Waima, Mekeo,
    and Paitana, and later dispersed after an epidemic.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the epidemic, Roro groups went to Yule Island, Pinupaka, Pokama, Baara,
    Delena, and Erierine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people of Mou, a Paitana village, were said to have lived on the plain
    of Maiaera near the Roro settlements.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mou/Paitana people moved to Ararana after petty warfare and later moved
    again after an Elema attack in which many were killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The early Mou settlement near the present village consisted of several small
    settlements, probably clan-based, compared in the passage to a Waima congeries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Delena is described as Roro-speaking and as having adopted the Roro form of
    chieftainship, while also including descendants of Motu clans whose identity merged
    into the Roro-speaking settlers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Waima is described as a coastal tribe of about 1100 people living in about
    twenty settlements over a coastal and inland area.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A range of hills forms a ridge between the Waima settlements and the sea,
    and Cape Possession is described as the western boundary of the Roro-speaking
    tribes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kevori settlements lie between Waima and Cape Possession and are described
    as generally resembling the Waima congeries.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Waima and Kevori had enmity, intermarriage, and some Waima settlements that
    were acknowledged as colonies from Kevori.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kevori is divided into coastal and bush groups called Kevori Kone and Kevori
    Gunekai.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Waima land extended inland and formerly westward to Ovia Pokina, where Waima
    and Kevori faced each other.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ovia Pokina had been abandoned recently enough that coconut palms remained
    there, and Waima men killed in wars with Kevori were buried there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Roro-speaking settlements mostly have two rows of houses facing each other
    across a straight sandy village street.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: In shore villages, the village street is usually roughly parallel to the beach.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: Where two clans are represented, the clan division usually runs at right angles
