canonical_text:
  quote: ''
  summary: A captive boy is released by children, receives three spears from his parents,
    climbs a coconut palm, tricks ogre-villagers into cooking and eating his excreta,
    kills climbers by spearing their eyes, and escapes by turning into a black cockatoo
    when the tree is cut down. A following tale begins with a girl whose mother and
    aunts repeatedly eat her preferred yellow lily root; she adorns and oils herself,
    departs with her dog, climbs a wakola tree over the sea, refuses her mother’s
    plea to come down, and sees a crocodile beneath her.
  language: English
  quote_policy: summarized
