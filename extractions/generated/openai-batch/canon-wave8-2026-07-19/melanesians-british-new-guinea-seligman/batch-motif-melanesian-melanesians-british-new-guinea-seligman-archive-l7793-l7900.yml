canonical_text:
  quote: ''
  summary: 'The passage describes Koita, Motu, Kabadi, Boera, Poreporena, Porebada,
    Gulf, and Koiari conflict practices: avoidance of pitched battles, alliance in
    raids, warning of kin or friends before attacks, accidental homicide and compensation,
    and a case in which heni compensation prevented vendetta after Magani Numuru was
    accidentally killed by Daure Garia.'
  language: English
  quote_policy: summarized
