canonical_text:
  quote: ''
  summary: The passage describes Murua, especially Suloga, as the source of banded
    stone used for utilitarian adze and axe blades and for ceremonial benam blades.
    It traces regional trade routes for stones and Amphlett pots, then records named
    benam blades, their makers or holders, movements through exchange partners, prices
    paid in valuables, pigs, canoes, coconuts, belts, and other goods, and one case
    where discussion of a blade was inhibited because its name matched that of an
    informant's dead wife. It closes by contrasting lower-value tool blades with higher-value
    ceremonial blades and noting archaeological debris from generations of stone working
    near Suloga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Suloga on Murua is identified as the site from which celebrated banded stone
    was obtained for adze and axe blades and for ceremonial blades called benam in
    the Tubetube language.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Both utilitarian and ceremonial stones entered trade via Tubetube to some
    extent, while many stones from Murua travelled westward through the Marshall Bennets
    and Trobriands toward the Amphlett and D'Entrecasteaux groups and around a trade
    circle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Amphlett Group is described as making strong, well-decorated pots that
    are traded north to the Trobriands and south and east to Milne Bay and neighboring
    islands, but not commonly to Tubetube.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The manufacture of ceremonial blades had ceased some years before the account,
    and the author states that every ceremonial blade in the Massim area originally
    came from Murua, probably from a small district of that island.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists named benam and records their movements among places and
    owners, with exchange values given in pigs, shell valuables, canoes, coconuts,
    belts, food, and other objects.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
- id: obs:6
  text: Several named blades are connected with Nevan, who is said to have manufactured
    well-known benam three generations earlier and to have sold or kept certain stones.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
- id: obs:7
  text: One blade's real name could not be obtained because it was the same as the
    name of the dead wife of Tudaiva, an important man on Suloga, who was reluctant
    to discuss it even under the generic term Giriwaku.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A footnote states that people in the south-eastern district were reluctant
    to show or talk freely about their most valued possessions when they might be
    asked to display them.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:9
  text: Tool adzes and axes of Murua stone were valued much less than ceremonial blades,
    but were exported in very large numbers, as indicated by collected axe blades
    and extensive chipping debris near Suloga.
  category: object
  evidence_refs:
  - ev:10
