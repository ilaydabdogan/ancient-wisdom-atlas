canonical_text:
  quote: ''
  summary: The passage introduces Oa Rove Marai as a Roro-speaking tribes' spiritual
    being who does not grow feeble or cease to exist, can change shape, and is associated
    with hunted animals, offerings, revenge, mosquitoes, weapons, and the sacred or
    set-apart quality expressed by the term rove. A legend tells how he appears to
    an old widow as a child, becomes her adopted son, catches more game than the Arabure
    men, retaliates when they take his game, provides abundant game and fish, takes
    women in a canoe, carries the canoe toward the sky to a high mountain, causes
    crotons to arise from the women's water, and finally lets the women fall so that
    they become rocks, hills, and mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oa Rove is described as unlike other spiritual agencies because he would never
    grow feeble or cease to exist, and his parentage was unknown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before some large communal hunts, areca nuts are said to be left in the bush
    for Oa Rove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Oa Rove could change shape as he wished; in revenge he sent mosquitoes, gave
    men weapons, and taught them how to kill each other.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The word rove is explained as having a sense of sacredness, being set apart,
    or being esoteric; people or objects called rove are subject to restrictions or
    special handling.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: An old widow returning with a bag of gathered fuel heard a squeaking cry from
    the bag, and during the night a child identified himself as Oa Rove Marai and
    told her to treat him as her child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Oa Rove caught many wallaby and cassowary, angering the Arabure men, who took
    his game from him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After returning to his adopted mother with one small wallaby, Oa Rove blew
    on it and many large wallabies appeared dead in the hut for them to feast on.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Oa Rove took his mother and the better-looking women in a canoe upstream and
    caused fish to gather so densely that the women caught them by hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the women asked for food and cooking materials, Oa Rove made yams, banana
    leaves, cooking fires, and areca nuts available to them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: While the women slept, Oa Rove carried them and the canoe upward toward the
    sky and stopped on the top of a high mountain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A woman woke and passed water; the water fell to earth and gave rise to crotons,
    and the other women did likewise, producing more crotons.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Oa Rove's adopted mother accused him of stealing the women, and he answered
    that he had taken the Arabure men's wives because they had stolen his pig and
    wallaby.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Oa Rove let the women fall, and as they fell they became rocks, hills, and
    mountains.
  category: action
  evidence_refs:
  - ev:12
