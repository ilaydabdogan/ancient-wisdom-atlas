canonical_text:
  quote: ''
  summary: The passage describes the marea as a men's clubhouse of each clan local
    group, gives its architectural plan and decorations, notes the absence of origin
    legends except for a remembered first builder named Obia, and explains the association
    of marea ownership, upkeep, and hereditary names with the right and left chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each local group of each clan is expected to have at least one marea, which
    serves as the men's meeting place and clubhouse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A marea is built on piles and has a raised unroofed front platform; except
    in very small examples it also has a second platform behind the first.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The interior arrangement includes benches along the sides and back, an inner
    compartment separated by a partition, and a small door as the only access to the
    interior.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Roof-supporting posts often bear carved clan badges, and the front roof overhang,
    called kaiva, may be decorated with dried-leaf pendants and carved boards.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Marea vary in size and degree of decoration among the described Roro-speaking
    communities and villages.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Repeated inquiries reportedly found no legends about the origin of marea,
    but at Siria the name Obia was preserved as the alleged first maker, whom others
    imitated; his itsubu and marea name were forgotten.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the time described, each local group of every clan should have two marea,
    one belonging to the ovia itsipana and the other to the ovia awarina.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: An older arrangement is described in which one marea belonged to both chiefs,
    the chief of the right and the chief of the left, with each responsible for the
    upkeep of his half.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Marea names are said to descend from one marea building to the next; originally
    there was one name for all the marea of a clan, while contemporary local groups
    generally have their own marea names.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Aitsi Benuna, two marea named Kevoripaka face each other from opposite
    ends of the village street and belong respectively to the ovia itsipana and ovia
    awarina.
  category: setting
  evidence_refs:
  - ev:7
