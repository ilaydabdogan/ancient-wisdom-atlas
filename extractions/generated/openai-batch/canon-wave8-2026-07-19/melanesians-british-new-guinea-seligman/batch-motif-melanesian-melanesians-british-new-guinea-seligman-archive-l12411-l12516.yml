canonical_text:
  quote: ''
  summary: 'The passage describes Roro-speaking chieftainship: hereditary right- and
    left-side chiefs, their ceremonial positions in the marea, procedures for stopping
    fights and making peace, chiefly authority over coconut taboos, substitute and
    policing duties of the second chief, distinctions among war chiefs and battle-magic
    experts, and assistants to chiefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each itsubit, or local group of an itsubu, has a head man or chief called
    the ovia itsipana, with a second chief called the ovia awarina; a few weak itsubu
    had no acknowledged ovia awarina.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The titles ovia itsipana and ovia awarina mean chief of the right and chief
    of the left, are hereditary, and are linked to positions on the right and left
    of the median line of the clan clubhouse during important ceremonies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ovia itsipana takes the principal part in ceremonies involving more than
    one itsubu and can intervene to stop faction fights in his village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fight can be stopped when an ovia itsipana gets between combatant lines,
    scatters lime from his gourd, and waves the leafy crown of a dracaena; an opposing
    ovia itsipana is expected to assist by doing likewise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When peace is desired during an invasion by a usually friendly community,
    the prominent ovia itsipana advances with a spear, lime gourd, mahawa bag, and
    armshells, and the two chiefs break each other's spears before discussion and
    settlement.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each ovia itsipana has the right to pronounce a taboo on coconuts belonging
    to his local group, but not without prior consultation with old men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ovia awarina may substitute for the ovia itsipana when the latter is away,
    but is expected to consult him before decisive action.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The ovia awarina is responsible for policing the village, preventing petty
    thefts, and adjusting quarrels arising from theft.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Roro-speaking communities have war chiefs who lead in war and are distinguished
    from paiha chiefs, who are experts in battle magic and assure success in war.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: War chiefs are described as never being clan chiefs and as generally, though
    perhaps not invariably, being ovia awarina; each war chief has or had a marea
    differing from other marea.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: An ovia itsipana may have an assistant, often hereditary and usually a man
    of wealth and influence, who helps him during clubhouse ceremonies; the ovia awarina
    may also have such an assistant.
  category: relationship
  evidence_refs:
  - ev:10
