canonical_text:
  quote: ''
  summary: The passage examines whether the ufuapie alliance group regulates marriage
    in Mekeo, discusses claims about allied villages exchanging pigs, dogs, death-feasts,
    dances, and marriage partners, then contrasts these claims with genealogical and
    ethnographic evidence. Notes also describe elopement or 'marriage by robbery,'
    marriage by contract with bride-price, mock pillage after marriage, and stories
    of an older marriage-by-capture practice involving a bathing girl and the fastening
    of her petticoat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author reports an impression from Mekeo discussions that marrying within
    the ufuapie group was considered better but not necessary.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Father Guis is reported as saying that young men of a village may only marry
    girls of their allied village, identified with ufuapie or auai at Mekeo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Guis' example, the people of Beipaa or Veifa raise pigs and dogs for Amoamo,
    and Amoamo reciprocates with pigs and dogs for Beipaa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a death occurs in one allied village, a tazu feast is given and eaten
    by the other; when mourning is to end, the ufuapie are invited to dance, eat,
    perform ceremonies, and thereby end the mourning period.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guis states that, according to accepted rule, girls of a village should marry
    only men of the ufuapie, with exceptions for elopement or excessive parental demands
    for bride-price.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author rejects the identification of an ufuapie group with a village and
    says he found no general special arrangement by which members of ufuapie groups
    in different villages raise pigs and dogs for each other.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:7
  text: Father Egidi's genealogy of Inawi is said to show that marriages within the
    ufuapie were not predominant and occurred only slightly.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:8
  text: The earliest recorded marriages included couples with the same or different
    iauafangai marrying without distinction.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:9
  text: At the time described, marriage, but not sexual intercourse, is forbidden
    between members of the same pangua.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:10
  text: 'Two forms of marriage are recognized in the note: elopement or ''marriage
    by robbery,'' in which the young couple disappears for a few days during negotiations,
    and ''marriage by contract,'' in which bride-price is settled by haggling.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bride-price is described as provided by contributions from the bridegroom's
    paternal and maternal relatives and distributed mainly to the bride's father's
    relatives with some going to her mother's relatives.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A mock pillage following marriage affects gardens of the local groups of both
    of the bridegroom's parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Stories among the Biofa and the Vee are said to preserve an older marriage-by-capture
    pattern in which a young man surprises a bathing girl without her petticoat and
    claims the right to make her his wife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: In those stories, the marriage is consummated at once and the young man fastens
    the girl's petticoat afterward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The author states that the right to obtain a wife by this capture practice
    no longer exists, though he believes the husband's fastening of the girl's petticoat
    still remains in Mekeo marriage custom.
  category: speech
  evidence_refs:
  - ev:8
