canonical_text:
  quote: ''
  summary: The passage describes blood-price payments for death or killing, naming
    relatives who may receive compensation, explaining that mutual deaths in a brawl
    still require ceremonial atonement for each death, and stating that family responsibility
    rather than hamlet-group responsibility is central, with fathers expected to help
    pay for sons' misdeeds. It also states that accidental killing within the hamlet
    but outside the family requires payment and that the blood price is the same for
    a man, woman, or child.
