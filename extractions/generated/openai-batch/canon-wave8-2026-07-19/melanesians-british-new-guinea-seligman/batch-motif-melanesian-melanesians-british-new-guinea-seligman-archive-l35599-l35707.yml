canonical_text:
  quote: ''
  summary: The passage records reported forms of disease- and death-producing magic
    in Milne Bay, Tubetube, Basilaki, Kitai, Bartle Bay, and Gelaria. It describes
    plant-based gom sorcery, fatal plant admixtures in food or on a lime spatula,
    a hidden pellet method involving salt water, ginger, and leaves, the rule that
    only the responsible sorcerer can cure the victim, and a projected female “sending”
    or labuni associated with women, petticoats, bodily organs, and other-world passage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Milne Bay, Barau is presented as a general term for disease-producing magic.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young shoots of the gom tree are chewed while spells are muttered and are
    believed to become capable of causing death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sorcerer using gom makes himself rogau, glossed as apparently invisible,
    and spits the chewed shoots toward the victim; actual contact is said not to be
    necessary, though the sorcerer tries to come close.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The victim of gom sorcery becomes ill after two or three days, lies down by
    the fire in his house, worsens, and dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Only the sorcerer who produced the illness can cure the stricken man, by chewing
    another root and spitting it on him while muttering spells; ginger may be mixed
    with gom shoots to increase their deadly quality.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Other plants are said to cause fatal vomiting and purging when mixed with
    food, and another plant rubbed on a lime spatula is said to cause fatal tongue
    swelling and ulceration; the passage states that poison and magic are not clearly
    differentiated here.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Tubetube, no sorcerers or medicine men are said to live on the island,
    while neighboring Basilaki and Kitai are said to have many; deaths are attributed
    to Basilaki people or other strangers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Kitai account, a sorcerer drinks salt water until purged, mixes ginger
    with leaves of dagaiiuari and wakimoi, hides a pellet between two fingers, and
    touches the victim under a pretext.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The victim of the pellet method becomes feverish and cold, makes a fire, lies
    close to it, sleeps, becomes comatose, and dies; friends may bribe the responsible
    sorcerer to cure him, and only that sorcerer can remove the disease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Bartle Bay, disease and death are described as often caused by a “sending”
    projected from the body of a sorcerer or witch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The “sending” is said to lead a separate life after the death of the person
    in whom it is normally immanent, to be most commonly projected from a woman, and
    after her death to pass to her daughter or with her spirit or shade to the other
    worlds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A woman can save a man struck down in battle by throwing her short petticoat
    over him; the passage connects the protection with fear of witchcraft and with
    a power believed to reside in the woman’s body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Gelaria, the “sending” is called labuni; labuni exist within women and
    can be commanded by women who have had children.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The labuni is said to resemble a shadow, to emerge from a woman who appears
    to be sleeping, to derive from or exist in an organ called ipona in the flank,
    literally meaning egg or eggs, to leave and re-enter the body per rectum, and
    to wear a short petticoat.
  category: attribute
  evidence_refs:
  - ev:8
