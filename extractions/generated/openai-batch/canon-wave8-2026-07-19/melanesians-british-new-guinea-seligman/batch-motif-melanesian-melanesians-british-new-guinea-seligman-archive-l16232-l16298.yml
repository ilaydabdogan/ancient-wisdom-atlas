canonical_text:
  quote: used to procure the death of an enemy
  summary: The passage describes a skull-supporting charm made to resemble a face
    and decorated with cane, boars' tusks, human hair, feathers, herbs, coral, a fish
    mandible, and a quartz pebble. It states that the charm was said to be used to
    cause an enemy's death and that quartz pebbles were considered deadly. It then
    describes beliefs in disease or death caused by sorcerers, mythical beings, and,
    in some cases, spiritual agencies controlled by a sorcerer, including cases where
    a footprint or an ambiguous nocturnal hand-taking was treated as evidence of bewitchment.
  language: English
  quote_policy: quoted
