canonical_text:
  quote: ''
  summary: 'The passage records ethnographic information about totemic observances
    at Gawa, Kwaiawata, Iwa, Murua, Tokunu, and related villages: avoidance of harming
    or eating certain own and paternal totems, use and avoidance of totem feathers
    and ornaments, old marriage restrictions involving a father''s clan or totem,
    linked bird-fish-snake-pig totems, and a Murua account in which an old man of
    Suloga originally distributed totems and receives the dead under the earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Iwa, a man would not injure his own totem plant, but could ask a man of
    another totem to cut it down if it was a nuisance in his garden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People at Iwa who had the pig as one of their totems were reluctant to eat
    brown or yellowish pigs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man could wear feathers of his totem bird as dancing ornaments, but men
    were not restricted to feathers of their own totems.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In former practice, a man who killed a totem bird gave some of its feathers
    to a man of the clan whose totem had been killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People showed respect for their father's totem animals comparable to respect
    for their own totems.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: No one would eat or kill his father's bird or fish totems; if such a fish
    was caught, it could be given to another clan member to remove from the net.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A father's totem plant was not uprooted or injured, and on Kwaiawata a man
    was said to avoid asking another to remove it from his garden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: It was alleged that a man would generally avoid killing a snake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Formerly, an individual would not marry into his or her father's clan, though
    the custom was said to be declining.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kutopara, chief of the tarakaka folk of Gawa, had recently married a woman
    of his father's clan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A man would not wear feathers of his father's totem bird or a boar's tusk
    ornament if pig was one of his father's totem animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Murua, the name for a totemic clan is given as man.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Captain Barton was told that an old man of Suloga originally gave a bird and
    fish totem to each clan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When Murua folk die, they go down into the earth, where the old man receives
    them and assigns them places.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In Dekoias, everyone was said to have linked totems from different orders
    of vertebrates, but no plant totems.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Snakes appeared to be totem animals in Dekoias, but comparatively little respect
    was felt for them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: At Suloga and in related testimony, the Torres Straits pigeon was linked with
    the fish gudowara and with snake; one Murua boy also included pig among his totems.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: The word used for snake was the general word for snake, not the name of a
    particular species.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: At Murua and Tokunu there was disagreement about treatment of a man's own
    totem bird, but it was clear that no one would hesitate to kill and eat his own
    totem fish.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:20
  text: The passage concludes that there was no general strong feeling at that time
