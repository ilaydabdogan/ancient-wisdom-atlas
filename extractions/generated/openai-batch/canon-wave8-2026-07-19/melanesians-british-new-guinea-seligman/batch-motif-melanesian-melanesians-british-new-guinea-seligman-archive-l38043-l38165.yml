  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: A man of the frigate-bird totem could wear frigate-bird feathers when dancing,
    and men of other totems could do the same, but a man whose father had frigate-bird
    as totem would not handle those feathers.
  category: action
  evidence_refs:
  - ev:11
- id: obs:23
  text: The same avoidance rule was said to apply to white cockatoo feathers, even
