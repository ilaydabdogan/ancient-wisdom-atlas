canonical_text:
  quote: ''
  summary: The passage describes a Bozua/Motu Powa feast held shortly after a burial.
    Members of the iduhu cook vegetable food and place it before the dead man's house;
    friends and relatives from other villages also contribute. The nana and roro pay
    the grave diggers, send part of the food to iduhu rohi of other iduhu, and divide
    the remainder among those present.
