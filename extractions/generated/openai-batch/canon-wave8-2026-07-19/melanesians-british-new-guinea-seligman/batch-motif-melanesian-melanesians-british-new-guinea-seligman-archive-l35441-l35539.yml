canonical_text:
  quote: ''
  summary: The passage describes dances associated with mortuary occasions, the wapa
    ceremony at the toreha, pig presentations involving the dead man’s brother, aii,
    and sisters, burning of the wapa, later breaking of dunali shells to complete
    the dead man’s rites, and an explanation of reciprocal feeding. It then gives
    Bartle Bay information on the timing and social rules of the torela, including
    postponement after deaths, outsiders eating the feast, lifting of taboo through
    a feast, ritual feeding by a chief, removal of mourning badges, distribution of
    food, and public discussion of misconduct. It concludes with Gelaria burial practices,
    including posture of the corpse, rank differences, orientation toward clan origin,
    and children’s mourning attire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After sundown, younger men return and dance for many evenings; each evening
    is reserved for a single dance, pediri is described as the favourite, and dancing
    upon the watara is said not to occur.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man’s brother removes the wapa from the body and keeps it in his
    house until the toreha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the toreha, the brother presents a large pig to the dead man’s aii, and
    the wapa is tied to one forefoot of the pig while the pig lies bound on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the aii carry away the pig, one of them removes the wapa; the wapa is
    burned when the pig is singed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dunali shells from the wapa are kept until a later pig, fattened by the
    dead man’s sisters and presented to their brothers, is given; then one of the
    aii breaks the dunali, and the dead man is described as completely finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Both pig presentations are called gamapuyaga, and the interpreter’s explanation
    frames them as reciprocal feeding before death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Bartle Bay, the torela is normally postponed after later deaths until all
    banivi for the last death have been eaten, usually resulting in a torela about
    a year after the last death in the community.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The torela is eaten only by people outside the community that provides it;
    visitors may bring return food for smaller clan feasts, but this is not treated
    as part of the torela.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The death of an influential person can extend a taboo on dancing and drum-beating
    until a later ceremony lifts it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a large torela, a new potuma was built, banivi for the young man were closed,
    certain women received small portions of vegetable and flesh food placed in their
    mouths by the chief, drums were struck, and mourning badges were apparently removed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At food distribution, names were called and pork and food were thrown down
    for named people; at the same time, bad behaviour and evil deeds were discussed,
    and one accused man refuted a charge.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The interval between a death and a torela is said to depend on the dead person’s
    social status, judged by wealth in pigs and food.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Gelaria, the corpse is carried to the grave in a squatting posture, bound
    into a compact form, and, depending on rank, buried either squatting or on its
    side; the body faces the direction from which the dead man’s clan is supposed
    to have come.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'Children of the deceased wear mourning for their father: boys are blackened
    and wear armlets, while girls wear armlets and a mourning necklace.'
  category: attribute
  evidence_refs:
  - ev:11
