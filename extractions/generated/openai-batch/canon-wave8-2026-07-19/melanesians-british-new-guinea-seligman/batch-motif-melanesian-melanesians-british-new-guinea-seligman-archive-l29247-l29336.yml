canonical_text:
  quote: ''
  summary: 'The passage describes marriage practices at Wagawaga, Tubetube, and Bartle
    Bay communities: binding marriage through reciprocal exchanges of food or valuables,
    post-marital residence movements, garden labor obligations, and the Wagawaga rule
    called muri or viuli, which includes reciprocal feasts and licensed taking of
    property by certain affinal female relatives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Wagawaga, a binding marriage is constituted by relatives of the girl and
    boy exchanging food presents and by the young couple living together publicly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wagawaga, the boy's mother fetches her daughter-in-law and brings her to
    the house where the mother and son are living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Wagawaga, the young husband's relatives prepare food that the bridegroom
    and his male relatives carry to the girl's hamlet and leave on the watara for
    the bride's relatives.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:13
- id: obs:4
  text: On the following day at Wagawaga, the bride's people prepare food and take
    it to the bridegroom's hamlet, where his family eats it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Wagawaga, neither the bride nor the bridegroom partakes of the reciprocal
    feasts, which are repeated after about a month and are called muri or viuli.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Wagawaga, the term muri also applies to licensed taking of property by
    the wife's sister, mother, and ail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A wife's sister may take things belonging to her brother-in-law, and he is
    not supposed to object or grumble.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Wagawaga licensed-taking rule applies to canoes, fishing nets, house furniture,
    and personal jewellery, but not to garden produce before it has been gathered.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Wagawaga, a man's sister and other members of the husband's family have
    no comparable right to take property belonging to his wife.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Tubetube, marriage is constituted as at Wagawaga, with reciprocal food
    presents, and the boy's father also gives an armshell or bagi to the girl's mother;
    the girl's father later returns a similar or equivalent gift to the boy's mother.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Bartle Bay account, marriage occurs within the community and intermarriage
    among named neighboring communities is described as common.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Bartle Bay account, the bridegroom's father gives pearl shells or other
    valuables and later food to the bride's people; the bride's father then gives
    a return present and equivalent food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Bartle Bay account, food supplied by the bridegroom's family is eaten
    by the girl's parents and family, not by the young couple.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Wedau and Wamira, the boy brings the bride to his father's house after
    making a garden whose produce is ready for use when the marriage takes place.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: At Wedau and Wamira, the married couple is expected to assist the father-in-law
    with garden making without compensation, described in the passage as a sort of
    payment for the wife.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: At Gelaria, the wife generally goes first to the husband's hamlet, then the
    couple goes to the wife's home, with cultivation begun in each place; this alternating
    routine may continue for years and decreases after the bride's parents die.
  category: sequence
  evidence_refs:
  - ev:12
