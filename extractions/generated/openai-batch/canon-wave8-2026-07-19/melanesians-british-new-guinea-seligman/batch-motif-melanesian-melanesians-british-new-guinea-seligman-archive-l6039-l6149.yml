canonical_text:
  quote: ''
  summary: 'The passage describes pre-voyage Hiri procedures: a leading man resolves
    to organize a lakatoi voyage, abstains from cohabitation, recruits a doritauna,
    forms commands through a smoking gathering, prepares the vessel, observes helaga
    restrictions, selects udiha attendants, and follows special rules for boarding,
    food handling, and taboo foods and drinks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the early S.E. season, a leading man secretly resolves to organize the
    equipment of a lakatoi for a westward voyage, tells his wife, and ceases cohabitation;
    he is called the baditauna.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baditauna recruits another man as doritauna, and the doritauna also ceases
    cohabitation; the two are described as the man at the root and the man at the
    top.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: On a pre-arranged day the baditauna sits before his house, a small boy gives
    him a bamboo pipe, tobacco, and a rolling leaf, and the baditauna and doritauna
    smoke together.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mast-captains, sail-captains, and crews gather and allot themselves into two
    commands, one associated with the baditauna and one with the doritauna.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Around August, the baditauna and doritauna call on the crew to begin demademay,
    the overhauling and caulking of the large dugouts called asi that compose the
    lakatoi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The baditauna and doritauna become especially helaga; husbands and wives keep
    apart, avoid direct dealings, and the men refrain from washing and combing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: After demademay, lailai consists of floating the caulked asi, lashing them
    together, and constructing the platform or deck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each leader chooses an udiha, generally a son or raimu and preferably a boy
    before puberty; the udiha becomes helaga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The udiha is carried by four men to a canoe and paddled to the lakatoi with
    care that his feet do not touch salt water; he carries a new mat and the master’s
    vaina and wears a new sihi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The baditauna, doritauna, and their udika sleep aboard the lakatoi; food is
    cooked by wives or sisters-in-law, carried by a boy, handled with a bone fork
    rather than fingers, and eaten first by the udiha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Certain named foods are taboo to the men and boys, and the udiha may drink
    only coconut milk rather than water.
  category: attribute
  evidence_refs:
  - ev:6
