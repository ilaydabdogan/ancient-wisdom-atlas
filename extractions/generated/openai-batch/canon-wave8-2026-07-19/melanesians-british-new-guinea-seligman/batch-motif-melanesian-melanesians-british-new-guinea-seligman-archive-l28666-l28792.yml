canonical_text:
  quote: ''
  summary: 'The passage describes Tubetube adolescent practices: areca chewing, blackening
    teeth, status terms for boys and girls, tattooing before and after puberty, the
    absence of formal initiation ceremonies, and menstruation restrictions. It also
    includes a Rogea story presented as an origin account for girls'' tattooing, in
    which a cave-dwelling woman man-eater tattoos a girl, the girl escapes, and the
    sorceress is killed by swallowing a heated stone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before puberty, boys begin chewing areca nut, and youths and young adults
    of both sexes may blacken their teeth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The teeth-blackening substance is prepared from badira leaves, fragments of
    tari, and water, made into a paste and applied overnight to the front teeth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The usual stated reason for blackening the teeth is ornament, personal adornment,
    and attraction of the opposite sex.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage lists named status stages for boys and girls before and after
    puberty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Older Tubetube practice is described as not tattooing males except for sickness,
    while women were tattooed profusely for appearance and to accentuate good skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A girl's face was tattooed before puberty, usually after nose piercing, and
    further tattooing of the chest, belly, flanks, arms, and hands followed after
    the first catamenia ceased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explicitly states that there are no initiation ceremonies for
    boys or girls, though boys begin to sleep away from home around puberty and girls'
    tattooing proceeds at puberty.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Rogea story, a warned girl wanders, is called by a woman man-eater
    or sorceress, enters a cave through a door that opens on command, and is tattooed
    from face to feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sorceress in the Rogea story boils and eats blood associated with the
    tattooing and intends later to eat the girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The girl escapes by commanding the cave door to open and returns to her parents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The girl's father heats a stone, tricks the sorceress into opening her mouth,
    and kills her when she swallows the hot stone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The story concludes that girls' tattooing was afterwards imitated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: At first and later menstruation no special ceremonial is observed; a girl
    or woman may work in gardens but may not fetch water or cook for others.
  category: action
  evidence_refs:
  - ev:6
