canonical_text:
  quote: ''
  summary: Ethnographic passage describing Motu beliefs about Koita sorcery and healing,
    including charm treatment, incantation, extraction of objects from a patient,
    expected spirit entry into the sorceress, named spirits invoked in a translated
    incantation, ritual restrictions, house blessing, and commands for the patient's
    spirit or life to return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a full account of esoteric Koita sorcery may no longer
    be obtainable, and that Motu people believed Koita could exorcise certain malevolent
    agencies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In sickness, a Motu person would commonly send for a Koita man or, more often,
    woman to treat the illness with charms for a substantial fee.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one 1898 example, a reputed female sorcerer was paid yams, a fishing net,
    and money, and passed a charm three times around the patient's head and body while
    muttering incantations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Romilly's described treatment of a child, the sorceress arrived wearing
    local dress and a small bag of charms, and the village became silent when she
    began to vocalize.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child-treatment account includes incantation, passes over the child, apparent
    sleep, and the production of a barbed spear point, a large stone, and blood-like
    material from the child's body.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The narrator reports that in a bona fide performance the spirit should enter
    the sorceress, people would leave the house, and the sorceress would roll from
    the house into salt water, after which the spirit would depart; this portion was
    not actually witnessed in the described event.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The incantation is reported as being in an almost or quite obsolete Koitapuan
    dialect and was translated through Motu into English.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The translated incantation names three spirits: Devase, Horumagi, and the
    female spirit Vaganamagi, who are said to get hold of the woman and insist that
    she speak.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The woman places her fingers in her ears and on her eyelids, forbids inland
    spirits and grass spirits, and speaks of opening herself or her stomach so that
    the prayer comes.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The rite makes the sick person sacred; the sorceress eats food from the house,
    avoids water for eight nights, drinks only coconuts, eats no fish, and is sacred
    at the end.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Devase is called to the house, answers with an instruction to swing the rami,
    and the sorceress repeats the swinging phrase several times.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sorceress descends to the road, blesses the house with her hands and presence,
    and blesses fishing, turtle-seeking, dugong-seeking, and other fishing activities.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sorceress and Devase ascend to the house; the spirit teaches the sorceress
    what to say over the sick person, including commands for the spirit to return
    and enter the person again.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The healing sequence ends with commands for sickness to go away and eyes to
    open, striking the floor with foot and hands, and the statement that the spirit
    of life returns and the sick person becomes better.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage's author cautions that Romilly's accounts of spirit invocation
    are vague and do not clearly distinguish what he saw from what he was told.
  category: other
  evidence_refs:
  - ev:12
