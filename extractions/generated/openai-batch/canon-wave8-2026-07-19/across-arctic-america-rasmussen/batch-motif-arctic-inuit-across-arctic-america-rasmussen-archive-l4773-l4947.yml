canonical_text:
  quote: ''
  summary: The narrator describes an unimpressive angakoq performance, asks Aua about
    the reason for taboos, and is shown storm, unsuccessful hunting, a cold household,
    and sickness as examples of why life is feared. Aua explains that taboos and customs
    are inherited rules for living amid feared elements, famine, illness, dead souls,
    and spirits. The passage then summarizes taboos around the propitiatory treatment
    of killed animals, especially the separation of land animals from sea animals
    and their distinct mothers.
  language: English
  quote_policy: summarized
