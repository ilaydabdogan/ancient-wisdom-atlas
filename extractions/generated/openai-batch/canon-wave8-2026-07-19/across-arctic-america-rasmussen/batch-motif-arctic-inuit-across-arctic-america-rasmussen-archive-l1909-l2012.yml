canonical_text:
  quote: ''
  summary: 'The passage describes Manilaq, an elderly respected fighter and storyteller
    who later kills himself, described as preferring the eternal hunting grounds to
    feebleness. The expedition then travels south and west, encountering ruins attributed
    to the Tunit: stone houses, store-chambers, tent rings, boat frames, meat cellars,
    and caribou-driving cairns. The narrator compares the ruins with Greenlandic Eskimo
    material culture. At Inugssivik, a guide reports that former villagers were exterminated
    in war with Repulse Bay tribes. The passage ends with rapid sledge travel toward
    Depot Island, compared visually to a seal’s head above the ice.'
  language: English
  quote_policy: summarized
