literal_observations:
- id: obs:1
  text: All living creatures are said to have souls, and the souls of animals killed
    for food or use are affected by how their bodies are treated after death and by
    how they are killed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many required and forbidden acts are connected with hunting, cooking, clothing
    manufacture, and similar daily activities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person's name is derived from someone deceased and is said to carry the
    deceased namesake's qualities.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each living human being is described as attended by namesake-spirits who protect
    the person if rites are followed and become hostile after transgression.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The caribou soul is said to dislike things connected with sea creatures, so
    sea-hunting implements are left behind in caribou hunting and caribou-hunting
    footwear is not used for seal or walrus hunting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Caribou carcasses are handled so that certain parts avoid direct contact with
    women's hands, and women in certain periods or conditions are forbidden to touch
    caribou meat or skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dogs must not gnaw caribou bones during the hunting season, and a piece of
    meat and tallow is placed under a stone near the kill as an offering to the caribou
    soul.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Walrus hunting has rules distinct from seal hunting, and salmon is classed
    as land meat that must not be eaten on the same day as seal or walrus meat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Igdlulik, taboo is described as especially strict because the Mother of
    the Sea is said to be near and easily offended; sea-animal meat must not be eaten
    the same day as caribou or be in the same hut with it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some sea-beasts, including whale, ribbon seal, and bear, must be propitiated
    after death; work in huts stops for a number of hours and carcass parts are hung
    with certain implements.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ordinary seal have rules before skinning, including restrictions on touching
    certain articles, women combing hair, and using seal sinews for sewing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Birth observances include amulets or hair arrangements, no assistance at the
    actual birth, a separate tent or hut, later residence apart for two months, and
    a year-long dietary restriction.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After death, nearest relatives attend the deceased for three days for a man
    and four for a woman, because the soul is supposed to remain in the body and the
    body must not be left alone.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The corpse is laid on the earth with stones at head, shoulders, and feet;
    in winter a snow shelter may be built, and miniature implements are placed beside
    the corpse for use on the other side.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: A person who wishes to hang themselves is required to do so alone in the house
    by certain methods and to leave the lamp burning so the body will be noticed when
    someone enters.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A woman who has lost a near relative is treated as unclean for a year and
    has work and speech restrictions; a man who has lost his wife may not drive or
    strike his own dogs for a year.
  category: action
  evidence_refs:
  - ev:12
