  quote: ''
  summary: The passage describes Inuit rules concerning animal souls, namesake spirits,
    hunting taboos, separation of caribou and sea-animal substances, propitiation
    of slain animals, birth and death observances, suicide procedure, and mourning
    restrictions.
  language: English
