  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Aivilik account says the Tunit moved northward when the Aivilik settled
    on the coast, with a party remaining on Southampton Island; the Sadlermiut are
    named as the last descendants in the country and said to have died out in 1903.
  category: sequence
