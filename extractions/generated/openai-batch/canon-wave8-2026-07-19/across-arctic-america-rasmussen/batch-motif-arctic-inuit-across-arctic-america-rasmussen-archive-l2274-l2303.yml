  summary: The narrator’s party receives favorable news about night travel overland
    and the northward movement of caribou. They seek contact with inland groups by
    following the Great Kazan River, identify the Harvaqtormiut and Padlermiut as
    possible inland communities, note that families follow the moving caribou, and
    decide to bypass the Qaernermiut near Baker Lake because of long contact with
    whalers.
