canonical_text:
  quote: ''
  summary: The passage introduces Anarulunguaq as a Greenlandic woman who accompanied
    the expedition, then narrates a meeting with two local Inuit men, a move through
    a blizzard to their snow huts, and the narrator’s exchange of lore and magic songs
    with Orpingalik, an angakoq. It summarizes several hunting-related invocations
    or prayers, comments on the performative delivery of spells, and describes Orpingalik’s
    own poetic singing and family songs.
  language: English
  quote_policy: summarized
