canonical_text:
  quote: ''
  summary: The narrator encounters the old woman Takornaoq fishing through lake ice.
    A puppy barks, the narrator's dogs pursue her, and the narrator lifts her onto
    a sledge, after which she recognizes him as friendly. He discovers an infant hidden
    inside her clothing on her back. They travel to her small village of three snow
    huts and are introduced to Inernerunassuaq, an old angakoq or wizard with a magic
    belt, his wife and children, and the married pair Talerortalik and Uvtukitsoq.
  language: English
  quote_policy: summarized
