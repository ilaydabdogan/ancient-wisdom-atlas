canonical_text:
  quote: ''
  summary: The narrator prepares to leave Nome at the end of the expedition and describes
    a final meeting with Najagneq, an angakoq from Nunivak Island. The passage recounts
    Najagneq’s imprisonment, reputation as a wizard, claimed helping spirits in the
    form of white horses, ability to endure solitary darkness, and a brief conversation
    about human composition, inherited name, and yutir, the soul or mysterious life-giving
    power. The chapter opens with an aphorism attributed to Igljgarjuk that true wisdom
    is found in solitude and attained through suffering and privation.
  language: English
  quote_policy: summarized
