canonical_text:
  quote: ''
  summary: The narrator and Bosun are hosted by Takornaoq in her hut. She makes a
    joking or formal statement that she is now married to both guests while her husband
    is away, shows an infant named Qasitsoq after a mountain spirit, explains the
    child is one of twins bought from Nagsuk, sings a welcome song, observes a rule
    separating infant-mothers' cooking utensils, and gives a caribou carcass for the
    visitors' dogs. She also recounts former husband Quivapik's wizardly endurance
    and fishing magic, and begins a grim story about a woman who ate her own kin and
    spoke as one no longer able to live among humans.
  language: English
  quote_policy: summarized
