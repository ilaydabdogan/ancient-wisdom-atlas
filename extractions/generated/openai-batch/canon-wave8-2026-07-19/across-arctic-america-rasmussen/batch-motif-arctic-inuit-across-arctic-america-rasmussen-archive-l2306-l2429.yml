  quote: ''
  summary: The narrator describes travel across the snow-covered Barren Grounds, reports
    extreme scarcity and starvation during a severe winter, explains the inland Caribou
    Eskimo context, and recounts approaching a Harvaqtomitit settlement where a conventional
    greeting, meaning that the speaker comes from the friendly side, resolves the
    inhabitants' alarm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party travels through flat, desolate, snow-covered country where landmarks
    and rivers are difficult to distinguish.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snowy landscape is compared to Greenland inland ice, with isolated rock
    masses resembling nunataks.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator reports that in a recent severe season, natives were starving,
    caribou had disappeared, salmon had left rivers and lakes, and hunting did not
    provide enough food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The terrain is described geologically as worn-down mountain country shaped
    by glacial action, moraine, boulders, and occasional remaining peaks.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The expedition passes a first settlement of the Harvaqtomitit, identified
    as the People of the Eddies, and the narrator applies the broader term Caribou
    Eskimos to inland tribes for whom caribou is central.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the party approaches a village by a small lake, villagers run in confusion,
    women and children disappear, and two men remain outside seated back-to-back on
    a block of snow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two men appear uncertain whether the approaching party is friendly and
    may suspect them of being Kitdlinermiut or Indians, groups described as enemies
    in this context.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'A special greeting used for encounters with inland Eskimos is reported: it
    means ''I come from the right side,'' glossed as the proper, friendly quarter.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the narrator shouts the conventional greeting, the two men run toward
    the party and the rest of the settlement comes out from the huts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The settlement is named Tugdliuvartaliik, the Lake of Many Loons, and its
