  summary: The narrator visits a snow-hut household led by an old former angakoq who
    has converted to Roman Catholicism with his family. He says his helping spirits
    deserted him after he heard a priest, but baptism brought rest. Other tribe members
    call the converts Majulasut, glossed as people who crawl upward. The passage then
    continues with overland dog-sledge travel, an encounter with a Mounted Police
    constable, and a visit to an icebound vessel and nearby Netsilik settlement.
  language: English
