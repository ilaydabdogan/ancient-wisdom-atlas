canonical_text:
  quote: ''
  summary: The passage lists several Inuit tale themes, then gives Aua's account of
    the origin, initiation, experiences, and duties of angakoqs. It describes a first
    descent to the Mother of the Sea during famine, shamanic initiation through gifts,
    confession, soul-extraction, helping spirits, solitude, and the angakoq's role
    in healing, protecting souls, interceding for game, and enforcing tabu confession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In an early-time account, darkness existed; the fox wanted darkness for stealing,
    while the raven wanted light because it could not find food, and light came.
  category: sequence
  evidence_refs:
  - ev:1
