  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 4675-4677
  quote_or_summary: A man disturbed in hunting by children shuts them in a mountain,
    where they starve.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 4679-4684
  quote_or_summary: The narrator says many folklore themes are widespread, and these
    stories may show close detail resemblance and identical dialogue.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 4686-4691
  quote_or_summary: Aua is described as a wizard and authority on folklore, customs,
    supernatural matters, and tabu observances, and his account of his profession's
    origin is introduced.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 4693-4699
  quote_or_summary: Before wizards existed, famine at Igdlulik killed many; an assembled
    man declared he would go down to the Mother of the Sea.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 4705-4710
  quote_or_summary: The man hid behind skins for the good of all; when the skins were
    pulled aside he was nearly gone, with only his soles above ground.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 4710-4717
  quote_or_summary: Some say spirits visited him in solitude; he went to the Mother
    of the Sea and brought back goodwill and game, ending famine and restoring abundance.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 4717-4721
  quote_or_summary: Since then, angakoqs learned hidden things, aided others, and
    had sacred speech not used for common matters.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 4723-4728
  quote_or_summary: A prospective angakoq gives possessions to his instructor; at
    Igdlulik, a tent pole with a gull's wing attached signifies the wish to learn
    to fly.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 4728-4734
  quote_or_summary: The novice confesses tabu breaches and undergoes extraction of
    the soul from eyes, heart, and vitals so it may contact future helping spirits.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 4734-4736
  quote_or_summary: Final initiation occurs far from human dwellings; only in great
    solitude can spirits be approached.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 4737-4744
  quote_or_summary: Novices must start young; some are entered before birth, including
    Aua, whose mother declared the unborn child would be different; his birth involved
    remarkable features, rites, and discipline.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 4744-4752
  quote_or_summary: Aua says ordinary instruction failed; later, without knowing how,
    he felt a change, intense light, inexpressible joy, and burst into song.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: 4754-4756
  quote_or_summary: Aua says that as a Christian he sent away all his helping spirits
    to his sister in Baffin Land.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: 4758-4759
  quote_or_summary: Spirits sometimes seize a man and invest him with supernatural
    powers in a painful process with terrifying phenomena.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: 4761-4765
  quote_or_summary: An angakoq heals the sick, protects souls from hostile wizards,
    intercedes with the Mother of the Sea when seals are scarce, and ensures customs
    are observed.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: 4766-4770
  quote_or_summary: Infantile disease and famine may be attributed to tabu breach,
    and the angakoq must find and persuade the culprit to confess.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
