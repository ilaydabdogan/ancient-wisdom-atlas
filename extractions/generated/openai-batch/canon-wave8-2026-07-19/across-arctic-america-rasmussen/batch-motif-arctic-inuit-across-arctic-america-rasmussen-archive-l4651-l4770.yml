  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Aua's account says that before wizards existed, famine at Igdlulik caused
    many deaths, and a man declared he would go down to the Mother of the Sea.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man hid behind skins and was seen almost gone into the ground, with only
    the soles of his feet still visible.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The man went down to the Mother of the Sea and returned with her goodwill
    and a grant of game, ending dearth and restoring abundance.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Since that event, angakoqs are said to have learned hidden things, helped
    others, and possessed sacred speech not used for common matters.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: A young man wishing to become an angakoq had to give possessions to his instructor;
    at Igdlulik this commonly included a tent pole with a gull's wing attached as
    a sign that he wished to learn to fly.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The novice had to confess any breach of tabu and undergo extraction of the
    soul from his eyes, heart, and vitals so that it could contact future helping
    spirits.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The final initiation took place far from human dwellings, in great solitude,
    where spirits could be approached.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:17
  text: Some novices were entered into the profession before birth; Aua was one of
