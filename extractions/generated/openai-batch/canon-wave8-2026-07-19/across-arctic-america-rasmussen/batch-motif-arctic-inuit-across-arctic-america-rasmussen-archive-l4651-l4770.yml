- id: obs:3
  text: A fatherless boy, mistreated by others, was aided by a spirit identified parenthetically
    as the moon, became strong, returned, and took vengeance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Igimarajugjuk is described as one who ate his wives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A soul is described as living in the bodies of all beasts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sun and moon are described as brother and sister who loved each other; the
    sister fled ashamed at night, the brother pursued, and their torches explain the
    moon's fainter glow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A hunter disturbed by children at play shut them in a mountain, where they
