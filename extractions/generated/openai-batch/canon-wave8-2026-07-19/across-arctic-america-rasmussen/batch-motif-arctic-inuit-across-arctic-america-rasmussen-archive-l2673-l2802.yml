canonical_text:
  quote: the trees in a forest are living beings, only that they cannot speak
  summary: A sledge party arrives with a respected elderly woman known for tabu and
    wisdom. The narrator seeks religious and folklore knowledge from Igjugarjuk, who
    denies being an angakoq. Igjugarjuk later guides the narrator through the country,
    describes the great lake Hikoligjuaq, maps settlements, and comments on population
    loss and changed caribou routes after firearms. The passage describes spring thaw,
    abandoned caribou-drive structures, declining kayak hunting, and a belief that
    forest trees are living beings whose night sounds are beyond human understanding.
  language: English
  quote_policy: quoted
