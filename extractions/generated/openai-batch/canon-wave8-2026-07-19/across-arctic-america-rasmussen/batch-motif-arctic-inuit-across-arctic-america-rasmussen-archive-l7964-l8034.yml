canonical_text:
  quote: ''
  summary: The narrator visits a Tchukchi yarrang, observes its construction and domestic
    work inside, and asks an old man about relations between Tchukchis and East Cape
    Eskimos. The old man asserts that the Tchukchis are original inhabitants and not
    connected with Eskimos, then tells a story of a scolded little girl who runs away
    with her dolls to an unknown land; one night the dolls come alive as men and women,
    and the Tchukchis are said to descend from them.
  language: English
  quote_policy: summarized
literal_observations:
