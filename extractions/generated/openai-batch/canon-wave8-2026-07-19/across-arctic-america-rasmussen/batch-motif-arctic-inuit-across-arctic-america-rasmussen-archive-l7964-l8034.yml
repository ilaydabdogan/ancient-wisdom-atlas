  text: Peter Cossigan leads the narrator into a large yarrang described as half hut
    and half tent, with a dome-shaped wooden framework covered in walrus hide.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The front room contains a fireplace in the middle of the floor where walrus
    meat is cooking, and a woman is kneeling by the fire tending her pot.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the yarrang is a small reindeer-skin tent fastened to the wooden framework;
    the narrator crawls under its sides to enter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young woman in the inner apartment is preparing sealskin; the space has
    two blubber lamps and a wood floor covered with walrus hide, and serves as workroom
    by day and family bedroom by night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator is told that women are generally found in the houses during the
