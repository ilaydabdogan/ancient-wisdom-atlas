canonical_text:
  quote: ''
  summary: Ethnographic passage describing King Islanders’ retained festivals and
    old dance houses; southern and western Yukon/Nunivak-area ceremonial practices
    involving masks, animal-human transformation beliefs, augakoq invocation of helping
    spirits, birth and death feasts with costly gifts, and kayak construction/consecration
    rites involving isolation, fasting, taboo, new clothes, and a lamp flame used
    to drive away evil spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Islanders are described as living on a barren rock in the Bering Strait
    and retaining ancient festivals, stories, and songs despite conversion to Roman
    Catholicism.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The King Island village contains old dance houses; one visited by the narrator
    contained tambourines and staring masks and was likened to a spirit temple.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author describes Nunivak and nearby southern/western Yukon coastal peoples
    as relatively isolated from wider Alaskan development and as preserving customs
    and ceremonies of interest to the expedition.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says these communities make notable use of masks, with a spirit
    element more developed than that observed under Point Hope.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A belief is reported in only a slight distinction between animals and humans
    and in animals’ power to take human form.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Many masks are said to represent seals, birds, or beasts of prey with human
    faces.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each mask type is credited with a particular power and is said to assist the
    augakoq in invoking helping spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Helping spirits are described as mediators between life and the supernatural.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the birth of a child, the parents give a great feast, and the mother gives
    gifts to old men and women according to her wealth and position.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A husband is expected to store costly furs, garments, weapons, and implements
    for distribution at the birth feast; the birth of a child is described as such
    a blessing that a man may give away all he possesses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Feasts for the dead are held to prepare the way for them and keep them happy
    in the world beyond; the ceremonies last a week and include rites and costly gifts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The kayak is built with ceremony and special rites intended to ensure safety
    and good hunting; it is generally renewed each year because old gear is considered
    unpropitious for a new hunting season.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: While building a kayak, the man remains isolated in the dance house, works
    fasting until evening, and observes taboo forms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the kayak is finished, it is consecrated on a calm fine day at dawn,
    with the family in new clothes and the new implements arranged on the kayak.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: During the kayak consecration, the man walks in front holding a lighted lamp
    while all step around the kayak; the stated idea is that the flame scares away
    evil spirits.
  category: action
  evidence_refs:
  - ev:9
