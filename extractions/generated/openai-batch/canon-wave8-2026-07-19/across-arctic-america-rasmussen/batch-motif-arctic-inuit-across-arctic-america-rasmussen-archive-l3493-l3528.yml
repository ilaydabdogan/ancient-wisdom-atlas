canonical_text:
  quote: they went up into the sky and became thunder and lightning.
  summary: 'A tale explains thunder and lightning: during a song festival, two children
    left alone take a caribou skin and a firestone, become afraid of people, reject
    animal transformations as unsafe, go up into the sky, and become thunder and lightning.
    Thunder is explained as one child rattling the dry skin, and lightning as the
    other striking sparks from the stone. The tale is credited to Arnarqik and noted
    as also known in Greenland.'
  language: English
