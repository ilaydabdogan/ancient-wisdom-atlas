  quote: ''
  summary: A song attributed to Avane voices an impatient search for caribou in the
    hills, anxiety over age and failed hunting, and a memory of formerly striking
    down horned bulls with an arrow. A prose note then states that women generally
    do not sing their own songs unless invited by an angakoq; if a spirit impels a
    woman, she may step out from the chorus and sing from her own inspiration. Two
    women are named as having been favored by the spirits.
