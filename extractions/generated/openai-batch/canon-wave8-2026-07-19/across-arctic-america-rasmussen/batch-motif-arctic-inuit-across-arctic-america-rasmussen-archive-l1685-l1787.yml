  quote: ''
  summary: The narrator describes a southward expedition toward the Barren Grounds,
    a blizzard delay near Captain Cleveland’s place, and a detailed practical account
    of Inuit ice-shoeing for sledge runners. The passage explains earlier runner materials,
    the use of peat paste and water to form an ice coating, a flour-dough substitute
    used during the blizzard, and the later feeding of the scraped-off dough to the
    dogs. An inserted caption describes a girl from Repulse Bay wearing a large fur
    hood.
