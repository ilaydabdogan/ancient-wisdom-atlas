canonical_text:
  quote: ''
  summary: The passage presents Najagaeq explaining amulets, angakoq knowledge, and
    Sila, a great spirit or power supporting the world, weather, and life. Sila communicates
    through feared natural forces and through gentle signs such as sunlight, calm
    sea, and children’s warnings, while remaining unseen and mysteriously both near
    and distant. The narrator then reflects on Inuit religion, angakoq wisdom across
    the expedition, and the impending effects of white colonial presence. In New York,
    Anarulunguaq views the skyscraper city as a human-made stone landscape where people
    seem to master animal powers, concluding that nature is great but human beings
    are greater still.
  language: English
