canonical_text:
  quote: ''
  summary: The passage contains two oral narratives. In the first, a mourning snow
    bunting rejects an owl’s marriage proposal, and the owl attacks and mocks her.
    In the second, a maiden who refuses suitors is left on an island with a dog, bears
    dog offspring, sends them to drown her father in vengeance, and later magically
    sends two groups away on kamik soles that become vessels; one group becomes white
    men and the other becomes the ItqigdKt/Indians hostile to Inuit until white men
    teach them gentler ways.
  language: English
  quote_policy: summarized
