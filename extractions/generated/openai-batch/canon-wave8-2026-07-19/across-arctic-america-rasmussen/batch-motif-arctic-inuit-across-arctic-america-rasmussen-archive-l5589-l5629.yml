canonical_text:
  quote: ''
  summary: 'The passage describes a sequence of contests and games: two men challenge
    each other, meet with knives and exchange embraces and kisses; women divide into
    two sides for a singing and gull-wing-waving endurance game; the losing side is
    encircled and men try to kiss them; later contests include archery, ball games,
    fist fighting, and an all-night song festival, followed by an introduction to
    songs attributed to Aua.'
  language: English
  quote_policy: summarized
