  summary: The narrator describes Igjugarjuk as an authoritative chief and wizard,
    records the visitors' reception in his camp, notes abundant caribou after recent
    famine, observes trade goods and Indian-pattern tents alongside Eskimo language
    continuity, and recounts food taboos and feast customs involving walrus meat,
    caribou heads, sacred muzzle meat, and raw caribou-fly larvae.
