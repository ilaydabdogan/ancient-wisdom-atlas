canonical_text:
  quote: ''
  summary: The narrator contrasts winter and summer conditions among Inuit at Chesterfield
    Inlet, noting winter adaptation through caribou-skin clothing and snow houses,
    later replacement by imported clothing, canvas tents, and mechanical goods. Inland
    people near the sea avoid seal and walrus hunting despite abundance, because their
    caribou-centered culture holds that sea and land hunting should not be mixed.
    The party then travels back toward Danish Island, hiring John Ell, a skilled boatman,
    property-holder, correspondent, and angakoq, before rejoining companions after
    delays caused by ice.
  language: English
  quote_policy: summarized
