canonical_text:
  quote: ''
  summary: Orulo recounts being passed among households after her mother's remarriages,
    later being taken by Aua and living happily with children. Asked about her worst
    memory, she describes famine after her eldest son's birth, failed hunting, wolverines
    plundering meat depots, and Atta's long seal-hunting efforts in winter. Asked
    about her happiest memory, she describes returning to Baffin Land after marriage
    as an honored guest during feasts and a song-contest gathering, then explains
    the Tivajuk or Great Rejoicing, a communal masked dance and wife-changing game
    held in a snow dance hut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orulo says her mother remarried more than once, and after one husband went
    to Pond's Inlet she was left with another household and then passed on because
    there were too many mouths to feed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aua came and took Orulo away; Orulo says she was happy afterward and had seven
    children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Orulo identifies a famine after her eldest son's birth as the worst thing
    that happened to her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the famine, hunting failed and wolverines plundered caribou-meat depots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Atta spent the two coldest months of winter hunting seal by breathing holes,
    sleeping only at odd moments in shelters on the ice, and obtained only two seals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Orulo describes the sight of Atta suffering from cold and hunger and the child
    growing weaker as terrible.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Orulo identifies her first return to Baffin Land after marriage as her happiest
    memory.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the Baffin Land gathering, Orulo says her husband came to challenge a man
    to a song contest and that there were great feasts and gatherings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tivajuk or Great Rejoicing is described as a festival involving a game
    of changing wives.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tivajuk dance hut is a large snow hut built empty for dancing, with two
    snow blocks in the middle of the floor.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: One snow block is about half a man's height and is called the jumping block;
    the other is a man's height and is called the lamp block.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two men called the Servants of Joy wear masks; one is dressed like a man and
    the other like a woman, with deliberately tight clothing meant to look funny.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The masked dancers leap into the hut, jump over the jumping block, and chase
    the men out, leaving only women in the hut.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The maskers are supposed to be dumb, communicating by signs, large gestures,
    and forceful gasps.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A man outside whispers to the two maskers the name of the woman he wants;
    the maskers touch that woman under the sole of the foot and lead her out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The chosen woman is returned with the man who asked for her, and women are
    not allowed to know who wanted them until they get outside.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The returning pair must look solemn and must not laugh; the passage states
    that laughing would mean a short life.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The assembled people call out repeated syllables while the man leads the chosen
    woman twice around the lamp block and the group sings a mask song.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:19
  text: During the song, the two maskers embrace each other comically to make the
    others laugh.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: The Tivajuk game continues until every man has chosen a woman, after which
    they go home.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: Another festival named Qulungertut is mentioned, but the supplied passage
    ends before its description is given.
  category: other
  evidence_refs:
  - ev:12
