canonical_text:
  quote: ''
  summary: The narrator describes preparations for travel to Baker Lake and Chesterfield,
    a difficult seasonal journey over wet tundra, swollen streams, ice, and water.
    A canoe carrying essential equipment is nearly lost and recovered after a dangerous
    chase through water and loose ice. The party meets hungry Inuit households, shares
    caribou meat with them, hears a gramophone, and later faces further travel obstacles
    including crushed kayaks, ice floes, signal fires, and delayed arrival at Chesterfield.
  language: English
  quote_policy: summarized
