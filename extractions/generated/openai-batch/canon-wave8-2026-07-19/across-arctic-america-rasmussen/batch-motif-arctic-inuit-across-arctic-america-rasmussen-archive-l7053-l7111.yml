canonical_text:
  quote: ''
  summary: A native account explains King Island through a hunter’s pursuit of a giant
    fish whose struggles form waters and a bay, and whose body becomes the island
    after turning to stone. A second account says a scolded girl from the Qavjasamiut
    ran away onto an ice floe, was carried to King Island, survived by magic, and
    became the first human there before later settlers arrived. The passage then describes
    the island’s steep, cold, windy conditions and houses built on supports and secured
    to the rock.
  language: English
