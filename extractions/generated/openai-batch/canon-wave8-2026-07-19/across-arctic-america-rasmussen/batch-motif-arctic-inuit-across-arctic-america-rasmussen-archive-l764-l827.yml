canonical_text:
  quote: ''
  summary: The expedition receives regional information from Captain Cleveland, attends
    a dance celebrating the visitors, and later visits huts seeking place-name and
    settlement information. An elder, later named Ivaluartjuk, draws a coastline map
    and supplies Inuit place names. Rasmussen notes similarities between local place
    names and Greenlandic names, and finds that Greenland folktales he tells are already
    known locally as the people’s own legends. The party then departs, with Freuchen
    heading toward Wager Bay and the narrator and Bosun returning toward winter quarters.
  language: English
