canonical_text:
  quote: ''
  summary: The narrator is led through a large interconnected snow-house household
    governed by Aua. After a decision to move for walrus hunting, the narrator witnesses
    Aua perform a luck-bringing first-journey rite over Kuvdlo's newborn. Later, at
    the ice edge during a walrus vigil, Aua states that ancestral belief allowed humans
    to be animals temporarily and recounts a bear hunting walrus like a human hunter.
  language: English
  quote_policy: summarized
