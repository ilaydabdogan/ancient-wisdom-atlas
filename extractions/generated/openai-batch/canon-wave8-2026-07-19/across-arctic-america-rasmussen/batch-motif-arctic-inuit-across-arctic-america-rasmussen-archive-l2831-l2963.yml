- id: obs:3
  text: The men were described as idle at the time, which gave the visitors more opportunities
    to collect information about everyday life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inland people were described as largely independent of the sea; many men
    had never seen it, and sea meat was strictly taboo.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old men said their forefathers had always lived inland, with livelihood based
    on caribou, salmon, and birds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
