canonical_text:
  quote: ''
  summary: 'The narrator recalls deaths and omens among family members: an afterlife
    statement, a brother’s illness after a hidden encounter with evil trolls, a walrus
    bone sounding before news of another son’s death, a dream explaining that caribou
    were angry over a mourning taboo, a failed magical cure after eating forbidden
    blubber, and a spider descending from the sky before news of drowned men.'
  language: English
  quote_policy: summarized
