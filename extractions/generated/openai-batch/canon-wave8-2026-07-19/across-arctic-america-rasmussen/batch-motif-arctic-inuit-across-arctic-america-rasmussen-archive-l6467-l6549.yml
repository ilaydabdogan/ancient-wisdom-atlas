canonical_text:
  quote: ''
  summary: An Inuit recollection reports Mangak, Terqatsaq, and Qavdlut meeting three
    distressed white men on the shore of King William's Land, trading seal meat and
    blubber for a knife, communicating by signs about an abandoned ship and a planned
    southward return, and then never seeing them again. The narrator comments on named-witness
    memory and agreement with expedition reports, then describes target shooting with
    bow and arrow and a later visit from Uvdloriasugsuk concerning his appointed killing
    of his dangerous brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mangak, Terqatsaq, and Qavdlut were seal hunting on the west coast of King
    William's Land when they heard shouts and saw three white men on the shore beckoning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The encounter occurred in spring, when open water along the shore prevented
    the hunters from reaching the men until low water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The white men are described as very thin, ill-looking, dressed in white men's
    clothes, without dogs, and pulling their sledges themselves.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The white men bought seal meat and blubber with a knife, boiled and ate the
    food, stayed overnight at Mangak's tent, and returned the next day to a small
    white non-skin tent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the parties could not understand each other's speech, they communicated
    by signs about the strangers having once been many, now being few, leaving their
    ship on the ice, and intending to return south overland.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After this meeting, no more was seen of the white men, and their fate was
    not known to the people in the account.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Iggiararjuk is said to list names of people present in the camp, while the
    narrator states that such casual encounters were remembered over many years and
    accorded with official expedition reports.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: During sports, people shot arrows at life-size snow figures; the narrator
    notes long-distance force, uncertain accuracy at 100 metres, and better accuracy
    at 20 to 30 metres.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that most men possessed firearms but that a previous musk
    ox hunt near Lake Simpson had been carried out exclusively with bow and arrow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Uvdloriasugsuk came to the narrator about having shot his brother, who was
    described as violent; villagers had decided the brother must be killed and appointed
    Uvdloriasugsuk as executioner.
  category: relationship
  evidence_refs:
  - ev:6
