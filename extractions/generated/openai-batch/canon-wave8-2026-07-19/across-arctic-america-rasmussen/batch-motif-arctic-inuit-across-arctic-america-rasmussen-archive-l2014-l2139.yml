canonical_text:
  quote: ''
  summary: The expedition follows fresh sledge tracks to a Netsilik household of snow
    huts, encounters an unexpectedly dark-skinned girl whose father is explained as
    a cook from an American whaler, receives generous food and assistance from the
    household, records folklore and legends from Inugpasugssuk, and later departs
    toward Chesterfield before a sudden blizzard separates the traveling parties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers follow fresh sledge tracks down to the coast and arrive at a
    cluster of snow huts half buried in loose snow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Miteq shouts into the window of the dwelling, causing the inmates to come
    out, and a black girl emerges first.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator and Miteq are surprised by the girl’s appearance, and the girl
    is also astonished by the travelers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl retreats into the hut and then returns with three older women.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The oldest woman says the husbands are away hunting and identifies the dark
    young woman as her daughter by a stranger from a land where it was always summer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stranger is said to have come on a great ship and spent the winter in
    the local huts; the narrator explains him as a cook on an American whaler.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The dwelling consists of three large huts built together, with store-chambers
    for different kinds of meat.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hosts invite the travelers to take meat for their dogs and set three pots
    to boil for the visitors’ meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Inugpasugssuk returns, is identified as Netsilik, and becomes a valued friend
    and informant for the narrator.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Over eight days, the narrator goes through folklore and legends with Inugpasugssuk,
    and they agree that he should go to Chesterfield so the stories can be written
    down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The household provides food for the expedition party of five men and twenty
    dogs throughout the stay.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Araaraltik makes spring jackets, Miteq hunts walrus with local men, and two
    local sledges help carry meat when the travelers depart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A sudden blizzard overtakes the travelers after departure, causing the parties
    to lose sight of one another and camp separately until morning.
  category: sequence
