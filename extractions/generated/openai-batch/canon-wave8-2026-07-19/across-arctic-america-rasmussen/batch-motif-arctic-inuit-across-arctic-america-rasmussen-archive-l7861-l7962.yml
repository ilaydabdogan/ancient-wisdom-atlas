canonical_text:
  quote: ''
  summary: The narrator is hosted briefly at the Governor's house, observes Soviet
    political symbols, and is ordered by the Chief of Police to leave Siberia the
    next day. During the limited remaining time, he speaks with impoverished Russian
    traders whose former savings are worthless and then summarizes Wahlen as a settlement
    of yarrangs inhabited by coastal people living from the sea. He notes that Tchukchis
    and East Cape Eskimos are described as maintaining pre-contact lifeways and as
    having had no outside spiritual influence.
  language: English
  quote_policy: summarized
