canonical_text:
  quote: ''
  summary: 'The narrator explains a wish to obey the local law, while an interlocutor
    protests that shops are empty and ammunition cannot be bought. The narrator recounts
    a recent story: an American trader, assured through an Eskimo on Diomede Island
    that Russian authorities allowed landing and trade at East Cape, crossed and began
    bartering, but was seized, accused of illicit trading, and had about $2000 confiscated
    from his vessel. The trader escaped with his ship. The Eskimo intermediary then
    crossed to complain that he had been used in a bad-faith plot, and was fined for
    insulting the authorities.'
  language: English
