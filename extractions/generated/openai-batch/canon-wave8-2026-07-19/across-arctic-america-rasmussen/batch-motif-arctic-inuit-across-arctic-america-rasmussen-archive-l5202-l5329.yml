canonical_text:
  quote: ''
  summary: 'The passage opens with a description of Orulo’s constant household work
    and neighborly generosity. Orulo then recounts early memories: her mother’s separation
    after childbirth, childhood scenes in Baffin Land, her father’s illness at a place
    called the Mountain, her sighting of figures later identified as evil trolls,
    her father’s interpretation of the sighting as a death warning, Sequsu’s secrecy
    about the sighting and later death, and the handling and directional placement
    of her father’s body after death according to age-based rules.'
  language: English
  quote_policy: summarized
