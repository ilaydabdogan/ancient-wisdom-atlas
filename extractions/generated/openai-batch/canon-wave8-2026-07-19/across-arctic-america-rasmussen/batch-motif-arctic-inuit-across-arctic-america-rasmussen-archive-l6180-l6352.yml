  summary: The passage opens with a song in which a mother reflects on shame, her
    child’s flight, news of killing, and her own lack of flawless wisdom. The narrative
    then describes the expedition’s departure from Orpingalik’s people, acquisition
    of cached meat, contact with Igsivalitaq the outlaw, his account of homicide,
    and the narrator’s counsel to him. It continues with descriptions of Arviligjuaq,
    the Arviligjuarmiut, their abundance of game, and local techniques for obtaining
    fire, stone, horn, soapstone, and other materials in a wood-scarce region.
  language: English
