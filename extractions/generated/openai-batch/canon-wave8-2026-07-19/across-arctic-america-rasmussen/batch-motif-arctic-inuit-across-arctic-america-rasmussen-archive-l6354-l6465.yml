canonical_text:
  quote: ''
  summary: 'The passage describes practical uses of tents, skins, sledges, food, and
    trade routes for wood and iron, then recounts Inuit memories of first contact
    with John Ross''s ship: a hunter sees the unfamiliar vessel, mistakes it for a
    great spirit, the men deliberate and approach armed, both sides lay down weapons,
    friendly contact follows, gifts and assistance are exchanged, and later materials
    from the ship are salvaged and repurposed.'
