canonical_text:
  quote: ''
  summary: The expedition wakes after a blizzard camp, realizes it had nearly reached
    Chesterfield the night before, arrives at the settlement, and is struck by houses,
    police barracks, a Roman Catholic church, and the sound of a church bell. The
    travellers receive hospitality from the Hudson's Bay Company station manager and
    the mission priests, hear difficult news from the Mounted Police, then leave in
    mild spring weather toward Baker Lake, where they meet Birket-Smith at a Hudson's
    Bay Company trading outpost.
  language: English
  quote_policy: summarized
