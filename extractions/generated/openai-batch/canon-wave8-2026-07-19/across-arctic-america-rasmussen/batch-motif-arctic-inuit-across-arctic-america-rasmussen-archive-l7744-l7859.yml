canonical_text:
  quote: ''
  summary: The narrator describes arriving at East Cape in Siberia, being taken by
    Peter Cossigan to the Government House, and negotiating with Soviet officials
    for permission to land and continue scientific work. Officials treat him courteously
    but focus on his lack of a passport from Moscow, in a context of political tension
    including the Wrangel Island dispute. The Governor ultimately appears constrained
    by instructions, then notices the narrator’s muddy condition and asks whether
    he is hungry.
  language: English
