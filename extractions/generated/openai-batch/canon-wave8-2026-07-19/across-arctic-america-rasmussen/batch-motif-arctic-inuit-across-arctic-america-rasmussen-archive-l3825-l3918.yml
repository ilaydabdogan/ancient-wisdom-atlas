canonical_text:
  quote: ''
  summary: The narrator's party meets inland caribou-hunting people, who regard the
    sea and the travelers' sea-crossing as marvelous. On the way to camp, the group
    finds the body of Atangagjuaq's wife, who had been lost in a blizzard after following
    her weakened husband when he went to seek aid during a famine winter. The body
    is left untouched. Soon afterward the party resumes merriment, and local men try
    the travelers' skis. The passage ends with the travelers reaching Lake Hikoligjuaq
    at sunrise.
  language: English
  quote_policy: summarized
