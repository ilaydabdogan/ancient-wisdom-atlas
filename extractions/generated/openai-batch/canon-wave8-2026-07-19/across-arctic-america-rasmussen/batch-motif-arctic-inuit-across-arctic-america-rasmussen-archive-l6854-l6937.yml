canonical_text:
  quote: ''
  summary: The narrator receives and trades for a collection of amulets from a young
    woman named Kuseq and then from many others. The passage lists animal parts and
    other small objects worn in clothing as amulets for childbirth, hunting, kayak
    skill, digestion, strength, agility, protection, needlework, and resilience. A
    local medicine man later asks for additional payment, saying the narrator must
    be powerful and that locks of his hair would be valuable amulets against later
    trouble with spirits; the narrator gives some hair and substitutes bits of clothing
    for others.
  language: English
  quote_policy: summarized
