canonical_text:
  quote: ''
  summary: The narrator approaches Emmatown because ice and lack of shelter prevent
    stopping at an Eskimo village. With the Danish flag flying, the party is met by
    local traders, an interpreter, and the frontier guard Allayeff, who requires them
    to go to the police station. After the narrator explains his lack of passport
    and request to stay among East Cape Eskimos, Allayeff says he cannot grant permission
    and will send him under escort to the Governor at Wahlen. The narrator is taken
    through a Tchukchi village to a twelve-dog sledge, his papers are given to a Tchukchi
    driver, and he travels across wet tundra while the driver urges the dogs with
    a nail-pointed harpoon and rattling rings. On the way he meets another Tchukchi
    traveler who asks whether the party has goods for trade.
  language: English
  quote_policy: summarized
