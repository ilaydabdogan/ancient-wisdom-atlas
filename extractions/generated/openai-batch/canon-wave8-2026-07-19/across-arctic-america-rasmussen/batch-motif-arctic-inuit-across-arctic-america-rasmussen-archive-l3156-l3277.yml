canonical_text:
  quote: "“All true wisdom is only to be learned far from the dwellings of men, out
    in the great solitudes; and is only to be attained through suffering.”"
  summary: The passage describes beliefs about souls, the moon, reincarnation into
    animal forms, Pinga’s oversight of animal souls and food taboos, Sila as a cosmic
    and moral power, the angakoq as mediator, healing rites requiring dispossession
    and removal from dwellings, and Igjugarjuk’s initiation through dreams, isolation,
    fasting, cold, instruction, and acquisition of a female helping spirit.
