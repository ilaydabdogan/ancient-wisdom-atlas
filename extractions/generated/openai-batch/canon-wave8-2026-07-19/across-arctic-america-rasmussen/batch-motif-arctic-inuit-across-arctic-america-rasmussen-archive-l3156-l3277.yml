- id: ev:8
  type: summary
  locator: 3221-3230
  quote_or_summary: Taboo rules are connected with Sila to maintain amicable relations;
    trespass is severely punished by bad weather, lack of game, sickness, and other
    feared conditions.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 3231-3241
  quote_or_summary: The angakoq is interpreter between Sila and mankind; Sila heals
    sickness and guards against ill will; for cure, a sick person gives away all possessions
    and is laid on earth far from dwellings with only breath remaining.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 3242-3251
  quote_or_summary: As a young man, Igjugarjuk was visited by dreams of unknown beings;
    his vivid visions showed others that he was destined to become an angakoq, and
    Perqanaoq was appointed his instructor.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 3252-3265
  quote_or_summary: In severe winter Igjugarjuk was carried far from home on a small
    sledge; his instructor built a tiny snow hut; he was carried inside without setting
    foot on snow, given no food or drink, and told to think only of the Great Spirit
    and the helping spirit that should appear.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 3266-3272
  quote_or_summary: After five days he received lukewarm water; after fifteen more
    days he received another drink and a small piece of meat to last ten further days,
    after which his instructor fetched him home.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 3272-3275
  quote_or_summary: Igjugarjuk said thirty days of cold and fasting made him sometimes
    die a little; near the end, after thinking only of the Great Spirit, a woman-shaped
    helping spirit appeared while he slept, hovering above him, and became his helping
    spirit.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 3275-3277
  quote_or_summary: For five months after the trial he kept strict diet and abstained
    from women; fasting was repeated, since repeated fasts are described as the best
