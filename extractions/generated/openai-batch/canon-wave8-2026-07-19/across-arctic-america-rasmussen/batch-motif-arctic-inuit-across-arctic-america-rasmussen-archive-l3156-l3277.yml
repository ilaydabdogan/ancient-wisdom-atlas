  confidence: medium
  cautions: The passage describes continuity and transformation after death, not a
    full narrative death-and-rebirth cycle.
- id: motif:2
  label: celestial being brings souls to earth
  taxonomy_refs: []
  basis: The moon is said to descend when unseen and bring the souls of men and beasts
    to earth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No available taxonomy reference precisely matches this motif.
- id: motif:3
  label: ritual respect for killed animals and food
  taxonomy_refs:
  - sacred_exchange
  basis: Pinga watches dealings with killed animals; food must be treated with respect
    and not wasted; caribou killing requires ceremonies and covering remains.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage implies reciprocal or regulated relations with animal powers,
    but does not explicitly describe an exchange transaction.
- id: motif:4
  label: wisdom gained through solitude, suffering, and fasting
  taxonomy_refs:
  - wisdom
  - initiation
  basis: Igjugarjuk says wisdom is attained far from dwellings through suffering,
    and the later account describes fasting and isolation as means to knowledge of
    hidden things.
  evidence_refs:
  - ev:3
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The motif is strongly present, but the exact ritual context is specific
    to angakoq training.
- id: motif:5
  label: dream calling of a ritual specialist
  taxonomy_refs:
  - initiation
  basis: Becoming an angakoq is said to occur when mysterious powers reveal selection
    in a dream, and Igjugarjuk’s dreams mark his destiny.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The passage frames this as ritual vocation rather than a general hero
    call.
- id: motif:6
  label: taboo maintains balance with cosmic power
  taxonomy_refs:
  - covenant
  basis: Taboo rules are connected with Sila and designed to maintain amicable relations;
    violations bring sanctions such as bad weather, scarcity, and sickness.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not describe a formal covenant, only obligations and
    consequences.
- id: motif:7
  label: healing rite through total dispossession and removal from society
  taxonomy_refs:
  - initiation
  basis: For cure, the sick person gives away all possessions and is laid on earth
    far from any dwelling, retaining only breath.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is a healing practice; its relation to initiation is analogical and
    should be reviewed.
- id: motif:8
  label: confined winter ordeal before acquisition of helping spirit
  taxonomy_refs:
  - initiation
  basis: Igjugarjuk is isolated in a tiny snow hut during severe winter, fasts for
    thirty days, concentrates on the Great Spirit, and receives a woman-shaped helping
    spirit.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage describes an initiation practice, not a mythic adventure narrative.
- id: motif:9
  label: female spirit helper appears in dream or sleep
  taxonomy_refs: []
  basis: A helping spirit in the form of a woman appears to Igjugarjuk while he sleeps,
