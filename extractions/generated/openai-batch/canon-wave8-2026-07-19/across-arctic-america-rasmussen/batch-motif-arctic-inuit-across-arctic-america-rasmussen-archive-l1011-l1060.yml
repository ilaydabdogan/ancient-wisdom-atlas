canonical_text:
  quote: I have eaten my husband and my children!
  summary: The passage first describes details of a woman's dress and identifies the
    woman shown as Ataguvtaluk, a famine survivor. It then recounts how searchers
    found her in a snow shelter after she had eaten her husband, children, and much
    of her clothing; they sheltered and fed her separately, returned to Igdlulik with
    her, and report her later marriage to Igtussarssua.
  language: English
  quote_policy: quoted
