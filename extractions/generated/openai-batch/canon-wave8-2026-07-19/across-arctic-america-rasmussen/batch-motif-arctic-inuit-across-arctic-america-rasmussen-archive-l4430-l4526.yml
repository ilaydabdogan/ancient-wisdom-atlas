- id: obs:3
  text: A little white flag waved above each hut and is explained in the passage as
    a sign that the inhabitants had relinquished their old heathen faith and become
    Christians.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men, women, and children came out, formed a line outside Aua's hut, and sang
    a hymn as the narrator arrived.
