canonical_text:
  quote: ''
  summary: The narrator travels from Danish Island to Aua's hunting camp at Lyon Inlet
    to complete ethnographic collecting and study local spiritual beliefs. At the
    camp, inhabitants display white flags indicating conversion to Christianity, greet
    him with a hymn and handshakes, and then return to informal hospitality. The passage
    describes severe midwinter scarcity, seal hunting at breathing holes, communal
    distribution of meat, women's preparation of seal meat, a meal of blood-soup and
    boiled meat, and evenings suited to conversation and folklore collecting.
  language: English
  quote_policy: summarized
