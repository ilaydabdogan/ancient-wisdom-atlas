  summary: The passage describes Inuit observances concerning breaches of ritual regulations,
    the intervention of the angakoq, and the use of amulets, charms, and magic words.
    It gives examples of animal-body amulets, transferable luck, secret inherited
    or purchased charm words, Aua’s acquisition of charms from Qeqertuanaq, and several
    charms for heavy loads, sickness, a sick child, bleeding, and calling game.
