canonical_text:
  quote: ''
  summary: The passage reports winter delays among expedition members, then summarizes
    archaeological work on the Tunit/Eskimo past, especially excavations at Naujan
    on Repulse Bay. It describes ancient partly underground houses made of stone,
    turf, and whale bones, artifacts of bone, antler, stone, copper, pottery, and
    meteoric iron, and dating inferences based on absence of European trade goods
    and changes in land level.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several expedition members remained at Danish Island or nearby for much of
    the winter; Freuchen returned with frostbite, while Birket-Smith and Bangsted
    stayed at headquarters to care for him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator spent the winter comparing ethnographical collections and adding
    material from another visit to Indigenous people around Lyon Inlet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that satisfactory data had been secured for investigating
    the culture of the Tunit, with Therkel Mathiassen's work described as important.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Because there are no written sources for early Eskimo history, the passage
    presents archaeological excavation of dwellings and middens as the means of reconstructing
    past life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Naujan is located on the northern shore of Repulse Bay, east of the trading
    station; its name is explained as meaning the place of the young seamews.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Present-day Eskimos in the region are said to use snow huts in winter, while
    the ancient Naujan houses were constructed of stone, turf, and whale bones and
    were partly underground.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage infers that the land was about ten metres lower when the Naujan
    houses were built; nearby kayak stands now fifteen metres above the sea are interpreted
    as originally having stood at the water's edge.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The house remains had collapsed, weathered, and become overgrown, limiting
    reconstruction of their original appearance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Objects found included materials such as bone, walrus tusk, caribou antler,
