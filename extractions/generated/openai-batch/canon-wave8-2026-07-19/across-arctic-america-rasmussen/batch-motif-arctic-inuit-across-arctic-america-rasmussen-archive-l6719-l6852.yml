canonical_text:
  quote: ''
  summary: The travelers search for moving spring camps near Cape Adelaide and the
    Magnetic Pole, following huts, tracks, and seal-skull offerings. After arriving
    among camp residents, the narrator seeks to obtain amulets believed to have protective
    power. He displays trade goods and argues that owners can exchange the physical
    amulet while retaining its protective efficacy. The next morning a girl arrives
    with amulets worn on behalf of a future son; the passage explains that women and
    girls may wear amulets for hoped-for sons and that an amulet's power increases
    with time worn.
  language: English
  quote_policy: summarized
