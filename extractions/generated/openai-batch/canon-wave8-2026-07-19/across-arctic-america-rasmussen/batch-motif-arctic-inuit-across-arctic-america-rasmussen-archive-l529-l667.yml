canonical_text:
  quote: ''
  summary: The narrator describes a first meeting on the ice with an Akilinermiut
    caravan. A runner named Papik approaches with a harpoon while shots are fired
    from the sledges. The narrator drives his dog team toward him, then embraces him
    in Eskimo fashion, discovering that he understands Greenland Eskimo. The party
    is identified as Akilinermiut, linked by the narrator to Greenland stories of
    people from beyond the Great Sea. The narrator explains the expedition’s study
    aims, introduces his companions, and the Akilinermiut abandon their autumn journey
    to build snow huts and celebrate the meeting.
  language: English
  quote_policy: summarized
