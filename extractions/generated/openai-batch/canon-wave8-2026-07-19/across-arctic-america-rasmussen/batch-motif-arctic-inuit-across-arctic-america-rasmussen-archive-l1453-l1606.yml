canonical_text:
  quote: ''
  summary: The passage describes an Angakoq or wizard visiting the Land of Day, learning
    about souls in the Narrow Land, and undertaking a ritual descent beneath the earth
    and sea to the Mistress or Mother of the Sea when hunting fails. The community
    sings with eyes closed while the wizard travels. The wizard passes obstacles,
    appeases the angry Sea Mother by turning her and smoothing her hair, and persuades
    her to release sea animals, after which the community confesses breaches of tabu.
  language: English
  quote_policy: summarized
literal_observations:
