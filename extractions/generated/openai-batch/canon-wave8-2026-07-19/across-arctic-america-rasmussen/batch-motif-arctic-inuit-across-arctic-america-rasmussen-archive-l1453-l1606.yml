  text: While the wizard is away, guests entertain themselves by singing old songs
    with their eyes closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Land of Day, souls pass through walls or roofs of houses without doors
    and are visible but described as insubstantial.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people of the Land of Day greet the newcomer as a dead soul, but turn
    away when he says he is still flesh and blood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wizard returns to earth and reports what he has seen to those waiting
    for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Souls of people who died of sickness must go down under the sea to Takanalukarnaluk
    and do penance before they can go to the Land of Day or remain happily in the
    Narrow Land.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Narrow Land is described as a coast land with abundant sea creatures and
    much hunting.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: When hunting fails and meat is scarce, the Angakoq seeks the Mistress of the
    Sea and tries to persuade her to release creatures she is holding back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the journey, the wizard sits on bare snow or earth, meditates, invokes
    helping spirits, and cries that the way is being made ready; those present answer
    in chorus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the helping spirits arrive, the earth opens beneath the wizard, though
    it may close again before the way is finally opened.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A receding voice under the ground signals to those present that the wizard
    is on his way to the Mistress of the Sea.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the wizard's absence, people in the house sing spirit songs with eyes
    closed, the lamps are out, and the wizard's discarded clothes may come alive and
    fly over the singers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The singers may hear sighing and breathing of long-dead souls, likened to
    spirits moving deep in the sea or sea-beasts breathing below.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A standing song for elders says the people have no food or hunting fruits
    and stretch out their hands to lift someone up from below or from a hollow place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Great wizards find a passage opening for their journey down under the earth
    to the sea.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: At Takanalukarnaluk's house, a wall in front of the entrance shows hostility
    toward humans, and the wizard must break it down.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: The undersea house is like an ordinary human dwelling but has no roof, and
    the woman seated by the lamp can watch human dwellings from it.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: A large dog lies across the passage, shows its teeth, growls, and may be gnawing
    the bones of a still-living human being; the wizard must thrust it aside.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: A guardian of the souls in purgatory tries to seize the wizard but lets him
