- id: ev:15
  type: summary
  locator: lines 7434-7442
  quote_or_summary: The eight-day feast uses ribbon seal bladders preserved during
    the past year; they are hung with herb bundles under the roof, where a harpoon
    and line are fixed and a small lamp burns beneath.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
