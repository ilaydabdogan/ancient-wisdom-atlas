canonical_text:
  quote: ''
  summary: The passage describes obligations after a first seal catch and an autumn
    ribbon seal festival. It includes food gifts to widows and fatherless children,
    a month of ritual preparation with separation of men and women, bathing and clothing
    rules, silent song-making in darkness, an angakoq invoking spirits and animals
    while a noose is pulled around his neck, purification by heat and washing, preservation
    and ceremonial return of seal bladders to the sea, feasting, gift exchange, resolutions
    for better conduct, and the beginning of winter hunting.
  language: English
  quote_policy: summarized
literal_observations:
