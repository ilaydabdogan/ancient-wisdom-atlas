  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summary provided.
- id: ev:18
  type: summary
  locator: lines 7451-7454
  quote_or_summary: On the eighth evening, men and women exchange gifts and promise
    to do better in conduct and in their respective tasks during the coming winter.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summary provided.
