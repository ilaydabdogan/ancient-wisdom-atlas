  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/across-arctic-america-rasmussen.md
  rights_note: Public domain source; summary provided.
- id: ev:17
  type: summary
  locator: lines 7447-7451
  quote_or_summary: The seals’ bladders are dropped into the sea through a hole in
