  quote: '"The caribou are coming; the caribou are coming"'
  summary: The passage describes a winter camp near the Kazan River preparing to follow
    migrating caribou, the arrival of scouts announcing the herds, the travelers'
    difficult movement through river ice and eddies, their discovery of signs of nearby
