canonical_text:
  quote: They had no sledge, no dogs, and carried no weapon save their long snow knives.
  summary: 'During a blizzard at Pelly Bay, two men arrive at the hut without sledge,
    dogs, or weapons except snow knives. After food and warming, they identify themselves
    as two brothers from near the Magnetic Pole traveling with fox skins to trade
    for old guns. The elder, Qaqortingneq, turns back, and the narrator decides to
    visit his tribe. Qaqortingneq later brings the rest of his party: two wives and
    a foster son, each described in terms of purchase or exchange.'
