  summary: The passage describes a walrus hunt and a warm snow-house supplied by blubber,
    then presents Aua answering religious questions. Aua recounts the Sea Mistress
    Takanaluk Arnaluk, whose severed finger joints become seals and walrus and who
    rules sea creatures. He also explains two afterlife regions, the souls in the
    Land of Day seen as northern lights, and a ritual by which powerful angakoqs visit
    the People of Day through a soul-ascent.
