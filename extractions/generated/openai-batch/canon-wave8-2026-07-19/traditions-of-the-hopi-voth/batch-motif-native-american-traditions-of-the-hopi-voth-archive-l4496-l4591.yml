canonical_text:
  quote: ''
  summary: The Pookongs first mistake wind-blown grass for the Lalakontu dance and
    are corrected by Spider Woman. She later sends them to Mishongnovi to watch the
    dance properly and obtain trays, but they are not invited to eat, so they snatch
    trays from dancers and return home. Angered by the lack of hospitality, they move
    the nearby salt source farther away, explaining why Hopi salt must be gathered
    from a difficult place. The passage then begins a new tale in which Pookonghoya
    and Baloonghoya decide to seek a maiden who refuses all marriage offers, despite
    Spider Woman’s warning that they are small and unsightly.
  language: English
  quote_policy: summarized
