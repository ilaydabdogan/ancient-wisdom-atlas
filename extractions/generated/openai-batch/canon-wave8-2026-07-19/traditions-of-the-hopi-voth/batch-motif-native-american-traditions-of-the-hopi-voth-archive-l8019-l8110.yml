canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a large Hawk rescues an emaciated
    orphan boy from a Navaho camp, provides him with clothing and cooked food, and
    returns him to Oraibi. It then begins a tale of famine at Oraibi, where a brother
    and sister are left behind; a toy bird made from sunflower-stalk pith becomes
    a living Humming-bird, brings ears of corn for several days, and is then instructed
    to seek the children’s parents and food.
