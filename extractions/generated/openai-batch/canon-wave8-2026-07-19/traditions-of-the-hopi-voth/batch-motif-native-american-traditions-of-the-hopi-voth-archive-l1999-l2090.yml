- id: obs:4
  text: The Bear party comes near the present site of Phoenix, stays at many places,
    reaches the Little Colorado River area, and there receives or assumes the Bear
    clan name after encountering a dead bear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One party takes the bear hide and cuts carrying straps from it, becoming the
