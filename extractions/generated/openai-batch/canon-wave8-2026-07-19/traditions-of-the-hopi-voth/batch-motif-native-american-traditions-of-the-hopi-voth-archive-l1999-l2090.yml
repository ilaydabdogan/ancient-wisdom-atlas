  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The seven clans named from the same origin are considered related to one another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bear clan halts along the Little Colorado River, then moves eastward through
    Badger Spring, Makwutavi, and Matrivi before moving north to Shongopavi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Because the Bear clan is said to have arrived first at Shongopavi, it considers
    itself the leading clan, and the village chief has been chosen from that clan.
  category: relationship
  evidence_refs:
