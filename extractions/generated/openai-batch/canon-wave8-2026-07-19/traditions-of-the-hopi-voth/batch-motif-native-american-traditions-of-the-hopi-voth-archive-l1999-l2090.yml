canonical_text:
  quote: ''
  summary: 'The passage first describes the Sun bathing, being fed by the Sun clan,
    mounting a bluff, and continuing west while gathering offerings. It then gives
    a tradition of the Bear clan: after leaving the sipapuni, the Bear people separated
    from others, wandered through many places, and became associated with a dead bear
    near the Little Colorado River. Several related clans received names from successive
    encounters with the bear’s hide, small animals, birds, spider web, skull, and
    ants. The Bear clan later settled at Shongopavi, claimed leading status from first
    arrival, held chieftainship roles in several villages, brought Blue Flute cult
    paraphernalia and songs that helped crops mature quickly, and negotiated the admission
    of later arriving clans.'
  language: English
  quote_policy: summarized
