canonical_text:
  quote: ''
  summary: The passage first describes Mice preparing a protective stick enclosure,
    placing dead Owl feathers as a central tfponi, and dancing in imitation of the
    Mdmchitu Fraternity before a large Hawk kills many of them. It then tells of a
    Sparrow-Hawk provoked by a taunting Hakwa, using a young hawk as a decoy and killing
    the Hakwa for its brood. A following tale describes a Sparrow-Hawk mother taking
    grasshoppers and beetles for her young; a Grasshopper mother laments, is released,
    and redirects Hopi children to take the young Sparrow-Hawks instead of grasshoppers.
  language: English
  quote_policy: summarized
