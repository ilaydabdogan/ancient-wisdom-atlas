canonical_text:
  quote: ''
  summary: At an existing mesa shrine, Ahdli and companions hear singing and encounter
    Aototo and the Big-Horn Katcina. The group descends, establishes or passes shrines,
    encounters the dangerous C6oyoko, and then stays at Ahdli's house, singing all
    night before rain and crop abundance appear. Big-Skeleton, owner of earth and
    fields, directs the Katcinas to live on the mesa and perform rites there; the
    W£lpi later move up and build the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: There were no villages on top of the mesa, but the shrine of Tal£whtoika was
    already there, and singing was heard at the shrine.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group went up the mesa to find the singer and saw a white-masked figure
    with a white body, a bandoleer with blue yarn, and a bone rattle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aototo said he was not singing and that another one was present; the Big-Horn
    Katcina came from the west with a bow, quiver, and green mask with a horn and
    an ear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ahdli proposed that they go down together and possess the people, and the
    two Katcinas agreed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the descent, Aototo led, followed by Ahdli Katcina, the mana, and the Big-Horn
    Katcina last.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: They made a baho shrine by erecting stones as a mark between Hano and Sitcdmovi,
    then proceeded to a large shrine with a twisted stone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the large shrine they met C6oyoko, described as dangerous, with protruding
    eyes, a large mouth, rattles, a knife, and a crook; the passage says he used to
    kill and devour children there.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Katcinas told C6oyoko not to trouble them, said they were going to possess
    the people, and said he could destroy the bad ones.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Ahdli's house, Ahdli said it was not good below because it did not rain,
    that it was better up where the Katcinas were, and that they would help and plant
    for the people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the night they did not sleep but sang all night on their masks, which
    stood in a row on the north side of the room.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At yellow dawn it began to rain hard; toward noon the Katcinas put on masks,
    crossed the mesa, and found fields of corn, melons, watermelons, and squashes
    growing beautifully.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: They took a watermelon, an ear of fresh corn, and a melon while it was still
    raining and the ground was soft.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Big-Skeleton, who owns the earth and fields, met them and told the Katcinas
    to go up the mesa, prepare a house, live there, and perform rites from there.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the Katcinas lived on top of the mesa, the W£lpi also began moving up
    the mesa and building the village where it was later situated.
  category: sequence
  evidence_refs:
  - ev:8
