canonical_text:
  quote: ''
  summary: The passage recounts the aftermath of a raid on Aoatovi, including killing,
    taking captives, a dispute over women and maidens, and the later presence of Aoatovi-derived
    clans and cult practices in other villages. It then begins another account of
    Aoatovi's destruction, in which the village chief's rejected son prompts his father
    to seek outside help, including use of Spanish pepper powder when villagers are
    in the kiva.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raiders took desired prisoners from Aoatovi, killed others, and the chief
    of Aoatovi and his son were destroyed with others in the kivas; the village itself
    was not destroyed at that point.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Skeleton Mound, the Oraibi complained that Mishongnovi and Walpi had taken
    prisoners who should have been offered first to Oraibi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mishongnovi and Walpi refused to give up the captured women and maidens, saying
    that because they had captured them, they belonged to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Oraibi chief ordered contested captives to be killed so that they would
    belong to nobody; many younger and prettier women and maidens were killed, while
    some were spared and taken to different villages.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains the presence of Aoatovi people in Oraibi, Mishongnovi,
    and Walpi, naming Sand, Rabbit, Coyote, and Butterfly clans in Oraibi as represented
    from those people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aoatovi people are said to have introduced the Oáqöl cult in Oraibi, Mishongnovi,
    and Walpi, and at Soyal these clans place bahos at the mesa edge for their dead
    ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second account, Aoatovi has a village chief with fields, two springs
    north of the village, and a son whom the maidens fear and refuse to marry.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The village chief's son leads a hunting expedition; hunters form two parties
    in a circle, kill many rabbits, and a large hawk kills rabbits for the son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the hunt, the hunters drink at a spring near Aoatovi, go up to the village,
    and eat peaches and watermelons growing near the mesa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The son tells his father that he is unhappy and says their people will be
    happy only for a short time longer; he tells his father to go to Toriva the next
    morning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Aoatovi chief tells the chief of Ilano that his son is rejected by the
    maidens and asks him to notify other villages and bring Spanish pepper powder
    for use when the people are all in their kiva.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief of Ilano informs Sitchomovi and Walpi and tells them to prepare
    for the expedition the next night.
  category: sequence
  evidence_refs:
  - ev:9
