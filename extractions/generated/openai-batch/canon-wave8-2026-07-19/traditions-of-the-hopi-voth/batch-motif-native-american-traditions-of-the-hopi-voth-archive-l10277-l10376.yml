canonical_text:
  quote: ''
  summary: The passage contains the end of one animal tale and the beginning of another.
    In the first, a Bull-snake is mocked by a bird nesting high on a bluff; after
    repeated failed climbs, the snake reaches the nest, eats the four young birds,
    and later charms and devours the parent bird by drawing it near through inhalation.
    A note reports Hopi accounts of similar snake charming of small animals. In the
    second tale, Rattlesnakes live at Tcuakpi with a kiva, appearing as snakes in
    summer and as Hopi in winter. During an unprecedented snow, the Snake chief sends
    the Sand Rattlesnake toward the Locusts at Ttivanashavi for help, but he turns
    back from cold and exhaustion.
  language: English
  quote_policy: summarized
