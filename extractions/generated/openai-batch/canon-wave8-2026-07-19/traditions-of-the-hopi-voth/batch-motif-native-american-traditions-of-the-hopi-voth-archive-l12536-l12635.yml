  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Navaho became afraid and scattered on ponies; a noise was heard west of
    the camp as the Oraibi attackers arrived.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A battle followed; the Navaho were driven back out of the canyon while trying
    to protect wives and children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Hopi pursued and killed many with reed arrows; the narrative concludes
