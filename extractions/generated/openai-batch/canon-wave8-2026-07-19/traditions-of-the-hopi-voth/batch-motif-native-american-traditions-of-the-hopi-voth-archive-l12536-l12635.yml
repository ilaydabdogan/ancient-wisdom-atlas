canonical_text:
  quote: ''
  summary: 'The passage recounts Navaho plundering of Hopi sheep and corn, retreat
    with dead and wounded, care of wounded Hopi in a Coyote clan ancestral home, and
    a note on poisoned arrows. It then narrates a Hopi raid on a Navaho dance in a
    deep canyon: during a masked Katcina dance a falling star frightens the Navaho,
    the Oraibi attackers arrive, a battle follows, and the story explains why Navaho
    dances thereafter have watchers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Navaho attackers broke through a north-side barrier, drove out sheep, loaded
    corn on ponies, rifled some houses, and left the village with sheep and corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The returning Navaho carried dead and wounded on ponies; some wounded people
    and ponies died on the way, and the passage reports mourning among the Navaho.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wounded Hopi were placed in an ancestral home of the Coyote clan; those who
    carried and cared for them were called Fathers, and the wounded were called Children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some wounded Hopi died during the night and following day; corpses were removed
    and cared for by their caretakers, while surviving wounded were taken to their
    parents’ homes on the fourth day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note says Navaho poisoned arrows were prepared with matter from a decaying
    rattlesnake and poison extracted from rattlesnake fangs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same note says Hopi sometimes used bows and poisoned arrows taken from
    slain Navaho against the Navaho, while Hopi buckskins helped protect against arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Navaho people dressed for a dance, mounted ponies, raised heavy dust while
    traveling, and descended a steep dangerous zigzag trail into a deep canyon near
    the later Fort Defiance area.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At night the Navaho held a Katcina dance with masked Katcinas; people camped
    in a circle with campfires, and the dance took place in the center.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: During the fifth dance, a light appeared and a large star rose, came down,
