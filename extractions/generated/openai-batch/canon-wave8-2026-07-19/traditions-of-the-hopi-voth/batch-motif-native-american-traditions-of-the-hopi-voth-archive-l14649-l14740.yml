canonical_text:
  quote: ''
  summary: The passage contains several summarized Hopi Coyote narratives. Badger
    revives a dead Kohonino maiden from bones, but Coyote's desire and bite cause
    her second death; Badger later deceives Coyote into fatal self-disembowelment,
    after which coyote fat is connected with ants and ant bites. Other episodes show
    Coyote dying after imitating Kokontu maidens, losing teeth and starving after
    demanding a Grasshopper mother's song, being killed by Deer after threatening
    Grasshopper's family, and being trapped, skinned, and hung as a watching flag
    after pursuing three maidens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Badger and Coyote find a dead Kohonino maiden's bones; Badger covers them
    with his black kilt, uses grass, red paint, and water, sings, and the maiden becomes
    alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Badger makes Coyote go away before the revival because the maiden will not
    revive if Coyote remains nearby.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the maiden revives, she agrees to go home with Badger and Coyote; Badger
    says she is to be their clan sister, but Coyote bites her calf and she dies again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Badger cooks cut pieces of fat bull-snakes and tells Coyote he opened his
    own abdomen, removed his entrails, roasted them, and healed again; he shows Coyote
    a small scratch as proof.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote cuts open his abdomen, his entrails fall out, and he dies; Badger takes
    fat from Coyote and spreads it on an ant hill, causing ants to move away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kokontu maidens grind corn, sing, and play by running up a large tree and
    jumping down from a steep bluff; Coyote joins them, jumps down, and kills himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Sparrow-hawk has eaten the grasshopper children, Grasshopper mother
    mourns; Coyote demands her song, later addresses a stone placed in her stead,
    breaks his teeth on it, and eventually starves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Grasshopper prepares food and water for helpers who do not come, plants alone,
    rests in his kisi, and tells Coyote that he is afraid the booth will fall on him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Grasshopper sends his family to Deer; when Coyote follows and enters the kiva,
    two Deer toss him with their horns until he dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Coyote's grandmother tells him to bring clothing, yarn, an arrow quiver, and
    ochre; she dresses him and puts ochre on his face before he goes to the three
    maidens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The maidens' father sets a stone trap with rabbit meat; Coyote is caught and
    dies, and the father later skins him and hangs up the skin as a watching flag.
  category: sequence
  evidence_refs:
  - ev:7
