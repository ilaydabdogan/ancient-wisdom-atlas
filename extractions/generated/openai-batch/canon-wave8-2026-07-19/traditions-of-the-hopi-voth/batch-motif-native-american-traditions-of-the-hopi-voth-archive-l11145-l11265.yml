canonical_text:
  quote: ''
  summary: 'The passage contains three Hopi narratives or song-text units: a Red Eagle
    dawn song and account of capturing young eagles for ritual feathers; a tale of
    Red Eagle and Owl as friends whose incompatible habits lead to Owl''s death during
    a hunt; and a tale in which Bee sweetens Asya''s peaches with honey and Asya gives
    Bee wings made from feathers.'
  language: English with embedded Hopi song lines and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Red Eagle and his wife live on a small steep bluff called Kwakatpe, north
    of Sikyatki, and Red Eagle has four children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During an early morning dance, the song says that at Kwakatpe the Red Eagle
    hatches children, and the performers fly upward a little way and alight again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man from Sikyatki hears the singing and sees the dance, tells his people,
    and the people capture the small eagles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the capture, people continue to get young eagles there and use their
    feathers for prayer-offerings, masks, and related items.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large Owl with children lives at Owl Gulch, and a Red Eagle with children
    lives north of there at a bluff; the two are friends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Eagle hunts during the day, but Owl cannot go hunting during the day,
    so they have not hunted together.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eagle finds Owl asleep in the daytime, tries several physical ways to wake
    Owl, and then asks Owl to go hunting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the hunt, Eagle takes a rabbit that Oraibi hunters were following, and
    the hunters become angry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eagle later finds Owl sleeping near the edge of a wash; two Oraibi boys see
    Owl and shoot him through the head with an arrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Owl is killed and carried away, Eagle returns to living alone in his
    house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bee and Asya are both women with children, live at different places, and are
    friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Asya eats peaches, while Bee provides honey during a visit; at this time bees
    have no wings and walk slowly.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bee visits Asya's dwelling in an opening in a rock, is fed peaches, and says
    the peaches are sour rather than good.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bee puts honey on the peaches, and the passage says peaches have been sweet
    and better-tasting ever since.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Asya pulls out some of her feathers, makes wings, attaches them to Bee, teaches
    Bee how to move them, and the passage says bees have been able to fly ever since.
  category: action
  evidence_refs:
  - ev:8
