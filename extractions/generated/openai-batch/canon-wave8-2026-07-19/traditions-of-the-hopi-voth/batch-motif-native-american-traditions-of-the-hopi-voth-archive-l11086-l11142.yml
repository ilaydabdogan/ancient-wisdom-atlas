    be friends and exchange visits. Crow serves Hawk food from her own preferred prey,
    which Hawk dislikes and only pretends to eat. Hawk later serves Crow rabbit skins
    and intestines, expecting her to reject them, but she eats heartily. The account
    ends by saying Crow and Hawk remain in their respective places hatching young.
