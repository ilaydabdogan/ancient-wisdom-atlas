canonical_text:
  quote: ''
  summary: The passage first concludes a star-origin narrative in which a woman emerges
    from water in bridal dress, Flute priests direct a paired ritual movement, the
    man fails to complete the instructed four steps, and the two become an endlessly
    pursuing pair of stars. It then begins a tale of the Kokoshori Katcina, who takes
    a crying Shongopavi girl to the Katcina village, where she is fed and fostered;
    after she and her parents become homesick, the Katcinas return her to Shongopavi
    with song, rain, and food gifts.
  language: English
  quote_policy: summarized
