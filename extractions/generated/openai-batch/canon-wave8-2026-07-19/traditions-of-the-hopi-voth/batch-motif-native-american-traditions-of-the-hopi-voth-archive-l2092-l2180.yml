canonical_text:
  quote: On this reed they climbed up, first the Horn people (Aaltu)
  summary: People in the underworld become violent, and chiefs seek a way out. A bird
    scout finds an opening; a fast-growing pine fails to reach it, but a reed reaches
    through and serves as a ladder for emergence. A Mocking-bird distributes languages,
    a moccasin is dropped, the opening is closed before all emerge, and later migrations
    begin. The Hopi travel with Muyingwu, while other peoples take different routes;
    a sorcerer explains death as return to the lower world after the chief sees his
    dead son below. Coyote throws stars into the sky. Spider, traveling with the White
    People, creates burros from scales rubbed from her skin, helping them reach the
    sunrise first and signal by a star. Later migrating parties receive clan names
    from successive encounters with a dead bear and associated remains, animals, or
    traces.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: People in the underworld became bad, fought, killed people, and killed the
    chief's son, prompting the chief to decide to move away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mótsni was sent to find a way out, flew up, found an opening, and reported
    it to the chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Village Chief and Crier Chief planted a pine that grew quickly but did
    not reach the opening, then planted a reed that grew quickly and reached through
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: People climbed up the reed; the Horn people emerged first and held the protruding
    reed or ladder for others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mocking-bird sat outside and distributed languages to the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A climber dropped a moccasin, and the passage explains present Hopi moccasins
    as less fine because a replacement could not be made as nicely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Before all the people had emerged, the chief stopped them and closed the opening;
    one sorcerer had also emerged.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The people started on different routes, with the White Man taking the most
    southern route and others taking routes farther north.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Hopi brought Muyingwu, whose body consisted entirely of corn and whose
    feet were ears of corn, making him slow.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Hopi were to have the horse but could not ride it because they used no
    bridle; the Navaho could ride it and matched with it because they bridled the
    pony.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the chief's son became sick and died, the sorcerer said he was not really
    dead and directed the chief to look down through the emergence opening.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The chief looked down and saw his child walking in the other world; the sorcerer
    said future deaths would mean going back to the lower world.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Coyote, traveling with the Hopi and carrying the stars in his hand, threw
    the stars into the sky, making night somewhat light thereafter.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The White People took Spider with them; Spider rubbed scales from her skin
    and created burros from them, which the White Men used to carry burdens.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The White Men reached the place where the sun rises first; a southern star
    arose as an agreed signal to the other migrating peoples.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The star associated with the sunrise arrival is said to influence animals,
    and people who want livestock are said to pray to it.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:17
  text: Several migrating parties received clan names from successive encounters with
    a dead bear, its skin, spider web, blue-birds, eaten-out eye cavities with fat,
    and a mole's digging beneath the place where the cadaver lay.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: The clan parties separated and wandered, stopping at various places for different
    lengths of time, which the passage connects with many ruins in the country.
  category: sequence
  evidence_refs:
  - ev:18
