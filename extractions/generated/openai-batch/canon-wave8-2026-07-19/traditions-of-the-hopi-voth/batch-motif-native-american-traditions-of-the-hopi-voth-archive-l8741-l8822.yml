canonical_text:
  quote: ''
  summary: 'The passage closes a Turtle-Coyote episode in which Coyote fails to harm
    turtles protected by their shells and the little Turtle reports surviving being
    thrown into water. It then begins a Water Serpent-Coyote episode: Water Serpent
    lives at Flute Spring, visits Coyote, fills Coyote''s kiva with his long body,
    and Coyote fabricates a long false tail from cedar bark, yucca leaves, and hair
    to imitate the serpent''s size during a reciprocal visit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is angry, threatens to hunt and devour the little Turtle's mother,
    and follows the tracks of turtles returning to the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Coyote tries to seize turtles, each turtle draws its head, feet, and
    tail into its shell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote works around the turtles, turns and pushes them, but cannot hurt them
    or break their shells, and leaves in disgust.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Turtle mother brings cactus to her child, and the child eats it with delight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The little Turtle tells its mother that Coyote threatened to devour it, but
    stopped when told the turtle would live in his body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The little Turtle reports that Coyote threw it into the water after it said
    it would drown; in the water it laughed, declared it was living, and returned
    without becoming tired.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Turtle mother laughs, is happy that Coyote brought the child there, and
    the turtles are said to still live in that water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Water Serpent, Balolookong, lives at Lanva, the Flute Spring, while Coyote
    lives a short distance south at Ishmovala.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Water Serpent and Coyote are described as strong friends who often visit each
    other.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Water Serpent is so long that, when coiled in Coyote's kiva, he fills nearly
    the whole kiva and leaves Coyote only a small place near the fireplace.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Water Serpent says he will become larger, tells Coyote to enlarge his kiva,
    and invites Coyote to visit him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Coyote thinks about how he might fill Water Serpent's kiva and says he too
    will become large and have a long tail.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Coyote gathers cedar bark, rubs it pliable, wraps it with yucca leaves, covers
