canonical_text:
  quote: ''
  summary: A maiden staying with Spider Woman undergoes food preparation, corn grinding,
    offerings, and rain-washing. Hidden spiders prepare a bridal costume. Spider Woman
    dresses the bride, gives meat to Pookong, and sends the couple to the bride's
    mother's house. Pookong misunderstands an instruction about proper silent son-in-law
    behavior. Later, at planting time, Spider Woman gives him a small parcel of different
    kinds of corn to plant.
  language: English
  quote_policy: summarized
