  type: summary
  locator: lines 13223-13305, Apache war episode
  quote_or_summary: When grown, the children pray to the God of Thunder before attacking
    nearby Apache; surrounded by Apache, the elder brother shoots lightning and all
    Apache are slain. They scalp a warrior, return, and a War Chief is made by throwing
    the scalp on him.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source text; summary generated from supplied passage.
