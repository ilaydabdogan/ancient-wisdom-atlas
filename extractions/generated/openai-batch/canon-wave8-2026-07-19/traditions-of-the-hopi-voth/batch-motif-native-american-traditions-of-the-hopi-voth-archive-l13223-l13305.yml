candidate_motifs:
- id: motif:1
  label: ghostly fire-setter revealed as kin
  taxonomy_refs: []
  basis: A young man pretending to be a ghost sets fires until caught and revealed
    as the chief's son.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-narrative, so the young man's motive and the broader
    narrative function are not fully available here.
- id: motif:2
  label: ritual objects planted before delayed flood
  taxonomy_refs:
  - flood_and_renewal
  basis: Bahos are planted in five places; four years later, water emerges from those
    places and a destructive flood follows.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The renewal component is limited in this passage to survival and later
    rain-making, not a full cosmogonic renewal.
- id: motif:3
  label: water-serpent emergence from ground
  taxonomy_refs:
  - serpent
  basis: The old man emerges as a large Balolookong and other Balolookongs shoot from
    the ground with streams of water.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage uses the name Balolookong and later the word serpent; further
    cultural specificity should be reviewed by a Hopi traditions specialist.
- id: motif:4
  label: sibling pair confronting catastrophe and vanishing
  taxonomy_refs:
  - sibling_pair
  - sacrifice
  basis: The village chief's son and his sister are sent into the water to drive back
    the Balolookongs, and they disappear with the serpent after the young man presses
    it into the water.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly call their disappearance a sacrifice;
    that motif-family tag is therefore tentative.
- id: motif:5
  label: catastrophe survivors preserved as a pair
  taxonomy_refs:
  - survivor_pair
  basis: Two little boys survive the flood; in the Katcina revenge story, one man
    and one woman survive the hail catastrophe.
  evidence_refs:
  - ev:4
  - ev:11
  confidence: high
  cautions: The two survivor cases belong to separate narrative units within the same
    passage.
- id: motif:6
  label: human transformation into turkeys
  taxonomy_refs:
  - shapeshifter
  basis: Old men climb onto tray shelves and turn into turkeys during the flood.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage states the transformation but gives little explanation of
    mechanism or meaning.
- id: motif:7
  label: ancestral body substance used to make rain
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Big Balolookong tells the children to cut flesh from his back and says that
    a little meat rubbed into baho paint will make rain.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The act is instructed by Big Balolookong, but the passage does not frame
    it explicitly as sacrifice or exchange.
- id: motif:8
  label: thunder deity as helper and war-teacher
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The God of Thunder feeds the children, promises lightning and thunder, teaches
    war songs and warrior conduct, and later supports their killing of enemies with
    lightning.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage supports instruction and empowerment, but does not use an
    explicit initiation label.
- id: motif:9
  label: offended sacred beings punish community with hail
  taxonomy_refs:
  - divine_judgment
  basis: After villagers threaten and burn the Katcinas, the Katcinas retaliate with
    hail, storm, crop destruction, and mass death.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage frames the act as revenge by Katcinas; the broader theological
    classification should be reviewed.
comparison_claims:
- id: claim:1
  claim: The Balolookong episode can be cautiously compared to a flood-and-renewal
    motif pattern because planted ritual objects precede a destructive flood, survivors
    remain, and rain-making knowledge follows.
  claim_level: same_motif
  target: flood_and_renewal motif family
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not present a full world-renewal narrative; it focuses
    on one village, survival, rain medicine, and subsequent events.
- id: claim:2
