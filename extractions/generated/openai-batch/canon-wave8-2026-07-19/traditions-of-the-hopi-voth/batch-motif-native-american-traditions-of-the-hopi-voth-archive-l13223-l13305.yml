  quote_or_summary: Katcinas assemble in a mountain kiva, come to the village at night,
    and dance on the plaza while people sleep. The people become angry and threaten
    to kill them, so the Katcinas flee and jump from a bluff into a large crack, led
    by Katcina Uncle.
