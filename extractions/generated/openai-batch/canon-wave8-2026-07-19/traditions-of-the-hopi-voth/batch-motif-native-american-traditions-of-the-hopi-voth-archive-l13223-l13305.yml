  locator: lines 13223-13305, Balolookong flood emergence
  quote_or_summary: On the fourth day the old man emerges as a large Balolookong;
    Balolookongs and streams of water come from the ground, houses fall, many are
    buried, and old men in one house turn into turkeys.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source text; summary generated from supplied passage.
- id: ev:4
  type: summary
  locator: lines 13223-13305, sibling confrontation and survivors
  quote_or_summary: Chiefs make bahos and two balls from crushed beads and turquoise,
    send the village chief's son and his sister into the waters, and the young man
    presses the large Balolookong into the water; the serpent and the siblings disappear.
    Only old men-turkeys and two sleeping boys survive the flood.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source text; summary generated from supplied passage.
