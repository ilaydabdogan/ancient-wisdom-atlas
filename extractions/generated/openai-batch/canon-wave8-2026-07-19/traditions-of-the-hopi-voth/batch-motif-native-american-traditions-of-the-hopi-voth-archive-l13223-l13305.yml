  type: summary
  locator: lines 13223-13305, migration and Spaniards episode
  quote_or_summary: People leave Homolovi; the Batki clan goes to Awatovi and others
    settle in Shupaulavi. A chief's false report brings Spaniards, but Hopi leaders
    convince them they were deceived, trade, and the Spaniards return without encroaching
    again.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source text; summary generated from supplied passage.
