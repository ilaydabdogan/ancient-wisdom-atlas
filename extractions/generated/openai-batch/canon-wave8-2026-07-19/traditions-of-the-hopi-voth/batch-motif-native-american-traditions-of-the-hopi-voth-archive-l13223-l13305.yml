canonical_text:
  quote: ''
  summary: The passage includes the close of a narrative in which a chief's son acts
    as a ghost and sets fires; an old man concealed in a shrine becomes a Balolookong
    and brings destructive waters; survivors include turkey-transformed old men and
    two boys; the boys receive aid from Big Balolookong and the God of Thunder and
    later use lightning in war. It then recounts migrations and an episode involving
    Spaniards. A separate tale, 'The Revenge of the Katcinas,' tells how villagers
    threaten and burn Katcinas after a night dance, after which the Katcinas retaliate
    with hail that destroys crops and kills nearly everyone except one man and one
    woman.
  language: English
  quote_policy: summarized
