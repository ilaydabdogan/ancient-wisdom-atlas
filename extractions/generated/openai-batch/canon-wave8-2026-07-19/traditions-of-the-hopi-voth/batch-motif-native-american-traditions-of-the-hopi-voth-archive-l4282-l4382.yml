canonical_text:
  quote: ''
  summary: In Orafbi, people who go to gather wood disappear. A man and a woman separately
    encounter C6oyoko, who intends to feast on them, but both escape and report him.
    The village chief asks Spider Woman's grandsons, the two Pdokongs, for help. They
    agree, take lightning arrows and a ball, go to C6oyoko's house, kill his wife
    C6oyok Wuhti, find remains and belongings of slain Hopi, and wait as C6oyoko returns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Orafbi, men and women who went to get wood frequently did not return, causing
    the people to wonder whether they had gone away or been killed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man gathering wood near Hdtvala heard a singing voice after loading wood
    on his back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: C6oyoko saw the wood-carrying man and said he would feast on him; the man
    threw down his burden and crawled under it, so C6oyoko failed to find him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: C6oyoko next found a woman preparing a burden of wood and again said he would
    feast on her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman climbed a juniper-tree in fear, urinated while climbing, and C6oyoko
    mistook the moisture on the ground for rain associated with clouds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The man and woman escaped to the village and told the people that C6oyoko
    was killing the Orafbi people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The village chief went to the shrine of Achdmali, where the Pdokongs lived
    with their grandmother Spider Woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The chief asked the two brothers to take revenge on C6oyoko; they said C6oyoko
    was their bad uncle and agreed to help.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The two brothers asked the chief to make balls for them after C6oyoko was
    killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The brothers took their bow, lightning arrows, and ball, and traveled while
    striking the ball alternately forward and backward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: C6oyoko's house was at Munaovi on top of the mesa east of Orafbi; when the
    brothers arrived, C6oyoko and his wife were absent.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: The brothers followed the wife's tracks westward, found her sitting and killing
    white lice in her dress, and shot her with lightning arrows, shattering her to
    pieces.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Inside C6oyoko's house, the brothers found fresh fried human flesh, many beads,
    clothing, and scalps taken from Hopi whom C6oyoko had killed.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The brothers heard C6oyoko return singing the same song and inferred he had
    killed someone again when they heard him throw something down on the roof or kiva.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: C6oyoko entered, noticed there was no fire at the fireplace, inferred his
    wife had not returned, laid down his weapons, and looked for food.
  category: sequence
  evidence_refs:
  - ev:5
