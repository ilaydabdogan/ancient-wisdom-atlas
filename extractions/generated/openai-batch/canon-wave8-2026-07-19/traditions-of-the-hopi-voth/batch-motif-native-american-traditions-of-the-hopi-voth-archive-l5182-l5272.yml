canonical_text:
  quote: That is no coyote.
  summary: Two Orafbi maidens become rivals over a young man. The Yellow Corn-Ear
    maiden uses a rainbow-colored wheel to turn her friend into a coyote. The transformed
    maiden is rejected by village dogs, wanders west, enters the hut of two Katcina
    hunters, is spared and fed, and is carried to Spider Woman, who recognizes that
    the animal is not really a coyote.
  language: English
  quote_policy: quoted
