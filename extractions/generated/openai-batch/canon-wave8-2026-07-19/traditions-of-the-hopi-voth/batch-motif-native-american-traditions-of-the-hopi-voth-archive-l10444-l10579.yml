canonical_text:
  quote: ''
  summary: The passage closes a song-and-dance episode in which Locusts are thanked
    by the Snakes, after which heat returns, snow melts, grass appears, and a winter
    priestly practice of burning locust pieces is explained as bringing warm weather.
    It then tells of Squirrel and Chipmunk, friends who eat peaches from an old man's
    orchard, make a song and dance about their feasting, are discovered and chased,
    escape to their houses, and thereafter continue to eat peaches without much fear
    of the Hopi.
  language: English; includes Hopi song lines with English glosses
  quote_policy: summarized
