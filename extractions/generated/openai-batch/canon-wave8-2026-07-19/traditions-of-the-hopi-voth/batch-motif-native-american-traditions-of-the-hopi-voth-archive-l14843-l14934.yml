canonical_text:
  quote: ''
  summary: The passage summarizes several Hopi animal tales involving Badger and Mice,
    birds of prey and their victims, Crow and Hawk, Red Eagle and Owl, and Bee and
    Asya. The episodes include curing contests, traps, songs and dances, reciprocal
    visits and foods, animal predation, and origin explanations for mouse dwellings,
    eagle-feather use, and bee flight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Badger feigns sickness, summons Mice doctors, and attacks them with a hidden
    stick; younger Mice who cannot find the way home dig holes for themselves, explaining
    why mice live throughout the country.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Badger and the small Gray Mice are described as former Hopi who were bad and
    became animals; they are rival doctors, with Badger curing by herbs and Gray Mice
    by sorcery.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mouse treats the fasting Badger with a rattle, medicines, a medicine bowl
    mixture, and a song, then tells Badger to eat so he will recover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mole sets pointed sticks around Mouse's hole; Owl is pierced and killed while
    trying to catch Mouse; Mice distribute Owl's feathers, dance around a feather
    tiponi, and are then attacked by Hawk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hakwa repeatedly taunts Sparrow Hawk with a song; Sparrow Hawk uses his young
    as a decoy, circles back, kills Hakwa, and feeds his brood with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sparrow Hawk hunts Grasshoppers and Prayer Beetles; a Grasshopper mother is
    released after mourning her children, and later tells Hopi children to capture
    young Sparrow Hawks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Crow and Hawk exchange visits and meals, each serving foods connected with
    his own preferences; Hawk dislikes Crow's food, while Crow enjoys the rabbit skins
    and intestines served by Hawk.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Red Eagle, his wife, and four children dance and sing; a Hopi from Sikydtki
    sees and reports this, after which people capture young Eagles there and use their
    feathers for prayer-offerings and masks.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Red Eagle and Owl are friends but have different active times; Owl falls asleep
    during a hunt and is shot by Oraibi boys, after which Eagle lives alone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bee and Asya exchange honey and peaches; Bee sweetens Asya's peaches with
    honey, and Asya gives Bee feathers for wings and teaches her to fly, explaining
    why bees can fly.
  category: sequence
  evidence_refs:
  - ev:9
