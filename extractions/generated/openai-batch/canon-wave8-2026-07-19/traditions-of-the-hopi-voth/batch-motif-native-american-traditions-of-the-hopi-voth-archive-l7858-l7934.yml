canonical_text:
  quote: ''
  summary: A young man brings birds to Spider Woman, then travels westward to investigate
    a reportedly dangerous place. His ball drops into a kiva where Hasohkata invites
    him in, defeats him at a game, and binds him outside the kiva entrance. Spider
    Woman finds him cold and tied, shelters him with turkey feathers, summons predatory
    animals and Mole, and leads them to gamble with Hasohkata in order to recover
    her grandchild. Mole secretly assists from beneath the floor during the cup game.
  language: English
  quote_policy: summarized
