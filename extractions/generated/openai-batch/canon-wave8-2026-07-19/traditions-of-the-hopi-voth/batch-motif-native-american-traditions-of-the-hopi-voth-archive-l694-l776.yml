canonical_text:
  quote: ''
  summary: The Sun passes through a floor opening, travels under the earth back to
    the east, turns submerged land into land, observes beings emerging from water,
    and releases birds from a jar. Thereafter the Sun follows a westward route into
    Huruing Wuhti's house and below to the east. Huruing Wuhti and the Sun create
    several beings under a covering from particles rubbed from Huruing Wuhti's body;
    she names them, assigns clan identities to some, gives corn to some, and sends
    them to travel and settle.
  language: English
  quote_policy: summarized
