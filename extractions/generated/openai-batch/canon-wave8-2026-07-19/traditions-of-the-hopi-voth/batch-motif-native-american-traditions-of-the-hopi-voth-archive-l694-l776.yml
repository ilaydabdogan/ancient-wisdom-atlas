  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Huruing Wuhti rubs her abdomen and umbilicus, twists together scales from
    her body, covers them, and creates another perspiring maiden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The maiden wipes perspiration away with sand, the sand adheres to her body,
    and Huruing Wuhti names her a Sand Clan member and Lizard Clan member.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Huruing Wuhti gives the Sand and Lizard Clan maiden one grain of shelled corn
