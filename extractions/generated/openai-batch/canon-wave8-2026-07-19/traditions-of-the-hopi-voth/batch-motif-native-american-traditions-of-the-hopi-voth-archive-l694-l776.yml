  text: A little maiden and then a little boy are found under the covering; both complain
    of heat or warmth and perspire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The maiden and boy are identified as brother and sister; Huruing Wuhti names
