  quote: ''
  summary: 'The passage contains several summarized Hopi narratives: rival animal
    suitors compete over a maiden through a contest about making light; Toad Woman''s
    son attends Snow Katcina singing and dancing; a locust revives while being roasted
    and escapes; and Coyote is outwitted by a young turtle and frustrated by turtles
    withdrawing into their shells.'
