canonical_text:
  quote: ''
  summary: At Oraibi, a youth going to watch his father’s fields is joined by a maiden
    carrying piki rolls. After eating together, she proposes a hide-and-seek game
    in which whoever is found four times will be killed. The maiden repeatedly hides
    in or under plants and is not found, while the youth is found when she uses extraordinary
    means. The Sun and Spider Woman each help hide the youth, but the maiden discovers
    him by using milk drops and then a mirror-like crystal.
  language: English
  quote_policy: summarized
