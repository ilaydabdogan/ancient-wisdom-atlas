canonical_text:
  quote: ''
  summary: The passage first closes a scene in which two women combine prepared dishes,
    eat together, converse until sunset, and return home for the night. Section 45
    tells how children from Hukovi and Pivanhonkapi quarrel over bird trapping at
    Mumushva spring until the Pivanhonkapi children exchange foods for permission
    to trap there. Section 46 tells of a Hano woman who, after making clay for a jug,
    bears an earthen jug containing a crying boy; the child is nursed and fed through
    the jug, grows, receives hunting gear from his grandfather, pursues rabbits, the
    jug breaks, a Hopi emerges, kills four rabbits, and returns as a provider.
  language: English
  quote_policy: summarized
