  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: After rain and snow, young men hunt rabbits and return with them; the jug
    youth envies them and says he wants to hunt too.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The grandfather makes a bow and arrows, ties feathers to the arrows, and fastens
    hunting gear, food, and a burden band to the jug.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The grandfather carries the jug youth down from the village and instructs
    him to follow rabbit tracks, drawing the tracks for him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The jug youth follows rabbit tracks, pursues a rabbit rapidly, jumps into
