  summary: A chief prays to clouds in the San Francisco Mountains to come quickly
    and bring water. The group forms a line, a leader acts, and a cloud forms in the
    mountains. They sing a rain song; as they sing, clouds approach, rain and thunder
    begin, water falls, and the group drinks, becomes happy, and runs about because
    their thirst is gone.
