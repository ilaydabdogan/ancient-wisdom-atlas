- id: ev:5
  type: summary
  locator: lines 1942-1955
  quote_or_summary: At Wälpi the Snake people make the first Snake tiponi, altar,
    and ceremony; the cult spreads to other villages; the chief's nephew gathers snakes
    from four directions, and the chief constructs the tiponi from snake, corn, feather,
    buckskin, and cottonwood-root bāho materials.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary used.
- id: ev:6
  type: summary
  locator: lines 1956-1965
  quote_or_summary: In the Snake Myth, old men of the Pihkash and Kokop clans wonder
    where the Colorado River flows, build a box with provisions, a pole, four bāhos,
    and a young man, and send it floating down the river.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary used.
- id: ev:7
  type: summary
  locator: lines 1966-1972
  quote_or_summary: When the box stops, the young man sees water everywhere and a
