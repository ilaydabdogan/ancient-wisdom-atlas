candidate_motifs:
- id: motif:1
  label: violated warning leads to vanished wealth
  taxonomy_refs: []
  basis: The man opens the sack against his wife's objection, and by morning most
    beads have disappeared, explaining why the Hopi have few beads.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a warning and consequence but does not state a formal
    taboo or divine command.
- id: motif:2
  label: serpent offspring as clan origin
  taxonomy_refs:
  - serpent
  basis: The woman bears snake children, and after the couple's later admission to
    Wälpi her human children become ancestors of the Snake clan.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage is an origin account for the Snake clan within this collected
    Hopi tradition.
- id: motif:3
  label: offerings deposited with removed snakes to prevent return
  taxonomy_refs:
  - serpent
  - sacred_exchange
  basis: Bāhos are sent back with the snake children, and the narrator connects this
    to Snake priests depositing bāhos with snakes after carrying them away.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The function is explained directly in the passage; the exact ritual interpretation
    beyond that explanation is not expanded here.
- id: motif:4
  label: migrants admitted through promise of ceremonial service
  taxonomy_refs:
  - departure
  basis: The couple travels southeast, asks to enter Wälpi, and gains admission after
    promising to assist the people in ceremonies.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The broader migration context is only partially present in this line range.
- id: motif:5
  label: founding and diffusion of Snake ceremony
  taxonomy_refs:
  - serpent
  basis: The Snake people at Wälpi make the first Snake tiponi, altar, and ceremony,
    after which the cult spreads to named villages.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives an internal sequence of diffusion but not external corroboration.
- id: motif:6
  label: ritual collection from four directions
  taxonomy_refs:
  - serpent
  basis: The Snake chief sends his nephew north, west, south, and east to collect
    snakes for the first ceremony.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states the four-direction action but does not explicitly interpret
    its cosmological meaning.
- id: motif:7
  label: river vessel quest to discover where the river flows
  taxonomy_refs:
  - ark_vessel
  - mystical_quest
  basis: A young man is placed with provisions and bāhos in a box and sent floating
    down the Colorado River because the old men wonder where the river flows.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The box is a vessel on water, but it is not described as a survival ark;
    the quest purpose is exploratory.
- id: motif:8
  label: road over water made by sacred food
  taxonomy_refs:
  - mystical_quest
  basis: Huruing Wuhti rolls a corn-meal ball across surrounding water and it makes
    a road by which the young man reaches her house.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly label the place as an otherworld, though
    its setting is extraordinary.
- id: motif:9
  label: solar judgment of offerings
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: The Sun sorts bāhos offered by people, throwing away those from bad people
    and arranging those from good people.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The moral sorting concerns offerings; broader judgment of persons or souls
    is not stated.
- id: motif:10
  label: sun's under-earth route and dawn ritual explanation
  taxonomy_refs: []
  basis: After visiting the house the Sun goes under the earth on his course, and
