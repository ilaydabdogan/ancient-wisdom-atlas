comparison_claims:
- id: claim:1
  claim: The narrative explicitly links the return of snake children with bāhos to
    the Snake Dance practice of carrying snakes away and depositing bāhos with them
    so they will not return to the village.
  claim_level: same_function
  target: Hopi Snake Dance snake-removal offering practice
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal etiological connection stated in the passage, not
    an independent historical comparison.
- id: claim:2
  claim: The narrative links the Sun's route and eastern beings called Flutes to eastward
    Sun offerings and dawn-phase objects used in the Flute ceremony.
  claim_level: same_function
  target: Hopi Sun shrines and Flute ceremony dawn practice
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states the ritual explanation but provides only brief details
    of the ceremony.
