  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary used.
- id: ev:8
  type: summary
  locator: lines 1973-1987
  quote_or_summary: The Sun arrives at Huruing Wuhti's house on a disk attached to
    a spindle-like pole, sorts bāhos offered on his course, rejects those of bad people,
    keeps those of good people in a row, bathes, eats, dresses, and resumes his under-earth
    course.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
