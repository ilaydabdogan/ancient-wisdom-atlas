canonical_text:
  quote: ''
  summary: The passage recounts the loss of beads after a man opens a sack against
    his wife's objection; the arrival and rejection of snake children; the migration
    of the Snake couple to Wälpi; the origin and spread of the Snake clan and Snake
    ceremony; and the beginning of another Snake Myth in which a young man is sent
    in a box down the Colorado River, reaches a watery place with Huruing Wuhti's
    house, and witnesses the Sun sorting offerings and traveling beneath the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man opened a sack during the night despite his wife's energetic objection,
    took out beads and shells, spread them before them, and put some around his neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the morning all the beads except those given by Huruing Wuhti had disappeared;
    the narrator connects this with the Hopi having few beads.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the couple arrived, a new Snake clan was said to have come to the village,
    where Batki and Pana clans already lived.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman bore many children who were snakes living in fields and sand; they
    grew rapidly, played with Hopi children, and sometimes bit them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hopi became angry at the snake children, judged the situation not good,
    and drove them away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woman told her husband to take their children back to her home so that
    the couple could leave alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man's father made bāhos, and the man carried the snakes and bāhos in his
    blanket back to his wife's home, where the Snake people accepted the explanation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator explains that Snake priests carry away snakes after the Snake
    Dance and deposit bāhos with them so that the snakes should not return to the
    village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Snake man and his wife traveled southeast, saw smoke, found Wälpi on a
    mesa, and asked the village chief to admit them, promising ceremonial assistance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Wälpi chief was initially unwilling but admitted the couple; afterward
    the woman bore human children, whose descendants became the Snake clan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Wälpi the Snake people made the first Snake tiponi, Snake altar, and Snake
    ceremony, and the Snake cult spread to several other villages.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the first Snake ceremony the Snake chief sent his nephew north, west, south,
    and east to hunt snakes, and the nephew brought snakes from each direction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Snake chief made a tiponi from a hollowed cottonwood-root bāho containing
    rattles of three snakes, a fourth whole snake, a corn-ear, bird feathers, and
    a buckskin string.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: In the Snake Myth, old men wondered where the Colorado River flowed and built
    a box with provisions, a guiding pole, four bāhos, and a young man inside it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The box floated down the river until it stopped; the young man got out and
    saw water everywhere with a house in its midst.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: Huruing Wuhti came out of the house, called the young man four times, and
    rolled a corn-meal ball across the water, making a road for him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Sun entered Huruing Wuhti's house on a disk attached to a pole like a
    spindle and sorted bāhos offered to him on his course around the earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Sun threw away offerings from bad people and set offerings from good people
    in a row before bathing, eating, dressing, and resuming his course beneath the
    earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The passage states that bāhos offered to the Sun are carried eastward to Sun
    shrines and links the rising of the sun with Flutes playing in the east and fox
    skins placed at dawn stages during the Flute ceremony.
  category: sequence
  evidence_refs:
  - ev:9
