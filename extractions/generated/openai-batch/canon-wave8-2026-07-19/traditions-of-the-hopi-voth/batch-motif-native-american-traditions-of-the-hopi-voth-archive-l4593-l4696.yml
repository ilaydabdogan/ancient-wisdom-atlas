canonical_text:
  quote: ''
  summary: The Pookongs set traps with squash seed near a maiden's house and are invited
    to set traps inside. They secretly place an antelope and then a deer beneath a
    piki tray trap, making the animals appear caught there. The maiden's family processes
    and eats the meat. After the second large catch, the father allows Pookong to
    take the maiden as wife. At Pookong's house, the grandmother, later named Spider
    Woman, receives the maiden and instructs her about eating a very small amount
    of hurushuki, which begins to increase in her mouth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the evening the Pookongs take squash seed and little sticks, go to the
    village, and set stone traps for mice west of the maiden's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden sees the Pookongs setting traps and invites them to set traps in
    her house because many mice are there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the maiden's house the Pookongs set traps in several places, including
    near the mealing bin, and use a piki tray near the mealing tray as part of one
    trap.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Pookongs tell the maiden to look after the traps the next day, then kill
    an antelope at night and place it under the piki tray so it appears to have been
    trapped.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiden finds the antelope under the piki tray in the morning and calls
    her father, who takes it to his kiva.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The father skins and cuts up the antelope; the mother cooks part of it and
    the rest is dried, and the household is happy over the meat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the next evening the Pookongs again set traps, and the maiden asks them
    to set the house traps again because a large animal had been caught there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father says that the first large catch has ended the maiden's persistent
    refusals to marry, and promises that if something is caught again the next morning,
    the Pookongs may come for his daughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night the Pookongs kill a deer and place it under the piki tray trap; in
    the morning the maiden and father find it there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The deer is taken to the kiva, skinned, cut up, partly cooked by the mother,
    and the rest hung up to dry outside the house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father tells his daughter to wait for somebody that night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The two Pookong brothers quarrel over which one will go to the maiden, and
    their grandmother says the older Pookong must go.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pookong goes to the maiden while she is grinding corn, states that he has
    come because her father wished it, and the father confirms that Pookong may take
    the daughter because of the trapped game.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The mother fills a tray with meal for her daughter, and Pookong leads the
    maiden to his house to marry her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: At Pookong's house the grandmother receives the maiden, stores the tray of
    meal in an inner room toward the north, and sets a small tray of hurushuki before
    her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Spider Woman watches the maiden put all the hurushuki into her mouth and warns
    her to take only a very little; when the maiden eats a small quantity, it begins
    to increase in her mouth.
  category: action
  evidence_refs:
  - ev:8
