canonical_text:
  quote: ''
  summary: After emergence into a cold world without a sun, the people keep fires
    near their fields to warm the ground. The chiefs and Skeleton deliberate and ritually
    construct a disk that is launched eastward with an unnamed person and becomes
    the moon, but its light is dim and does not warm enough. They then construct a
    more elaborate sun symbol, launch it eastward with another unnamed person, and
    it becomes the sun, bringing stronger light and warmth. Notes connect the sun
    symbol to Hopi ceremonial use and explain hidden figures and powers that hold
    or rotate the celestial bodies.
  language: English
  quote_policy: summarized
