canonical_text:
  quote: ''
  summary: 'The passage contains Coyote episodes: one Coyote dresses like a Katcina,
    is caught in a stone trap baited with rabbit meat, and his skin is hung as a field
    flag; another group of Coyotes imitates Katcina dances with scavenged costumes
    and masks and is killed during an Oraibi coyote hunt; a final brief episode explains
    why coyotes call when they find prey, after a Coyote summons colored coyotes from
    different directions to share a rabbit.'
  language: English
  quote_policy: summarized
