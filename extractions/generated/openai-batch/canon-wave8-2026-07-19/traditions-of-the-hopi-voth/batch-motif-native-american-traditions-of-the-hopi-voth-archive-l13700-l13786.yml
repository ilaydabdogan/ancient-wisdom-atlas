candidate_motifs:
- id: motif:1
  label: ritual death followed by an afterlife journey
  taxonomy_refs:
  - afterlife_journey_map
  - death_rebirth
  basis: The young man is prepared as if dead, dies through medicine, follows a westward
    route to Skeleton House, and later returns to life.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage is an English synopsis and does not provide full ritual or
    narrative wording.
- id: motif:2
  label: descent to and ascent from the realm of the dead
  taxonomy_refs:
  - hero_descent
  - ascent
  - return
  basis: The traveler is sent over a precipice on his kilt, descends to the afterlife
    region, and later rises back up on the kilt with a breeze before returning home.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage uses a physical descent and return, but does not explicitly
    name an underworld.
- id: motif:3
  label: postmortem punishments and differentiated dead
  taxonomy_refs: []
  basis: The traveler sees wicked people destroyed in smoke, skeletons carrying burdens
    as punishment, and chiefs who had been good in this world.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not identify a judging deity or formal court of judgment.
- id: motif:4
  label: dead as light cloud beings connected with rain
  taxonomy_refs:
  - seasonal_cycle
  basis: Skeletons eat only odor and steam, are not heavy, become clouds, and are
    connected with raindrops through funerary wrapping instructions.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The seasonal-cycle taxonomy is only a broad fit; the passage focuses on
    clouds and rain rather than a full seasonal cycle.
- id: motif:5
  label: dangerous skeleton woman as deceptive host or spouse
  taxonomy_refs:
  - shapeshifter
  basis: The hunter first encounters a pretty woman in a kiva; she is identified as
    Skeleton Woman and later appears dancing as a skeleton while calling him her husband.
  evidence_refs:
  - ev:5
  - ev:6
