canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi narratives: a chief''s son undergoes
    ritual death, journeys westward to Skeleton House, observes conditions of the
    dead, and returns to life; a poor hunter escapes a Skeleton Woman with aid from
    cricket dancers; Masauwuu courts and marries a maiden; Masauwuu is disturbed by
    Hano hunters and gains a bloody head; and two skeleton-like Yayaponchatu trade
    broom grass for tobacco in Oraibi kivas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's son in Shongopavi repeatedly looks toward the graveyards and wonders
    whether the dead continue to live somewhere.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Badger Old Man uses medicine and a white floor covering to make the young
    man appear dead; the medicine is put in his mouth, ears, and on his heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dying, the young man sees and follows a westward path toward Skeleton
    House.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a steep bluff, a chief places the young man on his kilt and throws the
    kilt over the precipice, where it descends slowly as if flying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Skeleton Woman tells the young man that smoke comes from a place where wicked
    people are thrown in and destroyed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Skeleton House, skeleton people gather to look at the living visitor and
    take him to the Bear Clan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man cannot climb a ladder whose rungs are made of sunflower stems
    because the first rung breaks under him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The skeletons eat only the odor and steam of food, and the passage says this
    explains why the dead, transformed into clouds, can float in the air.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The skeletons tell the young man to return because his flesh is still too
    strong, and they instruct him about offerings and burial wrapping related to rain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The young man sees some skeletons carrying mealing stones or cactus bundles
    as punishment and also sees chiefs who had been good in this world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The young man returns by riding the kilt upward with the help of a breeze,
    re-enters his body, comes to life again, and reports what he saw.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A poor young man without moccasins is given hunting equipment and instructions
    by older men before he follows rabbit tracks and kills a jack-rabbit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The hunter encounters a pretty woman in a kiva at night; she gives him corpse
    brains and flies, which he pretends to eat, and the passage identifies her as
    Skeleton Woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The kiva opening is closed by threads stretched in many directions; when Skeleton
    Woman dances as a skeleton, the youth cuts the threads and escapes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Cricket dancers hide the youth by rubbing clay over his body and including
    him in their dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Masauwuu appears as a handsome young man to a maiden who refuses marriage,
    and she promises to marry him after they converse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: A tray of muhpfki and rabbit meat are exchanged between the maiden's household
    and Masauwuu's grandmother, and Masauwuu takes the maiden to his grandmother's
    house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Hano hunters disturb Masauwuu while pursuing a rabbit; he runs into rock several
    times, perforating his head so that blood streams down.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The Yayaponchatu are described as skeleton-like, white, disheveled-haired
    beings who understand fire.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:20
  text: Two Yayaponchatu trade bundles of broom grass for native tobacco in Oraibi
    kivas and then smoke tobacco in the village.
  category: action
  evidence_refs:
  - ev:9
