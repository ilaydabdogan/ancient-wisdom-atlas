candidate_motifs:
- id: motif:1
  label: Ritual imitation ending in death
  taxonomy_refs:
  - trickster_boundary
  basis: Coyote imitates Katcina performance by assembling costumes and dancers, but
    the costumed coyotes are unable to flee and are killed.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the imitation and deaths but does not explicitly moralize
    the act as boundary crossing.
- id: motif:2
  label: Etiology of communal prey-eating
  taxonomy_refs: []
  basis: Coyote calls other coyotes to share a rabbit, and the narrative explains
    that Coyote never eats prey alone.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy family directly matches this etiological food-sharing
    pattern.
- id: motif:3
  label: Serpent predator reaches protected nest
  taxonomy_refs:
  - serpent
  basis: The Bull-snake reaches a bluff nest after repeated attempts and devours the
    young birds.
  evidence_refs:
