canonical_text:
  quote: ''
  summary: 'The passage contains brief Hopi animal narratives: Coyote imitates Katcina
    dances and his costumed followers are killed; Coyote shares prey with other coyotes;
    Bull-snake kills young wrens and then the parent bird; snakes seek help from locusts
    to end deadly snow; Squirrel and Chipmunk raid an orchard; Fox wins a fatal sunrise
    song contest with Cooyoko; gray and brown mice quarrel over food; and small underground
    people heal a hunter''s broken leg, arousing Badger''s jealousy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote observes Katcina dances, calls other coyotes, instructs them to gather
    feathers, and has Katcina costumes prepared in his kiva.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The costumed coyotes dance at Coyote's house, but Oraibi people close in on
    them; the costumes slow them, and all are killed except Coyote and his family,
    who had not put on costumes or masks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A coyote kills a rabbit and calls differently colored coyotes from different
    quarters to eat it together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrative gives an etiological explanation that Coyote does not eat prey
    alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Bull-snake tries repeatedly to climb to a wren nest, fails three times,
    reaches it on the fourth attempt, and devours four young birds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bull-snake later draws the old bird toward its mouth by repeated strong
