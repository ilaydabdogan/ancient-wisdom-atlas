canonical_text:
  quote: ''
  summary: At a shrine, Muyingwa and his sister Nayangap Wuhti receive Ahdli and the
    Katcin-mana, who bring prayer-offerings and ask for rain and crops for the people.
    Ahdli gives colored corn seeds; the female deity throws a seed-filled squash upon
    them and says the seeds are planted for the people. Muyingwa gives ritual objects
    to the Katcina for producing rain and crops. After returning to the village kiva,
    Ahdli and a youth smoke and pray over the objects until moisture appears. The
    next morning the Katcina and mana make another offering at a Mho shrine while
    hearing the same singing voice from the mesa.
  language: English
  quote_policy: summarized
