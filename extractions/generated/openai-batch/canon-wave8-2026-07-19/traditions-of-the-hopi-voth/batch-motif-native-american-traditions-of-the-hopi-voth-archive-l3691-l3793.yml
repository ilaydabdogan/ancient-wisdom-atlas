canonical_text:
  quote: ''
  summary: The passage first concludes a prior account in which Katcinas and rain
    clouds depart, the people find their houses filled with food, and a maiden later
    dies after longing for Kfshiwu. It then begins the story of how Ball-Head, a young
    man living with his grandmother north of Orafbi, courts a maiden who had refused
    many suitors. He visits her at night, brings sweet corn, is accepted by her and
    her family, and after several days of her corn-grinding she follows him to his
    house with white meal, where his grandmother welcomes her.
  language: English
  quote_policy: summarized
