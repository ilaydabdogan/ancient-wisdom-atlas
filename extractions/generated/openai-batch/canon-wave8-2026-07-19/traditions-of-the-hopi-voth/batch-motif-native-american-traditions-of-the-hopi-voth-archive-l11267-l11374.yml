canonical_text:
  quote: ''
  summary: The supplied passage contains the end of a tale in which Awat Mc£na watches
    her father’s corn-field, encounters singing and dancing Grasshoppers in a wash,
    promises them one division of the field for another dance, and then sees them
    consume the corn beyond that limit. Her father follows and punishes the Grasshoppers,
    and the narration explains their later dispersal. The passage then begins a tale
    in which thirsty black Beetles in drought plan a dance to bring rain; their chief
    makes four nakwakwosis, speaks to clouds in the San Francisco mountains, and the
    Beetles paint themselves black and dance.
  language: English
  quote_policy: summarized
