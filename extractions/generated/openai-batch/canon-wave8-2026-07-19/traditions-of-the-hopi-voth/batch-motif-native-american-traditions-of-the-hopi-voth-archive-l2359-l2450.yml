canonical_text:
  quote: ''
  summary: A group of youths remain in a kiva for four days under nightly care, are
    washed, costumed, and ritually painted by the Hawk-man, then emerge with singers
    to a plaza. The Yayaatu perform disruptive actions through the village, undergo
    an oven ordeal in which they are drawn out dead and resuscitated in the kiva,
    produce watermelons and rabbits from covered bundles, recover hidden strings,
    and reveal and restore a split water-jug bearing cloud symbols.
  language: English
  quote_policy: summarized
