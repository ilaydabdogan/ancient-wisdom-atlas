canonical_text:
  quote: ''
  summary: The selected passage includes the end of one Badger-and-Mice episode, the
    tale “The Badger and the Small Gray Mice,” and the beginning of “The Mice, the
    Owl, and the Hawk.” Mice escape a weakened Badger and become scattered across
    the country, with explanations for their holes, crop-eating, and secret care for
    sick Hopi away from villages. A separate tale describes Badger and Small Gray
    Mice as former Hopi and rival doctors; Badger tests Mouse by fasting, and Mouse
    diagnoses him through song-medicine. A third tale begins with a Mouse threatened
    by an Owl; the Mouse sets pointed sticks around its hole, kills the Owl, and organizes
    a feather dance with neighboring Mice.
  language: English
  quote_policy: summarized
