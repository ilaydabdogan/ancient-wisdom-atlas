  evidence_refs:
  - ev:10
  confidence: high
  cautions: No supplied motif-family taxonomy directly matches ritual spring creation.
- id: motif:8
  label: Moral decline leading to warfare and fortified settlement
  taxonomy_refs: []
  basis: The parties become bad, contend, wage war over possessions, and build villages
