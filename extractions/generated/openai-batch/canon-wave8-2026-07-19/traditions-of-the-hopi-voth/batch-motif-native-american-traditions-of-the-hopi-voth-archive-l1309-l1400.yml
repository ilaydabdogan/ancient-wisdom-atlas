candidate_motifs:
- id: motif:1
  label: Origin of linguistic diversity through a speaking bird
  taxonomy_refs: []
  basis: Mockingbird, described as able to talk everything, gives different languages
    to different parties at the chief's request.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives an etiological explanation for languages but no supplied
    taxonomy reference directly names a language-confusion or language-origin motif.
- id: motif:2
  label: Foodway origins through unequal selection of corn-ears
  taxonomy_refs: []
  basis: Groups choose corn-ears of different lengths; the Hopi receive the small
    ears that become true corn, while others receive seed grasses.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The selection is an origin explanation for subsistence differences; it
    is not explicitly framed as exchange, judgment, or punishment.
- id: motif:3
  label: Departure and scattering of peoples after emergence
  taxonomy_refs:
  - departure
  basis: The parties are ready to start, form groups under chiefs, travel eastward,
    stop at places, and scatter over the country.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage mentions items brought from the under-world but does not narrate
    the original emergence itself in this line range.
- id: motif:4
  label: Elder brother at the sunrise with promised future return
  taxonomy_refs:
  - return
  basis: The elder brother goes to the sunrise and is to come back if the Hopi again
    fall into trouble caused by Powakas.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The actual return is conditional and not narrated in this passage.
- id: motif:5
  label: Fitted marked stones as tokens carried by migrating parties
  taxonomy_refs:
  - covenant
  basis: Each party carries a marked stone with figures that fitted together, in the
    context of agreements among the parties and the elder brother.
  evidence_refs:
