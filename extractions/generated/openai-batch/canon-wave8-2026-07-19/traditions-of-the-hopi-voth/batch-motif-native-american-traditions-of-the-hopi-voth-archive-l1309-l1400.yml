canonical_text:
  quote: ''
  summary: The passage describes a Hopi chief arranging the differentiation of languages
    through Mockingbird, distributing corn-ears that determine later foodways, and
    sending an elder brother eastward to the sunrise with a promised future return
    if the Hopi fall again into trouble. Migrating parties carry marked stones, are
    accompanied by an old woman, travel through the country, settle temporarily, create
    springs with a buried vessel, and eventually experience conflict. Spider Woman
    creates horses and burros for the White Men. Some clans derive their names from
    a dead bear found during migration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Hopi chief asks Mockingbird, described as one who talks everything, to
    give different languages to different people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people eat a common meal, and the chief lays out many corn-ears of different
    lengths brought from the under-world for the groups to choose before departure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other named groups struggle for the longest corn-ears, leaving the small ears
    for the Hopi; the chief says the small ears will be the Hopi food and that the
    long ears will be grasses with seed.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The chief and his elder brother agree that the elder brother will go ahead
    toward the sunrise, touch the sun at least with his forehead, and remain where
    the sun rises.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Each migrating party is accompanied by a So Wuhti and carries a marked stone
    with figures that fitted together.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The parties agree that if the Hopi again get into trouble as in the lower
    world, the elder brother should return, discover the Powakas who caused the trouble,
    and cut off their heads.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The elder brother and his party start first and become the White Men while
    traveling eastward; the chief and his party start next, taking a southern route.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A maiden identified as a Powaka, left behind at the opening, follows the two
    parties after they leave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Different parties follow different chiefs eastward, stop for varying periods,
    and their stopping places are given as the reason for many ruins in the country.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Spider Woman, traveling with the White Men, makes horses and burros for them
    so that they can travel when tired and move faster.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Some parties create springs in places with good fields but no water by burying
    a small perforated vessel containing herbs, stones, shells, a small balolookong,
    bahos, and other items.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After a year, a spring is said to come out where the vessel was buried; meanwhile
    the parties use rainwater because they know how to create rain.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Before reaching the Hopi homeland, parties become bad, contend with one another,
    wage war, and build villages on bluffs and mesas out of fear.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Several clans arriving at Muenkapi derive their names from a dead bear encountered
    during travel.
  category: relationship
  evidence_refs:
  - ev:12
