- id: motif:6
  label: Beneficent creation of travel animals
  taxonomy_refs:
  - culture_hero
  basis: Spider Woman makes horses and burros for the White Men so they can travel
    when tired and move faster.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents Spider Woman as a maker of useful animals but does
    not explicitly label her as a culture hero.
- id: motif:7
  label: Ritual creation of springs by burying a prepared vessel
  taxonomy_refs: []
  basis: Migrating parties create springs by burying a perforated vessel containing
