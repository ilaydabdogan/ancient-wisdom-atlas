- id: motif:4
  label: deity ascends through layered kivas bringing rain
  taxonomy_refs:
  - ascent
  basis: Muyingwa ascends successively through kivas; each stage is associated with
    rain around Orafbi, culminating in renewed grasses and herbs.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes ascent within kivas, not an ascent to a sky realm.
- id: motif:5
  label: return after drought and renewed vegetation
  taxonomy_refs:
  - return
  basis: After rain and vegetation return, the parents and other people return to
    Orafbi.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The motif is local to social return after famine; it is not presented
    as a full cyclical seasonal myth.
- id: motif:6
  label: failed acquisition of hair through adhesive disguise
  taxonomy_refs: []
  basis: Kalitoto tries to add hair to his head using pitch and cactus juice, but
    each attempt fails and the final pitch attempt leads to his death.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not identify Kalitoto’s being-type or provide an explicit
    moral.
- id: motif:7
  label: child taken by owl and transformed
  taxonomy_refs:
  - shapeshifter
  basis: A child carried by a Large Owl develops owl features and ultimately flies
    away as an Owl after the return condition is broken.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The transformation may be involuntary rather than self-directed shapeshifting.
- id: motif:8
  label: broken four-day condition prevents human restoration
  taxonomy_refs:
  - initiation
  basis: The Owl prescribes four days of confinement before sunrise release so the
