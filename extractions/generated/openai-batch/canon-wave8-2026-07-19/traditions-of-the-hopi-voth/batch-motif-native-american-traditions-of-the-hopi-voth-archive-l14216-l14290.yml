- id: motif:3
  label: messenger to hidden growth deity restores food and rain
  taxonomy_refs: []
  basis: The Humming-bird reaches Muyingwa in a kiva, reports the famine, receives
    corn, and Muyingwa’s ascent is followed by rain and plant growth.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader comparative identification is asserted beyond the described
