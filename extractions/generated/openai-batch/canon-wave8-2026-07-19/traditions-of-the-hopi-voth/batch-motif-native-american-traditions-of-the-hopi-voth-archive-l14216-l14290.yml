canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi tale episodes: an Orafbi drought in
    which abandoned siblings are aided by an animated Humming-bird that reaches Muyingwa
    and brings rain and food; Kalitoto’s failed attempts to acquire hair; a crying
    child carried to an owl cave and transformed after a four-day condition is broken;
    and a Walpi man who misses a dance while observing children and lizards, leading
    to a song name.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Orafbi has no rain for five years, the people leave, and only a little boy
    and girl remain in the village.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brother makes a little bird from the pith of a sunflower stalk for his
    sister; when she throws it upward, it becomes a Humming-bird and flies away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Humming-bird returns through an opening in the wall and brings corn ears
    to the children over several days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Humming-bird finds a cactus plant with one red blossom, removes it, enters
    an opening, and passes through kivas containing grass, herbs, corn, and pollen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Muyingwa, described as the god of Growth and Germination, lives in the third
    kiva; the Humming-bird reports Orafbi’s hunger and asks him to come out and look
    after things.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Humming-bird carries corn to the children and later finds their emaciated
    father and mother to the north.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Muyingwa ascends through the kivas in stages, and rain falls increasingly
    around Orafbi; grasses and herbs grow, the people return, and the children later
    become village chiefs and owners of Orafbi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kalitoto is teased by children because of his head, tries to attach found
    hair with pitch and later cactus juice, and finally dies of hunger when pitch
    on his head adheres to the floor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A mother threatens a crying child with the owl, drags the child outside, and
    a Large Owl carries the child to a cave where owl children live.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men passing the Owl’s cave see the child developing owl features, including
    feathers, white spots, and yellow eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Owl says the child must be kept locked in a room for four days and released
    at sunrise on the fourth day to become Hopi again; if the door is opened sooner,
    the child will remain Owl and return.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother opens the room early, and an Owl rushes out and flies back to the
    place from which it came.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man from Walpi, going to a dance at Shongopavi, stops after seeing children
    hunting lizards and later watching little lizards making sounds and playing; he
    returns without seeing the dance, and the song is thereafter called the Mishongnovi
    Song.
  category: sequence
  evidence_refs:
  - ev:8
