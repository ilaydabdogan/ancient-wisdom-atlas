  text: A small made being is sung over, becomes alive, is identified as Tohcha, and
    asks why it is wanted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs say their children are not good-hearted, that they are living in
    trouble, and that they want a messenger to go upward and find whether someone
    kind and good is there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tohcha flies upward, circles around two trees, passes through an opening,
    finds nobody, becomes exhausted, returns, and reports finding no one.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A larger made being is sung over, becomes alive as a Hawk, is sent upward
    for the same purpose, passes through the opening, circles above it, finds nobody,
    and returns exhausted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: A third made being becomes alive as Motsni; the chiefs ask it to go upward
    and find someone kind, gentle, and good-hearted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Motsni flies through the opening, looks about, finds the place where Oraibi
