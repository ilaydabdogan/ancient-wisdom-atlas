canonical_text:
  quote: ''
  summary: The chiefs create and animate successive bird messengers by singing over
    them. A small Tohcha and then a Hawk fly upward through an opening but find no
    one and return exhausted. A third messenger, Motsni, flies upward, reaches the
    place later called Oraibi, and meets Skeleton, who says he lives in poverty but
    welcomes the people if they will share that life. Motsni reports this to the chiefs,
    who are pleased and decide to go up.
  language: English
  quote_policy: summarized
