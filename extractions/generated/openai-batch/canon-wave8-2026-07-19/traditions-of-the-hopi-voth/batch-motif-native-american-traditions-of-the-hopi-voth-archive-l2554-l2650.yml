canonical_text:
  quote: ''
  summary: At Palatkwapi, young men mistreat others, and an old Batki man reports
    the abuse to the village, crier, and warrior chiefs. The village chief decides
    that the people will move away. The chief, also described with his son as a sorcerer,
    prepares his son with multiple masks, corpse-finger wrist rattles, and a cedar-bark
    fuse, then sends him to set pine timber on fire. The son repeatedly returns secretly,
    acts as a ghost, grinds corn, sings, and escapes watchers. On the fourth night,
    a weak orphan watching near the water catches him; the people take him to a kiva
    and see a Yahponcha sitting there, matching the father’s prediction that he would
    be captured on the fourth night.
  language: English
  quote_policy: summarized
