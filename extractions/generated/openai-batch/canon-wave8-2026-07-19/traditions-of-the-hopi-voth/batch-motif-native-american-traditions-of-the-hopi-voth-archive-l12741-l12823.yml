canonical_text:
  quote: ''
  summary: The passage recounts Spanish demands on the Hopi, including labor and food
    contributions, the forbidding of Katcina dances and bahos, drought and renewed
    secret ceremonies, deliberation in council, the killing of a padre by members
    of the Badger clan, removal of Spanish property, and the restoration of dances
    and altar performances in kivas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Spaniards brought cattle, and some Hopi bought calves with corn; gentle
    cattle were used to drag logs to the village for the Spaniards.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For four years conditions are described as going well, with frequent rain
    and water in cisterns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the fifth year priests began forbidding Katcina dances and the making of
    bahos, while demanding attendance at meetings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: That fifth year is described as very warm and dry, and the Hopi planted little.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chiefs held council and decided to try making bahos for the clouds again,
    following Hopi custom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fraternities again held ceremonies with altars, made bahos secretly, and deposited
    prayer-offerings in different directions, but rain did not come.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hopi arranged a Katcina dance; after the dance, it rained a little.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The padres continued to demand labor and food and are said to have disregarded
    Hopi religious feelings and violated Hopi women and maidens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Hopi met in council in the Nashebe, the chief's kiva, to discuss killing
    the padre while his assistants were away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After others hesitated, the Badger clan volunteered to go kill the padre.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Badger clan members went to the Mission, forced entry after knocking,
    seized the padre, dragged him out, threw him down, and cut his throat.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The corpse was carried eastward down the mesa, thrown into a gulch, and covered
    with stones.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The killing in Oraibi is described as the signal for other villages to get
    rid of padres at their mesas.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: After no Spaniards came to punish them, the Hopi destroyed Spanish houses,
    divided their logs and timbers, and used them for kivas.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: From that time onward the Hopi again held dances and sacred altar performances
    in their kivas.
  category: sequence
  evidence_refs:
  - ev:14
