canonical_text:
  quote: ''
  summary: The passage first describes Batki people mixing meat from Bdldldokong into
    paint for bahos, after which thunder and rain increase. It then recounts two brothers,
    sons of Thunder, leaving under a hunting pretext, receiving war instruction from
    C6tukvnangi, killing Apache enemies with lightning and thunder, returning with
    trophies, appointing a war chief by throwing a scalp at him, and conducting war
    rites involving a cloud symbol, bear skin, corn meal, seclusion, and a public
    dance.
  language: English
  quote_policy: summarized
