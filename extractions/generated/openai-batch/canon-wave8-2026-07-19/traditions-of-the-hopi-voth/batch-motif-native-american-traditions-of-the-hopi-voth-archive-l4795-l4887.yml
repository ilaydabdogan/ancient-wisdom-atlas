canonical_text:
  quote: ''
  summary: In an episode about work in a father-in-law's corn-field, Pdokong/P6okong
    plants one grain per hill, repeatedly misunderstands Spider Woman's hoeing instructions,
    and the field is ultimately cleared when clouds bring rain and runoff covers the
    weeds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pdokong puts one grain of corn into each hole made with his planting stick
    and tells the other planter to use only one grain rather than many.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After planting, the remaining corn has not been used up because it has increased;
    the planted corn grows with rain, and grass and weeds also come up.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spider Woman tells Pdokong that a son-in-law should help hoe his father-in-law's
    field and describes making 'ant hills' while hoeing; Pdokong instead collects
    real ants and earth and scatters small ant hills through the corn-field.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spider Woman rebukes Pdokong and explains that the 'ant hills' meant small
    piles formed by hoeing, then tells him to expose moist ground by removing dry
    surface and cutting weeds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pdokong asks for fat or tallow, takes it to the field, scatters it through
    the corn-field because the Hopi expression is the same, and returns without hoeing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father-in-law is sad because repeated visits to the field show no work
    done, grass and weeds growing, and the corn becoming dry and wilted.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Spider Woman asks the clouds to hoe the field of her grandchild; clouds form,
    rain falls, water runs through the field, and sand and earth cover the grass and
    weeds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the rain, the old man says the floods have cleaned the field, and the
    two return home.
  category: speech
  evidence_refs:
  - ev:6
