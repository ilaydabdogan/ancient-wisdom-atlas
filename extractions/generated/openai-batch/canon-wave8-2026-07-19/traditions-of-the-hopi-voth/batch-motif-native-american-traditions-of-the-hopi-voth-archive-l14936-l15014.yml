  category: object
  evidence_refs:
  - ev:5
- id: obs:15
  text: One prayer-offering is deposited among trees and high grass in the San Francisco
    Mountains, after which a growing light is seen there on successive nights.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:16
  text: The fire spreads toward the Hopi village while people continue gambling and
