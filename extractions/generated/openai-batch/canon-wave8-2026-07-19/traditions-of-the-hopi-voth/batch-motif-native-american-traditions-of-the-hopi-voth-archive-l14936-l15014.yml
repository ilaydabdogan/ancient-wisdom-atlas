canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi narratives: an Oraibi maiden encounters
    dancing grasshoppers who bargain for corn and then consume the field; beetles
    perform a rain-making dance; ants undergo a Katcina initiation that explains their
    narrow waists; Lavovolvipiki and Ndnvovolpiki hold a dance with mouse maidens
    and are eaten by Pookongs; and the village of Pivanhonkapi is destroyed by a supernatural
    fire while Oraibi is protected by Spider Woman''s wet web.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father tells his daughter to watch the field; she hears singing in a hollow
    and later sees little beings dancing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grasshoppers stop dancing when they notice the maiden and resume only
    after she offers them one division of the corn-field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dancing, the grasshoppers fly to the corn-field and eat beyond the agreed
    limit until all the corn is gone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The father follows the grasshoppers, finds them asleep, kills many with a
    stick, destroys their houses, and some escape.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: During heat and lack of rain, thirsty beetles suffer, and their chief proposes
    a dance and song to bring rain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The beetle chief makes four nakwakwosis, deposits them west of the village,
    and asks clouds in the San Francisco Mountains to bring water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The beetles paint their bodies black, dance, and sing; clouds come and rain
    falls so they can drink.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The chief of the ants announces a Katcina initiation; ants dress as Katcinas,
    a sand picture is made in the kiva, and ant children are brought in.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Katcinas flog the little ant children so hard that they almost cut through
    the middle of their bodies, explaining why ants are thin in the middle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Lavovolvipiki and Ndnvovolpiki arrange a dance with mouse maidens, a borrowed
    drum, songs, and overnight practice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Each mouse maiden has an eagle feather tied to her head and a red dot on each
    cheek during the dance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Pookongs come hunting during the dance; each shoots a mouse, and the Pookongs
    eat Ndnvovolpiki and Lavovolvipiki.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The chief of Pivanhonkapi is troubled by his people's degeneration and gambling
    and asks the Yayaponchatu to punish them, choosing fire rather than storm.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Yayaponchatu dancers carry prayer-offerings with sparks of fire over the husk
