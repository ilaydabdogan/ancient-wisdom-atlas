canonical_text:
  quote: ''
  summary: 'The passage contains several brief Hopi narrative summaries: a blind man
    and a cripple cooperate during flight from an earthquake and are healed after
    elk eyes burst on a fire; friends exchange goat meat and meals; children negotiate
    bird-trapping rights with food; a clay jug child emerges as a hunter; Crow acts
    as an evil sickness-bringing power; and Coyote deceives a maiden by stealing Rain
    Deity''s costume before being killed by lightning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An earthquake at Oraibi frightens the people, and they run north.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A blind man and a cripple arrange to flee together: the blind man carries
    the cripple, and the cripple shows the way.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pair encounter an elk; the cripple aims for the blind man, and the blind
    man shoots and kills it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: They dig out the elk's eyes, heat them on a fire, and the eyes burst with
    a loud report.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the bursting of the heated eyes, the lame man can walk and the blind
    man can see.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Big Head receives half of a goat from Goat Horn; the passage presents this
    as the reason Hopi cut up goats when they kill them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kavushkavuwnom and Shoviviounom meet while getting water, invite each other
    to meals, and exchange prepared foods and visits.
