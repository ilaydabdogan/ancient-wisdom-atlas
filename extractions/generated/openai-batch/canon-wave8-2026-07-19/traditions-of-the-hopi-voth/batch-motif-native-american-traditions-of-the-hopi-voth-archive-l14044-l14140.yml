candidate_motifs:
- id: motif:1
  label: mutual aid by impaired companions during communal flight
  taxonomy_refs:
  - departure
  basis: 'The blind man and cripple flee after the earthquake by combining abilities:
    one carries and the other guides.'
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage emphasizes cooperative flight
    more than a formal departure quest.
- id: motif:2
  label: healing transformation through fire-heated animal eyes
  taxonomy_refs: []
  basis: The elk eyes burst on the fire, after which the lame man walks and the blind
    man sees.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No explicit cause is explained beyond the immediate sequence.
- id: motif:3
  label: etiology of goat-cutting custom
  taxonomy_refs: []
  basis: The passage states that Big Head receiving half a goat is the reason Hopi
    cut up goats when they kill them.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only a brief etiological summary.
- id: motif:4
  label: reciprocal food visiting between friends
  taxonomy_refs: []
  basis: Two women repeatedly invite each other, prepare foods, eat, converse, and
    return home.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The episode is social and etiological or ritual implications are not stated
    in the passage.
- id: motif:5
  label: food payment for shared resource access
  taxonomy_refs: []
  basis: Children gain permission to trap birds at a spring by giving food to the
    children who first deny access.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not identify the exchange as sacred or ceremonial.
- id: motif:6
  label: miraculous child born as clay jug and emerging as hunter
  taxonomy_refs:
  - miraculous_child
  basis: The child is born as an earthen jug with a boy inside and later emerges as
    a Hopi youth who successfully hunts rabbits.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not provide a ritual explanation for the jug birth.
- id: motif:7
  label: malign bird spirit causing sickness and moral corruption
  taxonomy_refs: []
  basis: Crow impersonates sickness, causes illness and death, and influences people
    to steal.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Crow's exact ontological status is summarized as a spirit of evil in the
    section title, but details remain brief.
- id: motif:8
  label: weak counter-power opposing a stronger evil influence
  taxonomy_refs:
  - duality
  basis: An unknown power tries to counteract Crow but is weaker, and manifests as
    a sudden shock.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The duality reference is general; the opposing figure is unnamed and little
    described.
- id: motif:9
  label: directional cloud suitors rejected by maiden
  taxonomy_refs: []
