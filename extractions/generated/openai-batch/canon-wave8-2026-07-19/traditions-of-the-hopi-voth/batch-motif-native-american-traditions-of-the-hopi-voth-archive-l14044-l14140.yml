- id: obs:8
  text: Children from Pivanhonkapi give food to children from Hukovi to obtain permission
    to trap birds at a spring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Hano woman makes an earthen jug and bears a child described as an earthen
    jug with a little boy inside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The jug youth breaks open while chasing a rabbit, and a Hopi comes out; he
    then kills four rabbits and brings them home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Crow lives near sun shrines, watches corn planting, visits corn first when
