canonical_text:
  quote: ''
  summary: The passage contains the end of one Hopi tale and the beginning of another.
    In the first, Grasshopper Old Man goes to plant, deceives Coyote with a false
    fear that a field booth may fall, sends his family to the Deer, and Coyote pursues
    them. In the Deer’s kiva, Deer kill Coyote by tossing him with their horns. Grasshopper’s
    children then scatter, explaining why grasshoppers are found everywhere. In the
    next tale opening, three maidens tend a crop; Coyote desires them and asks his
    grandmother whether to go to them. She advises him to gather a bow, quiver, colored
    yarns, clothing, and red ochre.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Grasshopper Old Man and his wife live at Grasshopper Bluff, have children,
    and are described as great friends with Coyote, who lives at Ishmovala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At planting time, Grasshopper asks his wife to prepare food and water, carries
    these with seed to his field, waits for helpers who do not come, eats alone, and
    plants alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Grasshopper rests in his field booth with his feet against it and tells Coyote
    he is afraid the booth may fall on him; Coyote then lies beside him in the same
    posture.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grasshopper leaves Coyote in the booth under pretext of getting more water,
    goes home, and sends his children ahead to their uncle, the Deer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote eventually lets go of the booth, sees that it does not fall, says Grasshopper
    lied to him, and decides to go eat Grasshopper’s children.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Coyote finds Grasshopper’s house empty, sees tracks leading northeast, and
    follows them to the Deer’s house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the Deer’s kiva, Coyote is repeatedly invited to come down; after entering,
    he sees the wife and children and is tossed upward by two Deer with their horns
    until he dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Coyote’s death, the Deer tell the Grasshoppers they may go out safely;
    the mother tells the children to go where they want, and they scatter flying in
    all directions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator explains that the children’s scattering is why grasshoppers are
    now found everywhere rather than in one place.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the next tale opening, three maidens with parents live at Piñcatsva and
    go from there to watch their crop at Howakapchomo.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Coyote at Ishmovala has eaten watermelons but desires the three maidens.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Coyote asks his grandmother whether he should go south for the maidens, and
    she says they likely will not want him but instructs him to gather specified items
    from the village.
  category: speech
  evidence_refs:
  - ev:8
