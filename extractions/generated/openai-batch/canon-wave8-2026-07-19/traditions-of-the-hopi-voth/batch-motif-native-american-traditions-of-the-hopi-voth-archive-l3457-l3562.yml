canonical_text:
  quote: ''
  summary: The passage describes the three Circle Katcinas encountering Hahaii Wuhti
    figures in kivas, being fed, dancing and singing, and eventually recovering their
    mother at Kfshiwuu. Afterward the father sends the children ahead, kills his wife,
    and is pursued by her skeleton through several Hopi villages and ceremonial settings
    until the skeleton dives into a spring after mistaking a reflection for him and
    disappears.
  language: English
  quote_policy: summarized
