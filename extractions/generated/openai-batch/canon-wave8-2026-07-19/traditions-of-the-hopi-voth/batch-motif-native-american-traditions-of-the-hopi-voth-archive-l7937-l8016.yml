canonical_text:
  quote: ''
  summary: Spider Woman and her helpers defeat Hasohkata in contests involving hidden
    cups and hard brush, free the captive young man, take the captor's possessions,
    and kill Hasohkata. Spider Woman later learns through Wren that the young man's
    parents long for him, carries him down to earth by a spider-web thread through
    an opening, and he is recognized and reunited with his family.
  language: English
  quote_policy: summarized
