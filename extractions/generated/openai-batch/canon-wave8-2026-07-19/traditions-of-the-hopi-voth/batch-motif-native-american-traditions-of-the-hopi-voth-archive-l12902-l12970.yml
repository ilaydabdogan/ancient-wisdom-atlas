canonical_text:
  quote: ''
  summary: The passage summarizes Hopi emergence and wandering traditions. People
    living below become morally disordered, chiefs seek an exit, birds or made beings
    scout upward, a flood destroys many, plants or reeds are grown as ascent paths,
    and people emerge through an opening. Mocking-bird sings and assigns places and
    languages. Other episodes include accusation by a meal-ball test after a death,
    encounter with Skeleton and a mask near a warmed field, manufacture and skyward
    casting of moon and sun symbols, division of peoples and migrations toward sunrise,
    and a second variant in which made scouts and Motsni find Skeleton near Oraibi
    before the people climb a reed.
  language: English
  quote_policy: summarized
