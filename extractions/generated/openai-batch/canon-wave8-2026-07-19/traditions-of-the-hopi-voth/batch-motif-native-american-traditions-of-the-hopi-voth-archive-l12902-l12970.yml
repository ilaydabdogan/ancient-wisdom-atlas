  locator: 12902-12970; second account, climb and accusation
  quote_or_summary: Those whose hearts are not very bad gather and climb the reed,
    led by the Village Chief. The Village Chief pulls up the reed, tells the people
    to live with a single heart, and after his son sickens and dies throws a fine
    meal ball that lands on a maiden whom he accuses.
