- id: motif:9
  label: hospitality from Skeleton near cultivated warmth
  taxonomy_refs: []
  basis: Skeleton, found by a fire-warmed field, feeds the messenger and invites the
    people to come and live with him.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage provides little explanation of Skeleton’s identity or symbolic
