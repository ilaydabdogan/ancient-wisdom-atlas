  type: summary
  locator: 12902-12970; first emergence account, Skeleton and warmed field
  quote_or_summary: With no sunshine, a messenger follows distant light and finds
    a planted field warmed by surrounding fire, a handsome man named Skeleton, and
    an ugly mask. Skeleton feeds the messenger, invites the people, and they later
    make fields and harvest.
