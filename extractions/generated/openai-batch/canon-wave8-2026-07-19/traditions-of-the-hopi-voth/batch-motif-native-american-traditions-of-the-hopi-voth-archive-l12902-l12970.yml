candidate_motifs:
- id: motif:1
  label: emergence from a lower world through an opening
  taxonomy_refs:
  - ascent
  basis: Both accounts describe people living below and climbing upward through an
    opening after scouts locate or test the way.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is a summarized ethnographic outline rather than a full narrative
    performance.
- id: motif:2
  label: plant or reed as vertical passage between worlds
  taxonomy_refs:
  - sacred_tree_axis
  basis: Pines, a looqo tree, and especially reeds are used or attempted as supports
    reaching from below to the upper opening.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The available taxonomy has tree but not reed as a symbol; the motif family
    assignment is based on the plants’ connecting function.
- id: motif:3
  label: destructive flood preceding emergence
  taxonomy_refs:
  - flood_and_renewal
  basis: In the first account, chiefs cause a great flood during the departure crisis,
    and many people are destroyed before the emergence proceeds.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: Only the first account in the passage includes the flood; the renewal
    aspect is inferred from the subsequent emergence, not explicitly named.
- id: motif:4
  label: bird or animated scout sent to find an upper world
  taxonomy_refs: []
  basis: Mdtsni, Mocking-bird, Pawaolcaya, Tuhcha, Hawk, and Motsni are sent or ascend
    to investigate the exit or the upper place.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: Different accounts assign success to different scouts.
- id: motif:5
  label: singer assigns places and languages at emergence
  taxonomy_refs:
  - culture_hero
  basis: Mocking-bird sings as people emerge, assigns them places, and gives them
    languages.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call Mocking-bird a culture hero; the
    motif label reflects the distribution of social order and language.
- id: motif:6
  label: ritual manufacture and skyward placement of celestial lights
  taxonomy_refs: []
  basis: The people make a moon symbol and a sun symbol from hide, cloth, rings, painting,
    and decorations, then cast them eastward into the sky to bring moonlight and sunlight.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No matching supplied taxonomy family directly names celestial-body creation.
- id: motif:7
  label: migration toward sunrise and division of peoples
  taxonomy_refs:
  - departure
  basis: After the sun rises, people decide to move toward sunrise and divide into
    White People, Hopi, and Pueblos, with later estrangement and conflict.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the division in summary form and includes ethnographic
    labels from the source text.
- id: motif:8
  label: test by thrown meal ball identifying an accused person
  taxonomy_refs:
  - divine_judgment
  basis: In both accounts, after a death the chief throws a fine meal ball upward;
    the person on whom it lands is accused and threatened with expulsion or being
    thrown down.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The judging force is not described as divine in the passage; the taxonomy
