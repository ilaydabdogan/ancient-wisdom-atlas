  rights_note: Public domain source; summarized evidence.
- id: ev:6
  type: summary
  locator: 12902-12970; first emergence account, celestial symbols and migrations
  quote_or_summary: The people make a moon symbol from a white buffalo-hide disk with
    a woman painted on it and throw it eastward into the sky. They then make a decorated
    sun symbol and cast it upward, bringing warmth and light. The peoples divide and
    move toward sunrise; a woman makes horses from body scales, her party arrives
    first, and stars fall.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized evidence.
- id: ev:7
  type: summary
  locator: 12902-12970; second account, made scouts and Motsni
  quote_or_summary: In the second account, people below become bad and chiefs seek
    escape. They make Pawaolcaya by singing over it. A looqo tree fails to reach up,
    but a reed reaches. Pawaolcaya, Tuhcha, and Hawk ascend and return exhausted;
    Motsni flies through the opening, reaches where Oraibi now is, and finds Skeleton,
    who welcomes the people if they will live with him.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized evidence.
