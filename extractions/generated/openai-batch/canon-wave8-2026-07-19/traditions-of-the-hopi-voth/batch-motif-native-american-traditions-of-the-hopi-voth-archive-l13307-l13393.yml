candidate_motifs:
- id: motif:1
  label: Human maiden marries a Katcina
  taxonomy_refs:
  - sacred_marriage
  basis: Both the Circle Katcina and Ball-Head summaries involve a human maiden who
    had refused suitors but marries a Katcina figure, with meal, corn, consent, and
    bridal preparations.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage is a compressed synopsis; it identifies Katcina husbands but
    does not explicitly label the union as sacred.
- id: motif:2
  label: Katcina parent and Katcina children
  taxonomy_refs:
  - divine_parent_child
  basis: The woman married to Circle Katcina bears two children who are themselves
    Circle Katcinas.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy term is broader than the passage wording; the passage says
    Katcina, not divine.
- id: motif:3
  label: Search for a missing or departed wife
  taxonomy_refs:
  - stolen_beloved
  - mystical_quest
  - return
  basis: Circle Katcina finds his wife gone, takes the children, traces her across
    named places, receives guidance from Hahai Wuhti figures, and brings her away
    after a dance.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The wife is said to go away with Hototo Katcina, not explicitly to be
    stolen or abducted.
- id: motif:4
  label: Dead wife returns as pursuing skeleton
  taxonomy_refs:
  - death_rebirth
  basis: After the wife is killed, her skeleton follows her husband through several
