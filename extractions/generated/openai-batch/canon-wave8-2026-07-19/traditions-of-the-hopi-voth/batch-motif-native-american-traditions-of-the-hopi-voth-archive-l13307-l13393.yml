canonical_text:
  quote: ''
  summary: 'The passage contains condensed summaries of Hopi Katcina narratives: a
    maiden marries Circle Katcina, is later killed and pursued as a skeleton before
    the couple become stars; Kokoshori Katcina takes a child to Kishiwu and later
    returns her with food and rain, after which she dies and lives at Kishiwu; Ball-Head
    Katcina marries an Oraibi maiden, uses chickens to grind corn, brings prosperity,
    and leaves after his wife goes astray.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden who had refused marriage meets a young man in a blue Hopi blanket;
    he later says he is the Katcina who dances.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden takes a tray of meal to meet the young man, and they go together
    to a kiva with many different Katcinas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man is identified as Circle Katcina, and the woman later bears two
    children who are Circle Katcinas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: While the husband is away, the mother goes to the edge of the mesa and goes
    away with Hototo Katcina.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Circle Katcina and the two children search for the mother and are hosted in
    kivas by Hahai Wuhti figures who provide food and information.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After the mother is found, the father sends the children onward and kills
    the wife by thrusting a stick into her throat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The skeleton of the wife follows the husband through several villages and
    kivas, where different groups try to hide him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Matovi, the Flute Society tells the man to hide on top of a sunflower stalk
    reflected in a spring; the skeleton dives into the water and disappears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the fourth day the woman comes out of the water dressed in a bridal costume;
    after ritual directions involving meal roads, the man and woman run and are said
    to be two stars.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kokoshori takes a crying child on his back to Kishiwu, where Katcinas are
    glad to see the child and provide food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Katcinas return the child to the parents' house while carrying food; it rains
    very hard, and food is distributed among the people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The maiden later becomes homesick for Kishiwu, dies, and is said to be living
    at Kishiwu.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ball-Head, wearing a mask, courts an Oraibi maiden who has refused all young
    men of the village, bringing corn ears and giving her corn to eat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Oraibi maiden grinds blue corn for four days and white corn on the fifth
    day before going with the young man to his grandmother with a tray of white meal.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: Ball-Head has chickens eat corn, sway to his singing and drum, and vomit meal
    into a tray, saving the maiden the trouble of grinding meal.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: After bridal preparations and a meal road, the young people live in the village,
    which prospers because the young man is Katcina; when the wife goes astray and
    he leaves, the people become poor.
  category: sequence
  evidence_refs:
  - ev:11
