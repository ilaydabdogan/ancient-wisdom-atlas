canonical_text:
  quote: ''
  summary: The passage contains the end of a Coyote and Turkey episode, a Coyote and
    Chiro episode, and the opening of a Coyote and Porcupine episode. Coyote attempts
    a dawn rite over his children's bones but fails to revive them, pursues Turkey
    children until strong Turkey men rescue them, and dies hungry. In another tale,
    Chiros give Coyote feathers so he can dance and fly with them, then reclaim the
    feathers aloft, causing him to fall and die. A place-name note describes captives,
    extorted ceremonial secrets, and killings at Water Killing Hill and Skeleton Hill.
    In the next tale, Porcupine hosts Coyote and makes roasted food from blood and
    fat drawn from his own nose over a fire.
  language: English with Hopi terms and song fragments
  quote_policy: summarized
