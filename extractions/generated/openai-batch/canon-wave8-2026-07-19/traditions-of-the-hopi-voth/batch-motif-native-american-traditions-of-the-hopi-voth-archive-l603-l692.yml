canonical_text:
  quote: A very long time ago there was nothing here in the world but water.
  summary: 'The passage first concludes a conflict in which Huruing Wuhti immobilizes
    two armed men, destroys their guns, and releases them after they promise peace
    and exchange of knowledge. It then narrates a primordial time of water, a western
    dwelling of Huruing Wuhti, her summoning of the eastern Sun by means of the Moon,
    and two reciprocal creation acts: Huruing Wuhti creates birds for the Sun, and
    the Sun creates land animals for Huruing Wuhti.'
  language: English
  quote_policy: quoted
