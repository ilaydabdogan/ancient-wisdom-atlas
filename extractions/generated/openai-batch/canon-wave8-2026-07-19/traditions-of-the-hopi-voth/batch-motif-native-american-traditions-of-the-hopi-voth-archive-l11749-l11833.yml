canonical_text:
  quote: ''
  summary: After a hunt in which the Aoatovi chief’s daughter was killed, the chief
    secretly plans punishment against his own village. He visits the Shongopavi chief
    by night, shares smoke, and asks him to prepare strong runners. Four Shongopavi
    young men dress as Katcinas and come to Aoatovi with sweet corn for a race. During
    the race, the Hdmsona Katcina loses to an Aoatovi youth, kills him with a knife,
    signals the other Katcinas to flee, and the Aoatovi men pursue them with weapons,
    some on ponies.
  language: English
  quote_policy: summarized
