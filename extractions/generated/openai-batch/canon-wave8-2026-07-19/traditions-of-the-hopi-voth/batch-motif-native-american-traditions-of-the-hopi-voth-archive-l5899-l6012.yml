canonical_text:
  quote: ''
  summary: 'The passage recounts a youth escaping Skeleton Woman from a kiva, receiving
    concealment among cricket dancers, and returning frightened to the village. It
    then begins two Masauwuu narratives: Masauwuu courts and marries a maiden through
    visits and reciprocal food gifts, and a later fragment describes Hano hunters
    pursuing rabbits near a place where Masauwuu hunts at night and sleeps by day.'
  language: English
  quote_policy: summarized
