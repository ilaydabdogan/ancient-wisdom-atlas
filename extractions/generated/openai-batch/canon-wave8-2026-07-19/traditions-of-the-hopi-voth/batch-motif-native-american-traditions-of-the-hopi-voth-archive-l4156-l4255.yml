canonical_text:
  quote: ''
  summary: The passage first concludes a story in which two brothers, already inside
    a monster, find and shoot its heart, causing its death; they lead swallowed people
    out through the monster’s nose and the rescued people reunite with relatives.
    The brothers then send people to find homes, and the narrator reports an explanation
    that the monster was really a world or country like the present world. A new section
    begins in which Pookonghoya and his brother live near Shongopavi with their grandmother,
    play ball, take ritual items from a spring, kivas, and Corn-Ear Bluffs, including
    bahos, paints, a tray of Flute-priest objects, a bull-snake from Snake priests,
    and offerings from rock niches watched over by Cotukvnangwuu in old-man form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the expedition, the grandmother had told the brothers that if the monster
    swallowed them they should try to find its heart and shoot into it so the monster
    would die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers find a path leading out of the stomach, see something hanging
    above them that they identify as the monster’s heart, and shoot arrows at it;
    the younger brother pierces it first, followed by the older brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the heart is pierced, darkness comes and the people notice that the
    monster is dying.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The brothers gather the people and lead them toward the monster’s mouth, but
    the teeth are set firmly in death, so they find a passage into the nose and emerge
    through it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A large group gathers north of the village; villagers find children and relatives
    who had been carried off by the monster and rejoice at their return.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brothers tell the rescued people to move on and find their own homes;
    the temporary settlements are said to account for many small ruins in the country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old people say the monster was really a world or country, similar to the
    world people now inhabit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the next story, Pookonghoya and his brother live north of old Shongopavi
    with their grandmother, play with a ball, and go into a spring to drink water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the spring, the younger brother sees bahos where the water comes out, suggests
    taking them, and swallows one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The elder brother finds bowls or potsherds with different paints deposited
    by Flute priests, puts some paint into holes in the ball, sews the holes, and
    says that if they beat the ball on the way home it will rain before they arrive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brothers beat their ball toward Mishongnovi, enter a kiva where Flute
    priests are assembled, and take a tray holding a lightning frame, thunder board,
    netted water jug, and other objects; the priests say nothing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The brothers enter another kiva where Snake priests are washing snakes, take
    a bull-snake, put it in a snake-sack, and leave while carrying the stolen tray
    and bag.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Corn-Ear Bluffs they find many bahos and artificial fruits deposited in
    niches and cracks by societies as prayer-offerings for abundance.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: On top of the rocks is the Watcher, Tuwalahka, identified as Cotukvnangwuu
    in the form of an old man and described as owner of the rock.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The younger brother proposes stealing some prayer-offerings; the elder brother
    refuses, but the younger ascends the rock and takes a corn baho, a watermelon,
    and a melon.
  category: action
  evidence_refs:
  - ev:9
