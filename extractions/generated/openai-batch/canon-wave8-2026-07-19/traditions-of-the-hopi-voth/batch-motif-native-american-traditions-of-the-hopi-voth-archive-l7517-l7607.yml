canonical_text:
  quote: "“two forces constantly wrangle over the individual Hopi”"
  summary: The passage describes a high Crow near Oraibi who watches corn planting,
    eats corn, and is identified with invisible sickness and harmful moral influence.
    An unnamed Good-Heart being or power tries to counteract the Crow. The passage
    then begins the tale of a beautiful Oraibi maiden who rejects flower offerings
    from village young men and bridal outfits from six directional Cloud chiefs. Pavayoyfcashi,
    a rain deity from the far south, dresses and paints himself, visits her at her
    father’s field, asks her to seek parental consent for marriage, and receives a
    favorable response.
