canonical_text:
  quote: ''
  summary: The passage first recounts Pookónghoya and his younger brother Balángahoya
    visiting two maidens who set an arm-cutting condition for accepting them. Both
    brothers allow their arms to be cut off, carry the severed arms home, and are
    healed by their grandmother through placement, covering, and song. They return
    to the maidens, and the younger brother claims first choice because he accepted
    the test first. The passage then begins a second episode in which the village
    chief asks the two brothers to help against Shíta, a western cannibal monster
    that eats children and adults. With arrows made using bluebird wing feathers,
    the brothers watch for the monster, are swallowed by it, and discover inside its
    body a path leading to a stomach containing many swallowed people and a small
    world-like landscape.
  language: English
  quote_policy: summarized
