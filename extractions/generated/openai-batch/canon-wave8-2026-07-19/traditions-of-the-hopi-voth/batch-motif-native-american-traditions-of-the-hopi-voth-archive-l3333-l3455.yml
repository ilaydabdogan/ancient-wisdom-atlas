canonical_text:
  quote: ''
  summary: A maiden at Oraibi meets a young man who reveals himself as the Circle
    Katcina. With parental consent she marries him after entering a Katcina kiva where
    food is given and a bridal costume is prepared. She later bears two Circle Katcina
    children. A Hototo Katcina takes her away with her consent. The Circle Katcina
    father takes the children to the Katcina house, then searches for the mother with
    them, dancing and singing in Oraibi and seeking someone to nurse the children
    in exchange for roasted corn. One woman agrees, and the father and children continue
    toward Silcikvu, where they find a kiva and hear singing.
  language: English
  quote_policy: summarized
