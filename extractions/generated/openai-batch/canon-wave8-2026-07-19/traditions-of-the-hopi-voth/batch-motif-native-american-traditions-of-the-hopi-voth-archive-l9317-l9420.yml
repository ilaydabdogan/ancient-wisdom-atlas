    as they do.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: With the borrowed wings, Coyote's wife ascends, dances with the Blue Jays,
    flies with them from tree to tree three times, and then flies high into the air
    with them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: High in the air the Blue Jays surround Coyote's wife, each claims its own
