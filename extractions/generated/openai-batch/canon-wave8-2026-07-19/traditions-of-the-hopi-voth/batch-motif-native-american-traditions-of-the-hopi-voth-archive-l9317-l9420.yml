canonical_text:
  quote: ''
  summary: 'The supplied range contains the end of a Coyote episode in which Coyote
    attacks a stone he mistakes for Dove, breaks his teeth, sees frightening reflections
    in springs, and dies thirsty. It then gives the tale of Coyote, his wife, their
    children, Badger, and Blue Jays: after a rabbit meal fails to feed all the children,
    the wife seeks food, joins Blue Jays dancing in a tree with borrowed feathers,
    falls when the birds reclaim them, and dies; the tale closes by explaining why
    coyotes seek food alone. The range ends with the opening of a Coyote and Eagle
    episode in which Eagle says he cut off one leg and tells Coyote how to do the
    same with stones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stone is described as resembling the Dove's form and sitting position; Coyote
    threatens it, grabs it believing it to be Dove, and breaks all his teeth, causing
    blood to stream from his mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The injured Coyote goes to multiple springs to drink, repeatedly sees a bloody
    face or his reflection in the water, is afraid to drink, and eventually falls
    down and dies thirsty and exhausted after seeing a skeleton-like figure in the
    water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Blue Jays tale, Coyote and his wife live west of Oraibi and have six
    children; Coyote hunts rabbits for the children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Badger scratches open a hole and pulls out a cottontail rabbit for Coyote;
    Coyote carries it home, where the children quarrel over it, tear it apart, and
    some remain hungry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coyote's wife searches for food, enters the woods north of the village, hears
    something in the trees, sees Blue Jays dancing in a tree, and covets them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Blue Jays invite Coyote's wife to join and assist their dance, lend her
