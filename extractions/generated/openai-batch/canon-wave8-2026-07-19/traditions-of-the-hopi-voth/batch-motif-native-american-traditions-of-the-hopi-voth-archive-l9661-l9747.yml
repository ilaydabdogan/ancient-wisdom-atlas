canonical_text:
  quote: ''
  summary: 'The passage ends one Coyote-Porcupine episode: Coyote imitates Porcupine’s
    pointed-stick act at a fire, bleeds heavily, collapses, later revives, threatens
    Porcupine, and then resumes friendship while planning possible revenge. A new
    Coyote-Badger episode begins: Coyote envies food at an Orafbi spring-cleaning,
    recruits Badger, then recruits Mole to dig underground toward the food.'
  language: English
