canonical_text:
  quote: ''
  summary: A lame hunter is brought into a kiva by small people, and many Mice doctors
    heal his broken thigh bone by crowding around and rubbing him. He leaves two rabbits
    as remuneration. Old Man Badger, a jealous doctor, feigns sickness to test the
    Mice doctors. The Mice chief leads the group to Badger's kiva, sings with the
    others while moving in a circle, exposes the fraud, and tells Badger that nothing
    is wrong with him and that he will get well by eating.
  language: English
  quote_policy: summarized
