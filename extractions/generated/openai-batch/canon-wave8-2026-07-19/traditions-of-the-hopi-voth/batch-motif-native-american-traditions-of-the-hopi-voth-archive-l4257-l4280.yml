  summary: Two brothers return toward Shongopavi, use a lightning frame and bullroarer
    or thunder board, and storm weather follows. At home their grandmother scolds
    them, while they secretly place rain-related objects in two covered pots. The
    narration states that because the Pookonghoyas later had these things, rain continued
    and the Hopi had good crops.
