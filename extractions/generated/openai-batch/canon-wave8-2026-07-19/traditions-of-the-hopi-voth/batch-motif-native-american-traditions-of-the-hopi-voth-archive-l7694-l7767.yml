canonical_text:
  quote: ''
  summary: A young man returns to a locked house, is told by two Eagles where the
    key is hidden and that his sisters beat them, dresses ceremonially, and is carried
    by an Eagle while another leads. Singing a song, he is flown above the village
    and toward his family’s field. The Eagles refuse the family’s pleas to set him
    down, rise out of sight, pass through an opening in the sky into the Eagles’ world,
    and leave him on a high bluff among white Eagle houses because of his sisters’
    conduct. Despondent, he considers jumping down and asks a Wren whether he can
    descend, but receives no answer in the available passage.
  language: English
  quote_policy: summarized
