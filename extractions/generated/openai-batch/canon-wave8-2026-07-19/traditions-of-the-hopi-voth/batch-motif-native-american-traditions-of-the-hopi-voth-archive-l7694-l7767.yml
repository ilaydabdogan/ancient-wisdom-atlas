  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The parents and sisters cry, and the family goes home mourning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Eagles reach an opening high in the sky and pass through into the world
    where Eagles dwell and from which they respond to Hopi prayers and hatch their
