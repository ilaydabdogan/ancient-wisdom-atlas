canonical_text:
  quote: ''
  summary: The passage contains the end of one Pookong/Pookonghoya episode in which
    the Pooktinghoyas kill and scalp a Cooyoko, return with goods, dance with the
    scalp, and receive balls and sticks from a chief. It then tells how Pookong is
    equipped by a chief to kill a bear that has been killing people, kills it, makes
    a stuffed bear skin to frighten his grandmother, and ends the bear threat. The
    next episode begins with Pookongs living with their grandmother Spider Woman and
    departing to watch a Lalakontu dance after she gives them food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pooktinghoyas hide behind a mealing bin and shoot lightning arrows at
    the approaching figure, killing him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the killing, the Pookonghoyas take the victim's knife, scalp him, take
    beads and other things from the house, and return home wealthy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At home they dance while swinging the Cooyoko scalp and sing an archaic song
    containing the names Pookonghoyo and Cooyoko.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The song is described as archaic and mostly no longer understood, except for
    two proper names and the word taalcha, said to be a Navaho word for kill.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A village chief cuts two round buckskin pieces, makes two balls and two ball
    sticks, asks what the Pookongs found out, thanks them for killing, and gives them
    the balls and sticks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After this event, the Hopi are said always to have returned when they went
    after wood.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Mishongnovi a bear has been killing people, including people who go to
    their fields, and the chief is unhappy about it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mishongnovi chief prepares a hard-wood bow, feathered arrows, a buckskin
    ball stuffed with cotton and rubbed with red ochre, and a baho for the grandmother.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief gives the Pookong the ball, bow, arrows, and ball stick, saying
    he should kill the bear with them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the bear comes toward him, Pookong shoots it in the throat and then hits
    it with the ball stick; the bear dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pookong skins the bear without cutting the abdomen, fills the skin with dry
    grass, ties it with a rope, drags it behind him, and cries out that a bear is
    following him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The people believe the apparent bear is following Pookong and tell his grandmother,
    who runs away crying into her kiva.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pookong throws the bear form to his grandmother; she dies from fright, then
    wakes after he laughs, kicks her, and tells her to get up.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The grandmother whips Pookong and calls him naughty for scaring her, while
    the chief is happy that the bear has been killed and the bear no longer kills
    people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the next episode, the Pookongs live north of Oraibi at Achamali with their
    grandmother Spider Woman.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Pookongs hear that the Lalakontu will dance at Shongopavi and ask to go
