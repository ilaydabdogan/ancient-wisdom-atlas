canonical_text:
  quote: ''
  summary: A Water Serpent and Coyote exchange visits. Each episode centers on one
    visitor filling the other's kiva and forcing the host outside into the cold. Coyote
    builds an artificial long tail to repay the Water Serpent, but the Water Serpent
    burns the tail. Coyote mistakes the smoke and fire for pursuit by the Hopi, flees
    to the Little Colorado River, and drowns. The passage then begins a new titled
    account locating Balolookong at Flute Spring and Coyote nearby at Ishmovala.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Snake or Water Serpent visits Coyote at his kiva, and because the serpent
    has grown and Coyote's tail occupies part of the kiva, the serpent cannot get
    his whole body inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote goes outside, circles around the kiva while coiling up his tail, sits
    near the kiva opening, becomes cold, and becomes angry because the Water Serpent
    stays a long time.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Coyote decides to pay the Water Serpent back and makes another long, thicker
    addition to his tail from dry cedar bark and yucca, covering it with hair and
    wool from his body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On a cold day Coyote visits the Water Serpent's kiva, enters it, and circles
    around until his tail fills the entire kiva.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Water Serpent leaves the kiva, coils outside so that his head is near
    the entrance, becomes cold and shivers, and wishes Coyote would leave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Coyote leaves by the ladder, the Water Serpent enters, says he will get
    even, and uses a stick from the fireplace to push the part of Coyote's tail still
    in the kiva onto the fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Water Serpent tells Coyote to get away and says that Coyote is always
    taking other people's things and doing something bad.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coyote looks back, sees smoke and fire behind him, thinks the Hopi have set
    the grass on fire and are pursuing him, and runs westward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Coyote reaches the Little Colorado River, jumps into the high water, becomes
