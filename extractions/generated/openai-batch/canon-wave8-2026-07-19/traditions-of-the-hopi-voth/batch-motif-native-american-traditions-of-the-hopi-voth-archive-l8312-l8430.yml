canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a missing child is found in an owl
    cave partly transformed into an owl. The Owl gives instructions for restoring
    the child by keeping it locked in a room for four days until sunrise, but the
    mother opens the door too early and the child flies away as an owl. The passage
    then begins a tale about children hunting lizards while singing, a Walpi man who
    later sees gray lizards making sounds and playing, and the later attribution of
    the song as a Mishongnovi song. The final section begins a tale about a Rooster,
    a Mocking-bird, a beautiful maiden who refuses suitors, and the chief Bamuyaomongwi
    arriving with presents.
  language: English with Hopi song text
  quote_policy: summarized
