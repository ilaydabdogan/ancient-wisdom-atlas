canonical_text:
  quote: ''
  summary: The passage contains two Hopi narratives. In the first, Ants hold a Katcina
    initiation for their children; Ant Katcinas enter the kiva and flog the children
    so severely that this explains why ants are thin in the middle. In the second,
    two food-ball beings organize a Paiute dance with Mice maidens, borrow a drum,
    prepare feather and cheek markings, and perform until Pookonghoya and Balongawhoya
    arrive while hunting, kill two Mice, devour the two organizers, and end the dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: East of Tcookovi many Ants lived, and the chief of the Ants announced a Katcina
    initiation to occur in four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two Ants dressed as Hn Katcinas, one as Angwushnacomtaka, at Koritvi; the
    narration compares this dressing to present-day initiation of children into a
    Katcina society.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some Ants made a sand picture on the kiva floor and brought children into
    the kiva to be initiated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ant Katcina priest related the initiation story, and four little Koyemsis
    performed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: An Ant outside on a rock signaled with one fore-foot; the Katcinas ran to
    the kiva, circled it several times, entered, and took places opposite the sand
    picture.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Katcinas flogged the little Ant children so severely that they were almost
    cut through the middle of the body; the narrative gives this as the reason ants
    are thin in the middle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Lavovolvipiki and Ndnvovolpiki are associated with places and foods made from
    grass or ndno seed meal formed into small balls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lavovolvipiki and Ndnvovolpiki were friends who decided to hold a Paiute dance;
    one was to fetch Mice maidens and the other to borrow a drum from the Kwan kiva.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Kwakwantus lent the drum, the Mice maidens were assembled, and the group
    stayed awake during the night practicing songs and dances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the morning each mana received an eagle feather tied to the head as a nakwa
    and put a red dot on each cheek before the dance and song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pookonghoya and Balongawhoya were hunting, came to the dance place, killed
    one Mouse each, and commented on the cheek marks as spots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pookonghoya devoured Ndnvovolpiki, and his younger brother devoured Lavovolvipiki;
    the dance ended.
  category: sequence
  evidence_refs:
  - ev:6
