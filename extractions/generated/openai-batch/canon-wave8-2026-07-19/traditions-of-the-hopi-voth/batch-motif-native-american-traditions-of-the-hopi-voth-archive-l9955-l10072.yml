canonical_text:
  quote: ''
  summary: The passage contains the ending of a Coyote-Badger episode, followed by
    stories in which Coyote encounters Kokontu maidens and Grasshoppers. Coyote dies
    after cutting open his abdomen in imitation of a deception; Badger uses Coyote
    fat at an ant hill, explaining its use against ants and ant bites. Coyote then
    watches Kokontu maidens grinding corn, follows them to a bluff and tree, imitates
    their jumping, and is killed. In another episode, a Sparrow-hawk kills Grasshopper
    children; Coyote mistakes the Grasshopper mother’s mourning for song, coerces
    her to repeat it, forgets it after stumbling, returns to a stone left in her place,
    breaks his teeth on it, and starves.
  language: English
  quote_policy: summarized
