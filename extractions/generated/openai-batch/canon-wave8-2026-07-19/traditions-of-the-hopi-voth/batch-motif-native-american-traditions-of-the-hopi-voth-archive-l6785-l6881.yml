canonical_text:
  quote: ''
  summary: The passage finishes one tale in which a youth, warned by Fly, retrieves
    his shirt and beads from a dangerous mana whose house contains goods of youths
    she killed. When he shakes the recovered objects at her, she becomes Tihkuy Wuhti;
    the costumes of slain youths become deer, antelope, and rabbits and escape. She
    marks one antelope and explains why game will be hard to hunt; she is said to
    live near the Little Colorado River, control game, and receive night offerings
    from hunters. The passage then begins a new tale set in Shupaulavi, where a grandmother
    dresses her grandson for running and warns him to avoid a dangerous maiden. The
    youth later approaches the maiden, gives her his costume at her request, and she
    dances on her kiva while singing.
  language: English
  quote_policy: summarized
