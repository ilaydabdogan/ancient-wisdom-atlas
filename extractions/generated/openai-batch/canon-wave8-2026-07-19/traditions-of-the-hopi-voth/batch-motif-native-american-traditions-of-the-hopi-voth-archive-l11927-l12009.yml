canonical_text:
  quote: ''
  summary: The Orafbi chief organizes warriors and neighboring villages for an expedition
    against Aodtovi at the request of the Aodtovi chief. The Shongopavi chief refuses
    participation. At night near the mesa, the Aodtovi chief and his wife feed the
    raiders with piki, and the chief instructs them to attack at dawn after his son
    gives a signal. The chief is described as a powaka who has bewitched his son and
    others so that the plan is accepted. The raiders surround the kivas, remove ladders,
    shoot arrows, throw firewood and firebrands into the kivas, and use Spanish pepper
    smoke so that many men smother. During the attack, people from Mishongnovi and
    Walpi take younger women and maidens from the houses.
  language: English
  quote_policy: summarized
