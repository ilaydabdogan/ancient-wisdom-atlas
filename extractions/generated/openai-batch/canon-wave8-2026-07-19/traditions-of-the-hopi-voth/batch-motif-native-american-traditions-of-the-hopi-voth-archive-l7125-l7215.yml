canonical_text:
  quote: ''
  summary: A young man marries a maiden and brings her to his grandmother’s house.
    After the bride’s customary stay, the grandmother obtains a bridal costume from
    directional rooms, dresses the bride, and sends her home on a corn-meal road.
    The husband gives a mountain sheep to his wife’s parents. Men from the Snake and
    Ndshabe kivas plot against him through a raid, but the father-in-law warns him.
    The wife’s little sister repeatedly announces the coming war. When Navaho raiders
    approach, the young man and his father-in-law go to the old woman, who summons
    a Puma, Bear, Wildcat, and Wolf from rooms in the four directions.
  language: English
  quote_policy: summarized
