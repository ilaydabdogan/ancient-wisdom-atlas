canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi narratives: two sisters marry Night,
    are carried to his home, flee after warnings, die by lightning, and leave living
    children who later fail a silence condition with their grandparents; Hiy6natitiwa
    wins a bride, survives a plot against him through his grandmother''s aid and animal
    allies; and a Shongopavi maiden wins a desired youth by opening a tray with Spider
    Woman''s help, then later turns into a dog.'
  language: English
  quote_policy: summarized
