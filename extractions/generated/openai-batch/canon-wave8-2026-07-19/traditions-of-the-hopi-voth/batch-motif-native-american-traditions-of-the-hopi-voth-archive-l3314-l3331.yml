canonical_text:
  quote: Only one man and one woman remained alive.
  summary: Clouds gather from the mountains and all sides around a Hopi village. The
    people expect good rain for maturing corn, but the storm brings thunder, lightning,
    and great hailstones that destroy crops and kill the villagers despite their flight
    to kivas. One man and one woman survive. The clouds stop and disperse, the Katcinas
    say they have taken revenge, and the spared woman bears children so the village
    becomes inhabited again.
