  quote: ''
  summary: The passage includes the end of a Rooster and Mocking-bird story, in which
    dawn-making songs, a concealed helper, marriage, and an explanation of village
    men and women are narrated. It then begins the story of Toad Woman's son attending
    the Snow Katcina dance, being laughed at, eating ants, and bringing a small amount
    of red piki home to his mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maidens tie dry corn-husks to the Rooster's tail; the rattling frightens him,
    he runs home, removes the husks, and feels strong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rooster asks the Mocking-bird to watch him at night, and the Mocking-bird
    notifies the Kwdtokwuu to assist him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the Rooster sings and crows during the night, the Kwdtokwuu spreads
    large wings across the eastern sky and covers the dawn so that it does not become
    light and the sun does not rise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Mocking-bird later sings through the night, whistles after groups of songs,
    and the dawn appears before the sun rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Rooster admits that the Mocking-bird understands how to make light and
    says the Mocking-bird shall have the maiden.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The maiden marries the Mocking-bird and bears two children: a boy described
    as the child of the Rooster and a girl described as the child of the Mocking-bird.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narration says village women are considered children of the Mocking-bird
    and village men children of the Rooster, explaining women as talkative and men
    as gentle and docile.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Oraibi, the Snow Katcinas practice for a dance in a kiva called Chorzhovi;
    Toad Woman lives north of the village and has a son who listens to the Katcinas
    singing.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Toad Woman's son lies on the kiva roof looking down, other young men
    pile on him and worry him; afterward he sits aside and listens instead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the eighth day, Toad Woman prepares food, washes her son's head with suds,
    and he dresses in a wildcat robe and skin cap before going to the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Toad Boy paints his face, children laugh at him, the Katcinas dance and
    distribute food, but nobody gives him food.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: An old man tells the children to take the Toad Boy to an ant hill; the children
    dig out ants, the Toad Boy eats many of them, and the children laugh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Toad Boy returns to the plaza, attends the dance all day, later receives
    a very small amount of red piki from children, takes it home to his mother, and
    they eat it.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
