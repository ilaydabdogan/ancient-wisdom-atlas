canonical_text:
  quote: ''
  summary: Cotukvnangi, the God of Thunder, descends from the sky with water and food
    to aid two thirsty children. After first appearing in a frightening ice-and-cloud
    mask and costume, he reveals a handsome form, feeds them, instructs them to recover
    and follow their people east, returns with more provisions, and teaches them war
    practices, songs, and rites involving lightning, thunder, scalps, kiva observances,
    bear skin, corn-meal, washing, and dance. The two brothers later find their people
    and mother at Homolovi; their mother recognizes them after they identify themselves,
    having thought they had perished when left sleeping during the flight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cotukvnangi is described as the God of Thunder who lived in the sky, saw the
    children, took pity on them, and decided to descend and help them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cotukvnangi brought a gourd vessel full of water and rolls of nuvëmuhpi as
    food for the children.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children were sleeping and their mouths were dry and parched.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger brother woke and saw a terrible personage with three long ice
    horns or projections, an ice costume with icicle-like fringes, and head ridges
    representing clouds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children were frightened; Cotukvnangi removed his mask, appeared as a
    handsome man, told them not to cry, and gave them water and food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cotukvnangi told the children to remain for two or three days, eat and drink,
    recover strength, and then follow their people to the east.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cotukvnangi rose and disappeared in the sky, then appeared again the next
    day with more food, watermelons, and drinking water, remaining with the children
    and talking all night.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Cotukvnangi is called the great warrior chief; he gave or promised the youths
    lightning and thunder and taught them how to kill enemies, take scalps, sing war
    songs, and perform associated kiva and plaza rites.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Cotukvnangi told the brothers their parents might not know them, instructed
    them to take hold of their mother and identify themselves, and said they should
    pray to him when they needed the lightning arrow and thunder.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two brothers set out, arrived at Homolovi, found their people living in
    two small villages, and found their mother in the northern, smaller village; the
    older brother was carrying the tired younger brother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The people questioned whose children had arrived; the mother at first denied
    them, but the boys took her hands and called her their mother, after which she
    remembered leaving them asleep during the flight, embraced them, and cried.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage identifies the smaller village residents as Batki-namu and the
    larger village residents as people who mostly later constituted the Forehead clan.
  category: relationship
  evidence_refs:
  - ev:10
