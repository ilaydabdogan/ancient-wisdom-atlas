canonical_text:
  quote: '"We shall sometime take revenge," said the chief of the Katcinas.'
  summary: The passage first describes Spaniards camping by a pool west of Walpi and
    trading clothing with Hopi villagers, followed by a rumor that causes many Shupaulavi
    people to move to Shong6pavi. It then tells of Katcinas from a mountain near Kadtukvi
    who dance at night in a village plaza, are threatened and burned in a crack by
    villagers, and of the surviving Hot6to Katcina who returns to the mountain. After
    hearing his report, the Katcina chief vows revenge, and the Katcinas make hail
    for three days and raise a cloud as their standard.
  language: English
  quote_policy: quoted
