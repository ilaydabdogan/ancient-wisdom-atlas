canonical_text:
  quote: ''
  summary: The passage recounts a Hopi group leaving Hom616vi/Hom61ovi because mosquitos
    caused suffering, moving through several places, separating from the Bitki clan,
    receiving the Forehead clan name from a sunrise at Nishiwamu, being refused entry
    at Shong6pavi, and then accepting refuge at W£ki/Shupaulavi. It later describes
    a hostile report to Spaniards, a warning by the Walpi chief, and a diplomatic
    kiva meeting in which the Shupaulavi chief denies asking for removal and gives
    presents. A note says the Shong6pavi chief was believed to be a Powaka able to
    fly to New Mexico by night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group lived at Hom616vi/Hom61ovi for years and eventually moved northeast
    because mosquitos stung their children and people, causing suffering; good fields
    delayed the departure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the mosquitos were called salt flies, dong-totoptu, by most
    Hopi and shfpaulavitu by some, and connects the latter name with the name Shupaulavi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The migrating party reached Coyote Spring Bluff, stayed briefly, and separated;
    the Bitki clan went northeast to Aodtovi while the others went north and later
    to Nishiwamu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the group arrived at Nishiwamu, the upper part of the sun was appearing
    above the horizon, and the group was thereafter called the Forehead clan, Kdlriamu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The group repeatedly sought permission from the chiefs of Shong6pavi to move
    into the mesa village, but the effort failed because the chief considered them
    dangerous or bad people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the third year at Nishiwamu, the group decided to return to its previous
    home at Hom61ovi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief of Shupaulavi, then called W£ki or refuge house, invited the group
    to settle in his village, and the group accepted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explains the village name Shupaulavi as deriving from the new
    arrivals, who had fled Hom61ovi because of mosquitos called by that name.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Shupaulavi was larger than Shong6pavi because Shong6pavi
    had earlier lost many inhabitants after killing Spaniards and destroying missions,
    with some people fleeing to Shupaulavi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A later grudge is attributed to the chief of Shong6pavi, who informed Spaniards
    in New Mexico that Shupaulavi people wished to be taken away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief of Walpi, described as a friend of the Shupaulavi chief, warned
    him and advised him to take a tuihi and a blue shirt as presents, shake hands,
    embrace the Spanish chief, and explain the matter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In a kiva, the Shupaulavi chief and Spanish officer looked at each other,
    shook hands, embraced, and the Shupaulavi chief handed over the presents while
    denying that he had requested removal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Spanish officer said the Shupaulavi chief was not the man who had asked
    him to take the people away, and the Hopi present thanked him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: A note reports that the Hopi said the Shong6pavi chief was a Powaka, or sorcerer,
    who could fly, had gone to New Mexico during a night, and returned by the next
    day.
  category: attribute
  evidence_refs:
  - ev:9
