canonical_text:
  quote: ''
  summary: The passage first concludes a narrative in which Spider Woman removes a
    maiden from a coyote-skin vessel, instructs her, and sends her home with Katcinas.
    The maiden later uses a special vessel whose rainbow-colored water turns Yellow
    Corn-Ear maiden into a bullsnake; the snake is killed by her parents, and her
    soul goes to Skeleton House. The next section summarizes a youth who prays to
    the sun to learn about the dead, takes medicine, dies, travels to Skeleton House,
    sees places of punishment and a village of the non-wicked dead, returns to his
    body, reports what he saw, and later dies again after taking more medicine.
  language: English
  quote_policy: summarized
