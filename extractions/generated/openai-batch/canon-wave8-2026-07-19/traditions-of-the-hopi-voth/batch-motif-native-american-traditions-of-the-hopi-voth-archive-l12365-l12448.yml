canonical_text:
  quote: ''
  summary: A Hopi-Navaho battle narrative describes an ignored warning, a mounted
    Navaho woman's charge that divides the Hopi line, prolonged encirclement and fighting,
    the protective effect of Hopi buckskins, a Hopi ascent to a mesa point, a wounded
    young Hopi man's last stand, three Hopi helpers using rocks as cover, and Navaho
    mocking with captured clothing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Navaho man who had lived in Orafbi, been initiated into the Wtiwuchim society,
    and spoke Hopi warned Chinfwa that the Hopi should not follow because more Navaho
    were farther east.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chinfwa conveyed the warning to the Hopi warriors, but they followed the Navaho
    into the valley where both sides formed battle lines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Navaho woman mounted on a pony seized a lance, rode toward the Hopi line,
    and was followed by her people, who broke through and divided the Hopi into two
    surrounded parties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At sunrise the Hopi observed that the Navaho warriors were lightly dressed,
    red-painted with finger-drawn lines, loose-haired, and mounted on ponies, while
    the Hopi were wrapped in heavy buckskins.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The heavy buckskins around Hopi bodies caught many Navaho arrows and are given
    as one reason the outnumbered Hopi were not exterminated.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The battle lasted until late afternoon; the Hopi repeatedly broke through
    encircling Navaho groups but were surrounded again as the circles grew smaller.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Navaho are described as having shields and using mounted evasive maneuvers;
    their weapons included bows, arrows, shields, war clubs, and a few guns and pistols.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A small Hopi party climbed the mesa point called Shongohtoika; pursuing Navaho
    warriors abandoned pursuit because of rocks and boulders near the mesa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Chinfwa's nephew was shot in the foot, could not walk, said he wanted to shoot
    someone before he died, shot at the Navaho, and was then surrounded, killed, and
    stripped of buckskin and clothing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Only three Hopi agreed to descend from the mesa to help; they hid behind rocks
    and killed a number of retreating Navaho from cover.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Other Hopi reached the rocks, joined the three helpers, and all ascended the
    mesa; a Navaho party did not attack but waved captured buckskins and clothing
    and mocked them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Chinfwa is identified as the uncle of the wounded young Hopi man.
  category: relationship
  evidence_refs:
  - ev:8
