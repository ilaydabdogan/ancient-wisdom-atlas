canonical_text:
  quote: ''
  summary: 'The passage summarizes several Hopi Coyote episodes: Coyote imitates Turkey
    mother''s bone-revival cooking and loses his children; he is tricked by Chiros
    into flying and falling; he imitates Porcupine''s nose-blood roasting and is injured;
    he joins Badger and Mole in stealing food and later imitates Badger''s pretended
    self-cutting, dying; and a final Badger-Coyote visit includes shared food and
    friendly departure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Turkey mother says she bakes her children, eats their meat without breaking
    the bones, waves the bones in a tray while singing, throws them outside, and the
    children become alive again with beautiful feather figures.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote bakes his own children in a hot oven, eats their meat without damaging
    the bones, gathers the bones into a basket, waves them in a tray while singing,
    and throws them away, but the children do not revive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Turkey mother sends her children away to the San Francisco Mountains and uses
    rolled blankets to make it appear that they are sleeping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Coyote pursues the little turkeys; two strong Turkey men rescue them and carry
    them away, and Coyote returns hungry and dies before reaching home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chiros give Coyote feathers as wings and a tail, dance and fly upward with
    him, then remove the feathers so that Coyote falls to earth and dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Porcupine uses a pointed stick from his hair to make blood and fat fall from
    his nose onto a fire, roasts it, and gives it to Coyote to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coyote later imitates Porcupine's act with a pointed stick, causing blood
    mixed with fat to flow until he becomes exhausted and falls down; he later revives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Coyote, Badger, and Mole dig underground to reach food left near a rock during
    a spring cleaning, remove it, and divide it among themselves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Badger tells Coyote that he opened his side and took fat from his intestines,
    shows a knife, and later laughs after Coyote leaves.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Coyote cuts into his abdomen with the knife, bleeds, pulls at fat, becomes
    exhausted, falls over, and dies before Badger arrives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the final episode, Badger visits Coyote and eats juniper berries; later
    Coyote visits Badger, who serves roasted rabbit, and the visit ends peacefully.
  category: sequence
  evidence_refs:
  - ev:11
