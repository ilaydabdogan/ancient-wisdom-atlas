  category: sequence
  evidence_refs:
  - ev:12
- id: obs:23
  text: The Divided Spring clan came from where the sun rises.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:24
  text: A footnote states that Machito brought the Soyal altar and cult, the Pihkash
