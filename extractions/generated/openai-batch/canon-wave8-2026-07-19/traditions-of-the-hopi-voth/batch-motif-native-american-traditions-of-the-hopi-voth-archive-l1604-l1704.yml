canonical_text:
  quote: ''
  summary: The passage recounts migrations and settlements of several Hopi clans,
    especially the Spider and Bear clans. It describes repeated stops, encounters
    with Americans in the east, westward movement to Hopi villages, the Bear chief
    Machito’s dispute over scarce corn, his departure with two Katcinas, the marking
    of a boundary stone, and the incorporation of several clans and cults into ceremonies
    such as Soyal, Marau, Powamu, Katcina, Flute, Snake, and Corn ceremonies. It also
    records a corn-growing contest that explains ritual precedence for the Blue Flutes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Spider people stopped at ten places, were repeatedly harassed by people
    along the water, and eventually arrived where the sun rises and the Americans
    live.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Spider people became friends with the Americans, planted there, had children
    learn some of the language, stayed three years, and learned the Bear clan had
    already gone westward.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Spider people followed westward to Orafbi, found and joined the Bear clan,
    whose chief was Machito, and had the Aototo and Aholi Katcinas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bear clan went south from the sipahpuni with the Aototo Katcina and took
    along the Young Corn Ear people, who had the Aholi Katcina.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bear clan had a good crop at one stopping place because the two Katcinas
    were with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bear clan stopped ten times before arriving at the Americans where the
    sun rises, stayed four years, and had children learn a little English.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Americans told the Bear clan to go west to find land and promised to punish
    anyone who harmed them or caused their children to die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bear clan traveled west, found no good land at the Pueblo, and finally
    settled at Shongopavi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During a time of scarce corn, people saw Machito holding several sweet corn-ears
    while eating; after they spoke to him about greediness, he became angry and left
    with Aototo and Aholi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hunters later found Machito and the Katcinas at Bean Spreading Place, where
    a stone with writing called Machitutubeni was said to remain.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Machito left his wife and people at Shongopavi, and those people formed the
    Shongopavi Bear clan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Attempts by people and by Machito’s wife to bring him back failed because
    he would not listen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Machito carried a large stone and set it at Ocepchomo as a landmark between
    the fields of Shongopavi and his own.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Machito and the two Katcinas went up the Orafbi mesa and remained there.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Machito questioned the Spider people about their wanderings and about why
    corn would not grow although they had the Flute cult.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Machito permitted the Spider people to live there but instructed them to watch
    the sun and report its south limit so that the Soyal ceremony could be held.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Lizard clan was among the Spider people, was related to the Sand clan,
    and clan names were said to have been given during wandering after seeing something
    under notable circumstances.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Lizard people said they knew the Marau cult and were permitted to stay
    on condition that they cooperate in the Soyal ceremony.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: A Bear clan village chief is said to make the ptihu road during the Marau
    ceremony from the south end of the kiva toward the rising sun.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The Rattle-snake clan came with the Spider clan to Orafbi, but the passage
