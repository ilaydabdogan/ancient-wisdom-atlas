- id: ev:2
  type: summary
  locator: lines 1616-1619
  quote_or_summary: The Spider people learn the Bear clan had already gone westward,
    follow to Orafbi, find and join the Bear clan, whose chief is Machito, and have
    Aototo and Aholi Katcinas.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: lines 1622-1628
  quote_or_summary: The Bear clan goes south from the sipahpuni with Aototo, finds
    the Young Corn Ear people with Aholi, takes them along, and has a good crop because
    the two Katcinas are with them.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 1628-1635
  quote_or_summary: The Bear clan stops ten times before arriving at the Americans
    where the sun rises, stays four years, children learn some English, and the Americans
    advise them to go west and promise punishment against those who harm them.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 1635-1638
  quote_or_summary: The Bear clan travels west, finds the Pueblo but no land it can
    get, and finally settles at Shongopavi.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 1640-1649
  quote_or_summary: Machito is seen holding sweet corn-ears while eating during scarcity;
    after being rebuked for greediness, he leaves with Aototo and Aholi. Hunters find
    them at Bean Spreading Place, where a stone with writing called Machitutubeni
    is said to remain; Machito leaves his wife and people at Shongopavi, forming the
    Shongopavi Bear clan.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 1651-1658
  quote_or_summary: People and then Machito’s wife try to bring him back, but he will
    not listen. He takes a big stone and places it at Ocepchomo as a landmark between
    Shongopavi fields and his own.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 1660-1669
  quote_or_summary: Machito and the two Katcinas go up the Orafbi mesa. When the Spider
    people arrive, Machito asks about their wanderings and why corn will not grow
    with the Flute cult; he tells them to watch the sun’s south limit for the Soyal
    ceremony and to make his kind of ptihtavi.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 1671-1677
  quote_or_summary: The Lizard clan, related to the Sand clan, is among the Spider
    people; clan names are said to arise during wandering from things seen. The Lizard
    people know the Marau cult and are allowed to stay if they cooperate in Soyal.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 1677-1680
  quote_or_summary: Pungridnomsi, a Bear clan village chief, makes the ptihu road
    in the Marau ceremony from the south end of the kiva toward the rising sun.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 1681-1685
  quote_or_summary: The Rattle-snake clan comes with the Spider clan to Orafbi, but
    its incorporation is unknown. Badger people understand medicines and prepare medicine
    or charm liquid for Flute, Snake, Marau, and other ceremonies.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 1687-1689
  quote_or_summary: Another Badger clan and the Butterfly clan come from Kishiwuu
    bringing the Powamu and Katcina cults; the Divided Spring clan comes from where
    the sun rises.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 1691-1695, footnote
  quote_or_summary: A note says the passage refers to mutual Soyal celebration; Machito
    brought the Soyal altar and cult, the Pihkash people had Aholi Katcina and the
    screen used in Soyal and Corn ceremonies, and Aototo has water and rain.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 1697-1700
  quote_or_summary: At Muyiovatki, groups arrange a contest in which each plants corn;
    the Blue Flutes plant sweet corn and it grows first, explaining their precedence
    in processions and the closing of the plaza well.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 1700-1703
  quote_or_summary: The Drab Flutes throw meal, mollas, and other items from a distance
