candidate_motifs:
- id: motif:1
  label: repeated clan migration with ten stopping places
  taxonomy_refs:
  - departure
  basis: Both Spider and Bear migration accounts include repeated stops, including
    the number ten, before contact with the Americans in the east and westward movement
    toward Hopi settlements.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy reference is broad; the passage gives migration details but
    does not frame them as a universal departure motif.
- id: motif:2
  label: ritual objects or beings enabling crop fertility
  taxonomy_refs:
  - seasonal_cycle
  basis: The Bear clan’s good crop is attributed to the presence of Aototo and Aholi;
    later ceremonial timing, corn ceremonies, water, rain, and a corn contest are
    connected with cult objects and ritual groups.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage is ethnographic and explanatory; it does not explicitly abstract
    a general fertility motif.
- id: motif:3
  label: chief as ritual founder and boundary setter
  taxonomy_refs:
  - culture_hero
  basis: Machito is a chief who leaves with Katcinas, sets a boundary stone, brings
    or controls the Soyal cult, and instructs others in ceremonial observance.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:13
  confidence: medium
  cautions: Machito is not called a culture hero in the passage; the label reflects
    his narrated functions only.
- id: motif:4
  label: seasonal solar observation for ceremony
  taxonomy_refs:
  - seasonal_cycle
  basis: Machito instructs the Spider people to watch the sun and report when it reaches
    its south limit so the Soyal ceremony can be held.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not elaborate the astronomical or calendrical system
    beyond this instruction.
- id: motif:5
  label: incorporation of clans through ritual knowledge
  taxonomy_refs:
  - sacred_exchange
  basis: The Spider and Lizard people are permitted to stay in relation to ceremonial
    duties, including watching the sun and cooperating in Soyal.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not describe a formal exchange contract; the taxonomy
    reference is approximate.
- id: motif:6
  label: corn contest establishing ritual precedence
  taxonomy_refs:
  - sacred_exchange
  - seasonal_cycle
  basis: A corn-growing contest at Muyiovatki explains why the Blue Flutes go first
    in processions and close the well, while the Drab Flutes perform a separate offering
    action.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: The contest is a local etiological explanation; broader motif classification
    requires review.
- id: motif:7
  label: ascent to mesa settlement
  taxonomy_refs:
  - ascent
  basis: Machito and the two Katcinas go up the Orafbi mesa and remain there; earlier
    migrants also ascend a bluff or mesa during travel.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: low
  cautions: The ascent is literal topographic movement and may not represent the broader
    ascent motif family.
- id: motif:8
  label: rattlesnake clan affiliation
