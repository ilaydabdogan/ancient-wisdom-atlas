canonical_text:
  quote: ''
  summary: A young man, aided by Spider Woman, pacifies a rattlesnake maiden, is accepted
    among the Snake people, receives instruction in the Snake cult, visits Huruing
    Wuhti by a rainbow road, obtains beads and shells under a prohibition against
    opening the sack, takes a Snake wife, and returns with increasing beads while
    observing travel taboos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prettiest maiden is described as having turned into a large yellow rattlesnake
    that is especially angry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider Woman advises the young man to take the angry snake and gives him medicine
    to chew and spurt on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man strokes the snake four times upward while spurting medicine
    on it, and the snake becomes docile.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the young man looks away and back again, all the snakes have returned
    to the forms of men and women, including the captured maiden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Snake people treat the young man kindly because they consider him initiated
    and one of them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The captured mana brings the young man food from another room in the kiva,
    including fresh corn-meal bread, peaches, and melons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man says he seeks a good life, Hopi food, and beads from Huruing
    Wuhti, and he presents bahos as what he has for her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spider Woman is said to have a povalpiki from which she lives and which never
    gives out.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Snake chief instructs the young man during the evening and night about
    the Snake cult, altar, and what he must do after returning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Spider Woman makes a rainbow road into the ocean to a high bluff where Huruing
    Wuhti lives, and they ascend by a ladder.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Huruing Wuhti first appears as an old hag in a place whose walls hold many
    beads and shells, then at sundown returns as a pretty maiden with robes.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: After four days and nights, Huruing Wuhti gives the young man beads and shells
    from rooms associated with north, west, south, and east.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Huruing Wuhti tells the young man not to open the sack, saying the contents
    will be gone if opened and will increase if not opened.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Snake chief tells the young man to take the mana, food, and ceremonies,
    and says the woman will bear children who will hold the ceremony.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Spider Woman forbids the young man to touch his wife on the way, warning that
    his beads and wife would disappear.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: As the young man and his wife travel and sleep separately, the beads increase
    over four nights and become heavy, with beads strung on strings placed in the
    bag by Spider Woman.
  category: sequence
  evidence_refs:
  - ev:11
