canonical_text:
  quote: ''
  summary: The passage gives compressed accounts of conflicts involving Walpi, Sikyatki,
    Aoatovi, Shongopavi, Oraibi, Hano, Sichomovi, and Katcina racers. Insults, accidental
    killing, refused marriage, or communal wickedness lead chiefs or angry men to
    arrange retaliation. The accounts include races turned violent, raids timed for
    vulnerability, fire and pepper used against men trapped in kivas, killing of women
    and children, capture and distribution of survivors, and a partial account of
    an Oraibi chief arranging punishment of his own people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Racer Katcinas come from Sikyatki to Walpi; a Walpi man cuts off a Katcina's
    hair knot instead of a small portion of a side lock, and the Katcina becomes angry
    and practices running.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a later race at Sikyatki, the angry young man catches clowns and cuts
    portions of their side locks, then kills the sister of the man who cut his hair
    by cutting off her head and escapes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people of Sikyatki are described as very wicked, especially toward women;
    after they do not spare the chief's wife, the chief arranges with Walpi for Walpi
    to destroy the village when the people are planting in the valley.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Walpi attack Sikyatki with balls of pitch, kill women and children, set the
    houses on fire, and kill the returning planters, including the chief who had instigated
    the revenge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In one Aoatovi account, a chief's daughter is killed during a rabbit chase
    on a hunting expedition, and the chief decides the village should be razed to
    the ground in revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four young men dressed as Katcinas bring corn ears to Aoatovi for races; Homsoma/Hornsona
    Katcina throws down a young man and cuts his throat, and pursuers later kill Homsoma
    and two other Katcinas while one escapes after removing his mask and hanging it
    on brush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Aoatovi chief asks the Shongopavi chief to come get his people, is refused,
    then arranges with the Oraibi chief to destroy his people and produces two clay
    figures representing the males and females of his village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Oraibi chief selects the female clay figure, tells warrior chiefs to make
    bows and arrows, and sends nephews to other Hopi villages to ask them to join
    the destruction of Aoatovi; the Shongopavi chief refuses to participate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Aoatovi, the chief and his wife meet the raiders with bundles of piki,
    a signal is arranged, and raiders remove kiva ladders, throw firewood, a firebrand,
    and Spanish pepper into the kivas, and destroy men in the kivas, including the
    Aoatovi chief and his son.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the first Aoatovi destruction account, younger women, maidens, and children
    are taken away, older women are killed, and a dispute over prisoners results in
    many younger and prettier women being killed while others are taken to different
    villages.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A second Aoatovi destruction account says maidens refuse to marry the village
    chief's son; the chief asks the Hano chief to fetch the people and to bring Spanish
    pepper, and the Hano chief informs Sitchomovi and Walpi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the second Aoatovi account, people from three villages attack during a
    storm while Aoatovi men are eating in kivas, remove the ladders, gather women
    and children, throw firebrands into the kivas, destroy the men, and distribute
    the captives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the partial Oraibi account, an Oraibi chief tells a Walpi warrior chief
    that the Oraibi people are bad; they plan for Oraibi people to attack Walpi and
    for Walpi to kill them, except those who pass a certain rock.
  category: sequence
  evidence_refs:
  - ev:7
