canonical_text:
  quote: ''
  summary: After a flood, people from the eastern part of a village prepare food,
    make a food altar, and emigrate. Two surviving children are left behind. A speaking
    turkey directs them to food, and the large water serpent Bdlolookong, their grandfather,
    appears, advises them, and instructs them to cut a piece of his flesh for a rain-making
    rite. The children then follow their people but become exhausted during the journey.
  language: English
  quote_policy: summarized
