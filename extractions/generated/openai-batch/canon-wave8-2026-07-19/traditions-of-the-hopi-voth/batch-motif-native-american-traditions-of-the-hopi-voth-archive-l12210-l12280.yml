canonical_text:
  quote: ''
  summary: The passage recounts Walpi/Katcina visitors coming to Oraibi for races,
    carrying gifts, failing to catch Oraibi runners, losing their presents, making
    a second large circular race around the mesa, and returning home exhausted and
    discouraged. It then begins a separate account of Navaho raids, Oraibi military
    readiness, and a dust cloud signaling an approaching Navaho expedition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group assembled north of the village at Hohoyahki, held two races, stopped
    to avoid exhaustion, and practiced for four days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the fifth day the Walpi arrived at the spring Keqochmovi east of Oraibi
    and dressed there so the Oraibi would not learn of their presence too soon, but
    the Oraibi had noticed them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dressing, the Walpi ran toward the village, stopped briefly at Katcinkihu
    Kuwdawaima, and then continued toward the village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people of the village acted as though they had not seen the visitors,
    although they already knew they were coming.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two Koyemsis among the Katcinas carried gifts, including roasted sweet corn
    ears and other presents.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: An older Oraibi man greeted the visitors in the plaza and asked why they had
    come; the Koyemsis answered that they had come to race the young men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Many Oraibi young men came down from the houses, removed their clothes, and
    raced with the Katcinas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Katcinas became tired and did not catch any Oraibi racer or get close
    enough to strike one with their yucca-leaf whips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Oraibi won all the presents from the Katcinas after the first race.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The man who received the visitors gave them prayer-meal, after which they
    went to the Katcina house south of the village and laid off their costumes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Walpi and Oraibi met again west of the village for another race that ran
    toward Mumushvavi, around the mesa point, and back up the mesa from the east side
    in a large circle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Walpi again failed to overtake the Oraibi, became very tired at Keqochmovi,
    gave up the race, returned slowly and quietly, and agreed not to race the Oraibi
    again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Navaho are described as having repeatedly raided other villages, while
    the Oraibi kept bows ready, quivers full of arrows, and practiced shooting.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: After a report of a large dust cloud in a northeastern canyon, Oraibi men
    gathered their bows and arrows and went to the village, where people on the roofs
    watched the approaching group.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The approaching dust cloud came to be understood as a Navaho expedition against
    Oraibi.
  category: other
  evidence_refs:
  - ev:7
