canonical_text:
  quote: ''
  summary: A young man returns from the Skeleton House, re-enters his body, and tells
    his parents that the dead continue to live, with wicked persons punished and chiefs
    living as chiefs. He later takes medicine, dies, and is buried. His grieving parents
    are visited in the field by a speaking Bachro bird that addresses them as parents,
    says it lives well, and promises visits. The passage then begins another tale
    in which a Shongopavi young man wonders what becomes of the dead, and village
    authorities call Badger Old Man, who has medicine connected with this knowledge.
  language: English
  quote_policy: summarized
