canonical_text:
  quote: ''
  summary: The passage describes several Hopi clans moving toward Shongopavi, Muenkapi,
    and Oraibi/Orafbi; claims to land marked on a bluff near water; Skeleton meeting
    the Bear clan, refusing to be chief, and allotting them land; and later clans
    gaining admission to the village through rain-producing ceremonies and cults,
    including a Bow clan rain dance. It also lists the origins and order of several
    ceremonies and cults associated with named clans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bear people started a village at the site of old Shongopavi, described as
    the first village started.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skeleton is described as already living at the place where Orafbi/Oraibi now
    is.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Spider clan made marks or writing on a bluff east of Muenkapi, saying
    the place should always belong to the Hopi because there was much water and the
    Hopi should plant there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Snake clan and then the Burrowing Owl clan saw or followed the earlier
    writing and wrote the same claim on the bluff.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bear clan asked Skeleton for permission to live with him, for land, and
    for him to be their chief; Skeleton refused to be chief and told them they should
    be chief there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Skeleton said the Bear people had retained their old life from the under-world
    and mentioned a Powaka figure that had come out with them; he also said the White
    Man, their elder brother, would return and cut off the heads of the bad ones.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Skeleton stepped off and allotted a large tract of land to the Bear clan,
    after which the Bear clan built houses east of the bluff of Orafbi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bear clan brought the Soyal cult, Aototo, and the Soyal Katcinas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: When new clans arrived, the village chief asked whether they knew anything
    to produce rain and good crops and whether they had a cult; if accepted, they
    were allowed to live in the village and were given fields.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bow clan leader said the clan had several Katcinas whose dance usually
    brought rain; after a test dance, heavy rain filled the washes, and the clan was
    invited to move into the village and given land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Wuwuchim ceremony was said to take place first, followed by the Soyal
    ceremony, and then the Snake and Flute ceremonies in the Balio month, with several
    cults attributed to specific clans.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Later small bands in the region sometimes moved toward Oraibi, asked for admission,
    and contributed to the gradual building up of the villages.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note reports that the narrator said the bluff writing was later effaced
    by Tuba, Katcinmana, and others who wanted that land.
  category: other
  evidence_refs:
  - ev:9
