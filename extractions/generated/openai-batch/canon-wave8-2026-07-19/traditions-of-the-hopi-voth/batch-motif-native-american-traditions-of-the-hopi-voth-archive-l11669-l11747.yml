canonical_text:
  quote: ''
  summary: 'The passage first recounts a Katcina pursuing two maidens, beheading the
    sister of his enemy, displaying the head, and escaping. This is followed by conflict
    between Sikyatki and Walpi: because the Sikyatki people are described as wicked
    toward women and maidens, their chief conspires with the Walpi chief to destroy
    Sikyatki while its people are planting. Walpi attackers kill those left in the
    village, burn the houses with pitch, seize weapons, and kill the returning planters;
    Sikyatki remains in ruins. The passage then begins a narrative of Aoatovi: its
    people live with ponies, game, and sheep; during a hunt involving maidens, a chief''s
    daughter is run over and killed by a young man chasing a rabbit, after which her
    father angrily resolves that the village should be razed.'
  language: English
  quote_policy: summarized
