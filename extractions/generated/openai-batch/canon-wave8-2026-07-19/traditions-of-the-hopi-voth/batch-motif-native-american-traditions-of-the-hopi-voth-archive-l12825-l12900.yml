  quote: ''
  summary: The passage recounts creation episodes involving eastern and western Huruing
    Wuhti figures, the Sun, Moon, Spider Woman, birds, animals, humans, languages,
    writing tablets, clan ancestors, and an armed encounter in which a deity disables
    guns and releases men after a promise of exchange.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning of the account, only water is present; one Huruing Wuhti
    lives in the eastern ocean and another in the western ocean.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun exists, wears a gray fox skin before rising, changes to a yellow fox
    skin, and morning dawns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two deities cause dry land to appear in the midst of the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Wren is made of clay, flies over the earth, and reports that no living being
    exists.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Spider Woman is said to be living in the southwest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The western deity makes many birds and animals and teaches or has them taught
    their respective sounds and languages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The eastern deity makes the first woman and then the first man from clay and
    gives them understanding of writing on tablets by rubbing their palms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The eastern deity teaches the first man and woman language, takes them over
    a rainbow to her home, keeps them four days, and sends them to choose a place
    to live.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Spider Woman makes a man and woman of clay, identified as Spaniards, teaches
    them Spanish, gives them tablets, and imparts knowledge by rubbing their hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Spider Woman creates other men and women, gives a different language to each
    pair, and an omitted partner episode is used to explain repeated contentions between
    husbands and wives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The western Huruing Wuhti creates many husband-and-wife pairs who live in
    the west as nomadic hunters; after contentions arise, she goes to live in the
    western ocean and tells people to pray to her there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two armed Spaniards go to Huruing Wuhti’s dwelling; she persuades them to
    lay down their guns, has them try to lift a stone, makes their hands adhere, rubs
    the guns to powder, and disappears through an opening in the kiva floor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The deity releases the men after they promise to exchange good things with
    others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the second account, western Huruing Wuhti owns the moon, stars, and all
    hard substances, sends Moon to bring Sun, and she and Sun agree to own all things
    together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Huruing Wuhti and Sun use bird skins, feathers, scales from her cuticle, cloth,
    fire, song, and movement of the cloth to bring birds to life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Sun places the birds in a transparent stone jar; he then uses hair, paints,
    his beard, wings, a covering, and song, after which antelope and other animals
    arise.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Sun says the animals belong to Huruing Wuhti, and they thereafter consider
    her their mother.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Sun returns under the earth to the east and makes land by turning over Huruing
    Wuhti’s land that is under water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: Sun sees beings come out of the water, naming them White People, Spaniards,
    and Mormons; he pours birds from the jar, and they fly and increase.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: Huruing Wuhti creates a little maiden and little boy from pieces of her cuticle,
    names them Yahoya and Muyingwa, and sends them to live on earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: Huruing Wuhti creates further children from scale matter from her umbilicus,
    face, nose, and other bodily matter, assigns clan names or identities, gives corn
    to several, and gives spoiled meat to the Navaho figure.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:22
  text: Sun later sees smoke and camps, gives water and corn to a tired maiden and
    youth, names them Forehead Clan Member and Sun Clan Member, and tells them to
    travel eastward.
  category: sequence
  evidence_refs:
