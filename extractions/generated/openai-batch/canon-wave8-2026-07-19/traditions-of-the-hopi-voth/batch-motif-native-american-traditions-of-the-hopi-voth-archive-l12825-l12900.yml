candidate_motifs:
- id: motif:1
  label: Land appearing from primordial water
  taxonomy_refs:
  - chaos
  basis: The passage begins with nothing but water and says the two deities cause
    dry land to appear in the midst of the water.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The available taxonomy has no exact primordial-waters category; the reference
    to chaos is approximate and should be reviewed.
- id: motif:2
  label: Creation of beings from clay
  taxonomy_refs:
  - culture_hero
  basis: Wren, the first woman and man, and the Spaniard pair are explicitly made
    from clay by divine or powerful figures.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy reference marks creative-agent activity broadly; it does
    not specify clay formation.
- id: motif:3
  label: Language and writing bestowed on newly made people
  taxonomy_refs:
  - wisdom
  basis: Created people receive tablets, understand writing after hand-rubbing, and
    are taught languages; Spider Woman gives different languages to pairs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The wisdom taxonomy is broad; the passage specifically concerns writing,
    language, and imparted understanding.
- id: motif:4
  label: Rainbow journey to a deity’s home
  taxonomy_refs:
  - ascent
  basis: The eastern deity takes the first woman and man over a rainbow to her home,
    where they stay four days before being sent to settle.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage says travel is over a rainbow, but does not explicitly describe
    vertical ascent.
- id: motif:5
  label: Etiology of marital contention
  taxonomy_refs: []
  basis: Spider Woman’s omitted partner episode leads to repeated quarrels and separations,
    and the passage states this is why there are many contentions between men and
    wives.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy reference directly matches this etiological social
    explanation.
- id: motif:6
  label: Conditional release through promised exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Huruing Wuhti releases the armed men after they promise to exchange good
    things with others.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The exchange is a promise made under divine coercion rather than a negotiated
    ritual exchange.
- id: motif:7
  label: Ritual animation through covering, song, fire, and bodily matter
  taxonomy_refs:
  - culture_hero
  - duality
  basis: Huruing Wuhti and Sun cooperate, cover materials with cloth, use fire and
    song, and birds and animals begin to move or arise.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The duality reference is based on cooperation between paired creative
    figures and should be reviewed.
- id: motif:8
  label: Created beings from deity’s body matter
  taxonomy_refs:
  - miraculous_child
