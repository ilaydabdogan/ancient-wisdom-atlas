canonical_text:
  quote: ''
  summary: The passage recounts a dawn song contest between a Cooyoko Uncle and a
    Fox, ending with the Fox killing the Cooyoko after the sun rises during the Fox's
    song. It then gives a tale of Little Gray Mice and Little Brown Mice who once
    cooperated in stealing food and dancing, quarrel over food, mock one another in
    song, and become permanently estranged, explaining why mice are now scattered
    through fields and houses. The passage ends with the beginning of a tale about
    a Badger doctor, Small Gray Mice, and an injured Hopi hunter who finds a light
    and an underground kiva-like room.
  language: English
