canonical_text:
  quote: ''
  summary: The passage contains the end of one narrative in which a dangerous maiden
    competes in hiding and seeking with a youth, kills him, and later becomes a bloody
    game-controlling being after Fly restores the youth. It then gives the narrative
    of a youth whose costume is stolen by another dangerous maiden at a kiva and recovered
    by using a rabbit to lure her away from the opening.
  language: English
  quote_policy: summarized
