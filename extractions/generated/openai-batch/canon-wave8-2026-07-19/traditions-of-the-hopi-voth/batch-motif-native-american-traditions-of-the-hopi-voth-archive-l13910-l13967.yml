- id: obs:1
  text: A maiden uses a mirror to see the opening of Spider's hole and calls the hidden
    youth out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden hides by crossing a watermelon patch, entering a ditch, and turning
    into a tadpole; the youth drinks from the ditch but cannot find her until she
    emerges.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spider Woman sends the youth to his uncle Ahn, who hides him inside a corner
    pole by removing and replacing a loose knot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden locates the hidden youth by wetting her fingers, pressing a forefinger
    into her right ear, and hearing him in the hiding place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiden makes the youth remove his shirt and beads, cuts his throat over
    a hole so the blood runs into it, buries the body in a separate grave, and takes
    the shirt and beads home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fly finds the blood and grave, transfers the blood back into the youth's body,
    and the youth's heart begins to beat before he rises up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Fly tells the restored youth how to reclaim his shirt and beads, warns him
    not to eat the food the maiden offers, and instructs him to shake the returned
    items at her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the shirt and beads are recovered, the maiden is found changed into
    Child-Protruding Woman, bloody and dressed in white owa, while deer, antelope,
    and rabbits described as costumes of slain youths dash out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The transformed maiden says people will have difficulty hunting animals, disappears
