canonical_text:
  quote: ''
  summary: 'The passage first concludes a narrative in which Hiyónatitiwa, his father-in-law,
    and four animals defeat Navaho and Hopi plotters who intended to remove him and
    steal his wife. It then tells of a Shongopavi maiden who, with Spider Woman’s
    help, opens a youth’s tray, becomes his bride, is beautified by bathing, and later
    turns into a dog and runs away. The final section begins an Oraibi earthquake
    story: the people flee north, while a blind man and a lame man cooperate to escape
    and meet a large elk.'
  language: English
  quote_policy: summarized
