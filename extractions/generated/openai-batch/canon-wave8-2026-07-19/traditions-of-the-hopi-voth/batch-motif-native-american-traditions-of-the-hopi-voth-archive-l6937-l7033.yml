canonical_text:
  quote: ''
  summary: In a Pueblo village, two sisters marry the personified Night and are carried
    on a tray to his canyon home, where they discover bones and other captive women.
    A Frog at the water source instructs them to flee, and Spider Woman joins them
    on the road. Clouds overtake them near their home village; lightning kills the
    sisters, but each gives birth to a living child. The mothers are alive at night
    and dead by day while raising the children. Later the children ask about their
    father and are sent toward their grandparents’ village with warnings about a lethal
    contest and a hidden turtle at the ladder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two maiden sisters lived north of the plaza at a house with a long ladder
    in Kawafhkaa and had refused the young men of the village.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Night came in the evening, asked the sisters to marry him, and returned
    the next evening to fetch them after their parents consented.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After leaving the village, the Night had the sisters enter a large tray, and
    they were lifted up and carried through the air to a deep canyon or gulch where
    he lived.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the Night’s house, the sisters saw many human bones in an inner room,
    identified as remains of women stolen from the village and left to perish after
    becoming pregnant.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some women and maidens were still alive at the Night’s place and pitied the
    two newly arrived sisters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A nearby lake supplied water, and the Frog spoke to the younger sister there,
    telling her to flee home at night with her sister by leaving the water jars and
    following a road.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sisters went to the lake in the evening with their water jars, met the
    Frog, and followed the track he indicated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Spider Woman was sitting near the trail in the form or posture of an old hag,
    said she had waited for them, joined them, and told them not to fear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spider Woman looked back and saw approaching clouds, and the clouds overtook
    the travelers near the village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Near the village, lightning struck and killed the two sisters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: As the sisters were killed, the elder sister delivered a boy and the younger
    sister delivered a girl; both children remained alive and began to nurse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mothers were alive during the night and dead during the day while the
    children were brought up.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: When grown somewhat, the children asked their mothers who their father was
    and said they would go to him for care and provision.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The mothers told the children that their father was the one from whom they
    had fled, directed them to Kawafhkaa and the house north of the plaza, and warned
    them about contests in which defeated persons were killed.
  category: speech
  evidence_refs:
  - ev:9
