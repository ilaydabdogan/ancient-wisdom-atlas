canonical_text:
  quote: ''
  summary: The passage recounts part of a Hopi-Navaho battle and retreat near Orafbi/Oraibi.
    Retreating Hopi rest at a spring, wounded men are carried onward, Navaho pursuers
    attempt to cut them off, six Hopi defend a stone enclosure until five are killed,
    and one survivor escapes and hides under a rock. A brave Hopi warrior is pursued,
    then recognized by disguised Walpi fighters among the Navaho; he is encircled,
    overpowered, killed by Shfita with a lance, stripped, his heart removed, and his
    body taken to Walpi. Navaho troops, including women, reach the village where remaining
    Hopi have gathered sheep in the plaza.
  language: English
  quote_policy: summarized
