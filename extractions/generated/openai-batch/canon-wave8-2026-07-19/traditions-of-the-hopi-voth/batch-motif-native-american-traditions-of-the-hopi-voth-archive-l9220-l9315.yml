canonical_text:
  quote: ''
  summary: The passage first describes an unnamed female figure deceived into crushing
    a stone dressed in bird skin; she breaks her teeth, sees her bloody face reflected
    at several springs, flees without drinking, and dies after jumping into the Grand
    Canyon. In the next tale, Aahtu birds sing by a cedar tree, remove their eyes,
    throw them onto the tree, and sing them back. Coyote joins, but his eyes do not
    return; the birds say this is because he is bad and takes other people's things.
    He dies, and the place receives a Coyote-death name. In the following tale fragment,
    a Turtle-dove cuts her hand on grass and moans. Coyote mistakes the crying for
    song, threatens to devour her unless she sings, imitates the sound, repeatedly
    loses it after stumbling, and returns to find her gone.
  language: English
  quote_policy: summarized
