canonical_text:
  quote: ''
  summary: A poor and mocked husband, Piwftamni, is challenged by richer kiva men
    who claim they can provide better for his wife and later propose a wealth contest
    with the wife as the stake. With his grandmother's help, he brings abundant watermelons,
    antelope meat, sashes, buckskins, and women's belts to the kiva, showing that
    he has more than the others.
  language: English
  quote_policy: summarized
literal_observations:
