  text: Piwftamni is described as poor, as repairing and patching clothing rather
    than making new clothing, and as cultivating only a very small field.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: His wife has to live partly on watermelon rinds thrown away by others; the
    passage says her name comes from that fact, and others laugh at her husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Piwftamni has a place in a kiva but usually has little to eat, receives no
    meat, and eats by himself on the floor.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: One old man takes pity on Piwftamni and sits beside him when he eats.
