canonical_text:
  quote: ''
  summary: A young man travels through a landscape with burdened and punished figures,
    Kwanitaka guides, diverging roads, a burning pit, a dark deep place, and a white
    village where good deceased chiefs live in blossoms. He is instructed to report
    what he has seen and then returns past punished thieves and other figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man encounters a person carrying a mealing stone with a hair-string
    burden band and cactus tied to both feet; the person asks him to remove the burden,
    but he refuses because he is in a hurry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the salt, a Kwanitaka is shaking a bell loudly and asks the young man whether
    he has come.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kwanitaka explains that one earlier figure is wicked, does not want summer
    rain, and offends the clouds so that they run away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Kwanitaka explains that another earlier figure killed someone by putting
    something bad into that person, and that such figures move only four steps before
    remaining again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kwanitaka points to one of two diverging roads and directs the young man
    to take it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another Kwanitaka rings, greets the young man, takes hold of him, and leads
    him to a deep burning place compared to a corn steaming oven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the burning place, the Kwanitaka says wicked ones from Oraibi are burned
    there; smoke comes out, and the burned ones eat nothing and are never happy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The guide also shows a very deep and dark place where some are thrown in and
    never come out.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: After returning to another Kwanitaka, the young man is directed onto the other
    road and comes to a large village of white houses.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kwanitaka figures at the edge and entrance of the village lead the young man
    inside, where he recognizes a deceased Oraibi chief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The deceased chief and three other chiefs live in blossoms standing one after
    another.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Kwanitaka says these chiefs were never bad in Oraibi and were always good,
    which is why they live there in that way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The place contains many grasses, plants, and blossoms, and the Kwanitaka says
    non-wicked people from Oraibi will come there by a prepared road.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Kwanitaka instructs the young man to tell others about the life there
    and says people must live accordingly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Kwanitaka tells the young man that if he thinks of coming there someday
    he must eat a little of his medicine again, but he must tell his parents and others
    not to do that way.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: On his return the young man passes the Kwanmongwi at the road division, then
    the punished thieves at Aoatovi who are going to the Skeleton House, and then
    a woman who greets him.
  category: sequence
  evidence_refs:
  - ev:7
