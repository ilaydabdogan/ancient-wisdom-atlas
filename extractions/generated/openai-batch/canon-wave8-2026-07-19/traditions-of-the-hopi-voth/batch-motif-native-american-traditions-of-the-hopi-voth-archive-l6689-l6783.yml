canonical_text:
  quote: ''
  summary: In a contest of hiding and finding, the maiden hides by turning into a
    tadpole in ditch water. Later the youth seeks help from Spider Woman and Ahu,
    who hides him in a hollow piñon post, but the maiden detects him by a hearing
    gesture. After winning, she removes his shirt and beads, cuts his throat over
    a hole, buries him, and lies to his parents. A speaking Fly, after being allowed
    to eat meat, searches for the youth, finds the blood and grave, restores the blood
    to his body, and revives him. The Fly then returns him to his parents and gives
    instructions about recovering his shirt and beads from the maiden.
  language: English
  quote_policy: summarized
