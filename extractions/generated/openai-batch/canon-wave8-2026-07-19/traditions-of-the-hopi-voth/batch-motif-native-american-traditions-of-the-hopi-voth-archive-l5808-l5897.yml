canonical_text:
  quote: ''
  summary: The passage first reports a return from a dark other-world inhabited by
    Skeletons or dead persons. These inhabitants consume only the odor or soul of
    food, say the visitor's flesh is still salty, request nakwakwosis, bahos, and
    prayer-offerings from the village, and promise rain, crops, and food in return.
    The returned speaker says the wicked are punished there by carrying heavy burdens,
    mealing stones, or cactus, and warns that no one should desire to go there. The
    passage then begins the tale of Kochailap Tiyo, a poor youth of Mishongnovi, who
    is outfitted by older men for his first hunt, kills a jack-rabbit, is caught by
    darkness and rain, sees a light at Kawâyldva, finds a kiva, and is invited in
    by a pretty woman.
  language: English
  quote_policy: summarized
