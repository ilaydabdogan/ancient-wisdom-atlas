canonical_text:
  quote: ''
  summary: 'The passage gives several brief tradition summaries: a fragment about
    an Orafbi battle and a dog engraved on a rock; a Katcina race contest in which
    Orafbi youths defeat Walpi Katcinas and win gifts; an extended account of a battle
    with Navaho involving war rites, encirclement, disguise, village raiding, and
    care for wounded survivors; a raid on a Navaho Katcina dance preceded by a falling
    star and explained as the reason Navaho dances have watchers; and a raid on two
    northeastern Hopi villages that leads survivors to relocate to Orafbi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment says many Orafbi flee, many are killed, only a few pass a mentioned
    rock, and a dog is engraved on the rock because of what the dog did in the battle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Walpi propose to go to Orafbi for a Katcina race because Orafbi are described
    as not strong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Orafbi youth visiting a friend in Walpi hears of the racing plan, returns
    early to Orafbi, and tells what he has heard; Orafbi young men practice running
    for four days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fifth day, Walpi arrive dressed up; two Katcinas carry gifts; Orafbi
    youths descend and race with the Katcinas; the Katcinas tire and the Orafbi youths
    win the presents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the last fight with the Navaho, Orafbi men hold councils after news
    of a Navaho expedition; some Hopi go to the Navaho with presents and are weakened
    by blood-letting near the ankle so they can be recognized the next day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hopi warriors protect their bodies with buckskins, some wear society head-dresses,
    war rites are performed, and warriors are decorated with powdered war-god vomisis
    stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Immediately before sunrise, Navaho ascend the mesa; a leading Navaho rides
    up, speaks, and shoots an arrow without hitting anyone; battle begins and Hopi
    drive the Navaho off the mesa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Navaho woman on a pony seizes a lance from a warrior and charges toward
    the Hopi, followed by her people; this breaks the Hopi line and divides them into
    two surrounded parties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Small groups of Hopi break through encirclement, climb a mesa point, hide
    behind rocks, kill some fleeing Navaho, descend elsewhere, and rest at a spring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Six Hopi hide in a stone enclosure; after Navaho obtain firearms, five are
    killed and the sixth rushes through the Navaho, jumps down a steep place, and
    hides under a rock.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hopi discover Hopi from Walpi disguised as Navaho; a brave Hopi warrior is
    surrounded, overpowered, killed, and has his heart torn out, which is seen by
    a man hidden under a rock.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Navaho enter the village, drive out sheep assembled on the plaza, shell corn
    and load it on ponies, and leave with sheep as well as dead and wounded tied on
    horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the Navaho leave, wounded Hopi are brought in, some are placed in the
    home of the Coyote Clan, and on the fourth day survivors are taken to their homes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At a Navaho Katcina dance in a deep canyon, a star falls in front of the head
    dancer during the fifth dance; the Navaho scatter, Oraibi arrive to raid, a battle
    follows, and the account explains this as why Navaho dances have watchers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Two northeastern villages are harassed by Utes or enemies; after an attack
    in which women and maidens are captured, the inhabitants pack their belongings,
    go in line to Orafbi, and are admitted there.
  category: sequence
  evidence_refs:
  - ev:9
