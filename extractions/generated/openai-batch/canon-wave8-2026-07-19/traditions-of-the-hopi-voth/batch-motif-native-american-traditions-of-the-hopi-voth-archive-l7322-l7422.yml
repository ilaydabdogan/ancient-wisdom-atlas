canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a blind man and a lame man cooperate
    to kill an elk, roast its eyes, and are restored to sight and walking. They keep
    vigil overnight, then bring back villagers who had fled, explaining Oraibi's reoccupation.
    The passage then gives a brief tale of Big Head and Goat Horn, explaining a goat-cutting
    practice through friendship and food sharing, and begins a tale of two women friends
    who fetch water and exchange meal invitations.
  language: English
