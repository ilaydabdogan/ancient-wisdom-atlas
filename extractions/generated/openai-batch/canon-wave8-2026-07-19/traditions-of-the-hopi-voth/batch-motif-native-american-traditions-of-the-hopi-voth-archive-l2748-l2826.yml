canonical_text:
  quote: ''
  summary: A buried old man sings over successive mornings while lowering fingers;
    water then emerges from places where bahos had been planted. On the fourth day
    he emerges as a large Balolookong, and water-serpents with streams of water flood
    the village. Some inhabitants die, some flee to higher eastern houses, and old
    men on shelves turn into turkeys. The chiefs prepare bahos and offerings of powdered
    beads and turquoise, then send the Village Chief's son and his sister to drive
    back the Balolookongs. The young man presses down the chief water-serpent; the
    serpents and the siblings disappear. The water recedes, the ground dries, and
    survivors include the turkey-transformed old men and two little brothers in a
    high house.
  language: English
  quote_policy: summarized
