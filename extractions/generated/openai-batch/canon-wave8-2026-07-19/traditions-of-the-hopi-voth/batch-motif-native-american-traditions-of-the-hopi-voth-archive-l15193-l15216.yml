canonical_text:
  quote: ''
  summary: The passage recounts Spaniards entering Oraibi, making peace, receiving
    Hopi permission to live there, and building mission structures. The Hopi are baptized
    and initially interact with Spaniards through instruction, labor, exchange, cattle,
    and rain. Priests later forbid Katcina dances and baho-making, drought follows,
    Hopi ceremonies resume without rain, and the padres oppress the Hopi and violate
    local religious and social norms. After council deliberation, members of the Badger
    clan kill the remaining padre. Other villages do likewise, and mission materials
    are later reused for kivas, while some bells remain with the Agave fraternity.
  language: English
  quote_policy: summarized
