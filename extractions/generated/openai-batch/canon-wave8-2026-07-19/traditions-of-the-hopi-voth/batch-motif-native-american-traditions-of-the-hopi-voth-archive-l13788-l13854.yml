  quote_or_summary: A Kohonino hunter wounds and follows a mountain sheep, falls over
    a ledge, loses both eyes, lies unconscious, and revives at night as a skeleton
    while villagers keep a fire and wait.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:2
  type: summary
  locator: lines 13794-13798
  quote_or_summary: The skeleton returns to the village; the people see and hear him,
    flee with belongings and children, and he takes possession of the houses; the
    Kohonino settle elsewhere.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:3
  type: summary
  locator: lines 13800-13803
  quote_or_summary: The tale of the White Corn-Ear Maiden begins with the maiden refusing
    all offers of marriage.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:4
  type: summary
  locator: lines 13803-13806
  quote_or_summary: Kiva inhabitants identified as sorcerers decide to destroy the
    maiden and make a wheel of feathered arrows with her breath wrapped into it and
    one poisoned arrow included.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:5
  type: summary
  locator: lines 13806-13808
  quote_or_summary: Young men play with the wheel and arrows near the maiden's house;
    one wounds her foot with the poisoned arrow, and she dies that night.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:6
  type: summary
  locator: lines 13808-13815
  quote_or_summary: After burial, the sorcerers turn into coyotes and other animals,
    imitate animal sounds, tear old wrappings so people will think coyotes ate the
    body, disinter the maiden, and carry her on a gray wolf's back.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:7
  type: summary
  locator: lines 13811-13818
  quote_or_summary: The maiden's brother watches the grave, hears the approaching
    animals speak, follows them to their meeting place, and returns to the village
    to seek help from the war chief.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:8
  type: summary
  locator: lines 13818-13824
  quote_or_summary: The war chief puts on war costume, whistles upward, and receives
    promises of aid from a star-and-cloud deity, Hawk, and many skeleton flies that
    drink his spittle and are enclosed in his hand.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:9
  type: summary
  locator: lines 13824-13830
  quote_or_summary: At the sorcerers' kiva, the rescuers find the sorcerers reviving
    the maiden; an old man puts the breath from the wheel into her body, she revives,
    cries, and an old woman washes and dresses her.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:10
  type: summary
  locator: lines 13830-13834
  quote_or_summary: A skeleton fly is released and hums; Hawk rushes into the kiva,
    grabs the maiden, and carries her out on his back; the brother speaks and the
    old man challenges the intruders.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:11
  type: summary
  locator: lines 13834-13838
  quote_or_summary: In a contest of strength, the fire is extinguished; sorcerers
    shoot small dangerous arrows at the warriors' shields, and the fire is rekindled,
    showing the warriors are not dead.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:12
  type: summary
  locator: lines 13838-13841
  quote_or_summary: When challenged again, the fire is extinguished and the war chief
    releases bees from a small sack; they sting the sorcerers, their wives, and children
    until the old man begs them to stop.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:13
  type: summary
  locator: lines 13841-13843
  quote_or_summary: The star-and-cloud deity throws lightning that tears the sorcerers
    to pieces.
  source_text_path: texts/public-domain/hopi/project-gutenberg/traditions-of-the-hopi-voth.md
  rights_note: Public domain source; summary only.
- id: ev:14
  type: summary
  locator: lines 13843-13847
  quote_or_summary: The warriors return, the deity ascends to the sky and finds the
