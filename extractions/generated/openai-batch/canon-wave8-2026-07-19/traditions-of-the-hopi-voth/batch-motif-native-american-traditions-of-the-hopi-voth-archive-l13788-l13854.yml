canonical_text:
  quote: ''
  summary: The passage summarizes the end of one tale about a hunter who becomes a
    skeleton and occupies abandoned houses, then presents the tale of the White Corn-Ear
    Maiden and the Sorcerers, in which sorcerers kill and abduct a maiden, revive
    her, are opposed by her brother, a war chief, Hawk, and a star-and-cloud deity,
    and are destroyed and later punished. The passage closes with the opening of another
    tale about Watermelon-Rind Woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kohonino hunter wounds a mountain sheep, follows it, falls from a ledge,
    loses both eyes, lies unconscious, revives at night as a skeleton, and returns
    to the village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of the village see and hear the skeleton, flee with their possessions
    and children, and the skeleton takes possession of the houses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The White Corn-Ear Maiden refuses all marriage offers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kiva inhabitants identified as sorcerers decide to destroy the maiden by making
    a wheel of feathered arrows, placing her breath into it, and including a poisoned
    arrow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A young man wounds the maiden's foot with the poisoned arrow, and she dies
    at night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the maiden's burial, the sorcerers change into coyotes and other animals,
    imitate animal sounds, make it appear that coyotes have eaten the corpse, disinter
    the body, and carry it away on a gray wolf's back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The maiden's brother watches the grave, follows the animal-shaped sorcerers
    to their meeting place, hears them speak, and returns to the village for help.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A war chief whistles upward and receives help from a star-and-cloud deity,
    Hawk, and many skeleton flies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the sorcerers' kiva, an old man places the maiden's breath from the wheel
    back into her body, and she revives.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hawk enters the kiva, seizes the maiden, and carries her out on his back.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: During a contest in the kiva, the fire is extinguished, sorcerers shoot small
    dangerous arrows against the warriors' shields, and the fire is rekindled.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: When the fire is extinguished again, the war chief releases bees from a small
    sack; the bees sting the sorcerers and their families.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The star-and-cloud deity throws lightning that tears the sorcerers to pieces.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The deity ascends to the sky, where he finds the maiden after Hawk has taken
    her there; she remains there for a time grinding corn-meal.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Hawk later brings the maiden to earth near Oraibi; she tells her parents that
    when she dies they should not wrap and tie her body.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: After she fails to awake one morning, her body is treated as eagles are treated
    when buried; her brother watches the grave for four days, and it is not disturbed.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The star-and-cloud deity restores his victims to life but mixes parts of different
    bodies as punishment, causing ridicule; the restored persons later die through
    accidents.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: After the last punished person dies, the maiden descends from the sky, lives
    in the village for a long time, later dies, and goes to the sky to live with war
    chiefs.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: The opening of the following tale states that a pretty maiden refuses all
    offers of marriage and that a poor young man is instructed by his grandmother
    to bring two fawns to her at a rock.
  category: sequence
  evidence_refs:
  - ev:19
