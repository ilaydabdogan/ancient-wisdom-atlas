candidate_motifs:
- id: motif:1
  label: Hunter injured in pursuit returns as skeleton
  taxonomy_refs:
  - death_rebirth
  basis: The hunter falls, lies unconscious, revives at night as a skeleton, and takes
    over the abandoned houses.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage summarizes a transformation into a skeleton rather than a
    full restoration to ordinary life.
- id: motif:2
  label: Refusal of marriage followed by hostile magic
  taxonomy_refs: []
  basis: The White Corn-Ear Maiden refuses all offers of marriage, after which kiva
    sorcerers decide to destroy her by ritual manipulation of a feathered-arrow wheel
    containing her breath.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: No taxonomy reference is assigned because the available motif families
    do not directly name this pattern.
- id: motif:3
  label: Externalized or manipulated breath used to kill and revive
  taxonomy_refs:
  - death_rebirth
  basis: The sorcerers wrap the maiden's breath into a wheel used in her killing,
    and an old man later puts the breath back into her body to revive her.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage calls the vital element breath; broader soul or life-token
    interpretations are not asserted.
- id: motif:4
  label: Sorcerers as animal shapeshifters
  taxonomy_refs:
  - shapeshifter
  basis: The sorcerers change into coyotes and other animals, imitate animal sounds,
    and use those forms while approaching the graveyard and removing the body.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not explain whether the animal forms are complete transformations,
    disguises, or ritual forms beyond saying they change themselves.
- id: motif:5
  label: Watched grave and stolen corpse
  taxonomy_refs: []
  basis: The brother watches the grave, sees animal-shaped sorcerers approach, and
    follows them after they disinter and carry away the maiden's body.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No available taxonomy reference directly matches grave-watching and corpse
    abduction.
- id: motif:6
  label: Summoned helper beings aid a rescue
  taxonomy_refs: []
  basis: The war chief summons a star-and-cloud deity, Hawk, and skeleton flies, who
    assist in the expedition to the sorcerers' kiva.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage presents a rescue party but does not frame it as a quest beyond
    the immediate action.
- id: motif:7
  label: Avian rescuer transports a maiden
  taxonomy_refs: []
  basis: Hawk carries the maiden out of the kiva on his back and later moves her from
    the sky back to earth.
