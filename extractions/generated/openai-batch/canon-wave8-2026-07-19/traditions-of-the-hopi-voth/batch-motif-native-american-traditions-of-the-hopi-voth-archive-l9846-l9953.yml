canonical_text:
  quote: ''
  summary: Badger and Coyote gather a maiden's bones. Badger covers them with a black
    kilt, adds dry grass, red paint, and spring water, sends Coyote away from the
    ritual, sings, and restores the maiden to life. Coyote desires her as a wife despite
    Badger saying she is to be their clan sister and fire-builder; Coyote bites her
    leg and she dies again. After burying her, Badger plans revenge, prepares bull-snakes
    as food, deceives Coyote by claiming he roasted his own entrails, and lends Coyote
    a knife and pot so that Coyote may attempt the same.
  language: English
  quote_policy: summarized
