canonical_text:
  quote: A very long time ago there was nothing but water.
  summary: The passage opens an origin myth in a water-covered world where two Huruing
    Wuhti deities live in eastern and western ocean kivas and the Sun travels through
    their kivas. The deities make dry land, consult about the absence of living beings,
    create a wren scout, then create birds, animals, and finally a woman and a man.
    Created beings are taught their sounds or languages, and the first humans receive
    tablets and are enlightened by the eastern deity rubbing their palms.
  language: English
  quote_policy: quoted
