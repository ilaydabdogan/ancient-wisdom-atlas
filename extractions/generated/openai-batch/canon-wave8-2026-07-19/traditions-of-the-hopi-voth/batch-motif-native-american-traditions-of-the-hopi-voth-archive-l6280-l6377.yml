canonical_text:
  quote: ''
  summary: A young man and warriors confront sorcerers in a kiva over the young man's
    sister. In a contest conducted with the fire extinguished, the sorcerers shoot
    small arrows at the warriors, who survive behind shields; the war chief then releases
    bees against the sorcerers. C6tukvnangwuu throws lightning among the sorcerers
    and destroys them. The maiden is taken in the sky by warrior beings and later
    returned by Hawk, visits the sky repeatedly, dies, and is buried according to
    special instructions. C6tukvnangwuu restores the destroyed sorcerers with mismatched
    body parts as punishment, making them objects of ridicule.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man says he watched the old man take out the body of his sister
    and followed the group to the kiva where they sang over her body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old warrior asks why the sorcerers took the maiden and says they made
    her brother sad.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man proposes that the two sides measure each other to see who is stronger
    and braver.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the fire is extinguished, the sorcerers shoot small dangerous arrows
    at the warriors, and the arrows are heard striking the warriors' shields.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the fire is rekindled, the warriors are still standing and say they are
    not dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The war chief releases live bees from a small sack, and the bees sting the
    sorcerers, their wives, and their children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: C6tukvnangwuu throws a ray of lightning among the sorcerers, filling the kiva
    with bright light and tearing them to pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The old warrior tells the destroyed enemies that they are dangerous and bad
    and that they ought not to be living.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: C6tukvnangwuu ascends to the sky and finds the maiden there, where Hawk had
    taken her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the sky house, skins of Eagle Body, Kwayo, and Hawk hang on the walls.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The maiden stays for a time in the sky house grinding corn meal and preparing
    food for the warriors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hawk takes the maiden on his back and descends swiftly to earth, depositing
    her near Oraibi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The maiden tells her parents that she had died, that chiefs from above had
    rescued her, and that her body should not be wrapped or tied when she dies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The maiden disappears and returns after four days, then later after six days,
    and a third time after ten days, saying she had visited the chiefs above.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The maiden later fails to awake and is found dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Her body is treated like the bodies of eagles when they are buried, with nakwakwosis
    tied to her hands and legs and laid on her breast, and without wrapping or tying
    her body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Her brother watches the grave for four days, and this time it is not disturbed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: C6tukvnangwuu restores the destroyed sorcerers but deliberately gives mixed-up
    body parts to different individuals as punishment.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: The restored sorcerers are ridiculed by the people, and examples are given
    of mismatched limbs and heads.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:20
  text: A village man's wife, who had been among the sorcerers, hides an old man's
    wrinkled leg that has been substituted for one of her own legs.
  category: sequence
  evidence_refs:
  - ev:11
