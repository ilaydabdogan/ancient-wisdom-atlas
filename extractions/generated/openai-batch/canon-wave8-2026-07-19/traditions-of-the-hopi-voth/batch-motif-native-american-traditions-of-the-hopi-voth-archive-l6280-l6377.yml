- id: motif:1
  label: magical contest in darkness
  taxonomy_refs: []
  basis: 'The kiva fire is extinguished for each side''s display of power: the sorcerers''
    arrows fail against shields, and the war chief''s bees overcome the sorcerers''
    household.'
  evidence_refs:
  - ev:3
