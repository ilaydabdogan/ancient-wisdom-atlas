- id: motif:2
  label: supernatural weapon destroys dangerous opponents
  taxonomy_refs:
  - divine_judgment
  basis: C6tukvnangwuu uses lightning to tear the sorcerers to pieces after they are
    accused of being bad, dangerous, and mistreating the maiden.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is functional; the passage calls the act punishment
    but does not explicitly define C6tukvnangwuu as a deity.
- id: motif:3
  label: restoration with altered bodies as punishment
  taxonomy_refs:
  - death_rebirth
  - divine_judgment
  basis: Destroyed sorcerers are restored to life, but their body parts are mixed
    with those of others as a punishment that makes them ridiculed.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The restoration is punitive rather than a full renewal or heroic rebirth.
