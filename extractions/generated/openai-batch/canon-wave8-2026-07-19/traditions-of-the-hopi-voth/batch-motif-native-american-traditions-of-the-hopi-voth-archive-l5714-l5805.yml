canonical_text:
  quote: ''
  summary: A young man visits the Skeleton house in the other world, hears instructions
    from the dead about rain-making rites and burial wrapping, observes punishments
    and ritual objects there, returns by a bluff, re-enters his body, and recounts
    the westward route through cactus, a precipice, smoke from a place where wicked
    people are burned, and the Skeleton house where he is recognized by clan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead inhabitants say their place is not light, that they live poorly,
    that the young man cannot stay because his flesh is still strong and he still
    eats food, while they eat only the odor of food.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead instruct the young man to make nakwakwosis for them at the Soy£l
    ceremony; they say they tie these around their foreheads, that they represent
    dropping rain, and that the dead will send rain and crops.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dead instruct that women be wrapped in the 6wa and tied with a large knotted
    belt when they die; they describe Skeletons moving through the sky as clouds on
    these wrappings, with small raindrops through the weave and large drops from the
    belt fringes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some Skeletons carry mealing stones by a thin forehead string or carry thorny
    cactus bundles on their bare backs as punishments for a certain length of time
    before being relieved.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chiefs who had been good in this world are seen with their tfponis set up;
    ceremonial smoke from village ceremonies goes down to those objects or mothers
    and rises in the form of clouds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After seeing the place, the young man returns to a steep bluff, mounts his
    kilt, and is lifted upward by a slight breeze; the Kwaniita chief with a large
    horn head-dress tells him to return home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the young man nears his house, his covered body begins to move; he enters
    his body, comes to life again, and the Badger Old Man wipes him, washes paint
    from his face, discharms him, and feeds him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In his account, the young man says he was dressed, laid down, fed something,
    given medicine on his heart, died, and traveled westward.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the westward journey, he meets a woman living in a brush enclosure who
    is also slowly moving westward; she says the Skeleton house is not very far away.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The route includes closely growing cactus, another cactus called 6co, a clear
    place, and then a very steep bluff.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the bluff, a one-horned Kwdniita chief lowers the young man on his kilt
    so that he descends slowly as if flying.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At a place where much smoke comes out of the ground, a Skeleton woman warns
    him not to go there and says wicked people are thrown in and burned there.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: At the Skeleton house, children announce that a Skeleton has come; the young
    man realizes they mean him, enters, sees many rows of houses, and is told by the
    people that he is from the Bear clan.
  category: sequence
  evidence_refs:
  - ev:12
