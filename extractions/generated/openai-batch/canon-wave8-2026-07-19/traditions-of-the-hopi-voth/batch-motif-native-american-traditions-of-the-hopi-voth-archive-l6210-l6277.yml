canonical_text:
  quote: ''
  summary: A young man follows a group to their meeting place, sees his sister's body,
    and seeks help from an old war chief. The war chief equips them and summons Cotukvnangwuu,
    the Star and Cloud deity, Hawk, and skeleton flies. They enter the sorcerers'
    kiva unseen while the sorcerers restore the maiden's breath from a wheel and revive
    her. After she is prepared and threatened with punishment, the old warrior releases
    a fly as a distraction, and Hawk carries the maiden out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man follows the group at a distance to their meeting place and sees
    his sister's body lying north of the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man returns to the village seeking someone strong and courageous
    enough to help rescue his sister's body, and he goes to the war chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the war chief's house, the war chief's wife answers the young man's call,
    wakes her husband, and the hosts invite the young man in and make a fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man tells his story and asks the old war chief for assistance; the
    war chief promises help and gives the young man war costume, shield, weapons,
    and related gear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old war chief uses a bone whistle and whistles upward; Cotukvnangwuu,
    identified as the Star and Cloud deity living in the sky, enters and promises
    assistance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old war chief whistles again, and Hawk flies down into the room and promises
    to go with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old war chief spits into his left hand, whistles again, and many skeleton
    flies come, drink his spittle, and are enclosed in his hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The rescue party goes to the place of the assembled sorcerers, described as
    resembling a Hopi kiva, and enters without being noticed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The sorcerers are resuscitating the maiden: they unwrap the body, cover it
    with a native cloth, sing, and bring a wheel containing the maiden''s breath.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: One of the oldest sorcerers takes the breath from the wheel and puts it back
    into the body, whereupon the maiden revives and speaks of being hot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the revived maiden sees that she is among the sorcerers she cries; those
    present have reassumed Hopi forms, and an old woman washes her face, applies corn
    meal, combs her hair into whorls, and dresses her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The maiden is told to lie on a prepared bed, and the note states that she
    is told all the men present will cohabit with her as punishment for refusing to
    marry one of the young men of the village.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The old warrior releases a skeleton fly; its humming draws attention, with
    some present saying someone is in the kiva and some seeing the fly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Hawk rushes into the kiva, throws aside the old man, takes the maiden, swings
    her onto his back, and carries her out.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the maiden is carried out, the brother speaks, and the sorcerers notice
    the presence of their enemies.
  category: sequence
  evidence_refs:
  - ev:10
