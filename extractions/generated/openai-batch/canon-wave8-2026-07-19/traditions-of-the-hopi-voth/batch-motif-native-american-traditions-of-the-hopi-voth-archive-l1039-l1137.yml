canonical_text:
  quote: ''
  summary: After the sun is created, groups disperse eastward toward the sunrise.
    The White People travel south, the Hopi north, and Pueblo Indians between them.
    A woman makes horses from body scales, enabling faster travel; the White People
    reach the sunrise first, stars fall, and other groups settle where they are. A
    new section recounts people living below in a once-good world that declines through
    wrongdoing, drought, illness, sorcery, and contention. Chiefs plan escape upward
    after hearing footsteps above. They create and animate a Pawaokaya bird, plant
    a pine/fir that fails to reach upward and a reed that does, and send the bird
    upward through an opening to scout the upper space.
  language: English
  quote_policy: summarized
