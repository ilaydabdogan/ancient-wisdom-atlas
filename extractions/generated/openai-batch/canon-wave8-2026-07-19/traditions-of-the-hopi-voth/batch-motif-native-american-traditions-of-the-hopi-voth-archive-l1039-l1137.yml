- id: obs:1
  text: After the sun had been created, people were happy because it was warm and
    light, and chiefs met to discuss moving away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs proposed going eastward to see where the sun rises, with different
    parties taking different routes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The White People took a southern route, the Hopi a more northern route, and
    the Pueblo Indians of New Mexico traveled between them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some parties stayed at places for years, built houses, and planted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The parties became estranged and attacked and killed one another; the Castilians
    are described as especially warlike.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chiefs had agreed that when one party reached the place where the sun
    rises, many stars would fall from the sky and all other parties should settle
    where they were.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One woman bathed, rubbed scales from her body, and made horses from the scales.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The horses enabled the White People to travel faster and reach the sunrise
    before the other parties.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the White People reached the place where the sun rises, many stars fell
    from the sky, and the remaining travelers settled where they were.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The parties had also agreed that those who reached the sunrise would help
    the others if enemies molested them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the beginning of the Hopi wandering account, people lived down below where
    everything was good, rainy, fertile, and blossoming.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The lower world changed after chiefs and then people became bad; rain stopped,
    crops became small, winds blew, and people became sick.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sorcerers increased, people lived in contention, and wives of chiefs were
    taken away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The chiefs became angry, planned revenge, and began thinking of escaping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The chiefs had heard sounds above like footsteps and wanted to investigate
    whether they might move upward.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: The chiefs made a Pawaokaya bird, sang over it, and brought it to life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The animated bird spoke and was asked to go above, investigate the sounds,
    and report whether the people could find another way of living.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The chief planted a pine or fir, but it did not reach upward; he then planted
