canonical_text:
  quote: ''
  summary: Katcinas flee westward from the mesa and are pursued by men from Aoatovi.
    Three Katcinas are overtaken and killed, while the last removes and swings his
    mask, hangs it on brush, crosses a wash, and is spared under a prior agreement.
    The Aoatovi chief then seeks to have his own village destroyed, first offering
    his people to the Shongopavi chief, who refuses, and then to the Oraibi chief,
    who accepts after receiving two clay figures representing the male and female
    populations.
  language: English
  quote_policy: summarized
