- id: obs:1
  text: The Katcinas descended the mesa and ran westward along the trail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of Aoatovi on horseback overtook and killed three named Katcinas before
    the wash was crossed.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The remaining Katcina removed his mask, swung it four times in front of himself,
    placed it on brush, and crossed the wash.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A prior arrangement stated that Katcinas who crossed the wash before being
    overtaken were not to be killed, while those overtaken before crossing could be
    killed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pursuers stopped when they found the mask on the brush and returned without
    following the last Katcina.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Shongopavi chief thanked the returned Katcina and acknowledged that the
    others had been killed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Aoatovi chief came to the Shongopavi chief at night, and the Shongopavi
    chief built a fire before speaking with him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Aoatovi chief offered all his people to the Shongopavi chief, specifying
    that women and maidens could be taken while men and old women could be killed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Shongopavi chief refused the offer, saying the death of one Aoatovi young
    man and the killing of three Katcinas made the parties even.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Aoatovi chief later visited the Oraibi chief at night, and the Oraibi
    chief built a fire and smoked with him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Oraibi chief said he would assist only if the Aoatovi chief truly did
    not value his people and village, and the Aoatovi chief affirmed that he wanted
    the village destroyed and grass to grow there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Aoatovi chief produced two small clay figures, one representing the males
    and one representing the females of his village; the Oraibi chief selected the
    figure representing the females.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Aoatovi chief instructed the Oraibi chief to spend four days making bows
    and arrows, invite people from other villages, and come on the fifth day to kill
    them.
  category: speech
  evidence_refs:
  - ev:9
