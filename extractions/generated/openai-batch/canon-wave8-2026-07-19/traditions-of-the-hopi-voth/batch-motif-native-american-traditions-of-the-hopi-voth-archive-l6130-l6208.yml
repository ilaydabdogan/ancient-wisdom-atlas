  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: White Corn-Ear Maiden is described as a beautiful maiden living in Oraibi
    who persistently refuses marriage offers from young men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inhabitants of the Wikolapi kiva are identified as sorcerers who become
