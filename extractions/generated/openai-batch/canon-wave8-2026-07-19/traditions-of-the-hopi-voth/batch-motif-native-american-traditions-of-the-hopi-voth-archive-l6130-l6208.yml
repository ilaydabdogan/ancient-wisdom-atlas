canonical_text:
  quote: ''
  summary: 'The passage concludes a tale in which a Skeleton approaches the K6honino,
    causing them to flee and settle near Green Bluff, then begins a tale of White
    Corn-Ear Maiden: sorcerers angered by her refusal of suitors use a wheel, feathered
    arrows, and rattlesnake poison to kill her, transform into animals, and remove
    her corpse from the grave while her brother watches.'
  language: English with Hopi and K6honino terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A moaning or crying Skeleton approaches the bluff where his people are living,
    and the village people see and hear him near their camp-fires.
  category: action
  evidence_refs:
  - ev:1
