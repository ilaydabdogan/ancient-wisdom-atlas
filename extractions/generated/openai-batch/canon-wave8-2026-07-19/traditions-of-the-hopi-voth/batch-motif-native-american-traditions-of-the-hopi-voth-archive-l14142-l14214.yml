  summary: The passage summarizes a Hopi tale in which eagles carry a young man away
    after his sisters mistreat them; Wren, Black Spider, Spider Woman, Mole, and animals
    of prey help him survive, defeat Hasohkata, descend through a sky opening, and
    reunite with his parents. It then summarizes a second tale in which a Hawk rescues
    a captive Hopi boy from Navajo captors and returns him to Oraibi.
  language: English
