candidate_motifs:
- id: motif:1
  label: Emergence upward from a lower world through a plant-supported opening
  taxonomy_refs:
  - ascent
  - sacred_tree_axis
  basis: The people leave the under-world by means of an opening reached by a planted
    pine and reed, with climbers ascending the reed.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a compressed summary, so ritual or theological details
    beyond the literal ascent should not be inferred.
- id: motif:2
  label: Post-emergence dispersal with language differentiation
  taxonomy_refs:
  - departure
  basis: After the emergence, Mocking-bird distributes languages, groups set out on
    different routes, and later groups receive clan names from incidents.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not give a detailed speech or origin-of-language episode
    beyond one summary sentence.
- id: motif:3
  label: Death as return to the lower world
  taxonomy_refs:
  - afterlife_journey_map
  - return
  basis: The chief sees his dead son walking in the other world and says that people
    who die will go back to the lower world.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage identifies a destination for the dead but does not provide
    a full afterlife journey map.
- id: motif:4
  label: Coyote places stars in the sky
  taxonomy_refs:
  - culture_hero
  basis: Coyote holds stars and throws them into the sky.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only a single summarized sentence is given; no motive or larger creation
    context is included.
- id: motif:5
  label: Spider creates burros from her own skin scales
  taxonomy_refs:
  - culture_hero
  basis: Spider, taken by the white people, creates burros from scales rubbed from
    her skin, enabling their group to proceed quickly.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The exact function and status of Spider are only briefly summarized.
- id: motif:6
  label: Initiation through ritual burning, death-like treatment, and revival
  taxonomy_refs:
  - initiation
  - death_rebirth
  - resurrection
  basis: Hawk-man throws boys into ovens, their costumes burn, their bodies are covered,
    he sings over them until they live again, and similar oven-jump and resuscitation
    rites recur publicly.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The record should distinguish the narrated resuscitation motif from any
    external ethnographic interpretation of the rite.
- id: motif:7
  label: Four-day seclusion and division into ritual offices
  taxonomy_refs:
  - initiation
  basis: Hawk-man instructs the youths to remain in the kiva, separates them by a
