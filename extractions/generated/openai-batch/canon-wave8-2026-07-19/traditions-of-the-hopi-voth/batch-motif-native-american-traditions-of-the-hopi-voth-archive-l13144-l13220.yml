  summary: The passage summarizes Hopi traditions of emergence from an under-world,
    migration and clan naming, the origin of the Yayaatu Society through Hawk-man's
    fire and resurrection rites, the migration and rain-making powers of Mishongnovi
    clans, and the beginning of an account of Palatkwapi's destruction.
  language: English
  quote_policy: summarized
