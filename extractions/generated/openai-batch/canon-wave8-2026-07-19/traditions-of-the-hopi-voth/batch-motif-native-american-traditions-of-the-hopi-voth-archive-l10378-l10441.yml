canonical_text:
  quote: ''
  summary: After earlier failure, the chief asks the Bull-snake and then the Racer
    to reach the Locusts through deep snow. The Bull-snake turns back from cold, but
    the Racer advances by resting in sun-warmed bare places and reaches the warm area
    around Tdvanashavi and the Locusts' kiva. The Locusts feed him and hear his request
    for help because the Snake people lack wood and children are dying from cold.
    They promise to come in four days. A Locust plays a flute along the Racer's tracks,
    making a safe road for his return. On the fourth evening the Locusts arrive at
    the Snake kiva in warm rabbit-skin costumes, chirping through flutes; as they
    travel the snow melts, and when they enter, the kiva becomes hot. They line up,
    sing, dance, and shake rattles.
  language: English
  quote_policy: summarized
