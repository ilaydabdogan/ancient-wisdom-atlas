  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Because it was still dark and cold and there was no fire, the people searched
    for fire and wood and noticed a light in the distance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A messenger reached the light and found a planted field surrounded by fire,
    which warmed the ground so that crops could grow.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The messenger found a handsome man with turquoise ornaments and black facial
