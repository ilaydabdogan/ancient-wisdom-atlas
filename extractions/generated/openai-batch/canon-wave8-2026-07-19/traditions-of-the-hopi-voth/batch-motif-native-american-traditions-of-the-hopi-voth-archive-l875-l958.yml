canonical_text:
  quote: ''
  summary: The passage describes people emerging from the under-world through an opening
    later called sfpapu; some remain below when the Mocking-bird's songs are exhausted.
    In a dark world without sun, the chief's son dies, and a corn-meal ball identifies
    the chief's nephew as dangerous. The nephew shows the chief the dead child below
    and explains that the dead go there. The people then seek fire and find Skeleton/Masauwuu,
    who has a warmed field, fire, and continually available crops, and who feeds and
    warms them.
  language: English
  quote_policy: summarized
