canonical_text:
  quote: ''
  summary: The excerpt first describes souls connected with bull-snake forms being
    released to the Skeleton House when killed. It then begins a tale in which a youth
    at Orafbi seeks knowledge about whether the dead live elsewhere, prays with corn
    meal to the Sun, receives a substance to eat before sleeping, enters a death-like
    state, and travels toward the Skeleton House, where he encounters dead or burdened
    figures who ask him for help.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden in bull-snake form is killed by her parents, who do not know she
    is their daughter; her soul is then liberated and goes to the Skeleton House.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some sorcerers are said to leave their graves in bull-snake form, and bull
    snakes are described as coming out of certain graves still wound in yucca leaves
    used for corpses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a bull snake believed to contain a sorcerer is killed, the sorcerer's soul
    is said to be set free and to go to the Skeleton House.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A youth living at H6nletsnoma's house in Orafbi sits at the edge of the mesa
    in the morning and thinks about the graveyard and whether the dead live somewhere
    else.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youth obtains corn meal and repeatedly prays with it to the Sun, asking
    whether the buried dead have been seen elsewhere.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After four days of prayer, the Sun comes to the mesa, says that the dead are
    living, and asks whether the youth wants to see them.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Sun gives the youth something to eat before sleep and instructs him to
    tell his family about it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The youth tells his parents his plan; his mother warns him, and his father
    agrees after the youth says they should work on him after the sun is high so that
    he may return and wake up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The youth eats the medicine in the evening, sleeps, is described as entirely
    dead, and goes to the Skeleton House.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Apdhnivi, on the north-side descent, the youth meets a long-dead person
    whom he recognizes.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The recognized dead person asks the youth to carry him four steps; the youth
    refuses because he is in a hurry, and the person cries.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The youth later meets another seated person who speaks in the same manner,
    and he again refuses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Bow Height, the youth sees a woman carrying very hard stone in a carrying
    basket with a bowstring burden band that has cut into her head skin; she asks
    him to take it, and he refuses.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
