canonical_text:
  quote: ''
  summary: 'The passage first concludes an earlier narrative: a sorcerer leader dies
    in a ladder accident involving a spindle, the remaining victims die in accidents,
    and a maiden returns from and later to the sky. It then begins the story of Watermelon-Rind
    Woman: a pretty Oraibi maiden refuses suitors, but Piwitamni, a poor young man
    aided by his grandmother, gives her two fawns. Her parents consent to the marriage,
    she goes to his home and grinds corn for four days. Although no one is expected
    to provide her bridal costume, a feast is held, guests announce that a costume
    has been prepared, and the grandmother later sends the bride home publicly dressed
    in bridal clothing along a cornmeal-sprinkled road.'
  language: English
  quote_policy: summarized
