canonical_text:
  quote: ''
  summary: Villagers assemble in a kiva after a crier's call, unmask a ghost-like
    masked personage as the chief's son, and receive instructions involving bahos
    and a four-day feast. The people later learn that the threatened evil was tied
    to a four-year delay. In the fourth year, an angry old man, the village chief,
    and the Crier Chief arrange a nocturnal ritual in which the old man is painted
    as Balolookong, hidden in a shrine with sharp bahos, a whistle, and water, and
    produces rumbling sounds before his hand appears from the ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crier calls all residents to assemble, and the people fill the kiva.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old men cry and say the conduct must have a purpose and that the figure wants
    to do something bad.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The village chief requests that someone remove the masks from the ghost-like
    figure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Multiple masks are removed in sequence; after three masks, a fourth mask is
    identified as a Katcfn-mana mask.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the final mask is removed, the personage is identified as the chief's
    son, with bahos tied to each wrist and ankle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The exposed youth is described as clean and handsome, with turquoise ear pendants,
    beads, washed hair, and two black painted lines on his face.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youth instructs the people to thrust the bahos into the ground at the
    plaza and at designated house corners, and to feast for four days.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The people fear that evil may follow the feast, but after four days nothing
    happens; three years pass before the fourth year brings the expected evil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The narrator states that the ghost had not told the people correctly: the
    plan was for the evil to occur at the end of four years rather than after four
    days.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the fourth year, the still-angry old man prepares many sharp bahos from
    hard woods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The village chief and the Crier Chief are described as bad and in league;
    they order another four-day feast announcement, but the people mistrust the command
    and do not prepare a feast.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: At night, the chiefs paint and adorn the old man so that he represents Balolookong.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old man is placed in a hole inside the tiwonyapavi shrine with the sharp
    bahos, a Balolookong whistle, and a bowl of water, then covered with a flagstone,
    earth, dust, and cloth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The chiefs sing sorcerer's songs; during the third song, the buried old man
    makes rumbling and roaring sounds and says he has reached his object.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the old man remains buried, he pushes part of his hand through an opening;
    villagers see the protruding hand in the morning, and the old man sings.
  category: sequence
  evidence_refs:
  - ev:9
