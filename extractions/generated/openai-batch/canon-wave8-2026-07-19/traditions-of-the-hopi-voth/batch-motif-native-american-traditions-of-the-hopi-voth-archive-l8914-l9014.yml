canonical_text:
  quote: ''
  summary: The passage contains linked Coyote episodes. In one tail-burning episode,
    Coyote makes an artificial tail from cedar bark, yucca leaves, and wool to crowd
    Balolookong's kiva; Balolookong burns the tail, fire follows Coyote across the
    grass, and he dies after jumping into the Little Colorado River. In another version,
    Lolookong first visits Coyote and fills Coyote's kiva by coiling; Coyote later
    makes a long cedar-bark tail, fills Lolookong's kiva, is fed corn-pollen, and
    has the tail burned by an ember, after which he returns home angry. A footnote
    identifies Balolookong as a mythical water serpent and notes the related use of
    Lolookong. The next story begins with Coyote visiting Frog at Sun Spring; after
    Coyote asks Frog to dance, Frog jumps into deep water, is thrown onto the ground
    by Coyote, bursts open with tadpoles, and dies.
  language: English
