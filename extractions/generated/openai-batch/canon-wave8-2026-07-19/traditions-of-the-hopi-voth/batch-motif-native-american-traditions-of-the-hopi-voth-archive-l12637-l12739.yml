canonical_text:
  quote: ''
  summary: The passage recounts an enemy attack on two Hopi villages, the capture
    of some women and children, and the survivors' relocation to Orafbi. It then describes
    early Spanish mission presence at Orafbi, including a spiral-shaped Spanish building,
    an assembly house with bells, head-washing identified as baptism, gifts of clothing
    and shoes, Sunday assemblies, demands for distant drinking water, and later cistern-building.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People living in two hill or mesa villages had previously moved because the
    Utes harassed and warred upon them; in the sixth year their old enemies were seen
    camping nearby.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chiefs instructed young men to investigate the nearby camp, and the young
    men confirmed that the campers were their old enemies.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The villagers spent the night making bows and arrows and then moved to a small
    village on the extreme edge of an eastern mesa for defense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The enemies entered the abandoned western village, followed the tracks, reached
    the assembled people, and were unable to get up to the village; many attackers
    were shot and killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some attackers entered the village from the south side, captured women and
    maidens, and escaped on ponies; a later summary says women and children were taken.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The attacked people decided not to remain in their villages, packed their
    belongings, formed a line with the chief at the head, went to Orafbi, and were
    admitted there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Spaniards had made inroads and warred against Orafbi, later made peace,
    asked to live there, and received Hopi consent and assistance in building a house
    north of the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Spanish building was described as spiral or snail-house shaped, with four
    spirals, a central house or kiva, a winding hallway, and roof access from the
    center.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A large assembly house with a bell tower was built northeast of the spiral
    structure; the people were gathered there, and the Tutaachi poured water on their
    heads in an act identified as baptism.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Another Tutaachi came from Basoi with others and brought clothing and shoes
    for the Hopi on carts with heavy wooden wheels.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Hopi had to assemble in the assembly house on Sundays, where the priests
    spoke to them, and the priests asked them to bring drinking water from distant
    Mtienkape.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some Hopi substituted water from the nearer Tuhciva spring; after the priests
    discovered the deception, they set the Orafbi inhabitants to making cisterns,
    which the Hopi were pleased with because it reduced distant water-fetching.
  category: sequence
  evidence_refs:
  - ev:9
