canonical_text:
  quote: It was the road to the Skeleton house.
  summary: A young man is ritually prepared as if dead and given medicine by the Badger
    Old Man so that he can travel and learn about the Skeletons. In sleep he follows
    a westward road toward Skeleton house, meets a delayed figure on the road, crosses
    difficult terrain, is lowered over a bluff on his kilt, encounters Skeleton Woman
    near a smoky place where wicked people are destroyed, and reaches a large Skeleton
    village where he is directed to his Bear clan ancestors. The Skeletons eat only
    the odor or soul of food and are described as light, like clouds into which the
    dead are transformed.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Badger Old Man finds a medicine, instructs that the chief's son be dressed
    with a white kilt, blackened chin, and small eagle feather, and prepares him as
    the dead are prepared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is placed on a white 6wa, given medicine in his mouth, ears,
    and heart area, wrapped in a robe, and then is said to have died after moving
    a little.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Badger Old Man explains that the medicine will make the young man go far
    away, come back again, and find out what he wanted to know.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After falling asleep, the young man sees and follows a westward path called
    the road to the Skeleton house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person sitting along the road says he did not follow the straight road or
    listen and therefore must wait for a long time before reaching Skeleton house;
    he lives in an enclosure of sticks.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The path passes through large cactus and many agave plants and becomes hard
    to distinguish before reaching the rim of a steep bluff.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A chief at the bluff places the young man's kilt on the ground, puts the young
    man on it, lifts it over the precipice, and throws it forward so that he descends
    slowly as if flying with wings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After descending, the young man sees a column of smoke rising from the ground
    and meets Skeleton Woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Skeleton Woman says wicked people from the village are thrown into the smoky
    place by a chief and are destroyed so that they no longer exist; she warns the
    young man not to go there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Skeleton house the young man first sees a few children, then a large village
    of Skeletons who assemble and ask who he is.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Skeletons direct the young man to the Bear clan, tell him those are his
    people, and identify them as his ancestors.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A ladder to the ancestors' house has rungs made of sunflower stems; the rungs
    break under the young man but not under the Skeletons.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Skeletons bring melon, watermelon, and chukuviki to the young man, but
    they laugh when he eats because they consume only the odor or soul of the food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Skeletons are not heavy and that clouds into which
    the dead are transformed are not heavy and can float in the air.
  category: attribute
  evidence_refs:
  - ev:8
