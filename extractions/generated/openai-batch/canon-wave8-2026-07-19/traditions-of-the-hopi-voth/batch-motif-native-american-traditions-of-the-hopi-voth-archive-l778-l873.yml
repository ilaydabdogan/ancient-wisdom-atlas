canonical_text:
  quote: ''
  summary: 'The passage recounts a creation episode in which named beings receive
    food allotments, followed by the Sun aiding and naming a traveling brother and
    sister. It then begins a tradition of the Hopi coming from the under-world: disorder
    below leads chiefs to seek an exit; bird scouts search for it; a flood destroys
    many; plants are sung into rapid growth as ascent supports; Spider Woman, Pookonghoya,
    Balongawhoya, and the Mocking-bird emerge first; the people climb up and the Mocking-bird
    assigns them places and languages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a covering is lifted, one child like a Hopi is found; Huruing Wuhti
    names him Bear Clan member, gives him a grain of shelled corn, and sends him on.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second being, Head-with-the-Hair-Pushed-over-it-Backward, is identified
    as a Navaho; Huruing Wuhti gives him spoiled meat, and the passage explains this
    as the reason Navaho use meat while Hopi use corn.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sun passes through an opening in the floor and returns east under the
    earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sun sees smoke from camps of created people and then sees a tired maiden
    and youth traveling together; the maiden sometimes carries her little brother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun gives the brother and sister water and corn, names the youth Sun Clan
    member and the maiden Forehead Clan member, and tells them to travel eastward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states later settlement locations for the Sun, Forehead, Bear,
    Burrowing Owl, and Sand clans, and says Muyingwa and his sister settled west of
    Matovi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the under-world many people quarrel, some abuse women and maidens, and
    the chiefs hold council to find another place to live.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A bird named Motsni is sent to find an exit but fails; the Mocking-bird is
    then sent, flies high, finds an exit, and reports back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The chiefs cause a great flood; great water serpents come out of the ground
    with the water, many people are destroyed, and the chiefs announce departure in
    four days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chiefs plant a pine-tree, another kind of pine, a reed, and a sunflower;
    by singing around them they make them grow rapidly, with different strengths and
    distances from the opening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Spider Woman, Pookonghoya, Balongawhoya, and the Mocking-bird climb up first;
    Pookonghoya holds the pine-tree, Balongawhoya holds the reed, the Mocking-bird
    sings, and Spider Woman watches.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The people climb up on the plants; after they emerge, the Mocking-bird assigns
    them places and languages, including Hopi, Navaho, Apache, Mohave, Mexican, and
    White Man.
  category: action
  evidence_refs:
  - ev:7
