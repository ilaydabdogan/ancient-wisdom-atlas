canonical_text:
  quote: ''
  summary: A Hawk-man feeds and costumes a group of youths, leads them in repeated
    imitation movements, throws them into a kiva unharmed, then subjects them to a
    fire-oven ordeal in which their bodies are burned, covered, sung over, and restored
    to life. The old woman associated with the ovens washes them and gives each a
    white corn ear called his mother. The Hawk-man then sends them to the Blue Flute
    kiva, feeds them later, assigns ritual groups and a watchman, orders fasting,
    and the people observe that the youths are assembled there.
  language: English
  quote_policy: summarized
