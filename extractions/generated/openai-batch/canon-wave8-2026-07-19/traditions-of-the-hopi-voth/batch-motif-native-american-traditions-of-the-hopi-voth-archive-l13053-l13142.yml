canonical_text:
  quote: ''
  summary: The passage summarizes Hopi traditions concerning a young man's river journey
    to watery and underworld-like locations, encounters with Spider Woman, Snake people,
    Huruing Wuhti, transformed snakes, ritual instruction, taboo violations, and the
    origin of Snake clan ceremonies. It also summarizes another Snake Myth variant
    involving a young man sent down the Colorado River to Huruing Wuhti and the Sun's
    route, followed by a brief account of Bear clan wanderings and the naming of related
    clans from a dead bear and surrounding creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief's son wonders where water goes, builds or enters a boat with prayer
    offerings and food, and floats until he reaches the ocean and an island.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spider Woman receives the young man, hears his story, receives a baho, points
    him toward a kiva in the water, gives him medicine, and sits behind his right
    ear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man forms a rainbow by spurting medicine, and he and Spider Woman
    cross the water on it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the way to the kiva, the pair meet panther, bear, wildcat, gray wolf, and
    rattlesnake, appeasing them with bahos and medicine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the kiva, people dressed in blue kilts and wearing beads sit silently
    near a fireplace; a chief smokes a pipe four times and asks the young man to smoke
    and swallow smoke.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Spider Woman secretly draws the swallowed smoke out of the young man so that
    he does not become dizzy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kiva people turn into snakes after the young man turns away; the chief
    instructs him to select and take a snake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A maiden who has become a large angry snake is made docile by medicine; the
    young man seizes and strokes the snake four times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the snakes resume human form, they speak with the young man and regard
    him as initiated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Huruing Wuhti appears as an old hag by day and a pretty maiden at sundown;
    she is described as deity of hard substances.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Huruing Wuhti gives the young man toads and orders him not to open the sack
    on the way home, saying the contents will be gone if he opens it and will increase
    if he does not.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Snake chief gives the young man a woman who will bear him children and
    warns him not to touch her on the way home or she and the toads will disappear.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young man opens the sack near home despite his wife's objection; most
    of the toads disappear by morning, except those given by Huruing Wuhti.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The woman bears many Snake children who play with Hopi children but sometimes
    bite them; the husband takes the children back to the wife's home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A Snake man and wife later come to Walpi, assist in ceremonies, have human
    children, and their descendants are identified as the Snake clan; the first ceremony
    is celebrated after a nephew is sent to hunt snakes.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: In another Snake Myth account, elders of the Pihfeash and Kokop clans put
    provisions and four bahos with a young man into a box and send it floating down
    the Colorado River.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Huruing Wuhti calls the young man four times and he reaches her house by a
    road made by a corn-meal ball rolled on the water.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: The Sun arrives seated on a disk attached to a pole, dressed like a Katcina,
    sorts bahos offered to him, rejects those of bad people, bathes, eats, and continues
    on his course under the earth.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: The Bear people leave sipahpuvi, separate, travel to the Little Colorado River,
    and take clan names from a dead bear and from animals or objects associated with
    the bear's remains.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:20
  text: The Bear clan later moves to Shongopavi, arrives first, and brings the Blue
    Flute cult and various Katcinas.
  category: sequence
  evidence_refs:
  - ev:16
