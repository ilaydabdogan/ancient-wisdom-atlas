canonical_text:
  quote: ''
  summary: A chief of Pivdnhonfcapi, troubled by gambling and neglected duties in
    his village, asks the Yayaponchatu, who are associated with storms, fire, and
    supernatural forces, to punish his people. He chooses fire as the element of judgment
    and secretly arranges their participation in a dance. On the fourth day the Yayaponchatu
    appear as masked Katcina-like dancers, sing an ominous song about houses enveloped
    by red cloud and mist, and four dancers carry prayer-offerings containing sacred
    meal, honey packets, and sparks of fire, which are then distributed to the chiefs,
    an assistant, and the dancers’ leader.
  language: English
  quote_policy: summarized
