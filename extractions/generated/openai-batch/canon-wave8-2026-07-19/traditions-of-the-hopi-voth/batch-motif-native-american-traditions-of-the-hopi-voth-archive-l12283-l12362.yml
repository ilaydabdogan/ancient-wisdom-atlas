  quote: ''
  summary: The passage describes a threatened Hopi village preparing for battle against
    approaching Navaho forces. It includes night councils, fires, secret Hopi visitors
    to the Navaho camp who arrange to be killed and are weakened by bloodletting,
    Navaho war songs and dawn advance, Hopi arming and clan alignment, ritual war
    rites led by a Burrowing Owl warrior chief, and the opening of battle after a
    mounted Navaho leader shoots the first arrow.
  language: English
