canonical_text:
  quote: ''
  summary: The passage gives several brief Hopi Coyote tales. Coyote Woman or Coyote
    repeatedly encounters singing, dancing, or ritual actions by birds and other beings,
    tries to threaten or imitate them, and suffers injury, loss, or death. Episodes
    include Wren deceiving Coyote Woman with a skin-covered stone; Aahtu birds recovering
    their eyes while Coyote loses his; Turtle-dove leaving a stone decoy that breaks
    Coyote’s teeth; Blue Jays lending feathers to Coyote’s wife and then removing
    them so she falls; Eagle tricking Coyote into cutting off a leg; and Red Eagle’s
    dance causing Coyote to delay water for his thirsty children, who die.
  language: English
  quote_policy: summarized
