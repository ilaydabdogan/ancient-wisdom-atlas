canonical_text:
  quote: ''
  summary: 'The passage closes an initiation episode in which ritual specialists use
    white kaolin and eagle feathers to make a distant bluff appear white, the Hawk-man
    releases youths from dangerous behavior, and the youths form the Yayaatu Society.
    It then gives clan-origin traditions for Mishongnovi: Batki and Sand clans migrate
    from Palatkwapi, produce rain and crops, bring or join cults, increase a spring,
    and are incorporated into village offices. The passage ends by opening a Palatkwapi
    destruction narrative with an underworld emergence through the sipahpuni and travel
    with Skeleton/Masauwu.'
  language: English
  quote_policy: summarized
