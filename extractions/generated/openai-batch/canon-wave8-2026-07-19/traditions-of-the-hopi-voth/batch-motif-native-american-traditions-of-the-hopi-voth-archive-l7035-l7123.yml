canonical_text:
  quote: ''
  summary: 'Two children visit their grandparents, prove their kinship through a game
    and a life-stakes guessing test, receive clothing and equipment as payment, and
    bring their mothers toward a reunion. The mothers repeatedly call to their parents
    while descending through a ladder and kiva; when the grandmother answers too soon,
    the women and children die. A new tale then begins: poor Hiyonatitiwa, living
    with his grandmother near Oraibi, sets out to court a maiden who refuses marriage,
    while village youths observe him at twilight.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The visiting children state that two daughters were fetched long ago and that
    they are those daughters' children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grandparents set food before the children and feed them; the grandmother
    cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The grandfather lays out a flat stone marked with a tukwnanawohpi, sits opposite
    the boy, and the boy wins the game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandfather points to a bundle at the top of a ladder and says that a
    correct guess will kill him, while a wrong guess will let him kill the children.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the siblings discuss who should guess, the boy guesses that the bundle
    contains a little turtle, and the grandfather declares that they are surely his
    grandchildren.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The children refuse to kill the grandfather and instead ask him to pay them
    something.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy asks for male clothing and hunting gear, the girl asks for clothing
    and accessories, and the children also ask for clothing for their mothers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The children tell the grandparents that their mothers will come if the grandparents
    are willing and will not say anything.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mothers and children dress, eat, proceed to the village all abreast, and
    ascend the ladder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two women call down to their father and mother at the opening and again
    at an elevated portion of the kiva, but receive no answer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the deeper portion of the kiva, the women call again; the grandmother responds,
    and the two children and two grandchildren fall dead.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator states that if they had heeded the injunction and been quiet
    once more, they would have lived together happily.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the start of the next tale, a maiden in Oraibi refuses all offers of marriage.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hiyonatitiwa lives with his grandmother at Achemali; both are poor and wear
