canonical_text:
  quote: ''
  summary: Spider Woman restores a maiden from a coyote body, arranges for Katcinas
    to return her to her village with prayer offerings, and instructs her about revenge.
    The returned maiden later gives Yellow Corn-Ear maiden a cup whose water has rainbow
    colors; after drinking, Yellow Corn-Ear falls down and becomes a bull snake. The
    passage closes by explaining the bull snake's way of capturing prey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spider Woman boils water, places a coyote in a vessel with Tom6ala-pod hooks
    and a cloth cover, twists the hooks, removes the coyote skin, and finds the maiden
    restored in the vessel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The restored maiden still has her clothes on and her hair tied in whorls as
    when she left the village, and she tells Spider Woman the story of what happened.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Spider Woman says that Yellow Corn-Ear maiden is bad and that the restored
    maiden will take revenge on her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hunter returns with juniper branches; Spider Woman bathes the maiden with
    the branches and water, then gives her corn to grind into meal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After several days Spider Woman tells the maiden to go home because her mother
    is homesick, then calls neighboring Katcinas into her house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Katcinas agree to return the maiden; Spider Woman dresses her, arranges
    her hair, places a new atoo over her shoulders, and instructs her about prayer-offerings
    and about how to behave toward Yellow Corn-Ear maiden.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Katcinas go to the village with the maiden at the rear of their line and
    perform a first dance with singing near the village chief's house at white dawn.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Villagers recognize the returned maiden; after repeated messages her parents
    come to the dancers, and the father brings two bahos and several nakwakwosis for
    the Katcinas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the dance the bahos and nakwakwosis are given to the Katcina leader,
    the singing leader, and the other Katcinas; the father thanks them, and the parents
    take their daughter home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The next morning the returned maiden grinds corn while singing about her adventures;
    Yellow Corn-Ear maiden visits her, and they later go together to the same spring
    for water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Yellow Corn-Ear maiden asks to see the returned maiden's little vessel, whose
    water shows rainbow colors; after drinking from it, she falls down and turns into
    a bull snake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Blue Corn-Ear maiden says Yellow Corn-Ear tried to destroy her and must
    now remain in that form because no one will restore her; Blue Corn-Ear laughs,
    takes her jug, and returns to the village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bull snake leaves the place, wanders, becomes hungry, and is said to capture
    prey by charming and drawing it toward itself with powerful inhalations.
  category: attribute
  evidence_refs:
  - ev:8
