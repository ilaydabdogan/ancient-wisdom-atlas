canonical_text:
  quote: ''
  summary: 'The passage recounts movements of Hopi clans among springs, Chukuvi, Mishongnovi,
    Shupaulavi, and Oraibi, including defensive relocation to mesa-top settlements
    and a rotating village chieftainship. It then begins the origin account of the
    Yayaatu/Yayaa Society: work-avoiding village children steal food and wood, later
    gather brush east of the village, and meet a Hawk in human form who invites them
    into his kiva, gives them a pipe, receives kinship address, and promises to feed
    them.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Spider clan arrived at the spring called Homiqopu, remained there for
    some time, and later moved to Chukuvi, a place with a large spring at the foot
    of its mesa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Chukuvi, the Squash clan ruled and supplied the chief, while the Sand clan
    was also numerous in the village.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Villages were said to be harassed by enemies including Utes and Apache, and
    inhabitants of different villages also raided each other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because of raids and harassment, inhabitants of Chukuvi and old Mishongnovi
    moved onto the mesa and built the present village of Mishongnovi; Shupaulavi people
    also moved to the top of the mesa when Mishongnovi was built.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In Mishongnovi, the Blue-bird clan was in charge, and the village chieftainship
    was shared in a sequence involving the Blue-bird, Bear, Betki, and Squash clans,
    with a new chief elected every four years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sand clan, formerly living at Chukuvi, is said to have moved to Oraibi,
    near fields they had used while still living at Chukuvi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Oraibi, the Yayaa-mongwi lived in the home of the Reed clan; the Fraternity
    is described as no longer active, while its altar paraphernalia were still kept
    in the house.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Village children visited the little boy at the house, refused work tasks named
    by their parents, stole food and wood, and prepared food near a fire in front
    of the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The priest's son proposed that the children gather wood themselves and have
    someone steal a hide strap; the children gathered straps, left the village eastward,
    drank at Keqochmovi, and collected dry brush in the valley.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the children were ready to return, a Hawk in the form of a man came upon
    them, wearing many bead strands and a black specular-iron line painted over his
    nose and cheeks.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Hawk-man invited the children into his kiva, seated them on the banquette,
    sat near the fireplace, filled a pipe, smoked, and then had the children sit near
    the fireplace and smoke in turn.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While smoking, the priest's son addressed the Hawk-man as father, and the
    children exchanged terms such as younger brother and older brother; the host then
    told them to remain because he would feed them.
  category: speech
  evidence_refs:
  - ev:8
