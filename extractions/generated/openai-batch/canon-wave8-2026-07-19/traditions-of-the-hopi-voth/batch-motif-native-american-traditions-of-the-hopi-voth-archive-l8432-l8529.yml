canonical_text:
  quote: ''
  summary: A maiden grinding corn is visited by suitors. An unnamed youth offers yellow
    bridal gifts, which she refuses. Rooster and Mocking-bird each appear as handsome
    youths and seek to marry her. They dispute their relative powers connected with
    morning and light and agree to a contest. Rooster travels to hidden helper places,
    is fed corn, reaches a community of Roosters and Hens, and receives ritual support
    through all-night singing and crowing that culminates in dawn and sunrise.
  language: English
  quote_policy: summarized
