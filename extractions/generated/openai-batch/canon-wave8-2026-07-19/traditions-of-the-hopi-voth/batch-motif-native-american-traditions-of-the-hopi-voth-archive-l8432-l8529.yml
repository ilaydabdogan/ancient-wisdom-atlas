  text: The first visitor directs the maiden to bring in his bundle from outside;
    it contains yellow bridal robes, yellow moccasins, and a yellow belt in a yellow
    reed receptacle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The maiden refuses the first visitor’s bundle and tells him to go down; he
    leaves with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rooster visits the maiden in the evening while she is drying coarsely ground
    meal over a fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rooster appears to the maiden as a handsome youth with a red figured shirt,
    turquoise ear pendants, and red feathers on his head.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The maiden is pleased with Rooster, converses with him, and tells him to remain
    overnight and return in four days, after which she will go to his house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mocking-bird comes on the third day, appears as a handsome youth, asks the
    maiden to marry him, and receives her promise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The maiden tells her mother about Mocking-bird’s proposal, and the mother
    tells her not to mistrust him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rooster arrives before the appointed time, finds Mocking-bird with the maiden,
    and disputes Mocking-bird’s claim to fetch her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rooster says people get up when he crows in the morning; Mocking-bird says
    it gets light when he twitters or sings in the morning.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Rooster and Mocking-bird agree to a contest in three days, and no one is to
    get the maiden until then.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rooster leaves the village, descends the mesa, runs northwest, and rests near
    a bého shrine at Bow Mound.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: An opening appears in the shrine, a voice invites Rooster in, and inside he
    finds many maidens.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:14
  text: A maiden at the shrine prepares a seat, brings shelled corn, and feeds Rooster;
