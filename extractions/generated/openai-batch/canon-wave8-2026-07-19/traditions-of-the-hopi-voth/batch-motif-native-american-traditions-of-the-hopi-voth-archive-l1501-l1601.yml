canonical_text:
  quote: ''
  summary: 'The passage first recalls an earlier good condition in which Hopi Katcina
    dances and kiva ceremonies brought rain, then says wicked Popwaktu increased after
    a Powaka maiden taught evil arts and Palatkwapi was destroyed by great water.
    A prophetic passage warns that White Men and allied Popwaktu would trouble the
    Hopi. The next section narrates an Oraibi clan origin: people lived below the
    sipapu in the under-world; conflict over the Bear chief’s wife dancing leads the
    Bear chief to seek another world. Pookong and Balongahoya find an opening above,
    and the clans emerge through it. Eagle and Buzzard seek or open light above, with
    Buzzard burned in the attempt. Bear and Spider clans divide by direction. The
    Spider clan travels north, attempts agriculture in a cold country, loses crops
    repeatedly to frost, then turns southward. The Spider chief and his wife perform
    a rite using skin scales, a reed receptacle, song, and a fourfold gesture; the
    scales become burros, and a repeated rite produces Spaniards, whom the chief sends
    after the Bear clan while the Spider people travel southeast along a stream.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the earlier village condition, Katcina dances and kiva ceremonies are said
    to bring rain, and the Hopi Katcinas are said to have been brought from the under-world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Popwaktu increase after one Powaka maiden from the under-world teaches
    others her evil arts, and Palatkwapi is destroyed by a great water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A prophetic passage says the Hopi should continue to live like Hopi, that
    Popwaktu would help and speak for the White Men, and that the Hopi are now troubled,
    harassed, and having children taken away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Below the sipapu in the under-world, people live as they do here; the Bear
    clan chief becomes angry because his wife dances in the Butterfly dance.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bear chief sends Pookong to look for another life or world, and Pookong
    and Balongahoya report an opening above; Pookong reaches it by means of a spit-strengthened
    reed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After four days the Bear chief leaves with Pookong, Balongahoya, the Spider
    clan chief, Bear clan people, Spider clan people, and many others; after many
    have emerged, the Bear chief closes the opening.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the opening is closed, the people remain in darkness; Eagle and then
    Buzzard are sent to seek or make an opening or light, and Buzzard is burned while
    ascending higher.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'A directional dispute follows: the Bear clan speaks for the south, the Spider
    clan for the north, and the Spider clan goes north with the greater crowd.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Spider clan travels north, reaches the country of the North Old Man, plants
    crops, and the chief uses the Blue Flutes altar with singing and fluting; frost
    and cold repeatedly destroy the crops.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After repeated crop failures, the Spider clan expresses dissatisfaction and
    starts southward after the Bear people.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Spider chief’s wife bathes, rubs small scales from her skin, and gives
    them to her husband; he wraps them in a reed receptacle, sings over them, waves
    them four times, and the scales become burros.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The same performance is repeated and Spaniards come out; the chief orders
    them to load supplies on the burros, follow the Bear clan, and kill them, while
    the Spider people go southeast along a stream.
  category: sequence
  evidence_refs:
  - ev:12
