  quote: the man in whose house the most corn was found should own Piwftamni's wife
  summary: 'After goods brought by Piwftamni make a household wealthy, other men demand
    another test: the village men will inspect houses, and the man with the most corn
    will own Piwftamni''s wife. When they inspect Piwftamni''s house, it is filled
    with corn, watermelons, and squashes, so no one dares take his wife. The woman
    is afterward described as rich and no longer called Watermelon-Rind Woman.'
