canonical_text:
  quote: ''
  summary: A stranded young man on a bluff is aided first by Spider, who gives him
    two downy turkey feathers for warmth, and then by Wren, who plucks its own feathers
    to make a ladder down a crack in the bluff. After descending, the young man follows
    Wren’s direction and comes to Spider Woman’s house. Spider Woman feeds him tiny
    portions that expand in his mouth, makes him a pitch-and-hair ball like those
    used in Hopi spring races, and receives birds that he hunts near a small lake.
    She warns him not to go west because dangerous people live there.
  language: English
  quote_policy: summarized
