canonical_text:
  quote: ''
  summary: A hairless Kalatoto living near Oraibi repeatedly tries to make a hair
    covering for his head using pitch or cactus juice and discarded Hopi hair. Children
    remove or damage the covering, and when he prepares a pitch-and-hair covering
    to attend a Katcina dance, it sticks him to the floor while he sleeps; he cannot
    rise and dies of hunger. The next tale begins with a crying child at Shupaulavi
    whose mother threatens to throw it to the Owl and drags it outdoors. A large Owl
    carries the child to a cave near Bayupki, where the Owl has children. The mother
    later searches unsuccessfully, and wood-gathering men hear a moaning song from
    near the Owl’s cave.
  language: English
  quote_policy: summarized
