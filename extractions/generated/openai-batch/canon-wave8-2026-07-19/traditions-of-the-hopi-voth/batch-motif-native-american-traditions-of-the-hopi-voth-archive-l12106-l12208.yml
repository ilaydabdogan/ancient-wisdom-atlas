canonical_text:
  quote: ''
  summary: The passage includes the end of a raid on Aodtovi, in which attackers trap
    men in kivas, burn them, and distribute women and children as captives. It then
    tells how an Oraibi chief arranges with the Walpi warrior chief to punish his
    own people by leading them into a raid and having Walpi kill the fleeing Oraibi
    except those who pass a specified rock; a large Walpi dog disables and kills many
    Oraibi, and a dog mark is later engraved on the rock. The passage begins another
    tale in which Walpi runners plan a Katcina race contest with Oraibi, but an Oraibi
    youth is secretly warned by his Walpi friend and returns home to tell Oraibi youths
    to practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from three villages go to Aodtovi during a storm, ascend the mesa in
    the evening, remove ladders from kivas, capture women and children, and throw
    firebrands into the kivas where the men are eating.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men in the kivas are destroyed, and the captives are taken to villages
    and distributed there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Oraibi chief judges his own people to be very bad and consults the Walpi
    warrior chief about punishing them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Oraibi chief asks the Walpi warrior chief to meet the Oraibi raiders in
    the valley and kill those who flee, except those who pass a rock south of Ponotoika.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Walpi warrior chief agrees on condition that the Oraibi chiefs will not
    ask for Walpi lives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Oraibi chief tells his people they will raid Walpi in four days and try
    especially to steal maidens.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Walpi are prepared, descend armed from their village, sound the war yell,
    and rush upon the Oraibi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A large fierce dog belonging to a Walpi young man rushes ahead and bites many
    Oraibi in the leg, disabling them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Oraibi flee in surprise; the Walpi chase and kill many, and the dog also
    disables and kills some.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Only a few Oraibi pass the specified rock; because of the battle a dog is
    engraved on that rock, which is called the dog mark, Pokvaita.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The narrator states that chiefs often punished their people in this way when
    the people became “bewitched,” and connects such killings with the many ruins
    in the country.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Walpi people practice races west of the village and decide to go to Oraibi
