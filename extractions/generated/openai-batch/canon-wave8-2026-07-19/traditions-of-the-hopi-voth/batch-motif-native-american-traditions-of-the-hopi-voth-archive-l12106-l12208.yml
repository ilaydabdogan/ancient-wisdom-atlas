candidate_motifs:
- id: motif:1
  label: Trapping victims underground or inside ritual chambers by removing escape
    ladders
  taxonomy_refs: []
  basis: Raiders remove ladders from kivas so the men cannot come out, then burn them
    inside.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage describes kivas literally; no broader cosmological or initiatory
    interpretation is stated.
- id: motif:2
  label: Fire used for destruction of trapped enemies
  taxonomy_refs: []
  basis: Firebrands are thrown into kivas after ladders are removed, destroying the
    men inside.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a local attack scene, not a world-destroying fire motif.
- id: motif:3
  label: Ruler arranges an enemy attack to punish his own people
  taxonomy_refs: []
  basis: The Oraibi chief judges his people bad and asks the Walpi warrior chief to
    kill them during a staged raid.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:11
  confidence: high
  cautions: The punishment is political and communal; the passage does not present
    it as divine judgment.
- id: motif:4
  label: Safety boundary marked by a rock
  taxonomy_refs: []
  basis: The Oraibi chief specifies that fugitives who pass the rock south of Ponotoika
    are to remain unmolested; only a few pass it.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The passage does not explain why this rock has special status beyond the
    agreement.
- id: motif:5
  label: Battle animal disables and kills enemies
  taxonomy_refs: []
  basis: A large fierce dog rushes ahead of the Walpi, bites many Oraibi in the legs,
    disables them, and kills some.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The dog is not described as supernatural.
- id: motif:6
  label: Commemorative animal mark on a landscape feature
  taxonomy_refs: []
  basis: Because the dog killed many Oraibi, a dog is engraved on the rock and the
    place is called the dog mark, Pokvaita.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives an etiological explanation for the mark and name, but
    no further ritual meaning.
- id: motif:7
  label: Secret warning before an inter-village contest
  taxonomy_refs: []
  basis: Walpi youths plan not to tell the Oraibi youth about the coming race, but
