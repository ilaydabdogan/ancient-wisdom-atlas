comparison_claims:
- id: claim:1
  claim: The Oraibi chief’s plot is presented by the narrator as one example of a
    recurring local pattern in which chiefs invite people from other villages to destroy
    their own people when they are considered bewitched or bad.
  claim_level: same_motif
  target: chief-invited destruction of one’s own people in local Hopi village traditions
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the passage’s own generalization and
    does not establish a relationship to other traditions.
- id: claim:2
  claim: The account of the dog mark functions as a place-name or landscape-mark explanation
    tied to a remembered battle event.
  claim_level: same_function
  target: etiological explanation of a named landscape mark
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explains the mark and name, but no wider corpus comparison
    is supplied in the provided text.
- id: claim:3
  claim: The Katcina race episode belongs to an inter-village contest pattern in which
    one village prepares secretly and another receives warning through a personal
    friendship.
  claim_level: same_function
  target: inter-village contest with secret preparation and warning messenger
