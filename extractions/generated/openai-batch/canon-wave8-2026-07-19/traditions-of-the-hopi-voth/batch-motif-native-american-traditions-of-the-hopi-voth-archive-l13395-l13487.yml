canonical_text:
  quote: ''
  summary: 'The passage gives condensed accounts of several Hopi traditions: Aholi
    Katcina makes offerings at a shrine and receives rain- and crop-producing objects;
    kachina figures and other beings are encountered during movement down and up the
    mesa; the two Pookonghoya war-god brothers undergo arm-cutting and healing, defeat
    a cannibal monster from inside its body, steal ritual rain-making objects, and
    later kill Cooyoko and his wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aholi Katcina lives in former Walpi with his little sister, and a youth lives
    in Sitcomovi with his grandmother.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aholi and the maiden go to a field to plant, and Aholi deposits corn meal
    and nakwakwosis as prayer-offerings at a baho shrine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Muyingwa and his sister live in the shrine; the sister cries when the offering
    is received because they have been neglected.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two deities arise; Muyingwa’s sister throws a squash filled with many kinds
    of seeds onto Aholi’s seeds, and Muyingwa gives Aholi objects for producing rain
    and crops.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A youth from Sitcomovi thanks Aholi and the maiden, smokes with them, blows
    smoke in ringlets on the objects four times, prays to the objects, and the objects
    become moist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Aholi’s party visits a baho shrine halfway down the mesa, sprinkles meal to
    the sun and shrine, hears singing, sees Big-Horn Katcina, and also sees Aototo
    shaking a bone rattle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Partway down the mesa, the party makes a baho shrine as a mark between Hano
    and Sitcomovi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The party meets Cooyoko, who is described as devouring children, emerging
    from a large shrine with a twisted stone; they tell him not to trouble them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Big-Skeleton tells the group to live on the mesa; the passage says they have
    lived there ever since and that Walpi soon began moving up the mesa to build a
    new village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: Pookonghoya and his younger brother Balongahoya visit two beautiful maidens,
    who say the brothers may own them if each allows an arm to be cut off.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The maidens cut off the right arm of the younger brother and then the elder
    brother with an upper mealing stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: The brothers carry their severed arms home; their grandmother places the arms
    by their sides, covers them, sings, and they get up healed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: The brothers return to the maidens, choose between them, sleep with them that
    night, and then return home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:14
  text: A large monster called Shita comes to Oraibi and devours people; a chief asks
    the Pookonghoyas for help and makes an arrow for each of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Shita swallows the brothers; inside they find a path into the stomach and
    many people from different parts of the earth, and the stomach is described as
    a little world in itself.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:16
  text: The brothers search for Shita’s heart, shoot arrows into it, the monster dies,
    and the brothers and the people escape through the nose.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:17
  text: The released people seek old homes and temporarily settle in different places,
    which the passage says accounts for many small ruins in the country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:18
  text: Pookong and his brother take paints from a recess used by Flute priests, seize
    a tray with a lightning frame, thunder board, netted water jug, and related objects
    from a Flute-priest kiva, and take a bull-snake from a Snake-priest kiva.
  category: action
  evidence_refs:
  - ev:5
- id: obs:19
  text: The younger brother takes a corn baho, watermelon, and melon from offerings
    at the corn-ear bluffs, though the elder brother refuses to take prayer-offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:20
  text: The brothers shoot the lightning frame and twirl a bullroarer; clouds gather,
    thunder and lightning occur, rain falls, and the Hopi have good crops because
    the brothers possess those things.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:21
  text: In Oraibi, people gathering wood fail to return; a man hears Cooyoko saying
    he will feast on him, hides under wood, and later a woman escapes Cooyoko by climbing
    a tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: The village chief goes to the shrine where the Pookongs live with their grandmother,
    Spider Woman, and asks them to avenge the people killed by Cooyoko.
  category: action
  evidence_refs:
  - ev:6
- id: obs:23
  text: The Pookongs ask the chief to make them balls, take bow and lightning arrows,
    kill Cooyoko’s wife, hide in Cooyoko’s house, and kill Cooyoko with lightning
    arrows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:24
  text: After killing Cooyoko, the Pookongs scalp him, return home with beads and
    other things, and the chief gives them buckskin balls and ball sticks.
  category: sequence
  evidence_refs:
  - ev:6
