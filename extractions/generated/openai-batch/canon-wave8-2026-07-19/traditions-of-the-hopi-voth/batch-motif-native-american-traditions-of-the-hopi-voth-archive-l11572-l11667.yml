canonical_text:
  quote: ''
  summary: 'The passage first recounts prayer-offerings handled by chiefs, one of
    which is deposited in the San Francisco Mountains. Soon afterward, people gambling
    in kivas repeatedly ignore warnings about a growing light, smoke, and fire in
    the mountains until the fire reaches villages, killing many and leaving only a
    few survivors. The chief of Oraibi seeks help from Spider Woman, who instructs
    him to make two feathered arrows; after the arrows are set at two points, she
    stretches a moistened web between them and the fire is stopped, saving Oraibi.
    The passage then begins another account: Racer Katcinas from Sikyatki visit Walpi
    for a race, a Walpi man improperly cuts off the hair knot of the Hamsontaka Katcina,
    and the offended Katcina later appears masked at a Sikyatki dance to seek revenge.'
  language: English
  quote_policy: summarized
