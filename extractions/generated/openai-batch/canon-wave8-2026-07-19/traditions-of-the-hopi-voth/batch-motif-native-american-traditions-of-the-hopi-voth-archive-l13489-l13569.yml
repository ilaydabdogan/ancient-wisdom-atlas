canonical_text:
  quote: ''
  summary: 'The passage summarizes several Pookong narratives: Pookong kills a bear
    that has been killing people; the Pookongs attend dances, are not fed, seize trays,
    and remove salt; Pookong wins a bride through mouse traps, game animals, Spider
    Woman''s instruction, rain and clouds, corn planting, and repeated misunderstandings
    of instructions.'
  language: English
  quote_policy: summarized
