candidate_motifs:
- id: motif:1
  label: heroic killing of a dangerous animal
  taxonomy_refs:
  - culture_hero
  basis: Pookong is asked by a chief to kill a bear that kills people, succeeds, and
    stops the attacks.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a compressed synopsis; it presents Pookong as effective
    but also comic or foolish, so the culture-hero classification should be reviewed.
- id: motif:2
  label: trickster-like boundary crossing and social disruption
  taxonomy_refs:
  - trickster_boundary
  basis: The Pookongs misunderstand a dance, are excluded from food, seize trays,
    remove salt to trouble the Hopi, and repeatedly act foolishly or literally against
    Spider Woman's intentions.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly call the Pookongs tricksters; the label
    is inferred from actions and should be reviewed.
- id: motif:3
  label: bride won through deceptive or extraordinary trapping
  taxonomy_refs:
  - sacred_marriage
  basis: The Pookongs seek a maiden who refuses marriage and secure her by setting
    traps and secretly placing large game under a piki tray trap, leading to marriage
    arrangements.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: low
  cautions: The available taxonomy lacks a precise 'winning a bride by trick' category.
    'Sacred_marriage' is only a broad and uncertain fit because the passage contains
    marriage but does not explicitly frame it as sacred union.
- id: motif:4
  label: Spider Woman as instructing helper
  taxonomy_refs:
  - wisdom
  basis: Spider Woman gives instructions about marriage conduct and agricultural work,
    supplies corn, explains Pookong's misunderstandings, and calls on clouds to assist
    the field.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: Wisdom is inferred from her instructive and corrective role; the passage
    also shows that Pookong misunderstands her.
- id: motif:5
  label: rain-assisted agricultural renewal
  taxonomy_refs:
  - seasonal_cycle
  basis: Corn grows rapidly after planting, heavy rain falls, and clouds bring water
    through the corn-field to cover grass with sand and earth.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage does not explicitly state a seasonal ritual cycle; the motif
    is based on agricultural growth and rain assistance.
- id: motif:6
  label: ritual preparation of a bride
  taxonomy_refs:
  - initiation
  basis: The maiden grinds corn for three days, sits near the kiva entrance during
    a head-washing event, is rained on by clouds, and receives a bridal costume prepared
    by spiders.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text does not use the word initiation; the classification rests on
    described preparatory and transitional actions around marriage.
