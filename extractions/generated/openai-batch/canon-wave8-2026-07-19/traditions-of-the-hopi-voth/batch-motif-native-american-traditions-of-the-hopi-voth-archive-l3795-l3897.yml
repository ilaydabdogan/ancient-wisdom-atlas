canonical_text:
  quote: as the young man was a Katcina the village prospered, it always rained and
    they had much to eat.
  summary: The passage describes a maiden staying with a young man and his grandmother
    in a kiva. Chickens are fed corn, directed by song and drum, and produce fine
    meal for the maiden. After a feast, neighbors bring bridal clothing and counsel
    the young man. The maiden is ritually washed and dressed, and the couple returns
    to her village, where the Katcina husband brings rain and prosperity until he
    leaves after his wife goes astray. The next section begins a story of the Aholi
    Katcina, his sister, and planting rites at a field shrine.
  language: English
  quote_policy: quoted
