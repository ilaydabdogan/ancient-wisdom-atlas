  text: Young men also hunt jack-rabbits and cotton-tail rabbits, but the passage
    says locusts are abundant and much liked.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman roasts locusts brought by her little niece; one locust becomes
    alive, moans, sings, and crawls up the stirring stick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The locust’s song contrasts jack-rabbits and cotton-tail rabbits with locusts,
