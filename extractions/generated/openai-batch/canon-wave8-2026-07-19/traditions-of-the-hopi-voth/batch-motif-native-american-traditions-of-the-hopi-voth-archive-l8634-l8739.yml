canonical_text:
  quote: ''
  summary: The passage first describes Hopi locust hunting and cooking, including
    an episode in which a roasted locust revives, sings about locusts becoming favored
    meat, and flies away after a woman answers it. It then tells of Coyote encountering
    a crying baby Turtle near Blue River; after threatening to eat it, Coyote is tricked
    into throwing it into the water, where the Turtle declares the water its home
    and laughs at him.
  language: English
  quote_policy: summarized
