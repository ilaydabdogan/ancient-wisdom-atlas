canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which a Coyote is pursued by
    villagers and killed by hail after finding his hole filled with water. It then
    begins the tale of the Coyote, the Bat, and the Humming-bird: three animal friends
    practice hospitality. The Bat steals food from a house in Oraibi to feed his friends,
    falsely claims Badger gave it to him, and is later exposed in a satirical song
    made by Coyote and Humming-bird.'
  language: English
  quote_policy: summarized
