canonical_text:
  quote: ''
  summary: A boy asks his sister how she made a little bird fly; she throws it upward
    and it becomes alive again. The bird flies to Tuwanashabe, removes a cactus with
    a red blossom, enters an opening, and passes through underground kivas containing
    vegetation, corn, birds, and Muyingwa, the God of Growth and Germination. The
    bird tells Muyingwa that Oraibi is dry and nearly abandoned except for two hungry
    children. Muyingwa allows the bird to take food to the children. The bird later
    locates the children's emaciated parents. Muyingwa ascends through kivas over
    successive four-day periods, rain returns, vegetation grows, the parents and other
    survivors return, and the children and their descendants become chiefs and owners
    of Oraibi. A note says the tale is incomplete.
  language: English
  quote_policy: summarized
