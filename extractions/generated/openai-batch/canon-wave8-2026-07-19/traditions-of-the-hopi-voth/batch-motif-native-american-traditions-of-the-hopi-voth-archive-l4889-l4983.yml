canonical_text:
  quote: "“a beautiful maiden called us and she drew my brother up”"
  summary: The excerpt first concludes an episode in which Pookong leaves a village
    with his dangerous son. It then begins a tale in which two sons of a Zuni village
    chief encounter the Antelope Maiden at a dangerous bluff; she draws the elder
    brother up to her and refuses beads as ransom. The younger brother is sent with
    offerings to seek help, moving from the Pookonghoyas and Spider Woman to the Mole,
    then to Storm, and finally toward the Snake people at Walpi.
  language: English
  quote_policy: quoted
