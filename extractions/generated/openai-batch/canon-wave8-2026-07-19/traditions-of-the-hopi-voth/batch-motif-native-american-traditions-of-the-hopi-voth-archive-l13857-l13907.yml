canonical_text:
  quote: Sun throws down rainbow and youth climbs to Sun, who hides him behind his
    back.
  summary: The passage contains the end of a tale in which Piwftamni obtains a wife,
    lives in poverty, then defeats rivals in a contest of food and wealth through
    his grandmother's help. It then begins a tale of an Oraibi youth and a maiden
    who play hide and seek in fields; the maiden hides in plants and produce, the
    Sun hides the youth after a rainbow ascent, the maiden detects him with milk drops,
    and Spider Woman begins to conceal him with a web.
  language: English
  quote_policy: quoted
