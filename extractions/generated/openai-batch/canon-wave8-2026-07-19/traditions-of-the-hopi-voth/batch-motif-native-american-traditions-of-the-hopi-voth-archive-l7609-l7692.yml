canonical_text:
  quote: ''
  summary: 'The passage first tells how Coyote Old Man gives a captured macaw or parrot
    to a maiden, steals Pavayoyfcashi''s costume and ornaments, disguises himself
    as him, and takes the maiden to his house. Pavayoyfcashi discovers the deception;
    village young men pursue Coyote, who escapes and boasts. Pavayoyfcashi later hides
    in storm clouds and kills Coyote with lightning. The passage then begins another
    tale about a family near the Nashabe kiva: a son devotes himself to catching and
    caring for eagles instead of field work, while his sisters resent this; after
    he captures only two young eagles, the sisters beat the eagles, lock the house,
    hide the key, and go to the fields.'
  language: English
  quote_policy: summarized
