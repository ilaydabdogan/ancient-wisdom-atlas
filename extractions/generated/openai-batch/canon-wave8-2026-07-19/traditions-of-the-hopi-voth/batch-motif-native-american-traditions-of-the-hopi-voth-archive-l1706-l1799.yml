canonical_text:
  quote: ''
  summary: A chief's son at Tokonavi wonders where the river water goes and, with
    his father's consent, travels in a closable box down the water to the ocean and
    an island. There he meets Spider Woman, gives her an offering, and seeks beads
    and corals at a distant water kiva guarded by wild animals. Spider Woman gives
    him medicine, rides behind his ear, and helps him form a rainbow-like road over
    the water. He appeases animal guardians with offerings and medicine. Inside the
    kiva he passes a smoke-swallowing test with Spider Woman's hidden aid, is accepted
    by the kiva people, and gives further offerings. The kiva people put on snake-skin
    costumes and become snakes; the chief tells the young man to choose one snake
    while Spider Woman instructs him not to fear touching them.
  language: English
  quote_policy: summarized
