canonical_text:
  quote: ''
  summary: 'The passage contains several short Hopi Coyote narratives and variants:
    Coyote and Water Serpent/Balolokong compete through long bodies or artificial
    tails in kivas, with tail-burning and in some versions Coyote''s drowning; Coyote
    and Frog interact before Frog dies and Coyote is killed by hail; Bat steals food
    for guests and is exposed through a song-tie; Coyote and Humming-bird exchange
    jokes by burying themselves so only bill or snout protrudes; a heading introduces
    a following Wren deception tale without narrative detail.'
  language: English
  quote_policy: summarized
