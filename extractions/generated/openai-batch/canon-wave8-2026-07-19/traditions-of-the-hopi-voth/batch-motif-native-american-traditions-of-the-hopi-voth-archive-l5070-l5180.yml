canonical_text:
  quote: ''
  summary: A man asks Spider Woman and two youths for help after his daughter disappears
    at a stream. Spider Woman says the water serpent Balolookong dragged the maiden
    into the water and directs the village to prepare prayer-offerings and dress the
    maiden's brother for a rescue. At the spring, the Pookong youths sing while the
    brother dances. On the first attempt he cries and the serpent vanishes with the
    maiden; on the second attempt he grasps her and strikes the serpent, which releases
    her. Offerings are thrown into the spring as the price for recovering the maiden
    and to prevent further harm. The serpent is said to remain in the water and to
    make those who see him sick.
  language: English
  quote_policy: summarized
