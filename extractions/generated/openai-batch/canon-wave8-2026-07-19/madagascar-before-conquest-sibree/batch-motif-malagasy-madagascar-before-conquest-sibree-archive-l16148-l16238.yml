literal_observations:
- id: obs:1
  text: The upper, forest-covered Eastern Region is described as having a great variety
    of plant forms without one predominant species, genus, or order.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eastern Region includes trees producing valuable timber and useful products
    such as indiarubber, dyes, gamboge, pepper, and arrowroot.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lianas in the tropical forest bind trees together in a dense tangle that makes
    passage difficult.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Central Region is an elevated interior table-land with bare moorlands,
    hollows, valleys, plains, and cultivated rice fields in former lake beds.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Central Region vegetation is said to consist mostly of herbs and small wiry
    plants rather than trees and shrubs, with a more temperate flora and rare palms.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several species of Ficus and other named trees occur in central towns and
    villages, and sixty-three plants are listed as endemic on the slopes of the Ankaratra
    mountains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Western Region includes level or slightly undulating plains, grass, forest
    patches, coastal woodland, mountain ranges, and a hotter, drier climate than the
    east.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the drier western area, trees and shrubs are described as more restricted
    to river and stream banks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: During a canoe voyage down the Betsiboka river, the narrator describes numerous
    fan-palms along the banks, with bamboo-like grass bending into the river and palms
    standing at the water's edge.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The west coast is described as having baobabs, Diospyros trees yielding ebony,
    many mangroves along bays and inlets, and abundant Leguminosae and Euphorbiaceae.
  category: object
  evidence_refs:
  - ev:5
