canonical_text:
  quote: ''
  summary: 'The passage describes funeral rites and mortuary customs among several
    Malagasy groups: royal exposure, relic preservation, and posthumous name taboo;
    Vazimba treatment of corpses, a snake associated with decomposition, and secondary
    burial; cave cemeteries among north-western groups; Sihanaka removal of the hopelessly
    ill and erection of a forked memorial pole; and Bezanozano stone monuments with
    ox skulls and belongings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For princes, the corpse is enclosed in an ox-hide and exposed for two months
    under a tent or, for a king, in a forest; incense is burnt night and day in the
    tent setting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The royal corpse is later carried with ceremony and festivities to a royal
    cemetery.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a deceased king, relics consisting of a neck vertebra, a nail, and a lock
    of hair are placed in the hollow of a crocodile molar and kept by the successor
    with relics of ancient kings in a sacred house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The name borne by a king during life may no longer be pronounced after death,
    and another name is substituted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a dead king's name resembles a common word, the common word itself may
    be replaced; pronouncing the former name is described as being treated as sorcery
    and punished by death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Vazimba corpse is washed, clothed in fine garments, seated squatting on
    a couch as if living, attended night and day, spoken to, and given a spoonful
    of rice or other food in its hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Formerly, liquids from decomposition were taken to a special place and sprinkled
    with ox blood to nourish the fandanina, a snake believed to be produced from those
    liquids.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the conquest by the Sakalava king Lahifotsy, the passage says these
    Vazimba customs were partly abandoned and the corpse was buried once the effluvium
    became too offensive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: About a year after burial, the Vazimba corpse is taken out, the bones are
    washed, placed in a new coffin, and buried finally.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Behisotra and Tandrona or Tankoala are said to have the same funeral customs
    as the Tankarana; one cemetery visited was a natural cave containing several small
    coffins.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Sihanaka secretly remove hopelessly ill people far from their villages
    to a solitary spot where only an appointed attendant goes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After death, the Sihanaka corpse is brought into the house and lies in state
    for a period linked to wealth and the number of oxen killed; afterward the house
    is abandoned and the corpse interred.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Sihanaka family erects a tall forked pole called jiro, shaped like ox-horns,
    by a road near the place of interment.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bezanozano burial monuments include an eastward head stone or slab, other
    stones bearing ox skulls on stakes, and sometimes tin boxes or mats belonging
    to the deceased.
  category: object
  evidence_refs:
  - ev:8
