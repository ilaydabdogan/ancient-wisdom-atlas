canonical_text:
  quote: ''
  summary: The passage lists Malagasy beliefs and customs concerning giant footprints,
    plants and tree taboos, the tangena ordeal, birth and household rites, eating
    customs, canoe taboo on a Betsileo river, death and royal funerary terminology,
    illness omens, and witchcraft using footprint dust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Imerina, holes in roadside rocks north of Antananarivo are said by popular
    imagination to be footprints of Rapeto, though the narrator describes them as
    shapeless cavities probably made by rain-water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rapeto is traditionally known as a chief of the Vazimba and is magnified in
    popular imagination into a giant; a village west of the capital bears his name.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Owners of fighting bulls held a plant called tsivalondriana in their hands
    to ensure victory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hardwood tree called hazotokana was believed to break rice-pans if any part
    of it was brought into the house.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father of a first-born child formerly brought a verikitia root, held it
    over his head outside the house, and dashed it westward on the ground for the
    child’s benefit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the tangena ordeal, poison was sometimes given to dogs or fowls instead
    of to the accused person, and its effect on the animal was used as the test of
    guilt or innocence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Certain charms were believed able to make the proxy animals die during the
    tangena ordeal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports continued belief in tangena after its legal abolition,
    including a 1878 epidemic episode in which villagers resorted to it and several
    died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Among the Bara, husbands and elder sons perform birth assistance, and the
    mother remains in the house four days after giving birth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the new year, red earth was placed at the foot of the middle house-post
    and called the first fruits of the year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: On certain occasions diviners direct a cord to be fastened from the south-west
    corner of the house to the north-east sacred corner as a means of obtaining blessing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage distinguishes Tanala eating practices by region and states that
    the Zafimanelo lock their doors at meals so that hardly anyone sees them eating.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A superstition concerning the river Fanindrona prevents people from putting
    canoes on it, even though this creates travel difficulties and drownings occur.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Among the Hovas, a corpse-bier is called a bird’s house, possibly from the
    idea that the departed spirit has flown away; a whirlwind is said to consist of
    ghosts of the dead.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: For deceased Hova sovereigns, ordinary words for dying, corpse, burial, and
    tomb are replaced by special sacred or euphemistic terms, including a silver coffin
    called a silver canoe.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: During a malarial fever epidemic in Betsileo, catarrh was interpreted by natives
    as a sign that locusts were near, and locusts appeared within the week.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: By mixing charms with dust a person had trodden upon, it was believed that
    a disease called rabdia could be caused to that person.
  category: action
  evidence_refs:
  - ev:13
