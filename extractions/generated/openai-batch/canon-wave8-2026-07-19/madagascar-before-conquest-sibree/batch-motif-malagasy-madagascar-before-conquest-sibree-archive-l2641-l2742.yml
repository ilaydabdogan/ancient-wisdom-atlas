  quote: ''
  summary: 'The passage describes the transition into the Malagasy summer rainy season
    around Antananarivo: preparations before heavy rains, the onset and sequence of
    thunderstorms, lightning danger, torrential urban runoff, seasonal rainfall patterns,
    agricultural renewal, hail damage, and reported charms against hail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near the end of October, people work in rice-fields, repair houses and roofs,
    and finish or protect clay and sundried-brick building before heavy rains arrive.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Watercourses and river banks are repaired so that heavy rains do not swell
    streams, break embankments, and flood rice-plains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Summer, identified as November through February, is described as both hot
    and rainy and is called Fahavaratra, or “thunder-time,” because heavy rain is
    usually accompanied by thunderstorm.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The storm sequence is described as evening clouds, night lightning, sultry
    weather, dark cumulus clouds, approaching thunder, forked lightning, wind from
    many directions, and rain falling in torrents.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Heavy thunderstorms are said to be dangerous, especially in the open or in
    houses without lightning conductors; the passage gives an example of lightning
    killing a college student and a slave while a child survived with burns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After intense rain, the steep streets and paths of Antananarivo become rushing
    torrents and cascades, tearing up paving and deepening roads.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rainfall is concentrated in the rainy months, with December and January described
    as the wettest months.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thunderstorms usually come in the afternoon; mornings are often bright, vegetation
    is refreshed by moisture, and people cultivate plantations on sloping hillsides.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hail during thunderstorms can damage rice crops, strip fields of grain, and
    kill sheep or small animals if they are unsheltered.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Charms against hail are said to have held a prominent place in old popular
    beliefs and to still be trusted and used by some people according to the author.
  category: object
  evidence_refs:
  - ev:8
