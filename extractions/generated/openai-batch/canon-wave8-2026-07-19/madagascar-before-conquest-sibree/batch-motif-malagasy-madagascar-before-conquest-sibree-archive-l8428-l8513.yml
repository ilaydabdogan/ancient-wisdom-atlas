canonical_text:
  quote: ''
  summary: The passage gives a speech in which Ratsarcihbby asks the public to help
    persuade Rafara to return, using animal, flood, mountain, storm, tree, field,
    rock, and lake imagery. It then summarizes Malagasy reflections on pleasure before
    death, tomb-sleep, impermanence, wisdom, advice, and animal similes in admonitory
    speech.
  language: English
