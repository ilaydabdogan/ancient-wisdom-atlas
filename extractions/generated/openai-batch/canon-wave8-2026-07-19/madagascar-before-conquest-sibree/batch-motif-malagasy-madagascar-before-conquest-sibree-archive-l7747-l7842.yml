  quote: ''
  summary: The passage describes Betsileo wooden charms used as medicine, antidotes,
    cures, and protections; Sihanaka talismans worn after reports that a tenrec or
    a speaking dog announced disease or disaster; Sihanaka food practices involving
    rice and various animals; and selected Sihanaka fady, including prohibitions on
    Thursday rice-field work and brick or mud houses.
  language: English
