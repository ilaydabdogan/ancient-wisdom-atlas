canonical_text:
  quote: ''
  summary: The passage describes specialized Betsileo vocabulary and respectful speech
    for chiefs and chiefs' children, including possible effects of tabooing words
    connected with chiefs' names. It lists special terms for chiefly conditions and
    funerary contexts, describes sacred handling of a chief's corpse, distinguishes
    terms for deceased commoners and deceased chiefs, notes scarlet as a royal color,
    and states that chiefs are treated almost as gods whose curses are believed to
    be inevitably fulfilled.
  language: English
  quote_policy: summarized
