- id: obs:3
  text: A note states that several ordinary words for body parts describe the actual
    office of those members, and that tabooing words forming chiefs' names or parts
    of names may have influenced specialized vocabulary.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A separate list gives words specially applied to chiefs, old or young, including
    terms for house, sickness, nursing, funeral singing, bier, lying in state, tomb,
    and burial.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poles on which a chief's corpse is carried to burial are called sacred
    wood, and the water into which they are cast after the funeral is called water
