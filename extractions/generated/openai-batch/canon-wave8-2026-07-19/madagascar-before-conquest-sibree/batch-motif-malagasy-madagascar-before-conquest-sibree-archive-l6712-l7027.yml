- id: obs:1
  text: A phrase used in public speaking is described as customary for showing respect
    to a chief's children during the opening deprecation of blame in a kabary or public
    speech.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives a list of special words used for elderly chiefs, including
    terms connected with body parts and ordinary actions.
  category: speech
  evidence_refs:
