  quote: ''
  summary: The passage describes Malagasy and Hova bodily customs and gestures of
    respect, royal allegiance, submission, mourning, beckoning, pointing, greeting,
    and grief, with several comparisons to Western, biblical, Roman Catholic, Arab,
    and European practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person passing in front of a superior or respected person bends the body
    low, extends the right hand nearly to the ground, and may say words meaning “Allow
    me to pass, sir.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same passing words may be used on a public path when passing someone seated
    at a door, window, or elevated seat above a boundary wall.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hovas are said to scorn people who neglect the polite passing formula,
    comparing them to an ox that passes without asking leave.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When presenting the kásina, described as the dollar of allegiance, or another
    present to the sovereign or a royal representative, the speaker stretches both
    open hands with palms outward, bends downward and forward, and raises the hands
    toward the addressee to about head level.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The phrase milàla-pàladia is glossed as “lick the sole” and is described as
    formerly denoting an act of homage from slaves to masters, wives to husbands,
    and inferiors to superiors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Customs connected with royalty include shaving the head by the whole population
    at the death of the sovereign, wearing the lamba below the armpits at royal funerals,
    and turning aside and baring the head when royal property is carried along.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For beckoning someone to come near, the people are described as stretching
    the hand with palm downward and moving the fingers toward themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For pointing out something near them, Hovas may motion with the mouth by stretching
    out the head and protruding the lower lip toward the object.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The kiss is described as almost unknown among the Malagasy except as introduced
    by Arabs and Europeans; nose-rubbing or nose-pressing is said to take its place,
    while handshaking is not native but is being adopted where foreign influence prevails.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Betsimisaraka women, under pressure from the Hova to send children to a school,
    went about with hands clasped on their heads, identified in the passage as a Betsimisaraka
    sign of grief, and bewailed the loss of their children.
  category: action
  evidence_refs:
  - ev:8
