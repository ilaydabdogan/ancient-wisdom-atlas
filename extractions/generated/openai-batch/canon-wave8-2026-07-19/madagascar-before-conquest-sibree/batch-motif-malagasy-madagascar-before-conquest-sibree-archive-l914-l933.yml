canonical_text:
  quote: ''
  summary: The narrators ride to Ambatomanga, stay at the house of the local Andriana,
    speak with a native evangelist, observe youths training with shield and spear
    during wartime, view the landscape from a tomb on a rock above town, then ride
    to Antananarivo and receive a warm welcome from English and Malagasy friends.
    They state that they returned despite war because their work and service were
    needed after six years away.
  language: English
