canonical_text:
  quote: ''
  summary: The passage describes Merina village entrances, house layouts, a hill village
    with old timber houses and an arena, ox pens and New Year fattening practices,
    rice storage pits that could also serve as refuge, worship places, or execution
    sites, and central family tombs with special structures over noble tombs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some villages have large stones or pole gates at entrances, while villages
    exposed to robbers may have treble gateways with thick wooden doors and a tunnel-like
    passage.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children play games on the great gateway stone in many villages, which the
    author treats as evidence that the stone has not recently been needed for war
    defense.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside the village there are no intersecting streets, and houses are built
    irregularly, though old-fashioned houses are oriented north and south with the
    door and window on the west side.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Common houses are described as made from hard red earth, wood framing, bamboo
    or rush, cow-dung plaster, or sun-dried brick, with richer people owning larger
    two-storey or tiled-roof houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Amb6hitritankady is described as a high-hill village whose centre contains
    ten large timber houses with high-pitched roofs and long gable horns, arranged
    around a sunken oblong space formerly used for bull-fights, games, and amusements.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief's former house in Amb6hitritankady is larger than the others and
    has massive corner and central posts, one great room, wooden flooring, and mat-covered
    walls.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Many village houses lack privacy, backyards, and outbuildings, though low
    walls sometimes form small enclosures.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Square pits called fahitra serve as ox pens, where cattle are fattened, especially
    for the New Year national feast called Fandroana, translated as “the bathing.”
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cow-dung is collected, made into circular cakes, dried on house walls, and
    later used as fuel for burning off slabs of gneiss rock used in tomb construction.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rice is stored in bottle-shaped holes dug into hard red earth, closed with
    a flat stone and covered with earth so that strangers cannot easily find them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: In former times, rice pits were sometimes used by Christian people as refuge
    and worship places during persecution.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: People who offended the sovereign were sometimes placed in pits partly filled
    with earth, and boiling water was poured over them until they died.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The central village area may contain the large family tomb of the chief man,
    described as a stone structure and vault with shelves where corpses wrapped in
    silk cloths are laid.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The tomb vault has steps down on the west side and a massive stone slab door
    turning on pivots.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: For people of Andriana or noble birth, the tomb stonework is surmounted by
    a small wooden house with a roof and door but no window, called trano masina or
    trano nianara because it has no hearth or fire.
  category: object
  evidence_refs:
  - ev:7
