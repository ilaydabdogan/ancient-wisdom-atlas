canonical_text:
  quote: ''
  summary: 'The passage discusses Malagasy river, lake, lagoon, crater-lake, town,
    and village names. It notes stories and superstitions attached to certain waters:
    a giant throwing his hand across a stream, avoidance of placing canoes on the
    Matsiatra, a tradition that Lake Itasy formed after a Vazimba chieftain broke
    an embankment, and Tritriva crater lake as the traditional abode of the seven-headed
    Fandny. It also records linguistic comparisons for some lake names and the ambiguity
    between hill names and settlement names.'
  language: English
  quote_policy: summarized
