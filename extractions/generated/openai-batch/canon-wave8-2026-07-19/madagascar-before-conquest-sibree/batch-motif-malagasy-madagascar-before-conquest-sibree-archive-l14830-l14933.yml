canonical_text:
  quote: ''
  summary: The passage describes Malagasy use of mixed European and local clothing
    in public settings, especially army displays, weddings, church attendance, and
    Christmas services. It includes anecdotes about borrowing European clothes, servants
    using household linens as lambas, washerwomen renting clients' garments, a child
    receiving and wrapping himself in a lamba during church, and worshippers wearing
    elaborate but uncomfortable European-style finery.
