canonical_text:
  quote: ''
  summary: 'The narrator describes the steep crater edge and dark lake of Tritriva,
    then reports several local accounts told by a bearer: lovers who leapt into the
    lake became cliff-side trees whose branches bleed; the Zanatsira clan reads turbid
    lake water as a death presage for sick members; a seven-headed serpent formerly
    lived in the lake before moving to Andraikiba. The bearer also describes seasonal
    changes in the lake level and an outlet spring, and the narrator explains the
    place-name by reference to the ridge and deep chasm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crater edge is described as steep and dangerous, with a fall leading down
    to cliffs and dark waters below.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bearer descends a difficult path to fetch lake water; the water is reported
    to taste sweet and good, and the bearer tells legends about the place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bearer identifies small trees or bushes on the cliff face as a young lad
    and lass who were attached to each other; the girl's parents disapproved, and
    the youth tied himself and the girl together with his loin-cloth before plunging
    into the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same account says the pair became two side-by-side trees and now have
    a young tree as offspring; broken or pinched branches are said to exude blood
    rather than sap.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Zanatsira clan is said to claim special rights in Tritriva lake, and when
    a member is ill they check whether the water has turned brown and turbid as a
    presage of death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another legend makes the lake the former home of the Fananim-pito-Ibha, described
    as a seven-headed serpent, which later moved to the volcanic lake of Andraikiba.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The bearer says the lake water diminishes in the rainy season and increases
    in the dry season, and that an outlet forms a spring north of the mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator explains the name Tritriva as combining a word for the ridge
    on a chameleon or fish with a word meaning low or deep, fitting the steep ridge
    and deep chasm.
  category: other
  evidence_refs:
  - ev:8
