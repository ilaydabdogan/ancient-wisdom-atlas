canonical_text:
  quote: ''
  summary: The passage lists illustrations, introduces a chapter on a journey from
    Mahanoro to Antananarivo during the Franco-Malagasy war, and describes the party’s
    travel by filanjana with Malagasy bearers. It notes landscape features, travel
    accommodations, a Betsimisaraka cemetery with raised corpse enclosures, house-roof-like
    tombs, a horned village post bearing an ox skull identified as a circumcision
    memorial, and subsequent canoe travel through creeks, lagoons, and a lake.
  language: English
  quote_policy: summarized
