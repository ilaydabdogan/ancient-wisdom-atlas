  text: During the Franco-Malagasy war of 1883-1885, the Tamatave route to the capital
    was closed, so routes from Mahanoro and Mananjara were used by foreigners going
    inland.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator reports travelling to Imerina by the Mahanoro route in November
    1883.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party travelled in native filanjana, carried by strong Malagasy bearers
    in sets of four, over footpaths crossing hills, bogs, and streams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The party’s lodging on the road consisted of simple huts with mats, and their
    provisions included rice, fowls, and stored supplies.
  category: setting
  evidence_refs:
  - ev:3
