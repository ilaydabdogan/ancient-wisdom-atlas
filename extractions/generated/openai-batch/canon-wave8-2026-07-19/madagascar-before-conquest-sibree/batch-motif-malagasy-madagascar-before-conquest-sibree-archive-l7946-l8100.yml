canonical_text:
  quote: ''
  summary: 'The passage lists Malagasy food valuations and many omens: signs promising
    meat, wealth, rice abundance, long life, and lucky journeys; signs of calamity,
    famine, unsuccessful trade, poverty, and death; weather prognostics; portents
    based on resemblance; signs of strangers arriving; and household wall-leaning
    signs about wife or husband dominance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents Malagasy notions in which rice is the highest item among
    roots and grain, and honey is ranked above meat among foods eaten with rice.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stumbling when going out, a fly entering one's mouth, and treading on an animal
    when going out are listed as signs that one will eat meat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cooking rice that forms a border or swells in the middle, a boil on the shoulder,
    fifteen maize stalks in a row, red hair on the head or neck, and arriving late
    for a meal are listed as signs of becoming rich.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hedgehog not being properly buried and getting sore eyes are listed as signs
    that rice will grow well.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: White hairs appearing while one is still young are said to foretell old age;
    meeting a crow or kestrel-hawk on a journey is said to foretell a lucky journey.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: General calamity omens include a Takatra crossing the village, house walls
    cracking in opposite places, a hen crowing, a hen laying small eggs, a hen eating
    her own eggs, and seeing a two-tailed small lizard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Famine omens include dogs eating unboiled manioc, dogs digging up earth-nuts,
    a Tsikinty nest opening turning differently than usual, and the cuckoo's cry indicating
    that rice will not grow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: For trade and travel, a trader met by a fihlaka hawk is said to have no success,
    and a traveller met by a Takatra is said to meet something unfortunate.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An unexpected arrival at a meal and speckled fingernails are listed as signs
    of coming poverty.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Quivering eyelashes, tingling ears, the antamba's cry near the house, and
    being met by a snake are listed as signs connected with death or news of death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Weather prognostics include the swallow flying low, the owl's screech, the
    lark making a deep nest, and rain striking particular corners of the house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some portents are explicitly described as involving likeness between sign
    and outcome, including a crowing hen and female sovereignty, separated teeth and
    spaced maize, carrying a child while planting and abundant produce, and crooked
    posture while arranging eggs and crooked-necked chickens.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Signs of strangers arriving include hens cackling at the door, striking a
    manioc root while digging, people becoming sleepy at midday, and a spider falling
    inside the house.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: House walls inclining south are said to indicate the wife will be stronger
    in the house, while walls inclining north are said to indicate the husband will
    have the best of it.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage explicitly compares the antamba cry's evil significance with European
    beliefs about the owl's cry.
  category: relationship
  evidence_refs:
  - ev:8
