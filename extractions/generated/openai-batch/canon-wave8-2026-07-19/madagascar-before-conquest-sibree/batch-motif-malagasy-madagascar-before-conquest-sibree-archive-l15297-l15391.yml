canonical_text:
  quote: ''
  summary: The passage describes Malagasy village church construction, decoration,
    offering containers, and disciplinary practices for church attendance. Many churches
    are said to have been built and adorned mainly by local skill and taste. Decorations
    include secular, military, natural, architectural, and textual elements. Weekly
    offerings are collected in reused tins or flasks. Some officials or church officers
    enforce attendance or attentiveness through penalties involving a stone, crawling
    around an ox-fattening pen, or thrown pebbles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Because missionaries could give personal guidance to only a small proportion
    of the many scattered churches, most village churches are described as products
    of local skill and taste.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many village churches are described as rough clay-walled, brick-gabled, thatched
    structures with simple furniture such as an earth or brick platform, a table serving
    as pulpit and Communion table, mats, lesson-sheets, and sometimes a blackboard.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some village church decorations include card-like wall ornament, painted officers
    and soldiers, sportsmen shooting large birds, a fruiting tree behind a pulpit,
    flowers, a ship, a towered church, birds, clocks, and spear-and-shield figures.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that he cannot tell whether spear-and-shield figures refer
    to Christian armour imagery, and that he has not noticed sacred monograms or emblems
    in these village churches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Weekly offering receptacles at some village church doors include old sardine
    tins, jam tins, and tin flasks formerly filled with gunpowder.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The late Queen's wish that her subjects worship the true God was interpreted
    in some places by petty officials as authority to force attendance and punish
    negligence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: People who did not attend service regularly could be seized and made to carry
    a stone to the top of a nearby hill and back down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Tsiafahy, irregular chapel attendees were made to creep on hands and knees
