  text: The passage says some Madagascar mountain-names show variety and imaginative
    power, while other obscure names may preserve archaic words or obsolete grammatical
    forms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Madagascar’s largest rivers as flowing mainly west,
    with many small streams cutting gorges and being broken by cataracts and falls.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Two Malagasy words for “river” are given: r^nirdno, glossed as “mother of
    waters,” and ony, described as often combined with other elements in river-names.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The word ony is described as Malayan in origin and compared with a Malayan
    word for river.
  category: relationship
  evidence_refs:
