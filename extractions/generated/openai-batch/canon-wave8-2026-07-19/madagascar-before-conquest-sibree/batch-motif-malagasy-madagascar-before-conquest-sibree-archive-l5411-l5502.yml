canonical_text:
  quote: ''
  summary: Sibree surveys Malagasy place-names, especially river-names. He notes river
    geography, terms for “river,” descriptive river-names based on water, color, danger,
    animals, stones, trees, metals, and persons, and he states that some meanings
    remain obscure or may preserve older linguistic forms or legendary references.
  language: English
  quote_policy: summarized
literal_observations:
