canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy gestures and symbolic acts: use of the
    lamba to cover the face or mouth as a social or emotional sign; public speech
    gestures involving dance, weapons, lamba removal, jumping, and stamping; forms
    of walking with friends and saluting superiors; high pointing toward distant objects;
    an imitation game; mourning gestures; and material signs of ownership, protection,
    tabu, road avoidance, and historical symbolic exchanges involving wood, lamba,
    a bullock, and a cut cloth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman may be identified or reproached by walking with her face covered by
    her lamba, including the phrase that she walked "with face covered like a harlot."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Covering the lower face with a lamba is described as a sign of sullenness
    or laziness, and covering the mouth is described as indicating modesty or shame,
    sometimes accompanied by uncovering the feet and lower legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a public assembly, a speaker giving loyalty and obedience assurances may
    dance, flourish a spear or sword, throw off the lamba, jump, and stamp both feet
    on landing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Friends walking together are described as going hand-in-hand, or with one
    person’s hand around the other’s shoulder or waist, rather than arm-in-arm.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Betsileo person saluting a superior bends forward, makes a scraping gesture,
    and tugs at the forelock.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When pointing to a distant object, Malagasy people are said to point higher
    than Europeans would, toward the heavens in the object’s direction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the described imitation custom or game, one wife imitates another using
    hands and feet; the observer says each gesture may convey a definite idea to local
    participants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On receiving news of a near relative’s death, women are described as throwing
    themselves face-down, creeping toward the messenger, rolling in dust, and tearing
    their hair.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The kidy is described as a sign of ownership, possession, or protection, and
    as a mark of tabu or tapu, usually made as an upright stick with a bunch of grass
    at the top.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bearers may tie grass around one end of a palanquin pole before a journey
    to show they are engaged for it and will claim the carrying.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A road or path may be tabu-marked by placing a stick or sticks across it to
    tell those behind to avoid it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage lists earlier symbolic acts involving a piece of wood sent as
    a refy measure, a large lamba on which a bullock was killed without blood falling
    outside it, a lamba sent with a hole cut in the middle, and symbolic teaching
    by Andriamampandry.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
