canonical_text:
  quote: ''
  summary: 'The passage records Malagasy accounts of several fabulous creatures: the
    Fanany, a fierce snake-like creature with seven horned heads in some reports;
    the Tokantongotra or Tokandia, a large white swift nocturnal man-eater; the Kinoly,
    a dead person transformed into a red-eyed, long-nailed, thieving being emerging
    from a tomb; and the Dona or Pily, a striped creature gentle by day but deadly
    at night, able to alter its size and kill by constriction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fanany is described as similar in appearance to a water-snake and to the
    Manditra, fierce, and, when full-grown, having seven heads, each with a horn.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ralako is reported as saying that he saw a Fanany fight a bull at night, using
    its seven horns rather than biting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the reported fight, the Fanany's horns were successively broken and the
    bull killed it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before death, the Fanany drew itself up and swelled to mountain size, and
    its effluvium made neighboring villages uninhabitable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another account says that when large the Fanany encircles a mountain and eats
    any surplus length remaining after its head and tail meet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some accounts say the mature Fanany sticks its tail into the earth and mounts
    to the sky; others say it goes into a great body of water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Fanany is associated with the lake of Itritriva and later with Andraikiba
    when it became too large for the former lake.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A native narrator says he saw an animal called the Fanany but did not see
    seven heads; local people explained that it was still too young.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tokantongotra or Tokandia is described as a large white animal, smaller
    than the Songomby, with feet not cloven.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tokandia is described as exceedingly swift, eating men, and going about
    at night like the Songomby.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note reports a common saying that people who even see the Tokandia are immediately
    struck dead or senseless.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The Kinoly is said to be human: when a person who becomes a Kinoly dies,
    relatives bury the body until the intestines and stomach skin decay, then open
    the tomb so the Kinoly may go out.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Kinoly have red eyes and long nails, and their bodies are otherwise mostly
    human though no longer like the living.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kinoly are said to steal cooked rice, other food, and sometimes rice in the
    husk, but they can hardly carry burdens.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In one story a male and female Kinoly try to carry rice, each complaining
    of being killed by the burden on shoulder or head.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: In another story a Kinoly explains its red eyes by saying God passed by them,
    explains its long nails as being for tearing out the questioner's liver, and then
    tears the man.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Betsileo are said to believe in the recent or present existence of Kinoly
    and to regard becoming one as a cause of lamentation for both the person and relations.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The Dona or Pily is described as big, long, fierce, and striped; makers of
    lamba take its skin as a pattern for striped cloth.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:19
  text: The Dona is gentle by day, fierce at night, bellows like a bull, and kills
    humans or animals by encircling the loins and compressing tightly.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: The Dona can make its body big or little, and in a contest with a Menarana
    serpent it first appears afraid and becomes small.
  category: action
  evidence_refs:
  - ev:12
- id: obs:21
  text: When the Menarana twines around the Dona and raises its barbed tail to strike,
    the Dona suddenly swells and breaks the serpent.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:22
  text: The Dona is said to be able to force its way out of a blocked hole; whistling
    angers it, though in daytime it is usually tame.
  category: attribute
  evidence_refs:
  - ev:13
