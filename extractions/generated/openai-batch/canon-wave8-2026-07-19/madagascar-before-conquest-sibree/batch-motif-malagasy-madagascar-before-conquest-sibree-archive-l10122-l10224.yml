- id: ev:8
  type: summary
  locator: lines 10183-10191
  quote_or_summary: The Kinoly is said to be human; when someone dies and becomes
    one, relatives bury the body until certain internal parts decay, then open the
    tomb so the Kinoly may go out.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
- id: ev:9
  type: summary
  locator: lines 10191-10209
  quote_or_summary: Kinoly have red eyes and long nails, are otherwise mostly human
    but unlike the living, steal food and rice, and in one story male and female Kinoly
    cannot carry stolen rice without crying out in pain.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
- id: ev:10
  type: summary
  locator: lines 10209-10222
  quote_or_summary: A person asks a Kinoly why its eyes are red and nails long; it
    answers that God passed by the eyes and that the nails are to tear out the person's
    liver, then tears the man. Betsileo belief in Kinoly is reported as recent or
    present.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
- id: ev:11
  type: summary
  locator: lines 10223-10240
  quote_or_summary: The Dona or Pily is big, long, fierce, and striped; its skin is
    a model for striped lamba cloth. It is gentle by day but fierce at night, bellows
    like a bull, and kills by encircling and compressing victims.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
- id: ev:12
  type: summary
  locator: lines 10240-10255
  quote_or_summary: The Dona can make its body big or little. When meeting the Menarana
    serpent, it shrinks, lets the serpent twine around it, then suddenly swells and
    breaks it; the Menarana has a barbed spear-like tail.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
- id: ev:13
  type: summary
  locator: lines 10255-10264
  quote_or_summary: The Dona is said to force its way out of a blocked hole despite
    strong opposition; whistling makes it angry, although by day it is usually tame.
  source_text_path: texts/public-domain/malagasy/project-gutenberg/madagascar-before-conquest-sibree.md
  rights_note: Public domain source; concise summary used.
