canonical_text:
  quote: ''
  summary: The passage explains rules of Malagasy sikidy divination. It describes
    how matching or unique figures in named columns are interpreted as answers, omens,
    remedies, or indications of faditra/piaculum actions to avert evil. It then introduces
    the Sikidy tokana, a class of divination based on figures that occur uniquely
    in one of twelve principal columns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure representing the question is interpreted differently when it reappears
    under columns associated with enemy, bloodshed, or food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says practiced mpisikidy could produce much information and sometimes
    find an answer in the first act of their proceedings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The divinatory procedure examines whether other figures are alike and counts
    how many columns contain the same figure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A table links named combinations of columns with stated meanings such as not
    moving, two deaths, a crowd of people, an approaching enemy, expected hindrances,
    recovery to old age, and troops not advancing.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Some combinations point to a faditra or piaculum, including two locusts thrown
    away in response to a two-deaths indication.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If Alokbla occurs three times, three stones are to be thrown away as a faditra;
    if Vanda mitsangana occurs three times, feathers of a white hen are to be a faditra.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If Alaimbra occurs twice, the stated meaning is that the son of a mighty man
    is likely to be mighty too.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Certain combinations are interpreted by analogy with a preceding case, such
    as a formerly ill child who recovered or died.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eight occurrences of Vontsira are called the eight healthy men and are considered
    an excellent remedy against disease.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When no reasonable answer can be construed from the figures, the mpisikidy
    uses other operations called Sikidy tokana and Lofin-tsikidy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sikidy tokana occurs when any of the twelve principal columns has a figure
    that occurs in no other column; such a figure is described as standing alone.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The twelve columns are enumerated in a set order, beginning with Andriamanitra,
    and the meaning of a unique figure depends on which of sixteen figures occurs
    in the relevant column.
  category: sequence
  evidence_refs:
  - ev:8
