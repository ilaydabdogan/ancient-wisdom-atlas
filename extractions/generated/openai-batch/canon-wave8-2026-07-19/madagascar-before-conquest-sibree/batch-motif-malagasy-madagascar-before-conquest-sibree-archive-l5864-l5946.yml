canonical_text:
  quote: ''
  summary: The passage explains Malagasy place-names as preserving meanings involving
    cattle terms, early king Rabiby or Ralambo, tribal and numeric divisions, local
    or family history, sacred places and trees, provincial and district names, and
    eponymous naming from peoples or chiefs. It reports traditions that Rabiby slew
    an enormous wild-boar and discovered beef was good to eat, that the ox may once
    have been sacred and ritually eaten, and that Rapeto was a giant known for feats
    of strength.
  language: English
