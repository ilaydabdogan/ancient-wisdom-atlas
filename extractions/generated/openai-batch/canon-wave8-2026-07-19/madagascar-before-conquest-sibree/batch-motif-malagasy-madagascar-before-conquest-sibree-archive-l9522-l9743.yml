canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy children''s songs and games: a
    passage-under-joined-hands song naming a cardinal-bird''s red house; two Sakoeda
    call-and-response games involving Rafara, an absent or dead husband, red burial
    cloths, lost beads, frog-like leaping, and chest-slapping; a Hedgehogsteps game
    imitating an animal; a leper-tag game with ring play, stone refuge, a formula
    addressed to a grandfather beneath the earth, and spitting; a carrying-on-the-back
    game with a Takatra bird''s nest and dead mate; and a moonlight game called Star-killing
    in which children symbolically choose and sing against a bright star.'
  language: English
  quote_policy: summarized
