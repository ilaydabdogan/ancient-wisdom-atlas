canonical_text:
  quote: ''
  summary: The passage describes several simpler Betsimisaraka forms of sikidy, including
    a grass-stalk remainder procedure and the Ati-pako method for recovering stolen
    property. It then explains vintana as destiny or fate connected with birth day,
    time, Zodiacal constellations, lunar stations, weekdays, and the Seven Planets,
    and notes the authority of specialists who interpret and remedy such influences.
  language: English
  quote_policy: summarized
