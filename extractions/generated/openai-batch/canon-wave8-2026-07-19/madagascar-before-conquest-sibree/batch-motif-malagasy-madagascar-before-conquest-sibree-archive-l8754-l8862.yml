  summary: The passage gives Malagasy oratorical examples praising friends, admonishing
    people who avoid unpaid government service, and warning against evil or unguarded
    speech. It notes the use of indirect formulae such as “they say,” discusses symbolic
    actions as well as verbal figures, compares such actions to Hebrew prophetic teaching,
    and recounts a political exchange between Andrianimpoina and a Betsileo chief
    using kinship, cloth, island, and measured-wood imagery.
