canonical_text:
  quote: ''
  summary: 'The passage describes funerary customs attributed to several Malagasy
    groups: delayed burial and household lying-in-state among the Tanala; same-day
    chiefly burial and a mourning image among Andriana; Vorimo house vigils, feasting,
    forest tombs, and stone altars for offerings; standing stones for absent corpses
    or temporary funeral resting places; Ikongo forest burial marked by a tree notch;
    and Hova family cave-vault tombs with ordered placement of bodies.'
  language: English
  quote_policy: summarized
