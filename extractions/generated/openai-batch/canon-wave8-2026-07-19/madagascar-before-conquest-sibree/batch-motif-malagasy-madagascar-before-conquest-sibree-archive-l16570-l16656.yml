  quote: ''
  summary: The passage summarizes fossil discoveries and paleontological research
    in Madagascar, including a gavial-like fossil reptile named Steneosaurus Baroni,
    lists known fossils, reconstructs ancient marshy landscapes with extinct animals
    and early human hunters, notes supposed pre-iron Vazimba tools, and uses images
    of mist, mental sight, and a lifted curtain to describe geological knowledge revealing
    the distant past.
