  summary: The passage introduces a chapter on Imerina, the central province of Madagascar,
    and reviews recent European and American efforts to map and describe the island.
    It notes advances after 1861, identifies Imerina and Antananarivo as central political
    and cultural locations, and summarizes journeys, surveys, and discoveries by several
    named travellers and missionaries, including evidence for an ancient large lake
    of which Lake Alaotra remains.
  language: English
