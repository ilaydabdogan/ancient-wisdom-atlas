canonical_text:
  quote: ''
  summary: The passage describes Malagasy san-andro divination connected with weekday
    names, auspicious and inauspicious days, day-specific numbers, burial procedure,
    sacrifice timing, weekday associations with colors and social categories, and
    sikidy/vintana methods for identifying illness danger. It also notes Arabic and
    Hebrew linguistic origins proposed for weekday names and compares belief in lucky
    and unlucky days with European popular belief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that native weekday names were explained as being of Arabic
    origin for the first five names, with the sixth from Dschuma and the seventh from
    a modified Hebrew Sabbath form.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A number is connected with each day-name, and these numbers are said to be
    important in the practical use of san-andro.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The direct san-andro is described as relating to burials; on a Wednesday,
    whose special number is six, bearers stop six times with the bier, throw down
    a stone at each stop, and carry the corpse six times around the grave before burial.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The san-andro of the living is described as relating to sacrifices; the priest’s
    invocations refer to the day before yesterday, offerings are limited to three
    good days, and sikidy can be performed on any day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The seven days are assigned categories: Sunday with white things, Monday
    with green and blackish things, Tuesday with scarred or small-pox-marked people,
    Wednesday with women and female things, Thursday with slaves, Friday with nobles
    and red things, and Saturday with young people and young things.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: When a sufferer consults a diviner, the diviner attributes or warns of danger
    according to the day’s category, such as Sunday dangers involving a white stone,
    milk with ghosts, or a white-haired woman, and Thursday dangers involving slaves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The tasik' andro is described as a compound of vintana and sikidy used to
    foretell a day of special illness danger by interpreting combinations of sikidy
    columns and figures.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that sikidy and vintana were once very powerful influences
    in Madagascar and that their influence was passing away.
  category: attribute
  evidence_refs:
  - ev:8
