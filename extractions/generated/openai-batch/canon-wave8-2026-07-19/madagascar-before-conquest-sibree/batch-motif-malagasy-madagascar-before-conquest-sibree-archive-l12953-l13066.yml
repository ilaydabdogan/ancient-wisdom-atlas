canonical_text:
  quote: ''
  summary: 'The passage describes variations in Malagasy funeral rites: burial locations,
    corpse preparation, coffins and tombs, corpse orientation, grave goods, impurity
    rules, ancestral burial obligations, delayed interment in some groups, offerings
    to the corpse, funeral feasts, animal slaughter, and outward signs of mourning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage divides Malagasy funeral practice into groups whose cemeteries
    are hidden in forests or rocks and groups who inter relatives by roadsides or
    among dwellings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many Malagasy place the dead in a hollowed-out tree trunk; Hova wrap the corpse
    in lamba; Bara are said to place the naked corpse on the ground.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nearest relatives of the same sex wash the corpse, dress its hair, and wrap
    it in new cloths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some eastern and other tribes do not bury the coffin, but place it on the
    ground, on a framework, or in a rock fissure; most other inhabitants place it
    in the ground and cover it with a rectangular heap of stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The head of the corpse is generally turned toward the east, and items such
    as earthen vessels, pots of incense, and cloths are enclosed in the tomb.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that all Malagasy hold a notion of impurity connected with
    a corpse.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A funeral procession may not pass near a sovereign, the sovereign's dwelling,
    or sacred stones, and those who have followed it must purify themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In districts where tombs are far from dwellings, a person found in a cemetery
    is considered a sorcerer and punished with death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dead are described as feared and deeply respected; burial in the ancestral
    cemetery or tomb is considered highly important.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bones of relatives are often brought from great distances for deposition in
    native soil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the body cannot be recovered, the deceased person's pillow and sleeping
    mat are interred instead, and a commemorative funeral monument is erected.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A vow to the dead, called lolo among coast people, is said to be sacred.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In a custom said to be widespread except among the Hova, the corpse is not
    interred immediately; relatives wait until decomposition and may collect the putrid
    liquid flowing from the body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: During the wake, relatives and friends bear the odors by drinking neat rum
    and burning incense, suet, and hides.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: During the delay before burial, many native tribes offer food and drink to
    the corpse.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Funerals, especially among wealthy families, include feasts with oxen killed,
    rum drunk, rice and meat eaten, muskets fired, songs, and weeping.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Relatives do not eat the flesh of oxen killed for the death of one of their
    own family.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Mourning is marked by dishevelled or unbraided hair, shaved heads at sovereigns'
    deaths, coarse and dirty garments, not washing or combing hair, and not looking
    in a mirror.
  category: attribute
  evidence_refs:
  - ev:11
