  text: Several plants with conspicuous yellow, orange-yellow, or mixed yellow and
    red flowers are described, including prickly-pear, Hibiscus, and aloes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prickly-pear and the larger aloe called Vahona are used as hedge plants because
    of prickles or armed leaves; prickly-pear is also used for old town and village
    defences.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Taritra has long leaves with a sharp spine only at the ends, sends up
