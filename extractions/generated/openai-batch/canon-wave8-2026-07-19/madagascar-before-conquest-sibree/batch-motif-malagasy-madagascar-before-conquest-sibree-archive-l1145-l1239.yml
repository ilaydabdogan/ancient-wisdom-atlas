literal_observations:
- id: obs:1
  text: The described route crosses the Ankay plain and the Mangoro river, passes
    through a narrow upper forest belt, and emerges into the province of Imerina.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The central region is also called Ankova, glossed as the place of the Hova.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hova are described as the dominant tribe who advanced from the East Coast,
    drove out the Vazimba, and made the region their home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name Imerina is presented as probably deriving from a root meaning elevated,
    prominent, or conspicuous.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Imerina is bounded in broad terms by upper forest to the east, uninhabited
    regions to the north and west, and the Ankaratra slopes and Betsileo-separating
    region to the south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The western side of Antananarivo includes Betsimitatatra, a great rice-plain
    formed from the dried-up bed of an ancient lake and described as the granary of
    the capital.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Many valleys have terraced rice-plots where rice is sown, young plants are
    taken up, and they are transplanted in larger fields by rivers or in old lake
    beds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The province contains numerous lofty hills used as landmarks and mapping points.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The southwest of the province is dominated by Ankaratra, whose peaks are described
    as the highest points in the island and as part of an ancient volcanic mass.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The central region is described as high above sea level, temperate despite
    its tropical location, clear in atmosphere, bare of much wood, and moor-like in
    many parts.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Granite or gneiss summits are said to form rounded rock bosses and formations
