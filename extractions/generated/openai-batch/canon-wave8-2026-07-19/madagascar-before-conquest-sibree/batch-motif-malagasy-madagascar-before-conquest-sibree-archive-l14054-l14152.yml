canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy funerary monuments observed between Isindrandahy,
    Ambositra, Fianarantsoa, and Ikangara: Hova tomb construction, upright memorial
    stones, carved wooden and stone posts, memorials to Betsileo kings and chiefs,
    geometric ornament, roadside tombs, and the later destruction of an Ambositra
    memorial site by a Hova governor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near graves between Isindrandahy and Ambositra, some upright stones were finely
    dressed, squared, and carved rather than rough undressed blocks or slabs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hova tombs are described as blue granite slab vaults with stone shelves for
    the wrapped dead, a stone door with pivot hinges, and a dressed stone superstructure
    often bearing a headstone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the corpse of a person of rank cannot be obtained for burial in the family
    tomb, a rough undressed slab is erected as a burial memorial; such slabs are often
    ten or twelve feet high and are called vatolahy, literally “male-stone.”
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On rising ground at Ambositra there was an old Ambatana tree and memorials
    to early Betsileo kings.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief memorial at Ambositra was a square timber post about ten feet high
    with projecting wood near the top forming a kind of stage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The timber memorial was carved with panel patterns including concentric circles,
    bossed circles, leaf ornament, parallel lines, chevron or zigzag forms, and wave-like
    scrolls.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nearby memorials consisted of paired posts with lintels like gateways, with
    each opening filled by a large flat upright stone; the posts were carved and had
    tops shaped somewhat like vases.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A newly set-up memorial stone seen earlier was carved in three large squares
    with ornament similar to the wooden posts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Twelve years later the Ambositra burial memorial group had been swept away
    after the Hova governor appropriated the site for his residence and courtyard;
    tombs of old Betsileo chiefs and trees were destroyed for a brick building.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the road from Ambositra to Fianarantsoa, a roadside tomb had a carved wooden
    post similar to those at Ambositra, with some compartments compared to the English
    Union-Jack.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near Ikangara, many tombs and memorial posts were grouped between a rounded
