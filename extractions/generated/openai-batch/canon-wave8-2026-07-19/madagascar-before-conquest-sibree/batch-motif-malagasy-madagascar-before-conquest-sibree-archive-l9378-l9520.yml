canonical_text:
  quote: ''
  summary: The passage describes Malagasy children's play in moonlight, including
    the gathering of companions, teasing of children who do not join, and several
    games. One game, Rasarindra, arranges children in a line protected by a figure
    called the children's mother while a robber or catcher tries to seize the last
    and youngest child, called a little lamb. Two forms of Soamiditra arrange two
    tall children as a gateway while smaller children pass through with songs involving
    invitation, refusal, foods, locust imagery, and a doorway of a Golden Prince.
  language: English with Malagasy terms and song lines
  quote_policy: summarized
