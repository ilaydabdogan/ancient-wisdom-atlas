canonical_text:
  quote: ''
  summary: The passage opens a chapter on Malagasy divination, fate, and destiny.
    It describes the Sikidy/Sikify as a widely practiced divinatory system used to
    investigate the future, secret dangers, illness, and remedies. It explains the
    diviner's role, expiatory offerings called faditra, the prestige and names of
    diviners, possible Arabic linguistic connections, and Malagasy notions of vintana
    or fate as tied to stars, birth time, auspicious times, constellations, and month
    names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divination system called Sikidy or Sikify is said to be practiced by almost
    all the various tribes inhabiting Madagascar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Sikidy is used to look into the future, detect secret enemies
    or dangers, and find out one's lot of good or evil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Sikidy is believed not only to reveal destiny but also to
    avert dreaded evils.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: When someone is sick, the nipisikidy or diviner is described as trying to
    find the cause of the evil and the means of removing it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage defines faditra as an expiatory offering or thing ordered by the
    diviner to be thrown away to prevent or avert an evil.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The faditra is described as generally resembling the evil in name, shape,
    number, or another feature.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: One example says that if the Sikidy produced 'two deaths,' two locusts should
    be killed and thrown away to prevent the death of two men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another example says that if the Sikidy produced 'sick,' a piece of a tree
    called Hazo marary, 'sick tree,' should be made a faditra.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people are said to have had remarkable trust in their diviners and their
    art.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Imerina and Betsileo, diviners are said to have been commonly called Ny
    masina, translated as 'The sacred ones.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In outlying provinces, especially the south and west, diviners are said to
    be called ambiasa or ombiasy, linked in the passage to Arabic ambia, 'prophet.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The word Sikidy is said to include both investigation of what is secret and
    finding a remedy if one is required.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Vintana is described as a person's destiny depending on the times declared
    by the stars at birth and also as the fitness or unfitness of certain times for
    certain actions.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says vintana rests upon astrology, with days and months connected
    to different constellations.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The passage states that native names of the months are Arabic in origin and
    are names of the twelve months.
  category: attribute
  evidence_refs:
  - ev:9
