canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy royal funerary euphemisms and mourning
    customs: tears are ceremonially offered, the sovereign is hidden rather than buried,
    a royal silver coffin is called a silver canoe, tomb closure is called stopping
    up the sun, and public mourning involves prohibitions and special terms. It also
    records figurative expressions for death, ancestors, smallpox, and circumcision.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women from different divisions or tribes are expected to come in relays to
    mourn a royal corpse, and this ceremonial act is described as presenting or offering
    tears rather than by the ordinary word for mourning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sovereign is said to be hidden rather than buried.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The massive silver coffin used for many recent Hova kings or queens is called
    the silver canoe.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the silver-canoe term may preserve a memory of an earlier
    time when the Hova were shore-dwelling or island people and buried their dead
    in old canoes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the royal corpse has been placed in the tomb and the entrance stonework
    is closed, the act is called stopping up the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sovereign is described as the sun, the light and warmth of the people,
    and was formerly often called so in public speeches.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The decease of some coastal chiefs is phrased as the king reclining or leaning
    on one side.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: General mourning at a sovereign's death is expressed by saying that heaven
    and earth are turned upside down.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: During royal mourning, with few exceptions, heads had to be shaved; hats and
    umbrellas were forbidden; only the lamba was worn in a specified way; singing,
    dancing, musical instruments, and several handicrafts were prohibited.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Necessary agricultural work and markets were referred to by substitute expressions
    during public mourning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dead relatives of the sovereign are described as absent or missing, while
    dead friends and relatives may be described as gone, faint, fallen, lost, finished,
    or gone to become ancestors.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: One expression compares the dead to salt fallen into water, which cannot become
    salt again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Smallpox is referred to by euphemistic names meaning greatly deserted and
    be far away, and circumcision may be called cutting the navel.
  category: speech
