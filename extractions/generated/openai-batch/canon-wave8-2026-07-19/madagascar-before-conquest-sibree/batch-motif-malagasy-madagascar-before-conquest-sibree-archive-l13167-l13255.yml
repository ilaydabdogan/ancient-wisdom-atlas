canonical_text:
  quote: ''
  summary: The passage describes funerary customs among several Malagasy groups, including
    treatment of corpses, decomposition fluids, coffins, lamps, widows’ conduct, roadside
    or forest burials, prayer stones, night burials of chiefs, secrecy around elite
    deaths, flags, Arabic-written paper strips, tomb forms, caste-marked burial positions,
    eastward head orientation, and a belief that body-dissolution liquids may give
    birth to a colossal sea-serpent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Betsimisaraka, the dead may be kept in houses for a long time; decomposition
    products are collected in a vessel and buried elsewhere, where relatives erect
    a stone and later come to pray.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lamp burns continually at the head of the Betsimisaraka corpse, and the
    widow is expected to remain by the funeral couch while the corpse is exposed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Betsimisaraka coffins are described as hollowed-out tree trunks with roof-shaped
    lids, placed in dense woods; some corpses are placed higher on stages with sheds
    or in hollowed tree trunks closed at both ends.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Articles belonging to the deceased, especially a bottle of rum, are commonly
    placed at the head of Betsimisaraka coffins.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the death of a Betsimisaraka chief, burial follows immediately and by night,
    and the event is not publicly announced until later.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Ranomena, corpses are placed on the roadside; a hole receives decomposition
    liquids, and a rock marks the place where the deceased’s children come to pray.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ranomena cemeteries are placed deep in the woods, and people go there only
    at interment.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Roandriana chiefs of the Tambahoaka, Taimoro, and Tanosy are buried at night
    one or two days after death; during lying-in-state, reddish-brown cloths are hung,
    a lamp burns at the corpse’s head, food is placed beside the bed or bier on the
    first day, and paper strips with cabalistic signs and Arabic words are fastened
    to the dead person’s arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: For these Roandriana chiefs, news of the death is kept secret outside the
    royal village until a white flag is hoisted after a month on the house where the
    corpse lay.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The tombs of Tanosy Roandriana chiefs have stone slabs at the head and foot,
    circular palisading, and restricted access; the chiefs’ bodies are wrapped in
    a lamba rather than placed in coffins.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Common free people are buried in coffins either at the road edge or in the
    woods; their tombs are stone-lined trenches closed by a slab with a white flag
    on a pole.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A woman disgraced through violation of caste requirements is placed transversely
    at the feet of relatives instead of beside them.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Men are placed on the bier on the right side and women on the left, with the
    head always turned toward the east.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage reports a belief that liquids from the body’s dissolution give
    birth, at least for chiefs, to a colossal sea-serpent called Fananina or Fandno^
    in the printed text.
  category: other
  evidence_refs:
  - ev:10
