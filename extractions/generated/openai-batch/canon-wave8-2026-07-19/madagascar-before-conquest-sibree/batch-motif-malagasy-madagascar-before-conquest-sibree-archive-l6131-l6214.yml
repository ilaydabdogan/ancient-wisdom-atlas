canonical_text:
  quote: ''
  summary: 'The passage explains several Betsileo place-names through local meanings
    and physical settings: mamba/voay may denote both crocodile and an awe-inspiring
    ruler; Ambbhitsandrazana is linked to dynastic inheritance, guarding the kingdom,
    and funeral stations; Ivohitsasaky, Isorana, and Ivohibasiana are described as
    hidden or inaccessible settlements in forest, rock, caves, cliffs, and ledges.
    The author concludes that many place-names connect closely with the features of
    the places named.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in Betsileo usage mamba or voay is not only the crocodile
    but also a big, awe-inspiring man such as a king, chief, or governor.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Andriamaniilina is described as dividing his inheritance among his sons
    and directing one son, probably the eldest, to leave the old Isimdra capital and
    reside at Ambbhitsandrazana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The appointed mamba was to guard the kingdom at Ambbhitsandrazana, which is
    given as the reason for the place-name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When members of the family die, the body is taken during funeral ceremonies
    on a pilgrimage around the province and lies in state for a time at Ambbhitsandrazana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rajbaka is named as the present prince and descendant of Andriamanalina; his
    family tomb and favourite residence are at Ivohitsasaky, a village hidden in a
