  summary: The passage describes Antananarivo as Madagascar's chief city and capital,
    located near the island's north-south center and built on a high rocky ridge.
    It details the approach from Tamatave, visible royal and religious buildings,
    the public assembly space of Andohalo, the precipice of Ampamarinana where accused
    sorcerers and later Malagasy Christians were killed, and the city's names and
    political rise under Hova dominance.
