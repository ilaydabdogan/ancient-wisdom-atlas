  quote: ''
  summary: The passage surveys Malagasy mountain and hill place-names, explaining
    names based on outlook, sharpness, height, divine or sky associations, mist, inaccessibility,
    wind, poetic titles, size, roundness, and rock. It notes a Tanala mountain regarded
    as a Malagasy Hades whose caves are supposed dwellings of departed spirits, and
    reports native reluctance and terror concerning Ankaratra summits because of a
    supposed malignant influence.
