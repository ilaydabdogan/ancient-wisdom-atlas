canonical_text:
  quote: ''
  summary: Two jealous sisters test public opinion about their sister Ifara’s beauty,
    strip her, and trick her into taking vegetables from the man-eating monster Itrimobe.
    Itrimobe captures Ifara to fatten and eat her. A mouse in plantain-fibre cloth
    receives white rice from Ifara and advises her to flee south with an egg, broom,
    small cane, and smooth round stone. Ifara escapes by leaving a plantain-tree stem
    as a decoy, and during pursuit the broom, egg, and cane become barriers, though
    Itrimobe overcomes each.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two sisters say Ifara is prettier than they are and fear that a prince
    or noble seeking a wife would choose Ifara instead of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sisters invite Ifara to go out and play, then ask an old woman which of
    the three sisters is prettiest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman and old man each say that Ramatoa and Raivo are good looking,
    but Ifara is better looking than either.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the old woman’s answer the sisters remove Ifara’s lamba, and after the
    old man’s answer they strip her of her underclothing.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Itrimobe is described as an immense monster, half human and half beast, man-eating,
    and having a frightfully sharp tail.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When asked who is prettiest, Itrimobe answers like the old woman and old man,
    indicating Ifara is still prettiest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sisters decide not to kill Ifara directly, but to get some of Itrimobe’s
    vegetables so that he may eat her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sisters tell Ifara to gather just-sprouting vegetables while they themselves
    gather full-grown ones, then accuse her of choosing badly and send her back for
    full-grown vegetables.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Itrimobe catches Ifara while she is gathering vegetables and says he will
    eat her because she is taking his vegetables.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ifara asks Itrimobe to take her as his wife, but the passage states that he
    intends to take her home, fatten her, and then eat her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sisters tell their parents that Ifara stole Itrimobe’s vegetables and
    that he has eaten her; the parents weep.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Itrimobe feeds Ifara at his house, keeps her indoors, covers her with mats,
    and goes hunting for things to fatten her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A little mouse wearing plantain-fibre cloth asks Ifara for white rice and
