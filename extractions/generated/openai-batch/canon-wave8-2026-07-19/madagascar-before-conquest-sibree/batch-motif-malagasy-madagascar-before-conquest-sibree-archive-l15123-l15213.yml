  summary: 'The passage gives linguistic and missionary anecdotes: European religious
    speakers make Malagasy pronunciation or word-form errors that produce offensive
    or comic meanings; missionaries struggle with Malagasy grammar; Malagasy speakers
    adapt English personal names, titles, and official terms into local phonetic forms;
    and Scriptural names such as Jesus Christ, Jews, and Gentiles become naturalized
    in Malagasy spelling and pronunciation.'
