  quote: ''
  summary: The passage reports a deceptive idol or serpent display used to obtain
    offerings, a tale of Rasoalavavolo under the water giving stones that become two
    male children, and an animal fable in which Rat tricks Wild-hog into a fatal fire
    game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Malagasy idols are described as small, often covered with red cloth, and believed
    to have power to make their bearers move or stop according to the idol's will.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A serpent is brought in a basket, set on the ground, and struggles violently
    because it is alive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people are frightened, dance for a long time, and each give a little money;
    the two men collect a large amount of money that day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two men tell sick people to come with money and a red cock as offerings,
    and warn that forgetting the god will lead to dying young.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many people worship the manioc-root, the two men become rich, and people receive
    supposed pieces of the idol that are only pieces of wood given by Ikotofetsy and
    Imahaka.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rasoalavavolo is said to live under water, to be beautiful, and to have very
    long hair; variant identifications are mentioned, while the narrator calls the
    account fictional.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rasoavolovoloina visits Rasoalavavolo to ask for a child, offers two silver
    rings, and receives two round smooth stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The two round smooth stones are said to become two male children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When grown, the two brothers visit Rasoalavavolo under water with coral beads,
    but she is asleep and does not speak with them; they are said to become ancestors
    of all later people in Madagascar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says many still believe the fable and come to story-tellers to
    beg for children; a note says native women often visit sacred stones with offerings
    hoping to bear children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Rat proposes to Wild-hog that they gather dry grass, cover themselves with
    it, and set it on fire as a game; they pledge consequences if either refuses.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Rat enters the fuel but burrows into the ground and hides in a hole; Wild-hog
    lights the heap, and Rat later emerges unhurt.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Rat chants about Wild-hog being covered and challenges Wild-hog to take his
    turn.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: Wild-hog burns in the fire and calls for help, while Rat laughs, dances, and
    taunts him.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Wild-hog escapes badly burned; Rat says it was a joke and tells him to bathe
    in water, after which Wild-hog dies.
  category: sequence
  evidence_refs:
  - ev:13
