  summary: The passage describes Antananarivo’s difficult rocky streets, the former
    wooden and thatched architecture, frequent fires, the end of a custom barring
    stone and clay buildings after the Queen and Government accepted Christianity,
    the preservation of an ancient royal house where deceased sovereigns lie in state,
    and prominent royal, religious, educational, and civic buildings including a palace
    topped by a gilt copper eagle used as a national emblem.
