  text: Ramavo is described as a descendant of Andriamanalina and as chieftainess
    at Nasimdratsofiy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage distinguishes vbhitra as a village or town and vala as, strictly
    speaking, a homestead, while also noting variable usage in ordinary speech.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ambatolahinandrianisiahana is explained as a place named for Andrianisiahana’s
