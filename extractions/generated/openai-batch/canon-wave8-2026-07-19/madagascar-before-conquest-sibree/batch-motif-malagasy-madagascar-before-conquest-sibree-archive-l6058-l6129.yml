  summary: The passage explains Malagasy place-name elements and examples. It discusses
    names derived from gatherings of people, village and homestead terms, monuments,
    non-interchangeable place-prefixes, precipices, rocks, hills, a proverb about
    ants raising Andrainjato, and place-names derived from local plants.
