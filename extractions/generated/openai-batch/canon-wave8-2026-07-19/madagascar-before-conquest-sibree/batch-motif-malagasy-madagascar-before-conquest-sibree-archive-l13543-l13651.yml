canonical_text:
  quote: ''
  summary: The passage describes Hova tomb construction, memorial stones, burial wrappings,
    funeral feasting, purification with consecrated water, mourning restrictions,
    severe mourning for a sovereign, the viainddika ceremony of turning and rewrapping
    corpses, and Betsileo cave burial practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hova tomb building is described as an important undertaking that calls together
    relatives, friends, and slaves, with five large slabs used for the vault walls
    and roof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stone slabs are outlined with lines of dried cow-dung set on fire, cooled
    with water to produce cracks, raised with levers, and dragged to the tomb site.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tomb construction is accompanied by feasting and rejoicing, including the
    killing of many oxen, and Hova tombs are positioned to attract attention.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Stone pillars or slabs are erected in Im^rina in memory of deceased relatives
    and are called Tsdngambdto or Fahatsiarbvana in the passage.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Hova wrap the dead in reddish-brown cloths and carry them to the tomb
    on a bier; a former Hova practice placed skulls of oxen killed at funerals on
    or around the tomb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After returning from a funeral, leading mourners wash themselves and purify
    their clothes using water associated with a silver coin and prayers to God; funeral
    participants receive afana, a sprinkling with the same holy water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mourning observances include dishevelled hair, clothing restrictions, unwashed
    or soiled clothing, forbidden dancing and singing, and a closing meal with purification
    by sprinkling.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'At the death of a sovereign, mourning is more severe: most people shave their
    heads, beds and chairs are not used, mirrors are turned to the wall, and most
    labour stops.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The viainddika ceremony involves visiting family tombs to turn corpses, described
    as preventing fatigue from remaining too long in one position, and includes feasting,
    music, and new wrappings.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: An example is given of a Hova woman of rank whose bones were moved between
    the tombs of two deceased husbands before being brought to a final resting place.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Betsileo burials are described as taking place in subterranean caves reached
    by a trench that is opened for each interment and filled again afterward.
  category: setting
  evidence_refs:
  - ev:12
