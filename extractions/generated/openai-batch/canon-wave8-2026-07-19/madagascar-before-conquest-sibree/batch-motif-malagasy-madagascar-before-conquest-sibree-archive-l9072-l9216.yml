  summary: The passage opens Chapter XL on Malagasy songs, poetry, children's games,
    and mythical creatures, then describes native songs called Hiran ny Ntaolo. It
    summarizes Malagasy musical practices, gives royal praise songs that address the
    sovereign with divinizing solar and light imagery, notes moral songs about friendship
    and parents, gives place-name punning examples, and introduces sasy dirges for
    the dead with mourners weeping at night.
