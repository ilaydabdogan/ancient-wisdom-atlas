  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The word translated as island is said to often mean raised ground standing
    among marshes and rice-fields, more or less surrounded by them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some village names in Imerina and Imamo contain province or district names
