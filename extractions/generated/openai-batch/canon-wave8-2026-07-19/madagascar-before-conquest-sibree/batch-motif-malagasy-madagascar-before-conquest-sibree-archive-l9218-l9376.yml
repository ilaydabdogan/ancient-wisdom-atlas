canonical_text:
  quote: The dead are termed 'lost' (very), lost as people who are left by their companions,
    and do not see the way to go home again.
  summary: The passage describes Malagasy funeral watching, including mourners in
    the house with the corpse, continuous singing and drumming until burial, dirges
    that call the dead lost and farewell the dead person's household and kin, and
    a call-and-response exchange about the deceased person's property. It then summarizes
    and excerpts a ballad about Benandro, an only son who insists on going to war,
    dies on the road, and has his bones brought back to his parents. The passage closes
    with a moral exhortation that the living should love one another because the dead
    can no longer be companions.
  language: English
  quote_policy: quoted
