  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hova children are described as varying from light olive to very dark brown
    skin tones and, among poorer village children, often having little clothing and
    appearing dirty or uncared for.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: On Sundays and special occasions some girls and boys are described as wearing
    print garments and clean white outer cloths, while on weekdays poorer children
    may wear only a small coarse hemp cloth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: During a ride to a village near Ambohimanga, children followed the narrator's
    party while they collected ferns in the hady; the narrator estimates the total
    value of clothing worn by seven or eight children at under one shilling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children's amusements include a game compared to fox and geese, spinning peg-tops,
    making clay figures of oxen and birds, and a rough kicking game called nimnely
    diamanga.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A favorite amusement is described as groups of Malagasy children sitting outdoors
