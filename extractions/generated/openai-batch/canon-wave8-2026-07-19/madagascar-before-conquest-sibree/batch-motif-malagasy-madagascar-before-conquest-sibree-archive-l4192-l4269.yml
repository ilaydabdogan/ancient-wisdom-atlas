  text: Ankaratra is described as a volcano of comparatively ancient date, with craters
    or cones apparently effaced by denudation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Streams descending from Ankaratra have cut deep valleys through basaltic lava
    beds and exposed underlying gneiss.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: About thirty or forty miles south of Ankaratra, roughly a dozen conical hills
    without craters are reported.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: One low conical knob west-south-west of Antananarivo is named Votovorona and
    is described as possibly the core of an old volcano.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Volcanic cones occur in Mandridrano, west of Lake Itasy, and near Betafo in
    Vakinankaratra; all are described as extinct, with no active volcanoes in Madagascar
    at the time of writing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The extinct volcanoes of Mandridrano extend about twenty miles north-south
    and three or four miles east-west, with cones clustered unevenly across the district.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some cones are described as formed by simultaneous ejection of scoriae from
    different vents along the same fissure, producing curvilinear summit ridges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kasige is described as a fresh-looking volcano with sloping sides, vegetation
    on disintegrated scoriae, and an unbreached funnel-shaped crater.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Many craters have one side higher than the other, usually on the north, north-west,
    or west, attributed to prevailing south-east trade winds during eruption.
  category: relationship
  evidence_refs:
  - ev:5
