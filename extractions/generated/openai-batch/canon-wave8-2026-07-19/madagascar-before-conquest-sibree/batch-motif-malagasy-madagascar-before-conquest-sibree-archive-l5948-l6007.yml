canonical_text:
  quote: '"the names they give to the natural features of the country"'
  summary: The passage surveys Malagasy regional and tribal place-names around Madagascar,
    glossing names by rocky terrain, hills, rivers, red earth, lakes and marshes,
    clearings, forests, sea-surf, bamboos, islanders, conquest, kingdoms, and estates.
    It concludes that a fuller treatment would need tribal names and that such names
    illuminate Malagasy thought and settlement.
  language: English
  quote_policy: quoted
