  text: Some eastern districts are described as named after principal towns or chief
    rivers, and their inhabitants are grouped under the name Betsimisaraka, glossed
    as "Many-unseparated."
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Betanimena is glossed as "Much-red-earth," and the marsh district around Lake
