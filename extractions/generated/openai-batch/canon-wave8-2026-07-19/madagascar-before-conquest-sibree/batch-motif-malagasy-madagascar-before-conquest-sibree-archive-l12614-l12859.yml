canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy calendrical divination: days of the month
    and week are assigned characters, auspicious or inauspicious uses, birth consequences,
    and ritual remedies. It also describes the mapping of month-name/day-name regions
    onto the Hova house, the role of vintana in ritual practice, and a san-andro system
    that links weekdays to the Seven Planets and to Arabic, Latin, and wider astrological
    naming traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the character of a day depended more on the moon-station
    represented than on the month-name from which the day took its name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two successive days could share a name while being judged differently; the
    first and second days of Asorotany are described as good, while the third is described
    as bad.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some named days are classified as absolutely bad, some as absolutely good,
    and some as indifferent.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some days are described as unsuitable in general but suitable for special
    purposes, including house-warming, marking out a town, or being born on.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a belief that children born on the second day of Adalo
    generally became dumb.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bad days are generally explained as having too strong a vintana, and children
    born on such days are described as a doubtful gift.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports former infanticide in the central provinces and continued
    practice in some places not reached by Christianity, in connection with children
    born under dangerous day-character.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A diviner could sometimes remedy the danger associated with a child's birth-day;
