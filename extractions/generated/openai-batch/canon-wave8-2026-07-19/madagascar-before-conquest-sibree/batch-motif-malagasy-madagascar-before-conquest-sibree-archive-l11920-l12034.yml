canonical_text:
  quote: ''
  summary: 'The passage explains how a Malagasy mpisikidy erects and works a sikidy
    divination diagram: initial columns are filled by random bean remainders, later
    columns are produced by parity combinations, and the completed arrangement is
    tested through the Andriamanitra column before being used to answer questions,
    indicate remedies, or proceed through named methods such as identical figures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a sikidy arrangement as columns filled with figures;
    the example diagram uses dots instead of beans or seeds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The column names are read from left to right, while names at the corners are
    read diagonally.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:3
  text: The mpisikidy fills the first four columns, Tale, Harena, Fahatelo, and Vohitra,
    by taking random handfuls of beans and removing them two by two until one or two
    remain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A remainder of two beans leads to two beans being placed in a square; a remainder
    of one leads to one bean being placed there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: One of the first four columns represents the person or thing about which the
    sikidy is made.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:6
  text: The remaining eight columns are filled by comparing pairs of already formed
    figures square by square; an odd total gives one bean in the new square, while
    an even total gives two beans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listed combination chain includes Tale with Harena forming Lalana, Fahatelo
    with Vohitra forming Asorotany, Lalana with Asorotany forming Mpanontany, and
    later combinations ending with Andriamanitra and Tale forming Trano.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the sikidy is erected, the passage says its ordinary function is to
    answer questions, though answers may also point to remedies, cures, or charms
    against evils.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first check after erection is the figure in the column named Andriamanitra;
    only eight specified figures are said to agree with Andriamanitra and are called
    Nobles or Kings.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a Slave figure appears in the Andriamanitra column, the sikidy is invalid,
    must be broken up, and must be begun again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The reason given for invalidation is that the sikidy has not done proper honour
    to God by putting a slave in His column and therefore cannot be expected to tell
    truth in His name.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: After validation, one of the first four columns is chosen to represent the
    question; Tale is assigned to matters not classed as property, relations, or village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Sikidy of Identical Figures, the practitioner identifies the figure
    in the question column and then examines the other relevant figures, excluding
    the other first-four columns.
  category: action
  evidence_refs:
  - ev:7
