  summary: The passage catalogues Malagasy mountain and hill place-names formed from
    words for stone, rock, forest, tree, plants, water, sand, and related natural
    features. It notes repeated naming patterns such as colour, size, shape, height,
    woodedness, dryness, springs, lakes, and streams. It also mentions that some solitary
    rock columns share the name Vatolahy, “Male-stone,” with memorial erected stones
    in Central Madagascar.
