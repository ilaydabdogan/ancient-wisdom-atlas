canonical_text:
  quote: ''
  summary: 'The passage concludes a fable in which personified body parts dispute
    seniority and the Belly is accepted as eldest because it thinks, observes, and
    receives nourishing food. An editorial note explains the Malagasy semantic range
    of the belly/internal organs and compares the fable with Aesop and St. Paul. The
    passage then gives the tale of a little antsaly bird: a man stones, catches, kills,
    cooks, and eats the speaking bird despite warnings; the bird speaks from inside
    his swelling stomach; its parent birds locate it, tear open the man''s belly,
    retrieve their child, return to the woods, and the man dies. The passage ends
    by introducing Rapeto as a fabulous figure associated with Ambohidrapeto.'
  language: English
  quote_policy: summarized
