  summary: 'The passage describes fossil and subfossil animal remains in Madagascar:
    extinct aquatic birds, hippopotamus bones with cut marks attributed to humans,
    giant tortoises, crocodiles including a fossil species and its refuge in Lake
    Alaotra, and Jurassic dinosaur remains. It also notes scientific comparisons between
    Madagascar and other island faunas.'
