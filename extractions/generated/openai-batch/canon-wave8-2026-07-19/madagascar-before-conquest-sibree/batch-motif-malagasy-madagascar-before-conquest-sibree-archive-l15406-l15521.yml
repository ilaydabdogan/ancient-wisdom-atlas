  quote: ''
  summary: The passage opens a chapter on Madagascar's fauna and flora. It describes
    Madagascar's extensive forests and varied geography, notes the unexpectedly quiet
    and apparently sparse animal life, contrasts the island's mammalian fauna with
    that of nearby Africa, mentions absent and introduced mammals, notes a formerly
    existing small hippopotamus, and cites zoological classification and Alfred R.
    Wallace's comparison of Madagascar's faunal relation to Africa with other island-mainland
    relations.
  language: English
  quote_policy: summarized
