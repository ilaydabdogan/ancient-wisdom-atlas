canonical_text:
  quote: ''
  summary: The passage describes Malagasy beliefs about dreams as signs of future
    events. It gives a seasonal verbal formula used to neutralize evil dreams, then
    lists dream omens interpreted by resemblance, by reversal, and by no obvious correspondence.
    Examples include dreams involving rivers, the dead, medicine, blood, the Sovereign,
    spoons, tombs, trees, crocodiles, fire, oxen, falling, dirty water, fog, mice,
    and loss of a wife. A footnote adds that Malagasy belief in life after death is
    strong and cites royal words about a spirit continuing after burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Malagasy people notice dreams, regard them as signs
    of what will happen, and consider ways to counteract evil forebodings from dreams.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'After an evil dream, a seasonal saying is used to console the heart: winter
    dreams are dismissed, summer dreams are carried away by streams, spring dreams
    are absorbed by dry soil, and autumn dreams are attributed to satiation after
    rice harvest.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says some dream omens are linked to outcomes by similarity, while
    others are linked by contradiction or reversal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dream of trying to cross a river but not getting over, and a dream of speaking
    with the dead while submitting to their call, are said to be followed by death;
    a sick person dreaming that the dead bring medicine is said to recover.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dreaming of blood is said to be followed by a fight; meeting the Sovereign
    is said to be followed by high position; losing a spoon is said to be followed
    by famine; buying a large spoon is said to be followed by a fruitful season.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In reversal examples, a dream of profitable trading is said to be followed
    by loss; eating with the dead or dreaming of a tomb is said to be followed by
    long life; dreams about finding or not finding a lost object are said to reverse
    the actual outcome.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Further reversal examples say that a green tree dream is followed by someone
    dying, a sick person appearing better in another person's dream is followed by
    long illness, crossing a crocodile-filled river is followed by prosperity, and
    a far traveler dreaming of returning home is followed by death on the road.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A footnote states that Malagasy people have a strong belief in life after
    death and cites royal sayings that flesh will be buried while spirit and mind
    remain and continue to whisper.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: In examples where the passage says no correspondence is apparent, dreaming
    of flying is followed by death; fishing is followed by calamity; a fight between
    red oxen or fire is followed by being conquered by enemies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Other listed dream omens say that red soil is followed by poverty, falling
    from a precipice or crossing dirty water is followed by illness, drinking brandy
    is followed by recovery, fog is followed by loss of oxen, and mice pursuing the
    dreamer is followed by someone taking away his wife.
  category: relationship
  evidence_refs:
  - ev:6
