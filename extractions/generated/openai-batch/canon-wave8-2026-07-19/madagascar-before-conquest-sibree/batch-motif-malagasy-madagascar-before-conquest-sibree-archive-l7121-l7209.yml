canonical_text:
  quote: The royal name has a kind of sanctity, and must not be taken in vain.
  summary: The passage describes Malagasy avoidance of words resembling chiefs’ or
    rulers’ names, especially among Sakalava and western tribes; reverence toward
    royal names, property, palaces, and seating precedence; and posthumous renaming
    and veneration of chiefs and ancestors in Sakalava and southern Malagasy populations.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Hova are described as practicing tabooing of words in chiefs’ names less
    extensively than other Malagasy tribes, partly because they had one sovereign
    rather than many petty chiefs or kings.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among western tribes, the presence of many petty but independent and absolute
    kings is said to produce much change in spoken language.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakalava chieftains are described as averse to any name or term approaching
    the sound of their own names or those of family members.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Rataratsa’s mother was named Ravahiny, the term vahiny was forbidden
    for other persons, and a substitute word was instituted for “stranger.”
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sovereign’s name is considered improper to use frequently or lightly in
    ordinary conversation, and Europeans doing so were asked to desist.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Royal property is treated with reverence: sitting or stepping on a box or
    case containing royal property is improper, and passers-by must yield and remove
    hats when the queen’s property passes.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other buildings should not be compared to royal palaces, firing a gun toward
