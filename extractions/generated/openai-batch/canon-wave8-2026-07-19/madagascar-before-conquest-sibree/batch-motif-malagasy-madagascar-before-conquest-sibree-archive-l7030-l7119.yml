canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy beliefs and customs concerning chiefs:
    their spoken blessings and curses are thought to have inherent sacred power; accused
    persons may undergo self-imprecating ordeals involving the chief’s hand or house;
    deceased chiefs are believed to become God and bless living subjects; graves of
    chiefs require oxen and supplication before clearing. It also describes chiefly
    name taboos that alter ordinary vocabulary, royal animal taboos among some Sakalava
    groups, and a belief that a serpent called fanany arises from the corpse-fluid
    of chiefs as an embodiment and protector.'
  language: English
  quote_policy: summarized
