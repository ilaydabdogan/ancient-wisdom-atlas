canonical_text:
  quote: ''
  summary: 'The passage describes Malagasy fady, or taboos, among the Sihanaka and
    other Malagasy groups: inherited family rules, village and place restrictions,
    taboos connected with sickness and medicine, and class-specific restrictions for
    nursing mothers and young women. It then introduces popular superstitions, especially
    good omens concerning food, in which a fallen morsel while eating predicts receiving
    another food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Use of hemp, whether as cloth or for smoking, is described as universally
    tabooed, and many Sihanaka rigidly abstain from pork, lard, and utensils previously
    used for pork, while still being allowed to eat wild boar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes universal fady, inherited family or clan fady, individual
    fady, place fady, circumstance fady, class fady, and medicine fady.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: Family or clan fady may prohibit taking things out of the house or sweeping
    mats on a certain weekday, selling eggs or inherited goods, eating certain foods,
    using tobacco, killing certain insects or birds, or using certain woods as fuel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Imerimandriso, water-pots with broken rims, freshly cut rushes not dried
    overnight, and a woman’s grass head-pad with a hole in it may not be taken into
    the town.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that carrying lard across Lake Alaotra is believed to ensure
    rough weather, and that pouring oil on the troubled water could be considered
    harmful because oil is related to lard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In sickness, people commonly abstain from chicken before taking medicine,
    and medicine may require abstinence from many other things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nursing mothers must avoid the flesh of calves not separated from their mothers,
    avoid a certain banana until the baby can pronounce its name, and avoid looking
    at a child’s corpse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Young women must refrain from eating rice on a certain day each year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Medicine fady may include prohibitions on foods, entry into the sick person’s
    house by persons wearing certain garments or with freshly plaited hair, answering
    someone outside the house, looking at sunrise or sunset, looking at red things,
    and lying down at sunset.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Traders from Imerina are said to have introduced new fady for foreign medicines,
    and the passage states that Sihanaka have little faith in a medicine without a
    fady attached to it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A recent fady mentioned in the passage says that a child may not accept a
    picture lest it be followed by European ghosts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage introduces Malagasy good omens as signs of expected prosperity,
    with many omens referring to food and riches.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: A sequence of food omens says that if a portion falls while eating one food,
    the eater will receive another food, progressing from sweet-potatoes and potatoes
    through manioc, maize, rice, beef, and honey.
  category: sequence
  evidence_refs:
  - ev:7
