canonical_text:
  quote: ''
  summary: The passage describes Tankarana funerary customs, including wrapping and
    exposing the dead, burning resins or perfumes, tightening bindings until the body
    is reduced to bones, placing remains in hollowed tree-trunk coffins, depositing
    coffins in isolated rocky or island locations with provisions, and renewing coffins.
    It also describes a specific coffin from Nosy Loapasana, notes its similarity
    to wooden sarcophagi from the Philippine Archipelago, and describes a distinct
    chiefly mortuary procedure involving mummification, aromatic herbs, hot sand,
    coffin anointing, and slaves anointing themselves with exuded liquid.
  language: English
  quote_policy: summarized
