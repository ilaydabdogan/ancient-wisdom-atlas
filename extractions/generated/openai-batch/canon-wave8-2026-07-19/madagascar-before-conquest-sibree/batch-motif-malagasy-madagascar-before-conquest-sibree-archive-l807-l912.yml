  summary: 'A travel account describes movement from the eastern approach toward Imerina:
    highland landscapes, village hospitality, rain and ascent, recognition at Andrangoloaka,
    a dangerous bridge crossing over deep water, and a visit to the ruined industrial
    works at Mantasoa. The passage also reports that Malagasy Christians were forced
    to labor there during persecution and later welcomed Radama II''s accession as
    a time of release.'
