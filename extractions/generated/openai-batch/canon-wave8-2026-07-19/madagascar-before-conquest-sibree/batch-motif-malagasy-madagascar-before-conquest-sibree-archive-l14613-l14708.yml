canonical_text:
  quote: ''
  summary: The passage describes Malagasy handicrafts and material culture, including
    bark cloth, metalwork, pottery and substitute vessels, horn and wooden utensils,
    vegetable-material building, canoes, plank boats, outriggers, and coastal navigation.
    It also records several authorial comparisons with Malayo-Polynesian, African,
    Anglo-Saxon, Samian, French, and Comoro contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bark cloth used for girdles is made by people of the south-east coast and
    forest tribes; the bark cloth of the Taimoro, Tanala, and other tribes is described
    as coarse, reddish-brown, and weak except along the fibre.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the use of bark cloth and the non-use of skins for
    clothing connect Malagasy groups with Malayo-Polynesian peoples and distinguish
    them from African tribes who use animal skins for dress.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Native smiths are described as skilled in gold and silver work, able to copy
    jewellery, and able to produce wrought iron, brass, and copper work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Hovas, iron smelting and working are said to have been known from
    remote antiquity, and double-piston bellows are used.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A tradition reports that the Vazimba, described as an aboriginal tribe displaced
    in the central province, did not know metal and used spears made of burnt clay
    and tough palm bark.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many tribes use vegetable substances, leaves, wooden dishes, pandanus leaves,
    banana leaves, travellers'-tree leaves, bamboo, straw, and rush as substitutes
    for plates, dishes, waterpots, or water vessels.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the central provinces, where clay is abundant and vegetable materials are
    scarcer, pottery is manufactured, including water vessels, dishes, plates, cooking
    pots, a New Year's beef-cooking vessel, and red water jars.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Horns of humped cattle are made into spoons, dishes, and plates, and tribes
    have distinctive wooden spoon patterns, sometimes decorated with burnt designs
    on the handles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Outside the central provinces, houses are described as built almost entirely
    of vegetable materials without metal fastenings, tied together with fibrous plants.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Native canoes are made from hollowed-out tree trunks, chiefly varongy, and
    some are described as forty feet long with about a three-foot beam.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the south-east coast, a plank-built boat called a sary is constructed without
    iron, tied with anivona palm fibre, plugged with hardwood tree-nails, caulked
    with bamboo strips, and able to carry fifty people or goods through heavy surf.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the west coast, canoes with outriggers and sails go to sea, and the passage
    reports former annual expeditions to the Comoro Islands involving hundreds of
    canoes and thousands of men.
  category: action
  evidence_refs:
  - ev:8
