  summary: 'The excerpt lists several Malagasy words and customs: noticing a bad smell,
    pinching the sole as a sign of wishing to share another person''s good fortune,
    throwing away an object connected with disease or calamity as a sign of wishing
    to be rid of it, drinking water mixed with dust from a royal tomb, and striking
    water with a spear while taking an oath to the sovereign as a symbol of allegiance.'
