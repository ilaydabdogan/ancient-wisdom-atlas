canonical_text:
  quote: ''
  summary: The passage explains that in sikidy divination a figure matching the inquiry
    may provide an answer only when it appears in a column whose name has a relevant
    conceptual connection. In the example, a ship expected by the inquirer is represented
    by the Harena/property column; the same figure in Trano/house gives no answer,
    while the same figure in Lalana/road indicates that the ship is on the way, though
    difficulties may still require attention.
  language: English
