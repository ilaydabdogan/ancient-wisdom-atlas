canonical_text:
  quote: '"the younger prince, who had received from God the handful of earth, should
    be her successor."'
  summary: 'The passage gives examples of Malagasy symbolic political actions: a Hova
    king argues superiority over a Betsileo chief through a symbolic measurement dispute,
    then sends back a beaded cloth cut and pierced as a warning that leads to submission.
    It then relates Queen Ranavalona I''s succession settlement through two covered
    vessels, one containing gems and ornaments and the other earth; the earth-bearing
    prince is declared successor. The passage next introduces Malagasy riddles and
    conundrums, giving examples whose answers include stars, hair, money scales, roof
    rafters, manioc, a public road, ashes and fire, rice, fern, horirika leaves, shadow,
    and water.'
  language: English
  quote_policy: quoted
