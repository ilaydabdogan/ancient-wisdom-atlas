canonical_text:
  quote: ''
  summary: The passage describes botanical collecting in Madagascar, local reactions
    to dried plant specimens, suspicions that the collector may be practicing sorcery,
    beliefs about rain-medicine, love-philters, disease-preventing physic, and paid
    herbal specialists who provide cures and protective charms. It also describes
    weather threats to collections and the extent and destruction of forests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Malagasy bearer may carry the collector's materials, and the passage says
    drying paper and leather straps may be appropriated; straps are said to be useful
    as belts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dried plant specimens are described as safe from pilfering because local people
    are puzzled by their possible use or value.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the collector changes sheets containing specimens in a hut, villagers
    stand around in a circle, gaze silently, and may laugh or whisper about the strange
    behavior of white men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Some people are said to think the collector is a kind of sorcerer because
    the dried plants have no obvious ordinary use: they cannot be eaten, made into
    broth, planted, or made into fresh bouquets or wreaths.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage imagines the dried plants as possible ingredients in a mysterious
    decoction that could supply rain-medicine, a love-philter, or disease-preventing
    physic.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that many native herbal practitioners prescribe for cure
    or prevention of disease and furnish charms against fire, tempest, locusts, lightning,
    leprosy, lunacy, ghosts, crocodiles, or witches, in return for payment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A more practical explanation attributed to more intelligent native observers
    is that dried leaves are intended as patterns for weaving.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Heavy showers may soak specimens and drying paper, and the collector may spend
    part of the night using a large fire to save the collection.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A large extent of Madagascar is described as covered with primeval forest,
