  summary: The passage describes Malagasy sikidy divination using beans or seeds represented
    by dots. It lists sixteen named figures, explains their construction from arrangements
    of ones and twos, and describes sixteen corresponding columns or “mothers” used
    in working the oracle. It also discusses Malagasy and Arabic-derived names connected
    with months, zodiac signs, moon-stations, and everyday categories used in the
    divinatory diagram.
