  summary: The passage introduces a chapter on the changing year in central Madagascar,
    especially around Antananarivo. It describes the practical division of the year
    into rainy and dry periods, the Malagasy naming of four seasons, the agricultural
    and natural signs attached to them, and the elevated landscape of Antananarivo
    and surrounding Imerina, including mountains, rice-plains, rivers, old hilltop
    trees, and remnants of forest.
