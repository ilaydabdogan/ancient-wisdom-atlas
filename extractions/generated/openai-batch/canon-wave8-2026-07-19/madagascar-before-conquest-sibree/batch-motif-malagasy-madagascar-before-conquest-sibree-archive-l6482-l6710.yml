canonical_text:
  quote: ''
  summary: 'The passage records Malagasy and Betsileo ideas and practices surrounding
    royalty and chiefly rank: a proverb compares the sovereign to sky and sun; Queen
    Rasoherina’s palace building is measured by her own fathom; Rajaonary reports
    that Betsileo chiefs, their houses, objects, bodily terms, life-cycle terms, and
    associated speech are set apart from ordinary use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Malagasy proverb says the sovereign is like the sky, which cannot be measured,
    and like the sun, which cannot be contended with.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Queen Rasoherina’s reign, a new royal house was erected in the palace
    yard at Antananarivo, as was customary when a new sovereign came to the throne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief dimensions of the royal house were based on the queen’s own refy
    or fathom, measured fingertip to fingertip with arms outstretched; the palace
    dimensions were multiples or fractions of that measure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rajaonary, a London Missionary Society College student from North Betsileo,
    reported that special words for chiefs were especially marked and numerous among
    the Betsileo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Betsileo people keep things relating to chiefs specially
    for them and do not mix them with what belongs to the mass of the people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A chief’s house is described as sacred or set apart; entry requires the chief’s
    leave or summons.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: After entering a chief’s house, a person must not go north of the hearth but
    must sit respectfully south of the hearth; a note identifies north of the hearth
    as the place of honour in a Malagasy house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A chief’s drinking-tin, spoons, plates, and similar objects are not to be
    handled casually or put to the lips; drinking from them requires water to be poured
    into the hand from above.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A chief’s bedstead may be used only by a chief, and the mat on which a chief
    sits must not be trodden on or used by others.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Objects in ordinary people’s houses can become reserved if the chief has used
    them, and people may keep their own drinking vessels untouched by lips in case
    the chief requires them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Special words are listed for children of chiefs, including terms for children,
    eating, dish, farewell, bearing offspring, death, and corpse.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Special words are listed for elderly chiefs, including substitutions for old
    age, adult man, adult woman, head, eye, ear, and hand.
  category: speech
  evidence_refs:
  - ev:10
