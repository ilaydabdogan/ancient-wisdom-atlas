canonical_text:
  quote: "“Awake, O God, to awaken the sun!”"
  summary: The passage describes Malagasy astrological and divinatory practice, especially
    the sikidy. A diviner manipulates beans or fano seeds and begins with an invocation
    that asks God, the sun, the cock, and mankind to awaken the sikidy so that it
    will tell the truth and reveal hidden things. The invocation also refers to the
    sikidy as costly, authoritative, and connected with Silamo, Arabs, high mountains,
    and other named authorities including the Vazimba. The author comments on Arabic
    and Islamic associations and on uncertainty about routes of transmission.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Malagasy chronology and astrology are described as depending on twenty-eight
    Moon-stations and involving the ancient Seven Planets, including the sun and moon.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Astrologers are described as counteracting influences of nature, bad spirits,
    bad men, and the evil eye, in addition to dealing with astrology and fate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sikidy is generally manipulated with beans or with seeds of the fano tree,
    a species of acacia.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before beginning, the mpisikidy places a heap of seeds or beans before him
    and opens with a solemn invocation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The invocation asks God to awaken the sun, the sun to awaken the cock, the
    cock to awaken mankind, and mankind to awaken the sikidy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sikidy is asked not to lie, deceive, play tricks, or speak nonsense, but
    to search secrets and see what human eyes cannot see.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The invocation says the sikidy comes from the long-haired Silamo, from high
    mountains, and from named authorities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The invocation says the sikidy was obtained at great cost, in exchange for
    a fat humped cow and clean money.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A capable sikidy is invited to awake on the mat, while a non-seeing sikidy
    that agrees indiscriminately and confuses dead and living is told not to arise
    there.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The author states that the sikidy was regarded as a means used by God to make
    his will known to humans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author connects the Silamo with Islam, chiefly Arabs, and also with Karany,
    described as Koran readers; Arabic words are said to occur in the invocation and
    sikidy terminology.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Vazimba are listed among the authorities from whom people were said to
    have received the sikidy, but the author treats the reason for their inclusion
    as uncertain.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Individual mpisikidy of repute are said to have had their own invocations
    or variations in wording, while preserving the same general bearing.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the invocation, the diviner begins to work or raise the sikidy by taking
    beans or fano seeds and arranging them on a mat on the floor.
  category: action
  evidence_refs:
  - ev:10
