canonical_text:
  quote: ''
  summary: The passage first gives examples of number wordplay, unlucky numbers, and
    counting rhymes. It then introduces Betsileo marvellous or bogey stories and describes
    the Songomby, a man-eating ox-sized creature associated with a den, night attacks,
    and child-punishment tales. It also describes the seven-headed Fanany, said to
    arise from human intestines or a corpse, especially from people of noble descent,
    and to receive ritual offerings of ox blood, rum, and ox-hump after being identified
    with a deceased noble.
  language: English
  quote_policy: summarized
