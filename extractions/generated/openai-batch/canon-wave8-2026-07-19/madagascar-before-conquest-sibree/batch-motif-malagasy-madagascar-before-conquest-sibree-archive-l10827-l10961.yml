canonical_text:
  quote: ''
  summary: 'The passage collects Malagasy etiological tales: an unnamed giant leaves
    marks in the landscape and dies after fetching the moon; the lost son of God prompts
    a cosmic search and divine commands that explain stones, trees, people, greetings,
    dog-barking, and moving waters; personified fingers explain hand anatomy; the
    earth’s failed attack on the sky explains uneven landforms and the separation
    of earth and heaven; and the birds’ treatment of the absent Owl explains its nocturnal
    habits.'
  language: English
  quote_policy: summarized
