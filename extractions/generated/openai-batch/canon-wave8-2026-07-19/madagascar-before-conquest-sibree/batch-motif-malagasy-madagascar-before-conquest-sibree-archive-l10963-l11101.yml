canonical_text:
  quote: ''
  summary: 'The passage gives several Malagasy animal and Vazimba folk explanations:
    a hawk fails to become king of the birds while the Railovy is chosen; the Sitry
    and Antsiantsy lizards are killed after visiting Rasoavolovoloina and become protected
    by an oath; a hawk curses its offspring to kill a hen’s young; a Vazimba under
    the water sends snake and kingfisher messengers and establishes offerings, honours,
    and taboos; people vow offerings at Vazimba graves; a chameleon and lizard quarrel
    and separate; and the beginning of a tale says a boa swallowed a frog.'
  language: English
  quote_policy: summarized
