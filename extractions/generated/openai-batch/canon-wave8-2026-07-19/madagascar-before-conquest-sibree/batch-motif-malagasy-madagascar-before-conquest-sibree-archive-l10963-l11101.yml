candidate_motifs:
- id: motif:1
  label: Animal kingship explanation
  taxonomy_refs:
  - royal_legitimacy
  basis: The birds reject a self-appointed Hawk and choose the Railovy as king, and
    the passage states this explains why people consider the Railovy king of the birds.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage concerns animal kingship
    rather than human royal descent or state legitimacy.
- id: motif:2
  label: Protected small animals with funerary treatment after killing
  taxonomy_refs: []
  basis: The Sitry and Antsiantsy are honoured, not killed by many people, and wrapped
    in silk if killed, with a reported sanction that killers die young.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No supplied taxonomy family exactly names animal taboo or funerary wrapping.
- id: motif:3
  label: Vengeance curse explaining predation
  taxonomy_refs: []
  basis: The Hawk curses her true offspring to kill the Hen’s young after the Hen
    kills the Hawk’s young, and the passage says this explains why hawks eat chickens
    but not hens.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an etiological animal tale, but no exact taxonomy reference is
    supplied for etiological predation.
