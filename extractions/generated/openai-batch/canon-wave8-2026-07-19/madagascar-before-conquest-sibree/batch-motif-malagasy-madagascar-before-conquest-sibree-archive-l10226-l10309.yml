canonical_text:
  quote: ''
  summary: 'The passage describes several Malagasy named creatures: a water-dwelling
    ox-like animal called Ldloinena or Ldlimena/Laloinena; a note on the Vily serpent
    and boa-like serpents; the Angalapona, a human-related water being living in a
    dry cave within water and associated with divination; accounts of two people who
    encountered Angalapona; and the Siona, a human-like wild creature associated with
    theft, fire-warming, lichen-covered camouflage, and feared transformation during
    illness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ldloinena or Ldlimena is described as like an ox, living in water, having
    two very red horns, and being among the strongest water animals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says accounts of the Ldloinena include much that is fabulous,
    and it notes a possible connection with remembered Madagascar hippopotamus remains
    called Laloinena by local people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note identifies Vily as the name of a serpent and describes boa-like serpents
    in Madagascar hanging from trees, pouncing on victims, and squeezing them to death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Angalapona is said to be related to humans, smaller than a human being,
    a little larger than a young child, and to have very long hair reaching nearly
    to the ground when it stands upright.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Angalapona is said to live in water in a cave into which water does not
    enter; its door or road turns in the water, and it passes through without getting
    wet.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Angalapona is considered the director of divination and fortunate-day
    foretelling, and diviners call upon it when working the oracle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Renisoarahanoro says an Angalapona came and took her toward its den through
    the water, and neither she nor the Angalapona was wetted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Renisoarahanoro would not enter the cave fully or eat the Angalapona’s food,
    such as raw eels and crayfish; after she stayed at the doorway, her clothes became
    covered with water-plants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Angalapona and his wife agreed to send Renisoarahanoro home after giving
    her power to work divination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rainitsimanahy says an Angalapona came while everyone was asleep and desired
    him to be its husband; when he refused, it followed him continually.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Siona is described as having something human about it, living away from
    people, and taking rice or a chopper from careless travelers in the uninhabited
