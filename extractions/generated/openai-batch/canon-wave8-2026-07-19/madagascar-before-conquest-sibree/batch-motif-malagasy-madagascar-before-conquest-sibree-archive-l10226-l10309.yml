  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Siona comes to warm itself at a fire left burning by sleeping woodmen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Siona eats a root called Avoko and other substances, and its body is covered
