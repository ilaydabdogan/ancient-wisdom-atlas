  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The New Year's festival is called Fandroana, or Bathing, and is said to preserve
    many older customs, though some have fallen into disuse.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: At dusk on 20 and 21 November, little bundles of dried grass are lit; these
