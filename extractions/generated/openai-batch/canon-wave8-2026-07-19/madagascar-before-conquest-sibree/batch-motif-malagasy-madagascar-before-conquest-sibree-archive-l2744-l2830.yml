canonical_text:
  quote: ''
  summary: The passage describes rainy-season lightning; the Malagasy lunar calendar
    and shifting New Year; the later fixing of New Year to Queen Ranavalona III's
    birthday; Arabic-derived weekday and month names linked to zodiacal terms, astrology,
    and sikidy divination; and the Fandroana New Year festival, including dusk fires,
    royal and household bathing or sprinkling, ox killing, meat gifts, feasting, visits
    to elders and superiors with presents and good wishes, and November rains that
    green the landscape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the rainy season, an evening storm may light a large portion of the
    sky with almost continuous lightning while no thunder is heard.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Malagasy months are described as lunar, making the year eleven days shorter
    than the solar year and causing New Year's Day to move through the months until
    a thirty-three-year cycle is nearly completed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Since the accession of Queen Ranavalona III in 1883, her birthday, 22 November,
    has been fixed as the invariable New Year's Day, while the old first day of Alahamady
    is still remembered by cannon fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Malagasy month and weekday names are Arabic in origin,
