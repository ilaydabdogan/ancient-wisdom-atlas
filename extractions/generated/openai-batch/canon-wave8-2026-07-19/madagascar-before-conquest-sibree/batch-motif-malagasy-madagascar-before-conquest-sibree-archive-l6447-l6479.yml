canonical_text:
  quote: ''
  summary: The passage lists special Malagasy terms used for royal servants, guards,
    couriers, attendants, messengers, and representatives. It also describes customs
    for handling accused or offending nobles, including binding royal and high noble
    offenders with cords rather than iron fetters, and marking the house of a high-status
    accused person with a silver-bladed spear engraved with the sovereign's name.
    The passage ends with a house-name used among Taim6ro chiefs for a house set apart
    for noble-born wives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says special words were applied to certain classes of royal servants
    or attendants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Royal cooks are called the “clean-handed ones,” with the explanation that
    the term describes what they should be.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some companies of royal guards were called the “sharp ones,” and government
    couriers in the provinces were called “little-kneed.”
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: A class of palace servants called tsimando or tsimandao are said to be in
    constant attendance on the sovereign, day and night, and the queen's messengers
    are chosen from them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The queen's representatives at distant places are called “eyes behind,” a
    word also used more generally for an agent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Royal family members and the next highest class of nobles who commit serious
    offences are bound with cords rather than put into iron fetters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a high-position subject is accused of crime, government officers carry
    a silver-bladed spear engraved with the sovereign's name and fix it in the ground
    opposite the accused person's door.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The spear is called Tsitialainga, “hater of lies,” and while it remains fixed,
    no inmate of the house can leave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Among Taim6ro chiefs, a house set apart for noble-born wives is called Fenovbla,
