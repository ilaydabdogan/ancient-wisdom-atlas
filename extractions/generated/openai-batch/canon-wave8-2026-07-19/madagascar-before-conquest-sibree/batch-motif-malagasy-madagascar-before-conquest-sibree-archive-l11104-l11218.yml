canonical_text:
  quote: ''
  summary: The passage contains the end of an animal fable explaining serpent traits
    and pursuit of frogs, a fable in which Rice refuses friendship with Sugar-cane
    because Sugar-cane eventually changes into sugar and rum, and the beginning of
    an Ikotofetsy and Imahaka trickster tale involving a false idol, predicted rain,
    flooding, and a serpent wrapped in scarlet cloth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A serpent answers a frog’s questions about its appearance, saying its feet
    have been worn off by pursuing frogs, its eyes stand out from watching them, and
    its speckled skin is because it is full of the frog’s father.
  category: speech
  evidence_refs:
  - ev:1
