  text: The frog becomes angry and curses the serpent; the passage states this is
    why the frog is hotly pursued by serpents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sugar-cane approaches Rice seeking friendship and kinship, arguing that both
    come from the ground, share similar conditions, and even have similar names.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rice refuses the proposed friendship, warning that agreement without thought
    is bad and that companions are associated with one another’s qualities.
  category: speech
  evidence_refs:
  - ev:3
