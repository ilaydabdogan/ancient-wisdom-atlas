canonical_text:
  quote: ''
  summary: The passage describes a Malagasy naming custom, said to be shared with
    Polynesian peoples, in which words or word-particles forming part of chiefs' names
    are tabooed. Because personal names contain common words, animal and plant names,
    and other ordinary terms, familiar object names, action words, and geographical
    names may be changed. Mr. Hastie is cited as a source from the court of Radama
    I.
  language: English
