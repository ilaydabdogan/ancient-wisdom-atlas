  text: The author states that several language groups have classes of words used
    when speaking of sovereigns or chiefs, including their persons, actions, surroundings,
    and honors in life and after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Imerina, specialized words are used for the sovereign; these are often
    common words that receive a special meaning when applied to the ruler.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: One term for a sovereign is explained literally as “golden gun,” and another
    term means “first.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of the royal family are termed with a phrase glossed as “the liver”
    or “inside” of the sovereign or chief.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among some tribes, chiefs are termed “water channels,” through whom benefits
