  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Malagasy king or queen is not said to be ill, but “rather warm,” and is
    not said to die, but to “retire” or “turn the back.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In places outside Imerina, a word meaning bent, broken, or weakened is used
    for a deceased chief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead body of a sovereign is not called a corpse but “the sacred thing,”
