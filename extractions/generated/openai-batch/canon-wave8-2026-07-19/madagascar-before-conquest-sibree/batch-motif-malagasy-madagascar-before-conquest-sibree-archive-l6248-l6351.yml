canonical_text:
  quote: ''
  summary: The passage describes specialized Malagasy royal and chiefly vocabulary,
    especially in Imerina, including titles for the sovereign, euphemisms for royal
    illness and death, sacred terminology for the royal corpse and tomb, and language
    presenting rulers as divinely hedged or formerly as a visible God. It also notes
    analogous chiefly terms among other Malagasy groups.
  language: English
  quote_policy: summarized
