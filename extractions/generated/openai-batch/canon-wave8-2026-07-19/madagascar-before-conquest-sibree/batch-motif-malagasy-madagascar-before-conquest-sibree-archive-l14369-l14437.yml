  quote: ''
  summary: The passage describes Betsileo and Tanala-area carved house ornamentation,
    including carved center posts, shutters, bedstead woodwork, doors, and portable
    objects. It also describes carved memorial posts named teza or tezan-kazo, one
    example bearing a wooden stage near the top and about thirty ox skulls and horns.
    Reported designs include sun-like radial forms, circles, zigzags, scrolls, geometric
    sections, and carved or rough imitations of men, oxen, birds, bullocks, and crocodiles.
  language: English
