canonical_text:
  quote: ''
  summary: The passage continues a tale in which Ifara creates an impassable precipice,
    defeats Itrimobe by making him fall onto his spear, seeks help from birds, is
    carried by a Kio/Reo bird to a tree above her parents' well, and is recognized
    after a slave girl mistakes Ifara's reflection for her own. It then begins a fable
    in which personified body parts dispute seniority.
  language: English
  quote_policy: summarized
