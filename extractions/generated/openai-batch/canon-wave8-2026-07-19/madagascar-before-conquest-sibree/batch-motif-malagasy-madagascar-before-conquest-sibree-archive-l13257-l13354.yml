comparison_claims:
- id: claim:1
  claim: The passage itself presents a parallel between Malagasy belief in chiefs'
    souls transmigrating into animals and a Samoan practice of seeking the departed
    soul in a tangible transmigrated form.
  claim_level: same_motif
  target: Samoan practice described by Rev. Dr. Turner in which a porpoise or small
    creature may be treated as the departed spirit
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not claim historical contact or common origin; the
    Malagasy side is summarized briefly, while the detailed ritual procedure is Samoan
    and concerns unburied dead rather than specifically chiefs.
- id: claim:2
  claim: A note reports visual similarity between crocodile carvings on Malagasy funeral
    memorials and crocodile carvings on a coffin lid from Marinduque in the Philippine
    Islands.
  claim_level: visual_similarity
  target: Marinduque, Philippine Islands coffin lid with crocodile carvings on a funeral
    object
  evidence_refs:
  - ev:2
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is based on a reported museum object and visual resemblance;
    the passage does not establish shared function beyond funeral memorial context,
    nor any historical connection.
