canonical_text:
  quote: ''
  summary: The passage describes Malagasy funerary customs among several groups, including
    beliefs about transmigrated souls, bringing dead to former homelands, stone-covered
    tombs, carved memorial posts, corpse wrapping and bier use, Sakalava mourning
    and burial practices, taboos around the deceased's house, prayers to ancestral
    spirits, and a public confession before death. It also reports comparisons to
    Samoan soul-transmigration practice and to crocodile imagery on a Philippine coffin
    lid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there is a Malagasy belief in the transmigration of
    the souls of chiefs into some animal.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the cited Samoan practice, a group tries to obtain the departed person's
    soul in a tangible transmigrated form; the first creature or object to land on
    a spread cloth is treated as the spirit and buried ceremonially.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Tanôsy described in the passage bring their dead back to the land where
    they formerly lived, wait until the bones are divested of flesh, and place coffins
    under an oblong heap of stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some Tanôsy families erect wooden posts or pillars near villages in remembrance
    of the dead, with human, bird, and animal carvings, especially crocodiles, plus
    white cloth and ox skulls and horns.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tandroy and Mahafaly wrap the dead in several lambas, carry them to the
    cemetery on a wooden and leather handbarrow or bed, cover the corpse with earth,
    and construct an oblong heap of stones over it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sakalava bring the dead out of the house immediately after death, wrap
    the body in many lambas of even number, and place it on a six-foot stage with
    the head toward the east.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Sakalava staging of the corpse, a cloth is thrown over the body, articles
    are placed on it, a fire is lit under the foot of the corpse, and incense is burnt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During Sakalava mourning, women occupy the north-east side of the stage, men
    the south and south-east, visitors bring small presents, and women begin a repeated
    sequence of weeping and sobbing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sakalava talatala stage is later destroyed, and its pieces are thrown
    into water in an uninhabited place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Sakalava corpse is carried on a kibany bier and placed on its back in
    a coffin made from a hollowed-out tree trunk with a larger hollowed trunk cover
    and a drainage opening.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Sakalava coffin is laid in a trench with objects belonging to the deceased,
    covered with earth, and marked by an east-west oblong heap of stones and a white
    cloth flag on a pole at the head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some Sakalava families, especially the Veronieka family named in the passage,
    do not use a coffin and instead wrap the dead in a large mat and cover them with
    stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Sakalava house of the deceased is abandoned and left to ruin, and using
    its materials is said to bring severe punishment, sometimes death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Sakalava offer prayers to the lolo spirits of relatives at the deceased's
    ruined house rather than at the burial-place, which they dread.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Just before death, the Sakalava are said to make public confession before
    their family of crimes and principal ill deeds committed during life.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: A note compares crocodile carvings on Malagasy funeral memorials with crocodile
    carvings on a coffin lid from Marinduque in the Philippine Islands.
  category: other
  evidence_refs:
  - ev:10
