canonical_text:
  quote: ''
  summary: The passage describes the Malagasy children's game Petapetaka Inenibe,
    in which one child is treated as a dead grandmother, covered, lamented, represented
    as appearing in dreams, and then revived amid rejoicing. It also describes children's
    customs at the Fandroana or new-year Bathing festival, including clean dress,
    fruit, water, polite speeches, feasting, singing, and dancing. The passage ends
    with examples of counting songs and ditties using number-word play or numbered
    objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A children's game called Petapetaka Inenibe begins with children choosing
    one participant and declaring her to be a dead granny figure associated with being
    dead or extinguished by day and living or lighted by night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chosen granny figure is placed in the middle of the group and covered
    with a quantity of clothes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other children pretend to weep and sing a lament calling on granny to
    wake and come back because the children are miserable and starving.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children then keep quiet for a period called night, during which the old
    lady is to appear to them in dreams or inspire them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The player called the dead old lady softly speaks to the children, telling
    them to cross over and saying that she will rise up after the return of Sunday.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the waiting period, the children say that granny appeared to them and
    will be alive again; granny gets up, and the children pat her, rejoice, dance,
    beat their breasts, sing, and hum loudly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the Fandroana or Bathing festival at the new year, children in Antananarivo
    assemble in large numbers, wear clean clothes and ornaments, and carry fruit and
    small vessels while singing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the festival gathering places, children set fruit on plates, fill glasses
    with water, exchange formal polite speeches and blessings, eat, sing, and dance;
    country children have a related custom with meat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some songs and ditties are used to help children learn to count, including
    songs that use puns on number words or apply numbers to objects.
  category: speech
  evidence_refs:
  - ev:8
