canonical_text:
  quote: ''
  summary: 'The passage describes a Malagasy royal funeral: the king''s corpse is
    moved in a wooden coffin, mourners and royal women lament, a large mound-tomb
    and chamber are prepared, a silver coffin and many treasures are placed in the
    tomb, animals are killed, and the body is transferred into the silver coffin.'
  language: English
  quote_policy: summarized
