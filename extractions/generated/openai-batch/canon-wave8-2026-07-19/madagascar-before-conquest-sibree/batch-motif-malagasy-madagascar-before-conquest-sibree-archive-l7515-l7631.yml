candidate_motifs:
- id: motif:1
  label: Animal sacrifice in rite and royal practice
  taxonomy_refs:
  - sacrifice
  basis: Bulls or oxen are killed in circumcision and fanany rites, and the passage
    also reports human sacrifices used instead of oxen by certain royal tribes.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:12
  confidence: high
  cautions: The passage reports multiple customs from different groups rather than
    one unified ritual system.
- id: motif:2
  label: Sacred or royal bovine status
  taxonomy_refs: []
  basis: The ox term is linked with chiefship, the bull is called sacred among Sakalava,
    and a queen’s fighting bull was carefully wrapped in red cloth after death.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports sacred and status associations but does not describe
    a single narrative episode.
- id: motif:3
  label: Animal taboo and illness omen
  taxonomy_refs: []
  basis: The Zafy Raminia meat rule, Sihanaka disease omens from animal sightings,
    and taboo hare-lipped cow and rabbits all connect animals with restrictions or
    feared harm.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: These are local custom reports and omen beliefs, not a continuous mythic
    plot.
- id: motif:4
  label: Rain-making or rain omen at a royal burial-place
  taxonomy_refs: []
  basis: At Analavory, shouting at the burial-place of extinct kings is said to bring
    rain, alongside the annual cattle story.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives a brief report without ritual details beyond shouting.
- id: motif:5
  label: Earthquake explained by animal movement
  taxonomy_refs: []
  basis: Hova sayings interpret earthquake shocks as whales turning over or bathing
    their children.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives sayings rather than an extended cosmogonic explanation.
- id: motif:6
  label: Post-mortem noble life embodied in a serpent-like creature
  taxonomy_refs:
  - serpent
  - death_rebirth
  basis: The passage describes noble spirits or the life of princes as entering or
    producing the fanany, a creature described as lizard, worm, serpent, or snake-like.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The exact animal identity is explicitly disputed in the passage; the death_rebirth
    reference is functional and should be reviewed.
- id: motif:7
  label: Transformation into snake or lizard after death
  taxonomy_refs:
  - shapeshifter
  - serpent
  basis: The creature from the dead body is said to be placed in water and later to
    change into a snake, lizard, or intermediate animal.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage attributes this to belief and notes disagreement about the
    creature’s form.
- id: motif:8
  label: Immortal regenerative sacred reptile
  taxonomy_refs:
  - serpent
  basis: The fanany is said never to die, to regrow its head or missing part if cut,
    and to bring death to anyone injuring it.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The serpent taxonomy is based on one of several descriptions of the fanany
    as serpent or snake-like.
