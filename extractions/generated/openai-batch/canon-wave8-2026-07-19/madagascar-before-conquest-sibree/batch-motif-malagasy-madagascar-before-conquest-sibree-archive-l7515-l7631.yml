canonical_text:
  quote: ''
  summary: 'The passage collects Malagasy animal-related customs and beliefs: ox and
    cattle ritual practices, food taboos, animal omens, whale explanations of earthquakes,
    and Betsileo beliefs about the fanany, a revered serpent- or lizard-like being
    associated with the post-mortem life of nobles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Sakalava of Menabe, red oxen are seldom killed for food, and at
    circumcision festivals a bull is killed while the child sits on the animal during
    an invocation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Maroseranana and Andrevola royal tribes are reported to have sometimes
    used human sacrifices instead of ox sacrifices.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Zafy Raminia will not eat flesh unless the animal has been killed by a
    member of their own tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Analavory, described as a burial-place of extinct kings, cattle are said
    to gather yearly at the New Year festival; fat cattle die, lean cattle follow
    an ancient cow away and return the next year, and shouting there is said to bring
    rain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The word for ox is reported as equivalent to “chief” or “head,” the bull is
    said to be sacred among the Sakalava, and remains of a former queen’s fighting
    bull were found wrapped in a red lamba.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Sihanaka, seeing a large black moth called kakabomaso or a bird
    called vorondreo is believed to bring an attack of disease.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A hare-lipped cow and two rabbits owned by a native evangelist were considered
    taboo by local Sihanaka people, who feared sickness and calamity if the animals
    remained.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among the Hovas, earthquake shocks were explained by sayings that whales were
    turning over or bathing their children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Betsileo are described as believing that spirits of noble persons enter
    a creature called fanany or fandny, variously described as a lizard, worm, or
    serpent and treated with reverence.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fanany is said to result from the life of princes, to appear from fluid
    from a corpse bound to a house post, and to be carried to nearby water, which
    then becomes taboo.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The creature placed in the water is said not to be killed but to change into
    a snake, lizard, or intermediate reptile-like animal; local authorities differ
    about its exact form.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: When such a creature is found, district chiefs question it until head movement
    is treated as assent; it is coaxed onto a clean cloth, an ox is killed, blood
    is set before it, a feast follows, and it is returned to the taboo water.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The fanany is said never to die, to regenerate if decapitated or cut in halves,
    and to cause the death of anyone who injures it; the passage adds that the belief
    is dying out amid confusion about the animal’s identity.
  category: attribute
  evidence_refs:
  - ev:13
