canonical_text:
  quote: ''
  summary: The passage describes Malagasy sikidy divination rules in which particular
    figures and columns indicate outcomes, remedies, charms, substitutes, directions
    for seeking lost things, and days on which expected events may occur. It lists
    examples involving beans, rice, reeds, herbs, trees, a white hen, milk, pumpkin
    shells, children, house directions, months, constellations, and weekday combinations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several named or numbered sikidy figures are assigned practical results or
    prescriptions, including unobstructed action, disposal of a rice-filled cooking
    pot, good luck from discarding a reed with beans applied, and a charm against
    gun-shot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a sickness-related prescription, beans from figure 13 are mixed with a
    named herb; the sick person licks the mixture six times, after which it is put
    on the top of the person's head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Some prescriptions involve faditra: six beans on rice-husks are thrown away,
    a named tree may serve as the faditra, and a white hen together with a named tree
    may serve as the faditra.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Unique figures in other columns are said generally to suggest answers to questions
    and often to give remedies against evils indicated by the answer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A sterility remedy is described for the figure Saka in the column Trano:
    five beans are mixed with milk, placed in fourteen pumpkin-shell fragments, given
    to fourteen children, and linked to rice placed in a pot from which the sterile
    woman eats.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage names related kinds of sikidy called 'Sikidy mutually corresponding'
    and 'Sikidy providing a substitutory sacrifice.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Combined-figure sikidy obtains further combinations from figures in columns
    by strict rules, with eighty-one new columns providing material for new answers
    to questions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Miscellaneous sikidy practices are described as chiefly aimed at remedying
    evils, procuring prophylactics, or finding times and directions for locating or
    timing something.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage lists charms for gun-shot, trade, love, vomiting, dislike to food,
    food containing a ghost, and bringing back a semi-departed spirit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Andron-tany is described as a method for finding the direction in which to
    seek something lost, stolen, or strayed, based on a figure occurring in a certain
    column.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old native houses are described as running north-south with a single door
    and window on the west side; twelve month names are assigned to twelve compass
    points or places in the house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Andro fotsy, or 'white days,' uses combinations in certain columns to determine
    the day of the week when something sought or expected will occur; the example
    gives Harena and Fahasivy as indicating Wednesday.
  category: sequence
  evidence_refs:
  - ev:6
