  text: Several afternoon and evening expressions mark time by rice-pounding places,
    house-posts, calf-tying places, animal pens, cattle returning, sunset, fowls coming
    in, rice cooking, eating, sleeping, gun-fire, and midnight.
  category: sequence
  evidence_refs:
  - ev:7
