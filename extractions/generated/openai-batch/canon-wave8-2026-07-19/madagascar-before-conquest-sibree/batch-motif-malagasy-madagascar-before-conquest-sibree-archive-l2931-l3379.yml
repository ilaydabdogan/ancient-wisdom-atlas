  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Imerina, the longest and shortest days differ by about two hours, and twilight
    lasts about fifteen to twenty minutes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says clocks and watches were recent introductions and that the
    Malagasy had many native expressions for divisions of day and night, used approximately
