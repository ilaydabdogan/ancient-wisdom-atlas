  summary: The passage describes Christmas hymns, outdoor services, and congregational
    feasts in Imerina; then explains local seasonal daylight conditions and lists
    Malagasy expressions for times of day and night, many tied to animal sounds, light,
    household tasks, cattle movements, and domestic routines.
