canonical_text:
  quote: ''
  summary: The passage presents Siya'ka's dream narrative and related songs. After
    standing all night, the dreamer sees a bright light from the east that appears
    as a man with a tomahawk; the man tells him to follow and becomes a crow. The
    crow leads him to a village and large chief-like tent, where a red-painted young
    man welcomes him, says animals and birds are his friends, and shows him insects
    and birds. The young man becomes an owl and the escort is again a crow; a Crow
    and Owl song follows. Later the owl instructs the dreamer to look west when petitioning
    for long life, then becomes an elk with elk medicine and a hoop at his feet, and
    teaches another song about standing westward where the wind blows and roars. A
    bracketed source note separately compares striped buffalo skulls in several ceremonies.
  language: English
  quote_policy: summarized
