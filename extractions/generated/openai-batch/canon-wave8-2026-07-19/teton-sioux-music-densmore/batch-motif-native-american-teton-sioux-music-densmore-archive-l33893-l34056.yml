canonical_text:
  quote: ''
  summary: The passage gives the context, text, and analysis of a Sitting Bull song.
    It reports that in 1889 the Sioux were camped at Standing Rock Reservation to
    consider ceding land, and that Sitting Bull rode around the camp circle before
    sunset on his horse singing the song. The song text says that the tribe named
    the speaker and that he will live in courage. The passage then analyzes musical
    traits of the song and of Chief songs, including tonic emphasis, melodic descent,
    and a striking ascent in a Sitting Bull song associated with the land-cession
    gathering.
  language: English
  quote_policy: summarized
