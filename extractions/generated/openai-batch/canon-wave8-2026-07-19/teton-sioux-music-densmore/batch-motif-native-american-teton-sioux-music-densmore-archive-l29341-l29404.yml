  summary: The passage presents song no. 167, titled “They Deserted Their Leader,”
    sung by Eagle Shield, with a gloss indicating Crow Indians came attacking and
    their leader was left behind. It then gives musical analysis and a narrative note
    about eight of Eagle Shield’s companions carrying a wounded man on a pole litter,
    traveling toward home, crossing the Missouri River, camping, killing a buffalo,
    and obtaining food from the country through which the war party passed.
