canonical_text:
  quote: ''
  summary: The passage gives musical analysis, Siya'ka's comments on a hilltop dream
    and its animal helpers, and a tradition related by Two Shields in which a war
    party encounters an old wolf whose song becomes the beginning of Sioux wolf songs
    or war songs. It also reports beliefs about wolf-skin medicine bags coming to
    life and singing the first wolf song.
  language: English with Lakota song words and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Siya'ka says the hilltop where he had his dream was far from camp; friends
    sent a man with his horse, and he returned home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning from the dream site, Siya'ka took a sweat bath and told the
    dream to a medicine-man in a lodge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Siya'ka describes himself as then a young man eager to go on the warpath;
    after the dream, he regarded the east as his stronghold and the west also as a
    source of help.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Siya'ka says the birds, insects, and elk seen or considered in relation to
    the dream were helpers whose ways he should learn or follow.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Siya'ka notes that birds and insects return with the season and with the same
    colorings, and he says his mind must be the same.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Siya'ka states that he never killed an elk or ate elk flesh, would not kill
    birds that continually fly in the air, and would only kill water birds or grass
    birds if suitable for food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two Shields related a tribal tradition described as a dream and sang a song
    said to have been received in that dream.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A war party heard what they believed was a young man singing as he approached,
    but when the singer came nearer they saw that he was an old wolf with no teeth
    and no brush on his tail.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The old wolf could scarcely move and lay beside the war party's fire; the
    party cut up and fed him their best buffalo meat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After feeding the wolf, the war party learned his song, which is presented
    as the beginning of all wolf songs or war songs, and warriors began carrying wolf-skin
    medicine bags.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Looking Elk and others said that wolf-skin medicine bags carried by warriors
    had been known to come to life, walk about camp, and sing the first wolf song
    of the Sioux.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The glossed song text repeatedly states that by supernatural power the singer
    made it walk and refers to a wolf nation.
  category: speech
  evidence_refs:
  - ev:10
