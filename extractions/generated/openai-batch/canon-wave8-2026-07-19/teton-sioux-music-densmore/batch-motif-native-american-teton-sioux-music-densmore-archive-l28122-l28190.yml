canonical_text:
  quote: ''
  summary: A first-person account describes a Sioux war party moving toward a Crow
    village in winter, caching food in trees, stealing horses, fleeing pursuit, using
    a ravine and ridge for defense, deceiving the pursuers into thinking the party
    is larger, and returning home with the herd. A final ethnographic note states
    that a returning war party might send a man ahead to give a false casualty report
    to the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party received food, ate while keeping blankets tied down, and waited
    only to put on dry moccasins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As they traveled toward the Crow village, they hung food in trees so it would
    be available on their return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: They saw their tracks in the snow, reached sight of the Crow village at daybreak,
    stayed on a butte during the day, and later moved by a creek to a second butte
    overlooking the Crow camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before entering the Crow camp area, they tied fresh moccasins firmly, tightened
    belts, and arranged buffalo-hair lariats for quick use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator warned not to take too many horses because a wide track in the
    snow would make pursuit easier, and said the first to reach the food cache should
    wait for the others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: In deep snow, the party secured twenty-one horses; the narrator had six horses,
    his companion rode one and led four, and a mule followed and joined them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mules are described as highly valued by the Sioux, and the narrator claimed
    the mule that joined the party.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the meeting place, two absent men later appeared and warned that the Crow
    camp was excited, that the party had been seen, and that Crow riders were mounting
    horses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The party started at once, with four men ahead and the rest driving the herd;
    they traveled through intense cold all night, made a fire the next morning, and
    put on dry moccasins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A lookout reported on the second night that the Crows were following directly
    on the trail.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator told his companions they were not cowards and directed them to
    take the horses into a rough prairie ravine with rocks at its end.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: On a moonlit night, the party placed the horses in the ravine, heard many
    Crow voices, and prepared with guns and bullets.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The narrator instructed the men to crawl onto the ridge, lie flat in a widely
    spaced line, and be ready to fire when the Crows came into range.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Crows followed the horses' tracks; when they came near, the Sioux party
    sprang up, yelled, and fired, after which the Crows turned and ran, leaving one
    dead man and one horse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The party fired from above the Crows' heads and remained out of sight so that
    the Crows could not tell where to shoot and might think the Sioux group was larger
    than it was.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: One of the Sioux men periodically went toward the Crows and shouted a challenge
    to come and fight; the passage includes a cross-reference to song No. 157.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: After scouts reported that the Crows had given up and gone away, the party
    rode quickly across the prairie and camped three nights before reaching home with
    the horses.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: A final note says the Sioux sometimes sent a man ahead of a returning war
    party to give a false report, such as claiming that all except himself had been
    killed, causing wailing in the village.
  category: action
  evidence_refs:
  - ev:11
