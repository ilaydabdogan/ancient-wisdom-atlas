canonical_text:
  quote: ''
  summary: The passage describes Sioux children's songs and plays, a lullaby, and
    a song connected with the legend of a maiden who leaps from a rock or cliff after
    her promised husband is reported killed in war. It also notes an eastern Sioux/Lake
    Pepin version and a Teton Sioux version from Standing Rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little girls stand one behind another with hands on the shoulders of the girl
    in front, go around the village in a wavering line, and sing a song meaning that
    deer follow each other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The analysis of Song 216(a) says its first part is sung once like an introduction
    and its last section is repeated four times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another play, little girls sit in a circle; each puts one hand over the
    hand of the girl next to her and lightly pinches near the wrist.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The tickling sensation in the circle play causes the girls to fall over laughing;
    the play resumes almost immediately and the song is interrupted before it is half
    finished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The free translation of the words of Song 216(b) is, “I catch but can not
    hold you.”
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the following song was said to be the only lullaby used among
    the Sioux; its glossed words include commands to be still and sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The lullaby analysis explicitly compares the Sioux lullaby with a Chippewa
    lullaby said to be in a major key.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports a legend of a maiden who kills herself by leaping from
    a rock, and says the writer first recorded a related story and song among the
    eastern Sioux at Sisseton.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eastern Sioux account is associated with Lake Pepin and a promontory known
    as Maiden Rock, where tradition says a Sioux maiden leaped and was killed on the
    rocks below.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Teton Sioux version, a young woman has promised to marry a man who
    goes on the warpath to distinguish himself; the returning war party reports that
    he has been killed by the Crows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Later, when a camp is made at the place where the man was reported killed,
    the maiden dresses in her best attire, goes to the cliff edge, sings, gives the
    woman's tremolo, and jumps into the river below.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Song 218, the Song of the Maiden's Leap, is attributed in performance to Used-as-a-Shield.
  category: speech
  evidence_refs:
  - ev:10
