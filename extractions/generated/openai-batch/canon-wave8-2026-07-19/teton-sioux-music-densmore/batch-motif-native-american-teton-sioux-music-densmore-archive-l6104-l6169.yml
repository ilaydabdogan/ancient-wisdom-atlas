canonical_text:
  quote: ''
  summary: A Maiden sent by the Buffalo tribe appears to two young men, gives instructions
    for preparing a special lodge and ceremonial objects, punishes one young man after
    impure thoughts by means of a cloud that leaves him as a skeleton, sends the other
    back to report, and later arrives at sunrise carrying a pipe to be received by
    the chief and seated at the place of honor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A solitary object appears from the west, approaches rapidly, and is first
    difficult for the two young men to identify.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The approaching figure is identified as a beautiful young maiden wearing fringed
    buckskin clothing, leggings, moccasins, loose hair with a tuft of shedded buffalo
    hair, a sage fan, and red vertical face paint.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Maiden says she is sent by the Buffalo tribe to visit the people represented
    by the young men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Maiden instructs the young men to tell the chief and headmen to build
    a special lodge in the middle of the camp circle, oriented toward the direction
    where the sun rolls off the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The Maiden specifies ceremonial arrangements: sage at the place of honor,
    a small square place behind the fireplace, a frame or rack behind the sage, and
    a buffalo skull in front of the rack.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Maiden says she has something important to present to the tribe that will
    affect their future welfare and that she will be in camp about sunrise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: While the Maiden speaks, one young man has impure thoughts; a cloud descends,
    envelops him, and when it leaves he remains as a skeleton.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Maiden commands the other young man to face the camp, start home, and
    not look back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the surviving young man nears the camp he runs in a zigzag course as
    a return signal, and the camp prepares to escort and receive the party.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: An old man qualified to perform the ceremony kneels to receive the expedition
    report, with a row of old men kneeling behind him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The special lodge is made, requirements are carried out, a crier announces
    the next morning’s event, and men, women, and children assemble around the lodge
    at daybreak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Young men described as having unblemished characters are chosen to escort
    the Maiden into camp.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: At sunrise the Maiden appears dressed as before, but she carries a pipe with
    the stem in her right hand and the bowl in her left.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: The chief, authorized to receive the guest on behalf of the Sioux tribe, sits
    before the lodge door, makes room for the Maiden to enter, and she sits at the
    place of honor.
  category: action
  evidence_refs:
  - ev:6
