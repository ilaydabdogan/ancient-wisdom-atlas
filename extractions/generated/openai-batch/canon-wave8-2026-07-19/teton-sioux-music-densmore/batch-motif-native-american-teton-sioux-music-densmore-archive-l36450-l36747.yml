canonical_text:
  quote: ''
  summary: The passage presents several Teton Sioux songs associated with Two White
    Buffalo and Red Fox. It explains Red Fox’s adoption and naming of Two White Buffalo,
    his claimed right to give the name after killing two white buffalo, and the expectation
    that gifts are made when the songs are sung. The song texts include praise of
    giving, donations of horses or funds, and encouragement for Two White Buffalo
    to take courage because the tribe depends on her.
  language: English
