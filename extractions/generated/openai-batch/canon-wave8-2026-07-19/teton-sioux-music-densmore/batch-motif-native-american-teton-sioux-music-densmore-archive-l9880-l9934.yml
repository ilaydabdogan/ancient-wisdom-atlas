  quote: ''
  summary: 'The passage describes Sun dance ceremonial roles and regalia: the Leader
    of the Dancers in the council tent with the Intercessor, details of paint and
    decorated deerskin clothing, the Intercessor’s buffalo-, eagle-, otter-, and human-hair-associated
    costume elements, the Crier’s announcement opening the ceremony, and the Intercessor’s
    prominence in the procession toward the Sun-dance circle.'
