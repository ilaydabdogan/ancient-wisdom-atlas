canonical_text:
  quote: ''
  summary: The passage presents metric-analysis tables and a prose comparison of older
    and comparatively modern Sioux songs. It states that many older songs were learned
    or received in dreams, that newer social songs continued to be composed and recorded,
    and that phonographs were used by Sioux people to preserve and circulate songs.
    It also lists categories of older songs, including ceremonial, dream-related,
    sacred-stone, healing, animal Dream society, and war songs.
  language: English
  quote_policy: summarized
