canonical_text:
  quote: ''
  summary: Bear Face describes his first spirit-keeping for a son who died at age
    15. The boy's body was placed on a scaffold and his best horse killed beneath
    it. A man with an unblemished record purified his hands and knife with sweet grass
    smoke, made three preliminary cutting motions, and cut a lock of hair over one
    eye on the fourth motion. The lock was wrapped in red cloth for a spirit bundle.
    The passage adds that an object worn next to the child, such as a girl's hair
    ornaments, could instead serve as the central article. The spirit-keeper then
    carried the red-wrapped packet around the camp circle like a child's body, lamenting
    and announcing his new responsibilities.
  language: English
  quote_policy: summarized
