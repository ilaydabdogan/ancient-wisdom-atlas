canonical_text:
  quote: ''
  summary: 'The passage gives song words identifying the singer with the sun and moon,
    then describes events near the close of a Sun dance: fasting and exhaustion, Red
    Bird''s mirror-flash vision of the Intercessor in the sun, recovery rites with
    vapor lodge, water, sweet grass, and buffalo meat, the restricted smoking of the
    Sun-dance pipe, sacred objects left on the prairie, and boys'' later summer imitation
    of the ceremony as training.'
  language: English with Lakota song words and transliterations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first song rendition has a speaker say that he is present, asks to be
    beheld, and identifies himself as the sun.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second song rendition similarly asks to be beheld and identifies the speaker
    as the moon, with the phrase that it said this as it rose.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the second day the men were allowed a brief intermission and could return
    to their lodges, but they were not allowed food or water; during that day they
    fell one after another from exhaustion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Intercessor held a small mirror and threw reflected light into the faces
    of dancers, who fell when the flash entered their eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Red Bird felt the flash of light in his own face, fell unconscious, and then
    saw in the sun a painted man's face that he identified as the Intercessor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says Red Bird's vision was sufficient to entitle him to act as
    Intercessor after receiving proper instruction in that office.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A man who fell from exhaustion was carried into the shade and gradually regained
    consciousness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the dancing, participants returned to their lodges, spent time in the
    vapor lodge before food or water, took their first sip of water by dipping sweet
    grass in a bowl and placing it to the lips, then received cooked buffalo meat
    and later a meal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the end of the ceremony the Intercessor took the pipe from its ceremonial
    position, brought it to his lodge, broke its buffalo-fat seal, lighted it, and
    offered it to friends who felt worthy; the passage states that anyone who knew
    himself unworthy did not dare touch the Sun-dance pipe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After camp was broken, the sacred pole, its offerings, the red-painted buffalo
    skull, and bits of white eagle down remained on the prairie; the last man looked
    back and left them with Wakan Tanka and the silent prairie.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: After returning home, boys of the tribe began a childish enactment of the
    Sun dance at intervals through the summer, with preference in roles given to boys
    whose fathers or grandfathers had taken part in the ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boys' enactment included imitation of official actions, fines for improper
    or disrespectful performance, reed whistles made to imitate Sun-dance whistles,
    plumy blossoms representing eagle down, and red and green grasses imitating porcupine-quill
    decoration.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The boys used wild grapes and berries to color their bodies and decorations,
    made streamers from inner bark, carefully selected a tree for their sacred pole,
    brought it home ceremonially, and assigned boys with good voices as singers around
    a pan or a hoop covered like a drum.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boys imitated torture by thrusting a cactus spine through a boy's skin
    and fastening it to the pole by a frail thread; when dancing broke the thread,
    the boy was considered released.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage concludes that the boys were trained in their play to become the
    men of the future.
  category: other
  evidence_refs:
  - ev:8
