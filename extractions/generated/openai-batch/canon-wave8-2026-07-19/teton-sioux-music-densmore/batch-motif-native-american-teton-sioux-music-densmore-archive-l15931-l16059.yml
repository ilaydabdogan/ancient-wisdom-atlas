canonical_text:
  quote: ''
  summary: The passage presents a sacred-stone song sung by Chased-by-Bears, in which
    the sacred stones come to see the addressee. It then describes Chased-by-Bears
    parting with a sacred stone and its song, his subsequent paralysis attributed
    to that act, efforts to return the stone and identify associated herbs, his recovery,
    and the stated rule that a medicine-man might sell helper objects but not the
    stone that was the center of his power.
