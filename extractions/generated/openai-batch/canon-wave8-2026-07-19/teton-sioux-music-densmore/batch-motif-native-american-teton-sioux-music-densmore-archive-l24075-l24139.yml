canonical_text:
  quote: ''
  summary: Eagle Shield explains why the Crow-owners society honors the crow, linking
    it to swift, straight arrows and to a tradition that the crow is first to arrive
    at animal gatherings in the Black Hills, which Wakan Tanka created as a meeting
    place for animals. He describes a law forbidding killing animals during these
    gatherings, a race course in the Black Hills, the order and long duration of animal
    arrivals, the society's membership and admission by feast, its lodge and Crow
    lance, the use of sweet grass smoke before war, and the crow-skin necklace carried
    in a rawhide case.
  language: English
  quote_policy: summarized
