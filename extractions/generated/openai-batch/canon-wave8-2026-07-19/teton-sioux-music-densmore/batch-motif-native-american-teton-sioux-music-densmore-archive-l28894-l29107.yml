canonical_text:
  quote: ''
  summary: The passage gives song texts, musical analyses, and narrative notes associated
    with Jaw’s horse-capture exploit and Eagle Shield’s warpath drawings and songs.
    Jaw’s party uses night cover to take Crow horses, returns to the village with
    a wolf howl, and sings a victory song about bringing horses. The passage then
    introduces Eagle Shield’s illustrated warpath experiences, including a first fight
    without a commemorative song because of his youth, a Kaŋgi'yuha society dance
    scene, a reproof song saying even the eagle dies, and the beginning of a later
    expedition against the Crows.
  language: English with Lakota song words and glosses
  quote_policy: summarized
