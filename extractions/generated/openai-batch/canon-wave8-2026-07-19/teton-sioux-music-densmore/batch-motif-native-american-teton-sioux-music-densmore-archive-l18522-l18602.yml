canonical_text:
  quote: ''
  summary: A first-person account describes a medicine-man treating a sick young man
    in a lodge through preparations involving hair, grass, eastward positioning, a
    bundle of instruments, blindfolding, drumming, a dream-recital, directional offerings,
    forceful breath, bird imagery, extraction and expulsion of poison, pipe-smoking,
    herbs in cold water, and recovery. A following section identifies Brave Buffalo
    as a powerful medicine-man and records his explanation that medicine-men receive
    power through dreams, should act out dreams, revere sacred stones, and acknowledge
    Wakan Tanka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The patient sent for a medicine-man, who entered the lodge, seated himself
    behind the fire, and later sat by the patient's head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The medicine-man tied a wisp of grass around a lock of hair on the patient's
    forehead and had the patient placed facing east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The medicine-man opened a bundle and took out a whistle, a small drum, a rattle,
    and a black cloth that he tied over his eyes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Holding the drum and rattle while kneeling, the medicine-man told the patient
    he would see the power that gave him the right to cure sicknesses, and he told
    the dream by which he received that power.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A horse's tail was fastened to the medicine-man's belt; he offered his drum
    to the cardinal points and beat it with varying loudness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A wooden bowl was placed next to the patient's head; the medicine-man approached
    while beating the drum, blowing forcefully, and striking the right and left sides
    of his body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the singing and dream-telling, the patient heard the sound of a red
    hawk, and some present said they saw the head of a red hawk coming out of the
    medicine-man's mouth.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The patient expected sucking by mouth but instead felt a bird's beak over
    the painful place, penetrating far enough that he felt feathers; the medicine-man
    then rose with a jerk to show the trouble was removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A boy stood nearby holding a filled pipe; the medicine-man took four whiffs
    and then worked actively with pounding, kicking, pacing, stamping, rattle, and
    drum to get rid of the poison.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The medicine-man ejected the poison into the wooden bowl and told the people
    that all the poison had been sucked out and the patient would recover.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The medicine-man put herbs in cold water and instructed the patient to drink
    it and repeat the dose the next morning; the patient reports full recovery in
    about ten days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Brave Buffalo is described as a powerful medicine-man of Standing Rock Reservation
    and says medicine-men receive power from different sources, not from the evil
    one.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Brave Buffalo says no one could disregard his dreams or fail to admire the
