canonical_text:
  quote: ''
  summary: The passage records a low-voiced prayer to Wakan Tanka by an aged man,
    describes his posture and recording circumstances, then presents Chased-by-Bears'
    explanation of the sacredness of the Sun Dance, the preparatory pipe offering
    before speaking of holy things, the meaning of bodily cutting in fulfillment of
    a vow, and reflections on Wakan Tanka or a great power as the source of creatures,
    celestial order, seasons, and the life-giving sun.
  language: English with Lakota/Sioux prayer transcription
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An aged man bowed his head after singing the first song and made a prayer
    that was recorded by phonograph.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer addresses Wakan Tanka, asks to be heard, says the tribe shall live,
    asks to be watched from above, refers to friends and relatives sitting nearby,
    asks for peace, and asks that voices be heard at a future goal prepared for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prayer was spoken in a very low voice, making the phonogram difficult
    to read, and the recorder was uncertain whether the speaker intended the prayer
    to be recorded.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The aged man began the prayer with bowed head and right hand extended, later
    raised his face, and used gestures associated with his ceremonial office.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chased-by-Bears is described as a man who twice acted as Leader of the Dancers,
    had spoken the Sun-dance vow of a war party, had frequently inflicted tortures
    at the ceremony, and remained steadfast in ancient beliefs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chased-by-Bears states that the Sun Dance is very sacred and is not often
    discussed, and that people prepare themselves by offerings before speaking of
    holy things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: For two people to speak of holy things, one fills a pipe and hands it to the
