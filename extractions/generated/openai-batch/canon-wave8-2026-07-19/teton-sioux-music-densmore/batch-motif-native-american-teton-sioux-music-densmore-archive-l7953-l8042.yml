    they are ready to speak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chased-by-Bears distinguishes cutting the body in fulfillment of a Sun Dance
    vow from cutting flesh in sorrow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Chased-by-Bears says a man's body is his own, and that giving body or flesh
    gives the only thing that really belongs to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chased-by-Bears says that horses, tobacco, and other articles are lesser gifts
