  summary: The passage presents three songs sung after raising the Sacred Pole. In
    the first two, the pole is identified as the speaker; it stands sacred or at the
    center of the earth, looks around, and recognizes the tribe. A note explains that
    the phrase “center of the earth” is part of a sacred language used in connection
    with supernatural things and cites related center and four-winds language elsewhere
    in the work. The third song addresses “grandfather,” mentions the places of the
    four winds, reverence, wearing something sacred, and the tribe wishing to live.
  language: English with Lakota terms and English glosses
