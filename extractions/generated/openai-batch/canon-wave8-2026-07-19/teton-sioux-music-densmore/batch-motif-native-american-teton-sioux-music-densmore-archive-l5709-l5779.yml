  quote: ''
  summary: The passage describes pitch-discrimination tests made in 1915 among several
    Indigenous groups, especially Chippewa and Sioux participants. It explains the
    tuning-fork method, notes methodological limitations, records observations about
    test performance, and gives an example involving a Chippewa father and two sons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer made pitch-discrimination tests during the summer of 1915 among
    Mandan, Hidatsa, Chippewa, and Sioux Indians, while presenting only the Chippewa
    and Sioux results in this passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In each of the Chippewa and Sioux groups, 10 persons were tested, including
    men and women known as good singers and a few older non-musicians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The writer states that the small number of participants and unfavorable testing
    conditions make the results far from conclusive.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tests used a set of tuning forks, including a fundamental a' fork at 435
    vibrations and ten other forks producing tones at stated vibration intervals above
    the fundamental.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In preliminary testing, two forks were sounded in rapid succession and the
    participant stated whether they sounded alike or different.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the regular test, repeated 20 times, two forks were sounded in rapid succession
    and the participant was asked which tone was higher, the first or the second.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The writer used the intervals tested and the correctness of replies as a basis
    for judging each individual's pitch discrimination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The writer reports that some men she knew as firm and independent showed strong
    concentration and recognized small intervals early in the test, while men described
    as less individually strong did not make their best record until later.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Chippewa man and two sons, all prominent singers on the White Earth Reservation,
    were tested.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father and one son were identified as Big Bear and George Big Bear and
    had recorded songs for the writer during her Chippewa music study.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The writer describes the older man as retaining much native character and
    the sons as divided in sympathies and employed as Government carpenters at the
    time of testing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The test record indicated about three vibrations as the older man's pitch-discrimination
    limit and about five vibrations for each of his two sons.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The writer states that older Chippewa and Sioux Indians generally had pitch
    discrimination of about three vibrations.
  category: attribute
  evidence_refs:
  - ev:8
