canonical_text:
  quote: ''
  summary: 'The passage describes preparation and handling of a Teton Sioux spirit
    bundle: hair and ritual materials are wrapped, displayed on a pole for four days,
    placed in a decorated hide wrapping with gifts, mounted on a red-decorated tripod
    near the spirit-keeper''s tipi, and treated with reverence in the spirit lodge.
    It also describes sweet grass burning, smoke-fragrance gestures, restrictions
    on speech and conduct, and the bundle''s movement between outside and inside the
    lodge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A packet containing hair was placed with sweet grass and shed buffalo hair
    in a case wrapped in red cloth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A straight pole, preferably pine, was erected outside the spirit-keeper's
    door, and the spirit bundle was tied to it for four days and nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the four-day period a soft-tanned hide wrapping was made, feasts were
    given to people who had kept spirits, and the bundle was later taken down and
    placed in the decorated unsewn wrapping with gift articles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A spirit wrap and a braid of sweet grass are described as preserved objects
    associated with a bundle used in keeping the spirits of relatives.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the bundle was complete, three red-painted, quill-decorated stakes and
    decorated thongs were prepared; two stakes held the bundle and the third supported
    them as a tripod facing the spirit-keeper's tipi door.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A decorated hide case contained gifts for the person who would have charge
    of the final ceremony; listed gifts included needles, awls, knives, tobacco, and
    sometimes many pipes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inside the tipi, a round mellowed area of earth floor was prepared between
    the fire and the place of honor; a buffalo chip and two wooden implements were
    placed there.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: When sweet grass was burned, a pointed stick pushed a coal onto another implement,
    which lifted the coal and laid it on the buffalo chip.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spirit-keeper and his wife wore no ornaments, kept their faces painted,
    behaved quietly and reverently, were expected to hold charitable thoughts, and
    avoided unkind or harsh words in the spirit lodge.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tripod and spirit bundle were brought into the lodge at night and in bad
    weather; the bundle was placed in the place of honor and no one passed between
    it and the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Weasel Bear reported burning sweet grass in the evening; his wife passed her
    hands over the smoke, rubbed the fragrance on her face, hair, hands, and neck,
    then carried the tripod into the tipi, turning left as she entered, and took it
    outside again in the morning.
  category: speech
  evidence_refs:
  - ev:6
