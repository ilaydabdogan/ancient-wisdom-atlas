canonical_text:
  quote: ''
  summary: The passage describes a Teton Sioux whistle associated with dances, courting
    calls, and dance leadership; gives construction details and comparison with a
    Hidatsa instrument; and records Kills-at-Night's description of the Standing Rock
    Sioux grass dance, including Omaha origin, feast provision, dog-bone rites, drum
    placement, and gift redemption for a fallen feather or lost article.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A whistle-like instrument is described as having an open end usually carved
    to represent a bird's head and as being called H'yotavlca by the Teton Sioux,
    with the name glossed in the passage as connected with 'prairie chicken' and 'large.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instrument and similar bone or bead-decorated whistles were used in dances,
    especially the grass dance, and also by young men as a courting call.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A recognized dance leader could blow the whistle when singers neared the end
    of a performance time so that they would continue repetitions of the melody.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The instrument is described structurally as an open pipe with a whistle or
    flageolet mouthpiece; the passage also reports a similar Hidatsa whistle from
    Fort Berthold that could be played and could produce a harmonic series.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kills-at-Night states that the grass dance came to the Standing Rock Sioux
    from the Omaha; at first the songs were Omaha, while later many songs had Sioux
    melodies and words.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A feast is always held at a grass dance; men in charge decide who will provide
    it, and the Crier notifies those people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Feast foods named in the passage include dried berries or grapes, wild turnips,
    sweet corn, and sometimes dog; dog is not required but is appreciated if provided.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When dog is provided, the head and chest are cut into four pieces, four young
    men are selected to eat them, the bones are piled, and each young man dances four
    times around the pile while extending his hand over it as he passes near.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the grass dance, the drum is outside the circle of dancers near the side
    where the men sit, and a few women sing with the men at the drum.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A lost article in the dance must be redeemed with a gift; if a feather falls,
    the party dances around it, one or more men strike it, and each gives a present
    to an old man before the feather is returned to its owner.
  category: sequence
  evidence_refs:
  - ev:6
