canonical_text:
  quote: ''
  summary: The passage describes a sacred stone owned by Chased-by-Bears, its wrapping
    with deerskin and powdered herb, its protective and healing associations, its
    earlier ownership by the medicine-man White Shield, White Shield’s power to recall
    such stones, and the transfer of one stone and its associated song to Chased-by-Bears
    after a healing episode involving his daughter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stone is described as smooth, not dyed, wrapped in deerskin, and surrounded
    by finely powdered herb root.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chased-by-Bears said he used the herb as a charm and also took it internally;
    he refused to give any of it to the writer when parting with the stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chased-by-Bears had possessed the stone for forty years and was said to have
    fulfilled its requirements of character and action during that time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: During Chased-by-Bears’s possession of the stone, the passage states that
    none of his children died, illness was almost unknown in his family, he suffered
    no great misfortune, and he carried the stone in his medicine bag during anxiety
    over sickness or disaster.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chased-by-Bears said the stone had formerly belonged to White Shield and warned
    that it could still be summoned by White Shield, might disappear from its wrappings,
    and would return.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'White Shield was said to have many sacred stones: one for personal use worn
    in a buckskin neck bag, and others described as helpers that he could sell while
    retaining the right to recall them.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: White Shield was said to have dreamed of the sacred stones, qualified himself
    to use them in treating the sick and in other ways, and composed many songs concerning
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Chased-by-Bears’s daughter was ill, White Shield showed the sacred stone;
    it disappeared, the tent darkened, light later returned, the stone was found on
    the girl, and she began to recover.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the healing, Chased-by-Bears asked for the stone; White Shield transferred
    the stone and the song to him, saying the song should always be sung when making
