canonical_text:
  quote: ''
  summary: The passage gives three songs and an account of a war-party episode. One
    song says that a spirit has come with the wind and that something was foretold.
    In the narrative, Eagle Man, a medicine-man and war-party leader, prepares a red-painted
    pebble on a red blanket and sings a song about standing at the four places from
    which the winds blow. Red Horn offers the pipe to the little red stone and asks
    it to scout ahead. The stone disappears and is later said to have returned with
    information about the enemy. The next day human scouts find enemy men at a water
    hole, and the party later kills one Omaha man. A final song is identified as part
    of the sacred-stone demonstration and refers to causing someone to stand at a
    place.
  language: English
  quote_policy: summarized
