canonical_text:
  quote: ''
  summary: The passage lists several named men associated with the Sun Dance, giving
    their tribal divisions, offices or reputations, ages of participation, scars,
    carrying of buffalo skulls, suspension from a pole, flesh offering, and dream-derived
    naming. It then describes conferences and interviews used to gather Sun Dance
    information, including restrictions on attendance, a desired minimum of twelve
    persons, and Lone Man's statement that discussion of the Sun Dance was sacred
    talk preceded by prayer to Wakag^taQka for a true account and favorable conditions.
  language: English
  quote_policy: summarized
