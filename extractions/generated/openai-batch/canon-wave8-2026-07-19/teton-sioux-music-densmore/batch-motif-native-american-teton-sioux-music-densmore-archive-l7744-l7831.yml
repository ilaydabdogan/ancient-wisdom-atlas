- id: obs:1
  text: An unnamed man in the opening fragment has several buffalo skulls fastened
    to his back and nine long scars on each arm as evidence of Sun Dance vows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: HoGAif'-LU^TA, translated Red Fish, is identified as a Santee-Yanktonai chief,
