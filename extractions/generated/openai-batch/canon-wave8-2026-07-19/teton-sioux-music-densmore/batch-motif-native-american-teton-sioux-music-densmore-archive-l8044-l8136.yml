canonical_text:
  quote: ''
  summary: The passage explains beliefs about Wakan Tanka as a power greater than
    humans, repentance and weeping in the Sun Dance, and the continued life of spirits
    after death. Chased-by-Bears recounts Sun Dance vows made in connection with warfare,
    including promises of flesh or bodily ordeal in exchange for help in killing enemies,
    capturing horses, and returning safely. He describes speaking vows for warriors,
    ritual gestures before sunrise, cutting and suspending bodies to fulfill vows,
    carrying four buffalo skulls, and later arranging ceremonial articles on the sacred
    place of the final Sun Dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creatures and humans are described as the work of a great power, and rain
    and snow are said to come in time under a power greater than humans.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are said to repent when making or fulfilling a vow to Wakan Tanka, and
    men weep and cry aloud in the Sun Dance while asking something of Wakan Tanka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that people talk to Wakan Tanka and believe he hears them,
    while also saying that dead persons' spirits still live somewhere on earth or
    in the sky and usually do not speak except perhaps in dreams.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The first-person speaker made his first Sun Dance vow at age 24 when alone
    and threatened by an approaching Arikaree on horseback leading another horse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker vowed that if Wakan Tanka allowed him to kill the man and capture
    the horse with a lariat, he would give his flesh at the next Sun Dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After succeeding, the speaker told his friends he had conquered with Wakan
    Tanka's help and had made a Sun Dance vow; his friends said he should be Leader
    of the Dancers at the next ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In fulfilling the vow, the speaker carried the lariat used to capture the
    horse fastened to the flesh of his right shoulder, and a rawhide figure of a horse
    fastened to his left shoulder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Later, warriors asked the speaker to speak a Sun Dance vow for their party,
    and each man came alone with a gift and a statement about offerings he would make
    at the Sun Dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One man said he would give his whole body to Wakan Tanka and later asked for
    his body to be suspended entirely above the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Just before sunrise, the warriors stood side by side facing East and raised
    their right hands while the speaker prayed to Wakan Tanka for pity, protection
    of families, victory over the enemy, and capture of horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the party returned victorious, the speaker saw that the vows were fulfilled
    at the next ceremony and personally did the cutting of arms and suspension of
    bodies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: On a later occasion the speaker fulfilled a second Sun Dance vow while acting
    as Leader of the Dancers and carried four buffalo skulls, bending on a stick because
    of their weight.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Chased-by-Bears later went with the writer and interpreter to the final Sun
    Dance site to arrange ceremonial articles on the sacred place, where an outline
    and intersecting white lines were traced on exposed earth.
  category: setting
  evidence_refs:
  - ev:10
