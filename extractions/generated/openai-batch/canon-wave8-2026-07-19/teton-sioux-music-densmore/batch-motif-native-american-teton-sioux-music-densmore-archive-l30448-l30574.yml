canonical_text:
  quote: ''
  summary: The passage narrates a warpath return in which the narrator cares for a
    sick boy wounded by an arrow, returns him to his parents, and reports his death
    and commemorative name. It then presents Old Buffalo's account of a separate horse-stealing
    expedition, including a song sung in hope of capturing Crow horses, a stealth
    approach to a Crow camp, a failed seizure, escape, and the discovery of Old Buffalo's
    dead horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the return from the warpath, the narrator kept four men and the sick
    boy with him, sent the others home to report, kept the horses, and followed slowly.
  category: sequence
  evidence_refs:
  - ev:1
