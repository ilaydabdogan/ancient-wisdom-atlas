- id: obs:3
  text: The narrator made soup for the boy by boiling meat in buffalo tripe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boy's father and mother met the returning party near Queen's Land after
    hearing news from other members of the party.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After giving the boy to his parents, the narrator and companions went on with
