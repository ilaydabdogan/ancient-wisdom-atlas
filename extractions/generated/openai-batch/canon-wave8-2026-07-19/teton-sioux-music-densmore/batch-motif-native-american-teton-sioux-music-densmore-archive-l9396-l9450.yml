canonical_text:
  quote: ''
  summary: The passage first analyzes a song, then describes the Sun-dance pole, its
    crossbar, offerings, symbolic rawhide effigies, cords for suspending dancers,
    and ritual actions around planting and raising the sacred pole. The Intercessor
    places buffalo fat in the prepared hole and prays quietly. The assembled people
    remain silent while the pole is raised, then cheer and sing three songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The analyzed melody contains only tones of the minor triad and fourth, with
    a long rhythmic unit and continuous words throughout the song.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun-dance pole is described as usually about 35 feet long and 6 to 8 inches
    in diameter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A crossbar about the length of a man was tied onto the pole and fastened to
    a short branch left for that purpose.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the intersection of the pole and crossbar, a rawhide bag decorated with
    beads, tassels, and fringe was tied with rawhide thongs and wrapped in cherry
    branches.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the larger bag was a smaller tanned buffalo-hide bag containing an
    offering of buffalo hump on a sharpened red-painted cottonwood stick.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mato'-kuwa' stated that the cottonwood stick symbolized both the arrow that
    killed the buffalo and the picket stake for a horse stolen from an enemy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Two rawhide effigies, one in the form of an Indian and one in the form of
