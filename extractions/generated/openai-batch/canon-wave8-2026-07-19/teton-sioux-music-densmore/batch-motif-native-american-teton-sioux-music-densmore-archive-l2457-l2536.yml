  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The older songs have a higher percentage beginning on the twelfth and fifth,
    while the modern songs have a higher proportion beginning on the octave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the percentage ending on the keynote and fifth is
    identical in the two groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The modern songs show a smaller proportion of songs in which the final tone
    is the lowest in the song.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: The older songs show a larger proportion with a range of 12 or more tones,
    while the modern group has a larger percentage of songs harmonic in structure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author suggests that the greater harmonic structure and reduced range
    in the modern songs may indicate less freedom in musical expression under the
    restrictions of civilization.
  category: speech
  evidence_refs:
