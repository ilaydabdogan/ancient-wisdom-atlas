    in the older group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first division also includes incidental war songs, dancing songs used
    in the Sun dance, and honor songs sung to military-society melodies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: A second division includes songs of the buffalo hunt together with council
    and Chief songs, with one Chief song sung at the Sun dance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A third division includes unclassified Sun dance songs titled Song of Final
