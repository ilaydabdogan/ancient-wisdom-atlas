canonical_text:
  quote: ''
  summary: The passage presents two Teton Sioux songs and explanatory notes. Song
    No. 144 refers to a returning attacking party and a woman standing smiling. The
    prose explains the return of warriors, women meeting them, scalp trophies carried
    in victory dances, and the placement of scalp poles with food on the highest butte.
    It also describes later public display of a husband's war trophies by a woman,
    first-war-party success leading to gifts and a manhood name, and captured horses
    being given to women of the family, as expressed in Song No. 145.
  language: English with Lakota/Dakota transliteration and glosses
  quote_policy: summarized
