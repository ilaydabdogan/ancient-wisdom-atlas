canonical_text:
  quote: Soon I saw the old wolf returning and behind him came a buffalo calf.
  summary: The passage gives song texts and glosses associated with Charging Thunder’s
    wolf dream. A song of the young wolves describes father and mother coming home
    howling, a calf being brought, and a sacred return. Charging Thunder then narrates
    that an old wolf returned with a buffalo calf, instructed him how to make and
    use a pipe on the warpath, and taught that the pipe would conceal him from enemies
    and help him steal horses and outwit them. The pipe looked ordinary but had been
    made sacred by a medicine-man. A song of the old wolf describes a different pipe
    made in a sacred manner and a wise spirit encountered. A footnote explains making
    objects sacred through specialists who can speak with objects, and describes filling,
    incensing, and offering the pipe to the sky and cardinal points.
  language: English with Lakota song text and glosses
  quote_policy: quoted
