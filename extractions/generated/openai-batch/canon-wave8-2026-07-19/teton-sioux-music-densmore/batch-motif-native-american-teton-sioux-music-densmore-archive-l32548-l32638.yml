canonical_text:
  quote: ''
  summary: The passage describes how old men and society leaders selected qualified
    young men to search for buffalo before a camp move; their honored departure from
    the camp circle involved gifts, escort, a high-status man leading them around
    an upright stick that signified an enemy or buffalo, a dancing step, and a song.
    It then describes the searchers’ organization under their leader, the tribe’s
    watch for their return, signals indicating the result of the search, and the singing
    of a return song. A musical analysis of the departure song is included.
  language: English
  quote_policy: summarized
