canonical_text:
  quote: ''
  summary: 'The passage first gives a technical analysis of a song, noting three consistent
    renditions and unusual rhythmic stability. It then introduces Goose, a widely
    known medicine-man associated with treatment of consumption and information about
    the Sun dance and sacred stones. Goose recounts an experience while hunting before
    daybreak: after he repeatedly failed to affect an antelope with his rifle, a voice
    told him to listen and look at the sun. He saw the rising sun with a man''s face
    commanding nature, a bough booth, a red-hot sacred stone, a painted man with an
    eagle-down feather, and birds. Bird-like descents produced three herbs for curing
    the sick. A fourth descent became a human skeleton; blood entered it, and a buffalo
    horn appeared and drew the blood out. The voice, said to come from the sacred
    stone, instructed Goose to use the herbs and buffalo horn in healing, especially
    diseases of the blood.'
  language: English
  quote_policy: summarized
