  text: The speaker states an intention to fulfill a vow to WakaQ^taQka during hot
    July weather.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lodge of branches is made at some distance from the village, with big-leaf
    sage spread on the ground, hot stones brought in, and water poured on the stones
    to fill the lodge with steam.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the speaker becomes wet with perspiration, men rub the speaker with
    sage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men put a buffalo robe around the speaker with the fur outside and tie
