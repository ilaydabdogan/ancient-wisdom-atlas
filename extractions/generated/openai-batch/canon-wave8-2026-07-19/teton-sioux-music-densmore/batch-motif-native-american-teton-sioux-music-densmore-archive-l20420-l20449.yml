  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the hill there is a large horned buffalo skull brought from the village,
    and friends have prepared a sage-covered resting place on the ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker holds the pipe and follows the sun with it, lies face down on
