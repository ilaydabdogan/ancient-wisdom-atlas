canonical_text:
  quote: Now I am going to fulfill my vow to WakaQ^taQka.
  summary: A first-person speaker describes fulfilling a vow through a hot steam-and-sage
    preparation, wearing a buffalo robe, walking barefoot to a distant hill with a
    decorated pipe, keeping a multi-day vigil by a buffalo skull, praying for strength
    and honesty, placing red cloth at the four directions, and leaving the skull,
    pipe, and offerings on the hill.
  language: English
  quote_policy: quoted
