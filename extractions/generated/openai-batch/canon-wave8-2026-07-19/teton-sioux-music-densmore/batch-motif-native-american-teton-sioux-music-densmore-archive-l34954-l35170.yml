canonical_text:
  quote: ''
  summary: 'The passage describes Grass Dance customs: men and women dance separately;
    women may summon men using kinship terms, with gift-giving by a summoned married
    man''s wife; women may recount a relative''s brave deed and receive collective
    vocal applause. It then describes the end-of-song practice called “dancing the
    tail,” in which a selected man dances alone and sings, an honor limited to men
    with brave deeds and explained as deriving from an honor dance connected with
    rear-guard service, noble conduct on the warpath, or rescue in battle. The passage
    also gives words and musical analysis for Grass Dance songs sung by Kills-at-Night,
    including battle-oriented words and words sung only in the song''s tail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men dance alone, and women also dance alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women may summon a few men into the dancing circle using relationship terms
    such as brother or cousin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a woman summons a married man to dance, his wife regards it as an honor
    and gives a present to the woman who asked him to dance.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman may stand and tell the brave deed of a relative, after which the women
    answer with a high, quavering cry described as customary applause.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of the men's dances, the participants sit down while the drum continues
    briefly; then one man rises, dances around the circle, and sings a short phrase.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: This final action is called “dancing the tail,” and words are often used only
    in that part of the song.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The tail dancer is selected by the other dancers, being chosen is considered
    an honor, and only a man who has done a brave deed may be chosen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mr. Higheagle explains the feature as originating in an honor dance for a
    man who acted as rear guard in war and succeeded, was left behind on the warpath
    and acted nobly, or had his horse shot under him and was rescued by a friend riding
    double in a fight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The song “They Are Charging Them” is presented as the only recorded Grass
    Dance song in the passage with continuous words.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The words of “They Are Charging Them” include statements that people are charging
    them, an instruction to look back, and a reference to “your friends.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The analysis of “They Are Charging Them” says the song has a compass of 17
    tones, was recorded on two cylinders for six complete renditions, uses tones of
    the second five-toned scale, and repeats a rhythmic unit through almost the entire
    song.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the following Grass Dance song, the words were sung only during the “dancing
    of the tail of the song.”
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The words of the Grass Dance song marked “a” name Crazy Dog and report him
    as saying that he helped.
  category: speech
  evidence_refs:
  - ev:7
