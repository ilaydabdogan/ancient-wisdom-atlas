canonical_text:
  quote: ''
  summary: 'The passage cites accounts of Heyoka and Thunder-beings: Heyoka dreamers
    make promises to Thunder-beings and may receive help or be killed in storms depending
    on whether they keep them; Heyoka are described as beings of inversion or contrary
    behavior; Heyoka are also represented as little old men dwelling in prairie hills.
    The passage compares such little beings with White River Ute little green men
    in mountains who teach medicines and songs. It then introduces Lone Man’s thunderbird
    dream, in which riders from the west and north appear in clouds and appoint him
    to attack a red-painted man standing in water, promising lifelong benefit if he
    conquers him. A note also mentions Chippewa thunderbird dreams and songs.'
  language: English
  quote_policy: summarized
