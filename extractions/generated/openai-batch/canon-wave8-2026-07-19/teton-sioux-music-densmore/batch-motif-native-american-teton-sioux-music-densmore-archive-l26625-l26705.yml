canonical_text:
  quote: ''
  summary: The passage describes Teton Sioux war-related customs concerning honor,
    rescue of wounded companions, decorative signs of war deeds, black face paint,
    feathers, counting coup, preparation and display of scalps for victory dances,
    and comparative notes on hair ornaments and scalp preparation in nearby Native
    traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stated purposes of a man going to war were to gain honor and capture horses;
    honor could come from loyalty to comrades or from conquering the enemy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who carried a wounded friend or a captive on his back could, on return,
    place a specified decoration on his tobacco bag or blanket, making the act publicly
    known.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a wounded relative was deserted by his kinsman and saved by a stranger,
    the stranger received special honor and was called Wawo'Jciyapi, glossed as “Helper
    of the helpless”; deserting a wounded friend on the warpath was described as the
    greatest perfidy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage identifies wearing feathers, painting the face, and counting coup
    as customs whose details could differ among tribes or bands, and then gives the
    Teton Sioux custom as reported by informants.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first warrior in an attack to kill an enemy had the right to wear black
    face paint in dances after returning from war.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second warrior to kill an enemy could strike the enemy and, on return,
    let his hair hang loose but not paint his face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: If a war party defeated the enemy without losses, the first four enemy-killers
    and their women relatives could use black face paint; special songs were sung,
    and the four men were publicly treated as equally entitled to the honor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: A man who killed an enemy without injury to himself could wear an erect feather
    at the back of his head; multiple enemies killed in the same battle allowed a
    corresponding number of feathers, while striking an enemy allowed a horizontal
    feather.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four men could count coup by striking the same enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: At the final camp, a returning war party prepared captured scalps for use
    in the victory dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: If present, a man who had dreamed of a carnivorous animal that attacks humans
    was selected to prepare the scalp; he scraped it, mixed its fat with gunpowder,
    rubbed the mixture on his face and hands, sewed the scalp inside a hoop, and fastened
    it to a pole.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A human hair dance ornament obtained among the Sioux is explicitly said not
    to represent a Sioux custom; the passage attributes such ornaments to Crows and
    later to Mandan and Hidatsa use, made from cut or fallen hair rather than enemy
    scalps.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: A victorious war party returned toward the village bearing scalps aloft on
    poles; Dog Eagle said he sang a song when he came in sight of camp, and the song
    was also used in later dances.
  category: sequence
  evidence_refs:
  - ev:6
