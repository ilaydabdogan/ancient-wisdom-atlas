canonical_text:
  quote: ''
  summary: The passage explains the term Wakaq'taqka in relation to the English phrase
    Great Spirit, reports Teton Sioux elders' statements about belief in Wakaq'taqka,
    describes reverent avoidance of the term in ordinary speech, and gives examples
    of wakan or mysterious power in persons, the pipe, thunder, lightning, rain, the
    sun, sacred stones, and medicinal herbs. It also notes differing scholarly opinions
    on whether Dakota religion includes one supreme existence or multiple deities.
  language: English
