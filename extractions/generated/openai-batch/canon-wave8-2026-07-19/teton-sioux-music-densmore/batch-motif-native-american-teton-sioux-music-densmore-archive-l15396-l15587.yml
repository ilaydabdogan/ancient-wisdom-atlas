canonical_text:
  quote: ''
  summary: The passage gives tabular comparisons of voice and drum tempo for a group
    of songs, comments on plotted outlines of songs connected with dreams about animals,
    and introduces songs relating to sacred stones received in dreams. It explains
    that dreaming of a small stone was regarded among the Teton Sioux as a sign that,
    if dream requirements were fulfilled, the dreamer would gain supernatural power
    used with sacred stones. The stones are described as natural, regular, untooled
    brown sandstone, often spherical, and as symbolizing endlessness, natural perfection,
    solidity, genuineness, and non-imitation. The term for the stones is connected
    with sacred language and with the word for grandfather. A medicine-man is said
    to send the stones long distances to obtain information; they return and speak
    to him, and in curing demonstrations they may fly in a darkened tent and strike
    unbelievers. Their power to move through the air is associated with Ta'kuśkaŋśkaŋ,
    described by informants and cited authorities as a native Dakota god whose symbol
    is the boulder.
  language: English
  quote_policy: summarized
