  summary: The passage recounts Metal Knee and other men on the warpath hearing singing
    near a hill, discovering a wolf singing, and learning its song. The wolf song
    describes roaming at daybreak with changing manners of movement and caution. The
    passage then gives a buffalo dream song whose dream story is lost, and an eagle-related
    song explained through deer meat bait, scarlet color, blue sky, and eagle catching.
