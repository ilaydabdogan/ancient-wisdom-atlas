canonical_text:
  quote: ''
  summary: Siya'ka describes how a young man prepares to seek a dream or vision by
    consulting a medicine-man, preparing robes, tobacco, a decorated pipe, face paint,
    sweat-lodge purification, and a hilltop vigil. He places offerings toward the
    four directions, waits for a bird or animal helper sent by Wakaŋ Tanka, uses a
    buffalo skull and sage, and hears a voice saying that he is recognized by Wakaŋ
    Tanka.
  language: English
  quote_policy: summarized
