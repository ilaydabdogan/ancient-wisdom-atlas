  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the hilltop, the narrator dug a hollow about two feet deep where he could
    crouch when weary from standing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the four compass points he placed robes and tobacco as offerings for messages
    from the directions of the four winds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After sunset he closed his eyes, faced east, then north and south, while wrapped
    in a buffalo robe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: His vocalization is described as more like lamenting than singing, like a
    child asking for something.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The desired results of the young man's lamenting for a vision are said to
    be long life and success in taking horses from the enemy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A buffalo skull with blue stripes, fresh sage in its openings, and a bed of
    sage was placed north of him with its face toward the south.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The buffalo skull's orientation is explained by reference to buffalo coming
    from the north toward the south and bringing news that Wakaŋ Tanka has provided
    food and prevented famine.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The narrator rested a filled but unlit pipe against the buffalo skull part
