- id: obs:2
  text: A person seeking a request from Wakaŋ Tanka is described as needing preparation
    rather than acting suddenly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dreamer seeks seclusion on a butte or other high place and makes the request
    through what is seen when the eyes are closed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The seeker usually has in mind an animal wanted for protection and help, and
    help is sought through a bird or animal sent by Wakaŋ Tanka.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: As a young man, the narrator wanted a dream to know what to depend upon for
    help, consulted a medicine-man, and followed his instructions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The medicine-man instructed him to prepare four well-tanned robes, one robe
    for personal use, a decorated pipe, and tobacco offerings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The medicine-man painted the narrator's face white, accompanied him into the
