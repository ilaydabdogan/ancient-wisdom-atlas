canonical_text:
  quote: This was regarded as a kind of courting ceremony.
  summary: The passage describes the Night Dance in connection with the shuffling-feet
    dance. Young men and young women sit on opposite sides of a tipi, dance with presents,
    and present them to one another. The dance is described as a courting ceremony,
    after which all dance in a circle holding hands and a feast is made. The passage
    then identifies and analyzes Song No. 208 of the Night Dance, sung by Kill-at-Night
    and his wife.
