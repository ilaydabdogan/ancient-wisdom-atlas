canonical_text:
  quote: ''
  summary: The passage presents song No. 280, “Hence They Come,” with translated words
    about a tribal gathering where people without resources obtain the speaker’s horses;
    the gloss names Two White Buffalo as the one who has said this. It then gives
    musical analysis and recording notes. Song No. 281, “A Short Time,” addresses
    Two White Buffalo with an exhortation to take courage because life is short; its
    analysis identifies it as a Strong Heart society song. The passage closes by introducing
    comparatively modern love songs, including one about a maid whose parents oppose
    the man she chooses, and notes a connection between older love songs and war material
    elsewhere in the book.
  language: English with Lakota/Dakota song words in transcription
