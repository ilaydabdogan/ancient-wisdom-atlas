canonical_text:
  quote: ''
  summary: The passage gives song glosses and commentary for sacred-stone songs. The
    songs describe revered stones or a Sacred-stone nation flying, speaking from the
    north, moving with purpose, and coming from everywhere amid wind and rattling
    earth. Commentary says that in a complete sacred-stone demonstration a man proving
    his power tells dreams and sings dream songs as credentials. White Shield used
    two such songs, recorded by Two Shields. The passage also notes that sacred stones
    address their owner as father or grandfather, and introduces a song titled “A
    Wolf Nation Called Me ‘Father.’”
  language: English with Lakota/Dakota song terms and glosses
