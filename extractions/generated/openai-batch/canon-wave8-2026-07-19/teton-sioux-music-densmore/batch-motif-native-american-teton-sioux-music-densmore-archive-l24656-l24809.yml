canonical_text:
  quote: ''
  summary: 'The passage gives musicological analysis of two songs, including No. 124,
    “Song of the White Horse Riders,” sung by Two Shields. It then introduces war
    songs and describes tribal and individual war expeditions: council discussion,
    scout selection, night scouting, collective movement under restraint, individual
    recruitment at night, pipe-smoking as acceptance, route discussion, and maps sketched
    on ground or buckskin for later parties.'
  language: English
  quote_policy: summarized
