canonical_text:
  quote: "“the lightning came — it is the flash of their eyes, and the thunder is
    the sound of their terrible song.”"
  summary: The passage recounts thunderbird beings whose spirits return to the clouds,
    whose eyes and song are identified with lightning and thunder, and whose anger
    sends lightning against rocks or trees as warnings. It then describes the Heyoka
    Kaga as a ceremony of public humiliation performed by a man selected through a
    thunderbird dream, explains heyo'ka as a term for one who dreams of thunderbirds,
    acts contrary to ordinary ways, or behaves as a joker/fool/clown, and reports
    differing views about whether heyo'ka should be classed as gods, folk-tale characters,
    or powers distinct from but connected with Wakinyan.
  language: English
  quote_policy: quoted
