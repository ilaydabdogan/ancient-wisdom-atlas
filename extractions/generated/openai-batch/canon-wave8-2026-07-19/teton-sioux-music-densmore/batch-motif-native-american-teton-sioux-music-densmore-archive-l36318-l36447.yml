canonical_text:
  quote: ''
  summary: A legend connected with Ghost Hill recounts the disappearance and death
    of a handsome young man, the consultation of a man with sacred stones, the hearing
    of the young man’s ghostly singing voice, predictions about his murderers, and
    repeated sightings of a gray-blanketed figure near the hill. The passage also
    gives the ghost song’s words and notes Two Shields’s recording of it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghost Hill is described as a high butte about 8 miles southeast of Fort Yates,
    with a legend and song connected to it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sitting Bull and his band camped one winter on lowland beside the Missouri
    River below Fort Yates after being brought from Canada.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A handsome young man in the camp disappeared, and no trace of him could be
    found.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The missing man’s parents gave a horse to a man who had sacred stones and
    asked him to tell them about their son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The man with sacred stones predicted that the missing man’s voice would be
    heard at night passing through the camp and that everyone should follow it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before dawn, the camp heard the young man’s voice approach, sing a love song,
    pass through the camp, return, and move toward Ghost Hill.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people followed the voice but could not keep up with it, and it was lost
    in the darkness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sacred-stone owner said the young man had been murdered by ten jealous
    men, and that the men would die one after another at ten-day intervals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The predicted deaths of the ten men are said to have occurred.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sacred-stone owner later said the young man had been chased, killed far
    from home, and devoured by wolves.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The parents were told to follow the recurring voice to the place where it
    disappeared, where they would see their son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The parents saw a figure wrapped in a gray Army blanket, followed it, and
    thought it disappeared into the side of Ghost Hill.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The parents dug into the side of Ghost Hill and searched, but the body was
    never found.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Walking Elk, who lived at the foot of Ghost Hill, attributed deaths in his
    family to the ghost and shot at it with a rifle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The last appearance of the ghost is placed around 1889, and similar gray-blanketed
