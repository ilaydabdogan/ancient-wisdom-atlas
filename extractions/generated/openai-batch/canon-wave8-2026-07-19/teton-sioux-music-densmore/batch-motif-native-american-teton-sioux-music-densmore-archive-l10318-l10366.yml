literal_observations:
- id: obs:1
  text: Women sometimes participated by fasting, standing beside a dancing relative,
    or taking on part of a relative’s vow obligation by allowing their arms to be
    cut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women performed work connected with gifts distributed by dancers’ relatives
    and feasts held in the dancers’ honor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described dancer abstained from food and water and danced with his face
    raised to the sun from morning until night, through the night, and into the next
    day until exhaustion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dancer who had vowed arm cutting left the dance line, sat beside the pole,
    underwent the cutting, and then resumed dancing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The number of arm cuts could vary from 10 to 100 or 200 according to the vow,
    and relatives might assume part of a larger number.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: An experienced man and an assistant performed the cutting with an awl and
    knife; the first portion of severed flesh was lifted toward the sky with a spoken
    declaration that the vow was fulfilled.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Another described method used gashes that left broad white scars.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: For suspension from the pole, flesh on the chest was pierced with an awl,
    a painted blue pointed stick was inserted, and thongs from the pole’s crossbar
    were tied to the sticks in the man’s flesh.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Medicine was applied if bleeding was excessive, and the passage notes that
    bone awls were formerly used.
  category: object
  evidence_refs:
  - ev:6
