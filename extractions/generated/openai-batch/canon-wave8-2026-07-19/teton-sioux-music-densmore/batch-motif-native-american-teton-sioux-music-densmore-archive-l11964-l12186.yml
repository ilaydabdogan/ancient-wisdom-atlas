canonical_text:
  quote: ''
  summary: The passage continues Lone Man's dream narrative about the horsemen or
    riders in the cloud. In the dream he attacks an enemy who becomes a reed in the
    water; supernatural voices accept him as one of their number, instruct him concerning
    frogs and water creatures, and tell him that earth, land, and water are his to
    behold. Sacred stones are said to guard him, and a related song is recorded. Lone
    Man then prays to a Great grandfather before singing. The narrative continues
    with the riders giving him a protective charm; a second song honors the charm
    and the swallow, whose flight precedes thunderstorms and is associated with the
    thunderbird and with a warrior's desire for a swift horse.
  language: English with Lakota/Dakota song text and glosses
  quote_policy: summarized
