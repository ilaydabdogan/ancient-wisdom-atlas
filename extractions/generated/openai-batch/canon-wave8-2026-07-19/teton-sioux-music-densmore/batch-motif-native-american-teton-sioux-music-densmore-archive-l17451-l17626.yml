canonical_text:
  quote: ''
  summary: The passage gives musical analysis of a sacred-stone song, recounts White
    Shield sending a sacred stone to locate Siya'ka's lost horses, and recounts Bear
    Eagle's account of Shell Necklace consulting sacred stones during a war party.
    The stone episodes include prepared ground, ritual darkness or coverings, requested
    signs, fulfilled predictions, offerings, and songs associated with Shell Necklace's
    demonstration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening musical analysis says the song's rhythmic unit consists of five
    measures, four renditions were recorded, and its tonality is minor.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Siya'ka said he had lost two horses and asked White Shield to locate them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the stone was sent, Siya'ka specified that a turtle and clamshell would
    indicate a creek, while a meadow lark would indicate prairie.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: White Shield sent the sacred stone on a quest while people prepared a square
    of finely pulverized earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tepee was dark because the fire had been smothered, with dry grass ready
    for making light when ordered.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stone appeared on the prepared place with a little turtle beside it and
    a small piece of clamshell in one claw.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: White Shield stated a precise location for the horses and added that a traveler
    could bring them back if Siya'ka did not go.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The account says White Shield's statement proved true when a neighbor found
    the horses at the fork of Porcupine Creek and returned them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bear Eagle said he once led a war party against the Crows, and Shell Necklace,
    a member of the party, could inquire of sacred stones.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the war-party camp, Eagle Man asked Shell Necklace to secure news of the
    enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A place on the ground was prepared and covered with a red blanket before the
    stone returned.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Shell Necklace covered himself completely with a buffalo robe and asked the
    sacred stone what news it brought.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the usual pipe was offered to the sacred stone, a wolf was heard howling
    in the distance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Shell Necklace said the stone reported that the next day the party would meet
    two mounted men, see a large enemy camp, and kill enemies on prepared or soft
    ground.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The sacred stones asked for a buffalo as a morning reward and predicted that
    it would be killed with an arrow and fall with its head toward the south.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The next morning the men killed a buffalo as predicted, put fresh sage in
    the wound, and placed a painted gift-stick with tobacco at the buffalo's head
    as an offering.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: That day the war party met two enemies and killed them both.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: 'Two songs were said to have been sung by Shell Necklace during the demonstration:
    one about his qualifications to ask favors of sacred stones and one about his
    medicine-man power to control persons at a distance.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Song No. 77 includes statements that the singer lives in a sacred manner,
