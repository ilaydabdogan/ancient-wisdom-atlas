canonical_text:
  quote: ''
  summary: The passage presents two medicine songs attributed to use by Sitting Bull
    in treating the sick, with words and musical analysis, followed by Old Buffalo's
    narrative of a standing prayer vigil for a gravely ill niece. In the narrative,
    Old Buffalo goes to a high hill, calls on Wakaq^taqka for help, vows four sacrifices
    and the smoking of a Chief pipe if the girl is spared, and the girl then improves
    enough to drink water and eat a little food.
  language: English with Lakota song words and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that two songs were said to have been used by Sitting Bull
    in treating the sick and were sung by his nephew One Buffalo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine Song (a) includes the named being Wakaq^taqka, the phrase translated
    as "to him I am related," and lines in which a tribe, an elk, and a man are described
    as friends from above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The musical analysis of Medicine Song (a) describes the melody as simple,
    major in tonality, melodic in structure, and containing all tones of the octave
    except the seventh.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Medicine Song (b) includes translated phrases such as "in four places," "friend,"
    "may you be sacred," "no one is sacred," and "you said."
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The musical analysis of Medicine Song (b) states that it has 23 measures,
    11 progressions, a compass of six tones, and melody tones of the fourth five-toned
    scale.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Old Buffalo told the vigil story hesitantly and depicted the event in a drawing;
    the account concerns a prayer vigil for a niece who was very ill and whom he believed
    recovered because of his action.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage identifies the vigil as hayhle'dapiŋ, glossed as "prayers offered
    standing."
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Old Buffalo's niece is described as a young girl who is very ill, thin, unable
    to rise from bed, and asking him to bring her water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Seeing the sick girl, Old Buffalo thinks that he will call on Wakaq^taqka
    for help and says he has heard that men did this when helpless in sickness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old Buffalo goes to a high hill, makes a vow, calls upon Wakaq^taqka, asks
    for pity, asks that his niece live, and asks for strength to do what is right
    and honest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Old Buffalo promises four sacrifices and the smoking of a fine Chief pipe
    in Wakaq^taqka's honor if the girl’s life is spared.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the vow scene, the girl gets better, drinks water, and eats a little
    food.
  category: sequence
  evidence_refs:
  - ev:9
