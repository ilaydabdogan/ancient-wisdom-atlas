canonical_text:
  quote: ''
  summary: The passage describes medicine pouches and healing articles among Teton
    Sioux practitioners. Earth-medicine Woman reports her uncle's use of eagle-claw
    and elk-bone remedies. A badger-paw medicine pouch is noted. Eagle Shield attributes
    his herbal knowledge to the bear and the badger, shares medicine bags, herb packets,
    a bear claw, and a mink-skin pouch, and the passage states that doctors used remedies
    revealed by animals or acquired from other medicine-men.
  language: English
