literal_observations:
- id: obs:1
  text: A song is described as containing all tones of the octave except the second,
    having a compass of an octave, varying the second count of the rhythmic unit,
    and being recorded in three identical renditions.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four men named Jaw, Eagle Shield, Swift Dog, and Old Buffalo contributed drawings
    to the section on songs accompanied by Native drawings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage attributes different drawing characteristics to the contributors:
    Jaw’s incidents mostly concern horse capture and omit enemy numbers; Eagle Shield
    shows enemy numbers, more detail, and rescues; Swift Dog frequently shows the
    coup stick.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The beginning of a drawing sequence is determined by the narrative rather
    than being evident to an outside observer from the sheet alone.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Crows and Assiniboin are delineated similarly in the drawings and are distinguished
    by upright hair on top of the head.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Jaw is identified by several names: Jaw or Cehu''pa, a childhood name Ma''za-ho''wañte,
    and the true name Oki''čize-ta''wa, which he received after first taking part
    in actual warfare.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jaw states that his mother belonged to a Gi'gilañ'ka division of the Hunkpa'pa
    band and his father was a Sans Arc of the Te'tonwan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jaw is said to have been 63 years old in 1913, born in the year called the
    winter that Turtle Catcher died, which was identified in a picture calendar as
    1850.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: As a memory test, Jaw named several succeeding years in the Standing Rock
    Sioux picture calendar accurately except for a different naming of one year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When naming the year of his seventh year, Jaw added that it was the year he
    killed the bird, which he took to his grandmother, who had cared for him since
    infancy after his mother died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Jaw says his grandmother would carry birds he killed, and that both she and
    he would eat from his hunting when camp was made at night.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Jaw’s father first called him Ma'za-ho'wañte when Jaw killed the bird.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In young manhood Jaw was known especially for success in stealing horses from
    the enemy and gave information about war customs.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that in earlier times each warrior carried his own wooden
    bowl on the warpath, ate and drank from his own dish, and stored it after returning
    home with other warpath articles and sweetgrass.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: When going on the warpath Jaw painted a red crescent over his mouth, painted
    his hands and feet red, painted crescents on his horse’s chest and left hip, and
    painted the end of the horse’s nose yellow.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: If a horse succeeded in a difficult undertaking, Jaw rewarded it with a feather
    in its mane or tail, or with a red list-cloth band around its neck.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Jaw had two medicine bags containing the same medicine, one for himself and
    one for his horse; the horse’s bag was tied to the bit of its bridle.
  category: object
  evidence_refs:
  - ev:11
- id: obs:18
  text: Jaw said that he chewed a certain herb and put it into his horse’s mouth to
    relieve a headache, and also chewed it to windward of horses he intended to steal,
    after which the horses pricked up their ears.
  category: action
  evidence_refs:
  - ev:11
