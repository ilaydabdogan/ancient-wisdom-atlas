canonical_text:
  quote: ''
  summary: 'The passage describes Jaw’s warpath equipment: a leather pouch with vermilion
    paint mixed with grease for face and body, a war whistle, a warrior’s bowl, and
    a wolf skin worn on the shoulder with the whistle tied to its nose. Footnotes
    compare the whistle to an undecorated Sun-dance whistle and note a saw-cut sound
    hole; another footnote cites Chippewa war party health regulations.'
