  summary: 'The passage describes offices within certain societies: a pair associated
    with two leaders is known in some societies as bonnet bearers and in others as
    pipe bearers, with similar functions. These ranking pairs may be called the four
    chiefs. Whip bearers, food passers, drummers, and singers are also mentioned,
    and the passage concludes that the societies approximate one organizational type.'
