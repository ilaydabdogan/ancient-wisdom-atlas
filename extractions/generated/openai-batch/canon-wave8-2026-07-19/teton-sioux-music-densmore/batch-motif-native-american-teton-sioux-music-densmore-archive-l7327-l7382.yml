canonical_text:
  quote: ''
  summary: 'The passage describes a white buffalo robe laid over a buffalo effigy
    of small trees with valuable garments and then given to an assisting society.
    Weasel Bear narrates the departure after spirit-keeping for his daughter: the
    bundle share is carried away, his wife gives the tipi for cutting, the household
    is stripped until only grass and a small spirit post remain, relatives later restore
    a tipi and goods, and the spirit post becomes a place where clearing the ground
    may lead to food for the hungry. He adds that these practices came through the
    white buffalo, explaining the high regard for buffalo-related things. The passage
    then begins a section on the Sun Dance, noting the sun as a prominent mythic figure,
    citing a Natchez sky deity connected with the Sun, and saying Sun Dance observance
    was limited to certain Plains tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo effigy made of small trees was erected; a white buffalo robe was
    laid over the framework, and valuable garments were placed on it.
