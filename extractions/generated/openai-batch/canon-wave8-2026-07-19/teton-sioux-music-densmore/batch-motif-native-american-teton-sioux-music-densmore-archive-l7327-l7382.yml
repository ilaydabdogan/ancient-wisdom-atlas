- id: obs:3
  text: Weasel Bear says that when the people departed, the leader went first carrying
    his share of the bundle in which Weasel Bear had detained the spirit of his little
    daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weasel Bear's wife told people without leather that they might cut up the
    tipi; women came quickly and cut it up, and they also took a little tipi and the
    tipi poles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the giveaway, nothing was left where Weasel Bear and his wife stood
