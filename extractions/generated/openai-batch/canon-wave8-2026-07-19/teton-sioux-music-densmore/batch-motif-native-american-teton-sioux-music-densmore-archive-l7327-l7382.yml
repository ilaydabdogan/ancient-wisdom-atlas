- id: obs:2
  text: The white buffalo robe and articles on it were given to the society that had
    given the most assistance to the spirit-keeper; the society could keep the robe
    intact, make drawings on it through a qualified man, cut it up, divide it, or
    sell it.
  category: relationship
  evidence_refs:
