  text: The father’s love for a child is publicly measured by sacrifices, gifts, or
    ceremonies performed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The White Buffalo Maiden is said to have been sent to the Sioux tribe by the
    Buffalo tribe and admired by parents as a model for children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The White Buffalo Maiden is described as pure white and without blemish, and
    she addressed men, women, and children.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Maiden is said to have taught that good things would come to the people
