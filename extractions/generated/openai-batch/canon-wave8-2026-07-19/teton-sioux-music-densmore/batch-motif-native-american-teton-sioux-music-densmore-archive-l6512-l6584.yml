- id: obs:1
  text: A child is described as the greatest gift from Wakan Tanka, sent in response
    to devout prayers, sacrifices, and promises.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father makes promises or vows to Wakan Tanka, manifested by elements of
    earth and sky, so the child may grow in health and avoid serious misfortune.
