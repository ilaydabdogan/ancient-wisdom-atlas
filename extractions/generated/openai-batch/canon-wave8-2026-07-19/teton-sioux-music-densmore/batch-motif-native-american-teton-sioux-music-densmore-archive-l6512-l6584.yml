  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woodpecker is explained as a simple, humble bird that stays near its nest
    and is seldom seen.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Children who underwent the ceremony are described as more closely guarded
    and protected than others.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The ceremony could be held for several children at one time and often took
    place in fulfillment of a vow.
  category: action
  evidence_refs:
  - ev:6
