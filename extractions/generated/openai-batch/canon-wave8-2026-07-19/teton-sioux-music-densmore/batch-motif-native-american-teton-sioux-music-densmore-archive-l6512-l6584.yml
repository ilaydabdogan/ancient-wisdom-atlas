canonical_text:
  quote: ''
  summary: The passage describes Sioux belief that a child is a gift sent by Wakan
    Tanka in response to prayers, sacrifices, and promises. It explains parental vows
    for a child’s welfare, the White Buffalo Maiden as a model of purity and as connected
    with the pipe, the decorated wand or pipestem used in the Aiywagpi ceremony, its
    decorations, and the invitation procedure for the man chosen to perform the ceremony.
  language: English
  quote_policy: summarized
