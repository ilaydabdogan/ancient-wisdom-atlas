  quote: ''
  summary: The passage gives musical analysis, describes children’s ear piercing in
    the Sun Dance as an honored vow-related rite involving gifts and ritual implements,
    presents a noonday Intercessor song about holy beholding at points of the sun’s
    course, and explains a Sun and Moon song tied to an Intercessor’s dream of the
    rising sun and a hoop-and-feather ornament representing celestial and bird powers.
  language: English, with Lakota song words and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five renditions of one song were recorded and described as entirely uniform;
    the analysis emphasizes upward progressions, minor thirds, and a five-toned scale.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children participated in the Sun Dance through the piercing of their ears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Parents could vow that a child’s ears would be pierced at the next Sun Dance
    if the child survived an illness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ear piercing was considered an honor and required gifts, making it unavailable
    to poorer members of the tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ear piercing was performed publicly by an experienced person, sometimes by
    the Intercessor, with assistance from persons who cut the arms of vow-fulfillers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Parents gave gifts to the piercers; wealthy families could provide horses,
    goods, rich furs, robes, and a pillow for the child, and the used articles were
    later taken by the poor of the tribe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ear was originally pierced with a bone awl and later with a metal instrument;
    copper was inserted after puncture, and one or both ears could receive one or
    more holes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children whose ears were pierced were said to be somewhat related in status
    to men whose flesh was lacerated in the Sun Dance, and relatives held feasts in
    honor of the event.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: About noon on the first or second day of dancing, the Intercessor sang while
    the drum was silent and the assembly listened.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Noon Song glosses ask holy beings to behold at the place where the sun
    rises, where the sun passes on its course, or at the turning back of the sun.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Red Bird explained another song as concerning an Intercessor’s dream in which
    he saw the rising sun with rays streaming around it and then made an ornament
    representing this vision.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The ornament is described as a hoop with feathers fastened lightly to it;
    the hoop represents the sun, and the feathers are those of the eagle, crane, and
    hawk.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The explanation identifies the eagle as the bird of day, the crane as the
    bird of night, and the hawk as the surest bird of prey.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Song concerning the Sun and Moon, one rendition says the sun is the
    speaker’s friend and has made the speaker wear a hoop and an eagle; another says
    the moon is the speaker’s friend and a crane has made the speaker wear it.
  category: speech
  evidence_refs:
  - ev:9
