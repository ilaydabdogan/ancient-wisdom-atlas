canonical_text:
  quote: ''
  summary: The passage analyzes plotted forms of grass-dance, shuffling-foot, and
    begging songs, especially song No. 205, whose ascending final interval is associated
    with class E songs of distress and with a broader sense of indefiniteness or suspense.
    It then lists other songs sharing related musical features and topics, including
    medicine, animals, sacred stones, warriors, and a maiden. The passage next describes
    the moccasin game as a hidden-object guessing game, gives intertribal parallels
    and rules involving four moccasins and a marked bullet, and notes rhythmic features
    of Sioux moccasin-game songs in comparison with Chippewa practice. It ends by
    identifying song No. 206 as a moccasin-game song sung by Gray Hawk.
  language: English
  quote_policy: summarized
