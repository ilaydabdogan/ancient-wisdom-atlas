- id: obs:4
  text: After the killing of the buffalo was finished, the meat was dressed and prepared
    for transportation to camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: White Hawk gave a description of cutting up a buffalo cow, and Looking Elk
    pronounced the description correct; both men were said to be especially proficient
    in this phase of the buffalo hunt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a hide was to be used for a tent, it was removed whole; the animal was
    turned on its back, its head turned left under the shoulder, and its horns stuck
    in the ground to brace the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In former practice a clamshell was used as a skinning knife, and later steel
    knives were used instead of shells.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Different cutting procedures are described for removing a hide whole for a
    tent and for removing a hide split for a robe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A layer of meat was left on the inner surface of the hide and later removed
    by women; after hide removal, the tongue was taken out and described as the part
    considered most delicate by the Sioux.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Beyond the initial steps there were no established rules, though White Hawk
    said the front quarters were usually removed first, followed by work involving
    outer and inner blankets of flesh, quarters, hump, ribs, entrails, organs, and
    bones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A fresh hoof was used as a hatchet, and in old days a knife made of the shoulder
    blade was used in cutting up the animal.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A pocket-shaped piece of intestine and the paunch were turned wrong side out
    and used to hold or bundle organs and other parts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Each hunter usually provided two horses for bringing home the meat of one
    buffalo, and the meat was divided into eight named portions.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: When a hide had been split for a robe, half of the hide was placed on each
    horse and the meat was piled and held by folded hide ends; when a hide had been
    removed whole for a tent, it was made into an additional bundle and packed separately.
  category: sequence
  evidence_refs:
  - ev:10
