canonical_text:
  quote: ''
  summary: The passage analyzes a short song, noting its tonal material, repeated
    renditions, and a performance pattern of two sung repetitions, shrill cries, resumption
    of the song, and a continuous steady drumbeat. It then presents an interpreted
    and verified description of cutting up a buffalo cow after the hunt, including
    hide removal for tent or robe use, tools, treatment of meat and organs, division
    into eight portions, and transport on horses.
  language: English
  quote_policy: summarized
