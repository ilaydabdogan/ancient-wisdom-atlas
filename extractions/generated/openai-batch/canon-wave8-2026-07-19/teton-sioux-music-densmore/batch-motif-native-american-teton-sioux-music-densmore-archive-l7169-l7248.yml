canonical_text:
  quote: ''
  summary: 'The passage describes preparations and roles for a Teton Sioux spirit-releasing
    ceremony: gifts are gathered, a final feast is prepared, societies attend, mourners
    lay aside mourning, a spirit post is made and dressed to represent the deceased,
    food is offered to the post, and orphans or others in need may request help in
    the name of the spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many gifts were collected for the final feast, with relatives helping and
    women making articles by hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A designated helper called a laborer leader carried messages, supplied wood
    and water, swept the lodge, cleaned the area around the spirit bundle, and prepared
    red willow for giving away at the final feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who kept a spirit was invited to society feasts, expected to attend,
    and expected to receive valuable presents first when they were being given away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In return for favors received from societies, the spirit-keeper invited the
    societies to attend feasts held outside the lodge when the time came to release
    the spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The time for keeping a spirit varied from several months to a year or longer,
    ending with a final ceremony and feast called the act of completing the undertaking.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the final event the band gathered, societies had special tents, and society
    members participated outside the lodge; they did not enter the lodge unless they
    themselves had kept spirits.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: If several spirits were to be released, the first man who had announced his
    intention to keep a spirit was considered leader of the spirit-keepers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Early on the day of spirit releasing, the leader sent a filled pipe to an
    old man designated as master of the whole ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Weasel Bear said that on the day of release he laid aside signs of mourning,
    painted himself gaily, wore his finest attire and a war-honor feather, and his
    wife dressed like a young girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: One man was selected for each spirit; he had previously kept the spirit of
    a relative and was responsible for preparing the spirit post and other individual
    ceremonial acts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The spirit post was made in the spirit lodge, usually of cottonwood, while
    the maker sat facing east and whittled upward with the knife moving away from
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before making the post, the maker purified his hands and knife with sweet-grass
    smoke; a child's spirit post was smaller than an adult's.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A representative post for Weasel Bear's little girl had facial features worked
    with beads on buckskin, paint lines associated with a girl's prior ceremony, and
    a feather formerly worn in that ceremony.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Cases containing clothing were opened, and garments worn by the person whose
    spirit was to be released were placed on the posts; after the ceremony the garments
    were given to the man who painted the post.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: After the posts were dressed, the woman in charge of cooking brought food
    and placed a plate before each post after purifying the food in sweet-grass smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Each attendant held a round piece of pounded meat to the painted mouth of
    a spirit post.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: During the feeding of the spirits, orphans and others in need could ask in
    the name of the spirit to be fed and cared for; such requests were never refused,
    and four opportunities were given.
  category: speech
  evidence_refs:
  - ev:6
