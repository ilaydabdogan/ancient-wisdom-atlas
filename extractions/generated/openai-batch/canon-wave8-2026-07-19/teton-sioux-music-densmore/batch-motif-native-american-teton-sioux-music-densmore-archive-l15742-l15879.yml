canonical_text:
  quote: ''
  summary: 'The passage presents song No. 69, sung by Brave Buffalo, with interlinear
    glosses in which friends are asked to behold the Sacred-stone nation and all the
    stones. A musical analysis follows. The passage then relates accounts of Goose,
    a medicine-man who dreamed of and possessed sacred stones: he sends two stones
    to summon a buffalo for a skeptical trader, and later uses the stones to locate
    a rifle lost in a river. It concludes with a note on stone ownership and transfer
    involving Brave Buffalo, Chased-by-Bears, and the writer.'
  language: English with Lakota song text and glosses
  quote_policy: summarized
