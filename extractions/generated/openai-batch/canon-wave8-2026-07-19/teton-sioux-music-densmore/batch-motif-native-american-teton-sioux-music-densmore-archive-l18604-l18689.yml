canonical_text:
  quote: ''
  summary: An ethnographic account describes Brave Buffalo returning from treating
    a sick person, explaining a cure in which disease is removed through a bone and
    expelled into water. He shows a mirror marked with a new moon and star, says he
    sees disease reflected in it, and links his strength to the phases of the moon.
    The passage also records statements about a night healing song, smoke offered
    to the four winds, a song received in a dream of a wolf, and a separate song titled
    “The Sunrise,” followed by musical analysis of rests in the song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brave Buffalo’s conference with the writer was interrupted by a call to visit
    a sick person many miles away; on his return several days later he said the patient
    was recovering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brave Buffalo had a bag containing articles used in treating the sick person
    and wore a bone about 5 inches long on his hat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Brave Buffalo described removing the disease by sucking it through the bone
    and ejecting it from his mouth into a bowl of water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: From the bag he took a small mirror in an unpainted wooden frame; the mirror
    bore a drawing of a new moon and a star.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brave Buffalo said he holds the mirror before the sick person, sees the disease
    reflected in it, and can then cure the disease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Brave Buffalo identified the new moon as his sign and said his strength is
