canonical_text:
  quote: ''
  summary: The passage describes the author's methods for recording, transcribing,
    verifying, and analyzing Sioux songs; her selection and vetting of singers and
    informants; an incident in which material from an objectionable informant was
    removed; interview practices meant to avoid leading questions or forced comparisons;
    and technical issues in musical interval analysis and notation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Songs were collected by phonograph recording, then transcribed from the phonograph
    record while maintaining the same instrument speed for recording and playback.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The transcriptions used ordinary musical notation with additional special
    signs and were intended to approximate the tones produced by the singers.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Several hundred records were made, including accidental duplicate recordings;
    five duplicate cases were transcribed to show slight differences between performances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a song was known to have been imperfectly rendered, another record was
    made by a better singer and only the second record was considered.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Indians distinguish clearly among good, indifferent,
    and unreliable singers, and that the writer tried to employ only the best singers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The writer checked the reputations of principal singers and informants at
    the agency office, sometimes at the trader's store, and among their own people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some material was discarded when an informant was found unreliable.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In one case, Sun dance data were recorded from a man introduced by another
    informant while Mr. Higheagle was absent and another interpreter was used.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Mr. Higheagle returned, he reported that John Grass and other prominent
    men objected to the introduced man's involvement; all of that man's material was
    expunged.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The writer states that special precaution was needed because old music was
    associated with matters close to the heart of the Indian.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The writer tried to keep informants at ease, avoid suggestive questions, avoid
    seeking sensational material, and avoid pressing similarities to white beliefs
    or traditions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When investigations required several interviews, the combined result was translated
    back to the Indian for criticism.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The analysis of Sioux songs followed the method used for Chippewa songs, with
    added subdivisions for some intervals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage notes that the minor second was used much less often than the
    major second in the analyzed material.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Except for plus and minus signs marking tones slightly above or below pitch,
    the writer did not attempt to show deviations from the piano scale.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Intervals of the second and minor third were repeatedly noted as sung too
    small, while similar reduction was not observed in larger intervals.
  category: attribute
  evidence_refs:
  - ev:8
