canonical_text:
  quote: ''
  summary: The passage gives song words referring to Crow Indians attacking and one
    being killed, followed by a musical analysis. It then recounts an incident in
    which Eagle Shield led a Sioux war party against the Crows, entered the Crow village
    as a scout with a companion, found horses picketed inside a circle of tents, took
    two horses despite his companion's hesitation, escaped undetected, and returned
    to camp at daybreak. The Crows then became more watchful, preventing the rest
    of the Sioux war party from securing horses.
