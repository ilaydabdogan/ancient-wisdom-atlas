canonical_text:
  quote: ''
  summary: The passage gives narrative, song texts, glosses, and musical analysis
    for two songs attributed to Lone Man. In danger, Lone Man recalls a dream of riders
    in the clouds who promised help; he paints his horse with lightning streaks, prays
    to a great grandfather, and sings a danger song about his horse running as if
    flying. He later explains that, after returning to camp, he felt unworthy of the
    honor given by the thunderbirds and wanted a public humiliation to show this.
    A second song says he has been made or influenced in a sacred manner at the gathering
    of clouds before a thunderstorm. The passage also analyzes rhythmic, melodic,
    and interval features of the songs.
  language: English with Lakota/Dakota song text and glosses
  quote_policy: summarized
