canonical_text:
  quote: ''
  summary: The passage describes the Sun Dance drum and rawhide accompaniment, seating
    around the sacred pole and sacred place, the Intercessor's opening prayer, fasting
    requirements, forms of vow fulfillment involving laceration, skewers, suspension,
    buffalo skulls, and the possible use of warpath horses or equipment in the ordeal.
  language: English with transcribed Lakota song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun Dance drum is placed south of the sacred pole; a stiff rawhide is
    also beaten, producing a tone said to distinguish the religious ceremony from
    ordinary dances.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who had carried the sacred pole sit at the drum and rawhide with special
    singers; women singers sit behind the men in an outer circle and sing an octave
    higher.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Intercessor is seated west of the sacred place during the entire ceremony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: During rest periods the Leader of the Dancers lies face downward west of the
    sacred place with his head pressed against the top of a buffalo skull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man who spoke the vow for a war party has responsibility for proper vow
    fulfillment, and the dancers are attended by the men who painted them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: All who take part in the dance are required to abstain from food and water
    for the entire period of dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the conclusion of the opening dance, the Intercessor sings a prayer while
    the people listen with reverence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The translated prayer addresses Grandfather, says a voice will be sent all
    over the universe, asks to be heard, and states that the speaker will live.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The analysis notes that the song has continuous words and states that continuous
    words occur most frequently in songs connected with medicine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man can take part in the Sun Dance in six ways according to the nature of
    his vow; fasting is required in every vow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The first way of taking part consists of dancing only; the second adds laceration
    of the flesh; the remaining four involve a stick or skewer thrust through the
    flesh and strained until the flesh tears or is cut.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two common forms involve chest skewers attached by cords to the crossbar of
    the sacred pole, or buffalo skulls fastened to the flesh of the back and arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two less common severe forms involve suspending the whole body by the flesh
    of the back, or fastening the flesh of both back and chest to four poles placed
    at the corners of a square.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: If a horse carried a man on the warpath when the vow was made, the man may
    fasten the horse, bridle, or whip to the suspension thong, or hold the bridle
    and whip while dancing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Chased-by-Bears states that in fulfilling his first Sun Dance vow he had a
    skewer put through his arm and suspended from it the rawhide lariat he had carried
    on the warpath.
  category: speech
  evidence_refs:
  - ev:7
