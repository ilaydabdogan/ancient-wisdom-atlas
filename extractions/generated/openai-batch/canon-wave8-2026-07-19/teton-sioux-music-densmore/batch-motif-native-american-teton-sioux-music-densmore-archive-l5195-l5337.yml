  summary: The passage analyzes pitch intervals, keynotes, vocal rhythm, changes of
    time, and drum rhythm in Teton Sioux songs recorded on phonograph. It presents
    statistical findings about interval sizes, beginning accents, meter, time changes,
    and drumbeat grouping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that Teton Sioux singers frequently produce vocal sounds
    differing by less than a semitone, but reports no evidence from about a thousand
    phonographic song records that these sounds form a consciously used system.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts animal emotional sounds that glide between pitches with
    song, which the writer says includes an intellectual element tending toward definite
    tonal intervals.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The interval analysis reports a largest interval of a fourteenth comprising
    23 semitones and an average interval of 3.021 semitones, slightly more than a
    minor third.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The figure caption reports the smallest interval as a minor second of one
    semitone.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The keynote analysis states that 30 percent of the songs have G, G sharp or
    A flat, and A as their keynotes, which the writer connects with the natural vocal
    range of the singers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that phonograph playback speed is kept the same for transcription
    as for recording, and that pitch is determined by comparison with a piano tuned
    to standard pitch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The rhythm analysis of the voice states that 61 percent of the songs begin
    on the accented part of the measure.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that the first measure is in double time in 54 percent
    of the songs, triple time in 40 percent, and combinations of these rhythms in
    6 percent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that a change of time or measure length is found in 84
    percent of the songs, commonly affecting single measures or a few measures.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The drum rhythm analysis excludes 234 songs recorded without drum accompaniment.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: For songs recorded with drum, the passage reports that 56 percent have unaccented
    drumbeat pulsation, 6 percent have drumbeats accented in groups of two, and more
    than 34 percent have triple division.
  category: attribute
  evidence_refs:
  - ev:10
