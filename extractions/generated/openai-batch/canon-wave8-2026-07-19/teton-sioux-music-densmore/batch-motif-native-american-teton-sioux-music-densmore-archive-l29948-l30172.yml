  quote: ''
  summary: The passage gives song text, glosses, and analysis for a duplicated song
    sung by Kills-at-Night and his wife, then describes Swift Dog's pictorially recorded
    hunting and war exploits and several associated horse-capture songs. Swift Dog
    recounts a cold-season raid into Crow country, a river crossing, the driving of
    Crow horses across the river, later horse-taking with his brother-in-law, and
    another warpath episode near the Black Hills in which he captured a horse and
    gave it to his sister.
  language: English, with Lakota/Dakota song text and English glosses
  quote_policy: summarized
