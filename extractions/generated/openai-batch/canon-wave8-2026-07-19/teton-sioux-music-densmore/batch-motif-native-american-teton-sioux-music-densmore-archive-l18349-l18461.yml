canonical_text:
  quote: ''
  summary: The passage compares drum and voice tempo for songs concerning sacred stones,
    comments on melodic plot classes, then describes Sioux treatment of the sick as
    governed by dreams. It distinguishes treatment by sacred stones, conjuring, and
    herbs; names types of medicine-men; and describes a sacred-stone healing demonstration
    in a dark tipi involving a pipe, binding, songs, strange sounds, animal voices,
    flying objects, punishment of unbelievers, firelight, and the medicine-man appearing
    freed near the top of the tipi. Brave Buffalo also describes rolling a stone on
    a patient to locate illness and allowing the patient to hold the stone in the
    mouth for internal effect.
  language: English
  quote_policy: summarized
