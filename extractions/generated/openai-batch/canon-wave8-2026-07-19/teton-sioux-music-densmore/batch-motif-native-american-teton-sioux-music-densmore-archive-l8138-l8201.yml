canonical_text:
  quote: ''
  summary: The passage describes ceremonial objects arranged by Chased-by-Bears with
    a buffalo skull, sage, and pipe; his prone gesture with his head against the skull;
    the covering of a white cross and bare earth with sage; and a general description
    of the Teton Sioux Sun Dance as an annual midsummer tribal religious gathering
    organized around a circular camp, sweat lodges, a central dance area, eastward
    opening, leader's tent, and council tent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A buffalo skull was brought to the place, and Chased-by-Bears spread fresh
    sage beside the sacred place and laid the skull on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chased-by-Bears made a frame to support a pipe and placed a decorated pipe
    in ceremonial position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pipe had been decorated by the woman who decorated the Sun-dance pipe
    for the last tribal ceremony.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Chased-by-Bears threw himself face downward on the ground with his head pressed
    against the top of the buffalo skull.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prone position is described as one permitted to a Leader of the Dancers
    when resting during the Sun Dance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The white cross was obliterated, and fresh sage was strewn over the bare brown
