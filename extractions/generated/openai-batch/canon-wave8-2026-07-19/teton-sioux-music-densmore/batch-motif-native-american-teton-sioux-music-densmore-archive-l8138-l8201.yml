  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun Dance is called by the Sioux Wi wai]ʼyai)g wa^ʼpi and is literally
    translated in the passage as a Sun-watching dance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes the Sun Dance as the Sioux's only tribal gathering of
    a religious character.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Sun Dance was held every year at the full moon of midsummer, when trees
    were in full leaf, June berries were ripe, and wild sage was fully grown.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The place of the Sun Dance changed from year to year but was known to the
    tribe; companies of Sioux traveled across the prairie to attend.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Arriving bands erected tipis in the accustomed parts of the tribal circle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each band built a vapor lodge, described parenthetically as a sweat bath,
    for those who took part in the dance, and also a larger lodge where dancers assembled
    before and after the ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Sun Dance was held in the center of the great circle of tents.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The opening of the tribal circle was toward the East, and the Leader of the
