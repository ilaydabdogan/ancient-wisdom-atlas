  quote: ''
  summary: The passage explains a graphic method for plotting Sioux melodies by marking
    accented tones on a coordinate grid and connecting the points to show melodic
    trend. It says the representation omits some details for simplicity. After plotting
    and comparing melodies, the author identifies five primary melodic outline types,
    including Type A as descending, Type B as horizontal then descending, and Type
    C as involving repetition of the lowest tone or keynote. The author also tentatively
    suggests a relation between song content and melodic form for some types.
