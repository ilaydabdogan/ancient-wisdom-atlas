  summary: The passage contains song texts, glosses, and brief musical analyses from
    Teton Sioux Music. It includes a horse song fragment comparing the speaker's horse
    to the thunderbird, a note on a warrior's pre-battle gesture of willingness to
    die for another party member, song No. 141 concerning honor and desire, song No.
    142 stating that only the earth endures, and song No. 148 tied to a young man
    who went to war after a false report about his intended bride and asked that she
    be told he hoped to be killed.
