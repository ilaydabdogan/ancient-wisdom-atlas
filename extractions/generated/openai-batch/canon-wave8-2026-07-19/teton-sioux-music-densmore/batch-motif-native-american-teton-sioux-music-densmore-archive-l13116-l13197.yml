canonical_text:
  quote: "“the elk, which is the emblem of beauty, gallantry, and protection”"
  summary: The passage explains the significance of elk dreams in Teton Sioux ceremonial
    song tradition. Shooter describes the elk as an emblem of youthful male strength,
    beauty, gallantry, protection, and the elk tooth as an emblem of long life. Brave
    Buffalo narrates a dream in which an unnamed visitor leads him on a long difficult
    journey to a beautiful yellow lodge. Inside are drawings of a crane and crow holding
    pipes, brush-filled space, and occupants later identified as elks. The elks test
    him, accept him as a friend, and teach him a wordless song, followed by musical
    analysis of the song.
  language: English
  quote_policy: quoted
