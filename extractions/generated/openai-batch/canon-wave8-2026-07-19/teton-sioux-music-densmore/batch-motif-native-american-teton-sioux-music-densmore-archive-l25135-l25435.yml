canonical_text:
  quote: ''
  summary: 'The passage gives song texts, English glosses, singer attributions, and
    musical analyses for several Teton Sioux songs. The song texts include: friends
    being told to go on while a younger brother comes on the warpath; a speaker who
    considered himself a wolf, ate nothing, became tired, hears owls hooting, and
    fears the night; a speaker seeking adventures in all lands and walking amid hardships;
    a speaker praying to Wakan Tanka and receiving horses; and a partial song titled
    “Those Hills I Trod Upon.”'
