canonical_text:
  quote: ''
  summary: The passage describes a council of Teton Sioux men reviewing statements
    about the Sun Dance, passing a pipe in silence, reaching consensus, and visiting
    the 1882 Sun Dance site near Standing Rock Agency. At the site they identify traces
    of the sacred place, a broken buffalo skull with red paint, the pole location,
    the shade-house outline, and entrance posts. Mr. Higheagle places sage, the buffalo
    skull, and a Sun-dance pipe beside the sacred place. Participants put on regalia,
    pass the pipe, recall scars and memories, and one old man mourns departed family.
  language: English
  quote_policy: summarized
