canonical_text:
  quote: I will give my flesh and blood that I may conquer my enemies.
  summary: A first-person speaker recounts a war expedition connected with a Sun Dance
    vow. He vows flesh and blood to the great sun for success in war, later fulfills
    the vow with cuts on his arms, describes coups, raids, and combat, sings a death
    song when expecting to die, speaks of a single path followed in death, spares
    two Crow captives, and is appointed a chief because sparing enemies is judged
    brave.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he went on 45 war parties, traveled along the west branch
    of the Missouri River toward snow-covered mountains, and rode a white horse with
    brown ears on the expedition when he first killed an enemy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the expedition, a Sun Dance was held in the village, and leaders invited
    those who wanted success in war to join it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Intercessor asked participants what offering they would make to the great
    sun, naming tobacco and flesh and blood as possible offerings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker vowed to give his flesh and blood so that he might conquer his
    enemies, and later fulfilled the vow after returning victorious by receiving arm
    cuts described as 18 wounds in all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After five days of travel, scouts reported a Crow buffalo hunt; the party
    encountered armed Crow men, struck them with coup sticks while alive, and killed
    several enemies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker says his Sun Dance vow made him fearless when he rode up to and
    struck an armed Crow man near a camp in the timber.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Near a Blackfoot village, the speaker put on his war bonnet, mounted his white
    horse, charged the village, took about 50 horses, and was not hit by shots fired
    at him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the homeward journey at Bear Butte, the speaker stayed behind with two
    young men because some horses were tired, and he saw four Crow warriors approaching.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the young men proposed running and hiding, the speaker told them that
    there was only one path to go by no matter how or where one dies, and urged them
    to stand together and fight.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The speaker sang his death song because he felt sure he was soon to die, while
    pointing his gun.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: An immense rock with a crack and a cherry tree growing in the crack stood
    in front of the speaker; he watched the approaching warriors through the crack,
    and a cherry branch interfered with his gun when he fired.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: The speaker fought hand to hand with a gun-carrying Crow man; his companions
    helped take the gun, and the speaker killed the man.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Two Crow captives said they wanted to live and offered their bodies and the
    right to wear feathers; the speaker and companions gave them back their lives.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The speaker says he was appointed a chief because sparing the lives of two
    enemies was considered a brave deed.
  category: relationship
  evidence_refs:
  - ev:12
