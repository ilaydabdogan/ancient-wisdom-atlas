  quote: ''
  summary: The passage presents three Teton Sioux songs associated with war, return,
    and mourning. It describes intense mourning for relatives killed on the warpath,
    including bodily gashing, cropped hair, skewers through flesh, public movement
    around the village circle, and songs naming or honoring the dead. It also gives
    Mrs. Hattie Lawrence’s account of White Butterfly, killed by the Crows, and another
    son mourned by her aunt.
  language: English with Lakota song texts and glosses
