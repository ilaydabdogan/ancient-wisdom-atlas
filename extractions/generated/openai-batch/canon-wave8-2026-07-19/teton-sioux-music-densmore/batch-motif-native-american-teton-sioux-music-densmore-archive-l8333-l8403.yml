canonical_text:
  quote: ''
  summary: The passage describes war-party vows to take part in the next Sun Dance,
    the gestures and offerings accompanying such vows, private promised ordeals, preparation
    for fulfillment, sanctions for neglected vows, and the selection and qualifications
    of Sun Dance ceremonial officers including the Intercessor and Leader of the Dancers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When in danger, an entire war party customarily vowed that its members would
    take part in the next Sun Dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The vow was usually made at sunrise and spoken by a warrior who had fulfilled
    a similar vow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If time allowed, each man held an offering in his left hand and raised his
    right hand while the vow was spoken; some varied the rite by bowing or slowly
    lowering the right hand toward the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The public vow was to take part in the dance, while each man held a private
    vow about the specific part he would take.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Private vows could include dancing, suspension by the flesh, or many gashes
    cut in the arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The vowed acts were described as expressions of thankfulness if the men were
    reunited with relatives or friends, but the vow still had to be fulfilled even
    after defeat or loss.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Between return and the Sun Dance, vow-makers prepared to fulfill their vows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Failure to fulfill a vow was said to be exacted by the forces of nature, including
    death by lightning or disaster to family or horses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Old men knew of every vow and watched for its fulfillment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the four days before the Sun Dance, military societies met to elect
    the Intercessor, the Leader of the Dancers, four young men to select the tree
    for the sacred pole, and four young women to cut it down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chiefs were present in the council tent whenever business was transacted.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Intercessor's duties included prayers for the people, singing songs while
    performing ceremonial acts, painting the sacred pole, and preparing the sacred
    place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Intercessor's songs had to be composed by him or purchased from someone
    who had previously held the office and instructed him.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: Red Bird stated that an unworthy man would not be appointed Intercessor because
    he represented the people in prayers and offerings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Red Bird said that if the Intercessor were not a good man, Wakai)'t{mka might
    not answer petitions or grant fair weather and might send disaster on the tribe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: Chased-by-Bears said that no man who had committed a great wrong could act
    as Intercessor, even after repentance.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Leader of the Dancers was usually the warrior who first returned successful
    from the warpath and wished to act in that office after making a Sun Dance vow.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The Leader of the Dancers had to provide offerings for the sacred pole, buffalo
    fat for embedding it, a Sun-dance pipe, and a defect-free buffalo skull for the
    pipe to rest upon.
  category: object
  evidence_refs:
  - ev:10
