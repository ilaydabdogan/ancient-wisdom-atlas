  quote: ''
  summary: The passage describes the White Horse Riders as principally old warriors
    who painted white horses with hoofprint and hand designs to display brave deeds.
    It describes a parade custom in which the riders fired guns near the tent of a
    man wounded in war, after which women prepared food for people without someone
    to cook for them. It also notes that White Horse Riders songs were popular and
    often had their words changed.
