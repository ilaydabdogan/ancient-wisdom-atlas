canonical_text:
  quote: ''
  summary: 'The passage describes preparatory objects and actions for the Sun dance:
    a decorated pipe furnished by the Leader of the Dancers, vow-related offerings
    by dancers, tobacco packets, an enacted agreement for applying body paint using
    a pipe, rehearsals, announcements by the Crier, military society dances and feasts,
    and a Chief song used before the ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun-dance pipe was furnished by the Leader of the Dancers and decorated,
    before the ceremony, by a skillful woman using porcupine-quill work that did not
    cover the whole stem.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who fulfilled vows prepared offerings before the ceremony; the value of
    the offerings varied with the man's wealth and could include a pipe, tobacco,
    a buffalo robe, other goods, or only tobacco.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dancers' offerings and the Intercessor's offerings were both described
    as gifts to Wakai}'tai)ka, but the Intercessor's goods were left undisturbed on
    the prairie while dancers' goods could be appropriated by anyone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red Bird explained the difference by saying that the Intercessor represented
    the whole tribe, whereas the dancers were all alike and their offerings were among
    themselves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tobacco offered by dancers was tied into small packets, each about a pipeful,
    and each packet was fastened to a stick.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Red Bird and Lone Man enacted a request for body painting: closed hands were
    forced open, a pipe was placed in them, the pipe was accepted and smoked, and
    its return was requested and resisted before being pried away.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The enacted exchange was said to constitute an agreement that one man would
    paint the body of the other.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: For four nights immediately before the Sun dance, people assigned to drum,
    sing, or dance rehearsed and were instructed in their parts of the ceremony.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Crier made announcements, and an old man was preferred for the role because
    old men were said to be more careful than young men in making announcements.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Crier moved around the camp circle on horseback, close to tent doors,
    dressed with a single upright eagle feather and carrying an eagle-wing fan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Crier announced council decisions, Intercessor commands, or events of
    the day, and answered inquiries because the Intercessor and Leader of the Dancers
    were expected to speak only when necessary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the days before the Sun dance, military societies held braves' dances,
    followed by feasts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Strong Heart society dance could be announced by the Crier with a summons
    telling the Strong Hearts they were going to eat to their hearts' content and
    inviting them to come.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Members of the Strong Heart society came in fine array, paraded around the
    camp circle before the dance, and sang songs used on the warpath.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A Chief song titled "We Are Coming" is given as commonly used at the dances
    preceding a Sun dance.
  category: speech
  evidence_refs:
  - ev:9
