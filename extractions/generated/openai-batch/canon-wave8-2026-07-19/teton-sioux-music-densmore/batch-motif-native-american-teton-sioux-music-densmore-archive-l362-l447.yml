canonical_text:
  quote: ''
  summary: 'The passage describes methods and reference frameworks for transcribing
    and analyzing Teton Sioux songs: interval-preference experiments, repeated readings
    of phonograph cylinders, handling of repetitions and pauses, Helmholtz five-toned
    scales, exclusion of repeated parts from interval counts, comparison with Chippewa
    song introductions, and a note that some song words are in a sacred esoteric language
    that disguises meaning.'
  language: English
  quote_policy: summarized
