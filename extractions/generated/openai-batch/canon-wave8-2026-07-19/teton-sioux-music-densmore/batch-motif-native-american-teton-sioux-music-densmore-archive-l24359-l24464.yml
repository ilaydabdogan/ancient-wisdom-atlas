canonical_text:
  quote: ''
  summary: The passage presents a song analysis followed by an account of the Miwa'tani
    society among the Teton Sioux, including its reported owl-related origin, name
    associations, offices, obligations, rules for collecting provisions, purpose of
    friendliness and helpfulness, and an initiation sequence involving a four-day
    partial fast and owl-feather headdresses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Song No. 121 is identified as a song of the Badger Society, sung by Gray Hawk,
    with drum tempo and analytical comments on tonality, repetitions, triplet figures,
    downward progressions, and drum-voice timing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Miwa'tani is described as an important military society among the Teton
    Sioux whose members were exempt from aki'cita duty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Charging Thunder reported that he belonged to the Miwa'tani society and that
    it originated long ago with a man who dreamed of an owl.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The society was sometimes called the Owl Society, but the passage says this
    was erroneous; the word Miwa'tani is described as not fully explainable in common
    Sioux speech.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited account reports that an owl-being, while conferring the ritual, said
    its name was Miwa'tani.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports a named association between Miwa'tani, Mandan, and the
    Omaha word Mawa'dani, and mentions a Mandan dancing society among the Omaha.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Miwa'tani organization is listed as including leaders, sash bearers or
    bonnet men, whip bearers, a food passer, lay members, a drum bearer, singers,
    and a herald.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Charging Thunder described the society as difficult to enter and exacting
    in its requirements.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Each member pledged to sacrifice his own life in defense of a wounded member
    if necessary on the warpath.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the society needed something, an appointed person collected it, and the
    demand was not refused.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: An officer could take withheld provisions for medicine-men conducting ceremonies
    or for the organization as a whole.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Charging Thunder stated that the society's purpose was to promote friendliness
    and helpfulness among members.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Important meetings of the society were for initiation of new members; accepted
    applicants were notified by the crier.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before initiation, candidates and members partially fasted for four days in
    the lodge.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: During the fast, once each day the leader brought water, dipped sweet grass
    into it, and gave the sweet grass with a very small piece of buffalo meat to each
    member.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: On the initiation day, officers wearing owl-feather headdresses sat in the
    place of honor opposite the lodge entrance and held owl-feather headdresses for
    the new members.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Members of the tribe gathered to witness the installation of the new members.
  category: action
  evidence_refs:
  - ev:10
