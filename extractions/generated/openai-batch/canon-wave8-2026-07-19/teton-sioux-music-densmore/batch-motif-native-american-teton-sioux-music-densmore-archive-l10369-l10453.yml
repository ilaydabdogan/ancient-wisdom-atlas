canonical_text:
  quote: ''
  summary: 'The passage describes Sun Dance articles and ordeals: cutting implements,
    suspension by thongs at a pole in sunlight, release by dancing, cutting, horses,
    or gifts, carrying buffalo skulls attached to the flesh, more severe forms of
    suspension, and public prayer for the tribe. Red Bird explains the vow as publicly
    fulfilled for communal benefit and as more effective before Waka^^ta^ka than careless
    or private action.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A knife used in the Sun Dance cutting is described as having a blade ground
    to a point, with the handle and part of the blade wrapped in rawhide.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suspension thongs were usually long enough that only the suspended man's toes
    touched the ground, with height adjusted somewhat to physical strength.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When first suspended, each man was given a stick with which he could raise
    his body slightly and ease strain on the flesh of his chest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men were suspended soon after 9 o'clock in the morning on the north side
    of the pole, with upraised faces in the full glare of the sun.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The suspended man was expected to free himself as soon as possible by dancing
    until the flesh tore; if unable, horses could be given for release, the cutter
    could cut the flesh, or the man could be jerked downward until the flesh gave
    way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: While suspended, each man held an eagle-bone whistle in his mouth and blew
    it from time to time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man who vowed to carry buffalo skulls could carry from two to eight; skulls
    were fastened by thongs attached to sticks inserted through lifted flesh and passed
    through the skulls' nostril openings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The placement of buffalo skulls varied by number: a first pair was attached
    near the spine, a second pair between spine and shoulder point, a third pair to
    the upper arm, and additional skulls to the upper back or more than one to a thong.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When several buffalo skulls were used, their weight could force the man to
    lean forward on a stick and dance in a bowed position.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Buffalo Boy stated that he carried six buffalo skulls for four or five hours
    and was released by cutting the flesh after the proper number of horses was given.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A more severe form involved hanging the body clear of the ground by thongs
    passed through flesh on each side of the lower back; an instance is reported of
    a man riding to the sacred pole and then being suspended by his back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage calls suspension between four poles the most severe form, with
    thongs through chest and back and the body hanging so only the toes touched the
    ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: While dancing, the men prayed for all in the tribe, especially the sick and
    the old.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Red Bird says that a warrior fulfilling his vow wanted the whole tribe to
    share in its benefits, and that Waka^^ta^ka was believed more ready to grant requests
    of people who made and fulfilled vows.
  category: speech
  evidence_refs:
  - ev:8
