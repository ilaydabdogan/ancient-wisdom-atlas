  summary: Song No. 167, titled “A Prairie Fire” and sung by One Feather, gives a
    song text in which a first-person speaker says he or they started a prairie fire
    while the addressee was intent on women and hindered by them. The analysis describes
    the melody and notes comparison with other songs ending in a descending fourth.
    The excerpt then introduces a following commemorative song for Sitting Crow, a
    brave man whose death caused sorrow among the Sioux because he had to be left
    where he fell.
