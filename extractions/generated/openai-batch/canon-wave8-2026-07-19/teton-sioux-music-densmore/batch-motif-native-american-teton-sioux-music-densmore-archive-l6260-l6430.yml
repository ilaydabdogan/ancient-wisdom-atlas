canonical_text:
  quote: ''
  summary: The White Buffalo Maiden addresses the chosen chief, gives him a pipe for
    the Sioux tribe, lights it, and offers it to WakaQ^taijka, the earth, and the
    four winds. She leaves the tent to the left and becomes a white buffalo calf.
    The passage then explains the pipe’s lineage, name, duplicated forms, leftward
    passing rule, required offerings, and a song attributed to the Maiden and used
    in the Spirit-keeping ceremony.
  language: English with transcribed Lakota song text and translated song words
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The White Buffalo Maiden tells the chief that he has been chosen by the people
    to receive the pipe in the name of the whole Sioux tribe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: She says WakaQ^taijka is pleased, states that the pipe must be respected and
    reverenced, and asks WakaQ^taijka to take pity and provide what is needed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: She takes a buffalo chip from the ground, lights the pipe, points the pipe
    stem to the sky, earth, and cardinal points, and offers the pipe to Wakaq^'taQka,
    the earth, and the four winds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: She takes a puff from the pipe, passes it to the chief, says her assigned
    work is done, refuses an escort, and asks that the way be cleared before her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: She rises, leaves the pipe with the chief, exits the tent on the left side,
    walks slowly, and becomes a white buffalo calf outside the entrance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief orders the people to remain quiet until their sister is out of sight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief who received the pipe is identified as Buffalo Stands Upward, and
    the pipe is said to have been handed down through generations to Elk Head at Thunder
    Butte.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pipe is named the White Buffalo Calf pipe; duplicates are made, similar
    pipes are carried by male members of the tribe, and the stem is made to resemble
    the windpipe of a calf.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the pipe is used in a smoking circle or by two men smoking together,
    it is passed to the left because the White Buffalo Maiden went away in that direction;
    the person who lights it must make an offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A song is attributed to the White Buffalo Maiden as she entered the camp and
    is also sung in the Spirit-keeping ceremony when a white buffalo robe is used.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The translated song words describe walking with visible breath, walking toward
    the Buffalo nation, having the voice heard, and walking for a scarlet relic.
  category: speech
  evidence_refs:
  - ev:9
