canonical_text:
  quote: ''
  summary: The passage discusses Sioux sacred terminology and song imagery, gives
    a musical analysis, and describes the placement of a sacred pole, a circular dance
    enclosure, a prepared sacred square of earth with cross-lines and offerings, eagle
    feathers, sage, and a buffalo skull. It also states that the Intercessor sang
    while preparing the earth square and that the assembled people were silent.
  language: English
  quote_policy: summarized
