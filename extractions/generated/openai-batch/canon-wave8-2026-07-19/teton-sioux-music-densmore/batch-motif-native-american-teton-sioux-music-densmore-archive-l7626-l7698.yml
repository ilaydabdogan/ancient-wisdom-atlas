  quote: ''
  summary: 'Biographical notices describe several men in relation to the Teton Sioux
    Sun Dance: leadership, vows, bodily cutting, suspension to the pole, buffalo skulls
    fastened to flesh, selection of the Sun-dance pole, intercessory instruction,
    and a brief sun-centered vision.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chased-by-Bears took part in the Sun Dance twice as Leader of the Dancers,
    was present at the final Teton Sun Dance, and first participated in 1867 at age
    24 after speaking a war-party vow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Sun dances, Chased-by-Bears cut men's arms, suspended them to the pole,
