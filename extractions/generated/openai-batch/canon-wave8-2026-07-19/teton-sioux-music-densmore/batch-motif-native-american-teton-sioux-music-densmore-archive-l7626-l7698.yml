  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Chased-by-Bears reported a vision while dancing in the Sun Dance and looking
    steadily at the sun: he saw a man beneath the sun whose face was painted red and
    white.'
  category: action
  evidence_refs:
  - ev:3
