canonical_text:
  quote: ''
  summary: The passage gives two Fox Society song texts with translations and musical
    analysis, then introduces the Crow-owners society as a Plains military and social
    organization. It describes crow, raven, and wolf associations with war, soldiers,
    and marshals in nearby Plains traditions, notes comparable Crow/Raven societies
    in several groups, and lists the offices and insignia of the Teton Sioux Crow-owners
    society.
  language: English with Lakota/Dakota terms transcribed
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One Fox Society song is glossed as saying that whenever the Fox Society proposes
    to do anything, the speaker considers himself foremost, but now is having a hard
    time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second Fox Society song, sung by Shooter, addresses friends and says that
    whatever they council about, the speaker considers it a difficult undertaking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second Fox Society song is analyzed as minor in tonality, lacking the
    seventh and fourth tones of the complete octave, with an octave compass and three
    recorded renditions showing no differences.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Crow-owners society is introduced as one of the military and social organizations
    widespread among Plains tribes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Omaha, the wolf and crow are reported as connected with carnage
    and with the office of soldiers, a designation for men who acted as marshals on
    the annual tribal hunt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among northern tribes, the crow and raven are described as connected with
    success in war, and the bird skin is described as worn around the neck or attached
    to a spear carried in war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the Teton Sioux Crow-owners society and the Mandan
    Ravenbearers society appear similar in essential features.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Crow-owners organization is listed as including leaders, lance bearers,
