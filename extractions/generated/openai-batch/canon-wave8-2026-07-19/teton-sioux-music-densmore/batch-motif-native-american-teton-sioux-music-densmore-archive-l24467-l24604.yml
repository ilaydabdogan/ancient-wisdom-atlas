canonical_text:
  quote: ''
  summary: 'The passage describes an admission rite for a Sioux society: candidates
    carry live coals around a lodge and place them on softened earth without being
    burned, after which owl-feather headdresses are held in sweet-grass smoke and
    placed on their heads while a ceremonial song is sung. It then describes post-admission
    obligations, society paraphernalia including a whistle and rattle, owl-feather
    adornment, and a brief transition to the White Horse Riders.'
  language: English
  quote_policy: summarized
