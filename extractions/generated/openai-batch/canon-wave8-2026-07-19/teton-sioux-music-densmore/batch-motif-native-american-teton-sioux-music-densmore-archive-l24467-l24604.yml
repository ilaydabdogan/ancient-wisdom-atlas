- id: obs:3
  text: Owl-feather headdresses had been prepared for new members; they were long
    like war bonnets but made of owl feathers instead of eagle feathers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sweet grass was placed on the heap of coals, the headdresses were held in
    the fragrant smoke, and then the headdresses were placed on the newly installed
