- id: obs:1
  text: Men seeking admission were required to carry live coals in their hands, turn
    to the left, walk around the lodge, and finally roll the coals onto a softened-earth
    space.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who completed the coal-carrying action without being burned was considered
    qualified to become a member of the society.
  category: relationship
  evidence_refs:
