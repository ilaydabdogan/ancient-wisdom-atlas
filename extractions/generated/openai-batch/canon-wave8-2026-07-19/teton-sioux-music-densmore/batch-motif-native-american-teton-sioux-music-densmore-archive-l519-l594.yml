canonical_text:
  quote: ''
  summary: The passage describes Sioux musical customs in comparison with Chippewa
    customs, including ceremonial song reticence, personal song ownership, replacement
    of hero names in war songs, drum-rhythm practices, gathering arrangements around
    the drum, women singing during dancing songs, and informants’ explanations of
    song-ending styles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Sioux musical customs do not materially differ from
    Chippewa customs in reticence about old ceremonial and medicine songs, acknowledged
    ownership of personal songs, and replacing a half-forgotten hero’s name in a war
    song with that of a new favorite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Sioux, the drum is said to have more rhythmic freedom than among
    the Chippewa, though it is always beaten in rapid tremolo during medicine songs
    and when a man relates his dreams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage notes several relationships between drum and voice, including
    ratios, independence, variance during a song, and coincidence in closing measures
    in some songs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a gathering, one man acts as leader of the singers, who sit around the
    drum.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When many people are dancing, singers sit close around the drum, and each
    man beats the drum as he sings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A recognized singer may bring his own decorated drumstick, though ordinary
    cloth-wound sticks are commonly used.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a singer at the drum becomes tired, he lays down his drumstick and is replaced
    by someone who had been dancing or sitting with spectators.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The leader starts every song, and the other singers enter more quickly if
    the song is easy and more carefully if it is new and hard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Most songs may be sung an indefinite number of times, and the leader signals
    the close with two sharp taps on the drum, after which the song is sung only once.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sioux women usually sing with men during dancing songs, sitting on the ground
    in a circle behind the drummers and singing in high falsetto an octave above the
    men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that this participation by women in dancing songs is not
    the custom among the Chippewa.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports that variations in time or intonation are found more often
    in unimportant parts of a song than in important parts, among both Sioux and Chippewa.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Informants said there were different ways of ending songs and that a man could
    tell the kind of song by the way it ended.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: 'Used-as-a-Shield and other old-time singers identified two ending styles:
    stopping short and letting the tone die away gradually.'
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: After trying over many old songs, the informants associated stopping short
    with grass-dance, buffalo-dance, and Crow-owner’s society songs, and trailing
    off the tone with war songs and similar songs.
  category: speech
  evidence_refs:
  - ev:13
