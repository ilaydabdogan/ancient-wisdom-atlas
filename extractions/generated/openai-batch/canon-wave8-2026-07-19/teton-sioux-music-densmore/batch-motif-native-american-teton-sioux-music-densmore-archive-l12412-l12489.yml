canonical_text:
  quote: ''
  summary: The passage describes the Heyo'ka Ka'ga ceremony as a public humiliation
    ceremony chiefly for people who have dreamed of the thunderbirds. A thunderbird
    dreamer signals intent with offerings, uses poor clothing and a poor tent, may
    employ special marks or offerings expressing humility, and engages a medicine-man
    to lead the ceremony. A crier announces the dream and requests other thunderbird
    dreamers to join. The medicine-man and dreamer go around the tribal circle, return
    to sing and tell dreams, and prepare a symbolic offering of meat in a pot of boiling
    water over a fire. Lone Man explains the water, fire, meat, and steam as representing
    clouds, sun, animals, and sky-clouds through which Wakaŋtanka cares for the people.
    The cooked meat is removed by plunging bare arms into boiling water, testing medicines
    against scalding.
  language: English
  quote_policy: summarized
