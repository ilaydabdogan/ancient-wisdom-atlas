canonical_text:
  quote: ''
  summary: The passage notes a similar Chippewa banner-carrying custom, describes
    the Strong Heart society's turtle-marked rawhide rattle, and reports a Strong
    Heart custom in which members met to sing, killed selected dogs around the village,
    and used the owners' restraint as a test of self-control before preparing the
    dogs for a feast. It also gives a Strong Heart Society song sung by Eagle Shield,
    with a translated warning that those who run away will not be admitted.
  language: English
