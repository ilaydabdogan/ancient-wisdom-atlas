canonical_text:
  quote: ''
  summary: The passage gives a song text and musical analysis, then recounts Bull
    Head's witnessed account of White Shield using a sacred stone in a house to recover
    missing articles. The stone is held in White Shield's hand, disappears, returns
    at the door, gives a message that the articles were stolen and thrown into the
    river, and the articles are found the next morning where they had last been seen.
    The passage also notes a group of dream songs concerning sacred stones and states
    that sacred stones were invoked to locate an enemy camp and a missing man.
  language: English with Lakota transcription and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The song gloss says that on this day something is claimed by the speaker,
    a voice is sent to a man, and now he is here.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The musical analysis states that the song begins on the dominant above the
    tonic and ends on the dominant below the tonic, with two-thirds of progressions
    downward and one raised-fourth accidental.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described performance took place in a house, and the stone was held in
    White Shield's hand rather than laid on the ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bull Head is identified as the person who gave the narrative and as a witness
    to the performance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man who had lost part of a harness asked White Shield to find the missing
    harness part and also a tobacco bag and pipe, because White Shield was known to
    recover lost articles with the aid of sacred stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: White Shield held the stone in his palm, said it would disappear, and Bull
    Head reported that it suddenly vanished while he watched.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the length of a stone's absence depends on the distance
    it must travel to find the lost object; in this case the stone was absent a long
    time.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A rattle was heard at the door; White Shield stopped the singing, said the
    stone had returned, opened the door, and the stone was found on the doorstep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stone's message said that a certain man had taken the missing articles
    and thrown them into the river, and that they would be brought back that night
    to the place where they had last been seen.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next morning all the missing articles were found where they had last been
