canonical_text:
  quote: ''
  summary: The passage introduces the writer's 1911 study of the Teton Sioux Sun Dance
    at Standing Rock, lists comparative references to Sun Dance or related ceremonies
    among neighboring Plains peoples, and presents Red Weasel as a principal Teton
    authority. Red Weasel recounts training by Dreamer-of-the-Sun for the office of
    Intercessor, emphasizes reverence for Waka;)^tai)ka, and states that sung prayer
    is heard sooner. The passage also notes Red Weasel's bodily participation in the
    dance through suspension from a pole and cuts on his arms, and records community
    esteem linking his presence with fine weather.
  language: English
