  quote: ''
  summary: The passage first notes a return to a creek and joining the Sioux at their
    last camp of the year. It then analyzes Teton Sioux war songs, called wolf songs,
    describing animal referents, horse and buffalo songs, motion themes, melodic plot
    classes, a buffalo dream association, suffering buffalo imagery, and a division
    of war songs into older and more recent analysis groups tied to military societies.
  language: English
