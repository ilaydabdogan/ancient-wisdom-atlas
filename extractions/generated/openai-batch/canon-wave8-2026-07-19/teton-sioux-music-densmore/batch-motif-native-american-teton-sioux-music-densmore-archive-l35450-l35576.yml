canonical_text:
  quote: ''
  summary: The passage describes the Teton Sioux begging dance as a custom in which
    groups sought food or goods by singing, praising, or taunting at tents until donations
    were given. Councils could request food from honored men through decorated sticks
    placed before tents, with different colors or markings indicating war leadership,
    victory, or wounds. The passage also records a begging song associated with four
    old women connected to an absent warrior, and a later song asking for coffee and
    bread.
  language: English
