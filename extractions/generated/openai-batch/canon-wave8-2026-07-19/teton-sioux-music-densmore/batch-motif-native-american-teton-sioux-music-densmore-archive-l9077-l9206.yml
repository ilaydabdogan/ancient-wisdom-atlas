  summary: The passage gives song text and musical analysis, then describes a ceremonial
    sequence in which a tree is cut, treated first as an enemy and then as a sacred
    pole. Medicine men burn sweet grass and offerings are made. The pole must not
    touch the ground or be stepped over; an anecdote describes a woman who violated
    this taboo and was later killed in a horse accident, interpreted as punishment.
    Men carry the pole to camp in procession while victory songs are sung.
