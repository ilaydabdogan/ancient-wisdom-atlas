canonical_text:
  quote: ''
  summary: The passage reports Brave Buffalo's account of a childhood search to understand
    the maker of nature, a dream in which a small round stone identified Wakan Tanka
    and promised supernatural help, and subsequent practices involving sacred stones
    used for healing, observation, intercession, and associations with high buttes,
    round celestial bodies, thunderbird, and lightning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brave Buffalo is described as a prominent medicine-man of the Standing Rock
    Reservation, about 73 years old at the time of giving information, and the son
    of a leading medicine-man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: As a child, Brave Buffalo looked at land, rivers, sky, animals, trees, bushes,
    flowers, and moss-covered stones while seeking to understand the great power that
    made them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a dream, a small round stone appeared to Brave Buffalo and told him that
    the maker of all was Wakan Tanka and that honoring Wakan Tanka required honoring
    works in nature.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dream stone said Brave Buffalo's search showed him worthy of supernatural
    help and that he could ask the stone's assistance when curing sick persons, with
    the forces of nature helping the cure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Soon after the dream, Brave Buffalo found his first sacred stone on top of
    a high butte and later found several others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: One sacred stone is described as nearly spherical, with dots suggesting a
    tiny face, dyed red, surrounded by eagle down, and kept in a red cotton-cloth
    wrapping.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The stone is said to be sendable on errands of observation by its owner, while
    eagle down keeps it from getting away when not in use.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Brave Buffalo said he had cured many illnesses by means of the stone and described
    some stones as brothers, sisters, or relatives of the original stone.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Brave Buffalo said the sacred stones are found on top of high buttes, are
    round like the sun and moon, and are related to other round things.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Brave Buffalo contrasted these stones with stones shaped by stream currents,
    saying the sacred stones were found far from water and exposed to sun and wind.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The thunderbird is said to be related to the stones, and the passage connects
    lightning punishment with stones embedded in or projected into the earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Brave Buffalo said he makes requests of the stones because he is not worthy
    to speak to Wakan Tanka, and the stones are his intercessors.
  category: speech
  evidence_refs:
  - ev:9
