canonical_text:
  quote: ''
  summary: 'The passage reports Santee and related accounts of conjuring or medicine-man
    treatment for sickness: disease is said to be removed by sucking; a red-painted
    conjuror performs over a sick boy in a tipi using bare ground, fire, coal, root,
    water, animal-like movements, and repeated sucking; the treatment is stopped after
    the boy worsens, and the conjuror is paid. A second account describes summoning
    a medicine-man with a black-painted pipe and eagle feather.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in many instances of treating sickness by conjuring,
    no medicines were given, and the conjuror claimed to remove disease from the body
    by sucking it out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mrs. James McLaughlin witnessed a Santee demonstration on the Devils Lake
    Reservation in North Dakota involving a conjuror named Sip'to, also called Beads,
    attempting to cure a boy with lung hemorrhages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sip'to is described as an old man wearing only a breechcloth, with his whole
    body and face painted red and his hair short and loose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy lay in a tipi, and the account states that conjuring had to be done
    on bare ground; if done in a log house, part of the floor had to be removed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the tipi, the conjuror sat in the place of honor on smooth bare ground,
    the boy's head was near him, a fire with many red coals was in the middle of the
    lodge, and a young girl placed water beside the conjuror.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The conjuror rinsed his mouth, chewed a piece of root, removed a coal from
    the fire with a stick, took it in his hands, and put it in his mouth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The conjuror dropped on all fours, tore up the ground with his fingers and
    toes, cried like an animal, and approached the boy as though he were a wild beast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: With the coal still in his mouth, the conjuror stooped over the boy's chest
    and sucked until blood came to the surface, then made a whistling, puffing sound
    and spat into a dish partly filled with water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the performance the conjuror sat perspiring, and the boy immediately
    had a hemorrhage from the lungs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same performance was enacted four times, and after each time the boy had
    a hemorrhage.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy said the treatment was making him worse, and his father asked the
    conjuror not to work over him any longer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy's father gave the conjuror a horse because of the stated Santee belief
    that sickness will return if the doctor is not paid.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A footnote states that similar demonstrations were made by medicine-men of
    other tribes and refers to a description of the custom among the Chippewa.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Used-as-a-Shield is named as the source of a second account about treatment
    by a conjurer and describes his own experience.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the second account, the first step in summoning a medicine-man was to put
    black paint, ordinarily made with charcoal, on the stem of a pipe and tie an eagle
    feather near the mouthpiece.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A messenger carried the painted pipe to the medicine-man's lodge with the
    bowl next to him and, if the medicine-man was home, silently handed it to him;
    the medicine-man smoked it as a token of assent.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: If the medicine-man was absent, the messenger left the pipe in the place of
    honor with the bowl toward the door.
  category: sequence
  evidence_refs:
  - ev:9
