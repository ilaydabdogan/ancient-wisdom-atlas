canonical_text:
  quote: ''
  summary: Brave Buffalo reports a wolf dream that came while he was hunting alone.
    Red-painted wolves surround him, lead him to a den on a high hill, instruct him
    in an herb for catching snakes, and prescribe elements of a wolf-dream demonstration
    involving a live rattlesnake, a wolf-skin covering, a red bent stick, and an owl
    alighting on his back. Afterward he prays to wolves for game locations and uses
    a dream-taught owl-hooing song in treating the sick. The passage adds contextual
    remarks on the owl's sacredness among some medicine-men.
  language: English with Lakota song text and English gloss
  quote_policy: summarized
