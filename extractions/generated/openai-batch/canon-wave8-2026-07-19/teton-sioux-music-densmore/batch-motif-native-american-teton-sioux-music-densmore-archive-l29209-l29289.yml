canonical_text:
  quote: "“Eagle Shield took the captured woman to the Sioux camp, but the next autumn
    she ran away and returned to her own people.”"
  summary: The passage gives a musical note, then recounts a Sioux attack on Assiniboin
    cherry pickers during the ripe-cherry season. Assiniboin from the camp tried unsuccessfully
    to save them. Men were killed, women escaped except for one woman captured by
    Eagle Shield and carried away on horseback to a Sioux camp. The next autumn she
    escaped and returned to her people. A song titled “Captives I Am Bringing,” sung
    by Eagle Shield, is presented as celebrating the victory.
