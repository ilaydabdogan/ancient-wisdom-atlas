canonical_text:
  quote: ''
  summary: 'The passage describes events connected with a spirit-lodge ceremony: gifts
    are displayed and distributed, societies receive reciprocal gifts, children may
    be named or have ears pierced, restricted participants conduct pipe rites associated
    with the White Buffalo Maiden, spirit bundles are opened in four stages to release
    a child''s spirit, possessions are given away, and a white buffalo robe may be
    carried from the lodge by qualified persons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After work within the spirit lodge was finished, gifts accumulated by the
    spirit-keeper's family were distributed to people in the camp after having been
    displayed on frames.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit-keeper sent gifts to societies that preserved order in the camp;
    Weasel Bear said he gave a war bonnet to the Tokala society and the feathers were
    distributed among the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The occasion included much feasting, public announcements of children's names,
    and children's ears being pierced in the same manner as at the Sun dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ceremony inside the lodge was not studied in detail; only former spirit-keepers
    could enter, and the selected a'taya itaq'dai was prepared with songs and prayers
    and qualified to give lamentations for the dead.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a white buffalo robe was used, song No. 1 was sung.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A filled pipe was placed beside a round space of mellowed earth, and an appointed
    pipe-lighter used lighted sweet grass and a buffalo chip while making four downward
    motions and four circular motions with the sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The a'taya itaq'dai held the pipe in ascending smoke and repeated words attributed
    to the White Buffalo Maiden, but the ceremonial speech was not recorded.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Weasel Bear reported being told that the pipe was brought by a woman and that
    drawing it would lead him to be straight and truthful like the pipe stem.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pipe was passed around the lodge toward the left; when it was smoked out,
    the pipe-lighter pretended three times to empty ashes on the buffalo chip and
    emptied them on the fourth motion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the ceremony the spirit bundles lay beside their spirit posts, and
    the actual release of the spirits came when the bundles were opened by the a'taya
    itaq'dai.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A spirit bundle was unwrapped in four acts with brief discourses; the final
    unwrapping occurred about an hour before sunset and let the spirit of Weasel Bear's
    child depart.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The family kept the lock of hair or other object forming the nucleus of the
    spirit bundle; some articles were kept by the a'taya itaq'dai, others were distributed
    in the lodge, and the spirit-keeper and his wife gave away almost all they possessed
    except their clothing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a white buffalo robe had been used, a qualified man could carry it out
    of the lodge, and children who had gone through the Alo Vagpi ceremony could help;
    the stated qualifications included uprightness of life and former possession of
    a white buffalo robe.
  category: action
  evidence_refs:
  - ev:9
