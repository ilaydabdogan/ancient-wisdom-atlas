  summary: The passage describes children's imitation of older people's war-related
    actions in games, then introduces a group of old ceremonial songs connected with
    the Alo'waijpi, Spirit-keeping, and Sun-dance ceremonies. These songs are restricted
    to specially qualified singers; the Sun-dance songs are sung only by the Intercessor
    and form part of his qualifying instructions.
