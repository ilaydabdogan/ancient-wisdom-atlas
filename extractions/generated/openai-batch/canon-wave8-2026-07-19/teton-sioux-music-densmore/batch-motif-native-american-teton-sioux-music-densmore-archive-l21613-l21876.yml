canonical_text:
  quote: ''
  summary: The passage presents four Teton Sioux songs with glosses and musical analysis.
    Song No. 97 describes wind blowing in the north and people walking while hail
    beats on them. Song No. 98 describes a tribe or herd whose voices and heralds
    can be heard as they walk. Song No. 99 says the speaker caused faces to strike
    against the wind and sent forth a lance to cover all; the prose gloss freely interprets
    this as driving the tribe against the wind, which struck their faces like a lance.
    Song No. 100 is identified as probably belonging to a man who dreamed of a buffalo
    and contains the words 'Brave Buffalo, I am, I come.'
  language: English with Lakota/Dakota lexical glosses
