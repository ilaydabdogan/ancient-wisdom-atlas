canonical_text:
  quote: ''
  summary: The passage describes the Teton Sioux game of hiding a stick, including
    its relation by name to a moccasin-hiding game, implements, rules, scoring, hand
    signals for guesses, and songs used during play, near victory, and after victory.
    The victory song is identified as a war song adapted by inserting the name of
    a player or group in place of a defeated enemy.
  language: English
  quote_policy: summarized
