canonical_text:
  quote: ''
  summary: Brave Buffalo recounts a dream in which a buffalo summons him along an
    upward, narrow path to a buffalo-hide lodge filled with buffalo. The chief buffalo
    says he has been selected to represent the buffalo, gives him a stick or cane
    as a reminder, and a song is said to confer power for medicine. The buffalo also
    instruct him to demonstrate endurance by showing that weapons cannot harm him.
    After waking and preparing, Brave Buffalo stages a public demonstration in a buffalo-hide
    tent while dressed in a whole buffalo hide; arrows, and later guns, fail to injure
    him.
  language: English
  quote_policy: summarized
