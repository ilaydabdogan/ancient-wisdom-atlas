  summary: The passage analyzes Teton Sioux songs in terms of drumbeat patterns, rhythmic
    units, metric units of voice and drum, tempo discrepancy between voice and drum,
    and general tonal/rhythmic characteristics. It defines a recurring rhythmic unit,
    gives percentages for songs with such units, and summarizes how the songs resemble
    and differ from the author's category of 'music of civilization.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, in 3 percent of the songs, the drum is in quadruple
    division and the accented stroke is preceded by a short unaccented stroke.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A 'rhythmic unit' is defined as a group of tones of various lengths, usually
    more than one count of a measure, occurring at least twice in a song and influencing
    the rhythm of the entire song.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When two or more rhythmic units occur in a song, the passage says they resemble
    one another; sometimes note values are reversed, and sometimes the second unit
    is complementary or answering.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports that 33 percent of the songs do not show a rhythmic unit,
    60 percent contain one rhythmic unit, and 7 percent contain two to five rhythmic
    units.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Metric units of voice and drum are determined by comparing a phonograph record
    with the speed of a tested Maelzel metronome.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The drum speed is described as slightly faster than the voice: 37 percent
    of voice examples have a speed of 100 or more, while 57 percent of drum examples
    have a speed of 100 or more.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Only 44 percent of the songs are said to have the same metric unit for voice
    and drum; in 56 percent the metric units are different.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Where voice and drum metric units differ, the passage infers that voice and
    drum may express separate simultaneous impulses rather than a single related pulse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The summary states that the songs resemble 'music of civilization' in use
    of keynote, third, fifth, octave, and a rhythm unit, and differ in irregularity
    of time and discrepancy between voice and drum tempo.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The summary also characterizes the songs as having a descending trend, chiefly
    diatonic melody tones, and the minor third as the most prominent interval.
  category: attribute
  evidence_refs:
  - ev:7
