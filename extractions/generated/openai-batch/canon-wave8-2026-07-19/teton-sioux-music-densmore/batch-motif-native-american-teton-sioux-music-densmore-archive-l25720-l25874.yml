  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The leader usually carried a wolfskin with its head pointing in the direction
    of travel; in camp the wolfskin was laid with its head toward the enemy's country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: No drum or rattle was used during the war party's movement, and the men walked
    silently.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If someone in the party had dreamed of a wolf, he could be asked to perform
    ceremonies; a medicine-man might sprinkle water on the wolf hide, sing his personal
    song, and pray for a storm to cover the attack.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If the enemy camp had moved, a medicine-man who could command sacred stones
    would use them to search for the enemy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A shield obtained from an old warrior was rawhide stretched over a hoop, 16
    inches in greatest diameter, with red and yellow segments and black bear-paw designs
