canonical_text:
  quote: ''
  summary: The passage gives words and commentary for war-related Sioux songs, especially
    No. 184, "It Is Difficult," in which a speaker on the warpath recalls brothers
    urging him to strike anything he sees and says he realizes difficulties. The surrounding
    ethnographic commentary describes war-party preparations, a wolfskin directional
    and storm-making ceremony, use of sacred stones to locate an enemy camp, a decorated
    shield tied to a bear dream and protection in battle, and a typical eagle-feather
    war bonnet.
  language: English with transliterated Lakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening personal song presents a speaker who was courting, was told he
    had no horses, and therefore says he roams over all the land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor describes the opening song as personal rather than a society song
    and places it in the section because it may have been sung before a war party's
    departure.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Song No. 184 presents a speaker coming on the warpath; brothers tell him to
    try to strike anything he sees, and the speaker says he realizes difficulties.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary says No. 184 involves a reluctant boy being urged to bravery
    by older brothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The analysis compares No. 184 with No. 155, noting close resemblance, reports
