  quote: ''
  summary: The passage classifies several kinds of Native songs, including songs received
    in dreams or transmitted through inherited or purchased rights, songs for games,
    dances, war, hunting, and praise of chiefs or warriors, and songs connected with
    folk tales that are often represented as sung by animals. It then discusses standards
    of singer excellence, especially intonation, tone quality, accuracy of repetition,
    and vocal compass, using examples from Sioux and Chippewa recordings and named
    singers.
  language: English
