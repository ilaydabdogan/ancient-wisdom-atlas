canonical_text:
  quote: ''
  summary: The passage describes Teton Sioux buffalo bow and arrow construction, including
    bow materials, arrow points, feathering, shaft measurement, guiding lines, polishing
    stones, personal ownership marks, buffalo-blood finishing, quivers, arrow makers,
    and the context of buffalo hunting before a camp move.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buffalo bows varied by maker in pattern and strength, but shared an asymmetrical
    construction in which the arrow-fitting place was nearer the upper end and the
    lower section was longer and thicker.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bow woods included cherry, plum, crab apple, or other hardwoods.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bow back was covered with prepared sinew attached with glue made from
    buffalo hide, and the bowstring was twisted and dried sinew from a buffalo bull.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'White Hawk reported three generations of arrow-point materials: his great-grandfather
    used cut flint, his father used bone, and White Hawk used steel points cut from
    thin frying pans associated with traders or soldiers.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arrow feathers came from several bird species; three feathers were fastened
    to each arrow with glue and deer-sinew wrappings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bow quality was described by how deeply the same arrow penetrated a buffalo,
    ranging from embedded point to almost feather-deep to passing clear through the
    animal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man’s buffalo arrow length was measured by parts of his own arm and hand;
    light, flexible shaft woods were preferred so an arrow could bend under a fallen
    buffalo without breaking.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lines were cut in the arrow shaft to make it go straight; White Hawk said
    the proper cutting method came from long experience.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The maker polished the shaft with a pair of grooved soft whetstones said to
    come from the Black Hills, then brushed and wrapped the stones in buckskin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each man had a special mark for his arrows; examples included use of a pelican
    feather, red paint, a blue middle section, or dents in the shaft.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: As a final process, the arrow shaft was smeared with buffalo blood, which
    White Hawk said helped it pass smoothly through the animal’s tissues.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Most quivers held ten arrows; a man might make his own quiver but usually
    ordered arrows from an arrow maker, often a hundred at a time.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Red Fox was known as a skillful arrow maker in former days.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: A buffalo hunt frequently occurred when the tribe was about to move to a new
    camping place, and the passage introduces Siya'ka as describing such a hunt.
  category: setting
  evidence_refs:
  - ev:10
