canonical_text:
  quote: ''
  summary: 'The passage describes the Buffalo society and Buffalo dance: Santee performers
    are said to have had buffalo visions, some dream-wounds were marked or acted out
    in the dance, dancers wore buffalo-horn headdresses and imitated buffalo, a dance
    shield is noted, and some Buffalo society songs were said to have come from buffalo
    dreams. Song No. 95 describes northward walking and touching a sacred stone; Song
    No. 96 describes a goal toward the end of the earth.'
  language: English with Lakota/Dakota song text and English glosses
  quote_policy: summarized
