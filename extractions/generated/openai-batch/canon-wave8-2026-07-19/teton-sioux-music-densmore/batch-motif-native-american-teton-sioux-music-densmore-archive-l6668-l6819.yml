canonical_text:
  quote: ''
  summary: 'The passage ends a plant-child/corn narrative in which a desired child
    is associated with a specially tended plant sent by Wakag^tai)ka. It then describes
    the Alo''wai)pi ceremony for children: ceremonial men come from a double lodge,
    perform a pretended search with a song, narrate their past deeds to prove their
    right to officiate, carry children to the lodge with four stops and a wolf howl,
    and conduct face painting and song rites involving plumes, rattle, wand, and decorated
    ears of corn.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker tells the hearers not to fear and says the plant they behold will
    grow into the most beautiful child they have seen.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hearers are instructed to give the plant air, sunshine, and water, and
    to let no other plant or shrub grow near it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people realize the plant is the child they had desired and care for it
    as instructed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The plant grows tall, has green clothing and whitish hair, and produces corn
    enclosed in a green covering; when the covering changes color, the corn is taken
    out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The people conclude that Wakag^tai)ka has sent them something to keep and
    raise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The ceremony formerly lasted several days with many songs, but in later Teton
    Sioux observance it was said to be completed in one day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the opening of the ceremony, the itaQ^gai) come from the double lodge to
    get the children, pretending not to know where the children live and singing a
    search song through the camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The search song's words are translated as asking where the children live,
    and its performance includes hurrying to a tent, pausing, and passing on until
    the destination is reached.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: At the children's home, the men do not enter at once but narrate their past
    deeds as evidence of their right to perform the Alo'wai)pi ceremony.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Small children are carried in blankets on the backs of the itaQ^gai) to the
    double lodge; on the way the men stop four times and give the wolf howl to signal
    approach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the double lodge, the itaQ^gai) sit in the place of honor behind the pipe
    rack, and each man may have his own pipe or wand placed against the rack.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: In Weasel Bear's account, an old man paints the girls' faces with blue lines
