  summary: The passage describes the Elk Society as composed of men who had dreamed
    of the elk. It identifies Two Shields as a singer and drummer, gives a society
    song said to have been handed down for many generations, states that the song
    is still sung at dances and must be paid for by the man who asks for it, and provides
    a musical analysis of the recorded renditions.
