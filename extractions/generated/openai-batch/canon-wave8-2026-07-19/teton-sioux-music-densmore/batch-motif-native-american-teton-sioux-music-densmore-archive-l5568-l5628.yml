canonical_text:
  quote: ''
  summary: The passage analyzes several melodic types in Teton Sioux songs. One type
    is associated with songs for treating the sick, affirmation, confidence in cure,
    and emphasis on the keynote or lowest tone. Type D is associated with Dream societies
    named for animals seen in dreams, with some songs said to have been received from
    animals; its repeated short ascent and descent is linked with songs about men
    or animals in motion. Type E is associated with grief or dissatisfaction. The
    passage then begins a statistical comparison of Chippewa and Sioux song characteristics.
  language: English
  quote_policy: summarized
