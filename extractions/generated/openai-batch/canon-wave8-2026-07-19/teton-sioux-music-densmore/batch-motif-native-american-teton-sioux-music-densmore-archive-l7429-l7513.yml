canonical_text:
  quote: ''
  summary: The passage discusses terms for mysterious power among Siouan peoples,
    cites scholarly explanations of toakap'da, and then describes Sioux understandings
    of the Sun dance. It emphasizes voluntary endurance of physical pain as fulfillment
    of a vow, contrasts Indigenous and non-Indigenous interpretations of the ceremony,
    and quotes Red Bird describing the Sun dance as the people’s former religion,
    centered on a mysterious power represented by nature and the sun. Red Bird says
    sacrifices were made to the sun and petitions were granted, and he associates
    a later eclipse-like darkness with the arrival of the white man’s religion.
  language: English
