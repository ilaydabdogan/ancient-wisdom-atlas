canonical_text:
  quote: ''
  summary: The passage describes the symbolic decoration of a calfskin robe associated
    with a young girl's ceremony and her relatives' war success, then introduces the
    Sioux ceremony of Spirit-keeping, including mourning obligations, spirit bundles,
    a final releasing feast, its authority from the White Buffalo Maiden, and comments
    by named informants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young girl for whom the Alo Vaqpi ceremony had been performed might wear
    a decorated calfskin robe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The robe decoration indicates that the wearer had taken part in the Hugka
    ceremony and that her relatives had been successful in war.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The decorations use red, blue, and yellow; red is said to represent blood,
    blue a blue cloud indicating success, and yellow the sky at morning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Red stripes on the head of the calfskin represent the Hugka stripes painted
    on the face of the child for whom the ceremony was performed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Red lines near the left margin of the robe are said to represent a spider's
    web.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Crescents along the right margin represent phases of the moon, with colors
    distinguishing quarter and full moon phases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The moon phases shown on the robe are the phases in which the child's relative
    engaged in the war expeditions marked in the decoration.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Parallel lines and dots represent camps made during an expedition; the central
    panel represents the warrior's path, and one depicted war party has eight camps.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Such a robe could be made only by a woman whose relative had been successful
    in war; the illustrated robe was made by the wife of Dog Eagle.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Sioux grieving the death of a near relative might keep the spirit for several
    months or a year and later let it go by a ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Once Spirit-keeping was begun, it had to be carried out consistently by the
    man who undertook it or, if he died, by his nearest relative.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before undertaking Spirit-keeping, a man considered that for many months he
    could not hunt, go to war, or join social activities, and that he must distribute
    gifts at the feast for releasing the spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Those who joined the Spirit-keeping undertaking each provided a spirit bundle
    to represent a relative's spirit and also provided a share of food and gifts for
    the final feast.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Ceremony of Spirit-keeping, like the Alo Vaqpi, is said to have its inspiration
    in the Coming of the White Buffalo Maiden, and everything was done according to
    her instructions.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The spirit of a child was kept more frequently than that of a grown person;
    Weasel Bear's narrative concerned keeping the spirit of a little daughter.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Bear Face said the ceremony was a great undertaking of the tribe because of
    its honor, work, and obligation, and that a man who carried it through successfully
    was recognized as qualified for large responsibilities.
  category: speech
  evidence_refs:
  - ev:10
