canonical_text:
  quote: ''
  summary: The passage introduces the Teton Sioux Horse society and says some songs
    were used in that society and on the warpath to make horses swift and sure. Brave
    Buffalo's speech praises the horse as the Indian's best friend and describes promising
    paint to a horse in return for help. Siyaŋka recounts speaking to his horse when
    in danger on the warpath and promising an eagle feather, red cloth, and paint
    if they reached home. The song 'My Horse Flies Like a Bird,' sung by Brave Buffalo,
    describes the speaker's horse as a friend that flies like a bird as it runs; the
    remainder of the passage gives musical analysis of the song.
  language: English with Lakota song words and terms
  quote_policy: summarized
