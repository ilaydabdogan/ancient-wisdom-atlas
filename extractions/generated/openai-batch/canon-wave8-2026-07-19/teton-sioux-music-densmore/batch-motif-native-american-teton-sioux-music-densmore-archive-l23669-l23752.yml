canonical_text:
  quote: ''
  summary: The passage introduces and defines Aki'cita societies among the Oglala
    and Teton Sioux, distinguishing them from other men's societies and from a separate
    secret society. It explains the Aki'cita as guard or police bodies connected with
    camp order and the buffalo hunt, gives historical observer accounts of punishment
    and night patrol, and describes selection of head Aki'cita and officer structure
    including lance bearers.
  language: English
  quote_policy: summarized
