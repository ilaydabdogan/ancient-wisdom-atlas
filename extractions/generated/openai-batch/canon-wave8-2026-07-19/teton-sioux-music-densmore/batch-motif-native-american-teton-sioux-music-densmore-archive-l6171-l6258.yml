canonical_text:
  quote: ''
  summary: A chief welcomes a young Maiden as a sister sent in a time of need, invokes
    the sun, and offers her rain water with braided sweet grass from a buffalo horn.
    The Maiden lowers the pipe, drinks, then speaks to the assembled people. She says
    she represents the Buffalo tribe, who have sent the pipe, and gives directions
    for its use as a peacemaking, binding, healing, and need-supplying sacred object.
    She addresses women, children, and men, assigning duties of care, reverence, purity,
    support, sacrifice, and daily offering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief says a named sacred being has looked down and smiled by sending
    the young Maiden, whom the people are to recognize as a sister.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief lifts attention to the sun as giver of light and explains that,
    because the people are needy, they can offer only rain water from the clouds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Braided sweet grass is dipped into a buffalo horn containing rain water and
    offered to the Maiden; she lowers the pipe to a rack and sips the water from the
    sweet grass.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Maiden addresses the people as relatives, brothers, and sisters, and says
    they have met as one family; she also says the sun is grandfather to them and
    to her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Maiden says the tribe has been chosen because of faithfulness to promises,
    reverence toward sacred things, good feeling within the tribe, and exclusion of
    wrongdoers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Maiden says she represents the Buffalo tribe, who have sent the pipe,
    and instructs the people to receive and use it according to her directions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pipe is described as having a red-stone bowl made from a stone found only
    at a certain place.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Maiden says the pipe will be used as a peacemaker, as a binding instrument
    when peace is agreed between tribes or parties, and as a means by which medicine-men
    are called to help the sick.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Turning to the women, the Maiden says they bear sorrow, comfort others, move
    the family by their hands, make clothing, feed the family, show kindness to living
    creatures, remember the dead, and love their children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Turning to the children, the Maiden says their parents have made sacrifices
    for them, tells them they will benefit from the pipe, and instructs them to respect
    and reverence it and lead pure lives.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Turning to the men, the Maiden says necessities come from the earth below,
    sky above, and four winds; she tells them to reverence these elements, make sacrifices
    through the pipe, smoke it when needing buffalo meat, support women and children,
    and offer it daily to the named sacred being.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A footnote in the passage compares this material with another account in which
    a woman is said to be the supernatural means of bringing permanent peace between
    the Chippewa and Sioux.
  category: other
  evidence_refs:
  - ev:11
