- id: obs:1
  text: Most songs in the memoir were recorded among members of the Teton division
    of the Dakota or Sioux at the Standing Rock Reservation in North and South Dakota.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional songs were recorded among the Sisseton and Wahpeton Sioux at Sisseton,
    South Dakota, and twelve of those songs are included in the volume by number.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Field work began in July 1911 and continued until 1914, with Robert P. HighEagle
    acting as principal interpreter at Standing Rock and revising material collected
    at Sisseton.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The words of songs recorded at Standing Rock are mostly in the Teton dialect,
