  quote: ''
  summary: The passage introduces Densmore's Teton Sioux song corpus, identifying
    recording locations, interpreters, dialects, tribal names, Dakota/Sioux divisions,
    external ethnonyms, and early historical references. It includes linguistic explanations
    of “Dakota,” “Sioux,” and related division names, and notes Riggs’s statement
    that the Dakota sometimes call themselves the “Seven Council Fires.”
  language: English
  quote_policy: summarized
