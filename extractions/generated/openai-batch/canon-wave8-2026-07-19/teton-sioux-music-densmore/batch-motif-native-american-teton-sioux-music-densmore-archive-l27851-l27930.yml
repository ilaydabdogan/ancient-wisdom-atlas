  quote: "“So I became a warrior.”"
  summary: Red Fox narrates how, as a young boy, he disobeyed his mother’s warning
    and followed a war party. During the expedition he was tested by frightening news
    about his mother, saw dead Sioux warriors killed by enemies, vowed revenge, and
    later returned home to his mother’s silent care and close supervision.
