canonical_text:
  quote: ''
  summary: The passage gives musical analysis of a song and then recounts a warpath
    episode. Standing Elk invoked sacred stones for Siya'ka's party, sent them on
    their customary search, and told the warriors that they would meet a wolf and
    a crow from the north before seeing and killing one enemy. The warriors were to
    pray to the wolf and crow, calling them grandfather and asking for a count. The
    prediction is said to have been fulfilled; the killed man was later identified
    as the scout One Feather, and four Sioux including Siya'ka drove back a larger
    Arikaree and Mandan party. The song was used by Standing Elk in requesting the
    stones and was sung without a drum.
  language: English with Lakota/Dakota transliteration and gloss fragments
  quote_policy: summarized
