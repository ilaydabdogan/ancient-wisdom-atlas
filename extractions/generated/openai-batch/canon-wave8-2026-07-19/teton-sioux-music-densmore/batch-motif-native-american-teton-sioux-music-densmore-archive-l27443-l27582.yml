canonical_text:
  quote: ''
  summary: 'The passage introduces a set of love songs connected with war, explains
    that older love songs were associated with a man''s qualification to wed through
    success in war or buffalo hunting, and gives two renditions of the same song:
    one by Two Shields, in which marriage is promised when the addressee''s name is
    heard among the victors, and a duplicate by Siya''ka, in which marriage is promised
    when the addressee returns. The passage also compares the two renditions musically
    and textually.'
  language: English with Lakota song text/transliteration
  quote_policy: summarized
