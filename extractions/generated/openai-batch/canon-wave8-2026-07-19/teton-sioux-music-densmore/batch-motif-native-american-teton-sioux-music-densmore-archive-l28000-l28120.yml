canonical_text:
  quote: ''
  summary: The passage presents Red Fox's warpath song, described as the words of
    a boy who wants to go on the warpath despite opposition from older brothers, followed
    by musical analysis. It then gives Eagle Shield's personal narrative of organizing
    a winter war party, preparing moccasins, departing at night, traveling through
    snow, scouting a large Crow settlement and horse herd from a butte, returning
    with a wolf howl, undergoing a truth-guarantee and pipe offering, and reporting
    the plan to take horses at night.
  language: English
  quote_policy: summarized
