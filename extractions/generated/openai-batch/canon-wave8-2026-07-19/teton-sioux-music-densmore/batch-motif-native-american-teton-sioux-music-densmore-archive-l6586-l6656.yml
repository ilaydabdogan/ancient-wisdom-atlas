canonical_text:
  quote: ''
  summary: The passage describes preparations for a ceremony involving a double lodge,
    an exposed-earth square, buffalo skull, pipe rack, pipes, plume, rattle, corn,
    and other ritual articles. It says the details follow instructions given by the
    White Buffalo Maiden. It also introduces an inquiry into the ceremonial use of
    corn among the Teton Sioux and begins a legend in which a childless old couple
    pray to Wakag^tai)ka in a sweat-bath booth, hear that their request will be granted,
    and find a green seedlike sprout at their door the next morning.
  language: English
  quote_policy: summarized
