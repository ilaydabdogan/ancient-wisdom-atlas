canonical_text:
  quote: ''
  summary: 'The passage gives two Teton Sioux song transcriptions and analyses: No.
    228, “They Depend Upon You,” sung by Silent Woman, and No. 229, “I Donated a Horse,”
    sung by Shooter. Both songs address Two White Buffalo with an exhortation to take
    courage. The first refers to a committee depending on the addressee and to donated
    money; the second states that a horse was donated. The analysis identifies both
    as praise or honor songs with new words inserted and gives musical features of
    the melodies.'
