canonical_text:
  quote: ''
  summary: The passage describes the desired white buffalo robe used in the place
    of honor in a lodge during the keeping of a spirit. The tripod and spirit bundle
    rested on it, and the robe signified ritual purity. Restrictions governed who
    could touch it and how people could move near it. A qualified medicine-man or
    ritual specialist could handle it, with an exception for children who had been
    through the Hunka ceremony. The passage also states that during spirit keeping
    the contents of the lodge were treated as belonging to the tribe, so requested
    tobacco and red willow were given.
  language: English
