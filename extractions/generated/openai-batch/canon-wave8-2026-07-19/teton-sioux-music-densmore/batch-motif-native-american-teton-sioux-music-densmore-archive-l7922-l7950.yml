canonical_text:
  quote: ''
  summary: The passage describes a series of councils and conferences in which Lakota
    men reviewed, corrected, ordered, and approved material about the Sun Dance. Red
    Bird contributed additional remembered facts; phonograph records were played and
    approved; later groups reviewed the Sioux translation. Red Weasel, who had acted
    as Intercessor at the last Sun Dance, reviewed the material, recalled details
    of the Intercessor's duties, and sang four songs received from Dreamer-of-the-Sun
    with office instructions.
  language: English
  quote_policy: summarized
