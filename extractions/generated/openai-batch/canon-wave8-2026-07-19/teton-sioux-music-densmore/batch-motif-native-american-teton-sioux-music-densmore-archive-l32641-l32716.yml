canonical_text:
  quote: ''
  summary: 'The passage identifies and analyzes a Buffalo Hunt song, then narrates
    a ceremonial sequence before a buffalo hunt: entry into the tribal circle and
    lodge, prepared ground and ritual objects, a pipe and sweet grass rite performed
    by a red-painted master of ceremonies, formal reporting by the searcher who first
    saw buffalo, communal responses, and final preparations for the hunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Song No. 181 is identified as a Buffalo Hunt song sung by Sita^ka, with a
    drum rhythm described as similar to No. 6.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The musical analysis says the time was not strictly maintained, the opening
    rhythm was difficult to discern, and the song's rhythm was simple once note values
    were determined.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The party entered the tribal circle with the leader in advance; a stick was
    placed upright in the ground, and the party circled around it while many struck
    it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the council tent a small hard, smooth space of bare ground was prepared;
    a buffalo chip, sweet grass, and a filled pipe ready to smoke were placed there.
  category: setting
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:5
  text: The searcher who first saw the buffalo entered the lodge ahead of his companions;
    many people stood with hands raised, uttered a cry, stooped, and placed their
    palms on the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man of above-reproach record was selected as master of ceremonies, and his
    entire body was painted red.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The master of ceremonies lifted the pipe, put a little buffalo chip on the
    tobacco, lit the chip with flint and steel, laid sweet grass on it, passed the
    pipe over the smoke four times, pretended to light it three times, and lit it
    the fourth time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The master of ceremonies swung the pipe in a circle over the buffalo chip,
    offered it to the first buffalo spotter and then to the other searchers, and each
    puffed it four times.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the pipe offering had to be done four times; if there
    were only two searchers, each received the pipe twice to observe the required
    number.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the searchers had puffed the pipe, it was offered to all sitting in
    the lodge, who touched their lips to it even if it had gone out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The master of ceremonies did not ask a direct question but instructed the
    first buffalo spotter to report truthfully what he had seen and where he had seen
    it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The example report says the searcher mounted a butte, looked toward a place
    where he had seen buffalo before, and saw two herds near the butte.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage notes that when speaking of buffalo it was customary to point
    with the thumb rather than the finger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The master of ceremonies affirmed that the searcher had spoken truly and that
    the report had made his heart good; listeners cried out and touched the ground
    again.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: A further example report says that beyond the two herds the searcher saw the
    plain black with buffalo.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the report was completed, the crier announced that saddles should be
    put on horses and that the people were going to hunt buffalo; horses were brought
    in, men and horses were painted, and knives were sharpened.
  category: sequence
  evidence_refs:
  - ev:9
