canonical_text:
  quote: Durifig this fight I sang a very powerful song of the Fox society, to which
    I belong.
  summary: Old Buffalo recounts a winter horse raid against a Crow village, pursuit
    by the Crows, an extended fight in freezing conditions, the singing of a Fox society
    song, and the care and transport of a wounded Sioux boy during the party's return
    travel.
  language: English
  quote_policy: quoted
