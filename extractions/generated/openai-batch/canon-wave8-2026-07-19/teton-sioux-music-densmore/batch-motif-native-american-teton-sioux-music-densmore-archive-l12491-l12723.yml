canonical_text:
  quote: ''
  summary: The passage describes part of a ceremony involving dreamers, herb rubbed
    on the hands and arms, insertion of the hand into boiling water to retrieve meat,
    distribution of that meat, and songs sung by Lone Man. It explains that a dreamer
    remains obligated to the elements until fulfilling dream requirements, and that
    the song image of the elements 'wearing' the singer means the singer is still
    under those obligations. The passage gives words and musical analysis for songs
    titled 'A Wind' and 'In a Sacred Manner I Return.'
  language: English with Lakota song text and glosses
  quote_policy: summarized
