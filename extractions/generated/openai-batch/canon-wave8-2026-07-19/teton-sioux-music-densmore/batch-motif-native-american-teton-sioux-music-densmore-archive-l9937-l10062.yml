canonical_text:
  quote: ''
  summary: 'The passage describes actions at the opening of a Sun Dance ceremony:
    a procession enters the Sun-dance circle after directional prayers; the Leader
    of the Dancers places a painted buffalo skull and sealed pipe in ceremonial position;
    the Intercessor burns sweet grass, smokes and offers a pipe toward sky, earth,
    and the cardinal points; an explanation is given that the pipe is offered to Wakai)Hai)ka,
    to the earth, and to the four winds. Men fulfilling vows face the sun with hands
    raised, the Intercessor calls for repentance, the assembly laments, and the opening
    song is sung before dancing begins.'
  language: English
  quote_policy: summarized
