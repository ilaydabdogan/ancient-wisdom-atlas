- id: obs:11
  text: Charging Thunder explained that the skyward pipe offering was to Wakai)Hai)ka,
    the earthward offering acknowledged earth as home, and the directional offerings
    addressed the homes of the four winds in order to make peace with storm-bringing
    winds.
