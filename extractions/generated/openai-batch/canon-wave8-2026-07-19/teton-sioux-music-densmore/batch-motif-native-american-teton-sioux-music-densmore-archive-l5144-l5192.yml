  summary: The passage gives a statistical analysis of Teton Sioux songs. It reports
    that many songs begin with downward melodic progression, that total progressions
    are more often downward than upward, and that this supports a general downward
    melodic trend. It also reports that descending intervals are smaller than ascending
    intervals, describes a pattern of beginning high, descending, returning near the
    original pitch, and descending again, and summarizes the distribution of interval
    sizes, including few semitone intervals.
