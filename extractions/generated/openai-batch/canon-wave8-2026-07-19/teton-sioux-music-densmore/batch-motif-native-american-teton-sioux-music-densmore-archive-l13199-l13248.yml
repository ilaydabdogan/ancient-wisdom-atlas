canonical_text:
  quote: they saw the footprints of an elk instead of those of a man.
  summary: After elks teach Brave Buffalo a song, they give him instructions about
    wearing an eagle feather, painting his tipi, and devising a performance to show
    their patronage. He makes an elk-hide horned mask, paints himself yellow, carries
    hoops decorated with elk hide and elk herb, circles the camp with two virgins
    carrying his pipe, imitates the elk, and leaves elk footprints on damp ground
    before witnesses.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The elks taught Brave Buffalo a song and then gave him numerous instructions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each elk had a downy white eagle feather tied to its right horn, said to indicate
    that it could run as fast as the eagle flies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brave Buffalo was told to wear a similar feather on his head, and at the time
    of the narrative he wore a downy eagle plume on the right side of his felt hat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elks told Brave Buffalo to paint his tipi yellow outside, with drawings
    of the crane and the crow on the inner walls, saying the birds would protect him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The elks told him he must devise a performance before he would be fully entitled
    to request help from them, and that the performance would show the people he acted
    under their patronage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: On reaching home, Brave Buffalo made an elk-hide mask from the skin of the
    head with the horns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: He painted himself yellow and held in each hand a hoop wound with elk hide
    and decorated with an herb liked by elks, identified in the passage as wild bergamot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After arraying himself, Brave Buffalo went around the camp near the tents;
    two virgins preceded him carrying his pipe, and he imitated the actions of the
    elk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Brave Buffalo wished that stepping on damp ground would leave elk footprints
    so the people would see he had the power of the elk.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A crowd followed him and saw elk footprints instead of human footprints after
    he passed over the damp ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: He was not required to repeat the demonstration, but would join another elk
    dreamer in a similar performance while wearing the same mask.
  category: relationship
  evidence_refs:
  - ev:6
