canonical_text:
  quote: ''
  summary: 'The passage introduces Charging Thunder''s three animal dreams: thunderbirds,
    wolves, and buffalo. He says he fulfilled the obligations of his dreams and benefited
    from them, though they did not require him to practice medicine. In the wolf dream,
    at about age 22, he came to a wolf den, found little wolves without their parents,
    heard or perceived their speech about being helpless until their parents returned,
    and learned their song. A footnote notes a similar dream recorded by J. Owen Dorsey.'
  language: English
  quote_policy: summarized
