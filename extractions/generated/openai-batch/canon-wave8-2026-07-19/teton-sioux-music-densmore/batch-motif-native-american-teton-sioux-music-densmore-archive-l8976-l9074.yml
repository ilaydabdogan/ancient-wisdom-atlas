canonical_text:
  quote: ''
  summary: The passage presents a song and musical analysis, then describes the Sun-dance
    procedure for selecting, praying over, cutting, and carrying a tree that will
    become the sacred pole. The Intercessor uses a pipe and names several animals
    while praying over the tree. The tree is treated as an enemy; four virgins enact
    strikes preceded by kinsmen's victory tales, and the first virgin fells the tree
    toward the south while a song for cutting the sacred pole is sung.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song titled as the return of the young men is listed as sung by Lone Man
    and followed by musical analysis of intervals, octave tones, tonality, and harmonic
    structure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the announcement of a choice, preparations begin for cutting the tree
    and bringing it to camp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many people go to witness the tree cutting; some attend from curiosity, others
    to make offerings, and children also attend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The leading members of the company include the Intercessor or an old medicine-man
    substitute, four young men who selected the tree, four young women who will cut
    it, and pole-bearers who will carry it to camp.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Leader of the Dancers provides the ax for felling the tree but does not
    accompany the cutting party; in later times the ax must be new and unused.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the tree is indicated, the Intercessor raises his pipe, lowers its stem
