  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The tree is regarded as an enemy; the passage explains the named animals by
    reference to fearlessness, boldness, dodging, craftiness, and cunning in relation
    to enemies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: One of the four virgins is selected to cut the tree, and the passage says
