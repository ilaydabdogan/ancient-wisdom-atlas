canonical_text:
  quote: ''
  summary: The passage describes Sioux hunting-party food preparation, then presents
    a medicine-man's song used in famine to secure buffalo. The ceremony uses a buffalo
    skull painted with red and blue stripes, a filled pipe on fresh sage, and singing
    in darkness; the skull is believed to become a buffalo and call others. The song
    text refers to a pipe, red earth, and blue earth. The passage then gives details
    about white buffalo rarity, purification and handling rules for a killed white
    buffalo, sacred treatment and exchange of the robe, and an anecdote about Jaw
    killing and selling a white buffalo hide.
  language: English with Lakota song terms
  quote_policy: summarized
