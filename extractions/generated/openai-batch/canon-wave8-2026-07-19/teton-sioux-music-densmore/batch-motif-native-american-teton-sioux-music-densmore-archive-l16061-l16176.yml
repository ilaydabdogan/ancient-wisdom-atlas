canonical_text:
  quote: ''
  summary: A speaker describes reliance on medicine-men for prediction, guidance,
    charms, and requests made with offerings. He recounts receiving advice from a
    medicine-man about understanding the earth, animals, and natural surroundings,
    and about sacred stones as protective representations connected with an earth-protecting
    power. The medicine-man gives him a sacred stone. The passage then says a sacred
    stone may appear as a person who talks and sings; a song associated with this
    says that living creatures look to the sacred stone for protection. Notes distinguish
    carrying a sacred stone from wearing a charm.
  language: English
