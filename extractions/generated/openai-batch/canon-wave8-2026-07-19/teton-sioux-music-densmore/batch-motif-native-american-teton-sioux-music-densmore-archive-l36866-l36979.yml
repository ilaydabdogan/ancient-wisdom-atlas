canonical_text:
  quote: ''
  summary: The passage presents two Teton Sioux songs associated with Two White Buffalo.
    No. 226, sung by Haka'la, is rendered as a song about helping the tribe and Two
    White Buffalo having consumed what she had; an editorial note says that among
    the Sioux it is a high compliment to say a person was so generous as to give away
    all possessions. No. 227, sung by Silent Woman, says that whenever the tribe assembles
    they receive the speaker's horses, and attributes the statement to Two White Buffalo.
    Densmore identifies No. 226 as a shuffling-feet dance melody and No. 227 as a
    praise-song melody.
  language: English with Lakota song text and glosses
