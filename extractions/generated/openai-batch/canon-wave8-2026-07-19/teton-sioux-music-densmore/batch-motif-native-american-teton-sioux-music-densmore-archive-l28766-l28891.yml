canonical_text:
  quote: ''
  summary: The passage describes Jaw performing a pipe rite addressed to Wakai)'tai)ka,
    asking for protection in battle, horses, long life, and freedom from further bloodshed
    after his Sun Dance ordeal. Jaw then explains the office of the ceremonial pipe
    and says his blood was not shed after the Sun Dance because he had asked for success.
    The passage gives Song No. 161, “I Wish to Roam,” with words about a friend, roaming,
    and seeking horses, notes Jaw's Sun Dance scars, analyzes the melody, and introduces
    a later war-party scene in which an enemy camp is approached at night before an
    attack.
  language: English
