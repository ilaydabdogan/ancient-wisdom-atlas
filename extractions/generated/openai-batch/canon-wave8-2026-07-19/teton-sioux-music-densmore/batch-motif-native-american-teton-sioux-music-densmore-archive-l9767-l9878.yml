canonical_text:
  quote: ''
  summary: 'The passage gives Song No. 18 to the vapor lodge, sung by Red Weasel,
    with a brief musical analysis. It then describes Sun Dance preparation after a
    vapor bath: dancers are painted by selected men, colors are linked to sky phenomena
    and sometimes to a painter''s dream, and Teal Duck describes his own painted designs
    including deer, sun, and moon forms. The passage also describes hair arrangement,
    eagle feathers, decorated sticks used because the dancer may not touch his body,
    deerskin and buffalo-skin clothing, an eagle-wingbone whistle with feather and
    sage, and the dancers'' assembly while awaiting the Crier.'
  language: English with Lakota terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Song No. 18 is identified as a song to the vapor lodge and is sung by Red
    Weasel; its translated words include sending a voice, asking to be heard, reference
    to the land all over, and the statement that the speaker will live.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The musical analysis states that the song has 20 measures and 15 progressions,
    resembles Nos. 14, 15, and 16 in lack of progression, has mostly downward progressions,
    and uses tones of the second five-toned scale.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the vapor bath, dancers were painted by men whom they had selected for
    that purpose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Informants differed on whether colored painting was added on the second morning
    or done before the opening of the dance; Red Weasel is reported as stating that
    color painting was done before the dance opened.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Red Bird stated that each man accustomed to painting dancers had a special
    color associated with his dream and used that color first.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The colors used in the painting are listed as red, blue, yellow, white, and
    black, and the passage says each color had symbolism connected with the sky.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Red is associated with red sunset clouds indicating fair weather, blue with
    a cloudless sky, yellow with forked lightning, white with light, and black with
    night; the moon is said to be painted black because it belonged to darkness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Teal Duck stated that in the Sun Dance his face and body were painted yellow
    with dark-blue lines extending down and branching along the arms, legs, forehead,
    and cheeks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A black deer's head was painted over Teal Duck's mouth, and the painter explained
    that this was because the deer could endure thirst for a long time without losing
    strength.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Teal Duck described a red disk on his chest representing the sun, a wood hoop
    wound with otter fur and decorated with four white eagle feathers tipped with
    black, a dark crescent on his back representing the moon, and rabbit-fur bands
    at wrists and ankles.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sun Dance participants wore hair loose on the shoulders, tied a lock at the
    back of the head, fastened an upright white downy eagle feather to it, and commonly
    wore four decorated sticks in the hair.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A dancer was not allowed to touch his body during the ceremony; the decorated
    sticks in his hair were removed and used for that purpose.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Dancers wore no moccasins, wore a white deerskin apron, and used a buffalo-skin
    robe when going to the Sun-dance circle and returning to the lodge.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Each dancer had a whistle hung around his neck; it was made from an eagle
    wingbone, wound with porcupine-quill braiding, tipped with a downy white eagle
    feather, surrounded at the mouthpiece with fresh sage, and blown while dancing.
  category: object
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:15
  text: After being painted and arrayed, the men assembled in the dancers' lodges
    of their bands and awaited the summons of the Crier.
  category: sequence
  evidence_refs:
  - ev:13
