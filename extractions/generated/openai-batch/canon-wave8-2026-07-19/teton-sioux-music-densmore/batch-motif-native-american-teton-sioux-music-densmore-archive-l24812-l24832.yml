  summary: The passage explains that joining a war party was not treated as a great
    honor at departure; honor and public demonstration were associated with returning
    victorious. It introduces a sequence of songs used on war expeditions, especially
    common war songs or “wolf songs” sung before a war party departed. The songs often
    mention the wolf because a warrior’s life was thought to resemble that of the
    wolf. Two Shields is identified as a recorder of several songs and a leading singer
    at tribal gatherings.
