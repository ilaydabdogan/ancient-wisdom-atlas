canonical_text:
  quote: ''
  summary: The passage discusses Dakota/Sioux sacred stones, their relation to a mysterious
    moving power, the Four Winds, ravens, small black stones, large painted boulders
    used as objects of prayer and sacrifice, and categories of men who dreamed of,
    possessed, used, demonstrated, sang for, or witnessed practices involving sacred
    stones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A powerful Dakota deity or mysterious moving power is described as feared
    and propitiated, influencing human well-being and misfortune, living in the four
    winds, and commanding four black spirits of night.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Santee informant is reported as saying that the Four Winds are sent by the
    'Something that moves' and that such a moving power is present at each of the
    Four Directions or Quarters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Santee Sioux, the Four Winds are said to be symbolized by a raven
    and a small black stone less than a hen's egg in size.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the desire for a dream of the small black stone and
    its treatment were similar to practices connected with the sacred stones under
    discussion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small stones carried on the person are distinguished from larger stones or
    rocks in the field that were treated as objects of worship.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Large boulders were selected and adorned with red and green paint, and devout
    Dakota people went to them to pray and offer sacrifice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A stone known as Eyay Shah, or Red Rock, was situated near the site of St.
    Paul, Minnesota, and was reportedly visited by the Sioux shortly before the 1862
    outbreak.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Speaking about the sacred stones is described as 'sacred talk' for the Sioux,
    and the material in the chapter was treated with reverence comparable to material
    concerning the thunderbird dream and the Sun dance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Songs and information about sacred stones were obtained from men representing
    five stated standpoints in relation to the stones.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
- id: obs:10
  text: One group consisted of men who had dreamed of sacred stones, possessed one
    or more, and had used them successfully in treating the sick or locating lost
    articles; Brave Buffalo and Goose are named in this class.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another group consisted of men who possessed sacred stones and believed they
    had been helped by their presence; Chased-by-Bears appealed to his stone in danger
    and anxiety, while Lone Man believed he had been helped by wearing one on his
    person.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Charging Thunder possessed a sacred stone but did not use it or command it
    as medicine-men did; the stone had been given to him when he was sick in the belief
    that it would restore him and act as a charm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Charging Thunder said his father was skilled in the use of sacred stones,
    and he recorded songs said to have been composed by his father.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Two Shields had not used sacred stones but had been one of the singers when
    White Shield gave demonstrations with them; six or eight singers customarily sat
    at the drum and sang with the demonstrator.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Other men had witnessed demonstrations with sacred stones in camp, on the
    hunt, and on the warpath, and some recorded songs used at such times; additional
    information and corroboration came from Buffalo Head and Standing Soldier.
  category: action
  evidence_refs:
  - ev:10
