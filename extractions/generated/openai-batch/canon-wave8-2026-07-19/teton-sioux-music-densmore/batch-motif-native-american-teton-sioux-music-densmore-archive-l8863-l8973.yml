canonical_text:
  quote: ''
  summary: The passage first analyzes a transcription in which voice and drum have
    different speeds and are described as simultaneous but not time-related. It then
    introduces a Sun Dance departure song sung as four young men leave camp to select
    a tree for the sacred pole. The passage describes who may accompany them, the
    preferred tree species and criteria, the rule that the first selected tree must
    be cut, their return to report to the Intercessor, the friends who meet and escort
    them, a welcome song also used for returning war parties or buffalo seekers, and
    a communal feast.
  language: English
  quote_policy: summarized
