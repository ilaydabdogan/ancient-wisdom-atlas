canonical_text:
  quote: ''
  summary: Etsemej hosts two unknown warriors in the wood. They explain that a princess
    of the house of Etsej sent them because she seeks vengeance against Kuba and recognized
    the smell of meat prepared with salt associated with Prince Etsej. Etsemej identifies
    himself as her nephew, goes to her camp, and promises to act alone while she and
    her army wait. At dawn he rides away, crosses a broad river, reaches Kuba's kingdom,
    kills the grooms guarding Kuba's horses, seizes the horses, and drives them back
    toward his aunt's camp while judging the booty insufficient.
  language: English
  quote_policy: summarized
