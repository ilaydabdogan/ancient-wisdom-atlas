- id: obs:3
  text: The warriors say they were sent by a princess of the house of Etsej, who wants
    to avenge her brother's death at Kuba's hands and has waited ten years for her
    nephew because she cannot cross the swollen river herself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The princess sent the warriors because she smelled roasting meat from the
    wood and thought it had been prepared with the savoury-smelling salt possessed
