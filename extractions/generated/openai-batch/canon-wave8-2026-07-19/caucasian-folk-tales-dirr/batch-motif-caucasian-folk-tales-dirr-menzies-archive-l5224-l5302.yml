canonical_text:
  quote: ''
  summary: Näsni is compelled by his wife to go to the Narts after refusing their
    summons. Seeking to escape on a quiet horse, he mounts an old hobbled mare, but
    the mare runs toward battle when it hears shooting. Näsni loses control, accidentally
    uproots a plane tree, and the mare and Narts defeat the enemy; Näsni is made chief.
    The following tale opens with Tschnara, a poor man of the Nelbi, learning from
    his mother that his father left him a wild horse, heavy mail, and a dagger. Tschnara
    claims these items easily, rides into the world, and encounters the sleeping seven
    Nart brothers, whose horses exchange threats with his horse.
  language: English
  quote_policy: summarized
