canonical_text:
  quote: ''
  summary: In a forest with enormous trees, a group of brothers are trapped in a giant
    stone animal-building by a one-eyed giant. The giant roasts and eats sheep and
    then the brothers one by one. The two remaining brothers heat the giant's roasting-spit,
    blind his single eye, disguise themselves in sheep skins to pass through the guarded
    doorway, take animals to their ship, evade the enraged giant at sea, and eventually
    return home.
  language: English
