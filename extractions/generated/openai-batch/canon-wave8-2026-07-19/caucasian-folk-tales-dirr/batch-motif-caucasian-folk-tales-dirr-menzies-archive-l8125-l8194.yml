canonical_text:
  quote: ''
  summary: Chamyts meets a capable youth while on Balz, travels with him, and later
    asks about his tribe in order to court a woman from it. The youth gives his sister
    to Chamyts under a condition that she must not be reproached. Chamyts marries
    her and lives with her in a copper tower. Syrdon insults the wife, who then asks
    to be returned to her parents and tells Chamyts that the son she would have borne
    will instead be placed between his shoulders as a swelling. Chamyts later has
    Soslan cut open the swelling; a boy emerges, is thrown into the sea, and immediately
    becomes as large as a mountain.
  language: English
  quote_policy: summarized
