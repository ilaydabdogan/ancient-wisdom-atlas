canonical_text:
  quote: ''
  summary: A prince and Sartanki flee from her unwilling father with Bald-pate. Her
    father pursues with an army, but the prince returns home alive after being thought
    dead, marries Sartanki, and the pursuing father is reconciled as a guest. In the
    next tale, a Tiflis merchant promises his daughter Mariat to a suitor who can
    produce a special work of art. Three suitors with extraordinary abilities locate
    and rescue her from djinns on a Black Sea island, then quarrel over which of them
    has the rightful claim to marry her.
  language: English
