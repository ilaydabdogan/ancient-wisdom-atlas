canonical_text:
  quote: ''
  summary: A king’s son leaves his mother and goes abroad. On the road he meets a
    stranger who keeps watch at night and treats him generously at breakfast, leading
    the prince to think the stranger would make a good friend. They lodge with an
    old woman in a town and learn that the local king’s daughter has been dumb since
    her seventh year; the king offers her in marriage to whoever can make her speak,
    but unsuccessful suitors are beheaded, and many skulls have already accumulated.
    The prince and his friend decide to attempt the challenge.
