canonical_text:
  quote: ''
  summary: A smith named Daredjiani climbs Elbruz and finds a beautiful woman at a
    precipice who says she is the wife of God and has been cast down for sin. He visits
    her and she becomes pregnant. The smith’s wife cuts off the woman’s strength-bearing
    hair; the woman then extracts her own child, orders that he be laid at a cross-road,
    and dies. Jesus Christ, St. George, and the Angel of the Ways christen the child
    Amiran and give a conditional warning about breaking his word. Amiran grows with
    extraordinary speed and strength, encounters the coffin of a dead giant, is compelled
    by the giant to raise his two sons, and later sees those sons kill a multitude
    of animals while he sleeps.
  language: English
  quote_policy: summarized
