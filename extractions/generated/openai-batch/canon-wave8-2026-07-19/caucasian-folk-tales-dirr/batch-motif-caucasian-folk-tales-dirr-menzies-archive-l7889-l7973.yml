canonical_text:
  quote: thought these creatures really possessed supernatural powers and ran off
    into the depths of the wood.
  summary: A kid frightens a wolf and then a bear by claiming that his companions
    have torn apart and eaten similar wild beasts. After the kid warns the lamb and
    calf that the deceived fox, wolf, and bear may compare stories, the three domestic
    animals hide in a crooked tree. The wild beasts track them there, but the kid
    shouts a new threat assigning each predator to one of his companions; the wild
    beasts believe the animals have supernatural powers and flee. The kid, lamb, and
    calf spend the night safely and are found by their shepherd. The passage then
    begins a new tale in which a grey wolf meets a badger at dawn and greets him.
  language: English
  quote_policy: quoted
