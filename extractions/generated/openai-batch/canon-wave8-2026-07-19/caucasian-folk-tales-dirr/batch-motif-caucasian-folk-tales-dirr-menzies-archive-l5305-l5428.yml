canonical_text:
  quote: ''
  summary: Tschnara reaches a town, stays with a widow, hears of a king's daughter
    whose movement in sleep causes lightning, asks for her hand, and defeats a rival
    king's son and his cavaliers. After the king gives him the princess, the Erchustojer
    Narts deceive him, abduct his bride, and are killed after the bride returns his
    dagger. At home, the bride is stolen again from a locked bridal chamber. Tschnara
    searches, meets a shepherd who identifies the robber as a Nogai-ian and gives
    him a disguise plan. Tschnara enters the wife's room, hears the Nogai-ian boast
    of thefts, and kills him when the wife praises Tschnara's dagger skill.
  language: English
  quote_policy: summarized
