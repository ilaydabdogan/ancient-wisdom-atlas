  summary: 'The passage closes one tale with a spared fish revealing itself and a
    prince restoring his father''s sight. It then begins ''Sartanki'': a prince pursues
    a stag into a cave, becomes deathly ill from love for Sartanki, and is guided
    by Bald-pate across seven seas under a prohibition not to touch underwater treasures.
    In a distant town an old woman helps the prince approach Sartanki with a golden
    samovar; Sartanki, a princess able to transform into creatures, recognizes him
    as the huntsman who drove her into a cave when she was a stag.'
