canonical_text:
  quote: "“if you want a ladder to get up to heaven, my antlers will help you.”"
  summary: A queen uses a stag’s antlers to reach the castle of the sun, where her
    sister, the sun’s wife, hides her from danger. After promising not to harm her,
    the sun gives advice and healing water for the queen’s son and for three afflicted
    beings. The queen returns, relays the advice, cures the afflicted, and her son
    marries Paradise-Rose and takes the throne. The passage then gives a tale-closing
    formula and begins a new tale about a king testing his sons’ worthiness to inherit.
  language: English
  quote_policy: quoted
