canonical_text:
  quote: ''
  summary: A princess defeats male challengers by baring her breast, leading to the
    deaths of two elder brothers. The youngest brother seeks their fate, accepts advice
    from an old man to avert his gaze and rush her, overcomes the princess, and is
    then given a task to find the missing mate of a golden slipper. He travels through
    varied landscapes to a beautiful garden with tents and a spring, where a newcomer
    wakes him and questions his presence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young male opponent swoons after the princess bares her breast; slaves then
    behead him and place his head on a pole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second brother travels the same road to learn the eldest brother’s fate
    and to fight the princess, and he also loses his head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youngest son waits for his brothers, then sets out to learn what happened
    to them and to challenge the princess in single combat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old man asks the youngest son where he is going and offers advice after
    the youth says he values the advice of an old man.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The old man states that the princess conquers adversaries not by strength
    but by baring her breast, and instructs the youth to cast his eyes down and rush
    at her if she does so.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the king’s town the youth is helped, fed, given wine, and entertained before
    the combat, as his elder brothers had been.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At sunrise the princess bares her breast, but the youth does not let his eyes
    rest on her, rushes at her, and overcomes her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youth holds a dagger at the princess’s throat and asks whether to spare
    or behead her; she asks to be spared and says she is his.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The princess agrees to go with and marry the youth only if he finds the missing
    mate of a golden slipper that she gives him.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The youth places the slipper in his knapsack, rides through mountains, gorges,
    rivers, and plains, and reaches a flowered meadow with a garden, tents, and a
    spring.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The youth bathes in the spring and sleeps in the tent until a newcomer wakes
    him and questions whether the garden belongs to his father because he has let
    his horse loose there.
  category: sequence
  evidence_refs:
  - ev:9
