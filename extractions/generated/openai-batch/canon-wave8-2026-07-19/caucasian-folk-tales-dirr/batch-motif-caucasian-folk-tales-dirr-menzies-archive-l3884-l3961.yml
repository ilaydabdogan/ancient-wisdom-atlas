canonical_text:
  quote: ''
  summary: 'The hero wrestles a beaming unknown youth through the day, is directed
    to the youth''s sheep, receives hospitality from shepherds, and learns that the
    sheep belong to a maiden whose castle is guarded by two dragons. He feeds the
    dragons with split mutton, enters the castle, discovers the youth is a maiden,
    wrestles her at night, defeats her by pressing her right breast, and marries her
    after a mullah and assistant appear. After three nights he leaves, learns that
    the slipper sought by the king''s daughter belonged to his wife, receives its
    pair, returns the slippers to the king''s daughter, and is given a new condition:
    find out what passed between Balai and Boti. He rides by an untraveled road to
    a strange land and ties his horse beneath a tree whose branches reach heaven.'
  language: English
  quote_policy: summarized
