canonical_text:
  quote: ''
  summary: In the Abkhasian variant, a noble virgin who has vowed perpetual virginity
    gives birth to Abrskil, a boy who grows with unusual speed and becomes a brave
    defender of his land. After gaining fame, he becomes proud, claims equality with
    God, persecutes selected people and tribes, and cuts vines so that riders will
    not need to bow their heads. God demands that he stop and bow forty times, but
    Abrskil refuses. God sends angels to seize him. Abrskil uses his magic horse Arasch
    to move between a mountain refuge and the shore of the Black Sea. When the angels
    fail to catch him, they seek help from an old witch, who advises a trap with a
    slippery divided ox-skin on Mount Uartsachu.
  language: English
  quote_policy: summarized
