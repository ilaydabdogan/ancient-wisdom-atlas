  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the next tale, a great famine in Daghestan leaves a fox without food, and
    the fox decides to go to Schirwan.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The fox tells a wolf that Schirwan has many sheep and no shepherds guarding
    them; the wolf decides to go with the fox.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fox tells a mule that grass in Schirwan grows so high that one need not
    bend down to eat it; the mule joins the party.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The fox, wolf, and mule reach the borders of Daghestan, climb a hill, and
