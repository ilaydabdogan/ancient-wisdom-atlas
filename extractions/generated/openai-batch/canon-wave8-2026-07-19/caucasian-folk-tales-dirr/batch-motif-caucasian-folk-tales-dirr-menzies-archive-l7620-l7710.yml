canonical_text:
  quote: ''
  summary: 'A hare seeks to free animals from a lion''s tyranny by delaying his turn
    to be eaten, reporting a rival lion, and leading the lion to a well where the
    lion mistakes his reflection for an enemy and drowns. The passage then begins
    another animal tale: during famine in Daghestan, a fox sets out for Schirwan,
    persuades a wolf and mule to join by describing abundant food, and reaches the
    border hill with them.'
  language: English
  quote_policy: summarized
