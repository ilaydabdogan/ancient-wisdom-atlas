  text: The hare says the animals should not allow themselves to be eaten and should
    try to overcome the lion and free themselves from his tyranny.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some animals laugh at the hare because of his small stature compared with
    the lion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hare does not appear on the day when it is his turn to be eaten; the lion
    becomes angry, considers breaking the agreement, and then refrains because of
    concern about other kings' judgment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hare arrives late, crosses his paws respectfully on his breast, greets
    the lion as ruler, and prays for the king's long life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hare tells the lion that another lion claimed the country, asserted ownership
    over the subjects, and took away another hare intended for the lion's breakfast.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lion reacts with intense anger and asks whether the hare can show him
    the rival; the hare leads him to a deep well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the well, the hare says he is afraid to go nearer and asks the lion to
    carry him under his arm so he can show the rival inside.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The lion looks into the water, sees his own reflection, thinks it is the rival
    with the stolen hare, lets the hare escape, jumps into the well, and drowns.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator states the lesson that those who rely on their own strength and
