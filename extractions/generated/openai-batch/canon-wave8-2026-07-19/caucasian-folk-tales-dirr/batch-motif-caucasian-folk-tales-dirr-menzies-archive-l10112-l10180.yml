canonical_text:
  quote: ''
  summary: In this Tatar variant passage, Rustumsal finds himself trapped after a
    maiden and her garden vanish. Inside a doorless, walled castle area he discovers
    seven chained kings, learns that they too were lured by the maiden, frees them,
    and brings them flesh from dead bodies as food. He then beats Iskender's drum
    hanging on a tree, summons the old man, and the old man reads from the Koran so
    that a door opens in the round wall. Rustumsal and the kings leave the bewitched
    castle. Later Rustumsal rides Tulpar and stays near a fortress, while his mother
    urges Qahirman to seek news of him from the bird Smaragd.
  language: English
  quote_policy: summarized
