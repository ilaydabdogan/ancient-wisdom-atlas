canonical_text:
  quote: "“a horse came flying right down from heaven with wings of fire”"
  summary: In this passage from “The Fire-Horse,” a son called stupid keeps watch
    over a damaged field, catches a fiery winged horse, releases it after it promises
    future service, learns how to summon it, and later calls it after being excluded
    by his brothers from a royal feast and marriage contest involving a princess’s
    ring.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A crop is being damaged at night, and the father tells his sons to take turns
    watching the field and trying to catch the thief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest son and the second son each sleep during their night watches and
    report that they saw nothing of the thief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the third night, John, called the stupid son, takes a rope, waits at the
    field edge, and cuts his finger and rubs salt in the wound to stop himself from
    sleeping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At midnight the ground shakes, wind rises, and a horse with fiery wings descends
    from heaven; clouds come from its nostrils and lightning flashes from its eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The horse eats the corn and knocks down more than it eats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: John creeps up to the horse, throws a rope around its neck, holds it until
    it grows tired, and hears it plead for release in exchange for future service.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The horse tells John to summon it by going to the field, whistling three times,
    and calling “Fire-horse”; John releases it and tells it to leave the field alone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: John tells his brothers that he caught a fire-horse and made it promise to
    leave the field in peace; the brothers laugh at him, but the field remains undisturbed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king announces a three-day feast and declares that whoever can jump high
    enough on horseback to reach the princess on a tower balcony and pull a ring from
    her finger will marry her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: John’s brothers go to the feast and refuse to take him; John goes to the field,
    calls the fire-horse, and after jumping over its head his face is changed and
    he becomes handsome.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
