  quote: "“let me be your mother now, and you my son!”"
  summary: An unnamed hero saves giant young eagles from a three-headed dragon. Their
    mother offers him aid and carries him to the dangerous tower of Balai and Boti.
    Balai receives him as a guest, mistreats his half-petrified wife, and begins explaining
    his suspicion of her nocturnal departure on a horse of the winds.
  language: English
