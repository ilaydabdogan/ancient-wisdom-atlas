canonical_text:
  quote: ''
  summary: Satna, dying, orders Chamyts, Urysmag, and Sosryqo to watch her grave.
    Uastyrdji creates false dawns at midnight; Urysmag and Sosryqo resist the deception,
    but Chamyts leaves the grave. Uastyrdji lies beside Satna, sends her his horse
    and hound, and returns to heaven. From the sepulchre are heard a maiden, a horse,
    and a hound; Urysmag finds that Satna has borne a maiden, foal, and young hound,
    and raises them. The child is named Satana; the foal becomes Durdura and the whelp
    a greyhound. A following episode begins with Urysmag, Chamyts, and Sosryqo setting
    out to plunder, meeting Syfyttar, receiving an ill-omened prophecy about snow
    and hunger, becoming trapped by snow, eating a squirrel, and deciding that the
    squirrel skin will go to whoever tells the most wonderful story.
  language: English
  quote_policy: summarized
