canonical_text:
  quote: ''
  summary: In the tale segment, Simon and Peter repeatedly rob a king’s treasury.
    Simon is trapped in hot wax and has Peter cut off his head to prevent identification.
    The guards expose the body to discover mourners, but Simon’s wife, advised by
    Peter, disguises her mourning by breaking crockery. Peter later tricks the guards
    with a donkey, wine, and a false claim that the headless corpse ate the donkey,
    recovering Simon’s body and receiving compensation. The king then asks the thief
    to reveal himself, promises reward, and sends Peter to stop a neighbouring king’s
    mockery; Peter requests specific equipment and reaches the neighbouring king’s
    bedroom while the king and queen are asleep.
  language: English
  quote_policy: summarized
