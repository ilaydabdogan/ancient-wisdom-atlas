canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which a boy proves his parentage
    by causing a dried vine to revive and a roasted pheasant to live again; the king
    accepts the children, restores their mother, and punishes the wicked sisters.
    A new tale then begins: a poor childless couple own a highly capable pig. A prince
    sees the pig shed its skin at water and appear as a radiant maiden. He follows
    her home, buys the pig despite the owners’ reluctance, and insists on marrying
    it despite his father’s anger.'
  language: English
  quote_policy: summarized
