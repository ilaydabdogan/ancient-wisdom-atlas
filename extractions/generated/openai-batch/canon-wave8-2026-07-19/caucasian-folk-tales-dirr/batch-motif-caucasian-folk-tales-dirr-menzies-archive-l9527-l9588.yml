canonical_text:
  quote: ''
  summary: 'Etsemej refuses to surrender his wife, fights alone against Sdsryqo and
    his army, and, while dying, wounds the ears of the whole army with a final shot
    before being killed after his wife is prevented from using a magic cloth to help
    him. The passage then states that Etsemej fulfilled his duty by avenging his father.
    A new Udi Rustum story begins: Rustum, son of a shepherd, grows up at court with
    extraordinary and violent strength; the king sends him to a forest where three
    Divs are expected to kill him, but Rustum kills the Divs and returns with their
    bodies and wood.'
  language: English
  quote_policy: summarized
