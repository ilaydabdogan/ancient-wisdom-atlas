canonical_text:
  quote: ''
  summary: A companion of the king's son tells a judgment tale to make the king's
    daughter speak from behind a curtain. After she answers, she is given in marriage
    to the prince. The companion later kills a serpent entering the bridal room, then
    feigns splitting the bride in two, causing little snakes to leave her mouth. He
    explains that a serpent had loved her, slept beside her, made her dumb through
    its breath, and caused her to carry the little serpents. He gives healing instructions
    for the prince's blind father and departs.
  language: English
  quote_policy: summarized
