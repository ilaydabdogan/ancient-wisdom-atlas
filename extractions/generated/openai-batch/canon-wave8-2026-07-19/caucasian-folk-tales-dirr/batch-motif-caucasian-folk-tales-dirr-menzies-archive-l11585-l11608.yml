  quote: ''
  summary: Alexander of Macedonia, having conquered three-quarters of the world, seeks
    to conquer the remaining quarter inhabited by the Just Poor beyond a sea. An angel
    of God forbids war on them and warns him to send his army first if he will not
    retreat. The army crosses a bridge over the sea and loses its heads; Alexander
    crosses and loses his head; the Just Poor then stone him and the army.
