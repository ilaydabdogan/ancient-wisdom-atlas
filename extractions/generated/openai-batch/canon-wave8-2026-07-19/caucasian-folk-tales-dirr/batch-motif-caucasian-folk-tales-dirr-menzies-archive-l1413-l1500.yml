canonical_text:
  quote: ''
  summary: The passage contains the end of a transformation pursuit in which a fugitive
    changes through animal and object forms while his master pursues in corresponding
    forms; the fugitive finally burns the master’s thread-form and returns home as
    a boy. It then begins the tale of a stepmother’s stepson whose cosmic dream leads
    others to demand that he hand over the dream. After refusing because a dream cannot
    be given, he is expelled, later imprisoned by a king, secretly fed by the king’s
    daughter, and the passage closes as the King of the East sends four mares with
    a guessing challenge.
  language: English
  quote_policy: summarized
