canonical_text:
  quote: ''
  summary: A king’s son follows an old man’s instructions to seize a golden-haired
    maiden until she swears by the cock and hen nightingale to marry him. After a
    horse-recognition test, the pair depart with the birds, but a lute-player abducts
    the maiden into the earth. The king’s son descends, encounters three three-legged
    horses with death, descent, and heavenly-light functions, rides the red horse
    downward to another kingdom, learns that a dragon controls the well and eats maidens,
    protects the threatened maiden, and kills the dragon, releasing access to water.
  language: English
  quote_policy: summarized
