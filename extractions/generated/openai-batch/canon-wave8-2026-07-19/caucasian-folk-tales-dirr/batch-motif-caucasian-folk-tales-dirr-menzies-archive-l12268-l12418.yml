canonical_text:
  quote: ''
  summary: The passage contains comic tales about Kerkendj. In one ending, a Chan
    tests men with plates of grapes and beetles, and releases them after one treats
    the beetles as running grapes. In the woodcutting tale, Kerkendj villagers and
    their priest lose their axes to a Tatar rider, lose their clothes while trying
    to keep the rider’s foal, beat the priest for keeping his trousers, and fall into
    a ravine while trying to pull up a tree by hand. In the donkey’s egg tale, Kirakos
    buys a melon from a Tatar who calls it a donkey’s egg; when it bursts near a tree
    and a hare runs away, Kirakos mistakes the hare for the hatched donkey. He later
    beats his wife after she imagines riding the supposed donkey to a monastery. The
    passage also includes notes linking one episode to a local proverb and stating
    Kerkendj’s reputation for stupidity.
  language: English
  quote_policy: summarized
