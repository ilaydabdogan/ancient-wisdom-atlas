canonical_text:
  quote: ''
  summary: Etsemej forces his mother to reveal that Kuba killed his father and that
    his father’s armour and horse are hidden behind an iron door in the tower. Though
    warned that he is too young, Etsemej opens the tower, controls and tends the long-neglected
    charger, bids farewell to his weeping mother, rides away to avenge his father,
    masters the violent horse, and later makes camp in a dark wood after hunting animals.
  language: English
  quote_policy: summarized
