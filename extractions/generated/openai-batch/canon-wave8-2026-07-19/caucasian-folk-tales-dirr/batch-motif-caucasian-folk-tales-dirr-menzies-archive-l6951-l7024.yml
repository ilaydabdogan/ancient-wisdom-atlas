canonical_text:
  quote: ''
  summary: A woman presents John to her father as her bridegroom; John is bathed,
    anointed, dressed in new garments, and married in festivities lasting seven days
    and nights. A new tale then tells of a merchant whose wife has died and who lives
    with a Djinn woman. Before dying, the merchant commands his son to provide a nightly
    dish of pilaw in a specified stable corner. The son faithfully spends all his
    wealth on this task, then watches and follows a woman who takes the dish to a
    Djinn-inhabited place. There he is welcomed by the Djinn woman as her son, greeted
    by two boys as their brother, and shown a heap of gold representing the money
    he spent on pilaw.
  language: English
  quote_policy: summarized
