canonical_text:
  quote: ''
  summary: A figure leaves heaven and descends to earth with half a glacier on his
    head to withstand heat. Batrás maims Bädsänäg during a dance or contest. Bädsänäg
    returns home wounded, learns from his father that Batrás's strength comes from
    being cased in steel, and pays Kurdalagon to steel him as well. Kurdalagon warns
    that he will burn, but Bädsänäg insists; after being placed in a red-hot furnace,
    only his bones remain.
  language: English
