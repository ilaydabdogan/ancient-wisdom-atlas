canonical_text:
  quote: ''
  summary: 'A hero escapes Balai with the help of a mother eagle, exposes the princess’s
    hidden husband and child, and returns to his wife to become king. A new tale begins:
    a wise king becomes blind and ill; his sons offer to seek a cure, and the king
    names fruit from the garden of the Virgin Queen as the only remedy. The eldest
    son sets out over mountains, meets an old man sewing cracks in the path, and reaches
    a land with rivers of milk and grapes.'
  language: English
  quote_policy: summarized
