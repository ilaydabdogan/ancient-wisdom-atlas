canonical_text:
  quote: ''
  summary: The king’s son asks the pig to remove her skin; she becomes a beautiful
    maiden, is presented to the king, and the couple are crowned. A jealous vizier
    tries to imitate this by marrying the largest ordinary pig, but the pig resists,
    kills him, and returns to its herd. A new tale begins with an old childless peasant
    and his wife. The peasant, equipped in iron, seeks a remedy, is sent across repeated
    sets of nine mountains to black, red, and white Divs, uses signs to gain welcome,
    and accepts the white Div’s bargain for a fertility remedy involving two apples
    and a future return of one son, one foal, and one puppy.
  language: English
  quote_policy: summarized
