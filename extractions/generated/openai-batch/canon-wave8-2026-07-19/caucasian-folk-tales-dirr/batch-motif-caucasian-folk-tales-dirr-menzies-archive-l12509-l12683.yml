canonical_text:
  quote: ''
  summary: 'A sequence of brief Mullah Nasreddin anecdotes presents comic explanations
    and reversals: a child is named Hasid because a nine-month journey was made in
    three; Nasreddin argues that old age has not weakened him because he still cannot
    lift a stone he never could lift; he excuses theft from a garden through a chain
    of wind-related explanations; he divides money by postponing one person''s share;
    he explains failing to resist robbery because his hands were full of weapons;
    he justifies eating nuts with shells, explains away a consumed sheep''s head,
    reverses his opinion of cheese depending on whether it is available, refuses a
    loan with an impossible pretext, and sends noisy boys toward the bazaar by claiming
    free apples are being given away.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says the child shall be called Hasid, glossed as quick-runner, because
    the child made a nine-month journey in three months.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a meeting about youth and age, Nasreddin says an enormous stone in his
    house is one he could not lift as a young man and cannot lift now.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nasreddin enters another person's garden with a basket, tears up vegetables,
    and gives the gardener successive explanations involving a strong wind and his
    need to hold on to something.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When asked to divide four drachmen equally among three people, Nasreddin assigns
    two drachmen to two people and tells the third to wait until God sends two more.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nasreddin returns from a journey armed with a sword and pistol, is robbed,
    and says he could not defend himself because both hands were full.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Asked why he eats nuts with their shells on, Nasreddin says he paid for them
    and shifts blame to the fruit merchant for selling them with shells.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: As a boy, Nasreddin eats the edible parts of a sheep's head on the way home
    and answers his father's questions by saying the sheep may have lacked ears, been
    blind, been dumb, and been mangy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Nasreddin first praises cheese when hungry, then condemns it when his wife
    says there is none, and tells her to believe the statement that matches whether
    she has cheese.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: When a neighbour asks to borrow an olkäna, Nasreddin refuses by saying his
    wife is drying grain on it, and when challenged says he would have claimed flour
    if he did not want to lend it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nasreddin tells noisy village boys outside his window to go to the bazaar
    because apples are being given away there for nothing.
  category: action
  evidence_refs:
  - ev:10
