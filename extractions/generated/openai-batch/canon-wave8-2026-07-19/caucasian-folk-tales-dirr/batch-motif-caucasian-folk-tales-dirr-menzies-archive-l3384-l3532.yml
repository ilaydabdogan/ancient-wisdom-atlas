canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Thavisi impersonates his brother
    Sachwatho, resists a three-headed witch’s deceptive test, fights her with his
    horse and panther, and releases Sachwatho from a box inside her head. The brothers
    return so alike that they are mistaken for one doubled man; Sachwatho is made
    king. A closing formula follows. The next tale begins with the miller Lause-Hadschi
    catching a rag-stealing fox, who promises him wealth, fame, and marriage to the
    chan’s daughter in exchange for lifelong feeding and burial in kurdjuk.
  language: English
  quote_policy: summarized
