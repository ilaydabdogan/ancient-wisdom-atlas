candidate_motifs:
- id: motif:1
  label: Brother rescues brother from a witch’s hidden confinement
  taxonomy_refs:
  - sibling_pair
  basis: Thavisi seeks the woman, fights her, and brings Sachwatho out from the box
    in her head.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The exact nature of the confinement is described as sleep inside a box
    in the woman’s head, not explained further in this passage.
- id: motif:2
  label: Enchanted sleep and awakening through rescue
  taxonomy_refs: []
  basis: Sachwatho says he has been asleep a long time, and Thavisi says he would
    never have awakened if not rescued.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage uses sleep and awakening language rather than explicit death
    or resurrection.
- id: motif:3
  label: Three-headed female antagonist defeated by beheading
  taxonomy_refs: []
  basis: The dreadful woman is said to have three heads, and Thavisi cuts them off
    during the fight.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No further origin or identity for the three-headed woman is provided beyond
    her being called a woman and witch.
- id: motif:4
  label: Indistinguishable brother-double return
  taxonomy_refs:
  - sibling_pair
  basis: On returning, Sachwatho and Thavisi are reported as one man becoming two
    and are so alike that others cannot tell them apart.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage calls them brothers but does not explicitly call them twins.
- id: motif:5
  label: Counter-deception by pretending to obey a dangerous test
  taxonomy_refs: []
  basis: The woman tries to get Thavisi to place wood on his horse, panther, and sword,
    but he only pretends before attacking her.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not directly state what the wood would have done if used.
- id: motif:6
  label: Royal elevation after successful return
  taxonomy_refs:
  - royal_legitimacy
  basis: After the rescue and explanation, the king orders a feast and makes Sachwatho
    king; Thavisi is also said to be king in his own country.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The grounds of Thavisi’s kingship in his own country are not narrated
    in this passage.
- id: motif:7
  label: Talking fox thief becomes promised helper
  taxonomy_refs:
  - trickster_boundary
  basis: A fox that has stolen rags speaks to the miller and promises to make him
    rich, famous, and married to the chan’s daughter.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: Only the opening bargain of the fox tale is included; the fox’s later
    actions are outside the supplied passage.
- id: motif:8
  label: Animal-helper bargain requiring food and burial
  taxonomy_refs: []
  basis: The fox’s help is conditional on being fed with kurdjuk for life and buried
    in one at death.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not explain the cultural meaning of kurdjuk or the burial
    demand.
- id: motif:9
  label: Promised marriage to a ruler’s daughter as social ascent
  taxonomy_refs:
  - royal_legitimacy
  basis: The fox promises that the miller will marry the chan’s daughter and become
    great and famous.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is only a promise in the passage, not yet fulfilled.
