canonical_text:
  quote: ''
  summary: 'The passage opens with a woman begging flour and baking bread for her
    husband. The main episode follows a rich man and a poor man hunting together.
    After two fruitless days, the rich man withholds food and demands one of the poor
    man''s eyes in exchange for bread, then expels him from camp. The injured poor
    man wanders at night, finds an empty house, hides in the rafters, and overhears
    a wolf, bear, and fox describing their possessions and powers: a food-producing
    gold cloth, a pit of gold, and a healing tree. After the animals leave, the poor
    man takes the cloth and money, uses the tree to restore his eye, and meets a shepherd.
    The final supplied line is fragmentary, beginning the wolf''s return.'
  language: English
  quote_policy: summarized
