canonical_text:
  quote: ''
  summary: After Helena's death, Sane resolves to take and display her head as proof
    that her faithlessness has been punished. His friend throws the body into the
    sea and tells him that the seven Baraghun brothers have a sister who may become
    his companion. Sane returns home, has Helena's head exhibited, and searches for
    the Baraghun brothers by land and sea until he reaches their island. The brothers
    receive him, but describe their sister as giant-strong, proud, and cruel. The
    youngest brother undertakes to approach her, and she permits Sane to come. Sane
    proposes marriage; the princess turns away without answering.
  language: English
  quote_policy: summarized
