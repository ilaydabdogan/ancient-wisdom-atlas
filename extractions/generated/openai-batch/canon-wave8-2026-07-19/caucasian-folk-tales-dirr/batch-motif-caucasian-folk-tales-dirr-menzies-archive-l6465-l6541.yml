canonical_text:
  quote: ''
  summary: 'The passage closes an episode of Kitschiiw/Kitschüw: his speaking horse
    equips him with transformations and emergency aid; Kitschiiw becomes a golden
    bird, enters a king''s household, reveals himself to a maiden, performs her trials,
    defeats Ajdahas, and returns with feasts. He then fetches the sister of three
    Ajdahas from a great tree for his friend. The line range also begins the next
    tale, in which a rich man invites a poor man hunting and tells him to obtain provisions
    through his wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The horse speaks to Kitschiiw and says the country contains two kings who
    are brothers, the elder fiercer than the younger.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The horse says it will change Kitschiiw into a golden bird, gives him three
    hairs from its tail, and teaches two words for changing into sand or a grain of
    corn; it also tells him to burn a hair if great danger threatens.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The horse disappears, and Kitschiiw sets himself in bird form at the edge
    of a spring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two rider kings pass by; the younger, a sportsman, catches the golden bird
    despite his elder brother's warning and later gives it to one of his sisters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bird pecks the sister, she says her breast belongs to Kitschüw, and the
    bird takes human form as Kitschiiw.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden says Kitschiiw must wrestle with her, change into sand, and fight
    seventy Ajdahas before she can belong to him.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Kitschiiw forces the maiden to the ground, changes into sand, burns a horse-tail
    hair, and with the appearing horse overcomes and slays the seventy Ajdahas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kitschiiw mounts his horse, places the maiden before him, rides home, and
    a feast is arranged for his return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kitschiiw is said to have two wives, but he is not allowed to go to them until
    he fetches the sister of the three Ajdahas for his friend.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kitschiiw kills the three Ajdahas; their sister sits in the middle of a great
