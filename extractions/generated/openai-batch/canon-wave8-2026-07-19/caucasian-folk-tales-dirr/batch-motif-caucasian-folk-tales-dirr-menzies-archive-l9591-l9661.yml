canonical_text:
  quote: ''
  summary: 'In the Udi variant, an old witch advises the king to send Rustum to fight
    a white Div. The Div requires a forty-day fast before combat; Rustum weakens,
    bids farewell to his mother, and then defeats the Div. After leaving the king’s
    house, Rustum recruits three men with extraordinary abilities: one shades reapers
    with a nut-tree, one grinds corn with millstones tied to his feet, and one drinks
    water from a river. The four build a hut in a wood and divide hunting and cooking
    duties. While the nut-tree man cooks pilaw, an Adschdaha comes, binds him with
    a moustache hair, eats the food, and leaves; the same episode is said to happen
    to the millstone man, and the water-drinker’s turn begins.'
  language: English
  quote_policy: summarized
