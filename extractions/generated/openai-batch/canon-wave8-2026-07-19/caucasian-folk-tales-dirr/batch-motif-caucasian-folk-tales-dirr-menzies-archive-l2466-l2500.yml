canonical_text:
  quote: ''
  summary: After thirsty people drink excessively at a well and some die, the king’s
    daughter returns home. Her father seeks the person who saved her; messengers find
    the youth. The youth has a hare in his breast-pocket, which frightens the king’s
    daughter, but she sits beside him at her father’s instruction. The youth is honored
    in the palace but refuses marriage and asks only to be sent home. The king says
    he cannot do this but directs him to a falcon’s nest troubled by an eagle that
    devours the young. The youth, called the king’s son in this sequence, kills the
    eagle with an arrow. The young falcons receive and fondle him; he sleeps in their
    nest as the mother falcon returns.
  language: English
  quote_policy: summarized
