canonical_text:
  quote: ''
  summary: In a Tatar variant, Rustumsal seeks the king, forces entry past the guards,
    and asks which Div carried off his aunt. The king secretly sends for Rustumsal’s
    father, Qahirman. Qahirman and the king reveal that the aunt is with the forty-headed
    Div, king of all the Divs, and that ancestral weapons are in the royal armoury.
    Rustumsal takes a sword, lance, and bow, ignores his parents’ pleas, declares
    that he must rescue his aunt, and rides away, saying that if he does not return
    within seven years he is dead.
  language: English
  quote_policy: summarized
