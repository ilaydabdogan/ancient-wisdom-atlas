canonical_text:
  quote: ''
  summary: In the tale of Sane and Helena, Sane searches far and wide for a bride,
    finds the beautiful Helena, marries her, and brings her home. A local custom requires
    a young husband to leave his wife after a fortnight and travel for a year, so
    Sane departs. During his absence a handsome merchant from Schahar lodges in the
    prince's house, displays rare luxury goods, and becomes intimate with Helena.
    As Sane's return approaches, the lovers fear separation, and the merchant asks
    a waiting-woman for help.
  language: English
