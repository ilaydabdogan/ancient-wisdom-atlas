canonical_text:
  quote: ''
  summary: John repeatedly rides his fire-horse to the king’s festival, attempts to
    leap up to the princess on a high balcony, succeeds on the third day, takes her
    ring, hides it under a bandage, and is later questioned by the princess when the
    ring gleams on his finger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: John rides to the feast, where a crowd has gathered in the square before the
    king’s palace and the king’s daughter sits on a high tower balcony with a shining
    ring.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the first attempt, John grips his horse, the animal leaps, and the leap
    falls short by three steps; John then flees and returns home, where he is again
    described as stupid John.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the next day, the elder brothers again refuse to take John; John calls
    his fire-horse, rides to the palace, and the second leap falls short by two steps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the third day, John strikes the horse with his whip, the horse reaches
    the balcony, and John pulls the ring from the princess’s finger before riding
    away while the king, queen, and people shout for him to be stopped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After returning home, John binds his hand with a rag and tells the women of
    the house that he pricked it while picking berries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When John uncovers the ring at home, the hut begins to shine, and his brothers
    accuse him of playing with fire and nearly setting the house on fire.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Royal messengers command all the people of the country to attend a new festival,
    with death as the penalty for absence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father goes to the festival with his whole family; at the banquet the
    princess hands out honey-water, and John appears in torn clothes, dirty hair,
    and a dirty rag around his hand.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The princess asks why John’s hand is bound and asks to see it; when John removes
    the bandage, the princess’s ring gleams and sparkles on his finger.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
