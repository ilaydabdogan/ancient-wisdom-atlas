canonical_text:
  quote: ''
  summary: Sósryqo kills Eltaghan with Eltaghan’s own sword after Eltaghan is trapped
    in ice; the severed head briefly pursues Sósryqo while gripping a sword. Sósryqo
    takes the scalp and possessions, orders young women to sew a fur-collar from scalps
    and moustaches, and the women consult a witch to outwit him by sending him after
    the golden scalp of Mukkara son of Taryk. Sósryqo challenges Mukkara to a dice
    contest on the Sakola road, where dice produce grain, chickens, a boar, hounds,
    fire in the Nart houses, and rain that quenches the fire; Mukkara concedes defeat.
  language: English
  quote_policy: summarized
