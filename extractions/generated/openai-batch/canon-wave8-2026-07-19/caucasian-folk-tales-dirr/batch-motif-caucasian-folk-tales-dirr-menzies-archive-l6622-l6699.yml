canonical_text:
  quote: ''
  summary: A poor man obtains a wolf's brain after a shepherd wounds the wolf, uses
    it boiled in milk to cure a sick prince, and receives rich gifts. A rich man coerces
    the poor man into revealing the source of his fortune, pays with one eye, then
    goes to the animal dwelling and hides among the rafters while the bear, wolf,
    and fox return and discover losses.
  language: English
  quote_policy: summarized
