canonical_text:
  quote: ''
  summary: In “The Cheated Fox,” a hungry fox recruits a hare, tries to attack a horse,
    is deceived by the horse’s claim of gold hidden in its hoof, is kicked, then is
    struck by a stone thrown by an unseen shepherd. The excerpt then begins “The Bird
    Who Was Clever for Others,” where a fox regularly threatens a nesting dove for
    one of her young; Malik Ulhazin advises the dove to challenge the fox to climb
    up, and the fox goes to seek Malik Ulhazin by a river.
  language: English
  quote_policy: summarized
