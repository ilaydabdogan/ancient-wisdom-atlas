canonical_text:
  quote: ''
  summary: A man divides two apples among his wife, himself, his mare, and his dog,
    after which paired human and animal offspring with golden and fiery features are
    born and grow quickly. As the Div comes to claim a promised half, Sachwatho learns
    the cause of his father's grief, volunteers to go, is chosen with a foal and panther-cub,
    receives a warning that the Div plans to kill and eat them, flees across mountains,
    and escapes over the sea with the help of a speaking fiery-hoofed horse.
  language: English
  quote_policy: summarized
