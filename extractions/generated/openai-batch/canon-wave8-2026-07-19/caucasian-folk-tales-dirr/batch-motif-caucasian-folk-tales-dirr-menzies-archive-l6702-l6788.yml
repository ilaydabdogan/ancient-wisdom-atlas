canonical_text:
  quote: ''
  summary: The excerpt closes a preceding tale in which the bear and fox kill and
    eat the wolf, then discover the rich man hidden in the rafters and eat him too;
    the narrator states that God appointed a happy life for the poor man. In “The
    Helpful Ram,” a stepmother favors her own daughter and gives only hard bread to
    her husband’s daughter. A ram pities the weeping girl and instructs her to pull
    out and shake his right horn, which produces food and drink. The girl becomes
    joyful. The stepmother tells her own daughter to push the girl over the cliffs,
    but the ram instructs the girl to decoy the other daughter to the cliff and then
    knocks the wife’s daughter over. The excerpt ends with the opening of “The Fire-Horse,”
    introducing an old man with three sons, two clever and one idle, dirty, and stupid.
  language: English
