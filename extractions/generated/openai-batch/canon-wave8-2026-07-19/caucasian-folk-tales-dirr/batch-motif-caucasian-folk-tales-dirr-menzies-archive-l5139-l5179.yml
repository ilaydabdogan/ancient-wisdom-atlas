canonical_text:
  quote: ''
  summary: The passage introduces the very timid Näsni, who accidentally kills three
    flies with a sabre, then has the sabre inscribed with a claim that he killed sixty-three
    Erchustojer Narts. He sets out carrying flour, sleeps by a pear tree in a ravine,
    and is approached by seven Erchustojer Nart brothers, described as giants, whose
    youngest member reads the inscription. When Näsni wakes, the giants demand that
    he show his powers, and he shows them the sabre.
