  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The merchant sees the dead wolves, embraces and kisses Urysmag, and tells
    others what he has done.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: A Kabardian merchant obtains Urysmag, ties bran bread around his neck, and
