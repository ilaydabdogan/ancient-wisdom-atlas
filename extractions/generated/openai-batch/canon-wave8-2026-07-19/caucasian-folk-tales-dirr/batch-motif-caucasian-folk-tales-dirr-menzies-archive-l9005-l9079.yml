canonical_text:
  quote: ''
  summary: 'A sequence of Nart tales is recounted: Chamyts reports shooting at two
    seven-member meetings whose survivors complain to God; Sósryqo tells of traveling
    toward his dead beloved, entering her grave, and receiving interpretations of
    strange signs; Urysmag tells how he was struck by Uadstyrdji''s wife, became a
    fierce dog, guarded merchants'' sheep, and killed wolves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chamyts says he shot at seven Uástyrdji holding a meeting on a mountain; three
    remained and four flew to God to complain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chamyts says he shot at seven Uatsillas holding a meeting on another mountain;
    four remained, three went to God, and he totals seven killed and seven complainants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other speakers say Chamyts' tale is not a misfortune for him and ask Sósryqo
    to speak.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sósryqo says he set out armed and on horseback to visit his sweetheart in
    Tynty; a shepherd told him she had already been dead for a week.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sósryqo says he wept but continued, intending to take his sweetheart out of
    her grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the way, Sósryqo sees a rope that becomes longer and shorter, then a pigskin
    boot fighting a morocco-leather boot, with the pigskin boot winning.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sósryqo opens the grave of his beloved, enters it, remains there for a week
    after it is filled in, and then crawls out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While in the grave, Sósryqo hears young dogs baying in the grave of his beloved's
    parents.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sósryqo's brother-in-law explains that the baying dogs are connected with
    the parents' refusal of bread to the poor, lack of sympathy, and inhospitality
    to travelers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brother-in-law explains the rope as referring to land division between
    close kin, and the fighting boots as referring to common people becoming equal
    to and stronger than the nobility.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The other speakers say Sósryqo's stay in a grave is strange but that the things
    he saw are not wonderful, and they ask Urysmag to speak.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Urysmag says he visited Uadstyrdji's wife, declared his desire for her, and
    was struck by her with a hide whip.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After being struck, Urysmag says he changed himself into a fierce dog.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: As a dog, Urysmag runs about seeking food, is followed by other dogs, and
    has puppies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A merchant takes the dog-form Urysmag to guard sheep, chains him, and hangs
    a salted sheep around his neck, which Urysmag eats.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Seven wolves come to the door and ask to be let in, saying they will repay
