canonical_text:
  quote: ''
  summary: A youth follows his father’s instructions to enter the Virgin Queen’s towers
    and garden by using iron, grass, and wood in matched ways, crosses rivers of milk,
    oil, and honey, takes fruit, and leaves marks of his visit on the sleeping queen.
    The fruit restores his blind father. The Virgin Queen discovers the intrusion
    through her mirror, brings armies from her seven kingdoms, tests the brothers’
    claims, recognizes the youngest son by his knowledge of the method, reciprocates
    the kisses and bites, heals the blind king, and marries the youth. A separate
    tale tells of a widow who receives three divinely fulfilled wishes on the fifteenth
    night of Ramadan, using them to enlarge, shrink, and restore her son’s head. The
    next tale begins by introducing Arsuman and his family.
  language: English
  quote_policy: summarized
