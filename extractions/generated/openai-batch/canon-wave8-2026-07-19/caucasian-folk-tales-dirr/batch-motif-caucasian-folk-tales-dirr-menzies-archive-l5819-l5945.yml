canonical_text:
  quote: ''
  summary: A merchant who is Helena’s lover bribes her waiting-woman to help him carry
    Helena away by boat while she is bathing. The waiting-woman conceals the disappearance
    for three days, then raises an alarm. Sane returns, learns that his wife is gone,
    searches unsuccessfully in his kingdom, and receives advice from his father’s
    old tutor to search beyond the sea.
  language: English
  quote_policy: summarized
