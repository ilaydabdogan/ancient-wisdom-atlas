canonical_text:
  quote: ''
  summary: 'Cinder-Stick repeatedly deceives one or more Divs into believing he has
    extraordinary strength: he imitates squeezing water from stone by using cheese,
    has a Div carry him across a river, explains accidents with a huge loaf as intentional,
    pretends he will move an entire wine-barrel, and threatens to pull a roof rafter
    out as a mere stick.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cinder-Stick makes a hole in his sack and swings it around his head, raising
    a large cloud of dust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Div commands Cinder-Stick to squeeze water out of a stone; Cinder-Stick
    squeezes a new cheese so that water runs out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cinder-Stick asks the Div to carry him across the river on the Div’s shoulders
    so that he will not wet his feet, and the Div obeys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Div says Cinder-Stick is light, Cinder-Stick claims he is holding
    on to heaven with one hand; after the Div tells him to let go, Cinder-Stick bores
    an awl into the Div’s head until the Div tells him to hold on again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the Div’s house, an enormous loaf is in the oven; Cinder-Stick tries to
    turn it, slips, and becomes trapped under it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cinder-Stick tells the Divs that he put the warm loaf on his body because
    of an internal pain and asks them to take it away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Divs request wine and give Cinder-Stick a huge jug; outside, he stands
    with a spade as if preparing to dig out the wine-barrel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Divs become alarmed because they believe Cinder-Stick intends to bring
    in a full wine-barrel that nine of them can hardly move when empty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A cough from one Div blows Cinder-Stick up to the ceiling, where he clings
