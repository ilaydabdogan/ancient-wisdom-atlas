canonical_text:
  quote: ''
  summary: 'The passage concludes a hiding contest: a youth is carried by a crane
    to heaven but is found by a maiden using a mirror; with a fox''s help he later
    hides beneath the maiden''s divan and wins, after which he and the maiden marry.
    The next tale begins with Cinder-Stick, a lazy husband who is locked out by his
    wife, leaves with ashes, an awl, and cheese, and encounters a giant Div drinking
    from a broad river.'
  language: English
  quote_policy: summarized
