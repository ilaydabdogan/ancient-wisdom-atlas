canonical_text:
  quote: ''
  summary: In the Udian-variant ending, an old woman removes Rustum's ring, throws
    it into a well, and traps Rustum's second wife in a box that appears in the king's
    courtyard. Rustum's companions are alerted by blackened ring-stones; the water-drinker
    drains the well, retrieves the ring, and restores Rustum. Rustum then defeats
    the king, recovers his wife, and the tale closes with a divine three-apples formula.
    In the Tatar-variant opening, Rustumsal learns from an old woman that his aunt
    was taken by a forty-headed white Div; despite denials from his parents and wise
    men, he leaves town to seek her.
  language: English
  quote_policy: summarized
