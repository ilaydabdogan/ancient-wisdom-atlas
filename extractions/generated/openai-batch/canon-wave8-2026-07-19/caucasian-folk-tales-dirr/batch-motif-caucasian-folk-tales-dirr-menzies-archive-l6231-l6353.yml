canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Sane secretly aids his
    warrior wife during a raid, is wounded, and is recognized by the silk kerchief
    she used to bind his hand. She reveals her secret martial life, including a prior
    adventure in male dress, and then renounces those habits before public celebration.
    The passage then begins “Kitschüw”: the kings of Schura and Petrowsk vow that
    their future son and daughter will marry, the children are born and grow precociously,
    and a three-headed Ajdaha, aided by his magical mother, becomes a golden bird
    to approach and abduct the princess.'
  language: English
  quote_policy: summarized
