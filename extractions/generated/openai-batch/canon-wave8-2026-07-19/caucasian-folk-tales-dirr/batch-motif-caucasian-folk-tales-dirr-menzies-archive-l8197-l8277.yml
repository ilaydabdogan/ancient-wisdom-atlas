canonical_text:
  quote: ''
  summary: 'The excerpt narrates Batras at the sea-shore: he demands that Urysmag
    be brought and shaved, rises from the sea, seizes sea-oxen, and displays strength
    that kills or strains horses. He then seeks to be steeled by Kurdalagon, who uses
    an oven, fire, and finally the sea; Batras''s heat dries the sea until he emerges.
    The passage then begins a new tale in which Chamyts challenges a malik, kills
    men sent against him, and the malik consults a wise woman who recommends using
    a wolfskin against Chamyts'' horse.'
  language: English
  quote_policy: summarized
