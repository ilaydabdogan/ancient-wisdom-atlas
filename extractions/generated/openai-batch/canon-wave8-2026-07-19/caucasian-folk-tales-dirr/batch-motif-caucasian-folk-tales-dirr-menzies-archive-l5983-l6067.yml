canonical_text:
  quote: ''
  summary: Sane follows his friend's advice and disguises himself as a hunchbacked
    beggar to search for Helena. After finding her in a large house and being angrily
    expelled, he returns to his friend, who advises force. Sane and the friend raid
    the house, carry Helena away, fight through a crowd to a waiting ship, and sail
    homeward. Near home, the friend asks Sane to divide his prize; when Sane objects,
    the friend cuts Helena into two halves with his sabre.
  language: English
