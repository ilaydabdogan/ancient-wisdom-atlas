canonical_text:
  quote: ''
  summary: Kuba’s wife secretly dismisses the guards around Etsemej’s corpse and revives
    him with a magic towel. Etsemej overhears that Kuba can be killed only with a
    hidden black knife, steals it, beheads Kuba, impersonates him, and leaves with
    Kuba’s widow. At a river reflection she recognizes that she is with Etsemej. Later
    Sdésryqo greets Etsemej, demands toll for passage, and asks for Kuba’s wife rather
    than wealth or slaves.
  language: English
  quote_policy: summarized
