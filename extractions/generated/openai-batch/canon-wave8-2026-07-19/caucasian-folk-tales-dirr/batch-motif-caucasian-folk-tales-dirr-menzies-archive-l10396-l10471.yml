canonical_text:
  quote: ''
  summary: Rustumsal is told by a heavenly voice to carry his dead son Djambachysch
    in a trough on his head for forty days so that he may return to life. Near the
    end of the task, an old man washing black wool at a river persuades him that the
    dead cannot live again; Rustumsal sets the trough down, and Djambachysch, almost
    restored, dies again. Rustumsal later leaves his kingdom to seek the land of the
    Djinns, seizes a fortified mountain town on the way, and Djanabbas fights an opponent
    whom he then discovers to be a woman and spares.
  language: English
  quote_policy: summarized
