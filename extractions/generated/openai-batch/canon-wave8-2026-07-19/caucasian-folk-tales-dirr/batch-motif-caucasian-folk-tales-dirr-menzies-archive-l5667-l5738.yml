  quote: ''
  summary: In the close of “The Magic Animals,” an old man receives a food-giving
    horse, a gold-giving goat, and finally a self-acting cudgel from an old woman.
    People who mock him secretly exchange the horse and goat, but the cudgel beats
    them until they restore both. He returns home with all three and lives peacefully
    with his wife. The passage then begins “The Beautiful Helena,” introducing a fortified
    seaside town ruled by Prince Sane, whose advisers urge him to marry; finding no
    suitable bride, he arms himself, saddles his horse, and travels away.
