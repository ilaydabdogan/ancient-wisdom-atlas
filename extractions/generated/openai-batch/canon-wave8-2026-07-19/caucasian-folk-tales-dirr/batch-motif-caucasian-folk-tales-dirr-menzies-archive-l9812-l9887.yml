canonical_text:
  quote: ''
  summary: After being carried to the overworld by a bird, Rustum is healed from a
    thigh wound made when he cut flesh from himself for the bird. The bird gives him
    two feathers as a future summons. Rustum returns to his companions, reconciles
    with them, takes the beautiful maiden, distributes other maidens, and the companions
    exchange trouble-signaling rings. Rustum later kills a Div, takes the Div's wife
    as a second wife, and becomes the target of a king's plot to obtain her. An old
    witch infiltrates Rustum's household, learns through his second wife that Rustum's
    strength depends on a ring, and begins to oil his finger while he sleeps.
  language: English
  quote_policy: summarized
