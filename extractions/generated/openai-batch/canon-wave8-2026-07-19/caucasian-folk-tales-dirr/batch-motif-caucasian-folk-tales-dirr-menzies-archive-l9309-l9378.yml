canonical_text:
  quote: ''
  summary: After capturing Kuba's horses, Etsemej sends his aunt and her warriors
    home with the herd while he remains to confront Kuba. He rests on a hill, is alerted
    by his horse, and sees Kuba approach on a strange six-legged horse with fiery
    and celestial features. Etsemej repeatedly misdirects Kuba with false directions
    before finally admitting that he drove away the horses.
