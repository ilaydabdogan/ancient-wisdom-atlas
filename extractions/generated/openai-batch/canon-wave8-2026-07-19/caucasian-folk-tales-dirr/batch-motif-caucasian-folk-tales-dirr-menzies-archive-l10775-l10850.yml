canonical_text:
  quote: ''
  summary: In the Suanetian variant, Amiran breaks his word, repeatedly strikes the
    magic horse Raschi despite promises, and falls under the power of demons. They
    bind him on Mount Elbruz, chain him to an iron stake opposite a nine-headed Div,
    and leave a sword out of reach. Nail growth would allow one captive to reach the
    sword, but a watcher bird tells the demons when Amiran's nails grow long, and
    they cut them. A future time is foretold when Amiran will reach the sword, kill
    the Div, free himself, and bring a Golden Age. In the Kabardian variant, a one-eyed
    giant attempts to penetrate divine secrets at Mount Elbruz; God chains him to
    rocks and sends a bird of prey to torment him and prevent him from drinking immortality-giving
    spring water. A future time is foretold when God will release the giant to take
    vengeance on mankind.
  language: English
  quote_policy: summarized
