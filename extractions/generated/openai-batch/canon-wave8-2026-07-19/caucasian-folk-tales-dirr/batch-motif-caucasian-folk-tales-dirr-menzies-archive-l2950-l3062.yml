canonical_text:
  quote: ''
  summary: Sachwatho enters a new kingdom, exchanges a golden robe for a swineherd’s
    ragged clothes and a pig’s bladder, and hides his golden hair while becoming the
    king’s gooseherd. His horse leaves him a tail hair by which he can summon the
    horse and panther. The youngest princess sees Sachwatho’s golden hair when he
    bathes in the river, falls in love, and later uses three gherkins to tell her
    father that she and her sisters wish to marry. At a bride-choice gathering, the
    elder sisters choose the vizier and high steward, while the youngest chooses the
    apparently bald gooseherd. The older couples receive riches and fine houses; the
    youngest and Sachwatho are lodged in a henhouse and mocked.
  language: English
  quote_policy: summarized
