canonical_text:
  quote: ''
  summary: 'A mother falcon, grateful that the king''s son saved her young, carries
    him home after he provisions her with buffalo meat. When the meat runs out, he
    cuts flesh from his own body to feed her; she later heals the wound with a feather.
    The king''s son finds the abducted maiden, learns that the beardless lute-player''s
    life is kept in three birds behind nine locks, kills the birds, and the lute-player
    dies. He returns with the maiden and the cock and hen nightingale; his father
    blesses him, crowns him, gives him the maiden as wife, and holds a wedding feast.
    A new tale begins: a wicked stepmother demands that a man drive away his three
    daughters; the father devises a plan involving an apple tree and a concealed deep
    hole.'
  language: English
  quote_policy: summarized
