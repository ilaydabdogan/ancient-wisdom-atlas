canonical_text:
  quote: ''
  summary: 'The excerpt contains animal-fable material: a mule avoids being eaten
    by sending a wolf to inspect its hoof and kicking him; a fox then eats the dead
    wolf. In the next tale, a wolf, bear, and fox lure a donkey with a promise of
    future barley, kill him, and the fox tricks the others so he can keep the meat.
    The excerpt ends with the opening of another tale, where a hungry fox sees a partridge
    in a tree.'
