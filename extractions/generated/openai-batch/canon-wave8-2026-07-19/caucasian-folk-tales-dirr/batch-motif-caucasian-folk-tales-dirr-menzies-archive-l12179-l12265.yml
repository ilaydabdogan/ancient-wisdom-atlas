canonical_text:
  quote: A large field was sown with salt.
  summary: The excerpt closes one comic anecdote with a roof collapse after a post
    is struck. It then tells of two brothers from the mountain village of Lahitsch
    who sow salt in a field, find no crop in spring, blame flies for eating it, and
    shoot at the flies, including one on a brother's brow. The excerpt begins another
    anecdote in which three Lahitsch villagers learn only one Tatar word each; when
    questioned beside a dead body, their words make them appear to confess to murder
    and they are imprisoned.
  language: English
  quote_policy: quoted
