canonical_text:
  quote: ''
  summary: A tale segment describes three men who buy a swift horse, an all-seeing
    telescope, and life-restoring medicine. The telescope reveals that the maiden
    they court is near death; the horse carries the medicine-bearer to her, and one
    drop restores her. The men dispute who has the right to marry her. In the outer
    frame, a candlestick asks a young man for judgment, a silent girl answers differently,
    and the young man claims her. A Djinn woman then instructs him to address a tachta,
    under which she will hide and answer. The tachta begins another story about a
    carpenter, tailor, and scholar who contribute to a wooden human figure, ending
    with the scholar praying that it receive a soul.
  language: English
  quote_policy: summarized
