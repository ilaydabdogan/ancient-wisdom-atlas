canonical_text:
  quote: "“Look, that is the Sun and that is the Moon. And he who washes my hands
    and feet, he is a twinkling star.”"
  summary: 'The king sets further trials for the Dreamer and his companions: a race
    to bring distant water, a poisoned wedding feast, and the carrying away of the
    dowry. The Dreamer’s helpers overcome each challenge, and the passage ends with
    the Dreamer returning home and identifying his two wives and son as the Sun, Moon,
    and a star.'
  language: English
  quote_policy: quoted
