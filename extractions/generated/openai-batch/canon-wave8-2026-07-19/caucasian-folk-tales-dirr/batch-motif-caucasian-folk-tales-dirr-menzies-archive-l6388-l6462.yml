canonical_text:
  quote: ''
  summary: Kitschüw travels with brothers and Aslanä on Tulpan horses to a great sea.
    Through the eldest brother's prayer the sea opens, revealing the three-headed
    Ajdaha asleep under the sea with Altuntschatscha. Altuntschatscha tells Kitschüw
    that Ajdaha's soul is in a box inside a fish; Kitschüw destroys it, cuts off Ajdaha's
    heads, and rescues her. Ajdaha's mother Enäj later restores him through another
    fish that has swallowed his soul. Ajdaha pursues Kitschüw; the second brother's
    prayer causes a high tower to appear, and Kitschüw again cuts off Ajdaha's three
    heads. After a return and feast, Kitschüw announces a solitary journey, asks Altuntschatscha
    to wait a fixed span of time, chooses the path marked as one from which he will
    not return, and bathes in a spring at the instruction of his speaking horse.
  language: English
  quote_policy: summarized
