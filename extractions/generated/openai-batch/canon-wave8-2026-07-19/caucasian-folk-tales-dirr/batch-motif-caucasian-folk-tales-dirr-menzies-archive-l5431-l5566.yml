canonical_text:
  quote: ''
  summary: 'An old nobleman tests his three daughters'' courage. The youngest, dressed
    as a man, proves brave and travels onward. She accepts a task to carry away a
    guarded maiden for the Chan''s son. After saving three young serpents from a burning
    plain, she receives aid from their mother, a good spirit, who provides horses,
    instructions, and magical help for several tasks: seizing the maiden, retrieving
    a locked box wrapped in dog-skin, and bringing sea buffalo and their milk. A buffalo
    curse changes the heroine into a man. In a hot-milk marriage ordeal the Chan''s
    son dies, the bride survives, and the transformed heroine marries her.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old nobleman with three daughters and no sons orders each daughter to dress
    in men's clothes, mount a horse, and seek adventure while he waits under a bridge
    to test her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest and second daughters are frightened when seized at the bridge,
    fall from their horses, and swoon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youngest daughter controls her frightened horse and strikes the assailant
    with her riding-whip, injuring her father's little finger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a town, the disguised youngest daughter hears that the Chan wants someone
    to set free a maiden watched over by many spirits for his son, and she agrees
    to attempt the task.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a burning plain, the heroine saves three young serpents from the flames
    with her riding-switch, follows them, and enters an opened kurgan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kurgan houses the mother of the three young serpents, described as a good
    spirit, who offers to do anything for the heroine because the young serpents were
    saved.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The serpent mother gives the heroine a black horse and instructions for seizing
    the watched maiden and escaping pursuit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The heroine follows the instructions and brings the stolen maiden safely to
