  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bride refuses to sign marriage deeds unless a box with seven locks, wrapped
    in a dog-skin and hidden in a secret room, is brought to her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The serpent mother instructs the heroine to use a grey horse, walk like a
    dog, and touch doors with a little stick so that the doors and dog-skin open by
    themselves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The bride next demands that a buffalo ox and seven buffalo cows dwelling in
