canonical_text:
  quote: ''
  summary: At the end of a dice contest, Mukkara’s dice release doves and Sosryqo’s
    dice release sparrow-hawks that kill them. Mukkara concedes, but Sosryqo refuses
    to behead him, removes his scalp, heals him with herbs, and carries the scalp
    home to be made into a collar. In the following tale, Chamyts, Sosryqo, and Urysmag
    dispute their age order and consult their eldest sister in Tynty. She identifies
    the one with saddle-bags on his horse, Chamyts, as the youngest. Angered, Chamyts
    curses her with the brown donkey of the Boras; she gives him the Tooth of Arqys
    to avert harm. The tooth compels a loved woman to yield, but if its possessor
    refuses her, she becomes a serpent. Chamyts then uses deceit and the tooth against
    the daughter of the Alagas, who transforms into a serpent. The Alagas offer gold
    for his mercy; after two years he returns and rubs her with the tooth, but the
    passage breaks off before the outcome.
  language: English
  quote_policy: summarized
