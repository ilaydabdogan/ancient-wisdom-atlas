canonical_text:
  quote: ''
  summary: A mother forbids her son to enter another room. He disobeys, sees a beautiful
    picture above the door, swoons, and declares that he must find the maiden shown
    in it. His mother equips him and sends him with a woman guide toward the daughter
    of the Chan. The guide instructs him how to visit the silent maiden, address a
    candlestick behind which the guide will hide, and hear a story with a disputed
    point. The inserted story begins with three friends who love the same maiden and
    a father who sets a trading contest to decide which suitor will marry her.
  language: English
  quote_policy: summarized
