canonical_text:
  quote: ''
  summary: The passage closes a prior episode in which a maiden recovers human form,
    becomes more beautiful, and is taken by Chamyts as beloved. A new tale begins
    with the Narts in council, where Urysmag and Sosryqo quarrel about bravery and
    wives. Sosryqo repents disrespecting his elders and leaves armed on horseback
    to seek death rather than bear shame. Satana tries to prevent the loss, sends
    for her brother-in-law, and he follows Sosryqo wearing grave-clothes. At Jelusaned
    he enters the river first and offers Sosryqo his sister, described as desired
    by angels, if Sosryqo will turn back. The sister refuses to marry a Nart, causing
    Sosryqo to complain to the Narts and summon a troop. A boy born to a witch the
    previous night appears at the muster and claims he can help as much as a hundred
    men and control Urysmag’s difficult horse.
  language: English
  quote_policy: summarized
