canonical_text:
  quote: ''
  summary: Rustumsal and his father confront the forces of the king of the Divs. After
    the Div army is defeated, the king sends giants, but Rustumsal kills a challenger
    and wins the battle with help from the seven kings and their army. Rustumsal enters
    the Div king’s house, recovers a woman who identifies herself as his aunt, and
    learns that his father had denied her existence to keep him from going to the
    land of the Divs. The company loads booty on camels and travels home; the seven
    kings later part from Rustumsal. Near his native town, Rustumsal finds people
    dressed in black mourning his absence and hears that strange conquerors threaten
    the land. He sends a man ahead with news of the return of himself, his father,
    and his aunt.
  language: English
  quote_policy: summarized
