canonical_text:
  quote: ''
  summary: Rustum descends to the underworld on a goat, encounters a community whose
    well is blocked by a serpent, kills that serpent, is identified by bloody handmarks,
    asks the king to return him to the overworld, saves a bird’s young from another
    serpent, and is carried upward by the bird while supplying meat and water, finally
    cutting flesh from his own thigh when a piece of meat misses the bird’s beak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After feathers are struck together, a sheep and a goat stand before Rustum.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rustum tries to seat himself on the sheep, but the goat gets between them;
    he sits on the goat, which takes him down to the underworld.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman gives Rustum dirty water and tells him that a serpent sits in
    the well, prevents access, and must receive a daily present for water to be obtained.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king’s daughter brings a dish of pilaw as the serpent’s present for obtaining
    water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rustum eats the pilaw, waits for the serpent, kills it when it comes out,
    cuts it to pieces, and the water becomes red with the serpent’s blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king’s daughter places her hands in the bloody water and then lays them
    on Rustum’s back; she later identifies him by the two bloody handmarks.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The king offers Rustum whatever he desires; Rustum asks only to be sent back
    to the overworld, but the king says he cannot do that and directs him to a bird
    whose young are eaten by a serpent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rustum kills the serpent at the bird’s nest and sleeps there; when the bird
    returns and threatens him, the young birds say the serpent was the one who killed
    the young.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bird shelters Rustum with her wings, reassures him, agrees to serve him,
    and asks for seven hundredweight of meat and seven hundredweight of water before
    carrying him to the overworld.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the flight, Rustum is to throw meat and water into the bird’s beak
