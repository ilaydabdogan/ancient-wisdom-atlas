canonical_text:
  quote: ''
  summary: Qahirman rides the bird Smaragd for two weeks to reach the fortress where
    his son Rustumsal lives, avoiding a mistaken attack when Rustumsal recognizes
    his father’s voice. Father and son stay together and hunt. The seven kings whom
    Rustumsal had delivered from a spell assemble armies to seek him, announce a gold
    reward for whoever finds him, and are led to him by a searcher. They come to help
    Rustumsal; he feeds their army by hunting. Rustumsal then proposes a campaign
    against the white Divs, and their army appears.
  language: English
  quote_policy: summarized
