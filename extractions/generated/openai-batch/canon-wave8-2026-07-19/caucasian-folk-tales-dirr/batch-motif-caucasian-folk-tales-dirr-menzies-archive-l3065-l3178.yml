canonical_text:
  quote: ''
  summary: An aging king without a son decides to test his sons-in-law before leaving
    his kingdom. He sends them first for the liver connected with a captured hind
    and later for milk from a mother panther. Sachwatho, outwardly a poor bald-headed
    gooseherd, repeatedly leaves town in disguise, summons a fine horse, appears in
    golden garments, obtains the needed animals with animal help, and makes the vizier
    and high steward surrender body parts in exchange for the remedies. He then returns
    in rags and is mocked, while the other sons-in-law receive credit; his wife waits
    patiently.
  language: English
  quote_policy: summarized
