canonical_text:
  quote: ''
  summary: The queen finds her daughter's room empty and searches fail to locate the
    princess. The five eldest sons of the King of Schura seek her and encounter their
    youngest brother, Kitschiiw, who says the three-headed Ajdaha carried off Altuntschatscha,
    Golden Locks. The brothers plan a rescue and receive promises of horses, weapons,
    provisions, and prayer-based aid for the journey.
  language: English
