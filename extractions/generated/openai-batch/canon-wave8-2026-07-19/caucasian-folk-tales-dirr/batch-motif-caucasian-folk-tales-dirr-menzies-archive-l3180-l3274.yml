canonical_text:
  quote: ''
  summary: The king again sends his sons-in-law for a remedy, this time the Water
    of Life. Sachwatho, the gooseherd, secretly obtains it with the aid of a summoned
    horse at a spring guarded by clashing rocks. The other sons-in-law acquire the
    water from him and receive credit when the king recovers. Later, in war, Sachwatho
    disguises himself in golden garments and fights as an unknown knight with the
    help of his horse and panther. After the king binds the unknown knight’s wounded
    arm with a silken kerchief, a test involving wine and apples exposes Sachwatho’s
    hidden wound.
  language: English
  quote_policy: summarized
