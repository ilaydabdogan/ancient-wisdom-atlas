canonical_text:
  quote: ''
  summary: A servant loses a valuable tree after revealing Solomon’s counsel-linked
    secret to his wife, who tells the Armenians. Solomon helps him recover it through
    a riddle about where the sun rises, making the sun reverse direction according
    to the Armenians’ answers. Later, a king tests Solomon by claiming the servant’s
    knife. The servant is imprisoned, but Solomon speaks loudly to a cat so the servant
    can overhear a legal counter-argument. The servant repeats it and is freed with
    gifts.
  language: English
  quote_policy: summarized
