canonical_text:
  quote: ''
  summary: 'A youth answers a dispute about an animated wooden maiden; the maiden
    declares that the scholar who prayed for her soul has the strongest claim, then
    accepts the youth as bridegroom. The Chan accepts him as son-in-law and later
    lets the couple depart with wealth. The youth returns to his mother, recovers
    the gold spent to fulfill his father’s wish, travels by Djinn to his father’s
    former place, becomes Chan, has a son, and gives thanks to God. A following animal
    fable begins: a foal, goat, and pig become friends, enter a pit where wolves are
    feasting, frighten the wolves with their combined sounds, settle there, and later
    frighten the wolves again when the wolves misinterpret ordinary animal behavior
    as threats.'
  language: English
  quote_policy: summarized
