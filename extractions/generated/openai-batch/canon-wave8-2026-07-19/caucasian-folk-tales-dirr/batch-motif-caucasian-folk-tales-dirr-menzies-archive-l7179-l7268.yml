candidate_motifs:
- id: motif:1
  label: life granted to a crafted wooden maiden through prayer
  taxonomy_refs:
  - sacred_birth
  basis: A maiden made from wood becomes a living speaker after the scholar prays
    to God for a soul for her.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage describes animation and ensoulment rather than an ordinary
    birth; the taxonomy reference is approximate.
- id: motif:2
  label: truth-speaking bride breaks silence to correct a false judgment
  taxonomy_refs:
  - wisdom
  basis: The maiden cannot contain herself when the youth and tachta give answers
    she regards as wrong, and she explains why the scholar’s claim is valid.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage supports a wisdom or judgment pattern, but does not explicitly
    frame it as a formal test beyond the tachta’s question.
- id: motif:3
  label: bridegroom obtains royal acceptance after hidden story is revealed
  taxonomy_refs:
  - sacred_marriage
  - royal_legitimacy
  basis: The maiden presents the youth as bridegroom; after hearing the story, the
    Chan accepts him as son-in-law and holds a wedding-feast.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Royal succession is offered later, but the passage does not describe a
    ritual sacred marriage; taxonomy fit is broad.
- id: motif:4
  label: faithful fulfillment of a father’s wish rewarded by restored wealth and kingship
  taxonomy_refs:
  - return
  - royal_legitimacy
  - sacred_exchange
  basis: The youth returns to his mother, recovers the gold spent to fulfill his father’s
    last wish, travels to his father’s former place, becomes Chan, and thanks God
    for restoring his money.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage explicitly connects filial faithfulness, restored money, and
    gratitude to God, but does not detail the father’s earlier wish within this excerpt.
- id: motif:5
  label: animal friendship pact and shared dwelling
  taxonomy_refs: []
  basis: The foal, goat, and pig swear friendship and search for a place where they
    can live together happily.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available motif
