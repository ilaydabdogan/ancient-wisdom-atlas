canonical_text:
  quote: ''
  summary: Etsemej reveals himself as the son of Etsej and says he has come to avenge
    his father. Kuba and Etsemej choose a gun duel over wrestling. They fight for
    several days, with Kuba returning home to have his wife rub bullets from his body,
    while Etsemej persists despite severe wounds. On the fourth morning Kuba finds
    Etsemej lifeless, strips his armour, drags the body home, and orders a guard over
    it.
  language: English
  quote_policy: summarized
