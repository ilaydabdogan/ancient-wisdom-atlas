canonical_text:
  quote: ''
  summary: A youth in the Land of the Ever-Living encounters an immortal maiden called
    Beauty. Time passes differently there, and after a century he longs for home.
    Beauty warns that his people are long dead, gives him three apples, and sends
    him away. On his return he finds former waymarks dead or transformed, his village
    changed, and his mother remembered only as someone from a thousand years before.
    At the ruins of his mother’s house he eats the apples, rapidly ages, dies, and
    is buried by the villagers.
  language: English
  quote_policy: summarized
