canonical_text:
  quote: ''
  summary: A wife hides three male visitors in comic disguises as successive men arrive,
    including her real husband; the husband exposes or frightens the hidden men, and
    the couple takes their property. The next tale begins with three nearly identical
    brothers, a meager inheritance of an empty house and a goat, and a dispute in
    which the younger brothers plan to steal the goat while the eldest hides it.
  language: English
  quote_policy: summarized
