canonical_text:
  quote: ''
  summary: Rose of Paradise flees a pursuing Div by throwing objects that become obstructing
    forests, then takes refuge in a little house whose doors open after prayer. Inside
    she finds a coffin containing a king’s son who is dead by day and alive by night.
    He discovers her, marries her, gives her a ring for protection from wild dogs
    at his father’s court, and she bears a son there. The king and queen note the
    child’s likeness to their son, while the prince awakens and calls to Rose from
    the window.
  language: English
  quote_policy: summarized
