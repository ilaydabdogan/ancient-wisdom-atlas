canonical_text:
  quote: ''
  summary: The passage contains the end of a grey-wolf tale in which a badger escapes
    by persuading a wolf to throw him up and down the road, then refuses a deceptive
    offer of comfort and the wolf dies of rage. In a second animal fable, a lamb,
    kid, and hen frighten a bear, wolf, and pig who come seeking fire; the predators
    misread the weaker animals' behavior and fall over a precipice. In a third fable,
    a wolf, fox, and camel find one small loaf and agree that the eldest should eat
    it; the wolf and fox make primeval age claims involving Noah, the Ark, the Flood,
    God, Adam, and Eve, but the camel simply takes and eats the bread.
  language: English
  quote_policy: summarized
