canonical_text:
  quote: ''
  summary: A prince repeatedly visits Paradise-Rose at night and questions her about
    her bed and their son's cradle. After the king verifies the visits, he arranges
    for Paradise-Rose and the child to be placed in silk bedding and a golden cradle
    while he and courtiers hide nearby. Paradise-Rose lures the prince into the room
    by saying their child is ill; he is seized, his parents rejoice to see him alive,
    but at dawn he dies and cannot be revived. The queen then sets out to consult
    her sister, who is married to the sun. On the way she is asked to carry requests
    for help concerning a difficult childbirth and a man suffering in a red-hot oven,
    and she sees a stag with horns locked in the heavens.
  language: English
  quote_policy: summarized
