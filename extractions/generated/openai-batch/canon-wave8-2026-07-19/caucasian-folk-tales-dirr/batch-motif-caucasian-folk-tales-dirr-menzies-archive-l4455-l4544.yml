canonical_text:
  quote: ''
  summary: 'The passage contains the ending of a tale in which a singing bird identifies
    itself as a slain and eaten child, obtains goods by singing, blinds its father
    and mother, rewards its little sister, and disappears. It then begins ''The Faithful
    Servant'': a king gives money to his three sons to test them; the elder sons spend
    theirs in merrymaking, while the youngest pays a debt owed by a dead man so that
    a grave-spoiler will stop insulting the grave.'
  language: English
