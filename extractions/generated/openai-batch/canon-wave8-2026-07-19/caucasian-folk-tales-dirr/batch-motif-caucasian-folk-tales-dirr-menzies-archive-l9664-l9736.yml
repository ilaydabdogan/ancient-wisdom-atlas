canonical_text:
  quote: ''
  summary: Rustum kills the Adschdaha, follows the clue of its rolling head to a deep
    hole, descends where companions cannot, breaks through seven iron doors, kills
    several Divs, frees four maidens, receives two feathers that can summon a white
    sheep leading upward to heaven or a black goat leading downward to the underworld,
    and is abandoned below by companions who covet the beautiful fourth maiden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Adschdaha appears while Rustum is at home, asks for soup, tries to bind
    Rustum with a hair from its moustache, and is killed when Rustum tears off its
    head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Adschdaha's severed head rolls to a hole and falls into it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rustum and the others find that the hole is very deep, fetch a rope, and lower
    three companions into it; each says he is burning and is pulled up.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rustum tells the others not to pull him up even if he screams, and he is lowered
    to the bottom of the hole.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the bottom Rustum finds iron doors and breaks open seven of them in succession.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rustum finds a young maiden with a Div sleeping on her knee; after the Div
    wakes and says it smells human flesh, Rustum kills it and frees her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The freed maiden tells Rustum that her sister is also in the power of a Div,
    and Rustum frees the second and third maidens in similar fashion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Behind a fourth strong door Rustum finds a beautiful maiden, a black Div sleeping
    on her knee, and the head of the Adschdaha; he crushes the head, kills the Div,
    and chooses the maiden for himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rustum sends the first three maidens up by the rope and insists that the beautiful
    maiden go up before him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The beautiful maiden gives Rustum two feathers and says that clapping them
    together will summon a white sheep and a black goat; the sheep leads to heaven
    and the goat to the underworld.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Rustum's companions see the beautiful maiden above, they do not lower
