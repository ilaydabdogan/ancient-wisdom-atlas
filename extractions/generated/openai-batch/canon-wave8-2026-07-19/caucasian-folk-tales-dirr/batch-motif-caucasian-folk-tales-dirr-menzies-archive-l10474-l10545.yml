canonical_text:
  quote: ''
  summary: A maiden accepts defeat and a marriage condition involving conquest. After
    feasting, Rustumsal proceeds toward the land of the Djinns despite warnings from
    Djanabbas’ wife. The army reaches a one-entrance Djinn fortress, where Rustumsal,
    Djanabbas, and Söhrab are caught under a spell and see many men turned to stone.
    Djanabbas’ wife arrives with a Book of Spells, produces fire-rain and a river,
    and eventually frees them. She then identifies a speck in the heavens that must
    be killed by cannon fire; missed shots cause progressive petrification. Djanabbas
    fires, misses, and his feet become stone before he is told he must continue firing.
  language: English
  quote_policy: summarized
