  summary: The Almighty tells the Parasite to go home. After receiving answers for
    the wolf, oak, and fish, the Parasite returns. He removes a diamond from the fish’s
    left gill, restoring its sight, but rejects the diamond gift. He then helps the
    oak by digging up a buried wine-jar full of gold and silver, but rejects that
    treasure as well.
