canonical_text:
  quote: ''
  summary: 'The passage contains three Solomon wisdom episodes: young Solomon exposes
    a king’s unjust seizure of foals by an absurd analogy about dogs and wolves; Solomon
    visits a cave hermit whose silent gestures are interpreted by a courtier as moral
    counsel; and Solomon summons birds for a wife’s requested feather castle until
    an owl objects to the harm done to the birds.'
