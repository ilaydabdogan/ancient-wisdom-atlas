canonical_text:
  quote: ''
  summary: A fox tricks Malik Ulhazin into putting his head under his wing and eats
    him. In 'The Donkey and the Camel,' a donkey ignores a camel's warning and sings;
    a caravan hears, captures both animals, loads them, and drives them away. When
    the donkey tires, the merchants place the donkey and his load on the camel. On
    a mountain path beside a precipice, the camel announces a desire to dance, and
    the donkey falls over the precipice. A footnote summarizes Georgian and Hurkanian
    variants of a fox-and-bird revenge story. The opening of 'The Fox and the Crane'
    describes sworn friendship between a fox and crane, each with three young, and
    the fox killing the young cranes while pretending to mourn.
  language: English
  quote_policy: summarized
