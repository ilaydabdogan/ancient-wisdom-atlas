canonical_text:
  quote: ''
  summary: Balai recounts pursuing Boti to the tower of the Narts, killing six Nart
    brothers and maiming the youngest. Boti escapes, uses a magic whip to transform
    Balai into a dog and later a hawk; Balai regains human form with the whip and
    transforms Boti in turn. He reveals that Boti’s sister hides the maimed Nart as
    her husband. After hearing this, the hero escapes on the mother eagle while Balai
    waits.
  language: English
  quote_policy: summarized
