canonical_text:
  quote: ''
  summary: The passage narrates Sosryqo’s non-ordinary birth from a stone made fertile
    after Uastyrdji sits on it, his immediate activity and violent victories over
    three youths, a challenge directing him to Eltaghan beyond the Black Sea, and
    Sosryqo’s visit to Eltaghan where hospitality is followed by tests of bodily invulnerability
    and a frozen-water trial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sosryqo is said to belong to the race of the Bora and not to have been brought
    up by his father and mother.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Satana is described as a good wife, and the angels say they would willingly
    take her as beloved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Satana lays washed clothes on a stone; Uastyrdji sits on that stone, and the
    stone becomes fertile.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Satana counts the months, cuts open the stone at the proper time, and Sosryqo
    comes out looking like ice and immediately begins to play.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sosryqo plays with the three sons of Burafarnaygs and by midday wins and cuts
    the right arm from each.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the next day Sosryqo proposes a contest over moustaches, wins by midday,
    cuts off the youths’ moustaches, and takes them home.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On the following day Sosryqo proposes a contest over right eyes, wins, and
    removes one eye from each youth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother of the youths tells Sosryqo that Eltaghan, son of Kutsyg, lives
    on the Field of Chasma behind the Black Sea and has a skull of gold; she challenges
    Sosryqo to kill him and use his scalp as a collar for a fur cape.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sosryqo becomes sorrowful on hearing the challenge and resolves that he must
    go to Eltaghan.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sosryqo reaches Eltaghan’s house; Eltaghan greets him as an honored guest
    and asks where he has come from.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Eltaghan kills a golden sheep and gives Sosryqo hospitality.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Sosryqo speaks of Sosryqo in the third person, saying bullets would fall from
    his breast like pears, and Eltaghan asks the guest to test this on him.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Sosryqo fires two heavily loaded bullets at Eltaghan’s breast, and the bullets
    fall to the ground as if they were pears.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sosryqo says a sharpened sword cannot cut even two hairs from Sosryqo’s head,
    and Eltaghan asks that this test also be tried on him.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Sosryqo strikes Eltaghan with a sword but cannot cut through even two hairs.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Sosryqo describes a winter test in which Sosryqo would break through frozen
    Terek water with his head after being placed in a hole for a week.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: Eltaghan consents to the frozen-water test; after the water freezes, he pushes
    his head through, but his shoulders remain stuck.
  category: sequence
  evidence_refs:
  - ev:17
