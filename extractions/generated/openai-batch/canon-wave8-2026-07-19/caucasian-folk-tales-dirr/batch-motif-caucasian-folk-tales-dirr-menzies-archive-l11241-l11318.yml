  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The giant orders his son to bring a roasting-spit, places Urysmag on it near
    the fire, and lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spit has passed between Urysmag’s clothes and body rather than through
    his body, allowing him to free himself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Urysmag heats the spit red-hot in the fire and drives it into the giant’s
    one eye, blinding him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Urysmag also kills the giant’s son.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the morning, the hungry sheep bleat, and the blinded giant opens the cave
    but stands at the entrance to let the animals out one by one.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Urysmag kills the giant’s favorite large white long-horned goat, pulls the
