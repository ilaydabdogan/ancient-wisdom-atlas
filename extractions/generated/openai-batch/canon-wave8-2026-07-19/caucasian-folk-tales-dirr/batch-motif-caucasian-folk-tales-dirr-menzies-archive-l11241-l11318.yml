canonical_text:
  quote: ''
  summary: Urysmag leads Narts on a journey, encounters a huge one-eyed shepherd at
    the foot of a mountain, is captured after trying to seize a sheep, is confined
    in the giant’s cave, avoids being roasted, blinds the sleeping giant with a heated
    spit, kills the giant’s son, and escapes through the guarded cave mouth by wearing
    the skin of the giant’s favorite white goat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Urysmag returns from wanderings and finds the Narts sitting together in a
    sorrowful mood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Narts call for someone to show himself a man, and some of the best set
    out with Urysmag on travels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a long journey marked by tiredness and hunger, Urysmag sees an extraordinarily
    large shepherd herding sheep at the foot of a mountain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Urysmag asks which companion will fetch a fat sheep; when none volunteers,
    he goes himself and takes the best sheep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sheep pulls Urysmag along, and he falls into the hands of the one-eyed
    giant, who puts him in a knapsack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Inside the knapsack, Urysmag eats the herdsman’s provisions while the giant
    threatens to squeeze him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At sunset the shepherd drives the flock to a cave and closes its entrance
