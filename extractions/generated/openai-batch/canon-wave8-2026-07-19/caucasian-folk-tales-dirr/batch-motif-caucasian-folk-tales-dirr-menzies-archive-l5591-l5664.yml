canonical_text:
  quote: ''
  summary: The excerpt concludes an episode in which a step-daughter survives a bear's
    midnight bell-running challenge with help from a mouse and returns in a silver
    wagon. Her step-mother tries to send her own daughter to obtain the same reward,
    but that daughter mistreats the mouse and is eaten by the bear; her bones are
    brought home. The family dog repeatedly announces the true returning object or
    person and is beaten for it. The passage then begins another tale, in which a
    poor couple spare their only hen after it lays a golden egg, but the hen disappears
    and the old man goes searching for it.
