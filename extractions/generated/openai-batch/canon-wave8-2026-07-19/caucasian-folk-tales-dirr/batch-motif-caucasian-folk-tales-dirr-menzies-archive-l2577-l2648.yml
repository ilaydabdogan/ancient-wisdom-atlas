canonical_text:
  quote: ''
  summary: Three daughters are abandoned in a deep hole; the youngest prays for her
    hands to become digging tools and escapes, later feeding her sisters from the
    king’s stable. Brought before the king, the sisters state marvelous abilities;
    the youngest says she can bear a boy and girl with golden locks, and the king
    marries her. After she bears golden-haired children, her sisters and a nurse substitute
    puppies, throw the children into a mill-stream, and cause the mother to be chained
    and shamed at the gate. A childless miller rescues and adopts the children, who
    grow rapidly. At a royal feast they tend the shamed woman with roses, wipe away
    soot, kiss her, and declare her to be their mother.
  language: English
  quote_policy: summarized
