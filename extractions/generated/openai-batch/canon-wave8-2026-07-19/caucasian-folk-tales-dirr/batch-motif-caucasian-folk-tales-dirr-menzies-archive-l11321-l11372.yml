canonical_text:
  quote: ''
  summary: Urysmig waits outside a cave until a flock comes out, taunts a blind giant,
    and drives the flock to the Narts, who share the spoil and give Urysmig an extra
    portion because he saved them from hunger. In a second episode, Solomon the Wise
    offers a servant either wages or three pieces of advice. The servant chooses advice,
    follows an instruction involving a serpent skin on a stick in his courtyard, and
    a tree with golden fruit grows from it. The servant becomes wealthy and marries.
    During his absence, three visitors lodge with his wife, see the golden-fruited
    tree, decide to steal it, and question her about its origin.
  language: English
  quote_policy: summarized
