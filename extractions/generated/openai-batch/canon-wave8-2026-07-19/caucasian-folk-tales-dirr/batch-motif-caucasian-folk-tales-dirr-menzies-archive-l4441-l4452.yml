  summary: An ill wife asks her husband for Arsuman's flesh. The husband kills his
    son and gives the flesh to his wife to eat. The daughter later finds a little
    finger in her soup, recognizes it as her brother's, wraps it in a napkin, and
    carries it to a church, where it changes into a bird that flies to a draper.
