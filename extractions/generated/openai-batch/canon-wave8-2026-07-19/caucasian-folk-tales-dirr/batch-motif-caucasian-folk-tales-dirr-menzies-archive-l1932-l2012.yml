canonical_text:
  quote: ''
  summary: A peasant seeks gifts for his three daughters. The youngest asks for a
    Rose of Paradise, which is said to grow in the dangerous garden of a Div. The
    peasant steals the rose and is chased by the Div, who demands the rose or the
    youngest daughter. The daughter goes with the Div, is later marked for killing
    and cooking by the Div's sister, kills the sister instead, escapes with magical
    objects, and uses a magic mirror to create a glass forest during the Div's pursuit.
  language: English
  quote_policy: summarized
