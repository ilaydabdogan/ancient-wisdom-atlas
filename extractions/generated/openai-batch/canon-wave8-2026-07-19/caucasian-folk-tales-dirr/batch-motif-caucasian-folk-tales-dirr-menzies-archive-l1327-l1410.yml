  - ev:1
- id: obs:2
  text: The boy tells his father to chase out a hare while he changes himself into
    a hound, catches the hare, is sold, then changes back and follows his father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father raises a hare, and the son changes into a greyhound, catches and
    kills the hare before the nobles, and is sold to them as a hound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the nobles loose the purchased hound after another hare, the hound gets
    out of sight, changes back into a boy, and runs after his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Father and son decide they have not gained enough money and meet a second
    troop of nobles hawking pheasants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy changes into a falcon, catches a pheasant, is sold to the nobles,
