canonical_text:
  quote: ''
  summary: A father and son travel home. The son repeatedly changes into animals so
    his father can sell him to hunters, then escapes by returning to human form. After
    two successful sales as a hound and a falcon, he becomes a horse and warns his
    father not to sell him to a glistening-eyed man and to remove the bridle first.
    The father sells the horse and bridle to the glistening-eyed man, who is pleased
    that his pupil has fallen back into his hands and confines him in a dark room.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Father and son set out on a homeward journey and meet a troop of nobles hunting
    a hare with a hound that cannot catch it.
  category: sequence
