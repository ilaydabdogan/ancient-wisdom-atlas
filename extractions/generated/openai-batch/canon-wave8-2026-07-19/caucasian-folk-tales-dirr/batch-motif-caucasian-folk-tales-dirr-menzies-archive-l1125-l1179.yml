  summary: In the tale section titled “THE PARASITE II,” the Parasite travels toward
    God. Along the way, an unnamed speaker, an oak tree, and a fish ask him to put
    questions to God about their conditions. At the mountain top, a stag offers its
    antlers as a ladder so the Parasite can go higher. The Parasite climbs, hears
