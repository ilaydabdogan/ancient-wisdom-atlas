  quote: ''
  summary: At the close of a tale about thieving brothers, Badyr and the returning
    group find an empty nest, recognize they have been outwitted, repent disobeying
    their eldest brother Hadji, ask pardon, and are reconciled over a goat meal. A
    new tale begins in which two mullahs quarrel over which of them a passing rider
    greeted; after they pursue and question him, he says his greeting was for the
    stupider of the two, prompting another quarrel.
