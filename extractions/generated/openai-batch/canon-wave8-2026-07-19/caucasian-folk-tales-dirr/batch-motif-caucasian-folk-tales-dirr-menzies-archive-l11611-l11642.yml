  quote: ''
  summary: A tale section headed as knavish tricks introduces Peter, the son of a
    dead thief, who asks his uncle Simon to teach him his father’s trade. Simon tests
    him by demonstrating how to pull a feather from a dove in a tree unnoticed, but
    Peter secretly removes Simon’s underclothing during the demonstration. Impressed,
    Simon proposes stealing from the king’s treasury; they break in at night and take
    money, and the thief is not found the next day.
