canonical_text:
  quote: ''
  summary: The passage narrates the return of Rustumsal with his father and grandfather,
    then recounts how Rustumsal's separated wife had three sons raised without knowing
    their father or one another. The eldest, Djambachysch, learns his father's name
    and sets out to find him. After showing great strength in farm work, he is brought
    before a king and wrestles his brothers, defeating them. Rustumsal then wrestles
    him, fatally stabs him when unable to overcome him, and only then learns that
    Djambachysch is his son.
  language: English
  quote_policy: summarized
