  summary: The introductory passage recounts a 1904 fieldwork episode in Thuschetia,
    where a very old informant dictated tales that proved familiar, including a Tell
    story later remembered as read in a Georgian school reader. The passage then cautiously
    suggests that the story of The Beautiful Helena may have reached the Kabardians
    through contact with Grecian colonies near the Black Sea, while a commentary leaves
    origin or borrowing unresolved. The editor also explains the book's inclusion
    of several genres, literal translation policy, and limited source notes.
