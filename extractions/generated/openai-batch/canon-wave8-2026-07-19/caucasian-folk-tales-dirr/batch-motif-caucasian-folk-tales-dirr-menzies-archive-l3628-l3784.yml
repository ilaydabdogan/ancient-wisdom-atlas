- id: motif:3
  label: Transfer of wealth through orchestrated testimony
  taxonomy_refs: []
  basis: The fox arranges for multiple workers and keepers to say that the dragon’s
    cattle, horses, sheep, fields, and meadows belong to Bukutschichan; the retinue
    accepts this as evidence of Bukutschichan’s riches.
  evidence_refs:
