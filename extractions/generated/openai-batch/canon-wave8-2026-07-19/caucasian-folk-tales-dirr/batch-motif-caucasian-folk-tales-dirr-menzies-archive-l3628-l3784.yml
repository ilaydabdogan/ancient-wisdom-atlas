canonical_text:
  quote: ''
  summary: 'The passage concludes the Bukutschichan episode: after Bukutschichan marries
    the chan’s daughter, the fox runs ahead, persuades the dragon’s servants to name
    Bukutschichan as owner of the dragon’s herds and fields, tricks the dragon into
    hiding in a hay-stack, burns him, and installs the couple in the dragon’s castle.
    The fox later tests Bukutschichan by pretending to be dead, reminds him of earlier
    dependence on the fox, and eventually truly dies; Bukutschichan, thinking it another
    trick, rolls him in a kurdjuk. The passage then begins “Balai and Boti”: after
    a king’s death, the eldest of three sons sets out to court a southern king’s daughter
    who will marry only the man who defeats her in single combat; he rejects an old
    man’s counsel and declares his challenge at the southern king’s town.'
  language: English
  quote_policy: summarized
