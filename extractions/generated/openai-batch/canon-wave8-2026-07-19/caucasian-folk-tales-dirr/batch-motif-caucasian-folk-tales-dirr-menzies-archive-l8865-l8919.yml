canonical_text:
  quote: ''
  summary: During a battle, an allied boy offers to attack from a mountain, changes
    into a black hen, dislodges rock onto the enemy town, and is wounded by Tschilachsérton
    with God-given arrows. Urysmag tries to carry the boy across three valleys, which
    would make him immortal, but drops him after Syrdon's taunt, and the boy dies.
    Batrás descends from heaven, carries and uses a cannon as his means of entry into
    the enemy town, compels Tschilachsarton's daughter to marry his brother, and the
    Narts plunder the town while Sósryqo takes his bride. A new tale begins with Uástyrdji
    sending a message to Satana that he wants her as his beloved; her refusal is only
    partly included in the supplied passage.
  language: English
  quote_policy: summarized
