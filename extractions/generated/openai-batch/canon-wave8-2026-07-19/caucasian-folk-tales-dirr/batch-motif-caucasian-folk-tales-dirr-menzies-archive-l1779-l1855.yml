canonical_text:
  quote: ''
  summary: The supplied passage first closes a preceding tale with a king giving his
    throne, kingdom, and crown to the Dreamer. It then begins a tale about a widow's
    son who, after learning that his father is dead and that all people must die,
    leaves home to seek a land without death. He wanders the earth without finding
    it, meets a vast-antlered stag and a raven who each call themselves God's messenger
    yet admit they too will die after long tasks are fulfilled, refuses their offers
    to stay, and arrives at the sea near a doorless glass house. Inside he finds a
    beautiful maiden who tells him that no such deathless land exists and that the
    earth will have its own.
  language: English
  quote_policy: summarized
