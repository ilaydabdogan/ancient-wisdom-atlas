canonical_text:
  quote: ''
  summary: The passage begins the tale of the fisherman’s son. The son releases a
    blood-red fish that gives him a bone and promises aid. After his father drives
    him away, the youth rescues a stag, a crane, and a fox, each of which gives him
    a token and promises help. He then seeks to marry a castle maiden who requires
    suitors to hide where she cannot find them, with death as the penalty for failure.
    The red fish hides him in a sea-bottom cave and the stag hides him behind the
    ninth mountain, but the maiden finds him each time by looking in her mirror.
  language: English
  quote_policy: summarized
