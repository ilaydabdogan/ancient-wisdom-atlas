canonical_text:
  quote: ''
  summary: 'The Dreamer gathers additional companions with extraordinary abilities,
    including a man advising ants in an underworld war, an archer whose arrow returns
    after three days, a man secretly changing doves'' wings, and a priest carrying
    his church. The eight companions go to the King of the East to ask for his daughter.
    The king sets dangerous tasks: eating all bread baked for three days and drinking
    an enormous wine barrel in one sitting. The clod-eater and sea-water-drinker complete
    the tasks.'
  language: English
  quote_policy: summarized
