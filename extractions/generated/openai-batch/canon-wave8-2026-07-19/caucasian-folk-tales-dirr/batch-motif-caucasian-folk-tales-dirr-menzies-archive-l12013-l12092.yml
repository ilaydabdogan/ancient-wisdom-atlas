canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a horseman asks two arguing
    men to recount their most foolish acts, followed by their stories of pupils obeying
    foolish instructions. It then begins another tale in which a wife interprets the
    order to mind the door literally, removes the door, and later flees to a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two disputants argue about which of them is more stupid, and a horseman tells
    them to recount the stupidest thing each has done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first speaker says he once ordered thirty pupils to clap their hands,
    rather than speak, whenever he sneezed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During digging for a mosque-court festival, the first speaker is pulled from
    a hole by pupils with a rope while holding a sack of earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the first speaker sneezes near the top of the hole, the pupils let go
    of the rope and clap, and he falls and is injured.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second speaker says he ordered forty pupils not to exchange any speech
    except what was absolutely necessary.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the second speaker is ill, the pupils carry him on a rug, make soup but
    eat it themselves, and declare him dead while he remains silent.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A mullah washes and wraps the silent teacher in grave-clothes; a pupil puts
    dolma in his mouth, and a doctor cuts open his cheek and removes it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The horseman says, “It was you I greeted,” then turns his horse and rides
    away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the following tale, a man with two wives tells the wife called stupid to
    mind the door while he and the clever wife go to the fields.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The stupid wife guards the door, then removes it from its hinges and carries
    it to her neighbours.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When questioned, the stupid wife says she was told to look after the door
    and has faithfully done so.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: After being beaten, the stupid wife runs to the fields and climbs a tree;
    a hen with chickens comes to the tree.
  category: sequence
  evidence_refs:
  - ev:10
