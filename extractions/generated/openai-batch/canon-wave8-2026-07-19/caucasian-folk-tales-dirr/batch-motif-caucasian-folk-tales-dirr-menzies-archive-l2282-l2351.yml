canonical_text:
  quote: ''
  summary: A king asks his sons whether they can build a faultless church. The youngest
    son accepts and repeatedly builds or rebuilds churches after a passing old man
    identifies defects, finally saying that the church lacks a cock and a hen nightingale.
    The king’s son leaves the country on a three-legged horse. In a meadow, an old
    man advises him that the horse can carry him across the sea to a maiden who has
    the cock and hen nightingale, but warns that the maiden must not see him or she
    will change him to dust and wind.
  language: English
  quote_policy: summarized
