canonical_text:
  quote: ''
  summary: A youngest son follows his father's instruction to hire only a servant
    who refuses to dine with him. After dismissing two candidates, he hires a third
    servant who insists on eating after his master. The servant proves clever, advises
    the prince to take a dangerous short road where travelers disappear, keeps watch
    at night, and hears a hidden voice behind a bush addressing the prince's barking
    dog. The party reaches its destination safely, trades, returns by the short road
    with merchants, and the servant again hears the midnight voice at the same camp.
  language: English
  quote_policy: summarized
