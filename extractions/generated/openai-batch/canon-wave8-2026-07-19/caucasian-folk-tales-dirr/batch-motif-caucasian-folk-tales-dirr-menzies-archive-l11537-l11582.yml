canonical_text:
  quote: ''
  summary: A fragment concludes with Solomon abandoning a plan after feathered creatures
    plead for pity, then ordering three sparrows to fly daily to an owl as her food.
    In the following Alexander stories, newborn Alexander runs around a room until
    an angel knocks him down at the fourth corner, indicating that he will conquer
    only three-quarters of the world. After Alexander dies, his mother refuses burial;
    courtiers test her by hanging bread above the body, and when hunger makes her
    stand on the body to reach it, they rebuke her, after which she permits burial.
