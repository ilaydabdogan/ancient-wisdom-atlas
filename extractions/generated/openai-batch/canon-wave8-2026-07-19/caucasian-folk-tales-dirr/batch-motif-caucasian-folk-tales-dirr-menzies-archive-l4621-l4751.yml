candidate_motifs:
- id: motif:1
  label: descent through an earth opening to an underground monster hoard
  taxonomy_refs:
  - hero_descent
  basis: The servant descends by rope into a hole in the earth, finds underground
    rooms with treasure and captives, and confronts the seven Divs.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not present the descent as an afterlife journey; the
    taxonomy reference is limited to the literal downward heroic action.
- id: motif:2
  label: monster-slayer rescues abducted maidens and stolen treasure
  taxonomy_refs:
  - stolen_beloved
  basis: The three maidens say the Divs brought each of them from a different part
    of the world; the servant kills the Divs and sends the maidens and treasure up
    to the prince.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The maidens are abducted captives and later brides, but the passage does
    not say they were previously beloveds of the rescuers.
- id: motif:3
  label: healing by blood and severed monster parts
  taxonomy_refs: []
  basis: The servant collects the hound’s blood on a handkerchief, tells the prince
    to smear it on the father’s eyes, and tells him to boil the Divs’ ears for the
    sister to drink; both cures work. The next tale also names fish blood as a cure
    for blindness.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: No exact healing taxonomy reference is available in the supplied list.
- id: motif:4
  label: faithful helper departs into a grave after completing service
  taxonomy_refs:
  - departure
  basis: When his service term ends, the servant refuses to stay, enters a shining
    fresh grave, gives final instructions, and the grave closes over him.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly explain the servant’s identity or state
    directly that this is a sacrificial death.
- id: motif:5
  label: restoration of afflicted royal household followed by succession
  taxonomy_refs:
  - royal_legitimacy
  basis: The servant’s remedies restore the father’s sight and sister’s reason, after
    which the old king yields the throne to the youngest son.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames the succession as an outcome of the servant’s instructions
    and the king’s action, not as a formal coronation ritual.
- id: motif:6
  label: merciful release of a healing fish leads to banishment
  taxonomy_refs: []
  basis: The king’s son catches the Red Fish needed for his father’s cure but releases
    it because of its beauty; when this becomes known, the king banishes him.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The Red Fish episode is only the opening of the next tale within this
    line range.
- id: motif:7
  label: advice for recognizing a trustworthy travel companion
  taxonomy_refs:
  - wisdom
  basis: The prince’s mother advises him to wait for a follower and judge him by food-sharing
    and night-watch behavior.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage cuts off before the advice is tested in action.
comparison_claims:
- id: claim:1
  claim: Within this passage, the end of “The Faithful Servant” and the opening of
    “The Red Fish” share a healing function in which blood applied to a blind king’s
    eyes is said to restore sight.
  claim_level: same_function
  target: blood-restores-sight pattern across “The Faithful Servant” and the opening
    of “The Red Fish” in the same collection passage
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:12
  confidence: medium
  limitations: In “The Faithful Servant,” the hound’s blood is actually used and works;
    in “The Red Fish,” the fish blood is prescribed but the fish is released in the
    excerpt, so the cure is not performed here.
