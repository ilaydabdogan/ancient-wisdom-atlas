canonical_text:
  quote: ''
  summary: In the end of “The Faithful Servant,” a servant descends into an underground
    pit, kills seven Divs, rescues three captive maidens and treasure, later gathers
    blood from a hound, and finally enters a shining grave after giving instructions
    that cure the prince’s father’s blindness and sister’s madness. The old king yields
    the throne to the youngest prince. The passage then begins “The Red Fish,” where
    another blind king seeks a horned fish whose blood can restore sight; his son
    catches but releases it and is later banished after the secret is reported.
  language: English
  quote_policy: summarized
