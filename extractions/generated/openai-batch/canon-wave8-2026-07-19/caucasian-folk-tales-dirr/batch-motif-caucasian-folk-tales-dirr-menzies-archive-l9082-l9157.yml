canonical_text:
  quote: ''
  summary: 'The excerpt closes a tale in which Urysmag recounts being in an animal
    state, receiving instructions for regaining human form through soup and a whip,
    sleeping with Uastyrdji''s wife, and winning a squirrel skin after his misfortunes
    are judged. It then begins a new tale: Etsemej, a ten-year-old son of a killed
    prince, interrupts boys playing dice by crushing the dice with a millstone, and
    learns from their mother that Kuba killed his father.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Urysmag says that after sheep were killed, his master beat him and he ran
    back to his first master.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first master recognizes Urysmag and tells him a method for becoming a
    man again involving Uastyrdji's wife, soup, his tail, and a whip.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Urysmag puts his paw into the soup instead of his tail; Uastyrdji's wife strikes
    him with the same whip, and he appears before her as a man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Urysmag tells Uastyrdji's wife that her earlier action made him miserable,
    caused dogs to run after him, and caused him to give birth to whelps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Urysmag sleeps with Uastyrdji's wife while Uastyrdji is absent, purposely
    leaves his boots in her room, and Uastyrdji later finds them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Urysmag finishes his account, Chamyts and Sosryqo are questioned about
    their misfortunes, and the squirrel skin is given to Urysmag because dogs had
    run after him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the next tale, boys play dice beside a mill until Etsemej, about ten years
    old, seizes a millstone and crushes the dice to dust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The boys' mother rebukes Etsemej and tells him to kill Kuba, who killed his
    father; Etsemej realizes that he has learned about his father's death from a common
    woman.
  category: sequence
  evidence_refs:
  - ev:8
