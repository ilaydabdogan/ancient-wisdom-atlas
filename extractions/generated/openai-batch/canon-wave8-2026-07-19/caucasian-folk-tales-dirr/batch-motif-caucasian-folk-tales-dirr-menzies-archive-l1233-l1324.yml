canonical_text:
  quote: ''
  summary: 'The passage ends the Parasite episode: an oak tree reacts to the Parasite''s
    behavior, the Parasite brings a wolf the message that human flesh will fatten
    it, and the wolf attacks him; villagers later recognize his clothing and an old
    man gives a moral about laziness. The next tale begins with a poor peasant and
    his wife deciding their son must learn something. The peasant seeks a master,
    meets a devil emerging from a spring in human form, and leaves his son with him
    for a year under a recognition condition. The son warns his father how to identify
    him after the pupils are transformed into doves, and the father successfully chooses
    him, forcing the devil to return the boy.'
  language: English
  quote_policy: summarized
