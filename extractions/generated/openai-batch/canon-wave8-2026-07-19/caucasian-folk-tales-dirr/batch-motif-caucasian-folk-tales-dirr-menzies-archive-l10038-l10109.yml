canonical_text:
  quote: ''
  summary: Rustumsal travels on his six-footed swift horse Tulpar. He meets an old
    man reading the Koran, who foretells Rustumsal’s combat with a forty-headed Div,
    warns him about bewitching trials involving hunger, a cow’s milk, a pitcher of
    presents, and a maiden in a garden, and tells him that Iskender’s drum hanging
    on a tree can summon aid. Rustumsal enters the land of the white Divs, avoids
    the cow and the pitcher, but later enters the maiden’s garden despite remembering
    the warning.
  language: English
  quote_policy: summarized
