canonical_text:
  quote: ''
  summary: An old man remarries after his first wife's death. His second wife has
    a daughter and hates the man's daughter by his first wife, pressuring him to abandon
    the first daughter in an empty house in a wood to be eaten by beasts. Alone at
    night, the maiden prepares porridge and gives meal to a mouse. The mouse, satisfied,
    warns her that a bear will come with a little bell and propose a threefold chase
    around the house, promising a silver waggon with three horses if he cannot catch
    her and threatening to eat her if he can. The mouse tells her to accept and take
    the bell.
  language: English
  quote_policy: summarized
