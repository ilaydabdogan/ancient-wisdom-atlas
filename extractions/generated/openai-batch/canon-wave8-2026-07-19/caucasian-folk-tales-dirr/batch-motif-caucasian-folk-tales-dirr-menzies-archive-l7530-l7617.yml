canonical_text:
  quote: ''
  summary: 'A fragment from a preceding fox-and-crane episode ends with the crane
    carrying the fox upward and dropping him to his death. The main tale describes
    a hungry bear, wolf, and fox: the fox has the wolf feign death and appear to revive
    in a lake, then persuades the bear to let himself be eaten on the promise of later
    payment and revival in the same water. The passage then begins a lion-and-hare
    animal fable in which beasts living in a hidden wood agree to send victims by
    lot to their lion king, and the hare’s turn comes.'
  language: English
