  locator: section 49, God sends Batrás and the wheel
  quote_or_summary: God says he can do nothing without the complainants, sends Batrás
    to the Kabardian Plain, and sends the Balsig wheel after him; Batrás says this
    means God intends to kill him.
  source_text_path: texts/public-domain/caucasian/project-gutenberg/caucasian-folk-tales-dirr.md
  rights_note: Public domain source; summarized.
