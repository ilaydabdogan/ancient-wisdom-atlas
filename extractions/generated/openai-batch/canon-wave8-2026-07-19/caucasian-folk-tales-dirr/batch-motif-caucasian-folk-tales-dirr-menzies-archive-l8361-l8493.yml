  type: summary
  locator: section 50, opening setting
  quote_or_summary: Batrás sits in heaven beside Kurdalagon while the Narts gather
    by the Saqola river to play and dance.
  source_text_path: texts/public-domain/caucasian/project-gutenberg/caucasian-folk-tales-dirr.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: section 50, Bädsänäg's descent and theft
  quote_or_summary: Bädsänäg, son of the blind giant, looks down from a mountain-top,
    plans to steal the Narts' things and harm them, ignores his father's warning,
    joins their play and dance, and carries their things home; the next morning he
    repeats this as Batrás watches.
