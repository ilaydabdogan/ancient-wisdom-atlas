  type: summary
  locator: section 49, Batrás's spirit attacks angels
  quote_or_summary: As the angels stand beside Batrás's body, he releases his spirit
    upon them; sixty die, and the rest complain that his death is worse than his life;
    God says this was his doing and tells them to bury him.
  source_text_path: texts/public-domain/caucasian/project-gutenberg/caucasian-folk-tales-dirr.md
  rights_note: Public domain source; summarized.
