  type: summary
  locator: section 49, entry into the Sopia cave and God's tears
  quote_or_summary: Batrás resists entering the cave because he cannot see God; God
    appears, calls him son, and lets three tears fall on him, becoming Tarandjalos,
    Mykaly-Gabyrta, and Pekom; Batrás is laid in the cave. Notes qualify the sonship
    wording and identify the three names as sanctuaries.
  source_text_path: texts/public-domain/caucasian/project-gutenberg/caucasian-folk-tales-dirr.md
  rights_note: Public domain source; summarized.
