canonical_text:
  quote: ''
  summary: The passage closes a revenge-and-feast episode, then narrates how Batrás
    travels toward heaven, attacks the Uatsillas and Uastyrdjis, is condemned by God
    after renewed complaints, and is killed by the Balsig wheel when an uncovered
    part of his steel-coated body burns. God commands angels to carry Batrás to the
    Sopia cave; Batrás's released spirit kills many angels, his body resists burial
    until God appears, and God's three tears become three sanctuaries before Batrás
    is laid in the cave. The next episode begins with Batrás in heaven beside Kurdalagon
    while Bädsänäg, son of the blind giant, steals from the Narts despite his father's
    warning.
  language: English
  quote_policy: summarized
