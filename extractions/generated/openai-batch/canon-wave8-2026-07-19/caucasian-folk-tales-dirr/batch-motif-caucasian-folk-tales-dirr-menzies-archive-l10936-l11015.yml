- id: obs:4
  text: The angels ask the witch for help, and she shows them a cave near Tschilou
    at the foot of a spur of the Panaw chain.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The witch says a giant had once been imprisoned in that cave for three hundred
    years until God forgave him and let him go.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
