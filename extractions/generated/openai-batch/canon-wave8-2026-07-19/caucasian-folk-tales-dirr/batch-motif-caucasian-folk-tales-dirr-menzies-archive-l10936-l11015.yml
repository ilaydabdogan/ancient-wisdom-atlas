- id: obs:8
  text: Arasch begins licking the chain so that Abrskil may eventually break it when
    it has become thinner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Lord orders the old woman not to let anyone near Abrskil or feed him until
    he confesses his sins remorsefully.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The old woman eventually takes pity on Abrskil and secretly has food taken
    to him; God changes her into a whelp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The whelp can open its mouth to eat only when Arasch has licked the chain
    thin, but when it opens its jaws the chain returns to its former thickness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Abrskil longs for news of his native land, and Djomlat comes with a guide
    and twenty asses loaded with wax candles to enter the cave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The cave interior is very dark; candles allow the visitors to proceed, some
    parts require crawling, and other parts contain fields and fruit-gardens.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: When the visitors cannot find Abrskil and the candles are gone, they hear
    his voice; he says that the farther they enter the cave, the farther he is pushed
