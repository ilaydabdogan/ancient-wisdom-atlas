canonical_text:
  quote: ''
  summary: Abrskil, mounted on Arasch, is trapped at a mountain-top, falls, and is
    seized by angels. God banishes him to an inaccessible cave watched by a witch
    or old woman, where Arasch tries to wear down his chain by licking it. The old
    woman secretly feeds him and is transformed into a whelp; whenever the chain becomes
    thin enough for the whelp to eat, it becomes thick again. Djomlat later enters
    the dark cave with a guide, asses, and candles, but Abrskil remains unreachable
    and laments Abkhasia.
  language: English
  quote_policy: summarized
