canonical_text:
  quote: ''
  summary: After the princess consents to Sane’s request, the seven brothers arrange
    a great wedding feast. A bard sings songs that Sane recognizes as relating to
    his own troubled history with Helena and abduction, causing him distress. The
    wedding guests then hold contests; Sane proves exceptional strength by throwing
    a heavy stone far beyond the others. That night, in the bridal chamber, Sane pretends
    to sleep and sees his young wife arm herself, saddle a horse, and ride away. He
    arms himself, follows unnoticed through the dark, and reaches a deep gorge where
    armed men are assembled.
  language: English
  quote_policy: summarized
