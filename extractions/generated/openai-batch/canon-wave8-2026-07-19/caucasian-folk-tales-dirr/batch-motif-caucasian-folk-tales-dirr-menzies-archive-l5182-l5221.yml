canonical_text:
  quote: ''
  summary: Näsni creates a cloud of flour to make himself appear powerful, is accepted
    by the Narts and given their sister as wife. A man-eating beast translated as
    a rhinoceros threatens the village. Näsni refuses to join the hunt, is forced
    out by his wife, hides in a pear tree, faints from fear, falls onto the beast,
    and holds on as it rushes to the village, where the Narts kill it. The passage
    ends with Näsni beginning to feign indignation at the killing.
  language: English
  quote_policy: summarized
