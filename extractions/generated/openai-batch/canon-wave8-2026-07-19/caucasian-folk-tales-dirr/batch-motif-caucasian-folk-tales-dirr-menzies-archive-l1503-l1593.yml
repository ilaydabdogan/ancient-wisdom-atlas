canonical_text:
  quote: ''
  summary: The Dreamer helps the king’s daughter answer the King of the East’s mare-age
    challenge, removes and returns an impossible arrow, marries the daughter of the
    King of the West, sets out to war, and begins gathering extraordinary companions
    on the road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The King of the East demands that the king and his daughter identify which
    mare is the mother, youngest foal, second foal, and oldest foal, with the daughter
    as the penalty if they fail.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king and his daughter do not know how to distinguish the mares, and the
    daughter tells the Dreamer about the problem while bringing him food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Dreamer instructs the daughter to feed the horses well with plenty of
    salt, shut them in, and watch the order in which they go to drink the next day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Dreamer’s forecast about the horses’ order of emergence is fulfilled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The King of the East shoots an arrow that lands before the King of the West’s
    castle and sticks in the ground so firmly that no one can pull it out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Dreamer says he will come out of his pit at night, removes the arrow,
    lays it on the ground, and returns to the pit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The King of the West promises his daughter to whoever pulled out the arrow,
    then requires the claimant to carry the arrow away; no one else can move it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Dreamer is brought by the vizier, lifts the arrow, and shoots it back
    into the castle of the King of the East.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The King of the West gives his daughter to the Dreamer, and after a short
    time the Dreamer sets out to make war on the King of the East.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: On the journey, the Dreamer meets a ploughman who swallows the clods he turns
    up and recruits him as a comrade in adventure.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Dreamer meets a man by the sea who greedily drinks salt water and recruits
    him as a companion in adventure.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Dreamer and his companions then see a man with mill-stones bound to his
    feet chasing a hare.
  category: action
  evidence_refs:
  - ev:11
