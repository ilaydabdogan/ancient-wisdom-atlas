canonical_text:
  quote: ''
  summary: 'The passage gives several comic Mullah Nasreddin anecdotes: he follows
    running children because their running makes a report seem true; he fails to leap
    a brook and privately admits he never could have done so; he cuts the branch on
    which he sits, falls, and accepts a passer-by’s false prediction that he will
    die after his donkey brays three times; after the third bray he lies down as dead
    while wolves seize the donkey; and he begins a trick against his wife by hiding
    in a hollow plane-tree and speaking as if the tree were an oracle. A footnote
    compares the first joke to a Marseilles Marius anecdote.'
  language: English
  quote_policy: summarized
