canonical_text:
  quote: "“you were to catch me twelve Divs and here you bring me only one!”"
  summary: A fleeing Div meets a fox and tells him that a man has taken the Divs'
    house and frightened them. The fox identifies the man as Cinder-Stick and brings
    the Div back, tied together with a string, to expose him. Cinder-Stick pretends
    the fox should have brought twelve Divs, terrifying the Div into fleeing beyond
    the ninth mountain. Cinder-Stick then takes the Divs' goods, loads them on camels,
    rejoins his wife, and they live happily.
