canonical_text:
  quote: ''
  summary: A fox creates the appearance that his master Bukutschichan is wealthy,
    asks for the chan's daughter in marriage, dresses Bukutschichan in makeshift finery,
    stages a river accident so the chan's retinue will give him proper clothes and
    weapons, and explains away his awkwardness at the chan's palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fox returns a measure after sticking an abbas coin into a crack; the chan
    shakes the measure, finds the coin, and wonders who Bukutschichan is.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox later borrows a measure to measure his master's gold, hides a gold
    coin in it, claims they finished measuring before dark, and the chan finds the
    coin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fox asks for the hand of the chan's daughter in marriage for his master,
    and the chan is very pleased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fox makes Lause-Hadschi a robe of state from brightly coloured Alpine
    flowers and weapons from lime-tree wood with bast cords; he is now called Bukutschichan
    and looks rainbow-like from a distance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fox tells Bukutschichan that the chan's retinue will meet him at the river
    and instructs him to cry for help and dive under while crossing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the middle of the river, Bukutschichan pretends the stream is carrying
    him away; the water washes off his belongings, and the chan's people pull him
    out naked and give him clothing and weapons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bukutschichan looks fine in the new clothes but handles them awkwardly because
    he previously had only a mangy skin to wear.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fox tells the chan's followers that the lost clothes were covered with
    precious stones and that the lost sword was an ancient ancestral Stamboul sword.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the chan's palace, Bukutschichan examines the roof, floor, walls, and other
    details; the fox says the palace does not please him.
  category: action
  evidence_refs:
  - ev:8
