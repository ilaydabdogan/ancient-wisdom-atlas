canonical_text:
  quote: ''
  summary: The malik of Tynty kills Chamyts after Chamyts' horse turns away, then
    sends the body home bound to the horse. Chamyts' relatives and the Narts infer
    that he was killed from behind by cunning and prepare for war, summoning Batras
    by way of the winds. Batras retrieves his hidden weapons, descends burning from
    heaven to earth and cools himself with a glacier, then joins the Narts. He attacks
    Tynty, has himself fired into the town from a cannon, destroys houses while seeking
    the malik, refuses ransom, beheads the malik, takes spoils, and hangs the head
    on a pole in the graveyard.
  language: English
  quote_policy: summarized
