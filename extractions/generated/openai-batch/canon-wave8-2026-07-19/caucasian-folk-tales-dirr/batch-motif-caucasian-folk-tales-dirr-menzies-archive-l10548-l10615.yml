canonical_text:
  quote: ''
  summary: 'The passage closes a Tatar variant in which Djanabbas risks petrification,
    shoots down a thing from the heavens, and returns home after taking a town. Rustumsal
    returns from conquering the land of the Djinns, learns that giants threaten his
    native town, and his return causes them to flee; later he transfers rule to Siilfager,
    the son of Djambachysch. The next section begins a Georgian variant under the
    heading Prometheus Sagas: Rustum is introduced as an extraordinarily strong hunter,
    spares a maiden''s stag at her request, marries her, departs after foretelling
    a son named Amiran, and Amiran is later christened by Jesus before setting out
    to find his father.'
  language: English
  quote_policy: summarized
