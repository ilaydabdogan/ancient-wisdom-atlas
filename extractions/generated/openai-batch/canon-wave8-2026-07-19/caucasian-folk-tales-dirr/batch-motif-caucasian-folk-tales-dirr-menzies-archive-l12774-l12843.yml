canonical_text:
  quote: ''
  summary: In this Mullah Nasreddin story, a woman receives advice from a voice in
    a hollow plane-tree to kill the last cow and feed its meat to her husband so that
    he will become blind and deaf. Nasreddin reaches home first, lets the plan proceed,
    pretends blindness and deafness, kills the woman's lover while he sleeps, returns
    the body to the lover's house by impersonating him at the door, and later tells
    his wife to deliver a mourning message that causes enraged relatives to stab her.
  language: English
  quote_policy: summarized
