canonical_text:
  quote: As two halves of an apple resemble each other, so did Thavisi resemble his
    brother.
  summary: Sachwatho is reconciled with the king after defeating the enemy, exposes
    the vizier and high steward as false claimants, then disobeys a warning by hunting
    beyond the kingdom. In a tower with golden objects, a woman or witch tricks him
    into disabling his horse, panther, and sword, and devours him. A prior sword compact
    alerts his brother Thavisi, who sets out to find him and is mistaken for Sachwatho
    because of their close resemblance.
  language: English
  quote_policy: quoted
