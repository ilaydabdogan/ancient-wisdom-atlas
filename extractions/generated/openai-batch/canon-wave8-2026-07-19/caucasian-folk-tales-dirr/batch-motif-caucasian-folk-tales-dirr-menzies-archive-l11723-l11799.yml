canonical_text:
  quote: ''
  summary: Peter frightens a king and queen while appearing as a devil-headed being
    and claiming to be St. George sent to lead them to Paradise. He puts them in boxes,
    transports them to his own king, and exposes them naked; his king praises and
    rewards him, making him successor. The next tale begins with a poor wife who borrows
    a silk dress and arranges separate marriage meetings with a shepherd, an Armenian
    seller, and a miller while her husband is away seeking food.
  language: English
  quote_policy: summarized
