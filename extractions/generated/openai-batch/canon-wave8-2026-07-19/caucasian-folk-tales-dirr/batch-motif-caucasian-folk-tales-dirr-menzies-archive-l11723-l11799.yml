  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Peter is rewarded, made the first man in the kingdom, and designated to become
    king after his ruler's death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the next tale, a poor man and wife have nothing left in the house, and
    the wife tells the husband to take his gun and look for food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wife borrows a silk dress, goes to the road, tells a shepherd she is looking
    for a husband, and invites him to come in the afternoon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife gives the same answer to an Armenian travelling seller, agrees when
