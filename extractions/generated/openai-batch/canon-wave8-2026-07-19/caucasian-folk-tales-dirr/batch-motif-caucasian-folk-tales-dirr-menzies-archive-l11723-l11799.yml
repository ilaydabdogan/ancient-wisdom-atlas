  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The wife repeats the claim to a miller, accepts his offer of marriage, and
    asks him to come at night.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The shepherd arrives with his flock, enters the house, and sits down; the
