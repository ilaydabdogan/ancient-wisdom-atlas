canonical_text:
  quote: ''
  summary: The stupid wife misunderstands animal sounds and leads home a camel. Her
    husband and the clever wife deceive her with a false warning about blinding rain,
    make her hide in an oven, kill the camel, and conceal its flesh and money. A messenger
    sent by the camel’s owner indirectly investigates; the stupid wife reveals the
    hidden camel flesh, but when called as witness she asks the blind owner whether
    the alleged rain blinded him, so he dismisses her testimony. The next tale begins
    with a woman of Lahitsch making dough who traps herself around a roof post while
    holding flour; her husband, children, neighbours, and finally the village head
    fail to find a practical solution, and the headman decides the post must be cut
    down.
  language: English
  quote_policy: summarized
