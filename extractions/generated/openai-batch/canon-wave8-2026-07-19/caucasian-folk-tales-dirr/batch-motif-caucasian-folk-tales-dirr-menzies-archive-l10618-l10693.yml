canonical_text:
  quote: ''
  summary: In the Georgian variant, Amiran avenges his father against giants, travels
    with his uncles toward Filich, frees a man serving dragons in a pear-tree, kills
    dragons, survives being swallowed by cutting his way out, and then destroys giants.
    After he turns his strength against ordinary Christians, Jesus Christ descends
    in human form, defeats and binds him by causing his strap to become a chain, and
    imprisons him in an iron house inside a mountain. A dog continually licks the
    chain thin, but smiths restore it yearly by hammering their anvils on Green Thursday.
    The passage then begins a Suanetian variant in which the smith Daredjiani hears
    despairing cries from Mount Elbruz at twilight.
  language: English
  quote_policy: summarized
