canonical_text:
  quote: ''
  summary: A king's sons seek the garden of the Virgin Queen. Two sons return with
    fruit from marvelous but insufficiently distant gardens, and the king says these
    are not the true garden. The second son meets an old man behind the Eisberg and
    gives him a hostile greeting. The youngest son later greets the same old man respectfully,
    asks for advice, and is told to pass rivers of milk, oil, and honey, then continue
    to crystal, silver, and gold towers reaching toward heaven.
  language: English
  quote_policy: summarized
