  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Abishi, son of Samsu-iluna, set out to conquer Iluma-ilu; his heart moved
    him to dam the Tigris, and he dammed it, but he did not catch Iluma-ilu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Against Shamash-ditana, the men of the land of Khatti marched against the
    land of Akkad.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ea-gamil, king of the Country of the Sea, marched against Elam; Ulam-Buriash
    pursued him, set troops in motion, conquered the Country of the Sea, and exercised
    dominion there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Agum, son of Kashtiliash, marched against the Country of the Sea, conquered
