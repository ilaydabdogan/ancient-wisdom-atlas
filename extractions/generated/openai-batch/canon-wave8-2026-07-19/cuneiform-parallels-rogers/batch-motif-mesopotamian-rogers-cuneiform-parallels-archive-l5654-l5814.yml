canonical_text:
  quote: ''
  summary: Adapa receives counsel about how to behave before Anu, is summoned because
    he broke the South Wind's wing, ascends to Heaven, meets Tammuz and Gishzida at
    Anu's door, explains his mourning garment, answers Anu's question about the South
    Wind, refuses food and water of life because of Ea's instruction, accepts garments
    and oil, and is ordered back to earth.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
