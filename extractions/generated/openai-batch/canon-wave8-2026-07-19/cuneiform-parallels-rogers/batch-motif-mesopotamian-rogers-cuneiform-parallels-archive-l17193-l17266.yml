canonical_text:
  quote: ''
  summary: The passage presents fragmentary cuneiform legal records from Gezer. One
    tablet is described as a property sale involving slaves/persons, seals, named
    persons, wives, a son, houses, and lost contract conditions. A second tablet identifies
    the seal of Natan-jau, owner of a sold field, gives neighboring or associated
    names, lists persons before whom the transaction was made, dates the document
    by month and eponym year, and preserves part of a reverse-side clause concerning
    return, non-receipt, sickness, and physical defect.
