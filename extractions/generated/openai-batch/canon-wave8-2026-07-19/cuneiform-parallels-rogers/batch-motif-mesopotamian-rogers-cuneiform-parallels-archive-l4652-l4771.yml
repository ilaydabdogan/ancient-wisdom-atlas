canonical_text:
  quote: "“a representation of Ashur, when he went to battle into the sea”"
  summary: The passage presents an Assyrian building inscription of Sennacherib describing
    a gleaming red bronze door in the New Year's festival house at Ashur. The door
    is engraved with Ashur going to battle into the sea/Tiamat, bearing a bow, riding
    a chariot, and releasing a storm flood, with Amurru as charioteer. Shamash and
    Adad authorize the engraving by divination. The door also depicts gods before
    and behind Ashur in battle order, Tiamat with creatures within her, Ashur binding
    Tiamat, and lists of gods associated with the procession.
  language: English with transliterated Akkadian excerpts
  quote_policy: quoted
