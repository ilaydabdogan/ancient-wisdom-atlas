canonical_text:
  quote: ''
  summary: Gilgamesh comes to Siduri-Sabitu, who locks her doors in fear and then
    admits him. He recounts Engidu's death and asks how to reach Ut-Napishtim. Siduri
    says the sea passage has not been crossed since old days except by Shamash and
    describes the waters of death as deep and obstructing. Ur-Shanabi, sailor of Ut-Napishtim,
    helps Gilgamesh cross by ship. They approach Ut-Napishtim's coast, where Gilgamesh
    asks how he attained endless life and receives the story of the Flood survivor.
  language: English
  quote_policy: summarized
