canonical_text:
  quote: ''
  summary: The passage gives laws from the Code of Hammurapi concerning entrusted
    property, false claims of loss, accusations against women, marriage contracts,
    adultery and sexual assault, oaths and river ordeal, and the legal status of wives
    when husbands are captive, return, or flee the city.
  language: English with transliterated Akkadian excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who receives silver, gold, or other goods for safekeeping before witnesses
    and then denies them is to be convicted and made to restore what he denied.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When entrusted goods disappear from the place where they were deposited along
    with the house owner's property, the house owner restores the entrusted goods
    and seeks what was lost from the thief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who has lost nothing but claims a loss declares the alleged loss before
    the god and pays double what he claimed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who causes the finger to be pointed against a votary or another man's
    wife and does not justify himself is brought before the judge and has the hair
    cut from his temples.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a man takes a wife without arranging marriage contracts, the woman is not
    recognized as a wife in that provision.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man's wife is taken lying with another man, the pair are bound and thrown
    into the water, though the husband may save his wife and the king may save his
    male servant.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man forces a betrothed woman who has not known a male and is living in
    her father's house, and he is caught, the man is put to death and the woman goes
    free.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a man accuses his wife and she has not been taken lying with another man,
    she takes an oath in the name of the god and returns to her house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the finger is pointed at a man's wife on account of another man and she
    has not been taken lying with him, she plunges into the holy river or river-god
    for her husband's sake.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When a man is taken prisoner and food remains in his house, the wife is to
    care for her possessions and not enter another house; if she fails and enters
    another house, she is convicted and cast into the water.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When a man is taken prisoner and no food remains in his house, the wife who
    enters another house has no blame.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: If a prisoner husband later returns and regains his city after his wife has
    entered another house and borne children, the woman returns to her first husband
    and the children follow their father.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: If a man leaves his city and flees, then later returns and wants his wife,
    the wife of the truant does not return to him because he hated his city and fled.
  category: sequence
  evidence_refs:
  - ev:13
