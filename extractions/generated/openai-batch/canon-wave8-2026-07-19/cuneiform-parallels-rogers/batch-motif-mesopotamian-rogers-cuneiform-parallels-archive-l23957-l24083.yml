  locator: lines 24109-24119; §136
  quote_or_summary: If a man left his city and fled, later returned, and wanted his
    wife, the wife of the truant does not return to him because he hated his city
    and fled.
  source_text_path: texts/public-domain/mesopotamian/project-gutenberg/cuneiform-parallels-rogers.md
  rights_note: Public domain source metadata; summarized evidence.
