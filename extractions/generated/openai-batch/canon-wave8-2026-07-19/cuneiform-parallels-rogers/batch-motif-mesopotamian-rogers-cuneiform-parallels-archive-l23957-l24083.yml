- id: ev:10
  type: summary
  locator: lines 24073-24088; §§133a-133b
  quote_or_summary: If a man is taken prisoner and food remains in his house, his
    wife is to care for possessions and not enter another house; if she does not care
    for them and enters another house, she is convicted and cast into water.
  source_text_path: texts/public-domain/mesopotamian/project-gutenberg/cuneiform-parallels-rogers.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:11
