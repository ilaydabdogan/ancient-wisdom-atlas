candidate_motifs:
- id: motif:1
  label: Entrusted goods and compulsory restitution
  taxonomy_refs: []
  basis: The passage repeatedly links safekeeping of goods with restoration when the
    recipient denies them or when they disappear from the house.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a legal pattern rather than a narrative mythic episode.
- id: motif:2
  label: False claim tested before divine authority
  taxonomy_refs:
  - divine_judgment
  basis: The false claimant declares his alleged loss before the god and pays double
    his claim.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage states a legal procedure involving the god, not a developed
    divine-judgment narrative.
- id: motif:3
  label: Public accusation marked by finger-pointing and bodily shame penalty
  taxonomy_refs: []
  basis: The accusation is expressed through the finger being pointed, and the unjustified
    accuser's temple hair is cut before the judge.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The social or symbolic meaning of the haircut is not explained in the
    passage.
- id: motif:4
  label: Marriage status dependent on formal contract
  taxonomy_refs: []
  basis: The law states that taking a wife without arranging marriage contracts does
    not establish the woman's recognized wife status.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No broader covenantal or sacred-marriage interpretation is stated by the
    passage.
- id: motif:5
  label: Sexual transgression punished by water with possible rescue
  taxonomy_refs: []
  basis: The caught wife and another man are bound and thrown into water, while the
    husband or king may save the respective dependent person.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The water in this provision is presented as punishment; the passage does
    not explicitly call it an ordeal here.
- id: motif:6
  label: Oath and river ordeal for unproven accusation
  taxonomy_refs:
  - divine_judgment
  basis: A wife not caught with another man swears in the god's name or plunges into
    the holy river or river-god under the stated accusation procedure.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives only the procedural act, not the outcome of the river
    ordeal.
- id: motif:7
  label: Captivity creates conditional household obligations
  taxonomy_refs: []
  basis: The wife's obligation to stay, care for possessions, or enter another house
    changes according to whether food remains in the captive husband's house.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: This is a family-law contingency pattern, not a mythic captivity narrative.
- id: motif:8
  label: Return of absent husband restores first marital tie
  taxonomy_refs:
  - return
  basis: If the captive husband later returns and regains his city, the woman returns
    to her first husband and the children follow their father.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The taxonomy reference is only literal and procedural; the passage does
    not present a heroic return motif.
- id: motif:9
  label: Desertion forfeits marital claim
  taxonomy_refs: []
  basis: The man who left his city and fled cannot reclaim his wife when he returns
    because he hated his city and fled.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The motive is stated legally; no symbolic exile interpretation is added.
