- id: ev:9
  type: summary
  locator: lines 24060-24072; §132
  quote_or_summary: If the finger is pointed at a man's wife on account of another
    man and she has not been taken lying with him, she plunges into the holy river,
    literally the river-god, for her husband's sake.
