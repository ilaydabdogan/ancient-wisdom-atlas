  locator: lines 24089-24094; §134
  quote_or_summary: If a man is taken prisoner and no food remains in his house, and
    his wife enters another house, the woman has no blame.
  source_text_path: texts/public-domain/mesopotamian/project-gutenberg/cuneiform-parallels-rogers.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:12
  type: summary
  locator: lines 24095-24108; §135
  quote_or_summary: If a captive husband returns and regains his city after his wife
    entered another house and bore children, the woman returns to her first husband
    and the children follow their father.
  source_text_path: texts/public-domain/mesopotamian/project-gutenberg/cuneiform-parallels-rogers.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:13
