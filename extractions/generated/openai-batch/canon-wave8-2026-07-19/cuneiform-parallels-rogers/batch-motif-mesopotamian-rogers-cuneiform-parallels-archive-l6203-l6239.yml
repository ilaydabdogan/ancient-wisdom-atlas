canonical_text:
  quote: ''
  summary: Gilgamesh speaks to Engidu and proposes going to the great palace to Rishat-Ninlil,
    described as mistress of all knowledge. The narrator says Gilgamesh has his mother
    make an offering to Shamash for favor and perhaps an oracle. In the fragmentary
    Fourth Tablet, Engidu tries to dissuade Gilgamesh from the expedition, but the
    friends set out toward the cedar mountain where Ellil appointed Khumbaba as warder.
    Khumbaba is described as guardian of the cedars, terrifying to peoples, with a
    trumpet-like voice, divine-like mouth, and wind-like breath. Eabani again tries
    unsuccessfully to turn back his friend as they approach the mountain.
  language: English
