canonical_text:
  quote: ''
  summary: 'The passage introduces a fragmentary text associated cautiously with the
    Atrakhasis Deluge tradition. It describes human sin followed by repeated divine
    punishments: famine, pestilence, unfruitfulness of land, failure of childbirth,
    and eventually a flood. Atrakhasis seeks Ea’s aid, while Ellil complains of human
    sins in a divine assembly. The preserved tablet lines depict escalating famine
    over several years, social distress, cannibalistic extremity, drought, failed
    crops, salt-covered plains, and lack of animal fattening. The text is also said
    to have been used as an incantation for women about to bear children.'
  language: English
  quote_policy: summarized
