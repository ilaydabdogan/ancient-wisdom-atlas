canonical_text:
  quote: ''
  summary: The passage gives selected laws from the Code of Hammurapi on debt seizure,
    death of a seized person, debt service by family members or slaves, ransom of
    a female slave with children, grain storage, deposits, witnesses, contracts, disputes,
    and restitution. It includes English translation sections and Akkadian transliteration
    sections.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may be seized for a debt of grain or money; if the seized person
    dies a natural death in the seizer's house, no case lies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the seized person dies in the seizer's house from blows or want, the owner
    of the seized person calls the merchant to account, with penalties differing by
    the status of the deceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An indebted man may sell or hand over his wife, son, or daughter for money
    or service; they work three years and are set at liberty in the fourth year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A male or female slave handed over to service may be transferred or sold by
    the merchant without a case lying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If an indebted man has handed over a female slave who has borne him children,
    he must repay the money paid by the merchant and ransom the female slave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When grain stored in another man's house is affected by accident, taking,
    or dispute, the owner of the grain declares his grain in the presence of the god.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the owner of the house has taken stored grain, he must double the amount
    taken and restore it to the owner of the grain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stated storage price is five KA of grain per GUR per year.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A deposit of silver, gold, or anything else is to be shown to witnesses and
    fixed by contract before being deposited.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a deposit is made without witnesses or contract and is later disputed at
    the place of deposit, no case lies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a witnessed deposit is denied, the disputing party is called to account
    and must repay double what he disputed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: If deposited property is lost through burglary or pillage along with the house-owner's
    own property, the negligent house-owner must make good the loss.
  category: action
  evidence_refs:
  - ev:8
