canonical_text:
  quote: ''
  summary: A first-person royal inscription recounts military conquest, destruction
    of plantations and cities, capture and deportation of people and herds, submission
    and tribute from Samsi queen of Aribi and western groups, appointment of residents
    and governors, events involving Bit-Khumria/Samaria and Ashkelon, and the capture
    of coastal cities.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he cut down the enemy's plantations and left no tree remaining.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khadara is described as the paternal home and birthplace of Rezon of Damascus;
    the speaker says he besieged and took it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists cattle, sheep, people, goods, prisoners, and herds as taken
    away or carried into captivity.
  category: action
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:4
  text: The speaker says 591 cities in 16 districts of Damascus were destroyed and
    compares the result to a deluge heap.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Samsi, queen of Aribi, is said to have trampled on the oath of Shamash; her
    people bowed before the speaker's arms, and she brought camels as tribute while
    a resident was set over her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Western groups whose dwelling is described as far off brought tribute, including
    gold, silver, camels, female camels, and spices, and kissed the speaker's feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that cities of Bit-Khumria had been added to the speaker's
    territory and inhabitants carried into captivity, with Samaria alone left.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mitinti of Ashkelon is said to have sinned against the speaker's oath and
    fallen away; his son Rukibtu sat on the throne, came before the speaker to save
    his life, and nearby cities were transferred to Idi-bi'il of Arubu.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A small inscription states that coastal cities of the Upper Sea were captured
    and that six officials were set over them as governors.
  category: action
  evidence_refs:
  - ev:9
