canonical_text:
  quote: ''
  summary: In the Second Tablet fragment, Tiamat gathers divine allies for battle,
    creates eleven monstrous beings with weapons and terrifying forms, and elevates
    Kingu as leader and spouse, giving him the tablets of destiny and lordship among
    the gods. Anshar hears of Tiamat's revolt, is distressed, and sends Anu to confront
    her, but Anu cannot endure her presence and turns back.
  language: English with Akkadian transliteration
  quote_policy: summarized
