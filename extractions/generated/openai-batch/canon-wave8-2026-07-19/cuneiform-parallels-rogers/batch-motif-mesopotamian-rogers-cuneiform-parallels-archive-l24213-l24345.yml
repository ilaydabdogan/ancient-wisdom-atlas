canonical_text:
  quote: ''
  summary: The passage contains laws from the Code of Hammurapi concerning maidservants
    who bear children, sale or marking of maidservants, obligations toward a sick
    wife, a woman's departure with her marriage portion, gifts and sealed deeds for
    a wife, debt liability within marriage, punishments for causing a husband's death
    and for prohibited sexual relations, and rules governing bride-price and broken
    betrothal.
  language: English with transliterated Akkadian portions
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maidservant who has borne children and made herself equal with her mistress
    may not be sold for money, but may be marked and counted among the maidservants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A maidservant who has not borne children may be sold by her mistress for money.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man whose wife is seized by leprosy may take another wife, but he must not
    put away the stricken wife and must maintain her in the house he built as long
    as she lives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the sick wife is not content to dwell in her husband's house, the husband
    must pay her the marriage portion brought from her father's house, and she may
    go away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wife who has received field, garden, house, goods, and a sealed deed may
    dispose of her estate after her husband's death to the child whom she loves, and
    her children may not claim against her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a woman has bound her husband by agreement so that his creditor may not
    hold her for his debts, debts incurred before the marriage do not attach to the
    other spouse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If debt is contracted after the woman enters the man's house, both spouses
    are answerable to the merchant.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a man's wife causes her husband to be killed for the sake of another man,
    the woman is to be impaled.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a man has known his daughter, the man is expelled from the city.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a father lies in the bosom of a bride betrothed to his son after the son
    has known her, the father is bound and cast into the waters.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: If the son has not known the bride but the father lies in her bosom, the father
    must pay silver and return what she brought from her father's house, and a man
    of her choice may marry her.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: If a man lies in the bosom of his mother after his father's death, both are
    to be burned.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: If a man is caught in the bosom of his father's chief wife after his father's
    death, and she has borne children, he is cut off from his father's house.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: If a man who has given a present and bride-price refuses to marry the daughter,
    the father of the daughter may keep all that was brought.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: If the father of the daughter refuses to give his daughter after receiving
    present and bride-price, he must return double what was brought.
  category: sequence
  evidence_refs:
  - ev:15
