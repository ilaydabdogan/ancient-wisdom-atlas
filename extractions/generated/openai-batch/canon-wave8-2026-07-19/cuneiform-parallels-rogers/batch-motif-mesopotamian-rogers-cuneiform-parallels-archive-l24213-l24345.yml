  evidence_refs:
  - ev:1
  - ev:2
- id: scene:2
  label: Sick wife and marital residence
  summary: A husband may take another wife when his wife is seized by illness, but
    he must keep and maintain the first wife; if she refuses to dwell in his house,
    she receives her marriage portion and leaves.
  figure_refs:
  - fig:3
  - fig:4
  symbol_refs:
  - sym:2
  - sym:3
  evidence_refs:
  - ev:3
  - ev:4
- id: scene:3
  label: Wife's deeded estate and chosen heir
  summary: A wife who has received property and a sealed deed is protected from her
    children's claims after her husband's death and may give her estate to the child
    whom she loves.
  figure_refs:
  - fig:3
  - fig:4
  - fig:5
  symbol_refs:
  - sym:4
  - sym:5
  evidence_refs:
  - ev:5
- id: scene:4
  label: Debt liability in marriage
  summary: Premarital debts do not make the other spouse liable when an agreement
    protects the spouse, but debts contracted after the woman enters the man's house
    make both spouses answerable to the merchant.
  figure_refs:
  - fig:3
