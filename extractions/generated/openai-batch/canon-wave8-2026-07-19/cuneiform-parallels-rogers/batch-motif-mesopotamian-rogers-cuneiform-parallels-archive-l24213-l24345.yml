- id: scene:6
  label: Prohibited sexual relations and punishments
  summary: The laws prescribe expulsion for a man who knows his daughter, casting
    into waters for a father who lies with his son's bride after the son has known
    her, payment and release to another marriage if the son has not known her, burning
    for a man and his mother, and cutting off from the father's house for a man caught
    with the father's chief wife.
