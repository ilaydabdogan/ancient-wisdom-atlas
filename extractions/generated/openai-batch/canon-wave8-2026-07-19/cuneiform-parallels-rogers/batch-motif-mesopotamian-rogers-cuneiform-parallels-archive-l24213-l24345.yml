candidate_motifs:
- id: motif:1
  label: Childbearing alters servant status within the household
  taxonomy_refs: []
  basis: A maidservant who has borne children cannot be sold for money but may be
    marked and counted among maidservants, while one without children may be sold.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: This is a legal status pattern, not an explicitly mythic motif.
- id: motif:2
  label: Household obligation to maintain an afflicted spouse
  taxonomy_refs: []
  basis: The husband may take another wife but may not put away the afflicted wife
    and must maintain her as long as she lives, unless she chooses departure with
    her marriage portion.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage frames this as law rather than sacred narrative.
- id: motif:3
  label: Sealed grant protects a woman's estate and chosen heir
  taxonomy_refs: []
  basis: A wife with a sealed deed for property may give her estate to the child whom
    she loves, and her children may not make claims upon her.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The motif is documentary and inheritance-focused; no mythological symbolism
    is stated.
- id: motif:4
  label: Marriage creates shared liability for later debt but not earlier debt
  taxonomy_refs: []
  basis: The laws distinguish debts incurred before the marriage from those contracted
    after the woman enters the man's house, assigning shared responsibility only for
    the latter.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: This is a household-law pattern rather than a comparative mythological
    motif.
- id: motif:5
  label: Transgression of household sexual boundaries brings formal punishment
  taxonomy_refs: []
  basis: The passage lists prescribed punishments for sexual relations with a daughter,
    son's bride, mother, or father's chief wife, including expulsion, casting into
    waters, burning, payment, or cutting off from the father's house.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The punishments are stated legally; no divine agency or mythic narrative
    is explicit.
- id: motif:6
  label: Bride-price establishes reciprocal penalties for broken betrothal
  taxonomy_refs: []
  basis: When the prospective groom refuses the daughter, the father keeps the gifts;
    when the father refuses, he returns double.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage presents a legal exchange rule, not a sacred-exchange myth.
