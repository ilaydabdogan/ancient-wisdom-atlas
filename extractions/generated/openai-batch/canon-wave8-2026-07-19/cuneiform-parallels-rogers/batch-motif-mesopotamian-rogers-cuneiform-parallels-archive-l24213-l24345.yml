scenes:
- id: scene:1
  label: Maidservant status after childbearing
  summary: The laws distinguish a maidservant who has borne children from one who
    has not; childbearing prevents sale for money but permits marking and counting
    among maidservants.
  figure_refs:
  - fig:1
  - fig:2
  symbol_refs:
