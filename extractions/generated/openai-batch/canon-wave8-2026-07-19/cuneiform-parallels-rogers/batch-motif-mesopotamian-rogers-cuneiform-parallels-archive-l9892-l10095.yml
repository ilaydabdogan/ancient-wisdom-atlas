canonical_text:
  quote: ''
  summary: The passage contains part of a hymn addressed to Marduk, naming his temples
    and repeatedly calling for him to rest or be at peace. Cities, temples, and many
    deities are presented as crying out to him, while the hymn asks that his anger
    be appeased, that cities not be cast away, and that Babylon, Esagila, and related
    sacred places be viewed graciously and restored. A note describes the hymn as
    antiphonal and assigns it to the eleventh day of Nisan, when Marduk entered his
    sanctuary in Esagila. The passage then begins a prayer of the raising of the hand
    to Ishtar, invoking her as queen, goddess, directress of mankind, Irnini, light
    of heaven and earth, and daughter of Sin.
  language: English with Akkadian transliteration
  quote_policy: summarized
