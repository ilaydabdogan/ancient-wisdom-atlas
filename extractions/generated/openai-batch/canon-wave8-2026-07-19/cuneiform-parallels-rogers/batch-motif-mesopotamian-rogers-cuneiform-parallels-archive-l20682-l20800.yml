canonical_text:
  quote: ''
  summary: Excerpt from Esarhaddon's inscriptions reporting the conquest and destruction
    of Sidon, the execution of Abdmilkot, plunder and deportation, the founding of
    Esarhaddonburg, the earlier capture of Adumu by Sennacherib, the return of Arabian
    gods after Hazael's tribute and petition, the appointment of Tabua and Ya'lu,
    added taxes, and the opening of a passage on an armory built by former kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sidon is described as lying in the midst of the sea; Esarhaddon says he overwhelmed
    its houses, tore down its walls and dwellings, cast them into the sea, and made
    their place a ruin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abdmilkot, king of Sidon, fled into the sea before Esarhaddon's arms; Esarhaddon
    says he drew him from the sea like a fish and cut off his head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Treasures, palace goods, people without number, cattle, sheep, and asses were
    plundered or carried away to Assyria.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Esarhaddon collected kings of the Hittite country and the sea-coast, erected
    a city named Esarhaddonburg in another place, settled people there, and set his
    officials over them as governors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sennacherib, identified as Esarhaddon's father and begetter, is said to have
    captured Adumu, a fortress of Aribi, and brought its gods to Assyria.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hazael, king of Aribi, came to Nineveh with heavy tribute, kissed Esarhaddon's
    feet, and pleaded for the gift of his gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Esarhaddon says he favored Hazael, repaired the broken portions of those gods,
    inscribed the power of Ashur and his own name upon them, and gave them back to
    Hazael.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tabua, born in Esarhaddon's palace, was set over them in dominion and returned
    with her gods to her land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Esarhaddon added sixty-five camels to Hazael's tax; after fate carried Hazael
    away, Esarhaddon put Ya'lu his son on the throne and added further taxes of gold,
    stones, camels, and spices.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A separate prism passage begins by referring to an armory that former kings,
    the speaker's fathers, had built to house equipment and provide shelter.
  category: object
  evidence_refs:
  - ev:10
