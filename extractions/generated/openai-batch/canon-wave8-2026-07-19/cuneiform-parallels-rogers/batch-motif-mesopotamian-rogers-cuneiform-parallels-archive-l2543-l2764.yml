  summary: In the divine assembly Marduk demonstrates the efficacy of his command
    by destroying and restoring a garment. The gods acclaim him king, give him regalia
    and weapons, and send him against Tiamat. Marduk prepares bow, spear, club, lightning,
    flaming fire, net, winds, flood, storm chariot, and horses, then advances toward
    Tiamat and perceives Kingu's design.
