canonical_text:
  quote: ''
  summary: 'Gilgamesh asks Ut-napishtim how he obtained life among the gods. Ut-napishtim
    begins to reveal a hidden divine decision: the gods resolved to send a flood against
    ancient Shurippak on the Euphrates. Ea, lord of Wisdom, communicates the warning
    through a reed hut and wall, instructing the man of Shurippak, son of Ubaratutu,
    to dismantle his house, build a ship, abandon possessions, preserve his life,
    and bring living seed of every kind into the vessel. Ut-napishtim accepts the
    command, asks what to tell the city and elders, receives Ea''s proposed explanation,
    and describes the construction, waterproofing, provisioning, and festive completion
    of the ship.'
  language: English
  quote_policy: summarized
