canonical_text:
  quote: ''
  summary: The passage describes Egyptian administration in Syria and Palestine after
    conquest, including destroyed and rebuilt cities, appointed or retained local
    rulers, and supervising officers. It then outlines the division of the region
    into Canaan and Amurru, the political situation reflected in the Tell-el-Amarna
    letters, threats from the Hittites and Khabiri, and a discussion of whether the
    Khabiri should be identified with Hebrews in biblical traditions.
  language: English
  quote_policy: summarized
