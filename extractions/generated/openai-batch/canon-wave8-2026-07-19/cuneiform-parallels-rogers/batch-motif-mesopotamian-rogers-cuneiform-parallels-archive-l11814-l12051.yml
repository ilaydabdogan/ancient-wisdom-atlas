canonical_text:
  quote: ''
  summary: The passage contains a restoration prayer in which a priest asks a deity
    to release a servant from bonds, accept a gift or purchase money, give life, and
    allow the servant to walk in a land of peace. It then gives a hymn to Tammuz/Damu
    that laments animal pairs being taken and slaughtered, the hero or god going on
    a way of no return into the earth or an unrevealed far land, widespread mourning,
    restrained vegetation, civic disorder, and fragmentary images of a sunken boat,
    submerged grain, storm, withheld water and food, and a seized gallu.
  language: English with Akkadian/Sumerian transliterations
  quote_policy: summarized
