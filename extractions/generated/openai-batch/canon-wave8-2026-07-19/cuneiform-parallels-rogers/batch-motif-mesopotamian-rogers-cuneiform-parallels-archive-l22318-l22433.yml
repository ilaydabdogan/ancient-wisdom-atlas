canonical_text:
  quote: ''
  summary: The passage contains an adoption certificate in which Ina-Uruk-rishat adopts
    Etirtu, sets conditions for her status, requires reverence and a postmortem water
    libation, and records penalties, an oath before named divine and royal authorities,
    witnesses, and a date. It then includes a marriage contract in which a childless
    man requests Kulla as wife, her father gives her, and inheritance is apportioned
    according to childbearing by Kulla and the first wife Esagila-banata, with witnesses,
    scribe, and date.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ina-Uruk-rishat is said to have had no daughter and therefore adopted Etirtu,
    daughter of Ninib-mushallim, as her daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seven shekels of gold are stated as given in the adoption certificate.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The adopter may give Etirtu to a husband or appoint her a temple slave, but
    may not make her a servant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the adopter makes Etirtu a servant, Etirtu is to go to her father's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: As long as Ina-Uruk-rishat lives, Etirtu is to pay her reverence; when Ina-Uruk-rishat
    dies, Etirtu is to offer the water libation as her daughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If Ina-Uruk-rishat denies that Etirtu is her daughter, she loses the gold;
    if Etirtu denies that Ina-Uruk-rishat is her mother, Etirtu becomes a servant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The parties make an oath together before Ellil, Ninib, Nusku, and King Kurigalzu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The adoption certificate lists named witnesses and is dated to the fifth day
    of Shebat in the twenty-first year of Kurigalzu, king of the world.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the marriage contract, Nabu-zer-kit-lishir says he has no child and wants
    a child, and asks Bel-ikisha to give Kulla as wife; Bel-ikisha gives Kulla in
    marriage.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The marriage contract assigns estate shares according to whether Esagila-banata,
    the first wife, or Kulla bears a child, and according to whether Esagila-banata
    dies childless while Kulla has children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The marriage contract names witnesses, a document scribe, Babylon as place,
    and the fourteenth day of Iyyar in the second year of Nabopolassar as date.
  category: setting
  evidence_refs:
  - ev:8
