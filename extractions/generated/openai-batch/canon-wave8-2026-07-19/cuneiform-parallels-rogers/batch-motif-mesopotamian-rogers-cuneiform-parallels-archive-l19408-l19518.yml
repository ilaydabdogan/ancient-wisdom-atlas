canonical_text:
  quote: ''
  summary: 'Historical survey of Sargon II''s accession and campaigns: his succession
    after Shalmaneser V, the fall and deportation of Samaria, conflict with Merodach-baladan
    in Babylonia, suppression of western rebellions, the Ashdod episode, and later
    northern campaigns against Urartu/Chaldia and related states.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sargon is described as succeeding to the Assyrian throne after the death of
    Shalmaneser V, although he was not of the royal line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage groups Sargon''s campaigns chiefly by three regions: the north,
    the south, and the west.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Samaria is said to have fallen after a three-year siege; Sargon claims the
    victory, but the narrator notes uncertainty about whether he was present or whether
    the city fell before Shalmaneser's death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sargon is said to have deported 27,290 inhabitants of Samaria and to have
    placed them in named locations; later, people from other conquered lands supplied
    their places.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Merodach-baladan seized southern Babylonia and Babylon and was proclaimed
    king on New Year's Day, 721.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sargon attacked Merodach-baladan and Khumbanigash at Dur-ilu; the passage
    says Sargon claimed victory but that the outcome was at least indecisive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A western coalition involving Ilu-bi'di, Hanno, Sib'e, and several Assyrian
    provinces rebelled; Sargon defeated them, Sib'e fled, Hanno was captured, and
    9,033 of Hanno's people were deported.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sargon removed Azuri of Ashdod for failure to pay tribute and installed Akhimiti,
    Azuri's twin brother; Akhimiti was later deposed and Yamani became king.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Ashdod uprising is connected in the passage with Egyptian influence; Sargon
    made a forced march west, Yamani fled to Egypt, and Ashdod, Gath, and Ashdudimmu
    received Assyrian provincial government.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Later northern events include invasions of Urartu/Chaldia, the fall of Carchemish,
    destructive attacks on Rusas, annexations, and Mita of Mushke being driven back.
  category: sequence
  evidence_refs:
  - ev:7
