canonical_text:
  quote: ''
  summary: 'The passage recounts the end of Berossos’s flood narrative: birds are
    released from the ship, land is discovered, the ship grounds on a mountain, Xisuthros
    sacrifices and vanishes, a heavenly voice says he dwells with the gods, and the
    remaining survivors return to Babylon, recover writings from Sippar, found cities
    and shrines, and repopulate Babylonia. It then introduces a separate doctrine
    of world destruction by fire, attributed through Seneca to Berosus, with cautious
    comments about possible echoes in Hebrew/Biblical texts.'
  language: English with Greek and Latin excerpts
  quote_policy: summarized
