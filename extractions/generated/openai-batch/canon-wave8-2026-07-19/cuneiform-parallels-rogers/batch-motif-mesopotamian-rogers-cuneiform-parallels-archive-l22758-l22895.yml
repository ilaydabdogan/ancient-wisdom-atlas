canonical_text:
  quote: If the river-god have declared that man to be innocent and have saved him...
  summary: The passage presents early laws from the Code of Hammurapi concerning unsupported
    capital accusations, a sorcery accusation tested by the river-god, penalties for
    false testimony, punishment of a judge who alters a sealed judgment, penalties
    for theft or illicit receipt of property, and procedures for disputed lost property.
  language: English with Akkadian transliteration
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man who lays a capital charge against another man and does not justify it
    is put to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man accused of sorcery must go to the river-god and plunge into the river-god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the river-god overcomes the accused man, the accuser takes his house; if
    the river-god declares the man innocent and saves him, the accuser is put to death
    and the accused man takes the accuser's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A witness in a capital case who does not justify his statement is put to death;
    a witness who lies about corn or money bears the sentence of that case.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A judge who has judged a case, issued a sealed sentence, and later altered
    the judgment must pay twelvefold the penalty and is expelled from the judgment
    seat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man who steals the goods of a god or palace, and a man who receives the
    stolen thing from his hand, are put to death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man who buys specified goods, slaves, or animals from a gentleman's son
    or slave without witness or contract is treated as a thief and put to death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: For theft of an ox, sheep, ass, pig, or ship, restitution differs according
    to whether it belonged to a god, palace, or freedman; a thief unable to pay is
    put to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When lost property is found in another man's possession, seller, purchaser,
    owner, witnesses, judges, and testimony before the god are involved; the seller
    is put to death as a thief, the owner recovers the property, and the purchaser
    recovers his payment from the seller's estate.
  category: sequence
  evidence_refs:
  - ev:6
