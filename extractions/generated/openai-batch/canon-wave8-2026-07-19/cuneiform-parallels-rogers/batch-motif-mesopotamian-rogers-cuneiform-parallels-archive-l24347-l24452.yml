canonical_text:
  quote: ''
  summary: The passage gives laws from the Code of Hammurapi concerning illicit relations
    within a household, bride-price and marriage gifts, the disposition of a dead
    wife’s marriage portion, inheritance among sons and brothers, and provisions for
    an unmarried youngest son after the father’s death.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a man chose a bride for his son, but the son did not know her and the man
    lay with her, the man must pay silver, restore what she brought from her father’s
    house, and she may marry a man of her own heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man, after his father, lies in his mother’s bosom, both are punished
    together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man, after his father, takes the principal wife who has borne children,
    he is expelled from the father’s house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man may bring a present and bride-price to the house of his father-in-law
    as part of a proposed marriage arrangement.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:5
  text: If a suitor turns toward another woman and refuses the daughter, the father
    of the daughter takes what was brought to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the father-in-law refuses to give his daughter after receiving a present
    and bride-price, he must return double what was brought.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a comrade slanders the claimant of the wife and the father-in-law refuses
    the daughter, the father-in-law returns double what was brought, and the comrade
    may not take the wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a wife has borne children and then goes to her fate, her marriage portion
    belongs to her children, not to her father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If a wife has no children and goes to her fate, the disposition of her marriage
    portion depends on whether the father-in-law returns the bride-price.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If a father gave a favored son field, garden, or house with a sealed deed,
    that son keeps the gift after the father’s death, while the remaining goods are
    divided equally among the brothers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: If a father took wives for his sons but not for his youngest son, the brothers
    must provide bride-price from the father’s goods so the youngest can take a wife.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: If a man has children by two wives who each bore children, after the father’s
    death the children take their own mothers’ marriage settlements and divide the
    father’s goods equally.
  category: sequence
  evidence_refs:
  - ev:11
