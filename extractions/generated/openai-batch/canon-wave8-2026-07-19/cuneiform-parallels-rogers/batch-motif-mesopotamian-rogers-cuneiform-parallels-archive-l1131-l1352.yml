canonical_text:
  quote: ''
  summary: The excerpt opens a creation account before heaven and earth had names,
    with Apsu, Mummu, and Tiamat in mingled waters. Gods then come into being in generations.
    Apsu, Mummu, and Tiamat consult about the younger gods, whom Apsu and Mummu propose
    to destroy because their ways disturb rest. Tiamat becomes furious and agrees
    to destruction. Ea, described as knowing all things, perceives the design and
    goes to make a pure incantation.
  language: English
  quote_policy: summarized
