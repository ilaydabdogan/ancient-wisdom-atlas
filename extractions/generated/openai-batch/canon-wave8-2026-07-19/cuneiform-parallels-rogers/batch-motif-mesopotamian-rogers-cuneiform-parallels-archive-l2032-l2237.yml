canonical_text:
  quote: ''
  summary: 'Anshar sends Gaga to repeat a message to Lahmu and Lahamu and the gods:
    Tiamat has gathered hostile divine allies and monstrous beings for battle, has
    exalted Kingu and given him the tablets of destiny, while Anu and Nudimmud have
    failed or retreated. Marduk declares that he will enchain Tiamat and give life
    to the gods if the assembly exalts his destiny and grants his spoken decree permanence.'
  language: English with Akkadian transliteration
  quote_policy: summarized
