canonical_text:
  quote: ''
  summary: The excerpt reports royal campaign inscriptions attributed to Sargon II.
    It includes a fragmentary notice in which Yamani refuses the king's lordship and
    flees after fear of Ashur; then it recounts the defeat of Elam, capture and deportation
    of Samaria, defeat of Gaza and Egyptian forces at Rapikhi, receipt of tribute
    from Egypt, Arabia, and Saba, and suppression of Yaubi'di's rebellion at Hamath
    and Karkar.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
