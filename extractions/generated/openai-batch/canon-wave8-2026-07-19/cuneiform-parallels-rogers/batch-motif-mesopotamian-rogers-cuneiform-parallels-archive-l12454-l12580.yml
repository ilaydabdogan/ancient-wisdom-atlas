canonical_text:
  quote: ''
  summary: The passage includes a liturgical text headed as a supposed Babylonian
    Sabbath, describing an evil day with restrictions on the king or shepherd of peoples,
    priest, and physician, followed by a nighttime royal gift, sacrifice, and prayer
    before Marduk and Ishtar. It then gives a doctrinal discussion of the growth of
    the Babylonian pantheon, duplication and absorption of divine names, attendants
    of Marduk, priestly divine lists, and later identifications of gods with Bad,
    Ishtar, and Marduk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A day is called an evil day and is associated with restrictions on ordinary
    royal, priestly, and medical actions.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shepherd of great peoples, later named as the king, is told not to eat
    meat cooked on coals or oven bread, not to change his garment, not to put on clean
    garments, and not to bring an offering during the restricted period.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the restricted day the king is not to ride in his chariot or speak as a
    ruler, the priest is not to give a decision in the secret place, and the physician
    is not to lay his hand on a patient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The day is said to be unsuitable for issuing a malediction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: At night the king brings a gift before Marduk and Ishtar, offers a sacrifice,
    and the lifting up of his hands is said to be pleasing to god.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A note says the section applies to the 7th, 14th, 19th, 21st, and 28th days,
    with variants for other days.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The prose discussion says that before the period of Hammurapi more than sixty
    gods are mentioned, including imported deities and deities traced to early Sumerian
    life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says many divine names are duplications, since each city could
    have a moon god and a sun god with different local names, and that one god could
    be absorbed by another after conquest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Marduk had two attendants in Esagila with names meaning,
    in translation, 'What will my lord eat?' and 'What will my lord drink?'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says priests made lists of gods and classified minor deities as
    expressions of aspects of a great god.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says Bad is treated through identifications, with Ellil described
    as the great god of whom Bad was a reflection.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says a late Babylonian tablet identifies the greatest gods with
    Marduk, and the editor characterizes the passage as pantheism rather than monotheism
    or henotheism.
  category: relationship
  evidence_refs:
  - ev:7
