canonical_text:
  quote: ''
  summary: The passage lists antediluvian rulers and beings associated with the Red
    Sea, including fish-and-man figures said to be sent forth by Oannes. It identifies
    Edoranchus with Enmeduranki and notes a tradition in which Shamash and Adad give
    him divinatory and secret ritual objects. It then names later rulers, including
    Xisuthros/Atra-khasis, under whom the great flood occurred, and introduces the
    Gilgamesh Epic as containing the Babylonian Flood legend and as related to Old
    Testament Deluge stories.
  language: English
  quote_policy: summarized
