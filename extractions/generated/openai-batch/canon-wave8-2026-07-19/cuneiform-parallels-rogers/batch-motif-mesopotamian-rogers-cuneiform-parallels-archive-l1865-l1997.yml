  quote: ''
  summary: A fragmentary creation-tablet passage describes Anshar and his son before
    a confrontation with Tiamat. The son is encouraged to approach battle, is assured
    that he will not lose blood and will return, and is instructed to appease Tiamat
    with a pure incantation. The son asks that, if he enchains Tiamat and gives life
    to the gods, the divine assembly should exalt his destiny and allow his decrees
    of fate to stand unchanged.
