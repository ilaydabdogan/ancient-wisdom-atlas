canonical_text:
  quote: the man who hired the ox shall swear before the god and go free.
  summary: The passage gives laws on hiring livestock and agricultural workers, compensation
    for injury or death of animals, liability for goring oxen, punishment and restitution
    for theft or misuse of seed and oxen, and payments for stolen irrigation or farm
    implements.
  language: English translation with transliterated Akkadian excerpts
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man hiring a working ox for one year is to pay four GUR of grain, while
    hire for a milch cow is three GUR to its owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a hired ox or ass is killed by a lion in the field, the loss belongs to
    the owner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a hired ox dies because of neglect or blows, the hirer must render ox for
    ox to the owner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Specific injuries to a hired ox, including crushed foot, cut nape, lost eye,
    broken horn, cut tail, or injured nostril, require specified compensation to the
    owner.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: If the god strikes a hired ox and it dies, the hirer swears before the god
    and is released.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A savage bull that gores a man and causes his death is described as a case
    having no remedy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If an owner knows an ox is given to goring but does not bind its horns or
    shut it up, and the ox kills a man of gentle birth, the owner pays one half mina
    of silver; if the victim is a gentleman's slave, the payment is one third mina.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man hired to oversee a field is entrusted with seed-grain and oxen for cultivation;
    if he steals seed or provender and it is found in his hands, his hands are cut
    off.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the field overseer takes seed, starves oxen, hires out the oxen, or steals
    seed so that it does not grow, he must make agricultural restitution; if unable
    to pay, he remains in the field with the cattle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage sets yearly grain wages for a field laborer, ox-driver, herdsman,
    or shepherd, and silver payments for theft of a watering machine, watering bucket,
    or harrow.
  category: action
  evidence_refs:
  - ev:10
