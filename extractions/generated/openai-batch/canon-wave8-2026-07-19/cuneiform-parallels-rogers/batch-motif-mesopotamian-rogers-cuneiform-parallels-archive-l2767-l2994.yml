canonical_text:
  quote: He split her open like a flat (?) fish into two halves;
  summary: 'The passage narrates Marduk''s confrontation with Tiamat: he challenges
    her rebellion, advances to battle, traps and kills her with net, winds, and weapons,
    captures her allies and Kingu, takes the Tablets of Destiny, and begins to divide
    Tiamat''s corpse after the victory.'
