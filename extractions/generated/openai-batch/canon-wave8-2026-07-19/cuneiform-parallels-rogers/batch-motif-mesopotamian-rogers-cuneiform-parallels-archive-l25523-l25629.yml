- id: obs:2
  text: A rule states that if a man buys a male or female slave and a specified illness
    or condition falls upon the slave before one month has passed, the slave is returned
    and the purchaser receives back the money paid.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A following rule states that if a purchased male or female slave has a claim
    or dispute, the seller must answer for that claim.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a man purchases a male or female slave of another man in a foreign land,
