canonical_text:
  quote: ''
  summary: The passage contains late laws from the Code of Hammurapi concerning hire
    payments, purchase and return of slaves, recovery of slaves bought in a foreign
    land, reimbursement before a god, manumission in one case, and ear-cutting for
    a slave who denies his master. It then gives part of Hammurapi's epilogue, where
    he presents himself as a wise and righteous king whose rule and wisdom are divinely
    granted, who protects the people of Sumer and Akkad, restrains the strong from
    harming the weak, and inscribes his judgments on a monument before his royal image.
  language: English with Akkadian transliteration
  quote_policy: summarized
