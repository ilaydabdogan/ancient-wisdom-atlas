canonical_text:
  quote: ''
  summary: A first-person Assyrian royal campaign account describes departure from
    Nineveh, crossings of the Tigris and Euphrates, submission and tribute from cities
    and rulers, installation of the king's gods in conquered palaces, sacrifices to
    Adad at Khalman, capture and burning of cities, and a battle against a coalition
    of kings. The narrator claims that Ashur granted him exalted power and Nergal
    granted powerful arms, and he describes defeating the enemy like Adad raining
    a deluge.
  language: English
  quote_policy: summarized
