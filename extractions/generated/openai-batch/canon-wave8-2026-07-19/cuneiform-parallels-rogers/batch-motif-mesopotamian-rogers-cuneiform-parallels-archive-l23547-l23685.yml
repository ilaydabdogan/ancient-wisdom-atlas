canonical_text:
  quote: ''
  summary: Fragmentary legal provisions concerning repayment from garden produce,
    house and neighboring-property obligations, tenant eviction before lease expiration,
    debtor payment with available chattels before witnesses, merchant-agent accounting,
    loss on journeys, divine oath after robbery, and sealed memoranda for commercial
    transactions.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who has taken money from a merchant is connected with repayment from
    dates produced in a garden; the merchant receives money and interest according
    to account, and the garden possessor takes remaining dates.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A house transaction bound by vassalage obligation causes the payer to lose
    what he paid and the house to return to its owner; if the house is not so bound,
    it may be bought with produce, silver, or movable goods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man may perform an action on his own lot without his neighbor's permission,
    but the clause restricts injury on the neighbor's lot.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fragmentary provision mentions stolen possession and an uncultivated portion,
    but the accompanying note says no clear meaning has yet been secured.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A tenant who has paid yearly rent is protected when the house owner orders
    removal before the lease expires; the owner forfeits the tenant's money because
    of early removal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A debtor lacking produce or silver but having chattels must give what he has
    before witnesses, and the creditor must receive it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The interest on money taken by an agent is to be written down, reckoned, and
    returned to the merchant.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If an agent is unsuccessful where he goes, he must double the amount of money
    taken and give it to the merchant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If money is given to an agent as a favor and he meets a reverse, he returns
    the principal to the merchant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If an enemy robs an agent on a journey of what he carries, the agent swears
    by the name of the god and goes free.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When a merchant gives grain, wool, oil, or other goods to an agent to traffic
    in, the agent records the price and hands over the money to the merchant.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The agent must take a sealed memorandum for money given to the merchant; if
    he forgets to take one, unreceipted money is not placed to his account.
  category: object
  evidence_refs:
  - ev:9
