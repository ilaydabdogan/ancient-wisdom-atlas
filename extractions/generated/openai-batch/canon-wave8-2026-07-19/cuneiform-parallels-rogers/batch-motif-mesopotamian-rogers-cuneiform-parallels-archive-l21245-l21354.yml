canonical_text:
  quote: ''
  summary: The passage contains translated royal-inscription material with Akkadian
    transliteration. A royal speaker describes reclaiming Lebanon from an enemy, restoring
    its inhabitants, opening mountain routes, transporting cedars to Babylon and Marduk,
    and setting up a royal image. A fragmentary campaign account invokes Gula and
    refers to Egyptian forces under Amasis in Nebuchadrezzar’s thirty-seventh year.
    A building inscription identifies Nebuchadrezzar as king of Babylon and son of
    Nabopolassar, then describes defensive walls, a moat reaching water-level, and
    a foundation placed on the abyss.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
