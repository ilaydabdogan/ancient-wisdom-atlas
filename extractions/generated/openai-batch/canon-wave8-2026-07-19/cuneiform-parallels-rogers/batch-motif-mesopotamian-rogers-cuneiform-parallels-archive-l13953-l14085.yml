canonical_text:
  quote: ''
  summary: Chronicle entries record Elamite and Assyrian royal accessions and deaths,
    movements or returns of city gods, Assyrian campaigns and executions, conquests
    with booty, an Elamite attack on Sippar, campaigns in Egypt, the death of Esarhaddon,
    and the accession of his two sons in Babylon and Assyria.
  language: English with romanized Akkadian/transliteration fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Elamite ruler named Hum-ma-bal-da-shu or Qum-ma-bal-da-shu is reported
    as taking the throne in Elam, ruling for a stated number of years, and dying in
    fire or burning in one entry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god Ka-di and other gods of Dur-ilu are said to return to Dur-ilu, and
    the chief god and other gods of Dur-Sharrukin are said to return to Dur-Sharrukin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Named persons including a guenna are reported as being brought to Assyria
    and killed there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sidon is reported captured and its booty carried away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The heads of the kings of Sidon, Kundu, and Sisu are reported cut off and
    brought to Assyria.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The King of Elam is said to enter Sippar and make a massacre, while Shamash
    is said not to leave E-barra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Khummakhaldash, King of Elam, is reported to die in his palace without being
    sick, and Urtagu, his brother, takes the throne in Elam.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ishtar of Agade and the other gods of Agade are said to come from Elam and
    enter Agade on a stated date.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The land of Shupri is reported conquered, its booty carried away, and the
    king's wife dies on a stated date.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Assyrian army marches against Egypt, fights three battles, captures Memphis,
    and takes the sons and brother of its king prisoner while the king escapes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Esarhaddon is reported to fall ill while marching against Egypt, die on a
    stated date, and be succeeded by his two sons, Shamash-shum-ukin in Babylon and
    Ashurbanapal in Assyria.
  category: sequence
  evidence_refs:
  - ev:10
