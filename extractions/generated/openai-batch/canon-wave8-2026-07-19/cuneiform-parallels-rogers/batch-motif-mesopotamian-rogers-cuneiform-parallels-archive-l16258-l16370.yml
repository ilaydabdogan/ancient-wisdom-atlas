canonical_text:
  quote: "“As our fathers were, so also will we be good friends.”"
  summary: The passage introduces Tell-el-Amarna material as evidence for Babylonian
    language and script in western Asia, notes related tablet finds in Palestine,
    and gives a letter from Burraburiash of Karaduniash to Amenophis IV of Egypt.
    In the letter, Burraburiash greets the Egyptian king as his brother, recalls inherited
    friendship, complains that his merchants were killed and robbed in Canaan, asks
    for investigation, punishment, restitution, and return of his messenger, warns
    that trade and messenger routes may cease if the crime is not punished, and sends
    a lapis-lazuli present.
  language: English
  quote_policy: quoted
