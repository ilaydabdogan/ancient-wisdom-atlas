canonical_text:
  quote: ''
  summary: After the flood, the first-person speaker sends birds to test whether the
    waters have receded. A swallow returns because there is no resting place, but
    a raven sees the abatement of the waters and does not return. The speaker offers
    sacrifice and libation on a mountain peak, and the gods gather at the offering.
    The Lady of the gods remembers the disaster and excludes Ellil from the offering
    because he sent the deluge. Ellil becomes angry that anyone survived. Ninib and
    Ea speak in response; Ea rebukes Ellil for sending the flood without counsel and
    says Atrakhasis learned the gods' secret through a dream. Ea then enters the ship,
    brings out the speaker and his wife, blesses them, and declares that Ut-napishtim
    and his wife shall be like the gods and dwell far away at the mouth of the rivers.
  language: English, with Akkadian transliteration interspersed
  quote_policy: summarized
