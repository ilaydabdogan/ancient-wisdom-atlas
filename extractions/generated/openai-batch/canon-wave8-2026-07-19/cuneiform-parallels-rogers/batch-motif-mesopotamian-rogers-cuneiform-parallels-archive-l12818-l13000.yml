canonical_text:
  quote: ''
  summary: 'The passage includes a brief calendar fragment naming deities associated
    with months, followed by three ritual-comparative sections: a doctrine of substitution
    in which a lamb is given for a human life and body parts; a treaty scene in which
    a sacrificed ram represents Mati-el and becomes the model for a covenant curse;
    and a temple-purification rite in which a sheep is slain, its body used in purification,
    and the body cast into a river, with the editor noting a partial parallel to the
    biblical scapegoat rite.'
  language: English
  quote_policy: summarized
