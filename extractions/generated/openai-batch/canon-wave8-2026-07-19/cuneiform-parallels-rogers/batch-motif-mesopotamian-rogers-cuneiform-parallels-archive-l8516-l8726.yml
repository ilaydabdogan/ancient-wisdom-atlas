canonical_text:
  quote: ''
  summary: The passage describes Ishtar passing through successive doors into the
    land of No-return, with a watchman removing her ornaments and clothing according
    to the orders of the sovereign of the land. After Ishtar reaches Ereshkigal, Ereshkigal
    commands Namtar to lock her up and release maladies against her. Ishtar's absence
    is followed by a cessation of sexual and generative activity. Papsukkal mourns,
    Shamash weeps before Sin and Ea, and Ea creates Asushunamir and sends him toward
    the gate of the land of No-return.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
