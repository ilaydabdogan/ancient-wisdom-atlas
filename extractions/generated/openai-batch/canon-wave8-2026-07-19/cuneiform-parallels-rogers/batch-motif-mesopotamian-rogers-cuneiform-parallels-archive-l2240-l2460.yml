canonical_text:
  quote: ''
  summary: Anshar sends Gaga to Lakhmu and Lakhamu. Gaga reports that Tiamat has become
    hostile, assembled gods to her side, created weapons and eleven monsters, and
    elevated Kingu with command and the tablets of destiny. Anu and Nudimmud do not
    overcome her; Marduk offers to fight if the divine assembly exalts and fixes his
    destiny. The gods gather, react with distress, and sit at a feast with bread and
    wine.
  language: English with Akkadian transliteration
  quote_policy: summarized
