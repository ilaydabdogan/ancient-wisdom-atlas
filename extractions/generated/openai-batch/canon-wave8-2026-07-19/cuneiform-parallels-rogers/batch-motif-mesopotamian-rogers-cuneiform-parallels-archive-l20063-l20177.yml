canonical_text:
  quote: ''
  summary: The passage summarizes Sennacherib’s Babylonian wars, including rebellions,
    installations and removals of kings, the destruction of Babylon, and his death
    in a temple. It then gives part of Sennacherib’s third campaign inscription, describing
    western cities and rulers who flee, submit, pay tribute, are deported, or are
    replaced by Assyrian appointees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Babylonian rebellion is described in which Bel-ibni, Merodach-baladan, and
    the Chaldean prince Mardukushezib joined; the compact collapsed when Sennacherib
    invaded.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bel-ibni was captured and sent to Assyria, Merodach-baladan fled toward the
    Elamitic coasts of the Persian Gulf and died, and Sennacherib made his son Asshurnadin-shum
    king of Babylon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Chaldeans in Elam caused trouble, Sennacherib raided them; the Elamites
    then invaded Babylonia, plundered Sippar, carried off Asshurnadin-shum, and made
    Nergal-ushezib king of Babylonia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chaldeans seized the throne for Mn-hezib-Marduk, who was publicly proclaimed
    king and supported by the land, Elamites, and Chaldeans led by Samunu; Sennacherib
    later claimed victory over the combined armies at Khalule.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sennacherib destroyed Babylon in 689, later went westward into Arabia, and
    in 681 was slain in a temple by his son or sons.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In the third campaign, Sennacherib marched against the land of the Hittites;
    Luli, king of Sidon, fled into the sea and died after fear of Sennacherib’s dominion
    overwhelmed him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sidon and other strong, walled, provisioned cities were overwhelmed by the
    might of Ashur’s arms and bowed at Sennacherib’s feet; Sennacherib placed Tuba'lu
    on the royal throne and fixed yearly tribute.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Named kings of the Amurru-Country brought rich presents before Sennacherib
    and kissed his feet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sidqa of Ashkelon had not submitted to Sennacherib’s yoke; Sennacherib carried
    off Sidqa’s household gods, family, and kin to Assyria, then appointed Sharruludari
    over Ashkelon and imposed taxes on him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Beth-Dagon, Joppa, Benebarqa, and Azuru, cities of Sidqa that had not quickly
    submitted, were besieged, captured, and despoiled.
  category: action
  evidence_refs:
  - ev:10
