canonical_text:
  quote: ''
  summary: A Tell-el-Amarna letter in which Abdi-khiba addresses the king as his lord,
    declares himself a servant, prostrates himself formulaically, denies accusations
    of revolt, appeals to the king as the source of his appointment, warns that the
    king's territory and cities are falling away, reports hostile activity by named
    and collective opponents, and asks the king to send troops. A following B1 excerpt
    repeats the servant-address formula and says that all lands have become hostile,
    asking the king to care for his land.
  language: English
  quote_policy: summarized
