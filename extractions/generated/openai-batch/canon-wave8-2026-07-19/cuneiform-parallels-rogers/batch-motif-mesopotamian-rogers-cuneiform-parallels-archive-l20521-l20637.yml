  summary: The passage narrates Esarhaddon's accession after Sennacherib's assassination,
    his suppression of rebellion, his rebuilding work at Babylon, Judah's continued
    subjection, campaigns against Chaldeans, Sidon, Tyre, and Egypt, his death on
