canonical_text:
  quote: ''
  summary: In this royal annal passage, the first-person speaker marches through named
    mountains to Aribua, seizes it, stores produce, feasts, settles Assyrians, attacks
    Lukhuti cities, kills and impales captives, then proceeds via Lebanon to the great
    sea, washes weapons, and makes offerings. Coastal kings provide tribute and perform
    submission; the speaker climbs Mount Amanus, cuts timber, offers to the gods,
    and sets up a stela of valor.
  language: English translation with Akkadian transliteration in the source excerpt
  quote_policy: summarized
