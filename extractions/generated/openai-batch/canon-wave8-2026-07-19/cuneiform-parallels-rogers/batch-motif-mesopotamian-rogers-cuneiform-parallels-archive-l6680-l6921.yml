canonical_text:
  quote: ''
  summary: The passage describes a first-person speaker filling and boarding a ship
    with possessions, family, living creatures, animals, and craftsmen after Shamash
    appoints the time to enter and close the door. A divinely driven storm and flood
    then overwhelm the land; named gods participate in the storm, while other gods
    fear and lament the destruction of humankind. After six days and nights the flood
    ceases, the ship comes to rest at Mount Nisir, and the speaker sends out a dove
    that returns.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
