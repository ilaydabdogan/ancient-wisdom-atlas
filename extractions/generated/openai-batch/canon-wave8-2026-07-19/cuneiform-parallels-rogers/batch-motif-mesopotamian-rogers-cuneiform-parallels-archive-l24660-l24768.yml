literal_observations:
- id: obs:1
  text: A daughter who is a votary or vowed female and has not received a marriage
    settlement receives the portion of a son from her father's house after the father's
    death, uses it while she lives, and after her it belongs to her brothers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A daughter vowed to a god as a votary or hierodule, if not given a marriage
    portion, receives one third of the portion of a son after the father's death and
    uses it while she lives; after her it belongs to her brothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A votary of Marduk of Babylon who lacks a marriage portion and a deed receives
    one third of a son's portion with her brothers, pays no tax, and after her death
    may give property where it seems good to her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A daughter described as a concubine who has received a marriage settlement,
    been given to a husband, and received a deed does not share in the goods of her
    father's house after the father's death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a daughter by a concubine has not received a marriage settlement and has
    not been given to a husband, her brothers must grant a marriage settlement according
    to the fortune of the father's house and give her to a husband after the father's
    death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man takes a young child to sonship and rears him, no one may bring a
    claim for that child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If an adopted young child is rebellious against the adopted father and mother,
    the adopted son returns to the house of his father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A claim may not be brought for the son of a chamberlain who is a palace warder
    or for the son of a vowed woman.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: If an artisan adopts a son and teaches him his handicraft, no one may bring
    a claim for that child.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the artisan does not teach the adopted son his handicraft, the adopted
    son may return to his father's house.
  category: sequence
  evidence_refs:
  - ev:10
