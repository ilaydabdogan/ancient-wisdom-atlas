  summary: The passage gives legal provisions concerning daughters' marriage settlements
    and inheritance after a father's death, especially daughters with religious status,
    and provisions concerning adoption, claims on adopted children, return to the
    father's house, and craft training by an adoptive artisan.
  language: English translation with Akkadian transliteration
