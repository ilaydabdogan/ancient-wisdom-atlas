canonical_text:
  quote: ''
  summary: In the Sixth Tablet excerpt, Gilgamesh adorns himself and Ishtar invites
    him to become her lover and husband, promising wealth, status, and royal homage.
    Gilgamesh refuses, citing the misfortunes of her former lovers, including Tammuz.
    Ishtar angrily ascends to Anu and obtains a destructive bull, which is sent against
    Uruk. Engidu and Gilgamesh kill the bull; Gilgamesh dedicates its horns to Lugalbanda
    and returns in triumph. That night Eabani receives an ominous dream.
  language: English
  quote_policy: summarized
