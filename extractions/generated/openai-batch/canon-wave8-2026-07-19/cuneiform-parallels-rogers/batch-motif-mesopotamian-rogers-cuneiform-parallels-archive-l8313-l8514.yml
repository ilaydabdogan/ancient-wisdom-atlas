canonical_text:
  quote: ''
  summary: Ishtar, daughter of Sin, turns her mind toward the land of No-return, Irkalla's
    dark dwelling. The passage describes that realm as a house and road from which
    entrants do not return, where light is absent and dust and clay are sustenance.
    At the door Ishtar commands the porter to open, threatening to break the door
    and bring up the dead against the living if refused. The porter reports her arrival
    to Ereshkigal, who orders the gate opened according to ancient custom. As Ishtar
    enters through successive doors, the watchman removes her great crown, ear pendants,
    neck chains, and breast ornaments, each time citing the sovereign's order.
  language: English
  quote_policy: summarized
