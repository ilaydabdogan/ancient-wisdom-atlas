- id: obs:1
  text: Hammurapi says he raised the summit of Sippar’s wall with earth like a great
    mountain, surrounded it with a swamp, dug out the Euphrates unto Sippar, and set
    up a wall of safety.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hammurapi identifies himself as founder of the land, says his deeds please
