canonical_text:
  quote: ''
  summary: The passage gives excerpts from Hammurapi inscriptions and a letter. Hammurapi
    presents himself as a powerful king favored by Shamash, Marduk, Anu, and Bel;
    describes raising Sippar’s wall, digging waterways, creating agricultural abundance
    and peaceful habitation, building and naming a fortress for his father, and ordering
    Sin-idinnam to mobilize canal labor.
  language: English translation with Babylonian/Sumerian transliteration
  quote_policy: summarized
