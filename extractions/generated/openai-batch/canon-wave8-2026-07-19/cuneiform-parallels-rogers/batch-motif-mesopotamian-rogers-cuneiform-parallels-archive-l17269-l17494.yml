canonical_text:
  quote: ''
  summary: The passage contains the end of a legal guarantee or sale document with
    date and witnesses, followed by two Ta'anek letters. Letter A1 from Guli Addu
    to Ashirat-yashur offers divine blessing, discusses money and reports, instructs
    the recipient to observe an omen of Ashirat, and gives directions concerning the
    recipient's daughter Shalmisha. Letter B1 from Akhi-ia-mi to Ashirat-yashur invokes
    divine protection, speaks of brotherly affection, confinement in Gurra, tools
    or weapons supplied by a workman, wine and cities, anger leading to enemy destruction
    and victory, and the movement or protection of a man through Ilurabi at Rachab.
  language: English with transliterated Akkadian
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says the seller appears to guarantee slaves for one hundred
    days against bennu disease and for all time against latent physical defect; the
    passage also gives a date and a list of witnesses.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Letter A1 is addressed to Ashirat-yashur and sent by Guli Addu; it wishes
    the addressee happy life and divine grace for the addressee, house, and sons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Letter A1 discusses money and states that the sender will give fifty gold
    pieces, with the clause noted as doubtful.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Letter A1 asks why the addressee again sent a greeting and says the sender
    learned matters from there by Belram.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Letter A1 says that if the finger or omen of Ashirat points, one should mark
    and follow it, and the sign and event should be recounted to the sender.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Letter A1 identifies Shalmisha as the addressee's daughter in Rubute and says
    that when she is grown she should be given to sovereignty and belong to the lord.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Letter B1 is addressed to Ashirat-yashur and sent by Akhi-ia-mi; it asks the
    lord of the gods to protect the addressee's life and calls the addressee a brother.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Letter B1 says that when Akhi-ia-mi was in Gurra in durance, a workman gave
    him two knives, a lance, and two baskets for nothing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Letter B1 says the lance was broken and that it will be repaired and sent
    by Buritpi.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Letter B1 asks whether there is wine for the addressee's cities or whether
    the addressee has again taken possession of it, and mentions one who is over the
    cities.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Letter B1 says that if he shows anger, they, glossed as enemies, will come
    to destruction and the victory will be great.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Letter B1 instructs that Ilurabi enter Rachab and either send the sender's
