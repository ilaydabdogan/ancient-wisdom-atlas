  quote: ''
  summary: The passage contains the end of a royal prayer addressing Sin and naming
    Nabonidus and Bel-shar-usur, followed by an excerpt from the Cylinder of Cyrus.
    The Cyrus excerpt describes an offending weak ruler, cessation of offerings, oppression
    of the people, divine anger and departure, Marduk’s selection of Cyrus as righteous
    prince, Cyrus’s divinely accompanied march to Babylon, his bloodless entry, the
    delivery of Nabonidus into his hand, and public submission and rejoicing.
  language: English with Akkadian transliteration
