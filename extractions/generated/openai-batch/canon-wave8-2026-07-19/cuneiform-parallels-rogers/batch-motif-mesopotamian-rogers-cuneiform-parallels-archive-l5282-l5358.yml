canonical_text:
  quote: He granted him wisdom, but he did not grant him eternal life.
  summary: The opening of Tablet No. 1 presents Adapa of Eridu as a wise man created
    by Ea. Ea grants him wisdom and capacity to know or reveal destiny, but not eternal
    life. Adapa is described as blameless, clean-handed, observant of divine statutes,
    and as serving Eridu by making bread, providing food and water, preparing the
    table, steering a ship, and fishing or hunting. The passage ends with Adapa embarking
    on a ship; wind blows, the ship departs, and he steers upon the broad sea.
  language: English with Akkadian transliteration excerpts
