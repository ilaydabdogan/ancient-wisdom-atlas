canonical_text:
  quote: ''
  summary: 'The passage begins with a remnant of an exorcistic inquiry into whether
    a sufferer was banned through familial figures, followed by a note explaining
    that the exorciser seeks the witchcraft source of the affliction and ends it with
    exorcisms. The main wisdom fragment gives second-person admonitions: do not oppress,
    give food and wine, seek truth, help the weak, avoid a harmful sexual/social association,
    refrain from slander and hasty speech, keep promises, read from a tablet in wisdom,
    and render daily sacrifice, prayer, incense, petition, and prostration to the
    deity. The passage repeatedly links conduct, speech, fear of gods, and ritual
    devotion with divine favor, recompense, forgiveness, prosperity, and long life.'
  language: English with Akkadian transliteration
  quote_policy: summarized
