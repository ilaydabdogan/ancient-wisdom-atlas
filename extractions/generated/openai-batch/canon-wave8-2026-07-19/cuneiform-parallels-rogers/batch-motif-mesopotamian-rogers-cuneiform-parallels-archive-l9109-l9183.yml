canonical_text:
  quote: ''
  summary: 'Fragmentary passage from Nergal and Ereshkigal: after a note explains
    that Ea sends Nergal to Ereshkigal''s realm with fourteen sickness-demons as defenders,
    Namtaru commands doors to be opened. Inside the house Nergal seizes Ereshkigal
    from her throne and prepares to kill her. She pleads for life, offers marriage,
    sovereignty over the wide earth, and the tablet of wisdom. Nergal relents, kisses
    her, wipes away her tears, and asks what she has wished from him.'
  language: English with Akkadian transliteration
  quote_policy: summarized
