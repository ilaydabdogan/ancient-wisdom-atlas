canonical_text:
  quote: '"Look on me and learn to reverence the gods."'
  summary: The passage recounts a Greek tradition in which Sethos, an Egyptian priest-king,
    is reassured by a god in a dream before facing Sennacherib's forces; field mice
    then destroy the enemies' military gear, causing their flight. A temple statue
    shows Sethos holding a mouse with an inscription about reverencing the gods. A
    note compares the mouse-bearing image to Apollo Smintheus. The passage then cites
    Polyhistor and Abydenus on Sennacherib's reign, death, Babylonian campaigns, royal
    killings, and installation of Asordanius.
