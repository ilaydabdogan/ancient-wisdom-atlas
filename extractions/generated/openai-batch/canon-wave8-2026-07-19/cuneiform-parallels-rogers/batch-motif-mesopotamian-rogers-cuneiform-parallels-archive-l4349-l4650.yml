canonical_text:
  quote: ''
  summary: 'The passage gives a toothache ritual using beer, a named plant, oil, a
    threefold incantation, and application to the tooth. It then introduces Assyrian
    cosmology as related to Babylonian cosmology, describing Ashur as taking Marduk''s
    place and being identified with Anshar. Two fragmentary Assyrian cosmological
    texts follow: one has Anshar creating or ordering cosmic features, references
    Tiamat, ocean, divine beings, Esharra, a house, and Asshur; the other is a dedicatory
    address to Ashur as creator, father of the gods, king of heaven and earth, sustainer
    of divine groups, maker of humankind, determiner of destiny, and patron of Sennacherib.'
  language: English with Akkadian/Sumerian transliteration
  quote_policy: summarized
