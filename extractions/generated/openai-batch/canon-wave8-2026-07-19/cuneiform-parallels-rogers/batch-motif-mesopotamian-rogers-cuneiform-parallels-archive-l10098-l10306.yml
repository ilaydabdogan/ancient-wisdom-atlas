canonical_text:
  quote: ''
  summary: A hymnic prayer addresses a female deity named or epitheted as lady, Gushea,
    Ishtar, and Irnini. The passage praises her martial power, dominion, laws, divine
    exaltation, temples, cosmic awe, judgment, mercy, liberation, fiery radiance,
    and power to make the dead live and the sick rise. A suffering servant then petitions
    her for mercy and deliverance from bodily, emotional, household, spiritual, magical,
    and persecutory afflictions.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed lady is described as bearing arms, establishing combat, framing
    laws, and wearing a crown of dominion.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anu, Ellil, and Ea are said to exalt her and increase her dominion among the
    gods; her place is also made great among the Igigi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sanctuaries, shrines, divine dwellings, and temples are said to worship her;
    the passage asks where her name, decrees, images, and temples are not found.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the thought of her name, heaven and earth quake, gods tremble, the Anunaki
    falter, and people pay homage to her name and adore her power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She is said to judge the cause of men with justice and right, to regard the
    despised man with mercy, and to set right the down-trodden every morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: She is addressed as lady of heaven and earth, lady of E-anna, lady of conflict
    and battles, subduer of angry gods, holder of the sceptre of kings, and opener
    of the bonds of slaves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: She is called a brilliant torch of heaven and earth, a light of all dwellings,
    a flame against the foe, and a goddess of men and women whose decision no one
    may apprehend.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Where she looks, the dead live, the sick arise, and the unjust become just
    when beholding her face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker identifies as her sorrowful, sighing, suffering servant and asks
    her to look, accept supplication, pity, hear prayer, and speak deliverance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker asks for deliverance for body, heart, bowels, house, and spirit,
    each described as full of trouble, sorrow, confusion, complaint, or sighing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker asks that evil bewitchments of the body be ended so that the speaker
    may see the deity’s clear light.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker describes accusers, a persecutor, and a pursuer as acting against
    him, mentions a mourner’s garment prepared for him, and says he is troubled like
    a flood made to rage by an evil wind.
  category: speech
  evidence_refs:
  - ev:6
