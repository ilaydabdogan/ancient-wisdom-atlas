canonical_text:
  quote: ''
  summary: The passage gives legal provisions from Hammurapi sections 176-179 concerning
    property division after a slave's marriage to a gentleman's daughter, widow remarriage
    with minor children under judicial oversight, and the inheritance or disposition
    rights of votary or vowed women depending on the terms of a written deed.
  language: English with Akkadian transliteration fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A palace slave or a freedman's slave may marry the daughter of a gentleman,
    and she may enter his house with a marriage portion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the time the married pair join hands, they may build a house and acquire
    property together.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the slave husband dies, the daughter of the gentleman takes her marriage
    portion, and jointly acquired property is divided between the slave's owner and
    the woman for her children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the daughter of the gentleman has no marriage portion, jointly acquired
    property is still divided into two parts between the slave's owner and the woman
    for her children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A widow with minor children who intends to enter another house must obtain
    the consent of judges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Judges inspect the estate of the widow's former husband, entrust the former
    husband's house to the later husband and the widow, and cause them to receive
    a deed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The later husband and widow are to administer the property and rear the minor
    children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A utensil belonging to the sons of a widow may not be sold; a purchaser loses
    his money and must return the property to its owners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A votary or vowed woman whose father gave her a marriage portion and deed,
    but not full discretion, is maintained by her brothers after her father's death
    through grain, oil, and wool according to her share.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the brothers fail to provide the required maintenance, the woman may give
    her field or garden to a cultivator of her choice, who will maintain her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Under the restricted deed, the woman enjoys her father's gift during her life
    but may not sell it or transfer it to another; the heritage belongs to her brothers.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: If the deed grants the woman full discretion, then after her father's death
    she may give the estate to whomever she pleases, and her brothers have no claim.
  category: action
  evidence_refs:
  - ev:10
