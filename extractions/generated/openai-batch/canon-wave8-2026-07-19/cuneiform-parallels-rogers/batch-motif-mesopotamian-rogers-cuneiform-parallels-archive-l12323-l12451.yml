canonical_text:
  quote: May the dream I behold be favorable. May the dream I behold be true.
  summary: The passage contains a fragmentary psalm associated with Tammuz, describing
    a lord or god of grain who has suffered destruction, no longer bestows peace or
    salvation, and is mourned. It then gives a prayer asking for departure from wickedness,
    salvation, a favorable and true dream, the presence of dream deities at the speaker's
    head, entry into Esagila, commendation to merciful Marduk, and subsequent praise.
  language: English with Sumerian/Akkadian transliteration
  quote_policy: quoted
