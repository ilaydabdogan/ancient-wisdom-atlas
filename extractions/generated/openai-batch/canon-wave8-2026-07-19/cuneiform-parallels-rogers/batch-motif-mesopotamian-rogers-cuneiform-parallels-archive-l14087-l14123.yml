canonical_text:
  quote: ''
  summary: 'A chronicle-style passage dates events to the beginning of Shamashshum-ukin’s
    reign: Bel and the gods of Akkad leave Asshur and enter Babylon; the King of Kirbitu
    is captured; Bel-etir is captured in Babylon and killed. A colophon states that
    the tablet was read and prepared according to an archetype, gives named owners
    or copyists, and dates the tablet to Babylon in the twenty-second year of Darius.'
