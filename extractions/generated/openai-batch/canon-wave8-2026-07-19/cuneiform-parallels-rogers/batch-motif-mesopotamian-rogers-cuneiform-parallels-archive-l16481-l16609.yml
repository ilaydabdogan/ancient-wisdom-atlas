canonical_text:
  quote: ''
  summary: A fragmentary Tell-el-Amarna passage and a letter of Rib-Adda/Rib-Addi
    address the king as lord and sun, invoke Ba'alat of Byblus for the king's power,
    and repeatedly use a prostration formula. Rib-Adda complains that no answer or
    military aid has been sent, that his messenger and horses have been seized and
    the king's tablet not delivered, and that the Khabiri may be said to have taken
    the lands. He asks for garrison troops, horses, provisions, and action through
    Jankhamu; threatens alliance with Abdiashirta and departure from the city if no
    answer comes; and says Ummakhnu and Ishkuru will pray to Ba'alat for the king's
    power.
  language: English with Akkadian transliteration
  quote_policy: summarized
