canonical_text:
  quote: ''
  summary: The prologue presents Anu and Ellil as supreme gods who entrust universal
    dominion to Marduk and establish Babylon's enduring kingdom. Anu and Bel then
    call Hammurapi by name to make justice prevail, destroy wickedness, protect the
    weak from the strong, and enlighten the land like Shamash. Hammurapi is praised
    as shepherd, divinely called king, temple restorer, city benefactor, provider
    of abundance, warrior, favorite or servant of various gods, and possessor of royal
    regalia.
  language: English with transliterated Akkadian/Babylonian lines
  quote_policy: summarized
