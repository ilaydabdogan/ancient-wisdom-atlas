canonical_text:
  quote: ''
  summary: The passage contains an Assyrian royal-inscription fragment naming places,
    rulers, gods, tribute, and cultic centers, followed by a dedication inscription
    for a statue of Nebo from Calah. Nebo is praised with epithets of power, knowledge,
    mercy, magic, and heavenly authority; the object is made and presented for the
    life and wellbeing of Adad-nirari, Sammuramat, and the donor Bel-tarsi-ilu-ma.
    The inscription ends by instructing later princes to trust in Nebo and not another
    god.
  language: English with Akkadian transliteration
  quote_policy: summarized
