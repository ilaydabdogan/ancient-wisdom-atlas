canonical_text:
  quote: ''
  summary: The passage includes an address to a River of Creation, an editorially
    introduced fragment about Ellil, Tishpak, and the sea monster Labbu, and the opening
    of a text on seven evil demons. The river is praised as creator, sanctuary, site
    of Ea's dwelling, receiver of powers from Ea and Marduk, and judge of mankind.
    The Labbu fragment describes communal distress, a gigantic sea monster, divine
    appeal for a slayer, Tishpak's commission, storm imagery, a seal of life, the
    slaying of Labbu, and the long flowing of its blood. The final opening lines describe
    seven evil demons as raging storms and evil gods created in heaven's vault.
  language: English
