canonical_text:
  quote: ''
  summary: A royal inscriptional passage in which Cyrus identifies himself with universal
    and dynastic titles, describes his peaceful entry into Babylon, care for Marduk's
    worship, restoration of dwellings, removal of a yoke from the people, receipt
    of tribute and homage from other kings, return of gods and inhabitants to their
    proper dwellings, and a request that the gods pray for him and for his son Cambyses.
    The end is fragmentary.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
