  quote: ''
  summary: The excerpt recounts an Assyrian royal march under divine command, the
    taking of camels from Arabian kings, a hazardous route with two-headed serpents,
    Marduk's aid in reviving the troops, and harsh terrain. A following Ashurbanapal
    section describes the capture and punishment of Ushu and Acco, including judgment
    on rebellious people, deportation of gods and people to Assyria, display of bodies
    on poles, and incorporation of captives into the army.
