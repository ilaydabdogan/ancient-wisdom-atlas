canonical_text:
  quote: ''
  summary: The passage narrates Cyrus’s advance against Babylonia while Nabonidus
    remains at Tema and is occupied with building and antiquarian restoration. It
    then describes the defeat of Belshazzar, the peaceful entry of Cyrus’s forces
    into Babylon, and Nabonidus’s capture. The included Nabonidus cylinder inscription
    presents Nabonidus as king, temple supporter, restorer of the step tower at Ur,
    and petitioner to Sin for divine favor, long life, and protection from sin for
    himself, the people, and Belshazzar.
  language: English
  quote_policy: summarized
