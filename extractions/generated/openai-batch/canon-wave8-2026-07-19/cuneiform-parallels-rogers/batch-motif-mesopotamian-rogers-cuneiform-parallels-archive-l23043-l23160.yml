canonical_text:
  quote: ''
  summary: A sequence of Hammurapi law provisions regulates unresolved robbery, compensation
    for loss of life, theft during a house fire, duties and property rights of soldiers
    and constables in royal service, the care of captured soldiers' households, ransom
    procedures, and capital penalties for officials who abuse soldiers or royal levies.
  language: English with transliterated Akkadian
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a robber is not captured, the robbed man declares the extent of his loss
    before the god, and the city and governor restore the lost property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a life is lost, the city and governor pay one mina of silver to the dead
    person's people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who comes to extinguish a house fire and steals the householder's property
    is cast into that fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A soldier or constable who is ordered to go on the king's errand but sends
    a hired substitute instead is put to death, and the hireling takes his house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a captured soldier or constable returns and reaches his city, his field
    and garden are restored to him and he resumes his affairs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a captured soldier's son can conduct his father's affairs, the field and
    garden are given to the son so that he may do so.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If the captured soldier's son is too young to conduct the affairs, one third
    of the field and garden is given to the mother, who rears him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A soldier or constable who lets his field, garden, and house lie waste for
    three years loses them to the person who has taken them and conducted the affairs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the same property is left for only one year and the original holder returns,
    the field, garden, and house are restored to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A captured soldier or constable on the king's errand may be ransomed by a
    merchant and then by his own house, the temple of the god of his city, or the
    palace, but his field, garden, and house are not to be given for the ransom.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A governor or magistrate who misuses levied men, sends a hired substitute
    on the king's errand, plunders or defrauds a soldier, or takes the king's gift
    to a soldier is put to death.
  category: action
  evidence_refs:
  - ev:9
