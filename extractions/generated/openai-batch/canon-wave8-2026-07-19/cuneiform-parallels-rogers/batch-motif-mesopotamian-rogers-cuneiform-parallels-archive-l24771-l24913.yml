literal_observations:
- id: obs:1
  text: If a man has not numbered the reared adopted child with his sons, the adopted
    son may return to his father's house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If an adoptive father later makes a house for himself, acquires children,
    and seeks to cut off the adopted son, the son is to receive one third of a son's
    portion from the father's goods, excluding field, garden, or house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the son of a chamberlain or the son of a vowed woman says to the father
    or mother who reared him that they are not his father or mother, his tongue is
    to be cut out.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the son of a chamberlain or vowed woman knows his father's house, hates
    the parents who reared him, and goes back to his father's house, his eye is to
    be plucked out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a son given to a wet-nurse dies in her hands and she substitutes another
    child without the consent of the father and mother, she is called to account and
    her breasts are cut off.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man strikes his father, his hands are to be cut off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For injuries to a gentleman's eye or bone, the penalty repeats the same injury
    against the offender's eye or bone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: For injuries to a freedman or a gentleman's slave, the penalty is payment
    in silver or a fraction of the slave's price rather than identical bodily retaliation.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a man knocks out the tooth of a man of his own rank, his tooth is knocked
    out; if the injured person is a freedman, the penalty is silver payment.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Striking a social superior, an equal of gentle birth, a freedman, or a freedman
    by a gentleman's slave receives different sanctions including public strokes,
    silver payment, or ear cutting.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In a quarrel wound, the striker swears that he did not strike intentionally
    and is responsible for the doctor; if the injured person dies, the striker swears
    and pays according to the victim's status.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage begins a provision concerning a man who strikes a gentleman's
    daughter and causes her to drop what was in her, but the consequence is not included
    in the provided excerpt.
  category: action
  evidence_refs:
  - ev:11
