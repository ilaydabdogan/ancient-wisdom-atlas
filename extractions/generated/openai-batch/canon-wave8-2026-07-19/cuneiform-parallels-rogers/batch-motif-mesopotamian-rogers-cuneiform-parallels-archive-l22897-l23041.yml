canonical_text:
  quote: ''
  summary: The passage gives provisions from the Code of Hammurapi concerning lost
    property and witnesses, kidnapping, fugitive slaves, burglary, brigandage, communal
    restitution, and theft during a house fire. Several cases prescribe death, restitution,
    fixed proof deadlines, palace inquiry, or oaths before the god.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a lost-property dispute, a purchaser who does not bring the seller and
    purchase witnesses, while the owner brings witnesses who know the property, is
    to be put to death as a thief and the owner receives the property.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An owner who claims lost property but does not produce witnesses who know
    it is described as a malefactor who stirred up strife and is to be put to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the seller has died, the purchaser is to take fivefold damages from the
    seller’s estate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When witnesses are not at hand, judges set a fixed term of up to six months;
    failure to bring witnesses makes the man bear the penalty of the case.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Stealing the minor son of a gentleman is punished by death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Helping a palace or freedman’s male or female slave pass through the city
    gate, or receiving a fugitive slave into a house and not producing the slave on
    command, is punished by death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A person who seizes a fugitive slave in the field and returns the slave to
    the owner receives two shekels of silver; if the slave will not name the owner,
    the slave is brought to the palace for inquiry and return.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Keeping a fugitive slave in one’s house until the slave is found there is
    punished by death; if the slave escapes from the captor, the captor swears by
    the god to the owner and goes free.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man who breaks into a house is killed before the breach and thrust into
    it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A captured brigand is put to death; if the brigand is not captured, the robbed
    person recounts the loss before the god, and the city and governor of the district
    repay the loss.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: If a fire breaks out in a man’s house and someone who came to extinguish it
    turns to the householder’s property, that man is thrown into the fire.
  category: sequence
  evidence_refs:
  - ev:11
