canonical_text:
  quote: ''
  summary: The passage gives a ritual formula for raising the hand to Ishtar, including
    kneeling, sprinkling a green bough with pure water, setting bricks, preparing
    a lamb and aromatic offerings with fire, making a drink offering, reciting an
    incantation three times, and not looking behind. A short incantation addresses
    Ishtar as giver of light to the four quarters. A colophon names a Borsippa copy
    and a magician-copyist. The following hymn praises Ishtar as heavenly light and
    flame, a rising goddess, a leopard and lion in simile, a virgin ornament of heaven,
    sister of Shamash, giver of omens, goddess of evening and morning, opener of heaven's
    bolt, shaker of earth, queen of heaven, subduer of mountains, and deity whose
    heart and soul are to be appeased by Anu and Ellil.
  language: English with Akkadian/Sumerian transliteration
  quote_policy: summarized
