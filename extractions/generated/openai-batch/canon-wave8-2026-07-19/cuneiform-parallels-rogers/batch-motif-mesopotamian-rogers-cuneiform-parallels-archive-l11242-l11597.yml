canonical_text:
  quote: May he be freed from whatever ban has been put upon him.
  summary: The passage is an interrogative moral and ritual inventory in a prayer
    associated with raising the hand to Ishtar. It asks whether an unnamed male subject
    has caused social division, mistreated captives or neighbors, spoken falsely,
    violated measures and boundaries, broken vows or offerings, used magic or witchcraft,
    angered deity, and then petitions that he be released from any ban.
  language: English translation with Akkadian transliteration
