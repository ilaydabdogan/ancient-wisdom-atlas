canonical_text:
  quote: ''
  summary: The supplied passage from the Fifth Tablet describes an unnamed acting
    figure arranging celestial stations, stars, months, Nibiru, gates, the zenith,
    and the Moon-god's calendrical duties. Fragmentary lines relate the Moon-god to
    the Sun-god's path and right judgment. Later fragments show the gods beholding
    a net and bow made by the acting figure, praising the work, and Anu kissing and
    naming the bow, including as the Bow Star, with a heavenly station or throne indicated.
    The conclusion is highly fragmentary.
  language: English with Akkadian transliteration
  quote_policy: summarized
