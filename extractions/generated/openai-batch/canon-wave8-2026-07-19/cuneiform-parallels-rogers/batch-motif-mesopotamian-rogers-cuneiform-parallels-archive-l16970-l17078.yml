canonical_text:
  quote: ''
  summary: The passage presents Tell el-Amarna correspondence in which Abdi-khiba
    addresses the king as lord, reports revolts, seizure or loss of cities and territory,
    absence or capture of garrison forces, and requests troops and royal agents to
    preserve or restore the king's land.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Abdi-khiba addresses the king as his lord and calls himself the king's servant,
    saying he falls at the king's feet seven and seven times.
  category: speech
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: Milki-lim is accused of revolting with Lapaia's sons and Arzawa's sons in
    order to demand the king's land for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Milki-lim and Tagi are said to have taken Rabuda and to be seeking to take
    Jerusalem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The land of Ginti-kirmil is said to belong to Tagi, and the people of Ginti
    form a garrison in Betsani.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Labaja and the land of Shakmi are said to have given everything to the Khabiri.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Milki-lim is said to have written to Tagi and his sons, telling them to give
    what was demanded to the people of Kilti; Abdi-khiba asks whether Jerusalem should
    be let go.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The garrison sent by the king through Khaya son of Miare is said to have been
    taken by Addaya and placed in Addaya's house in Khazati; twenty men were sent
    to Egypt, leaving no garrison with Abdi-khiba.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Puuru is said to have departed from Abdi-khiba and to be in Khazati.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Abdi-khiba asks the king to send fifty garrison-men to guard the king's land
    and to send Yi'enkhamu to take heed for the king's country.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Abdi-khiba addresses the king's scribe and asks that his words be brought
    clearly before the king.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the second letter, Milki-il and Shuardata are said to have won over soldiers
    of Gazri, Gimti, and Kilti, taken the territory of Rubute, and caused the king's
    territory to be lost to the Khabiri.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Bit-Ninib, described as a city in the territory of Jerusalem and one of the
    king's cities, is said to have been lost to the people of Kelti.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Abdi-khiba asks the king to listen and send troops so that the king's land
