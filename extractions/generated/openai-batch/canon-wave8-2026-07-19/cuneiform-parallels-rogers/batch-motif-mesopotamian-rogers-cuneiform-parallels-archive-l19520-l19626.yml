canonical_text:
  quote: ''
  summary: The passage summarizes Sargon II’s invasion of Babylonia, his proclamation
    as governor of Babylon, the dedication of Dur-Sharrukin, and his violent death.
    It then gives annalistic excerpts about the conquest and resettlement of Samaria,
    campaigns against Hamath, Gaza, Rapihu, Judah, Bit-Khumria, Egypt, and Ashdod,
    including rebellions, defeat of enemies, deportations, appointments of governors
    or kings, and prisoners taken to Asshur.
  language: English
