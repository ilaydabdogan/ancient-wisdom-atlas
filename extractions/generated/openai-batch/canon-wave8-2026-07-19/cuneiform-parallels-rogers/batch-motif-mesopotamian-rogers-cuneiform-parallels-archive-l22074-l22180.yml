canonical_text:
  quote: ''
  summary: A kudurru or boundary-stone legal passage praises En-lil/Ellil as an unequaled
    sovereign deity whose commands other gods obey. It describes his favor toward
    Nebuchadrezzar, including royal shepherding, sanctuary restoration, tithe regulation,
    victory over enemies, possession of a sceptre, long life, and magnified name.
    The passage also names cultic offerings, prostrations, supplications, priestly
    figures, a royal servant, and a measured arable field on the bank of the Tigris.
  language: English translation with transliterated Akkadian/Sumerian
  quote_policy: summarized
