canonical_text:
  quote: ''
  summary: A fragmentary preceding section is followed by a Tell-el-Amarna letter
    in which Abdi-khiba addresses the king as lord and sun, falls at his feet seven
    times and seven times, denies hostile accusations, states that the king’s strong
    arm established him, reports tribute and gifts, describes hostility and the occupation
    or loss of the king’s cities, reports several killings, and asks the king to send
    troops or an officer, affirming loyalty as servant and son.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
