canonical_text:
  quote: Two thirds of him is God, one third of him is man.
  summary: 'The passage introduces the Gilgamesh poem and summarizes the first tablet:
    Gilgamesh is presented as ruler and hero of Uruk, a far traveler who sees hidden
    wisdom, brings tidings from before the Deluge, records sufferings on a stone tablet,
    and builds Uruk’s wall. His burdensome labor demands lead the people to appeal
    to the gods, who ask Aruru to create a rival. Aruru creates Engidu from clay and
    spittle after the likeness of Anu. Engidu lives among wild beasts until a hunter,
    advised by others, brings a harlot whose charms lead him to Uruk, where he meets
    Gilgamesh and their friendship begins.'
  language: English
  quote_policy: quoted
