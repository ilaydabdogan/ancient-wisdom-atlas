canonical_text:
  quote: ''
  summary: Fragmentary portions of the Seventh Tablet praise and name divine figures,
    especially Tutu under multiple epithets. The passage attributes to him purification,
    good wind, abundance, the making of the dead living, pity for captive gods, removal
    of a yoke from enemy gods, creation of humanity, destruction of evil through incantation,
    knowledge of divine hearts, establishment of divine assembly, cosmic naming, stellar
    ordering as Nibiru, conquest of Tiamat, and creation of heaven and earth. Other
    fragments mention figures such as Ungal-durmakh, Adu-nunu, Ea, Bel, the Igigi,
    and mankind.
  language: English with Akkadian/Sumerian transliteration
  quote_policy: summarized
