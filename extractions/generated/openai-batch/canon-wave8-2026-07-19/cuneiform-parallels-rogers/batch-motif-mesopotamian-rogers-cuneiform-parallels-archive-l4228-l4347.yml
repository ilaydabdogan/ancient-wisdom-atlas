  quote: ''
  summary: The passage contains a damaged fragment about the formation of beasts,
    a brief mention of Gula and contrasting white and black forms, followed by an
    incantation against toothache. The incantation gives a cosmogonic sequence from
    Anu and the heavens down through earth, rivers, canals, and morass to the Worm.
    The Worm weeps before Shamash and Ea, asks for food and something to destroy,
    rejects figs, requests placement among teeth and gums to consume blood and cartilage,
    and is cursed with Ea's smiting fist.
