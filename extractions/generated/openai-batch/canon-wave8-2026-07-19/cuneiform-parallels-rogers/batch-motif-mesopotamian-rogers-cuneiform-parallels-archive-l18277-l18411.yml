  summary: The passage presents transliterated and translated excerpts from Assyrian
    royal inscriptions, especially Obelisk, Bull, and annalistic accounts of Shalmaneser
    III. The royal speaker recounts campaigns involving Euphrates crossings, defeats
    of coalitions and Hazael of Damascus, seizure of chariots and equipment, destruction
    and burning of cities, mountain movements, erection of a royal portrait, and receipt
    of tribute including Jehu’s tribute.
