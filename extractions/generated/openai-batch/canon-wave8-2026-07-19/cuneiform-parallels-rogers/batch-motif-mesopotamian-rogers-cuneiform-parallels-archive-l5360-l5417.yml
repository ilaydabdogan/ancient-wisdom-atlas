canonical_text:
  quote: The wing of the South wind was broken, seven days / The South wind blew not
    upon the land.
  summary: In a fragment from the Myth of Adapa, the South Wind is threatened and
    its wing is broken. The South Wind then does not blow upon the land for seven
    days. Anu asks his messenger Ilabrat why this has happened, and Ilabrat reports
    that Adapa, son of Ea, broke the South Wind's wing. Anu reacts and orders that
    someone bring him; the fragment also mentions Ea, who knows heaven, rousing him.
  language: English with Akkadian transliteration
