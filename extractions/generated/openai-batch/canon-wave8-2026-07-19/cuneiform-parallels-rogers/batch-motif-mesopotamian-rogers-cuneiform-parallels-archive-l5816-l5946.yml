canonical_text:
  quote: ''
  summary: The passage recounts a Babylonian tradition in which uncivilized settlers
    in Chaldea receive instruction from Oannes, a fish-human amphibious being from
    the Red Sea, who teaches writing, numbers, arts, civic institutions, temples,
    laws, land-surveying, agriculture, and civilized life, then returns nightly to
    the sea. It also gives a sequence of early kings with long reigns in sars and
    notes another fish-human being, Idotion, appearing from the Red Sea during Ammenon's
    reign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of men of different races had settled Chaldea and lived in an uncivilized
    manner, compared to beasts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first year, an intelligent being named Pannes/Oannes appeared from
    the Red Sea where it borders Babylonia.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The being is described as having the body of a fish overall, an additional
    head under the fish head, human feet from the fish tail, and a human voice.
  category: attribute
  evidence_refs:
