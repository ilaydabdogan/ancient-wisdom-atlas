  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If outlaws gather in a wine merchant’s house and she does not arrest them
    or bring them to the palace, she is put to death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A female votary not living in a convent who opens or enters a wine shop for
    drink is to be burned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wine seller who gives 60 KA of drink on credit at harvest time receives
