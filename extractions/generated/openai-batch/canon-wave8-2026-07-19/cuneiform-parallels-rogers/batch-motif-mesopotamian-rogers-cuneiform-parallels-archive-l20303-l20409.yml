  quote: ''
  summary: 'The passage contains portions of Assyrian royal-campaign material and
    related notes: Hezekiah and Jerusalem are named in Akkadian transliteration in
    connection with tribute sent to Nineveh; Sennacherib’s western campaign is summarized
    with the removal of Luli, installation of Tuba''lu, subjugation of Hezekiah and
    Judah, destruction of mountain and hill-country peoples and cities, and conquest
    of Tilgarimmu; a Lachish relief inscription presents Sennacherib enthroned while
    prisoners pass before him; a later Arabian campaign records the seizure of camels
    from Queen Telkhjunu and flight into the desert by Telkhjunu and Khazail; Herodotus’
    account begins with Sethos, priest of Hephaistos, praying in distress and receiving
    a dream in which the god promises help against Sennacherib’s army.'
