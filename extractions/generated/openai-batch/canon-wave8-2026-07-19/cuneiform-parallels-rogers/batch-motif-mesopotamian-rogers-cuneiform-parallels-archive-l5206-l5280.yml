canonical_text:
  quote: ''
  summary: 'The passage introduces the myth of Adapa as preserved on four tablets/fragments,
    then summarizes the narrative: Adapa, son of Ea, has wisdom but not eternal life;
    while fishing he is overturned by the south wind and breaks its wings; Anu summons
    him, Ea warns him about heavenly food and drink, and Adapa refuses what is actually
    the food and water of life, losing immortality and returning to earth. The passage
    closes by comparing this pattern with Genesis 2-3.'
  language: English
  quote_policy: summarized
