canonical_text:
  quote: ''
  summary: A fragmentary creation passage lists named divine beings and cultic offices
    brought into being, including a high priest, a king for the shrines of the gods,
    and humanity for worship. A separate passage on the creation of the moon and sun
    says Anu, Ellil, and Ea fixed the moon's crescent, established the month and signs
    for heaven and earth, and that mankind saw Shamash at the gate of his going forth.
  language: English with Sumerian and Akkadian transliteration
  quote_policy: summarized
