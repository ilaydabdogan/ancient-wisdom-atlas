canonical_text:
  quote: All lands were sea.
  summary: The passage presents a creation account in which an initial state lacks
    temples, cities, reeds, trees, bricks, creatures, and named sacred places, while
    all lands are sea. Eridu, E-sagil, Babylon, the Anunaki, humanity, animals, rivers,
    plants, marshes, and cities are then made or ordered, chiefly by Marduk, with
    Aruru assisting in the creation of the seed of mankind. A following fragment begins
    another creation text about cattle, beasts, and two small creatures made by Nin-igi-azag.
  language: English translation with Akkadian transliteration
  quote_policy: quoted
literal_observations:
