canonical_text:
  quote: ''
  summary: A kudurru passage describes a field formerly uncultivated and exposed to
    water, gives its measurements and adjoining lands, records its measurement and
    perpetual grant by Bau-shum-iddina to Nusku-ibni, names surveyors, and then lists
    future persons who might disturb or deny the grant. The text invokes a sequence
    of deities to curse such a violator with destruction, evil fate, loss of joy and
    abundance, darkness, unjust judgment, removal of the boundary stone, illness,
    misfortune, and an evil demon.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The land is described as formerly lacking a ditch, vegetation, and cultivation,
    and as exposed to the inroads of water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage specifies the field's lengths, widths, adjoining districts or
    estates, location on the bank of the Tigris, and total seedfield measure.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bau-shum-iddina, governor of Bit-Sin-sheme, measured the field and granted
    it forever to Nusku-ibni, son of Upakhkhia-Nusku, priest of Ellil and magistrate
    of Nippur.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Two surveyors of the field are named: Nabu-zer-lishir and Nabunna.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The text anticipates future persons, including shepherd, governor, agent,
    regent, levy master, and magistrate, who might overthrow or interfere with the
    grant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Prohibited acts include seizing the field or pasture, stretching out a finger
    toward evil, taking canal or land workers under levy, cutting plants, claiming
    or taking the field, returning it to the governor, or denying that it was measured,
    presented, given, or received.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anu and Ellil are invoked to overthrow the offender, destroy his life, decree
    an evil fate, and make calamity and human speech oppress him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ea, Sin, Shamash, and Ramman are invoked to remove joy and abundance, darken
    the offender's face, give evil plans, and withhold judgment of justice and uprightness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ninib, Gula, Ishtar, and Nusku are invoked to remove the boundary stone, inflict
    lingering illness and bloodshed, reveal difficulties and misfortune, and become
    the offender's evil demon.
  category: speech
  evidence_refs:
  - ev:6
