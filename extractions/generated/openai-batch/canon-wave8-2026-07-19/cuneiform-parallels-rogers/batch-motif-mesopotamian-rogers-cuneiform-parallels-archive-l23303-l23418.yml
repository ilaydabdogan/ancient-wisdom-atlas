canonical_text:
  quote: ''
  summary: The passage gives agricultural and debt provisions from the Code of Hammurapi.
    It regulates debt relief after storm or drought, fields pledged as security for
    loans, repayment in grain or sesame, contract validity after crop failure, royal
    fixing of repayment value, liability for neglected dikes or canals, and compensation
    when water damages another field.
  language: English with transliterated Akkadian
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a debtor's field is ravaged by Ramman, produce is carried away, or grain
    fails through lack of water, the debtor does not return grain to the creditor
    or pay interest for that year, and the tablet is altered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:2
  text: A borrower may give a field to a merchant as security and instruct cultivation
    for grain or sesame; at harvest the field owner receives the produce and gives
    the merchant grain for the loan, interest, and the cultivator's maintenance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: If a planted field is given as security, the field owner receives the grain
    or sesame in the field and returns the loan and interest to the merchant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: If money is not available for repayment, grain or sesame is given to the merchant
    at market values fixed by the king.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Failure by the cultivator to secure a crop of grain or sesame does not void
    the contract.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man who neglects to strengthen his dike and whose dike breaks so that water
    carries away a meadow must restore the lost grain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the man cannot restore the grain lost through the dike break, he and his
    goods are sold for money, and the people whose grain was carried away share the
    proceeds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man who opens a canal or waters and allows water to carry away an adjacent
    or neighboring field must measure out or pay grain as compensation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage repeatedly treats fields, grain, sesame, water, money, tablets,
    dikes, and canals as practical elements in legal obligations.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
