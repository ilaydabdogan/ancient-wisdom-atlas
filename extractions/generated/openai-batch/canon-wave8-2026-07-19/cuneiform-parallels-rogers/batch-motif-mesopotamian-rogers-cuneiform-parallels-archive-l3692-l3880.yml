canonical_text:
  quote: ''
  summary: The passage closes a section on Marduk’s exalted names and authority, including
    the proclamation of fifty names, their transmission to later hearers, and statements
    about Marduk’s command, anger, compassion, and fertility-giving power. It then
    gives Damascius’s report of a Babylonian cosmogony from paired primordial origins
    and successive divine generations ending with Belos as Demiurge. A final ritual
    fragment describes a cosmological recitation for temple restoration, in which
    Anu creates the heavens and Nudimmud/Ea creates the ocean, clay, building materials,
    craft gods, mountains, seas, and deities connected with offerings and sacrifices.
  language: English with Akkadian transliteration and Greek citation
  quote_policy: summarized
