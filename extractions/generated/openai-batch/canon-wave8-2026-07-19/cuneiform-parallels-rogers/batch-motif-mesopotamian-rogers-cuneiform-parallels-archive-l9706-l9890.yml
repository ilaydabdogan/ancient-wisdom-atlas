canonical_text:
  quote: Ramman directeth the storm, sendeth forth the storm.
  summary: The passage contains part of a hymn to Ramman, the weather god, praising
    him through titles and images of bull, lion, storm, thunder, lightning, hail,
    and divine power against a foe. It also presents Ellil as sending his son Ramman.
    The end of the passage begins a processional hymn asking that Marduk or Enbilulu
    enter and rest in his house or temple, causing the house to rejoice.
  language: English with Sumerian transliteration
