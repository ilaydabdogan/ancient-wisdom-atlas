canonical_text:
  quote: ''
  summary: A royal speaker states that he has written curses on his monument against
    anyone who despises the divine curse, erases or alters the law, words, images,
    or name, or substitutes his own name. A series of named deities are invoked to
    punish such a violator with loss of royal authority, rebellion, famine, darkness,
    death, destruction of city and people, loss of wisdom, loss of water and grain,
    evil dreams, guilt, military defeat, and enemy triumph.
  language: English with transliterated Akkadian
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he has written curses upon his monument.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cursed offender is described as one who despises the speaker's curses,
    does not fear the curse of the god, blots out the given law, defaces words, alters
    images, blots out the speaker's name, writes his own name, or commissions another
    to do so.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The offender may belong to any named social rank in the passage: king, lord,
    patesi, or commoner.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anu is invoked to take royal glory from the offender, break his staff, and
    curse his fate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ellil is invoked to set up an uncontrollable rebellion, bring downfall upon
    the offender's dwelling, and assign him a reign of sighs, short life, famine,
    darkness without light, and sudden death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bel is invoked to command the destruction of the offender's city, scattering
    of his subjects, removal of his dominion, and erasure of his name and memory in
    the land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Belit is invoked to make the offender's affairs evil before Ellil and to place
    in Ellil's mouth destruction of land and people and the pouring out of the offender's
    life like water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ea is invoked to deprive the offender of knowledge and wisdom, lead him into
    oblivion, lock his rivers at their sources, and prevent grain from growing in
    his land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shamash is invoked to break the offender's kingdom, deny him his right, disturb
    his way, destroy the foundation of his troops, and bring evil dream omens concerning
    the uprooting of his throne and the ruin of his land.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shamash's curse is also invoked to sweep the offender away, cut him off among
    the living, and deprive him of water below in the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sin is invoked to remove the offender's crown and royal throne, place heavy
    guilt and great sin on him, and end the days, months, and years of his reign in
    sighs and tears.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sin is invoked to multiply the burdens of sovereignty and fix for the offender
    a life like death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ramman is invoked to deprive the offender of rain from heaven and water floods
    from springs, destroy his land with hunger and want, thunder over his city, and
    make his land into heaps.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Zammama is invoked to break the offender's weapons in battle, turn his day
    into night, and make his enemy triumph over him.
  category: speech
  evidence_refs:
  - ev:10
