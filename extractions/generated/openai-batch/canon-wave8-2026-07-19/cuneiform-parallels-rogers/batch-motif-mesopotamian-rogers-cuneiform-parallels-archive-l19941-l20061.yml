canonical_text:
  quote: ''
  summary: The passage discusses Sennacherib's campaign or campaigns against Judah,
    including the destruction of Ekron, the capture of many fortified cities, the
    blockade of Jerusalem, and the taking of Lachish. It then compares Assyrian and
    biblical source traditions, argues for difficulties in treating the biblical material
    as one campaign, presents a two-campaign hypothesis, and summarizes a reconstructed
    later campaign in which Sennacherib demands Jerusalem's surrender, Hezekiah refuses
    on Isaiah's advice, pestilence strikes the Assyrian army, and Sennacherib withdraws.
    It also notes a Herodotean tradition of destruction by mice as a symbol of pestilence
    fitting the plague account in 2 Kings 19.35.
