canonical_text:
  quote: ''
  summary: The passage contains excerpts from inscriptions of Shalmaneser III. It
    lists allied rulers and contingents who opposed him, describes battles at or near
    Qarqar, claims divine support from Assur and Nergal, records large numbers of
    enemy dead, blood and bodies covering the field and damming the Orontes, and notes
    captured chariots, horses, and equipment. A Bull Inscription recounts a sixth-year
    campaign from Nineveh through the Balikh, Euphrates, Hittite country, Khalman,
    and Qarqar, including tribute and sacrifice to Hadad. A Berlin Inscription gives
    Shalmaneser’s royal titles and ancestry, claims conquests, compares his attack
    to fire, and describes the seizure of Akhuni of Adini together with his gods,
    soldiers, and household goods.
  language: English with Akkadian transliteration
  quote_policy: summarized
