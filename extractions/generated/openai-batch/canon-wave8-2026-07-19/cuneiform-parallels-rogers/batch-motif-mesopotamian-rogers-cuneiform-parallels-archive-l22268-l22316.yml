canonical_text:
  quote: Whoever removes this stone
  summary: A kudurru or boundary-stone curse threatens anyone who removes, hides,
    burns, casts into water, encloses, or otherwise conceals the stone. The great
    gods named on the stone are invoked to curse the offender, tear out his foundation,
    and destroy his seed. The passage then records people present at the sealing of
    the tablet and dates it to the sixteenth year of Nebuchadrezzar.
  language: English translation with Akkadian transliteration
