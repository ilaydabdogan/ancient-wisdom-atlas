canonical_text:
  quote: ''
  summary: Gilgamesh mourns Engidu, fears that he too will die, and wanders in the
    desert. He resolves to seek Ut-napishtim, who is said to have escaped death and
    lives beyond the western seas. On the journey he comes to Mount Mashu, encounters
    terrible scorpion-men who guard it, is warned of the dangerous road, passes for
    twelve double hours through darkness, then emerges into sunlight and reaches a
    beautiful garden by the sea.
  language: English
  quote_policy: summarized
