canonical_text:
  quote: ''
  summary: Legal provisions from the Code of Hammurapi regulate inheritance, disinheritance,
    recognition of children by a wife or maidservant, a widow's residence and property
    rights, remarriage and division of marriage portions, and the status of children
    born to mixed-status unions.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father who seeks to cut off his son must state the matter before judges,
    who examine the son's conduct before disinheritance is allowed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a first grave offense against the father, the judges reconcile father
    and son; for a second grave offense, the father may cut off the son from sonship.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a father has called the maidservant's sons "my sons" and numbered them
    with the wife's sons, both groups divide the father's household goods equally
    after the father's death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the maidservant's sons are not acknowledged as sons, they do not share
    the father's household goods with the wife's sons, but the maidservant and her
    sons receive freedom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wife may take her marriage portion and documented settlement, dwell in her
    husband's house while she lives, and may not sell the property because it belongs
    afterward to her sons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If no settlement was given, the widow receives her marriage portion and a
    son's share from the husband's household goods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If sons pressure the woman to leave the house, judges investigate; if the
    sons are at fault, she is not to leave her husband's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the woman chooses to leave, she leaves the husband's settlement to her
    children, takes the marriage portion from her father's house, and may be taken
    by the husband of her choice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Children from a later husband and children from the former husband divide
    the woman's marriage portion after her death; if there are no later children,
    the first husband's sons divide it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A slave of the palace or of a freedman may take a gentleman's daughter as
    wife, and the slave's owner may not claim her sons for service.
  category: relationship
  evidence_refs:
  - ev:10
