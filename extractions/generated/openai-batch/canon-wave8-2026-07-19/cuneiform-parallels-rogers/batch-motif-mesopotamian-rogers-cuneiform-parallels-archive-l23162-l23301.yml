canonical_text:
  quote: ''
  summary: The passage gives legal rules on king-granted livestock and service realty,
    restrictions on selling or transferring fields, gardens, and houses attached to
    official duties, annulment of invalid purchases by breaking a tablet, permitted
    transfer of privately acquired property, exchange arrangements, duties of purchasers,
    obligations of field cultivators, restoration of neglected fields, and allocation
    of crop loss when Ramman ravages a field.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a man buys cattle or sheep that the king gave to a soldier, the buyer forfeits
    his money.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The field, garden, or house of a soldier, constable, or tribute man is not
    to be sold for money.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a man purchases the field, garden, or house of a soldier, constable, or
    tribute man, his tablet is broken, he forfeits his money, and the property is
    returned to its owner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A soldier, constable, or tribute man may not make over benefice field, garden,
    or house to wife or daughter, nor assign them for debt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man may make over a purchased and acquired field, garden, or house to his
    wife or daughter, or assign them for debt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A nun marked as doubtful, a merchant, or another vassal may sell field, garden,
    or house for money, and the purchaser must fulfill the duties attached to the
    property.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man receives in exchange the field, garden, or house of a soldier, constable,
    or tribute man and adds a payment, then when the official returns to the property,
    he keeps the additional payment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man who took a field for cultivation and produced no grain is called to
    account and must give grain to the field owner on the basis of neighboring fields.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A neglected field must be broken up with hoes, hoed, harrowed, and returned
    to the field owner; similar restoration is required for an unreclaimed field after
    three years, with ten GUR of grain per GAN measured out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the tenant has already given the owner the produce share and Ramman ravages
    the field and carries away the remaining produce, the loss belongs to the tenant.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: If the owner has not received the field produce, or if the field was given
    on a one-half or one-third share arrangement, the tenant and field owner share
    the grain according to the contract.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The supplied passage begins a further clause in which a tenant gives cultivation
    of a field into another person's charge because in a former year he did not win
    a maintenance; the legal outcome is not included in the supplied range.
  category: sequence
  evidence_refs:
  - ev:12
