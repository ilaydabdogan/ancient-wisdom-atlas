canonical_text:
  quote: ''
  summary: Extract from the Code of Hammurapi setting legal consequences for unauthorized
    grazing, cutting an orchard tree, garden-planting and garden-management contracts,
    neglect of fields, produce sharing, a textual lacuna, and the beginning of a debt
    case involving garden dates.
  language: English with transliterated Akkadian excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A shepherd who pastures sheep on a field without the field owner's consent
    must compensate the owner after the owner reaps the field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If sheep have left the meadow and been closed within the gate, and a shepherd
    then turns them into a field, the shepherd is liable for a larger grain payment
    at harvest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who cuts down a tree in another man's orchard without the owner's consent
    must pay one half mina of silver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a field is given to a gardener to plant as a garden, after four years
    of care the owner and gardener share equally in the fifth year, and the owner
    marks off and takes his share.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the gardener does not plant the whole field and leaves a waste place, the
    waste portion is assigned to the gardener's share.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the gardener fails to plant an arable field as a garden, he must compensate
    the owner according to adjacent fields, perform the required work, and restore
    the field.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the field was unreclaimed land, the gardener must perform the required
    work, restore it, and measure out ten GUR of grain per GAN for each year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A gardener managing another man's garden gives the owner two thirds of the
    produce and keeps one third while holding the garden.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a gardener has not properly tilled the garden and has diminished the produce,
    he measures out produce according to the adjacent gardens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An editorial note states that five columns of the text are erased, that the
    lost material probably contained about thirty-five sections, and that restored
    numbering is doubtful.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the beginning of a restored section, a man who has borrowed from a merchant
    offers the dates produced in a cultivated garden for the debt, but the merchant
    is not to assent; the possessor of the garden may take the dates before payment
    is made.
  category: relationship
  evidence_refs:
  - ev:8
