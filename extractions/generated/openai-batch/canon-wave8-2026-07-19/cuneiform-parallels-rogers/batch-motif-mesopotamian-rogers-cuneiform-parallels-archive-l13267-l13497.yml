canonical_text:
  quote: Sargon, king of Agade, by Ishtar's royal insignia was exalted
  summary: Chronicle excerpts recount early Babylonian and Assyrian rulers, including
    Sargon's divine exaltation, conquests, revolts, and punishment by famine; Naram-Sin's
    campaigns; Dungi's actions at Eridu and against E-sagila and Babylon; Ura-imitti's
    enthronement of the gardener Bel-ibni; and brief notices of Hammurapi and Samsu-iluna's
    campaigns.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sargon, king of Agade, is said to have been exalted by Ishtar's royal insignia
    and to have had no rival or enemy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sargon crossed the eastern sea, subdued the Country of the West, united it
    under one control, set up his images in the west, and brought back booty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sargon marched against Kacalla, turned it into mounds and ruins, and destroyed
    it so completely that no bird had a resting place there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Sargon's old age all lands revolted, besieged him in Agade, and he went
    out to battle and defeated them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sargon attacked Subartu, whose people bowed before his arms; he quelled the
    revolt, defeated them, destroyed their host, and brought their possessions into
    Agade.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sargon removed soil from the trenches of Babylon and made the boundaries of
    Agade like those of Babylon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Because of evil attributed to Sargon, Marduk became angry, destroyed Sargon's
    people by famine, and the lands rebelled against him from sunrise to sunset.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Naram-Sin, son of Sargon, marched against Apirak, built trenches, and subdued
    Rish-Adad, king of Apirak, and the governor of Apirak.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Naram-Sin marched against Magan and subdued Mannu-dannu, king of Magan.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Dungi adorned Eridu on the shore of the sea, then sought evil and carried
    off the treasure of E-sagila and Babylon as spoil; the following line is fragmentary
    but says an end was made of him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ura-imitti set Bel-ibni, the gardener, upon his throne and placed the crown
    of kingship on his head so that the dynasty might not end; after Ura-imitti died,
    Bel-ibni remained seated on the throne and was established as king.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Hammurapi marched against Rim-Sin, conquered Ur and Larsa, and took their
    possessions to Babylon; a fragmentary continuation names Samsu-iluna, son of Hammurapi,
    in connection with conquering Rim-Sin.
  category: action
  evidence_refs:
  - ev:12
