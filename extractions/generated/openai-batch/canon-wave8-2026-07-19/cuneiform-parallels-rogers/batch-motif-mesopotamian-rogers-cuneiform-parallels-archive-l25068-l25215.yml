canonical_text:
  quote: ''
  summary: 'A passage from the Code of Hammurapi giving legal rules for craft and
    transport liability: defective building work that causes collapse, death, or property
    loss; boat construction and boatman negligence; compensation for grounded or lost
    ships and freight; ship collision with a declaration before the god; annual boatman
    hire; and an opening rule on an ox seized for debt. The passage also contains
    untranslated Akkadian transliteration for preceding clauses on animals, barbers,
    and building fees.'
  language: English with Akkadian transliteration
  quote_policy: summarized
