canonical_text:
  quote: ''
  summary: In a fragmentary passage from “Nergal and Ereshkigal,” the gods prepare
    a feast and send word to Ereshkigal that she may send for her portion because
    she cannot come up to them. Ereshkigal sends Namtar to the heavenly assembly.
    In the damaged narrative, Nergal fails to rise before Namtar, Ereshkigal threatens
    to kill the offender, and Namtar is sent to identify and bring him. Ea gives Nergal
    “VII and VII” beings to accompany him. Nergal comes to Ereshkigal’s door, is recognized
    by Namtar, and stations named companions at successive doors.
  language: English
  quote_policy: summarized
