    III in acts of dominion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Amenophis III's reign is associated with extensive building and prosperity,
    and his later years included negotiations for a marriage for his son; the passage
    adds that Tiy may have reigned alone briefly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Amenophis IV married Tatukhepa, also named Nefertiti in the passage, daughter
    of Tushratta of Mitanni, soon after his accession.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In his sixth year Amenophis IV changed his faith, became a worshiper of the
