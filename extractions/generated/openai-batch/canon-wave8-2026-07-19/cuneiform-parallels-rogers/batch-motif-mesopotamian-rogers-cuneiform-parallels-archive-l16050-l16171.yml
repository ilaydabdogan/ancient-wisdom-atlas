  summary: Historical prose describing eighteenth-dynasty Egypt, Semitic and northern
    influences through conquest, commerce, royal marriage, and correspondence, culminating
    in Amenophis IV/Akhenaten's worship of the Solar Disk, foundation of a new city,
    and the later return to Thebes after his death.
  language: English
  quote_policy: summarized
