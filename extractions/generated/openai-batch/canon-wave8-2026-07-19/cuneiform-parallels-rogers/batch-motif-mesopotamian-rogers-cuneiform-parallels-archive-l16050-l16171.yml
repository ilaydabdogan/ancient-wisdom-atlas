- id: obs:1
  text: The eighteenth dynasty is described as having begun by driving out the Hyksos;
    Thothmes III later conquered Syria and Palestine and extended Egyptian dominion
    northward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Precious goods and captives from Syria were taken to Egypt, and the captives
    worked at their crafts and taught Egyptians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Semitic influences from Syria and Babylonia spread through
    Egypt and affected wares, taste, language, writing style, and physical features
    of the ruling race.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Amenophis II raided Syria early in his reign and then had a long period of
    peace and commerce with his Syrian dominions; Thotmes IV maintained control in
    Syria and Nubia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Amenophis III is said to have pursued international peace, married Tiy and
    Gilukhepa, and received correspondence from Babylonia and Mitanni that largely
    dealt with royal marriages and intercourse between kingdoms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
