canonical_text:
  quote: ''
  summary: A sequence of imprecatory appeals asks named deities and divine collectives
    to punish an unnamed male target. Ishtar is invoked for military defeat and captivity;
    Nergal for coercion and bodily breaking; Nintu for denial of descendants; Nin-karrasha
    for incurable illness; the great gods, Anunnaki, the genius of Ebarra, and Ellil
    for irresistible and unalterable curses upon the target, his seed, land, army,
    subjects, and soldiers.
  language: English translation with embedded Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ishtar is described as a goddess of battle and conflict, a protector of the
    speaker, one who takes hold of the speaker's weapons and loves the speaker's reign.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ishtar is asked to curse the target's dominion and turn his grace into evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ishtar is asked to break the target's weapons, create disorder and rebellion,
    strike down warriors, let the earth drink their blood, and cast troop bodies in
    heaps on the field.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The target is to be denied a life of pity and delivered bound into the land
    of his enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nergal is described as powerful among the gods, a warrior without rival, and
    a giver of victory to the speaker.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nergal is asked to bind the target's subjects as in a strong vessel of reeds,
    beat the target down with powerful arms, and break his members like an earthen
    image.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nintu is described as exalted mistress of the lands and mother of births,
    and is asked to deny the target a son, a name, and an heir among his subjects.
  category: action
  evidence_refs:
  - ev:4
