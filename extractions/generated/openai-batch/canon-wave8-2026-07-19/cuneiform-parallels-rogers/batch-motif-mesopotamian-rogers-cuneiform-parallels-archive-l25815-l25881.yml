  text: Nin-karrasha is described as daughter of Anu and one who promises grace to
    the speaker.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nin-karrasha is asked to bring a terrible disease, evil fever, and sore wounds
