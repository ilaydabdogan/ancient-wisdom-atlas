canonical_text:
  quote: ''
  summary: The passage describes scarcity, diminished rain, obstructed waters, failed
    fields, salt-bearing land, lack of plants and lamb growth, calamity upon humans,
    and a closed womb. After a missing section, Ea speaks; an unnamed female actor
    recites an incantation, spits on clay, divides fourteen clay pieces into right
    and left groups with a brick between them, opens nostrils, and calls seven and
    seven mothers. The mothers form males and females, and Mami is named as forming
    human figures.
  language: English translation with Akkadian transliteration
  quote_policy: summarized
