canonical_text:
  quote: ''
  summary: The passage gives family-law cases from the Code of Hammurapi concerning
    putting away wives or concubines, marriage portions and bride-prices, children
    and inheritance-like support, domestic misconduct, return to a father's house,
    taking a maidservant or concubine, and one case in which a woman is thrown into
    the waters.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who puts away a concubine or wife who has borne him children must return
    her marriage portion, give her usufruct of field, garden, and goods, and let her
    bring up the children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the children are grown, they give the woman a portion like that of one
    son, and the man of her choice may marry her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who puts away a wife who has not borne children must give compensation
    connected with the bride-price and restore the marriage portion she brought from
    her father's house; alternate silver amounts are specified when there was no bride-price
    or when the man is a freedman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wife who seeks to go out, neglects her house, and belittles her husband
    is called to account; if the husband puts her away she receives nothing for divorce.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If that husband says he has not put her away, he may marry another woman,
    while the first woman dwells in his house as a maidservant.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a woman hates her husband and says he shall not have her, an inquiry is
    made into her past and her lack.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the woman is found economical and without reproach, and her husband has
    gone out and greatly belittled her, she has no blame, takes her marriage portion,
    and goes to her father's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the woman has not been economical, has gone about, has neglected her house,
    and has belittled her husband, she is thrown into the waters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a wife has given a maidservant to her husband and the maidservant has borne
    children, the husband is not allowed to take a concubine.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a wife has not presented children to her husband, he may take a concubine
    into his house, but the concubine does not rank with the wife.
  category: relationship
  evidence_refs:
  - ev:7
