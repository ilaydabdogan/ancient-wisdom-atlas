    Ishtar of Nineveh to Egypt, asks that she be honored and returned in peace, and
    invokes her protection; and the opening of a letter from Rib-Adda of Byblus to
    his royal lord, invoking Ba'alat of Byblus, performing formulaic prostration,
    and reporting danger from Khabiru warriors around Sumur and Byblus.
