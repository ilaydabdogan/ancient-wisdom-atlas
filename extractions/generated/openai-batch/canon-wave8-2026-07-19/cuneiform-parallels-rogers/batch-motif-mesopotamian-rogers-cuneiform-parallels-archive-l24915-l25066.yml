canonical_text:
  quote: ''
  summary: The passage gives Code of Hammurapi provisions on bodily injury, miscarriage
    and death from blows, medical fees and malpractice penalties, veterinary treatment
    of oxen and asses, alteration of slave marks, and the beginning of builder-fee
    and house-liability provisions. Penalties and payments are repeatedly differentiated
    by social status and ownership.
  language: English with Akkadian transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A slave of a gentleman who strikes a son of a gentleman is punished by cutting
    off the slave's ear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who wounds another in a quarrel must swear that he did not knowingly
    strike him and must pay the doctor; if the injured person dies, silver payment
    varies according to the victim's status.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blows that cause a woman, daughter, or maidservant to lose what was in her
    womb require silver payment; if the woman dies, the prescribed result varies by
    status, including death of the offender's daughter in one case and silver payments
    in others.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A doctor using a bronze lancet to cure a severe wound or remove a cataract
    receives fees in silver that vary by the patient's status.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A doctor whose bronze-lancet operation causes a gentleman's death or destroys
    a gentleman's eye has his hand cut off; for harm to a slave, the penalty is replacement
    or payment of part of the slave's price.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A doctor who sets a broken bone or cures a painful swelling receives a fee,
    again scaled by whether the patient is a gentleman, freedman's son, or slave of
    a gentleman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A veterinary doctor who successfully treats an ox or ass receives a small
    silver fee; if the treatment causes death, he pays one fourth of the animal's
    value to the owner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A brander who makes a slave's mark unrecognizable without the owner's consent
    has his hands cut off; a man who deceives a brander into doing this is killed
    and buried in his house, while the brander who swears ignorance goes free.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A builder who completes a house for a man receives a fee of two shekels of
    silver per SAR of house; the following provision begins a case about a weakly
    built house, but the excerpt ends before the outcome.
  category: sequence
  evidence_refs:
  - ev:7
