  summary: The passage describes the discovery at Susa of fragments of a black diorite
    stele bearing the Code of Hammurapi. Its upper relief shows the seated sun god
    Shamash presenting the laws to Hammurapi. The text then summarizes the inscription’s
    physical arrangement, damage, probable earlier location at Sippar, removal to
    Susa, duplicate fragments, and later Assyrian copying and scholarly identification
    of the code.
