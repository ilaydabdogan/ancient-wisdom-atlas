canonical_text:
  quote: ''
  summary: A Tell-el-Amarna letter attributed to Abdi-khiba appeals to the king for
    troops, a garrison, provisions, and royal officers to preserve Jerusalem and the
    surrounding lands. The speaker says Jerusalem was granted by the king rather than
    inherited from parents, accuses named opponents of handing royal land to the Khabiri,
    reports revolt and robbery, and stresses that the king has placed his name on
    Jerusalem forever.
  language: English, with transliterated Akkadian included in the source passage
  quote_policy: summarized
