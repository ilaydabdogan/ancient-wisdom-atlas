canonical_text:
  quote: ''
  summary: The passage is a hymn or prayer to an addressed Lord, identified in a prayer-title
    line as Sin. The deity is praised as father, begetter, ruler of heaven and earth,
    holder of fire and water, leader of souls, and unrivaled among gods. His word
    is said to bring abundance, vegetation, multiplying life, truth, and righteousness.
    Divine groups prostrate or kiss the ground before his word. The prayer asks him
    to look on his temple, city, Ur, and Egisshirgal, and asks Ningal, Shamash, the
    Igigi, and the Anunnaki to say that the Lord be appeased. A colophon states that
    the text was copied and compared according to the original.
  language: English with Sumerian/Akkadian transliteration
  quote_policy: summarized
