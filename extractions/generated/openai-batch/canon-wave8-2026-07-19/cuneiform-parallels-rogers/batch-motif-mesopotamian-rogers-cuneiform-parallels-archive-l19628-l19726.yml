canonical_text:
  quote: ''
  summary: The passage gives parts of Sargon II inscriptions concerning Ashdod. Azuri
    is accused of withholding tribute and fomenting hostility; Akhimeti is installed
    over the people, but Yamani is later placed on the throne. Sargon marches against
    Ashdod, conquers Ashdod, Gath, and Ashdudimmu, seizes gods, royal family members,
    goods, and people, repopulates the cities with people from eastern lands, and
    installs Assyrian officers. A king of Melucha, fearing the power of Ashur, Nabu,
    Marduk, and Sargon’s majesty, binds and sends Yamani to Assyria. A fragmentary
    account adds that rebels dug a defensive moat to the water level, sought aid from
    Pir'u of Egypt, and that Sargon describes himself as legitimate ruler honoring
    Nabu and Marduk and guarding Ashur’s name.
  language: English with transliterated Akkadian excerpts
  quote_policy: summarized
