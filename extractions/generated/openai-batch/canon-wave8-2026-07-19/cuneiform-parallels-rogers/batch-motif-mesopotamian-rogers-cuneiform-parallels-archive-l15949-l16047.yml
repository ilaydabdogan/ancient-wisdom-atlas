  summary: The passage gives a brief publication note and Akkadian transliteration
    associated with Hammurapi, then narrates the 1858 discovery at Tell-el-Amarna
    of clay tablets in ancient record boxes, their concealment, damage, sale, dispersal
    among museums and private collections, and their identification as diplomatic
    letters and dispatches involving western Asian rulers, regional governors, and
    Egyptian kings.
