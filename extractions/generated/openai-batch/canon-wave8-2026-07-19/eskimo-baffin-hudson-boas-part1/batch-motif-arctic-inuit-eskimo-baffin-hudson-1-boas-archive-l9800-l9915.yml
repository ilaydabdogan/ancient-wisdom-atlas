  evidence_refs:
  - ev:1
- id: obs:3
  text: The man who had stabbed Kokoparoolee's brother is snowblind and in bed; his
    wife rolls him in seal-skins and answers that nearby weapons and clothing belong
    to her boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kokoparoolee thrusts his knife through the seal-skin bundle and kills the
