canonical_text:
  quote: ''
  summary: The passage contains two narrative episodes. In the first, Kokoparoolee
    avenges his killed brother by killing the hidden killer and then several armed
    brothers, later evading a boat party that attempts to frighten him with a human
    skull placed in water. In the second, Kunikjwak's son abducts Pudlookshine's wife,
    attacks Pudlookshine after a false accusation, dies by rushing onto Pudlookshine's
    knife, and Pudlookshine escapes pursuit by hiding under snow before reaching his
    sister's household for protection.
  language: English
  quote_policy: summarized
