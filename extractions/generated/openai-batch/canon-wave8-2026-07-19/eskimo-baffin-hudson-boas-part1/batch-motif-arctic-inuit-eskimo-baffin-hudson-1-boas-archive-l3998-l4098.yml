canonical_text:
  quote: ''
  summary: The passage describes fall religious ceremonies centered on appeasing Sedna
    and other offended souls, shamanic soul travel to Sedna’s house, Sedna’s reproaches
    and promises, a ritual harpooning and cutting of Sedna marked by blood omens,
    and a following festival involving Qailertetang, birth-animal skin tokens, gift-seeking
    cries, a summer-versus-winter rope contest, communal water sipping for calm souls
    and health, and ritual pairing of men and women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stated purpose of the ceremonies is to appease Sedna, animal souls, and
    souls of the dead when they have been offended by taboo transgressions, with help
    from the guardian spirits of the angakut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The most important ceremony is held in the fall, when Sedna is said to visit
    her people and give abundant food if they do as instructed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Three angakut begin incantations; their souls go down to Sedna’s house, ask
    about food and health, receive reproach and conditional promises, return, and
    report Sedna’s instructions and promises.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During Sedna’s approach, an angakut throws a kayak-style harpoon at her; an
    angakut’s soul follows her with a large knife and stabs her before returning to
    the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When lamps are lit, blood on the harpoon, knife, and floor is taken to mean
    plenty of food for the year; no blood on the knife is described as an ill omen.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Qailertetang, Sedna’s servant, visits the tribe on the following day and is
    represented by a man in woman’s clothing wearing a seal-skin mask.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Qailertetang is described as a large woman with heavy limbs who brings good
    weather and calm souls, carries seal-hunting gear and a skin-scraper, is dumb,
    sees everything, and enjoys seeing people celebrate.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: People attach to their hoods a piece of the animal skin used by their mothers
    at birth; wearing it prevents sickness and soul departure, while wearing the wrong
    skin brings punishment.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: People run around tents shouting until owners give small presents, usually
    food; the cries are said to keep souls longer in their bodies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A rope contest divides those born in summer near the water from those born
    in winter inland; winter’s victory predicts plenty of food, while summer’s victory
    predicts a bad winter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: People bring water to a tub near Qailertetang, sip it one by one, state their
    birthplace and birth season, and wish for calm weather, calm souls, health, and
    long life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Qailertetang places men opposite women, joins individual pairs by the hand,
    and the paired man and woman run away; the passage states this is not an actual
    exchange of wives.
  category: action
  evidence_refs:
  - ev:9
