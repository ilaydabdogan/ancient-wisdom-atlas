canonical_text:
  quote: ''
  summary: 'The passage gives a taboo concerning a woman who has lost a child, then
    narrates a Cumberland Sound version of the Sedna myth: Avilayoq marries a dog
    transformed from a stone and has children of several kinds; a petrel husband takes
    her away; her father retrieves her; the petrel pursues and a storm rises; the
    father throws Avilayoq into the water and cuts off her fingers, which become sea
    mammals; after further deaths and disappearances, she becomes Sedna in the lower
    world.'
  language: English
  quote_policy: summarized
