canonical_text:
  quote: ''
  summary: The passage contains adjacent tale episodes. Kunengoo arrives from Qamaqdju,
    marries an elder brother, is left to guard stored meat and caribou skins, and
    is later brought back with the stores while others wonder at her presence. Uktowyouakjew,
    a small but very strong inland hunter, is mocked by visiting brothers and their
    mother; he demonstrates his power in a kayak hunt by outpacing and upsetting the
    brothers and drowning caribou by their antlers. Kudlang and his son encounter
    a strange caribou in water, shoot at it, flee its attack, and find after its death
    that it is not ordinary caribou meat.
  language: English
  quote_policy: summarized
