canonical_text:
  quote: ''
  summary: 'A man named Apasinasee urges his unmarried daughter to marry his dog.
    The dog appears in male form, cohabits with her, and she gives birth to a litter
    of dogs. The father moves the woman, dog, and pups to an island, later kills the
    dog by weighting meat-boots with stones, and the woman has the pups devour him.
    She then sends groups of her brood away: some over the ocean in a boot-sole ship,
    some inland who become the Ijiqat, another group who become the Inuarudligat,
    while the remaining brood become ancestors of the Eskimo. A second origin tale
    tells of a woman transforming clothing into a walrus and a caribou, then swapping
    tusks and antlers and altering the caribou after it kills a man.'
  language: English
  quote_policy: summarized
