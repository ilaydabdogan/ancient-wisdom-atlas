canonical_text:
  quote: ''
  summary: 'The passage gives several Cumberland Sound traditions: Eavarnan, an Adla
    girl living with Eskimo, is linked to an Adlet killing of Eskimo women and is
    mutilated by the bereaved men; two Eskimo men later raid and kill the Adlet in
    their village. A second Adlet story tells how Mumatchea, her husband, and a child
    are captured, how the husband gains favor through seal-hunting skill, and how
    an angry chief breathes fire and the camp burns after his brother has intercourse
    with the chief’s wife. The passage then introduces Tornit as tall, strong earlier
    inhabitants with distinctive customs, and ends with a tuneq brother dying on a
    cliff after an incident his sister later connects to her menstruation and urination.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eavarnan is described as an Adla girl who lived with the Eskimo, visited her
    own people, and slandered the Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Eskimo men were away hunting seal in kayaks, the Adlet went to the Eskimo
    tents and killed all the women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eavarnan remained to meet the returning Eskimo and asked who wanted to marry
    her; after the men found their wives murdered, two men cut off her arms close
    to the shoulders.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two Eskimo men decided to avenge the women and secretly approached the village
    of the Adlet by a roundabout route.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the Adlet village, the people gathered in a large tent around a large dish;
    the man in fresh-water-seal clothing entered, killed them all, and the Eskimo
    took the Adlet property home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mumatchea, her husband, and a child encountered an Adlet village; the husband
    hid Mumatchea with snow and the sledge, but the Adlet found her and took the family
    to the chief’s house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Eskimo family remained among the Adlet through the spring, and Mumatchea’s
    husband went sealing with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mumatchea’s husband caught a basking seal by crawling up to it and harpooning
    it, a method the Adlet had not seen before; the chief praised his skill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief’s wife became pregnant and later gave birth; the chief’s brother
    then had intercourse with her, and the chief knew of the act and became angry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The angry chief told the Eskimo man to go home so that harm would not befall
    him, and he was breathing fire from his nostrils.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the Eskimo family left, they saw a great fire rising from the Adlet
    camp; the narration says the chief probably burned his wife and brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Tornit are described as a tall and strong people who formerly inhabited
    the country and lived in large stone houses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Tornit are said not to have known how to dress skins and to have kept
    rancid seal-meat under their jackets before eating it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: For a severe headache, the Tornit are said to have drilled a hole through
    the person’s skull, allowing blood and matter to ooze out; the operation is said
    to have cured the headache.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A tuneq climbed a steep island to catch fulmars, remained on the cliff after
    repeatedly seeing his sister’s lower parts bare, survived for a time on young
    fulmars, and died there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Tumoovat later found human bones near the cliff edge, and the tuneq woman
    said she had not told her brother she was menstruating and had urinated while
    he was on the hill, naming this as the cause of his misfortune.
  category: sequence
  evidence_refs:
  - ev:7
