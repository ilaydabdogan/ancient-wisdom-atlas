candidate_motifs:
- id: motif:1
  label: Resident outsider betrays host community
  taxonomy_refs: []
  basis: Eavarnan is an Adla girl living with the Eskimo who visits her own people
    and slanders the Eskimo before the Adlet kill the Eskimo women.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explicitly say Eavarnan directly planned the killing;
    it only places her slander and the Adlet attack in sequence.
- id: motif:2
  label: Retaliatory raid against enemy village
  taxonomy_refs: []
  basis: After the women are killed, two Eskimo men decide to avenge them, infiltrate
    the Adlet village, kill the gathered Adlet, and bring back their property.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No broader named vengeance cycle is identified in the supplied metadata.
- id: motif:3
  label: Concealment under snow and sledge fails
  taxonomy_refs: []
  basis: Mumatchea is hidden under snow and a sledge between the runners, but the
    Adlet find her and take the family to the village.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this as a practical hiding attempt, not explicitly
    as a ritual or magical concealment.
- id: motif:4
  label: Skilled outsider gains esteem through unfamiliar hunting technique
  taxonomy_refs: []
  basis: The captured Eskimo man catches a basking seal by crawling and harpooning
    it, a method unseen by the Adlet, and is praised by the chief.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The event shows admired skill but does not state that the Adlet permanently
    adopt the technique.
- id: motif:5
  label: Fire-breathing anger and punitive burning after sexual offense
  taxonomy_refs: []
  basis: After the chief’s brother has intercourse with the chief’s wife, the angry
    chief warns the Eskimo man away while breathing fire, and the camp is later seen
