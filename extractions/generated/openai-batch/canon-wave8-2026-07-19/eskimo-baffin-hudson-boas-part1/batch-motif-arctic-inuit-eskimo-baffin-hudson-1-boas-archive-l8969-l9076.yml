canonical_text:
  quote: ''
  summary: The passage gives several hunting tales. A father urges his fleet-footed
    son to pursue three bears; after receiving a harpoon, the boy outruns the sledges,
    evades the bears, and kills all three. Nipatchee, a caribou-hunter, finds a large
    spar with stone outside and wood inside, makes hidden oversized arrows from it,
    and repeatedly kills caribou by running them down and shooting accurately. A pair
    of married brothers who prefer kayak hunting travel to a lake where caribou cross
    and obtain large quantities of skins and meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In winter near Qivitung, the floe-edge is described as one day’s drive away,
    and some Eskimo traveling by sledge see three bears on the ice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A father and his son are on one sledge; the father tells the son to run ahead
    of the sledges and try to catch the bears because the son is fleet of foot and
    a good bear-hunter.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The son initially slows and is overtaken by the sledges; the father repeatedly
    urges him to run faster and says he should learn while young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the son asks for the harpoon, the father throws it to him; the son then
    runs away sideways from the sledges, runs ahead, and passes the sledges very rapidly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The son reaches the three bears; the bears attack him, he jumps over them,
    and he kills all three before the sledges arrive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the bear hunt, people ask what the boy did to his knees to run so fast;
    he replies that his knees are light, and the men later tell their wives how he
    killed the bears.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nipatchee hunts caribou beyond Padli and discovers a large spar described
    as stone on the outside and good wood on the inside.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nipatchee regularly takes wood from the spar, makes very large arrows with
    roughly cut caribou-antler points, and keeps the arrows hidden from other people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Other hunters find oversized arrow-shafts and report that they are too large
    to be used by Eskimo; Nipatchee says that they may be his and that he lost one
    while ptarmigan-hunting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nipatchee pursues caribou on foot and runs close enough to shoot them with
    arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In later hunting, one of Nipatchee’s arrows passes through two caribou, and
    he kills many caribou one after another; witnesses say he is exceptionally swift
    and never misses a shot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Niutang in Kingnait, two married brothers do not join the other men in
    caribou-hunting and are known for preferring kayak hunting.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The two brothers travel by kayak, carry the kayaks over land, watch caribou
    crossing a lake, and obtain enough skins and meat to make piles compared to large
    winter houses.
  category: sequence
  evidence_refs:
  - ev:8
