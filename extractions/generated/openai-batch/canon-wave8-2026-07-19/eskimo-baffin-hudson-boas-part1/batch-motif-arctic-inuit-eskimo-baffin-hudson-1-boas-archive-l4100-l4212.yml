  summary: The passage describes a Nugumiut autumnal festival with masked figures
    representing supernatural beings, followed by birth and death regulations attributed
    to early beings. It records protective amulets for children, birth and postpartum
    taboos concerning seals and animal souls, burial practices, grave implements for
    the dead person's soul, and taboos about clothing darkened by the breath of the
    dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nugumiut of Frobisher Bay celebrate the autumnal festival with three masked
    persons who represent supernatural beings.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ekko and Ekkotow first walk around the huts, are led into the dancing-house,
    and jump violently while moving.
  category: sequence
  evidence_refs:
  - ev:1
