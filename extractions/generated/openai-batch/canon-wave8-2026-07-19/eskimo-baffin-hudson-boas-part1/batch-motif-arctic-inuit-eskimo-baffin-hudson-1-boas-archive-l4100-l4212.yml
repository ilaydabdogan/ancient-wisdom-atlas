  text: Akkoolookjo and Omernetoo are said to have given advice in the early times
    of the world about customs people would need to obey when numerous.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Omernetoo prescribes wolf teeth and a bear-tooth clasp as amulets attached
