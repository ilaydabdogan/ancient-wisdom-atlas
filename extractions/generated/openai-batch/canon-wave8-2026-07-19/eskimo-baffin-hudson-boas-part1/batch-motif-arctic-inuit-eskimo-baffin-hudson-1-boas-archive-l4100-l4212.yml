  text: Ekko carries a kayak-scraper, pretends to strike people, lowers his head as
    if to butt them, and people run away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the people have been driven out of the dancing-house, the angakut undress
    Ekko and Ekkotow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Noonagekshown carries a spear, has a drag on his back, is bound with ground-seal
    lashings, has many objects hanging from his dress, and has a dog-skin-covered
    face.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Noonagekshown appears in spring and autumn, brings health to the sick, fair
