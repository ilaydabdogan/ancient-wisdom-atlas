  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pregnancy and postpartum rules restrict eating certain seal parts, touching
    seal meat, visiting, and clothing until specified times after birth.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: After a death, the body is buried at once; the preparer uses rabbit fur in
