canonical_text:
  quote: ''
  summary: The passage first describes Rating and Atchina returning by boat at night
    to retrieve forgotten weapons, finding the quiver in the tide and a skull under
    water, then leaving while enemies pursue. In the following tales of angakut, the
    shaman Ashewaahallow sends her soul down to Sedna during famine and reports a
    promise of two young whales, which arrive. Further episodes describe Ningiu, a
    wise and powerful man, thwarting would-be killers, causing death by a wish, reviving
    a dead hunter by a wish, directing hunters to caribou meat, and warning Kudlu
    not to inquire about beings he might see.
  language: English
  quote_policy: summarized
