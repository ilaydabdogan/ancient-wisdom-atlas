  text: After taking the quiver, Rating saw a skull at the bottom of the water and
    told Atchina that he thought he would live for some time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rating and Atchina reached their tent, continued without sleeping, and were
