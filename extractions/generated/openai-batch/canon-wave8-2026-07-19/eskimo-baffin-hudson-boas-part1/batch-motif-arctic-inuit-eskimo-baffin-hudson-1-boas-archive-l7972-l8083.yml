  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: During near-starvation, the people asked Ashewaahallow to visit Sedna; after
    incantations, her soul went down to Sedna and later returned to her body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ashewaahallow reported that Sedna had promised to send two young whales, one
    without a tail, when the weather became calmer.
