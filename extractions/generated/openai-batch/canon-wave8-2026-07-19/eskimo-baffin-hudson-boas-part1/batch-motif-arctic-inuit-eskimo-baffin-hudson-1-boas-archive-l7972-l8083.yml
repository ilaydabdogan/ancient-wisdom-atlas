  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: One would-be attacker had hidden a knife; after the strangers left, Ningiu
    wished that the man who wanted to kill him were dead, and the man soon became
    sick and died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The dead man's friends suspected Ningiu had bewitched him, confronted Ningiu,
    heard his account, and left without taking vengeance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: On a later hunt, Ningiu watched two men through a fissure under a large boulder;
    one died after seeing him, the other nearly fell, and Ningiu laughed and wished
    the dead man to arise again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Ningiu pointed in several directions and said there was plenty of caribou
