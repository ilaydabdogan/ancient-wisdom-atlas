canonical_text:
  quote: "“The boy was transformed into a young seal”"
  summary: 'The passage ends one tale with a man finding his wife, child, and an old
    man, who use a feather chest and become birds; the man attacks his fleeing wife
    and eggs fall from her body. A new tale about Kiviuq begins: a poor boy bullied
    for his sea-gull-skin shirt is avenged by his angakok grandmother, who transforms
    him into a seal that lures villagers to sea, where a gale destroys them except
    for Kiviuq, protected by a bird-skin amulet. Kiviuq reaches a reddish island,
    enters an old woman’s hut, is warned by a speaking head that she eats strangers,
    and survives her attempted attack by hiding a stone slab under his clothing.'
  language: English
  quote_policy: quoted
