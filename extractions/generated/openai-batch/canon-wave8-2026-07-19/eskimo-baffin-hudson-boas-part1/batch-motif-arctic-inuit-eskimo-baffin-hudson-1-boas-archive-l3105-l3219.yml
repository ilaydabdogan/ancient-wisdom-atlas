canonical_text:
  quote: ''
  summary: Ethnographic passage on social organization and customs among West Coast
    of Hudson Bay Inuit groups, including leadership succession, birth blessing, marriage
    practices, adoption and exchange, walrus-sharing rules, ceremonies for meeting
    strangers, contests, conflict reports, name relinquishment, killing or abandonment
    of vulnerable persons, and a belief that the spirit Nuliayoq punished a mother
    after she killed a child named Nuliayoq.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Aivilik, named men are described as attaining influence and leadership;
    Tesiaq, called Harry, succeeded his uncle as leader because of his ability.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harry was blessed at birth by his grandfather with ceremony so that he might
    become a great hunter and whaleman; skins taken by him were to be prepared by
    the best workers, and his guardian spirit was said to punish careless work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports polygamy, polyandry in several named regions, and a residence
    pattern in which a woman lives with her husband’s family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Childless married couples frequently adopt children, and one reported adoption
    involved a child given to an Aivilik family in exchange for a gun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A walrus is divided according to the order of participation in the hunt, with
    the first striker receiving tusks and a fore-quarter and other helpers receiving
    specified portions; dogs are fed while the animal is cut up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who damages another’s property unwittingly reacts differently depending
    on whether the owner minimizes the accident or expresses annoyance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Meetings of strangers are accompanied by contests in a snow house, where selected
    men exchange blows to shoulder or head until one gives in, without ill feeling.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Former contests between Netchillik and Aivilik involved each contestant pressing
    a knife point against the other’s cheek-bone and shoulder; one reported incident
    ended with a stabbing and the killer fleeing at night.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Netchillik are reported as quarrelsome and treacherous, with examples
    of domestic conflict; the author notes that these facts closely agree with customs
    and ideas in traditions collected in Greenland.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: When two people with the same name meet, one relinquishes the name and receives
    a present in return.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Orphans and aged people who become a burden may be killed; a woman near Repulse
    Bay killed her dependent child Nuliayoq and later became lame, which was attributed
    to the offense of the spirit Nuliayoq.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Among the Netchillik, sick and infirm people without prospect of recovery
    are reported to commit suicide or be hung.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: When provisions run short during travel, a woman or old person who hinders
    progress may be left walled up in a small snow hut, with the party returning if
    it later reaches provisions.
  category: sequence
  evidence_refs:
  - ev:13
