  confidence: medium
  cautions: The passage is ethnographic rather than mythic; it does not describe a
    miraculous birth, only a ceremonial blessing at birth.
- id: motif:2
  label: Guardian spirit punishes violation of handling rules
  taxonomy_refs:
  - divine_judgment
  basis: Harry’s guardian spirit is said to become angry at careless skin preparation
    and to cause the careless woman’s death.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage reports a belief or warning rather than narrating an actual
    punishment event.
- id: motif:3
  label: Ritualized contest at encounter with strangers
  taxonomy_refs: []
  basis: Meetings of strangers are described as accompanied by contests in which representatives
    exchange blows, and former Netchillik-Aivilik contests used knife pressure.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No available taxonomy reference fits this pattern exactly without over-interpretation.
- id: motif:4
  label: Regulated exchange of persons, names, and game shares
  taxonomy_refs:
  - sacred_exchange
  basis: The passage includes a child exchanged for a gun, a namesake relinquishing
    a name for a present, and formal apportionment of walrus parts by hunting role.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage presents these as social customs; the taxonomy label is broader
    than the literal evidence and should be reviewed.
- id: motif:5
  label: Offended namesake animal-ruler spirit causes bodily affliction
  taxonomy_refs:
  - divine_judgment
  basis: After the mother kills the child named Nuliayoq, she becomes lame in the
    leg and foot, and this is believed to be because the spirit Nuliayoq was offended.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage reports the belief but also notes that the killing coincides
    with practices among other Eskimo tribes; interpretation as judgment is based
    on the stated offense and affliction.
- id: motif:6
  label: Exposure or killing of vulnerable persons under burden or scarcity
  taxonomy_refs: []
  basis: The passage reports that orphans and aged people who burden the tribe may
    be killed, incurably sick or infirm people may commit suicide or be hung, and
    hindering travelers may be walled up in a snow hut during food shortage.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage frames this as social practice under hardship, not as ritual
    sacrifice or mythic death-rebirth.
- id: motif:7
  label: Return for an abandoned person after provisions are renewed
  taxonomy_refs:
  - return
  basis: A traveling party that succeeds in reaching provisions may return for the
    person left walled up in a snow hut.
  evidence_refs:
  - ev:13
  confidence: low
  cautions: The taxonomy reference is weak because the passage describes a practical
    return by the party, not a mythic return motif.
