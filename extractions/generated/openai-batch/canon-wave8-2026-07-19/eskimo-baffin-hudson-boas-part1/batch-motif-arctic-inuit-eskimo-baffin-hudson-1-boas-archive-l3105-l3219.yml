candidate_motifs:
- id: motif:1
  label: Birth blessing for future hunting power
  taxonomy_refs:
  - sacred_birth
  basis: Harry is blessed at birth with ceremony so that he may become a great hunter
    and whaleman, and his later hunting products are placed under guardian-spirit
    sanction.
  evidence_refs:
