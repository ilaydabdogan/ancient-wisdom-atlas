  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The men came intending to kill the boy, shot their arrows at him, and he dodged
    them by jumping about like a raven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the men had spent their arrows, the boy moved between them and the village
