canonical_text:
  quote: ''
  summary: The passage closes one tale in which women report insect hospitality and
    an old woman's rejuvenation by removal of old skin. It then tells of a murdered
    man's abandoned pregnant widow, her son raised on ravens, the son's raven-like
    traits and revenge against his father's killers, and his later taking a wife.
    A following tale begins with Attongey transforming colored stones into sledge
    dogs and later causing two old women to act like ravens after comparing them to
    ravens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women told other people that insects had given them food, invited them to
    live with them, and that an old woman's old skin had been bitten so it would fall
    off and make her younger-looking.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a quarrel at Niutang, people murdered a man who had not intended to
    kill anyone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The murdered man's widow lived alone, depended on small gifts of food, was
    pregnant, and was left behind when the people moved to Katsag.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the widow's child was born, many ravens entered her hut; she shut the
    door and killed them, including one raven that became smaller and smaller while
    trying to escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The widow put the dead ravens outside to freeze, later repeated the same act
    when more ravens entered, and she and the child lived on raven meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy grew up very quickly and soon became able to go sealing.
  category: attribute
  evidence_refs:
  - ev:4
