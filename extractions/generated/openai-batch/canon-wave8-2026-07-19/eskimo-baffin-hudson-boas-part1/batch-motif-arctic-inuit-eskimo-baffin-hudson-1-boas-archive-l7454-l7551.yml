  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The boy took one woman he liked best for his wife and went to live in Niutang.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Attongey made harnesses and went to a place with red, white, brown, and speckled
