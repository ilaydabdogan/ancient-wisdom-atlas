literal_observations:
- id: obs:1
  text: Among west-coast Hudson Bay people, Nuliayoq is described as taking the place
    of Sedna, as mistress of both sea animals and land animals, and as withholding
    animals when offended.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a possible distinction between two deities named Nuliayoq,
    one controlling land animals and the other sea animals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nuliayoq is said to punish taboo transgressions near Wager River by waiting
    at the inlet entrance and upsetting boats and kayaks; accidents, misfortunes,
    bad weather, starvation, and lightning strikes may be attributed to her wrath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Thunder-storms are attributed to three sisters: Kadlu makes thunder, Ignirtoq
    makes lightning, and an unnamed third sister makes rain.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: During thunder-storms, women make offerings of white-tanned seal-skin with
    a needle pushed into it and pieces of ivory, depositing them away from the village
    for the sisters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Earthquakes or subterranean noises are attributed to angry deities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Moon is thought of as male, watches human actions, and is said to like
    industrious people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Souls of the dead are said to go either to the lower world, the warm abode
    of Nuliayoq and Anautalik, or to heaven.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Souls of those who have transgressed taboos go to the lower world and are
    made unhappy by Anautalik; souls of the good and of suicides go to heaven.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In heaven, souls play football with a living walrus skull, and the Northern
    Lights are identified as spirits above at play.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The dead may choose to return and be born again; two examples are given in
    which dying men announced future births and newborn children were identified as
    their return.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A reincarnated child’s improper treatment after death is said to have enraged
    the dead man and prevented his daughter from having more children.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage says local taboos are similar to those in Cumberland Sound and
    many relate to the Nuliayoq legend.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Confession of taboo transgression is described as atoning for the committed
    sin among both northwest Hudson Bay and Cumberland Sound Eskimo.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:15
  text: A famine in 1883 is said to have been attributed to a woman who concealed
    a miscarriage and continued to eat seal meat; after her death, Nuliayoq was pacified
    and food became abundant.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: After a bear or ground seal is killed, work must not be done for three days;
    women must not comb their hair; bedding must not be disturbed until late on the
    day a ground seal is caught.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: After a seal is brought into the snow house, melting snow is dripped into
