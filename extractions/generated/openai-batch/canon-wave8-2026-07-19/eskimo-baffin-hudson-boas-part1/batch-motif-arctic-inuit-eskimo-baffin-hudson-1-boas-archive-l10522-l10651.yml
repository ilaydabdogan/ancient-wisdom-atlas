candidate_motifs:
- id: motif:1
  label: animal origin from an underground opening
  taxonomy_refs: []
  basis: Caribou first emerge from a hole in the ground made by a spirit’s spear.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives this as the origin of caribou but does not name a broader
    taxonomy category for underground animal origin.
- id: motif:2
  label: uncontrolled release of game animals by a human witness
  taxonomy_refs: []
  basis: A secret follower opens the caribou-hole and fails to close it, causing all
    caribou to spread over the earth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No explicit prohibition is stated; the release follows hidden observation
    rather than a directly named taboo.
- id: motif:3
  label: day and night established by animal dispute
  taxonomy_refs:
  - duality
  basis: Fox and Raven prefer opposite conditions, darkness and daylight, and settle
    that the two will alternate.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage is brief and does not add further cosmological mechanics.
- id: motif:4
  label: sibling pursuit and ascent into Sun and Moon
  taxonomy_refs:
  - sibling_pair
  - ascent
  - duality
  basis: A brother pursues his sister; they rise to the heavens, becoming Moon and
    Sun, and the Moon continues pursuing the Sun.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage presents more than one Sun-Moon notice; extraction groups
    only the shared sibling relation and celestial transformation.
- id: motif:5
  label: Moon takes a mortal woman as wife
  taxonomy_refs:
  - divine_beloved
  basis: The Moon descends on a sled, calls Tootocuttuke, and she goes with him to
    become his wife.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy term is approximate because the passage identifies the figure
    as the Moon rather than explicitly as a deity.
- id: motif:6
  label: exchange and restoration of animal body parts
  taxonomy_refs:
  - sacred_exchange
  basis: Musk-ox and Walrus exchange horns and tusks, then return them when the borrowed
    tusks prove unsuitable in cold weather.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The exchange is literal and etiological, but the passage does not explicitly
    call it sacred.
- id: motif:7
  label: outcast sibling transforms into man-eating black bear
  taxonomy_refs:
  - shapeshifter
  - sibling_pair
  basis: An excluded woman predicts becoming a black bear, instructs her brother how
    to be recognized, and devours all others while sparing him.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The tale states her expectation of transformation and then describes her
    attack; it does not narrate a detailed transformation moment.
- id: motif:8
  label: corpse-stealing bear in human form and feigned-death infiltration
  taxonomy_refs:
  - shapeshifter
  basis: A black bear steals bodies from graves, appears in the form of a person,
    and carries away a living man who is pretending to be dead.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage ends before the full outcome of the revenge plan is given.
