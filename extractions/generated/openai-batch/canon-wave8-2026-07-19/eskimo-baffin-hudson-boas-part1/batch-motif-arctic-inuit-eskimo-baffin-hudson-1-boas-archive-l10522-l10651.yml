canonical_text:
  quote: ''
  summary: A sequence of West Coast of Hudson Bay tales explains the origin and release
    of caribou, the alternation of day and night, the ascent of sibling figures into
    Sun and Moon, the Moon taking Tootocuttuke as wife, an exchange of horns and tusks
    between Musk-ox and Walrus, the origin of a black bear from an outcast woman,
    and the beginning of a tale in which a black bear in human form removes corpses
    from graves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spirit marries a woman, does not need food, and is told by village men that
    he must hunt and provide for his wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit uses a spear to make a hole in the ground; a caribou jumps out,
    and the spirit kills it and takes it home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man secretly follows the spirit, later opens the hole, fails to close it
    quickly, and all the caribou come out and spread over the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The spirit becomes angry at the caribou, kicks them in the forehead so that
    it is flattened, and tells them to run away and always fear man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Fox and Raven quarrel because Raven wants continuous daylight while Fox wants
    darkness; they settle that light and darkness will alternate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A sister lights the stick used to trim the lamp and runs into the dark; her
    brother lights a knife, thinking it is a stick, and pursues her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pursuing siblings rise higher and higher until they reach the heavens;
    the sister becomes the sun and the brother becomes the moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The light on the brother’s knife goes out, explaining why the moon has no
    warmth; he remains in pursuit of his sister.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Moon comes down on a sled, calls Tootocuttuke by name, tells her to bring
    her games, and takes her away to become his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sun and Moon are described as sister and brother, and dark spots on the Moon’s
    face are attributed to his wish to rub noses with his sister when young.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Musk-ox and Walrus exchange horns and tusks, but return them in spring because
    the tusks crack in cold weather and bother Musk-ox.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: An orphaned woman who has not obeyed tribal laws is excluded from the village,
    lives alone in an old hut, lacks clothing, and grows hair all over her body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The woman tells her brother she thinks she will become a black bear, instructs
    him to mark his hut with sticks, and says she will devour the other people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the people move, the brother marks his house with sticks, and the transformed
    woman attacks and devours everyone except him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In another tale, bodies recently buried are found missing, and a watcher sees
    a black bear take a body from a grave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A widower sees the same black bear carry off his wife’s body and plans revenge
    by pretending to be dead and having a friend cover him with stones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The black bear appears in the form of a person, opens the grave, puts a line
    around the supposed body, and drags the living man toward its home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: At the bear’s home, the bear places the man against the wall to thaw before
    cooking, lies down to sleep, and the man sees the bear’s wife go for water and
    notices a hatchet.
  category: sequence
  evidence_refs:
  - ev:9
