canonical_text:
  quote: ''
  summary: The passage gives recorded versions of Itiqtaujaq's song and dialogue,
    followed by short translated tales about girls crushed by a rock and transformed
    into sea-pigeons, a grandmother who becomes a loon while following her grandson's
    kayak, and ball-songs with animal and transformation imagery.
  language: English translation and glosses with Inuit-language text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collector introduces versions of Itiqtaujaq's song and parts of his dialogue
    with Eqaluqdjuq and people on an island; the first version is from Cumberland
    Sound.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song speaker repeatedly describes going northward toward the birds' country
    and a hole of the sky or world.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: The Cumberland Sound song version lists difficult or unavoidable places and
    objects along the route, including a lamp, pieces of blubber, a large boiling
    kettle, biting beings glossed as aktlaq, and other unclear obstacles.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the dialogue, speakers ask where someone came from, threaten chopping with
    an axe if approached from behind, instruct a kayaker to keep eyes shut to avoid
    capsizing, and refer to a mother and father coming down or being left at a great
    distance near the sky's hole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Davis Strait version sung by an old woman repeats northward travel toward
    the sky hole and birds' country, with the speaker tired but needing to continue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two girls carrying infants in their hoods stand by a cliff; the cliff falls,
    crushes them to death, covers them with stones, and the two child-carriers become
    sea-pigeons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A grandmother shouts for her grandson to paddle hard after he is driven from
    land in his kayak; while following him she becomes a loon and continues crying
    from grief because he cannot return to land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A ball-song describes an entity above coming down and going up again, a walrus
    head turning, a partner ball described as a little bird, the bird going to a heap
    of stones, faint singing, summer fish-eating, and a fat caribou buck lying down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another ball-song describes a light partner going down as a little bird, going
    to a heap of stones, turning into a rabbit, and escaping from under the speaker.
  category: action
  evidence_refs:
  - ev:8
