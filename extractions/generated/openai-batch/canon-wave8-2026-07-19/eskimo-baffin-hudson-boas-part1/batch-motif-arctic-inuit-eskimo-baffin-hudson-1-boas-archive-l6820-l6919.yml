canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving Tornit, Hawks, Eskimo visitors,
    Adlet, and a tuneq: Hawks are described as dangerous people who became birds of
    prey; a Tornit angakok soils an Eskimo visitor’s new jacket and treats the visitor’s
    lack of anger as proof of peaceful intent; a Tornit son kills a bear approaching
    Eskimo sealers amid differing hunting-ownership customs; a travelling man kills
    Adlet children and escapes pursuit in a snowstorm; the travelling couple later
    meet ordinary people and then a powerful tuneq who stores walrus meat and warns
    against summer heat and mosquitoes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tornit are said to have lived in Saumia near another people called Ketch-wey-ews
    or Ken-wey-ews, identified as Hawks, who had long nails and later became birds
    of prey.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great angakok among the Tornit blackened his hands on the bottom of his
    cooking pot before meeting four Eskimo returning from a caribou hunt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One of the Eskimo visitors wore a new jacket made from young seal skin with
    a white flesh side.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The angakok praised the new jacket and rubbed his blackened hands over it
    until it was darkened on both front and back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The visitors did not take offense at the blackened jacket; the Tornit regarded
    this as proof that the visitors intended no evil and invited them inside to avoid
    the Hawks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: While Eskimo were sealing at Ugjuktung, a bear approached; a Tornit father
    and son pursued it, and the son caught, carried, and killed the bear against rough
    ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tornit father said his son was stealing the bear from the people, while
    the Eskimo said they were satisfied because they had feared the bear and had not
    killed it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note states that, by Tornit custom, game belongs to the hunter who first
    sees it, while by Eskimo custom it belongs to the hunter who first wounds it near
    a vital part.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A travelling man looked into a hut, saw Adlet boys and girls playing, took
    a knife, and killed all the children except one boy who escaped to report the
    event.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Adlet pursued the man, but he outran them; a gale and drifting snow arose,
    causing the Adlet to abandon the pursuit, and some froze to death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man’s wife fled in the opposite direction during the pursuit; the couple
    met again on the third day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The couple later reached dwellings of people described as real men, were invited
    inside, but could not sleep because large lice tormented them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A tuneq and his wife lived in a large stone house; the tuneq was strong enough
    to haul a whole walrus ashore as another man might haul a small seal.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The tuneq stored walrus meat in a large stone cache for summer and advised
    the visitor not to travel then because heat and mosquitoes would kill him.
  category: speech
  evidence_refs:
  - ev:9
