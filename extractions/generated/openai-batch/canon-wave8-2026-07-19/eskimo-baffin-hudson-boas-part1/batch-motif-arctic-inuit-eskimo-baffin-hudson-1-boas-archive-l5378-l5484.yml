canonical_text:
  quote: ''
  summary: 'The passage contains several short traditions: a woman identifies her
    silent nocturnal attacker as her brother, and after a fire-lit pursuit they become
    the sun and moon; an orphan boy and an old man become stars during a chase; bear
    hunters with sledges and dogs are transferred to the sky as constellations; and
    two girls or sisters are associated with the making and control of lightning,
    thunder, rain, and thunderbolts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman lives alone in a hut; while others are in the dancing-house, a silent
    man extinguishes her lamps and compels her to cohabit with him on repeated nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman marks the silent man's left cheek with blackened fingers from the
    bottom of a pot, follows him, and sees the same marks on her own brother in the
    dancing-house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman cuts off her left breast and offers it to her brother; both light
    lamp-trimming sticks, and he follows her as she runs around the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother falls, his flame goes out, the woman's flame continues to burn,
    and the two are wafted to the sky where she becomes the sun and he becomes the
    moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Outakalawaping repeatedly taunts the orphan boy Elaakjewwakjew; after the
    boy retorts with an accusation about the old man's first wife, the old man chases
    him until both rise into the air and become stars.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bear is hunted by seven, or possibly ten, sledges and dogs; during the chase
    the men notice their feet and sledge runners rising, and they are transferred
    to the sky as constellations.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two girls, Kweetoo and Kadlu, play at night after being told by their father
    to move farther from the hut; they reject making animals because people could
    catch them and decide to make lightning instead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: One girl stamps on hollow ice and produces a thunder-like noise; the other
    urinates and makes rain, while people hear thunder, see lightning, and see rain
    without seeing the girls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kadlu and Kamaluninga are said to make thunder-storms; women give them whitened
    skin and flint, and angakut visit them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Visitors see kayak-sized lightning; the two women keep thunder from touching
    the earth, use a thunderbolt where caribou are, and are said to have stolen and
    kept a boy when young.
  category: action
  evidence_refs:
  - ev:8
