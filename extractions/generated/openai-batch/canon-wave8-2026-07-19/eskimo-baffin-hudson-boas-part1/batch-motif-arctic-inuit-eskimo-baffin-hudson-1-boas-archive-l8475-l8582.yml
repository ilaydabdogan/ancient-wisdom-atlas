canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Analookashaw accuses Pupewalow
    of killing her son, threatens that her soul will enter a bear, and after death
    a bear kills Pupewalow before being killed and disabled by his sons. It then gives
    a tale of a neglected old woman who makes bone faces or heads to frighten or kill
    unkind neighbors. The passage ends with the beginning of a tale about an orphan
    boy whose remark about whale skin causes an offended man to force him into the
    role of harpooneer.
  language: English
  quote_policy: summarized
