canonical_text:
  quote: ''
  summary: 'The passage contains three narrative episodes: Keyoota murders companions
    while hunters are adrift on broken ice and later the survivors conceal the deaths;
    Keyakjuak and his cousin kill Keyakjuak''s feared elder brother, after which Keyakjuak
    shows further violent anger until restrained or thwarted; Kanatchea is described
    as an angry but successful sealer who sometimes releases an old male seal because
    its face reminds him of his own anger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A walrus-hunting party from Sikosuilaq went adrift when the ice broke up.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eeachak saved himself on a high piece of ice while others jumped from one
    cake of ice to another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Keyoota stabbed Kemebiiktuak, pushed his body into the water, and later stabbed
    and killed Eeachak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sikeaksheak saw the killings, promised not to tell if they returned, was attacked
    from behind by one of Keyoota's friends, and was then killed by Keyoota.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hunters drifted for several days, reached the land-floe, returned without
    game, and said that the three missing men had separated from them or were lost
    when the ice broke up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Keyoota left the following year, the other men told what had happened.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Akudnirn, a woman had two sons; the elder was strong, feared and hated
    as a bad man, and cohabited with his mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Keyakjuak said he could throw his brother, his mother told him not to harm
    his brother, and his cousin also wished to kill the bad man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Keyakjuak and his cousin tested strength, and Keyakjuak threw his cousin down
    twice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Keyakjuak and his cousin threw the elder brother down; Keyakjuak stabbed and
    killed him, and they covered the body with stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: People said Keyakjuak's brother was calling from his grave; Keyakjuak checked
    the body, found it stiff and cold, and later told his mother that he and his cousin
    had killed him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During a ball game, Keyakjuak seized an angry opponent and intended to knock
    him against a boulder, but his cousin told him not to kill other people, and Keyakjuak
    released the man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During a caribou hunt, people disputed who had killed a buck; Keyakjuak became
    angry, dashed the caribou to pieces on rocks, and nobody then claimed it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kanatchea of Padli was described as always in bad humor, as striking his wife
    almost every day, as loved by his mother Totlaving, and as a very good sealer.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: When Kanatchea caught an old male seal, he spoke to it as a face that reminded
