canonical_text:
  quote: ''
  summary: 'A woman with a newborn boy receives caribou meat and lamp oil, which she
    identifies as gifts from the Man in the Moon. After she eats her husband''s seal
    meat, the gifts stop; she and the child die, and the passage explains the child''s
    death as caused by the dietary change. A section on dwarfs follows: a very small
    stranger kills a distant dog with a thrown knife; later Pupekalle and his son
    are attacked by small spear-throwing people, the son is killed, and Pupekalle
    later returns to kill many of them, sparing two women who claim to be real people
    rather than dwarfs.'
  language: English
  quote_policy: summarized
