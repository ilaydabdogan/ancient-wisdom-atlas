canonical_text:
  quote: ''
  summary: The passage lists seasonal and situational taboos concerning caribou, walrus,
    seal, musk-ox, bear, ducks, iron, steatite, bedding, cutting lines, menstruation,
    miscarriage, albino caribou, and certain localities. It also describes ritual
    smoke before first sealing, deposits or offerings on the ice, an offering to Nuliayoq,
    punishments attributed to Nuliayoq, and required actions at a pond near Iglulik
    and a hill in Tununirn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Work on caribou-skins and the handling of caribou meat or skins are restricted
    during the walrus-hunting season and while people live on the ice; some items
    must be taken into a snow house through a rear hole rather than the doorway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Winter seal-skins must not be worked until the seals have pups; seal-skins
    must not be worked during the caribou-hunting season, and seal-meat and caribou-meat
    must not be eaten on the same day.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:3
  text: Before the first sealing trip of the season, dried seaweed or kelp is burned
    in the snow house, clothing and harpoons are held over the smoke, the word “Mammakpoq!”
    is said, and the snow-house key-block is cut with a knife in all directions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Soon after sealing begins, a piece of white caribou-skin and a bit of thread
    are carried out and placed on the ice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Walrus tusks taken in winter must not be removed from skulls until late April,
    and work on iron is forbidden during the musk-ox hunting season; unavoidable iron
    work must be done by a woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who has eaten human flesh during famine is instructed never afterward
    to eat bear-meat because bear-meat is believed to resemble human flesh.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A person recently bereaved must not pluck ducks, steatite must not be worked
    while people live on the ice, and caribou hair must not be cut during the musk-ox-hunting
    season.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man hunting caribou in ponds from a kayak deposits small pieces of seal-skin
    under a stone as an offering to Nuliayoq.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: When Aivilik and Iglulik hunters are on the ice, bedding must not be raised
    because this is believed to make the ice crack and drift away; after the men return,
    the bedding may be raised and brushed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A line should be cut at a slant rather than straight across, which is believed
    to prevent the line from snapping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Menstruating women and women who have had a miscarriage are feared as having
    harmful contact effects and must be isolated.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A told case says a woman concealed a miscarriage; famine followed, and during
    a camp move Nuliayoq killed her and took her down to her abode.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Another case interprets a woman’s accidental leg wound as punishment for concealing
    a miscarriage, and tiredness during travel is interpreted as punishment by Nuliayoq
    for a taboo breach.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Killing an albino or white caribou is said to bring sickness and death to
    the hunter; a hunter who killed one later died, and Nuliayoq is said to have caused
    his death because he did not repent by following dietary restrictions.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At a large pond near Iglulik, women may not look at the open pond; hunters
    hide huts from the pond, break off one antler from a killed caribou and push it
    into the ground, and a lone hunter may not eat from a caribou killed there until
    he finds company.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Travellers approaching a hill in Tununirn must turn a somersault, except old
    people.
  category: action
  evidence_refs:
  - ev:12
