canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound tales: two sisters flee
    a man who wants to marry one of them and survive by trapping caribou, using whale
    meat, and catching foxes; three brothers kill a pursuing agdlaq on slippery lake
    ice through the eldest brother''s stratagem; and three short bear-hunter episodes
    describe bears killed by dogs or arrows, with one wounded bear dying on drifting
    ice beyond recovery.'
  language: English
  quote_policy: summarized
