canonical_text:
  quote: ''
  summary: The passage contains the end of a Pupekalle episode, a story in which an
    abandoned old woman and her grandson secure food from dwarfs by making meat impossible
    to remove, a noted variant of the same dwarf episode, and the beginning of stories
    about Adlet in which human travelers encounter blind Adlet elders, Merkinook,
    and a hostile dog-like Adlet community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pupekalle remains awake while his friend sleeps; a pregnant woman rises near
    morning and swings a lance at Pupekalle, trying to kill him, but the lance strikes
    the roof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pupekalle kills the pregnant woman with a knife, the child falls from her
    womb, and he also murders another woman who says she is not like the first; in
    the morning he and his friend take desired goods from the huts and go home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman and her grandson live alone after being deserted by their people;
    dwarfs enter the dark hut, think it is deserted, bring in walrus meat from their
    sledge, make beds, and sleep.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the dwarfs become quiet, the old woman tells her grandson to go to the
    porch, touch his tongue, draw his finger along the meat and ground, and avoid
    making noise; the boy does so and returns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At dawn a dwarf woman finds that a piece of meat has become too heavy to lift;
    her husband tells her to leave it, and the old woman and boy gain enough food
    for a long time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Peck's recorded variant, an old woman tells her grandson to spit on one
    of a dwarf's meat bags; the bag sticks to the ground, and the dwarf leaves it
    behind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A traveling man and wife among the Iglumiut find many huts with no visible
    people; a box full of beads on one hut roof breaks and scatters when the man touches
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The travelers find a blind old woman whose nostrils twitch; she says she smells
    a man and repeatedly calls her son Merkinook despite being told to stop.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Merkinook arrives in a kayak with many Adlet; the Adlet do not wear shoes,
    and Merkinook is their chief.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Adlet want to kill the two strangers, howl outside like dogs, and push
    whaling-lances through the window; Merkinook fastens the door and breaks the lance
    points with a stone until the attackers desist.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Merkinook says his people need sleep and later accompanies the visitors on
    their way; when the Adlet return, the visitors see them moving very fast like
    running caribou, and the passage says the Adlet cut part of their insteps to increase
    speed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a second Adlet story at Aggo, a caribou-hunting man and wife enter a hut
    guarded by an old blind Adla; he howls like a frightened dog, says he smells a
    man, asks whether the hunter has a knife, and is relieved when told the hunter
    intends no harm.
  category: sequence
  evidence_refs:
  - ev:9
