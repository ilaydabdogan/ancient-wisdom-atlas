canonical_text:
  quote: ''
  summary: 'The passage describes Cumberland Sound material culture: forms of women’s
    knives and scrapers, stone scraper hafting, needle-cases, collected knots and
    splices, line swivels, and methods of mending or joining sticks, bones, boards,
    and pots.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that a modern scraper or woman’s knife form developed from
    an earlier form, with wooden handles shaped for the fingers and blades made of
    tin or long bone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scraper made from a narwhal jaw is described as exceptional, while stone
    scrapers are described as variable in size and form and probably used for softening
    skins rather than cleaning them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stone scraper blades are described as hafted in wooden handles, sometimes
    cemented in, tied with thongs through grooves, or later fastened with wire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The most characteristic handle form is described as having lower grooves for
    the third and fourth fingers, a side hole for the thumb, and upper depressions
    for the first and second fingertips.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Needle-cases are generally described as tubes through which a piece of skin
    is drawn, with needles pinned to the skin; ivory examples include suspension notches
    or perforations.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Captain Mutch collected knot types, and Prof. Otis T. Mason named them for
    the author.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author identifies a little slit near the end of a line, through which
    the end is drawn to form a toggle, as a notable feature of the knots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The described knots include end loops, running loops, and several forms of
    splices.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Swivels are used to prevent lines from becoming kinked; the simplest type
    is a perforated bar holding an ivory nail and line knots.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The crossbar of a swivel is often carved in the form of a seal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mending and joining methods include slanting cuts, straight joints, drilled
    holes, grooves, lashings, pegs, and sewing with whalebone, sinew, or thong.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The same joining method used for split boards is also used in mending broken
    pots.
  category: relationship
  evidence_refs:
  - ev:5
