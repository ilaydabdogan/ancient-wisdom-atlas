canonical_text:
  quote: ''
  summary: 'The passage describes sealing and whaling equipment: seal-drags, toggles,
    buckles, wound-closing pegs and plugs, an ear-trumpet for use at seal-holes, the
    winter seal-hole hunting setup, kayak harpoon floats and drags, and an old whaling-harpoon
    assembly. It also notes several animal-shaped or animal-decorated implement forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A thong ring with a buckle fastens several seal-hunting implements to a line
    coil.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Short straps with toggles are pulled through the lower jaw of a seal when
    the animal is dragged from its hole to a sledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A case with ivory pegs for closing the wounds of the animal is attached to
    the same ring as the seal-drag straps.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buckle eyes are described as oval, triangular, or square with a stem; more
    elaborate examples have notched or etched rims.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Toggles are generally notched at the ends, perforated for a strap knot, and
    are often given the forms of seals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cases for wound-closing pegs are mostly wooden; another specimen uses a leather
    case filled with moss, and grooved wooden plugs may be used instead of pegs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: An ear-trumpet used at a seal-hole is made from a split, hollowed walrus tusk
    tied together and an ear-piece drilled as a double funnel.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A winter seal-hole hunter sits on a snow-block seat, rests his feet on bear-skin,
    and places his harpoon on two supports set into the snow.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A kayak harpoon line has a large seal-float and a drag attached to hinder
    the seal’s movements and prevent the dead seal from sinking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The seal-float is made from a whole sealskin altered to be airtight with closures,
    buttons, a blow-piece, and a wooden stopper.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old whaling-harpoon has a wooden shaft, whale-bone foreshaft, two-part
    harpoon-point, ground-seal-hide thong, bone handle, seal-floats, and a drag.
  category: object
  evidence_refs:
  - ev:7
