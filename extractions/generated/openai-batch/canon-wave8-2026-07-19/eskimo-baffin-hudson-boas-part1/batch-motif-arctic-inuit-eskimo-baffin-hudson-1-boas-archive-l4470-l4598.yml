canonical_text:
  quote: ''
  summary: 'The passage records traditions and customs from Hudson Bay, Iglulik, Aivilik,
    Netchillik, and related Inuit groups: a story explaining Marble Island as ice
    turned to stone; winter and seasonal sun customs involving lamps, wicks, string
    games, cup-and-ball, and new fires; amulets and hunting charms involving sewn
    materials, animal parts, feathers, stones, hair, and songs; omens concerning storms
    and sneezing; and beliefs about the tupilak monster, including its making from
    snow or a bear skull and its possible return against its maker.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marble Island is described as formerly a low black rock where ice piled up;
    a widow looked out to sea, the ice became displeased, and the ice was turned into
    stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hole said to have been melted by water through the ice is reported as visible
    in the rock at the time of the account.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visitors to Marble Island in winter and summer crawl up on their elbows and
    knees after approaching or landing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the first return of the sun after winter night, children who watched for
    it run into houses and blow out lamps, then receive pieces of wick from their
    mothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In fall, while the sun is going south, cat’s-cradle is played to catch the
    sun in the string meshes and prevent its disappearance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the sun is returning, cup-and-ball is played to hasten its return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that the Nugumiut of Frobisher Bay kindle new fires at
    the winter solstice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pieces of skin or cloth sewn on under-garments by the wife of the angakok
    are used to drive away sickness and are paid for as an angakok service.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The tip of a caribou tail sewn to a coat is said to secure good luck in caribou
    hunting, and boys may have such tips sewn on their coats to make them good hunters.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: A gull feather dipped in oil-drippings from under the stone lamp is placed
    between the harpoon and harpoon-line; hunters suck the feather and spit into a
    walrus breathing hole to keep the walrus from knowing the hunter is near.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A dried newly born lemming placed inside a seal-skin float is said to prevent
    a walrus from touching it, and a dried lemming carried by a whaling boat is said
    to prevent a whale from hurting the boat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some seals are believed to break new ice over their breathing holes with a
    stone held in a flipper.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a hunter seizes such a seal’s stone, avoids looking at it, throws it over
    his shoulder, kills and lands the seal, and then picks up the stone, the procedure
    is said to ensure good luck in sealing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The seal’s stone is said to turn into pyrites when thrown over the hunter’s
    shoulder.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The hair of a successful hunter is suggested as a charm; Captain Comer gave
    a woman locks of gray hair and pieces of his shirt wristbands for her boy after
    successful whaling.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Putting a white stone into the mouth of a killed musk-ox or caribou is said
    to increase its fat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: When two caribou bucks have locked antlers, a hunter is told to remove boot-strings
    and belt so the bucks will remain until killed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: If a person born during a storm falls into the sea or gets wet with salt water,
    a storm is said to follow.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: A sick person’s sneeze is considered a sign of approaching recovery.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:20
  text: The Aivilik are said to believe in a monster called tupilak, described as
    somewhat like a bear.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:21
  text: The Netchillik of Boothia Felix are believed to make an artificial bear-shaped
    monster out of snow, insert bear’s teeth into its mouth, and cause it to come
    to life and kill the maker’s enemy.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:22
  text: The Netchillik are also said to transform a bear skull into a tupilak, but
    some people can make the tupilak turn back and destroy its maker.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:23
  text: Success in hunting is said to be obtainable by magic formulas or songs taught
    for different prey animals and transmitted within a family.
  category: speech
  evidence_refs:
  - ev:14
