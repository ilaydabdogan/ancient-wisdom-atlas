candidate_motifs:
- id: motif:1
  label: Natural substance offended and transformed into landscape stone
  taxonomy_refs: []
  basis: The passage explains Marble Island through ice that becomes displeased at
    being gazed upon and turns into stone, leaving a visible feature in the rock.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives a brief etiological account without further narrative
    context or explicit ritual interpretation.
- id: motif:2
  label: Ritualized crawling approach to a marked island
  taxonomy_refs: []
  basis: Visitors to Marble Island crawl on elbows and knees in both winter and summer
    approaches.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the behavior but does not explain its meaning.
- id: motif:3
  label: Seasonal sun-return rites with fire and game actions
  taxonomy_refs:
  - seasonal_cycle
  basis: The sun’s return is marked by extinguishing lamps and gift wicks, while games
    are used to prevent the sun’s disappearance or hasten its return; new fires at
    winter solstice are also reported.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The author cautiously says this is the only evidence found of what might
    be called sun or fire worship; the passage does not present a detailed theology.
- id: motif:4
  label: Garment amulets against sickness and for hunting luck
  taxonomy_refs: []
  basis: Sewn skin or cloth drives away sickness, and caribou-tail tips sewn on coats
    secure caribou-hunting luck and train boys toward becoming hunters.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The term amulet is used in the passage, but exact ritual procedures are
    limited.
- id: motif:5
  label: Animal-part and oil charm concealing hunter from prey
  taxonomy_refs: []
  basis: A gull feather dipped in lamp oil and used with spitting into a walrus hole
    is said to prevent the walrus from knowing the hunter is nearby.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage records the practice and stated effect but not an explanatory
    myth.
- id: motif:6
  label: Dried small animal protecting hunting gear or boat from large sea animals
  taxonomy_refs: []
  basis: A dried newborn lemming inside a float prevents walrus attack, and a dried
    lemming carried by whaling boats is said to prevent whale harm.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The footnote provides additional museum evidence but does not give a full
    narrative source.
- id: motif:7
  label: Captured animal-held stone becomes a luck charm
