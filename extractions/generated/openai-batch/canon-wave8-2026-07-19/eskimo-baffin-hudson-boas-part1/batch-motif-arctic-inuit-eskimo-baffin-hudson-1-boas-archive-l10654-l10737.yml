canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Aian escapes a woman who
    becomes a bear by raising magical barriers, followed by a brief note on children
    formerly being found rather than born, an abstract of the Qaudjaqdjuq legend involving
    a drift-away boy aided by the Man in the Moon and avenged through three bears,
    and the opening of a tale about village children disappearing.
  language: English
  quote_policy: summarized
