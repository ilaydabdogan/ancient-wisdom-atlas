canonical_text:
  quote: ''
  summary: The passage describes Cumberland Sound household containers, skin- and
    clothing-related implements, clothing styles for men, women, girls, and infants,
    garment ornamentation, games, dice, and ivory or wood carvings. It also notes
    several cross-regional similarities involving backscratchers, Labrador and Savage
    Island women’s jackets, a Central Eskimo button, and carvings from other eastern
    Eskimo tribes.
