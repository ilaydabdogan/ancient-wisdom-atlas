canonical_text:
  quote: ''
  summary: Qaudjaqdjuq is humiliated in a stone dancing-house by villagers who make
    him empty a chamber-pot and hang him by the nostrils. The Man in the Moon helps
    him after the villagers wall up the doorway, reviving a dead ermine that lures
    people away and opens a path under the stones. Away from the village, the Man
    in the Moon whips Qaudjaqdjuq six times, causing him to grow into a large, strong
    man. After three bears are summoned to the village, Qaudjaqdjuq kills the bears
    and then kills many villagers while recalling their earlier mistreatment. He takes
    two women as wives; one is injured for being slow, and the other develops a squint
    from watching fearfully.
  language: English
  quote_policy: summarized
