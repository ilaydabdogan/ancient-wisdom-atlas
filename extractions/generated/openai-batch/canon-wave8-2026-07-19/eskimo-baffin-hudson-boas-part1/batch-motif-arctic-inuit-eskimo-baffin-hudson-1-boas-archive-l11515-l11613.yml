canonical_text:
  quote: ''
  summary: 'The excerpt contains the end of a tale about Armuckjuark and Artinarkjuark:
    their wives comply with plotters, Armuckjuark is killed, Artinarkjuark escapes
    wounded, is hidden and healed by his parents, returns alive, rejects one wife,
    kills two attackers, and leaves with the other wife. It then gives a tale in which
    a man encounters a hairless spirit in an abandoned dancing-house, escapes, and
    becomes a great angakok. It ends with an animal tale in which Bear deceives Owl
    by pretending to be dead and kills him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While gathering moss, the wives see people who say they intend to kill Armuckjuark
    and Artinarkjuark and ask the women to put stockings out from under the tent;
    the women return, do not warn their husbands, and put the stockings out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night attackers collapse the tents and try to stab the people inside; Armuckjuark
    crawls under the fallen tent carrying tent and men along before he is killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the attack on Artinarkjuark, one attacker pities him and shouts that
    Armuckjuark is coming, causing the attackers to jump up and allowing Artinarkjuark
    to escape wounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Artinarkjuark wades in a stream to cover his tracks, travels to his parents,
    and receives wound treatment and new clothing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When pursuers arrive, Artinarkjuark’s mother hides him on the ground under
    a covering; his parents deny seeing anyone, invite the pursuers to rest, feed
    them, and the pursuers leave believing him dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After his wounds heal, Artinarkjuark stays with his parents hunting, makes
    beautiful clothing for himself and for a woman, and returns to his village in
    winter, where he is recognized.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man who had stabbed Artinarkjuark had carried a charm as protection against
    Artinarkjuark’s spirit; when he sees Artinarkjuark alive, he drops the charm secretly.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Artinarkjuark calls his wives; one comes quickly, and he tears up her old
    duck-skin suit and gives her the beautiful clothing he made, while he rejects
    the other woman because she did not come at once.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Artinarkjuark challenges two men who had stabbed him, kills both, and leaves
    the village with his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the tale of the dancing-house spirit, people have abandoned a village and
    built another nearby; at night two men go to the dancing-house in the old village,
    and one begins to enter while the other stays outside.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The entering man speaks as he feels a foot, leg, thigh, body, arm, and head;
    he finds no hair, and the spirit says it has no hair while trying to seize him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The man escapes through the window, tells his companion what happened, and
    from then on is a great angakok.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: In the animal tale, Owl watches a Lemming hole when Bear approaches; Owl and
    Bear exchange questions and insults about each other’s habits and appearances.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:14
  text: Owl fears Bear and flies a little away; Bear then pretends to be dead, Owl
    comes near, and Bear catches Owl in his mouth and kills him.
  category: sequence
  evidence_refs:
  - ev:14
