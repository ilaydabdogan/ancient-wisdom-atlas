canonical_text:
  quote: ''
  summary: 'The passage contains several narrative episodes: dangerous men are killed
    and hidden under ice, an orphan named Emataloo grows strong and dominates his
    foster-parents before being lost on broken ice, a maltreated woman flees toward
    her brother and is rescued after sheltering in a fox-trap, a husband kills his
    wife, a grieving father is killed before he can kill another, and relatives of
    a murdered man travel to avenge him despite warnings about pack-ice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koomungaping and his friend pursued a fleeing man; the friend killed him with
    arrows, and the bodies were pushed under the groundice where Ooryew's body had
    been placed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the deaths, the people slept quietly and said they were pleased because
    they no longer feared the three bad men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A married couple in Akudnirn brought up Kutchaping and the orphan boy Emataloo;
    the children gambled together, and Kutchaping later went to visit relatives at
    a distant place.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Emataloo repeatedly challenged his foster-father to wrestling contests; he
    was first thrown, later became nearly equal, and eventually threw his foster-father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After throwing his foster-father into the place where blubber and meat were
    kept, Emataloo cohabited with Atalee, and the foster-father feared him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Emataloo later threw both foster-parents into the blubber-and-meat storage
    place and thought that this was revenge because they had shown him no mercy when
    he was weak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Emataloo said he intended to visit Kutchaping, pull off her clothes, and tear
    her to pieces with a hook in front of all the people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: While men were sealing, the ice broke up and hunters went adrift; Emataloo
    and many companions were lost, while his foster-father and a few others reached
    shore.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman from Aggo, badly treated by her husband and lacking food, left secretly
    to seek her brother near Padli; after a long walk she became thin and faint and
    entered a fox-trap to wait for someone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Two boys came to the fox-trap, misunderstood the woman's cries, and told her
    that if she were human she could follow their tracks to the huts; she reached
    the huts and was given food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Nanwalokdjua became angry after his wife Koneruakdju told him to check the
    weather himself; he injured her, beat her, and killed her.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: After Akkalow's son died, Akkalow was sad and angry and was believed to intend
    murder; Egeewaping stabbed and killed him, believing he meant to kill Unaq's husband.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: After Aako murdered Unukchea, Unukchea's brothers Unakjew and Etookshakjwen
    decided to avenge him, chose a boat route around Cape Mercy despite warnings about
    pack-ice, and continued toward Aggo.
  category: sequence
  evidence_refs:
  - ev:12
