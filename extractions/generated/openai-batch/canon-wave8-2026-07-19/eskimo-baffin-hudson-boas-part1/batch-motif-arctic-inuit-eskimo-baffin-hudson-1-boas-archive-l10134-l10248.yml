candidate_motifs:
- id: motif:1
  label: Removal of feared violent men followed by community relief
  taxonomy_refs: []
  basis: The killing and concealment of the men is followed by communal relief from
    fear of the three bad men.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The excerpt begins mid-episode, so the earlier offenses of the men are
    not included here.
- id: motif:2
  label: Orphan youth gains strength through repeated wrestling trials
  taxonomy_refs:
  - initiation
  basis: Emataloo, introduced as an orphan, repeatedly tests strength against his
    foster-father as he grows toward adulthood and becomes a sealer.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage presents contests and maturation but does not explicitly frame
    them as a formal initiation.
- id: motif:3
  label: Reversal of power over foster-parents as revenge for weakness
  taxonomy_refs: []
  basis: After becoming strong, Emataloo throws his foster-parents into a storage
    place and thinks that he is avenging their lack of mercy when he was weak.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not state the earlier acts by the foster-parents in detail.
- id: motif:4
  label: Public threat of dismemberment with a hook
  taxonomy_refs: []
  basis: Emataloo says he will attack Kutchaping, remove her clothes, and tear her
    to pieces with a hook before all the people.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a stated intention; the passage does not narrate its fulfillment.
- id: motif:5
  label: Hunters lost when sealing ice breaks
  taxonomy_refs: []
  basis: During a sealing expedition, the ice breaks up and carries hunters adrift;
    Emataloo and many companions are lost.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supernatural cause is given in the passage.
- id: motif:6
  label: Maltreated wife flees toward brother and is rescued after hunger journey
  taxonomy_refs:
  - departure
