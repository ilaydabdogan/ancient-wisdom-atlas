    own village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Padli many people are hungry; an unnamed man enters the house of Kooloome
    and his wife and sees seal meat in several places.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kooloome's wife gives the visitor cooked seal, hides him under the inner skin
