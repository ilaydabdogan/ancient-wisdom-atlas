canonical_text:
  quote: ''
  summary: 'Attongey receives and survives a prepared mixture of human and wolf brains
    with blood, then escapes a dogless community by secretly damaging their sledges
    and departing with a cup-and-ball carving. A second tale begins: a hungry visitor
    from Padli enters the house of Kooloome and his wife, receives seal meat, is hidden,
    warns Kooloome of danger from hungry people, and later discovers that the hosts
    who appeared human were bones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Attongey feeds his dogs, orders his harnesses, goes up to the huts, and enters
    one hut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old woman mixes the brains of a man and a wolf, sends her granddaughter
    to get blood, and the young girl reveals the intended use while asking for it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman mixes the blood with the brains, invites Attongey, gives him
    the mixture, and tells him to eat it all.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Attongey eats, he places the dish between his legs and returns it full;
    the old woman eats from it, tries the same action with the plate, repeatedly finds
    it empty, and dies soon after.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people at the place have many sledges but no dogs, and Attongey secretly
    cuts the lashings that tie sledge bars to runners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Attongey prepares his dog-sledge, returns to the snow house, plays cup-and-ball
