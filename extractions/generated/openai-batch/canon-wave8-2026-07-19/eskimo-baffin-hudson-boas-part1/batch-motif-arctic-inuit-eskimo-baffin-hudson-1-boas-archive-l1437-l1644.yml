canonical_text:
  quote: ''
  summary: The passage describes Cumberland Sound Eskimo material culture, including
    sledges, dog traces and harnesses, whips, snowshoes, snow-house tools, soapstone
    lamps and kettles, wooden dishes, and wooden trays. It also notes some older materials
    and incomplete specimens in Captain Mutch's collection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The modern Cumberland Sound sledge is described as wooden, with two runners,
    wooden crossbars, and a rear formed by caribou antlers with the skull attached;
    former crossbars are described as bone or antler.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stout two-part thong called pitu passes through holes under the foremost
    crossbar and fastens the dog's traces to the sledge; buttons keep it from slipping
    through the runners, and one part ends in a loop while the other has a clasp.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dog's traces are strung on the pitu by means of an ivory implement called
    the uqsim, which has a large and a small eyelet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dog harnesses are made of seal-skin or sometimes caribou-skin and include
    bights under the forelegs, straps over the breast and neck, and a line running
    from the back to the sledge.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: During sealing, a dog is sometimes taken out of the sledge to lead the hunter
    to a breathing-hole, using a two-piece trace joined by a clasp called sadniriaq.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The whip is described as heavy thong passing through a wooden handle, with
    wrapping and skin strips securing the thong in place.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Round snowshoes with wooden frames and a coarse thong network are used for
    travelling in soft snow.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Snow blocks for houses were cut with bone snow-knives; the passage also reports
    a probability that longer ivory and whalebone knives were used in olden times.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Loose snow is often placed over the base of a completed snow house, and snow-shovels
    were used for this purpose.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A bone implement illustrated in the passage is said probably to have served
    as a maul for breaking bones, frozen meat, and similar materials.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Lamp and kettle are described as soapstone objects; the large lamp used for
    cooking is crescent-shaped with a straight wick edge, and some lamps include a
    blubber receptacle.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: A very small lamp is described as burning either at the rear of the snow house
    or on the floor near the entrance.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The regional soapstone kettle has a narrow rim, wide bottom, and corner perforations
    through which suspension thongs pass.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Wooden dishes are described as having thick flat bottoms, bent wooden rims,
    pegged joints, and sometimes bone or ivory strengthening strips; large dishes
    are mostly oval and small dishes round.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Fragments indicate that trays hollowed out of solid wooden blocks were also
    used, including a fragment with an ivory edge strip and another suggesting an
    ornamental strip.
  category: object
  evidence_refs:
  - ev:13
- id: obs:16
  text: A figure caption identifies an implement for squeezing water out of skins.
  category: object
  evidence_refs:
  - ev:14
