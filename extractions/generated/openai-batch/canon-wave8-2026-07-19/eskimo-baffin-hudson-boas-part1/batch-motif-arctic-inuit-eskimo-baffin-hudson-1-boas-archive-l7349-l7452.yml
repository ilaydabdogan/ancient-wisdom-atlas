  text: The man sees a pretty young woman come from his wife’s grave, stretch a fox-skin
    outside his hut, and return to the grave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man takes the fox-skin; the woman repeatedly asks for it back and says
    it smells bad, while he repeatedly says she shall be his wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the woman consents to be his wife, the man gives the fox-skin back to
    her, and they live together in the hut.
  category: relationship
  evidence_refs:
  - ev:1
