canonical_text:
  quote: ''
  summary: The passage contains the end of a tale about a man who encounters a fox-skin
    woman associated with his wife’s grave, marries her after withholding her fox-skin,
    exchanges wives with Raven, and follows the Fox woman to a fox-hole dwelling after
    a broken promise about smell. It then begins tale 43, “The Insects,” in which
    two women are abandoned without food, receive aid from insects and an ermine that
    rejuvenates the older woman, and then go to live with insect husbands.
  language: English
  quote_policy: summarized
literal_observations:
