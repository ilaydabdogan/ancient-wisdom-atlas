canonical_text:
  quote: ''
  summary: 'The passage contains several etiological tales or tale fragments: a child
    is born without the mother being cut open and the people imitate the child’s anus
    with pegs; an elder daughter imprisoned by her father becomes an agdlaq and kills
    her parents while sparing her younger sister by a peg sign; a deserted girl turns
    herself into stone and remains audible as an echo; and death begins when an overcrowded
    floating island overturns before the waters recede.'
  language: English
  quote_policy: summarized
