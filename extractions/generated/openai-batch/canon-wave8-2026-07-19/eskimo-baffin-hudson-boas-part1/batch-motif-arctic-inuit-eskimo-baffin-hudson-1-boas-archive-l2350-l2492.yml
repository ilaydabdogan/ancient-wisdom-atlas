canonical_text:
  quote: ''
  summary: The passage describes west coast Hudson Bay material culture among the
    Kinipetu and Aivilik, focusing on kayaks, paddles, kayak harpoons, bladder-darts,
    seal-hole locating tools, caribou harpoons, and composite bows. It repeatedly
    compares these implements with those of other Arctic regions, including Davis
    Strait, Baffin Bay, Greenland, Baffin Land, Cumberland Sound, Southampton Island,
    and Eastern tribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The implements used by the Kinipetu and Aivilik are described as broadly alike
    and are treated together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The west coast Hudson Bay kayak is described as lighter than some other regional
    kayaks and as having a rounded rather than flat bottom.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Aivilik kayak is described as shorter than the Kinipetu kayak, while the
    Kinipetu kayak has longer stem and stern projections and black and red painted
    bands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aivilik kayaks for hunting caribou in ponds are said to have rounder bottoms
    than those used for seal-hunting in the sea.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kinipetu kayak paddle has a longer blade than the Aivilik paddle, and
    the blades are painted red with black tips.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kayak harpoons are described as differing in detail from those used by Eastern
    tribes, often having a wide barb with notches.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bladder-dart is used in hunting seals from the kayak; after the animal
    is struck, the point disengages and the line unwinds from the shaft.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Winter seal-hole harpoons were not obtained by Captain Comer, and the passage
    explains this by saying that west coast Hudson Bay Eskimo mainly hunt near the
    edge of the land-floe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Aivilik use a curved probing-bone to locate a seal breathing-hole under
    snow, then insert a delicate ivory rod attached to a sinew string and leather
    ring to indicate the seal's approach.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Kinipetu use a very long harpoon with detachable point, iron foreshaft,
    and two sinew strings when hunting caribou in ponds.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The bows are made of musk-ox horn riveted together, with bone tips, skin covering,
    sinew backing, winding, cross-ties, notches, and small horn pegs that may hold
    the bowstring in position.
  category: object
  evidence_refs:
  - ev:10
