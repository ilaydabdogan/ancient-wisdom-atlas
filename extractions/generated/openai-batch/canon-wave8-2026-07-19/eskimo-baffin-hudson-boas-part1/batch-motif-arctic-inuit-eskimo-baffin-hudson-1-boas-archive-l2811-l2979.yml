canonical_text:
  quote: ''
  summary: The passage catalogs household utensils, tools, fuel practices, clothing,
    footwear, grooming, tattooing, snow-goggles, and pipes among Inuit groups of Baffin
    Land and Hudson Bay, with several comparisons to Iglulik, Cumberland Sound, Smith
    Sound, European trade goods, and neighboring Indian pipe forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collection includes a Netchillik kettle, sealskin buckets and cups, wooden
    dishes, and spoons or ladles made mostly from musk-ox horn.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before entering a snow house, people remove snow and frost from clothing with
    a wooden snow-beater, and winter clothing is stored outside rather than brought
    into the hut.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small bone implements with suspension holes are said to be used for extracting
    marrow from bones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When blubber is scarce, the Aivilik and Kinipetu burn turf and moss, which
    is dug with a bone spade.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Aivilik and Kinipetu clothing differs from Cumberland Sound clothing; the
    passage says they seem not to wear sealskin clothing and instead wear caribou-skin
    garments in summer and winter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kinipetu jackets are ornamented with strips of colored European-manufactured
    cloth, especially black and red, probably obtained through trade with Fort Churchill.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men's jackets and footwear are described by cut, length, flaps, slits or tails,
    and caribou-leg-skin outer shoes.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Women's dress includes a jacket, short breeches, long stockings, and shoes;
    the jacket hood and a thong attached by wooden buttons support a child carried
    in the hood.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women's stockings bulge below the knee, may have the worn foot section replaced,
    and are worn with sealskin slippers; hair is arranged in knots or around sticks,
    and a brass forehead ornament is worn.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: For winter travel over ice and dry snow, slippers with hair-on caribou-skin
    soles may be sewn with sinew spirals and zigzags for better footing.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ivory combs are widely used on the west coast of Hudson Bay, modern combs
    often have etched or elaborate decoration, and women tattoo their faces and arms
    with designs that vary slightly among tribes.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Snow-goggles are used in spring, show many forms, differ from those of Cumberland
    Sound and Smith Sound, and one pair is described as almost identical in design
    to an Iglulik pair figured by Parry.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says the pipes show strong Indian influence, are made of soapstone,
    resemble pipes of neighboring Indian tribes, and are not known by the author from
    other eastern Eskimo tribes as locally made pipes.
  category: relationship
  evidence_refs:
  - ev:11
