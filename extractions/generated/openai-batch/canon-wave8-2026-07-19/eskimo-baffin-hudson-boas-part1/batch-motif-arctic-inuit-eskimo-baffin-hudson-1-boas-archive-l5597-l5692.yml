candidate_motifs:
- id: motif:1
  label: raised non-human being becomes blood-sucking danger
  taxonomy_refs: []
  basis: The chrysalis grows under a woman’s care, then sucks the man’s blood, is
    destroyed by dogs, and is explicitly denied human status by the husband.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: Only the concluding portion of this tale is included, so the origin and
    full significance of the chrysalis are not available in this passage.
- id: motif:2
  label: bird-women transform by clothing or plumage
  taxonomy_refs:
  - shapeshifter
  basis: Women who put on boots and jackets become geese and fly away; later feathers
    placed between fingers transform the wife and child into geese.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives concrete transformations but does not explain the ontology
    of the bird-women beyond the events narrated.
- id: motif:3
  label: marriage obtained by withholding transforming garment
  taxonomy_refs:
  - stolen_beloved
  basis: Ititaujang keeps the last woman’s jacket while repeatedly asking her to become
    his wife; she consents after the others have left her.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy label is approximate; the passage emphasizes retained clothing
    and coerced consent rather than an explicit abduction formula.
- id: motif:4
  label: wife and child depart by animal transformation
  taxonomy_refs:
  - departure
  - shapeshifter
  basis: The goose woman takes her child, places feathers between their fingers, and
    both become geese and fly away from the human community.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not include the end of the pursuit, so the outcome of
    the departure is unknown here.
- id: motif:5
  label: pursuit quest through compulsory threshold obstacles
  taxonomy_refs:
  - mystical_quest
  basis: Ititaujang follows his transformed wife and child toward the land of birds
    and must pass a sequence of obstacles that he cannot go around.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The destination is the land of birds rather than explicitly an underworld
    or afterlife; broader classification requires additional context.
- id: motif:6
  label: magical transport dependent on closed eyes
  taxonomy_refs:
  - forbidden_knowledge
  - mystical_quest
  basis: A piece of wood functions as a kayak only under the instruction that the
    traveller keep his eyes shut; opening his eyes causes the kayak to vanish, while
    closing them restores it.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives an eye-opening prohibition, but does not state a moral
    or knowledge-seeking motive.
- id: motif:7
  label: liminal helper with dangerous hidden condition
  taxonomy_refs: []
  basis: Ixalu'qdjung’s body can be looked through, he does not want his lack of intestines
    seen, threatens death if approached from the wrong direction, and then aids the
    traveller.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: His full identity and narrative function may be clarified outside the
    excerpt.
