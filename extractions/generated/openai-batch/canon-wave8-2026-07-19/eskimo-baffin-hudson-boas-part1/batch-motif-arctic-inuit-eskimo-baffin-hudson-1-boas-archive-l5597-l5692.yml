canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which a growing chrysalis attacks a man, is
    killed by dogs, and the woman who raised it dies. It then begins the tale of Ititaujang:
    a hunter takes the clothes of bathing women, three of whom become geese when dressed,
    while the fourth becomes his wife after he withholds her jacket. Later she and
    their child use feathers to become geese and fly away. Ititaujang pursues them
    toward the land of birds, passes several unavoidable obstacles, and meets Ixalu''qdjung,
    who helps him cross a deep river by means of a piece of wood functioning as a
    kayak if his eyes remain closed.'
  language: English
  quote_policy: summarized
