canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a woman or grandmother
    transforms herself into a man and creates hunting gear and dogs from body parts,
    snow, and tattoos; Tale 25, in which a crippled hunter-angakok transforms himself
    into a woman, marries, hunts, has a child, and is eventually killed by another
    angakok through organ removal; Tale 26, in which stranded hunters transform into
    bears and some regain human shape after observing a prohibition; and the opening
    of Tale 27, in which a father suggests that his marriage-refusing daughter marry
    a dog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who lacked a man transforms herself into a man by making male genitals
    from a lamp-trimming bone and fire-stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same figure transforms her privates into a sledge, snow used for wiping
    into dogs, forehead tattooing into a kayak, and cheek tattooing into a paddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The transformed figure marries a girl; the girl becomes pregnant and identifies
    the grandmother as the maker of the sledge, dogs, kayak, and as the father of
    the child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a man is in the snow house, the returning grandmother sees his legs,
    is overcome with shame, and dies; the dogs become snow again and the sledge reverts
    to its original form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Tale 25, a great hunter and angakok is crippled by a whale and decides
    to transform himself into a woman by rubbing off the skin of his face and pulling
