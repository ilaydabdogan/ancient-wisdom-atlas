canonical_text:
  quote: ''
  summary: A sequence of short Cumberland Sound tales recounts a hunter killing a
    raven caught in a bear wound; a singing fox released from a trap; a mistreated
    wife who becomes a raven and later resumes woman-shape; Kalluapik frightened away
    by a boy invoking cannibals; a giant who captures people and boats from the sea;
    an orphan boy who catches a whale; and Podluksak’s feud involving wife-stealing,
    pursuit, concealment, and revenge killings.
  language: English
  quote_policy: summarized
