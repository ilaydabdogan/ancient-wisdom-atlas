candidate_motifs:
- id: motif:1
  label: speaking animal at moment of danger or death
  taxonomy_refs: []
  basis: The trapped fox sings to Neqingoaq, and the raven speaks while dying after
    being caught at the bear wound.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage gives short anecdotes without explaining whether animal speech
    has a broader function.
- id: motif:2
  label: human transformed into raven
  taxonomy_refs:
  - shapeshifter
  basis: Peqaq wishes to become a raven, is turned into one, later resumes woman-shape,
    and enters a new marriage situation.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: Only one human-to-raven transformation is narrated in this passage.
- id: motif:3
  label: escape from an unwanted pursuer by transformation
  taxonomy_refs:
  - shapeshifter
  - departure
  basis: Peqaq leaves home, is followed by her husband, becomes a raven, and avoids
    being recognized by him.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The tale does not explicitly state that the wish to become a raven is
    intended as an escape strategy, though it occurs during pursuit.
- id: motif:4
  label: child or youth uses a frightening claim to drive off a visitor
  taxonomy_refs:
  - trickster_boundary
  basis: The lad tells Kalluapik that cannibals are upon him, after which Kalluapik
    runs away into the water and the boy is left alone.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The editorial note suggests an artful plan, but the story itself is brief.
- id: motif:5
  label: giant captor of humans
  taxonomy_refs: []
  basis: The giant removes people and boats from the sea, confines the people in a
    box, and prevents their escape by watching it.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No origin, defeat, or release episode is included in the passage.
- id: motif:6
  label: small or orphaned hunter makes extraordinary catch
  taxonomy_refs: []
  basis: The orphan boy, previously catching only gulls and having little food, catches
    a whale and thereby attracts neighbors seeking meat.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: Available taxonomy does not include a precise orphan-success or lucky-hunter
    family.
- id: motif:7
  label: wife-stealing triggers pursuit and revenge feud
  taxonomy_refs:
  - stolen_beloved
  basis: Podluksak steals a wife, is pursued by the woman’s associated men, and the
    episode escalates through killings and revenge.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The stolen wife herself is not shown acting within the episode.
- id: motif:8
  label: fugitive evades pursuit by concealment in snow
  taxonomy_refs: []
  basis: Podluksak turns aside from his track, buries himself in the snow, and uses
    his whip to make the pursuing dogs turn away.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage presents this as a single tactical episode rather than a full
    motif cycle.
