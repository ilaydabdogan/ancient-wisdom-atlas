canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which a dog takes human form,
    marries a woman, fathers pups, is drowned by the woman's father, and the offspring
    are sent away in shoe-vessels to become ancestors of Indians and Europeans while
    the woman becomes Nuliayoq. It then begins the tale of Armuckjuark, whose parents
    perform a strength-making practice, and who becomes a powerful whaler but kills
    his uncle, his half-brother after a false accusation, and finally the lying wife.
  language: English
  quote_policy: summarized
