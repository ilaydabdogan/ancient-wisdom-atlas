canonical_text:
  quote: ''
  summary: 'The passage contains several tale episodes: a visitor ignores a tuneq''s
    warnings about deadly mosquitoes and is later found dead; two women stay with
    the Ijiqan and are later credited with great running speed because of Ijiqan food;
    Kingatcheta and Kevung encounter Takeychwen whale hunters and receive whale-skin;
    and a mother repeatedly calls for living beings, rejecting several animals before
    inviting foxes in.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tuneq warns a visiting man that it is still too warm for caribou-hunting
    and that mosquitoes will kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visiting man later insists on going out for a single day, says he will
    kill mosquitoes with his stick, and does not return in the evening or on following
    days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When cold weather begins, the tuneq searches and finds the man dead, with
    his stick in his hand, many dead mosquitoes beside him, and his blood sucked out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two women who had lost their way come to Aukinerbing, find a village of Ijiqan,
    are invited in, and are later sent back and conveyed to the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During a later ball game, the two girls who had lived with the Ijiqan initially
    cannot catch the ball and are asked why they are slow despite having lived with
    the Ijiqan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two girls run around the island very quickly, as fast as caribou, with
    loose hair streaming behind them, and the people are amazed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ball-players say that the Ijiqan made the girls able to run so fast and
    that Ijiqan food made them fleet of foot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men sealing in kayaks see a boat fast to a whale and people lancing the whale
    before the whale and boat disappear behind a point of land.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kingatcheta and Kevung approach a dead whale that seemed covered with seaweed
    and see that the apparent seaweed is harpoon-lines and that the whale killers
    are Takeychwen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Takeychwen had feared having to divide the whale with many approaching
    Eskimo kayaks, but they welcome Kingatcheta and Kevung because the two men had
    courage to come near, and they invite them to take whale-skin home.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Agagidjen, a mother wishes for a living being to come; caribou and rabbits
    arrive in separate episodes, and she tells her daughter to send them away.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: After further calls, bears and an ermine are also rejected, while many foxes
    are finally invited in.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
