canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound tale episodes: a boy briefly
    appears adult while harpooning and killing a whale; two bear episodes in which
    spoken cries of “Geese” transform bears into geese; girls encounter an isolated
    Naaquaran household headed by a man who says he has killed someone; and Karnapik,
    during famine, eats his dead daughter and uses her thigh-bone as a trumpet to
    order further killings for food.'
  language: English
  quote_policy: summarized
