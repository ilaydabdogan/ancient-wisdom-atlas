candidate_motifs:
- id: motif:1
  label: Small boy briefly assumes adult appearance to kill a whale
  taxonomy_refs:
  - miraculous_child
  basis: The boy appears as a strong bearded man only during the harpoon act, kills
    a very large whale, and then appears as a boy again.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explain why the boy changes appearance, and it does
    not call him divine or supernatural; the taxonomy ref is broad.
- id: motif:2
  label: Threatening bear transformed into geese by spoken naming
  taxonomy_refs:
  - shapeshifter
  basis: Two bear episodes use the cry “Geese” to transform a dangerous bear into
    geese, once piece by piece and once as a cloud from the body.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The bears are transformed by another speaker rather than voluntarily changing
    shape, so the shapeshifter taxonomy ref should be reviewed.
- id: motif:3
  label: Encounter with an isolated killer's hidden household
  taxonomy_refs: []
  basis: The girls discover an unknown hut, meet a household whose male head says
    he has killed a man and lives apart, and then find no one there the next day.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly say the hut vanished or explain the identity
    of the Naaquaran beyond the household's own statement.
- id: motif:4
  label: Famine cannibalism escalating into communal killing
  taxonomy_refs: []
  basis: Karnapik and his wife eat their dead daughter during starvation, then further
    people are killed and eaten after Karnapik's calls.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No ritual, sacrificial, or supernatural cause is stated; the motif should
    remain described as famine cannibalism and communal killing.
- id: motif:5
  label: Bone of consumed kin used as a voice instrument
  taxonomy_refs: []
  basis: After the daughter is eaten, Karnapik uses her thigh-bone as a speaking-trumpet
    to summon and command killings.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not state that the bone itself has independent magical
    power; it functions as a trumpet in the narrative.
