canonical_text:
  quote: ''
  summary: A blind boy and his sister are mistreated by their stepmother after the
    boy unknowingly kills a bear. The sister secretly feeds him. Speaking birds on
    a lake carry the boy through repeated underwater dives and restore his sight.
    He later takes revenge on the stepmother during a whale hunt; she is pulled under
    water and transformed into a narwhal. The siblings travel onward, survive an attack
    by long-nailed people in a snow house, and are later received kindly by the Ikingan,
    who have unusual eating habits and no anuses.
  language: English
  quote_policy: summarized
