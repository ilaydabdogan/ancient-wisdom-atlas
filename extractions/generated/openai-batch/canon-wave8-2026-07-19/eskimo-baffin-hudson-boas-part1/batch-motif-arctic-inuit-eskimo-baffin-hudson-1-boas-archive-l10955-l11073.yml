canonical_text:
  quote: ''
  summary: The passage gives brief accounts of knee-high Inuarugdligait dwarfs, large
    Ijiqan people, and a tale in which three girls name a Whale, an Eagle, and a Bowlder
    as husbands. The Whale and Eagle carry girls away and are later defeated during
    rescue attempts, while the girl joined to the Bowlder turns gradually to stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Inuarugdligait are described as dwarfs about knee-high to an ordinary
    man, living between Wager River and Chesterfield Inlet; witnesses report tracks
    or an encounter near those places.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Inuarugdligaq approaches a man, makes himself as large as the man, wrestles
    him, and is thrown; the passage states that if the dwarf had thrown the man, the
    man would have failed in hunting and died of hunger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Inuarugdligait are said always to propose a strength test when they meet
    a man and to carry only an ice-chisel as a weapon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dwarf couple comes to an Eskimo hut for a dance; the woman’s child drops
    from her hood and is devoured by dogs, after which the husband tells her to continue
    dancing because she may have another child later.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ijiqan are described as giants twice the size of ordinary men, living
    west of Great Fish River.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Siksik reports that, when he was a boy hunting with his father, two very large
    men silently picked up two killed caribou and carried them away without resistance
    from his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Three girls playing near the beach jokingly name a Whale, an Eagle, and a
    Bowlder as husbands; the girl touching the Bowlder cannot remove her hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eagle carries one girl to his nest on a high cliff, while the Whale carries
    another girl to an island and gives her the bones of his body to build a house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The girl living with the Whale becomes able to live either in water or on
    land.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the girl’s father and brothers arrive by boat, the Whale lets her go
    ashore with a line tied to her, but she removes it and ties it to a buckle that
    has been given the power to speak.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Whale hauls in the line, finds only the buckle, tears down the house,
    restores the bones to his body, but forgets his breast-bone and hip-bone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the Whale’s pursuit, the fleeing girl throws articles of clothing into
    the sea; the Whale stops to strike each one, and this delay lets the boat reach
    shore.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Whale strands on a reef during pursuit, and the people kill him after
    the tide goes out.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The girl carried by the Eagle prepares a sinew line while the Eagle is away
    hunting, deceives him by sending him to a distant place, descends by the line
    to her father and brothers, and escapes by boat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Eagle later attacks the window of the father’s house with his wings and
    is killed by the father with an arrow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Eagle’s cliff is said to be pointed out in the present, and people are
    said to have cut pieces from the line until it was out of reach.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:17
  text: The girl who married the Bowlder cannot let go and gradually turns into stone;
    people bring her food while life remains, and the stone is pointed out to children.
  category: sequence
  evidence_refs:
  - ev:10
