candidate_motifs:
- id: motif:1
  label: size-changing dwarf challenger
  taxonomy_refs:
  - shapeshifter
  basis: A dwarf uses power to become as large as a man and challenges him to wrestle.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The transformation is a change of size, not a change into another species
    or form; the shapeshifter taxonomy is therefore approximate.
- id: motif:2
  label: strength contest with supernatural being affects hunting fortune
  taxonomy_refs: []
  basis: The dwarf challenges a man to wrestle, and the passage states that if the
    man lost he would become unsuccessful in hunting and die of hunger.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No wider comparative classification is asserted from the passage alone.
- id: motif:3
  label: giant strangers seize game without speech
  taxonomy_refs: []
  basis: Two very large men silently take caribou killed by Siksik’s father and carry
    them away.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a brief anecdote rather than a developed tale sequence.
- id: motif:4
  label: nonhuman husbands named in jest become actual spouses or bonds
  taxonomy_refs: []
  basis: The girls jokingly choose Whale, Eagle, and Bowlder as husbands; the Whale
    and Eagle carry girls away, and the Bowlder holds the girl who touches it.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage does not explicitly frame the words as a magical vow, only
    as joking speech followed by consequences.
- id: motif:5
  label: carried-off woman rescued from animal husband
  taxonomy_refs:
  - stolen_beloved
  basis: The Whale and Eagle carry girls away, and father and brothers later retrieve
    them by boat.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The women are described as wives as well as carried-off figures, so the
    motif overlaps with nonhuman marriage.
- id: motif:6
  label: speaking object decoy enables escape
  taxonomy_refs: []
  basis: The girl removes the Whale’s line, ties it to a buckle empowered to speak,
    and the buckle answers the Whale while she escapes.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage attributes the speaking power to the father but does not explain
    the mechanism.
- id: motif:7
  label: pursuer delayed by discarded clothing
  taxonomy_refs: []
  basis: The fleeing girl throws clothing into the sea, and the Whale repeatedly stops
