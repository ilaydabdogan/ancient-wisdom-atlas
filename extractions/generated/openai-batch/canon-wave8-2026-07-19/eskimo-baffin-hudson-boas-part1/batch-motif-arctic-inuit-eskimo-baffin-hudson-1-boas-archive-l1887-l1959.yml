canonical_text:
  quote: ''
  summary: An ethnographic account describes a visit to small seal-skin tents occupied
    by women and children, observations of food, tools, scarce wood, trade and gift
    exchange, facial tattooing, ornaments, clothing, gloves, and distinctive hair
    arrangements among women and men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two very small seal-skin tents with many holes housed five women and six children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The women received the visitors without visible fear or surprise, while the
    children hid their heads and did not speak to or look at the visitors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Neeakoodloo rolled up a large new deerskin, threw it toward the visitor, and
    repeated the word “Kooyenna.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tent floors, except for the sleeping area, were strewn with salmon and
    offal; the observer saw no lamp and only one poorly made cooking pot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: About two dozen dogs lay near the tents but ran away when the visitors approached,
    and the observer saw no sledges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tents lacked the small domestic toys the observer associated with other
    winter acquaintances, but the women used bone needles, and also had two small
    iron needles apparently made from nails.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bone needles were made from bird pinions, described as harder and more
    plastic than other bones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A small black-painted piece of deal wood was kept among family valuables,
    though the observer judged it too small for practical use.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Three composite bows were described as all the wood in the group’s possession,
    while their spears were made from whale rib bone.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After receiving presents, individuals offered the donor a choice of their
    property; items valued by them included dried salmon-skin rolls and small pieces
    of flint for making knives and arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Neeakoodloo offered stone and fish-skins after receiving knives, then began
    cutting up a large seal-skin when the first offers were refused, and afterward
    repeated thanks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The women had small dotted tattoos on the face, unmarked hands, hair twisted
    into short clubs over the temples, and bone pendants attached to these locks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The men’s clothing included short breeches, gloves made from reversed dried
    dovekie skin, and a large ball-like mass of hair projecting from the forehead.
  category: attribute
  evidence_refs:
  - ev:7
