candidate_motifs:
- id: motif:1
  label: pregnancy and birth taboos shaping the child
  taxonomy_refs:
  - sacred_birth
  basis: The passage states that a pregnant woman must act as she wants the child
    to act, must avoid specified foods, and that the mother of an infant must also
    observe the law.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes custom rather than
    a narrative of sacred birth.
- id: motif:2
  label: feeding a guardian spirit to protect the family
  taxonomy_refs:
  - sacred_exchange
  basis: Meat is prepared for the child's tornaq, and the passage says absence of
    food would cause the spirit to consume vital organs of family and community members.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The exchange is described as household ritual practice, not as a formal
    mythic bargain.
- id: motif:3
  label: ritual formation of future hunting and craft skill
  taxonomy_refs:
  - initiation
  basis: The child is put through hunting motions, and animal materials are placed
    on children to produce future skills.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: Some practices concern infancy rather than formal adolescent initiation.
- id: motif:4
  label: new-moon winter rite for future sealing success
  taxonomy_refs:
  - seasonal_cycle
  basis: The practice occurs in winter at the new moon and is linked to later success
    in sealing under the watching man in the moon.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents a recurring custom, not a full seasonal myth.
- id: motif:5
  label: first-kill initiation and distribution
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: First seal and first caribou ceremonies mark a boy's first kills through
    bodily contact with the prey, sharing of meat, return of bones, and distribution
    of gifts.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage gives custom details without naming the event as initiation.
- id: motif:6
  label: animal bones returned to water become future prey
  taxonomy_refs:
  - death_rebirth
  basis: First-seal bones are thrown into a seal-hole and are believed to become seals
    that the boy will catch later.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage describes prey regeneration
    from bones, not human resurrection.
- id: motif:7
  label: Nuliayoq grants hunting favor and removes bones
  taxonomy_refs:
  - sacred_exchange
  basis: The boy gives first-caribou skin to an old man to obtain Nuliayoq's favor,
    and Nuliayoq is also said to have taken bones from a grave.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: medium
  cautions: The passage does not explain Nuliayoq's broader identity or a full exchange
    system.
- id: motif:8
  label: game taboo preventing future hunting injury
  taxonomy_refs: []
  basis: Boys are forbidden cat's-cradle because their fingers might later become
    entangled in the harpoon-line; cases of lost fingers are attributed to having
    played it when young.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No available taxonomy reference directly matches this taboo.
- id: motif:9
  label: burial with goods, prayers, and missing bones
  taxonomy_refs: []
  basis: The grave account includes a stone or caribou-skin burial, objects deposited
    at the head, prayers, and the statement that Nuliayoq had taken the bones.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage does not describe an afterlife journey or the intended use
    of the grave goods.
- id: motif:10
  label: widow's gaze transforms or petrifies animals
  taxonomy_refs:
  - shapeshifter
  basis: The passage says animals dislike being looked at by widows and gives examples
    of animals becoming stone or other animals, including a whale turned to stone.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The transformation is caused by an observer's gaze, not by the animal
    voluntarily changing shape.
