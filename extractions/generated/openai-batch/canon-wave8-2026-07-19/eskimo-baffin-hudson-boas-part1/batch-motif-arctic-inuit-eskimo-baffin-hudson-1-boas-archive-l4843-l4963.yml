canonical_text:
  quote: ''
  summary: The passage describes customs and religious ideas concerning pregnancy,
    birth, early childhood, hunting preparation, first-kill ceremonies, adolescent
    prohibitions, burial, and the transformative effects attributed to widows' gaze.
    It includes practices involving guardian spirits, the man in the moon, Nuliayoq,
    animal bones, grave goods, and animals or a whale turned into other forms or stone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant woman and the mother of an infant must observe specified behavioral
    and food restrictions, and a family expecting a birth lives in a separate hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For three months after birth, the mother stays in her house and is not allowed
    sexual intercourse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mother of an infant boy keeps snow in a kettle, melts it over the lamp,
    touches meat to the child's mouth, and puts the meat into a bag; this is said
    to please the child's guardian spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Meat is placed near the child at night for the guardian spirit; if the spirit
    finds no food, it is said it would eat the vital organs of the mother, then father,
    then other natives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After meals, the mother pulls the child's limbs, sets the child sitting, makes
    motions of paddling a kayak, represents harpooning with a fork, and makes the
    child's hands imitate shooting a bow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fox intestines may be placed on a baby boy's feet for walking skill on thin
    ice, and caribou-skin strips may be put around a baby girl's wrists for skill
    in cutting and sewing skins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the winter new moon, boys run out of the snow house, take snow, and put
    it into a kettle; parents say the man in the moon watches them and that seals
    will later come to diligent hunters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a boy kills his first seal, the seal is dragged across his bare back
    before death, the meat is divided, and the bones are thrown into a seal-hole,
    where they are believed to become future seals for him to catch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After a boy kills his first caribou, his mother distributes meat and beads,
    and the boy gives the skin to an old man; this is said to obtain Nuliayoq's favor
    for future hunting.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Boys must not play cat's-cradle because their fingers might later become entangled
    in a harpoon-line; adolescent girls must not eat eggs.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: At a grave, objects including matches, lead, and a horn spoon were deposited
    at the head end, and visitors walked around muttering prayers; Nuliayoq was said
    to have taken the bones of a buried angakok.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: Widows are said to affect animals by looking at them, including animals changing
    into other animals or stone; a tradition says a widow saw a whale and the whale
    turned to stone.
  category: action
  evidence_refs:
  - ev:13
  - ev:14
