canonical_text:
  quote: ''
  summary: 'The passage first tells of Nareya, a huge man with an immense appetite
    who kills caribou, steals bodies from graves, brings a feigned corpse home to
    be cooked, and is then tricked by an angakok into drinking a river until he bursts;
    mist and fog arise from him. It then begins a tale about how children were formerly
    obtained: Owmirneto and later her found daughters repeatedly find babies and raise
    them, while the second girl, anxious for a child, eventually finds a chrysalis
    and lets it suck blood from her body.'
  language: English
  quote_policy: summarized
