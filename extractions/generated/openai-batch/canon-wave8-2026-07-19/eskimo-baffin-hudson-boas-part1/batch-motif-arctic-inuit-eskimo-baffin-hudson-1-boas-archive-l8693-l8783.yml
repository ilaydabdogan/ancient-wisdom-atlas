canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Karnapik repeatedly orders killings
    through a speaking-trumpet, while human flesh is boiled and eaten until only he
    and his wife remain; two strangers later witness him eating human flesh and hear
    that he and his wife consider themselves supernatural beings. It then gives a
    tale of Orriotto, who refuses meat, drinks so much water that he becomes temporarily
    immobilized, and later eats greedily from a communal fat-and-blubber dish. It
    then gives a tale of Akpukatoo, a woman continually craving food, who is abandoned
    and sealed in her house with her children; when people return, they find her dead
    and discover that she has eaten her children.
  language: English
  quote_policy: summarized
