  summary: 'The passage describes material culture of the west coast of Hudson Bay
    and related groups: whips, skin-preparation tools, scrapers, needle-cases, snow-house
    construction tools, snow-house layout, older whale-bone-and-turf houses, and household
    furniture. It repeatedly compares forms and designs with Cumberland Sound, Southampton
    Island, Kinipetu, and Smith Sound examples.'
  language: English
