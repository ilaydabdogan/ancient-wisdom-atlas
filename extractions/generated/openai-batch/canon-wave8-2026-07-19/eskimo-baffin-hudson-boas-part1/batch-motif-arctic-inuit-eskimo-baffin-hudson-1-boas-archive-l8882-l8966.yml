canonical_text:
  quote: ''
  summary: 'A sequence of bear-encounter anecdotes describes hunters and householders
    confronting bears: Kulwa kills a bear on a steep hillside and recalls earlier
    knife tactics; Oonoko delays a bear at his hut while Weba shoots it; Outerertalow,
    though paralyzed on one side, hunts bears with harpoon and lance; an old woman
    kills a bear by pushing a mitten on her staff into its mouth; and Neneala is killed
    and devoured by a bear on an island while her sons escape by boat and the people
    abandon the place.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During winter sealing, hunters see a bear run ashore and climb to a steep
    hillside position protected from behind by a cliff, where pursuing dogs can be
    driven down the slope.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kulwa disregards warnings, says bears do not bite him, sends his dog Akko
    behind the bear, and kills the bear with arrows; the hunters share the meat and
    praise his knowledge of killing bears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kulwa recounts that when young he approached bears with a knife, raised his
    left arm before his face, and killed the bear while it tried unsuccessfully to
    bite the raised arm.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Qamaqdjuin, a bear enters the entrance of Oonoko's stone hut; Oonoko passes
    out meat and blubber, strikes the bear's nose with a walrus penis-bone, and Weba
    shoots the bear with arrows before the men pull it out and skin it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Outerertalow, described as paralyzed on one side, hunts bears alone with a
    sealing-harpoon, staff, ivory knife, and lance; in one encounter he harpoons and
    repeatedly evades a bear until it is dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old woman traveling ahead of moving sledges meets a bear, places a rabbit-skin
    mitten on the end of her staff, pushes it into the bear's mouth, and kills it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On a small island, Neneala and her two sons are left behind while men hunt
    walrus by boat; a bear pursues them, devours Neneala, the boys escape into the
    boat, and the people leave the place permanently after hearing the bear growl
    for three days.
  category: sequence
  evidence_refs:
  - ev:7
