candidate_motifs:
- id: motif:1
  label: guardian-spirit divination at a distance
  taxonomy_refs: []
  basis: The walrus-headed guardian spirit is said to visit the narrator's home and
    see absent hunters, allowing the angakok to report details and warnings.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports the performance and local reception as proof of power
    but does not independently verify the claimed spirit travel.
- id: motif:2
  label: ritual expulsion or warding of harmful presence
  taxonomy_refs: []
  basis: The dismissal formula and throwing-away gesture are directed, probably, at
    an evil spirit, and another incantation prescribes gunshots and prayer to ward
    off approaching sickness.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: medium
  cautions: The identification of the first target as an evil spirit is marked as
    probable by the narrator.
- id: motif:3
  label: animal-spirit embodiment with walrus features
  taxonomy_refs: []
  basis: The guardian spirit is walrus-headed, and the angakok later represents walrus
    tusks by holding two small sticks to his face while acting wildly.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage supports animal-spirit representation, but not a full transformation
    narrative.
- id: motif:4
  label: hidden-object finding as proof of incantation power
  taxonomy_refs: []
  basis: The Kinipetu angakok repeatedly finds an object hidden by people during an
    incantation.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives no description of the hidden object itself.
- id: motif:5
  label: trance diagnosis and apotropaic directions for sickness
  taxonomy_refs: []
  basis: In trance the angakok sees sickness approaching and prescribes morning gunshots
    in two directions combined with prayer to ward it off.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not report the later outcome of the prescription.
- id: motif:6
  label: omens linking lost object and hunting restraint to death or luck
  taxonomy_refs: []
  basis: A lost gold stud would forebode death if found, while not catching the first
    walrus seen in spring would bring good luck.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The causal rationale for the omens is not explained in the passage.
- id: motif:7
  label: post-ritual spouse exchange as required exchange custom
  taxonomy_refs:
  - sacred_exchange
  basis: After each incantation ceremony people must exchange wives for the night;
    refusal is expected to bring sickness, and close relatives are excluded.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes a required ritual
    exchange but does not use the term sacred.
- id: motif:8
  label: festival-like next-day games after ritual exchange
  taxonomy_refs: []
  basis: The following day is spent in games after nose rubbing, and bedding is not
    to be disturbed until late in the day.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage only briefly describes the games and restriction.
- id: motif:9
  label: sickness caused by witchcraft after insult
  taxonomy_refs: []
  basis: A boy's weakness is attributed to a spell wrought by an angry old angakok
    after the boy mocked his missing toes.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage frames this as belief or attribution, not verified causation.
- id: motif:10
  label: bereavement or stranger-arrival clothing markers
  taxonomy_refs: []
  basis: When strangers who have lost friends arrive, cloth or skin strips are attached
    to shirts or girdles.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage notes variation in when the custom is practiced and where
    the strips are fastened.
comparison_claims:
- id: claim:1
  claim: The celebration after incantation ceremonies is described by the source as
    somewhat similar to the fall festival of the tribes of Davis Strait.
  claim_level: same_function
  target: fall festival of the tribes of Davis Strait
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only states similarity and gives a few associated practices;
    it does not provide a detailed side-by-side comparison.
