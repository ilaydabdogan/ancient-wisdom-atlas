canonical_text:
  quote: ''
  summary: The passage describes several angakok incantation performances, including
    guardian-spirit divination, expulsion formulas, trance behavior, animal-tusk impersonation,
    hidden-object finding, sickness warnings, apotropaic shooting and prayer, omens,
    post-ceremony wife exchange and games, healing practices, mourning/arrival cloth
    strips, and a sickness attributed to an angakok's spell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman participant pretends to throw something away while saying a dismissal
    formula, and the assembled people repeat it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The assembled people repeatedly urge the angakok onward during the performance.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
- id: obs:3
  text: The guardian spirit of one angakok is described as having a head like a walrus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The angakok reports that his guardian spirit visited the narrator's home,
    describes a large stream and an island, and warns the narrator not to go to the
    island for a long time after returning home.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During one phase the angakok is heard groaning outside, comes in muttering,
    covers his face with his hands, and shakes hands with the narrator and then with
    a child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The angakok holds two small sticks to his face to represent walrus tusks,
    acts wildly, and bumps against objects and people while bystanders say he will
    not hurt anyone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The angakok reports that hunters are one day's travel south of Wager River,
    accompanied by others, and well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: An Aivilik native performs an incantation, hops around on the floor, and reports
    that the absent people are nearer and will arrive in three days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the close of the meeting the two angakut stand still while other participants
    shake hands with them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Kinipetu angakok repeatedly locates a hidden object and, after the lights
    are put out, leaves the house without the people noticing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In trance the Kinipetu angakok sees approaching sickness and prescribes shooting
    guns toward the northeast and northwest the next morning while people pray.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kinipetu angakok says that finding a lost gold stud would forebode death
    and that sparing the first spring walrus would bring good luck to the whalers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that incantations are performed in the evening and that
    after each ceremony people must exchange wives for the night, with sickness expected
    if an assigned woman refuses; close relatives are excluded.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The day after the wife exchange is spent in games; men and women first rub
    noses, play named games, and leave bedding undisturbed until late in the day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The region also uses head-lifting to discover the cause of sickness, and painful
    body parts are pricked with a sharp instrument so that disease will leave quickly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When strangers arrive after losing friends to death, strips of cloth or skin
    are attached to shirts or to the girdles of newly arrived men.
  category: object
  evidence_refs:
  - ev:10
- id: obs:17
  text: A sickness case is attributed to an angry old angakok's spell after a boy
    mocked the loss of his toes.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: Some people avoid touching others' clothing or bodies, apparently in connection
    with belief in witchcraft.
  category: action
  evidence_refs:
  - ev:12
