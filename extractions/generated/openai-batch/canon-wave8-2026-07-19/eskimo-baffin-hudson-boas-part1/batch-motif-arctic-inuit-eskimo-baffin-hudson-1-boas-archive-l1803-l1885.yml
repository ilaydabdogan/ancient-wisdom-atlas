  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The approaching man showed fear: his teeth chattered and he and the seal-skins
    trembled.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lyon threw the man a string of beads, and the man placed it across a bunch
