canonical_text:
  quote: ''
  summary: The passage introduces Southampton Island material collected by Captain
    Comer and quotes Captain G. F. Lyon’s 1824 visit. Lyon describes an isolated island
    group, a man named Nee-a-kood-loo approaching by water on an inflated seal-skin
    float, exchanges of beads, needles, dried salmon, an arrow, and knives, observations
    of local tools and storage structures, and notes on behavior and language differences
    from other Inuit groups known to him.
  language: English
  quote_policy: summarized
literal_observations:
