  summary: The passage contains the end of a fox-and-wolves episode, a tale of an
    adopted bear cub who seals for people and later escapes being killed, and a tale
    titled “The Man who married the Fox,” in which a husband discovers his wife’s
    secret pond encounter, mutilates the pond lover, serves the organ to her, and
    later kills her by releasing insects into the bed.
