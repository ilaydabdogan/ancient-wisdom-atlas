canonical_text:
  quote: ''
  summary: 'The passage contains several tale episodes: Kanatchea repeatedly obtains
    foods that are out of season for his mother, later wounds a nephew after a fire-drill
    mishap and is devoured by dogs after being shot by relatives; a younger brother,
    Icheytechak, elopes with his elder brother’s wife after she abandons her child,
    and later drowns when a ground-seal upsets his kayak; the husband retrieves the
    wife, isolates her in a small hut, and their grown son later refuses her a caribou-skin
    because she abandoned him; finally, Kokoparoolee’s brother becomes snow-blind
    while hunting and is fatally stabbed by four enemies.'
  language: English
  quote_policy: summarized
