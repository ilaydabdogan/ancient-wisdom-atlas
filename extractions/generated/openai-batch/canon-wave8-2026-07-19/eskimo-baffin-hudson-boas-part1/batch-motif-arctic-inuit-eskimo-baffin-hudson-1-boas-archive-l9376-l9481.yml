canonical_text:
  quote: ''
  summary: 'The passage recounts several Cumberland Sound traditions or remembered
    incidents: Rating returns from Niutang with whale products for his starving family
    and later hunts seal, ptarmigan, and caribou for them; a caribou-hunting party
    ignores Piaraq’s warning about taking walrus-hide and later starves, leaving two
    survivors; a whale upsets a boat and another crew rescues the men; a starving
    group led by Etwallou crosses new ice to retrieve cached walrus-meat and divide
    it; and several men drown after breaking through thin lake ice, followed by rescue
    and body-recovery attempts.'
  language: English
  quote_policy: summarized
