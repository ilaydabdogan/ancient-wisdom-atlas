canonical_text:
  quote: ''
  summary: 'The passage ends a thin-ice episode with an old man admonishing Pudawallow
    and Mikiejew. It then gives several quarrel, murder, and revenge tales: Noodelwa,
    Ekkomalo, and Akygerjew pursue and kill a fleeing stranger and take his kayak;
    Kammungan, though unable to walk on his feet, outruns caribou and dodges arrows
    from jealous men; Noonatoo discovers evidence that starving Okoweecheak has eaten
    his dogs and retaliates by walling in Okoweecheak’s doorway to starve him.'
  language: English
  quote_policy: summarized
