canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which a girl survives by trapping
    foxes, using their flesh and skins, and traveling to Cumberland Sound; a tale
    contrasting the Raven's inedible or taboo foods with the Gull's dried salmon;
    a tale in which girls' joking declarations that bones are husbands cause an owl
    bone and a whale skull to become living animal spouses, followed by escapes and
    reversion to bone or skull; and the beginning of an origin tale involving Katsu's
    adopted son in a kayak during a strong land-breeze.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl remains outside while foxes crowd into a house and die from suffocation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl skins the foxes, makes clothing from the skins using strings instead
    of needle and thread, eats the flesh, and then leaves along the shore.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hunter enters the Raven's house, where an old man has a boy bring human
    flesh, supposed whale-skin that is really fowl dung, and scrapings of whalebone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter refuses the foods offered in the Raven's house; the old man eats
    the rejected items and then vomits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hunter later enters the Gull's house, receives dried salmon, eats it gladly,
    and returns home to report how the birds fed him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A girl calls an owl shoulder-blade her husband; the bone becomes alive, flies
    toward a precipice, and takes her along.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Owl's wife makes a grass rope, lowers herself from the cliff, reaches
    her parents' dwelling, and her father kills the Owl with an arrow, after which
    it becomes a bone again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A second girl names a whale skull as her husband; the whale bone becomes alive,
    and she has to live in the Whale while a line is fastened to her when she goes
    outside.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Whale's wife escapes by fastening her tether to the shore and boarding
    a boat steered by her father; the Whale pursues the boat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During the pursuit, the woman throws a hair-string, a mitten, a boot, and
    leggings into the water; the Whale tears these objects while the boat reaches
    shore, and when stranded he is seen only as a whale skull.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A third girl wishes another bone to become her husband, but the bone does
    not respond.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Katsu is introduced as an old woman with an adopted son; while the boy is
    in his kayak, a strong land-breeze prevents him from reaching shore and his face
    becomes red from effort.
  category: sequence
  evidence_refs:
  - ev:8
