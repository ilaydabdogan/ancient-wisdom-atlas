canonical_text:
  quote: ''
  summary: The passage recounts a seal-hunting episode in which Tadlo follows Sedna’s
    instructions for eating a seal and returning its remains to the sea, after which
    seals become abundant. It then gives a tale of a taboo violation involving a caribou
    skin, followed by a broken floe, hunger, deaths, and a small group of survivors.
    The passage also describes beliefs about two souls, several lands of souls, Sedna’s
    role in restoring some souls, reversed seasons in Alipa'q, and the tupilak, a
    dead soul burdened by taboo transgression and ritually freed by angakut.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After wind, new ice, and hunger, the ice became strong enough for those able
    to walk to go sealing, and a seal was caught quickly.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tadlo told the men to bring the seal to the huts, have everyone eat it entirely
    without dividing it, keep the skin, bones, intestines, and blubber, put them into
    the skin, and cast them into the sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Sedna had told Tadlo to give these instructions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: On following days the men caught many seals, did not throw away skins, intestines,
    and bones, had fair weather, and thanked Tadlo for his help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The text introduces the next tale as an illustration that other infractions
    of taboos are punished in similar ways.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman cleaned a one-year-old caribou skin while people lived in snow houses
    on the ice near Aqba'qtung; in consequence, the floe broke up under their houses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stranded people carried cups, knives, harpoon-lines, and spears, were
    followed by their dogs, traveled for many days toward shore, suffered hunger and
    thirst, drank urine from cups, and many died on the ice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Only Okoko, his two wives Punyepung and Atatootjavung, Kouttoolaw, and Kouttoolaw’s
    wife Escemingeyeu survived and reached shore.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: At a lake, the survivors drank a little water, made themselves vomit repeatedly
    to expel the urine they had drunk, and then drank fresh water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Aniriaksa'pik heard the survivors’ account, was thankful because some of his
    friends had died, and gave Okoko a sledge and a dog to help him reach home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The passage states that man has two souls: one stays with the body and may
    temporarily enter a child named after the departed, while the other goes to one
    of the lands of souls.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage describes three heavens, one above another, with the highest described
    as brightest and best.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Souls are assigned to different destinations according to circumstances of
    death, including violent death, disease, drowning, suicide, and premature birth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Those who die by disease go first to Sedna’s house for a year; Sedna restores
    their souls to health and sends them up to the second heaven, with some uncertainty
    noted about the relation between the second heaven and Omiktu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Alipa'q is described as the lowest world, under the sea and near Sedna’s house;
    its seasons are reversed from earthly seasons because the earth turns over every
    fall and spring.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:16
  text: For three days after death, souls stay with the body; if a taboo is violated
    then, the transgression attaches to the soul, causes pain, and the soul roams
    the village seeking to harm those responsible.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: A burdened soul of this kind is called a tupilak and is said to bring heavy
    snowfalls, sickness, and death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: Those who can see the tupilak are called eoyew; when an angakok discovers
    it, angakut search with knives, stab it, cut off the transgressions, and the tupilak
    becomes a soul again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The knives used to stab the tupilak are seen by the people to be covered with
    blood.
  category: object
  evidence_refs:
  - ev:8
