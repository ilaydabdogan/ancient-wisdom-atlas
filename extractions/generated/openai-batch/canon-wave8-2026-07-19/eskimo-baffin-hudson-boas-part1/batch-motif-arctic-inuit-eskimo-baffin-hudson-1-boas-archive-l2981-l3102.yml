canonical_text:
  quote: ''
  summary: 'The passage describes games, toys, and carved objects among Baffin Land
    and Hudson Bay Inuit groups: stake games with ivory, a musk-ox dipper gambling
    game, a spinning ice top, wind-driven whalebone hoops, boys'' imitative seal-hunting
    play, women''s blind-man''s-buff, seal-flipper bone games, cup-and-ball, buzzes,
    dolls, ivory and soapstone carvings, and an ivory pendant representing a woman''s
    jacket.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In nugluktuq, men use pointed sticks to try to hit the hole in a suspended
    ivory piece; a knife is used as the stake, and the successful player wins it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women gamble with a musk-ox dipper turned swiftly around; the person away
    from whom the handle points wins the stake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large ice cake shaped like a top is spun by two men with sticks while one
    man sits on it; the game is often played at the floe edge while waiting for pack
    ice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man described as the butt of the others may be induced to sit on the ice
    top and spun until he becomes sick.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Crosswise-joined whalebone hoops are placed on ice or hard snow in the wind,
    and young men run to catch them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Boys play hunting seals with small harpoons, seal-skin pieces representing
    seals, and a seal hip-bone representing a blowing-hole in the ice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the boys' seal-hunting game, the boys blow like seals while moving the
    seal-skin pieces under the hip-bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boys' fathers make the small harpoons, and their mothers prepare the pieces
    of skin.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a blind-man's-buff game, one woman closes her eyes, gropes for another
