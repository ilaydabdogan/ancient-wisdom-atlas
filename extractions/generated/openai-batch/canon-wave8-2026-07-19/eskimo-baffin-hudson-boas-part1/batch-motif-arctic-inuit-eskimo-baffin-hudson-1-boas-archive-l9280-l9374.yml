canonical_text:
  quote: ''
  summary: 'The passage recounts several Cumberland Sound tales: Ulireyak is found
    alive under snow and ice after long starvation; a boy is drowned by a large salmon
    after his harpoon-line catches around his wrist; a floe-ice camp is broken apart
    by a swell, leading to drownings, thirst, over-drinking, and few survivors; and
    a starvation episode at Isortuqdjuaq involves Rating leaving to seek aid, a dog
    left as food, and the dog being taken and killed by neighbors.'
  language: English
  quote_policy: summarized
