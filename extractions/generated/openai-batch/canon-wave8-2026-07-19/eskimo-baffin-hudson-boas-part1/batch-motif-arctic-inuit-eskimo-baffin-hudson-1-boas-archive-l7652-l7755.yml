canonical_text:
  quote: ''
  summary: The passage includes the end of a tale about a man secretly obtaining seal
    meat from a hut of bones; a tale in which a boat crew asks land to open a channel
    and passes through with eyes shut; and a tale in which a dying woman passes through
    multiple animal bodies, is killed as caribou meat, is eaten by a woman, and is
    reborn as a girl who later recounts the experience.
  language: English
  quote_policy: summarized
