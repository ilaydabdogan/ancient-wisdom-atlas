canonical_text:
  quote: ''
  summary: The passage describes taboos following the death of certain sea mammals
    or a person, explains that only some sea animals are tied to Sedna’s fingers,
    reports an origin tradition for walrus and caribou attributes and their mutual
    avoidance, and lists regulations separating walrus, caribou, seal, and salmon
    through food, clothing, tools, seasonal activity, and transport restrictions.
    It also records a Frobisher Bay variant and notes that the origin story does not
    explain the whole taboo complex.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the death of sea mammals said to have originated from Sedna’s fingers,
    or after a person’s death, many domestic and craft actions are forbidden, including
    scraping frost, disturbing bedding, removing lamp drippings, scraping hair from
    skins, cutting snow for melting, and working iron, wood, stone, or ivory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are additionally forbidden in that context to comb their hair, wash
    their faces, and dry boots and stockings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a ground-seal has been killed, the regulations must be observed especially
    carefully because violations are said to make Sedna’s hands sore.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The walrus, white whale, narwhal, saddle-back seal, and fresh-water seal are
    said not to fall under the laws affecting the sea animals from Sedna’s fingers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The souls of the walrus and bear are said to be offended by the violation
    of other taboos.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A series of laws forbids contact between walrus, seal, and caribou.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: A tradition says that a woman created the walrus and caribou from parts of
    her clothing, first giving antlers to the walrus and tusks to the caribou.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When humans began hunting the animals, the walrus upset boats with its antlers
    and the caribou killed the hunter with its tusks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The woman called both animals back, gave the caribou’s tusks to the walrus,
    flattened the caribou’s forehead by kicking it, and put antlers on the caribou.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Since that time, walrus and caribou are said to avoid each other, and people
    must not bring their meat into contact.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:11
  text: People are not allowed to eat caribou and walrus meat on the same day unless
    they undress entirely or put on caribou-skin clothing that has not been used while
    hunting walrus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Winter clothing made of caribou skin must be finished before men go to hunt
    walrus, and work on caribou skins must stop when the first walrus is killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: When caribou hunting begins, winter clothing and the tent used during walrus
    hunting are buried and withheld until the following walrus-hunting season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Walrus hide or walrus-hide thongs must not be taken inland, caribou skin must
    not be cleaned while people are living on the ice, caribou bones must not be broken
    until after caribou season, and seal bones must not be given to dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: Similar but less stringent rules separate seal and walrus; people change clothing
    or strip naked before eating seal during walrus season.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The salmon’s soul is considered powerful; salmon must be cooked separately
    from other meat, at some distance from the hut, and boots used in walrus hunting
    must not be worn when fishing salmon.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:17
  text: No work on boot-legs is allowed until the first salmon has been caught and
    placed on a boot-leg.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:18
  text: Walrus, caribou, and salmon may enter the hut through the same doorway but
    must not be eaten on the same day.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:19
  text: Among the Nugumiut of Frobisher Bay, some combinations of seal, walrus, caribou,
    and salmon have different permissions and restrictions, including a requirement
    to change clothing before eating seal with walrus meat during walrus season.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:20
  text: If a person has been eating or hunting walrus, clothing must be changed before
    eating seal or going caribou hunting, otherwise the violations become fastened
    to the walrus’s soul.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:21
  text: At the start of caribou hunting, winter clothing and winter tents are buried
    under stones, new clothing and tents are made, and the old items are described
    as tabooed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: Caribou meat, salmon, and walrus meat must not be put in the same boat, and
    a boat carrying caribou meat or antlers during walrus hunting is said to be liable
    to be broken by the walrus.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:23
  text: The passage concludes that the walrus-caribou origin story does not account
    for all the taboos and may be a later explanation of existing customs.
  category: other
  evidence_refs:
  - ev:7
