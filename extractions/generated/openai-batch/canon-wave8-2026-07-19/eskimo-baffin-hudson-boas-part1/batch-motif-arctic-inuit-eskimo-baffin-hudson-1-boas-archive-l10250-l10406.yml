canonical_text:
  quote: ''
  summary: 'The passage concludes a tale involving Aako, Unakjew, Etookshakjwen, a
    marriage, a secret menstrual-blood hunting rite, famine, hunting success, and
    a calming of weather after the rite is disclosed. It then gives two short recorded
    tales: a dialogue in which a raven father instructs his son to watch for men,
    and an etiological Ptarmigan story in which a grandmother and grandson become
    ptarmigans and bird traits are explained.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Aggo, men sealing in kayaks paddle toward shore when a boat approaches;
    they are overtaken and killed, while Aako escapes inland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because Aako cannot be found, the boat party stays at the shore and gives
    meat to Aako's wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aako later comes to the huts for food and is invited by Unakjew to show how
    well he can throw spears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aako and Etookshakjwen exchange spear throws; after several dodges and misses,
    Etookshakjwen hits Aako, who reports a broken arm and soon dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Etookshakjwen marries a young girl, and before the couple leaves, her mother
    instructs her to put menstrual blood under the chin of game her husband catches
    and to keep the act secret from him and his brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young wife follows the instruction when Etookshakjwen and Unakjew each
    catch a bear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Padli in fall and winter, tempestuous weather leads to starvation; Unakjew
    is too weakened by hunger to rise, while Etookshakjwen continues searching for
    game.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Etookshakjwen finds fox dung and a hollow under drifting snow, digs into a
    bear's den, kills and skins the bear, and brings meat to the huts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the weather clears, Etookshakjwen climbs a hill, sees newly formed ice
    in the bay, catches a large old male ground-seal, modestly calls it little, and
    retrieves it with his dog-team.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Etookshakjwen's wife sings loudly and reveals that she used monthly blood
    on the first game after advice from her mother.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Immediately after the wife's disclosure, the weather becomes calm and pleasant;
