  text: Pisekse's son asked the people to reduce the noise in the singing-house and
    to wait until after the third night following his mother's death, but they ignored
    him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The old woman's soul is said to have arisen from her grave; deaths followed
    among the people, and later sickness is attributed to the disturbed soul becoming
    a tupilak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: After three days, one soul goes to a destination named as heaven or Sedna's
