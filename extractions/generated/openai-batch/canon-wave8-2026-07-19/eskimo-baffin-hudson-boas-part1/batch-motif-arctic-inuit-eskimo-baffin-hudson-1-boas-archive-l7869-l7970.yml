    for the women.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: An old woman and her adopted child live alone at Anarnitung; at night the
    stone-house wall opens, stars are visible through it, and the lamps nearly go
    out while the child hides under a blanket and pretends sleep.
  category: sequence
  evidence_refs:
  - ev:2
