canonical_text:
  quote: ''
  summary: 'The passage contains several adjacent tale episodes: armed men find a
    black spirit dead on the ice and later find women dead in a house; an old woman
    and child at Anarnitung experience a house-wall opening and a black being near
    a skin boat; another old woman and grandson experience a red star-like visitation
    with lamp and window disturbance; Akoto meets two named men associated with breath
    and wind whose names cure his sick daughter; and the opening of a tale titled
    “A Skull as a Good Omen” presents Kating/Rating warned by his wife that others
    intend to kill him.'
  language: English
  quote_policy: summarized
