canonical_text:
  quote: ''
  summary: The passage describes polar bear taboos, guardians of bear souls, three-day
    observances after a bear is killed, and broader rules by which taboo violations
    appear as darkness, vapor, or attachments on human and animal souls. Angakok figures
    can perceive and remove these attachments, and confession can release a child
    from illness. The passage also explains death-related contamination, first-seal
    restrictions, postpartum and premature-birth taboos, and a story in which Kunu
    conceals a premature birth, causing Naxojassi’s soul to be lost after she eats
    his seal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two named beings are said to guard the souls of bears and to live in a large
    beautiful iceberg.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bear’s soul is said to remain for three days near the place where it left
    the body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a male bear is killed, specified bear organs and men’s tools are hung
    on a pole for three nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a female bear is killed, the same bear organs and women’s tools or ornaments
    are hung up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: People are described as avoiding taboo transgressions during the three days
    after a bear’s death because punishment is believed to come quickly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Taboo transgressions are said to affect both game souls and human souls, making
    a person appear dark or surrounded by invisible vapor to sea mammals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A transgression may attach to a person’s soul and cause sickness; an angakok
    can see and remove it with the help of a guardian spirit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sins of parents, especially mothers, are said to attach readily to children’s
    souls; a mother’s acknowledgement of a taboo violation releases the child’s soul
    and the child recovers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Clothing, tents, and skins associated with a dead person are discarded because
    contact with them would make a hunter or hut appear dark to seals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Seal meat shared in a successful hunter’s hut must not be taken out, especially
    in the case of the first seal of the season, to avoid contact with persons under
    taboo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A woman not yet recovered after childbirth must eat only seals caught by her
    husband, a boy, or an aged man; otherwise vapor from her body may attach to seal
    souls and be taken to Sedna.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Premature birth must be announced publicly; concealment may contaminate other
    people and seals, and the transgression may be carried to Sedna.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the illustrative story, Kunu eats seal after concealing a premature birth,
    and the transgression is said to become fastened to the seal’s soul and to Naxojassi’s
    soul.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Aniksili performs an incantation and discovers Kunu’s concealed premature
    birth and the relation of her act to Naxojassi’s condition.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Kunu denies the event, is urged by Kudlu to confess, later confesses to Mikiju,
    and Naxojassi dies before the matter is fully disclosed.
  category: sequence
  evidence_refs:
  - ev:11
