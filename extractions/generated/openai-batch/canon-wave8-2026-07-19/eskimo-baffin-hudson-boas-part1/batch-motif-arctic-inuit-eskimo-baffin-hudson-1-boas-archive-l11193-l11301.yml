canonical_text:
  quote: ''
  summary: 'The passage first continues a tale in which a woman''s soul passes through
    several animal bodies, learns animal practices, returns through a seal and harpoon
    to a woman, and is later born as a child who remembers animal lives and explains
    a hunting custom. It then begins the tale of an old woman and her granddaughter
    during famine: the old woman uses a spell to call foxes, rejects other animals,
    kills the foxes, and later makes a harpoon and line from her waist strap and catches
    a seal after melting a hole in the ice with urine.'
  language: English
  quote_policy: summarized
