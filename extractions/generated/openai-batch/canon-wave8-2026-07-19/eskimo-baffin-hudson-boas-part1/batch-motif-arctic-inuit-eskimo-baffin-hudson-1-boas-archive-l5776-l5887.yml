canonical_text:
  quote: ''
  summary: 'Kiviuq escapes an old woman whose hut and implements hinder him, aided
    by the threatened arrival of his bear guardian spirit. He travels by kayak, rescues
    or helps small beings and objects, marries a young woman whose former husband
    is animate driftwood, prepares for return by obtaining mittens, discovers that
    the young woman''s mother has killed and impersonated her, and finally returns
    to his home village after a long absence. A new tale begins: the orphan boy Qaudjaqdjuq
    is mistreated by villagers, drifts away on broken ice, is again abused in another
    village, and calls on Brother Moon, who descends with a dog-team and wife.'
  language: English
  quote_policy: summarized
