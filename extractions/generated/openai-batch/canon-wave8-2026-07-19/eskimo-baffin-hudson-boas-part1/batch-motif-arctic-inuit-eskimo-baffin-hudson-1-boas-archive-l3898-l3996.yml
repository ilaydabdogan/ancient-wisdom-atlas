  summary: The passage recounts episodes in which Ekkoma predicts hidden caribou,
    finds water, and locates a boat fastening place; a separate tale of Analukasa
    and her lost son; descriptions of amulets, kayak and hunting rites, and a quarry
    offering; and a story in which pyrites on a whip repel a frightening approach
    of the moon or spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Koobelwakjew is dissatisfied and angry about returning to winter quarters;
    Ekkoma tells him that the next day he will cut many caribou on a small island.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a flat, low island where the crew did not expect caribou, many antlers
    are seen; the caribou enter the water, the boat follows, and the crew kills them
    all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the group is short of fresh water and finds only frozen water, Ekkoma
    says he will look and will find water; after he returns, the people find water
    at the place previously searched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ekkoma instructs that the water be given to the men and the boy, not to the
    women, saying it will disappear if given to the women; the women are to melt snow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When no good place is found to fasten the boat, Ekkoma says he will look;
    he finds a place described as like a pole for fastening the rope.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Analukasa’s son Kinguya leaves his mother’s house and is lost; Analukasa searches
    for him, loses her senses, and pieces of clothing return to her home singly while
    she does not return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bear teeth and pieces of skin used in an infant’s first cleaning are described
    as amulets; golden plover and Phalaropus rufus skins are pulled over the bow of
    a kayak frame for good luck.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before a hunter sets out, his wife or mother puts meat or blubber on the kayak
    to symbolize that he will bring back much meat and blubber.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For the same end, the hunter’s wife or mother throws meat into the water and
    spears it with the hunter’s harpoon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When breaking steatite from a quarry, people deposit a small present at the
    place because otherwise the stone would become hard.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pyrites are said to drive away spirits; in the tale, travelers returning with
    walrus meat become frightened as the moon appears unusually near and the stillness
    becomes dreadful.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: A traveler recalls his mother’s advice to put pyrites at the end of a whip
    when afraid of an approaching spirit; when he throws the whip forward, the pyrites
