    1896 is identified.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Cumberland Sound kayak is described as six meters long, with a flat bottom
    formed from a central wood strip and two curved lateral strips held by ribs sewn
    with sinew and thong.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The kayak includes ribs, gunwales, beams, a manhole, bow and stern projections,
    a keel-like continuation of the central bottom strip, and strengthened areas under
    and near the manhole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kayak framework is covered with taut seal-skins sewn with sunken stitches,
    and the skins are fastened to a hoop at the manhole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Deck lines, ivory pegs, a harpoon-line receptacle, an ivory hook, a small
