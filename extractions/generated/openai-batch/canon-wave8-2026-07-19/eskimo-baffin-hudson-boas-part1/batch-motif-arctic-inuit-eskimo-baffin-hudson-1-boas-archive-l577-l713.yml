literal_observations:
- id: obs:1
  text: Captain Comer is reported as saying that the Kinipetu are generally taller
    and thicker-set than the Aivilik and have more voluminous voices.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes greater cleanliness among the Kinipetu to their caribou-based
