  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A kayak from Savage Islands, Hudson Strait, collected by Lieut. R. E. Peary,
    is said to be practically identical in structure with the Cumberland Sound kayak.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Smith Sound kayak type is said to be similar to the Cumberland Sound kayak,
    but with three-piece ribs because wood steaming is not known to the Smith Sound
