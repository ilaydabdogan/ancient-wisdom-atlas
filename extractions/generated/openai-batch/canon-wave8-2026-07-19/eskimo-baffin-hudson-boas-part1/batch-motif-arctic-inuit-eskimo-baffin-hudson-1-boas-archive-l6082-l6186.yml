canonical_text:
  quote: ''
  summary: The passage contains the end of one tale, the complete tale titled “The
    Spider,” and the beginning of “Ijimagasukdjukdjuaq.” In the first, a coerced widow,
    her son, and her mother kill the murderer and escape over sea ice; the old woman
    breaks the ice with a little-finger gesture, fog rises, and the fugitives reach
    land beyond the sea, where later marriages, boat-making, and descendants are described.
    In “The Spider,” Kungoyah encounters Ai'sivang, who cuts, eats, and restores her
    eyebrow, is decapitated, becomes a spider, and is later seen restored. The final
    fragment introduces Ijimagasukdjukdjuaq as a cannibal who kills many people and
    plans to kill his wife.
  language: English
  quote_policy: summarized
