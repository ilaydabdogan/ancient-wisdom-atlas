canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Powmenakjwane loses his
    entrails and part of his heart to dogs and dies after failing to restore them;
    a tale in which an old woman abandoned with her granddaughter becomes a bear,
    carries the child to her parents, is refused entry, transforms the child and herself
    into bears, and kills the parents; and the beginning of a tale in which Analookashaw,
    an old woman and angakok, suspects Pupewalow of murdering her foster son despite
    his denials.
  language: English
  quote_policy: summarized
