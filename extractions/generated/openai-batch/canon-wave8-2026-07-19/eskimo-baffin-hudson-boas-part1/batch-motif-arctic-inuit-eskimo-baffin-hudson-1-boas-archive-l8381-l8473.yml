- id: obs:1
  text: People eating whale skin and meat in Powmenakjwane's hut noticed human entrails
    under the lamp and threw them outside, where dogs ate them; one dog ate part of
    the heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Powmenakjwane remained hungry while eating, used supernatural powers to discover
