canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound tales: Ningiu kills caribou
    by a still gaze, later dies after foretelling Kudlu''s first successful hunts;
    Owleyjen, an angakok, interferes with fire-making to obtain a lamp and oil and
    later finds a lost needle by unusual sight; Utsunang, aided by circumstances and
    by his angakok wife Ishamaloo, receives driftwood, seals, and a whale after Kunek
    refuses him wood.'
  language: English
  quote_policy: summarized
