canonical_text:
  quote: ''
  summary: The passage continues a tale in which a human husband and wife are protected
    among the Adlet by an old Adla and his two sons, undergo bodily procedures that
    make them exceptionally swift, receive dogs, and return home after sending a ground-seal
    back to the Adlet. A second tale tells of three Adlet visiting an Eskimo household
    at Abaqtung, where two male visitors are killed by the householder after one wife
    signals him, while the Adla woman escapes. A final brief account reports frightening
    nocturnal signs near Unoko and Makulu’s tents, followed by Adlet footprints.
  language: English with an embedded Latin passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man says his sons live in the hut, are chiefs of the other Adlet, and
    can protect the human strangers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two sons stand at the doorway and on the house floor, preventing other
    Adlet from entering after the newcomers are smelled; the other Adlet howl like
    dogs and later become accustomed to the humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman is led through the huts during a prescribed menstruation-related
    procedure until the passage says the bad blood is gone; after weakness and recovery,
    she becomes very strong and swift.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman races around a high hill with dogs and returns at the same time
    as they do; the passage says she can run as fast as a caribou.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man sits with his legs in a lake until numb; pieces are cut from his insteps,
    blood and white matter are pressed out, the wounds heal, and he becomes able to
    run as fast as the Adlet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the couple plans to go home, the two sons give them the dogs from the
    race and instruct them to send back their first ground-seal cut into a rope.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the return journey, fierce people pursue the couple; the man rides on a
    dog when tired, the wife runs swiftly, and they escape and reach their own country.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After reaching home, the man cuts a caught ground-seal into a rope and winds
