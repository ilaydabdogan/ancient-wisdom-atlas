canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which two girls are lured by
    toys into a witch's stone house, escape through a hole in the wall, and tell their
    village; the villagers capture and kill the witch and find her body made of flint,
    copper, lead, and beads, which later become flesh, bone, and teeth. It then begins
    the tale of Igimagajug, who mistreats his wife after a stillbirth, offends Nuliayoq
    so that seals are withheld, becomes a cannibal, and pursues his angakok wife after
    she escapes using a moss-filled clothing figure, a snow house, hiding places,
    and eventual flight toward her brother's village.
  language: English
  quote_policy: summarized
