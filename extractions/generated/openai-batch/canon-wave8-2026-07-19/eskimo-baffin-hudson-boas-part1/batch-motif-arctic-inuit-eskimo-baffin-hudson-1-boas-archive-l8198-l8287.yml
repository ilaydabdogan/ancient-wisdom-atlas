canonical_text:
  quote: ''
  summary: 'The passage recounts several traditions about angakut: Eterseoot, a female
    angakok, is accused by Kowertse of causing his wife’s death, survives his stabbing
    without wounds, and Kowertse later becomes sick and dies. A great angakok restores
    a dead hunter to life by incantation and breath. The same great angakok initiates
    a man into angakok status by requiring him to die, remain under stones for three
    nights, and then be revived through repeated blowing around the body. He also
    cures people by replacing diseased body parts with rabbit parts.'
  language: English
  quote_policy: summarized
