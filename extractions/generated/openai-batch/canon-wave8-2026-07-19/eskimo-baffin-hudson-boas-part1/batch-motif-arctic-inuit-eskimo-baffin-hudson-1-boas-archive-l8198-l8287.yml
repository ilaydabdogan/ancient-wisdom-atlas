- id: obs:2
  text: Eterseoot’s clothing is described as becoming finished after she cleans and
    cuts skins and places them under her bed, without sewing them herself.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kowertse believes Eterseoot caused his wife’s death and decides to kill her,
    while others warn him that she is a powerful angakok.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eterseoot says she knows why Kowertse has come; Kowertse says he intends to
    kill her and stabs or cuts her repeatedly with a knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After being carried into her hut and saying she cannot recover, Eterseoot
    rises, walks to her usual sitting place, and is whole with no visible scar or
    wound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kowertse becomes sick the day after the attack; Eterseoot states that he cut
    her while she remains alive and whole, and that he is sick though not cut or scratched;
    he soon dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great angakok, after hunters find a new grave, performs incantations and
    blows on the dead man’s face; the dead man begins to breathe and rises.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The restored man returns with the others, is said to have lived to be very
    old, and the angakok is praised for being able to blow life into the dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man seeking to become an angakok is told by the great angakok that he must
    die first; after death he is covered with stones and left on the ground for three
    nights.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The initiate’s frozen body is brought back, and the angakok circles it while
