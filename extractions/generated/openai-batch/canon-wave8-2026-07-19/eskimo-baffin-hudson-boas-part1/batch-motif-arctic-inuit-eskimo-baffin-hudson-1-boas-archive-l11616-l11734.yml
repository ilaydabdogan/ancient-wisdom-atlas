canonical_text:
  quote: ''
  summary: Itiqtaujaq seeks a wife, obtains one by withholding her boots, loses her
    when she flies away with their son using feathers, and follows a sung route toward
    the hole of heaven and the land of birds through several dangerous obstacles.
    He meets Eqaluqdjuq, who makes fish from wood and directs him to travel on a fish
    tail with eyes shut. Itiqtaujaq reaches the island where his former wife lives
    with another husband; the new husband and neighbors fly away using feathers, and
    Itiqtaujaq wounds the woman as eggs fall from her.
  language: English
  quote_policy: summarized
