  summary: The passage is an ethnographic comparison of Eskimo/Inuit tales, customs,
    and beliefs across Greenland, Cumberland Sound, Labrador, Alaska, and other regions.
    It notes shared tale distribution, names of heroes, retained complex tale structures,
    parallels in customs and beliefs, a shared beast fable, several recurring myth
    titles, origin legends, and the wide distribution of the myth of the Mother of
    the Sea-Mammals.
  language: English
  quote_policy: summarized
