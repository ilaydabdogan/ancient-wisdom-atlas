canonical_text:
  quote: ''
  summary: 'The passage contains several short tales: a woman escapes Ijimagasukdjukdjuaq
    by using heather-filled clothing and snow concealment, reaches her brother’s settlement,
    and the pursuer is killed in a dancing-house; a Nugumiut hunter is carried to
    sea by a monster gull, kills it, and returns using its feathers as a paddle; the
    giant Koodlowetto survives being dragged into an ice hole by a walrus and later
    breaks a sledge by sitting on it; and the giantess Inupassaqdjung catches whales
    and lifts boats, whale, and people in her hand.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is afraid of her husband, Ijimagasukdjukdjuaq, and resolves to flee
    after being sent to gather heather.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman fills her clothing with heather, sets the clothing up, and tells
    it to cry out if stabbed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the woman wishes for snow, snow falls deeply enough to cover her; Ijimagasukdjukdjuaq
    stabs the heather-filled clothing, which cries out, and then searches the snow
    unsuccessfully with his knife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When Ijimagasukdjukdjuaq leaves, the woman comes out from under the snow,
    empties the heather from her clothing, dresses again, and runs away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The woman rests inside an ice fox-trap, meets her brother there, and goes
    with him to his home among several huts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Ijimagasukdjukdjuaq pursues his wife, the people call him a cannibal
    and do not tell him that his wife is staying with them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the dancing-house the people set up supports and a tight-rope, and people
    swing while hanging by a stick to which their hands are tied.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: While Ijimagasukdjukdjuaq hangs from the tight-rope, his brother-in-law kills
    him with a harpoon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A Nugumiut hunter sees a monster sea-gull, which picks him up, puts him on
    its back, and flies toward the sea.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hunter repeatedly stabs the monster gull until he opens a vein; the gull
    dies and falls into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hunter pulls feathers from the gull’s wing, ties the quills together into
    a paddle, paddles the gull to shore, returns home, and is afterward no longer
    afraid of anything.
  category: sequence
  evidence_refs:
  - ev:5
