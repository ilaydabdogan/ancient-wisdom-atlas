canonical_text:
  quote: ''
  summary: The passage presents two Tadlo/Sedna-related famine accounts. In the first,
    Tadlo’s household suffers starvation and unsuccessful sealing until his sister
    confesses that she concealed a stillborn birth and threw the child into the sea;
    afterward Tadlo catches seals and whales, and he says Sedna withholds seals from
    people who do not confess. In the second, prolonged bad weather and starvation
    lead people to ask Tadlo to visit Sedna; his soul goes down to her while his body
    stays in the hut, and two women confess undisclosed menstruation and a premature
    birth, after which the angakok predicts better weather and food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tadlo, his wife Kunariak, his sister Panelo, and four named children lived
    at Kingawa.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During winter starvation, all four children died; Tadlo was lame and had to
    be dragged by his wife and sister to and from the seal-hole on a sledge, but the
    attempts were unsuccessful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tadlo asked his wife and sister whether either had concealed a stillborn birth
    or a time of menstruation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tadlo’s wife denied concealing either matter, while his sister confessed that
    she had given birth to a stillborn child, had not informed them, and had thrown
    it into the sea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the sister’s confession, Tadlo was taken with a kayak to an open winter
    water-hole, caught a seal, and the narrative states that his bad luck left him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tadlo said Sedna does not like people not to confess, and later said Sedna
    had seen the concealment and would not give them seals.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: After the confession, Tadlo caught more seals, later killed a whale on the
    beach, and then killed a number of white whales; the household collected meat
    and blubber.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that when bad weather and starvation continue for a long
    time, an angakok may visit Sedna to receive her instructions and wishes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a second account, early autumn winds broke forming ice, deep snow prevented
    sealing, and Tadlo was initially the only man able to hunt and share seals with
    the people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people asked Tadlo to visit Sedna to learn the cause of bad weather and
    starvation; his soul went down to Sedna while his body stayed in the hut, and
    his soul later returned.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: After Tadlo reported that Sedna identified two women as bad, one woman confessed
    she had not informed people when menstruating, and another confessed she had not
    told anyone about a premature birth; the angakok said conditions would improve.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
