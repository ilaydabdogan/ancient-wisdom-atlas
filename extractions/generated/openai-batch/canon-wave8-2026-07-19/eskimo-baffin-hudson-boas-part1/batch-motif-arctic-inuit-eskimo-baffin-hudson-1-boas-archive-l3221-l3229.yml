  quote: ''
  summary: The passage reports that people considered obnoxious may be disposed of
    by common consent. An angakok was judged hostile after another angakok discovered
    he had wished many Eskimo to die. The group decided to dispose of him; an old
    man stabbed him while he worked at an ice hole, and the others thanked the old
    man. The murdered man's wife later went to live with a young man.
