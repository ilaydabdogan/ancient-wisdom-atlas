candidate_motifs:
- id: motif:1
  label: Human or human-like figures transformed into birds
  taxonomy_refs:
  - shapeshifter
  basis: The passage describes a boy becoming a phalarope, an old woman becoming a
    loon, a boy becoming a snow bunting, and a grandmother becoming a ptarmigan.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The taxonomy label is broad; the passage gives transformations but does
    not state a general doctrine of shapeshifting.
- id: motif:2
  label: Prey escapes predator by verbal trickery at a threshold
  taxonomy_refs:
  - trickster_boundary
  basis: The Lemming is trapped outside her burrow but escapes by instructing the
    Owl to adopt a posture that opens the doorway.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly call the Lemming a trickster; the label
    is inferred from the escape action.
- id: motif:3
  label: Smaller animal defeats stronger-looking challenger
  taxonomy_refs: []
  basis: The Bear’s arm is larger, but it breaks during the contest with the Caribou’s
    smaller arm.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference directly matches this strength-contest
    pattern.
- id: motif:4
  label: Frightening story leads to child’s flight and transformation
  taxonomy_refs:
  - shapeshifter
  basis: The boy is frightened by his grandmother’s story, runs away, and becomes
    a snow bunting; the grandmother’s grief is followed by her own transformation.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The cause of transformation is not explicitly explained beyond the narrative
    sequence.
- id: motif:5
  label: Reciprocal decoration explains animal markings
  taxonomy_refs: []
  basis: The Raven makes the Owl’s feather spots with soot, while the Owl’s spilled
    lamp-oil explains the Raven becoming black all over.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage gives an etiological sequence, but no available taxonomy reference
    directly names animal-marking origins.
- id: motif:6
  label: Hungry animal family finds shelter and food inside a whale
  taxonomy_refs: []
  basis: The hungry fox family follows a scent to a dead whale, enters it, eats its
