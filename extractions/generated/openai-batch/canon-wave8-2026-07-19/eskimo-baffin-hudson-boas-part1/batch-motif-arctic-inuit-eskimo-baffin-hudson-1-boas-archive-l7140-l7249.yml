  summary: The passage contains the end of one transformation tale, followed by short
    tales in which a lemming escapes an owl by trickery, a caribou defeats a bear
    in an arm-strength contest, a frightened boy and grieving grandmother become birds,
    an owl and raven account for feather markings and raven blackness, and a fox family
    finds food and shelter inside a dead whale.
