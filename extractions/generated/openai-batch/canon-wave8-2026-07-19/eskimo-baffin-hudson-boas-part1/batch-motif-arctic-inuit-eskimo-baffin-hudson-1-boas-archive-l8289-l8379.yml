canonical_text:
  quote: ''
  summary: The passage contains two transformation tales. In the first, an old woman
    and her adopted daughter are left alone; the old woman becomes a man, marries
    the daughter, makes dogs and hunting gear from her body, learns to catch edible
    seals, and later reverts to an old woman in shame when a male visitor discovers
    her. In the second, Powmenakjwane, a harpooneer injured in a sealing accident,
    adopts a female role, reacts violently when his sex is challenged, and causes
    the deaths of his mother and adopted child by exposing the bones beneath his face
    skin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman and her adopted daughter lived in a stone house at a camping-place
    and were left alone when the people moved to a better hunting-ground for winter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: With nobody to hunt for them, the old woman transformed herself into a man
    and married the girl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old woman cut off toes and transformed them into dogs, and made a spear,
    harpoon-head, lines, and a sledge from parts of her body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The old woman caught seals in a sequence of places: near the lamp, in the
    doorway, at the porch entrance, in ground-ice, and on floe-ice; only the floe-ice
    seals were described as good to eat.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After they lived for some time by this hunting, the young woman was with child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A stranger arrived while the old woman was sealing and asked whose dogs, sledge,
    and seals they were; the young woman attributed them to her foster mother and
    told him what had happened.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old woman returned with a man's voice, saw the visitor's legs, knew a
    man was inside, felt ashamed, transformed back into an old woman, and needed help
    entering the house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Powmenakjwane was a harpooneer at Saunituqdjuaq; after a seal line fouled
    his penis and broke it, he gave up whaling and stayed ashore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Powmenakjwane decided to transform himself into a woman, made woman's clothing,
    put it on, and wanted a husband.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: When Powmenakjwane's mother said his clothing looked good but he had been
    born male, he became angry, tore the skin from his face so bone was exposed, and
    his mother died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: After his mother's death, Powmenakjwane adopted a child; the people were afraid
    of his supernatural powers and wished to kill him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: When the adopted child said Powmenakjwane had a penis and was no woman, Powmenakjwane
    tore the skin from his face and the child died on seeing the skull-bones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A woman loaned her husband to Powmenakjwane; later she saw Powmenakjwane exposing
    his privates to the sun, hid herself, denied seeing or telling anyone, and Powmenakjwane
    accepted her denial.
  category: sequence
  evidence_refs:
  - ev:10
