canonical_text:
  quote: ''
  summary: 'A sequence of short animal and transformation tales: an Owl tries to frighten
    a Lemming but is tricked into dancing while the Lemming escapes; Bear and Caribou
    test strength and Caribou wins; a grandmother frightens a child who becomes a
    small bird, then she becomes a ptarmigan with her belongings becoming body parts;
    Crow and Loon sew for one another, explaining speckling, blackness, and flat legs;
    an Owl is torn in two by two Rabbits running opposite ways around a boulder; a
    Rabbit deceives Fox with a false claim about a seal; men mistreat a Loon, whose
    revenge brings deep snow and starvation; and the beginning of a soul-transmigration
    tale has a dead old woman''s soul entering a raven and then a dog.'
  language: English
  quote_policy: summarized
