candidate_motifs:
- id: motif:1
  label: Deceptive prey escapes predator through staged performance
  taxonomy_refs:
  - trickster_boundary
  basis: The Lemming turns the Owl's predatory threat into a dance performance and
    escapes into its hole.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif is confined to this episode; the passage does not present Lemming
    as a general culture-wide trickster.
- id: motif:2
  label: Animal strength contest
  taxonomy_refs: []
  basis: Bear and Caribou formally test strength by locking forearms and pulling,
    with Caribou winning.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No broader origin or cosmological outcome is stated beyond the contest
    result.
- id: motif:3
  label: Fear-induced transformation into a bird
  taxonomy_refs:
  - shapeshifter
  basis: The child is so frightened that it becomes a small bird and flies away.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The child does not intentionally transform; the change is caused by terror.
- id: motif:4
  label: Grieving human becomes bird and belongings become anatomy
  taxonomy_refs:
  - shapeshifter
  basis: The old woman becomes a ptarmigan, while her pouch becomes the gizzard and
    her needle becomes a leg bone.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The available taxonomy has no separate etiological-anatomy category, so
    the shapeshifter reference is approximate.
- id: motif:5
  label: Animal appearance explained by tailoring and accident
  taxonomy_refs: []
  basis: Crow's sewing makes Loon speckled, Loon's lamp makes Crow black, and Crow's
    stone flattens Loon's legs.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an etiological animal-trait motif, but no exact supplied taxonomy
    reference matches it.
- id: motif:6
  label: Paired prey escape by dividing a predator's hold
  taxonomy_refs: []
  basis: Two Rabbits held in the Owl's feet run on opposite sides of a boulder and
    tear the Owl in two.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly frame the Rabbits' act as planned strategy.
- id: motif:7
  label: False trail deception
  taxonomy_refs:
  - trickster_boundary
  basis: Rabbit sends Fox backward along tracks with a false claim of a killed seal;
    Fox finds no seal and calls Rabbit a liar.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Rabbit's deception is situational and provoked by Fox's question.
- id: motif:8
  label: Injured animal retaliates through weather disaster
  taxonomy_refs: []
  basis: After men pluck a Loon's feathers, a later snowstorm and starvation are attributed
    to the Loon's revenge.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The mechanism by which the Loon causes the storm is not described.
- id: motif:9
  label: Soul transmigration into animal bodies after death
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: A dead woman's soul enters a raven and later a dog, making those animals
    successive bodies for her soul.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage is fragmentary at the end, and it describes soul transfer
    rather than a full resurrection narrative.
