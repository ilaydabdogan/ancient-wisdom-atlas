canonical_text:
  quote: ''
  summary: 'The passage contains three tale units: Okingwa releases a fox from a trap
    after recognizing it as his dead mother''s soul; Koocharoun murders a sealing
    companion, whose returned body publicly accuses him and returns to life; and a
    man fleeing a ground-rising spirit stops it by throwing a mitten before reaching
    Tininiqdjuaq.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Okingwa's mother had died less than two months earlier, and while he sat at
    a seal breathing-hole he heard a voice calling him by name.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The voice asked Okingwa to release it from a fox's trap and said the trap
    door fell after it touched grease taken from the speaker's oil-lamp.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Okingwa went to the trap, released the fox, and told others he would not kill
    it because he knew it was his mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Koocharoun and another young man went sealing; the companion caught a ground-seal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Koocharoun killed his companion, fastened the ground-seal to the man's body
    with a sealing-line, and threw both into the water, where they sank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Koocharoun returned home and said his friend had been lost, while the friend's
    father searched and his mother mourned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In winter the parents of the lost boy stayed away from the dancing-house because
    they were still mourning.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the dancing-house, the man Koocharoun had killed appeared, accused him
    by name of tying him to the ground-seal and sinking him, and disappeared into
    the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After a second appearance of the drowned man, Koocharoun followed him and
    was last seen by the soles of his boots.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The murdered man returned, stayed in the dancing-house, told how Koocharoun
    had murdered him, and was said to have returned to life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: An old woman was sent to tell the parents that their son was in the dancing-house;
    after initial anger, they went and saw him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The father sent a sledge loaded with property downhill so the people could
    gather the scattered goods, and the son went home with his parents.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Tornait tale, a man traveling with two wives and an adopted daughter
    made a snow house while the women arranged the inside and trimmed lamps.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The man heard laughter from the women but received no answer when he asked
    why they were laughing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: When he cut a hole for the doorway, he saw the women crouched with arms over
    their heads and a terrible pointed-headed being that had risen from under the
    ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The man fled with his dogs and sledge; the spirit pursued and gained on them
    until he threw a mitten, whereupon the spirit stopped and he reached Tininiqdjuaq.
  category: action
  evidence_refs:
  - ev:10
