canonical_text:
  quote: ''
  summary: 'A sequence of Cumberland Sound tales describes winter and spring hunting
    events: hunters kill whales or killer-whales found in ice holes or stranded on
    shore; storm-broken ice creates unexpected seal abundance; Nutaakdju is seen moving
    and appearing like a killer-whale while towing one, though he denies being one;
    and men stranded on breaking ice leave an exhausted young man in a snow house
    before reaching shore.'
  language: English
  quote_policy: summarized
