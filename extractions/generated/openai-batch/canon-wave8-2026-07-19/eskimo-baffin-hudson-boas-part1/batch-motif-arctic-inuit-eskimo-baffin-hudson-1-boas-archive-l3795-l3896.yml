canonical_text:
  quote: ''
  summary: The passage describes the first angakok seeing another sky containing souls,
    proving his status through a bound soul-flight, and lists powers and duties attributed
    to angakut. It also describes head-lifting divination with a dead person’s soul,
    witchcraft affecting illness and seal hunting, and a story in which Ekkoma, whose
    mind is deranged, correctly identifies where caribou are present.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man says he sees another sky containing souls of those who have left, including
    birds, seals, ground-seals, whales, caribou, walrus, and every known animal that
    has lived.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person is identified as the first angakok and is said to see souls going
    and coming when other persons cannot see them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first angakok is bound at the ankles, thighs, neck, and hands; after people
    shut their eyes, they hear creaking, his soul goes upward, returns, and he says
    his soul went through an unseen hole in the roof.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Angakut are believed to have powers including killing by wish, glance, or
    terrifying appearance; knowing thoughts and game locations; preventing a fire-drill
    from producing fire; finding lost objects; and accomplishing work by wish.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Angakut are said to see human sins, the dark color of objects that have touched
    dead bodies, and vapor from menstruating women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Angakut are said to cure the sick, propitiate Sedna and offended animal souls,
    and give a child the name belonging to its soul in a previous existence when the
    current name displeases that soul.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In head-lifting divination, a thong around the head of a person lying near
    the patient is attached to a stick held by an angakok; when a summoned dead soul
    is present, the head becomes too heavy to lift and answers questions by heaviness
    or ease of lifting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says people believe in witchcraft by which a divorced wife may
    make a man sick, an angakok may bewitch enemies, and seals may be diverted away
    from a hunter’s hole toward the bewitcher’s own hole as if by a small hook.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: People whose minds are deranged are believed to have supernatural powers;
    Ekkoma, who is described as deranged and long without food, repeatedly says caribou
    are present where others consider moving elsewhere, and his statements prove true.
  category: sequence
  evidence_refs:
  - ev:7
