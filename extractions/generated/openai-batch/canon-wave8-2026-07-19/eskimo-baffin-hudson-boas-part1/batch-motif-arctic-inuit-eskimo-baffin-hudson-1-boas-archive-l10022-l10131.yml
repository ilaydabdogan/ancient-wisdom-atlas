- id: motif:2
  label: detected murder attempt in a host’s dwelling
  taxonomy_refs: []
  basis: Inutalu visits Koalwaping with hostile intent, uses a request for whale-skin
    as the setting for a possible attack, and is stopped when Koalwaping’s wife warns
    her husband.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage states Inutalu had designs on Koalwaping and that the wife
    perceived a stabbing attempt, but the attack does not proceed.
- id: motif:3
  label: preemptive communal killing of a feared murderer
  taxonomy_refs: []
  basis: People who know Inutalu as a bad man decide in advance to kill him, distract
    him by shouting about whales, seize him, and stab him with sharpened knives.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an evidence-based narrative pattern in the passage, not linked
