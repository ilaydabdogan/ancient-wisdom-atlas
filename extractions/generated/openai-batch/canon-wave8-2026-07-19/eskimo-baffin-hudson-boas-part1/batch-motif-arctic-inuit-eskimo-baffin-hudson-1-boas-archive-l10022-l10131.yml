canonical_text:
  quote: ''
  summary: 'The passage first closes an episode about Apartsoo and his wife by describing
    the removal of their corpses and the cutting up of their belongings. It then narrates
    how Inutalu, described as a murderer, tries to attack Koalwaping, is later killed
    and dismembered by people who fear him, and how his mother responds. A further
    sequence describes feared enemies of Koomungaping: Ooryew and Kooleegowya watch
    his doorway but withdraw; Koomungaping and a friend lure Ooryew with young dogs
    and kill him; then Koomungaping and allies ambush the returning Kunooshaw after
    gulls gather over the blood track leading to Ooryew’s hidden body.'
  language: English
  quote_policy: summarized
