canonical_text:
  quote: ''
  summary: The narrator describes salmon procurement at a stream using a dam and spears,
    an exchange of stored salmon, and an encounter with local Inuit people. A later
    landing near an abandoned establishment records food caches, tools, winter huts,
    stone piles, possible burial-associated objects, an adult and child burial with
    coiled bodies, a snow buntin nest in the child’s tomb, visitor gift deposits,
    and beach materials including flints and agates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salmon were procured from a rapid streamlet where a dam had been built, and
    fishermen speared the fish as they advanced upstream.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The local people opened their salmon stores, supplied fish to the visitors,
    and were described as grateful and not troublesome.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that the people lacked iron and were extremely poor, and
    he infers that they may not previously have seen Europeans; Neeakoodloo is described
    as placing himself in the visitors’ power.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near a later landing place were remains of a large Esquimaux establishment
    with stored provisions deposited in small buildings.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A high stone pile near the beach held a broken bow, a flint arrow and knife,
    a rough spear, and fragments of skin and walrus flesh; the narrator could not
    discover a grave there.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Near a small peat hut was an inverted limestone cooking pot; beneath it were
    a flint knife, a piece of ivory, and a short splinter of decayed driftwood.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bone sledge runners and long bone spars, blackened with soot, were found,
    along with canoe-supporting stone piles and dilapidated winter huts.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A small stone pile covered tools and wood pieces, including one piece shaped
    like a canoe, and a nearby larger mound contained a dead person sewn in skin and
    coiled up.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A third stone pile covered the coiled body of a child; a snow buntin nest
    was found on the child’s neck or breast, and both graves lay northeast and southwest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Before returning to the ship, the narrator placed boarding-pikes, men’s and
    women’s knives, and other useful articles on huts and stone piles.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The beach contained fossils, madrepore, flints, and veined agates; the narrator
    observes that the natives used dark-colored flints for weapons.
  category: object
  evidence_refs:
  - ev:11
