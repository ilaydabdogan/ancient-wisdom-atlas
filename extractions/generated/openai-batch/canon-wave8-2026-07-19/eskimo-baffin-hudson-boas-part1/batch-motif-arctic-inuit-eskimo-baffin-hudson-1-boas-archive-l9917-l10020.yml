canonical_text:
  quote: ''
  summary: 'The passage contains several short narrative episodes: Pudlookshine and
    his brother-in-law kill Kunikjwak''s attacking boat crew from stone forts and
    wound Kunikjwak; the unusually tall Seacolearseawetto takes his tall sister as
    wife, hunts with oversized equipment, takes seals from others, and is killed by
    companions through a binding ruse; Seacolearseawetto''s wife repeatedly asks about
    his absence and is falsely told he is alive; Apartsoo, a quarrelsome man, is stabbed
    by villagers after threatening retaliation over refused caribou-skins and then
    fatally stabs his wife when she enters to help him.'
  language: English
  quote_policy: summarized
