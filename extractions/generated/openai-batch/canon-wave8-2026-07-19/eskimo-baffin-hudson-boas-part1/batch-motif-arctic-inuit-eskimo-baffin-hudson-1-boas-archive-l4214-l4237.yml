  text: For three days after a death, various kinds of work, movement of animal products,
    lamp cleaning, women's hair-combing and face-washing, and sexual intercourse are
    forbidden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After burial, relatives visit the grave and talk among themselves as they
    would at home, treating the dead person as if still among them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Relatives praise the deceased and say that if one of the women has a child,
    the child would be named after the deceased.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Relatives promise to return after catching seal, caribou, or salmon and to
    bring something to the deceased.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After catching game, relatives eat part of it at the grave and leave a portion
