canonical_text:
  quote: Mangegjatuakdju lives underground in a gravel-bank.
  summary: The passage first tells of Mangegjatuakdju, an underground-dwelling old
    woman connected with disappearing village children. Two girls and a carried child
    enter her house, see human remains, escape through a roof hole, and report to
    the village. Men return with a rope, trick her, drag her from the hut, and kill
    her; her claims that her organs are made of hard or valuable materials are disproved
    when they cut her open. The passage then begins a separate tale in which families
    at Qenertung and Ixa'luin hunt seals together, and a host who shares and carves
    a seal is attacked and killed by other men.
  language: English
  quote_policy: quoted
