literal_observations:
- id: obs:1
  text: A person may receive angakok power from an old angakok through hands placed
    on the head; others become great angakut after worms eat flesh from their forearms
    and the wounds heal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Angakut, with guardian spirits, are said to discover causes of disease, famine,
    and other misfortunes and bring relief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Named forms of guardian spirits include a large bear with a man’s head, a
    bear living underground, and a being with the head of a walrus.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When an angakok prepares to summon a guardian spirit, the lights are extinguished.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: During trance the angakok is said to see through the back of his head and
    discover what is hidden from ordinary sight.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When malignant spirits are seen, the angakok summons a guardian spirit to
    help overcome and drive them away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: An angakok asked to drive away sickness must be paid in advance, because this
    pleases the guardian spirit and encourages it to respond.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Incantation equipment includes a protective string tied around one foot, small
    skin jackets with colored ribbons later deposited in lonely places for guardian
    spirits, and a drum made from a wooden hoop covered with deer-hide.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: One angakok fasted all day while trying to cure a child, in order to please
    his guardian spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In famine, an angakok and a huge bear-shaped guardian spirit travel toward
    Nuliayoq’s abode; a tupilak tries to prevent them, is vanquished, and Nuliayoq
    sends good weather and many seals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man watching at a seal-hole on a full-moon night is called by a man on a
    sledge, rides upward through the air, and reaches ice walls with an entrance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Inside the entrance the visitor sees a house with a woman and a little boy;
    he hides the offered meat and does not eat it because he fears he might not be
    able to return.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After returning from the moon, the visitor eats seal liver, later becomes
    sick, and recovers after an angakok discovers that the offended moon objected
    to the seal-liver eating.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In Captain Comer’s incantation account, meat is given for a Kinipetu angakok’s
    guardian spirit, people are arranged in a snow hut, some women cover their heads,
    the angakok wears a waist strap with caribou-skin strips for the guardian spirit,
    and hatchets are hidden.
  category: sequence
  evidence_refs:
  - ev:11
