  summary: The passage describes angakok acquisition of power, guardian-spirit assistance
    in curing and divination, ritual implements and offerings, a famine-time journey
    to Nuliayoq, a moon-visit narrative involving ascent by sledge and food danger,
    and part of Captain Comer’s account of an incantation to locate hunters.
  language: English
