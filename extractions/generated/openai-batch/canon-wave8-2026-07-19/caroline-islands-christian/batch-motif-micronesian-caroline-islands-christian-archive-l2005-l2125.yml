canonical_text:
  quote: ''
  summary: A first-person travel narrative describes shipboard life en route to Yap,
    the sighting of Yap and entry through a reef passage into Tomil Harbour, contacts
    with traders and station agents, a short stay ashore, observations on Yap people,
    language, canoes, and a later departure toward Guam. The passage ends with Senor
    Marina giving historical facts about the Marianne or Ladrone group and the Chamorros.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator reports shipboard conditions, fellow passengers, the newly appointed
    Governor of the Mariannes, a Ponapean trader named Captain N., the captain's dog
    Coco, and English-speaking engineers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coco is described as a fat, short-haired dog that growls at the vessel's lurches
    and at spray coming through the anchor chains.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the seventh day the ship sights Yap, passes through a narrow reef-passage,
    enters Tomil Harbour, and is approached by native canoes and shore boats.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Captain O'Keefe is absent, while Joe Mitchell acts as his foreman and agent;
    E. Oppenheim-Gerard receives the narrator and invites him ashore.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator says table-talk produced remarks about Yap people and the Yap
    language, which he describes as connected with several Asian and Polynesian linguistic
    elements.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Theodoro prepares the camera and later takes a photograph of a group of natives,
    including three women from the Fe-Bai or Lodge at Rul.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:7
  text: At the steamer's whistle the narrator returns aboard and promises to revisit
    the host on the way back from Ponape; he says fuller notes on customs, traditions,
    folklore, marine life, flora, and geography are reserved for a later chapter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator observes that Yap people are darker than Polynesian people known
    to him and that their canoes have high bow and stern, fish-tail ornamentation,
    and a wide heavy outrigger for long sea-going voyages.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The steamer leaves at noon for Guam, following a mail-steamer track intended
    to avoid dangerous reefs around the Central Caroline islets.
  category: sequence
  evidence_refs:
  - ev:7
