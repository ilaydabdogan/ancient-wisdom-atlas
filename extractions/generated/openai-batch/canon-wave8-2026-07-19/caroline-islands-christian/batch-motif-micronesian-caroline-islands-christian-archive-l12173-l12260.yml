canonical_text:
  quote: ''
  summary: The narrator and E. discuss two violent Pacific trading tragedies. During
    a fiesta settlement scene, natives in holiday dress pass by, Cycas palms stand
    before houses, Mass has ended, and a procession appears with priests, choristers,
    crucifixes, images, native converts, boys dressed as angels, schoolgirls, officers,
    and native musicians. The festival then becomes disorderly, with drunkenness,
    attempted theft, barter of ornaments and relatives for wine money, and fighting.
    The narrator and E. leave for Tarrang with bartered objects. The next day the
    ship Santa Cruz arrives, O'Keefe greets them, and Sonsorol and St David's lads
    come aboard as workmen after storms damaged their home islands' coconut resources.
  language: English
  quote_policy: summarized
