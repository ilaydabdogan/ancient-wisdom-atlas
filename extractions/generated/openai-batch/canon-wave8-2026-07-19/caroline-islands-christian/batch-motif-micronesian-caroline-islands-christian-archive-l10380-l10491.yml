canonical_text:
  quote: ''
  summary: The narrator describes travel arrangements in Yap, structures at Iloech,
    collecting specimens near Elik, a comic but painful encounter between Fatumak
    and a sea-eel, warnings about currents and sharks near Goror Point, Juan's tales
    of lovers who leapt from a cliff and of a spectral white deer that lured a hunter
    into danger, and Lewis's information about Caroline Island star names and navigational
    knowledge.
