canonical_text:
  quote: ''
  summary: The narrator leaves Paniau and travels by boat along the Kiti coast toward
    Colony, describing coastal landmarks, Chokach’s Great Cliff, local sacred or chiefly
    places, a High Priest who preserves old names and ceremonies, the island’s basalt
    cliffs, villages, groves, harbor traffic, farewells, and a final night ashore
    with Dr. Kubary and Kaneki.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traveling party leaves the little green island, runs down the Kiti coast,
    stops at Ronkiti, and notes Nanapei’s distress over the illness of his mother
    Nalio, who died shortly afterward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A high tide allows the party to pass over sand and mud banks; they later rock
    in calm water in the lagoon off Tauak Island before a breeze carries them toward
    the Great Cliff of Chokach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The party sees the mail steamer Correo heading toward Ascension Bay and rows
    onward, passing Tolotik and limestone blocks in the boat passage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Paip-Alap or Great Cliff of Chokach is described as a sheer bluff nearly
    a thousand feet high, with dense woods and a huge Tupap or Umbrella Tree on a
    small promontory.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Nallaim or High Priest of Chokach is described as an aged and wise patriarch
    who knows the names of kings and heroes of old and ceremonies due to the ancient
    gods of the land.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nearby named places include the Tanipach, described as the abode of the Wachai;
    a small Catholic chapel; and the Nach and dwelling of the Nanekin, identified
    as the scene of the 1887 massacre of Ensign Martinez and his party.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cliff face is described as columnar basalt with colored rock strata, volcanic
    soil, ledges of herbage, and summit vegetation including pandanus and native gardenia.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chokach is described as having rocky masses, an obelisk-like peak, a basalt
    wall, mangrove swamps, a central cleft crossed by a narrow path, dwellings in
    clearings, and extensive groves of breadfruit, banyan, Chatak, tree-gardenia,
    and mango.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: After reaching Santiago wharf, the party packs for departure, pays farewell
    visits, and the narrator spends his last night ashore with Dr. Kubary while Kaneki
    sleeps nearby.
  category: sequence
  evidence_refs:
  - ev:7
