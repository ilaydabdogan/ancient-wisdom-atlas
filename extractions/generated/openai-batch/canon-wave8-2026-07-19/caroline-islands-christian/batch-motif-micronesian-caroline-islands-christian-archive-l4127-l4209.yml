canonical_text:
  quote: ''
  summary: The passage describes architectural observations at Nan-Tauach, especially
    a large Aio or Banyan tree rooted in masonry and damaging the wall. The party
    moves around the ruins and is later summoned by King Paul after reports of their
    clearing work spread. Fishermen first attribute the cleared jungle to devils,
    and the narrator reports a tradition that spirits of slaughtered Builders entered
    trees growing where a battle was fought. King Paul also interprets a find as hidden
    precious metal and demands a share, while Theodoro and Chetan flee.
  language: English
  quote_policy: summarized
