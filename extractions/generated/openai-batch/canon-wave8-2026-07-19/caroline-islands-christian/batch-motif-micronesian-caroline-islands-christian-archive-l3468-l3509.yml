canonical_text:
  quote: ''
  summary: The narrator visits a kava festival at Nantiati, meets Joe Kehoe, discusses
    plans for exploration, then returns to Ponatik and encounters Chau-Tapa, also
    called Obadiah, a native preacher from Aru who teaches Mortlock vocabulary. The
    narrator describes Obadiah’s missionary history, religious speech, contradictory
    character, hospitality, and fondness for alcohol. The passage ends with final
    arrangements for a third expedition.
  language: English
