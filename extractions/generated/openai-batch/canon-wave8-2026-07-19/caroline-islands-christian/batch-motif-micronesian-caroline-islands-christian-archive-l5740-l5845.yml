canonical_text:
  quote: ''
  summary: 'The passage is a travel account of a voyage to Mokil and a description
    of the island group. It includes two explicit traditional or belief elements:
    a blue starfish is said among Ponapeans to be connected with the Rain God, and
    removing it from the water is said to bring heavy rain; and two large blocks near
    Kalap beach are explained by a tradition in which Ani or demi-gods, in the form
    of a pair of frigate-birds, brought them from the eastward and were the mythical
    ancestors of the Mokil islanders.'
