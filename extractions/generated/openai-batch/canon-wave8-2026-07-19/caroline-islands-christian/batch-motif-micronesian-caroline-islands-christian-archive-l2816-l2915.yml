literal_observations:
- id: obs:1
  text: The Ponapean is described as alternating energetic work with long spells of
    laziness, while also showing ingenuity, superstition, practicality, sharp senses,
    and keen observation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Ponapeans are reserved with strangers, faithful friends and
    hosts when confidence is won, and deceitful or intricate in dealings with enemies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Reconciliation etiquette is described as involving a present, an apology,
    and acceptance of a piece of sugar-cane by the aggrieved party.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says lack of filial piety or natural affection brings stigma and
    the curse of ancestral spirits here and hereafter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The turtle is reserved for chiefs, while eels are not eaten and are regarded
    with great horror under names meaning or glossed as dreadful.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women are described as making mats, shutters, baskets, thatch bundles, girdles,
    oils, cosmetics, fetching water, lighting fires, building stone ovens, preparing
    food, and doing household duties.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women are also described as assisting men in outdoor labor and accompanying
    husbands and relations into battle in wartime.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the marriage ceremony, the girl is brought into the house and seated while
