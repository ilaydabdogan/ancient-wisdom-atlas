canonical_text:
  quote: ''
  summary: The narrator describes several days at Tarrang collecting traditions and
    vocabulary from Matuk of Gochepa, a man from Mokomok, and Lirou of Tomil. They
    discuss astronomy, gods and heroes, the origin of fire and tools, money, fish-pens,
    Yalafath the Creator, Luk the spirit of Evil, wars, and a vanished northern land
    called Sepin or Saiping. The narrator also describes fieldwork methods, exchange
    of tales from Ponape and Kusaie, and a Spanish colonial fiesta for the Feast of
    the Conception of the Virgin Mary.
  language: English
  quote_policy: summarized
