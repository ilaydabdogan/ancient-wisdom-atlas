literal_observations:
- id: obs:1
  text: Adoption is described as universal; descent is traced through the mother;
    members of the same Tipu or clan cannot marry; a wife must be taken from another
    division.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A suitor serves for his future wife in the house of his prospective father-in-law,
    and the effort may fail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women tattoo arms and lower limbs; women use a basket-frond design,
    and other designs include circles, eight-pointed stars, crosses, and unusual forms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men inflict knife-gashes and burn deep scars on their breasts and arms
    to show contempt for pain; the passage also describes Lekelek as excision of one
    testicle at marriageable age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dead are buried with ceremony and solemn funeral speeches, and people
    are unwilling to repeat the name of a dead ancestor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that worship of Am, or deified ancestors, together with
    zoolatry or totemism, is central to Pohnpeian faith.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Villages, valleys, hills, streams, families, clans, tribes, natural phenomena,
    and life events are said to have associated spirits, gods, deities, or master-spirits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The swamp, reef, mountain, and inland hanging woods are described as populated
    by many spirits, some beneficent and most malignant.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ani are honored under the form of a special bird, fish, or tree in which they
    are supposed to reside and with which they are identified; these forms are called
    Tan-waar, meaning canoe, vehicle, or medium.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Examples of spirit media include the chestnut tree for the god of thunder,
    the blue starfish for the god of rain, the shark for the god of war, and the Lukot
    or native owl for Li-Ara-Katau.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pohnpeian mythology is said to include a submarine Paradise called Packet,
    with perpetual feasting, lovely sights, and sweet odors.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pohnpeian mythology is said to include a subterranean Tartarus called Pueliko,
    a place of mire, cold, and darkness guarded by two grim female forms, Lichar and
    Licher, one holding a glittering sword and the other a blazing torch.
  category: setting
  evidence_refs:
  - ev:7
