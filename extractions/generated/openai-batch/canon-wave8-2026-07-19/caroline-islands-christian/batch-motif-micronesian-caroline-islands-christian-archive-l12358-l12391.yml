  quote: '"an ancient judge called Magaragoi introduced the distinction between freemen
    and slaves"'
  summary: 'A travel narrator describes a local dispute after the Saturnus departs,
    then reports Matuk of Gochepd''s statements about Yap social classes: Pilungs
    as old settlers, Pimlingai as castaways from other islands, and an ancient judge,
    Magaragoi, who introduced the freeman/slave distinction through the Roai comb
    of mangrove wood. The passage ends by noting Lirou''s arrival with further Yap
    traditions.'
