literal_observations:
- id: obs:1
  text: The Ak husking-stick is described as a stout mangrove-wood stake pointed at
    both ends and driven into the ground at an angle for tearing the fibrous outer
    envelope from coconuts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same wood is described as being used for digging or planting sticks and,
    when cut longer, as poles for punting canoes in shallow lagoon water.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ponapeans are said to have formerly used a loom called Tantar to weave
    banana fiber and Nin-tree bark into narrow girdles and women's petticoats; the
    machine is said to be long out of use.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Native houses are described as being swept with Kap-en-nok brooms made from
    the central ribs of coconut leaflets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A house of a person of distinction is said generally to contain a large sea-chest
    or smaller camphor-wood box used to store possessions.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Carpentry and boat-building implements listed include a cross-cut saw, grindstone,
    steel gimlet, older Murex-shell borer, hammer or mallet, wedge or nail, cinnet
    fastenings, wooden trenails or bolts, and iron nails introduced by traders.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boat-builder is said to prefer the modern steel gimlet to the earlier
    sharp-pointed Murex-shell borer used for piercing boards and planks in canoe and
    house-building.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tikak bone or shell needle is described as used for sewing palm-leaf thatch,
    pandanus sleeping mats, and ancient pandanus-leaf mat-sails.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says pandanus leaves for ancient mat-sails underwent preliminary
    steaming in an earth-oven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ponapean housewives are described as using a fine tortoiseshell hackle to
    comb banana fiber for belts garnished with pink and white shell beads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator characterizes Ponapeans as having adaptive powers in using plants,
    lagoon resources, and reef resources to provide food, shelter, and clothing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that Ponapean terms for axe and knife are historically
