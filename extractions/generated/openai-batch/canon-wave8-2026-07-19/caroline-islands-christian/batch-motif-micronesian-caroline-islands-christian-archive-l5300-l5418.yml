  summary: The passage inventories Ponapean household and craft implements, including
    husking-sticks, looms, brooms, storage chests, carpentry and canoe-building tools,
    needles, mats, belts, shell adzes, and shell-gouges. It also comments on local
    resource use, replacement of older shell and plant-fiber technologies by metal
    tools introduced by traders, and several linguistic comparisons with other traditions.
  language: English
