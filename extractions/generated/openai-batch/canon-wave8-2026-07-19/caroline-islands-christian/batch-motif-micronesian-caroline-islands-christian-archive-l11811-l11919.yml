  text: O'Keefe's Sonsorol boys on Tarrang are described as having been brought from
    a famine-stricken island between the Pelews and Dutch New Guinea, and as cheerful,
    good-humoured, somewhat lazy, but willing to work when called upon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports an earlier incident in which Sonsorol boys, drunk on stolen
