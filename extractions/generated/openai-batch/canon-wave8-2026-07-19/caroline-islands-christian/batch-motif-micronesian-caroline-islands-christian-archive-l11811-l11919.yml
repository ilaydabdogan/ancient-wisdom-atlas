canonical_text:
  quote: ''
  summary: A first-person travelogue passage describes late-night Sonsorol language
    work in Pilau, return by tide to Tarrang, observations of relocated Sonsorol boys
    and a conflict involving a Chinese cook, then a visit to Tomil to meet chief Lirou,
    observe money-stones and settlement structures, and measure the chief's house
    during a period of dancing and drinking.
  language: English
  quote_policy: summarized
