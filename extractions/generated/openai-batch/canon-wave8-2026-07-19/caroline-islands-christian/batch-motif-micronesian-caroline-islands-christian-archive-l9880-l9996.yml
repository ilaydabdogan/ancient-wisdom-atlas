  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The small boys disperse after the first part, and an interval follows for
    betel-nut chewing, native cigarettes, and sweet coco-toddy.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The second performance begins with rhythmic hand-clapping and a higher, shriller
    chant; a tall central dancer wears many split and twisted coconut leaflets like
    streamers, and the sequence ends in a war-cry.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A shower of rain drives the observers indoors for a while, while the bonfire
    continues burning.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The third and last scene is described by the narrator as resembling a Maori
    Haka or war-dance, with dancers standing in line, chanting, trampling, stamping,
    and turning front and flank.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The final dance is named after the Galuf or Iguana, a figure said to be prominent
