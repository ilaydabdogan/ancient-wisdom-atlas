canonical_text:
  quote: ''
  summary: A traveler is taken by Fatumak to a night dance-house gathering in Yap.
    Men perform several firelit chant-and-dance sequences with palm-leaf ornaments,
    body slapping, stamping, war-cries, and a central decorated dancer. The final
    dance is said to resemble a war-dance and is named for the Galuf or Iguana, a
    legendary thief whose stealthy movements are imitated. Fatumak explains that thieves
    may pray to the god Luk for help avoiding capture, though a thief may still be
    punished if Luk does not hear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fatumak appears in the evening to take the narrator to see a native dance
    near Ngiri.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The route to the dance-house crosses small stone bridges and single felled
    palm-trunk bridges over ravines or muddy pools.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: About forty people are assembled at first, with more arriving and sitting
    on mats on sandy soil.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dried coconut shells and dry husk are piled into three heaps to be set on
    fire for illumination.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Performers strip palm-frond leaflets, twist them into horn-like head ornaments,
    and bind similar leaflets around legs, ankles, and wrists.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A row of about twenty male dancers forms, with a cluster of small boys at
