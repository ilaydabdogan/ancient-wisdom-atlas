  summary: The narrator describes provisioning, returning by boat to Paniau on the
    barrier reef, and strolling around the island settlement. The passage details
    sand, tide marks, creeping vegetation, pandanus and coconut palms, coconut stages
    named in Ponapean, robber crabs feeding on coconuts, drifted seeds and plant debris
    on the beach, and hermit crabs and lizards among the rubbish. It also cites Guppy
    on ocean-current seed dispersal in the Solomon Islands and the Pacific.
