canonical_text:
  quote: ''
  summary: 'The passage describes several South Sea and Micronesian examples: a Marshall
    Islands siege over a fugitive noblewoman, fortified canoe warfare, political change
    in the Gilbert Islands, ability-based military command in another Marshall war,
    Pelew social and legal customs, tabu restrictions on resources, regicide signaled
    by a carved effigy, and parallels to weregild and vendetta customs elsewhere in
    Oceania. The author repeatedly compares these examples to Homeric, Germanic, medieval
    European, and Corsican patterns while cautioning in some cases that the resemblance
    is accidental or analogical.'
  language: English
  quote_policy: summarized
