canonical_text:
  quote: ''
  summary: The narrator obtains official credentials and mission-related language
    materials in Manilla, hires Theodoro as a general helper and photographer, and
    prepares to depart by the mail-steamer Venus for Yap, Guam, and Ponape. After
    oversleeping, he and Willie Macleod commandeer a launch and reach the steamer
    just as it is leaving. Theodoro, frightened by shipboard stories about cannibal
    Carolinians and thinking the narrator had missed the ship, is found taking the
    baggage ashore. The party boards, and the voyage enters rougher open water while
    Theodoro broods over feared dangers and the narrator reads travel books.
  language: English
  quote_policy: summarized
