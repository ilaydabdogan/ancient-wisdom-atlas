canonical_text:
  quote: ''
  summary: The narrator visits the remains of an ancient hilltop fortress called Lang-Takai.
    Local tradition says a chief built a stronghold and lodge there, resisted attacks
    after failing to pay tribute, was lured away by false news of civil war, and was
    massacred with his warriors while the fort's remaining people were killed or captured.
    A second war tale describes a Metalanim raid during a festival near Mount Wana,
    followed by a revenge attack by Kiti allies while the raiders were drunk, with
    spirit-shapes said to hover over the slaughter. The passage ends by noting Lang-Takai
    as a proposed refuge during the 1890 revolt.
  language: English
  quote_policy: summarized
