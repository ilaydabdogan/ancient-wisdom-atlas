  summary: A preface/introduction argues that South Sea Island peoples, languages,
    customs, institutions, and modes of thought have received less study than the
    islands' natural features. It discusses missionaries and natural scientists as
    earlier sources, funding priorities favoring marketable commodities, public preference
    for narrative history and travel, and the possible value of South Sea studies
    for historians.
  language: English
