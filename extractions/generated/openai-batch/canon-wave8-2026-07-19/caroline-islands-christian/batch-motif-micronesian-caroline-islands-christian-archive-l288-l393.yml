literal_observations:
- id: obs:1
  text: The speaker states that the South Sea Islanders' manners, customs, language,
    institutions, and modes of thought have received less attention than the fauna,
    flora, and geology of their places of abode.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes passing anthropological or ethnological observations
    by exploration expeditions from long-term resident investigations, which it says
    were mainly carried out by naturalists or geologists.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says much knowledge of South Sea Islanders came from missionaries,
    but also says their calling and lack of preliminary training limited their study
    of some native customs and institutions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker says men of science in Europe and America wanted more exact knowledge
    of South Sea Island tribes, but faced difficulty justifying the expense of such
    investigations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage contrasts studies expected to find marketable commodities, such
