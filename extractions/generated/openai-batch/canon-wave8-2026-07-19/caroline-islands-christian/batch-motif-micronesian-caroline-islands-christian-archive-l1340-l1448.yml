  summary: The passage describes Port Darwin as a plateau town reached from a long
    jetty, then recounts a visit to the Botanical Gardens with local hosts Foelsche
    and Holtze. The narrator observes palms, banyans, and other imported and Australian
    plants, arranges an exchange of seeds and curios with Holtze, discusses nearby
    tribes, railway expansion, goldfields, and hunting, and reflects on the pull of
    eastern travel before the ship Menmuir departs from Australia toward Timor and
    Dilli.
