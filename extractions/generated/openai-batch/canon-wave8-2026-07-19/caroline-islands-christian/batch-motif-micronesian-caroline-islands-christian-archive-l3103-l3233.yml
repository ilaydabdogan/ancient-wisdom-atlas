canonical_text:
  quote: ''
  summary: The narrator describes arriving by canoe at Nan-Tauach in Metalanim, inspecting
    its basalt waterfront, gateway, courtyards, terraced enclosures, vaults, and vegetation.
    The passage associates the central vault with Chau-te-reul or Chaute-Leur, glosses
    the word Chau as denoting both sun and king, and then reviews later historical
    descriptions and speculations about the ruins, including claims of obscure origin,
    fortified houses, and artificial caves.
  language: English
  quote_policy: summarized
