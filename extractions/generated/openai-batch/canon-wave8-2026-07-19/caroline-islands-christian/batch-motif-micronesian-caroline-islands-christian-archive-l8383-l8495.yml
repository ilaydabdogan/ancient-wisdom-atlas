  text: Two brothers sail northward from Ponape in a big canoe to seek new lands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After many days of sailing, the brothers see the midnight sky red with a great
    blaze of fire and return home in terror.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A variant account says the elder brother dies, while the Kotar, or kingfisher
