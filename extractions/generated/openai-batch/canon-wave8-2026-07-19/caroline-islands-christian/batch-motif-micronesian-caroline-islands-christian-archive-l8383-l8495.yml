canonical_text:
  quote: ''
  summary: The passage reports traditions of castaway chiefs arriving by canoe, an
    ancient northward voyage by two brothers who encounter a terrifying red fiery
    sky, a variant in which a kingfisher rescues the younger brother after the elder
    dies, and local sacred shark-related stone images and shark veneration. It also
    describes a hilltop fort, a remembered battle, and possible martial relics.
  language: English
  quote_policy: summarized
literal_observations:
