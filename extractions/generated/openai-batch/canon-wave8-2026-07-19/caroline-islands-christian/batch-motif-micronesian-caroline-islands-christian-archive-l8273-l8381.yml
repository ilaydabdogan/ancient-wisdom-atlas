canonical_text:
  quote: ''
  summary: The narrator, accompanied by Nanchau and others, travels by canoe from
    Paniau toward Marau to meet the Au, an old headman reputed to know local traditions
    and to show ruins of an old fort called Chap-en-Takai. The passage describes reefs,
    shoals, lagoon waters, a fresh-water spring through the reef, the muddy approach
    to Marau, the Au's stone-terraced house, the surrounding vegetation, and the Au's
    evening reminiscences about old political history on Ponape.
  language: English
  quote_policy: summarized
