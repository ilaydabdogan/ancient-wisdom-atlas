literal_observations:
- id: obs:1
  text: The passage distinguishes Pilung, described as chieftains, from Pimlingai,
    described as slaves, after a priestly caste named Ulu-Uleg or Machaviachl.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pimlingai are described as living mostly in bush or inland villages, with
    differences in complexion, hair, and pronunciation from the Pilung.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: One tradition says the Pimlingai descended from visiting canoe crews who were
    seized after a fatal epidemic had ravaged Yap; most men were killed, while others,
    women, and children were kept as slaves and settled inland to prevent escape by
    canoe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pilung wear a Roai, an ornamental comb of white mangrove wood, while Pimlingai
    do not.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old men act as umpires and spokesmen, decide war or peace, and form a court
    whose sentence has no appeal.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Murder is generally punished by a heavy fine, while breaches of the Machamach
    or Tabu are said to be punished by poisoning or assassination.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two senior wizards are described as heads of all magicians in Yap and are
    subject to strict rules about food, tobacco, and betel-nut remains.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chewed remains of the two senior wizards' betel-nut are collected and
