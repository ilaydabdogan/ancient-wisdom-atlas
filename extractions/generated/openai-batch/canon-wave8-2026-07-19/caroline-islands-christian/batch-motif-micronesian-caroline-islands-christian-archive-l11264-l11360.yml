  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lesser Machamach men perform tasks such as recovering missing property and
    divination, while grave questions go before the two senior wizards.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The power of Tabu applies to places, objects, and persons; a tabued village
