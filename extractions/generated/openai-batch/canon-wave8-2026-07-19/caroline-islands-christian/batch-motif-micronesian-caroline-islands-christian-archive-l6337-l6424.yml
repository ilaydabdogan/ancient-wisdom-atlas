canonical_text:
  quote: ''
  summary: A travel narrator accompanies the King on a coastal excursion from Lele
    toward settlements and natural sites. The King voices dissatisfaction with Boston
    Mission missionaries. Along the route the party encounters Li-kiak-sa tending
    sweet potatoes threatened by rats, sees and collects sea-snakes, travels by canoe
    to Puia, is guided to a waterfall associated with the joint death of two defeated
    young chiefs, observes the stream and robber crab habitat, and enters a cavern
    with bats, guano, echoes, and a dark pool.
  language: English
  quote_policy: summarized
