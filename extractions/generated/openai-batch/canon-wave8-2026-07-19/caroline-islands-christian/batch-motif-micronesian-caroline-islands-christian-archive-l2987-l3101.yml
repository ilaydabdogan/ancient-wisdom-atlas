canonical_text:
  quote: ''
  summary: The narrator recounts a March 1896 journey from Nalap toward Metalanim
    and the ruins of Nan-Matal. The party visits chiefs, pays King Paul a fee for
    permission to explore, passes ancient stonework and canal-like waterways, and
    later enters the ruins with local guides who fear the anger of ancestral spirits
    and the tabu surrounding the Lil-Charaui or Holy Places.
  language: English
