  summary: The passage describes Pan-Katara/Nangutra as a haunted island and former
    governmental and ceremonial precinct. It then reports Kubary's account of annual
    priestly rites involving canoe consecration, kava offerings, restricted temple
    access, and a deified Conger-Eel on Itet. A native version tells of a huge lizard
    or alligator treated first as an Ani or tutelary genius, later becoming a cannibal
    enemy, and finally being killed by a narcotic-stuffed roasted pig trap and fire.
