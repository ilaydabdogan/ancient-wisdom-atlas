canonical_text:
  quote: ''
  summary: A chronological abstract recounts Spanish occupation in the Caroline Islands
    from 1885 through the late 1890s, including German and Spanish flag-raising, papal
    arbitration, founding of Spanish and Catholic institutions, conflict between missionaries,
    deportation, massacres, native uprisings, punitive expeditions, bombardments,
    deaths of officials and chiefs, later conciliation, and commentary on religious
    animosity and possible transfer to Germany.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In August 1885, a German gunboat raised the German flag at Yap; the passage
    reports excitement at Madrid, assault on the German Consulate, and referral of
    the matter to the Pope, who pronounced in favor of Spain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On July 27, 1886, the Spanish flag was raised at Ascension Bay in Ponape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On April 19, 1887, the Colony of Santiago was founded and Spanish rule was
    formally proclaimed at Ascension Bay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On April 24, 1887, a Catholic Mission station was founded in Kiti, followed
    by disputes between Methodist missionaries from Boston and Capuchin priests.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: On June 16, 1887, Mr Doane, head of the Methodist Mission, was deported to
    Manilla.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On July 1, 1887, a detachment of Manilla soldiers under Ensign Martinez was
    massacred on Chokach, followed by a general native rising, capture of the Spanish
    fort, and killing of Governor Señor Posadillo and about seventy defenders.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: On October 31, 1887, a punitive expedition arrived and the new Governor, Señor
    Cadarso, proclaimed a general amnesty; the years 1888 and 1889 are described as
    an interval of peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In June 1890, Lieutenant Porras and fifty-four soldiers working on the military
    road at Oa were massacred, and Mr J. C. Dewar's yacht Nyanza was wrecked on reefs
    off the Mant Islands.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In September 1890, a relief expedition arrived from Manilla; the Metalanim
    coast was bombarded, troops landed on Tomun, native houses and King Paul's residence
    were burned or destroyed, an overland march failed, and Colonel Soto was killed
    at Tolopuel.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Later in 1890, the Spanish attacked Oa from the sea and captured the position
    with severe loss; Chaulik, a leading rebel chief, died; the Ulloa bombarded the
    Metalanim coast; the American corvette Alliance demanded compensation and took
    Methodist missionaries to Kusaie.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: On November 22 and 23, 1890, hard fighting occurred at the stockade of Ketam,
    which was captured by the Spanish at the sacrifice of a third of their force.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage describes minor skirmishes and assassinations before Don Jose
    Pidal's arrival in 1894; it says his conciliatory policy seemed successful and
    that natives regretted his departure in 1896.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says Don Miguel Velasco was popular among Europeans and natives
    and was feared to have perished in a recently reported massacre.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage attributes the recent massacre to the imprisonment of Henry Nanapei
    of Ronkiti, described as a principal chief with strong American sympathies and
    head of Protestant Mission schools in his district.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage ends by speculating that if the Carolines are handed over to Germany,
    there may be less religious animosity, which it says caused loss of life, treasure,
    and humiliations to Spain.
  category: speech
  evidence_refs:
  - ev:11
