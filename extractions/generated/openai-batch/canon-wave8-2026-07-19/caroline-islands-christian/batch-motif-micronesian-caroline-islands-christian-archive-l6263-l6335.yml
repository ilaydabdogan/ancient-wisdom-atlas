canonical_text:
  quote: ''
  summary: The passage gives historical and ethnographic notes about Kusaie/Lele,
    including traditions of older trade and drift arrivals, a Lele tradition that
    Cyclopean walls, enclosures, and canals were built by a dominant foreign race
    arriving by vessels from the north-west, tribute and ritual abasement before the
    Tokosa, a Ponapean tradition concerning Icho-Kalakal’s invasion route, an account
    of basalt stones transported from South Harbour by rafts and floats, and observations
    on language, tools, sailing, crafts, weaving, dyes, and products.
  language: English
  quote_policy: summarized
