- id: obs:4
  text: The natives of Lele attribute the great Cyclopean walls, Pot Falat enclosures,
    and canals on their island to a dominant foreign race that arrived from the north-west
    in vessels called Wak-palang.
  category: relationship
  evidence_refs:
  - ev:2
