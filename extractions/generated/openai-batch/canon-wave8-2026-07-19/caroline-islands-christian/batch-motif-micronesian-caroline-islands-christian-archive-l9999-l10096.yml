  summary: The passage reports a Yap dance entertainment, a moonlit departure, and
    a later inland journey by the narrator, Fatumak, and boys carrying baskets. It
    describes stone bridges, limestone money-wheels, Fana-Mouk, the former house of
    Tanis with a burial place below, a coral table called Rorou associated by the
    narrator with an old observance, other stone platforms, a club house, and an ancient
    cemetery with burial platforms amid cultivated and wild plants.
