canonical_text:
  quote: ''
  summary: A heavily loaded canoe capsizes in a deep coastal pool reputed to contain
    sharks and sea-monsters. The travelers swim while pushing the waterlogged canoe,
    reach a coral stack, bail the canoe, lose some goods, and later receive hospitality
    at Aru Island. The next day they hear of fighting among church people and missing
    spirits, then visit the Noch at Matup, where local tensions include blame for
    influenza attributed to the wrath of Icho-Kalakal and the Ani after a sanctuary
    was exposed to daylight.
  language: English
  quote_policy: summarized
