  quote: ''
  summary: The narrator describes the view from a terrace over Mutok, Kiti, nearby
    islets, lagoon, reef, and Pacific. He reports a local statement that some islets
    are broken portions of a former mainland, notes agricultural and linguistic observations,
    recounts threats from King Paul that force him to leave Nantamarui, and describes
    receiving help from King Rocha, chiefs, and older people in Kiti who point out
    places of interest and recall traditions. The passage ends with the camera-man
    Theodoro preparing to depart by mail-steamer.
