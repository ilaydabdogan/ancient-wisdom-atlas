canonical_text:
  quote: ''
  summary: The passage recounts a third visit to the ruins, the formation of an excavation
    party, digging in a central vault, and an inventory of recovered objects including
    shell beads, fish-hook shanks, shell-axes, carved shell-bracelets, shell needles
    or ornaments, pendant shells, bone and skull fragments, shell gouges, a spearhead-like
    iron piece, and a glassy fragment identified by others as obsidian. The author
    also records several comparative observations about similar shell beads, fish-hooks,
    and volcanic glass in other regions.
  language: English
  quote_policy: summarized
