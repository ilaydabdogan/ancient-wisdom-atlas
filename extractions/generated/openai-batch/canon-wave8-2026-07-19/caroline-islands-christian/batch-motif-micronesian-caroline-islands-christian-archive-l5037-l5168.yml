literal_observations:
- id: obs:1
  text: Old men twist small strands between fingers and thumbs until they form strong
    cinnet cord, used for lashing parts of houses and canoes in place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pliable hibiscus strips are used to make nooses and traps; one noose name
    is glossed as meaning a woman's deceit, while another trap name is glossed as
    a good device.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A primitive rat trap is described as a reedgrass or cane device with a coconut-leaflet
    spring, fermented breadfruit bait, and a rock arranged to fall on the intruder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hibiscus-wood cages may hold birds; tame blue herons and black-and-white sea-birds
    are described as children's pets, while elders are said to prioritize food scarcity
    and the larder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A fishhook called Kach is made of wood or bone with a mother-of-pearl body
    whose glitter attracts fish; introduced metal hooks are valued.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person skilled at fishing is said to be assured of a good marriage alliance
    because he is resourceful as a food-provider.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bait includes squid, cuttle-fish, and hermit-crabs; crushed Up root releases
    a milky narcotic juice in water that stupefies fish and eventually sea-eels.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Several net and weir types are listed by name, including large and small seine-nets,
    casting nets, hand-nets, bag-nets used at ebb-tides, and stone or cane fish-pens.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Loch mat is made of sewn pandanus leaves; Paliker is noted for making
    these mats, and the Loch of a great tribal chief is called Parror in ceremonial
    language.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other mat types are described as foreign, borrowed, or lexically comparable
    to forms from neighboring Pacific island groups.
  category: relationship
  evidence_refs:
  - ev:9
