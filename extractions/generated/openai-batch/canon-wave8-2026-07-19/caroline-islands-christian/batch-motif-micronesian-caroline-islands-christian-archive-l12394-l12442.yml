canonical_text:
  quote: ''
  summary: 'A Yap tradition explains the invention of stone money: Anagumdng learns
    stellar knowledge from Le-gerem, sails with seven men to the Pelew Group guided
    by the Pleiades, discovers shining stone and pearl-shell, shapes stone into several
    forms, and returns. Le-gerem accepts only the perforated wheel stones, uses a
    charm to focus desire on them, and the new treasure leads to civil wars and dangerous
    later expeditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wise old man in Tomil named Anagumdng is taught the stars and the seasons
    of their rising and setting by Le-gerem.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After three months of study, Anagumdng takes seven men, mans a large canoe,
    and sails south in search of Balao under the guidance of the constellation Mageriger
    or Pleiades.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anagumdng reaches the Pelew area, including Peleleu and nearby Kokial islets
    in a lagoon.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Kokial he finds a shining stone identified parenthetically as arragonite
    or calcite, and he also finds pearl-shell.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Anagumdng conceives of hewing the shining stone into portable forms for use
    as a medium of exchange.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stone is cut with shell axes into fish shapes, crescent-moon shapes, and
    rounded wheel shapes compared to the full moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The rounded wheel stones have large holes bored through their centers, and
    the canoe is loaded for the return to Yap.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Le-gerem keeps the wheel stones with central holes, discards the other stone
    forms, and uses a powerful charm to center the people's desire on the recognized
    standard coinage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator states that before this time there was no fighting in Yap, but
    afterward civil wars occurred because tribes wanted portions of the coveted treasure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Later expeditions from Tomil, Rul, and Gochepa frequently go to the Pelews
    to obtain the stones and shells.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some later voyagers die at sea in stormy seasons or on return journeys when
    vessels swamp or upset under heavy or carelessly stowed stone cargo.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Other later voyagers are killed by the people of the Pelews, who resist the
    visits and the plundering of pearl-shell beds.
  category: relationship
  evidence_refs:
  - ev:9
