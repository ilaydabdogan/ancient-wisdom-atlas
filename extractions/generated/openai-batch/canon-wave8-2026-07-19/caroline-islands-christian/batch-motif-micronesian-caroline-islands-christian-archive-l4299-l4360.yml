canonical_text:
  quote: ''
  summary: The narrator describes leaving Ponatik by boat after disputes over payment,
    then staying at Nantamarui, examining nearby stone-work, and introducing Kubary's
    conclusions about Nanmatal. Kubary states that Nanmatal's stone buildings were
    built by a race preceding the present inhabitants of Ponape; tradition says the
    last king of that race, Dziautoloa/Chau-te-leur, lived in the stone-town while
    the people on the chief island supported him. A stranger named Idzikolkol came
    from the Ant or Andema Islands, first landed at Nan-Pulok, returned because Nanmatal
    seemed too populous, then landed in Metalanim and learned from a woman about the
    military weakness of the Dziautoloa.
  language: English
  quote_policy: summarized
