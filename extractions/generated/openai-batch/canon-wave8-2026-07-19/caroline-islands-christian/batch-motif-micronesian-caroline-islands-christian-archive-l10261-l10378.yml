  summary: The narrator describes receiving stones and a crayfish specimen, traveling
    by sailing boat toward North Yap, and visiting Ngingich for the marriage of a
    German trader to a Marianne woman. The passage discusses Yap objections to white
    sons-in-law, a color-coded proverb about marriage, Marianne/Chamorro women as
    sought-after wives, Catholic regulation of such marriages, boat crew dress, betel-chewing
    equipment, and the wedding feast.
