  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On Mutok and in Kiti, the narrator visits King Rocha, explores the valley
    below Mount Wana, and is received kindly by Nanchau, the King of Kiti, local people,
    and the Catholic padre.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eta guides the narrator on a climb, knows many plant and tree names, and later
