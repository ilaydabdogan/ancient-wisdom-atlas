  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator botanises in the hill-slopes of Not and ferny dells of Kamar,
    visits Kubary at Mpompo, and collects seeds near a large waterfall.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nanapei reports influenza on the east coast, says King Paul blames the narrator
