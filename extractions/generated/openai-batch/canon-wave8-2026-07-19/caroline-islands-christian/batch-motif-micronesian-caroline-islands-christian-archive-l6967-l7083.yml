literal_observations:
- id: obs:1
  text: The narrator returns to the Colony, visits the Spanish Governor, goes to Langar,
    and meets Captain Weilbacher, the Lap or Headman of Langar, Paliker acquaintances,
    and visitors from Ngatik.
  category: sequence
  evidence_refs:
  - ev:1
