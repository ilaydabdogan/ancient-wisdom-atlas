canonical_text:
  quote: ''
  summary: A first-person travel narrative describes the narrator’s return to the
    Colony, meetings with colonial and local figures, a report about Ngatik descendants
    and dialect change, botanical excursions, Nanapei’s warning about illness and
    blame on the east coast, visits to Mutok and Kiti, Eta’s help as guide and facilitator
    of old lore, and a detailed climb through wooded hills, watercourses, springs,
    old house foundations, forest, lagoon, reef, and sea.
  language: English
