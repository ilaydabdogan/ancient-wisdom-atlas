  summary: A church service is disrupted after Obadiah enters while tipsy, interrupts
    the preacher, and claims he can preach better. The congregation becomes divided,
    knives are used, blood is shed, and Obadiah is confined afterward. The Noch later
    comments on church members, local restrictions, marriage payments, distrust of
    white men, and the narrator’s collecting of old stories and specimens.
