literal_observations:
- id: obs:1
  text: The passage states that each girl must pass through rites before being considered
    ready for marriage, and reports that local people describe this as an ordeal or
    preliminary trial fitting them for maternity.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Mespil may become a Langin, described in the passage as a respectable married
    woman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sign of a Langin is a black-dyed, knotted string or cord worn around the
    neck and hanging down front and back, called Mara-fau.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the supply of Mespil is generally maintained by purchasing
    slave girls from neighboring districts using Fe, or stone money-wheels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Stone money-wheels are said to be piled at the foot of the structures so that
    Mespil remember they were bought at a great price; the structures are therefore
    called Fe-Bai or Money-Houses.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bands of Ufuf are said sometimes to carry off a Mespil from another village,
