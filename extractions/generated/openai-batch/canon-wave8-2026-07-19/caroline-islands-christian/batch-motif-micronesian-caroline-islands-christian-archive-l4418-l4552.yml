canonical_text:
  quote: ''
  summary: The narrator and companions travel through a difficult forested hill trail
    behind Nantamarui to inspect ruins. They find a small stone-enclosed cemetery
    with short basalt-roofed vaults identified in Ponapean tradition as graves of
    the Chokalai or Kichin-Aramach, the Little Folk. The passage describes these beings
    as earlier inhabitants, compares them with little-folk traditions elsewhere, reports
    beliefs that they still haunt dark forest recesses and abducted a kava planter,
    and records a local claim that some Palang River people descend from them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator decides to explore ruins on a hillside in the back country and
    travels with Joe Kehoe and Lewis along a rough, steep, intricate trail behind
    Nantamarui.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The route passes through dense vegetation, slippery stones, fallen trunks,
    natural hibiscus archways, a valley with cultivated plants and a brook, and a
    steep mountain slope with large forest trees.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The explorers come upon a low stone breastwork enclosing a cemetery in the
    shape of an irregular or broken parallelogram.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cemetery contains six graves in a lower enclosure and three on a raised
    platform; the vaults are described as only four to four and a half feet long and
    roofed with basalt slabs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The graves are identified as those of the Chokalai, Kichin-Aramach, or Little
    Folk, described as woodland elves and compared by the narrator with pucks, pixies,
    Trolds, Cobolds, Dwarfs, and Maori Patupaiarehe.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ponapean tradition in the passage says the Chokalai lived in the land before
