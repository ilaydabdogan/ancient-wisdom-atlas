  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Chokalai are said to have speech like chattering or gibbering bats, dark
    skin, and flat noses, and are believed still to haunt dark forest recesses as
    malignant and revengeful beings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A reported story says a man who came to the haunted dell to plant kava was
    caught up and spirited away by revengeful goblins, and his lifeless body was later
    found on a flat rock by the seashore near Nantiati Point.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Au of Marau reports that people at the mouth of the Palang River descend
    from the Chokalai and describes them as shorter, darker, flat-nosed, and known
    as Paikop-faces.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage remarks that people in Ponape, the Marquesas, and many other islands
