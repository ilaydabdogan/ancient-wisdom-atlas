canonical_text:
  quote: ''
  summary: The passage first frames kava gatherings as occasions for collecting traditions,
    then recounts a legend of Laponga, an old high priest and magician in Metalanim.
    Laponga, able to take animal shapes, marries a forest nymph while in owl form
    and has children who can speak like humans and change between bird and human form.
    When they call after him as father, he curses them to lose human speech and human
    shape, leaving them as birds with distinct calls, habitats, and ominous associations.
    He later curses one persistent small bird to become dizzy when stones are thrown
    at it and to be eaten by humans.
  language: English
  quote_policy: summarized
