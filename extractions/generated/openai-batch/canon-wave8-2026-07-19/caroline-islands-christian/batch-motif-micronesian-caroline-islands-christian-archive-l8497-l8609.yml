canonical_text:
  quote: ''
  summary: The narrator surveys old Kiti ruins, including a royal council platform,
    fort walls, a watch-tower, a kava-pounding stone, and stones used for divination.
    The passage reports a Kiti tradition of invulnerable iron men who landed on the
    island and were killed through the eyes, and it records a local warning that unseen
    spirits watch over lucky pebbles. The author also draws comparisons to Herodotus
    and to rival sacred centers elsewhere.
  language: English
  quote_policy: summarized
