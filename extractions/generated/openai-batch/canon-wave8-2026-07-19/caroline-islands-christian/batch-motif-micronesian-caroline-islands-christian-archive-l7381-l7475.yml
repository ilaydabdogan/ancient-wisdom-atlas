canonical_text:
  quote: "“fear not the spirits of folk dead and gone”"
  summary: The narrator shelters from a squall, then recounts a feast on Mutok arranged
    by Nanchau so that old men might provide historical information. Chiefs gather
    with food; animals, including the dog Pilot at Chau-Wana’s request, are killed
    and eaten. Wine and kava accompany the feast. The narrator jokes, toasts Queen
    Victoria, names Chau-Wana the “King of Hearts,” and records songs, stories, and
    offers of knowledge about fishing, plants, stars, and old shell axe-heads. He
    offers steel axes in exchange for old shell axes and tells people not to fear
    the spirits of the dead associated with buried objects. Songs continue into the
    night before the guests depart.
  language: English
  quote_policy: quoted
