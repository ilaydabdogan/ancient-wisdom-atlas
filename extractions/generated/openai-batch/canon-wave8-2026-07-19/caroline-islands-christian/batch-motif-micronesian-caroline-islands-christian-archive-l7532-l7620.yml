canonical_text:
  quote: ''
  summary: The passage recounts speculative and traditional accounts of kava's origin,
    then describes Ponapean kava preparation in a council lodge, including ranked
    seating, pounding the root, invocation of ancestral spirits and demon lords, a
    first-cup offering, and etiquette for presenting the bowl to the king. It closes
    with an anecdote in which a Samoan chili-pepper kava custom is introduced to Ponapeans,
    producing a comic burning reaction and social acceptance of the foreign participant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there are curious traditions about the origin of kava.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: One origin tradition says Ckerri-chou-lang, called the Little Angel from Heaven,
    pitied mankind and dropped a piece from the Celestial board down to earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another origin tradition says a mighty magician raked up the wondrous root
    with an Irar or magic staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kava-making ceremony is set in the Nack or Council-Lodge, with the king
    or principal district-chief and the Chaumaro seated on a raised platform while
    lesser chiefs and commons sit at a distance.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kava makers squat around broad shallow basaltic stones and pound pieces of
    tough root with stone pestles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The root is described as not dried in the sun and not carefully washed with
    water, because washing is said to spoil the flavour and weaken the strength.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Am or ancestral spirits, together with Icho-Lumpoi and Nan-ul-lap, are
    supposed to be present during the ceremony.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Water is poured in, the first cup is squeezed from a Kalau-fibre strainer,
    and the chief of the Chaumaro mutters a charm for the spirits, sips, and pours
    out a drink-offering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the offering, the bowl is offered to the king, and a recipient customarily
    stands off and declines the draught briefly before accepting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says a Ponapean drinker normally swallows only about half the
    contents rather than draining the bowl.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'A Samoan practice from Atua on Eastern Upolu is described: two or three small
    red chili-peppers are put into the strainer with green immature kava root.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When six chili-peppers are added in Chau-Icho, a venerable patriarch eagerly
    takes the first taste and reacts immediately with heat, breathlessness, tears,
    and a comparison to fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the patriarch's reaction, others taste the drink more cautiously, and
    the Teacher of New Things drinks a large amount while the lodge murmurs approving
    comments about crossing the sea and the white man being like one of them.
  category: sequence
  evidence_refs:
  - ev:8
