canonical_text:
  quote: ''
  summary: A travel narrator moves through Yap with Fatumak, noting betel-nut travel
    provisions, stone money houses, shaded groves, roads and embankments, paved causeways,
    and a Goror mound and stone-platform complex associated with the ancient chief
    Tol-Riak. The passage ends with an encounter with a young man wearing a scarlet
    shell-bead heirloom necklace called Thauai, said to come from the Pelew Islands
    with stone and shell money.
