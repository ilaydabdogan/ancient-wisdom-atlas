canonical_text:
  quote: ''
  summary: The narrator reports a friendly exchange and meal with a local chief, then
    the party leaves because people at Paniau are awaiting their return. They are
    pursued by King Paul's men for sailing on Sunday but avoid capture. They pass
    through Nan-Matal's walled islets and waterways, stop at Pikanekit during stormy
    weather, divide into two canoes for safety, survive rough seas and near capsizing,
    and finally return to their island camp, where they are received, fed, and restored.
    The following day the weather clears and work continues with reef collecting and
    mainland visits.
  language: English
  quote_policy: summarized
