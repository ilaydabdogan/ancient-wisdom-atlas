canonical_text:
  quote: ''
  summary: The narrator remarks that no local tradition explains the builders of great
    stone masses, unlike named magic artificers associated with Sumatra's Passumah
    monoliths. The party travels by sea through politically risky areas and the canals
    of Nan-Matal, observes masonry, shoals, sea-grass, and sea-snakes, stops at Langar
    and Santiago, arranges medicines and supplies, packs curios for departure via
    Yap, and begins a return after Chaulik urges departure.
  language: English
  quote_policy: summarized
