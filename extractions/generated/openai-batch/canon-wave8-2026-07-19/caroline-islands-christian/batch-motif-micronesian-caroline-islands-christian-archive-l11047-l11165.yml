canonical_text:
  quote: ''
  summary: A Yap tradition recounts fairy beings whose hunger leads them to transform
    into rats and raid plantations. After Loth the Fairy Mother is killed in rat form,
    her daughter warns Igereng that Loth’s vengeance will send a flood in seven days;
    Igereng and his wife prepare on a high hill with magic herbs and rites. A typhoon
    and tidal wave inundate Yap, leaving only a slave man in Unean and the couple
    alive. The survivor marks newly emerged Nimiguil land with a bamboo pole, explaining
    later land tenure obligations. Later, Igereng’s children fail to dig up their
    buried mother after three days, losing promised blessings. The sky spirit Yalafath
    sends his wife Mui-Bab, in bird form, to inspect Yap after the flood; she reports
    the barren condition, and Yalafath sends food plants. Mui-Bab then creates eight
    Kan or Genii and wives for them, giving rise to the generations of Yap. The narrator
    explicitly compares elements of the tale to Genesis, Semitic seven-day cycles,
    Japanese Bake-mono tales, and bird messengers in Mexican, Chaldean, and Hebrew
    traditions.
  language: English
  quote_policy: summarized
