  summary: The narrator describes a confrontation with a local ruler over work at
    Nan-Tauach, followed by final measurements and photography of the ruins. A poisonous
    fish present is reported as treachery, native canoes are suspected of observation,
    and later curious natives interpret the smell of photographic chemicals as connected
    with demoniac powers and the Lake of Fire and Brimstone.
