canonical_text:
  quote: Formerly it was a very sacred spot.
  summary: The passage describes Pan-Katara and the basalt masonry of Nan-Tauach,
    including the graves of the King of Kiti and his marshal Kaeka, later disturbed
    by treasure-seekers. The travelers then reach a clearing where a council-lodge
    has been built, workers are fed, hospitality is described, and a young chief converses
    about local history, Pacific linguistic kinship, and political unity.
  language: English
