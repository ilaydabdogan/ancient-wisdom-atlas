  quote: ''
  summary: The passage explains that Yap had yam and taro but no cooking fire. After
    people appealed for help, a red-hot thunderbolt struck a Choi tree and trapped
    Dessra, the Thunder god. Guaretin helped him, and he responded by making a clay
    cooking pot and placing latent sparks of fire into Arr-tree sticks, giving Yap
    the arts of fire-making by wood friction and pottery.
