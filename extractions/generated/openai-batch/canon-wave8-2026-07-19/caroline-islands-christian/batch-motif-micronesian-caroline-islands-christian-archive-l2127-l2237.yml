canonical_text:
  quote: ''
  summary: The narrator reports a Spanish account of ancient stone monuments in the
    Mariannes, locally called Houses of the Ancients, arranged in parallel rows and
    associated by tradition with burial of the dead. The passage gives details on
    monuments at Saipan and Tinian, including the House of Taga and a bowl-shaped
    grave said to belong to Taga's daughter, where human bones were found. The passage
    then shifts to the narrator's arrival at Guam, describing the harbor, landscape,
    landing, transport inland, and comments on the Chamorro population and reported
    emigration into the Central Caroline area.
