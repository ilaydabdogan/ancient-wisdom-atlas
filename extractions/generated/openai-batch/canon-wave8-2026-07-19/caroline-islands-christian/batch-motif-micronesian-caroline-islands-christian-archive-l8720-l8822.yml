canonical_text:
  quote: ''
  summary: The passage describes a communal gathering where an English visitor receives
    food, a kava plant is brought, cut, and prepared, and kava is ceremonially served
    in a lodge. Hosts discuss seasons, constellations, guiding stars, and navigation,
    then perform war-songs. Later two canoe-borne messengers summon Au to a dying
    female relative; he leaves in distress during stormy weather. The visitors then
    depart, give gifts to Au's wife, return to Paniau in rain, and pack shells and
    curios for the mail.
  language: English
  quote_policy: summarized
