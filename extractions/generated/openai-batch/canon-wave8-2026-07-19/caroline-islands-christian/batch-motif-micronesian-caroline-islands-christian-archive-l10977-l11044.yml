canonical_text:
  quote: the sea rose suddenly and swamped the lowlands
  summary: A travel-account frame introduces information from B. and an old chief,
    Toluk of Omin, who gives a Yap flood narrative. In the story, sky and fairy beings
    visit Alok festivals; a fairy woman loves the mortal Maralok; her mother Loth
    summons her; the sea floods the lowlands, killing Maralok while the fairy wife
    reaches Tomil. Loth and her daughter later live in an underground cavern, make
    wings to return upward, are caught in a great net, and are assigned to the aristocrat
    Igereng, who holds a feast.
  language: English
  quote_policy: quoted
