  summary: The passage describes Te Bako, an elderly Gilbert islander at Nalap, as
    a former homicide and later convert who believes ghosts of dead men disturb him
    at night. He works on the reef with torch and spear, refuses rum because he once
    killed a cousin during a drunken quarrel at a feast, and recounts the killing.
