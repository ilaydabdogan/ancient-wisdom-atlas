literal_observations:
- id: obs:1
  text: A group of natives came aboard, headed by the Icho or King, with his Queen
    and interpreter, and brought hats and mats for sale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hats and mats are described as cunningly woven from Pandanus leaf, a manufacture
    in which the makers are said to be very skilful.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King asked for a Turkey-red shirt, refused a cigar as a bad example to
    church members, and spoke to the narrator about Victoria and a Pingelap man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The King of Pingelap and the chief of Mokil are reported to have amused Spanish
    hosts aboard the gunboat Quiros by eating with their hands; the Pingelap King
    eagerly ate curry from a large dish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The travelers left their anchorage for Kusaie; calms, baffling winds, and
    heavy rain squalls slowed or troubled the voyage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kusaie appeared at sundown under dark clouds, with mountain tops hidden by
    cloud-haze and vapor; a violent squall followed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator characterizes Pingelap men as dull and heavy in temperament yet
    unusually nervous among Caroline Islanders, and says minor operations may make
    strong men faint.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same nervous susceptibility is said to be reported of Nuku-Oro and Kap-in-Mailang,
    and the narrator links it to hypnotic suggestion and disorders named Lata and
    Malimali.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pingelap is said to have been a recruiting place for whaling captains, who
    valued the men as docile, hardworking, and relatively able to withstand Arctic
    cold.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The vessel passed the lights of the missionary settlement of Mout and later
