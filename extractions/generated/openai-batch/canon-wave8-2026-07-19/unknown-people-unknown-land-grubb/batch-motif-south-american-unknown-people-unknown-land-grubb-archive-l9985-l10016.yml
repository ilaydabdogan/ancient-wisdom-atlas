canonical_text:
  quote: ''
  summary: The narrator describes plans made before his first furlough to England
    to establish a mission in the West-south-west Chaco near the borders of the Lengua,
    Suhin, and Toothli tribes. He notes local interest and uncertainty, preparatory
    route-building and a halfway hut, and the authorization of Poit to make frontier
    preparations, including settlement, gardening, barter, gathering people around
    the mission, and stating conditions such as the prohibition of native beer on
    the station.
  language: English
