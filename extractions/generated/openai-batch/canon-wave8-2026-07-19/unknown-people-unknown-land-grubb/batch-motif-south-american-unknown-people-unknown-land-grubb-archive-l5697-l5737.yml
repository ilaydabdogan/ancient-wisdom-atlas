literal_observations:
- id: obs:1
  text: After a quarrel, a man may leave intending to travel to a distant village;
    a companion may follow, pick a plant by the wayside, throw it over his shoulder,
    and return believing the man will stop and turn back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says the sensitive plant's apparent power of feeling probably
    caused its adoption as a charm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Manuscripts and printed paper are preserved, when obtainable, to make charms
    relating to Europeans; writing is described as viewed as the Europeans' special
    symbol.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For hunting, various plants are used as charms, either carried on the body
    or rubbed on weapons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Duck blood is sprinkled in order to procure rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A red head-covering is worn when hunting deer because it is said to arouse
    the animal's curiosity and aid stalking.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wax images of animals are used as hunting charms.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: When someone expresses a desire for rain or a cool south wind, neighbours
    who do not share the wish protest and urge him not to persist.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator was considered to have particular power over the south wind and
    was believed able to bring it by whistling or hissing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a sudden rain-storm has nearly ended, people make a pushing-away gesture
