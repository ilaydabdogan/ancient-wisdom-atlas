  summary: 'The passage describes several practices presented by the narrator as charms
    or superstitions: a plant charm to make a departing man return, amulets involving
    writing, hunting charms using plants, blood, color, and wax images, actions and
    sounds associated with rain and south wind, and a firebrand held toward an obscured
    sun.'
