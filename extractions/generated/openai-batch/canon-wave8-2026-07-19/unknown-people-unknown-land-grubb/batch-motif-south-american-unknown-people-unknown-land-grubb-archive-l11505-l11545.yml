canonical_text:
  quote: "“there should be no singing and no witchcraft”"
  summary: A missionary narrator recounts a confrontation over a sick boy. A group
    associated with witch-doctors asks to take or watch the boy while denying intent
    to perform witchcraft. The narrator accuses the Chief of being a witch-doctor,
    consults Christian boys, summons allied boys and friends, refuses to retract the
    accusation after prayer, sets a night watch, and sends a morning messenger for
    assistance. The messenger’s dispatch appears to disrupt the opponents’ plans.
  language: English
  quote_policy: quoted
