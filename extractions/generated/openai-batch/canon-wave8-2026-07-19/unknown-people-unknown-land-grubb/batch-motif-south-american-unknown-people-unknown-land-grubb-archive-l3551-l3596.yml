canonical_text:
  quote: ''
  summary: 'The passage describes Chaco hunting practices: luring a fox by imitating
    a wounded bird, stalking deer with disguises, whistles, red head-dress, and natural
    camouflage, danger from wild pigs or peccaries, a brief note on ant-eaters, and
    an illustration caption describing a stalker disguised as foliage.'
  language: English
  quote_policy: summarized
