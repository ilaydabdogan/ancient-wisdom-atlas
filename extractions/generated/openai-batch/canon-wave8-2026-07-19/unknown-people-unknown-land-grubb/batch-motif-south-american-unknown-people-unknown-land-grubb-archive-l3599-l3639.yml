literal_observations:
- id: obs:1
  text: Natives are described as making wax models of an ant-eater with its young
    on its back, said to represent the animal's mode of carrying them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists tapir, maned wolf, fox, armadillo, tiger-cat, carpincho,
    nutria, otter, iguana, and smaller animals as not requiring special comment in
    hunting methods.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The puma and jaguar are described as the two largest carnivores; the puma
    is not feared by the natives.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The jaguar is held in great respect by the natives, partly because man-eating
    jaguars are occasionally encountered.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A mission Indian was killed and devoured by a jaguar while honey-hunting in
    the forest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The natives say a jaguar attacks humans only when old, tooth-worn, starving,
    and unable to pursue or tear other prey, and that it is otherwise afraid of humans.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: When hunted, the jaguar fights, especially when cornered or with cubs; Indian
    hunters carry scars and sometimes lose their lives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: During jaguar hunts, many dogs are lost when the jaguar rips up dogs that
    come within reach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A jaguar trap is made by selecting a forest path with spoor, felling a tree
    to block the way, digging a pit, and suspending a looped lasso tied to a stout
    branch.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The lasso tightens around the jaguar's body when it falls into the pit, preventing
    it from biting through the lasso and escaping.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Indians say that blocking the jaguar's accustomed path puzzles the animal
    while it looks for an exit arranged by the trap-makers.
  category: speech
  evidence_refs:
  - ev:8
