literal_observations:
- id: obs:1
  text: Men adjust or discard blankets according to temperature, weather, and activity;
    the blanket may be worn as a double skirt or raised over the shoulders and head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When hunting, men may wear only a rawhide girdle cut into a broad fringe hanging
    down the loins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rawhide sandals and leggings are worn by men while hunting and by women while
    gathering fuel, and sandals may also be worn over hot dry ground.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raw hides and animal parts are made into mats, saddles, honey bags, and tobacco
    pouches ornamented with tassels or red paint scoring.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Both sexes adorn themselves, with men described as doing so more than women;
    ornament-making work is divided between men and women, with men doing the larger
    share.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Head ornaments use feathers, including a valued broad red woollen band decorated
    with shell buttons and scarlet feathers, sometimes with a chin-strap and tassels.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The head-dress is regarded by the wearer as a charm, especially against the
    evil spirit of the swamps, and is worn chiefly for visiting, feasting, or courtship.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Small shell buttons are fashioned with a knife while using the ball of the
    naked heel as a work surface, and men may spend hours making them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Long necklaces of closely strung shell buttons are described as money, with
    one such necklace representing the value of one sheep.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Other necklaces are made from seeds, bone pieces from water-fowl legs, water-plant
    seeds, fresh-water mussel shell sections, sheep teeth, and beads.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The plate caption describes Lengua girls with red or black facial and body
    paint made from fruit and vegetables, applied by moistening hard paint with the
    tongue and lips and scoring designs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The plate caption notes the absence of eyebrows and eyelashes through individual
    plucking, a horn comb worn for convenience rather than ornament, and a very tight
    waist-belt.
  category: attribute
  evidence_refs:
  - ev:10
