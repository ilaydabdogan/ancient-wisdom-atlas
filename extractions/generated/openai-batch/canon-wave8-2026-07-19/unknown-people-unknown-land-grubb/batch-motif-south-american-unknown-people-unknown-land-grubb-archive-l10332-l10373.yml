canonical_text:
  quote: ''
  summary: The narrator describes Poit obtaining and sharpening iron-headed arrows,
    then guiding him off the beaten track across the winding River Monte Lindo. They
    encounter fresh jaguar tracks and an elderly hunter who chooses to avoid the danger.
    In the forest the route becomes blocked; Poit goes ahead to reconnoitre, and the
    narrator hears crackling nearby, fears a jaguar, shouts, and then sees Poit peering
    through the trees with a strange look of excitement and fear.
  language: English
