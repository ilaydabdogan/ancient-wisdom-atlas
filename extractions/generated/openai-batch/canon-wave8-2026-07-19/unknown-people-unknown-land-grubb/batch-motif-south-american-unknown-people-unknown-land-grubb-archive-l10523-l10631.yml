canonical_text:
  quote: ''
  summary: After an attack on the narrator, villagers visit him, return some supplies,
    and carry a message by relays to the mission station. The visitors expect him
    to die, prepare a shaded burial place, repeatedly urge him not to die during the
    night, and fear his spirit if death occurs after dark. The narrator states that
    local custom would permit burying a person alive before sunset if death at night
    seems likely, and he struggles to avoid swooning because swooning is treated like
    dying. He spends the night behind a mosquito-net and bough fence, then tries unsuccessfully
    to travel east because of weakness.
  language: English
  quote_policy: summarized
