canonical_text:
  quote: ''
  summary: The passage describes reasons given for infant destruction, including perceived
    ill-luck, dark skin at birth, and unpropitious dreams. It states that mothers
    may suffer deeply but consent because of hardship, anticipated child suffering,
    or pressure from relatives after desertion by a husband. The narrator condemns
    the practice while arguing that life conditions create extenuating circumstances.
    A Christian settled family is given as an example of changed conditions, and an
    1895 episode is described in which missionaries obtained a promise that an expected
    child would be spared.
  language: English
