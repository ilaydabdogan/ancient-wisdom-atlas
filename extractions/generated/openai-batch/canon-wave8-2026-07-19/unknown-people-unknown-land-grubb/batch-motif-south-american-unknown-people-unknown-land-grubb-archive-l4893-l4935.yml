canonical_text:
  quote: ''
  summary: 'The passage describes several kilyikhama spirits: one with lights beside
    his head, a thieving spirit blamed for lost objects, spirits invoked for hunting
    and gardening, and a terrifying forest-associated spirit whose encounter is said
    to herald death. It reports belief that these spirits are usually heard or felt
    rather than seen, may aid witch-doctors in sorcery, and desire possession of human
    bodies, including by replacing a dreamer''s wandering soul during sleep. The author
    states that they are not treated as deified human souls and that their original
    status is unclear.'
  language: English
  quote_policy: summarized
