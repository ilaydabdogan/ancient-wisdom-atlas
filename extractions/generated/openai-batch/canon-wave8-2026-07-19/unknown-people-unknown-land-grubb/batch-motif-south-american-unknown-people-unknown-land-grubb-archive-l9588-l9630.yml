canonical_text:
  quote: ''
  summary: The passage reports an episode in which a deserted woman gives birth, after
    which villagers who had promised not to kill the infant allegedly arrange for
    a visiting witch-doctor to kill the child at night. A young boy tells the narrator
    that the killing was done with a club, that the killer received payment, and that
    the child's grandfather buried the body beneath a bottle-trunk tree before dawn.
    The narrator notes the secrecy surrounding the act.
  language: English
