  quote: ''
  summary: The passage describes the establishment of a more settled mission-station
    community at Waikthlatingmangyalwa, with work hours, rules, a bell, schooling,
    services, feast and drink restrictions, transport rules, and Christian instruction.
    It also reports that the Indians complied outwardly but still desired old habits
    and sometimes left under pretexts such as hunting or feasts. Captions describe
    a bird’s nest and a hidden forest still used for fermenting beer.
