  summary: 'The passage describes three superstition-related examples: a Christian
    convert demonstrates lack of fear by standing on horse bones; humanlike whispering
    sounds in the Chaco woods are attributed by Indians to travelling spirits of Spaniards;
    and twins are considered unlucky, with both usually killed, in a practice the
    narrator connects to superstition and infanticide.'
