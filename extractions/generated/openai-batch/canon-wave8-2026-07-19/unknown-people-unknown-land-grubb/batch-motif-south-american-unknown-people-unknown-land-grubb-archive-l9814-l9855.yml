canonical_text:
  quote: ''
  summary: The narrator describes visiting Mechi’s hut, secretly sending an Indian
    companion to gather information, then leaving and hiding nearby until revelry
    began. On returning later, he hints that he knows about the drinking by mentioning
    headaches and a chant from a fishing-party, causing confusion among the villagers.
    The passage explains that women and sober men had hidden drinking vessels in the
    wood and muffled intoxicated men with blankets. The narrator then states that
    drunkenness was comparatively easy to combat through missionary influence and
    some Paraguayan government cooperation. A transition notes that sickness cases
    were harder because witchcraft was influential; an old woman reported near death
    had been placed outside while people prepared for burial.
  language: English
  quote_policy: summarized
