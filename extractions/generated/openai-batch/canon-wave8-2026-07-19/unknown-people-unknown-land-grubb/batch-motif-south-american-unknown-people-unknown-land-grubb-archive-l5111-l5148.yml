canonical_text:
  quote: ''
  summary: The passage reports beliefs about departed souls returning to the village
    where death occurred, especially near early morning, seeking warmth at fire embers.
    If a relevant household fire is dead, the spirit may scatter ashes that endanger
    anyone who later steps on them, leading to a practice of burying ashes. The passage
    also describes a reported plan to kill the narrator, regarded as a witch-doctor,
    and to build small huts along his usual eastward route so that his spirit would
    be drawn away from the country toward the east.
  language: English
