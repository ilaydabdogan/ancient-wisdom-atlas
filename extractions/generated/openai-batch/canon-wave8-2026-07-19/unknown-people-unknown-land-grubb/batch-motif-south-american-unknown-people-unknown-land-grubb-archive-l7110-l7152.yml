  quote: ''
  summary: The narrator camps away from a village with a baby, washes and wraps the
    child, sets up a mosquito-net bed, makes a fire, and plans how to keep the infant
    alive with rice-water, gruel, egg, and possibly goat milk until reaching the River
    Paraguay. He intends to leave with guides, but the people refuse to accompany
    him. He fears that if they think they see the ghost of the woman, they may kill
    the child to propitiate the mother. He is delayed ten days in anxiety.
