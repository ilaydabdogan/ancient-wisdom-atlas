literal_observations:
- id: obs:1
  text: Roadway signs at an abandoned village use an inclined stick or bamboo to show
    direction, a hollow to show distance, and added objects such as a gourd, feathers,
    maize, or wool to indicate a feast and its foods.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: People on the River Paraguay make dug-out canoes, while inland people hollow
    out a bottle-trunk tree to cross swollen swamps and streams; the passage names
    a hard-wood digger and fire-brands as tools.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists bows, arrows, and a heavy hard-wood club as the principal
    weapons of chase and war, and describes the materials and preparation of bows
    and arrows.
  category: object
  evidence_refs:
  - ev:6
- id: obs:4
  text: The bow is held vertically, the string is drawn to the right cheek, no quiver
    is used, arrows are stuck in the belt, and weapons are made exclusively by men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:5
  text: Gardening is small-scale; crops include pumpkins, sweet potatoes, tobacco,
    maize, and mandioca, with drought, flood, birds, ants, locusts, and rats described
    as obstacles.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:6
  text: House-building is described as impermanent because people move between hunting
    grounds or abandon villages through sickness, death, or superstition.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:7
  text: One shelter type is circular and dome-shaped, made from sticks with rushes,
    grass, and palm leaves piled over it by women as rough thatch.
  category: object
  evidence_refs:
  - ev:10
- id: obs:8
  text: Suhin huts are said to be higher and more regularly thatched than Lengua huts,
    covered to the ground, and entered through a small opening on all fours.
  category: object
  evidence_refs:
  - ev:11
- id: obs:9
  text: A gourd engraving caption identifies Kifyikhama as a feared forest spirit
    with a long, thin, many-limbed form and flaming eyes; lost Indians are said to
    fear such apparitions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: A caption identifies a Creation Beetle with three men mounted on a horse inside;
    it says the meaning is obscure and links the beetle to the Creator in Lengua theory.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Engraved gourds are described as diaries of journeys, marking animals, spirits,
    and types of country seen along the route.
  category: object
  evidence_refs:
  - ev:5
