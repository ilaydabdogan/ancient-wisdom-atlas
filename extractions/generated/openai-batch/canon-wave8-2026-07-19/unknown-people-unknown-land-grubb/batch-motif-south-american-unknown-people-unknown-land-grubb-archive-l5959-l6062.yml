canonical_text:
  quote: ''
  summary: 'The passage describes attitudes toward superstition among Mission adherents,
    a marriage-related test of a woman''s freedom from fear of ghosts, and an account
    of wizards or witch-doctors: their attributed powers, village duties, guarded
    secrets, initiation through fasting, solitude, visions, animal ingestion, secrecy,
    and trance-like soul-wandering practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mission adherents are described as discussing dreams, ghost-stories, and witch-doctor
    tricks humorously around fires.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man seeking to conclude a marriage contract required evidence that
    the woman had stopped using obscene language, had learned to pray, and was no
    longer afraid of ghosts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man tested the woman's fear of ghosts by sending her alone on a
    dark night to draw water from a swamp about half a mile away, and she completed
    the task.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that women seldom leave the village after dark and that
    water-fetching at night is normally accompanied by a man.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man would have refused the woman if she had failed the test, despite
    knowing that another marriage opportunity might not occur for many years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An eighteenth-century Jesuit account says Indian conjurors were believed able
    to inflict disease and death, cure disorders, reveal distant and future events,
    cause weather phenomena, and handle serpents safely.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Every village is said to have a witch-doctor whose duty is to protect the
    people from supernatural evil and to avenge wrongs through sorcery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The office of wizard is not always hereditary; secrets are guarded, and the
    passage says much of the art is deception mixed with self-deception.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Training for witch-doctors includes severe fasting, abstention from fluid,
    herbs, solitude, and a condition in which spirits, ghosts, and visions are seen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The training also includes eating live toads, some kinds of snakes, and plucked
    live birds, with bird whistling power believed to pass to the witch-doctor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the preliminary initiatory stage, witch-doctors are instructed in mysteries
    under a pledge of secrecy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some wizards are described as entering a hypnotic-like state by sitting for
    hours in a strained posture and fixing their gaze on a distant object; in this
    condition they are believed able to send their souls wandering.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Wizards are also described as having unwanted visions and as concentrating
    on charms to solve perplexing problems.
  category: action
  evidence_refs:
  - ev:8
