canonical_text:
  quote: ''
  summary: 'The passage reports beliefs about spirits after death: a killer of someone
    from another tribe need not fear the victim''s spirit because clan and tribal
    life continue after death; the soul is thought to be confused after leaving the
    body, to hover near the village for about a month, and then to depart to the realm
    of the dead after the mourning feast. It also states that the deceased''s belongings
    and animals are destroyed at death, apparently for use in the afterlife, and that
    ghosts may haunt the living if appropriate funerary actions are not taken or memories
    are stirred.'
