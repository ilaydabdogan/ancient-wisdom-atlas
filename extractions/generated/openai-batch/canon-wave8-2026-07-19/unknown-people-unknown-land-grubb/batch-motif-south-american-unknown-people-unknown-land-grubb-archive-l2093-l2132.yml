canonical_text:
  quote: ''
  summary: The passage reports an Indian tradition about a secret hand-cut passage
    or gallery containing treasure, where three entrants disappeared and were said
    to have been killed by guardian spirits. The narrator notes the remoteness of
    this rocky gallery from the Chaco Indians' swampy homeland and suggests a possible
    link to Peruvian treasure concealment during the Conquest. The passage then compares
    Peruvian and Aztec traditions of civilizing strangers, including Quetzalcoatl,
    with Chaco traditions of strange and wonderful people yet to come, as reported
    by the Lengua informant Poit from a dying western wizard.
  language: English
