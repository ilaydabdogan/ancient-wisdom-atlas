  summary: The chapter opening describes mission travel among the Lengua, the narrator’s
    need to live with and adopt local customs, the establishment of temporary headquarters
    at Thlagnasinkinmith, a large welcome feast for Archdeacon Shimield, travel by
    bullock-cart, pipe-sharing etiquette, shortage of provisions, and a storm-interrupted
    return journey toward an Indian village.
