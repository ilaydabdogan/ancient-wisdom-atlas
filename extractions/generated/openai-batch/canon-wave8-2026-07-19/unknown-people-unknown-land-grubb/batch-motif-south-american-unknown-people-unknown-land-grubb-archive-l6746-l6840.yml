canonical_text:
  quote: ''
  summary: The narrator recounts the death and burial of an old man, Ataiwanam, at
    Thlagwakhe. After the burial, the community tries to remain in the village despite
    fear of the dead man's ghost. They alter shelters, place the narrator between
    themselves and the ghost, and later panic at night when the ghost is believed
    to have entered the narrator's hut. Some people accuse the narrator of secretly
    communicating with the dead and plan to kill him.
  language: English
  quote_policy: summarized
