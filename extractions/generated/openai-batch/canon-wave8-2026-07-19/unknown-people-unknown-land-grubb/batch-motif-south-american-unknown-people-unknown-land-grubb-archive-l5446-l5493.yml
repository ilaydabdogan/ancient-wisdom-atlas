canonical_text:
  quote: ''
  summary: 'The passage gives three dream anecdotes interpreted through Lengua beliefs:
    a spirit-beetle entering a sleeper’s body and being extracted by a witch-doctor;
    a dream of eating a taboo water-fowl connected to a child’s sleeplessness; and
    a dream encounter with an aunt’s ghost at a well. A following caption describes
    a Lengua witch-doctor and the caraguata plant.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator introduces the examples as dreams working together with superstition
    in the described community.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first dream, a spirit appeared as a horned beetle, flew around the
    sleeper, entered his body near the knee, and caused pain; after waking, no visible
    injury was seen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the absence of an opening was attributed to spirit power;
    a witch-doctor was called, extracted the beetle by suction, showed it to witnesses,
    and the lack of a wound was attributed to sorcery.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Another Indian dreamed he was eating a kala, or water-fowl, and on waking
    heard the birds screeching in a nearby swamp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The second dreamer reported that his young child, who was with its mother
    in another village, had been awake most of the night; the passage states a belief
    that a man with a young child should not eat this bird or the child will be sleepless.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a third dream, a thirsty man went to a well at night, saw the ghost of
    his aunt leaning on a stick with an otter-skin cloak around her shoulders, woke
    in terror, told others, and the village became awake and fearful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The closing caption identifies a Lengua witch-doctor in the forest, states
    that a witch-doctor is recognized by unkempt condition, dirt, and a ragged blanket,
    and describes extracting water from the caraguata plant.
  category: attribute
  evidence_refs:
  - ev:6
