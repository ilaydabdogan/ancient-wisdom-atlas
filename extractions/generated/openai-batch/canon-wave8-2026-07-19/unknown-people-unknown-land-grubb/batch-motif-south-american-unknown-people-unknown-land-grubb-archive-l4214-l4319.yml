canonical_text:
  quote: ''
  summary: The narrator arrives at a village feast where many men are intoxicated
    and is accused by the Chief and others of killing a horse by witchcraft. He camps
    apart, refuses invitations to dance, and during the night an old man repeatedly
    mistakes his request for water as a request for beer. The narrator later tries
    to leave with guides, including the intoxicated Chief Mechi, reaches another village
    preparing a feast with algaroba-bean flour and beer, and then travels onward with
    three Indian lads. Their camp in an open plain is overtaken by thunder, lightning,
    dust, rain, and cold; their fire is extinguished and they spend the night huddled
    in water. The passage also includes a caption describing Lenguas grouped on a
    tree uprooted by a pampero storm.
  language: English
  quote_policy: summarized
