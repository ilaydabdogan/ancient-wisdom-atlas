canonical_text:
  quote: "“Ikhawe mintime inningkoo” (That is not our custom)."
  summary: The passage describes general traits attributed to the Lengua Indians,
    emphasizing physical courage, emotional restraint except under provocation, strong
    adherence to custom, reluctance to adopt foreign customs or words, use of native
    dress among their own people, and a custom in which a returning person initially
    avoids overt notice of close relatives before later showing pleasure at reunion.
