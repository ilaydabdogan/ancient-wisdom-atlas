canonical_text:
  quote: "“Before these people came amongst us we were in darkness...”"
  summary: Philip speaks in church on the day a new lamp is hung. He uses darkness
    and light to describe former ignorance and increasing understanding, attacks witch-doctors
    as influenced by evil spirits, says the Chief of heaven has made them provide
    a brighter light, contrasts devil-followers with God-followers, predicts the end
    of witch-doctors’ power, and tells opponents to move beyond the River Monte Lindo.
    The narrator comments on Philip’s zeal, his weak grasp of Christian liberty, and
    the later Christianization of Waikthlatingmangyalwa.
  language: English
