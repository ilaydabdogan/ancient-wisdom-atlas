canonical_text:
  quote: ''
  summary: 'The passage describes a belief that souls meet in dreamland and act in
    spirit as they would in bodily life. The narrator then introduces an example meant
    to show how dreams and related assumptions can affect conduct and be misunderstood
    by outsiders: an Indian contracted for six months of service in exchange for a
    horse, served six weeks, left before dawn for his distant village, and was later
    said by other Indians to have gone because his child was sick and because he believed
    the narrator would not allow him to leave.'
  language: English
