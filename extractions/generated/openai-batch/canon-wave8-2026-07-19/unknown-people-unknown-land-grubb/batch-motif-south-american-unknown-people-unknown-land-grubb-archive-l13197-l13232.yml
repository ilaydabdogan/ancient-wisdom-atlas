canonical_text:
  quote: ''
  summary: Appendix IV introduces outside testimony in the form of unsolicited letters.
    One letter, dated June 5, 1892, describes visitors deciding to visit the South
    American Missionary Society station in the Paraguayan Chaco, gives the station's
    Indigenous name and location, notes its development under Mr. W. Grubb, and recounts
    the visitors' reception by Grubb and the local Indigenous people.
  language: English
  quote_policy: summarized
