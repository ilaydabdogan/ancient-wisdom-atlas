canonical_text:
  quote: ''
  summary: The first-person missionary narrator, discouraged about forming a mission,
    meets four men from the west, including chiefs, a witch-doctor guide, and a former
    thief. They agree to return inland with him, influencing others to accompany him
    and helping him recover his goods. The narrator later describes this meeting as
    decisive for establishing the mission. A later hut fire destroys most of his property,
    but an old woman rescues a case of powder before remaining powder explodes. Lacking
    European clothing, the narrator temporarily travels in Indigenous-style dress,
    receives ornaments and a new name, and later helps establish a site at Thlagnasinkinmith
    while continuing to face distrust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator is dispirited and considers that he may never be able to form
    a mission among the people, especially because earlier Jesuit attempts among other
    Chaco tribes had failed to establish lasting work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four men arrive from the west and are recognized by the narrator: Yokseyi,
    another celebrated chief, a witch-doctor who had served as guide, and a man who
    had once tried to steal the narrator''s goods.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitors tell the narrator that they have seen his things in his hut,
    smoke a pipe with him, and agree to return with him to help with his goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a renewed discussion in the camp, the four companions state that they
    are going back with the narrator; Pinse-apawa and some others also agree to go,
    and the narrator later finds his goods intact inland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that meeting the four men prevented him from abandoning
    his attempt to settle among the people, and that Yokseyi and the witch-doctor
    later became Christians while the other two became friends.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: While preparing to move, the narrator's hut catches fire in a dry season,
    and most of his property is consumed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old woman rushes into the smoke and flames, retrieves a case containing
    about nine pounds of powder, and places it at a safe distance before other tins
    of powder explode and the hut collapses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After losing his clothing and belongings, the narrator temporarily travels
    in Indigenous fashion with only a blanket, is decorated with necklaces and an
    ostrich-feather head-dress, receives the name Tathnawu-lamum, and later receives
    sheep-skin sandals from one of the Indians.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Thlagnasinkinmith, a site is cleared, native-style buildings, palm huts,
    and gardens are made, but the narrator still perceives distrust and fear among
    the natives.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator treats an old woman with fever, after which she appears much
    better and his prestige increases; a few weeks later the chief's infant child
    falls sick, but the passage ends before the outcome is given.
  category: sequence
  evidence_refs:
  - ev:7
