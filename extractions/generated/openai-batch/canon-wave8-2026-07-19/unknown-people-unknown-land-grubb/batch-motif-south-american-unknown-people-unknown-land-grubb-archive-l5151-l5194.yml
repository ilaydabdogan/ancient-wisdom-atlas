  quote: three ideas seem to prevail regarding the future abode of the soul
  summary: 'The passage reports beliefs about post-mortem destinations: ancestors
    located in the east, Guarani souls retiring to a Brazilian forest-and-falls region
    to join ancestors, souls wandering, moving west to cities of the dead, or inhabiting
    a world beneath the earth. It also reports beliefs that many animals share immortality
    with humans, with fish and serpents excepted, and notes a practice of not killing
    a dog or horse except after the owner''s death.'
