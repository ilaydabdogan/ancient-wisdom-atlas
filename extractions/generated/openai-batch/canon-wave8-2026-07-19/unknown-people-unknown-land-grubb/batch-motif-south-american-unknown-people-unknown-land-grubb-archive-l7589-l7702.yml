canonical_text:
  quote: ''
  summary: The passage describes a Lengua Kyaiya feast held through the night with
    gourds, fires, food, water, tobacco, dances, chants, pranks, a sick woman attended
    by a witch-doctor, sunrise closure by rattling gourds, daytime sleeping and preparation,
    and resumption at sunset for six days and nights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Kyaiya feast is described as having three essential features: gourds,
    large fires kept burning from sunset to sunrise, and a pot containing the food
    supply.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the night women periodically served dancers with food, water, and pipes
    of tobacco without interrupting the dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women placed small pieces of food in selected men’s mouths, while others gave
    water or held pipes to their mouths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Girls sometimes played good-natured tricks on young men, such as giving clay
    instead of food or spilling water down a drinker’s chest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some young men took part in wrestling contests and other dances while the
    Kyaiya continued.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Maning dance, dancers formed a circle with arms around each other’s
    waists, and girls held on behind to the men’s waist-belts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Maning chant gradually became faster until the dancers were out of breath,
    and the recorded words are mostly described as having no apparent meaning except
    a word glossed as “moon.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Another dance had two facing lines of dancers with arms resting on shoulders;
    the lines advanced and retreated while chanting, with the pace increasing until
    exhaustion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A sick woman was attended by a witch-doctor and a few companions while the
    feast proceedings continued.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The night scene combined a sick dirge, dance chants, merriment, and the light
    of many replenished fires.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: At sunrise the gourds were raised and rattled to signal that festivities were
    over until the following evening.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: After the night’s dancing, people slept under trees with blankets over their
    heads; the narrator says a traveller might have mistaken the covered forms for
    dead bodies.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: In the afternoon people resumed painting and decorating, gathered firewood,
    carried water from the swamp, and some old men went fishing.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: At sunset the feast resumed with rattle and chant and continued for six days
    and nights.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: After the feast ended, etiquette required visitors to leave at once, though
    they soon stopped to sleep before continuing their journey.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The narrator says he attended such feasts in his early years among the people
