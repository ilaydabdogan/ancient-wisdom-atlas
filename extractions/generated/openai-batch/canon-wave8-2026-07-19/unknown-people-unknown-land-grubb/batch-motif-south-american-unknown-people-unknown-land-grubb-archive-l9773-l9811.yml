  quote: ''
  summary: The narrator approaches a western village, meets two familiar girls who
    flee ahead, hears commotion and snatches of drunken chanting, and reaches a village
    that has had time to prepare. Only a few residents and the chief Mechi are visible;
    Mechi says the others are fishing and repeatedly urges the narrator to continue
    onward. The narrator delays, hears smothered sounds from the nearby forest, and
    observes Mechi becoming nervous.
