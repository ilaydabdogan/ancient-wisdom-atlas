canonical_text:
  quote: ''
  summary: 'The passage reports explanations and incidents concerning food production
    and sharing: one man says larger crops or stored provisions would attract claims
    from less thrifty clansmen, and hunters who find ostrich eggs take all, eat many,
    carry few home, and later understate the find to avoid feeding people described
    as capable but unwilling to seek food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says larger crops would not benefit him because clansmen with tiny
    gardens would become uninvited guests and the surplus would go to them rather
    than to his family.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker says that if he stored crops for a time of scarcity, less
    thrifty men would call on him after learning he had a stock.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hunters find an ostrich nest containing many eggs and immediately take all
    of them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When asked why they did not leave some eggs to maintain the ostrich stock,
    the hunters say a wolf or another Indian would consume or take whatever remained.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hunters sit down, eat an amount the narrator calls unnecessary, and carry
    away only a few eggs for their families.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the village, people described by the narrator as exceptionally lazy and
    as having made no effort that day to obtain food surround the hunters and ask
    what they found.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunters reply that they found ostrich eggs and say they have only a few,
    barely enough for a meal for their own families.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator says the hunters' statement was largely untrue, and the hunters
    explain that some people would not seek food if they could obtain it from others.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The hunters say they cannot value denying themselves and carrying a heavy
    burden through heat in order to spare capable men from exertion.
  category: speech
  evidence_refs:
  - ev:8
