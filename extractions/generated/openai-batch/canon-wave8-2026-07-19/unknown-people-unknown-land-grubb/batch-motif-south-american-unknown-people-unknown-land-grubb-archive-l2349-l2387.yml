  quote: ''
  summary: The passage describes a village near swampy land where people cultivate
    gardens, obtain fish and waterfowl, eat large watersnakes, and warm themselves
    by fires during cold wet weather. It then describes an isolated forest village
    struck by virulent smallpox, with sufferers lying helpless, vultures waiting in
    nearby trees, deaths followed by burial in the forest, grief among relatives,
    belief in a dark shade-land after death, and four sick men struggling to carry
    a dead comrade for burial.
