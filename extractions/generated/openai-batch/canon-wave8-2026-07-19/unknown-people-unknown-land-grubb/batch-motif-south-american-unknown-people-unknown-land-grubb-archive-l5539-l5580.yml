canonical_text:
  quote: ''
  summary: The passage discusses Lengua beliefs about dreams. It first explains a
    dream of threatened punishment as connected with a man's remembered wrongdoing
    over a marriage matter. It then reports a dream in which a man's spirit leaves
    the village, is seized by gigantic kilyikhama beings, escapes near a forest, and
    returns to the village before he wakes. The passage also describes a belief that
    a kilyikhama may enter a person's body while the soul has been carried away, and
    that the soul waits for a witch-doctor's chant signaling that the possessing kilyikhama
    has been expelled and it is safe to return.
  language: English
