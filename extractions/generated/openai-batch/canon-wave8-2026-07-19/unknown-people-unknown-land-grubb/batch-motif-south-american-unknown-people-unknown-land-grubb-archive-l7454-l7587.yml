canonical_text:
  quote: ''
  summary: Ethnographic description of preparations for a Lengua feast, including
    brewing vats, invitations, food gathering, guest reception, body painting, the
    Kyiaya chant and dance, ritual movement around and over food, all-night singing,
    beer drinking by men, and measures to control quarrels during intoxication.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two men are deputed to prepare large bottle-trunk trees as hollowed brewing
    vats, and five young men are assigned to carry invitations to surrounding villages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunters, fishers, and women go out and return with burdens; the process is
    repeated until a large supply of food is collected.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Guests arrive; women and girls meet them, relieve them of their arms, and
    accompany them toward the camp, where the chief and head men formally receive
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People decorate and paint themselves; the narrator is dressed and painted
    with red urucu paint and given head decoration.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At sunset, gourds are rattled to accompany a low minor chant, and the Kyiaya
    begins with a circle of male singers keeping step and swaying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Kyiaya chants are generally without words, while the
    people say that words once existed but have been lost for generations.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food is spread on skins in an open space; the witch-doctor and an assistant
    stand in the center with gourds and ostrich plumes and dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the witch-doctor's signal, dancers form a V with the wizard at the apex,
    circle the food, jump over it from east to west, then from north to south, and
    end with a flourish of gourds that signals the meal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: One requirement of the feast is that the song must continue until sunrise,
    maintained by chanters relieving each other in relays.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Elder men sit in a circle and drink beer from gourds served by women; the
    text states that only men drink and that women and youths are not allowed intoxicants.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Because quarrels can arise at feasts, sober men are assigned as police, and
    women hide dangerous weapons when trouble begins.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Drinkers later join the dance circle while unsteady and drowsy, producing
    laughter and jeers from onlookers.
  category: action
  evidence_refs:
  - ev:11
