canonical_text:
  quote: ''
  summary: The author argues that the young Christian church among the Chaco Indians
    still needs supervision and instruction, but says converts have been encouraged
    to administer their own church. Indigenous Christians read lessons, address congregations,
    serve as churchwardens, assist in decisions about baptism and confirmation, work
    as itinerant evangelists, and are being trained in a school for future evangelists.
    The author hopes the church will become missionary and that Indians will be converted
    by people of their own community. The passage closes with an appeal for continued
    support of the people and their church, contrasting earlier conditions and adherence
    to witchcraft with amelioration attributed to God's blessing.
