canonical_text:
  quote: ''
  summary: The passage describes why feasts are held at night, then gives a firsthand
    account of preparations for a Kyaiya feast at Kilmesakthlapomaap in December 1892.
    It includes village setting, the narrator's stay with a witch-doctor, nightly
    fireside talk, interleaved captions on a masked dance and wrestling contests,
    communal planning for food collection, and a joking exchange about hunting sheep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Celebrations are described as normally taking place at night; stated reasons
    include daytime heat, cover after sunset, witchcraft being practiced chiefly after
    sunset, the religious character of feasts, and the aesthetic setting of darkness,
    camp-fires, and moonlight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator selects for description a Kyaiya held in Chaco midsummer, December
    1892, at Kilmesakthlapomaap, about one hundred miles by road from the River Paraguay
    and from the nearest point of civilization.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The village is situated in an open space under large algaroba trees, with
    a north-facing encampment, a swampy stream to the south, and nearby woods and
    tall palm trees.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator stays as guest of the witch-doctor Waitkyaingwahik, called “Cow-nose,”
    using a deer-skin, palm-log pillow, blanket, and mosquito-net, and receiving food
    from the host.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the feast-planning scene, the narrator visits gardens, bathes with
    lads in an open pool, studies language and habits, and at night sits around the
    fire smoking, talking, and hearing adventures and folklore.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An interleaved caption describes the “Sowalach” as a Yanmana feast dance in
    which feathered and masked lads issue from the forest, move in a serpentine formation,
    and are met by women who dance around an honoured girl, chant, and sometimes splash
    the lads with gourds of water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: An interleaved caption describes wrestling contests in which throwing is done
    with legs and feet, and one line of men gripping belts is challenged by another
    group attempting to break the line.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Kyaiya is proposed because algaroba beans, fish, palm-cabbages, and deer
    are available in sufficient quantity for entertaining many guests.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Feast preparations are divided among groups: some women collect algaroba
    beans for beer and flour; others collect palm-cabbage; older men fish for fat
    and fish-flour; younger men hunt game.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When asked what he will hunt, the narrator says he will kill sheep, prompting
    jokes about sheep being savage and dangerous; he replies that his game will have
    more fat and be more certain than deer.
  category: speech
  evidence_refs:
  - ev:9
