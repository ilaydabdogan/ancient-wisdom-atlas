  quote: ''
  summary: The passage explains, from the narrator's perspective, that pressure from
    stronger peoples and conflict in an inhospitable plain fostered communal clan
    life among the Indians described. It then describes a shift toward smaller kin
    groups, property acquisition, sanctions against idleness, opposition to marriages
    with indolent men, and narrator-led advocacy for property rights, which the narrator
    says contributed to the decline of the communal system.
