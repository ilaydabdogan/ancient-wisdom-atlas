  quote: ''
  summary: The passage describes dreams as central to Indian life and conduct. During
    sleep the soul is said to leave the body through the chest and perform the dreamed
    actions. Dangerous Tcilyikhama may enter the vacated body or seize the soul. The
    body is described as a house or instrument of the soul, and dreams are treated
    as declarations of the soul's will, as well as warnings and guides for behavior.
  language: English
