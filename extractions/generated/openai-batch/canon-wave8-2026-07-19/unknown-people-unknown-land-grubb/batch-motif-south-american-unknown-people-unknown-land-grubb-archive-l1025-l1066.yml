  summary: 'The first-person narrator describes dangers faced in entering and living
    alone in the Chaco: possible burial if mistaken for dead, captivity, abandonment,
    warnings from outsiders, protective prayers by friends, rumors of his death during
    absences, and an all-night canoe journey to prevent an official death announcement.'
