  quote: ''
  summary: 'The author describes the economic and territorial effects attributed to
    the Anglican Mission: a Paraguayan-founded South American company operates nearby
    with extensive land and cattle holdings; European movement inland is said to follow
    mission routes; trade with Indigenous people has expanded; imported tools, household
    items, cloth goods, mosquito-nets, handkerchiefs, and clothing have become common
    among Indians where mission influence has spread.'
