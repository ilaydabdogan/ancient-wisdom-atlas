  quote: ''
  summary: 'The passage describes beliefs attributed to the Lengua/Chaco Indian subject:
    limited pleasure and pain in the hereafter, future life as unattractive, life
    as coveted and death as feared, an indifferent Creator who receives no worship,
    efforts to avoid earthly consequences of wrongdoing and ward off malignant kilyiJchama,
    and ordinary social instincts with a practical aim of satisfying desires without
    getting into trouble.'
