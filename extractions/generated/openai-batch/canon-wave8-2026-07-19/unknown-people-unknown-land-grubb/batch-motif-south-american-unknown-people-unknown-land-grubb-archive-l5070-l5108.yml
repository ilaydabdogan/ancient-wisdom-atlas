canonical_text:
  quote: ''
  summary: The narrator describes an incident at Riacho Fernandez used to illustrate
    the belief that the dead hover nearby for a time after death. While sleeping in
    an abandoned hut with five Indian companions, he hears a sound like someone fanning
    embers at a dead fire. His companions identify the sound as an aphangak, associating
    it with the ghost of an Indian whose bones the narrator had recently buried under
    a castor-oil tree near the hut. The narrator finds no visible cause, while the
    companions remain frightened through the night; the next day he suggests the sound
    may have been caused by rubbing boughs.
  language: English
