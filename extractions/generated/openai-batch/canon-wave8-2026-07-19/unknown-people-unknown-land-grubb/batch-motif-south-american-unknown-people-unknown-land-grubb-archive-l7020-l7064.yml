  quote: our custom is to place it in the grave with the mother.
  summary: The narrator gives water to a dying woman, argues unsuccessfully against
    her burial while she is still breathing, and then opposes the father and other
    men when they prepare to place her living three-month-old child in the grave with
    her according to their stated custom. Fire is placed in the woman's grave, and
    the narrator threatens the men with the wrath of Higher Powers.
