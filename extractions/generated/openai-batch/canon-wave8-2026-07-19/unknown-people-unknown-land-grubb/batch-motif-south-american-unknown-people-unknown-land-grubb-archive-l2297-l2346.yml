  summary: The passage describes evening life in a Chaco Indian village with fires,
    cooking, painted bodies, and ostrich-feather adornment; then describes the same
    village later abandoned after a death because of fear of the departed spirit.
    It then shifts to an island village in a large swamp, emphasizing water depth,
    dense vegetation, native paths, danger from snakes and alligators, and a method
    for conveying goods across the swamp using a tied cow-hide raft steadied with
    palms.
