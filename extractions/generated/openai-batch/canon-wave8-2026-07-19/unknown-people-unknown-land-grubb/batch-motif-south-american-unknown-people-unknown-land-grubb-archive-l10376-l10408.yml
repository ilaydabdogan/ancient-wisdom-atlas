canonical_text:
  quote: ''
  summary: In dense undergrowth near a river, the narrator notices an unusual expression
    on Poit's face but assumes it may be fear of a jaguar. Poit gives directions,
    joins the narrator, then uses a forgotten kettle as a reason to leave and urges
    the narrator to clear a path. The narrator later says Poit had been maneuvering
    for a shot. While bending down, the narrator is struck in the back; he sees Poit
    nearby, first thinks of an accidental shot at a jaguar, asks for help, and then
    Poit cries out and flees toward the river.
