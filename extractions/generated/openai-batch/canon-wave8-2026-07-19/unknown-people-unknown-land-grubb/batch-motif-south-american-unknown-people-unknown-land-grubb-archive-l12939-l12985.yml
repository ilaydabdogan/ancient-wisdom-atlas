  quote: ''
  summary: 'The passage describes leaf-cutting saiiba ants in the Chaco: their columns,
    leaf-carrying, tree-cutting, mound and underground passage system, fungus cultivation,
    and apparent night work. It then describes mosquitos as a dominant hardship of
    daily life, especially after sunset and in swampy places, affecting humans and
    horses.'
