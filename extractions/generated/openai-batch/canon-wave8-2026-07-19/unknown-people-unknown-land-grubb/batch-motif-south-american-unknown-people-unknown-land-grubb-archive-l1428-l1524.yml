canonical_text:
  quote: ''
  summary: The narrator returns to Riacho Fernandez, learns that Indians have looted
    an English company's store, and goes into the interior to confront them. Despite
    warnings, he travels via a small encampment and reaches Neantamama, where he challenges
    the culprits about the theft and their reputation. They agree to repay the value
    in skins and feathers if he accompanies them to the foreigners and later returns
    to live with them. During the wait, they press him to join their village and clan,
    which he refuses. The compensation is gathered by hunting and delivered to the
    English company.
  language: English
  quote_policy: summarized
