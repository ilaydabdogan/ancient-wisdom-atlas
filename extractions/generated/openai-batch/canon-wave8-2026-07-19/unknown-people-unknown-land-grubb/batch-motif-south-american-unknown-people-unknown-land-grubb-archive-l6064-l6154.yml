  quote: ''
  summary: The passage describes Lengua wizards or witch-doctors as ritual specialists
    believed to arrange rain, foretell events, raise storms, intervene in crop failure,
    lay ghosts, drive away spirits, exorcise kilyikhama possession, and help wandering
    souls return to bodies. It also describes the narrator’s explanations that some
    predictions depend on observation, calculation, or practical information, and
    recounts an intervention in a supposed possession case.
  language: English
  quote_policy: summarized
