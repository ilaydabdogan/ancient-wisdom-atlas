canonical_text:
  quote: ''
  summary: The narrator, after a serious loss of valuables, orders Poit to recruit
    six men and gather provisions for continuing the journey. The party travels to
    Poit’s family village, where the narrator questions Poit and others about cattle.
    Their reassuring answers later prove false, leading the narrator to conclude that
    Poit’s people are aligned with him. The narrator orders cattle gathered for direct
    inspection, and the passage explains local practices concerning milk, open grazing,
    and stray cattle.
