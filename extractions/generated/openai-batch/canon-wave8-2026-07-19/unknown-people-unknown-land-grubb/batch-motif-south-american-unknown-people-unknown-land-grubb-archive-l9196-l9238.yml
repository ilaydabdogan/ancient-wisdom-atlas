  summary: The narrator reflects on missionary humility, cites St. Paul as an example,
    and recounts a New Year’s Day 1894 conversation with Keamapsithyo (Philip), who
    was interested in Christianity. The narrator urges him to abandon heathenism and
    follow Christ as Chief. Keamapsithyo says his sinful past makes him unable and
    unworthy of forgiveness. The narrator responds by admitting similar sins and begins
    to compare local ideas and Christ’s teaching about sins of intention.
