canonical_text:
  quote: ''
  summary: The passage describes periodic feasts among Chaco/Lengua Indians, listing
    seven types and summarizing their occasions, ritual actions, participants, objects,
    and reported changes in practice. It includes coming-of-age feasts, a seasonal
    feast, marriage, funeral, war, visitor, and hunting-related feasts, with dancing,
    rattles, drums, masks, firelight, adornment, and food gathering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Periodic feasts are described as major events that bring people together,
    widen friendships, and combine religious and social elements.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Seven feasts are listed: Yanmana, Wainkya, Kyaiya, a war feast, a marriage
    feast, a visitor-welcome feast, and a funeral feast.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Yanmana, a girl sits in a specially constructed booth with one or two
    girl companions, is ornamented, adopts the longer skirt of a woman, and ceases
    to be a child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the Yanmana, women form a ring and dance with canes topped with deer
    hoofs, while an old woman in the center rattles a cane, chants, and makes bodily
    contortions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men form circles with gourd rattles, and boys dressed in ostrich plumes wear
    masks representing evil spirits, move among the crowd, cry out, and are driven
    off by women when they come near the girl.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Wainkya takes its name from drums beaten day and night by relays of men;
    the drums use deer-hide over clay pots containing water to produce different sounds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wrestling is a feature of the Wainkya, and both Yanmana and Wainkya can last
    six or seven weeks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the Kyaiya, only men dance, games are played, and a man in the center of
    the circle points to the four cardinal points.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Kyaiya is associated by the narrator with spring food anticipation, summer
    algaroba bean thanksgiving, and autumn garden-crop gathering.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the marriage feast, the bridegroom pretends to steal the bride; they run
    away and hide, young men pursue but fail to capture him, and women pour water
    on the returned pursuers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The funeral feast occurs after a month of mourning and is said to cheer the
    bereaved; spoken encouragement indicates that the ghost, believed to have hovered
    nearby, will now leave the district.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The war feast includes trials of strength and skill intended to rouse courage.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Feasts may be held for guests, after a successful hunt, or on other occasions
    of rejoicing; women gather plant foods while men hunt and fish for the feast.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Except for the first two feasts, feasts are held at night from sunset to sunrise;
    fires and palm-leaf torches provide light when there is no moon.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: Participants are painted and ornamented, with feather head-dresses singled
    out as striking.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: The narrator reports that some feasts, including the marriage and funeral
    feasts, had become extinct or nearly extinct among the Lenguas, and that other
    feasts had been modified.
  category: other
  evidence_refs:
  - ev:12
