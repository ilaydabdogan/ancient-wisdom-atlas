canonical_text:
  quote: "“What cannot be cured must be endured.”"
  summary: The passage describes the Indians as enduring weather, illness, insects,
    and grief with patience and good humour. It gives an anecdote in which Indians
    respond to the narrator’s irritation at mosquitoes by joking about whether he
    can speak the mosquito language. The passage then compares this patience with
    Dobrizhoffer’s earlier remarks on Southern Indians and adds that Indians are emotional
    but conceal feeling as a matter of manners.
