canonical_text:
  quote: ''
  summary: 'The passage describes social rules attributed to Chaco Indians: minimal
    marriage restriction, communal support for the aged, sick, disabled, travelers,
    and temporarily unprovided persons, discouragement of competition and hierarchy,
    and limited production or saving because surplus would be claimed by others. It
    gives examples involving a capable agriculturist, a hunter, and an individual
    whom the narrator urges to cultivate land more productively.'
