canonical_text:
  quote: ''
  summary: The narrator describes public demonstrations by Lengua ritual specialists
    or witch-doctors who appear to produce living insects, fish-bones, or needles
    from bodies. He recounts testing and exposing some performances, reports explanations
    that hostile wizards and the kUyikhama/Tcilyikhama cause objects to enter victims,
    and describes a needle-related illness that ceased when the supply of small needles
    was cut off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed man publicly struck his head, compressed his stomach upward, put
    his hand to his mouth, and ejected several live creeping or wriggling things into
    his palm for the crowd to see.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gathered onlookers reacted with pleasure, satisfaction, and fear, and
    the narrator rewarded the performer with the promised present.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator made the performer eat food and then asked him to repeat the
    feat; the performer turned away and left. The narrator states that he believed
    more live insects were in the performer’s mouth and had become mixed with the
    food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator feigned arm pain and called old Red head, who spat on and sucked
    the narrator’s arm, then produced three small fish-bones as the asserted cause
    of the trouble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old Red head said the fish-bones had been caused to enter the arm by an unfriendly
    wizard from the west and asked for beads as his fee.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator examined old Red head’s mouth, pulled out more fish-bones, and
    showed the bones to the onlookers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another witch-doctor specialized in extracting small needles from afflicted
    Indians.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that wizards extract foreign bodies and, when afflicting
    victims with beetles, fish-bones, and similar things, do so through the aid of
    the kUyikhama/Tcilyikhama.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The needle-extracting witch-doctor repeatedly requested packets of very small
    needles, after which a needle illness became common; when the supply of needles
    was stopped, the illness and the specialist’s occupation ceased.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator says he opposed witchcraft through practical exposure when opportunities
    occurred, while acknowledging that his experiments were not always successful.
  category: other
  evidence_refs:
  - ev:7
