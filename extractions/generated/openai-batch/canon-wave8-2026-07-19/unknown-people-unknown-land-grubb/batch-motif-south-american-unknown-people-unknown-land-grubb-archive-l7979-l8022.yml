  summary: The passage transitions from a statement about self-support among the Indians
    to the opening of a chapter on general characteristics. The narrator rejects a
    broad English stereotype of New World Indians, emphasizes diversity among Indigenous
    peoples, identifies guardedness before strangers and suspicion of foreigners as
    general traits, and then limits the discussion to Chaco Indians known through
    twenty years of residence and study, describing them as conservative, lighthearted,
    amiable, humorous, capable of staunch friendship, and self-controlled.
