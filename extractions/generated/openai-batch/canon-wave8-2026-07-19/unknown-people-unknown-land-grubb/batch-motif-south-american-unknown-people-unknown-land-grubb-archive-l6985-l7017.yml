  quote: ''
  summary: The narrator describes an influenza epidemic near Thlagwakhe. A very weak
    woman is thought to be near death, and the village moves to a new site while some
    men remain behind. A messenger later reports her death. The narrator returns,
    finds her covered with reed matting and burial preparations underway, including
    water-pots for purification on the fire. He insists on examining her despite protests
    and discovers that she is still alive and pleading.
