canonical_text:
  quote: ''
  summary: A wounded narrator is helped eastward after an attack. He hears that Poit
    spread a fabricated account of an accidental shooting during a jaguar attack,
    that mourning messengers carried news of his supposed death, and that Poit fled
    when signs suggested foul play had been discovered. The narrator receives food
    and sympathy at villages, while fear of revenge and counterattack circulates among
    Indians, missionaries, and foreign authorities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After returning to his shelter, the narrator was given a stick backrest and
    helped to begin moving eastward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator met Wischi-apkyitkya-aptawa returning from delivering a message;
    he was painted in mourning because a report had reached the village that the narrator
    was dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wischi-apkyitkya-aptawa reported that Poit had gone toward the Mission station
    with a story that a jaguar attacked the narrator and that Poit accidentally shot
    the narrator while defending him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two Indians at a half-way village intended to leave with the news because
    Poit was worn out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A relay messenger approached with mourning marks and a warlike attitude; after
    seeing him, Poit ran into the forest and was not seen again for about a fortnight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man bearing the narrator's message explained the real state of affairs,
    and the people sent on a corrected message to Waikthlatingmangyalwa.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wischi-apkyitkya-aptawa drew six arrows from his belt, flourished them, declared
    that he would put them through Poit's body if he found him, and then cried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wischi-apkyitkya-aptawa offered to carry the narrator, found that impracticable,
    and turned back with the narrator and two helpers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Poit's village, people received the narrator kindly, killed a sheep, and
    made strong broth that revived him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old women and men at Poit's village showed grief and sympathy; the Chief's
    wife contrasted the narrator's former strength with his present bloody and near-death
    condition.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next day, Indians took the narrator to the shade of a small wood in an
    open plain, left him there while they went hunting, and he later woke after hearing
    movement nearby.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator suspected that Poit or the men who had left him might intend
    to kill him in order to remove evidence and prevent revenge by his companions
    or foreigners.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that Indians feared vengeance from foreigners or Paraguayan
    soldiery, while missionaries feared an Indian attack and instructed station Indians
    to intercept signs of a rising.
  category: relationship
  evidence_refs:
  - ev:10
