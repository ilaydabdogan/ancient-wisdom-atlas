canonical_text:
  quote: ''
  summary: The passage describes reports of witch-doctors producing pumpkins from
    spat seeds, the narrator’s explanation of the trick as assisted concealment and
    planting of pumpkins, the narrator’s own conjuring demonstration with paper and
    a dog, accusations that witch-doctors killed Adolpho Henricksen by sorcery, a
    later shift of blame to Caingua wizards, and reports that witch-doctors planned
    to kill the narrator by a wasting illness while fearing his enraged spirit if
    they used direct violence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lads tell the narrator that wizards can spit pumpkin seeds before a crowd
    and that ripe pumpkins can then immediately be picked up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator asks why people who suffer hunger do not require witch-doctors
    to provide food by this method, and why the witch-doctors themselves remain hungry
    if they possess such power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator explains the pumpkin performance as a simple trick involving
    assistants with pumpkins hidden under blankets and confederates dropping them
    while the crowd watches the wizard.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator gathers an audience and performs conjuring tricks, mostly imitating
    tricks attributed to the local wizards.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In one trick, a dog eats fat wrapped in paper, and the narrator appears to
    extract paper from the tip of the dog’s tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The onlookers respond with astonishment to the dog-and-paper trick.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator later explains the dog-and-paper trick by saying that he hid
    one cigarette paper in his mouth and wrapped the fat in another.
  category: sequence
  evidence_refs:
  - ev:4
