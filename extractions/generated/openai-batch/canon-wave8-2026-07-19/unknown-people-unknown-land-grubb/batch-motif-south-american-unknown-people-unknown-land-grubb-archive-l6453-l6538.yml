  text: Indians angry with the narrator tell him that witch-doctors killed Adolpho
    Henricksen by sorceries.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator demands compensation for the alleged injury to his tribesman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Witch-doctors later deny killing Henricksen themselves and attribute the act
    to Caingua wizards.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Informants say witch-doctors decided to get rid of the narrator but feared
