canonical_text:
  quote: ''
  summary: 'The narrator establishes a separate hut at Neantamama, describes its construction
    and contents, and recounts two incidents of attempted or disguised theft: a man
    named Alligator Stomach enters through the hut wall toward hanging dried meat,
    and an old chief and companions dig potatoes from the narrator’s garden after
    earlier gift exchanges. The narrator then describes efforts to form a larger permanent
    village, a planned move to Thlagnasinkinmith, a business trip to Concepcion, rumors
    that entrusted property was stolen, and the later report that the goods were safe
    but the Indians no longer wished to associate with him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator returned with a party of Indians and established himself at Neantamama,
    where he had them build him a separate hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hut had palm-log and stick walls, grass thatch, no door, a bush in the
    opening, a simple table and seat, a sheep-skin bed on the floor, and net-bags
    hanging from the rafters.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Indians killed a cow, the narrator took a quarter of it, made sun-dried
    meat, and hung the strips from the rafters at night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the night, the narrator heard rustling outside and concluded that a
    man, not a dog, was gently tearing grass from the foot of the hut wall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dark, shaggy head came through the wall, and the narrator grabbed the intruder’s
    hair and pinned his face to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The intruder was identified as Alligator Stomach and said he had come to drive
    dogs away from the narrator’s meat; the narrator accused him of being the dog
    and sent him away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Riacho Fernandez, the old Chief and some of his people repeatedly brought
    vegetables to the narrator and refused payment, after which the narrator gave
    them rice and biscuits in return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At dawn, the narrator found the old Chief and two others digging potatoes
    in his garden and inferred they intended to return them later as a present in
    exchange for another gift.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator urged neighbouring Indians to combine into one large permanent
    village and give up nomadic habits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator selected Thlagnasinkinmith, glossed as the place of the gurapata
    or ticks, as a site, and the Indians expressed willingness to accompany him there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the move, the narrator packed his belongings, entrusted them to selected
    influential Indians, and left for Concepcion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the return journey, foreigners told the narrator that the entrusted Indians
    had stolen his property and had decamped, and they voiced a hostile generalization
    about Indians.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the port of disembarkation, an Indian told the narrator that the goods
    were safe in the hut, but that the narrator’s Indians no longer wanted to associate
    with him or help bring his belongings to the river.
  category: speech
  evidence_refs:
  - ev:9
