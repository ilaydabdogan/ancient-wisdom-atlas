canonical_text:
  quote: ''
  summary: 'The passage describes Lengua witch-doctors as combining ritual or magical
    practice with practical medical knowledge, including plant medicines, wound care,
    snake-bite treatment, massage, and prognosis by the eyes. It then describes burial
    rites: a dying or dead person is removed from the village, covered, prepared rapidly
    near sunset, carried to the forest, and buried in a sitting posture before darkness.
    Death is said to be attributed to kilyikhama or hostile witchcraft, and the wizard’s
    diagnosis determines burial rites. If a dying person is judged unlikely to survive
    the night, the funeral may begin before actual death so it can be completed before
    dark.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wizards are described as possessing practical medical knowledge and using
    herbs, bark, mallow, and other plants for fever, wounds, toothache, and specific
    diseases.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Snake-bite treatment is described as involving suction, a ligature between
    the wound and the heart, and careful scratching with fangs for inoculation; other
    treatments include massage, saliva on wounds, clay or earth to stop bleeding,
    and prognosis by the eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a death, the village is described as desolate except for six or seven
    appointed people, while the body lies outside a hut covered by a reed mat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two men remove the matting, wrap the body in a native blanket, lay it face
    downward, lash a pole along the back at neck and heels, and carry it to the forest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A grave is dug with wooden diggers, and the body is placed in a sitting posture
    inside it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The burial ceremony is said to require haste because it must be completed
    before the red glow of sunset disappears and darkness sets in.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:7
  text: Death is described as being attributed to the direct influence of the kilyikhama
    or to an unfriendly distant wizard, while the local witch-doctor is believed to
    protect his own party from evil.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When death occurs, the wizard’s task is to decide where in the body the cause
    of death is located, and this decision determines special burial rites.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: While recovery still seems possible, the wizard and friends are described
    as nursing the sufferer carefully; after hope is gone, the patient is regarded
    as practically dead and receives little attention.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When death seems imminent, the dying person may be removed from the village,
    laid outside under a mat while still conscious, exposed to sun, rain, or cold
    wind, and left without comfort or water while preparations for departure occur
    nearby.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the village is abandoned, appointed attendants wait until about half
    an hour before sunset and begin the funeral if there is no hope the person will
    live through the night, whether or not death has actually occurred.
  category: sequence
  evidence_refs:
  - ev:8
