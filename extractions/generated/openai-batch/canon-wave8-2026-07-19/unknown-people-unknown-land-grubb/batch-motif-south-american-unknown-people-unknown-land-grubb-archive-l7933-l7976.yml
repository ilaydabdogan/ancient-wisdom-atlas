canonical_text:
  quote: ''
  summary: The passage describes a reforming policy emphasizing family support before
    community aid, the narrator's aim of encouraging independence rather than dependency,
    and a claimed recent social change among the people from communism to self-reliant
    work and property accumulation. It gives examples of contributions to school,
    hospital, poor relief, self-government, increased communal wealth, trading activity,
    church maintenance, and a principle of meeting one's own needs before giving voluntary
    charity from surplus.
  language: English
