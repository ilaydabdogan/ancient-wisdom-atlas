canonical_text:
  quote: ''
  summary: The narrator suspects a claim about nearby Kisapang enemies after scouts
    use ammunition, find no enemy signs, and bring back deer. He summons the men,
    finds the returned ammunition short, connects the missing shots with the deer
    killed, and demands the deer hides as compensation. The men become angry but accept
    that their stratagem has failed.
