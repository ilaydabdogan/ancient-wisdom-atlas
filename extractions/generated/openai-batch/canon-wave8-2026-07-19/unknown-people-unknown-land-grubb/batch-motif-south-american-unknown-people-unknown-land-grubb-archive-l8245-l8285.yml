canonical_text:
  quote: ''
  summary: The narrator describes observed emotional responses among Lengua/Chaco
    Indians, including grief at gravesides, tears at suffering, a palm-tree accident
    in which the cutter wept over an injured friend, and a contrasting case in which
    the same man bore burns from a powder-can explosion without moaning. The passage
    generalizes that the character observed is marked by paired contrasts such as
    kindness and cruelty, courage and timidity, emotion and stoicism. It also cautions
    against sensational religious appeals and discusses differing reactions to visible
    bleeding wounds versus less visible dangerous injuries.
  language: English
  quote_policy: summarized
