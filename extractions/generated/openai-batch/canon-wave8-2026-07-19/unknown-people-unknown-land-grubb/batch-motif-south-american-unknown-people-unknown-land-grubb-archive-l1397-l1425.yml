canonical_text:
  quote: ''
  summary: The narrator guards his belongings during the night after suspecting theft
    and observes two figures attempting to search his baggage. The next morning he
    asks the Chief for guides to travel west to the village of the war Chief Yahoyispuk.
    No one volunteers until the witch-doctor is attracted by a pair of trousers marked
    with the British Lion and “30 yards, Manchester.” The narrator agrees to give
    them only after the guide completes the journey, and they eventually reach Yahoyispuk’s
    village.
