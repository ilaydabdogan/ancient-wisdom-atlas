canonical_text:
  quote: ''
  summary: 'The passage describes several practices and prohibitions presented as
    Lengua superstitions or customary beliefs: animal grease is rubbed on children’s
    joints to strengthen their legs; body paint marks are made for reasons connected
    with physical conditions; mothers and children observe food prohibitions; milk
    from domestic animals is avoided because it is thought to influence children physically
    and in character; and the sensitive plant, if eaten, is believed to produce attachment
    to home and companions.'
