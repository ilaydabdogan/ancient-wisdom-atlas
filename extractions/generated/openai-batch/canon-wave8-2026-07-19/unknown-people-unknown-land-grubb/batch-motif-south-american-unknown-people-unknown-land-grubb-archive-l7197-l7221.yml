  quote: ''
  summary: A narrator recounts an attempted rescue and mission upbringing of a motherless
    child. The child’s sister asked that the child be brought back and placed in her
    care. The child later died, was baptized shortly before death with the name Hope,
    and was buried in the Chaco by the Paraguay. The narrator says the failure convinced
    the Indians that similar attempts to rear motherless children would be futile.
  language: English
