canonical_text:
  quote: ''
  summary: 'The passage describes organized Indian warfare in the Paraguayan Chaco:
    reconnaissance by spies, messenger relays, planned night advances, dawn attacks
    near the rising of the morning star, use of cover and ambush, treatment of captives,
    and a detailed account of an attack on a Kisapang village using terrain, canoes,
    hidden marksmen, and blocked escape routes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warfare is presented as carefully planned, with spies, messenger relays, divided
    bands, supporting forces, and ambuscades.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attacking forces advance at night and are said to attack about the rising
    of the morning star, roughly an hour before dawn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'After victory, duties are prearranged: some guard captives, some drive off
    flocks, some handle plunder, and others bury the dead and care for the wounded.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fighters use cover, avoid mass exposure, obtain food en route by forest
    resources, garden raiding, and hunting, and are described as highly mobile and
    self-sufficient.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bow-and-arrow sniper is described as able to shoot sentinels without noise
    and sometimes capture or stampede horses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In village attacks, the attackers first shoot arrows, then rush in with clubs,
    killing grown men and women who do not escape while sparing younger women and
    children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stated reasons for attacking before dawn are that enemies sleep heavily
    then and that wakeful people remain near village fires because of the morning
    chill.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Kisapang village is located near a forest, a sluggish swamp stream, dug-out
    canoes, an ant-hill plain, and small woods.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Kisapang attack, the attackers place a main body northwest of the village,
    a reserve behind it, marksmen behind ant-hills, and another body near the canoes,
    which they seize after swimming across the river.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the Kisapang attack, the main rush signals other forces; hidden marksmen
    block fugitives, a canoe force attacks from behind, villagers scatter, and escapees
    are shot down or intercepted.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
