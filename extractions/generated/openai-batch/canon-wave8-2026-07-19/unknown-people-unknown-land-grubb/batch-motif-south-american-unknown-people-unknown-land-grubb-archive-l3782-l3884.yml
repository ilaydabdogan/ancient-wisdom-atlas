canonical_text:
  quote: ''
  summary: The narrator recounts travel through a violent storm, flooded huts, ants,
    and scarcity. On returning to a station, he learns that local Indians had burned
    their booths and moved toward the forest after a man died, fearing his spirit.
    Later, while crossing the River Fernandez at night with an old witch-doctor and
    his son, the narrator’s dogs refuse the water; the witch-doctor explains that
    a devil was at the crossing and that the dogs had seen it.
  language: English
  quote_policy: summarized
