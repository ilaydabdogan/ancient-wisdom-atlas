canonical_text:
  quote: ''
  summary: The narrator argues against the killing of a child, is supported by a young
    chief and two young men, and is allowed to take the child away. In the village,
    people refuse to help nurse or feed the child and even forbid obtaining goat’s
    milk. The narrator gives rice-water with a spoon and is then told to leave because
    the ghost of the child’s mother is expected to come looking for the child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator vows to leave the country and refuse association with men he
    describes as capable of cruel murder; the others answer that he is a stranger
    with no right to interfere.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young chief and two young men support the narrator and say he may be able
    to rear the child and ward off the mother’s wi’ath because he has powers unknown
    to their people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a long argument, darkness has nearly fallen and the group allows the
    narrator to take the child; he leaves the funeral rites to them and carries the
    child away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the village, men and women abuse the narrator; the child’s sister, about
    eighteen years old, is also abusive when asked for help.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator places the child in his hut and seeks help catching a goat for
    milk, but the people refuse and forbid him to get milk himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The burial party arrives and the excitement and rage increase.
