canonical_text:
  quote: ''
  summary: The first-person narrator recounts attending a dying child whose father
    suspected he could have saved it, a later suspected attempt to poison his kettle
    with plant leaves, a dispute with Kyitkuk-paisiam over carrying provisions from
    the river, a chief's threat of corporal punishment and comments on declining chiefly
    authority, and Pinse-apawa's suspicion when the narrator drinks an alcohol-containing
    quinine mixture despite opposing foreign liquor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator attended a child with acute bronchial pneumonia; the child died,
    and the father believed the narrator could have saved the child if he wished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator describes a later incident as an attempt to poison him, after
    he found strange plant leaves floating in his boiling kettle, which served as
    a teapot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When questioned about the leaves in the kettle, the Indians present said they
    knew nothing about them and did not know what plant it was.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Thlagnasinkinmith the narrator needed provisions brought from the river;
    because he lacked wagons or pack animals, Indians carried loads on their backs,
    generally 50 to 60 pounds for about thirty-five miles in a day.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kyitkuk-paisiam was selected for the river journey but objected, asked what
    he would be given, and said the road was long, the burdens heavy, and his feet
    would become sore.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The narrator publicly answered Kyitkuk-paisiam by saying he had mistaken him
    for one of the men but now saw he was one of the girls and should go weave blankets.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief asked why the narrator did not beat Kyitkuk-paisiam and then told
    Kyitkuk-paisiam before the people that he would beat him with a stick if he spoke
    that way again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator reports that this chief was one of the few who still asserted
    a right to inflict corporal punishment, and he describes wider disorganization
    and decline of authority among the people.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the chief's threat, Kyitkuk-paisiam came to the narrator fully armed
    and defiant, then changed tone and said he would follow the men to the river and
    bring out the narrator's things.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator had opposed the people's use of foreign liquor and says he strictly
    avoided it himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pinse-apawa entered while the narrator was drinking a quinine mixture containing
    a small percentage of alcohol, smelled the bottle, and said it smelled like foreign
    liquor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The narrator motioned Pinse-apawa to be silent and told him that if he promised
    not to tell the rest, he would give him some of the mixture.
  category: speech
  evidence_refs:
  - ev:8
