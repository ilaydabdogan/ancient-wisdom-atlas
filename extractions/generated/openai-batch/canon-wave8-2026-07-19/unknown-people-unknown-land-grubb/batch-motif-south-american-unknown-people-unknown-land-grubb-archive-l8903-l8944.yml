canonical_text:
  quote: ''
  summary: 'The passage presents the narrator’s assessment of the Indigenous people
    as lacking centralized government, property concepts, social cohesion, and hope,
    with intertribal hostility. It then lists the missionary group’s intended program:
    learn the people’s language and customs, arrest perceived decline, create social
    and political cohesion, encourage property-holding and settled industry, foster
    moral and cultural progress, prepare them for Paraguayan citizenship, and base
    these changes on a practical form of Christianity modeled by the missionaries.'
