canonical_text:
  quote: ''
  summary: 'The passage describes Lengua marriage practices and related moral judgments
    as reported by the author: partner choice, uxorilocal residence, marriage on approval,
    childbirth as making marriage binding, monogamy as the norm, and polygamy or polyandry
    as demographic responses to war, raiding, and imbalance between men and women.
    It ends with one specific reported Lengua case of a woman with two husbands who
    was condemned and made to remain with the senior husband.'
  language: English
  quote_policy: summarized
