canonical_text:
  quote: ''
  summary: 'The passage describes fear after a dream associated with a ghost: people
    crowd together, an old man uses a gourd and chant to scare the ghost away, and
    the group treats the dream as evidence that the ghost was nearby. The narrator
    proposes possible mundane causes for the dream. A second incident describes a
    man refusing to travel to a village because others said two men there intended
    to kill him; the narrator later learns that this claim was based on a dream, despite
    seeing no sign of hostility at the village.'
  language: English
  quote_policy: summarized
