canonical_text:
  quote: ''
  summary: 'The passage describes dangers faced by outsiders entering the Chaco: an
    unnamed starving man is killed by Indians; two men escape Ibareta’s Pilcomayo
    expedition and are helped by an Indian guide; a later search for Ibareta proves
    fruitless; and the narrator is ordered to enter the interior to investigate tribes,
    choosing to go without armed protection as a missionary and messenger of peace.'
  language: English
  quote_policy: summarized
