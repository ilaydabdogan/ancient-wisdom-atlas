  quote: ''
  summary: The narrator explains Poit's thefts and attempted attack as arising from
    misused entrusted property, fear of accounting, a dream in which the narrator
    killed him, beliefs about dreams, weapon taboos, feared potency of medical stores,
    substitution of iron arrows for a gun, and a planned jaguar-attack cover story
    in an isolated forest setting.
