  quote: ''
  summary: The narrator describes entering a country where the Indians do not want
    him and regard him with suspicion. He says he relies on appearing defenceless
    while assuming authority rather than threatening violence. The local people are
    puzzled by this stance. His guides refuse to take him farther west, so he sends
    them back to the River Paraguay and prepares for the night among people unknown
    to him.
