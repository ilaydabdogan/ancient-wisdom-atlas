canonical_text:
  quote: ''
  summary: The first-person narrator describes a policy for entering villages and
    gaining acceptance by living with the people, sharing ordinary activities, and
    sometimes adopting their costume. He also describes commanding personal service,
    travelling with attendants, displaying leadership in difficult situations, and
    avoiding orders that might be disobeyed. In one anecdote, after overhearing attendants
    planning to hunt instead of depart at the morning star, he changes the plan and
    grants hunting permission to most of them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says he sought to gain a place in the people's hearts by living
    in their villages, mixing freely, joining ordinary life and amusements, and sometimes
    adopting their costume.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On arriving at a village, the narrator ordered people to prepare his resting-place,
    make a fire, bring water, and remove his knee-boots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When heat or flies were troublesome, the narrator made two people sit by him
    with fans; when crossing a swampy patch on foot, he made one person carry him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator usually travelled with seven or eight Indian attendants, sometimes
    giving small presents for their services, and assumed as much pomp as circumstances
    allowed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In difficult situations, including a pampas fire and moving refractory animals
    across a river, the narrator took a leading part to show that he could do such
    tasks when necessary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator studied dispositions and avoided giving orders when he thought
    people were likely to disobey, so that they would not realize they could disobey
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After saying he intended to resume the journey at the rising of the morning
    star, the narrator overheard others saying they would not go in the morning because
    they intended to hunt until midday.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next morning, when asked whether he would be ready to start as the star
    would soon be up, the narrator replied that he intended to remain until afternoon
    and later granted hunting permission to all but one.
  category: speech
  evidence_refs:
  - ev:5
