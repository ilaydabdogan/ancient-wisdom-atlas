canonical_text:
  quote: ''
  summary: The narrator struggles to feed a child, stealing eggs and obtaining goat
    milk, then persuades five men including the father to accompany him. The party
    travels by horseback through forest country at night while the companions fear
    a ghost. At dawn they reach a river; the narrator has carried the child in a sheepskin
    bag. Food and care are obtained, no evil influence is perceived, the natives and
    father show interest in the child, and the child is placed with a missionary's
    wife in Concepcion.
  language: English
