  quote: "“they term the creator beetle aksak”"
  summary: The narrator discusses the Indigenous term aksak, saying it can address
    figures of authority or power, including missionaries, evil spirits, and the creator
    beetle. He argues that a reported “grandfather the devil” may refer instead to
    an ancient powerful being associated with the Pleiades and interprets it as related
    to a tradition that humans were created by the beetle. He also reports hearing
    that some Indians believed there are countries among the stars like their own,
    with forests and lakes.
