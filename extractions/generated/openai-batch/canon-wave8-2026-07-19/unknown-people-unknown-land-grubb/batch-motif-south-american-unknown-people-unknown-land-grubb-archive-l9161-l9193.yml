  summary: 'The passage gives didactic advice on teaching across cultures: an outsider
    who would be a mentor must abandon superiority, understand the other people''s
    position and difficulties, and cultivate sympathy. It criticizes newcomers and
    brief travelers who make confident judgments from limited experience, and states
    that the so-called heathen world contains good, true, and valuable things.'
