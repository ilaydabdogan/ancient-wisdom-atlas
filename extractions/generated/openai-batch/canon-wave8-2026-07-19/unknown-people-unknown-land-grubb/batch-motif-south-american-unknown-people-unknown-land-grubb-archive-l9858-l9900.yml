  quote: ''
  summary: The narrator describes care for a sick woman who refused nourishment but
    recovered after forced feeding and nursing. He then generalizes about difficulty
    treating sick Indians because of resistance to nontraditional remedies, gives
    an example from an influenza epidemic, notes a later strong reliance on mission
    remedies, and ends by describing linguistic difficulty in conveying religious
    abstractions such as Deity and sin to a people said to take things literally.
  language: English
