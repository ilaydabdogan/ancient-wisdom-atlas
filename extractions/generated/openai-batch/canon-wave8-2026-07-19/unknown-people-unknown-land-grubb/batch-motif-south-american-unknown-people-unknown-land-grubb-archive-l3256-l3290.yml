  summary: The passage describes the Chaco as an inland region where fishing is nevertheless
    a chief subsistence activity. Dry prairie-like ground can become deep swamp after
    rains, filled with fish, eels, mud-fish, alligators, and water-fowl. Eels and
    mud-fish are said to survive drought below the surface, and Indians move camps
    near such swamps when the dry season breaks to obtain abundant food.
