  summary: The narrator introduces a chapter on religion by cautioning that Indigenous
    statements are difficult to interpret because the people are reticent, indirect,
    and sometimes accommodating to an interlocutor’s expectations. He says he will
    report what he has heard, acknowledge contradictions, compare statements with
    lived facts, and note that symbolic language about higher things may appear strange
    if not understood beneath the surface.
