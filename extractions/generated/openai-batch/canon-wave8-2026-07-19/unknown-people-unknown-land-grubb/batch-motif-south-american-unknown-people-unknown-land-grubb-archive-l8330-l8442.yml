  summary: 'The passage describes the narrator''s policy of treating Christian and
    non-Christian Indians alike, then discusses moral topics: regulated use of intoxicants,
    rare use of alcohol before an execution, contact with foreign rum, attributed
    causes and behaviors of madness, a reported grave-escape story, and attitudes
    toward lying.'
