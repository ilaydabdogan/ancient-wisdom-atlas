  quote: ''
  summary: The passage presents outside testimony in letters praising Mr. Grubb’s
    mission work in the Paraguayan Chaco. Arnold H. Schoch states that mission settlements
    and Indian villages may help open and civilize the Chaco, calls Thlagnasinkinmith
    national property, and notes Grubb’s title as “Pacificador del Chaco.” Pedro A.
    Freund reports returning from a survey expedition for a mission station and describes
    traveling securely among Chaco Indians without firearms or night watches.
