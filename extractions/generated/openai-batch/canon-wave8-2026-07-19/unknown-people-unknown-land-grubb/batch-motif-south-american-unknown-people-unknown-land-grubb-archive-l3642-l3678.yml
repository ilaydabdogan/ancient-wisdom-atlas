canonical_text:
  quote: ''
  summary: The passage describes hunting practices and an anecdote in which a hunter
    searching for honey climbs a hollow tree, is trapped there by a jaguar below and
    wasps above, is rescued by companions who kill the jaguar with arrows, and then
    returns with them to the village where they eat the fat and joke about the event.
    It concludes that hunting is both exciting and a necessary means of satisfying
    hunger.
