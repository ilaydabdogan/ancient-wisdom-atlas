canonical_text:
  quote: ''
  summary: A missionary narrator describes Kisapang visitors being brought to view
    him as the 'body' of Yiphenabanyetik after an attack. He reports that many Indigenous
    observers believed he had died, doubted whether he was his former living self,
    and later tested whether he was flesh and blood. He then recounts recovery, medical
    treatment, return to the Chaco, and the subsequent Christian conversion and baptism
    of two Lengua men.
  language: English
  quote_policy: summarized
