  summary: The passage describes social pressure among the people to share shelter,
    food, and goods. It reports that individuals may avoid building roomy huts, may
    hide food or honey, and may sell spare blankets to avoid claims by others. The
    narrator states that sharing is required by native law, contributes to poverty
    and neglect of the old, and is connected to nomadic conditions and lack of land-right
    claims.
