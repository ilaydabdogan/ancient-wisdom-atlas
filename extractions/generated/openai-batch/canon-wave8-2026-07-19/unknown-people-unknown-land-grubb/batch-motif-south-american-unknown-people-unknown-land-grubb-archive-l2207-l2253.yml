  summary: 'The passage gives a descriptive account of a Chaco village environment:
    a weed-filled stream with palms, water-fowl, fish, and alligators; surrounding
    forest, damp grassland, shallow ant-hill plain, heat, and insect sounds; and a
    nearby Indian village with simple dwellings and two shelter types made from branches,
    grass, palm leaves, or reed matting.'
