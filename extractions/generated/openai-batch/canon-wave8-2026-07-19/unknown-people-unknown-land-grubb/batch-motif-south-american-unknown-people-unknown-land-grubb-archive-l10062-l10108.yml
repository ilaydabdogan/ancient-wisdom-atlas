  quote: Poit, therefore, concluding that I should not return, considered himself
    the owner of the property I had left.
  summary: The narrator describes leaving the mission field for England with the intention
    of returning. Local Indians and Poit misunderstand his absence and the mission’s
    ownership structure. Poit concludes the narrator will not return, treats entrusted
    mission property as his own, and appropriates it. When the narrator returns in
    autumn, Poit is alarmed and tries to conceal and repair the shortage. A caption
    states that a photograph of W. Barbrooke Grubb was taken shortly after Poit’s
    attempt to murder him.
