canonical_text:
  quote: ''
  summary: 'The narrator presents anecdotes about Lengua/Chaco Indian moral conduct:
    a bereaved chief migrates after deaths in his family and dies after deliberately
    receiving snake bites; a travelling man saves food gifts for his family; people
    assist snakebite victims without gain; men give clothing, covering, fire warmth,
    and polite assistance to others; the passage closes with the narrator''s general
    moral assessment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After losing his wife, an Indian chief travelled east to the River Paraguay
    with his daughter and some followers, partly following a rule of abandoning a
    place where a death had occurred and partly from grief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the new encampment the chief's only child, a daughter about twenty-four
    years old, died, and he began travelling back west.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Sohoyamathla the chief sought out a venomous snake, allowed it to bite
    him several times, refused help, and died shortly afterward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man from a far-distant village received biscuits and sugar from the narrator,
    ate only a little, and put the rest in his waist-bag for his mother, wife, and
    little child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator states that the travelling man preserved the food gifts despite
    a long journey of about one hundred and fifty miles west.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an Indian was bitten by a snake, natives were known to hurry from distant
    villages, sit up for one or two nights, and try to relieve or save him without
    personal gain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Thlagnasinkinmith, while the narrator was wet and shivering near a fire,
    a chief removed his fairly dry shirt and insisted that the narrator wear it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On wet banks of a stream, an Indian companion stealthily placed his own blanket
    over the narrator and moved the fire closer, leaving himself uncovered near the
    fire in cold damp air.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Riacho Fernandez, an Indian in the bow of a dug-out canoe tried to make
    his dirty hands acceptable before helping Mrs. Stirling ashore, by spitting on
    them, wiping them, and spreading a handkerchief over one hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator concludes that, although Indian moral conditions differ from
    those of civilized Christian nations, he does not judge them vicious from their
    own standpoint.
  category: speech
  evidence_refs:
  - ev:9
