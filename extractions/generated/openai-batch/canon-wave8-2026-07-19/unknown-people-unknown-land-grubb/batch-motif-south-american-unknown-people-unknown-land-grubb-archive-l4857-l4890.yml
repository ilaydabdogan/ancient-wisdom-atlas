  quote: ''
  summary: The passage opens Chapter XII, “Shade-Land,” and says the subject will
    be treated through kilyikhama, aphangak or departed human souls, and departed
    souls of the lower creation. Kilyikhama are described as unrestricted by place,
    time, or distance and as feared for malign influence, especially at night. One
    white kilyikhama is associated with swamps, rivers, lakes, and sailing over water;
    it is heard whistling in a small craft among reeds. A rare-bird-feather head-dress
    is worn as a valued charm against this water-spirit. The range ends while introducing
    another kilyikhama with a boy-like appearance.
  language: English
