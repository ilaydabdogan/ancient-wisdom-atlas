canonical_text:
  quote: ''
  summary: 'The passage describes beetle and kilyikharna drawings on Lengua gourds
    used in ceremonies, then summarizes beliefs attributed to the Lengua: an original
    Creator made all things but no longer governs, moral consequences follow natural
    laws rather than divine reward or punishment, the soul is immortal, and afterlife
    is a disembodied continuation rather than resurrection or a future state of punishment.'
  language: English
