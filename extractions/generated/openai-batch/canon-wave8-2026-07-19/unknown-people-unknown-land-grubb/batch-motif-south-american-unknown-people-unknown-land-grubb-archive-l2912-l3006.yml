canonical_text:
  quote: ''
  summary: 'The passage describes Lengua ornaments and domestic implements: wooden
    ear-discs, witch-doctors’ decorated discs with reflective pieces used to perceive
    spirit shadows, lambskin armlets, feather anklets thought to guard against snake-bite,
    women’s pottery-making and rare spirit-attributed marks on pottery, carved pipes,
    and tobacco preparation and smoking practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wooden ear-discs are worn chiefly by men; ear lobes are pierced with a thorn
    or bone needle and kept open with grass or a thin stick.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ear-discs are enlarged with age and may leave the ear lobe hanging low when
    removed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Witch-doctors decorate ear-discs with polished tin shaped as stars or crosses,
    and sometimes with imported mirror pieces.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Witch-doctors say the mirror pieces enable them to see the shadow of a spirit
    entering or leaving a person on whom they operate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Armlets are made from lambskin strips with wool on, or sometimes from coils
    of yellow palm-leaf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Feather anklets are made from rhea wing feathers bound on a string and often
    dyed pale pink.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Feather anklets are considered a safeguard against snake-bite because a striking
    snake may hit the feathers instead of the ankle flesh.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The binding, cutting, and stringing of ostrich plumes is described as men’s
    work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women make pottery, including water-jars, cooking-pots, and shallow dishes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pottery is built without a wheel by adding rolls of clay to a base, smoothing
    them with a freshwater mussel shell dipped in water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Completed pottery is dried in the sun and fired on the ground with fuel piled
    around it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hot vessels are marked with irregular designs using birds’ quills, chips of
    holy-wood, and gums; rare pieces have raised clay designs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some broken old pottery pieces with thumb-like scorings are said to be the
    work of spirits.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Clay pipes are sometimes used, and the same word is reported for “earth” and
    “pipe.”
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wooden pipe bowls vary from simple bored pieces to carved bowls shaped as
    human, bird, and animal figures or heads.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: When tobacco is scarce, nicotine-saturated cactus pipe-stems are chopped up
    and smoked as a substitute.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Women strip green tobacco leaves, pound them in a hollow palm stump, form
    cakes moistened with saliva, sun-bake them, pierce them, and string them together.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Nearly all Lengua smoke, including women and children, usually taking only
    a few draws before passing the pipe to a neighbor.
  category: action
  evidence_refs:
  - ev:10
