canonical_text:
  quote: ''
  summary: The passage describes several hunting methods for birds, including striking
    young birds on water, approaching under cover of weeds, surrounding roosting trees,
    ambushing jabiru along flight paths, and using torchlight at night to confuse
    perched flocks. It also recounts an incident with a wounded stork and includes
    a caption describing Lengua people crossing the River Paraguay in a dug-out tree
    canoe made with wooden spades and fire.
  language: English
  quote_policy: summarized
