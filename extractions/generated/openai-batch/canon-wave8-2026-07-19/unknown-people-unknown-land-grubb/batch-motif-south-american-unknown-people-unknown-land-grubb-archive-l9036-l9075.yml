canonical_text:
  quote: "“so much work so much food”"
  summary: The narrator describes a work-for-food arrangement with men from a western
    village. A young chief refuses to work but tries to share the meal. The narrator
    denies him access to the food, removes him from the pot, and overturns the pot
    when the others hesitate to eat without him. The workers later resume work and
    eat, while the chief leaves angrily. The Indians later acknowledge the arrangement
    as just.
