  summary: The passage describes Lengua hunting practices involving slippery aquatic
    prey, large water-snakes, and alligators; a first-person encounter with an aggressive
    alligator; and captioned ethnographic descriptions of a bottle-trunk tree, a rattlesnake,
    a Lengua roadway sign, and the rattlesnake's rattle.
