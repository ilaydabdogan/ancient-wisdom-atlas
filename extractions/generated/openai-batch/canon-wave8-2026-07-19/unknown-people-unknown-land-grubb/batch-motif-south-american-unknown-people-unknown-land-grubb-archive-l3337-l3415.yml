literal_observations:
- id: obs:1
  text: When water dries up, the Indians search for holes, dig out prey, catch it
    by hand, and wear small bone bands on their palms to grip slippery creatures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large water-snake is sometimes captured, tied by the head to a waist-belt,
    and dragged behind the captor until leaving the swamp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alligators are hunted mainly in larger streams, either by surprise on the
    bank or from a canoe among weeds, then killed with a spear and lashed to the canoe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When alligators are plentiful, hunters enter the water in a line across the
    stream while others drive the animals down toward them; the method is described
    as successful and extremely dangerous.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator, while in a canoe cutting poles, is confronted by a large alligator
    that advances with open jaws instead of avoiding him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator thrusts a paddle blade into the alligator's mouth; the alligator
    crushes it, and the narrator takes up a pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bottle-trunk tree is described as having hard thorny bark and a soft pithy
    heart suitable for hollowing into a dug-out canoe; it also has a lily-like flower
    and seed-pods with silk-like substance.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A rattlesnake is described as photographed alive while striking; its bite
    is poisonous and dangerous to Indians' bare feet and legs in long grass.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Lengua roadway sign uses a leaning stick and ground grooves to show direction;
    feathers indicate a feast, and a smaller stick with white wool and maize indicates
    sheep and maize will be eaten.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The rattlesnake's tail has loose ring-shaped horny sections that rattle when
    wagged, and the snake is said to acquire a new ring each year it lives.
  category: attribute
  evidence_refs:
  - ev:8
