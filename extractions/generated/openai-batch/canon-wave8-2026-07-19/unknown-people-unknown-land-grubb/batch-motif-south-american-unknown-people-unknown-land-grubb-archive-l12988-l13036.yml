- id: obs:1
  text: The passage says “Lengua” is probably a Guarani nickname, while the people
    were known as “Mascoy” in the eighteenth century and may be termed “Lengua-Mascoy”
    or “Lengua-Machicuy.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Lengua, Angaite, Mascoy, Sanapana, and Guana are
