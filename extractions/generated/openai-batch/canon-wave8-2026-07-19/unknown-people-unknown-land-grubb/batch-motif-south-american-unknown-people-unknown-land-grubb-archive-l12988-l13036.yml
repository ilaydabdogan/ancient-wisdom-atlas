    of the Nu-Arwak group.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage notes that Boggiani includes Towothli and Suhin with the Lengua,
    while the author thinks these belong to the Guaicuru stock.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people described do not use “Lengua” for themselves, but use clan terms
    including Kyoinawatsam, Kyoinathla, Kyoinithma, and Paisiapto.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The glosses given for the clan terms are “people of the river,” “people of
