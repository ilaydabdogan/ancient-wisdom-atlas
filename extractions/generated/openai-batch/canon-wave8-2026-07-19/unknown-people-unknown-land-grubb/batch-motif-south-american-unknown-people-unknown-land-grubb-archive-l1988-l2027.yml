canonical_text:
  quote: ''
  summary: 'The passage links several Chaco beliefs or traditions with Peru-facing
    comparisons: a fragmentary Peruvian reference to a sister-wife of the sun, fear
    of a westward rainbow, the Inca rainbow ensign, and a possible Peruvian source
    for Pleiades observance. It then reports a tradition of a respected woman ruler
    from beyond north-western mountains, describes a distinct north-westerly lineage
    toward Peru, and records an afterlife belief in which departed souls travel west-north-west
    to built “cities of the dead.”'
  language: English
