  summary: The passage describes a dream in which the narrator is seen taking three
    pumpkins and is then asked to pay for them, because the dreamer's view treats
    the soul's dream action as the person's real intention. The author connects this
    doctrine of intention to Poit's attempted murder and punishment, and then introduces
    another case in which dreams influence men planning a pre-dawn hunting expedition.
