  summary: 'The passage reports dangers associated with entering the Chaco: rumors
    of foreign captives and a liberated prisoner, a surveyor’s armed precautions and
    surprise encounter near Chief Mechi’s village, and an Indian account of a worn
    foreign stranger at a village fire who was judged potentially dangerous because
    he might guide attackers into the country.'
