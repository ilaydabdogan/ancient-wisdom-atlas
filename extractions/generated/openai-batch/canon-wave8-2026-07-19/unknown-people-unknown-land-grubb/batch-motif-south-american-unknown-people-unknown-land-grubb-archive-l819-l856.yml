canonical_text:
  quote: ''
  summary: 'The narrator lists rumours about the Chaco and its peoples: a unicorn
    tale possibly arising from a scalp-lock custom, people with reversed knees and
    three toes, pygmies, giants, contradictory descriptions of the land as desert,
    forest, swamp, or inland sea, reports of mineral wealth, strange animals, and
    huge serpents. He says most rumours proved fictional or distorted, while neighbouring
    peoples feared the Chaco and its inhabitants; he frames the region and its peoples
    as still largely unknown to Europeans.'
  language: English
  quote_policy: summarized
