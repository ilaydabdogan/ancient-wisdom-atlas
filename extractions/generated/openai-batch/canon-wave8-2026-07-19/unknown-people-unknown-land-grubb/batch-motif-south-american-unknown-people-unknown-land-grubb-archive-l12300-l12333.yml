- id: obs:3
  text: Politically, the Chaco is described as under Argentina, Paraguay, and Bolivia,
    while the interior beyond boundary settlements is said to be in the hands of Indians.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The principal tribes listed are the Mataccos, Chiriguanas, Tobas, Lenguas,
