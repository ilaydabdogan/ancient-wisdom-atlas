canonical_text:
  quote: ''
  summary: 'The narrator describes gaining the confidence of Indigenous interlocutors
    before Christian influence had been introduced, then summarizes bare outlines
    of their creation mythology: a Creator of spiritual and material things is symbolized
    as a beetle; the material universe was made first; the Creator in beetle guise
    sent powerful beings from a hole in the earth, and these beings ruled the universe
    for a time.'
