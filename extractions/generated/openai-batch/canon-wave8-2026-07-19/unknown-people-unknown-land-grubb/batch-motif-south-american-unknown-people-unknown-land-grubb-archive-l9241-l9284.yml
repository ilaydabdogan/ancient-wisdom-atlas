canonical_text:
  quote: ''
  summary: A missionary narrator recounts advising a man that Christ would accept
    him, that God could give a changed will and strength to overcome evil, and that
    past guilt could be atoned for. The man leaves without giving a decision. Years
    later, while preaching to his countrymen, he says that this conversation was when
    he resolved to follow the advice because he perceived similarity between his own
    moral condition and the narrator's. The narrator identifies him as Philip, the
    first convert won for Christ through Christian sympathy, and then remarks that
    non-Christian peoples are not without moral codes or aspirations toward higher
    things.
  language: English
  quote_policy: summarized
