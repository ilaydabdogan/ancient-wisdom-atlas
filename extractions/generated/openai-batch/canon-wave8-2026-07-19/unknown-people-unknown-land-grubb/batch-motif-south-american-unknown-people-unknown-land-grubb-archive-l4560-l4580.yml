  summary: The passage describes a conflict in which Lengua pursuers capture some
    women, fail to follow enemies who flee into forest paths, kill many Kisapang opponents,
    seize flocks and belongings, and take few women and children. It then generalizes
    that tribal wars may continue for months, pause for gardening and necessary work,
    and resume through cycles of revenge, while also stating that casualties and cruelty
    are less extensive than commonly believed.
