  summary: The passage reports Lengua beliefs about deceased souls continuing a tribal
    life in the spirit-world and seeking friends and ancestors, while also discussing
    an inferred ancestral connection to distant cities in Peru and Bolivia. It records
    a tradition of a rock-cut passage in a distant hillside, in land occupied by an
    unknown tribe, containing hidden treasure. Captions describe Lengua types, a feather
    headdress used as a charm against the swamp Kilyikhama, and boys' initiation at
    the wainkya feast with red wool, feather ornament, shell necklace, and beads.
