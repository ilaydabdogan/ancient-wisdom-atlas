canonical_text:
  quote: ''
  summary: The narrator reaches the village of Kilmesakthlapomap with hesitant guides,
    enters ahead of them, and finds the villagers feasting. He then behaves assertively,
    using signs to order villagers to water his horse, place fire under a shady tree,
    move food, tend the horse, and bring swamp water. The villagers later say this
    conduct surprised and frightened them; they interpreted his boldness as possible
    occult power and decided to watch and test him that night.
  language: English
