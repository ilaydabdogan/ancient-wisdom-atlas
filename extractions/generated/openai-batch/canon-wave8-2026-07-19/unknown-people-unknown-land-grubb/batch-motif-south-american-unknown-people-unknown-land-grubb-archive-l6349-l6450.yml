canonical_text:
  quote: ''
  summary: 'The first-person narrator recounts several attempts to challenge local
    beliefs about witch-doctors and spirits: a forest root believed deadly, a claim
    that bullets can be charmed, a feared witch-beetle said to enter victims, and
    a night water-place avoided because spirits frequent it. The local responses often
    explain the narrator''s demonstrations by treating him as a witch-doctor or spirit-scarer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A forest root about the size of a large apple is said to be regarded by the
    natives as a virulent poison causing almost instant death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wizards are credited with the ability to eat the allegedly deadly root without
    harm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old “Red head” takes a large bite of the root, chews it, and swallows it while
    the Indians look on with awe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator eats a piece of the root and reports no evil effects except its
    disagreeable flavour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the narrator later points out that he ate the root safely, “Red head”
    says the people were not surprised because the narrator himself is a witch-doctor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: An unnamed witch-doctor states that he can charm Paraguayan guns so that their
    bullets cannot wound his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator proposes that the witch-doctor stand at a distance while the
    narrator fires three Winchester shots at him; the witch-doctor refuses the test.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A witch-beetle enters a hut where people are sitting around a fire, and the
    creature is believed to be sent by witch-doctors to enter people whom they wish
    to destroy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The witch-beetle is described as about an inch and a half long, black, and
    horned, and its arrival causes fear and silence among the company.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator captures the beetle, places it alive in his mouth, closes his
    lips on it, later removes it, and throws it away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people object that the narrator is a witch-doctor who knows how to charm
    the beetle, and that the beetle may have been seeking another victim.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Late-night visitors refuse to fetch water because spirits are known to frequent
    the place at night; they accompany the narrator because of his reputation as a
    spirit-scarer.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After returning without seeing a spirit, the visitors say local spirits are
    fierce and dangerous and should not be compared with supposedly tame spirits in
    the narrator's country.
  category: speech
  evidence_refs:
  - ev:10
