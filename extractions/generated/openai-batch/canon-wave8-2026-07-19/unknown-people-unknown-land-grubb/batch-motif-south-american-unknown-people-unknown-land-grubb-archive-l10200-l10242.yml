  summary: The first-person narrator recounts that his Indian carriers fail to appear
    during a journey toward Makthlatimes and Toothli country. Poit appears unusually
    preoccupied, offers explanations for the carriers' absence, and the narrator accepts
    these explanations while later stating that he did not yet suspect Poit of false
    conduct.
