  summary: The passage distinguishes kilyikhama from human spirits, notes the author's
    partial comparison of them with fallen angels, and describes a Lengua belief that
    departed human souls in shade-land continue their bodily form, character, status,
    kinship, clan life, and occupations in disembodied form. It also describes a belief
    that an executed murderer whose body is burned and ashes scattered cannot take
    human form in the after-world and remains socially isolated among spirits.
