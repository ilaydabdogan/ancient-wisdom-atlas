canonical_text:
  quote: ''
  summary: During travel, the narrator records marriage payment, naming customs after
    childbirth, camp arrangements, and an older man’s account of the origin of fire.
    In the tradition, a hunter discovers a bird using hot sticks to cook snails, steals
    the fire, and brings it to the village. The bird later becomes associated with
    thunder and lightning as revenge for the loss of its fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl is said to be soon married; her father has received fish-hooks and
    two iron hoes as payment, and the marriage is delayed until the algciroba bean
    harvest so beer will be available for the feast.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that parents change their own names after the birth of
    each child and are then known as the father or mother of that child.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the night camp, long palm-trunks are placed around the fire, skin-mats
    are spread near them, and families use the palm logs as a shared pillow.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: An older man makes fire-sticks by rubbing them together and recounts a tradition
    about the origin of fire; the account begins with people eating food raw because
    they could not make fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes fire by friction using a Hapin-tree stick as a drill,
    a prepared notch in another stick, tinder with dry fibre, blowing on ignited dust,
    and an arrow-shaft for leverage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:6
  text: In the tradition, an unsuccessful hunter gathers snails near a swamp and sees
    a bird carrying snails from the swamp to a place near a large tree where vapor
    rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the tree, the hunter finds sticks placed point to point, red and hot at
    their ends, with snails nearby; he burns his hand, then tastes the heated snail
    and finds it delicious.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hunter takes several hot sticks and runs to his village; the villagers
    gather dry wood to keep the fire alive, name it tathla, and cook meat and vegetables
    for the first time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bird returns, discovers the loss of its fire, becomes enraged, searches
    from the sky, sees the people using the stolen fire, and creates a thunderstorm
    with damaging lightning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The older man explains thunder as the anger of the thunder-bird seeking to
    punish people with fire from the sky; since losing its fire, the bird must eat
    raw food.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator comments that the people themselves make fire by friction, do
    not keep fire alight when unnecessary, and are not especially afraid of thunder
    or lightning.
  category: speech
  evidence_refs:
  - ev:9
