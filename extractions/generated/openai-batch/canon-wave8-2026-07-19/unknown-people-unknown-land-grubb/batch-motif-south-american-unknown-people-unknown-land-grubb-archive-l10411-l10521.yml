canonical_text:
  quote: ''
  summary: After being shot with an arrow by Poit, the first-person narrator removes
    the embedded arrow-head in the river, uses water to revive himself and conceal
    his tracks, reaches a path where he lies under an algaroba tree with the arrow
    beside him as evidence, is found by an Indian and brought to a village, receives
    care, accidentally drinks water used to rinse blood from his shirt, fears burial
    customs while near death, and remains barely alive the next morning.
  language: English
  quote_policy: summarized
