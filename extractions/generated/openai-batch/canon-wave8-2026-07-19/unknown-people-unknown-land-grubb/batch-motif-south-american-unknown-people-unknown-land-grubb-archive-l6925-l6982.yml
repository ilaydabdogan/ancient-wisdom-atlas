canonical_text:
  quote: ''
  summary: The passage describes mourning practices after death, purification of bereaved
    relatives, communal singing and circling around a fire, special treatment for
    deaths by snake-bite, infanticide, and executed murderers, avoidance of the dead
    person's name, burial timing concerns, and a case in which an old woman was subjected
    to a stone or mutilation rite and left away from the village before she was actually
    dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near relatives enter mourning after a death by painting the face black with
    charcoal streaks made to resemble tear courses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mourners crop their hair short and place a covering over the head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wailing for the dead occurs during the first night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Near relatives enter the new village closely muffled and live apart for a
    month, eating alone and not sharing in the common pot.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bereaved are regarded as unclean until the mourning period ends and they
    undergo purification with hot water.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: After purification, the funeral feast begins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: The bereaved stand outside their hut and wail while a fire is made and friends
    stand around singing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: All participants circle around the fire while singing.
  category: action
  evidence_refs:
  - ev:2
