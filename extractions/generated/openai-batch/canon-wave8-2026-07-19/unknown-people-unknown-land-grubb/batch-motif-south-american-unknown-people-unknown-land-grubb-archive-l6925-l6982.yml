  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: An executed murderer is not mourned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The ashes of the executed murderer's funeral pyre are scattered to the four
    winds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: The blood-stained execution instruments are shown to the murdered man's relatives
    as proof that vengeance has been carried out, then buried and never reused.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The name of a dead person is never mentioned; if reference is necessary, the
    dead person is called “he who was.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:17
  text: The stated object of the name avoidance is to forget lost relatives as soon
