  text: Boys dress up to represent dragon-flies and perform antics that cause merriment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: After the fire-circling and dragon-fly performance, purification is described
    as complete and the bereaved return to common village life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:11
  text: Deaths from snake-bite receive only the ordinary rites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: In cases of infanticide, the child is simply buried, with no rites and no
