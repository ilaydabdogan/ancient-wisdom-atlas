canonical_text:
  quote: ''
  summary: The narrator describes warnings not to set out on a difficult road, including
    a woman's warning that he may die on the way. Poit leads the travel party, separates
    the narrator from the Indians carrying provisions, returns alone with selected
    goods, gives an explanation about an injured man, and is later said to have given
    the carriers different instructions and hidden medicines and bandages.
  language: English
  quote_policy: summarized
