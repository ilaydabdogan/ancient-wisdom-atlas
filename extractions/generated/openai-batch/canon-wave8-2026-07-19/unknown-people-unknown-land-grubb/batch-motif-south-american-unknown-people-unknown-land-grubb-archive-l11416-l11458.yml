canonical_text:
  quote: ''
  summary: Hunt reports that after a party left the station, several recently baptized
    boys became ill and the missionaries suspected witch-doctors of making them sick.
    Andrew worsened with fever and weakness. A messenger arrived with two men from
    a noted witchcraft centre, including a chief wizard nicknamed “The Father of Cats”
    because of a prior performance involving three cats taken from a boy’s stomach.
    Visitors heard news of a chief’s death from snake-bite and of the party’s departure
    for the River Paraguay. With key Indian supporters absent and many witch-doctors
    present, Hunt describes the station as vulnerable to hostile action.
  language: English
  quote_policy: summarized
