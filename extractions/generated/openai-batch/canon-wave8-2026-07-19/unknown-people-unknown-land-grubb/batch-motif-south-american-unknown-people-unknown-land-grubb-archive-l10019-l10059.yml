canonical_text:
  quote: ''
  summary: The passage describes mission compacts with Indigenous communities, including
    limits on feasts, a ban on infanticide, work and transport obligations, and maintaining
    peace. It then recounts a rule against killing cattle without permission, two
    breaches of that rule followed by severe accidents to the men involved, and a
    later refusal by a native man to kill mission cattle without assurance of the
    narrator's authorization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The compact required feasts not to continue longer than three days, forbade
    infanticide, required work when called upon, required mail and goods transport,
    required keeping the cart-track clear, and required maintenance of peace between
    three tribes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mission made similar compacts when planning a new station and sub-stations,
    and the narrator states that the natives had kept their word up to that point.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: From 1893 to the narrator's present, no Indian had attempted to make or traffic
    in intoxicating liquor on the stations, and animals left in their charge had been
    tended.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When cattle were introduced, the mission stipulated that cattle should not
    be killed without permission, even when the animals belonged to the Indians, so
    that the herds could multiply.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cattle-killing rule was broken on two occasions, and both men implicated
    suffered severe injuries afterward.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The first man was severely scorched when his powder-flask ignited while he
    was cleaning his gun after killing the animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second Indian's gun burst, and he lost the greater portion of one hand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After these two cases, a native man refused a staff member's order to kill
    Mission cattle until he was assured that the narrator had actually instructed
    it.
  category: speech
  evidence_refs:
  - ev:6
