canonical_text:
  quote: ''
  summary: The narrator describes his open opposition to local wizards, warnings from
    Indian friends that the wizards might bewitch him, and a public challenge in which
    he offers to let them work enchantments on him from twenty paces away. The wizards
    decline. The chapter then turns to the narrator’s entry into mission work after
    the death of Adolpho Henricksen and the departure of two companions. He describes
    the harsh conditions at Riacho Fernandez, including insects, ants in food, maggots
    in meat, and his initial limited progress with the unwritten Indian language.
  language: English
