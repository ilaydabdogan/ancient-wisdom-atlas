canonical_text:
  quote: ''
  summary: The wounded narrator suspects danger, leaves the wood, and diverges from
    the track. Indian companions later track him, bring honey for him, and help transport
    him by horse. He is weak, cannot eat much, and receives food, medicine, fanning,
    wound care, and nursing. A mission party with Keamapsithyo and Manuel finds him;
    Keamapsithyo nurses him through the night. The next day he is carried onward toward
    Mechi’s village. An inserted caption describes a photograph of Keamapsithyo/Philip
    being treated by Indians as his stolen soul, and feather anklets as protection
    against snake-bite.
  language: English
  quote_policy: summarized
