  quote: ''
  summary: The preface describes Grubb as an authority on Chaco Indians, explains
    that the editor compiled the volume from his dictation, and previews a narrative
    of his early years among the Lenguas, including an attack, rescue, wound, and
    recovery. It also states that the book treats Lengua life, customs, mythology,
    superstitions, and witchcraft, compares present observations with Dobrizhoffer’s
    older account of the Abiponi, and notes the Mission’s role in opening up a largely
    unknown country.
