canonical_text:
  quote: ''
  summary: A sick boy remains under the narrator's care while some villagers accuse
    the mission party of causing deaths through their treatment. During a Sunday service,
    the narrator answers these accusations to the Lengua congregation. Soon afterward,
    a deputation of ten men arrives intending to take the boy by force to the village
    for their own treatment. The narrator and companions refuse, hear accusations
    about the death of an old chief and the present boy's illness, and are warned
    that the boy's father may come with a larger angry party.
  language: English
  quote_policy: summarized
