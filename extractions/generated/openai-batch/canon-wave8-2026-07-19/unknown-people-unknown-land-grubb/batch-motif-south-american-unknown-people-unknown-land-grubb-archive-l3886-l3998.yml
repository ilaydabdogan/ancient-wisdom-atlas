canonical_text:
  quote: "“the devil had caught me by the leg”"
  summary: The narrator disputes a witch-doctor's supernatural version of an earlier
    river-crossing incident, then describes joining a traveling party during planting
    season. The passage details preparations, burden-carrying, hunting, dry-season
    travel, extraction of water from the thorny caraguata plant, cooking at campfires,
    an unpleasant water-hole near a dry streambed, and a captioned scene of honey
    extraction from a tree using smoke.
  language: English
  quote_policy: quoted
