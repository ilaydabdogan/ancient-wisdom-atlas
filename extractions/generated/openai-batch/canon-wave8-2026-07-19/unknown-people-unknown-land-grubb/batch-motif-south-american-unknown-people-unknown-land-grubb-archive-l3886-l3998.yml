  text: The old wizard gave the Indians a false account in which the narrator was
    caught by the leg by the devil while crossing a river, lost his way in the forest,
    and called to the wizard for protection.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that he explained matters to the Indians but believed
    that they accepted the witch-doctor's story for many years.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because planting season had arrived, people from distant villages began returning
    to their own districts, and the narrator decided to move further inland with a
    small party.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women packed household goods and filled water-bottles while men searched for
    horses before departure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women and children were mounted on horses, and belongings were fixed to the
