canonical_text:
  quote: ''
  summary: 'The passage describes beliefs about kilyikhama and aphangak: kilyikhama
    seek possession of bodies in insect or small-animal form, while aphangak generally
    do not enter the living but may be thought to seek rebirth as a newborn by displacing
    the child''s proper spirit. Aphangak are said to retain their former bodily appearance;
    an informant reports hearing one coughing near a wood in the dark and describes
    it as tall and old, leading the narrator to identify it with a recently deceased
    man.'
