canonical_text:
  quote: ''
  summary: 'The narrator describes an episode involving a disliked beverage, then
    reports how Lengua people and others interpreted his presence: as a foreign exploiter,
    an outcast criminal, or a powerful witch-doctor. A caption describes Pinse-tawa,
    a Lengua witch-doctor. The narrator says many powers were attributed to him, including
    control over people, animals, weather, sickness, game, secret knowledge, the future,
    the Evil Eye, and speech with the dead. Lengua witch-doctors viewed him as an
    opponent and plotted against him by magic, while fearing that killing him violently
    would make his disembodied spirit more dangerous. Pinse-apawa warned him, but
    he proceeded with his cart-road plan.'
  language: English
  quote_policy: summarized
