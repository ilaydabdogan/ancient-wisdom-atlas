canonical_text:
  quote: some supernatural fear impelled him to instant flight
  summary: 'The narrator explains Poit’s apparent plan after shooting him: Poit would
    avoid nearby villages, go to the Mission station with news of the narrator’s death,
    delay any search, and rely on scavengers, animal tracks, and the arrow near the
    body to support his story. The narrator notes that Poit’s plan failed because
    he shot and fled without confirming death; a report says Poit was frightened,
    horrified, and driven away by supernatural fear, possibly as related before his
    execution.'
