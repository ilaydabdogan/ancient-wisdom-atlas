canonical_text:
  quote: ''
  summary: 'The passage presents first-person ethnographic anecdotes about wizards
    or witch-doctors: a wizard reacting fearfully to a strong medicine bottle; dreamers
    seeking help when soul-wanderings are interrupted by unfriendly spirits; a wizard
    believed to see spirit-shadows in metal ear-discs; schoolboys frightening the
    wizard Blue Blanket with masks; a young witch-doctor fleeing an alarm-clock; healing
    and intimidation practices involving sucking, alleged internal bleeding, and simulated
    blood; treatment of skin eruptions with sharp instruments; and a reported celebrated
    wizard who can produce small creeping creatures by striking his head.'
  language: English
  quote_policy: summarized
