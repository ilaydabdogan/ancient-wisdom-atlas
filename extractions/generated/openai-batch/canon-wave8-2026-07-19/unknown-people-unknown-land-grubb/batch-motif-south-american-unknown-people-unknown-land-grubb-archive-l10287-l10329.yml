canonical_text:
  quote: ''
  summary: The narrator describes a dispute over missing cattle, later saying the
    cattle had been eaten despite a false report. He then travels to a frontier Lengua
    village, falls ill with malaria, and delays his departure after Poit and others
    urge him to wait for dew-wet grass to dry. Poit advises sending the narrator's
    men ahead with his kit, claims to know a forest shortcut, makes breakfast for
    him, and then proposes borrowing better weapons.
