canonical_text:
  quote: ''
  summary: 'The passage describes Lengua material practices: lighting pipes by brand,
    friction fire-sticks, or flint and steel; using gourds as vessels, containers,
    rattles, and engraved surfaces; making and playing musical instruments; fashioning
    spoons, knives, and combs; making wax animal charms for hunting; brewing intoxicants;
    and keeping travel diaries by notched sticks.'
  language: English
  quote_policy: summarized
