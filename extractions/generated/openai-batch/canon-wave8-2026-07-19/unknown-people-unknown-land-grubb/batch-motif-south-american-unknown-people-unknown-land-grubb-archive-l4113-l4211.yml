canonical_text:
  quote: ''
  summary: The narrator leaves his party with an Indian guide to reach a hunting camp,
    suffers severe thirst during night travel, first finds putrid water and later
    muddy drinkable water, reaches the camp, and shows a pocket compass. Camp members,
    especially an old man, discuss the compass and interpret its north-pointing hand
    as a captive little blue devil pointing the narrator homeward. The narrator later
    hears of relatives suffocating a suffering old man to hasten his death, then eventually
    travels west to a large feast gathering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator leaves the main party with one Indian guide and travels northward
    toward a reported hunting camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The travelers pass through open country and palm forest in intense heat, fail
    to find drinkable caraguata, and become severely thirsty; the horses become exhausted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a dry swamp-stream bed, the guide finds a small water hole; the guide and
    narrator drink a little and vomit, while the horses refuse it; the water is found
    to be putrid with dead fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about two in the morning the travelers enter a swamp, encounter mud, reach
    tolerably drinkable muddy water, drink deeply, and then sleep without lighting
    a fire after a day without food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After sunrise they find the hunters’ tracks, reach the camp, and are given
    food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator uses a pocket compass while asking about surrounding villages;
    a crowd gathers, and an old man tests the instrument, including under his blanket,
    because its hand keeps pointing north.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old man concludes that the narrator had caught a little blue devil in
    his own land, secured it in the case, and that it points out the road homeward
    with its finger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrator and guide return by a new route to rejoin the companions and
    find that the party has already arrived at the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: News arrives that relatives of a long-suffering old man agreed to hasten his
    death; the son-in-law wrapped a blanket around the old man’s head while the brother
    sat on his chest, causing suffocation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator says he was shocked, but interprets the act as prompted by kindness
    and a desire to end suffering rather than as cruelty by the actors.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Later, after some weeks in the village and visits to nearby encampments, the
    narrator travels west with an Indian guide to a large feast where more than one
    hundred and seventy people are gathered.
  category: sequence
  evidence_refs:
  - ev:10
