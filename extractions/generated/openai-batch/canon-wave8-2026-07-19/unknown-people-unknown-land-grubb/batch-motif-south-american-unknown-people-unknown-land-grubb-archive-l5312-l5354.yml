  quote: ''
  summary: 'The narrator recounts two dream-related incidents: a worker left after
    dreaming his child was ill, and another Indian came from a distant village to
    seek compensation for pumpkins he accused the narrator of stealing, while also
    admitting the narrator had not physically taken them. The narrator frames the
    second incident as illustrating a native belief that souls meet in dreamland and
    a connected theory of intention.'
