canonical_text:
  quote: ''
  summary: 'The first-person narrator explains his policy for entering and working
    among the Lengua people: he intends to project authority, avoid appearing afraid
    or dependent, respect local customs only when they do not obstruct his plans,
    and oppose witch-doctors whom he regards as hostile obstacles to founding a mission.
    He hopes to weaken their influence by treating their threats and claimed powers
    with contempt and by presenting himself as possessing superior knowledge.'
