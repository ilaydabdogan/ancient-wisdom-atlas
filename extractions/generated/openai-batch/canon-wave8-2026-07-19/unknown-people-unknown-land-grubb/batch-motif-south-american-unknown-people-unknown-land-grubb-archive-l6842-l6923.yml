canonical_text:
  quote: ''
  summary: The narrator describes a dangerous accusation that he had dealings with
    a ghost after a burial. An old woman's dream of the ghost intensified communal
    fear. The passage explains that funeral rites are intended to exorcise apparitions
    and prevent revenge by the dead; improper performance or boasting about it could
    lead to execution. It then describes post-burial purification using hot water,
    fire, palo santo, burial of ashes, destruction of property and booths, and fearful
    departure from the village at night.
  language: English
  quote_policy: summarized
