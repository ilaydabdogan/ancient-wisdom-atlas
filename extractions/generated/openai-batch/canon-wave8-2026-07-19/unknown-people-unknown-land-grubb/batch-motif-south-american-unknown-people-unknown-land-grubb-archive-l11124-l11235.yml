canonical_text:
  quote: ''
  summary: 'The passage recounts Poit''s execution after a trial: a pyre is prepared,
    he is given an intoxicating drink, two executioners strike and stab him, and his
    body is burned and the ashes scattered. The narrator states that the procedure
    resembles customary rites for executing a murderer. The passage then describes
    the mission party''s efforts to save Poit''s family, their refusal to seek vengeance
    or compensation, the effect of this conduct on Lengua observers, and the narrator''s
    explanation of Poit''s motives through ancestral belief and a misunderstanding
    about property and the narrator''s absence.'
  language: English
  quote_policy: summarized
