  quote: ''
  summary: The appendix excerpt recounts chronological attempts by missionaries, explorers,
    and steamer parties to travel the Pilcomayo and Chaco region, including retreats
    after attacks, Crevaux's ambush with one boy survivor, an 1883 expedition reaching
    the River Paraguay after privation and battle, later steamer expeditions halted
    by insufficient water, and a Jesuit attempt to reduce Chaco tribes.
  language: English
