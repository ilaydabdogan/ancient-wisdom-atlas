  quote: ''
  summary: 'The passage reports a case labeled infanticide: a child is said to have
    died naturally and been buried, but the narrator''s party accuses the group of
    killing it. They impose a social boycott on the grandfather, question a girl who
    says she did not want the murder, and confront the grandfather, who blames the
    witch-doctor Blueblanket. The narrator states that the grandfather had paid Blueblanket.
    Later, the narrator uses references to a bottle-trunk tree and a club as reminders
    of the deed.'
