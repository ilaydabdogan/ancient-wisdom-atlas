canonical_text:
  quote: ''
  summary: After Grubb returns alive from Poit's attack, Lengua people react with
    fear and awe because reports had said he died and was somehow resuscitated. Some
    doubt whether the being or soul inside his recognized body is really his or another,
    possibly nonhuman. Leaders and companions consider killing Poit. At the mission
    station people mourn, refrain from exorcism, bring honey, and later individual
    encounters show continued fear and uncertainty about Grubb's identity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the narrator's arrival, people who had earlier been under mission influence
    were less effusive, did not crowd around him, and appeared shy and frightened
    after reports that he had died and been resuscitated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator reports that some people associated him with a class credited
    with abnormal powers and with the Imlah tradition, and that many doubted whether
    the being or soul inhabiting his body was his own or another's.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chief Mechi and some men withdrew under a tree and later told the narrator
    they had decided to destroy Poit; the narrator says he did not understand their
    reference to the custom of throwing the stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Philip and his brother Manuel obtained horses at night, set out with little
    hope of finding the narrator alive, and were angry and intent on killing Poit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the mission station, people reportedly cried, became quiet and awestruck,
    asked about the narrator's health, refrained from exorcism with chant and rattle,
    and searched for honey for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mission staff feared a possible rising because the people were excitable and
    strange, but later judged that the Indians were with the missionaries.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the narrator beckoned Pinsetawa-apkyitkya to move his chair into the
    shade, she approached cautiously, kept her distance, moved the chair quickly,
    and ran back to the village in fear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An unnamed man who knew the narrator asked his name and then asked who he
    was now; the narrator concludes that people accepted the identity of his body
    but wondered who was inside it.
  category: speech
  evidence_refs:
  - ev:8
