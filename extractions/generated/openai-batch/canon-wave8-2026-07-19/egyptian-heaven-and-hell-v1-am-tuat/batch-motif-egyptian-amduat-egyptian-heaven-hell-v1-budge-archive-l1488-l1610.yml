canonical_text:
  quote: ''
  summary: The passage describes the great god entering the Tuat, being carried by
    boat into Urnes, receiving acclamation from underworld gods, subduing serpentine
    enemies, dispelling darkness, addressing underworld beings so they may receive
    sustenance and movement, and being brought to rest in the Field of the Nepektiu
    gods. It closes with a ritual statement that written scenes and knowledge of the
    words function as magical protection for a person on earth.
  language: English
  quote_policy: summarized
