canonical_text:
  quote: ''
  summary: The passage introduces the Tenth Division of the Tuat, Metet-qa-utchebu,
    traversed by the sun during the tenth hour of night. It describes the entry door,
    city, guiding hour, the solar boat with the god beneath the serpent Mehen, a two-headed
    serpent with crowned heads facing two crowned goddesses, a hawk within the serpent’s
    curve, another serpent lying in a boat, and groups of weapon-bearing figures.
    The accompanying texts state that the great god journeys through the city by boat
    over water, that water-dwellers use weapons and come to life at the sailors’ sound,
    and that the serpent Thes-heau travels after the god into the horizon and enters
    the earth with him each day.
  language: English
  quote_policy: summarized
