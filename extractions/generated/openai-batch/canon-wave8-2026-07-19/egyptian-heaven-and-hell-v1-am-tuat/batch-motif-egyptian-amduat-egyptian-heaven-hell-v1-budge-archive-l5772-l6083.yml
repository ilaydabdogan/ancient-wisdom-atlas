canonical_text:
  quote: ''
  summary: The passage describes the Ninth Division of the Tuat, named Best-aru-ankhet-kheperu,
    through which the sun passes in the ninth hour of night. The great god travels
    by boat, addresses beings in the division, is joined and transported by divine
    sailors, and encounters groups of named gods. The text emphasizes knowledge of
    the names and places of the beings and locations in the hidden Circle of Amentet,
    the solar boat under the serpent Mehen, water-giving sailors, hymns, offerings
    of bread and beer, and movement toward the eastern horizon of heaven.
  language: English
  quote_policy: summarized
