canonical_text:
  quote: ''
  summary: The passage describes the First Division of the Tuat, called Net-Ra, traversed
    by the Sun-god in the First Hour of the night. It presents an upper scene with
    the dead Sun-god Af in the Sektet Boat, attendant deities, a procession, a river,
    and an explanatory inscription naming fields, measurements, a guardian, and destiny-performing
    words. It also describes a lower boat centered on a beetle with adoring gods,
    associated with the coming into being of Osiris, and preceded by serpents and
    additional gods.
  language: English
  quote_policy: summarized
