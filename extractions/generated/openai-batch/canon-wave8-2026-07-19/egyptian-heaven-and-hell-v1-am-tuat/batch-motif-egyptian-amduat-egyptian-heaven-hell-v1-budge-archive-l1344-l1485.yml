  summary: The passage describes gods associated with a picture and a lower register.
    They praise and lament the great god, transmit earthly words and souls toward
    him, guard day and bring night, produce offerings, receive commands through his
    voice, provide herbs and water, burn enemies of Ra with fire, and protect the
    one who knows the relevant divine information.
