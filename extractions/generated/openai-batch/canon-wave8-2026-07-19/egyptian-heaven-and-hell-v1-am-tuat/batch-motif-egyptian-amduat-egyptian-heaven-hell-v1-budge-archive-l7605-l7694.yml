canonical_text:
  quote: ''
  summary: The fragment describes an unnamed female figure above stars associated
    with two serpents, her daily action of casting living ones to Eu, and her swallowing
    of forms in the City of the Eleventh Hour as one who follows the god. It then
    lists and describes several gods, including the two-headed Tepui, the ram-headed
    Khnem-renit, the adoring Nerta, Aaui-f-em-kha-nef with two snakes' heads, and
    additional named gods in similar or listed forms.
  language: English
  quote_policy: summarized
