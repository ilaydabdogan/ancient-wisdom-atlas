canonical_text:
  quote: ''
  summary: The passage describes the Sixth Division of the Tuat, traversed by the
    dead Sun-god during the Sixth Hour of night. Afu-Ea/Af appears in his boat with
    gods, Thoth and Ament-semu-set stand before the boat, and the text describes the
    god travelling by water toward the body of Osiris and addressing hidden forms.
    The abode of Osiris contains sixteen mummied gods and an enormous five-headed
    serpent whose oval body encloses Afu holding a beetle symbol of Khepera.
  language: English
  quote_policy: summarized
