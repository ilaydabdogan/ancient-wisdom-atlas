  quote: ''
  summary: A group in forms made by Horus is addressed by a great god by name; they
    unite, come into life in shades in the god's mouth, and their souls travel in
    his train toward the horizon. They strip the bodies of the dead, break the bodies
    of enemies, and order destruction in the Tuat. The lower register shows Horus
    and several lakes of water containing male figures described as submerged, swimming,
    or floating.
