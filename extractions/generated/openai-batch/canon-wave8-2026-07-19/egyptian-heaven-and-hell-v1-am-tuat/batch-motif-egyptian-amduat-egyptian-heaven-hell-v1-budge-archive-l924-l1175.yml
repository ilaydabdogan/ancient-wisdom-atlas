  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second leading boat contains two goddesses, a large sistrum identified
    with Hathor, and a beetle described as the great god Neper.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The third leading boat has the crown of the South on its prow, the crown of
    the North on its stern, two sceptres linked with Anpu and Ap-uat, and a huge lizard
    from whose back spring the head of Osiris and a White Crown.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fourth leading boat has uraeus heads at prow and stern, a kneeling armless
