  text: The Second Division of the Tuat is named Uenes and is passed through by the
    Sun-god during the second hour of the night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ram-headed god Af travels in a boat along a stream that runs lengthwise
    through the division.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two serpents named Isis and Nephthys occupy the front of Af's boat in front
    of Ap-uat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boat of Af moves over the waters without visible paddling equipment, by
    a power attributed either to itself or to gods standing in it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A procession of four boats leads the way before Af's boat.
  category: sequence
