canonical_text:
  quote: ''
  summary: The passage describes the Second Division of the Tuat, called Uenes, traversed
    by the ram-headed Sun-god Af in a boat during the second hour of night. Four boats
    precede him, bearing lunar, Hathoric, lizard/Osirian, and grain/Neper imagery.
    The upper register contains a sequence of named deities, mostly mummiform and
    seated, followed by a standing god who overcomes enemies.
  language: English
  quote_policy: summarized
literal_observations:
