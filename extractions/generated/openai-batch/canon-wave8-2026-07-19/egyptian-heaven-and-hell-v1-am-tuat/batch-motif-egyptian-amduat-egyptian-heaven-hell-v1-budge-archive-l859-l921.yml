canonical_text:
  quote: ''
  summary: In an underworld Court, the great god Ra/Ea addresses divine beings and
    Apes, asking that doors and portals be opened and that beings take their places
    in Urnes. The gods of the Court respond that the doors of secret Ament and Nut
    are open, praise him, and describe Apes, serpents, the goddess of the hour, and
    two Soul-Goddesses assisting him. The god illumines darkness, takes possession
    of night, brings in day, rests his boat, acts against enemies and the condemned,
    battles at the Court’s fortifications, and passes on while the gods wail; the
    hour-goddess guiding him is named.
  language: English
  quote_policy: summarized
