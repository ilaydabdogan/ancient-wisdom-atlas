canonical_text:
  quote: ''
  summary: The passage describes named Circles of the Am-Tuat entered through named
    doors. In the Circles are beings, mummied gods, and uraei associated with weaving
    instruments and sand. The god cries out to souls or beings in the Circles; their
    voices are compared to battlefield cries, the cry of the Divine Hawk of Horus,
    and the twittering of water-fowl. A later door leads beyond to a figure of the
    god Nu above a chamber of destruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One described Circle is named Hap-semu-s, and those within it have instruments
    for weaving before them and are set firmly on their sand.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hap-semu-s description, a god cries out to the souls in their regions
    in the two Ateeti or Aterti.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The voices of those shut in Hap-semu-s are heard and are compared to voices
    going down to the battlefield of Nu when their souls cry out to Ea.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Circle Sehert-baiu-s is entered through a door named Tes-sept-nesut.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Within Sehert-baiu-s are four mummied gods, each with an instrument for weaving
    before him.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
