canonical_text:
  quote: ''
  summary: 'The passage describes registers of a Tuat scene: knife-bearing goddesses
    hack Apep; four coffers of Osiris are linked with hidden magical figures and hidden
    heads; the great god/Ra traverses a hidden waterless road in a holy boat through
    words of power; named deities appear in the registers; Afu-Asar/Osiris is associated
    with the serpent Mehen; and enemies of Osiris are bound, burned, cut apart, and
    guarded by divine figures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goddesses are described as holding knives and hacking Apep in the Tuat each
    day while repulsing the affairs of the enemies of Ra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four coffers of Osiris are called hidden magical figures of the Tuat and funeral
    shrines of hidden heads; the hidden heads appear and eat their own forms after
    the great god has passed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hidden road of Ament is described as a road with no water and no one to
    tow; the great god travels over it in his holy boat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The great god makes his way by words of power associated with Isis, Semsu,
    and his own utterances, which act as magical protectors and perform slaughters
    of Apep in the Tuat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The text states that making copies of the pictures according to the written
    similitudes makes them magical protectors in heaven and earth, and that knowing
    them makes one as the Spirits with Ra.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Neb-Uast is standing and holding a sceptre; Seth-ab(?) is named after him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The upper register includes Shepes in mummied form with a curved object, Ati
    with a lioness head holding life and a sceptre, and the female-headed uraeus Ankiuithit.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Afu-Asar is seated on a throne under a canopy formed by the body of a monster
    serpent; related speech asks for passage, opening of a fold, illumination of darkness,
    and embrace of the one in Mehen.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A speech to Osiris, who dwells in the serpent Mehen, calls him Governor of
    the Tuat, lord of life, and ruler of Amentet.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says that the enemies of Osiris are beneath his feet and that
    flames and a blazing or slaughtering knife burn, hack, and chop them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Three headless kneeling figures with arms tied behind their backs represent
    enemies of Osiris; behind them stands a fierce cat- or lynx-headed god with a
    pointed stake and a large knife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Three foes of Osiris lie on their backs with ropes around their right arms,
    and Anku holds the other ends of the ropes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A speech says hostile spirits against Osiris are fettered, tightly bound,
    kept under ward in soul, hacked in pieces in shade, and unable to escape Anku’s
    restraint.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Three bearded human-faced hawks wear the double crown of South and North;
    the first is called Sa-Tathexex and the third Mam(?) or Maat.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: A huge serpent bears the seated god Afu-Tem; the text says Afu-Tem shoots
