canonical_text:
  quote: ''
  summary: 'The passage describes figures in an Am-Tuat scene: serpent-bearers before
    Ra carry Mehen-ta toward a city and the Eastern Horizon; serpent forms associated
    with crowns and hidden heads stand at a door of darkness on the road to Sais;
    Neith figures guard an unseen holy gate and spring to life when called; the hidden
    Circle of the Tuat is the route by which the god journeys to the Eastern Horizon;
    upper-register figures include a two-headed crowned god, a winged serpent with
    a god touching its wings, and a serpent carrying a mummied god.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Figures in the picture stand before the great god, carry the serpent Mehen-ta
    on their heads into a city, and travel after Ra toward the Eastern Horizon of
    the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great god calls the figures by name and decrees their duties; Ra addresses
    them as ward-keepers of serpent-figures and commands them to lift their heads
    and continue their journeyings.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The assigned work of these figures is to make the serpent Mehen travel to
    the Eastern Hall of the Horizon, after which they return to their habitations
    once the god has passed through darkness and taken his place in the horizon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The serpent Sem-shet has the Red Crown resting on its back, with a human head
    in an angle of the crown.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The serpent Sem-nebthet has the White Crown resting on its back, with a bearded
    human head projecting from each side.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two crown-bearing serpents are identified as hidden images of Horus at
    the second door of thick darkness on the holy road to Sais; when the great god
    cries out to them, hidden heads appear and then swallow their own forms, meaning
    they disappear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Four Neith figures are listed: Neith of the phallus wearing the Red Crown,
    Neith of the Red Crown wearing the Red Crown, Neith of the White Crown wearing
    the White Crown, and Neith the Young wearing the White Crown.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The figures at the door are said to be in a form made by Horus; when the god
    calls them by name they spring into life at his voice and guard the holy gate
    of Sais, which is unknown and cannot be seen or looked at.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A text above the upper register calls the scene the hidden Circle of the Tuat,
    through which the god journeys in order to come forth into the Eastern Horizon
    of the sky.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The hidden Circle of the Tuat eternally swallows its images or forms in the
    presence of a god named Reekh, then gives them to those born and coming into being
    on earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The text states that whoever makes and knows an exact copy of these forms
    will be a well-equipped spirit in heaven and earth eternally.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The god Aper-hiu-neb-tchetta has a disk at the neck from which two human heads
