canonical_text:
  quote: ''
  summary: The passage catalogs several named Circles and named doors in the Am-Tuat.
    In these regions, images or gods are seated, often on instruments for weaving.
    A repeated formula says that Horus made a mystery, that a god cries out to souls
    wherever they are, and that the voices of those shut in the Circles are heard
    as they cry to Ra. The passage then lists occupants including images of Osiris,
    Isis, Horus, several animal-headed gods, goddesses, a serpent, arrows, and a lion-headed
    god.
  language: English
  quote_policy: summarized
