canonical_text:
  quote: ''
  summary: The passage describes an upper register of the Am-Tuat in which Ra or the
    great god commands armed attendants to destroy enemies in darkness and repel a
    serpent; a hidden circle of Amentet is identified as a place where Kheper unites
    with Ra and where knowledge of depicted figures and names allows passage through
    the Tuat. The register then lists divine figures, serpents, goddesses, an axe-and-disk
    emblem, Eye-of-Horus rites, an ape god holding the solar eye, and eight further
    gods.
  language: English
  quote_policy: summarized
