canonical_text:
  quote: ''
  summary: 'The passage describes several depicted groups of deities: beings with
    uraei and mouth-flames who accompany Ra and repel Apep; gods who praise Ra at
    dawn; and lower-register deities including Nu, Nut, Hehu, Hehut, paddle-bearing
    gods, a serpent-form deity emitting fire, and adoring gods who receive Ra in the
    eastern sky.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group in the picture is described as having their own bodies, with uraei
    emerging from them and flames issuing from their mouths.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: This group follows the great god, drives away Apep, guides Ra, and smites
    Apep in the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same group is said to journey around the upper heavens, restore gods after
    the great god passes the hidden chamber of the sky, and then return to their own
    abodes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Twelve gods stand upright with both hands raised in adoration; the OCR passage
    lists names including Neb-ankh, Hi, Neb-Tuat, Netchem-ab, Ua-ab, Hunnu, Sensabt,
    Ma-tepu-neteru, Thes-tepu-neteru, and Hekenu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dawn-praising gods address Ra as producer of his own birth and being,
    and say that heaven belongs to his soul and earth to his body.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ra is said to sail over the Horizon, take his place in his shrine, descend
    into the sky, and take his two souls through magical protectors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The work of the dawn-praising gods in the Tuat is to praise the great god,
