- id: motif:2
  label: offerings and provisions sustaining underworld beings
  taxonomy_refs:
  - sacred_exchange
  basis: Gods receive offerings from fields, unite with provisions of the great god,
    produce offerings, receive food, and make provisions and water available for spirits.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  confidence: medium
  cautions: The passage describes ritual provisioning and divine sustenance, but does
    not explicitly frame it as reciprocal exchange.
- id: motif:3
  label: protection from violence in the underworld
  taxonomy_refs: []
  basis: The gods are told to protect Osiris from violent and wrongful action, and
