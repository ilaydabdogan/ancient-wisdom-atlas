  summary: The passage describes speeches of the great god/Ra to gods and goddesses
    dwelling in the Tuat, their offerings, protection of Osiris, crowned sceptres
    with knives, named divine figures, chambers containing images of Ra and a fire-belching
    snake, lower-register gods and goddesses who provide light and aid souls, and
    the monster serpent Am-khu with the heads of the four children of Horus emerging
    from its body.
  language: English
