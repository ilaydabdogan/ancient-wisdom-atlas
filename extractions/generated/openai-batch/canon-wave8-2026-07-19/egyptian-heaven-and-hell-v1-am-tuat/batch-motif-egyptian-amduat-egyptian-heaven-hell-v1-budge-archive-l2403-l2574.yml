    called a guardian.
- id: motif:3
  label: Protective boat or vessel in the hidden realm
  taxonomy_refs:
  - ark_vessel
  basis: The lower register describes a large boat with woman-headed ends containing
    Hetch-nau, who guards the Aheth chamber and stands at the mouth of hidden passages.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy label is broader than the passage wording; the passage says
    boat, not ark.
- id: motif:4
  label: Daily illumination at the birth of Khepera
  taxonomy_refs:
  - death_rebirth
  basis: Menmenut is said to be illuminated daily at the birth of Khepera, and the
    passage also depicts Khepera's winged disk.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage states daily birth and illumination but does not narrate a
