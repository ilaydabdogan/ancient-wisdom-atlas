- id: motif:2
  label: Composite serpent guardians and way-serpents
  taxonomy_refs:
  - serpent
  basis: Multiple serpents are central to the passage, including multi-headed, winged,
    boat-dwelling, male, female, and hidden-image serpents, several with warding or
    passage-guarding roles.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:7
  - ev:8
