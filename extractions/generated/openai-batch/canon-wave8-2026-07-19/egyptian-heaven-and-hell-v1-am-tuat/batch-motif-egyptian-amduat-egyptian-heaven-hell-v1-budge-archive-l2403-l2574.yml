  quote: ''
  summary: The passage describes figures in the Kingdom of Seker, including composite
    serpents, gods and goddesses stationed on the holy or secret way of Re-stau, a
    boat containing a serpent that guards the Aheth chamber, paired male and female
    serpents, a three-headed serpent associated with stars and fourteen disk-crowned
    heads, and the winged disk of Khepera above the envoy of heaven and Maat.
  language: English
  quote_policy: summarized
