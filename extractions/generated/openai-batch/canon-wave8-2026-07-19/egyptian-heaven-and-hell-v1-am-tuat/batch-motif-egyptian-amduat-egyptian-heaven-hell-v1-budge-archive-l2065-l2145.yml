canonical_text:
  quote: ''
  summary: The passage describes beings in a picture and in the house of Tet praising
    a great god. When the god speaks to them, they come to life, receive water and
    their due. Their work in Ament is to cut souls apart, restrain shadows, and destroy
    doomed beings in a fiery place of destruction. The passage names Khetra as warder
    of the Field and adds a note summarizing Maspero's discussion of a mutilated speech
    by the Sun-god to inhabitants of Net-neb-ua-kheper-aut, including protection and
    escort of Osiris and his forms.
  language: English; includes a French scholarly excerpt
  quote_policy: summarized
