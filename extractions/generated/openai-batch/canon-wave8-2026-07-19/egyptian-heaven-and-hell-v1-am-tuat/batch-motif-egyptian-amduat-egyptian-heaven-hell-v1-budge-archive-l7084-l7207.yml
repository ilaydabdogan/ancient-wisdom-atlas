canonical_text:
  quote: ''
  summary: The passage presents a speech by Horus to beings who are submerged, swimming,
    or floating in the waters of Nu in the Tuat. Horus commands them to move through
    the waters and promises that their bodies will not perish or decay, that they
    will have dominion over their water, and that their souls will have life. The
    passage then identifies a lake of water, four named female figures each bearing
    a serpent on her head and shoulders, and a Set-headed sceptre named Set-nehes,
    “Set who wakens.” The four figures are said to live by their heads and to shed
    light on the road of Ea in darkness; when Ea comes into the Hall of the East,
    Set wakes and travels with him.
  language: English
  quote_policy: summarized
