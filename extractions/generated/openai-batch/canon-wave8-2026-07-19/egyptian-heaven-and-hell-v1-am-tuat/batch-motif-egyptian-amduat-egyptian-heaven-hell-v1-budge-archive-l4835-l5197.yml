  summary: In the Eighth Hour passage, Ra, in a hidden form, is towed by gods through
    a city of the Tuat. He cries out to its circles and inhabitants, whose gates open
    to his voice. Groups of gods, servants, ram-forms of Tathenen, and seated deities
    in named circles respond, tow, guard, or occupy the underworld spaces.
  language: English
