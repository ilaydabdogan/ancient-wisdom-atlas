  summary: The passage describes a god entering and passing through a Court in ram
    form, making transformations there, leaving the dead in his following behind in
    the Court, and speaking to the gods in it. It says copies made according to the
    ordinances of the hidden house act as magical protectors for the maker. The upper
    register contains nine apes who open gates to the Great Soul and twelve goddesses
    who unfold portals in the earth.
