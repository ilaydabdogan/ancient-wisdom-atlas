  summary: The passage gives the title and scope of the Book Am-Tuat as writings and
    drawings of a hidden palace associated with souls, gods, shadows, and spirits
    at the horizon or boundary of Ament/Amentet. It says the work contains knowledge
    of the souls of the Tuat, secret souls, doors and ways used by the great god in
    his journey, the hours and their gods, formulae and speeches, gods who praise
    him, and beings who effect destruction.
