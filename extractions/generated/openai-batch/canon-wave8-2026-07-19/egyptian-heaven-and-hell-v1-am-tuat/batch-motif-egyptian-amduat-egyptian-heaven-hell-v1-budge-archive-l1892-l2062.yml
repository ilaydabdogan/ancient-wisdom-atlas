canonical_text:
  quote: ''
  summary: The passage describes beings in the Tuat/Amentet whose flesh, souls, and
    shadows are present together. After a great god addresses and passes them, they
    praise him and weep. Their work includes vengeance against the Seba fiend of Ra,
    bringing Nu into being, and making Hap/the Nile flow. Knowledge of these beings
    protects a passer from their roarings and from falling into their caverns. The
    lower register is then enumerated with Khnemu, Nerta, two groups of Osiris forms,
    goose-headed knife-bearers, Sepaashat with two women, Amenti, goddesses holding
    a sceptre and eyes, Khetra, and three bowed gods.
  language: English
  quote_policy: summarized
