  text: The path of the Boat of the Sun differs from earlier divisions and passes
    over the region called the kingdom of Seker.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The corridor called Re-stau begins at the upper side of the topmost division,
    slants downward, and includes a first door called Mates-sma-ta that is thrown
    open.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The corridor is called the road of the secret things of Re-stau; the god does
