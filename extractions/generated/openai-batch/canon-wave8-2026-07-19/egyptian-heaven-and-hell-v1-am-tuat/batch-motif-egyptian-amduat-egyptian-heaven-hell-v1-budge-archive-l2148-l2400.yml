canonical_text:
  quote: ''
  summary: The passage describes the Fourth Division of the Tuat, called Ankhet-Kheperu,
    traversed by the Sun-god in the Fourth Hour. It maps the Re-stau corridor through
    the kingdom of Seker, with slanting passages, named doors, hidden things, and
    guardians. Ra and his crew change into a serpent-ended boat drawn by four gods;
    flames from the boat guide him through pools while unseen beings hear his voice.
    The passage also lists divine figures, serpents, a scorpion, a uraeus, the Utchat,
    the crook of Osiris, and a guide of the holy way.
  language: English
  quote_policy: summarized
