canonical_text:
  quote: The exit of Ra from the Tuat, i.e., Sunrise.
  summary: The passage describes figures behind the hidden image of Osiris in darkness,
    words of life addressed to Osiris and beings of Amentet, and the end of the Tuat
    where Ra exits at sunrise. It also explains an invisible form of Horus, an image
    lifted by Shu, the sun disk at the boundary of the Tuat, the beetle of Kheper
    emerging from the Sun-god's boat, and the discarded body of the night Sun-god.
  language: English
