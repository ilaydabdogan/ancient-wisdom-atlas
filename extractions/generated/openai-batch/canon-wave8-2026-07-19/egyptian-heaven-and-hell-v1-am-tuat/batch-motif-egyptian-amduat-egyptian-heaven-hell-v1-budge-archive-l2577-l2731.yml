canonical_text:
  quote: ''
  summary: The passage describes the Fifth Division of the Tuat, called Ament, through
    which the Sun-god passes in the fifth hour of night. His solar boat is towed by
    seven gods and seven goddesses; four named gods march in front under Isis of Amentet.
    The scene includes a hollow mound ending in a woman's or goddess's head, a descending
    scarab identified with Khepera, speeches about the hidden roads of the Tuat, and
    goddesses who receive Ra and call him forward in the boat within the earth while
    his enemies are destroyed.
  language: English
  quote_policy: summarized
