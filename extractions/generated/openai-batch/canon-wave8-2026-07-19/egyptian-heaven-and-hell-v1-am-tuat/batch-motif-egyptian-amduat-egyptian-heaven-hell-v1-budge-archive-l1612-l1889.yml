canonical_text:
  quote: ''
  summary: The passage describes the Third Division of the Tuat in the Third Hour
    of night. The dead Sun-god Af travels by boat over the underworld river, following
    three named boats populated by forms of Horus, Osiris figures, steersmen, serpents,
    and other deities. A translated caption describes the great god journeying through
    named underworld regions, resting, addressing Osiris and his followers, being
    guided by hidden boats, and granting benefits to one who knows these things. The
    upper register lists additional named beings, animal-headed gods, mummied forms,
    bearers of Eye-pupils, a papyrus sceptre, mourners, and standards.
  language: English
  quote_policy: summarized
