    sceptre surmounted by flesh, groups of gods and goddesses, professional mourners,
    Heru-kheti, the Hennu standard, and the gods Meh-Maat and Neter-neferu.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
