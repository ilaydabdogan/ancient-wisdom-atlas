  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boat of Af, the dead Sun-god, moves over the waters of the underworld
    river, and Af stands in a shrine in the form of a ram-headed man.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The boat crew is described as four mariners, a goddess of the hour, and a
    hawk-headed deity, a form of Horus, who ties rope loops to hawk-headed rowlocks
    for the paddles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The boat of Af follows three named boats: Uaa-Penat, Uaa-herer, and Pa-khet.'
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:5
  text: Uaa-Penat, the boat called “The boat which capsizeth,” contains three hawk-headed
    forms of Horus, two male steersmen, Bak, Baket, a serpent named Teka-hra, and
    an aft steersman named Nab-hra; one Horus form stands on a snake.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Uaa-herer, the boat called “The boat of Rest,” has cynocephalus heads at its
    ends, an Osiris god in mummy form in the middle, two gods beside him, two steering
    beings, and a serpent named Set-em-iira-f standing on its tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pa-khet, the boat called “The Branch,” has lion-headed ends, an Osiris form
    called Shefshef wearing ram horns and swathed on the upper body, the mummied form
    Am-ta, the god Keb-uast, a steersman named Khex or Khenxu, and a serpent named
    Set-em-maat-f standing on its tail.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The procession of boats is met by four swathed forms of Osiris named Neb-net,
    Meni, Ai;i-tcheeu, and Maa-tcheru.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The translated text above the boats says that the great god journeys over
    Net-neb-ua-kheper-aut, transports boats in the earth, paddles Osiris to a city,
    rests there, sends forth his voice to Osiris and his followers, is guided by hidden
    boats into a field, and that whoever knows these things will have habitation and
    bread with Ra.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The upper register includes dog-headed apes, jackal-headed gods, a man and
