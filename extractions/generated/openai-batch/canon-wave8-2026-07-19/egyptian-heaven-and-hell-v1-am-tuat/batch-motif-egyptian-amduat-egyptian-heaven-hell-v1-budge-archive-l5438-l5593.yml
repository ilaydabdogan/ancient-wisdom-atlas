canonical_text:
  quote: ''
  summary: The passage describes several named circles in the Eighth Division. In
    Hetepet-neb-s and Hetemet-khemiu, beings sit on weaving instruments set on sand
    according to a mystery made by Horus; a god cries out to their souls and sounds
    are heard from those enclosed in the circles. Hetemet-khemiu is entered through
    a named door and contains Nut, Ta, and Sebeq-hk. Hap-semu-s is entered through
    another named door and contains four mummied gods, each with a weaving instrument.
  language: English
  quote_policy: summarized
