canonical_text:
  quote: ''
  summary: The passage describes an invisible serpent in the Tuat whose folds contain
    forms of the four children of Horus and whose work is to devour shades and hostile
    spirits. It then lists four seated gods without thrones and a company of nine
    fire-belching, knife-bearing serpents. The great god addresses the seated gods,
    telling them to unite with their flesh and stating that they live by his voice
    and watch the two comings of Khuti. He also addresses the nine serpents as flame-faced,
    knife-bearing warders who burn and hack enemies, guard the Hidden Flesh made of
    Nu, dwell in water, and destroy the dead and spirits in the Tuat.
  language: English
  quote_policy: summarized
