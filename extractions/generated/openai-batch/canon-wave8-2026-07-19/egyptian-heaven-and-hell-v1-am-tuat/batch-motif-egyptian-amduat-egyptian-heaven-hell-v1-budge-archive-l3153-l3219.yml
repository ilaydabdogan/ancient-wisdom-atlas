canonical_text:
  quote: ''
  summary: A great god addresses beings who stand at blocks of torture, guard the
    destruction of the dead, possess voices, words of power, and souls, sing with
    sistra, take vengeance, annihilate the dead, and cut up shades. He tells them
    to prepare slaughtering knives and bind a figure so that he may journey past them
    in peace; the passage says that whoever knows this will pass by the goddess in
    peace. The prose note then describes the entrance to the Sixth Division of the
    Tuat as a lower-register door guarded by a self-opening serpent, near a five-rayed
    star identified with Venus and called a living god that journeys and travels.
  language: English
  quote_policy: summarized
