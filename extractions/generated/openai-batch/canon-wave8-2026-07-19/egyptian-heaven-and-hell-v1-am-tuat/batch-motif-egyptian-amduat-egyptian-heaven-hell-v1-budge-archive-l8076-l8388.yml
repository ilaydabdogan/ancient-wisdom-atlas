canonical_text:
  quote: ''
  summary: Chapter XII describes the Twelfth Division of the Tuat, called Then-neteeu,
    through which the Sun-god passes during the Twelfth Hour of night. The passage
    presents the hidden circle at the limit of thick darkness where the great god
    is born as Khepera, enters or emerges through a serpent image, is towed in the
    solar boat by gods and goddesses, comes forth into the pool of Nu and the body
    of Nut, and takes position in the Eastern Horizon as Shu receives him.
  language: English
  quote_policy: summarized
