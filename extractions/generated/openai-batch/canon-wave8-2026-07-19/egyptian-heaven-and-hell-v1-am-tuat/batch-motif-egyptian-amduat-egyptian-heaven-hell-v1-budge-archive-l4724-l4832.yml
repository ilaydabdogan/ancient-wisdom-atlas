canonical_text:
  quote: ''
  summary: 'The passage introduces the Eighth Division of the Tuat, named Tebat-neteru-s,
    through which the Sun-god passes during the Eighth Hour of night. The great god
    is in his boat among hidden gods, is towed through the city by gods through the
    magical powers of the serpent Mehex, and the gate, city, and hour are named. The
    hidden circles of Ament are described, along with benefits for one who knows their
    names. The middle register begins with the solar boat: the god stands under a
    canopy formed by the body of the serpent Melien, and the boat is towed by nine
    gods.'
  language: English
  quote_policy: summarized
