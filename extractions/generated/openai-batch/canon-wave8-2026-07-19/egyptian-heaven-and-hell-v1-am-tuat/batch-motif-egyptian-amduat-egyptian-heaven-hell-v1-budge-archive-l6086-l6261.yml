canonical_text:
  quote: ''
  summary: 'The passage describes figures in the Tuat: swathed gods seated on weaving
    instruments and instructed to act for Osiris; twelve named goddesses who come
    to life when the great god cries out and who praise and strengthen Osiris or the
    god of the Tuat; and, in a lower register, twelve uraei mounted on weaving instruments
    and emitting fire from their mouths.'
  language: English
  quote_policy: summarized
