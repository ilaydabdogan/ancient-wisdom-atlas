- id: obs:2
  text: Ea addresses swathed and clothed gods, telling them to uncover their heads,
    unveil their faces, and perform what must be done for Osiris.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The swathed beings are called tchatcha, or divine sovereign chiefs; they avenge
    Osiris by their words each day and their work is to overthrow Osiris’s enemies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Twelve goddesses are named in sequence: Perit, Shemat-khu, Nebt-shat, Nebt-shefsheft,
    Aat-aatet, Nebt-setau, Hent-nut-s, Nebt-mat, Tesert-ant, Aat-khu, Sekhet-metu,
    and Netert-en-khentet-Ea.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The twelve goddesses have bodies of the Tuat and forms made by Horus; when
    the great god cries out after arriving where they are, they come to life and hear
    his voice.
  category: action
  evidence_refs:
  - ev:5
