  summary: A scholarly appendix reconstructs the campaigns of Pandukabhaya and Dutthagamani.
    Pandukabhaya flees persecution by his uncles, gathers followers, advances by an
    indirect route through border districts, uses river crossings and mountain positions,
    wins battles, takes the capital, assumes sole sovereignty, and moves the royal
    residence to Anuradhapura. The passage then states that Dutthagamani's later advance
    on Anuradhapura followed similar connecting roads around the Mahaweliganga.
  language: English
