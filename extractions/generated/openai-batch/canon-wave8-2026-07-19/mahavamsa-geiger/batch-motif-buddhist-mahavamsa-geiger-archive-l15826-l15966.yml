canonical_text:
  quote: ''
  summary: The passage recounts reigns from Mahaculi Mahatissa through Bhatikabhaya.
    It describes Mahaculi Mahatissa's pious rule, hidden manual labor, almsgiving,
    monastic donations, and heavenly rebirth; Coranaga's rebellion, destruction of
    viharas, poisoning, and hell rebirth; Anula's repeated poisonings and transfers
    of rule to desired men before her own short reign; Kutakanna-Tissa's return with
    an army, killing of Anula, Buddhist foundations, civic works, and nunnery for
    his mother; and the beginning of Bhatikabhaya's reign and repair of the Lohapasada.
  language: English
