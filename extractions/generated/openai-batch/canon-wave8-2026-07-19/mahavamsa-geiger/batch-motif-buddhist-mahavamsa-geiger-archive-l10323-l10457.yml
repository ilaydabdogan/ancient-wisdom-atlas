canonical_text:
  quote: I worship the great Bodhi-tree by bestowing kingship (thereon)
  summary: The passage describes the king worshipping and consecrating the great Bodhi-tree,
    marking its south branch, and making a solemn declaration. The branch severs itself,
    roots into a golden vase, and is accompanied by communal rejoicing and cosmic
    wonders. The tree rises invisibly for seven days, reappears and descends, is again
    consecrated, then is transported to the capital, placed in a hall, given daily
    offerings, and celebrated after new shoots appear.
  language: English
  quote_policy: quoted
