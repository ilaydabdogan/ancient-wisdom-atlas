canonical_text:
  quote: ''
  summary: A king, identified later as Vasabha, receives a secret prediction that
    he has twelve years to live. He asks the Buddhist brotherhood how life may be
    lengthened, and they prescribe gifts, repairs of ruined buildings, keeping precepts,
    and observance of the uposatha fast. The passage then lists Vasabha’s religious
    donations, constructions, restorations, irrigation works, fortifications, public
    feeding, and festivals, concluding that these works of merit removed hindrances
    to long life and that he reigned forty-four years. The final portion begins a
    new episode in which Subharaja, fearing Vasabha, entrusts his daughter, mantle,
    and royal insignia to a brick-worker, who raises the girl; the excerpt ends as
    she sees an ascetic in a flowering kadamba thicket.
  language: English
  quote_policy: summarized
