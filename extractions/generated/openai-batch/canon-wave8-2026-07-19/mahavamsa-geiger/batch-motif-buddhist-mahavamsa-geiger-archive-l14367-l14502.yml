canonical_text:
  quote: ''
  summary: 'After the relic-chamber is completed, the king asks the brotherhood to
    arrange for relics. The brotherhood appoints the young ascetic Sonuttara. They
    recount earlier events on the Ganges involving the Buddha, Nanduttara, and Bhaddaji,
    including demonstrations of supernormal power and a submerged palace. They then
    explain the destined history of one measure of the Buddha’s bodily relics: from
    Ramagama to the naga realm and ultimately to the Great Thupa in Lanka. The relics
    are guarded by nagas after being carried by floodwaters to the ocean, and Sonuttara
    is instructed to bring them for enshrinement.'
  language: English
  quote_policy: summarized
