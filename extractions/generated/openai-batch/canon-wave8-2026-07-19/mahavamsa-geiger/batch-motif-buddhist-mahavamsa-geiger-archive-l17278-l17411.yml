canonical_text:
  quote: ''
  summary: The passage narrates Mahasena’s accession and consecration, Samghamitta’s
    influence over him against the Mahavihara, the starvation and departure of the
    Mahavihara monks, the destruction and transfer of Mahavihara structures to Abhayagiri,
    Meghavannabhaya’s rebellion and reconciliation with the king, the killing of Samghamitta
    and Sona, and the rebuilding and reoccupation of the Mahavihara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Jetthatissa’s death, his younger brother Mahasena ruled for twenty-seven
    years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The thera Samghamitta came from the further coast to consecrate Mahasena as
    king.
  category: action
  evidence_refs:
  - ev:1
