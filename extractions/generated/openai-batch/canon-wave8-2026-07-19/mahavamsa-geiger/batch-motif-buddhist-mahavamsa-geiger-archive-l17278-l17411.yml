  text: Samghamitta told the king that the dwellers in the Mahavihara did not teach
    the true vinaya and that his own party taught it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A royal penalty was established against anyone who gave food to a bhikkhu
    dwelling in the Mahavihara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mahavihara bhikkhus fell into want, abandoned the Mahavihara, and went
    to Malaya and Rohana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mahavihara was desolate and empty of its resident bhikkhus for nine years.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Samghamitta obtained the king’s leave to destroy the Mahavihara and set people
    to do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sona, with allied bhikkhus, destroyed the seven-storied Lohapasada and carried
    materials from the Mahavihara to Abhayagiri.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Abhayagiri-vihara became rich in buildings through materials borne away
    from the Mahavihara.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king moved a great stone image from Pacinatissapabbata to Abhayagiri and
    set up associated religious buildings there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Meghavannabhaya, the king’s friend and minister, became angry about the destruction
    of the Mahavihara, rebelled, raised a force in Malaya, and camped by the Duratissaka-tank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king marched out to battle after hearing that his friend had come.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Meghavannabhaya went alone by night to the king with drink and meat from Malaya,
    and the king ate with him in trust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Meghavannabhaya explained that he rebelled because the Mahavihara had been
