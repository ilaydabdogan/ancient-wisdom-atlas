canonical_text:
  quote: ''
  summary: The passage describes King Bhatika's extensive offerings, adornments, festivals,
    alms, and institutional support connected with the Great Thupa, the relic-chamber,
    the Bodhi-tree, and the monastic community. It then describes his successor Mahadathikamahānāga's
    merit-making works, including work on the Great Thupa and the construction of
    the Ambatthala-thupa, during which he risks his own life to make the building
    firm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king orders the Great Cetiya or Great Thupa to be covered with scented
    paste, minium, flowers, pearls, coral, gold lotus-flowers, and pearl clusters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king raises water from the Abhaya-tank by machines and pours water over
    the thupa as a water-offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After hearing arahants chanting in the relic-chamber, the king vows not to
    rise until he has seen it, fasts, and lies down at the foot of an east-side stone
    pillar.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The theras create a door for the king and bring him into the relic-chamber;
    after seeing its adornment, he makes clay figures modelled after what he saw there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince orders sevenfold offerings to the Great Thupa using honeycombs,
    perfumes, flower-filled vases, essences, pigments, lotus-flowers, and many lighted
    lamps with ghee and oils.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king institutes recurring festivals, including a plaster-renewal festival,
    Bodhi-tree watering festivals, Vesakha festivals, lesser festivals, dances, concerts,
    instrument-playing, homage to the Buddha, and a twice-daily flower-drum offering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king gives alms, ascetic requisites, land for cetiya repair, food for
    a thousand bhikkhus, and hospitality at named receiving-places and buildings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mahadathikamahānāga succeeds Bhatika, performs works of merit, works on the
    Great Thupa, widens the pathway around it, provides chairs for preachers, and
    builds the Ambatthala-thupa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because the Ambatthala-thupa building is not firm, Mahadathikamahānāga lies
    down there while thinking of the Buddha's merit and risking his own life; afterward
    the building is made firm and completed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mahadathikamahānāga sets up four jeweled arches at the four entrances.
  category: object
  evidence_refs:
  - ev:6
