canonical_text:
  quote: ''
  summary: The passage recounts a battle between the king and his brother Tissa, Tissa’s
    defeat and flight to a vihara, his concealment and removal by monks, his later
    appeal for peace through the thera Godhagatta Tissa, and the king’s reconciliation
    with him through hospitality before the brotherhood. It closes with a moral reflection
    that pious men appease even great enmity.
  language: English
  quote_policy: summarized
