canonical_text:
  quote: "“For the sake of sovereignty will her son slay his uncles.”"
  summary: The passage recounts the birth of Abhaya and Citta, a prophecy that Citta’s
    son will kill his uncles for sovereignty, Citta’s guarded confinement, Dighagamani’s
    secret access to her, her pregnancy and marriage, the threat against a male child,
    the killing and rebirth of two attendants as yakkha guardians, the substitution
    of another woman’s daughter for Citta’s son, the naming of Pandukabhaya, the death
    of Panduvasudeva, and the consecration of Abhaya.
  language: English
  quote_policy: quoted
