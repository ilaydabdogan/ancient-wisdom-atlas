canonical_text:
  quote: ''
  summary: After the king unites Lanka, the warrior Theraputtabhaya refuses secular
    honours and seeks ordination, describing the passions as the remaining rebels
    to be fought. King Abhaya then observes a royal festival at the Tissa-tank. A
    relic-bearing spear is planted at the future site of the Maricavatti-vihara and
    cannot be moved after the king's water festival. The king treats this as a miracle,
    builds a cetiya enclosing the spear and a vihara enclosing the thupa, and later
    consecrates the monastery with a large gathering of monks and nuns. He explains
    the foundation as expiation for eating pepper without thought of the brotherhood,
    donates it with ceremonial water, gives lavish gifts, and the chapter closes with
    a reflection on wise religious use of wealth.
  language: English
  quote_policy: summarized
