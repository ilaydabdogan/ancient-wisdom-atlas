candidate_motifs:
- id: motif:1
  label: Royal succession plot by poisoned fruit
  taxonomy_refs:
  - royal_legitimacy
  basis: A queen seeks kingship for her son by poisoning a fruit intended for the
    vice-regent; the plan instead kills her own child.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage frames the act as a court succession plot, but does not develop
    it as a standalone folktale type.
- id: motif:2
  label: Threatened royal flees and founds a regional lineage
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: Mahanaga flees to Rohana to save his life; his wife bears a son there, and
    his descendants later rule in the region.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives dynastic sequence rather than a detailed exile-return
    narrative.
- id: motif:3
  label: Disguised holy man as secret messenger
  taxonomy_refs:
  - trickster_boundary
  basis: A man wears the disguise of a bhikkhu to enter the palace with an arahant
    and deliver or expose a secret letter.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents deception through
    religious disguise, not a named trickster figure.
- id: motif:4
  label: Divine judgment through an overflowing sea
  taxonomy_refs:
  - divine_judgment
  basis: After a thera and messenger are killed and thrown into the sea, angry sea-gods
    make the sea overflow the land.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage attributes the inundation to sea-gods' wrath but gives no
    extended judgment speech.
- id: motif:5
  label: Royal daughter launched in a vessel upon the sea
  taxonomy_refs:
  - ark_vessel
  - royal_legitimacy
  basis: In response to the overflowing sea, the king places his daughter in a golden
    vessel marked as a king's daughter and launches it; she lands and becomes queen.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The vessel motif is present, but it is not a full ark narrative; the passage
    does not explicitly call the act a sacrifice.
- id: motif:6
  label: Monastic patronage and merit exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The king provides the brotherhood with necessities, Viharadevi brings offerings,
    and grateful bhikkhus care for the sick samanera who served them.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The exchange is devotional and institutional rather than a bargain with
    a deity.
- id: motif:7
  label: Dynastic birth in a sacred monastic setting
  taxonomy_refs:
  - sacred_birth
  - royal_legitimacy
  basis: Mahanaga's pregnant wife bears a son in the Yatthalaya-vihara, and that son
    enters the Rohana succession.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The birth has a sacred setting, but the passage does not describe miraculous
    conception or extraordinary signs.
comparison_claims:
- id: claim:1
  claim: An editorial note compares the insertion of the Dutthagamani epic here with
    the insertion of Maya's dream before the Buddha's birth in the Nidanakatha, saying
    the introducing words are almost the same.
  claim_level: linguistic_similarity
  target: Nidanakatha account of Maya's dream before the birth of the Buddha
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is from a note in the supplied passage, not from the
    narrative action itself, and it concerns introductory wording rather than proving
    shared narrative origin.
