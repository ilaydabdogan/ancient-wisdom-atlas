canonical_text:
  quote: ''
  summary: The passage closes a moral reflection on avoiding evil, then introduces
    the ordered story leading to Dutthagamani's kingship. It recounts a royal succession
    plot involving a poisoned mango, Mahanaga's flight to Rohana, the birth and succession
    of his descendants, the origin of Viharadevi through a sea ordeal following a
    king's wrongful killing of a thera, and acts of Buddhist patronage and monastic
    merit involving Kakavannatissa, Viharadevi, a samanera, and the brotherhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dutthagamani is said to have become king after slaying Elara, and the narrator
    announces that the story will explain how this happened in order.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Devanampiyatissa's consort wished kingship for her own son and sent the
    vice-regent Mahanaga a poisoned mango-fruit; her little son ate it and died.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mahanaga fled to Rohana with his wives, men, and horses, and his pregnant
    wife bore a son at the Yatthalaya-vihara.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mahanaga and his descendants ruled in Rohana or Mahagama, and Kakavannatissa
    later reigned there with Viharadevi as his consort.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ayya-Uttika, the younger brother of King Tissa of Kalyani, fled after being
    the queen's lover and sent a secret letter to the queen by a man disguised as
    a bhikkhu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: King Tissa discovered the written message and, in anger, had both the thera
    and the messenger killed and thrown into the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sea-gods, angered by the killings, made the sea overflow the land; King
    Tissa then placed his daughter Devi in a golden vessel marked as a king's daughter
    and launched it on the sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Devi landed near the Lanka vihara, and Kakavanna consecrated her as queen;
    this is given as the reason for her epithet Vihara.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kakavannatissa founded several viharas and continually provided the brotherhood
    with the four needful things.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A samanera at Kotapabbata fixed three stone slabs as steps to the Akasa-cetiya
    courtyard, gave drink, served the brotherhood, became gravely ill, and was tended
    by grateful bhikkhus.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Viharadevi regularly gave lavish gifts and offerings to the brotherhood, then
    sat near the chief thera while he expounded the doctrine.
  category: action
  evidence_refs:
  - ev:11
