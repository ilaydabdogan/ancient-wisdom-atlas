canonical_text:
  quote: ''
  summary: The passage presents exhortation to a king that he will glorify the Buddha's
    doctrine, followed by his reflection on a childhood oath never to take a meal
    without the brotherhood of bhikkhus. He realizes he once ate a pepper pod without
    leaving any for the brotherhood and resolves to do penance. A closing didactic
    reflection urges meditation on killing caused by greed and on mortality as the
    murderer of all as a path toward freedom from suffering.
  language: English
  quote_policy: summarized
