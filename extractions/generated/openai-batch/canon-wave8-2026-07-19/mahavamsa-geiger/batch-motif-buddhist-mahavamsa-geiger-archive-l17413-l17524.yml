  quote: ''
  summary: The passage narrates King Mahasena's support for the thera Tissa, the building
    of the Jetavana-vihara within the boundaries of the Mahavihara, the resulting
    monastic boundary conflict and abandonment, the later exclusion of Tissa from
    the order, the king's construction of Buddhist viharas, nunneries, a thupa, tanks,
    and a canal, and the concluding judgment that he gathered both merit and guilt.
