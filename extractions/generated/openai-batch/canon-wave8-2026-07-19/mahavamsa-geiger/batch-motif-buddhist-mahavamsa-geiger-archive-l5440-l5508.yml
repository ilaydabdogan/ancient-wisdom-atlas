canonical_text:
  quote: ''
  summary: The passage lists senior theras and their teacher lineages, states that
    eight had seen the Tathagata, describes Revata selecting seven hundred qualified
    arahants from a large assembly to hold the Second Council, and reports that they
    met at Valikarama under Kalasoka's protection, compiled the dhamma, completed
    the work in eight months, later attained nibbana, and occasion a reflection on
    impermanence and striving for deliverance.
  language: English
  quote_policy: summarized
