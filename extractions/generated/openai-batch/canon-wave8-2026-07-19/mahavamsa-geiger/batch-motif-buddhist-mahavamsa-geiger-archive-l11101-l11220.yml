canonical_text:
  quote: ''
  summary: King Uttiya mourns the death of the thera Mahinda, arranges an elaborate
    public funeral, cremation, relic collection, and construction of cetiyas and thupas.
    The cremation site becomes an honored place for burning the bodies of holy men.
    Samghamitta later passes into nibbana and receives parallel funeral honors, with
    her cremation taking place near the Thuparama in sight of the great Bodhi-tree,
    followed by the building of a thupa. The passage concludes by listing the deaths
    of other liberated monastics and reflecting on the irresistible power of mortality.
  language: English
  quote_policy: summarized
