canonical_text:
  quote: ''
  summary: The king begins the Great Thupa on an auspicious full-moon day, prepares
    and strengthens the site, lays layered foundation materials brought from sacred
    regions, announces the foundation-stone ceremony, provides festival goods for
    the people, proceeds to the site with royal attendants, and receives large groups
    of bhikkhus from many places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The work of the Great Thupa begins on the full-moon day of Vesakha when the
    Visakha constellation has appeared.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king orders the former stone pillar removed, the thupa site dug to seven
    cubits, stones crushed, and the ground stamped down by elephants with leather-bound
    feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fine moist clay called butter-clay is brought by samaneras from the place
    where the heavenly Ganga falls down upon the earth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The foundation is described as layered with stones, butter-clay, bricks, cement,
