    and silver.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king calls an assembly of bhikkhus and announces that he will lay the
    foundation-stone of the Great Cetiya the next day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king asks the brotherhood and the people in festival array, with fragrant
