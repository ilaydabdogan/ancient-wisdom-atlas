  text: At the four city gates the king provides barbers, bath servants, clothes,
    fragrant flowers, and sweet foods for the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king goes to the Great Thupa site in state-raiment, attended by ministers,
