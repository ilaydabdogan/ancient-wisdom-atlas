canonical_text:
  quote: ''
  summary: The opening of the Mahavamsa salutes the Buddha and introduces a concise
    traditional chronicle. It recounts Gotama Buddha's earlier resolve before Dipamkara,
    homage to twenty-four previous Buddhas and receipt of prophecies of future buddhahood,
    his enlightenment under the Bodhi-tree, early teaching and conversions, and his
    journey to Lanka to establish the faith by confronting the yakkhas gathered there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker makes obeisance to the Sambuddha and says he will recite a fault-free,
    memorable Mahavamsa handed down by tradition.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: On seeing Sambuddha Dipamkara in olden times, the Conqueror resolved to become
    a Buddha in order to release the world from evil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Conqueror offered homage to twenty-four Sambuddhas and received from them
    prophecy of his future buddhahood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After fulfilling all perfections and reaching highest enlightenment, the Buddha
    Gotama delivered the world from suffering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Uruvela in Magadha, Gotama sat at the foot of the Bodhi-tree and reached
    supreme enlightenment on the full-moon day of Vesakha.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: He stayed there seven weeks, mastering his senses and knowing the bliss of
    deliverance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: He went to Baranasi, set rolling the wheel of the law, and brought sixty hearers
    to arahantship.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: He sent bhikkhus to preach the doctrine, converted the thirty companions of
    Bhadda, and stayed at Uruvela to convert the thousand jatilas led by Kassapa.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Kassapa's great sacrifice was near and Kassapa wished him away, the Buddha
    went for alms among the Northern Kurus and later ate near lake Anotatta.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the ninth month of his buddhahood, at the full moon of Phussa, the Conqueror
    set forth for Lanka to win or purify Lanka for the faith.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Conqueror knew Lanka would be a place where his doctrine would shine and
    that the yakkhas filling Lanka must first be driven forth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Mahanaga garden on a fair river bank in the midst of Lanka is described
    as the customary meeting-place for yakkhas.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Blessed One went to the great yakkha gathering, hovered in the air over
    their heads at the place of the future Mahiyangana-thupa, and struck terror.
  category: action
  evidence_refs:
  - ev:7
