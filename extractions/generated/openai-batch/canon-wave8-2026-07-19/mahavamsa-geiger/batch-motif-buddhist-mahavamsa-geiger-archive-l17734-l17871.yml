canonical_text:
  quote: The number of the sects is unanimously given as 18.
  summary: A scholarly appendix surveys Southern, Northern, Tibetan, and Chinese Buddhist
    lists of sects. It states that Southern lists agree because they ultimately rest
    on the old-Sinhalese Atthakatha, that all lists give eighteen sects, and that
    individual sect names and divisions vary. It then compares several sect names
    and variants, including Theravada/Sthaviravada, Mahasamghika, Hemavata/Haimavata,
    Gokulika/Kukkutika, Lokottaravadin, Ekavyoharika, Pannattivadin/Prajnaptivadin,
    and Bahulika/Bahusrutiya.
  language: English
  quote_policy: quoted
