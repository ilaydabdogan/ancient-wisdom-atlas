canonical_text:
  quote: ''
  summary: Vijaya, old and without a son, sends for his brother Sumitta as successor
    but dies before the prince arrives. Sumitta’s youngest son Panduvasudeva travels
    to Lanka with thirty-two companions disguised as mendicant monks, is recognized
    after a soothsayer’s prediction, and is entrusted with sovereignty but not yet
    consecrated because he lacks a consort. Sakka Pandu sends his daughter Bhaddakaccana
    by ship with thirty-two women-friends after prophecies of an auspicious journey;
    they arrive disguised as nuns, are recognized, and Bhaddakaccana becomes queen,
    enabling Panduvasudeva’s consecration.
  language: English
  quote_policy: summarized
