canonical_text:
  quote: ''
  summary: 'The passage recounts the recruitment of extraordinary warriors into royal
    service around Prince Gamani: Velusumana demonstrates fearless horsemanship; Khanjadeva
    displays great strength against buffaloes; Phussadeva produces a thunderous shell-blast
    and is trained as a remarkable archer; Labhiyavasabha builds a tank through exceptional
    strength. The king honors these warriors, orders them to recruit further warriors
    in multiplying groups, and the passage closes with a didactic statement praising
    the path of piety.'
  language: English
  quote_policy: summarized
