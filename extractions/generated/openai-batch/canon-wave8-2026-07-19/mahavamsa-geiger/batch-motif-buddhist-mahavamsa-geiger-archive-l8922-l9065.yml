canonical_text:
  quote: ''
  summary: In the Nandana-garden and then the Mahamegha-park, the thera teaches assembled
    women and is hosted by the king. The queen Anula and women seek ordination, and
    Mahinda says Sanghamitta must come with bhikkhunis and the southern branch of
    the Bodhi-tree. The king gives the Mahamegha-park to the brotherhood by pouring
    water over Mahinda's hand; earthquakes follow as signs that the doctrine and sacred
    monastic places are being established in the island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The assembled people prepare seats for the theras outside the southern gate
    in the Nandana-garden, where the thera sits and preaches to women of noble families.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A thousand women who hear the discourse attain the first stage of salvation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theras say they will go to the mountain, but the king asks them to rest
    instead in the Mahamegha-park, which he describes as neither too far nor too near
    and as having water and shade.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cetiya is later built at the spot where the thera turned back and is called
    Nivattacetiya.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king leads the thera to the Mahamegha-park, orders beds and chairs prepared,
    and the theras stay there for the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the morning the king visits with flowers, asks whether an arama is allowed
    to the brotherhood, and the thera answers that it is allowed, citing the acceptance
    of Veluvanarama.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Queen Anula comes with five hundred women, attains the second stage of salvation,
    and asks the king that they may receive pabbajja-ordination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mahinda says it is not allowed for the theras to bestow pabbajja on women,
    and says that the nun Sanghamitta should come from Pataliputta with the southern
    branch of the great Bodhi-tree and renowned bhikkhunis to confer the ordination.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king pours water over Mahinda's hand as a token of giving the Mahamegha-park
    to the brotherhood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the gift-water falls on the ground, the earth quakes, and Mahinda explains
    that the doctrine is henceforth founded in the island.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mahinda scatters eight handfuls of jasmine blossoms around the picula-tree
    south of the royal dwelling; the earth quakes, and he says a malaka existed there
    during the lifetimes of three Buddhas and will exist there again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mahinda scatters blossoms at the bathing-tank; the earth quakes, and he says
    it will be the tank with the room for warm baths.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mahinda offers flowers at the gateway of the king's dwelling; the earth quakes,
