canonical_text:
  quote: ''
  summary: A scholarly introductory passage presents tabulated royal succession lists
    in Burmese tradition and the Mahavamsa, then compares Ceylonese/Pali, Jaina, Puranic,
    Burmese, Northern, and Hiuen-thsang traditions concerning Magadhan kings, name-equivalences,
    Kalasoka/Kakavarnin, Udayin/Udayabhadda, and the founding or transfer of Pataliputra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening table aligns royal names in Burmese tradition and the Mahavamsa,
    including Bimbisara, Ajatassattu, Udayabhadda, Anuruddha, Munda, Nagadasaka, Susunaga,
    Kalasoka, the Nine Nandas, Candagutta, and Bindusara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Munda is described as unknown to the Jainas but mentioned in the Anguttara-Nikaya;
    the author says this confirms the Ceylonese tradition by Northern tradition.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Jaina list is said to be based on Hemacandra's Parisistaparvan; Srenika
    and Kunika are treated as corresponding to Bimbisara and Ajatasattu, while names
    from Anuruddha-Munda down to the Nandas are missing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Puranic list shares Bimbisara-Ajatasatru-Udayin with the Ceylonese list,
    but differs by inserting another king, arranging the corresponding kings differently,
    and showing instability in names and reign dates.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The author explicitly asks which list deserves the most confidence: the Ceylonese,
    Jaina, or Puranic list.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Jacobi is reported as preferring the Jaina list and identifying Kalasoka,
    'the black Asoka,' with Kakavarnin or Kakavarna, 'the crow-coloured.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that Southern and Northern tradition agree at least in
    making Kalasoka/Kakavarna the successor of Susunaga/Sisunaga.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Jacobi is reported as identifying Kakavarnin/Kalasoka with Udayin/Udayabhadda
    because both are associated with moving the royal residence from Rajagrha to Pataliputra.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jacobi is said to argue that the Ceylonese tradition divided one person into
    two kings, inserted additional kings, and thereby filled a one-hundred-year gap
    between the Nirvana and the Second Council.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author, agreeing with Oldenberg, says he is not convinced by Jacobi's
    grounds for identifying Kalasoka with Udayin.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports different attributions of the transfer of the royal residence
    from Rajagrha to Pataliputra in Jaina, Brahmanical/Puranic, and Burmese traditions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hiuen-thsang is reported as attributing the founding of Pataliputra to an
    Asoka whom he places one hundred years after the Nirvana; the author argues that
    this cannot be the historical Dharmasoka of the third century B.C.
  category: relationship
  evidence_refs:
  - ev:9
