canonical_text:
  quote: ''
  summary: The passage recounts battles among Pandukabhaya, Abhaya, royal brothers,
    and uncles. Abhaya yields government to the brothers, who appoint Tissa as regent.
    A yakkhini named Cetiya, dwelling near Dhumarakkha-mountain, appears as a mare.
    Pandukabhaya pursues and captures her; a palm-leaf becomes a sword through his
    merit. She promises to win the kingdom for him, becomes his mount and adviser,
    and helps him defeat and kill eight uncles. Several place names are explained
    by events in the battles.
  language: English
  quote_policy: summarized
