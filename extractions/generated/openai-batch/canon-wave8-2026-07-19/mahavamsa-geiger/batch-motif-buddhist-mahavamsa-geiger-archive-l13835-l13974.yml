canonical_text:
  quote: ''
  summary: 'The passage describes the beginning of work on a great thupa: the king
    gives alms to the brotherhood, selects a master-builder, receives a divinely inspired
    design through Vissakamma''s possession of the builder, arranges paid labor while
    gods supply bricks at night, and investigates monks who secretly try to contribute
    clay or bricks to the sacred construction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king reverentially greeted the brotherhood and invited them to receive
    alms until the cetiya was finished; after repeated requests, half of the bhikkhus
    accepted for one week.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king had pavilions set up in eighteen places around the thupa site and
    ordered lavish gifts to be given to the brotherhood for one week.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king summoned five hundred master-builders, rejected several proposals
    using larger amounts of sand, and accepted the proposal of an experienced builder
    who would process and use one ammana of sand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the king asked what form the cetiya would have, Vissakamma entered and
    possessed the experienced master-builder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The possessed master-builder used a golden bowl filled with water and a rising
    bubble to demonstrate the intended half-globe form of the cetiya.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king rewarded the master-builder with garments, ornamented shoes, and
    twelve thousand kahapanas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king pondered how to transport bricks without burdening the people; the
    gods then brought enough bricks for one day's work to the four gates of the cetiya
    night after night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king announced that no work should be done without wages and placed money,
    garments, ornaments, foods, drink, flowers, sugar, and perfumes at every gate
    for laborers to take after working.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An unnamed bhikkhu prepared a lump of clay and secretly gave it to a workman
    at the cetiya site; the workman recognized what it was, and a dispute arose.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After learning of the bhikkhu's action, the king used an overseer and three
    pitchers with jasmine-blossoms placed in the courtyard of the sacred Bodhi-tree
    to identify and acknowledge the bhikkhu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A thera from Piyarigalla in the Kotthivala district, a kinsman of the brick-worker,
    made a brick of the correct size and secretly gave it to the workman, who laid
    it in the thupa; a quarrel followed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the king asked whether the brick could be recognized, the workman said
    it was impossible although he knew it; the king then arranged for an overseer
    to identify the thera.
  category: sequence
  evidence_refs:
  - ev:6
