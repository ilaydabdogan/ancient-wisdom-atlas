canonical_text:
  quote: ''
  summary: The passage recounts Buddha-visit episodes in which a king offers a grove,
    the Buddha accepts it amid unusual blossoms and an earthquake, preaches doctrine,
    and many beings attain the fruit of the path. A Bodhi-tree branch is miraculously
    brought in a golden vase by a bhikkhuni and planted. The passage then recounts
    Kassapa Buddha’s compassionate aerial arrival during a war between King Jayanta
    and his younger brother, the halting of battle, royal hospitality, another grove
    offering, and Kassapa’s intention that a bhikkhuni bring a south branch of his
    Bodhi-tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king offers the Mahanoma-garden to the Buddha after a meal; when the grove
    is accepted, it blossoms out of season, the earth quakes, the Buddha preaches,
    and thirty thousand persons attain the fruit of the path.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Conqueror spends the day in the Mahanoma-grove, goes in the evening to
    the place where a former Bodhi-tree had stood, enters deep meditation, and thinks
    that bhikkhuni Kantakananda should bring the south branch of his Bodhi-tree with
    other bhikkhunis.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kantakananda draws a red-arsenic line around the south branch, separates the
    Bodhi-tree branch, places it in a golden vase, and brings it miraculously with
    five hundred bhikkhunis, surrounded by devatas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tathagata receives the tree branch and gives it to King Samiddha to plant
    in the Mahanoma-garden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buddha preaches at the Nagamalaka and at another place where a former
    Buddha had sat; twenty thousand beings are converted at one place and ten thousand
    attain the fruit of the path at the other.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Buddha gives his girdle as a relic for public homage, leaves a bhikkhuni
    with her following and Mahasumba with a thousand bhikkhus, rises into the air
    with the brotherhood, and returns to Jambudipa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Kassapa episode, the Mahamegha-grove is said to have been called Mahasagara,
    the capital was Visala, the king was Jayanta, and the island was called Mandadipa.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A destructive war breaks out between King Jayanta and his younger royal brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kassapa, moved by compassion and intending to end the war and advance conversion
