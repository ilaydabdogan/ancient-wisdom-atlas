canonical_text:
  quote: This is a dynasty of parricides
  summary: 'The passage narrates repeated royal parricides, the citizens'' removal
    of Nagadasaka and installation of Susunaga, and the origins of the Second Council:
    Vajji monks teach the Ten Points as lawful, Yasa opposes a monetary collection
    from laypeople, escapes expulsion by passing through the air, summons senior elders,
    and Revata rejects the Ten Points.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Udayabhaddaka, son of Ajatasattu, is said to have slain his father and reigned
    sixteen years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anuruddhaka and Munda are said to have repeated father-killing in the royal
    succession, and together their reigns covered eight years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nagadasaka, son of Munda, is said to have slain his father and reigned twenty-four
    years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The citizens called the line a dynasty of parricides, banished Nagadasaka,
    and anointed the minister Susunaga as king because he was judged worthy and beneficial
    to all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kalasoka, son of Susunaga, reigned twenty-eight years, and the tenth year
    of his reign is placed one century after the Buddha's parinibbana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Vesali, many Vajji-clan bhikkhus taught that the Ten Points were lawful.
  category: speech
  evidence_refs:
