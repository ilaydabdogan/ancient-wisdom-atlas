  summary: The passage is a scholarly introduction discussing external confirmations
    and chronological problems in the Ceylonese Chronicles. It identifies a Sanchi
    inscription with Moggaliputta Tissa, reports a monumental representation of the
    Bodhi-tree branch transplanting to Ceylon, critiques early royal chronology as
    partly artificial or legendary, and presents the Buddha's death as the chronological
    starting point of a monkish tradition.
