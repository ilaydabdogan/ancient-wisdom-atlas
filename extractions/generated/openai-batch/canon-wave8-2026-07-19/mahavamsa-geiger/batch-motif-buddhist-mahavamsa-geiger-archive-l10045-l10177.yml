canonical_text:
  quote: ''
  summary: 'The passage recounts the handling and enshrinement of a Buddha relic at
    Thuparama: the elephant bearing it requires an elevated place, guards it, and
    is present when the relic rises into the air and performs the double miracle.
    The text explains this as one of the Buddha''s resolutions made at his great nibbana.
    The relic descends onto the king''s head, is laid in the cetiya, an earthquake
    occurs, many people take ordination, and the king completes and establishes Thuparama
    as a vihara.'
  language: English
  quote_policy: summarized
