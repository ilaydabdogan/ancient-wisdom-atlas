canonical_text:
  quote: ''
  summary: A venerable thera meets the king, demonstrates a precisely bounded earthquake
    as a miracle, teaches that guilt depends on evil intent, instructs the ruler for
    a week, and helps the king examine the bhikkhus. False doctrine adherents are
    expelled, the community is declared purified, and a thousand learned bhikkhus
    compile the true doctrine at Asokarama. The council, associated with thera Tissa
    and protected by king Asoka, ends after nine months; the earth shakes at its close
    as if approving the re-establishment of doctrine. A closing verse praises the
    thera for coming from Brahma-heaven to the human world for the sake of doctrine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The venerable thera takes the king's right hand out of compassion and comes
    down from the ship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king leads the thera to the pleasure-garden Rativaddhana, washes and anoints
    his feet, and asks to see a miracle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When offered a shaking of the whole earth or of a single region, the king
    chooses the single-region earthquake after hearing that it is more difficult.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The thera places a waggon, a horse, a man, and a vessel of water at the four
    cardinal points within a yojana and causes the earth within that boundary to tremble,
    affecting only the inner halves of the objects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king asks whether he shares guilt for the minister's murder of bhikkhus,
    and the thera answers that there is no resulting guilt without evil intent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The thera remains for a week in the royal park and instructs the ruler in
    the religion of the Sambuddha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the same week the king sends two yakkhas to assemble all bhikkhus on
    earth, and on the seventh day he arranges a full assembly of the community.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king and the thera sit on one side behind a curtain while the ruler questions
    bhikkhus of several confessions about what the Blessed One taught.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bhikkhus who expound wrong doctrines are expelled from the order, and the
    expelled number is given as sixty thousand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rightly believing bhikkhus answer that the Blessed One teaches the Vibhajja-doctrine;
    the thera confirms this, and the king declares the community purified.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king makes the thera guardian of the order, and the brotherhood thereafter
    holds the uposatha-festival in concord.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The thera chooses one thousand learned bhikkhus with supernormal powers, knowledge
