canonical_text:
  quote: ''
  summary: The dying king instructs his younger brother to complete and maintain the
    Great Thupa and its rituals. While monks chant, gods arrive in celestial cars
    and invite the king to enter a heavenly world. The king asks them to wait while
    he listens to the dhamma. After a miraculous sign using flower garlands confirms
    the cars to the people, the king is told that Tusita is the fairest heaven and
    the dwelling of the Bodhisatta Metteyya. He dies, is seen reborn in celestial
    form in the Tusita car, circles the Great Thupa, pays homage, and enters Tusita.
    The passage then names memorial sites, foretells future relations between the
    king’s family and Metteyya, and concludes with a maxim that merit leads to heaven.
  language: English
  quote_policy: summarized
