canonical_text:
  quote: ''
  summary: The passage recounts the Buddha's intervention among the nagas at Nagadipa,
    including darkness and light, a sermon of concord, the giving up of a throne,
    the planting and gifting of a rajayatana-tree and throne-seat as memorial objects,
    and his return to Jetavana. It then describes Maniakkhika's later invitation and
    the Buddha's visit to Kalyani with five hundred bhikkhus, where he is hosted and
    then marks or consecrates places including Sumanakuta, Dighavapi, and the later
    Mahameghavanarama.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deva had formerly been a man in Nagadipa, had offered branches to paccekabuddhas
    for cleansing an alms-bowl, and was later reborn in a rajayatana-tree in Jetavana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha brought that deva to Lanka together with his tree for an advantage
    to the deva and for good to the land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master hovered in mid-air above a battlefield and caused darkness over
    the nagas, then comforted the terrified beings and spread light again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The nagas reverenced the Master's feet; he preached a doctrine that produced
    concord, and the two nagas gave up the throne to him.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After alighting and sitting down, the Lord was served celestial food and drink
    by naga-kings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Lord established eighty kotis of snake-spirits, described as dwellers
    in the ocean and on the mainland, in the three refuges and moral precepts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maniakkhika of Kalyani praised the Master's compassion, said they would have
    been consumed to ashes without his appearance, and asked him to come to his dwelling-country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lord consented by silence, planted the rajayatana-tree as a sacred memorial,
    and gave the tree and precious throne-seat to the naga-kings for homage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After exhorting the nagas, the compassionate saviour returned to Jetavana.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the third year after this, Maniakkhika invited the Sambuddha and the brotherhood;
    in the eighth year after buddhahood, the Master set out from Jetavana with five
    hundred bhikkhus to Kalyani.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Kalyani, under a gem-decked canopy at the later Kalyani-cetiya site, the
    Buddha and the bhikkhus sat on a precious throne-seat and were served celestial
    food by the naga-king and his following.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After preaching, the Teacher left visible traces of his footsteps on Sumanakuta,
    spent the day at the foot of the mountain, went to Dighavapi, meditated at a later
    cetiya site to consecrate it, and then went to the later Mahameghavanarama.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
