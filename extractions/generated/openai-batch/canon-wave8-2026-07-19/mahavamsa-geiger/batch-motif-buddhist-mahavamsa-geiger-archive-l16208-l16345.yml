canonical_text:
  quote: ''
  summary: Chapter XXXV recounts a sequence of rulers after Mahadathika. Amandagamani
    Abhaya performs Buddhist building works, donates a tank, commands non-killing,
    plants fruits, and gives fruit-filled almsbowls to the brotherhood. Kanirajanutissa
    kills his brother, reigns, and has sixty bhikkhus accused of high treason flung
    into caves. Culabhaya and then Sivali reign briefly before Ilanaga dethrones Sivali
    and raises the parasol of sovereignty. After conflict with the Lambakannas, Ilanaga
    is imprisoned; his queen sends their young son to the state elephant, whose grief
    leads it to break free, rescue the king, and send him away by ship. Ilanaga later
    gathers forces in Rohana; the state elephant returns to serve him. Hearing the
    Kapi-jataka from Mahapaduma, Ilanaga gains faith in the Bodhisatta and restores
    Buddhist structures and tanks before marching toward battle.
  language: English
  quote_policy: summarized
