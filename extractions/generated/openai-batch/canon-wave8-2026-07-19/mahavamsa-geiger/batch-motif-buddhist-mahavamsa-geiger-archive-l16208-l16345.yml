candidate_motifs:
- id: motif:1
  label: Merit-making royal patronage
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Amandagamani and Ilanaga build, donate, restore, or enlarge Buddhist institutions
    and waterworks; Amandagamani's almsgiving to the brotherhood is explicitly linked
    with a believing heart and works of merit.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The passage emphasizes acts of merit and religious patronage but does
    not narrate a supernatural reward for these acts within the supplied range.
- id: motif:2
  label: Royal ethical decree against killing
  taxonomy_refs:
  - royal_legitimacy
  basis: Amandagamani commands that killing not occur throughout the island and also
    plants fruit in many places.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the decree and planting acts without expanding them
    into a broader cosmic or legal theory.
- id: motif:3
  label: Contested royal succession through killing and dethronement
  taxonomy_refs:
  - royal_legitimacy
  basis: Kanirajanutissa kills his brother before reigning; later Ilanaga dethrones
    Sivali and raises the parasol of sovereignty.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The chronicle gives brief notices and does not explain all political factions
    or claims.
- id: motif:4
  label: Cave punishment of accused monastics
  taxonomy_refs:
  - cave
  basis: Sixty bhikkhus accused of high treason are ordered captive and flung into
    the Kanira caves.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The caves function here as places of punishment; the passage does not
    present them as initiation, refuge, or underworld descent.
- id: motif:5
  label: Rebel clan overturns a king after humiliating forced labor
  taxonomy_refs:
  - royal_legitimacy
  basis: Ilanaga punishes the Lambakannas by making them construct a road under candala
    overseers; they retaliate by imprisoning him and governing themselves.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage names the Lambakannas as an important clan only in a note;
    wider clan history is not supplied in the passage.
- id: motif:6
  label: Threatened royal child as an appeal to a loyal animal
  taxonomy_refs:
  - royal_legitimacy
  basis: The queen sends the young prince to the state elephant with a message saying
    the imprisoned king is the elephant's lord and that death by the elephant would
    be better for the child than death by enemies.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The child is not described as miraculous; the motif is the child's use
    in a crisis appeal rather than a sacred birth or wonder-child episode.
