canonical_text:
  quote: ''
  summary: 'At a festival ceremony, a thera preaches the true doctrine, producing
    widespread blessing: many people are converted, many attain stages on the path
    of salvation, and large numbers of bhikkhus and bhikkhunis attain arahantship.
    The chapter closes by exhorting those devoted to the Three Gems to strive for
    virtues, noting that a generous benefactor of mankind brings the highest blessing
    to the world.'
