canonical_text:
  quote: "“at Kusinara ... between the two sala-trees ... was the light of the world
    extinguished.”"
  summary: The passage recounts the Buddha’s passing at Kusinara, the gathering of
    monastics, social groups, and gods, Mahakassapa’s rites and decision to preserve
    the dhamma, the selection of eminent bhikkhus with Ananda’s necessary inclusion,
    the elders’ journey and preparations at Rajagaha, Ajatasattu’s construction of
    a council hall by the Sattapanni grotto, and Ananda’s exhortation to strive before
    the assembly.
  language: English
  quote_policy: quoted
