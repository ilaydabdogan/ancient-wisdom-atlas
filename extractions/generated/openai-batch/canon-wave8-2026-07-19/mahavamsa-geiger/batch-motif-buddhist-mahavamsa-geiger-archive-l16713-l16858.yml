  summary: The passage gives a royal succession in Lanka from Bhatikatissaka through
    Voharikatissa/Tissa. It emphasizes reign lengths, monastery construction and restoration,
    tanks, walls, thupas, Bodhi-tree structures, almsgiving, famine relief for monks,
    violent accessions, rebellion, tribute remission, and legal reform against bodily
    injury as punishment.
