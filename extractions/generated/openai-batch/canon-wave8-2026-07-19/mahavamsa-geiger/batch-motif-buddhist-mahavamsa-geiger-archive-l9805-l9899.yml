canonical_text:
  quote: ''
  summary: The thera stays in the Mahamegha-grove, preaches to the king, and then
    goes to Cetiya-mountain wishing a vihara to be founded there. The king follows
    with two queens, hears that the theras will spend the rainy season there, and
    begins construction of rock-cells. Maharittha and his brothers receive ordination
    and attain arahantship. The king later offers the finished vihara to the theras;
    the thera establishes boundaries and confers higher ordination. Sixty-two arahants
    reside on Cetiya-mountain during the rains, while gods and humans come reverently
    and gain merit.
  language: English
  quote_policy: summarized
