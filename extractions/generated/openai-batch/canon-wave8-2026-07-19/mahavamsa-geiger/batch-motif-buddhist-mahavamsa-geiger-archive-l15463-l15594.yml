canonical_text:
  quote: ''
  summary: The passage describes religious building works, the overthrow of King Khallatanaga
    by the commander Kammaharattaka, Vattagamani’s killing of the commander and assumption
    of rule, his adoption of Mahaculika and marriage to Anuladevi, rebellion by the
    brahman Tissa, invasion by seven Damilas, contest over the royal parasol, the
    king’s defeat and flight, his protection of royal family members, Somadevi’s descent
    from the car with a diadem-jewel, the king’s inability to carry the Buddha’s almsbowl,
    monastic aid from Mahatissa, a land grant to a vihara, fourteen years of refuge
    under Tanasiva, and the removal of Somadevi and the almsbowl by two Damilas.
  language: English
  quote_policy: summarized
