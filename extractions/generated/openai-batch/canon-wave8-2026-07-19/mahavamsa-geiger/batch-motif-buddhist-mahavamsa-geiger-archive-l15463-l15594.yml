candidate_motifs:
- id: motif:1
  label: Contested sovereignty through royal regalia
  taxonomy_refs:
  - royal_legitimacy
  basis: The rebel and Damilas demand the handing over of the parasol, and the note
    states that the parasol is the symbol of kingly rank.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage identifies the parasol’s function but does not describe a
    full coronation rite.
- id: motif:2
  label: Defeated king’s flight and exile
  taxonomy_refs:
  - departure
  basis: The king is defeated, flees in a car, hides in the forest, moves through
    several places, and lives fourteen years maintained by a subject.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The supplied passage does not narrate any later return.
- id: motif:3
  label: Dynastic protection during royal flight
  taxonomy_refs:
  - royal_legitimacy
  basis: Vattagamani takes Mahaculika as his son, makes Anuladevi queen, and later
    takes Anuladevi, Mahacula, and Mahanaga with him because they must be protected.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The text states protective intent but does not explicitly theorize dynastic
    preservation.
- id: motif:4
  label: Crisis vow to found a religious institution
  taxonomy_refs:
  - sacred_exchange
  basis: After being mocked in flight, the king thinks that if his wish is fulfilled
    he will build a vihara at that place.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The fulfillment of the vow is not narrated within the supplied passage.
- id: motif:5
  label: Monastic aid answered by royal endowment
  taxonomy_refs:
  - sacred_exchange
  basis: Mahatissa gives food to the king, and the king later records a land allotment
    to Mahatissa’s vihara for the brotherhood.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage presents the sequence directly, but it does not state a formal
    contractual exchange.
- id: motif:6
  label: Sacred object lost to invader
  taxonomy_refs:
  - sacred_theft
  basis: The king cannot take the almsbowl used by the Conqueror during flight, and
    another Damila later takes the almsbowl of the Master from Anuradhapura.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The text says the Damila took the bowl; it does not use the word theft
    or describe ritual consequences in this excerpt.
- id: motif:7
  label: Royal woman taken by enemy
  taxonomy_refs:
  - stolen_beloved
  basis: Somadevi descends from the flight-car with her consent to lighten it, and
    later one Damila, moved by passion for her, makes her his own and returns to the
    further coast.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: low
  cautions: The passage does not call Somadevi a beloved, and her consent applies
    only to descending from the car, not to the Damila’s later action.
- id: motif:8
  label: Prophecy-triggered rebellion
  taxonomy_refs: []
  basis: Tissa listens to a brahman’s prophecy and becomes a rebel whose following
    grows.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The content and authority of the prophecy are not given in the supplied
    passage.
