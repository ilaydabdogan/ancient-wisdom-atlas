- id: obs:8
  text: Kuvanna, a yakkhini, is seated at the foot of a tree spinning in the appearance
    of a woman-hermit near a pond.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The follower bathes and drinks at the pond and takes lotus shoots and water
