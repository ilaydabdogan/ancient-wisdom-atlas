- id: obs:4
  text: The lotus-coloured god comes quickly to Lanka, sits at the foot of a tree,
    and appears in the guise of a wandering ascetic.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vijaya's followers ask the ascetic what island it is; he answers that it is
    Lanka, says there are no men there and that no dangers will arise, sprinkles water
    on them from his water-vessel, winds thread about their hands, and vanishes through
    the air.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A yakkhini attendant of Kuvanna appears in the form of a bitch.
  category: attribute
  evidence_refs:
