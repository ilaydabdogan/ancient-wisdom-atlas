  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Because of the magic thread, Kuvanna cannot devour the man; she seizes him
    and hurls him into a chasm, and then hurls all seven hundred followers there one
    by one.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the followers do not return, Vijaya arms himself with five weapons and
