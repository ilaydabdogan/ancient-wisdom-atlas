canonical_text:
  quote: ''
  summary: At the Buddha's nibbana, he instructs Sakka to protect Vijaya, his followers,
    and Lanka because his religion will be established there. Sakka delegates the
    guardianship to a lotus-coloured god, who appears in Lanka as a wandering ascetic
    and gives Vijaya's followers protective water and thread. A yakkhini attendant
    appears as a bitch and leads one follower to Kuvanna, a yakkhini disguised as
    a woman-hermit by a pond. Kuvanna captures the followers and throws them into
    a chasm, but Vijaya subdues her, makes her swear an oath, and compels her to return
    his men and provide food. After receiving first portions of the meal, Kuvanna
    takes the form of a young maiden, becomes Vijaya's spouse, and reveals a nearby
    yakkha-city wedding festival while planning to bestow kingship on him.
  language: English
  quote_policy: summarized
