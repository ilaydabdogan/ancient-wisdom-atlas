literal_observations:
- id: obs:1
  text: A thupa is defined as an edifice serving as a relic receptacle or monument,
    with a hemispherical or bell-shaped form, a base of three concentric stories,
    a cubical tee, a spire, and an interior relic chamber below the tee.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cetiya is defined as a general term for sanctuary; the passage states that
    a tree can be a cetiya and that the term is often used in the Mahavamsa as a synonym
    for thupa.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes thupaghara or cetiyaghara as a house of the thupa or
    cetiya, notes that some smaller thupas could have a roof or temple built over
    them, and distinguishes bodhighara as building round rather than over the sacred
    tree.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tipitaka is defined as the collective name for Buddhist canonical scriptures,
    divided into Vinaya-pitaka, Sutta-pitaka or Dhamma, and Abhidhamma-pitaka.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Upasampada is defined as the solemn ordination or higher consecration of a
    monk who had been a novice until that time, performed by a chapter of the order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Uposatha is defined as a Buddhist holy day for priests and laymen, occurring
    four times a month on full moon, new moon, and the eighth days after each; two
    of these days include recitation of Patimokkha precepts and confession of faults
    by members of the order.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Uposathagara or uposathaghara is defined as a monastery building used for
    uposatha ceremonies.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Vedi or vedika is defined as terrace or altar, including a stone terrace around
