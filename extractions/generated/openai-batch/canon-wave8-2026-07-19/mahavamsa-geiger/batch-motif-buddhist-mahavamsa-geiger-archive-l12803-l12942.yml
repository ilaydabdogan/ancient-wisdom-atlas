canonical_text:
  quote: ''
  summary: Bhalluka presses on to battle and camps near Kolambahalaka. Dutthagamani
    marches out with his forces, mounted on Kandula, while Phussadeva follows as chief
    archer. In battle Kandula retreats to the place Phussadeva identifies as the place
    of victory, near the shrine of the city guardian god. Bhalluka mocks and shoots
    at the king, but Phussadeva kills him with arrows. Phussadeva then cuts his own
    ear for having touched the king's earring with an arrow, and the king rewards
    him. After victory, the king grieves over the destruction of many beings, and
    arahants from Piyangudipa send eight arahants through the air to comfort him and
    interpret the karmic weight of the slaughter.
  language: English
  quote_policy: summarized
