canonical_text:
  quote: "“If we behold the relics we behold the Conqueror.”"
  summary: The passage narrates the search for Buddha relics for a planned thupa,
    Sumana’s journey to obtain relics from King Dhammasoka and Sakka, and the royal
    procession in which miraculous signs accompany the relics to the future shrine
    site.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The great thera tells the king that they have no object of worship, and says
    that beholding the relics is equivalent to beholding the Conqueror.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king says he intends to build a thupa and asks that relics be discovered;
    Sumana instructs him to adorn the city and road, take uposatha-vows, and go in
    procession to Mahanaga-park.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The thera sends the samanera Sumana to King Dhammasoka for Buddha relics and
    the Master’s alms-bowl, and then to Sakka for the right collar-bone relic.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sumana finds Dhammasoka at the foot of a sala-tree while the king honours
    the sacred Bodhi-tree during the Kattika-festival.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sumana receives an alms-bowl full of relics from Dhammasoka, sets it down
    on the Himalaya, then receives the right collar-bone relic from Sakka and returns
    with both to the thera.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The king goes to Mahanaga-park in the evening at the head of royal troops,
    as previously instructed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The thera places all the relics on the mountain, after which Missaka-mountain
    is called Cetiya-mountain, and he takes the collar-bone relic to the appointed
    place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king thinks that if the relic is genuine his parasol will bow, his elephant
    will kneel, and the relic-urn will descend upon his head; the passage says these
    things occur.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king places the urn on the elephant; the elephant trumpets, the earth
    quakes, and the elephant proceeds through the city gates to the future Thuparama
    area.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The future thupa site is covered with flowering kadamba-plants and adari-creepers,
    and the king clears and adorns the holy place protected by gods.
  category: setting
  evidence_refs:
  - ev:9
