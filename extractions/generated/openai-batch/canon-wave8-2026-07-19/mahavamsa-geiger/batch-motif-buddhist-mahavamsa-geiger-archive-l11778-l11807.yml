canonical_text:
  quote: how can I lie with outstretched limbs ?
  summary: A note interprets Gotama's receiving of a boy as willingness to become
    his future teacher. In the narrative, Gamani lies on his bed with hands and feet
    drawn in. The queen caresses him and asks why he does not stretch out; Gamani
    answers by referring to the Damilas beyond the Ganga and the Gotha-ocean on this
    side. The king hears this and remains silent. Gamani grows to sixteen, praised
    for vigor, renown, intelligence, majesty, and might. The passage closes with a
    reflection that beings attain desired rebirth through works of merit and with
    the chapter title, 'The Birth of Prince Gamani.'
  language: English
  quote_policy: quoted
