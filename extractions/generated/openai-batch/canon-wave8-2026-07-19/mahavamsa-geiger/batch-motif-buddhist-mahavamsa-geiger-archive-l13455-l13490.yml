canonical_text:
  quote: ''
  summary: A note locates Uruvela near the mouth of the Kala-oya. In the main passage,
    four splendid gems are found in a cave opening on the Pelivapikagama tank; a hunter
    with dogs sees them and reports them to the king. The king hears that bricks and
    other treasures have appeared for the Great Thupa, rewards the informants, appoints
    watchers, and has the treasures brought to him. The passage closes with a moral
    statement that merit performed with believing heart brings many happy results,
    and identifies the chapter as concerning the wherewithal to build the Great Thupa.
  language: English
