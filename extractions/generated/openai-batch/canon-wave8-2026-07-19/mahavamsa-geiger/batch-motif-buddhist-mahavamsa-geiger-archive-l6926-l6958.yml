  quote: ''
  summary: A note explains shaven hair as a sign of loss of freedom. The narrative
    describes people being sent by ship upon the sea; men, women, and children land
    separately on islands. The children’s and women’s islands receive names. Vijaya
    lands at Supparaka, leaves again because of danger from violent followers, and
    then lands in Lanka at Tambapanni on the day the Tathagata passes into nibbana
    between two sala-trees.
