canonical_text:
  quote: ''
  summary: 'The passage recounts violent royal successions and acts of patronage in
    Anuradhapura: Ilanaga defeats and punishes the Lambakannas, Candamukha Siva and
    Damiladevi make religious donations, Yasalalakatissa kills Candamukha Siva, the
    lookalike gate-watchman Subha usurps Yasalalakatissa, and Vasabha escapes a prophecy-driven
    purge, receives aid, rebels, defeats Subharaja, and takes the throne.'
  language: English
  quote_policy: summarized
