  text: The king orders the Lambakannas yoked to his car and later commands their
    beheading at the palace threshold; his mother’s admonition changes the punishment
    to cutting off noses and toes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tract where the elephant had stayed is allotted to the elephant and is called
