canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction assessing Southern Buddhist traditions
    about the Councils. It reports chronological claims about a Council under Asoka,
    argues that genuine historical reminiscence underlies the Council traditions while
    later details entered them, identifies a historical kernel for the First Council
    as a post-Buddha assembly to establish Order rules, and discusses Purana, Ananda,
    Channa, Subhadda, and the Mahaparinibbana-sutta in relation to the First Council
    narrative.
  language: English
  quote_policy: summarized
