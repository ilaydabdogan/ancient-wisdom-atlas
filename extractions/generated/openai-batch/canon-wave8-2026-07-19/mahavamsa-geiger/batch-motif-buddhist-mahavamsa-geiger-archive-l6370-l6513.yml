canonical_text:
  quote: "“he who lets son or daughter enter the religious order is a kinsman of the
    religion”"
  summary: King Dhammasoka asks whether his gifts make him a kinsman of the religion.
    Moggaliputta says true religious kinship comes from allowing a son or daughter
    to enter the order. Mahinda and Samghamitta consent to ordination and are later
    described as lights of the doctrine for Lanka. A later episode recounts the wood-nymph
    Kunti’s sons Tissa and Sumitta becoming arahants; Tissa, dying from poison, refuses
    improper remedies, exhorts Sumitta, levitates, enters nibbana through fire-meditation,
    and his body is consumed except for the bones.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The king sees viharas adorned for a festival and asks the brethren whether
    anyone’s generosity toward the Blessed One’s doctrine has been as great as his.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thera Moggaliputta answers that even during the Blessed One’s lifetime there
    was no generous giver like the king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moggaliputta perceives the destiny of the king’s son Mahinda and daughter
    Samghamitta and foresees the progress of the doctrine arising from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Moggaliputta distinguishes a giver of wealth from a kinsman of the religion,
    saying that one who lets a son or daughter enter the order is a kinsman of the
    religion and also a giver of gifts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The king asks Mahinda and Samghamitta whether they wish to receive the pabbajja,
    and they say they would enter the order that same day if the king wishes it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Although the king had wished to make Mahinda prince-regent, he consents to
    Mahinda’s ordination, regarding it as the greater dignity, and he permits Samghamitta
    to be ordained as well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Mahinda is twenty years old and Samghamitta eighteen; Mahinda receives pabbajja
    and upasampada on the same day, while Samghamitta receives pabbajja and is placed
    under a teacher.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Mahinda’s master is Moggaliputta; Mahadeva confers his pabbajja, Majjhantika
    pronounces the ceremonial words, and Mahinda reaches arahantship with special
    kinds of knowledge at the place of upasampada.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Samghamitta’s directress is Dhammapala and her teacher is Ayupala; in time
    she becomes free from the asavas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Mahinda and Samghamitta are called two lights of the doctrine who bring blessing
