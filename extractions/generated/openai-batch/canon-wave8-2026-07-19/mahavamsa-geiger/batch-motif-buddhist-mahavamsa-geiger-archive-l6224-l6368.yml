canonical_text:
  quote: ''
  summary: The passage recounts how King Asoka teaches Prince Tissa about the fear
    of death, prompting Tissa toward faith and ordination. Tissa then sees the thera
    Mahadhammarakkhita attended by a cobra under a tree and later performing marvels
    involving flight, water, and suspended garments; Tissa and many others receive
    ordination. The passage also describes the completion of viharas and cetiyas,
    Asoka's empire-wide festival of offerings, and a vast monastic assembly that performs
    the miracle called the unveiling of the world to convert the king, who is contrasted
    as formerly Candasoka and later Dhammasoka.
  language: English
  quote_policy: summarized
