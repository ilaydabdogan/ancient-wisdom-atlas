canonical_text:
  quote: ''
  summary: A thera in trance does not answer a greeting until the brotherhood calls
    him forth. Siggava, Candavajji, and followers are ordained by Sonaka and attain
    learning and supernormal powers. Siggava repeatedly visits the house of the brahman
    Moggali, whose household becomes faithful. Siggava later engages the young learned
    brahman Tissa through a vanished-seat episode and a question from Buddhist doctrine,
    leading Tissa to ordination, meditation, scriptural study, insight, supernormal
    powers, and renown as a thera. The passage ends with a prince named Tissa hunting
    and seeing joyful gazelles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bhikkhus say that those deep in trance do not reply and come forth at
    a call from the master or brotherhood, at the end of the allotted time, or at
    the approach of death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brotherhood gives a call, and the thera awakens from trance and goes to
    the youths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Siggava, Candavajji, and five hundred followers receive pabbajja and upasampada
    ordination from the thera Sonaka, study the three pitakas, and attain six supernormal
    powers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Siggava frequents Moggali's house for seven years; after a later exchange,
    Moggali becomes full of faith, gives continual alms, offers hospitality, and his
    household gradually becomes believers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sixteen, young Tissa has mastered the three Vedas; Siggava makes all seats
    vanish except Tissa's seat, and the household prepares that seat for the thera.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tissa becomes angry when he sees the thera on his seat; Siggava questions
    him about manta, explains difficult Vedic passages, poses a Buddhist doctrinal
    question, and says the Buddha's manta is imparted only to one who wears the monastic
    robe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: With his parents' leave, Tissa is ordained for the sake of the manta, is taught
    meditation subjects, attains sotapatti, studies Sutta and Abhidhamma from Candavajji,
    receives upasampada from Siggava, learns Vinaya, gains insight and six supernormal
    powers, and becomes renowned as a thera.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: A prince named Tissa, while hunting, sees gazelles sporting joyously in the
    wild.
  category: action
  evidence_refs:
  - ev:9
