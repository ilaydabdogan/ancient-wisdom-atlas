canonical_text:
  quote: ''
  summary: At the end of the king's life, his brother Tissa creates an apparent completion
    of the unfinished thupa. The sick king honors the shrine, is surrounded by bhikkhus,
    receives a miraculous deathbed visit and counsel from the thera Theraputtabhaya,
    reflects on impermanence and merit, and orders his meritorious deeds to be read
    aloud.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the chatta and plaster-work on the cetiya are finished, the king becomes
    mortally sick and summons his younger brother Tissa from Dighavapi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king instructs Tissa to complete the unfinished work of the thupa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because of the king's weakness, Tissa has the cetiya covered with white cloth
    and painted with a vedika, rows of filled vases, and a five-finger ornament.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tissa has a bamboo-reed chatta made and places sun and moon images on the
    upper vedika, then declares the remaining work completed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king is carried on a palanquin, passes around the cetiya toward the left,
    pays homage at the south entrance, and lies on a couch spread on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: From his couch the king sees the Great Thupa and the Lohapasada and becomes
    glad while surrounded by bhikkhus.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ninety-six kotis of bhikkhus are present and recite in groups.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king notices the absence of the thera Theraputtabhaya and thinks of his
    own death-struggle as a defeat in which the former warrior does not come to help
    him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Theraputtabhaya knows the king's thought, comes through the air by miraculous
    power from the Panjali-mountain area with five hundred bhikkhus who had overcome
    the asavas, and stands among those around the king.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king tells the thera that he formerly fought with the ten great warriors
    at his side but now enters the battle with death alone and cannot conquer the
    foe death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The thera tells the king not to fear and teaches that death cannot be conquered
    without conquering sin, that all conditioned existence perishes, and that mortality
    overcomes even the Buddhas.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The thera reminds the king that in his last mortal existence he saw the world
    of gods, renounced heavenly bliss, returned to this world, performed many works
    of merit, and used sovereignty to bring glory to the doctrine.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The king commands that the book of meritorious deeds be brought, and a scribe
    reads aloud a list of religious constructions, offerings, and famine-time gifts.
  category: action
  evidence_refs:
  - ev:9
