canonical_text:
  quote: ''
  summary: The passage recounts the succession of several rulers in Lanka, emphasizing
    monastery-building by Mahasiva and Suratissa, conquest by Sena and Guttaka, Asela's
    rule, and Elara's long reign. Elara is portrayed as dispensing even justice through
    a bell for petitioners, including animals, submitting himself to accountability
    after damaging a thupa, and bringing about due-season rain through a fast and
    divine mediation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mahasiva reigned for ten years after Uttiya's death, protected the pious,
    was devoted to the thera Bhaddasala, and built the Nagarangana vihara in the eastern
    quarter of the city.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Suratissa reigned for ten years after Mahasiva, is described as mindful of
    meritorious works, and built many named viharas, totaling five hundred in Lanka
    before and during his reign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sena and Guttaka, described as two Damilas and sons of a freighter who brought
    horses, conquered Suratissa and ruled together for twenty-two years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Asela, a son of Mutasiva and ninth among his brothers of the same mother,
    overpowered Sena and Guttaka and ruled for ten years in Anuradhapura.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elara, a Damila of noble descent from the Cola-country, overpowered Asela
    and ruled for forty-four years with even justice toward friend and foe in legal
    disputes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Elara had a bell with a long rope hung at the head of his bed so that those
    seeking legal judgment could ring it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Elara had one son and one daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Elara's son accidentally killed a young calf lying on the road with its mother
    by driving a car wheel over its neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother cow dragged at the bell in distress, and Elara caused his son's
    head to be severed with the same wheel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a snake devoured the young of a bird on a palm-tree, the mother bird
