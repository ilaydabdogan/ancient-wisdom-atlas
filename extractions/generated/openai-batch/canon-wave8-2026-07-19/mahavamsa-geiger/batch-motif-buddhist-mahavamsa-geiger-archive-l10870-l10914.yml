canonical_text:
  quote: ''
  summary: The passage recounts that the great Bodhi-tree was planted in the Mahameghavanarama
    during king Dhammasoka's reign. After Asamdhimitta's death, Tissarakkha became
    queen and, believing the king worshipped the Bodhi-tree at her expense, caused
    it to perish by means of a mandu-thorn; Dhammasoka later died. The passage then
    turns to king Devanampiyatissa, who asks the thera who converted the island where
    to obtain relics for thupas. The thera identifies relics brought by Sumana, associated
    with the bowl of the Sambuddha and placed on Cetiya-mountain, and tells the king
    to have them carried on an elephant. The king brings the relics and founds viharas
    one yojana apart. A footnote compares the mandu-thorn with a Jataka account in
    which a mango kernel loses germinating power when pierced by such a thorn.
  language: English
  quote_policy: summarized
