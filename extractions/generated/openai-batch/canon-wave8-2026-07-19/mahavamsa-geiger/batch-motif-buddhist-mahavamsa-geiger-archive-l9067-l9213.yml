canonical_text:
  quote: ''
  summary: Mahinda identifies and consecrates several sites in the royal park by scattering
    flowers, after which the earth quakes and he explains the future monastic or stupa
    function of each place. A mango kernel planted by the king grows immediately into
    a fruiting tree. The passage then recounts a precedent from the age of Kakusandha
    Buddha, who came through the air with disciples to end a demon-caused pestilence
    in the island and draw the people to him.
  language: English
  quote_policy: summarized
