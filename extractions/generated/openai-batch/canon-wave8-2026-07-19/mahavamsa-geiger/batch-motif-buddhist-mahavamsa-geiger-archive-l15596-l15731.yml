  quote: ''
  summary: The passage recounts a sequence of five Damila kings who rule through violent
    succession, the rise of King Abhaya through conflict and alliance with ministers
    and Buddhist theras, the reconciliation of alienated ministers, the defeat of
    Dathika at Anuradhapura, and the founding or naming of Buddhist monasteries including
    Abhayagiri-vihara and Somarama.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five Damila kings are listed in sequence, with several rulers killing their
    predecessors and holding Anuradhapura for specified periods totaling fourteen
    years and seven months.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anuladevi reports that the wife of Tanasiva struck her basket with her foot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tanasiva comes out grasping a bow, and the king hastens out with two boys
    and his consort.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king sets an arrow to his bow, strikes Siva as he comes on, proclaims
    his name, and gathers followers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king obtains eight famous warriors as ministers and prepares equipment
    for war.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king seeks the thera Mahatissa of Kupikkala and commands a festival in
    honor of the Buddha at Acchagalla-vihara.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The minister Kapisisa is seen by the king sitting by the road after sweeping
    the Akasa-cetiya, and the king kills him because he had not prostrated himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The other seven ministers leave the king, are robbed on the road, and take
    refuge in Hambugallaka-vihara with the thera Tissa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thera Tissa provides the dispossessed ministers with clothing, sugar, oil,
    and rice from his alms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ministers are asked whether the Buddha's doctrine can be furthered with
    the Damilas or with the king, and they answer that it can be furthered by the
    king.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The theras Tissa and Mahatissa bring the ministers back to the king and reconcile
    the two sides.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After reaching Anuradhapura, the king kills the Damila Dathika and assumes
    the government.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The king destroys the arama of the niganthas and builds a vihara with twelve
    cells there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The king builds Abhayagiri-vihara, gives it to the thera Mahatissa, and the
