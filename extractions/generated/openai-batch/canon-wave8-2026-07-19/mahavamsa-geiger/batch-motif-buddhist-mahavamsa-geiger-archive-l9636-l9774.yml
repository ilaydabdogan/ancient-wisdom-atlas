canonical_text:
  quote: The great earth quaked when the fixing of the boundaries was completed.
  summary: The passage recounts how the king and the thera mark and establish monastic
    boundaries, followed by repeated preaching and mass conversions in the Nandana-grove.
    It then describes the naming of the grove as Jotivana and the king's construction
    of monastic buildings, parivenas, tanks, and related structures for the thera
    and the Mahavihara.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The king urges that boundaries be established quickly, including the city,
    and the thera tells the king to mark out the course of the boundary himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After eating in the king's house, the thera preaches the Anamatagga-discourse
    in the Nandana-grove and gives a thousand persons to drink of the draught of immortality.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king commands the drum to be beaten and the city, road, and vihara to
    be adorned, then comes in a royal procession with ministers, women of the harem,
    chariots, troops, and riding beasts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king pays respect to the theras and ploughs a circular furrow beginning
    near the ford on the Kadamba-river and ending when he again reaches the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The great thera assigns boundary marks on the king's furrow, assigns boundaries
    for thirty-two malakas and the Thuparama, fixes inner boundary marks, and completes
    all boundaries on one day; the earth quakes when this is completed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the fifth, sixth, and seventh days, the thera preaches named suttas in
    the Nandana-grove or garden, brings a thousand persons to conversion each time,
    and is said to have brought eight thousand five hundred persons to conversion
    in seven days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Nandana-grove is called Jotivana because the holy one made the true doctrine
    shine forth there.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king has a pasada built for the thera, dries bricks of clay with fire,
    and sets up a building for the great Bodhi-tree, the Lohapasada, a salaka-house,
    a refectory, many parivenas, bathing-tanks, and buildings for repose.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Several parivenas are named after places connected with the thera's bathing-tank,
    walking, meditation, seated posture, and visits by hosts of gods who sat at his
    feet.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Dighasandana, commander of the king's troops, builds a little pasada for the
    thera with eight great pillars.
  category: action
  evidence_refs:
  - ev:9
