canonical_text:
  quote: ''
  summary: The passage closes a chapter by describing the Buddha’s bodily relics as
    bestowing salvation and bliss after his nibbana, then begins the account of the
    mission to obtain the great Bodhi-tree and the bhikkhuni Samghamitta for Lanka.
    The Lankan king sends his nephew-minister Arittha to Dhammasoka/Asoka. Queen Anula
    and groups of women await ordination. Samghamitta agrees to depart despite Asoka’s
    grief. Asoka consults monks about the tree, arranges ritual preparations, receives
    a miraculous gold vase made by Vissakamma, and approaches the adorned Bodhi-tree
    with armies, monks, princes, music, flowers, and folded hands.
  language: English
