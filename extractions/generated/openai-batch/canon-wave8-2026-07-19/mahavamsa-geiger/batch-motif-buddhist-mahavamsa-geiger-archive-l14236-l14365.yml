canonical_text:
  quote: ''
  summary: 'The passage describes part of the Great Thupa relic-chamber program: depictions
    of events from the Buddha''s last days, Jataka scenes, the Vessantarajataka, and
    the Buddha-life sequence from Tusita-heaven to the Bodhi-throne; celestial guardians
    and devas arranged in the four quarters; jeweled, golden, and luminous ornamentation;
    Indagutta''s supervision of the work; and a closing statement commending homage
    to the Buddha and his relics.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists depictions or commemorated episodes from the Buddha's final
    period, including the pork dish, gold-coloured garments, pure water, Parinibbana,
    lamentation by gods and men, revering of the feet by a thera, burning and quenching
    of the body-fire, funeral rites, and Dona's distribution of relics.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king placed many Jataka representations, commanded the Vessantarajataka
    to be fully depicted, and also commanded depiction of the sequence from the descent
    from Tusita-heaven to the Bodhi-throne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the four quarters of the heaven stood figures of the four Great Kings,
    thirty-three gods, thirty-two celestial maidens, and twenty-eight chiefs of the
    yakkhas.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The celestial figures above are described as raising folded hands, dancing,
    playing instruments, carrying mirrors, flowers, branches, lotus-blossoms, swords,
    and pitchers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chamber decoration includes vases filled with flowers, rows of gem arches,
    rows of dhammacakkas, pitchers filled with fragrant oil and lit wicks, a crystal
    arch with gems, heaps of gold and precious materials, zig-zag or lightning-like
    wall lines, and massive wrought-gold figures.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The thera Indagutta, described as wise and gifted with six supernormal faculties,
    directed the work.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The work was completed without hindrance by the wondrous power of the king,
