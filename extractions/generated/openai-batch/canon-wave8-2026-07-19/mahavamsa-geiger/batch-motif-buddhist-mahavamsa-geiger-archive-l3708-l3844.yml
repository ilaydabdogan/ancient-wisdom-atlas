  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fa-hian and Hiuen-thsang both mention the First Council, but the passage reports
    different participant numbers and different levels of specificity about sacred
    books and Abhidharma redaction.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Second Council is said to occur 100 years after the Buddha's death and
    to be brought about by the ten points of the Vajji monks of Vesali, which are
    characterized as a relaxation of monastic discipline.
  category: sequence
  evidence_refs:
  - ev:5
