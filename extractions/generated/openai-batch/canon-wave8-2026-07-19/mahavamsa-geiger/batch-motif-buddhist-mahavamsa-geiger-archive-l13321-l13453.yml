canonical_text:
  quote: ''
  summary: King Gamani resolves to build the Great Thupa but worries that taxation
    would burden the people. A devata notices his thought, Sakka commands Vissakamma
    to prepare bricks, and a huntsman is guided by a deity in iguana form to discover
    them. Gold, copper, gems, silver, pearls, and coral appear in various places around
    the city and are reported to the king. In the silver episode, a merchant offers
    bread-fruit to theras free from the asavas, and one thera opens a path by which
    the merchant sees the silver cave.
  language: English
  quote_policy: summarized
