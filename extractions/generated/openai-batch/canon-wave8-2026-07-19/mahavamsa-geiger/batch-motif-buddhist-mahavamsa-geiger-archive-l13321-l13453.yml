- id: obs:1
  text: The king spends a large sum on gifts for the great Bodhi-tree, sees the stone
    pillar at the place of the future thupa, remembers an old tradition, and resolves
    to build the Great Thupa.
  category: sequence
  evidence_refs:
  - ev:1
