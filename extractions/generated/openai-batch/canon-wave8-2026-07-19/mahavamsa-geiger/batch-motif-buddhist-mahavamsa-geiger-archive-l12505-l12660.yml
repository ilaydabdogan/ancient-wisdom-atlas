canonical_text:
  quote: ''
  summary: Dutthagamani prepares for a campaign by placing a relic in his spear, taking
    bhikkhus with him for blessing and protection, and marching with his army and
    elephant Kandula. He conquers a series of Damila opponents, declares that his
    toil is not for sovereignty but to establish the doctrine of the Sambuddha, and
    the soldiers' armour takes the colour of fire. The enemy withdraws into Vijitanagara.
    The king tests Nandhimitta against Kandula, then attacks the fortified city. Kandula
    batters an iron gate, is wounded by red-hot iron and molten pitch, enters a pool
    of water, is urged back to the gate, rises again, and is tended and encouraged
    by the king.
  language: English
  quote_policy: summarized
