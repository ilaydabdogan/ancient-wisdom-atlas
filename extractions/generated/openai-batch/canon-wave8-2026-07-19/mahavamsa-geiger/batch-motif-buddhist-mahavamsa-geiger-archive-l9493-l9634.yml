candidate_motifs:
- id: motif:1
  label: Sacred tree branch transferred in a vessel and ritually planted
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage centers on a Bodhi-branch marked, separated, transported in a
    golden vase, handed through Buddha and king, and planted in a garden.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The taxonomy label is interpretive; the passage itself describes a Bodhi-branch
    and planting, not an abstract axis mundi.
- id: motif:2
  label: Sacred site validated by repeated Buddha visits
  taxonomy_refs:
  - world_center
  basis: The passage says the place was visited by four Buddhas and identifies it
    as the future site of a major thupa with relics.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage localizes sacred authority at one place; mapping this to 'world_center'
    is approximate and should be reviewed.
- id: motif:3
  label: Relic installation and future stupa foundation
  taxonomy_refs:
  - sacred_exchange
  basis: A rain-cloak is given as a relic for homage, and a future thupa with a chamber
    for bodily relics is foretold.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage emphasizes relic veneration and site foundation; 'sacred_exchange'
    is used only cautiously because no transactional exchange is explicit.
- id: motif:4
  label: Prophecy of royal descendant as religious builder
  taxonomy_refs:
  - royal_legitimacy
  basis: The thera tells the king not to build the thupa himself and names a future
    royal succession culminating in Dutthagamani, who will build it.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif concerns legitimating a later royal builder through prophecy;
    broader dynastic history is not inferred beyond the passage.
- id: motif:5
  label: Aerial departure of enlightened figure
  taxonomy_refs:
  - ascent
  - return
  basis: The Conqueror rises into the air with the brotherhood and returns to Jambudipa
    in two narrated visit sequences.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents this as travel by wondrous power; 'ascent' and 'return'
    are broad motif-family labels.
- id: motif:6
  label: Doctrine established through bounded ritual space
  taxonomy_refs: []
  basis: Mahinda says the doctrine does not yet stand and will stand when boundaries
    are established for the uposatha-ceremony and other religious acts.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No available taxonomy reference precisely matches this institutional-ritual
    motif.
