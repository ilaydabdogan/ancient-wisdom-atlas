canonical_text:
  quote: "“Thus was this place, O king, visited by four Buddhas.”"
  summary: The passage recounts a miraculous transfer and planting of a Bodhi-branch,
    preaching and conversions at named sacred sites, Gotama Buddha’s earlier visits
    to Lanka, the designation of a future stupa site with relics, a prophecy that
    a descendant of the king will build the stupa, the king’s inscription of the prophecy
    on a stone pillar, and Mahinda’s acceptance of the Mahamegha-grove followed by
    further preaching and discussion of how the doctrine will be established.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A theri of wondrous power marks the south branch of a tree with red arsenic,
    separates the Bodhi-branch, places it in a golden vase, and brings it with five
    hundred bhikkhunis while surrounded by devatas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhi-branch in its golden vase is placed in the outstretched right hand
    of the Sambuddha, received by the Tathagata, given to king Jayanta, and planted
    by that king in the Mahasagara-garden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Buddha preaches in the Asokamalaka and at a place where former Buddhas
    had sat, and thousands of living beings are converted or attain the fruit of the
    path.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Buddha gives his rain-cloak as a relic, leaves a bhikkhuni and her following,
    leaves Sabbananda with a thousand bhikkhus, exhorts the people, rises into the
    air with the brotherhood, and returns to Jambudipa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gotama is described as the fourth Conqueror in the present age; on visits
    to Lanka he drives forth yakkhas, subdues nagas, and later addresses devatas and
    nagas because no human beings are present in the island.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The place is said to have been visited by four Buddhas and is identified as
    the future location of a thupa containing a relic-chamber for a dona of bodily
    relics.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The king offers to build the thupa, but the thera says the king has other
    tasks and that a descendant, Dutthagamani, will build it after a named royal succession.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: After hearing the thera’s words, the monarch sets up a stone pillar inscribed
    with the sayings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mahinda accepts the Mahamegha-grove, also called the Tissarama, and the earth
    quakes in eight places.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mahinda preaches two named suttas in the Nandana-grove and leads one thousand
    persons each time to the fruit of the path or conversion.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The king asks whether the doctrine of the Conqueror stands, and Mahinda replies
    that it will stand when boundaries for the uposatha-ceremony and other religious
    acts are established according to the Conqueror’s command.
  category: speech
  evidence_refs:
  - ev:11
