  text: Mahinda is described as a great thera of lofty wisdom who had been a monk
    for twelve years.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mahinda was charged by his teacher and the brotherhood to convert Lanka, and
    he considered the proper time, noting that King Mutasiva was old and that his
    son must become king.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahinda bade farewell to his teacher and the brotherhood, asked the king’s
    leave, and took four theras and the samanera Sumana with him.
  category: action
  evidence_refs:
  - ev:3
