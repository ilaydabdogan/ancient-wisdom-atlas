  text: Sumana is identified as Samghamitta’s son and is described as miraculously
    gifted and mighty in the six supernormal powers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mahinda went to Dakkhinagiri to confer the grace of his preaching on his kinsfolk,
    and six months passed while he was there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Vedisagiri, the city of his mother Devi, Mahinda visited her; she welcomed
    him and his companions with food prepared by herself and led him to the Vedisagiri
    vihara.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage recounts that Asoka married Devi, who bore Mahinda and later Samghamitta.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mahinda perceived that the time had come when Devanampiyatissa would take
    part in a great festival of consecration, hear of the splendour of the three things
    from envoys, and climb Missaka-mountain on the uposatha-day of Jettha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Indra sought out Mahinda and told him to set forth to convert Lanka, saying
