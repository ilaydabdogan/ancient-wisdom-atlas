canonical_text:
  quote: ''
  summary: 'The passage introduces Mahinda’s mission to Lanka: he waits for the proper
    royal and ritual moment, visits his kin and mother Devi, receives Indra’s urging
    and assurance of aid, gathers monastic and lay companions, rises through the air,
    and alights on Missaka-mountain, where he is praised as bringing salvation to
    Lanka.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prefatory note says the theras had already attained arahantship and nibbana
    but delayed passing into nibbana so that they could show the world the way to
    salvation, following the Buddha’s example.
  category: action
  evidence_refs:
  - ev:1
