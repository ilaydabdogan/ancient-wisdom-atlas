canonical_text:
  quote: ''
  summary: The passage narrates a Buddha's reception by a king and island people,
    the offering and acceptance of the Mahatitthaka-garden, miraculous signs, preaching
    and mass attainment, the bringing and planting of a Bodhi-tree branch, visits
    to future sacred sites, and aerial departure. It then begins a parallel account
    of Lord Konagamana, who comes through the air to drought-stricken Varadipa with
    disciples, ends the drought, is seen shining on a mountain, and is hosted by King
    Samiddha and the people.
  language: English
  quote_policy: summarized
