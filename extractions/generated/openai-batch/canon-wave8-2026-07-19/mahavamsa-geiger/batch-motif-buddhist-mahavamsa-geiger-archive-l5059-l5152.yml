    as the seat of the monk who recites.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the second day of the second month of the rainy season, the bhikkhus meet
    in a splendid hall; a fitting place is left vacant for Ananda, and the arahants
    sit according to rank.
  category: setting
  evidence_refs:
