canonical_text:
  quote: ''
  summary: 'The passage narrates the First Council: the assembled theras reserve a
    seat for Ananda, Ananda demonstrates arahantship by a miraculous arrival, Upali
    and Ananda recite and expound the vinaya and dhamma under Mahakassapa''s questioning,
    the canon is compiled over seven months, cosmic signs appear, and the theras later
    enter nibbana.'
  language: English
  quote_policy: summarized
