candidate_motifs:
- id: motif:1
  label: superhuman helper enables victory over invisible enemies
  taxonomy_refs: []
  basis: The yakkhim provides a method for locating invisible yakkhas and uses magic
    so Vijaya's weapon strikes them.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not identify the helper as a deity or shape-shifter in
    this excerpt.
- id: motif:2
  label: victor assumes defeated ruler's garments
  taxonomy_refs:
  - royal_legitimacy
  basis: After defeating the yakkhas, Vijaya puts on the garments of the yakkha-king
    before founding Tambapanni.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: Royal-legitimacy reading is plausible from sequence and regalia-like garments,
    but the passage only literally states that he wore the garments.
- id: motif:3
  label: place-name and people-name origin from bodily mark and ancestral deed
  taxonomy_refs: []
  basis: Tambapanni is explained from red hands and red earth, while Sihala is explained
    from Sihabahu's lion-slaying and kinship ties.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy reference directly names etiological naming.
- id: motif:4
  label: settlement foundation by conquering leader and ministers
  taxonomy_refs:
  - culture_hero
  basis: Vijaya founds Tambapanni, and ministers found named villages and cities across
    the land.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage presents chronicle settlement foundation; the broader culture-hero
    classification should be reviewed.
- id: motif:5
  label: royal consecration requires noble queen from another polity
  taxonomy_refs:
  - royal_legitimacy
  basis: Vijaya refuses consecration unless a noble maiden is consecrated queen with
    him, leading to an embassy to the Pandu king for his daughter.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage stresses consecration and noble status; it does not describe
    ritual details of the consecration itself in this excerpt.
- id: motif:6
  label: exchange of wealth for bride and population for new realm
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Gifts are sent to woo the Pandu king's daughter; the king compensates families
    and sends maidens, goods, craftsmen, guild families, animals, and vehicles to
    Lanka.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The exchange is political and social in the passage; the sacred-exchange
    taxonomy label is tentative.
- id: motif:7
  label: displaced superhuman consort after arrival of human royal bride
  taxonomy_refs: []
  basis: When Vijaya hears the princess has arrived, he tells the yakkhim to go away
    because men fear superhuman beings.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not frame the event as romance or divine marriage; it
    only states dismissal after the princess's arrival.
- id: motif:8
  label: threatened sibling pair flee after mother's killing
  taxonomy_refs:
  - sibling_pair
  - survivor_pair
  basis: The son and daughter of Vijaya and the yakkhim are warned that their mother
