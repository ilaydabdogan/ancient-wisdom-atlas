canonical_text:
  quote: ''
  summary: The yakkhim aids Vijaya in killing invisible yakkhas by marking their location
    with cries and magic. Vijaya assumes the yakkha-king's garments, founds Tambapanni,
    and his followers and their names are explained through etymological origin accounts.
    His ministers found settlements and seek his consecration, but Vijaya requires
    a noble queen. An embassy to the Pandu king of Madhura brings a royal princess,
    many maidens, craftsmen, guild families, animals, vehicles, and goods to Lanka.
    Vijaya then sends away the yakkhim, with whom he has a son and daughter; she returns
    to Lankapura, is killed by yakkhas, and her children are warned by their maternal
    uncle to flee to Sumanakuta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The yakkhim says she will cry out wherever the invisible yakkhas are, and
    that by her magic power Vijaya's weapon will strike their bodies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vijaya listens to the yakkhim, follows her directions, fights victoriously,
    and slays all the yakkhas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the victory, Vijaya puts on the garments of the yakkha-king and distributes
    other raiment among his followers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vijaya goes to Tambapanni, founds the city of Tambapanni, and dwells there
    with the yakkhim and his ministers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The followers who landed from the ship rested their hands on red earth; because
    their hands were reddened, the region and island are said to be named Tambapanni.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sihabahu is said to be called Sihala because he slew the lion, and Vijaya's
    followers are also called Sihala by reason of their ties with him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Vijaya's ministers found villages and cities, including Anuradhagama, Upatissagama,
    Ujjeni, Uruvela, and Vijita; two are located near named rivers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After settlements are founded, the ministers ask Vijaya to consent to be consecrated
    king, but he refuses unless a maiden of noble house is consecrated queen at the
    same time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ministers send people with precious gifts, jewels, pearls, and other goods
    to Madhura in southern India to woo the Pandu king's daughter for Vijaya and other
    daughters for his ministers and retainers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Pandu king agrees to send his daughter, obtains many other maidens with
    compensation to their families, and sends the princess, the maidens, ornaments,
    journey provisions, elephants, horses, wagons, craftsmen, and families of the
    eighteen guilds to Vijaya.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The arriving multitude disembarks at Mahatittha, and the landing-place is
    said to be known by that name for this reason.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Vijaya has one son and one daughter by the yakkhim; when he hears that the
    princess has arrived, he tells the yakkhim to leave the two children behind and
    go, saying that men fear superhuman beings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The yakkhim fears the yakkhas, repeatedly beseeches Vijaya in vain, then takes
    the two children and departs for Lankapura.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The yakkhim sets the children outside the city and enters Lankapura; the yakkhas
    recognize her, take her for a spy in their terror, and one violent yakkha kills
    her with a single blow.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The yakkhim's maternal uncle finds the children, learns they are Kuvanna's,
    warns them that their mother has been slain and that they too will be slain if
    seen, and tells them to flee swiftly.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The two children flee from Lankapura to Sumanakuta.
  category: action
  evidence_refs:
  - ev:11
