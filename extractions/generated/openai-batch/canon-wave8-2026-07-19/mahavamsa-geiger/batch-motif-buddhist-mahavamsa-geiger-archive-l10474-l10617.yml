  evidence_refs:
  - ev:1
- id: obs:2
  text: The king gives eight vessels of gold and eight vessels of silver and brings
    the great Bodhi-tree to a ship on the Ganges with Samghamitta, eleven bhikkhunis,
    and a party in which Arittha is first.
  category: action
  evidence_refs:
