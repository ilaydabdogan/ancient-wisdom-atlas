canonical_text:
  quote: ''
  summary: The passage narrates the dispatch of the great Bodhi-tree from India to
    Lanka. Dhammasoka appoints human and nonhuman escorts, honors the tree with kingship,
    places it on a ship with Samghamitta and other religious companions, and grieves
    at its departure. During the sea voyage, miraculous signs occur; nagas attempt
    to obtain the tree, are frightened by Samghamitta in griffin form, then worship
    the tree in the serpent realm and return it. In Lanka, Devanampiyatissa prepares
    for its arrival, sees it by miraculous power, and receives it at Jambukola.
  language: English
  quote_policy: summarized
