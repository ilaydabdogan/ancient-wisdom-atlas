canonical_text:
  quote: ''
  summary: Pandukabhaya is secretly carried away as a child and protected from his
    uncles’ attempts to kill him. He is raised by a foster-father, survives further
    murder plots, receives money and instructions from his mother, is trained by the
    brahman Pandula, gathers soldiers, and finds the maiden Suvannapali after her
    touch changes banyan leaves into golden vessels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A serving-woman, acting on Ummadacitta’s command, places the boy in a basket
    and carries him toward Dvaramandalaka.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Princes hunting in the Tumbara forest question the serving-woman, and she
    describes the basket’s contents as a sweet cake for her daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Citta and Kalavela protect the boy by causing a great boar to appear, drawing
    the princes away in pursuit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The serving-woman gives the boy and money secretly to an entrusted man, who
    raises him alongside his own newborn son by saying his wife has borne twin sons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At age seven the boy avoids killers by diving into a pond and hiding inside
    a hollow tree whose opening is under water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The attackers count the boys’ clothes, kill the other boys, and report that
    all the boys have been killed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
