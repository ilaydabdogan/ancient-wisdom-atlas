- id: motif:5
  label: Queen chosen by miraculous sign of abundance and gold
  taxonomy_refs:
  - royal_legitimacy
  - sacred_marriage
  basis: Pandula tells Pandukabhaya to make queen the woman whose touch turns leaves
    to gold; Palu’s touch changes banyan leaves into golden vessels and the food does
