candidate_motifs:
- id: motif:1
  label: Endangered royal child secretly preserved
  taxonomy_refs:
  - miraculous_child
  - royal_legitimacy
  basis: Pandukabhaya is hidden as a boy, placed with a foster household, and survives
    repeated attempts by his uncles to kill him before his future kingship is declared.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage does not narrate his birth itself, but it presents a threatened
    child whose survival leads toward kingship.
- id: motif:2
  label: Protective apparition diverts pursuers
  taxonomy_refs: []
  basis: Citta and Kalavela protect the boy by causing a great boar to appear, leading
    the princes away from the basket.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage gives little detail about Citta and Kalavela or the nature
    of the apparition beyond its protective function.
