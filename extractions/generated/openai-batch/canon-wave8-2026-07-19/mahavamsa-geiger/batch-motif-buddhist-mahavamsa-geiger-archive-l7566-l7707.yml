    son to carry fire in his place, and the herdsmen are killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At sixteen, after his uncles discover him again, his mother sends money and
    instructions to bring him to safety.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The foster-father sends the prince to the brahman Pandula with a slave and
