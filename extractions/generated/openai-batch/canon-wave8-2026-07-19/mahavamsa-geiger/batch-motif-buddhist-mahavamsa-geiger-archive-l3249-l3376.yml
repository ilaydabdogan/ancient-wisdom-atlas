canonical_text:
  quote: ''
  summary: The passage explains the acariyaparampara, a succession of Buddhist teachers
    from Upali toward Mahinda, as a chronological framework linking Indian and Ceylonese
    history. It cautions that many dates are uncertain, describes the lineage and
    ordination chronology of Upali, Dasaka, Sonaka, and Siggava, notes Sonaka's non-participation
    in the Second Council, and compares the Ceylonese succession with a different
    Northern Buddhist patriarchal list.
  language: English
  quote_policy: summarized
