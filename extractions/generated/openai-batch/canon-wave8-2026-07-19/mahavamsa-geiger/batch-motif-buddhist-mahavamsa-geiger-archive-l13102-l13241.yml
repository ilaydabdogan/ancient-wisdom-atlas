  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing the inscription, the king cries out joyfully, claps his hands,
    gathers the brotherhood in Mahamegha-park, and says he will build a pasada like
    a palace of the gods.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The king asks the brotherhood to send to a celestial palace and make him a
    drawing of it; the brotherhood sends eight theras who had overcome the asavas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the time of the sage Kassapa, a brahman named Asoka set out eight ticket-meals
    for the brethren and ordered his serving-woman Birani to give them continually.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Birani gives the gifts faithfully throughout her life, leaves this world,
