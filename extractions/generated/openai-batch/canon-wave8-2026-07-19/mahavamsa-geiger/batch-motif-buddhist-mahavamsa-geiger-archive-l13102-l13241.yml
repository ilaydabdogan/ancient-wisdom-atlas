canonical_text:
  quote: ''
  summary: Chapter XXVII recounts how Dutthagamani recalls and verifies a prophecy
    that he will build the Lohapasada; asks the bhikkhus to obtain a heavenly palace
    design; hears the backstory of Birani, whose almsgiving is followed by rebirth
    in a floating gem-palace; receives a linen drawing made by theras in the heaven
    of the thirty-three gods; and builds and adorns the Lohapasada while paying its
    workers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king recalls a handed-down tradition that a meritorious thera who converted
    the island foretold that Dutthagamani would found the Great Thupa and the nine-storied
    Lohapasada.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gold plate kept in a chest in the palace is found and read aloud; it names
    Kakavanna's son Dutthagamani and predicts that he will build specified works after
