canonical_text:
  quote: ''
  summary: King Devanampiyatissa goes hunting near a mountain after arranging a water-festival.
    The mountain deva appears as an elk-stag and draws him toward the thera. The thera
    identifies himself and his companions as Buddhist ascetics from Jambudipa, tests
    the king's wit with questions about a mango-tree and kinship, preaches a discourse,
    and the king with forty thousand men takes the three refuges. Later the thera
    refuses the evening meal, discusses Bhandu/Bhanduka, ordains him, and Bhanduka
    immediately attains arahantship. The passage closes as the samanera Sumana is
    ordered to announce the time of preaching.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king arranged a water-festival for the capital and went on foot to the
    mountain for the chase with forty thousand attendants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deva of the mountain wished to show the theras to the king and appeared
    as an elk-stag browsing in a thicket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king chose not to kill the unheeding creature, sounded his bowstring,
    pursued the fleeing stag, and the stag came near the thera before vanishing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The thera allowed the king to see him alone; the king was terrified, and when
    called by name he thought the speaker was a yakkha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The thera said that he and his companions were samanas, disciples of the King
    of Truth, who had come from Jambudipa out of compassion for the king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After hearing the thera's words, the king's fear left him; he laid aside bow
    and arrow, greeted the sage, and sat near him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The thera made his companions visible after the king's people arrived, and
    stated that they had come with him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The thera described Jambudipa as full of yellow-robed arahants with miraculous
    powers, thought-reading skill, and heavenly hearing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When asked by what way they had come, the thera answered that they came neither
    by land nor by water, and the king understood this to mean that they came through
    the air.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The thera tested the king with questions about a mango-tree, other trees,
    kinsfolk, non-kinsfolk, and the king himself, and praised his wit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The thera preached the Culahatthipadupama-suttanta, and at the end the king
    and forty thousand men came unto the three refuges.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the evening meal was brought, the king invited the sages although he
    knew they would not eat then; they declined because it was not the proper time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The thera said that Bhandu had attained the goal, had grasped the doctrine,
    was waiting for the pabbajja, and must remain near the theras.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After Bhandu explained the theras' intention, the king rejoiced and knew that
    the theras were human beings.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The thera bestowed both pabbajja and upasampada ordination on young Bhanduka,
    and in the same moment Bhanduka attained arahantship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The thera ordered the samanera Sumana to announce the time of preaching the
    dhamma.
  category: speech
  evidence_refs:
  - ev:8
