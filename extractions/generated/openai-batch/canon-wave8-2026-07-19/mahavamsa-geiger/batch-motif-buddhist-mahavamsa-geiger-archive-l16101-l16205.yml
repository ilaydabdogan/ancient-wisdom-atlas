canonical_text:
  quote: ''
  summary: 'The range includes editorial notes, then narrates a king''s great offering
    at the Cetiya-mountain: the cetiya and road are adorned, festival performances
    and lamps are arranged, alms and gifts are distributed to monastic communities,
    prison penalties are remitted, the king symbolically gives and redeems himself
    and members of his household, viharas are built or endowed, and a closing reflection
    praises powerful people who perform pious works without harming the people.'
  language: English
  quote_policy: summarized
