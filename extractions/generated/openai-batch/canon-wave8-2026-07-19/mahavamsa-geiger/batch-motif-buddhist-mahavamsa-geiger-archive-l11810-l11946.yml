candidate_motifs:
- id: motif:1
  label: prodigious child strength revealed through restraint
  taxonomy_refs:
  - miraculous_child
  basis: Nandhimitta's childhood episode shows him dragging a mill-stone and breaking
    his rope restraint, followed by the statement that he had the strength of ten
    elephants.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage presents prodigious childhood strength, but it does not describe
    a miraculous birth.
- id: motif:2
  label: recruitment of superhuman warriors for a prince
  taxonomy_refs:
  - culture_hero
  - royal_legitimacy
  basis: The passage lists ten mighty warriors and narrates how Nandhimitta and Nimila,
    both described with strength equal to ten elephants, are drawn toward service
    under the royal house opposing the Damilas.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage emphasizes martial recruitment and royal service; broader
    claims about kingship require context outside this excerpt.
- id: motif:3
  label: warrior defense of sacred Buddhist sites and doctrine
  taxonomy_refs:
  - culture_hero
  basis: Nandhimitta kills those said to desecrate thupas, reflects that his acts
    should serve the doctrine, and joins Gamani so the Buddha's doctrine may shine
    forth.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: This is a chronicle's sectarian framing of conflict; the extraction records
    only the passage's presentation.
- id: motif:4
  label: hero tested by long-distance errand
  taxonomy_refs:
  - initiation
  basis: The prince tests Nimila by assigning a far errand; Nimila's extraordinary
    speed and conduct lead Kundali to recognize his value.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage calls the errand a test, but does not describe a formal ritual
    initiation.
- id: motif:5
  label: sacred itinerary during heroic travel
  taxonomy_refs:
  - mystical_quest
  basis: During the errand, Nimila bathes, reveres the great Bodhi-tree and the Thuparama
    cetiya, sees Anuradhapura, and gathers lotus-blossoms before meeting Kundali.
  evidence_refs:
  - ev:8
  confidence: low
  cautions: The journey is primarily a test errand; devotional actions are present
    but the passage does not frame it as a quest.
