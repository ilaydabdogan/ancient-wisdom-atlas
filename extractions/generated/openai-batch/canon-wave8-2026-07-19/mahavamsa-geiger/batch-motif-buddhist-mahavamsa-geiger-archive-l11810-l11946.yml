canonical_text:
  quote: ''
  summary: The passage introduces the elephant Kandula and ten warriors of prince
    Gamani. It narrates the prodigious strength and recruitment of Nandhimitta, who
    kills Damilas said to desecrate Buddhist memorials and then joins Gamani to serve
    the Buddhist doctrine. It then describes the guarding of the Mahaganga fords and
    the testing of the young warrior Nimila through a rapid long-distance errand to
    a brahman near Cetiya-mountain and Anuradhapura.
  language: English
  quote_policy: summarized
