candidate_motifs:
- id: motif:1
  label: royal legitimacy through prophecy
  taxonomy_refs:
  - royal_legitimacy
  basis: A blind prophet identifies three men as future rulers and specifies that
    the line of the last will endure, before these men later enter royal service and
    one is consecrated king.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage presents prophecy and succession but does not provide a doctrinal
    interpretation of legitimacy beyond the events narrated.
- id: motif:2
  label: usurpation through kin conflict and return with allies
  taxonomy_refs:
  - royal_legitimacy
  basis: Abhayanaga, the king's brother, flees after scandal, foments division, returns
    with Damilas, kills the king, and reigns in the capital.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  confidence: medium
  cautions: This is a political succession pattern; the passage does not explicitly
    sacralize Abhaya's kingship.
- id: motif:3
  label: royal merit through gifts to the monastic community
  taxonomy_refs:
  - sacred_exchange
  basis: Rulers give garments, clothing, rice-gruel, debt relief, and support to the
    bhikkhu brotherhood, with Samghatissa acting after hearing a sutta on the merit
    of rice-gruel.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:14
  confidence: high
  cautions: The exchange is framed as Buddhist merit and patronage; no reciprocal
    supernatural reward is narrated within this passage.
- id: motif:4
  label: protection and embellishment of sacred Buddhist sites
  taxonomy_refs: []
  basis: Rulers build and restore structures around the great Bodhi-tree and adorn
    the Great Thupa with parasol, gems, and crystal.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:14
  confidence: high
  cautions: Available taxonomy includes sacred_tree_axis, but the passage does not
    explicitly present the tree as an axis or world center.
- id: motif:5
  label: fidelity illustrated by an animal example
  taxonomy_refs: []
  basis: The footnote reports that Abhayanaga pointed to a dog that remained loyal
    after punishment as an example for his followers' unchangeable fidelity.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This detail is supplied in a note explaining the passage and is not developed
    as a larger narrative motif here.
comparison_claims:
- id: claim:1
  claim: The prophecy that three men are future rulers and that the last one's line
    will endure can be cautiously compared to a royal-legitimacy pattern in which
    future sovereignty is announced before accession.
  claim_level: same_motif
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports a motif-family comparison only at the level of
    narrative function; it does not claim historical contact or a cross-cultural parallel.
- id: claim:2
  claim: The repeated royal donations to bhikkhus and embellishments of Buddhist structures
    can be cautiously compared to a sacred-exchange pattern of royal patronage for
    religious merit.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:1
  - ev:8
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage describes donations and mentions merit for rice-gruel,
    but it does not narrate a specific supernatural return for the gifts.
