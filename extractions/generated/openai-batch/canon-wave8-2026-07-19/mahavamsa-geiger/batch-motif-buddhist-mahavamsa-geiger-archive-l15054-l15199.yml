canonical_text:
  quote: ''
  summary: The passage recounts the king’s remembered acts of generosity to the Buddhist
    community and doctrine, especially two gifts made in adversity without regard
    for his own life. Thera Abhaya consoles the king by describing how the recipients
    distributed those gifts to many bhikkhus. The king then declares that his body
    too shall be a patron of the brotherhood and asks that it be burned in a ceremonial
    place from which the Great Thupa can be seen.
  language: English
  quote_policy: summarized
