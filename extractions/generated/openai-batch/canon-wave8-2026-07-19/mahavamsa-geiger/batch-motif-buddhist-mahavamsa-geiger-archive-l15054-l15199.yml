  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king says he regarded a gift of doctrine by preaching as greater than
    a gift of worldly wealth, attempted to preach the Mangalasutta, could not do so
    out of reverence for the brotherhood, and then ordered preaching in the viharas
    with rewards for preachers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king says that the gifts made during his reign do not gladden his heart
    as much as two gifts made without care for his life while he was in adversity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thera Abhaya recounts that named theras shared the sour millet-gruel or bowl-food
    with large numbers of bhikkhus in several places before eating it themselves.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The king says he has been a patron of the brotherhood for twenty-four years
