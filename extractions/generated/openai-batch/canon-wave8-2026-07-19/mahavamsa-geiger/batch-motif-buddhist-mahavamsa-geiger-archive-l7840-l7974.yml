canonical_text:
  quote: ''
  summary: After victory, Pandukabhaya founds and consecrates Anuradhapura, appoints
    followers, spares selected kin, establishes tanks and civic offices, installs
    yakkhas and yakkhinis in city locations with offerings, lays out urban, funerary,
    cultic, medical, and religious spaces, and later establishes village-boundaries
    throughout Lanka.
  language: English
  quote_policy: summarized
