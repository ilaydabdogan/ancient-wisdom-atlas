  quote: ''
  summary: The passage presents a scholarly chronological discussion about calculating
    the probable year of the Buddha's death and birth, emphasizing uncertainty in
    the calculations. It compares dates derived from Asoka's coronation, Candragupta's
    accession, the reign lengths of Candragupta and Bindusara, Ceylonese and other
    Buddhist chronologies, the so-called dotted Record, and alternative scholarly
    positions, concluding that different assumptions yield 486 or 483 B.C. for the
    Buddha's Nirvana.
