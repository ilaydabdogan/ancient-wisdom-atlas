canonical_text:
  quote: ''
  summary: The queen bears a noble son with auspicious signs. On the same day gem-laden
    ships and a young elephant from a six-tusked elephant arrive, events attributed
    in the passage to the child's merit. At a name-giving festival the king observes
    predicted monastic omens, offers rice-milk to the bhikkhus, and names the boy
    Gamani-Abhaya. A second son, Tissa, is later born. At rice-food ceremonies the
    king tests the princes with ritual eating tied to loyalty to the Buddha's doctrine,
    the bhikkhus, brotherly peace, and a proposed refusal to fight the Damilas; the
    boys accept the first commitments but reject the last food portion.
  language: English
  quote_policy: summarized
