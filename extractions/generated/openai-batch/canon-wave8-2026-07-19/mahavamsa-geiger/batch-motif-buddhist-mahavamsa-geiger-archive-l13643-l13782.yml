canonical_text:
  quote: ''
  summary: Named theras arrive with large bodies of bhikkhus from many regions for
    the Great Thupa. The assembled bhikkhus stand by rank around the site, leaving
    space for the king. The king greets them, offers flowers, circumambulates, and
    begins the ritual marking and foundation of the cetiya. The thera Siddhattha prevents
    an overly large design, and the king adopts a moderate dimension. Gold and silver
    vases, garments, bricks, foundation stones, jasmine offerings, an earthquake,
    and directional theras mark the consecration sequence.
  language: English
  quote_policy: summarized
