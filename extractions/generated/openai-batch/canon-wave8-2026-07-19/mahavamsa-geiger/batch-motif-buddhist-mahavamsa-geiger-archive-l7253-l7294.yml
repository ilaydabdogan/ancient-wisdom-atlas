  quote: According to custom the ministers in full assembly consecrated Vijaya king
  summary: The passage closes an account of a sibling pair whose descendants are identified
    as the Pulinda, then narrates the arrival of Pandu envoys bringing gifts, maidens,
    and the Pandu king's daughter to Vijaya. Vijaya honors the envoys, distributes
    the maidens by rank, is consecrated king by his ministers, consecrates the Pandu
    princess as queen, gives wealth and an annual shell-pearl, and later rules Lanka
    peacefully and righteously for thirty-eight years at Tambapanni.
