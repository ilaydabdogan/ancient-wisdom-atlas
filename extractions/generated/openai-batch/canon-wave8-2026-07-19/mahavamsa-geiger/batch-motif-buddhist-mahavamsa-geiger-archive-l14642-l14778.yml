candidate_motifs:
- id: motif:1
  label: Sacred relic removed from nonhuman guardians by supernatural means
  taxonomy_refs:
  - sacred_theft
  basis: The thera removes the urn of relics from the naga-king's nephew by a miraculous
    extended arm and underground escape; the nagas describe themselves as betrayed,
    while the thera frames the removal as doctrinally fitting.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not present the act as ordinary theft only; it includes
    a conditional permission formula and a Buddhist justification for relocating the
    relics.
- id: motif:2
  label: Sacred exchange after relic displacement
  taxonomy_refs:
  - sacred_exchange
  basis: After the relics are carried away, the brotherhood gives the nagas a few
    relics, and the nagas respond by bringing treasures as offerings.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The exchange is brief and follows an unequal loss rather than a negotiated
    transaction.
- id: motif:3
  label: Relics as sovereign focus of royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: Dutthagamani offers worship, confers the kingship of Lanka on the relics
    three times, and consecrates his own kingly rank to them.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage emphasizes devotion to relics; broader political consequences
    are not described in this excerpt.
- id: motif:4
  label: Cosmic protective ritual around a sacred center
  taxonomy_refs:
  - world_center
  basis: The relics are enthroned in a jeweled pavilion, surrounded by gods, guardians,
    musicians, perfumes, bhikkhu choruses in the regions, and a copper parasol made
    as great as the universe to ward off Mara.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage uses cosmic scale and directional attendance, but it does
    not explicitly call the site the world's center.
- id: motif:5
  label: Miraculous self-moving and self-opening relic-casket
  taxonomy_refs:
  - ascent
  basis: Inside the relic-chamber, the casket with the relics rises from the king's
    head, floats seven talas high, and opens by itself.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy term 'ascent' only partially fits; the action is
    a localized miracle rather than a journey motif.
- id: motif:6
  label: Divine court attends relic enthronement
  taxonomy_refs:
  - royal_legitimacy
  basis: Brahma, Sakka, divine kings, gods, celestial maidens, yakkha guardians, musicians,
    devas, and Mahakala attend the enthronement of the relics with regalia, guards,
    offerings, and praise.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The courtly pattern is inferred from the coordinated regalia and attendance;
    the passage does not explicitly use the phrase 'court'.
comparison_claims:
- id: claim:1
  claim: The relic removal can be cautiously compared to a sacred-theft pattern because
    a sacred object held by nonhuman beings is taken by supernatural means and the
    former holders lament the loss.
  claim_level: same_motif
  target: sacred_theft motif family
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  limitations: The thera states a religious justification, and the naga's conditional
    statement creates ambiguity about whether the act is theft, retrieval, or authorized
    removal.
- id: claim:2
  claim: The king's threefold consecration of his rank to the relics and his conferral
    of Lanka's kingship upon them functions as a royal-legitimacy motif.
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt shows the ritual transfer of sovereignty but does not narrate
    later political outcomes.
- id: claim:3
  claim: The enthroned relics surrounded by gods, guardians, directional chanting,
    and a universe-sized parasol can be cautiously compared to a world-center ritual
    pattern.
  claim_level: same_function
  target: world_center motif family
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: The passage suggests cosmic scale and organized sacred space, but it
    does not explicitly identify the relic site as the center of the world.
