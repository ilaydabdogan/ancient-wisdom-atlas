canonical_text:
  quote: ''
  summary: A thera argues that the relics should be moved from the nagas to a place
    where truth is understood and where the king will enshrine them. After a conditional
    challenge from a naga, he retrieves the urn by miraculous means and escapes through
    the earth. The nagas lament and receive a few relics from the brotherhood; gods
    rejoice and prepare a divine enthronement of the relics. Sakka, Brahma, other
    gods, yakkha guardians, musicians, and bhikkhus attend with regalia, offerings,
    music, and protective acts. King Dutthagamani worships the relics, confers kingship
    over Lanka upon them three times, circumambulates the thupa, enters the relic-chamber,
    and the casket rises from his head, floats, and opens by itself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The thera says the relics should be taken from the nagas to a place where
    there is understanding of the truth, and says the king will begin enshrining them
    that day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A naga tells the thera that if he sees the relics he may take them and go;
    the thera makes him repeat this three times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The thera creates a long slender arm, reaches down the throat of the naga-king's
    nephew, takes the urn with the relics, plunges into the earth, and rises in his
    cell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The naga-king and the nagas lament after the urn is found missing; the gods
    rejoice in the bhikkhu's victory.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brotherhood leaves the nagas a few relics, and the nagas bring treasures
    as offerings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sakka brings a jeweled throne and a golden casket, and Vissakamma builds a
    jeweled pavilion where the thera emerged from the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sakka receives the relic-urn from the thera, puts it into the golden casket,
    and places the casket on the throne.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brahma, Samtusita, Suyama, Sakka, the four great kings, thirty-three gods,
    celestial maidens, yakkha chieftains, musicians, devas, and the naga-king Mahakala
    take ritual or attendant positions around the relics.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The thera Indagutta creates a copper parasol as great as the universe to ward
    off Mara.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: King Dutthagamani carries a golden casket on his head, worships the relics,
    and places the casket with the relics upon a throne.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After seeing and hearing celestial signs, Dutthagamani offers a parasol and
    invests the relics with kingship over Lanka, consecrating his kingly rank to them
    three times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king, with gods and men, places the caskets on his head, circles the thupa
    three times toward the left, ascends on the east side, and descends into the relic-chamber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ninety-six kotis of arahants stand with folded hands around the thupa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The relic-casket rises from the king's head, floats seven talas in the air,
    and opens by itself.
  category: action
  evidence_refs:
  - ev:7
