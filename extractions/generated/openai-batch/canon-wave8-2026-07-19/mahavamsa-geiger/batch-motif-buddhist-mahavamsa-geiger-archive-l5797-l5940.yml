canonical_text:
  quote: ''
  summary: The passage describes King Asoka's acceptance of the Buddha's doctrine
    through the novice Nigrodha, his expansion of royal support for the Buddhist community,
    his commissioning of viharas corresponding to the eighty-four thousand sections
    of dhamma, and a wonder in which the naga-king Mahakala creates a radiant image
    of the Buddha that inspires a seven-day festival of seeing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After hearing Nigrodha, the king was won to the doctrine of the Conqueror
    and offered him eight perpetual supplies of food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nigrodha assigned successive sets of eight supplies to his master, his teacher,
    and the community of bhikkhus before consenting to accept a fourth set.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nigrodha went to the king with thirty-two bhikkhus, was served by the king,
    preached the doctrine, and confirmed the king and many of his train in refuges
    and precepts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king increased the number of bhikkhus receiving bounty until it reached
    sixty thousand and set aside sixty thousand teachers of false doctrine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king prepared costly foods, decorated the town, invited the brotherhood
    to his house, and provided them with hospitality and necessities for ascetics.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the king asked about the extent of the dhamma, Moggaliputta-Tissa answered
    that there were eighty-four thousand sections.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king declared that he would honour each section of the dhamma with a vihara,
    granted money in eighty-four thousand towns, ordered kings over the earth to build
    viharas, and began to build the Asokarama.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king made daily grants for the three gems, Nigrodha, and the sick, and
    funded thupa-offerings and requisites for bhikkhus learned in the doctrine.
  category: action
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:9
  text: Water from the Anotatta-lake was apportioned to the brotherhood, sixty theras
    who knew the tipitaka, Queen Asamdhimitta, and the king; nagalata tooth-sticks
    were given daily to sixty thousand bhikkhus and sixteen thousand palace women.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The naga-king Mahakala is described as possessing wondrous might, having beheld
    four Buddhas, and having lived through one age of the world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mahakala was brought into the king's presence fettered with a chain of gold,
    seated on a throne under a white canopy, honoured with flowers, and surrounded
    by sixteen thousand palace women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king asked to behold the bodily form of the omniscient Great Sage who
    had set rolling the wheel of the true doctrine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The naga-king created a beauteous figure of the Buddha with thirty-two greater
    signs, eighty lesser signs, fathom-long rays of glory, and a crown of flames.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the sight of the created figure, the king was filled with joy and amazement
    and kept a seven-day festival called the Feast of the eyes.
  category: action
  evidence_refs:
  - ev:7
