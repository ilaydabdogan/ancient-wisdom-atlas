canonical_text:
  quote: ''
  summary: 'The passage narrates the ancestry of Vijaya: a Kalinga princess is prophesied
    to unite with the king of beasts, leaves home, encounters a lion, is carried to
    his cave, and bears twin children. Her son Sihabahu removes the rock blocking
    the cave and escapes with his mother and sister. Their merit causes given clothing
    and leaf-plates to become splendid garments and golden dishes. The grieving lion
    ravages villages until Sihabahu accepts a royal bounty, kills his father, and
    is offered kingship. Sihabahu founds Sihapura, marries his sister Sihasivali,
    fathers many twin sons including Vijaya and Sumitta, and later punishes Vijaya
    and his violent followers by beginning an act of public disgrace or exile.'
  language: English
  quote_policy: summarized
