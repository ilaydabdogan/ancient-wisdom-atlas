  cautions: The passage presents a lion as an animal spouse but does not describe
    transformation or divinity.
- id: motif:2
  label: hybrid or extraordinary child
  taxonomy_refs:
  - miraculous_child
  basis: Sihabahu is born from a lion-human union and has hands and feet like a lion’s.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The birth is extraordinary in ancestry and bodily form, but the passage
    does not call it miraculous.
- id: motif:3
  label: twin birth lineage
  taxonomy_refs:
  - sacred_twins
  basis: The princess bears twin children, and later Sihasivali bears sixteen sets
    of twin sons, including Vijaya and Sumitta.
  evidence_refs:
  - ev:4
  - ev:14
  confidence: medium
  cautions: The text emphasizes repeated twin births, but does not explicitly characterize
    the twins as sacred.
- id: motif:4
  label: escape from enclosed cave
  taxonomy_refs:
  - departure
  basis: Sihabahu removes the rock blocking the cave and departs with his mother and
    sister while the lion is absent.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The departure is an escape from confinement rather than a quest explicitly
    framed by the passage.
- id: motif:5
  label: merit causing transformation of ordinary objects
  taxonomy_refs: []
  basis: Clothing and leaf-served food turn into splendid garments and golden dishes
    by reason of the fugitives’ merit.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the cause as merit but does not expand its ritual or
    doctrinal significance here.
- id: motif:6
  label: son kills animal father
  taxonomy_refs: []
  basis: Sihabahu accepts a reward for slaying his own father and kills the lion after
    the lion’s tenderness initially prevents the arrows from harming him.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage frames the lion as father and victim but does not provide
    an explicit moral judgment beyond the events.
- id: motif:7
  label: royal legitimacy through recognized descent and heroic deed
  taxonomy_refs:
  - royal_legitimacy
  basis: After Sihabahu kills the lion, ministers recognize his maternal royal lineage
    and invite him to become king.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The kingship is accepted and then handed over, so the legitimacy motif
