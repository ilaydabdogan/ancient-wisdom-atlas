canonical_text:
  quote: ''
  summary: A wise maiden feeds a thera emerging from nirodha; the thera foretells
    that she will receive royal rank and asks her to remember the place, then dies.
    The maiden is later identified as a king's daughter and married to Prince Vankanasikatissa.
    As Mahamatta, she remembers the thera's words and supports the founding of a vihara;
    her son Gajabahu and later King Mahallanaga build and endow multiple Buddhist
    monuments and monasteries. The passage closes with a moral contrast between the
    wise who use riches for merit and fools who do evil for pleasures.
  language: English
  quote_policy: summarized
