canonical_text:
  quote: "“the relics rose up out of it and taking the form of the Buddha”"
  summary: The relics rise from the casket, take the form of the Buddha, perform the
    miracle of double appearances, and return. The king ritually carries, opens, and
    enshrines them in a relic chamber, offers royal honors and wealth, commands public
    worship, and entrusts the chamber’s closure to the monastic community. The passage
    also describes imperishable offerings, island-wide worship, further enshrinement
    of relics, completion of the thupa, and a concluding statement on the incomprehensibility
    of Buddhas and the merit of pious deeds.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The relics rise out of the casket, take the form of the Buddha with greater
    and lesser signs, perform the miracle of double appearances, and return to the
    casket.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When devas and men behold the miracle, twelve kotis attain arahantship, while
    those attaining three other fruits of salvation are said to be beyond reckoning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The casket sinks down and rests on the king’s head before a procession around
    the relic chamber with thera Indagutta and dancing-women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king places the casket on a jewelled throne, washes and perfumes his hands,
    opens the casket, and takes out the relics.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king thinks that, if the relics are to remain undisturbed, serve as a
    refuge, and endure, they should rest on the couch in the form of the Master lying
    on his deathbed; the relics then lie in that shape.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: At the enshrining of the relics, the earth quakes and many wonders occur.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king worships the relics with a white parasol and confers on them the
    entire overlordship of Lanka for seven days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king, dancing-women, ministers, retinue, and devatas offer adornments
    in the relic chamber; the king also distributes goods to the brotherhood and has
    bhikkhus recite through the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king has the drum beaten in the city and proclaims that all people should
    adore the relics throughout the week.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Thera Indagutta commands that people of Lanka wishing to adore the relics
    arrive together, worship, and return home; the passage says this happens as commanded.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The brotherhood entrusts the closing of the relic chamber to two samaneras,
    who close it with a fat-coloured stone.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Theras who have overcome the asavas command that flowers not wither, perfumes
    not dry, lamps not be extinguished, nothing perish, and six fat-coloured stones
    hold together forever.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The king commands the people to enshrine relics as they are able; the people
    enshrine thousands of relics, and the king completes the thupa and four-sided
    building on the cetiya.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The conclusion says the Buddhas, the nature of Buddhas, and the reward of
    those with faith are incomprehensible, and that pious people perform and encourage
    deeds of merit to obtain blessings.
  category: speech
  evidence_refs:
  - ev:13
