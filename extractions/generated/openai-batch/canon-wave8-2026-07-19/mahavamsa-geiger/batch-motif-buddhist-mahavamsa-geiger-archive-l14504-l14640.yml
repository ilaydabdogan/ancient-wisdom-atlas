canonical_text:
  quote: ''
  summary: The king announces and prepares the public enshrining of relics with adornment
    of the city, royal procession, offerings, music, and divine assistance. The ascetic
    Sonuttara descends through the earth to the naga palace to request relics appointed
    by the Buddha for the Great Thupa. The naga king resists, signals his nephew Vasuladatta
    to conceal the relic urn, and Vasuladatta swallows it, coils at Mount Sineru,
    manifests many hoods and serpent forms, and emits smoke and fire. The naga king
    then denies having the relics and tries to satisfy the thera by displaying a gem-adorned
    cetiya temple.
  language: English
  quote_policy: summarized
