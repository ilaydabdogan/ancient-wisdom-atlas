canonical_text:
  quote: ''
  summary: A childless queen is advised by a thera to seek a dying samanera. After
    repeated pleading and offerings, the samanera desires rebirth in the king's family,
    dies, and is reborn in the queen's womb. During pregnancy the queen has unusual
    longings involving honey, feeding bhikkhus, sword-cleansing water connected with
    Elara's foremost warrior, and unfaded lotus garlands from Anuradhapura. Soothsayers
    interpret these cravings as signs that her son will defeat the Damilas, unite
    the kingdom, and make the doctrine shine. The king arranges for the cravings to
    be fulfilled, including through a honey-filled boat and Velusumana's raid that
    brings lotus flowers, horses, and the head of Elara's warrior.
  language: English
  quote_policy: summarized
