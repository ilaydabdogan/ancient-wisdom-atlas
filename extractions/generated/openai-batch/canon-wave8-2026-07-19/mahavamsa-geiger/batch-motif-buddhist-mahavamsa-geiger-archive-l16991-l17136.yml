candidate_motifs:
- id: motif:1
  label: Poisoned fruit as cause of royal death
  taxonomy_refs: []
  basis: The predecessor king dies immediately after eating jambu-fruits poisoned
    by the people of Pacinadipa.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a clear poisoned-food episode, but no broader taxonomy
    reference is supplied for this specific motif.
- id: motif:2
  label: Compassionate royal rain vow to avert famine
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The king lies at the Great Thupa and vows not to rise, even if he dies, until
    rainwater raises him; rain then falls over Lanka and famine fear is averted.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The self-endangering vow is explicit; the taxonomy labels are broad and
    should be reviewed.
- id: motif:3
  label: Merciful suppression of rebellion through simulated execution
  taxonomy_refs:
  - royal_legitimacy
  basis: The king secretly releases rebels but burns corpses to make people fear that
    rebels were executed, removing fear from rebellion without killing the rebels
    in the passage.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The royal-legitimacy classification is interpretive; the literal sequence
    is deception with spared rebels.
- id: motif:4
  label: Pestilence personified as a devouring yakkha appeased by offerings
  taxonomy_refs:
  - sacred_exchange
  basis: Ratakkhi causes a red-eye affliction and devours victims; after negotiation
    with the king, offerings at village entrances are assigned to the yakkha and pestilence
    fear ends.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage explicitly links the yakkha, disease symptoms, devouring,
    negotiation, and offerings; the exact medical identification is not part of the
    motif extraction.
- id: motif:5
  label: Ruler offers himself instead of his subjects
  taxonomy_refs:
  - sacrifice
  basis: When the yakkha requests victims, the king refuses to give up any subject
    and tells the yakkha to take and devour him instead.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The yakkha does not accept the king's body; the offering is stated but
    not completed in that scene.
- id: motif:6
  label: Non-harming flight and self-gift of the king's head
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The king flees alone to avoid harming others, tells a food-bearing man to
    take his head for reward, and dies seated before the man carries the head to Gothabhaya.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The text states the king dies and the man takes the head; the mechanism
    of death is not described in detail.
- id: motif:7
  label: Royal almsgiving and sacred building patronage
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Gothabhaya gives food and garments to bhikkhus for twenty-one days and builds
    or renews structures connected with the Mahavihara and the great Bodhi-tree.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The patronage actions are explicit; their royal-legitimating function
    is a cautious motif-level classification rather than a direct statement in the
    passage.
- id: motif:8
  label: Bodhi-tree cultic enclosure with wheel-symbols
  taxonomy_refs:
  - sacred_tree_axis
  basis: Gothabhaya sets up a stone enclosure for the great Bodhi-tree and pillars
    with wheel-symbols at the courtyard corners.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The sacred tree is explicit, but the broader 'axis' classification is
    not directly stated and requires review.
