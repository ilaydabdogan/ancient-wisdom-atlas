canonical_text:
  quote: ''
  summary: The passage recounts the death of a king by poisoned jambu fruit, the accession
    and compassionate acts of Sirisamghabodhi, his efforts to end drought, rebellion,
    and a yakkha-caused pestilence, his flight and death during Gothabhaya's rebellion,
    and Gothabhaya's subsequent almsgiving and religious building works.
  language: English
  quote_policy: summarized
