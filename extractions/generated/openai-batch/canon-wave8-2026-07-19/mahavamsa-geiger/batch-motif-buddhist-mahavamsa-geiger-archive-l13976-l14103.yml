canonical_text:
  quote: ''
  summary: The passage recounts gifts and service given to a thera, then describes
    how labour and offerings connected with the Great Thupa lead to heavenly rebirth.
    Two former female wage labourers appear as radiant devatas and explain their reward
    to the thera Mahasiva. The narrative then turns to miraculous stabilization of
    the flower-offering terraces and the procurement and arrangement of six bright
    stones for the relic chamber.
  language: English
  quote_policy: summarized
