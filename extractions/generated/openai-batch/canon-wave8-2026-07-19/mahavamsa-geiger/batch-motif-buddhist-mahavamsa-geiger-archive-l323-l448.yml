canonical_text:
  quote: ''
  summary: The passage is an introductory critical discussion of how to treat miraculous
    and mythical elements in Buddhist and Ceylonese chronicle tradition. It argues
    for separating later marvellous additions from a possible historical nucleus while
    also examining the meaning of mythical material. It then presents internal and
    external reasons for some confidence in the Ceylonese Chronicles, including their
    claimed intention to tell truth, chronological systematization, agreements with
    other Indian traditions, and evidence concerning Asoka, Mahinda, Samghamitta,
    and the conversion of Ceylon.
  language: English
  quote_policy: summarized
