- id: obs:1
  text: The passage describes a critical method that removes miraculous or mythical
    additions from tradition without automatically accepting the remaining residue
    as history.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Windisch is cited as showing that, in Buddhist tradition, additions can collect
    around a small nucleus and move originally simple events into the marvellous.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that mythical covering may have meaning and significance
    and may cover deep thoughts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ceylonese Chronicles are described as wishing to write the truth, though
    their writers were limited by age, social position, and one-sided tradition.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chronicles are said to judge even foes and usurpers objectively, including
    the statement that Sena and Guttika ruled justly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chronicles are described as attempting systematic chronology, including
    synchronistic connections between ecclesiastical tradition, profane history, Indian
    history, and Ceylonese history.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the Ceylonese tradition about Indian history after
    the Buddha is not unsupported, citing agreements and near-agreements with canonical
    writings, Brahmanic tradition, Indian tradition, and Puranic figures.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The conversion of Ceylon is attributed, according to the Dipavamsa, Mahavamsa,
    and country tradition, to Mahinda, a son of Asoka, and to his sister Samghamitta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Asoka is said to mention Ceylon in inscriptions among countries to which he
    dispatched missionaries and among countries for which he provided distribution
    of medicines.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage answers suspicion about Samghamitta's name by saying it was the
    name she assumed on entering the Order, while her lay-name fell into oblivion.
  category: attribute
  evidence_refs:
  - ev:7
