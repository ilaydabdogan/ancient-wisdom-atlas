canonical_text:
  quote: "“Straightway after his consecration his command spread so far as a yojana
    (upward) into the air and downward into the (depths of the) earth.”"
  summary: The passage recounts the Thera redaction and later Buddhist school divisions,
    then gives a dynastic sequence from Kalasoka’s sons and the Nandas to Candagutta,
    Bindusara, and Asoka. It describes Asoka gaining undivided sovereignty through
    the killing of his brothers, consecrating himself at Pataliputta, receiving provisions
    and services from devas, spirits, nagas, and animals, and appointing Tissa as
    vice-regent.
  language: English
  quote_policy: quoted
