canonical_text:
  quote: ''
  summary: 'A dispute among bhikkhus is escalated by monks labeled heretical, who
    try to win over Revata with monastic requisites and mislead King Kalasoka. Supernatural
    and liberated figures intervene: Brahma exhorts Salha to stand firm, devas divert
    the king''s ministers, the king dreams of being cast into Lohakumbhi hell, and
    his sister Nanda comes through the air to admonish him. The king then supports
    the true-believing bhikkhus. Revata appoints eight elders to settle the dispute
    by ubbahika; at Valikarama, Revata questions Sabbakami, who judges the disputed
    points unlawful according to tradition, and the Ten Points of the opposing monks
    are refuted.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Monks described as heretical prepare abundant things needful for ascetics,
    travel by ship to Sahajati, and seek the support of the thera Revata.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salha, described as free from the asavas, perceives that those of Pava hold
    the true doctrine; Brahma then tells him to stand firm in the doctrine, and Salha
    agrees.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Revata does not take the side of the monks who brought gifts and dismisses
    a pupil who took their part.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The opposing monks go to Pupphapura and tell King Kalasoka that they are guarding
    the Master's perfumed chamber in the Mahavana-vihara and that country bhikkhus
    intend to seize the vihara.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A very large assembly of bhikkhus gathers under Revata to bring the dispute
    to a peaceful end, and Revata insists that the dispute be ended in the presence
    of those with whom it began.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king sends ministers, but they go elsewhere through the design of the
    devas; that night the king dreams that he is hurled into Lohakumbhi hell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nanda, the king's sister and a theri free from the asavas, comes to him through
    the air, calls his action ill, and instructs him to reconcile with and protect
    the true-believing bhikkhus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king goes to Vesali and the Mahavana monastery, hears both sides, decides
    for the true faith, reconciles with the rightly believing bhikkhus, and promises
    to protect the doctrine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Revata appoints four bhikkhus from the East and four from Pava for an ubbahika
    to set the dispute to rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Valikarama, the eight elders decide the disputed points; Revata questions
    Sabbakami, Sabbakami judges all points unlawful according to tradition, and the
    same question-and-answer process is repeated before the brotherhood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The teaching of ten thousand heretical bhikkhus who maintained the Ten Points
    is refuted by the great theras.
  category: action
  evidence_refs:
  - ev:5
