canonical_text:
  quote: ''
  summary: The passage recounts the arrival of consecration gifts and Buddhist teaching
    from Dhammasoka to the ruler of Lanka, Devanampiyatissa. The gifts include royal
    ritual requisites, and the accompanying message urges refuge in the Buddha, Doctrine,
    and Order. Envoys travel by sea, deliver the gifts, and consecrate the Lankan
    ruler again on the full-moon day of Vesakha, when festivals are held throughout
    Lanka. Translator notes compare the coronation chronology with the Dipavamsa and
    explain the royal name as meaning “Tissa, friend of the gods.”
  language: English
  quote_policy: summarized
