canonical_text:
  quote: Ye shall found in the lovely island of Lanka the lovely religion of the Conqueror
  summary: After the third council, Moggaliputta sends theras to different regions
    to establish the Buddha's religion. Majjhantika goes to Kasmira and Gandhara,
    subdues the naga-king Aravala's destructive weather and terrifying displays, teaches
    him and other beings, and causes large-scale conversions and ordinations. Other
    theras preach in Mahisamandala and Vanavasa, also producing conversions, ordinations,
    and monastic foundations.
  language: English
  quote_policy: quoted
