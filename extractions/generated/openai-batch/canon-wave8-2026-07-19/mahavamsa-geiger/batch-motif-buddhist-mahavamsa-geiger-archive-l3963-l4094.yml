canonical_text:
  quote: ''
  summary: The passage is a scholarly discussion of Buddhist council chronology and
    schism traditions. It argues that the Southern tradition correctly distinguishes
    a Second Council under Kalasoka and a Third Council under Dhammasoka, while Northern,
    Tibetan, and Chinese sources preserve variant or fused accounts involving different
    dates, places, and Asoka traditions. It also compares the Vajji-monks' ten points
    with the Mahadeva/Bhadra five dogmas and links the latter to the Kathavatthu and
    the Council of Pataliputta.
  language: English
  quote_policy: summarized
