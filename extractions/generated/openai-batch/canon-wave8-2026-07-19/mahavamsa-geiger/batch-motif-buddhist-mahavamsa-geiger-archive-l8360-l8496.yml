canonical_text:
  quote: ''
  summary: The passage recounts several theras traveling to different regions, preaching
    named Buddhist discourses, and producing large numbers of conversions and ordinations.
    In Suvannabhumi, Sona and Uttara encounter a female demon from the sea who devours
    newborn boys in the royal palace. After the local people mistake the theras for
    allies of demons, the thera creates a greater host of terrifying demons, surrounds
    the demon and her followers, causes her to flee, makes a bulwark around the country,
    preaches the Brahmajala, and many people take refuge, precepts, and ordination.
    Thereafter royal newborn princes are given the name Sonuttara. The chapter closes
    by praising the renunciation of those who delay bliss to benefit the world.
  language: English
  quote_policy: summarized
