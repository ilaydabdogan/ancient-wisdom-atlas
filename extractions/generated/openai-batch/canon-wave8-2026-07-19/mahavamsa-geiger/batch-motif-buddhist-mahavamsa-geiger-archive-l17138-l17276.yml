canonical_text:
  quote: ''
  summary: The passage describes royal construction, restoration, festivals, robe
    donations, suppression and exile of Vetulya-oriented monks, the rise of the Cola
    bhikkhu Samghamitta as a court intimate and tutor to the king's sons, Jetthatissa's
    succession and violent punishment of ministers at his father's funeral, Samghamitta's
    departure with Mahasena, and Jetthatissa's later Buddhist donations and buildings.
    It ends with a reflection that sovereignty enables merit but also injustice.
  language: English
