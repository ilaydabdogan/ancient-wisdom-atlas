canonical_text:
  quote: The bhikkhus created a mountain between the two (brothers).
  summary: Prince Gamani, trained in warfare, asks his father for permission to fight
    the Damilas and is forbidden. He insults his father by sending a woman's ornament,
    flees, and is called Dutthagamani. The king completes religious works, makes warriors
    swear not to enter his sons' battlefield, and dies. Prince Tissa performs the
    funeral rites and takes his mother and the elephant Kandula to Dighavapi. Dutthagamani
    is consecrated king, demands his mother and elephant, and after repeated refusal
    wars against Tissa. In the battle many of Dutthagamani's men fall; he flees with
    his minister Tissa and the mare Dighathunika, while Prince Tissa pursues until
    bhikkhus create a mountain between the brothers. Later, when the fleeing king
    is hungry at a ford, food is placed in an almsbowl and miraculously carried through
    the air to theras and bhikkhus, then returned as fragments to feed the king and
    mare.
  language: English
  quote_policy: quoted
