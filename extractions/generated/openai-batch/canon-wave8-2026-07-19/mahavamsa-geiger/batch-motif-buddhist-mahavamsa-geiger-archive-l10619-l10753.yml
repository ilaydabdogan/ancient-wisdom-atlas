canonical_text:
  quote: ''
  summary: The passage narrates the ritual reception, procession, miraculous establishment,
    and propagation of the great Bodhi-tree in Lanka. The king honors the tree with
    royal status, escorts it through decorated sacred sites, witnesses its aerial
    miracle and radiance, plants miraculous fruit and saplings, and distributes Bodhi-saplings
    to multiple places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king of Lanka causes the great Bodhi-tree to be set in a beautiful pavilion
    on the shore and worships it by bestowing on it the kingship of Lanka.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king entrusts his own government to sixteen persons, takes on the duties
    of a doorkeeper, and orders solemn ceremonies for three days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the tenth day the king places the great Bodhi-tree on a beautiful car,
    accompanies it, and has it placed at the later site of the Eastern Monastery,
    where a morning meal is commanded for the people and the brotherhood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The thera Mahinda relates to the king the Buddha's subduing of the nagas.
  category: speech
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:5
  text: After hearing Mahinda, the king raises monuments at places that had been frequented
    by the Master.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king escorts the great Bodhi-tree along a road sprinkled with white sand,
    strewn with flowers, adorned with pennons and festoons, and supplied with offerings
    day and night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The procession brings the tree through Anuradhapura and into the Mahameghavanarama,
    described as consecrated by four Buddhas, to the place where former Bodhi-trees
    had stood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Sixteen noble persons wearing royal ornaments lift down the great Bodhi-tree
    with the king and release it to be set down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: When released from the hands of the king and nobles, the great Bodhi-tree
    rises eighty cubits into the air and floats while sending forth rays of six colours.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The rays spread over the island and reach to the Brahma-world, lasting until
    sunset.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Ten thousand persons, moved by faith because of the miracle, gain spiritual
    insight, attain arahantship, and receive the pabbajju.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: At sunset the great Bodhi-tree comes down, stands firm on the earth under
    the constellation Rohini, and the earth quakes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The roots grow over the brim of the vase, strike down into the earth, and
    close in the vase.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The gathered people worship the established tree with perfumes, flowers, and
    other offerings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: A tremendous cloud pours rain, and cool dense mists from the snow-region surround
    the great Bodhi-tree on every side.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:16
  text: The tree remains invisible in the region of the snow for seven days, then
    the clouds vanish and the tree and its six-coloured rays become visible again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:17
  text: Mahinda, Samghamitta, the king, nobles of Kajaragama and Candanagama, the
    Brahman Tivakka, and island-dwellers gather for a festival of the great Bodhi-tree,
    by the power of the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: In the assembled crowd's sight, a faultless fruit grows from the east branch,
    falls, and is taken up by Mahinda.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:19
  text: Mahinda gives the fruit to the king, who plants it in a golden vase filled
    with perfumed earth at the spot of the later Mahaasana.
  category: action
  evidence_refs:
  - ev:5
- id: obs:20
  text: Eight shoots immediately spring from the planted fruit and stand as young
    Bodhi-trees four cubits high.
  category: action
  evidence_refs:
  - ev:5
- id: obs:21
  text: The king worships the young Bodhi-trees with the gift of a white parasol and
    bestows royal consecration on them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:22
  text: Eight Bodhi-saplings are planted at named sites, and thirty-two later saplings
