  summary: The passage discusses the development of a Ceylonese Buddhist chronological
    system and identifies the interval of 218 years between the Buddha's Nirvana and
    Asoka's consecration as a foundational fixed date. It then derives Asoka's accession
    and Candagutta's accession from regnal lengths, and includes a footnote comparing
    a Jaina chronological interval used to date Mahavira.
