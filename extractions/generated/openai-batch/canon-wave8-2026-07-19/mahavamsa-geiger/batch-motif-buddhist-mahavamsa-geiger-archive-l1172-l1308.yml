canonical_text:
  quote: ''
  summary: The passage is a scholarly chronological discussion of dates connected
    with the Buddha's Nirvana, Asoka's consecration, Devanampiyatissa's coronations,
    Mahinda's arrival in Ceylon, the planting of the Bodhi-tree in Anuradhapura, and
    the founding of the Mahavihara and Abhayagiri-vihara. It emphasizes chronological
    discrepancies among sources and argues for caution in reckoning dates.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A notice attributed to Hiuen-thsang is reported as saying that the Sarvastivadins
    dated the Buddha's Nirvana to the eighth day of the second half of the eighth
    month, Kattika.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Using that Nirvana date as a point of departure, the passage lists calculated
    dates for Asoka's consecration, Tissa's first and second coronations, and Mahinda's
    arrival in Ceylon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The death of Mutasiva and the first crowning of Devanampiyatissa are said
    to be placed in some sources in the seventeenth year of Asoka, while the author
    argues that Tissa's coronation falls in the eighteenth year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The planting of the Bodhi-tree in Anuradhapura is said to be assigned by Mahavamsa
    20.1 to the eighteenth year of Asoka, but the author argues that it should fall
    in the nineteenth year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that Mahavamsa 33.80-81 gives an interval of 217 years,
    10 months, and 10 days between the founding of the Mahavihara by Devanampiyatissa
    and the founding of the Abhayagiri-vihara by Vattagamani.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mahinda is said to have come to Ceylon on the full-moon day of Jettha, come
    to the capital the following day, spend the night in Mahameghavana, and receive
    Mahameghavana from the king as an arama on the next day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The royal presentation of Mahameghavana to Mahinda and his companions is identified
    as the founding of the Mahavihara.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The founding of the Abhayagiri-vihara is calculated as occurring at the end
    of March 28 B.C. and in the second half of Vattagamani's reign.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Adding the figures for individual reigns produces a different calculation,
    placing Vattagamani's second accession to the throne in 39 B.C. and creating a
    discrepancy of about ten years.
  category: other
  evidence_refs:
  - ev:8
