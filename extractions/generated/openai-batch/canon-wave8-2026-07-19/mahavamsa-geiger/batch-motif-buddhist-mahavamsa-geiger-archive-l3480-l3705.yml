canonical_text:
  quote: ''
  summary: 'The passage presents a Ceylonese and Indian regnal synchronism table,
    then introduces a discussion of the Buddhist Councils. It summarizes the Southern
    Buddhist tradition of three Councils, lists Pali and other sources, and recounts
    the Cullavagga account of the First Council: Mahakassapa hears of the Buddha''s
    death, responds to Subhadda''s permissive statement, proposes a communal recitation
    of Dhamma and Vinaya, and 500 monks including Ananda are chosen. Further episodes
    concern Ananda''s report about lesser precepts, reproaches against Ananda, Purana''s
    independent adherence to what he heard from the Master, Channa''s brahmadanda
    penance and attainment of arahantship, and the dating of the First Council after
    the Buddha''s death.'
  language: English
  quote_policy: summarized
