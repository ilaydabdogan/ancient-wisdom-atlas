canonical_text:
  quote: ''
  summary: 'The passage recounts early reigns after Dutthagamani: Salirajakumara loves
    Asokamaladevi and neglects royal rule; Saddhatissa succeeds Dutthagamani, performs
    extensive religious building and offerings, and is reborn among the Tusita gods;
    after Saddhatissa''s death, counsellors and the bhikkhu brotherhood consecrate
    Thulathana, but Lanjatissa overpowers him and rules; Lanjatissa first neglects
    the brotherhood, then reconciles and makes buildings, offerings, and donations;
    after Lanjatissa, Khallatanaga reigns.'
  language: English
  quote_policy: summarized
