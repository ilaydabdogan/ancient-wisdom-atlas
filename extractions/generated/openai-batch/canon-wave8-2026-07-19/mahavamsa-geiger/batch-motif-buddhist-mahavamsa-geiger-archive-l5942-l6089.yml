canonical_text:
  quote: the doctrine should shine forth in brightness
  summary: At the Second Council, theras foresee a future decline of the faith and
    seek Brahma Tissa, a being in Brahma heaven, to be reborn among humans to avert
    it. Siggava and Candavajji are assigned future responsibility for receiving and
    instructing the reborn boy. The passage then recounts the monastic lineage and
    initiations of Dasaka and Sonaka, and ends with Siggava and Candavajji visiting
    Sonaka.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The mighty believing king and thera Moggaliputta are said to have been seen
    in former times by holy ones.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the time of the Second Council, theras look into the future and see a coming
    downfall of the faith in the time of that king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The theras search the whole world for someone able to stop the downfall and
    identify Brahma Tissa in Brahma heaven, where he has not long to live.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The theras ask Brahma Tissa to be reborn among humans to bring the downfall
    to nothing, and he grants the request because he wants the doctrine to shine brightly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Siggava and Candavajji are told that after one hundred and eighteen years
    the downfall of the religion will begin, and that one of them must receive the
    reborn boy into the order while the other must instruct him in the Buddha’s word.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dasaka, a learned brahman of Vesali, meets the thera Upali, asks about the
    Buddha’s manta, and is told that it is imparted only to one who wears the monastic
    robe.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:7
  text: Dasaka receives ordination together with three hundred young brahmans, and
    Upali teaches the whole Tipitaka to a thousand disciples who have overcome the
    asavas, including Dasaka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sonaka, the fifteen-year-old son of a caravan-guide, comes to Giribbaja for
    trade, enters the Veluvana monastery with fifty-five young brahman companions,
    sees Dasaka, gains faith, and asks for ordination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sonaka fasts for three meal-times, obtains his parents’ permission, receives
    pabbajja and upasampada with the other youths, learns the three pitakas, and becomes
    foremost among Dasaka’s thousand disciples.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Siggava and Candavajji, both ministers’ sons, go from a life associated with
    seasonal palaces and a following of five hundred to the Kukkutarama, where they
    visit Sonaka and find him sitting in trance.
  category: sequence
  evidence_refs:
  - ev:5
