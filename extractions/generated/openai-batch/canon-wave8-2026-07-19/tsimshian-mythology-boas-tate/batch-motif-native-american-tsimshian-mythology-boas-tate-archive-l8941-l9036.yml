canonical_text:
  quote: ''
  summary: A mother directs her six children to travel by canoe across the sea and
    up a river to the town of their relatives. They reach the town, transform their
    canoe and provisions into enduring landscape features, and are recognized as the
    grandchildren of a former chief. After their departure, the mother wanders into
    the woods and is taken to a town of many Mice, who claim her as their mother through
    her Mouse lover; they keep her with them and dance to comfort her while her husband
    searches for her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eldest son agrees to his mother's instruction, asks his father for a good-sized
    canoe, and the father makes it for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the children leave, their mother points a little south of sunrise and
    instructs them to reach a great river, make a pole, pass a canyon, and find the
    town of their relatives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The children paddle across the sea for two days, pass between two large islands,
    and arrive at the mouth of an unfamiliar great river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Their father loads the canoe with seal, sea-lion, halibut, other sea-animal
    meat, and shellfish.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children go up the river day after day, pass through a large canyon in
    four days, and then see a large town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before entering the town, they turn the canoe upside down; the canoe becomes
    a little hill and the animals become stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the village, the strangers are described to the chief as four young men
    and two young women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The eldest son understands his mother's language, while the others use the
    Haida language.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The eldest son asks whether a chief had cast out his daughter years before,
    and then identifies the group as that woman's children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The new chief announces that the four princes and two princesses are the grandchildren
    of his late uncle, and the wise men receive them gladly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After her children leave, their mother goes into the woods weeping, follows
    a narrow trail, and meets good-looking young people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The young people tell the woman that they are also her children and invite
    her to their house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a large town, assembled people tell the woman that the old grandfather
    cast her and them into the river, and that they built the town because they cannot
    return to their native country.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The town is identified as the town of the many Mice, the children of the woman
    and her Mouse lover.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The many Mice refuse to let the woman bring her husband, but they dance day
    by day to comfort her; later her husband searches for her without finding her.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
