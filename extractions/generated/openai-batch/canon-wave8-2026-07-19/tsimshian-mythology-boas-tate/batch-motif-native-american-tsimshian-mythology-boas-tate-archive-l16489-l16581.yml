canonical_text:
  quote: ''
  summary: A Gi-spa-x-la'ots war party travels by sea, builds a fort near a sandbar,
    scouts a Haida village, kills a Haida master who is beating a captive, warns captives
    to stay awake before an attack, burns and defeats the village, recovers Wi-n!e'ox,
    takes captives and spoils, and returns by canoe with war trophies amid wind and
    chiefly copper-breaking displays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party travels over a calm sea to the south side of a sandbar near a point,
    builds a fort, and keeps the old men inside it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young warriors search in the woods for the Haida village at sunset and hear
    the sound of a stone ax ahead of them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A warrior scouts alone, sees a tall Haida man beating a slave, shoots the
    Haida man with an arrow, and speaks to the wounded slave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The freed slave identifies the dead man as his master and is told to warn
    the captives that the village will be burned before daybreak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The scout asks about Princess Wi-n!e'ox and the boy Hats!Eks-n!e'ox; the slave
    says Wi-n!e'ox is married to the nephew of Chief Wi-ha'o, while Hats!Eks-n!e'ox
    is kept as a free boy by Chief Sdi'lda of the Eagle Clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sa-g'iba'yuk, one of LEg'e'ox's people, goes into the village and whispers
    the warning to the captives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At midnight the Gi-spa-x-la'ots warriors attack, many Haida are killed, some
    Haida fight back, the captives run away to their people, and the battle continues
    through the day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Warriors from the fort run toward the Haida and shoot arrows made of g-am
    wood, which the passage says cannot be broken.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Qanas is described as a strong warrior whose arrow passes through two men
    when he shoots.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wi-n!e'ox identifies the g-am wood arrow as coming from a tree that grows
    only far up the Skeena River among mountain people who can run very fast, and
    she tells the chief to order his people to flee.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Before escaping, Wi-n!e'ox's Haida husband places his dancing blanket on her
    and sets four coppers around her to defend her from enemy weapons.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Gi-spa-x-la'ots enter the houses and find Wi-n!e'ox sitting between four
    valuable coppers with two male slaves beside her; she tells her people to take
    the coppers to her brother.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The attackers destroy property, take Haida women and children captive, capture
    the old chief Wi-suqans, break new Haida canoes, burn the village, and carry many
    heads in their canoes.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: LEg'e'ox distributes rewards, giving each man a slave, two coppers to Nes-dzakagul,
    and forty elk skins to the guide Anamik.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: During the return by canoe, the guide warns the canoes to keep together before
    a strong wind; a southerly gale follows, and the party later reaches the mouth
    of the Skeena River singing war-songs and displaying heads on poles.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: At the Gid-wul-ga'dz village, villagers ask what village was destroyed; after
    hearing the answer and learning Wi-suqans was taken alive, their chief Las breaks
    a copper and throws it on the beach, and LEg'e'ox also breaks a copper.
  category: sequence
  evidence_refs:
  - ev:16
