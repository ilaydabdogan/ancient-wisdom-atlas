canonical_text:
  quote: ''
  summary: A j'ouug prince asks villagers about a princess lost years before while
    going to pick strawberries. The visitors are brought ashore and into the new chief's
    house, where they recount that their mother was driven away by the southwest wind.
    Villagers remember the princess and tell of her later Tsimshian household and
    chiefly relations. The grandfather's nephew summons chiefs and announces that
    the old man's grandchildren have arrived safely. The boy then visits his mother's
    desolate old village-site, Dzl'g^va, and finds the hidden costly coppers and property
    as she had described. The passage closes by introducing Omen's mourning-songs,
    said to have been sung after leaving a village destroyed by fire.
  language: English
  quote_policy: summarized
