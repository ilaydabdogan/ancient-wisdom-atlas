canonical_text:
  quote: ''
  summary: TxamsEm, hungry and seeking food, enters the house of Chief Echo, where
    unseen voices welcome him, food and utensils move by themselves, and unseen women
    reveal his thoughts when he plans to steal hanging fat. After he snatches meat
    and fat, a stone hammer injures him and he is cast out. He then enters the house
    of Little Pitch and his wife, who feed and heal him. TxamsEm later keeps Little
    Pitch fishing past sunrise despite Little Pitch's warning about the sun; Little
    Pitch weakens, melts into pitch, dies, and the pitch blackens one side of the
    halibut.
  language: English
  quote_policy: summarized
