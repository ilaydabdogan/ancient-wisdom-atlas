canonical_text:
  quote: ''
  summary: The passage first concludes a story in which a starving chief and people
    return to the old town of a deserted prince, who eventually pities them, rewards
    his beloved youngest uncle, marries the uncle's daughter, distributes whale and
    blubber, gains wealth through trade and potlatches, takes new names, and is continually
    supplied with sea food by eagles. It then begins a new tale set soon after the
    Deluge, where a rebuilt town grows numerous, a chief closely guards his daughter
    Su-da'"!, and an unnamed young man visits her at night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief tells his great slave to order the people to return to the old town
    and ask the prince for pity because they may die of starvation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief, his brothers-in-law, and his people move from Nass River back to
    the old village at Sandbar Town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eldest uncle dresses his two daughters and places them on a box in his
    canoe because he expects his nephew to marry them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the canoes arrive near Port Simpson, grease covers the water, and one young
    woman dips her fingers into it and eats it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince sees the arriving canoes, questions the people, forbids them to
    land, threatens to shoot them with arrows, and then takes pity on them after they
    plead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The prince asks for his beloved youngest uncle and does not allow the others
    to land until that uncle arrives.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: When the youngest uncle arrives, the prince gives him a whale, and the uncle
    gives his beautiful daughter to the prince as wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The next morning the two girls in the eldest uncle's canoe eat grease from
    the water; the prince is ashamed and does not want to see them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prince cuts whales for his father and uncles, opens his blubber storehouse,
    gives portions to men, women, and children, and invites the people to his marriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Other tribes buy provisions from the prince with skins, slaves, canoes, abalone
    shells, blankets, and other goods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The prince becomes richer than the other chiefs, holds potlatches, takes the
    names H^sdii and Deserted One, and gives away many valuables.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Eagles give the prince whales, sea otters, sea lions, seals, salmon, halibut,
    and other fresh fish throughout his life.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the Deluge, a new town is built where the old town had been, and people
    become numerous at Prairie Town.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: A chief has a beautiful daughter; many princes seek to marry her, but her
    parents refuse them because the chief wants her to marry a high prince.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The chief watches his daughter at night, places her bed above his own, and
    permits her to walk in the village only with young women once each year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The princess's mother is named Gundax, and the princess is named Su-da'"!.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: After many years, an unnamed young man comes to the princess at night; he
