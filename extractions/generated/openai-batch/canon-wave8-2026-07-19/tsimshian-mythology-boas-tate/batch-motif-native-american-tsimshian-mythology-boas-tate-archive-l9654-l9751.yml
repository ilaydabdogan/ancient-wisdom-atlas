canonical_text:
  quote: ''
  summary: 'The passage contains the end of one narrative, in which a wife who rejoices
    at her husband''s presumed death is shut outside, transformed into a hooting owl,
    and later causes the man''s death. It then begins the narrative of a local winter
    at Git-q!a''°da: famine follows a snowfall after G''augun reproaches Heaven, the
    people die until only a newly married prince and his wife remain, their child
    dies, and a blue jay drops ripe elderberries through the smoke hole, which the
    wife interprets as a supernatural sign that summer has come.'
  language: English
  quote_policy: summarized
