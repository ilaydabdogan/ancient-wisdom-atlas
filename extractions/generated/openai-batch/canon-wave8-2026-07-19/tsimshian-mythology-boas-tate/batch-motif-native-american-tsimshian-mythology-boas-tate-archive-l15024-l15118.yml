canonical_text:
  quote: ''
  summary: The passage combines the close of a tale in which a hunter returned by
    the White Bear becomes violent, is cured, and teaches ceremonial dances; a Wolf
    Clan origin account involving war, flight, ice-cave passage, reception by chiefs,
    name-taking feasts, and migration; and the opening of a war tale describing intertribal
    chiefly marriages, children, succession, and chiefly wealth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The White Bear takes the hunter back to his home and places him on top of
    a tree, where people see him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hunter slides down the tree on his back, attacks and eats people, and
    kills many before the tribe overpowers him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tribe cures the hunter by medicine, and after recovering his senses he
    teaches dances of four companies that he had seen in the mountain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that since that time the people have had the Cannibal dance
    and the Dog Eaters' dance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Wolf Clan is said to have originated in Alaska; after a Tahltan war in
    which Gus-xg'ain and Lagunus were killed, their nephews and six Wolf Clan brothers
    fled from enemies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two of the fleeing brothers crossed the mountains to Nass River, while four
    traveled down Stikine River by canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The four brothers reached a glacier blocking the valley, sang a mourning song,
    entered an ice cave where the river ran under the ice expecting to drown, and
    passed safely through.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The four brothers saw smoke from a village, feared being killed, camped until
    night, were approached by warriors sent from the village, spoke kindly, and were
    invited into the chief's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After hearing that the four brothers belonged to the Wolf Clan and learning
    the names of their slain uncles, the Stikine chief gave a great feast and took
    the name Gus-xg'ain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Later wars among Stikine people led some Tahltan brothers to Tongass and one
    to the Tsimshian, which the passage gives as the reason there are not many Wolf
    Clan people among the Tsimshian.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two brothers who crossed to Nass River were taken into the Nass chief's
    house, explained their flight and clan identity, were claimed as relatives, and
    were taken as nephews after the chief gave a feast and took the name Gus-xg'ain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The supplement introduces war tales involving the Gi-spa-x-la'°ts and the
    Git-dzi'°s, described as expert warrior tribes.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says that in olden times a great chief customarily took a princess
    from each tribe as wife, sometimes having many wives.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Chief Dzeba'sa has many wives; his first wife Gan-dE-ma'xl is a Gi-spa-x-la'°ts
    princess seated at his right, and his second wife Xdze°dz-yu-wa-xsa'ntk is a Git-dzi'°s
    princess seated at his left.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The eldest son of Dzeba'sa's first wife succeeds his grandfather as chief
    of the Gi-spa-x-la'°ts and is honored with feasts, dances, wealth, slaves, canoes,
    garments, and provisions.
  category: sequence
  evidence_refs:
  - ev:10
