candidate_motifs:
- id: motif:1
  label: dangerous return from mountain encounter becomes origin of ceremonial dances
  taxonomy_refs:
  - initiation
  - return
  basis: A hunter returned by the White Bear behaves violently, is cured, and then
    teaches dances he saw among four mountain companies, after which named dances
    exist among the people.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins at the end of a preceding tale, so the full circumstances
    of the hunter's mountain encounter are not included here.
- id: motif:2
  label: clan origin through flight after war and migration
  taxonomy_refs:
  - departure
  basis: The Wolf Clan origin account explains war, deaths of chiefs, the flight of
    six brothers, division into routes, and later settlement among Stikine, Tongass,
    Nass, and Tsimshian peoples.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  confidence: high
  cautions: The motif label is descriptive; no specific external taxonomy entry for
    clan-origin migration is provided.
- id: motif:3
  label: perilous passage through ice cave under water
  taxonomy_refs: []
  basis: The four brothers sing a mourning song, enter an ice cave under a glacier
    where the river runs beneath the ice expecting to drown, and emerge safely.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this as a dangerous travel episode; any initiatory
    or afterlife reading would require external interpretation not supplied here.
- id: motif:4
  label: name-taking feast establishes kinship and chiefly connection
  taxonomy_refs:
  - royal_legitimacy
  basis: Both Stikine and Nass chiefs respond to the brothers' Wolf Clan identity
    and slain uncles by giving feasts and taking the name Gus-xg'ain; the Nass chief
    also takes the brothers as nephews.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The passage supports name-taking and kinship recognition, but the exact
    ritual or political meaning of the feast is not explained in detail.
- id: motif:5
  label: intertribal princess marriages and chiefly succession
  taxonomy_refs:
  - royal_legitimacy
  basis: The war-tale opening describes chiefs marrying princesses from different
    tribes, ranked seating of wives, named descendants, and succession of the eldest
    son to his grandfather's chiefship with public honor and wealth.
  evidence_refs:
