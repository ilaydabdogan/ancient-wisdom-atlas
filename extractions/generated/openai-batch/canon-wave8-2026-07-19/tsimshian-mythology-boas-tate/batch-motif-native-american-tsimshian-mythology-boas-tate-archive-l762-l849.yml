canonical_text:
  quote: ''
  summary: TxamsEm creates a slave named Lgum from rotten spruce wood, equips himself
    with clamshell ear-ornaments, and has the slave announce him as a great chief.
    At one village he feigns death from codfish oil so the inhabitants will move away
    and leave dried codfish behind; the slave traps him in the grave-box long enough
    to eat the best codfish before releasing him. At another village the slave denies
    TxamsEm desired crabapples and eats them himself. TxamsEm later leads him across
    a fragile skunk-cabbage bridge over a canyon; the bridge breaks, the slave falls
    and bursts open, and TxamsEm eats the food from his stomach.
  language: English
  quote_policy: summarized
