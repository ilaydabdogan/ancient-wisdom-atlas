canonical_text:
  quote: ''
  summary: During a house dance, a mountain appears and a Mountain Goat destroys the
    house, killing the people except for Really Black. A goat friend explains that
    the Mountain Goats took vengeance because hunters left goat remains to decay instead
    of burning them. The goat friend repays Really Black's earlier kindness by giving
    him a garment and instructions for descending the steep mountain and reviving
    relatives by jumping over their ordered bodies four times. The revived people
    later burn the goat bones, meat, and skins.
  language: English
  quote_policy: summarized
