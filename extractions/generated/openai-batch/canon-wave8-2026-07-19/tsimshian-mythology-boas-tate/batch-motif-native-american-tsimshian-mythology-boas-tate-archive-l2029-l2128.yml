- id: obs:4
  text: On a later hunt, young men kill many mountain sheep on top of a mountain and
    slide them down the mountainside while TxamsEm watches secretly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: TxamsEm drags many carcasses to the beach and hides them; the young men track
