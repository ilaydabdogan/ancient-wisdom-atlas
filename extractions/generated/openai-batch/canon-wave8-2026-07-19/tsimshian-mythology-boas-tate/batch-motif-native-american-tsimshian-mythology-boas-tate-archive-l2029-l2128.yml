canonical_text:
  quote: ''
  summary: 'TxamsEm is fed by Chief Wolf, is accused of hiding mountain sheep carcasses,
    secretly follows hunters, takes game, and escapes pursuing Wolves by wearing a
    raven garment and fleeing to a floating log. The narration gives etiological explanations
    for safe canoe travel and a place-name. Later, TxamsEm returns from the north,
    hosts a potlatch for monsters, commands them to become rocks, becomes a raven-shaped
    stone himself, while the devilfish escapes to the sea bottom. The passage then
    begins another account: Chief T!Em-nunx builds a famed carved house that attracts
    people, animals, TxamsEm, and finally a giant visitor at midnight.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief Wolf's house is full of mountain sheep, the Wolves are glad, and Chief
    Wolf feeds TxamsEm during a great feast although no one else speaks to him.
