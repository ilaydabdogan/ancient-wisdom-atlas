  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: After many years away, TxamsEm returns from the north wearing the old raven
    garment and gives a potlatch to all the monsters on an outer island.
  category: action
  evidence_refs:
  - ev:4
