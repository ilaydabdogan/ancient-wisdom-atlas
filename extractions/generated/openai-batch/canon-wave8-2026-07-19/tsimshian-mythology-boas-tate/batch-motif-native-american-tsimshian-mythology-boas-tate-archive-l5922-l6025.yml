canonical_text:
  quote: ''
  summary: A young man obtains bark and sap from an enormous devil's-club tree, washes
    with it and eats some for forty days, and then resumes trapping. A great Wolverine
    disrupts his traps, and the young man repeatedly chases and threatens him. Wolverine
    gives several plant-based answers, laughs, and flees, before finally identifying
    rotten fern as his true secret. The young man uses rotten fern in eating and bathing,
    becomes an expert and wealthy hunter, marries his uncle's younger daughter, and
    has a son. Later, when a white she-bear comes down the ice of the Skeena River,
    the man goes after her with a spear; she kicks the ice, and he drowns beneath
    it while she reaches the bank. The passage then begins the next tale, stating
    that in olden times many animals married women and introducing a young woman whose
    parents refused all suitors.
  language: English
  quote_policy: summarized
