canonical_text:
  quote: ''
  summary: 'Halus fails in a sling feat after Tsauda blows water and speaks against
    him, while Tsauda strikes a large copper on a high mountain. Men and women blow
    water and direct the copper, which divides and flies toward Alaska and the river
    heads, explaining living copper. The passage then turns to fishing: Tsauda again
    uses water-blown speech so Halus''s bag net brings up mud, leaves, and rubbish
    instead of fish, while Tsauda fills canoes for his affinal kin. In shame, Halus
    jumps into the water and drowns, declaring he will become Tsauda''s snag; Halus''s
    wife jumps after him and declares she will be his codfish.'
  language: English
  quote_policy: summarized
