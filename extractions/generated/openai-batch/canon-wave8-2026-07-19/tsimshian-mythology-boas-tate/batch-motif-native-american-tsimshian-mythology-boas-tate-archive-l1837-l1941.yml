canonical_text:
  quote: ''
  summary: Chief Grouse obtains mountain goats by shooting arrows at a cliff, calling
    four times, and answering a bright supernatural young man correctly. TxamsEm secretly
    observes, imitates the act, answers proudly that the arrows are his own, and loses
    his arrows. He cuts out part of his intestines, wraps them on a staff, and returns
    home; his children cook them, causing him to faint or die. Chief Grouse throws
    his body down the mountain. TxamsEm comes back to life without intestines, explaining
    why the raven has no intestines. He then travels weakly toward Chief Wolf's village,
    receives guidance from hunters and a tomtit, and tells the tomtit a self-exculpating
    version of events.
  language: English
  quote_policy: summarized
