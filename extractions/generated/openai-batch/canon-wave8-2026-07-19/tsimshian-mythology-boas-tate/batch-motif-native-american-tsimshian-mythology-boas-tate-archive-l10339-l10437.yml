- id: obs:1
  text: The steersman speaks in his own house while people crowd around him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a return canoe journey from camp, the travelers hear someone shout
    behind them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young woman stands on the beach with her face blackened with charcoal as
    a mourning sign and asks to be taken in the canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince tells the canoe party to turn back, goes ashore, and stretches
    out his arms to embrace the young woman because he is pleased with her appearance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the prince tries to embrace her, the young woman vanishes from sight
    and the prince sees only a frog leaping away; this happens three times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the canoe party ceases heeding her, the woman foretells that the prince,
    other canoe occupants, and the steersman will die in sequence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After finishing his account, the steersman falls back and dies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The villagers take and bury the bodies of the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old woman tells the chief and assembled villagers that she had a bad dream.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman instructs the chief to dig a deep hole in the middle of his
    house and place his only daughter in it; valuables and garments are put into the
    hole before the girl enters and is covered over.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old woman says she dreamed that fire fell from heaven and consumed the
    village, and that fire fell on the top of a mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A firebrand falls on the mountain, streams downward like water, surrounds
    the village, and the water in front of the village burns like oil; the villagers
    cannot escape and are burned up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Only Princess Omen, hidden in the hole, and the old woman, hidden in the ground,
    are saved.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: While in the pit, Omen hears the fire passing over her and later hears the
    old woman crying and singing a mourning-song about gathering bones.
  category: sequence
  evidence_refs:
  - ev:9
