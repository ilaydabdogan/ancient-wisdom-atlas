canonical_text:
  quote: ''
  summary: A steersman recounts a canoe journey in which a mourning young woman appears
    on the shore, vanishes as a frog when the prince tries to embrace her, and foretells
    several deaths. The steersman dies after telling the story. Later an old woman
    reports a dream, has the chief's daughter Omen hidden in a pit with valuables,
    and announces a heavenly fire that falls on a mountain and burns the village.
    Omen and the old woman survive underground, and Omen hears the old woman mourning
    above her.
  language: English
  quote_policy: summarized
