canonical_text:
  quote: ''
  summary: TxamsEm learns to steam salmon in a hole, sends white crows for dishes,
    and curses the crows black after they eat his salmon. In the following episode,
    TxamsEm meets Lagobola, a southern man with supernatural power. They hunt near
    Dundas Island, Lagobola dries up water and produces fog with his cap, and the
    two later hold a shooting wager staking Skeena River against Nass River. TxamsEm
    claims victory despite Lagobola seeing the opposite, and the result is linked
    to olachen coming to Nass River twice each summer and Skeena River salmon remaining
    fat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm asks his excrements what to do about preparing food, and they answer
    that he should steam it in a hole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: TxamsEm gathers firewood, heats stones, places red-hot stones in a hole, covers
    salmon with skunk-cabbage leaves, and pours water on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: White crows gather over TxamsEm after the salmon is done.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: TxamsEm asks the White Crows to borrow dishes, but they bring mussel shells,
    clamshells, and other shells instead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When TxamsEm goes to get real dishes, the crows eat his salmon and place a
    large hemlock tree over the cooking hole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: TxamsEm returns to find the hole empty, crow excrement on the ground, and
    many crows in a tree; he curses them so that they will be black.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: TxamsEm goes down the river to its mouth and meets Lagobola, who says he comes
    from the south and has heard of TxamsEm's fame and supernatural power.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: TxamsEm and Lagobola go toward Dundas Island to hunt sea otters; TxamsEm kills
    three seals and two sea otters before they camp and eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lagobola has dried up the brooks, and TxamsEm obtains water by placing one
    foot on Dundas Island and the other on the mainland at the mouth of Skeena River.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lagobola removes his hunting-cap and fog arises; when he puts the cap upside
    down in his canoe, thick fog lies on the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: TxamsEm loses his way in the fog, becomes afraid, cries out to Lagobola for
    pity, and later says he was only singing in his canoe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lagobola gathers the fog from the water, puts it in his cap, and the fog clears
    away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At a point on Skeena River, TxamsEm proposes gambling by a shooting-match,
    with Skeena River staked against Nass River.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Before shooting, TxamsEm squirts water from his mouth and says that Lagobola's
    arrow should fall farther away and his own should hit the goal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Lagobola sees his own arrow strike the rock and TxamsEm's fall aside, but
    TxamsEm repeatedly claims he hit it; Lagobola concedes the win.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Lagobola says olachen will come to Nass River twice every summer, and TxamsEm
    says the salmon of Skeena River shall always be fat.
  category: speech
  evidence_refs:
  - ev:9
