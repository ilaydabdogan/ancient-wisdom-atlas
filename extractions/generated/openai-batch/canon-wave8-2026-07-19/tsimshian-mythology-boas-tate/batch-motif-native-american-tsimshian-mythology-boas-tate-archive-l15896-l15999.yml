canonical_text:
  quote: ''
  summary: A Tsimshian group led by ten brave young men and their father builds a
    fortified house with false sleepers and sound-making kelp, lures Tlingit enemies
    inside, traps and kills them, displays trophies, distributes captured goods at
    a feast, mounts a further raid, and restores Tsimshian control and seasonal movement
    between Nass and Skeena River areas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The group moves in two canoes to the deserted village K-xIen and builds a
    large square house with a double wall stockade of fresh firs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The house is fitted with a high upper floor, a little stream through one corner,
    and a heavy gate at the doorway.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Decayed wooden human forms are carved, dressed with garments, and placed to
    look like people lying in beds, with two figures in some beds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Fresh kelp is arranged from the second floor and used to make a sound like
    snoring; split pitch wood is scattered through the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A large smudge is made so that the Tlingit see the smoke, assemble, and come
    by canoe toward the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father uses a wooden drum and sings while the young men remain in the
    house with the door covered by old mats and a large fire burning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: One young man fetching water sees enemies nearby, informs his brothers, and
    the group secretly goes to the upper floor before blowing through the kelp after
    the fire has died down.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tlingit enter the house, stab the wooden images, and cannot withdraw their
    knives because the handles are tied to their wrists.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The heavy fir gate slides down at the doorway, presses people down, and prevents
    escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ten brave men spear and kill the people in the house from the upper floor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Tsimshian men pursue escaping canoes, kill the people in one canoe, and
    only one canoe succeeds in escaping near Dundas Island.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Heads are cut off, heads are hung from poles in a canoe, scalps are taken,
    skulls are thrown into the creek, and captured canoes and valuables are taken.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The father sends five messengers to invite Tsimshian chiefs, who come by canoe
    and view the bodies and skulls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The eldest son gives a great feast, distributes captured goods to the chiefs,
