canonical_text:
  quote: ''
  summary: A young chief warns his people to flee to the hills when flood and foam
    come with approaching monsters. The supernatural chiefs arrive in storm and flood,
    while the chief, his mother, and sister remain. The chief’s fire is not extinguished.
    Young men serve a feast to the supernatural guests, food and carved vessels are
    cast into the fire, and the chief distributes wealth to the guests. He asks two
    dangerous chiefs to move to the back of Canoe Pass, and they consent. A second
    storm and flood come; Chief K-gazoun calms the water with seal oil. After the
    monsters depart, the people return and find two carved houses given by the monsters.
  language: English
  quote_policy: summarized
