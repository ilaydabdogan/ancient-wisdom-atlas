- id: obs:1
  text: On the following morning, a great dark bar is seen at Crabapple-Tree Point
    below the camp.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince tells his people to flee into the woods and hills, not to come
    down when floods of water and foam swamp the houses, and to recognize the second
    flood as a sign that the visitors have left.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Monsters come up Nass River during a wind storm, and floods of water and foam
    cover the houses of the young chief, his mother, and his sister.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Only the young chief, his mother, and his sister remain in the camp while
    the rest of the people hide behind the camp on the hill.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fire of the young chief who invited the supernatural beings cannot be
    extinguished by the flood.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hidden people hear the voices of the young chief and his mother in the
    houses below; then the storm ceases, the floods decrease, and the houses appear
    out of the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The young chief calls the young men down from the woods to help serve food
    to the chiefs, and the young men see strange forms sitting around inside the chief’s
    house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two of the supernatural guests, Spagait-an-a'tk and K-knaaze, are described
    as the ugliest; all the supernatural beings wear crests on their heads and garments.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young chief takes the name Down The Useless River, and his sister takes
    the name Killer Whales Are Ready To Go Up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Food is placed in carved dishes and boxes, and dishes, boxes, spoons, and
    food are thrown into the fire during the feast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The chief gives away elk skins, fur garments, goat fat, tobacco, ocher, and
    costly coppers to the supernatural chiefs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The chief asks Spagait-an-a'tk and K-knaaze to take their place far back of
    Canoe Pass because they are hard for human beings to pass, and the monsters consent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: On the next day the young chief again tells his attendants to flee up the
    hills; wind, flood, foam, and water cover the houses through the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Chief K-gazoun pours seal oil on the water, and the water becomes calm.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After the monsters are gone, the people see the chief’s house carved with
    a great starfish covered with abalone shells and another house carved with a large
    bullhead with five children on its back.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: The two carved houses are said to have been given to the chiefs by the monsters,
    and the chief’s tribe and the chief and his sister love one another.
  category: relationship
  evidence_refs:
  - ev:6
