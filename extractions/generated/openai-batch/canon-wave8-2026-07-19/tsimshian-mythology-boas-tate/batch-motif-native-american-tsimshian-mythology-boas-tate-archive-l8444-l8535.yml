canonical_text:
  quote: ''
  summary: 'The passage first concludes a preceding episode in which a young chief
    gives valuable gifts to his wife’s kin, marriages repopulate an empty village,
    he adopts the monster woman as a crest, kills two monsters, frees an island for
    sea-otter hunting, and becomes great. It then begins “The Prince Who Was Deserted”:
    a chief’s only son makes arrows and feeds salmon to eagles to obtain feathers
    for swift arrows. In winter, after food becomes scarce, the father orders the
    prince’s maternal uncles not to feed him. The prince is denied food at home and
    is successively humiliated by three uncles, each of whom has salmon prepared and
    placed before him but then takes it away, saying that the eagles he fed should
    now feed him.'
  language: English
  quote_policy: summarized
