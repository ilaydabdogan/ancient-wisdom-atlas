canonical_text:
  quote: ''
  summary: The passage recounts several episodes involving TxamsEm, also called Giant.
    He tries to retrieve a distant sea egg by borrowing animal sinews, and Tomtit
    succeeds with very thin but strong sinews and is made chief over the animals.
    Giant then reaches an old woman who holds the tide-line; after he causes her to
    release it and later heals her, she agrees to slacken it twice daily, explaining
    the tides. He gambles with Sea Gull and obtains one olachen. He then uses olachen
    spawn and a tail as evidence to persuade the people in Kuwask's house that olachen
    have already gone upriver; after consultation with several olachen chiefs, the
    olachen are released into the water, and Giant sends them upriver, explaining
    early spring olachen fishing on the Nass River.
  language: English
  quote_policy: summarized
