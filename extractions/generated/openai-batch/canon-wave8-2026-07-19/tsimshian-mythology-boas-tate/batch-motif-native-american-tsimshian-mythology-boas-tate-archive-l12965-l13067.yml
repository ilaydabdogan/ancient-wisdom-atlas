canonical_text:
  quote: ''
  summary: A young prince, Asagulyaan, is protected by supernatural foreknowledge
    from his father's murderous intent. He publicly claims his grandfather's greatness,
    names his sister, distributes costly gifts, and provokes his father, the existing
    head chief. At night he sends a living arrow through his father's heart. The arrow
    is later seen to have reptile-like and dog-toothed features and is named guldana.
    After mourning and mortuary gift distribution, Asagulyaan is insulted with a small
    elk skin and accused of killing his father. He then emerges ceremonially from
    his house and releases the living arrow, which kills many assembled people and
    returns to him full of blood.
  language: English
  quote_policy: summarized
