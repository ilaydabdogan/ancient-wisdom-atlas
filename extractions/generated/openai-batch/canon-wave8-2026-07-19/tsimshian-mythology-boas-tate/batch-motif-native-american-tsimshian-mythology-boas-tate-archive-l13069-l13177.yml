canonical_text:
  quote: ''
  summary: Asagulyaan repeatedly emerges from his house through the smoke hole amid
    shouting, drums, clapping, and rising down, descends a ladder, leaps over a rock,
    and releases a living arrow that kills and devours attackers. Nes-wa-ma'k and
    the tribes arrange successive attacks, but the tribes fail. Wiludal warns his
    relatives not to fight Asagulyaan, calling him supernatural and his arrow alive,
    but they ignore him and are killed, leaving only a little grandson. Wiludal, mocked
    as an old blind man, has his grandson guide him behind the leap-rock and tell
    him when the mist of down rises; he shoots Asagulyaan through the eye and kills
    him. Asagulyaan's sister then dons his paraphernalia and a wolf helmet, attempts
    to replace him in battle, is recognized as a woman, and flees. She throws away
    the wolf helmet, which becomes a visible rock, and her footprints remain on the
    rocks. The tribe is scattered, the live arrow flies howling toward its home at
    sunset and does not return, Wiludal is honored, and the story is said to have
    been kept by the Wolf Clan.
  language: English
  quote_policy: summarized
