candidate_motifs:
- id: motif:1
  label: Copper-bearing beaver as clan crest and chiefly sign
  taxonomy_refs:
  - royal_legitimacy
  basis: The beaver's copper parts are taken after it is killed, and the beaver becomes
    the exclusive Eagle Clan crest and a headdress worn by the head chief to display
    chiefly status.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage supports chiefly and clan status use; the taxonomy ref is
    approximate because the text speaks of a head chief and crest rather than royalty
    in a strict sense.
- id: motif:2
  label: Human princess taken into underwater supernatural marriage
  taxonomy_refs:
  - stolen_beloved
  - sacred_marriage
  basis: Sagapgia disappears amid foam, wise men say the Sandy Bay supernatural being
    took her, and shamans and Mouse Woman connect her to marriage with the supernatural
    being's son.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The initial taking is inferred by characters in the passage rather than
    narrated through direct visual description of the taker.
- id: motif:3
  label: Sacrifice transfers goods to a supernatural underwater household
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Sagapgia's uncle sacrifices many valuable goods for her sake, and Sagapgia
    sees the goods enter the Sandy Bay chief's house at the bottom of the sea.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes the transfer but does not explicitly state a negotiated
    return or reciprocal obligation.
- id: motif:4
  label: Child sent by river and made to grow quickly
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The supernatural chief commands Useless-River to send a baby girl; Sagapgia
    conceives the next morning, and the chief makes the children grow quickly.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The second child's conception is directly linked to the river command;
    the first child's conception is not described in the same way.
- id: motif:5
  label: Post-Flood origin place
  taxonomy_refs:
  - flood_and_renewal
  basis: The introductory note says old Metlakahtla is where, after the great Flood,
    all villages of all tribes took their beginning.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This appears as an introductory contextual statement rather than as an
    enacted flood narrative within this passage.
