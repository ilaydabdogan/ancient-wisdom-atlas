canonical_text:
  quote: ''
  summary: 'The passage first recounts an unnamed prince who, mourning brothers swallowed
    by a supernatural halibut, sees a large beaver with copper eyes, ears, teeth,
    and claws in a lake. The people drain the lake, kill the beaver, remove the copper
    parts, and take the beaver as the Eagle Clan crest and chiefly potlatch headdress.
    A new story then begins: Princess Sagapgia disappears from a canoe amid foam over
    a sandbar near the Skeena River. Wise men and shamans say she has been taken by
    the supernatural being of Sandy Bay and married to his son. Her uncle makes extensive
    sacrifices, which enter the underwater house. Mouse Woman instructs Sagapgia to
    burn a woolen ear-ornament and tells her where she is. Sagapgia remains there,
    bears a son, later conceives a daughter after the supernatural chief addresses
    Useless-River, and the children are made to grow quickly before a feast for supernatural
    beings of the rocks.'
  language: English
  quote_policy: summarized
