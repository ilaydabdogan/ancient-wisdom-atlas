canonical_text:
  quote: ''
  summary: 'A starving prince and his wife leave their snowy old home, travel downriver
    into summer conditions, and survive by catching trout, eels, and salmon with traps
    and a weir. They build a canoe, move to Ksdal, hunt goats, cross a lake and mountain
    after seeing smoke in another valley, and encounter four young men who later marry
    into the family. The four young men are identified as offspring of a wild duck
    sent by the daughter of the South Wind. Their descendants are born in sets of
    four, become a large people, and are associated with heavy snowdrifts. The passage
    explains a taboo against throwing stones at wild ducks in winter. A new tale begins:
    after a war between the GispawadwE''da and Eagle Clan, the defeated Eagle chief
    and his niece flee across mountains to Eagle relatives on the Nass River, where
    the chief is received and becomes chief.'
  language: English
  quote_policy: summarized
