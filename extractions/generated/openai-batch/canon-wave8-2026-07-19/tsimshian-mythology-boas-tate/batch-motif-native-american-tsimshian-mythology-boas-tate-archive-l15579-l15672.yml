canonical_text:
  quote: ''
  summary: Haimas intimidates his brother-in-law and accompanying men by destroying
    a small dagger, displaying large stores of weapons, and throwing daggers into
    the board near them. He then receives his uncle and father-in-law Nes-y!aga-ne't,
    questions him about Tsimshian chiefs during his long absence, becomes angry over
    reported songs and lack of remembrance, orders Nes-y!aga-ne't killed, publicly
    laments him with a copper under his head, and searches unsuccessfully for Nes-y!aga-ne't's
    Raven headdress because QtsPl has hidden it in an old fish basket. The Git-dzi'°s
    and Haimas's people move up Nass River with the chief's body.
  language: English
  quote_policy: summarized
