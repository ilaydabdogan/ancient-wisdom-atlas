- id: obs:1
  text: The men are afraid and are asked to sit on a thick board; Watk has a small
    dagger hanging around his neck, which Haimas asks to see.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas laughs at the small dagger, orders an attendant to throw it into the
    fire, and says he will give daggers to his brother-in-law and the men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haimas has ten boxes full of daggers; he throws daggers one by one so that
    their points enter the board near his brother-in-law and the other men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Haimas shows bundles of spears, boxes of arrows and spears, war-clubs, stone
    and bone clubs, stone tomahawks, sling-stones, armor, and helmets in his large
    square house.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After showing the weapons to his brother-in-law, Haimas sends him away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nes-y!aga-ne't, described as Haimas's uncle and father-in-law, is brought
    down to Haimas's village with his people and property; Haimas welcomes him with
    a dance and food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the meal, Haimas asks what the Tsimshian have done during his long
    absence and asks whether chiefs remember him; Nes-y!aga-ne't says new chiefs are
    numerous and nobody remembers Haimas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nes-y!aga-ne't reports songs associated with Chief Dzeba'sa; when the phrase
    about great Firewood is mentioned, Haimas says they are using his name and becomes
    angry.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After Nes-y!aga-ne't leaves the house, Haimas orders an attendant to kill
    him; the attendant strikes him until he lies dead on the beach.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Haimas runs down, takes a valuable copper, laments his uncle, lifts the dead
    man's head, and puts the copper under it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Haimas and his warriors search for Nes-y!aga-ne't's Raven headdress, but QtsPl
    has already hidden it in an old fish basket at the door.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Git-dzi'°s move up Nass River with their chief's body, and Haimas also
    moves up the river with his own people.
  category: sequence
  evidence_refs:
