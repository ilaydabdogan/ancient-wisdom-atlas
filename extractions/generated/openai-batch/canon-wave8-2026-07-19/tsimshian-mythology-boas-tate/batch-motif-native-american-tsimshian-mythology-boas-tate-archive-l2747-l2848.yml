canonical_text:
  quote: ''
  summary: The passage names three children of a chief. The younger son, troubled
    by continuing darkness, makes a burning pitch-wood mask and runs across the sky
    from east to west, producing light. The people ask that he slow down, and his
    sister Support Of Sun holds him in the middle of the sky, explaining the Sun's
    pause. The elder son, after being scolded, marks one side of his face with charcoal
    and rises in the east as the Moon. A council of animals then assigns the Sun its
    daily role and settles the length of the month after Dogs propose forty days and
    Porcupine argues for thirty days and twelve months in the year.
  language: English
  quote_policy: summarized
