canonical_text:
  quote: ''
  summary: 'The passage ends the story of Sucking Intestines: attendants watch a chieftainess''s
    coffin in a tree, the chief''s nephew enters or speaks with her, the coffin is
    thrown down, and a living baby is found among the mother''s intestines. The boy
    grows up, repeatedly visits the island and spruce tree associated with his mother''s
    coffin, and is finally taken and killed by a flame while gum is being burned.
    The passage then begins the story of Burning Leggings and Burning Snowshoes, describing
    a chief''s jealous first wife, a favored young wife with hunter brothers, and
    an episode involving red ocher requested through a slave-girl.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief sends two attendants to watch the chieftainess's coffin and orders
    them to throw it down if what was reported is true.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attendants see the chief's nephew climb the tree to the coffin, kick it,
    address the chieftainess as a ghost, and hear the chieftainess laugh and reply
    from the coffin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At midnight the attendants climb the tree, throw down the large coffin, the
    chieftainess's body bursts, and the chief's nephew is killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A living baby boy is found among the intestines of his mother and is named
    Sucking Intestines because he is sucking them.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The chief orders the child brought to him, appoints a good female slave as
    nurse, raises the child in his house, and loves him very much.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When able to walk, the boy often goes to the little island to get chewing-gum
    from spruce trees, especially the spruce tree on which his mother's coffin had
    been placed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief and his slaves burn gum for the boy on the island on repeated occasions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A flame of fire, described as like a tongue, takes the boy away from the chief;
    the boy is burned to death, and the chief mourns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The little island is said still to be called Where She Pretended To Make Grubs
    Out Of Herself.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the next narrative, a great chief loves a young woman more than his first
    wife, and the first wife is jealous.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The young woman has four hunter brothers who visit annually and bring provisions;
    she gives birth to a boy, increasing the chief's love for her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: During gambling, the eldest brother uses red ocher from a small leather bag,
    and the first wife sends a slave-girl to ask him for some and to say she will
    meet him privately.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The eldest brother refuses to meet the chieftainess or wrong his brother-in-law,
    but gives half of the red paint through the slave-girl.
  category: speech
  evidence_refs:
  - ev:7
