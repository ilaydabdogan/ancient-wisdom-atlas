canonical_text:
  quote: ''
  summary: The passage concludes a narrative in which a young man uses a made eagle
    form to descend into a deep valley, recover his sister from a house where large
    animals sleep, and return home. He warns his chief father, whose people prepare
    sharpened young trees and canoes. The Snails or large animals pursue, are fought
    on the water, and are killed near Beaver-Tail Island; their fat becomes shellfish
    and land snails. The passage then begins the story titled “The Otter Who Married
    the Princess,” introducing a post-Deluge setting, a chief’s daughter who refuses
    her cousin, and a fern-root gathering camp where the princess is cold and is urged
    by her aunt to go with her cousin.
  language: English
  quote_policy: summarized
