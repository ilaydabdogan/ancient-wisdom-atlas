canonical_text:
  quote: ''
  summary: A young woman, saddened because her husband has married another princess,
    is comforted and married by a supernatural shining young man. He is associated
    with a supernatural chief and K-xamin. Their child is born like his supernatural
    father. The former husband tries to take the woman back, but she refuses. The
    supernatural husband repeatedly provides food for her father, while the former
    husband lacks salmon. After the second wife mocks the young woman and organizes
    a crabapple-picking party, the supernatural husband tells his wife to go with
    containers and mats because his father's slaves will gather crabapples for her.
    A crabapple tree shakes with no visible picker, and piles of fruit appear on the
    mats. The fruit is cooked with heated stones and water, and the pickers are identified
    as silver-blue cod, slaves of the supernatural spirit associated with Mount K-xamin.
  language: English
  quote_policy: summarized
