canonical_text:
  quote: ''
  summary: The passage describes Chief LEg'e'ox receiving Chief Sdi'ida and Haida
    visitors with chiefly protocol, dancing, food, gift exchange, the breaking of
    canoes and cargo, reciprocal presentation of coppers, slaves, a name, grease,
    robes, skins, and protective escort. It then recounts later events involving the
    Hudson Bay Company, Mr. Kennedy's marriage to LEg'e'ox's daughter, a request to
    move from a cold Nass River post, LEg'e'ox's statement that the land belonged
    to all Tsimshian tribes while his Rose Island camping-place could be lent temporarily,
    and a subsequent Haida trading visit at Rose Island.
  language: English
  quote_policy: summarized
