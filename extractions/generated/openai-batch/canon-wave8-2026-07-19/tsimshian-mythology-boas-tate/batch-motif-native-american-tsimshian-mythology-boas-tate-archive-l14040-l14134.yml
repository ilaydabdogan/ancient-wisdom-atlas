canonical_text:
  quote: ''
  summary: Only One relocates a spring, cures a sick shaman after hostile men try
    to kill him, survives a cannibal corpse-meat trap by reversing it on the givers,
    and then prepares for and undertakes a dangerous canoe journey to Chief Bagus's
    house to treat Bagus's sick son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man dies of shame, and the shaman returns home by canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only One says he will take a spring of water to his own house, carries it
    in his grizzly-bear garment, and the spring at its former place dries up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Only One opens his grizzly-bear garment before reaching his own town and places
    the new spring there; the passage states that it remains there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men from G'it-qxa'la summon Only One to a sick shaman and try to kill him,
    but Only One's supernatural power foretells their intent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Only One finds the sick shaman very thin, identifies the cause as a supernatural
    power placed in a corpse bone, removes it, and the sick shaman revives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A cannibal dancer invites Only One and his attendants to eat cooked seal,
    while three cannibals tend a cooking box that contains meat of dead people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The cannibals intend that eating flesh of dead people will make Only One die
    and make his supernatural power flee from him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Only One's supernatural power warns him about the corpse flesh and instructs
    him to eat it, remove it through his left side, and give pieces to the givers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Three men present meat to Only One on pointed staffs; Only One swallows the
    pieces, opens his left side, rubs it, and pulls the corpse meat out.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Only One gives the extracted corpse meat back to the three men to eat, and
    the three men die; the people become afraid of him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Only One's supernatural power foretells that three messengers from Chief Bagus
    will come because Bagus's son has long been sick and no shaman can cure him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The supernatural power tells Only One to take his chamber-vessel and, whenever
    he is nearly unconscious, to take urine into his mouth and blow it into the air
    above his head.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: At midnight Only One departs in a new canoe with the messengers, wearing a
    grizzly-bear-claw crown and apron, holding a live rattle in his right hand and
    a root-basket chamber-vessel in his left.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The messengers tell Only One to lie down, but he stays awake because his supernatural
    power tells him the messengers are dangerous animals and that he may die if he
    sleeps.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: When Only One feels he is losing consciousness, he blows urine into the air;
    his heart becomes strong again, and the smell frightens the three men.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: At Chief Bagus's house, the sick prince lies inside while an old shaman sits
    by his foot holding a rattle.
  category: setting
  evidence_refs:
  - ev:12
