canonical_text:
  quote: ''
  summary: A canoe steersman is lowered by a cedar-bark line into a dark pit, enters
    a supernatural house, witnesses shamanic beings and self-moving ritual objects,
    and receives supernatural powers. After returning, signs of power appear among
    the canoe party, and the central man later becomes the named shaman Only One,
    famed for healing and reviving the dead. Rival shamans become jealous, and a village
    chief summons him under false pretenses, but his supernatural power exposes the
    deception.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The steersman had a cedar-bark line tied around his body and was lowered gently
    to the bottom of a dark pit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the bottom of the pit he heard a thunder-like noise, an east-side door
    opened, and a hairy young man asked why he had come.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitor said they needed a great shaman, and the hairy young man invited
    him inside.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Inside the house a great chief sat before a large fire, wearing a grizzly-bear-claw
    crown filled with eagle down and a dancing apron, with live rattles on the ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A young shaman entered from an east-side door carrying a rattle and an eagle
    tail, and boards for beating time ran in like serpents with weasel batons following
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young shaman sang, the rattle was shaken, and the batons and skin drum
    beat by themselves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Many shamans came out and each put his own supernatural power from his mouth
    into the visitor's mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The great chief put his hands on the visitor and rubbed his eyes four times;
    afterward the shamans vanished from sight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The visitor found himself again in darkness, signaled the line, and was pulled
    up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two men in the canoe fainted on the way home, later vomited blood, and became
    shamans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the end of summer supernatural powers took the man away from home, and
    after four days he was found on the floor of his house amid terrible whistling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The man told the people that he had entered the house of the supernatural
    power in the pit and had received powers to do what nobody else could do, including
    bringing the dead back to life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The supernatural power gave him the name Only One.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Only One healed people, revived the dead, became famous in surrounding villages,
    and was called by rich and poor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Other shamans tried to kill him with their powers and were jealous because
    his supernatural power was stronger than theirs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: A canoe summoned Only One to a chief's house for the chief's supposedly sick
    son, but Only One's supernatural power told him the prince was not sick and that
    they wanted to kill him and his power.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: At the chief's house Only One accused the sick one of pretending and detected
    that water brought for him was mixed with urine.
  category: speech
  evidence_refs:
  - ev:8
