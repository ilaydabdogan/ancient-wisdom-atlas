canonical_text:
  quote: ''
  summary: TxamsEm visits several animal-associated chiefs or men who host him with
    food. Chief Kingfisher produces salmon eggs by striking his ankle, and Thrush
    fills a dish with salmonberries by singing at the smoke hole. TxamsEm tries to
    imitate both actions and fails, becoming injured or ashamed. He then visits Chief
    Cormorant, is fed by Cormorant's wife, and goes halibut fishing with Cormorant,
    who catches many halibut while TxamsEm catches none.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: TxamsEm comes to a creek, sees a nice house, enters it, and sees a good-looking
    young man making a hook.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man, identified as Chief Kingfisher, welcomes TxamsEm with a new
    mat, water, roasted dried salmon, and many provisions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chief Kingfisher stretches his foot over a dish, strikes his ankle with a
    smooth stone, and salmon eggs pour out and fill the dish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: TxamsEm later builds a better house, invites Kingfisher, tries the same ankle-striking
    action, falls back in pain, and is left ashamed with a sore swollen foot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: TxamsEm comes to a large river with many salmonberry bushes and is invited
    into a house by a fine-looking man identified as Thrush.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thrush feeds TxamsEm roasted dried salmon and water, then holds a dish to
    the smoke hole, sings four times, and places the dish before TxamsEm full of red
    and yellow salmonberries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: TxamsEm secretly takes unripe salmonberries from Thrush's house, later invites
    Thrush, holds a dish to the smoke hole, says a formula repeatedly, but the berries
    remain unchanged.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thrush tells TxamsEm that he tried to imitate him, and TxamsEm becomes ashamed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: TxamsEm goes toward the sea, enters Chief Cormorant's house, and sits by the
    fire with a man and his wife present.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cormorant's wife serves roasted dried salmon, steamed halibut, and seal meat
    to TxamsEm, and the house is full of dried halibut and dried seal meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: TxamsEm asks Chief Cormorant to go catch halibut the next day, and they prepare
    hooks and fishing-lines in the evening.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the fishing-ground, Chief Cormorant repeatedly catches halibut two at a
    time, clubs them, and fills the canoe, while TxamsEm catches none.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Chief Cormorant says they have enough halibut, offers some to TxamsEm, and
    they go ashore to refresh themselves.
  category: sequence
  evidence_refs:
  - ev:7
