canonical_text:
  quote: the heart had two eyes and a mouth, and was still living.
  summary: Ten couples fleeing pursuers repeatedly bring down avalanches on pursuing
    multitudes. The chief Baboudina of Mosquito Town overtakes them and kills nearly
    all, but the youngest woman escapes to a lake and climbs a tree. Baboudina attacks
    her reflection in the water until cold and wind freeze him to death. The woman
    cuts out his living heart and uses it to revive her killed companions.
  language: English
  quote_policy: quoted
