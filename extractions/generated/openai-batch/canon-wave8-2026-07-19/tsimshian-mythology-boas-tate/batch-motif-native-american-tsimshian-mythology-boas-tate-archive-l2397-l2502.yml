canonical_text:
  quote: ''
  summary: In an animal council, Porcupine argues against making winter unbearably
    cold, warning that insects, small animals, plants, berries, and large animals
    would suffer. After initially dismissing him, the large animals acknowledge his
    wisdom. The animals settle on six months of winter and six months of summer, and
    Porcupine describes seasonal features and winter denning. The passage also explains
    why porcupines lack a thumb, why wild animals den in winter, why Porcupine does
    not, and why animals fear Porcupine's quills. A new tale begins about a wealthy
    porcupine-hunter who kills and dries porcupines each fall; while hunting, he follows
    a large brown porcupine near a spruce tree, enters a large house with a central
    fire, and is welcomed by a chief and a dance.
  language: English
  quote_policy: summarized
