canonical_text:
  quote: ''
  summary: TxamsEm visits a widow and her daughter, is fed, and marries the daughter.
    He says he will build a cedar canoe for his mother-in-law and repeatedly goes
    out with stone tools while the household feeds him. The daughter secretly observes
    that he is only striking an old rotten cedar to imitate work sounds. The widow
    and daughter leave for their tribe with the remaining provisions. TxamsEm returns
    expecting food and finds the hut empty except for boxes and a little fire.
  language: English
