canonical_text:
  quote: ''
  summary: A sorrowful young prince leaves his father's house in anger, carrying fat,
    tobacco, and small coppers. His father's people search for him, but he waits at
    a point of land where two men in a canoe take him to Chief Peace's village. There
    Mouse Woman advises him how to present gifts. His small offerings of fat, tobacco,
    and copper become abundant and costly when placed before Chief Peace, the chieftainess,
    and the girl's uncles. Chief Peace gives him his daughter in marriage. Later the
    prince becomes homesick for his parents, and his wife comforts him.
  language: English
  quote_policy: summarized
