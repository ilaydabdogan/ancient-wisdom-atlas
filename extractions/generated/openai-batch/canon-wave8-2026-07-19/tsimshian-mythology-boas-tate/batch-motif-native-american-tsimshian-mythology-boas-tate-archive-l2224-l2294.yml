canonical_text:
  quote: ''
  summary: TxamsEm sends a young man away quickly with a staff, warning that dogs
    may devour him. The man runs along a narrow trail across a plain while thunderlike
    and landslide-like noises and quaking follow him. He reaches his village; when
    he looks back, mountains have risen again where the plain and trail had been.
    He finds his family and people mourning, returns secretly, and is welcomed. He
    has the tribe gathered, brings in TxamsEm's staff, removes mountain-sheep meat
    and fat from it, distributes food, and tells of his journey through mountains,
    rivers, lakes, a great plain, and a valley hut where a large man by the fire identified
    himself as TxamsEm, showed a chest wound, and had two pups asleep nearby.
  language: English
  quote_policy: summarized
