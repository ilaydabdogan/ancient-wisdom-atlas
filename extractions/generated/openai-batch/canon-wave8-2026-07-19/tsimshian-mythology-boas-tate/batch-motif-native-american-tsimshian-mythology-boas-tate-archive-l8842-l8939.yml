canonical_text:
  quote: ''
  summary: A young princess discovers that her nightly visitor becomes a mouse. Pregnant
    and unwilling to name him, she is sealed with wealth in a box and cast into the
    river by her ashamed father. The box drifts to Queen Charlotte Islands, where
    a mourning noble couple open it; many mice run out, and they find the princess,
    whom they identify as their dead daughter returned. She later marries the chief's
    nephew or cousin, has named children, and after an insult about their unknown
    origin reveals her noble homeland and tells her children to return there.
  language: English
  quote_policy: summarized
