- id: motif:2
  label: Shapeshifting animal helpers procure game
  taxonomy_refs:
  - shapeshifter
  basis: The two pups shake themselves into hauhau cubs and cause mountain sheep to
    slide down for TxamsEm to prepare as food.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives the transformation and hunting function clearly, but
    the exact meaning of 'hauhau' is not explained in the excerpt.
- id: motif:3
  label: Return under a taboo against looking back
  taxonomy_refs:
  - return
  basis: TxamsEm gives the homeward trail and warns the narrator not to look back
    at terrible noises; the narrator runs home and only looks back after reaching
    the hill above the village.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents the prohibition and successful return; broader comparative
    significance is not asserted by the narrator.
- id: motif:4
  label: Object retained as proof of extraordinary encounter
  taxonomy_refs:
  - return
  basis: The narrator keeps the staff given by TxamsEm, and the people take it as
