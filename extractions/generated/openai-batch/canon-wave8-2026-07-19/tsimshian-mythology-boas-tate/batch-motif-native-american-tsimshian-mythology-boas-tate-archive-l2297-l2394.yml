canonical_text:
  quote: ''
  summary: 'A first-person narrator recounts receiving food and provisions from the
    hidden giant TxamsEm in a deep valley. TxamsEm''s dogs become cubs and drive down
    mountain sheep; he gives the narrator a meat-laden staff and orders him not to
    look back while returning through thunderous noise and shaking ground. The narrator
    reaches home, keeps the staff, and the people take it as evidence that TxamsEm
    is alive. A second story begins: Prairie Town Tsimshian hunters distress the animals,
    so Grizzly Bear convenes an animal council and proposes asking their maker for
    colder winters to protect dens; Wolf advises including small animals and insects,
    and the assembly gathers on a prairie.'
  language: English
  quote_policy: summarized
