  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief announces that his son-in-law will leave for his native land and
    gives his daughter instructions about an ash cane, six digging-sticks, and a large
    board for a time of winter food shortage.
  category: speech
  evidence_refs:
  - ev:2
