canonical_text:
  quote: ''
  summary: A chief notices that his son-in-law misses his parents and prepares to
    send him and his daughter home. The chief’s people hunt and load two carved canoes
    with blubber and fish. The chief teaches his daughter how to feed the canoes with
    seal blubber when they stop, and the canoes carry the young couple across the
    sea to Metlakahtla. At the home village the prince is recognized, provisions are
    unloaded in repeated abundance, and the princess sends the canoes back to their
    ocean home. Peace Woman is then described with her plume, root basket, water-drinking
    practice, and relation to her husband, his former wife, and his son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief orders slaves to start a fire, asks why his son-in-law is sad, and
    is told by his daughter that the young man longs for his parents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief promises to send the young man and his daughter back after a tribal
    hunt.
  category: speech
  evidence_refs:
