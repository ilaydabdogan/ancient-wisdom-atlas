canonical_text:
  quote: ''
  summary: A great shaman catches the chief of the Spring Salmon in a net. The shaman's
    supernatural helper says the lost prince is inside the salmon's stomach and warns
    that the salmon must be handled gently. The shaman summons other shamans and ritual
    objects, carries the salmon to the chief's house, excludes the unclean young people,
    and leads a ritual. Two old women shamans cut open the salmon and its stomach,
    finding a small child inside. The shamans sing and rattle while the child rapidly
    grows back to his former size. The restored prince then tells how the Spring Salmon
    took him to the Salmon village, where Mouse Woman explained the salmon chief's
    illness and the timing of the salmon season.
  language: English
  quote_policy: summarized
