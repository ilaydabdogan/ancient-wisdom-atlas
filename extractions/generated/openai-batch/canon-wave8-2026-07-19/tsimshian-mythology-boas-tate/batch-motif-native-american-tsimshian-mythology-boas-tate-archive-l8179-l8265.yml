  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Disbeliever puts on the leggings and snowshoes, leaps near the chief, strikes
    the snowshoes together, and runs around the fire in the center of the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Lightning comes from the leggings, snowshoes, and moccasins, and the house
    and all the people inside are consumed; no one in the house escapes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman sits where her brothers' bodies are, and the supernatural being
    tells her to lay the bodies out in good order.
