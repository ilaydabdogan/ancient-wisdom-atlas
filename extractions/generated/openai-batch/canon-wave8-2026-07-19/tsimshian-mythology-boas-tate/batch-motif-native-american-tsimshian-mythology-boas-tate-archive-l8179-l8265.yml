canonical_text:
  quote: ''
  summary: A chief gathers the people to explain that a bundle of leggings, snowshoes,
    and moccasins connected with slain persons produced lightning. An old man called
    Disbeliever mocks the report, handles and wears the items, and lightning then
    consumes the chief's house and everyone inside. Elsewhere, a supernatural being
    revives the woman's four dead brothers by jumping over each body four times. The
    siblings see the ruined village and return to their mountain home. The passage
    then begins a new tale describing an ocean village, two islands, and sea otters
    living at the foot of trees.
  language: English
  quote_policy: summarized
