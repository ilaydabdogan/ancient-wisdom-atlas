candidate_motifs:
- id: motif:1
  label: captured kinswoman and child prompt a recovery expedition
  taxonomy_refs:
  - stolen_beloved
  - departure
  basis: LEg'e'ox organizes war, and the warriors vow to act for Wi-n!e'ox, her son,
    and the other captives before setting out by canoe.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage frames the captive as a sister and mother rather than a romantic
    beloved; the taxonomy match to stolen_beloved is functional rather than exact.
- id: motif:2
  label: ritualized war vow with self-offering
  taxonomy_refs:
  - sacrifice
  - initiation
  basis: The warriors follow an old custom with a box of oil; volunteers speak of
    dying, Yaas dips his finger in oil, and the group completes the vow before departure.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: No deity or explicit sacred sanction is stated; the passage calls it an
    old custom and presents it as a war vow.
- id: motif:3
  label: recognition of identity through mourning-song
  taxonomy_refs: []
  basis: Wi-n!e'ox sings LEg'e'ox's mourning-song while captive, and Sdi'lda recognizes
    the tune, which leads to questions about her name, clan, and kinship.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage supports recognition by song, but it does not generalize this
    as a named traditional motif.
- id: motif:4
  label: ransom and restoration through prestige wealth
  taxonomy_refs:
  - sacred_exchange
  basis: Sdi'lda uses copper, slaves, and valuables to obtain Wi-n!e'ox and the boy
    from Wi-ha'o, with the stated intent of returning them to LEg'e'ox.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The exchange is political and kinship-based in the passage; its sacred
    character is not explicit.
- id: motif:5
  label: atonement and return of captives to avert war
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: Wi-ha'o gathers the Haida chiefs and proposes atoning for killed people and
    returning captives because he does not want war with LEg'e'ox.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage reports an intention and agreement, not a completed covenant
    ceremony.
- id: motif:6
  label: dangerous sea passage requiring protective instruction
  taxonomy_refs:
  - departure
  basis: Anamik watches the weather and instructs the warriors to wear spruce-root
    hats or close their eyes while passing through the sea, warning that otherwise
    they will become blind.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not explain why the sea passage causes blindness; the
    motif is limited to the stated travel precaution.
- id: motif:7
  label: marriage transfer with gifts involving chiefly succession
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Wi-ha'o's nephew, identified as his successor, seeks to marry Wi-n!e'ox;
    a wedding present is given, and Sdi'lda permits the transfer with wealth goods.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage presents a marriage arrangement and succession status, but
    does not describe a sacral marriage rite.
