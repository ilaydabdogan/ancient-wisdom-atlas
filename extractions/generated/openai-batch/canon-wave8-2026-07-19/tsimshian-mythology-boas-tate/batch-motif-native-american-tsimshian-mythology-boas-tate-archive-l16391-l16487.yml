canonical_text:
  quote: ''
  summary: Chief LEg'e'ox recruits allied warriors to make war after Wi-n!e'ox and
    her son are taken captive. The allies perform an oil-box vow, appoint Anamik as
    sea guide, and set out toward Queen Charlotte Islands. The Haida captors tie their
    captives at Dundas Island, where Wi-n!e'ox sings LEg'e'ox's mourning-song. Haida
    chief Sdi'lda recognizes the tune, questions her, and buys her and her son from
    Wi-ha'o with copper, slaves, and valuables, intending to return them to LEg'e'ox.
    Wi-ha'o later proposes atonement and return of captives to avert war, while his
    nephew seeks to marry Wi-n!e'ox. The Tsimshian war party waits at Lax-gulwal,
    where Anamik watches the weather and warns the men to wear spruce-root hats or
    close their eyes while crossing the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief LEg'e'ox invites the people of the canyon to go to war with him and
    sends to Nes-dzakagul, a same-clan chief, for support.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A box of oil is opened according to an old custom, and Nes-dzakagul asks who
    will be first to die for Wi-n!e'ox, her son, and the other people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yaas of the Eagle Clan volunteers first, says he will give his life, and dips
    his fourth finger into the oil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two young men take clubs and say they will break houses as they are breaking
    the oil-box and will burn the village.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the warriors take the vow, they shout four times and are ready to start
    after four days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Anamik, a Raven Clan man, secretly accompanies the war party as guide across
    the sea to Queen Charlotte Islands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The canoes travel down Skeena River, pass Tsimshian villages, receive encouragement,
    and are mocked by one village that tells them to take Wi-suqans alive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Dundas Island, the Haida captors tie the captives hand and foot before
    eating, and Wi-n!e'ox sings LEg'e'ox's mourning-song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sdi'lda recognizes the tune, sends for his copper, has Wi-n!e'ox brought from
    Wi-ha'o's canoe, and asks her name and clan through an interpreter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Wi-n!e'ox identifies herself as LEg'e'ox's sister and the head wife of Dzeba'sa,
    and she identifies the boy as Dzeba'sa's young son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sdi'lda offers copper, two slaves, and many valuable things to buy Wi-n!e'ox;
    he also insists that Wi-ha'o give him the boy rather than leave him captive in
    another clan's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wi-ha'o announces to the Haida chiefs that he will atone for the people killed
    and return the captured people, because he does not want war with LEg'e'ox.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: A nephew of Wi-ha'o, described as the prince who will succeed him, wants to
    marry Wi-n!e'ox; the G'ispawadwE'da give Sdi'lda a wedding present.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sdi'lda allows the prince to take Wi-n!e'ox together with elk skins, sea-otter
    garments, and provisions.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In salmon season, relatives of Wi-n!e'ox's husband camp on the north side
    of Lax-wau near a brook, and the young chief is said to love Wi-n!e'ox very much.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: At Lax-gulwal, Anamik observes wind, sky, and clouds; after announcing good
    weather, he tells the warriors to wear spruce-root hats or close their eyes while
    passing through the sea, or else they will become blind.
  category: action
  evidence_refs:
  - ev:11
