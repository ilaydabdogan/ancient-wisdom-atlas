canonical_text:
  quote: ''
  summary: Chief Hummingbird borrows a live destroying arrow from Chief Gutginsa'
    for revenge and instructs the young prince in its taboos and proper storage. The
    party returns home by having the Sparrow fly ahead of the canoe. At home, the
    prince seeks a warrior-teacher among old men, rejects several whose lives centered
    on women, and accepts the blind old warrior Wiludal, who demonstrates extraordinary
    archery. The prince learns weapon use, becomes rich, gives gifts to chiefs, and
    takes the name Asagulyaan, associated with a relative killed by his father.
  language: English
  quote_policy: summarized
