canonical_text:
  quote: ''
  summary: A dead shaman prince, appearing as a queer-looking owl, declares that the
    Ghosts have made him their chief, threatens his killers and relatives, and promises
    power to his four companions. His coffin is later found empty and full of eagle
    down. In Ghost town he punishes the souls of the shamans who killed him in a burning
    river, causing their second death as cohoes salmon. His four companions become
    shamans who visit Ghost town to recover souls, but they are forbidden to restore
    anyone dead for more than four days. When they break this rule for a dead chief’s
    son, they are kept in Ghost town and their bodies are found in the graveyard.
    The next tale begins by describing powerful shamans and three men who seek shamanic
    power from a supernatural being in a deep pit called Cave of Fear; two men lowered
    into the pit are attacked by stinging insects.
  language: English
  quote_policy: summarized
