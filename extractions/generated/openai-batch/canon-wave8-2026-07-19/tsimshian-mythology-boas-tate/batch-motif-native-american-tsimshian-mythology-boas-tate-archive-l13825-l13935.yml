candidate_motifs:
- id: motif:1
  label: Dead shaman becomes ruler and judge in the land of Ghosts
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: The shaman prince becomes head chief in Ghost town and punishes the souls
    of the shamans who killed him in a burning river.
