- id: motif:2
  label: Soul retrieval from the afterlife governed by a time limit
  taxonomy_refs:
  - afterlife_journey_map
  - resurrection
  basis: The four shamans visit Ghost town to recover souls, but the Ghost chief rules
    that a soul cannot be put back into a body after four days.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The successful restoration process is described generally; the narrated
    case after four days fails.
- id: motif:3
  label: Shamanic succession through a dead master’s supernatural aid
  taxonomy_refs:
  - initiation
  - wisdom
  basis: The Ghost chief says his companions will succeed to his supernatural powers,
    and they become shamans who act according to his instructions.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage states succession and instruction but does not describe a
    formal initiation rite for the four companions.
- id: motif:4
  label: Breaking an afterlife command causes permanent detention among the dead
  taxonomy_refs:
  - divine_judgment
  basis: The four shamans break the Ghost chief’s four-day order and are told they
