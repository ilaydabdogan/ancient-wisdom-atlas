candidate_motifs:
- id: motif:1
  label: Hospitality to a starving stranger rewarded with a crest
  taxonomy_refs:
  - sacred_exchange
  basis: The youngest chief's household gives the visitor their last provisions during
    famine, and the visitor promises and delivers a costly crest and associated gifts.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly say the visitor is disguised; the motif
    is limited to hospitality and reciprocal reward.
- id: motif:2
  label: Inhospitality leads to exclusion from gifts
  taxonomy_refs: []
  basis: The elder brothers give only snow and are later instructed to come afterward;
    when they arrive, they are too late and return empty-handed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:7
  confidence: medium
  cautions: The passage shows loss of access to the gift, but it does not explicitly
    describe a formal punishment.
