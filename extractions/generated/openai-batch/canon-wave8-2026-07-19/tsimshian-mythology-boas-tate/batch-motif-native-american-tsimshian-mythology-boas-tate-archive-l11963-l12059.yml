  label: Gift-bearers transform into grizzly bears
  taxonomy_refs:
  - shapeshifter
  basis: The three figures who deliver the crest objects return up the rock-slide
    and become three grizzly bears.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The relation between the thin visitor and the three gift-bearers is not
    directly stated in the excerpt.
- id: motif:4
  label: Famine relief through a gifted hunting weapon
  taxonomy_refs: []
  basis: The sinew bow given to the young chief enables him to shoot many kinds of
    animals and supply meat, fat, and skins while famine lasts.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage presents practical abundance through hunting rather than an
    explicit cosmic renewal.
- id: motif:5
  label: Origin and hereditary transmission of a crest
  taxonomy_refs:
  - royal_legitimacy
  basis: The promised costly crest is received after the river-crossing scene, increases
    the young chief's wealth and status, and is said to continue through all generations.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the text emphasizes chiefly wealth, property,
    and inherited crest continuity rather than a formal coronation.
- id: motif:6
  label: Ceremonial song with gift giving and property distribution
  taxonomy_refs:
  - sacred_exchange
  basis: The gift-bearers sing a mourning-song before giving regalia and dishes, and
    the young chief later sings while piling up property to give away.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage does not name a specific ceremony; only the actions of singing
