canonical_text:
  quote: '"I will reward your kindness to me, and by tomorrow I will give you a costly
    crest."'
  summary: During a winter famine, elder chiefs repeatedly offer a thin visiting man
    only snow. The youngest chief and his household share their last salmon and other
    provisions with him. The visitor promises a costly crest. At dawn the chief, his
    wife, and nephew cross the river and receive regalia, dishes, and a bow from three
    figures who then become grizzly bears. The elder brothers arrive too late. The
    youngest chief gains wealth, feeds the people, gives away property, and the crest
    continues through generations.
  language: English
  quote_policy: quoted
