  quote: ''
  summary: A beautiful child floats between two islands. Canoe parties who take or
    attack the child encounter the child's monster mother, storms, whirlpools, and
    destruction. After repeated losses, a surviving young chief and his kin begin
    testing canoes made from different trees against waves and storms.
  language: English
  quote_policy: summarized
