canonical_text:
  quote: ''
  summary: Hunters travel into the mountains, reach the village of Robin, are received
    by its chief, and negotiate for the chief's daughter to become their young chief's
    wife. Mouse Woman identifies the village and explains the marriage possibility.
    The Robin chief consults his people and sends his daughter with two small root
    baskets of meat, fat, and berries. She guides the hunters home, marries the young
    chief, and the provisions expand or prove abundant enough for a feast. Another
    group of hunters finds Sawbill-Duck Woman by the seashore and brings her to the
    chief as another wife, but he prefers Robin Woman. In winter, Robin Woman reminds
    her husband that her father wanted canoes sent in midwinter to bring winter provisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group who went up the mountains reached a large plain and saw a large village
    with happy-looking young men and women walking in the street.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The village chief invited the visiting hunters into his house and seated them
    on mats near his large fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mouse Woman touched one hunter and told him the village was Robin's village
    and that its chief had a beautiful daughter who could be given as wife if cared
    for well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Robin chief's attendants served the hunters roasted dried spring salmon,
    mountain-goat fat meat, and fresh berries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The head hunter praised the Robin chief's wealth and asked for the chief's
    daughter as wife for his own chief, promising honor and care.
  category: speech
  evidence_refs:
  - ev:5
