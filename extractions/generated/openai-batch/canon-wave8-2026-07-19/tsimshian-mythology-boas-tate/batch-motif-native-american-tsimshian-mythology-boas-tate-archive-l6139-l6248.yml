    containing fresh meat and fat and the other containing berries.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunters did not know the way home, and the young Robin Woman led them
    through mountains, valleys, and rivers until they arrived in late fall.
  category: action
  evidence_refs:
  - ev:7
