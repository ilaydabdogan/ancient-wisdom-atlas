canonical_text:
  quote: ''
  summary: After a man associated with wolves has been killed, his mother wails through
    the village and demands his garment and body. The villagers build a double-walled
    fort, which wolves surround and attack. The prince who killed him refuses to surrender
    the body or regalia, saying he will keep them, give a feast, and take the slain
    prince's name. Mother Wolf mourns the regalia in song, accepts the prince as her
    son and successor to the slain one, and the wolves depart. The prince later gives
    a feast, wears the regalia, distributes property, and takes the name Ate The Whole
    Deer. Wolf Mother helps him hunt, later takes him to her house among the wild
    animals, presents him as her adopted son, gives him her two daughters as wives,
    and orders the animals not to harm him. After Mother Wolf dies, the two wives
    help him hunt, and he becomes a great hunter and feast-giver among the animals.
  language: English
  quote_policy: summarized
