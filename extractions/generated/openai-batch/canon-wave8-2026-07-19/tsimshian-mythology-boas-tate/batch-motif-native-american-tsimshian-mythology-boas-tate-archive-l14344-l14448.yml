canonical_text:
  quote: ''
  summary: A Tsimshian princess, after many earlier princesses have disappeared, is
    lured away by a handsome stranger who later proves to be an ugly old shaman. He
    takes her by canoe to his dwelling, then abandons her on a bare rock to die after
    summoning heavenly birds. She hides in a cave, gathers the birds' feathers, sees
    bones and baskets of earlier victims, and later hides when the shaman returns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Princesses have been disappearing yearly from Tsimshian villages, and searches
    among the tribes have not found them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The last princess goes into the woods behind her father's house with two maidens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A good-looking blond young man comes from the woods, smiles at the princess,
    and speaks kindly to her.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man asks the princess to leave her two maidens behind and go farther
    with him; she tells the maidens to wait.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young man brings the princess to a canoe with warm garments, paddles until
    evening through fog, and guides her to a house with a small room full of costly
    goods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After sleeping beside the young man, the princess wakes and sees an ugly old
    man whom she recognizes as the arrow seller from her father's house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man tells the princess she can return home, compels her to lie with
    him, and later says they will go to a rock to gather feathers for his arrows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the grassy rock, the old man sends the princess ashore, pushes the canoe
    away, says he is leaving her to die, and refuses her pleas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bad shaman shouts to heaven four times before paddling away from the rock.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Numerous beautiful birds come down from above, and the princess hides in a
    small cave near the water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the birds fly back to heaven, the princess finds their beautiful feathers,
    bare bones, and hand baskets on the rock.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The princess concludes that the bad old man killed the princesses who had
    disappeared in previous years.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Four days later the bad shaman returns by canoe from his island; the princess
    hides on the beach or in the rock with seaweed on her head.
  category: sequence
  evidence_refs:
  - ev:9
