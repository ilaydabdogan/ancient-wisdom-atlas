canonical_text:
  quote: ''
  summary: 'The passage ends a Haimas narrative with his refuge among the Nass River
    people, the scattering of his people, later demands for atonement, and his death.
    It then begins an account of war between the Tsimshian and Tlingit after the Deluge:
    the Tlingit conquer and displace the Tsimshian, an Eagle Clan chief builds Beaver
    Fort, two young people escape its destruction, marry, raise ten sons, and Aksk
    prepares materials for revenge by constructing a heavy fir, pitch, and sand gate.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haimas escaped to the Nass River people, and they saved him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas's few people returned to the Tsimshian, and the Tsimshian would not
    allow the Wuts!En-a'luk to have their own town again, so they were scattered among
    the tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Haimas lived among the Nass River people with three women who escaped with
    him, and the women married Nass chiefs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A new Nes-balas and his people went by many canoes to Haimas and wanted him
    to atone for those he had slain years before; Haimas made atonement for each of
    the princes and warriors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A G'id-wul-ksE-ba'° man demanded atonement for his brother; Haimas spoke about
    the brother's name, said he was not afraid, invited the man to look into his heart,
    stretched out his hands, fell back, and died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The war account states that after the Deluge had covered the whole earth,
    the people increased in numbers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tlingit gained many victories, subdued the Tsimshian, and pursued them
    wherever they hid on the mountains.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tsimshian went up Skeena River, remembered that the river had belonged
    to their ancestors before the Deluge, and settled at named places on both sides
    of the river.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: No Tsimshian tribe remained at Metlakahtla or on the seashore, and the Tlingit
    took the country as far as the mouth of Skeena River.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A great chief of the Eagle Clan, married to a G'ispawadwE'da princess, built
    a strong fort called Beaver Fort and assembled the Eagle Clan there for defense.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the Tlingit attack, the chief told a young man to take his only daughter
    and flee with her, and the young man took her above K-t!ad Creek.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Tlingit attacked Beaver Fort, won the battle, and no one escaped except
    the two young people who had left before the battle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Tlingit made villages on Dundas Island and attacked mainland people by
    canoe whenever they saw smoke ascending.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The two escaped young people married at the lake of K-t!ad, lived there for
    many years, and had ten sons.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The father taught the ten sons weapons, success, cleanliness, and right conduct;
    when grown, they were healthy, strong, and good-looking.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The father, named Aksk, told his sons he wanted revenge for Beaver Fort and
    asked them to gather fresh fir trees, pitch, and fine dry sand.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Aksk made a very heavy gate from fresh fir wood, pitch, and dry sand in four
    coats; only the four eldest sons could lift it.
  category: object
  evidence_refs:
  - ev:12
