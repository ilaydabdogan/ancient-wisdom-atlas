candidate_motifs:
- id: motif:1
  label: post-Deluge population and ancestral land memory
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage says the Deluge covered the whole earth, people increased afterward,
    and the Tsimshian remembered Skeena River as land of their ancestors before the
    Deluge.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage only briefly mentions the Deluge and does not narrate the
    flood event itself.
- id: motif:2
  label: survivor pair after destruction of a community
  taxonomy_refs:
  - survivor_pair
  basis: The chief sends two young people away before Beaver Fort is attacked; after
    the Tlingit victory, the passage states that no one escaped except these two,
    who later marry and have ten sons.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The pair survives a battle and massacre, not a world-destroying event.
- id: motif:3
  label: flight from conquerors to ancestral refuge
  taxonomy_refs:
  - departure
  basis: The Tsimshian flee from the Tlingit, hide on mountains, and move up Skeena
    River, remembered as ancestral land before the Deluge.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy label is broad; the passage is a war migration account rather
    than an individual quest departure.
- id: motif:4
  label: avenging sons trained by a surviving father
  taxonomy_refs: []
  basis: Aksk and the chief's daughter survive Beaver Fort, raise ten sons, and Aksk
    trains them before initiating revenge preparations.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage segment ends before the revenge action itself is narrated.
- id: motif:5
  label: special war device made from layered natural materials
  taxonomy_refs: []
  basis: Aksk constructs an unusually heavy gate from fresh fir, pitch, and dry sand
    in four coats, so heavy only the four eldest sons can lift it.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The function of the gate is not fully explained within the supplied passage.
- id: motif:6
  label: atonement before sudden death
  taxonomy_refs: []
  basis: Haimas makes atonement for those he had slain, faces another demand, speaks
    defiantly, stretches out his hands, falls back, and dies.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly state a supernatural cause for the death.
