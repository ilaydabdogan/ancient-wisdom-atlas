candidate_motifs:
- id: motif:1
  label: Reciprocal peace covenant between tribes
  taxonomy_refs:
  - covenant
  basis: The passage explicitly identifies the actions as customs of making peace,
    says the two princes represented the two tribes that made peace forever, and identifies
    Gowagani as the peace dance.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The covenant is social and political in the passage; no divine guarantor
    is stated.
- id: motif:2
  label: Ritual exchange, gift-giving, and compensation
  taxonomy_refs:
  - sacred_exchange
  basis: The ceremonies involve reciprocal feeding and washing, exchange residence
    of princes, presentation of coppers, giving of a wife, and valuables given to
    atone for war deaths.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage does not call the exchange sacred; the label identifies a
    ritualized exchange pattern.
- id: motif:3
  label: Alliance marriage in a peace settlement
  taxonomy_refs:
  - sacred_marriage
  basis: The princess who fed the prince is given to the chief as wife during the
    peace ceremony, alongside compensation for those slain in war.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents the marriage as chiefly and diplomatic, not as a
    divine or cosmic marriage.
- id: motif:4
  label: Departure and return of a princely representative
  taxonomy_refs:
  - departure
  - return
  basis: LEg'e'°x's nephew is taken by the Tlingit to their canoe and expected to
    be away nearly a year; in the fall the Tlingit return to Metlakahtla and he appears
    as head dancer.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The departure and return occur within diplomatic ritual exchange, not
    a solitary heroic quest.
- id: motif:5
  label: Public ceremonial naming as peace-dance identity
  taxonomy_refs: []
  basis: Both princes reject proposed names before accepting names bestowed by the
    other side's chief, and the passage explains Gowagani as the name of the peace
    dance.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: No external taxonomy reference is assigned because the available list
    has no direct ceremonial-naming category.
comparison_claims:
- id: claim:1
  claim: The passage's note links Gowagani to a Tlingit term glossed as 'deer' and
    to Swanton's description of a 'deer,' 'sun deer,' or 'fort deer' ceremonial performer,
    supporting a cautious linguistic comparison to a Tlingit ritual term.
  claim_level: linguistic_similarity
  target: Tlingit qou'ahd'n / 'deer' ceremony noted in the source footnote
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison relies only on the source note included in the passage;
    no independent Tlingit-language passage is supplied here.
- id: claim:2
  claim: 'Within the passage, the Tlingit-led and Tsimshian-led performances have
    the same peace-dance function: each side has a Gowagani head dancer and conducts
    reciprocal dances involving down and ceremonial objects.'
  claim_level: same_function
  target: Tlingit and Tsimshian reciprocal Gowagani dance performances in this passage
  evidence_refs:
  - ev:8
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the same passage, not a claim
    about broader historical diffusion.
