canonical_text:
  quote: ''
  summary: 'The passage describes peace-making ceremonies between Tlingit and Tsimshian
    leaders: ritual washing and feeding, repeated dances, the exchange residence of
    two princes, reciprocal ceremonial naming as Nass Gowagani and Summer Gowagani,
    return ceremonies with down, coppers, marriage, compensation for war deaths, and
    anointing with fat and red ocher.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before food is served, young girls bring wooden dishes with water, wash the
    Tlingit prince's hands and face, and wipe him with shredded cedar bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A princess wearing abalone ornaments, brass bracelets, and a dancing-blanket
    gives food to the Tlingit prince, and reciprocal treatment is given to LEg'e'°x's
    nephew.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Tlingit and Tsimshian dance again, stay four days in the chief's house,
    dance three times a day, and the passage says these are customs of making peace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tlingit take LEg'e'°x's nephew to their canoe, seat him on a carved box,
    and he wears crests, his uncle's dancing-blanket, and a headdress; two friends
    accompany him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: LEg'e'°x keeps the Tlingit prince and two followers in his house; the prince
    continues dancing, is fed by the princess, and is washed by girls.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the two great princes represented the two great tribes
    that had made peace from that time onward.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Tlingit prince asks LEg'e'°x for a Gowagani name; Tsimshian wise men propose
    strong-animal names, but he accepts LEg'e'°x's name Nass Gowagani.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: LEg'e'°x's nephew asks Gadunaha'° for his Gowagani name; Tlingit wise men
    propose names such as Fine Weather, Sun, Moon, and Stars, but he accepts Gadunaha'°'s
    name Summer Gowagani.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage identifies Gowagani as the name of the peace dance.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the fall, the Tlingit return to Metlakahtla, Tsimshian tribes are invited,
    and LEg'e'°x's nephew is head dancer of the Tlingit during dances of happiness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: During the Tlingit-led dances, dancers use down, puffin-beak rattles, eagle
    down, carved canes, and a gesture of blowing down from the left hand so it covers
    the Tsimshian in the house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Gadunaha'° calls Summer Gowagani; Summer Gowagani comes with a copper in each
    hand, speaks Tlingit, and places the coppers before his uncle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The young men who followed Summer Gowagani from Nass River to Tlingit country
    are described as like his slaves.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The princess who had given food to the prince is given to the chief as his
    wife, and many valuables are given to atone for people slain in past wars.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The name Summer Gowagani is explained as meaning that no one shall be sorrowful
    in summer, when birds sing on trees, berries are ripe, weather is fine, and people
    are happy.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the reciprocal Tsimshian dance, Nass Gowagani is head dancer; Tsimshian
    dancers carry white eagle tails and red-ocher bags, while young women hold down
