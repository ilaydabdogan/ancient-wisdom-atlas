canonical_text:
  quote: ''
  summary: 'The passage first describes Nass Gowagani presenting coppers, represented
    canoes, slaves, and valuables before Gadunaha'', followed by an explanation of
    the name Nass Gowagani and a statement that Tlingit-Tsimshian wars ended. A new
    war narrative then begins: the G''i-spa-x-l!°ts camp after leaving Nass River;
    a low-tide voice warns them of enemies; Haida war-canoes arrive, defeat them,
    kill many, and take captives including Chief LEg''e''x''s sister and nephew to
    Queen Charlotte Islands. The survivors move to dry provisions. The grieving chief
    is urged by a warrior to gather the tribes for war. He summons warriors, sets
    a box of oil before the fire, and calls for men to dip and lick the fourth finger
    as a vow. Qanas vows first, others follow, the empty box is burned with a vow
    to burn the empty village, and the people give war-cries four times as a customary
    preparation for war.'
  language: English
  quote_policy: summarized
