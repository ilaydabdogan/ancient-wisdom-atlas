candidate_motifs:
- id: motif:1
  label: Prestige-gift presentation linked to ending war
  taxonomy_refs:
  - sacred_exchange
  basis: Coppers, represented canoes, slaves, and valuables are placed before Gadunaha',
    and the next statement marks the end of the Tlingit and Tsimshian wars.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The passage presents chiefly valuables and political reconciliation, but
    does not explicitly describe the exchange as sacred.
- id: motif:2
  label: Seasonal river abundance and name explanation
  taxonomy_refs:
  - seasonal_cycle
  basis: The name Nass Gowagani is explained by springtime abundance at Nass River,
    when hungry humans, birds, and water animals come for food and olachen after winter
    hardship.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a parenthetical name explanation rather than the main war narrative.
- id: motif:3
  label: Unseen warning before enemy attack
  taxonomy_refs: []
  basis: At low tide a voice from below warns sleepers that enemies are coming, enabling
    warriors to awake and prepare before the Haida war-canoes arrive.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The source does not identify the speaker or explain whether the voice
    is human, supernatural, or otherwise.
- id: motif:4
  label: Captive kin and community provoke war expedition
  taxonomy_refs:
  - stolen_beloved
  - departure
  basis: Wi-nle'x, Hats!Eks-n!e'°x, and many others are taken captive; LEg'e'x grieves
    and then declares he wants to go to Queen Charlotte Islands because of the captives.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  confidence: medium
  cautions: The captives are kin and community members, not a romantic beloved; the
    departure or rescue is announced but not completed within this passage.
- id: motif:5
  label: Pre-battle oil vow
  taxonomy_refs:
  - initiation
  basis: The chief calls for warriors to dip the fourth finger into oil, lick it,
    and take a vow before battle; the passage calls this a custom before war.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage presents the rite as a war custom, but does not state that
    it initiates a new social status.
- id: motif:6
  label: Vow of self-sacrifice in battle
  taxonomy_refs:
  - sacrifice
  basis: Qanas's oil gesture is explained as showing that he would be the first to
    die at the chief's command in battle and would not break his vow.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes willingness to die in battle, not a formal sacrificial
    killing.
- id: motif:7
  label: Fire analogy for destroying an enemy village
  taxonomy_refs: []
  basis: The last two men burn the empty box and say they will burn the empty village
    as they burn the box.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage reports a vow and analogy; it does not narrate the later burning
    itself.
comparison_claims:
- id: claim:1
  claim: The oil-finger gesture, vow, box-burning analogy, and four war-cries support
    a cautious functional comparison to a pre-battle oath or war-initiation pattern.
  claim_level: same_function
  target: pre-battle oath or war-initiation pattern
  evidence_refs:
  - ev:10
  - ev:11
