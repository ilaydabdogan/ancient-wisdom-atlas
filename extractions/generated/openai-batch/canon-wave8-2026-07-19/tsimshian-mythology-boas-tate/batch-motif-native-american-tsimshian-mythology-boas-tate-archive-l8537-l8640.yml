canonical_text:
  quote: ''
  summary: A chief's son is received kindly by his youngest uncle, but his father
    later orders the tribe to move to Nass River and leave him behind. The uncle's
    wife leaves him provisions, a little slave, arrows, fire, and grease. The prince
    builds a small house, makes arrows, and repeatedly sends his slave to the beach
    when eagles screech there. The eagles provide increasing kinds and quantities
    of food—fish, seal, and sea lion—which the prince dries and stores. The passage
    states that the eagles give him food because he had fed them the previous summer.
    Meanwhile the people who left him starve on Nass River because no olachen have
    come.
  language: English
  quote_policy: summarized
