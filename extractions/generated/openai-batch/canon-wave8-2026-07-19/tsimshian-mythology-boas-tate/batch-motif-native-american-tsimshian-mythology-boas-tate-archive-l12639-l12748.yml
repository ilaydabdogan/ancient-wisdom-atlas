canonical_text:
  quote: ''
  summary: 'The passage first closes an episode in which a prince becomes the first
    copper-worker, grows wealthy, distributes coppers and goods, and is proclaimed
    head chief. It then begins the Story of the Wolf Clan: Eagle and Wolf clan villages
    build a shared weir, quarrel over its catch, and go to war. The Eagle chief kills
    his Wolf wife’s male relatives, claims the weir, and later orders his newborn
    sons killed. His wife and maid conceal one son as a girl; the boy survives, grows
    up, learns of his father’s killings, and kills him in revenge. His mother then
    tells him of a supernatural arrow with a living reptile-head in the far northwest,
    and he departs by canoe with companions and provisions to seek it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed prince and his wife go for coppers; he follows his father-in-law’s
    commands and is described as the first copper-worker among the natives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The copper-working prince becomes richer than surrounding chiefs, exchanges
    costly coppers for many goods, gives away coppers and wealth, and is proclaimed
    head chief with his great-grandfather’s name.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two villages in the Strait of Metlakahtla are inhabited by the Eagle Clan
    and the Wolf Clan; they are friendly because the Eagle chief Nes-wa-na'° is married
    to the Wolf princess Bidal.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Eagle and Wolf people build a weir between the two islands to catch seals
    and fish at low tide and agree that whichever side wakes first may take something
    caught there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Wolf Clan people go down first almost every morning, the Eagle chief becomes
    angry with his wife’s brother-in-law’s tribe, and war begins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Eagle Clan wins the war; the Eagle chief kills his wife’s relatives and
    takes the weir for his own people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the killing, only women and girls remain in the other village.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief’s wife gives birth to a girl, and the chief orders that she be kept
    in good health; the girl later looks into the sun, suffers sore eyes, and is named
    Ya°l.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: When the chief is told that later newborn children are boys, he orders them
    killed, and his attendants obey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before another birth, the wife instructs her maidservant to report a boy as
    a girl; the maidservant deceives the chief, and a boy survives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The mother keeps and trains the surviving boy; after the father learns of
    the deception, he kills the maidservant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The mother stays with her son because she knows his father seeks the child’s
    life and tells him that his father killed her relatives and sons.
  category: speech
  evidence_refs:
