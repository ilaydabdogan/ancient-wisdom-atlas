canonical_text:
  quote: ''
  summary: 'The passage closes a wind narrative in which West-Wind Woman travels around
    the world with Little Feather, and the gentle west winds and four wind helpers
    are explained. It then begins “The Feast of the Mountain Goats”: six brothers
    from Prairie Town repeatedly hunt mountain goats wastefully, children torment
    a captured kid with water and fire, and a young man named Really Black rescues
    the kid and guides it to a high mountain. Later messengers invite the whole village
    to a new settlement at the mountain’s foot, where hosts in mountain-goat regalia
    welcome them with dancing.'
  language: English
  quote_policy: summarized
