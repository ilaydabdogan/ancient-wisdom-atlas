canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which four princes are recognized
    by a captive aunt through a war-song, learn of an enemy old chief, avenge slain
    relatives, and establish later Eagle-family ancestry through three women. It then
    begins the story of Asdilda and Omen: a chief''s children are named, Asdilda goes
    fishing with companions, repeatedly loses sight of large trout when his valuable
    Cormorant Hat falls, angrily tears and throws the hat into the water, and later
    camps as a frog leaps onto cooked trout.'
  language: English
  quote_policy: summarized
