canonical_text:
  quote: ''
  summary: A missing prince is sought by his parents and the village shamans. A named
    great shaman performs a ritual, identifies the boy as alive in the house of the
    Spring Salmon chief, and prescribes eating stored dried spring salmon so the Salmon
    chief may recover and return the boy in spring. The community prepares ritually
    and practically for the salmon run. Through repeated visions, the shaman tracks
    the Spring Salmon people as they move up the river with the prince. At the canyon,
    people fish from platforms; the Spring Salmon chief is blocked by the shaman’s
    net and instructs the prince that his father must not dry the chief’s flesh, but
    must feed it at once to people of all ages, burn the bones, and drink fresh water.
  language: English
  quote_policy: summarized
