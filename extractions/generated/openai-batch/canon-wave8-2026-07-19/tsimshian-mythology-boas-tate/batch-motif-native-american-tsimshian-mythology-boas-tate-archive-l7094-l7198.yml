  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Two tribes prepared for the arrival of the spring salmon and made platforms
    on the side of a steep rock by the canyon of G'its!ala'sEr.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: As spring came and ice floated in the river, the great shaman reported visions
