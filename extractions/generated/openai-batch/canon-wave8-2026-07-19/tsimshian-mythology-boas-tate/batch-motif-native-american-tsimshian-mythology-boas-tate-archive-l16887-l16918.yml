canonical_text:
  quote: ''
  summary: 'The passage recounts the aftermath of a Tsimshian-Haida war: Chief LEg''e''^x
    releases a retained Haida prince with gifts; an accused woman is threatened with
    death but saved when her uncle pledges lifelong atonement; public compensation
    is paid in coppers and other transfers; the uncle becomes a head chief; and the
    battle at Rose Island is described as the last great war between the Tsimshian
    and Haida.'
  language: English
  quote_policy: summarized
