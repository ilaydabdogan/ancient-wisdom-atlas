canonical_text:
  quote: ''
  summary: A chief displays gifts and songs received from grizzly bears as reward
    for kindness, establishes hereditary rights to crests and songs, receives a mountain-pole
    late in life, gives a final feast, transfers property and honors to his nephew,
    and dies. An alternate version begins with Chief Dzeba'sa and a winter famine
    on the upper Skeena River, where a poor-looking stranger visits chiefs and is
    given snow as food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief made a feast, invited different tribes, wore grizzly-bear regalia,
    carried a smew bow, and sang two mourning-songs received from grizzly bears as
    reward for kindness to Chief Bear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's wife showed two carved dishes that she had also received from
    the grizzly bears in return for kindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief proclaimed that only his clan after him through all generations
    should use the crests and mourning-songs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief took a new chief's name, Nes-nawa, which the grizzly bear had given
    him as reward for kindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The three brothers were jealous of their younger brother, while people of
    all tribes loved and honored him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When old, the chief met a man at his hunting-ground, invited him to eat, recognized
    him, and received a mountain-pole with an associated song.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A small live man was seated at one end of the mountain-pole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: At his last feast the chief displayed the pole, sang the song of the pole,
    gave away all his property, and announced that his nephew would inherit his property,
    crests, songs, power, honor, hunting-ground, and house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After singing a mourning-song with relatives, the chief lay down and died;
    the guests mourned for two days and two nights, and his nephew succeeded him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the alternate version, Chief Dzeba'sa used the Prince Black Bear when dancing
    among other chiefs in the winter dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In olden times at Prairie Town on the upper Skeena River, a famine occurred;
    six chiefs had houses, smoke rose from their houses each morning, and many tribe
    members died of starvation.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: On a very cold winter morning, with ice on the Skeena River and snow on the
    ground, a poor-looking stranger came along the ice to the oldest chief's house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The oldest chief's attendants placed a mat by the fire and put fuel on the
    fire; when the stranger said he had eaten only snow, the chief had snow brought
    in a wooden dish, and the stranger left.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: On the next morning the same stranger visited the second chief, was seated
    by the fire, said he had eaten only snow, was given a wooden dish filled with
    snow, and left without touching it.
  category: sequence
  evidence_refs:
  - ev:9
