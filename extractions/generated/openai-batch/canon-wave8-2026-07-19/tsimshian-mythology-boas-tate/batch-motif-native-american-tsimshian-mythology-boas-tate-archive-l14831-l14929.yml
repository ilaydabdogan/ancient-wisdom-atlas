canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Devoured By Martens, acting
    as a shaman with supernatural help, directs people to the sea, obtains halibut,
    and the text identifies this as the first time the Skeena River people reached
    the sea and learned to catch halibut. It then gives a dancing-song referring to
    a supernatural being and the Lake Of The Beginning. The next episode introduces
    the Cannibal dance complex: a young prince named Gather On The Water is ritually
    taken by Cannibal dancers, secretly placed in a tree hut, visited by a supernatural
    being, forced to eat a dead child, and then taught to kill and eat people in front
    of the village.'
  language: English
  quote_policy: summarized
