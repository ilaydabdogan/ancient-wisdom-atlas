canonical_text:
  quote: ''
  summary: A shaman prince defeats the chief of the Ghosts through instructions from
    his supernatural power, then becomes more powerful and famous. He later revives
    a drowned princess from her skeleton by sprinkling ashes four times and fanning
    her with an eagle tail. Rival shamans plot against him and feed him dried human
    flesh. He announces that he will die and return after a year if a relative catches
    him, enters a coffin after a sunwise fourfold circuit around the fire, and later
    appears from the coffin in owl form while his relatives are afraid.
  language: English
  quote_policy: summarized
