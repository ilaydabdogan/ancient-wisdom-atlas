- id: obs:11
  text: The Ghosts held councils to kill the shaman prince, but his supernatural helper
    told him what they had planned.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Ghost town became smaller because souls were not entering it, and some
