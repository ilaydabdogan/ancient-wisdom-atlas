canonical_text:
  quote: ''
  summary: A shaman prince travels to the Ghosts' town across a river and bridge,
    seizes a dead person's soul from the Ghosts, is burned by the Boiling-Oil River
    during escape, and is healed by circling the fire four times as instructed by
    his supernatural power. He repeatedly retrieves souls of the dead, angering the
    Ghosts. The Ghosts plot to kill him by feigning the sickness of their chief and
    by attacking his village, but the shaman warns his people to use a urine-and-poison
    mixture as protection. In the Ghost chief's house, the shaman handles a skull
    rattle, bone-fringed apron, and rib crown, applying water from his mouth to parts
    of his body before donning them.
  language: English
  quote_policy: summarized
