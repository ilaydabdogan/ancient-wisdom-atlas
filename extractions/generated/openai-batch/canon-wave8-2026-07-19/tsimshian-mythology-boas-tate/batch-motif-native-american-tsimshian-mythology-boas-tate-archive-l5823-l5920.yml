canonical_text:
  quote: ''
  summary: A young woman’s son grows into a hunter after instructions associated with
    his supernatural father. The father teaches the son trapping, snaring, taboos,
    fasting, washing, devil's-club use, and marriage or sexual restrictions. The son
    becomes rich through hunting, later experiences repeated trap failure after the
    taboo period ends, and then encounters a supernatural being beside a large tree
    who tells him to cut it down.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young woman gives birth to a good-looking boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While gathering fuel in the woods, the young woman meets a young man who asks
    about her son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man instructs the mother to give the boy devil's-club, have him
    rub it over his body after washing, avoid a specified place, and keep him unmarried
    while young.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The child grows rapidly, becomes a skillful hunter, and camps near the mouth
    of Nass River with four friends.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the thick forest, a man comes down in front of the young hunter, identifies
    himself as his father, and says he has come to talk to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father teaches trap-making, snaring, baiting, taboo observance, fasting,
    washing, devil's-club use, brook diving, and rules involving four days, twelve
    months, and twelve dives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father warns against marrying soon and says lusting after women's beauty
    will make the young man poor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: After speaking, the supernatural father vanishes from the young man's sight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young hunter follows the instructions, kills many animals, catches animals
    in traps and snares, and becomes richer than anyone else.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After another year, when the period of taboos has ended, his traps and snares
    repeatedly hold nothing, are broken or fallen, and have their bait eaten by mice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hunter searches for devil's-club, does not find any, washes, goes up a
    little hill, and sees a large tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A supernatural being comes around the large tree, addresses the hunter as
    son, tells him to cut down the tree the next day, and disappears.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
