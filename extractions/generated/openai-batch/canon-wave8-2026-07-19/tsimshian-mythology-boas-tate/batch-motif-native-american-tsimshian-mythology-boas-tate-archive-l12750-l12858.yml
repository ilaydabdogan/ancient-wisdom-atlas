canonical_text:
  quote: ''
  summary: 'A prince bathes alone in a brook to seek success and revenge, and encounters
    a supernatural owner of the pool. The being gives him a sparrow skin or blanket
    and instructions for a distant journey to Chief Gutginsa''s life arrow: hide the
    canoe, sing behind village houses, and have companions make burnt-offerings. The
    party travels through many villages, receiving distance information from old men
    while the prince appears as a sparrow. At the last village, located at the corner
    of heaven where there is no land beyond, a chief who later flies as Hummingbird
    hosts them, says he received the offerings, and guides the prince upward to an
    air island where Chief Gutginsa lives.'
  language: English
  quote_policy: summarized
