canonical_text:
  quote: ''
  summary: Tsauda curses Halus after Halus catches his bag net, causing Halus to become
    a red cod with a lasting bodily condition. Halus's wife becomes a blue-side cod,
    is recognized by Tsauda, and is released. Tsauda's wife bears two daughters who
    are identified as replacements or returns of the lost women and are given to the
    mother-in-law. Later, the elder daughter's husband follows information about valuable
    copper, encounters a living tree of odors that embraces and nearly crushes him,
    has his men uproot it, and gains wealth and chiefship by distributing and selling
    its pieces and soil.
  language: English
  quote_policy: summarized
