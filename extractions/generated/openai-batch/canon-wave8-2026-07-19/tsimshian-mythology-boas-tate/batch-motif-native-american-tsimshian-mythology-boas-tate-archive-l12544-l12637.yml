canonical_text:
  quote: ''
  summary: A young prince seeks copper at a creek named by Tsauda through his daughter.
    A speared salmon strikes stones, sounds like copper, and becomes copper. The prince
    sleeps with the copper as a pillow and is found dead. His companions burn the
    copper, recover pure copper, and carry his body home. His wife Moon mourns at
    a white-pine tree, where Tsauda descends in shining light. Tsauda revives the
    prince with cold water of life and slaps to the cheeks, then teaches restricted
    methods for handling live copper, copper-working, secrecy, and protective white-pine
    pitch medicine before flying to his supernatural home.
  language: English
  quote_policy: summarized
