canonical_text:
  quote: ''
  summary: TxamsEm obtains and stores abundant dried salmon through Bright-Cloud Woman.
    He becomes proud, gambles with a stump, accuses his wife of receiving a visitor,
    and insults a spring-salmon backbone. Bright-Cloud Woman calls the dried Salmon
    her tribe, leaves with them into the water, and is revealed as cloudlike; TxamsEm
    loses his provisions and restored appearance. In the next episode, bad south wind
    causes starvation, and TxamsEm calls the Fish to discuss making war on the Master
    of the South Wind, with Devilfish and Halibut supporting the plan and proposing
    to borrow Killer Whale's canoe.
  language: English
  quote_policy: summarized
