canonical_text:
  quote: ''
  summary: A supernatural chief hosts monsters and supernatural beings, asking them
    to stop harming his grandchildren's people; they agree. The grandchildren and
    their mother return home, and the young man later becomes a rich chief, takes
    a name given by his supernatural grandfather, and prepares a great feast for supernatural
    beings with goods supplied by Tsimshian tribes. After moving to the Nass River
    and inviting supernatural beings, no guests arrive because one supernatural chief
    had been omitted from the invitation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The supernatural chief addresses assembled supernatural chiefs and asks them
    to let his grandchildren's people live and not harm them much.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monsters and the named winds answer that they will do what the supernatural
    chief said and will not blow so often.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the gathering, many canoes had been capsized on the Skeena River and
    along the coast by supernatural beings in the water who wanted dried berries carried
    in the canoes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the guests agree not to harm the people, they leave for their own homes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The great chief tells his son to let his grandchildren and their mother return
    to their own home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the returning family arrives at the Raven town, the tribe of the young
    princess's uncle rejoices that she is alive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The uncle invites Tsimshian tribes, chiefs, and other people to see his two
    grandchildren and gives out their names.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The young man and his sister obtain animals of the woods and water, and the
    young man becomes very rich and gives great feasts to his uncles' people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After his uncle dies, the young man gives a great feast to Tsimshian chiefs
    and people and takes the name his supernatural grandfather had given him, Down
    The Useless River.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The young chief decides to invite the supernatural beings who had been guests
    in his supernatural grandfather's house, and his mother encourages him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The young chief orders named Tsimshian groups to make carved dishes, spoons,
    boxes, blankets, mats, cedar-bark items, and to prepare dried meats, fish, berries,
    hemlock-sap cakes, tallow, tobacco, eagle down, and burnt clamshells.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:12
  text: The preparation for the feast takes two years, after which the Tsimshian tribes
    bring the prepared goods.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Many canoes are filled with goods made by the Tsimshian tribes, who are said
    to use the same language.
  category: object
  evidence_refs:
