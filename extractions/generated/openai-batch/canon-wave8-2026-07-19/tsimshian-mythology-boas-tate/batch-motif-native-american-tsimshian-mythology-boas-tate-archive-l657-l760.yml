canonical_text:
  quote: ''
  summary: TxamsEm travels in his raven blanket, encounters a large Crab, is dragged
    underwater and later revives on shore in the sun. He then tries to lure a Fish
    ashore, curses its body shape when it escapes, and the Fish becomes the bullhead.
    Later he frightens villagers away from a beached whale by interpreting a raven-language
    cry as a warning of pestilence, then takes the whale meat. In a following episode,
    he repeatedly discards or damages his raven blanket for finer-looking garments
    that turn out to be lichens or moss, and he recovers the raven blanket each time.
  language: English
  quote_policy: summarized
