canonical_text:
  quote: The log floated out to sea with many children in it.
  summary: During olachen fishing, children are gathered for safety. Princess Daul
    cares for girls in a hollow log used as a play-house and supplied with provisions.
    A high tide carries the log out to sea with many children inside. Daul comforts
    them while a tamed young eagle later flies back to Nass River and signals that
    the children are alive. The log eventually washes ashore near a Haida halibut
    camp. Daul sends the children into the woods, is brought into a chief's house
    by a young prince, and through an interpreter identifies herself and recounts
    how the tide carried them away.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: During the olachen run, people moved to Sandbar Camp for fishing, and children
    were in the fishermen's way; some children were hurt, died, fell into the water,
    or drowned.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The new chief called a council to discuss keeping the children safe, and the
    children were gathered into his house before boys and girls were separated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large group of girls found a hollow log above high-water mark, and their
    parents chose Princess Daul to care for them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The girls entered the hollow log, played that it was their house, made a fire,
    ate there, and received provisions and costly garments from their parents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One night an unusually high tide carried the hollow log away while the children
    were asleep, and the log floated out to sea with many children inside.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Daul woke, saw that the log had drifted away, cried, then stopped crying and
    tried to comfort the children so they would not panic or faint.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A young prince had given Daul a young eagle; she loved and tamed it, and it
    learned to understand her words.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The children's parents searched down the river by canoe but did not find the
    children and returned home sorrowing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young eagle flew back to Nass River, landed on the roof of Daul's grandfather's
