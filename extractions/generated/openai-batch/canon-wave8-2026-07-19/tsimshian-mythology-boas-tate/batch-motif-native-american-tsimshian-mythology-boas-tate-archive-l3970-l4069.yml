canonical_text:
  quote: ''
  summary: Bird Garment, a brave Killer Whale, dives against a deep-water monster
    and helps the Killer Whales cut off its arms and bring up its body, establishing
    his clan’s preeminence. Later, the young Devilfish devours people, canoes, animals,
    and two Eagle children. Chief Eagle gathers large birds for war. Eagles are swallowed;
    Thunderbird kills two arms with lightning; Raven enters the monster’s mouth and
    plucks out its heart. The Raven clan gains victory, and hunters use a raven cry
    against devilfish before they surface. The passage then introduces the next story
    and includes a note on hunting and animal uses.
  language: English
  quote_policy: summarized
