canonical_text:
  quote: ''
  summary: In the town of the Spring Salmon, the prince kills a youth who becomes
    a spring salmon, eats him, and later restores an overlooked rib to the fire so
    that the crying boy is well. The chief of the Spring Salmon sends scouts to the
    rivers; signs from Cottonwood leaves lead the Spring Salmon people to begin moving
    from their deep-sea home. They pass other salmon and trout towns, each associated
    with its own timing and route. The Spring Salmon chief gives the prince a smooth
    pebble from his mouth as protection. Near the Skeena and Nass Rivers the chief
    questions companies about their destinations, and the groups separate by route.
  language: English
  quote_policy: summarized
