canonical_text:
  quote: "“Asdilda cast my only child into the fire? Therefore I burned up this village.”"
  summary: A hidden girl, Omen, sees a mourning chieftainess who says her child was
    cast into the fire and that she burned the village in response. Omen emerges from
    the pit, laments the destroyed town, travels past a lake with supernatural signs,
    and rests by a funeral pyre. People from a nearby village mistake her for their
    dead princess returned to life, take her home, feast, and adopt her as their daughter.
  language: English
  quote_policy: quoted
