canonical_text:
  quote: ''
  summary: TxamsEm tricks Chief Cormorant into extending his tongue, tears it out,
    returns with him to Cormorant's town, lies about the injury, is attacked by the
    Cormorants, and escapes by putting on a raven garment. The passage then explains
    Cormorant speech and black feathers. In later episodes, hungry TxamsEm is hosted
    by Chief Wolf and his people, leaves with a bag of fat meat, then approaches Chief
    Grouse's house using three Crows as a pretend wife and children.
  language: English
  quote_policy: summarized
