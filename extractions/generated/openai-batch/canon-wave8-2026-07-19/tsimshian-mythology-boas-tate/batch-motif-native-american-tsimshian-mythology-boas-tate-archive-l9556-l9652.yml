canonical_text:
  quote: ''
  summary: A woman and her son recover and eat the grizzly bear killed by her blind
    husband while concealing the kill from him. The son secretly tells his father
    and offers him meat. The father, grieving, asks the son to lead him to a lake,
    where after the son's departure a supernatural being appears and restores his
    sight by removing harmful substances from his eyes. The restored man hides; the
    son later finds blood in the water and thinks his father has been devoured, while
    the mother reacts harshly and tells him to stop mourning.
  language: English
  quote_policy: summarized
