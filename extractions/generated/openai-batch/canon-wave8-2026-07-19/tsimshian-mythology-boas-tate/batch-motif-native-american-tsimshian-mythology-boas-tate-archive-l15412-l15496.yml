candidate_motifs:
- id: motif:1
  label: Mockery of illness provoking violent retaliation
  taxonomy_refs: []
  basis: The passage links public mockery of Dzagam-txa-n!e'°x's bodily illness to
    Haimas's shame and subsequent violence against his sister and Nes-balas's party.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage reports the sequence but does not prove whether Nes-balas's
    people actually began the mockery.
- id: motif:2
  label: Sibling pair in a destructive revenge sequence
  taxonomy_refs:
  - sibling_pair
  basis: 'Haimas and his sister are central to the episode: he destroys her after
    the mockery and uses that act as the model for his declared destruction of Nes-balas
    and his warriors.'
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The available taxonomy label is broad; the passage is not a twin or cooperative
    sibling-pair narrative.
- id: motif:3
  label: Fire killing used to announce further destruction
  taxonomy_refs: []
  basis: Haimas burns his sister alive in a large fire, spits into it after she is
    consumed, and verbally parallels her destruction with his intended destruction
    of Nes-balas and his warriors.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not state that the burning is an offering to a deity,
    so it is not classified as a religious sacrifice.
- id: motif:4
  label: Feast-house or doorway ambush of invited enemies
  taxonomy_refs: []
  basis: After a messenger summons Nes-balas and his party, Haimas's people use a
    prepared ditch, door coverings, uproar, and armed guards to kill entrants and
    conceal the massacre.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage calls the place a feast-house in Gik's report, but the narrative
    describes the killing setup rather than a normal feast.
- id: motif:5
  label: Sole escapee reports a massacre
  taxonomy_refs: []
  basis: Gik hears groans, flees, reaches other people, and reports that he is the
    only one who escaped the destruction of the chief's princes and warriors.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a single survivor, not a survivor-pair pattern.
- id: motif:6
  label: Defeat caused by loss of chief and warriors
  taxonomy_refs: []
  basis: The up-river tribes flee in battle because no warrior is left among them
    and they have no chief to command them.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents this as a battle outcome, not as a divine judgment
    or cosmic punishment.
- id: motif:7
  label: Victorious return with public taunt over defeated enemies
  taxonomy_refs: []
  basis: Haimas returns in canoes with warriors, sings in front of Nes-balas's camp,
    mocks them, and has a spokesman declare that the defeated tribes are slaves and
    in his power.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The claim of enslavement is reported as the victor's boast within the
    passage.
