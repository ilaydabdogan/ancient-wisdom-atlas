canonical_text:
  quote: ''
  summary: During the fishing season at Nass River, Haimas's ill sister Dzagam-txa-n!e'°x
    is secretly observed and mocked. Ashamed, Haimas summons his people, has his sister
    dressed in fine regalia, seats her on a board, burns her alive, forbids mourning,
    and declares that he will destroy Nes-balas and his warriors as he destroyed her.
    The next day Haimas's people dig a deep ditch inside his doorway and invite Nes-balas
    and his party. Amid singing, drums, whistles, grizzly-bear skins at the doorway,
    and armed attendants, Nes-balas and his princes and warriors are clubbed one by
    one and thrown into the ditch. Gik escapes and reports the massacre. Allied tribes
    attack Wuts!En-a'luk but suffer defeat because their warriors and chief are gone.
    Later Haimas arrives in canoes with warriors and boasts over his victory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Haimas planned to kill Nes-balas during the fishing season when people were
    at Nass River using fish rakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Haimas's sister Dzagam-txa-n!e'°x was ill, had been married to a Tlingit chief,
    had left him because he had many wives, and is said to have been bewitched by
    those wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four men came secretly by canoe at night, looked through a knot-hole, saw
    Dzagam-txa-n!e'°x's disturbed bowels, laughed, and spread the mocking statement
    among people raking fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Haimas was ashamed by the mockery and sought to learn who had started it;
    the people said Nes-balas's people had done it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Haimas invited his tribe, made a large fire, ordered attendants to dress his
    sister with his best dancing blanket and abalone-shell headdress, seated her on
    a board, and had her burned alive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After his sister was consumed, Haimas forbade weeping, spat into the fire,
    and declared that he would destroy Nes-balas, his warriors, and his brothers as
    he had destroyed his sister.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the following day Haimas's people dug a long, wide, deep ditch across the
    inside of the house door and sent a messenger to Nes-balas, his warriors, and
    the princes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nes-balas arrived with his people, brothers, and princes; Wuts!En-a'luk people
    danced on the seashore, and each Wuts!En-a'luk warrior held a war-knife in his
    right hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Haimas's house people sang, beat drums, blew whistles, and made an uproar
    while two grizzly-bear skins were hung at the door, one outside and one inside.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Armed men at the doorway lifted and dropped the grizzly-bear skins; as Nes-balas
    and then the other princes and warriors entered, inside guards clubbed them, killed
    them, and threw the bodies into the ditch.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Gik, the last man, heard groans through the uproar, ran away, reached Gul-qa'q's
    remaining people, and reported that he alone had escaped after Haimas destroyed
    the chief's princes and warriors.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Several tribes assembled and fought Wuts!En-a'luk, but the up-river people
    fled because no warrior and no commanding chief remained among them; many of them
    were slain or wounded.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The G'i-spa-x-la'°ts were in mourning because they had no chief except Nes-wa-ma'k,
    whom people avoided because he had not rescued Nes-balas's family.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Three days after the battle Haimas came with four large canoes full of warriors,
    stopped before Nes-balas's fishing-camp, sang, rejoiced, mocked the camp, and
    had one of his men proclaim that the defeated tribes were in his power.
  category: speech
  evidence_refs:
  - ev:10
