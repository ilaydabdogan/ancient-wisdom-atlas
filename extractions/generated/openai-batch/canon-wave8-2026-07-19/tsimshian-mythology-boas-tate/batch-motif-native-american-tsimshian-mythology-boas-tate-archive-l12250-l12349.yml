canonical_text:
  quote: ''
  summary: Tsauda marries the chief's lame second daughter, takes her upward to his
    supernatural father's house, where she is washed four times and transformed into
    a radiant beautiful woman, and receives a magic sling and stones. In rivalry with
    Halus, Tsauda's water-blowing causes Halus's driftwood to smoke, while Tsauda's
    pitchwood burns well. During a spring migration obstructed by wind and a rocky
    point, Halus's sling-stone misfires through his mother-in-law's lip-hole, while
    Tsauda's stone opens a hole through the rock for the canoes. The passage ends
    with the chief desiring a large copper on a dangerous high mountain where previous
    climbers have died.
  language: English
  quote_policy: summarized
