canonical_text:
  quote: ''
  summary: The passage contains a lament-song about a dear lord, the destruction of
    Dzi'gwa, a shining garment, and gathering bones, followed by an explanation of
    the Beaver Hat. The prose narrative describes war between the Eagle Clan and the
    Ganha'da, a jealous husband's killing of his Eagle wife, her younger brother's
    impersonation of her and revenge killing of the husband, the defeat and canoe-flight
    of the Eagle Clan, the loss of coppers and a carved eagle crest used as anchors,
    and the swallowing of canoes by a supernatural halibut that is killed from inside
    by two brave men.
  language: English; includes transcribed Tsimshian song text
  quote_policy: summarized
