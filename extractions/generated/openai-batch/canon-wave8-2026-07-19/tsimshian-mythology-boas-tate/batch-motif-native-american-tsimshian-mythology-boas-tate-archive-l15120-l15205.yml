canonical_text:
  quote: ''
  summary: A son named Txa-dzi'°kik becomes angry because his father, the great chief
    Dzeba'sa, honors Nes-balas more highly. Despite warnings, Txa-dzi'°kik uses feasts,
    gifts, and claims of precedence to challenge Nes-balas. After Dzeba'sa publicly
    honors Nes-balas at a greater feast, Txa-dzi'°kik ambushes him with warriors in
    canoes, but Nes-balas shoots him in the left eye and defeats his men. The conflict
    begins a war between the brothers. Txa-dzi'°kik later dies, and Gaini succeeds
    him and takes his name. Gaini, now bearing the name Txa-dzi'°kik, tries to hold
    a great feast, but Tsimshian chiefs do not attend because Nes-balas was not invited
    first. Nes-balas is described as generous and beloved. A later invitation and
    demand involving feathers leads to another secret night ambush attempt.
  language: English
  quote_policy: summarized
