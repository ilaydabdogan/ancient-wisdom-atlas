canonical_text:
  quote: ''
  summary: A princess leaves Metlakahtla at night with a young man who proves to be
    Mink and lives with him in a den. She is unhappy, hides his stored eels as a joke,
    later uses his desire to imitate rank-marking bone ornaments to fasten his ear
    to the ground with a sharpened spruce branch, killing him, and returns to her
    father. The next tale begins by stating that people formerly married animals and
    other creatures; a chief asks for women of the Robin and Sawbill Duck tribes,
    and hunters fast before searching mountains and sea.
  language: English
  quote_policy: summarized
