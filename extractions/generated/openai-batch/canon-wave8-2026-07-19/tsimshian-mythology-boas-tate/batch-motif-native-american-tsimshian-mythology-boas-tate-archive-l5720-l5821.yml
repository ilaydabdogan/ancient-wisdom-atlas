canonical_text:
  quote: ''
  summary: 'The passage concludes an Otter episode: Prince Otter provides food for
    his chief-grandfather, is publicly protected and celebrated, is later killed by
    hunters from an uninformed village, and his death brings mourning, atonement goods,
    and explanatory warnings about girls and about public naming feasts. The passage
    then begins the tale of a widow and her daughter, who are left behind during stormy
    travel, camp by a high rock, and encounter a nightly visitor who asks to marry
    the daughter, provides food and fuel, and foretells a son who will be a great
    hunter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little Otter brings a large halibut for his grandfather; the chief is glad
    and loves his grandchild because he had brought the chief's daughter back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Little Otter brings more fish and animals daily; the chief hosts a feast,
    identifies Otter as his grandchild and source of the food, and instructs chiefs
    and tribes not to hurt him on the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After killing seals, Otter carries a large seal in his mouth; four hunters
    in a canoe strike or shoot him, take the seal, and throw him away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Otter does not return, his grandfather sends men to inquire in villages;
    at the village of an uninvited chief, people report having killed an otter with
    a large seal and say they had not known he was a prince.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Prince Otter's mother faints and dies of sorrow, and the other chief comes
    with his people and costly goods to atone for Prince Otter's killing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narrator states that this is why people were afraid to leave girls alone
    in the woods, because the bad Otter might deceive them.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A source note states that the episode explains why people made great feasts
    when a chief's child was born and named, so that everybody would know about it.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: A poor widow and her young daughter are left far behind the canoes during
    a north-wind storm on the way to Nass River; they camp at the foot of a high rock
    and build a hut for shelter.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the hut, the widow sleeps on one side of the fire and her daughter on the
    other; at midnight someone enters, touches the daughter, asks to marry her, and
    she agrees; when he comes to her, she feels a stinging sensation like nettles.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Each morning a partridge is found at the mother's door and there is enough
    fuel; the nightly visitor says they will have a son who will be a unique great
    hunter and that he will always be with him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The morning after the visitor's prophecy, the weather is calm; the widow reaches
    Nass River when the fish arrive and later has success with salmon and dried berries.
  category: sequence
  evidence_refs:
  - ev:11
