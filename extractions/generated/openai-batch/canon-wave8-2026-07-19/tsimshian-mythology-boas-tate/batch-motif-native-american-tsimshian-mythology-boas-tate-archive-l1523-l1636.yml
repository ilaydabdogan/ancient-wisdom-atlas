canonical_text:
  quote: ''
  summary: TxamsEm, after eating Grizzly Bear's provisions, reaches a salmon creek
    and is hosted by Deer and Deer's wife. He persuades Deer to help with wood-splitting,
    kills Deer with a stone hammer, and cooks the meat in a pit. An animate Stump
    eats the cooked meat. TxamsEm then paints his face black, returns by canoe, falsely
    sings that wolves killed his grandfather and brother-in-law, and eats the provisions
    in Deer's house after Deer's wife runs away. In a following episode, Chief Seal
    hosts TxamsEm and produces oil from warmed fingers for salmon. TxamsEm tries to
    imitate Seal, scorches his own fingers, eyes, and mouth, and the passage gives
    this as an explanation for why human fingers no longer have eyes and mouths.
  language: English
  quote_policy: summarized
