canonical_text:
  quote: ''
  summary: A great chief arranges for his son to marry the princess after promising
    to care for her girls. The girls are brought from a hollow tree and incorporated
    into the chief's household. The princess has children, but insults about her having
    been found on the beach lead her to send most of her children by canoe toward
    her native home, guided by a young eagle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The great chief says his son shall marry his niece, and she agrees on the
    condition that the chief take care of her girls.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men sent to bring the girls fail at first because the girls are afraid
    when they hear the Haida language.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The princess and her new husband go to the hollow tree, call the children
    out, have them put on fur garments, and bring them into the chief's house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The great chief orders food for the girls and declares that he will take them
    as his own children and control future marriage requests for them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief's son is married, and the great chief invites other chiefs to the
    marriage festival.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The young eagle continues to love the princess, is fed by her, visits her
    grandfather at Nass River, and returns to her.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The princess bears four boys and two girls, while her former companions also
    marry and have children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the princess's younger daughter hurts a playmate, the playmate's mother
    insults her by saying her father found her mother on the beach and did not marry
    her like a princess from her father's house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The princess's boys do not speak her language; only her elder daughter can
    speak it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the grown sons quarrel and fight with a relative's son, the relative's
    mother calls them slaves and repeats that their mother was found on the beach.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After crying, the princess asks her husband to make or obtain a good-sized
    canoe so she can send all her children to her own country.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The canoe is loaded with costly coppers and slaves for the boys and one daughter;
    the father keeps only the younger daughter.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The princess tells her elder daughter that the young eagle will guide them
    to the mother's native home, and the husband fastens a wooden crosspiece on the
    canoe bow for the eagle to sit on.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: During the voyage, the young eagle flies ahead, perches at intervals, leads
    the canoe past named places, and guides the party across a great sea toward a
    blue mountain and islands.
  category: sequence
  evidence_refs:
  - ev:9
