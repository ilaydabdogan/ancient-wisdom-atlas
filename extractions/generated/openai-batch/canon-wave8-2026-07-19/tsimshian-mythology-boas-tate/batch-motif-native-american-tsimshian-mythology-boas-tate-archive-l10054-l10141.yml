canonical_text:
  quote: ''
  summary: A young eagle leads children of Princess Daul/Daut back toward Nass River.
    They arrive richly dressed at a village, are recognized by an old blind chief
    through questioning and naming, and the eldest son is appointed successor. After
    the old chief dies, the new chief later leads an expedition against people connected
    with the murderers of his relatives, killing the camp except for a related slave-woman
    and her daughter.
  language: English
  quote_policy: summarized
