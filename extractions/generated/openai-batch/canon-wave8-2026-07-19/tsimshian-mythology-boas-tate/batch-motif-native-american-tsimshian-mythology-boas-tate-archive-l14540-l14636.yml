candidate_motifs:
- id: motif:1
  label: Recovery of bones with restitution of garments and honor
  taxonomy_refs: []
  basis: The passage describes recovery of bare bones and baskets, mourning, retrieval
    of costly goods, return of garments with feathers, and the honoring of the princess.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: This is the conclusion of a prior episode; the earlier causal context
    is outside the supplied passage.
- id: motif:2
  label: Sleep-time ascent to a sky-near rock
  taxonomy_refs:
  - ascent
  basis: The brothers sleep in the mountains and wake on a flat rock raised high above
    the ground, with stars so near they can touch them.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The being that raised the rock is not identified in the passage.
- id: motif:3
  label: Safe return through obedience, prayer, and descent
  taxonomy_refs:
  - return
  - initiation
  basis: The youngest brother obeys the daughter of the Sun, survives while his brothers
    die, prays to celestial beings, and descends safely by arrow and rope.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage is brief and does not explicitly label the event as an initiation.
- id: motif:4
  label: Retribution after harming an animal being
  taxonomy_refs: []
  basis: The hunters burn the squirrel’s tail and then wake in a pit; after people
    kill the squirrels, the surviving female Squirrel curses the town with fire.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The relation between the first squirrel, the old woman Squirrel, and the
    surviving female Squirrel is not fully specified.
- id: motif:5
  label: Fatal imitation in a fire ordeal and patient survivor
  taxonomy_refs:
  - initiation
  basis: Five hunters jump into the fire after seeing the roasted dog alive on the
    pit rim, but the chief’s son waits and survives after later guidance.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not state whether the dog’s reappearance is a true revival,
    illusion, or other supernatural event.
- id: motif:6
  label: Narrow path chosen after supernatural guidance
  taxonomy_refs:
  - initiation
  basis: Mouse leads the survivor to Squirrel, who tells him to take the narrow trail
    and avoid the wide trail; he follows the instruction and arrives home.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The wider symbolic meaning of the two paths is not explained in the passage.
- id: motif:7
  label: Settlement-burning curse with spared survivor’s house
  taxonomy_refs: []
  basis: The surviving female Squirrel declares that the town will burn after four
    days, and the town burns while only the young chief’s house is spared.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The destruction is a town fire, not explicitly a world-destroying fire.
- id: motif:8
  label: Capsized persons transformed by Land Otter people
  taxonomy_refs:
  - shapeshifter
  basis: The passage states that Land Otter people catch someone who capsizes and
    transform that person into a land otter.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The transformation process is stated generally but not described in detail.
- id: motif:9
  label: Resistance to supernatural lure and deceptive apparition
  taxonomy_refs:
  - trickster_boundary
  - shapeshifter
  basis: The man refuses the moving fire, makes his own fire, turns away from canoe
    visitors, burns the paddles, and reveals transformations involving minks and driftwood.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage indicates deception and transformation, but does not explicitly
    identify the canoe visitors as Land Otters in that sentence.
