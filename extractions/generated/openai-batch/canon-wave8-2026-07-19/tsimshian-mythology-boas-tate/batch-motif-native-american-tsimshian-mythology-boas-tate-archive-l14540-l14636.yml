canonical_text:
  quote: ''
  summary: 'The passage closes an episode in which a princess and chiefs recover bones
    and goods from a grassy rock and little island, mourn dead princesses, stone the
    bones of a bad shaman, return garments with feathers, and honor the princess.
    It then gives three short myths: three brothers wake on a rock raised near the
    stars, and the youngest survives by obeying the daughter of the Sun, praying,
    and climbing down; six hunters punish a squirrel, are trapped in a pit, and only
    a chief’s son survives after guidance from Mouse and Squirrel, after which a surviving
    Squirrel curses the town with fire; Land Otter people transform capsized persons,
    but one man resists their deceptive fire and canoe manifestations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chiefs weep, accompany the princess to the grassy rock, allow her father
    to go ashore first, and then gather their daughters’ hand baskets and bare bones
    before mourning on the island.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Everyone who passes the bare bones of the bad shaman throws stones at them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The princess’s father takes costly garments, arrows, feathers, and abalone
    shells from the house on the little island, returns the children’s garments to
    the chiefs with ten feathers each, and the princess is honored by all the tribes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three brothers go up the mountains to hunt, sleep, and wake on a flat rock
    risen high above the ground with the stars near and without food or water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eldest brother proposes cutting goat-skin ropes and climbing down, while
    the youngest proposes waiting to see if the being who lifted them will return
    them in sleep.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A voice identified as the daughter of the Sun tells the youngest brother to
    put a round pebble in his mouth, and he obeys.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The youngest brother wakes to find his brothers dead, understands from a dream
    that they tried to climb down without praying, prays to the Sun, Moon, and Stars,
    and descends safely using an arrow and rope.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Six hunters’ provisions are stolen by a squirrel; they catch the squirrel
    and throw it into the fire, burning its tail, and the next morning they and their
    six dogs are in a deep pit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hungry hunters kill and roast one dog, then see the dog alive on the rim
    of the pit; five men jump into the fire, while the son of a chief waits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mouse leads the surviving young man to a house where an old woman, Squirrel,
    tells him he would have died if he had jumped into the fire and instructs him
    to take the narrow trail, not the wide one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man wakes in the forest, sees the bones of his companions, takes
    the narrow path, and arrives home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After hearing the survivor’s account, the people kill squirrels except for
    one female, who curses the town to burn after four days; the town burns, but the
    young chief’s house is spared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that Land Otter people catch a capsized person and transform
    that person into a land otter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A man traveling with his sister capsizes, resists a moving fire by making
    his own fire, turns away from canoe people, throws their paddles into the fire,
    and sees the paddles become minks while the people disappear and the canoe becomes
    driftwood.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Land Otters make another attempt to get hold of the man, but fail.
  category: action
  evidence_refs:
  - ev:11
