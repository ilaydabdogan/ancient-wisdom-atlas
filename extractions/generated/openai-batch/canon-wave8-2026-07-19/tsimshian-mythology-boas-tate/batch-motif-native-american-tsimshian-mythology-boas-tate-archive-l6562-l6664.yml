canonical_text:
  quote: ''
  summary: An old woman instructs a prince how to enter the house of Chief Pestilence
    and avoid the maimed people calling from both sides. The prince obeys, is boiled
    until only bones remain, restored to life by the chief's daughter leaping over
    his bones, and transformed into a beautiful being with fiery hair. After discovering
    that his companion has become bare bones by the brook, he brings the bones to
    Chief Pestilence, who restores and beautifies the companion as well. The two return
    home after a time distortion, and the prince's rejected cousin tries unsuccessfully
    to attract him.
  language: English
  quote_policy: summarized
