canonical_text:
  quote: ''
  summary: TxamsEm leads animal companions in a Killer Whale canoe against the Master
    of the South Wind. Cockle boasts but fails to kick the South Wind chief and is
    broken and eaten by TxamsEm. Red Cod makes smoke with a fire-drill and cedar bark,
    causing the South Wind chief to cough and stumble onto Halibut, while Devilfish
    holds him. Under threat, the Master of the South Wind promises a weather pattern,
    and TxamsEm accepts four fine days at a time. The party returns home, and the
    passage explains that good weather now occurs. A new episode begins with TxamsEm
    hungry near a large town.
  language: English
  quote_policy: summarized
