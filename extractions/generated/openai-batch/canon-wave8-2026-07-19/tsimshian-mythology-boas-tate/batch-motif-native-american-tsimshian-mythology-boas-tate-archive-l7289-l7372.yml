  summary: The passage reports the prince's account of a salmon journey through fish
    towns to a canyon blocked by nets, gives instructions for treating salmon remains
    so the salmon return and revive, describes a sustaining pebble from the Salmon
    father, and narrates the prince's later transformation into a shining spring salmon
    at an eagle trap, his seizure by a hawk, death, burial, and a night vigil by his
    companions.
