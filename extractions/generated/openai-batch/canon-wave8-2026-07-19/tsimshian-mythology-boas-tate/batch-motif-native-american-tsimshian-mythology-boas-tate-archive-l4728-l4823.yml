canonical_text:
  quote: ''
  summary: The passage first recounts a young man and the White-Bear Woman visiting
    a cave-dwelling shaman woman who kills hunters; their two dogs grow large, kill
    the shaman woman, and her living head is set on a pole before the young man and
    pups die. It then begins the tale of a hunter whose wife dies at a mountain camp;
    he carves a red cedar image of her, makes it appear to weave, speaks for it, and
    passing hunters and two runaway sisters encounter the wooden wife.
  language: English
  quote_policy: summarized
