canonical_text:
  quote: there was winter on one side, and midsummer on the other side.
  summary: During winter feasting, fresh foods from Robin Woman's side are served
    and described as connected with a marvelous seasonal house. Sawbill-Duck Woman
    seeks food from her father, arrives in two loaded canoes with visible mussels,
    and is misjudged by the chief, who orders the canoes overturned. The rich cargo
    is revealed, but when it is to be retrieved it has become rocks and boulders on
    the beach.
  language: English
  quote_policy: quoted
