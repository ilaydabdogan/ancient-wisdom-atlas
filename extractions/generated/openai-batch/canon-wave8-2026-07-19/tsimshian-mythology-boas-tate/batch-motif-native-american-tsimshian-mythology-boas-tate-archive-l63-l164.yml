canonical_text:
  quote: ''
  summary: In a dark world, a chief and chieftainess at Kungalas lose their beloved
    only child. After corpse preparation and repeated wailing, a shining youth appears
    where the body had been and says Heaven sent him to comfort the mourners. The
    youth first refuses food, but after tasting whale meat containing a scab from
    the slaves called Mouth At Each End, he becomes extremely hungry and consumes
    the provisions of his father's house and then of the tribe.
  language: English
  quote_policy: summarized
