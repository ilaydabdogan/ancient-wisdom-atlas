    power, a large Frog at the bottom of the lake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The brothers come to a narrowing valley between two mountains where the mountains
    form a cave that opens and closes, described as twinkling.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nalq, Little Grindstone, and Little Crabapple Tree each try to pass through
    the cave after counting four, but the cave closes and kills each of them.
  category: sequence
  evidence_refs:
  - ev:5
