canonical_text:
  quote: ''
  summary: A witch-host secretly calls a large Frog from a lake and attempts to feed
    it the four young men lodged in her house, but the Frog swallows her wet cedar-bark
    pole instead, and the witch dies. Nalq and his brothers later revive murdered
    people with a plume, pass a deadly closing cave where Little Feather revives his
    killed brothers, marry daughters of Air chiefs, and become associated with explanations
    for ice, rain, and whirlwinds accompanying winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old woman rises secretly before morning, goes to the beach, shouts four
    times, and a large Frog comes up from the lake water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman tells the large Frog to open its mouth so she can feed it four
    young men who stayed in her house, but she throws in a pole with wet shredded
    cedar bark, which the Frog swallows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator identifies the woman as a witch who had killed many travelers
    and describes the Frog as her supernatural power, fed with moisture from her breath.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Frog swallows the wet cedar-bark pole, the woman develops stomach
    pain, says she has brought misfortune on herself, and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The brothers find another house containing many killed bodies and bones, place
    the bodies near the lake in order, and Nalq waves the beautiful plume over them
    four times so that they return to life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The revived people say they died in the house of a kindly woman on the other
