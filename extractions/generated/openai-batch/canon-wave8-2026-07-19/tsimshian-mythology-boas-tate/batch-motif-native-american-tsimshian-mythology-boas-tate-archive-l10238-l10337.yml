canonical_text:
  quote: ''
  summary: A prince kills a frog by throwing it into the camp fire. On the next morning's
    canoe journey home, a beautiful mourning woman repeatedly calls from the beach
    to be taken along; whenever the prince tries to embrace her, she vanishes and
    a frog leaps away. After the travelers refuse her final request, she announces
    a sequence of deaths along their route. The prince and two companions die in the
    order she predicted, leaving only the steersman, who returns to the village and
    begins recounting the fishing trip, the prince's anger over a hat that spoiled
    his chance to spear a large trout, and the burning of the frog at camp.
  language: English
  quote_policy: summarized
