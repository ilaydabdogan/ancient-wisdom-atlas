canonical_text:
  quote: ''
  summary: 'The passage first explains how the burned ashes of the dead chief Baboudina
    become mosquitoes. It then begins a tale of ten hunting princes: the eldest and
    then the second brother follow a repeated path through animal encounters, a mountain
    crossing, a village invitation, hospitality from a chief, a command to hunt grizzly
    bears, weapon failure, death by bear, and postmortem hanging in the chief''s house.'
  language: English
  quote_policy: summarized
