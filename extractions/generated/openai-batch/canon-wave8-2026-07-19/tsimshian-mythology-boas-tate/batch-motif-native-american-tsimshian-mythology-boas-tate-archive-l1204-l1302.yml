canonical_text:
  quote: ''
  summary: TxamsEm sees a canoe of young women, including the chief's daughter, going
    to pick blueberries. He catches and skins a deer, uses the skin to appear as a
    swimming stag, is taken into the canoe, and wounds the princess. After many shamans
    fail to cure her, TxamsEm arrives pretending to be a shaman with his grandchildren
    the Crows as attendants. He stages a hail effect with small white stones dropped
    on the roof, covers the princess with a cedar-bark mat, touches the wound, and
    commands it to be cured. The grateful chief promises him a reward, and TxamsEm
    asks that the town move away and leave all provisions behind. The people leave
    their food; later the Crows eat boxes of crabapples mixed with grease.
  language: English
  quote_policy: summarized
