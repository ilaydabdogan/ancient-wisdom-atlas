canonical_text:
  quote: '"If you make a deep cut in your cheek, then you may marry me."'
  summary: A Tsimshian story explains a chiefly marriage custom, then tells how a
    princess rejects and humiliates her cousin, a prince expected to marry her. She
    repeatedly promises marriage if he disfigures himself, then mocks him. Ashamed,
    he leaves home and reaches a small hut where a woman by a fireplace recognizes
    and feeds him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage describes a custom in which the chief's nephew is expected to
    marry the chief's daughter so that the nephew may inherit the chief's place.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief has a beautiful daughter, and the chief's sister has a son; the
    people expect the two young royals to marry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The princess rejects the marriage proposal even though her relatives accept
    it, while the young prince continues to love her and wants to speak with her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a meeting under a large tree, the princess tells the prince he may marry
    her if he makes a deep cut in his cheek; he cuts his right cheek with a knife,
    and the girls laugh at him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After his first wound heals, the princess kisses him and asks him to cut his
    left cheek as proof of love; he does so despite not wanting to.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At another meeting under the tree, the princess tells the prince to cut off
    his hair before he may marry her; he cuts off his long yellow hair, an act described
    as dishonorable for men in that time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the prince sends word that he wants to marry her, the princess refuses,
    calls him ugly, gives him the nickname Mountain With Two Rock Slides because of
    the scars on his cheeks, and mocks his cut hair as slave-like.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prince becomes ashamed, remembers that he is also a prince, cries because
    his cousin mocked him, and decides to leave his father's and uncle's houses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The prince wanders along a narrow trail and reaches a small hut, where a woman
    sitting by a fireplace invites him in, seats him on the other side of the fire,
    and gives him food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Four young men initially accompany the prince from home, but three return;
    only his dearest friend continues with him to the hut.
  category: relationship
  evidence_refs:
  - ev:9
