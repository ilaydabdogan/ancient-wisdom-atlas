canonical_text:
  quote: ''
  summary: 'A long-absent prince returns with two wives, is first unrecognized because
    he is hairy, then is recognized by his cousin the new chief and honored with celebration
    and garments. His wives help provide fresh meat, bear many pairs of twins, and
    his children become hunters. Before dying, he commands his children not to harm
    his people on the mountains; two later return to their own home, and the narrator
    connects this with wolves fearing humans. A new story begins: a Nass River chief''s
    son and four companions imitate shamanic practice in a hut. After a squirrel hunt,
    the prince enters an open coffin in a graveyard despite warnings and dies; his
    companions leave, forget the event, and later remember when his parents ask for
    him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man decides to go down and visit his own home, leaves his two wives waiting
    outside the village, and enters his father's house alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people in the house do not recognize him because he is very hairy, and
    he sits at the end of the large fire near the door.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The new chief asks where the man comes from; the man says he is the son of
    the great chief of the house, and the new chief seats him at the head of the fire,
    embraces him, and announces him as a lost cousin thought dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince brings his two wives into the chief's house; they sit at his sides,
    receive food, and are given costly garments, while he receives dancing and marten
    garments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each morning the two wives smell animals near the village; the animals are
    caught and brought home, and the prince invites people to eat fresh meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The two wives bear multiple pairs of twins: the elder wife bears six pairs,
    the other wife bears three pairs, making eighteen children, and the children are
    described as skillful hunters, including the girls.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before he dies, the prince tells his children not to hurt his people if they
    return to their own home and see them on the mountains, and not to go back home
    if they marry among these people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Only two of the children return to their own home, and the narrator states
    that wolves are afraid of human beings up to this day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the next story, a Nass River chief's only son has four same-aged friends;
    they build a small hut, the prince pretends to be a shaman, and his friends serve
    as singers with a skin drum and time-beating board.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After hunting squirrels, the prince and his friends pass a graveyard near
    a brook behind the village and see an open coffin.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The prince asks whether he should enter the open coffin, ignores his friends'
    request to stop, jumps in, lies down, and immediately dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The four friends weep, then leave one by one; fearing ghosts, the last friend
    runs home, and the friends forget what happened until the prince's parents ask
    about him.
  category: sequence
  evidence_refs:
  - ev:10
