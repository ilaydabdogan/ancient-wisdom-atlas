canonical_text:
  quote: ''
  summary: 'Holdamia displays crest objects that fill Dragging Along Shore''s house
    with fog and sea imagery; Dragging Along Shore receives a hereditary family name
    and prospers through the blessing of Chief Na-gun-a''ks. Later, companions violate
    a command not to harm fish by abusing a bullhead, and a whirlpool swallows the
    canoe. A survivor reports the deaths. The passage then begins another tale: before
    the Deluge, four brother chiefs live during a famine; the eldest invites a thin
    traveler from the ice into his house and offers snow after the traveler says he
    has eaten only snow.'
  language: English
  quote_policy: summarized
