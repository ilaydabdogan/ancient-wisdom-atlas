canonical_text:
  quote: ''
  summary: A transformed woman appears to her brothers as a beaver-like being, unable
    to speak, living in a lake with many beavers. Her brothers later break the dam,
    the beavers scatter, and the woman dies when found on dry ground; the passage
    closes with an explanation of beavers’ female ancestry and brown fur. A new tale
    begins in which ten winter-hunting brothers and their wives descend from a mountain
    to a village. A host woman takes a crying baby, sings into its ear, and the baby
    dies bleeding from the ear. The parents warn the brothers not to sleep, evade
    night approaches by their hosts, and flee before dawn while the villagers pursue
    them up the mountain.
  language: English
  quote_policy: summarized
