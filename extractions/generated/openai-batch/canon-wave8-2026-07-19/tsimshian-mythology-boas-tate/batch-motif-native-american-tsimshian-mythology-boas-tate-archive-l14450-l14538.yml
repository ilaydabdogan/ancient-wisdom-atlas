canonical_text:
  quote: ''
  summary: A princess escapes from an old shaman by cutting his canoe loose, refuses
    his pleas, calls birds four times as he had done to his victims, and the birds
    devour him. She returns alive to her parents' town, tells her story, and reports
    to assembled chiefs how the shaman transformed into a handsome man, abducted and
    abandoned princesses on a rock, and left their bones there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princess leaves her hiding place, enters the canoe, cuts its line with
    a small woman's knife, and pushes the canoe away from the rock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man sees the princess in the canoe and asks her to come ashore and
    take him with her, addressing her as his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The princess refuses to take the old man, says he intended to kill her, and
    says she saw the bare bones of princesses on the rock.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The princess says she will call down the birds and give them the old man's
    flesh, then shouts four times and paddles away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Numerous birds darken the heavens, descend to the rock, and devour the old
    man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princess paddles to her father's town in the evening, sits beside her
    mother, and tells her mother she is still alive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People assemble in the chief's house, and the princess tells what happened
    to her and weeps after telling the story.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the princess's request, her father sends a messenger to invite chiefs of
    tribes who lost daughters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The princess tells the assembled chiefs that their lost children were killed
    by the bad shaman who had a house on a little island outside Sliding Mountain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In her account, the princess says the shaman transformed himself into a handsome
    young man with blond hair tied at the back to deceive her.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The princess says she later saw his wrinkled face, recognized him as a seller
    of beautiful arrows, and heard his name given as The Man Who Bound Up His Wrinkles
    At The Back Of His Head.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The shaman promises feathers and abalone shells, takes the princess to the
    grassy rock, pushes his canoe away, and leaves her on the rock.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The shaman shouts to heaven four times so that birds descend to devour the
    princess, but she hides under a rock on the beach.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The princess sees bare human bones and hand baskets on the rock and concludes
    that the bad man killed the lost princesses.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: After four days on the rock, the princess hides with seaweed over her head
    when the shaman returns, then cuts the canoe line and shouts four times as the
    birds descend.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
