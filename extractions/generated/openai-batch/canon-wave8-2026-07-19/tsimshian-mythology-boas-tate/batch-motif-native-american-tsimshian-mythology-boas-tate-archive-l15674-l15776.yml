canonical_text:
  quote: ''
  summary: After earlier killings by Haimas, opposing groups gather at camps across
    a river. Haimas sends singing canoe-messengers who exchange threats with the opposing
    side. Dl°ks, Haimas's chief wife and daughter of Nes-y!aga-ne't, is instructed
    by her father's warriors to place excrement on Haimas's pillow, provoking Haimas
    to send his brothers to retrieve her. The brothers are ambushed at the G'it-dzi'°s
    camp and killed, explicitly as vengeance for Haimas's killing of the wife's father/grandfather.
    A larger battle follows; Haimas's side weakens, his village is taken house by
    house, he escapes with a few survivors, and the victors burn houses, destroy property,
    and shout an owl-like war cry.
  language: English
  quote_policy: summarized
