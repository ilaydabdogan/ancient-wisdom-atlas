canonical_text:
  quote: ''
  summary: A third brother repeats the route of his elder brothers to a mountain and
    a grizzly-bear village, accepts hospitality, is sent against a grizzly bear, and
    dies when his weapons break. The remaining brothers die in the same way. The youngest
    brother mourns, promises the widows he will return, takes a different approach
    by avoiding a porcupine, shoots and touches a white she-bear, and sees her transform
    into a beautiful woman. She explains the brothers' deaths, appears again in the
    town, warns him about the chief's food and the exchange of weapons for dried stalks,
    and gives him two pups, Red and Spots, to help him fight.
  language: English
  quote_policy: summarized
