  text: The third brother sets out to search for his elder brother, takes all his
    weapons, clubs a porcupine, hangs it on a tree, shoots a white she-bear, and goes
    to the top of a mountain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the mountain the third brother sees a large village on the other side,
    slides down on snowshoes, reaches the first house, and looks through a knot-hole
    at a beautiful young woman sitting alone.
  category: action
  evidence_refs:
  - ev:1
