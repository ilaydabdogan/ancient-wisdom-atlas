  text: The woman invites the third brother in, the chief asks about him, and the
    chief has him sent over to be fed with rich food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men meet the third brother at the chief's door, smile, take his weapons,
    seat him on a grizzly-bear skin, and later bring the weapons back while food is
    served.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The next morning a grizzly bear comes down the river, and the chief tells
