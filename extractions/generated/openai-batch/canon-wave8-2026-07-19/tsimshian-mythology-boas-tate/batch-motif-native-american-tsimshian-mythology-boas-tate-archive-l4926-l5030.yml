canonical_text:
  quote: ''
  summary: A young prince secretly visits a great lake at night, where repeated shouting
    summons a beautiful woman from the water who takes him below. His friend spies
    on him, imitates the summons, enters the lake, and abducts a boy who is the child
    of the prince and the lake woman. The child removes the eyes of the friend and
    the villagers, killing them, while the prince and his sister survive. The prince
    returns the child to the lake woman and accuses her. She gives the prince gambling
    tools that make him rich and gives his sister-in-law a wealth garment, an ever-new
    belt, and a blessing connected with her crying child.
  language: English
  quote_policy: summarized
