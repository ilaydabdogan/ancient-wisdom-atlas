canonical_text:
  quote: ''
  summary: The passage describes the village of G'itslEmga'lon, its chief, and the
    chief's daughter Part Summer. During a berry-picking trip, Part Summer slips on
    black bear dung and angrily comments on it. After her basket strap breaks repeatedly,
    her companions leave her behind. Two young men then lead her to an unknown village
    and a large house. A Mouse Woman tells her that Black Bear brought her there because
    of her anger over the bear dung, and warns her not to eat the first salmon or
    the first berry-and-crabapple dish offered by the Bear people because these are
    human remains in deceptive form. Part Summer follows the warning and eats only
    the later good food.
  language: English
  quote_policy: summarized
