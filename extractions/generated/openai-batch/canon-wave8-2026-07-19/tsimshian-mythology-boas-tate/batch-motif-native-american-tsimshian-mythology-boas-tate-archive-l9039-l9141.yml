- id: motif:1
  label: Animal chief transmits dance knowledge to humans
  taxonomy_refs:
  - culture_hero
  - sacred_exchange
  basis: Chief Mouse gives the man dance objects and instructs him to teach people
    how to dance; the passage later says villages learned how to dance because Mouse
    taught them.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents Mouse as the source of dance knowledge, but it does
    not explicitly use the term culture hero; transmission occurs through the human
    man and his wife.
- id: motif:2
  label: Taboo against harming protected animal beings
  taxonomy_refs: []
  basis: Chief Mouse commands humans not to maltreat mice, describes mice as noble,
    and threatens danger or death if a human does harm to a mouse.
  evidence_refs:
  - ev:3
