canonical_text:
  quote: ''
  summary: The passage concludes a narrative in which a woman’s husband visits the
    town of her children, is allowed to remain four days, learns dances and songs
    from the Mouse people, receives dance objects and a command not to harm mice,
    and then teaches humans. It then begins a new narrative about a young chief who
    marries his cousin, takes a second wife, and whose first wife becomes sorrowful,
    withdraws to her father’s house, and weeps while gathering berries near a place
    associated with supernatural beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman went behind her children's town, heard a low moan calling her name,
    and recognized it as her husband's voice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman told her husband her story and said her children were dancing; the
    husband wanted to see the dance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman warned her husband to go away because her children would kill him,
    but he continued holding her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Four young men came to call their mother, saw the man with her, and said they
    must kill him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The mother asked the young men to be kind to the man, identifying him as her
    husband and as like their father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The young men allowed the man to remain among them for four days and then
    required him to return to his own house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:7
  text: The village people slept in the daytime, awoke before dusk, ate, and danced
    all night until daybreak.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: During the four days, the man learned the songs and dances of the village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Chief Mouse commanded the man not to let humans maltreat any mouse seen on
    the road or in the house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Chief Mouse said that all mice on the island were of noble blood and that
    humans who did bad things to mice would be killed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: Chief Mouse gave the man a dancing-feather, a neckband, and a skin drum, and
    told him to teach his people how to dance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:12
  text: The man returned home, taught his people the song, put on an eagle feather
    and necklace, and danced while men, women, and children watched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After four days the wife came back and taught songs to the women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that villages on Queen Charlotte Islands learned how to
    dance because Mouse taught them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: When chiefs of all tribes assembled for a dance in a chief's town, singers
    assembled in the chief's house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:16
  text: In Gitc̱xa'la, a great chief had a beautiful daughter and a nephew who was
    to succeed him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: The nephew, a wealthy young chief and good hunter, married his uncle's daughter
    with the great chief's agreement.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: After a year of marriage, the young chief wanted another princess as wife,
    because the passage says chiefs formerly had many wives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The first wife did not want her husband to take another wife and became sad
    after he married the second princess.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:20
  text: The young chief told his first wife that he loved her more than his new wife
    and loved her with all his life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:21
  text: After midwinter the people moved to the fishing-ground; the young chief took
    his two wives in his canoe, and his uncles traveled in another canoe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: At the fishing-ground, the young chief built a new house, while his father-in-law
    lived in an old house.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:23
  text: When slaves brought salmon to the young chief, he divided it between his two
    wives, but the first wife refused her portion and got salmon from her father's
    people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:24
  text: The first wife left her husband and lived in her father's house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:25
  text: The first wife often went into the woods to gather berries and cried there
    until late evening.
  category: action
  evidence_refs:
  - ev:9
- id: obs:26
  text: Her mother tried to comfort her, but she continued to cry.
  category: action
  evidence_refs:
  - ev:9
- id: obs:27
  text: A high steep rock above the camp was called Place Of Supernatural Beings.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:28
  text: The first wife sat at the foot of the high rock and later stayed at the foot
    of a large old dry tree, weeping after her baskets were full.
  category: action
  evidence_refs:
  - ev:10
- id: obs:29
  text: Before entering her father's house she heard a joyful voice in her husband's
    house, became more sorrowful, went to bed without eating, and wept all night.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:30
  text: The following morning she again picked berries, filled two baskets, sat at
    the same place, and cried.
  category: sequence
  evidence_refs:
  - ev:10
