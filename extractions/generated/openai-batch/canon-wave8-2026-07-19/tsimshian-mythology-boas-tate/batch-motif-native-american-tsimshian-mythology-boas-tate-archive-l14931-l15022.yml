canonical_text:
  quote: ''
  summary: The passage describes ceremonial attempts by dancer companies to catch
    and constrain a tree-dwelling cannibal being. He is dosed, bound with red-cedar
    bark, clothed in grizzly-bear skin, escapes, devours people, is trapped again,
    fed slaves, and later survives an attempted killing with supernatural aid. The
    passage then begins an origin account in which a mountain-goat hunter pursues
    a white bear to a rock, is invited into a mountain house, sees four companies
    including cannibals, experiences a time discrepancy, and is sent back with an
    order to imitate what he saw.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several companies of dancers gather in one house, prepare a mixture of poisonous
    herbs, urine, and other bad things, and sing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the singing, a cry is heard from a tree and a noise from the roof;
    a being descends into the house, catches a person, and is then caught by the dancers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The captured being is dosed through the mouth, given red-cedar bark rings
    and bands, clothed in a grizzly-bear skin, and tied hand and foot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: While the being sleeps, a terrible whistling is heard in his hair, though
    no one is with him; he is watched for four nights.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the watch ends, the great Cannibal throws off the cedar-bark ties and
    grizzly-bear skin, seizes and eats a man, and flies back to his tree house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The cannibal descends twice every day, catches and eats people, and causes
    the villagers to move away while leaving the young man behind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On a high mountain on Nass River, the cannibal roasts a fish by a small fire,
    and a supernatural being tells him that the fish is not fit for him and sends
    him back to the large tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A council decides to catch him with a large wooden trap; dancers sing, drum,
    and beat planks, and the trap shuts when he descends from the roof into the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the second capture, medicine is thrown over him, slaves are brought
    for him, he eats them, and he is again dressed with grizzly-bear skin and red-cedar
    bark rings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After four days, wooden drums and plank-beating are used to drive away his
    supernatural power; he sits on a round rock at low water, and the rock floats
    when the tide rises.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The people try to kill him by forcing his neck under a heavy pole, but supernatural
    power helps him escape; afterward he kills fewer people, remains on the tree for
    generations, and eventually his voice ceases.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the origin account, a mountain-goat hunter pursues and shoots a white bear,
    which disappears into a steep rock; a man comes out of the mountain and calls
    the hunter inside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Inside the mountain is a large house with four companies of people in four
    corners, including dog-eaters and cannibals; the first and last groups fear the
    other two.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The hunter thinks he stayed in the mountain house for three days, but he had
    been away for three years; the supernatural being sends him back and orders him
    to imitate what he saw.
  category: sequence
  evidence_refs:
  - ev:8
