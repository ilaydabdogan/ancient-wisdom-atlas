canonical_text:
  quote: ''
  summary: A prince is taken from a coffin by canoe-borne men sent by his father the
    chief. His beloved friend follows but is unseen and ignored until a pebble placed
    in the prince's mouth restores the prince's perception of him. In the Salmon people's
    village, the prince instructs his friend in food practices, a way to view dancers
    and obtain herring spawn, and later promises to return him toward the Skeena River
    when the ice melts. The prince also relays rules for cutting spring salmon, warning
    of storm disaster if they are not followed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before daylight, canoes arrive at the beach, and men go to the coffin, open
    it, and say the prince's father the chief sent them to take him down.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince rises from the coffin and goes down laughing with joy, while his
    beloved friend stands speechless.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The friend asks the prince not to go with the men, but the prince takes no
    notice of him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The friend jumps aboard the canoe, but the four men and the prince do not
    see him; the prince only reports feeling something touching his right side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The friend squeezes the large red cedar-bark throat objects of the canoe men,
    causing each to faint and then revive when released.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the canoe reaches the destination, the village of the Salmon people rejoices.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the chief's house, the friend remains unnoticed until he removes a small
    pebble from his own mouth and puts it into the prince's mouth; then the prince
    sees him and embraces him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prince tells the friend that if hungry he should take a child from the
    sand-hill, club it, roast it whole, eat, throw the remains into the fire, and
    drink fresh water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only the prince knows the young man is present; at night the two lie in one
    bed and talk together.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The prince instructs the friend to look into the dance house through a knot-hole,
    not to go in, and to put small hemlock leaves into the knot-hole.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Through the knot-hole the friend sees a house full of eagle down, with Salmon
    people dancing in garments set with abalone shells while drum and singing are
    heard.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: After looking through the knot-hole, the friend's eye is full of herring spawn;
    after he inserts the hemlock branch, it too is full of herring spawn, which he
    eats.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After a long stay, the friend becomes homesick, and the prince says he will
    take him up in early spring when the ice has melted, as far as the mouth of the
    Skeena River.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The prince says he will remain while his Salmon father is alive and tells
    the friend to tell the story in his father's house when he gets home.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:15
  text: The prince relays instructions from his Salmon father about cutting spring
    salmon with a musselshell knife and warns that using other methods will bring
    thunder, lightning, heavy rains, and disaster.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The friend says he does not want to leave the prince and fears the prince's
    relatives and father will complain if the prince does not return with him.
  category: speech
  evidence_refs:
  - ev:9
