canonical_text:
  quote: ''
  summary: A returning war party engages in competitive chiefly display involving
    coppers and mocking songs, then travels past several villages where chiefs invite
    LEg'e'°x, offer welcome, and exchange gifts. A captive chief dies on the homecoming
    shore and is buried through payment by LEg'e'°x's head wife. The narrative then
    turns to Sdi'kla escorting Prince Hats!Eks-n!e'°x back from Queen Charlotte Islands,
    pausing at Mount Katsan to ask protection against being beheaded and given to
    another clan. In LEg'e'°x's house, people rehearse a song for a ceremony to remove
    the stain of captivity from his sister as two Haida-speaking canoes arrive.
  language: English
  quote_policy: summarized
