canonical_text:
  quote: ''
  summary: After a plume from heaven has carried off the people and they have died,
    a lone chief's daughter remains. She produces children from mucus and from objects
    kept at her body. The children later ignore her warning against noisy open-air
    play, and the plume descends again. Little Feather takes hold of it, his brothers
    cling to him and become heavy or rooted, and Knife Hand cuts above the plume so
    that they fall. She revives them by waving the plume. The children then reassemble
    the piled bones of the dead, sometimes mismatching body parts, and Nalq/Naki waves
    the plume four times; bones, flesh, skin, and breath return through the four winds,
    restoring a great multitude to life.
  language: English
  quote_policy: summarized
