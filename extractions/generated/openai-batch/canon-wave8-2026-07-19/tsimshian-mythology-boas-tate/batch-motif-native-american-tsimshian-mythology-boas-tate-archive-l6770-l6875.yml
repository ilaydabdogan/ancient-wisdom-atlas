canonical_text:
  quote: ''
  summary: The passage closes a marriage procedure in which a bride is brought by
    canoe, seated beside the bridegroom, and the pair fast silently for three days
    while looking into fire. It then tells of a widow’s daughter who accepts an unseen
    rough-palmed night suitor; animals appear on the beach each morning, and the suitor
    is revealed as a red bear from the water who turns into a rock when observed.
    The next tale begins with winter famine on the Skeena River; a prince gives his
    hungry slave-boy a piece of his mother’s stored dried spring salmon, is scolded
    as a thief, and leaves secretly.
  language: English
  quote_policy: summarized
