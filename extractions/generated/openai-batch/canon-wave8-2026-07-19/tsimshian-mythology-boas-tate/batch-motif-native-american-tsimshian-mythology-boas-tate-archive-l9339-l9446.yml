canonical_text:
  quote: ''
  summary: 'The passage first recounts intertribal trade, feasting, wealth distribution,
    and name-giving in the camp of an old chief, including the rise of his grandson
    and the departure of a supernatural husband/father. It then begins the story of
    Waux, son of Asdi-wa''l: his birth and naming, his father-son hunting apprenticeship,
    separation from and search for Asdi-wa''l, his later skill as a hunter, marriage,
    the birth of twins, mountain-goat hunting, public feast, name proclamation, and
    fame.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tribes from different language groups hear of abundant food in the old chief's
    camp, bring goods, and buy meat and fat with slaves, coppers, skins, spoons, and
    other property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old chief gives a great feast and distributes slaves, canoes, elk skins,
    and raccoon skins; the mother of his grandson gives away spoons and boxes of whale,
    sea-lion, and seal oil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old chief gives his own name to his grandson and gives a great woman's
    name to his daughter; assembled chiefs honor the young chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the old chief dies, the young chief gives a feast, becomes richer, and
    is described as a great hunter whose father was a supernatural being.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young chief never marries, and his mother also avoids marriage because
    she fears angering her supernatural husband.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The supernatural being tells his wife that his visit is the last one, instructs
    her to let his son help her with what she needs, and disappears.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Waux narrative, Asdi-wa'l's wife loves him because she thinks he is
    a supernatural being; she bears a son whom Asdi-wa'l names Waux, meaning very
    light.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Waux is described as able to fly away like a spark.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: As Waux grows, he goes everywhere with Asdi-wa'l, including hunting in woods,
    slippery rocks, and mountains; Asdi-wa'l teaches him how to hunt and entrusts
    him with hunting equipment while stalking animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Waux's uncles leave Asdi-wa'l at KsE-ma'ksEn, they compel Waux to go
    with them; Waux and his mother later travel by night canoe to search for Asdi-wa'l,
    but find he has disappeared.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Waux becomes a skillful hunter who knows his father's hunting ground and weapons,
    kills many kinds of animals, and accumulates meat, tallow, fat, skins, and horn
    or antler utensils.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: At his mother's wish, Waux marries one of her cousins; after his mother dies,
    he continues hunting, sometimes with his wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Waux's wife gives birth to twins after the children struggle in her womb.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Waux and his wife camp at the hunting hut at the foot of a high mountain,
    kill mountain goats, fill the hut with meat, tallow, and fat, and later return
    home for a feast where Waux proclaims the name given by Asdi-wa'l.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Waux's fame spreads among the Tsimshian tribes, and the animals of the woods
    are said to know him.
  category: attribute
  evidence_refs:
  - ev:10
