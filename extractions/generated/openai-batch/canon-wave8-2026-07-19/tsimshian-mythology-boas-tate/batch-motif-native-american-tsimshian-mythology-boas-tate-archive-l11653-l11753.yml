canonical_text:
  quote: ''
  summary: In Chief Na-gun-a'ks's house, Mouse Woman warns Dragging Along Shore to
    offer goods to the chief. Na-gun-a'ks feeds the human guests with whole boiled
    seals, which the Killer Whale crest men can swallow but the Eagle crest steersman
    cannot. After a year, the humans give the chief coppers and provisions. Na-gun-a'ks
    invites supernatural chiefs of the rocks to a feast, reveals them when water enters
    and recedes inside the house, redistributes the gifts, gives Dragging Along Shore
    supernatural regalia and objects, and asks the monsters to protect and help him
    in hunting.
  language: English
  quote_policy: summarized
