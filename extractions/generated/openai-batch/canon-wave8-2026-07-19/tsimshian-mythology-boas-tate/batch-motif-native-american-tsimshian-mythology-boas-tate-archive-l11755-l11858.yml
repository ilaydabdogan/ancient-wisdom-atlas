canonical_text:
  quote: ''
  summary: A party led by Dragging Along Shore receives blessings, rules, gifts, and
    crest objects from Chief Na-gun-a'ks in an underwater setting, returns through
    foam and fog in a copper canoe covered with sea life, is recognized at home after
    a long absence, and later displays the gifts and holds a feast where invited chiefs
    wear their own crests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water runs rapidly through the open door of Chief Na-gun-a'ks's house, the
    canoe floats above the first platform, and the water later subsides.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Two carved rooms appear inside the house: one with two joined-nose killer
    whales called Dash Against Each Other, and another with green seaweed and a copper
    canoe with copper items.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Na-gun-a'ks blesses Dragging Along Shore, promises future provision, warns
    him not to hurt fish or things seen in the water, and instructs him to make burnt-offerings
    and offerings at Na-gun-a'ks's place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Na-gun-a'ks gives the steersman a sea-apple shell hat containing a living
    human-faced person and a box inlaid with abalone shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men sleep in the canoe; in the morning a mountain of foam surrounds it,
    the foam changes into thick fog, a thunder-like noise is heard, and bright sunshine
    follows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The men's hats, the canoe, and the paddles are filled or covered with seaweeds
    and other sea growths; the paddles are also copper and heavy.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
- id: obs:7
  text: The canoe is found at the foot of the high cliff where the anchor had been
    dropped a year before, then travels rapidly home with a bell-like sound when the
    paddle handles touch the canoe.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Dragging Along Shore's elder sister, who has been waiting for her lost brother,
    sees a large monster-like object on the sea; her husband questions it, and the
    men in the canoe answer that they are returning home safely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The village goes to the beach to welcome the lost men, though some people
    are afraid when they see the men and canoe covered with seaweeds, shells, and
    sea creatures.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Young people cannot lift the copper canoe because it is too heavy; two young
    men carry the copper paddles, and the four men carry the copper canoe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dragging Along Shore summons his tribe, recounts the visit to a chief at the
    bottom of the sea, and displays crest objects, carved rooms, a green seaweed garment,
    and copper canoe equipment.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Dragging Along Shore gives a great feast, invites chiefs from surrounding
    tribes, and asks each chief to wear his own crest, hat, and decorated garment.
  category: sequence
  evidence_refs:
  - ev:9
