  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Killer Whale warriors dived into the deep sea to fight the Giant Devilfish;
    dead warriors and severed parts of the monster came back to the surface.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Different clans sent warriors in different numbers, including two at a time
    and four at a time, and many warriors perished while bringing up the monster's
    arms.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bird Garment jumped on the water three times before diving; after repeated
