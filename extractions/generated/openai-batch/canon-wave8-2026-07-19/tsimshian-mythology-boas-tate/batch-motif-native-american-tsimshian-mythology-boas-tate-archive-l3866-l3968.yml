canonical_text:
  quote: ''
  summary: 'The passage first closes a brief account of respectful treatment of animal
    remains: people did not speak badly of animals, burned bones and meat, and said
    this allowed animals to recover from sickness. It then begins the tale of the
    Giant Devilfish: hunters witness Killer Whales gathering after the prince of the
    Killer Whales has been killed by a deep-sea monster. The Killer Whales, organized
    into clans like human beings, send warriors down into the sea to fight the monster;
    many warriors die while severing its arms, and the named Raven-clan warrior Bird
    Garment returns weary but unharmed after cutting off arms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People in former days did not speak badly of animals, burned animal bones
    and meat, and did not leave bones on the mountains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says burned bones and meat allowed animals to recover from sickness,
    while scattered bones made the animals' sickness grow worse.
  category: relationship
  evidence_refs:
