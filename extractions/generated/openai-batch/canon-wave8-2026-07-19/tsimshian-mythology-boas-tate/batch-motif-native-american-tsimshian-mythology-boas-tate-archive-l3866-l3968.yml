- id: obs:3
  text: The young Goat told this information to his friend behind a little spruce
    tree on the slope of the sliding mountain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A good hunter and four men went by canoe around a large island, saw many Killer
    Whales, hid ashore, and saw a Killer Whale floating dead near a high precipice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prince of the Killer Whales had been killed by the Giant Devilfish, whose
    den was called the Living Depths Horror at the foot of the great precipice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief of the Killer Whales sent messengers, called his people to his village,
    gave them a feast, and asked them to help kill the monster because it would be
    dangerous to their children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hunters heard the Killer Whales speak like men, and the passage says Killer
    Whales have four clans like human beings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage identifies Killer Whale clan crests by dorsal-fin features associated
