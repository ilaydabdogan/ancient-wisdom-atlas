canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which a lake woman, carrying
    her child after mourning, leaves the lake, enters salt water, and becomes a being
    part fish and part woman called Haklula'q. A note describes gambling-sticks still
    in use. The next tale, titled “The Spider and the Widow's Daughter,” describes
    famine caused by lack of salmon-catching technology, abandonment of poor people
    by the wealthy, and a widow and her starving daughter living near a brook. A tall
    young man appears, marries the daughter, teaches the widow how to process nettles
    into thread, makes a salmon net with lines and floats, and brings in repeated
    canoe-loads of silver salmon, producing a house full of dried salmon.
  language: English
  quote_policy: summarized
