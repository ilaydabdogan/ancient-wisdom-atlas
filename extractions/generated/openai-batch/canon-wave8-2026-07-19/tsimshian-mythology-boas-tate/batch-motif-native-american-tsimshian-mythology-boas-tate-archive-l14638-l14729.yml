canonical_text:
  quote: ''
  summary: 'An isolated man beside a fire is repeatedly offered fish and seaweed by
    a woman or voice, first suspected as a Land Otter and later accepted as the ghost
    of his drowned sister; after guarding himself and hunting seals, he is rescued
    by a real canoe. A deluge account follows: hunters at Lake Of The Beginning witness
    rising waters flooding the Skeena River when a great whale surfaces. Later two
    brothers go there to obtain supernatural power; the elder descends to a house
    at the lake bottom, encounters storm phenomena and beings including Grizzly Bear,
    Thunderbird, Living Eyes, Mouth At Each End, and Cuttlefish, places several into
    a grizzly-bear box, receives the name Mouth At Each End, and returns with Grizzly
    Bear. The younger brother waits on shore, starves by a spruce tree, and is eaten
    by martens as the passage breaks off.'
  language: English
  quote_policy: summarized
