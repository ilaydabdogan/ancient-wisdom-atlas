canonical_text:
  quote: ''
  summary: A chief sends young men in two canoes with his wife, the Robin Woman or
    princess, to obtain food. On the icy Skeena River she sings a spring song from
    the bow and the ice melts before the canoes. They reach the beautiful town and
    house of Chief Robin, her father, where winter is shown on one side and summer
    abundance on the other. Chief Robin summons his bird people, who gather salmon,
    berries, mountain-goat meat, grizzly-bear meat, and fat. The princess returns
    with loaded canoes, again melting the ice by singing. Her husband's people unload
    the food, feast, and then invite starving Tsimshian tribes to share it.
  language: English
  quote_policy: summarized
