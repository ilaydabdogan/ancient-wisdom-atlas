canonical_text:
  quote: ''
  summary: A young woman follows Mouse Woman’s instructions, smokes an otter den,
    and clubs the otters who emerge. She tells her little Otter child that she killed
    them because they had cast her out before his birth. Meanwhile her human kin learn
    she is missing; shamans locate her in an otter den on an island. The little Otter
    visits his grandfather’s house, then carries his mother across the sea. Gravel
    dropped or used during the crossing becomes sandbars and a sand bridge. They reach
    the mainland, avoid people who try to kill the little Otter, and enter the chief’s
    house, where the lost daughter is recognized and tells her story.
  language: English
  quote_policy: summarized
