candidate_motifs:
- id: motif:1
  label: souls recovered from the realm or house of ghosts
  taxonomy_refs:
  - afterlife_journey_map
  basis: The new shaman identifies the youths’ souls as living in the house of the
    chief of the Ghosts, and the shamans travel to the burial-ground, enter that house,
    and retrieve the souls.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage describes a destination and recovery action but does not provide
    an extended mapped itinerary of the afterlife.
- id: motif:2
  label: revival by returning souls to bodies
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The shamans put each recovered soul back into its body; the youths awaken
    like sleepers, and after four days of work life returns.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The text distinguishes initial awakening from full return to life, so
    the restoration is staged rather than instantaneous.
- id: motif:3
  label: protected survivors spared from communal disaster
  taxonomy_refs: []
  basis: The old woman and two grandchildren survive because they leave the gathering
    and hide under the fallen tree before the Ghost kills the youths around the fire.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: medium
  cautions: Available taxonomy includes “survivor_pair,” but the survivors here are
    three figures rather than a pair, so no taxonomy reference is assigned.
- id: motif:4
  label: ritual specialists battle ghosts to recover the dead
  taxonomy_refs: []
  basis: The shamans put on armor, take weapons, use rattles and supernatural bones,
    and enter the Ghost chief’s house to seize souls from among the Ghosts.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage frames the action as war with Ghosts, but the successful action
