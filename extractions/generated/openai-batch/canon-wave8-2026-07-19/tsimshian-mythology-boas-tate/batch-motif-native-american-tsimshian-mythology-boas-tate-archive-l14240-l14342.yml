canonical_text:
  quote: ''
  summary: An old woman hides her two grandchildren under a fallen tree before a ghostly
    skeleton attacks young people gathered around a fire. The youths die, their souls
    are held in the house of the chief of the Ghosts, and shamans recover and restore
    the souls to the bodies. The passage closes with a warning that young people should
    not go about alone without parents, then begins a new tale about an old shaman
    arrow-maker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A middle-aged or old woman leads her two grandchildren away from young people
    who are laughing, joking, and making merry around a large fire, and has them hide
    under a fallen tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before reaching the hiding place, they hear a terrible noise from the old
    burial-ground and a mourning voice saying, “Let me have it!”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman places the children under a log, covers them with mats, and returns
    to the young people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Ghost identified as the skeleton of Brown Eagle approaches with arms outstretched,
    a skull head, and dark empty eye-sockets.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young people are frightened; some run into the large fire and are burned,
    while the Ghost takes the breaths of the rest and they die around the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Only the old woman and her two grandchildren are saved from the group of young
    people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The next morning the woman and grandchildren see many dead bodies around the
    fire, some scorched in the ashes, and they report the event to the new village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The parents of the dead young people come, weep over the bodies, and carry
    them down to the new village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wise men call for all the shamans to speak over the dead bodies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A new shaman says the souls of the young people are living in the house of
    the chief of the Ghosts and that they must be recovered that night or the youths
    will be dead permanently.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The shamans put on armor, take weapons, and go quietly to the burial-ground
    while attendants sing and beat skin drums in the house with the bodies.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The new shaman instructs other shamans to enter the Ghost chief’s house at
    its corners, shake rattles and neck-ring bones, and seize the souls when the Ghosts
    run out.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The new shaman walks around the grave four times following the course of the
    sun, shouting louder, while the shamans shake rattles and bones.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Ghosts run out of the house, the souls remain inside, and the shamans
    rush in; each shaman takes the soul of one dead young person.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The shamans return to the bodies, put the souls back into the bodies, and
    the young people awake like sleepers.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: The revived young people are still not fully like living beings until the
    parents pay the shamans again and the shamans work over them for four days, after
    which life returns.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:17
  text: The passage states the lesson that young people should not go about alone
    without their parents.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:18
  text: The next section begins with an old shaman living on a little island near
    Inverness at the mouth of the Skeena River; he makes valuable decorated arrows
    and sells them among tribes and chiefs.
  category: setting
  evidence_refs:
  - ev:17
