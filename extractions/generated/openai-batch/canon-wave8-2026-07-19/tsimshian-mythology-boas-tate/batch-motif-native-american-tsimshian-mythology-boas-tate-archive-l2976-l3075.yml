canonical_text:
  quote: ''
  summary: The mocked youngest brother Dirty secretly bathes in winter water, meets
    a shining supernatural being, is washed with leaves from a supernatural tree,
    gains strength through repeated pond plunges and tree-uprooting feats, returns
    to prove his strength, and the public contests against his elder brothers begin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dirty, the youngest, sits in water at midnight in winter during the north
    wind, comes out before daylight, and lies down again in his bed of ashes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: His brothers mock him as lazy and dirty, saying he has not gone bathing and
    later ridiculing him as one who wets his bed.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: After the brothers discuss tearing out a branch from a fresh tree, Dirty says
    he will do it easily, and they laugh at him and push him out of the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dirty goes to the bay south of the house and up a brook while sorrowful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dirty meets a young man whose skin shines; Dirty addresses him as supernatural,
    and the being offers to grant a wish.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dirty asks to become clean and stronger than any living being in the country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The supernatural being tells Dirty to gather leaves of a supernatural tree;
    Dirty cannot find the right leaves, so the being gathers them himself.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a pool, the supernatural being washes Dirty four times with the leaves
    of the supernatural tree, after which Dirty becomes clean, fine-looking, tall,
    and broad-chested.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dirty repeatedly plunges into the pond and pulls out successively larger spruce
    trees with their roots; after the fourth tree, the supernatural being says it
    is enough and vanishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dirty returns and easily twists and pulls out the branch his brothers had
    been trying to remove, then puts the branch back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the uncle/chief asks for fuel, the brothers bring rotten red-cedar trees,
    while Dirty pulls out a spruce tree with roots, carries it into the house, breaks
    it up, and puts it on the fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In public fighting contests, a G'it-qxa'la man throws the eldest brother,
    and a G'i-spa-x-la'°ts man vanquishes the second brother.
  category: action
  evidence_refs:
  - ev:9
