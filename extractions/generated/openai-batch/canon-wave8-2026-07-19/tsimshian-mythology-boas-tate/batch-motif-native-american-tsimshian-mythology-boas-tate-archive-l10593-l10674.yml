  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The mother tells her children that their people live on the other side of
    the land, out at sea, and recounts earlier events involving her brother, the Frog
    burning the village, her concealment in a pit with valuables and six coppers,
    relatives with the same crest, the southwest wind, and her marriage.
  category: speech
  evidence_refs:
  - ev:6
