canonical_text:
  quote: ''
  summary: A young princess is left alone in a canoe during a strawberry-picking trip
    and is driven by a southwest gale into the great sea. She sees a large eagle-like
    object with ten little eagles rising from the water, lands near Metlakahtla, marries
    a chief, and has children. Her children receive names and crests connected with
    her experiences and her earlier story of surviving a burned village. Later she
    tells them of their maternal homeland and instructs two children how to sail there;
    they follow her directions and arrive at a village.
  language: English
  quote_policy: summarized
