canonical_text:
  quote: ''
  summary: 'The passage narrates a cycle of chiefly conflict: an attempted killing
    of Nes-balas is discovered and punished by execution and display of heads; war
    follows, with several brothers slain. Succession and name-taking are publicly
    marked by feasts and a song interpreted as a promise of peace. A later young chief
    Txa-dzi''°kik continues hostility toward Nes-balas and the new Nes-balas, mocks
    him, and is ambushed, shot, beheaded, and displayed. His people attack and are
    defeated, and his mother dies grieving the deaths of her sons.'
  language: English
  quote_policy: summarized
