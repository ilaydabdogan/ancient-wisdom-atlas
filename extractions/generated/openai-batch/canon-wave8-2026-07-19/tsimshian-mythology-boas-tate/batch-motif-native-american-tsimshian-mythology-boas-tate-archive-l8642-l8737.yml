canonical_text:
  quote: ''
  summary: A prince and his slave process whales brought ashore by eagles, filling
    houses with blubber and provisions. The prince borrows a gull skin, flies to Nass
    River, and drops seal meat to his father's slaves. The meat causes a child to
    choke, leading the chief, chieftainess, and wise men to infer that the prince
    has succeeded. A search party finds the prince's settlement overflowing with food.
    The prince feeds them but sends a message excluding his parents and mocking elder
    uncles, favoring the youngest uncle who had pitied him, and inviting tribes to
    buy his provisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great number of eagles fly ashore from the water with a great whale; the
    prince and his slave gather cedar twigs, tie the whale to shore, cut blubber,
    and eventually have ten great whales, with houses filled with blubber.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince walks through the village, sees houses full of blubber, remembers
    an uncle who pitied him during hunger, asks a gull for its skin, puts it on, takes
    seal meat, and flies to Nass River.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Nass River, canoes are trying unsuccessfully to catch olachen, and the
    prince in gull form searches until he finds his father's slaves in one canoe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gull drops a piece of seal meat to a slave-woman in the canoe; she places
    it in her glove and sees the gull fly downriver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night the slave-woman's household shares the seal meat; the child swallows
    a large piece, chokes, and the chieftainess removes the meat from the child's
    mouth by firelight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chief questions the slaves about the seal meat, and the slave-woman says
    a gull dropped it into the canoe and then went straight downriver.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The chief summons old wise men, who say they believe his son must have been
    successful; the chief then sends a canoe to look for him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The search party reaches the place where the prince had been left and finds
    grease on the water, bones on the beach, houses full of dried fish, meat, and
    whale blubber, and four whales on the beach.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the prince sees the canoe, he initially refuses to let the people land,
    then allows them ashore after they ask for pity, and they eat the stored provisions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The prince tells the visitors not to take food home, asks that his youngest
    uncle come to receive a whale, rejects visits from his parents and three elder
    uncles, and says different tribes may buy his provisions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: On returning to Nass River, the slaves tell the chief that his deserted son
    is alive, has abundant provisions, wants only the youngest uncle to come, and
    wants tribes to buy provisions.
  category: speech
  evidence_refs:
  - ev:8
