canonical_text:
  quote: "“The pole supporting our world was standing on his chest”"
  summary: Dirty arrives at a chief's house, where an ill chief transfers the pole
    that supports the world from his own chest to Dirty's chest. Dirty gives part
    of his life to his slave, who is to remain with him and rub him yearly with wild-duck
    oil. The passage then recounts four wind chiefs at the corners of the world, their
    conflict over winter and greenness, a seasonal law, their children, a marriage
    between North Wind's son and South Wind's daughter, the bride's suffering in the
    cold northern house, and her creation of a wild-duck messenger from carved yellow-cedar
    wood.
  language: English
  quote_policy: quoted
