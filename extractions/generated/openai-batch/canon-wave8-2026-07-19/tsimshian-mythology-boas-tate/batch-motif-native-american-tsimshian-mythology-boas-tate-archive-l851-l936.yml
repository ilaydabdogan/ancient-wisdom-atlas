canonical_text:
  quote: ''
  summary: TxamsEm, driven by hunger, steals bait from halibut hooks, is caught by
    the jaw, breaks off his jaw, and later retrieves and reattaches it by deceiving
    townspeople. In a second episode he assumes the form of a woman to join hunters,
    eats their game while they sleep, is recognized, and flees while his child flies
    away as a crow. In a third episode he eats children's whale blubber, imitates
    their reported method of making blubber by jumping from a tall tree, is seen dead
    after the fall, and later opens his eyes in pain.
  language: English
  quote_policy: summarized
