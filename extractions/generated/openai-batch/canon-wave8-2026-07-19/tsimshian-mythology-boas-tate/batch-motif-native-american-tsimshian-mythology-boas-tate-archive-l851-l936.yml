  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: TxamsEm comes ashore in pain, covers his missing jaw with a blanket, asks
    to examine the jaw, makes the people forget it, puts it on, and runs away; afterward
    his jaw is well again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: TxamsEm sees a hunting canoe with four men, plans to pretend to be a woman,
