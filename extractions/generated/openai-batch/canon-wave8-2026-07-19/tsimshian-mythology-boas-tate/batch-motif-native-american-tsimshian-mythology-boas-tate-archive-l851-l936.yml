- id: obs:2
  text: A fisherman catches TxamsEm's jaw on a halibut hook; TxamsEm resists by holding
    rocks at the sea bottom, speaks to the rocks for help, then tells his jaw to break
    off.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fishermen haul up a great jaw with a long beard, and townspeople later
