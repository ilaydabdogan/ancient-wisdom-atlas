canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a prince remains connected to the
    Salmon people, travels in their canoe, separates permanently from his human friend,
    and gives instructions about proper treatment of salmon. The friend returns and
    reports on the Salmon town, houses, hierarchy, and taboos. A new tale begins at
    Metlakahtla with a noble couple, their late-born son, his marriage to a princess,
    his destructive gambling losses, and his wife's angry disposal of a prepared salmon
    dish into the fire.
  language: English
  quote_policy: summarized
