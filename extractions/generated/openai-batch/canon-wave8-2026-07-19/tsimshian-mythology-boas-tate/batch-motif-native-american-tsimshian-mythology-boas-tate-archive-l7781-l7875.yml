canonical_text:
  quote: ''
  summary: A prince regains wealth through trade and feasting, then his wife, Peace
    Woman, obtains strong ash digging-sticks and uses them at the low-water line to
    bring up sea animals and whales. The food is processed, sold, and redistributed
    in feasts and gifts. Later, after the prince speaks with his former wife while
    fetching water, Peace Woman detects slime in the water with a plume, accuses him,
    and walks out onto the water while he follows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People from different tribes bring skins, canoes, and other goods to buy food
    from the prince, who becomes rich and then gives feasts and distributes property
    and food until his goods and provisions are gone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before full moon, the prince tells his father's wood-carvers to make six digging-sticks,
    each six fathoms long.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The princess rejects digging-sticks made from several woods and accepts ash
    sticks because the six ash sticks are described as red, strong, and not likely
    to break.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The princess is taken to the low-water line on a plank, puts six long digging-sticks
    deep into the sand, and leans on them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the princess leans on the six sticks, they bring up a whale, a sea lion,
    a seal, a halibut, a red cod, and a bullhead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The village people cut up the whale and other sea animals, and three houses
    are filled with the food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Tsimshian tribes hear of the food, they come to buy it, and the prince's
    father's house becomes full of skins and other goods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On another morning, Peace Woman again uses the six digging-sticks at the low-water
    line and produces twelve whales in two groups of six.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Peace Woman assigns whales to her father-in-law, her husband's maternal uncles,
    her mother-in-law, her father-in-law's tribe, her husband's tribe, and her husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The prince sells one whale and distributes another whale as slices of blubber
    at a great feast for the chiefs of the Tsimshian tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the princess asks for water, the prince goes with her root basket, and
    his former wife hides by the water, rushes out, holds him, and pleads for pity
    and speech.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The prince tries to escape from his former wife but finally takes pity on
    her and speaks to her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The prince's wife puts a plume from behind her ear into the water and finds
