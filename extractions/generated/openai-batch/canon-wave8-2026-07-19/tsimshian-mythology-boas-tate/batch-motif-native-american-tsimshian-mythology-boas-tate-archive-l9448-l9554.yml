canonical_text:
  quote: ''
  summary: The passage first recounts Waux losing his two children on a mountain,
    becoming trapped during a mountain-sheep hunt after forgetting his spear, asking
    his wife to sacrifice fat to supernatural powers, and the resulting transformations
    of his wife into flint and of Waux, his dog, and gear into stone. It then begins
    the story of a blind hunter whose son guides his shot so that he kills a grizzly
    bear, after which his wife mocks him and denies the kill in order to withhold
    the meat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waux's two children followed him, slipped on a newly discovered mountain,
    and died in the Valley of Supernatural Beings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After mourning the children, Waux moved to an old hut at the foot of the high
    mountain, hunted mountain sheep daily, enlarged the hut, and filled it with dried
    meat and fat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a fall hunt Waux forgot his spear and took a hunting-pole, dog, mat blanket,
    root basket, and hunting-hat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mountain sheep entered a narrow cleft; a large sheep kicked the mountain and
    leaned its head against the rock to show that the mountain was angry with Waux.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mountain shook; Waux drove his hunting-pole into the rock, held it, called
    his dog, and shouted that he could neither go on nor turn back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Waux repeatedly asked his wife to sacrifice fat to a supernatural being or
    supernatural powers, while she repeatedly responded as if he had told her to eat
    fat.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Waux finally told his wife to eat melted fat, drink cold water, and lie across
    an old log; she did so, her body broke apart, and she was transformed into flint.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: Waux, his dog, his hunting-hat, mat blanket, and pole were transformed into
    stone; the passage explains this by saying he had forgotten the spear that he
    formerly used to cross shaken chasms and that his wife misunderstood the offering
    request.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: A blind former hunter camped with his wife and little son at a creek mouth
    while waiting for the salmon run; the wife and son caught salmon in the brook.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:10
  text: The blind hunter's son saw a grizzly bear across the brook, told his father,
    led him outside, brought his bow and good arrow, and aimed the arrow point toward
    the bear's shoulder.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:11
  text: The blind hunter shot the arrow through the grizzly bear's heart and declared
    that he had killed it with one shot.
  category: action
  evidence_refs:
  - ev:13
- id: obs:12
  text: The blind hunter's wife mocked him and said he had missed, although she knew
