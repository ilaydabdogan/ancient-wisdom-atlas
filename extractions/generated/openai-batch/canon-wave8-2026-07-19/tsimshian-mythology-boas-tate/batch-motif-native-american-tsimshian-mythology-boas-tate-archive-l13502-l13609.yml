canonical_text:
  quote: ''
  summary: A chief has his apparently dead son brought from the graveyard and restored
    by shamans. The revived prince becomes a powerful shaman who retrieves souls from
    the village of the Ghosts and returns them to dead bodies, until the Ghosts plot
    against him and his supernatural power warns him to continue under protection
    and obedience.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief orders people with torches to go to the graveyard, where they find
    the prince in an open coffin and bring his body to the chief's house, placing
    it on a board before a large fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince's heart is still beating, and his father summons shamans from other
    tribes, promising rewards if they restore his son to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shamans dance and place charms on the prince; after four days and four
    nights of work, he comes back to life and the shamans receive rewards.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After revival, the prince is described as a great shaman because he is filled
    with the shamans' charms; his four friends serve as attendants.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the head man of the father's tribe dies, the prince says he will restore
    him to life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before going to the dead man, the prince puts on carved bones, a grizzly-bear-claw
    crown, a dancing-apron, a rattle, a white eagle tail, charcoal on his face, and
    eagle down on his head.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The prince announces that the dead man's soul is in the village of the Ghosts
    and says his supernatural helper tells him to bring the soul back to its body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prince requests a new cedar-bark mat and asks the people to beat time
    on a plank and sing loudly with his attendants until he returns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At night, while the house is filled with singing and drumming, the shaman
    prince goes to the graveyard, sees a quiet river, the village of the Ghosts on
    the other side, and a narrow bridge across the river.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The prince crosses the bridge and is led by his supernatural power toward
    the chief of the Ghosts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Inside the chief Ghost's house, the prince sees the dead man's soul seated
    near the chief of the Ghosts, with all the Ghosts assembled.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The shaman prince takes the soul by the shoulders, says he will take it back
    to its body, and leaves the house of the chief of the Ghosts.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Returning to the house of the dead body, the prince keeps his left hand closed,
    rattles with his right hand, circles the fire four times following the course
    of the sun, and puts the soul into the body.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: When the soul enters the body, the dead man sits up and has come back to life.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The prince later brings back the soul of his cousin from the town of the Ghosts,
    and villages spread news of his ability to bring back souls of the dead.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: For a long time he restores the dead, and no one is dying in the villages
    because the great shaman is among the people.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: The Ghost-town people hate the shaman prince because souls no longer come
    to Ghost town, assemble in council, and decide to kill him by cutting off the
    ends of the bridge when he comes again.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: After the council, the Ghosts take the soul of a man, and the man dies two
    days later.
  category: action
  evidence_refs:
  - ev:15
- id: obs:19
  text: The shaman prince knows of the Ghosts' council because his chief supernatural
    power has told him, and the power commands him to bring back the souls of his
    people, promising protection if he obeys and punishment if he disobeys.
  category: speech
  evidence_refs:
  - ev:16
