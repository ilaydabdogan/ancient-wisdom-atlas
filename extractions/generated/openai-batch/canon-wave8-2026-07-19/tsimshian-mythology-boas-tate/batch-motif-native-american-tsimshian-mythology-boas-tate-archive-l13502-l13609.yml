  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-mythology-boas-tate.md
  rights_note: Public domain source; passage supplied in request.
- id: ev:13
  type: summary
  locator: 13604-13609a
  quote_or_summary: The prince does this for a long time, and no one dies in the villages
