- id: ev:9
  type: summary
  locator: lines 3077-3171, Mountain fight
  quote_or_summary: A long, broad Mountain comes as Dirty's last enemy and says the
    loser will die, while Dirty will live as long as the world stands if he wins.
    The Mountain bends Dirty's back; the slave rubs on wild-duck oil, Dirty is strengthened,
    throws the Mountain, breaks it, and it becomes the sandbar with large rocks at
    Sandy Shore.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-mythology-boas-tate.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 3077-3171, aftermath of Mountain fight
  quote_or_summary: Dirty's enemies are destroyed, his fame spreads all over the world,
    and he has more power than before because the Mountain gave him its power.
  source_text_path: texts/public-domain/native-american-northwest-coast/project-gutenberg/tsimshian-mythology-boas-tate.md
  rights_note: Public domain source; summarized.
- id: ev:11
