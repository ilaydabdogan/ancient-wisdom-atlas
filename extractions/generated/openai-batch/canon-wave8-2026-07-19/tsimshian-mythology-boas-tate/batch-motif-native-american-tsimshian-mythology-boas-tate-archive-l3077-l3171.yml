canonical_text:
  quote: ''
  summary: A third brother is killed in combat. Dirty, called forward by his uncle,
    kills the three men who defeated his brothers, defeats attacking tribes, and is
    then deserted with one slave after his uncle becomes poor from compensation payments.
    The slave hunts wild ducks and stores their oil. After hearing of Dirty's strength,
    animals, trees, birds, and finally a living Mountain come to fight him. Dirty
    kills them all; during the Mountain fight the slave rubs wild-duck oil on Dirty's
    bent back, strengthening him. Dirty throws the Mountain, which becomes a sandbar
    with large rocks at Sandy Shore, and Dirty gains the Mountain's power. Later two
    canoe messengers summon Dirty to visit their sick chief, and Dirty and his slave
    travel southwest over the sea to an island town.
  language: English
  quote_policy: summarized
