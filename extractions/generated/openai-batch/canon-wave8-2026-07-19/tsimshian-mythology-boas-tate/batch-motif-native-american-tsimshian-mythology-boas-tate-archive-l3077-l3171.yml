- id: motif:2
  label: one fighter defeats collective human enemies
  taxonomy_refs: []
  basis: Dirty kills the three strong men together and later defeats all the tribes
    that make war against him.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a local passage-level pattern, not a claim of historical relationship
    to other traditions.
- id: motif:3
  label: sequential nonhuman challengers test a powerful man
  taxonomy_refs: []
  basis: After the human conflicts, animals, trees, birds, and finally Mountain come
    in sequence to fight Dirty, and he defeats them.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents contests rather than an explicitly named initiation
    or ritual trial.
- id: motif:4
  label: helper strengthens hero with stored animal oil
  taxonomy_refs: []
  basis: Dirty tells the slave to apply wild-duck oil when his back bends, and the
