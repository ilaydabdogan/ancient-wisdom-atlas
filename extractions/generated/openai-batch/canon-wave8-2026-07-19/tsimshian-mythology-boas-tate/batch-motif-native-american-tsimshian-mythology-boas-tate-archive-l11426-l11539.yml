canonical_text:
  quote: ''
  summary: A young man climbs a snowy mountain after hearing his dogs bark near his
    sister. With help from a snowball signal sent by her, he reaches a Bear's den,
    receives her two newborn children, kills the Bear with smoke rather than weapons,
    and returns home with her and the cubs. The Bear's death rites are performed according
    to instructions he had given. The children grow up, identify hill clouds as their
    Bear grandfather's smoke, are later insulted by their grandmother, and leave for
    their father's Bear people with instructions to bring food back.
  language: English
  quote_policy: summarized
