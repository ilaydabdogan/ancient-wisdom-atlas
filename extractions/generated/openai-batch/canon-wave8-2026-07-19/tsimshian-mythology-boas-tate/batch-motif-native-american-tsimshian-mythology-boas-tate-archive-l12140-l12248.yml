canonical_text:
  quote: ''
  summary: 'The passage finishes an episode in which a poor stranger is kindly received
    by the youngest of six chiefly brothers and later reveals himself as the Prince
    of the Black Bears, rewarding the young chief with crest regalia. It then gives
    a G''ispawadwe''da story in which a hunter is taken by a Black Bear, learns salmon-catching
    and canoe-building, returns partly bear-like, is restored with medicine, and transmits
    a bear crest through his sister''s descendants. A following tale begins after
    the great Deluge at Metlakahtla: a secluded princess sees a shining heavenly prince,
    Tsauda, descend through the smoke hole to ask for marriage, but his slave Halus
    later comes in his place and is mistaken for him; Tsauda returns, condemns Halus,
    and says he will marry the princess''s lame sister.'
  language: English
  quote_policy: summarized
literal_observations:
