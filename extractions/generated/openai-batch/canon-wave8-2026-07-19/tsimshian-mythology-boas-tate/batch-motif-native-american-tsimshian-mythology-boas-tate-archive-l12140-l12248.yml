  text: The young chief welcomes the stranger and orders mats spread beside the fire
    with fuel added.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young chief's wife takes out their last dried salmon, keeps half, and
    serves the other half to the stranger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stranger tells the young chief to go across the river early the next morning
    if he hears anything, promising a present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the young chief and his attendant cross the river, they hear a mourning-song;
