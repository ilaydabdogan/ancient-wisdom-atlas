    it in return for the half-salmon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The five elder brothers quarrel with the youngest chief after the gift is
    received.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The GispawadwE'da are said to use the Prince of the Black Bears in dances,
    with abalone shell adornment, and no chief besides Dzeba'sa may use Prince of
    the Black Bears.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the G'ispawadwe'da story, a man hunting mountain goats meets a Black Bear,
    who carries him to its den.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Black Bear teaches the man how to catch salmon and how to build canoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After two years the man returns home looking like a bear; he cannot speak
