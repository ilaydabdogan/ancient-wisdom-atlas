candidate_motifs:
- id: motif:1
  label: hospitality to a poor stranger rewarded by supernatural regalia
  taxonomy_refs:
  - sacred_exchange
  basis: The young chief and his wife feed the stranger with half of their last salmon,
    and the Prince of the Black Bears later gives crests and regalia in return.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage frames the exchange as repayment; wider ceremonial or clan
    implications would require surrounding context.
- id: motif:2
  label: origin or authorization of a dance crest from a supernatural bear figure
  taxonomy_refs:
  - royal_legitimacy
  basis: After the gift, the text explains that the GispawadwE'da use Prince of the
    Black Bears in dances and that only Dzeba'sa may use him.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage concerns crest and
    dance authorization rather than kingship in a narrow sense.
- id: motif:3
  label: animal teacher grants subsistence and craft knowledge
  taxonomy_refs:
  - culture_hero
  basis: The Black Bear teaches the hunter how to catch salmon and build canoes.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The bear functions as teacher/helper; the passage does not call the bear
    a culture hero.
- id: motif:4
  label: human transformed or returned in animal-like condition and restored by medicine
  taxonomy_refs:
  - shapeshifter
  basis: The hunter returns looking like a bear, cannot speak, avoids boiled meat,
    and is rubbed with medicine until he resumes human form.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The text says he looked like a bear and resumed human form, but it does
    not detail a voluntary shapeshifting act.
- id: motif:5
  label: bear helper becomes source of hereditary bear crest
  taxonomy_refs: []
  basis: The Bear continues to help the man, the man paints a house with the Bear,
    his sister wears a bear apron, and her descendants use the bear as crest.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No exact supplied taxonomy reference for hereditary crest origin or bear
    crest.
- id: motif:6
  label: post-deluge setting with scattered people
  taxonomy_refs:
  - flood_and_renewal
  basis: The Tsauda and Halus tale is introduced as one of the tales after the great
    Deluge, when people were scattered over the earth.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: In this excerpt the Deluge is background setting, not an enacted flood
    narrative.
- id: motif:7
  label: heavenly shining suitor descends to seek mortal princess
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: Tsauda comes from heaven in shining light, descends through the smoke hole,
    and asks the princess to marry him.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The figure is called a prince from heaven, not explicitly a deity; marriage
    is proposed but not completed in this passage.
- id: motif:8
