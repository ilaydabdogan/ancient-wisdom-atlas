canonical_text:
  quote: ''
  summary: A young prince, Hats!Eks-n!e'°x, answers Haimas's boast. Haimas kills captives,
    throws their heads and a copper into the water, and challenges the child to throw
    away valuables. In the public copper contest, Haimas's floating wooden copper
    is mocked, and the young prince is said to have beaten him. The G'i-spa-x-la'°ts
    later gather princes and princesses, give them chiefly names in a fourteen-day
    feast, and distribute valuables. Years afterward Haimas blocks access to Nass
    River fishing, prompting the new Nes-balas to call the tribes to war; Watk then
    visits his sister at Haimas's village.
  language: English
  quote_policy: summarized
