canonical_text:
  quote: ''
  summary: A former wife paints her own face and accuses a brother-in-law, after which
    the chief orders four brothers killed and thrown behind his house. Their sister,
    the chief's younger wife, mourns them daily with her child and is mocked and tripped
    by young men at the chief's order. At sunset after prolonged mourning, a handsome
    Supernatural One appears, says his father the Sun sent him, gives her a bundle
    of leggings, snowshoes, and moccasins, and instructs her to throw it before the
    chief. The bundle emits lightning, frightening the chief, who orders the whole
    village summoned.
  language: English
  quote_policy: summarized
