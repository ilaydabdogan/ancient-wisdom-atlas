canonical_text:
  quote: '"The Spring Salmon have brought you here"'
  summary: A prince leaves home at night, is searched for unsuccessfully, and is taken
    by canoe to a sea village of the Spring Salmon. There he meets a sick Salmon chief
    and Mouse Woman, who explains the chief's illness and gives instructions for eating
    salmon-children, burning their remains, and drinking fresh water so fish may revive.
    The passage ends with Salmon scouts checking rivers for cottonwood leaves, which
    are treated as signs of salmon.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: People from the prince's village search for him at night with bark and pitch-wood
    torches, going into the woods and to the river, but they do not find him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince rests below the village after midnight and hears a canoe coming
    up the river; four men in the canoe call him to come to his father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four men take the prince aboard a new canoe and paddle to their home out
    at sea, where he sees a large village with houses carved with spring salmon figures.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the chief's large house, the prince sees the great chief lying sick with
    palsy; attendants spread mats for the prince beside a large fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mouse Woman tells the prince that the Spring Salmon brought him because their
    chief had been sick after the prince's mother kept him in a little box, and that
    the chief improved when the prince unfolded the salmon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The prince gives Mouse Woman two woolen ear-ornaments; she throws them into
    the fire, takes them while burning, and eats them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mouse Woman instructs the prince that when he is very hungry he should club
    one of the children playing on the sand-hill, roast it, eat it, gather the bones,
    and cast them into the fire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prince clubs a boy on the sand-hill; the boy is transformed into a small
    spring salmon, which the prince roasts and eats before drinking from a brook and
    burning the bones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When someone cries that his eye is sore, Mouse Woman tells the prince to search
    the hole at the foot of the roasting-spit; he finds the salmon's eye, throws it
    into the fire, and the boy recovers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mouse Woman advises the prince to drink fresh water after eating fresh salmon,
    and the passage states that this is done so salmon or other fish may be revived
    and go home gladly.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The chief sends people to see whether cottonwood leaves have fallen into the
    Skeena and Nass Rivers; the Salmon call cottonwood leaves salmon, and the scouts
    report that there are a few salmon in the rivers.
  category: sequence
  evidence_refs:
  - ev:11
