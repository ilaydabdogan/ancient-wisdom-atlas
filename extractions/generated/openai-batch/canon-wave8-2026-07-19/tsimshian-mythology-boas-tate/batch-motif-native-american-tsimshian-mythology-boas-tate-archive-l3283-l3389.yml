canonical_text:
  quote: ''
  summary: 'The passage completes a story in which Chief South Wind sends four sons
    north to recover their sister from Chief North Wind. The first three sons are
    driven back by the north wind, but Going Behind Mountains reaches North Wind''s
    village as a sharp-ended cloud; heavy rain melts the ice and forces negotiations
    over the length of winter and the other seasons. The passage then begins another
    story: people at Prairie Town play games at night, see a beautiful plume descend
    from the sky, and are pulled upward when they touch it or one another.'
  language: English
  quote_policy: summarized
