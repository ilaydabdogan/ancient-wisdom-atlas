canonical_text:
  quote: ''
  summary: TxamsEm searches unsuccessfully for Little Pitch's house and his canoe,
    finding instead spruce forms. Hungry, he reaches a house occupied by Chief Grizzly
    Bear and two wives, is fed, and proposes fishing with bait from their own bodies.
    After secretly preparing salmon tail as bait, TxamsEm pretends to cut himself
    and coerces Chief Grizzly Bear into cutting his own body, leading to the bear's
    death. TxamsEm then deceives the two female Grizzly Bears into swallowing red-hot
    stones under the pretense of reviving their husband, kills them, butchers the
    three bears, and remains there eating.
  language: English
  quote_policy: summarized
