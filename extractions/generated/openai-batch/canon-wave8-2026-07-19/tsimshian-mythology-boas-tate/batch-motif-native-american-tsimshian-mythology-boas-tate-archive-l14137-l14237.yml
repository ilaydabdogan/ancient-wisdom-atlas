canonical_text:
  quote: "“It is improper to mock the dead.”"
  summary: 'Only One cures Chief Bagus’s son by removing a broken arrow from his side,
    learns from an old shaman about failed healers and a lake of blood, receives a
    child as a supernatural power, returns home by canoe, and is later said to have
    been taken to the supernatural powers’ home in a deep pit. A new tale begins:
    Brown Eagle, beloved son of a chief and chieftainess, eats only salmon-dips, dies,
    is mourned and given grave offerings. After the village moves, young women and
    young men gather fern roots near the old burial-place; the young men mockingly
    call Brown Eagle from his grave with salmon-dips despite a woman’s warning.'
  language: English
  quote_policy: quoted
