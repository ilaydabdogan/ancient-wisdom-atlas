canonical_text:
  quote: ''
  summary: A human prince's wife secretly takes a young man as lover while her hunter
    husband is away. The husband returns, learns the truth from the maid, and his
    companions kill the lover. The dead lover's animal regalia are taken as crests,
    and wise men identify him as a prince of the Wolves and advise building a fort
    against wolves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins by stating that, in the time of the forefathers, animals
    sometimes had human women or men as wives or husbands.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great prince, son of a great chief, lived in the old town of Metlakalitla,
    had three chosen young men as friends, and had a beautiful wife whom he loved
    very much.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince was an expert hunter who traveled widely and often stayed away
    from the village for long periods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife wore fine garments made from marten, sea-otter, and other animal
    skins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other princes tried to seduce the wife, but she refused them and reported
    their words to her husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the prince left on a hunting trip, his wife walked with her maid around
    the lake behind the village and sent the maid to pick cranberries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: While the maid was away, a good-looking young man came to the wife; they smiled,
    sat together, embraced, kissed, and lay together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The maid returned with cranberries, saw her mistress embracing the young man,
    and was sent away to gather more berries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young man wore a garment with cloven feet and armor with ears of wild
    animals, and he promised to come every night while the husband was away.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The princess ordered her maid not to tell anyone, and the maid promised secrecy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prince had bad luck hunting, returned secretly before expected, and questioned
    the maid about whether anyone had come to his wife.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The maid told the prince that the young man had embraced his wife, had been
    invited to come at night, and had come every night until then.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The prince told his three friends; they entered the wife's bedroom secretly
    and killed the man lying in the prince's bed, cutting off his head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the morning they saw that the dead man's garment was covered with cleft
    feet of deer and mountain sheep, his armor with long ears of reindeer and red
    deer, and his hat with a wolf's tail.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The prince kept the body and head in a box behind the house and took the garments,
    armor, and hat as his crests.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The prince was not angry with his wife because he had received costly crests
    through her.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The old chief summoned wise men, who identified the killed young man as a
    prince of the Wolves and advised building a strong fort against wolves that might
    devour wives and children.
  category: speech
  evidence_refs:
  - ev:10
