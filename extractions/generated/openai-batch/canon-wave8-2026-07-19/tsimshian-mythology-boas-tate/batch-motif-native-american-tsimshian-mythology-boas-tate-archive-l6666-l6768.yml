canonical_text:
  quote: ''
  summary: A young princess tries to attract a beautiful prince, but he ignores her.
    Through her maid she asks him to visit; he replies that she once rejected him
    and sets conditions that she cut both cheeks and shave her hair. After she does
    so, he mocks her. Ashamed, she journeys with her maid to the house of Chief Pestilence
    to be made beautiful, but maimed people there injure both women. The maid leads
    the princess home, where she dies. The passage then explains a law that young
    women have no say in marriage once kin groups agree, and describes a marriage
    fight in which stone scars become signs of the marriage pledge, followed by placing
    the bride on an expensive garment.
  language: English
  quote_policy: summarized
