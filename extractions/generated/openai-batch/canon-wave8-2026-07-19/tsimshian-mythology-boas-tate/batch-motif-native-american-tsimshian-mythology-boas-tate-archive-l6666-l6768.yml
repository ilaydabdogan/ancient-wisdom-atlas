- id: obs:1
  text: The young woman walks behind the guests, laughing and talking, to try to make
    the beautiful prince look at her; he takes no notice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the feast, the young woman sends her maid to call the prince; he first
    gives no answer and later says she rejected him before, so he will not go to her
    now.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prince says he will come if she cuts down her right cheek; the princess
    takes a knife and cuts her right cheek.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince then tells her to cut her other cheek and later to cut her hair;
    she cuts her left cheek, shaves off her hair, and sends the hair to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prince refuses to accept the hair and mocks her scars and shaved head;
    the maid returns to her mistress sad.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princess is ashamed, sets out with her maid, cries, and wants to hang
    herself, but the maid comforts her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The two women travel toward the house of Chief Pestilence, hoping he will
    make the princess beautiful, and pass mountains, rivers, valleys, and a plain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a large house they announce that they have come to the house of Chief Pestilence
    to be made beautiful; maimed people on both sides call them in different directions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The maimed people attack the princess and maid, breaking and twisting parts
    of the princess's body and injuring the maid's eye and mouth, then throw both
    women outside.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the maid recovers somewhat, she helps the badly wounded princess home;
    after many days the princess arrives home, lies in bed, and dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says that people then made a law that no young woman should have
    any say about her marriage once agreements were made by the families and uncles.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: The marriage procedure includes parents, uncles, relatives, and female relatives
    of the young man giving presents to the young woman.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: After a prince and princess marry, the tribes of the young man's uncle and
    the young woman's uncle fight by casting stones at one another.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The scars made by stones on the heads of each chief's people are described
    as signs of the marriage pledge.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: At the end of the fight, the young man's people take an expensive garment,
