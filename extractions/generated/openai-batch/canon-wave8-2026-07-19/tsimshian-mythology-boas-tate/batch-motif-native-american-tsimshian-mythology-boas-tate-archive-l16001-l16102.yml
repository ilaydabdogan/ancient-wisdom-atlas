    large pursuing canoes.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The pursuing large canoes enter the next bay, see smoke, go ashore in the
    evening, and find a camp of six houses.
  category: sequence
  evidence_refs:
  - ev:11
