canonical_text:
  quote: ''
  summary: The passage gives background on Tlingit and G'it-dzl'os settlements and
    seasonal homes, then narrates how Lax-ani's, a G'it-dzl'os head man who has lost
    his property by gambling, travels with his young son, secretly discovers a small
    village and a canoe-maker's copper tools, steals the tools, returns home, persuades
    wise men to raid the village, and guides a force that captures women and children,
    kills returning hunters, and pursues four men who escape by canoe toward another
    camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Tlingit remained in hiding places and made villages at several named
    creek mouths and other channel locations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The G''it-dzl''os used different seasonal homes and resource areas: Metlakahtla
    in winter, Nass River in spring for olachen fishing, Skeena River in summer for
    salmon fishing, and creek hunting grounds in fall.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lax-ani's is introduced as a G'it-dzl'os head man of the Wolf Clan; after
    his wife dies, he keeps their approximately twelve-year-old son and later loses
    all his property gambling.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lax-ani's takes his son by little canoe to Kiyaks, camps, searches lakes for
    beaver, and finds fresh human footprints.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After hearing chopping, Lax-ani's climbs a hill with his son, tells the son
    to stay alone, be quiet, and not cry, and goes down secretly to investigate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lax-ani's sees a tall man making a canoe with a copper hammer and copper wedges;
    before sunset the man leaves the tools under the log.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The next morning Lax-ani's sees a small village below, waits until its little
    canoes have gone, enters houses, and sees women and children covered with red
    cedar mats.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lax-ani's takes three copper wedges and a copper hammer from the canoe-making
    place and returns with his son to his own village the same day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At a gathering in Wa-di-dax's house, Lax-ani's tells the wise men that he
    has found a little village that is easy to overcome, and the wise men agree to
    fight the following day.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lax-ani's guides the G'it-dzl'os through Kiyaks Valley to the hill, and after
    the village canoes leave before sunrise, G'it-dzl'os fighters capture the women
    and children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The G'it-dzl'os wait in the village and kill returning canoe men as they come
    back with seals, cutting off their heads.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Four men in the last canoe shout in Tlingit, receive no answer, flee in their
