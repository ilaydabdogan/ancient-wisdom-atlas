  summary: The passage gives genealogical and chiefly background for Haimas and Nes-balas,
    explains their continuing hostility, describes Haimas's efforts to surpass Nes-balas
    in rank, wealth, warfare, and display, and narrates a sequence of camp-building
    competitions during travel to the Nass River in which beams, canoes, and public
    shame become central.
