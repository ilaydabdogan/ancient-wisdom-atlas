- id: obs:9
  text: TxamsEm asks to go hunting with Chief Wolf's young men; he accompanies two
    young Wolves to a high mountain whose top is full of mountain sheep, then remains
    below while they climb.
  category: sequence
  evidence_refs:
  - ev:5
