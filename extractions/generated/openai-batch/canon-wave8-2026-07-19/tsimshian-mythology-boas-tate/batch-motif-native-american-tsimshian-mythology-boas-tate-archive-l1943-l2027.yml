canonical_text:
  quote: ''
  summary: Tomtit guides TxamsEm toward Chief Wolf's village, then turns back from
    fear of the Wolves. TxamsEm enters the Wolf community, where the Wolves smell
    his bloody wound. He tells Chief Wolf a story of being attacked, disemboweled,
    thrown from a cliff, and revived. Chief Wolf pities him, believes him, and orders
    rich fat food for him, which restores him. Later TxamsEm joins two young Wolves
    on a mountain-sheep hunt, stays below while they kill the game, and tries to hide
    most carcasses under hemlock leaves. The young Wolves find the hidden animals
    by scent, expose the concealment, howl to summon the others, and the Wolves carry
    the carcasses to the chief's house.
  language: English
  quote_policy: summarized
