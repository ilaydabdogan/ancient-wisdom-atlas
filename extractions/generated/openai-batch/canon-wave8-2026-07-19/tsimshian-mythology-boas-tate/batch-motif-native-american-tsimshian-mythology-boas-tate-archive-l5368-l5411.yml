canonical_text:
  quote: ''
  summary: A young man travels with companions, burns offerings in the fire, and prays
    to supernatural powers for direction to his sister. They reach a deep valley with
    smoke below and no visible way down. The youngest brother, believing this may
    be the town where his sister was taken, repeatedly carves wooden eagles from different
    woods, puts them on, and attempts to fly, but the early attempts fail. He then
    constructs a composite eagle from several light woods and mountain-goat horn.
  language: English
  quote_policy: summarized
