canonical_text:
  quote: ''
  summary: A princess called Part Summer lives among Black Bear people as the wife
    of the Black-Bear chief's son. As winter approaches, the chief asks each family
    to name its den. The princess rejects easy dens because her brothers and their
    dogs could reach them, and chooses a difficult den. The chief asks about the number
    of mats used by each of her four brothers in hunting preparation; corresponding
    groups of bears mourn because they expect to be killed. The Bear people gather
    provisions and enter their dens when thunder sounds. The elder three brothers
    later kill sixty, forty, and twenty black bears. The youngest brother, with dogs
    Red and Spots, searches unsuccessfully, weeps for his lost sister, and the dogs
    begin climbing a mountain with rock-slides on both sides.
  language: English
  quote_policy: summarized
