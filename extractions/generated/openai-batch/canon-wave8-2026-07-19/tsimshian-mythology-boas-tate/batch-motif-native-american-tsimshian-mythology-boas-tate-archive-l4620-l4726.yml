canonical_text:
  quote: ''
  summary: A young man enters the house of a grizzly-bear chief, keeps his weapons
    despite attempts to take them, sees his nine brothers slain, fights many grizzly
    bears, and is aided by two pups who become giant dogs. With the help of Bear Woman,
    he obtains the chief's heart and restores his brothers to life. The brothers return
    with their wives, meat, and skins; the youngest brother remains successful through
    Bear Woman's help and the strength of the dogs.
  language: English
  quote_policy: summarized
