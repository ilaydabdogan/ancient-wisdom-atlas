  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After making a third hole and being struck again, Txa'msem finds the salmon
    in the last hole, catches it, and is glad because he is hungry.
  category: action
  evidence_refs:
  - ev:6
