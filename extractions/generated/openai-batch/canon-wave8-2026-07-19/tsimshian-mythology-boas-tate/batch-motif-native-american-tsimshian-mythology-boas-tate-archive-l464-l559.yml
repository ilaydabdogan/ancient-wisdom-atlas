canonical_text:
  quote: ''
  summary: Giant learns from Oil Woman how to boil olachen with heated stones, water,
    and wooden implements. He then asks Gulls how to roast olachen; they teach him
    but eat the fish, and he throws them into the fire, explaining their black wing
    tips. A recorder’s note states that Giant taught people olachen practices and
    lists his works for the people he made. In the following episode, Giant, now called
    Txa'msem, challenges a steelhead salmon, is repeatedly struck, and finally catches
    it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Giant camps at a place and does not know how to cook his olachen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsowatz, called Oil Woman and described as dark-complexioned, comes to Giant’s
    camp; Giant speaks to her kindly like a brother to a sister and asks how to cook
    olachen.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oil Woman instructs Giant to cook olachen by heating stones, using water in
    a cedar box, handling stones with cedar tongs and an alder spoon, and repeating
    the process until oil appears on the water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Giant is glad to receive Oil Woman’s instruction and takes her to be his sister.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A gull appears over Giant; then two Gulls come, and Giant asks them how to
    roast olachen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two Gulls build an elderberry-wood frame, place olachen on it, and instruct
    Giant about clothing, keeping a fire going, turning the frame, and saying prescribed
    words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before the olachen is done, the two Gulls begin eating it; many gulls arrive
    and eat all the olachen on the frame.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Giant becomes sad, takes the Gulls, and throws them into the fire; the narrative
    states that gulls’ wing tips have been black since that time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The recorder’s note names the camp as Little Crabapple-Tree Place and says
    the episode contains olachen taboos practiced by the Tsimshian.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: The recorder’s note says people know how to cook olachen because Giant taught
    them, and that Giant performed works to support the people he made from the elderberry
    tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The recorder’s note lists Giant’s works, including leaving his father, flying
    over the sea, scattering fishes and berries, bringing daylight and north wind
    from heaven, bringing fire, obtaining the tide-line, and episodes involving Gull,
    the olachen village, Oil Woman, and Gulls.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Giant’s name is changed to Txa'msem, and he sees a steelhead salmon jumping
    in the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Txa'msem kicks rock to make holes and calls the steelhead salmon to come up
    so they can see who is stronger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The steelhead salmon repeatedly hits Txa'msem’s heart, causing him to lie
