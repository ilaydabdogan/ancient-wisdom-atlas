canonical_text:
  quote: ''
  summary: Mouth At Each End finds his brother reduced to bones after martens have
    eaten his flesh, restores him to life with earth, root, moss, dancing, and supernatural
    powers, and makes him a shaman called Devoured By The Martens. Mouth At Each End
    gains curing and revival abilities and defeats many hostile supernatural beings
    through helpers, but is killed after two great shamans send Blood against his
    helpers. Devoured By Martens survives, sends Blood and Martens against the two
    shamans, takes his brother's supernatural objects, and later leads his people
    during famine by singing and directing them downriver and out to sea to find fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A brother's skeleton lies at the foot of a large spruce tree after martens
    have devoured the flesh of his body.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mouth At Each End comes ashore from the lake, sees his brother's bones, cries,
    and attempts to restore him to life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mouth At Each End rubs earth over the bones, causing flesh to return, then
    uses a small root for sinews and moss for skin while dancing with supernatural
    powers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mouth At Each End makes his brother alive again, makes him a shaman, and names
    him Devoured By The Martens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mouth At Each End catches the martens that ate his brother's flesh, puts the
    live martens into his brother, and gives him a vessel of blood as supernatural
    power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mouth At Each End and his brother return home with a live Grizzly Bear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After returning home, Mouth At Each End can cure all kinds of diseases and
    heal persons who died suddenly.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Supernatural beings in the mountains hear of Mouth At Each End's helper and
    try to kill him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mouth At Each End counters attackers by sending different helpers against
    threats arriving secretly, by water, overland, or through the air.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two great shamans, described as hermaphrodites, arrive together in a canoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The two shamans send Blood as their supernatural helper, and Blood kills Mouth
    At Each End's helpers Mouth At Each End and Cuttlefish; the shaman Mouth At Each
    End also dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Devoured By Martens remains alive, sends his supernatural helpers Blood and
    Martens, kills the two shamans in the canoe, and takes his brother's grizzly-bear
    box, Thunderbird drum, Lightning, and Hail.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mouth At Each End goes home to the bottom of the lake, while Devoured By Martens
    is left alone and conquers all surrounding supernatural powers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After many years, a winter famine leads Devoured By Martens' people to ask
    him to obtain provisions.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The shaman lies beside the fire, asks to be covered with a cedar-bark mat,
    and begins a supernatural song about every living fish.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The next day, relatives travel in canoes downriver with four canoes tied together
    and boards laid across them; the shaman lies on red-painted planks under a mat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The shaman repeats the phrase about every living fish and points downriver,
    telling his people where fish are, until they reach the mouth of Skeena River
    and then go out to sea near Stephens Island.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:18
  text: At the sandy shore near Stephens Island, the shaman instructs the people to
    bring crooked cedar branches, make hooks, make fishing-lines from red-cedar bark,
    and split thin spruce roots.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:19
  text: The shaman tells the men to go down at very low tide, where they will find
    a fish-like creature under rocks with eight legs and a round head.
  category: speech
  evidence_refs:
  - ev:11
