canonical_text:
  quote: ''
  summary: Chief Porcupine repeatedly asks a hunter to pronounce his true name and
    strikes him with a spiny tail after wrong answers. Mouse Woman reveals the correct
    name, Sea Otter On Green Mountain, which saves the hunter from death. Chief Porcupine
    and his people remove the quills from the hunter's face with stomach contents
    from the chief's wives, then restore him with green leaves and spittle. The chief
    feeds him, spares him, and gives rules for hunting porcupines. The passage explains
    the origin of a porcupine-quill remedy, the hunter's return home and report to
    the people, and then begins a new story about beavers living safely in a deep
    lake near the Skeena River.
  language: English
  quote_policy: summarized
