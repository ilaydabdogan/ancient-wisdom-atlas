canonical_text:
  quote: ''
  summary: TxamsEm/Giant travels in a dark world along the Nass River, asks fishing
    Frogs for food, breaks a carried object after they refuse, and daylight appears
    while the Frogs are blown away and become stone. He then intervenes in a quarrel
    between Stone and Elderberry Bush about who will give birth first, causing Elderberry
    Bush to give birth first and explaining short human life and elderberries on graves.
    In the fire episode, people lack fire; TxamsEm attempts to obtain it from the
    animal village, uses a message, dance, deer disguise, pitchwood, bird companions,
    and Shark's canoe, and the Deer carries fire away and strikes a fir tree. The
    passage ends with the opening of another episode in which TxamsEm sees sea eggs
    on seaweed out at sea.
  language: English
  quote_policy: summarized
