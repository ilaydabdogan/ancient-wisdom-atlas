canonical_text:
  quote: ''
  summary: Four young brothers leave home after their mother scolds them about a beautiful
    plume. On their journey they encounter a blind man with a bag net who catches
    and eats people. Little Feather kills a raccoon carrying wood; the raccoon is
    later revealed as an old woman's granddaughter. The old woman traps the brothers
    in a house by closing its openings and increasing the heat, but Little Feather
    escapes as bird's down through the smoke hole, revives the raccoon with the plume,
    and the raccoon persuades her grandmother to open the house. The brothers continue
    to a lake, where another old woman hosts them kindly; at night she uses cedar-bark
    poles to catch their breath, but Nalq keeps watch and counters her act by catching
    her breath and removing the pole containing the brothers' breath.
  language: English
  quote_policy: summarized
