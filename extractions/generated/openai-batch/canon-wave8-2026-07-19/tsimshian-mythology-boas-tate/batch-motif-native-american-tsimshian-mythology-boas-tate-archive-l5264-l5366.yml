canonical_text:
  quote: ''
  summary: A young woman leaves her father's house with a nocturnal husband and enters
    the house of his snail family. Mouse Woman tells her the marriage follows from
    an earlier insult to a snail. Her family discovers her absence, searches unsuccessfully,
    summons shamans, and learns from a female shaman that she is alive in Chief Snail's
    house. Her six brothers purify themselves to retrieve her; the first five fail,
    and the youngest sets out with tools, ritual materials, provisions, and two companions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young man visits the young woman on four successive nights and asks whether
    he should take her from her father's house to his father's large house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young woman agrees, takes only a small box, and goes far away with the
    young man to his village.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the young man's large house, he lies with his back against a large fire,
    and two whale-sized snails are positioned on opposite sides of the fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two large snails are identified as the parents of the young man who married
    the young woman, and they do not attend to the new wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The disappointed young woman sits in a corner weeping, and Mouse Woman touches
    her side and asks for her woolen ear-ornaments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mouse Woman takes the woolen ear-ornaments and explains that the young woman's
    present situation is connected to a previous occasion when she kicked a snail
    and mockingly asked whether it wanted to marry her.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: At the young woman's home, her mother has the household keep quiet until dusk,
    then sends a maid to check on her; the maid finds the bed empty and the box gone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The six brothers search the village, houses, hills, and canoes, and the chief
    sends canoes among the Tsimshian tribes, but no one reports seeing the young woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief summons shamans from Tsimshian villages; after being paid, they
    take charms and dance around the fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A female shaman tells the chief that his daughter is alive in the house of
    Chief Snail, that Chief Snail's son married her, that she is disappointed, and
    that the six sons may take her home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The female shaman points her finger toward the rising sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief rewards the female shaman with a boy-slave and instructs his six
    sons to purify themselves so they may bring back their sister.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The first five brothers complete periods of purification and search among
    hills and mountains; each fails to bring the sister home, though the fifth almost
    reaches the village of the Snails.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After his purification, the youngest brother sets out with woodworking tools,
    fat, down, red ocher, tobacco, food, blue paint, burnt-clamshell lime, and two
    young men to carry provisions.
  category: action
  evidence_refs:
  - ev:11
