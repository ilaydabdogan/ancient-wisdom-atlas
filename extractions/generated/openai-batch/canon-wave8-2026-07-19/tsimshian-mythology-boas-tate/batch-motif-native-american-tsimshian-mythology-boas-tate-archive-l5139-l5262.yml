canonical_text:
  quote: ''
  summary: 'The passage concludes an origin account of net-making: a nonhuman husband
    later identified as Spider teaches a young woman and her mother how to make and
    use nets, leading to large stores of dried salmon and wealth for the widow. A
    Mouse Woman warns the young wife not to eat Spider people''s food or she will
    become a spider. The young woman later returns to her mother''s camp and teaches
    what she learned. The passage then begins the tale of Prince Snail, introducing
    a wealthy chief''s heavily guarded daughter who kicks a snail and mockingly asks
    whether it wants to marry her; two nights later a smooth-skinned handsome young
    man comes to her bed at night.'
  language: English
  quote_policy: summarized
