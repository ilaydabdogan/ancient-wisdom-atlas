canonical_text:
  quote: ''
  summary: A supernatural being takes his child temporarily to his parents and instructs
    his wife to retrieve the child at Mount K-xamin. A carved live cradle arrives
    on the water with a supernatural lullaby; the old chief gives elk skins, red ocher,
    and eagle down as gifts into the water. The supernatural being later promises
    continued help and vengeance against the woman who married the wife’s former husband.
    Killer whales capsize that woman’s canoe and drown her and some slaves. The child
    grows rapidly, becomes an expert hunter and halibut fisher, and later, with his
    supernatural father, obtains abundant halibut, seals, sea lions, whales, and other
    water animals. During famine in the village, the old chief distributes meat, fat,
    blubber, and dried halibut from their stores.
  language: English
  quote_policy: summarized
