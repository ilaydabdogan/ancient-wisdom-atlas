canonical_text:
  quote: ''
  summary: 'A hunter returns to his camp, speaks to and embraces a wooden wife, discovers
    two hidden young women, feeds and lodges them, then marries the younger sister
    after promising to destroy the wooden wife and keep the elder sister’s shame secret.
    The new wife learns weaving, the hunter grows wealthy, gives a feast, builds a
    house, and becomes a head chief. A new tale begins in a town by a lake: a chief’s
    only son refuses arranged marriage, meets a beautiful girl on the trail, promises
    exclusive marriage and secrecy, and later his friend notices his wet, cold returns
    before daylight.'
  language: English
  quote_policy: summarized
