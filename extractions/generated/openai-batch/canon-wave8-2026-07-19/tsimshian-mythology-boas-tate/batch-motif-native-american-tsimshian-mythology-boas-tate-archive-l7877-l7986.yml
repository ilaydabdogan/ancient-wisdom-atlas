canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which Peace Woman warns her husband
    to go back while he follows her over a line on the water. When she looks back,
    he sinks into the ocean and dies. Her father, Chief Peace, retrieves the son-in-law’s
    body parts with a bag net, reassembles them, leaps over the body four times, and
    the prince rises. The passage then begins the tale “Sucking Intestines,” in which
    a chieftainess in Red-Bear Village secretly loves the chief’s nephew, pretends
    to be sick and dead, is placed in a coffin on a tree on a small island, and uses
    horn-spoon scrapings to mimic maggots while her lover visits her at night in the
    coffin.
  language: English
  quote_policy: summarized
