canonical_text:
  quote: ''
  summary: A man at a hunting lodge catches many raccoons while his wife helps process
    them. After he tells her she is no better than the raccoons, she leaves in shame,
    dams water between two mountains, and refuses to return. The water becomes a lake
    where she lives. Her husband informs her six brothers, who visit and plead with
    her; they find a large lake, a beaver house, and later young beavers on floating
    objects.
  language: English
  quote_policy: summarized
