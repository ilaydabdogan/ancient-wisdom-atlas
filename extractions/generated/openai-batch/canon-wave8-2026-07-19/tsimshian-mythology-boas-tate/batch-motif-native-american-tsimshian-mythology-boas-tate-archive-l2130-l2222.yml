canonical_text:
  quote: ''
  summary: A chief's men watch a carved house at night and shoot a giant-like intruder,
    but the bullets do not affect him. Years later, a destitute young man wanders
    into the mountains, finds a hidden valley and hut, and meets the same being, who
    identifies himself as TxamsEm and shows the wound from the carved house. TxamsEm
    provides food, reveals animal-filled mountains and two transformed hauhau helpers,
    prepares meat by compressing it around a hunting staff, and sends the young man
    home along a trail with a warning not to look back until he reaches above his
    village.
  language: English
  quote_policy: summarized
