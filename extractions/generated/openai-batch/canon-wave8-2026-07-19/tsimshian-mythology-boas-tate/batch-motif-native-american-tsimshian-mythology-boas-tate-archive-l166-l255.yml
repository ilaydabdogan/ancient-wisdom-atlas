- id: obs:2
  text: The chief gives his son a small round stone, a raven blanket, and a dried
    sea-lion bladder filled with berries, and instructs him to scatter fruit and fish
    roe in the land and waters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The father names his son Giant before he starts out.
  category: action
  evidence_refs:
