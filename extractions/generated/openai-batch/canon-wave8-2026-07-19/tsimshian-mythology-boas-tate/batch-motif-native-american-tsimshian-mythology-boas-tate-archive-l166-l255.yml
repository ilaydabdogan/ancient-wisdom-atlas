canonical_text:
  quote: ''
  summary: A chief sends his son away with a round stone, a raven covering, berries,
    and fish roe, instructing him how to find rest and provide food in the land. The
    son, named Giant, flies east, turns the stone into a resting rock, reaches the
    mainland, and scatters fish roe and fruits. Because the world is dark, Giant ascends
    through a sky hole to heaven, transforms into a cedar leaf, is swallowed by the
    chief of heaven's daughter, and is born as a boy. As the crying child, he obtains
    the box named md that contains daylight, carries it away, puts on the raven skin,
    and flies down to this world with it.
  language: English
  quote_policy: summarized
