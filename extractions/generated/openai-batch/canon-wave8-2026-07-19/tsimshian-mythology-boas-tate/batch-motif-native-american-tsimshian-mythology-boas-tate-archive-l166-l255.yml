  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Giant transforms himself into a cedar leaf floating on the water; the chief's
    daughter dips it up, drinks it, becomes pregnant, and gives birth to a boy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boy grows, creeps about, and repeatedly cries “Hama,” troubling the chief
    of heaven, who calls slaves and wise men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The desired object is a box named md, kept hanging in the chief's house, and
    the daylight is kept inside it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A wise man understands the child's crying and says he is crying for the md;
