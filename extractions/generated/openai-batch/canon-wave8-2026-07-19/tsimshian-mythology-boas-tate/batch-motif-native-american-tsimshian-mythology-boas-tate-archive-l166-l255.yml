  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Giant remembers that there is light in heaven, decides to bring it to this
    world, puts on the raven skin, flies upward, and passes through a hole in the
    sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Near the house of the chief of heaven, Giant waits at a spring while the chief's
