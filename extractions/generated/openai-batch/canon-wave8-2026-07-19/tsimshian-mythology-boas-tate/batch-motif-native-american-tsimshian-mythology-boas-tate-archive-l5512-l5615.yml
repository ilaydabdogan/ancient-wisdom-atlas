canonical_text:
  quote: ''
  summary: A young princess remains cold at a women's camp despite added firewood.
    A friend calls heavy rain, the river rises, and the group moves to another spruce-tree
    shelter. The young prince asks the princess to return with him; she agrees after
    her aunt urges her. In a canoe she is carried to a strange country, where the
    canoe is seen to have become a drift-log. Mouse Woman tells her that she has been
    married by the Otter prince because she refused her cousin, and gives her food
    instructions. Later, while pregnant, she is cast out by her affinal household
    and gives birth to a little Otter near a tree. Mouse Woman brings her fire. The
    woman tries three times to throw the little Otter into the water, but he returns,
    and she takes compassion on him. When grown, the Otter child brings her food.
    Mouse Woman then points out the nearby country of the woman's father's tribe and
    instructs her to kill the otter people by smoking their den and clubbing them
    as they emerge.
  language: English
  quote_policy: summarized
