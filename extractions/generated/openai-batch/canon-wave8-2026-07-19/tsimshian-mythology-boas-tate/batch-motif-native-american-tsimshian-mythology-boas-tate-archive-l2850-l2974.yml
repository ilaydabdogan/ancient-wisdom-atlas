canonical_text:
  quote: ''
  summary: The passage explains Dog's hostility toward Porcupine, Dog's thumb, the
    twelve-month calendar, thirty-day months, seasonal divisions, celestial lights,
    red-sky weather signs, and the origin of fog from the west. It then begins a separate
    tale in which a chief trains four nephews through winter sea-bathing, whipping
    with twigs, and strength tests, while the youngest refuses to bathe and is nicknamed
    Dirty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The animals agree that the Dogs should be driven away; Dog's hatred of Porcupine
    and woodland animals is connected to Porcupine knocking down Dog's thumb with
    his spiny tail and taking Dog's position in council.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dog's thumb is said to stand opposite his other fingers; Dog is said to have
    had six fingers; the passage also states that, because of what happened then,
    there are only twelve months.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Porcupine makes the days thirty to each month; people enjoy heavenly light,
    whereas the world was formerly always dark.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The animals, seated together in council, name the months and divide the year
    into spring, summer, autumn, and winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When The One Who Walks All Over The Sky sleeps, sparks fly from his mouth
    and are identified as stars; at night the moon receives light from the shining
    face of the Sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Sun is glad, he paints his face with his sister's red ocher; red
    sky in evening or morning is used by people as a weather sign.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The girl goes westward, wrings out her garments, strikes the water with them,
    returns, warms herself at her father's fire, and shakes water from her garments
    onto the fire, causing fog to come out of the house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people are refreshed by the fog, and the chief is glad at his children's
    wisdom; he assigns the eldest son to watch the year, assigns The One Who Walks
    All Over The Sky to make good things and plenty on earth, and blesses his daughter
    for refreshing the tired with cool fog.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the tale of Dirty, a great chief builds his house on a sandy beach and
    has four nephews whom he sends every winter morning to get fuel.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The uncle tells the nephews to become strong, build a large fire, bathe in
    the nearly frozen sea, and be whipped with a bundle of twigs; he says he will
    later invite chiefs and warriors to fight them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The eldest, second, and third brothers go into the ice-cold water, but the
    fourth and youngest refuses and lies in the corner of his uncle's house; the passage
    says he had never taken a bath since birth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The three brothers laugh at the youngest and call him Dirty; he lies on the
    ground without a bed, has only a ragged deer-skin blanket, and steam rises from
    the place where he slept, which the brothers think is wet ground.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: The three bathing brothers become stronger than all other people; after bathing,
    their uncle orders them to pull fresh branches from a spruce tree without tools,
    but they repeatedly fail.
  category: sequence
  evidence_refs:
  - ev:11
