canonical_text:
  quote: ''
  summary: The passage describes Uap beliefs about Falraman, a sky abode of departed
    spirits presided over by Yalafath, the creator. It explains the tafenai or thinking-part
    that goes to Falraman, exceptions for stillborn children, later return as an invisible
    athegith, sickness caused by an improperly honored dead person, and illness or
    delirium as the tafenai leaving the body. The passage ends with the beginning
    of an anecdote about an epileptic man at Friedlander's house.
  language: English
  quote_policy: summarized
