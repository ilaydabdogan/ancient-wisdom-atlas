canonical_text:
  quote: ''
  summary: The passage states that if a mispil becomes pregnant, one of the men of
    the failu must take her as wife, build her a house, and raise a separate family.
    The author says this arrangement is socially adjustable and not disgraceful in
    that community. The wife of Lian, Chief of Dulukan, is described as bearing a
    telltale tattoo on her hands and legs while maintaining high social standing with
    her husband. The author concludes that this feature of the failu seems less immoral
    because it lacks grossness.
