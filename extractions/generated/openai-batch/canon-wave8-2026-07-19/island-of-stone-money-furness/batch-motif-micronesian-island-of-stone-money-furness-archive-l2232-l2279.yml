canonical_text:
  quote: ''
  summary: The passage describes exchange values for fei, examples of barter involving
    fei, a compensation payment for theft of a mispil, and the use of flat pearl-shells
    strung with cowries as small change on Uap. It also describes how the value of
    the pearl-shells is measured and reduced by mutilation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The exchangeable value of fei is said to depend largely on the eagerness of
    buyer and seller at the time of trade.
  category: relationship
  evidence_refs:
