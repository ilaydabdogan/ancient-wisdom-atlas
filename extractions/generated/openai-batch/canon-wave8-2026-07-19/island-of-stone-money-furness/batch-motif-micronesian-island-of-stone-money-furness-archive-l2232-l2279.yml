- id: obs:2
  text: Fatumak gives valuations for fei, while the narrator notes that these valuations
    may be somewhat high.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A three-span fei of good whiteness and shape is valued against baskets of
    food, a pig, coconuts, or a pearl shell of specified size.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator exchanges a small short-handled axe for one fei and a fifty-pound
    bag of rice for another larger fei.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A well-finished fei about four feet in diameter is described as a usual compensation
