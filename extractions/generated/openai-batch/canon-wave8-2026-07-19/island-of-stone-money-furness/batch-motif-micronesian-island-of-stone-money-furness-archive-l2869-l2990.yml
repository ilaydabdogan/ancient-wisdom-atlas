canonical_text:
  quote: ''
  summary: The narrator describes Fatumak, a Yapese man who learned legends from elders,
    spent twenty-eight moons in solitary recovery after a fall, and became known as
    a wise man and diviner. The passage describes his house, possessions, physical
    condition, raft travel, fees in coconuts, and a method of fortune-telling by interpreting
    knots in leaf strips, whose secret meanings are linked to marriages of kan or
    demons and transmitted from father to son near death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fatumak says he learned Uap stories from old people when he was a boy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He points to notches on the handle of a little adze and says each mark represents
    one moon; after a fall he lay in his house for twenty-eight moons, thinking, talking
    to himself, and remembering stories.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that after two years of solitary self-communion Fatumak
    was regarded by his people as a wise man with prophetic foresight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fatumak made his living by interpreting omens and telling fortunes through
    combinations of knots in Bei or hei leaves.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: Fatumak lived alone, had not taken a wife, and kept a house filled with assorted
    objects, including discarded items from Spanish or German traders.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: His bamboo fence and tin biscuit-box were both secured with large padlocks,
    though the fence was described as flimsy and the biscuit-box lid appeared to have
    been bent open at the corners.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Because of his misshapen back, Fatumak could not paddle his own canoe; he
    built a raft of palm stems and bamboos, called it his barco, and poled it along
    the shallow lagoon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After fortune-telling rounds, Fatumak returned with ripe coconuts, described
    as consultation fees collected on the spot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fatumak believed in his leaf-divination method and became serious and reserved
    when others treated it lightly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hidden meanings of the knots are said to concern marriages of the kan
    or demons; only a favored few know these meanings, and the knowledge is disclosed
    from father to son as the father approaches death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In one observed consultation, a man tied knots in four strips of palm leaf
    while speaking to himself or to the knots, showed them to Fatumak, and received
    brief replies about whether a sick friend would recover.
  category: action
  evidence_refs:
  - ev:6
