canonical_text:
  quote: ''
  summary: The passage describes a Yapese family whose acknowledged wealth consists
    of a very large fei stone money lying at the bottom of the sea after being lost
    in a storm. Witness testimony and communal recognition preserve its monetary value
    despite its invisibility and inaccessibility. The passage also notes that the
    great weight of fei makes theft rare, and that Uap lacks wheeled vehicles and
    cart roads but has paths between settlements.
