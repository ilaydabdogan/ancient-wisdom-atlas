canonical_text:
  quote: ''
  summary: 'The passage describes Yapese tattooing practices: captured women companions
    were tattooed on hands and legs; tattooing is said to have been introduced from
    Mukamuk; the Thilibetrak leg pattern was once restricted to warriors but later
    became fashionable; Ngol shark representations are explained either as protection
    from sharks or as emblems of the shark''s status; women usually performed the
    art, called Gotau, using pigment made from coconut-oil soot, coconut milk, and
    water and applying it with simple tools.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tattooing was described as generally uncommon among women except for women
    captured from other communities to be companions for men in the Failu or Pabai;
    these women were tattooed on the backs of the hands and on the legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Middle-aged men with elaborate tattooing said the fashion came from Mukamuk,
    and that men from Mukamuk drifted to Uap and taught men and women how to tattoo.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Thilibetrak leg pattern was formerly allowed only for warriors; after
    serious battles between neighbouring districts ceased, the restriction was ignored
    and the pattern became a fashion and courtship-related ornament.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ngol are representations of sharks; one reported explanation is protection
    from shark attacks while swimming in the lagoon, while another is that the shark
    is the king of fish and fish are important food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gotau is given as the native name for tattooing, and women are described as
    usually being the artists during long periods in the Pabai or Failu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The coloring material is made from soot from burning coconut oil, coconut
    milk, and water; it is dabbed on the skin, outlined with a pointed stick, and
    driven under the skin with a rake-like needle or graver made from frigate-bird
    wing bone.
  category: object
  evidence_refs:
  - ev:6
