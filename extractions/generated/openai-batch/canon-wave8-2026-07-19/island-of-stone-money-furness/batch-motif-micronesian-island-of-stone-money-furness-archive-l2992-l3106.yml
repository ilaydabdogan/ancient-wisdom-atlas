canonical_text:
  quote: ''
  summary: The passage describes a Yapese omen-consultation practice using knotted
    green leaf strips. A questioner ties knots while murmuring a question; a seer
    counts knot remainders by fours, holds four strips between the fingers, and interprets
    paired numerical combinations as named han or demons. The passage lists sixteen
    combinations, gives examples of sex and marriage relations among the han, and
    ends with Fatumak withholding further knowledge of Bei, which he says enables
    Uap men to see future events.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person seeking omens provides eight or ten strips of green pahn leaf, preferably
    coconut leaves, and ties random single knots while murmuring the question to be
    answered in the presence of a soothsayer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four knotted strips are counted by fours from the broad end of the leaf and
    held between successive fingers of the right hand so that remainder knots project
    near the knuckles; an exact multiple of four leaves four knots projecting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The seer reads the omen from two pairs of strips: the thumb-index and index-middle
    strips form one pair, and the middle-ring and ring-little-finger strips form the
    other.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each pair of knot remainders signifies a different han or demon, and the goodness
    or badness of the omen depends on the union of these han.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that sixteen number-combinations and sixteen han assist
    in this form of mach-mach.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: In the example, Vengek is described as a female han, Nebul as a male han associating
    with Vengek, and the answer also depends on pair position, time of day, weather,
    and other influences.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage gives named marriage examples among han: Liverr is a woman married
    to Wunumerr, Vengek is a woman married to Trunuwil, and Nafau is a woman married
    to Namen; it also states that descending numerical combinations are women married
    to their ascending reverse combinations.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The even combinations are described as a family-like set: four-and-four is
    chief Sayuk, two-and-two is his lesser half Nagaman, one-and-one is their son
    Thilibik, and three-and-three is bachelor youth Thugalup.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fatumak becomes provoked after the narrator anticipates the combinations,
    says that a white man could not understand Bei, and contrasts European distance-seeing
    glasses with Uap Bei that sees things not yet happened.
  category: speech
  evidence_refs:
  - ev:8
