  summary: After fishermen return to a failu, the house interior is partitioned with
    green coconut-frond matting into small stalls for the tired men. Other members
    remain at the inland end, working, smoking, singing, or gathering around embers,
    while the fishermen are ignored and confined until they sail again. The passage
    also notes a possible taboo against stepping over the legs of sleeping fishermen
    and begins to mention female kin bringing gifts or wishing to speak with them.
  language: English
