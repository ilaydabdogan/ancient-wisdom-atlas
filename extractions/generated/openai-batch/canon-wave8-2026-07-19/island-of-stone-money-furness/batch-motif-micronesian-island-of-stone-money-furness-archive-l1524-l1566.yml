canonical_text:
  quote: ''
  summary: The narrator describes playing recorded songs to women in a crowded bamboo
    hall. An English song fails to interest them, but a native song causes silence,
    wonder, laughter, and attempts to inspect the machine and narrator for a hidden
    singer. Later two young girls reluctantly sing a funeral duet about the deceased
    and the grief of survivors; the recording is imperfect but fascinates the women
    when they hear their own voices.
  language: English
