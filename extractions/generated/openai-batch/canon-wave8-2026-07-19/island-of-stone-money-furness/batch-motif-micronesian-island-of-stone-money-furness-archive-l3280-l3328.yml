canonical_text:
  quote: "“Long, long ago when there was nothing but sea and sky, and no land...”"
  summary: 'Fatumak recounts an origin narrative: before land existed, a first woman
    emerged from a barnacle beneath floating driftwood. Her daughter disobeyed a warning
    not to go atop the log; a hibiscus tree grew down from the sky and fixed the log
    in place. Clothed sea devils killed the naked daughter and preserved her body
    in salt. Yalafath, ruler of Falraman or Heaven, ordered the devils to revive her
    by a charm and then gave the mother and daughter sand and yams to scatter and
    plant over the sea.'
  language: English
  quote_policy: quoted
