canonical_text:
  quote: ''
  summary: 'The narrator describes interactions with Yapese children and adults: a
    child with protected pierced ears exchanges displays with him and teaches a cat''s-cradle
    figure called melang, children gather to make string figures, the chief Lian unsuccessfully
    attempts a pattern, and later Kakofel and other children play a moonlit firebrand
    game that alarms Friedlander because of nearby thatched storehouses and copra.'
  language: English
  quote_policy: summarized
