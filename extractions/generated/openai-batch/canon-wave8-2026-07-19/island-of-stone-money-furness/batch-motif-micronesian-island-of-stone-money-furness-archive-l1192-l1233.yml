canonical_text:
  quote: ''
  summary: The passage describes Uap ear-piercing and adornment practices. Both boys
    and girls have the earlobes pierced and gradually enlarged at about ages ten to
    twelve. A sharpened coconut shell makes the incision, and a warmed, oiled roll
    of maluek leaves is inserted and renewed until the hole is large enough and healed.
    Boys receive no protection for swollen ears, while girls may wear yellow-stained
    coconut-shell protectors. Ear holes are used for leaves, flowers, cotton, and
    flower stems.
  language: English
  quote_policy: summarized
