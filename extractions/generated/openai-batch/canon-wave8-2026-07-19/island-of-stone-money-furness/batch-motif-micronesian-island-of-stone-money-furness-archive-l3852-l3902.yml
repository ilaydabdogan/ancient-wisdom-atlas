canonical_text:
  quote: ''
  summary: A funeral procession brings valuables for Mafel's corpse. At the dead man's
    fenced house-yard, women are present inside, while local custom restricts entry
    to women and the slave class until burial. The corpse is expected to be taken
    out by breaking through the wall rather than through a doorway, because doorway
    removal is said to bring ill luck to the living. Presents are displayed and are
    expected to be returned after burial as signs of sorrow. Women in the yard sit
    quietly, whisper, and work on pouches, skirts, and betel baskets.
  language: English
  quote_policy: summarized
