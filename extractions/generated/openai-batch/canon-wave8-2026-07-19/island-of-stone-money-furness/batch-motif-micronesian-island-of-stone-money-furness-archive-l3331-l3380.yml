canonical_text:
  quote: ''
  summary: A story fragment recounts a mother and daughter forgetting a seven-day
    obligation, Yalafath sending a rat to destroy their yam plants, their repentance,
    forgiveness, and a cat sent against the rat. Yalafath then orders the daughter
    to marry the man who had killed and revived her, gives them a sailing canoe, and
    the narrative explains high lands, low coral islands, dark people, white people,
    ships, and the taking of coconuts and sand. The narrator then argues that the
    story seems recent, citing introduced cats and an incident involving a copra-trader
    taking sand as ballast.
  language: English
  quote_policy: summarized
