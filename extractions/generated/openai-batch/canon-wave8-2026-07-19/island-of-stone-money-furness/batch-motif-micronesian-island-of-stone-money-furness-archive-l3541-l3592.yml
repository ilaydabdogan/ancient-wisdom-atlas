canonical_text:
  quote: ''
  summary: 'The passage describes several services of the mach-mach: touching a sick
    person, calming wind and waves by using a stingray spine talisman against an invisible
    god, and conducting a child-naming rite ten days after birth involving movement
    from the secluded birth house to the father''s house, coconut leaves, invocation
    of Yalafath, and expulsion of demons. It also describes payment to the mach-mach
    and briefly mentions Fatumak, Friedlander, and an allusion to a barnacle woman
    and her daughter depositing sand.'
  language: English
  quote_policy: summarized
