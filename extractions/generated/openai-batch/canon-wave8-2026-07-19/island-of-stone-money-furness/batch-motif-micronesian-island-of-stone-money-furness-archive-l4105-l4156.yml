  quote: a sprouting coconut was planted at the head
  summary: 'The passage describes part of Mafel''s burial: goods are buried with him,
    mourners wail, a sprouting coconut is planted at the grave head to provision his
    journey, stones and coral are packed around the grave to protect the body from
    monitor lizards, and the mourning stops when the grave is finished. It also reports
    that important or wealthy people are carried to the grave by a circuitous route
    so their relatives'' grief is publicly seen and heard, while poor people are taken
    quickly. A post-burial explanation says burial position varies with manner of
    death.'
