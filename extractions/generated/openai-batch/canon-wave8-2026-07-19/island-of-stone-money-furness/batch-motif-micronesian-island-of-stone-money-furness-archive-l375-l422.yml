  summary: 'The passage describes the interior of Uap private houses: rafters, dust
    and smoke, a dark screened sleeping area, overhead storage, and the narrator’s
    permitted searches for ethnological objects. It also notes that owners likely
    hid valuable possessions in the inner chamber and expected payment in trade tobacco
    for items the narrator wanted.'
