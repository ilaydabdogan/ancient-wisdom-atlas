canonical_text:
  quote: ''
  summary: 'The passage describes a strict fishing-season taboo for fishermen staying
    in the failu: they may not leave, visit home, look at women, join song or dance,
    mingle with companions, or speak in a fisherman’s usual boastful manner until
    the season ends. A taboo breach involving looking at a woman is said to bring
    eye-punishment by flying fish at night. The passage then describes large outrigger
    fishing canoes, their crews, and the technique of moving the mast and rigging
    from bow to stern when tacking, so that stern and bow reverse roles.'
  language: English
  quote_policy: summarized
