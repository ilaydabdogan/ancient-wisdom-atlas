canonical_text:
  quote: ''
  summary: 'The passage describes Uap stone currency called fei: its moss-covered
    surface does not reduce value; fei are circular stones with central holes for
    carrying by pole; smaller pieces are used in purchases; diameter determines value
    by span measurement; fei are displayed before a failu as evidence of wealth and
    industry; large stones may change ownership by acknowledged agreement without
    being physically moved or marked.'
  language: English
