canonical_text:
  quote: ''
  summary: The narrator describes failed attempts to interest an audience with phonograph
    songs in unfamiliar words, then records a youth speaking native words and immediately
    plays them back. The audience reacts with awe, silence, laughter, and repeated
    requests, and the phonograph is accepted as a talking and singing machine. Women
    later request a separate exhibition without men, and Friedlander prepares a copra
    storehouse for it.
