canonical_text:
  quote: '"the seizure of a young girl to fill the office of mispil"'
  summary: The passage describes changing practices around the capture of a mispil.
    Formerly, when districts were at war and noble groups were divided, such captures
    brought bloodshed and feuds. In the described present, the seizure of a girl for
    the office is treated more like a stealthy, often prearranged burglary, with the
    district chief receiving appeals from the parents and using shell and stone money
    indemnity to avert retaliation. The passage then introduces Gamiau as an informant
    and leader in the capture of Lemet, the mispil of Dulukan.
  language: English
  quote_policy: quoted
