canonical_text:
  quote: ''
  summary: The passage describes decorated male performers arranged by age at the
    front of the failu, an audience waiting for posture-songs, and the first sitting-down
    dance, called tsuru. The tsuru is described as the only song-dance proper for
    women to witness and as narrating heroes in canoes at sea or legends of Kan/devils
    who control human lives. Performers sing in unison and use arm and wrist gestures
    suggesting rowing and repelling foes, without weapons. The narrator begins a comparison
    to posture-dances in Japan, Anam, and Siam.
  language: English
  quote_policy: summarized
