canonical_text:
  quote: ''
  summary: 'The passage describes the status of a mispil associated with a failu or
    pabai: matrons avoid her socially, while men treat her respectfully, provide her
    food and luxuries, regulate any observable preference for one lover, allow her
    access to songs and dances barred to other women, and maintain a separate tapal
    house for her seclusion. It also states that mispils are faithful to the men of
    their failu or pabai and are associated with capture and payment in stone money.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the community where the mispil is an alien, her social rank is described
    as gone, and matrons of the district do not have social intercourse with her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men, whether in or out of her failu, treat the mispil with consideration and
    respect, avoiding unseemly actions and coarse language in her presence or hearing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Because of her station, the mispil is permitted to see and hear songs and
    dances from which other women are barred.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: If an observable preference for one lover appears, the mispil is not blamed;
    the favored man is told to retire or leave the failu for a time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men supply the mispil with food and luxuries such as tobacco and betel
    nut, and she is not required to work in the taro fields.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A small house called a tapal is built in the bush behind the failu for the
    mispil’s seclusion; during her stay there, men place food nearby but do not enter
    the enclosure around the house.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The men of the failu are said to show mispils more respect and devotion than
    men outside generally show to wives of their own households.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mispils are described as faithful to the men of their failu or pabai and as
    regarding themselves as property because they were sought, captured at risk to
    men’s lives, and paid for with costly stone money.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that mispils are not kept as prisoners, though the sentence
