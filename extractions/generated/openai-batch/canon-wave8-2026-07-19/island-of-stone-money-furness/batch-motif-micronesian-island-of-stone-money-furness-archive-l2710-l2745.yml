canonical_text:
  quote: ''
  summary: 'The passage describes a gendered food and fire taboo: women have an exclusive
    cooking house called pinfi, men avoid utensils, fire, embers, matches, bowls,
    and betel baskets associated with women, and Lian explains that breach would bring
    ill luck or sickness. A test with areca nuts from a woman''s basket causes a man
    to throw them away. The narrator also describes separate utensils and a fireplace
    for Lian''s food and comments that an omen about flying sparks is used to make
    women avoid setting houses on fire.'
  language: English
  quote_policy: summarized
