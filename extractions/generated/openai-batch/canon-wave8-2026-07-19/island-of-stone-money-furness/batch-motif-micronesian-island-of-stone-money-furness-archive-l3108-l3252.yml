canonical_text:
  quote: ''
  summary: The narrator reports information from chief Ronoboi about mach-mach or
    momoh practitioners, including restrictions on age, sexual status, food, and disposal
    of chewed betel, nail parings, hair, and spit to prevent counter-spells. Consultation
    of the Bei requires the client to knot palm-leaf strips and hold them in the right
    hand. The passage then describes Fatumak’s accurate trade accounts, his invented
    cipher or sign-writing for goods and coconut quantities, a comparison of Uap decimal
    counting with Miri Naga counting, and the narrator’s assessment of Fatumak’s intelligence
    and character.
  language: English
  quote_policy: summarized
