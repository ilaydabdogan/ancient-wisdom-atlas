  quote: ''
  summary: During burial preparations, Pimlingai workers handle earth removed from
    the grave while women prepare baskets and gather stones and coral to line and
    cover it. Women and children sit silently nearby. Some women inspect the narrator’s
    tattoos, including a Japanese carp. When the grave is ready, Maf el is placed
    in it on a mat with his head toward the setting sun, and one Pimlingai takes two
    pearl shells from the corpse as payment for labor.
