canonical_text:
  quote: ''
  summary: The passage describes Uap village men's houses called failu on the coast
    and pabai inland. These houses belong exclusively to men, serve as places for
    councils and community discussion, and are also used by men and boys for song
    and dance while women are excluded. The passage adds that such houses may take
    years to build and may be occupied before ceremonial completion when only the
    framework and roof are finished.
