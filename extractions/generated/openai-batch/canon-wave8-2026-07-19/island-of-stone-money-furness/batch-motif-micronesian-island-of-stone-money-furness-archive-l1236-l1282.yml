  quote: ''
  summary: 'The passage describes adornments on Uap: floral and leaf ornaments, women’s
    preference for natural effects over manufactured earrings, men’s shell and bead
    ear ornaments, rare pink shell pendants owned by wealthy families, less valuable
    shell alternatives, improvised use of bright discarded film, ordinary shell-disc
    necklaces for common folk, and the beginning of a description of prized men’s
    bead necklaces.'
