  quote: ''
  summary: 'An observer describes seated dance and posture songs near a failu: dancers
    remain seated, clap rhythmically, and perform synchronized arm movements while
    women and men watch from different positions. After a shouted ending, the performers
    withdraw. When a standing-up tsuru is announced, many women leave or turn away,
    while others hide behind coconut trees and secretly watch dances described as
    forbidden.'
