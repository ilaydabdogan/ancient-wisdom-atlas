canonical_text:
  quote: '"An all right sort of tomtom"'
  summary: The narrator introduces a phonograph to record songs and incantations,
    expecting the audience to be astonished by a machine that emits human voices and
    music. The listeners show little interest in the voice or songs, attend more to
    the machine’s moving parts and clockwork buzz, and some leave to husk coconuts.
    One man calls it a kind of tom-tom, a term the narrator says is used locally for
    introduced musical instruments.
  language: English
