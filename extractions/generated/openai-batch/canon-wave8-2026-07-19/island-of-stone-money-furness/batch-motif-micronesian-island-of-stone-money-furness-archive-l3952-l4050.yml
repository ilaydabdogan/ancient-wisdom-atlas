canonical_text:
  quote: ''
  summary: 'A Yapese burial rite is described: Gyeiga mourns Mafel, places pearl shells
    on his corpse, the Pimlingai wrap and carry the body by litter, a wailing procession
    travels through paths and villages to a grave clearing, and preparations for burial
    begin near other graves, including that of Mafel''s recently deceased wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three women are crying, but Gyeiga is the only one described as weeping aloud
    beside the corpse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gyeiga places two large pearl shells on the corpse's chest, then adds two
    more shells after another short speech to the corpse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Pimlingai wrap matting completely around the body, leaving only the top
    of the head bare, and tie the litter to a shoulder pole for carrying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bearers leave through an opening in the bamboo fence, followed by Gyeiga,
    two chief mourners, and several other women who wail loudly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the procession, wailing continues in turns as different members of
    the party take it up.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The procession passes through jungle paths, clusters of houses, flat lands,
    taro patches, yam plantations, and a deserted maternity village.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Three or four women and eight or ten children from a Pimlingai village silently
    join the procession before the litter bearers turn into thick undergrowth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The burial clearing contains young coconut palms, low mounds, and piles of
    moss-covered stones identified as earlier graves.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The litter is placed near a recent mound said to be the grave of Mafel's wife,
    whose similar litter remains are still decaying there.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the grave site, Gyeiga unfastens the matting, exposes the body again, fans
    it with a palm leaf, and repeats a lament naming Mafel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Pimlingai bring sharpened poles and use them to loosen the ground near
    the litter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief mourners begin plaiting rough baskets at the burial site.
  category: action
  evidence_refs:
  - ev:9
