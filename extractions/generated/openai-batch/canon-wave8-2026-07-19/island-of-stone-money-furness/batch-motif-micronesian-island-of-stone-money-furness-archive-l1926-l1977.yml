canonical_text:
  quote: ''
  summary: 'An observer describes a standing-up tsuru performed chiefly by younger
    men: they emerge from the failu, line up in front of it, mark time with their
    feet and clap, then begin a faster sung dance after a singer identified uncertainly
    as Gamiau starts the song. The dancers execute rapid synchronized arm, leg, and
    posture movements while the song continues. The observer reports that the song
    was not translated into modern Uap and speculates that the full meaning of ancient
    phrases may have been lost.'
  language: English
