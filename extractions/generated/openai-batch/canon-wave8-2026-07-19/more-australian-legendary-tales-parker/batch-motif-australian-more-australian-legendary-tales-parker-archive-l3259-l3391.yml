canonical_text:
  quote: ''
  summary: The opening fragment says the name of the brown and yellow Bubburr inspires
    fear. The main tale, titled "The Youayah Mayamah, or Stone Frogs," tells of girls
    changed into frogs by an old wirreenun after offending him. Their mother searches
    for them, nearly eats the large frogs she finds, then hears the frogs identify
    themselves as her lost daughters. The old wirreenun admits the transformation,
    says the girls mocked his tribe's mah, and refuses the mother's plea to change
    them back.
  language: English
  quote_policy: summarized
