canonical_text:
  quote: ''
  summary: 'The passage concludes a Wurrunnah sea-journey tradition: shells become
    contested ceremonial objects; Wurrunnah returns with salt water, his story becomes
    tribal tradition, he dies after breaking Byamee''s law, and a meteor marks his
    passing. Later boys see and taste the sea, confirming the tradition and taking
    shells back. The passage then begins the tale of Walloobahl the Bark Lizard, a
    strange boy who steals camp food, grows taller to avoid capture, is speared by
    parents, and is covered with bark as the camp moves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shells are described as the cause of fights between tribes; an oldest wirreenun
    wore one at great corroborees, and a later wirreenun placed one in a Minggah or
    spirit tree.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wurrunnah repeatedly makes fresh bags to carry salt water home and reaches
    Nerangledool with enough for tribal elders to taste.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wurrunnah's people do not know where he has been or what the far-stretching
    water is; his account becomes a tradition in his tribe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Wurrunnah broke the law of Byamee by leaving his own
    hunting ground and was not allowed to live long after returning.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Wurrunnah's death, a terrific crash and a huge meteor across the sky are
    said to tell nearby tribes that a great spirit had passed from the earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Later boys travel with cattle to Mulubinba, see the wide water, hear its roar,
    taste it, find it salt, and take shells back to prove their report.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: One of the boys who first tasted the salt water is described as an old man
    who told the narrator the story of Wurrunnah's trip to the sea.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A strange little boy, later named Walloobahl and titled the Bark Lizard, comes
    to the camp while parents are away hunting and children are playing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Walloobahl steals food from dardurrs, ignores the children's warnings, and
    grows suddenly taller when they come near him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Parents hide in their humpies to test the children's account, then rush out
    and attack Walloobahl with boomerangs, boondees, and spears.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Boomerangs and boondees fall harmlessly as Walloobahl grows taller, but spears
    pierce him and he falls dead.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Daens call Walloobahl their enemy because he stole food, decide not to
    bury him, cover him with bark, and change camp.
  category: speech
  evidence_refs:
  - ev:12
