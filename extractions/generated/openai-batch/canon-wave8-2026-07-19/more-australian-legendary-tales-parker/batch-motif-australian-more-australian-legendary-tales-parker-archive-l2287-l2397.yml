  text: The narrator says Earmoonan and the rest of the strange litter live in huge
    caves under sand-ridges, imprison travellers, and are frightened by the name of
    Byamee.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wurrunnah travels for many days to Doogoonberh on the sea, sees a wide expanse
    of water, and tries to drink from it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wurrunnah finds the water salty, spits it out, clears away the white froth,
    tries again, and decides to return to the water-holes for drinkable water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wurrunnah says the sea does not look like flood water, has no tree or mirrieh-bush
    in it, tastes salt, and resembles the sky with white clouds while also moving
    like water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wurrunnah returns to the water-holes, quenches his thirst, kills two opossums,
    and skins them to make water-bags.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At night, while camped away from the sea, Wurrunnah hears the sea's booming
    noise after the wind rises.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The next morning Wurrunnah climbs a high tree near the beach to look for a
    far bank, trees, or land, but sees only water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wurrunnah says the troubled water must be the camp of Dooloomai the Thunder
    and the roaring winds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: As the tide rises and waves run onto the beach, Wurrunnah says Wundah, or
    devils, must be in the water trying to get him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Wurrunnah climbs a high mountain to see better, but still sees water as far
    as he can see.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Wurrunnah makes the opossum skins into water-bags, fills them with sea water
