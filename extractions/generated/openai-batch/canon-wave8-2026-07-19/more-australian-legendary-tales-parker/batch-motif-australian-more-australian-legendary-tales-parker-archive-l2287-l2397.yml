  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: On his return journey, Wurrunnah meets a very old Daen, described as an old
    wirreenun, who listens to his account and tastes the salt water.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The old wirreenun says his father's fathers had told of water beyond the mountains,
