canonical_text:
  quote: ''
  summary: Wurrunnah sends Earmoonan away by speaking the name Byamee, then travels
    to Doogoonberh by the sea. He tastes salt water, puzzles over the moving expanse,
    hears its booming, and looks from a tree and a mountain without seeing land beyond
    it. He makes opossum-skin water-bags, fills them with sea water, collects shells,
    and meets an old Daen/wirreenun who says ancestral accounts told of dangerous
    waters beyond the mountains and monsters living in them. Wurrunnah gives the old
    wirreenun salt water and a shell for his tribe.
  language: English
  quote_policy: summarized
