canonical_text:
  quote: ''
  summary: The passage concludes an account of a duck who returns from Biggoon, hatches
    two unusual children with duck, furred, four-footed, webbed, and spear-like traits,
    is rejected by the duck tribe, withdraws upstream to the mountains, dies there,
    and whose children multiply as Gayardaree, or platypus. A second account tells
    how a sea-gull carrying a mussel is pursued by Wahn the crow, drops it, and after
    Wahn partly eats it and throws it into a creek, mussels multiply there.
  language: English
  quote_policy: summarized
