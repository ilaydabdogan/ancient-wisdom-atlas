  quote: ''
  summary: 'The passage contains a contents-like list of legend titles and part of
    the preface to the collection. The preface describes the collector''s methods
    and gives brief examples of folklore learned in daily contact: grey moths are
    said to be sent by spirits to camps to steal tomahawks and may be burned by firelight;
    tree-growing fungi are described as ghost food that can lead to a child being
    spirited away if touched; an incomplete note begins an explanation of the spur-winged
    plover''s spur.'
