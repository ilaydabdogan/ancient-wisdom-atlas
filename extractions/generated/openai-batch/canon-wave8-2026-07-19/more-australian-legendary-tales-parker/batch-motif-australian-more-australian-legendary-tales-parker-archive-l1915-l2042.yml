canonical_text:
  quote: ''
  summary: The passage first describes a spirit condemning Tirlta, pinning him with
    a spear, and the later transformation of the man and spear into stone beside a
    red flower called the Flower of Blood. It then tells how Piggiebillah, an old
    porcupine who kills and eats young men, is punished by the Daens, who spear and
    cripple him. He shelters in the underground home of Murgah Muggui the spider;
    the spears remain in his back and his kind thereafter go on all fours and retreat
    underground. The Guineeboo mourn him, cutting their heads until blood reddens
    their breasts. The final section begins a tale in which a young duck ignores warnings
    about Mulloka the water devil, is seized by Biggoon the water rat, is kept as
    a captive wife, deceives him by pretending contentment, and escapes while he sleeps.
  language: English
  quote_policy: summarized
