canonical_text:
  quote: ''
  summary: 'The passage first explains present pelican fishing behavior and the pouch-bill
    as derived from Goolayyahlee’s net. It then begins the tale of Mungoongarlee the
    Iguana and Ouyouboolooey the Black Snake: in an earlier age animals were larger,
    iguana bite was poisonous, and Mungoongarlee killed and ate many Daens. Animal
    tribes meet at a water-place to stop the slaughter. Ouyouboolooey vows to save
    the Daens and to obtain Mungoongarlee’s hidden poison bag without fighting. He
    plans to use cunning, follows Mungoongarlee after a killing and feast, and enters
    the camp while Mungoongarlee sleeps, but the passage cuts off before the outcome.'
  language: English
  quote_policy: summarized
