canonical_text:
  quote: ''
  summary: 'Wahn the crow pursues and coerces Mungghee wurraywurraymul into promising
    that her tribe will bring Mungghee, mussels or fish in paired shells, to his creeks.
    Later Wahn finds mussels in the creek mud and sees sea-gulls planting more of
    them under the water. Creek-born mussels alter the newcomers’ way of living, and
    the Daens cook and eat mussels while crediting Wahn and the mussel-bringer. The
    passage then begins another episode: after two Meamei are translated to the sky,
    Wurrunnah travels alone and encounters Earmoonan, a composite dog-like creature,
    whom he questions about Byamee.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wahn, identified as the crow, pursues Mungghee wurraywurraymul up the creek,
    seizes her near a big waterhole, and demands more of the fish in two shells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mungghee wurraywurraymul says she has no more and that the creatures belong
    to a distant country passed during her flight from the big salt water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wahn holds Mungghee wurraywurraymul tightly, threatens to kill her, and releases
    her after she promises that her tribe will help bring Mungghee to his creeks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After days and months, Wahn finds many shell-creatures in the creek mud, cracks
    one open against a tree root, eats the fish, and assumes Mungghee wurraywurraymul
    returned unseen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wahn sees a flock of Mungghee wurraywurraymul’s tribe place Mungghee in the
    mud just under the water along the creek and then fly back toward the sea-coast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The newly placed Mungghee come out of the water, open their shells, make a
    low piteous muffled sound, move along the mud, and cry for Mungghee wurraywurraymul
    to take them back to their own country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mungghee born in the creek are stronger and more numerous than the newcomers
    and teach them to live as one fish in two joined-together shells; the narrator
    says all mussels have been so ever since.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Daens cook mussels in hot ashes of their fires, eat them with relish,
    and say Wahn caused this food to be given by Mungghee wurraywurraymul, the mussel-bringer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After two Meamei are translated to the sky from Wurrunnah’s camp and he fails
    to recover them, Wurrunnah journeys alone through named places to Nindeegoolee.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wurrunnah sees a strange creature with the body and head of a dog, feet of
    a woman, and a short tail; it bounds in the air and makes whirring and whizzing
    sounds with its lips.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Wurrunnah identifies the creature as Earmoonan, asks where its old master
    is and whether he has gone away, and receives only spluttering, whizzing noises
    in reply.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
