candidate_motifs:
- id: motif:1
  label: afterlife journey with mapped destinations
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage names Bullimah as the desired spirit destination, Eleanbah Wondah
    as the abode of the wicked, and Oobi Oobi as the sacred mountain for which grave
    goods are supplied.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage gives ritual references to destinations rather than a narrated
    journey undertaken by Eerin.
- id: motif:2
  label: post-mortem admission based on divine laws
  taxonomy_refs:
  - divine_judgment
  basis: The old wirreenun warns that failure to keep Byamee’s laws can lead to exclusion
    from Bullimah, and the later prayer asks Byamee to admit Eerin because he was
    faithful to those laws.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  cautions: No formal judgment scene or trial is narrated; the judgment-like element
    is inferred from admission, exclusion, and moral qualification.
- id: motif:3
  label: grave goods for the dead person’s journey
  taxonomy_refs:
  - afterlife_journey_map
  basis: Rugs, weapons, and food are placed in the grave because they will be wanted
    on the journey to the sacred mountain Oobi Oobi.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not describe how the goods are used after burial.
- id: motif:4
  label: blood offering to the dead spirit
  taxonomy_refs:
  - sacrifice
  basis: The dirge says an offering should be poured to Eerin’s spirit, after which
    mourners cut themselves and let blood drop into the grave.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: This is a self-cutting funerary blood offering, not a killing of another
    being.
- id: motif:5
  label: protective smoke against spirits
  taxonomy_refs: []
  basis: Dense smoke made from Budta twigs is explicitly said to keep the people free
    from unseen spirits, and smoke recurs in the widow’s mourning and camp rites.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The protective purpose is explicit for the first smoke rite; later smoke
    rites are described but not fully explained in the passage.
- id: motif:6
  label: divination by tracks at the grave
  taxonomy_refs: []
  basis: A cleared space is swept around the grave so that morning tracks will identify
    the source of Eerin’s death, with iguana and emu tracks linked to named parties.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives the sign system but does not narrate the next morning’s
    result.
- id: motif:7
  label: mourning silence lifted by fire-water-smoke rite
  taxonomy_refs: []
  basis: The widow must keep silence except for death wails until a ritual involving
    fire, a smoking bush, river water, smoky water, smoke, and a response from Eerin’s
    spirit permits her to speak.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage describes the actions but does not explain all ritual meanings.
