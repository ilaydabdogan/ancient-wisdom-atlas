canonical_text:
  quote: ''
  summary: 'The passage describes the funeral rites for Eerin: speeches about Byamee’s
    laws and the fate of spirits, placement of goods in the grave for a journey to
    a sacred mountain, guarding and closing the grave, dirges, blood offerings, smoke
    rites against spirits, tabooing the old camp, prayers for Eerin’s admission to
    Bullimah, divination by tracks near the grave, and later mourning and speech-restoration
    rites for Eerin’s widow involving fire, smoke, river water, and the husband’s
    spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old wirreenun tells the people that all will eventually be as Eerin is,
    and urges obedience to Byamee’s laws so their spirits may remain in Bullimah rather
    than be sent to Eleanbah Wondah.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Twigs are thrown on the coffin, and the dead person’s rugs, weapons, and food
    are placed in the grave for a journey to the sacred mountain Oobi Oobi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The oldest male relative stands in the grave to guard the body from the Wondah
    until earth covers it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wirreenuns sing dirges recalling former activities with Eerin and stating
    that Eerin will no longer fish, hunt, warn the group, or eat with them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mourners cut themselves with stone knives and comeboos, letting blood
    drop into the grave as an offering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the grave is filled, the people stand in dense smoke made by the wirreenuns
    from Budta twigs to protect them from unseen hovering spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The women go to a new camp because the old camp has become gummarl, a place
    of death, marked by a taboo tree.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Children and women with children unable to walk are not allowed to attend
    the funeral.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men stand around the grave, with the oldest wirreenun at the head facing east,
    and the wirreenun prays to Byamee to let Eerin’s spirit into Bullimah and save
    him from Eleanbah Wondah.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The men cover the grave with dheal-tree boughs and sweep a clear space around
    it so that tracks found there in the morning may identify the source of Eerin’s
    death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The widow covers herself with mud, daubs her head and face white, and sleeps
    beside smouldering smoke.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Three days later, the Daens make a fire by the river and chase the widow and
    her sisters to it; the widow carries a smoking bush into the water, drinks smoky
    water, stands in smoke, calls toward camp and the grave, and is told that Eerin’s
    spirit has answered so she may speak again.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: After the widow returns to camp, a large smoke is made and the whole camp
    is smoked; the widow continues making smoke whenever a stranger comes until her
    husband’s nearest kin can claim her.
  category: sequence
  evidence_refs:
  - ev:12
