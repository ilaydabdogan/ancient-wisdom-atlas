canonical_text:
  quote: ''
  summary: The passage closes one tale with explanations for animal colors, behaviors,
    a star, nests, and blackened iron-bark trees after a spreading fire. It then tells
    how Bohrah the kangaroo and Dinewan the emu travel in darkness; Bohrah sends his
    dream spirit to roll the darkness west, establishing kangaroo night-feeding and
    emu sleep habits. The next tale begins with Durroon the night heron using an underwater
    hollow log as a fish and man trap, killing and cooking visitors until a crow wirreenun
    resolves to investigate.
  language: English
