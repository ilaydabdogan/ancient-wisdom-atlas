canonical_text:
  quote: ''
  summary: Wayambeh the turtle and Gougourgahgah the laughing jackass quarrel over
    where Wayambeh should lay her eggs. Wayambeh returns to her creek people and refuses
    to come back. Gougourgahgah avoids speaking to his mother-in-law because of tribal
    law, then kills Ouyouboolooey the black snake when the snake threatens Wonga the
    pigeon. Gougourgahgah laughs, causing Wayambeh to flee farther away. She later
    lays and covers her eggs in sand beside the creek, and Woggoon the brush turkey
    observes the method and considers trying it.
  language: English
  quote_policy: summarized
