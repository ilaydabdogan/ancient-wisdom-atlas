canonical_text:
  quote: ''
  summary: The passage describes mourning for Eerin, repeated nocturnal warnings by
    a little grey owl that protects Eerin's old tribe from enemies and an evil spirit,
    and the explanation that Eerin's spirit lives in the owl. It then recounts Ngroondoorie
    as lawgiver to southern South Australian tribes, his pursuit and drowning of two
    runaway wives by commanding water to rise, the transformation of their bodies
    into rocks, his creation of landmarks on Nar-oong-owie, and his departure to a
    sky home to which law-keeping spirits may later go.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Eerin's death, strangers arriving at the camp prompted a morning dirge
    in which men joined in turn, moved into a smaller circle, sat, rocked, cried,
    and wailed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After mourning ended, enemies attacked more than once, and the people were
    saved by hearing the cry "Mil! Mil! Mil!"
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: An enemy died, carried hatred to another world, and returned as a spirit to
    attack the camp, but the warning cry again saved the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The warning cry was discovered to come from a little grey owl with black rings
    around its eyes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wundah, described as an evil spirit, asked the owl not to warn the camp
    and offered the owl a share in a feast of a tribesperson's flesh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Although the owl promised silence, it cried "Mil! Mil! Mil!" in a sleeper's
    ear just as the wundah was about to strike with a boondee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The owl said it would always warn the tribe, as when it had been Eerin the
    man, because the tribe had freely spilled the blood offering.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The owl said it would rest by day and roam by night around the camps to guard
    the people by its cry when danger threatened.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narration states that Eerin the light sleeper's spirit is in the little
    grey owl, also called Eerin, which warns its old tribe at night.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ngroondoorie is described as the giver of laws, customs, and religion to southern
    South Australian tribes and as one who became to them as a God.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ngroondoorie promised that law-following people, after death, would have their
    spirits follow his footsteps over Nar-oong-owie and then be translated to his
    sky home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ngroondoorie's two wives ran away, and he pursued them across named places
    toward the channel between the mainland and Nar-oong-owie.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Angered at the wives, Ngroondoorie ordered the water to rise and drown them;
    a tidal wave carried them back toward the mainland and drowned them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The drowned wives' bodies were turned into rocks called Rine-jool-ang, also
    known to white people as the Pages or Two Sisters.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the drowning, Ngroondoorie walked into the water, dived toward the island,
    and left a black patch where he emerged.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: On the island, Ngroondoorie made a she-oak tree spring from the earth for
    shade, but he heard the wailing voices of his drowning wives through its top.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Ngroondoorie threw his spear into the sea, and a reef of rocks appeared from
    the island to the place where the spear fell.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Ngroondoorie threw away his other weapons and departed to his sky home, where
    those keeping his laws are said someday to join him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: The passage says that anyone trying to sleep under a she-oak tree will hear
