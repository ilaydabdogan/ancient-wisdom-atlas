canonical_text:
  quote: ''
  summary: Purleemil fears for her child, the Little Chief, despite earlier spirit
    assurances that he will live forever on the plains. Enemies led by Tirlta attack
    the sleeping camp at night, killing Wimbakobolo, the Little Chief, Purleemil,
    and the sheltering tribe. Later Tirlta's people return, fear the spirits, find
    the lake turned to salt, and Tirlta sees red flowers where bones should be before
    a spear descends from the sky and an unseen voice condemns him for murdering women
    and children on a blood-made sacred place.
  language: English
  quote_policy: summarized
