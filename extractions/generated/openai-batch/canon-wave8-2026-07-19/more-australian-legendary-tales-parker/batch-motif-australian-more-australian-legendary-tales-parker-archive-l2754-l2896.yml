canonical_text:
  quote: "“Cunning I brought with me, and cunning has done it.”"
  summary: Ouyouboolooey tricks Mungoongarlee into handing over his hidden poison
    bag by pretending to reveal a plot against him. After taking the bag, Ouyouboolooey
    declares that gaining it was the real plan, refuses to let the tribes destroy
    it, and keeps it. The passage explains that snakes have been poisonous since then,
    while iguanas are protected by an antidote plant known to their tribe.
  language: English
  quote_policy: quoted
