  summary: Introductory commentary discusses Australian religious and mythological
    traditions concerning Byamee, Pirnmeheal, Durumulun, and Eerin. It argues against
    ancestor worship as the origin of religion in this context, describes deities
    who do not receive food or sacrifice, mentions Byamee receiving Eerin's soul and
    Eerin's spirit dwelling in a grey owl, and distinguishes solemn religious treatment
    of divine figures from humorous or explanatory mythological stories about them.
  language: English
  quote_policy: summarized
