canonical_text:
  quote: ''
  summary: 'The passage reports several beliefs and anecdotes: a dead spear-carrier
    becomes a plover whose wing spurs retain fatal power; red sunsets and yellow winter
    moons are read as signs involving wattle gum, frost, Bahloo, Meamei, and fire;
    trees in unusual places are explained as wrongly married fugitives transformed
    by wirreenuns; a rejected suitor steals a woman’s hair to have it burned by wizards;
    wirreenuns revive a child by restoring its breath and removing sickness; a ghost
    named Marmbeyah causes heat-apoplexy deaths until killed; an old woman calls spirits
    and avoids hot liquids to preserve that power; and Beemunny’s death is linked
    with rain after drought.'
  language: English
  quote_policy: summarized
