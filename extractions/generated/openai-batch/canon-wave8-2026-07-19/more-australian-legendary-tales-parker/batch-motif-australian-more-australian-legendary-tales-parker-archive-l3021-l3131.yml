canonical_text:
  quote: ''
  summary: 'The passage first concludes a Woggoon episode in which mound incubation
    succeeds and becomes the tribe''s adopted custom. It then tells an origin account
    for frost: the Meamei, identified as the Pleiades, once lived on earth as seven
    icicle-bodied sisters; after two are stolen and later translated to the sky, their
    suitors, the Berai-Berai, die of grief and are also placed in the sky as Orion''s
    Sword and Belt. The Meamei periodically throw down ice, which the Daens recognize
    as frost and as a sign of remembrance.'
  language: English
  quote_policy: summarized
