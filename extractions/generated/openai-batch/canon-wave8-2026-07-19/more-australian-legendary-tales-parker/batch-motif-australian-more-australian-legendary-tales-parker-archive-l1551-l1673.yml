canonical_text:
  quote: ''
  summary: The passage first describes birds whose human-like dance recalls the lost
    Bralgah; later Bralgah and Bralgah Numbardee are associated with the Clouds of
    Magellan, and Wurrawilberoo is said to have changed the daughter into a dancing
    bird. The passage then tells how, before there was a sun, Bralgah the native companion
    threw one of Dinewan the emu's eggs into the sky, where it broke on firewood and
    made a blaze. A good sky spirit and attendants thereafter make a daily sky fire,
    send the morning star as warning, and appoint Gougourgahgah the laughing jackass
    to laugh at dawn. Children are forbidden to imitate the bird's laugh, and darkness
    is said to return if the Gougourgahgahs cease heralding the sun.
  language: English
  quote_policy: summarized
