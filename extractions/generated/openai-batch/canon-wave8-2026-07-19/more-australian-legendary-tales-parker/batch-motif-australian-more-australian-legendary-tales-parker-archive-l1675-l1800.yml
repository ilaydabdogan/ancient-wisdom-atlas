canonical_text:
  quote: ''
  summary: Wimbakobolo flees with Purleemil, the promised bride of Tirlta, and seeks
    refuge with a back-country tribe connected to his father. The river tribe pursues
    and demands their return, but the host elders refuse after Wimbakobolo appeals
    to his ancestry and challenges Tirlta to fight. Tirlta does not answer the challenge.
    Wimbakobolo and Purleemil live peacefully, have a son called the Little Chief,
    and later Purleemil reports spirit warnings of impending misfortune if the tribe
    leaves the winter camp.
  language: English
  quote_policy: summarized
