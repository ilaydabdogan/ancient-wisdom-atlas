canonical_text:
  quote: ''
  summary: 'A woman gives an ancestral grunting magical stone to a wirreenun in exchange
    for changing her daughters so they cannot be eaten; he changes them into stone
    frogs. A later legend begins: after Byamee leaves earth for Bullimah beyond Gobi
    Gobi mountain, flowers and most bees disappear. People obey the prohibition against
    touching Byamee’s three branded bee-trees, and Byamee sends sweet manna in drought.
    Wirreenuns then journey toward Byamee to ask for the earth’s flowers to be restored
    and begin climbing a stone-stepped mountain path.'
  language: English
  quote_policy: summarized
