canonical_text:
  quote: ''
  summary: Wirreenuns climb a sacred mountain, drink from an invigorating spring,
    enter a stone circle, and hear Wallahgooroonbooan, the spirit messenger of Byamee.
    They ask for the return of flowers to a dreary earth. Attendant spirits lift them
    through an opening in the sky to Bullimah, where they gather fadeless flowers.
    A promise is delivered that flowers will never again be wholly absent, with rain,
    winds, honey, and manna appearing in seasonal alternation. The wirreenuns return
    to their people, scatter the flowers, and the passage explains the place-name
    Ghirraween and the roles of bees, the east wind, black ants, and grey birds in
    rain, blossoms, honey, and manna.
  language: English
  quote_policy: summarized
