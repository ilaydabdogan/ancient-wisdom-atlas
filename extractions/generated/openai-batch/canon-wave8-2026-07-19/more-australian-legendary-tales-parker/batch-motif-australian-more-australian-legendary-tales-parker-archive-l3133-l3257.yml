canonical_text:
  quote: ''
  summary: The passage first describes children having their septums numbed with ice,
    pierced, and fitted with straw or bone so that they may sing as the Meamei sing.
    It then explains a laughing star, identified as Venus, as a relation of the Meamei
    who laughed when two sisters escaped Wurrunnah and were translated to the sky.
    Winter thunder and coming rain are explained as the Meamei bathing and playing
    Bubahlarmay. The main tale recounts Butha, promised to Murree, being killed by
    the giant snake Bubburr after taking eggs from its nest; Murree vows revenge before
    trying to follow her toward Weebulloo, the heaven of women. Murree and the Daens
    use tree platforms and Mubboo gum to seal the snakes' jaws, kill them, cook them,
    and explain why Bubburrs have since been scarce.
  language: English
  quote_policy: summarized
