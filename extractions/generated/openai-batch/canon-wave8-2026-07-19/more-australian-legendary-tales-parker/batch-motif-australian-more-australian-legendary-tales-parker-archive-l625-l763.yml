canonical_text:
  quote: ''
  summary: The passage first tells how a crane strikes a crow with a fish, causing
    the crow’s present colouring, and how the crow later retaliates by lodging a fish-bone
    in the crane’s throat, causing the crane’s call and name. It then begins a tale
    in which Beereeun the lizard claims the Bullai Bullai green parrot sisters as
    pledged wives; they prefer Weedah the mocking-bird, who plans an escape involving
    burning their tracks and crossing a river. During the flight the sisters become
    thirsty and repeatedly see apparent water that vanishes before they can reach
    it.
  language: English
  quote_policy: summarized
