canonical_text:
  quote: ''
  summary: The Daens send spirit-animated whirlwinds after the Wurrawilberoo, who
    return to the camp and abduct young Bralgah and her mother. The mother is dropped,
    but one captor holds young Bralgah until he releases her after muttering an incantation.
    The whirlwinds uproot two balah trees with the Wurrawilberoo clinging to them
    and plant them in the sky near the Milky Way, where the Wurrawilberoo become feared
    dark spots. When the Daens search, young Bralgah is missing; they see only a tall
    crane-like bird and its tracks, mourn her as dead, fear her unburied spirit, and
    move camp.
  language: English
  quote_policy: summarized
