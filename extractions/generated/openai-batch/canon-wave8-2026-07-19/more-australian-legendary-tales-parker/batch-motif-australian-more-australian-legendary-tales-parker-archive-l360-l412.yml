canonical_text:
  quote: ''
  summary: 'The passage gives preface notes and additions to several legends: a spring
    beneath Mullyan''s tree-camp is said to yield bones of his victims; the galah''s
    colouring is explained by blood and dust after Oolah wounded her; a halo around
    the moon is read as Bahloo''s rain-sign shelter; Bibbee''s rainbow is guarded
    by snakes; some legends are described as sacred and taboo to children; the Sacred
    Island legend''s transmission is described; and Dinewan the Emu''s burned wings
    and singed feather appearance are explained by hot coals thrown by his crow wives.'
  language: English
  quote_policy: summarized
