canonical_text:
  quote: ''
  summary: 'The passage first concludes an episode in which Bilber hides from Mayrah
    the wind by digging into a sandhill, after which Bilber and the Bilber tribe live
    in sand burrows while the wind remains heard but unseen. It then begins the story
    of Bralgah the Dancing Bird: Bralgah Numbardee and her daughter Bralgah are warned
    about the Wurrawilberoo, two cannibals; they are captured, but the mother feigns
    death and the daughter delays the captors by discarding their stone knife, allowing
    both to flee back to their tribe.'
  language: English
  quote_policy: summarized
