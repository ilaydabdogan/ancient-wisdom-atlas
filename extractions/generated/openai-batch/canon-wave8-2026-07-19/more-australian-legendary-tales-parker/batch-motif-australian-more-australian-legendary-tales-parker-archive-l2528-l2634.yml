canonical_text:
  quote: ''
  summary: The passage first gives the end of a story in which a little lizard is
    named Walloobahl because it is taken to be the spirit of a killed boy. It then
    tells of Goolayyahlee the Pelican, a great wirreenun, who is the first seen with
    a fishing net. His children discover that he produces and stores the net inside
    himself. He later teaches people to make nets from bark fibre, after which the
    tribes make fishing nets.
  language: English
  quote_policy: summarized
