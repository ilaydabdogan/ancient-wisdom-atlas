canonical_text:
  quote: ''
  summary: The passage first reports a Daen saying about drought and the return of
    blossoms. It then narrates how wirreenuns seek a flood through Byamee, Birrahgnooloo,
    and messengers; the Bungun Bungun break and purify a rolling blood ball with hot
    stones, turning it into flood water while their cries warn camps to move. The
    final section begins the story of Eerin, a light-sleeping Daen who warns the camp
    of enemies, dies, and is mourned and buried with ochre, chants, and dheal twigs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Daens describe a drought in which flowers and grass-seed are scarce, followed
    by the departure of goonbean and wahlerh and the return of flowers and bees.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Byamee ceases to stay on earth and returns from Bullimah by way of stone steps
    to the summit of Oobi Oobi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Only wirreenuns are allowed to have intercourse with Byamee, and this is through
    Wallahgooroonbooan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Byamee and Birrahgnooloo are fixed to a crystal rock in Bullimah, with the
    lower parts of their bodies merged into the rock.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wallahgooroonbooan, Baillahburrah, and Cunnumbeillee alone are allowed to
    approach Byamee and Birrahgnooloo and pass on commands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birrahgnooloo is identified as the flood maker.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When creeks are drying, wirreenuns climb Oobi Oobi and wait in a stone circle
    for Wallahgooroonbooan to convey their wish for a flood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If Birrahgnooloo is willing to help, she sends Cunnumbeillee to tell the wirreenuns
    to warn the Bungun Bungun that a blood ball will soon be sent rolling.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bungun Bungun station themselves along both banks of a dry river, make
    fires, and heat large stones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A blood-red ball rolls into the river entrance; the Bungun Bungun throw hot
    stones at it and smash it, causing a stream of blood to gush out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: As the stream flows, the Bungun Bungun keep throwing hot stones and crying
    aloud; the blood is purified and changes into flood water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cries of the Bungun Bungun warn tribes to move their camps to high ground
    before the flood water reaches them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Daens say that the present-day crying of the Bungun Bungun, or flood-frogs,
    announces that flood water is coming or has arrived.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Daens explain red and thick flood water as water that the Bungun Bungun
    allowed to pass without purifying it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Eerin is a very light sleeper who cries out to warn his camp when an enemy
    approaches at night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After Eerin dies, the Daens grieve because they believe no one else can hear
