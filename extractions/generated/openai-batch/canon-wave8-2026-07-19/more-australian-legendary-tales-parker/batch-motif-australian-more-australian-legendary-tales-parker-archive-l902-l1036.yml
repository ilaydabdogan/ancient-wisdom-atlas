canonical_text:
  quote: ''
  summary: The Bullai Bullai reach a river and find Beereeun in the canoe. Beereeun
    reveals that he made mirages to lure them and says he stole Weedah’s doowee, leaving
    him deaf or changed. Beereeun spears Weedah, who dies and is identified as a new
    star, Womba. The Bullai Bullai mourn as widows, overhear Beereeun and Goolayyahlee
    planning to seize them, call on their dead kin, and escape into the sky. Beereeun
    makes a chain of spears reaching upward, climbs to the sky, and continues pursuing
    them.
  language: English
  quote_policy: summarized
