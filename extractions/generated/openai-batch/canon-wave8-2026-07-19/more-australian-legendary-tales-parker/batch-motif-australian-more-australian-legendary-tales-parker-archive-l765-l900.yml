canonical_text:
  quote: ''
  summary: In a dry landscape, Weedah urges the Bullai Bullai onward despite repeated
    disappointments over supposed water. The Bullai Bullai beat him, then sing a remembered
    rain song to Dooloomai the Thunder. A thundercloud arrives, rain fills gilguy
    holes, and the travelers drink. The next day they again see a false appearance
    of water, reach the Big River, and meet Goolayyahlee the pelican with his canoe.
    After ferrying Weedah across, Goolayyahlee tries to keep the Bullai Bullai with
    him, but they throw white ashes at him until he is covered and his sight is obscured.
  language: English
  quote_policy: summarized
