canonical_text:
  quote: ''
  summary: The passage condemns Israelites who leave sons uncircumcised and forsake
    the covenant, then narrates angelic visitation to Abraham at the oak of Mamre,
    the promise and naming of Isaac, Sarah’s laughter and fear, the divine destruction
    of Sodom and neighboring places by fire and brimstone, Lot’s rescue because God
    remembered Abraham, the later sin of Lot with his daughters, a heavenly decree
    against Lot’s seed, and Abraham’s movements toward Gerar and the Well of the Oath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group called sons of Beliar is said to leave their sons uncircumcised as
    they were born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord’s great wrath is directed against the children of Israel because
    they have forsaken His covenant, turned aside from His word, and failed to observe
    the ordinance of the law.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Angelic speakers appear to Abraham at the oak of Mamre on the new moon of
    the fourth month, talk with him, and announce that Sarah will have a son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sarah hears the announcement, laughs, is admonished, becomes afraid, and denies
    having laughed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The angelic speakers tell Sarah the child’s name, Isaac, and state that the
    name is ordained and written in the heavenly tables.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Lord executes judgment on Sodom, Gomorrah, Zeboim, and the region of the
    Jordan by burning and destroying them with fire and brimstone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that God will execute a similar judgment on places that
    do according to the uncleanness of the Sodomites.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lot is saved because God remembered Abraham and sent Lot out from the midst
    of the overthrow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lot and his daughters commit sin on the earth, described as the man lying
    with his daughters.
  category: action
  evidence_refs:
  - ev:7
