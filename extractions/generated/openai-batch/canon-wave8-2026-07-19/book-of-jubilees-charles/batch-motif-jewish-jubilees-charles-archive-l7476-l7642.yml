canonical_text:
  quote: ''
  summary: The passage reports Adam's death and burial in the land of his creation,
    explains his death before one thousand years by the warning attached to the tree
    of knowledge, narrates Cain's death by stones when his house falls on him as recompense
    for killing Abel with a stone, states a heavenly-table ordinance of corresponding
    punishment, and records Noah's marriage to Emzara and the births of Shem, Ham,
    and Japheth.
  language: English
  quote_policy: summarized
