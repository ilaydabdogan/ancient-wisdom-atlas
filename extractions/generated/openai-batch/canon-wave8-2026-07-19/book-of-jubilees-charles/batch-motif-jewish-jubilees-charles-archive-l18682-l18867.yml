candidate_motifs:
- id: motif:1
  label: return to ancestral territory after separation
  taxonomy_refs:
  - return
  basis: Jacob sends Laban away, returns to Gilead, crosses the Jabbok and Jordan,
    and settles as a pastoral figure.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage emphasizes itinerary and settlement more than a fully developed
    return-quest structure.
- id: motif:2
  label: reconciled brothers who separate into different territories
  taxonomy_refs:
  - sibling_pair
  basis: Jacob and Esau are named as brothers; Esau comes to Jacob, is reconciled
    with him, and then departs to Seir while Jacob remains in tents.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports reconciliation and separation but does not narrate
    the earlier conflict in this excerpt.
- id: motif:3
  label: filial provision answered by parental blessing
  taxonomy_refs:
  - sacred_exchange
  basis: Jacob repeatedly sends necessary goods to Isaac and Rebecca, and they bless
    him with all their heart and soul.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: medium
  cautions: The exchange is familial and ritualized by timing, but the passage does
    not explicitly call it a cultic exchange.
- id: motif:4
  label: seasonal cycle of repeated gifts
  taxonomy_refs:
  - seasonal_cycle
  - sacred_exchange
  basis: The gifts to Rebecca are sent four times a year between named agricultural
    and rainy-season periods; an editorial note cautiously associates the four times
    with Noah’s four festivals.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The connection to festivals is presented in the note as conjectural, not
    as a statement of the narrative itself.
- id: motif:5
  label: daughter or sister carried off and marriage demanded afterward
  taxonomy_refs: []
  basis: Dinah is carried off to Shechem’s house and defiled; Shechem then asks that
    she be given to him as wife.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The available taxonomy term 'stolen_beloved' was not applied because the
    passage does not present Dinah as a beloved figure.
- id: motif:6
  label: brothers retaliate after sister’s violation
  taxonomy_refs:
  - sibling_pair
  basis: Jacob’s sons are angry over the defilement of Dinah their sister, and Simeon
    and Levi execute judgment on all the men of Shechem.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: Only Simeon and Levi are named in the retaliatory action; the broader
    brother-group is described in the preceding anger and deceit.
comparison_claims:
- id: claim:1
  claim: The notes identify Jacob’s Jabbok crossing in this passage with the nearby
    scriptural account in Genesis 32:22.
  claim_level: same_motif
  target: Genesis xxxii.22 / Jacob crossing the Jabbok
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the supplied editorial note rather than on a detailed
    comparison within the narrative excerpt.
- id: claim:2
  claim: The supplied heading and notes present the Dinah and Shechem episode as corresponding
    to material in Genesis 33-35, especially Genesis 34.
  claim_level: same_motif
  target: Genesis xxxiii.18; xxxiv.2, 4, 7, 13-14, 25-30; xxxv.5 / Dinah and Shechem
    narrative
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supplies references but does not quote the Genesis parallels
    in full.
- id: claim:3
  claim: An editorial note cautiously proposes that Jacob’s four yearly gift-times
    may correspond to the four festivals instituted by Noah earlier in Jubilees.
  claim_level: same_function
  target: Jubilees vi.28 sqq. / four festivals instituted by Noah
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The note explicitly frames the connection as conjectural; the narrative
    itself only gives the four seasonal times.
