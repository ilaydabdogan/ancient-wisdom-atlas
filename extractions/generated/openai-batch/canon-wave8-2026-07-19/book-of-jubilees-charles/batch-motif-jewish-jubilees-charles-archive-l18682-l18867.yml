canonical_text:
  quote: ''
  summary: 'Jacob separates from Laban, returns toward Gilead, crosses the Jabbok,
    and is reconciled with Esau. Jacob settles and pastures flocks, sends regular
    provisions to Isaac and Rebecca at the tower of Abraham, while Esau relocates
    to Mount Seir and leaves Isaac alone. The passage then begins the Dinah and Shechem
    episode: Dinah is taken and violated by Shechem, who seeks marriage; Jacob and
    his sons respond angrily and deceitfully, and Simeon and Levi execute judgment
    on the men of Shechem.'
  language: English
  quote_policy: summarized
