canonical_text:
  quote: "“Discern whose are these, for by him am I with child.”"
  summary: Judah goes to Timnah for sheep-shearing. Tamar removes her widow’s clothing,
    veils and adorns herself, and sits by the road. Judah mistakes her for a harlot,
    gives his ring, necklace, and staff as pledges for a promised kid goat, and she
    conceives by him. When the woman cannot later be found, Judah lets her keep the
    objects. After Tamar’s pregnancy becomes visible, Judah orders that she be burned,
    but she sends the pledges back as proof of the father. Judah acknowledges that
    Tamar is more righteous than he, prevents her burning, does not approach her again,
    and Tamar later bears Perez and Zerah. Judah also acknowledges that his deed was
    evil and that he had transgressed.
  language: English
  quote_policy: quoted
