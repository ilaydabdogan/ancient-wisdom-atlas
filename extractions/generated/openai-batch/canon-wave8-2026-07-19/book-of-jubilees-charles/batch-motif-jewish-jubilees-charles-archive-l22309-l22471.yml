canonical_text:
  quote: ''
  summary: 'The excerpt concludes Joseph’s rise in Egypt: Pharaoh’s kingdom is orderly,
    Joseph receives a new name and a wife, his dream interpretation is fulfilled in
    seven years of plenty, and he stores grain throughout Egypt. It then begins the
    Judah and Tamar episode: Judah gives Tamar to Er, Er and Onan are each described
    as wicked and slain by the Lord, and Tamar is told to remain a widow for Shelah,
    though Bedstoel prevents the marriage.'
  language: English
  quote_policy: summarized
