  quote: ''
  summary: God renames Sarai as Sarah, promises Abraham a son through her, names Isaac
    as the heir of an everlasting covenant, blesses Ishmael with numerous princely
    descendants, and Abraham circumcises himself and every male in his household.
    The passage then states the eighth-day circumcision ordinance as eternal and written
    on the heavenly tables, with exclusion and destruction assigned to those not circumcised
    on the eighth day.
