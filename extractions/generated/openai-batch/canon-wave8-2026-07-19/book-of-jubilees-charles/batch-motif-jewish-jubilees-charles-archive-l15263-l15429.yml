canonical_text:
  quote: ''
  summary: A first-person speaker exhorts his son to obey the living, righteous God,
    avoid idols, abstain from blood, and perform peace- and thank-offerings with specified
    blood, fat, grain, oil, drink-offering, fire, altar, salt, timing, and wood requirements.
    The speaker grounds some rules in ancestral books and in the words of Enoch and
    Noah. Editorial notes compare several ritual instructions with biblical and related
    Second Temple passages.
