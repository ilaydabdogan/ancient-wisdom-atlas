canonical_text:
  quote: ''
  summary: Isaac blesses his sons and their descendants after concern over the birthright
    is resolved. Esau and Jacob eat and drink together before him, and Isaac rejoices
    that they are of one mind. Isaac then dies at the age of one hundred and eighty
    and is buried by Esau and Jacob. Esau goes to Edom in the mountains of Seir, while
    Jacob dwells in the mountains of Hebron and worships the Lord according to visible
    commands. Leah dies and is buried in the double cave near Rebecca and Sarah; Jacob
    and the sons mourn her. The following heading introduces conflict in which Esau’s
    sons reproach him for subordination to Jacob and press him toward war.
  language: English
  quote_policy: summarized
