canonical_text:
  quote: ''
  summary: 'The passage presents an antediluvian genealogy: Nédam marries his sister
    and fathers Kenan; Kenan marries his sister Mfialéléth and fathers Mahalalel;
    Mahalalel marries Dinah from his father’s-brother line and fathers Jared. In Jared’s
    days, the angels of the Lord, called Watchers, descend to earth to instruct the
    children of men. Editorial notes discuss the marriage pattern and connect the
    Watchers passage with interpretations of Genesis 6:1-4 and related traditions.'
  language: English
