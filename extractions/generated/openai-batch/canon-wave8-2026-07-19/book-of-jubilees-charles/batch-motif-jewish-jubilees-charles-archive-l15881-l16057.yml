canonical_text:
  quote: ''
  summary: Abraham warns Jacob against the practices of idol-worshippers, including
    worship of evil spirits, grave-associated eating, and addressing wood and stone
    as divine. He blesses Jacob, warns him not to marry from Canaan, foretells destruction
    and judgment for Canaan’s seed and idol-worshippers, compares their removal to
    Sodom, gives Jacob the house and name of Abraham, and ends with an intimate farewell
    as Jacob sleeps with him and is kissed seven times.
  language: English
  quote_policy: summarized
