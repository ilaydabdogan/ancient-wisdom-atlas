canonical_text:
  quote: ''
  summary: The passage reports accusations against Esau, a statement that Jacob has
    the greater guardian, Rebecca's request that Esau and Jacob love one another and
    bury her near Sarah, Esau's and Jacob's promises of mutual non-harm, Rebecca's
    death and burial in the double cave, and Isaac's later instructions to his two
    sons concerning his burial, righteousness, brotherly love, rejection of idols,
    remembrance of the God of Abraham, and a great oath.
  language: English
