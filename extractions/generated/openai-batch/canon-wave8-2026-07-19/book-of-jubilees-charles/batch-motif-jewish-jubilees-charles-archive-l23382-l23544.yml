canonical_text:
  quote: ''
  summary: The passage recounts Joseph’s peaceful period after Jacob’s death, his
    age and career stages, his deathbed command that Israel swear to carry his bones
    out of Egypt, conflict between Canaan and Egypt that closes Egypt’s gates, Joseph’s
    burial in Egypt, and a later war during which Israel carries the bones of Jacob’s
    other children to burial in the double cave in the mountain near Hebron. Editorial
    notes compare this war-and-burial tradition with related accounts in the Testaments,
    Josephus, Acts, and later legend forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Jacob’s death, Joseph’s remaining lifetime is described as having no
    Satan and no evil, and the Egyptians honored the children of Israel during Joseph’s
    life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Joseph is said to have died at one hundred and ten years old after seventeen
    years in Canaan, ten years as a servant, three years in prison, and eighty years
    ruling Egypt under the king.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before his death, Joseph commanded the children of Israel to carry his bones
    with them when they went out from Egypt and made them swear concerning his bones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated reason for Joseph’s oath is that he knew the Egyptians would not
    again bring him forth and bury him in Canaan.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Makamarén, king of Canaan, fought the king of Egypt in a valley, slew him,
    and pursued the Egyptians to the gates of Ermen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A new and stronger king of Egypt prevented Makamarén from entering; the gates
    of Egypt were closed, and no one went out or came into Egypt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Joseph died in the forty-sixth jubilee and was buried in Egypt; his brethren
    died after him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a later war between Egypt and Canaan, the children of Israel brought out
    the bones of the children of Jacob except Joseph’s bones and buried them in a
    field in the double cave in the mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After this burial, most returned to Egypt, while a few remained in the mountains
    of Hebron.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The editorial note says the war between Egyptians and Canaanites is also referred
    to in the Testaments of Simeon and Benjamin in connection with patriarchal burial
    at Hebron.
  category: other
  evidence_refs:
  - ev:7
