canonical_text:
  quote: ''
  summary: 'Esau comes against Jacob while Jacob is mourning Leah. Men of Hebron warn
    Jacob of the armed approach, and Jacob closes the tower gates, stands on the battlements,
    and rebukes Esau for breaking his oath not to harm him. Esau rejects enduring
    oaths and brotherhood, then describes peace as impossible through animal images:
    a boar changing its nature, wolves making peace with lambs, and a lion becoming
    friend to an ox.'
  language: English
  quote_policy: summarized
