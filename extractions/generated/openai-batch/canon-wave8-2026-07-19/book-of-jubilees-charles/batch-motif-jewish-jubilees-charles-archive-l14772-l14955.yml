canonical_text:
  quote: Abraham loved Jacob, but Isaac loved Esau.
  summary: Abraham contrasts Esau’s fierce hunter-warrior conduct with Jacob’s chosen
    destiny, instructs Rebecca to watch over Jacob, and blesses Jacob and his seed
    with ancestral blessings, divine protection, and a first-born relation to God.
    The passage then opens Abraham’s admonition to his assembled descendants to practice
    righteousness, circumcision, purity, and separation from Canaanite marriage, with
    a fire punishment stated for fornication.
  language: English
  quote_policy: quoted
