canonical_text:
  quote: ''
  summary: Isaac reassures Rebecca about Jacob and blesses him. Jacob travels from
    the Well of the Oath toward Haran, reaches Luz/Bethel on the mountains at evening,
    sleeps alone with a stone at his head under a tree, and dreams of a ladder between
    earth and heaven with angels ascending and descending and the Lord standing upon
    it. The Lord promises land, descendants, blessing for nations through Jacob and
    his seed, divine presence, protection, and return to the land. Jacob awakens,
    identifies the place as the house of God and gate of heaven, sets up the stone
    as a pillar, pours oil on it, names the place Bethel, and vows devotion and a
    tithe if the Lord protects and provides for him. The next chapter begins with
    Jacob going east to Laban and serving for Rachel.
  language: English
  quote_policy: summarized
