canonical_text:
  quote: ''
  summary: The passage narrates a battle in which sons of Jacob pursue and defeat
    Edomites, Horites, and sons of Esau near a tower, a hill at Adftrim, and the mountains
    of Seir. Jacob buries his slain brother and instructs his sons to make peace,
    after which the sons of Esau/Edom are placed under a yoke of servitude and tribute.
    The passage then gives a succession list of kings who reigned in Edom before kings
    reigned over Israel, with editorial notes comparing related traditions and biblical
    parallels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Simeon, Benjamin, and Enoch son of Reuben go out on the west side of a tower
    with fifty men and kill Edomite and Horite warriors; some enemies flee, including
    four sons of Esau, leaving their slain father on a hill in Adftrim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons of Jacob pursue the fugitives to the mountains of Seir, while Jacob
    buries his brother on the hill in Adftrim and returns home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sons of Jacob press the sons of Esau in the mountains of Seir, subdue
    them, ask Jacob whether to make peace or kill them, and then make peace after
    Jacob instructs them to do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sons of Esau/Edom are put under a yoke of servitude and tribute to Jacob
    and his sons, and the passage says this tributary condition continued until Jacob
    went down into Egypt and, in another formulation, until the narrator’s present
    day.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage lists kings who reigned in Edom before a king reigned over the
    children of Israel, including Balaq, Jobab, Asim, Adath, Salman, Saul, Baelinan,
    and another Adath, with associated places and family names.
  category: sequence
  evidence_refs:
  - ev:5
