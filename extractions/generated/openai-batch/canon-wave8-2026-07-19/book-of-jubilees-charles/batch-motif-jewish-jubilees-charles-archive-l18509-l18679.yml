canonical_text:
  quote: ''
  summary: After Rachel bears Joseph, Jacob tells Leah and Rachel that he has seen
    in a dream a command to return to his father’s house. He departs with his wives,
    children, and possessions, crosses the river, and comes to Gilead while concealing
    his intention from Laban. Laban pursues him, but the Lord prevents him from injuring
    Jacob by appearing to him in a dream. Jacob and Laban make a feast and swear that
    neither will cross the mountain of Gilead against the other with evil intent;
    a heap is made as witness. The passage then identifies Gilead as formerly the
    land of the Rephaim, describes the Rephaim as giants, lists their habitations
    and royal seats, and says the Lord destroyed them because of their evil deeds.
  language: English
  quote_policy: summarized
