canonical_text:
  quote: ''
  summary: Abram offers sacrificial pieces, birds, fruit-offerings, and drink-offerings,
    and fire consumes them. A covenant is made with Abram, likened to the covenant
    with Noah, and Abram renews a festival ordinance. Abram tells Sarai of his hope
    for seed; Sarai, who has not borne, gives Hagar her Egyptian maid to Abram as
    wife. Hagar conceives and bears Ishmael, whom Abram names. The next chapter opening
    places Abram’s celebration of the first-fruits of grain in the third month.
  language: English
