canonical_text:
  quote: ''
  summary: The introduction describes Jubilees as drawing on written traditions and
    legends also preserved in other Jewish works, lists numerous legendary incidents
    and names, and characterizes the book as an extreme midrashic rewriting tendency
    comparable to the Old Testament Chronicler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the author used current traditions and legends already reduced
    to writing and preserved independently in Hebrew and Greek works.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The war of Jacob and his sons against Amorite kings is said to appear in Jubilees
    and in other named works.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author is said to have drawn on existing writings for a fratricidal war
    between Jacob and Esau.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists incidents also attested in the Testaments of the XII Patriarchs,
    including Reuben’s dishonour of Bilhah, Levi’s dream about priesthood, Levi’s
    consecration by Isaac, Judah-related narratives, and burial of Jacob’s sons in
    Hebron during war.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says other legendary matter supplies many proper names, especially
    women’s names, fathers of wives, kings, and place names including mountains, islands,
    towns, rivers, and seas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage lists legendary incidents about Adam naming creatures, a common
    animal language before the Fall, Adam’s burial, Cain’s death, Kainam’s discovery
    of Watcher writings, and Babel’s destruction by a mighty wind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage lists Abraham traditions including early exploits, a campaign
    against idolatry, burning of a heathen temple, Haran’s death, astronomical knowledge,
    and miraculous acquisition of Hebrew.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage lists family and lineage incidents including Zilpah and Bilhah
    being sisters, Zebulon and Dinah being twins, Dinah’s rape, Jacob’s gifts to his
    parents, Isaac’s blessing of Levi and Judah, and Levi’s appointment to priesthood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage lists Exodus-related incidents including famine from Nile failure,
    Hebrew children cast into a river, burning of Egyptian gods, and destruction of
    Egyptians in the Red Sea in numerical correspondence to Hebrew children killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage characterizes Jubilees as an extreme product of a midrashic process
    also apparent in the Chronicler, involving rewriting earlier Israelite history
    with an object.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says the Chronicler omits or transforms facts that do not fit
    presuppositions, including attributing David’s temptation to Satan rather than
    Yahweh.
  category: relationship
  evidence_refs:
  - ev:11
