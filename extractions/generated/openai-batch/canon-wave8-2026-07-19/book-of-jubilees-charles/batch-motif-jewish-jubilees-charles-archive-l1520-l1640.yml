candidate_motifs:
- id: motif:1
  label: fraternal war between brothers
  taxonomy_refs:
  - sibling_pair
  basis: The passage explicitly calls the Jacob-Esau conflict a fratricidal war.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only the introductory summary is present; the narrative details of the
    war are not included in this passage.
- id: motif:2
  label: priestly election through dream, blessing, and consecration
  taxonomy_refs:
  - initiation
  basis: Levi is associated with a dream concerning priesthood, consecration by Isaac,
    blessing, and appointment to priesthood.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The passage summarizes several references rather than narrating the rite
    itself.
- id: motif:3
  label: special writings and miraculous knowledge
  taxonomy_refs:
  - wisdom
  basis: Kainam discovers writings of the Watchers, while Abraham has astronomical
    knowledge and miraculously acquires Hebrew.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly describe the knowledge as forbidden or
    salvific; the taxonomy link is limited to wisdom or special knowledge.
- id: motif:4
  label: destruction of a hubristic tower by wind
  taxonomy_refs: []
  basis: The passage notes a detailed account of the tower of Babel and its destruction
    by a mighty wind.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not state the theological meaning of the destruction,
    only the destructive agent.
- id: motif:5
  label: iconoclastic burning of idolatrous objects or places
  taxonomy_refs: []
  basis: Abraham’s campaign against idolatry includes burning a heathen temple, and
    the passage also mentions burning Egyptian gods.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The two burnings are listed separately; the passage does not explicitly
    connect them as a single motif family.
- id: motif:6
  label: retaliatory watery destruction for children cast into a river
  taxonomy_refs:
  - divine_judgment
  basis: The destruction of 1000 Egyptians in the Red Sea is stated for every Hebrew
    child cast into the river.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage implies correspondence between crimes and destruction, but
    it does not explicitly call the Red Sea event divine judgment in this excerpt.
- id: motif:7
  label: twin siblings in patriarchal genealogy
  taxonomy_refs:
  - sibling_pair
  basis: Zebulon and Dinah are identified as twins.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives only the fact of twinning; it does not describe a sacred
    or oppositional twin pattern.
- id: motif:8
  label: rewriting inherited sacred history to fit legal-theological presuppositions
  taxonomy_refs: []
  basis: The passage describes Jubilees and the Chronicler as recasting earlier history
    and omitting or transforming facts that do not fit presuppositions.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a literary-compositional pattern rather than a narrative mythic
    motif.
comparison_claims:
- id: claim:1
  claim: The war of Jacob and his sons against the Amorite kings in Jubilees is presented
    as the same incident found in Test. Judah, Midrash Wajjissau, and the Book of
    Jashar.
  claim_level: same_motif
  target: Test. Judah 3-7; Midrash Wajjissau; Book of Jashar
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a scholarly introduction and does not provide the parallel
    texts themselves.
- id: claim:2
  claim: The fratricidal war between Jacob and Esau in Jubilees is linked with parallel
    material in Test. Judah, Jalkut Shimeoni, and Chronicles of Jerahmeel.
  claim_level: same_motif
  target: Test. Jud. 9; Jalkut Shimeoni i.132; Chronicles of Jerahmeel
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage notes reservations and does not reproduce the variants.
- id: claim:3
  claim: Several Jubilees incidents involving Reuben, Bilhah, Levi, Judah, Tamar,
    Er, Onan, and the burial of Jacob’s sons are presented as attested also in the
    Testaments of the XII Patriarchs.
  claim_level: same_motif
  target: Testaments of the XII Patriarchs
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage lists correspondences but does not compare narrative wording
    or sequence in detail.
- id: claim:4
  claim: Jubilees is compared functionally with the Old Testament Chronicler as a
    work that recasts earlier Israelite history according to theological and legal
    aims.
  claim_level: same_function
  target: Old Testament Chronicler
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The claim concerns compositional method, not a specific mythic episode.
- id: claim:5
  claim: The passage supports a cautious claim that Jubilees uses existing written
