canonical_text:
  quote: ''
  summary: The passage concludes a rule for Israel about avoiding hallowed things
    and the sanctuary until childbirth purification days are completed. It then narrates
    Adam and his wife in Eden for seven years, Adam’s tilling and guarding of the
    garden, the serpent’s approach to the woman, the dialogue about the tree in the
    middle of the garden, the eating of its fruit, the opening of Adam’s eyes, the
    covering of nakedness with fig leaves, and God’s curse or wrath against the serpent
    and woman.
  language: English
