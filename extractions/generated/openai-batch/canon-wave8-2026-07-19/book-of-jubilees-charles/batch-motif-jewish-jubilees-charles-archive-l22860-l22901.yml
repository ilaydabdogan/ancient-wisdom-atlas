  summary: After a search through the brothers' vessels, the cup is found in Benjamin's
    sack. The brothers tear their garments, return to Joseph's house, and bow before
    him. Joseph accuses them of evil and says Benjamin must remain as his servant.
    Judah pleads that the father’s life is bound up with the lad, warns that the father
    will die if the lad does not return, and offers himself as bondsman instead.
