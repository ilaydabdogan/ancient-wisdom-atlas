canonical_text:
  quote: ''
  summary: Abraham blesses God and Jacob, praying for divine grace, preservation,
    sanctification, and renewed covenant for Jacob and his seed. Abraham then dies;
    Jacob discovers the death and informs Rebecca, who informs Isaac. Isaac, Ishmael,
    and the household mourn, and Isaac and Ishmael bury Abraham in the double cave
    near Sarah, with forty days of weeping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Abraham blesses the Most High God, called God of all and Creator of all, and
    recalls being brought from Ur of the Chaldees to inherit the land and establish
    a holy seed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abraham blesses Jacob and asks that divine grace and mercy be upon Jacob and
    his seed, that they be preserved, blessed, sanctified as a nation for divine inheritance,
    and that the covenant and grace be renewed with them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Abraham places two of Jacob’s fingers on his eyes, blesses the God of gods,
    covers his face, stretches out his feet, and dies in language described as sleeping
    the sleep of eternity and being gathered to his fathers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: Jacob lies in Abraham’s bosom without knowing Abraham is dead, wakes, finds
    Abraham cold as ice, calls to him, and receives no answer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Jacob tells Rebecca; Rebecca goes to Isaac at night and tells him; they return
