canonical_text:
  quote: ''
  summary: Isaac’s blessing continues with promises of peace, help for Jacob and Israel,
    blessing for supporters, and destruction for enemies. Jacob reports divine mercy,
    his vow, vision, altar, and intended sacrifice. Isaac cannot travel because of
    age but urges Jacob to fulfill the vow and sends Rebecca with him to Bethel. Jacob
    remembers Isaac’s blessing of Levi and Judah, speaks of eternal hope, and the
    heavenly tables record the blessing. At Bethel Levi dreams that he and his sons
    are ordained priests of the Most High God forever. Jacob then gives a tithe of
    all that came with him, and Rachel is pregnant with Benjamin.
  language: English
  quote_policy: summarized
