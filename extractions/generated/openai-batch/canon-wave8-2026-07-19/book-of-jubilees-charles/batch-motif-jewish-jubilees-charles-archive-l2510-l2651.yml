canonical_text:
  quote: ''
  summary: 'A scholarly introduction compares Jubilees with sections of Ethiopic Enoch
    and the Book of Noah, arguing literary dependence and listing shared or modified
    themes: messianic kingdom, immortality, Sheol and Gehenna imagery, Israel''s judgment
    role, joy of righteous spirits after death, ethical separation from sinners, idol
    polemic, eternal law, plant/tree imagery, rain and dew, evergreen trees, and the
    Noahic traditions about sinful angels, flood, and punishment.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Jubilees and Ethiopic Enoch xci-civ share resemblances
    including a temporary Messianic kingdom and implied or taught immortality of the
    soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Jubilees as optimistic and Ethiopic Enoch xci-civ as
    pessimistic, relating the latter to persecution after a breach involving Pharisees
    and Maccabean rulers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Jubilees does not yet associate Sheol with fire and burning,
    while the compared Enochic section combines characteristics of Sheol and Gehenna.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage compares an Israel promise in Jubilees, “head and not the tail,”
    with an Enochic statement that people hoped to be the head but became the tail.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts a promise of new heavens and a new earth in Jubilees
    with only a new heaven in Ethiopic Enoch xci.16.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage compares Jubilees' statement that Israel will judge nations according
    to their desires with Enochic statements that righteous Israel will execute judgment
    and have lordship over sinners according to their desires.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares statements about spirits having joy after death, including
    righteous spirits living and rejoicing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage compares warnings not to associate with the wicked or double-hearted,
    and describes the wicked as companions of sinners.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage compares anti-idol statements saying idols provide no help or
    profit.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage notes that eating blood is condemned in Jubilees and compared
    with Ethiopic Enoch.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage notes Enochic language about the law as eternal or for all future
    generations, described as expected in a writer influenced by Jubilees.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage compares phrases about a plant of righteousness, righteous judgment,
    or uprightness in Ethiopic Enoch with plant imagery in Jubilees.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage compares statements about causing rain and dew to descend on the
    earth.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage says Ethiopic Enoch iii's reference to trees shedding leaves except
    fourteen trees likely goes back to Jubilees' enumeration of fourteen evergreen
    trees used on the altar.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage says the Book of Noah is referred to in Jubilees and that two
    substantial sections were incorporated into Jubilees.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: The passage says chapters vi-xi of Ethiopic Enoch come from the same source
