canonical_text:
  quote: ''
  summary: Joseph is taken to Egypt at age seventeen and bought by Potiphar, who sets
    him over his household when he sees that the Lord prospers him. Potiphar’s wife
    desires Joseph and repeatedly asks him to lie with her, but Joseph refuses because
    he remembers the Lord and ancestral teaching against adultery, with heavenly punishment
    and recording of sin. She seizes him, closes the doors, and tries to force him;
    Joseph leaves his garment, breaks through the door, and flees. She accuses him
    before his master, who imprisons him. In prison Joseph again receives divine favor,
    is entrusted with responsibilities, and serves Pharaoh’s chief butler and chief
    baker, who both dream and tell their dreams to Joseph.
  language: English
  quote_policy: summarized
