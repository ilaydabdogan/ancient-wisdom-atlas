canonical_text:
  quote: ''
  summary: The passage is a textual-critical introduction arguing that Jubilees preserves
    an independent Hebrew form of the Pentateuch, often close to the LXX and Syriac.
    It then discusses lacunae and textual variants, including a disputed reference
    to twenty-two letters and books, numerical analogies involving Adam and Jacob,
    a Greek excerpt mentioning creation and Cain’s death, a lost section on agricultural
    laws, and a lost section concerning Abram, captives, kings, and Melchizedek.
  language: English
  quote_policy: summarized
