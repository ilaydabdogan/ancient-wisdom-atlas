  summary: The introduction identifies Jubilees as a Hebrew Pharisaic rewriting of
    sacred history from creation to Sinai. It presents the work as defending the everlasting
    validity of the law against Hellenistic claims, describes the law as heavenly
    before its revelation, and summarizes an expected messianic kingdom, transformed
    creation, thousand-year human life, and blessed immortality after death.
