canonical_text:
  quote: "“To thee and to thy seed will I give this land.”"
  summary: A blessing asks God to straighten and protect Abram’s path. Abram is instructed
    to go, take Lot, and later return. Abram journeys from Haran into Canaan with
    Sarai and Lot, reaches Shechem by a lofty oak, receives a divine promise of the
    land for himself and his seed, builds altars, offers burnt sacrifices, pitches
    his tent near Bethel and Ai, blesses the Lord for bringing him from Ur, travels
    to Hebron and the south, and goes to Egypt during a famine.
  language: English
  quote_policy: quoted
