  summary: The passage describes a forbidden sexual act involving a father’s concubine
    and Jacob’s wife, presents an everlasting law with severe judgment and no atonement,
    commands Moses to write and tell Israel the covenant words, identifies Israel
    as a holy, priestly, and royal nation, recounts Jacob and his children dwelling
    near Isaac and Rebecca and receiving blessing, and begins an account of Jacob’s
    sons pasturing sheep near Shechem while seven Amorite kings assemble against them.
