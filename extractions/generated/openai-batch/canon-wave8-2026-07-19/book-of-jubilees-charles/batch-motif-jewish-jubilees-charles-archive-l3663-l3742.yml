canonical_text:
  quote: ''
  summary: 'The passage presents the opening Sinai scene: God commands Moses to ascend
    the Mount to receive two written stone tablets of law and commandment. Moses ascends
    the mount of God; divine glory abides on Sinai, a cloud overshadows it for six
    days, God calls to Moses from the cloud on the seventh day, and the glory appears
    like flaming fire at the mountain top. Moses remains on the Mount forty days and
    forty nights while God teaches him earlier and later history. Editorial notes
    relate the passage to Exodus and discuss calendrical dates and Feast of Weeks
    traditions.'
