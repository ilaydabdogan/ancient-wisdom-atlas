canonical_text:
  quote: He gave us a great sign, the Sabbath day
  summary: 'The passage recounts portions of the creation week: plants are mentioned
    as a work of the third day; on the fourth day God creates the sun, moon, and stars,
    appointing the sun as a sign for sacred times and seasons; on the fifth day God
    creates sea creatures, fish, moving water creatures, and birds; on the sixth day
    God creates land animals and humanity, gives humanity dominion, counts twenty-two
    created kinds, completes the work, and gives the Sabbath as a sign of six days
    of work and seventh-day rest.'
  language: English
  quote_policy: quoted
