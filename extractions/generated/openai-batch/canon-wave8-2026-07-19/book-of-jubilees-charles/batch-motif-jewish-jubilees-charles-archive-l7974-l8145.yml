canonical_text:
  quote: ''
  summary: Noah enters the ark with what has been brought to him; the Lord closes
    it. The Lord opens heavenly floodgates and fountains of the deep, waters cover
    the world and rise above the mountains, and the ark moves on the waters before
    resting on Libar, one of the mountains of Ararat. The waters then recede, the
    earth dries, and Noah opens the ark and releases the animals. An adjacent section
    heading mentions Noah's sacrifice, God's covenant with Noah, a prohibition on
    eating blood, a bow in the clouds as a sign, and the institution of the Feast
    of Weeks.
