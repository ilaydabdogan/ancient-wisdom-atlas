canonical_text:
  quote: ''
  summary: 'Introductory notes cite Latin and Greek parallels to Jubilees: Cain kills
    his brother with a stone; idol worship occurs in the time of Serug; Abraham takes
    Sarah as wife, described as his paternal sister; astronomy is learned from a father;
    and a phrase in Joel about threatening destruction may show independent knowledge
    of Jubilees.'
