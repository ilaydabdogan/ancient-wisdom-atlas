  summary: 'The passage gives Sabbath regulations: preparation is to be made on the
    sixth day; work, carrying burdens, travel, tilling, fire-lighting, riding, and
    ship travel are prohibited; Sabbath is described as a divinely given festival
    and holy day for Israel forever; sanctuary incense, oblations, and sacrifices
    are permitted as atoning ritual work.'
