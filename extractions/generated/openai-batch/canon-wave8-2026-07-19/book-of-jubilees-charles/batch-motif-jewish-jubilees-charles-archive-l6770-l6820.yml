  quote: ''
  summary: The passage reports Greek and English scholarly excerpts about the Watchers
    or sons of God, contrasting an angelic interpretation with a Sethite interpretation,
    noting unions with daughters of men or Cain, transmission of magical knowledge
    and giant offspring in one reading, and presenting Seth as an extraordinary figure
    associated with writing, wisdom, astronomy, calendrical reckoning, and naming
    stars and planets.
  language: English with Greek excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Syncellus excerpt says that when humans multiplied on earth, angels of heaven
    came together with daughters of humans; some copies read “sons of God.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an interpretation in which the “sons of God” are descendants
    of Seth, including righteous persons and patriarchs, while descendants of Cain
    are called the seed of men because of wickedness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An alternate angelic interpretation is described in which angels gave women
    knowledge about magic and goetia, and from these women children called giants
    were produced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sixth-century Book of Adam and Eve is said to describe the Watchers throughout
    as sons of Seth and to reject the claim that spiritual angels came down from heaven
    and mingled with women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Book of Adam and Eve account summarized here, the children of Seth
    were called “angels of God” while they preserved virginity, innocence, and glory,
    but then transgressed and mingled with the daughters of Cain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says Seth is extraordinary and superhuman in the cited work, while
    Enoch is only noted as writer of a celebrated book and as someone to whom untold
    wonders happened.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: An anonymous extract prefixed to Malala says Adam begat Seth and that Seth
    first discovered Hebrew letters and wisdom, the signs of heaven, calendrical divisions,
    and names for stars and five planets.
  category: action
  evidence_refs:
  - ev:8
