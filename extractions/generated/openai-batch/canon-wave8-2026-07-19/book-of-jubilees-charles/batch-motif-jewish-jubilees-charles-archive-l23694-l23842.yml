canonical_text:
  quote: ''
  summary: The passage recounts Moses' upbringing with Pharaoh's daughter and Amram,
    his life in the royal court, his killing of an Egyptian who struck an Israelite,
    his rebuke of two disputing Israelites, and his fearful flight. It then summarizes
    and begins the account of Moses' return from Midian to Egypt, Mastema's attempt
    to kill him on the way, Moses' deliverance, his signs and wonders before Pharaoh,
    and the Lord's plagues against Egypt for Israel's sake.
