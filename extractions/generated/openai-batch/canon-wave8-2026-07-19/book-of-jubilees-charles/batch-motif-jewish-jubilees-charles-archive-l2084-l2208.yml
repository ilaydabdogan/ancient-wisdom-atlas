canonical_text:
  quote: ''
  summary: The passage is an introductory dating argument for Jubilees. It argues
    that the book belongs to the Maccabean period, discusses priestly titles, Pharisaic
    approval and later party conflict, and lists laws and themes said to reflect persecution,
    covenantal boundary maintenance, and an expectation of worldwide dominion in the
    promise to Jacob.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the date of the book must be established by indirect
    evidence, which the author presents as abundant and strong.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A manuscript note reports a variant involving the phrases “prince Mastema”
    and “prince of the Mastéma.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage argues that Jubilees was written during the pontificate of the
    Maccabean family and not earlier than 135 B.C.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Levi is said to be called a priest of the Most High God, and the passage identifies
    the Maccabean high-priests as the Jewish high-priests who bore that title.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the Maccabean high-priests appear to have assumed the title
    as a revival of the order of Melchizedek after displacing the Zadokite order of
    Aaron.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage describes the author of Jubilees as a strict Pharisee who nevertheless
    approves the Maccabean pontificate, and it uses this to argue that the book was
    written before open conflict between the Pharisees and Alexander Jannaeus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage concludes that the book was written between 135 B.C. and Hyrcanus’
    breach with the Pharisees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that several laws in Jubilees point to a past period of stress
    and persecution before the recovery of national independence under the Maccabees.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says Jews were forbidden to expose their persons by a law prescribed
    on the heavenly tables, and it connects this with Greek games established by Jason
    the high-priest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says circumcision is affirmed with severe penalties, was observed
    in the creation of the highest angels, and was forbidden by Antiochus under penalty
    of death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the Sabbath is re-enacted with a death penalty for profanation
    and that Antiochus forbade Jews to keep it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage lists strict Sabbath restrictions, including prohibitions on war,
    cohabitation with one’s wife, and riding on any beast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says intermarriage with the heathen is prohibited by death and
