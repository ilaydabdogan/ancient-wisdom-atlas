canonical_text:
  quote: ''
  summary: In this excerpt from Jubilees' retelling of Isaac's blessing, Jacob receives
    lordship over his brothers and an inherited blessing associated with Abraham.
    Esau arrives after hunting, seeks the blessing, learns that Jacob has already
    received it, laments the loss of both birthright and blessing, receives a separate
    pronouncement involving hardship, service, sword, yoke, and future destruction
    of his seed, and then threatens Jacob.
  language: English
  quote_policy: summarized
