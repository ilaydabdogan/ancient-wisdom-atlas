canonical_text:
  quote: ''
  summary: Abram’s wife Sarai is seized by Pharaoh, after which the Lord plagues Pharaoh
    and his house; Sarai is returned and Abram leaves Egypt with wealth. Abram returns
    to the place of his former altar, blesses the Lord, and offers sacrifice. Lot
    separates from Abram and dwells in Sodom, causing Abram grief. The Lord commands
    Abram to look in all directions and promises the land to him and his seed forever,
    with descendants beyond numbering. A war of kings follows; Sodom and other cities
    are taken, Lot is captured, an escapee reports this to Abram, and Abram arms his
    household servants.
  language: English
  quote_policy: summarized
