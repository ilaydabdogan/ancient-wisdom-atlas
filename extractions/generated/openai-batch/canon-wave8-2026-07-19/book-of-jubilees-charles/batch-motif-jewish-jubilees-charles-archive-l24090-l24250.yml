canonical_text:
  quote: ''
  summary: 'The passage gives rules for Passover observance: the victim is slain near
    evening, eaten during the evening, leftovers are burned, it is roasted with fire
    rather than cooked in water or eaten raw, and no bone is broken. The feast is
    to be kept annually at its fixed time, before the sanctuary, as a memorial before
    the Lord, with protection from plague attached to proper observance. Notes discuss
    parallel biblical passages and interpretive traditions about the timing of slaughter.'
  language: English
  quote_policy: summarized
