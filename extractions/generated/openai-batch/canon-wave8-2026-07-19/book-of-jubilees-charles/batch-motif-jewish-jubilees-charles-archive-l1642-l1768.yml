canonical_text:
  quote: ''
  summary: The passage explains the Book of Jubilees as a rewriting of Genesis analogous
    to the Chronicler’s rewriting of Samuel and Kings. It says the author omits or
    alters Genesis material to present patriarchs as observing the law, reverses the
    relative prominence of Levi and Judah, attributes certain tempting or destructive
    acts to Mastema rather than to God, and teaches that law, circumcision, and Sabbath
    have eternal heavenly validity shared by Israel and the highest angelic orders.
  language: English
  quote_policy: summarized
