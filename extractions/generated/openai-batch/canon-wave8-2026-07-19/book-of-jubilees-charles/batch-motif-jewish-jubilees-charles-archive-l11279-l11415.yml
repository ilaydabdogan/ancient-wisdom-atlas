canonical_text:
  quote: ''
  summary: 'The passage recounts the Tower of Babel episode: a unified people build
    a city and tower in Shinar; the Lord decides to confound their language, descends
    with unnamed attendants, causes mutual incomprehension, stops the building, names
    Babel from the confusion, disperses the peoples, and later sends a mighty wind
    that overthrows the tower. It then notes the dated dispersal from Shinar and movements
    of Ham, his sons, and Canaan into particular lands.'
  language: English
  quote_policy: summarized
