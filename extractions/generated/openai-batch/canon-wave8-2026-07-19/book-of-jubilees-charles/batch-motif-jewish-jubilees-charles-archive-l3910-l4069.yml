canonical_text:
  quote: ''
  summary: A divine speech foretells that the people will be delivered to Gentiles,
    scattered, and forget divine law and sacred observances. Afterward they will turn
    back with their whole heart and soul, be gathered from among the Gentiles, receive
    peace and righteousness, and have God’s sanctuary built in their midst. Moses
    falls on his face and prays that God not forsake the people or let Gentile enemies
    and the spirit of Beliar ensnare them. The Lord replies that, after confession,
    the people will return uprightly; God will circumcise their hearts, create a holy
    spirit in them, and cleanse them.
  language: English
  quote_policy: summarized
