canonical_text:
  quote: ''
  summary: The passage presents a law against defiling Israel through relations with
    Gentiles, associates such defilement with giving seed to Moloch, commands Moses
    to warn Israel against giving daughters to Gentiles or taking Gentile daughters,
    recalls the Shechemites’ offense against Dinah and the sons of Jacob’s refusal
    to give a daughter to an uncircumcised man, warns of communal plague and cultic
    rejection, and cites the destruction of the Shechemites by two sons of Jacob as
    reckoned righteousness.
  language: English
  quote_policy: summarized
