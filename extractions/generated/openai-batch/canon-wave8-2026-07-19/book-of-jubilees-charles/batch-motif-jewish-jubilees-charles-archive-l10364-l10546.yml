  summary: The passage describes the second and third territorial portions allotted
    to Ham and Japheth. Ham’s portion is mapped by the Gihon, the Garden of Eden,
    mountains of fire, western seas, Gadir, and the great sea, and is assigned to
    Ham and his sons forever. Japheth’s portion is mapped northward and westward through
    named regions, waters, mountains, and islands, and is assigned to Japheth and
    his sons forever. Editorial notes compare these descriptions with later geographical
    traditions and cross-reference fiery mountains in Ethiopic Enoch.
