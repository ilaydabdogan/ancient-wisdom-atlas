canonical_text:
  quote: ''
  summary: Rebecca completes a blessing over Jacob and his future descendants, invoking
    multitude, land, holiness, peace, divine presence, and a sanctuary. The narrative
    then turns to Isaac, who, old and dim-sighted, sends Esau to hunt venison so that
    he may bless him before death. Rebecca overhears, instructs Jacob to bring goat
    kids so she can prepare food, and arranges for Jacob to approach Isaac disguised
    with Esau’s clothing and goat skins. Jacob enters and claims to have done as his
    father commanded.
  language: English
  quote_policy: summarized
