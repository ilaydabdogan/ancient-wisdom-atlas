canonical_text:
  quote: ''
  summary: The passage recounts Abram’s birth and naming after his maternal grandfather,
    his early recognition of idolatrous error, his separation from his father’s idol
    worship, and his prayer to the Creator. At seedtime, Abram drives off ravens that
    threaten the seed, gains renown in Chaldea, helps cultivators sow successfully,
    and teaches craftsmen to make a plough-mounted vessel that hides seed in the earth.
    The following chapter begins with Abram addressing Terah and questioning the usefulness
    of the idols Terah worships.
  language: English
  quote_policy: summarized
