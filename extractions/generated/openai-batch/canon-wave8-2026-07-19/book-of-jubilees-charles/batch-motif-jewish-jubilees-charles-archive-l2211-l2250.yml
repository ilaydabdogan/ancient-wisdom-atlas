canonical_text:
  quote: ''
  summary: The passage argues that Jubilees reflects a period in which Levi is elevated
    over Judah, Levitical descendants receive high-priestly and civil offices, Judahite
    authority is limited to Judah and the future Messiah, and Maccabean rule is implied
    before the Messiah. It also connects Jubilees’ accounts of conflicts involving
    Esau’s sons, Jacob’s sons, Edom, and Amorite kings with Maccabean-era wars and
    the subjection of Edom.
  language: English
  quote_policy: summarized
