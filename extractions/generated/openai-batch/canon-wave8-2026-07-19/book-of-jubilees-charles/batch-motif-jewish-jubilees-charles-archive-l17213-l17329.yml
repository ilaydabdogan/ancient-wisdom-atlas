canonical_text:
  quote: do not take thee a wife of the daughters of this land, but only of the house
    of my father
  summary: Rebecca tells Jacob to avoid marrying women of the land and to take a wife
    from her father's kin. Jacob answers that he has remained sexually untouched,
    remembers Abraham's command against Canaanite marriage, and vows to obey. Rebecca
    prays to the Most High God; the spirit of righteousness descends into her mouth,
    and she lays both hands on Jacob's head and blesses him with righteousness and
    many sons.
  language: English
  quote_policy: quoted
