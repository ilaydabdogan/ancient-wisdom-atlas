canonical_text:
  quote: ''
  summary: After the woman listens to the serpent and eats, the divine speaker announces
    pain in childbirth and subordination to her husband. Adam is judged for listening
    to his wife and eating from the forbidden tree; the ground is cursed, labor becomes
    painful, and he is told he will return to the earth. The divine speaker clothes
    the humans in coats of skin and sends them from Eden. Adam offers fragrant spices
    at sunrise after covering his shame. On that day the speech of animals is ended,
    and all flesh in Eden is sent out and scattered to its appointed places.
  language: English
  quote_policy: summarized
