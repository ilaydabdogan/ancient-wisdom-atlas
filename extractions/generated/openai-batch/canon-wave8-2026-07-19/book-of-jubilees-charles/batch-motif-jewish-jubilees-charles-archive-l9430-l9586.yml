canonical_text:
  quote: ''
  summary: A post-flood ancestral speaker, identified in the notes as Noah, warns
    his sons against discord, demonic seduction, bloodshed, and eating blood. He declares
    destruction, descent to Sheol, and violent death for those who shed human blood
    or eat blood. He commands covering shed animal blood, links blood with life, says
    the earth is cleansed from bloodguilt only through the blood of the shedder, and
    exhorts his children to righteousness, city-building, planting, and consecrating
    fourth-year fruit or first-fruits to the Most High God.
  language: English
  quote_policy: summarized
