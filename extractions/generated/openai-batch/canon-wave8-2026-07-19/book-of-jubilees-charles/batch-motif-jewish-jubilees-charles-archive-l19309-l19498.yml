canonical_text:
  quote: ''
  summary: The passage recounts the surrender and destruction of strange gods and
    stolen idols, Jacob’s journey to Bethel to build an altar and pillar, his visit
    to Isaac and Rebecca with Levi and Judah, Rebecca’s blessing of the sons, Isaac’s
    restored sight, and Isaac’s prophetic blessing of Levi and Levi’s descendants
    as sanctuary servants, judges, teachers, and blessers of Israel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people give up strange gods and associated personal objects, and the idols
    stolen by Rachel are handed over to Jacob.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jacob burns, breaks, destroys, and hides the idols under an oak in the land
    of Shechem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jacob goes to Bethel on the new moon of the seventh month, builds an altar
    at the place where he slept, sets up a pillar, and summons Isaac and Rebecca to
    his sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Isaac asks to see Jacob before he dies, and Jacob visits Isaac and Rebecca
    with two sons, Levi and Judah.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rebecca comes from a tower, kisses and embraces Jacob, and her spirit is said
    to have revived when she hears Jacob has arrived.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rebecca recognizes, embraces, kisses, and blesses Levi and Judah, saying that
    in them Abraham’s seed will become illustrious and that they will be a blessing
    on earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jacob enters Isaac’s chamber, takes Isaac’s hand, stoops down and kisses him,
    and Isaac clings to Jacob’s neck and weeps.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The darkness leaves Isaac’s eyes, and he sees Levi and Judah.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The spirit of prophecy comes into Isaac’s mouth; Isaac takes Levi by his right
    hand and Judah by his left and begins by blessing Levi.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Isaac’s blessing asks God to bless Levi and his children, grant greatness
    and glory to Levi’s seed, and cause them to approach God and serve in His sanctuary
    like the angels of the presence and the holy ones.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Levi’s descendants are described as princes, judges, and chiefs who speak
    the Lord’s word, judge His judgments, declare His ways and paths, and bless the
    beloved seed.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The name Levi is interpreted as fitting because Levi will be joined to the
    Lord and be companion of all the sons of Jacob.
  category: speech
  evidence_refs:
  - ev:12
