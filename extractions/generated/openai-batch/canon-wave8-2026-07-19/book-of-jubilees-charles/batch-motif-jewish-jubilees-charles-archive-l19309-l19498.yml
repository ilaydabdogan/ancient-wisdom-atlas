    ritual category.
- id: motif:2
  label: Altar and pillar at a remembered sacred place
  taxonomy_refs:
  - sacrifice
  basis: Jacob returns to the place where he had slept, builds an altar, sets up a
    pillar, and calls his parents to his sacrifice.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only the sacrifice aspect is explicit among the available taxonomy families.
- id: motif:3
  label: Ancestral blessing extending Abrahamic lineage
  taxonomy_refs:
  - covenant
  basis: Rebecca blesses Levi and Judah by linking them to the seed of Abraham and
    blessing on earth; Isaac’s later blessing also assigns blessing to Levi’s descendants
    and the beloved seed.
  evidence_refs:
  - ev:6
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage uses blessing and Abrahamic seed language but does not explicitly
    use the word covenant in the excerpt.
- id: motif:4
  label: Prophetic patriarch designates a sacred lineage
  taxonomy_refs: []
  basis: The spirit of prophecy comes into Isaac’s mouth before he blesses Levi first
    and assigns Levi’s seed sanctuary service, holiness, judgment, and instruction.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a passage-level motif label; no exact supplied taxonomy family
    corresponds to priestly lineage designation.
- id: motif:5
  label: Restored sight before blessing
  taxonomy_refs: []
  basis: Before the prophetic blessing, the darkness leaves Isaac’s eyes and he sees
