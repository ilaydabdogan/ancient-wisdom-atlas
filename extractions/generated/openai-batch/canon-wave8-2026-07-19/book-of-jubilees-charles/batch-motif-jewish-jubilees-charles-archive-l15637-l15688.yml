canonical_text:
  quote: ''
  summary: Ishmael visits his father; Isaac offers a burnt-offering at an altar in
    Hebron, makes a thank-offering and feast, and sends further food by Jacob to Abraham.
    Rebecca prepares cakes from new grain and first-fruits for Abraham, who eats,
    drinks, blesses the Most High God as Creator and provider, gives thanks for reaching
    old age in peace, says the sword of the adversary has not overcome him, and prays
    that his descendants may become a chosen nation and inheritance.
  language: English
