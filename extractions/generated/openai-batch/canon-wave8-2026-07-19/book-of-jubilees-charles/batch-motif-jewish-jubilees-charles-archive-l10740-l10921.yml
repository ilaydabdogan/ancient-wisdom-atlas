canonical_text:
  quote: ''
  summary: The supplied passage assigns territorial portions to Tubal, Meshech, and
    Tiras, then states that Noah’s sons divided inheritances before Noah. Noah binds
    them by oath and curse not to seize another allotted portion, and they assent
    for themselves and their descendants until the day when God judges wickedness
    with sword and fire. The transition to chapter X announces unclean demons leading
    Noah’s descendants astray, Noah’s prayer, Mastema retaining one-tenth of spirits,
    angelic instruction in herbs against demons, and related later episodes; editorial
    notes cite parallels in Epiphanius, Syncellus, and the Hebrew Book of Noah.
  language: English
  quote_policy: summarized
