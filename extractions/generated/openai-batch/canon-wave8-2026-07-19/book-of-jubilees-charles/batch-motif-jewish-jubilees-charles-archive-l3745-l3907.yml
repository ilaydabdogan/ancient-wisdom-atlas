canonical_text:
  quote: ''
  summary: God speaks on Mount Sinai to the addressed recipient, identified in the
    notes as Moses, commanding that the words be written in a book for future generations.
    The speech predicts covenant transgression, future recognition of divine righteousness,
    entry into the sworn land, apostasy to strange gods, loss of commandments and
    sacred institutions, idolatrous worship including child sacrifice to demons, rejection
    and killing of witnesses, persecution of law-seekers, and divine withdrawal or
    delivery.
  language: English
  quote_policy: summarized
