  summary: 'The passage discusses possible related or derivative works associated
    with Jubilees: an expanded Testament of Moses, the Book of Adam’s Daughters, and
    the Life of Adam. It summarizes traditions about Moses’ hidden death and burial,
    names of patriarchs’ wives, and Adam and Eve in Paradise, then describes Ethiopic
    manuscripts and editions of Jubilees.'
