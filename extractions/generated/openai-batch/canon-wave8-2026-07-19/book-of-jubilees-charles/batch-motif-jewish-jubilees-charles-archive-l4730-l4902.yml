canonical_text:
  quote: ''
  summary: 'The passage describes parts of the creation sequence: angels and spirits
    connected with natural phenomena, the creation of abysses, darkness, and light
    on the first day, praise of divine works, the second-day creation of the firmament
    dividing the waters, and the third-day gathering of waters, appearance of dry
    land, and creation of seas, rivers, lakes, dew, seeds, trees, and the Garden of
    Eden. Editorial notes compare these details with Genesis, Enochic texts, and Revelation.'
  language: English
  quote_policy: summarized
