  quote: This one will comfort me.
  summary: The passage is an editorial note on Noah’s birth chronology and name. It
    argues for 707 as Noah’s birth year from Adam using the Samaritan Chronicle and
    Lamech’s age, notes an alternate calculation yielding 709 from other Jubilees
    passages, records textual/name variants, and comments that the explanation of
    Noah’s name as comfort follows Genesis 5:29 while properly belonging to Menachem.
  language: English
