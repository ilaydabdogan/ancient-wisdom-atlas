canonical_text:
  quote: "“Now the Lord hath made room for us, and we have increased in the land.”"
  summary: Isaac dwells in Gerar under Abimelech’s protection, becomes prosperous,
    and is envied by the Philistines. Philistines have stopped Abraham’s wells, and
    Isaac reopens them and digs further wells, some of which become objects of dispute.
    One uncontested well is named “Room.” At the Well of the Oath, the Lord appears
    to Isaac, renews blessing and multiplication for Abraham’s sake, and Isaac builds
    an altar and offers sacrifice. Later well-digging and the naming of the Well of
    the Oath are connected with Isaac’s oath to Abimelech, Ahuzzath, and Phicol.
  language: English
  quote_policy: quoted
