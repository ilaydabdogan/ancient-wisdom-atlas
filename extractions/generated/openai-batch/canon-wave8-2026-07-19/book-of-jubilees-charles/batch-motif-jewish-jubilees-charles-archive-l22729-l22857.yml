canonical_text:
  quote: ''
  summary: Joseph detains Simeon while sending the other brothers back to Canaan with
    food and returned money, requiring that Benjamin be brought to Egypt. Jacob initially
    refuses to send Benjamin because of prior losses and fear. Severe famine forces
    renewed negotiations; Reuben and Judah offer pledges, and Jacob sends Benjamin
    with gifts. In Egypt Joseph recognizes Benjamin, releases Simeon, hosts a feast,
    gives Benjamin a larger portion, and devises a test by placing his silver cup
    in Benjamin's sack. The steward pursues the brothers and accuses them of theft;
    they deny wrongdoing and accept a search and possible penalty.
  language: English
  quote_policy: summarized
