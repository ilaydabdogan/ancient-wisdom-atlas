canonical_text:
  quote: ''
  summary: 'The passage recounts divine vengeance on Egypt for Israel: judgments come
    through the addressed agent, the prince of Mastema opposes him and aids Egyptian
    sorcerers, Israel is delivered through the sea, Egyptian pursuers are cast into
    the sea in retaliation for children thrown into the river, and Mastema is bound
    and later released within a dated sequence.'
  language: English
  quote_policy: summarized
