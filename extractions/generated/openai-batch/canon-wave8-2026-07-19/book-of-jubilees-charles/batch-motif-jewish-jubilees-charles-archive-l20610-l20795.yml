canonical_text:
  quote: ''
  summary: Jacob’s conflict near Shechem concludes with slain opponents, recovered
    herds, imposed tribute, town-building, peace, and the defeated people becoming
    servants. Later Jacob sends Joseph to check on his brothers; they plot against
    him, sell him to Ishmaelite merchants, and Joseph is taken to Egypt and sold to
    Potiphar. The sons of Jacob then slaughter a kid, dip Joseph’s coat in blood,
    send it to Jacob, and Jacob mourns, believing Joseph has been devoured by an evil
    beast. Editorial notes compare the peace-and-herds episode with related traditions
    and variants.
  language: English
  quote_policy: summarized
