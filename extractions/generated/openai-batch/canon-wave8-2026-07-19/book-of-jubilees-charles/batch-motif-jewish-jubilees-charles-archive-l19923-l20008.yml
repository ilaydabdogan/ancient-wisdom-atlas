canonical_text:
  quote: ''
  summary: Jacob tithes animals, makes a burnt sacrifice, and Levi exercises priestly
    office at Bethel. The passage presents annual second-tithe practice as ordained
    on heavenly tables, with rules for eating it in the chosen place and burning old
    leftovers. Jacob resolves to sanctify the place, but the Lord appears by night,
    blesses and renames him Israel, promises descendants, kings, and worldwide inheritance,
    then ascends to heaven. In a night vision an angel descends with seven tablets,
    gives them to Jacob so he knows future events, and tells him not to build an eternal
    sanctuary there but to go dwell with Isaac because Jacob will die in Egypt.
  language: English
  quote_policy: summarized
