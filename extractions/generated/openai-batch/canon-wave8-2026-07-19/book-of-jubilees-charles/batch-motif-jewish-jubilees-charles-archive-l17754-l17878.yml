canonical_text:
  quote: ''
  summary: Esau threatens to kill Jacob. Rebecca learns of Esau’s words in a dream
    and urges Jacob to flee to Laban in Haran until Esau’s anger passes. Jacob hesitates
    because Isaac is old and blind and may curse him for leaving without being sent.
    Rebecca speaks to Isaac about avoiding Canaanite wives for Jacob. Isaac blesses
    Jacob, instructs him to go to Mesopotamia to take a wife from Laban’s daughters,
    invokes God Almighty to grant Abraham’s blessing and land inheritance to Jacob
    and his seed, and sends Jacob away. Rebecca grieves at Jacob’s departure, and
    Isaac comforts her by saying Jacob goes and will return in peace.
  language: English
  quote_policy: summarized
