canonical_text:
  quote: Joseph nourished his father and his brethren ... with bread as much as sufficed
    them for the seven years of the famine.
  summary: Israel and his sons dwell in Goshen. During and after the famine, Joseph
    provides bread, acquires Egyptian land and dependents for Pharaoh, distributes
    seed after the river overflows, and establishes a fifth-part harvest ordinance.
    Israel dies after blessing his sons, giving Joseph two portions, is buried in
    the double cave in Canaan, and gives ancestral books to Levi. After Jacob's death
    the children of Israel multiply in Egypt and maintain brotherly unity.
  language: English
  quote_policy: quoted
