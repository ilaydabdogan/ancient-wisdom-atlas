  quote: "“Lay not thy hand upon the lad, neither do thou anything to him”"
  summary: A heavenly intervention stops Abraham from harming his son after the Lord
    has shown Abraham's fear and faithfulness. A ram is offered instead of the son;
    the place is named and identified with Mount Sion. The Lord swears an oath of
    blessing over Abraham's descendants, Abraham returns in peace, and an annual seven-day
    festival is ordained on the heavenly tables for Israel and its seed.
  language: English
