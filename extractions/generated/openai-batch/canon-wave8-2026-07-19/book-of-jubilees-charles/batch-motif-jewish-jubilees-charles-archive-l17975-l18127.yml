canonical_text:
  quote: ''
  summary: Jacob asks Laban for the wife for whom he has served seven years. Laban
    holds a feast but gives Leah, with Zilpah as handmaid, to Jacob, who had expected
    Rachel. Jacob confronts Laban, saying he served for Rachel. Laban invokes local
    custom and a heavenly ordinance that the elder daughter must be given before the
    younger, and the passage commands Israel not to reverse that order. Laban then
    offers Rachel after Leah's seven-day feast in exchange for another seven years
    of service, gives Rachel with Bilhah as handmaid, and Jacob serves the additional
    seven years.
  language: English
  quote_policy: summarized
