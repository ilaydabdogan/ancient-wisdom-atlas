canonical_text:
  quote: ''
  summary: The passage links covenant-making on a mountain with blood sprinkling,
    a perpetual prohibition on eating blood, altar supplication with blood, the Noahic
    bow in the cloud as a sign that no flood will again destroy the earth, and the
    annual Feast of Weeks as a heavenly ordained renewal of the covenant. It recounts
    observance, neglect, and restoration of the festival among Noah, his sons, the
    patriarchs, and Israel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressee is told to make a covenant with the children of Israel in this
    month upon the mountain, with an oath, and to sprinkle blood upon them because
    of the covenant words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage commands that blood of beasts, birds, and cattle should not be
    eaten, and says that anyone who eats such blood, together with his seed, will
    be rooted out of the land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The law against eating blood is described as perpetual and without a limit
    of days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children of Israel are to seek forgiveness with blood before the altar
    at morning and evening times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: God gave Noah and his sons a sign that there should not again be a flood on
    the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bow in the cloud is set as the sign of an eternal covenant that there
    should not again be a flood destroying the earth.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Feast of Weeks is ordained and written on the heavenly tables to be celebrated
    once a year in this month to renew the covenant every year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The festival is said to have been celebrated in heaven from creation until
    the days of Noah.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Noah and his sons observed the festival for a stated period, but after Noah’s
    death his sons did away with it and ate blood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Abraham, Isaac, Jacob, and Jacob’s children observed the festival until the
    addressee’s days; the children of Israel forgot it until it was celebrated anew
    on the mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The children of Israel are commanded to observe the festival in all their
    generations, one day in the year in this month.
  category: speech
  evidence_refs:
  - ev:6
