  quote: ''
  summary: 'An editorial note surveys interpretations of Genesis iv. 26 and related
    traditions: some sources read the verse as the beginning of calling on the Lord,
    while other Jewish and Aramaic traditions connect the period of Enos with idolatry,
    demons, and the making of idols. The note also mentions traditions assigning astrology,
    divination, and idolatry to Serug’s days while exempting Serug and his sons, and
    cites a Book of Jashar explanation of Seth naming Enos.'
