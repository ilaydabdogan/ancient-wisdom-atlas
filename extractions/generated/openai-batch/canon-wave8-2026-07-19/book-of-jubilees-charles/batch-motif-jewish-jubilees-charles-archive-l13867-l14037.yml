canonical_text:
  quote: ''
  summary: The passage recounts Sarah conceiving and bearing Isaac at the appointed
    festival time; Abraham circumcising Isaac on the eighth day; heavenly first-person
    plural speakers blessing Abraham and announcing decrees about his descendants;
    the designation of a holy seed from Isaac as God's possession; and Abraham founding
    a seven-day joyful festival with altar and booths at the Well of the Oath.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord visits Sarah as previously spoken, Sarah conceives, and Isaac is
    born in the third month at the middle of the month on the festival of first-fruits
    of the harvest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Abraham circumcises Isaac on the eighth day, and Isaac is described as the
    first circumcised according to the covenant ordained forever.
  category: action
  evidence_refs:
