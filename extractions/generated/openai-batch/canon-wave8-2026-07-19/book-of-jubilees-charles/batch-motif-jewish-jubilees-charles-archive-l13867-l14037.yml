  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speakers go to Sarah and announce to her what they had told Abraham; Abraham
    and Sarah rejoice with very great joy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Abraham builds an altar to the Lord who delivered him and made him rejoice
    in the land of his sojourning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Abraham celebrates a festival of joy for seven days near the altar at the
