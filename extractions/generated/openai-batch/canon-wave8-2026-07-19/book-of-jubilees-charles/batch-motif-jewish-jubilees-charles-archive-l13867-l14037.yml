- id: obs:3
  text: First-person plural speakers come to Abraham at the Well of the Oath, appear
    to him, bless him, and announce decrees concerning him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The announcement says Abraham will not die until he begets six more sons and
    sees them, but that his name and seed will be called in Isaac.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The announcement distinguishes the seed of Abraham's sons as reckoned with
    the Gentiles from a holy seed arising from the sons of Isaac.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The holy seed from Isaac is described as the portion of the Most High, God's
