canonical_text:
  quote: ''
  summary: A scholarly introduction section lists proposed New Testament connections,
    dependencies, presuppositions, or close parallels with Jubilees, especially around
    angels and demons, persecuted witnesses, remembrance of visions, ancestral burial
    traditions, Moses chronology, the law given through angels, the way, law and transgression,
    new creation, divine fatherhood, Gentile sinners, covenant chronology, and circumcision.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The section states that connections between the gospels and Jubilees are generally
    slight, except regarding beliefs about angels and demons, and then presents New
    Testament passages side by side with passages from Jubilees as dependency, presupposition,
    or close parallel.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mark and Matthew's phrase about a ruler of demons is compared with Jubilees'
    language about a chief of spirits and the Prince of Mastema.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Luke's saying about the wisdom of God sending prophets and apostles who are
    killed and persecuted is compared with Jubilees' statement that witnesses will
    be sent and then slain or persecuted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: John's statement that the Holy Spirit will bring things to remembrance is
    compared with Jubilees' statement that God will bring things to Jacob's remembrance
    after a vision.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Acts' account of Jacob and the fathers being carried to Shechem and laid in
    a tomb bought by Abraham is compared with Jubilees' account of the children of
    Israel bringing forth the bones of Jacob's children, except Joseph's bones, and
    burying them in the field in the double cave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Acts' chronology of Moses being nearly forty when he struck the Egyptian and
    spending forty years in Midian is compared with Jubilees' chronology in which
    Moses is forty-two and spends thirty-eight years.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Acts and Galatians' statement that the law was ordained by angels is compared
    with Jubilees' command to the angel of the presence to write for Moses, and the
    passage states that Jubilees is the earliest authority for the law being given
    through angels.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Acts' expression about people belonging to the way and Romans' claim about
    no transgression where there is no law are both paired with Jubilees passages
    said to parallel or anticipate those ideas.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pauline language about a new creation is compared with Jubilees' phrase about
    a new and righteous nature.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Second Corinthians' divine father-and-children formula is compared with Jubilees'
    statement that God will be their Father and they will be God's children; a note
    adds that the righteous individual is called a son of God first in Jubilees, so
    far as the author is aware.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Galatians' phrase sinners of the Gentiles is compared with the same phrase
    in Jubilees.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Galatians' calculation of a covenant confirmed before the law is compared
    with Jubilees' chronology of Abraham's circumcision covenant, Isaac's birth, and
    the legislation at Sinai.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Galatians' statement about agitators cutting themselves off is contrasted
    with Jubilees' statement that angels were created circumcised.
  category: relationship
  evidence_refs:
  - ev:13
