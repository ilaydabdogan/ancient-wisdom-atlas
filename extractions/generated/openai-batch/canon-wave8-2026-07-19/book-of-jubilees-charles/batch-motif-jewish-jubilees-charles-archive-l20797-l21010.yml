canonical_text:
  quote: ''
  summary: The passage describes Jacob/Israel refusing comfort after Joseph's reported
    death; Bilhah and Dinah also die after Joseph perishes, producing three mournings
    in one month. Bilhah and Dinah are buried near Rachel's tomb. Jacob mourns Joseph
    for a year. The text gives an etiology for an annual tenth-day-of-the-seventh-month
    observance of self-affliction, atonement with a young goat, grief over sins, and
    cleansing. It then lists wives taken by Jacob's sons and states that Simeon repented
    and took a second wife from Mesopotamia.
