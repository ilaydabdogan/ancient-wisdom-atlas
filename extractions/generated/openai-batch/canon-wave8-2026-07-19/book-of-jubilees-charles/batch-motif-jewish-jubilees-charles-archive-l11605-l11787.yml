  summary: The passage describes idolatry, malignant spirits and Mastéma promoting
    sin and corruption, genealogical notices from Serug to Terah, the teaching of
    Chaldean divination and augury according to heavenly signs, and Mastéma sending
    ravens and birds to devour seed and fruit, causing hardship and barren years.
  language: English
  quote_policy: summarized
