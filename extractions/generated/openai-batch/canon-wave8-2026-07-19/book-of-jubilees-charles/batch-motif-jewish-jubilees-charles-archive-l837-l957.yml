canonical_text:
  quote: ''
  summary: This introductory, text-critical passage surveys the Latin version of Jubilees,
    notes its publication and editorial history, evaluates its relation to Ethiopic,
    LXX, Vulgate, Genesis, and Greek forms, describes the uncertain evidence for a
    Syriac version, and argues that both Ethiopic and Latin derive from Greek, while
    the Greek is introduced as a translation from a Hebrew or Semitic original.
  language: English with Greek and Latin terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Latin version is said to be about one fourth preserved, first published
    by Ceriani, later edited by Rönsch, and edited again by the first-person editor
    in conjunction with Ethiopic.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rönsch is reported to have thought the Latin version was made in Egypt or
    nearby by a Palestinian Jew around the middle of the fifth century.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Latin version, where preserved, is described as almost equal in value
    to the Ethiopic, but as having suffered more from correctors.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives examples where the Latin is said to have been corrected
    in conformity with the LXX or influenced by the Vulgate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage allows alternative explanations for some Latin readings: the
    Latin may have reproduced Greek faithfully, the Greek may have been faulty, or
    the Greek presupposed by the Ethiopic may have been faulty.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: In two cited passages, the Latin version is said to agree with the Ethiopic
    version of Genesis against the Ethiopic version of Jubilees and other authorities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Latin version is said to preserve the true text in many places over against
    corruptions or omissions in the Ethiopic version.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The evidence for a Syriac version is described as inconclusive and based on
    a British Museum manuscript fragment about names of patriarchs' wives according
    to the Hebrew Book called Jubilees.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ethiopic version of Jubilees is said to be translated from Greek, with
