canonical_text:
  quote: ''
  summary: The passage contains the end of Abraham's blessing, promising divine mercy,
    rain, food, fertility, and blessing among nations. Abraham gives gifts to Ishmael,
    Ishmael's sons, and Keturah's sons, sends them away from Isaac, and gives everything
    to Isaac. The eastern groups settle, mingle, and are called Arabs and Ishmaelites.
    A new section introduces Abraham's last words to Isaac about idolatry, blood,
    sacrifices, salt, woods for sacrifice, washing, and covering blood. Abraham calls
    Isaac, states his old age and uncertainty about death, recalls his faithfulness
    to the Lord, and rejects idols. Editorial notes compare this material with Testament
    of Levi 9.
  language: English
  quote_policy: summarized
