canonical_text:
  quote: ''
  summary: A speaker exhorts sons or brothers to fear and worship the Creator and
    to love one another. He warns that one who devises evil against his brother will
    be destroyed, burned like Sodom, excluded from the book of life, and appointed
    to destruction. The speaker then divides possessions, gives the larger portion
    to the first-born, and Esau acknowledges that he has sold and given his birthright
    to Jacob. A note compares wording about turbulence and wrath with Ethiopic Enoch
    and contrasts the book of life with a book of destruction.
  language: English
