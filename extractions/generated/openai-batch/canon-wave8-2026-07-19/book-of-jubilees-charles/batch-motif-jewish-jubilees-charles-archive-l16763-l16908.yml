canonical_text:
  quote: ''
  summary: 'The passage closes an eschatological oracle: the righteous see peace,
    enemy judgment, bodily rest in earth, and joyful spirits, and Moses is told to
    write words recorded on heavenly tables. It then narrates Isaac''s blessing after
    Abraham''s death, his dwelling at the Well of the Vision, a famine, Esau''s sale
    of his birthright to Jacob for bread and red lentil pottage under oath, Isaac''s
    movement toward Gerar, and the Lord''s command and covenant promise of land, descendants,
    and blessing through Isaac''s seed.'
  language: English
  quote_policy: summarized
