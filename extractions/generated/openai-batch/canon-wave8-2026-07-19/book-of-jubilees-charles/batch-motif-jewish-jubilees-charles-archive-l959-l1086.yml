canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction discussing whether Jubilees was
    originally written in Aramaic or Hebrew. It treats Aramaic-looking proper names
    as inconclusive, then lists arguments for a Hebrew original, including the work's
    claimed Mosaic authority, Hebrew as sacred and national language, retranlation
    evidence, surviving Hebraisms, Hebrew wordplay, and parallels in rabbinic and
    related writings. It then begins a section on textual affinities between Jubilees
    and Pentateuchal textual witnesses such as the Samaritan, LXX, Syriac, Vulgate,
    and Onkelos.
  language: English
  quote_policy: summarized
