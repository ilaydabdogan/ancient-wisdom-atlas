canonical_text:
  quote: ''
  summary: The passage fragment describes Zion and Jerusalem as holy, then says that
    the angel of the presence took tables recording the divisions of years, law, testimony,
    weeks, and jubilees from creation to the renewal of heaven and earth, the sanctuary
    on Mount Zion, and renewed luminaries for the healing, peace, and blessing of
    the elect of Israel. The following section heading introduces the twenty-two works
    of creation in six days and the institution of the Sabbath, observed by the highest
    angels and later associated with Israel. The angel of the presence then speaks
    to Moses according to the Lord’s word and commands him to write.
