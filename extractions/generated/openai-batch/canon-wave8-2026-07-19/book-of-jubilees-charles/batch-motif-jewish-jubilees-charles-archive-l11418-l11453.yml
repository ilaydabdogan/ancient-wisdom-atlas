  summary: The passage explains a tradition in which Palestine or Judaea fell by lot
    to Arpachshad or Shem, while Canaan received another region. Canaan wrongfully
    seized Palestine/Judaea. Cited sources describe God delaying punishment to allow
    repentance and restitution, followed by later divine vengeance for oath transgression.
    Other cited traditions describe Canaan seizing better land toward Lebanon and
    Shem receiving a central region containing Judaea.
