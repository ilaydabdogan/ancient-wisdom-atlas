  summary: The passage explains Adam’s and his wife’s entry into the garden of Eden
    after forty and eighty days, and uses these primordial intervals to ground laws
    on childbirth impurity and purification written on the heavenly tables. It also
    describes Eden and its trees as holy, and includes notes comparing this tradition
    with Philo, Syncellus, the Book of Adam and Eve, Glycas, Beer, and Midrash Tadshe.
