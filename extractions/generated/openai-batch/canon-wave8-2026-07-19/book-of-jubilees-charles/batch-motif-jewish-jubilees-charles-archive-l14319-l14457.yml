canonical_text:
  quote: ''
  summary: A speaker before God proposes that Abraham be commanded to offer Isaac.
    The Lord knows Abraham has been faithful through earlier trials. God then calls
    Abraham and commands him to take Isaac to a high country and offer him on a mountain.
    Abraham prepares the journey, leaves his attendants at a well, proceeds with Isaac
    carrying wood while Abraham carries fire and knife, answers Isaac’s question about
    the missing sheep, builds an altar, binds Isaac, and reaches for the knife.
  language: English
  quote_policy: summarized
