canonical_text:
  quote: ''
  summary: 'The passage first describes Judah lamenting and supplicating after a transgression,
    receiving a dream message of forgiveness, and a command that sexual uncleanness
    involving a mother-in-law or daughter-in-law be punished by burning. It then turns
    to famine: rain fails, the earth becomes barren, Egypt has stored food under Joseph,
    Egyptians buy grain, Jacob sends ten sons to Egypt for food while keeping Benjamin
    back, and Joseph recognizes the arrivals though they do not recognize him.'
  language: English
  quote_policy: summarized
