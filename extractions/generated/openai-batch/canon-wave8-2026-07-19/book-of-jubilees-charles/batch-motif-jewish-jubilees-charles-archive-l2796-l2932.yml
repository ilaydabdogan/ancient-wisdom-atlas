canonical_text:
  quote: ''
  summary: This introduction section surveys Jewish, Samaritan, and Christian writings
    that share material with, cite, or reproduce Jubilees. It notes parallels with
    Midrash Tadshe, the Book of Jashar, and the Samaritan Chronicle; a Samaritan calendrical
    claim connected with Noah in the Ark; patristic citations about Cain and Abel,
    the wives or sisters of Cain and Seth, and postmortem destinies and a contest
    between Michael and Satan over Moses’ soul.
  language: English with Greek and Latin citation fragments
  quote_policy: summarized
