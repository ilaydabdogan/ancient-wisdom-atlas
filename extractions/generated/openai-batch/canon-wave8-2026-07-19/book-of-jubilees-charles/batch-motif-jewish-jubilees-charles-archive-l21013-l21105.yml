canonical_text:
  quote: ''
  summary: Rebecca commands Jacob to honor his father and brother. Jacob accepts and
    denies any perversity in himself. Rebecca says she will die that year because
    she has seen the day of her death in a dream, while Jacob doubts this because
    she appears strong. Rebecca then asks Isaac to make Esau swear not to harm Jacob,
    describing Esau as hostile and contrasting him with Jacob's upright conduct. Isaac
    acknowledges Jacob's honor toward the parents and says his former preference for
    Esau as first-born has changed because of Esau's evil deeds.
  language: English
  quote_policy: summarized
