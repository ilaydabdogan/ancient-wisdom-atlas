canonical_text:
  quote: ''
  summary: Noah's sons report that demons are misleading, blinding, and killing Noah's
    descendants. Noah prays to God, recalls his rescue from the flood, asks blessing
    for his sons, and asks that wicked spirits be prevented from ruling over or destroying
    the righteous. He asks that the living spirits be imprisoned in a place of condemnation.
    God orders the spirits bound, and Mastema, chief of the spirits, petitions that
    some remain under his authority.
  language: English
  quote_policy: summarized
