canonical_text:
  quote: ''
  summary: Esau's sons are angered that Jacob has received the elder's portion. Esau
    explains the sale of his birthright, Jacob's acquisition of the blessing, and
    the oath of peace between the brothers. The sons reject peace, plan to attack
    and exterminate Jacob and his sons, recruit foreign fighting men, and force Esau
    under threat to lead them against Jacob.
