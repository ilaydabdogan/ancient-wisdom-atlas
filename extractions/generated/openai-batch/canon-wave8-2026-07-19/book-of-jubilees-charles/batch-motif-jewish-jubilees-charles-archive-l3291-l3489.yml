canonical_text:
  quote: ''
  summary: A scholarly introduction compares phrases and themes in Jubilees with New
    Testament passages, then summarizes Jubilees' angelology, demonology, and views
    of the Messiah and Messianic kingdom. It notes Mastema's role in temptation, Abraham's
    heavenly record, Noah's sermon, cosmic renewal, angels over natural phenomena,
    fallen watchers, demons, Satan, final judgment, and a temporary Messianic kingdom
    marked by peace and restraint of evil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a list of New Testament phrases alongside Jubilees passages,
    including references to perdition, genealogies, temptation, Abraham's righteousness,
    Noah, renewed heavens and earth, a thousand-year day, kingdom and priests, and
    thunder/lightning imagery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introduction states that Pauline phrases form a description of a large
    portion of Jubilees and suggests that “old wives' fables” may allude to the large
    role played by women in Jubilees.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mastema is described as suggesting the temptation of Abraham to sacrifice
    Isaac and as hardening the hearts of the Egyptians.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Abraham is described as believing the Lord, being counted righteous, being
    found faithful, and being recorded on heavenly tables as the friend of God.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that Jubilees vii.20-39 contains Noah's sermon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage cites Jubilees as saying that the heavens and earth shall be renewed
    and notes a statement about one day being as a thousand years.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage cites Jubilees for the phrase “a kingdom and priests” and for
    angels associated with voices, thunder, and lightning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The angelology section distinguishes angels of the presence and sanctification
    from lower angels set over natural phenomena.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The natural-phenomena angels do not observe the Sabbath as the higher orders
    do, because they are always engaged in their duties.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Revelation refers to angels of winds, fire, and waters, and
    that Jubilees mentions guardian angels of individuals.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The fallen watchers are described as angels sent down to instruct mankind
    who fell by lusting after the daughters of men and whose fall and punishment are
    recorded in Jubilees.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Demons are described as spirits from the souls of giants, the children of
    fallen angels.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The demons attack and rule over men, aim to corrupt, lead astray, and destroy
    the wicked, and are subject to Mastema or Satan.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage says that people sacrifice to demons as gods and that demons continue
    their work until the judgment of Mastema or the setting up of the Messianic kingdom.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:15
  text: The passage states that in the New Testament demons are disembodied spirits,
    Satan is their chief, they are treated as heathen divinities, and final punishment
    is delayed until judgment.
  category: other
  evidence_refs:
  - ev:12
- id: obs:16
  text: The author of Jubilees is described as upholding the Maccabean dynasty while
    retaining hope for a Messiah from Judah, with only one important reference to
    that Messiah.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: The Messianic kingdom is described as arising gradually through spiritual
    development and transformation of nature; its members attain a thousand years
    in happiness and peace.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: During the Messianic kingdom the powers of evil are restrained, and the last
    judgment is apparently placed at its close.
  category: sequence
  evidence_refs:
  - ev:14
