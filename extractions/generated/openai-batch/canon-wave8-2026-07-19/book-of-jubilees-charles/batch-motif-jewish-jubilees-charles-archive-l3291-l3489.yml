comparison_claims:
- id: claim:1
  claim: The introduction asserts that Pauline phrases give a fitting description
    of much of Jubilees, while treating the 'old wives' fables' connection as only
    possible.
  claim_level: linguistic_similarity
  target: Pauline epistles and Jubilees
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses cautious language for the allusion to women and does
    not establish dependence.
- id: claim:2
  claim: The passage compares James' statement that God tempts no one with Jubilees'
    representation of Mastema as the one suggesting Abraham's temptation.
  claim_level: same_function
  target: James i.13 and Jubilees xvii.16
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and theological; the passage does not
    claim direct borrowing.
- id: claim:3
  claim: The passage presents Jubilees' angels over natural phenomena as parallel
    in function to Revelation's angels of winds, fire, and waters.
  claim_level: same_function
  target: Revelation's angels of winds, fire, and waters
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the angelic function of governing natural phenomena.
- id: claim:4
  claim: The passage compares Jubilees' guardian angels of individuals with New Testament
    references in Matthew and Acts.
  claim_level: same_function
  target: Matthew xviii.10 and Acts xii.15
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage notes the comparison but gives no extended narrative examples.
- id: claim:5
  claim: The passage identifies the angels in Jude and 2 Peter who did not keep their
    first estate with the angelic watchers of Jubilees who fell and were punished.
  claim_level: same_motif
  target: Jude 6 and 2 Peter ii.4 fallen angels
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is the introduction's scholarly identification; the extracted
    passage does not quote the full primary texts.
- id: claim:6
  claim: The passage says Jubilees' demonology largely reappears in the New Testament,
    including disembodied demons, Satan as chief, demonic divinization, delayed punishment,
    and Satan's binding at the Millennium.
  claim_level: same_function
  target: New Testament demonology
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison covers summarized features rather than word-for-word
    textual dependence.
- id: claim:7
  claim: The passage compares Jubilees' hope for a Messiah from Judah with the hope
    found in Ethiopic Enoch lxxxiii-xc.
  claim_level: same_motif
  target: Ethiopic Enoch lxxxiii-xc messianic hope
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states similarity of hope but does not detail the Enochic
    material.
- id: claim:8
  claim: The passage suggests a probable derivation of the temporary Messianic kingdom
    view from Mazdeism.
  claim_level: historical_contact
  target: Mazdeism
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: low
  limitations: The passage refers readers to another note for the derivation and gives
    no evidence for Mazdean influence within this excerpt.
