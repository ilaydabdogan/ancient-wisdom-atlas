  summary: The passage presents the Sabbath as a day sanctified after the six days
    of creation. Israel is commanded to keep it holy, avoid work and profanation,
    prepare necessities beforehand, and refrain from carrying or drawing water. Violations
    incur death or exclusion. The Sabbath is described as already observed in heaven
    before being made known on earth, and as specially connected with Israel rather
    than all peoples.
