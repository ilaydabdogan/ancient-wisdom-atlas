  summary: The passage is an introduction discussing the titles and designations of
    the Book of Jubilees, including Jubilees, Little Genesis, Apocalypse of Moses,
    and Testament of Moses. It explains the title Jubilees through the book’s division
    of history from creation to Sinai into forty-nine-year jubilee periods, its heptadic
    chronology, and its presentation of law as already operative before Sinai. It
    also notes Moses as recipient of disclosures, discusses circumcision as central
    to Jubilees, and compares its chronology with the Assumption of Moses.
  language: English with Greek and Hebrew title forms
