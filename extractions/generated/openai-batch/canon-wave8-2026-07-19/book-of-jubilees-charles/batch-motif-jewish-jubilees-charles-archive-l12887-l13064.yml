canonical_text:
  quote: "“a flame of fire passed between the pieces.”"
  summary: The Lord identifies himself to Abram as the one who brought him from Ur
    and promises the land to Abram and his descendants. Abram asks for assurance.
    The Lord commands a set of animals; Abram sacrifices them at the oak of Mamre,
    pours blood on the altar, divides the animals except the birds, and drives birds
    away from the pieces. At sunset Abram experiences ecstasy and great darkness,
    receives an oracle about his descendants’ future bondage, divine judgment on their
    oppressors, and their later return. A smoking furnace and flame pass between the
    pieces, and the Lord makes a covenant granting land to Abram’s seed.
  language: English
  quote_policy: quoted
