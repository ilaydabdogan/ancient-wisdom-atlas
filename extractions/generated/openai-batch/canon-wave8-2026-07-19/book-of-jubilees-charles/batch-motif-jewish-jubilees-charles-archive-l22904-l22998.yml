canonical_text:
  quote: "“fear not to go down into Egypt, for I will there make of thee a great nation.”"
  summary: Joseph discloses his identity to his brothers, explains the continuing
    famine and his divinely ordered role in preserving life, and sends provisions
    and wagons for Jacob. Jacob revives on seeing the wagons and resolves to see Joseph.
    Israel then journeys to the Well of the Oath, offers sacrifice, remembers the
    Bethel dream, waits for a vision, celebrates first-fruits during famine, and receives
    divine reassurance to go down into Egypt with a promise of becoming a great nation
    there.
