  quote: ''
  summary: The passage is an introduction discussing the Book of Jubilees' calendar
    and chronology, its use of the divine title “Most High God,” its claim that chronological
    knowledge derives from heavenly tables revealed to Moses by the angel of the presence,
    heptadic jubilee reckoning, civil and ecclesiastical 364-day years, and comparisons
    with Ethiopic Enoch, Samaritan, rabbinic, Assumption of Moses, and Seder Olam
    chronological traditions.
  language: English
  quote_policy: summarized
