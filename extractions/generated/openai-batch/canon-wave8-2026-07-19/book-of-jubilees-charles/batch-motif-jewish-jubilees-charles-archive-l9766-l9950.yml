canonical_text:
  quote: he transcribed it and sinned owing to it; for it contained the teaching of
    the Watchers
  summary: The passage describes a man transcribing a writing that contains the Watchers'
    teaching about observing celestial omens, concealing this from Noah out of fear,
    and then gives genealogical notices about wives and sons including Shelah, Eber,
    and Peleg. Peleg is named in connection with the beginning of the division of
    the earth among Noah's descendants. The children of Noah first divide the earth
    secretly, then Noah divides it into lots for Shem, Ham, and Japheth in the presence
    of one who had been sent.
  language: English
  quote_policy: quoted
