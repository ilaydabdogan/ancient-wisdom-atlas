canonical_text:
  quote: ''
  summary: The passage prescribes centralized Passover observance at the tabernacle
    or house of the Lord, including altar rites, unleavened bread, and annual instruction
    by Moses. It recalls the haste of departure from Egypt, gives laws concerning
    Sabbaths and jubilees, sets a chronology before Israel crosses the Jordan into
    Canaan, forecasts Israel and the land being cleansed with no Satan or evil one
    remaining, and states Sabbath-rest prohibitions with death as the penalty for
    desecration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Passover is to be celebrated before the tabernacle of the Lord or the
    house where His name dwells, not in the cities or any other place.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prescribed Passover rite includes slaughtering in the evening, offering
    blood on the threshold of the altar, placing fat on altar fire, and eating flesh
    roasted with fire in the sanctified court.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moses is told to command the children of Israel to observe the Passover ordinances
    every year and to keep the festival of unleavened bread for seven days with daily
    oblations before the Lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The festival is associated with Israel going forth from Egypt in haste and
    completing it on the shore of the sea before entering the wilderness of Shur.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The days of the Sabbaths, the Sabbaths of the land, and jubilee years are
    said to have been made known in the desert or on Mount Sinai, with fuller knowledge
    tied to entry into the land.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The chronology states that forty-nine jubilees, one week, and two years have
    elapsed from Adam until the present point, and forty years remain before crossing
    the Jordan westward into Canaan.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The jubilees will continue until Israel is cleansed from guilt, uncleanness,
    pollution, sin, and error, after which the land will be secure and clean, with
    no Satan or evil one remaining.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sabbath commandment states that six days are for labor and the seventh
    day is the Sabbath of the Lord, during which no work is to be done by Israelites,
    their children, servants, cattle, or resident sojourners.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that a person who works on the Sabbath or desecrates it,
    including by listed prohibited acts, shall die.
  category: action
  evidence_refs:
  - ev:6
