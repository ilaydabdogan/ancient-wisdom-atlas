- id: obs:1
  text: Sabbath observance is described as permitted to Israel alone, and the day
    is blessed and sanctified by the Creator as an enduring law and testimony for
    Israel’s generations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'On five days of the second week, classes of creatures are brought to Adam
    according to kinds and types: beasts, cattle, birds, land-moving things, and water-moving
    things.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Adam names the creatures, and the passage states that each creature’s name
    corresponds to what Adam called it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Adam sees the creatures as male and female but is alone and finds no helpmeet
    for himself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Lord says that it is not good for the man to be alone and proposes making
    a helpmeet for him.
  category: speech
