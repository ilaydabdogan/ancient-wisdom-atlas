canonical_text:
  quote: ''
  summary: The passage closes a Sabbath-law section by stating that Sabbath observance
    is granted to Israel alone and is an enduring law. It then narrates Adam receiving
    and naming the creatures, remaining without a helpmeet, the divine decision to
    make one, the creation of the woman from Adam’s rib during deep sleep, Adam’s
    recognition of her as bone and flesh, and the saying that man and wife become
    one flesh. The supplied notes and headings compare the narrative with Genesis
    and relate the timing to Levitical purification law.
  language: English
  quote_policy: summarized
