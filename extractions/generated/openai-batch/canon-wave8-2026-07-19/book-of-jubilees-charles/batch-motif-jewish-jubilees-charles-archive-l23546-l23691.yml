canonical_text:
  quote: ''
  summary: 'The passage recounts Israelite oppression in Egypt: after conflict involving
    Canaan and Egypt, Egypt''s king fears the growth of the children of Israel, imposes
    taskmasters and forced building labor, and later commands that male children be
    cast into the river. Moses is born during this tribulation, hidden by his mother,
    placed in a pitch-covered ark among the river flags, guarded by Miriam, rescued
    by Pharaoh''s daughter Tharmuth, and nursed by his mother Jochebed through Miriam''s
    mediation.'
  language: English
  quote_policy: summarized
