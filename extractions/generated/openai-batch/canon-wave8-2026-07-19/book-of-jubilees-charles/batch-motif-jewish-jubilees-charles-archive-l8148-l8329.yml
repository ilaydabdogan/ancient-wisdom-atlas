canonical_text:
  quote: ''
  summary: Noah leaves the ark on the new moon of the third month, builds an altar
    on a mountain, and offers atoning sacrifice for the earth after the flood. The
    Lord accepts the savour and makes a covenant promising no further flood to destroy
    the earth and preserving seasonal order. The passage also gives commands about
    multiplication, dominion and food, prohibition of blood-eating, punishment for
    bloodshed, and Noah and his sons swearing to the covenant. Supplied notes compare
    the passage with Genesis, Sinai legislation, and later ritual traditions.
  language: English
  quote_policy: summarized
