- id: obs:2
  text: Jacob asks how he can remember all that he read and saw, and the speaker says
    that he will bring all things to Jacob’s remembrance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker goes up from Jacob; Jacob wakes from sleep, remembers what he
    had read and seen, and writes down the words.
  category: sequence
  evidence_refs:
