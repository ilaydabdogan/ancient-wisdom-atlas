canonical_text:
  quote: ''
  summary: Jacob receives assurance that what he has seen and read will occur, is
    told to write it down, and is promised remembrance. After waking, he remembers
    and writes the revelation, celebrates and sacrifices for an added feast day called
    “Addition,” and the passage links the observance to heavenly tables. The passage
    then recounts Deborah’s death and commemorative burial, Rebecca’s return to Isaac,
    Rachel’s painful childbirth and the naming of Benjamin, Rachel’s death and burial,
    and Jacob’s pillar over her grave.
  language: English
  quote_policy: summarized
