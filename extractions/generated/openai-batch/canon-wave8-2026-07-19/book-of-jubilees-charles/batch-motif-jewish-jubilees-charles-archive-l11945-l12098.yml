canonical_text:
  quote: ''
  summary: The passage combines editorial notes on traditions about Abram, idolatry,
    and fire with the text in which Abram rejects spiritless handmade idols, exhorts
    worship of the God of heaven who sends rain and dew and gives life, hears his
    father acknowledge the truth while fearing the people, meets anger from his brothers,
    and then takes Sarai as wife.
  language: English, with Greek and Latin in editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says a tradition that Abram was cast into a fiery furnace
    arose from interpreting 'Ur' of the Chaldees as 'fire' and lists several Jewish
    sources where this fire tradition is recorded.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same editorial discussion says rabbinic debate existed over whether God
    Himself or an angel delivered Abram from the fire, and it notes that some sources
    do not contain the legend.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An editorial note reports a tradition in which Abram, granted knowledge of
    God at fourteen, admonishes his father for misleading people through idols.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says idols have no spirit, are dumb forms, mislead the heart,
    and should not be worshipped.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The God of heaven is described as causing rain and dew to descend, doing everything
    on earth, creating everything by His word, and being the source before whom all
    life exists.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the idols are the work of human hands, are carried on shoulders,
    give no help, and bring shame to their makers and misleading to worshippers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Abram's father says he also knows the truth but fears a people who have made
    him serve before the idols and who would kill him if he spoke against them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The father warns Abram to keep silent lest the people kill him, because their
    souls cleave to the idols to worship and honor them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The words are spoken to two brothers; they become angry, and the speaker keeps
    silent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the stated jubilee chronology, Abram takes Sarai, daughter of his father,
    as wife.
  category: action
  evidence_refs:
  - ev:8
