canonical_text:
  quote: ''
  summary: The passage describes divine permission for a tenth of malignant spirits
    to remain on earth under Satan while nine parts are sent to condemnation; an angel
    teaches Noah medicines and herbal remedies, which Noah writes in a book and gives
    to Shem. It then recounts Noah’s death and praise of Enoch’s testimony, followed
    by Peleg’s naming of Reu in connection with human wickedness at Shinar, where
    people build a city and tower to ascend into heaven using fired bricks and asphalt.
  language: English
