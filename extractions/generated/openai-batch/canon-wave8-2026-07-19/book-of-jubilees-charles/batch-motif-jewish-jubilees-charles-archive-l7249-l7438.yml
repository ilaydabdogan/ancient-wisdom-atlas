canonical_text:
  quote: ''
  summary: 'The passage describes Enoch as writing the judgment and wickedness of
    humanity, serving as a sign and witness until the day of condemnation, and burning
    acceptable incense on a mountain. It states that God brought flood waters upon
    Eden and names four holy places on earth: Eden, the Mount of the East, Sinai,
    and Zion, with Zion sanctified in the new creation for the cleansing of the earth.
    It then continues the genealogy from Methuselah through Lamech to Noah, including
    Noah’s comfort-name. Editorial notes compare these traditions with Ethiopic Enoch,
    Slavonic Enoch, and related texts, and discuss possible identifications of the
    Mount of the East.'
  language: English
  quote_policy: summarized
