  summary: A speaker instructs his son about acceptable altar woods, bodily washing
    before and after sacrifice, avoidance of blood, and rejection of gifts for bloodshed.
    The speaker warns against sinful human ways and divine punishment, then blesses
    the son and his descendants. The passage then introduces Isaac and Ishmael coming
    to Abraham for the feast of weeks, the first-fruits harvest feast.
  language: English
