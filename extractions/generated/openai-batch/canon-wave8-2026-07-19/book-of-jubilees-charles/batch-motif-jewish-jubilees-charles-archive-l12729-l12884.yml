canonical_text:
  quote: ''
  summary: The passage describes a perpetual ordinance of first-fruits and tithes
    for priests; the king of Sodom asking Abram for rescued persons while offering
    him the booty; Abram refusing Sodom's goods under oath except for provisions already
    eaten and the shares of his companions; and the beginning of a later scene in
    which the Lord speaks to Abram in a dream, promises protection and reward, rejects
    Eliezer as Abram's heir, promises an heir from Abram's own body and descendants
    like the stars, and Abram believes.
  language: English
  quote_policy: summarized
