canonical_text:
  quote: ''
  summary: 'The passage gives instructions for an annual first-fruits feast, then
    identifies the new moons of the first, fourth, seventh, and tenth months as days
    of remembrance and seasonal divisions. Noah ordains these dates as perpetual memorial
    feasts connected with flood events: the ark, the drying earth, the closing and
    opening of the abyssal waters, the descent of waters, and the appearance of mountain
    tops. A following fragment places these divisions on heavenly tables with thirteen
    weeks each.'
