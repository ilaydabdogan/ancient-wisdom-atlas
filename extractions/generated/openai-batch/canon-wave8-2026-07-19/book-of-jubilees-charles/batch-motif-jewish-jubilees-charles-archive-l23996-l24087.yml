canonical_text:
  quote: ''
  summary: The passage concludes that Israel did not leave Egypt empty-handed, then
    commands annual Passover observance on the fourteenth day of the first month.
    It recalls the night in Egypt when the powers of Mastéma were released to slay
    the first-born, while houses marked with the blood of a year-old lamb were passed
    over and saved. Egypt suffers grievous plague and mourning, while Israel eats
    the paschal lamb, drinks wine, blesses God, and prepares to leave bondage. The
    observance is described as an eternal ordinance engraved on the heavenly tables,
    with penalties for a clean person nearby who neglects it.
  language: English
  quote_policy: summarized
