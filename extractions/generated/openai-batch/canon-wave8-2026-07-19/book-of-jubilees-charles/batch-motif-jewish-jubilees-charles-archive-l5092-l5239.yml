  quote: ''
  summary: 'The passage presents a divine speech about the Sabbath: God commands Sabbath
    observance in heaven and on earth, separates and sanctifies a people from all
    peoples, chooses the seed of Jacob as firstborn, makes the Sabbath a sign for
    seventh-day observance, describes commands ascending as a sweet savour, and links
    twenty-two heads of mankind from Adam to Jacob with twenty-two works made before
    the seventh day. Supplied notes identify biblical parallels and mark a lacuna
    after verse 22.'
