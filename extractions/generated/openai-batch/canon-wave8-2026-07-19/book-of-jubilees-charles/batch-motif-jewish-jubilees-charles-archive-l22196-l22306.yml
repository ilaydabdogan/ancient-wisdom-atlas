  quote: Pharaoh dreamed two dreams in one night concerning a famine
  summary: Joseph's earlier prison interpretations are fulfilled; the butler later
    remembers him when Pharaoh's dream experts fail. Joseph interprets Pharaoh's two
    dreams as seven years of abundance followed by seven severe famine years, recommends
    storage of food, and is elevated by Pharaoh to authority over Egypt, where he
    rules uprightly with divine favor.
