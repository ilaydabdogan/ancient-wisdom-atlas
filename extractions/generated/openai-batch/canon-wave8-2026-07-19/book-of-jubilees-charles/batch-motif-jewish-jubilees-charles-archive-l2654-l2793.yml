canonical_text:
  quote: ''
  summary: 'The passage is an introductory scholarly discussion of Jubilees: it argues
    that Jubilees and the Testaments draw independently from common sources; characterizes
    the author as a strict Pharisee, supporter of the Maccabean pontificate, and probably
    a priest; and surveys possible relations between Jubilees and Wisdom, 4 Ezra,
    and other Jewish and Samaritan non-canonical literature. It highlights shared
    themes such as immortality, divine fatherhood, retaliation against Egypt for Hebrew
    children cast into the river, Moses receiving hidden and public words at Sinai,
    Enoch’s books of human deeds, and chronological links to Solomon’s building activity.'
  language: English with Greek and Latin quotations
  quote_policy: summarized
