canonical_text:
  quote: ''
  summary: Abram prays for deliverance from evil spirits and for guidance on whether
    to return to Ur or remain. The divine word, sent through the narrating angel,
    commands him to leave his country and family for a land God will show him, promises
    blessing, descendants, and divine protection, and then commands that his mouth
    and ears be opened so he can hear and speak the revealed Hebrew language. The
    angel teaches him Hebrew, Abram studies and transcribes the ancestral books, and
    he tells Terah he will leave Haran for Canaan.
  language: English
  quote_policy: summarized
