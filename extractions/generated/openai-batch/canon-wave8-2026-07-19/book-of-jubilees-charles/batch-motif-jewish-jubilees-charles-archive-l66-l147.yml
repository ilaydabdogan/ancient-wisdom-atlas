canonical_text:
  quote: ''
  summary: The preface describes the commentator's delayed work on Jubilees, his reassessment
    of its date and relation to the Testaments of the XII Patriarchs, his view of
    Jubilees as a Pharisaic work of the second century BCE, and the text's value for
    scholars of Genesis, Judaism, Christian origins, doctrine, and later Jewish tradition.
    It also notes prior scholarship on Ethiopic and Latin forms of the work and thanks
    a helper for Talmudic reference verification.
  language: English
