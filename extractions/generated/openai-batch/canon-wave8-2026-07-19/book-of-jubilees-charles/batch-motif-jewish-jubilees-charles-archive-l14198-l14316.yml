canonical_text:
  quote: "“Cast out this bondwoman and her son”"
  summary: Isaac is weaned and Abraham holds a banquet. Sarah sees Ishmael playing
    and dancing, becomes jealous, and asks Abraham to send Hagar and Ishmael away.
    God tells Abraham to listen to Sarah, promises that Isaac will carry Abraham’s
    named seed, and also promises that Ishmael will become a great nation. Abraham
    sends Hagar and the child away with bread and water. In the wilderness the water
    runs out, the child collapses, and Hagar weeps. An angel tells Hagar that God
    has heard her, and she sees a well and gives the child water. Ishmael grows, becomes
    an archer, receives a wife from Egypt, and has a son named Nebaioth. Heavenly
    voices then speak of Abraham’s faithfulness, and prince Mastémé arrives.
  language: English
  quote_policy: quoted
