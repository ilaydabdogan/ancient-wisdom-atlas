canonical_text:
  quote: ''
  summary: The passage describes an eschatological period in which wicked sinners/Gentiles
    violently oppress Israel/Jacob, blood is shed, the dead are unburied, and pleas
    for rescue fail. Children show signs of premature old age and diminished stature
    under tribulation. Then children begin studying the laws, seeking the commandments,
    and returning to righteousness. Human days increase toward a thousand years and
    beyond; old age is transformed into satisfied youthfulness; people complete their
    days in peace and joy; Satan and the evil destroyer are absent; and the Lord heals
    his servants.
