canonical_text:
  quote: ''
  summary: The passage recounts Sarah's death at Hebron, Abraham's patient mourning
    and purchase of the double cave as her burial place, the description of this as
    Abraham's tenth trial, and his heavenly record as friend of God. It then lists
    Isaac's marriage to Rebecca, Abraham's later marriage to Keturah and her sons,
    and the birth and early contrasting traits of Jacob and Esau.
