canonical_text:
  quote: ''
  summary: The passage recounts the births of several of Jacob's children through
    Bilhah, Zilpah, Leah, and Rachel, with dates assigned to each birth. Rachel bears
    Joseph after the Lord is said to be gracious to her and to open her womb. Jacob
    then asks Laban for his wives and sons so that he may return to his father Isaac,
    but Laban proposes continued service for wages. Jacob and Laban agree that marked
    lambs and kids will be Jacob's wages. The flocks produce marked offspring, Jacob's
    possessions multiply, and Laban and his sons envy him and watch him with hostile
    intent. Editorial notes compare several clauses with Genesis.
  language: English
  quote_policy: summarized
