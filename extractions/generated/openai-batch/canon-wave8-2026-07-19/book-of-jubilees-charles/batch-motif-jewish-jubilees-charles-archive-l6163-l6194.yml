  summary: 'The passage summarizes learned views about the primitive language of humanity:
    some writers and Eutychius favor Greek; an unnamed writer derives Adam''s name
    from Greek initials for the four quarters of the world; later Jewish sources are
    cited for Adam speaking Aramaic and for avoiding prayer in Aramaic because angels
    do not understand it; Abarbanel is cited for Hebrew as the language before Babel
    and the future language of Israelites.'
