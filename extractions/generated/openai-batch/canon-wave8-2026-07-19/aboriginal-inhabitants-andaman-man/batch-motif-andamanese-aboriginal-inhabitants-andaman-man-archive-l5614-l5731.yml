  summary: Ethnographic description of Andamanese marital relations, including jealousy
    in early marriage, parenthood as strengthening the marital bond, widowhood, remarriage
    customs, guardian arrangements for widows, residence after remarriage, and a correction
    of earlier claims about promiscuity, child marriage, bigamy, and concubinage.
  language: English
  quote_policy: summarized
