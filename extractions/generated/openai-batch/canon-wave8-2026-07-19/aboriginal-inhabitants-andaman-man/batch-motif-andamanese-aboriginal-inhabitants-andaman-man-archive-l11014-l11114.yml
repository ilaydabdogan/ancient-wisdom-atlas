canonical_text:
  quote: ''
  summary: The passage describes Andamanese manufacture of ropes, cords, nets, mats,
    bowstrings, ornaments, and weapon decorations from plant fibres. It records gendered
    craft roles, fibre preparation with Cyrena shells, drying by sun or fire, wax
    coating, and beliefs about yodba fibre contaminating turtle flesh and protecting
    swimmers from sharks or dangerous fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies alaha, pldita, and yodba as bark-fibre sources from
    trees or shrubs rather than animal substances.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alaha fibre is used to manufacture cinctures, harpoon-lines, and turtle-nets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: For alaha work, a male member procures a smooth branch, removes the bark,
    scrapes the cellular layer with a Cyrena shell, and dries the exposed fibres in
    the sun or before a fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ropemaker ties filaments to his toe, winds strands around them, may apply
    black wax for strength or durability, and uses a kudegbo implement to make cord.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pldita fibre is used for hand fishing-nets and sleeping-mats, and women are
    exclusively involved in its preparation and manufacture.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yodba fibre is used chiefly for bowstrings, reticules, necklaces, and twine
    for arrow fastenings, and its manufacture is not restricted to either sex.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before yodba is converted into twine or bowstrings, the plant and its fibres
    are believed to make turtle flesh uneatable if placed near it.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Turtle meat considered contaminated by yodba is thrown away, and a person
    who collected or prepared yodba may not cook turtle or join a turtling expedition
    for up to three days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sharks and other dangerous fish are said to detest yodba and Cyrena shells,
    so people attach one or both to their cinctures before swimming in places believed
    to be infested.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The yellow skin of the root of an orchid called rd is intertwined with yodba
    string in personal ornaments and sometimes in weapon decoration, but not where
    strength is required.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ordinary string is made by twisting prepared filaments on the thigh, rolling
    two lengths together, and smearing beeswax over the finished string.
  category: action
  evidence_refs:
  - ev:8
