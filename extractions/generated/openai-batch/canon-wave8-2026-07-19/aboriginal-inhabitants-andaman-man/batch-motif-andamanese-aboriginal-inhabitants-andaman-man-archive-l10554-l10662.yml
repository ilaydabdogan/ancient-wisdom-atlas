canonical_text:
  quote: ''
  summary: The passage describes Andamanese pottery finishing, drying, firing, sizes,
    portability, uses, non-specialization, disposal, and absence of painting, glazing,
    or figurative models. It also describes natural stones as hammers or anvils and
    Cyrena shells as highly versatile tools, with several comparative ethnographic
    notes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pot surfaces are engraved on both sides in wavy, checked, or striped designs
    using a pointed stick rather than a fingernail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The utensil is dried in the sun, or before a fire in wet or cloudy weather,
    and its position is changed so all parts receive heat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When hardened, the pot is baked with burning wood placed both inside and around
    it; cracked pots become useless, while uncracked pots cool and are ready for use.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: With good management a pot may be ready by the end of the day it is made;
    pots are described as one quality but differing in size.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Large pots are usually found in permanent encampments, while smaller pots
    are taken for migrations, including movements connected with death or entertainments
    elsewhere.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Medium-sized pots are usually fitted with rough basket-work casing for portability
    and partial protection.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ordinary pots hold about nine pints; larger kinds hold about twice that; very
    small vessels are used for making and using kangata-huj.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Except for the very small vessels named for kangata-huj, pottery is not reserved
    for special purposes and is used for festivals, migrations, and ordinary occasions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says pottery substitutes are not in use unless molluscs cooked
    in their own shells count as such; broken pottery is discarded as rubbish rather
    than buried in graves or under landmarks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Andamanese are described as not painting, varnishing, glazing, making
    porous cooling vessels, or making models of men or animals in pottery.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Natural stones are used as anvils and hammers.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: One or more Cyrena shells are carried or kept ready and used for many tasks,
    including preparing arrows, sharpening knives and a boar’s tusk tool, eating gravy,
    cutting leaves and meat joints, scraping plant fibre, making ornamental incisions,
    preparing a dance appendage, and planing.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A comparative note says people of the Fly River, New Guinea, carried a bamboo
    knife and sharpened it with a shell carried for that purpose.
  category: other
  evidence_refs:
  - ev:12
- id: obs:14
  text: A footnote presents a conjectural comparison with clay-lined basket vessels
    and vessel decorations associated with Cahokia and prehistoric Europe.
  category: other
  evidence_refs:
  - ev:13
