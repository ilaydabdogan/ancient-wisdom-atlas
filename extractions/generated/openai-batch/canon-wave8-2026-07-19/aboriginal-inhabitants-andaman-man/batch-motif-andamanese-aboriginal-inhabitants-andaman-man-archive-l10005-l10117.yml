canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Andamanese turtle, sting-ray, and fish
    capture methods: night harpooning from canoes, diving only after prey is transfixed,
    low-tide hand-net collecting, bow-and-arrow fishing, use of crushed plant seeds
    in creeks, large creek-mouth nets with float markers, and an opening note on canoe
    navigation claims.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Turtles are speared at night when they rise to breathe; the slight sound attracts
    the harpooner standing on the projecting prow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After spearing a turtle, the harpooner may jump into the water to prevent
    the barbed head from slipping out; in deep water he may leap feet first with spear
    in hand to transfix the animal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a sting-ray is speared, a party member seizes its tail, holds it between
    his teeth, and knocks off the spike or spikes before the animal is hauled in.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that Andamanese fishers do not dive after fish unless the
    fish has first been transfixed by an arrow or harpoon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At low water, women and children use hand-nets to capture fish and shellfish
    left in rocky foreshore hollows by receding waves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the turn of the tide, men stand waist-deep in water or pole canoes along
    the shore and shoot passing fish with bows and arrows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Crushed seeds of a plant called to'rog are thrown into creeks to drive fish
    and prawns from hiding places so they can be caught in positioned hand-nets.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Large nets formerly or remotely used for turtles and big fish are set at creek
    mouths, sunk with stones on one side and held up with floating sticks and cane-leaf
    markers on the other.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fish or turtles are driven toward the large nets by beating the water with
    bamboo shafts of turtle spears; movement of a marked floating log indicates the
    captive's location.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A footnote compares the to'rog seed practice with a Gaboon practice in which
    bruised leaves are thrown into pools and fish die or come to the surface.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The navigation section begins by noting that observers have praised Andamanese
    canoes' construction and speed, while the author questions these claims.
  category: speech
  evidence_refs:
  - ev:8
