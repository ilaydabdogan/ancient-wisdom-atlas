canonical_text:
  quote: ''
  summary: The passage describes Andamanese uses and non-uses of stones, hammers,
    whetstones, shells, and basket-work. It emphasizes that certain stone objects
    are utilitarian rather than superstitious, denies stone arrow-heads and similar
    stone tools, and gives a technical account of cane basket manufacture, varieties,
    and uses among named Andamanese groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whetstones and hammers are described as the only objects offered as mediums
    of exchange, but they have no great value, no associated superstition, and are
    discarded when no longer serviceable.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stones are described as not being used for cutting wood or bone; bone is usually
    crushed with a hammer for marrow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before iron, small holes were bored with bone or shell, rarely if ever with
    stone; no stone saw or scraper implement is reported, and shells are said to have
    generally served such purposes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Andamanese are reported to maintain that they never made arrow-heads,
    axes, adzes, or chisels of stone, even when iron was scarce.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fragments found in kitchen-middens are explained by the Andamanese as quartz
    flakes or broken pieces of cooking stones or hones thrown into rubbish after use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stones are explicitly said not to be regarded as thunderbolts or worn as amulets.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stones are said not to be placed in water before working, not to have holes
    bored in them, and not to be ground or polished.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Baskets are made from selected specimens of a common cane called fvdga-.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Basket construction involves cutting cane, shredding the outer skin into strips,
    splitting remaining cane, and weaving strips around ribs or stakes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: To form the basket base or “kick,” the secured stakes are placed over a small
    hole in the ground and held by the basket-maker’s heel while weaving begins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Basket handles are formed from bark of Melochia velutina, ornamented stripes
    are added, and no waterproofing method is known.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: When travelling, earthen vessels may be placed in a loose wicker casing to
    protect them and make them easier to carry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage distinguishes baskets made by the five .bd'jig tribes from those
    made by the .ye'rewa-, saying the latter are more neatly finished and have smaller
    openings.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: ".jarawa- baskets are described in a note as generally small at the base and
    usually unable to stand unless supported, because they lack a “kick.”"
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Baskets are used by men, women, and children for many purposes, last several
    months under rough usage, and are not used as strainers or colanders because a
    fine net serves that purpose.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A note states that Perna shells were formerly sharpened into arrow-heads and
    that adze blades were sometimes made of Pinna shells.
  category: object
  evidence_refs:
  - ev:11
