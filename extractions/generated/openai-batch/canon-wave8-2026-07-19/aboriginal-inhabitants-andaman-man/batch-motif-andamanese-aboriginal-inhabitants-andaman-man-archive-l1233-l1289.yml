  summary: The passage discusses kitchen-middens as evidence for long-term habitation
    of the Andaman Islands, corrects an earlier coastal-only assumption by noting
    inland jungle encampments and refuse heaps, describes a change in the social significance
    of midden formation after the introduction of dogs and iron-derived weapons, and
    gives uncertain population estimates and contact effects for Great Andaman and
    Jarawa communities.
