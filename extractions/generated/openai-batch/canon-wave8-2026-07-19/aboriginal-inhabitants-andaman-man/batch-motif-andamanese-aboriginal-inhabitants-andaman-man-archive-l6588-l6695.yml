canonical_text:
  quote: ''
  summary: The passage records Andamanese beliefs about warnings from dreams and sounds,
    a snake associated with red oxide and clay and deadly poison, bird omens of death,
    danger, enemies, friends, or encampments, a night whistling taboo linked to a
    demon, and a transition into discussion of supernatural beings, good and evil
    powers, creation, and a world beyond the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bad dreams, such as a canoe being dashed on a reef or an accident during pig-hunting,
    and the waking sound of two anchored canoes bumping together are treated as warnings
    requiring risk avoidance, commonly by remaining at home for two or three days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small striped snake called Id'raha- is said to produce streams of red oxide
    of iron and olive-coloured clay used by the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same snake is said, when disturbed, to eject a whitish fluid from its
    tail that is deadly, cannot be washed away, causes intense pain, and kills within
    a few hours.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Meeting a small unidentified bird called pi'chro'l- is regarded as ominous
    of an approaching death among the people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woodpecker tapping on a tree is interpreted as warning of the approach of
    u'chu-, described in a note as a legendary elephant.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The notes of the pai- and rateg'i- birds are taken as signs that enemies are
    nearby; travellers retrace their steps, while people in an encampment temporarily
    vacate huts and stay alert with weapons ready.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cry of the bird called che-ra- is interpreted as announcing an approaching
    visit by a friend.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cawing of a crow heard while travelling is taken to indicate proximity
    to an occupied or recently abandoned encampment; the author connects this belief
    with crows scavenging camping grounds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people are said never to whistle between sunset and sunrise because whistling
    during those hours attracts e'rem-chawgala.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Animals behaving in an unaccountable manner, especially at night, are said
    to be seeing the demon.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author states that no forms of worship or religious rites are found among
    the people, while also reporting beliefs concerning powers of good and evil, creation,
    and a world beyond the grave.
  category: other
  evidence_refs:
  - ev:7
