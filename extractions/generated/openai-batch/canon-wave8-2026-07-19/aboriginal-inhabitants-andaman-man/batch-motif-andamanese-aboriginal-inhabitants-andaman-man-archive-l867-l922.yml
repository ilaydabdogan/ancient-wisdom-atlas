canonical_text:
  quote: ''
  summary: The passage credits Mr. Homfray with conciliating tribal visitors to the
    Homes, supporting their welfare, gaining confidence, and aiding later research.
    It describes the Homes as places where members of different Great Andaman tribes
    met, intermarriage became more possible, feuds were settled, and colonial knowledge
    spread. The author then states that colonial attempts to change Andamanese life
    had mixed effects, including dependency, loss of hunting skill, health harms from
    jungle clearances and tobacco-smoking, and an incomplete reference to moral deterioration.
  language: English
  quote_policy: summarized
