canonical_text:
  quote: ''
  summary: The passage describes Andamanese food-processing practices, including eating
    marrow, turtle blood and fat, preserving food over fire or in bamboo, preparing
    seeds for the rains by boiling, burying, cleaning, and drying, and timing honey
    collection according to seasonal flowering and the waning moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brains and marrow are eaten; smaller bones may be crushed with teeth and larger
    bones broken with a stone hammer to extract marrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turtle blood is carefully not spilled, boiled in the turtle shell until thick,
    and eaten separately as a dainty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Turtle shells are put over fire to melt remaining fat, which is ladled into
    mouths with Cyrena shells; the shell is finally broken and divided so none is
    lost.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Turtle fat is also used in making kbi'ob- unguent and is valued highly enough
    that people may forgo eating it to preserve their supply.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Food may be preserved on a small grating above the hut fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Food may also be packed into heated bamboo, slowly heated over fire, sealed
    with leaves, stored, reheated, and then split open for eating; meat so prepared
    can keep for several days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Certain seeds are prepared for consumption during the rains by removing the
    husk, having people partially suck the pieces, half-boiling them, wrapping them
    in leaves, and burying them in moist soil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After several weeks and the onset of the monsoon, the buried seed deposits
    are dug up, washed free of decaying matter, dried in sun or over fire, stored
    in nets or leaves, and baked again before use.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Except for these seeds, no food is dried in the sun, and nothing is salted
    or intentionally smoked, though smoke exposure may occur through storage over
    fire.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yams and honey are abundant during the dry months, and the passage introduces
    honey procurement in relation to trees flowering in succession.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A large jungle tree called rdr- blooms at the close of the monsoon and is
    said to act beneficially as a purgative for bees before the honey season.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Successive flowering trees enable bees to produce large combs, and the height
    of the honey season is called lad' a chdu-.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the height of the honey season, bees are said to consume much honey on
    moonlight nights, so comb-gathering is avoided until the moon has waned.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A footnote cites Jean de Léry’s account of Indians of Brazil using a wooden
    grating on forked posts to keep game and fish.
  category: other
  evidence_refs:
  - ev:11
