canonical_text:
  quote: ''
  summary: The passage describes Andamanese material practices involving shells, skulls,
    animal parts, bamboo, painting tools, musical instruments, shelters, and the absence
    of leather-working. It emphasizes practical uses of shells and bamboo, replacement
    of some shell implements by iron, and non-use of caves, tree-tops, skins, thorns,
    or spines for dwellings or manufacture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Several shells are described as practical implements or vessels: Arca shells
    for finishing pottery, Pinna shells as receptacles and food plates, and Nautilus
    shells as drinking vessels.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage rejects the claim that human skulls are used as boxes; it says
    human skulls are kept and carried as mementoes of the departed, while animal skulls
    are displayed as hunting trophies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pinna and other shells are said to have formerly served as adze blades, but
    iron has replaced them; the passage reports no trace or tradition of stone being
    used for that purpose.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Animal-derived parts are described in weapon manufacture: sting-ray tail-root
    bone for fish-arrows and Perna shell valves formerly for wooden-headed arrows
    used in hunting and hostile expeditions.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bamboo is used for turtle-harpoon shafts, water-holders, cooked-food containers
    for travel, knives hardened over fire and sharpened with Cyrena shell, netting-needles,
    tongs, hooked poles, and arrow shafts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the Andamanese have not made simple musical instruments
    comparable to those of the Nicobarese, aside from a rude sounding board.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: A brush for painting stripes on baskets and baby-slings is made from a Pandanus
    fruit drupe after the pulp is extracted with a Cyrena shell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says animal skins, thorns, and tree spines are not used; caves,
    rock-shelters, and tree-tops are not used as dwellings.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: When travelling in bad weather or suddenly overtaken by storms, the people
    sometimes use buttress-like tree roots for shelter; palm leaves are used for thatching.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says there is no evidence that these people possessed the art
    of dressing and preparing skins for use.
  category: attribute
  evidence_refs:
  - ev:9
