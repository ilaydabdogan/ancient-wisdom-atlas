canonical_text:
  quote: ''
  summary: The passage combines a plate caption showing an Andamanese chief with bow
    and Andamanese man and woman with arrows, descriptive notes on hair, body paint,
    aging, development, and facial variation, and a discussion rejecting claims of
    mixed descent except for three mixed-parentage children who died young. It also
    defends the Andamanese descent of a named Rutland Island chief against claims
    that he was Indian.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies an Andamanese chief with a bow and an Andamanese
    man and woman showing arrows in profile.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that pigment used for body painting sometimes adheres accidentally
    to curly wigs, which are used for wiping or drying hands, but that natural colour
    is not intentionally altered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hair colour is described as varying from black to greyish-black and sooty;
    greying is said to begin around the fortieth year, while white hair is seldom
    seen.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says average life length is low, not much beyond twenty-two years,
    that fifty years is believed to be an extreme limit, and that more women than
    men reach that age.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that males attain puberty at about sixteen years and females
    not before fifteen, with full stature and bulk reached two or three years later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author notes diversity in facial type, reports another observer's comparisons
    to several racialized facial types, and rejects using this diversity as evidence
    of mixed descent.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that, except for three children of mixed parentage, no cross-breed
    examples are known among the tribes, and that these children did not survive beyond
    seven or eight years.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A chief of Rutland Island is named as maia .hvcla and also called munskl .bvela;
    the author rejects a published claim that he was probably a native of India.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that the three mixed-parentage children died by violence
    or neglect at the hands of male members of the tribe, not their mothers.
  category: sequence
  evidence_refs:
  - ev:9
