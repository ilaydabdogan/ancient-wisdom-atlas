canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese swimming and diving: swimming is generally
    common to both sexes and learned early by children, with some exceptions among
    interior residents; swimmers are noted more for endurance than speed. It describes
    the general use of the frog-stroke, feet-first diving, recovery of submerged objects,
    recreational sea diving after harpooned turtle or fish, rejection of an exaggerated
    report about capturing a huge fish by diving, and a timed test of three aryo''to
    youths remaining underwater.'
  language: English
  quote_policy: summarized
