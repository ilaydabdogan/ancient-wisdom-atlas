  summary: The author argues for urgent documentation of Andamanese customs and characteristics
    before population loss and cultural change. He rejects the claim that the islanders
    call themselves “Mincopies,” limits most remarks to the eight tribes of Great
    Andaman because Little Andaman information is difficult to verify, and reviews
    conflicting external descriptions of Andamanese physical form, including older
    hostile descriptions and the author’s corrective observations.
