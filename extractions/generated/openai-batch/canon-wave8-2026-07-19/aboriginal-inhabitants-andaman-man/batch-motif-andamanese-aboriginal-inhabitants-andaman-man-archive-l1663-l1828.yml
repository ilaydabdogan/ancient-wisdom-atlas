literal_observations:
- id: obs:1
  text: The passage disputes Dr. Dobson's claim of a remarkable contrast between male
    and female size, citing average height and weight measurements for men and women
    that the author says do not show a striking disparity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage rejects the repeated statement that Andamanese stature never exceeds
    five feet, noting measured males above that height and mentioning exceptional
    taller individuals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that women are said to lose youthful bodily form early
    because of early marriages, maternity, and duties, and that some become obese
    in maturity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Five youths were examined to estimate average temperature, pulse, and respiration
    while at rest, in shade, and before eating for several hours.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes the skin as smooth and greasy to the touch, with little
    or no surface hair, and notes multiple shades of complexion within individuals
    and across the group.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author states that colour variations are not confined to particular tribes
