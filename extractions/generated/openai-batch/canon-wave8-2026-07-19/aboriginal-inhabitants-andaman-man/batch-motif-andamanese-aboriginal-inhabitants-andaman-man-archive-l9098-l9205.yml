canonical_text:
  quote: ''
  summary: The passage describes Andamanese practices for cutting up, cooking, distributing,
    and eating animal flesh, especially pigs. It notes rules of distribution, cooking
    implements, ranked serving order, temporary abstention from kidney-fat and omentum
    by the young, preference for crackling, and the choice to boil pork when fear
    of demons is strong.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An animal may sometimes be cut up and distributed without even partial cooking;
    the distributor has a tacit obligation to give the slayer and himself the last
    two portions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small pigs caught alive may be kept and fattened before slaughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In pig preparation, entrails and organs are removed, replaced with selected
    leaves, and the leaves are set on fire before the carcass is placed on burning
    logs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The carcass is heated until bristles are singed and the skin can be scraped,
    then charred leaves are removed, joints are severed, and the carcass is cut up
    and distributed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: While cutting up the carcass, the operator may take choice morsels that are
    cooked to his liking as a perquisite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lining and flesh of the stomach and the cleaned skin of the entrails are
    consumed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The author reports that fish, flesh, and vegetables are not eaten until thoroughly
    cooked, except that turtle eggs may sometimes be eaten raw.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cooking generally takes place in an open space at one end of an encampment,
    while the Jarawa are said to have a separate hut used only for cooking.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cook is expected to taste a morsel before those present; if a chief is
    present he receives the first and largest share, followed by men, then women and
    children, with the remainder going to the distributor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cooking implements mentioned are a skewer and a pair of bamboo tongs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kidney-fat and omentum are described as luxuries from which the young of both
    sexes must abstain during a certain period.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lungs, liver, eyes, and crackling are eaten, and crackling is described as
    one of the choicest parts.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says people may risk offending the chdl by baking pigs rather
    than eating them boiled.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: When dread of demons is paramount, pork is boiled; pieces are rotated through
    small pots until thoroughly done so the flavor of the whole animal is equally
    distributed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Other methods include broiling a pig whole on burning logs, distributing portions
    among families for cooking in their own huts, or baking flesh in leaves with heated
    stones between layers of meat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: In leaf baking, the meat is wrapped so that juices do not dry up while every
    portion is thoroughly cooked.
  category: action
  evidence_refs:
  - ev:9
