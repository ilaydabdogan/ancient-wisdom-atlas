literal_observations:
- id: obs:1
  text: Before the author's occupation of the islands, the Andamanese are said to
    have possessed no dogs; by 1865 they had become aware of dogs' usefulness in the
    chase.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dogs are highly prized and accepted as gifts, allowed close domestic contact,
    but also subjected to severe training and commonly kept semi-starved to make them
    keener in hunting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Andamanese are described as borrowing whistling and naming practices for
    dogs, giving names such as Jack or Billy, addressing dogs as children, and having
    dogs that attack non-aboriginal strangers near the encampment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Meeting certain birds is regarded as a good omen, while meeting others has
    the opposite significance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The absence of migratory species at certain seasons is explained by saying
    that they are visiting adjacent islands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Andamanese have no knowledge of mythological animals
