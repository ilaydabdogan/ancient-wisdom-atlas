  quote: ''
  summary: The passage describes Andamanese hunting equipment and methods, communal
    rules for ownership and distribution of game, post-hunt feasting with song and
    dance, and turtle-hunting practices governed by tide, light, coastline, and species
    behavior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Birds and flying-foxes are sometimes shot, but not while flying or when an
    arrow might be difficult to recover.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunting gear includes bows and arrows, a hone, a Cyrena shell, an adze, and
    often a spear; a knife may be taken but is not essential.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunters do not use decoys, snares, pitfalls, or stratagems for deceiving
    game.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When hunting pigs without dogs, hunters follow tracks, try to surround the
    animal quietly, then rush forward yelling and shoot arrows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pig driving is often used near the coast and mangrove roots, where animals
    can become entangled or sink into soft soil.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ownership of a carcass goes to the person who inflicted the first serious
    wound.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cleaning, cooking, and quartering the animal may be done by volunteers, while
    the day's events are narrated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: People who remained at home share in the spoil, because they are understood
    to have contributed to the community's general needs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Less skilled or idle members are rarely mocked and are allowed to join the
    feast, because mockery could lead to quarrels.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A footnote says the chief is told about the hunting party's catch, and that
    bachelors' spoils are distributed by the chief's orders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a notably successful hunt, the most distinguished sportsman is expected
    to sing while the company dances and women join the chorus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some of the described practices apply to the aryd'to- as well as to the e'remtd-ga-,
    though the former hunt less often than they turtle or fish.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Turtle hunts take place during flood tide by day and night, with a favored
    interval between sunset and the rising of the waning moon.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: Hunters use phosphorescent light caused by canoe movement to discover and
    harpoon turtles before the turtles perceive their approach.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Rocky coastlines with little foreshore are selected because turtles are said
    to visit such places on dark nights to lay eggs.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: Sandy shallow-water localities are also preferred because dark objects can
    be seen clearly against the bottom.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:17
  text: The green turtle is hunted by day and night, while the hawkbill is said to
    be hunted only by day because it is not seen on dark nights.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: The practice of capturing turtles by turning them on shore is unknown in the
    described group, despite knowledge that turtles could be surprised there.
  category: action
  evidence_refs:
  - ev:13
