canonical_text:
  quote: ''
  summary: 'The passage describes Great Andaman canoes: their buoyancy, construction
    from hollowed trunks, use in turtling and coastal travel, anchors and paddles,
    and customary geometric ornamentation using limited pigments, shells, seeds, bones,
    and human remains.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says these canoes cannot sink because of the wood used; when capsized
    or filled by a heavy wave, occupants right them and bale out water while clinging
    to the sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Canoe-making is described as taking place mainly in August, September, and
    October, with about eight men spending a fortnight hollowing a dug-out and shaping
    its prow from a trunk 10 to 30 feet long.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The exterior, prow, and interior of the canoe are shaped with an adze; the
    passage states that fire is not used in the process at present and that no traditions
    support its former use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Canoes are described as thick enough at the bottom and water-level to withstand
    rough treatment and carry the spoils of successful turtling expeditions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The anchor is described as a heavy stone or lump of coral tied to a stout
    line; the author states that rafts are unknown at present and that no evidence
    of former use has been found, while a cited note records Colebrooke's contrary
    statement about bamboo rafts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Canoes are propelled along shore by the haft of a harpoon spear, and in deep
    water by paddles of variable size; women frequently assist in propulsion except
    when men are turtling.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says paddles are never made by women, but women are entrusted
    with ornamenting them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Andamanese are said to ornament utensils and weapons habitually, but not
    to represent natural objects or devise new patterns; they follow patterns prescribed
    by custom for each article.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ornamentation is executed with a Cyrena shell or painted with brick-red, white,
    and brown pigments, which the passage identifies as their only colours.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Small land and sea shells, seeds, and bones are prized for personal ornaments
    and for adorning weapons and implements, as well as human skulls and jawbones
    that are worn or carried.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The listed designs include chevrons, cross lines, parallel lines, and a parallel-line-and-zigzag
    pattern, with specified applications to bows, buckets, canoes, paddles, baskets,
    and other objects.
  category: object
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: A note cautions that the illustrated designs are neater and more mathematically
    precise than the actual patterns executed with sticks, shells, or fingers.
  category: speech
  evidence_refs:
  - ev:12
