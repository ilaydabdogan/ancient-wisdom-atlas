canonical_text:
  quote: ''
  summary: 'The passage describes the d''kd-ydp- as a probationary test involving
    periods of food abstinence, then gives a detailed account of the turtle gu''mul-
    ceremony: a novice breaks the turtle fast through a feast, anointing with turtle
    fat, silence, night watching, mourning, body painting, leaf objects, a strenuous
    dance, and subsequent guarding from possible harm or spirits. It also notes parallel
    procedures for young women with modified handling of ornaments and leaf aprons,
    and includes an authorial comparison to the Australian bora initiation ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The d'kd-ydp- is described as a test of endurance or self-denial for young
    persons and as evidence of fitness to support a family; it is divided into turtle,
    honey, and pig kidney-fat gu'mul- periods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the youth is allowed and agrees to break his turtle fast, friends arrange
    a feast consisting entirely of turtle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief or headman boils turtle fat in a pot and pours it over the seated
    lad’s head; men remove ornaments and rub the grease into his body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children cry during the rite because of the belief that resuming
    turtle after abstinence may cause madness, illness, or death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The novice is not to wash off the oil until at least late the next day and
    is fed turtle flesh, with additional turtle set aside for the next two or three
    days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The novice is led to his hut, seated cross-legged on Myristica longifolia
    leaves, supplied with food at his side, and attended by friends who enforce silence,
    meet his needs, and keep him from sleeping by singing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning female relatives weep over him, paint his ears and nearby
    parts, and then paint his body with alternating stripes of two compounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Large leaves are made into two broom-like bundles and placed in his hands,
    other leaves are placed in his waistbelt, and he dances strenuously while women
    keep time and initiated males may accompany him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the dance ends, the turtle gu'mul- is considered complete, but friends
    continue watching the new gu-ma for two or three days because of feared harm and
    possible attacks by evil spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The text says the same procedure applies to young women, except that matrons
    remove the novice’s ornaments while leaving some waistbelts and the leaf apron
    for decency; girls also receive a more substantial leaf apron for the final dance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The leaves of Myristica longifolia are said to be usually selected because
    the tree is associated with turtle-hunting, since paddles are made from its wood.
  category: relationship
  evidence_refs:
  - ev:8
