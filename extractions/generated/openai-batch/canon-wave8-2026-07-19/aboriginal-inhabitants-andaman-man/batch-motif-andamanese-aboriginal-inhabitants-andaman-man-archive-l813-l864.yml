canonical_text:
  quote: ''
  summary: The passage describes early conflict between the new colonial settlement
    and Andamanese inhabitants, including attacks, theft of tools and garden produce,
    punitive measures, and later attempts by Government to provide homes, food, medicine,
    and protection near the harbour. It then states that relations improved over time
    through treatment by named colonial intermediaries. A footnote describes four
    men and two women sent to Calcutta for modelling for an exhibition, where Bengali
    crowds viewed them, reportedly associating them with descendants of Rakshasas,
    and where the visitors requested payment for hair souvenirs and dance performances.
  language: English
