canonical_text:
  quote: ''
  summary: The passage reports Andamanese mythic traditions about remote ancestors.
    It summarizes a commonly received creation account in which Pu'higa creates the
    first man, .t&mo-, instructs him about fruit, fire, cooking, hunting, fishing,
    and other arts, and later gives the first couple a dialect regarded as the mother
    tongue. It records variant accounts of the first woman, the first children, changes
    to pigs, restrictions on wet-season night work to protect hudu beings, early canoes,
    and an etiological account of creek formation by a harpooned fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says mythic legends about remote ancestors are told to the young
    and are accepted as true, although recitals can cause mirth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says accounts of creation and human origins have some discrepancies
    but agree in main features.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the world had been made, Pu'higa is said to have created a first man
    named .t&mo-, described as black like present inhabitants, taller, and bearded.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pu'higa showed .t&mo- fruit-trees at .wbtademi- and told him not to eat certain
    fruits during the rains.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pu'higa taught .t&mo- how to obtain and use fire by stacking two kinds of
    wood and summoning Mother Sun to ignite the pile.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In another version, Pu'higa comes with a spirit or angel, .pu'nga .d'blola,
    to instruct .t&mo-; a pyre is prepared and kindled, and cooking is taught.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The first woman, chdn''a .e''lewadi, has variant origins: created by Pu''higa,
    found swimming and called ashore by .t&mo-, or arriving pregnant at Kyd Island
    and giving birth to children who became progenitors.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The descendants of the first parents are called .to'mola until the period
    of the Deluge, and .t&mo- and chdn'a .e'lewadi are said to have two sons and two
    daughters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When pigs multiplied and became troublesome, chdn'a .e'lewadi drilled holes
    in their heads and snouts, giving them hearing and smell; Pu'higa then covered
    the land with jungle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Pu'higa taught .t&mo- to make bows and arrows, hunt, make canoes and harpoons,
    and fish; he later instructed chdn'a .e'lewadi in basket-making, net-making, and
    the use of red ochre and white clay.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: ".t&mo- and chdn'a .e'lewadi were told not to work after sundown during wet
    months because noise would trouble the hudu beings under Pu'higa's protection."
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: When the first couple were united, Pu'higa gave them the .bo'jig-yd'b- dialect,
    described as the mother tongue from which other dialects arose.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The canoes of that time are said to have had no outriggers and to have been
    made by hollowing out Pandanus trunks.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Creeks are attributed to an event in which .t&mo- harpooned a large fish whose
