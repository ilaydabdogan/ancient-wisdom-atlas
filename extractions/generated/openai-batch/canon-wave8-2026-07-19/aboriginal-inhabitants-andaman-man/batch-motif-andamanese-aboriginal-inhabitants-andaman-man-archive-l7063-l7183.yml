candidate_motifs:
- id: motif:1
  label: First human and first parents
  taxonomy_refs: []
  basis: The passage names a first man created by Pu'higa and a first woman with several
    origin variants; the two are then treated as the first couple and parents of named
    children.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The first woman's origin is not uniform across versions reported in the
    passage.
- id: motif:2
  label: Culture-giving divine instructor
  taxonomy_refs:
  - culture_hero
  basis: Pu'higa teaches fire, cooking, hunting, fishing, canoe-making, harpoon-making,
    basket-making, net-making, use of red ochre and white clay, and language.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:11
  confidence: high
  cautions: The taxonomy label 'culture_hero' is used broadly here for a divine culture-giver;
    the passage presents Pu'higa as creator/instructor rather than as a trickster
    or heroic adventurer.
- id: motif:3
  label: Seasonal prohibition on eating certain fruit
  taxonomy_refs: []
  basis: Pu'higa tells .t&mo- not to partake of certain fruit-trees during the rains
    at the primordial place .wbtademi-.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives no fall, punishment, serpent, or transgression episode;
    it is a seasonal food restriction, not explicitly a forbidden-knowledge episode.
- id: motif:4
  label: Acquisition or teaching of fire and cooking
  taxonomy_refs: []
  basis: Fire is obtained through stacked wood and Mother Sun in one version, and
    through a pyre in a variant involving a spirit or angel; cooking instruction follows.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents instruction rather than theft or accidental discovery
    of fire.
- id: motif:5
  label: Etiology of animal senses and evasiveness
  taxonomy_refs: []
  basis: Pigs originally lack ears and noses and are easy to catch; chdn'a .e'lewadi
    drills holes to give hearing and smell, after which pigs become harder to catch
    in jungle.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: This is specific to pigs in the passage and should not be generalized
    to other animal-origin motifs without additional evidence.
- id: motif:6
  label: Origin of subsistence technologies
  taxonomy_refs: []
  basis: Pu'higa teaches bows, arrows, hunting, canoes, harpoons, fishing, basket-making,
    net-making, and use of red ochre and white clay.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage lists several arts but gives little narrative detail for each.
- id: motif:7
  label: Origin of mother tongue
  taxonomy_refs: []
  basis: Pu'higa gives the first couple the .bo'jig-yd'b- dialect, described as the
    mother tongue from which other dialects derive.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports a belief about dialect origins without narrating linguistic
    diversification in detail.
- id: motif:8
  label: Antediluvian descendants before the Deluge
  taxonomy_refs:
  - flood_and_renewal
  basis: The descendants of the first parents are said to be called .to'mola until
    the period of the Deluge.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The Deluge is only mentioned as a chronological boundary; no flood narrative,
    destruction, survival, or renewal is included in this passage.
- id: motif:9
  label: Taboo on night work to protect spirit beings
  taxonomy_refs: []
  basis: The first couple are told not to work after sundown in wet months because
    noise would cause the hudu beings' heads to ache.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The exact nature of the hudu beings is not explained in the passage.
- id: motif:10
  label: Etiological formation of creeks by a wounded fish
  taxonomy_refs: []
  basis: Creeks are explained as resulting from a large harpooned fish striking and
    breaking the shore with its snout.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage frames the event as a fortunate accident rather than a planned
    creation act.
comparison_claims:
- id: claim:1
  claim: The passage itself gives an authorial Eden analogy by glossing .wbtademi-
    as the 'Garden of Eden' and placing restricted fruit-trees there in the first-human
    narrative.
  claim_level: same_motif
  target: Garden of Eden / primordial garden with restricted fruit pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is an authorial gloss in the ethnographic text. The
    passage does not include a serpent, a fall, punishment for transgression, or forbidden
    knowledge; the restriction is seasonal.
- id: claim:2
  claim: A footnote in the passage notes a name similarity between the Andamanese
    first man .t&mo- and 'Tamoi' as the name of the first man among Brazilians.
  claim_level: linguistic_similarity
  target: Brazilian 'Tamoi' first-man name as cited in the passage footnote
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: low
  limitations: The footnote supplies only a name comparison and citation to Tylor;
    it gives no linguistic analysis, historical-contact evidence, or narrative comparison.
