canonical_text:
  quote: ''
  summary: The passage describes a youth's boar-related initiation ordeal involving
    pressure from a carcass, fat anointing, restricted speech and movement, ritual
    feeding, leaves, and dancing. It then summarizes marriage customs, including the
    asserted permanence of marriage, premarital conduct, affinity restrictions, pregnancy
    leading to marriage, and infant betrothal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief presses a boar carcass on the seated young man's shoulders, back,
    and limbs as a token that he will become or prove courageous and strong.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The animal is cut up, its melted fat is poured over and rubbed into the novice,
    and the novice is fed with reg-jvri.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the novice signals for water it is given, but until the following day he
    may not speak, rise, or sleep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two or three friends usually remain with the novice and respond to needs that
    he communicates by gestures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the morning, fresh leaves of the reg Id'kdchdl tree are placed in the youth's
    hands and waistbelt.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After receiving the leaves, the youth rises and dances until exhausted, as
    the passage says is done at the turtle feast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the month following the reg-jvri-gu'mul, young persons are called d
    kd-go i, glossed as 'one commencing to eat.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that, at the time of writing, youths do not have to undergo
    all these ordeals before marriage, though those who marry before doing so are
    expected to comply later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A note says that, in the woman's case, the sow carcass is not pressed on her
    limbs or body.
  category: other
  evidence_refs:
  - ev:10
- id: obs:10
  text: The author denies that marriage is treated as communal, temporary, or slave-taking,
    and states that divorce, bigamy, polygamy, and polyandry are unknown.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes conjugal fidelity until death as the rule among married
    persons.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage describes premarital sexual freedom among unmarried people but
    says unions are not permitted between persons known to be even distantly related.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a young woman is found pregnant, guardians try to identify the man named
    as her lover and persuade him to become her husband.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that parents and foster-parents can betroth children in
    infancy and that the contract must be fulfilled after marriageable age.
  category: relationship
  evidence_refs:
  - ev:9
