canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese social relations and domestic organization:
    marital affection and relative equality; gendered household, subsistence, craft,
    and childcare duties; care for dependents and fires by those at home; hospitality
    through surplus provisions; elder-directed migration; and gendered training of
    children.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most domestic duties are said to fall to women and children, but the passage
    states that the head of the family does not compel this and usually leads an active
    life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes marked equality and affection between husband and wife,
    with the husband’s authority characterized as more or less nominal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband’s duties are listed as hunting, fishing, turtling, collecting
    honey, constructing canoes, building better huts, and making bows, arrows, and
    other implements.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband is expected to help with children, fire, and materials for weapons
    and utensils, but procuring wood and water is described as normally feminine work
    and derogatory for men except in necessity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women are expected to know shaving, tattooing, and scarifying, and are described
    as preparing named materials, erecting the chdng-darangon, making personal ornaments
    and other objects, procuring certain food, cooking, and providing water and fuel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men and women who remain at home attend to the sick, infants, and other dependents,
    look after fires in huts, and protect the property of absent people if needed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each family customarily keeps provisions beyond its own needs for visiting
    friends, although the passage says much stored food is often wasted and only certain
    seeds are kept long-term.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Migrations and community-wide movements are arranged by the chief and elders;
    women are not consulted in such matters and carry the heaviest loads during marches
    so men can shoot or pursue animals encountered on the path.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Children are trained by parents or guardians: boys receive miniature weapons
    and accompany men on hunting and fishing expeditions, while girls are taught by
    mothers or female guardians the duties regarded as pertaining to their sex.'
  category: sequence
  evidence_refs:
  - ev:7
