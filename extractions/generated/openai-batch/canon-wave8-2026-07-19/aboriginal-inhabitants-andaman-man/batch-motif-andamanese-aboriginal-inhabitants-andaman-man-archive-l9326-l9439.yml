canonical_text:
  quote: ''
  summary: The passage describes Andamanese honey gathering with a chewed plant used
    to repel bees; seasonal honey availability and sale; general and personal food
    taboos; initiation-based permission to eat dugong or porpoise; restrictions on
    eating arrangements; and pregnancy-related abstentions by a woman and, later,
    her husband. A footnote compares paternal abstinence affecting infants among the
    Abipones and in the Antilles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before raiding hives, Andamanese gather a plant called jvni-, strip its leaves,
    chew the stem, smear the extracted essence on their bodies, and fill the mouth
    with the same juice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chewed plant is used to repel bees by odor emitted from the mouth as a
    fine spray and by odor attached to the bodies of the honey takers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Small combs of white and black honey are available until about September,
    while certain trees continue to blossom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Honey obtained by the aborigines was sold to free residents at Port Blair
    and stored in barrels and bottles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain foods are generally avoided during named periods or conditions, including
    initiatory restrictions, seasonal restrictions said to obey Pu'luga's commands,
    and mourning restrictions.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Every Andamanese man and woman is prohibited throughout life from eating at
    least one fish or animal, often identified in childhood after an observed or imagined
    bodily disturbance.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: When no harmful food effect has occurred, a person may select a personal forbidden
    food, often choosing an undesirable fish such as shark or skate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A footnote states that Pu'luga is believed to punish someone who eats his
    personal yAt-tub- by causing skin or hair-related bodily harm.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A person who has not passed initiation may not eat dugong or porpoise.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: On first tasting dugong or porpoise, the novice must be fed by a friend or
    relative who has already passed the required ordeal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Outside initiatory ceremonies, the passage states that no prohibitions exist
    regarding people feeding themselves or touching others' food.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: After marriage, only husband and wife may eat together; childless widows and
    widowers usually eat with unmarried persons of their respective sexes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A pregnant woman abstains from pork, turtle, honey, iguana, and paradoxurus.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After a time, the pregnant woman's husband also abstains from iguana and paradoxurus
    because the embryo is believed to suffer if he eats them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A footnote compares this belief with reported practices among the Abipones
    and in the Antilles, where paternal conduct or foods are said to affect an infant
    or expected child.
  category: relationship
  evidence_refs:
  - ev:10
