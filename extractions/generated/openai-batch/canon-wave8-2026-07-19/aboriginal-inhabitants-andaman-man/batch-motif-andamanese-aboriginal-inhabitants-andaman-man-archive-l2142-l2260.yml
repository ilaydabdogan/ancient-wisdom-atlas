canonical_text:
  quote: ''
  summary: The passage gives ethnographic observations on Andamanese reproduction,
    childbirth, nursing, bodily abnormalities, illness, mortality, and care for vulnerable
    persons. It reports marriage ages, family size, rarity and unfavorable regard
    of twins, prolonged breastfeeding, communal nursing, limited use of reproductive
    interventions, rare abnormalities, care for the sick and helpless, and high mortality
    from chest and febrile disorders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriages are reported as occurring after both parties have reached maturity,
    with bridegrooms usually aged 18 to 22 and brides usually aged 16 to 20.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a slight predominance of female over male births, an average
    of three or four children to the same parents, and a largest known family of six
    children, three of whom reached maturity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note states that more children are said to be born during the rains than
    during any other season.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Twins are described as rare; no recalled case had both twins surviving infancy,
    and twins were not favorably regarded. No case of triplets was known.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Births out of wedlock are described as discreditable; in the one known instance,
    the parents married immediately afterward and the child was not treated differently.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women are said not to wean babies while they are able to suckle them, and
    the two youngest children may be seen together at the mother’s breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nursing women are said to relieve mothers at frequent intervals as a compliment;
    the author connects this practice with infant ailment and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Deaths from violence and accident are estimated at four or five percent; barrenness
    and stillbirth are rare, and no drugs or contrivances are used to increase or
    limit reproduction.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage records bodily observations including frequent excessive fat development
    around the gluteal region in adult women and rare or unknown instances of several
    abnormalities.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that no idiots, maniacs, or lunatics had been observed
    and explains this was not because such persons were killed or confined; care was
    paid to the sick, aged, and helpless.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Andamanese persons are described as wasting rapidly in sickness and regaining
    flesh readily when convalescent, but as readily succumbing to diseases, especially
    febrile disorders linked to malaria and chest complaints.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Pulmonary consumption and other pectoral diseases are described as major causes
    of mortality, especially among people living in homes near settlements; modifying
    clothing rules is reported to have improved health.
  category: other
  evidence_refs:
  - ev:8
