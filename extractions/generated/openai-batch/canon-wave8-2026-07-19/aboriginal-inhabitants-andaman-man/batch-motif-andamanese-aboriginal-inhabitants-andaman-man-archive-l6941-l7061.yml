canonical_text:
  quote: ''
  summary: The passage summarizes Andamanese beliefs about Hades, paradise, purgatory,
    souls, spirits, ancestor assistance, dream visions, resurrection, the new earth,
    and a final earthquake commanded by Pu'luga. It also denies worship of trees,
    stones, celestial bodies, or the moon, and introduces Pu'luga as creator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In .chd'itd'n-, no change in growth or age takes place; inhabitants remain
    as they were when they departed from earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Adult disembodied spirits are represented as hunting in a manner peculiar
    to spirits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spirits of animals and birds are sent to .chd'itd'n- for sport, while fish
    and turtle soul-forms remain in their native element and are preyed upon by .ju
    ru-win-.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Children who die before ceasing to be entirely dependent on their parents
    go to .chd'itd'n-, are placed under a rdu tree, and subsist on its fruit.
  category: action
  evidence_refs:
  - ev:2
