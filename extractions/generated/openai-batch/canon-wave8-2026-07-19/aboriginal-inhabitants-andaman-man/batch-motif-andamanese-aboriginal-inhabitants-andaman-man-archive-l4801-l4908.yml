canonical_text:
  quote: ''
  summary: The passage describes Andamanese adoption practices, including fosterage
    of children by visiting friends, reciprocal visiting by birth parents, expectations
    of kindness and filial obedience, further transfer of foster-children, and guardians’
    resistance to boys leaving home. It also describes young people’s secret attachments
    and a test in which a suspected couple are separately marked with red oxide and
    white clay so that a meeting at night may be detected the next morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that adoption is a custom among the Andamanese and cautions
    that it does not imply deficient affection for offspring.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A married man visiting hosts may ask to adopt one of their children, and the
    request is usually granted as a compliment and sign of friendship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After adoption, the child lives with the foster-father, while the birth parents
    continue to visit and may ask permission to take the child away briefly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may adopt any number of children, but is expected to treat them kindly
    and as his own sons and daughters; the adopted children are expected to give affection
    and obedience.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A foster-child may later be adopted by a friend of the foster-father, usually
    without consulting the birth parents, who are informed afterward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Foster-parents often oppose boys’ efforts to form their own homes because
    the boys are useful, especially after becoming skilled in hunting and turtling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Young people may conduct flirtations or deeper attachments without their guardians’
    knowledge until marriage becomes difficult to avoid.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When guardians suspect a hidden attachment, friends arrange for the suspected
    boy and girl to be separately painted with red oxide unguent and white clay before
    nightfall.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the suspected couple meet at night, the different paints can leave visible
    traces by morning and reveal the meeting.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If exposed, the youth is said to feel honor-bound through shame to break off
    the connection with the girl for at least some time.
  category: sequence
  evidence_refs:
  - ev:8
