  summary: The passage argues that the inhabitants of Great Andaman show similarities
    in appearance, language, legends, and customs suggesting common origin. It discusses
    uncertainty about whether communities called jarawa speak one or multiple dialects,
    groups Great Andaman dialects into three classes, and notes increased intercommunication
    among neighboring communities. A footnote reports a claim about distinguishing
    one tribe by physical features, while cautioning that the tribe is nearly extinct
    and the claim cannot be verified.
