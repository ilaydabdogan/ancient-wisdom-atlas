  quote: ''
  summary: Ethnographic notes describe Andamanese shaving practices, absence of intentional
    bodily deformations, an unintentional skull indentation associated with women’s
    load-bearing, practical systems of estimating size, weight, capacity, distance,
    and thirteen named periods of day and night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men only exceptionally operate on one another for shaving when a woman’s services
    are unavailable; shaving is described as a feminine occupation, using a quartz
    or glass flake as a razor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before shaving an infant, a mother usually moistens the head with milk from
    her breast; water is used for bigger children and adults.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that, apart from possible tattooing, Andamanese do not
    intentionally produce deformities, alter the nose shape, or perforate the septum
    for ornaments.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage contrasts Nicobarese practices of flattening children’s occiputs,
    blackening teeth from puberty, and enlarging ear-lobe perforations.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A skull indentation is reported in most Andamanese women and is attributed
    to carrying loads with a cane or cord across the front of the cranium, especially
    from an early age.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that Andamanese have no recognized standard of weights
    or measures and describe size, weight, capacity, and quantity by comparison with
    familiar seeds, fruits, carrying capacity, buckets, baskets, handfuls, or canoe-loads.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: No tallies or counters such as seeds or stones are used for counting articles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Short distances may be compared to a bowshot, while larger distances are described
    by reference to known places or as exceeding a day’s journey.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that Andamanese distinguish thirteen named periods of the
    day and night, but do not know the property of the sun-dial or indicate short
    intervals except with vague expressions.
  category: speech
  evidence_refs:
  - ev:9
