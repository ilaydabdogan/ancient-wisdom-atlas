canonical_text:
  quote: ''
  summary: The passage describes Andamanese childbirth aftercare, menstruation food
    abstentions, medical treatments for pain, skin disease, wounds, boils, digestive
    ailments, epilepsy, snakebite, centipede and scorpion bites, elephantiasis naming,
    bandaging, and physiognomic signs for emotions and mental states.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After childbirth, the woman is given water to drink and is fed meat-gravy
    and water in which shellfish or other fish have been boiled; later, if she wants,
    she may receive fish, shellfish, yams, or fruit, but not meat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the first two or three days after childbirth, the woman remains sitting
    and is propped by arranged articles forming a couch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that difficult delivery is not known among the people described.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: During menstruation, specified foods are avoided and other foods are eaten.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The custom of couvade or paternal lying-in is stated to be unknown among the
    Andamanese.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: For earache, headache, and toothache, recourse is first had to chauga-ta,
    then to scarification if pain continues and swelling occurs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: For skin disease, a large smooth stone warmed over a fire is applied to the
    affected parts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: For wounds from thorns, stones, shells, or similar objects, hot water is poured
    from a Cyrena shell, and the heated shell is applied to the wound; slight injuries
    may be treated with sea-bathing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A boil is treated by scarifying around the swelling and bathing it with chuinga
    lotion; chuinga is also taken for dysentery, while whitish clay is swallowed for
    diarrhoea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bee larvae from honeycombs, or fruits of two named trees when in season, are
    eaten to correct constipation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Epilepsy is treated by sprinkling the patient with cold water and scarifying
    the brow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When bitten by a snake, if the snake is killed, it is cut open and kidney
    fat is rubbed into the wound; if it is not captured, a ligament is tied above
    the bite and nearby flesh is scarified.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Centipede bites are treated with urine; scorpion bites are said to receive
    no attention because the scorpions are small and comparatively harmless.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bandages of leaves are applied to gunshot wounds, ulcers, fractures, sprains,
    and bruises.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage lists visible facial and bodily signs for good spirits, low spirits,
    grief, deep thought, astonishment, slyness, guilt, jealousy, disgust, shame, defiance,
    fright, and laughter.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
- id: obs:16
  text: Defiance is expressed by raising and slightly averting the head and slowly
    uttering a word glossed as equivalent to “try it on.”
  category: speech
  evidence_refs:
  - ev:11
