canonical_text:
  quote: ''
  summary: The passage describes reasons for camp migration connected with meal refuse;
    kitchen-middens and their relation to permanent or temporary camping grounds;
    three varieties of Andamanese huts and their construction by men or women; a small
    fire and smoke shelf used for food preservation; animal trophy adornments; and
    a correction of a prior report about sleeping holes, with a possible explanation
    involving children's mock burial play.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Migration is said to be frequently forced by failure to sweep away refuse
    from meals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kitchen-middens are described as numerous, often of remote origin, and associated
    with camping grounds that have been or remain more permanently occupied.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Where middens are absent, the passage treats this as evidence of temporary
    occupancy; refuse at such places is swept aside when space is needed for a dance,
    wedding, or other ceremony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Crows, hermit-crabs, and, more recently, dogs are named as scavengers of the
    habitations; the first two act after migration.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Three varieties of huts are named as occurring in permanent and temporary
    encampments of the eight Great Andaman tribes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The more durable hut type is made by men for permanent encampments and has
    four posts, rafters, transverse poles, and a palm-leaf thatched roof.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A second hut type is made by men for temporary homes lasting a few months,
    including during mourning, and is generally smaller and less neatly thatched.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The short-halt shelter is made by women from two posts, a connecting pole
    or stick, and overlapping palm leaves fixed in the ground to form a fairly rain-proof
    shelter for one or two persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A small fire is described as necessary to a hut, with a small platform or
    shelf above it for spare food preserved by smoke against insects.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Trophies of the chase, including skulls of pigs, turtles, and dugongs, are
    described as suspended from the front of the roof as adornment.
  category: object
  evidence_refs:
  - ev:7
  - ev:11
- id: obs:11
  text: The passage quotes Dr. Dobson as reporting temporary habitations made from
    holes in sand under overhanging rock, but the author rejects this as inconsistent
    with Andamanese sleeping practice.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: One possible explanation offered for holes scooped in sand is a children's
    game of mock burial.
  category: action
  evidence_refs:
  - ev:10
