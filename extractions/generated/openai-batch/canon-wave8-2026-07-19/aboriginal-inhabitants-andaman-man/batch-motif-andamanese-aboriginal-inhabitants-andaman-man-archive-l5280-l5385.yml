canonical_text:
  quote: ''
  summary: 'The passage describes stages of gu''mul rites: an obscure term linked
    to rainy-monsoon imagery and smearing with melted fat or honey; a cautionary case
    of a youth who ignored food restrictions; post-rite names and food permissions;
    continued restrictions; a honey-fast-breaking ceremony with silent bear-like eating
    and honey anointing; a bath; a next-morning water-splashing charm against a snake
    entering the stomach; female timing and pregnancy-related honey abstinence; and
    a final pig-hunt requirement involving a boar for a young man and a sow for females.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term gu'mul-le'ke is said to have an obscure origin; its literal translation
    is given as “rainy-monsoon devour-does,” and one proposed explanation connects
    it with the novice's sweaty or rain-like appearance after melted fat or honey
    has been poured and smeared on the body.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A youngster named Martin refused to follow the wishes of his friends, ate
    foods proscribed to people of his age, later fell sick and died, and others were
    persuaded that this happened because he failed to comply with ancient rites and
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the yd'dl-gu'mul, a youth is described as d'kd-gu'mul and addressed
    as gu'ma, while the girl is not given that designation, possibly because she receives
    a flower name at that life stage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the yd'dl-gu'mul, certain foods such as turtles' eggs and kidney-fat
    of ray-fish and turtle may again be eaten at the chief's bidding; other foods
    may be added in the first dry season with silence on first consumption, while
    fruit and pig flesh remain restricted for specified intervals.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: When the honey fast is broken, the novice is placed amid the group, a chief
    or elder gives him honeycomb, and he must eat silently without using his fingers,
    holding the comb to his mouth and using his teeth and lips.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief takes another honeycomb, squeezes it over the youth's head, rubs
    the honey into his body, and the proceedings are interrupted by a bath to remove
    honey that would attract ants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Early the next morning the lad decorates himself with Alpinia leaves and enters
    the sea or a creek up to his waist, where he locks his thumbs, keeps his hands
    open, splashes water over himself and bystanders, and sometimes ducks his head
    under the surface.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The water-splashing performance is considered a safeguard or charm against
    snakes; the onlookers say that Wd'ra-jobo will get inside the person, and they
    imagine the snake may enter the stomach and cause death if the splashing is not
    performed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: For females, the d'ja-gu'mul cannot take place until after the birth of the
    first child, and females must abstain from honey during each later pregnancy;
    a chief or elder, preferably a relative, officiates.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: About a year generally passes between the yd'dl-gu'mul and the reg-jvri-gu'mul;
    for the final step, friends and relatives go on a pig hunt, and the ceremony is
    postponed if unsuccessful, requiring a boar for a young man and a sow for females.
  category: sequence
  evidence_refs:
  - ev:10
