canonical_text:
  quote: ''
  summary: The author frames his observations as applying only to Andamanese communities
    considered unaffected by colonial influence, then describes the establishment
    and operation of a Ross Island Orphanage for aboriginal children. The passage
    recounts the children’s instruction, perceived aptitudes, craft production, and
    later outcomes after the Kidderpore ladies resigned, including girls being placed
    or married and older boys longing to return to their native jungles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that contact with the alien convict population has affected
    assessments of Andamanese social and moral virtues, and limits his observations
    to communities considered to be in a primitive state and unaffected by civilization.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The perceived success of earlier Homes led to the proposal to form a school
    or Orphanage for younger members of the aboriginal population.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In 1869, children obtained by Mr. Homfray from guardians or relatives were
    placed under a matron at the Orphanage on Ross Island.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1870, two ladies from the Kidderpore Asylum in Calcutta took charge of
    the Orphanage, which then had more than forty children of both sexes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children’s early instruction included neatness, cleanliness, the alphabet,
    needlework, and basket-making.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The children are described as intelligent, dexterous, amenable to discipline,
    and promising, with want of perseverance named as their chief fault.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the first year’s training, the lads’ baskets were sold locally for
    Rs. 100, while the girls earned money through needlework and fancy articles and
    made clothing for the whole party.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After two or three years, the Kidderpore ladies resigned; some girls were
    taken by residents who wanted to train them as servants, while others were soon
    married.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some boys who had been taken in hand at a relatively advanced age developed
    an intense desire to return to their native jungles despite discouragement.
  category: action
  evidence_refs:
  - ev:4
