canonical_text:
  quote: ''
  summary: 'The passage describes preparations and performance practices for an Andamanese
    festive entertainment: hosts prepare the clearing and provisions; visitors pause
    to rehearse and be painted; a night gathering takes place in a jungle clearing
    with women singing refrains, an audience marking time, a composer-conductor beating
    a sounding board, and men entering the arena for the refrain and dance. It also
    describes current male dance posture and notes that sounding boards resemble turtle
    carapaces.'
  language: English
  quote_policy: summarized
