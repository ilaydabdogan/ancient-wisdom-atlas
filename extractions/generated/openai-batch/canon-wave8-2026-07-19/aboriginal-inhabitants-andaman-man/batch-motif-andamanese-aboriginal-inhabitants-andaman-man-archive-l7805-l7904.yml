canonical_text:
  quote: ''
  summary: The passage describes Andamanese infant care and attire. It states that
    infanticide is unknown, infant mortality is attributed to excessive or injudicious
    care, women secure babies while travelling with a neck string tied to the infant’s
    wrists, and clothing is largely replaced by ornaments of leaves, bones, wood,
    shell, and cinctures. It distinguishes men’s Pandanus-leaf adornments, women’s
    leaf aprons and multiple waist cinctures, married women’s rogun, memorial wearing
    of ornaments of deceased relatives, and exchange of ornaments as keepsakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that infanticide is unknown among the Andamanese and attributes
    excessive infant mortality to injudicious but affectionate care.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When travelling, women fasten a string around their necks whose ends are attached
    to an infant’s wrists, and the infant is placed in a chip- to prevent a serious
    fall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that neither sex wears clothing in the ordinary sense, but
    that ornaments and cinctures of bone, wood, shell, and other materials function
    as substitutes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ornaments are not described as marks of rank or status, except for the
    rogun-.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: Manufacture of the ornaments is said always to devolve upon females.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men in full attire wear shredded bunches of Pandanus leaves at knees and wrists,
    a folded Pandanus leaf around the head, and a belt or cincture common to both
    sexes.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men may remove most adornments while hunting, retaining a belt or light cincture
    in which arrows, knives, or other portable objects can be inserted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women are described as never appearing without an o'bunga-, a small leaf apron
    held by the lowest bod-.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women usually wear several bod- cinctures around the waist, sometimes as many
    as eight.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Married women wear the rogun-, and pregnancy can alter the use of bods and
    rogun until after childbirth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Relatives of a deceased person commonly wear surviving ornaments of the deceased
    in memoriam.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: At a jeg-, females may exchange girdles and necklaces as keepsakes.
  category: action
  evidence_refs:
  - ev:4
