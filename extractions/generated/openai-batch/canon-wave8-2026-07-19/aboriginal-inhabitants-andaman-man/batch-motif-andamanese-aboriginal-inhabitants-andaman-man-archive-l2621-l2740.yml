canonical_text:
  quote: ''
  summary: The passage describes Andamanese expressions, gestures, postures, movement,
    climbing, rest and sleep positions, manual and foot dexterity, burden carrying,
    and a whistle-like sound made under load-bearing distress. It includes several
    comparisons with children elsewhere, natives of India, and Naganis in the Naga
    Hills.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When very angry, a man places his left hand palm-up between his teeth, glares
    at an object on the ground near the offender, raises a weapon with his right hand,
    and utters threatening words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When threatening another person, a man seizes a weapon or missile rather than
    clenching his fist, and states his intended injury with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dogged or obstinate expression is described as averting the head, closing
    the lips, lowering the eyes, ignoring others, and slightly frowning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sneering is described as clenching the teeth, slightly curling the upper lip,
    and fixing the eyes on an object near the addressee.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sulky children pout, frown, and make sounds of discontent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A person indicating inability to prevent or do something averts the head and
    pouts the lips, without shrugging the shoulders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Beckoning is performed by a vertical nod and an outstretched hand whose knuckle-up
    fingers wave inward; affirmation uses a vertical nod and negation uses a lateral
    head shake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The described gait is usually balanced; when stalking game, people go on tiptoe,
    and they point with one finger rather than an open hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In climbing a rope, creeper, branched tree, mast, or cocoa-nut tree, people
    use rapid hand-over-hand movement and assistance from the big and second toes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Young men and women sometimes twist their bodies side to side after rest or
    sedentary work, producing sounds like finger-joint cracking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Temporary rest after exertion is commonly taken by squatting on the heels;
    when very exhausted people sit or lie down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The usual sleep posture is lying on one side, preferably the right, with knees
    bent, one hand between the thighs, the other under the head, and the head raised
    on a bundle or sleeping mat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Feet are used to hold and pick up light objects; the great toe is described
    as considerably opposable, and heavy loads are preferably pushed rather than dragged.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A man's maximum ordinary burden is described as about forty pounds, sometimes
    carried for about fifteen miles through jungle in one day.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: 'Men and women carry loads by different cord placements: men place the strain
    across shoulders and back by a cord across the chest, while women bring the cord
    over the head and bend the back.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage reports a whistle-like or flute-like sound associated with distressed
    load-carrying among Naganis and says the same peculiarity occurs among Andamanese
    people of both sexes.
  category: speech
  evidence_refs:
  - ev:11
