canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese funerary practices: most corpses are
    taken from the encampment to a secluded jungle place for burial or placement on
    an elevated platform. Bodies are oriented eastward, farewells are made by blowing
    on the face, fire and water are placed at the grave, and markers and d''ra- are
    used. The departed spirit is thought to haunt the burial place and death encampment,
    causing temporary migration. After mourning, bones are cleaned at the sea-shore
    or a creek and may be worn or distributed as relics, including skulls and human-bone
    necklaces.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Infants are buried within the encampment, while others are carried to a distant
    secluded jungle spot for burial or placement on a platform.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A corpse may be carried on a man's back to the funeral destination.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For burial, a spot marked by a boulder or large tree is chosen, and a hole
    about four or five feet deep is dug with an adze.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body is lowered in a sitting posture facing east.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Those present lift the leaf covering from the head and take leave by blowing
    on the dead person's face.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the grave is filled, cords or canes are cut to loosen leaves and hasten
    decomposition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A fire is lit over the burial spot, and a nautilus shell filled with water
    plus an article belonging to the deceased are placed beside it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the platform method is used, a stage of sticks and boughs is built eight
    to twelve feet above the ground, generally in forked branches of a large tree,
    and the body is lashed to it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the platform, the head is slightly raised looking eastward, and leaves
    are adjusted to cover the body against birds and vermin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Two reasons are given for orienting the corpse toward the rising sun: to
    hasten dissolution and because jereg- or Hades, the destination of departed souls,
    is in the east.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The deceased's spirit is supposed to haunt both the burial place and the encampment
    where death occurred.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The community temporarily migrates to another camping ground after the funeral
    party returns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After mourning, men who assisted in the rites return to the burial place,
    destroy the d'ra-, and take the remains to the sea-shore or a creek for bone cleaning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cleaned bones are conveyed back to the old encampment, and the camp is restored
    to normal condition.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Grief displays are said to be partly intended to conciliate departed spirits
    and secure protection from misfortunes.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: For a childless young married couple, if one spouse dies, the survivor is
    not the chief mourner and does not assist at the obsequies.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: A relative may take possession of the skull and wear it until choosing to
    part with it or until asked by another family member.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Human bone necklaces are generally possessed by adults, and skulls found in
    encampments are worn in turn.
  category: object
  evidence_refs:
  - ev:11
