canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic description of Andamanese bows and arrows:
    former fish-bone or sting-ray arrowheads could cause severe wounds; outsiders
    had difficulty using the bows; large and small bows had different uses; several
    arrow types are named; arrow shafts, blades, barbs, seams, and sights are described
    in technical detail.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a belief is traceable to former use of fish-bone arrowheads,
    especially serrated sting-ray tail-bone, which could break off in flesh and lead
    to ulcers and death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Strangers who failed to bend Andamanese bows are said to have likely held
    the wrong end uppermost; Europeans could learn to use the bows after practice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Andamanese are described as especially skilled at rapid shooting and discharging
    the arrow with full force.
  category: attribute
  evidence_refs:
