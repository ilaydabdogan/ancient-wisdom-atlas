literal_observations:
- id: obs:1
  text: A quoted report says the western islands of the Andamans were frequented in
    the fine season by Malays, Chinese, and Burmese fishermen seeking beche-de-mer
    and edible birds’ nests.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same quoted report accuses these outsiders of carrying off children to
    be sold as slaves and recounts a former incident in which islanders were invited
    aboard a junk or prow, intoxicated, carried off, and sold at Acheen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The quoted report says the Andamanese retaliated against foreigners who fell
    into their power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another cited notice says Malays and Burmese formerly obtained edible birds’
    nests either by collecting them themselves or by receiving them from islanders
    in exchange for tobacco and similar items.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the Andamanese set no fixed value on property, rarely
    make items expressly for barter, and prefer to treat transactions as presentations
    with an expected equivalent return.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says many quarrels arise when the recipient of a presentation
    fails to make the expected return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Iron-pointed weapons, tools, and shell ornaments are eagerly accepted by the
    e’rem-tdga in exchange for things they can more easily procure; examples include
    an adze valued against bows, arrows, or labor to make a canoe or bucket.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says utensils, weapons, canoes, and similar goods are little cared
    for, often replaced, and discarded when no longer serviceable.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that there is no accumulation of the labor of former generations
    and no binding laws of inheritance; the nearest kin commonly takes a deceased
    person’s effects, which may later be distributed to friends in need.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says family members may use one another’s weapons, tools, and
    property, while items such as a cooking-pot, canoe, or sounding-board may function
    as quasi-public property within a community.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the Andamanese were ignorant of agriculture before the arrival
    of strangers, and that they prefer cultivated products but consider the effort
    required for cultivation not worthwhile.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The passage says the Andamanese have seen tillage performed by prisoners and
    therefore regard such labor as degrading and fit for people who have lost freedom.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage quotes Peschel to the effect that hunting offers strong enjoyment,
    whereas agriculture cannot compensate for the excitement of the chase.
  category: speech
  evidence_refs:
  - ev:11
