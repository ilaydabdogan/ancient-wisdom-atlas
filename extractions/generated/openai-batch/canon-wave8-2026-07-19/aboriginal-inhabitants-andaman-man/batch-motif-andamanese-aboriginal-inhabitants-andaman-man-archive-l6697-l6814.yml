literal_observations:
- id: obs:1
  text: The author reports that informants said accounts of Creation were handed down
    by the first parent 7'6'vio- (Adam) and his immediate descendants, and that superstitions
    and practices were traced to the days before the Flood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says legends about Creation, Fall, and Deluge were current, and
    that the Deluge was described as consequent on the Fall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pu'luga- is identified as a Supreme Being, while evil spirits are feared as
    ever present and watchful to injure people bodily.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pu'luga-'s appearance is said to be like fire, but he is now invisible; he
    is also said never to have been born and to be immortal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pu'luga- is said to have created the world and all animate and inanimate objects
    except the powers of evil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pu'luga- is described as omniscient during the day, angered by certain sins,
    pitiful toward pain or distress, and judge of each soul after death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pu'luga- is believed to live in a large stone house in the sky with a green
    wife whom he created for himself and who has names meaning Mother Freshwater Shrimp
    and Mother Eel.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pu'luga-'s family includes many children, all except the eldest being girls;
    these sky spirits and their mother sometimes throw fish and prawns into streams
    and the sea for people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pu'luga-'s son .plj-cho'r- is described as a sort of archangel who alone lives
    with his father and conveys his orders to the sky spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thunder is identified as Pu'luga-'s voice; during anger he leaves his house,
    blows, growls, and hurls burning faggots, described as thunderstorms and heavy
    squalls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Pu'luga- is said not to kill directly, but when a pig is badly quartered and
