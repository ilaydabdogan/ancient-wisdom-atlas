  summary: 'Introductory historical account of the British occupation and penal settlement
    of the Andaman Islands: after a commission''s recommendation, Captain H. Man was
    ordered to Port Blair to raise the British flag, take possession for the East
    India Company, and prepare for transported prisoners. The first 200 prisoners
    arrived under Dr. J. P. Walker. The passage then gives high early mortality figures
    and attributes them to penal-settlement conditions, tropical isolation, dense
    jungle and mangrove, swamps, and the author''s characterization of the Indigenous
    population as hostile.'
