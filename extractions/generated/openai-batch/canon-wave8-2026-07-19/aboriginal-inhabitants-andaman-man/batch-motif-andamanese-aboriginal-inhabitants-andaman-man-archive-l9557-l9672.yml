canonical_text:
  quote: ''
  summary: 'The passage describes practical Andamanese travel and hunting equipment:
    a smouldering log carried on longer absences, hunting stories, skull displays
    as signs of hunting success, bows, arrows, harpoons, fish-spears, pig-spears,
    craft details, comparisons of bow and fish-spear forms with neighboring island
    examples, and the author''s rejection of claims that arrows or spear-heads were
    poisoned.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When an absence of more than a few hours is expected, the party takes provisions
    and entrusts a smouldering log to one member, who must keep it from going out
    and make a blaze when fire is needed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A successful sportsman receives no immediate honours, but stories of extraordinary
    prowess are later told with embellishment for young people and strangers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some distant tribes with no dogs, or very few dogs, suspend the skulls of
    their victims from hut eaves or poles around huts, so that the number displayed
    gives an idea of hunting success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bows and arrows are used both for hunting game and attacking enemies, and
    their form is described as almost identical among the eight tribes of Great Andaman.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A harpoon is used for spearing turtles and large fish, and a pig-spear is
    described as the only other weapon, recently adopted because iron had become available
    near Port Blair.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A wooden fish-spear called ti'remo was observed in ye'rewa- canoes; it has
    eight long wooden spikes in a row and is intended for small fish.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Although an untrained observer may not notice differences among similar weapons,
    the aborigines detect individual peculiarities in the knotting of bow and arrow
    strings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Great Andaman bows, especially the southern bo'jig bows, are described
    as flattened S-shaped forms and are said to resemble bows from Mallicollo, New
    Hebrides, New Ireland, and a Banks Island specimen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mangrove wood is rarely used for bows except in toy bows for boys living on
    or near the coast, bamboo is said never to be used, and other trees are preferred.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author states that whalebone and sinew are not used to increase bow elasticity
    and that no evidence shows the use of poison on arrow or spear heads; Nux vomica
    is merely avoided as harmful or useless.
  category: attribute
  evidence_refs:
  - ev:10
