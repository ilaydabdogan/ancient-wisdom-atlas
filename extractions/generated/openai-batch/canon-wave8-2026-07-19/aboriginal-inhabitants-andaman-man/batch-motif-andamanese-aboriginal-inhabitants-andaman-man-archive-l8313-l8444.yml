canonical_text:
  quote: ''
  summary: The passage describes Andamanese terms for seasons, lunar phases, tides,
    cardinal directions, winds, clouds, Orion’s belt, and the Milky Way. It notes
    a north-east wind called the Creator’s wind because it comes from the heavenly
    region where a bridge between this world and the next is thought to be located,
    and it describes the Milky Way as a road used by angels. The passage then discusses
    trade, outside visitors, kidnapping by some traders, valued imports, and barter
    media.
  language: English
  quote_policy: summarized
