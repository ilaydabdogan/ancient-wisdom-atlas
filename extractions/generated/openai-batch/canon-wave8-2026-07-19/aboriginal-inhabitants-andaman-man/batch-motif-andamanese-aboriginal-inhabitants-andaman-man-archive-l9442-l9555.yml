canonical_text:
  quote: ''
  summary: The passage describes restrictions on direct address and touch between
    certain affinal relatives, avoidance practices concerning the recently dead, methods
    of warfare and raiding, treatment of wounded enemies, captives, and property,
    and hunting customs including post-hunt silence and the exclusion or limited inclusion
    of women and boys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man wishing to address a married woman younger than himself must communicate
    through a third person rather than directly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men and women are described as restricted from touching specified affinal
    relatives, including a younger brother’s wife, a wife’s sister, a husband’s elder
    brother, and related male in-laws.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Titles such as mala, mavola, and chawa cease to be applied after death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inquiries about a recently deceased person are answered in a subdued tone
    with expressions meaning that the person “was” or “is dead.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: For about the first year after death, deceased persons are referred to as
    little as possible and indicated by the tree or place where their remains are
    or were deposited.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: After some time, the term lachi, glossed as “the late,” is prefixed to the
    names of deceased countrymen and women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Disputes between members of different communities during visits may become
    tribal matters with serious consequences.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wounded persons in such conflicts risk being shot dead or otherwise killed
    if not removed quickly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bodies of victims are generally not mutilated except in exceptional cases
    of very grave aggravation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Assailants approach enemies stealthily and use the density of the jungle to
    their advantage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the assailants do not conceal their trail, wear no
    breastplate, use no shields, and do not construct earth-banks or other defenses
    for encampments.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Night attacks occur, but the favored times are daybreak when enemies are asleep
    and late hours when enemies are preparing or eating the evening meal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Women and children are exposed to the same danger as men during attacks, though
    killing them is not treated as a matter for boasting.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: An uninjured captured child is treated kindly in the hope that the child will
    eventually become a member of the captor’s tribe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Portable property of the defeated is appropriated, while remaining property
    is injured or destroyed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A hunter who kills a heavy animal far from home may cut off the tail or another
    portion to show its size and encourage others to help bring in the carcass.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Andamanese are described as keen huntsmen, and encampment sites are influenced
    by hunting opportunities.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage states that there are no omens, superstitions, or special ceremonies
    connected with hunting departures or returns, except a custom of glum silence
    after the day’s sport.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: The explanation given for the post-hunt silence is that it conveys an exaggerated
    idea of the fatigues endured for the general welfare.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:20
  text: Females take no part in hunting expeditions, and boys seldom accompany elders
    before about their twelfth year.
  category: relationship
  evidence_refs:
  - ev:14
