canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese iron and stone implement manufacture
    and use: cold hammering salvaged iron on stone anvils, continued use of stone
    implements, production and use of whetstones, quartz and glass flakes for shaving,
    tattooing, and scarifying, women’s role in flaking, cooking stones, and the statement
    that quartz is not used by them to make fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says smelting and forging were unknown arts to the people described,
    who had only comparatively recently become informed about iron and its uses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pieces of hoop-iron, keel-plate, stout wire, large nails, and similar materials
    are made into blades, adzes, arrow-heads, and pointed weapons.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Iron is reduced and shaped by repeated cold hammering with a hard smooth stone
    on a stone anvil, breaking off excess portions, and grinding the edge on a hone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some people living at Port Blair use old chisels to make arrow-heads and other
