canonical_text:
  quote: ''
  summary: The passage describes Andamanese treatments for fever, colds, coughs, rheumatism,
    paralysis, internal disease, and childbirth. It also describes beliefs about human-bone
    necklaces as disease-curing and spirit-protective objects, distinguishes skulls
    and jawbones as mementoes, and records pregnancy and delivery customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Andamanese people who had long contact with the observers are reported
    to have faith in European medicines, especially quinine for fever.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a cold in the head, people remain at home and nurse themselves while crouching
    over a fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a cough, the passage records drinking sea-water, chewing plant leaves
    and tying the chewed fibre around the neck, chewing a plant stem and swallowing
    its sap, and prescribing daily quantities of chuinga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: For rheumatism and paralysis, a bone necklace is tied around the affected
    parts, chuinga is rubbed in, warm water may be poured over the limbs, and the
    limbs may be shampooed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If other measures fail for rheumatism or paralysis, scarification is performed
    with a quartz or glass flake, usually by the sufferer’s wife or a near female
    relative.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In phthisis or internal-organ disease, the patient’s sufferings are attributed
    to the machinations of an evil one, and friends take steps to defeat those machinations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: For internal disease, one or more bone necklaces are fastened over the seat
    of pain, black beeswax is heated over a fire and passed over the flesh, pressure
    is applied by a same-sex relative or friend, the skin is sucked by an attendant,
    and scarification is used if symptoms worsen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sick are attended by friends, but the passage states that no charms except
    the bone necklace are used for illness and that no purification ceremonies occur
    after recovery.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Human-bone necklaces are believed to cure diseases and partly shield the wearer
    from evil spirits through the intervention of the disembodied spirit whose memory
    is respected.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Loose teeth from human skulls and jawbones may be strung as necklaces or included
    among broken bone pieces, and turtle bones may sometimes be added.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Skulls and jawbones are carried as mementoes and are not credited with special
    virtues.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: During pregnancy, women eat moderately but seek varied foods, tell their husbands
    what to procure, take active exercise, and consume small quantities of a named
    substance, actions linked in the passage to an easier childbirth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At childbirth, the husband and female friends attend the woman; she is placed
    in a sitting posture, the husband supports and presses her back, and female friends
    hold a leaf screen and assist with delivery and afterbirth removal.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The umbilical cord is severed with a Cyrena shell, though a steel blade is
    now often used, and the infant is washed in cold water and gently scraped with
    the shell.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage states that childbirth is not made public and that people whose
    services are not required continue their usual occupations.
  category: setting
  evidence_refs:
  - ev:8
