canonical_text:
  quote: ''
  summary: 'The passage reports several Andamanese legends: conflicting accounts of
    the origin of illumination, night, and the moon; a taboo on using the al''aha
    tree as turtle-cooking fuel and punishments for violating it; the origin of the
    evil spirits called .chol-; and a drought story in which a woodpecker tricks a
    toad, who drains the streams and later releases the water by dancing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage reports two divergent explanations concerning world illumination:
    one about the creation of the sun and moon at .t&mo-''s request, and another about
    night as a punishment after a caterpillar was killed.'
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: In one account, the sun and moon are created at .t&mo-'s request because fishing
    by night and hunting by day were impossible under prior conditions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the punishment account, the sun burns fiercely and causes distress before
    two women encounter a caterpillar and a plant called u'tura-.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two women vent their anger by destroying the caterpillar and the u'tura-
    plant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pu'luga- responds to the destruction by imposing a long period of darkness
    on the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chief mai'a Jcoiw&t- invents dancing and singing as a way to make Pu'luga-
    think people can still enjoy themselves without light.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Pu'luga- first grants alternating periods of day and night and later creates
    the moon to reduce the troubles caused by night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The account explains that the same word is used for caterpillar and night.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The al'aha- tree is valued because its bark fibre is used for turtle-harpoon
    lines, nets, and related implements.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Pu'luga- commands .to'mo- not to use al'aha- as fuel when cooking turtle,
    while allowing it to be burned for pigs or other animals.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The warning attached to the al'aha- taboo specifies bodily punishments and
    assigns enforcement by day to chan'a .bd'do- and by night to mava .b'gar-.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: Shortly before the Deluge, the .t&mola violate the injunction at night, and
    mava .b'gar- descends to inflict the threatened penalty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: mava .chol- steals a pig captured by mava .Mlw&t- and climbs into a gurjon-tree
    with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: mava .Mlw&t- / mava .koiwo't- plants spikes around the tree, forces the tree
    into the ground, and mava .chol- dies after leaping down onto the spikes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: mava .chol-'s disembodied spirit does not go to .chd'itd'n- but takes up residence
    on an invisible bridge.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: By Pu'luga-'s orders, descendants of mava .chol- are sent to the invisible
    bridge in the form of black birds with long tails.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: A woodpecker finds a black honeycomb in a hollow tree and invites a toad below
    to join the feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The woodpecker lowers a creeper and bucket for the toad but lets go when the
    toad nears the honeycomb, causing the toad to fall.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The angered toad drains streams across the island, causing distress to birds
    and other living creatures.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: The toad begins to dance, water flows from him, and the drought ends.
  category: sequence
  evidence_refs:
  - ev:7
