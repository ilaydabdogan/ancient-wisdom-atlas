candidate_motifs:
- id: motif:1
  label: Origin of night, day alternation, and moon through divine punishment and
    concession
  taxonomy_refs:
  - divine_judgment
  basis: The night-origin account links destroyed beings or plants to Pu'luga-'s punitive
    darkness, followed by the granting of alternating day and night and creation of
    the moon.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage also reports a conflicting account in which sun and moon are
    created at .t&mo-'s request; the two accounts should not be harmonized without
    review.
- id: motif:2
  label: Chief invents dance and song to alter a divine decision
  taxonomy_refs:
  - culture_hero
  basis: mai'a Jcoiw&t- invents dancing and singing as a practical strategy that leads
    Pu'luga- to reduce the punishment of darkness.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage frames the act as an expedient rather than explicitly naming
    the chief a culture hero.
- id: motif:3
  label: Taboo on ritual or practical misuse of a valued tree, enforced by supernatural
    punishment
  taxonomy_refs:
  - divine_judgment
  basis: Pu'luga- forbids use of al'aha- as turtle-cooking fuel, warns of severe penalties,
    and a nighttime enforcer punishes the .t&mola after violation.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explain why turtle cooking is singled out beyond
    the stated command.
- id: motif:4
  label: Origin of evil spirits from theft, violent death, and abnormal afterlife
    placement
  taxonomy_refs:
  - afterlife_journey_map
  basis: mava .chol- steals a pig, dies by impalement, and his spirit does not pass
    to Hades but stays on the invisible bridge; descendants are sent there as black
    birds.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The available taxonomy reference only approximately fits because the passage
    describes afterlife placement rather than a narrated journey map.
- id: motif:5
  label: Trickster action causing drought and accidental water release through dance
  taxonomy_refs:
  - trickster_boundary
  basis: The woodpecker tricks the toad, whose revenge drains the streams and causes
    drought; the toad's dancing releases the water and ends the drought.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage calls the woodpecker's act mischievous but does not identify
    a formal trickster figure.
- id: motif:6
  label: Water withheld by an offended animal and restored through bodily release
  taxonomy_refs: []
  basis: After being dropped by the woodpecker, the toad drains streams throughout
    the island and later releases the water from himself while dancing.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No precise supplied taxonomy motif family matches drought-water withholding
    without overextension.
comparison_claims:
- id: claim:1
  claim: 'Within the passage, two Andamanese accounts serve a similar explanatory
    function for light, night, or celestial illumination, but they give incompatible
    causes: creation at .t&mo-''s request versus night imposed as punishment after
    destruction of a caterpillar and plant.'
  claim_level: same_function
  target: Alternate Great Andamanese illumination/night-origin accounts in §31
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: high
  limitations: This is an internal comparison only; it does not imply historical contact,
    common inheritance, or an external motif parallel.
- id: claim:2
  claim: 'Dance functions in two separate legends as an action that changes an environmental
    or cosmic condition: the chief''s dance-and-song custom precedes restoration of
    day/night order, while the toad''s dance releases water and ends drought.'
  claim_level: same_function
  target: Dance in the night-restoration and drought-ending legends
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not explicitly compare these episodes; the claim is
    a cautious functional comparison based only on events in the supplied passage.
