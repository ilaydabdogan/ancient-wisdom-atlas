canonical_text:
  quote: ''
  summary: The passage describes practical fire use in Andamanese huts and travel,
    denies sacred household-fire rites and “oven-tree” institutions, and records beliefs
    about fire as protection from spirits, restrictions around moonrise and dawn,
    meteors as spirit-thrown faggots, and darkness as linked to ancestral misconduct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each occupied hut is said to contain a fire used for warmth, insect repulsion,
    cooking, and preserving provisions with smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that council fires and fires for special occasions are
    not institutional practices, and that household fire is not treated as sacred,
    familial, ritually polluting, or purifying.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fires are generally kindled by fanning embers with a frond and extinguished
    by pressing burning logs against a tree, canoe, stone, or similar object.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage rejects reports of Andamanese “oven-trees,” explaining charred
    tree hollows as traces from repeated temporary use of buttress-root shelters and
    fires.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women collect wood, but maintaining fires at home or while travelling may
    be done by persons of either sex who are less burdened or have leisure.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Matches introduced by outsiders are said to have impressed the Andamanese
    as evidence of the outsiders’ exceptional power and resources.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Fire is said to be believed to drive away evil spirits; burning logs are thrown
    into surrounding jungle at night when the approach of the dreaded .e'rem-chdu’gala
    is imagined.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: People leaving huts at night are said to take fire, and sometimes a torch,
    as protection against demons nearby.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Darkness is said to have been instituted because of the misconduct of two
    ancestors.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: During the first few evenings of the moon’s third quarter after sundown, people
    preserve silence, stop work or travel, and almost extinguish lights or fires to
    avoid displeasing mava Agar- (Mr. Moon).
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the moon has ascended a few degrees, people restore fires and resume
    occupations, considering the moon’s wishes sufficiently met.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The glowing appearance of the full moon near the horizon is said to indicate
    that mava Agar- is angry at neglected observances, and he may punish by withdrawing
    or diminishing his light.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Meteorolites are said to have no superstition attached, but shooting stars
    and meteors are feared as lighted faggots thrown by .e'rem-chdu’gala to locate
    people nearby.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: If away from camp when shooting stars or meteors appear, people are said to
    hide and remain silent briefly before resuming activity.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Between dawn and sunrise, only noiseless work is done so that the sun will
    not be offended and cause eclipse, storm, or other misfortune.
  category: action
  evidence_refs:
  - ev:11
