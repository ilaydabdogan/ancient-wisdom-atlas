canonical_text:
  quote: ''
  summary: 'The passage gives an Andamanese deluge tradition: a jealous figure, .be''rebi-,
    kills a mother’s son; the grieving mother performs and urges destructive acts;
    Puluga becomes angry and sends a flood that leaves two men and two women alive.
    It then records song lines and an explanation involving a boat, a rusty adze,
    and a threat of blood; notes postmortem transformations of the attacker and victim;
    describes post-flood descendants, dispersal into dialect and tribal groups, changed
    canoe materials; and ends with a tale of neophytes who break rules and are petrified
    at the shore.'
  language: English
  quote_policy: summarized
