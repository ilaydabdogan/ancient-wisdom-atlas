  summary: Ethnographic passage describing responses to anger, authority, offenses,
    concepts of wrongdoing, contact-introduced intoxicants and smoking, and the denial
    of cannibalism among the described Andamanese groups while noting fears that other
    groups practiced it.
  language: English
