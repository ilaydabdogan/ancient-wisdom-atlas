literal_observations:
- id: obs:1
  text: Women in rage are described as sometimes damaging or destroying nets, baskets,
    and other articles belonging to other women or females of the encampment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women in rage may seize a burning log, strike it on the ground, utter a curse-like
    exclamation, and struggle or fight until separated by the wife or daughter of
    their head man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are described as not attempting to settle differences with men, instead
    leaving redress to husbands or male relatives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a chief or elder loses his temper, peers go to their huts and other community
    members retreat to a secluded place; the passage states that no one would venture
    to find fault with a person in authority.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If a chief or elder wantonly causes loss or injury, his people are described
    as likely to repay him secretly in kind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Suicide is described as unknown among the group before observed cases among
    an alien population, after which a compound word was coined for the act.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the group has a word, yu'bda-, for sin or wrongdoing,
    used for falsehood, theft, grave assault, murder, adultery, and burning wax.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The listed wrongdoings are said to be believed to anger Puiuga, the Creator.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Adultery in their own villages is said to be rare; if detected, the injured
    husband would probably punish the guilty parties, with risk of retaliation, and
    no appeal to the chief is made.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: An assault or theft by members of another tribe during a visit or by stealth
    is described as premeditated and generally treated as a tribal affair, leading
    to feud and bloodshed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Drunkenness is described as a vice learned through contact with Europeans
    and other foreigners; a word meaning “staggerer” is said to have been invented
    for an inebriate.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Smoking is described as introduced through intercourse with outsiders; both
    men and women acquired the habit and used clay pipes obtained from outsiders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When unable to obtain tobacco, some are described as filling their short clay
    pipes with pan leaves rather than endure total deprivation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says excessive smoking seriously impaired constitutions and attempts
    to check it failed because work was difficult to obtain without tobacco.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: Cannibalism is denied and said to lack evidence among the described people,
    even in former times.
  category: other
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage says South and Middle Andaman tribes expressed horror of cannibalism
    but generally believed it was practiced by other races and by countrymen in North
    and Little Andaman, contributing to fear of neighbors and animosity toward strangers.
  category: relationship
  evidence_refs:
  - ev:11
