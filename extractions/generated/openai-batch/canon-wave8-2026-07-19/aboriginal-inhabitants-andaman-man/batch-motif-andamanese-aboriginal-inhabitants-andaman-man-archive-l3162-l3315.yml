canonical_text:
  quote: ''
  summary: The passage describes Andamanese geographic knowledge and naming, beliefs
    about Pu'luga as Creator connected with Saddle Peak, a deluge, landscape formation,
    volcanic fire, and the poisonous snake Idraba as cause of mineral-bearing streams.
    It also records counting practices and a belief that foreign voyagers were deceased
    ancestors permitted to revisit earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saddle Peak is named Pu'luga Id'kd hang-, glossed as 'Creator his mouth,'
    with reference to its size, inaccessibility, and a large ravine on its side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a belief that Saddle Peak was Pu'luga's residence before
    the deluge.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formation of rocks, valleys, hills, and similar landscape features is
    attributed to the will of Pu'luga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sources of streams containing oxide of iron and an olive-coloured mineral
    are assigned to the action of the poisonous snake Idraba.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Barren Island is described as containing an active volcano, and some Andamanese
    later called it 'Smoke Island' because of visible smoke.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The smoke from Barren Island's volcano is explained as due to a fire that
    Pu'luga kindled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some land and water terms use body-part analogies, including a cape or point
    as 'nose' and an isthmus as 'waist.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says the only numerals are terms for one and two, with higher
    quantities expressed by vague terms such as several, many, numerous, or innumerable.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: For exact small numbers, a counting method is described using finger order,
    tapping the nose, spoken terms for one and two, repeated 'and this,' and displayed
    fingers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that ten is the highest number indicated by this method
    and that toes, pebbles, grains, and notched sticks are not used in counting.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before recent contact, the Andamanese described here are said not to have
    known the neighbouring coast of Burmah and to have imagined their islands formed
    almost the entire terrene area.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Foreign voyagers near their shores were regarded as deceased ancestors permitted
    to revisit earth, and were supposed to live on a small island near the Andamanese
    world.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Natives of India are said to be called chdu'gala, glossed as 'departed spirits.'
  category: speech
  evidence_refs:
  - ev:9
