canonical_text:
  quote: "“the child’s spirit, which is believed to haunt its late home for a few
    days”"
  summary: 'The passage describes mourning and mortuary procedures after an infant’s
    death and then notes related practices for adult deaths: provisioning the child’s
    spirit with milk, temporary departure from the encampment, exhumation and cleansing
    of remains, use of skull and bones as ornaments or mementoes, removal and application
    of clay or paint, condolence song and dance, and adult corpse preparation and
    farewell by women.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After suspending the d'ra-, the fire is rekindled and the mother places a
    shell containing her own milk beside the grave so the child’s spirit will not
    lack nourishment while believed to haunt its former home for a few days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The encampment packs needed belongings, leaves for another camping ground
    generally two or three miles away, builds huts for the mourning period, and parents
    and relatives refrain from festivities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During mourning, specified mourners abstain from pork, turtle, and other luxuries;
    the passage says they do not mutilate their fingers and do not have a daily requirement
    to throw honeycomb into the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the agreed end of the mourning period, the group returns to the deserted
    encampment and removes and destroys the d'ra-.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The parents exhume the remains, and the father takes them to the sea-shore
    or nearest creek to cleanse them from putrefying matter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father brings the skull and bones back to the hut and breaks the bones
    into small pieces suitable for necklaces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mother paints and decorates the skull, hangs it around her neck with a
    netted chain, and after the first few days the father may wear it himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mother converts bones into necklaces, and she and her husband distribute
    these mementoes and remaining pieces among friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before distributing the mementoes, mourners remove the lump of clay from their
    heads, and the wife paints and decorates her husband and then herself with kbvoh-.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Friends assemble around the hut for a final visit of condolence; the bereaved
    father sings, others lament, women chant the chorus, the parents dance the Vi-t&latnga-,
    and then friends may continue the dance and song for many hours.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: For an adult death, relatives smear themselves with bg- and keep a lump of
    clay on their heads until the Vi-t&latnga-; necklaces, waistbelts, and similar
    items worn by the deceased are removed; women paint the corpse and fold and wrap
    the limbs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author says the meaning of folding and wrapping the corpse is not clear;
    questioned aborigines describe it as for convenience in removal, while the author
    proposes that a deeper meaning may underlie the act.
  category: other
  evidence_refs:
  - ev:10
- id: obs:13
  text: Females do not customarily attend the funeral; after completing their part,
    they gently blow on the face and take a last farewell look.
  category: action
  evidence_refs:
  - ev:11
