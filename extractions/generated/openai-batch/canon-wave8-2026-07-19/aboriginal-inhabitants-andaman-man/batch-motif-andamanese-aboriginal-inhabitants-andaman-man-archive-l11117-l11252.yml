candidate_motifs:
- id: motif:1
  label: Cross-cultural resemblance of play patterns
  taxonomy_refs: []
  basis: The passage explicitly says Andamanese pastimes resemble blind-man’s-buff,
    leap-frog, and hide-and-seek known elsewhere, while also saying these games were
    not borrowed.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is an ethnographer’s comparative statement about games, not a mythic
    motif or demonstrated historical relationship.
- id: motif:2
  label: Blindfolded seeker must catch a specific target
  taxonomy_refs: []
  basis: The blindfolded player has leaves over his eyes and must catch the person
    who blinded him while being jostled by others.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Identified as a game pattern only.
- id: motif:3
  label: Mock animal hunt with human quarry
  taxonomy_refs: []
  basis: One player acts as a pig, and another represents a turtle; in both games,
    other players pursue, shoot at, or try to capture the human animal-player.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage presents these as amusements rather than ritual hunts or myths.
- id: motif:4
  label: Simulated night attack
  taxonomy_refs: []
  basis: A man fires harmless arrows into huts after dark, while occupants hide or
    scream as though attacked by an enemy.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage frames the episode as a variety of game.
- id: motif:5
  label: Tethered turtle-capture chase in water
  taxonomy_refs: []
  basis: The turtle-player is tied by a long line to a canoe and evades capture through
    swimming, doubling, and diving.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is a play enactment of turtling rather than an actual hunt in the
    described scene.
- id: motif:6
  label: Spirit pursuit with temporary identity loss and dead-person impersonation
  taxonomy_refs:
  - shapeshifter
  basis: The performer pursues the Evil Spirit of the Woods, is asked who he is, and
    replies in a feigned voice as a long-deceased person; the author says this apparently
    suggests transformation or loss of identity.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The transformation reading is explicitly attributed to the observer’s
    interpretation, and the performance is described under games and amusements.
- id: motif:7
  label: Return of a liminal performer from hiding
  taxonomy_refs: []
  basis: After the jungle performance, two or three companions search out the hidden
    man and bring him back to camp, where he maintains the assumed character by silence
    and feigned sleep.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: No ritual status is stated; the context remains amusement.
comparison_claims:
- id: claim:1
  claim: The passage frames several Andamanese games as independently recurring play
    patterns resembling blind-man’s-buff, leap-frog, and hide-and-seek in England
    and other lands.
  claim_level: independent_recurrence
  target: blind-man’s-buff, leap-frog, and hide-and-seek as games in England and other
    lands
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The independence claim rests on the author’s statement that the games
    were not borrowed; no historical evidence is presented in the passage.
- id: claim:2
  claim: 'The Andamanese blindfold game has the same basic function as blind-man’s-buff:
    a blinded player tries to catch another player, with a local rule requiring him
    to catch the person who blinded him.'
  claim_level: same_function
  target: blind-man’s-buff
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: Only the features described in this passage are compared.
- id: claim:3
  claim: The Andamanese squatting-and-jumping game is presented as a local variant
    resembling leap-frog.
  claim_level: same_function
  target: leap-frog
  evidence_refs:
  - ev:2
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage describes only one version of the game.
- id: claim:4
  claim: The creeper swing is compared by the author to the way children are swung
    in the observer’s own culture.
  claim_level: same_function
  target: children’s swinging play
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is an ethnographic analogy about play equipment and action, not
    a mythological comparison.
