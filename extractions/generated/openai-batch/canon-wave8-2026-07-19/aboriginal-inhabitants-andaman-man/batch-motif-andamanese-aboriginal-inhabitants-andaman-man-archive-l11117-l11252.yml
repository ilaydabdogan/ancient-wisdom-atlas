canonical_text:
  quote: "“I will go after the Ev^il Spirit of the Woods”"
  summary: The passage describes Andamanese net-making and repair techniques, then
    gives an ethnographic account of games and amusements, including blindfold catching,
    leap-frog, mock pig-hunting, a mock night attack with harmless arrows, sea turtling,
    a jungle performance involving the Evil Spirit of the Woods and an assumed dead-person
    identity, swings, swimming, diving, canoe racing, and racing through dense Alpinia
    growth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says the Andamanese are skilful at net-making and use bamboo netting
    needles; it also describes joining large leaves and repairing canoes with bored
    holes and threaded cane strips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that several Andamanese pastimes resemble games known elsewhere,
    including blind-man’s-buff, leap-frog, and hide-and-seek, while also saying they
    were not borrowed from aliens.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the blindfold game, large leaves are fastened over the eyes, and the blindfolded
    player must catch the person who blinded him while other players pull and jostle
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the leap-frog game, one man squats on his heels while another jumps over
    him without touching him, after which they exchange positions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In mock pig-hunting after dark, one participant acts as a pig, runs about
    and grunts, while others shoot harmless arrows toward the sound until one hits
    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In another night game, one man returns to camp and fires u'tara arrows into
    huts, while the occupants hide or run away screaming as if attacked by an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the sea turtling game, a line is held in a canoe and tied to the arm of
    the man representing the turtle; other players try to capture him while he swims,
    doubles, and dives until exhausted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In an evening performance, a man says he will go after the Evil Spirit of
    the Woods, carries a lighted log into the jungle, and then shouts and strikes
    about as if pursuing or struggling with someone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: During the same performance, friends ask the man who he is; he replies in
    a feigned voice as a person long deceased and states a purpose.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: After something is thrown at him, the hidden performer threatens annihilation
    unless the others stop, sings in hiding, is searched out and brought back, then
    remains silent and feigns sleep.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage describes an improvised swing made from a long stout creeper hanging
    from a bough.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Young men compete in swimming, diving feet-first from rocks or branches, occasional
