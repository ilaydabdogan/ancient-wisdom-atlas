canonical_text:
  quote: ''
  summary: The passage gives ethnographic observations on Andamanese speech insults,
    preference for jungle life, child intelligence and plant knowledge, belief in
    dreams, and the social position of male dreamers or quasi-seers credited with
    supernatural powers, feared influence over sickness and death, and claims on gifts
    and property. A footnote compares these seers to disease makers of Tauna in the
    New Hebrides.
  language: English with Andamanese terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several insulting forms of address are listed, and the author states that
    such address generally results in a quarrel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Except for people raised away from their friends from birth or early childhood,
    the author says Andamanese individuals show preference for jungle life even after
    many years at Port Blair institutions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author reports that Andamanese children up to about age 12 or 14 were
    observed to perform comparably to middle-class children of so-called civilized
    races in subjects taught in common.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: An aboriginal patient educated at the Ross Orphanage School is described as
    able to read, speak, and write English and Urdu while retaining his mother tongue
    and having arithmetic knowledge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports that Andamanese people readily identified trees by name
    with greater reliability than Burmese consultants observed by Kurz.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author states that Andamanese people were not generally subject to trances,
    illusions, or somnambulism, but placed implicit faith in dreams and shaped conduct
    according to perceived warnings or advice in dreams.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain individuals called ôko-parad-, glossed as dreamers, are credited with
    supernatural powers, second sight, and mysterious influence over others' fortunes
    and lives.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that these dreamer-seers are thought able to bring trouble,
    sickness, and death upon people who do not show belief in them materially.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The quasi-seers are said to be invariably male, and even a young boy may be
    regarded as a future seer.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A seer's position is said to be first attained by relating an extraordinary
    dream later declared to have been confirmed by an unforeseen event such as accidental
    death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: To maintain status, a seer must give new evidence of his powers from time
    to time.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While companions have faith in the seer, he receives presents, described by
    the author as bribes to curry favor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Some property may be marked as rd'dare, or bespoken, by a seer and therefore
    unavailable as a gift to anyone else.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: If a disaster occurs which people believe the seer could have prevented, they
    may conspire to kill him, though the author says no known instance of such a plan
    being carried out existed because the seer was greatly feared.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A footnote states that the described seers remind the author of Tauna disease
    makers, who are supposed to cause disease and death by burning refuse, especially
    food refuse, and who are propitiated by continual presents.
  category: other
  evidence_refs:
  - ev:11
