  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says coastmen surpass inland people in hearing and can spear turtles
    on dark nights by the sound of the turtle rising to breathe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage records a reproach used by coast people toward inland dwellers
