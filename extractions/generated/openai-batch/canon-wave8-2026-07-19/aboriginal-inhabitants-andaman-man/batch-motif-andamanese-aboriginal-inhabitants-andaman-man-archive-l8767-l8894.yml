canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Andamanese subsistence and food preparation
    practices: using ground rattan for thirst, opening and cooking shellfish, fish
    preferences, seasonal pig hunting, preparation of edible roots, seaweed seed,
    and mangrove fruits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People of South Andaman are said to sometimes cut a piece of ground rattan
    when away from home to assuage thirst, a practice described as borrowed from Burmese
    convicts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Certain shellfish are opened by inserting a Cyrena valve or a wooden wedge
    between the valves, then killed with a knife, bladed arrow, arrow point, or blade
    and boiled.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other shellfish are briefly placed among burning logs to part their valves,
    removed with bamboo tongs, and their contents boiled in a pot with a little water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oysters are said to have formerly been eaten cooked, while current consumption
    is described as confined to North Andaman and possibly Little Andaman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dr. Day reported a preference order among several fish, and the author states
    from experience that few freshwater or saltwater fish are not eaten.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pig hunts are described as most frequent during the rains because pigs are
    more plentiful and in better condition, and because the fruit and honey season
    has ended.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the cool pd'par-wdb period people are alleged to become thinner, which
    they attribute to the meagre condition of breeding pigs and to roots and fruits
    then in season being non-fattening.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Six varieties of edible roots or yams are listed and are said to be eaten
    alone, preferably cold, with preparation varying according to acrid flavour.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The gd'no- root is cooked by direct fire, by boiling after washing and cutting,
    or by wrapping cut pieces in large leaves and baking them on burning logs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chd'ti- root is cooked by direct fire or by surrounding it with hot stones
    and covering it with leaves and weights to confine heat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The kdd- root is cooked, peeled, sliced, soaked in water for about two days
    to lessen bitterness, and then baked in leaves or boiled.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Three other root varieties are never boiled but are placed on the fire without
    leaves and peeled before being eaten.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The seed of a seaweed called t&notong- is said to be eaten by turtles and
    dugongs, obtained only in small quantities, carefully cooked, and eaten as a relish.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Fruits of three mangrove varieties are occasionally eaten by way of change
    and prepared like the kdd- root.
  category: object
  evidence_refs:
  - ev:12
