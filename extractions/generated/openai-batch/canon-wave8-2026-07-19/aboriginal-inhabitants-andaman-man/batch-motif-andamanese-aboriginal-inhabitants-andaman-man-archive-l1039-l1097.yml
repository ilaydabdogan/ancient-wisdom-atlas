canonical_text:
  quote: ''
  summary: The passage describes visits by steamer to distant Andamanese encampments,
    the depositing or presentation of valued goods to encourage contact, measures
    to prevent taking portable property from vacated camps, unsuccessful attempts
    to conciliate the Little Andaman group named in the text, and the author's account
    of hostility, former raids, territorial confinement, and risks to shipwrecked
    or landing outsiders. Footnotes add that women accompanying contact parties inspired
    confidence, that runaway convicts may have contributed hostile reports, and that
    a drifting boat may explain how Car-Nicobar was discovered.
  language: English
  quote_policy: summarized
