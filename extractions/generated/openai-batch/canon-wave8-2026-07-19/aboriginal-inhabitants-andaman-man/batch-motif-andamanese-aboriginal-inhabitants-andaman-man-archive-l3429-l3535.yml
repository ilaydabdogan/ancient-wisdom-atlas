canonical_text:
  quote: ''
  summary: The passage describes reciprocal teasing nicknames used by inland and coastal
    Andamanese groups, contrasts their skills and practices, recounts visits by inland
    men to the Port Blair settlement, and explains patterns of temporary movement
    and nomadism among inland and coastal communities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says jungle and coast communities use teasing nicknames for one
    another, and that these nicknames indicate perceived distinguishing characteristics.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nicknames applied by the inland group to the coastal group include descriptions
    of losing the way, not finding the way in the jungle, and not following tracks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nicknames applied by coastmen to jungle men include a term implying deafness
    and another meaning a leaf of Trigonostemon longifolitis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explains the deafness nickname by contrasting coastal skill in
    judging the distance of turtles in darkness with the supposed lack of that practiced
    ear among jungle men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The leaf nickname is linked to an inland practice of using Trigonostemon longifolitis
    leaves to cure fever, while the coastal group rarely uses the remedy because of
    a belief that its scent keeps turtles away from canoes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Intermingling near the settlement is said to have modified many primitive
    distinguishing characteristics, so the author says reliable information must be
    sought from more distant encampments.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wo'i is described as a young e'remtd'ga- of the .dko-.ju'wai- tribe who had
    lived in the Middle Andaman jungle until the end of 1875.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A coastal chief, mai'a Ivpa, sent a message inviting Wo'i and others to travel
    by Port Mouat to see the officer in charge of the home and obtain presents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Viper Island, Wo'i and his companions are said to have seen Europeans and
    an unfamiliar mode of living for the first time.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wo'i's companions returned to their tribe after a few months, while Wo'i remained
    and settled as a married man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After learning the .bojig-ngvji- dialect, Wo'i was questioned on various points
    and supplied information about inland habits and customs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage mentions a youth nicknamed Jack who was captured after a hostile
    encounter with natives of Interview Island and is inferred to have belonged to
    the .dkd-.ked'e- tribe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Another .dkd-.ked'e- e'remtd'ga- is described as having travelled from curiosity,
    stayed among the settlement community, shown jungle accomplishments, and lacked
    knowledge of fishing and turtling.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: This unnamed visitor was later taken at his own request to the north-west
    coast of Middle Andaman and landed with presents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Nomadism is described as almost entirely confined to the dryo'to-, though
