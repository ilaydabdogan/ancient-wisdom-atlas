  quote: ''
  summary: The passage describes anti-demon actions around a corpse, beliefs about
    demons consuming the dead, and social customs of meeting, reunion, hospitality,
    gifts, and farewell among Great Andamanese people as reported by the source.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person near the corpse shoots several arrows rapidly into the surrounding
    jungle while avoiding bystanders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The actor takes a pig-spear if .e'rem-chdwgala is suspected, or a turtle-spear
    if .ju'ru-win- is accounted guilty.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The actor pierces the ground around the corpse in hope of mortally injuring
    an unseen enemy and utters imprecations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When burial is deferred after a death attributed to .e'rem-chdwgala, non-mourners
    sing in turns all night to deter further harm in the encampment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: ".e'rem-chdwgala and his sons are said to feast on blood and soft tissues
    of people who die on land, while .ju'ru-win- is said to consume every portion
    of those he catches."
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Friends meeting after separation do not use ordinary salutations but silently
    gaze at each other for a long time before conversation begins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Relatives reunited after weeks or months sit with arms around each other's
    necks and weep and howl; the demonstrations resemble those made at death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Women begin the crying chorus, men join, and small groups weep until exhausted;
    if neither party is in mourning, a dance follows.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Returning spouses follow an ordered reunion sequence depending on whether
    they have children, with weeping first directed either to blood relations or to
    the spouse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Friends at meeting give each other whatever may be in their hands, and these
    gifts are treated as tokens of affection.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Strangers introduced by mutual friends are welcomed, served first, given the
    best food, and often receive presents when leaving.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At farewell, host and departing visitor blow on each other's hands, exchange
    set phrases, include a wish against snake-bite, blow on hands again, and part.
  category: speech
  evidence_refs:
  - ev:10
