canonical_text:
  quote: ''
  summary: 'The passage critiques Dudhndtli''s embellished reports, describes widow
    property disposal and the absence of suttee, then gives an ethnographic account
    of death and burial practices: public lamentation, mourning marks with clay and
    shaved heads, infant corpse preparation, burial near the hut fire, farewell blowing
    on the face, and cane-leaf wreaths marking a death at the camp.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dudhndtli is described as taking advantage of outside ignorance about Andamanese
    customs by inventing or embellishing stories about his adventures.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widow disposes of a deceased husband's property that she does not need for
    her own personal use among his male relatives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explicitly states that suttee does not prevail and has not been
    known among the people described.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage rejects the claim that no public lamentation is made at death
    and states that grief is generally excessive and shared by community members.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the death of an infant, parents and relatives remain weeping beside
    the corpse for hours.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mourners smear themselves with a clay-and-water wash, shave their heads, and
    place a clay lump above the forehead or on the head for the mourning period.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mother prepares the dead child by painting parts of the body, shaving
    off the hair, and folding the limbs into a compact posture.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The body is wrapped in large leaves and secured with cords or strips of cane.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The father digs the grave with an adze at the place where the hut fire usually
    burns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before burial, the parents uncover the child's head and blow on the face two
    or three times as a farewell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The corpse is placed in the grave in a sitting posture, and the earth is filled
    in and leveled.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Young cane leaves are made into fringe-like wreaths and fastened to trees
    around the hut or camp to warn visitors that a death has occurred and that they
    should keep away.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote compares the compact burial posture to a reported Hottentot practice
