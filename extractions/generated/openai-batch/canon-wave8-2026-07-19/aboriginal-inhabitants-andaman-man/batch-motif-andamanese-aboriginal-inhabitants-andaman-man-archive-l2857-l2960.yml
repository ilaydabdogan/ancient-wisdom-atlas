canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese social conduct: mutual affection, care
    for vulnerable persons, child discipline without corporal punishment, teaching
    of generosity and self-denial, fasting before marriage, hospitality and reciprocal
    gift-giving, modesty, careful craftsmanship, generosity tempered by expected equivalence,
    sociable speech, joking, and restrained insults. It includes an anecdote in which
    the chief Bela tracks escaped convicts and asks as reward that sentences be remitted
    for unrelated prisoners.'
  language: English
  quote_policy: summarized
