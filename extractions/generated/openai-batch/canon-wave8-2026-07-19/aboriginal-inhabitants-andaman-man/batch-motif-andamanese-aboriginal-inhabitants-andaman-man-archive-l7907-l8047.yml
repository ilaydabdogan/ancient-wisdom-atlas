- id: obs:3
  text: The passage rejects mosquito, sandfly, and jungle-travel protection as the
    purpose of tattooing, saying instead that it is primarily ornamental and secondarily
    evidence of courage and ability to endure pain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: No special ceremonies are said to accompany the tattooing operation; except
    in northern tribes, it is almost invariably performed by women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women who perform tattooing receive no remuneration, but may be honored as
    competent and recognized for skill without gaining special material status.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Few children of either sex remain untattooed after about the eighth year,
