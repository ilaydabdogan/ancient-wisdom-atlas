canonical_text:
  quote: ''
  summary: 'The passage describes games and amusements among Andamanese children and
    adults: throwing contests, marksmanship games, women''s adornment practices, boys''
    wrestling and mock burials, children''s animal play, sham banquets, water games,
    miniature canoes and weapons, adult singing and dancing entertainments, larger
    gatherings organized through a chief, occasion-specific songs with solo and chorus,
    and the taking of goods for presentation or barter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Participants compete by throwing a short string weighted with stones upward
    into a lofty tree, with the goal of flinging it highest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cyrena shells and small flat stones are thrown or skimmed to test throwing
    distance or to play ducks-and-drakes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A rolling creeper root or pod is used as a moving target for shooting practice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women are described as especially delighting in adorning relatives with designs
    in tdia-og-.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Young boys wrestle on sand and play at mock burials.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the mock burial game, one child is covered with sand until only the head
    is visible; fire is placed near the spot; the place is often near a landmark;
    when the child has had enough, he jumps out and another child takes his place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Children sometimes tie a fine string to the leg of a toad or tree-lizard,
    and the captive may die unless elders interfere.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children search for small crabs and fish and have them cooked for a sham banquet,
    engaging in pretend play.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Boys play by seizing one another under the surface of the water, floating
    tiny canoes toward one another, and practicing with miniature bows and arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Adults hold entertainments involving dancing and singing for many hours by
    moonlight or by camp fires.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Events such as a successful hunt, visits, a new season, recovery from illness,
    marriage, or the end of mourning may occasion an entertainment.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Large tribal gatherings are organized by the head chief after an offer from
    a distant community, and invitations are then sent to people within reach.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before such gatherings, the proposers prepare a song and chorus, often newly
    composed by a volunteer who sings the solo and trains the chorus.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The song subject is chosen from a recent personal or tribal exploit or adventure
