  summary: The passage explains that South Andaman encampment names are often derived
    from local features, trees, or remembered events; notes that some older place-names
    are no longer intelligible; and describes distinctions between coast-dwelling
    and inland Andamanese groups, their subsistence practices, skills, and the later
    blending of some roles through residence at homes and shared expeditions.
  language: English
