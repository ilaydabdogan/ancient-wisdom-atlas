canonical_text:
  quote: ''
  summary: The passage describes Great Andaman hut construction, permanent encampment
    size and layout, coastal site selection for fishing and turtling, the placement
    of huts relative to wind and the dancing ground, and tribal government with limited
    chiefly authority, sub-chiefs, common territory, dispute mediation, expedition
    direction, and non-automatic succession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Most Great Andaman huts are described as lean-to structures differing chiefly
    in size and durability; they may stand alone or be joined together in permanent
    encampments.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Permanent encampments consist of several huts and are usually inhabited by
    no more than about 50 to 80 persons, though they can accommodate more during festive
    gatherings such as weddings.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Permanent encampments of the dryd'to- are established at places advantageous
    for fishing and turtling throughout the year, especially sandy beaches with extensive
    foreshore.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At low tide, women are said to catch fish in pools with hand-nets and collect
    shellfish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During flood tides, men are said to shoot fish and harpoon turtles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When shelter allows, huts face inward toward the bu'lum- or dancing ground;
    in tempestuous weather the sloping roof is turned toward the prevailing wind.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Encampment layout depends on the ground and surrounding trees; the people
    do not fell trees or clear more than light brushwood merely to make space for
    huts and dancing ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When erecting fragile dwellings, the people take care to avoid danger from
    falling branches, and such accidents are described as comparatively unknown.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The encampment plan labels places for married persons, bachelors, spinsters,
    a public cooking place, and the bu'lum- or dancing ground.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The country is apportioned among tribes, and each tribal territory is considered
    common property of all members rather than exclusive property of chiefs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Domestic polity is described as communism modified by the more or less nominal
    authority of the chief; the head chief is called mava-igla'- and elders or sub-chiefs
    are called mai'ola.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The head chief's authority is limited and is exercised chiefly in organizing
    meetings, influencing questions of welfare, directing parties on hunting, fishing,
    or migration, and intervening in disputes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The head chief is said to have no power to punish or enforce obedience; aggrieved
    persons are left to take the law into their own hands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The dryd'to- and e'remtd'ya- in each tribe have separate independent head
    chiefs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Chiefly power is described as very limited and not necessarily hereditary,
    though a qualified adult son would usually be preferred to succeed his father
    over an equally efficient other person.
  category: sequence
  evidence_refs:
  - ev:9
