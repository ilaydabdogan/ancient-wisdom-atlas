  claim: The passage's own note supports a cautious visual comparison between the
    Andamanese explanation of lunar change as cloud coating on the moon and an Eskimo
    account in which a feminine sun smears the moon's face with soot.
  claim_level: visual_similarity
  target: 'Eskimo account cited in the passage note: sun smearing the moon''s face
    with soot'
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The two accounts differ in agent, material, and narrative function
    as presented here; the passage does not establish historical contact, common inheritance,
    or full motif equivalence.
