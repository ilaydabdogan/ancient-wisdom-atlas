canonical_text:
  quote: ''
  summary: The passage describes Andamanese beliefs about sea and sky spirits, demons
    who punish offenses, sun and moon kinship, explanations for lunar phases and eclipses,
    reactions to solar eclipses, and a cosmology in which a flat world rests on a
    palm tree above an under-earth jungle or Hades where departed spirits await Resurrection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The evil spirit of the sea is said to be invisible and to live in the sea
    with his wife and children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife and children of the sea spirit help him devour the bodies of those
    drowned or buried at sea.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fish are described as the sea spirit's staple food, but he also sometimes
    attacks aborigines fishing on shores or by creeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sea spirit uses a spear, and sudden cramp or illness on or after the water
    is attributed to being speared by him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The sea spirit has submarine residences, underwater boats, and a net for captured
    human or fish victims.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: The .chol- are described as a feared company of evil spirits descended from
    mai'a .chol-, who lived in antediluvian times.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The .chol- punish those who offend them by baking or roasting pig flesh, whose
    smell is especially obnoxious to them; boiling pork is not said to carry the same
    risk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Pwluga- is said often to assist the .chol- in discovering a person who has
    offended them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The .chol- strike only offenders, during the day while they are stationary,
    by hurling invisible darts from their distant abode.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The invisible spear of the .chol- is said to strike the victim's head with
    unerring aim and to be fatal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The .chol- are considered especially dangerous on the hottest days and are
    connected by the passage with deaths attributed to sunstroke.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: The sun is described as the wife of the moon, and the stars, of both sexes,
    are described as their children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The stars go to sleep during the day, and the celestial family has meals near
    Puluga-'s house without entering it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The sun is described as like fire and covered with thorns; the moon is described
    as white-skinned, with two long tusks and a big beard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:15
  text: The sun and moon have a home below the eastern horizon; the sun rests after
    setting, while the moon keeps irregular hours.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:16
  text: During passage under the earth, the sun and moon are believed to give light
    to spirits in Hades, and celestial bodies give light while crossing the sky by
    Puluga-'s command.
  category: action
  evidence_refs:
  - ev:4
- id: obs:17
  text: The waxing and waning of the moon are explained as the moon applying a coating
    of cloud to his person by degrees and then wiping it off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: During a lunar eclipse, some people twang bows rapidly as if discharging many
    arrows, while others sharpen their tools.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: During a lunar eclipse, people shout to the hidden moon, offering the seed
    of the balak and calling on him to show himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: During a solar eclipse, the people remain silent and motionless as if expecting
    calamity.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: The world, excluding the sea, is declared flat and is said to rest on an immense
    palm tree called bd'rata-.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:22
  text: The palm tree stands in a jungle under the earth; this jungle is identified
    with Hades and is described as gloomy and only partly lit by the sun and moon.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:23
  text: The spirits of the departed are sent by Puluga- to Hades to await the Resurrection.
  category: sequence
  evidence_refs:
  - ev:10
