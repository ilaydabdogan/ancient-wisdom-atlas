literal_observations:
- id: obs:1
  text: The Andamanese diet is described as varying by season, with ordinary foods
    including pigs, paradoxurus, iguanas, turtle eggs, turtles, fish, prawns, occasional
    dugong and porpoise, certain birds for married persons, Pandanus fruit, and honey;
    dry and rainy seasons add further fish, shellfish, eggs, roots, seeds, grubs,
    and fruits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports one observed case of a man eating a bu'yum larva alive,
    while the usual practice is to wrap insects in leaves, place them on burning embers,
    turn the bundle, and eat them after cooking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text states that people say tasting the fruit of a mangrove called to'kal-
    would bring a terrible calamity such as another Deluge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Many fruits are only sucked for flavor; others are eaten with fine wood-ash
    from hut fires to reduce acidity; some are cooked; and the stones of several fruits
    are cracked for their kernels.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A small red fruit is wrapped in leaves and baked because it is said that eating
    it uncooked would cause a person to forget the way in the jungle and lose memory
    generally.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:6
  text: Several fruits and mangrove seeds are husked or peeled, boiled until soft,
    cooled, sliced, soaked for two or more days in salt or fresh water, and then baked
    in leaves or boiled again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the Andamanese are very particular about cooking and will
    not eat certain raw or underdone fruits, vegetables, fish, flesh, or fowl.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: On ordinary occasions wives prepare meals while their husbands are absent;
    when wood and water labor is heavy, a male volunteer cooks at a special communal
    fireplace, distributes partly cooked meat, and recipients finish cooking their
    shares at their own fires.
  category: relationship
  evidence_refs:
  - ev:7
