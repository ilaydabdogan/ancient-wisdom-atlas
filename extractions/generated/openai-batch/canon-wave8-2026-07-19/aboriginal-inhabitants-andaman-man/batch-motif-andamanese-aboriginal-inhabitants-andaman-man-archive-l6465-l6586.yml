canonical_text:
  quote: ''
  summary: The passage lists Andamanese customs and beliefs concerning luck, taboos,
    storms, weather-working, rainbow omens, earthquakes, rebirth of infants, and sneezing.
    It describes named beings and ancestral spirits as agents in storms, punishments,
    earthquakes, and signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A meal is taken soon after rising because starting daily work on an empty
    stomach is believed to prevent luck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wood of the alaha tree is not used for cooking turtle, because that act
    is said to offend mava .d'gar-, who punishes offenders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In tempestuous weather, leaves of Mimusops Indica are thrown on fires so that
    their popping sounds may assuage Puiuga-'s fury and moderate the weather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a dark cloud approaches at an inconvenient time, people shout a warning
    that Wd'ra-jdbo will bite, in order to advise Fuiuga- to divert the cloud's course.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Storms are regarded as signs of Fuiuga-'s anger; winds are described as his
    breath, thunder as his growling, and lightning as a burning log flung by him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the first half of the rainy season, eating certain plants, seeds, yams,
    or edible roots is believed capable of causing another deluge because Pu'luga-
    requires them for his own consumption.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Burning beeswax is said to offend Puduga- by its smell, and people may secretly
    burn wax to bring storms on someone engaged in fishing, hunting, or similar activity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The rainbow is regarded as e'rem-chdw gala's dancing or sounding board, visible
    only at certain times, and its appearance is taken as an omen of sickness or death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hills, valleys, and rocks are said to have been formed by Puduga- for some
    purpose of his own, while creeks are attributed to a fortunate accident whose
    account is reserved elsewhere.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Earthquakes are believed to be caused by mischievous male spirits of deceased
    ancestors shaking the palm-tree on which the earth rests, hoping to destroy the
    cane bridge between this world and heaven; female spirits try to restrain them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Every conceived child is believed to have had a prior existence as an infant;
    when a woman who lost a baby is pregnant again, the deceased baby's name may be
    given to the foetus in expectation that the same child is born again.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Sneezing is regarded as auspicious; bystanders ask who is thinking of the
    sneezer, and the sneezer names an absent friend or states their own location if
    alone.
  category: speech
  evidence_refs:
  - ev:12
