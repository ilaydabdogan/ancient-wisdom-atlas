canonical_text:
  quote: ''
  summary: The passage describes illnesses observed among Andamanese communities,
    including epilepsy, ophthalmia, measles, syphilis, and common diseases. It gives
    historical accounts of epidemics introduced through colonial contact and describes
    fever treatment using plant leaves, a drink, ointment, and a charm tied around
    painful areas. Internal pains and some mysterious diseases are attributed to evil
    spirits, including spirits said to shoot or spear sufferers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Epilepsy is described as a recognized malady peculiar to certain individuals,
    and its fits are said not to be regarded superstitiously.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ophthalmia epidemic in 1877 affected about fifty persons, chiefly in South
    Andaman, and caused entire or partial loss of sight in many cases.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Smallpox is said not to have afflicted the people, while measles occurred
    once in 1877 and was introduced by convicts from Madras before spreading to the
    Andamanese.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A syphilis outbreak is traced to Indian convicts in contact with aboriginal
    inmates; affected persons were segregated at Viper Island, and some later escaped
    by swimming from the island.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the spread of syphilis was also connected with the
    practice of women suckling one another's infants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The most common diseases listed are malarial fever, catarrh, coughs, rheumatism,
    phthisis, pneumonia, and heart disease.
  category: object
  evidence_refs:
  - ev:9
- id: obs:7
  text: In fever treatment, a bed is made from Trigonostemon longifolius leaves, the
    patient's body is rubbed with the leaves, the patient sniffs crushed pieces of
    the leaves, drinks a preparation, and has ointment painted on the upper lip and
    sometimes the neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When fever includes chest or head pains, a band or object is tied tightly
    around the painful part and is believed to act as a charm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Internal pains are ascribed to the malign influence of evil spirits.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: During fever, one or more friends repeatedly rub the patient with gu'gma leaves
    and urge the patient to drink large quantities of the preparation; scarifying
    is not practiced in such cases.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: For the last three named diseases, the passage reports a belief that either
    one evil spirit has shot the sufferer or another has speared him.
  category: speech
  evidence_refs:
  - ev:8
