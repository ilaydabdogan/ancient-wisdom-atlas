canonical_text:
  quote: ''
  summary: The passage gives ethnographic notes on return from successful hunting
    or fishing, greeting customs, washing and bathing practices, heat protection,
    and fire. It says the Andamanese lack the art of producing fire, preserve embers
    carefully, have traditions placing their acquaintance with fire no later than
    Creation, and may first have obtained fire from volcanic islands according to
    the author’s conjecture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an unusually successful hunting or fishing expedition, men nearing home
    shout in triumph to inform friends of their good fortune, and women answer with
    yelling and thigh-slapping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the encampment is entered, the rejoicing sounds usually cease; after
    depositing their spoils, the hunters remain silent for some time before recounting
    their adventures and exploits.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Morning greetings between friends or between husband and wife are absent,
    and inquiries about health are unusual except when addressed to an invalid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A thirsty man who also wishes to wash first drinks from a stream, leaf, or
    vessel, then uses water from his mouth on his hands; if another person is present,
    he pours water from a leaf over the friend’s hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bathing is not daily but occurs at irregular intervals, especially when people
    are oppressed by heat or when their bodies become sticky, such as after gathering
    honey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In hot weather they smear their bodies with white clay dissolved in water,
    avoid direct sun when possible, use a large leaf screen over the head, and while
    travelling by boat may pour water over themselves or swim alongside the canoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the Andamanese appear to have always been ignorant
    of the art of producing fire, while their traditions place their acquaintance
    with fire no later than Creation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author conjectures that the first source of fire may have been the volcanic
    islands Barren Island and Narcondam Island.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Because they lack a method of producing flame, they use careful measures to
    prevent fire from going out, including carrying smouldering logs and leaving a
    large burning log or faggot sheltered so it can smoulder for days and be rekindled.
  category: action
  evidence_refs:
  - ev:8
