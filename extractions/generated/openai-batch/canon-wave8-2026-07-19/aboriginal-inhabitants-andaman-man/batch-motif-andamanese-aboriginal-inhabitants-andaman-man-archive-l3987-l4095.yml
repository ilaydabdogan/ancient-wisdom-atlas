  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that marks on rocks, trees, or other objects for record
    purposes are not believed to exist among these tribes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that the tribes have no writing and no method of recording
    the name or exploits of a distinguished deceased individual except narration by
