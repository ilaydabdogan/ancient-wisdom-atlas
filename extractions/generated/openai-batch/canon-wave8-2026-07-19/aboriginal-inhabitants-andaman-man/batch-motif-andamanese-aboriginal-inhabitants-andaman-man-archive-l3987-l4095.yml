canonical_text:
  quote: ''
  summary: 'The passage describes practical communications and movement among Andamanese
    groups: natural boundaries between tribal districts, permissions required for
    travel or resource use in another district, gatherings for barter or events, route-marking
    by bent twigs, lack of writing or record marks, recognition of individual arrows
    and spears by subtle string-tying differences, limited drawing practices, and
    preferred routes around swamps and across creeks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dense jungle, unsuitable canoes for long sea expeditions, and differences
    of language are described as hindrances to free intercourse between tribes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tribal districts have no marked boundaries, but neighbouring tribes maintain
    a general understanding of limits commonly defined by natural barriers such as
    hills, creeks, or dense jungle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before travelling through, hunting, or fishing in another tribe's territory,
    an invitation or permission is generally required unless a recognized exception
    applies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Breaches of territorial observance are said to have led to sharp retribution,
    loss of life, and long-standing tribal feuds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nearby communities speaking the same dialect periodically hold large gatherings
    for barter or celebration of particular events.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At such gatherings, old enmities may be healed and friendships formed, but
    new feuds or quarrels may also arise from disputes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a new jungle route is taken, those following are guided by twigs of brushwood
    bent backward at intervals along the track.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The twig-marking practice is especially noted for the dry season, when parched
