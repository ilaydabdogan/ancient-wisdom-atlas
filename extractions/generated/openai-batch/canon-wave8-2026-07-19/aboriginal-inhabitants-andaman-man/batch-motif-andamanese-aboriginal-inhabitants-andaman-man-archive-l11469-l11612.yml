canonical_text:
  quote: ''
  summary: The passage describes an Andamanese dance performance centered on time-keeping
    with a sounding-board, sex-differentiated dance movements, alternating solo and
    chorus lasting through the night, unison singing and refrain syllables described
    as meaningless, followed by rest, visits among friends or relatives, joint weeping
    within affinity limits, gift exchange, and dispersal into hunting or fishing parties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate heading identifies the scene as Andamanese dancing and describes
    a conductor marking time with a sounding-board.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A performer taps the ground after every second movement, crosses and recrosses
    the bu'lum-, joins the chorus, and keeps each step in time with sounding-board
    thuds and the sung refrain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When fatigued, the performer varies the action by bending the knees and alternately
    raising the heels while maintaining the same time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women dancers swing their arms backward and forward, bend their knees, bob
    up and down in time, and occasionally take a few steps forward before repeating
    the action.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The alternation of solo and chorus continues for many hours and generally
    stops only at the first signs of dawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dawn, hosts who have stayed awake lead visitors to huts and then sing and
    dance as a return compliment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The songs are described as sung in unison, without choral or part-singing,
    and the big drum of regimental bands is said to resemble the sound of their sounding-boards.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A specimen chant is described as including only three notes; as the refrain
    ends the soloist cries syllables to which the singers respond, and these syllables
    are said to have no meaning in themselves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the guests have rested, they visit special friends or relatives and,
    if within prescribed affinity limits, weep together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The visits are usually followed by an interchange of gifts initiated by the
    hosts, and disputes can occur when donor and recipient disagree about the value
    of the presents.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the gathering proceeds smoothly, the assemblage divides into small parties
    for hunting or fishing according to the encampment's situation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note states that greetings between performers and hosts do not occur until
    after the entertainment, which often lasts many hours, is over.
  category: sequence
  evidence_refs:
  - ev:9
