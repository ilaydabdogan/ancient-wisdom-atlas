canonical_text:
  quote: ''
  summary: The passage describes Andamanese betrothal, affinal avoidance and respect,
    arranged marriage, irregular unions, a non-religious marriage ceremony, post-marital
    residence and support, wedding gifts, body painting after marriage, bashfulness
    between spouses, and a later celebratory dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After betrothal, the girl is taken to the hut of her future father-in-law
    or foster father-in-law, and the children remain together for several months so
    that the engagement becomes known.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If either member of a betrothed pair dies young, the survivor is not required
    to participate in the obsequies and may form another alliance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man before middle age shows shyness in the presence of the wife of a younger
    brother or cousin, and communications are made through a third person.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife of an elder brother or cousin may receive from a man respect similar
    to that accorded to a mother, and marriage with her is described as almost obligatory
    unless the age disparity is very great.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lovers do not customarily declare a desire to marry; the guardian, or for
    widows and widowers the chief, arranges matters when observing attachment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bachelor or widower found asleep in a hut occupied by unmarried females
    beside a woman may be regarded as irregularly married to her, without ceremony
    or entertainment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that nothing religious attaches to the marriage ceremony
    because there is no idea of invoking aid or blessing from a Supreme Being.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the marriage ceremony the bridal party assembles at the chief’s hut or
    in a hut occupied by unmarried women.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The bride sits apart with one or two matrons, while the bridegroom stays among
    the bachelors until approached by the chief or elder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bridegroom assumes modesty and simulated reluctance, then is led slowly,
    sometimes almost dragged, toward his fiancée.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young bride may display modesty by weeping and hiding her face, while
    female attendants straighten her legs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bridegroom is made to sit on the bride’s thighs, torches are lit and brought
    close so all present may witness the ceremony, and the chief pronounces the couple
    married.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the ceremony the couple may retire to a hut previously prepared for
    them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Unless arranging to settle elsewhere, newly married spouses do not leave the
    encampment for food or other needs, because friends supply them until post-marriage
    shyness wears off.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Relatives and acquaintances give the couple ordinary-use articles such as
    nets, buckets, bows, and arrows as wedding presents.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: On the morning after marriage, the bridegroom’s mother or another near female
    relative paints him with tdia-dg-, and the bride is similarly ornamented by her
    friends.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: A young couple may pass several days after marriage without speaking and may
    avoid looking at one another because of bashfulness.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: After a few days, the couple enters ordinary duties, and the marriage is celebrated
    by a dance in which all except the bride and bridegroom participate.
  category: sequence
  evidence_refs:
  - ev:12
