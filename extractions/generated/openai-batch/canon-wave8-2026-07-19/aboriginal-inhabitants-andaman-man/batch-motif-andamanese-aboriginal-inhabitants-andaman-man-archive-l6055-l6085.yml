canonical_text:
  quote: ''
  summary: 'The passage describes differentiated death customs: special observances
    for the death of a chief or close relation, mourning and abstinence practices,
    handling of a visiting outsider’s body and later skeleton retrieval, unceremonious
    disposal of enemies or strangers, and attribution of sudden death to named malign
    influences associated with jungle or sea. A note rejects a reported claim about
    widows wearing husbands’ skulls.'
  language: English
  quote_policy: summarized
