  text: Other members of the tribe may abstain from a favourite food and avoid festivities
    during the mourning period as respect for the deceased and sympathy with the mourners.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a member of another tribe dies while visiting, the body is disposed of
    by one of the described modes and notice is sent to the deceased person’s friends
    so they know where to seek the skeleton at disinterment.
  category: sequence
  evidence_refs:
