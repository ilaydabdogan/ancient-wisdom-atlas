canonical_text:
  quote: ''
  summary: 'The passage describes Andamanese painting and shaving practices: three
    pigments used to mark mourning, festivity, illness, bodily heat, adornment, spirit-avoidance
    after eating pork or turtle, decoration of persons and objects, a tradition that
    Pu''luga taught painting to the first parents before its loss after the Deluge
    and later rediscovery, and the shaving and painting of newborns.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three pigments are used for bodily adornment, and their application can indicate
    whether a person is sick, sorrowful, or involved in merry-making.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The designs do not distinguish rank or sex, but individual patterns vary by
    body part; unmarried persons are temporarily restricted from using paint up to
    their necks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tradition states that Pu'luga instructed the first parents in painting;
    the art was temporarily lost after the Deluge and revived through accidental rediscovery
    of the necessary pigments.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three named materials are og-, tdia-og-, and khi'ob-/kbi'ob-, applied
    as a wash or in designs with the nail or fingertips.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Og- is a pale whitish-grey clay mixed with water and smeared over the whole
    person to denote mourning; a lump of the compound is also placed on the head at
    such times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After eating pork or turtle, people smear og- over their bodies in the belief
    that evil spirits will not detect or be attracted by the smell of the food on
    their breath.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Og- is also applied thinly when people are heated by travelling, hunting,
    or dancing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tdia-og- is a pure white clay used sparingly for fine tattoo-like ornament,
    usually executed by women on relatives for festivities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Khi'ob-/kbi'ob- is made from burnt yellow ochre mixed with melted animal fat
    and sometimes almond oil; it is used to decorate living persons and the dead and
    as a remedy in certain sufferings, but not for mourning or insect protection.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tdia-og- and khi'ob-/kbi'ob- are used to adorn weapons, utensils, and similar
    daily objects.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Khi'ob-/kbi'ob- is applied in rough zig-zags and stripes with fingertips;
    body heat causes the oily pigment to liquefy and the designs are quickly effaced.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Within a few hours of birth, an Andamanese baby's head is shaved and painted
    with khi'ob-/kbi'ob-, while the face and body are adorned with tdia-og-.
  category: action
  evidence_refs:
  - ev:11
