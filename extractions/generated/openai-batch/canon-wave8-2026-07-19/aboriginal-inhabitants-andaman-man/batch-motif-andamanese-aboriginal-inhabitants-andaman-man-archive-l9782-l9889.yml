canonical_text:
  quote: ''
  summary: The passage describes Great Andaman bow-and-arrow technique, arrow-carrying
    practices, weapon ranges, material substitution with iron, the absence of blow-pipes
    and several other weapon types, hunting and fishing practices, and the early training
    and casual practice of boys, youths, children, and elders. It also contrasts Great
    Andaman practices with those attributed to the Jarawa and the Semangs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Andaman arrow-release method is described as placing the arrow between
    the thumb and top joint of the forefinger and drawing the string to the mouth
    with the middle and third fingers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Jarawa are said to use a different arrow-release method, holding the nock
    inside the string with the middle joints of the fore and middle fingers and drawing
    with those joints.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Feet are described as being used only for stringing and unstringing bows,
    not for bending the bow during shooting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A waistbelt or other cincture can serve as a quiver while fishing and hunting,
    with arrows placed behind the wearer with their heads upward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pointed arrows are said to carry with effect to 40 or 50 yards, while pig-arrows
    are described as formidable but ill-balanced and reliable only at shorter ranges.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Great Andaman groups show no inclination to replace
    their own weapons or tools with civilized ones, but have adopted iron in place
    of shell, bone, and perhaps stone for implements.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The blow-pipe is stated to be absent among the weapons of the Great Andaman
    groups, and slings, throwing sticks, clubs, bird-bolts, and blunt-headed arrows
    are likewise said not to be in use.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In pig-hunting expeditions, hunters carry some pointed arrows in case they
    encounter smaller game such as iguana or paradoxurus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man may hold several arrows in the hand that grasps the bow in order to
    shoot rapidly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Great Andaman fish-shooters are skilled at shooting
    fish under water at close range and that three-pronged barbed arrows are not made
    or used by the Great Andaman tribes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Boys practice with small bows and arrows, and youths, children, and even elders
    may shoot at small passing objects while travelling, either for practice or to
    display skill.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bystanders are said not to reproach someone who wounds an animal without killing
    it.
  category: relationship
  evidence_refs:
  - ev:8
