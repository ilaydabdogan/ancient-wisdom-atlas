  summary: A historical introduction describes published reports from casual visits
    to the Andaman Islands, the 1857 dispatch of a commission to examine sites for
    a penal settlement and harbour, the commission's itinerary and encounter with
    aborigines, its recommendation of Old Harbour as Port Blair, and footnoted incidents
    including a captured youth who was taken to Calcutta and later returned.
