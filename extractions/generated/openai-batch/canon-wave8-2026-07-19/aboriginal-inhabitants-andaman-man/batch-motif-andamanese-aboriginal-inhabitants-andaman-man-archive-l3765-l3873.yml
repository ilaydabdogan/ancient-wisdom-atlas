canonical_text:
  quote: ''
  summary: The passage describes chieftainship succession, status and privilege, the
    position of a chief’s wife, the asserted antiquity of the social system, the reported
    absence of covenants, oaths, trials, and ordeals, dispute settlement by self-help
    and weapon threat, homicide and possible vengeance, British colonial punishment
    for murder near Port Blair, and destructive outbursts interpreted as temporary
    possession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a chief dies, a successor is usually available in the form of a deputy
    or right-hand man; selection is normally unanimous, but dissent is settled by
    majority, and dissenters may transfer allegiance to another chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Social status is described as depending on relationship, skill in hunting
    and fishing, and reputation for generosity and hospitality; chiefs and elders
    and their wives receive voluntary labor from young unmarried persons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Females and minors cannot be chiefs, but a chief’s wife holds a corresponding
    position among women, with privileges especially if she is a mother; widowhood
    and remarriage affect her status.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people are reported as believing that the described social system has
    existed from a remote period.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports no covenant forms, oaths, or appeals to a higher power
    such as Heaven or the Sun to punish breach of faith or witness truth.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage reports no trial practice and no belief in ordeals for discovering
    a guilty person.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Justice is described as self-help by the aggrieved party, who may throw a
    burning faggot or discharge an arrow at or near the offender while bystanders
    retreat with property.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a serious quarrel seems imminent, friends may seize the disputants and
    remove weapons until the risk of misuse has passed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a man kills an opponent, the group may do nothing, although a friend or
    relative of the deceased may avenge the death; the killer may intimidate others
    and withdraw until grief and anger diminish.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author reports that punishments under British law reduced murder among
    those living nearby, and describes one Andamanese youth hanged at Port Blair in
    1880 for murder.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A man or boy may express resentment by destroying his own property and neighbors’
    property, while sparing items belonging exclusively to the chief or head man.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Such destructive outbreaks are described as temporary possession; the person
    is regarded as dangerous and unaccountable, and others do not oppose or restrain
    him.
  category: other
  evidence_refs:
  - ev:12
