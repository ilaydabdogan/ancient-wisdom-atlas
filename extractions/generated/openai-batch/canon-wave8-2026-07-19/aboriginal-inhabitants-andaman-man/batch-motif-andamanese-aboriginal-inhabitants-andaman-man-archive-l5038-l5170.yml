canonical_text:
  quote: ''
  summary: The passage describes Andamanese naming and address practices connected
    with pregnancy, women’s life stages, male nicknames, marriage, parenthood, and
    puberty initiation. It also describes a fasting period beginning around ages eleven
    to thirteen, with restrictions on certain favored foods, ending by a chief’s decision
    after testing endurance and self-denial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant woman may speak of the named unborn child as fidgeting, clawing,
    or being ready.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During pregnancy, both the woman and her husband are described by a term glossed
    as “bad hair,” explained as an allusion to the foetus.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A girl’s “flower” name is retained until she is married and a mother; then
    it may give way to a title glossed as madam or mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the combination of “flower” and birth names makes
    confusion rare among women in one community.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men have no equivalent custom to the female “flower” name system; nicknames
    are instead given and often indicate personal peculiarities or physical deformities.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Seniors may address a young married man by his wife’s name and prospective
    designation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the wife is pregnant, the unborn child’s name may be used in advance to
    denote the parents, and post-birth address terms vary by senior or junior speaker
    and by the child’s sex.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At or soon after puberty, a fast kept during previous years or months is broken,
    and a prefix denoting a novice is attached to a boy’s birth-name.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fasting period begins between the eleventh and thirteenth year, lasts
    from one to five years, is observed by both sexes, and restricts foods including
    turtle, honey, pork, and fish.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The chief decides when the probationer may resume the restricted foods, judging
    whether endurance and self-denial have been sufficiently tested.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some probationers are said to request a longer abstinence period, and exceeding
    the average period is described as a cause for boasting.
  category: action
  evidence_refs:
  - ev:7
