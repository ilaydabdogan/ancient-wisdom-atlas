canonical_text:
  quote: ''
  summary: The passage describes Andamanese kinship rules, relationship terminology,
    marriage prohibitions, address forms, widow/widower kin priorities, and an elaborate
    naming system beginning before birth. It emphasizes prohibitions on marriage with
    consanguineal or adoptive kin, bilateral tracing of relationships, age/status-marked
    address terms, prenatal naming, sex- and age-marked name forms, and the addition
    of a seasonal flower/tree name to a young woman’s birth name at maturity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marriage is described as permissible only between persons known not to be
    connected, even distantly, except by wedlock; adoptive relationships are included
    in this prohibition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: First cousins, including adoptive first cousins, are treated as half-siblings;
    nephews and nieces are treated almost as sons and daughters, and terms for grandparents
    and grandchildren are extended to grand-uncles, grand-aunts, grand-nephews, and
    grand-nieces.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fathers, mothers, and foster-parents use distinct terms for sons and daughters
    when not using personal names.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Paternal and maternal uncles and aunts are not terminologically distinguished;
    relationships are traced through both lines, and the system is described as identical
    with reference to either sex.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Relationships beyond the third generation are said not to be traced or recognized,
    due to short lifespans, lack of accurate records, and complications from adoption.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Address forms vary by seniority, sex, parenthood, and relationship status;
    some terms are compared by the author to English or French-style honorifics such
    as Mr., Sir, Mrs., or Madam.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The described kinship vocabulary contains about sixty terms, excluding equivalents,
    and includes terms distinguishing elder and younger siblings and related affinal
    or half-sibling categories.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The term for addressing senior relatives of a spouse or sibling’s spouse is
    given as mdm; a note adds that it is also used for a chief.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man or woman may not marry into the family of a brother-in-law or sister-in-law,
    but a same-name marriage is not barred unless there is consanguinity or adoption.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The nearest kin to a widow or widower are listed in order as grown children,
    parents, then brothers and sisters.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author rejects the claim that the Andamanese lack proper names and states
    that their naming system begins before the child’s birth.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: Expectant parents decide the child’s name before birth and may choose a name
    borne by a relative, friend, or chief; proper names are said to be common to both
    sexes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage gives an example in which a chosen name receives different forms
    according to the child’s sex and stage of life, with one set used in the first
    two or three years and another until puberty.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: At womanhood, a girl receives a flower name as a prefix to her birth name;
    the flower name is taken from one of eighteen prescribed trees that blossom in
    succession and from the tree in season when she reaches maturity.
  category: sequence
  evidence_refs:
  - ev:12
