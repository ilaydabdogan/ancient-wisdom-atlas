  summary: The passage describes Odjib'we's war honors and paraphernalia, including
    a skunk-skin badge, birch war club, war drum, and war shirt. It explains the design
    on his war drum through an account of a drum inventor whose dream was pictured
    as lightning, the drum's thunder-like sound, We^nabo'jo's use of the large turtle
    as an errand-runner, the small snapping turtle as the large turtle's messenger,
    and the inclusion of bow-and-arrow imagery.
