canonical_text:
  quote: ''
  summary: A boy leaves home in spring to fast in the wilderness. He builds a nest
    in a large tree and remains without food. On the fifth night he dreams that he
    holds three scalps, gains confidence in his future career, joins the warriors,
    later holds three Sioux scalps, and avenges his father's death according to his
    people's custom.
