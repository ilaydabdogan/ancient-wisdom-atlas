canonical_text:
  quote: ''
  summary: The passage recounts Odjib'we's youthful participation in a dog-feast courage
    test for aspiring warriors, then his first warpath with his cousin Ne'bdncc'ktin.
    The two leave secretly under the pretense of hunting, sing a war song during four
    nights of camping, kill one Sioux on the fourth morning, take his scalp, and return
    to a village feast and dance in their honor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dog feast is described as a tribal custom in which young men aspiring to
    become warriors publicly showed their courage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old warrior was selected to announce the feast by walking through the village
    and speaking loudly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After singing, dancing, and speeches, the youths to be tested sat on the ground
    in a circle while a dog was killed in the center; its liver was cut into small
    pieces and given to the young men on long sticks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A youth who chewed and swallowed the liver without flinching was judged brave
    enough for the warpath, while one who shuddered or drew back was judged faint-hearted
    and jeered by the assembly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Odjib'we said he endured the test without a change of expression, but afterward
    privately found the thought of what he had done unbearable for many days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: At about age 20, Odjib'we consulted his cousin Ne'bdncc'ktin; they decided
    to go on the warpath together, told no one, pretended to be hunting, and left
    with heavy hearts, thinking of friends to avenge and of their own uncertain fate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Odjib'we said that he and his cousin sang the same song on each of the four
    nights they camped, even though the song words seemed to imply more than two people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The translated song words state that on the fourth day the singer is chosen
    by “the men,” and a note says that this word is commonly applied to warriors.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: On the fourth morning the expedition saw one Sioux, killed him, took his scalp,
    and returned to the village, where a feast and dance were held in their honor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The words of the subsequent dance song speak of making the Wapeton Sioux “bite
    the dust” when the singer sees him.
  category: speech
  evidence_refs:
  - ev:8
