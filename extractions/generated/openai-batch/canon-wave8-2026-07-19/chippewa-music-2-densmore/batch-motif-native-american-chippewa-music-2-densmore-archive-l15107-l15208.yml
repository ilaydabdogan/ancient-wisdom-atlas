canonical_text:
  quote: ''
  summary: A man who has lost his family and life itself regains consciousness after
    a black-clad stranger, identified as a manido, approaches him. The stranger teaches
    him the hand game, moccasin game, and plate game; the former dead man wins each
    game. The stranger then reveals his identity by departing as a large black bear
    and directs the man to gamble in an Indian village, where he wins two women and
    four children and feels as though he has won back his dead family.
  language: English
  quote_policy: summarized
