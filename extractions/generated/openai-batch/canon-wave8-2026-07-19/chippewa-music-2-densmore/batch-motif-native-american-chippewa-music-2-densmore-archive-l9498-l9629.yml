canonical_text:
  quote: ''
  summary: 'After De''kiiin finishes a song, her mother Djihgwa''kumigo''kwe takes
    a scalp, dances, and sings a song composed in honor of Odjibwe. The translated
    song expresses rejoicing and says that the addressed son has brought back his
    elder brother. The passage then gives Odjibwe''s account of a severe fight with
    Sioux led by Little Crow: Chippewa scouts kill and scalp a Sioux woman, Sioux
    warriors pursue them and meet the main Chippewa force, and the Chippewa win. A
    following victory song is attributed to Hole-in-the-day, the expedition leader.'
  language: English with transcribed Ojibwe song text and English translation
  quote_policy: summarized
