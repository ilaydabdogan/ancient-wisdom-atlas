canonical_text:
  quote: ''
  summary: 'The passage gives musicological tables and analyses, then presents dream-song
    narratives: one man fasts ten days with charcoal face-painting, dreams of manido''
    in southern clouds, ascends to the clouds, sees thunderbirds, and learns their
    song; another fasting dream seeker hears voices beyond a hill, sees deer in a
    circle preparing a seasonal dance after the leaves have fallen, and learns a song
    sung by a little buck. The passage also notes performance details and musical
    comparisons among animal-related songs.'
  language: English
  quote_policy: summarized
