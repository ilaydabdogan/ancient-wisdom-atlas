  summary: The passage describes songs connected with a Chippewa/Ojibwe dog feast,
    war-party departure, warpath evening camp practice, leader divination with pipe
    and rattle, a nightly leader song, and a solitary dream song used by leaders,
    oc'kabe'wis, and scouts.
  language: English
  quote_policy: summarized
