  quote: ''
  summary: The passage gives words and musical analysis for several Chippewa songs,
    then explains a warpath incident in which a leader used a dream song associated
    with a protecting cloud; a storm came and the Chippewa escaped Sioux pursuit.
    The leader later sang the song at a victory dance. The passage also gives the
    words of “A Cloud” and “I am Called,” the latter describing a call by a spirit
    from the middle of the great water.
