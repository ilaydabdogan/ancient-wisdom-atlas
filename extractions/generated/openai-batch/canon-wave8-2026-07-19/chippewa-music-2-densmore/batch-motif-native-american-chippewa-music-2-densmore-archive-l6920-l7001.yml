canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa training and first-war-party practices
    as recounted by Ma''djigi''jig: a blindfolded marrow-bone contest for recruits,
    first-war restrictions involving mittens and a scratch stick, taboos concerning
    weapons and snake omens, a night attack on a Sioux village aided by wind and signaled
    by a whistle, scalp-taking practices, ritual provisioning through pipe-smoking
    and a dream song that brings a deer, and invocation of the thunderbird to send
    rain before an attack.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When deer or other large game were killed, a marrow bone was placed on the
    ground in the recruits' camp, and a man tested his skill by walking eight paces
    away, being blindfolded, and striking at the bone with a hatchet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who cracked the bone with the first hatchet blow received the marrow
    or fat after cooking; the passage says this was the only way a young warrior on
    his first expedition could taste fat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On a first war party, recruits were required to wear mittens tied at the wrist
    until they entered a fight with the Sioux, and to scratch themselves with a small
    stick hung from the wrist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Failure to use the scratch stick was associated with breaking out in boils
    or sores, and Ma'djigi'jig explained the rule by saying recruits lacked the protective
    medicines carried by warriors.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the recruits' camp, stepping over another person's article, such as a gun,
    was avoided; stepping over a gun was said to make it useless and could bring punishment
    by the owner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that it was considered a bad omen for a recruit to see
    a snake.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: During Ma'djigi'jig's first war expedition, experienced men reconnoitered
    a Sioux village at night, counted the tipis, estimated the number of warriors,
    and reported back after midnight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before daybreak the Chippewa approached the Sioux village; the leader called
    for the wind, and the wind's sound through tipi poles and canvas covered the soft
    tread of the Chippewa entering camp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A warrior blew a quavering note on a tiny whistle, compared in the passage
    to the call of a waking bird, and this served as the signal for the Chippewa to
    fire and rush the tipis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The attackers severed a Sioux head, carried it away, and later removed scalps;
    the passage describes the scalp lock as difficult to remove and says a skilled
    warrior could do it with one knife motion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If a war party lacked provisions, the leader camped near a lake, smoked his
    pipe, sang his dream song, smoked again, then pointed and said a deer was coming
    and had been sent to them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before attacking a Sioux village, the war-party leader was said to call on
    the thunderbird to send rain so the Sioux would remain at home and not detect
    the Chippewa approach.
  category: action
  evidence_refs:
  - ev:7
