canonical_text:
  quote: The Symbols of Songs Which Never Were Sung
  summary: The passage describes Chippewa medicine poles at Lac du Flambeau, explains
    an origin account in which a fasting young man dreamed of thunderbirds and a tall
    tree, and describes a later custom in which an unfulfilled war dream was represented
    on a pole while the dream song remained unsung and the owner was understood to
    have curing power.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tall poles stand beside many houses in the Chippewa village at Lac du Flambeau,
    with cloth-covered frames fastened at their tops so they can swing in the wind.
