canonical_text:
  quote: ''
  summary: 'The passage describes the handling of scalps after war dances: they were
    wrapped, kept, circulated among villages for further dances, and carried by an
    oc''kabe''wis with tobacco and songs. After the dances ended, the scalps were
    returned to the first village, speeches were made, and poles bearing the scalps
    were set in a grave, often that of the man whose death was avenged. The passage
    then begins a section on peace pacts, describing messenger-mediated requests to
    end hostilities between Chippewa and Sioux, followed by formal preparations.'
  language: English
  quote_policy: summarized
