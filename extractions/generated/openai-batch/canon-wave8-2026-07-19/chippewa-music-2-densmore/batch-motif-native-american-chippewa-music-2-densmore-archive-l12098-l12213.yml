  quote: ''
  summary: The passage identifies and analyzes a Chippewa song, then narrates the
    planning and departure of a Chippewa drum party traveling to a Menominee settlement
    for a ceremony. It describes the party carrying drums, equipment, blankets, matting,
    and gifts; walking and camping after leaving the train; Menominee preliminary
    dancing while awaiting them; and the physical arrangement of the dancing circle
    with openings, an American flag, a tobacco collector, and drums on rush matting.
  language: English
