- id: obs:3
  text: There was disagreement about which day the Chippewa should leave Lac du Flambeau
    because of counting the days after the pipe had been given to the Menominee chief;
    the start was deferred by one day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party of about 70 Chippewa took the train on Tuesday morning, October 18,
    1910, carrying two drums, tents, camp equipment, blankets, matting, and packs
    of gifts intended for the Menominee.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Chippewa left the train at Antigo and planned to walk eastward 20 miles,
