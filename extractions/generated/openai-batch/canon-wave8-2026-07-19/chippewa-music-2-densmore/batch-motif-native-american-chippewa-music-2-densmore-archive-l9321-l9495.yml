    scalps attached to a hoop, warriors dancing and singing about deeds on the warpath,
    a scalp song of derision, clan gift distribution in honor of a returning warrior,
    an all-night victory dance by torch and bonfire light, and De''kum holding a scalp
    aloft while singing after Odjib''we''s revenge raid.'
