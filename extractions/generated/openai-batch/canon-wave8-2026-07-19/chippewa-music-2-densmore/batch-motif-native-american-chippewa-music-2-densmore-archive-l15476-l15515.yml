canonical_text:
  quote: ''
  summary: The passage describes rules and scoring for a moccasin game at White Earth,
    Minnesota. Bullets are hidden under moccasins until the guessing side guesses
    correctly. A guesser uses a striking-stick and counting-sticks, and scoring depends
    on the hidden marked bullet’s position and the guesses made. At the end of each
    game, a stick is placed in the ground by the blanket, and stakes are settled after
    an agreed number of games.
