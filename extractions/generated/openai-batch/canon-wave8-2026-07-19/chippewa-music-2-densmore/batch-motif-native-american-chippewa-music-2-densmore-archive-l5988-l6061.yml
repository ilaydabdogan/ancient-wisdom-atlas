canonical_text:
  quote: ''
  summary: The passage recounts two war episodes involving Odjib'we. In the first,
    after women report Sioux scouts near a Chippewa camp, Odjib'we goes out with a
    companion, is ambushed, loses his companion, kills a Sioux attacker, hides behind
    an oak, and first sings his dream song during the skirmish. In the second, Odjib'we
    joins a war party led by Hole-in-the-day, ambushes a lone Sioux man near the Minnesota
    River, earns a skunk-skin arm badge for seizing the wounded man by the arm, takes
    his scalp, escapes by canoe with the party, and sings a newly composed song while
    displaying the scalp in a victory dance.
  language: English
  quote_policy: summarized
