  quote: ''
  summary: The passage compares motive and musical features across Chippewa song groups,
    especially begging dance songs, pipe dance songs, woman’s dance songs, children’s
    entertainment songs, and songs connected with gifts. It describes the begging
    dance as a gift-securing and recreational camp activity, the woman’s dance as
    involving reciprocal gifts, and the pipe dance as a ludicrous pantomime performed
    for merriment. It also summarizes musical characteristics of the remaining pipe
    dance songs.
