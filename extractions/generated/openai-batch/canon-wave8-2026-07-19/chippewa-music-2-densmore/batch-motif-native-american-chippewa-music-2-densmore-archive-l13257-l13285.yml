canonical_text:
  quote: ''
  summary: After the Drum-presentation Ceremony on the Menominee Reservation, the
    writer returns to the assembled group. The Menominee are described as gracious
    hosts, and the Chippewa decide to remain four more days. Custom requires both
    tribes to dance four additional days, and they dance together despite snow and
    cold. The Chippewa then face a difficult return, with lighter packs because gifts
    have been given away and reciprocal gifts not fully returned. They return to Lac
    du Flambeau in a forlorn state, but with the satisfaction of having given two
    drums to the Menominee.
  language: English
