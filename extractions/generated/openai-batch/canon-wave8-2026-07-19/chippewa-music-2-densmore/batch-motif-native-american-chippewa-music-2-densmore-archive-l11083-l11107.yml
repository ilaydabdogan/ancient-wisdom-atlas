canonical_text:
  quote: ''
  summary: 'A woman instructs men how to make a drum. After the drum is finished and
    songs are learned, the first striking of the drum is followed by the reappearance
    of the manido and the death of the two drum makers. The passage then describes
    later Drum-presentation Ceremony practice: drums transferred between groups are
    said to resemble the manido-directed drum, the songs are still sung and taught
    to the receiving party, Sioux ceremonial songs are used at important points, Chippewa
    songs are used during dancing, and two types of drums may be given.'
  language: English
  quote_policy: summarized
