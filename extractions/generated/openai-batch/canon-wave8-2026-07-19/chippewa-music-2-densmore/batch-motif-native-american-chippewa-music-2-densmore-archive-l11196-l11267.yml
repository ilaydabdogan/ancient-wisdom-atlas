literal_observations:
- id: obs:1
  text: Me'dwcya'slin, an aged Lac du Flambeau Chippewa chief, gave a dance and speech
    explaining that he wanted the drum kept safely and did not want his children burdened
    with its obligations after his death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Me'dwcya'slin publicly transferred the drum to Mec'kawiga 'bau, who was willing
    to assume responsibility for it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Similar drums were reported on White Earth, Leech Lake, and Red Lake Reservations
    and were said to have been received from the Sioux and used in social dances.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Waba'cifig settlement the drum was suspended from crotched sticks, while
    in other reported instances it rested on the ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Minnesota examples described, decorated drumsticks were absent, no
    pipe belonged to the drum, and the drum's significance as a peace symbol appeared
    to have been lost.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A drum party was said originally to consist of 29 persons, and it was formerly
    not customary for a person to belong to more than one drum.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listed drum-party offices include a settlement chief, drum owner, speaker,
    aid, dancing-hall or circle manager, drum caretakers, pipe caretakers, drummers,
    singers, women singers, and leading dancers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: During a ceremony, the chief drummer is usually seated on the western side
    of the drum with the drum pipe, turtle shell of tobacco mixture, and other drum
    articles at his right hand.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The chief drummer starts the songs and leads the singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Leading drummers are seated by the four stakes or legs supporting the drum,
    with less important singers and drummers between them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Women form a large outer circle, sit with bowed heads, and cover their mouths
    with their hands or shawls while singing through the nose an octave above the
    men.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:12
  text: The chief of the band, drum owner, speaker, and four leading dancers sit on
    a long seat around the dancing hall or circle; the aid sits apart ready to act
    as messenger.
  category: setting
  evidence_refs:
  - ev:6
