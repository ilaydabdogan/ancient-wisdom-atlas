  summary: The passage analyzes Chippewa song performance in terms of metronomic speed,
    relative voice and drum tempo, rhythmic independence of vocal and instrumental
    parts, and vocal techniques used in love songs, Mide'wiwin songs, other song classes,
    and vibrato practice among younger singers. It also notes limited comparisons
    with other Indigenous music examples reported by other scholars.
  language: English
  quote_policy: summarized
