- id: obs:2
  text: For the voice, the largest percentages of speed occur at 96 to 104 M.M.; the
    whole collection averages 107 M.M.; controlled-excitement songs are described
    as having a particularly slow metric unit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the drum, the highest percentages fall between 104 and 112 M.M., with
    an average speed of 109 M.M.; the drum is generally faster than the voice, though
    no fixed proportion is evident.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that drum tempo may remain the same while voice tempo changes,
    showing independence between vocal and instrumental expression.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The writer does not recall a Chippewa instance where drum and voice coincide
    at the first count while one gives two pulses and the other three during the measure.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage reports that a two-against-three rhythm has been found in music
