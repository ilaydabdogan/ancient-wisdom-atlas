    follow the voice.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A cited phonograph record is summarized as beginning with the drum slightly
    behind the voice, then bringing drum and voice together briefly, and ending with
    the drum slightly ahead of the voice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The manner of Chippewa singing is said to vary according to the nature of
    the song and the skill of the singer.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Love songs are described as always using a nasal drawling tone, not used in
    other songs; the tone is not loud and remotely suggests an animal call.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mide'wiwin, or Grand Medicine, songs are described as containing meaningless
    syllables that are distinctly pronounced and usually consistent across renditions;
    words may be changed to fit the music.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In other song classes, vocables are described as throaty sounds that differentiate
    tones but cannot be represented in letters; singers are said not to move the lips
