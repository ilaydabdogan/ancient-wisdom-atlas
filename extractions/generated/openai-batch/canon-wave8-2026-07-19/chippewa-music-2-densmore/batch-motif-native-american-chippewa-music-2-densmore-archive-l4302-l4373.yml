canonical_text:
  quote: ''
  summary: The passage summarizes musical traits and uses of Chippewa dream songs,
    compares them with Mide', woman's dance, gift, and war-song groups, and introduces
    war songs, their drum accompaniments, occasions of performance, and four general
    song classes, including dream-composed and supernatural war-song types as well
    as departure, return, and victory songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dream-song group is described with statistical musical traits, including
    a high proportion of harmonic feeling, frequent downward beginnings, minor-third
    progressions, accented beginnings, changes of time, triple drum rhythm, and rapid
    metric units in voice and drum.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The structure of the dream songs is described as more centralized than that
    of the Mide' songs, with harmonic form and five-toned scales referring tones to
    a keynote.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Mide' songs were generally used to affect persons
    other than the singers, while most dream songs in this group were used to secure
    a more or less personal advantage, except for doctor's songs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the warpath, the war songs were accompanied by a small drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At village dances before the departure and after the return of a war party,
    a large drum was used and drummers sat around it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In recent years, the war songs are said to be sung at social dances with a
    drum similar to that used in the Drum-presentation Ceremony, but less elaborately
    decorated according to the writer's observation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The war songs are divided into four general kinds: dream songs of individual
    warriors, songs about war charms and medicines, songs about the conduct of the
    war expedition, and songs commemorating its success.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The first two war-song classes are described as having a connection with the
    supernatural element, while the last class is described as having no supernatural
    element.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports that, in former times, no warrior would have dared sing
    a war song that was not composed in a dream, referring to the first two classes
    of war songs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The third class includes songs of the war messenger, the dog feast, and the
    departure of the war party; the fourth class includes songs composed by a returning
    war party or in victory dances after a successful expedition.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The boundaries between the four war-song classes are stated not to be strongly
    marked, and the division is described as general in character.
  category: attribute
  evidence_refs:
  - ev:6
