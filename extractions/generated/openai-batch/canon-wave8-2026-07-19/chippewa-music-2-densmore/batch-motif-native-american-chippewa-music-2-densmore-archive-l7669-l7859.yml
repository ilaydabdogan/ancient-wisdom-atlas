canonical_text:
  quote: ''
  summary: The passage gives song texts, translations, and analysis for several Chippewa
    war-related songs. It includes a song about going south and bringing the south
    wind, a song called “A War Bird,” an account of pipe and drum actions before a
    war-party departure, silent travel with a pipe-bearer and leader’s rattle, scouting
    before attack, and an arrow song sung while war-arrow heads were dipped in red
    medicine.
  language: English with Ojibwe/Chippewa song terms
  quote_policy: summarized
