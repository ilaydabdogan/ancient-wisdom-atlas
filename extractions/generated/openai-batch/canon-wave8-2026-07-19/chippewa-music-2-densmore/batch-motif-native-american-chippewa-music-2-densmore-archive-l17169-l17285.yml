canonical_text:
  quote: ''
  summary: 'The passage gives song text and analysis for ca''wunoka''ziwin or Southern
    Dance songs, including their rhythm, performance sequence, prolonged closing call,
    and the dance''s accelerating effect. It then describes songs connected with giving
    away a pony: a dancer circles the drum with a stick representing an imaginary
    pony, presents the stick to a friend, and later transfers the pony; in some cases
    a beaded suit is given to a pony owner, making a pony the proper return gift.'
  language: English with Ojibwe/Chippewa song text and glosses
  quote_policy: summarized
