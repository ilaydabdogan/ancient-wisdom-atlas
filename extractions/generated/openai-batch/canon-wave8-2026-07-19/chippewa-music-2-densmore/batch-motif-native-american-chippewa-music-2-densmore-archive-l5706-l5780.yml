canonical_text:
  quote: ''
  summary: The passage describes a medicine pouch containing powdered ingredients,
    a small spoon, and a packet of principal ingredient; Main'gans demonstrates preparing
    the medicine in hot water by placing powder at the four cardinal directions and
    describes dosage with a birch-bark measure. A second medicine, described as island
    herb medicine, is associated with special plant sources, a thunderbird dream instruction,
    root charms carried in pockets, curative use, blood-stopping power, and four connected
    songs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pouch contained a mixture of three ingredients, a very small tin spoon,
    and a tied packet of the principal ingredient held by the pouch flap.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Main'gans took a small spoonful of powder from the pouch and swallowed it
    without water as a demonstration.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For liquid preparation, Main'gans used hot water and placed powder on the
    water surface at the east, south, west, and north sides while naming the directions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The water surface was dotted with four powder patches, and Main'gans added
    part of the principal ingredient to the middle of each patch, beginning with the
    east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Main'gans said the medicine should be taken four times a day, with the dose
    beginning small and increasing to a full dose measured in a birch-bark measure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The birch-bark measure held about a tablespoonful and had inside drawings
    said to represent animals and to indicate use for this particular medicine.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Main'gans swallowed part of the liquid after offering it to the writer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The island herb medicine is named from its principal ingredient, formerly
    found only at a place on Lake Superior and later found at Mille Lac, and is said
    to contain eight herb ingredients.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Na'waji'bigo'kwe said that when the Sioux were becoming too powerful for the
    Chippewa, a man dreamed of a thunderbird that told him how to prepare and use
    the medicine.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Na'waji'bigo'kwe found a small root, sang, talked, and prayed over it, wrapped
    it in fresh birch bark, and put it in a man's coat pocket to help him with serious
    difficulties.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In another incident, relatives asked Na'waji'bigo'kwe for the medicine after
    a man killed his wife; she gave them a small piece of root that the man carried
    in his pocket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The medicine is described as a charm, a curative agent, a blood-flow checker
