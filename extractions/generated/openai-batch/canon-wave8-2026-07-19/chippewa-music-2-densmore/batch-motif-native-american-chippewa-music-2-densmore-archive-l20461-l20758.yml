canonical_text:
  quote: ''
  summary: The passage gives music notation, translations, and analysis for several
    Chippewa songs, including moccasin game songs, a woman's dance song, a war-return
    song, and a song titled 'I Carry It Away.' It also describes the woman's dance
    as practiced among Minnesota Chippewa, including circular movement around the
    drum, drummers under a branch shade, women wearing shawls, and gift exchange arrangements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening song analysis describes a slow voice-rhythm associated with moccasin
    game songs, use of the fourth five-toned scale, major tonality, many minor-third
    intervals, and no rhythmic unit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Song No. 162 is titled 'The Sound of His Footsteps' and its words are glossed
    as the sound of approaching footsteps and one who always hits the mark.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The analysis of No. 162 says the tempo was rapid enough that the phonograph
    speed had to be reduced to detect the metric unit and note-values.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Song No. 163 is a moccasin game song whose three recorded renditions are said
    to be identical; the analysis says the drum metric unit is faster than that of
    the voice, as in most moccasin game songs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman's dance is described as a feature of every gathering of the Minnesota
    Chippewa, not introduced on the Lac du Flambeau Reservation, and said to have
    been acquired from the Sioux.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the woman's dance, dancers face the drum and move clockwise in a circle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The described dance setting includes a shade of branches erected over the
    drummers, while the women wear plaid woolen shawls.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A common arrangement during free gift exchange is for a man and a woman to
    dance together, with men and women alternating around the circle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Song No. 164 is a woman's dance song described as strongly rhythmic, without
    a rhythmic unit, and definitely minor in tonality.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Song No. 165 is titled 'He Killed a Man'; its words are glossed as 'a soldier'
    and 'killed a man in war.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Song No. 165 is described as a very old song sung by women who went to meet
    a war party returning to the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The same war-return song was recorded at White Earth, with the two records
