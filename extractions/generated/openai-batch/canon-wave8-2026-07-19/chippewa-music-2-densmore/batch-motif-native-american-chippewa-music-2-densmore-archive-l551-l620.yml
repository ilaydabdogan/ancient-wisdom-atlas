    a two-part measure under emotion, violent physical exercise, or pathological states.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists ways a rhythmic unit may be repeated in Chippewa songs,
    including continuous repetition except for a words-bearing middle section, interspersion
    with measures of no rhythmic interest, and continuous repetition except at the
    close.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A rhythmic unit may serve as the basis for a song's rhythm by appearing in
