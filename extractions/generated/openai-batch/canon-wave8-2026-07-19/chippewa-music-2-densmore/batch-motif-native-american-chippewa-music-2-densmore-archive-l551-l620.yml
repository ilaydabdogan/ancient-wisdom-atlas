canonical_text:
  quote: ''
  summary: The passage cites French physiological descriptions of heartbeat rhythm,
    then analyzes Chippewa songs in terms of repeated and modified rhythmic units.
    It describes rhythmic units as nuclei for songs, notes answering phrases and whole-song
    rhythmic units, and compares certain Chippewa rhythmic features with Sioux ceremonial
    song patterns, cautiously attributing rhythmic correspondence to contact between
    communities.
  language: English with embedded French citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening cited French physiological notes compare heartbeat rhythm to a
