canonical_text:
  quote: ''
  summary: The passage transitions from OCR remnants of musical notation and a heading
    for children's entertainment songs into a group analysis of 340 Chippewa songs.
    It explains that Mide', dream, and war songs are closely related in origin and
    use; describes Grand Medicine songs as part of the Mide'wiwin, including initiation
    songs and songs connected with special medicines; and states that these songs
    aim at transferring or renewing spirit power, prolonging life, healing the sick,
    and producing effects through supernatural power with music as an indispensable
    factor. The remainder gives statistical musical analysis of Mide' songs.
  language: English
  quote_policy: summarized
