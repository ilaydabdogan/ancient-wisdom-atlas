canonical_text:
  quote: ''
  summary: The passage describes chief and warrior drums used in a drum-presentation
    ceremony, records a witnessed exchange between Lac du Flambeau Chippewa and Menominee
    participants, and gives detailed descriptions of a decorated chief drum, its supporting
    stakes, drumsticks, pipe, tobacco containers, and associated rights of duplication
    and future gifting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes a chief drum and a smaller warrior drum; the chief
    drum is usually given by one chief or leader to another, while the warrior drum
    is presented by one member of the tribe to another.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the ceremony witnessed by the writer, Bi'jikens presented the chief drum
    to Wis'kino, and a Lac du Flambeau Chippewa presented the warrior drum to a Menominee
    from another part of the reservation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief drum was kept in Bi'jikens's house on a low box covered with a clean
    white quilt, with associated articles placed beside it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bi'jikens and his family treated the drum and its associated items with great
    respect, and the drum was carried to the dancing circle by Bi'jikens's son and
    son-in-law, who were officially entrusted with its care.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief drum had two untanned-hide heads decorated alike, with blue, red,
    and yellow painted areas, red flannel on the sides, pierced silver disks, otter
    fur, beadwork, tassels, metal thimbles, and beadwork ornaments.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The curved stakes supporting the drum were over 3 feet high and about 6 feet
    in span when positioned; they were covered with beadwork and otter fur, held feathers
    in sockets, and had cow-tail tufts and ribbon streamers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ribbon streamers on the supporting stakes were blue on the west and north
    stakes and red on the east and south stakes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four drumsticks for leading drummers were covered with brown deerskin and
    decorated with otter fur and ribbon streamers; a longer stick used only by the
    drum owner had the skin from a loon's neck slipped over its curved end.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The pipe belonging to the drum had a flat stem with geometric drawings and
    red woodpecker feathers set into the wood; a second pipe, called the warrior pipe,
    had been sent to Wis'kino before the ceremony.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A turtle shell contained a tobacco and red-willow mixture, and a wooden box
    contained tobacco, red willow, and matches; a similar box held feathers used to
    decorate the drum stakes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same chief drum had been given to Bi'jikens four years earlier by a leader
    of the Bad River Chippewa; after giving it away, Bi'jikens retained the right
    to make duplicates and give them away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mec'kawigabau had recently given a drum to a Chippewa at a neighboring settlement
    and stated that he intended to make a duplicate in the coming winter and give
    it away the next summer.
  category: sequence
  evidence_refs:
  - ev:8
