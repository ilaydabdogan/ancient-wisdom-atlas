canonical_text:
  quote: ''
  summary: The passage gives musical analysis of several Chippewa songs and narratives
    attached to animal-related songs. One deer-dance narrative describes an old man
    holding a feast, singing a dream-origin song, and a dance in which participants
    imitate deer before a hunt. Another song represents a solitary deer proud of shining
    horns. A buffalo-song narrative tells of a fasting man who hears and joins a singing
    buffalo herd, becomes a buffalo, and receives their song.
  language: English
