canonical_text:
  quote: ''
  summary: The passage introduces songs collected on White Earth Reservation and gives
    texts, translations, context, and musical analysis for songs about having salt,
    taking June berries on a journey as a son-in-law, and a woman's love song urging
    steady work. It also begins an ethnographic description of pipe dance songs, stating
    that the pipe dance was an old good-time dance believed to come from the manido,
    in which a man carried and transferred a pipestem and rattle while crouching to
    represent a pipe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The White Earth Reservation group is said to contain several classes of songs
    collected there, except songs connected with war.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the song translated as “We Have Salt,” the glossed words say that others
    may despise the singers, that they have salt, and that they live beyond the belt
    of timber.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that in early days the Minnesota Chippewa had no salt and
    that a treaty with the Pillager Band of Chippewa stipulated annual barrels of
    salt for five years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four renditions of “We Have Salt” were recorded; the drumbeat was maintained
    steadily while the voice tempo changed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the song translated as “If I Were a Son-in-law,” the singer names June
    berries and says he would take them to eat on a journey if he were a son-in-law.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: June berries are described as abundant in Chippewa country, commonly offered
    as simple refreshment, growing on tall bushes, small and red, with firm white
    meat, little juice, and a sweetish taste.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The explanatory note says that, in the old days, a son-in-law entering his
    wife’s home had a seat assigned in the wigwam, indicating he had been received
    as a family member.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The song translated as “Work Steadily” tells an addressee to be careful and
    work steadily, and says the speaker is afraid they will take the addressee away;
    the passage identifies it as a woman’s love song.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The analysis of “Work Steadily” describes it as slow, mournful, pleading in
    quality, and notes a similar peculiarity in other love songs.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The pipe dance is described as the principal early Chippewa “good time dance,”
    very old, and believed, like other dances, to have come from the manido.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the pipe dance, a man carried a pipestem, his body was supposed to represent
    a pipe, and he crouched or squatted, using contortions considered amusing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Only one man danced at a time; after dancing he presented the pipestem and
    rattle to another man, who was obliged to accept and dance, and this continued
    until all the men had danced.
  category: sequence
  evidence_refs:
  - ev:11
