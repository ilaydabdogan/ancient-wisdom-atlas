canonical_text:
  quote: ''
  summary: 'The passage describes the return of a victorious war party: runners announce
    the approach, warriors make a final camp to rehearse victory songs and dress well,
    women meet them near the village, scalps are given to a leading woman and carried
    on poles in hoops, women take certain belongings from the warriors and lead a
    procession, food is prepared for a feast called “feasting the Sioux,” and a later
    ceremony praises the victors with gifts and song. The passage also explains an
    ironic or indirect meaning attached to a song of victorious Gull Lake warriors
    and notes that song words could vary if tune and meaning remained the same.'
  language: English
  quote_policy: summarized
