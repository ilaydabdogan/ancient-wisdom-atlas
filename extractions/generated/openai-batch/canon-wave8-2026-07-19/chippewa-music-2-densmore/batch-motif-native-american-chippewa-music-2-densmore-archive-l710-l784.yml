canonical_text:
  quote: ''
  summary: 'The passage analyzes Chippewa/Indian song performance and transcription:
    intonation varies in relation to the piano scale; some tones approximate European
    notation while others require minute pitch gradations; good and poor singers are
    distinguished by the community; unusable records are discarded; and Chippewa singers
    are described as singing almost continuously for long periods with few rests.'
  language: English
  quote_policy: summarized
