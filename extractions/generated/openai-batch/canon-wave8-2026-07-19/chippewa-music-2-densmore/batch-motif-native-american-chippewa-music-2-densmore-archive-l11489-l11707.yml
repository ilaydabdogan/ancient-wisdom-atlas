canonical_text:
  quote: ''
  summary: The passage gives musical notes for songs sung by Mec'kawiga'bau and then
    describes a Chippewa ceremony called Restoring the Mourners at Lac du Flambeau.
    Four mourners sit in the center of a dancing circle, receive bright clothing and
    gifts, and undergo acts involving water, washing, hair-combing, and song so that
    their period of mourning may formally end and they may rejoin the dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Two songs sung by Mec''kawiga''bau are identified before the ceremony: a
    Song of the Warriors and a Song of Giving Away the Drum; both are analyzed as
    using a fourth five-toned scale with a generally downward melodic trend.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ceremony called Restoring the Mourners is described as usually occurring
    during preliminary dancing days so that persons whose mourning ends may join their
    friends in the remainder of the dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The observed ceremony took place in the Lac du Flambeau Chippewa dancing enclosure
    on a knoll, with four drums placed at intervals around the circle and drummers
    and singers seated beside them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: E'niwub'e, leader at one drum, had painted the lower half of his face black
    as a token of mourning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Four persons had their mourning period ended: a man who had lost his wife,
    two young women who had lost children, and an aged woman who had lost her husband.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the mourning period usually lasts from six months
    to a year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During mourning, a mother who has lost a child carries a cup tied in cloth
    around her waist, fills it with berries or another delicacy, places it beside
    her for the child, later gives the food to a needy person, and replaces the cup
    in the cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mourners sat in the center of the circle wearing bright clothing, while
    gifts such as bead chains, garments, and shawls were placed on or beside them
    and were received without response.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The surrounding scene included towering pines, Indian cabins by the lake,
    and smaller cabins of the dead on another hillside.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: White Feather is identified as the leader of the ceremony and is also said
    to have given the name Odja'nimwe 'wegijigons' when asked for his Indian name.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the opening of the ceremony, a woman brought water and soap to the man
    who had lost his wife; he washed his hands, dried them on a towel, and another
    man parted and smoothed his hair while a song was sung at one of the drums.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Song of Restoring the Mourners was sung by Mec'kawiga'bau and is analyzed
    as having rapid tempo and measures containing five counts, with some measures
    in quadruple time.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After a short time, a woman brought water and offered it to one woman who
    had lost a child, and the same was done for each of the women while the same song
    was sung at one of the drums.
  category: sequence
  evidence_refs:
  - ev:9
