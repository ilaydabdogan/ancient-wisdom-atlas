canonical_text:
  quote: ''
  summary: The passage describes the origin and powers of the eastern herb medicine,
    including a story of a young man who fasts and receives knowledge of it from an
    eastern manido, followed by an alliance and dangerous dances. It then recounts
    Odjibwe's entry into a warrior career after relatives are killed by the Sioux,
    his fasting for a vision, a dream in which a woman gives rush guns to Sioux attackers
    whose shots become harmless horseflies, and the dream song that becomes his sacred
    war song. The passage concludes with transcription and musical analysis of the
    song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wa'huno'wuck, translated as eastern herb medicine, is described as different
    in nature and use from the other medicines named in the passage, with early good
    offices but later prevailing evil uses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Na'waji'bigo'kwe's origin story, a young man wanted to join the Mide'wiwin
    to gain hunting power, but his father opposed him as too trifling for the Mide'.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man went away and fasted for many days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A manido from the east came to the fasting youth and told him about the medicine,
    saying it had both good and bad properties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youth gathered men around him, formed an alliance known as ya'hunog, held
    dances, and used the medicine unscrupulously.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eight men were destroyed at the first dance, which was given by a man who
    knew the secret of the medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The medicine was said to kill or cure, to act as an evil charm, and to make
    things go through the air; songs were also said to be connected with it.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The three medicines discussed in the surrounding section are summarized as
    imparting powers of healing, success, and revenge and as being adapted to men
    on the warpath.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Odjibwe's paternal grandfather, two of that grandfather's brothers, and two
    of Odjibwe's own brothers were killed by the Sioux, after which Odjibwe chose
    the career of a warrior.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Odjibwe prepared for war by fasting alone in the woods for several days at
    a time, hoping for a dream or vision; a dream came after a four-day fast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the dream, a woman carried guns made of rushes, gave them to approaching
    Sioux, and told the Sioux to shoot at Odjibwe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Sioux shot the rush guns, horseflies came out, lit on Odjibwe, and
    could not harm him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The dream woman told Odjibwe he would be a great warrior and would always
    be protected; Odjibwe said this came true because he was never wounded by the
    Sioux.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The woman also sang a song that became Odjibwe's dream song, which he could
    sing after the dream returned clearly before his first fight.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Odjibwe placed faith in the dream song and often sang it before or during
    a fight.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the dream song was recorded on a phonograph, Odjibwe said he feared
    he would not live long because he had given away his most sacred possession.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The song is identified as Odjibwe's Dream Song, sung by Odjibwe and recorded
    without drum; its gloss includes the statement that when they shot, they missed
    the man.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: The musical analysis describes the song as containing nine measures in four
