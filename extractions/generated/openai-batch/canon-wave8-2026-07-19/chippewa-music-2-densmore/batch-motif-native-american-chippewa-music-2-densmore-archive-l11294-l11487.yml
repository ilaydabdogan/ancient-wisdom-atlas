canonical_text:
  quote: ''
  summary: 'The passage gives musical transcriptions and analysis for songs sung by
    Mec''kawigabau and describes portions of a drum-presentation sequence: messengers
    smoke pipes with Menominee drum recipients, promise to return with their people,
    preparations for departure begin at Lac du Flambeau, each tribe dances four days
    on its own reservation, Chippewa ceremonies may include Restoring of Mourners
    and Divorce, tribes dance together four days at the presentation of the drum,
    a Dog Feast may be held on the fourth day to strengthen the peace bond, and five
    named songs open the ceremony.'
  language: English
  quote_policy: summarized
