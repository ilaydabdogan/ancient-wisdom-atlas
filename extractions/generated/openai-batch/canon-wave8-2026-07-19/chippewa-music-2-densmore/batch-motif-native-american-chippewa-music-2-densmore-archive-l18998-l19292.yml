  quote: ''
  summary: The passage presents four Chippewa songs sung by Ki'miwun, including brief
    Ojibwe lyric translations about sitting with a turtle, being carried by wind around
    the sky, the approach of thunderbirds, and a white-haired raven flying around
    the sky. It also gives a ritual performance note that song No. 140 and the two
    following songs are sung after a doctor has swallowed bones during treatment of
    a sick person, with recorded hissing, blowing, whistling, and reports of bones
    issuing from the mouth or being drawn from a dish of water.
