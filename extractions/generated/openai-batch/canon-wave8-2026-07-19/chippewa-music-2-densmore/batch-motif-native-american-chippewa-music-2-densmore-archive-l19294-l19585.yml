canonical_text:
  quote: ''
  summary: The passage gives musicological analysis and short translated words for
    several Chippewa songs. It includes dream songs, a moccasin game song said to
    have dream origin, comments on fasts and dreams as former means of seeking game
    skill, a probable war-dance song group associated with confidence and supernatural
    origin, and short lyrics about a chief taking the speaker into the heavens, two
    foxes facing each other while the speaker sits between them, and one bird with
    whom the speaker goes.
  language: English
  quote_policy: summarized
