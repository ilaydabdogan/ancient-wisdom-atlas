canonical_text:
  quote: ''
  summary: 'The passage gives tabular musical classifications for songs 94-104, then
    presents and analyzes four Chippewa love songs: No. 105, "Go with Me"; No. 106,
    "Do not Weep"; No. 107, "You Desire Vainly"; and No. 108, "He is Gone." The lyrics
    concern going away, invitation, weeping, vain desire, visiting a younger sister,
    sadness, and a dead lover. The analyses discuss performance without drum, singers,
    rhythmic units, tonality, interval patterns, and comparisons with other songs
    in the corpus.'
  language: English
