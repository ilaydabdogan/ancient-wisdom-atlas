canonical_text:
  quote: ''
  summary: 'The passage summarizes two groups of songs: songs that accompany gifts,
    usually a pony, and are sung by gift participants with singers at the drum in
    social dances; and songs for the entertainment of children, described as humorous
    pieces that often mimic tribal interests and occupations, including songs about
    child war games and war between animals. The passage also gives musical statistics
    and comparisons among song groups.'
