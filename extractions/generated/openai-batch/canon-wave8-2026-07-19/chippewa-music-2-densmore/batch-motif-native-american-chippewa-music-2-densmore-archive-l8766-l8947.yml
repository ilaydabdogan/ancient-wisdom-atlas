canonical_text:
  quote: ''
  summary: The passage describes Chippewa/Ojibwe war-song practices, including dream
    songs and victory songs sung during combat; a battlefield song attributed to Omiskwa'wegi'jigo'kwe,
    who accompanied her husband into battle and wished she could scalp a slain enemy
    despite gendered custom; a practice of shouting and naming the killer of a Sioux
    during battle; and an incident in which Niski'gwun revived Odjib'we with medicine
    mixed with water while singing a song of help.
