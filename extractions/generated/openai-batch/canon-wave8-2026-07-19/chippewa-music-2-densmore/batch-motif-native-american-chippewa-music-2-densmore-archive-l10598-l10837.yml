canonical_text:
  quote: War was the chief interest and even found its way into the play of the children.
  summary: The passage first gives rhythmic-analysis tables for a group of songs,
    then describes Chippewa and Sioux children's war games remembered by Odjib'we.
    It describes sham battles with rush arrows, adult spectators, rules limiting injury,
    a preliminary song before a boys' fight, war whoops when boys were felled, and
    musical analyses of related war songs, including references to slow metric units
    associated with self-control or controlled excitement.
  language: English
  quote_policy: quoted
