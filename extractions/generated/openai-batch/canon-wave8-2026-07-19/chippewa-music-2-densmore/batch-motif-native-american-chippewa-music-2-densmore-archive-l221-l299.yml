  summary: The passage analyzes the tone material of Chippewa songs, especially pentatonic
    scale varieties, the relative frequency of diatonic intervals, and selected comparisons
    with other published analyses of Indigenous and Murray Island songs. It identifies
    a large group of pentatonic songs, a dominant fourth five-toned or major pentatonic
    scale group, strong persistence of the fifth interval, and a song group omitting
    the seventh and fourth.
  language: English
