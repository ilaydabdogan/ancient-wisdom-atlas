  quote: When this drumbeat is heard the dancer pauses in whatever attitude he may
    chance to be and remains motionless until the drumbeat is resumed.
  summary: The passage describes pipe dance performance, drum-stop pauses, several
    songs with singer names and analyses, commemoration of named chiefs in a pleasure
    song, imitation of plover motions in a dance song, a lyric asking why the singer
    and female friend dance, and the opening of a burial song recorded without drum.
  language: English
