  summary: 'The passage contains several Chippewa song texts, glosses, and analyses:
    a lyric asking who would weep for the speaker, the Song of the Sentry with a mounted
    night patrol around a warriors'' camp, a song about the warrior Gwi''wizans whose
    presence and will bring victory, a lyric in which the speaker thinks the Sisseton
    Sioux are following behind, and the beginning title of a following song, "Around
    the Sky."'
