  summary: The passage describes Chippewa war-related objects and medicines, including
    a weasel-skin-decorated shirt, warrior medicines obtained from old men often associated
    with the Midewiwin, and an origin account in which a male Midewiwin member dreams
    of horned animals under water who teach him how to prepare cattle herb medicine.
    A song is composed and sung in connection with the medicine, and the passage lists
    botanical ingredients identified from specimens.
