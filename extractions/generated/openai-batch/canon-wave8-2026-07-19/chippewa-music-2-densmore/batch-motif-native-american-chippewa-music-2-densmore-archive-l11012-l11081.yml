canonical_text:
  quote: ''
  summary: The passage describes small drum gatherings with tobacco gifts, a tradition
    that the Sioux transferred a large drum, drum songs, and an origin tradition to
    the Chippewa, and an origin account in which a pursued Sioux woman hides four
    days in pond water under a lily leaf, follows a voice, eats among soldiers without
    being seen, and receives drum-making directions and songs from a manido appearing
    as a white man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People visit the drum about every fourth night, sing a few songs, bring tobacco
    gifts, and the drum owner speaks for those present before presenting the tobacco
    to the drum and then to the singers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tradition says that the Sioux gave the Chippewa a large drum, taught them
    songs belonging to the drum, related its origin tradition, and that permanent
    peace between the tribes resulted from the drum presentation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After receiving the drum and instructions, the Chippewa made similar drums
    and later gave them away with the proper songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When presenting a drum, the giver customarily relates an individual dream
    to the recipient, increasing the value of the gift and strengthening the bond
    between the two men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Informants in several communities agreed that a woman was the means used by
    the manido in giving this type of drum to the Indians and that she hid in the
    water four days with her face concealed by a broad lily pad.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the origin account, a Sioux woman who could not keep up with warriors while
    the Sioux were fighting white men hid in a pond, submerged in shallow water at
    the edge with a lily leaf over her face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After four days, a voice invited the woman to share food with those who had
    killed her friends, called her again, and then told her to keep on a path after
    she came from the water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The woman found herself among soldiers and eating with them; she could see
    them, but they could not see her.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman then saw the person whose voice she had heard; he was a manido and
    appeared in the form of a white man.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The manido gave the woman directions for making the drum, taught her the songs
    for it, and said that through it the Sioux would make friends with all their enemies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The manido said women could sing with the drum, only men could dance around
    it, he would come down to the first finished drum, and two men must be offered
    to him in return for the drum gift.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A note defines manido as spirit or ghost and records explanations connecting
    the word with superhuman power and with multiple spirits in Chippewa belief.
  category: attribute
  evidence_refs:
  - ev:7
