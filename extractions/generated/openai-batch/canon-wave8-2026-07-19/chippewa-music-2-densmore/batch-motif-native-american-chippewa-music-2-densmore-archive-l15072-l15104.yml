canonical_text:
  quote: ''
  summary: The passage introduces Chippewa game songs and states that gambling was
    believed to have been taught by a manido to relieve hunger and ill fortune. It
    names three games, notes which had songs, and says older Indians revered the games
    and songs as a gift from the Manido. It then begins E'niwub'e's origin narrative,
    in which a great Chippewa hunter loses his children and wives during a remote
    hunting expedition, buries them, considers suicide, and wanders without drinking
    until he collapses.
  language: English
