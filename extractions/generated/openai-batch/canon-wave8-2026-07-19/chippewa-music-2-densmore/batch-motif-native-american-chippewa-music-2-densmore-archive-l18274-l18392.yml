canonical_text:
  quote: ''
  summary: 'The passage describes Chippewa medicine poles and related practices: garments
    with tobacco are tied high on poles for sick persons; poles may be scraped, renewed,
    or redecorated; offerings and cloth strips were attached during Me''dweya''sun''s
    illness; Me''dweya''sun had erected a horizontal tree medicine pole in relation
    to an unfulfilled war dream; Ki''tciodja''nhnwewegi''jig fasted, dreamed of a
    bird, and later drew the bird on a medicine-pole banner. The final paragraphs
    introduce the Waba''cing village song-recording context at Red Lake Reservation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When friends are anxious about a sick person's condition, they put tobacco
    in one of the sick person's garments and fasten it high on a medicine pole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A weatherworn pole may be scraped until white and smooth, or replaced with
    a new pole, and a garment belonging to the sick person is tied on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pole associated with Me'dweya'sun's relative had been scraped, redecorated,
    given a renewed cloth banner, and supplied with an offering during Me'dweya'sun's
    illness; he did not recover and died of old age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Me'dweya'sun's own medicine pole had strips of cloth from garments he had
    worn, placed there by friends in an effort to prolong his life.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Me'dweya'sun's medicine pole consisted of an uprooted tree placed horizontally
    between two forked poles as braces.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In youth, Me'dweya'sun dreamed that he led a war party, conquered the enemy,
    and leaped over a fallen tree while pursuing them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Me'dweya'sun later set up the tree medicine pole at the same height as the
    fallen tree in his dream because he had not fulfilled the dream; the song that
    should have inspired his warriors was not sung.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ki'tciodja'nhnwewegi'jig said that as a boy he fasted and dreamed of a bird;
    because he never went to war, he later erected a medicine pole beside his dwelling
    with the bird drawn on its cloth banner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Although the bird drawing was weathered, Ki'tciodja'nhnwewegi'jig redrew its
