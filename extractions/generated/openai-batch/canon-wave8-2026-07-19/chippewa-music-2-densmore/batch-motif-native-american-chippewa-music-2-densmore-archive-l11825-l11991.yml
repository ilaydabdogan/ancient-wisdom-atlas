canonical_text:
  quote: ''
  summary: An observer visits the Lac du Flambeau village after the ceremony of Restoring
    the Mourners and finds people gathered indoors around a warrior drum that is to
    be presented to the Menominee. Drummers sing, women sing behind them, and men
    dance in place. The passage states that selected Chippewa war songs are sung at
    dances before or after a drum presentation. It then gives song texts and musical
    analyses, including a thunderbird dream song associated with holding and throwing
    tobacco toward a storm, a song about ravens singing in the sky, a war song analysis,
    and the heading of a song titled "I am Small."
  language: English
  quote_policy: summarized
