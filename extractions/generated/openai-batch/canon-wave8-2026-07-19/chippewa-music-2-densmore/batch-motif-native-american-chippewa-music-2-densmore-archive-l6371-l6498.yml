canonical_text:
  quote: ''
  summary: The passage recounts the Battle of Shakopee and then introduces a Chippewa
    war medicine song sung by Niski'gwun before battle. It describes a warrior's birdskin
    medicine charm, its protective use, its possible dream origin, the kingbird associated
    with the charm, an alternate cloth bird-form charm, the song's translated phrases,
    war cries during renditions, and Niski'gwun's statement that the song came to
    him after a ten-day vigil when he was young.
  language: English with Ojibwe song text and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lower Sioux groups returned in summer to former homes; Shakopee and his band
    camped near the town bearing his name, and one brave fishing in the Minnesota
    River was fired upon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shakopee's men recognized the gunshot as Chippeway, gathered at Murphy's Ferry,
    and Sioux women put 30 or 40 men across.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sioux did not know that about 150 or more Chippeway warriors were hidden
    behind a timbered bluff; the Sioux placed themselves in ambush in a narrow space
    between two lakelets.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chippeways charged from the bluff more than once, failed to dislodge the
    Sioux, and withdrew with wounded and perhaps dead; four corpses remained with
    the Sioux.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first song of the group is described as referring to a warrior's war charm
    and as sung shortly before a fight to make the charm more effective.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Niski'gwun said he sang this song before the battle at Ca'gobens' village.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The word translated as “balls” is explained as referring to enemy hands that
    the warrior would cut off and toss about.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The usual Chippewa war charm is described as a dried birdskin filled with
    medicine known only to the wearer, probably an herb or other substance suggested
    in a dream.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The charm was worn around the warrior's neck and was believed to protect him;
    if a bullet struck the charm, it was said the man would die.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ma'djigi'jig made a duplicate of the old war charm and said the bird used
    was the smallest of a kind that flies at evening, identified in the passage as
    the kingbird or bee martin.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The kingbird is described as boldly attacking larger birds, including hawks,
    owls, and eagles.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: If a birdskin was not available, a bird-shaped charm could be made of cloth
    with the medicine placed between two layers.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The song glosses include “it is wafted upward / my bird-plumage” in the first
    rendition and “they will be flying / my balls” in the second rendition.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Two renditions of the song were interrupted by shrill war cries; Niski'gwun
    stated that before battle he sang his dream song, which came to him as a young
    man after a ten-day vigil.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
