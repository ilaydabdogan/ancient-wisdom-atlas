  summary: The passage presents and analyzes Mide' burial songs, a moccasin game song,
    and the opening of a love-song section from the White Earth Reservation material.
    The burial-song glosses include departing to a village and taking steps, and another
    burial song includes standing and seeing the singer's body as desired. The moccasin
    game song is compared with a similar Chippewa song described as a dream song for
    securing game success. The love-song introduction recounts a maiden who sings
    at first love and later sings when her lover departs; the first love song states
    that the singer is thinking and has found a lover.
