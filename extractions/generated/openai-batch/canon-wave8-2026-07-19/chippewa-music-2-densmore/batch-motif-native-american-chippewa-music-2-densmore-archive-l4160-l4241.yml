  quote: ''
  summary: The passage analyzes Mide' songs as purposeful songs used to secure effects
    by supernatural power, then introduces Chippewa dream songs as songs said to come
    in dreams or visions, often after isolation and fasting. It notes songs heard
    from trees and crows, songs attributed to thunderbird, deer, and buffalo seen
    in dreams, songs learned from manido' in human form, and a subset relating to
    flight through the air.
