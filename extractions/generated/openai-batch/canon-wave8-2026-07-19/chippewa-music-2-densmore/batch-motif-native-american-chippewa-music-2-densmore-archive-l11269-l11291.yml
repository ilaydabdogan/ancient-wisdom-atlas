canonical_text:
  quote: ''
  summary: 'The passage describes obligations connected with accepting a ceremonial
    drum: reciprocal gifts, feasts, food for guests, and later equivalent return gifts.
    It then describes messengers carrying warrior pipes before a Lac du Flambeau Chippewa
    presentation of drums to the Menominee, a departure dance with a Sioux song, and
    identifies Mec''kawiga''bau as singer of the ceremonial songs associated with
    a chief drum presented by Bi''jikens.'
  language: English
  quote_policy: summarized
literal_observations:
