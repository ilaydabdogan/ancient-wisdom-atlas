  summary: The passage combines musical analysis with accounts of two war songs connected
    with a battle near present-day St. Cloud, Minnesota. One song concerns a Sioux
    woman who defended her children with an ax and was killed with them. Another concerns
    a captive Sioux woman who was to be shot, was allowed to sing, moved Odjib'we's
    elder brother to rescue her, and later expressed gratitude through handshakes,
    kisses, and a song at a camp dance.
