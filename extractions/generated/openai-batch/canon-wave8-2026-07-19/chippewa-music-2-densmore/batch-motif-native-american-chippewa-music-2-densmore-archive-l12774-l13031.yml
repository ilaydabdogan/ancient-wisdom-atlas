canonical_text:
  quote: ''
  summary: The passage describes portions of a Dog Feast within a drum-presentation
    ceremony. Four men kneel around a kettle containing the dog, make repeated arm
    motions, rise and dance around the drum, gesture toward the four directions, then
    advance toward the kettle with uplifted arms, lower their hands over it while
    uttering “ho ho ho ho,” and finally make a rapid lowering motion that signals
    the drumming and singing to cease. The passage also gives musical analyses and
    headings for several songs sung by Mec'kawiga'bau.
