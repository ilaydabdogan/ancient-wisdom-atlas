  text: Most of the analyzed songs are described as diatonic, with 85 percent containing
    no accidentals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When accidentals occur, the sixth degree is most frequently affected, and
    accidentals are reported as more frequent in love songs than in other groups.
