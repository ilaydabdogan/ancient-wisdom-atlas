  summary: The passage analyzes tonal, harmonic, melodic, and intervallic features
    of Chippewa songs, emphasizing diatonic tone material, predominantly melodic rather
    than harmonic structure, a downward melodic trend, and frequent use of the minor
    third. It also cites comparisons with observations about other musical traditions
    and natural calls.
  language: English
  quote_policy: summarized
