  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The analysis reports 83 songs, or 24 percent, as harmonic; 222 songs, or 66
    percent, as melodic; and 35 songs, or 10 percent, as intermediate or melodic with
    harmonic framework.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author notes that the boundaries of melodies and persistence of the third
