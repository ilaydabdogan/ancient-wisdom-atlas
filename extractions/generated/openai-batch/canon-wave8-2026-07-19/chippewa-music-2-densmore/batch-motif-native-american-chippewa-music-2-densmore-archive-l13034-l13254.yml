canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Dog Feast within a Drum-presentation
    Ceremony: an oc''kabe''wis takes dog meat from a kettle, dances around the drum,
    and presents it to the drum owner; the dog head is placed at the eastern side
    of the dancing circle; four distinguished warriors are selected to eat from it;
    each warrior dances around the dog''s skull, speaks of a victory, and sings a
    commemorative song; the remaining dog meat is later passed to women and then men,
    concluding the feast. The passage also gives musical analysis and identifies Mec''kawiga''bau
    as singer/recorder and Memengwa, called Butterfly, as composer of a typical war
    song.'
  language: English
  quote_policy: summarized
