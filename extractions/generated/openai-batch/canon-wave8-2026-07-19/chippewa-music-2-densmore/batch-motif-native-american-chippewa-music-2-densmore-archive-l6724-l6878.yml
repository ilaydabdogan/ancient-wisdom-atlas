canonical_text:
  quote: ''
  summary: The passage combines musical analysis of Chippewa songs with a war-related
    reminiscence. It notes recurring musical intervals in war or related songs, describes
    a song of grief at Ca'gobens' village, and introduces Meja'kigi'jig's account
    of childhood dreams after his father was killed by the Sioux. As a child he sought
    war dreams, refused food, dreamed he shot a Sioux, dreamed of having gray hair,
    and later fasted five days and nights seeking further dreams without success.
  language: English
