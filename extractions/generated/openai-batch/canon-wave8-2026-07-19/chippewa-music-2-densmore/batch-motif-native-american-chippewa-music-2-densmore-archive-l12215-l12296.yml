canonical_text:
  quote: ''
  summary: A Chippewa party reaches Menominee country, establishes a temporary camp,
    and is formally invited to the Menominee dancing circle. Wis'kino organizes the
    Menominee reception with an American flag and lines of people. The Chippewa approach
    in procession with flags, pipes, drums, drum supports, singers, drummers, women,
    and children. White Feather speaks of Manido authorizing the meeting for peace.
    Pipe bearers from both groups perform a reciprocal pipe rite, and members of the
    two parties exchange handshakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Chippewa were found resting by the roadside while others staggered under
    packs; they had reached the country of the Menominee tired, dusty, and footsore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next morning the Chippewa were refreshed in a temporary camp about a quarter
    mile from the dancing circle, with tents under pine trees, bright camp fires,
    and steaming kettles.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Menominee assembled in the dancing circle and danced at intervals for
    about two hours before Wis'kino sent a messenger to invite the Chippewa to proceed
    there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wis'kino's messenger returned from the Chippewa camp and reported that the
    invitation had been accepted and that the Chippewa were on the way.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wis'kino directed the messenger to carry the American flag before him, then
    stood near the circle entrance while Menominee men, women, and children formed
    reception lines.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Chippewa procession included a loaded wagon, Na'ganac' walking beside
    it, drum parties with flag bearers, pipe bearers, drum owners, aids, drum carriers,
    support and drumstick carriers, followed by singers, drummers, other members,
    women, and children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Chippewa planted their flags in the ground, and White Feather advanced
    followed by the pipe bearer of the chief drum.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: White Feather's speech says the warriors named the meeting day, Manido commanded
    the meeting, Manido gave the happy time so the groups might be at peace, and the
    participants would use a pipe, smoke, shake hands, and enjoy themselves before
    Manido.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Menominee aid responded to White Feather by stepping forward, shaking hands
    with him, and returning to his place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Chippewa and Menominee pipe bearers presented their pipes four times to
    the circle of the sky, lit them, crossed them, and each puffed the other's pipe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Chippewa pipe bearer offered the pipe to Wis'kino and then to each member
    of the Menominee lines.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bi'jikens was first to shake hands with Wis'kino; the passage notes that Wis'kino
    would soon receive the chief drum from him, after which Chippewa members shook
    hands down the Menominee lines.
  category: relationship
  evidence_refs:
  - ev:9
