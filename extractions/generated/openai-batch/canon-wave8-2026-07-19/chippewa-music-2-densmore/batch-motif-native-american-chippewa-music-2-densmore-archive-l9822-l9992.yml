canonical_text:
  quote: ''
  summary: The passage describes a Chippewa-Sioux peace-pact ceremony involving processions,
    women moving between warriors, reciprocal singing that names and praises opposing
    leaders, firing guns into the air without reloading, peace-pipe offering and smoking,
    handshakes, hospitality, and subsequent nightly ca'wuno'ga peace dances.
  language: English
  quote_policy: summarized
