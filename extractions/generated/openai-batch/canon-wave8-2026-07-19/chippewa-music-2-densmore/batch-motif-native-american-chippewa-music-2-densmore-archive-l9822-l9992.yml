  text: Warriors dressed in their gayest attire while singing, war cries, and excitement
    filled the camps before the opposing forces advanced.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Chippewa advanced with an oc'kabe'wis bearing the pipe, followed by four
    women, then leaders of the war party and warriors; the Sioux followed in similar
    array.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women walked to and fro in front of the warriors, and their presence often
