canonical_text:
  quote: ''
  summary: The passage describes an old-style Chippewa moccasin pattern and manufacturing
    details supplied by an aged woman at Lac du Flambeau, including cutting deerskin,
    sewing, moistening, molding, and fastening. It then introduces No. 113, a love
    song sung by a blind woman identified as CyGABEA'siN'o'KWE, recorded without drum,
    with lyrics about going to speak with a sweetheart who is a widow and loving her.
    A short musical analysis and tonal classification follow.
  language: English with Ojibwe song text and English glosses
