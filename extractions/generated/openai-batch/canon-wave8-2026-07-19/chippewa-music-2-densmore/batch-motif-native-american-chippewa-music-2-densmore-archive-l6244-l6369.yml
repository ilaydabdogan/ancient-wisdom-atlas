canonical_text:
  quote: ''
  summary: A Chippewa war party scouts a Sioux camp, watches through the night, begins
    a dawn attack, fights through the day, loses the Mille Lac chief Xo'din, takes
    three Sioux scalps, and returns home. The victory is celebrated with dances and
    Odjib'we sings a song whose words express renewed departure on the warpath. The
    passage also gives musical analysis of the song and introduces a following group
    of songs connected with the 1858 fight at the village of Little Six.
  language: English
  quote_policy: summarized
