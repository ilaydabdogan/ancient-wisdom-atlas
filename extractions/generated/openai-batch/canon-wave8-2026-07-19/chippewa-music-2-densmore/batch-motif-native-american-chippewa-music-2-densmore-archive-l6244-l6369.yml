  evidence_refs:
  - ev:1
- id: obs:2
  text: After a report that two Sioux were on the other shore, the Chippewa stealthily
    ascend a hill from which they can see the entire Sioux camp, but they decide to
    wait until night before attacking.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
