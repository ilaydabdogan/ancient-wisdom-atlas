  summary: Wis'kino leads the way to a dancing circle, where flags, drums, drummers,
    and drum-related articles are arranged. He then gives a welcome speech to the
    Chippewa, thanking Ki^jie^ Manido^ that former enemies join in peace, referring
    to handshaking, the divine sight of the drum-presentation ceremony, and his wish
    to finish the ceremony before returning to his harvest work.
