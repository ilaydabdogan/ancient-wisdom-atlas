  quote: ''
  summary: The passage describes Odjib'we as a musician and warrior whose songs were
    recorded in old age, identifies several companions and informants at White Earth,
    describes two herb medicines and their associated songs for warriors, memorializes
    Odjib'we after his death, and summarizes the historical conflict between the Chippewa/Ojibwa
    and Sioux/Dakota in Minnesota.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we is described as both a musician and a warrior; more than 70 of his
    songs were recorded, and these were only part of the melodies he knew.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During years of blindness at the Old People's Home at White Earth Agency,
    Odjib'we loved to sing, and several comrades there recalled former times.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Niski'gwiin fought beside Odjib'we at Ca'gobens' village, and Maifi'gans also
    lived at White Earth and loved the old ways and songs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Maifi'gans is described as crippled from frozen feet in boyhood but remarkably
    active, attributing his strength to a native remedy called hi'jlkiwuck' or cattle
    herb medicine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cattle herb medicine is said to have been used by warriors; Maifi'gans
    described it, secured herb specimens, and sang songs connected with its origin
    and use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When Odjib'we was recording songs, Niski'gwiin was present and contributed
    his own dream song and one or two other songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Na'waji'bigo'kwe sang songs of the mi'nisino'wuck or island herb medicine
    and remembered herbs being dug to make this medicine for departing warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Na'waji'bigo'kwe is described as highly skilled in the lore of native medicines.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Meja'kigi'jig, Ma'djigi'jig, and A'kiwen'zi gave personal reminiscences; all
    took part in wars against the Sioux, and the two last named fought under Odjib'we's
    leadership.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Odjib'we died in April 1911; many preserved songs were known only to him,
    and he is described as preeminent in northern Minnesota.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says Odjib'we never lifted his hand against the white man but
    led his people to victory over the Sioux when war was regarded as glory.
  category: action
  evidence_refs:
  - ev:5
