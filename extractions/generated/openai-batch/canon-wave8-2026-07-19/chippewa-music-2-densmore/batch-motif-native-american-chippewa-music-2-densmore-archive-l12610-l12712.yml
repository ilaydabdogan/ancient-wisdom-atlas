canonical_text:
  quote: ''
  summary: 'The passage describes stages in a Chippewa-to-Menominee drum-presentation
    ceremony: the chief drum is transferred to Wis''kino and the Menominee, gifts
    are distributed and returned, the new owner ritually strikes the drum after feints,
    pipe bearers circulate pipes, songs signal ownership and departure, a warrior
    drum is presented the next day, and a fourth day of dancing includes adornment
    gifts and the Song of the Closed Door.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The drum is considered transferred to Wis'kino; he seats Menominee men and
    women beside it, and his aid takes the seat near the entrance where the Chippewa
    aid had been seated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gifts previously bestowed by the Chippewa are divided among the Menominee
    under Wis'kino's supervision.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Menominee erect the drum supports, place the drum in position, sing, and
    drum lightly on its edge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wis'kino stands beside the drum holding a long drumstick with a loon neck
    at the end, makes three feints at striking, and touches the drum lightly on the
    fourth attempt while four leading drummers strike it sharply with decorated drumsticks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Song of the Owner of the Drum begins and is said to signify that the drum
    belongs fully to the Menominee.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Menominee then present gifts to the Chippewa by spreading a blanket on
    the ground and laying on it articles similar to those previously given by the
    Chippewa.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wis'kino speaks about taking good care of the drum and says his selected drum
    party may use it whenever desired; he gives Bi'jikens new blankets and bank notes,
    after which the two shake hands and sit side by side.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pipe bearers present their pipes to the circle of the sky, light them, pass
    them through the assembly, and each person puffs the pipe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Song of Departure signals the end of the day's ceremony; the Chippewa
    return to camp without the chief drum, and the drum is placed respectfully in
    the Menominee chief's house beside a filled pipe ready for use.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the following day a warrior drum is presented by a Chippewa to a Menominee
    recipient from another part of the Menominee Reservation, with only slight differences
    from the chief-drum ceremony.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The fourth day is occupied with dancing, during which the Chippewa present
    their adornments to the Menominee.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the Song of the Closed Door is sung, no one is allowed to leave the
