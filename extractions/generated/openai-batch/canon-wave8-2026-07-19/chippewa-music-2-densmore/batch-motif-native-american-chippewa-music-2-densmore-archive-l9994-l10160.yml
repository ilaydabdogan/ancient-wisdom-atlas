canonical_text:
  quote: ''
  summary: The passage first explains the origin and healing use of the ca'wuno'ga
    dance, said to have been taught by the South Manido to a young man whose ill relatives
    recovered after he organized the dance. It then gives musical notes for ca'wuno'ga
    songs. The second part introduces war songs concerning women and recounts a story
    about Bica'ganab, a Chippewa woman who fought Sioux attackers, survived a water
    fight, returned to the battlefield, took trophies, and is praised in a song as
    defending children and fighting for all.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ca'wuno'ga is described as a very old dance that was first used for healing
    people who were not in good health, while very ill people were treated by the
    Mide.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The South Manido taught the dance to a very good young man whose relatives
    were ill.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man organized the dance according to the South Manido's instructions,
    and his relatives recovered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After its healing use, the ca'wuno'ga dance was later used as a social dance,
    and its songs are described as pleasing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Songs numbered 46 and 47 are ca'wuno'ga songs sung by Odjib'we; the analysis
    emphasizes repeated renditions, irregular or jerky rhythms, syncopations, and
    danceability over a long time.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The incident connected with the first war song concerning women was narrated
    to the writer by John W. Carl, a grandson of Bica'ganab.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Hudson's Bay trader came to Chippewa country, loved a Chippewa maiden, wooed
    her according to her people's custom, gave a feast, sought her father's consent,
    and had three daughters with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bica'ganab was a granddaughter of the Hudson's Bay trader and grew to womanhood
    before the attack described in the story.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: While Bica'ganab was lighting her breakfast fire, an alarm announced that
    the Sioux were attacking, followed by gunfire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the attack, men tried to repulse the Sioux while women put household
    goods into canoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bica'ganab's father entered the fight, was wounded five times, and was helped
    into a canoe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The escaping party initially supposed that Bica'ganab had been killed, but
    later saw a woman fighting the Sioux with a club.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Sioux drove Bica'ganab into the water; she swam toward a canoe while they
    followed and tried to strike her on the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bica'ganab broke and tore the Sioux canoe with her hands and was said to be
    like a great bear in ferocity.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Bica'ganab forced the Sioux into the water and pounded them with a paddle
    as they went toward shore.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Instead of following the retreating Chippewa, Bica'ganab went upstream, hid
