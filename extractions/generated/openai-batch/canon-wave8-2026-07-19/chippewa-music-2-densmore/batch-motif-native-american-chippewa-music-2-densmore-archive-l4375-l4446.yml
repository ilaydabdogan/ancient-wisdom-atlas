  text: The passage describes the war songs as largely melodic in structure, with
    56 percent purely melodic and 25 percent melodic with harmonic framework.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the first progression is downward in 66 percent of the songs
    and notes a high number of intervals of a second.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The triple rhythm is identified as the drum-rhythm of the victory dance, commonly
    called the scalp dance, but it appears in only 35 percent of the war songs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says 42 percent of the war songs show even beats that characterize
    the Mide'.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
