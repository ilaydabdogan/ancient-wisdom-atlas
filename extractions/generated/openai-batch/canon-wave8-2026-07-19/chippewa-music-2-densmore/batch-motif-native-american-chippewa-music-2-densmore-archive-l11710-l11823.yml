canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Chippewa drum-related mourning ceremony:
    White Feather arranges for mourners to be invited, face painting is performed
    with stated meanings for red paint, songs are sung, an old Civil War veteran gives
    strength and power to an aged mourner, White Feather exhorts the mourners to lift
    their eyes and release sorrow, and the mourners are seated while gifts are placed
    beside them. It also includes a brief name analysis translating a name as “sky
    in commotion” and musical analysis of the songs.'
  language: English
  quote_policy: summarized
