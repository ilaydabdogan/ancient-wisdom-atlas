canonical_text:
  quote: ''
  summary: The passage moves from a brief children’s tale-song sequence involving
    a pig in a tree, fighting Frenchmen, a rich man traveling toward water, and a
    rabbit speaking to a lynx, into an ethnographic discussion of Chippewa children’s
    folktales and songs. It then gives the tale of the Coon and the Crawfish, in which
    crawfish ignore an old female crawfish’s warning, attack a cunning coon, and are
    eaten while the old female crawfish remains safe in the water.
  language: English
  quote_policy: summarized
