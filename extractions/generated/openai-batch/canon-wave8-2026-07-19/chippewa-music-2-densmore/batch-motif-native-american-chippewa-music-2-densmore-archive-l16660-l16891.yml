canonical_text:
  quote: ''
  summary: The passage shifts from rhythmic-analysis tables to an account of begging
    dance songs. It reports that the first song and the dance came from the Assinniboin/Rock
    Sioux and were long practiced among the Chippewa. In the origin account, a newborn
    boy is placed outside a wigwam among dogs; the dogs warm him, transmit a song
    to him by willing him to know it, and later follow him as he sings from camp to
    camp with a deer-hoof rattle. He and the dogs receive food, and this is presented
    as the origin of the begging dance. Later dancers go from wigwam to wigwam, sing
    and dance, sometimes around the fire, and are given food or provisions. The song
    texts include the dogs going with the singer and a dog-identified singer howling
    to warriors.
  language: English
  quote_policy: summarized
