- id: obs:2
  text: The account attributes to the Sioux a custom of placing a newborn baby boy
    on the ground outside the wigwam door, near where the dogs usually lie, until
    he could creep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the child lay outside, dogs formed a circle around him with their heads
    toward him, and their breath helped keep him warm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
