  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If wigwam occupants were asleep, dancers entered and danced around their fire;
    the people then arose and gave them food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If no cooked food was available, visitors took provisions and placed them
