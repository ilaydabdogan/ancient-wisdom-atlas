  summary: The passage analyzes relationships between song content and tonality in
    a corpus of Chippewa songs. It notes that songs directly expressing sadness, distress,
    or uncertainty are generally in minor tonality, while many old dream songs are
    major and associated with reliance on supernatural help. It gives examples from
    Mide', war, love, unclassified, and moccasin game songs.
  language: English
