  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A later war expedition is organized by Ge'miwunac' of the Pillager Band and
    includes Pillager, Mississippi, and Mille Lac Chippewa men starting from Crow
    Wing in canoes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the first camp, some men dance around the fire while others sit still,
    and all sing before sleeping; Odjib'we says the song is sung every evening while
    the party is away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The party travels through woods, then on the prairie rests in concealment
