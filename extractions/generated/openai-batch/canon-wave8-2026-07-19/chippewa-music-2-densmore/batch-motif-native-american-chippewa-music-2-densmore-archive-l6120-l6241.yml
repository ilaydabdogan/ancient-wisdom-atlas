canonical_text:
  quote: ''
  summary: The passage recounts an ambush in which Odjib'we shoots a Sioux combatant,
    after which Mo'kadjiwens removes the scalp but loses or forgets it during the
    return journey; a song sung in a victory dance both credits and ridicules him.
    It then introduces another Chippewa war expedition organized by Ge'miwunac', including
    travel by canoe, evening war dances around a fire, concealed travel, scouting,
    reading a new Sioux trail, and finding lodges, a dance/council site, and forty-two
    stones marking the number of Sioux warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Odjib'we and the rest of his war party remain in concealment, hear gunshots,
    and then see the Sioux running toward them after their own men's shots miss.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sioux says that he cannot be hit and is brave; Odjib'we replies that he
    too is brave.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Odjib'we strikes at the Sioux with his gun, the Sioux dodges and tries to
    strike back with an empty gun, then runs away and is shot in the back by Odjib'we.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mo'kadjiwens removes the scalp, and the scalp is placed in his charge as the
    war party starts home.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the noon halt the scalp is either laid beside Mo'kadjiwens or hung on a
    bush and forgotten; it is not missed until night camp, many miles away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Because returning for the scalp is considered impossible, the party composes
    a song sung at home in the victory dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The song text names Mo'kadjiwens, says he took a Sioux scalp, and says it
    is hanging in a marsh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The song's analysis describes it as lively, in steady triple measure, harmonic
