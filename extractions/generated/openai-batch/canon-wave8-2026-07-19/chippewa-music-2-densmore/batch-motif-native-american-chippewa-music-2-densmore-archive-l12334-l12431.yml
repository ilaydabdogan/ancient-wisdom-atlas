canonical_text:
  quote: ''
  summary: 'The passage describes stages of an intertribal drum-presentation ceremony:
    Menominee and Chippewa singing, dancing, handshaking, hospitality to the arriving
    Chippewa, a rain delay, renewed preparations, placement of drums in the dancing
    circle, tobacco collected at the entrance, and feather garments used as ceremonial
    badges.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Captions identify a sequence including Menominee awaiting the Chippewa, the
    Chippewa approach, participants in the drum-presentation ceremony, Chippewa shaking
    hands with Menominee, and Menominee listening to Chippewa singing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Menominee beat their drums, sang, and danced around them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Chippewa sang songs used at the opening of four days of dancing at Lac
    du Flambeau, including special songs of officials of the drum party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Menominee listened while the Chippewa sang; women sat with heads bowed
    in a posture compared to their singing posture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wis'kino rose, addressed the Chippewa as relatives, said they must be tired
    and hungry after their journey, and ordered cooked food brought to them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Food was placed at the left of the entrance; men and women brought kettles,
    pails, and pans containing wild rice, white rice, squash, tea, and fried bread.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each Chippewa used his own cup or pan and spoon, and the Chippewa aid supervised
    distribution of the food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Chippewa ate the feast, while none of the Menominee partook of it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the feast, kettles, pails, and pans were placed outside the entrance,
    where Menominee women later identified their own vessels by dents or colored strings
    on the handles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the remainder of the day the two tribes danced together, while Na'ganac'
    moved the equipment to the assigned camp and the Chippewa camp was established
    that night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rain, standing water in the dancing circle, smoldering camp fires, and closed
    tents made it impossible to proceed with the ceremony; the day was not counted
    among the four dancing days because the drums had not yet been presented.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the next morning was clear, people prepared for the chief drum presentation
    with gala clothing, painted faces, and rearranged braids.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Men in charge of the drums cut pine branches and laid them in the dancing
    circle, especially where the drum would rest and the drummers and singers would
    sit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'By about half-past 10, Chippewa and Menominee were in the dancing circle
    with five drums arranged: two Menominee drums on the right, the chief drum and
    warrior drum on the left near the entrance, and another Menominee drum nearest
    Wis''kino.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: The aid of the chief drum sat at the entrance, received a toll of tobacco
    from everyone who entered, and wore an elaborate feather garment as a badge of
    office.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The feather garment was described as a Sioux garment; the writer says a similar
    garment was worn by Teton Sioux in social dances and by Chippewa at Leech Lake,
    who said they had received it from the Sioux.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The feather garment consisted of cloth with large feathers sewed closely to
    it, fastened by the quills so they moved with the wearer's motion; it attached
    to a belt and hung behind to the ankles.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:18
  text: The wearer customarily protected the feather garment by spreading a blanket
    over the seat box and arranging the garment on the blanket when sitting.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Four leading Menominee dancers wore the feather garments, which the passage
    compares visually to a row of brilliant birds.
  category: attribute
  evidence_refs:
  - ev:11
