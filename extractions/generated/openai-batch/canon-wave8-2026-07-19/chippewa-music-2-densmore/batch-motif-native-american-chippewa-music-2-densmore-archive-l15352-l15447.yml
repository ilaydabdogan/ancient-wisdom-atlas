canonical_text:
  quote: ''
  summary: The passage describes a moccasin game at White Earth, including an account
    of a man whose wife appeared and told him about four hidden bullets that should
    be placed in water before use, leading to success and a continuing custom of soaking
    bullets. It also records another player’s dream of moccasins with money beneath
    them, then explains the game’s equipment, teams, hiding and guessing procedures,
    bodily signs watched by skilled players, wagers, and song-and-drum accompaniment
    during the hiding of bullets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage headings identify the subject as hiding bullets and guessing the
    location of the marked bullet in the moccasin game at White Earth, Minnesota.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wife appeared to a man and told him that four bullets were hidden somewhere
    in the woods and would bring him success in the moccasin game if he let them lie
    in water before use.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man searched in the woods, found four bullets, placed them in water at
    the edge of a lake, announced a moccasin game, and won everything by using the
    bullets that had been in the water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the incident began the custom of soaking bullets,
    and that many players now do so believing it will bring success in the game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another successful player reportedly dreamed of a row of moccasins and found
    a piece of money under each as he took them up one after another; the dream gave
    him confidence in playing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The game may be played by two men but usually has four contestants, with two
    partners on each side.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each side in turn hides four bullets under four moccasins laid in a row on
    a blanket, and one bullet is marked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Skill in the game consists in placing the marked bullet so it cannot be readily
    located by the opposing players.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The game implements include twenty counting-sticks, a slender striking-stick,
    hidden bullets, and additional bullets used by the guessing side to indicate its
    guess.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that self-control and keenness of observation are required,
    that the prize is given to the one who conceals rather than discovers, and that
    the hiding side scores.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Players study involuntary signs that may indicate the placement of the marked
