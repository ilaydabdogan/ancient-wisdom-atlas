canonical_text:
  quote: ''
  summary: 'The passage gives two song items. No. 178, “He Is Going Away,” sung by
    Mrs. Julia Warren Spears without drum, has text about a lover going to a very
    distant land and soon returning. No. 179, “Song of the Game of Silence,” sung
    by John W. Carl without drum, gives a playful sequence of images used in a children''s
    silence game: a pig at the edge of sunshine, people living in a hollow tree fighting,
    someone carrying a pack toward the great water, and a rabbit speaking about eating
    bark, seeing a lynx track, and escaping along a jumping trail. The prose explains
    the rules and rewards of the children''s game and notes that the rabbit passage
    refers to a familiar folk tale in which the rabbit defied the lynx.'
  language: English with Ojibwe words and glosses
  quote_policy: summarized
