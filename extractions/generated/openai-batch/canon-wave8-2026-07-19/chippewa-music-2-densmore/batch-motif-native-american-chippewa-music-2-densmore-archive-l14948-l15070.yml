canonical_text:
  quote: ''
  summary: The passage first gives musical analysis of a song’s rhythmic and metric
    units. It then describes E'niwub'e returning from a fasting vigil; his grandfather
    requires him and other boys to dance around a medicine pole before eating. A dish
    is placed at the foot of the pole, water flows from a hole below a deerskin banner,
    and the boys drink the water to break their fast. The songs are said to have been
    composed in the grandfather’s dreams, and the pole corresponds to a vision. The
    passage also gives the song text, including cool water and manido, and notes a
    similar Assiniboin practice involving water from a Sun-dance pole.
  language: English
