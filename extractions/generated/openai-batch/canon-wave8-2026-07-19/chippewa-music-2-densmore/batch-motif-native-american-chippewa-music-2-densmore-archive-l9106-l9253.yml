  summary: The passage gives song texts and analysis for two Chippewa war-related
    songs. One song describes men coming across the prairie with the noise of passing
    feet and playing a game. A narrated account says a warrior became exhausted while
    a war party was returning home; his companions stayed because of the danger from
    enemies. The warrior used his medicine, rose, composed and sang a song, and continued
    with the party. A following song text voices inability to travel and the intention
    to borrow a means of arriving.
