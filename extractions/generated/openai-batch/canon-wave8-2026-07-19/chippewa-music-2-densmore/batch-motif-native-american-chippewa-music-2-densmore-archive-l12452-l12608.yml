canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Chippewa drum-presentation ceremony:
    a repeated pipe offering toward the sky, songs of the pipe and drum, speeches
    and a feast, ceremonial treatment of the drum, the transfer of gifts and clothing
    to Wis''kino, the lowering and presentation of the drum, and the selection of
    a young man to care for the pipe belonging to the drum.'
  language: English
  quote_policy: summarized
