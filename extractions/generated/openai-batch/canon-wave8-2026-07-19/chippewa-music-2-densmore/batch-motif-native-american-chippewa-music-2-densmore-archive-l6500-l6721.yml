canonical_text:
  quote: ''
  summary: The passage describes a Chippewa dream song with obscure words about the
    heavens, then gives Odjib'we's account of a fight at Ca'gobens' camp near the
    Minnesota River. A Chippewa war party ambushes a Sioux man crossing by canoe;
    a woman raises the alarm, Sioux combatants cross the river, and Ga'witayac' is
    mortally wounded. He is carried on a pole litter and sings his death song until
    he dies. The large bear is identified as his manido animal, and the song text
    says the large bear deceives him. The passage also notes battle songs composed
    about the fight and sung in dances after the warriors' return.
  language: English
  quote_policy: summarized
