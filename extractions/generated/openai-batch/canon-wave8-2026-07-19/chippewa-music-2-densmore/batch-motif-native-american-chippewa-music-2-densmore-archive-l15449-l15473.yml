canonical_text:
  quote: ''
  summary: The passage describes rules of the moccasin game after bullets have been
    hidden. A player with a striking-stick may make a confident individual guess by
    a two-finger gesture, while his partner may also indicate a guess by positioning
    a marked bullet in his own hand. The striking-stick player has three chances to
    turn moccasins; the bullet-holding partner has one guess. A correct guess by both
    players is called a “double crack” and grants an additional turn, though the final
    condition is cut off in the excerpt.
  language: English
