canonical_text:
  quote: ''
  summary: The passage describes songs connected with the organization of a Chippewa
    war expedition. A prospective war-party leader sends a messenger with tobacco
    and a pipe to invite warriors; willing warriors smoke the pipe. The messenger
    reports success in song. Warriors then camp near the leader's lodge, attend a
    feast, give a final assent, and the expedition is formally inaugurated. The leader
    announces nightly dances until reaching the enemy, and an initial dance song expresses
    fearlessness when death speaks.
  language: English, with Chippewa/Ojibwe song texts and English glosses
  quote_policy: summarized
