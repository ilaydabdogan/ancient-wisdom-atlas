canonical_text:
  quote: Death allotted to man, (but) life they retain’d in their keeping.
  summary: Gilgamish speaks with the Wine-maker after Enkidu's death. He recounts
    Enkidu's companionship, heroic exploits, death, burial, and his own fear of dying.
    In an Old Babylonian interpolation, the Wine-maker advises him that the gods assigned
    death to mortals and that human life should be spent in eating, rejoicing, bathing,
    and family affection. Gilgamish asks for the way to Uta-Napishtim. The Wine-maker
    warns that no one but Shamash crosses the Ocean, that the Waters of Death block
    the way, and that Ur-Shanabi is Uta-Napishtim's boatman. Gilgamish then takes
    up axe and blade.
  language: English
  quote_policy: quoted
