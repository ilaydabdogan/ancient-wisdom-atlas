canonical_text:
  quote: ''
  summary: A hunter reports a powerful wild figure who frees animals and disrupts
    traps. Gilgamish instructs the hunter to bring a courtesan to the watering place.
    The courtesan reveals herself to Enkidu, who mates with her for six days and seven
    nights. Afterward the animals flee from Enkidu, his former running strength fails,
    and his wisdom broadens. The woman then urges him to leave the beasts and go to
    high-walled Erech, the sacred dwelling of Anu and Ishtar, where Gilgamish rules
    powerfully.
  language: English
  quote_policy: summarized
