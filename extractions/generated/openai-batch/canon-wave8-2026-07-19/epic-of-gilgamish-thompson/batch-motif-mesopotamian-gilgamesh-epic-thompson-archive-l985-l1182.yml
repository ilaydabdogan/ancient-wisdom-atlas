canonical_text:
  quote: ''
  summary: 'The passage recounts preparations for Gilgamish and Enkidu’s expedition
    against Humbaba: craftsmen make heavy weapons; Gilgamish addresses the elders
    of Erech and declares his intent to enter the Cedar Forest, defeat Humbaba, fell
    cedars, and win fame. The elders warn of Humbaba’s terrifying nature, bless Gilgamish,
    and advise reliance on Enkidu, Shamash, and Lugal-banda. Gilgamish prays to Shamash,
    the heroes make offerings, receive road counsel, and set out toward Humbaba.'
  language: English
  quote_policy: summarized
