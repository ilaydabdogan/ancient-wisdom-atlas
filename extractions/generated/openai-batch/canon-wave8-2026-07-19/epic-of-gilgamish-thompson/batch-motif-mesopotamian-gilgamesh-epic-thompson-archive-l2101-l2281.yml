canonical_text:
  quote: "“Me did he lead to the Dwelling of Darkness, the home of Irkalla”"
  summary: In a fragmentary passage, the gods determine that Enkidu, but not Gilgamish,
    will die after the slaying of the Heavenly Bull and Humbaba. Enkidu curses the
    hetaera, but Shamash answers from heaven and reminds him of the benefits she brought
    him. Enkidu relents and blesses her. He then reports a night dream in which a
    dark, lion-clawed figure overcomes him and leads him to the underworld, described
    as a dark, one-way dwelling where the dead eat dust and mud and where Ereshkigal
    and the Recorder of Hades are present.
  language: English
  quote_policy: quoted
