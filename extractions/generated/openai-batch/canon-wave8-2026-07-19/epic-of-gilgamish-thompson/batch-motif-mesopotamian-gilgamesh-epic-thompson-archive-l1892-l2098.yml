canonical_text:
  quote: ''
  summary: Ishtar complains to Anu that Gilgamish has insulted her. She asks her father
    Anu to make a Heavenly Bull against Gilgamish; Anu warns of seven years of scarcity,
    and Ishtar answers that she has provided or will provide grain and fodder. In
    Erech, the Bull destroys groups of men with fiery breath, but Enkidu and Gilgamish
    overcome and kill it. They remove its heart and offer it to the Sun-god. Ishtar
    laments from the ramparts; Enkidu throws a body part of the Bull before her and
    threatens her. Ishtar gathers female devotees and prostitutes to lament over it.
    Gilgamish has the Bull’s horns admired and dedicated to Lugal-banda, washes with
    Enkidu in the Euphrates, parades in Erech, praises himself and Enkidu, holds a
    revel, and then Enkidu reports a dream asking why the great gods are taking counsel.
  language: English
  quote_policy: summarized
