candidate_motifs:
- id: motif:1
  label: Rejected divine desire leads to punitive monster request
  taxonomy_refs:
  - divine_beloved
  - divine_parent_child
  basis: Ishtar’s complaint to Anu follows Gilgamish’s recounting of her sins after
    her request for bodily favor, and she asks her father to make the Heavenly Bull
    against him.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The fuller proposal and refusal occur before this excerpt; here they are
    only alluded to.
- id: motif:2
  label: Celestial bull with fiery breath defeated by a heroic pair
  taxonomy_refs:
  - culture_hero
  - chaos
  basis: The Heavenly Bull attacks in Erech, overcomes groups of men with fiery breath,
    and is eventually slain after Enkidu seizes it; the heroes then sacrifice its
    heart.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no exact monster-slaying or bull-combat category;
    'chaos' is a functional approximation, and the slaying itself is in a gap summarized
    by the editor.
- id: motif:3
  label: Heart of a slain adversary offered to a god
  taxonomy_refs:
  - sacrifice
  basis: After killing the Bull of the Heavens, the heroes remove its heart and offer
    it in sacrifice to the Sun-god with libation.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage clearly states the offering, though some surrounding lines
    are damaged.
- id: motif:4
  label: Victory trophy dedicated in a sacred or ancestral shrine
  taxonomy_refs:
  - sacred_exchange
  basis: Gilgamish has the Bull’s horns admired, devotes them for unguent to Lugal-banda,
    and hangs them in the shrine of his forbears.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The dedication is explicit, but an exchange or reciprocal divine response
    is not described in this excerpt.
- id: motif:5
  label: Ominous dream of a divine council after triumph
  taxonomy_refs:
  - divine_judgment
  basis: After the revel, Enkidu dreams and asks why the great gods are taking counsel
    together at the opening of the tablet titled 'The Death of Enkidu.'
  evidence_refs:
  - ev:12
  confidence: low
  cautions: The actual content and outcome of the dream are mostly outside or lost
    after this excerpt; the judgment connection is only suggested by the title and
    opening question.
comparison_claims:
- id: claim:1
  claim: The editor notes that a damaged threat by Ishtar is usually restored from
    the Legend of the Descent of Ishtar to Hades, where she threatens to break down
    a door and release ghosts so that the dead outnumber the living.
  claim_level: same_function
  target: Legend of the Descent of Ishtar to Hades
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial restoration note, not fully preserved wording
    in the excerpt itself; it supports a cautious functional comparison only.
- id: claim:2
  claim: The editor notes that the incident of creating the Heavenly Bull also appears
    on a Semitic fragment from Boghaz Keui, where the Bull is described as a young
    steer of six months.
  claim_level: same_motif
  target: Semitic fragment from Boghaz Keui, cited in the note as Ketls. Boghazk.
    iv. 12
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is mediated by the editor’s note and not by direct quotation
    of the Boghaz Keui fragment in this passage.
