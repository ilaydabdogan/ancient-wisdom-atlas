  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Enkidu sits before the hetaera/courtesan, forgets the place of his birth,
    and mates with her for six days and seven nights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman tells Enkidu that he is like a god, asks why he ranges with beasts
    in the desert, and offers to lead him to broad-marketed Erech and E-Anna, the
    dwelling of Anu, where Gilgamish lives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Enkidu hears and accepts the woman’s advice; she gives him a garment and leads
    him by the hand to the shepherds’ booths and sheepfolds.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Enkidu was formerly accustomed to suck milk from wild things and does not
    initially know how to eat bread or drink mead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman instructs Enkidu to taste bread as an essential of life and to drink
    mead as a customary use of the country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Enkidu eats bread until gorged, drinks seven bumpers of mead, becomes cheerful,
    anoints the hair of his body with oil, and is said to become human.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Enkidu dons a garment to be like a man, takes his weapon, hunts lions that
