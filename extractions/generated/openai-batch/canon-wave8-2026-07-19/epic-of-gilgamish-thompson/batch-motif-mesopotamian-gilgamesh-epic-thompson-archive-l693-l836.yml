  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A man tells Enkidu that Gilgamish calls him to the House of Community and
    speaks of offerings due to the city and the king of broad-marketed Erech.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Enkidu enters broad-marketed Erech ahead of the courtesan, and the populace
    gathers behind him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The people of Erech say that Enkidu is like Gilgamish, slightly shorter but
