canonical_text:
  quote: "“Oil on the hair of his body anointed: and (thus) became human.”"
  summary: Fragmentary Old Babylonian sequence in which Enkidu is drawn away from
    beast life by the courtesan, led toward Erech and E-Anna, instructed in bread,
    mead, oil, clothing, and human custom, made a protector of shepherds, brought
    into Erech, publicly compared with Gilgamish, and then shown blocking Gilgamish
    at the love-rites before the two grapple like bulls.
