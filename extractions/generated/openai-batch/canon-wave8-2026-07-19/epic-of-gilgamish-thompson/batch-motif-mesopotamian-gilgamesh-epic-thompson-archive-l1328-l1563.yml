  summary: A damaged portion of the epic describes Enkidu addressing the Gate of the
    Forest, the companions preparing to enter the cedar forest and confront Humbaba,
    Enkidu’s fear and weakness, Gilgamish’s encouragement, their arrival at the forest
    barrier, their sight of the sacred cedar landscape, and Gilgamish’s dream of a
    falling mountain interpreted by Enkidu as a favorable omen of Humbaba’s defeat.
