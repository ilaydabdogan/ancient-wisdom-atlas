canonical_text:
  quote: ''
  summary: An unnamed speaker petitions Enlil, the Moon-god, and Ea to raise Enkidu
    from the earth, saying that Enkidu was seized by the earth rather than by disease,
    Namtar, Nergal, or battle. Enlil and the Moon-god do not answer. Ea instructs
    Nergal to open a hole in the earth so Enkidu's spirit may rise and speak with
    his brother. Enkidu's spirit emerges, the two embrace and mourn, and Enkidu gives
    fragmentary descriptions of the laws and conditions of the Underworld, including
    decay, mourning for the slain, unrest for an unburied corpse, and deprivation
    for an untended ghost.
  language: English
  quote_policy: summarized
