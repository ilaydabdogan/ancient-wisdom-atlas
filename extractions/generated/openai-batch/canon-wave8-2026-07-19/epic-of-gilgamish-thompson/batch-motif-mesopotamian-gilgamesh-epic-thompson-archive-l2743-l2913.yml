canonical_text:
  quote: ''
  summary: Gilgamish meets Ur-Shanabi, identifies himself, asks the way to Uta-Napishtim,
    and prepares a boat crossing by making poles. Ur-Shanabi warns him not to touch
    the Waters of Death. Gilgamish reaches Uta-Napishtim, recounts his hardships,
    and hears a reflection on mortality and divine determination of life and death.
    The next tablet begins with Gilgamish observing that Uta-Napishtim appears like
    himself.
  language: English
  quote_policy: summarized
