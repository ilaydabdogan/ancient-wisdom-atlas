canonical_text:
  quote: ''
  summary: After the exploit against Humbaba, Gilgamish cleans and adorns himself.
    Ishtar sees his beauty and proposes marriage, promising royal honor, a splendid
    chariot, cedar-fragrant entry, tribute, and fertile animals. Gilgamish rejects
    her, comparing her to unreliable and destructive things, and recounts former beloveds
    whom she harmed or transformed. Ishtar becomes enraged and goes up to Heaven to
    her parents Anu and Antu.
  language: English
  quote_policy: summarized
