  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Uta-Napishtim loads aboard silver, gold, all he possesses, and the seed of
    all living things.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Uta-Napishtim embarks his kindred and family, cattle, beasts of the field,
