  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mortal is told to pull down a dwelling, fashion a vessel, abandon possessions,
    seek life, disregard hoarded goods, save life, and make every creature embark
    in the vessel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
