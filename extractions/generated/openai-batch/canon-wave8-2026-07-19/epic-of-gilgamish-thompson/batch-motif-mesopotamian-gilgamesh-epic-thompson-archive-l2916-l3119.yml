canonical_text:
  quote: ''
  summary: 'Uta-Napishtim tells Gilgamish the hidden story of the gods'' counsel:
    the gods planned a deluge; Ea disclosed the plan and instructed a mortal of Shurippak
    to build a vessel, abandon possessions, and save living beings. The vessel was
    built, loaded with family, goods, animals, craftsmen, and the seed of living things,
    then sealed at the appointed storm. The storm and flood darkened and devastated
    the land, while the gods themselves feared the deluge; Ishtar and the Anunnaki
    lamented the destruction of humanity.'
  language: English
  quote_policy: summarized
