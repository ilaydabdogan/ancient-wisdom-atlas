candidate_motifs:
- id: motif:1
  label: Divine deluge destroys humanity
  taxonomy_refs:
  - flood_and_renewal
  basis: The great gods plan a deluge; the storm devastates the land, mortals cannot
    be seen, and Ishtar laments that her people have been blotted out and given to
    the sea.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The excerpt focuses on destruction and preservation; renewal after the
    flood is not included in the provided passage.
- id: motif:2
  label: Divine warning to build a life-preserving vessel
  taxonomy_refs:
  - ark_vessel
  basis: Ea discloses the gods' counsel to the mortal and commands him to build a
    vessel, embark every creature, load living seed, family, animals, and craftsmen,
    then enter and seal the vessel at the appointed time.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The vessel is described in practical construction terms; the passage does
    not include its landing or post-flood outcome.
- id: motif:3
  label: Secret divine counsel revealed to a human
  taxonomy_refs:
  - wisdom
  basis: Uta-Napishtim introduces the account as a hidden story and rede of the gods;
    Ea betrays the divine counsel to the mortal through the reed-hut and wall.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The available taxonomy contains 'wisdom,' but the passage frames the revelation
    as survival instruction more than general wisdom teaching.
- id: motif:4
  label: Divine destruction as collective decision
  taxonomy_refs:
  - divine_judgment
  basis: The gods in assembly purpose a deluge that destroys people; Ishtar later
    regrets having spoken evil in the assembly and ordaining havoc.
  evidence_refs:
  - ev:2
  - ev:11
  confidence: medium
  cautions: The passage does not state a moral charge or explicit judicial rationale
    for the deluge.
- id: motif:5
  label: Goddess laments her people as her offspring
  taxonomy_refs:
  - mother_goddess
  basis: Ishtar cries like a woman in travail and says she gave birth to her own people
    only for them to be consumed by the sea.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The maternal language is explicit, but the passage does not develop a
    broader mother-goddess episode beyond the lament.
- id: motif:6
  label: Divine fire in storm destruction
  taxonomy_refs:
  - world_destroying_fire
  basis: The Anunnaki brandish torches and flames shrivel the land as the deluge storm
    turns brightness into darkness.
  evidence_refs:
  - ev:9
  confidence: low
  cautions: Fire imagery accompanies the flood-storm, but the destruction is primarily
    described as deluge and storm rather than as a world-destroying fire alone.
