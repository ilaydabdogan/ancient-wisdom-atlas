canonical_text:
  quote: ''
  summary: The passage recounts the end of a deluge, the grounding of an ark on the
    Mountain of Nisir, the release of birds to test whether waters have abated, a
    sacrifice on the mountain, the gods' response and dispute over the flood, Enlil's
    granting of godlike status to Uta-Napishtim and his wife, and Gilgamish's failed
    challenge to remain awake while seeking life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hurricane, deluge, and tempest continue for six days and cease on the seventh
    day; the sea becomes still and humanity is described as returned to clay.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first-person narrator opens a hatchway, receives sunlight on his face,
    weeps, looks across the Ocean, and sees land at twelve points.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ark grounds on the Mountain of Nisir, and the mountain holds it fast for
    several days.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the seventh day after the grounding, the narrator releases a dove, then
    a swallow, and then a raven; the dove and swallow return for lack of a resting-place,
    while the raven sees the waters abating and does not return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator frees beasts to the four winds and makes a sacrifice and libation
    on the mountain peak with flagons and aromatic plants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The gods smell the offering's sweet savour and assemble around the sacrificer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Queen of the gods lifts jewels and declares that she will remember these
    days; she says Enlil alone may not come to the offering because he brought the
    deluge and destroyed her people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Enlil sees the vessel and becomes angry that a mortal has escaped the ruin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ninurta tells Enlil that only Ea could devise such a plan, and Ea then speaks
    to Enlil.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Ea rebukes Enlil for bringing a flood without counsel, urges that sin and
    guilt be visited on the sinner and guilty, and proposes lesser destructive agents
    such as lion, jackal, famine, or plague.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ea says he did not reveal the Great Gods' secret directly, but gave a dream
    to the figure called Abounding in Wisdom.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Enlil comes to the Ark, grasps the narrator's hand, raises him and his wife,
    touches their foreheads, blesses them, and declares that Uta-Napishtim and his
    wife shall become like the gods and dwell far away at the mouth of the rivers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Uta-Napishtim challenges Gilgamish not to fall asleep for six days and seven
    nights while seeking life.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Gilgamish falls asleep while sitting, and the sleep is compared to a breeze
    breathing upon him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Uta-Napishtim's wife asks that Gilgamish be awakened and allowed to return
    home in peace.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Uta-Napishtim instructs his wife to bake Gilgamish's flour, place it at his
    head, and mark the duration of his sleep on the house-wall; the baking and marking
    sequence is then carried out.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Uta-Napishtim touches Gilgamish, who wakes suddenly and asks whether Uta-Napishtim
    touched and roused him.
  category: sequence
  evidence_refs:
  - ev:10
