canonical_text:
  quote: ''
  summary: The elders advise Gilgamish to rely on Enkidu as guide and protector for
    the Cedar Forest journey. Gilgamish and Enkidu go to Nin-sun, who is described
    as wise and all-knowing; Gilgamish tells her of the far and unknown road to Humbaba.
    Nin-sun dresses in ritual attire, ascends to the roof, offers incense and sacrifice
    to Shamash, and prays concerning Gilgamish’s dangerous journey, invoking Aas as
    a remembrancer. Later columns are described as mutilated and repeat or fragmentarily
    allude to the journey, Humbaba, mountains, and the elders’ counsel.
  language: English
  quote_policy: summarized
