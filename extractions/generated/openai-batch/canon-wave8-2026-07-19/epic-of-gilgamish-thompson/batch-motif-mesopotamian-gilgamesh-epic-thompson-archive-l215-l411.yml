canonical_text:
  quote: ''
  summary: After editorial addenda, the passage begins the First Tablet. Gilgamish
    is introduced as a possessor of wisdom who knows hidden matters, preserves prediluvian
    tradition, journeys afar, records his travail on stone, and builds the walls of
    Erech and E-Anna. He is described as two-thirds divine and one-third human. The
    people of Erech complain to the gods that he is tyrannical and leaves no son,
    maid, daughter, spouse, or husband undisturbed. The gods appeal to Anu, who calls
    Aruru to create a counterpart so that Gilgamish may be opposed and Erech relieved.
    Aruru fashions Enkidu from clay in the desert. Enkidu is hairy, knows neither
    people nor land, lives with gazelles and cattle, eats herbage, and drinks at the
    water with beasts. A hunter encounters him at the watering place, becomes afraid,
    and tells his father of a powerful mountain-ranging figure who lives with the
    animals.
  language: English
  quote_policy: summarized
