canonical_text:
  quote: ''
  summary: Uta-Napishtim notes Gilgamish's inability to remain awake and Gilgamish
    laments the presence of Death. Uta-Napishtim orders Ur-Shanabi to wash and reclothe
    Gilgamish for his return. At his wife's prompting, Uta-Napishtim reveals a hidden
    plant in the ocean that can restore life or youth. Gilgamish descends with stones,
    obtains the thorny plant, and plans to take it to Erech. While he bathes at a
    pool, a serpent smells and steals the plant. Gilgamish weeps over the loss, then
    returns with Ur-Shanabi to high-walled Erech and points out its ramparts and brickwork.
    The passage ends with the heading of the Twelfth Tablet.
  language: English
  quote_policy: summarized
