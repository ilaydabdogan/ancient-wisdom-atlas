canonical_text:
  quote: ''
  summary: The passage moves from Enkidu's recognition of Gilgamish's divinely favored
    kingship into the Third Tablet, where Gilgamish and Enkidu become devoted friends
    and prepare an expedition to the Cedar Forest against Humbaba. Enkidu mourns the
    departure of his beloved, warns Gilgamish about Humbaba's deadly powers and divine
    appointment as forest guardian, while Gilgamish argues that mortals must seek
    lasting fame and commissions weapons for the journey.
