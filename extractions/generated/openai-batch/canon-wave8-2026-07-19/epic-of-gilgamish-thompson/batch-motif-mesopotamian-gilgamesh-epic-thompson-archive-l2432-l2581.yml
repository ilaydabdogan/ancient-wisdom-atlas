canonical_text:
  quote: ''
  summary: Gilgamish reaches the Mountains of Mashu, where Scorpion-men guard the
    portals of Shamash at the Sun-god's rising and setting. The Scorpion-man and his
    wife recognize Gilgamish's mixed divine and human nature. Fragmentary summaries
    describe Gilgamish seeking Uta-Napishtim about death and life, taking the Road
    of the Sun through darkness into full sunlight, and seeing the Tree of the Gods.
    Shamash warns him that he will not find the life he seeks. Gilgamish then approaches
    Siduri, the maker of wine, who bars her doors when she sees him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mountains of Mashu are described as the place where watch is kept over
    the Sun-god's rising and setting; their summits reach heaven, their lower parts
    reach Hell, and Scorpion-men stand sentry at their portals as Wardens of Shamash.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Gilgamish sees the Scorpion-men, he is alarmed, turns pale, and grovels
    before them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Scorpion-man says Gilgamish has the flesh of the gods in his body, and
    the Scorpion-man's wife says he is two parts god-like and one third human.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a fragmentary reported section, Gilgamish is said to intend to ask Uta-Napishtim
    about death and life; the Scorpion-man says the mountain traverse has not previously
    been made and describes the Road of the Sun as a twenty-four-hour journey beginning
    in deep darkness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gilgamish sets off on the Road of the Sun; the early periods are in deep darkness,
    by the ninth period he reaches a glimmer of light, and by the twelfth double hour
    he reaches full sunlight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gilgamish beholds the Tree of the Gods, which is described as bearing ruby-like
    fruit, tendrils, azure foliage, and fruits desirable to the eye.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shamash summons Gilgamish and says that the life he seeks he will not find;
    Gilgamish answers by contrasting death in the earth with seeing the Sun and its
    brightness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Siduri is described as a maker of wine; Gilgamish wanders toward her wearing
    pelts, having divine flesh in his body, woe in his belly, and the appearance of
    someone who has traveled far.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Siduri sees Gilgamish, suspects danger, and bars her postern, inner door,
    and chamber; Gilgamish hears the shutting and asks why she has barred them, threatening
    to strike the portal and break the bolt.
  category: action
  evidence_refs:
  - ev:8
