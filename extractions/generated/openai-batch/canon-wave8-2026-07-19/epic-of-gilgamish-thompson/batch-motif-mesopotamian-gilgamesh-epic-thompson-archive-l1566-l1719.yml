canonical_text:
  quote: ''
  summary: Gilgamish and Enkidu travel, rest, and invoke the mountain for a dream.
    Gilgamish experiences frightening dream-visions involving storm, darkness, fire,
    death, and a mountain-related variant dream. Later, in the fight with Humbaba,
    Gilgamish prays to the Sun-god, who raises eight winds that immobilize Humbaba.
    Humbaba surrenders and offers service, but Enkidu advises Gilgamish not to spare
    him; the passage ends with Humbaba's head being cut off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers break their fast at the fortieth league, rest at the sixtieth,
    and hollow a pit in the sunshine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gilgamish mounts above the pit or place, pours out meal for the mountain,
    and asks the mountain to grant a dream and breathe on him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mountain grants a dream; a chill wind-blast or gust comes over Gilgamish,
    he cowers, sleep descends on him, and he wakes at midnight fearful and trembling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gilgamish reports a third dream in which the firmament roars, earth resounds,
    the day darkens, lightning and flames appear, pestilence or death fills the scene,
    and fires or brands fade to ashes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gilgamish proposes going down to the desert so that he and Enkidu may counsel
    together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A variant account says a mountain casts the dreamer down and seizes his feet;
    a very comely man draws him beneath the mountain, gives him water to drink, assuages
    his desire, and sets his feet on earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the fight with Humbaba, Gilgamish prays to the Sun-god in heaven after
    starting on a road.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sun-god hears Gilgamish and raises eight winds against Humbaba, including
    winds from the north and south, a tempest or storm wind, a chill wind, a whirlwind,
    and an evil wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The winds seize Humbaba before and behind so that he cannot move forward or
    back, and Humbaba surrenders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Humbaba asks Gilgamish to stay his hand, offers to become his henchman, and
    asks Gilgamish to be his master.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Enkidu tells Gilgamish that he must not accept Humbaba's proposal and that
    Humbaba must not remain alive.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The expedition succeeds with the cutting off of Humbaba's head.
  category: action
  evidence_refs:
  - ev:7
