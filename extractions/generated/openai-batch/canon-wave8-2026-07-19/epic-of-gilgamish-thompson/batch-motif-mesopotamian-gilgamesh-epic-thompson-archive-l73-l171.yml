canonical_text:
  quote: ''
  summary: The passage contains title-page and dedication material for R. Campbell
    Thompson's 1928 English translation, followed by a preface summarizing the antiquity,
    tablet transmission, languages, and narrative contents of the Epic of Gilgamish.
    The preface recounts Gilgamish as king of Erech, Enkidu's creation and friendship
    with him, the Cedar Forest expedition, Ishtar's rejected proposal and the divine
    bull, Enkidu's death, Gilgamish's search for eternal life, Uta-Napishtim's flood
    account, the plant of renewed youth stolen by a snake, and Enkidu's return from
    the Underworld to describe the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the work as an English translation from cuneiform tablets
    in the British Museum, rendered by R. Campbell Thompson and published in 1928.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preface states that the epic was written in cuneiform on Assyrian and
    Babylonian clay tablets and presents it as a poem of great antiquity.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The preface connects the epic's remote origin with the Sumerians and mentions
    a surviving fragment of a Sumerian Deluge text.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The preface describes multiple textual stages, including Akkadian tablets,
    versions from Boghaz Keui in Akkadian, Hittite, and another dialect, an Ashur
    tablet, seventh-century editions for the Royal Library at Nineveh, and later neo-Babylonian
    fragments.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seventh-century edition is described as divided into twelve tablets, each
    containing about three hundred metrical lines.
  category: object
  evidence_refs:
  - ev:3
