candidate_motifs:
- id: motif:1
  label: Flood survivor granted eternal life
  taxonomy_refs:
  - flood_and_renewal
  basis: Uta-Napishtim tells the story of the Flood and how the gods gave him, the
    one man saved, eternal life.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage summarizes the Flood episode but does not provide the full
    flood narrative details.
- id: motif:2
  label: Quest for eternal life after companion's death
  taxonomy_refs:
  - mystical_quest
  basis: After Enkidu dies, Gilgamish fears similar extinction and undertakes a journey
    in search of eternal life.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage is a preface summary rather than the epic text itself.
- id: motif:3
  label: Life-renewing plant lost to a serpent
  taxonomy_refs:
  - serpent
  basis: Gilgamish obtains a plant that can make him young again, but a snake snatches
    it from him at a pool.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The available taxonomy includes serpent but not a more specific rejuvenation-plant
    motif.
- id: motif:4
  label: Rejected divine marriage proposal and punitive monster
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  - divine_judgment
  basis: Ishtar falls in love with Gilgamish and proposes marriage; when he rebuffs
    her, she obtains a divine bull intended to destroy the heroes, and Enkidu's overcoming
    of the bull leads to divine punishment.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The marriage is proposed and rejected, so mapping to sacred marriage is
    approximate and needs review.
- id: motif:5
  label: Heroic expedition to guarded forest for valued wood
  taxonomy_refs:
  - departure
  basis: Gilgamish and Enkidu determine to go together to the Forest of Cedars, guarded
    by Humbaba, to carry off cedar wood for the city.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The available taxonomy lacks a precise forest-guardian or monster-slaying
    wood-acquisition motif.
- id: motif:6
  label: Return of the dead as underworld witness
  taxonomy_refs:
  - afterlife_journey_map
  basis: Enkidu comes forth from Hades or the Underworld and describes the sad fate
