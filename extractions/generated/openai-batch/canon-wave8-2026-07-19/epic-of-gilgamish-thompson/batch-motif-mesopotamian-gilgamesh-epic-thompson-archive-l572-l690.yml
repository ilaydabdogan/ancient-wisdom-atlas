canonical_text:
  quote: ''
  summary: 'Enkidu accepts the courtesan''s counsel and seeks to go to the holy temple
    and high-walled Erech, where he plans to challenge Gilgamish. The courtesan describes
    Erech''s festive life and Gilgamish''s strength, beauty, divine favor, and wisdom.
    Gilgamish then recounts two dreams to his mother: one of a heavenly Anu-like figure
    falling upon him, and another of an axe entering Erech. In both dreams the object
    is gathered around by people, held by Gilgamish like a woman, presented to his
    mother, and interpreted by her as a strong friend and equal who will stand by
    him.'
  language: English
  quote_policy: summarized
