comparison_claims:
- id: claim:1
  claim: The passage itself says that burning men killed in battle may have been either
    a survival from the time when the Pimas lived on the Colorado or a recent adoption
    from the Maricopas, who habitually cremated their dead.
  claim_level: historical_contact
  target: Maricopa cremation practice and possible earlier Colorado-period Pima practice
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: uncertain
  limitations: The source frames this as speculation between alternatives and gives
    no decisive evidence in this passage.
