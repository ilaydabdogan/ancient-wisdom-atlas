canonical_text:
  quote: ''
  summary: The passage narrates Vulture's magical darkness and ascent by four colored
    light-threads to the sun, the sun's heat killing Elder Brother, Elder Brother's
    later revival and descent through the earth, his recruitment of people who had
    escaped a flood, their emergence through a Gopher-made hole, Coyote's disobedience
    causing the opening to close, and Elder Brother's subsequent military campaign
    against several pueblos and chiefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People gather inside a house or va'aki with closed doors, and Vulture brings
    heavy darkness during daytime.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A beam develops into four colored threads of light reaching the sun, and Vulture
    ascends each thread in turn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vulture tells the people that Elder Brother will fall dead in four days and
    reaches the sun on the fourth night.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Vulture asks the sun to spit heat on Elder Brother's house, four pools of
    water, and dwelling places; the sun does so, the fountains boil, and Elder Brother
    is suffocated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Elder Brother's death, his skeleton lies exposed until boys hear a thunder-like
    noise, see him regaining life and power, and report this to the people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Armed people surround Elder Brother, and he sinks into the earth and disappears
    before them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Elder Brother reaches people through the earth whom Earth Doctor had helped
    escape the flood, tells them of his mistreatment, and asks them to fight with
    him and take the land away from the Indians.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After four months of preparation, the recruited people begin a journey with
    a departure song.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Elder Brother tells Gopher to bore a hole, and Gopher makes a hole through
    the earth like a winding stair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coyote discovers the people emerging like ants, ignores Elder Brother's warning
    not to go near until all have come out, looks down the hole and laughs, and the
    opening closes after five gentes emerge.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Elder Brother and his followers sing and dance at emergence, with songs mentioning
