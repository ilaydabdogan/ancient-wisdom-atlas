canonical_text:
  quote: ''
  summary: The passage describes Pima wooden and fiber-made implements, including
    calendar sticks, spurs, saddles, awls, a rope twister, A'mina medicine-stick bundles,
    animal effigies used in healing, and rare wooden masks. It gives details on materials,
    construction, use, and several ritual or medical associations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Calendar sticks from Casa Blanca, Gila Crossing, and Blackwater are described
    as wooden sticks bearing records or symbols; the Blackwater keeper had lost the
    original and used paper and pencil with the same symbols.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wooden spurs were made from crotched mesquite limbs and attached to the foot
    with thong loops over the instep and under the heel.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wooden saddletrees were sometimes made for riding and pack saddles, covered
    with rawhide, and furnished with wooden stirrups and grass or maguey-fiber saddle
    blankets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Pimas stated that mesquite-wood awls were used in basket making before
    steel, while current awls used pieces of umbrella rib set in native-made wooden
    or gum handles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The rope twister consists of a wooden pin or handle and a stick acting as
    a spindle whorl; one operator spins the apparatus while another adds fibers or
    hair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A'mina, or medicine sticks, are described as important sacred objects in medicine-men's
    paraphernalia, usually made of arrowwood and bound with native-spun cotton twine,
    sometimes with feathers attached.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: One A'mina bundle was made by Kd'mal tkak for exclusive use in exorcising
    Tcu'nylm, a spirit of disease.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The A'mina bundles vary in color, number, condition, points, and feathers,
    including green-painted sticks, blue-painted sticks, red feathers, turkey feathers,
    small-bird tail feathers, and old fragmentary bundles.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Wooden animal effigies representing a horned toad and a lizard were used by
    medicine-men in efforts to cure certain diseases.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Only two wooden masks were heard of among the Pimas during the writer's stay,
    and one was collected and depicted.
  category: object
  evidence_refs:
  - ev:10
