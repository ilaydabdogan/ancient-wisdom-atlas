  summary: The passage catalogs Pima food plants and their preparation, including
    wheat processed into flour, loaves, tortillas, fried doughnuts, and pinole; wild
    and cultivated plants eaten as greens, roots, stems, fruits, seeds, or beverages;
    cactus products used for food and thirst relief; former cotton cultivation; Papago
    trade in cactus fruit, peppers, and acorns; and pit-roasting and storage of saltbush
    seed.
