canonical_text:
  quote: ''
  summary: The passage describes Pima notched scraping sticks used to keep rhythm
    in ceremonial songs, including rain ceremonies where they are called rain sticks.
    It explains playing methods, describes four collected specimens, notes one old
    marked stick used in curing piholt disease and probably obtained from the Yaquis,
    and includes notes on related instruments among neighboring groups and on a flute
    ornament.
  language: English
  quote_policy: summarized
