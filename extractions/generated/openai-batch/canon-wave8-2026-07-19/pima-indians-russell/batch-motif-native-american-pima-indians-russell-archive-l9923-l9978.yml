  summary: The passage describes Pima defensive measures against Apache raids, including
    guards, sentinels, decoy fires, and village concentration. It also describes how
    a chief initiated a retaliatory campaign through conventional magic speeches,
    how food and ritual preparations were made, and how nightly speeches and war songs
    sought supernatural power against the enemy.
  language: English
