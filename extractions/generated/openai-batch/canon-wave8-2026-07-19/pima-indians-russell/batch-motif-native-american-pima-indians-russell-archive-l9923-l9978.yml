  text: The passage states that the presence of aggressive Apaches required Pima men
    to maintain pickets and armed guards for village safety.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small Apache parties are described as coming every three or four days to steal
    livestock or kill isolated individuals, while larger war parties came once or
    twice a month at times.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Increased enemy activity is said to have caused outlying villages east of
    the present Sacaton agency to be abandoned and the tribe to concentrate into seven
    villages on the Gila plain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On stormy winter nights, sentinels were posted around the camps because weather
    noise could cover an enemy approach.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sentinels built small brush shelters with smoldering fires, then hid nearby
    in the darkness to watch for marauders approaching the light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The main trails were guarded, and dogs at the houses provided additional security
    from surprise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A chief who wanted revenge for an outrage or desired warrior honors went from
    settlement to settlement appealing for followers with conventional speeches of
    magic character.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Campaign preparation included roasted meal for pinole and ceremonies intended
    to secure enough magic power for victory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before horses were introduced, extra food supplies were carried by women chosen
    from those who had recently lost kinsmen in battle, and each was accompanied by
    a male relative.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: At night the war party was surrounded by pickets, who returned at intervals
    to report.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the evening, a man whose office was to remember appropriate speeches
