canonical_text:
  quote: ''
  summary: 'The passage describes dreams as having several possible causes or functions:
    wrongdoing, communication with the spirit world, or the agency of Darkness or
    Night. In dreams the soul wanders and undergoes adventures. Bad dreams are feared,
    dreams of the dead are associated with sickness and death, and repeated dreams
    may call a would-be medicine-man to his profession. A named man, Kisatc, is said
    to have believed that during a swoon or trance he traveled far away and received
    a bow and arrows from a stranger, though others said he had not left their sight.'
  language: English
  quote_policy: summarized
literal_observations:
