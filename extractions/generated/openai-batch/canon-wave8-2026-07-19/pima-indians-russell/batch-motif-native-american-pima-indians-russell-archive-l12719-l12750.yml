  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dreams are generally not consulted for future action, except when a would-be
    medicine-man is called to his profession through persistent dreams.
  category: attribute
  evidence_refs:
  - ev:5
