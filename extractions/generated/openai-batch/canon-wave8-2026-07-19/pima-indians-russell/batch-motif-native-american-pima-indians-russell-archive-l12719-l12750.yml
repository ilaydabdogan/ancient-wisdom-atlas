  text: During a dream, the soul is said to wander away and pass through adventures
    as in waking life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young men avoided sleeping in the council ki because they feared bad dreams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dreaming of the dead is said to cause sickness; dreaming of the dead for several
