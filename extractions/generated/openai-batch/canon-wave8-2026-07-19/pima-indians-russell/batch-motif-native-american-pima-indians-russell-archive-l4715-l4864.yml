canonical_text:
  quote: ''
  summary: An ethnographic description of Pima material objects and practices, including
    bird cages, a carrying-basket frame, fire drills and later fire-making tools,
    cactus-fruit hooks and tweezers, domestic tree posts, cradles and child carrying,
    paint brushes, and calendar sticks used to record events.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima bird cages are described as similar in character whether made for a large
    eagle or a small Sonora dove, and are made of arrowwood laid in log-cabin style
    or tied to transverse bars.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described carrying-basket form depends on the use of a wooden frame.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In earlier times the Pimas kindled fire with a two-part drill; the operator
    knelt on the hearth stick ends and twirled the upright stick between the palms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire-drill hearth was made of saguaro or another soft wood; tinder was
    not used, and flame was developed after smoke arose from dust at the drill point.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After contact with whites, flint and steel were used; men carried these with
    cotton tinder in leather pouches, and fire was preserved at villages or camps
    in old stumps when practicable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saguaro fruit required a long-handled implement for dislodging it; hooks were
    made by attaching a straight piece of wood to a long cactus rib with maguey fiber.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that the hook angle had great ceremonial importance among
    the Papagos, while the Pimas apparently attached no significance to it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spiny Opuntia arborescens fruit was picked with elastic willow tweezers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A branched post was formerly placed before the house door to hang vessels
    or bags of food, and more recent mesquite 'tree animals' served as seats and children's
    play objects.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The cradle frame was a willow bow with crossbars, covered with willow bark
    and cloth, and had a detachable checker-woven hood ornamented with black and red
    geometric patterns.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Babies strapped in cradles were often carried on their mothers' heads; older
    children were carried astride the hip or, on journeys, on the back with a shawl
    or cloth support.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Former face-paint lines were applied with small arrowwood pieces, and the
    Kwahadk's gathered tufted arrow-bush branch ends to carry south into Papagueria
    as paint brushes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Pimas kept records of passing events on sticks carved with arbitrary mnemonic
    symbols; the passage reports five such records, with the oldest covering seventy
    years.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Earlier calendar sticks were lost through war, fire, and burial customs.
  category: sequence
  evidence_refs:
  - ev:10
