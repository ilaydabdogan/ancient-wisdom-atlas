canonical_text:
  quote: ''
  summary: 'The passage describes race tracks associated with Piman and other Southwestern
    groups, then outlines Pima relay-race practice: inter-village challenges, short
    preparation with bird-named songs and dancing, runner organization, calls and
    markers during the race, methods of deciding victory, women''s vocal encouragement,
    post-race shouting, and the absence of a feast. A figure caption also describes
    kicking balls made from stones, one covered with gum and one uncovered.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer reports ancient race tracks near ruins in Arizona, including examples
    near the Babacomari and in the Sonoita valley, with measurements and surface preparation
    described.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the Sobaipuris as a Piman-stock tribe associated with
    the example tracks, compares their track dimensions to Jicarilla Apache tracks,
    and says Pima tracks at Sacaton Flats and Casa Blanca were much longer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A village wishing to race a neighboring village sent a messenger to announce
    that, in four or five days as decided by the council, they wished to test their
    fortunes in a relay race.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the short preparation period, participants sang bluebird or hummingbird
    songs and danced; young men practiced running in groups of four or five.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each village had about forty or fifty runners; the swiftest was recognized
    as leader and ran first, and a runner could run more than once if endurance allowed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the final race, each village placed half its runners at each end of the
    track; a crier called three times for the leaders, and a starter gave the starting
    shout.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Markers stood beside the track with willow sticks bearing rags to indicate
    the positions of the opposing sides.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A race could end when one side admitted exhaustion, but usually ended when
    the leading runner was so far ahead that he met the opposing runner at the center,
    where the markers also met.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Women encouraged their friends with concerted shouts from the throat ending
    in a tongue trill; after the race, the winning village shouted continuously for
    a time, and the visitors went home without a feast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A figure caption describes kicking balls as stones, one covered with gum and
    one without covering.
  category: object
  evidence_refs:
  - ev:5
