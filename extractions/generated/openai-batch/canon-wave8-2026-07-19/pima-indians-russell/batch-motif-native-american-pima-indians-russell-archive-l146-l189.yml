  quote: ''
  summary: The passage lists Pima and Papago informants and interpreters, including
    contributors of calendar records and medicine-man materials. It also notes Pima
    assistance to whites as farmers and scouts, describes the Pimas as living in river
    valleys with prehistoric ruins, and frames research questions about the relationship
    between present Pimas, a disappeared population, migrations, and whether the area
    was a culture center or a stopping place for clans.
  language: English
  quote_policy: summarized
