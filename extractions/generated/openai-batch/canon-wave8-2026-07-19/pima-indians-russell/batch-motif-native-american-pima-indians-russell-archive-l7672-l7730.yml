  quote: ''
  summary: The passage describes Pima tattooing materials, procedure, aftercare, gendered
    facial designs, timing in young adulthood and sometimes after marriage, generational
    decline of the practice, uncertainty about design meanings, and a stated explanation
    that the lines prevent wrinkles and preserve youth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A few lines were tattooed on the faces of both men and women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tattooing used prickly-pear cactus thorns and charcoal made from willow or
    mesquite wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The thorns were tied together with native cotton fiber and sinew to form a
    graspable tattooing implement.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Both men and women performed tattooing work, but the female artist was preferred
    as more careful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The procedure began with dry charcoal outlines on the face, followed by charcoal
    mixed with water and pricked into the skin with thorns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the operation the face was washed repeatedly to check whether the color
    was being inserted effectively.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Two or more operations could be needed, and one operation occupied an entire
    day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: For four days afterward the face remained swollen and was rubbed daily with
    charcoal; afterward a wash of squash seeds macerated in water was applied.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: If lips healed slowly, swollen lips and chin could prevent solid food, requiring
    the person to subsist on pinole while squash applications continued.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:10
  text: Men were tattooed along the lower eyelid margin, across the temples, and on
    the forehead, with forehead patterns varying from a wavy line to short zigzag
    vertical lines in a band; occasionally a wrist band was also tattooed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: Women had the line under the lids and, instead of forehead lines, had two
    vertical lines on each side of the chin from lip to jaw, united by a broad tattooed
    bar including the outer third of the lip mucous membrane on each side.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Tattooing was done between ages 15 and 20, apparently not specifically at
    puberty, but when convenient to the individual and operator.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sometimes a bride and groom were tattooed just after marriage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: All older Pimas are described as tattooed, while young people are said to
    be escaping the practice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage states that the art is passing away and that the meaning of the
    designs is unknown.
  category: other
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Pimas are reported as saying that the lines prevent wrinkles and help
    them retain youth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage rejects the theory that women about to be married have the lower
    eyelids tattooed so they will look at no man except their husband.
  category: speech
  evidence_refs:
  - ev:6
