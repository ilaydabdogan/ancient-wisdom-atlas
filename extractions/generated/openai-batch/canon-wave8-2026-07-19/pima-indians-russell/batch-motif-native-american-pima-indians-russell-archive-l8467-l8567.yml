canonical_text:
  quote: ''
  summary: 'The passage describes several Pima games: a reed guessing game with corn
    counters, hidden balls or beans, a blanket-covered filling procedure, and scored
    guesses; a team game in which leaders hide a pottery disk and a line advances
    by jumping when the opposing leader guesses wrongly; and boys'' games involving
    arrows, a dragged rag bundle, a rag ball thrown with a curved stick, and shooting
    a tossed grass bundle with a bow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the reed guessing game, one hundred grains of corn are placed in a hole
    between players and are taken as winnings; sticks in the sand mark wins, and a
    player may cancel an opponent's stick by winning one.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reed game assigns different participants to guessing, filling reeds, watching
    the count, and holding a blanket under which the reeds are filled.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The reed game uses pairs of reeds filled with sand, with a bean or ball concealed
    in each pair, and guesses determine whether corn is forfeited or additional points
    are scored.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage states that cheating occurs in various ways and reports a belief
    that this practice began after contact with whites.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the team game called in the passage VAPirTTA, leaders arrange players in
    opposing lines, mark a goal about fifty yards away, and hide a small object, usually
    a circular pottery piece, in one player's hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In VAPirTTA, a wrong guess lets a player at the end of the line run and jump
    over another player's raised leg, moving the line toward the goal; a correct first
    guess transfers the object and prevents jumping until a later failed guess.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In one boys' game, players stand in a circle while a runner drags a bundle
    of rags on a string; boys place arrows in a heap, and the one who shoots the moving
    bundle wins the arrows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the game whose name is glossed as “cooking place,” a rag ball is tossed,
    a nearby player tries to hit another with it using a curved stick, and the one
    hit must bend his head down while others throw the ball at him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In another game, a grass bundle tied with willow bark is tossed upward or
    forward, and the player tries to shoot it with a bow before it reaches the ground.
  category: action
  evidence_refs:
  - ev:9
