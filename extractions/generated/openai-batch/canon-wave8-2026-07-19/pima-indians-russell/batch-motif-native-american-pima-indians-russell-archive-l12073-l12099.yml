canonical_text:
  quote: ''
  summary: An introductory note reports that an unnamed respondent does not believe
    a story, though most riinos do, and says their origin is unknown. In the tale
    'Skull and His Magic,' a girl rejects suitors who bring game to her parents but
    chooses a husband who is a man by night and a skull by day. Neighbors mock the
    marriage. During a deer hunt in the northern mountains, Skull hides in a defile,
    and the deer die at the sight of him, providing venison without ordinary hunting.
    In a later ball-kicking foot race, Skull wins despite renewed mockery, silencing
    criticism.
  language: English
  quote_policy: summarized
