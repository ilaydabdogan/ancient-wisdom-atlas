  quote: ''
  summary: 'The passage describes Pima dwelling features and associated structures:
    houses without smoke holes, low narrow doorways, council houses, menstrual lodges,
    arbors, storehouses, and kitchen windbreaks. It also notes architectural comparisons
    with Cocopas and neighboring tribes, domestic uses of arbors, and hygienic commentary
    by the author.'
  language: English
