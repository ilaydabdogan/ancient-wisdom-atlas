canonical_text:
  quote: ''
  summary: 'Ethnographic passage on Pima children and childbirth: family size, rejoicing
    over twins, preference for male children, treatment of deformed or mixed-paternity
    infants, pregnancy taboos, childbirth and postpartum practices, nursing and abortion,
    lack of explanation for sterility, and examples of intermarriage and amalgamation
    with neighboring peoples.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports large Pima families, sometimes up to twelve children,
    and says twins were received with village-wide rejoicing, gifts, and assurance
    that the mother would be fortunate.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Male children were preferred because they were expected to grow up to fight
    Apaches.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: With parental consent, deformed infants were taken by a midwife and left to
    die from exposure and lack of nourishment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says Pima feeling against the abnormal was strong and gives an
    example of recent hostility toward a grown man with six toes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that infants of American or Mexican fathers were destroyed
    in the same manner as deformed infants, and says the author learned of only two
    people who had escaped that fate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When asked about albinos, informants replied that there never were any; the
    author adds that such a child would probably have received the same treatment
    as other children with abnormal characteristics.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A pregnant woman was forbidden to eat food touched by animals, such as a melon
    from a vine cut by a gopher or tortillas made from wheat nibbled by mice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A pregnant woman was not to go where Apaches had been killed, because the
    baby would die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: If a pregnant woman's husband killed a rattlesnake, the child was expected
    to suffer a swollen stomach and die soon after birth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: A pregnant woman was not to eat liver, because the child would be disfigured
    by birthmarks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: During confinement, the husband stayed away from the home while women friends
    attended the woman giving birth, who sat over a hole in the floor with a cloth
    spread in it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The placenta was buried in a hole and covered with ashes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: After delivery the mother bathed in the river and avoided salt until the child's
    umbilicus healed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: If a woman died in labor and the child lived, the maternal grandmother took
    charge of the child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: Babies were usually nursed until the next child was born; some were nursed
    until age six or seven.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: If a nursing mother became pregnant, the passage says she might induce abortion
    by abdominal pressure because the unborn was believed harmful to the visible nursing
    child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Illegitimate children were aborted at three or four months, and one reported
    seven-month abortion involved a medicine-man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:18
  text: No Pima explanation for sterility was given to the author.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:19
  text: The passage gives examples of intermarriage with Apache, Maricopa, Hare-eater,
