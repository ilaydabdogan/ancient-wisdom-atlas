canonical_text:
  quote: ''
  summary: An old woman, her daughter, son-in-law, and grandson follow Apache tracks.
    After the Apaches attack the adults, the old woman and boy live on berries. A
    dangerous beast camps near the bushes; the boy disobeys his grandmother, is swallowed,
    cuts the beast from inside with sharp stones, and thereby gains access to the
    berries. In a following tale, a quail and more than twenty children search for
    water, drink muddy water under a mesquite tree, become sick, and die.
