  summary: The passage describes Pima disease beliefs and treatments, including intentional
    exposure of children to smallpox and measles, smallpox treated as an evil spirit
    to be placated, vaccine bandages placed on a mesquite tree rather than burned,
    diarrhea attributed to touching ripe wheat and treated by a medicine-man blowing
    danger away with smoke, physical treatments for wounds and pains, melancholia
    associated with a man who has killed Apaches, and a table of diseases.
