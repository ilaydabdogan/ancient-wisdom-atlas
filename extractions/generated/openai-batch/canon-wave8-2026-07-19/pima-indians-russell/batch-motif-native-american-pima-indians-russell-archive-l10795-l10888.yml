canonical_text:
  quote: ''
  summary: The passage recounts episodes in which Puma and Wolf hunt with Coyote,
    Coyote deceives and sexually abuses a woman connected to powerful magicians, those
    magicians imprison useful game animals in a cave in Yellow Mountain, and Coyote
    later opens the cave and releases them before fleeing to western water. It then
    recounts Feather-breathing Si'van's bow, hunting errors, magical hunting ability,
    and his making of magical gambling sticks for Vantre, followed by Elder Brother's
    attempt to counter their power through a feather preparation.
  language: English with brief Latin editorial wording
  quote_policy: summarized
