  summary: The passage describes Pima rain petitioning through a fly, Si'atcokam feats
    and cures, acquisition of spirit-bearing crystals, healing by sucking out evil
    or disease objects, diagnostic use of songs and smoke, and an extended case in
    which Sala Hina is treated by multiple medicine-men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When rain is needed, anyone may petition for it by rubbing soot into the eyes
    of a small gray fly and telling it to ask its grandmother to send rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Si'atcokam display power by holding hot coals in their mouths or hands,
    with ash or mud used as a protective layer in the hand method.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Si'atcokam may twist small pointed wooden pieces into a patient's flesh;
    Jacob L. Roberts was said to have had two creosote-bush pieces inserted into his
    breast in infancy, after which his great-grandmother predicted his future health
    and her own death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Certain Si'atcokam value transparent crystals said to be found after a stranger
    appears and disappears; the crystal is said to contain a spirit that aids the
    holder and leaves the stone when the holder dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wounded man may be treated by having evil sucked from the wound, with a
    green water-plant-like strand involved in the treatment and sucked crosswise four
    times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: In treating sickness, a Si'atcokam carries a staff, sings or has cure songs
    sung, and blows cigarette smoke over the patient in order to see the disease.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: In Sala Hina's illness, successive medicine-men smoked cigarettes and attempted
    diagnosis; one requested a gourd rattle and magic feathers, and another pronounced
    that she would die.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: Sala Hina's later treatment included alternating sets of songs, ashes in water
    swept over with eagle feathers, spraying water from the mouth, diagnosis of a
    horned-toad horn in her heart, sucking out the horn, wrapping it in cotton, throwing
    it into the river, further songs, and reported recovery.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: Sala's brother was treated for a throat disease with singing, sucking, and
    smoking for a month before he died.
  category: sequence
  evidence_refs:
  - ev:10
