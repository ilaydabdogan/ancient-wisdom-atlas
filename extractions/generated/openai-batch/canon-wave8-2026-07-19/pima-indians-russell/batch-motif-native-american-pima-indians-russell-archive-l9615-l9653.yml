canonical_text:
  quote: ''
  summary: 'The passage describes Pima funeral practices: grave provisions for the
    soul, dismissal of the soul to its eastern home, fear of ghosts, burning or destruction
    of a deceased person''s dwelling and goods, avoidance of the deceased''s name,
    concern for souls without grave offerings, and the caching of some medicine-man
    paraphernalia in an olla with ritual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water and pinole are placed on the grave for the soul's use in the other world;
    the journey there is said to take only a moment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the grave, survivors tell the deceased that they have put the person there,
    instruct the soul to go to its home in the East, and tell it not to return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ghosts are described as uncanny and liable to touch sleeping persons; a person
    so touched must accompany the ghost back to the land of shades.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a householder died, the person's ki was formerly burned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other structures and personal property were burned, piled on the grave, or
    otherwise destroyed; livestock was killed and eaten by those present, but not
    by the immediate relatives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a husband had two blankets, his widow sometimes kept one.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The deceased person's name was not mentioned thereafter, and survivors tried
    to remove the person's memory from their minds while mourning rites continued
    for a time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A pauper who left nothing for the grave was said to release a vexed soul that
    wandered until someone placed an offering on the grave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Medicine-man paraphernalia, when not passed to a family successor, was sometimes
    concealed in an olla in the hills instead of being destroyed; similar caches of
    ordinary men's property were rarer.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: One described cache contained crystals and concretions, a carved stone rattlesnake,
    three seashells for use in medicine, and a war club.
  category: object
  evidence_refs:
  - ev:5
