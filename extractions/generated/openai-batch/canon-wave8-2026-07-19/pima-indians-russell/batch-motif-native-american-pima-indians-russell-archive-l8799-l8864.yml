canonical_text:
  quote: ''
  summary: 'Ethnographic account of Pima marriage customs: girls commonly choose husbands;
    courtship may be conducted by a married male proxy; acceptance occurs by the suitor
    remaining at the bride''s home; a bride later performs a dawn wheat-grinding task
    at the groom''s parents'' home; gifts are given to the bride without bride-price;
    rare unmarried women may be viewed as supernatural; a rejected suitor may seek
    harmful hair magic through a medicine-man; polygyny, residence customs, sororate
    widow remarriage, and kinship marriage restrictions are described.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In most cases the girl makes the marriage choice and seeks to avoid a lazy
    man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reported ideals of male appearance include being tall, strong, dark, and not
    too fat; reported ideals of female appearance include not being fat or thin, with
    good hair and a good face.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Unmarried women are said to keep their hair in better condition than married
    women, but no distinctive hairstyle marks unmarried girls.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A suitor visits the bride's home with a young married friend who pleads his
    cause while the suitor sits in the background.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After several nights of proxy wooing, if the suitor is favored he remains
    and is accepted as husband without further ceremony.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The couple remains at the bride's home for four days and goes to the groom's
    parents' home on the evening of the fourth day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At dawn after arrival, the mother-in-law gives the bride a large basket of
    wheat to grind on the metate before sunrise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Leaving part of the wheat unground by running away is described as a sign
    that the bride would not be a very good wife.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: The groom gives the bride a new blanket, and his parents give her presents;
    the passage states that these are not bride-purchase and that no gifts are made
    to the bride's parents.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some men are described as unable to find a woman willing to marry them, and
    unmarried women are said to be rarer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: One unmarried woman at Blackwater is regarded as having supernatural powers
    because of her spinsterhood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A rejected suitor may appeal to a medicine-man for assistance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: If the rejected suitor steals a hair from the woman's head and the medicine-man
    buries it, the girl is expected to die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that disappointed hopes in love have been known to lead
    to suicide.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Polygyny is said to have been practiced to some extent, usually with no more
    than two or three wives, though one chief's son reportedly had six.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Plural wives live in separate houses, and the husband spends most of his time
    with the first wife.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: When a youth marries, he brings his wife to his parents' home if there is
    room; otherwise a nearby house is built, and the families eat together.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:18
  text: A widower customarily weds the sister of his deceased wife.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:19
  text: Uncles and nieces are not permitted to marry, cousins do not marry out of
    respect for the parents, and the writer reports finding no marriage-prohibited
    groups within the tribe.
  category: relationship
  evidence_refs:
  - ev:8
