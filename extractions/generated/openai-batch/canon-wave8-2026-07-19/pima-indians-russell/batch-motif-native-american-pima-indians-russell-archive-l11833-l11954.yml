canonical_text:
  quote: ''
  summary: 'The passage concludes a Sandy Coyote wagering episode in which a young
    man repeatedly wins, defeats Sandy Coyote, and kills him. It then describes a
    journey during which the young man''s mother, wives, and the young man transform
    into spiders and a lizard. A short ethnographic note describes Coyote as wise,
    dangerous to harm, avenging, and sometimes a warning of Apache danger. The passage
    then begins another creation version: before earth there is darkness and wind,
    a lone man makes earth, water, stars, moon, Milky Way, and sun, and other named
    makers create living creatures and people from hard mud. The fragment continues
    with speech interpreted as future wars, ditch-making for water, and the beginning
    of war among Mesa people.'
  language: English
  quote_policy: summarized
