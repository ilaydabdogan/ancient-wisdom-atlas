  quote: ''
  summary: 'The passage describes Pima artifacts: a shield with a handle, sling strap,
    and colored ogee swastika ornament; two model shields with cross designs; a similar
    swastika-decorated shield collected in 1887; rawhide sandals used for travel over
    stony mesas and mountains; and hide straps formerly used to bind ox yokes to horns.'
  language: English
  quote_policy: summarized
