canonical_text:
  quote: ''
  summary: The passage gives brief abstracts of two tales. In one, a brother carrying
    heavy game has his body cut into four pieces and thrown into a lake; after four
    days the other brother finds four horses. In another, five orphaned children are
    warned by a rabbit that Apaches have been at their house; they find their aunt
    dead, keep a fire for her return, are pursued by her ghost, and are turned to
    stone.
