canonical_text:
  quote: ''
  summary: The passage catalogs Pima plant foods, including cultivated and gathered
    plants, methods of preparation, storage, and eating. It emphasizes mesquite and
    screw beans, pinole-making, rooftop storage, pit cooking, raw and boiled fruits
    or greens, famine use of Malva liquid for pinole, and cases where older preparation
    methods are no longer known. It also notes comparisons with Papago prickly pear
    processing and lower California bean cultivation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sorghum is cultivated when water is available and is described as a recently
    obtained crop from whites who raise it in the Southwest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ki'ak heads are gathered; the seeds are beaten out, moistened, parched, ground
    on a metate, and eaten with alternating pinches of meal and sips of water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mesquite beans are described as formerly one of the most important Pima foods,
    still widely used, but affected by livestock consumption and occasional crop failure.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mesquite harvest occurs after the saguaro harvest; bean pods are stored in
    cylindrical bins on roofs or sheds, and larvae bore into pods while they are still
    on the trees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mesquite beans are prepared by pounding in a mortar or by separating, parching
    in live coals, grinding, and eating as pinole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Other mesquite products are used: catkins are eaten without preparation,
    white gum is used for candy, and inner bark is used as a rennet substitute.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Paloverde beans were formerly eaten either as gathered or after pounding,
    and were sometimes mixed with mesquite meal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: One plant's heads are washed, boiled in an olla with a little water, mixed
    with wheat flour and salt, and stirred until they fall apart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: For some plants, the passage reports that seeds or beans were eaten in primitive
    times but that present people no longer know the preparation method.
  category: speech
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:10
  text: Screw beans are cooked in lined pits with alternating layers of cocklebur
    leaves, covered with earth for three or four days, dried, and stored in arrow-bush
    basket bins on rooftops.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Screw beans are later pounded into flour for pinole; a coarser portion is
    taken with water, the juice is sucked through the fingers, and the remainder is
    discarded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage lists fruits, greens, and stems eaten boiled, raw, or roasted,
    including a red berry, asparagus-like stems, and watermelons eaten for much of
    the year.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pimas eat prickly pear fruit raw after removing thorns and peel and discarding
    seeds; Papagos are said to make syrup from the fruit and dry it like saguaro fruit.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Malva is boiled and its liquid is used in making pinole during famine.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says at least one common bean variety was known before the Spaniards
    and cites Venegas on red kidney beans cultivated by natives of lower California.
  category: relationship
  evidence_refs:
  - ev:10
