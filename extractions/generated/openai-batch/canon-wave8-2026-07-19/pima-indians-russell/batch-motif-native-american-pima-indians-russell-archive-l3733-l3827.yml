canonical_text:
  quote: ''
  summary: 'The passage describes animal foods and related practices among the Pimas
    and nearby Papagos: gophers hunted and roasted, historical accounts and later
    reports concerning mountain sheep horns and rain or water practices, fish as an
    intermittent food source affected by drought, occasional deer and burro use, and
    rejection of snakes and lizards as food.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gopher hunts were sometimes arranged like hare drives; animals were forced
    from retreats with sticks and roasted on coals without preparation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A 1607 diary extract reports a Pima-area town named from a large heap of wild
    sheep horns and says wild sheep were common subsistence for the inhabitants.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A later report attributed to Antonio Azul says mountain sheep horns were not
    brought home; each man deposited them in a separate place so they would not exert
    evil influence on winds or rains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Papagos are said to have held rain ceremonies in which medicine-men deposited
    mountain sheep tails together with eagle feathers at springs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports that the Papagos once sacrificed children in an effort
    to increase the water supply, but the stated result was that all the springs dried
    up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fish appear in Pima traditions and travelers' notes; the people sometimes
    caught many fish, but drought could leave the river dry near villages and make
    fish unreliable as food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the Pimas now have one name for all fresh fish, though
    several edible species existed in the Gila and adjoining streams.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:11
- id: obs:8
  text: Information on black-tail deer is described as vague, but the passage says
    the species was sometimes killed by the Pimas before Apache power restricted mountain
    roaming.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Burros were few and not highly valued by the Pimas; they had been eaten in
    the past but were rarely eaten at the time described.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Snakes were not eaten even in famine, and the idea of eating lizards was rejected
    with scorn.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The writer reports seeing mountain sheep in nearby mountains and records a
    Pima chief's explanation that the sheep were game fit only for Papagos, who had
    no fields to look after.
  category: speech
  evidence_refs:
  - ev:10
