  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Pimas sometimes used a short sharpened stick as a lance, described as
    adopted from the Yumas and Maricopas after Spaniards supplied steel heads for
    the weapon; the sticks were colored red with mineral paint.
  category: sequence
  evidence_refs:
  - ev:8
