  quote: ''
  summary: The passage describes Pima manufactures and emphasizes the cultural importance
    of stone implements despite the greater number of wooden objects. It then surveys
    wooden weapons and related objects, including bows, arrows, quivers, war clubs,
    and lances, with notes on materials, manufacture, use, trade, staining, and adoption
    from neighboring groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima manufactures are described as few in number and simple in character.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts numerous wooden implements and weapons with fewer stone
    objects, while stating that the stone objects are culturally important.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The metate is described as having no wooden substitute and as necessary for
    fully using maize and for readily taking up wheat raising.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone ax and knife are described as enabling woodworking, affecting architecture,
    and making irrigation-dependent agriculture possible.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that three simple stone implements helped transform the Pimas
    into an agricultural people who adapt the environment to their needs and make
    limited provision for the future.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pima bows are described as simple, undecorated, and not carefully made; warriors
    made bows of mulberry wood from the Superstition and Pinal mountains, with willow
    used when mulberry was unavailable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A bow long used in successful warfare could become a highly prized possession
    whose owner was reluctant to part with it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hunting bows were often made of osage orange wood obtainable from whites along
    the Salt River, while men and boys continued to make willow bows for hunting hares
    and other small game.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pima arrows were made from straight stems of arrow bush, while Kwahadk's and
    Papagos sometimes sold yucca-stem arrows to the Gileños; the yucca arrows are
    described as lower quality than wooden arrows.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hunting arrows and war arrows differed in feather number, length, and shape.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Arrow shafts were measured and cut according to the maker's body, from the
    tip of the forefinger to the nipple of the breast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bows and arrows were sometimes stained with jackrabbit blood, and war-arrow
    ends could be dyed with cochineal; the quiver was made of wild-cat skin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The war club is described as nearly as important as the bow, and some warriors
    fought with shield and club alone.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Pima clubs were made of mesquite root or ironwood, had a pointed handle effective
