canonical_text:
  quote: ''
  summary: 'The passage first identifies the Tze-kinne or Stone-house people in relation
    to cliff-dwelling Sobaypuris and the Pimas. It then describes a Pima purification
    rite for a creeping child: parents take the child to a medicine-man, who uses
    a sacred pebble, feathers, a seashell with water, and ingestion of water plus
    ashes or mud. The rite is said to protect the child from harmful magic, evil demons,
    lightning, and accidents; afterward the mother avoids salt for four days. The
    author compares the rite cautiously with Christian baptism and with older Indigenous
    medicine-water purification customs, including a Zuni example cited from Cushing.'
  language: English
  quote_policy: summarized
