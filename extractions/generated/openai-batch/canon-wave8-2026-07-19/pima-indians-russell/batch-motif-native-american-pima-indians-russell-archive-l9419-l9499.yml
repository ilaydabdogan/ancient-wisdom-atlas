canonical_text:
  quote: ''
  summary: The passage describes Pima child education through imitation, apprenticeship,
    and oral instruction by elders. Boys receive morning moral, religious, and warrior
    instruction from fathers or guardians, are trained in vigilance, austerity, restraint,
    sharing, and purification, and later learn ancient traditions from a keeper of
    legends during a four-day period with a salt taboo. Girls are instructed in domestic
    responsibilities, hearth tending, water vessels, cooking tools, baskets, and puberty
    requirements, with examples of parental discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pima children are described as receiving education through imitation, apprenticeship,
    and oral instruction in moral, religious, and other matters from elders.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young boy is taken in his father's arms at daybreak and told about the mysteries
    of the great Sun god rising above the Sierra Tortilla.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When older, the boy is required to sit straight and listen to lectures on
    proper conduct as a Pima warrior and citizen; inattentiveness may be corrected
    by a physical gesture striking the side of his nose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The boy is taught readiness with bow and arrows against Apaches, morning scout
    or livestock duty before eating, and endurance of cold food and hunger for war
    travel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father's instruction includes silence when wounded, carrying a small blanket,
    reliance on magicians, cold endurance, avoiding fights with comrades, unselfishness,
    restraint in speech, and bathing in cold morning water for purification after
    killing an enemy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A hunter's first deer kill is given away entirely; later kills allow him first
    choice of meat before sharing with others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A youth of about twenty is told the ancient traditions, called Ha-ak Aga,
    during four days and four nights with a keeper of legends, and is not allowed
    to eat salt during that period.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sala Hina's father instructs her to stay with her mother and learn cooking
    with pots, mortar, and metate, prepare seeds, keep fire and wood ready, and keep
    the drinking olla full.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage states a gendered hearth rule: it is the office of man to kindle
    the fire and the part of woman to keep it burning.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children may be scolded, slapped, or shaken; if a girl breaks an olla while
    going for water, elders may scratch her arm with broken pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Girls begin helping with cooking around ages seven or eight, begin making
    baskets around ages nine or ten, and are required to make a single basket during
    puberty ceremonies.
  category: sequence
  evidence_refs:
  - ev:8
