canonical_text:
  quote: ''
  summary: 'The passage describes nail and tooth care observations: fingernails were
    bitten short, toenails often received little attention, brown or darkened teeth
    were observed, several plants were said to blacken teeth, and charcoal was used
    for tooth cleaning before and after the arrival of whites.'
