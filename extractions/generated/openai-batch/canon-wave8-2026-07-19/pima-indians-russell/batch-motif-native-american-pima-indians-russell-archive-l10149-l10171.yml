canonical_text:
  quote: ''
  summary: 'The passage describes where a dance was held and how participants were
    arranged: basket drums and singers at the center, appointed dancers in a larger
    circle moving leftward, spectators or crowd members around or within the circle,
    runners outside the spectators, and horsemen circling the whole gathering from
    left to right. The number of young women running varied according to the female
    relatives of those killed in battle.'
  language: English
  quote_policy: summarized
