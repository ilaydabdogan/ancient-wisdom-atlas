canonical_text:
  quote: ''
  summary: The passage recounts a flood that overwhelms land and mountains. People
    seek rescue through a hole to the other side of the earth, by floating on a log,
    or inside an olla. A young man and a child become birds, and several birds survive
    by clinging to the sky and later floating on nests of down given by Vikdrskam.
    South Doctor warns people, receives power from Earth Doctor, raises Crooked mountain
    above the flood by singing, then exhausts his power. A dog reports that the water
    is near the top, and the people who hear the dog are turned to stone.
  language: English
  quote_policy: summarized
