  - ev:7
- id: obs:3
  text: Coyote asks Elder Brother for assistance and is told to sit on a big log that
    will carry him safely on the flood water with the driftwood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Elder Brother enters and seals himself inside an olla called a black house
    in song, is carried along by the flood, and later emerges with magic powers, a
