  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: South Doctor announces that a flood is coming to destroy the earth and all
    things on it, and directs some people onward to Earth Doctor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Earth Doctor says some people are too late for the earlier rescue, tells them
