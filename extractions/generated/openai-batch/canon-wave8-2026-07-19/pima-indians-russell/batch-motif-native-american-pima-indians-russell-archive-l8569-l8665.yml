canonical_text:
  quote: ''
  summary: 'The passage describes several games: a prickly-pear target arrow game
    with wagers, an arrow-crossing game, children tossing feathered corncobs, and
    several games associated with women, including a five-stone tossing game, a red-and-black
    stave casting game, and a dart-and-ring game using gourd rings and a sharpened
    stick.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The title XAOF TOWE K.IKRSA is glossed as meaning prickly-pear standing opposite.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In XAOF TOWE K.IKRSA, usually four players, or sometimes two, set prickly-pear
    leaves opposite each other about 30 yards apart and try to pierce a leaf with
    an arrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the prickly-pear game, partners share winnings or losses equally, and bows,
    arrows, and similar property may be wagered.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: An embedded note describes an object called rs\ika, translated as slave, about
    40 or 50 mm in diameter, pitted in the center, and made of pottery or stone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In KaORSA, two or four players shoot one arrow to lie on the ground about
    100 feet away, then shoot two more arrows intending to cast them across the first.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Children sometimes toss into the air corncobs into which one to three feathers
    have been stuck; they do not shoot arrows at them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that three games, in addition to the athletic game of kldH,
    were played exclusively by women.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: MEKtjT TOAKUT is played by two women using five carefully selected rounded
    pebbles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: In MEKtjT TOAKUT, the first player names one stone as her stone, tosses it
    upward, watches it, and snatches up the other stones in increasingly difficult
    groupings before the tossed stone falls.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A harder version of the stone game requires pushing stones under an arch made
    by the thumb and middle finger while the first finger crosses over the middle
    one.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the one-plus-three combination of the harder stone game, the player names
    one stone as her opponent's and says she will not pick that one up first.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: KA-AMiSAKUT is played with eight sticks in two sets of four, with black and
    red coloring placed on opposite sides across the two sets.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: In KA-AMiSAKUT, two players alternately use and exchange sets of sticks, throwing
    them from a metate or other convenient stone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In KA-AMiSAKUT, all red sides up scores one point, all black sides up scores
    two, and four points wins the game.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: TCXlLIKIwiKfrr is identified as the Gilefio form of a widespread dart-and-ring
    game, not exclusively a woman's game, though sometimes played by women.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that the younger generation knows nothing about the dart-and-ring
    game.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: The dart-and-ring apparatus consists of rings cut from cultivated gourds,
    strung on a maguey fiber cord with a gourd stopper at one end and a sharpened
    stick at the other.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: In the dart-and-ring game, the player tosses the rings upward with a swing
    and thrusts the dart through as many rings as possible, continuing while scoring.
  category: action
  evidence_refs:
  - ev:11
