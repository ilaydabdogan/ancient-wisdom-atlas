literal_observations:
- id: obs:1
  text: The Pimas are described as having built four dwelling types and a storehouse;
    the primary dwelling is the round, flat-roofed ki shaped like an overturned wash
    basin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that he cannot detect resemblance between the Piman ki and
    Pueblo architecture, despite prior claims, while mentioning analogies with more
    distant tribes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ki is built by men, who gather in groups of ten or fifteen; this is contrasted
    with Pueblo housebuilding, described as women's work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note says the southern California Cahuilla also differ from other American
    Indians in that houses are built by men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Although Pimas had long seen Casa Grande and Spanish and Mexican adobe buildings,
    the passage says they continued to build simple, nearly temporary shelters; it
    also notes recent Piman adobe-house adoption, including Antonio Azul's first adobe
    house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The old custom of destroying buildings at the death of their owners is said
    to have practically disappeared, but to have retarded architectural development
    during the aboriginal period.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Usually one family occupies a dwelling, though sometimes two or three related
    families live together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When two families live in one dwelling, sleeping mats are placed on each side
    of the entrance so sleepers' heads may face east.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The door is placed on the east side so inmates may rise early to greet the
    Day god as he appears over the distant summits of the Sierra Tortilla; a practical
    explanation is also given, avoidance of southwest afternoon winds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The house framework uses four crotched posts, heavy beams, lighter cross poles,
    willow poles, horizontal stays, brush or straw covering, and an outer earth layer.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The finished ki is described as strong enough to withstand heavy gales and
    support people gathered on the roof during festivals.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage gives measurements for the ki, including circumference, interior
    diameter, height, post distances, rafter spacing, and door dimensions.
  category: attribute
  evidence_refs:
  - ev:10
