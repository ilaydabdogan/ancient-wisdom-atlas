canonical_text:
  quote: ''
  summary: The passage describes reported Pima medicine-man initiation, including
    tests, transmission of power-objects, fees, restrictions, and reliance on dreams
    and visions. It then describes Makai crop- and rain-related performances involving
    earth, wheat, fire, field corners, buried objects, imitated plant growth, reeds,
    water, trenches, and eagle feathers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Informants report that a man instructed by a medicine-man and able to perform
    small tricks could become a medicine-man; the process of acquiring power is called
    va'ikita, glossed as “getting power” and literally “pouring in olla.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A novice kneels on all fours while the medicine-man throws four short sticks
    at him; if the novice falls, he is considered to have been “shot” with power and
    may take the next degree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instructor coughs up tcu'tcaka, described as white balls about the size
    of mistletoe berries, and either rubs them into the novice’s breast or has the
    novice swallow them; one informant describes the supply as developing in an undiminished
    “nest of power.”
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Instruction may be free when the doctor wishes to teach, but the usual fee
    is an item such as a horse or calico.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: During initiation the novice must not go near a woman’s menstrual lodge, must
    not reveal that he is learning, and must not practise until the novitiate ends,
    usually after two years and sometimes after four.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A practitioner’s later success is said to depend on the ability to develop
    dreams and visions, and a medicine-man’s son cannot inherit his father’s profession.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: For crop aid, the Makai gather people in a large lodge, place an earth-filled
    olla before a clear fire while rain songs are sung overnight, and at dawn the
    vessel is found to contain wheat instead of earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Four grains from the transformed vessel are given to each person present,
    to be buried at the field corners or all together at the field center.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: For a consideration, the Makai performs a wheat-field rite by smoking a cigarette
    at each corner of the field and burying a short stick at the center.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: To produce abundant melons and squashes, the Makai takes a small melon or
    squash from his mouth or supposed bodily store of power; it is partly covered
    with hardened mud, which the passage explicitly calls symbolic of productive earth,
    and is buried at a plant root.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The germination and growth of wheat are imitated through concealed grains
    and prepared shoots, and young men chew mesquite leaves that are ejected as wheat
    or corn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: During rain ceremonies, a Makai pours dry earth from a reed until it is half
    empty, after which the rest is seen to contain water; placing magic slates in
    water and digging a shallow trench are also said to bring rain in four days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Another rain device uses concealed water-filled reeds while the Makai stands
    on a housetop, shows eagle down or tail feathers as dry with dust, and then scatters
    water over singers and spectators as if from the feathers.
  category: action
  evidence_refs:
  - ev:7
