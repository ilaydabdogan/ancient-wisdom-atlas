  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Canteens were decorated in varied patterns, including human figures.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A parching pan is described as a large oval shallow dish with extended end
    margins for handles, used to roast grains before grinding them for pinole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A tortilla baking plate is described as a slightly concave undecorated disk.
  category: object
  evidence_refs:
  - ev:4
