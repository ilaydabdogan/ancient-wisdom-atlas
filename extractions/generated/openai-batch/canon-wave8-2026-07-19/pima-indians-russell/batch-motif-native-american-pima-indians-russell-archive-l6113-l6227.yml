literal_observations:
- id: obs:1
  text: Water canteens are described as globular vessels without strap projections
    or loops, intended to be carried in a woman's ki&h and used by women when traveling
    for wood or cactus fruit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men on the warpath or traveling far from water are described as expected to
