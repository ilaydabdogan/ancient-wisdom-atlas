canonical_text:
  quote: ''
  summary: The passage recounts Earth Doctor's creation of living beings and clay
    humans, the overpopulation and distress of the first people, a first world destruction
    by pulling down the sky, a renewed creation, the births of Coyote and Elder Brother,
    Elder Brother's shortening of human life, and the beginning of a second destruction
    by flood through a supernatural marriage-and-birth scheme that South Doctor partially
    outwits.
  language: English
  quote_policy: summarized
