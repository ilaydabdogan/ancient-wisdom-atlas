  locator: 10372-10375
  quote_or_summary: At the start of the strange events, Elder Brother begins making
    a jar or olla of bush or gum material; when it is finished, the flood will come.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 10378-10384
  quote_or_summary: The handsome youth comes to the home of Vakolo Makai, South Doctor,
    who has power similar to Elder Brother and is known for knowledge and sign-reading;
    South Doctor says he will end Elder Brother's schemes.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 10384-10394
  quote_or_summary: South Doctor asks his crying daughter why she weeps, tells her
    it is her duty to marry the youth, then has her fetch topmost cholla thorns and
    places them upon her.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 10394-10401
  quote_or_summary: South Doctor tells his daughter to care for whatever weapons the
    youth brings; when he arrives, she takes his bow and arrows and stores them safely.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 10401-10409
  quote_or_summary: After the couple go to their dwelling, a child's screams summon
    South Doctor and his wife; the daughter refuses the baby, saying she is not the
    mother and that the young man gave birth to it.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 10409-10418
  quote_or_summary: The young man takes the child away but leaves it by the wayside;
    Elder Brother, finishing his olla, says they have been outwitted and their plan
    defeated, and sends the youth to bring the child.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 10418-10420
  quote_or_summary: The child's screams shake the earth and can be heard for a great
    distance.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: 10420-10409
  quote_or_summary: Earth Doctor gathers his people, tells them a great flood will
    come, describes the calamity, and sings a lament beginning with a call for his
    unfortunate people to weep.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
