- id: motif:3
  label: cosmic marriage to beget helpers
  taxonomy_refs:
  - sacred_marriage
  basis: Earth Doctor explicitly likens earth-sky and sun-moon unions to female-male
    or husband-wife unions intended to produce helpers.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage reports the planned unions, but one expected offspring does
    not respond in the immediate sequence.
- id: motif:4
  label: cosmic collapse followed by recreation
  taxonomy_refs:
  - death_rebirth
  basis: The sky is pulled down and life is crushed, after which Earth Doctor recreates
