canonical_text:
  quote: ''
  summary: The passage discusses Pima statements and traditions concerning ruined
    stone and adobe pueblos in the Gila and Salt river valleys. It notes uncertainty
    about the builders, the Pima term Hohokam, the naming of ruins as va-aki or ancient
    houses, the title/name Si'van for Hohokam chiefs, and lists several ruins and
    myth-preserved chiefs. Notes mention a possible linguistic comparison with Zuni
    self-names and a likely Mexican-derived designation of ruins as houses of Montezuma.
  language: English
  quote_policy: summarized
