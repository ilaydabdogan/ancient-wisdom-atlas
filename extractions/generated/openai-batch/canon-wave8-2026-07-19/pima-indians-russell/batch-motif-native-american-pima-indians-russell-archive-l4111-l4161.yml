  summary: 'The passage describes Pima agricultural products and trade: maize, legumes,
    cotton, cucurbits, wheat, planting and harvest times, seed selection, grinding
    methods, trading-store wheat commerce, and historical sales of crops and animals
    to mail, government, and military buyers.'
