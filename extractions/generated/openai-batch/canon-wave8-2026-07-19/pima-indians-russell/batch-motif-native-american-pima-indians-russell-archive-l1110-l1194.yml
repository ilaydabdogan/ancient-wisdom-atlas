canonical_text:
  quote: ''
  summary: The passage first describes the establishment and later conditions of Pima
    schools. It then surveys Indigenous chronological records, reports the discovery
    of Pima notched calendar sticks, describes a transition from stick records to
    pencil-and-paper records in one case, and explains that Pima years begin with
    the saguaro harvest, with a comparison to Lower California tribes' pitahaya-based
    year numbering.
  language: English
