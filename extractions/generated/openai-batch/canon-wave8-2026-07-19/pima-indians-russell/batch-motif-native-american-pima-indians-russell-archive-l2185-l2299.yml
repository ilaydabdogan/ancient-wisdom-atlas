  summary: A chronological calendar section records Pima movements, settlements, conflicts
    with Apaches, water and irrigation conditions, telegraph construction, raids,
    deaths, sickness, suspected magical harm by medicine-men, races, a smallpox epidemic,
    a twin colt birth, and a tizwin-related quarrel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For several years the Pimas had little irrigation water; Salt River settlers
    invited them to the Salt River valley, and a large party of Rso'ttik Pimas accepted,
    cleared river-bottom fields, and obtained an unusually good first crop.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Mormons on the Salt desired the Pimas to act as a buffer
    against Apache assaults from the north and east.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: United States soldiers and Pima, Maricopa, and Apache scouts surrounded Superstition
    Mountain Apaches at the Tanks; the main account reports that bullets were fired
    until no man remained alive, while a note gives figures of killed and captured
    and mentions one wounded escapee.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Ku-ukflmtikam, an Apache chief, and his band were killed by soldiers and Pima
    scouts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A village at Gila Crossing called Kamtik Wutcu, A-atam, or People-under-Kamatik,
    was settled during this year.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A telegraph line was run from west to east through Gila Crossing and Salt
    River during the winter.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note says the Salt River reservation contained Hohokam ruins and a large
    canal, and that canal-company arrangements gave the Pimas a constant water supply.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: On a campaign after heavy rain, Pimas found the Salt River too high to ford
    safely, built a raft for saddles and blankets, lost their effects when it sank,
    while others found a safe ford and continued the raid.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The raiding party killed several enemies and captured an Apache lad near Four
    Peaks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man tied one end of a lariat to his waist and the other to a horse's tail;
    the horse broke away and dragged him to death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Apache White Hat killed a Pima at Blackwater.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sickness prevailed in Rsanik; two medicine-men were suspected of causing it
    by magic means and were killed to stop the plague.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: During a mescal-gathering trip, a race took place between a man and a woman,
    and the woman won.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Later in the season the villages gathered to watch a kicking-ball race.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: An Apache village called Havany Kks existed at the junction of the Gila and
    Salt Rivers during a Pima-Apache truce; a smallpox epidemic affected that village
    and Pima and Maricopa villages.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:16
  text: In spring 1877, Gila Crossing Pimas and Gila Maricopa villagers competed in
    their first relay race against each other.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: While a party was gathering mescal before the wheat ripened, a mare gave birth
    to twin colts.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: A man searching for horses died from cold, and his body was found sitting
    under a tree.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: Pimas went to the Kwahadk' village to drink tizwin; a quarrel followed, and
    Casa Blancas killed two Santan men.
  category: sequence
  evidence_refs:
  - ev:16
