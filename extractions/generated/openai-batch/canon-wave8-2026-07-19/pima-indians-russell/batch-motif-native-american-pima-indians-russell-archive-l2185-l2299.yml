candidate_motifs:
- id: motif:1
  label: Water scarcity leading to relocation and agricultural renewal
  taxonomy_refs: []
  basis: The passage links scarce irrigation water, invitation to Salt River, field
    clearing, abundant water, and an exceptionally good first crop.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a historical calendar entry, not an explicitly mythic account;
    no supernatural water motif is stated.
- id: motif:2
  label: Community positioned as protective buffer against enemy attacks
  taxonomy_refs: []
  basis: The passage says the Salt River Mormons wanted Pimas to serve as a buffer
    against Apache assaults.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The motive is reported as historical/social strategy rather than a symbolic
    or mythic pattern.
- id: motif:3
  label: Dangerous flooded river crossing with failed raft
  taxonomy_refs: []
  basis: A campaign party finds the river too high, builds a raft, loses effects when
    it sinks, and others proceed by a ford.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Although the passage contains a raft and flood-height river, it does not
    present an ark, flood-renewal, or salvific vessel pattern.
- id: motif:4
  label: Raid resulting in killing and captive child
  taxonomy_refs: []
  basis: After crossing, raiders kill several enemies and capture an Apache lad near
    Four Peaks.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The account is brief and historical; it does not develop a captivity narrative
    beyond the capture.
- id: motif:5
  label: Disease attributed to harmful magic and killing of suspected ritual specialists
  taxonomy_refs: []
  basis: Sickness is attributed by suspicion to medicine-men's magic means, and the
    medicine-men are killed to stop the plague.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports suspicion and action but does not confirm causation
    or provide ritual detail.
- id: motif:6
  label: Female victory in man-woman race
  taxonomy_refs: []
  basis: During mescal gathering, a race occurs between a man and a woman, and the
    woman wins.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives no mythic framing or explanation of the race's significance.
- id: motif:7
  label: Inter-village public racing contests
  taxonomy_refs: []
  basis: The passage records a village gathering for kicking-ball and a first relay
    race between Gila Crossing Pimas and Gila Maricopa villagers.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: This is a social-calendar pattern rather than a demonstrated mythological
    motif.
- id: motif:8
  label: Exceptional twin animal birth
  taxonomy_refs: []
  basis: A mare gives birth to twin colts during the mescal-gathering season before
    wheat ripening.
  evidence_refs:
  - ev:14
  confidence: low
  cautions: The passage does not assign sacred, omen, or narrative significance to
    the twin colts; it should not be equated with a sacred-twins motif without further
    evidence.
- id: motif:9
  label: Death from exposure found beneath a tree
  taxonomy_refs: []
  basis: A man searching for horses dies from cold and is found sitting under a tree.
  evidence_refs:
  - ev:15
  confidence: low
  cautions: The tree is a literal location marker; no sacred-tree or afterlife symbolism
    is stated.
