  claim: The passage explicitly says Navitco is an evil spirit adopted from the Papagos,
    supporting a cautious nearby-tradition contact claim for this figure or cult.
  claim_level: historical_contact
  target: Papago Navitco tradition
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim relies on the passage's ethnographic statement and provides
    no separate historical mechanism or date of adoption.
- id: claim:2
  claim: The infant dysentery rite is presented by the source as combining Christian
    baptism with sun worship and magic medical practice.
  claim_level: same_function
  target: Christian baptismal naming, sun-facing worship, and magic healing practice
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The wording reflects the source's classification; the passage does
    not provide an indigenous interpretation of the combination.
