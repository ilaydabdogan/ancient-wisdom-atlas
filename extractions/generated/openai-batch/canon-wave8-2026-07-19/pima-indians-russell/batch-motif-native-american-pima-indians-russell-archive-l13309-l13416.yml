  quote: ''
  summary: The passage describes Pima disease categories and treatments involving
    throat cures, child sickness caused by spirits or malicious persons, slate tablets
    in water, a masked Navitco healing ceremony, an infant dysentery naming and sun-facing
    rite using Christian objects, magical horse cures involving live coals, and notes
    on common diseases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A throat disease called wheita is treated with a mesquite-root stick thrust
    down the patient's throat four times and passed four times over the heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tcunylm is described as an evil spirit that causes sickness in children, especially
    fretfulness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Treatment for Tcunylm sickness includes singing the Tcunylm song, pressing
    the child's body with a prepared strand of Apache hair, and using a'mina sticks
    tied with bluebird and redbird feathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another throat-disease treatment places a'mina in an olla of water while a
    doctor or assistant blows through a tube upon several parts of the patient's body
    and then sweeps feather attachments downward over the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the same treatment, the patient sucks the a'mina four times, the bundle
    is pressed and rubbed on the body, and an assistant repeats the speech of Siu-u
    from the time that deity restored himself to life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A disease called doctor's disease is attributed to magic influence from evilly
    disposed persons, especially medicine-men, and is treated by placing slate tablets
    from ruins in water that the patient drinks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A child's sickness may be attributed to a person wanting to take the child
    from its parents; accusation of that person is said to bring recovery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Navitco is described as an evil spirit adopted from the Papagos, with a home
    in the mountain called Papak, Frog, and as causing swollen knees and inflamed
    eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Navitco ceremony, one masked medicine-man personates Navitco and another
    masked figure called E&kspakam accompanies him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A signal is given by throwing corn meal on baskets, after which appointed
    singers sing the Navitco song with notched sticks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Navitco pats each patient with eagle feathers as if drawing out disease, throws
    the feathers away, and E&kspakam allows patients to touch the mask and then their
    swollen knees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the Navitco singing, singers rub notched sticks over their own bodies
    to prevent contagion, and all participants avoid salt for four days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Navitco medicine-men claim to possess the power to bring rain.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: A dysentery treatment for a child is explicitly described as combining Christian
    baptism, sun worship, and magic medical practice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the infant dysentery rite, close friends wash the baby early in the morning;
    a man holds a cross toward the sun for a boy, or a woman holds a medal toward
    the sun for a girl, four times.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The cross or medal is passed in the form of the cross over the infant's face
    and body, the sponsors hold the child four times, and a name is given by the godfather
    and godmother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The godparents give wheat or corn to the child each year until it grows up,
    and the parents give a basket each year in return.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Horses may be said to become sick when malicious medicine-men shoot live coals
    from an Apache fire into them.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: A reputable medicine-man treats the horse by smoking, blowing puffs of smoke,
    locating the coal, sucking it out, filling his mouth with water, and casting out
    the coal.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: The passage states that sucking a hair from the body is used in veterinary
    practice in a manner similar to treatment of human ailments.
  category: relationship
  evidence_refs:
  - ev:12
