candidate_motifs:
- id: motif:1
  label: illness caused by evil spirits or malicious magic
  taxonomy_refs: []
  basis: Tcunylm and Navitco are evil spirits causing illness, while evilly disposed
    or malicious medicine-men and a covetous person are described as causing disease
    or child sickness.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:11
  confidence: high
  cautions: This is an ethnographic illness-attribution pattern in the passage, not
    a narrated myth episode.
- id: motif:2
  label: fourfold healing actions
  taxonomy_refs: []
  basis: Multiple cures use fourfold repetition, including the wheita stick movements,
    the patient's sucking of a bundle, and the sun-facing infant rite.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  confidence: high
  cautions: The passage does not explicitly interpret the number four; only the repeated
    actions are recorded.
- id: motif:3
  label: disease extraction through object, feather, hair, or coal
  taxonomy_refs: []
  basis: The Navitco personator pats patients with eagle feathers to draw out disease;
    the horse cure extracts a live coal; hair-sucking is noted as a human and veterinary
    treatment.
  evidence_refs:
  - ev:6
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage includes the author's skeptical language for some procedures;
    extraction is recorded as a ritual action or claim.
- id: motif:4
  label: masked personation of disease spirit in healing
  taxonomy_refs: []
  basis: A masked medicine-man personates Navitco, another masked figure accompanies
    him, and patients interact with the mask during treatment.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not state whether the mask is understood as embodiment,
    representation, or performance beyond personation.
- id: motif:5
  label: resurrection speech used as curative formula
  taxonomy_refs:
  - resurrection
  basis: The assistant repeats the speech of Siu-u at the time when that deity restored
    himself to life while making passes toward the patient.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The resurrection event itself is only alluded to here and not narrated
    in the passage.
- id: motif:6
  label: sun-facing infant healing and naming rite
  taxonomy_refs: []
  basis: A dysenteric child is washed, a cross or medal is breathed upon and held
    toward the sun four times, passed over the infant in cross form, and followed
    by naming.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The source characterizes the rite as combining Christian baptism, sun
    worship, and magic practice; the extraction records the passage's description
    without extending the interpretation.
- id: motif:7
  label: ritual kinship exchange after healing-name rite
  taxonomy_refs:
  - sacred_exchange
  basis: After the infant naming rite, godparents owe annual wheat or corn to the
    child, and parents owe an annual basket in return.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage presents a social exchange obligation; its classification
    as sacred exchange should be reviewed.
- id: motif:8
  label: fire projectile as magical disease object
  taxonomy_refs: []
  basis: Malicious medicine-men are said to shoot live coals from an Apache fire into
    horses, and the cure centers on sucking out and casting away the coal.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This motif is limited to the horse-cure account in the passage.
- id: motif:9
  label: rain power associated with medicine-men of a disease-spirit ceremony
