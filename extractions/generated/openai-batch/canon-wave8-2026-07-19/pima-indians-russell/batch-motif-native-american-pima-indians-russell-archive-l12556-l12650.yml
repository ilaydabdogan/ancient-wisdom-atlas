canonical_text:
  quote: ''
  summary: 'The passage summarizes two brief Pima tales: a boy swallowed by a beast
    cuts himself out with sharp stones, killing it, and two runaway grandchildren
    transform into desert plants, one of which kills their pursuing grandmother. It
    then describes Pima religious beliefs concerning the Sun, Darkness/Night, Moon,
    Coyote, Earth Magician, Elder Brother, directional weather magicians, living stars,
    and an origin account for the Milky Way from spilled flour in the sky.'
  language: English
  quote_policy: summarized
