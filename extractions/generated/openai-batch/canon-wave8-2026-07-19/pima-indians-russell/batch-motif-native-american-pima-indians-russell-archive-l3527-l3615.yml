canonical_text:
  quote: ''
  summary: The passage lists Pima medicinal plant uses, including roots, leaves, bark,
    gum, flowers, and other plant parts prepared by pounding, boiling, soaking, drying,
    grinding, chewing, or mixing. Remedies are described for earache, toothache, sores,
    wounds, sore eyes, diarrhea, biliousness, throat disease, consumption, syphilis,
    gonorrhea, and as emetics, cathartics, poultices, styptics, and beverages. One
    entry mentions Pihoj, an evil spirit in the east that causes diseases with appropriate
    songs, and a tree also called pihoj from which a medicine stick is said to be
    made.
  language: English
  quote_policy: summarized
