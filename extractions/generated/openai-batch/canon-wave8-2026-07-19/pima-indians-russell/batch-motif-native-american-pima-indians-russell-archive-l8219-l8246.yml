canonical_text:
  quote: ''
  summary: The passage describes Pima kicking balls used in athletic running games.
    Wooden balls of mesquite or paloverde and stone balls covered with black gum are
    used. Contestants kick the balls while running, sometimes over long distances
    in pairs. The text reports a Pima claim that runners can go faster with the balls
    and suggests that stone balls found in ruins may have encouraged the idea that
    the balls had magic power to carry the runner, since things associated with the
    Hohokam were viewed as having supernatural significance. The custom is said to
    be rapidly disappearing.
