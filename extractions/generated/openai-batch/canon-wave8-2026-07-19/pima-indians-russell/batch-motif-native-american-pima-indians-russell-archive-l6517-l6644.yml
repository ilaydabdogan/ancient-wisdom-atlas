canonical_text:
  quote: ''
  summary: The passage describes Pima basketry ornament, including whorled frets,
    triangle or terrace elements, crosses, flower-like patterns, recent upright basket
    forms with human and animal figures, and a list of Pima names for distinct design
    elements. It also notes that many symbolic meanings are unknown to the makers
    and that outside questioning has encouraged plausible but uncertain interpretations.
  language: English
  quote_policy: summarized
