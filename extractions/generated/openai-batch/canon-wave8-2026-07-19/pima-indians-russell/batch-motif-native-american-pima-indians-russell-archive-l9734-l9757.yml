canonical_text:
  quote: ''
  summary: The passage describes five patrilineal Pima gentes with names said to have
    lost meaning. The first three are associated with Red/Vulture/Red Ant people and
    the last two with White/Coyote/White Ant people. It notes that no connection is
    supposed between these names and black ants or termites in the creation myth.
    It also summarizes a mythic account in which Elder Brother brings White People
    from the nether world, conquers the Red People, and Coyote’s premature laughter
    causes the earth to close before additional White gentes emerge. The author suggests
    the division may preserve traces of a junction of two peoples.
  language: English
  quote_policy: summarized
