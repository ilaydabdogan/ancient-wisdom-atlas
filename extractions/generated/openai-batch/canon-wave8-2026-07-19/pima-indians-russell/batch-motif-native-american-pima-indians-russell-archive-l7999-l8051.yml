  quote: The gourd rattle is used in most Pima ceremonies.
  summary: 'The passage describes several rattling or scraping instruments associated
    with Pima or Navitco ceremonies: a gourd rattle with gravel, handle, perforations,
    and a fourfold hole arrangement; a disk rattle of uncertain non-Pima attribution;
    a belt rattle with cartridge shells; cocoon rattles worn on the legs; and measured
    scraping sticks.'
