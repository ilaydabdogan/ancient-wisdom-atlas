literal_observations:
- id: obs:1
  text: A wooden lance made from a giant cactus rib was carried in sham battles near
    the Double buttes and was colored to represent an iron head and a light-red handle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The digging stick is identified as the earliest agricultural implement and
    was used for planting crops, clearing bushes, digging irrigation ditches, and
    defense in surprise situations.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wooden shovels were used to throw out earth loosened by the digging stick
    during irrigation canal construction and were made of cottonwood or mesquite in
    one piece with a short handle and curved blade.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A short ironwood implement combining spade and hoe functions was used to loosen
    soil around plants and remove weeds, requiring kneeling or sitting use.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A dibble with a steel blade superseded the earlier hoe-like implement and
    was obtained from Mexicans who came to trade with the Pimas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wooden plow is described as a comparatively modern European-derived introduction
    that influenced Pima wheat production between about 1850 and 1880 before steel
