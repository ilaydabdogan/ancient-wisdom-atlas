  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: With cattle, the Pimas obtained their first draft animal, and cattle were
    fitted with cottonwood or willow yokes attached to the horns.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Mortars are described in two log forms: one with a hole in the end of an
