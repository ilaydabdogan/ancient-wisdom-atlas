canonical_text:
  quote: ''
  summary: The passage inventories a wooden lance used in sham battles, then describes
    Pima agricultural implements and household utensils, including digging sticks,
    shovels, hoes, dibbles, wooden plows, yokes, cattle as draft animals, and mortars.
    It notes materials, functions, postures required for use, trade-derived or European-introduced
    implements, and comparisons to Hohokam canal tools and southern European horn
    yokes.
  language: English
