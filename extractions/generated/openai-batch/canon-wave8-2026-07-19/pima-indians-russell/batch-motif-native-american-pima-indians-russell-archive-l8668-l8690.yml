canonical_text:
  quote: ''
  summary: The passage describes a game with 14 rings, pre-agreed marks, and a whorl-shaped
    sand diagram. Scoring begins at a central place called tcimni ki, “council house,”
    runs to a western final hole called hoholdega ki, “menstrual house,” and returns
    to the center before a point is earned. A trailing player may “kill” an opponent
    by landing on the same hole and sending the opponent’s counter back to the beginning.
    The passage also notes two Sacaton specimens probably used in games by the Hohokam.
