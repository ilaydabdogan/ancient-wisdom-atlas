canonical_text:
  quote: ''
  summary: 'Ethnographic account of Pima puberty observances for girls: a girl at
    puberty is placed under a non-relative woman instructor for four days, observes
    restrictions, makes a basket gift, and may be honored by a four-night dance with
    songs intended to remove danger. Menstruating women are also secluded for four
    days, make baskets, receive food at a distance, and bathe in the river before
    returning home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl who reached puberty was regarded by elders as an object of concern
    and distrust because of newly acquired functional characteristics.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl’s mother selected a favored woman friend, not a relative, to take
    charge of the girl for four days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the four days, the woman instructor taught household tasks and moral
    principles such as industry, honesty, and chastity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl and instructor cooked and ate apart from their families.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl made a basket that had to be given to the elder woman as a present.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The girl spoke little and used a stick rather than her fingers if she wished
    to scratch her head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that using the fingers to scratch the head during this
    period would cause lice.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl was not to blow the fire, with the stated consequence that her teeth
    would come out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that there was danger in the girl that had to be breathed
    out by songs to protect her family and community from lightning and other perils.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: If a girl concealed her condition, the medicine-man’s magic was said to be
    able to discover her, and accidents could be attributed to her concealment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some girls avoided the coming-out ceremonies as long as possible, and poor
    parents might not hold a dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When parents had enough food for hospitality, they invited friends and neighbors
    to a four-night dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The father and mother did not dance but selected suitable girls to dance with
    their daughter for their good influence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Men and women formed two facing lines on a hardened, swept plaza outside the
    house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: The dancers extended their arms to embrace adjoining persons, and blankets
    were stretched along the line rather than wrapped around each individual.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The lines advanced and retreated rhythmically while puberty songs were sung.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The dance continued through the night without stopping for rest or food, and
    participants returned home in the morning to sleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: During menstruation, women were secluded for four days in bushes near the
    village, making small shelters for shade.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: Secluded menstruating women spent time making baskets and lived on pinole
    left each morning at a short distance from their camp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: Menstruating women bathed in the river before returning to their homes.
  category: action
  evidence_refs:
  - ev:8
