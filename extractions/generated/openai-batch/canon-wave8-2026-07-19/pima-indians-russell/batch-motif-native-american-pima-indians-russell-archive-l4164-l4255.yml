literal_observations:
- id: obs:1
  text: Oats are seldom raised in the region; barley is described as the common grain
    feed of Arizona, with the Pimas raising a small quantity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Watermelons, muskmelons, pumpkins, and squashes are extensively cultivated;
    watermelons are preserved by burying them in river-bed sand, while pumpkins, squashes,
    and muskmelons are cut into strips and dried or stored.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tradition says the first pumpkins were obtained from the Yumas and Maricopas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three wild gourd species are said to be common along the Gila; cultivated
    gourds have been known to the Pimas for a long but unspecified period.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Papagos have a tradition that the gourd was introduced by Navitco, described
    as a deity honored by ceremonies at Santa Rosa every eight years, or every four
    years if crops are bountiful.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gourds are used as canteens, dippers, and especially rattles containing gravel
    and mounted on handles; cracked gourd canteens may be repaired with rabbit skin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: At least five bean varieties are cultivated; the white bean is said to have
    come from the Colorado, called the great Red river, and beans are thrashed by
    horses driven in a circle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Gila-area planter is described as contending with drought, crows, squirrels,
    gophers, coyotes, and other field threats.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Boys guard fields during the day, carrying bows and arrows and playing games
    while watching for birds and animals; scarecrows are also used.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In earlier times night marauders were kept away by rings of cholla cactus
    laid around individual plants; the cholla is described as the most effectively
    armed cactus and as a symbol of impenetrability in Pima lore.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Trade or gambling values include equivalences among gourds, baskets, metates,
    shell necklaces, blankets, blue glass beads, horses, paint, beans or corn, and
    cooking pots.
  category: relationship
  evidence_refs:
  - ev:9
