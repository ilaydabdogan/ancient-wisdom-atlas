canonical_text:
  quote: ''
  summary: The passage evaluates Pima basketry, pottery ornamentation, and musical
    instruments. It describes Pima basketry as recent and borrowed, notes repeated
    decorative elements but limited symmetry, attributes some designs to Hohokam pottery
    and Maricopa influence, rejects warfare or environment as sufficient explanations
    for perceived ornamental inferiority, and lists four kinds of Pima musical instruments,
    with some said to be adopted from the Maricopas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Pima basketry and pottery do not provide much evidence
    of a well-developed aesthetic sense.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pima basketry is described as recent, borrowed, and mediocre.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yavapai baskets are compared with Pima baskets; the Yavapai baskets are said
    to use similar motives, show superior taste, and command twice the market price
    for equal size.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pima basket makers are said to understand rhythm and to repeat simple and
    complex decorative elements, including coyote tracks, plain triangles, flower
    patterns, and scroll frets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Symmetry is described as rare in Pima baskets, though one specimen is said
    to show that its maker possessed this faculty.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Pima basketry designs are described as copied from Hohokam pottery and
    some as adopted from the Maricopas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pima pottery designs are described as copied, and Pima wares are described
    as mostly unornamented.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage says ancient pottery fragments with indented coils are abundant
    in Pima fields, but that the Pimas did not use this form of ornamentation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kwahadk' pottery is described as superior to Piman pottery but still lacking
    symmetry, with rich brown color and polish but crude ornamentation compared with
    ancient Hohokam pottery.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author rejects the explanation that Pima ornamentation was inferior because
    the Pimas had degenerated under pressure from Apaches and Yumas.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Pimas are described as defeating or resisting Yumas and Apaches in warfare.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author says environment cannot explain Pima ornamental backwardness because
    the same surroundings produced the Hohokam culture.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author suggests that Pima ornamentation might have developed further if
    the Pimas had adopted the curved knife used by other American Indian groups after
    contact with whites.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that the absence of totemism in Pima social organization
    did not directly influence Pima art.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: 'The Pimas are said to have four kinds of musical instruments: flute or flageolet,
