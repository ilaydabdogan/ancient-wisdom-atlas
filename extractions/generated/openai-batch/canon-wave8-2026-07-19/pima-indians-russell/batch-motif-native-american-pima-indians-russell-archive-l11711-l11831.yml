canonical_text:
  quote: ''
  summary: Vulture finds a dead deer containing a strange arrow and brings the arrow
    home. Sandy Coyote recognizes it as belonging to the ill-treated boy who had been
    driven away with his mother, then returns it to them. The boy rebukes Sandy Coyote
    for past deprivation. The mother later tells her son to play ki°ts against Sandy
    Coyote, who killed his father. On a journey, the son appears to two girls as a
    singing, decaying corpse that winks; the younger takes it home, where it becomes
    a handsome young man. A rival husband returns, wagers, and dies when the young
    man removes him from his skin. The young man then goes to play ki°ts with Sandy
    Coyote, using fabricated bird eggs and a toenail made to look like the new moon
    in wager challenges.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vulture finds a dead deer with a strange arrow in it, takes the meat and arrow
    home, and asks the gathered people whose arrow it is.
