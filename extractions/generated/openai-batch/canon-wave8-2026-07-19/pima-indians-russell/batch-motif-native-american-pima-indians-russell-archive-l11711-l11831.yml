  evidence_refs:
  - ev:1
- id: obs:2
  text: Sandy Coyote recognizes the arrow but is initially too ashamed to speak; Vulture
    says he has heard of an ill-treated boy driven away with his mother to the mountains
    and thinks the arrow is his.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sandy Coyote admits the arrow belongs to his son or nephew, finds the widow
    and her son, and returns the arrow to the boy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy and his mother eat meat and put away the remaining food without speaking
    to Sandy Coyote.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sandy Coyote tries to whistle when leaving but cries; the boy says Sandy Coyote
    never gave him meat when he was younger, and he did not cry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother tells her son she is going home to her own people and says he may
    later play ki°ts with Sandy Coyote, who killed his father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: While going after his mother, the son lies beside the trail, sings after two
    girls pass, and appears to them as a decaying dead body that sings and winks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The younger girl takes the decaying body to her home despite the elder girl's
    objections.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the girls return home, the younger finds a handsome young man where the
    corpse had been; the elder later discovers him too.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The husband of the two young women returns angry, proposes a game, and tells
    the young man to put up one of his wives as a wager.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young man insists the rival husband has a shirt, despite the husband's
    claim that it is his skin; after agreement, the young man shakes him and he drops
    dead out of his skin.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The young man's mother arrives, and they take the two young women with them
    to their home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young man goes to play ki°ts with Sandy Coyote, bringing beads, deerskins,
    and other wager goods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: As he travels, the young man sings words rendered in translation as a demand
    that someone over there pay him for his old father.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The young man makes white stones resemble white birds' eggs, places them in
