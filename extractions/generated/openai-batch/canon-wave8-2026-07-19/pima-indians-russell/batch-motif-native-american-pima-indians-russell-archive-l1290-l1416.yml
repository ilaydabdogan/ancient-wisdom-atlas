canonical_text:
  quote: ''
  summary: 'The passage classifies Pima records as annals rather than named calendars,
    lists the kinds of events recorded, and narrates several early entries: a Yuma
    attack on Maricopas interrupted by Pimas; a meteoric shower followed by floods
    interpreted as disaster, punishment, or magic; an alternate flood account involving
    the goddess Takwa-artam and her two sons; a year of abundance and worship; Apache
    raids; a killing during cactus-fruit liquor intoxication; and a later year of
    farming, dancing, songs, target practice, and shield exercise.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Pima records are better designated as annals than
    calendars because the later years are filled with narrative events and the years
    are not named.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed event categories include battles or skirmishes, unusual natural
    phenomena, famines, epidemics, accidents, events involving whites, sorcerers killed,
    village site changes, races, liquor-brewing festivals, trivial events, and deaths
    during drinking bouts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yumas attacked a Maricopa village, captured women, were attacked by arriving
    Pimas, and were largely defeated while the women escaped into chaparral.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A meteoric shower was followed by heavy rains and floods in the Salt and Gila
    rivers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spectacle of falling stars was regarded by the Pimas as an augury of disaster,
    and the floods were regarded as punishment for unknown sins.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some people thought the medicine-man Kaku caused the calamity because he had
    not been shown the respect he thought was due.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: When the flood was high, Kaku climbed a cottonwood tree and declared that
    he would perform disastrous miracles if people did not listen to and respect him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Another explanation said that the floods were caused by the two sons of the
    old goddess Takwa-artam, and that she told them to give back her milk before drowning
    her people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Because the two sons could not return the milk that had nourished them in
    infancy, they did not let the flood rise higher and caused it to go down.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The following year was remembered for bountiful crops, desert flowers, cactus
    bloom, worship of the gods, dancing, and household welfare.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Apaches killed a Pima man and boy when many younger men were away after a
    rabbit-hunt direction changed, leaving one side of the village unprotected.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Liquor made from giant cactus fruit left the men too intoxicated to guard
    against Apaches; a woman was roped and dragged to death, five Apaches were killed,
    and rawhide armor was found to have deflected arrows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A later year passed without an Apache raid, while the people farmed, danced
    war dances, sang songs, practiced target shooting, and exercised with shields.
  category: action
  evidence_refs:
  - ev:9
