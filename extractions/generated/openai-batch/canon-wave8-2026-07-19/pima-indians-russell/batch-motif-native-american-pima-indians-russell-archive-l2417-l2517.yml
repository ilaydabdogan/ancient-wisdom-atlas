canonical_text:
  quote: ''
  summary: 'The passage records episodes associated with Pima calendar years in the
    1880s: an agent''s violent arrest order against Kwahadks after tizwin drinking;
    deaths by police violence, trains, hunting accidents, drunkenness, and shooting;
    an epidemic blamed on medicine-men; first wagons and adobe houses; a first Christian
    convert; a medicine-man''s dance with races and ceremonies; railroad construction;
    and Juan Thomas serving as a scout during the pursuit of Geronimo.'
  language: English
  quote_policy: summarized
