literal_observations:
- id: obs:1
  text: Pat'anlkam at Gila Crossing is described as a grave called Place of the Bad
    One; the author says it may be the grave of a Hohokam medicine-man taken for that
    of the son of Kakanyp.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other enclosed graves at Gila Crossing, between Sweetwater and Casa Blanca,
    and at Blackwater are called o'namtiksk, meaning unknown, and beads are found
    strewn about them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ma'vit Va-ak or Tci'apatak is a heap of small stones between the Double buttes
    over a shallow mortar containing partly broken beads, with creosote branches and
    decaying arrow shafts present.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the Ma'vit Va-ak shrine was still resorted to and was
    also of considerable antiquity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Evil spirits are said to dwell in the Picacho and Estrella mountains, and
    the author reports no known shrines in those ranges.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tightly covered medicine basket was said to have been kept on a Santa Rosa
    mountain top by a Papago medicine-man who carried offerings to it; all others
    were forbidden to touch it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Someone lifted the medicine basket's cover, and all the winds of heaven rushed
    out and blew away the nearby people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near the summit of a lava-formed Santan hill is a small cave where the Hohokam
    placed sacrifices.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: After earlier articles had been removed from the Santan cave, Pimas deposited
    the body of a child and other things there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cave is called Va'rsa Va'-ak, Basket Lying, because it contained a medicine
    basket; two Pima warriors discovered it while serving a sixteen-day lustration
    period after killing Apaches.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The basket in the cave contained deer-leg sinew and sticks, which the finders
    thought served the same purpose as their own head-scratching sticks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: When a medicine-man dies, his paraphernalia may be placed in an olla and hidden
    under a stone heap in the hills; he may also sacrifice part of his stock in a
    similar way during life, and warriors' property may be cached similarly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Such cache places were formerly respected by the tribe but were later robbed
    for relics to sell.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: A cache south of Casa Blanca contained concretions, crystals, shells, a stone-carved
