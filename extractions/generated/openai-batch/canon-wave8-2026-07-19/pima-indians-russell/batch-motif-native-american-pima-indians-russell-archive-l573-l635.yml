  quote: ''
  summary: 'The passage surveys ruins and place names around Casa Grande, Picacho/Ta-a''tdlkam,
    the Gila, Salt, Verde, and San Pedro areas, then quotes statements attributed
    to Pima tradition: the Pimas claim local creation, survival after a disastrous
