canonical_text:
  quote: ''
  summary: The passage describes a Pima calendar tradition in which Elder Brother
    instructs the people to divide the year into twelve parts after the twelve tail
    feathers of the little bird Gisap. It lists variant month names from two informants
    and explains seasonal reckoning, calendar sticks, year notches, mnemonic use of
    touch, and common symbols used to record events.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elder Brother is said to have told the people to count the twelve tail feathers
    of the little bird Gisap and divide the year into twelve parts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder Brother gave names for the twelve parts except for the coldest and hottest
    months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The writer states that recognition of named moons appears to be recent, since
    names are not widely known and differ even within the same village.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two different lists of month names are attributed to Kâ’mâl tkâk and Antonio
    Azul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pimas are described as lacking a winter count because they have no winters
    in the relevant sense.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The Gila valley is described as having two seasons: torrid heat and ideal
