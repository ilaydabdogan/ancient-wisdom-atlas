  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The year mark on the calendar stick is consistently a deep notch across the
    stick.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Narrators use the year notches to recall stories, sometimes raking a thumbnail
