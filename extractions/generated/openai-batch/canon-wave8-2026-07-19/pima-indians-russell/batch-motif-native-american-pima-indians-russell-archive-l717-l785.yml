canonical_text:
  quote: ''
  summary: The passage summarizes Spanish missionary and military contact with the
    Pimas from Kino’s 1702 journey through later eighteenth- and nineteenth-century
    interactions. It notes gifts of glass beads said to contain magic power, old glass
    beads found on Piman shrines, the introduction of horses, missionary travel and
    communication through Native messengers, Apache obstruction of travel, the remoteness
    of the Pimas from slave-hunting Spaniards, later trade with Tucson, and a description
    of Gila Pima communities and irrigation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In 1702 Kino made his sixth and last journey to the Pimas by way of Sonoita
    and the lower Gila; the passage says some Pimas were among those baptized, but
    that his stays among them lasted only a few days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kino gave away large quantities of beads; the passage states that the Pimas
    already valued their own beads and probably accepted Kino’s statement that magic
    power resided in new glass beads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The writer reports finding very old glass beads on all Piman shrines and believes
    that some of them were brought by Kino.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the first horses to reach Pimería were brought by these expeditions,
    while it records no cattle being brought so far north at that time.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Kino’s death in 1711, the passage says no Spaniard is known to have
    reached the Gila or entered Arizona for more than twenty years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Missionaries Segresser and Grashoffer became the first permanent Spanish residents
    of Arizona in 1731, and Keller later visited the Pima villages on the Gila and
    found that many rancherías of Kino’s time had been broken up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Communication through Native messengers indicated Hopi interest in Jesuit
    missionaries from Sonora; Keller’s attempt to proceed northward failed because
    of Apache hostility, and Sedelmair could not induce the Pimas or Maricopas to
    accompany him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says accounts of the earliest missionaries reached the Pimas through
    Papago messengers, who distinguished slave-hunting Spanish adventurers from Jesuits
    and Franciscans.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage characterizes the Pimas as beyond the reach of slave-hunting Spaniards
    and remote enough that only unusually devout and energetic friars reached them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A small Spanish garrison was stationed first at Tubac and later Tucson; the
    passage says its influence on the Pimas could not have been very great.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: From the late eighteenth century to 1853, the passage reports more or less
