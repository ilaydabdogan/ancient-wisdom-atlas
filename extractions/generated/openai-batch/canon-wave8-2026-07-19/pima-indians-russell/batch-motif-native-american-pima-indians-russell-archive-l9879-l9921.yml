canonical_text:
  quote: ''
  summary: The passage describes Pima politeness formulas, adoption of some greeting
    practices through Spanish/American or white contact, reported customs of kissing
    and reunion tears, guest-feeding practices, and relations with neighboring tribes,
    including alliances and conflicts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says conventional greeting words were not used before Spanish
    and American forms were introduced; speeches ended with a formula translated as
    the god sending regards, and listeners responded with a goodbye formula.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a narrator finished a story, those present could respond with a word
    expressing their relationship to the speaker, or with a word meaning friend if
    not related; the same expressions were used in accepting a gift.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Handshaking is described as unknown before introduction by whites, but as
    universally practiced at the time of the account.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says kissing was reportedly confined to mothers and infants, while
    also noting that accurate information on the primitive custom could no longer
    be obtained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Formerly, long-separated friends expressed joy at meeting by tears, and sometimes
    used relationship terms or the word for friend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Guests were offered pinole on arrival when it was not near mealtime; the food
    was easy to prepare without cooking and stayed hunger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At meals, guests were served food in a dish separate from the common bowl
    used by the family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Pimas' relations with neighboring peoples are said to have strongly influenced
    their social organization and cultural development; they held good agricultural
    lands and fought to keep them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Pimas' alliance with the Maricopas is described as involving a long, bloody
    struggle with the Yumas, ending in what the passage calls the almost total annihilation
    of the Yumas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Maricopas are described as giving the Pimas effective aid against the
    Apaches, and the Pimas are said to have learned the advantages of confederation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Yavapais were sometimes hostile but are not described as very formidable;
    other minor tribes mentioned in the Annals are said to have been allied with either
    the Yumas or the Apaches.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Aside from the Maricopas, friendly tribes named in the passage are the Papagos,
    Kwahadk's, and Sobaipuris.
  category: relationship
  evidence_refs:
  - ev:6
