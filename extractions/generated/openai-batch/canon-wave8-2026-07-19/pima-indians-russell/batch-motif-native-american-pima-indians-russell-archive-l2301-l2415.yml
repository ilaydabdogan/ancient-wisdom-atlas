  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A feud led Blackwater and lower-village/Santan people to conspire to kill
    men of a certain faction on a planned night, with a guard set to watch the intended
    victims.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man warned his brother at Casa Blanca; that brother then sent a runner to
    Blackwater to warn one of the intended victims.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The warning spread quietly, and the intended victims slipped into mesquite
    thickets and escaped toward Santan.
  category: sequence
  evidence_refs:
  - ev:5
