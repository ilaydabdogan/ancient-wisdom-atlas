  quote: ''
  summary: The passage records Pima calendar events, including deaths during tizwin
    drinking, illness, the building of the Southern Pacific railroad, an extended
    feud involving Blackwater and Santan parties, warning by runner, escape into mesquite
    thickets, attacks and revenge around the Government school building, rare heavy
    snow, robbery and execution, death by rattlesnake bite, police violence, and a
    measles epidemic among Pimas and Maricopas.
  language: English
  quote_policy: summarized
