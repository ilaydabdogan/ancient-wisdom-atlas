    was killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: One brother heard from a runner that his family was being killed, fled toward
    the Double Buttes, met another fleeing brother, and both grieved over their relatives
    and the conflict among their fellows.
  category: sequence
  evidence_refs:
  - ev:6
