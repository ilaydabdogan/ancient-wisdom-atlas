canonical_text:
  quote: ''
  summary: The passage describes Pima face, body, and hair painting practices, including
    storage of ochers and minerals, newborn face painting with red ocher and mother's
    milk, grease-and-paint applications, festival and dress-occasion painting, gendered
    color use, tattoo emphasis, use of water as a mirror, pigment sources and trade,
    and the author's statement that any earlier symbolic meaning of the painted lines
    was no longer known.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bright-hued ochers and other minerals for painting the face and body were
    kept in bags made of deerskin or cloth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Pima baby's face was painted immediately after birth with red ocher mixed
    with the mother's milk, with the stated purpose of improving the skin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After birth, paint was mixed with grease or applied over grease; in cold weather
    the mixture was used to prevent chapping and for warmth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Usually only the face was painted, but the entire body was painted for festivals
    and other special occasions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On dress occasions, facial lines were made narrower and applied with a splinter
    or twig of arrowwood rather than by hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men and women both painted their bodies and used the same facial colors in
    different proportions; men used more black, and both sexes emphasized tattoo marks
    with black lines under the eyes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The painted designs were simple vertical and transverse lines; paint was not
    often washed off, and new lines were added as old designs became effaced.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each person painted his or her own face and used an olla of water as a mirror.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men painted the frontal hair white or red when preparing for a dance, never
    both colors at once; women painted the hair in white spots and bands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Yellow ocher, cattail pollen, red pigment, bluish black specular iron ore,
    red and white minerals, and later diamond dyes are listed as pigment sources or
    materials, some obtained through neighboring peoples.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author states that if the painted lines once had symbolic meaning, that
    knowledge had not survived; at the time of writing the designs were described
    as meaningless and nearly forgotten.
  category: other
  evidence_refs:
  - ev:6
