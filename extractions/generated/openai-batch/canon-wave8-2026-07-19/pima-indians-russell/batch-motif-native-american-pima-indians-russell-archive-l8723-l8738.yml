canonical_text:
  quote: ''
  summary: The passage introduces Pima family organization and premarital relations.
    It says older Pima informants are needed for accurate information because conditions
    changed after American contact and the end of Apache danger. It contrasts former
    young men, whose energies were spent in warfare, with later youths who pursued
    girls, compares Pima conditions favorably against Yumas of the same period, and
    states that before contact chastity was the rule among young women despite the
    example of easy divorce.
