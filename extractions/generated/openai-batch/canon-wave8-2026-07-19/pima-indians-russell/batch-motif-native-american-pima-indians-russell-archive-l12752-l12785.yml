canonical_text:
  quote: ''
  summary: 'The passage describes three sacbed places: Stones Strike, a lava block
    in the eastern Santan hills with a large pictograph, piled stones, offerings,
    and a tradition about women waking a sleeping young man with pebbles; Hftr&k Yk''dkj
    Hk''kk Lying, a large scraped outline of a human figure near Sacaton with stone
    heaps and offerings, associated with Hft-ftk sleeping there before going to a
    cave; and I''aksk'', Place of Sacrifice, a stone heap near Blackwater described
    as the probable burial place of a Hohokam or Pima medicine-man.'
  language: English
  quote_policy: summarized
