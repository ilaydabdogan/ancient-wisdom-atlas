canonical_text:
  quote: ''
  summary: The passage recounts post-flood creation episodes involving Elder Brother,
    Coyote, and Earth Doctor; the making and disposal of animals and human-like beings;
    the origin of sickness from scattered blood; the awakening and displacement of
    the Apache group; the qualities of several tribes; Maricopa canal-making aided
    by Elder Brother and White-eater-old-woman; Elder Brother’s later mischief; and
    the origin of Rattlesnake’s biting teeth and Rabbit’s death from the bite.
  language: English
  quote_policy: summarized
