canonical_text:
  quote: ''
  summary: The passage describes Pima livestock and domestic animal practices, including
    seasonal stock feeding on mesquite, remembered cattle introduction, scarcity and
    later abandonment of oxen, open-range cattle management, Apache livestock raiding
    and night corralling, use and valuation of mules and donkeys, poultry breeds and
    calls derived from Mexican and American sources, raptors kept for feathers used
    by medicine-men, and doves kept in arrowwood cages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Horses improved when mesquite leaves appeared in April, and livestock fattened
    rapidly when mesquite beans ripened in June and July; a few owners stored beans
    as stock feed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sala Hina reported that her father and his brother, described as two Kwahadk's,
    brought the first cattle to the Pimas about 1820; the passage also states that
    Spanish missionaries in Papagueria had brought livestock to their stations for
    at least two prior centuries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The custom of killing and eating cattle at the death of their owners is said
    to have materially hindered the growth of Pima herds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oxen were scarce for about half a century after introduction, and one ox might
    serve a whole village by dragging a wooden plow; oxen, head yokes, and wooden
    plows are described as no longer used.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cattle were driven and roped with a lariat, branded, and allowed to run at
    large; lack of water away from the river limited straying.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Horses and cattle attracted Apache raids; Pimas corralled stock in the village
    at night and sometimes encountered enemies while tracking strayed animals or waiting
    at water holes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A few mules were raised but described as small and of little value; burros
    were used but considered slow for waterless plains and unsuited to farm work.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A small poultry breed had been obtained from Mexicans, along with the call
    transcribed as 'pul'; later American breeds brought the call transcribed as 'peep.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Eagles and red-tailed hawks were kept for their feathers, and village inhabitants
    helped catch lizards and provide other food for the village bird.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The feathers of kept eagles and red-tailed hawks were regularly plucked for
    medicine-men's paraphernalia.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sonora doves were confined in log-cabin-style cages made of arrowwood rods.
  category: object
  evidence_refs:
  - ev:9
