canonical_text:
  quote: ''
  summary: 'The passage describes Pima pottery manufacture by coiling: clay preparation,
    shaping over an old vessel, coiling with paddle and stone, sun drying, polishing,
    slip application, firing in a shallow pit, black pigment decoration, and several
    finished vessel types including ollas, cooking pots, bean pots, and former pottery
    canteens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Clay is dried in the sun, sifted, mixed with water, kneaded, formed into fist-sized
    lumps, and left overnight to ripen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The base of a new vessel is formed over the bottom of an old vessel, smoothed
    with a paddle, dried in the sun, removed, and then prepared for coiling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Clay cylinders are laid around the vessel margin as coils; a paddle is used
    on the outside while a circular stone is held inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The potter may work on several vessels at once because coils are added only
    as fast as drying allows; arid sunlight speeds the process.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lower coils are smoothed with a polishing stone, and water is applied to spots
    that have become too hard to rub down easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A dark red shale is ground in water into a thick liquid, applied to the vessel
    exterior by hand, and polished as it dries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For firing, the vessel is laid on its side over wood in a shallow pit and
    covered with sticks; the wood burns away in about twenty minutes in the specimen
    described.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If decorated, black mesquite pigment is applied with a sharpened Baccharis
    glutenosa stick, and the vessel is heated again until the decoration becomes deep
    black.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Water reservoirs or coolers are described as large, fine, porous, round-bottomed
    pots that cool water by evaporation.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cooking pots are numerous household vessels; they are undecorated, less carefully
    polished, and broken pieces may still be used for parching grain or other purposes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Bean pots are made with handles and are described by the writer as a distinct
    type.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: A note attributes the decoration of one larger collected specimen to Hohokam
    pottery of the Casa Blanca district.
  category: relationship
  evidence_refs:
  - ev:9
