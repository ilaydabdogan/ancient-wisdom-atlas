literal_observations:
- id: obs:1
  text: During a short peace between Pimas and Apaches, Maricopas killed two old Apache
    men, captured an Apache boy, and the boy was sold to a man known to the Pimas
    as Chin Beard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man known as Chin Beard took the captured boy on an expedition against
    Apaches, and a Mexican in the party enabled communication with the Apache-speaking
    opponents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The expedition placed flour, sugar, and other rations on blankets; Apaches
    approached because they understood the food as a peace offering, while Pimas and
    side arms were concealed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a signal, the Apaches were fired upon and many were killed; Lennan was
    killed while pursuing escaping Apaches, and the place was thereafter named as
    the place where the snare was set.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note gives Owl Ear's variant that Lennan and the man who struck him fell
    dead together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The editor compares the Piman account with J. Ross Browne's account of King
    Woolsey's so-called pinole treaty, in which Apaches were invited for pinole and
    then fired upon after Woolsey shot an Apache chief.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Salt River entry, Apaches came to trade goods for ponies while another
    part of the group attempted horse theft; after tracks linked the thieves to the
    traders, Pimas killed many traders and several thieves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Pima was killed by Apaches while looking for horses near the hill between
    Blackwater and the Sacatons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: One calendar entry states that this was the first year Pimas were supplied
    with firearms and aided United States soldiers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pimas and Maricopas campaigned against Apaches, captured arms and army property,
    were accused by whites of killing soldiers, and then had the account accepted
    after guides showed the battlefield and dead Apaches.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Owl Ear is quoted as saying that the accusation made him think the white man
    was not good enough to trust them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a Blackwater raid entry, two Apaches were killed and their ears were cut
    off and nailed to a stick.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Soldiers and Pima scouts took a ration wagon to the Superstition mountains
    in an effort to establish peace; Apaches understood the act as hostile, attacked,
    killed the driver, and were pursued.
  category: sequence
  evidence_refs:
  - ev:10
