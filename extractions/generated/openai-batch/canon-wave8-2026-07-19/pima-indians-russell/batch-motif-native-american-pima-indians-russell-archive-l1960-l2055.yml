  summary: 'The passage records Pima calendar entries and editorial notes about Pima,
    Maricopa, Apache, and white/United States interactions: a deceptive food-offering
    attack during a temporary peace, related white testimony about the same engagement,
    trade and horse-theft conflict, Pima access to firearms, campaigns with disputed
    spoils, trophy display, and a failed ration-wagon peace effort.'
