  text: The three most important basketry materials named are willow, cat-tail stems,
    and devil's claw pods.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:4
  text: Willow twigs are gathered in March before the leaves appear, stripped with
    teeth and thumbs, split with teeth and hands, and kept in coils.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Pimas use willow for the weft, while the Yavapais at old Fort McDowell
    use willow for the white outside of baskets and for the inner coil.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cat-tail stems are gathered green in July, split, dried, and used as foundation
