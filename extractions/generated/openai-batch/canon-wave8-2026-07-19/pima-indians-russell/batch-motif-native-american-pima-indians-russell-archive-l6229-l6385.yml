canonical_text:
  quote: ''
  summary: 'Ethnographic description of Pima basketry: women make baskets in many
    homes; willow, cat-tail, and devil''s claw are principal materials; other plant
    materials and implements are described, along with preparation methods, substitutions,
    and brief comparisons to Yavapai and Papago practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Basket making is practiced in nearly every Pima home, and the work is done
    by women; skilled makers produce useful, durable, and attractive wares.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage links recent poverty to the tribe's river water being taken and
    states that some women began producing baskets for immediate sale without full
    training in girlhood.
  category: relationship
  evidence_refs:
  - ev:1
