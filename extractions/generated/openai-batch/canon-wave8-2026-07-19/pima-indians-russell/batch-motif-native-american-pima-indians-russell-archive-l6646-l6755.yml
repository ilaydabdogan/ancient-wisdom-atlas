canonical_text:
  quote: the kiaha is distinctively a woman's utensil
  summary: The passage describes the Pima kiaha carrying apparatus, its use by women
    for heavy loads, its association with female life stages, its materials and manufacture,
    and the gathering, preparation, spinning, dyeing, and exchange of fibers used
    in kiaha nets.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Burdens are described as borne by women, either with a head ring or with the
    kiaha carrying apparatus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A kiaha can be loaded on the ground with its front frame sticks and a helping
    stick forming a tripod; the carrier places her head under the carrying strap,
    rises, and unloads by bending forward so the burden is thrown clear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described photographed load weighed nearly 100 pounds; the passage adds
    that a baby in a cradle could be placed horizontally on top of the load if needed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Girls of about eight or ten begin with small or cut-down kiahas and learn
    loading, balance, endurance, and care of the apparatus from rain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A maiden's kiaha has long gaily-spotted front frame sticks wound with hair
    cords, and her helping stick is ornamented with a long deerskin fringe.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: As an owner grows older, the kiaha's decoration is renewed less often, cordage
    becomes short and worn, and front sticks may be cut down, while the burdens remain
    heavy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kiaha frame uses saguaro ribs, the hoop is willow, the apron and headband
    are agave leaf, padding may be bark or cloth, and human hair cord attaches the
    hoop to the frame sticks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Maguey and related plant fibers are gathered in higher hills and mountains,
    roasted overnight in lined fire pits, scraped with a deer's scapula, dried, and
    used for kiaha nets.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Prepared fiber rolls and twine balls are described as articles of barter between
    Pimas and Papagos or as items kept for later net making.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Spinning kiaha thread is described as a social event in which women gather,
    gossip, and twist two-ply twine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the net is bound to the hoop, red and blue dyes are applied to emphasize
    the outlines of the pattern.
  category: attribute
  evidence_refs:
  - ev:8
