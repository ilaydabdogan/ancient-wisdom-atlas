canonical_text:
  quote: ''
  summary: The passage describes Pima children's play, imitation of adult social and
    ritual life, evening games and stories, boys' weapon practice, rules about killing
    or handling certain animals, magical use of owl feathers, children's implements,
    and a caution about eating from an olla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Younger girls make realistic rag dolls and treat them with serious make-believe
    attention.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girls stage make-believe events including the burial of a whole family,
    destruction of make-believe property, parties, grinding for pinole, and making
    mud dishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children play hide-and-seek in wheat fields, but the game is described as
    brief and likely to have unpleasant consequences.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the evenings children play puberty dances or listen to tales about elders'
    prowess and mythic animals of ancient Pimeria.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Boys practice repeatedly with bows and become accurate shots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Birds, squirrels, and fish are described as targets for boys' shooting practice.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Pima boys are not prohibited from killing rattlesnakes, unlike pueblo lads,
    but they must not reuse the same arrow afterward.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: If rattles are wanted as ornaments, they must be taken from a living snake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Gila monster and horned toad are exempt from the boys' arrows.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: There is no parental prohibition against destroying birds' nests, but the
    warning that touching quail eggs causes blindness protects at least one species.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The owl is described less as a bird of evil than as one of mystery and death.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Owl feathers are sought for magical potency in medicine and other ceremonies,
    and if a boy shoots an owl he must pluck its feathers before it dies or the plumes
    lose power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pima youngsters have rawhide slings, later made from boot leather, and learned
