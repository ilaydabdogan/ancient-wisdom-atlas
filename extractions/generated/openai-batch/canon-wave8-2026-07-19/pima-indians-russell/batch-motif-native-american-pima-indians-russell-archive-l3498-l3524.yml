literal_observations:
- id: obs:1
  text: Berries of Vakwai'TiaiAndHimj, identified as Solanum eleeagnifolium, are put
    into milk for cheese-making as a substitute for rennet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vak'wandam, identified as Rumex berlandieri, is used with cactus fruit, Opuntia
    arborescens, in the same manner as saltbush, Suseda arborescens.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vi'pinoi, identified as Opuntia versicolor, has fruit that is sometimes eaten
    raw but is usually prepared like Opuntia arborescens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dr Edward Palmer collected among the Pimas in 1885 and obtained nuts of the
    'quinine plant,' Simmondsia califomica Nutt., which he reported were eaten raw
    or parched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Professor Thomber states that Mexicans use oil from the Simmondsia plant as
    a hair tonic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Professor Thomber describes an 'Indian potato,' Ilofi'manseggia falcaria Cav.,
    which tastes like cultivated Irish potato when roasted, though the passage says
    it belongs to the pea family and is not a potato.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A true Solanum is said to occur natively in Arizona, but the authors state
    that they have not learned that the Pimas know it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: At least three kinds of chewing gum are described as being in use.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The most highly esteemed chewing gum is called vi-ipam, meaning 'milky,' and
    is obtained from a plant resembling a sweet-potato vine.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: For vi-ipam, pointed pods are gathered, their milk is poured into a squash
    stalk, and the material is heated in ashes before chewing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A bush called tohafs, identified as Encelia farinosa, exudes a clear gum.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Gum on stems of some Compositae is sometimes gathered and chewed by children.
  category: action
  evidence_refs:
  - ev:8
