canonical_text:
  quote: ''
  summary: The passage describes the Pima game ki°ts/Id^tsktit, played with four giant-cactus-wood
    sticks struck upward with a flat stone. It lists the names and scoring values
    of stick positions, describes a rectangular ground-marked scoring track with holes,
    houses, doors, and named positions, and explains that a player's marker, called
    a slave or horse, may be said to be in the fire while coming home. The passage
    notes similarities and differences with a Papago game called ghing-skoot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pima name of the game is given as ki°ts, and the sticks are called Id^tsktit.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four sticks are used in the game, and the collected set is described as made
    of giant cactus wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four sticks are named Ki-ik, Tco-otp', Si-ika, and Ki"ts, with meanings
    supplied for the first two and unknown meanings for the latter two.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Players sit about 10 feet apart and put the sticks in play by striking them
    from below with a flat stone held in the left hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sticks are held nearly vertical and inclined forward so that they fall
    in the space between players, who rake them back with a long stick after each
    throw.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Counts are assigned according to which stick faces or backs are up, with listed
    values including 2, 3, 4, 5, 6, 10, 14, and 15.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Counts are kept on a rectangle marked on the ground, usually about 12 by 8
    feet, with holes or pockets along each side.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two alternate corners have quadrants called ki, translated as houses, and
    corner holes called ut'pa, translated as doors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each player or side uses a marker stick called rsAika, translated as slave
    or horse, to mark the throw.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a player is coming home and the count carries the marker only to the
    last hole of the house, the marker is said to be in the fire and remains burnt
    until a number less than 14 or 15 is thrown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Named positions on the rectangle include hip, near the corner, middle, above
    the end, last, above the hip, several end positions, and fire end or in the fire.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that a game called ghing-skoot has been described among
    the Papagos and that the Pima count is similar to the Papago count when Pima names
    are substituted.
  category: relationship
