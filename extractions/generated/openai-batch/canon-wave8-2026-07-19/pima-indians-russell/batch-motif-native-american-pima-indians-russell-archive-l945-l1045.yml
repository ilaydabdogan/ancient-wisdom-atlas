  quote: ''
  summary: The passage lists tools and supplies, then describes Maricopa Wells as
    a stage station and presents a contact-era account of social disruption, trade
    exploitation, poor administration, reservation land limits, and threats to Pima
    and Maricopa water supply from Gila River settlement and the projected Florence
    canal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening lines enumerate agricultural and workshop tools and supplies,
    including hoes, sickles, plows, nails, a forge, needles, barley, and turnip seed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maricopa Wells, near the lower villages, became an important stage station
    after overland mails began passing in the late 1850s.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the stage, emigrant trains, and military trains brought
    damaging contact, and that from 1850 to 1880 the Pimas lacked a teacher, missionary,
    or competent agent until 1871.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bancroft is cited as summarizing deterioration during contact, including intemperance,
    prostitution, pilfering, mounting troubles from 1868, and young men beyond chiefs'
    control.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The cited account describes traders near the villages buying grain at their
    own prices, manipulating government goods, and liquor being obtained from Adamsville
    or itinerant Mexicans.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that white settlers on the Gila used so much water that
    in dry years the Pimas had to leave the reservation or starve.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sylvester Mowry warned in 1859 that extensive cultivation above the Indian
    fields would cause trouble over irrigation water and bring collision between settlers
    and Indians.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Poston warned in 1862 that occupation of land above the Pimas and reduction
    of their water supply might produce discontent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note states that the original survey contained 64,000 acres, less than the
    Pimas claimed and required, and that later surveys added acreage after promises
    that the boundaries were temporary.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Agent R. G. Wheeler protested the diversion of Gila water for the projected
    Florence canal, and an investigation found the existing water supply barely sufficient,
    the proposed dam able to control substantially all Gila waters, and shutoff likely
    to make the reservation uninhabitable.
  category: action
  evidence_refs:
  - ev:9
