  summary: The passage describes Pima measures of length, distance, land division,
    exchange value, and long travel distances. It defines humaka os, or “one stick,”
    by a body span; notes correspondences with named Aztec, Cakchiquel, and Maya lineal
    measures; gives decimal-like equivalences involving calico, wheat, and horse value;
    and describes humaka kuirspa, or “one step,” along with journey-day distance reckoning.
  language: English
  quote_policy: summarized
