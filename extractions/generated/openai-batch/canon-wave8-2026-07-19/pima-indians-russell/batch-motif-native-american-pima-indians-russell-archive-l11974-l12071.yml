canonical_text:
  quote: one large rain drop fell upon her; immediately twin boys were born.
  summary: A mat-making woman near Casa Grande rejects human suitors. Cloud causes
    her to conceive twin boys by a rain drop. The twins seek their father in the east
    through Wind, prove their parentage by lightning powers and survival in rain-flood
    waters, then return west under Cloud's warning not to speak to those they meet.
    After encounters with bird beings and Coyote, the twins are halted on a mountain
    near Tucson and transformed into mescal, explaining mescal on mountains, moving
    thunder and lightning, and rain during mescal gathering.
  language: English
  quote_policy: quoted
