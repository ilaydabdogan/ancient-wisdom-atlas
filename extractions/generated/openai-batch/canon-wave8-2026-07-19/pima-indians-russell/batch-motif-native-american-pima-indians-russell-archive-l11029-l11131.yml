canonical_text:
  quote: ''
  summary: The passage gives a Pima narrative in which Tarsnamkam sends a made parrot
    to Casa Grande to swallow and steal turquoise. Si'al Tcu'-utak Si'van responds
    by sending rain, but Tarsnamkam survives through magic. Tarsnamkam then sends
    a football to Si'al's daughter Pia; the ball enters her womb and becomes the monstrous
    child H&-&k, who kills and eats children before being killed by Elder Brother.
    The passage also reports a variant in which the mosquito hawk receives a many-colored
    ball from the Sun and uses it to impregnate Pia. A cited tale in the passage describes
    a flood survivor, Ci-ho, and a monstrous eagle who steals women and children until
    Ci-ho kills it.
  language: English
  quote_policy: summarized
