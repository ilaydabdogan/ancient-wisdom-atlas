candidate_motifs:
- id: motif:1
  label: Animal intermediary steals treasure by swallowing it
  taxonomy_refs:
  - sacred_theft
  basis: Tarsnamkam creates and sends a parrot to Casa Grande specifically to swallow
    green stones; it swallows turquoise and returns to vomit them for Tarsnamkam and
    the people.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes theft of valuable stones, but it does not explicitly
    call the act sacred.
- id: motif:2
  label: Magic weather attack resisted by counter-magic
  taxonomy_refs: []
  basis: Si'al sends rain for sixteen days to destroy Tarsnamkam, but Tarsnamkam is
    not injured because he also has magic power.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly matches this pattern.
- id: motif:3
  label: Object-caused pregnancy and monstrous child
  taxonomy_refs:
  - miraculous_child
  basis: The football disappears into Pia's womb and becomes a child; the variant
    also has a many-colored ball placed in Pia's blanket fold causing pregnancy.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:11
  confidence: high
  cautions: The resulting child is monstrous and dangerous; the passage does not frame
    the birth as beneficent.
- id: motif:4
  label: Rapidly maturing ferocious child who eats children
  taxonomy_refs: []
  basis: H&-&k grows to maturity in three or four years, has claws and sharp teeth,
    and kills and eats the people's children.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy family directly matches child-eating monster as a
    standalone motif.
- id: motif:5
  label: Monster slaying with communal feast and remembered place
  taxonomy_refs: []
  basis: Elder Brother kills H&-&k; afterward the people make a feast, and the cave
