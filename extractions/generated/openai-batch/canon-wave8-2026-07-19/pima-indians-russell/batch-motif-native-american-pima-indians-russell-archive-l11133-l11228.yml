canonical_text:
  quote: ''
  summary: After Hfi,-^k/Hiplk is killed, an excluded grandmother has her grandsons
    collect drops of the slain figure's blood. Over repeated four-day intervals the
    blood becomes eggs and then birds. The boys release the birds and later find their
    grandmother killed; from her grave a plant grows, identified as tobacco, whose
    use Elder Brother explains along with other charms. The youths use the charms
    and are killed. Elder Brother then behaves mischievously, is killed repeatedly
    by the people, and reappears each next day. The people summon Vulture, a man-bird
    transformer and flood survivor, to test his magic against Elder Brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Hfi,-^k/Hiplk was killed, the people held a feast, but one old woman
    and her two grandsons were not invited.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman told her grandsons to search for drops of the slain figure's
    blood; they found a few drops among rocks and brought them to her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old woman placed the blood in a dish, and at four-day intervals it became
    two eggs, then two little birds, and then two very beautiful birds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people tried to obtain the birds and pursued the boys; the boys released
    the birds, which flew into the mountains and forest, and the boys hid there as
    well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the boys returned home, they found that their grandmother had been killed,
    and they buried her body in the sand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The grandmother had left instructions for the boys to visit her grave at four-day
    intervals until a plant appeared; they later gathered its leaves, which became
    tobacco.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Elder Brother taught the youths to roll the tobacco in corn husks for smoking,
    to mix it with earth flowers for gaining women's favor, and to prepare a sleeping
    powder from tree bark.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youths followed Elder Brother's instructions, found the charms effective,
    and were later killed by people angered at their use of the charms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Elder Brother lived in a cave at Baboquivari, went from village to village
    making mischief, and was driven away to Mo'hatftk mountain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The people killed Elder Brother by clubbing him and leaving him in the woods,
    but he reappeared among them the next day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The people killed Elder Brother a second time by cutting and scattering his
    flesh and powdering and scattering his bones, but he reappeared the next day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The people killed Elder Brother a third time by burning his body to ashes,
    yet he reappeared again the next day.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A council decided to seek help from Vulture because Vulture had survived the
    flood with Elder Brother and was believed to have magic power.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Vulture is described as a man who transformed himself into a bird, passed
    through openings in the sky, survived the flood, came down again, and built a
    va'-aki or magic house.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: When the people brought complaints about Elder Brother to Vulture, Vulture
    said he had not used his magic power before but would test it in their presence.
  category: speech
  evidence_refs:
  - ev:12
