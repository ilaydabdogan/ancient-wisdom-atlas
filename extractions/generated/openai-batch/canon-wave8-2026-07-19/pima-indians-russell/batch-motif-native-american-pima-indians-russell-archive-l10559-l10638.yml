canonical_text:
  quote: Here I have come to the center of the earth; ... I see the central mountain;
  summary: 'The passage recounts a flood myth and related traditions: El Bebedor sends
    water over the land and survives at the Ridge of Foam with animals; Coyote, Earth
    Doctor, and Elder Brother survive by different means; Elder Brother becomes ruler
    and directs a search for the land’s center; El Bebedor later makes people from
    mud, distinguishes downstream and upstream peoples by language and status, transforms
    many into saguaros, and lowers the sun to burn people before relenting.'
  language: English
  quote_policy: quoted
