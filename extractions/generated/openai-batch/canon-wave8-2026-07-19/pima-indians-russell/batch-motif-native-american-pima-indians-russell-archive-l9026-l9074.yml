canonical_text:
  quote: ''
  summary: 'The passage describes a Pima infant naming rite called baptism: godparents
    and visitors come before sunrise for four mornings; a boy is ceremonially addressed,
    touched, lifted to the rising sun, and named by a godfather, while a girl is addressed
    and named by a godmother. It also describes beads, gifts, reciprocal godparent
    relations, later naming practices, youth restrictions on speaking one''s own name,
    avoidance of deceased persons'' names, and comparative footnotes on other infant
    baptism or godparent-naming customs.'
  language: English with embedded Spanish footnote excerpt
  quote_policy: summarized
