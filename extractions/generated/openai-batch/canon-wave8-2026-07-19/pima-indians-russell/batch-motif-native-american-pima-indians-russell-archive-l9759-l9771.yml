canonical_text:
  quote: ''
  summary: 'The passage describes Pima enslavement practices: captives were mainly
    Apache or allied children, rarely Yuma children; captured Apache children were
    not killed but sent to regional towns and sold to Spaniards or Mexicans. Captives
    were reportedly treated well, though their origin remained remembered and medicine-men
    sometimes blamed misfortunes on the presence of aliens. Rarely, captive girls
    married into the tribe.'
