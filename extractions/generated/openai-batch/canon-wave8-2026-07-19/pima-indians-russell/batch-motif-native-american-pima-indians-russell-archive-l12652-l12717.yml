canonical_text:
  quote: The soul is in the center of the breast. It makes us breathe, but it is not
    the breath.
  summary: 'The passage reports Pima views about the soul: its location in the breast,
    varied postmortem destinies including association with owls, an eastern land of
    the dead beyond Earth Crack, joyful feasting and dancing without moral reward
    or punishment, and restless ghosts who may be addressed by medicine-men.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The soul is described as being in the center of the breast, making people
    breathe, but not being the breath; its appearance or color is unknown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Pima views concerning the destiny of the soul varied
    considerably.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some people said that at death the soul passed into the body of an owl, and
    a hooting owl at a death was believed to be waiting for the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dying persons sometimes referred to the owl's diet by saying that they were
    going to eat rats, and owl feathers were given to a dying person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Owl feathers were kept in a long rectangular maguey-leaf box or basket; medicine-men
    kept such feathers; feathers were preferably taken from a living owl, which might
    then be freed or killed.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Short downy owl feathers falling on a person were said to cause blindness,
    and young people avoided abandoned buildings inhabited by owls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another view says souls after death go to the land of the dead in the east,
    called Si'allk Rs&n, Morning Base, or the place where the sun rises.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The East Land is separated from the land of the living by a chasm called Tcu'wut
    Hi'ketany, Earth Crack.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The other world is described as a place of rejoicing, gladness, feasting,
    and dancing; therefore the dead person's best clothing is put on and the hair
    is carefully dressed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage states that there is no idea of spiritual reward or punishment
    for conduct in this life.
  category: other
  evidence_refs:
  - ev:3
- id: obs:11
  text: Souls of the dead are said to hang about, perform unpleasant pranks with the
    living, and appear to a person alone at night; the ghost does not speak then,
    and only medicine-men may speak to ghosts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: If a person becomes sick after seeing a ghost, a medicine-man is to go to
    the grave of the offending soul and tell it to be quiet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Old Kisatc thought the soul continued to reside in the body as its house,
    and recounted a grave-side speech in which a spirit replied that it did not stay
