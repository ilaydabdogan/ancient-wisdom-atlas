canonical_text:
  quote: ''
  summary: The passage gives two versions of an origin of the horse. In the first,
    an elder brother instructs his younger brother to kill, cut, and place him in
    water; after four days four horses appear and later multiply in Pimeria. In the
    second, two disabled brothers are healed after thunder and a warning voice; when
    game is unavailable and they are starving, the elder sacrifices himself and two
    horses appear. The passage then gives a nursery tale in which five orphan children
    cared for by their aunt ignore and kill a warning rabbit, find their aunt dead
    after an Apache attack, fail to recognize death, later hear a ghostlike return,
    flee, and turn into stone.
  language: English
  quote_policy: summarized
