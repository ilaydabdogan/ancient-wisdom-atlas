literal_observations:
- id: obs:1
  text: The passage says many Pimas believe they came from the east, and that the
    abode of their dead and their gods is located in that quarter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this directional belief did not seem to be influenced by
    Yuman-stock tribes, who sought paradise in the opposite direction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports vestiges of a tradition that a large force of warriors
    from the east overwhelmed the Pimas, destroyed nearly all the people, and devastated
    the Gila valley.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage distinguishes the eastern-warrior tradition from an account of
    invasion by underworld clans.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage reports varying Pima statements: most say their people always
    lived where they now are or came from the east; some say the Hohokam were killed
    by an eastern invasion before the Pimas came.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the Pimas formerly regarded ruins with reverence or aversion
    like their own burial places.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: After Hemenway Expedition excavations on the Salt River were followed by no
    disasters, the Pimas became less scrupulous and could be hired to excavate ruins
    or ancient cemeteries.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says Coronado's seeing Casa Grande is unverified and judged extremely
    improbable by the writer; no white man is known to have reached Pimas Gileños
    territory for about a century and a half after that invasion.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Father Eusebio Francisco Kino reached Casa Grande in 1694 with native guides
    who told him of the ruin; the passage says a mass was said within its walls and
    infers that he visited nearby Pima villages.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage reports a 1697 military expedition with Kino and Juan Mateo Mange
