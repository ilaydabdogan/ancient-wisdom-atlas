canonical_text:
  quote: ''
  summary: The passage describes Pima warfare under Apache pressure, the organization
    of defense, and strict lustration rites after killing an enemy. A warrior who
    had killed was secluded for sixteen days, observed taboos, used and buried a scratching
    stick, bathed in the river, fasted, received instruction, and could obtain a hair
    fetish from the slain Apache. The passage also describes victory celebrations,
    warnings about the seriousness of taking life, and women's roles in dancing and
    mourning.
  language: English
  quote_policy: summarized
