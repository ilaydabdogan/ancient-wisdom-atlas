canonical_text:
  quote: ''
  summary: The passage describes Pima coiled basketry materials and finishing methods,
    defines basket bowls, and discusses old-style basket designs including the fret,
    equal-armed cross, spiral/whorl, black-on-white decoration, and claimed relationships
    between basket patterns and Hohokam pottery designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ordinary baskets are made by coiling, with devil's-claw, cat-tail, and willow
    materials prepared as splints; willow and devil's-claw splints are kept in water
    to make them flexible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Basket margins are usually finished with a braided appearance, attributed
    in the passage to advice from a man supposed to have been Papago; rough splint
    ends are later trimmed or broken and stains removed by rubbing with saltbush leaves
    and twigs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Basket bowls are shallow tray- or bowl-shaped baskets ranging from flat disks
    to bowls with rounded bottoms up to 20 cm deep.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When asked the meaning of design elements, basket makers said they did not
    know and that old women made them that way, copying patterns long ago from Hohokam
    pottery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage identifies three common designs on old-style baskets: the fret,
    the equal-armed cross, and the spiral; many other designs are described as modifications
    of these.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fret is described as probably the oldest motive according to the Pimas
    and as leading visually into swastika and suavastika patterns in the illustrations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The flower design based on the cross is said to match designs on Hohokam water
    jars and on water jars made in the present by both Pimas and Papagos; the passage
    contrasts its placement on convex pottery surfaces with its placement on the concave
    interior of baskets.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The cross-based flower design is described as having four radiating black
    arms separating petal-like areas and encircling lines that follow the outline
    around the basket with rectangular enlargements at direction changes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The volute or whorl is described as common in primitive art and especially
    frequent in Southwestern basketry, with angular weaving producing irregular curvature
    and terrace-like enlargements.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Pima basket decoration is mostly black on a white ground, though rare examples
    include brown or other colors, blue glass beads on the border, or open-sided work
    and trinket baskets made for sale.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The plate descriptions give examples of fret designs, an equal-armed cross
    combined with whorl-like broken lines, and a basket combining fret and whorl.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that basket makers prepare no pattern beforehand but develop
    basket designs from a previously conceived mental design.
  category: action
  evidence_refs:
  - ev:12
