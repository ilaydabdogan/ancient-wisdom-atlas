  summary: The passage describes Pima basketry-related objects, sleeping mats, spinning
    and weaving equipment, the decline of textile practice, materials used for thread,
    and a brief mythic note that a grass supplied the son of Corn Woman with bowstring
    material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cradle hoods are included among basketry articles and are described as willow-bark
    strips woven in a simple checker style, attached beneath the baby's head by wrapped
    bundles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sleeping mats were formerly made by the Pimas from cane along the Gila; after
    the water supply became too scant for that plant, Papagos made agave-leaf mats
    and bartered them to the Pimas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sleeping mats are described as having a diagonal weave, a rough wrong side,
    oblique warp and woof splints, and a double border.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Pimas are said no longer to spin and weave, and the art is described as
    dying with the older generation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A model loom was made by Kft'mftl tk&k, who was described as adept in weaving
    but unable to spin; a woman was engaged to spin and removed cotton seeds by beating
    the cotton with a switch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Doctor Palmer obtained a complete loom with sample balls of cotton thread
    from the Pimas in 1885.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sinew from the back and legs of deer was made into thread and used for tying
    cradle bars, shield handles, arrows, ki&hil frames, and tattooing needles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An unidentified grass called &'kivlk by the Pimas was said to have been spun
    into thread in ancient times.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: According to a myth reported in the passage, the grass supplied the son of
    Corn Woman with material for his bowstring.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author states that Pima weaving was simple, mostly abandoned, and less
    developed than that of Pueblo tribes; the author also says the origin of the art
    is unknown and only guesses at possible imitation of Hohokam fabrics.
  category: relationship
  evidence_refs:
  - ev:10
