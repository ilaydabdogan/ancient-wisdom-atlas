canonical_text:
  quote: ''
  summary: Yellow Coyote repeatedly loses games, then arranges a football race in
    which Black Beetle defeats Duck after reporting an auspicious dream. A marriage
    privilege is attached to the contest, but Sandy Coyote acts in bad faith by taking
    a wife. Yellow Coyote later brings Corn Woman as wife. Gambling resumes; Yellow
    Coyote loses his property, then his body and soul, and Sandy Coyote kills and
    eats him. Yellow Coyote's pregnant wife bears a son, flees east with him while
    carrying fire in an olla, and lives in the Superstition mountains. The boy becomes
    a hunter and receives help and equipment from Mountain Lion.
  language: English
  quote_policy: summarized
