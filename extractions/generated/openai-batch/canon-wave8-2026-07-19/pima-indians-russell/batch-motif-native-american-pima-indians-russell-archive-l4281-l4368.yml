canonical_text:
  quote: ''
  summary: Ethnographic passage describing barter among the Pimas, Maricopas, Papagos,
    and other trading partners. It lists goods exchanged at harvest time and gives
    a detailed account of Papago religious pilgrimages to salt lakes below the Mexican
    boundary, including journey restrictions, fourfold circling at a lagoon where
    the Great Spirit resided, ritual collection of sacred salt, and four-day exclusion
    and singing on return before the salt could be eaten or traded.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maricopas formerly lived at Gila Bend and came at harvest time to trade
    with the Pimas; after settling beside the Pimas, barter between them was treated
    as no more significant than exchange between Pima villages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Papagos are described as Pima kinsfolk living in a cactus-plain desert
    environment and bringing a varied list of vegetable, animal, and mineral products
    to the Gila at the June harvest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Papago trade goods included cactus and agave products, seeds, baskets, mats,
    fiber, dried meats, tallow, buckskins, human hair cords, ochers, and buff used
    by Pima weavers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Papagos made religious pilgrimages to salt lakes below the Mexican boundary
    to obtain sacred salt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the salt journey, the travelers lived on pinole and walked with their
    eyes fixed on the trail, not looking to either side.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the lagoon where the Great Spirit resided, the salt gatherers ran at top
    speed and circled the salt deposits four times before ritual specialists began
    collecting salt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The salt was said to retain magic power on the return journey; if a horse
    died, the entire load of salt was discarded.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the salt gatherers approached the home village, they received a noisy
    welcome but had to remain outside for four days; people at home sang for them
    for four days, after which the salt could be eaten and brought to the Pimas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Pimas sometimes made their own journeys to the salt lake, described as
    two days to Quijotoa and two further days beyond.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In exchange for goods brought to them, the Pimas gave wheat, corn, beans,
    mesquite products, cotton blankets and fiber, dried squash, pumpkin, melon, and
    basketry materials; wheat was also given to Papagos for help with harvesting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Later trade included colored earths and salt with once-hostile groups, long-distance
    armed trade through Apache territory to Sonora, visits from Spanish and Mexican
    trading parties, American traders after about 1850, and reservation stores.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some Pimas were described as attempting to deceive traders with damp wheat,
    sand hidden in wheat sacks, or inferior wheat concealed beneath better wheat.
  category: action
  evidence_refs:
  - ev:7
