canonical_text:
  quote: ''
  summary: Coyote sleeps while quails cut fat meat from him. The quails cook the meat
    and give some to Coyote, later telling him that he has eaten his own meat. After
    realizing his injury, Coyote pursues the quails. The quails enter a hole behind
    a cholla cactus branch covered with feathers. Coyote releases each quail after
    questioning them, then mistakes the silent cactus branch for the guilty one, bites
    it, and dies.
