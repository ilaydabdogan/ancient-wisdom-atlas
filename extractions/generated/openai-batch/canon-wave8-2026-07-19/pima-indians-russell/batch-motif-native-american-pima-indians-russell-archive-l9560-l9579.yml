  quote: ''
  summary: The passage reports Pima views that death is not natural but caused by
    magic, enemies, animals, ritual neglect, or the actions of Sun and Night. It summarizes
    a legend in which the first death comes from the venom of Soft Child, the rattlesnake,
    who received the power of death for self-protection. It also notes a view that
    a previous race became overcrowded because no one died.
