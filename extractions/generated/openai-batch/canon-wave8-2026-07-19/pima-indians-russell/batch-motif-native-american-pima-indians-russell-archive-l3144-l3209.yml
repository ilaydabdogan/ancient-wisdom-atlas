literal_observations:
- id: obs:1
  text: The fruit of the giant cactus or saguaro is gathered in June, and the harvest
    marks the beginning of the new year in the Pima calendar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saguaro seeds and dried fruit may be preserved; seeds that passed through
    the body are sometimes gathered from dried feces, washed, and treated like seeds
    taken directly from the fruit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ripe saguaro fruit is eaten without preparation; it is described as crimson
    and containing many black seeds about the size of fig seeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boiling and fermenting fresh saguaro fruit produces an intoxicating liquor
    that the passage says was highly esteemed and made the new-year season one of
    debauchery.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Saguaro fruit is dried in large balls; syrup is extracted by boiling fresh
    or dried fruit, and the residue is ground on a metate into an oily paste.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saguaro seeds may be separated from pulp, eaten raw, ground into meal, mixed
    with water as pinole, or combined with other meal for bread.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yucca fruit is boiled, dried, ground, and boiled with flour; it is also eaten
    raw as a cathartic, and yucca stems are used as soap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Corn is described as less valuable to the Pimas than wheat in recent years;
    women bring husked corn, which is roasted over burning brush, cut from the cob,
    dried, and stored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A diary excerpt reports Pima feasting, singing, shouting, and drunkenness;
    the Pima governor says such excess happens only a few times, in the saguaro season,
    and says it makes people vomit yellow and keeps them healthy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same diary excerpt says no women became drunk and describes women leading
    the horses of intoxicated husbands and gathering scattered clothes and beads.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A quoted description of California pitahaya months describes feasting, dancing,
    entertainments of neighboring rancherias, buffooneries, comedies, and actors selected
    for imitation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another quoted description says the pitahaya harvest is treated as the harvest
