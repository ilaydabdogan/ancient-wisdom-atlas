  text: The work included repeated house-to-house canvassing of villages and visits
    to the Salt River Pimas and desert Kwahadk's.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: More than 300 specimens illustrating Piman arts were collected, and the author
