  text: The writer made headquarters at Sacaton on the Gila River reservation in southern
    Arizona from November 1901 to June 1902 while studying the Pima tribe.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Information was obtained with the aid of five native interpreters from ten
