canonical_text:
  quote: ''
  summary: The passage describes Pima clothing materials and changes across periods,
    including bark garments, deerskin, sandals, cotton blankets, rabbit-skin blankets,
    Mexican-influenced garments, and later purchased clothing. It also describes personal
    decoration and hair practices, including painted skin, feathers, beads, long male
    hair, braided hair skeins, headbands, earlock ornaments, and mourning-related
    restrictions or hair cutting.
  language: English
