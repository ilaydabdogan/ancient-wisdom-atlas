literal_observations:
- id: obs:1
  text: 'The passage divides Pima clothing history into four periods: use of minimally
    modified natural products, adoption of native textiles, imitation of Mexican costumes,
    and purchase of plain serviceable clothing from whites.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In primitive times men wore breech-cloths and women wore knee-length kilts
    made from the soft inner bark of willow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During cold nights men wore deerskin shirts; on stony trails they wore red-dyed
    deerskin moccasins; at home both sexes wore rawhide sandals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After weaving was adopted, cotton blankets were worn in winter and also by
    women in summer, with the blanket girded around the waist.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says cold winds blew from sacred caves, and the blanket's outer
    fold could be drawn around the neck for protection.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A widow was not permitted to raise the blanket above the armpits during the
    mourning period.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A blanket could be converted by men into baggy trousers by looping a cord
    from the rear girdle between the legs and up in front.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some people who were poor or who lost goods through gambling returned to bark
    garments; rabbit skins could also be cut into strips and braided into winter blankets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the Spanish and Mexican regime the sombrero, a sleeveless chemise,
    and improvised mantillas were adopted to varying degrees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In summer heat, older men stripped to the breechcloth when around their homes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that contemporary Pimas were adopting adornments from neighboring
