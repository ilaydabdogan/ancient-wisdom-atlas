canonical_text:
  quote: ''
  summary: 'The passage recounts a missionary and military party''s visit to San Juan
    Capistrano de Uturituc among the Pimas/Gileños: masses are said, local people
    receive the visitors ceremonially, a cross is placed before their lodging, women
    dance, some children are offered for baptism, fields and irrigation works are
    observed, gifts are distributed, and a later historical note describes early American
    beaver trappers finding the Pimos Gileños friendly.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator reports saying mass, attended by some Gileños Indians who imitated
    Christian gestures such as crossing themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visiting party traveled from the Laguna to San Juan Capistrano de Uturituc.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The town is described as consisting of small lodges, and the narrator estimated
    about one thousand people there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inhabitants received the visitors in two rows, with men on one side and
    women on the other, then came in turn to salute them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The salutation included touching the breast with the hand, naming God, and
    saying a phrase translated in the passage as 'May God aid us.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hosts lodged the visitors in a large hut constructed for them and placed
    a large cross in front of it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Governor ordered his wives to bring water from the river to his lodge
    for the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After permission was sought from the Commander, women danced from mess to
    mess with hands clasped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Some inhabitants offered their little ones to be baptized, but the visiting
    fathers did not perform the baptisms at that time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator observed fields enclosed by stakes and cultivated in sections
    with five canals or draws near the river.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The river was low, and the passage says this prevented water from entering
    the canals for sowing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The inhabitants had considered holding a council and sinking stakes and branches
    into the river to raise the water so it could enter the drains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The narrator saw cotton cloaks being woven and notes cotton spinning, sheep
    with wool, and Castilian fowl.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Commander distributed tobacco, beads, and glass trinkets, and the recipients
    were pleased.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: On All-Souls day the religious visitors erected two altars and said nine masses,
    attended by many Indians with silence and decorum.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A later historical paragraph says several American parties reached the Pimos
    Gileños and found them uniformly friendly.
  category: relationship
  evidence_refs:
  - ev:10
