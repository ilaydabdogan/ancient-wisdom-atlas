candidate_motifs:
- id: motif:1
  label: night fire exposes a solitary person and triggers communal alarm
  taxonomy_refs: []
  basis: The irrigator's warming fire is seen by Apaches; after noticing their approach,
    he warns the village, leading to a collective counteraction.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is presented as a calendar event rather than a mythic episode; no
    symbolic meaning is explicitly assigned to the fire.
- id: motif:2
  label: ambush, captive taking, and later retaliation
  taxonomy_refs: []
  basis: The Pimas are ambushed while returning from Tucson, suffer deaths and a captive,
    and later take revenge on Apache horse raiders.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The link is chronological and retaliatory in the passage, not framed as
    a mythic revenge cycle.
- id: motif:3
  label: public punishment of a captive by bereaved women
  taxonomy_refs: []
  basis: Slender Leg is taken to a public place where people dance and sing; widows
    of earlier victims circle the dancers and beat him with mesquite clubs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not state whether the action is ritual, legal, ceremonial,
    or spontaneous; extraction should remain descriptive.
- id: motif:4
  label: formalized combat with agreed weapons and repeated approach
  taxonomy_refs: []
  basis: A Yuma messenger proposes fighting only with sticks; four men from each side
    are to fight with sharp sticks, and squads make four semicircular approaches before
    battle.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The formal rules are described for a historical battle; no broader ceremonial
    interpretation is supplied.
- id: motif:5
  label: warrior refuses weapon restriction and survives through retained weapon
  taxonomy_refs: []
  basis: The accompanying Pima refuses to relinquish his bow and arrows and later
    kills many with arrows and escapes; Maricopa Antoine also keeps his bow and arrows
    and escapes.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The two cases are parallel but not explicitly identified as a traditional
    motif by the passage.
- id: motif:6
  label: single combat or champion action before general battle
  taxonomy_refs: []
  basis: Earth-crack challenges a Yuma to single combat in one battle; in the autumn
    battle, chiefs exchange speeches and fight personally before general fighting
    begins.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage supplies two related battle episodes but does not generalize
    them into a rule or mythic pattern.
- id: motif:7
  label: signal smokes gather or coordinate enemy force
  taxonomy_refs: []
  basis: Apaches being pursued send up signal smokes; by the next morning their number
    has increased and they attack in a circular line.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage implies coordination but does not explicitly explain who saw
    the smokes or how reinforcements arrived.
- id: motif:8
  label: fourfold circumambulation or approach before violence
  taxonomy_refs: []
  basis: Widows walk four times around a circle before beating the captive; in another
    event, combat squads make four semicircular approaches before fighting.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The recurrence of four is literal, but the passage does not state that
    the number has symbolic significance.
