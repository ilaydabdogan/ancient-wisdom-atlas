canonical_text:
  quote: ''
  summary: 'Chronological Pima calendar entries recount conflicts from about 1838
    to 1842: an Apache approach discovered because of a fire, an ambush of Pimas returning
    from Tucson, revenge on Apache horse raiders including the capture and beating
    of Slender Leg, two years without recorded events, Maricopa and Pima campaigns
    against Yumas with formalized combat rules and named fighters, an autumn Yuma-Maricopa
    battle with war-chief combat, and an allied campaign against Apaches who use signal
    smokes and a circular line.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pima irrigating a wheat field by moonlight built a fire, which was seen
    by Apaches; after hearing twigs crack, he ran to the village and gave an alarm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pimas gathered in sufficient numbers to surround the Apaches; some Apaches
    fleeing on horses were killed after horses stumbled into a gully, and the others
    were followed and killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A party of Pimas returning from Tucson was ambushed by Apaches; two men were
    killed and a boy was captured, though the Pimas repelled the attack enough to
    escape.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later Apache horse-stealing party was chased; an Apache called Slender Leg
    was pushed from his mule, overpowered, tied, and taken to a gathering place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People gathered and danced and sang around Slender Leg; two widows walked
    four times around the outside of the dancers' circle, entered, and beat him with
    long mesquite clubs until he was insensible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that no events were recorded for two years on either of
    the two calendar sticks that extended back that far.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: During a Maricopa campaign against the Yumas, a Yuma messenger proposed that
    both sides set aside knives and bows and fight only with sticks; the accompanying
    Pima refused to give up his bow and arrows.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Four fighters from each side were to engage with sharp sticks about six feet
    long, and each squad ran four semicircular approaches before combat began.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Named Maricopa fighters rode through or challenged Yuma lines, while the accompanying
    Pima and Maricopa Antoine used bows and arrows and escaped.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In an autumn battle, Yumas and Maricopas formed opposing lines; the war chiefs
    exchanged invitations to strike, a personal combat followed, and the Yuma opponent
    was killed before general fighting began.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mohave Apaches fighting with the Yumas used bows and arrows and deserted when
    the Yuma line wavered; after the fight, a Yuma chief told the Mohaves not to scalp
    the dead until Yuma bodies had been gathered.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In a later campaign, Maricopas, Pimas, and Cocopas pursued Apaches who sent
    signal smokes; the next morning the Apaches had increased in number, formed a
    circular line, and attacked, killing two men described as father and son.
  category: sequence
  evidence_refs:
  - ev:10
