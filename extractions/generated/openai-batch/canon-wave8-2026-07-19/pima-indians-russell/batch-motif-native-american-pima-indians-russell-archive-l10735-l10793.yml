canonical_text:
  quote: the first fire drill was made
  summary: After Rabbit's death, the people fear Coyote's interference with the body
    and arrange to burn it while sending Coyote away for fire. Blue Fly makes the
    first fire drill and the corpse is burned. Coyote returns, breaks through the
    circle around the fire, takes the heart, and flees, leaving etiological traces
    in named places and mountains. An embedded note gives a parallel Mohave cremation
    episode involving Matyavela, Mustam-ho, Blue Fly, Coyote, and the theft of a heart.
  language: English
  quote_policy: quoted
