canonical_text:
  quote: ''
  summary: 'The passage describes Pima stone implements and related practices: mullers,
    pestles, axes, arrowheads, arrow-shaft straighteners, hammer stones, firestones,
    and crystals. It notes that many objects were obtained from ruins, that some Pimas
    attributed ax material to an underworld origin connected with Elder Brother leading
    nether-world people upward, and that crystals and unusual stones were kept in
    medicine-men''s outfits.'
