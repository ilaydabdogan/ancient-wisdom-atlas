canonical_text:
  quote: ''
  summary: 'A mother tells two boys about an eagle belonging to them. The boys go
    to the place of the eagle. The younger brother tries first to climb up for the
    birds but cannot; the older brother climbs and brings the birds down. The younger
    brother takes the older bird, and the brothers quarrel because the older brother
    says the younger should take the younger bird while he takes the older one. The
    younger refuses to give up the older bird because he took it first. The passage
    ends with brief labels: club and shield.'
