canonical_text:
  quote: ''
  summary: The passage summarizes two tale units. In “Children of Cloud,” twin boys
    born from Cloud and a beautiful mat maker seek their father, meet Wind and Cloud,
    undergo weather tests, return home, encounter several animal figures, avoid Coyote,
    and are transformed into mescal. In “Skull and His Magic,” a figure who is a man
    at night and Skull by day marries a maiden who refused other suitors, succeeds
    as a hunter because deer die at the sight of him, and wins a football race.
  language: English
