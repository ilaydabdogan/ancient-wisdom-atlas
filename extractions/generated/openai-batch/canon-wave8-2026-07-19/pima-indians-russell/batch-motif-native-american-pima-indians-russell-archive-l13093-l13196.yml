canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Pima treatments for sickness: repeated
    curative songs, pressing or waving animal parts or images, ritual sucking out
    of evil, rubbing ashes or burning cotton on the skin, Si''atcokam treatment roles
    and payment obligations, accusations that medicine-men cause disease, countermeasures
    involving magic stones in water and charm searches, and animal-specific disease
    causes and remedies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the cause of an affliction is decided, songs of the relevant animal
    or object are sung repeatedly; an image or part of the animal or object is pressed
    upon or waved over the affected part, followed by a performance of sucking out
    the evil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juan Thomas told the writer that he had concealed objects under his thumbnail
    and pretended to suck them from patients.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ashes may be rubbed lightly on the skin of a sick person, and cotton pledgets
    may be burned on the skin for any disease.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Female Si'atcokam are described as not treating children and as confining
    their work to abdominal troubles; men treated women for all diseases.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Payment is promised to the Si'atcokam when called in, and the death of the
    patient does not annul the obligation, though full payment may depend on the contracted
    singing being completed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Diseases are attributed to animals, birds, reptiles, superhuman causes, and
    sometimes to rival medicine-men accused of causing disease.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: For individual malice by a medicine-man, the treatment is to sing the medicine
    song, place four magic stones in a cup of water, hold them under the patient's
    nose so the patient inhales their power, and then have the patient drink the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When a hidden charm is suspected, another doctor with four assistants searches
    day and night for an object; once found, it must not be touched, but its discovery
    is said to render it harmless.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A medicine-man is said sometimes to cause sickness by shooting charcoal made
    from the burned body of an enemy into someone; if the charcoal is sucked out before
    it is consumed, the patient recovers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The badger, bear, and black-tailed deer are each linked to particular ailments
    and to remedies involving their songs and, for badger and deer, animal tails pressed
    on affected areas.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The coyote, dog, and gopher are each linked to childhood ailments, with remedies
    involving animal-specific songs and materials such as tails, vibrissas, sticks,
    gopher-hill earth, or small bags containing down and gopher-cut twigs.
  category: relationship
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:12
  text: The jack rabbit, mouse, and ground squirrel are linked respectively to open
    sores, constipation in children, and nosebleed; rabbit and mouse remedies involve
    the relevant song and tail or body material.
  category: relationship
  evidence_refs:
  - ev:14
  - ev:15
