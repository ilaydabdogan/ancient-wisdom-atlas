canonical_text:
  quote: ''
  summary: The passage records Pima-Maricopa conflict with Yumas near a river, including
    war songs, smoke ritual, encirclement, denial of water, mass killing, and one
    survivor. It also summarizes Blackwater and Gila Crossing calendar entries concerning
    Apache conflict, a meteor, a plague attributed to magic, killed medicine-men,
    trader events, and the capture of Ammi M. White.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yumas were encamped near a river at a place associated with an earlier assault
    on women and the killing of a Pima who defended them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yumas sang war songs during the night, and a medicine-man periodically
    puffed smoke so that their cause might find favor with the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Pima-Maricopa council decided to surround the Yumas and make special effort
    to keep them from reaching the river for water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pimas and Maricopas formed a semicircle and shot at the Yumas from three sides.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Yumas became weakened by thirst and heat, made several failed attempts
    to break through, and finally gathered for a last attempt to reach the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mounted Pimas and Maricopas rode into the Yumas; after hand-to-hand combat,
    all Yumas were killed except one stunned man who later regained consciousness
    and escaped.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Blackwater entry reports Pimas killed by Apaches in two places, with a note
    clarifying that a figure represented two places rather than two deaths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Pimas observed the meteor of 1859 and called it pai-ikam ho-o.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Blackwater annalist had little information about the Yuma victory but
    recorded it on the calendar stick with a fringed line described as meaningless
    in itself.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: A later Blackwater entry says Pimas attacked Apaches, killed a man and a boy,
    and a white man accompanying the Pimas was slightly wounded by an arrow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Gila Crossing entry reports a plague that killed victims in a single day;
    three medicine-men suspected of causing the disease by magic were killed, after
    which the passage says nobody was sick any more.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A one-armed trader sold his store to Ammi M. White and threw away grain sacks;
    another entry says Ammi M. White was captured by soldiers from the east.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:13
- id: obs:13
  text: Footnotes cite outside accounts describing the same large battle involving
    Yuma-allied groups against Pimas, Maricopas, and Papagos, with heavy losses among
    the Yuma side.
  category: other
  evidence_refs:
  - ev:5
