candidate_motifs:
- id: motif:1
  label: Raid followed by retaliatory pursuit or counterattack
  taxonomy_refs: []
  basis: Several events begin with Apache, Yuma, or Yuma-Mohave raids, ambushes, or
    thefts and continue with Pima or Pima-Maricopa pursuit and killing of attackers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:7
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a historical-calendar pattern rather than a clearly mythic narrative
    motif.
- id: motif:2
  label: Hill, butte, or mountain as refuge and battle point
  taxonomy_refs: []
  basis: Attackers repeatedly retreat to or are encountered at elevated places, including
    a hill near Tempe, a nearby hill after the Yuma raid, Santan hills, Rincon mountains,
    and Tempe butte.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:7
  - ev:11
  confidence: high
  cautions: Although the literal settings match elevated terrain, the passage does
    not present them as cosmic or sacred mountains.
- id: motif:3
  label: Concealment and forced emergence
  taxonomy_refs: []
  basis: An Apache fugitive hides in a sand hole; Pimas use live coals to force him
    out, and his sudden appearance allows him to escape.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif is based on one episode only.
- id: motif:4
  label: Warrior final stand or refusal to flee alone
  taxonomy_refs: []
  basis: A Yuma chief returns after most of his men have fallen, says he does not
    wish to escape alone, carries only a knife, and is killed by arrows.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage records the incident without extended heroic interpretation.
- id: motif:5
  label: Fire in warfare and funerary handling
  taxonomy_refs: []
  basis: Fire appears in burned dead, Pimas burning their dead, live coals used against
    a hidden fugitive, and a burned village.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage does not state a ritual meaning for all uses of fire; some
    are tactical or destructive.
- id: motif:6
  label: Compelled captive guide
  taxonomy_refs: []
  basis: Yumas and Mohaves spare one Maricopa woman from an initial killing to act
    as guide, compel her to lead them to her brother's home, and then kill her.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: Single episode; no broader comparative claim is made.
- id: motif:7
  label: Trophy-taking from fallen enemies
  taxonomy_refs: []
  basis: A strand of hair is cut from the head of each fallen Yuma after the battle.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The later fate and meaning of the hair strands are not explained beyond
    being lost or buried.
comparison_claims: []
