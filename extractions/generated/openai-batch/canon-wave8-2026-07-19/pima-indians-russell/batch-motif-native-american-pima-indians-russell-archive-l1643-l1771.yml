canonical_text:
  quote: ''
  summary: The passage records a sequence of Pima calendar events from about 1850
    through 1858 involving Apache, Yuma, Mohave, Maricopa, Papago, Pima, and white-soldier
    encounters. Recurrent incidents include raids on villages, horse stealing, ambushes,
    pursuits to hills or buttes, killings, wounded or burned dead, hair trophies from
    fallen Yumas, a fugitive Apache flushed from a sand hole with live coals, and
    a Yuma-Mohave attack on Maricopa women and village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three Apaches approached the villages, fled to a hill near Tempe, built a
    stone wall, and were killed after a Pima-led party entered the breastwork.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yumas attacked a Maricopa village, killed several people, carried property
    to a nearby hill, and sang and danced while waiting for Maricopas and Pimas to
    come against them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pimas put the Yumas to flight; a Yuma chief returned with only a knife
    and was killed with arrows; the remnant of the party was killed in a thicket.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A strand of hair was cut from each fallen Yuma, and the passage reports 134
    Yumas killed with no Pimas killed in that fight.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Whyenananavim, a Maricopa warrior, discovered two Apaches near the Maricopa
    village and killed one before they escaped.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Pimas made a campaign against Apaches on Salt River, where one Pima was
    killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Apaches raided a Papago village near Quijotoa called Kol Tatk, glossed as
    mesquite root.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near a hill shaped like a nose in the Santans, Apaches killed some women near
    the Maricopa village, lured Pima and Maricopa pursuers, and killed four Maricopas
    and one Pima in ambush.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dead from the Santan ambush were burned that day north of the Santan hills.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Pimas killed four Apaches south of the villages and later killed four more
    north of the Santan hills when the wheat was ripe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Apaches came to steal horses and brought a live vulture with them; they were
    discovered and several were killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Papagos reported Apache horse stealing and requested Pima aid; the horse thieves
    were overtaken in the Rincon mountains and many were killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A horse's head on the Blackwater stick is explained as indicating the purpose
    of the Apaches in the horse-theft event.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: One Apache fugitive hid in a deep sand hole; Pimas shook live coals down on
    him, causing him to yell and leap out, and he escaped after startling those around
    him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: During an Apache raid, arrows began falling into an Apache camp where people
    were grinding mesquite beans, and a blind Apache was killed as the others fled.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Pimas and Maricopas joined white soldiers in a campaign against Apaches under
    White Hat; Pima dead were burned, and later Pimas killed Apaches raising corn
    on Salt River.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A band of Apaches was chased about 30 miles to Tempe butte, hid at the summit,
    and all were killed except one who escaped into brush.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: Yumas accompanied by Mohaves killed Maricopa women gathering mesquite beans,
