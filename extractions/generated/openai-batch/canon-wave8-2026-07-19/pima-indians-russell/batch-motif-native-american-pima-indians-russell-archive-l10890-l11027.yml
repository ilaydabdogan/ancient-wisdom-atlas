canonical_text:
  quote: ''
  summary: Vantre is induced to drink pinole at a pool and becomes a large eagle.
    The eagle preys on people from a mountain refuge until Elder Brother/Earth Doctor
    enters his cliff house, kills him and his son, revives the dead with their blood,
    and establishes rules for conduct after killing an enemy. A final Casa Grande
    episode tells of a green lizard, rainbow-green earth, and green stones used for
    ornaments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elder Brother tells a young woman to go to the pool with water vessels and
    prepare pinole when Vantre goes there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vantre tells the young woman he wants her for his wife, and she says she will
    not promise unless he drinks her pinole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Vantre takes a fourth drink, feathers appear on his body and he becomes
    a large eagle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The people take bows and arrows to the pool, find the eagle on the bank, and
    surround him; he flies away to the mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: From his mountain refuge, Eagle repeatedly carries away men and women, causing
    the people's numbers to decrease.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Elder Brother says he will kill the eagle after four days and gives the people
    a cloud sign beside a sharp-pointed mountain to indicate the outcome.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Eagle is described as so large and strong that sitting on the mountain top
    breaks it into peaks and rough places, and he catches arrows shot at him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Earth Doctor/Elder Brother climbs the cliffs to Eagle's house and questions
    Eagle's wife about whether Eagle can be made to sleep by head-scratching.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Eagle returns with a roar, brings four living men, throws them on the rock,
    and they die there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Earth Doctor conceals himself among the dead bodies in the form of a fly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Eagle's wife whistles after Eagle falls asleep, and Elder Brother comes out
    and resumes his natural form.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Elder Brother beats Eagle's head flat, cuts the throats of Eagle and his son,
    and sprinkles their blood on the dead bodies, who regain life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The revived people are sent home; those who speak a different tongue are sent
    to a distant land and are identified in the passage as whites.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Elder Brother tells the people how to conduct themselves after killing an
    enemy and arranges four periods of four days; the killer must live sixteen days
    in the woods and subsist on pinole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At Casa Grande, while women play takal, a strange little green lizard drops
    before a chief's daughter, the earth becomes green like part of a rainbow, and
    green stones are found and used for necklaces and ear pendants.
  category: sequence
  evidence_refs:
  - ev:7
