- id: motif:2
  label: women hidden in a cave during attack
  taxonomy_refs: []
  basis: During the Kihotoak attack, Papago women are concealed in a cave while defenders
    fight outside to protect them from slavery.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The cave is a literal refuge in the account; no additional symbolic meaning
    is stated.
- id: motif:3
  label: female captives rescued after pursuit
  taxonomy_refs:
  - stolen_beloved
  basis: Two girls are taken prisoner after an Apache ambush, then rescued when a
    village party pursues the attackers and kills most of them; the Kihotoak scene
    also describes defenders trying to protect loved ones from slavery.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: medium
  cautions: 'The taxonomy reference is approximate: the passage concerns wartime captivity
    and rescue, not a romantic spouse or explicitly mythic beloved.'
- id: motif:4
  label: plague blamed on ritual specialists
  taxonomy_refs: []
  basis: During the black-vomit plague, medicine-men not in good repute come under
    suspicion, four are killed, and surviving medicine-men guard camps against the
    disease.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports social suspicion and ritual guarding without explaining
    a theological cause.
