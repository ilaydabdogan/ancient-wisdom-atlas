canonical_text:
  quote: ''
  summary: 'The passage records Pima calendar events involving Apache, Yuma, Mohave,
    Maricopa, Papago, and related groups: raids during food gathering, attacks on
    villages, plague and suspicion of medicine-men, women hidden in a cave during
    an attack, thefts of corn and horses, pursuit and retaliation, captives rescued,
    and individual escapes and casualties.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pima woman and her daughter went to gather cactus fruit, accompanied by
    the woman's husband as a guard; after the woman saw an Apache, the daughter ran
    to give the alarm, but the village men found no trace of the enemy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apaches attacked a Pima party gathering mescal in the mountains; only one
    person escaped to inform the Kwahadk's, who followed the trail and buried the
    dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large Yuma force advanced against Pimas and Maricopas; messengers announced
    their coming, Maricopas checked the advance while women moved away, and two Maricopa
    warriors were lost.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the following year, Yumas and Mohaves attacked a Maricopa village at Salt
    River; the fight was undecided, the attackers retreated, and Pima and Maricopa
    casualties are reported.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A plague called "black vomit" swept through the tribes, causing rapid deaths;
    medicine-men came under suspicion, four were killed, and surviving medicine-men
    guarded camps against the plague.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: During winter, with ice and snow present, Apaches came to the village of Rstotlk,
    where one marauder was killed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Apaches, accompanied by the Pas)^i4 tribe from the north, attacked Papagos
    at Kihotoak; the Papagos hid their women in a cave and fought outside, but the
    defenders fell while trying to protect their loved ones from slavery.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Two Apaches came from a camp on Mo'hattlk mountain to steal corn from fields
    at Gila Crossing; three Pimas lay in wait and killed one thief while the other
    escaped.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pimas campaigned against Apaches in winter, making night attacks in which
    several Apaches were killed before they could defend themselves; one Pima was
    killed and one later died of wounds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Apaches waylaid Pimas returning from a mescal-gathering expedition; nearly
    all were killed, two girls were taken prisoner, and a village party pursued the
    Apaches, killed most of them, and rescued the girls.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A Pima found the trail of three Apaches near the Gila River and a party pursued
    and killed all three; later, Pimas were lured into an ambush in the Santan hills,
    where Pima casualties and wounds are reported.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Pima Kwakrs&n was surrounded by enemies clinging to him and his horse;
    he used spurs to make the horse rear, throwing the man holding its head, and escaped
    in the confusion.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: On a moonlit night, Apaches came to steal horses, left their own mounts in
    brush, crept toward Pima ponies, were discovered, pursued to the river, and all
    were killed in a running fight.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Rs&ntlk villagers went to K&'matflk to hunt deer and were ambushed by Apaches
    at a spring; later, Apaches killed four Pimas at Santan and were chased until
    five Apaches were killed.
  category: sequence
  evidence_refs:
  - ev:14
