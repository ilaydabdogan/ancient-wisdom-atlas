literal_observations:
- id: obs:1
  text: California troops, called the California Column, moved eastward by the Gila
    route toward Tucson, and only advance parties came into contact with Confederates.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A skirmish at El Picacho involved Lieutenant James Barrett and men pursuing
    a Confederate detachment; Barrett and two of his men were killed, and some opponents
    were killed or captured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Both the Gila Crossing and Blackwater calendars mention the capture of White,
    a trader and Pima agent, but the calendrists could not give definite information
    on the broader military events.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: After White was taken away, the Pimas took possession of his store and quarreled
    over the distribution of wheat stock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blackwater account says Thomas took charge of White's store, mentions
    soldiers from west and east fighting at Picacho, and names Has Viakam and John
    Walker as traders or arrivals known to the Pimas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men from Rsotuk went into the mountains near Prescott looking for Apaches
    and found a sleeping man whose identity was uncertain until he awoke and was recognized
    as Apache.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The awakened Apache was struck on the head with a club and then shot when
    he tried to escape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two Apaches came near Akatchiny; two Pimas discovered their trail while hunting
    horses and pursued them toward the Estrellas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the pursuit, one Apache turned back to fight, wounded a Pima, and was
    killed when the second Pima arrived.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two Maricopas dragged the dead Apache's body to a hill near Gila Crossing
    and tied it to a post.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A friend of the dead Apache led a party to the place of death, followed the
    trail to the tied body, wept, and left without removing it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The returning Apache party entered an isolated house with two old Maricopa
    men, warmed themselves at the fire, and did not harm the old men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a Salt River account, two Apaches came near the villages; one turned back
    to defend the other and was killed, while the other escaped.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Salt River account, Maricopas dragged the body to buttes near the later
    Maricopa and Phoenix railroad crossing and tied it to a post; an Apache recovery
    party turned back before reaching the place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A Pima was killed by Apaches while the California Column was at the villages,
    and soldiers accompanied a Pima pursuit party as far as the Estrellas, but the
    enemy escaped.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The raid was dated to the saguaro fruit season by reference to red on the
