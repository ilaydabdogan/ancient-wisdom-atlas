  summary: The passage reports historical and calendar entries concerning the California
    Column, a skirmish at Picacho, the capture of a trader named White, subsequent
    Pima interest in his store, and several Pima, Maricopa, and Apache conflict episodes,
    including pursuit, killing, display of a body tied to a post, attempted recovery,
    and the killing of two medicine-men accused of harmful actions.
  language: English
