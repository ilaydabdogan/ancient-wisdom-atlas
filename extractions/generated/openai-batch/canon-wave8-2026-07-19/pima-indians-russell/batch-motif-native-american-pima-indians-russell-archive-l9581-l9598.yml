canonical_text:
  quote: ''
  summary: 'The passage describes Pima burial practices: friends flee from a dying
    person at the moment of death to avoid dangerous magic; near relatives cover and
    bind the corpse; earlier burial involved litter transport and shallow graves covered
    with timbers from the deceased’s structures; current burial uses a round hole
    with a west-side chamber, a south-oriented head placement, and protective wood;
    medicine-men are buried sitting and sometimes in isolated places that become specially
    sacred.'
