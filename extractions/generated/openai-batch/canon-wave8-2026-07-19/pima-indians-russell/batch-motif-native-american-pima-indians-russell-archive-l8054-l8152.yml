canonical_text:
  quote: ''
  summary: The passage describes Pima musical instruments including cocoon, turtle-shell,
    and hoof rattles; communal dancing with song, basket drum, rattle, painted bodies,
    food, and feasting; annual saguaro harvest festivals centered on preparation and
    drinking of navait; and the Name song, a festival and charity device in which
    visitors assume residents' names and receive food through a ritualized chase and
    presentation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cocoon rattles are described as moth cocoons with outer coverings removed
    and gravel sewn inside; two strands contain 70 and 66 pairs, and their rustling
    is compared to a rattlesnake warning.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Stu'aton Flats a turtle-shell rattle is reported as still used in treating
    "turtle disease," although no specimen was seen.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hoof rattles, usually made of dewclaws, are described as widely distributed
    among American Indians and formerly common among the Pimas, though absent at the
    time of observation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dancing was performed by both sexes and accompanied by song, basket drum,
    and rattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dancers stood in a circle with arms extended across adjoining dancers' shoulders;
    movements were limited to stamping the feet and bending the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When food was plentiful, dances could occur at any time; they lasted all day,
    with painted bodies and faces, women bringing food, and dancing and feasting proceeding
    without interruption.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Saguaro harvest festivals were annual unless fruit failed, and centered on
    preparing and drinking navait or saguaro liquor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Saguaro fruit syrup was boiled for two days while people gathered and danced
    near large simmering ollas; during the final carousal all men and some women became
    intoxicated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the saguaro liquor custom was being suppressed or discouraged
    by government prohibition, missionaries, native police, tribal advocates, and
    prudential concern about Apache attack during intoxication.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The Name song is described as a social device combining organized charity
    and festival: a food-scarce village visits a village with plentiful crops, learns
    residents'' names, and arranges them in a song of seventy stanzas with two names
    per stanza.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Each visitor assumes a resident's name for the day as a seal of fellowship;
    when a name is sung, women run and pursue in a ritualized chase that leads to
    presentation of corn, wheat, beans, or other foodstuffs as the value of the name.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
