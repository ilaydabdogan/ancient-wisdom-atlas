comparison_claims:
- id: claim:1
  claim: The Pima runner's hair ornament is presented as visually analogous to Yuma
    ornaments and, indirectly, to the “eyes” of the Huichols.
  claim_level: visual_similarity
  target: Yuma hair ornaments and Huichol “eyes”
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage asserts resemblance but supplies little comparative description
    and does not explain function or meaning in the Yuma or Huichol cases.
- id: claim:2
  claim: The passage links Pima artifact design more with California tribes than with
    Pueblos on the basis of poverty of design and absence of symbolism.
  claim_level: visual_similarity
  target: California tribes rather than Pueblos
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:14
  confidence: low
  limitations: This records the author's comparative inference; the passage gives
    no California or Pueblo examples, and it also notes later copying from Hohokam
    relic ornamentation.
- id: claim:3
  claim: Pima belts made after the introduction of bayeta are described as closely
    copying ornamentation from Hohokam relics and southern congeners.
  claim_level: visual_similarity
  target: Hohokam relic ornamentation and southern congener designs
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not identify the copied designs or the southern groups
    in detail.
- id: claim:4
  claim: The passage argues against Pima descent from the Hohokam by contrasting Pima
    metates and treatment of polished axes with Hohokam symmetry and polish.
  claim_level: common_inheritance
  target: Pima descent from Hohokam
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:14
  confidence: low
  limitations: This is the author's historical argument, not an independently demonstrated
    conclusion; the same passage also reports Pima copying of Hohokam relic ornamentation
    in later belt-making.
