canonical_text:
  quote: ''
  summary: Ethnographic discussion of Pima personal ornaments, including beads, pendants,
    bracelets, feather adornment, nose piercing, race hair ornaments, and women's
    coronets; followed by an assessment of ornamentation on implements, weapons, and
    textiles, with comparisons to Yumas, Huichols, Hohokam, California tribes, and
    Pueblos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Both sexes, especially men, are described as wearing strands of beads from
    ear lobes and necks; beads, gorgets, pendants, and bracelets were made from seashell,
    stone, bone, deer bone, and turquoise.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men wore a soft coyote-skin or rawhide wrist guard on the left arm for the
    bowstring.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Large blue Venetian glass beads were said to have been brought by the earliest
    Spanish missionaries and later found scattered about Pima sacred places.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man described as very brave pierced the nasal septum and wore a polished
    bone skewer or suspended turquoise or shell; the passage says two living men had
    pierced noses but no longer wore ornaments in them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men decorated long rope-like locks with soft breast feathers of eagle, turkey,
    or other large birds; war headdresses used eagle, hawk, and owl wing feathers,
    and one collected example contained hair of an Apache warrior.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Relay and distance race contestants wore a hair ornament; a described example
    was made of arrowwood, four devil's-claw hooks attached with sinew, and blue strings.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Women twined coronets of sunflowers or corn husks in their hair; in recent
    years these were colored red or blue by boiling with calico.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says Pima personal decoration by paint, tattooing, and ornaments
    was developed to a considerable extent, while ornamentation of implements and
    weapons was more rudimentary.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Embellishment of objects is described as chiefly painting, as on shields,
    or smooth finishing, as on bows; painting on shields, cradle hoods, ki&h&s, and
    tobacco pouches is described as crude compared with decoration of the person.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Artifacts whose function did not require smoothness or symmetry are described
    as coarse and rough; Pima metates are contrasted with symmetrical Hohokam metates.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The author says Pimas battered polished axes found about ruins into roughened
    tools for metates and uses this as an argument that Pimas are not descendants
    of the Hohokam.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage explicitly states that poverty of design and absence of symbolism
    indicate relationship with California tribes rather than with Pueblos.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Pima textiles are described as having limited ornamentation; blankets are
    said to have only a dingy border of doubled selvage threads, with little use of
    imported red thread, though smoothness and evenness of plain white blankets are
    credited.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: After bayeta was brought by whites, Pima weavers are said to have produced
    a belt by closely copying ornamentation from Hohokam relics and southern congeners.
  category: action
  evidence_refs:
  - ev:14
