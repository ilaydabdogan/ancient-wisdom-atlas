canonical_text:
  quote: ''
  summary: In one episode, a boy whose mother has been captured by Apaches lives with
    his grandmother, quarrels with her, and seeks his mother. After reaching her,
    he becomes a dove and is carried by her, but an Apache chief crushes the dove;
    the fragments pass through the smoke hole and become hawks who kill the Apaches.
    Mother and son begin returning home but become saguaros on the way. In another
    episode, Bluebird becomes blue by bathing in a lake and teaches Coyote to do the
    same. Coyote becomes blue, admires himself while walking, collides with a stump,
    falls into dust, and becomes gray.
