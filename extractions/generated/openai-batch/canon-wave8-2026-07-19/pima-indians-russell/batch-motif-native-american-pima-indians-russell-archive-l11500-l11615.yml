canonical_text:
  quote: ''
  summary: The passage recounts Coyote surviving an earlier destruction and appearing
    at an underworld emergence, where his laughter causes the earth to close. It then
    narrates Coyote making two coyote brothers from his reflected image in water,
    sending them across the sea on logs, restoring Yellow Coyote's sight after foam
    blinds him, and the brothers' later dwelling near the Grand Canyon. Their divided
    house, north-south food contrast, gambling losses, appeal to Finish, and a scene
    about greeting and tobacco etiquette are described.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Coyote is said to have been saved at the time of the earth's destruction and
    to have appeared again when underworld Pimas emerged.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Coyote looked down an opening at humans struggling upward, laughed, and this
    act caused the earth to close so that many people did not reach Pima Land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Coyote later wandered alone in the West and made two other coyotes from his
    image reflected in water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two made coyotes were named as an elder brother, Sandy Coyote, and a younger
    brother, Yellow Coyote.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Coyote told the two brothers to fetch logs, embark on the sea, and seek land
    beyond it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Yellow Coyote traveled behind Sandy Coyote, opened his eyes after Sandy's
    advice, and was blinded when wind blew foam from the water into his face.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sandy Coyote could not restore Yellow Coyote's sight, so the brothers returned
    to Coyote, who restored it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The brothers settled between Pima country and Mohave territory, near the mouth
    of the Grand Canyon, and built a house with the doorway toward the east.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The brothers repeatedly deferred to each other over choosing house sides until
    three houses grew old and fell; in the fourth house Sandy Coyote chose the south
    side and Yellow Coyote took the north side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When gathering screw beans, Sandy Coyote took beans from the south side of
    trees, while Yellow Coyote took beans from the north side and became sick after
    eating them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sandy Coyote explained that beans on the north side were not ripened by the
    sun like those on the south side, and the next day the brothers found the south-side
    beans sweeter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The brothers split sticks to build bins for screw beans and then played a
    game called ki'ts, wagering their beans.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Yellow Coyote lost all his screw beans, went hungry, and later lost arrows,
