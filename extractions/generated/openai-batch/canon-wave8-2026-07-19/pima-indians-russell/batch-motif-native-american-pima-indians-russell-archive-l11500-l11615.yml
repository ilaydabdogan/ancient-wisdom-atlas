  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Yellow Coyote sought help from Finish, who lived in the West.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: When Finish tried to enter Yellow Coyote's house, sticks caught him in the
