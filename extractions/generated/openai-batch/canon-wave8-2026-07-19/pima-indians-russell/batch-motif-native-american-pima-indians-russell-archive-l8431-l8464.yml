canonical_text:
  quote: ''
  summary: The passage describes Haeyo, a stone-throwing game in which successful
    players may be carried on opponents' backs between two holes, and Vapĭtai, a guessing
    game using a concealed bean or mesquite-gum ball hidden in reed joints filled
    with sand under a blanket. It also describes the named reeds used in the game,
    including an 'old man' reed with spot rows and an unmarked 'old woman' reed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Haeyo, four men use moderately large stones and throw them between two
    holes about 50 feet apart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Players stand at one hole and try in succession to throw a stone into the
    other hole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If only one player succeeds, he and his partner are carried on the backs of
    their opponents to the opposite goal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If both partners succeed, they are carried to the opposite goal and back,
    while the carriers imitate a horse's gallop.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vapĭtai is a guessing game with several assistants and two leaders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Vapĭtai, the Papagos use a small bean, while the Pimas use a ball of black
