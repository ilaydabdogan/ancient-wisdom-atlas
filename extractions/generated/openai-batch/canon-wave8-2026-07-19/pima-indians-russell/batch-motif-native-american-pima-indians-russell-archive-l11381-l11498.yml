canonical_text:
  quote: ''
  summary: The passage recounts a war sequence in which Tco'tcAk Tĭ'tai Si'van uses
    soot, tears, smoke, and a belt to evade Elder Brother's warriors before becoming
    a rainbow and being brought down by spiders. His heart contains a green stone
    kept in a medicine basket. Subsequent sections describe conquered pueblos, war
    songs, the capture and scalping of Vulture, a migration toward the Colorado and
    Gulf of California, Kă'kănyip's marriage and death, and the birth and early resolve
    of his son Pat' A'-anukam.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tco'tcAk Tĭ'tai Si'van knows he will be defeated but struggles to save his
    people and himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He uses soot from his chimney to make darkness fall so dense that Elder Brother's
    warriors cannot see.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the darkness is dispelled, he blows tears among the men around him,
    producing a mirage that conceals him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the mirage is lifted, he blows smoke from a reed cigarette, creating
    a heavy fog through which he continues his flight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the fog becomes clouds, he throws his belt upward, climbs up, and lays
    himself against the clouds as a rainbow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The god of the rainbow makes spiders, and the spiders form a web over the
    rainbow and bring it to earth and destruction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Elder Brother's warriors cut open Tco'tcAk Tĭ'tai Si'van's heart and find
    a round green stone about the size of a bullet.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The green stone is said to be kept in a medicine basket captured with his
    grandson.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tco'tcAk Tĭ'tai Si'van had instructed Kă'kănyip to hide with his basket and
    later touch his body and swallow its odor to acquire the power of the Si'van.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The captured box is said to produce a severe storm and cold weather in Pima
    Land if disturbed.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Before attacking Vulture's pueblo, the invaders sing a song addressing the
    Child of the Raven and magic power shining like a mirage.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Elder Brother instructs his army to capture Vulture alive by identifying the
    warrior with white leggings.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Vulture is brought to Elder Brother, who scalps him; the passage says this
    accounts for the naked head of the vulture of the present day.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: At Gila Crossing, Elder Brother and his party sing of a magician, a sacred
    pipe, downy feathers, and bringing sleep upon the enemy.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Some inhabitants of the Salt River pueblos flee toward the Colorado, descend
    to the Gulf of California, turn eastward and northeastward, settle, and are identified
    as ancestors of the Rio Grande pueblo tribes.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: Kă'kănyip marries Kold Ha-akam, goes to the mountains for provisions during
    her pregnancy, is surrounded by Apaches, fights, and is killed.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Kă'kănyip's body is found and burned to ashes before the people return home.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Kă'kănyip's son Pat' A'-anukam is born at Santa Rosa, becomes brave and noted,
    learns how his father was killed, and asks to see Apache water sources and trails.
  category: sequence
  evidence_refs:
  - ev:18
