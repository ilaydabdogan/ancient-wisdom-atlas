- id: ev:9
  type: summary
  locator: lines 11418-11423
  quote_or_summary: Before fleeing, he told Kă'kănyip to hide with his basket, then
    after the grandfather was killed to touch him and swallow the body's odor to gain
    Si'van power.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 11425-11429
  quote_or_summary: The box is said to be kept by Papagos south of Gila Bend; if disturbed,
    it produces severe storm and cold weather in Pima Land.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 11431-11439
  quote_or_summary: After Sweetwater, invaders move against Vulture's pueblo and sing
    to the Child of the Raven about dazzling power and magic shining like the mirage.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 11440-11445
  quote_or_summary: Elder Brother tells the army to capture Vulture alive and identifies
    him as the warrior with white leggings.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 11445-11448
  quote_or_summary: They bring Vulture to Elder Brother, who scalps him; this is said
    to explain the naked head of the vulture today.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 11450-11459
  quote_or_summary: At Gila Crossing, a song declares the singer a magician whose
    sacred pipe increases magic power and brings sleep upon the enemy.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 11479-11486
  quote_or_summary: During war along the Gila, some Salt River pueblo inhabitants
    flee toward the Colorado, travel to the Gulf of California, turn east and northeast,
    settle, and are identified as ancestors of Rio Grande pueblo tribes.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 11487-11496
  quote_or_summary: Kă'kănyip marries Kold Ha-akam, searches the mountains for foods
    desired by his pregnant wife, kills a deer, is surrounded by Apaches, fights,
    and is killed.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 11496-11499
  quote_or_summary: After Kă'kănyip disappears, the people search, find his body,
    and burn it to ashes before returning home.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 11499-11510
  quote_or_summary: At Santa Rosa Kă'kănyip's son Pat' A'-anukam is born; after learning
    of his father's killing, he asks to see Apache springs, water places, and trails.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 11423-11426
  quote_or_summary: S'hohany discovers little Kă'kănyip and after a time sells him
    to the Papago chief Kăk Si'sivĕlikĭ, Two-Whirlwinds.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 11460-11468
  quote_or_summary: Tcu-unarsat Si'van is defeated; before another pueblo the victors
    sing of the small Blue Eagle and a staff that has foretold events.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: lines 11469-11478
  quote_or_summary: The conquerors move against Vi'-iki-ial Ma'kai Si'van near Tempe,
    sing of seeking and taking a distracted enemy, then proceed westward destroying
    other pueblos and return to possess the Gila valley.
  source_text_path: texts/public-domain/native-american-southwest/project-gutenberg/pima-indians-russell.md
  rights_note: Public domain source; summarized.
