canonical_text:
  quote: ''
  summary: A boy living with his grandmother goes to find his captive mother among
    the Apaches. He evades his grandmother by becoming a saguaro, enters the Apache
    camp as a dove carried by his mother, and after the dove is smashed its pieces
    become hawks that kill the Apaches. The hawks become the boy again, but he and
    his mother are stopped on the return journey and become saguaros beside the road.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman lives with her grandson; the boy’s father has been killed by
    Apaches, and his mother has been taken captive and burned, leaving large scars.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy and grandmother survive by collecting fallen grains from corn grinding
    and making soup from them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After he cannot obtain corn and is whipped, the boy says he knows where his
    mother is and is going to her; the grandmother warns that the Apaches will kill
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grandmother follows him to the mountains and, from the highest peak, sees
    the boy and his mother, recognizing the mother at a distance by her shining scars.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the grandmother catches up with him, the boy steps aside, turns into
    a saguaro, and resumes his form after she goes back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother warns the boy not to come near; after learning that the Apaches
    like little doves, he turns into a little dove.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother carries the dove-form boy home in her basket and tells the Apaches
    it is the young of a dove.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Apaches hear the mother speaking to the dove in her own language, conclude
    that it belongs to her tribe, and decide to kill it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief smashes the dove; pieces pass between his fingers, fly out through
    the smoke hole, and become a flock of hawks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hawks fall upon the Apaches and beat them all to death with their wings,
    then turn back into the boy.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The boy and his mother start home, but at the place where the grandmother
    had turned back they can go no farther and become saguaros, one on each side of
    the road.
  category: sequence
  evidence_refs:
  - ev:7
