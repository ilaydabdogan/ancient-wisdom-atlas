candidate_motifs:
- id: motif:1
  label: human-to-plant transformation explaining plant origins
  taxonomy_refs:
  - shapeshifter
  basis: The grandchildren turn themselves into a saguaro and a palo verde, and the
    tale states that this is how those plants came to be.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy term 'shapeshifter' is used broadly for transformation; the
    passage presents a one-time metamorphosis rather than repeated shape-changing.
- id: motif:2
  label: runaway children after punishment
  taxonomy_refs:
  - departure
  basis: The children become angry after being whipped, refuse to listen, and run
    away.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The departure is a domestic flight rather than a formal heroic journey.
- id: motif:3
  label: creator shaping world and humans from primal materials
  taxonomy_refs:
  - culture_hero
  basis: Earth Doctor creates plants, insects, sky, celestial bodies, living beings,
    and clay humans after emerging from darkness.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage identifies Earth Doctor as a creator but does not explicitly
    use the term culture hero.
- id: motif:4
  label: world destruction followed by renewed creation
  taxonomy_refs:
  - death_rebirth
  basis: Earth Doctor crushes the overpopulated world by pulling down the sky and
    then makes a new creation.
  evidence_refs:
  - ev:4
