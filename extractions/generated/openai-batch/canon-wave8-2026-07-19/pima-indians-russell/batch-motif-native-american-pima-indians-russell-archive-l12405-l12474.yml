canonical_text:
  quote: ''
  summary: 'The passage recounts a tale in which two grandchildren disobey their grandmother,
    run away, transform themselves into a saguaro and a palo verde, and thereby explain
    the origin of those plants. It then gives an abstract of a creation myth: Earth
    Doctor creates parts of the world and living beings; the world is destroyed and
    recreated; a flood caused by an abandoned child overwhelms the earth with several
    kinds of survivors; post-flood creation, first death, Coyote episodes, monster-slaying
    by Elder Brother, and Elder Brother''s repeated deaths, revivals, and descent
    to an underworld are summarized.'
  language: English
  quote_policy: summarized
