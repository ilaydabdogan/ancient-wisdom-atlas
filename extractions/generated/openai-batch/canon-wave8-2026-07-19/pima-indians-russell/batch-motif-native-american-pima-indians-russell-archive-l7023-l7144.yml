- id: obs:4
  text: Some Pimas who could not weave obtained blankets through barter, including
    produce or horses, with one horse described as equivalent to two blankets.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:5
  text: Bartlett’s account describes warp attached to sticks, a cane used like a sley,
