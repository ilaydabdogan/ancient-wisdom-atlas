  summary: Apollo guides a Cretan ship against the crew’s intentions to Crisa, appears
    in fiery divine splendor, then in the form of a young man, reveals himself, declares
    that the Cretans will serve his temple, and instructs them to establish altar
    rites, pray to him as Apollo Delphinius, offer libations, sing the Paean, and
    proceed to his temple.
