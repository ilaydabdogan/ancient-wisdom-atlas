canonical_text:
  quote: ''
  summary: Hermes and Apollo take their cattle dispute before Zeus on Olympus. Apollo
    accuses the newborn Hermes of stealing and concealing his cattle through strange
    tracks and denial. Hermes denies guilt before Zeus. Zeus laughs and orders Hermes
    to guide Apollo to the hidden cattle. At Pylos, Hermes brings the cattle from
    a cave; Apollo sees flayed skins and marvels at withy bands. Hermes then plays
    the lyre, delights Apollo, and sings of the gods, Earth, origins, divine allotments,
    and Mnemosyne.
  language: English
  quote_policy: summarized
