  summary: The essay compares Apollo with figures from American, Andaman, and Australian
    traditions who act as subordinate sons, messengers, or go-betweens of a primal
    being. It emphasizes healing, prophecy, reporting human conduct, supervision of
    Mysteries, and animal transformations, while arguing against simple borrowing
    from Christian or classical sources.
