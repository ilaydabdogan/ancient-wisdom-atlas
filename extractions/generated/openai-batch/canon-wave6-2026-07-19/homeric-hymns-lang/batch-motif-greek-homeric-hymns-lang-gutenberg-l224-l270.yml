canonical_text:
  quote: ''
  summary: The preface explains the translator's comparative approach to Greek religion
    and ritual, especially Apollo and the Eleusinian Mysteries, by reference to non-Greek
    rites and to myths of a Dream Time or Alcheringa in which gods or heroes acted
    on earth. It then defends a poetic translation style over modern colloquial English,
    using a mock colloquial speech of Anchises and the word "Etin" as examples.
  language: English
  quote_policy: summarized
