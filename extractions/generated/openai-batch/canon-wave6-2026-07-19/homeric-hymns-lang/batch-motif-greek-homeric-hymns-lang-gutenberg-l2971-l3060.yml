canonical_text:
  quote: ''
  summary: The daughters of Celeus encounter Demeter in the guise of an old woman
    while fetching water. She identifies herself as Deo and gives an account of forced
    travel from Crete and escape from sea-rovers, then asks for household work, especially
    nursing a child. Callidice proposes bringing her to Metaneira, whose late-born
    son needs care. The maidens summon her to Celeus's house. Demeter arrives veiled
    and sorrowful, manifests divine light at the threshold, refuses a high seat, sits
    on a stool with fleece, and remains silent and fasting in grief for her daughter
    until Iambe's jokes make her smile. She refuses wine and requests a drink of meal,
    water, and mint, then makes libation.
  language: English
  quote_policy: summarized
