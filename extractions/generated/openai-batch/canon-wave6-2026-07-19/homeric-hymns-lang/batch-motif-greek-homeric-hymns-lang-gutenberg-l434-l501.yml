canonical_text:
  quote: ''
  summary: The passage discusses whether Australian high-god and moral-judgment ideas
    are native or borrowed from missionaries; compares them with early American reports,
    Christian dogmas, and Greek belief; then introduces a comparative pattern relevant
    to Apollo myths involving a primal anthropomorphic creator-teacher, his withdrawal
    to a high dwelling, a prehuman half-bestial race, metamorphoses, and personified
    natural objects such as Earth, Sky, Sea, and Forests.
  language: English
  quote_policy: summarized
