canonical_text:
  quote: ''
  summary: Metaneira asks the disguised Demeter to nurse Demophoon. Demeter nurtures
    the child with divine substances and places him in fire at night, intending to
    make him deathless, but Metaneira discovers and interrupts the act. Demeter reveals
    herself, commands the building of a temple and altar with rites, and later withholds
    the earth’s fertility while grieving for her daughter, causing famine until Zeus
    considers action.
