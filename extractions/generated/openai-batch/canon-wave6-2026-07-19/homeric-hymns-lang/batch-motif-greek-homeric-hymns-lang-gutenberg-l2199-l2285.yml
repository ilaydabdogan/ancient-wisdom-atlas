canonical_text:
  quote: ''
  summary: Hermes drives Apollo's cattle to the Alpheius, makes fire, slaughters and
    portions two cattle, conceals traces, and returns to Maia's cave and his cradle.
    Maia challenges him; Hermes answers that he seeks sustenance, sacrifice, and honor
    like Apollo, and threatens further raiding. Apollo then reaches Onchestus and
    questions an old man about the missing cattle.
  language: English
  quote_policy: summarized
