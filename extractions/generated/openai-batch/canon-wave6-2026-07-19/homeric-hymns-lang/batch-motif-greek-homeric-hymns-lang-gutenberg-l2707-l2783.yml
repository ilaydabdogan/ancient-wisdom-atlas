canonical_text:
  quote: ''
  summary: Aphrodite addresses Anchises while presenting herself as a mortal Phrygian
    maiden, claiming that Hermes carried her from Artemis' company and said she was
    destined to become Anchises' bride and mother of his children. She asks Anchises
    for family recognition, gifts, and a wedding-feast. Aphrodite then inspires desire
    in Anchises; he takes her to his bed, removes her ornaments and clothing, and
    lies with her without knowing she is divine. Afterward she puts him to sleep,
    dresses, reveals divine stature and beauty, wakes him, and Anchises responds with
    fear that union with an immortal goddess may reduce him to a strengthless shadow.
  language: English
  quote_policy: summarized
