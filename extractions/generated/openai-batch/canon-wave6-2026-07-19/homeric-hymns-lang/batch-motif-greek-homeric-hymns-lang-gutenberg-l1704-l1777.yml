canonical_text:
  quote: '"forth leaped the babe to light"'
  summary: The goddesses send Iris to fetch Eilithyia with the promise of a golden
    amber-studded necklet, avoiding Hera's interference. When Eilithyia reaches Delos,
    Leto gives birth to Apollo while clasping a palm tree. The goddesses wash and
    swaddle the newborn, Themis feeds him nectar and ambrosia, and Apollo immediately
    breaks his bonds and claims the lyre, bow, and the task of declaring Zeus's counsel.
    Delos blossoms and is chosen as Apollo's home. The passage then describes Apollo's
    cult places, the Ionian gathering at Delos, the Delian maidens' hymns, and the
    singer's request to be remembered as the blind man of Chios.
  language: English
  quote_policy: quoted
