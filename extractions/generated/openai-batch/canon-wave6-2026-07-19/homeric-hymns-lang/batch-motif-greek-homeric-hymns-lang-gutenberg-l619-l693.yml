canonical_text:
  quote: ''
  summary: 'Introductory essay passage on the Hymn to Hermes: it discusses the hymn’s
    corrupt text, possible dating by the seven-stringed lyre, Hermes’ attributed inventions
    of the lyre and fire-sticks, the poem’s humor around a clever divine infant and
    cattle theft, Hermes’ roles as messenger and guide of souls, parallels for track-concealing
    footwear and reversed tracks, his sacred yet tricksy character, his patronage
    of thieves and traders, and his birth in a dusky cavern from a divine amour.'
  language: English
  quote_policy: summarized
