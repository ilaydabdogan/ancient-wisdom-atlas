  quote: ''
  summary: The passage is a comparative discussion of moral teaching, food sharing,
    taboos, purification, and symbolic renewal in Australian initiation rites and
    the Greek Eleusinian Mysteries. It argues that ethical elements can coexist with
    ritual, myth, and mummery, compares Eleusinian and Australian initiatory practices,
    and cautiously contrasts such analogies with Christian ideas of purity, confirmation,
    conversion, and spiritual renewal.
  language: English
  quote_policy: summarized
