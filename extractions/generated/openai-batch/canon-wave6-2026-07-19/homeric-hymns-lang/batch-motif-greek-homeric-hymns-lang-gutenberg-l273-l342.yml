  summary: 'The passage is an introductory discussion of the Hymn to Apollo. It describes
    the hymn as difficult and textually corrupt, explains a division between a Delian
    section on Apollo''s birth and shrine and a Delphian/Pythian section on Apollo''s
    oracle and fane, summarizes Verrall''s theory that the latter part is a political
    anti-Delphic addition, and mentions several mythic or cultic details: Typhaon''s
    birth from Hera''s anger, Apollo''s threat to Cretan ministers, Trophonius and
    Agamedes as builders, the derivation of Pytho from rot, and Apollo as Dolphin
    God associated with a shore altar.'
