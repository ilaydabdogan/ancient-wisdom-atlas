canonical_text:
  quote: ''
  summary: The passage opens the Hymn to Demeter. Persephone gathers flowers, is lured
    by a wondrous narcissus, and is abducted by Hades with Zeus's involvement. Hecate
    and Helios hear her cry. Demeter grieves, searches for nine days with torches,
    learns from Helios that Zeus gave Persephone to Hades, withdraws from Olympus,
    disguises herself, and comes to Eleusis, where she sits by the Maiden Well beneath
    an olive-tree.
  language: English
  quote_policy: summarized
