canonical_text:
  quote: ''
  summary: The hymn to Hephaestus asks the Muse to sing of Hephaestus, renowned in
    craft, who with Athene taught useful works to humans; humans formerly lived like
    beasts in mountain caves but now, instructed in craft, live happily in homes year-round.
    The singer asks Hephaestus for grace, valour, and fortune. The hymn to Apollo
    says the swan sings to Phoebus by the river Peneus, and the sweet-voiced minstrel
    sings to him with the lyre, first and last; the singer hails Apollo and beseeches
    him in song.
  language: English
  quote_policy: summarized
