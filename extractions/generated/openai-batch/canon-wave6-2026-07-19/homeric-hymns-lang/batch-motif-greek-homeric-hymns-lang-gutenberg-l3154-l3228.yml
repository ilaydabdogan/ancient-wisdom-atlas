canonical_text:
  quote: ''
  summary: Zeus sends divine messengers to summon Demeter back to the gods, but she
    refuses until she sees Persephone and continues to prevent the earth from bearing
    fruit. Zeus then sends Hermes to Erebus to ask Hades to bring Persephone into
    the light. Hades agrees, but secretly gives Persephone pomegranate seed. Hermes
    escorts her in a golden chariot to Demeter, who explains that eating food in Hades
    requires Persephone to return below for part of each year and come back when the
    earth blossoms.
  language: English
  quote_policy: summarized
