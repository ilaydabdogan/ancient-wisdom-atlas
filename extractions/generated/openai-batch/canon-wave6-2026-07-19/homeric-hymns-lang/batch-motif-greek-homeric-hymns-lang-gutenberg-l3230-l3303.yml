canonical_text:
  quote: ''
  summary: Persephone tells Demeter how Hermes announced her return from Erebus, how
    Hades forced her to taste pomegranate seed, and how Hades carried her beneath
    the earth from a flower-filled meadow. Demeter and Persephone are reunited; Hekate
    becomes Persephone's companion. Zeus sends Rhea to call Demeter back to the gods
    and decrees that Persephone will spend one third of the year beneath the murky
    gloom and two thirds with her mother and the gods. Demeter restores grain to the
    earth, teaches selected kings her rites and secret mysteries, and is invoked with
    Persephone for prosperity.
  language: English
  quote_policy: summarized
