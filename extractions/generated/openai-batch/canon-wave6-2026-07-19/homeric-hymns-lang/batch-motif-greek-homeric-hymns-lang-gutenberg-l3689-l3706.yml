  summary: The hymn addresses Earth as mother of all and Mother of the Gods, an eldest
    goddess who nourishes beings on land, in sea, and in air; grants children, harvest,
    life, prosperity, and righteous rule to favored men; is wife of starry Ouranos;
    and is asked to grant livelihood in return for the ode.
