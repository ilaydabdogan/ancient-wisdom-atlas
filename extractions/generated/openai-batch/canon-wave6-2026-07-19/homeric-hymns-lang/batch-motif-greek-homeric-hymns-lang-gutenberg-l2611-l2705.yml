canonical_text:
  quote: ''
  summary: The hymn opens by describing Aphrodite’s power to rouse desire in gods,
    humans, birds, beasts, and sea creatures, while naming Athene, Artemis, and Hestia
    as exceptions. Hestia’s virgin oath and honors are described. Zeus then sends
    desire into Aphrodite for the mortal Anchises so that she too will know a mortal
    bed. Aphrodite prepares herself at Paphos, travels to Ida, stirs desire among
    animals, and appears to Anchises in the form of an unwedded maiden. Anchises marvels
    at her beauty, suspects she may be divine or nymph-like, promises worship, and
    asks for prosperity, children, long life, and honored old age.
  language: English
  quote_policy: summarized
