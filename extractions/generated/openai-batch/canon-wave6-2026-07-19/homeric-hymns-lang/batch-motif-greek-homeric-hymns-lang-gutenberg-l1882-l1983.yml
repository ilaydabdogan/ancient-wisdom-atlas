candidate_motifs:
- id: motif:1
  label: Foundation of a lasting sacred temple and cult site
  taxonomy_refs: []
  basis: Apollo marks the site, builders and human tribes construct the temple, and
    Apollo later seeks ministers for rocky Pytho.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: The passage establishes a temple and ministerial service, but it does
    not explicitly call the place a cosmic center.
- id: motif:2
  label: God slays a destructive Dragoness near water
  taxonomy_refs:
  - serpent
  basis: Apollo kills a mighty Dragoness near a stream; the being is a bane to men
    and flocks and dies under Apollo's shaft and curse.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The taxonomy mapping uses the broad serpent/dragon family; the passage's
    literal term is Dragoness or monster.
- id: motif:3
  label: Etiological naming from the monster's decay
  taxonomy_refs: []
  basis: The place is named Pytho and Apollo called Pythian because the sun made the
    monster corrupt there.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an internal etymology supplied by the passage rather than an independently
    verified linguistic derivation.
- id: motif:4
  label: Competitive anomalous divine birth
  taxonomy_refs:
  - miraculous_child
  - divine_parent_child
  basis: Zeus brings forth Athene from his head; Hera, angered, seeks and bears a
    child apart from Zeus, resulting in Typhaon.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage emphasizes divine rivalry and monstrous outcome; the classification
    should not be generalized to all miraculous-child motifs without review.
- id: motif:5
  label: Monstrous fosterling nursed by a Dragoness
  taxonomy_refs: []
  basis: Hera gives Typhaon to the Dragoness to nurse as a bitter fosterling, and
    the Dragoness had taken and reared him.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: No available taxonomy reference exactly matches monstrous fosterage.
- id: motif:6
  label: Deity subdues a spring and founds an altar with a local epithet
  taxonomy_refs: []
  basis: Apollo accuses Telphusa of beguiling him, hides her streams with stones,
    makes an altar nearby, and is invoked as Telphusian.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage presents the action as Apollo's punishment and cultic naming;
    wider interpretation as cult displacement requires external evidence not used
