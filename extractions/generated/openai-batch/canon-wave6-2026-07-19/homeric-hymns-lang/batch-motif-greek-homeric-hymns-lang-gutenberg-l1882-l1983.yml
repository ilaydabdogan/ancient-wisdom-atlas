    motif family: a deity kills a destructive dragon-like monster that harms humans
    and animals near a water source.'
  claim_level: same_motif
  target: serpent motif family / dragon-slaying pattern
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage names a Dragoness and monster rather than using a generic
    serpent term; no historical-contact claim is implied.
