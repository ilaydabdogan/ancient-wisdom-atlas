  claim: Apollo's boarding of the ship in dolphin form supports classification as
    a divine shapeshifter episode.
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The evidence covers only the initial dolphin apparition, not the remainder
    of the encounter.
- id: claim:3
  claim: The births of Athene from Zeus's head and Typhaon from Hera apart from Zeus
    support comparison to anomalous divine birth and divine parent-child patterns.
  claim_level: same_function
  target: miraculous_child and divine_parent_child motif families
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage frames these births through divine rivalry and anger; the
    comparison is functional, not a claim of a single shared narrative type.
