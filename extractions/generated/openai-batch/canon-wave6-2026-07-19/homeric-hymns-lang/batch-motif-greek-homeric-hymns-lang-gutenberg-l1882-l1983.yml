canonical_text:
  quote: ''
  summary: Apollo marks out the foundations of a lasting temple, kills a destructive
    Dragoness near a stream, and the passage recounts Hera's anger at Zeus and the
    birth and fosterage of Typhaon. Apollo curses the Dragoness to rot, giving the
    place and his epithet the names Pytho and Pythian. He then punishes the spring
    Telphusa by hiding her streams and establishing an altar, considers who should
    serve him at rocky Pytho, sees a Cretan ship, and boards it in dolphin form as
    a portent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Phoebus Apollo marks out long and wide foundations; Trophonius and Agamedes
    lay a stone threshold; many human tribes build a temple of wrought stones to be
    famous in song.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fair-flowing stream lies nearby, and Apollo kills a mighty Dragoness with
    an arrow from his strong bow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Dragoness is described as a wild, huge bane who caused woes for earthly
    men and their flocks and brought doom to whoever met her.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: The bracketed account says the Dragoness took and reared Typhaon, whom Hera
    bore in anger against Zeus.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: Hera complains that Zeus brought forth Athene apart from her, and she recalls
    that Hephaestos, her son, was lame and was cast into the sea, where Thetis received
    and nurtured him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hera vows to seek a child of her own apart from Zeus and invokes Earth, the
    heavens, and the Titans, striking the earth with her hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Earth is stirred after Hera strikes the ground, and Hera withdraws from Zeus
    for a full year while dwelling in temples and enjoying sacrifices.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: When the year and seasons are fulfilled, Hera bears Typhaon and gives him
    to the Dragoness as a bitter fosterling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Apollo shoots the Dragoness; she writhes, pants, rolls over the land, gives
    up the ghost, and is cursed by Apollo to rot on the fruitful earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage explains the names Pytho and Pythian from the wasting and corruption
    of the monster by the sun at that place.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Apollo realizes that Telphusa beguiled him, confronts her, overturns a rock
    with stones, hides her streams, and establishes an altar in a grove nearby.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Apollo considers what men to bring as ministers for rocky Pytho; he sees a
    swift ship with Cretan men from Minoan Cnossus sailing toward Pylos.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Cretans are described as sacrificers to Apollo and speakers of Apollo's
    true doom from the daphne in the dells of Parnassus.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Apollo leaps into the sea, boards the Cretan ship in the guise of a dolphin,
    and lies there as a great and terrible portent.
  category: action
  evidence_refs:
  - ev:9
