canonical_text:
  quote: ''
  summary: Cretans obey Apollo, beach their ship, perform sacrifice on the sea-strand,
    and follow Apollo with harp, dance, and Paean to Pytho and Parnassus. Apollo shows
    them his shrine and temple, answers their concern about livelihood, assigns them
    temple service and receipt of worshippers, promises sheep from visiting tribes,
    and warns of thraldom if they act vainly or violently. The hymn closes with a
    farewell to Apollo, son of Zeus and Leto.
  language: English
  quote_policy: summarized
