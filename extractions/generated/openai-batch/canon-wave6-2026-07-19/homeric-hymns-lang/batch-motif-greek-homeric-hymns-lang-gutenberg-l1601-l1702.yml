canonical_text:
  quote: ''
  summary: The passage opens the Hymn to Apollo with Apollo entering Zeus' hall, where
    the gods rise in fear and Leto disarms and seats him before Zeus offers nectar.
    It then frames Leto as mother of Apollo and Artemis, names Delos as Apollo's birth-place,
    and recounts Leto's search for a land willing to host Apollo. Delos agrees only
    after asking Leto to swear that Apollo will establish his first temple and oracular
    shrine there and honor the island. Leto swears by Earth, Heaven, and the water
    of Styx. Delos rejoices, but Leto labors nine days and nights while goddesses
    attend her; Hera, in jealousy, keeps Eilithyia away on Olympus. The line range
    also contains illustration captions, including Apollo shooting Python by the Delphic
    Tripod and Leto with her infants Apollo and Artemis.
  language: English
  quote_policy: summarized
