canonical_text:
  quote: ''
  summary: Apollo admires Hermes' lyre-playing and asks about the art. Hermes offers
    Apollo the lyre and explains its proper use. Apollo accepts the lyre, gives Hermes
    a whip and authority over the herds, and the two return to Olympus reconciled.
    Apollo then asks Hermes to swear not to steal his lyre or bow. Hermes vows this,
    Apollo forms an alliance with him, grants him a golden wand, and refuses to reveal
    Zeus's prophetic counsel.
  language: English
