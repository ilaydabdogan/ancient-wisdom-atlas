canonical_text:
  quote: ''
  summary: Apollo pursues his stolen cattle by reports, signs, and tracks to the Cyllenian
    cave where the infant Hermes lies in swaddling bands. Apollo accuses and threatens
    Hermes; Hermes denies knowing of the cattle and stresses his newborn condition.
    Apollo predicts Hermes' future as a crafty night-thief, lifts him, and receives
    bodily omens from him. Apollo then says the omens will help find the cattle, while
    Hermes again denies the theft and asks that the dispute be judged before Zeus.
  language: English
  quote_policy: summarized
