  summary: The passage contains short hymnic addresses to Artemis and Aphrodite. Artemis
    is invoked through the Muse as Apollo's sister, an archer maiden who waters her
    steeds and drives a golden chariot to Claros, where Apollo awaits her. Aphrodite
    is invoked as Cytherea, Cyprus-born, giver of sweet gifts to mortals, smiling
    and holding a blossom; she is hailed as queen of Salamis and Cyprus and asked
    to grant desirable song.
