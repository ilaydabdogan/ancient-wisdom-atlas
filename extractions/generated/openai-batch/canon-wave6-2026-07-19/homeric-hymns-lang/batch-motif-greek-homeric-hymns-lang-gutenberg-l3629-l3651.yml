canonical_text:
  quote: ''
  summary: The passage hymns Artemis as a maiden huntress, archer, slayer of stags,
    and sister of Apollo. She hunts through hills, headlands, mountains, woodland,
    earth, and sea, slaying wild beasts; afterward she slackens her bow, goes to Apollo’s
    Delphian hall, hangs up her bow and arrows, and leads dances of Muses and Graces
    while Leto’s children are praised. A caption notes a relief of Apollo, Artemis,
    and Leto in procession.
  language: English
  quote_policy: summarized
