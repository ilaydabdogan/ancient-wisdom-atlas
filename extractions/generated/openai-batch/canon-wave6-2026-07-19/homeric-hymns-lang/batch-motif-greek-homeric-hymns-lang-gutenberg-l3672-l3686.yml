    last oblations of sweet wine. It then invokes Hermes by several epithets, asks
    him to dwell with Hestia and befriend the speakers, notes that both are skilled
    in fair works of earthly men and consort with wisdom and youth, and closes with
    a hail to Hestia and Hermes.
