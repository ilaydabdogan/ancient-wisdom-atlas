  summary: The hymn invokes the Muses to sing of the Dioscuri, Castor and Polydeuces,
    sons of Zeus and Leda. Born beneath Taygetus, they are described as saviors of
    mortals and ships at sea. Mariners call on them with prayer and sacrifice when
    storms threaten, and the sons of Zeus appear through the air, still winds and
    waves, and bring relief.
