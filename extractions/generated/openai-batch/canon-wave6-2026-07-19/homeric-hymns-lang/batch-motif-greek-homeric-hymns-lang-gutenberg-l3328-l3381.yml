canonical_text:
  quote: ''
  summary: The hymn tells how Dionysus appeared as a beautiful youth on a seashore,
    was seized by Tyrrhenian pirates, resisted their bonds, manifested divine signs
    aboard the ship, transformed into animal forms, punished the pirates by driving
    them into the sea where they became dolphins, and spared the steersman who had
    recognized him as divine.
  language: English
  quote_policy: summarized
