canonical_text:
  quote: ''
  summary: The hymn invokes the Muse to tell of Pan, son of Hermes, describing him
    as goat-footed, two-horned, long-haired, pastoral, mountain-ranging, a hunter,
    piper, and dancer among nymphs. It recounts Hermes' coming to Arcadia, his nuptials
    with the daughter of Dryops, the marvelous birth of Pan, the nurse's flight at
    the child's wild appearance, Hermes' presentation of the child to Zeus and the
    Immortals, and the divine naming of Pan because he gladdened them all.
  language: English
  quote_policy: summarized
