canonical_text:
  quote: '"Here methinketh to stablish a right fair temple, to be a place oracular
    to men"'
  summary: Apollo plays among the gods, then seeks a place for an oracle for mortals.
    After passing many locations and a Poseidon grove with an old chariot rite, he
    first favors Telphusa, but Telphusa warns him away and directs him to Crisa beneath
    Parnassus, where he chooses to found an oracular temple receiving offerings from
    human worshippers.
  language: English
  quote_policy: quoted
