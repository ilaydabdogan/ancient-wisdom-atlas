- id: obs:1
  text: Apollo, described as the son of Leto, travels from rocky Pytho to Olympus
    and the House of Zeus while playing harp or lyre.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Muses sing antiphonally about divine gifts and human sufferings; several
    goddesses dance hand-in-hand, Artemis sings among them, Ares and the keen-eyed
    Bane of Argos sport, and Apollo plays the lyre with light around him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Leto and Zeus are glad while beholding Apollo as their dear son among the
    deathless gods.
  category: relationship
  evidence_refs:
