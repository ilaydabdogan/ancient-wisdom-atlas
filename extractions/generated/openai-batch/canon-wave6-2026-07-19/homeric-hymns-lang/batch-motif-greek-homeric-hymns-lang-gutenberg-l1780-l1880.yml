- id: obs:4
  text: The hymnic speaker frames the next subject as Apollo’s search for a place
    of oracle for men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Apollo descends from Olympus and passes through a sequence of named places;
    the Lelantian plain does not please him for a temple and grove, and Thebe is described
    as still wild and uninhabited.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Onchestus, a bright grove of Poseidon, an old rite involves a charioteer
    dismounting, horses drawing an empty car onward, and a broken car being left as
    the god’s portion while people pray to Poseidon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Telphusa, Apollo judges the land suitable for a temple, grove, and oracle,
    and says people will bring hecatombs and receive unerring decrees from him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Telphusa becomes angry at Apollo’s plan, warns that horses, mules, and her
    sacred springs would draw attention away from his temple, and advises him to build
    at Crisa beneath Parnassus instead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Telphusa persuades Apollo so that honor in that land remains with her, and
    Apollo proceeds to Crisa under snowy Parnassus.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Crisa, Apollo again declares his intention to establish an oracular temple
    for people from Peloponnesus, the mainland, and the islands, who will bring hecatombs
    and receive unerring oracles.
  category: speech
  evidence_refs:
  - ev:10
