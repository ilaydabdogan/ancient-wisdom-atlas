canonical_text:
  quote: ''
  summary: A messenger reports to the king that Bacchic women led by Autonoë, Ino,
    and Agâvê were seen on the mountain at dawn. They awaken, prepare themselves with
    fawn-skins, wreaths, and snakes, nurse wild young animals, produce water, wine,
    milk, and honey by ritual gestures, worship the Wand and the God, evade an attempted
    capture, destroy cattle and villages with miraculous force, resist human weapons,
    purify themselves at springs, and prompt the messenger to counsel acceptance of
    the Spirit associated with the vine.
  language: English
  quote_policy: summarized
