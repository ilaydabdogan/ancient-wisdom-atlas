  summary: Pentheus asks whether Dionysus can lead him away through the city streets
    without being seen. Dionysus answers that Pentheus will have a lonely, untried
    path and that he will guide him. Pentheus says he cares only that the Bacchanals
    not triumph, goes into his halls to decide what to do, and remains uncertain whether
    to attack them with armed force or follow Dionysus' plan.
