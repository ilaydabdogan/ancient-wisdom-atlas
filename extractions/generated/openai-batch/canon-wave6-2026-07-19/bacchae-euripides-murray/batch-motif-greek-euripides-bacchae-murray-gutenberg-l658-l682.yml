  summary: The Chorus praises Teiresias and Bromios. Cadmus urges Pentheus to follow
    Teiresias, remain with the group, acknowledge the god for the honor of Semele
    and their line, remember Actaeon's death for boasting against Artemis, and accept
    a wreath and prayerful humility before the god.
