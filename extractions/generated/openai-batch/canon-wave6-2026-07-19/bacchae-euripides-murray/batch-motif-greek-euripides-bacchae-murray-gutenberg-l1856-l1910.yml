canonical_text:
  quote: What else is Wisdom?
  summary: The Chorus sings in two voices. Some Maidens long for the return of nocturnal
    dances and imagine fawn-like escape into wild places beyond human disturbance.
    Others affirm the slow, unfailing strength of God, judgment on proud human will,
    and the enduring power of divine or natural law. A refrain defines wisdom as freedom
    from fear, patient restraint over hate, and love of loveliness.
  language: English
  quote_policy: quoted
