canonical_text:
  quote: ''
  summary: Dionysus announces that Pentheus is going toward doom and summons Agave
    and the Cadmeian sisters to greet him at a high ordeal. The chorus calls on raging
    forces to drive the mountain women against the disguised spy, imagines him discovered
    among rock and pine, invokes Justice and the Wrath of the Lord to smite him, and
    reflects on divine law, human violence, knowledge, and godliness.
  language: English
  quote_policy: summarized
