  text: Dionysus says the addressee walks to a fell doom and that his name will become
    a lasting sign.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dionysus tells Agave and the Cadmeian sisters to reach out their arms and
    greet the proud prince to a high ordeal where only God and himself go unscathed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A stage direction states that Dionysus exits following Pentheus.
  category: action
  evidence_refs:
