- id: obs:4
  text: The chorus addresses raging hounds and sprites of the maddened mind, sending
    them up the mountain road to the wild Maids of God and asking them to fill the
    women’s eyes with rage against a spy in woman’s guise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Bacchanal imagines watchers noticing eyes in rock and in a dark pine-tree,
    and asks whether the first to mark them is the spy’s mother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bacchanal describes the approaching figure as haunting the women’s heights
