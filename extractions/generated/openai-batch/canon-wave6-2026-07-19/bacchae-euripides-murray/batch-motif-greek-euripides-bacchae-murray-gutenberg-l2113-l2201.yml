  evidence_refs:
  - ev:3
- id: obs:7
  text: The chorus invokes Justice and the Wrath of the Lord, with a lifted sword,
    to smite the throat and heart of the tyrannous, lawless, Godless seed of Echion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Other Maidens say that the offender marched against God’s light and God’s
    mother’s light, and tried by man’s violence to hold unconquerable things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Bacchanal says a strait pitiless mind is death to godliness, says that knowledge
