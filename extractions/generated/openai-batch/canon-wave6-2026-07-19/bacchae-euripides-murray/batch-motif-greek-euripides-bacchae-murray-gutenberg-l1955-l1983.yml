canonical_text:
  quote: ''
  summary: Dionysus tells Pentheus that his former wrath has turned gentle and that
    his eyes have been unsealed. Pentheus asks whether he looks like Ino or his mother.
    Dionysus says he seems to see those women in him, notices a displaced lock of
    hair under the coif, and tends Pentheus by setting his head and hair aright. Pentheus
    says the hair moved while he tossed his head in dancing and cried the god's holy
    music.
