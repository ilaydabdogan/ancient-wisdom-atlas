canonical_text:
  quote: ''
  summary: The chorus of Bacchic maidens sings of coming from Asia to honor Dionysus/Bromios,
    blesses the worshipper who joins mountain rites, recounts Dionysus' fiery and
    divine birth through Semele and Zeus, describes ritual dress, wands, music, serpents,
    mountain ecstasy, animal rending, miraculous abundance, and the summons of Bacchae
    to the hills. Teiresias then enters, old and blind, wearing Bacchic ivy and fawn-skin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chorus identifies itself as maidens who came from Asia and the dayspring
    to honor Bromios and sing an appointed old song to Dionysus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A blessed worshipper is described as drinking the Living Fountain, having
    sins lifted, and worshipping on the mountain where Cybele ordains.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Worshippers are described with ivy on the head and a thyrsus held high, calling
    Bacchae to bring Bromios from Phrygia to street, town, and tower.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The song recounts an unborn child cast down by his mother in thunder and fire,
    after which Zeus creates a new place of birth and hides the child in his own flesh
    until the proper time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The god is described as horned and crowned with serpents; serpents are also
    said to be wound in the maidens' wands and to sound in their hair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thebes is addressed as the nurse of Semele and is called to crown its towers
    with ivy and bryony, lift oak and pine wands, and wear fawn-skin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bromios is said to guide his companies hillward, including believing maids
    taken away from loom and weaving by his breath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage links a Cretan cavern, Corybant, timbrel, Phrygian chant, pipes,
    Mother Rhea, Satyrs, and Dionysus in a sequence of ritual music transmission.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mountain rite includes swooning from the race, clinging fawn-skin, blood
