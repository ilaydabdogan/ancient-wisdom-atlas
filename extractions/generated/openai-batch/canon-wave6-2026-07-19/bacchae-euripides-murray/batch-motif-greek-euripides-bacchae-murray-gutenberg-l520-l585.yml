canonical_text:
  quote: '"Wives, our own sisters, from their hearths are flown / To wild and secret
    rites"'
  summary: Pentheus reports rumors that Theban women have left their homes for secret
    hill rites honoring Dionysus, says he has imprisoned some and will hunt the rest,
    describes and threatens a foreign stranger associated with the rites, rejects
    the story of Dionysus' birth from Zeus, rebukes Teiresias and Cadmus for Bacchic
    dress, and is briefly criticized by the Chorus Leader.
  language: English
  quote_policy: quoted
