  summary: The passage is a commentary note on Bacchic and Orphic ritual material
    in and around The Bacchae. It describes mountain possession, animal dismemberment,
    bull-blood sacrament, identification of Dionysus with bull and serpent forms,
    the god's two births, Cadmus' dragon-teeth myth, and fire or ether as the material
    of apparitions.
