canonical_text:
  quote: ''
  summary: Teiresias rebukes Pentheus for rejecting the new god, praises Dionysus
    as a Semele-born power who found wine and relieves human grief, pairs him with
    Demeter as a chief human benefactor, explains a corrected account of Zeus protecting
    the divine child from Hera, and describes Dionysus as connected with sacrifice,
    prophecy, ecstatic frenzy, battle panic, and future Delphic manifestation. He
    urges Pentheus to accept the god with sacrifice, prayer, wreathing, and dance,
    defends the purity of women in the rites, and declares that he and Cadmus will
    honor Dionysus despite old age.
  language: English
  quote_policy: summarized
