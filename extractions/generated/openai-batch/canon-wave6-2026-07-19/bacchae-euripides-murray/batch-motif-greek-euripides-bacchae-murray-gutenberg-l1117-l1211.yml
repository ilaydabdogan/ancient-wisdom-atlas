canonical_text:
  quote: ''
  summary: Dionysus warns that the god Pentheus denies will bring recompense for Pentheus's
    offense, and Dionysus is led bound to a dungeon. The chorus invokes the river
    Dircê, recalls the divine child's birth through fire and a second portal, describes
    Pentheus as dragon- and earth-born, laments the captive priest/friend, and calls
    Dionysus to come with his wand. The chorus imagines Dionysus in sacred landscapes
    and recalls Orpheus's music before envisioning Dionysus's approach with Maenads
    across rivers.
  language: English
  quote_policy: summarized
