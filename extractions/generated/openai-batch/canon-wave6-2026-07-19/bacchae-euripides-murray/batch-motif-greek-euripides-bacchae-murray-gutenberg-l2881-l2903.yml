canonical_text:
  quote: For thou must change and be a Serpent Thing
  summary: Dionysus prophesies that an unnamed addressee will become a serpent-like
    being, with Harmonia beside him; at Zeus' word, the addressee and queen will travel
    by a cattle-drawn chariot through many lands with a destructive armed host until
    reaching Apollo's dwelling and being driven back. Ares will preserve only the
    couple alive to the Islands of the Blest. Dionysus then identifies himself as
    Zeus' son and says that recognizing Truth would have made the Child of God their
    friend.
  language: English
  quote_policy: quoted
