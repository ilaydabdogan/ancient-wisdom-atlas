canonical_text:
  quote: Come! Look upon this prize, this lion's spoil
  summary: The Leader urges Agave to show the trophy of her deed. Agave calls the
    people of Thebes to see what she calls a lion's spoil, claims that Cadmus' daughters
    took it with bare hands rather than weapons, calls for her father and for her
    son Pentheus, and says the lion's head should be nailed to the house. A stage
    direction shows her moving through the crowd with the head while Cadmus enters
    from the Mountain with attendants bearing Pentheus' body on a bier.
  language: English
