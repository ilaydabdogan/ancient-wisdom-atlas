canonical_text:
  quote: There be many shapes of mystery.
  summary: 'The passage closes the drama with a chorus on divine mystery and unexpected
    outcomes, then gives introductory notes explaining Dionysus myth and religion:
    Semelê’s fatal vision of Zeus, the child’s preservation and second birth, Dionysus
    as a many-named god of mountains, intoxication, vine, and animal forms, and Orphic
    reinterpretations involving purification, afterlife reward, initiatory rebirth,
    mystical union with the god, and sacrifice of Dionysus.'
  language: English
  quote_policy: quoted
