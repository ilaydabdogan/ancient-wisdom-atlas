canonical_text:
  quote: ''
  summary: The Chorus praises Dionysus and the joy, wine, dancing, music, and relief
    associated with his worship; warns that proud scorn of unseen law brings calamity;
    imagines sacred destinations such as Cyprus, Paphos, and Olympus; and ends as
    guards bring in Dionysus bound before Pentheus emerges from the castle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group of maidens addresses an unnamed high, recording purity or golden-winged
    figure and asks whether it hears an angry king's rage and scorn against the god.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god is described as the Lord of Many Voices, born of a mortal mother,
    associated with garlands, dancing, prayer, music, laughter, grape-blood, feasts,
    slumber, and the ending of pain and hate.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Chorus says that scorn for unseen law and claims beyond mortal measure
    lead to calamity, while quiet, simple, true life remains secure.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hidden watchers in the skies are said to see human life and value well-done
    deeds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Chorus expresses longing for Cyprus and Paphos, described with Aphrodite,
    sea-foam, the Loves, the Nile's mouths, waves, and seaward caves.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olympus is described as a high fair place where the Muses dwell, with Grace,
    Heart's Desire, peace, and a Spirit of Guiding Fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dionysus is called a God of Heaven, born in majesty, yet joyful in the Earth;
    he loves Peace, gives wine to all living things, and may burn with anger against
    those who spurn joy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Chorus advises loving Day and Night, being glad of Dark and Light, averting
    one's eyes from proud wisdom, and trusting the deeds and faith of common humanity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the Chorus ceases, guards return leading Dionysus bound; a commanding
    soldier stands forth, and Pentheus comes out from the castle after hearing the
    feet.
  category: action
  evidence_refs:
  - ev:5
