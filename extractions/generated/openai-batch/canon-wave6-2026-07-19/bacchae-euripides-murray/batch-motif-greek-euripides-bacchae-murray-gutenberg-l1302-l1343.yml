canonical_text:
  quote: ''
  summary: 'The Leader asks Dionysus how he escaped. Dionysus says he freed himself
    and was never actually bound. He reports that Pentheus, in wrath, bound a Bull
    of Offering, then reacted to divine signs: a Voice, the coming of the Lord, a
    shaking house, and a flame over the Lord''s mother''s tomb. Pentheus sought water,
    returned to the prison with a sword, and struck at an illusory image or emptiness.
    Dionysus says God overthrew the house, leaving Pentheus exhausted. Dionysus departs
    peacefully to his Chosen and prepares to face Pentheus gently as Pentheus enters
    in fury.'
  language: English
  quote_policy: summarized
