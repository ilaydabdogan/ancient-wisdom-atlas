canonical_text:
  quote: ''
  summary: Translator's notes explain selected passages of The Bacchae, including
    the personification of Purity, sacred emblems used in mysteries, the humiliation
    and later divine power of Dionysus, Nysa and Thracian rivers, Bromios manifesting
    as a voice, Pentheus's coercive Bacchic possession and dress, Orphic formulae
    in a chorus, Pentheus seeing Dionysus in mystic animal shape, and madness preparing
    Agave's delusion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hosia, translated as Purity, is described as one of many abstractions half
    personified by philosophy and Orphism, and possibly as an adjectival epithet,
    the Immaculate One, of a more definite goddess such as Nemesis.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mysteries or special forms of worship are said to have relics or sacred implements
    without which rites could not be performed; a Herodotean example is given in which
    Telines of Gela stole sacred implements of the nether gods, preventing worship.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note considers whether soldiers' threats against Dionysus are carried
    out, including cutting off a tress and taking his rod, and says it is more likely
    that his external humiliation is complete before his superhuman powers appear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nysa is described as an unknown divine mountain apparently formed to explain
    the second part of the name Dionysus.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Lydias, Axios, and another Thracian river are named as rivers Dionysus
    must cross in his passage from the East.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bromios is called the God of Many Voices and is said to manifest himself as
    a voice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Pentheus is described as struggling against a process called hypnotising while
    being amazed at himself for consenting and repeatedly finding reasons for doing
    so.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pentheus's robe and coif are explained as marks of Thracian dress worn by
    Thracian followers of Dionysus and notably by Orpheus; Greeks of Euripides' time
    viewed such dress as women's clothing.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A chorus refrain about a fawn is described as difficult to interpret and connected
    by the translator with Orphic formulae; the note contrasts furious Bacchanal elements
    of the Chorus with idealised Bacchic religion.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Pentheus, in Bacchic possession, is said to see fitfully the mystic shapes
    of the God beneath human disguise, including the question of a wild bull, and
    to experience second-sight, exaltation of spirit, and supernatural strength.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The same change is said to have come peacefully and for good to the two Old
    Men but to Pentheus by force, stormily and for evil, because his will was against
    the God.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The phrase hounds raging and blind is glossed as Spirits of Madness and said
    to prepare for Agave's delusion.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Acheloüs is identified as the Father of all Rivers.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: The name Pentheus is said to suggest mourner, from penthos, mourning.
  category: attribute
  evidence_refs:
  - ev:13
