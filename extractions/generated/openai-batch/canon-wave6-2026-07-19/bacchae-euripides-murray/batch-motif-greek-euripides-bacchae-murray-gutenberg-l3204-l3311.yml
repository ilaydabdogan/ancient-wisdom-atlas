comparison_claims:
- id: claim:1
  claim: 'The Bacchae note''s sacred emblems have the same ritual function as the
    Herodotean emblems stolen by Telines: without them worship cannot be performed.'
  claim_level: same_function
  target: Herodotus vii.153, Telines of Gela and the sacred implements of the nether
    gods
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage supplies only a brief citation to Herodotus and does not
    provide details of the Herodotean episode beyond the theft and ritual consequence.
- id: claim:2
  claim: Pentheus's robe and coif are explained as part of an earlier Thracian Dionysiac
    dress tradition also associated with Orpheus, though Euripidean Greeks interpreted
    the costume as women's dress.
  claim_level: same_function
  target: Thracian followers of Dionysus and Orpheus as wearers of robe and coif
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The note asserts a costume-tradition connection but does not quote
    the original legend or provide independent evidence in this passage.
- id: claim:3
  claim: Pentheus's second-sight, exaltation, and supernatural strength perform the
    same Bacchic change as that experienced by the two Old Men, but the moral and
    emotional outcome differs.
  claim_level: same_function
  target: The two Old Men in The Bacchae
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: high
  limitations: 'The comparison is internal to The Bacchae and comes through the translator''s
    note; the same evidence also states the contrast: peaceful and good for the Old
