  summary: Teiresias and Cadmus prepare to go together, linking hands. They speak
    against despising divine mysteries and affirm inherited ancestral wisdom. Teiresias
    says the god seeks honors from all mortals, without distinction between young
    and old. Cadmus then looks toward the Mountain, sees Pentheus approaching, identifies
    him as the ruler he raised in his stead, and the two elders stand partly concealed
    as Pentheus enters with a bodyguard and speaks to a soldier.
