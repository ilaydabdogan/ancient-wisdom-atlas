canonical_text:
  quote: ''
  summary: A messenger reports how Pentheus, guided by the Stranger to Cithaeron,
    secretly watches the Maenads. The Stranger bends a pine tree so Pentheus can climb
    it, then a divine voice summons the Maenads to avenge the insult. Agave and the
    other women topple the tree, Pentheus begs his mother to recognize him, and the
    possessed women tear him apart. Agave carries his head on a wand in triumph, believing
    it a trophy, while the messenger reflects on obedience to the god.
  language: English
  quote_policy: summarized
