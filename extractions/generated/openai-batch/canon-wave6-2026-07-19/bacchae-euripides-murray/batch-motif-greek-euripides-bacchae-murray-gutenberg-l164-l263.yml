canonical_text:
  quote: ''
  summary: In the prologue at Thebes, Dionysus appears in human form beside Semele's
    tomb, recounts his divine birth, his spread of mystery rites, his anger at Theban
    denial, the displacement of Theban women to the mountains, and his conflict with
    Pentheus. He then summons his Eastern followers, who enter with Dionysian dress,
    instruments, and sacred wands to begin worship.
  language: English
  quote_policy: summarized
