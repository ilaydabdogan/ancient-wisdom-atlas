canonical_text:
  quote: ''
  summary: Manawyddan and Pryderi repeatedly take up crafts in different towns, outdo
    local craftsmen, receive warnings that the craftsmen intend to kill them, and
    depart rather than fight. They return to Dyved and live at Narberth by hunting.
    During a hunt, their dogs recoil from a bush, a pure white boar appears, and the
    pursuit leads them to a newly built castle in a place formerly without buildings.
    The boar and dogs enter and disappear. Manawyddan warns Pryderi not to enter,
    saying the castle was caused by a spell over the land, but Pryderi goes inside
    and finds an empty interior with a central fountain, a golden bowl on a marble
    slab, and chains hanging from the air.
  language: English
  quote_policy: summarized
