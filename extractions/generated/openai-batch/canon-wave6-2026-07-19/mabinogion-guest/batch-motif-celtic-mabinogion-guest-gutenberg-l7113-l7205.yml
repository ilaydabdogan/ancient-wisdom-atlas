    shields, local craftsmen and townsmen resolve to kill them, and Manawyddan again
    counsels departure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Manawyddan proposes shoemaking, says he will teach Pryderi to stitch, and
    plans to buy ready-dressed leather.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Manawyddan buys high-quality cordwal, works with a goldsmith to make and gild
