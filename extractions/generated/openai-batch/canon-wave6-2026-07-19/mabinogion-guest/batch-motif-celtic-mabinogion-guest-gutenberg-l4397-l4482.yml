canonical_text:
  quote: Four white trefoils sprung up wherever she trod.
  summary: Arthur's embassy reaches Custennin the herdsman near Yspaddaden Penkawr's
    castle while seeking Olwen for Kilhwch. Custennin's wife recognizes Kilhwch, warns
    of the deadly quest, reveals a hidden surviving son, summons Olwen after a pledge
    of safety, and Olwen advises Kilhwch to seek her father's consent and satisfy
    his demands.
  language: English
  quote_policy: quoted
