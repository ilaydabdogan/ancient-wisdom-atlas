canonical_text:
  quote: ''
  summary: Arthur and Owain play chess while successive richly dressed youths come
    from tents marked by serpent, lion, and eagle emblems to report that Arthur’s
    attendants are attacking Owain’s Ravens. Arthur repeatedly tells Owain to continue
    the game. After the third report, Owain orders a banner raised in the thickest
    part of the fight; the Ravens regain force, rise into the air, and attack the
    men.
  language: English
