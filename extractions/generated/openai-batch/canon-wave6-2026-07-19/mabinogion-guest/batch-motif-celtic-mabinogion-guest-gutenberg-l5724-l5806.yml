canonical_text:
  quote: ''
  summary: Arthur and Owain continue playing chess while successive armoured knights
    report that Owain’s Ravens are killing attendants, pages, household members, and
    sons of nobles. The Ravens tear men and horses apart and drop pieces from the
    air. Arthur repeatedly asks Owain to forbid the Ravens, but Owain tells him to
    play the game. After a third appeal, Arthur crushes the golden chessmen, Owain
    orders Gwres son of Rheged to lower his banner, and peace follows.
  language: English
