  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the tower, Gwalchmai sees a large smokeless blazing fire and a beauteous
    stately maiden seated by it; she welcomes him, and they eat and converse.
  category: sequence
  evidence_refs:
