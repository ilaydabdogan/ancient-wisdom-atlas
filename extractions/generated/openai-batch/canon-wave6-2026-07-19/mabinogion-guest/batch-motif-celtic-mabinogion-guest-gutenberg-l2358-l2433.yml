canonical_text:
  quote: ''
  summary: Gwalchmai arrives at a valley fortress, is offered lodging by its lord
    through a ring token, meets the lord's sister in a tower, and is accused by a
    hoary-headed man of having slain the Earl's father. Gwalchmai obtains a year to
    complete Arthur's embassy and promises to return. Peredur then continues his search
    for tidings of the black maiden, is admonished by a priest for wearing armor on
    Good Friday, accepts a changed mode of travel and lodging, and receives directions
    toward the Castle of Wonders by way of a mountain, river valley, and King's palace
    associated with Easter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At dawn Gwalchmai comes to a valley containing a fortress, a palace, and lofty
    towers, and meets the mounted owner of the palace as he is going out to hunt.
