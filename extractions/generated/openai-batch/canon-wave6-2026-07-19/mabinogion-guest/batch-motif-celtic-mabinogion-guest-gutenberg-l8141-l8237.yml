canonical_text:
  quote: ''
  summary: Maxen Wledig, emperor of Rome, falls asleep during a hunt and dreams of
    traveling through a river valley, over a world-high mountain, across seas and
    islands, and into a richly adorned castle. There he sees chess players, an elder
    carving chessmen, and a radiant maiden. He embraces the maiden, wakes because
    of the noise of the hunt, and afterward longs for her, seeking sleep because he
    can see her only in dreams.
  language: English
  quote_policy: summarized
