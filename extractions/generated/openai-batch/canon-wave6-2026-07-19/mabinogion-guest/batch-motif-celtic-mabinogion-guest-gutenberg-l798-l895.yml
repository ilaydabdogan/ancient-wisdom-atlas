canonical_text:
  quote: ''
  summary: Luned conceals Owain and arranges his presentation to the Countess. The
    Countess recognizes him as the slayer of her lord but consults her subjects, who
    consent that she marry an outside defender. Owain marries her, receives homage,
    and defends the Fountain for three years. Arthur, grieving Owain's absence, sets
    out with his household, guided by Kynon. At a vast castle they receive exceptional
    hospitality, then proceed to the black man, green tree, fountain, bowl, and slab.
    Kai pours water on the slab, causing thunder, a destructive shower, a leafless
    tree, birdsong, and the arrival of a black-clad knight who defeats him.
  language: English
  quote_policy: summarized
