- id: obs:1
  text: Luned pretends to go to Arthur's Court but returns to the chamber where she
    left Owain and remains there for the length of such a journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Luned tells the Countess that she has succeeded in her mission and asks when
    to present the chieftain who has come with her; the Countess names the next day
    at midday and says she will assemble the town.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Owain dresses in yellow satin with gold lace and variegated leather shoes
    fastened by golden clasps shaped like lions before going with Luned to the Countess.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Countess says Owain is surely the man who killed her lord; Luned argues
    that his greater strength is advantageous and that the past cannot be remedied.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Countess assembles her subjects and says the earldom is defenseless without
