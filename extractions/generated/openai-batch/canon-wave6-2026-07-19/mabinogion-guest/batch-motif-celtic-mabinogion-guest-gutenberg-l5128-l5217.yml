canonical_text:
  quote: ''
  summary: The passage recounts the abduction of Creiddylad, Arthur’s imposed peace
    requiring Gwyn ap Nudd and Gwythyr to fight for her every May Day until doomsday,
    several quests for animals and boar-trophies, Menw’s bird-shaped reconnaissance
    of Twrch Trwyth, the forcible taking of Diwrnach’s cauldron in Ireland, and Arthur’s
    prolonged battle with Twrch Trwyth, a former king transformed into a swine by
    God for his sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creiddylad and Gwythyr were betrothed, but before she became Gwythyr’s bride
    Gwyn ap Nudd carried her away by force.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gwythyr gathered a host and fought Gwyn ap Nudd; Gwyn overcame him and captured
    several named nobles.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Nwython was killed, his heart was removed, and Kyledyr was constrained to
    eat his father’s heart; Kyledyr became mad afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arthur summoned Gwyn ap Nudd, freed the imprisoned nobles, and made peace
    between Gwyn and Gwythyr.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The peace terms kept Creiddylad in her father’s house and required Gwyn and
    Gwythyr to fight for her every first of May until the day of doom, with the eventual
    conqueror to have her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After reconciling the chieftains, Arthur obtained Mygdwn, Gweddw’s horse,
    and the leash of Cwrs Cant Ewin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Arthur traveled with companions to seek dogs, went to western Ireland in search
    of Gwrgi Seven, captured Kyledyr Wyllt in the North, and pursued Yskithyrwyn Penbaedd.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kaw attacked Yskithyrwyn Penbaedd with an axe, split the boar’s head, and
    took its tusk; the passage says Cavall, Arthur’s own dog, killed the boar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arthur sent Menw to determine whether precious things were between Twrch Trwyth’s
    ears; Menw took the form of a bird and tried to snatch one, but brought away only
    a bristle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Twrch Trwyth shook himself angrily, venom fell on Menw, and Menw was
    never well afterward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Arthur sent an embassy to ask for Diwrnach Wyddel’s cauldron; although Odgar
    commanded Diwrnach to give it, Diwrnach refused.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bedwyr seized the cauldron, Hygwyd carried it, Llenlleawg seized Caledvwlch,
    Diwrnach and his company were slain, and Arthur’s men carried away the cauldron
    full of Irish money.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Arthur summoned many warriors from Britain, adjacent islands, France, Armorica,
    Normandy, and the Summer Country; in Ireland, saints sought his protection, received
    it, and blessed him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Twrch Trwyth was with seven young pigs; dogs were set on him, Irish and Arthurian
    forces fought him, he laid waste part of Ireland, and Arthur fought him nine nights
    and nine days without killing even one pig.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Arthur told his warriors that Twrch Trwyth had once been a king and that God
