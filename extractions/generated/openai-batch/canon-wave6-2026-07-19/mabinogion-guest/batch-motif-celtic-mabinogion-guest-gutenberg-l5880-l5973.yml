canonical_text:
  quote: ''
  summary: Pwyll, lord of Dyved, goes hunting, becomes separated from his companions,
    and encounters strange hounds that have killed a stag. After driving them away
    and setting his own dogs on the stag, he is rebuked by Arawn, King of Annwvyn.
    Arawn proposes that Pwyll take his form and place in Annwvyn for a year, defeat
    Havgan with a single stroke, and receive Arawn's friendship, while Arawn takes
    Pwyll's form in Dyved. Pwyll is guided to Annwvyn's court, where he is accepted
    as Arawn and feasts with the Queen and household.
  language: English
  quote_policy: summarized
