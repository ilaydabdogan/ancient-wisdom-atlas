canonical_text:
  quote: ''
  summary: Peredur encounters a knight who says he has been Arthur’s enemy and has
    slain Arthur’s men. Peredur defeats him, grants mercy on condition that he swear
    to go to Arthur’s Court and report Peredur’s victory, his loyalty to Arthur’s
    service, and his threat against Kai over the insult to the dwarf and dwarfess.
    Peredur later overthrows sixteen more knights in the same week, sending all to
    Arthur’s Court with the same message. Arthur reproves Kai, who is grieved.
