candidate_motifs:
- id: motif:1
  label: linked quest for marvels
  taxonomy_refs:
  - mystical_quest
  basis: Arthur repeatedly asks which marvel should be sought and the passage presents
    a sequence of tasks involving Mabon, Gast Rhymhi’s cubs, flax-seed, Dillus’s beard-leash,
    and Drudwyn.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  - ev:10
  - ev:13
  confidence: high
  cautions: The passage calls them marvels and presents quest tasks; the taxonomy
    label is broad and does not imply a single unified ritual structure.
- id: motif:2
  label: abducted infant imprisoned until forceful rescue
  taxonomy_refs: []
  basis: Mabon was taken from his mother at three nights old, is discovered imprisoned
    and lamenting, and is freed when Arthur’s warriors attack and Kai breaks into
    the dungeon.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: No specific cause of the infant abduction or identity of the captor is
    given in this passage.
- id: motif:3
  label: animal guide carries heroes to hidden captive
  taxonomy_refs: []
  basis: The Salmon knows of the wrong near Gloucester and transports Kai and Gwrhyr
    on its shoulders to the prison wall where Mabon is heard.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not state that the Salmon is supernatural beyond its
    speech, knowledge, and carrying role.
- id: motif:4
  label: shapeshifted she-wolf restored to own form
  taxonomy_refs:
  - shapeshifter
  basis: Gast Rhymhi is found in the form of a she-wolf with two cubs, and God changes
    them again into their own form for Arthur.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not specify the original form or the cause of the transformation.
- id: motif:5
  label: grateful animals complete an impossible gathering task
  taxonomy_refs:
  - sacred_exchange
  basis: After Gwythyr saves the ant-hill from fire, the ants bless him and provide
    the full measure of flax-seed that no man could give, including the final seed
    from the lame pismire.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The exchange is explicit, but the taxonomy reference is approximate because
    the passage frames the reward through blessing and help rather than a formal sacred
    transaction.
- id: motif:6
  label: magical restraint made from a living enemy’s body hair
  taxonomy_refs: []
  basis: Kai states that Drudwyn can only be held by a leash made from Dillus’s beard,
    and that the beard must be plucked alive with wooden tweezers; the companions
    make such a leash.
  evidence_refs:
  - ev:10
  - ev:11
