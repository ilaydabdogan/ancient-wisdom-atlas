canonical_text:
  quote: "“Mabon the son of Modron...was taken away at three nights old from his mother.”"
  summary: 'The passage recounts several linked marvel-quests under Arthur: the Salmon
    guides Kai and Gwrhyr to Mabon’s prison at Gloucester, after which Arthur’s warriors
    free him by force; Arthur then seeks Gast Rhymhi’s cubs, finding her as a she-wolf
    in a cave and having God restore her and the cubs to their own form; Gwythyr saves
    an ant-hill from fire and the ants repay him by gathering flax-seed; Kai and Bedwyr
    locate Dillus Varvawc by smoke, take his living beard with wooden tweezers to
    make a leash for Drudwyn, and kill him; Arthur’s verse about the deed angers Kai,
    who refuses future aid.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Eagle comes to the Salmon of Llyn Llyw with an embassy from Arthur to
    ask about Mabon son of Modron, who was taken from his mother at three nights old.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Salmon says that with every tide it travels upriver toward Gloucester
    and has found a great wrong near the walls there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kai and Gwrhyr ride on the Salmon’s two shoulders to the prison wall and hear
    wailing from a dungeon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mabon identifies himself as the one imprisoned in the stone house and says
    that anything he gains will be obtained by fighting.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arthur summons the warriors of the Island to Gloucester; the castle is attacked,
    Kai breaks through the wall, carries Mabon out, and Mabon returns with Arthur
    at liberty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Arthur is told that Gast Rhymhi is in the form of a she-wolf with two cubs,
    below in a cave at Aber Cleddyf, and has often slain herds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Arthur travels by sea in Prydwen while others go by land; they surround Gast
    Rhymhi and her two cubs, and God changes them again into their own form.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gwythyr hears wailing on a mountain, goes toward it, draws his sword, and
    cuts off an ant-hill near the ground so that it escapes burning in the fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ants bless Gwythyr and provide nine bushels of flax-seed required by Yspaddaden
    Penkawr of Kilhwch, with a lame pismire bringing the final missing seed before
    night.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kai and Bedwyr sit on a beacon carn at the summit of Plinlimmon in extreme
    wind and see smoke to the south that does not bend with the wind.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kai and Bedwyr find Dillus Varvawc scorching a wild boar; Kai says that only
    a leash made from Dillus’s beard, plucked alive with wooden tweezers, can hold
    Drudwyn.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kai and Bedwyr let Dillus eat and fall asleep, make wooden tweezers, force
    him into a pit, pluck out his beard completely, and then kill him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Kai and Bedwyr bring the beard-leash to Arthur; Arthur composes an englyn
    about Kai’s deed, and Kai becomes angry and refuses to aid Arthur in future troubles
    or deaths of his men.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Arthur next asks which marvel should be sought, and the answer is Drudwyn,
    the cub of Greid son of Eri.
  category: speech
  evidence_refs:
  - ev:13
