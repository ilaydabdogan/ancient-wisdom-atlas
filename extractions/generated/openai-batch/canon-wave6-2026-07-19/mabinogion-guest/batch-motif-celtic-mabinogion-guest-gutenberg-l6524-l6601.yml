canonical_text:
  quote: ''
  summary: Bendigeid Vran sits at Harlech with his kin and nobles when ships arrive
    from Ireland bearing a peace token. Matholwch, king of Ireland, seeks Branwen
    in marriage so Ireland and the Island of the Mighty may be allied. After counsel,
    Branwen is given to him, and a wedding feast is held at Aberffraw under tents.
    Evnissyen, angered that Branwen was bestowed without his consent, mutilates Matholwch's
    horses, causing the act to be reported as an insult and prompting Matholwch to
    move toward his ships.
  language: English
  quote_policy: summarized
