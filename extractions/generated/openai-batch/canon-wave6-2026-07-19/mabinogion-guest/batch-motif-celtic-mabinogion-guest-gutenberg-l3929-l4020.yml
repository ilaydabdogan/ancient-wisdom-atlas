canonical_text:
  quote: ''
  summary: 'The passage concludes a Geraint episode: Geraint enters a mist, reaches
    an orchard and tent, sits in a disputed chair, defeats the knight who claims it,
    and sounds a horn that makes the mist vanish and brings reconciliation. The passage
    then begins Kilhwch and Olwen: Kilydd marries Goleuddydd, their son Kilhwch is
    born after communal prayers and found near swine, Goleuddydd dies after setting
    a remarriage condition involving a briar on her grave, and Kilydd violently takes
    King Doged''s wife, who later asks an old crone about her captor''s children and
    receives information about an heir and an existing son.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Geraint enters the mist and comes out into a large orchard containing an open
    space, a red satin tent, an apple-tree, and a huge hunting-horn hanging from the
    tree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the tent, a maiden sits in a golden chair, an empty chair stands opposite
    her, and Geraint sits in the empty chair despite her warning that it belongs to
    another man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mounted knight arrives after a tumult and challenges Geraint for shaming
    him by sitting in the chair.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Geraint and the knight fight with lances and strokes until Geraint splits
    the knight's shield and throws him to the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The defeated knight asks mercy, and Geraint asks that the game, the hedge
    of mist, magic, and enchantment no longer exist there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The knight says the mist will vanish if the horn is sounded by the knight
    who defeated him; Geraint sounds it, the mist vanishes, and the hosts are reconciled.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Kilydd marries Goleuddydd, and after their union the people pray that they
    may have an heir; a son is born through the people's prayers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: During pregnancy Goleuddydd becomes wild and wanders without habitation, regains
    reason when delivery is near, goes to a mountain with a swineherd and swine, gives
    birth through fear of the swine, and the swineherd brings the boy to the palace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The boy is named Kilhwch because he was found in a swine's burrow, and he
    is described as of gentle lineage and cousin to Arthur.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Before dying, Goleuddydd tells Kilydd not to take another wife until he sees
    a briar with two blossoms on her grave, and asks him to have the grave dressed
    every year so that nothing grows on it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: An attendant is sent every morning to inspect the grave, but at the end of
    the seventh year the promised grave-care is neglected.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kilydd later sees the briar at the burial place, takes counsel about finding
    a wife, and a counsellor identifies the wife of King Doged.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:13
  text: Kilydd's party kills King Doged, brings away Doged's wife and her daughter,
    and conquers Doged's lands.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The taken queen asks an old toothless crone where the children of the man
    who carried her away are; the crone first says he has no children, then says there
    is a prediction that he will have an heir by the queen and also that he has one
    son.
  category: speech
  evidence_refs:
  - ev:13
  - ev:14
