candidate_motifs:
- id: motif:1
  label: Hero enters enchanted mist and ends the enchantment
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: Geraint crosses a mist boundary, undergoes a chair challenge and combat,
    then demands the end of the hedge of mist, magic, and enchantment and sounds the
    horn that makes the mist vanish.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives only the episode's conclusion and does not explain the
    full origin or rules of the enchantment.
- id: motif:2
  label: Disputed seat provoking trial by combat
  taxonomy_refs:
  - initiation
  basis: Geraint sits in a chair that the maiden says belongs to a man who has never
    allowed another to use it; the owner arrives and demands satisfaction by combat.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The chair's larger social or ritual meaning is not explained in the passage.
- id: motif:3
  label: Horn blast removes magical obstruction
  taxonomy_refs:
  - mystical_quest
  basis: The horn hanging on the apple-tree can make the mist vanish only when blown
    by the knight who has defeated the chair's owner; Geraint blows it and the mist
    vanishes.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  confidence: high
  cautions: The available taxonomy has no horn-specific symbol category, so the mapping
    is to the broader quest/enchantment function.
- id: motif:4
  label: Prayed-for royal child born in animal-associated liminal setting
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  - royal_legitimacy
  basis: The people pray for an heir; the son is born through those prayers; his mother
    gives birth on a mountain near swine; he is named after being found in a swine's
    burrow and is described as gently born and cousin to Arthur.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage attributes the birth to prayers but does not state a direct
    divine conception; the animal-associated birth setting is literal but its meaning
    is not explained.
- id: motif:5
  label: Dying wife sets remarriage condition marked by growth on grave
  taxonomy_refs:
  - covenant
  - death_rebirth
  basis: Goleuddydd obtains Kilydd's promise not to take another wife until he sees
    a briar with two blossoms on her grave, and the later appearance of the briar
    triggers the search for a new wife.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage does not state that Goleuddydd returns from death; the death_rebirth
    taxonomy reference is only a cautious association with grave vegetation and posthumous
    condition.
- id: motif:6
  label: Violent taking of another king's wife and daughter
  taxonomy_refs:
  - stolen_beloved
  - royal_legitimacy
  basis: After counsel about a wife, Kilydd's party kills King Doged, brings away
    Doged's wife and her daughter, and conquers Doged's lands.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage frames the act as violence and conquest; it does not describe
