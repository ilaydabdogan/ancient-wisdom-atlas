canonical_text:
  quote: "“Though thou get this, there is yet that which thou wilt not get.”"
  summary: A speaker sets a sequence of increasingly difficult requirements connected
    with a daughter’s wedding and marriage feast. The addressee repeatedly answers
    that each requirement will be easy. Required items include flax for a wimple,
    special honey, unique vessels and feast objects, a self-playing harp, a cauldron,
    a tusk for shaving, sorceress blood, heat-preserving and sour-proof bottles, comb
    and scissors from Twrch Trwyth, a hunting whelp, and a unique leash.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker points to red tilled ground and says nine bushels of flax were
    sown there when he first met the maiden’s mother, but none has sprung up.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker requires flax to sow in a new land so that it may grow into material
    for a white wimple for his daughter’s head on the wedding day.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker requires honey nine times sweeter than honey of the virgin swarm,
    without scum and bees, to make bragget for the feast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker requires the vessel of Llwyr son of Llwyryon, described as uniquely
    able to hold the drink and not obtainable by free gift or compulsion.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The basket of Gwyddneu Garanhir is described as providing desired meat for
    thrice nine men at a time, even if the whole world came together.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker requires the horn of Gwlgawd Gododin to serve liquor on the wedding
    night.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The harp of Teirtu is described as playing or ceasing by a man’s desire, and
    the speaker requires it for the wedding night.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker requires the cauldron of Diwrnach Wyddel, steward of Odgar son
    of Aedd, king of Ireland, to boil meat for the marriage feast.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker requires the tusk of Yskithyrwyn Penbaedd for shaving, and says
    it must be plucked alive from his head.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The speaker says only Odgar son of Aedd, king of Ireland, can pluck the tusk
    from Yskithyrwyn Penbaedd’s head.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker says he will trust only Gado of North Britain to keep the tusk;
    Gado rules threescore Cantrevs of North Britain and will not leave freely or under
    compulsion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The speaker requires blood from the jet-black sorceress, daughter of the pure
