canonical_text:
  quote: ''
  summary: Geraint returns to Arthur's court with Enid. Gwenhwyvar and Arthur welcome
    them after Geraint's victory over Edeyrn. Arthur gives Enid to Geraint in marriage,
    Enid is clothed in Gwenhwyvar's apparel and honored with the stag's head, and
    Geraint's fame grows through tournaments. Later, ambassadors from Cornwall ask
    Arthur to allow Geraint to return to his aging father Erbin to protect his lands
    and boundaries.
  language: English
  quote_policy: summarized
