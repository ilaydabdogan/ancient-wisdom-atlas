canonical_text:
  quote: ''
  summary: Geraint receives homage from the men of Cornwall and his chief men, accompanies
    Arthur's followers partway, surveys the bounds of his dominions, gains fame through
    tournaments and largesse, then withdraws into private life with Enid. Court murmuring
    reaches Erbin, who questions Enid. Enid laments Geraint's lost martial glory while
    he sleeps; her tears and words wake him, and he suspects her of loving another.
    He orders horse and arms prepared and commands Enid to dress in her meanest riding
    clothes for departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Erbin wants Geraint to ask the men whether they object to his coming to receive
    homage; the men answer that his coming would bring joy and honour, and Geraint
    receives homage from those present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arthur's followers remain until Geraint has finished receiving the homage
    of his chief men, then set out toward Arthur's Court; Geraint and Enid accompany
    them as far as Diganhwy, where they part.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ondyaw advises Geraint to visit the uppermost parts of his dominions and inspect
    territorial boundaries; Geraint agrees, travels to the uttermost part with experienced
    guides and chief men, and keeps possession of the farthest point shown to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Geraint frequents tournaments, becomes acquainted with valiant men, gains
    fame, and enriches his court, companions, and nobles with horses, arms, and jewels.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After his fame spreads through the kingdom, Geraint begins to love ease and
    pleasure, remains in the palace, withdraws into Enid's chamber, gives up noble
    companionship, hunting, and amusements, and loses the hearts of the court host.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Murmuring and scoffing about Geraint reach Erbin, who asks Enid whether she
    caused Geraint to forsake his people and hosts; Enid denies it under confession
    to Heaven.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Enid is sorrowful and uncertain whether to warn Geraint about what she has
    heard, because speaking is hard but silence is also hard.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: On a summer morning Geraint sleeps on the edge of a couch in an apartment
    with glass windows; the sun shines on the couch, and the clothes have slipped
    from his arms and breast.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Enid gazes at Geraint's appearance and laments that she may be the cause that
    his arms and breast have lost their glory and warlike fame; her tears fall upon
    his breast.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Geraint wakes because of Enid's tears and words, and also because he forms
    the idea that she speaks from love for another man and a wish for other society.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Geraint calls his squire and orders him to prepare his horse and arms; he
    tells Enid to dress in her worst riding-dress and have her horse accoutred, saying
    she shall not return until she knows whether he has lost his strength.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Enid clothes herself in her meanest garments, says she does not know Geraint's
    meaning, and Geraint replies that she will not know it at that time.
  category: sequence
  evidence_refs:
  - ev:12
