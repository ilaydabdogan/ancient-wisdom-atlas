canonical_text:
  quote: ''
  summary: At a ranked feast, a royal-looking youth enters and asks Pwyll for a boon.
    Pwyll promises before hearing the request. The youth asks for Rhiannon, who is
    to be Pwyll’s bride, along with the feast and banquet. Rhiannon identifies him
    as Gwawl son of Clud, an unwanted suitor, and devises a plan involving a small
    bag, a one-year delay, a disguised return, hidden knights, and a horn signal.
    Pwyll gives what he can, while Rhiannon reserves the present feast for Dyved and
    promises a future banquet.
  language: English
