canonical_text:
  quote: ''
  summary: Peredur enters a cave and kills the Addanc, is offered marriage and land,
    accepts Etlym Gleddyv Coch as attendant, wins the Countess for Etlym, compels
    nobles at the Mound of Mourning to do homage, slays a guarded serpent connected
    with a contested stone, gives the stone to Etlym, and then reaches a valley of
    mills where the chief miller explains that the Empress of Cristinobyl seeks the
    most valiant man.
  language: English
