  quote: ''
  summary: In the heat, the wounded Geraint and Enid halt under trees in a wood. Arthur’s
    company arrives nearby. Kai confronts Geraint and is knocked down. Gwalchmai then
    confronts him, recognizes him, and secretly arranges for Arthur’s tent to be moved
    near the road. Arthur receives Geraint and Enid, refuses to let Geraint continue
    toward death, and orders shelter, physicians, provisions, and care for Enid.
  language: English
