canonical_text:
  quote: ''
  summary: Caridwen seeks to give her ugly son Avagddu honor through a cauldron of
    inspiration and science. Gwion Bach accidentally receives the three drops of inspiration,
    foresees danger, and flees. Caridwen pursues him through a chain of transformations,
    swallows him as a grain of wheat, bears him after nine months, and casts him in
    a leather bag into the sea. Elphin finds the bag in Gwyddno’s weir, names the
    radiant-browed child Taliesin, and the child begins to console and prophesy honor
    to Elphin.
  language: English
  quote_policy: summarized
