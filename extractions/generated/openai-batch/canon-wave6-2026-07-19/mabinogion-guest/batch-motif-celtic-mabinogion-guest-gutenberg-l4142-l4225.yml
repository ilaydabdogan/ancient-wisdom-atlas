canonical_text:
  quote: ''
  summary: 'Arthur grooms himself with a golden comb and silver-looped scissors, asks
    a youth to identify himself, and recognizes him as his cousin Kilhwch. Arthur
    promises any boon under oath, and Kilhwch asks him and his warriors to obtain
    Olwen daughter of Yspaddaden Penkawr. The passage then gives a long catalogue
    of Arthur’s warriors and kin, noting several extraordinary figures: men from the
    confines of hell, uncanny survivors of Camlan, figures of exceptional speed or
    light-footedness, and Teithi Hên, whose dominions were swallowed by the sea and
    whose defective knife led to his decline.'
  language: English
  quote_policy: summarized
