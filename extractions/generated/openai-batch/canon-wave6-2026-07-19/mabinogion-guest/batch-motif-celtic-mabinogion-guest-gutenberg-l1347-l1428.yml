canonical_text:
  quote: ''
  summary: At Arthur’s court an unnamed knight insults Gwenhwyvar with a golden goblet
    and challenges any avenger to meet him in the meadow. Peredur arrives in poor
    equipment seeking knighthood, is mocked, and is acclaimed by two previously silent
    dwarfs whom Kai then abuses. Kai sends Peredur after the challenger; Peredur kills
    him with a fork, gains the horse, armor, and goblet, and sends the goblet back
    while refusing to come to court until he has avenged the dwarfs against Kai.
  language: English
  quote_policy: summarized
