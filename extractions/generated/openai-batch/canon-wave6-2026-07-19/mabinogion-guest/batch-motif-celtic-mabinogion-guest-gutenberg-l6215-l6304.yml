canonical_text:
  quote: ''
  summary: 'Pwyll, disguised as a poor petitioner, enters the feast prepared for Gwawl
    and asks that a small bag be filled with meat. The bag does not fill until Gwawl
    steps into it, whereupon Pwyll traps him, summons his men, and humiliates him
    in the game called Badger in the Bag. Rhiannon and Heveydd advise a settlement:
    Gwawl must satisfy suitors and minstrels and pledge not to take revenge. Sureties
    are taken, Gwawl is released, and Pwyll and Rhiannon continue the feast, give
    gifts, depart together to Dyved, and rule prosperously.'
  language: English
  quote_policy: summarized
