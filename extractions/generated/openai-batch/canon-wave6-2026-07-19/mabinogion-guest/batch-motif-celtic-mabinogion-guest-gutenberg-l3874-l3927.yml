canonical_text:
  quote: ''
  summary: Geraint continues the journey with Enid and the Little King. At a divided
    road, a man warns them that the lower way leads to a hedge of mist enclosing enchanted
    games from which no one returns, but Geraint chooses that road. In Earl Owain's
    town and court, Geraint is hosted, refuses to avoid the games, arms himself, and
    comes to a towering hedge set with many severed heads, where he must enter alone
    by whatever way he can find.
  language: English
  quote_policy: summarized
