canonical_text:
  quote: ''
  summary: Geraint orders Enid to remain silent as they travel through a wilderness.
    Five armed horsemen emerge from a wood and plan to seize the horses, arms, and
    lady. Enid warns Geraint despite his command; he rebukes her, defeats the five
    attackers, and gives her charge of the captured horses and armor. They spend the
    night in a deep wood, where Geraint sleeps in armor while Enid watches the horses.
    In the morning they cross open country and a river, then meet a youth carrying
    food and drink for mowers, who offers Geraint the meal.
  language: English
  quote_policy: summarized
