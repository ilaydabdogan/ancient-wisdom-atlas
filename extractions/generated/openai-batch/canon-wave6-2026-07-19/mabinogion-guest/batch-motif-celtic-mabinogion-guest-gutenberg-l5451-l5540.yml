canonical_text:
  quote: ''
  summary: Rhonabwy falls asleep and experiences a journey across Argyngroeg toward
    the ford of Rhyd y Groes on the Severn. A fierce yellow-and-green rider, Iddawc,
    pursues the company, grants mercy, and explains his role in causing the battle
    of Camlan by distorting Arthur's peace message to Medrawd. A second red-and-yellow
    rider, Rhuvawn Pebyr, appears. The travelers reach a vast encampment at the ford,
    where Arthur sits on a flat island with attendants. Iddawc points out Arthur's
    ring stone, which enables Rhonabwy to remember the night's vision. Rhuvawn's red
    troop encamps above the ford.
  language: English
  quote_policy: summarized
