canonical_text:
  quote: ''
  summary: Peredur rides through wilderness without food or drink, comes to a tent
    in a glade that he mistakes for a church, and is welcomed by a richly adorned
    maiden. Citing his mother's instructions, he takes food, drink, and the maiden's
    ring with her permission, then departs. The knight who owns the tent, called the
    Lord of the Glade, returns, questions the maiden, disbelieves her statement that
    Peredur did her no harm, imposes a wandering punishment on her, and sets out to
    seek Peredur for revenge.
  language: English
  quote_policy: summarized
