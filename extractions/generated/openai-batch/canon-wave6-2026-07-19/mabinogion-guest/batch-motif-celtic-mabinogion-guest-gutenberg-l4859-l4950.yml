canonical_text:
  quote: ''
  summary: A task-giver names the sword of Gwrnach the Giant as an object that must
    be obtained before his daughter can be won. A party journeys to Gwrnach's vast
    castle, where entry is denied except to a craftsman. Kai gains entry as a sword-burnisher,
    admits Bedwyr as his companion, and Goreu brings the remaining companions through
    the wards. After polishing the sword, Kai obtains the scabbard as a pretext and
    cuts off Gwrnach's head with the giant's own sword. The party despoils the castle
    and returns to Arthur's court with the sword.
  language: English
  quote_policy: summarized
