canonical_text:
  quote: ''
  summary: At Arthur's principal palace in Caerlleon, a harsh black maiden enters,
    refuses to greet Peredur, and rebukes him for not asking about the wonders at
    the Court of the Lame King, especially the blood-streaming lance. She says this
    failure prevents the king's healing and brings conflict. She then announces places
    where fame may be won, including a mountain castle where a maiden is imprisoned.
    Gwalchmai vows to try to free the maiden, while Peredur vows to learn the meaning
    of the lance. An armed knight arrives, accuses Gwalchmai of treacherously killing
    his lord, and demands an encounter before his king. Gwalchmai accepts; he and
    Peredur equip themselves and depart separately because of their friendship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arthur is at Caerlleon upon Usk, called his principal palace, and four named
    men sit on a velvet carpet in the center of the hall.
  category: setting
  evidence_refs:
  - ev:1
