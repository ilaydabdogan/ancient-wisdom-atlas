- id: obs:3
  text: The maiden is described with a rough and hideous aspect, black face and hands,
    mismatched eyes, yellow teeth, a raised stomach, a crooked back, large bony legs,
    and very large feet and legs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden greets Arthur and his household but excludes Peredur and addresses
    him with harsh and angry words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The maiden says Peredur saw a youth carrying a streaming spear with blood
    flowing from its points at the Court of the Lame King, along with other wonders,
    but did not ask their meaning or cause.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden says that if Peredur had asked, the Lame King would have been restored
    to health and his dominions to peace; she says instead there will be battles,
    dead knights, widows, and portionless maidens because of Peredur.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The maiden tells Arthur that her distant dwelling is a stately castle containing
