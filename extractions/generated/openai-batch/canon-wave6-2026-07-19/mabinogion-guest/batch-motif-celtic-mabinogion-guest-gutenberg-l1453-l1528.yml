canonical_text:
  quote: ''
  summary: Peredur travels through desert woods to two castles. At the first, a lame
    hoary-headed man receives him, tests him through cudgel-and-shield play with two
    sons, identifies himself as Peredur’s maternal uncle, promises instruction, raises
    him toward knighthood, and tells him not to ask about wondrous things. At the
    second castle, another hoary-headed uncle tests Peredur with a sword and iron
    staple, says he has reached two-thirds of his strength, and then unexplained processions
    of a bleeding spear and a bloody severed head provoke lamentation while Peredur
    refrains from asking their meaning.
  language: English
  quote_policy: summarized
