canonical_text:
  quote: ''
  summary: Kynon recounts reaching a tree and fountain on a summit, casting water
    from a silver bowl onto a marble slab, enduring a violent storm, hearing birds
    sing on the stripped tree, and being defeated by a black-clad knight who takes
    his horse. Back at Arthur’s court, Owain resolves to seek the same place, is taunted
    by Kai and defended by Gwenhwyvar, then departs, reaches the castle and its inhabitants
    as Kynon described, and tells the yellow man that he seeks the knight who guards
    the fountain.
  language: English
  quote_policy: summarized
