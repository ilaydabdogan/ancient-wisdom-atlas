canonical_text:
  quote: ''
  summary: Math receives Gwydion and Gilvaethwy after their wrongdoing, punishes them
    by wand-induced transformations into successive animal forms, names the young
    that appear with them, restores them, and later uses a wand test involving Arianrod
    that produces Dylan and a hidden infant who grows rapidly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gwydion and Gilvaethwy stay away from the Court until food and drink are forbidden
    to them; they then come to Math, submit to his will, and Math says he will begin
    their punishment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Math strikes Gilvaethwy and Gwydion with a magic wand, making each into a
    deer, and orders them to go together, possess deer nature, and return in a year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a year, two deer and a fawn appear beneath the chamber wall; Math changes
    the two deer into wild hogs and takes the young one to be baptized and named Hydwn.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the next year, two wild hogs and a large young one appear; Math takes
    the young one, changes him into a fair auburn-haired youth named Hychdwn, and
    changes the two adults into wolves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the third year, two wolves and a strong cub appear; Math names the cub
    Bleiddwn, and a verse identifies Bleiddwn, Hydwn, and Hychdwn as the three sons
    of Gilvaethwy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Math strikes the two transformed figures with his wand so that they resume
    their own nature, declares their punishment and dishonour sufficient, and orders
    ointment, washing, and equipment for them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After peace and friendship are declared, Math asks what maiden he should seek,
    and Gwydion advises him to seek Arianrod, daughter of Don and Math’s niece.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Arianrod steps over Math’s bent magic wand; a chubby yellow-haired boy appears,
    and then a small form is briefly seen, seized by Gwydion, wrapped in a velvet
    scarf, and hidden in a chest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Math names the yellow-haired boy Dylan; when baptized, Dylan plunges into
    the sea, takes its nature, swims like a fish, is called son of the Wave, and is
    later said to be killed by a blow from his uncle Govannon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gwydion later hears a cry from the chest, finds an infant boy in the scarf,
    has him nursed by a woman, and the child grows unusually quickly, being four years
    old but as large as an eight-year-old.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
