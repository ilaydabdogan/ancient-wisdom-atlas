canonical_text:
  quote: ''
  summary: Arthur's companions repeatedly challenge a Knight and are overthrown. Gwalchmai,
    hidden by a robe of honor, fights the Knight for three days until the Knight recognizes
    him as kin and is revealed as Owain. Arthur mediates their mutual refusal of victory,
    and Owain hosts Arthur at the Countess of the Fountain's castle. Owain later remains
    in Britain far beyond the permitted three months; a damsel takes his ring and
    denounces him. Owain leaves court, wanders in mountains among wild beasts until
    wasted and weak, and is found near a lake in a widowed Countess's park, where
    healing balsam, clothing, and a horse are sent to him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A signal of combat is seen on the Knight's lance in the morning; Kai asks
    Arthur to let him challenge the Knight again and is quickly overthrown and wounded
    in the forehead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arthur's household goes out one after another to fight the Knight, and all
    are overthrown except Arthur and Gwalchmai.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Arthur arms himself to encounter the Knight, but Gwalchmai asks to fight first
    and receives permission.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gwalchmai wears a satin robe of honor sent by the daughter of the Earl of
    Rhangyw, and because of this clothing he is not recognized by the host.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gwalchmai and the Knight fight across three days, with neither able to master
    or unhorse the other at first.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: On the third day the combatants break their horses' girths, fall to the ground,
    rise, draw swords, and continue fighting while fire flashes from their weapons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Knight strikes Gwalchmai's helmet aside, recognizes him, and addresses
    him as his cousin; the Knight is then named Owain in the speech.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Owain and Gwalchmai each declares the other the victor and refuses to take
    the other's arms; Arthur takes both swords and says neither has vanquished the
    other.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Owain embraces Arthur, and the host rushes forward to see and embrace Owain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Owain tells Arthur he has been absent three years and has been preparing a
    banquet for him during that time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the Castle of the Countess of the Fountain, the banquet prepared for three
    years is consumed in three months.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Arthur asks the Countess to allow Owain to go with him for three months; she
    consents though it is painful to her, and Owain remains in Britain for three years
    instead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A damsel enters Caerlleon on a foaming bay horse with gold tack and dressed
    in yellow satin, takes the ring from Owain's hand, denounces him, and departs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Owain remembers his adventure, becomes sorrowful, leaves court, and wanders
    to distant places and uncultivated mountains.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Owain's clothing wears out, his body wastes away, his hair grows long, and
    he lives and feeds with wild beasts until he becomes too weak to keep their company.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Owain descends from the mountains to a valley and reaches a very fair park
    belonging to a widowed Countess.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:17
  text: The widowed Countess and her maidens walk by a lake in the park, see the form
    of a man, approach despite fear, touch him, and find that he is alive though exhausted
    by the sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The widowed Countess gives a maiden a flask of precious ointment, instructing
    her to place a horse and clothing near the man and anoint him near the heart so
    that, if alive, he will arise.
  category: action
  evidence_refs:
  - ev:9
