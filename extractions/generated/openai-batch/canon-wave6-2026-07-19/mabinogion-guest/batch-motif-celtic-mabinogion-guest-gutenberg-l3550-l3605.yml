canonical_text:
  quote: ''
  summary: Enid rises at midnight, prepares Geraint’s armour, warns him of Earl Dwnn’s
    words and intentions, and lights a candle while Geraint arms. Geraint rewards
    the host with horses and armour and asks to be guided out of town by a different
    way. Earl Dwnn arrives with fourscore armed knights, learns Geraint has left,
    and follows the horse tracks. At dawn Enid sees dust and a knight through the
    mist and warns Geraint despite his command of silence. Geraint overthrows the
    knights one by one, defeats Earl Dwnn, grants him mercy, and leaves the pursuers
    grievously wounded.
  language: English
  quote_policy: summarized
