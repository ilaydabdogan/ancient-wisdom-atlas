canonical_text:
  quote: ''
  summary: 'Opening of the story of Lludd and Llevelys: Lludd inherits Britain and
    builds up London; Llevelys marries the French king''s daughter and receives the
    French crown; three plagues afflict Britain; Lludd seeks secret counsel from Llevelys;
    their speech through a brass horn is obstructed by a demon until wine drives it
    out; Llevelys gives a remedy using insects bruised in water to poison the Coranians
    without harming Lludd''s people.'
  language: English
  quote_policy: summarized
