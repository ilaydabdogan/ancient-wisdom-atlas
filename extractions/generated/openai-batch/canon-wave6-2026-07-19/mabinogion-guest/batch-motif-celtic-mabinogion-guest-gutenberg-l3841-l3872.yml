canonical_text:
  quote: ''
  summary: Geraint, weakened and traveling with Enid, retrieves his horse and rides
    with her along a hedge-lined road at nightfall. An armed party approaches from
    behind. Geraint places Enid beyond the hedge before a knight charges with lance
    couched. Enid pleads that the knight not kill a dead man; the knight recognizes
    Geraint and identifies himself as the Little King, come to help. The Little King
    advises refuge at a nearby baronial court where Geraint receives hospitality,
    physicians, and repaired armor until he recovers.
  language: English
  quote_policy: summarized
