canonical_text:
  quote: ''
  summary: Peredur accompanies Arthur hunting, follows his dog and a slain hart to
    a remote hall, and is warned by a maiden that the hall’s owner kills unpermitted
    visitors. The owner, a huge black one-eyed man later named the Black Oppressor,
    spares Peredur for one night at the maiden’s request, then challenges him the
    next day. Armed by the maiden, Peredur defeats him and demands his story. The
    Black Oppressor says he lost his eye fighting the Black Serpent of the Carn, which
    possesses a stone on its tail that grants desired gold. He describes further marvels
    on the route, including the Addanc of the Lake and the Mound of Mourning, before
    Peredur kills him for his oppression.
  language: English
  quote_policy: summarized
