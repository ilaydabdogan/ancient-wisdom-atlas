canonical_text:
  quote: ''
  summary: Gwydion brings Arianrod's unnamed son to her castle. Arianrod declares
    that the boy will not receive a name unless it comes from her. Gwydion later disguises
    himself and the boy as cordwainers, uses magically made shoes to draw Arianrod
    to a boat, and prompts a situation in which the boy shoots a wren and Arianrod
    utters words that Gwydion takes as the boy's name, Llew Llaw Gyffes. Arianrod
    then places another destiny on the boy, withholding arms and armour unless she
    invests him with them. Gwydion raises Llew, observes his need for horses and arms,
    and returns to Arianrod's castle in another disguise as bards from Glamorgan.
  language: English
  quote_policy: summarized
