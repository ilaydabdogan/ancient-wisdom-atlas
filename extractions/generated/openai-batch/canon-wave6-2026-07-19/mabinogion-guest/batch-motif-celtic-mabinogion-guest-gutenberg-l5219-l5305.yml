canonical_text:
  quote: ''
  summary: Arthur sends Gwrhyr, who assumes bird form, to speak with the transformed
    swine. Grugyn refuses parley and says Arthur seeks the comb, razor, and scissors
    between Twrch Trwyth's ears. Twrch Trwyth and his swine cross toward Wales, are
    pursued by Arthur, his hosts, hunters, and dogs, and repeatedly kill men and dogs
    while being hunted across named places. Several of Twrch's young pigs are killed;
    Grugyn and Llwydawg remain with him for a time, and Llwydawg is eventually slain
    after killing named warriors.
  language: English
  quote_policy: summarized
