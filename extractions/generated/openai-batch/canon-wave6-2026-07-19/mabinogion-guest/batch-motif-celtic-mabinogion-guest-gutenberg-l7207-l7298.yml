canonical_text:
  quote: ''
  summary: Pryderi is trapped by touching a richly worked golden bowl on a slab. Rhiannon
    follows him into the castle, touches the bowl, is trapped likewise, and the castle
    vanishes with both of them amid thunder and mist. Manawyddan comforts Kicva with
    a pledge of loyal friendship, then they leave for Lloegyr, where Manawyddan succeeds
    at shoemaking until rival cordwainers plan to kill him. He and Kicva return to
    Dyved; Manawyddan plants three crofts of wheat, but the ripe ears of the first
    two are removed overnight, prompting him to arm himself and watch the third croft.
  language: English
  quote_policy: summarized
