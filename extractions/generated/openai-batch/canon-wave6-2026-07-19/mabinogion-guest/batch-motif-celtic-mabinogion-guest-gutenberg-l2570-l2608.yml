canonical_text:
  quote: ''
  summary: Peredur challenges and fights a black armoured man who repeatedly remounts
    and then disappears with both horses. Peredur crosses a mountain to a castle in
    a valley with a river, where he finds Gwalchmai, a lame grey-headed man, and his
    recovered horse. A yellow-haired youth kneels to Peredur and reveals that he had
    appeared previously as the black maiden and had brought the bloody head and bleeding
    lance; the head was Peredur's cousin's, killed by the sorceresses of Gloucester,
    who also lamed Peredur's uncle. Peredur, Gwalchmai, Arthur, and Arthur's household
    attack the sorceresses. After a sorceress kills Arthur's men three times before
    Peredur, he strikes her helmet; she warns the others that Peredur, once taught
    chivalry by them, is destined to slay them. Arthur's household then kills all
    the sorceresses of Gloucester. The passage closes by naming the matter as the
    Castle of Wonders.
  language: English
  quote_policy: summarized
