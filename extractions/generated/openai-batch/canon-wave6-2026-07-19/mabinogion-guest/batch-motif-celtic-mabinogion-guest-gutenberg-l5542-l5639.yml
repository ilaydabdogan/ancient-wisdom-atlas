  quote: ''
  summary: Rhonabwy observes Arthur’s host near a ford and repeatedly asks Iddawc
    to identify remarkable riders, counsellors, troops, and servants. The passage
    describes black-and-white troops, a rebuke after a rider splashes Arthur and a
    bishop, Caradawc urging movement toward Badon, regional troops from Norway and
    Denmark, Kai’s disruptive horsemanship, Arthur’s serpent-and-fire sword borne
    by Kadwr, and Eirynwych setting out a golden chair and the carpet Gwenn, whose
    occupant cannot be seen while seeing everyone.
  language: English
