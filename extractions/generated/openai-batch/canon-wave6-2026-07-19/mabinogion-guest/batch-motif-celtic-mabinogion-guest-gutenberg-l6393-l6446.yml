canonical_text:
  quote: ''
  summary: Teirnyon brings a found boy to his wife, who infers noble lineage from
    his satin mantle. They arrange for him to be presented as their child, baptize
    and name him Gwri Wallt Euryn because of his golden hair, and raise him as he
    grows unusually quickly. A colt saved on the night the boy was found is given
    to him. After hearing of Rhiannon’s punishment, Teirnyon investigates, recognizes
    the boy’s likeness to Pwyll, concludes that the boy is Pwyll’s son, and agrees
    with his wife to send the boy to Pwyll, both to release Rhiannon and to restore
    the child.
  language: English
  quote_policy: summarized
