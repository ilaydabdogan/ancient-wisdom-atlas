canonical_text:
  quote: ''
  summary: A besieged maiden, heir to an earldom, is pressured by her foster-brothers
    to seek help from Peredur. She recounts that an unwanted suitor has conquered
    her lands and is about to attack her last house. Peredur pledges aid, defeats
    the aggressor's men over three days, compels restitution and provisions, restores
    government to the maiden, then departs after identifying himself and promising
    future protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youths advise the maiden to go to the youth in the upper chamber and offer
    to become his wife or lady-love; when she resists, they threaten to leave her
    to her enemies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maiden says it would be unfitting to offer herself before being wooed,
    since she has not been the lady-love of any knight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because of the threat, the maiden goes weeping to the chamber; the door wakes
    Peredur, who asks why she weeps.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The maiden says her father formerly held the dominions, palace, and earldom,
    and that she was his only child and inherited after his death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiden says the son of another earl sought her, she and her father did
    not consent, and after her father's death he made war on her and conquered all
    her possessions except one house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The maiden says the house has been held by the valour of her foster-brothers
    and its strength, but its provisions are exhausted; nuns had been feeding them,
    but the nuns also now lack food and drink.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The maiden expects the earl to attack the next day and asks Peredur to succour
    her either by taking her away or defending her there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Peredur tells the maiden to sleep and says he will not depart until he does
    what she asks or proves whether he can assist her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The next morning the maiden reports that the earl and all his forces have
    alighted at the gate, with tents and knights challenging others to combat.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:10
  text: On the first day, Peredur rides to the meadow, overthrows a knight and then
    the earl's Master of the Household, who controls a third of the maiden's possessions;
    Peredur orders restoration, profits, provisions for one hundred men, and captivity
    to the maiden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: On the second day, Peredur vanquishes many of the host and overthrows the
    Steward of the Palace, who controls another third; Peredur orders restoration,
    provisions for two hundred men, and captivity to the maiden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the third day, Peredur defeats the earl himself and orders him to restore
    the whole of the maiden's earldom, add his own earldom, provide for three hundred
    men, and remain in her power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Peredur remains three weeks causing tribute, obedience, and government to
    be placed in the maiden's hands, then departs after naming himself and promising
    protection if she is in future danger.
  category: sequence
  evidence_refs:
  - ev:7
