canonical_text:
  quote: ''
  summary: Owain cooks a roebuck and hears Luned, who says she is imprisoned and condemned
    unless Owain rescues her. After sharing food, he travels by river and ford to
    a sorrowful but hospitable castle. The Earl explains that a man-eating giant has
    seized his two sons and demands his daughter. Owain and his lion fight the giant;
    the lion kills it, and Owain restores the sons. Owain then returns to Luned and
    finds two youths leading her to a fire; he offers to fight in Owain's stead.
  language: English
  quote_policy: summarized
