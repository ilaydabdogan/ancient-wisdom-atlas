canonical_text:
  quote: And thus Lludd freed the Island of Britain from the three plagues.
  summary: 'Llevelys explains remedies for two plagues: fighting dragons at the island’s
    center and a magical thief who induces sleep. Lludd returns, destroys the Coranians
    using insect-water, traps the dragons in a mead-filled cauldron and buries them
    in Snowdon, then resists magical drowsiness with cold water, defeats the thief,
    and restores peace to Britain.'
  language: English
  quote_policy: quoted
