canonical_text:
  quote: ''
  summary: Arthur decides that Geraint should leave Arthur's court to defend his own
    dominions. Gwenhwyvar arranges for the lady with her and later permits Edeyrn
    to depart. Geraint travels with many companions toward the Severn, is welcomed
    by the nobles and household of Erbin, and is celebrated on his return. Erbin,
    aged and feeble, insists that Geraint receive authority over the dominions and
    the homage of his subjects. Before the homage, supplicants are heard and gifts
    are distributed until none leave unsatisfied.
  language: English
  quote_policy: summarized
