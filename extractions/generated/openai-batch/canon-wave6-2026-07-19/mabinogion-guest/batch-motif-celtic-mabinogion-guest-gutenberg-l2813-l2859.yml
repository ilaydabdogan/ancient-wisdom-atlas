canonical_text:
  quote: ''
  summary: After a meal, Geraint questions a hoary-headed host about the palace and
    nearby preparations. The host says he built the palace and once possessed the
    city, castle, and earldom, but lost them after withholding his nephew's property
    and being defeated in war. He explains that the young Earl will hold a tournament
    for a Sparrow-Hawk displayed on a silver rod set on two forks in a meadow. Each
    competitor must be accompanied by the lady he loves best. A knight has won the
    Sparrow-Hawk for two years and, if victorious a third time, will thereafter receive
    it annually and be called the Knight of the Sparrow-Hawk. Geraint seeks a way
    to answer insults received from the dwarf. The host offers arms and a horse; Geraint
    accepts the arms and asks permission to challenge on behalf of the host's daughter,
    pledging to love her if he survives. The host agrees and tells him to be ready
    at daybreak.
  language: English
  quote_policy: summarized
