canonical_text:
  quote: ''
  summary: The nobles urge Pwyll to secure an heir, and within a year Rhiannon bears
    a son at Narberth. Six women set to watch the mother and child fall asleep; the
    child is missing at dawn. Fearing punishment, the women kill hound whelps and
    use blood and bones to accuse Rhiannon of devouring her son. Pwyll refuses to
    put Rhiannon away, and she accepts a public penance at the palace gate. The passage
    then turns to Teirnyon, whose mare loses her colt every first of May; he watches
    armed, cuts off a clawed arm that seizes the new colt through a window, and later
    finds a strong swaddled infant at his door.
  language: English
  quote_policy: summarized
