canonical_text:
  quote: "“In the Forest I saw a stag, the like of which beheld I never yet.”"
  summary: Arthur holds court at Caerlleon at Whitsuntide. A forester named Madawc
    reports an extraordinary pure white stag in the Forest of Dean. Arthur orders
    a dawn hunt; Gwenhwyvar asks to witness it; Gwalchmai proposes that whoever takes
    the stag may give its head to a chosen lady. The court prepares and sets out for
    the forest.
