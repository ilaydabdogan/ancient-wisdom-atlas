canonical_text:
  quote: ''
  summary: Gwydion uses magic to create the appearance of an invading fleet and army,
    causing Arianrod to arm the youth and thereby defeating a prior prophecy. Arianrod
    responds by laying a new destiny that the youth will have no wife from the race
    inhabiting the earth. Math and Gwydion form a wife for him from flowers and name
    her Blodeuwedd. After marriage and a grant of land, Blodeuwedd meets the hunter
    Gronw Pebyr, falls in love with him, and together they plan for her to learn from
    Llew Llaw Gyffes the manner of his death under the appearance of concern for him.
  language: English
  quote_policy: summarized
