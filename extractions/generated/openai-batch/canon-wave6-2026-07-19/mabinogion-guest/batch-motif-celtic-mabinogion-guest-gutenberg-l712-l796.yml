canonical_text:
  quote: ''
  summary: Owain looks from a chamber window and sees a large armed and ceremonial
    funeral procession. He observes a grieving lady following the bier and immediately
    falls in love with her. A maiden identifies her as the Countess of the Fountain,
    widow of the man Owain killed the day before. The maiden, Luned, washes, shaves,
    feeds, and settles Owain, then goes to the Countess to plead on his behalf. Through
    a sharp exchange and reconciliation, Luned persuades the Countess that her possessions
    depend on finding a defender for the fountain, specifically a knight from Arthur’s
    household, and promises to seek such a warrior at Arthur’s Court.
  language: English
  quote_policy: summarized
