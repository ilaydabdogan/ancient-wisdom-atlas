  quote: ''
  summary: Kilhwch invokes many named persons in order to obtain his boon. Arthur
    says he does not know the maiden Olwen and sends messengers through his dominions
    for a year, but they learn nothing. After Kilhwch complains, Kai and other specially
    endowed companions are called for the expedition. The company journeys to a vast
    plain and an unusually distant castle, where they see a boundless flock, a herdsman
    on a mound, a huge mastiff, and the herdsman’s destructive breath.
  language: English
