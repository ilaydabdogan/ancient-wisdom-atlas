canonical_text:
  quote: ''
  summary: 'Geraint receives hospitality and healing from the young Earl but insists
    on returning to Arthur’s court with Earl Ynywl’s daughter. At a feast he mediates
    restitution of Ynywl’s lost possessions and homage. Ynywl bestows the maiden upon
    Geraint, who defers her disposition to Arthur and Gwenhwyvar. The passage then
    turns to Arthur’s stag hunt: Arthur’s dog Cavall turns the stag, Arthur beheads
    it, and the court disputes who should receive the head as a gift to a beloved
    lady. Gwenhwyvar advises waiting for Geraint’s return and sets a watch, which
    sees an odd mounted party approaching.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little or young Earl comes with hosts to Geraint, greets him, and invites
    him to his castle; Geraint declines and says he will lodge where he lodged the
    previous night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young Earl promises Geraint abundant supplies at his lodging and ointment
    for his fatigue and weariness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Servants and attendants arrange the houses with straw and fire; ointment is
    prepared, and Geraint’s head is washed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young Earl comes with forty honourable knights after Geraint’s anointing
    and invites him to the hall to eat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Geraint orders that the maiden not dress herself except in her vest and veil
    until she reaches Arthur’s court, where Gwenhwyvar may clothe her as she chooses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: At the meal, Geraint sits with the young Earl and Earl Ynywl on one side,
    and with the maiden and her mother on the other; the rest sit according to precedence
    in honour.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Geraint refuses the young Earl’s invitation for the next day and says he will
    go to Arthur’s court with the maiden, chiefly to improve Earl Ynywl’s maintenance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The young Earl agrees to abide by Geraint’s counsel in the disagreement with
    Ynywl; Geraint asks him to restore what belongs to Ynywl and what Ynywl should
    have received since losing his possessions.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Those who owe homage to Ynywl perform it, the treaty is observed, and Ynywl’s
    castle, town, possessions, and even the smallest jewel are restored.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: Earl Ynywl bestows the maiden upon Geraint; Geraint says she will go with
    him to Arthur’s court and that Arthur and Gwenhwyvar will dispose of her as they
    will.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:11
  text: The next day the party proceeds to Arthur’s court.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: Arthur’s hunting parties release dogs upon a stag; Cavall, Arthur’s favorite
    dog, surpasses the other dogs and turns the stag, and Arthur cuts off the stag’s
    head before anyone else kills it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: A death horn is sounded for the slaying, and the hunters gather around.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Kadyrieith tells Arthur that Gwenhwyvar is nearby with only one maiden; Arthur
