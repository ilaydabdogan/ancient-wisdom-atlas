    palace.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The household and knights dispute sharply about which lady should receive
    the stag’s head, each favoring a beloved lady.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Gwenhwyvar advises Arthur not to give away the stag’s head until Geraint returns
