canonical_text:
  quote: ''
  summary: A maiden uses all of a precious balsam to revive Owain, then brings him
    to the widowed Countess’s castle. After recovery, Owain receives horse and arms,
    captures the hostile Earl who has dispossessed the Countess, and presents him
    as repayment for the balsam; the Earl restores lands and gives ransom. Owain then
    departs to wander, encounters a lion trapped by a serpent in a rock cleft, kills
    the serpent, and gains the lion as a companion who later brings fuel and game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maiden pours the whole balsam upon Owain, leaves a horse and garments
    nearby, and hides to watch him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Owain begins to move, rises, notices his appearance, draws the garments to
    himself, clothes himself, and mounts the horse with difficulty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden says a widowed Countess owns the nearby Castle and has lost most
    of her territory to a neighboring young Earl because she refused to marry him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden conducts Owain to the Castle, places him in a pleasant chamber,
    kindles a fire, and leaves him there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Countess complains that all the balsam, valued at seven-score pounds,
    was used on an unknown stranger, but orders the maiden to attend him until he
    recovers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden provides Owain with meat, drink, fire, lodging, and medicaments
    until he recovers; after three months he is restored to his former guise and is
    more comely than before.
  category: sequence
  evidence_refs:
  - ev:4
