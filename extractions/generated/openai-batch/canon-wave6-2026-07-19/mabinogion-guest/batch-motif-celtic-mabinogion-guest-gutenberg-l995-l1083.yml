  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Countess provides a beautiful black steed, a beechen saddle, and armour
    for man and horse; Owain arms himself and rides out with two equipped pages.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Owain identifies the Earl’s troop by four yellow standards, pulls the Earl
