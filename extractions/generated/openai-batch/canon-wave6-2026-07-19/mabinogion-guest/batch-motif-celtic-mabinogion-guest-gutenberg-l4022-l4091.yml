canonical_text:
  quote: ''
  summary: A lady returns home and asks why her consort concealed his children. The
    king summons his son. The stepmother tells the youth that his destiny is to have
    no wife until he obtains Olwen, daughter of Yspaddaden Penkawr; the youth is immediately
    affected by love though he has not seen her. His father directs him to Arthur,
    his cousin, to ask for a boon. The youth rides richly equipped to Arthur’s palace,
    where the porter refuses entry during revelry and offers hospitality outside the
    court. The youth threatens harmful shouts at the gate unless admitted, and the
    porter says he must first speak with Arthur because entry is governed by Arthur’s
    laws.
  language: English
  quote_policy: summarized
