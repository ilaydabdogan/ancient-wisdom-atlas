canonical_text:
  quote: ''
  summary: After Arthur has gone hunting, Gwenhwyvar rides out with a maiden and is
    joined by Geraint. At the forest edge they see a dwarf, a richly dressed lady,
    and a large armored knight. When Gwenhwyvar’s maiden and then Geraint ask the
    dwarf to identify the knight, the dwarf refuses and strikes each of them with
    a whip. Geraint restrains himself because he lacks proper arms against the armored
    knight, then follows the party toward a town and castle where the knight is welcomed
    and Geraint remains unknown.
  language: English
  quote_policy: summarized
