canonical_text:
  quote: ''
  summary: Peredur reaches a valley with a river and is hosted at a king's palace,
    where the king's daughter receives him warmly. A page suspects a romantic attachment
    and advises the king to imprison Peredur. The maiden comforts Peredur in prison
    and later equips him to fight in a battle against a powerful earl, after which
    he repeatedly returns to prison unseen. Peredur kills the earl, is revealed as
    the victorious knight, and is offered the king's daughter, half the kingdom, and
    two earldoms, but he declines because he seeks the Castle of Wonders. The maiden
    gives him directions over a mountain to a lake with the castle in its middle,
    and promises guidance and provisions.
  language: English
  quote_policy: summarized
