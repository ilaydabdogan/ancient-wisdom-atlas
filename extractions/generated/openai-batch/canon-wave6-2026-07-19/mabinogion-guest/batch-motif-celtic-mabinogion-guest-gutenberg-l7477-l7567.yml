canonical_text:
  quote: ''
  summary: Gilvaethwy falls lovesick for Goewin, the maiden attending Math. Gwydion
    recognizes his brother’s desire and undertakes a plan. He tells Math about swine
    in the south, sent from Annwvyn by Arawn to Pryderi, and proposes to seek them
    in the guise of bards. Gwydion, Gilvaethwy, and companions enter Pryderi’s court
    as bards; Gwydion charms the court with storytelling, requests the swine, and
    learns of a covenant preventing their departure until their number doubles. He
    proposes an exchange, then uses magic to create temporary horses, hounds, and
    shields, including shields formed from fungus. Pryderi agrees to exchange the
    swine, and Gwydion departs quickly because the illusion will last only until the
    same hour the next day.
  language: English
  quote_policy: summarized
