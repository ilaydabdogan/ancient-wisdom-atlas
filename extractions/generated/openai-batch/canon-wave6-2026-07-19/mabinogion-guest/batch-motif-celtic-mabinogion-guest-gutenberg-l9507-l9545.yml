  summary: A prophetic song describes a proud, merciless winged serpent from Germany
    overrunning England and Scotland. The Brython are foretold to be ruled by strangers
    from Saxony, to keep their speech while losing most of their land, and later,
    after penance and the arrival of two crimes, to regain their land and crown while
    the strangers disappear. The passage says the angel’s words about peace and war
    will be fulfilled, and adds that an unnamed speaker told the king further prophecies
    in songs.
