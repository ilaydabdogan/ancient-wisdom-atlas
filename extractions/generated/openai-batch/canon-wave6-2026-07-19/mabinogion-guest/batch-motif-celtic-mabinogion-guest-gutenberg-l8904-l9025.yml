canonical_text:
  quote: ''
  summary: Maelgwn imprisons Elphin again until Elphin can prove claims about his
    bard and wife. Taliesin tells Elphin’s wife that he will go to Maelgwn’s court
    and free his master by song and speech. At Maelgwn’s feast, Taliesin sits in a
    corner, performs a lip-and-finger sound that the court bards imitate, leaving
    them unable to speak properly before the king. Heinin Vardd says the bards are
    affected by a spirit in the form of a child. Taliesin is brought before Maelgwn
    and answers in verse, identifying himself as Elphin’s chief bard, from a celestial
    region, and as a figure who has been present at many biblical, classical, and
    Welsh legendary events.
  language: English
  quote_policy: summarized
