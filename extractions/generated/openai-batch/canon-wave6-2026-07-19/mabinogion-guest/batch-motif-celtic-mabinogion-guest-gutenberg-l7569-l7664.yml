canonical_text:
  quote: ''
  summary: Gwydion and his men travel with swine through places whose names are explained
    by the events. Pryderi pursues with forces from the South, battles occur, peace
    is sought, and the dispute is narrowed to single combat between Pryderi and Gwydion.
    Gwydion kills Pryderi by strength, fierceness, magic, and charms. Afterward Goewin
    reports that Math’s nephews wronged her at court; Math promises compensation by
    taking her as wife and giving her possession of his dominions.
  language: English
  quote_policy: summarized
