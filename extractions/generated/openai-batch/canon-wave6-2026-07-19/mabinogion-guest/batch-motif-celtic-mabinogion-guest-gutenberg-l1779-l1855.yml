  quote: "“I was looking upon the snow, and upon the raven, and upon the drops of
    the blood...”"
  summary: Gwalchmai argues that a thoughtful knight should not be disturbed harshly
    and goes courteously to Peredur. Peredur explains that the sight of snow, a raven,
    and blood made him think of the lady he loves. Gwalchmai and Peredur exchange
    names and pledge fellowship. Peredur is welcomed by Arthur’s court, and later
    at Caerlleon he declares love for Angharad Law Eurawc; after her refusal he vows
    not to speak to any Christian until she loves him above all men.
