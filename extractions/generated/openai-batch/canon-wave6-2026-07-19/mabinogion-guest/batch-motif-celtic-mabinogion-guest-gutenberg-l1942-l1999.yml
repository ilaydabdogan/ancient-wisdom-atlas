canonical_text:
  quote: ''
  summary: Peredur crosses a desert, kills a serpent that prevents habitation around
    a gold ring, and takes the ring. After a long period of silence and longing for
    Arthur’s Court, he returns unrecognized. Kai wounds him when he will not answer,
    but Peredur keeps silent. At Arthur’s Court he silently defeats challengers, is
    called the Dumb Youth, and finally speaks after Angharad Law Eurawc declares love
    for him; his identity is then known and he remains in fellowship at court.
  language: English
  quote_policy: summarized
