canonical_text:
  quote: ''
  summary: A wounded Edeyrn son of Nudd arrives at Gwenhwyvar's gate after being defeated
    by Geraint, who has compelled him to seek Gwenhwyvar's pleasure and justice for
    an insult done by Edeyrn's dwarf to her maiden. Edeyrn recounts the tournament
    for the Sparrow-Hawk at Cardiff and Geraint's joust on behalf of a poor maiden.
    Arthur and Gwenhwyvar grant mercy, arrange medical care, set future satisfaction
    if Edeyrn lives, and appoint sureties; Morgan Tud is ordered to heal him, and
    a maiden is sent to Gwenhwyvar's handmaidens.
  language: English
  quote_policy: summarized
