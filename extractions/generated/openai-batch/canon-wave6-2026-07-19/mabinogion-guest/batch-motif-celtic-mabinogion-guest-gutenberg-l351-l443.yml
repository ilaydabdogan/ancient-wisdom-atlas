  summary: The passage opens the tale at Arthur’s chamber in Caerlleon. Arthur sleeps
    while directing his companions to entertain one another with tales and obtain
    mead and meat from Kai. Kynon begins a first-person tale of leaving home in search
    of adventures, traveling through deserts and distant regions, reaching a beautiful
