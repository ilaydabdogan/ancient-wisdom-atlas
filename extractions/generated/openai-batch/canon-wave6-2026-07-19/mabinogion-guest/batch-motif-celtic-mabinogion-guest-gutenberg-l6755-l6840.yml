canonical_text:
  quote: ''
  summary: Bendigeid Vran reads of Branwen’s suffering, summons the Island of the
    Mighty, appoints caretakers at home, and leads a host toward Ireland. Irish observers
    see the approaching ships and giant leader as a wood and moving mountain; Branwen
    explains the sights. The Irish retreat behind a river and destroy the bridge,
    but Bendigeid Vran lies across the river so his host can pass. Matholwch’s messengers
    offer royal compensation through Gwern and later advise making a house large enough
    for Bendigeid Vran and both hosts to secure peace.
  language: English
  quote_policy: summarized
