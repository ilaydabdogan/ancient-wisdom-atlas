canonical_text:
  quote: ''
  summary: Taliesin sings of sacred and mythic experiences, Caridwen’s cauldron and
    womb, and his identity as formerly Gwion and now Taliesin. At Maelgwn’s court,
    rival bards fail to answer him. Taliesin declares that Elphin is imprisoned and
    that he will loosen him from locks, fetters, and a stony tower. He challenges
    the bards with a mystery about a vast noxious creature connected with springs,
    waters, rain, and mountains. He then prophesies Maelgwn’s destruction by a strange
    golden-featured creature from the sea marsh of Rhianedd.
  language: English
  quote_policy: summarized
