canonical_text:
  quote: ''
  summary: The passage lists the contents of The Mabinogion and opens Lady Charlotte
    Guest’s introduction. Guest describes her translation work as leading her into
    research on earlier medieval romance, especially the connection between the Welsh
    Mabinogion and continental romance. She outlines the rise of chivalric romance
    in twelfth- and thirteenth-century Europe, notes the apparent exclusion and isolation
    of the Celts, and argues that many major romances nevertheless preserve Celtic
    names, scenes, and formal traces. She then discusses possible routes of transmission
    through north-western France, Wace, Geoffrey of Monmouth, and earlier British
    sources.
  language: English
  quote_policy: summarized
