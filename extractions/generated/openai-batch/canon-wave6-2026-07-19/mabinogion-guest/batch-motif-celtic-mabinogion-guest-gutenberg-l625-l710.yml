canonical_text:
  quote: ''
  summary: Owain repeats Kynon's route to a glade, green tree, fountain, slab, and
    bowl. He pours water on the slab, causing thunder, a violent shower, a bright
    sky, a leafless tree, and singing birds. A knight arrives, fights Owain, is mortally
    wounded, and flees to a castle. Owain is trapped by the portcullis, but a richly
    dressed maiden gives him a concealing ring, guides him to a chamber, and provides
    washing, food, and a couch. The castle later sounds with clamour for the unction,
    death, and funeral of its noble owner.
  language: English
  quote_policy: summarized
