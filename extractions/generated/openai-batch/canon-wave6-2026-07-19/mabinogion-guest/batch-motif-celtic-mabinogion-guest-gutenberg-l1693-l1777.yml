canonical_text:
  quote: ''
  summary: Peredur meets and vindicates the wife of the Lord of the Glade by defeating
    a knight and requiring him to acknowledge her innocence. He then enters a castle
    where a countess is threatened by sorceresses of Gloucester; after defeating one
    sorceress, he spares her in exchange for a pledge and receives martial training
    and equipment. At a hermit’s cell he sees snow, a slain bird, blood, a hawk, and
    a raven, and compares their colors to the beloved lady he remembers. Arthur’s
    household searches for him, but Peredur remains absorbed in meditation, unhorses
    multiple youths, and severely wounds Kai.
  language: English
  quote_policy: summarized
