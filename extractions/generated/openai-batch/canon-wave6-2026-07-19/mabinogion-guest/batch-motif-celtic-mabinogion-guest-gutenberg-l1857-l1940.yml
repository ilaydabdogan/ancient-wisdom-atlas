canonical_text:
  quote: ''
  summary: Peredur enters the Round Valley by a mountain road, kills a chained lion
    guarding a ledge above a bone-filled pit, and reaches a castle ruled by a huge
    grey man. A maiden warns him that the grey man’s giant vassals will attack him
    and arranges for his horse and arms to remain with him overnight. Peredur defeats
    the host, kills the grey man’s two sons, accepts the maiden’s plea for mercy on
    condition that the defeated household render homage to Arthur and receive baptism.
    Arthur later accepts their homage, has them baptized, and grants the valley to
    the grey man and his company.
  language: English
  quote_policy: summarized
