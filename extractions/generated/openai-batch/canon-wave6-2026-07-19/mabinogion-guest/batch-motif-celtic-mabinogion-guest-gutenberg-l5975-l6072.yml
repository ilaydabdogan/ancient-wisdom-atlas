canonical_text:
  quote: ''
  summary: Pwyll, acting in Arawn's semblance, meets Havgan at the Ford, defeats him,
    receives homage, and brings two kingdoms under his power. Arawn and Pwyll meet
    at Glyn Cuch and return to their own forms. Pwyll returns to Dyved, learns that
    the year's rule there was praised, explains the exchange, and strengthens friendship
    with Arawn through gifts. He is afterward called Pwyll Chief of Annwvyn. Later,
    at Narberth, Pwyll sits on Gorsedd Arberth, a mound said to bring either wounds
    or a wonder, and sees an unidentified lady on a large white horse whom a man on
    foot cannot overtake.
  language: English
  quote_policy: summarized
