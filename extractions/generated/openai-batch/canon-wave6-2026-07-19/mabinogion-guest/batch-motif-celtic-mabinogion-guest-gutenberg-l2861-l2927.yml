canonical_text:
  quote: "“their arms struck sparks of fire like stars from one another”"
  summary: At dawn in a meadow, the Knight of the Sparrow-Hawk proclaims his lady-love's
    claim to fetch the Sparrow-Hawk. Geraint contests the claim for another maiden
    and battles the knight. After repeated lance exchanges, the hoary-headed man gives
    Geraint an old knighthood lance, and Geraint unhorses the knight. They fight on
    foot with swords until Geraint, urged to avenge insults to himself and to Gwenhwyvar,
    wounds the knight severely. The defeated knight kneels, casts away his sword,
    begs mercy, identifies himself as Edeyrn son of Nudd, and agrees to go without
    dismounting to Gwenhwyvar at Arthur's Court to make satisfaction for the insult
    done by his dwarf.
  language: English
  quote_policy: quoted
