canonical_text:
  quote: ''
  summary: On successive days Pwyll and his companions see a lady riding along the
    same road near a mound. Riders cannot overtake her, although she appears not to
    increase her pace. When Pwyll himself pursues and asks her to stop, she does so.
    She reveals herself as Rhiannon, daughter of Heveydd Hên, says she has come seeking
    Pwyll because others sought to give her in marriage against her will, and asks
    him to pledge to meet her in a year at her father's palace. Pwyll agrees and later
    travels there with a hundred knights, where he is joyfully received.
  language: English
  quote_policy: summarized
