canonical_text:
  quote: ''
  summary: Rhonabwy questions Iddawc about messengers reporting losses between Owain's
    Ravens and Arthur's men. Envoys from Osla request a truce; Arthur assembles a
    large council. Iddawc explains the presence of Rhun and the young Kadyriaith,
    who alone understands bardic praise of Arthur. Tribute of gold and silver from
    the Islands of Greece arrives on twenty-four asses, and Kadyriaith proposes granting
    the truce and rewarding the bards with the tribute. Kai calls Arthur's followers
    to Cornwall; the tumult wakes Rhonabwy, who has slept three nights and three days
    on a yellow calf-skin. The tale is named as the Dream of Rhonabwy and said to
    require a book because of its many wondrous visual details.
  language: English
  quote_policy: summarized
