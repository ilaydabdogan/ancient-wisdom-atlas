canonical_text:
  quote: ''
  summary: Geraint, needing lodging, enters a ruined palace where a hoary-headed man
    in tattered clothing invites him in. In an upper chamber Geraint meets the man's
    old wife and a beautiful maiden in worn clothing. The maiden tends Geraint and
    his horse, goes to town for food and drink, returns with provisions, and serves
    the meal while Geraint sits with the man and his wife.
  language: English
  quote_policy: summarized
