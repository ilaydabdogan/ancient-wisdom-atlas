canonical_text:
  quote: ''
  summary: Manawyddan watches a croft at midnight and sees an innumerable host of
    mice cut and carry away the ears of wheat. He captures one sluggish mouse, confines
    it in a glove, and declares that he will hang it as a thief. Kicva urges him to
    release it to avoid discredit. At the Gorsedd of Narberth he prepares an improvised
    gallows. A poor scholar and then a priest each ask him to release the mouse, offering
    money for its freedom, but he refuses.
  language: English
  quote_policy: summarized
