  quote: ''
  summary: Arthur and his companions pursue Twrch Trwyth, seize razor, scissors, and
    comb from him with losses, and drive him into the sea. Arthur then obtains the
    blood of the witch Orddu at her cave by killing her with his dagger. Kilhwch and
    his allies bring the marvels to Yspaddaden; Kaw shaves Yspaddaden, Goreu beheads
    him, and Olwen becomes Kilhwch’s bride.
