canonical_text:
  quote: ''
  summary: The passage opens “The Dream of Rhonabwy” by describing Madawc’s possession
    of Powys, his brother Iorwerth’s grievance and raid, the resulting search for
    Iorwerth, and Rhonabwy’s arrival with companions at a poor, smoky, muddy hall.
    After sparse hospitality and a storm, the travelers try to sleep; Rhonabwy leaves
    the verminous couch and sleeps on a yellow calf-skin on the floor.
