canonical_text:
  quote: ''
  summary: Peredur rides forth, meets his foster-sister lamenting beside her slain
    husband, buries the body, defeats the knight who killed him, and sends the defeated
    knight with the woman to Arthur’s court. Arthur and his household reproach Kai,
    and Arthur vows to seek Peredur. Peredur then enters a deserted wood and an overgrown
    castle, where identical lean auburn-haired youths serve him. A poorly clothed
    but beautiful maiden welcomes him, nuns bring scarce bread and wine from a convent,
    and Peredur divides the food and drink equally before sleeping.
  language: English
  quote_policy: summarized
