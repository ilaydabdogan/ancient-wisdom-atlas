canonical_text:
  quote: ''
  summary: Owain, aided by a lion, defeats young men and saves Luned from burning.
    He returns with Luned to the Countess of the Fountain, takes the Countess to Arthur’s
    Court as his wife, then goes to the court of a savage adversary. There he finds
    twenty-four dispossessed noblewomen whose husbands have been killed and goods
    stolen. Owain defeats the castle adversary, spares him when he vows to turn his
    house of spoil into a hospice, and restores the women and their possessions to
    Arthur’s Court. Owain later dwells beloved at Arthur’s Court and is victorious
    with an army of three hundred ravens left him by Kenverchyn.
  language: English
  quote_policy: summarized
