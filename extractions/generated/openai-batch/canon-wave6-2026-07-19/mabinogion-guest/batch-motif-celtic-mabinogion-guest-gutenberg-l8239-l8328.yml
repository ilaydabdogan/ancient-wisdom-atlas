canonical_text:
  quote: "“Sages of Rome,” said he, “I have seen a dream. And in the dream I beheld
    a maiden...”"
  summary: The emperor tells the wise men of Rome that a maiden seen in a dream has
    left him without life or spirit. Messengers follow the route of the dream across
    mountains, rivers, sea, and Britain until they find the maiden in a castle hall.
    She declines to go with them and says that if the emperor loves her, he must come
    to seek her. The emperor travels with an army, recognizes the landscape and hall
    from his dream, conquers Britain, finds the maiden, greets her as Empress of Rome,
    embraces her, and she becomes his bride that night.
  language: English
  quote_policy: quoted
