canonical_text:
  quote: ''
  summary: Geraint and Enid travel toward a fair valley with a river, bridge, and
    fortified town. A mounted knight warns that the Little King, Gwiffert Petit, customarily
    combats every knight who passes his lands. Geraint proceeds, is challenged by
    Gwiffert, defeats him after severe combat, grants mercy in exchange for an oath
    of alliance, refuses hospitality, and continues wounded toward a wood with Enid
    ahead of him.
  language: English
  quote_policy: summarized
