canonical_text:
  quote: ''
  summary: At Maelgwn's feast, the king, queen, and court bards are praised. Elphin
    claims that his wife is virtuous and that his bard is more skilful than the king's
    bards, and Maelgwn imprisons him until these claims can be tested. Maelgwn sends
    Rhun to bring disgrace upon Elphin's wife, but Taliesin warns her and arranges
    for a kitchen maid to appear in her place. Rhun drugs the disguised maid, cuts
    off her little finger bearing Elphin's signet ring, and presents it as proof.
    Maelgwn accuses Elphin, but Elphin identifies physical details showing that the
    severed finger was not his wife's.
  language: English
  quote_policy: summarized
