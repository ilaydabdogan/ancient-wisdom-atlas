canonical_text:
  quote: ''
  summary: Geraint, Enid, and a serving youth take food and secure lodging near an
    Earl. Geraint rewards the youth and pays for hospitality. The Earl visits with
    twelve knights, asks Geraint about his journey, sees Enid apart from Geraint,
    and attempts to persuade her to leave Geraint by offering his earldom. Enid refuses
    by citing her pledged faith. The Earl then threatens to kill Geraint and keep
    or dismiss Enid, but promises lasting union if she comes willingly. Enid encourages
    him to return the next day and take her away as though she were unaware, then
    keeps the conversation from Geraint to avoid angering or troubling him.
  language: English
  quote_policy: summarized
