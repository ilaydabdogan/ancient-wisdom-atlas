canonical_text:
  quote: ''
  summary: After a negotiated peace and the building of a great house, Irish warriors
    conceal armed men in leather bags around the pillars. Evnissyen discovers and
    kills them, but later murders Branwen's son by throwing him into a fire. Battle
    follows. The Irish revive dead warriors in a cauldron of renovation until Evnissyen
    destroys the cauldron from within, dying in the act. Only seven men of the Island
    of the Mighty escape, while Bendigeid Vran is wounded and orders his head to be
    cut off, carried, and eventually buried at the White Mount in London. Branwen
    travels with the survivors, laments the destruction of two islands because of
    her, dies of a broken heart, and is buried by the Alaw.
  language: English
  quote_policy: summarized
