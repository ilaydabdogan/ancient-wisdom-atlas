canonical_text:
  quote: ''
  summary: 'Peredur enters an open castle and disturbs a self-playing chessboard belonging
    to an Empress. A black maiden directs him through a sequence of tasks: fighting
    and ultimately killing a destructive black man, then killing a destructive one-horned
    stag. A little dog belonging to the Empress guides the stag toward Peredur. After
    Peredur kills the stag, a lady on horseback rebukes him for killing a prized creature
    and sends him onward to a mountain grove with a cromlech, where he must challenge
    a man three times to gain her friendship.'
  language: English
  quote_policy: summarized
