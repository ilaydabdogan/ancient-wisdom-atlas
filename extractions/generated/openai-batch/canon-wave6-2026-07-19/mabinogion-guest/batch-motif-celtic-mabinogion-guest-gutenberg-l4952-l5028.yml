canonical_text:
  quote: ''
  summary: Arthur’s company decides to seek Mabon son of Modron, first obtaining Eidoel
    from imprisonment at Glivi’s castle. Arthur delegates Gwrhyr, Eidoel, Kai, and
    Bedwyr to continue the search. Gwrhyr and the party question a sequence of ancient
    animals—the Ousel, Stag, Owl, and Eagle—each of whom gives a measure of great
    age, denies knowledge of Mabon, and guides them onward. The Eagle recounts an
    encounter with a powerful salmon at Llyn Llyw and directs the embassy toward him
    as a possible source of knowledge.
  language: English
  quote_policy: summarized
