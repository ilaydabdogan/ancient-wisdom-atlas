canonical_text:
  quote: ''
  summary: Matholwch and Bendigeid Vran discuss the origin of a cauldron connected
    with Llassar Llaesgyvnewid and Kymideu Kymeinvoll, who escaped a red-hot iron
    house in Ireland. Matholwch recounts meeting the huge couple at the Lake of the
    Cauldron and hearing a prophecy that Kymideu would bear a fully armed warrior
    son. Branwen later travels to Ireland with Matholwch, gains honor, bears Gwern,
    is punished after an Irish tumult over Matholwch's earlier insult, and sends a
    letter to Britain by a trained starling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Matholwch asks Bendigeid Vran where he obtained the cauldron he has given
    him; Bendigeid Vran says he received it from Llassar Llaesgyvnewid.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Llassar Llaesgyvnewid and Kymideu Kymeinvoll are described as having come
    from Ireland after escaping an Iron House that had been made red hot around them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Matholwch says that while hunting in Ireland he came to the mound at the head
    of the Lake of the Cauldron and saw a huge yellow-haired man coming from the lake
    with a cauldron on his back, followed by a still larger woman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man tells Matholwch that the woman will bear a son after a month and a
    fortnight, and that the child will be born as a fully armed warrior.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Matholwch maintains the couple for a year, but later his people complain that
    they are disorderly, commit outrages, and harass nobles and ladies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people make an iron chamber, gather smiths and tools, and pile coals as
    high as the top of the chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the man, woman, and children are given plentiful meat and drink and
    become drunk, fire is put to the coals and the chamber is heated until it is red
    hot around them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The man waits until the iron plates are white hot, then strikes them out with
    his shoulder; his wife follows him, and no one except the man and his wife escapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bendigeid Vran says Llassar came to him and gave him the cauldron; he dispersed
    the people through his dominions, where they became numerous, prosperous, and
    fortified places with men and arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the banquet, Matholwch journeys toward Ireland with Branwen in thirteen
    ships, and their arrival in Ireland is received with great joy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Branwen gives a clasp, ring, or royal jewel to every great man or noble lady
    who visits her, and spends the year in renown, honor, friendship, and pleasure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Branwen becomes pregnant, bears a son named Gwern son of Matholwch, and the
    boy is foster-nursed in a place associated with the best men of Ireland.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the second year a tumult arises in Ireland over the insult Matholwch had
    received in Cambria and the payment made for his horses; his close associates
    blame him openly.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The vengeance taken is to drive Branwen away from Matholwch's chamber, make
    her cook for the court, and have the butcher strike her on the ear every day after
    cutting up the meat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Matholwch's men advise forbidding ships, ferry boats, and coracles from going
    to Cambria and imprisoning arrivals from Cambria so that the matter will not be
    known there; this continues for at least three years.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Branwen rears a starling in the cover of the kneading trough, teaches it to
    speak, and teaches it what kind of man her brother is.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Branwen writes a letter about her woes and treatment, binds it to the root
    of the bird's wing, and sends the bird to Britain, where it finds Bendigeid Vran
    and reveals the letter by ruffling its feathers on his shoulder.
  category: sequence
  evidence_refs:
  - ev:11
