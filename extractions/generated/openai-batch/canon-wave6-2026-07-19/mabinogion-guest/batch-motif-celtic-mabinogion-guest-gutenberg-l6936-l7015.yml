canonical_text:
  quote: ''
  summary: The seven survivors travel with Bendigeid Vran's head, hear of Caswallawn's
    conquest and unseen killings, feast at Harlech with wondrous birds for seven years,
    and then remain joyfully at Gwales for eighty years with a closed forbidden door.
    Heilyn opens the door, restoring memory of grief, after which the group buries
    the head in the White Mount, where its concealment protects the island from sea
    invasion. The passage then recounts Ireland's repopulation from five pregnant
    women in a cave and their five sons, and closes this portion of the Mabinogi.
  language: English
  quote_policy: summarized
