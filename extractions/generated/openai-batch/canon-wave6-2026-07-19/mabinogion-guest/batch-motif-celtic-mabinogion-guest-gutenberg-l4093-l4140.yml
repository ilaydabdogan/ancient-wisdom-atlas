canonical_text:
  quote: ''
  summary: Glewlwyd reports to Arthur that a remarkably dignified man waits at the
    portal. Arthur orders immediate hospitality despite Kai’s objection. The visitor,
    identified as Kilhwch, enters mounted, greets Arthur and the whole court, refuses
    ordinary hospitality, and asks for a boon. Arthur swears to grant almost anything
    within the bounds of the world, except certain royal possessions and Gwenhwyvar.
    Kilhwch asks Arthur to bless his hair, and Arthur grants it.
  language: English
  quote_policy: summarized
