canonical_text:
  quote: ''
  summary: Peredur prepares for a tournament, becomes absorbed by a beautiful maiden
    at a splendid tent, borrows money from a miller, and after the miller strikes
    him and orders him to compete, overthrows all opponents. He sends captured men
    to the Empress and horses and arms to the miller’s wife as repayment. The Empress
    summons him; he defeats a coercive party of knights before a wise counselor persuades
    him to visit. In the Empress’s decorated tent, three men successively present
    wine vessels and require combat for them; Peredur receives the vessels, gives
    or sends them to the miller’s wife, and later slays the three men. The Empress
    reminds him of a pledged faith connected with a stone and the killing of the Addanc,
    and Peredur is entertained by her for fourteen years.
  language: English
  quote_policy: summarized
