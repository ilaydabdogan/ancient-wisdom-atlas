canonical_text:
  quote: ''
  summary: A first-person knightly speaker recounts being questioned after a silent
    meal, explaining that he seeks someone superior to him or a chance to master all.
    A courtly man directs him to a wooded glade where a huge one-eyed, one-footed
    black woodward with an iron club rules over wild animals. The speaker follows
    the route, sees the woodward command animals including serpents and dragons, and
    asks the way onward. The woodward directs him up a wooded steep to a valley with
    a green tree, fountain, marble slab, and chained silver bowl. He says that pouring
    water from the bowl onto the slab will bring thunder, hail, stripped leaves, birdsong,
    and finally a black knight who will attack and unhorse the visitor.
  language: English
  quote_policy: summarized
