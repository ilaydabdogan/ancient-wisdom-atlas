canonical_text:
  quote: ''
  summary: 'Gronw instructs Blodeuwedd to discover how Llew Llaw Gyffes can be killed.
    Blodeuwedd draws from Llew the exact conditions of his death: a specially made
    spear, a bath by a river with a roofed cauldron, and a stance with one foot on
    a buck and the other on the cauldron or bath edge. Gronw prepares the spear over
    a year, Blodeuwedd arranges the bath and ambush, and Gronw wounds Llew with a
    poisoned dart. Llew flies away in eagle form and disappears. Gronw and Blodeuwedd
    take the palace and Gronw rules the land. Gwydion searches for Llew, follows a
    sow to a brook and tree, and sees an eagle at the tree top shedding putrid flesh
    and vermin, which the sow eats; he thinks the eagle is Llew.'
  language: English
  quote_policy: summarized
