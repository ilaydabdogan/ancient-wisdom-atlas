canonical_text:
  quote: lo there came a fall of mist, so thick that not one of them could see the
    other.
  summary: After the head of Bendigeid Vran is buried in the White Mount, Manawyddan
    laments his lack of a resting-place. Pryderi offers him Rhiannon and the seven
    Cantrevs, and Manawyddan marries Rhiannon at Narberth. Pryderi later tenders homage
    to Caswallawn. During a feast at Narberth, the four companions go to the Gorsedd;
    thunder and a thick mist are followed by the disappearance of people, animals,
    dwellings, smoke, and fire from the land, leaving only the four. They live by
    hunting and honey for two years, then leave for Lloegyr and support themselves
    by making saddles and enamelled housings.
  language: English
  quote_policy: quoted
