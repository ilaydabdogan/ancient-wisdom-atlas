canonical_text:
  quote: ''
  summary: 'The passage opens the tale of Peredur: his father Evrawc and six brothers
    die in warfare, after which Peredur''s mother removes him to a wilderness household
    and keeps him from horses and arms. Peredur shows ignorance of animals and chivalric
    equipment, then encounters three named knights, learns what their gear is, prepares
    an improvised horse and trappings, and receives his mother''s advice before riding
    toward Arthur''s Court.'
  language: English
  quote_policy: summarized
