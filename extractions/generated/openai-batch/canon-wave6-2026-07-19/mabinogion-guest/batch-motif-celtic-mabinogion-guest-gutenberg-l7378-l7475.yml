canonical_text:
  quote: Then Llwyd struck her with a magic wand, and she was changed back into a
    young woman, the fairest ever seen.
  summary: A chieftain prepares to hang a mouse for stealing, but a bishop arrives
    and offers escalating ransom. The chieftain instead demands the release of Pryderi
    and Rhiannon, removal of an enchantment from Dyved, knowledge of the mouse's identity,
    a promise of no future enchantment, and immunity from vengeance. The bishop reveals
    himself as Llwyd son of Kilcoed, who enchanted Dyved and transformed his household
    into mice to destroy corn in revenge for Gwawl. The mouse is Llwyd's pregnant
    wife. After Pryderi and Rhiannon appear free, the chieftain releases the mouse;
    Llwyd restores her to human form with a magic wand and shows Dyved restored. The
    passage then begins the fourth portion of the Mabinogi, introducing Math son of
    Mathonwy, his dependence on a maiden's lap, Goewin, and Math's nephews acting
    in his stead.
  language: English
  quote_policy: quoted
