canonical_text:
  quote: ''
  summary: Peredur refuses wealth and a proposed love-match, comes to a palace where
    slain men are restored to life, learns that an Addanc in a cave kills them daily,
    follows the youths toward the Addanc, receives a stone from a vanishing lady that
    will let him see the hidden creature, and then passes a symbolic valley with black
    and white sheep, a river, a half-burning tree, and a youth who identifies the
    narrow road to the Addanc's cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A maiden tells Peredur that he may become rich through the treasure of the
    black man he has slain and may choose a maiden for love; Peredur answers that
    he did not come to woo and desires none of their goods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Peredur rides to the Palace of the Sons of the King of the Tortures, where
    he sees only women, who rise and rejoice at his coming.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A charger arrives carrying a corpse; a woman removes the corpse, anoints it
    with warm water and precious balsam, and the man rises alive. Two other men are
    treated in the same way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peredur is told that an Addanc in a cave slays the men once every day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The next morning the youths refuse to let Peredur accompany them because,
    if he is slain, he has no one to bring him back to life; he follows after them
    anyway.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Peredur encounters a very fair lady seated on a mound, and she says she knows
    he is going to encounter the Addanc.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The lady says the Addanc kills not by courage but by craft: it has a cave
    with a stone pillar at the entrance, sees entrants while remaining unseen, and
    kills from behind the pillar with a poisonous dart.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lady offers Peredur a stone that will let him see the Addanc while the
    Addanc cannot see him, if he pledges to love her above all women; Peredur pledges,
    she tells him to seek toward India, vanishes, and leaves the stone in his hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Peredur comes to a wooded valley with a river and level meadows; white sheep
    stand on one side and black sheep on the other, and sheep change color when crossing
    in response to bleating.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Beside the river stands a tall tree, one half aflame from root to top and
    the other half green and in full leaf.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near the divided tree, Peredur sees a royal-bearing youth seated on a mound
    with two leashed greyhounds, while hounds raise deer in the wood opposite.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: Three roads lead from the mound; the youth explains that one goes to his palace,
    another to a town with food and drink, and the narrowest road goes toward the
    Addanc's cave. Peredur chooses the narrow road.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
