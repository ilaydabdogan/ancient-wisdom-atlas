canonical_text:
  quote: ''
  summary: Bendigeid Vran learns that Matholwch is leaving without asking leave after
    an insult. Messengers report Matholwch's grievance, especially that Branwen had
    been given to him as bride before the insult. Bendigeid Vran sends envoys offering
    compensation, including horses, a silver staff, a gold plate, and peace. Matholwch's
    council accepts. At a renewed feast, Bendigeid Vran adds a cauldron that restores
    slain men by the next day, though without speech. The compensation in horses and
    colts is paid, and the commot receives the name Talebolion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bendigeid Vran receives tidings that Matholwch is leaving the court without
    asking leave, and messengers are sent to ask why.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Matholwch says he has been insulted and objects that Branwen, daughter of
    Llyr and daughter of the King of the Island of the Mighty, had been given to him
    as bride before the insult occurred.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first messengers answer that the insult was not the will of the court
    or council and that the dishonour is greater to Bendigeid Vran than to Matholwch.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bendigeid Vran sends another embassy to offer Matholwch a sound horse for
    every injured one, a silver staff as large and tall as himself, and a gold plate
    as broad as his face.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bendigeid Vran says the offender acted against his will but is his brother
    by the mother's side, making it hard for him to put the offender to death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Matholwch takes counsel; the council decides that refusing the offer would
    likely bring more shame than accepting the atonement, and they return to the court
    in peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pavilions and tents are arranged like a hall, and the parties sit to eat
    in the same order as at the beginning of the feast.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bendigeid Vran notices Matholwch is less cheerful than before and offers to
    add whatever Matholwch chooses to the atonement.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bendigeid Vran gives Matholwch a cauldron whose property is that a slain man
    cast into it will be well the next day, except that he will not regain speech.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next morning Matholwch is paid with trained horses as long as they last,
    then with colts in another commot until the whole payment is complete; afterward
    that commot is called Talebolion.
  category: sequence
  evidence_refs:
  - ev:8
