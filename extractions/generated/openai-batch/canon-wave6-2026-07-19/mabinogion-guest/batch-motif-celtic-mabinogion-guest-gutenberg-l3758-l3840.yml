canonical_text:
  quote: ''
  summary: After Geraint has healed, Arthur permits him to depart. Geraint and Enid
    hear a lamenting woman beside her slain husband, whom she says three giants killed.
    Geraint sends Enid to wait with her, pursues and kills the giants, but is badly
    wounded and falls lifeless from his horse. The Earl of Limours finds the women
    lamenting, has the dead knight buried, and carries Geraint, who may still be alive,
    to his court on a bier. The Earl pressures Enid to change clothes, accept him
    and his earldom, and eat and drink; she refuses until Geraint does likewise. When
    the Earl strikes Enid, her cry awakens Geraint from his swoon; he rises from the
    bier, kills the Earl, and the people flee in dread at seeing one they thought
    dead rise up.
  language: English
  quote_policy: summarized
