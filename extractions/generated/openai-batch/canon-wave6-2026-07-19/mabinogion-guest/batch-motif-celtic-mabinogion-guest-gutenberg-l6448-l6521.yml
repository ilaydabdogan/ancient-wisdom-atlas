canonical_text:
  quote: ''
  summary: Teirnyon brings the boy to Narberth, where Rhiannon is still performing
    penance for the alleged killing of her son. At the palace feast Teirnyon recounts
    how he and his wife reared the child and declares him to be Rhiannon and Pwyll’s
    son. The court recognizes him; his name Pryderi is confirmed; Pwyll rewards and
    honors Teirnyon and arranges further fosterage with Pendaran Dyved. Pryderi grows
    into an accomplished youth, succeeds Pwyll, expands his rule, and marries Kicva.
  language: English
