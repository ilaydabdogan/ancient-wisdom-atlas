canonical_text:
  quote: ''
  summary: Taliesin, found by Elphin after the failure of the weir, sings to console
    and protect him. Asked what he is, Taliesin recounts prior formation, pursuit,
    many transformations, becoming a grain of wheat, being put into a leather bag
    and cast on the sea, and being freed by God. Elphin brings him to Gwyddno, where
    Taliesin is identified as a bard and speaks despite his small size. Taliesin then
    sings of blessed water, three births, gathered knowledge, knowledge of past and
    future, and divine protection. Elphin’s wife nurses him; Elphin prospers, and
    Taliesin remains with him until age thirteen, before Elphin goes to Maelgwn Gwynedd’s
    Christmas court.
  language: English
  quote_policy: summarized
