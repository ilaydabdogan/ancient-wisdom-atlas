canonical_text:
  quote: ''
  summary: 'A party enters Yspaddaden Penkawr''s castle after silently killing its
    porters and watchdogs. They request Olwen for Kilhwch. Yspaddaden repeatedly throws
    poisoned darts at them; Bedwyr, Menw, and Kilhwch each catch and return a dart,
    wounding him. After Kilhwch pledges to act justly, Yspaddaden agrees to name conditions
    for giving his daughter: a vast hill must be cleared, manured, ploughed, sown,
    and ripened in one day for wedding food and drink, and several unwilling helpers
    and extraordinary yoke-animals must be obtained.'
  language: English
  quote_policy: summarized
