canonical_text:
  quote: ''
  summary: In the closing portion of “The Dream of Maxen Wledig,” Helen asks for Britain,
    adjacent islands, three castles, and roads; Maxen is challenged by a new Roman
    emperor, marches to Rome, and is restored after Helen’s brothers and a British
    host capture the city by ladder assault. Kynan and Adeon receive a host for further
    conquest; Adeon returns, Kynan remains, and the passage explains the naming and
    language of Armorican Britons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The damsel asks as her maiden portion for the Island of Britain for her father,
    the three adjacent islands, and three chief castles in places she may choose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The highest castle is chosen at Arvon; two other castles are made at Caerlleon
    and Caermarthen, and earth from Rome is brought so the emperor may sleep, sit,
    and walk on it more healthfully.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Helen plans high roads from one castle to another throughout Britain, and
    the roads are made and named for Helen Luyddawc.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The emperor stays in Britain seven years; the passage states a Roman custom
    that an emperor remaining in other lands more than seven years would remain to
    his overthrow and never return to Rome.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men of Rome make a new emperor, who sends Maxen a brief threatening letter;
    Maxen sends a similarly brief reply to the man styling himself emperor in Rome.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maxen sets out toward Rome with his army, conquers France, Burgundy, and other
    lands on the way, and besieges Rome for a year without taking it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Helen’s brothers arrive from Britain with a small, well-appointed host; Helen
    recognizes their standards, and Kynan and Adeon meet the emperor.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Kynan proposes a more expert attack; the British force measures the wall by
    night, makes ladders, and attacks while the emperors are eating at midday.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The new emperor is slain before he can arm himself, and the attackers spend
    three nights and three days subduing the city and taking the castle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Maxen and Helen ask for the city, the men of Britain say only they can
    give it; the gates of Rome are opened, Maxen sits on the throne, and the Romans
    submit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Maxen gives a host to Kynan and Adeon to conquer whatever region they desire;
    they conquer lands, castles, and cities, killing the men and keeping the women
    alive.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Adeon chooses to return to his own land with many companions, while Kynan
    remains with the other part and dwells there.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The remaining conquerors cut out the tongues of the women to prevent corruption
