canonical_text:
  quote: I, who am all, and made it all, abide its separate Lord!
  summary: Krishna addresses Arjuna and enumerates portions of his divine majesty,
    identifying himself with supreme exemplars among gods, cosmic bodies, scriptures,
    mountains, waters, trees, animals, serpents, sages, virtues, time, birth, death,
    wisdom, and power. He concludes that all living and lifeless beings exist by him,
    that his glories are boundless, and that he is both all and the separate lord
    of all.
  language: English
  quote_policy: quoted
