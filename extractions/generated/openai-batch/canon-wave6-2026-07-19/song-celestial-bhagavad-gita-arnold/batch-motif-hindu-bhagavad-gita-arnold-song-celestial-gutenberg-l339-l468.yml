canonical_text:
  quote: ''
  summary: Arjuna collapses in grief before the two armies, refuses to fight revered
    opponents, and asks Krishna for counsel. Krishna rebukes his weakness and teaches
    that the wise do not mourn for living or dead, because the Life or Spirit is eternal
    while bodily frames perish and are exchanged like worn garments. Krishna also
    says weapons and elements cannot harm the Life, and that birth and death are an
    ordained cycle.
  language: English
  quote_policy: summarized
