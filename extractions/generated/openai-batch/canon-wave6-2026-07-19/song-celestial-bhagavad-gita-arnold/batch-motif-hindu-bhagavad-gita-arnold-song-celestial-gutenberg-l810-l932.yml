canonical_text:
  quote: ''
  summary: Krishna tells Arjuna that the deathless Yoga was first taught by him to
    Vivaswata and transmitted through Manu, Ikshwaku, and royal Rishis before being
    lost and now redeclared. Arjuna questions the chronology. Krishna explains his
    repeated births, his manifestation when righteousness declines, liberation through
    knowing his divine work, the wisdom of action without attachment, and multiple
    outer and inner forms of sacrifice that purify and lead to Brahm.
  language: English
  quote_policy: summarized
