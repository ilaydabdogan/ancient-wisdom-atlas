canonical_text:
  quote: ''
  summary: Krishna instructs Arjuna about knowledge of himself, describes his lower
    and higher nature, identifies himself as the source, support, and essence of the
    universe, explains why beings fail or succeed in knowing him, contrasts devotion
    to him with worship of lesser gods, and closes by describing those who seek refuge
    from birth and death and know him at the hour of death.
  language: English
  quote_policy: summarized
