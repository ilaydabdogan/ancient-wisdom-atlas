canonical_text:
  quote: ''
  summary: The speaker teaches Arjuna that knowledge is a superior sacrifice, gained
    through reverence, searching, and instruction from truth-seers. Truth and knowledge
    remove doubt, purify wrongdoing, burn away the dross of works, and lead the faithful
    self-mastered person to peace. Doubters lack peace, while the enlightened are
    no longer fettered by works. Arjuna is urged to cut doubt with the sword of wisdom
    and arise to the field.
