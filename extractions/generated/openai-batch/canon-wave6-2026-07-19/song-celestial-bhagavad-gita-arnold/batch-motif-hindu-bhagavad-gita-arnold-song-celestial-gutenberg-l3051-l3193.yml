canonical_text:
  quote: '"Trouble and ignorance are gone! the Light / Hath come unto me"'
  summary: Krishna concludes by restricting the teaching from faithless or mocking
    hearers, praising those who teach, read, or hear the discourse faithfully, and
    promising blessed postmortem regions to faithful hearers. He asks whether Arjuna's
    ignorance has vanished. Arjuna replies that his doubt is gone and he will act
    according to Krishna's word. Sanjaya reports the dialogue to the king, praises
    Krishna as Lord of Yoga, remembers Hari's visible splendour, and declares blessing,
    victory, and power wherever the song of Arjuna speaking with God is present. The
    passage ends with the chapter and work colophon and editorial footnotes.
  language: English
