canonical_text:
  quote: ''
  summary: Arjuna asks Krishna to define Brahma, Adhyatman, Karma, Adhibhuta, Adhidaiva,
    Adhiyajna, and how good people find Krishna at death. Krishna identifies himself
    with these sacred categories, teaches that final meditation determines the soul's
    destination, describes disciplined dying with OM and devotion, teaches non-return
    from rebirth for those who attain him, presents Brahma's day-and-night cycle of
    manifestation and dissolution, and closes by valuing this wisdom above ritual
    merits as leading to perfect peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arjuna asks Krishna to explain Brahma, Adhyatman, Karma, Adhibhuta, Adhidaiva,
    Adhiyajna, and how good men find Krishna at death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna identifies himself as Brahma, Adhyatman, Adhibhuta, Adhidaiva, Purusha,
    and Adhiyajna, and says all shrines flame to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Krishna says that one who meditates on him alone while putting off the flesh
    comes to and enters his Being, while one who meditates otherwise goes to the object
    of that final meditation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krishna tells Arjuna to keep him in his heart and fight, promising that those
    whose heart and mind are fixed on him come to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krishna's described form is ancient, supports the Three Worlds, quickens every
    atom, shines brighter than the sun, and disperses darkness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The faithful dying person passes peacefully to Purusha's heaven, the place
    called Aksharam, sought by Veda-readers, saints, and ascetics.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The highest way is described as shutting the gates of the senses, locking
    desire in the heart, centering the vital airs on the parting thought, murmuring
    OM, and dying while meditating on Krishna.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Yogi who looks only to Krishna attains him, does not fall back to birth,
    and takes the way of utmost blessedness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Krishna describes Brahma's Day and Night as each consisting of a thousand
    Yugas; at Dawn the invisible becomes visible, and at Night living things fade
    back, expire, and later rise newborn.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: An unmanifest, infinite, unchanging Life endures when created things pass
    away; those who arrive there do not return, and Krishna says that Life is his
    and that all living things dwell in him.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that this wisdom is greater than Vedic fruit, gifts, prayer,
    or fast, and that the Yogi who knows this way reaches utmost perfect peace.
  category: speech
  evidence_refs:
  - ev:9
