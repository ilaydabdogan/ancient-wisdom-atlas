canonical_text:
  quote: No heart that holds one right desire / Treadeth the road of loss!
  summary: Krishna tells Arjuna that one who desires righteousness is not lost, even
    if he fails. After death such a person reaches the Region of the Just, is later
    born again in a favorable household or rarely in a yogin household, regains prior
    spiritual attainment, strives through repeated births toward perfection, and is
    praised as a yogi devoted to Krishna.
  language: English
  quote_policy: quoted
