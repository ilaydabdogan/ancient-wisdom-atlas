canonical_text:
  quote: Therefore I give thee sense divine. Have other eyes, new light!
  summary: Arjuna asks Krishna to reveal his full divine form. Krishna says he will
    show countless forms and the universe gathered in himself, but grants Arjuna divine
    sight because human eyes cannot bear it. Sanjaya narrates the manifestation as
    a vast, radiant form with countless eyes, mouths, weapons, ornaments, and faces.
    Arjuna beholds the whole universe contained in one body, sees gods and beings
    within it, worships, and describes the form’s overwhelming radiance, cosmic extent,
    and the fearful reverence of divine companies and the worlds.
  language: English
  quote_policy: quoted
