canonical_text:
  quote: ''
  summary: 'A teacher addresses Arjuna about lawful warrior duty, the indestructibility
    of life, honor and dishonor in battle, heavenly or earthly outcomes, and equanimity
    toward opposed results. The speaker then shifts to Yog teaching: release from
    karmic bondage, faith, freedom from the three qualities and pairs of opposites,
    action without attachment to fruits, equability, pure devotion, meditation, and
    rising beyond bodily bonds. Arjuna then asks Kesava how to recognize one with
    a steadfast meditative heart.'
  language: English
  quote_policy: summarized
