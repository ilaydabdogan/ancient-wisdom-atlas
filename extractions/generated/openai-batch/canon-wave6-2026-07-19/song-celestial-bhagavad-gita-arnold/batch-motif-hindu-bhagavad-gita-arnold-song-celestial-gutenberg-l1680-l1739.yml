canonical_text:
  quote: ''
  summary: Krishna tells Arjuna that gods and Rishis do not know his nature, that
    he is unborn and the source of mortal qualities, cosmic sages, Manus, ancestors,
    and mankind. He says wise devotees who know him as the source of all are drawn
    to him, and he grants them understanding while dispelling ignorance with the lamp
    of wisdom. Arjuna affirms Krishna as supreme and incomprehensible to gods, men,
    and demons, then asks how to know Krishna among his many forms and requests a
    fuller account of his manifestations.
  language: English
  quote_policy: summarized
