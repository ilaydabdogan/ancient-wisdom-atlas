canonical_text:
  quote: ''
  summary: 'Krishna describes to Pritha''s Son the marks of the wise and self-governed
    person: abandonment of disturbing desires, equanimity in sorrow and joy, withdrawal
    of the senses, mastery over sense-objects, tranquillity, wisdom, and final attainment
    of the state of Brahm and Nirvana. The passage ends Chapter II, titled “Sankhya-Yog”
    or “The Book of Doctrines.”'
  language: English
  quote_policy: summarized
