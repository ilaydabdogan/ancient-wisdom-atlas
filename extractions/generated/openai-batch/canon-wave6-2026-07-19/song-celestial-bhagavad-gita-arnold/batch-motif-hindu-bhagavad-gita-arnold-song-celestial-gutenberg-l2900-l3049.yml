canonical_text:
  quote: ''
  summary: Arjuna asks Krishna to distinguish Sannyas and Tyaga. Krishna defines renunciation,
    teaches that worship, penance, and alms should be performed without attachment
    to fruits, describes three kinds of pleasure and the three Qualities, assigns
    duties to social groups according to nature, and teaches that disciplined devotion,
    renounced action, love, and refuge in him lead to Brahm, eternal rest, and freedom
    from sins.
  language: English
  quote_policy: summarized
