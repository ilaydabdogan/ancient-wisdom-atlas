- id: obs:1
  text: Arjuna asks Krishna to explain the truth of Sannyas and Tyaga and the distinction
    between them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna defines Sannyas as foregoing acts that spring from desire and Tyaga
    as renouncing the fruit of acts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Krishna reports views about renouncing action and states that worship, penance,
    and alms are to be performed and are purifying waters for true souls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krishna says even high works must be practiced while yielding up attachment
    and all fruit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Krishna describes three kinds of pleasure: one bitter first and later sweet
    like Amrit, one sweet first and later bitter like poison, and one dark pleasure
    arising from sloth, sin, and foolishness.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Krishna says nothing on earth or among the gods in heaven has its being apart
    from the three Qualities framed by Nature.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The work of Brahmans, Kshatriyas, Vaisyas, and Sudras is said to be fixed
    by Qualities planted in each, and each group is given distinct virtues or tasks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Krishna says a person who performs the allotted work diligently and contentedly
    lays hold of perfection through worship wrought by work of the source of all life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Krishna says one's own work is better than another's work, natural duty should
    not be abandoned, every work has blame as every flame is wrapped in smoke, and
    surcease of work comes through an unfettered mind, subdued soul, dead desires,
    and renounced results.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Krishna describes a disciplined, restrained, solitary, meditative person free
    from passions and arrogance who grows to oneness with Brahm, no longer sorrows
    or desires, and loves all living beings equally.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Krishna says love and worship lead one to know him, enter into him, and win
    eternal rest by his grace; he instructs Arjuna to do all for him, renounce for
    him, sacrifice heart, mind, and will to him, and live in faith of him.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Krishna warns that if Arjuna says he will not fight while relying on himself,
    the purpose will prove vain because his qualities would spur him to war.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Krishna says a Master lives in the hearts of men and makes their deeds dance
