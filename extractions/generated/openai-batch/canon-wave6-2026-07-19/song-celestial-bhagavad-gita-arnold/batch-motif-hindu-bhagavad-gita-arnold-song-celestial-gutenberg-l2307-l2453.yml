canonical_text:
  quote: ''
  summary: Arjuna asks Krishna about Life, Soul, and knowledge. Krishna distinguishes
    the body or field from the knower of the field, lists constituents of embodied
    existence and marks of true wisdom, describes the all-pervading Para-Brahm, explains
    Nature and Spirit and rebirth, and teaches that seeing the same imperishable Soul
    in all beings leads beyond death and toward liberation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arjuna asks Kesava to explain Life, the Soul beyond, and what can be known.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna identifies the visible flesh as Kshetra, the field, and the viewing,
    knowing principle as Kshetrajna, the Soul.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Krishna says he is Kshetrajna in all fields.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists elements, conscious life, mind, unseen vital force, the
    body’s nine gates, five domains of sense, desire, dislike, pleasure, pain, thought,
    and persistency of being as wrought on Matter by the Soul.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krishna names qualities such as humbleness, truthfulness, harmlessness, patience,
    purity, self-control, detachment, solitude, and resolute effort toward the Utmost
    Soul as true Wisdom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Krishna describes the Para-Brahm as uncreated, beyond simple categories of
    form and unformed, with hands, feet, eyes, ears, and faces everywhere.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Krishna says the Para-Brahm sustains all, is within and without all beings,
    is motionless yet moving, close yet far, and ends and re-creates all at the End
    of Times.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Para-Brahm is called the Light of Lights, Wisdom, Wisdom’s way, Guide
    of the wise, and planted in every heart.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Nature and Spirit are said to have no beginning; Nature produces qualities
    and changes, while Spirit informs the acting frame and causes feeling of pain
    and pleasure.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Spirit linked to molded matter is said to enter a bond with qualities framed
    by Nature and to breed birth again in good or evil yonis.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Even in the bodily prison, Spirit is described as pure, supreme, surveying,
    governing, guarding, possessing, Lord and Master, Purusha, and one Soul with Krishna.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Those who know Purusha working through Nature’s modes are said not to take
    on flesh again; others may find the Soul by meditation, philosophy, holy life,
    works, or teaching, and overpass Death.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Life in moving and unmoving things, plants, and seeds is said to arise by
    the bond of Matter and Spirit.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: The one who sees the same imperishable Soul in every place and form is said
    to avoid wronging himself and to go the highest road to bliss.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: Separate living things are said to issue from One and blend again to One.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:16
  text: The subtle Soul is compared to ethereal air that pervades all without taint
    and to sunlight shining in every place without being changed by what it shines
    upon.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:17
  text: The chapter ends with the title identifying the teaching as the separation
    of Matter and Spirit.
  category: other
  evidence_refs:
  - ev:16
