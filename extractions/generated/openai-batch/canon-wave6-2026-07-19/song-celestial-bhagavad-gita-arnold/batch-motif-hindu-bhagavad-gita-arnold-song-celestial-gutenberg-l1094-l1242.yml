canonical_text:
  quote: ''
  summary: Krishna teaches Arjuna that rightful work without seeking gain, self-command,
    moderation, solitary meditation, restraint of senses, and seeing one Life in all
    beings lead to peace, Nirvana, and unity with Brahma. Arjuna questions whether
    the restless heart can be restrained and asks what becomes of a faithful striver
    who fails.
  language: English
  quote_policy: summarized
