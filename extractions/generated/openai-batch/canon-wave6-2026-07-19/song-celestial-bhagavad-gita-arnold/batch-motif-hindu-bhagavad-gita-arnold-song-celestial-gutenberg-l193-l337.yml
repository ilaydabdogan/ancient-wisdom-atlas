canonical_text:
  quote: ''
  summary: The opening of Chapter I presents Dhritirashtra asking Sanjaya what happened
    on the sacred field of Kurukshetra. Sanjaya narrates Duryodhana's survey of the
    armies, the sounding of battle conches, Krishna driving Arjuna's chariot between
    the two hosts, Arjuna seeing his kin on both sides, and Arjuna's refusal to fight
    because killing family would bring grief, guilt, social disorder, neglected rites,
    and harm to ancestors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritirashtra asks Sanjaya what his people and the Pandavas did when ranged
    for battle on the sacred plain of Kurukshetra.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Duryodhana approaches Drona and points out the vast Pandava fighting line
    arrayed by the son of Drupada.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duryodhana names warriors on both sides, says Bhishma holds command on his
    side, and orders captains near Bhishma's ranks to prepare support.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A conch, trumpets, drums, cymbals, gongs, and horns sound, and the passage
    compares the tumult to a loosened tempest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krishna and Arjuna are seen on a golden car yoked with white steeds, and both
    blow battle-shells; other named warriors also blow conches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arjuna's ensign-badge is Hanuman the monkey, and Arjuna asks Krishna, his
    charioteer, to drive between the armies so he may inspect those who will fight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Krishna drives the bright car between the hosts where Bhishma, Drona, and
    other lords stand, and tells Arjuna to see his Kuru kindred.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Arjuna sees grandsires, fathers, uncles, brothers, sons, cousins, sons-in-law,
    nephews, friends, and elders arranged on both sides, and the passage says his
    heart melts with pity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arjuna says his limbs fail, his mouth dries, his body shudders, his hair bristles,
    his bow Gandiv slips, his skin burns, and he foresees woe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Arjuna says victory, rule, wealth, and life are not desirable if bought with
    the blood of kin, elders, and friends.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Arjuna says killing kinsfolk would bring guilt, overthrow families, extinguish
    household piety, cause neglected rites, send a family on a hell-ward road, and
    deprive ancestors of funeral offerings.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Arjuna says he would rather face his kinsmen weaponless and bare-breasted
    than answer blow with blow.
  category: speech
  evidence_refs:
  - ev:7
