canonical_text:
  quote: ''
  summary: Krishna reveals a hidden kingly knowledge to Arjuna, describes himself
    as the cosmic source, sustainer, recipient of sacrifice, and destination of devotion,
    explains cyclic creation and dissolution, contrasts ritual heaven and return with
    devotion to him, and teaches that simple offerings and dedicated action free devotees
    from karmic bondage and lead to him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krishna says he will reveal a deepest-concealed kingly knowledge that frees
    the soul from ills and sin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who fail in faith do not reach Krishna and sink again into the changing
    realm of flesh.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Krishna states that the whole universe is spread by him, that existences are
    in him, and that he remains outside and beyond them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the close of each Kalpa all things return to Krishna, and at the beginning
    of each Kalpa all issue new-born from him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krishna says he sends forth visible realms through Prakriti and remains apart,
    free, and unattached to these makings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Untaught minds mistake Krishna when he is veiled in form, while Mahatmas worship
    him as the eternal source of life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Krishna identifies himself with sacrifice, prayer, funeral offering, healing
    herb, ghee, mantra, flame, and that which burns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Krishna identifies himself with parental and ancestral roles, sacred syllable
    and Vedas, refuge, witness, source, sea of life, seed, sun heat, rain, death,
    and immortal life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Those who learn the threefold Veds, drink Soma, purge sins, and perform sacrifice
    earn passage to Swarga and Indra's heaven, but return to the world of death and
    change when their merit is spent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Followers of other gods, Pitris, and Bhuts go to the corresponding beings,
    while those who love Krishna come to Krishna.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Krishna accepts a leaf, flower, fruit, or poured water when it is offered
    with faith, love, and pious will.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Krishna instructs that eating, sacrificing, giving gifts, praying, and fasting
    should be done for him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Doing all actions for Krishna frees a person from Karmabandh and leads the
    person safely to Krishna after leaving the flesh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Krishna says he is alike for all, without hate or favor, yet loves those who
    worship him with love.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: A person of evil life who turns straight to Krishna is to be counted among
    the good and will become righteous.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Krishna says people of various births or social positions, including Vaisya
    and Sudra, can set foot on the highest path by turning to him.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: Krishna ends by instructing hearers to fix heart and thought on him, adore
