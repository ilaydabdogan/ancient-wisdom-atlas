canonical_text:
  quote: The world of sense can no more stain his soul / Than waters mar th' enamelled
    lotus-leaf.
  summary: Arjuna asks Krishna whether renouncing works or serving through work is
    the better way. Krishna answers that both lead to bliss, but holy action without
    attachment is better. He describes the true renouncer as free from craving and
    rejection, treats Sankhya and Yoga as reaching the same high rest, and teaches
    non-doership, detachment from the fruits of action, equanimity, inward discipline,
    unity with Brahma, wisdom as light, equality of beings, mastery of passions, breath
    restraint, and deliverance.
  language: English
  quote_policy: quoted
