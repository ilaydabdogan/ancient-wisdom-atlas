canonical_text:
  quote: ''
  summary: 'Arjuna asks Krishna whether worship of God as revealed or worship of the
    unrevealed, unbodied divine is the better way. Krishna answers that both types
    of worshippers come to him, though the unmanifest path is hard for embodied humans.
    He urges devotion, service, work offered to him, refuge in him, surrender of results,
    and renunciation. He promises to lift the clinging devotee from life''s ocean
    of distress and death. The passage closes by describing the qualities of the devotee
    Krishna loves: non-hatred, compassion, humility, self-mastery, equanimity, detachment,
    steadfast faith, and unseen love.'
  language: English
  quote_policy: summarized
