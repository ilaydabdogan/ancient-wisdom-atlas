canonical_text:
  quote: This Universe the womb is where I plant / Seed of all lives!
  summary: 'Krishna teaches Arjuna about the three qualities of Nature: Soothfastness,
    Passion, and Ignorance. He describes the Universe as a womb in which he plants
    the seed of life, explains how the qualities bind embodied souls and shape postmortem
    outcomes, and describes the person who passes beyond the qualities through equanimity
    and devotion, attaining Brahma, Amrit, immortality, and Krishna.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Krishna says he will reveal the highest wisdom, by which saints have passed
    to perfection and fellowship with him, avoiding rebirth at Kalpas and change at
    Pralayas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna presents the Universe as a womb where he plants the seed of all lives,
    resulting in the birth of beings; Brahma is described as conceiving or mothering
    mortal forms, while Krishna fathers by sending seed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Sattwan, Rajas, and Tamas are named as the three qualities of Nature: Soothfastness,
    Passion, and Ignorance.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The three qualities bind the changeless Spirit in changeful flesh: Soothfastness
    binds to happiness and truth, Passion binds through works, and Ignorance binds
    through darkness, sloth, and stupor.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Krishna gives signs of the qualities: the Lamp of Knowledge shining in the
    body''s gateways indicates Soothfastness; longing, ardour, unrest, striving, and
    avarice indicate Passion; darkness, dulness, sloth, and stupor indicate Ignorance.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When a soul departs fixed in Soothfastness it goes to a perfect and pure place
    of those who know Truth; when it departs in Impulse it goes to the world of spirits
    tied to works; when it dies in hardened Ignorance it is born anew in an unlighted
    womb.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The fruits of the qualities are described: Soothfastness bears true and sweet
    fruit, lusts bear pain and toil, and Ignorance bears deeper darkness.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Those of the first mode rise higher, those of the second take a middle place,
    and darkened souls sink to lower deeps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A living person who perceives that the only actors are the Qualities and knows
    what rules beyond them comes near to Krishna.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Soul passing beyond the Three Qualities overcomes Birth, Death, Sorrow,
    and Age and drinks the undying wine of Amrit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Arjuna asks Krishna for the signs, life, and path of one who has gone past
    the Three Modes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Krishna describes the surmounter of the Qualities as equanimous, unruffled,
    self-centred, detached, tolerant toward friends and foes, and even-minded toward
    grief and joy, clod, marble, gold, praise, dispraise, honour, and dishonour.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Krishna says that one who adores him with single, fervent faith passes beyond
    the Qualities, conforms to Brahma, and attains him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
