canonical_text:
  quote: Thou seest Me as Time who kills,
  summary: Arjuna beholds Krishna's terrifying universal form devouring warriors and
    multitudes through flaming jaws. Krishna identifies himself as Time, the destroyer,
    and commands Arjuna to fight as his instrument. Sanjaya reports Arjuna trembling
    and praying. Arjuna praises Krishna as the supreme source and totality of beings,
    asks forgiveness for former familiarity, and requests the return of Krishna's
    gentler, recognizable form as charioteer.
  language: English
  quote_policy: quoted
