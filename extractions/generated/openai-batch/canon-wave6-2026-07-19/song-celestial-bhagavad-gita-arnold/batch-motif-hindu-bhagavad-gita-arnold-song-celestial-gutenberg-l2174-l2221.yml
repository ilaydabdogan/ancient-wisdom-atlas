  quote: "“Once more I am thy Krishna, the form thou knew'st of old!”"
  summary: Krishna tells Arjuna that the terrifying and glorious divine manifestation
    was granted to him alone through divine favor, not through ritual or ascetic means.
    Krishna resumes the familiar charioteer/human form, calming Arjuna. Krishna then
    teaches that he is known, seen, and entered through service, faith, surrender,
    and love for all he has made.
