  quote: Men call the Aswattha,--the Banyan-tree,-- / Which hath its boughs beneath,
    its roots above,-- / The ever-holy tree.
  summary: Krishna describes the inverted Aswattha tree, the need to cut its binding
    roots by detachment, the eternal realm of no return, the Spirit entering and leaving
    bodies with senses and mind, divine presence in cosmic light, plants, breath,
    and food, twofold Being, and the speaker as Purushottama beyond divided and undivided
    Being.
