canonical_text:
  quote: ''
  summary: Krishna contrasts divine and undivine qualities. He says the heavenly birth
    leads to deliverance, while Asura-associated birth leads to bondage. He describes
    the unheavenly as denying law, order, lordship, and causal purpose; pursuing desire,
    wrath, wealth, violence, and hollow sacrifice; falling to Naraka; and being cast
    repeatedly into devilish wombs until they worship him. He closes by naming lust,
    wrath, and avarice as the three doors of Hell, which must be avoided to reach
    peace and Swarga's gate.
  language: English
  quote_policy: summarized
