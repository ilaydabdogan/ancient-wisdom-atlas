canonical_text:
  quote: ''
  summary: Arjuna asks why Krishna urges him to fight if meditation is nobler than
    action. Krishna answers by teaching two paths of wisdom, the necessity of action,
    selfless duty, sacrifice as a reciprocal relation with the gods, the food-rain-sacrifice
    cycle, the need to uphold the world through action, and the discipline of acting
    without attachment. Arjuna then asks what force drives a person unwillingly toward
    evil.
  language: English
  quote_policy: summarized
