canonical_text:
  quote: each of us will retain the kingdom to which he is born.
  summary: Swedish messengers led by Thorgaut Skarde and Asgaut demand tribute from
    Norwegian bondes on behalf of Olaf the Swede. The bondes refuse to pay both kings
    and refer the matter to King Olaf the Thick. Before King Olaf, the messengers
    present the Swedish claim; Olaf rejects it, asserts his own right to Norway, and
    proposes a spring meeting at the ancient frontier for peace. After Asgaut continues
    the errand despite Olaf’s response, Olaf’s pursuivants seize and hang Asgaut’s
    party, and Thorgaut reports the matter to the enraged Swedish king.
  language: English
  quote_policy: quoted
