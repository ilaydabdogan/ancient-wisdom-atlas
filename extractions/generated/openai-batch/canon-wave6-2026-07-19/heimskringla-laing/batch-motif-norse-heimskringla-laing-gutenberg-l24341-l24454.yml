canonical_text:
  quote: ''
  summary: The passage narrates the battle in which English forces circle and attack
    the Northmen, King Harald Sigurdson charges into the fiercest fighting and is
    killed by an arrow in the windpipe, the surviving Northmen refuse quarter, Eystein
    Orre arrives with reinforcements and Harald's banner Land-ravager, and the conflict
    ends with heavy Norwegian losses. Styrkar the marshal escapes, kills a waggoner
    for a coat, and reaches the strand, while Olaf Haraldson prepares to sail away
    after hearing of his father's fall.
  language: English
