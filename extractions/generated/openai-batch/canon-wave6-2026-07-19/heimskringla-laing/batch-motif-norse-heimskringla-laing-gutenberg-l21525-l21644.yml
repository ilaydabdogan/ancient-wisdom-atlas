- id: ev:5
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Empress Zoe becomes angry and accuses Harald of misapplying property
    of the Greek emperor received in campaigns under his command.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Maria is named as a young and beautiful niece of Zoe; Harald had
    paid addresses to her, but Zoe refused him.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Varings in Constantinople report in the North that well-informed
    people said Zoe wanted Harald as husband and mainly blamed him for wanting to
    leave, though another public reason was given.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Constantinus Monomachus rules with Zoe; on this account the Greek
    emperor has Harald made prisoner and carried to prison.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: quote
  locator: lines 21525-21644
  quote_or_summary: "“King Olaf the Saint stood before him and said he would assist
    him.”"
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; short excerpt.
- id: ev:10
  type: summary
  locator: lines 21525-21644
  quote_or_summary: A chapel was later built and consecrated to Saint Olaf at the
    place in the street where Olaf appeared.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 21525-21644
  quote_or_summary: The prison is a high tower open above with a lower street door;
    Harald is thrust into it with Haldor and Ulf.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Next night a lady of distinction with two servants reaches the
    top of the tower by ladders, lets down a rope, and hauls the prisoners up.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Saint Olaf had formerly cured the lady of sickness and appeared
    to her in a vision telling her to deliver his brother.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald goes to the Varings, who rise from their seats, receive
    him with joy, and arm themselves immediately.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald and his men go to where the emperor sleeps, take him prisoner,
    and put out both his eyes.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 21525-21644
  quote_or_summary: The narrator cites skaldic songs and says they, along with many
    others, tell that Harald himself blinded the Greek emperor.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: quote
  locator: lines 21525-21644
  quote_or_summary: "“King Harald and his men went to the house where Maria slept
    and carried her away by force.”"
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; short excerpt.
- id: ev:18
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald and his men go to the galleys of the Varings, take two
    of them, and row into Sjavid sound.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 21525-21644
  quote_or_summary: At the iron chain across the sound, Harald orders the rowers to
    pull while others run to the stern with luggage, making the galleys run up onto
    the chain; he then orders them forward into the bow.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald's galley balances forward and swings down over the chain;
    the other galley remains fast across the chain and splits, with many men lost
    and some rescued from the sound.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald escapes from Constantinople, sails into the Black Sea,
    puts Maria ashore before leaving the land, sends her back with an escort, and
    has her tell Zoe how little power Zoe had over him.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: lines 21525-21644
  quote_or_summary: Harald sails northward in the Ellipalta and around the Eastern
    empire; on the voyage he composes sixteen songs, all ending with the same words.
  source_text_path: texts/public-domain/norse/project-gutenberg/heimskringla-laing.md
