canonical_text:
  quote: ''
  summary: Harald goes to Jerusalem and the Jordan, gives gifts to holy sites, clears
    the road by force, returns to Constantinople, is imprisoned after conflict with
    Empress Zoe and the Greek emperor, receives saintly assistance through Olaf and
    an unnamed lady, escapes with companions, blinds the emperor, abducts and then
    returns Maria, crosses an iron-chain barrier by maneuvering galleys, and sails
    northward.
  language: English
  quote_policy: summarized
