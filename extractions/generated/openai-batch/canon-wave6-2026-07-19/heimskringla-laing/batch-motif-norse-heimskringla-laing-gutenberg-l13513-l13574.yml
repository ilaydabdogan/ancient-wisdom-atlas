canonical_text:
  quote: ''
  summary: Bishop Sigurd mediates a reconciliation in which Erling gives surety for
    Asbjorn. Asbjorn receives life and safety, enters the king's power, and kisses
    the king's hand. The king orders Asbjorn, under the law of the land, to take the
    former office of Thorer Sel as bailiff at Augvaldsnes. Asbjorn asks to go home
    first. At home, his kinsman Thorer argues that entering the king's service would
    be disgraceful to Asbjorn and his family; Asbjorn accepts this advice and remains
    on his farm instead of returning to serve the king.
  language: English
  quote_policy: summarized
