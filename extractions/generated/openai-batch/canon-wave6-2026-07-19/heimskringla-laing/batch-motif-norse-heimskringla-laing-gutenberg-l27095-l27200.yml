canonical_text:
  quote: ''
  summary: 'Two royal brothers, Eystein and Sigurd, debate their relative kingly qualities:
    weapons, appearance, law, speech, foreign warfare, and domestic building. Sigurd
    recalls swimming the Jordan and tying a cursed willow knot for Eystein; Eystein
    replies with a counter-threat about Sigurd''s return. The passage then reports
    Sigurd''s recurring madness after seeing a fish in his bath, a dynastic marriage
    notice, Eystein''s construction of a dragon-headed ship modeled on the Long Serpent,
    and Eystein''s death, burial, mourning, and Sigurd''s sole kingship.'
  language: English
  quote_policy: summarized
