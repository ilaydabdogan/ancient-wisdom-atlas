canonical_text:
  quote: ''
  summary: Thorod Snorrason, unhappy at being kept in Norway, accepts King Olaf's
    commission to collect scat in Jamtaland. Thorar hosts the envoys and calls a Thing,
    where the Jamtalanders refuse payment and secretly decide to detain the messengers
    until the Swedish king's sheriffs arrive; some propose hanging or sacrificing
    them. During Yule drinking, peasants' sons reveal the danger. Thorod and his comrade
    prepare to flee, are tracked with dogs, recaptured, and thrown into a deep cellar.
    While Thorar is away, drunken slave-guards leave the cellar and room unlocked
    after Thorod sings for them and receives a candle. Thorod and his comrade escape
    using torn skin-clothes, ropes, a hatch, a cross-beam, and a counterweight. They
    take clothes, make reindeer-hide sandals with hoofs trailing behind, set fire
    to a corn barn, and flee into the dark woods.
  language: English
  quote_policy: summarized
