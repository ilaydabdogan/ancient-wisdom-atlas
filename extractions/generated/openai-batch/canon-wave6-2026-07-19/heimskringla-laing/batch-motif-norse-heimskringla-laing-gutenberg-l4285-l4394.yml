  summary: Ragnfred returns from the Orkney Islands to Norway with troops and ships,
    plunders, and contests Earl Hakon. Hakon musters men, first meets Ragnfred in
    an inconclusive confrontation, then gathers a larger force, marks out a battlefield
    with hazel branches, defeats Ragnfred at Thinganes, and restores peace. The passage
