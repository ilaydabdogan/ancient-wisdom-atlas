canonical_text:
  quote: ''
  summary: 'A dispute begins when Harald''s footboy, sent to prepare Harald''s berth,
    lies down there and is beaten by Svein Rimhildson. Harald retaliates by wounding
    Svein, after which Svein and his supporters capture Harald and prepare to hang
    him. Sigurd Sigurdson wakes the king, despite a prohibition, and the king rallies
    his men, rescues Harald, and judges Svein and his comrades, later mitigating the
    punishment through intercession. The passage then relates King Olaf''s miracle:
    Kolbein, whose tongue had been cut out by order of Thora over a piece of meat,
    comes speechless to Nidaros and the Christ church; in sleep he sees Saint Olaf
    touch and pull the stump of his tongue, and he wakes with speech restored.'
  language: English
  quote_policy: summarized
