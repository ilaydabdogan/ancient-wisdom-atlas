canonical_text:
  quote: ''
  summary: Earl Ulf, acting as protector in Denmark while King Canute is in England,
    promotes Canute's son Hardaknut as king by presenting a letter and seal. Queen
    Emma has arranged the letter and seal without Canute's knowledge. When Canute
    returns with greater force, Hardaknut submits to his father by laying down the
    seal tied to his kingly title, and Canute restores him to his former high seat.
    Svein offers himself as hostage for Earl Ulf. In the following section, King Olaf
    and King Onund ravage Scania, move to the Helga river, and prepare a military
    artifice by damming and redirecting water before Canute advances against them.
  language: English
  quote_policy: summarized
