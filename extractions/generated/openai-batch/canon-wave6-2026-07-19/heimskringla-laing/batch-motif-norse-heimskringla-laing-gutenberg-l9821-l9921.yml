canonical_text:
  quote: ''
  summary: 'The passage recounts several events early in King Olaf''s reign: royal
    gifts and bonds of loyalty with Eyvind Urarhorn and Brynjolf Ulfalde; the killing
    of Thrand White while collecting scat for Olaf; the proclamation of Christian
    law in Viken; Eyvind''s defeat of Hroe Skialge, who had levied men and goods for
    the Swedish king; Gudleik Gerske''s trading partnership with Olaf; Thorgaut Skarde''s
    attack on Gudleik and seizure of Olaf''s goods; and Eyvind''s recovery and return
    of those goods to Olaf.'
  language: English
  quote_policy: summarized
