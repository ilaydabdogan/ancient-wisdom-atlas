canonical_text:
  quote: ''
  summary: 'The passage recounts origins and political allegiance of Jamtaland and
    Helsingjaland through flight, settlement, colonization, tribute, lawgiving, and
    boundary disputes between Norwegian and Swedish kings. It then begins Stein''s
    story: Stein and Thorod resent their lack of liberty at King Olaf''s court; Stein,
    a poet, reproaches the king, is challenged about his own verse, leaves the city
    at night with a footboy, and is questioned by Thorgeir at a royal farm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ketil Jamte, son of Earl Onund of Sparby, fled over a mountain ridge from
    Eystein Illrade, cleared forest, and settled the country called Jamtaland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many people from Throndhjem joined Ketil because of disturbances; King Eystein
    had taxed the Throndhjem people and set his dog Saur to be king over them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thorer Helsing, Ketil's grandson, colonized Helsingjaland, and the province
    is said to be named after him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Harald Harfager subdued the kingdom by force, people from Throndhjem
    and Naumudal fled; new settlements were added to Jamtaland, some settlers moved
    eastward to Helsingjaland and the Baltic coast, and all became subjects of the
    Swedish king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: During Hakon Athelstan's foster-son's rule over Norway there was peace and
    merchant traffic between Throndhjem and Jamtaland; the Jamtalanders came to him,
    paid scat, received laws and justice, and preferred his rule because they were
    of Norwegian race.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Olaf the Thick and the Swedish king quarrelled about boundaries, the
    Jamtaland and Helsingjaland people returned to the Swedish king; the forest of
    Eid and the mountain ridge are described as boundaries, and the Swedish king took
    scat from both regions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: King Olaf of Norway sent a message declaring that the Jamtaland people should
    be subject to him and threatening violence if they refused; the Jamtaland people
    preferred the Swedish king.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Icelanders Thorod Snorrason and Stein Skaptason were displeased at not
    being allowed to do as they liked.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Stein is described as handsome, dexterous, a great poet, splendidly dressed,
    and ambitious of distinction; his father Skapte had composed and taught him a
    poem about King Olaf.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Stein reproached the king in word and speech, both verse and prose; Stein
    and Thorod spoke imprudently about the king treating them as men without liberty,
    and the king became angry.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Stein asked King Olaf to hear Skapte's poem; the king told Stein first to
    repeat what Stein had composed about him; Stein denied being a skald and then
    went out.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: One night Stein left the city with his footboy, went to Orkadal, came to a
    royal farm managed by Thorgeir, requested a horse and sledge, and was asked by
    Thorgeir whether he was travelling with the king's leave.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
