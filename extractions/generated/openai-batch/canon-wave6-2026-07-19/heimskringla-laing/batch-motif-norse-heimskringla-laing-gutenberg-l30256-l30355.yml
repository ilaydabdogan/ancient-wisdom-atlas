  summary: Erling Skakke advises that King Inge should be kept out of the battle while
    the chiefs agree to fight. The naval battle begins with ship maneuvers in the
    current. Gregorius is grounded, nearly dragged overboard by Ivar, rescued by Aslak
    Unge, and later spares the wounded Ivar. King Inge decides to enter the battle
    with his banner to aid Gregorius. Erling boards the opposing king's ship, Hakon's
    force gives way, and a skaldic stanza describes fallen men, blood in the river,
    ravens, empty ships, and Hakon's men fleeing to shore.
  language: English
