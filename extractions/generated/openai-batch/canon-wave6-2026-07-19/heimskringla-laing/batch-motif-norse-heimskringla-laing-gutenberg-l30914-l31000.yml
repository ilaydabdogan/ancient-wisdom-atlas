canonical_text:
  quote: ''
  summary: Erling Skakke restricts and then releases merchant shipping from Bergen
    in a way that misleads King Hakon about his intentions. Erling then musters his
    forces, launches his ships, sails north with King Magnus and others, and approaches
    Hakon's fleet at Steinavag. Hakon's men receive a hurried warning and rush unevenly
    to their ships, steering north toward Veey.
  language: English
  quote_policy: summarized
