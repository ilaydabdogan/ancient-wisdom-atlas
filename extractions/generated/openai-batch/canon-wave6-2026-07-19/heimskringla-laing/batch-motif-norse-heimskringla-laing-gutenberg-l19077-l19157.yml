canonical_text:
  quote: ''
  summary: 'After unpopular laws and disappointment under King Svein and King Canute,
    public opinion turns in favor of the dead King Olaf. People in Throndhjem begin
    declaring Olaf holy, citing miracles and making prayers and promises to him for
    help. Elite and clerical figures respond: Einar Tambaskelfer recognizes Olaf as
    a saint, Bishop Sigurd is blamed and flees, and Bishop Grimkel is summoned north
    after accepting reports of Olaf''s miracles and sanctity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The promulgated laws immediately raised the minds of the people against them
    and produced murmurs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people accused the interior Throndhjem men who fought against King Olaf
    of receiving oppression and slavery instead of the promised peace and justice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: People did not dare to make an insurrection against King Svein because many
    had given King Canute sons or close relations as hostages and because no leader
    appeared.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: People soon complained of King Svein, and his mother Alfifa received much
    blame for what displeased them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the winter of 1031, many in the Throndhjem land began declaring that
    Olaf was a holy man, and his sanctity was said to be confirmed by many miracles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many people made promises and prayers to King Olaf for help, and many were
    said to benefit in matters of health, journeys, or other needs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Einar Tambaskelfer returned from England with fiefs given by King Canute,
    remembered Canute's unkept promise of the earldom over Norway, and was the first
    great person to look on King Olaf as a saint.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fin Arnason reproached Kalf for having been in the battle against King Olaf;
    Thorberg left more temperately; Kalf provided the brothers with a long-ship and
    retinue.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arne Arnason recovered from his wounds without loss of limb, and the brothers
    made peace with King Svein and remained quietly at their homes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The following summer, talk of King Olaf's sanctity increased and public expressions
    about him changed greatly, including among former persecutors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: People turned reproaches against those who had chiefly excited opposition
    to King Olaf; Bishop Sigurd was especially accused and went to England to King
    Canute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Throndhjem people sent a message to Bishop Grimkel in the Uplands asking
    him to come north, and he prepared to go because he considered the reports of
    Olaf's miracles and sanctity true.
  category: action
  evidence_refs:
  - ev:7
