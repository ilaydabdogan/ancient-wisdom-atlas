canonical_text:
  quote: ''
  summary: After King Magnus's death, Harald seeks proclamation over Denmark but is
    diverted when Einar insists on returning Magnus's body for burial in Nidaros beside
    Olaf's shrine. Harald secures royal proclamation in Norway, Svein Ulfson regains
    Denmark, and Harald later raids Denmark by sea, including an episode in which
    Thorkel Geysa's daughters are seized and ransomed after having mocked Harald's
    fleet with cheese anchors.
  language: English
  quote_policy: summarized
