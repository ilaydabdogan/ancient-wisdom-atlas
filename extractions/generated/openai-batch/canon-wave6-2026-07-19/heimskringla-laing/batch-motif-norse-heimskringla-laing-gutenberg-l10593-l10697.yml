  quote: '"Here, mother, thou art bringing up a king."'
  summary: The passage first recounts King Olaf visiting his mother Asta and observing
    her sons, especially the young Harald, whose boldness, warship play, and answer
    about servants lead Olaf to predict royal qualities. It then describes Upsala
    as a pre-Christian sacrificial and assembly center whose Thing and fair functions
    continued after Christianization, outlines divisions and legal institutions of
    Svithjod, and introduces the wise hereditary lagman Thorgny.
  language: English
