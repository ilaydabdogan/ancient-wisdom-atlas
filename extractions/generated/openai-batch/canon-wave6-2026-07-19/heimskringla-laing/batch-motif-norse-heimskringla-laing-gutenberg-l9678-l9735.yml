canonical_text:
  quote: ''
  summary: King Olaf Haraldson prepares an eastward expedition, sends messages concerning
    Christian law to Icelandic figures, travels along the Norwegian coast holding
    Things and having Christian law read, threatens those who refuse Christianity,
    is proclaimed king at Law Things, and negotiates a tense reconciliation with Erling
    Skjalgson over fiefs and royal authority.
  language: English
  quote_policy: summarized
