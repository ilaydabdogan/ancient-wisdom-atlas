canonical_text:
  quote: ''
  summary: The passage narrates the collapse of an agreement between the Norwegian
    and Swedish kings, warnings sent by Ingegerd and Earl Ragnvald, King Olaf the
    Thick's council about whether to attack Gautland, and the decision to postpone
    hostilities. It then introduces Sigvat the skald's winter journey eastward as
    an envoy-spy seeking settlement, including farewell verses, a dangerous river
    crossing, a difficult forest march, and arrival at Hof where entry is refused
    because of a fast-day.
  language: English
  quote_policy: summarized
