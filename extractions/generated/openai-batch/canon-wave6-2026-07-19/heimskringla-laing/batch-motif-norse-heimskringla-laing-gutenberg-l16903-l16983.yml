canonical_text:
  quote: ''
  summary: King Olaf leads an inland expedition through difficult terrain. After followers
    fail to make a road through an urd, the king spends the night in prayer, signs
    kettles containing scant provisions, and later the road is cleared with unusual
    ease. A spring at Olaf's Rock is said to heal sick cattle. At a sheeling feared
    for witchcraft and evil beings, unexpected provisions appear, and a spirit cries
    that Olaf's prayers burn it and force it to flee. Olaf then declares that a farm
    will be settled there and protected from want and frost damage. The passage ends
    with a note on Olaf's reign and Are Thorgilson's source authority.
  language: English
  quote_policy: summarized
