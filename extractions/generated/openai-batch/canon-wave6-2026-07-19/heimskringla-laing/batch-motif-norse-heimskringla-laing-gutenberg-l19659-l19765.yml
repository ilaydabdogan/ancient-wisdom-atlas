  summary: The passage narrates Magnus Olafson's reception at Nidaros and election
    at the Eyra-thing, his establishment of royal officers, King Svein Alfifason's
    failed attempt to summon support and subsequent flight to Denmark, Magnus's acceptance
    throughout Norway, the deaths of Canute the Great and Svein, and skaldic verses
