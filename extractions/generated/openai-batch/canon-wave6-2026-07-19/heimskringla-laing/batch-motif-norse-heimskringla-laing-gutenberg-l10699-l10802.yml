canonical_text:
  quote: ''
  summary: Messengers report failed attempts by Ingegerd to secure peace between the
    Swedish king and Olaf of Norway. Earl Ragnvald travels east, meets Ingegerd at
    Ullaraker, and proposes a marriage alliance as a route to peace. Ragnvald then
    seeks counsel from Lagman Thorgny, who promises support at the Upsala Thing so
    Ragnvald may speak before the king without fear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men sent by Ingegerd and Hjalte come to Earl Ragnvald and report their errand
    to him and to Ingebjorg.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The messengers report that Ingegerd has often spoken to the Swedish king about
    peace with King Olaf the Thick, and that the Swedish king becomes angry whenever
    Olaf is named.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bjorn says he will not turn back until he has met the Swedish king, and Earl
    Ragnvald prepares to travel east with sixty men after Yule.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ragnvald sends men ahead to Upsala asking Ingegerd to meet him at Ullaraker,
    where she has a large farm; Ingegerd travels there with a large attendance and
    Hjalte accompanies her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before leaving, Hjalte praises King Olaf's splendour and asks for future favor
    and friendship; the king calls Hjalte understanding, polite, and suited to live
    with people of rank.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ingegerd orders a great feast to be prepared for the earl at her farm in Ullaraker
    and receives him gladly for several days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ragnvald and Ingegerd speak chiefly about the Swedish and Norwegian kings,
    and Ingegerd says she sees no hope of peace between them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ragnvald asks how Ingegerd would like Olaf king of Norway to pay addresses
    to her, saying that relationship between the kings would contribute most toward
    settled peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ingegerd says her father disposes of her hand, but she values Ragnvald's advice
    in weighty affairs; Ragnvald strongly recommends the match and recounts Olaf of
    Norway's achievements.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ragnvald comes to Lagman Thorgny's stately mansion, where Thorgny sits in
    the high-seat as an old, very stout, handsome, stately man with a beard lying
    on his knee and breast.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ragnvald explains to Thorgny that Olaf of Norway has sent ambassadors for
