canonical_text:
  quote: '"Go back rather to that kingdom which thou hast received in heritage"'
  summary: Bjorn hears Earl Hakon is missing, travels to King Olaf in Russia, confesses
    his broken fealty, and is reconciled. Olaf weighs whether to remain in Russia,
    accept a foreign kingdom, enter religious life, or return to Norway. In a light
    sleep he sees a splendid man he takes to be Olaf Trygvason, who urges him to reclaim
    his hereditary kingdom with God's support. Olaf wakes strengthened and decides
    to return.
  language: English
  quote_policy: quoted
