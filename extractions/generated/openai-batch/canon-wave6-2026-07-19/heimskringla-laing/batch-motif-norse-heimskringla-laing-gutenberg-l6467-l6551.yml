canonical_text:
  quote: ''
  summary: The passage describes Bishop Sigurd ritually preparing King Olaf's ship
    with Christian rites before the fleet passes through a calm track amid high waves
    to Godey. Olaf attacks Raud's dwelling, captures Raud, offers him baptism, and
    has him killed with a serpent after his refusal. Olaf seizes property and a dragonship,
    renames the vessel the Serpent, baptizes the fjord people, and returns to Nidaros.
    The passage then lists Icelanders at Nidaros, distinguishes heathen and Christian
    men, and recounts heathen ship-directors being driven back by wind and ordered
    not to depart.
  language: English
  quote_policy: summarized
