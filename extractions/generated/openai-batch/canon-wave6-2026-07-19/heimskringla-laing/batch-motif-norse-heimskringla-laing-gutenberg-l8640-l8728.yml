canonical_text:
  quote: ''
  summary: King Olaf spares Earl Hakon after requiring him to leave Norway, give up
    his kingdom, and swear not to fight Olaf. Hakon departs for England and is received
    by King Canute. A reconciliation involving Erling Skialgson is secured by marriage
    and oath. Olaf travels east, holds Things, gains some support and opposition,
    and comes to the house of his stepfather Sigurd Syr. Olaf’s mother Asta orders
    the household to prepare the room, food, ale, clothing, messengers, and a feast
    for her son’s return.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earl Hakon says that success is changeable, that his and Olaf's families have
    had the better lot by turns, and that he had not expected an attack on the way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Olaf says Hakon may be in a condition where there can be neither victory
    nor defeat for him, and Hakon answers that the king alone can determine that.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Olaf asks what Hakon will give if he is let go whole and unhurt; Olaf then
    demands that Hakon leave the country, give up his kingdom, and take an oath never
    to go into battle against him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hakon accepts the terms and takes an oath not to fight Olaf, defend Norway
    against him, or attack him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
