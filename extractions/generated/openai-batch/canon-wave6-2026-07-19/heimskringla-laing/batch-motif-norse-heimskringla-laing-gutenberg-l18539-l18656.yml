canonical_text:
  quote: ''
  summary: 'The passage narrates King Olaf''s final battle: several named fighters
    fall near the banner, the clear sky darkens and is interpreted as portending the
    king''s end, Dag Hringson advances in the darkness, King Olaf''s sword fails against
    Thorer Hund''s reindeer-skin coat attributed to magic, and Olaf receives fatal
    wounds after praying by a stone.'
  language: English
