canonical_text:
  quote: ''
  summary: Thorer Hund explains a Bjarmaland funerary custom in which a dead rich
    man's share of movable goods is buried. He leads Karle, Gunstein, and their men
    silently through forest to a fenced place containing a treasure mound and the
    god Jomala. Although Thorer warns against robbing Jomala, he takes a silver bowl
    from the god, and Karle takes a gold neck ornament, causing a loud sound and alarm.
    During pursuit Thorer scatters an ash-like substance, after which the pursuers
    do not see or harm them. The men escape by ship, and Thorer and Karle dispute
    the stolen ornament, which Karle says is intended for King Olaf.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thorer states that in the land described, a rich dead man's movable goods
    are divided between the dead man and his heirs, and the dead man's portion is
    buried in the forest, in a mound, in the earth, or in a house built over it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expedition leaves people to guard the ships, goes inland through fields
    and then forests, and Thorer commands silence and tree-marking by peeling bark.
  category: action
  evidence_refs:
