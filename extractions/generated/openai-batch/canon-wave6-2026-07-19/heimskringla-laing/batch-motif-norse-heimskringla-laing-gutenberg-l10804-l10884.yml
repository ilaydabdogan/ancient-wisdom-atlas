- id: obs:4
  text: Earl Ragnvald speaks of Olaf the Thick's peace proposal, the West Gautlanders'
    request for peace, their hardships, and the Norwegian king's intent to obtain
    Ingegerd in marriage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Olaf the Swedish king replies against peace proposals, reproaches Earl Ragnvald,
