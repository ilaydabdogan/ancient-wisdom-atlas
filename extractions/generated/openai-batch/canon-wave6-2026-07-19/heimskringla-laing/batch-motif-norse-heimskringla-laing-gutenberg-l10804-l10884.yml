canonical_text:
  quote: ''
  summary: At a Thing assembly, Bjorn delivers the Norwegian king Olaf's peace proposal
    to the Swedish king Olaf. Earl Ragnvald supports peace and reports hardship among
    the West Gautlanders and a marriage proposal for Ingegerd. The Swedish king rejects
    the proposal and reproaches Ragnvald. Lagman Thorgny then addresses the assembly,
    contrasts the current king with earlier Swedish rulers, demands peace and the
    marriage alliance on behalf of the bondes, and threatens violent action if the
    king refuses, citing an ancestral precedent at the Mula-thing. The public approves
    Thorgny's speech with arms and shouts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thing is arranged with King Olaf on a stool, Earl Ragnvald and Thorgny
    on another stool opposite him, and courts, house-people, and the bonde community
    standing or sitting in circles; some listeners stand on hillocks and heights.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marshal Bjorn rises beside the earl's stool and loudly announces that King
    Olaf offers the Swedish king peace and the old frontiers between Norway and Svithjod.
  category: speech
  evidence_refs:
