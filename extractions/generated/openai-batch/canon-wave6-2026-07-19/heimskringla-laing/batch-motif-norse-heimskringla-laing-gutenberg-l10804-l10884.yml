  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Thorgny stands, the bondes also stand and rush together to listen; the
    initial din of people and weapons settles into silence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorgny recounts earlier Swedish kings as rulers who conquered or defended
