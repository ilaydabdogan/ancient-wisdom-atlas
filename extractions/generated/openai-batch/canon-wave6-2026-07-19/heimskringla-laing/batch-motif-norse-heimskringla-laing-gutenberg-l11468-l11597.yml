    told by the house-folk that it is holy time; he is not admitted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At another farm, a good-wife stands at the door and tells the travelers not
    to enter because the household is busy with a sacrifice to the elves; Sigvat's
    verse also refers to Odin's wrath and sacrifice to Odin.
  category: speech
  evidence_refs:
