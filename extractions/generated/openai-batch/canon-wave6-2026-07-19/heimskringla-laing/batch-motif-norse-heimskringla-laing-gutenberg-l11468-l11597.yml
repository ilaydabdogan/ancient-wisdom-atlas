- id: obs:3
  text: Three bondes all named Olver drive the travelers away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fourth bonde, reputed to be very hospitable, also drives the travelers away,
    and Sigvat says he wandered through the night from door to door.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the travelers reach Earl Ragnvald, Sigvat identifies them as the king's
    message-bearers from Norway and praises the earl's territory as safe from robbers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
