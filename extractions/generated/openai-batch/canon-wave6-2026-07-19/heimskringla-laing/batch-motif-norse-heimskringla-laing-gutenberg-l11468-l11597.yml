canonical_text:
  quote: ''
  summary: Sigvat and his companions are repeatedly refused lodging at farms, including
    during a stated holy time and during a sacrifice to elves/Odin. They reach Earl
    Ragnvald, who hosts and rewards Sigvat. News follows about royal marriage negotiations
    involving Ingegerd and Astrid. Sigvat then returns to King Olaf at Sarpsborg,
    praises the decorated royal hall, and recounts the hardships of the journey.
  language: English
  quote_policy: summarized
