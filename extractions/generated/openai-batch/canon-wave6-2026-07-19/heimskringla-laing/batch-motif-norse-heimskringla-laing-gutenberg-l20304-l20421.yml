  summary: The passage describes King Magnus using the ornate ship Bison to sail to
    Denmark, where he is accepted and elected king through Danish assemblies and support
    from oath-bound chiefs. It then introduces Svein Ulfson, recounts his lineage
    and qualities, and narrates Magnus appointing him earl over Denmark. The appointment
    includes public speech, objection by Einar Tambaskelfer, formal investiture with
    weapons and title, and Svein’s oath of fidelity on holy relics.
