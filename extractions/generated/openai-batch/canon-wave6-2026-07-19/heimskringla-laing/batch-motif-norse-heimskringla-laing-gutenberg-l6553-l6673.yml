canonical_text:
  quote: ''
  summary: The passage recounts a supplementary swimming episode in which Kjartan
    competes with an initially unnamed Northman who reveals himself as King Olaf Trygvason
    and gives Kjartan a cloak. It then describes Icelanders attending Michaelmas high
    mass, Kjartan and his companions accepting baptism after Olaf promises friendship,
    and Halfred Vandredaskald accepting baptism on condition that Olaf serve as godfather.
    Halfred later enters Olaf's service and receives a sword and scabbard after composing
    a stanza on the sword.
