canonical_text:
  quote: ''
  summary: The passage recounts Harald's coastal campaign, his appointment of Earl
    Hakon over the Fjord district, a dispute between Hakon and Earl Atle over Sogn
    and Gaular that ends in battle and both earls' deaths, and then Harald's response
    to reports that the Swedish king Eirik has expanded his authority, levied taxes,
    installed an earl, and sought a Viken kingdom comparable to that of Sigurd Hring
    or Ragnar Lodbrok.
