canonical_text:
  quote: ''
  summary: Swedish chiefs and bondes oppose King Olaf Eirikson's conduct and assemble
    a Retribution-thing. Counselors advise Olaf to appease the unrest by promising
    the ancient laws and rights. Freyvid and Arnvid, with the king's son Jacob concealed,
    go to the assembly, redirect the movement toward preserving kingship within the
    old royal race, and present Jacob as king. Jacob is given the name Onund. A settlement
    follows in which Olaf remains king for life, Onund also becomes king with a share
    of land, and Onund is bound to support the bondes if Olaf again acts intolerably.
  language: English
  quote_policy: summarized
