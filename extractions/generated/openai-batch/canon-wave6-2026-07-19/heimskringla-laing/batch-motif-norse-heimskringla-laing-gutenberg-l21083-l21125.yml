  quote: ''
  summary: King Magnus, ruling Denmark and Norway, sends ambassadors to King Edward
    of England with a sealed letter claiming England by a survivor agreement with
    Hardaknut and threatening force if Edward does not yield. Edward replies with
    an inheritance argument, popular acceptance, consecration, and a vow not to surrender
    except by death. Magnus decides to let Edward keep England in peace and to keep
    the kingdoms God has placed in his hands.
