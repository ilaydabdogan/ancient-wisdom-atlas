canonical_text:
  quote: ''
  summary: The passage recounts Erling's attack on Alf Rode in town during church
    observance, his accusation and fining of Throndhjem leaders at a Thing using sealed
    letters and witness testimony, King Valdemar's failed Danish expedition into Norway,
    Erling's retaliatory expedition to Jutland, and a later diplomatic visit in which
    Erling asks Valdemar for peace and safe conduct.
  language: English
  quote_policy: summarized
