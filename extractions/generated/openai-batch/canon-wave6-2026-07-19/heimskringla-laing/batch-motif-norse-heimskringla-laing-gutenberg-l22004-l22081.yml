canonical_text:
  quote: ''
  summary: King Magnus and King Harald dispute precedence over royal harbour-ground
    after Harald arrives first and pitches tents there. Magnus prepares for armed
    conflict, Harald withdraws, and the disagreement continues among their followers.
    The kings then campaign in Denmark. Magnus dreams of his father, Saint Olaf, who
    gives him a choice between following him or living long while committing an unexpiated
    crime; Magnus lets his father choose and is told to follow him. Magnus soon falls
    sick, arranges succession by assigning Denmark to Svein and Norway to Harald,
    dies, and is mourned by the people.
  language: English
  quote_policy: summarized
