  summary: A dispute over night quarters between Gyrger and the Varings is settled
    by arbitration with marked lots, after Harald manipulates the drawing so that
    the Varings gain first choice. The passage then describes Harald’s campaigns apart
    from Gyrger, his victories, followers, expedition to Serkland and Sicily, capture
    of many castles, and accumulation and transfer of treasure to Novgorod.
  language: English
  quote_policy: summarized
