canonical_text:
  quote: '"God will repair thy loss"'
  summary: The king arrives at Sula, where his followers trample Thorgeir Flek's corn.
    The king says God will repair the damage, and the field later becomes the best
    corn. Thorgeir and his sons accompany the king, and the king foretells the sons'
    safe return. At Staf's moor the king learns that bondes are advancing against
    him, orders heathen men in his army to accept baptism or depart, and receives
    baptized followers into his court-troop under his banner.
  language: English
  quote_policy: quoted
