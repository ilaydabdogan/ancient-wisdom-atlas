canonical_text:
  quote: ''
  summary: After Earl Hakon's death, Einar Tambaskelfer travels by ship to England
    to seek fulfillment of King Canute's promises, but Canute says Norway has been
    promised to his son Svein and offers Einar lesser honors. In Norway, chiefs send
    spies to learn whether King Olaf has returned from Russia; when Olaf's arrival
    in Svithjod is confirmed, a war token summons a levy. Olaf's friends gather, including
    his young brother Harald Sigurdson. Olaf, in Svithjod, receives aid from King
    Onund and begins a march through Swedish territory, leaving Queen Astrid and Ulfhild
    behind. At Jarnberaland, Norwegian supporters meet Olaf, and the combined force
    numbers 1200 men.
  language: English
  quote_policy: summarized
