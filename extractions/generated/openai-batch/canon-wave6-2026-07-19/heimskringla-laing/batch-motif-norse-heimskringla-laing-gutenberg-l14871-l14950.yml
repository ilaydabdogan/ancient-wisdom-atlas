canonical_text:
  quote: ''
  summary: King Olaf sends Fin Arnason to Halogaland to raise men and ships against
    King Canute. Fin gathers the levy and confronts Thorer Hund at a House-Thing over
    Karle's killing and the taking of the king's goods. Thorer submits to Fin's decision,
    is assessed payments, and is forced to hand over an ornament taken from Karle.
    Fin then searches Thorer's ship and finds two large casks that Thorer says contain
    liquor.
  language: English
  quote_policy: summarized
