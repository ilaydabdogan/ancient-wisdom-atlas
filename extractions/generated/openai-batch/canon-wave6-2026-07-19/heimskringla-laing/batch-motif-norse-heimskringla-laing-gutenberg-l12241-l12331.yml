  summary: A saga passage recounts factional violence among Earl Einar, Thorkel Fosterer,
    Earl Thorfin, Earl Bruse, and King Olaf. Einar kills Eyvind, Thorkel seeks Olaf's
    favor after fearing Einar, Olaf befriends Thorfin, Bruse mediates a sworn peace,
    and Thorkel kills Einar during a feast after scouts report ambushes. Thorkel then
    sails to Norway and is well received by Olaf.
