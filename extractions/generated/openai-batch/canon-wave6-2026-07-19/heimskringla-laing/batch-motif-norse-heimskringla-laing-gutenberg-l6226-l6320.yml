candidate_motifs:
- id: motif:1
  label: Overthrow of local gods during royal Christianization
  taxonomy_refs: []
  basis: The king strikes Thor's image with an axe, his men throw down the other gods,
    and he immediately imposes the choice of Christianity or battle.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents royal and military action; it does not frame the
    event as a supernatural contest.
- id: motif:2
  label: Compulsory baptism under threat
  taxonomy_refs:
  - initiation
  basis: The people are baptized after being offered Christianity or battle, hostages
    are taken for continued adherence, and Sigurd and Hauk are later threatened with
    death and torture for refusing baptism.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The taxonomy link to initiation is limited to baptism as a rite of religious
    entry; the passage emphasizes coercion rather than voluntary initiation.
- id: motif:3
  label: Hostages as guarantee of religious submission
  taxonomy_refs: []
  basis: After baptism, Olaf takes hostages from the people to ensure they remain
    true to Christianity.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a political-control motif in the passage, not explicitly a mythic
    or ritual hostage pattern.
- id: motif:4
  label: Royal foundation of a river-side town
  taxonomy_refs:
  - royal_legitimacy
  basis: Olaf builds houses on the river Nid, raises the place to a merchant town,
    grants building ground, and establishes his own residence there.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Royal legitimacy is inferred from the king's settlement-founding activity;
    the passage does not explicitly say the foundation legitimates his rule.
- id: motif:5
  label: Bloodshed settlement through marriage alliance
  taxonomy_refs: []
  basis: Olaf negotiates compensation with Jarnskegge's relations, and the agreement
    is that he will marry Jarnskegge's daughter Gudrun.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents this as legal or kin compensation, without explicit
    sacred-marriage language.
- id: motif:6
  label: Bride's attempted revenge in the marriage bed
  taxonomy_refs: []
  basis: On the first night with Olaf, Gudrun draws a knife intending to kill him;
    he disarms her, and she leaves permanently.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not state Gudrun's motive, though the sequence follows
    her father's killing and compensation marriage.
- id: motif:7
  label: Named royal ship construction
  taxonomy_refs: []
  basis: Olaf lays the keel of a long-ship, employs carpenters, and names the completed
    vessel Tranen, the Crane.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No voyage or supernatural function is attached to this ship in the passage.
- id: motif:8
  label: Missionary journey to an island land by a violent priest
  taxonomy_refs:
  - departure
  basis: Olaf sends Thangbrand from his house to Iceland with a merchant vessel to
    bring the land to Christianity, and Thangbrand proclaims Christianity there while
    also killing opponents.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The departure reference is limited to the sending out and voyage; the
    passage is historical-saga narrative rather than a formal quest myth.
- id: motif:9
  label: Refusal of conversion, imprisonment, and unexplained escape
  taxonomy_refs: []
  basis: Sigurd and Hauk refuse baptism despite speech, threats, and chains, then
    disappear one night without anyone knowing how they escaped.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The escape is unexplained, but the passage does not attribute it to magic
    or divine aid.
