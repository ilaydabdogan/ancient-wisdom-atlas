canonical_text:
  quote: ''
  summary: King Olaf enters a temple, strikes down the image of Thor, and has the
    other gods thrown down while Jarnskegge is killed outside. Olaf gives the bondes
    the choice of accepting Christianity or fighting; they submit, are baptized, and
    hostages are taken. Olaf founds a merchant town at Nidaros. He settles Jarnskegge's
    bloodshed by agreeing to marry Jarnskegge's daughter Gudrun, who attempts to kill
    him in bed and then leaves. Olaf builds and names the ship Crane. The Saxon priest
    Thangbrand is sent to Iceland to promote Christianity, gains some converts, faces
    opposition, and kills satirists. Sigurd and Hauk refuse baptism, are threatened
    and chained, escape unexplained, and are hosted by Harek of Thjotta.
  language: English
  quote_policy: summarized
