canonical_text:
  quote: ''
  summary: The passage recounts royal marriage arrangements involving Earl Eirik,
    King Svein, Burizleif, Thyre, and King Olaf. Thyre is unwillingly given to Burizleif,
    refuses to eat or drink among heathens for seven days, flees by night with Ozur,
    seeks protection from King Olaf, and marries him. Later she laments lost property
    in Vindland, rejects Olaf's angelica stalk, taunts him with Harald Gormson's example,
    and Olaf responds by levying ships and men, including the Long Serpent with a
    selected crew.
  language: English
