canonical_text:
  quote: ''
  summary: King Harald is feasted in Vermaland by the aged bonde Ake, who favors Harald
    with a new hall and new vessels, gives him his son Ubbe for service, and is later
    killed by King Eirik after explaining the difference as a matter of old and young.
    Harald seeks vengeance, subdues Vermaland, then conducts winter sea campaigns
    and fights Gautlanders who try to block the Gaut river with stakes.
  language: English
  quote_policy: summarized
