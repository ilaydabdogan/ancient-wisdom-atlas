canonical_text:
  quote: ''
  summary: Hjalte gains favor with the Swedish king, uses tokens from Ingebjorg to
    approach the king's daughter Ingegerd, and gradually raises the possibility of
    reconciliation between the Swedish king and Olaf the Thick. Ingegerd warns that
    the king is too angry to hear Olaf's name. Hjalte nevertheless proposes peace
    and a possible courtship of Ingegerd while the king is merry and drunk. The king
    rejects the proposal, denies Olaf's royal standing, asserts the superior lineage
    and conquest-rights of the Upsala kings, recalls Olaf's escape from the Malar
    lake, and forbids Hjalte to raise the matter again.
  language: English
  quote_policy: summarized
