canonical_text:
  quote: ''
  summary: Endnotes explain Odin's mead, called Bodn, and the idiom of dwelling with
    Odin. The narrative then describes Harald Grafeld and his brothers levying revenues
    and penalties in Throndhjem; Erling remains, presses the bondes, and is killed
    when they attack him at a feast. During the reign of Gunhild's sons the seasons
    and crops are bad, and the bondes blame the rulers; famine, midsummer snow, and
    stalled cattle are described. Eyvind the skald receives silver from Icelanders
    for a poem, but sells the silver clasps and later arrows and ornaments to buy
    food. A shoal of herrings arrives, and Eyvind rows out with household dependents
    and sings of provision from the sea.
  language: English
  quote_policy: summarized
