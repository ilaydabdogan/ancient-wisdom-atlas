canonical_text:
  quote: ''
  summary: The passage first recounts King Olaf requiring Sigurd to undergo an iron
    ordeal at Lygra, Sigurd's nighttime decision to flee by ship with his companions,
    and the aftermath of suspicion against him. It then recounts King Olaf summoning
    Icelanders in Norway, allowing Geller Thorkelson to carry a message to Iceland
    while preventing the others from returning, and demanding that Iceland adopt Norwegian
    laws and taxes; the Icelanders deliberate at the Thing and unanimously refuse
    the burdens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the people's request, King Olaf took Sigurd's obligation to undergo an
    iron ordeal the next day at Lygra, where a bishop was to preside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: At night Sigurd told his ship's people that a lie had been raised against
    them, called the king deceitful and crafty, and said he feared the king could
    manage the iron ordeal against him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: Sigurd advised hoisting sail and going out to sea because a brisk mountain
    breeze was blowing from land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sigurd's comrades accepted the advice, hoisted sail, and left by night for
    the open sea, stopping only when they reached Farey and Gata.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Sigurd's departure, reports spread and many people came to believe the
    accusation against him was true; King Olaf said little but appeared certain of
    his suspicion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: King Olaf summoned Icelandic men in Norway and said that Geller Thorkelson
    alone might return to Iceland if he carried the king's message; the other Icelanders
    were not allowed to return until the king heard how the message was received.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Those Icelanders who wished to return but were forbidden considered themselves
    harshly dealt with and placed in the condition of unfree men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king's message required the Icelanders to adopt the laws he had set in
    Norway and to pay thane-tax and nose-tax, while promising friendship if they accepted
    and threatening vengeance if they refused.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Icelanders deliberated for a long time and unanimously refused all the
