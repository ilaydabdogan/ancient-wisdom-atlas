canonical_text:
  quote: ''
  summary: Thormod Kolbrunarskald, wounded after King Olaf's fall at Stiklestad, withdraws
    from the fighting, confronts Kimbe over a gold ring, praises Olaf in verse, then
    enters a chamber of wounded men. A nurse-woman examines his arrow wound, uses
    leek broth as a diagnostic, and helps expose the iron. Thormod gives her King
    Olaf's ring, pulls out the hooked iron with heart-flesh attached, makes a final
    remark, and dies.
  language: English
  quote_policy: summarized
