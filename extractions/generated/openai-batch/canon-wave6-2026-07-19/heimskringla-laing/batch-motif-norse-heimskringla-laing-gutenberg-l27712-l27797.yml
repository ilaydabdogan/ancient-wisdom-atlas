canonical_text:
  quote: ''
  summary: A young Danish captive in Vindland suffers imprisonment, attempts escape,
    is recaptured and tortured, then vows service to holy King Olaf if freed. In a
    dream Olaf tells him to rise because he is loose; the prisoner wakes unbound,
    finds the prison door open, escapes through the forest, and is hidden from pursuers
    whose dogs lose the trace and whose eyes are struck blind. Olaf is also credited
    with restoring his health and hearing. After reaching the holy man's house, the
    man breaks his vow and flees, but three girls appear in a dream and reprimand
    him for deserting the king who freed him; he is then sent back. The miracle is
    said to have been recorded by a man who saw the prisoner and his chain marks.
  language: English
  quote_policy: summarized
