canonical_text:
  quote: ''
  summary: Magnus publicly acknowledges giving Harald a share in kingship; Harald
    reciprocates at a feast by distributing valuables and dividing gold equally. The
    kings exchange words over a ring linked to Olaf the Saint and Harald's father.
    Harald gives Thorer named gifts later remembered by witnesses. A verse links gold,
    land, co-rule, and peace. The narrative then notes the kings' co-rule in Norway,
    Magnus's care for Olaf's relics and reported miracles, the emergence of discord,
    and Svein Ulfson's response to the alliance.
  language: English
  quote_policy: summarized
