  quote: King Eystein thus conquered Jamtaland by his wisdom, and not by hostile inroads
  summary: The passage describes King Eystein winning Jamtaland’s allegiance through
    gifts, persuasion, and oaths rather than raids; praises his appearance, wisdom,
    legal knowledge, generosity, and family ties; and narrates his patient counsel
