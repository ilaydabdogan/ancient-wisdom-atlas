canonical_text:
  quote: ''
  summary: Harald Gille, marked by Irish dress and imperfect Norse, claims that some
    men in Ireland can outrun horses. Magnus challenges him to a wager and then races
    him at Oslo; after repeated trials Harald outruns Magnus's horse. King Sigurd
    rebukes Magnus for mocking foreign customs and orders him to give Harald the ring.
    In a separate episode, King Sigurd sees an Icelandic swimmer pulling weaker swimmers
    underwater, repeatedly submerges the Icelander, and is restrained by Sigurd Sigurdson;
    the Icelander is sent to land and Sigurd Sigurdson is afterwards forbidden from
    the king's presence.
  language: English
  quote_policy: summarized
