canonical_text:
  quote: ''
  summary: King Olaf orders a search for Hrorek, who is recovered after a boat pursuit
    in which Thorer is killed by an arrow. Olaf keeps Hrorek closely guarded. On Ascension-day,
    during mass, Hrorek tests whether Olaf is armored and then attacks him with a
    knife in the church, but Olaf is not wounded. Advisers urge Hrorek's death; Olaf
    refuses for now, citing kinship and reluctance to darken his victory over the
    Upland kings. The next section introduces Thorarin Nefiulfson, an Icelandic merchant
    of ugly appearance, whose exposed foot becomes the subject of a wager with Olaf.
  language: English
  quote_policy: summarized
