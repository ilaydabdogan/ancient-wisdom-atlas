canonical_text:
  quote: ''
  summary: Messengers find King Sigurd Syr overseeing harvest work and report Asta's
    wish that he receive Olaf in a manner befitting great royal lineage. Sigurd remarks
    on the danger of Olaf's undertaking, then changes from field clothing into splendid
    armed attire, gathers a retinue, and rides home. Olaf arrives with banners and
    equipped men. Sigurd greets his stepson and offers hospitality; Asta kisses her
    son, offers him support, leads him to the high-seat, and a splendid feast is held.
  language: English
