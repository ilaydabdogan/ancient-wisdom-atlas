canonical_text:
  quote: ''
  summary: The passage recounts King Magnus pursuing Svein to Fyen, ravaging and burning
    Fyen, receiving Danish submission, and returning to Norway. Svein later returns
    with support, seizes Danish islands, and meets Magnus in a night battle at Helganes.
    Magnus wins, Svein flees, ships and booty are taken, and Magnus drives fugitives
    through Scania while burning habitations. Embedded skaldic verses by Thiodolf
    and Arnor describe the destruction, battle, weapons, ships, booty, and royal banner.
  language: English
  quote_policy: summarized
