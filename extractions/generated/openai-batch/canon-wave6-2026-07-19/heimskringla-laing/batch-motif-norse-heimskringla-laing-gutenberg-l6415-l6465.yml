canonical_text:
  quote: ''
  summary: Raud the Strong and Thorer Hjort oppose King Olaf with ships and men. After
    a battle, Raud escapes in a dragon-headed ship with wind attributed to witchcraft,
    while Thorer is pursued by Olaf and the dog Vige and killed by Olaf's spear. Olaf
    then grants life and freedom to those who agree to become Christian, baptizes
    people along the coast, and is prevented from entering Salten fjord by repeated
    storms. Bishop Sigurd says he will try whether God gives him power to conquer
    the Devil's arts.
  language: English
