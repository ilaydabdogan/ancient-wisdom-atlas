canonical_text:
  quote: '"they would never give obedience or service to a man who had murdered his
    own brother."'
  summary: Sigurd Slembe and accomplices enter King Harald's lodging at night, kill
    the watchman, break in with swords, and kill Harald while he is waking from drunken
    sleep. Sigurd then announces the killing and asks to be accepted as chief by birth,
    but the people at the pier reject service to a brother-murderer or to anyone without
    descent-claim, outlaw the murderers, and call the king's men. Sigurd departs northward,
    where Things in North Hordaland and Sogn proclaim him king. King Harald is buried
    in the old Christ church.
  language: English
  quote_policy: quoted
