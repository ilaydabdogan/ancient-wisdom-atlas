canonical_text:
  quote: ''
  summary: The passage begins with a praise-stanza for a warrior-king whose conquests
    and rule bring peace. King Olaf sails after King Canute has gone south, but Olaf
    receives few men and little money and realizes the country has abandoned him.
    Merchants report that Erling Skjalgson has gathered a force in Jadar. Erling pursues
    Olaf by sea. Olaf uses the fjord and a narrow sound to hide his fleet behind a
    rocky point, then surrounds Erling's ship. Erling's crew is killed in the ensuing
    fight, and Erling is left standing alone. Sigvat the skald, a friend of Erling,
    composes verses on the fall.
