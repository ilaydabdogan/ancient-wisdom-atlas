canonical_text:
  quote: ''
  summary: Thorer delays payment of a mulct to Fin, then sails away to England and
    King Canute with concealed wealth from Bjarmaland. Fin reports his suspicion to
    King Olaf, who judges Thorer an enemy better kept at a distance. A second episode
    describes Asmund Grankelson and Harek of Thjotta disputing rights to a sea rock
    used for seal, bird, fish, and egg gathering; after Harek's servants take its
    produce, Asmund and his men seize it back by force.
  language: English
  quote_policy: summarized
