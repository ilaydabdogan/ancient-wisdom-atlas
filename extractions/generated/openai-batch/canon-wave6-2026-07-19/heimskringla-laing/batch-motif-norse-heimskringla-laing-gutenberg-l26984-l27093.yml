canonical_text:
  quote: ''
  summary: The passage recounts King Sigurd's planned battle and his pardon of Sigurd
    Hranason after intercession; King Olaf's death and burial; Borghild's association
    with King Eystein, her ordeal by iron, and her later concubinage with King Sigurd,
    producing Magnus; Sigurd's building at Konungahella and his keeping of the holy
    cross there; and an ale-table comparison of the abilities of the brother-kings
    Eystein and Sigurd.
  language: English
  quote_policy: summarized
