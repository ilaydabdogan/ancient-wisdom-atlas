canonical_text:
  quote: ''
  summary: 'At a large House-thing, a bishop urges the assembled men to oppose King
    Olaf, presenting him as a violent plunderer and enemy of King Canute''s order.
    The assembly applauds and agrees. Lendermen then consult about leadership for
    the army: Kalf nominates Harek of Thjotta, Harek declines and nominates Thorer,
    and Thorer declines command while affirming his duty of vengeance and his selected
    retinue.'
  language: English
  quote_policy: summarized
