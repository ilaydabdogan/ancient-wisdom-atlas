- id: obs:1
  text: A bishop asks to be heard at a House-thing where many people are assembled.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bishop says Olaf has long been accustomed to plunder and kill and has
    brought war and strife upon the audience.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bishop presents Olaf as having acted against King Canute, Olaf the Swedish
    king, the earls Svein and Hakon, and the kings of the Uplands.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bishop says Olaf harmed lendermen, caused some to be murdered or exiled,
    and moved through the land with bands that burned, plundered, and killed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The bishop describes Olaf as arriving with a foreign troop made up largely
    of forest-men, vagabonds, and marauders.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The bishop advises the assembly to advance against Olaf's force, drive them
    away, and leave their corpses for wolves and eagles rather than taking them to
    churches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the bishop's speech, the assembly applauds loudly and unanimously agrees
    to act according to his recommendation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The lendermen meet together to consult about troop arrangement and who should
    lead them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kalf Arnason says Harek of Thjotta is best fitted to lead because of his descent
    from Harald Harfager's line, danger from Olaf, battle experience, and concern
    for honor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Harek declines leadership, citing his age and kinship with King Olaf, and
    says Thorer is better suited because of vengeance claims, outlawry, and promises
    to King Canute and kin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Thorer declines to raise the banner or lead the army, says he must avenge
