canonical_text:
  quote: ''
  summary: King Magnus is wounded in battle, breaks a spear shaft, urges his men onward,
    and is then killed by an axe wound to the neck. Vidkun Jonson kills the attacker,
    withdraws after being wounded, and carries the king's banner and the sword Legbit
    to the ships. The Northmen withdraw from Ireland; King Sigurd returns to Norway
    after hearing of his father's death. The passage then summarizes Magnus's reign,
    character, death age, royal saying, and the regard later shown to Vidkun by Magnus's
    sons.
  language: English
  quote_policy: summarized
