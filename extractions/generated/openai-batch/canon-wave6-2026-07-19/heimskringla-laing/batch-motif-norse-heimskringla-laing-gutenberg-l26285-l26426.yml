canonical_text:
  quote: ''
  summary: King Sigurd sails with his fleet through Lisbon, Alkasse, Norfasund, Forminterra,
    Iviza, Minorca, and Sicily. He wins successive battles, captures booty, overcomes
    a fortified cave on Forminterra by lowering boats from above and using fire at
    the cave mouth, and later in Sicily raises Duke Roger to the title and right of
    king.
  language: English
  quote_policy: summarized
