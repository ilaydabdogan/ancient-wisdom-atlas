canonical_text:
  quote: ''
  summary: The passage records kinship and marriage links around Queen Ingerid and
    Erling Skakke; narrates Erling and Earl Ragnvald's sea expedition toward Jerusalem,
    their battle with and capture of a dromund, their arrival at Palestine and return
    to Norway; recounts Hakon Herdebreid's birth after King Sigurd is drawn to Thora's
    singing; and describes King Eystein's punitive actions against Hising peasants
    and his capture and ransom of Earl Harald Maddad's son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Queen Ingerid had a son named Orm with Ivar Sneis; Orm received the surname
    King-brother, and Ingerid later married Arne of Stodreim, called King's-mate,
    with further children listed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Erling is introduced through a genealogy and described as understanding, a
    friend of King Inge, and married to Christina through King Inge's assistance and
    counsel.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Erling left the country with Eindride Unge and several lendermen intending
    to make a pilgrimage to Jerusalem; Earl Ragnvald and Bishop William joined them
    in Orkney.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The expedition sailed through named western and southern routes, followed
    the same way King Sigurd the Crusader had sailed to Norvasund, and plundered in
    the heathen part of Spain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Eindride Unge separated with six ships, Earl Ragnvald and Erling Skakke
    encountered a large burden ship called a dromund and attacked it with nine ships.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people on the dromund threw weapons, stones, pitch, and boiling oil; Erling
    placed his ship close under the dromund so the missiles missed, then his men cut
    a hole in the dromund and boarded through it.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Audunraude was the first of Erling's men to get into the dromund; Erling's
    side carried the ship, killed many people, took valuable booty, and won a famous
    victory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Earl Ragnvald and Erling Skakke reached Palestine and the river Jordan, then
    went to Constantinople, left their ships, traveled north by land, and arrived
    safely in Norway.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the journey, Erling was said to appear a much greater man than before,
    because of both the journey and his marriage, and he remained strongly devoted
    to King Inge.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: King Sigurd rode past Simon the bonde's house, heard beautiful singing, was
    enchanted by it, saw a lovely girl grinding at a handmill, dismounted, and courted
    her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The girl was Thora, Simon's servant-girl; Simon took care of her afterward,
    and she gave birth to a male child named Hakon, considered King Sigurd's son.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hakon was brought up by Simon Thorbergson and Gunhild together with their
    sons Onund and Andreas, who were very dear to him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: King Eystein Haraldson disputed with the bondes of Reine and inhabitants of
    Hising Isle, fought them at Leikberg, burned and destroyed around Hising, imposed
    fines, and took hostages.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: King Eystein sailed west to Caithness and Thursa, boarded Earl Harald Maddad's
    son's unprepared ship, took the earl prisoner, and accepted three marks of gold
    as ransom.
  category: sequence
  evidence_refs:
  - ev:10
