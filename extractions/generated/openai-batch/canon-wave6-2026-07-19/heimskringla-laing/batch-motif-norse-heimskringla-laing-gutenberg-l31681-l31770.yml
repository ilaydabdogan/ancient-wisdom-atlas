canonical_text:
  quote: I dream of many things to-night, and I sleep ill.
  summary: Erling and King Valdemar negotiate peace between Norway and Denmark through
    hostages, after which Erling becomes Valdemar's man and vassal and receives the
    title of earl with Viken as a fief. A genealogical notice follows, including Kristin's
    departure with Grim Rusle to Constantinople. Olaf, connected to King Eystein through
    his mother Maria, is raised in Sigurd Agnhot's house, gathers a troop while Erling
    is in Denmark, and is chosen king by Upland supporters. Erling pursues Olaf's
    troop. At Rydiokul, a priest invites Erling for Candlemas and mass, secretly informs
    Olaf of Erling's arrival, gives Erling excessive strong drink, and during Erling's
    uneasy sleep and dreams, Erling wakes his men for matins; they take weapons to
    the church and lay them outside while the priest sings.
  language: English
  quote_policy: quoted
