canonical_text:
  quote: ''
  summary: The passage introduces sources for the saga of Magnus Barefoot's sons and
    summarizes traditions about Sigurd's journey to Jerusalem. It then narrates the
    joint accession of Eystein, Sigurd, and Olaf, preparations for an overseas expedition,
    the grant of Orkney to Hakon, Sigurd's departure with sixty ships, winter stays
    in England and Galicia, a raid after a failed provisioning agreement, a sea battle
    with vikings, and the capture of the Spanish castle Sintre.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thjodrek the Monk is reported as saying that Sigurd journeyed to Jerusalem,
    conquered heathen cities including Sidon, captured a cave defended by robbers,
    received presents from Baldwin, returned to Norway in Eystein's lifetime, and
    later became insane, reportedly because of a poisonous drink.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three brothers Eystein, Sigurd, and Olaf became kings in A.D. 1103, with
    deaths later assigned to Olaf, Eystein, and Sigurd.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Magnus Barefoot's fall, his sons took the kingdom of Norway; Eystein
    received the northern part, Sigurd the southern part, and Olaf's third part was
    managed by his two brothers because he was very young.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men returning from Jerusalem and Constantinople brought notable reports, which
    encouraged many men in Norway toward a similar expedition.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Northmen wanted one of the kings to command the planned expedition; the
    kings agreed, and it was decided that Sigurd should go while Eystein ruled the
    kingdom on their joint account.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hakon, son of Earl Paul, came from Orkney, received the earldom and government
    of the Orkney Islands from the kings, and sailed back to Orkney.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Four years after Magnus's fall, Sigurd sailed from Norway with sixty ships;
    the accompanying verse describes the destination as the distant Holy Land and
    the group as brave and pious.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sigurd sailed to England and stayed through the winter with King Henry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sigurd then sailed westward to Valland and stayed the next winter in Galicia,
    described in verse as Jacob's land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: An earl in Galicia promised to provide a market for Sigurd's men but failed
    to continue doing so; Sigurd attacked the earl's castle, the earl fled, and Sigurd
    took victuals and other booty to his ships.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: While sailing past Spain, Sigurd met vikings with a fleet of galleys, attacked
    them, won his first battle with heathen men, and took eight galleys.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Sigurd attacked and took the castle called Sintre in Spain, killed the occupants
    because they refused baptism, and took great booty there.
  category: action
  evidence_refs:
  - ev:11
