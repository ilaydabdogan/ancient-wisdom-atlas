canonical_text:
  quote: ''
  summary: Sigurd comes to Bergen to seek King Harald Gille's acknowledgment of kinship,
    but Harald delays and brings a capital accusation against him over Thorkel Fostre's
    killing. Royal agents take Sigurd by boat toward Nordnes; suspecting foul play,
    he seizes two guards, leaps overboard, swims to land, flees to the mountains,
    and survives by hiding in a rock cleft. Later he hides in Bergen in a priest's
    house and joins a plot against Harald. On Saint Lucia's day, two table-companions
    use a wager about Harald's sleeping place to learn where he will be that night,
    while the main guard is posted elsewhere.
  language: English
  quote_policy: summarized
