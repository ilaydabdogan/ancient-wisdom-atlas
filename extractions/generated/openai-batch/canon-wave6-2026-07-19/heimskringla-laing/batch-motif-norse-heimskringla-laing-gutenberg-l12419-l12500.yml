canonical_text:
  quote: ''
  summary: Earl Thorfin, unable to obtain further delay from King Olaf, submits to
    the king's terms and becomes his vassal. At a General Thing, Olaf publicly declares
    his property right over Orkney and Shetland, invests Bruse and Thorfin with portions
    as fiefs, and adjudicates matters arising from killings involving Einar and Thorkel
    Amundason. Before departing by sea, Thorfin and Thorkel Amundason make a separate
    reconciliation in which Thorkel binds himself by oath to accompany and serve Thorfin.
  language: English
  quote_policy: summarized
