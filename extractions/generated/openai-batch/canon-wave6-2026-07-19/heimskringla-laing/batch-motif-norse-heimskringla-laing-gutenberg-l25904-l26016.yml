  summary: 'The passage includes love verses attributed to King Magnus, a dispute
    between Magnus and Skopte Ogmundson''s family over an inheritance, Skopte''s celebrated
    but fatal voyage abroad with his sons, and two miracles at King Olaf the Saint''s
    resting place in Nidaros: a town fire is checked after Olaf''s shrine is set against
    it, and a severely lame woman is healed after prayer and vows.'
