canonical_text:
  quote: ''
  summary: Thorberg rebukes a brother with a proverb, summons kin and allies, and
    joins a war-force that sails to Nidaros. The assembled men debate attack versus
    negotiation. Fin offers compensation to King Olaf for Thorberg and Stein, but
    the king refuses money and requires oaths of loyalty, service, and disclosure
    of treason as the condition of peace. Thorberg, Fin, and Arne accept and swear;
    Kalf refuses an oath but remains conditionally aligned. Stein is allowed to depart
    safely but is barred from the king's house and later enters King Canute's service
    in England.
  language: English
  quote_policy: summarized
