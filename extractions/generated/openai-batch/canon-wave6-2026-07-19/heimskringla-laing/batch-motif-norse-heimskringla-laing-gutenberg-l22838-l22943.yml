  quote: ''
  summary: The passage recounts Fin Arnason's anger over Kalf's death and his departure
    to King Svein; gives Guthorm Gunhildson's kinship and raiding background; narrates
    Guthorm's dispute with King Margad over booty, his vow to God and Saint Olaf,
    his victory, and his offering to Olaf's shrine; and then tells of a Danish count
