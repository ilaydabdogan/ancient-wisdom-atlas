canonical_text:
  quote: ''
  summary: The passage describes escalating conflict among the brother-kings Inge,
    Sigurd, and Eystein. After earlier killings and a disputed conference, Inge claims
    that his brothers intend to reduce or depose him. At a Thing in Bergen, the people
    support Inge, while Sigurd denies the accusation and threatens Gregorius. Further
    killings of retainers lead Queen Ingerid and Gregorius to urge Inge to act. Inge
    finally calls for arms and resolves that weapons must decide the dispute.
  language: English
  quote_policy: summarized
