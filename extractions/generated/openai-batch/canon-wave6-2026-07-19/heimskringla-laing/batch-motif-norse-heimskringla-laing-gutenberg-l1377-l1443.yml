canonical_text:
  quote: ''
  summary: The passage presents Earl Einar's verse claiming vengeance for Ragnvald
    and ordering a mound over Halfdan's corpse. News of Halfdan's death reaches Norway,
    where his brothers and others think vengeance is required. King Harald sails west
    with a levy; Einar flees to Caithness and speaks defiantly in verse. After messages
    and a conference, Einar submits the case to Harald, who imposes a gold fine on
    Einar and the Orkney people. Einar pays the fine in exchange for the bondes surrendering
    their udal lands, which later remain with the earls until Sigurd son of Hlodver
    restores the rights. The passage then reports the battle deaths of Guthorm and
    Halfdan the White.
  language: English
  quote_policy: summarized
