  quote: ''
  summary: The passage recounts Thorkel Amundason's intercession for the bondes against
    Earl Einar's levies, Einar's escalating anger, Thorkel's departure to Caithness
    and later role as fosterer of Earl Thorfin, and a subsequent territorial dispute
    among Earls Thorfin, Einar, and Bruse that ends in an agreement dividing rule
    over Orkney.
