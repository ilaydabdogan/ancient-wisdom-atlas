canonical_text:
  quote: ''
  summary: At a Thing assembly, Thrand of Gata, secluded in a dark inner tent because
    of eye trouble, negotiates payment of island scat with Leif Ossurson and Karl
    Morske. Several bags of silver are inspected; bad money is rejected and one bag
    is accepted. While Leif and Karl count and weigh the accepted silver, a disturbance
    at Lagman Gille's tent draws Leif away. Gaut the Red and Thord the Low then attack
    Karl, who dies. Thrand offers compensation, but Leif and Gille reject it; Sigurd,
    Gaut, and Thord are banished, and the Norway men report the news to Olaf.
  language: English
  quote_policy: summarized
