  summary: The passage recounts an attempted reconciliation between King Harald and
    King Svein, complaints by their followers, mediation by wise men, a peace settlement
    dividing Norway and Denmark according to older boundaries, oath-confirmation and
    exchange of hostages, and the kings’ departure. It then begins an account of King
    Harald’s expedition against Earl Hakon, including disputed tax claims, movement
    of ships through rivers, waterfalls, and a lake, and a tactical encounter across
    a mire or lake in cold weather where Hakon’s men hold a banner formerly belonging
    to King Magnus Olafson.
