canonical_text:
  quote: ''
  summary: The passage describes Eirik's sons bringing a Danish-backed army to Norway
    while warning beacons fail to spread the alarm. King Hakon consults his men, chooses
    to fight, sends out a war-arrow to gather forces, and meets Eirik's sons at Rastarkalf.
    Egil Ulserk encourages battle, expresses preference for dying in combat rather
    than of old age, and later uses ten banners on a ridge to make Eirik's sons think
    a large force is behind them, causing their flight and Hakon's pursuit.
  language: English
  quote_policy: summarized
