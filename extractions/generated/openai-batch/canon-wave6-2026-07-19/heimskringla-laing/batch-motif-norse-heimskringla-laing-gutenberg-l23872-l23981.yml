canonical_text:
  quote: ''
  summary: Earl Toste, deprived of command and power by his brother King Harald, travels
    abroad seeking aid to recover his English dominions. King Svein of Denmark declines
    to invade England, but Toste then persuades King Harald of Norway by invoking
    precedents of Canute and Magnus, the importance of local support, and Harald's
    military reputation. Harald resolves to attack England, summons a large levy,
    and public opinion debates the danger. Ulf the marshal speaks against fearing
    the English Thingmen, dies that spring, and is praised by Harald at his grave.
    Toste sails west to Flanders to gather followers.
  language: English
  quote_policy: summarized
