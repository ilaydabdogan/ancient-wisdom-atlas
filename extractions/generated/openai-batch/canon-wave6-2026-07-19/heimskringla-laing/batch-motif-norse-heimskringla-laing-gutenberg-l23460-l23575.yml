literal_observations:
- id: obs:1
  text: A king gives Karl a valuable farm and arranges a good marriage for him; Karl
    becomes a considerable man, and the report spreads widely and reaches Norway.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Harald stays in Oslo during the winter after the battle at Nis-river,
    while men arriving from the south tell many stories about the battle.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men drinking in a cellar discuss who won the greatest praise at Nis-river
    and agree that Earl Hakon surpassed others in boldness, speed, luck, helpful action,
    and winning the battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Harald comes to the room-door, hears the talk, says that everyone there
    would willingly be called Hakon, and leaves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In another drinking conversation, a man says Earl Hakon's greater luck was
    giving King Svein quarter, and claims certainty because the man who brought the
    king to land told him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The report reaches King Harald, who orders horses gathered and rides away
    with 900 men through the night and following day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gamal privately pays an acquainted bonde to take the shortest private paths
    to Earl Hakon and warn that the king intends to kill him because Hakon set King
    Svein on shore at Nis-river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bonde reaches Earl Hakon while he is sitting drinking; Hakon rises immediately,
    has movable property removed to the forest, and leaves the house with all his
    people at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: King Harald halts at the farm for the night, while Hakon rides east to Svithjod
    and stays with King Steinkel through the summer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Hakon hears that Harald has gone north, he returns to the Uplands, later
    goes to Vermaland, and receives fiefs from King Steinkel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hakon collects scat and duties from the Upland people, while the Uplanders
    refuse King Harald's demands and say they will pay Hakon as long as he lives and
    has not forfeited life or fief.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Messengers and ambassadors travel between Norway and Denmark to seek peace
