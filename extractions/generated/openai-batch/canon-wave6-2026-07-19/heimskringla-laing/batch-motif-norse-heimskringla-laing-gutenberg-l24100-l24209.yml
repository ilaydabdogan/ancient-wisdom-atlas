canonical_text:
  quote: ''
  summary: The passage recounts King Harald Sigurdson's victory over English forces
    at a ditch or fen, the submission of the castle of York, the night arrival of
    King Harald Godwinson, and the Norse landing near Stamford Bridge without full
    armor before the sighting of a large hostile army and a counsel over retreat or
    reinforcement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Harald orders the charge, has the banner called Land-ravager carried
    before him, and makes an assault that forces the English array to give way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many of the defeated men flee into a ditch or fen, which is described as so
    filled with dead that the Norsemen can cross it dry-foot; Earl Morukare falls
    there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Embedded verses by Stein Herdison and in Harald's Stave describe the fighting
    around Morukare and the slain men lying in the fen.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Earl Toste comes from Flanders to King Harald, is present at the battles,
    and his friends and relations in England strengthen Harald's forces.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: After Harald's victory, nearby districts submit, some people flee, and the
    men of the castle decide to deliver the castle into Harald's power.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At a Thing outside the castle, the people accept submission to Harald and
    give children of leading persons as hostages; a later Thing is appointed for naming
    officers, giving laws, and bestowing fiefs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: King Harald Godwinson comes from the south with a large army, enters the city
    with the consent of its people, and has the gates and walls guarded so that the
    Northmen receive no intelligence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On Monday, King Harald Sigurdson orders the trumpets sounded for landing,
    divides the army so some land and some remain with the ships, and leaves named
    leaders to watch the ships.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Because the weather is fine and hot, the Norsemen lay aside their armor and
    go ashore with shields, helmets, spears, swords, and in many cases bows and arrows.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: As the Norsemen near the castle, they see a great force approaching with dust
    like that from horses' feet, shining shields, bright armor, and arms compared
    visually to glancing ice.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Earl Toste advises returning quickly to the ships for men and weapons or relying
    on the ships for defense; King Harald instead proposes sending three fast riders
    to summon relief while preparing for a hard fight.
  category: speech
  evidence_refs:
  - ev:10
