canonical_text:
  quote: ''
  summary: Gold Harald seeks Earl Hakon's advice after failing to obtain a kingdom
    from King Harald. Hakon counsels secrecy and resolve. Gold Harald says he would
    kill Harald to obtain the kingdom he claims by right. King Harald then consults
    Hakon, refusing to diminish his own kingdom and considering killing Gold Harald
    if he persists. Hakon warns that killing a relation would look wrongful and later
    advises King Harald to keep Denmark whole while directing Gold Harald toward Norway.
    Hakon proposes luring Harald son of Eirik, King Harald's foster-son, with Danish
    lands and a meeting so that Gold Harald can win Norway from Harald Grafeld. King
    Harald objects to deceiving his foster-son but agrees. Hakon then tells Gold Harald
    that a kingdom may open for him in Norway and renews their friendship.
  language: English
  quote_policy: summarized
