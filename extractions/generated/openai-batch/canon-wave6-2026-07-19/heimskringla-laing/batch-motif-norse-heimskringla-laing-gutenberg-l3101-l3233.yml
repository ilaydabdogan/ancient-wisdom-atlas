canonical_text:
  quote: ''
  summary: The passage introduces the saga and its skalds, then narrates the rule
    of Eirik's sons after King Hakon's death. Gunhild, called the King-mother, is
    politically active; Harald is senior among the brothers. The new rulers make settlements
    with regional chiefs and Earl Sigurd. Skaldic verses praise Harald, remember Hakon,
    criticize the rulers' hidden wealth, and provoke Harald's hostility toward Eyvind,
    whose ring Molde is taken as a fine before he leaves for Iceland.
  language: English
  quote_policy: summarized
