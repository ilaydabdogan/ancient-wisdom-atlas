canonical_text:
  quote: ''
  summary: Hjalte abandons direct peace-talk with King Olaf and turns to the king's
    daughter Ingegerd. Ingegerd counsels her father to stop pursuing Norway and to
    make peace with Olaf the Thick, but the king reacts with rage and threatens a
    punitive expedition. Hjalte and Ingegerd then speak privately about Olaf of Norway
    as a possible husband; she is cautiously receptive if Hjalte's praise is true.
    Hjalte informs the skalds Gissur and Ottar, and later sends men back with letters
    from Ingegerd to the earl and Ingebjorg. An endnote remarks on written letters
    in the sagas.
  language: English
  quote_policy: summarized
