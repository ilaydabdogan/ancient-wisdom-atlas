canonical_text:
  quote: ''
  summary: Earl Hakon attempts to have Orm Lyrgja's wife Gudrun brought to him, but
    Orm and Gudrun refuse. Message-tokens summon a revolt of the bondes. Hakon flees,
    hides with his slave Kark, and receives ominous dream reports from Kark. Thora
    of Rimul conceals Hakon and Kark in a pit under a swine-stye. Olaf Trygvason arrives
    by sea, kills Hakon's son Erlend, is accepted as king by the bondes, and promises
    rewards to whoever kills Hakon while Hakon and Kark hear from their hiding place.
  language: English
  quote_policy: summarized
