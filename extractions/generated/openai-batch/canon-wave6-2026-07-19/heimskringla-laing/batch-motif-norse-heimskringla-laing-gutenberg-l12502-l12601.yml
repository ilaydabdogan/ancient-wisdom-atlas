canonical_text:
  quote: ''
  summary: King Olaf grants Earl Bruse two parts of the Orkney territory while keeping
    Bruse's son Ragnvald with him as security for fidelity. The passage then describes
    Bruse and Thorfin's divided rule of Orkney, viking raids, Thorfin's later dominance,
    and the deaths of Thorfin and Bruse. The narrative returns to King Olaf Haraldson
    in Nidaros, his inquiry into Christianity in northern Norway, and introduces Harek
    of Thjotta as a wealthy and respected Halogaland magnate involved in Lapland trade
    and royal business.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before Bruse departs, King Olaf says he will give Bruse the two parts of the
    country he formerly ruled and will keep Bruse's son Ragnvald with him to secure
    Bruse's fidelity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bruse is thankful for receiving two thirds instead of one third of the country,
    returns to Orkney, and Ragnvald remains in the East with King Olaf.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ragnvald is described as handsome, with long yellow hair, and as growing stout,
    tall, able, intelligent, and polite.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Otter Svarte's poem says chiefs from Shetland and western isles desired to
    be subject to King Olaf and had scarcely acknowledged a sovereign before.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Thorfin and Bruse come west to Orkney; Bruse takes two parts of the country
    under his rule, while Thorfin takes one third and is usually in Caithness and
    Scotland.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Orkney is repeatedly plundered by Northmen and Danes on viking cruises, while
    Bruse is left to defend the islands and complains that Thorfin takes revenues
    without providing defense.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorfin offers to exchange shares so that he will hold two thirds and defend
    the whole land; the passage says the saga of the earls relates that this was eventually
    agreed upon.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Thorfin is described as the ablest Orkney earl, ruling Orkney, Shetland, the
    Hebudes, and great possessions in Scotland and Ireland; Arnor's verse says people
    from Thurso-skerry to Dublin obey him.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Thorfin became earl at five years of age, ruled more than sixty years, and
    died in bed; Bruse died during the days of Canute the Great after the fall of
    Saint Olaf.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrative returns to King Olaf Haraldson after peace with the Swedish
    king; Olaf spends winter at Nidaros and carefully inquires how Christianity is
    observed throughout the land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Olaf learns that Christianity is not observed north of Halogaland and is poorly
    observed in Naumudal and the interior of Throndhjem.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Harek of Thjotta is introduced as a son of Eyvind Skaldaspiller who acquired
    the whole island of Thjotta, built a large mansion, became rich, and held the
    Lapland trade and royal business in Lapland.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Messages pass between Olaf and Harek on friendly terms; Olaf announces that
