  summary: King Olaf Trygvason stands visibly on the Serpent and identifies the enemy
    forces. The opposing kings and Earl Eirik attack; Earl Sigvalde holds back. Svein
    and Olaf the Swede are driven off, while Earl Eirik presses close, clears Olaf's
    ships one by one, and surrounds the Long Serpent. Olaf's remaining armed men gather
    on the Long Serpent amid dense missiles and close combat; some rush onto enemy
    ships and many fall overboard and sink.
