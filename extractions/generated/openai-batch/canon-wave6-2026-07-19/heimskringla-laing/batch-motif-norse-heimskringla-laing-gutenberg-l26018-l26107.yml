canonical_text:
  quote: ''
  summary: After nine years as king of Norway, King Magnus sails west with a large
    force and powerful followers. He campaigns in the Orkneys, Hebrides, Ireland,
    Dublin, Connaught, and Ulster, aided by King Myrkjartan. Preparing to return to
    Norway, Magnus sends for cattle for ship-provision. When the cattle do not appear
    by the appointed evening, he goes ashore on Bartholomew's mass-day with many men.
    In wet, brushy terrain they see a dust-cloud, prepare defensively, and then learn
    it is their own men driving the cattle. On their return through the mires, Irish
    attackers rise from concealment and attack. Magnus orders a war-horn gathering,
    shield-rampart, and retreat toward firm ground. At a difficult ditch crossing
    he sends Thorgrim Skinhufa's bowmen across to shoot from holms, but Thorgrim and
    his men run toward the ships, and Magnus rebukes him for desertion.
  language: English
  quote_policy: summarized
