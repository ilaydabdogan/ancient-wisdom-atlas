canonical_text:
  quote: "“I intend to take the heritage of my forefathers”"
  summary: King Olaf calls Sigurd, Asta, and Hrane to a private consultation. He says
    he has returned from a long stay abroad, declares that foreign rulers hold his
    ancestral inheritance, and announces his intention to reclaim it by force or die
    on his inheritance. Sigurd cautions him, pledges support and resources, and recommends
    first gauging other Upland kings and local support. Asta supports her son’s ambition
    to become supreme king of Norway. The conference ends, and Sigurd hosts Olaf and
    his men.
  language: English
  quote_policy: quoted
