  summary: The passage recounts Svein's favorable reception in Denmark, his rise to
    the title of king, King Magnus's punitive expedition against Jomsborg in Vindland,
    Svein's later gathering of support, and Magnus's preparation to face a much larger
    Vindland army. On Michaelmas eve, Magnus dreams that his father, King Olaf the
    Saint, promises to be with him in battle, after which the army hears bells in
    the air that some identify with Olaf's bell Glod at Nidaros.
