    lists sources and skalds, then recounts Astrid's flight after King Trygve's death,
    her concealment on a small island where Olaf is born and named with water poured
    over him, her later secret journey to her father Eirik's farm, and Gunhild's sons
    hearing of her pregnancy but not searching for her that winter.
