canonical_text:
  quote: ''
  summary: Gunhild repeatedly seeks to capture Astrid’s son Olaf, the son of King
    Trygve. Eirik helps Astrid flee by night toward Svithjod. Along the way, Bjorn
    refuses lodging while Thorstein shelters the fugitives, warns them of pursuit,
    helps them hide on a reed-covered islet, and misdirects Hakon’s search party.
    Astrid and Olaf reach Hakon the Old in Svithjod. Gunhild later sends Hakon to
    the Swedish king to obtain Olaf, but Astrid refuses, Hakon the Old does not deliver
    him, and the envoys are driven off after threats of violence.
  language: English
  quote_policy: summarized
