canonical_text:
  quote: King Olaf threw his shield over his head, and sank beneath the waters.
  summary: The passage narrates the final fighting around King Olaf Trygvason's ship,
    the Serpent. Olaf and Kolbjorn leap overboard; Olaf sinks beneath the water, while
    Kolbjorn is captured after being mistaken for the king. Reports then circulate
    that Olaf may have escaped by diving to a Vindland cutter, though the prose states
    that he never returned to Norway. Earl Eirik gains the Long Serpent and the victors
    divide Norway.
