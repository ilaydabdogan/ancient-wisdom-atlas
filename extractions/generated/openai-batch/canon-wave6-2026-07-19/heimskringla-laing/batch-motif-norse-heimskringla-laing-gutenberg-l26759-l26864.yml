canonical_text:
  quote: ''
  summary: The passage characterizes Kings Sigurd and Olaf, notes that the brothers
    Eystein, Sigurd, and Olaf relieved burdens imposed under Danish rule, and recounts
    King Sigurd’s melancholy after a dream. In the dream, Olaf the Saint emerges from
    Christ church in royal splendor and leads first King Olaf and then King Eystein
    into the church, but does not come to Sigurd, who awakens in dread. Eystein interprets
    the bench as the shared kingdom, the saint’s summons as foretelling Olaf’s and
    Eystein’s deaths and future welfare, and the delay toward Sigurd as a sign of
    long rule but possible heavy accident. Sigurd accepts the interpretation and becomes
    cheerful. The passage then lists Sigurd’s marriage to Malmfrid and related royal
    genealogies.
  language: English
  quote_policy: summarized
