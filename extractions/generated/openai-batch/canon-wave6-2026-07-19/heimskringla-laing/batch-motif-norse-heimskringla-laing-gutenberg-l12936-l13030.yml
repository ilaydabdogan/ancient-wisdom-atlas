canonical_text:
  quote: ''
  summary: King Olaf questions Gudbrand's son about the local god, learns that it
    is a Thor-like hollow image adorned with metal and fed offerings, and then confronts
    the bondes at the Thing. After preaching, threats, and a challenge over divine
    power and weather, Olaf arranges for Kolbein Sterke to break the idol when the
    crowd turns toward the rising sun. The idol bursts open and vermin and reptiles
    emerge. The bondes fail to flee because their ships and horses have been disabled.
    Olaf offers them Christianity or battle; Dale-Gudbrand accepts the Christian God,
    the people are baptized, teachers are left behind, and a church is built in the
    valley.
  language: English
  quote_policy: summarized
