canonical_text:
  quote: ''
  summary: Sigurd Sigurdson advises the king on how to respond to Harald's expected
    return, including punitive action against nonjoining lendermen, retreat northward,
    or remaining in Bergen; the king rejects these counsels. Harald comes to Bergen
    with a large army during the Christmas/Yule season, delays fighting because of
    sacred time, and Magnus prepares defenses. Harald vows to build an Olaf's church
    for victory, maneuvers around Magnus, and Magnus's men scatter. Magnus attempts
    to flee by ship but is blocked by iron chains; he is captured with companions,
    and some of his friends are killed.
  language: English
  quote_policy: summarized
