literal_observations:
- id: obs:1
  text: Olaf receives a message in the evening and makes an unusually long night march
    to Rydiokul, arriving while mass is still being sung and while it is pitch-dark.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Olaf and his men enter a room, raise a war-shout, and kill some of the earl's
    men who had not gone to early mass.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Erling and his men hear the war-shout, run to their weapons, move toward their
    ships, and meet Olaf's men at a fence where a sharp conflict occurs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Darkness prevents Olaf's men from distinguishing Erling's men, which helps
    Erling's side retreat toward the ships.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Are Thorgeirson and many of Erling's court-men fall; Erling is wounded in
    the left side, and Orm the King-brother is severely wounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The meeting is generally considered unlucky for Olaf's people, and Olaf is
    later called Olaf the Unlucky while his people are called Hat-lads.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: At Stangar, Earl Erling defeats the Hat-lads; Sigurd Agnhot and many of Olaf's
    men fall, and Olaf escapes by flight to Denmark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Olaf later dies of an illness, is buried in the Maria church, and is called
    a saint by the Danes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Harald claims to be a son of King Sigurd Haraldson and Princess Kristin, and
    a maternal brother of King Magnus; Nikolas Kufung takes him prisoner and delivers
    him to Earl Erling.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Erling is described as speaking gently or little to enemies when he has decided
    to kill them, and speaking furiously when he intends to spare them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: After King Magnus intercedes for Harald, Erling rejects a purely merciful
    course and orders Harald to be taken to Nordnes and beheaded.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Eystein gives himself out as a son of King Eystein Haraldson, seeks assistance
    from Earl Birger Brosa and Brigida, and receives men and travel money.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Eystein comes to Viken, people flock to him, and he is proclaimed king; because
