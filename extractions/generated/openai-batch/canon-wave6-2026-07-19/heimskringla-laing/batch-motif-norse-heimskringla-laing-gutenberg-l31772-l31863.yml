  summary: The passage recounts Olaf's night attack on Earl Erling's men, Erling's
    escape and later victory at Stangar, Olaf's death and burial, the execution of
    Harald after a royal kinship claim, and the rise of Eystein and the poor forest-based
    followers called Birkebeins from their birch-bark leggings.
