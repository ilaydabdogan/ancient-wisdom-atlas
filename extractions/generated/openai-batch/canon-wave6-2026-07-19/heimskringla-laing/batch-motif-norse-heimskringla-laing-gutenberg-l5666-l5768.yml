canonical_text:
  quote: ''
  summary: Kark denies intending to betray Earl Hakon, dreams that Olaf places a ring
    around his neck, and later kills and beheads Hakon while Hakon sleeps. Kark delivers
    Hakon's head to King Olaf and is himself beheaded. Olaf publicly displays both
    heads at Nidarholm, where the crowd stones them. The passage then evaluates Hakon,
    frames his end as part of the fall of heathen worship and the rise of the holy
    faith, and describes Olaf Trygvason's election as king and the flight of Hakon's
    sons and allies to Sweden.
  language: English
