- id: obs:3
  text: Small tarred wooden splinters smeared with wax and sulphur are bound to the
    birds, set on fire, and the birds return to their nests beneath reed or straw
    roofs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fire spreads from the birds to the house roofs until the castle is in flames;
    the inhabitants come out, beg for mercy, receive life and safety from Harald,
    and the place is taken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At another strong castle on a flat hard plain, Harald begins digging a passage
    from a deep streambed that cannot be seen from the castle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The excavated earth is thrown into the stream and carried away by water while
