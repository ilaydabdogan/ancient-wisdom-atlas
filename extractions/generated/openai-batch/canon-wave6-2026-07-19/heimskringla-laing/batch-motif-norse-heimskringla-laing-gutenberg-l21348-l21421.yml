  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Varings attack with swords, kill some defenders, pursue others, seize
    and open the castle gate, admit the army, grant quarter to surrenderers, and Harald
    gains possession and booty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A third castle is described as the greatest, strongest, richest, and most
