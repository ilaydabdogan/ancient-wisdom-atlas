canonical_text:
  quote: ''
  summary: The passage recounts three siege episodes in Sicily involving Harald. At
    the first castle, he uses nesting birds fitted with burning materials to set roofs
    and the castle on fire, then grants quarter. At the second, he has a hidden tunnel
    dug from a streambed and attacks through the floor of a hall, gaining the castle
    and booty. At the third, after defenders taunt the Varings from a strongly ditched
    castle, Harald orders his men to feign indifference and play unarmed outside bow-shot.
  language: English
  quote_policy: summarized
