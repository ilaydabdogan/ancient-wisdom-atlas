- id: obs:1
  text: Harald comes to Sicily, plunders, and besieges a strong, populous castle whose
    thick walls and provisions prevent immediate entry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Harald orders bird-catchers to catch small birds that nest inside the castle
    and forage outside by day.
  category: action
  evidence_refs:
