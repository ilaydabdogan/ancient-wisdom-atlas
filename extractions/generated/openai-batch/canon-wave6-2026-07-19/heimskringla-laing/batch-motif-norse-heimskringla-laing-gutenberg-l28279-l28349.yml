canonical_text:
  quote: ''
  summary: The passage recounts losses of merchant ships, ignored warnings and omens,
    and a Vindland attack on Konungahella during Saint Lawrence day high mass. The
    invaders fight merchants at the piers, loot and burn the town and ships, and assault
    the castle. A surrender offer is rejected. Solveig carries news to a farm, a message
    war-token is sent to men at an ale feast, and Olver Miklimun arms himself and
    urges aid for the townspeople.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thirteen loaded merchant ships prepared to leave; eleven were lost with men
    and goods, a twelfth lost its cargo though its people were saved, and priest Lopt
    traveled safely to Bergen with his belongings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Danish king Eirik and Archbishop Assur sent warnings to Konungahella to keep
    watch because the Vindland people had a large force making war on Christian people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The townspeople paid little attention to the warning and increasingly forgot
    the earlier dreadful omens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On Saint Lawrence day, while high mass was being spoken, Vindland king Rettibur
    came to Konungahella with 550 cutters, each carrying forty-four men and two horses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dunimiz and Unibur accompanied Rettibur, and the invading force divided its
    approach through the river arms, landed horses, and rode around the town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Einar brought news of the approaching army to the Castle church, where the
    inhabitants were gathered for high mass while priest Andres was speaking.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some townspeople initially thought the force might be Danish king Eirik, then
    armed themselves, went to the piers, and saw that it was an enemy army.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Vindland people attacked nine East-country merchant vessels; the merchants
    defended themselves for a long time, and the passage states that the Vindlanders
    lost 150 ships with their crews in the fighting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the fighting slackened, burgesses fled into the castle with valuables
    and portable goods, while Solveig, her daughters, and two other women went ashore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Vindlanders landed, counted their losses, looted the town and merchant
    ships, set fire to the town and ships, and moved to assault the castle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Rettibur offered those in the castle their lives, weapons, clothing, silver,
    and gold if they came out; the offer was rejected, and defenders shot, threw stones,
    and threw sharp stakes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Solveig brought news to the farm Solbjorg; a message war-token was split and
    sent to Skurbagar, where many men were gathered at a joint ale-drinking feast.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Olver Miklimun armed himself with helmet, shield, and a great axe, urged the
    assembled men to help the townspeople, and said he would go alone if others held
    back.
  category: speech
  evidence_refs:
  - ev:8
