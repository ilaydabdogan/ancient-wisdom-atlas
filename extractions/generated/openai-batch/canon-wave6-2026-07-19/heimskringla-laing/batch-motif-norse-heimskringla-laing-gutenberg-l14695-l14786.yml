canonical_text:
  quote: ''
  summary: Stein kills a landbailiff, flees with a boy, conceals the killing, and
    reaches Giske Isle. Ragnhild receives him because of an earlier occasion when
    Stein helped bring a priest to baptize her weak newborn daughter Thora, held the
    child at baptism, gave a gold ring, and received Ragnhild's promise of friendship.
    When Stein now asks for help against King Olaf's wrath, Ragnhild presses her husband
    Thorberg to protect him. Thorberg fears the king's condemnation of Stein as an
    outlaw, but Ragnhild and her son Eystein force the issue, and Stein remains over
    winter. Later the king summons Thorberg, while his brothers Fin and Arne criticize
    him for sheltering the king's outlaw.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stein says he will not submit to such treatment from the king's slaves, draws
    his sword, and kills the landbailiff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the killing, Stein puts the boy on a horse, sits in the sledge himself,
    drives through the night, crosses a fjord by ferry, conceals the murder, and claims
    they are king's men when they seek hospitality.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stein comes to Giske Isle, to Thorberg Arnason's house, where Ragnhild, Thorberg's
    wife and Erling Skjalgson's daughter, receives him well because of earlier friendship.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the earlier occasion, Ragnhild was in difficult childbirth on Giske when
    there was no priest on the island or nearby, and messengers asked a merchant-vessel
    whether it had a priest aboard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The priest Bard is young and has little learning; he agrees to go to Ragnhild
    only if Stein accompanies him for advice, and Stein agrees.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ragnhild gives birth to a weak female child; Bard baptizes the infant, Stein
    holds her at the baptism, the child is named Thora, and Stein gives her a gold
    ring.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ragnhild promises Stein perfect friendship and tells him to come to her whenever
    he needs help; Stein says he will hold no other female child at baptism.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: When Stein later reports that the king's wrath has fallen on him, Ragnhild
    says all the aid she can give will stand at his service, seats him beside her
    son Eystein Orre, receives gifts from Stein, and asks Thorberg to receive and
    care for him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Thorberg says King Olaf used a message-token, held a Thing about the murder
    of Thorgeir, condemned Stein as having fled the country, and is highly incensed;
    Thorberg therefore wants Stein to leave quickly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ragnhild says that she and Thorberg shall either both go or both stay; Eystein
    Orre says he will not remain behind if Ragnhild goes, and Thorberg yields while
    warning that Ragnhild relies too much on her descent against King Olaf's word.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ragnhild proposes sending Stein safely to her father Erling, but Thorberg
    refuses because he thinks there are already enough matters to enrage the king
    against Erling; Stein remains there all winter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Yule a royal messenger orders Thorberg to come to the king before midsummer;
    friends advise caution, and Thorberg's brothers Fin and Arne criticize his sheltering
    of the king's outlaw.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
