  quote: ''
  summary: The passage narrates a political plot in which the Danish king, Earl Hakon,
    and Gold Harald draw Harald Grafeld to Denmark under an offer of fiefs. Famine
    in Norway helps persuade Harald Grafeld to accept the invitation. Gold Harald
    attacks and kills Harald Grafeld at Limfjord. Earl Hakon then defeats Gold Harald,
    takes him prisoner, and has him hanged, after arranging with the Danish king to
    hold Norway under Danish overlordship.
