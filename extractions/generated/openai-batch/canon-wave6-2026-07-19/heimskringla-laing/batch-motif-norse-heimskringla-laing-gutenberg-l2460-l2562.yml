canonical_text:
  quote: These eight men bound themselves... to root out Christianity in Norway...
    and... to oblige the king to offer sacrifice to the gods.
  summary: The passage recounts a Yule feast in More where chiefs and bondes pressure
    King Hakon to participate in pagan sacrifice, including eating horse-liver and
    drinking without the sign of the cross. Some chiefs attack Christian clergy and
    churches. Hakon later reconciles with Throndhjem men through Earl Sigurd when
    Eirik's sons invade. Hakon defeats Guthorm Eirikson at Ogvaldsnes, pursues Eirik's
    sons toward Denmark, and afterwards establishes coastal military levy and beacon
    laws.
  language: English
  quote_policy: quoted
