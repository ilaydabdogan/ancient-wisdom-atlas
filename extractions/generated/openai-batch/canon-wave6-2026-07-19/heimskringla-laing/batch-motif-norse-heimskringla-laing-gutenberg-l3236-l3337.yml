candidate_motifs:
- id: motif:1
  label: royal legitimacy through inheritance and ancestral precedent
  taxonomy_refs:
  - royal_legitimacy
  basis: Gunhild grounds her sons' claim in royal title, forefathers, father's heritage,
    and the precedent of their grandfather King Harald taking an earl's land while
    subduing Norway.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif appears in a political dynastic saga context rather than a divine
    kingship myth.
- id: motif:2
  label: suppression of former cult through temple destruction and discarded sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The passage explicitly says the Christianized sons pulled down idol temples
    and cast away sacrifices where they had power, creating animosity.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes abolition of sacrifices, not a sacrificial rite
    itself; no theological judgment is stated.
- id: motif:3
  label: gold marked by mythic kennings and divine attributes
  taxonomy_refs: []
  basis: Endnotes explain gold through Menja and Fenja's grinding, Fulla's gold band,
    gold rings, and Heimdal's gold-toothed horse, while verse praises Harald's yellow
    gold.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: These are explanatory poetic notes rather than a continuous narrative
    episode.
- id: motif:4
  label: secret counsel and insider betrayal against a powerful ruler
  taxonomy_refs: []
  basis: Gunhild rejects open action, Grjotgard is admitted to private consultations,
    and a secret agreement is made for him to watch for a chance to attack his brother
    Earl Sigurd by surprise.
  evidence_refs:
  - ev:10
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage sets up the conspiracy but does not yet narrate the attack
