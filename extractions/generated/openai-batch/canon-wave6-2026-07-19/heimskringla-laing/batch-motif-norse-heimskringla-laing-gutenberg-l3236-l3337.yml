- id: motif:5
  label: gifts and promised office used to secure political loyalty
  taxonomy_refs: []
  basis: Harald sends presents and friendship offers, Grjotgard is received intimately,
    and Harald promises him Sigurd's earldom and government in exchange for joining
    the attack.
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The exchange is political and pragmatic; the passage does not frame it
