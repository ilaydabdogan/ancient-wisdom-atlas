canonical_text:
  quote: ''
  summary: The passage gives explanatory notes on gold kennings involving Menja, Fenja,
    Fulla, Frig, and Heimdal; describes Gunhild's sons as Christianized rulers who
    destroy idol temples and sacrifices but do not spread Christianity; presents them
    as wealthy, fierce, skilled warrior-kings; and narrates Gunhild's counsel that
    her sons should reclaim Throndhjem from Earl Sigurd by indirect plotting through
    Sigurd's younger brother Grjotgard, who is won by gifts, intimacy, and a promised
    earldom. A following section heading announces Sigurd's burning in a house in
    Stjoradal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menja and Fenja are described in an endnote as strong girls of giant race
