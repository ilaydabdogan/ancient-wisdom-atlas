canonical_text:
  quote: ''
  summary: King Olaf tries to raise a levy at Tunsberg but receives limited support
    while King Canute prepares a large fleet. Olaf consults his men, and Sigvat frames
    possible flight as a response to treachery rather than cowardice. Harek of Thjotta
    carries out a night raid against Grankel's house and burns it, killing Grankel
    and others without immediate compensation proceedings. Canute sails to Norway,
    is accepted by local assemblies, takes hostages, receives fealty, grants offices
    and fiefs, and is chosen king of all Norway at a Thing in Throndhjem.
  language: English
  quote_policy: summarized
