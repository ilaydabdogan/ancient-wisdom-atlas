canonical_text:
  quote: ''
  summary: King Olaf prepares for battle against the bondes by organizing his army
    under banners, ordering a white cross as a field-token, and assigning a Christian
    battle-cry. After reports that most able-bodied men have joined the bondes, Fin
    Arnason advises plundering and burning settlements. Olaf rejects general ravage,
    distinguishes former punitive violence for rejection of the true faith from the
    present political treason, and orders restraint, recruitment, provisioning, and
    the killing of spies.
  language: English
  quote_policy: summarized
