canonical_text:
  quote: ''
  summary: Magnus the Blind flees and encourages foreign rulers to invade Norway.
    Earl Karl of Gautland is defeated by King Inge at Krokaskog. Magnus then persuades
    King Eirik of Denmark to invade with a large fleet. At Oslo, people attempt to
    move holy Halvard's coffin; it first becomes too heavy, then is carried out the
    next morning as the fleet approaches. Eirik burns Halvard's church and Oslo, but
    his expedition fails. Sigurd Slembidjakn later conducts sea raids against Vindland
    men and others.
  language: English
  quote_policy: summarized
