  summary: The passage describes King Olaf’s winter position, Swedish King Onund’s
    movement with an army, their delayed and then hastened meeting after Canute departs
    for England, Canute’s delegation of rule in Denmark to Hardaknut with Earl Ulf,
    the friendly conference and gift exchange between Olaf and Onund, and Olaf’s subsequent
    coastal voyage past Jadar after discussion of wind and danger from Erling Skjalgson’s
    assembled force.
