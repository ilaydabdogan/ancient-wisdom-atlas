canonical_text:
  quote: '"he set out in the shape of a whale."'
  summary: 'King Harald sends a warlock in altered form to reconnoiter Iceland. The
    warlock travels around Iceland as a whale and is opposed at several places by
    guardian beings: spirits in mountains and hills, a dragon with venomous creatures,
    a huge bird with other birds, a grey bull with land-spirits, and a giant with
    other giants. The Danish king turns back. Earl Hakon resettles devastated areas
    and pays no Danish tax. A later section narrates Svein''s conflict with his father
    Harald Gormson, Harald''s fatal wound, Svein''s selection as king, and Sigvalde''s
    coerced mediation of peace between Svein and Burizleif through marriage alliances.'
  language: English
  quote_policy: quoted
