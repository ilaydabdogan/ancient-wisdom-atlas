canonical_text:
  quote: ''
  summary: Harek passes Canute's fleet in a ship initially taken for a humble trading
    vessel, then displays sail and gilded vane and returns north. King Olaf travels
    peacefully to Sarpsborg and prepares winter quarters. Sigvat the skald returns
    after meeting Canute, is questioned by Olaf, answers in verse that he refused
    Canute's service, and is restored to favor. Canute's gifts and messengers draw
    support away from Olaf, and Sigvat condemns such purchased treason in verse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Canute's watchmen see a deeply loaded ship with few men at the oars and guess
    it is carrying herrings or salt because it looks grey and untarred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After passing farther through the Sound and past the fleet, Harek raises the
    mast, hoists the sail, and sets up a gilded vane; the sail is white with red and
    blue interwoven stripes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Canute's men report that King Olaf may have sailed through them, but Canute
    replies that Olaf is too prudent to pass his fleet with one ship and says it is
    more likely Harek of Thjotta or someone like him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narration says many believed Canute knew of Harek's expedition and that
    Harek's success implied a prior friendship or understanding between Canute and
    Harek.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Harek sings as he sails northward round Vedrey and then continues without
    stopping until he reaches Halogaland and his house in Thjotta.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: King Olaf travels from Smaland to West Gautland and through Viken to Sarpsborg,
    marching quietly and peaceably while country people assist him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Sarpsborg, Olaf orders a winter abode prepared, gives most chiefs leave
    to return home, and keeps selected lendermen near him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sigvat is described as Olaf's long-time household man and marshal, skilled
    in skaldcraft though not in prose speech.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sigvat had traveled to Normandy and England, met Canute, received permission
    to sail to Norway, and went straight to Olaf at Sarpsborg.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When Sigvat returns, Olaf is silent at first; Sigvat sings asking where the
    king's marshal should sit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Olaf says he has heard Sigvat spoke with Canute and questions whether Sigvat
    is still Olaf's marshal or has become one of Canute's men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sigvat answers in verse that Canute wished him to stay and serve in his court,
    but Sigvat refused to forsake Olaf or serve two masters.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Olaf tells Sigvat to take his former seat, and Sigvat soon returns to his
    earlier high favor with the king.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Erling Skjalgson and his sons spend the summer in Canute's army under Earl
    Hakon; Thorer Hund is also there and highly esteemed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: After hearing Olaf had gone overland to Norway, Canute dismisses his army
    to winter quarters; Erling returns to Norway with gifts from Canute, while Thorer
    remains at Canute's court.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Canute's messengers travel with Erling through the country, paying promised
    money and giving additional money to people whose friendship can be purchased
    for Canute.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Many turn their support to Canute, promise him service, and agree to oppose
    Olaf, some openly and more secretly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: Sigvat composes a song saying that traitors use purses of gold to buy what
    should not be sold, including the king's life and throne, and that the traitor
    has no heavenly pleasure.
  category: speech
  evidence_refs:
  - ev:7
