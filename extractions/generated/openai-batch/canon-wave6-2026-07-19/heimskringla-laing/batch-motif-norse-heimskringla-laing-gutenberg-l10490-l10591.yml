  quote: ''
  summary: Upland kings conspire against King Olaf and gather supporters. Ketil of
    Ringanes secretly travels by boat to warn Olaf. Olaf mobilizes men and vessels,
    reaches Ringsaker before dawn, surrounds the houses where the kings sleep, captures
    them, mutilates or banishes several leaders, takes possession of their lands,
    receives hostages, and becomes the only ruler bearing the title of king in Norway.
  language: English
  quote_policy: summarized
