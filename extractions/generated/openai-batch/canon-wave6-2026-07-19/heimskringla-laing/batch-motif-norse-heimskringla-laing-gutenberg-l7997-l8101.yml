  summary: The passage recounts King Olaf’s inland raid in Finland, a forest ambush
    at Herdaler, and a storm attributed to Finnish witchcraft that Olaf escapes by
    sea. It then narrates Olaf’s victories at Sudervik and Kinlima, the sudden death
    of Svein Forked Beard in England, Ethelred’s return, Olaf’s aid to him, and preparations
    for an assault on the fortified bridge and Danish works at London and Southwark.
