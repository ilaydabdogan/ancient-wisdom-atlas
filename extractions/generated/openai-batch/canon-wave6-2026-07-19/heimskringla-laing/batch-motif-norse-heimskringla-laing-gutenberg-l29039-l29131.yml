canonical_text:
  quote: ''
  summary: Sigurd Slembidjakn raids along the Norwegian coast, killing, maiming, capturing,
    and seizing goods, ships, and a child, who is spared after a labouring man claims
    him as his own son. King Inge sends a letter to his brother King Sigurd urging
    military union against common danger and warning of armed conflict if Sigurd refuses.
    At the Thing, Ottar Birting advises King Sigurd to go to King Inge; Sigurd agrees,
    war-forces are gathered, and the brothers meet in Viken.
  language: English
