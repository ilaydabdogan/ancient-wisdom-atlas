canonical_text:
  quote: ''
  summary: Thorer and Karle's party arrive by ship at Geirsver, where Thorer demands
    division of booty and the parties disagree. Thorer calls Karle aside and kills
    him with a spear. Gunstein and his men recover Karle's body and flee, while Thorer
    pursues them. A woman described as acquainted with witchcraft helps Gunstein conceal
    himself. Thorer plunders and sinks Gunstein's vessel. Gunstein later reaches King
    Olaf at Throndhjem, reports the expedition, and remains with the king after receiving
    a promise of future assistance.
  language: English
