canonical_text:
  quote: ''
  summary: Einar Tambaskelfer and Kalf Arnason travel with a select retinue from the
    Throndhjem country eastward through Jamtaland, Helsingjaland, Svithjod, Russia,
    and Ladoga to seek Magnus, son of King Olaf the Saint, at Novgorod. They offer
    to bring Magnus to Norway and support his claim to his father's heritage. King
    Jarisleif consults with the queen and chiefs and grants safe conduct. At Novgorod
    the Northmen become Magnus's men and subjects, Kalf and former opponents of Olaf
    swear allegiance, Magnus swears peace and reconciliation, and Magnus is arranged
    to become Kalf's foster-son while Kalf undertakes to aid his dominion.
  language: English
  quote_policy: summarized
