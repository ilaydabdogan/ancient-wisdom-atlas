canonical_text:
  quote: ''
  summary: Thorer, a wealthy and popular young man, hosts King Olaf at a splendid
    feast. Olaf privately questions Dag, whom he trusts for truthful knowledge of
    past and future events. Dag says Thorer has accepted money from King Canute for
    Olaf's head and identifies a hidden gold ring on Thorer's arm as proof. Olaf exposes
    the ring at table, has Thorer seized and killed despite pleas for mercy. Thorer's
    brother Grjotgard retaliates against the king's goods and men, hides in secret
    places, and is later surrounded at dawn. Grjotgard rushes out to attack Olaf;
    Arnbjorn takes the mortal wound, and Grjotgard and most of his men are killed.
  language: English
  quote_policy: summarized
