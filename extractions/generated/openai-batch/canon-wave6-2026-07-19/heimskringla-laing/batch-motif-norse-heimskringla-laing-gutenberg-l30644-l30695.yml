canonical_text:
  quote: ''
  summary: 'King Hakon takes control of the country, assigns offices to his friends,
    and holds a private church meeting. Kristin secretly arranges for a hidden listener
    and warns Erling Skakke not to trust Hakon. The passage then recounts Olaf''s
    sword Hneiter: lost at Stiklestad, preserved through owners, later borne by a
    Varangian in Constantinople, repeatedly found away from its owner for three nights,
    identified as Olaf the Saint''s sword, bought by the emperor, and placed over
    the altar in Saint Olaf''s church. Eindride Unge is named as a witness and transmitter
    of the account, and Einar Skulason as a poetic source.'
  language: English
  quote_policy: summarized
