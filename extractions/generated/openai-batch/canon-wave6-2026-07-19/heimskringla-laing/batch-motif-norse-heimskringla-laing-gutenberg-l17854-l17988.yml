canonical_text:
  quote: ''
  summary: Before battle, King Olaf arranges a shield defense and places skalds inside
    it to witness events directly. The skalds compose and sing battle verses, and
    the army memorizes them. Olaf gives silver to be distributed to churches, priests,
    and alms-men for the souls of enemies who will fall, asserting that his own fallen
    followers will be saved with him. At dawn after a night of prayer, Thormod sings
    the old Bjarkamal to awaken and encourage the troops; Olaf rewards him with a
    gold ring, and Thormod vows loyalty in life and death.
  language: English
  quote_policy: summarized
