canonical_text:
  quote: ''
  summary: The passage recounts Swedish succession after Steinkel, King Magnus's claim
    to lands west of the Vener lake, his raid and fortification at Kvaldinsey, King
    Inge's siege and expulsion of the Northmen there, and a later campaign in which
    the foreign knight Giparde is absent from battle and mocked both after the fight
    and during a stormy voyage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Steinkel dies; Hakon follows him in Svithjod; afterward Inge, son of Steinkel,
    becomes king and is described as good, powerful, strong, and stout.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Magnus says earlier boundaries made the Gaut river and then the Vener
    lake up to Vermaland divide Swedish and Norwegian royal territories, and he claims
    ownership west of the Vener lake up to Vermaland.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The contested districts had long been under Swedish dominion, were joined
    for scat to West Gautland, and the forest-settlers preferred the Swedish king.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Magnus rides from Viken into Gautland with an army, plunders and burns around
    the forest-settlements, and the people submit and swear fidelity to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At Kvaldinsey in the Vener lake, Magnus makes a stronghold of turf and wood,
    digs a ditch around it, provisions it, and leaves 300 chosen men under Fin Skoptason
    and Sigurd Ulstreng.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: When the ice forms on the Vener lake, King Inge rides with nearly 300 men
    and twice sends terms to the Northmen in the burgh; the Northmen refuse the later
    terms requiring them to leave their booty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Inge assaults the burgh; both sides shoot, the ditch is filled with timber
    and stones, anchors and spars are used to break timber walls, and lighted brands
    are thrown in.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Northmen ask for quarter, leave without weapons or cloaks, each receives
    a stroke with a whip, and the forest-men submit again to King Inge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: A foreigner named Giparde comes to Magnus, presents himself as a good knight,
    offers service, and is received well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Magnus prepares another Gautland campaign because of his claims and a previous
    disgrace; he rejects advice to turn back and attacks King Inge unexpectedly at
    night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: When Magnus draws up his men for battle at Foxerne, he asks where Giparde
    is, but Giparde is not found; verses by Magnus and a skald say the foreign knight
    hid or rode away from the fight.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: After a great slaughter at Foxerne, the field is covered with slain Swedes,
    Inge escapes by flight, and Magnus gains victory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Giparde later appears from the countryside, is criticized for not joining
    the fight, travels westward to England, lies in bed during a stormy voyage, and
    is rebuked by Eldjarn while water is being bailed from the ship.
  category: sequence
  evidence_refs:
  - ev:4
