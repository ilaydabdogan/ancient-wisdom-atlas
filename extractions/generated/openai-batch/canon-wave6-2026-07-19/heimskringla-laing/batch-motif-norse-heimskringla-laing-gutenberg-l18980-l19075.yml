  text: Thorgils Halmason and his son Grim have King Olaf's body and fear that enemies
    or bondes may burn it, sink it, or otherwise ill-treat it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thorgils and Grim have seen a clear light burning at night over the battlefield
