canonical_text:
  quote: ''
  summary: The passage recounts how Thorgils Halmason and his son Grim hide and secretly
    bury King Olaf's body after seeing a night light over it and fearing enemies will
    burn or sink it. They use a decoy coffin that Bishop Sigurd's men sink in the
    sea. The passage then describes Svein Alfifason's appointment by King Canute,
    his acceptance as king in Norway, and the severe laws and taxes he introduces,
    partly modeled on Danish laws.
  language: English
  quote_policy: summarized
