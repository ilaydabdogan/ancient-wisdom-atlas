  quote: ''
  summary: 'A battle passage aboard King Olaf''s Long Serpent: armed men leap overboard;
    Einar shoots at Earl Eirik until Fin splits his bow; Einar interprets the broken
    bow as Norway leaving the king''s hands; Olaf arms his men with sharp swords while
    bleeding from an unknown wound; Eirik boards twice, and the remaining defenders
    gather around the king behind shields.'
