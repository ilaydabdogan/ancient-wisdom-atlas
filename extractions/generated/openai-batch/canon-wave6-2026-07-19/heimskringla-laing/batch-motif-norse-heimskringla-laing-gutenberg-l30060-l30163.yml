  summary: The passage recounts King Hakon's spring movement with ships, plundering
    in More, retaliatory fighting by Jon Halkelsson, executions and captivity after
    Hakon meets ships from King Inge's fleet, and King Inge's subsequent pursuit.
    Inge scouts Hakon's river position, convenes a House-thing, hears Gregorius urge
    immediate battle and vengeance, hears Erling Skakke warn against fighting upstream,
    and finally accepts Erling's tactical plan while deciding to attack that day.
