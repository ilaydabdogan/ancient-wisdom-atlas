canonical_text:
  quote: ''
  summary: Thorod and his companion evade pursuit, wander in a forest, and are hosted
    in a hut by Thorer and his wife. The wife's brother Arnliot Gelline, known as
    a robber and malefactor, appears, later wakes the travelers, gives them skis,
    and carries them swiftly. At a travelers' lodge he warns them not to discard food
    scraps, keeps them quiet in a loft, and is present when twelve merchants arrive,
    feast, discard bones, and sleep. A huge witch enters, gathers and eats the food
    remains, kills the merchants except one survivor, and begins eating the bodies
    by the fire. Arnliot saves the survivor, strikes the witch with his gold-mounted
    halberd, and she flees with it. In the morning Arnliot parts from Thorod, says
    he will seek his halberd, and sends King Olaf a salutation and a silver plate,
    which Thorod delivers in Nidaros.
  language: English
  quote_policy: summarized
