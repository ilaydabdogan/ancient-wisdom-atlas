canonical_text:
  quote: ''
  summary: King Olaf sails north with ships and men, is accepted as king at Things,
    has Christian law read, threatens penalties for refusal, and secures conversions
    and alliances among northern elites. Later, after winter at Nidaros amid corn
    scarcity, he hears reports that Throndhjem bondes held a feast with cups to the
    old gods, animal sacrifice, blood-sprinkled altars, and prayers for good seasons.
    Olaf summons named bondes; Olver of Eggja speaks for them, denies cultic wrongdoing,
    and the king demands proof of right faith.
  language: English
  quote_policy: summarized
