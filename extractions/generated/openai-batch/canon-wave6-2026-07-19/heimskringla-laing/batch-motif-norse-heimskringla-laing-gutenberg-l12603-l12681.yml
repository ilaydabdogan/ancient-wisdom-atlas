  text: Olaf threatens loss of life, limbs, and property against anyone not submitting
    to Christian law, and inflicts severe punishments on many people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men of power and great bondes make feasts for Olaf; Harek of Thjotta hosts
    a splendid feast and is made lenderman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Grankel hosts Olaf at a magnificent feast, gives gifts and tokens of friendship,
    and Asmund Grankelson becomes Olaf's man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olaf remains in Halogaland for much of the summer, goes to Things, baptizes
