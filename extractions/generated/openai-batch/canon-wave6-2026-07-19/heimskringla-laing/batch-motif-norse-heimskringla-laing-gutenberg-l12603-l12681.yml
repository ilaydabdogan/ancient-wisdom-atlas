  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: News reaches Olaf that bondes held a large feast on the first winter-day's
    eve, with many attendees and much drinking, and that remembrance-cups to the Asas
    or old gods were blessed in old heathen forms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The report says cattle and horses were slain, altars were sprinkled with their
