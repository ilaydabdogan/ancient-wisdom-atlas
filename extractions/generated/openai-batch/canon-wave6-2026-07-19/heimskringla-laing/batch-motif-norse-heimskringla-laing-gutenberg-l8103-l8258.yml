canonical_text:
  quote: ''
  summary: King Olaf uses covered ships to attack London Bridge, pulls at its piles
    with cables until it collapses, and helps bring the Thames, Southwark, and the
    tower under control for King Ethelred. Skaldic verses praise Olaf's victory and
    support for Ethelred. The passage then recounts Olaf's seventh, eighth, and ninth
    battles at Hringmara Heath, Canterbury, and Nyjamoda, followed by tribute-taking
    and plundering in England.
  language: English
  quote_policy: summarized
