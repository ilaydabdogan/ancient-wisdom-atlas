canonical_text:
  quote: All the people of the Thing accordingly were baptized before the Thing was
    dissolved.
  summary: King Olaf convenes Things to press acceptance of Christianity. At one assembly,
    chosen opponents fail to speak and the people are baptized. At another, Olmod
    the Old negotiates support for baptism through Astrid's marriage to Erling Skjalgson.
    Olaf signals displeasure to Astrid by sending her plucked falcon, secures her
    consent, arranges the marriage, gains local support for Christianity, and later
    grants Erling high status and lands.
  language: English
  quote_policy: quoted
