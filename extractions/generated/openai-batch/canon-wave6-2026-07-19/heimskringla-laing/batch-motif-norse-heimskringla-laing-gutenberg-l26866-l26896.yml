  summary: Sigurd Hranason, a relative and former trusted collector for King Sigurd,
    is accused through slander of taking too much tribute. King Sigurd becomes angry,
    confronts him, and later seeks to have him outlawed at the Thing in Bergen. Sigurd
    Hranason appeals to King Eystein, who is reluctant to oppose his brother but agrees
    to speak for him because of his distress and their relationship.
