canonical_text:
  quote: God will dispose of my life, and of how long it shall be; but I shall never
    betake myself to flight.
  summary: King Inge is warned that King Hakon is approaching. Inge musters troops
    and refuses advice to stay out of battle. A report says a witch was employed to
    obtain victory for Hakon and advised fighting Inge by night. Hakon’s army approaches
    over the ice. Inge arrays his forces, but Gudrod flees with many men and Jon defects
    to Hakon. Inge again refuses to flee, invoking his kingship, past battles, fate,
    and God’s disposal of his life. In the battle near daybreak, Inge falls at his
    banner. Orm continues fighting and later flees. Other leaders fall, Kristin cares
    for Inge’s body at Halvard’s church, and Hakon’s men take the wedding provisions
    and booty.
  language: English
  quote_policy: quoted
