canonical_text:
  quote: ''
  summary: At a Thing, the Swedish king accepts the will of the bondes, and a truce
    and reconciliation are concluded; Ingegerd is to marry Olaf Haraldson, and she
    sends him an embroidered cloak. In the following episode, Olaf prepares for the
    wedding while keeping the blind King Hrorek at court. Hrorek persuades his kinsman
    Svein to attempt an assassination, but Svein loses his nerve before Olaf, submits,
    and is spared; Hrorek is then watched more closely.
  language: English
  quote_policy: summarized
