canonical_text:
  quote: ''
  summary: The passage recounts a holy cross causing terror and intense heat aboard
    a king's ship, Priest Andres explaining this as divine anger and carrying the
    cross away safely through storm, and the later enslavement and diminished fortunes
    of people from Konungahella. It then describes Magnus the Blind entering a cloister,
    Harald Gille ruling and being praised for battles, and Harald's generous gifts
    to Bishop Magnus Einarson, whose goblet is made into a chalice and whose cushion
    cloth becomes church garments.
  language: English
  quote_policy: summarized
