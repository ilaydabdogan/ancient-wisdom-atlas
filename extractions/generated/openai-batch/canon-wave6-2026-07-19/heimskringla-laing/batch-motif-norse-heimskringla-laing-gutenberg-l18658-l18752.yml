canonical_text:
  quote: ''
  summary: After Dag Hringson's fierce assault and retreat, Thorer Hund tends the
    fallen King Olaf's body and experiences a wound-healing miracle from Olaf's blood,
    later testifying to Olaf's sanctity. Other aftermath scenes include Kalf Arnason
    finding his wounded brothers, the dispersal of the bonde army, a limited pursuit
    through Veradal, and the secret healing and departure of the wounded Harald Sigurdson.
  language: English
  quote_policy: summarized
