  text: Kalf Arnason, Harek of Thjotta, and Thorer Hund turned against Dag with their
    following; Dag was overwhelmed and fled with his remaining men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fugitives passed through a valley where wounded and exhausted men lay scattered
