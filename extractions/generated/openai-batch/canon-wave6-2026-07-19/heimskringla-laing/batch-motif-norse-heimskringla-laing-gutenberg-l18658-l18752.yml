- id: obs:1
  text: Dag Hringson continued the battle with a fierce assault that drove some bondes
    back and put some to flight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many bondes fell, including Erlend of Gerde and Aslak of Finey, and the banner
    under which they had stood was cut down.
  category: sequence
  evidence_refs:
  - ev:1
