  text: When the Northmen raise a war-cry and strike their shields, the Gautland army
    also shouts, and Thorvid’s horse shies so hard that the stake strikes Thorvid
    on the head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The earl’s banner advances, the king’s army rushes down from the hill, kills
    some of the earl’s people, and the rest flee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Northmen take Earl Hakon’s banner along with arms and clothes, and King
    Harald has both banners carried before him as they march away.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rider gallops across a forest path, spears the man carrying the earl’s banner,
