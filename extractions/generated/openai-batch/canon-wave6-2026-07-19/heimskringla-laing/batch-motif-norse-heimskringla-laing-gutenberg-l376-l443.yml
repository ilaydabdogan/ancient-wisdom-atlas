  quote: ''
  summary: The passage reports Harald's birth, naming with water, qualities, and differing
    parental affection; an editorial endnote describes compensation law; then a Yule
    feast at King Halfdan's loses its food and drink, a knowing Fin is tortured and
    freed by Harald, and a chief later repays the taking of provisions with news of
    Halfdan's death and Harald's future rule. The passage ends with Halfdan's death
    through broken thawing ice and the division of his body among districts for burial
    mounds because people expect good crops from possessing it.
