canonical_text:
  quote: ''
  summary: 'King Harald''s counsellors judge that Magnus is to be deposed; Magnus
    and his supporters are violently disabled or killed. Harald investigates hidden
    treasure and a holy cross associated with Magnus; Bishop Reinald denies knowledge,
    is fined, refuses to pay, and is hanged. The passage then reports repeated frightening
    occurrences in Konungahella: noises like a royal procession, mad dogs biting people
    and cattle, madness among the bitten, premature labor among pregnant women, public
    alarm, and interpretation of these events as omens of future events. Priest Andres
    urges the townspeople not to desert the town and to prepare against dangers while
    praying for mercy.'
  language: English
  quote_policy: summarized
