canonical_text:
  quote: ''
  summary: The passage narrates King Olaf advising King Onund to keep their remaining
    elite forces together and wait out King Canute. Both sides use spies. Canute returns
    with his fleet, visits Earl Ulf at Roeskilde, quarrels with him over a chess game,
    and later orders his death. Ivar White kills Ulf inside Saint Lucius' church.
    Canute then orders the church reopened for high mass and grants it property. Olaf
    and Onund later debate whether to remain; the Swedes depart because of approaching
    frost, while Olaf stays behind.
  language: English
  quote_policy: summarized
