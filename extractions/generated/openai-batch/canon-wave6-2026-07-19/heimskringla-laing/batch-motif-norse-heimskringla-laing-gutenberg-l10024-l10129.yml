canonical_text:
  quote: ''
  summary: A Norwegian king gives Bjorn peace terms to carry to the Swedish king,
    sends recognizable gifts as tokens for Earl Ragnvald, and wishes Hjalte royal
    luck for the journey. Bjorn and his companions reach Ragnvald's court, where Ingebjorg
    recognizes Hjalte. Bjorn presents the mission and tokens; Ragnvald warns that
    the message may provoke Swedish royal wrath, Bjorn vows to deliver it unless prevented
    by death or bondage, and Ingebjorg urges Ragnvald to support the mission. Ragnvald
    agrees to support it under his own counsel, and later Hjalte proposes a possible
    way to approach the Swedish king through Icelandic acquaintances at court.
  language: English
  quote_policy: summarized
