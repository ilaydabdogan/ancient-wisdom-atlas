canonical_text:
  quote: '"A MIRACLE ON A BLIND MAN."'
  summary: The passage recounts King Olaf's fall in battle, the treatment and concealment
    of his body, a blind poor man regaining sight after touching wet hands to his
    eyes in the hut where the body had been hidden, and Thorer Hund's later search
    amid rumors that Olaf had escaped and might return.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: King Olaf fell on Wednesday, July 29, A.D. 1030; the armies met near midday,
    the battle began before half-past one, and the king fell before three while darkness
    lasted from about half-past one to three.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sigvat the skald's verses describe the king as struck down by his own people
    and say his shield was split in two.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the battle, many opposing bondes felt dread but resolved that those
    who had fallen with the king should not receive the burial belonging to good men;
    people with power and kin among the dead removed remains to churches for burial.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thorgils Halmason and his son Grim went to the battlefield at dusk, took up
    King Olaf's corpse, carried it to an empty houseman's hut, removed its clothes,
    wrapped it in linen, laid it in the house, and concealed it under firewood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A poor blind man led by a boy sought lodging after the battle and entered
    the same low-doored empty house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the hut, the blind man felt moisture on the floor, raised his wet hand
    to his hat, touched his fingers to his eyes, felt itching in his eyelids, wiped
    water from his eyes, and left the hut saying it was too wet to lie there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the blind man came out of the hut, he could distinguish his hands and
    nearby things in the dimness, then told people at the farmhouse that he had regained
    his sight, though many knew he had long been blind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After hearing the report, people wondered what had produced the event; Thorgils
    and Grim thought they knew and, fearing the king's enemies might search the hut,
    moved the body to a garden and concealed it there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On the fifth day, Thorer Hund came to Stiklestad with chiefs and bondes while
    the battlefield was still being cleared, bodies were being carried away, and wounded
    men were being helped.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Thorer Hund searched where the king had fallen but did not find the body;
    he asked Thorgils, who answered that reports said King Olaf had been seen at Staf
    in the night with a troop, or that Thorer's men must have hidden him if he had
    fallen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Although Thorer Hund knew that the king had fallen, many believed and spread
    the report that the king had escaped the battle and would soon return with an
    army.
  category: speech
  evidence_refs:
  - ev:10
