canonical_text:
  quote: ''
  summary: Fin the Little is described as a swift, trusted man of King Hrorek who
    moves among the guards while Hrorek is being watched. At Tunsberg, Fin gives Hrorek
    strong herbal mead, after which Hrorek makes the household drunk and asleep. In
    the dark yard, two court-men are lured out and killed; Hrorek's men take him to
    a waiting boat and row away. Sigvat and others discover blood, corpses, and a
    cut tree stump used in the stratagem. Sigvat has the church bell tolled to wake
    King Olaf, and Thord reports Hrorek's flight and the killings.
  language: English
  quote_policy: summarized
