canonical_text:
  quote: ''
  summary: 'The passage recounts Olaf Haraldson’s early naval fighting and raiding:
    a victory against Sote’s vikings at Sotasker, a ravaging expedition into Svithjod
    and escape from a Swedish blockade by cutting a canal, acceptance of tribute from
    Gotland, and a later victory in Eysyssel after local men present armed resistance
    instead of tribute.'
  language: English
  quote_policy: summarized
