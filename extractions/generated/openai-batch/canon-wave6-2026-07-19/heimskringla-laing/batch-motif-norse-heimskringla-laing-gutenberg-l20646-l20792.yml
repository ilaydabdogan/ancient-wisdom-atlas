  quote: ''
  summary: The passage narrates a naval battle between King Magnus and Svein. Magnus
    moves from a shield-rampart to the ship's bows, leads an assault, boards Svein's
    ship, clears enemy ships, grants quarters to some defeated men, captures seven
    vessels, and pursues Svein after his flight. The aftermath includes drowning,
    storm, cattle booty, and the burning and ravaging of Seeland.
