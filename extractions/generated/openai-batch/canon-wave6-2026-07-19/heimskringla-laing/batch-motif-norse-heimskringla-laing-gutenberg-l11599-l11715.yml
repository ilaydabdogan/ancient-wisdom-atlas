canonical_text:
  quote: King Olaf and Queen Astrid's wedding was drunk in great festivity.
  summary: Sigvat reports Earl Ragnvald's friendship and counsel for peace to King
    Olaf of Norway. Secret messengers carry tokens to Ragnvald, who travels with Astrid
    and a retinue to Sarpsborg. Olaf receives them with a feast, and Ragnvald contracts
    Astrid to Olaf with dowry and bride-gift terms. Later, ambassadors from King Jarisleif
    negotiate for Ingegerd; she accepts on conditions including Ladoga as bride-gift
    and Earl Ragnvald as her chosen attendant.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sigvat's reported speech says the earl found the people's mind incensed by
    Eirik's son, who refused the desired meeting on grounds of treachery and deceit;
    Sigvat argued that the earl and king should keep strict peace and cease force
    and foray.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Olaf of Norway is described as cast down on hearing of King Jarisleif's
    suit and says he expects evil from the Swedish King Olaf, but hopes to return
    it memorably.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sigvat praises Astrid, daughter of the Swedish king, for beauty and conversation,
    and says she is not behind her sister Ingegerd; King Olaf listens with pleasure
    and is delighted by Sigvat's account of his conversation with Astrid.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Olaf of Norway privately says that the Swedish king will scarcely think
    he would dare marry one of his daughters without consent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sigvat says Earl Ragnvald is King Olaf's best friend and sings that Ragnvald
    takes Olaf's part at Things and is his firm friend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thord Skotakol and a footboy secretly leave King Olaf's court, travel to Gautland,
    and present tokens from Olaf to Earl Ragnvald so that the earl may trust Thord.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Earl Ragnvald and Astrid prepare without delay; Ragnvald takes 120 carefully
    equipped men from courtmen and sons of great bondes, and they ride north to Sarpsborg
    at Candlemas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: King Olaf prepares high-quality liquors, other feast provisions, summons important
    people, receives the earl well, and lodges him in a large, furnished house with
    attendants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After several days of entertainment, King Olaf, Earl Ragnvald, and Astrid
    confer; Ragnvald contracts Astrid to Olaf with the same dowry formerly settled
    for Ingegerd, and Olaf gives Astrid the same intended bride-gift.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An addition is made to the feast, Olaf and Astrid's wedding is celebrated,
    and Olaf gives Ragnvald many great and good gifts at parting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Olaf and Ragnvald part as the dearest of friends and
    continue so while they live.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ambassadors from King Jarisleif come to Svithjod to treat further about the
    previous promise that Ingegerd should marry Jarisleif.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ingegerd says that if she marries Jarisleif she must have the town and earldom
    of Ladoga as bride-gift, and the Russian ambassadors agree on behalf of their
    sovereign.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ingegerd says that if she goes east to Russia she must choose an attendant
    from Svithjod and that he must retain no less title, dignity, privilege, and consideration
    there than at home; the king and ambassadors confirm the condition by giving their
    hands.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: When asked whom she will take as attendant, Ingegerd names her relation Earl
    Ragnvald.
  category: speech
  evidence_refs:
  - ev:8
