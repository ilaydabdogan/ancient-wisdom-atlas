canonical_text:
  quote: ''
  summary: The passage recounts King Inge's assault on King Sigurd in Sigrid Saeta's
    house, Sigurd's failed attempt to seek mercy from his brother, and Sigurd's death
    and burial. It then describes King Eystein's arrival, uneasy reconciliation attempts,
    Gregorius Dagson's flight and assistance from Kristin, subsequent burnings attributed
    to Eystein and Philip, and a forced settlement involving gold compensation, outlawry,
    and continuing hostility between Inge and Eystein.
