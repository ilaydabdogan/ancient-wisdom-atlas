canonical_text:
  quote: ''
  summary: At King Svein's succession and funeral feast, ritual drinking leads Svein
    and several Jomsborg leaders to make solemn war vows. The next day the Jomsborg
    vikings prepare the vowed expedition. Earl Eirik and Earl Hakon mobilize Norway
    with war-arrows and messages. The Jomsborg fleet sails north, plundering and burning,
    and the wounded Geirmund warns Hakon by showing his severed hand as proof that
    the enemy has arrived.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Svein held a magnificent succession-feast or heirship-ale after his father
    Harald and invited chiefs from his dominions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Strutharald in Skane and Vesete in Bornholm had recently died, and the Jomsborg
    leaders were invited to drink funeral-ale for their fathers at the same feast.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Jomsborg vikings came to the feast with their bravest men, including forty
    ships from Vindland and twenty ships from Skane.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before going into his father's high-seat, King Svein drank a bowl to his father's
    memory and vowed within three winters to invade England and either kill or expel
    King Adalrad.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The feast included an heirship bowl, a largest horn of strong drink for the
    Jomsborg chiefs, a drink to Christ's health, and a third bowl to Saint Michael's
    memory.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Earl Sigvalde drank a remembrance bowl for his father and vowed within three
    winters to go to Norway and either kill or expel Earl Hakon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thorkel the Tall, Bue the Thick, and Vagn Akason each made vows connected
    with joining or continuing the Norway expedition; Vagn also vowed to kill Thorkel
    Leira and go to bed with Ingebjorg without her friends' consent.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After sleeping off the drink, the Jomsborg vikings thought they had said too
    much, held a meeting, and resolved to equip the expedition quickly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Earl Eirik heard the tidings, gathered troops, crossed to Throndhjem, and
    joined his father Earl Hakon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hakon and Eirik split and sent war-arrows and also sent messages to several
    districts, summoning men and ships.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Jomsborg vikings assembled sixty ships at Limafjord, sailed to sea, and
    then plundered and burned northward along the coast after reaching the earl's
    territory.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Geirmund sailed north in a light boat with a few men and reached Earl Hakon
    at his dinner table to report the Danish army's arrival.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When asked for certainty, Geirmund stretched out an arm whose hand was cut
    off and called it the token that the enemy was in the land.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: After Geirmund's warning, Hakon rode through fjords collecting men night and
    day, sent spies, and moved north to meet Eirik, while Eirik hastened south with
    his forces.
  category: sequence
  evidence_refs:
  - ev:10
