candidate_motifs:
- id: motif:1
  label: dangerous royal kinsman restrained and then destroyed by a royal officer
  taxonomy_refs: []
  basis: Asmund is Svein's sister's son and foster-son, becomes a violent raider,
    is unsuccessfully contained by fief, court, and irons, and is finally killed by
    Hakon, the land-defense officer.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage presents this as saga history and politics rather than an
    explicitly mythic episode.
- id: motif:2
  label: severed head presented to a ruler as proof or challenge
  taxonomy_refs: []
  basis: Hakon cuts off Asmund's head and places it on King Svein's dinner table,
    asking whether the king recognizes it.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not state Hakon's intent beyond presenting the head and
    asking if the king knows it.
- id: motif:3
  label: kinship obligation overriding royal service
  taxonomy_refs: []
  basis: Svein dismisses Hakon after Asmund's death and says he cannot watch over
    all relations; the endnote interprets the incident as showing kinship ties and
    the honor of avenging injuries.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The explicit formulation of clanship spirit comes from the edition's endnote,
    not from direct saga narration.
- id: motif:4
  label: reconciliation through royal marriage, office, and oath
  taxonomy_refs:
  - royal_legitimacy
  basis: Hakon's reconciliation with King Harald is settled by giving him the king's
    daughter, an earldom with Earl Orm's former power, and requiring an oath of fidelity.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage supports a political legitimation pattern; it does not frame
    the marriage as sacred or divine.
- id: motif:5
  label: restoration of a former enemy through negotiated peace and service
  taxonomy_refs:
  - royal_legitimacy
  basis: Fin mediates Kalf's return; Kalf receives safety, estates, and fiefs after
    binding himself to serve King Harald's realm.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not specify whether Harald fully trusts Kalf after the
    reconciliation.
- id: motif:6
  label: fatal vanguard assignment with promised support
  taxonomy_refs: []
  basis: Harald orders Kalf to make the first attack and promises support, but Kalf
    is quickly overpowered and killed before Harald's later landing.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly say the assignment was intended as betrayal
    or death; such motives should not be inferred from this passage alone.
- id: motif:7
  label: war leader's ravaging victory in blood, fire, and smoke
  taxonomy_refs: []
  basis: After Kalf's death, Harald kills and destroys in the country, and Arnor's
    verse describes the king's sword stained with blood amid fire and smoke.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The verse is a poetic battle description; broader mythic associations
    with fire are not stated.
