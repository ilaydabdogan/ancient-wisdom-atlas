canonical_text:
  quote: ''
  summary: The passage recounts Asmund, a violent kinsman and foster-son of King Svein,
    repeatedly escaping royal restraint and plundering until Hakon Ivarson kills him
    and brings his head to the king, provoking Svein's anger because of kinship ties.
    It then describes Hakon's reconciliation with King Harald through marriage to
    Ragnhild, grant of an earldom, and oath of fidelity. Kalf Arnason is likewise
    reconciled to Harald through Fin Arnason's mediation, receives peace and fiefs,
    and later dies after being ordered to lead the first attack in Harald's expedition
    at Fyen; Harald then ravages the country, as summarized in a cited verse by Arnor.
  language: English
  quote_policy: summarized
