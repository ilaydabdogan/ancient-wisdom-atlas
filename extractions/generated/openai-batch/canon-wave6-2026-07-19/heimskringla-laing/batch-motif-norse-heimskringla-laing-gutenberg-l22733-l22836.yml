- id: claim:2
  claim: 'Hakon''s settlement with King Harald functions like a royal-legitimacy reconciliation
    pattern: a powerful man is bound to the king through marriage alliance, territorial
    office, and oath.'
  claim_level: same_function
  target: royal_legitimacy motif family
  evidence_refs:
