    as an example of a broader clanship-spirit pattern in which kinship ties and honor-bound
    vengeance affect political judgment.
  claim_level: same_function
  target: kinship vengeance / clanship-spirit pattern
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is supported by the edition's endnote and the king's reaction,
    but it is not an intertextual comparison and does not establish historical diffusion
