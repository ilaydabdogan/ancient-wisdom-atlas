- id: obs:3
  text: A marriage was arranged between King Eirik's daughter Ragnhild and Arnfin,
    son of Thorfin Hausakljufer; after Eirik's sons departed, Thorfin regained the
    Orkney earldom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Harald received Gunhild and Eirik's sons well, gave them large fiefs,
