canonical_text:
  quote: ''
  summary: The passage recounts Danish hostility toward King Hakon and Danish support
    for Gunhild and Eirik's sons, including fosterage and fiefs; describes Eirik's
    sons raiding and fighting King Trygve; presents King Hakon as a peace-bringing
    law-giver; narrates the Yule birth and water-naming of the future Earl Hakon;
    and tells how King Eystein oppressed the Throndhjem people by making them choose
    a slave or an enchanted dog, Saur, as king, after which Saur received royal treatment
    and was later killed by wolves.
  language: English
  quote_policy: summarized
