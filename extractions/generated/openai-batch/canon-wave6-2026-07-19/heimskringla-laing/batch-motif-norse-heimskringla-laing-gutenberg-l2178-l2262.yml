candidate_motifs:
- id: motif:1
  label: Royal fosterage as political incorporation
  taxonomy_refs:
  - royal_legitimacy
  basis: The Danish king grants fiefs to Gunhild and Eirik's sons and ritually takes
    Harald Eirikson as foster-son by setting him on his knee and raising him at court.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the act politically and socially; it does not explicitly
    explain the ritual meaning of knee-setting.
- id: motif:2
  label: Peace-bringing king as law-giver
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: King Hakon's rule is marked by peace, protection of life and goods, good
    seasons, and the issuing of regional laws on wise counsel.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not attribute the good seasons to supernatural causation.
- id: motif:3
  label: Water-naming of future ruler at festival birth
  taxonomy_refs:
  - water
  - royal_legitimacy
  - sacred_birth
  basis: At Yule, Bergljot bears a boy; King Hakon pours water over him, gives him
    his own name, and the child later becomes a mighty earl.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage marks the birth, naming, and later greatness, but does not
    state divine parentage or miraculous birth; the sacred_birth taxonomy is therefore
    tentative.
- id: motif:4
  label: Animal enthroned as king
  taxonomy_refs:
  - royal_legitimacy
  basis: Eystein's dog Saur is chosen as king, given a royal collar and chain, carried
    by courtiers, and seated on a throne in a high place as kings sit.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The animal kingship is imposed within an episode of humiliation and oppression
    rather than presented as a normative legitimate kingship.
- id: motif:5
  label: Enchanted animal with human-like wisdom and partial speech
  taxonomy_refs:
  - wisdom
  basis: Saur is said to be gifted by witchcraft with three men's wisdom and to speak
    one word while barking two.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No transformation of shape is described, only magical endowment of wisdom
    and speech.
- id: motif:6
  label: Degrading choice imposed on conquered people
  taxonomy_refs: []
  basis: After conquering Throndhjem, Eystein offers the people either his slave or
    his dog as king, and they choose the dog as the option they expect to remove sooner.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No available taxonomy reference directly matches this political-humiliation
    pattern.
- id: motif:7
  label: Animal ruler killed defending cattle
  taxonomy_refs: []
  basis: Saur is urged by his courtiers to defend his cattle from wolves and is torn
    to pieces after attacking them.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The episode is brief and may function as the end of the imposed dog-king
    narrative rather than an independent motif.
