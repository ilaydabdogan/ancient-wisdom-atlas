canonical_text:
  quote: ''
  summary: The passage recounts Eirik Haraldsson’s favored status, early sea expeditions,
    encounter with Gunhild in Finmark, her account of learning sorcery from two dangerous
    Fins, her deception and killing of them with the aid of Eirik’s men, and her subsequent
    marriage to Eirik. It then describes King Harald’s division of Norway among his
    sons, rules for royal and earlish succession, Eirik’s designated precedence, and
    renewed conflicts and raids among Harald’s sons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eirik, Harald’s son, is fostered by Thorer and is described as the son most
    beloved and honoured by King Harald.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Eirik is twelve, Harald gives him five long-ships, and Eirik undertakes
    several years of expeditions and raiding across the Baltic, Denmark, Friesland,
    Saxland, the West sea regions, Finmark, and Bjarmaland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eirik’s men find Gunhild in a Lapland hut; she says she is there to learn
    sorcery from two very knowledgeable Fins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gunhild says the two Fins both want to marry her and describes them as exceptional
    trackers, swift skiers, accurate shooters, and deadly when angry or when they
    look upon living beings.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gunhild warns the men not to meet the Fins openly, hides them in the hut,
    and asks them to try to get the Fins killed.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Gunhild scatters material from a leather bag both outside and inside the hut;
    when the Fins return, they say they followed tracks to the hut but can find none
    afterward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gunhild has the two Fins lie down beside her, causes or permits them to sleep
    deeply, places their heads in seal-skin bags, and signals the king’s men, who
    kill them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A severe thunder-storm prevents movement that night; the next morning the
    men bring Gunhild to the ship and present her to Eirik.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Eirik sends for Gunhild’s father, Ozur Tote, asks to marry Gunhild, receives
    consent, and takes Gunhild south with him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Harald convenes a Thing, grants all his sons the title of king, and establishes
    that male-line descendants receive kingly title while female-line descendants
    receive the title of earl.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Harald divides territories, revenues, and high-seat rank among his sons, while
    reserving his own king’s seat after his death for Eirik.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Different regional groups prefer different successors; quarrels arise among
    the brothers, who then conduct piratical expeditions, including western raids
    and the taking of Dublin by Frode and Thorgils.
  category: sequence
  evidence_refs:
  - ev:9
