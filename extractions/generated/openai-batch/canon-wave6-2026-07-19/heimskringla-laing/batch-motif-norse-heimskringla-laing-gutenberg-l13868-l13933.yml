canonical_text:
  quote: ''
  summary: At an Icelandic assembly, Einar warns against granting King Olaf any land,
    tax, or service that could become a lasting royal claim over Iceland. He distinguishes
    voluntary gifts from obligations and points to Grimsey Isle as a possible military
    base. The community rejects the proposal. Thorarin later delivers King Olaf's
    invitation for several chiefs to visit him; after debate, the chiefs decide not
    to go themselves but to send representatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people go to their tent-houses, and the Northland people hold a meeting
    where Gudmund supports the matter and others ask why Einar has not spoken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some participants say Einar has the clearest insight into most things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Einar says that accepting the king's position would make the countrymen liable
    to land-scat and royal exactions, burdening descendants and the whole community.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Einar says the people should not give the king the smallest spot in the country
    or any scat or service that could appear to be a duty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Einar says it would be proper to send the king friendly presents such as hawks,
    horses, tents, or sails if they are repaid with friendship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Einar says Grimsey Isle produces no useful food but could support a war-force
    cruising in long-ships, bringing distress to peasants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Einar explains the matter, the whole community agrees that the proposal
    should not be permitted, and Thorarin understands the likely result of his errand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Thorarin goes to the Lawhill and delivers King Olaf's message inviting named
    Icelandic leaders to visit him as friends.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Snorre and Skapte advise against the dangerous proceeding of all the most
    influential men in Iceland leaving the country at once.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Snorre and Skapte suspect that King Olaf would use force and strong measures
    against the Icelanders if he ruled in the country.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gudmund and Thorkel Eyjolfson argue for following King Olaf's invitation and
    call it a journey of honour.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The final decision is that the chiefs will not travel themselves, but each
    will send a suitable man in his place; Thorarin later reports this result to King
    Olaf.
  category: sequence
  evidence_refs:
  - ev:8
