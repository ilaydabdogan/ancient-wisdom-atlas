canonical_text:
  quote: ''
  summary: The passage recounts Olaf Trygvason's grief after Queen Geira's death,
    his renewed raiding voyages, and his arrival in the Scilly Isles. There he tests
    a seer by sending a disguised messenger; the seer recognizes the deception, later
    prophesies Olaf's royal fame, Christian mission, mutiny, near-fatal wound, seven-day
    healing, and baptism. The predicted events occur, and Olaf and his followers are
    baptized.
