  evidence_refs:
  - ev:5
- id: obs:6
  text: Thoralde reports that almost all people in the interior of Throndhjem are
    heathen in faith, though some are baptized, and that they customarily sacrifice
    in autumn, mid-winter, and summer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Thoralde reports that people from Eyna, Sparby, Veradal, and Skaun participate;
    twelve men preside over the sacrifice-feasts; and Olver is preparing the spring
    feast at Maerin.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king assembles armed men, divides them among vessels, sails up the fjord
    with five ships and 300 men, arrives at Maerin by night, and surrounds the house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Olver and other men are taken and put to death; feast provisions and brought
    goods are seized and divided as booty, and bondes associated with the affair are
    plundered, imprisoned, or robbed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At a Thing, relatives and friends of powerful prisoners promise obedience
