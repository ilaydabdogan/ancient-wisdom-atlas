canonical_text:
  quote: ''
  summary: The king hears that people in the interior of Throndhjem have gathered
    at Maerin for a mid-winter sacrifice. Olver denies the charge, but Thoralde later
    tells the king that seasonal sacrifices to heathen gods are being practiced and
    that Olver is preparing a feast. The king rapidly sails to Maerin with armed men,
    executes Olver and others, seizes goods and provisions, compels obedience, and
    imposes Christian instruction, churches, punishments, and fines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is told that people of the interior of Throndhjem have assembled
    at Maerin for a mid-winter sacrifice with offerings for peace and a good season.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king summons selected bondes to town; Olver appears before him and denies
    that the bondes held a sacrifice, describing the gatherings instead as Yule and
    drinking feasts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king says he expects to uncover what is being concealed and warns the
    bondes not to do such things again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Easter, the king orders ships prepared and privately questions Thoralde,
    his bailiff at Haug, about the people’s principles, living, and sacrifices to
    heathen gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Thoralde says he has brought his wife, two children, and movable property
