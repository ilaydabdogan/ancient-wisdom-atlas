canonical_text:
  quote: ''
  summary: The passage recounts Rolf Ganger’s outlawry after a cattle foray in Viken,
    his mother Hild’s unsuccessful plea to King Harald, and Rolf’s later westward
    conquest and Norman genealogy. It then tells how Svase brought Harald to his hut,
    where Snaefrid gave the king mead and he immediately desired her; after lawful
    marriage, Harald neglected his kingdom. After Snaefrid died, her body seemed unchanged
    and Harald sat by it for three years until Thorleif the Wise exposed its corruption,
    had it burned, and restored Harald’s reason. The passage closes with Harald rejecting
    the sons born from Snaefrid and Gudrod Ljome seeking help from his foster-father
    Thjodolf of Hvin.
  language: English
  quote_policy: summarized
