canonical_text:
  quote: ''
  summary: The passage introduces the feud between Hakon Sigurdson and his uncle King
    Inge. Hakon, aged ten, is acclaimed king by followers of King Eystein, while Inge
    seizes the estates of Hakon's supporters and declares them banished. At Konungahella,
    Gregorius Dagson confronts Hakon's larger force, attacks by ship and pier, and
    drives Hakon's men from the town despite being heavily outnumbered. Afterward
    Inge punishes Hakon's supporters, Hakon flees, and the Throndhjem people receive
    him as king on terms tied to paternal inheritance.
  language: English
  quote_policy: summarized
