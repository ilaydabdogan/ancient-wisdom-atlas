canonical_text:
  quote: ''
  summary: King Olaf sends Karle north on royal business to Bjarmaland with money
    and a ship, in a profit-sharing arrangement. Karle and his brother Gunstein sail
    with a smaller crew, while Thorer Hund joins with a larger force. Gunstein distrusts
    Thorer, but Karle continues. In Bjarmaland the travelers trade for furs and skins.
    After they leave the Vina river, the local truce ends, and Thorer asks whether
    the crews want to go ashore for booty despite likely danger.
  language: English
  quote_policy: summarized
