  quote: ''
  summary: The passage recounts the settlement and succession of the Orkney earls
    from Harald Harfager’s time through Torf-Einar, Thorfin Hausakljufer, Sigurd the
    Thick, and Sigurd’s sons. It describes conflicts with Norwegian kings, land held
    by oath and fief, Olaf Trygvason’s capture and forced conversion of Earl Sigurd,
    a hostage arrangement, Sigurd’s death in Brian’s battle, Thorfin Sigurdson’s Scottish
    grant, and the later dispute among Thorfin, Bruse, and Einar over shares of Orkney.
  language: English
  quote_policy: summarized
