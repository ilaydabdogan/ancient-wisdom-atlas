canonical_text:
  quote: ''
  summary: King Sigurd behaves wildly at a Whitsunday feast, denounces a costly holy
    book and the queen, throws the book into the hall fire, and strikes the queen.
    Ottar Birting rescues the book, counsels reconciliation, remains fearless under
    Sigurd's sword, and is rewarded with promotion to lenderman. Later, Sigurd tells
    a dream of a black sea-borne tree that breaks apart across Norway's coast, and
    interprets it as the arrival of a man whose descendants will spread through the
    country with unequal power.
  language: English
  quote_policy: summarized
