canonical_text:
  quote: was chosen king of the whole country
  summary: King Hakon travels to Throndhjem, is chosen king at a Thing, appoints Sigurd
    of Reyr as earl, and later faces Erling Skakke's campaign. Erling attacks around
    Tunsberg using a burning merchant vessel and smoke, prompting the townspeople
    to seek mercy and Hakon's force to disperse. Hakon retreats north, while Erling
    consolidates territory in obedience to King Magnus; Hakon later prepares a levy
    against Erling.
  language: English
  quote_policy: quoted
