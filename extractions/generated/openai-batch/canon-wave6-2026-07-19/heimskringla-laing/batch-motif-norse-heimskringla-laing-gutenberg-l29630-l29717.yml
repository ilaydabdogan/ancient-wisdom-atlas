canonical_text:
  quote: ''
  summary: Einar and Andres, brothers from the Uplands, blame the English priest Richard
    after a scandalous report concerning their sister. They lure Richard away by boat,
    assault and mutilate him, and leave him near death. A poor housewife, her daughter,
    and another priest care for him. Richard prays to God and Saint Olaf; after midnight
    he sees Olaf in sleep, who touches his wounds. Richard wakes restored in tongue,
    eyes, legs, and health, with white scars on his eyelids as proof of the miracle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Uplands, Einar and Andres are identified as brothers of great family
    and property, and as brothers of King Sigurd Haraldson's mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their sister is described as very handsome and friendly with the English priest
    Richard, who is welcome in the brothers' house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An ugly report about the sister circulates publicly, and both the public and
    her brothers blame the priest.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The brothers conceal their determination, call Richard to them, and entice
    him away under the pretext of business in another district.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The brothers take a farm-servant who knows their purpose, travel by boat along
    Rands lake, land at Skiptisand, and go to a retired place.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the brothers' command, the servant strikes Richard with an axe-hammer so
    hard that he swoons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Richard asks why they are playing roughly with him; the brothers say he will
    now find the consequence of what he has done.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Richard denies the accusations and beseeches God and the holy King Olaf to
    judge between them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The attackers break Richard's leg-bones, bind his head to a board, damage
    and remove his eyes, and cut off his tongue.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Richard tries to place the eye-stones back under the eyelids and press them
    with his hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: After taking Richard to Saeheimrud, the attackers ask if he can talk; when
    he makes a noise, Einar fears his speech may return and the tongue-stump is cut
    further to the roots.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: A poor housewife and her daughter carry Richard home in their cloaks, and
    another priest binds his wounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Richard lies grievously wounded and speechless, trusts in God's grace, and
    prays in thought to God and to King Olaf the Saint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: After midnight, while sleeping, Richard thinks he sees a gallant man who promises
    compassion, pulls the tongue-stump, strokes his eyes, legs, and other wounds,
    identifies himself as Olaf from Throndhjem, and disappears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Richard wakes sound, speaks thanks to Almighty God and holy King Olaf, and
    is described as having an entire tongue, clear-sighted eyes, healed legs, and
    perfect health.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: White scars remain on Richard's eyelids as proof that his eyes had been punched
    out and as a manifestation of the king's excellence.
  category: attribute
  evidence_refs:
  - ev:6
