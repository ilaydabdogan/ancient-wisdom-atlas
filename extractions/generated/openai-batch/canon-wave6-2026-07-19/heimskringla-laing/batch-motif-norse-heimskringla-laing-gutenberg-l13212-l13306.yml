canonical_text:
  quote: ''
  summary: Asbjorn seeks corn and visits his maternal relative Erling of Sole. Because
    the king has forbidden the sale of corn, Erling arranges for his slaves to sell
    corn and malt to Asbjorn. Thorer Sel later intercepts Asbjorn's laden ship with
    armed men, rejects the explanation, removes the cargo, and exchanges Asbjorn's
    sail for an old one. After returning home, Asbjorn refuses a Yule invitation and
    becomes the object of mockery over the failed voyage.
  language: English
  quote_policy: summarized
