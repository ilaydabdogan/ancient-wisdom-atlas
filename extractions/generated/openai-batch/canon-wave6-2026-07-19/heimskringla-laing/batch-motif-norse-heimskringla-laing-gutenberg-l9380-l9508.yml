  summary: The passage recounts Earl Svein’s defeat and withdrawal, consultations
    among Svein’s and Olaf’s supporters, Olaf’s decision not to pursue immediately,
    post-battle division of booty and skaldic verse, Olaf’s acceptance as king and
    foundation work at Nidaros, and Svein’s appeal to the Swedish king for support
    in a planned reconquest.
