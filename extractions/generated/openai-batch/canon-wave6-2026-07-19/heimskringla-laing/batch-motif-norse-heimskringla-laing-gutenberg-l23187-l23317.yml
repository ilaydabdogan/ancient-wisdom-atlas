  quote: ''
  summary: The passage narrates the Battle of Nis-River between King Harald and King
    Svein. Harald opens the attack, the battle continues through the night, Earl Hakon
    repeatedly intervenes where the Norwegians are pressed, Svein's ship is boarded
    and his banner cut down, the Danish fleet flees, Fin Arnason is captured, and
    a man calling himself Vandrad comes to Earl Hakon asking for his life and is sent
    toward land with instructions for safe conveyance.
