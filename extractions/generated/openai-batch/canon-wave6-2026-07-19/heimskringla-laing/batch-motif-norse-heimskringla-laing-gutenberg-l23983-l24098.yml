  quote: ''
  summary: King Harald prepares for an overseas expedition, visits and closes King
    Olaf's shrine, gathers a large fleet, and receives or hears several ominous dreams
    involving witch-wives, carrion birds, a wolf eating corpses, and Olaf warning
    of Harald's death. Harald appoints Magnus king over Norway during his absence,
    sails west, attacks settlements including Scarborough by fire, and prepares battle-lines
    near the Humber against English earls.
  language: English
