canonical_text:
  quote: ''
  summary: A verse praises Kalf's conduct in battle and speaks of Erling's death,
    bloodshed, and treason against the king. In the prose narrative, King Olaf sails
    north, debates whether to attack Earl Hakon, learns that Vigleik has killed Aslak
    in revenge for Erling, withdraws before a larger enemy force, loses followers
    including Kalf, lands at Valdal, sets up a cross, and consults Bruse about attempting
    an allegedly impassable route over Skerfsurd.
  language: English
  quote_policy: summarized
