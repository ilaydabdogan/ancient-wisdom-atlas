canonical_text:
  quote: ''
  summary: 'The passage recounts conflicts among King Harald''s sons: Eirik is intended
    as head king; Ragnvald is burned for witchcraft; Gudrod Ljome ignores a storm
    warning and drowns; Bjorn Kaupman is killed after refusing Eirik''s demands; Halfdan
    burns Eirik''s company, after which Guthorm Sindre mediates reconciliation between
    the kings.'
  language: English
  quote_policy: summarized
