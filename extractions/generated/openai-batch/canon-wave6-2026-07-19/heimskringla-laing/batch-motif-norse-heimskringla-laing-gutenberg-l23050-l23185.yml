  summary: The passage presents skaldic verses and prose narration about King Harald's
    naval campaign against King Svein. Harald calls out ships and men, is delayed
    by storm and adverse wind, reaches the Gaut river, challenges Svein, raids Danish-held
    areas, faces Svein's larger fleet, refuses to flee, and arrays his dragon war-ship
