canonical_text:
  quote: ''
  summary: The passage introduces the reigns of Magnus Sigurdson and Harald Gille
    after King Sigurd's death. Magnus is proclaimed king by reference to a national
    oath, while Harald is chosen king at the Hauga Thing after his prior renunciation
    is described as forced. The kingdom is divided between them, but tension develops
    into armed conflict. The passage also notes dynastic marriages, Harald's family
    connections, Magnus's rejection of his wife, military mobilization, damage to
    opposing farms, and Harald's preparation for battle after watchmen report Magnus's
    larger army approaching.
