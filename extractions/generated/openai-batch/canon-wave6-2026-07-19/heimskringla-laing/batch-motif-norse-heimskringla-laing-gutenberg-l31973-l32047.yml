canonical_text:
  quote: ''
  summary: King Magnus and Orm march in snowy Re and defeat the Birkebeins after their
    formation breaks on the road. Eystein is killed after asking a farmer for concealment,
    and his corpse is brought before Magnus. A hidden wounded Birkebein attacks Magnus
    and Orm with an axe before being killed. The Birkebeins scatter, and Magnus gains
    renown as a military leader.
