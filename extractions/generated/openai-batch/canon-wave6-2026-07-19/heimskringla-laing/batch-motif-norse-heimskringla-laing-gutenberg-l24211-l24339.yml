canonical_text:
  quote: ''
  summary: The passage describes King Harald Sigurdson preparing his Northmen for
    battle by raising his banner and forming a shield-ring array against cavalry.
    King Harald Godwinson arrives with a large English army. Sigurdson falls from
    a stumbling black horse, and both kings comment on the fall. Armored horsemen
    approach the Northmen; the speaker, later identified as Godwinson, offers Earl
    Toste land and rule if he submits, while offering Sigurdson only burial-ground.
    Toste refuses to abandon Sigurdson. The passage closes with pre-battle verses,
    a description of Sigurdson's mail-coat Emma, and Thiodolf's verse about vengeance
    by the king's sons if he falls.
  language: English
  quote_policy: summarized
