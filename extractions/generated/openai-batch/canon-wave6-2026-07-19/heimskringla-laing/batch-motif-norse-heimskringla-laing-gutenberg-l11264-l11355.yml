candidate_motifs:
- id: motif:1
  label: failed or delayed royal marriage pact
  taxonomy_refs: []
  basis: The agreed marriage and meeting are not carried out; the Swedish king makes
    no preparations and later forbids the match.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage frames the marriage politically, not as a sacred or ritual
    marriage.
- id: motif:2
  label: broken word threatening peace
  taxonomy_refs: []
  basis: The Swedish king's men explicitly worry whether he will keep the agreement
    or break his word along with the country's peace.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents suspicion and concern before the final refusal, not
    a formal oath-breaking scene.
- id: motif:3
  label: royal hunt as display of kingly luck
  taxonomy_refs: []
  basis: The king's successful falcon hunt is celebrated by him and affirmed by his
    followers as exceptional luck for a king.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No supernatural cause for the hunting luck is stated.
- id: motif:4
  label: boast answered by greater royal capture
  taxonomy_refs: []
  basis: The king's boast about five hunted birds is answered by Ingegerd's claim
    that Olaf of Norway captured five kings and kingdoms in one morning.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: This is an internal rhetorical comparison, not evidence of a wider inherited
    mythic motif by itself.
- id: motif:5
  label: princess as political intermediary under paternal constraint
  taxonomy_refs: []
  basis: The Swedish king's men ask Ingegerd to learn her father's intention, but
    she fears speaking of Olaf; her father later asserts control over whom she will
    marry.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
  cautions: Ingegerd does not successfully mediate in this passage; she functions
    mainly as a pressured participant and speaker.
- id: motif:6
  label: fosterage of royal children amid stepfamily tension
  taxonomy_refs: []
  basis: The queen behaves badly toward her stepchildren, after which Emund is fostered
    by maternal kin and Astrid is raised in Egil's house.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage gives biographical background rather than a full narrative
    arc for the fostered children.
- id: motif:7
  label: captivity entering royal genealogy
  taxonomy_refs: []
  basis: Edla is described as captured in war and called a slave-girl, yet she is
    mother of named royal children.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage states Edla's status and children but does not elaborate a
    captivity narrative.
