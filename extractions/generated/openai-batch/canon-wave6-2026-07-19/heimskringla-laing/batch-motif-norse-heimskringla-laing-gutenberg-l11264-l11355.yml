canonical_text:
  quote: ''
  summary: King Olaf of Norway travels with a large equipped retinue to receive his
    betrothed Ingegerd, but the Swedish king does not come to the agreed meeting.
    The passage recounts the Swedish king Olaf Eirikson's children, fosterage arrangements,
    and conflict over the planned marriage. Ingegerd suspects her father will not
    keep his promise. After the Swedish king boasts of killing five black-cocks while
    hunting, Ingegerd compares this to Olaf of Norway taking five kings. The Swedish
    king angrily declares that Ingegerd will never marry Olaf of Norway.
  language: English
  quote_policy: summarized
