canonical_text:
  quote: ''
  summary: The passage recounts a crippled man who dreams of being told to seek Saint
    Olaf's church in London and is cured there after being guided by a man who vanishes.
    It then narrates King Harald's Danish raid, his use of an earthworm to find water,
    his night escape by drawing ships over land, his building of a dragon-prowed ship
    modeled in size on the Long Serpent, and his challenge to King Svein for both
    kingdoms.
