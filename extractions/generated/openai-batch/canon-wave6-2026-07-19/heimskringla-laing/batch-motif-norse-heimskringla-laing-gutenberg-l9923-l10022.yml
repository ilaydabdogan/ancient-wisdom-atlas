canonical_text:
  quote: ''
  summary: 'The passage narrates King Olaf Haraldson’s dealings around the Gaut river
    in A.D. 1017: Ingebjorg helps foster friendship between him and Earl Ragnvald;
    Olaf and the earl make a truce and exchange gifts; conflict with King Olaf the
    Swede continues; the bondes and leaders in Viken urge reconciliation; Bjorn the
    marshal is assigned a dangerous embassy, and Hjalte agrees to accompany him.'
  language: English
  quote_policy: summarized
