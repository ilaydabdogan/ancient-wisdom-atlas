  quote: ''
  summary: The passage recounts Astrid and young Olaf's attempted journey to Gardarike,
    their capture by Eistland vikings, Olaf's separation, enslavement, and later recognition
    and redemption by his uncle Sigurd. Olaf kills Klerkon, the man who killed his
    foster-father Thorolf, and is protected by Queen Allogia; King Valdemar then receives
    him as a king's son. The passage also narrates Earl Hakon's plotting from Denmark
    and Gold Harald's unsuccessful request that King Harald divide the Danish kingdom
    with him on grounds of royal birth and custom.
  language: English
