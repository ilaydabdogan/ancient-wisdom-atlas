canonical_text:
  quote: ''
  summary: King Valdemar of Denmark demands fulfillment of an oath-bound agreement
    to cede Viken if Magnus became sole king of Norway. Erling consults chiefs and
    then the Viken Thing, where the bondes reject Danish rule and call on Erling to
    defend Magnus's dominions. Danish agents later seek support among influential
    Throndhjem men with letters, seals, and promises. Erling hears reports of hostility,
    prepares ships, and sails north during festival traffic toward Throndhjem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Valdemar sends men with a letter reminding Magnus and Erling of Erling's
    oath-bound agreement that Viken would be ceded to Valdemar if Magnus became sole
    king of Norway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Erling lays Valdemar's demand before chiefs whose counsel he commonly uses;
    they unanimously answer that Danes should not hold any part of Norway.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Danish ambassadors press Erling for an answer, and Erling asks to defer
    his final answer until meeting influential men in Viken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Erling travels to Viken in autumn, stays in Tunsberg, sends people to Sarpsborg,
    and summons a Thing of four districts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Thing, Erling states that he will keep the agreement with the Danish
    king if the bondes consent to serve the Danish king rather than the consecrated
    and crowned king of Norway.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bondes reply that they will not become the Danish king's men while any
    Viken men remain alive.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The assembly calls on Erling to keep his oath to defend his son's dominions
    and says they would follow him to battle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Danish ambassadors return home, after which Danes abuse Erling and Northmen
    and a report spreads that the Danish king will send an army to lay waste Norway
    in spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In winter, Danish people travel through the Uplands, saying they are going
    to the holy King Olaf's festival, but in Throndhjem they seek friendship and consent
    for the Danish king from influential men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Danish messengers bring Valdemar's verbal message, letter, and seal, promising
    power and money and asking the Throndhjem people to send back letters and seals.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Most of the Throndhjem recipients receive the Danish king's message well,
    and Erling later hears reports that they are openly hostile to him and threaten
    his passage past Agdanes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Erling dismisses the reports as folly and idle talk, announces that he will
    go to the Gangdag-thing at Unarheim, and orders three vessels to be prepared.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: A strong southerly gale blows; Erling summons his people by trumpet during
    Ascension week, but they are reluctant to leave town and row against the wind.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Erling orders the mast raised and sails hoisted, and the ships sail north
    by day and night.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The ships pass Agdanes among many festival-bound vessels, so the townspeople
    do not pay attention to the long-ships.
  category: sequence
  evidence_refs:
  - ev:10
