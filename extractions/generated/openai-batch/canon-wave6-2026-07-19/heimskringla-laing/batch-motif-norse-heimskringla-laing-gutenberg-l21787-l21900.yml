canonical_text:
  quote: ''
  summary: Harald's men seek to prevent war between Harald and his kinsman Magnus
    by arranging a partition. Harald and Svein quarrel after discussing Harald's victory-bringing
    banner, and Harald evades a night attack by sleeping elsewhere and placing wood
    in his bed. Harald escapes to Magnus, where the kinsmen are reconciled. Magnus
    feasts Harald and his men, gives gifts, and grants Harald half of Norway through
    a token choice between two sticks, while reserving certain precedence rights.
  language: English
  quote_policy: summarized
