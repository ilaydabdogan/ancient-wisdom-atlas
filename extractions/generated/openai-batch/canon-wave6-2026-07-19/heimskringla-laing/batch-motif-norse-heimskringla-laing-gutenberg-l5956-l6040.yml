canonical_text:
  quote: ''
  summary: King Olaf compels several Norwegian districts to accept Christianity, destroys
    the temple at Hlader and takes its ornaments, including a gold ring. Local resistance
    is signaled by a war-arrow. Olaf sends the temple ring to Queen Sigrid during
    marriage negotiations, but her goldsmiths find it is copper inside. Olaf Haraldson
    is baptized as a child with Olaf Trygvason as godfather. At a later meeting, Sigrid
    refuses Olaf Trygvason's demand that she be baptized; Olaf insults and strikes
    her, and she warns that this may cause his death.
  language: English
  quote_policy: summarized
