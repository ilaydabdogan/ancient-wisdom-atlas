canonical_text:
  quote: ''
  summary: 'The passage relates several episodes concerning King Olaf: a widow''s
    sick son is healed after Olaf touches his neck and gives him bread marked in the
    form of a cross; Olaf later burns Sunday wood shavings on his own hand as punishment
    for breaking Sabbath observance; he decides to return from Russia to Norway after
    a dream he understands as providential; he receives aid for the journey and hears
    Norway is without a head; meanwhile Thorer Hund obtains witchcraft-protected reindeer-skin
    coats and helps gather forces against Olaf.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son of an honest widow has a sore boil on his neck, is unable to swallow
    food, and is described as dangerously ill.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The widow goes first to Queen Ingegerd, who says she knows no remedy and directs
    her to King Olaf as the best physician there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Olaf initially says he is not a physician and tells the mother to go
    to physicians.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After hearing Queen Ingegerd's request, King Olaf takes the lad and lays his
    hands on the lad's neck, feeling the boil for a long time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: King Olaf places a piece of bread in the figure of the cross on his palm,
    puts it into the boy's mouth, and the boy swallows it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After swallowing the bread, the soreness leaves the boy's neck, and in a few
    days he is well.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The healing gives Olaf a reputation for healing power in his hands, and later
    the event is counted among his miracles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a Sunday at dinner, Olaf sits in his highseat in deep thought, holding
    a knife and cutting splinters from fir wood.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A table-servant notices the Sunday wood-cutting and tells Olaf, "It is Monday,
    sire, to-morrow."
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Olaf orders a lighted candle, gathers the shavings, sets them on fire, and
    lets them burn on his naked hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage explains Olaf's burning of the shavings as showing that he would
    hold fast to God's law and commandment and not trespass without punishment.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Olaf tells King Jarisleif and Queen Ingegerd of a dream and adds that he believes
    his return to be God's will and providence.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: King Jarisleif and Queen Ingegerd try to dissuade Olaf from the expedition
    but offer him assistance when they see he is determined.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Olaf leaves Russia after Yule with about two hundred men, receives horses
    and other supplies from Jarisleif, and leaves his son Magnus behind.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Olaf's party travels first on ice, then by vessels at sea, and reaches Gotland.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At Gotland Olaf hears that Earl Hakon is missing and that Norway is without
    a head, which gives Olaf and his men hope for the journey.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Olaf sails to Svithjod, goes to Aros, sends for Swedish King Onund, and has
    a joyful meeting with Onund and Astrid.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:18
  text: Thorer Hund has spent two winters on Lapland journeys in the mountains and
    has gained wealth by trading with the Laplanders.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: Thorer has twelve large reindeer-skin coats made with Lapland witchcraft so
