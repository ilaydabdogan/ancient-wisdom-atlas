canonical_text:
  quote: ''
  summary: The passage recounts how Sigurd and Hauk compel Harek of Thjotta by boat
    to appear before King Olaf, who urges him to accept baptism and threatens future
    punishment of those rejecting Christianity. Harek is released with a boat and
    men. Harek warns Eyvind Kinrifa, who is then secretly captured by King Olaf's
    men. Eyvind refuses baptism, gifts, fiefs, threats, and torture; he is killed
    after a pan of glowing coals is placed on him, and before death says he is an
    evil spirit put into a man's body by the sorcery of Fins. The next spring Olaf
    sails north, holds assemblies, commands baptism, and Halogaland is made Christian;
    Harek is baptized and receives gifts, fiefs, and lendsman privileges.
  language: English
  quote_policy: summarized
