canonical_text:
  quote: ''
  summary: Asbjorn arms and launches a ship, sails to Karmt Island, lands at an uninhabited
    place, and goes disguised to spy at Augvaldsnes. He learns King Olaf is at a feast,
    enters the hall unnoticed, hears Thorer Sel give a false account of him, and kills
    Thorer before the king. The king has Asbjorn seized and treats the killing as
    a death-worthy offense. Skjalg Erlingson offers compensation and asks for mitigation,
    but the king refuses to break law or diminish his dignity. Skjalg then seeks delay
    and rides or rows to alert Erling, while Asbjorn remains under guard.
  language: English
  quote_policy: summarized
