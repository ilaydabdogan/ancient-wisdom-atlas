canonical_text:
  quote: ''
  summary: The passage recounts a dispute between Bruse and Thorfin over shares of
    Orkney after Earl Einar's fall. Bruse seeks King Olaf's support and accepts Olaf's
    terms by surrendering his dominion and becoming Olaf's vassal under oath. Thorfin
    later comes to Olaf, but refuses the same vassalage because he owes fealty to
    the Scottish king; Olaf then threatens alternative control of Orkney and hostility
    if Thorfin does not yield.
  language: English
