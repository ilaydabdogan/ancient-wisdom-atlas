canonical_text:
  quote: ''
  summary: King Olaf summons assemblies in Throndhjem to urge Christianity. Armed
    bondes resist and demand adherence to older sacrificial customs. Olaf first agrees
    to attend their sacrifice, then at Hlader threatens to offer leading men as human
    sacrifices if he must sacrifice to their gods. The bondes submit to baptism, oaths,
    and hostage arrangements. At Maeren, Jarnskegge again speaks for the bondes, and
    Olaf agrees to enter the temple with them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Olaf gathered a large army in the east, sailed north to Nidaros, and
    sent a message-token around the fjord to call people from eight districts to a
    Thing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bondes changed the Thing-token into a war-token and called together armed
    men, free and unfree, from Throndhjem land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the Thing, Olaf invited the people to adopt Christianity; the bondes told
    him to be silent or they would attack and drive him away, citing their earlier
    treatment of Hakon foster-son of Athelstan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Olaf said he wished for good understanding, would attend their greatest sacrifice-festival,
    observe their customs, and then consider which practice to follow; a midsummer
    sacrifice at Maeren was fixed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Skegge, also called Jarnskegge or Iron Beard, was a great bonde of Uphaug
    in Yrjar and was foremost among the bondes in speaking against Christianity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Olaf stayed with ships on the river Nid, prepared a feast at Hlader, invited
    chiefs and great bondes, and the guests were served much liquor and became very
    drunk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the feast night, Olaf had early mass sung and then ordered trumpets
    sounded for a House Thing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the House Thing, Olaf said that if he turned again to sacrifice he would
    make the greatest sacrifices in use, would sacrifice men, and would choose leading
    men rather than slaves or malefactors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Olaf named principal men as intended offerings to the gods for peace and a
    fruitful season.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bondes at Hlader asked for peace, submitted to Olaf's will, were baptized,
    swore to hold the right faith, renounced sacrifice to the gods, and were kept
    as hostages until close relatives were sent.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Maeren, chiefs most opposed to Christianity and great bondes who had previously
    sacrificed there assembled with a larger armed multitude than at the Frosta-Thing.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the Maeren Thing, Jarnskegge said the bondes wanted Olaf not to break their
    laws and wanted him to offer sacrifice as earlier kings had done; both parties
    then went to the temple.
  category: speech
  evidence_refs:
  - ev:8
