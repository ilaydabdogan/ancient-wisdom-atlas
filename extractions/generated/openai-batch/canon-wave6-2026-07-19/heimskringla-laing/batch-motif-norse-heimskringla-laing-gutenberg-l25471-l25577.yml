canonical_text:
  quote: ''
  summary: Mediators persuade Sveinke to leave the country under terms protecting
    his estates; after disorder on the eastern border, King Magnus reconciles with
    him and Sveinke returns as a trusted ally. Magnus then sails west, captures the
    Orkney earls, appoints Sigurd over the islands, ravages the Southern Hebudes,
    spares Iona and bars entry to Columb's Kirk, and continues raiding at Islay, around
    Cantire, and at Man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kolbjorn promises that Sveinke's estates will be managed and protected, that
    scat will not be paid against Sveinke's will until his return, and that the speakers
    pledge their lives and properties on this.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sveinke says he suspects the king's message may have been altered, but agrees
    to go out of the country for the winter if his estates can remain in peace.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mediators tell the king that Sveinke leaves the matter in the king's hands,
    will be away for three years, and will return if it is the king's pleasure; the
    king grants their request for their sakes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sveinke leaves with his men for Gautland; King Magnus is entertained at Sveinke's
    house, and Sveinke's estates are nominally the king's while Kolbjorn has them
    under his charge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the Elfgrims are without a chief, marauding gangs trouble them; King
    Magnus sends for Sveinke twice, later meets him in Denmark, makes full reconciliation,
    and Sveinke returns as a trusted friend who strengthens the eastern border.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: King Magnus sails into the West sea with men and shipping, comes first to
    Orkney, takes Earls Paul and Erlend prisoners, sends them to Norway, and places
    his son Sigurd as chief over the islands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Southern Hebudes, Magnus and his men burn and lay waste inhabited places,
    kill people, plunder, and cause country people to flee in multiple directions
    or enter his service for safety.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bjorn Krephende's verse describes fire in Lewis, flight to hills and rocks,
    bloodshed in Uist and Skye, wolves on Tyree, and island women wailing.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Iona, Magnus gives peace and safety to all men, opens the door of Columb's
    Kirk without entering, locks it again, and says no one should enter the church
    thereafter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After Iona, Magnus sails to Islay where he plunders and burns, then marauds
    around Cantire on both the Scotland and Ireland sides, and advances with his foray
    to Man where he plunders.
  category: action
  evidence_refs:
  - ev:10
