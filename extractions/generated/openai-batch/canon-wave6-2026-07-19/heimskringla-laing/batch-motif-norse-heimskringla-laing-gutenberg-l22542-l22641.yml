canonical_text:
  quote: ''
  summary: Einar forcibly rescues a former servant from the Thing, after which a reconciliation
    meeting is arranged in the king's Thing-room. In the darkened room Einar and his
    son Eindride are attacked and killed. The bondes fail to avenge them for lack
    of a leader, while the king withdraws by ship. Bergliot urges vengeance, then
    adorns and buries the bodies. The following section shows King Harald negotiating
    with Fin Arnason to reconcile the bondes and Hakon Ivarson, granting Fin's petition
    for Kalf's restoration in return for the dangerous embassy.
  language: English
  quote_policy: summarized
