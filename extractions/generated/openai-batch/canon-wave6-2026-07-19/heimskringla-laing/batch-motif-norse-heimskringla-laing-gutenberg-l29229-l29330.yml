candidate_motifs:
- id: motif:1
  label: Heroic endurance under torture
  taxonomy_refs: []
  basis: The torture and execution are narrated in detail, and Hal interprets Sigurd's
    silence, stillness, steady voice, and psalm-singing until death as extraordinary
    courage.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents Hal's evaluation; it does not add supernatural intervention
    or miracle claims.
- id: motif:2
  label: Contested burial followed by church reinterment
  taxonomy_refs: []
  basis: Sigurd is first buried at a heap of stones, then moved to a church by a priest,
    returned under pressure from Harald's sons, and later taken by friends to Mary
    church in Alaborg.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage gives burial actions and disputes but does not explicitly
    frame them as sanctification or cult.
- id: motif:3
  label: Royal legitimacy through descent, testimony, assembly choice, and territorial
    share
  taxonomy_refs:
  - royal_legitimacy
  basis: Eystein's paternal descent is accepted because Harald testified to it, he
    is chosen king at the Eyra-thing, and the brothers receive defined shares of Norway;
    Magnus is also chosen king and receives a fourth part.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is political-legal rather than mythic in this passage.
- id: motif:4
  label: Ordeal of iron as truth test
  taxonomy_refs:
  - divine_judgment
  basis: Eystein does not need ordeal of iron for his descent claim, while King Sigurd
    offers ordeal of iron to clear himself of instigating Ottar's murder and establish
    the truth of his denial.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The passage states the ordeal's legal truth-testing function but does
    not explicitly describe divine agency or the ritual procedure.
- id: motif:5
  label: Filial vengeance for murdered father
  taxonomy_refs: []
  basis: Alf Hrode sees his father's fall, chases the killer, kills him, and is said
    to have gained respect because he avenged his father.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports social approval of vengeance but does not compare
    it with other vengeance traditions.
- id: motif:6
  label: Shared kingship among royal brothers
  taxonomy_refs:
  - royal_legitimacy
  basis: The kingdom is divided among Harald Gille's sons, with Eystein receiving
    a third part alongside Sigurd and Inge and Magnus later receiving a fourth part.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a political pattern within the saga narrative; no sacred kingship
    symbolism is stated.
