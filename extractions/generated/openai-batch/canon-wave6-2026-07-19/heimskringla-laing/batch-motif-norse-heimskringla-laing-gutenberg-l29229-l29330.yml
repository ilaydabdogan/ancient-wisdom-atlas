canonical_text:
  quote: ''
  summary: The passage recounts the torture, execution, initial burial, contested
    church burial, and later reinterment of Sigurd; the transport and burial of other
    slain men; Eystein Haraldson's arrival from Scotland and recognition as a co-king;
    the short kingship of Magnus, another son of Harald Gille; the murder of Ottar
    Birting and Alf Hrode's immediate revenge; and the later accusation that King
    Sigurd instigated Ottar's murder, which King Sigurd offered to answer by ordeal
    of iron.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chiefs and other men disagreed over whether Sigurd should be killed instantly
    or tortured, and named Beintein's brothers and Peter Byrdarsvein as men with vengeance
    claims.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sigurd's shin-bones and arms were broken with an axe-hammer; he was stripped,
    whipped, pierced in the back with wood, dragged to a tree, hanged, beheaded, and
    buried with his head at a heap of stones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says both enemies and friends acknowledged Sigurd as exceptionally
    gifted and experienced, while also calling him unlucky in some respects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hal reports that Sigurd spoke little during torture, did not move, did not
    alter his voice, spoke until death, and sang parts of the Psalm-book between speeches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A nearby priest had Sigurd's body transported to his church, but Harald's
    sons were angry and had the body carried back, and they fined the priest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sigurd's friends later came from Denmark with a ship, took his body to Alaborg,
    and interred it in Mary church there; Dean Ketil told Eirik that Sigurd was buried
    there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Magnus the Blind's body was transported to Oslo and buried in Halvard's church;
    Lodin Saupprud was transported to Tunsberg; the other slain were buried on the
    spot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Eystein, son of Harald Gille, came from Scotland to Norway with named companions
    and was received well by the Throndhjem people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the Eyra-thing on Ascension-day, Eystein was chosen king and assigned a
    third part of Norway with his brothers Sigurd and Inge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: People believed Eystein's claim of paternal descent because Harald had testified
    to it, and Eystein did not resort to the ordeal of iron.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Magnus, another son of Harald Gille, was fostered by Kyrpingaorm, chosen king,
