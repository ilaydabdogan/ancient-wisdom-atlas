canonical_text:
  quote: ''
  summary: Kalf Arnason urges the anti-Olaf chiefs to lead boldly, organizes the bondes'
    army under banners, and is accepted as leader. The lendermen arrange ranks and
    encourage the men, including those seeking vengeance against King Olaf. Thorstein
    Knarrarsmid joins Thorer Hund's ranks because of a grievance over a ship taken
    by Olaf. The bondes advance to Stiklestad, where both armies wait before battle.
  language: English
