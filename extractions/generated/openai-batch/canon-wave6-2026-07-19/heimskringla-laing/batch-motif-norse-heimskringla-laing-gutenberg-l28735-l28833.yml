canonical_text:
  quote: ''
  summary: The passage introduces the saga of Harald Gille's sons, notes dates and
    related literature, then narrates the selection of Harald's sons Sigurd and Inge
    as kings after Harald's murder. It describes an oath supporting Harald's sons,
    Sigurd Slembe's attempt to gain support, the removal of Magnus the Blind from
    a cloister, the gathering and division of forces, and the battle at Mynne, where
    the child king Inge is carried under the banner and Magnus's side is defeated.
    Skaldic verses depict the battle with conventional martial imagery.
  language: English
