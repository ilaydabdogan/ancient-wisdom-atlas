canonical_text:
  quote: ''
  summary: The passage opens Harald Harfager's saga with Harald succeeding Halfdan
    the Black at age ten, facing rival chiefs, winning battles with the aid of Guthorm,
    and expanding his rule. Gyda refuses to become Harald's concubine and says she
    will only become his lawful wife if he first subjects all Norway. Harald responds
    by vowing not to cut or comb his hair until he has conquered Norway or died trying.
  language: English
