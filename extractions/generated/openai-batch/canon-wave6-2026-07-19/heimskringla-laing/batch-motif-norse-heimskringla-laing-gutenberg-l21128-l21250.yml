canonical_text:
  quote: ''
  summary: The passage introduces Harald Hardrade, gives biographical dates and comparison
    texts, then narrates his wounded escape from Stiklestad, concealment and healing
    in a remote forest household, eastward flight to Sweden, travel to Russia and
    service under King Jarisleif, and subsequent journey to Constantinople where he
    enters the empress's service, becomes chief of the Varings, and fights corsairs
    around Greek islands.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The preliminary remarks identify Harald as son of Sigurd Syr, born in A.D.
    1015, leaving Norway in A.D. 1030, returning in A.D. 1046, becoming sole king
    in A.D. 1047, and dying in A.D. 1066.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains the epithet Hardrade as meaning severe counsellor or
    tyrant, notes that Icelanders did not apply it to Harald, and says Norwegians
    used it in contrast with Magnus's mildness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The preliminary remarks state that Harald's saga is to be compared with Agrip,
    Fagrskinna, and Morkinskinna, and list skalds quoted in the saga.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: At Stiklestad, Harald, brother of Olaf the Saint by the same mother, was fifteen
    years old when Olaf fell; Harald was wounded and escaped with other fugitives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A skaldic verse says fire-sparks flew from Harald's shield, that he fought
    for Olaf, and that from his murdered brother's side he had to hide his unhelmed
    head.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ragnvald Brusason led Harald from the battle and took him to a remote forest
    bonde, who received him, concealed him, and cared for him until his wounds were
    healed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The bonde's son guided Harald east over the ridge by forest paths while avoiding
    the common road, without knowing Harald's identity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Harald's verse describes his bleeding wounds, bondes killing wounded followers
    of their rightful lord, his movement from wood to wood unnoticed, and his thought
    that his name might yet be great at home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Harald traveled eastward through Jamtaland and Helsingjaland to Svithjod,
    where he found Ragnvald Brusason and other men of King Olaf who had fled from
    Stiklestad; they remained there through winter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the spring after, Harald and Ragnvald obtained ships and traveled east
    in summer to Russia to King Jarisleif, remaining with him the following winter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: King Jarisleif received Harald and Ragnvald kindly and made Harald and Ellif
    chiefs over the king's land-defence men.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Harald remained several years in Russia, traveled widely in the Eastern land,
    then began an expedition to Greece with a large suite and went to Constantinople.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: At Constantinople, under Empress Zoe and Michael Catalactus, Harald presented
    himself to the empress, entered her pay, boarded troop galleys to the Greek sea,
    attracted the Varings to himself, became their chief, and fought corsairs around
    the Greek islands with Gyrger.
  category: sequence
  evidence_refs:
  - ev:13
