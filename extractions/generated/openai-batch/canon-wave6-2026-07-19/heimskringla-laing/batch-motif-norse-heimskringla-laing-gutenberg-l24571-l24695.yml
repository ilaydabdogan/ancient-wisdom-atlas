canonical_text:
  quote: ''
  summary: The passage recounts King Harald's transport from England and burial at
    Nidaros, summarizes his wisdom, courage, physical appearance, severity, ambition,
    generosity, and battle conduct, compares him with his brother Saint Olaf, then
    describes Magnus Haraldson's short co-rule with his brother Olaf, a renewed Danish-Norwegian
    conflict threat, the making of peace, and Magnus's death and burial.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Harald's body was transported from England to Nidaros one year after
    his fall and buried in Mary church, which he had built.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Harald was distinguished for wisdom and mental resourcefulness
    in both sudden and deliberated decisions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage and verse describe Harald as bold, brave, lucky until his dying
    day, and associated with the rule that courage is half success.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Harald is physically described as handsome and noble-looking, with yellow
    hair and beard, short beard, long moustaches, uneven eyebrows, large hands and
    feet, and a height of five ells.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Harald is described as stern and severe to enemies, disciplining followers,
    repressing bondes, and cruelly avenging opposition or misdeeds.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Harald is described as greedy for power, distinction, and honour, while also
    bountiful to friends who suited him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Thiodolf says he received a mark of gold from Harald for a ship-song.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Harald is said to have been fifteen at Stiklestad with his brother Olaf, to
    have lived thirty-five years afterward, and to have been never free from care
    and war during that time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Harald is said never to have fled from battle, but to have used cunning ways
    to escape when facing greatly superior forces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Followers said Harald chose the course that later appeared to give the best
    hope of success when sudden danger came upon him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Haldor says he knew both Saint Olaf and King Harald intimately and had never
    known two men more alike in disposition.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Haldor describes both brothers as highly understanding, bold in arms, greedy
    for power and property, courageous, zealous in governing, severe in revenge, and
    not skilled at winning popular favour.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Haldor distinguishes Olaf as a king who forced Christianity and good customs
