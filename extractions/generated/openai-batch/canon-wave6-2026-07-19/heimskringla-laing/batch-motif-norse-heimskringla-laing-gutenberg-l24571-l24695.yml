candidate_motifs:
- id: motif:1
  label: fallen king returned for church burial
  taxonomy_refs:
  - royal_legitimacy
  basis: Harald's body is brought from England to Nidaros and buried in a church he
    built, linking royal death, return, and an established sacred building.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states burial facts but does not explicitly interpret the
    burial as legitimating rule.
- id: motif:2
  label: wise warrior-king who chooses rightly in danger
  taxonomy_refs:
  - wisdom
  basis: Harald is praised for wisdom and resourcefulness, and his followers say he
    chose the course that later seemed best when sudden danger arose.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: This is a royal character pattern in the passage rather than an explicitly
    mythic episode.
- id: motif:3
  label: courage as the means of victory
  taxonomy_refs: []
  basis: Thiodolf's verse states that courage is always half success, and the prose
    frames bravery as half victory.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The motif is aphoristic and martial; no supernatural element is present.
- id: motif:4
  label: severe king as royal avenger and disciplinarian
  taxonomy_refs:
  - royal_legitimacy
  basis: Harald is repeatedly described as severe toward friends, foes, men-at-arms,
    bondes, and excess, and as cruel in avenging opposition.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage’s verse justifies equal severity as justice, but the taxonomy
    link to royal legitimacy remains interpretive.
- id: motif:5
  label: king rewards poet with gold for praise-song
  taxonomy_refs: []
  basis: Thiodolf says Harald gave him a mark of gold for a ship-song, and the prose
    describes Harald as bountiful to friends who suited him.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a courtly patronage pattern; it is not described as sacred exchange
    in the passage.
- id: motif:6
  label: paired royal brothers compared in likeness and difference
  taxonomy_refs:
  - sibling_pair
  basis: Haldor explicitly compares Saint Olaf and Harald as brothers, claiming deep
    similarity in disposition while contrasting their careers and deaths.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The comparison is a character judgment by a named speaker, not an independent
    narrative event.
- id: motif:7
  label: co-ruling brothers divide a kingdom
  taxonomy_refs:
  - sibling_pair
  - royal_legitimacy
  basis: Magnus and Olaf are two kings of Norway at the same time, with Magnus holding
    the north and Olaf the east.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage presents this as political arrangement, not as a mythic division
    of the world.
- id: motif:8
  label: sainted royal kin protects the kingdom
  taxonomy_refs:
  - royal_legitimacy
  basis: Stein Herdison’s verse says another Olaf will defend Norway with the holy
    king’s and the Saint’s favour, and that the Saint will not forsake his kin.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The claim appears in praise poetry; the prose does not independently narrate
    an intervention by the saint.
- id: motif:9
  label: peace-or-battle ultimatum between kingdoms
  taxonomy_refs: []
  basis: The Northmen demand either the same league as before or immediate battle
    when Svein declares the earlier peace ended.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a political negotiation pattern rather than a symbolic or mythological
    motif.
comparison_claims:
- id: claim:1
  claim: Within the passage, Haldor treats Saint Olaf and King Harald as functionally
    similar brother-kings in disposition, courage, ambition, governance, and severity,
    while also distinguishing their religious and military careers.
  claim_level: same_function
  target: Saint Olaf and King Harald as compared royal brothers
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:8
  confidence: high
  limitations: This is an internal comparison attributed to Haldor; it does not establish
    a broader cross-traditional motif.
- id: claim:2
  claim: The praise verse aligns the later King Olaf with the holy King/Saint Olaf
    as defenders of Norway, implying a continuity of royal protection through kinship
    and saintly favour.
  claim_level: same_function
  target: King Olaf, brother of Magnus, and Saint Olaf as royal defenders of Norway
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The alignment is poetic and encomiastic; the prose only reports that
    peace was concluded and does not narrate miraculous protection.
