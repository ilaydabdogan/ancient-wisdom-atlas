  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Magnus had a son named Hakon, who was fostered by Thorer of Steig in Gudbrandsdal.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: After Harald Sigurdson's death, Danish king Svein declared the peace between
