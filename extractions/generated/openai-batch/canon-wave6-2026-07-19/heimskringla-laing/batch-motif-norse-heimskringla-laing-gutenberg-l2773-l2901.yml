canonical_text:
  quote: ''
  summary: A war alarm announces the approach of Eirik's sons. King Hakon considers
    whether to fight or sail away, receives counsel to stand, and his men choose battle.
    He arms, raises his banner, faces an enemy force led by King Harald Eirik's son,
    throws off his armour, and fights at the front with Thoralf. His conspicuous helmet
    draws attacks, so Eyvind Finson covers it; Eyvind Skreyja taunts him, and Hakon
    answers by inviting him to find the king.
  language: English
  quote_policy: summarized
