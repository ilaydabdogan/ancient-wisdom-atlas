canonical_text:
  quote: ''
  summary: 'The passage recounts violent attacks between Gregorius Dagson and the
    forces of King Hakon and Sigurd: houses are burned, men are killed, a woman escapes
    into the forest, and a young boy is taken. Gregorius later pursues Hakon and Sigurd,
    is pressured to cross unsafe river ice despite advising a bridge crossing, falls
    through the ice, and is killed by an arrow. King Inge receives the news, mourns
    Gregorius, calls him his best friend and chief support in holding the kingdom,
    vows to confront Hakon, and asks Kristin to tend his body if he falls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gregorius heard that Hakon and Sigurd were at Saurby, came there at night,
    and set fire to the buildings where he supposed they were lodged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hakon and his men were in a smaller house, came out when they saw the fire,
    and Munan was killed while helping people who were being burned inside the house.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Some people escaped the burning at Saurby, many were killed, Asbjorn Jalda
    escaped wounded and was then slain by a bonde, and Hakon and Sigurd escaped.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Soon afterward Hakon and Sigurd set fire to Haldor Brynjolfson's farm at Vettaland,
    Haldor and about twenty men were killed, Sigrid was allowed to escape into the
    forest in only her night-shift, and the boy Amunde was taken away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gregorius took the news to heart, searched for Hakon and Sigurd, set out from
    Konungahella late in Yule, came to Fors, and heard vespers and the holy Evangel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the river Befia there was unsound ice with a stream running under it, and
    Hakon's men had cut a rent in the ice and covered it with snow.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gregorius judged the river ice unsafe and advised using the nearby bridge,
    but the bonde-troops challenged his caution; he ordered the banner forward and
    went onto the ice, while many turned back when they found the ice unsound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gregorius fell through the ice, was accompanied by only about twenty men,
    and was killed when a man of Hakon's troop shot him under the throat with an arrow;
    ten men fell with him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Gregorius's body was carried to Hofund and interred at the nunnery on Gimsey
    Isle, where his sister Baugeid was abbess.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: King Inge received the news of Gregorius's death, cried, blamed bad advice,
    called Gregorius his best friend and chief support in keeping the kingdom, swore
    to go against Hakon, and asked Kristin to seek permission to dress his body if
    he fell.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
