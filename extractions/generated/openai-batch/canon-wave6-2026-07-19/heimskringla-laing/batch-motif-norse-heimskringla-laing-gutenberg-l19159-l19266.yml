canonical_text:
  quote: the coffin had already raised itself almost to the surface of the earth
  summary: Bishop Grimkel investigates reports of miracles connected with King Olaf
    after Olaf's death. With royal permission he has the buried body taken up, finds
    the coffin raised, the body incorrupt, and the hair and nails grown. Alfifa challenges
    the evidence; the bishop tests Olaf's cut hair in blessed fire, where it is not
    consumed. Olaf is recognized as holy, his remains are moved into Clement's church,
    and further miracles are reported, including a healing spring at the burial place
    and poetic testimony to his saintly status.
  language: English
  quote_policy: quoted
