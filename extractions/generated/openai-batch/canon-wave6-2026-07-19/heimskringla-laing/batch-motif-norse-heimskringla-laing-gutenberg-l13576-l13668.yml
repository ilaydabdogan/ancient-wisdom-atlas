  quote: ''
  summary: The passage recounts King Olaf’s conflicts with local bondes while enforcing
    Christianity in Vors and Valders, including armed assemblies, a warning about
    hills, tactical use of ships and burning to force submission, baptisms, hostages,
    churches, a skaldic stanza about the burning, Olaf’s later travel to Nidaros,
    and Einar Tambaskelfer’s journey to England, Rome, and back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a meeting at Augvaldsnes, new differences arose between King Olaf and
    Erling Skjalgson and ended in enmity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In spring A.D. 1023 King Olaf went to Hordaland and Vors because he heard
    that there was little of the true faith among the people there, and he held a
    Thing at Vang attended by many fully armed bondes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Vang the king ordered the bondes to adopt Christianity; they challenged
    him to battle, but fear prevented action, and they obeyed and were baptized before
    he left.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While riding and singing psalms, the king stopped opposite some hills and
    declared that later kings of Norway should not travel between them; the passage
    reports that most later kings avoided the place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king went to Valders, where the people were still heathen, came unexpectedly
    on the bondes at a lake, seized their vessels, sent message-tokens, and appointed
    a Thing near the lake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Valders bondes came to the Thing as a large well-armed host and, when
    commanded to accept Christianity, shouted against the king, told him to be silent,
    and clashed weapons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because the bondes would not listen and were too strong to fight, the king
    shifted the discussion to their disputes, and their internal quarrels occupied
    the whole day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The local summons to arms had drawn free and unfree people away, leaving the
    neighborhood around the assembly without people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the Thing, the king boarded ships, rowed across the water at night,
    landed, plundered, and ordered habitations burned; the bondes saw smoke and flame
    and dispersed toward their homes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king rowed back across the lake and burned on the other side; the bondes
    then begged for mercy, submitted, received peace and restored goods, accepted
    Christianity, were christened, and gave hostages.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king ordered churches built and consecrated and placed teachers in them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king remained in the region in autumn, had ships drawn across the neck
    of land between two lakes, stayed near the lake sides, and did not fully trust
    the bondes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A stanza attributed to Arnor says Olaf went against the Upland people, burned
    houses, caused mourning, and hanged people who could not flee.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Afterwards Olaf went north through the valleys to Dovrefield and Nidaros,
    where winter provision had been collected and where he remained during winter
    A.D. 1024.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Einar Tambaskelfer left the country for England, met Earl Hakon, visited King
    Canute and received presents, went to Rome, returned the next summer, and did
    not meet King Olaf at that time.
  category: sequence
  evidence_refs:
  - ev:11
