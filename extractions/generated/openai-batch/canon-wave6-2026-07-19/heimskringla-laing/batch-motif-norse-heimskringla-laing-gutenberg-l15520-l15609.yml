  summary: Sigvat the skald returns from Rouen with Berg, seeks King Canute's permission
    to sail to Norway, and composes verses about the journey, Canute's preparations,
    and Earl Hakon's opposition to King Olaf. The passage then describes Canute's
    vast fleet, the richly fitted dragon-ships of Canute and Hakon, and Canute's voyage
    from England to Denmark and Limfjord.
