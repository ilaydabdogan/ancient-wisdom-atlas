canonical_text:
  quote: '"a gosling for a goose, a pig for a swine, and clay and dirt for half of
    the money instead of gold"'
  summary: Emund presents a legal case about inadequate compensation, obtains the
    king's judgment, and leaves. The king later realizes the case was a veiled comment
    on his dispute with Olaf the Thick, his broken promise concerning Ingegerd, and
    the substitute marriage with Astrid. The king's advisers interpret the allegory
    and warn him about popular resentment over breaking the Upsala Thing decision.
  language: English
  quote_policy: quoted
