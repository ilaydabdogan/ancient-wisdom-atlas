canonical_text:
  quote: '"If thou, brother, wilt follow the law... then it would be most correct
    that Sigurd Hranason produce his witnesses, and that the case be judged at the
    Thing"'
  summary: King Eystein repeatedly challenges King Sigurd's attempt to outlaw Sigurd
    Hranason by arguing that the case must be judged according to the proper law and
    at the proper Thing. The case is moved through several assemblies; Eystein takes
    the defense into his own hands by handshake before witnesses, the lagmen say royal
    disputes belong at the Eyra Thing, and Sigurd Hranason is acquitted after Eystein
    argues the case has already been dismissed. King Sigurd says Eystein has won by
    legal subtleties and threatens to use a method more familiar to him.
  language: English
  quote_policy: quoted
