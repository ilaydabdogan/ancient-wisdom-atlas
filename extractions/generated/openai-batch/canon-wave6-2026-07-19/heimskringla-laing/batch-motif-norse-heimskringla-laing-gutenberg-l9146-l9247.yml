canonical_text:
  quote: ''
  summary: A verse petitions a king to remit harbour-dues. Earl Svein and Einar Tambaskelfer
    approach Nidaros with a large force; King Olaf is warned, evacuates by ship, and
    the earl's men take provisions and burn houses. Olaf retreats through Orkadal
    and over the mountains, later gathers supporters and a fleet. Earl Svein also
    gathers a levy through lendermen and allies, advances toward Nesjar, and Olaf
    prepares his fleet, including the ship Carl's Head with a carved king's head.
    Olaf then addresses his troops with instructions for formation, restraint, and
    ship-to-ship battle.
  language: English
  quote_policy: summarized
