canonical_text:
  quote: ''
  summary: A counsel poem warns King Magnus against offending the bondes and seizing
    udal land, urges him to follow Olaf's laws, and invokes Olaf's sword. The prose
    states that Magnus consulted prudent men, ordered affairs according to law, had
    the law-book called The Grey Goose written, and became beloved as Magnus the Good.
    The passage then summarizes English and Danish royal succession after Canute,
    Hardaknut's death, Magnus's oath-based claim to Denmark, and Magnus's gathering
    of a seventy-ship armament.
  language: English
  quote_policy: summarized
