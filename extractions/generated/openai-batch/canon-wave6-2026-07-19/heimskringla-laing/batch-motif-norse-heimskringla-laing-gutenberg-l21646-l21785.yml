canonical_text:
  quote: Harald and Svein entered into friendship with each other and confirmed it
    by oath.
  summary: Harald is received in Novgorod by King Jarisleif, gathers a vast treasure
    acquired from Constantinople, marries Jarisleif's daughter Ellisif, and sails
    westward with wealth and fame. In Sweden he forms an oath-bound alliance with
    Svein Ulfson, supported by kinship ties, and together they raid Denmark. King
    Magnus hears of their alliance and ravaging and raises a levy in Norway.
  language: English
  quote_policy: quoted
