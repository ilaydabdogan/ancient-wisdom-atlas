canonical_text:
  quote: ''
  summary: The passage recounts eastward settlement traditions for Jamtaland and Helsingjaland,
    Hakon's incorporation of these regions and efforts to introduce Christianity,
    and a detailed description of pre-Christian sacrificial feasts in the Throndhjem
    country, including blood sprinkling, temple fire, goblet rites, and Sigurd of
    Hlader's patronage of a great sacrifice festival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ketil Jamte, son of Earl Onund of Sparabu, went east across the mountain ridge
    with a large group carrying farm-stock and goods; they cleared woods, established
    large farms, and settled the land later called Jamtaland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thorer Helsing, Ketil's grandson, fled east through the forest after a murder,
    settled there, and was followed by many people; the region was called Helsingjaland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Harald Harfager took possession of the whole country, many people fled
    before him from Throndhjem and Naumudal, producing new settlement in Jamtaland
    and as far as Helsingjaland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Helsingjaland people traveled into Svithiod for merchandise and became
    subjects of that country.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hakon entered friendly relations with Jamtaland, made friends with powerful
    people there, received promises of obedience and tax payment, and gave them laws
    and land rights.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says that the people of Helsingjaland who were of Norwegian race
    did the same as the Jamtaland people in relation to Hakon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hakon was a good Christian when he came to Norway, but because the country
    was heathen and powerful and common people needed to be conciliated, he practiced
    Christianity privately.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hakon kept Sundays, Friday fasts, and some signs of major holy-days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hakon made a law aligning the beginning of Yule with the time when Christian
    people held it, requiring each man under penalty to brew malt into ale and keep
    Yule holy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before Hakon, Yule began on the mid-winter slaughter night and was kept for
    three days thereafter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hakon intended to introduce Christianity after securing his position in the
    land and began by enticing those dearest to him; many were baptized through friendship,
    and some laid aside sacrifices.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Hakon sent to England for a bishop and teachers, proclaimed his wish to spread
    Christianity, consecrated churches, placed priests in them, and invited the bondes
    at a Thing to accept Christianity.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The bondes answered that they would defer the Christianity question until
    the Frosta-thing, where men from every district of the Throndhjem country would
    be present.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Sigurd, earl of Hlader, and his father Hakon are described as among the greatest
    men for sacrifices; Sigurd presided at all sacrificial festivals in the Throndhjem
    country on behalf of the king.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: At sacrificial festivals, bondes came to the temple site and brought what
    they needed for the duration of the festival, including ale.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Cattle and horses were slaughtered; the blood was called hlaut, collected
    in hlaut-vessels, and applied with hlaut-staves to altars, temple walls, and people.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The sacrificial flesh was boiled for those present; a fire stood in the middle
    of the temple floor with kettles over it, and full goblets were handed across
    the fire.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:18
  text: The chief who made the feast blessed the full goblets and all the sacrificial
    meat.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: The goblet sequence named in the passage includes Odin's goblet for victory
    and royal power, Niord's and Freyja's goblets for peace and a good season, a brage-goblet,
    and a remembrance goblet for departed friends.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:20
  text: Sigurd paid all the expenses for a great sacrifice festival at Hlader, and
    Kormak Ogmundson sang of Sigurd's generosity and temple guardianship.
  category: action
  evidence_refs:
  - ev:16
