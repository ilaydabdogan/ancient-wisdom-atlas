  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents this primarily as settlement history and place-origin
    narrative, not as a mythic hero journey.
- id: motif:2
  label: Royal legitimacy through obedience, taxation, law, and land rights
  taxonomy_refs:
  - royal_legitimacy
  basis: Hakon gains subjects through friendship and preference for Norwegian royal
    authority; they promise obedience and taxes, and he grants laws and rights to
    land.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The legitimacy described is political and legal rather than explicitly
    divine.
- id: motif:3
  label: Ruler-led Christianization under pagan social pressure
  taxonomy_refs: []
  basis: Hakon privately practices Christianity in a heathen country, alters festival
