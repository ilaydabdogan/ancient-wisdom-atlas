canonical_text:
  quote: ''
  summary: Kirjalax, emperor in the Greek country, campaigns against Blokumannaland
    and is defeated by a blind heathen king whose army uses a wagon-fortification.
    After Greeks, Franks, and Flemings fail, the Varings vow to build a church in
    Constantinople dedicated to holy King Olaf and attack despite great numerical
    odds. A blind enemy king asks about a venerable rider on a white horse at their
    head, whom others do not see. Terror seizes the heathen army; the Varings and
    allied Christians defeat them, capture the king, and take the camp.
  language: English
  quote_policy: summarized
