canonical_text:
  quote: ''
  summary: The passage introduces the saga of Magnus the Good and narrates Magnus
    Olafson’s movement from the east through Novgorod, Ladoga, Svithjod, and Sigtuna
    toward Norway. Queen Astrid, widow of Olaf the Saint and Magnus’s stepmother,
    receives him, summons a Swedish Thing, argues that he should seek his father’s
    heritage, offers men, money, gifts, and her own presence, and persuades many Swedes
    to follow. Magnus then advances with a gathered force toward Throndhjem, where
    he is welcomed and the men of King Svein flee.
  language: English
  quote_policy: summarized
