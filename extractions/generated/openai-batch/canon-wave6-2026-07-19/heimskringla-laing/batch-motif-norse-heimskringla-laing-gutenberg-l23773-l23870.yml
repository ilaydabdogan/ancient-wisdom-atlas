  quote: ''
  summary: The passage first recounts a king's suppression of the Upland bondes. It
    then gives English and Norman genealogy around King Edward, Earl William, Queen
    Gyda, and Harald Godwinson. Harald is driven by storm to Normandy, winters with
    Earl William, and negotiates a deferred marriage to William's young daughter.
    Harald returns to England and does not fulfill the agreement. King Edward dies,
    Harald claims a deathbed grant of the kingdom, is chosen, consecrated, and crowned,
    and faces objection from his brother Toste, who also claims entitlement.
