canonical_text:
  quote: ''
  summary: Harek remains silent and cheerful after a matter is dropped. In spring
    he outfits a well-equipped cutter and goes to the levy. At King Olaf's court,
    Asmund is already present. The king summons Harek and Asmund, reconciles them,
    and they leave the dispute to him. Asmund presents witnesses that Grankel owned
    the rock; the king judges accordingly, awarding the rock to Grankel and requiring
    no payment for Harek's house-servants. Harek states that obeying the king's decision
    is no disgrace. The next section heading begins, 'Thorod's Story.'
  language: English
  quote_policy: summarized
