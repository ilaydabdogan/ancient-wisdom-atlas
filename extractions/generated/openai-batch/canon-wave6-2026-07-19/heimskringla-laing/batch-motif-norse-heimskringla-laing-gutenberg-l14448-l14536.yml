canonical_text:
  quote: ''
  summary: King Olaf sends messengers to the Faroe Islands requesting that one of
    three named men come to him. The Faroese discuss whether the summons concerns
    earlier royal messengers and ships that disappeared. Thoralf prepares to travel.
    Thrand of Gata taunts Sigurd, Thord, and Gaut into launching another vessel. The
    vessels travel near each other to Herna. At night Thoralf and a companion go ashore;
    the companion is covered with a cloth, carried away, and thrown into the sea,
    while Thoralf is found dead. King Olaf convenes a Thing, accuses Sigurd and Thord
    on suspicion, and links the killing to concealment of earlier suspected murders.
    Sigurd denies the charge and offers legal oath or hot-iron ordeal to clear himself;
    many support allowing him to do so.
  language: English
  quote_policy: summarized
