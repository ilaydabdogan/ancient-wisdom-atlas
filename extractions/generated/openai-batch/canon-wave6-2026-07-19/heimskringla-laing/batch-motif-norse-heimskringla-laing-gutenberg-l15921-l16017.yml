  summary: The passage recounts King Olaf's consultations, the release of bound war
    captives by Egil Halson and Tofe Valgautson, Olaf's anger and later healing of
    Egil through touch and prayer, Tofe's reconciliation and Valgaut's conversion
    and baptismal death, Canute's bribery and spying among Olaf's men, Olaf's decision
    to go overland through Gautland, and Harek of Thjotta's refusal to abandon his
