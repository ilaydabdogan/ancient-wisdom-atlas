  quote: ''
  summary: The passage describes Erling and King Magnus's support among the people
    of Viken, a Thing that condemns Earl Sigurd and his troop to Satan by oath, Sigurd's
    coercive movement through Viken, Erling's scouting and mobilization, and Erling's
    refusal to attack by night because he associates night-fighting with witchcraft,
    villainy, and unlawful murder. The army waits for daylight in harsh weather.
  language: English
