  summary: The passage closes a dispute between Erling and King Olaf through mediated
    reconciliation, then begins the story of Asbjorn Selsbane by describing Sigurd
    Thoreson's household, annual sacrifices later continued as Christian-season feasts,
    Asbjorn's inheritance and persistence in those feasts during crop failures, Olaf's
    prohibition on grain export, and Asbjorn's voyage to Augvaldsnes, where the royal
    bailiff Thorer Sel tells him to return north without buying corn.
