canonical_text:
  quote: ''
  summary: The passage recounts Thjodolf's mediation with King Harald over his sons,
    several notices of kingship and governance, Earl Ragnvald of Møre sending Hallad
    and then Einar west to Orkney, Einar's defeat of vikings and rule as Torfeinar,
    the burning of Earl Ragnvald by Harald's sons Halfdan Haleg and Gudrod Ljome,
    and Einar's later capture and killing of Halfdan Haleg in revenge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thjodolf removes his hat, is recognized by the king, and asks the king not
    to cast off his sons; the king assents and assigns Gudrod, Halfdan, Sigurd, and
    Ragnvald to named places or guardianship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons grow up clever and skilled in exercises; during this time King Harald
    sits in peace, and the land has quietness and good crops.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing of Earl Sigurd's death and vikings' possession of the country,
    Earl Ragnvald of Møre sends his son Hallad westward to Orkney with the title of
    earl and many men-at-arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vikings plunder around the Orkney Isles through harvest, winter, and spring;
    Hallad becomes tired, resigns the earldom, resumes allodial-owner rights, and
    returns east to Norway.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Einar says he has little honor and affection to lose, offers to go west if
    given enough force, and promises Ragnvald that he will not return; Ragnvald replies
    that he would be glad if Einar never comes back and insults Einar's maternal kin
    as slave-born.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ragnvald gives Einar a fully equipped vessel; Einar sails into the West sea
    in harvest, reaches Orkney, attacks two vikings, wins the battle, and kills them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A verse says Einar gave Treskeg to the trolls and slew Skurfa.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Einar is called Torfeinar because he cuts peat for fuel where there is no
    firewood; the passage adds that Orkney has no woods, that Einar becomes a mighty
    earl, and that he is ugly and blind of one eye but sharp-sighted.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Duke Guthorm governs Viken when the king is absent, defends the land against
    vikings, and the passage notes disturbances in Gautland until King Eirik Eymundson
    dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Bjorn succeeds Eirik in Svithjod; Guthorm dies of sickness at Tunsberg, and
    King Harald gives Guthorm's son the government of that part of his dominions.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When King Harald is forty, many of his sons are mature and resent that he
    gives them no part of the kingdom while placing earls in every district; they
    consider earls of lower birth than themselves.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Halfdan Haleg and Gudrod Ljome come suddenly with a great force upon Earl
    Ragnvald of Møre, surround the house he is in, and burn him and sixty men inside
    it.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: After the burning, Halfdan takes three long-ships and sails into the West
    sea, while Gudrod occupies the land formerly held by Ragnvald; King Harald later
    forces Gudrod to surrender, sends him to Agder, and places Ragnvald's son Thorer
    over Møre with Alof as wife.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Halfdan Haleg arrives unexpectedly in Orkney; Earl Einar first flees, then
    returns unnoticed around harvest, fights Halfdan, and Halfdan flees by night.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Einar and his men sleep without tents, search the island in the morning, kill
    every man they can seize, and find Halfdan Haleg on Rinansey after Einar wonders
    whether the moving shape is a man or a bird.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Before the battle Einar sings of absent kinsmen and says he will not spare
    vengeance against his father's murderers; after Halfdan is captured, Einar cuts
    a spread eagle on Halfdan's back, tears out his lungs, and kills him.
  category: sequence
  evidence_refs:
  - ev:16
  - ev:17
