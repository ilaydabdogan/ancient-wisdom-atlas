canonical_text:
  quote: ''
  summary: Gudbrand gathers the valley farmers against King Olaf's Christianizing
    mission, appeals to Thor's power, and sends a war-band led by his son. After the
    band flees and the son is spared, Gudbrand and Thord share a terrifying dream
    warning them against battle. They arrange a truce and a Thing with Olaf. At the
    rainy assembly Olaf speaks for Christianity, while Gudbrand contrasts Olaf's unseen
    God with their visible god and proposes a weather test for the next day.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gudbrand sends out a message-token and summons valley men to meet at Hundthorp;
    the nearby lake Laugen allows people to come by land and by water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Thing, Gudbrand says Olaf is forcing a new faith, will break their
    gods, and that if Thor is carried from the temple, Olaf's god and men will be
    made nothing when Thor looks on them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bondes threaten Olaf's life if he comes to them and choose 700 men under
    Gudbrand's eighteen-year-old son to watch his movements.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: King Olaf and Bishop Sigurd install teachers in Loaf and Vagar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Breida, Olaf approaches in armour, invites the bondes to adopt Christianity,
    and his men throw spears; the bondes flee, and Gudbrand's son is captured but
    spared.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Gudbrand's son returns home, reports the army's flight and Olaf's mercy, and
    advises Gudbrand not to fight Olaf.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Gudbrand rebukes his son, saying courage has left him and that fastening his
    faith on Olaf's teaching has brought disgrace.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Gudbrand dreams of a light-surrounded man who brings terror and warns that
    battle with Olaf will end with Gudbrand and his people falling, wolves dragging
    them away, and ravens tearing them; Thord Istermage says he had the same vision.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the shared vision, Gudbrand and Thord order a Thing to be called, send
    Gudbrand's son with twelve men to Olaf, and arrange a truce bound by faith and
    law for the duration of the Thing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the rainy Thing, Olaf says people in Lesjar, Loaf, and Vagar have accepted
    Christianity, broken down their houses of sacrifice, and believe in the true God
    who made heaven and earth and knows all things.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Gudbrand answers that Olaf's God cannot be seen, while their god can be seen
