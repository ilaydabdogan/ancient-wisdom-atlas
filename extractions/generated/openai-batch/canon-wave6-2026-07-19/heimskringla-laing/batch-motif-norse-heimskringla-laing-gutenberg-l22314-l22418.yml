- id: obs:3
  text: Harald says the lights are sunlight shining on the gilded dragon-heads of
    Danish ships and orders the tilts struck down and the oars used.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Svein arrives with a large armed force, and both fleets row hard; the Danish
    ships move faster because the Northmen's ships are water-soaked and heavily laden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Harald's own dragon-ship is last in the fleet, and he orders wood, clothes,
