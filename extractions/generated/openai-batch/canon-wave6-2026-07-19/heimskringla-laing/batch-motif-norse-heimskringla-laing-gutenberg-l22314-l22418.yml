canonical_text:
  quote: ''
  summary: King Harald's fleet is pursued near Hlesey by King Svein's Danish force.
    Harald recognizes reflected light on gilded ship-heads, orders rowing, and repeatedly
    lightens his ships by casting goods, provisions, casks, and prisoners into the
    sea, delaying the pursuers long enough to escape. The passage then cites skaldic
    verses, describes Svein's encounter with seven Northmen ships, praises Harald's
    prudence, rule, war-skill, and benefactions to Iceland, and briefly characterizes
    Haldor Snorrason and Ulf Uspakson.
  language: English
  quote_policy: summarized
