canonical_text:
  quote: ''
  summary: Earl Svein dies after returning from Russia to Svithjod, and news of his
    death reaches Throndhjem. The Swedish king resents Olaf's occupation of lands
    connected to the earl, but the Throndhjem people turn to obedience to Olaf. Olaf
    is received as king in districts, establishes a royal household at Nidaros, organizes
    court offices and service, follows daily Christian observance, consults laws and
    learned advisers, reforms law with Christian privileges, seeks to uproot heathen
    customs, and inquires about Christian practice in Iceland and other North Atlantic
    islands.
  language: English
  quote_policy: summarized
