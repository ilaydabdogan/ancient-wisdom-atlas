- id: obs:4
  text: Fin travels from the town to Orkadal, then to Dovrefield and eastward over
    the mountains, first visiting his son-in-law Earl Orm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hakon Ivarson says it is his duty to avenge the death of his relative Eindride
