canonical_text:
  quote: ''
  summary: Fin Arnason addresses a town assembly to calm anger against King Harald,
    then negotiates with Hakon Ivarson, who seeks vengeance for Eindride. Hakon agrees
    to reconciliation if he may marry Ragnhild, King Magnus Olafson's daughter, with
    suitable dower. King Harald says Ragnhild's consent is required; Ragnhild refuses
    to marry a man without high rank. Hakon asks to be made earl, but Harald refuses
    because he maintains only one earl in the country and will not remove Earl Orm's
    title. Hakon and Fin accuse the king of breaking his word, separate from him,
    and Hakon leaves for Denmark, where King Svein receives him and gives him command
    against raiders.
  language: English
  quote_policy: summarized
