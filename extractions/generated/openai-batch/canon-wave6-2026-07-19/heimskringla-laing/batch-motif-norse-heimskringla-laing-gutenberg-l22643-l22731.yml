  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fin argues that Hakon should accept high dignity from the king rather than
    raise strife against the sovereign to whom he owes service and duty; Earl Orm
    supports Fin's speech.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hakon says he will be reconciled with King Harald if Harald gives him Ragnhild,
    King Magnus Olafson's daughter, in marriage with suitable dower and her contentment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fin agrees to Hakon's terms on the king's part, and the disturbance and enmity
    are quashed so that Harald retains his kingdom in peace at home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the final meeting, King Harald says he will adhere to the agreement but
    that Hakon must himself settle Ragnhild's acceptance, because marriage without
    her consent is not advisable.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ragnhild refuses Hakon's courtship because she says she must marry a bonde,
    although she acknowledges his appearance and skill, and she says King Magnus would
    not have married her to anyone less than a king.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hakon reports Ragnhild's refusal and asks Harald to give him a title of honour,
