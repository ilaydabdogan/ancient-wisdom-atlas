canonical_text:
  quote: ''
  summary: The passage explains hostility toward King Olaf as a reaction to his severe
    but just judgments and to rival patronage from King Canute and Earl Hakon. Earl
    Hakon pursues Olaf, takes his ships, and assigns command by lot; Jokul Bardson
    receives Olaf's ship the Bison and speaks a verse about it. Later Jokul is wounded
    during an attempted beheading ordered by Olaf and sings a death-verse. Kalf Arnason
    is pressed by his wife Sigrid, who recalls deaths attributed to Olaf, and is persuaded
    to enter Earl Hakon's service for renewed fiefs before later sailing to King Canute
    in England.
  language: English
