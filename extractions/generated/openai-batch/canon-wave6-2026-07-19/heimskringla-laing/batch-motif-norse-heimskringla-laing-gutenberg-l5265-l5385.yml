candidate_motifs:
- id: motif:1
  label: Unwoundable warrior killed by an unconventional object
  taxonomy_refs: []
  basis: Aslak is described as previously unwoundable by weapons, yet Vigfus kills
    him by throwing a sharp-ended anvil into his head.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not explain the source or limits of Aslak's resistance
    to weapons.
- id: motif:2
  label: Leader carries treasure into death by going overboard
  taxonomy_refs: []
  basis: Bue lifts two chests full of gold, calls his men overboard, and throws himself
    overboard with the chests.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The text narrates the act but does not state a ritual or symbolic meaning
    for the gold.
- id: motif:3
  label: Bound warriors display courage at execution
  taxonomy_refs: []
  basis: Vagn and other captives are bound on a log while Thorkel uses an axe; several
    captives speak or act boldly in the face of death.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: This is a narrative pattern inferred from multiple literal actions in
    the scene.
- id: motif:4
  label: Test of awareness after beheading
  taxonomy_refs: []
  basis: A prisoner proposes to prove knowledge after death by sticking a cloak-pin
    into the earth after beheading, but the pin falls from his hand.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The attempted test fails in the passage.
- id: motif:5
  label: Executioner's weapon turned against him
  taxonomy_refs: []
  basis: Thorkel's axe is used in executions, then Vagn catches it after Skarde trips
    Thorkel and gives Thorkel a death-wound.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage presents this as battlefield reversal rather than supernatural
    justice.
- id: motif:6
  label: Mercy gained through courage and conditional intercession
  taxonomy_refs: []
  basis: Sigurd is spared after his display and self-identification; Vagn accepts
    life only if it is given to all the remaining captives, and twelve survive.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly state that courage causes the mercy, only
    that the events occur in sequence.
- id: motif:7
  label: Mutilated warrior continues fighting
  taxonomy_refs: []
  basis: Havard, with his feet cut off, remains at the ship's railing on his knees
    with a bow and has just shot Gissur.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: high
  cautions: The endnote broadens the motif, but the narrative instance itself is limited
    to Havard.
- id: motif:8
  label: Sacrifice of a ruler's son for victory followed by storm and defeat of enemies
  taxonomy_refs:
  - sacrifice
  basis: The passage reports that Hakon sacrificed his young son Erling to the gods
    for victory and that a hailstorm and the Jomsborg vikings' defeat and slaughter
    immediately followed.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: 'The wording is reportive: ''It was said.'' The passage does not directly
    depict the sacrifice.'
- id: motif:9
  label: Enemy captive restored through marriage alliance and gift of warship
  taxonomy_refs: []
  basis: After sparing Vagn, Eirik marries him to Ingebjorg, gives him a warship with
    crew and equipment, and parts from him in friendship.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not explicitly frame the marriage as political, though
    the reconciliation is clear.
comparison_claims:
