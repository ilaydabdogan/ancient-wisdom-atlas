canonical_text:
  quote: ''
  summary: 'The passage narrates the end of a sea battle against the Jomsborg vikings:
    Bue''s ship is boarded, Bue goes overboard with two gold chests, Vagn and other
    vikings are captured and partly executed, several captives display courage or
    evade death, Havard shoots Gissur while mutilated, booty is divided, Hakon is
    said to have sacrificed his son for victory before a hailstorm, and Vagn is later
    reconciled through marriage and gifts.'
  language: English
  quote_policy: summarized
