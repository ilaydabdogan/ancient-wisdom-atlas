  claim: The endnote explicitly connects Havard's fighting on his knees after losing
    his feet with a broader Northmen traditionary idea and with the ballad of Chevy
    Chase.
  claim_level: same_motif
  target: Warrior fighting on knees after legs are cut off in Northmen tradition and
    the ballad of Chevy Chase
  evidence_refs:
  - ev:7
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the edition's endnote, and the passage
    gives no details from Chevy Chase for direct verification.
