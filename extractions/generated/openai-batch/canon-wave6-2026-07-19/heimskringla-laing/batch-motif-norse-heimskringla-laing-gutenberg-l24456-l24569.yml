  quote: ''
  summary: The passage recounts William of Normandy's claim to England, his invasion
    and victory over Harald Godwinson, Earl Valthiof's burning of enemies in a wood
    and later execution after a promised reconciliation, and Olaf Haraldson's return
    from England through Orkney to Norway, including notices of Maria's simultaneous
    death, Olaf's joint kingship with Magnus, Skule's rewarded service, marriage alliance,
    and descendants.
