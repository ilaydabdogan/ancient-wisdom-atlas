canonical_text:
  quote: ''
  summary: A foot wager between Thorarin and King Olaf is decided in Olaf's favor,
    allowing Olaf to require Thorarin to transport King Hrorek away from Norway. Thorarin
    attempts the Greenland voyage with Hrorek but is driven by storms to Iceland,
    where Hrorek is hosted by Thorgils and Gudmund, later lives at Kalfskin, dies,
    and is said to be the only king whose bones rest in Iceland. The passage then
    reports related western voyages and a battle in Ulfreks-fjord where the Irish
    king Konofogor defeats Einar, earl of Orkney.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thorarin shows a second foot from under the bedclothes; it lacks the little
    toe, and Thorarin claims this means he has won the wager.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Olaf answers that the second foot is uglier because it has only four
    toes instead of five ugly toes, and he claims the right to ask something of Thorarin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Olaf requires Thorarin to take Hrorek to Greenland and deliver him to
    Leif Eirikson.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thorarin says he has never been in Greenland; Olaf says this gives a far-travelled
    man an opportunity to see it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thorarin says that, if he had won the wager, he would have wished to be received
    among Olaf's court-men; Olaf grants this, and Thorarin is made a court-man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Thorarin rigs out his vessel, takes King Hrorek on board, and asks Olaf what
    to do if the Greenland voyage cannot be completed.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Olaf instructs Thorarin to deliver Hrorek in Iceland to Gudmund Eyolfson,
    Skapte the lagman, or another chief who will receive Olaf's tokens and message
    of friendship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Olaf further instructs that, if Thorarin comes to nearer countries and has
    no other way, he must ensure that Hrorek never again appears in Norway.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Thorarin sails into the ocean, avoids the land, reaches the south part of
    Iceland, and sails west around the land toward the Greenland ocean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Heavy storms drive Thorarin long about upon the ocean, and near summer's end
