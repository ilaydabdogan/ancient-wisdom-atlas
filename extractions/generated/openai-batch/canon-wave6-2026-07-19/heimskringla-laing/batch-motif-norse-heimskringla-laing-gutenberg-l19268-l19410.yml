canonical_text:
  quote: ''
  summary: 'The passage presents poetic and prose testimony to Saint Olaf''s posthumous
    holiness: his body remains incorrupt, bells and altar lights act miraculously
    around his remains, sick and disabled people are cured, and prayers to him are
    urged for life, protection, crops, and peace. It then summarizes Olaf''s reign,
    age, battles, and manifested holiness, before turning to political dissatisfaction
    under King Svein and Alfifa, remorse among the Throndhjem people over Olaf''s
    fall, and Kalf Arnason''s disillusionment with King Canute.'
  language: English
  quote_policy: summarized
