canonical_text:
  quote: ''
  summary: After King Magnus the Good dies, the passage names King Harald's partners
    and children and states that Harald raids Denmark repeatedly. King Svein Ulfson
    rules the Danish dominions after Magnus and prepares against Harald. The two kings
    arrange a possible confrontation at the Gaut river, but no battle occurs there.
    Harald redirects his force through Jutland and Thioda, takes and burns Heidaby,
    then sails north with booty. Svein challenges him to fight on land, and Harald
    challenges Svein to fight at sea because his force is smaller.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After King Magnus the Good died, King Harald took Thora, daughter of Thorberg
    Arnason, and they had two sons named Magnus and Olaf; King Harald and Queen Ellisif
    had two daughters named Maria and Ingegerd.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Harald ordered people out, went to Denmark in A.D. 1049, raided there,
    and continued to do so summer after summer; Stuf's verse says Falster lay waste
    and the Danes feared the annual foray.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: King Svein ruled the Danish dominions after King Magnus's death, stayed quiet
    through winter, and in summer lay out in ships with his people, with reported
    plans to bring the Danish army north to Norway and make havoc there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: King Svein proposed that he and King Harald meet the following summer at the
    Gaut river and fight until their differences were ended or settled peacefully.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Both sides prepared ships through the winter and called out half of all fighting
    men in summer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thorleik the Fair came from Iceland, composed a poem about King Svein Ulfson,
    and sang after hearing that King Harald had sailed south to the Gaut river against
    King Svein.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thorleik's verse describes an expected fleet-to-fleet fight, an arrow-storm,
    a heaving sea, and an uncertain end concerning land and life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Thorleik's later verses describe Harald moving over waves with ships and Svein
    bringing gold-beaked ships from the Sound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Harald reached the appointed meeting-place, heard that Svein's fleet lay by
    the south side of Seeland, divided his forces, sent many bonde-troops home, and
    sailed toward Jutland and Thioda with selected troops.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Harald's force carried fire and sword over the places they passed; Stuf's
    verse says the men of Thyland fled and that hearts in Denmark shook at Harald's
    look.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Harald's force went south to Heidaby, took the merchant town, and burned it;
