  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Thorleik alluded to the absence of a battle at the Gaut river and asked why
    Harald turned his wrath on Heidaby and burned the fair town to ashes without gain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Harald sailed north with sixty ships, most of them large and heavily laden
