  summary: The passage recounts the near-fatal birth of King Olaf's son by Alfhild,
    the child's urgent baptism and naming as Magnus by Sigvat, and the king's later
    acceptance. It then begins the account of Asmund receiving part of a sheriffdom
    from the king, Harek's objection on hereditary grounds, Karle joining Asmund,
    and Karle identifying Asbjorn by his distinctive ship and blue cloak.
