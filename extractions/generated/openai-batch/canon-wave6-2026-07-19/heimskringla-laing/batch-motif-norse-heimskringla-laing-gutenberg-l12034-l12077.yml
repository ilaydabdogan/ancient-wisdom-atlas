canonical_text:
  quote: ''
  summary: Ambassadors summon King Olaf of Norway to a reconciliation meeting with
    the Swedish kings at Konungahella. At the meeting, the kings agree to decide possession
    of an inhabited district in Hising by dice. After the Swedish king throws two
    sixes twice, Olaf invokes God Almighty’s power over the dice and wins when one
    die splits so that the total is counted as seven eyes. The district is adjudged
    to Norway, and the kings part as close friends. Olaf then returns through Norway,
    becomes sole supreme king, recovers territory previously held by Sweden by agreement
    and territory held by Denmark by force, while Canute rules Denmark and England
    without pressing a claim on Norway.
  language: English
  quote_policy: summarized
