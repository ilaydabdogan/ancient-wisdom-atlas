canonical_text:
  quote: ''
  summary: Upland district-kings debate whether to support Olaf Haraldson's bid for
    kingship. Sigurd presents Olaf's purpose and asks for aid against Danish and Swedish
    domination. Hrorek objects, citing earlier rulers' oppression and preferring local
    autonomy under Danish friendship. Ring supports aiding a kinsman and binding friendship
    with Olaf. Most district-kings form an oath-confirmed league with Olaf, who promises
    friendship and respect for laws and rights. At a Thing, Olaf asks the bondes to
    receive him as king, promises ancient laws and defense from foreign masters, and
    is proclaimed king according to law.
  language: English
