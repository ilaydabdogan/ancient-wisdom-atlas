canonical_text:
  quote: ''
  summary: King Olaf summons men from the Farey Islands, requires obedience to his
    laws and payment of scat, binds them by oath, takes leading men into service,
    and sends ships to collect tribute; two tribute-collecting ships are later reported
    missing or unheard of. Olaf also travels through Norway, advances Christianity,
    consents to marriages involving female kin, and receives Icelandic visitors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men from the Farey Islands came to Norway on King Olaf's invitation; Thord
    of Gata prepared to travel but was prevented by a stroke of palsy and stayed behind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Olaf told the Farey men that he wanted scat from the Farey Islands and
    wanted the people there subject to laws he would give them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king's words indicated that he would make the visiting Farey people answerable
    and bind them by oath to conclude the union; he also offered able men service,
    honour, and friendship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Farey men understood that they should fear the outcome if they did not
    submit, and after several meetings the king's wish prevailed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Leif, Gille, and Thoralf entered the king's service as courtmen, and the travellers
    swore an oath that the king's law, land privilege, and scat should be observed
    in the Farey Islands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At their departure, the king gave presents to those who had entered his service
    as testimony of his friendship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: King Olaf sent a manned ship to the Farey Islands to receive scat, but the
    ship did not return the next summer, no scat returned, and no one had demanded
    scat there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: King Olaf wintered in the Uplands, moved through guest-quarters, put matters
    right where he thought necessary, and advanced Christianity where needed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ketil Kalf courted Gunhild, King Olaf's sister; because consent belonged to
    the king, Olaf considered Ketil's rank, wealth, understanding, chieftainship,
    and friendship, approved the match, and attended the wedding.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Thord Guthormson proposed marriage to Isrid, a kinswoman connected to King
    Olaf's mother; the king's consent was needed, the marriage proceeded, and Thord
    and many of his relations and friends became the king's faithful friends.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Several Icelanders came in response to King Olaf's message, met him when able,
    were well received, and stayed in his house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After learning that the earlier ship sent for Farey scat was missing, King
    Olaf sent another ship for the same purpose; this second vessel was also little
    heard of, and people made conjectures about its fate.
  category: sequence
  evidence_refs:
  - ev:9
