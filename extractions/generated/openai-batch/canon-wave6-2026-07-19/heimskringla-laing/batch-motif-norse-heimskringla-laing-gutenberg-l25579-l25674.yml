canonical_text:
  quote: ''
  summary: The passage recounts King Magnus's campaigns in the Hebudes, Wales, Anglesey,
    Scotland, and nearby islands. Lawman, son of Gudrod, flees and is captured in
    irons. Magnus defeats Welsh forces at Anglesey, killing Earl Huge the Brave with
    an arrow through the eye. A peace settlement with King Melkolm defines Norwegian
    possession of western Scottish islands by a vessel-passage rule, after which Magnus
    has a skiff drawn over Cantire while holding the tiller to claim the land. The
    passage also records possession-taking, a dynastic marriage for Magnus's son Sigurd,
    deaths of the earls of Orkney, and a genealogical notice about Skopte Ogmundson's
    household.
  language: English
  quote_policy: summarized
