canonical_text:
  quote: ''
  summary: Earl Svein, at Steinker preparing for Yule, hears of King Olaf's advances,
    loads his goods and provisions onto a long-ship by night, and hides the ship under
    trees and leaves until Olaf's fleet passes. Svein consults Einar Tambaskelfer,
    who advises caution and secrecy rather than immediate mobilization. King Olaf
    takes the Yule provisions, moves to Nidaros, repairs and rebuilds the royal houses
    there, and prepares to hold Yule. Sigvat the skald comes to his father Thord,
    sings for King Olaf, receives a gold ring, and becomes one of the king's court-men.
    The passage ends with Olaf's demand for a share of harbor dues from Icelandic
    traders.
  language: English
  quote_policy: summarized
