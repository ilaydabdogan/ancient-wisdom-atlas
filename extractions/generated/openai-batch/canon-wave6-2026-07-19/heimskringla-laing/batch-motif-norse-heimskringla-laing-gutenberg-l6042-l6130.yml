canonical_text:
  quote: ''
  summary: King Olaf declares that sorcerers and dealers with evil spirits are to
    be banished, gathers such people, intoxicates them at a feast, and has the house
    burned; Eyvind Kelda escapes. Later Eyvind arrives at Ogvaldsnes with sorcerers
    and tries to conceal them with darkness and mist, but the darkness turns upon
    them; they are captured and left bound on a tidal skerry where they die. A later
    episode at Ogvaldsnes tells of a one-eyed, broad-hatted, learned old guest who
    speaks with Olaf, narrates Ogvald’s cow sacrifices and burial, disappears, and
    is identified by Olaf as Odin after the guest has supplied beef for the king’s
    food.
  language: English
  quote_policy: summarized
