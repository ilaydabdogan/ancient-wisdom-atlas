canonical_text:
  quote: ''
  summary: 'The passage recounts two saga sequences: Eirik, son of Earl Hakon, quarrels
    over ship precedence with Skopte, later kills him, sails to Denmark, and receives
    an earldom from King Harald Gormson; Olaf Trygvason, favored in Gardarike by King
    Valdemar and the queen, becomes a successful military leader, arouses envy as
