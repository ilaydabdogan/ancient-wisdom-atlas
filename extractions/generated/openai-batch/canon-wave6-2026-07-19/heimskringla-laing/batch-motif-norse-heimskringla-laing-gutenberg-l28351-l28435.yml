canonical_text:
  quote: ''
  summary: 'The passage describes fighting at a castle and town: Olver''s solitary
    attack against eight armed opponents, later assaults by Vindlanders, the killing
    of a protected bowman, the defeat of a weapon-invulnerable warlock by an arrow
    prepared with consecrated fire, surrender under terms that are not kept, plundering
    of a church, removal of sacred objects, and burning of church buildings.'
  language: English
  quote_policy: summarized
