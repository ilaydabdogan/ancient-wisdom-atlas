canonical_text:
  quote: ''
  summary: Thorarin repeatedly delays the king's intended execution of Asbjorn by
    objecting to night killing, invoking a Christian example, and claiming Sabbath-peace
    after arranging the bell-ringing. Erling then musters an armed force, frees Asbjorn
    from chains near the church service, and asks the king for reconciliation while
    the king challenges the coercive show of force.
  language: English
  quote_policy: summarized
