canonical_text:
  quote: '"There are not many who seek help from me, so I may well help this one."'
  summary: The passage gives Sigurd Slembidjakn's ancestry, clerical upbringing, claimed
    paternity from King Magnus Barefoot, travels to Palestine and other places, and
    an iron ordeal in Denmark said by his own party to prove his royal descent, though
    Harald Gille's friends deny it. It then recounts episodes in Iceland where Sigurd,
    under little-known identity, protects a sheep and an accused woman, uses a trick
    to disrupt a lost chess game, reveals clerical learning by consecrating holy water,
    and finally identifies himself to Thorgils before leaving Iceland.
