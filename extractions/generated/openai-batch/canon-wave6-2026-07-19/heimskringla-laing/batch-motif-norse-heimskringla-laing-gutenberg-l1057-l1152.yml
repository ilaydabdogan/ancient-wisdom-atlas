canonical_text:
  quote: ''
  summary: The passage recounts King Harald as sole king over Norway, lists his wives
    and children, describes fosterage and water-naming of his eldest son, narrates
    Harald's western expedition against vikings and the granting of Orkney and Shetland,
    tells of Earl Sigurd's death from a wound caused by a slain enemy's head, and
    ends with Harald's hair being cut and his receiving the name Harfager.
  language: English
