canonical_text:
  quote: ''
  summary: Thorod remains with King Olaf through winter and returns to Iceland on
    friendly terms. King Olaf gathers levied men and holds councils, then announces
    that the promised scat from the Farey islanders has not arrived and seeks men
    to collect it. Others decline the mission. Karl Morske, armed and conspicuously
    dressed, publicly offers to go despite his previous enmity with the king. Olaf
    accepts the offer, reconciles with Karl, equips him, and sends him with messages,
    tokens, and powers. Karl sails to the Farey Islands, attends a Thing at Thorshavn,
    presents Olaf's tokens and messages to Leif Ossurson and Lagman Gille, receives
    offers of support, and asks Thrand of Gata to collect scat from the eastern and
    northern islands.
  language: English
  quote_policy: summarized
