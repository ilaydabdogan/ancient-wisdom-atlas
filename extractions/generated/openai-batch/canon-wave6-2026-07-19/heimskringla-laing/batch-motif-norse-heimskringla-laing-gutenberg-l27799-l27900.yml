  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: King Sigurd travels south to Stavanger with corn, malt, and honey and prepares
    a feast there for his marriage with Cecilia.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Stavanger bishop asks whether Sigurd intends to marry during the queen's
