canonical_text:
  quote: ''
  summary: King Sigurd plans to put away his queen and marry Cecilia. Bishop Magne
    confronts him and forbids the act in sacred and ecclesiastical names, standing
    ready for possible violence. Sigurd later goes to Stavanger, where another bishop
    allows the marriage after demanding gifts and estates as a mulct. The passage
    then recounts Sigurd's fortification and church-building at Konungahella, his
    deposit of relics and sacred objects there, and his illness, death, burial, and
    his son Magnus's seizure of the treasury.
  language: English
  quote_policy: summarized
