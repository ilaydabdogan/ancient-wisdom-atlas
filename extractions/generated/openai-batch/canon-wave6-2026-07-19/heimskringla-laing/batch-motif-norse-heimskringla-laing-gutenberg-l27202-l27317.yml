canonical_text:
  quote: ''
  summary: The passage first describes King Nikolas of Denmark asking King Sigurd
    the Crusader to help baptize people in Smaland, the failed royal rendezvous, Sigurd's
    retaliatory Calmar levy, plundering, tribute, and the reported reception of Christianity
    by Smaland. It then recounts an episode in which the poorly dressed Icelander
    Thorarin Stutfeld answers King Sigurd in verse, is tricked by Arne Fioruskeif
    into lampooning Hakon Serkson, composes a counter-lampoon against Arne, and later
    receives money from Sigurd for a pilgrimage to Rome.
  language: English
  quote_policy: summarized
