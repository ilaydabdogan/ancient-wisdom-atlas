canonical_text:
  quote: ''
  summary: King Olaf Haraldson prepares a winter guest-quarter progress through the
    Uplands, enforces Christian practice with instruction and severe punishments,
    and places teachers in the districts. In response, several Upland kings meet at
    Ringsaker, discuss Olaf's actions and power, debate resistance, and agree after
    Gudrod's speech to prepare an attack, with Hrorek urging that their agreement
    be made firm by staying assembled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Olaf sent people to the Uplands to prepare guest-quarters for a planned
    winter stay, and the passage says former kings had customarily made a guest-quarter
    progress in the Uplands every third year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In autumn Olaf began his progress from Sarpsborg, went first to Vingulmark,
    lodged near forest habitations, and summoned inhabitants who lived far from the
    district head-habitations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Olaf asked particularly about the inhabitants' Christianity and taught what
    the passage calls the right customs where improvement was needed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who would not renounce heathen ways were punished by exile, mutilation,
    blinding, hanging, or sword-killing; the passage says none who would not serve
    God went unpunished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Olaf appointed teachers in the district, traveled with 300 men-at-arms, proceeded
    to Raumarike, and continued converting and punishing people as he moved inland.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The unnamed king ruling in Raumarike heard daily reports, went to Hedemark
    to consult King Hrorek, and messages were sent to Gudrod and the king in Hadaland;
    five kings met at Ringsaker, including Ring, Hrorek's brother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Raumarike king reported Olaf's killings, mutilations, expulsions, deprivation
    of offices or property, and travel with a larger army than the lawful number for
    a royal guest-quarter progress.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hrorek recalled that he had previously warned the kings about raising Olaf
    over them, presented submission or revolt as the two options, and advised against
    trying their luck against Olaf.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The kings then spoke individually, with some discouraging action against Olaf
    and others urging it, and no determination was reached at first.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gudrod said the five kings were of no less high birth than Olaf and that their
    forces had helped Olaf bring the country under his power after fighting Earl Svein.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gudrod said he would withdraw from the king's slavery, urged cutting Olaf
    off if he came into their hands in Hedemark, and said they would not be safe while
    Olaf lived; after this, the kings agreed to his determination.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Hrorek said that, if the kings chose to attack Olaf at a fixed time, they
    must make the agreement strong and remain assembled together day and night.
  category: speech
  evidence_refs:
  - ev:9
