canonical_text:
  quote: ''
  summary: The passage describes fighting between King Harald and King Magnus at Fyrileif.
    Magnus arrays a broad line and has the holy cross carried before him; Kristrod,
    Harald's brother, attacks into Magnus's array and is killed by a bonde who says
    he is avenging earlier losses. Harald flees to Denmark and receives Halland and
    ships from King Eirik because they are sworn brothers. Magnus consolidates the
    country but ignores advice to keep forces together. Harald returns, negotiates
    submission from local forces, rewards supporters, attacks Magnus's men, and forces
    the brothers Asbjorn and Nereid to choose between hanging and drowning in the
    Sarpsborg waterfall. In Bergen, Sigurd Sigurdson advises offering Harald peace
    and half the kingdom, but Magnus rejects the proposal.
  language: English
  quote_policy: summarized
