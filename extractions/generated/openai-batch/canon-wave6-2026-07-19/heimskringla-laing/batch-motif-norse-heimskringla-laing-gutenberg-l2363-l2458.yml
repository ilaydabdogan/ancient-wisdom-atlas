  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Earl Sigurd blessed the first full goblet in Odin's name and drank to the
    king out of the horn; Hakon then made the sign of the cross over the drink.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kar of Gryting questioned whether the king would sacrifice, and Earl Sigurd
    explained the king's gesture as the sign of Thor's hammer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The next day the bondes pressed Hakon to eat horse-flesh, then to drink soup,
    then to taste gravy; when he refused, they were going to lay hands on him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Earl Sigurd made peace by asking Hakon to hold his mouth over the kettle handle
