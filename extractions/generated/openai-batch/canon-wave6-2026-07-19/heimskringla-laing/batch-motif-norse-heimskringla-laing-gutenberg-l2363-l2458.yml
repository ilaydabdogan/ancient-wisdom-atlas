canonical_text:
  quote: offer a sacrifice for peace and a good year
  summary: King Hakon proposes Christian baptism and observance at the Frosta-thing.
    The bondes resist the loss of their old faith and threaten to replace him unless
    he moderates. Earl Sigurd mediates, and the bondes demand sacrifice for peace
    and a good year. At a later sacrificial feast at Hlader, Hakon sits in the high-seat,
    makes the sign of the cross over a ritual drink that Sigurd has blessed in Odin's
    name, and is pressured to eat horse-flesh; a compromise involving smoke from the
    kettle satisfies neither side.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: King Hakon addressed the seated Frosta-thing and asked all classes of people
    to be baptized, believe in one God and Christ, refrain from sacrifices and heathen
    gods, keep the seventh day holy, and fast on that day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crowd murmured and complained that the king's proposal would take away
    their labor and their old faith; laboring men and slaves also objected to restrictions
    on meat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Asbjorn of Medalhus answered that the bondes had elected Hakon as king and
    recovered udal rights, but that they would not abandon the ancient faith held
    by their fathers and forefathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Asbjorn said the bondes would follow Hakon as king if he required only what
    they could obey, but would choose another chief if he tried to impose the matter
    by force.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bondes applauded Asbjorn's speech, and Earl Sigurd announced that Hakon
    would give way and not separate himself from their friendship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bondes said they wanted the king to offer sacrifice for peace and a good
    year, as his father had done.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the harvest-season sacrifice festival at Hlader, Hakon sat in the high-seat
