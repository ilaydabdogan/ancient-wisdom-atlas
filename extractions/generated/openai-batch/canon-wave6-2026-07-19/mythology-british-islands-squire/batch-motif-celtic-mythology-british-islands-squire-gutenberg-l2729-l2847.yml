canonical_text:
  quote: ''
  summary: Lugh demonstrates harp-music that induces sleep, grief, and joy. Nuada,
    impressed by Lugh’s talents, lends him the throne for thirteen days. Lugh convenes
    the Tuatha Dé Danann and asks what each can contribute against the Fomors. Divine
    specialists promise healing, weapons, combat, pursuit, poetic cursing, sorcery
    involving mountains, magical control of waters, and fire-magic that weakens the
    enemy and strengthens the people of Danu. The assembly prepares for war under
    Lugh’s direction.
  language: English
  quote_policy: summarized
