canonical_text:
  quote: ''
  summary: A judgment requires the Milesians to withdraw over nine waves before attempting
    a lawful landing and battle for Ireland. The Tuatha Dé Danann oppose them with
    druidical winds; Amergin invokes the land of Eriu and the wind ceases. Manannán
    raises a further tempest with his magic mantle, sinking many ships and killing
    Donn and other sons of Milé. Survivors land at the Boyne, where Amergin invokes
    the sea for fish abundance. The Milesians defeat the gods in two battles, kill
    their three kings, and the Tuatha Dé Danann withdraw beneath the earth, leaving
    the land’s surface to the conquerors. Eremon later becomes sole ruler after conflict
    with Eber. A footnote notes a Welsh tradition of Cymric ancestors from the Land
    of Summer, identified there as the Celtic Other World.
  language: English
  quote_policy: summarized
