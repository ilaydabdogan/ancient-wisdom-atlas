comparison_claims:
- id: claim:1
  claim: 'The passage claims that Geoffrey’s older-generation gods occupy the same
    position toward Arthur as in later Welsh triads and tales: rulers, but also Arthur’s
    vassals.'
  claim_level: same_function
  target: Later Welsh triads and tales concerning older-generation gods under Arthur
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
