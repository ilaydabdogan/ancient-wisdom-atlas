canonical_text:
  quote: "“carried to the island of Avallon to be healed of his wounds”"
  summary: 'The passage summarizes Geoffrey of Monmouth’s Arthurian material, including
    Arthur’s conquests, Mordred’s rebellion, Arthur’s removal to Avallon, and the
    succession of Constantine. It then describes older divine or mythic figures as
    Arthur’s vassal rulers, discusses Lud/Lludd as a city-building king linked to
    London, and introduces a Welsh romance in which Britain under Lludd suffers three
    plagues: the Coranians, a May-eve shriek, and the nocturnal disappearance of stored
    royal food.'
