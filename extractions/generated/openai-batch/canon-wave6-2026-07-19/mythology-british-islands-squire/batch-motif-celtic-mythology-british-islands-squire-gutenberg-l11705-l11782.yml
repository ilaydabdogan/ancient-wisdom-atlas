    not quoted here.
- id: claim:2
  claim: The passage directly compares the Coranians’ fairy money, which reverts to
    fungus, with Gwydion son of Dôn’s magical shields, horses, and hounds made to
    deceive Pryderi.
  claim_level: same_function
  target: Gwydion’s deception of Pryderi with magically fabricated goods
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to magical fabricated goods used in deception
    and their apparent unreality; the wider narratives are not provided.
- id: claim:3
  claim: The passage states that a Welsh romance recounts Lludd’s rebuilding of London
    in almost the same words as Geoffrey’s account of Lud.
  claim_level: linguistic_similarity
  target: Welsh romance of Lludd and Geoffrey of Monmouth’s account of Lud rebuilding
    London
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the author’s summary of the similarity is supplied; the parallel
    wording from the Welsh romance is not quoted.
- id: claim:4
  claim: The passage identifies Gunvasius and Malvasius with Gwyn by treating them
    as Latinized forms related to the Welsh name Gwynwas and the Cornish name Melwas.
  claim_level: linguistic_similarity
  target: Gwyn / Gwynwas / Melwas and Geoffrey’s Gunvasius / Malvasius
  evidence_refs:
