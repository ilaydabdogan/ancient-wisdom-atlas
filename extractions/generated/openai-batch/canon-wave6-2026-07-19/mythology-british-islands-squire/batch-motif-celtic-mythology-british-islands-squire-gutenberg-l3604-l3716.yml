  quote: ''
  summary: The passage describes the aftermath of the Northern Battle of Moytura,
    associates the battlefield with megalithic monuments at Carrowmore, and narrates
    later episodes in which Bress bargains for his life, the Dagda recovers his harp
    through magical music, a black-maned heifer brings back stolen cattle, remaining
    Fomors are expelled, and the Morrígú and Badb proclaim victory from Ireland’s
    mountains.
