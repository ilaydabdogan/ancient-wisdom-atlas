canonical_text:
  quote: ''
  summary: Arthur and his company pursue Twrch Trwyth, a boar carrying a comb, scissors,
    and razor between his ears. Menw scouts in bird form and is injured by venom from
    the boar’s bristles. After fighting and failed parley, the boar crosses from Ireland
    into Wales and is chased through South Wales to the Severn. In the water Arthur’s
    allies take the scissors and razor, but the boar escapes to Cornwall; the comb
    is later secured, and the boar disappears over the deep sea with two magic hounds
    pursuing him. The recovered treasures are shown to Hawthorn, chief of giants,
    who concedes Olwen to Kulhwch and is then beheaded; Olwen becomes Kulhwch’s bride.
  language: English
  quote_policy: summarized
