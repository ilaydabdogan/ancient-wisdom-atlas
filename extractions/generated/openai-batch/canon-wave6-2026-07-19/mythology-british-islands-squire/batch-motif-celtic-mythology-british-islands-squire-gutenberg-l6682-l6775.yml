canonical_text:
  quote: ''
  summary: Diarmait and Grainne hide at a magic quicken-tree whose divine scarlet
    berries are guarded by the one-eyed Fomor Sharvan. Grainne's urgent desire for
    the berries leads Diarmait to ask for them, then to kill Sharvan when refused.
    Finn discovers the fugitives after Diarmait signals chess moves with berries from
    the tree, but Angus rescues Grainne by an invisible cloak and Diarmait escapes
    by a leap. A reconciliation follows, though Finn later causes Diarmait's death
    through the hero's vulnerable heel during the boar hunt of Benn Gulban. The narrative
    then links this treachery to the decline and annihilation of the Fianna at Gabhra,
    where Oscar and Cairbré kill each other and nearly all forces fall.
  language: English
  quote_policy: summarized
