canonical_text:
  quote: ''
  summary: The passage describes bonfire rites at Beltaine, midsummer, Samhain, and
    St. John's Day; interprets fire-passage and burning rites as survivals or substitutes
    of human sacrifice; gives examples of cattle and sheep sacrifices offered against
    disease or supernatural anger; and describes Celtic reverence for rivers, including
    oracular rivers and rivers believed to claim human lives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Highland Beltaine, a cake was divided by lot, and the person who drew the
    “burnt piece” had to leap three times over the flames.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Irish midsummer bonfires, men, women, and cattle passed through fire or
    smoke at different stages of the burning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Wales at Samhain, people watched hill-top bonfires until they were declared
    extinct, then raced downhill while shouting that the devil would get the hindmost.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the bonfire customs were not meaningless play but
    “a symbolical human sacrifice.”
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: In France on St. John’s Day, baskets containing living wolves, foxes, and
    cats were burned on bonfires in the presence of town officials until the practice
    was forbidden by law.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports Caesar’s statement that druids made huge wicker-work images,
