canonical_text:
  quote: ''
  summary: The passage contrasts the relatively easy Christian adoption of a love-associated
    goddess or saint, Dwynwen/Brynwyn, with the resistance to Christian adoption attributed
    to Gwyn ap Nudd. It recounts Dwynwen’s vow of celibacy, love for Maelon, vision
    of an oblivion draught that freezes Maelon, her receipt of three boons, and the
    resulting virtues of her shrine and well for lovers. It then recounts St. Collen’s
    encounter with Gwyn near Glastonbury Tor, where a supernatural castle and feast
    appear and then vanish when the saint sprinkles holy water.
  language: English
  quote_policy: summarized
