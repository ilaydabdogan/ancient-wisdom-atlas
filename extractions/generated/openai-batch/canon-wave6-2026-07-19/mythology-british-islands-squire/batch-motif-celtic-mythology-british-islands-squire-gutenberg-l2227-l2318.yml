canonical_text:
  quote: ''
  summary: The passage describes the Fir Bolg, Fir Domnann, and Fir Gaillion partitioning
    Ireland around the Hill of Uisnech, then offers an interpretive account of them
    as pre-Aryan peoples viewed by the Gaels as dark and magic-skilled. It connects
    them with the Fomors and contrasts the children of Danu with the children of Domnu.
    It then narrates the arrival of the Tuatha Dé Danann, their mythical cities and
    four treasures, the Stone of Fál's recognition of the rightful king, the landing
    in cloud on the first of May, the magical storm of fog, fire, and blood sent by
    Morrígú, Badb, and Macha, the Fir Bolg counter-spells, and the first parley between
    warriors of the two armies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ireland is described as partitioned among the Fir Bolg, Fir Domnann, and Fir
    Gaillion, with five provinces meeting at Balor’s Hill, later called the Hill of
    Uisnech.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hill of Uisnech is said to have been believed in early times to mark the
    exact centre of Ireland.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Fir Bolg and related groups are said to have held Ireland from the departure
    of the people of Nemed until the coming of the people of the goddess Danu, with
    Eochaid son of Erc as king at the gods’ arrival.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes these earlier occupants as not really gods, but as a
    pre-Aryan race perceived by the Gaels as semi-divine or half-diabolical.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage associates the earlier occupants with magical rites in inaccessible
    hill forts amid storms and mountain mists, and with tribal names translated as
    darkness or night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage links the Fir Domnann and related groups with the Fomors through
    the name Domnu and presents children of Danu and children of Domnu as opposed
    groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Tuatha Dé Danann are described as enemies of the Fir Bolg and Fomors and
    as the next arrivals; an early account says they came from the sky, while later
    versions place their prior dwelling on earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Tuatha Dé Danann are said to have dwelt in four mythical cities—Findias,
    Gorias, Murias, and Falias—where they learned poetry and magic.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Four chief treasures are listed: Nuada’s sword, Lugh’s lance, the Dagda’s
    cauldron, and the Stone of Fál or Stone of Destiny.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Stone of Fál is said to utter a human cry when touched by the rightful
    King of Erin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tuatha Dé Danann land in a dense cloud on the coast of Ireland on the
    mystic first of May, without being opposed or noticed by the Fir Bolgs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Morrígú, helped by Badb and Macha, spreads magical showers and fog-sustaining
