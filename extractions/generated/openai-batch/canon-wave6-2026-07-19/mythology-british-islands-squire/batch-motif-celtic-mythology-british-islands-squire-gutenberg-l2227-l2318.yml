comparison_claims:
- id: claim:1
  claim: The passage interprets the supernatural conflict between the children of
    Danu and the children of Domnu as reflecting warfare between invading Celts and
    resisting Iberians.
  claim_level: same_function
  target: historical or ethnographic conflict between invading Celt and resisting
    Iberian
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a modern mythographic interpretation within the passage, not
    independent historical evidence.
- id: claim:2
  claim: The passage compares the Danu/Domnu or Celt/Iberian opposition with later
    Irish heroic-cycle hostility between Ulster champions and the Fir Domnann and
    Fir Gaillion, and notes that a few scholars extend the pattern to the High King
    and the Fenians.
  claim_level: same_motif
  target: later Irish heroic cycle and Fenian conflict patterns
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The strongest extension is explicitly attributed only to a few scholars,
    and the passage gives no detailed parallel narrative.
- id: claim:3
  claim: The passage reports that some have identified the Stone of Fál with the Stone
    of Scone used in the Westminster Coronation Chair, while also reporting modern
    archaeological rejection of that identity.
  claim_level: historical_contact
  target: Stone of Scone / Westminster Coronation Chair stone
  evidence_refs:
  - ev:6
  counter_evidence_refs:
  - ev:7
  confidence: low
  limitations: The passage itself states that leading archaeologists held the Stone
    of Scone and the Stone of Tara were never the same.
