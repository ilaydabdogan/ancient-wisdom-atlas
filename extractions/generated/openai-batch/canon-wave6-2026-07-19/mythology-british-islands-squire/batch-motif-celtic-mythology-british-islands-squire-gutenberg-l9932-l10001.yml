- id: claim:1
  claim: The passage presents several British local deity names as functionally equivalent
    expressions of an underworld-god type.
  claim_level: same_function
  target: British tribal names Brân, Urien, Pwyll, March, Mâth, Arawn, and Ogyrvran
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
