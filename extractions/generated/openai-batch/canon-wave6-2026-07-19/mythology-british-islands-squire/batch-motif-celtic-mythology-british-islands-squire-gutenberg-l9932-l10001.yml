- id: claim:2
  claim: The passage cautiously extends the same pattern of one idea under different
    names to Gaelic myth, but says it is less clear there.
  claim_level: same_function
  target: Gaelic myth and the Tuatha Dé Danann compared with British Arthurian followers
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
