    and does not specify individual Gaelic correspondences.
- id: claim:3
  claim: The passage compares Avallon/Avilion and the Land of Summer to Hades understood
    as a paradise of the departed rather than only a primeval subterranean realm.
  claim_level: same_function
  target: Hades as elysium or paradise of the departed
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explanatory within the secondary text and does not
    demonstrate historical contact.
- id: claim:4
  claim: The passage compares the aggregation of tribal deities into a broader Celtic
