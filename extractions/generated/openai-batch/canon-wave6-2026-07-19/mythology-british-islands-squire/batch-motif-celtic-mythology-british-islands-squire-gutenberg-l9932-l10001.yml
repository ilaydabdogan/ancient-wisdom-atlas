  quote: ''
  summary: 'The passage classifies several Celtic and Arthurian figures as local or
    variant expressions of recurring divine functions: underworld rulers, elysian
    lords, heavenly war gods, culture-helping deities, sun-gods, and dark counterparts.
    It discusses Urien, Brân, Arthur, Uther Pendragon, Gwynhwyvar, and Ogyrvran, including
    raven and severed-head imagery, Avallon as an otherworld island, and Ogyrvran’s
    cauldron from which three Muses were born.'
  language: English
  quote_policy: summarized
