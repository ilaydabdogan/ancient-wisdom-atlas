  summary: The passage introduces Chapter IV by framing the ancient Britons as Gaelic
    and British Celts within an Indo-European language context. It argues that related
    Aryan-speaking traditions share mythological groundwork, especially the personification
    of natural powers and the attribution of arts and passions to divine founders.
    It distinguishes mythology from religion by emphasizing ritual, sacred places,
    sacrifice, and priesthood. It identifies Druids as Celtic priests, connects their
    name with tree or oak roots, notes oak and mistletoe ritual importance, and compares
    mistletoe with Norse and Roman sacred-plant traditions.
