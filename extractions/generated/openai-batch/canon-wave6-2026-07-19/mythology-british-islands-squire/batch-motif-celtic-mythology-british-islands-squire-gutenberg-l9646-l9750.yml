canonical_text:
  quote: ''
  summary: The passage argues that Arthur has taken over myths formerly told of Gwydion,
    especially as a culture-bringing figure who contends with the underworld for wealth
    and wisdom. It recounts Arthur's failed swine-capture, imprisonment in Oeth and
    Anoeth, rescue by Goreu, and later Annwn expedition for a magic cauldron. It then
    introduces Taliesin as narrator and excerpts “The Spoiling of Annwn,” naming otherworld
    forts, Gweir's imprisonment, Prydwen voyages, the cauldron warmed by nine maidens,
    the gate of Uffern, and repeated returns of only seven survivors.
  language: English
  quote_policy: summarized
