comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Arthur-myths with Gwydion-myths, saying the
    same stories moved from Gwydion to Arthur and that the correspondence is almost
    exact except for name.
  claim_level: same_motif
  target: Arthur-myths and Gwydion-myths
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This is a reported mythographic comparison in the source passage; it
