- id: claim:2
  claim: The passage presents Arthur's conflict with the underworld for wealth and
    wisdom as functionally parallel to the conflict of Gwydion and the sons of Dôn
    against the sons of Llyr and Pwyll.
  claim_level: same_function
  target: Underworld wealth-and-wisdom conflict in the Gwydion / sons of Dôn cycle
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes broader mythic cycles and does not quote the
    full Gwydion narratives here.
- id: claim:3
  claim: The passage reports that Professor Rhys was inclined to equate the mythical
    British Celtic Taliesin with the Gaelic Ossian.
  claim_level: same_function
  target: Gaelic Ossian as a comparable mythical poet figure
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the comparison but provides no detailed episode-by-episode
    evidence for it.
