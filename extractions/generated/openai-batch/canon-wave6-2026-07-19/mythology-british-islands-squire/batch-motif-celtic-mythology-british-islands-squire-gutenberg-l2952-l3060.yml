canonical_text:
  quote: ''
  summary: Lugh searches for his missing father, learns from the speaking earth that
    he has been murdered, buries him with a barrow and ogam pillar, then goes to Tara.
    In the assembly he obtains a pledge from the sons of Tuirenn to pay a blood-fine,
    and only afterward explains that the fine consists of difficult or magical objects
    from distant places, including healing apples, a healing pigskin, a fiery spear,
    sea-running horses and chariot, regenerating pigs, a hunting hound, and an undersea
    cooking-spit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lugh expected his father's return, searched for him, and was unable to trace
    him beyond the Plain of Muirthemne until the earth spoke and reported the murder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lugh dug up his father's corpse, confirmed the manner of death, mourned, reburied
    him, raised a barrow, and set up an ogam-inscribed pillar with his name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Tara, Lugh entered a hall filled with the people of the goddess Danu and
    used the chiefs' chain to request a hearing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lugh asked what vengeance should be taken against someone who had murdered
    a father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nuada and the others, including the sons of Tuirenn, stated that a father-murderer
    should be hewn limb from limb.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lugh identified the sons of Tuirenn as the murderers and demanded that they
    remain in the hall until they settled the blood-fine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Iuchar and Iucharba favored admitting guilt, but Brian feared that confession
    would make Lugh demand their deaths; Brian therefore said they would pay the same
    fine as if guilty while not admitting the killing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sons of Tuirenn swore and gave sureties before the Tuatha Dé Danann to
    pay the fine Lugh named.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The first demanded objects were three apples from the Garden of the Hesperides
    in the east of the world, described as golden, honey-tasting, healing, inexhaustible,
    and returning to the thrower's hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The demanded pig's-skin of Tuis, King of Greece, was said to heal wounded
    or sick persons if life remained and to turn streams of water into wine for nine
    days.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The demanded spear of Pisear, King of Persia, was poisoned, irresistible in
    battle, and so fiery that its blade had to be kept under water to avoid destroying
    its city.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The demanded horses and chariot of Dobhar, King of Sicily, were said to run
    equally well over land and sea.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The demanded seven pigs of Easal, King of the Golden Pillars, could be killed
