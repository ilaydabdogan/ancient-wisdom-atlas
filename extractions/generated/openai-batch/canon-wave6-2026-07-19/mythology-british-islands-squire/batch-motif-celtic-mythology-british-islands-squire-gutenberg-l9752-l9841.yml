canonical_text:
  quote: ''
  summary: The passage summarizes Taliesinic allusions to Arthur’s expedition to Caer
    Ochren and describes Annwn/Caer Sidi as a revolving, glass-like otherworld fortress
    containing feasting, a lamp, a cauldron of inspiration, nine pythonesses, a deathless
    chair, organs, fire, ocean streams, and a well. It then discusses possible geographical
    associations for Caer Sidi and presents Squire’s comparative account of older
    Welsh divine figures being reworked into Arthurian figures, including light and
    dark twin sons, Myrddin/Merlin as a high god of the Arthurian cycle, and Elen
    Lwyddawg as his host-leading consort associated with roads and foundations.
  language: English
  quote_policy: summarized
