canonical_text:
  quote: ''
  summary: 'Conchobar and the Ulster court try to keep Cuchulainn from returning to
    battle. The daughters of Calatin create phantom armies and battle noises, then
    one deceives him by assuming the form of a lover and reporting the devastation
    of Ulster. As Cuchulainn leaves, ominous signs appear: his horse sheds blood,
    wine turns to blood, a sídhe washer foretells his death, and hags induce him to
    eat taboo hound flesh. Three druids demand his spears under threat of satire;
    the spears are then used by enemies to kill Laeg, wound the Gray of Macha, and
    fatally wound Cuchulainn. Wounded, he asks leave to drink from a nearby lake.'
  language: English
  quote_policy: summarized
