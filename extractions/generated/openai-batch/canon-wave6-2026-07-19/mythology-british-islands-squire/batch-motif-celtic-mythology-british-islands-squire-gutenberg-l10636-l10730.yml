canonical_text:
  quote: ''
  summary: Kulhwch and his companions meet Custennin, gain secret help toward meeting
    Olwen, confront the giant Hawthorn, repeatedly turn Hawthorn's poisoned darts
    back upon him, and then hear Hawthorn's enormous bride-price demands, including
    impossible agricultural tasks and many magical treasures culminating in the pursuit
    of Twrch Trwyth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travelers come to a castle on an open plain where countless sheep feed
    near a mound with a monstrous shepherd and dog.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Menw casts a spell over the dog before the party approaches the shepherd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Custennin is identified as Hawthorn's brother, and Custennin's wife is identified
    as the sister of Kulhwch's mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hawthorn has reduced Custennin to servitude and killed all but one of Custennin's
    twenty-four sons; the surviving son is hidden in a stone chest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Custennin welcomes Kulhwch and Arthur's embassy, promises secret help, and
    Custennin's wife arranges a secret meeting between Kulhwch and Olwen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: On approaching Hawthorn's castle, the party kills nine porters and nine watch-dogs
    and enters the hall without alarm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hawthorn's eyebrows have fallen over his eyes and must be raised with forks
    so that he can see the visitors.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Hawthorn throws poisoned darts on three visits; Bedwyr, Menw, and Kulhwch
    each catch a dart and return it, wounding Hawthorn in the knee, body, and eye
    respectively.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:9
  text: After being struck through the eye, Hawthorn complains of lasting injury and
    curses the fire in which the poisoned iron was forged.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After warnings against further dart-throwing, Hawthorn sits opposite Kulhwch
    to discuss the bride-price for Olwen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hawthorn requires a vast hill to be uprooted, leveled, ploughed, sown, and
    harvested in one day, with Amaethon, Govannan, and three pairs of magic oxen required
    for the work.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hawthorn also demands the return of nine bushels of flax sown in his youth
    for Olwen's white wimple, and honey nine times sweeter than the honey of the virgin
    swarm.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The demanded wedding treasures include a magic honey vessel, an inexhaustible
