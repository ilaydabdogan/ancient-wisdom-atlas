candidate_motifs:
- id: motif:1
  label: Jealous childless wife persecutes husband’s children
  taxonomy_refs: []
  basis: Aeife is childless, fears Lêr loves his children more than her, plots their
    deaths, and then enchants them when her servants refuse murder.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives the jealousy and childless-wife elements explicitly,
    but no external motif index is cited.
- id: motif:2
  label: Human children transformed into swans while retaining human speech and minds
  taxonomy_refs:
  - shapeshifter
  basis: Aeife changes the children into swans, but they retain human speech and minds
    and speak to Lêr in swan form.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The taxonomy label 'shapeshifter' is used broadly; the children are transformed
    by another’s magic rather than voluntarily changing shape.
- id: motif:3
  label: Fixed triple exile over nine hundred years
  taxonomy_refs:
  - departure
  - return
  basis: Aeife assigns three successive three-hundred-year periods at Lake Darvra,
    the Sea of Moyle, and Irros Domnann/Isle of Glora; after the final stage they
    are free to return.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:11
  - ev:15
  confidence: medium
  cautions: The 'departure' and 'return' taxonomy refs capture the movement pattern
    only generally; the passage frames the experience as exile and penance.
- id: motif:4
  label: Magical wrongdoing punished by reciprocal transformation
  taxonomy_refs:
  - divine_judgment
  basis: Bodb, king of the gods, cannot undo Aeife’s enchantment but compels her to
    name the shape she most fears and transforms her into it.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The judgment is performed by a divine king, but the passage does not explicitly
    call it divine judgment.
- id: motif:5
  label: Song granted as consolation in enchantment
  taxonomy_refs: []
  basis: Aeife says the transformed children will keep their minds, suffer no grief
    at the transformation, and be able to sing the softest and sweetest songs ever
    heard.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is passage-specific and not tied to a supplied taxonomy family.
- id: motif:6
  label: Law protecting an animal because of enchanted persons
  taxonomy_refs: []
  basis: After the swan-children leave Lake Darvra, the Milesians make it law in Ireland
    that no one should harm a swan.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives the law directly but does not state a broader comparative
    category.
- id: motif:7
  label: Christian baptism breaks pagan spell
  taxonomy_refs: []
  basis: Saint Caemhoc baptizes the swan-children; the holy water is said to break
    the pagan spell and restore them to human shape.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: No supplied taxonomy reference precisely matches the Christian rite breaking
    an enchantment.
- id: motif:8
  label: Return to human form followed by rapid aging, death, and communal burial
  taxonomy_refs:
  - return
  basis: After baptism, the children return to human shape as three aged men and an
    ancient woman, die soon afterward, and are buried together in one grave.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The taxonomy ref 'return' is broad and refers here to return of form rather
    than journey alone.
