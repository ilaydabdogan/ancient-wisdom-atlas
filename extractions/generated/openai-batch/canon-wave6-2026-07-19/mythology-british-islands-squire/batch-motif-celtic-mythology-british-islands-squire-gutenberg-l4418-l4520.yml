    hundred years on the Sea of Moyle, and three hundred years at Irros Domnann and
    the Isle of Glora.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Aeife said the children would keep their human minds, feel no grief at knowing
