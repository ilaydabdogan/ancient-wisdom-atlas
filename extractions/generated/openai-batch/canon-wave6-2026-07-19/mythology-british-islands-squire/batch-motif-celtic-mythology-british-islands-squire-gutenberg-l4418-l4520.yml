  text: Aeife took the four children to Lake Darvra, sent them into the water to bathe,
    made an incantation, touched them with a druidical wand, and changed them into
    swans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The transformed children retained human speech and minds.
  category: attribute
