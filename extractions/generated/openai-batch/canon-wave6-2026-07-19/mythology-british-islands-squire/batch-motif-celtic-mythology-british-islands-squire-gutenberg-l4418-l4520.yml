canonical_text:
  quote: ''
  summary: Aeife, jealous of Lêr’s children, transforms them into swans and imposes
    three successive three-hundred-year periods of exile. The children retain human
    minds, speech, and song. Lêr and Bodb cannot undo the spell, but Bodb punishes
    Aeife by transforming her into a demon of the air. The swan-children endure their
    exile until Saint Caemhoc baptizes them; the holy water breaks the spell, restoring
    them as aged humans shortly before their deaths and burial together.
  language: English
  quote_policy: summarized
