canonical_text:
  quote: ''
  summary: Fergus is delayed by hospitality and sends Deirdre and the sons of Usnach
    to Emain Macha under his sons Illann and Buinne. Deirdre has bloody visions, but
    the group proceeds. Conchobar tests whether Deirdre is still beautiful, receives
    a false report from Levarcham and then a confirming report from an injured male
    spy. Conchobar orders an attack on the Red Branch House. Buinne deserts for a
    land-bribe that turns barren, while Illann defends the house and is killed after
    a magic shield calls Conall. The sons of Usnach attempt to escape with Deirdre,
    but Cathbad raises an illusory stormy sea; they are captured, condemned despite
    a promise, and beheaded by a Norwegian using Naoise’s divine sword. Deirdre soon
    dies after making an elegy for them.
  language: English
  quote_policy: summarized
