candidate_motifs:
- id: motif:1
  label: ominous vision before fatal betrayal
  taxonomy_refs: []
  basis: Before the party reaches Emain Macha, Deirdre sees the sons of Usnach and
    Illann without heads and a cloud of blood over them; the passage later narrates
    their deaths.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage presents the visions and later deaths but does not explicitly
    label the visions as prophecy.
- id: motif:2
  label: contested beloved whose beauty prompts deadly pursuit
  taxonomy_refs:
  - stolen_beloved
  basis: Conchobar seeks reports on Deirdre’s beauty, orders everyone inside the Red
    Branch House killed except her, and Deirdre later says she forsook him for Naoise’s
    love.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:9
  confidence: high
  cautions: The taxonomy fit is broad; this excerpt focuses on the fatal return and
    execution rather than the earlier abduction or elopement.
- id: motif:3
  label: royal safe lodging becomes a trap
  taxonomy_refs: []
  basis: Conchobar has the Red Branch palace placed at the party’s disposal, then
    later orders the house burned and its occupants slain except Deirdre.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage does not state whether the initial lodging offer itself was
    knowingly deceptive.
- id: motif:4
  label: contrasted guardians, one faithful and one bribed
  taxonomy_refs: []
  basis: Buinne deserts after accepting land and friendship, while Illann continues
    fighting and dies.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a structural motif candidate based on paired behavior in the episode.
- id: motif:5
  label: traitor’s reward turns barren
  taxonomy_refs: []
  basis: The land given to Buinne after his desertion becomes barren that same night
    in indignation at being owned by a traitor.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No deity or agent of punishment is named in the passage.
- id: motif:6
  label: magic alarm weapon brings mistaken intervention
  taxonomy_refs: []
  basis: The shield Moaner roars when Fiacha is in danger; Conall hears it, thinks
    his king is endangered, and kills Illann without asking questions.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The weapon is a shield rather than a voice-bearing person; the passage
    gives only one episode of its use.
- id: motif:7
  label: illusory water obstacle used for capture
  taxonomy_refs: []
  basis: Cathbad raises a glamour of a stormy sea around the fleeing sons of Usnach;
    they throw away weapons and swim on dry land until they are seized.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The sea is explicitly illusory, so it should not be treated as a literal
    flood or voyage.
- id: motif:8
  label: broken promise after magical assistance
  taxonomy_refs: []
  basis: Conchobar obtains Cathbad’s spell by promising to spare the sons of Usnach,
    but then condemns them to death after their capture.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports no immediate consequence for the broken promise.
- id: motif:9
  label: single divine sword-stroke beheads a brother trio
  taxonomy_refs: []
  basis: The executioner uses Naoise’s sword Retaliator, given by Manannán son of
    Lêr, and one blow cuts off all three brothers’ heads.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text attributes the sword to Manannán but does not further explain
    its powers.
- id: motif:10
  label: beloved refuses life after the slain lover
  taxonomy_refs:
  - annihilation_union
  basis: Deirdre’s elegy says no one should suppose she will remain after Naoise,
    Ardan, and Ainle, and the narrator says most stories agree she does not survive
    them many hours.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage states grief and brief survival after the deaths, not an explicit
    metaphysical union through death.
