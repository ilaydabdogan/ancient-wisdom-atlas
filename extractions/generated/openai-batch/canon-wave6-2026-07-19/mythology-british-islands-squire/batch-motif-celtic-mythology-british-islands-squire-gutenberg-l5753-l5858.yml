canonical_text:
  quote: ''
  summary: The passage introduces Gaelic love-stories as part of the Irish heroic
    age, then summarizes Cuchulainn's wooing of Emer and his later involvement with
    Fand, an otherworld woman of the Sídhe. Fand sends Liban to Cuchulainn, Laeg visits
    the Happy Plain, Cuchulainn stays with Fand in the Celtic Paradise, and Emer confronts
    them at a trysting-place with armed maidens. Emer and Fand speak with sorrow and
    dignity, and Fand renounces Cuchulainn.
  language: English
