canonical_text:
  quote: ''
  summary: Manawyddan threatens to hang a captured mouse as a thief. A priest and
    then a bishop try to ransom it. Manawyddan refuses money and horses and instead
    demands the release of Rhiannon and Pryderi, removal of the charm on Dyfed, a
    promise against future enchantment, and an oath against revenge. The bishop reveals
    himself as Llwyd son of Kilcoed, says the mouse is his wife, and explains that
    he enchanted Dyfed and sent his household in the guise of mice to steal the corn
    in revenge for Gwawl. After Rhiannon and Pryderi appear, Manawyddan releases the
    mouse; Llwyd changes her into a young woman with a wand, and Dyfed is restored
    to cultivation. The narrator frames this as a victory of light over darkness.
  language: English
  quote_policy: summarized
