canonical_text:
  quote: ''
  summary: The passage recounts Etain’s abduction and glass imprisonment by Angus,
    her transformation into a fly by a rival, her ingestion in beer and rebirth as
    a mortal-seeming woman, her marriage to King Eochaid, and Mider’s attempts through
    chess wagers to reclaim her. After winning a second wager, Mider appears despite
    guards and sings to Etain of a deathless, unseen divine country under enchanted
    hills.
  language: English
  quote_policy: summarized
