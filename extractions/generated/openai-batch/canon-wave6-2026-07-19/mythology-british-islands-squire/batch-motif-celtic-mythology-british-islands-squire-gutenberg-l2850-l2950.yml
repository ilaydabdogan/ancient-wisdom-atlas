canonical_text:
  quote: ''
  summary: The passage frames the following episode as a Gaelic analogue to the Argonautica.
    Fomorian tax-gatherers demand tribute from the Tuatha Dé Danann, but Lugh arrives
    in Manannán’s gear and kills most of them. The Fomorian leaders react with alarm
    and hold council. Meanwhile Lugh sends messengers to gather the Tuatha Dé Danann;
    Cian encounters the hostile sons of Tuirenn, shape-shifts into a pig, is hunted
    after Brian transforms his brothers into hounds, returns to human form, warns
    of a severe blood-fine, and is slain and buried only after repeated rejection
    by the earth.
  language: English
  quote_policy: summarized
