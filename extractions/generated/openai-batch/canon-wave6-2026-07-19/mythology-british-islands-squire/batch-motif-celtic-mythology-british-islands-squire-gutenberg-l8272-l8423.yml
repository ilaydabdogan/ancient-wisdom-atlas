canonical_text:
  quote: ''
  summary: The passage surveys deities attested in Roman Britain, distinguishing native
    British gods from imported gods carried by Roman imperial communities. It then
    argues that several Gaulish, Gaelic, and British divine names and cultic ideas
    correspond across the Celtic world, including war, sun, eloquence, healing, and
    tutelary goddesses, and concludes that Gaul, Gael, and Briton shared a common
    mythological heritage.
  language: English
  quote_policy: summarized
