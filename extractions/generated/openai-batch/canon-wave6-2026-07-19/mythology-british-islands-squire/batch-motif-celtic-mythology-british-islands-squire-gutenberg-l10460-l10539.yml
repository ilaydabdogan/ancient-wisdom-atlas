canonical_text:
  quote: ''
  summary: 'The passage introduces Welsh Arthurian materials as mythological rather
    than pseudo-historical, emphasizing Arthur''s victories against Hades. It summarizes
    the opening of “The Dream of Rhonabwy”: Rhonabwy sleeps on a yellow calf-skin,
    sees a vision, encounters the terrifying Iddawc on a monstrous horse, learns Iddawc
    caused Camlan by distorting Arthur''s message to Medrawt, and is brought to Arthur''s
    camp at Rhyd y Groes. Arthur remarks on the small stature of the men compared
    with earlier guardians of the island. The passage then describes the tale as a
    catalogue of Arthur''s followers and contrasts it with “Kulhwch and Olwen,” presented
    as a catalogue of Britain''s treasures and compared to the Gaelic tale of the
    three sons of Tuirenn.'
  language: English
  quote_policy: summarized
