canonical_text:
  quote: ''
  summary: The passage opens the chapter on the war with the giants. The Morrígú reports
    the Fomor landing before Samhain, and the Dagda delays them by visiting their
    camp, where he is forced to consume a huge porridge feast. The Tuatha Dé Danann
    and Fomors then face each other in battle, with daily duels. The Fomors observe
    that Tuatha weapons and warriors return restored, send Ruadan to spy on Goibniu’s
    forge, and then attack him. Goibniu is healed at the spring of health, but Octriallach
    and companions block the spring with stones, forming a cairn. The Fomors then
    prepare for pitched battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After seven years of preparation, the Morrígú discovers that the Fomors have
    landed in Erin before the Day of Samhain and sends word to the Dagda.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dagda orders druids and sorcerers to go to the ford of the River Unius
    and utter incantations against the Fomors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Because the people of the goddess Danu are not fully ready for battle, the
    Dagda visits the Fomorian camp as an ambassador to gain time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Fomors prepare a very large porridge feast using their king’s cauldron,
    new milk, meal, bacon, and whole carcasses, and threaten to kill the Dagda if
    he does not eat it all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Dagda eats all of the porridge, leaves with a swollen stomach, and the
    Fomors laugh at him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The delay gives the Tuatha Dé Danann time to collect their forces, and the
    two armies face one another on the eve of Samhain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator states that the war of gods and giants mirrored Gaelic warfare,
    with the main armies standing still while daily single combats took place.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fomor weapons and slain champions do not return, while Tuatha weapons reappear
    restored and slain Tuatha warriors return the next day unhurt.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Fomors send Ruadan, son of Bress and Brigit and half-giant and half-god,
    disguised as a Tuatha Dé Danann warrior to discover the secret of the prodigies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ruadan sees Goibniu, Luchtainé, and Credné making weapons at the forge with
    repeated sets of three blows and skillful fitting of bronze nails.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ruadan wounds Goibniu with a javelin, but Goibniu pulls it out and throws
    it back, mortally wounding Ruadan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Diancecht and Airmid attend the spring of health, where killed or wounded
    Tuatha Dé Danann are plunged into wonder-working water and restored to life and
    health.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Octriallach and companions carry stones from the River Drowes at night, drop
