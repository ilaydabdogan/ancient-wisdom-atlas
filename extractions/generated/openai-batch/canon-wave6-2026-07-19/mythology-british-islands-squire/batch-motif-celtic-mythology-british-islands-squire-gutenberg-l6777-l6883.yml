  - ev:2
  confidence: medium
  cautions: The two figures are not shown acting together as a paired unit; the taxonomy
    match is based only on the stated number and survival.
- id: motif:2
  label: Goddess or divine woman invites a mortal hero to become her beloved
  taxonomy_refs:
  - divine_beloved
  - departure
  basis: Niamh, described as a goddess in the comparison and as Manannán’s daughter,
    chooses Ossian as her lover and carries him away on a fairy horse.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage frames the relationship as loverhood, not a formal marriage.
- id: motif:3
  label: Journey over water to a deathless otherworld
  taxonomy_refs:
  - afterlife_journey_map
  - mystical_quest
  - departure
  basis: Ossian rides with Niamh over the waves to the country of the gods and the
    Land of the Young, where decline, death, and decay are absent.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The destination is not described as a realm of the dead in the passage,
