canonical_text:
  quote: ''
  summary: The passage recounts the survival of Caoilte and Ossian after the Fenian
    heroic age. Caoilte joins the Tuatha Dé Danann, fights Lêr, takes a fairy palace,
    and becomes associated with the Sídhe. Ossian is invited by the goddess Niamh,
    daughter of Manannán, to ride over the sea to the Land of the Young, a country
    of abundance and no decay. After three hundred years he returns to Ireland under
    a prohibition against touching the ground. When he breaks this condition while
    lifting a slab, the fairy horse vanishes and he becomes an aged man. St. Patrick
    later tries to convert him, but Ossian remains loyal to the Fenians and dies in
    that loyalty.
  language: English
  quote_policy: summarized
