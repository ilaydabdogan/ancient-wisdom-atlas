candidate_motifs:
- id: motif:1
  label: Two survivors of a vanished heroic company
  taxonomy_refs:
  - survivor_pair
  basis: The passage explicitly states that only Caoilte and Ossian survive among
    the greater Fenian figures, and both are then placed in post-heroic contexts.
  evidence_refs:
