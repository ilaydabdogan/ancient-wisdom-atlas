canonical_text:
  quote: ''
  summary: After a prisoner exchange, Gobhan directs Gavidjeen Go to seek Balor’s
    gray cow as payment. The cow’s straying leads Cian to Manannán, who transports
    him by coracle to Balor’s cold kingdom. Cian becomes Balor’s fire-maker and cook,
    enters the tower where Balor has confined his daughter because of a prophecy,
    and receives her baby and the cow’s byre-rope. Cian, the baby, and the cow escape
    with Manannán, who overcomes Balor’s storm and sea-fire. Cian gives the boy to
    Manannán as the agreed reward; the boy is named Dul-Dauna/Ioldanach and later
    kills Balor, fulfilling the prophecy.
  language: English
  quote_policy: summarized
