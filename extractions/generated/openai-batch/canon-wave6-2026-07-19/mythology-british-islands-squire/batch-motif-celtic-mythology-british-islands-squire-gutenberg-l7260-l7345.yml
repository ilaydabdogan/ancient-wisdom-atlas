candidate_motifs:
- id: motif:1
  label: Bargained reward claimed as the whole child
  taxonomy_refs:
  - sacred_exchange
  basis: Manannán bargains for half of whatever Cian gains before returning; when
    Cian gains only the boy, he gives the boy whole to Manannán, who says the child
    was what he wanted.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage frames the exchange as a bargain and reward, but it does not
    explicitly call the exchange sacred; the taxonomy reference is therefore functional
    rather than literal.
- id: motif:2
  label: Quest for a strayed extraordinary cow across the sea
  taxonomy_refs:
  - mystical_quest
  basis: The cow has extraordinary milk yield and cannot be retained without her rope;
    Cian loses her, follows her trail to the sea, and is transported by Manannán to
    Balor’s kingdom to recover what is connected with her.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage presents a recovery pursuit rather than using the term quest;
    the 'mystical_quest' reference is based on the sea-crossing and Manannán’s intervention.
- id: motif:3
  label: Prophesied grandson born despite confinement and later kills grandfather
  taxonomy_refs:
  - miraculous_child
  basis: A druid prophesies that Balor’s daughter will bear a son who will kill his
    grandfather; Balor confines her, but the child is born, taken away, grows up,
    and kills Balor.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:11
  confidence: medium
  cautions: The child is prophesied and heroic, but the birth is not described as
    miraculous in the passage.
- id: motif:4
  label: Hidden tower maiden visited through opened locked doors
  taxonomy_refs: []
  basis: Balor confines his daughter in a guarded tower and allows her no male visitor
    but himself; Cian has the ability to open locked doors, enters, lights a fire,
    and continues visiting until a child is born.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the episode in compressed folktale summary and does
    not specify all circumstances of the visits.
- id: motif:5
  label: Elemental contest at sea between hostile incantations and stronger counter-magic
  taxonomy_refs: []
  basis: Balor uses incantations to raise a storm and turn the sea to fire; Manannán’s
    greater druidism stills the storm and extinguishes the fire with a stone.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage describes a local escape episode, not a cosmic or world-destroying
    event.
- id: motif:6
  label: Fostered heroic child named by rescuer
  taxonomy_refs: []
  basis: After the escape, Cian gives the boy to Manannán; Manannán names him and
    predicts that no champion will equal him.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not detail the boy’s upbringing beyond the transfer,
    naming, and later adulthood.
- id: motif:7
  label: Fatal prophecy fulfilled by unrecognized kin-slaying
  taxonomy_refs: []
  basis: The grown boy throws a dart at a man in a ship without asking who he is;
    the man is Balor, and the narrator states that Balor is slain by his grandson
    in accordance with the prophecy.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage says the boy does not ask who the stranger is, but it does
    not explicitly state whether he knows or does not know Balor’s identity.
