canonical_text:
  quote: ''
  summary: Rhiannon bears Pwyll a son after a period without an heir, but the child
    vanishes while six women assigned to watch her sleep. The women fabricate evidence
    that Rhiannon devoured the child, and she is condemned to a humiliating penance
    at the palace gate. Teirnyon later interrupts a mysterious May-day theft of a
    newborn colt, finds a swaddled baby, fosters him, recognizes his likeness to Pwyll,
    and returns him to Rhiannon. The boy is acknowledged as Pwyll's son and named
    Pryderi, meaning “trouble.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pwyll and Rhiannon are without an heir for three years; nobles of Dyfed petition
    Pwyll to take another wife, and a son is born before the end of a requested year's
    delay.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six women set to watch over Rhiannon all fall asleep on the night of the son's
    birth, and when they wake the boy has vanished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The six women, fearing forfeiture of their lives, agree to swear that Rhiannon
    ate her child and arrange puppies' blood and bones as false evidence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rhiannon swears that she knows nothing of her son's death; the women persist
    in the accusation, and the druids condemn her on their evidence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pwyll does not put Rhiannon away; she is assigned a seven-year penance of
    sitting by a horse-block outside the gate and offering to carry visitors into
    the palace on her back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage links the child's disappearance with the disappearance every first
    of May of colts foaled by Teirnyon's beautiful mare.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Teirnyon has the mare brought into a house and watches fully armed; after
    a colt is born, a clawed arm comes through the window and grips the colt's mane.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Teirnyon hacks at the clawed arm with his sword, cuts it off, hears wailing,
    opens the door, and finds a baby in swaddling clothes wrapped in a satin mantle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Teirnyon and his wife adopt the baby and call him Gwri Wallt Euryn, translated
    in the passage as “Gwri of the Golden Hair.”
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: As the boy grows, Teirnyon thinks he increasingly resembles Pwyll and remembers
    that he found him on the same night Rhiannon lost her child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Teirnyon and his wife agree that the found baby must be Rhiannon's lost child
    and decide it is not right to keep another person's son while Rhiannon is being
    punished wrongfully.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Teirnyon takes the boy to Narberth, where Rhiannon is sitting by the gate;
    Teirnyon tells the story at supper and presents her son to her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: People in the palace accept that the boy must be Pwyll's son, and Pendaran
    Dyfed gives him the name Pryderi, meaning “trouble,” from Rhiannon's utterance
    at his restoration.
  category: action
  evidence_refs:
  - ev:8
