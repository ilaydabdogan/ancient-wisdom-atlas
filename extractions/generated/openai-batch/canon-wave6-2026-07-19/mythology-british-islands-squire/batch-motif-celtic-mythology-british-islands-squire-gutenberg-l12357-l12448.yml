canonical_text:
  quote: ''
  summary: The passage describes the decline of public Celtic pagan worship in Britain
    through Roman suppression of druidic practices and later Christian displacement.
    It summarizes the destruction of sacred groves, altars, idols, and priestly authority;
    cites Gildas on abandoned idols and formerly honored natural places; recounts
    traditions of Saint Columba overcoming Pictish druids and Saint Patrick defeating
    the idol of Cromm Cruaich; and concludes that suppressed pagan rites and names
    survived among the peasantry.
  language: English
