canonical_text:
  quote: ''
  summary: 'The passage recounts Gwyn’s rivalry with Gwyrthur for Creudylad, Arthur’s
    ruling that the rivals fight for her every first of May, and the author’s seasonal
    interpretation of the episode. It then describes Dôn’s kin: Mâth as an underworld
    ruler and teacher of magical lore to Gwydion; Gwydion and his siblings as divine
    figures associated with useful arts; Arianrod as Gwydion’s sister-wife; the twin
    birth of Dylan and Lleu; Dylan’s sea nature, death by Govannan, and wave-mourning
    traditions; and Lleu’s rapid growth, visit to Arianrod’s castle, and Arianrod’s
    destiny that he remain nameless until she names him.'
  language: English
  quote_policy: summarized
