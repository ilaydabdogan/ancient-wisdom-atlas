canonical_text:
  quote: ''
  summary: 'The passage interprets figures in Malory’s Arthurian romance as transformed
    British mythological beings. It describes Merlin/Myrddin as a sky-god-like enchanter,
    recounts his confinement beneath a stone by Nimue/Vivien, links that episode to
    other imprisonment images, identifies Elen under several Elaine figures, and concludes
    by naming three major Celtic mythic motifs: the birth of the sun-god, the struggle
    of light and darkness, and the raid of the underworld for human benefit.'
  language: English
  quote_policy: summarized
