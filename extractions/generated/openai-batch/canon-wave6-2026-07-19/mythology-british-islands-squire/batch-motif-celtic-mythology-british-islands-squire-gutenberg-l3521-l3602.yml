canonical_text:
  quote: ''
  summary: During the battle between the Tuatha Dé Danann and the Fomors, Lugh escapes
    the guards set over him, rallies the Tuatha Dé Danann, and is recognized by the
    Fomors through the radiance of his face. In the fighting, Balor kills Nuada and
    Macha, then confronts his grandson Lugh. Balor’s deadly eye is lifted open, but
    Lugh strikes it out with a magic tathlum, causing further destruction among the
    Fomors. The blinding turns the battle; the Morrígú encourages the people of Danu,
    who drive the Fomors back under the sea.
  language: English
  quote_policy: summarized
