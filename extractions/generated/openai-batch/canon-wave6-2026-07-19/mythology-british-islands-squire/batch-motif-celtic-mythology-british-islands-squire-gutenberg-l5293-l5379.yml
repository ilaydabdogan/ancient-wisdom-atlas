canonical_text:
  quote: ''
  summary: Medb coerces the reluctant Ferdiad, former companion and fellow-pupil of
    Cuchulainn, into fighting Cuchulainn. The two former comrades duel over several
    days, exchange provisions and medicines, then part in sorrow before Cuchulainn
    kills Ferdiad with the gae bolg and mourns him. Cuchulainn, grievously wounded,
    sends Sualtam to summon aid from Conchobar. Sualtam is accidentally decapitated
    while giving the alarm, and his severed head continues to cry the warning. Conchobar
    swears a cosmic oath to restore the stolen cattle and women, Ulster rallies, and
    Cuchulainn causes Fergus to retreat by invoking a prior oath. Medb's army flees.
    The Brown Bull of Cualgne kills Ailill's White-horned bull, then returns to Cualgne,
    turns destructive, and dies. The passage identifies this as the end of the Táin
    Bó Chuailgné.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medb sends for Ferdiad, described as a great champion of the Iberian Men of
    Domnu and a former companion and fellow-pupil of Cuchulainn with Scathach.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ferdiad does not want to fight Cuchulainn, but Medb threatens him with satirical
    lampoons and lasting shame, offers rewards and honours, and binds her promises
    with six sureties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cuchulainn welcomes Ferdiad, but Ferdiad says he has come to fight rather
    than as a friend; Cuchulainn appeals to their past together, but Ferdiad says
    he cannot return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the first two days of fighting, neither Cuchulainn nor Ferdiad gains advantage,
    and they maintain gestures of companionship, including kissing, exchanging food,
    drink, herbs, and medicines, and pairing their horses and charioteers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of the third day the two part gloomily, expecting that one must
    fall the next day, and their horses and charioteers are no longer paired.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the fourth day Cuchulainn kills Ferdiad by casting the gae bolg at him
    from underneath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Ferdiad is dying, Cuchulainn's battle-fury passes; he carries Ferdiad
    across the river so that he will be with the men of Ulster in death, then weeps
    over him and laments him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cuchulainn is so wounded that he cannot let clothing touch his skin, uses
    hazel-sticks and grass to hold it off, and has no unwounded place except the left
    hand that held the shield.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sualtam, Cuchulainn's reputed father, finds Cuchulainn wounded and bloody;
    Cuchulainn forbids him to weep or avenge him and sends him to Emain Macha to ask
    Conchobar for immediate aid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sualtam rides Cuchulainn's war-horse, the Gray of Battle, to Emain Macha and
    cries three times that men are being killed, women carried off, and cattle lifted
    in Ulster.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Cathbad denounces the disturbance, Sualtam turns away sharply; the horse
    rears, the shield strikes Sualtam's neck, and he is decapitated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The startled horse returns into Conchobar's stronghold, while Sualtam's severed
    head continues to cry the same warning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Conchobar swears by the heavens, earth, and sea that he will restore every
    cow to her stable and every woman to her home unless the cosmic order itself fails.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Conchobar sends messengers to rally Ulster; a great battle follows, and Cuchulainn
    rises and comes to it despite his wounds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Cuchulainn reminds Fergus of an oath to run from him when called upon; Fergus
    runs, and Medb's army flees when it sees its leader running.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Brown Bull of Cualgne fights Ailill's White-horned bull, tears him limb
    from limb, carries pieces on his horns, and drops body parts at named places.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: After killing the White-horned bull, the Brown Bull returns to Cualgne, turns
    mad, kills those who cross his path, and dies when his heart bursts with bellowing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage states that these events are the end of the war called Táin Bó
    Chuailgné, the Driving of the Cattle of Cooley.
  category: other
  evidence_refs:
  - ev:11
