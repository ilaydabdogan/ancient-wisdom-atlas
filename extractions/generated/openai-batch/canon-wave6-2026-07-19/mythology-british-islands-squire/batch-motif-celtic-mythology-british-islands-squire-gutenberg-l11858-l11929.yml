canonical_text:
  quote: ''
  summary: 'The passage recounts Squire''s discussion of Lludd, Creudylad/Cordeilla/Cordelia,
    and the Leir legend: Leir tests the affection of his three daughters, disinherits
    the truthful Cordeilla, loses power to the husbands of his elder daughters, seeks
    Cordeilla''s aid in Gaul, is restored to the throne by Aganippus, and is later
    buried by Cordeilla in an underground vault beneath the River Sore. The author
    interprets the tale as mythological in connection with Llyr as a subaqueous and
    subterranean deity identified with Janus and compared to Dis Pater.'
  language: English
  quote_policy: summarized
