canonical_text:
  quote: ''
  summary: Diancecht kills his son Miach after Miach surpasses him in healing; healing
    plants grow from Miach’s grave and are sorted by Airmid, but Diancecht scatters
    them, causing universal cures to be lost. Bress mistreats the poet Cairpré, whose
    magical satire blemishes Bress and causes his abdication in favor of Nuada. Bress
    seeks help from the undersea Fomors, who plan to overwhelm Ireland. At Tara, Lugh
    arrives, claims mastery of many arts, gains admission as the Master of all Arts,
    wins at chess, sits in the sage’s seat, and surpasses Ogma’s strength feat with
    a great stone.
  language: English
  quote_policy: summarized
