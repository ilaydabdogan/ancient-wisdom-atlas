canonical_text:
  quote: ''
  summary: Lugh ensures that the sons of Tuirenn deliver the demanded blood-fine treasures
    before remembering the remaining task of giving three shouts on Miodhchaoin’s
    Hill. They return, fight Miodhchaoin and his three sons, complete the shouts while
    mortally wounded, are carried back to Erin, and die after Lugh refuses the healing
    pig’s-skin. The passage closes by identifying the story as one of the Three Sorrowful
    Stories of Erin.
  language: English
  quote_policy: summarized
