canonical_text:
  quote: ''
  summary: Mider claims Etain from King Eochaid according to a wager, embraces her,
    and disappears with her; witnesses see two swans flying away. Eochaid searches
    for Etain, and the druid Dalân discovers by ogams on yew wands that she is hidden
    beneath Mider’s sídh at Bri Leith. Eochaid attacks the fairy hill, Mider sends
    fifty Etain-like fairy maidens as decoys, and finally returns the real Etain.
    Mider later takes revenge through the violent fate of Eochaid and Etain’s descendant
    Conairé.
  language: English
  quote_policy: summarized
