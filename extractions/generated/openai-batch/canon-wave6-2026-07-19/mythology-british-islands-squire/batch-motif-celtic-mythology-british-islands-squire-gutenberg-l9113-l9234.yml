canonical_text:
  quote: "“One touch of some unknown magic had utterly changed the face of Dyfed from
    a rich realm to a wilderness.”"
  summary: Manawyddan marries Rhiannon and becomes close with Pryderi and Kicva. At
    a magic mound, thunder and mist transform Dyfed into a desolate land. After failed
    attempts to live by crafts in Lloegyr, a white boar leads Manawyddan and Pryderi
    to a newly appeared castle. Pryderi is trapped by touching a chained golden bowl,
    and Rhiannon is also trapped when she tries to rescue him; the castle vanishes
    with both prisoners. Manawyddan and Kicva return to Dyfed, where Manawyddan’s
    wheat is stripped by a host of mice. He captures one mouse and prepares to hang
    it, refusing a poor scholar’s offer to buy its release.
  language: English
  quote_policy: quoted
