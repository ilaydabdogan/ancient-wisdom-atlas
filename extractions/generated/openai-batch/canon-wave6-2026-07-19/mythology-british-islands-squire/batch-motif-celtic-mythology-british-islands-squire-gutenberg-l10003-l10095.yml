canonical_text:
  quote: ''
  summary: The passage surveys Welsh and Arthurian traditions about Arthur, Gwynhwyvar,
    Melwas, Medrawt, and related Celtic parallels. It describes three Gwynhwyvars,
    a recurring conflict over a symbolic woman, Melwas carrying Gwynhwyvar to Avilion
    and restoring her after Arthur’s siege, Medrawt/Mordred as rival and rebel, the
    Battle of Camlan, Arthur’s departure to Avilion, and the belief that Arthur has
    no grave and will return.
  language: English
  quote_policy: summarized
