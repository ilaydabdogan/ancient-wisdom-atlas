canonical_text:
  quote: ''
  summary: The passage recounts later Manx and Irish traditions about Manannán, Finvarra,
    Onagh, and other fairy rulers. Manannán is remembered as first inhabitant and
    magical king of the Isle of Man, later reduced in folklore to a giant with a great
    grave and three legs. Irish fairy kingship passes after his departure; Finvarra
    rules Knockma with Onagh, abducts and returns a human bride after ritualized excavation
    with salt, and also acts as patron of a local family’s wine cellars and racehorses.
    The passage then describes a hierarchy of Irish fairy queens and closes with Ainé,
    linked to older goddess traditions of prosperity, fertility rites with fire on
    Saint John’s Eve, and ancestry claims by Irish families.
  language: English
  quote_policy: summarized
