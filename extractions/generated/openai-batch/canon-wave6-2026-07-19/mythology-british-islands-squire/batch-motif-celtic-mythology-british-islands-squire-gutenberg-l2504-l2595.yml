canonical_text:
  quote: ''
  summary: Nuada receives a silver artificial hand after losing his own, but the blemish
    disqualifies him from kingship. The Tuatha Dé Danann elect Bress, a Fomorian-linked
    ruler, and arrange marriages with Fomorian figures. Bress becomes oppressive,
    taxes domestic goods, obtains the milk of the cattle by a trick involving fire,
    and forces the gods into labor and famine. Angus advises the Dagda to choose the
    black-maned heifer called Ocean as a reward. Later, the physicians Miach and Airmid
    transplant a cat’s eye into Nuada’s porter; Miach then restores Nuada’s original
    buried hand with an incantation over three days and nights.
  language: English
  quote_policy: summarized
