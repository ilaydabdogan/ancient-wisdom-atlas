canonical_text:
  quote: ''
  summary: The preface presents the book as a compact introduction for English readers
    to Gaelic and British Celtic mythical, legendary, and poetic traditions. It states
    that the volume will introduce chief Celtic mythic figures, including Gaelic gods,
    giants, Ulster heroes, Finn and the Fenians, ancient British divine and heroic
    figures, Arthur, and his Knights. It describes these figures as passing in the
    book’s account from acknowledged godhood through transformations to later recognition
    as fairies, and names scholarly and translational sources used by the author.
  language: English
