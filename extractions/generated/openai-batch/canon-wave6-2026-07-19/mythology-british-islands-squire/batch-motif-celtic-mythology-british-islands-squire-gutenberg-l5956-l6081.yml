canonical_text:
  quote: ''
  summary: Naoise, Deirdre, and the sons of Usnach live in exile in Alba. Conchobar
    arranges their return by testing champions over how they would respond if the
    exiles were killed despite safe-conduct, then selecting Fergus. Fergus brings
    the exiles from Alba despite Deirdre’s forebodings and second sight. Deirdre laments
    leaving Alba. On reaching Ireland at Borrach’s fort, Fergus is forced by his geis
    not to refuse a feast, creating a conflict between his obligation to the feast
    and his protection of the sons of Usnach.
  language: English
  quote_policy: summarized
