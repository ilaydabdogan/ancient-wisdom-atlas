canonical_text:
  quote: ''
  summary: The passage introduces the Conn-Cormac-Finn period in Irish legendary history.
    It summarizes traditions in which Lugh gives Conn a dynastic prophecy; Connla
    is taken by a goddess in a glass boat to an earthly paradise beyond the sea; Becuma,
    banished from the Land of Promise, marries Conn and conflicts with Art; Cormac
    is described as a wise legislator, a religious reformer killed through druidic
    revenge, and a favorite of Manannán who gives him a magic branch; and Finn is
    appointed leader of the Fenians, whose legends circulate in Ireland and Scotland.
  language: English
  quote_policy: summarized
