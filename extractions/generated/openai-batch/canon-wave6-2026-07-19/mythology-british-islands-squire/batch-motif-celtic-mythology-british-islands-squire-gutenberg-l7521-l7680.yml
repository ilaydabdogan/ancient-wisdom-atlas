canonical_text:
  quote: stolen Ainé’s cloak while she was bathing
  summary: The passage recounts how the fourth Earl of Desmond compelled Ainé to marry
    him by withholding her cloak, how she left him after he broke a condition concerning
    their son, and how their son Earl Gerald now waits under Lough Gur for a future
    return. It then lists other mythic or historical figures believed to dwell in
    fairy or enchanted domains, catalogs Irish sprites such as the Leprechaun, Gan
    Ceanach, Pooka, and Dulachan, and reports the author's speculation that such beings
    may be remnants of older non-Aryan gods.
  language: English
  quote_policy: quoted
