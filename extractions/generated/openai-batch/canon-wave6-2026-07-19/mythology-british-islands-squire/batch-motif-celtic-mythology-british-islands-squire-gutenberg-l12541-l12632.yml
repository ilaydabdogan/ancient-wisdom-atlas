canonical_text:
  quote: "“The whole Celtic mythology seems to revolve upon them, as upon pivots.”"
  summary: The passage argues that Celtic mythic events and surviving seasonal rites
    cluster around Beltaine/May and Samhain/Hallowe’en, with additional attention
    to Midsummer and Lugnassad. It lists Irish and British examples of arrivals, returns,
    battles, uncanny events, abductions, festival fires, offerings, dew and rowan
    rites, and concludes with an interpretation of these holidays as survivals of
    pagan nature-worship involving propitiation and sacrifice.
  language: English
  quote_policy: quoted
