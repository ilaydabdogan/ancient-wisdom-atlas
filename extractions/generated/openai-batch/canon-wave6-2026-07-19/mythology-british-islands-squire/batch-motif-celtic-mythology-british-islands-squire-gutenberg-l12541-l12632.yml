comparison_claims:
- id: claim:1
  claim: The passage states that the mythology of Britain preserves the same root-idea
    as that of Ireland, especially by locating uncanny or mythic events on May-day/Beltaine.
  claim_level: same_function
  target: Irish Beltaine/Samhain calendrical myth pattern and British May-day uncanny
    episodes
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made by the author as a secondary synthesis; the
    cited British examples focus on May-day more than on Samhain.
- id: claim:2
  claim: The passage analogizes the original form of Celtic rural holidays to orgiastic
    nature-worship such as became popular in Greece in connection with the cult of
    Dionysus.
  claim_level: same_function
  target: Greek Dionysus cult and Celtic seasonal nature-worship as described by the
    author
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The passage supports an analogy of function and character only; it
    does not provide evidence for historical contact or common inheritance.
