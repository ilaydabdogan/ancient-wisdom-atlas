canonical_text:
  quote: ''
  summary: The passage presents a Dinnsenchus legend explaining Mag Slecht, the “Plain
    of Adoration,” through the worship of the idol or deity Cromm Cruaich/Crom Croich.
    The poem and prose variant describe human or child offerings, firstlings, prostration,
    a gold central idol with twelve stone idols, and Patrick’s destruction or supersession
    of the idol. The passage then discusses Cromm/Cenn Cruaich as a possible mound
    or high-place heaven-god and connects Celtic state worship with solar festivals
    including Beltaine, Samhain, and an August feast of Lugus/Lugh/Lleu.
  language: English
  quote_policy: summarized
