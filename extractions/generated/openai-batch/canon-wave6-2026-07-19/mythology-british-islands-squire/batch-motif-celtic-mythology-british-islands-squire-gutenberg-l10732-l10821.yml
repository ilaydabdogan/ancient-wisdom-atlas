canonical_text:
  quote: ''
  summary: The passage summarizes prerequisites for a difficult hunt, including unique
    hounds, handlers, equipment, Arthur's warriors, and the missing Mabon son of Modron.
    It then notes that the extant tale is incomplete, lists several recovered quest
    episodes, and narrates the search for Mabon through a chain of ancient animals.
    The Salmon of Llyn Llyw ultimately carries Kai and Gwrhyr to Gloucester, where
    Mabon is imprisoned, and Arthur's warriors storm the place and rescue him.
  language: English
  quote_policy: summarized
