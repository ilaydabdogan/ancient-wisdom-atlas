canonical_text:
  quote: ''
  summary: Lludd seeks counsel from his brother Llevelys in France about three plagues
    in Britain. Llevelys provides remedies for the Coranians, two fighting dragons,
    and a magical food thief. Lludd returns, kills the Coranians with insect-infused
    water, traps and buries the dragons after they drink mead, and defeats the magical
    thief by resisting sleep with cold water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lludd goes to France, by the advice of his nobles, to obtain help from his
    brother Llevelys, king of France.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Llevelys has a long brass tube made so that he and Lludd can consult without
    being overheard by the Coranians.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Coranians send a demon into the speaking-tube; the demon whispers insulting
    messages, and Lludd and Llevelys drive it out by flooding the tube with wine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Llevelys instructs Lludd to pound certain insects in water and cast the water
    over both his own people and the Coranians; the water is said to be harmless to
    Lludd's people and poisonous to the Coranians.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Llevelys identifies the shriek as being raised by the Red Dragon of Britain
    because it is attacked by the White Dragon of the Saxons.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Llevelys tells Lludd to find the exact centre of Britain, dig a pit, place
    a hidden vessel of mead there, wait for the fighting dragons to fall into it and
    sleep, then wrap and bury them in a stone coffin in the strongest place in Britain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Llevelys explains the disappearance of the food as the work of a mighty man
    of magic who puts everyone to sleep by charms before removing the king's provisions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Llevelys tells Lludd to keep watch beside a cauldron of cold water and plunge
    into it whenever drowsiness approaches.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lludd returns to Britain, sprinkles the insect-infused water over the assembled
    natives and Coranians, and the natives are unharmed while the Coranians die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lludd finds the centre of Britain at Oxford, sets the mead trap, sees the
    dragons fight and fall into the mead, wraps them, and buries them near Beddgelert
    at Dinas Emrys.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the dragons are buried, the shriek is not heard again until Merlin has
    them dug up five hundred years later; then they recommence fighting and the red
    dragon drives the white one out of Britain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lludd prepares a banquet, keeps awake through drowsy music by dipping himself
    in cold water, confronts a huge armoured man carrying an apparently endless basket,
    defeats him, and makes him his vassal.
  category: sequence
  evidence_refs:
  - ev:7
