canonical_text:
  quote: ''
  summary: The passage discusses Arthur’s sudden mythological prominence, his elevation
    from early warrior-chieftain references to a ruler over older Welsh divine families,
    and Professor Rhys’s explanation that a divine Arthur and a human military Arthur
    were conflated. It then compares Arthurian legend with the Fenian cycle, including
    parallels in war-leadership, heroic bands, love-triangle narratives, final battles,
    and legends of survival in Avilion or magical sleep awaiting return. It ends by
    noting the disappearance of Gwydion from later myth and suggesting Arthur may
    have inherited attributes from an omitted older deity.
  language: English
  quote_policy: summarized
