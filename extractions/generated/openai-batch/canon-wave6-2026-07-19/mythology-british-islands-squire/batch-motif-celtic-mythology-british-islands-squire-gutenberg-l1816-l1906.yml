canonical_text:
  quote: ''
  summary: 'The passage surveys several Gaelic divine figures: Ogma as patron of eloquence,
    inventor of Ogam, and champion; Bodb the Red as successor to the Dagda; Lêr and
    Manannán as sea-associated deities, with Manannán possessing magical weapons,
    vehicle, horse, armor, invisibility mantle, and renewing feast animals; Goibniu
    and allied craftsmen as makers of divine arms and invulnerability; and Diancecht
    as physician who destroys a dangerous infant’s internal serpents, causing an etiological
    explanation for the River Barrow.'
  language: English
  quote_policy: summarized
