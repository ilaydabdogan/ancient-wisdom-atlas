candidate_motifs:
- id: motif:1
  label: Divine patron invents a writing system
  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: Ogma is both god of literature and eloquence and the credited inventor of
    the Ogam alphabet.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the attribution through mythographic summary rather
    than narrating an invention episode.
- id: motif:2
  label: Blood-guilt answered by an extraordinary treasure fine
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  basis: The three sons of Tuirenn murder the father of the sun-god and are compelled,
    as expiation, to pay a fine consisting of the chief treasures of the world.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not identify who compels the fine or narrate the acquisition
    of the treasures.
- id: motif:3
  label: Divine succession from father to son
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: Bodb the Red is described as the Dagda’s child and as succeeding his father
    as king of the gods.
  evidence_refs:
  - ev:4
