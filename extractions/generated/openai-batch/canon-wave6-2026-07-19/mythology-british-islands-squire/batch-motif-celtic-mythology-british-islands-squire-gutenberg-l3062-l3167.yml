canonical_text:
  quote: ''
  summary: Lugh explains that the sons of Tuirenn must give three shouts on the guarded
    hill Cnoc Miodhchaoin as part of their fine. The narrator comments that the tale
    gathers accounts of how Gaelic gods obtained legendary possessions. The sons seek
    Manannán’s magic horse and coracle; Lugh refuses the horse but lends the boat.
    They sail first to the Garden of the Hesperides, steal three apples by taking
    hawk shapes, evade pursuing sorceress-daughters by changing into swans, and then
    sail to Greece, where Brian, disguised as a poet, asks King Tuis for his pig’s-skin
    as poetic reward.
  language: English
  quote_policy: summarized
