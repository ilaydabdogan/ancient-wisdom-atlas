canonical_text:
  quote: ''
  summary: The passage summarizes two Fenian episodes involving the Tuatha Dé Danann.
    In one, Finn and companions follow a fawn to Mount Leinster, enter a sídh in a
    hollow hill, learn that the fawn was Mider’s daughter in animal form, and help
    defend the sídh in an all-night battle. In another, Angus of the Brugh challenges
    Finn’s hounds against enchanted pigs; the Fenians kill the pigs, which Angus says
    were his son and other Tuatha Dé Danann in pig form. The narrator then states
    that Fenian stories often begin with hunts in which nonhuman or shapeshifted quarry
    leads to danger and battle.
  language: English
  quote_policy: summarized
