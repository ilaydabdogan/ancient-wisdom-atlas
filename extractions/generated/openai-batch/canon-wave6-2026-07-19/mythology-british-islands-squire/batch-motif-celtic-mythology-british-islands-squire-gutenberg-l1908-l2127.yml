canonical_text:
  quote: ''
  summary: The passage summarizes Diancecht’s children and the genealogy leading to
    Lugh, son of Cian and Ethniu. Lugh is described as the Gaelic pantheon’s Apollo
    or Sun-God, called Lamhfada, and associated with a rod-sling, the rainbow, the
    Milky Way as “Lugh’s Chain,” a living bloodthirsty spear, and a magic hound with
    fiery and drink-producing properties. The hound, spear, and Manannán’s indestructible
    pigs are said to have been obtained by the sons of Tuirenn as a blood-fine for
    Cian’s murder. The passage also mentions Lugh’s title Ioldanach, “Master of All
    Arts,” and briefly classifies greater and lesser Gaelic deities.
  language: English
  quote_policy: summarized
