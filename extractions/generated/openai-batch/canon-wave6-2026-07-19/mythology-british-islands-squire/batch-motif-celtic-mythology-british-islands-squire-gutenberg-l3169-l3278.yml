canonical_text:
  quote: ''
  summary: Brian and the sons of Tuirenn continue collecting objects demanded as Lugh’s
    fine. They seize a pig-skin and escape Greece, travel to Persia disguised as poets
    to obtain King Pisear’s spear, enter Sicily disguised as mercenary soldiers to
    take King Dobhar’s horses and chariot, receive seven pigs from King Easal, force
    the King of Ioruaidhe to surrender a hound-whelp, and finally Brian descends beneath
    the sea in a water-dress to reach the Island of Fianchuivé, where its queen and
    sea-maidens give him a cooking-spit.
  language: English
  quote_policy: summarized
