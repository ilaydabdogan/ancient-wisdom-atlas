canonical_text:
  quote: ''
  summary: The passage recounts Gwydion finding Lleu in eagle form with help from
    a sow, bringing him down from an oak by song, restoring him with a magic wand,
    and arranging his healing. It then describes Blodeuwedd changed into an owl, Gronw
    killed by reciprocal vengeance, Nynniaw and Peibaw quarreling over sky, stars,
    and moon imagery until war and ox-transformation, and a mythographic account of
    Penardun, Llyr, and Manawyddan, including sea-linked otherworld rule and a bone-labyrinth
    prison.
  language: English
  quote_policy: summarized
