canonical_text:
  quote: ''
  summary: 'Gwydion repeatedly uses disguise and magic to overcome Arianrod’s destinies
    on her son: first gaining him a name, then causing Arianrod to arm him. Gwydion
    and Mâth create Blodeuwedd from flowers as Lleu’s wife. Blodeuwedd and Gronw conspire
    against Lleu, learn the special conditions under which he can be killed, and arrange
    them; Gronw strikes Lleu, who becomes an eagle and flies away.'
  language: English
  quote_policy: summarized
