  claim: The passage contrasts Welsh folk-tale remnants of British deities with Gaelic
    folk-tales about named figures; both are presented as later folk-tale repositories
    of older divine material, but the Gaelic examples are described as more coherent.
  claim_level: same_function
  target: Welsh folk-tale remnants of Gwydion, Gwyn, Arianrod, and Dylan compared
    with Gaelic folk-tales about Goibniu, Lugh, Cian, Manannán, Ethniu, and Balor
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Squire's characterization only; the passage does not quote
    or summarize the actual Gaelic folk-tales.
- id: claim:2
  claim: The passage compares Geoffrey of Monmouth's Historia with the Morte Darthur
    and the Mabinogion as works that contain mythological material despite differing
    historical or romance presentation.
  claim_level: same_function
  target: Geoffrey of Monmouth's Historia Britonum, the Morte Darthur, and the Mabinogion
