canonical_text:
  quote: ''
  summary: 'Squire describes the later decline and survival of British deities: some
    are transformed into Arthurian romance heroes, some persist only in fragmented
    Welsh folk-tales, some are absorbed into pseudo-history or saintly legend, and
    Gwyn son of Nudd survives in diminished fairy form. The passage also summarizes
    euhemerized accounts of Dôn, Gwydion, the Bone Prison of Oeth and Anoeth, and
    Geoffrey of Monmouth''s Trojan origin tradition for the Britons.'
  language: English
  quote_policy: summarized
