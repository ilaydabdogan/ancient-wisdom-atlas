comparison_claims:
- id: claim:1
  claim: The author explicitly claims that the folk-tales preserve mythological details
    otherwise found in ancient manuscripts containing older material.
  claim_level: same_function
  target: Ancient Gaelic manuscript traditions concerning the old Gaelic pantheon
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author's internal comparison; the passage does not quote
    the manuscript versions or provide independent manuscript evidence.
- id: claim:2
  claim: The author states that Goibniu, Balor, Ethniu, Lugh, and Manannán retain
    roles corresponding to those in older Gaelic mythological tradition.
  claim_level: same_function
  target: Old Gaelic pantheon roles as represented in older manuscript material
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim depends on the author's synthesis and names are sometimes
    variant or corrupted in the folk-tale.
- id: claim:3
  claim: The author cautiously connects the gray cow and byre-rope story with the
    Dagda's black-maned heifer, Ocean.
  claim_level: visual_similarity
  target: Story of the Dagda's black-maned heifer, Ocean
  evidence_refs:
  - ev:19
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself marks the connection as possible and jumbled; it
    gives no detailed parallel beyond the cow/heifer association.
