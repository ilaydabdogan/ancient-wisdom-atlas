canonical_text:
  quote: ''
  summary: 'A Donegal folk-tale version of the Balor and Lugh legend is summarized,
    followed by the author''s comments on the survival of Gaelic mythological details
    in folk tradition. The passage then recounts later traditions about Manannán:
    his continued aid to Irish people, his withdrawal after St. Columba denies him
    paradise, and a Hebridean account of a sea-associated stranger recognized as the
    Son of the Sea.'
  language: English
  quote_policy: summarized
