candidate_motifs:
- id: motif:1
  label: Prophecy of death by descendant
  taxonomy_refs:
  - divine_parent_child
  basis: The passage states that Balor's death is predicted to come at the hands of
    an unborn grandson, and Lugh, his surviving grandson, later kills him.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The taxonomy reference is approximate; the passage is focused on a grandparent-grandchild
    conflict rather than a parent-child relation.
- id: motif:2
  label: Imprisoned daughter visited in disguise to produce destined child
  taxonomy_refs:
  - sacred_birth
  basis: Mac Kineely is conveyed in female disguise to the place where Balor's daughter
    is imprisoned, and three sons result from the visit.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage summarizes the folk-tale and does not elaborate the birth
    as sacred beyond the later mythological identification of Lugh.
- id: motif:3
  label: Child exposed to water and rescued
  taxonomy_refs:
  - miraculous_child
  basis: Balor drowns two of Ethnea's children, while the third is picked from the
    sea by the fairy and handed to his father.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The child is rescued from attempted drowning; the passage does not describe
    a vessel or formal exposure ritual.
- id: motif:4
  label: Hero slays tyrant through single vulnerable point
  taxonomy_refs: []
  basis: Lugh kills Balor by striking his eye; the author calls the eye Balor's one
    vulnerable place.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: No available taxonomy reference directly names the vulnerable-point motif.
- id: motif:5
  label: Divine smithcraft and forge weapon
  taxonomy_refs:
  - culture_hero
  basis: Gavida is a smith, Lugh is raised as a smith, and the killing weapon is a
    red-hot iron taken from the forge fire.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage supports smithcraft strongly, but 'culture hero' is only a
    broad taxonomy fit.
- id: motif:6
  label: Rejected god continues to aid former worshippers
  taxonomy_refs:
