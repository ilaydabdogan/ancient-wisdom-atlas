  basis: Manannán is described as helping and watching over people who have rejected
    and ceased to worship him, including through protection, weather, crops, and fairy
    labor.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage presents aid despite rejected worship rather than a formal
    exchange.
- id: motif:7
  label: Miraculous repair by breath
  taxonomy_refs: []
  basis: A stranger breathes upon Columba's broken golden chalice, and the broken
