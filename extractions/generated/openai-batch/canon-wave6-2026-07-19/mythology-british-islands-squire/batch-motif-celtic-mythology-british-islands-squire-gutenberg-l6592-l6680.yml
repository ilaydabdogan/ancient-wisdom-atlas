canonical_text:
  quote: ''
  summary: 'The passage recounts the beginning of the pursuit of Grainne and Diarmait:
    Finn seeks Grainne as bride, Grainne sees and loves Diarmait, drugs the feast,
    binds Diarmait by geasa to flee with her, and the pair escape from Tara. Finn
    pursues them with trackers and warriors. Diarmait refuses to abandon the encounter,
    receives aid connected with the Tuatha Dé Danann, escapes through a guarded fence,
    rejoins Grainne, and later defeats champions and venomous hounds sent by Finn.'
  language: English
  quote_policy: summarized
