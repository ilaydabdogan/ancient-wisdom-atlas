canonical_text:
  quote: ''
  summary: 'The passage describes older Irish deities receding from the Ulster cycle
    while other deities and lesser beings remain active in the background. It then
    introduces Conchobar''s Ulster, the Red Branch champions, and Cuchulainn as a
    preeminent heroic figure with solar and fiery attributes. The passage recounts
    Cuchulainn''s marvelous birth: Dechtiré swallows a may-fly in wine, dreams of
    Lugh, is transformed with her maidens into bird shape, and later is found at the
    Brugh on the Boyne, where a newborn child is given to the Ulster warriors to raise.'
  language: English
  quote_policy: summarized
