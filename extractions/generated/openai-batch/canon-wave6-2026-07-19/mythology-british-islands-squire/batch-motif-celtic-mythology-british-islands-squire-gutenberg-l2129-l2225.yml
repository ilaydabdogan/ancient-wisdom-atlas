comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the Gaelic idea of older divine dynasties
    behind the Tuatha Dé Danann with the broader pattern of an old divine realm behind
    a reigning pantheon, using Cronos and the Titans displaced by Zeus as an example.
  claim_level: same_function
  target: Greek Cronos and Titans behind Zeus as an older divine order
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
