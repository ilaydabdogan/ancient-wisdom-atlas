canonical_text:
  quote: ''
  summary: 'The passage describes earlier divine or mythic inhabitants of Ireland
    before the Tuatha Dé Danann: the Race of Partholon, the Race of Nemed, and then
    the Fir Bolgs. It recounts arrivals from the Other World or related otherworldly
    origins, land expansion, wars with the Fomors, epidemics, burial or return to
    the other world, a Fomorian glass tower on Tory Island, and a tribute of children
    at Samhain. The author also notes similarities between Partholon and Nemed traditions
    and compares some patterns with Greek myth.'
  language: English
  quote_policy: summarized
