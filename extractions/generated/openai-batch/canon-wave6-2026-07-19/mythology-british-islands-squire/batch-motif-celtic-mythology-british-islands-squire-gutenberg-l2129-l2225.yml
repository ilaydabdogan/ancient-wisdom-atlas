- id: motif:2
  label: Otherworld arrival and return of a mythic people
  taxonomy_refs:
  - return
  basis: Partholon comes from the Other World; an older form of the Partholon legend
    has his people return there, and the surviving Nemed people are said to return
    whence they came or die.
  evidence_refs:
