  summary: 'The passage recounts Gwydion’s conflict with underworld powers: his earlier
    imprisonment after assailing Caer Sidi, the Battle of Godeu/Achren fought with
    Amaethon and Lleu to secure the dog, deer, and lapwing for humankind, the magical
    tree army and monstrous underworld fighters, Gwydion’s victory through guessing
    Brân’s name, and the beginning of a later attempt to obtain swine from Annwn through
    disguise and storytelling.'
