canonical_text:
  quote: ''
  summary: The passage introduces the conquest of the Tuatha Dé Danann by mortal ancestors
    of the Gaels, explains a Celtic doctrine that humans descend from the god or land
    of death, recounts a Christianized genealogy and migration to Spain, and narrates
    Ith’s discovery of Ireland, his murder by the Tuatha Dé Danann, and Milé’s retaliatory
    expedition to Ireland.
  language: English
  quote_policy: summarized
