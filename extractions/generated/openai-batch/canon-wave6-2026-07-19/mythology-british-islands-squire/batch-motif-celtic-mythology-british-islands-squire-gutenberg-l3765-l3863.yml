comparison_claims:
- id: claim:1
  claim: The passage presents the conquest of gods by mortals as a Celtic pattern,
    with Gaelic mythology preserving it in greatest detail and the doctrine once likely
    common to all Celts.
  claim_level: same_motif
  target: broader Celtic traditions beyond the Gaelic material
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author’s comparative claim within the passage; the passage
    does not quote parallel non-Gaelic narratives.
- id: claim:2
  claim: The passage compares the Gaelic doctrine of descent from Bilé with Caesar’s
    report that the Gauls believed themselves sprung from Dis Pater.
  claim_level: same_function
  target: Gaulish belief reported by Caesar about descent from Dis Pater
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes Caesar and gives no extended Gaulish mythic
    narrative.
- id: claim:3
  claim: The passage makes a linguistic comparison among Gaelic Bilé, British Beli,
    and Balor through a death-related root.
  claim_level: linguistic_similarity
  target: Gaelic Bilé, British Beli, and the Fomor Balor
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison depends on the author’s etymological assertion and is
    not independently demonstrated in the passage.
- id: claim:4
  claim: The passage compares the Irish ancestral migration route with Geoffrey of
    Monmouth’s route for Brutus and the Trojans coming to colonize Britain.
  claim_level: same_motif
  target: Geoffrey of Monmouth’s British Trojan migration route
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage compares route structure, not necessarily shared origin
    or direct dependence.
