canonical_text:
  quote: ''
  summary: The passage recounts Angus obtaining Brugh-na-Boyne from the Dagda by exploiting
    a grant of 'a day and a night'; the Tuatha Dé Danann electing Bodb the Red as
    ruler while Mider and Lêr refuse obedience; Angus wasting away for a dream-maiden,
    later identified as Caer, a swan-maiden who changes him into swan form so they
    can marry; Bodb’s conflict with Mider and attempted reconciliation with Lêr; and
    Lêr’s marriage to Aebh, who bears four children and dies in childbirth.
  language: English
  quote_policy: summarized
