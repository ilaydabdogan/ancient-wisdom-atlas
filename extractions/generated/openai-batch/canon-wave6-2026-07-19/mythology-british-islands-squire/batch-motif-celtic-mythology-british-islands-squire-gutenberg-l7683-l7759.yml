  quote: ''
  summary: The passage introduces the gods of the Britons as preserved under disguises
    in Welsh, pseudo-historical, hagiographic, and Arthurian materials. It describes
    British divine families, especially the Children of Dôn and the Children of Llyr,
    compares them with Gaelic divine groups, assigns celestial associations to Dôn’s
    children, and gives attributes, myths, cult evidence, and iconography for Nudd/Lludd/Nodens.
  language: English
  quote_policy: summarized
