canonical_text:
  quote: ancient myth of the twin brothers, Darkness and Light
  summary: The passage retells and interprets Geoffrey's account of Brennius/Brân
    and Belinus as rival divine brothers associated with darkness/death and light/sun,
    narrates their division of Britain, conflict, reconciliation, continental conquests,
    and Belinus's building and burial. It then describes Welsh hagiological traditions
    that make Llyr's family a holy lineage and Brân the Blessed an introducer of Christianity,
    before rejecting that historicity and interpreting Brân as an old pagan god later
    canonized by clerics.
  language: English
  quote_policy: quoted
