- id: obs:8
  text: At Tara, also called Drumcain or the Beautiful Hill, Mac Cuill, Mac Cecht,
    Mac Greiné, and the host of the Gaelic gods meet the Milesian invaders for a parley.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Tuatha Dé Danann complain that they were taken by surprise, and the Milesians
    admit that invading without warning did not follow the courtesies of chivalrous
    warfare.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Tuatha Dé Danann propose that the invaders leave the island for three
