- id: obs:3
  text: The passage reports that the Welsh bard Taliesin says he has been many shapes,
    including weapons, a drop in the air, a star, books, a lantern light, a bridge,
    an eagle, a boat, a shield, a harp-string, and foam of water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After beginning their march on Tara, the Milesians encounter Banba and then
    Fotla; each asks that the island be called by her name, and Amergin agrees.
  category: sequence
  evidence_refs:
