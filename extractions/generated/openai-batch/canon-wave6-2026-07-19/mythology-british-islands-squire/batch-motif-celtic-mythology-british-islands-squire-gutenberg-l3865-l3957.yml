canonical_text:
  quote: ''
  summary: Amergin is the first Milesian to land in Ireland and recites a poem identifying
    himself with many natural, animal, martial, and cosmic forms, claiming shapeshifting
    and prophetic power. The narrator compares this with a Welsh poem attributed to
    Taliesin, whose speaker also says he has been many shapes. The Milesians then
    march toward Tara and encounter Banba, Fotla, and Eriu, each of whom asks that
    Ireland be called by her name; Amergin agrees, with Eriu's name becoming principal.
    At Tara, the Tuatha Dé Danann parley with the invaders, propose a three-day withdrawal,
    and finally submit the dispute to Amergin's arbitration under threat of death
    for partiality.
  language: English
  quote_policy: summarized
