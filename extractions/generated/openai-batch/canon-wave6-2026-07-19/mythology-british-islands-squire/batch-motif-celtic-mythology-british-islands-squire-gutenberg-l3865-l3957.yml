- id: obs:2
  text: In Amergin's poem, the speaker identifies himself with wind, ocean wave, surges,
    battalions, a bull, an eagle, a sunray, herbs, a wild boar, a salmon, a lake,
    an artist, and a sword-wielding champion; he also claims shapeshifting and prophecy.
  category: speech
  evidence_refs:
