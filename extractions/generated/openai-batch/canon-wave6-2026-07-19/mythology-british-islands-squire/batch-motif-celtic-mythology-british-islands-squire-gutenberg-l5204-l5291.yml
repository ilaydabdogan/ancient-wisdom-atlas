canonical_text:
  quote: ''
  summary: Medb tries to overcome Cuchulainn by offering Findabair to challengers,
    seizing the brown bull during his combats, enlisting Fergus, and later sending
    Calatin's family. The Morrígú appears to Cuchulainn, offers love and aid, becomes
    his enemy after rejection, attacks in animal forms during his fight with Loch,
    is wounded, receives healing from him, and then helps him. Lugh, Cuchulainn's
    father, heals him through a three-day sleep while the boy-troop of Emain Macha
    fight and die in his place. Fergus stages a token combat with his foster-son and
    makes a reciprocal bargain. Fiacha intervenes when Calatin's group overwhelms
    Cuchulainn.
  language: English
  quote_policy: summarized
