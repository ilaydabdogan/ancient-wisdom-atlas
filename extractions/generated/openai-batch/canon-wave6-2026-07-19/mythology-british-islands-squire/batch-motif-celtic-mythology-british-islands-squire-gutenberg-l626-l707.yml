    material older than their surviving literary forms. It treats Gaelic and British
    romances as containing a primeval mythic core beneath later embellishment, gives
    an example of a British sun-god wounded by a rival and transformed into an eagle,
    compares Celtic divine and heroic figures with other ancient mythic divine groups,
    and discusses the paradox that immortal gods are recorded as dying in later Christianized
    literary tradition.
