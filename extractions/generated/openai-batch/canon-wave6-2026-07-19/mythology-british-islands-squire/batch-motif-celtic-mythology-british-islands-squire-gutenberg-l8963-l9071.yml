canonical_text:
  quote: ''
  summary: After Gwern is crowned king of Ireland, Evnissyen kills him in the fire,
    causing renewed battle. The Irish revive their dead in a magic cauldron until
    Evnissyen destroys it at the cost of his own life. Brân, mortally wounded, orders
    his head cut off and carried through a prophesied journey to London for protective
    burial. Branwen dies of grief at the River Alaw. The seven survivors feast for
    many years with Brân’s talking head until a forbidden door is opened, ending the
    enchantment; the head is buried facing France, later disinterred by Arthur with
    disastrous results.
  language: English
  quote_policy: summarized
