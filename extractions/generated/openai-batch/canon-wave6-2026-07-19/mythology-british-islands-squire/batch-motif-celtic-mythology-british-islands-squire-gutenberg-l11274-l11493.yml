canonical_text:
  quote: ''
  summary: The passage compares Arthurian Grail material with earlier Celtic mythic
    patterns. It identifies Carbonek with a four-cornered castle and with Taliesin’s
    Caer Pedryvan, describes the Grail as a vessel of abundance, healing, and moral
    visibility, and cites Seint Greal episodes in which the castle is water-encircled,
    revolving, and defended by archers. It then discusses possible Grail achievers,
    identifying Percivale with Peredur and Galahad with Gawain/Gwalchmei, and interprets
    the Grail quest as a later form of an earlier otherworld-treasure quest accomplished
    by a solar hero against powers of darkness.
  language: English
  quote_policy: summarized
