canonical_text:
  quote: ''
  summary: The passage describes later Irish Christian and euhemerizing reinterpretations
    of Gaelic heroes and gods. It says some traditions made Patrick convert Ossian
    and Caoilté, and a later story raised Cuchulainn from the dead to testify for
    Christianity. It then treats Brigit as a pagan fire, poetry, and hearth goddess
    transformed into Saint Bridget, retaining fire-linked attributes and a perpetual
    flame at Kildare, compared with Sul at Bath. The passage also describes monkish
    genealogies that made mythic races descend from Noah and turned gods into historical
    rulers with reigns, tombs, and battles, while noting dissenting recognition of
    the Tuatha Dé Danann as divine.
  language: English
  quote_policy: summarized
