canonical_text:
  quote: ''
  summary: After mortal conquest, the Tuatha Dé Danann retain divine power and compel
    a treaty involving corn, milk, homage, and offerings. Dispossessed gods choose
    new homes, including an overseas western paradise with several Gaelic names. Manannán
    son of Lêr, a principal divine emigrant, still visits Ireland and meets Bran son
    of Febal at sea, where Manannán’s song describes the same waters that Bran sees
    as sea as a flowery land, honey rivers, livestock, woods, fruit, and golden leaves.
  language: English
  quote_policy: summarized
