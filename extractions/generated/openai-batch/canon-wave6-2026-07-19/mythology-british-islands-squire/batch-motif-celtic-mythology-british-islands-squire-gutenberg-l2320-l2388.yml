canonical_text:
  quote: ''
  summary: 'The passage narrates negotiations and battle between the Fir Bolgs and
    the Tuatha Dé Danann: emissaries inspect and exchange weapons, peace terms involving
    division of Ireland are refused, the Tuatha take a strategic position at Moytura,
    a long truce allows arms preparation, battle begins on Midsummer Day with formal
    contests and equal-number combats, warriors use healing herbal baths, Sreng wounds
    Nuada by cutting off his hand, Eochaid is killed while seeking water, and the
    remaining Fir Bolgs accept Connaught as their share.'
  language: English
  quote_policy: summarized
