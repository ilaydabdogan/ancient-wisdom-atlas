  quote: he bound himself to it with his belt, so that he might die standing up, and
    not lying down
  summary: 'The passage narrates Cuchulainn''s final moments: after drinking and bathing,
    he cannot walk, calls his enemies, and binds himself upright to a pillar-stone.
    His dying horse, the Gray of Macha, returns to fight for him; Cuchulainn''s hero-light
    leaves his face, and a crow perches on his shoulder. His enemies gather, Lugaid
    cuts off his head to take it to Medb, and Conall the Victorious avenges him. The
    narrator links Cuchulainn''s death at age twenty-seven with the fall of the prosperity
    of Emain Macha and the Red Branch of Ulster. The footnotes include a poetic notice
    of deaths connected with Tigernmas and Cromm Cruaich worship, and bibliographic
    comparative notes on Achilles and Heracles.'
  language: English
  quote_policy: quoted
