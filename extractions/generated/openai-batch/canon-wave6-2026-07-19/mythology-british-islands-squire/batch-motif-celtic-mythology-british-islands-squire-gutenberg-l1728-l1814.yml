canonical_text:
  quote: ''
  summary: The passage describes the Dagda as a major Gaelic god with a food-giving
    cauldron, a season-ordering harp, a massive club, and monster-slaying power. It
    recounts Boann’s approach to a forbidden well of knowledge, whose waters become
    the Boyne, and notes related salmon-of-knowledge and Shannon traditions. It then
    describes Brigit, Angus, and Mider, including Brigit’s fire and poetry associations,
    Angus’s love-bringing music and bird-kisses, and Mider’s underworld associations,
    magical possessions, refusing cranes, and plundering by others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Dagda is presented as the greatest god after Nuada, with a name glossed
    as the “Good God,” and an old Irish tract identifies him as a god of the earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Dagda possesses a cauldron called “The Undry,” in which everyone receives
    food in proportion to merits and from which no one departs unsatisfied.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Dagda has a living harp whose playing brings the seasons in their proper
    order.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Dagda is described as venerable, gray-headed, simple in taste, fond of
    porridge, and dressed in a short tunic, cape, and horse-hide boots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Dagda draws an eight-pronged war-club on a wheel; the club is so large
    that eight men would be needed to carry it, and its wheel-track resembles a territorial
    boundary.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Dagda performs deeds in battle against the Fomors and is said to have
    captured, dragged, and killed the hundred-legged, four-headed monster Mata at
    the Stone of Benn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Boann is named as the Dagda’s wife and is connected with the River Boyne,
    to which she gives both name and existence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before the Boyne existed, there was a well shaded by nine magic hazel-trees
    bearing crimson nuts that conferred knowledge of everything in the world on whoever
    ate them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Only divine salmon in the well are permitted to eat the falling nuts; they
    become all-knowing and are called the Salmons of Knowledge, while even the highest
    gods are forbidden to approach.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Boann disobeys the prohibition and approaches the sacred well; its waters
    rise, drive her away in a flood, and do not return, thereby making the Boyne.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: One knowledge-bearing salmon is later eaten by Finn mac Coul, who receives
    its omniscience; the passage also mentions a similar origin account for the Shannon
    involving Sinann.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Brigit is named among the Dagda’s important children and is described as originally
    a goddess of fire, hearth, and poetry, later adopted into Christian saintship
    as Saint Bridget or Bride.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Angus, called Mac Oc, is described as youthful and associated with love and
    beauty; he has a golden harp whose music compels listeners to follow, and his
    kisses become invisible birds whispering thoughts of love.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mider is described as a god of the underworld connected with the Isle of Falga
    or Isle of Man, where he has a stronghold containing three wonderful cows and
    a magic cauldron.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Mider owns the Three Cranes of Denial and Churlishness, which stand at his
