canonical_text:
  quote: Out of fungus he made twelve gilded shields
  summary: Gwydion uses charms and illusions to create valuable-looking horses, hounds,
    and shields from fungus, exchanges them with Pryderi for swine, and flees before
    the illusion fails. Pryderi pursues after the objects return to fungus. After
    several battles and a granted request for single combat, Gwydion defeats Pryderi,
    who is buried. The narrator frames the event as a victory of light over darkness
    and over Hades, later to be renewed by Arthur.
  language: English
  quote_policy: quoted
