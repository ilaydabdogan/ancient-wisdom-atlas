canonical_text:
  quote: ''
  summary: The passage first describes wondrous winged creatures emerging from softened
    bones. It then recounts Aristaeus, bereft of bees, lamenting beside the Peneian
    river and calling on his mother Cyrene, who dwells beneath the water. In her underwater
    hall among nymphs, Cyrene hears him, summons him through the opened flood, receives
    him with ritual hospitality, pours offerings to Ocean, and reads a favorable flame
    omen. She instructs him to seize and bind the sea-seer Proteus, who knows past,
    present, and future but will only speak under compulsion and will attempt escape
    by changing into animals, fire, and water.
  language: English
  quote_policy: summarized
