literal_observations:
- id: obs:1
  text: The opening setting includes a large oak of Jove, dark ilex shade, sparing
    water, feeding until sunset, cool evening, moonbeams, forest glades, shore birds,
    and thickets.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Libyan shepherds keep scattered huts, let cattle graze for long periods in
    far shelterless deserts, and carry goods, house, home, weapons, quiver, and dog
    with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Afric swain is compared to a Roman soldier carrying a heavy load, marching
    quickly, pitching tents, and reaching his post before expected by the enemy.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: In Scythia near the Maeotic wave, Ister, and Rhodope, herds are kept close
    in byres; the plain has no grass and trees have no leaves, while deep frost and
    high snow cover the earth.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The northern winter is described with persistent cold, pale shadows, streams
    crusted with ice, water bearing wheeled wagons, bursting brass vessels, stiff
    clothes, frozen wine, frozen pools, icicles, and falling snow.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Cattle perish in the frost, oxen stand amid the ice, and stags are trapped
    by snow and killed by hand without hounds, nets, or plumes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The northern folk live in deep-dug underground caverns, bring whole oak and
    elm trees to their hearths, burn them there, spend the night in festivity, and
    wear tawny animal skins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: For wool, the speaker instructs avoiding prickly growth and rich pastures,
    choosing white downy flocks, and rejecting a white ram if its tongue is black
    lest it darken offspring fleece.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A brief tale says Pan, God of Arcady, used a snowy bribe of wool to snare
    and beguile Luna, calling her to the deep woods, and that she did not spurn the
    call.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: For milk, the speaker instructs bringing lucerne, lotus leaves, and salty
    herbs to the cote; the animals then seek streams, stretch their udders, and produce
    milk with a salty taste.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Newborn kids may be kept from their mothers and muzzled; milk is pressed at
    specified times, carried to town, salted, or stored for winter use.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Swift Spartan hounds and fierce Molossian dogs are to be fed whey; with them
    watching, the shepherd need not fear thieves, wolves, or raiders, and can hunt
    wild asses, hares, does, boar, and antlered animals.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The speaker instructs burning scented cedar in stalls and using galbanum fumes
    to drive away noxious snakes; vipers and other snakes may lurk under cribs or
    roofs and harm cattle.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The shepherd is told to seize stakes and stones and strike the snake as it
    raises itself, hisses, then lowers its crest and drags its coils in flight.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: A Calabrian serpent is described with raised breast, scaly back, spotted belly,
    residence near pools while spring water flows, consumption of fish and frogs,
    and movement into fields when heat dries the fens.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: After slipping its slough, the serpent is described as transformed to glittering
    youth, leaving eggs or young in its lair, towering sunward, and flashing a three-forked
    tongue.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: The speaker begins to discuss sickness, saying loathly scab attacks sheep
    after chilly showers, severe hoar-frosted winter, or sweat.
  category: sequence
  evidence_refs:
  - ev:14
