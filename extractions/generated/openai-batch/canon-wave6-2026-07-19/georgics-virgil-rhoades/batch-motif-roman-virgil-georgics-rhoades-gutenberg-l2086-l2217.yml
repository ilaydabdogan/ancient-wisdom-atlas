  quote: ''
  summary: The speaker begins Georgic IV on honey and bees, addressing Maecenas. The
    passage gives instructions for locating and protecting hives near water, shade,
    flowers, and suitable shelter; describes bees emerging with the seasons, swarming,
    and being settled with scented substances and cymbals associated with the Great
    Mother; and depicts bee warfare between rival kings, including selection of the
    better ruler and distinction between nobler and poorer bee types.
  language: English
