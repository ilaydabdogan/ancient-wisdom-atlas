  text: The poet-speaker says he is near the end of his journey and therefore passes
    over a fuller song about gardens.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old man from Corycus cultivates poor land with herbs, lilies, vervain,
    poppies, roses, fruits, trees, bees, and honey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Great Jove is said to have bestowed natural powers on bees as a boon because
    they fed the King of heaven in Dicte's cave while the Curetes sounded music and
    brass.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bees are described as sharing offspring, living together in one city under
    laws, knowing home and country, and storing harvest for winter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Different bees perform different tasks: provisioning, field work, comb foundation,
    wax setting, tending the young, packing honey, guarding gates, watching weather,
