  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bees' work is explicitly compared to the Cyclopes forging thunderbolts
    with bellows, water-trough, anvil, Etna, and forceps.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bees leave at dawn, return in the evening, buzz around the threshold,
