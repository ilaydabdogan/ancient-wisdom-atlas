canonical_text:
  quote: ''
  summary: 'The passage gives instructions for managing bees and their garden setting,
    recalls an old Corycian gardener whose poor plot produced flowers, fruits, bees,
    and honey, and then explains the powers Jove bestowed on bees: they live in an
    ordered commonwealth, labor collectively, are compared to Cyclopes forging thunderbolts,
    follow daily and weather-wise routines, and reproduce without mating by gathering
    offspring from leaves and honeyed herbs.'
  language: English
  quote_policy: summarized
