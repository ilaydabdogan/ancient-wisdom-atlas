- id: obs:1
  text: The beekeeper is told to restrain the bees' volatile desires by tearing off
    the monarchs' wings so others will not depart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saffron flowers, thyme, pine-trees, and planted slips are recommended around
    the bees' home, with Priapus guarding against birds and thieves.
  category: setting
  evidence_refs:
