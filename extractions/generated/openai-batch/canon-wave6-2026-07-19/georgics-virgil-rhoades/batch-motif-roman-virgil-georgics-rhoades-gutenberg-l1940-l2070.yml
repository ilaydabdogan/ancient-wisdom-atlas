canonical_text:
  quote: ''
  summary: The passage describes treatments for sheep disease, a rapidly spreading
    cattle plague, failed sacrifices, symptoms and deaths among domestic and wild
    animals, the collapse of normal agricultural and ritual life, the failure of renowned
    healers, and the appearance of Tisiphone from Stygian darkness driving Disease
    and Fear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shepherds treat shorn animals by steeping the flock in running streams, letting
    a drenched ram drift in the tide, or smearing the animals with oil-lees and medicinal
    substances.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage recommends opening an ulcer with an iron blade and, when fever
    has sunk inward, piercing a vein within the hoof-clefts.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A listless, lagging, isolated animal is to be cut quickly before contagion
    spreads through the herd.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cattle plagues are said to sweep faster than tempests, destroying whole feeding
    grounds, flocks, and breeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A pestilential season arose from distempered heavens, with fierce autumn heat,
    killing cattle and wild creatures and tainting pools and fodder.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: During sacrifice, victims fall by the altar; struck victims fail to make the
    entrails blaze, yield an answer from the seer, or stain the knife and sand with
    much blood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Calves die in pastures or at full cribs, dogs become mad, swine cough and
