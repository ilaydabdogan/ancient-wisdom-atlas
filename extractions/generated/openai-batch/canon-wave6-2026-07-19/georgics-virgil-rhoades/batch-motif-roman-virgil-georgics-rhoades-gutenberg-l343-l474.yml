  summary: The passage gives agricultural instructions keyed to seasons, stars, sun,
    moon, and weather; describes the cosmic zones, poles, constellations, and the
    Snake between the Bears; lists farm tasks for rainy, holy, night, and winter times;
    and recounts mythic associations of unlucky lunar days, including Earth-born beings
    and a failed mountain-stacking assault on heaven broken by the Sire's thunderbolt.
  language: English
  quote_policy: summarized
