- id: obs:1
  text: The passage instructs farmers to sow different crops at specified times, including
    barley near winter showers, flax and poppy while the earth is dry, beans and lucerne
    in spring, and vetch, kidney-bean, and lentil after Bootes' fall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stellar markers named in connection with agricultural timing include the dog-star,
    Atlas' daughters, the Cretan star, Maia's star, and Bootes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The golden sun is said to divide its course into fixed parts and move through
    the twelve constellations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The heavens are described as containing five zones: one fiery central zone,
    two icy and stormy outer zones, and two intermediate zones granted to mortals,
    with a path for the Signs between them.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The world is described as rising toward Scythia and Rhipaean heights and sinking
    toward Libya and the south, with one pole high and the other associated with Styx
    and shades.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: A huge Snake glides between and around the two Bears, which avoid dipping
    beneath Ocean's brim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Observation of stars, their risings and settings, and the ordered four seasons
    is said to help foretell storms and determine times for harvest, sowing, sea travel,
    fleet launching, and felling pine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When chilly showers keep the farmer indoors, the passage lists tasks such
    as repairing ploughshares, making troughs, branding cattle, counting corn-heaps,
    sharpening stakes and forks, preparing willow-bands, plaiting baskets, parching
    corn before fire, and bruising it with stone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: On holy days, the passage says some tasks remain lawful, including turning
    a runnel, fencing fields, setting bird-snares, burning briars, and washing the
    flock in a stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The moon assigns days as lucky or unlucky for labor; the fifth day is to be
    avoided, while other named days favor tasks such as setting vines, taming steers,
    fixing leashes to the warp, or aiding runaways.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The fifth day is associated with the births of pale Orcus, the Eumenides,
    Coeus, Iapetus, Typhoeus, and heaven-assailing sworn brethren.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The sworn brethren are said to have tried three times to heap Ossa on Pelion
    and Olympus on Ossa in order to break down the gates of heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Sire is said to have struck apart the mountain-stair three times with
    a thunderbolt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Night and winter are assigned particular forms of labor and rest, including
    reaping stubble by night, working by winter fire-light, a wife weaving or boiling
    must-juice with Vulcan's aid, mowing and threshing grain in heat, winter feasting,
    gathering acorns and berries, hunting, and setting snares in snow and ice.
  category: action
  evidence_refs:
