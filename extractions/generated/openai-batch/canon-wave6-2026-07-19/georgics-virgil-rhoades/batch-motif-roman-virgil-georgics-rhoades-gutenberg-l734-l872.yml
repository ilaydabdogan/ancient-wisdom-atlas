canonical_text:
  quote: ''
  summary: The passage opens Georgic II by invoking Bacchus and announcing a song
    about vines, trees, and olives. It describes natural and cultivated ways trees
    arise or are propagated, including spontaneous growth, seed, root suckers, layers,
    cuttings, budding, and grafting. It addresses husbandmen and Maecenas, using a
    sea-voyage image for the poetic task, and catalogues many tree, olive, pear, apple,
    and vine varieties with some divine and Greek associations.
  language: English
