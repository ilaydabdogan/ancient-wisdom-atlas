candidate_motifs:
- id: motif:1
  label: Short-lived individuals, enduring race
  taxonomy_refs: []
  basis: The passage contrasts individual bees' brief lives with the perennial endurance
    of their line.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is stated as natural history rather than as a developed mythic narrative.
- id: motif:2
  label: King as unifying center of the community
  taxonomy_refs:
  - royal_legitimacy
  basis: The king's life preserves one will among the multitude; his death causes
    the social bond to snap and the bees to destroy their own work.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage emphasizes royal centrality and obedience, not explicit dynastic
    legitimacy or enthronement.
- id: motif:3
  label: Self-sacrificial defense of the ruler
  taxonomy_refs:
  - sacrifice
  basis: Bees shield the king with their bodies in battle and seek glorious death
    through wounds.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The deaths are martial and protective; the passage does not describe a
    formal ritual offering.
- id: motif:4
  label: Divine life essence returning to its source
  taxonomy_refs:
  - annihilation_union
  - ascent
  basis: The reported doctrine says God permeates all, creatures draw an essential
    flame from him, all return to him by dissolution, and beings soar to starry rank
    and heaven.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The claim is introduced as what 'some say,' so it is framed as an attributed
    interpretation rather than the narrator's direct assertion.
- id: motif:5
  label: Seasonal-celestial timing of harvest
  taxonomy_refs:
  - seasonal_cycle
  basis: Honey is harvested twice yearly, keyed to the Pleiad Taygete's rising and
    winter descent.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an agricultural timing pattern rather than a full seasonal myth.
- id: motif:6
  label: Purifying or protective smoke before entering the hive
  taxonomy_refs: []
  basis: The beekeeper moistens his lips with water and spreads smoke before opening
    the honey-house; later fumigation is advised against winter damage and pests.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage gives practical apicultural instructions; any ritual interpretation
    should be reviewed.
- id: motif:7
  label: Herbal restoration of a failing community
  taxonomy_refs: []
  basis: Sick bees are treated with burned galbanum, honey, bitter and aromatic mixtures,
    and star-wort roots boiled in wine.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The motif is medical and practical in form; no explicit divine healing
    scene is described.
- id: motif:8
  label: New life generated from slaughtered animal corruption
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The passage says the blood of slaughtered bullocks has borne bees from corruption
    when the bee stock has failed.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: This is generation of new bees from a dead animal, not the same animal's
    return to life; 'resurrection' is therefore secondary and should be reviewed.
- id: motif:9
  label: Secret restorative art taught by a rustic teacher
  taxonomy_refs:
  - wisdom
  basis: A wondrous secret for restoring failed bee stock is said to have been taught
    by the swain of Arcady and then traced to its source.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The teacher is named only by role and region, and the passage excerpt
    does not complete the surrounding story.
comparison_claims:
- id: claim:1
  claim: 'The bullock-to-bees procedure functions like a death-rebirth pattern: total
    loss of bee stock is answered by new bees arising from the body, blood, and corruption
    of a killed animal.'
  claim_level: same_function
  target: death_rebirth motif family
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not describe the bullock itself returning to life,
    so the comparison should remain functional rather than identity-based.
- id: claim:2
  claim: The twice-yearly honey harvest keyed to Taygete's rising and winter descent
    is a seasonal-cycle pattern connecting agricultural action with a recurring celestial
    sign.
  claim_level: same_function
  target: seasonal_cycle motif family
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides practical timing, not a narrative myth of seasonal
    death and return.
- id: claim:3
  claim: The attributed teaching that all beings draw divine flame, dissolve back
    to God, and mount heavenward can be compared cautiously with ascent and annihilation-union
    patterns.
  claim_level: archetypal_reading
  target: ascent and annihilation_union motif families
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The doctrine is reported as what 'some say' about bees and life generally;
    the excerpt does not present an enacted journey or individual mystical union.
