canonical_text:
  quote: '"Some say that unto bees a share is given / Of the Divine Intelligence"'
  summary: The passage describes the devotion, social order, seasonal labor, diseases,
    remedies, and regeneration lore of bees. It says bees obey a king, may share in
    divine intelligence, are harvested and tended by timed apicultural practices,
    and may be generated from the corruption and blood of slaughtered bullocks according
    to a secret art associated with Egypt and an Arcadian teacher.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bees wandering among jagged stones fray their wings and give up their lives
    under their burden because of their love of flowers and the acquisition of honey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An individual bee's lifespan is described as narrow and not exceeding seven
    summers, while the race and lineage endure across generations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bees' obedience to their king is said to surpass that of named human realms
    and armies; while the king lives, one will inspires the multitude.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the king dies, the bond of loyalty breaks, and the bees ravage their own
    honey and tear the waxen structure of the comb.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bees reverence the king, surround him in throngs, attend him, sometimes carry
    him high, shield him with their bodies in battle, and seek death through wounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A reported belief says bees receive a share of Divine Intelligence and drink
    pure ether; God permeates earth, ocean, and heaven, and living beings draw an
    essential flame from him at birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same reported belief says all things return to God through dissolution,
    death has no place, and beings soar alive into their starry rank and the heights
    of heaven.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before opening the hive and honey-house, the beekeeper is told to moisten
    his lips with water and set fumes of trailing smoke before him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Honey is gathered twice each year, once when Taygete the Pleiad rises for
    the earth to see and once when she flees the Fish and descends into the wintry
    wave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When hurt, bees are intensely angry; they inject venom with their bite, bury
    the sting in the veins, and leave their lives behind in the wound.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Threats inside or near the comb include an unseen newt, light-loathing beetles,
    drones, hornets, moths, and a spider with a net across the doorway.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The beekeeper may fumigate with thyme and cut away empty wax; impoverished
    bees then work more keenly to repair their race, fill cells, and weave granaries
    from rifled flowers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Diseased bees change color, become lean, carry dead bodies from the cells,
    hang foot to foot at the porch, or linger listlessly inside closed doors from
    famine and cold.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The sound of the diseased hive is a deep, long hum compared to south wind
    in forests, a booming ocean billow, and fire surging within furnace walls.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The advised remedy for sick bees includes burning scented galbanum and offering
    honey through reed troughs, mixed with substances such as gall, dried rose leaves,
    boiled must, raisin juice, centaury, and Cecropian thyme.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Star-wort is described as a meadow-flower with golden growth and purple glory
    through violet gloom; it is used for altar chaplets, tastes harsh, and its roots
    are boiled in fragrant wine and set as food at the bees' doors.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: 'If a whole bee stock fails and there is no means to breed it anew, the passage
    introduces a wondrous secret taught by an Arcadian swain: bees have arisen from
    the blood and corruption of slaughtered bullocks.'
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: In the Canopus region by the Nile overflow, the welfare of the domain is said
    to rest on this art; a narrow enclosed recess with tiled roof and four slanting
    window-slits is prepared.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:19
  text: A two-year-old steer is selected, its mouth and nostrils stopped, it is beaten
    to death with its hide intact, left shut inside the recess, and broken boughs,
    thyme, and fresh cassias are placed beneath its ribs.
  category: action
  evidence_refs:
  - ev:11
