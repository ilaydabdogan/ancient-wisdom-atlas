canonical_text:
  quote: ''
  summary: The passage describes spring as the season of fertility, imagines Aether
    descending in rain to Earth, likens this to the world's first spring, gives instructions
    for planting and tending vines, explains protection against animals, and describes
    Bacchic rural rites including goat sacrifice, masks, hymns, offerings, and annual
    vine labor. It ends by contrasting the lesser labor needed for olives and apples.
  language: English
  quote_policy: summarized
