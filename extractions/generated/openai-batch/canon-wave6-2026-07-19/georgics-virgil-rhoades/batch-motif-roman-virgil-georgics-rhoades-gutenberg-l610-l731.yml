canonical_text:
  quote: ''
  summary: The passage gives signs by which animals, the moon, and the sun forecast
    rain, wind, hail, calm weather, and danger at sea. It then describes the sun and
    many natural prodigies as warnings of hidden civil violence, especially around
    Caesar’s death and the battles at Philippi. The passage closes by imagining future
    farmers uncovering battlefield remains, invoking Roman divine protectors and Caesar,
    and lamenting a world where agriculture is abandoned, tools are made into weapons,
    and war runs out of control like a chariot whose driver cannot restrain it.
  language: English
  quote_policy: summarized
