canonical_text:
  quote: ''
  summary: The passage recounts Orpheus wandering in grief for Eurydice, his dismemberment
    by Ciconian women, and his severed head still calling Eurydice as it floats in
    the Hebrus. Proteus then disappears into the sea. Cyrene explains to her son that
    nymphs brought a deadly plague upon his bees and prescribes sacrifices and funeral
    dues to Orpheus and Eurydice. The son performs the rites, after which bees emerge
    from dissolving oxen flesh and cluster on a tree. The passage closes with Virgil’s
    authorial coda linking his agricultural song to Caesar’s campaigns and his own
    peaceful poetic life.
  language: English
  quote_policy: summarized
