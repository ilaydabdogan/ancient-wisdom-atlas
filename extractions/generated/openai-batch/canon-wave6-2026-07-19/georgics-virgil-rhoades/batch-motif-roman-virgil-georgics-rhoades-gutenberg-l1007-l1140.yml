canonical_text:
  quote: Sole central pillar of a world of shade.
  summary: The passage gives practical rules for recognizing and testing soils, preparing
    land for vines, selecting nursery sites, arranging vineyard rows, planting vines
    with supporting trees, avoiding practices that encourage fire, and timing vineyard
    work according to winter and spring. It includes serpent-haunted soil, water and
    taste tests, named agricultural divine referents, a military simile, an axis-like
    tree image reaching heaven and hell, destructive fire in a grove, and seasonal
    constraints on planting.
  language: English
  quote_policy: quoted
