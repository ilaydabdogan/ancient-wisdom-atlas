canonical_text:
  quote: ''
  summary: The speaker announces agricultural themes, invokes agricultural and rustic
    deities, addresses Caesar as a possible future divine power, then gives instructions
    on ploughing, studying soils and climates, crop rotation, manuring, ash, stubble-burning,
    harrowing, and seasonal prayers. The passage includes mythic references to divine
    gifts of grain, wine, olive, plough, horse, and Deucalion casting stones from
    which humans were reared.
  language: English
  quote_policy: summarized
