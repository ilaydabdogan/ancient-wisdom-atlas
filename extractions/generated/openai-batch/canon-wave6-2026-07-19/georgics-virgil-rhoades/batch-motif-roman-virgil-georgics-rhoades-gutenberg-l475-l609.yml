canonical_text:
  quote: ''
  summary: The passage describes destructive winds, rain, thunder, and floods threatening
    crops; instructs farmers to observe celestial and animal weather signs; prescribes
    seasonal rites and offerings to Ceres before harvest; and explains that animal
    weather behavior follows changes in the air rather than innate prophecy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At reaping time, violent winds are described as clashing and able to uproot
    and toss the corn crop, stalks, and straw.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mass of waters and storm clouds brings heavy rain that floods crops, fills
    dikes, swells riverbeds, and agitates Ocean's firths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sire wields lightning in the clouds; earth quakes, animals flee, mortals
    fear, mountains are struck, and the South wind rages with showers and blast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The farmer is told to mark the months, heavenly signs, Saturn's star, and
    the Cyllenian orb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage commands worship of the gods and yearly dues to Ceres with sacrifice
    near the end of winter and the beginning of spring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ceres rite includes offerings of honeycombs, milk, and wine; a victim
    led three times around young corn; a choir calling Ceres to the household; and
    a ban on using the sickle before an oak chaplet, dance, and song.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sire of all is said to have ordained lunar warnings, signs of the South
    wind, and repeated sights by which a herdsman keeps cattle closer to their stalls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Signs of rising wind include tossing seas, crackling heights, booming beaches,
    murmuring forests, shoreward sea-gulls, cormorants on land, a heron leaving marshes,
    shooting stars, chaff, leaves, and feathers on waves.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Lightning and thunder from the North bring flooded fields, and mariners furl
    their wet sails.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Signs of approaching rain include cranes fleeing low, a heifer sniffing the
    gale, swallows near meres, frogs in mud, ants carrying eggs, a moisture-drinking
    bow, rooks, bathing waterfowl, a solitary crow, and sputtering lamp-oil seen by
    maids.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After rain, sunshine and open skies are forecast by sharp-edged stars, a clear
    moon, lack of fleecy cloud films, and particular behaviors of halcyons, swine,
    clouds, and the night-owl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In clear air Nisus is seen pursuing Scylla, and rooks call repeatedly, gather
    among leaves, and return to nests and brood after showers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The speaker says these animals do not have native wit or greater prescience
    from fate; their behavior changes when the storm and moisture of the air change.
  category: speech
  evidence_refs:
  - ev:9
