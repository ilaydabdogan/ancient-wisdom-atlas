canonical_text:
  quote: ''
  summary: 'A female helper prepares and conceals Aristaeus at Proteus''s sea-cave.
    Aristaeus captures the seer, who shifts shapes before being compelled to prophesy.
    Proteus explains that Aristaeus suffers divine wrath connected with Orpheus and
    Eurydice: Eurydice died from a water-snake while fleeing Aristaeus, Orpheus descended
    to the underworld for her, nearly led her back under Proserpine''s ruling, but
    lost her by turning to look. Orpheus then mourned for months, singing by the Strymon.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female helper sheds ambrosial dew around the youth, invigorates him, places
    him in a mountain-side cavern, and stands apart in shadowy mist.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cavern is described as vast, scooped into a mountain-side, struck by waves,
    a safe anchorage for mariners, and the hiding place of Proteus behind a rock barrier.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The time is marked by dog-star heat, fiery sun, parched blades, dried streams,
    and mud-beds baked by scorching rays.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Proteus comes from the billows, accompanied by watery sea-folk and sea-calves,
    and sits on a rock as a seer likened to a herdsman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aristaeus leaps on Proteus with a cry and binds him with fetters before he
    can rise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Proteus attempts escape by transforming into fire, a fearful beast, and a
    flowing stream, then returns to his own shape when trickery fails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aristaeus tells Proteus that he has come at heaven's behest to ask an oracle
    for his failing fortunes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Constrained by force, Proteus speaks the fates of heaven and says divine wrath
    plagues Aristaeus because of Orpheus.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Proteus says Eurydice, fleeing Aristaeus along a stream, did not see a monstrous
    water-snake waiting in the tall grass by the bank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Dryads, mountains, lands, rivers, and Orithyia mourn Eurydice's fate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Orpheus sings of his wife with a hollow shell from dawn to dusk on a lone
    shore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Orpheus comes to Taenarus, the palace of Dis, and a dark grove, entering and
    facing the Manes and the King of terrors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Orpheus's minstrelsy draws hollow shades from Erebus; the dead include men,
    women, heroes, boys, unmarried girls, and youths cremated before their fathers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The underworld is described with Cocytus, a swamp of dead water, and Styx
    as a ninefold barrier.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Tartarean halls, the serpent-haired Eumenides, Cerberus with triple jaws,
    and Ixion's wheel are all affected or halted in wonder.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Orpheus nearly leads Eurydice back to the upper air under Proserpine's ruling,
    but at the threshold he turns and looks at her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: When Orpheus looks back, his labor is poured out, the bond is broken, and
    thunder-like crashes are heard in hell.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Eurydice speaks farewell, says the fates recall her, stretches out her hands,
    then vanishes like smoke into empty air.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The boatman of hell does not permit Orpheus to cross the watery bar a second
    time, and Eurydice is death-cold on the Stygian barge.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: For seven months Orpheus weeps by the Strymon, sings in chill caverns, melts
    tigers' hearts, leads oaks with his song, and accepts no new love or desire.
  category: action
  evidence_refs:
  - ev:12
