canonical_text:
  quote: ''
  summary: The passage praises the practical wealth of woods and trees, contrasts
    wine-associated violence with rural blessedness, invokes the Muses for knowledge
    of celestial and natural causes, presents the husbandman’s seasonal labor and
    household rites, and connects this rural life with ancient Italian peoples, Rome’s
    origins, and the Saturnian golden age before war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Groves, shrubs, and trees provide fruit, fodder, shade, fencing, honey-food,
    torches, timber, vehicle parts, boat keels, weapons, floating wood, and hollow
    places for bees.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bacchus' gifts are contrasted with natural tree products; Bacchus is said
