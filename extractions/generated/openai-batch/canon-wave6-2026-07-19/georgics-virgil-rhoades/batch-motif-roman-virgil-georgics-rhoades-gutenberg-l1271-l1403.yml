    threatens the Lapithae with a bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tillers of the soil are described as far from arms, receiving food from the
    earth, lacking luxury, and possessing calm, rural places, cattle, worship, elders,
    and the last footprints of departing Justice.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks the Muses to receive him and show him the paths and stars
    of heaven, eclipses, moons, earthquakes, seas, and the causes of winter suns and
    lingering night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: If access to high natural knowledge is barred, the speaker asks for fields,
    vales, rivers, woods, plains, Spercheius, Taygete, and the cool dells of Haemus.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who understands nature's hidden causes is described as casting terrors,
    death's doom, and the roar of Acheron beneath his feet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person who knows the rural gods Pan, Silvanus, and the sister-nymphs is
    described as not being bent by public power, royal purple, civil feud, invasion,
    Rome's state, or unstable kingdoms.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Other people are described as rowing over Ocean, rushing on steel, entering
    courts and princes' doors, attacking cities, hoarding buried gold, seeking applause,
    reveling in brothers' blood, and going into exile.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The husbandman turns the soil with a hooked ploughshare; his labor sustains
    country, cottage, homestead, cattle, and steers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The year brings fruit, young cattle, wheat sheaves, crops, olives in winter,
    swine fed with acorns, arbutes from woods, and ripening vintage in autumn.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The husbandman's children cling to him; his house is chaste; his cows give
    milk; kids butt horns on grass.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: On holy days, the husbandman and comrades recline on grass around a fire,
