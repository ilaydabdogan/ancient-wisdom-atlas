literal_observations:
- id: obs:1
  text: Two hills near the place where Faatoafe lived are said to be the petrified
    double canoe of Lata.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lata is said to have come from Fiji, been wrecked, gone ashore, lived on land
    named for him, visited Upolu, built two large canoes at Fangaloa, and died before
    the deck uniting them was completed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The introduction of large double canoes united by a deck is traced to Lata,
    and a Samoan name meaning “steersman in the canoe of Lata” is noted as still extant
    in abbreviated use.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Three Fijians named Utu, Taua, and their sister Lenga came to Samoa and are
    linked with Matautu, Sataua, and Salenga respectively.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rock a short distance from shore was the principal god of Salenga; an unusually
    hollow sound from wind and current was treated as a call for offerings, and the
    fish were left untouched and sacred for a time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: After Malietoa and his retinue were entertained, some local people grumbled
    about the food required, and Malietoa’s party later decided to punish the indignity
    by sending armed men to plunder, burn, and kill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The chief named Tuato in the action ordered the people to plait coconut leaves,
    laid himself on them, and told the people to enclose his body, sling him on a
    pole, and place him at the village entrance road.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Malietoa’s troops found Tuato wrapped in leaves and lying across the road
    as if ready to be killed as a sacrifice and put in the oven; this was accepted
    as amends, and Tuato and the settlement were spared.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An unnamed man who had long been on Tutuila and was refused canoe passage
    asked the god Moso for help; Moso told him to come on his back and carried him
    by swimming about a hundred miles to Savaii.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Moso asked the transported man to bring him a bunch of coconuts, but the man
    went among the houses and people and forgot his benefactor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Moso searched the houses near daybreak for the man whose body was still rough
    with ocean salt, found him, dragged him away, killed him, and also smote all the
    people of the place; in the morning they were found dead on their pillows, explaining
    the phrase for sudden death.
  category: sequence
  evidence_refs:
  - ev:6
