canonical_text:
  quote: ''
  summary: 'The passage describes Samoan articles of manufacture: fishing-nets made
    chiefly by women in inland villages from hibiscus bark fibre; the use of netting-needles
    and communal nets for lagoon fishing; pearl-shell fish-hooks shaped to resemble
    small fish; and a native drill used to perforate shell for attaching hooks and
    lines.'
  language: English
  quote_policy: summarized
