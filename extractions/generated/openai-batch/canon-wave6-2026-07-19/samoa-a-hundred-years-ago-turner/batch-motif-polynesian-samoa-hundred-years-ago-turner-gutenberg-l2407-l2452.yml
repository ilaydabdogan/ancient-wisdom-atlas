canonical_text:
  quote: The wounds closed up and healed, the lad sat up
  summary: A body floats by river and sea to a beach where the sister finds it, prays
    for life, and the lad revives. The brother and sister leave by canoe to seek their
    parents' land. Tangaloa sends personified daughters and weather beings in search
    of his wife; the canoe is found and the pair is allowed to go on with a blessing
    for calm seas. The two reach home, name their parents, and are recognized as children
    who had been cast away.
  language: English
  quote_policy: quoted
