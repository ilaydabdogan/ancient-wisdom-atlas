canonical_text:
  quote: ''
  summary: 'The passage describes Samoan death and burial practices: loud lamentation
    and bodily acts of grief, preparation and wrapping of the corpse, opening and
    burning suspected disease matter in some cases, food restrictions and purification
    for those attending the dead, chiefly funerary display, burial gifts and redistribution,
    grave placement on ancestral land, body orientation, deposition of objects associated
    with illness, and grave markers differing by rank or warrior status.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A death in the house is followed by loud lamentation, including direct addresses
    to the dead such as wishing to have died in place of the deceased.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grief acts include rending garments, tearing hair, striking the face and eyes,
    burning the body with small firebrands, and beating the head with stones until
    blood flows; this bloodletting is called an offering of blood for the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The corpse is laid on a mat, oiled with scented oil, given turmeric-tinted
    oil on the face, wrapped in folds of native cloth, and left with the face and
    head uncovered while relatives weep around it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the deceased died of a complaint that had affected other family members,
    the body might be opened to search for the disease; any inflamed substance found
    is removed and burned to prevent further family illness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: While a dead body remains in the house, no food is eaten under that roof;
    the family eats outside or in another house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those attending the deceased avoid handling food and are fed by others for
    days; baldness and tooth loss are said to be punishments from the household god
    if the rule is violated.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fifth day is called a day of purification; face and hands are bathed with
    hot water, after which people are considered clean and resume usual eating practices.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the death of a high-ranking chief, work is suspended, strangers avoid passing
    through, the body may remain unburied for days, clan parties assemble, and each
    party parades the body shoulder-high while singing a dirge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A high-ranking chief's body is wrapped in the deceased's most valuable fine
    mat clothing.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Friends attending the burial bring presents, and on the day after the funeral
    the presents are redistributed so that each person leaves with something in return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bodies are generally buried without a coffin, except chiefs, for whom a log
    of wood is hollowed out as an encasement; the wrapped body is carried to the grave
    on the shoulders of several men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the grave there may be further wailing and exclamations lamenting the loss
    of protection and wishing to have died in place of the deceased.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The grave is called the fast resting-place; a chief's grave is called the
    house thatched with sandalwood leaves, referring to planting a tree with attractive
    foliage near the grave.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: There is no village burying-ground; people prefer to place their dead on their
    own ground among ancestors' ashes, and skulls of the dead are returned from wartime
    residence areas to ancestral graves after peace.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:15
  text: The grave may be dug near the house, lined with mats like a comfortable bed,
    and the body placed with the head toward the rising sun and the feet westward.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: Objects associated with the deceased's illness, such as clothing, a drinking-cup,
    and a bamboo pillow, and the digging sticks used for the grave are buried with
    the body, not for use by the dead but to prevent disease and death if others handle
    them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: The grave is covered with mats and beach sand, filled in, and marked by a
    small heap of stones; a chief's grave is built up in an oblong slanting form with
    white stones or shells, and a noted warrior's grave may have spears around it
    or a club laid on top.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
