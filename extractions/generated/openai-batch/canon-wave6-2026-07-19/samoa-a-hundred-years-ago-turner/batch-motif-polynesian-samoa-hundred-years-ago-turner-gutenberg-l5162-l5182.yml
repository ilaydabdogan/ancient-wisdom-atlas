  quote: Others say that the origin of Utu va mua was in two brothers... who, when
    there was war in heaven... fled to the earth and brought the January storms with
    them.
  summary: 'The passage gives several explanations for January names: first yam digging;
    an origin in two brothers who flee a heavenly war to earth with January storms;
    a variant in which the same brothers escape an earthly war to heaven and cause
    storms by their grief; and names tied to principal worship of a great god or Tangaloa.'
