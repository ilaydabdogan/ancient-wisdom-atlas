canonical_text:
  quote: ''
  summary: The passage catalogs several Samoan family or household gods, their embodiments
    in animals, plants, human forms, a skull, or household objects, and the taboos,
    punishments, prayers, offerings, omens, and priestly or representative roles associated
    with them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One family avoided eating a heart and an octopus because two gods were believed
    to be embodied in them, and eating them was believed to bring death from the insulted
    gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pu'a is named as both a large tree and a family god believed to live in that
    tree; leaves and branches were not to be taken or broken.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pu'a was also believed to be incarnate in the octopus and land crab; a land
    crab entering the house signaled that the household head was about to die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Samani was seen in the turtle, sea eel, octopus, and garden lizard; eating
    or injuring such beings required penance involving an unheated oven or rancid
    oil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Samani was said to predict a future time when Samoa would be filled with foreign
    gods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one account of Satia, a family priest was noted for cannibalism, demanded
    sacred food, claimed to be both doctor and demon, and required a stone mound with
    a house on top as payment for treating an ill chief.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In another family, Satia was believed able to become incarnate as a man or
    as a woman depending on the person desired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sengi, an old man, was an incarnation of the household god Sengi Vave and
    was saluted by household members on entering the house; failure to salute him
    caused a fine mat to disappear from the family bundle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Soesai was seen in the domestic fowl in one family and in the eel, octopus,
    and turtle in another; prayers for life and recovery were offered in danger and
    at childbirth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Si'u appeared in skull form once a year about May; Lemana was named as priest,
    and thanks were offered to Lemana when the family survived famine or pestilence.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sina 'Ai Mata was incarnate in the Ve'a bird, was used to frighten noisy children,
    and was associated with a prohibition on eating fish eyes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Tongo had different incarnations in different families, including the bat,
    stinging ray fish, and mullet; related penalties included food changing into turmeric,
    fighting over refusal to surrender a ray fish, and disease ending in a squint
    after eating mullet.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Tuialii was praised as kind and led one family to wild yams during scarcity.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Another family prayed to Tuialii before the evening meal for life and health,
    with a blazing fire described as essential to the prayer.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Tuialii was associated with the sea eel, octopus, mullet, and the ends of
    banana leaves; using a banana-leaf end as a cap was punished by baldness, and
    children in the family were named after the god.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Tuipangota was a household god and family guardian against theft; an unknown
    thief was handed over by prayer to be killed, and stone platforms served as the
    god's seat and altar for offerings.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:17
  text: Taumanupepe was incarnate in butterflies; household members who caught or
    killed butterflies were liable to be struck dead.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:18
  text: In another family, Taumanupepe was said to have three mouths, and drinking
    from a coconut shell water-bottle with all three openings perforated was forbidden.
  category: object
  evidence_refs:
  - ev:13
