- id: motif:3
  label: Prayer and offering to household deity for life, health, preservation, or
    punishment
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  - divine_judgment
  basis: Soesai and Tuialii receive prayers for life or recovery, Tuialii receives
    a blazing fire offering, Lemana is thanked for preservation, and Tuipangota receives
