canonical_text:
  quote: ''
  summary: 'The passage describes Samoan beliefs about the soul departing at death
    to Pulotu under the ocean, then outlines household and village religious practices:
    birth assignment to an aitu, divine visible incarnations in animals and objects,
    food and injury taboos, household prayers and offerings, divine speech through
    family members, sacred canoes, village gods, temples or sacred groves, cult objects
    used in worship and oaths, and hereditary or chiefly priests.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Samoans are described as believing in an angānga, a soul or disembodied
    spirit distinct from the body, which at death goes away to Pulotu under the ocean.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Samoan life was understood to be influenced by many deities
    requiring belief and practice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At birth, a Samoan was supposed to be placed under the care of an aitu, and
    the god addressed at the moment of birth became that person's god for life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: These gods were believed to appear in visible incarnations, and the particular
    visible form of one's god was treated as an object of veneration.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Examples of visible divine incarnations include eel, shark, turtle, dog, owl,
    lizard, other fish, birds, four-footed beasts, creeping things, and some shellfish.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person might eat the incarnation associated with another person's god, but
    considered it deadly to injure or eat the incarnation of his own god.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The god was believed to avenge such an insult by entering the offender's body
    and causing the thing eaten to generate there until death resulted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father of the family acted as high-priest and usually offered a short
    evening-meal prayer for protection from fines, sickness, war, and death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Family feasts in honor of household gods included pouring out a cup of intoxicating
    ava as a drink-offering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The household gods were believed to have a spiritual presence in the family
    house as well as in their material incarnations.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A god was sometimes believed to come among the family and speak through the
    father or another family member, giving instructions to remove or avert an evil.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: A family might be instructed to build a canoe and keep it sacred to the god;
    they could use it, but it was death to sell or part with it.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Every village had a god, and everyone born in that village was regarded as
    the property of that god.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Village worship could occur in a small temple, the village great house when
    needed, or a sacred grove where prayers and offerings were presented.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: Temple objects included a suspended conch shell, two stones, a man-head-like
    object with white streamers on a pole, and a suspended coconut-shell drinking
    cup.
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: The coconut-shell cup and other temple objects were used in oath ordeals;
    suspected persons touched the object and invoked divine destruction if guilty.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Priests, sometimes chiefs and often hereditary claimants in a family, declared
    the god's will, set feast days, received offerings, thanked the people, and decided
    whether war was permitted.
  category: attribute
  evidence_refs:
  - ev:13
