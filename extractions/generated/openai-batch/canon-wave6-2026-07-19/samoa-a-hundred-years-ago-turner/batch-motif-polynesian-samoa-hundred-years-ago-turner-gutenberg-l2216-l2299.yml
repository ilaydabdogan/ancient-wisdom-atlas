canonical_text:
  quote: ''
  summary: 'The passage describes Samoan infancy and childhood customs as reported
    by Turner: birth assistance by female relatives, prayers and promised offerings
    to a household god for the safety of mother and child, deity-associated naming
    of children, gendered cutting of the umbilical cord, prenatal child destruction
    contrasted with postnatal care, infant head and nose shaping, feeding and milk-testing
    practices, occasional god-directed exclusive breastfeeding, a modified form of
    circumcision for boys, and later naming customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At childbirth, the mother’s own mother usually served as midwife, or another
    female friend did so if the mother’s mother was unavailable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A male relative, described as the mother’s father or her husband, prayed to
    the household god for the safety of mother and child and promised offerings if
    they were preserved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Offerings to the household god could include a canoe, a house, fine mats,
    or other valuable property, with demands attributed to the priest’s caprice and
    covetousness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The household god of the father’s family was usually prayed to first; if the
    birth was tedious or difficult, the household god of the mother’s family was invoked.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After birth, the god prayed to immediately before delivery was remembered,
    its incarnation was acknowledged in the child’s future life, and the child was
    called the deity’s “merda” during infancy and childhood.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:6
  text: For a boy, the umbilical cord was cut on a club so that he might grow up brave
    in war; for a girl, it was cut on a cloth-beating board associated with women’s
    cloth-making work.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that postnatal infanticide and exposure were unknown in
    Samoa, while destruction before birth occurred, with pressure named as the means
    employed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the first two or three days, the infant’s head was surrounded with
    three flat stones and the forehead and nose were pressed or flattened according
    to local ideals of appearance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the first three days, the infant was fed juice from chewed coconut kernel
    strained through native cloth and dropped into the mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the third day, a woman of the sacred craft examined milk in a cup with
    water and two heated stones, repeatedly judging whether it was curdled, bitter,
    poisonous, sweet, or wholesome before breastfeeding was permitted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the period when milk was being examined, infants were fed coconut juice
    or sugar-cane juice; the passage states that many children died from this treatment
    and from early feeding or weaning.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: A father or other family member, through whom the family god was supposed
    to speak, could order that a child receive only breast milk for an indefinite
    time; this was called the god’s “banana.”
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: A modified form of circumcision occurred around the eighth or tenth year,
    when two or three boys went voluntarily to someone in the village for the incision
    and gave a small reward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Children were named after the household god during infancy and childhood;
    later names could come from animals, plants, places, occupations, actions, passing
    events, and occasionally names of superior gods for chiefs.
  category: relationship
  evidence_refs:
  - ev:9
