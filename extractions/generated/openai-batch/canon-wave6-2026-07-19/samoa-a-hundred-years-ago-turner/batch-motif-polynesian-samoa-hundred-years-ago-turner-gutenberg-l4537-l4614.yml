canonical_text:
  quote: ''
  summary: The passage describes fine mats as prized wealth gained through repeated
    chiefly marriages, land and title tenure among chiefs and family heads, village
    legislative and judicial functions, customary laws and penalties, refuge and exile
    after serious crimes, food fines, and bodily punishments or nose-biting anecdotes
    connected with adultery and jealousy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fine mats are described as highly valued, and repeated marriages of a chief
    are presented as sources of fine-mat gain for heads of families.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chief might be married many times over a lifetime, while probably having
    no more than two wives living with him at one time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Heads of families sought marriages for the chief's sons and daughters as often
    as possible, and the passage says this marriage or polygamy business was a main
    connecting link between them and the chief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Land is said to be owned by chiefs and heads of families, with known family
    lands and chiefly bush or forest tracts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A titled head of a family may dispose of family land but is expected to formally
    consult all concerned; otherwise family members may remove the title and give
    it to another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Heads of families may unite to take the title from their chief and give it
    to another member of the chief family who better accords with their wishes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The village chief and family heads formed the legislative body and common
    court of appeal in difficult cases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: One family head functioned like a prime minister by calling meetings and notifying
    other family heads about provisions for strangers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Although there were no written laws, the passage describes well-understood
    laws against theft, adultery, assault, murder, disrespectful language to a chief,
    rude behavior to strangers, pulling down a fence, and maliciously cutting a fruit-tree.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Death is described as the usual punishment for murder and adultery, and an
    injured party could seek revenge on members of the guilty party's family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In murder cases, the culprit and those belonging to him fled to another village
    or district that protected them as a refuge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: While fugitives remained away, their houses might be burned, plantations and
    land taken, and return to the original place forbidden by the chief and heads
    of families.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Large food fines could provide a feast for the entire village, but some punishments
    were made to fall exclusively on the culprit.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: For adultery, eyes were sometimes taken out, or the nose and ears were bitten
    off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage gives one incident of a jealous woman biting the nose of a young
    woman, and another story in which a farewell nose-salute is turned into a disfiguring
    bite.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
