canonical_text:
  quote: ''
  summary: 'The passage describes Samoan marriage arrangements and ceremonies: a proposal
    mediated by a food gift and kin approval, reciprocal preparation and exchange
    of tonga and oloa property, a ranked public ceremony in the marae with bridal
    procession and textile display, chastity-related ceremony and sanctions, simpler
    commoner ceremonies, and elopement followed by public proclamation and later recognition
    through festivities and property exchange.'
  language: English
  quote_policy: summarized
