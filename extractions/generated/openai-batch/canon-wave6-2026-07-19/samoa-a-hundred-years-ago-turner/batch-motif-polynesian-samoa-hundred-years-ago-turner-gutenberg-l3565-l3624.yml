canonical_text:
  quote: ''
  summary: The passage describes Samoan amusements, including comic theatricals, ventriloquism,
    a trick tale about a Samoan and a Tongan exchanging an emptied coconut husk and
    an owl substituted for a promised fowl, and various sports such as surf play,
    canoe racing, tree climbing, sham fighting, cock-fighting, juggling oranges, and
    wagered eating contests. It closes with the narrator’s comparative remark on similarities
    among juvenile amusements across peoples.
  language: English
