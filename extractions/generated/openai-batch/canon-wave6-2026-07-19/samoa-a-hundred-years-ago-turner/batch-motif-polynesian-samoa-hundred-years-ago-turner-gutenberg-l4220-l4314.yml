  quote: ''
  summary: The passage describes Samoan canoe construction, including hollowed-log
    canoes, sewn plank canoes, outriggers, paddles, sails, changes in canoe forms
    over generations, decorative shells and figure-heads, and chiefly shell-trumpet
    announcements during canoe arrivals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies canoes as a major display of Samoan ingenuity after
    house-building.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A common fishing canoe could be made by felling a tree, removing branches,
    and hollowing a log about fifteen feet long for one or two men.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A more carefully built canoe used separate planks raised from a keel and was
    made by a distinct class of professed carpenters.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The plank canoe was fastened by sewing boards together with cinnet through
    ledges or rims, with bread-fruit tree gum used as pitch to make the canoe water-tight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A decked part at the bow and stern allowed stowage; the bow deck was described
    as the seat of honour for the chief of a travelling party.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: Because long narrow canoes were unstable without support, an outrigger was
    used to keep them steady in the water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The outrigger is described as cross-pieces fixed to the canoe, downward sticks,
    and a long thick floating piece of wood parallel to the boat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Paddlers sat facing the direction of travel, drove short paddles into the
    water, and propelled the canoe forward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The canoe also had a triangular matting sail set with the base upward and
    the apex downward, though cloth sails in European boat-sail form were replacing
    mat sails.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage reports a sequence from earlier large double canoes, to later
    single outrigger canoes, to recent local copies of English or American whaleboat
    forms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The copied whaleboat-style craft were still fastened without nails, using
    cinnet plaited from coconut-husk fibre in the older local manner.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Canoes were not painted but were decorated with rows of white shells on the
    bow, stern, and upper outrigger.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some canoes had figure-heads with a human figure, dog, bird, or other device
    identified as the coat-of-arms of a village or district.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: An important chief could have one or two large shells in the canoe to use
    as trumpets during travel.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: As the canoe approached an important settlement or destination, shell trumpets,
    a chant by paddlers, and a united shout marked the arrival.
  category: sequence
  evidence_refs:
  - ev:6
