canonical_text:
  quote: ''
  summary: The passage recounts a Samoan origin-of-fire story in which Ti'iti'i, son
    of Talanga, enters Mafuie's subterranean realm, obtains fire after a conflict
    and exchange, and thereby explains cooked food and the production of fire by rubbing
    dry wood. It also gives an earthquake explanation tied to Mafuie's loss of one
    arm, a nearby Savage Island variant involving Maui and fire theft, and a Samoan
    account of an early age when material things spoke and fought in successive contests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Samoans say their ancestors once ate everything raw and owed cooked food
    to Ti'iti'i, the son of Talanga.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Talanga was favored by the earthquake god Mafuie, who lived in a subterranean
    region where fire was continually burning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Talanga entered the subterranean region through a perpendicular rock that
    opened when addressed by a formula naming him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ti'iti'i followed his father, watched where he entered, and later imitated
    Talanga's voice to gain admission through the rock.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Talanga warned Ti'iti'i not to anger Mafuie and said Mafuie ate people, but
    Ti'iti'i went toward the smoking furnace to get fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mafuie initially allowed Ti'iti'i to take fire, and Ti'iti'i returned to Talanga
    with cinders for baking taro.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mafuie blew up the oven, scattered the stones, and extinguished the fire while
    Talanga and Ti'iti'i were preparing taro.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ti'iti'i confronted Mafuie, wrestled with him, broke off Mafuie's right arm,
    and threatened the left arm before Mafuie admitted defeat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Mafuie said he needed his left arm to hold Samoa straight and level, offered
    wives, and then offered fire in exchange for sparing the arm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Mafuie told Ti'iti'i that fire would be found in every wood cut, and the story
    explains Samoan cooked food through fire made by rubbing dry wood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some people were said still to imagine Mafuie below Samoa shaking the earth
    by means of a long handle, with his one arm limiting the force of earthquakes.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Savage Island tale is described as somewhat similar, naming Maui as father
    and Maui as son, using a reed-bush entrance, and having the youth steal fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Savage Island tale, the youth set the bush in flames, the father failed
    to put the fire out, and fire and cooked food thereafter existed on Savage Island.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says Samoans tell of a long-ago age when all material things could
    speak, had evil natures, quarreled, and fought.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The listed sequence of nonhuman conflicts moves from small stones and grass
    through grasses, bush grass, trees, creepers, and then the wars of men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states a principle that when one thing prevails excessively over
    another or is superior, a tradition of its battle and victory is expected.
  category: other
  evidence_refs:
  - ev:7
