canonical_text:
  quote: ''
  summary: The passage explains Samoan names and associations for April and May. April
    is called Lo after a small fish appearing in shoals, and also Fanonga, meaning
    destruction, after a god worshipped at the eastern extremity of the group. May
    is called Aununu, meaning stem crushed, from the condition of yam stems, or alternatively
    from malicious demons thought to wander then; sea fish were also thought to be
    possessed and unusually savage. May is described as an unhealthy transition from
    wet to dry season, and on one island is also called Sina, meaning white, from
    worship of a goddess of that name.
  language: English
