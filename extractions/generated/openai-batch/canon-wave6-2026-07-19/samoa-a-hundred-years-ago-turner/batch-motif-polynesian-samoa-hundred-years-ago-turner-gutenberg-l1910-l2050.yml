canonical_text:
  quote: ''
  summary: The passage lists Samoan household gods and their associated forms, rites,
    offerings, taboos, protections, and omens. Aloimasina is seen in the moon and
    invoked at new moon and before battle. Apelesa appears through a turtle, an old
    man, and offerings; a priestess performs diagnostic rites. Other household gods
    detect theft, appear as a centipede, wild pigeon, eel, seaweed, or tree-associated
    presence, and require specific food, leaf, scent, or first-fruit observances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the new moon, family members addressed Aloimasina, made food offerings,
    feasted, and prayed for disease and death to be kept away; before battle they
    also prayed for obstacles to be removed from their running path.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one family, Apelesa was incarnate in the turtle; a family member did not
    eat turtle and covered his mouth when helping prepare one so that an embryo turtle
    would not enter his throat, grow, and cause death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another family, Apelesa spoke through an old man and received the first
    basket of food hung outside a house post; if rats, a dog, or a person took it,
    this was treated as Apelesa coming in that form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Apelesa was described as a family guardian who frightened away other gods.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Alaiava, priestess of Apelesa, prayed at births and severe illnesses; she
    entered a darkened part of the house, the house shook, and she came out naming
    the disease and ordering treatment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A first basket of cooked food for Apelesa was hung in the large village house;
    villagers did not touch it, while passing strangers were welcome to eat it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Asomua was a household god used to identify a thief when property was missing
    and was called First Day because he was supposed to exist before mortals.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Leatualoa was seen in a centipede living in a tree near the house; when a
    sick person awaited the centipede with a mat, movement under the mat signified
    burial, while movement on top signified recovery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Aumā was incarnate in the wild pigeon; if a visitor roasted a pigeon, a household
    member was wrapped in leaves and laid in a cool oven as an offering.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: For Aumā's family, reddish-seared bread-fruit leaves were not used, and using
    them was associated with rheumatic swellings or an eruption.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: For Iulautalo, the ends of leaves and foods were sacred and not handled or
    eaten, but in sickness the patient was to be fanned with ends of coconut leaflets.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Chief of Fiji was present as an eel; the family did not eat eel and presented
    first fruits from their taro plantation.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Limulimuta was seaweed used by family members fighting at sea; they carried
    and threw it to hinder enemy canoes, and it behaved differently for enemies and
    friends.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Moso'oi was a fragrant tree treated as the habitat of a household god; aromatic
    things were offered, and three messengers or appeals were used to invite the god
    to gatherings.
  category: action
  evidence_refs:
  - ev:11
