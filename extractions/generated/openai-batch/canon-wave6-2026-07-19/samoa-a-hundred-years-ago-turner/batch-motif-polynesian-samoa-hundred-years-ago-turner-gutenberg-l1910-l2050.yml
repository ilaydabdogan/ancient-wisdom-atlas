- id: motif:7
  label: substitute or symbolic oven offering
  taxonomy_refs:
  - sacrifice
  basis: After a visitor roasts a pigeon, a household member is wrapped in leaves
    as if to be baked and placed in a cool oven as an offering to Aumā.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The oven is explicitly cool, and the passage does not describe actual
