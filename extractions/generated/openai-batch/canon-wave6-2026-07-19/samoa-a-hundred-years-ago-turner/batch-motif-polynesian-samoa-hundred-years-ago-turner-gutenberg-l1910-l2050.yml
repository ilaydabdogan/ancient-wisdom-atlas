  label: food and material taboo under divine sanction
  taxonomy_refs:
  - divine_judgment
  basis: The passage describes restrictions on eating turtle, pigeon, eel, and ends
    of foods, and on using certain leaves, with penalties such as death or illness
    in some cases.
  evidence_refs:
  - ev:2
