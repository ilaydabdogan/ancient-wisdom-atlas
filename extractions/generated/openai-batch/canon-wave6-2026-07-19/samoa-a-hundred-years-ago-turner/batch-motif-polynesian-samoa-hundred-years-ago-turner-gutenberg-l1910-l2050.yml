  label: third appeal for divine attendance
  taxonomy_refs: []
  basis: At a gathering, three messengers or appeals are required because the god
    is not expected to come before the third entreaty.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: Only one example is provided in the passage.
