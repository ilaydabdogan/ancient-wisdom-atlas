- id: motif:2
  label: sacred exchange through offerings and first portions
  taxonomy_refs:
  - sacred_exchange
  basis: Families present food offerings, first baskets of cooked food, first fruits
    of taro, and aromatic offerings to household gods.
  evidence_refs:
