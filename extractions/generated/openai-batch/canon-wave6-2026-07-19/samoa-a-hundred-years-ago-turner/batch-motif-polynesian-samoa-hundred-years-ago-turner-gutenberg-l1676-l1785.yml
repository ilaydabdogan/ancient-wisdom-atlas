candidate_motifs:
- id: motif:1
  label: Deity incarnate in animal or ritual object
  taxonomy_refs: []
  basis: Multiple gods are described as incarnate in eel, cuttle-fish, mullet, turtle,
    owl, rail, or represented by a spear.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage uses the term incarnation and idol representative; it does
    not narrate a transformation event.
- id: motif:2
  label: Mock cooking or mock burnt-offering to avert divine danger
  taxonomy_refs:
  - sacrifice
  basis: The lads are laid in an oven pit as if to be cooked as a peace-offering,
    and ovens that cooked an incarnation require someone to undergo a make-believe
    cooking as a mock burnt-offering.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The rite is explicitly mock or make-believe rather than an actual killing
    in the described cases.
- id: motif:3
  label: Offering and prayer in exchange for healing or protection
  taxonomy_refs:
  - sacred_exchange
  basis: Recovery after Taisumalie's healing is followed by feast, kava, thanks, and
    protection prayer; Tufi removes sickness in return for prayers and offerings.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The exchange is described in ethnographic summary, not as a single narrative
    episode.
- id: motif:4
  label: War omens from animal behavior and natural signs
  taxonomy_refs: []
  basis: Lightning movements, owl flight, rail appearance, and a spear carried in
    the war fleet all function as signs or indicators for warfare.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: No specific taxonomy reference among the supplied motif families directly
    names omen divination.
- id: motif:5
  label: Divine curse or danger from eating a taboo incarnation
  taxonomy_refs:
  - divine_judgment
  basis: Eating the god in eel form is expected to bring death or wrath, oven use
    after cooking an incarnation is said to bring death without ceremony, and eating
    Tongo's mullet brings a squint curse.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:9
  confidence: medium
  cautions: The passage frames some effects as expected or believed; the Taisumalie
    episode reports that death did not occur.
- id: motif:6
  label: Blood offering for dead animal incarnation
  taxonomy_refs:
  - sacrifice
  basis: A dead owl identified with Tongo is covered with white cloth, and villagers
    bruise their foreheads with stones as an offering of blood with a death wail.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The blood is self-inflicted mourning blood rather than slaughter of a
    victim.
- id: motif:7
  label: New-moon ritual suspension and seclusion
  taxonomy_refs: []
  basis: At the new moon for Titi Usi, work is suspended, house blinds are kept down,
    people sit still indoors, and ceremonies end with a shell-trumpet.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not connect the new-moon rite to a broader seasonal-cycle
    taxonomy.
