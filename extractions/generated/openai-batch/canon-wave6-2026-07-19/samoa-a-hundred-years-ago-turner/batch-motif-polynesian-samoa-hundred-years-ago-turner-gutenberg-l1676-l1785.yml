canonical_text:
  quote: ''
  summary: 'The passage describes several Samoan village, family, and war gods: Taisumalie
    in animal and human incarnations with mock cooking rites, healing, kava offerings,
    and war consultation; Tili Tili as a lightning-related war and mischief deity;
    Titi Usi as a new-moon deity appearing like a shining leaf girdle; Tongo as an
    owl and mullet god with war omens, blood offering, and curse; Tu as a rail-associated
    war god; and Tufi as a spear-represented war and healing god.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taisumalie is said to be incarnate in the sea eel; an eel was caught, cooked,
    and partly eaten by two local lads serving Christian teachers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the lads were said to have eaten the god, local people beat them, placed
    them in an oven pit under leaves as if for cooking, and treated the act as a peace-offering
    to avert the deity's wrath; when the lads did not die, the people concluded Taisumalie
    was a sham.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Taisumalie was also a household god among families; in one place a family
    member was the incarnation and was consulted before war about whether to go and
    what would happen.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Taisumalie incarnation in an old man acted as family doctor; he rubbed oil
    on the affected part, shouted the god's name five times, called him five times
    to heal, and successful recovery was followed by feasting, a kava offering, thanks,
    and prayer for protection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Taisumalie was also incarnate for different families in the cuttle-fish, mullet,
    and turtle; if an incarnation was cooked in the family oven, the oven required
    a mock burnt-offering or its use was said to bring death to the family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tili Tili was a village god in Upolu associated with mischief-making, quarrels,
    war, darkness, and lightning; lightning patterns in war were interpreted as help,
    ambush, enemy retreat, danger, or an order to retreat.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Titi Usi was a village god in Savaii worshipped at the new moon, appearing
    like a bright shining leaf girdle; work stopped, blinds were kept down, people
    remained indoors, and a shell-trumpet signaled the end of ceremonies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tongo was a war god incarnate in the owl; owl movements before troops signaled
    victory or retreat.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When a dead owl was found, it was covered with white native cloth, and villagers
    assembled, beat and bruised their foreheads with stones as an offering of blood,
    and made a death wail, while Tongo was still understood to exist in remaining
    owls.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tongo was also a family god incarnate in the mullet; eating that fish was
    said to bring a curse in the form of a squint.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Tu was a war god said never to sit down and incarnate in the rail; the bird's
    reddish glossy appearance signaled war, while a dark dingy appearance ordered
    people to stay still.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Tufi was represented by a ten-foot cocoa-nut tree spear; offerings were laid
    before it in worship, it was taken in the war fleet, and in peace Tufi was regarded
    as a doctor removing sickness in return for prayers and offerings.
  category: relationship
  evidence_refs:
  - ev:11
