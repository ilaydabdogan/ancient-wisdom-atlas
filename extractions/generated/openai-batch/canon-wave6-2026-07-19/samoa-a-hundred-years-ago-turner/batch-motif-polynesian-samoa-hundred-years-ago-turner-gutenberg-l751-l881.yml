candidate_motifs:
- id: motif:1
  label: Heavenly deities summoned to protect a threatened human
  taxonomy_refs: []
  basis: The Aitu Langi gods are said to fall from heaven in response to a blind man's
    call to protect his son from a cannibal chief.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only a brief origin notice and does not narrate the
    rescue in detail.
- id: motif:2
  label: Battle decision by divine omen
  taxonomy_refs: []
  basis: War decisions are repeatedly governed by signs from a shell, owl, rail, fish,
    cloud, or shade associated with a deity.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:10
  - ev:14
  confidence: high
  cautions: The omens vary by deity and locality; the passage does not describe a
    single unified ritual system.
- id: motif:3
  label: Deity present in animal, object, or atmospheric form
  taxonomy_refs:
  - shapeshifter
  basis: The passage describes gods as represented by shells, incarnate in owls, seen
    in a rail, temporarily incarnate in dogs or rats, and seen in fish, cloud, or
    shade.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  - ev:12
  - ev:14
  confidence: medium
  cautions: The taxonomy reference is approximate because the text often speaks of
    representation or incarnation, not necessarily transformation by the deity.
- id: motif:4
  label: Offerings exchanged for weather, food, safety, or prosperity
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Food offerings and prayers are made for fine weather, successful food-finding,
    first fish, avoidance of calamities, and prosperity.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage reports several local practices under different deities.
- id: motif:5
  label: Blood rite for divine condolence or taboo expiation
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  basis: Villagers shed blood after finding a dead owl associated with Fanonga, and
    taboo violators under Tamauanuu shed blood to prevent shark attack.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: 'The two blood rites have different stated occasions: condolence with
    a god and prevention of punishment after taboo violation.'
- id: motif:6
  label: Prophecy of a foreign god consuming local gods
  taxonomy_refs: []
  basis: Ave i le tala is said to have predicted that a powerful foreign god would
    eat up all the gods of Samoa except Ave i le tala, and the spread of Christianity
    was later identified with that prediction by many people.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage reports the prophecy through missionary ethnography and notes
    a later interpretation; it does not provide an indigenous narrative context beyond
    this summary.
- id: motif:7
  label: Divine stones as parents of a rain-controlling god
  taxonomy_refs:
  - divine_parent_child
  basis: Fonge and Toafa are literal stones treated as gods and as the parents of
    Saato, who controlled rain.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain how stones became parents or narrate Saato's
    birth.
- id: motif:8
  label: Sacred precinct and portable war emblem
  taxonomy_refs: []
  basis: In one district Faamalu had a temple with a shell carried among troops, while
    trees around the temple were sacred and not used.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage gives this as one district's practice and does not elaborate
    temple ritual.
