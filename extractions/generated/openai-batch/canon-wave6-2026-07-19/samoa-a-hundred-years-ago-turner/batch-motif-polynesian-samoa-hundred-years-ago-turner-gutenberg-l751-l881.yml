canonical_text:
  quote: ''
  summary: The passage catalogues several Samoan village, war, childbirth, weather,
    and marine deities, describing their visible forms or incarnations, omen practices
    before battle, offerings for weather, food, prosperity, or safety, blood rites
    after divine calamity or taboo violation, and a prophecy concerning a powerful
    foreign god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Aitu Langi gods were said to have fallen from heaven when called by a
    blind man to protect his son from a cannibal chief.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A temple for one Aitu Langi had ten seats for principal chiefs, and a large
    shell was the only visible representation of the god.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In war, the shell's position and sound were interpreted as signals either
    to fight or to refrain from fighting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tupai, the high priest and prophet, was feared, and his look was described
    as poisonous to coconut and bread-fruit trees.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another place Aitu Langi was said to be incarnate in an owl, whose flight
    direction was read as a battle omen.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Alii Tu was seen in the rail bird, and the bird's flight was likewise observed
    as a war omen.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ave i le tala was an accoucheur god whose priest prayed for a patient when
    sent for.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ave i le tala was credited with predicting a powerful foreign god who would
    eat up all the gods of Samoa except Ave i le tala himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fonge and Toafa were two oblong smooth stones on a raised platform and were
    regarded as parents of Saato, a god who controlled rain.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cooked taro and fish were offered on the stones with prayers for fine weather
    before pigeon-catching expeditions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yam searchers and casual passers-by also placed food offerings on the stones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When offerings on the stones were eaten at night by dogs or rats, this was
    taken to mean that the god had temporarily become incarnate in those creatures.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Fanonga was a war-god said to be incarnate in the Samoan owl; a pet owl received
    food offerings and its flight was read for battle omens.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: At annual fish festivals, the first fish from the first oven was given to
    Fanonga.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A dead owl found under a settlement tree prompted villagers to burn their
    bodies with firebrands and beat their foreheads with stones until blood flowed
    as condolence to the god.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Faamalu was represented by a trumpet-shell and received annual offerings and
    prayers for protection from calamities and for prosperity.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: Tamauanuu, a marine deity, was worshipped at the same time as Faamalu, and
