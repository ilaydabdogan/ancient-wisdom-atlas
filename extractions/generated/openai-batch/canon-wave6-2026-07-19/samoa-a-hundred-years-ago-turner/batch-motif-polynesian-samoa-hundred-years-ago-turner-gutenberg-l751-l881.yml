  claim: Within the passage, Aitu Langi, Alii Tu, Fanonga, and Faamalu share the function
    of guiding warfare through omens read from an associated object, animal, fish,
    or cloud.
  claim_level: same_function
  target: war-omen practices among the village and war gods described in this passage
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:10
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal functional comparison only; the passage does not
    claim historical relation among these practices.
- id: claim:2
  claim: Several deities in the passage receive offerings or blood acts in contexts
    of exchange, condolence, or expiation, but the stated purposes differ by deity
    and occasion.
  claim_level: same_function
  target: ritual offering and expiation pattern within the passage
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: Food offerings, first-fruit offerings, blood condolence, and taboo
    expiation are grouped only by broad ritual function, not by an explicit taxonomy
    in the passage.
