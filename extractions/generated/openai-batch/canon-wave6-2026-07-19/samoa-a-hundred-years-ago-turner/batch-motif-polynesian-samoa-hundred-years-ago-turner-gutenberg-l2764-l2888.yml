canonical_text:
  quote: ''
  summary: The passage finishes a song-story in which Sina recognizes Maluafiti through
    his shadow in water, offends his sisters, and dies after swimming after him when
    he departs. It then describes Sinasengi's pool, where captured shadows of scenes
    appear on the water and deceive a spectator. The final summarized tale tells of
    Siati, a singer who wins a god's daughter, Puapae; Puapae helps him through deadly
    tasks, transforms into a fish to recover a ring, and with Siati creates magical
    obstacles that drown her father and sister. Siati later forgets Puapae, tries
    to marry again, and dies after she confronts and leaves him.
  language: English
  quote_policy: summarized
