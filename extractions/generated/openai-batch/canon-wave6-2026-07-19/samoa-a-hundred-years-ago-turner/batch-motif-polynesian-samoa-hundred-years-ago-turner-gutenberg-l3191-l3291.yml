canonical_text:
  quote: ''
  summary: The passage gives an ethnographic description of Samoan clothing, cloth-making,
    fine mats, cleanliness practices, and special-occasion adornment. It also includes
    a brief footnote about gods arriving in Tongan canoes and foreign vessels, and
    a fabulous story in which Tutunga, the paper mulberry, and Salato, a stinging
    tree, are brothers whose boundary dispute leads to Salato being set apart as sacred
    and Tutunga being punished by being processed into cloth.
  language: English
  quote_policy: summarized
