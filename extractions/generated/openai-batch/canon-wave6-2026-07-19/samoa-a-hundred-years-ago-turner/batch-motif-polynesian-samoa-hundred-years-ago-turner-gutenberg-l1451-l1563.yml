canonical_text:
  quote: ''
  summary: 'The passage describes several Samoan gods and cult practices: Salevao
    as village, war, and family god with harvest feasts, healing rites, animal incarnations,
    and a story in which he appears as the moon to save Nonu; Sepo Malosi as a war
    and household god with animal omens and incarnations; Siuleo as a coastal fisherman’s
    god; Taafanua as a rail-incarnate war god; and Tangaloa Langi as a superior celestial
    god associated with the moon, snipe, images, temple enclosure, offerings, prayer,
    thunder, and punishment signs.'
  language: English
  quote_policy: summarized
