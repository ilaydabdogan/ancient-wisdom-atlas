candidate_motifs:
- id: motif:1
  label: offerings and prayers exchanged for crops, healing, protection, or blessing
  taxonomy_refs:
  - sacred_exchange
  basis: The passage repeatedly links offerings, feasts, mats, kava, gifts, and prayers
    with desired outcomes such as good crops, healing, protection, fishing success,
    planting success, and blessing.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage reports ritual expectations ethnographically; it does not
    provide a single narrative of a formal bargain.
- id: motif:2
  label: deity assumes or inhabits nonhuman forms
  taxonomy_refs:
  - shapeshifter
  basis: Salevao appears as the moon and is incarnate in eel and turtle; Sepo, Taafanua,
    and Tangaloa are each linked to animal incarnations.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:10
  confidence: medium
  cautions: The taxonomy term 'shapeshifter' is broader than the passage’s terms 'appeared
    as' and 'incarnate in'; incarnation and transformation should not be conflated
    without review.
- id: motif:3
  label: divine punishment for violating incarnation or ritual obligation
  taxonomy_refs:
  - divine_judgment
  basis: Eating a god’s incarnation is said to cause sickness or death, absence from
    worship is punishable by death, and rejected prayer to Tangaloa is linked with
    threatened punishment.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:11
  confidence: medium
  cautions: Some examples are described as supposed beliefs rather than narrated events;
    review is needed before treating them as a unified judgment motif.
- id: motif:4
  label: animal movement as war omen and guide
  taxonomy_refs: []
  basis: Sepo’s bat and Taafanua’s rail both direct military action through forward
    flight versus turning back or blocking the way.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The available taxonomy list has no exact war-omen animal category.
- id: motif:5
  label: astral rescue through divine moon appearance
  taxonomy_refs:
  - shapeshifter
  basis: Salevao saves Nonu’s life by promising to be the moon on the horizon and
    then being seen as the moon in the morning.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a specific episode; whether it belongs with wider astral-rescue
    or shapeshifting motifs requires comparison outside this passage.
- id: motif:6
  label: contained temple limits destructive divine movement
  taxonomy_refs: []
  basis: Tangaloa’s temple is closed all around because people think gods would otherwise
    move in and out too easily and become more destructive.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: Only one example appears in the passage, and no available taxonomy reference
    exactly matches temple containment.
- id: motif:7
  label: natural sound as sign of accepted or rejected prayer
  taxonomy_refs: []
  basis: Thunder is treated as a sign that Tangaloa heard prayer, while slight tremulous
    reverberation signals rejection and punishment.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage gives this sign system for Tangaloa only.
