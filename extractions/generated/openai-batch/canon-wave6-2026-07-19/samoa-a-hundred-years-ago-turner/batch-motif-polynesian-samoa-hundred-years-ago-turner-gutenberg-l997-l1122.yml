canonical_text:
  quote: ''
  summary: The passage lists Samoan village, war, plantation, and land gods and their
    representatives, including a sea-eel, coconut-leaf basket, rainbow, whale teeth,
    heron, stone, and wooden bowl. It describes omens for battle and travel, stories
    of divine incarnation, a captured thunder being, confession and disease divination,
    offerings, and curses against thieves or injurers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A god of one small island is described as seen in the sea-eel; a sea-eel driven
    ashore by gale or tidal wave portended evil and caused commotion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ga'e Fefe is described as a war-god seen in a coconut-leaf basket.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A story says Ga'e Fefe hid in a coconut-leaf basket during a battle between
    Samoan and Tongan gods and escaped while many others were killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: People avoided stepping over a coconut-leaf basket because the god might be
    in it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A newly plaited coconut-leaf basket upside down and across the road was a
    bad omen for fighters, while an old basket to the side and lengthwise was a good
    sign.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: La'ala'a is described as an invisible Savaii village war god supposed to go
    before troops.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When hosts planned ten pigs but visitors publicly counted eleven, the extra
    pig was attributed to La'ala'a.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In one war episode La'ala'a became incarnate in a yellow man, who was killed
    to satisfy the Upolu people and stop the war.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Out of respect for La'ala'a, the village avoided using the word la'ala'a for
    stepping over and used soposopo instead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A plantation form of La'ala'a guarded plantations with the help of the god
    thunder.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that harm was attributed to thunder rather than lightning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Thunder once struck the house of Fala and Paongo; the family caught him, tied
    him with pandanus leaves, and poked him with firebrands.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Thunder cried out that he was burning and wished to live.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The family spared Thunder and made him a god to keep rats away from their
    food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A basket filled with pandanus leaves and charred firebrands was hung among
    trees as a warning to Thunder and as a scare or imprecation against thieves.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: Another La'ala'a is described as an Upolu god and champion of wrestlers; the
    place was thought to be filled with gods who came to wrestle.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: Another god named La'ala'a predicted war, sickness, and family events.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: In sickness, villagers confessed crimes and prayed to be stepped over or forgiven;
    the god was believed to dwell in the mountain, and any part of it could serve
    as confessional.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: A priest praying to La'ala'a became possessed, told the cause of disease,
    and forbade the culprit's evil conduct.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: Laa Maomao, the great step, is identified as a name of the rainbow and as
