  category: relationship
  evidence_refs:
  - ev:10
- id: obs:21
  text: A rainbow before troops and across the path or canoe course caused them to
    return; a sideways rainbow encouraged advance because it was taken as the god
    marching with them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:22
  text: Two sperm-whale teeth named Mao ma Uli represented war gods of a large village
    and were kept in a cave.
  category: object
  evidence_refs:
  - ev:11
- id: obs:23
  text: Before battle, a priest stayed behind to pray and observe the whale teeth;
    east-west orientation was good, while north-south orientation signaled defeat.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:24
  text: The heron was the incarnation of a war god on Manono.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:25
  text: If the heron flew before the troops it was a good sign, but if it flew across
    the path it was unfavorable.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:26
  text: A story says Heron and his brother Destruction cooked food that was not half
    done; the enraged family attacked them.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:27
  text: Destruction had his neck broken by a thrown stick, while Heron escaped by
    having his neck pulled long.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:28
  text: Moso is described as a great land god in opposition to Tangaloa, the god of
    the heavens.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:29
  text: The root of the name Moso is said to be a fragrant yellow-flowered tree, Cananga
    odorata.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:30
  text: In one village a stone represented Moso, and passing travelers placed a scented
    wreath or necklace on it as an offering.
  category: action
  evidence_refs:
  - ev:14
- id: obs:31
  text: In another place Moso was represented by a large wooden bowl decorated with
    white shells and called Lipi, or sudden death.
  category: object
  evidence_refs:
  - ev:15
- id: obs:32
  text: A priest received offerings from injured people and prayed to Moso with crying
    and tears to curse an unknown thief or injurer with sudden death.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:33
  text: The imprecation asks Moso to make haste, show power, send the offender to
