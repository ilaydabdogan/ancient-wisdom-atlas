canonical_text:
  quote: ''
  summary: The passage gives Samoan etiological traditions for island and Upolu district
    names. Vavau divides lands between Vaii and Polu. Tangaloa takes Sinaleana from
    a cave to heaven and fathers Pili. Pili descends to earth, travels among islands,
    moves taro plants to Upolu, marries, has children, and at death assigns Upolu
    districts and social functions to them. The passage also gives local origin accounts
    for Aleipata, Salefao, and Lufilufi.
  language: English
  quote_policy: summarized
