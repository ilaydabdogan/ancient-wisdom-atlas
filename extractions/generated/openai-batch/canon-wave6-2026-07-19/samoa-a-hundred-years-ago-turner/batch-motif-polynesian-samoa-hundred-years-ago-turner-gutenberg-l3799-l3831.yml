canonical_text:
  quote: They undid the leaf, let the soul into him again, and immediately he brightened
    up and lived.
  summary: Two brother conjurors returning to Upolu encounter gods carrying the leaf-wrapped
    soul of the dying chief Puepuemai. A god mistakes Tuitopetope for one of their
    party and gives him the soul. The brothers later restore the soul to the chief,
    who revives, and they become renowned as healers and diviners.
  language: English
  quote_policy: quoted
