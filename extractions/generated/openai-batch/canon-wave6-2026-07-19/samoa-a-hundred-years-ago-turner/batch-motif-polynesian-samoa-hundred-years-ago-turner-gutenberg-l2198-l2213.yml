canonical_text:
  quote: ''
  summary: A household god in an Aana family is explained through an episode in which
    a woman experienced a premature birth-related event after bathing. Friends searched
    for the child and found an unusual number of prawns or crayfishes instead. They
    supposed the infant had become these crustaceans, treated the crayfish as the
    incarnation of a new household god, and offered food and prayers for family prosperity.
    The narrator then notes additional Samoan deities and frames them as receiving
    belief and ritual action.
  language: English
  quote_policy: summarized
