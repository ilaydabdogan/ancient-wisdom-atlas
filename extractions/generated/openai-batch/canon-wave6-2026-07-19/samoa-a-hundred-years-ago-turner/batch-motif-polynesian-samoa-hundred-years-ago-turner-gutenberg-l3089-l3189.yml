literal_observations:
- id: obs:1
  text: Young cocoa-nut liquid is described as the ordinary beverage of the Samoans,
    and a baked young cocoa-nut yields a hot drink for an invalid.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Samoans are described as having no fermented liquors but making an intoxicating
    draught from an infusion of chewed 'ava root.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a formal party of chiefs, 'ava is served before the meal in a cocoa-nut
    shell cup; the intended person's title is called, a cup-bearer delivers the cup,
    and chiefs receive it in order of rank.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Each village is described as having a large house with mats for receiving
    strangers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: When travelers arrive, village families prepare food, present it with a welcome
    speech and apology, and receive thanks and kind words from the strangers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a high-ranking chief is among the guests, the villagers may dress in their
    best, proceed in single file carrying food items, sing, lay the food in a heap
    for the guests, and hold an evening dance.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At meals, family members sit cross-legged around the circular house on mats,
    with each portion placed on a bread-fruit leaf; strangers receive a worthy portion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the beginning of the evening meal, the family head pours a little 'ava
    on the ground as a drink-offering to the gods and prays for prosperity, increase,
    health, productive plantations, fruit, and food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The 'ava prayer addresses war gods for a strong and numerous people in the
    land.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The 'ava prayer addresses sailing gods, asking them not to come ashore at
    that place but to depart along the ocean to another land.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A senior family member may call for the fire to be blown into a blaze and
    pray with an offering of flaming fire for divine favor, life, children, food,
    clothing, protection from sickness, and the driving away of sailing gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Savaii story, an old chief reserves a sea-crab for breakfast, but family
    lads eat it during the night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The old chief says he will commit suicide because of family unkindness, goes
    to a mountain ravine, threatens to jump and cause a storm to destroy the place,
    and jumps over the precipice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The old chief's daughter follows him, lies down on the edge of the ravine,
    and becomes a mountain to shut up the storm and save the people.
  category: sequence
  evidence_refs:
  - ev:6
