canonical_text:
  quote: ''
  summary: The passage presents several traditional explanations for the name Samoa.
    One account links it to the birth of Moa from rocks and earth and to sacred restrictions
    established by Salevao. Another links it to Tangaloa, his descendants named Moa
    and Lu, and Lu's descent to earth. Other accounts connect Samoa with sacred fowls
    preserved by Lu, a flood or rising sea, a heavenly-built vessel, a mountain landing,
    theft of the fowls by heavenly fishers, Lu's pursuit through the heavens, and
    a peace-making marriage in the tenth heaven that leads to the naming and peopling
    of Samoa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one origin account, the rocks married the earth; the earth became pregnant;
    Salevao, god of the rocks, observed motion in the centre of the earth; and a child
    named Moa was born.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Salevao ordered the male child's umbilicus to be laid on a club and cut with
    a stone, and the passage presents this as the origin of a birth custom for male
    children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Salevao provided water for washing the child, made it sacred to Moa, and sent
    a streamlet through bamboo for the rocks and earth; the passage presents this
    as the origin of springs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Salevao said he would become loose stones and that everything growing would
    be sacred to Moa until Moa's hair was cut; after the hair cutting the restriction
    ended, and the passage derives the name Samoa from Sa ia Moa.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a second account, Tangaloa of the heavens had children named Moa and Lu;
    Lu's son, also named Lu, sang the names in an order that angered Tangaloa, was
    beaten, escaped to earth, and named it Samoa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another account, the land was flooded by the sea, everything died except
    fowls and pigeons, and Lu made the remaining fowls sacred and not to be killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the vessel account, Tangaloa of the heavens and his son Lu built a canoe
    or vessel in the heavens with help from the carpenter Manufili and placed it on
    the surface of the earth when no sea yet existed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gaogao o le tai, wife of Lu, bore a son also called Lu; later births produced
    shell-fish and then the sea, and Lu was told to prepare the vessel for the making
    of the sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the sea rose, Lu took two fowls into the vessel; after several days afloat,
    the vessel rested on the mountain Malata in Atua at the east end of Upolu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage records variant accounts in which Lu came from the west with his
    fowls and his crew peopled the islands, or came directly from Tafiti apaau, the
    Winged Fiji.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two people of Tangaloa came down to fish, killed Lu's sacred fowls when the
    fowls tried to peck at their fish, and carried them off to the heavens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lu noticed unbroken morning cobwebs across roads east and west, suspected
    the fishing party from the heavens, and went upward from the mountain with only
    his fly-flapper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the first heaven, Lu smelled roast fowl, found the two culprits eating,
    accused them, and beat or pursued them with his fly-flapper through the heavens.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the pursuit reached the tenth heaven, Tangaloa identified it as Malae
    totoa, a place of rest where fighting was not allowed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Tangaloa asked Lu to let his anger subside and spare the thieves; in return
    Lu would receive the title King of heaven and Tangaloa's daughter Langituavalu
    as wife.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Lu accepted peace, the marriage took place, Tangaloa told Lu to name the earth
    Samoa, and Lu and Langituavalu had a child named Samoa from whom the islands were
    said to be peopled.
  category: sequence
  evidence_refs:
  - ev:10
