canonical_text:
  quote: ''
  summary: The passage reports traditions of human sacrifices demanded by the sun
    and ended through Ui’s substitution and marriage to the sun; lists Samoan names
    and images for planets, stars, constellations, meteors, and comets; recounts moon
    traditions involving ascent by tree or smoke, Sina and her child being taken into
    the moon, and the moon as the yearly timekeeper.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Remote traditions speak of human sacrifices to the sun at Papatea in the Eastward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sun called for a victim when it rose and when it set, and this continued
    for eighty days while the island population diminished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ui and her brother Luamaa fled from Papatea to Manu'a, where the sun was also
    demanding daily victims from households in rotation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The body of the offering was laid on a Pandanus tree, where the sun devoured
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Luamaa’s turn came, Ui insisted on being offered in his place and addressed
    the sun as a devourer of the people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sun looked at Ui, desired to live with her, ended the sacrifices, and
    took her as wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A variant says Ui was the daughter of the King of Manu'a, who gave her as
    an offering to the sun, ending the sacrifices and making her the people’s saviour.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Several heavenly bodies are named and described, including Venus, Mars, the
    Pleiades, Orion’s belt, the Milky Way, meteors, and comets.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two young men, Punifanga and Tafaliu, are said to have visited the moon, one
    going up by a tree and the other by a dense column of smoke from a fire he kindled.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sina, with her child, board, and mallet, was taken up by the moon after asking
    whether the moon could come down so her child could eat a piece of it during famine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the full moon, young Samoa is said to trace the features of Sina, the child,
    the board, and the mallet in the moon.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The moon was treated as the timekeeper of the year, with twelve named lunar
    months and some month names connected with gods specially worshipped then.
  category: attribute
  evidence_refs:
  - ev:8
