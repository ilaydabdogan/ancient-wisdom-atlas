    his children to follow him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Ilu, worm, and Mamao, distant, have sons named as kinds of rocks, the moon,
    the sun, the sea, and fresh water, and daughters named Great wind and Gentle wind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The sea is initially shut up; when it is set free, the three kinds of rocks
    are flooded and die, while the sun and moon flee to the heavens and live.
  category: sequence
  evidence_refs:
