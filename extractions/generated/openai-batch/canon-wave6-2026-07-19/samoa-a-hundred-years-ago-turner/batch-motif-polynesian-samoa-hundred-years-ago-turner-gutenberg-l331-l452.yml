candidate_motifs:
- id: motif:1
  label: Chiefly genealogy linked to ancestral succession
  taxonomy_refs:
  - royal_legitimacy
  basis: Savea is named as the first Malietoa, followed by twenty-three generations
    to a later recognized king.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents genealogy as traditionary and does not explicitly
    state a ritual or political theory of legitimacy beyond succession.
- id: motif:2
  label: Miraculous child from fallen heavenly head and origin of directions
  taxonomy_refs:
  - miraculous_child
  - ascent
  basis: A head fallen from heaven receives a body, becomes a speaking child, names
    himself All the sides of heaven, generates the four directions, and later ascends.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The father of the child is described through directions rather than as
    a single named figure.
- id: motif:3
  label: Release of confined sea floods early beings while celestial bodies escape
  taxonomy_refs:
  - flood_and_renewal
  - ascent
  basis: The sea is set free, floods and kills the rocks, while the sun and moon flee
    to the heavens and live.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage has flood and survival/ascent elements, but no explicit renewal
    after the flood.
- id: motif:4
  label: Primordial marriage of elements producing the world
  taxonomy_refs:
  - sacred_marriage
  basis: Fire and water marry, and from them spring earth, rocks, trees, and everything.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The marriage is between personified elements; the passage does not explicitly
    call it sacred or ritual.
- id: motif:5
  label: Life and humans emerging from decay, worms, or maggots
  taxonomy_refs:
  - death_rebirth
  basis: In one account creepers rot and maggots become men; in another a plant withers,
    swarms with worms or maggots, and they become men and women.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage describes transformation from decay to human life, not a death
    and rebirth of named individuals.
- id: motif:6
  label: Creator deity orders space into heavens, earth, islands, and under-earth
    regions
  taxonomy_refs:
  - chaos
  basis: Tangaloa exists in space, makes heavens and earth, is linked to island formation,
    creates the cuttle-fish, and sends it under the earth.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The text says Tangaloa existed in space but does not describe chaos in
    detail; taxonomy link is broad.
- id: motif:7
  label: Divine bird emissary searches the primordial ocean for land
  taxonomy_refs:
  - divine_parent_child
  - departure
  - return
  basis: Tangaloa sends his daughter in bird form repeatedly to search for land over
    the ocean, return with reports, and later bring earth and a plant.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives a divine parent-child relation and repeated sending/returning,
    but not a full heroic quest narrative.
- id: motif:8
  label: Humans generated from stones, fire, and first appearing man
  taxonomy_refs: []
  basis: Ants and coral make stones, loose rocks and fire produce Ariari, and Ariari
    with a woman produces the race of men.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is one of several variant anthropogonies in the passage.
- id: motif:9
  label: Human lifespan determined by material of formation
  taxonomy_refs: []
  basis: Humans formed from hard mussel live long, while those formed from poisonous
    mussel are fragile and short-lived.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference directly matches this material-longevity
    pattern.
- id: motif:10
  label: Soul as mobile child of clouds and night
  taxonomy_refs: []
  basis: The soul is called that which goes or comes, is daughter of vapour of lands
    forming clouds, and sleep is explained as the soul wishing to visit its mother
    at night.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage concerns sleep and the soul, not explicitly afterlife travel.
- id: motif:11
  label: Divine council determines whether death is reversible or final
  taxonomy_refs:
  - divine_judgment
  - resurrection
  - death_rebirth
  basis: The gods meet to decide the end of human life; one proposal would allow humans
    to rise again after sickness and death, while Supa proposes irreversible extinction.
