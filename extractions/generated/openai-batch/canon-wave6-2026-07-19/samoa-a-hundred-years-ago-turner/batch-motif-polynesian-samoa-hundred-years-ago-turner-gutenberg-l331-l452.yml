canonical_text:
  quote: ''
  summary: 'The passage gives a chiefly genealogy identifying Savea as the first Malietoa,
    then presents several origin traditions: Space raises a head fallen from heaven
    into a child named All the sides of heaven; the children of Ilu and Mamao include
    rocks, moon, sun, sea, fresh water, and winds, with the released sea flooding
    the rocks while sun and moon flee upward; fire and water marry and produce the
    earth and its contents, followed by contests among natural beings and human emergence
    from maggots; Tangaloa creates heavens, earth, islands, and the cuttle-fish; Tangaloa''s
    daughter in bird form searches the ocean for land and later witnesses worms become
    humans from a plant; other accounts form humans from stones, fire, Ariari, and
    mussels; the soul is linked to vapour, clouds, and sleep; and gods debate whether
    human death should be reversible or final using torch analogies.'
  language: English
  quote_policy: summarized
