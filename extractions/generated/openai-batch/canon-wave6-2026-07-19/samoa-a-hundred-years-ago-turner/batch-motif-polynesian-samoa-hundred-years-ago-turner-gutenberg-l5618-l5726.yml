    king of Pulotu, becomes enraged, goes to fight Papatea, conquers it, and the passage
    calls this the first war in history.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 5650-5660
  quote_or_summary: Those fleeing to the bush are killed, while those fleeing to sea
    escape; Tutu and Ila reach Tutuila, U and Polu reach Upolu, and Sa and Vaila reach
    Savaii, with each island name explained by combining names.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 5666-5671
  quote_or_summary: Manu'a is explained as meaning wounded; rocks and earth marry
    and have a child born covered with wounds, giving the small island group its name.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 5672-5677
  quote_or_summary: Lu's son Moa, named after preserve fowls, becomes king of Manu'a;
    fowls are then called Manu lele on Manu'a out of respect for the king's name.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 5678-5685
  quote_or_summary: Fitiaumua comes from the east, is a great warrior, conquers in
    Fiji, subdues leeward Samoan islands, reaches Manu'a, dwells there, and receives
    tribute from all Samoa.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5686-5694
  quote_or_summary: Taū is named from a dumb child of Faleile-langi, daughter of Tangaloa;
    the passage explains ū as the hollow unintelligible sound made by the dumb.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 5696-5712
  quote_or_summary: Fitiuta was formerly Anga'e, named from a child of Rocks and Earth
    breathing hard at birth; later Moiuuoleapai, daughter of Tangaloa, is ill-treated
    in Fiji, and Taeotangaloa goes to aid her, making a yam and banana garden; the
    king reconciles with her for the yams, producing a proverb and the name Fitiuta.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 5714-5726 and following passage text
  quote_or_summary: Olosenga is linked to Fuailangi, Originator of the heavens, who
    digs up earth from Niuleamoa's land on Taū; Niuleamoa pushes it into the sea as
    a floating island, and Fuailangi, Olo, Puletainuu, and Masuitufanga travel on
    it to Tonga and Samoa before it settles between Taū and Ofu.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
