canonical_text:
  quote: ''
  summary: The passage gives Samoan etiological accounts for island and place names.
    It tells of four children from Pulotu visiting Papatea, the ill-treatment and
    killing of some of them, Elo's retaliatory war, survivors who name islands by
    combining personal names, origins of Manu'a, Taū, Fitiuta, Olosenga, and Ofu,
    and stories involving Tangaloa's descendants, a floating island, a war god, and
    taboo around the sea eel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A couple at Pulotu named Head of Day and Tail of Day have four children:
    Ua, Fan, Langi, and Tala.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four children travel from Pulotu in the west to visit Papatea in the east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Papateans decide to kill the visitors; Ua is struck on the neck, Fan's
    neck is trodden on, Langi is surrounded and spat upon, and Tala is spared and
    escapes uninjured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tala and Langi return to Pulotu and report their ill-treatment to Elo, king
    of Pulotu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Elo goes to war against Papatea, conquers it, and destroys the place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who flee to the bush are sought out and killed, while those who flee
    to the sea escape.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Several escaped pairs reach islands and the names Tutuila, Upolu, and Savaii
    are explained as unions or altered unions of their personal names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The name Manu'a is explained from a child of Rocks and Earth who was born
    covered with wounds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lu's son Moa becomes king of Manu'a, and fowls are thereafter called Manu
    lele rather than Moa out of respect for the king's name.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Fitiaumua comes from the east, conquers in Fiji, subdues leeward Samoan islands,
    reaches Manu'a, and receives tribute from all Samoa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Taū is named from a dumb child of Faleile-langi, daughter of Tangaloa.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Taeotangaloa goes to Fiji to see his ill-treated sister Moiuuoleapai, stays
    with her, and turns bush into a fruitful garden with yam and banana plantings.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The king of Fiji reconciles with Moiuuoleapai because he wants the yams, and
    a proverb questions friends who are friendly only to the yam.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Fuailangi digs up earth from Taū; Niuleamoa pushes it into the sea as a floating
    island, and several figures travel on it seeking a place for a war god.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The floating island returns to Manu'a and rests between Taū and Ofu because
    Fuailangi thinks he can fight with people on either side.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Senga sees the new island, marries Lady Olo, and their names are united as
    Olosenga.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: Fuailangi is described as incarnate in the sea eel, with a portable altar
    and punishments for people cooking or eating the sea eel.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: A variant explanation says parrots flew ashore from a Fiji canoe, and Olosenga
    means the fort or refuge of parrots.
  category: other
  evidence_refs:
  - ev:13
- id: obs:19
  text: Ofu is named from another child of Faleile-langi who was clothed.
  category: relationship
  evidence_refs:
  - ev:14
