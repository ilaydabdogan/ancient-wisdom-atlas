canonical_text:
  quote: ''
  summary: The passage describes Samoan childbirth rejoicings, reciprocal exchange
    of oloa and tonga between the kin of husband and wife, milestone feasts as a child
    learns to sit, creep, stand, and walk, beliefs about twins, adoption as a property-exchange
    relationship, gendered childhood employments, boys' food-sharing exclusions, and
    an old children's song in which two deserted siblings wander to Tangaloa of the
    heavens; Tangaloa marries the girl, becomes jealous of her brother, and orders
    the brother killed.
  language: English
  quote_policy: summarized
