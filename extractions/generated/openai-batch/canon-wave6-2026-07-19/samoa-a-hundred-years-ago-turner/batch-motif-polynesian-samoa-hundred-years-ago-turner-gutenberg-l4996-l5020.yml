  quote: ''
  summary: 'The passage gives a Samoan-side explanation of the 1787 Tutuila conflict
    with members of La Perouse''s expedition: an unnamed native was wounded at the
    ship after an alleged theft, his friends sought revenge, the boat party at the
    beach was attacked with stones and killed, and the French dead were wrapped in
    native cloth and buried. The narrator frames the event as a case of disproportionate
    punishment provoking vengeance.'
