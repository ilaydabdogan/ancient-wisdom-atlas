canonical_text:
  quote: ''
  summary: The passage reports Samoan traditions about the heavens falling and being
    raised by plants, an unnamed man, or the giant god Ti'iti'i; traditions of travel
    between earth and heavens by mountain, smoke, or tree; tales of Mangamangai conceiving
    Child of the Sun by looking at the rising sun; Child of the Sun catching the sun
    to obtain blessings and to slow its course; and beliefs about the sun as timekeeper
    and as descending through the ocean at night.
  language: English
  quote_policy: summarized
