candidate_motifs:
- id: motif:1
  label: mistaken choice of apparent wealth over needed water
  taxonomy_refs: []
  basis: Tangaloa offers whales' teeth or water and advises water; the people insist
    on the first choice and receive stones instead.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives a local etiological narrative; any moral interpretation
    beyond the failed choice should be reviewed.
- id: motif:2
  label: mapped journey of souls to an under-ocean afterlife
  taxonomy_refs:
  - afterlife_journey_map
  basis: 'The passage names multiple route elements for the dead: death house, westward
    bush path, leaping-stones, sea crossings, Fafā, Luaō, current, and Pulotu.'
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The account is reported in missionary ethnographic prose rather than in
    an indigenous-language performance text.
- id: motif:3
  label: ranked entrances and social order among the dead
  taxonomy_refs: []
  basis: Chiefs and common people use different openings, while high-ranking chiefs
    later serve as supports in Saveasiuleo's royal house.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: medium
  cautions: The same passage also says spirits of all ranks drift together, so the
    hierarchy is not uniform across the whole afterlife route.
- id: motif:4
  label: death-threshold tree that returns a soul to the body
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: If a spirit strikes the tree of Leosia, the Watcher, the soul goes back to
    its body and the family celebrates return from the gates of death.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes restoration at the threshold, not necessarily a
    completed death-and-resurrection cycle.
- id: motif:5
  label: water of life restoring vitality and youth
  taxonomy_refs:
  - death_rebirth
  basis: Bathing in Vaiola makes spirits lively, bright, vigorous, free of infirmity,
    and young again.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The renewal occurs within Pulotu afterlife conditions, not as a return
    to ordinary earthly life.
- id: motif:6
  label: returning dead as luminous dangerous visitors
  taxonomy_refs:
  - return
  basis: Spirits can ascend at night as luminous sparks or vapour, revisit former
    homes, and be feared as destructive toward the living.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The taxonomy reference is broad; the passage specifically concerns nocturnal
    spirit visitation rather than a heroic return.
- id: motif:7
  label: hybrid undersea king of the dead
  taxonomy_refs: []
  basis: Saveasiuleo's upper body is human in a house with chiefs, while his lower
    fish-like body extends into the sea, and he is king of the lower regions.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives a descriptive image but does not state a transformation
    or shapeshifting episode.
comparison_claims:
- id: claim:1
  claim: The Pulotu material fits the supplied afterlife_journey_map motif family
    because it gives named gates, route segments, rules of travel, transport by spirits,
    and an under-ocean destination.
  claim_level: same_motif
  target: afterlife_journey_map
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is a motif-family classification only; it does not establish historical
    contact with other afterlife-journey traditions.
- id: claim:2
  claim: 'Vaiola has the same function as a water-of-life rejuvenation pattern: bathing
    in it restores vigor, removes infirmity, and makes the aged young.'
  claim_level: same_function
  target: water-of-life rejuvenation pattern / death_rebirth
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage places this renewal in the afterlife, so it should not
    be equated without qualification with earthly immortality or resurrection narratives.
- id: claim:3
  claim: The tree of Leosia functions like a threshold object in a death-return pattern
    because contact with it sends the soul back to the body before final descent.
  claim_level: same_function
  target: threshold-tree death-return pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not call the tree a world tree or axis; the comparison
    is limited to its threshold and restoration function.
