canonical_text:
  quote: ''
  summary: The passage gives place-name traditions for Safotu, Safune, Aopo, and Falealupo,
    then describes Samoan beliefs about entrances and routes to Pulotu, including
    rock openings, a leaping-stone route, the Watcher tree, the Luaō pit, a current
    carrying souls to Pulotu, Vaiola the water of life, the social life and dangerous
    return-visits of spirits, the silent town Nonoa, and Saveasiuleo as king of the
    lower regions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Safotu and Safune are said to be named after Fotu and Fune, children of Lafai;
    a burial place for slain people from Safune was also called Safune, and Fune bore
    an epithet meaning savage because of a battle habit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Aopo, Tangaloa of the heavens offered the people a choice between whales'
    teeth and a stream of water; they insisted on the first and received stones, while
    the water was given to Saleaula as Vaituutuu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Falealupo is explained as a place named from a house built for a lame son
    who caught small fish called lupo; Salevao and his travelling party admired the
    house and named it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Two circular rock openings near Falealupo were regarded as entrances for departed
    souls to Pulotu beneath the ocean, with chiefs using the larger opening and common
    people the smaller.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A band of spirits was said to convey souls from the house where they died
    westward through the bush, across sea crossings and leaping-stones, to the Fafā
    at Falealupo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Villagers near Falealupo kept coconut-leaf blinds shut after dark to keep
    out spirits believed to pass to and fro.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A coconut tree near the entrance to the lower regions was called the tree
    of Leosia, or the Watcher; if a spirit struck it, the soul returned to its body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Luaō or Luaōō, translated as Hollow pit, was another name for the place where
    spirits descended after bodily death, and the name appeared in curses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the bottom of Luaō a running stream carried spirits to Pulotu; they were
    not to look aside or try to reach either bank, and the current prevented return.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Spirits of different ages, appearances, diseases, and social ranks drifted
    together in a semi-conscious condition before reaching Pulotu.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Vaiola, the water of life in Pulotu, bathing made spirits lively, bright,
    vigorous, free from infirmity, and young again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The lower regions were described as containing heavens, earth, sea, fruits,
    flowers, planting, fishing, cooking, marriage, and other activities resembling
    the living world.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The new bodies of spirits were described as volatile, able to ascend at night,
    become luminous sparks or vapour, revisit former homes, and return before dawn
    to the bush or Pulotu.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Visits by departed spirits were feared as destructive, especially toward people
    who had angered them; injurers tried to reconcile with the dying through presents
    and confession.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Nonoa, a hadean town whose name is glossed as Bound, spirits were dumb
    and expressed affection by beating their breasts.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Saveasiuleo was king of the lower regions; his upper body was human in a house
    with chiefs, while his lower body was fish-like and extended into the sea.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: Saveasiuleo's royal house of assembly was supported by the erect bodies of
    high-ranking chiefs, who had anticipated this role before death.
  category: object
  evidence_refs:
  - ev:10
