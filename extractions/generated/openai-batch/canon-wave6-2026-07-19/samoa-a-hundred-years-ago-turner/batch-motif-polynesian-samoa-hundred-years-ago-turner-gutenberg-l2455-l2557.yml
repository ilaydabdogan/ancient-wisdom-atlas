canonical_text:
  quote: Until a young man was tattooed, he was considered in his minority.
  summary: 'The passage describes Samoan adult-life customs: male tattooing as a marker
    of majority and respect, the tattooers'' craft and deities, a female womanhood
    observance with feast and property distribution, adultery revenge, and avoidance
    of near-kin marriage under divine sanction.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An untattooed young man was treated as being in his minority, unable to think
    of marriage, exposed to ridicule, and lacking the right to speak among men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After tattooing, the young man was said to pass into majority and to claim
    the respect and privileges of mature years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At about sixteen, a youth and his friends sought tattooing, sometimes in association
    with a young chief; groups of six or a dozen young men could be tattooed at one
    time by several tattooers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tattooing was a paid profession, and the custom was traced to Taēmā and Tilafainga,
    who were worshipped by tattooers as presiding deities of the craft.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tattooing instrument was made from human bone, shaped like a toothed comb
    and small adze, dipped into candle-nut ashes and water, and tapped into the skin
    with a mallet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tattooing covered much of the body from waist to knee, with regular untattooed
    stripes, and when oiled could appear at a distance like black silk knee-breeches.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The tattooing process was painful and extended over two or three months, with
    periods of rest and healing; friends attended with food and brought fine mats
    and native cloth as payment for tattooers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the time of entering womanhood, parents and relatives collected fine mats
    and cloth, prepared a feast, invited unmarried women, distributed the property
    after the feast, and excluded males from the gathering.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Adultery could be punished by private revenge, and the brother or another
    near relation of the culprit could be killed in place of the culprit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Marriage contracts were not made before maturity, and considerable care was
    taken to avoid unions between near relatives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says that old custom and the gods frowned on closely traceable
    consanguineous unions; if children of such a union died early, the death was attributed
    to the anger of the household god.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
