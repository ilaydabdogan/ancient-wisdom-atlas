  quote: ''
  summary: The passage lists Samoan names and explanations for February and March.
    February is associated with renewed digging of the yam crop, digging up winds
    to raise storms, and worship of small household gods. March is associated with
    withering vegetation, a god named Taafanua whose name means roaming or walking
    about the land, and worship of household gods asked to bless the family with strength
    in quarrels and battle.
