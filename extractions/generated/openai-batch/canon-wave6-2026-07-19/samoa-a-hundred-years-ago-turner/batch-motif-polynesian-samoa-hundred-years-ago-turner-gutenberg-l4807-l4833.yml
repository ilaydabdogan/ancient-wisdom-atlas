canonical_text:
  quote: The thunder taboo.
  summary: 'The passage describes a Samoan thunder taboo used to deter theft from
    land: a man could hang a small plaited coconut-leaf mat with white cloth streamers
    from a tree, and thieves feared that trespass might bring lightning or thunder
    harm to themselves, their children, or their trees. The narrator then generalizes
    this as part of a widespread taboo system that preserved honesty and order, while
    also judging it as superstition.'
