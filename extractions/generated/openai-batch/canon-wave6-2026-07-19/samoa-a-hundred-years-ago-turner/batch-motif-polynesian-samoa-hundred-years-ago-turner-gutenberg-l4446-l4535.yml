canonical_text:
  quote: ''
  summary: The passage describes Samoan government and village order. It states that
    order was maintained through civil power and superstitious fear, then outlines
    village organization around titled heads of families and higher-ranking chiefs.
    Chiefly status is connected with genealogy, collective title decisions, formal
    address, precedence in ava and food, protective obligations, and reciprocal exchanges
    of marriage resources and fine mats.
  language: English
