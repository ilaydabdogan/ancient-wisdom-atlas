  summary: 'The passage gives several Samoan proverbial stories and sayings: a fowl
    loses a spring to an early-arriving turtle; a rat repays an octopus''s rescue
    by gnawing it and is killed by owls; Toa and Pale, brothers fleeing a cannibal
    king, become trees, and Pale repeatedly raises Toa after carpenters cut him down;
    a closing list gives brief proverbs using images such as footprints, a single
