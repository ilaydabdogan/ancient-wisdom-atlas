canonical_text:
  quote: ''
  summary: The passage describes Samoan accounts of epidemic diseases, medical and
    surgical treatments, ritual healing practices, consultation of a village high
    priest to identify divine causes of illness, offerings or confession ceremonies
    to remove those causes, and social care for the dangerously sick.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual actor rises, flourishes a spear over the patient's head, leaves the
    house, and no one speaks or smiles during the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Samoans traced the first known influenza attack to foreigners
    and the new religion after missionaries and Tahitian teachers reached Samoa in
    1830.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Influenza is described as recurring almost annually, associated with unsettled
    weather and winds, moving from east to west, and sometimes fatal to old or weakened
    people.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage also mentions a remembered epidemic resembling cholera, whooping-cough
    in 1849, mumps in 1851 traced to a California vessel, and missionary vaccination
    against small-pox.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Internal remedies included emetics after poisonous fish, bush juices, water
    taken until rejected, and other emetic mixtures; later remedies were expanded
    through contact with other islanders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each disease had a particular physician; native doctors commonly used shampooing
    and scented oil, with charms of flowers wrapped in native cloth placed in the
    thatch over the patient.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: European medicines became sought after, and missionaries kept dispensaries
    and gave daily medical advice and medicine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In difficult illness, Samoans are said to have supposed disease was caused
    by the wrath of a particular deity and sought the village high priest to identify
    the cause.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: If the high priest said a canoe or land should be given to the god, the property
    was given or transferred.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: If no particular property was requested, the high priest might order the family
    to assemble, confess, and throw out.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the confession ceremony, family members confessed crimes and angry judgments,
    then took water in the mouth and spat it toward the sick person as proof of revoking
    imprecations.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Surgical practices included lancing ulcers with shell or shark tooth, bleeding,
    washing cuts in the sea, binding with a leaf, blowing smoke into scalp wounds,
    and pushing barbed spears through limbs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sick were given desired foods when possible, distant friends were summoned
    for farewell, and visitors brought mats or valuables to assist with doctors, conjurors,
    and hospitality costs.
  category: action
  evidence_refs:
  - ev:11
