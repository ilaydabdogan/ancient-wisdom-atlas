canonical_text:
  quote: ''
  summary: The passage describes Samoan districts in war, then focuses on oaths, imprecations,
    and tapui or taboo signs used to discover wrongdoing, settle disputes, deter theft
    from plantations, and threaten divine, bodily, animal, or property-destroying
    punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Samoan group is described as having ten separate districts, with war alignments
    varying among them and conquered districts later attempting to reverse their status.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs and heads of families could investigate theft or concealed matters
    by requiring suspected parties to swear innocence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A suspected party laid grass on a stone or other object representing the village
    god and spoke an oath that he would die quickly if he had stolen the item.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grass in the oath was said to add a silent imprecation that the oath-taker’s
    family might die and grass might grow over their habitation.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: If an unresolved matter remained after oaths, chiefs could commit the case
    to the village god and invoke the god to destroy the guilty person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person who found stolen crops might shout a curse asking fire to blast or
    burn the thief’s eyes and the eyes of the thief’s god.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In disputes over truthfulness, one party could ask the other to touch his
    eyes, name his god, or dig a hole in the ground as curse-like truth tests.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage identifies a broader class of feared theft-deterring signs as
    silent hieroglyphic taboo, or tapui.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sea-pike taboo used plaited coconut leaflets shaped like a sea-pike and
    suspended from protected trees.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The white shark taboo used a plaited coconut leaf shaped like a shark with
    fins, suspended from a tree.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The cross-stick taboo used a horizontal stick suspended from a tree and expressed
    a wish for a disease across the thief’s body until death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The ulcer taboo used buried clam-shell pieces and reeds tied together like
    a man’s head to express a wish that the thief suffer ulcerous sores.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: After transgressing the ulcer taboo and later developing swellings or sores,
    a thief was said to confess, send a present, and receive a medicinal herb and
    pledge of forgiveness from the landowner.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The tic-doloureux taboo used a spear fixed in the ground near protected trees
    and expressed a wish for face and head agonies.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: The death taboo used oil poured into a small calabash, buried near a tree,
    with the place marked by a small hillock of white sand.
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: The rat taboo used a small coconut-leaf basket containing cooking-house ashes
    and small stones, suspended from a tree.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: The rat taboo signified a wish that rats would damage the thief’s fine mats,
    cloth, or other valued property.
  category: action
  evidence_refs:
  - ev:12
