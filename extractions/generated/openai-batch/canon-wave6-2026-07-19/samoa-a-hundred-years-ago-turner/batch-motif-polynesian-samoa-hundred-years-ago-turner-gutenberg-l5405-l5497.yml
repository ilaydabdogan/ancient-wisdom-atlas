canonical_text:
  quote: ''
  summary: 'The passage gives several Samoan explanatory stories: battles between
    named trees, fish, birds, an owl and serpent witnessed by ten numeral-named brothers,
    the bat taking the rat’s wings, and the plantain defeating other bananas. Several
    episodes explain present natural forms, social sayings, or number order, while
    the narrator also comments that some animal and plant battles may encode figurative
    names for human groups.'
  language: English
  quote_policy: summarized
