canonical_text:
  quote: ''
  summary: 'The passage describes several Samoan gods or named sacred figures: Turia,
    associated with war aid, weather-changing, feast food, and a taboo stone shrine;
    Tuifiti, a village god incarnate in an unseen man and associated with sacred Ifilele
    trees; Tuna and Fata, mountain dwellers who carry a great eel on a litter; and
    several Vave traditions in which the god is incarnate in birds, gives war omens,
    receives ritual attention, and is connected with a refuge tree and battle stories.'
  language: English
  quote_policy: summarized
