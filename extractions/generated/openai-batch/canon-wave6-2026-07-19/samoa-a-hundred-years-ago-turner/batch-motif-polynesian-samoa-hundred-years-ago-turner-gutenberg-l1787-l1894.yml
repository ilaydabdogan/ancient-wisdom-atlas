    cut it and that the cutters became ill and died.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tuna and Fata lived on two mountains at the west end of Upolu with a stream
    between them and met near the habitat of a great eel.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tuna and Fata amused themselves by taking the great eel out of the water and
