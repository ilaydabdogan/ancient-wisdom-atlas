- id: obs:1
  text: Turia is described as a god in Savaii whose help enabled a district to fight
    and conquer against fearful odds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turia was credited with changing drought into rainy weather and rainy weather
    into sunshine.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Turia was believed to add an extra pig to food prepared for strangers, while
    the passage also says some priests secretly carried out the addition.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On another island, Turia's shrine was a smooth stone in a sacred grove; the
    priest weeded around it, covered it with branches, renewed the branch covering
    during prayers, and no one dared touch the stone because of a feared deadly influence.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tuifiti is described as a Savaii village god supposed to be incarnate in a
    man who walked about but was not visible to local people, though strangers could
    see him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tuifiti's presence at a guest entertainment was identified by surplus pigs
