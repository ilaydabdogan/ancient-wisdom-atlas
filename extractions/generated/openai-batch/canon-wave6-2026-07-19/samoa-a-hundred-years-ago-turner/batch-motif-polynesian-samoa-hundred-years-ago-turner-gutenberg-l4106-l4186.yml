  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: House-building was a distinct trade led by a master carpenter, with journeymen
    and apprentices accompanying him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A person wanting a house built presented a fine mat to the carpenter; acceptance
