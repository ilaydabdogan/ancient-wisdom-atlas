canonical_text:
  quote: ''
  summary: 'The passage describes Samoan amusements and decision practices: chiefs
    snaring pigeons with tame decoy pigeons, spinning a coconut as both game and lot-casting
    method, hide-and-seek, shell pitching, basket guessing, riddles, rhyming contests,
    and repetition games with forfeits.'
  language: English
