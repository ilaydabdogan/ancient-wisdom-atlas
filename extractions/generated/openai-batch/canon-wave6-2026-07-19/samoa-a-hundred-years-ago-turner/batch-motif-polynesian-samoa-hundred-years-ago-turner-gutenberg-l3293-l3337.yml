canonical_text:
  quote: ''
  summary: The passage describes Samoan clothing, ornaments, hairstyles, grooming
    tools, tattooing, and a story in which the Fijian chief Fulualela, Feathers-of-the-Sun,
    visits Samoa with his daughter, observes the absence of mats, and later brings
    mats, native cloth, scented oil, pandanus, and paper mulberry plants as a gift
    associated with the origin of Samoan mats and cloth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Both sexes are described as keeping the upper body uncovered and wearing shells,
    beads, or other trinkets around the neck; children were dressed similarly.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women wore short hair, sometimes stiffened with scented oil and bread-fruit
    gum; young women could wear a small twisted lock with a curl from the left temple.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men wore long hair tied in a knot on the crown, but untied it in company and
    at religious services as a mark of respect; some young men wore short hair with
    temple locks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hair could be dyed light brown with lime made by burning coral; the passage
    also says lime was used to rub and blind trespassing pigs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The beard was shaved with shark teeth; men wore white-shell armlets, some
    wore flowers through pierced ears, and women wore coconut-leaflet combs behind
    the ear.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A tub of water could be used as a looking-glass, though people more often
    relied on others' eyes and taste for arranging head-dress.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tattooing is described as one of the principal ornaments.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fulualela, a Fijian chief also called Feathers-of-the-Sun, came to Samoa with
    his daughter after hearing of the beauty of the islands and inhabitants, hoping
    to find a husband chief for her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fulualela found the islands lovely and people attractive but saw no mats in
    the houses; people slept on dried grass, and he decided not to leave his daughter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fulualela returned to Fiji, prepared a present of fine mats, native cloth,
    and scented oil as if it were his daughter's dowry, and brought the gift back
    to Samoa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Fulualela also brought pandanus and paper mulberry plants to provide materials
    for mats and native cloth; the passage says Samoa has had these luxuries ever
    since his gift.
  category: sequence
  evidence_refs:
  - ev:9
