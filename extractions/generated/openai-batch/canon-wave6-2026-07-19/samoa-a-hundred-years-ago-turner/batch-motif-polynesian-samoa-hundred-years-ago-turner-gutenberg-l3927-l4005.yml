  quote: '"Oh, how cold! oh, how cold!"'
  summary: The passage describes Samoan practices and beliefs concerning embalming,
    funeral fires, anxiety over unburied dead, recovery of a departed spirit in a
    tangible transmigrated form, ceremonial burial of that form, and prayers at graves
    for health or harm.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Embalming was reported as known in one particular chiefly family and was performed
    exclusively by women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The embalming process included removing and burying the viscera, repeated
    anointing with oil and aromatic juices, puncturing the body, desiccation, replacing
    hair with resin, filling the abdomen with native cloth, wrapping the body, and
    displaying it in a dedicated house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four embalmed bodies, a chief, his wife, and two sons, were laid on a platform
    raised on a double canoe and remained preserved for more than thirty years.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated reason for embalming was affection, described as keeping the bodies
    of the departed still with the living as if alive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: For important chiefs, friends kindled fires near the grave after burial, kept
    them burning until morning, and sometimes continued the practice for ten days;
    fires were also kept before burial near the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Common people kept a fire blazing in the house after burial and cleared the
    space to the grave so that light extended from the house fire to the grave through
    the night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Samoan account given for the funeral fires was that they were lights burning
    in honor of the departed and marks of tender regard.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Unburied persons who had drowned or fallen in war were believed to have spirits
    wandering neglected and comfortless, haunting the living and calling that they
    were cold.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A ritual to obtain the soul used a sheet of native cloth spread at a beach
    near a drowning place or at a battlefield; a family god was addressed, and the
    first thing to land on the sheet was treated as the spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If nothing came to the sheet, it was taken as a sign that the spirit had ill-will
    toward the praying person; another person could then address another god and wait.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A grasshopper, butterfly, ant, or other thing that came to the sheet was wrapped,
    taken to the family, and ceremonially buried as if it contained the real spirit
    of the departed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Prayers at the graves of a parent, brother, or chief were common and could
    be made for health in sickness or, in examples given, for death or pain.
  category: action
  evidence_refs:
  - ev:6
