canonical_text:
  quote: ''
  summary: 'The passage describes Samoan warfare as presented by Turner: admired fighters
    are swift and skilled, prestige is gained by taking enemy heads and presenting
    them before chiefs, heads are heaped in the public assembly place, bodies are
    buried or abandoned depending on identification, gods and priests may be involved
    in battle preparations, war parties are divided by terrain and sea, canoe fleets
    conduct secret dawn raids, and one mother protects her son from attackers by covering
    him with her body.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heroes are described as swift fighters who can advance toward a crowd, throw
    a spear accurately, and use a club to deflect incoming spears.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Warriors seek distinction by the number of severed heads they can lay before
    the chiefs.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A warrior carrying a head goes through villages dancing, shouting his own
    name and the victim's identity, and then places the head before the assembled
    chiefs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chiefs publicly thank the warrior for bravery, after which he may leave
    to seek another victim.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Severed heads are piled in the malae or public assembly place; the head of
    the most important chief is placed on top, and the heads are later claimed by
    relatives or buried.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A stunned young man recovers while two people dispute who has the right to
    cut off his head; he escapes with his head intact.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After battle, identified headless bodies are buried, unidentified bodies are
    left to dogs, and in some cases whole bodies are dragged before chiefs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Warfare practices include consulting gods, taking a priest to pray for one's
    people and curse the enemy, filling wells, destroying fruit trees, wearing valuable
    clothing and trinkets, and haranguing before battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In general wars, fighters are divided into highway, bush, and sea-fighters;
    a canoe fleet may plan a secret night movement and attack a village at dawn.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In successful dawn attacks, raiders enter houses before people are fully awake,
    cut off heads, and escape by canoe; one example reports thirteen heads carried
    off.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: During one attack, an old man at morning devotions is beheaded.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A woman bends over her son to save him, is severely wounded, and survives;
    the attackers wanted the boy's head and did not immediately kill the woman because
    killing a woman is described as cowardly.
  category: action
  evidence_refs:
  - ev:9
