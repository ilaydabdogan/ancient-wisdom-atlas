  claim: The passage explicitly compares the recurrent Samoan long-tooth god after
    deaths or disease with the Buddha tooth at Ceylon, emphasizing a tooth relic or
    tooth-being that persists despite attempts to destroy or bury it.
  claim_level: visual_similarity
  target: Buddha tooth at Ceylon, as described by the narrator
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the narrator's analogy inside the passage; it does not establish
    historical contact, common inheritance, or identical ritual function.
