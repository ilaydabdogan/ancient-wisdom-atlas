canonical_text:
  quote: ''
  summary: The passage describes a disease-making long-tooth god associated with Savaii;
    the war god Pava, Tangaloa, taro-leaf and rainbow omens; the twin gods Pili ma
    le Maa, with lizard omens and battle rites; and sacred stones connected with food,
    fish, and rain-making rituals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disease-making god is said to have come from Fiji and settled on the south
    side of Savaii; people, canoes, or property from that place were thought to convey
    a long tooth causing disease and death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old lady saw the tooth, threw scalding greens at it, and thereafter it
    was described as crooked and less deadly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Recovery or death was explained by whether the crook of the tooth ran outside
    or otherwise in relation to the wound.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After deaths following contact with the long-tooth district, and after a sudden
    death near the burial of a man from that district, some people suspected the tooth
    and threw the man's bones into the sea beyond the reef.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says the long-tooth god continues to be mentioned after sudden
    death or prolonged deadly disease, and explicitly compares it with the tooth of
    Buddha at Ceylon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pava is described as a war god on the south side of Upolu and originally as
    a man from the east end of the group.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pava and his wife went to work in the bush and left their children in the
    house; the children made a fire, and Tangaloa came down from the heavens after
    seeing the smoke.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pava prepared a bowl of ava for Tangaloa; a little child upset it, Tangaloa
    killed the child, and then made the child live again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pava left in anger by stepping onto a taro leaf and going to Fiji; later he
    returned with a son of the king of Fiji and after death had a place in the Samoan
    pantheon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pava's emblem was a taro leaf, his battle adherents wore taro-leaf caps, and
    the slain of his village were recognized by round leaf caps.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pava was seen in the rainbow; a clear reflection down on the village was a
    good omen, while a rainbow far inland was a bad sign and stopped fighting for
    the day.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another story says Pava fled from place to place and island to island to escape
    Tangaloa's presence, but Tangaloa's eye kept looking down on him until he reached
    a district where it was no longer visible.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pili ma le Maa, meaning the lizard and the stone, are described as twin gods
    worshipped in certain villages during war, famine, and pestilence, with May as
    a fixed time for prayers and food offerings.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The lizard was the guiding incarnation; a lizard crossing the road before
    battle caused return, while one running ahead encouraged advance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Chiefs also watched lizard movement on a plaited coconut-leaf covering of
    the house's middle post; a straight descent was good, while zigzag movement was
    bad and suspended fighting.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Before fighting, participants were sprinkled with coconut juice by the priest
    while each prayed that the road taken would flow with blood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Two unchiselled smooth stones of the stream were kept in a temple, guarded
    carefully, and understood to represent good, non-malicious death-causing gods.
  category: object
  evidence_refs:
  - ev:11
- id: obs:18
  text: One of the smooth-stone gods made yams, breadfruit, and coconuts; the other
    sent fish to the nets.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: Another housed stone represented a rain-making god; during too much rain it
    was heated by the fire, and during drought it was dipped in the stream with procession
    and prayer for rain.
  category: sequence
  evidence_refs:
  - ev:12
