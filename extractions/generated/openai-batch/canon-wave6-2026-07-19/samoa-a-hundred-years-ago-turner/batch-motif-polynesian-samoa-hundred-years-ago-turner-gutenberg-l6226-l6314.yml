canonical_text:
  quote: ''
  summary: The passage gives several etiological accounts for village and place names
    in Aana, including an ancestor who swam from Fiji on a walking-stick and divided
    it between two sons, names derived from a god, a Tongan canoe taboo, combat heroes,
    and children born near a tree and mountain. It then narrates a party of Atua and
    Aana men visiting the heavens, surviving repeated Tangaloan attempts to kill them
    through poison, rain, a cataract, an ambush at a meal, and club fighting. The
    visitors return with a fine mat cloth whose name becomes a chiefly title, and
    the place of their descent and dispersal is called Taape, “Dispersion.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tapuaau, also called Tooaau, is said to have swum from Fiji on a walking-stick
    and landed at Leulumoenga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tapuaau married at Leulumoenga and had two sons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tapuaau divided the walking-stick into two pieces and gave one piece to each
    son; the sons founded or named Fasitootai and Fasitoouta from the stick pieces
    and their directions seaward and inland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Faleasi'u is explained as “House of the god Siu,” who was worshipped there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Samatau is explained from a Tongan king’s canoe that became sacred to visitors
    on the right side because of an ill lady on board.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Poila, a hero of Aana, killed Pepe of Tuamasanga in single combat, and Pepe’s
    death signaled retreat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Falelatai and Faleaseela are traced to children of a couple from Fiji; Latai
    was named from being born under the sea-side part of a large tree, and the two
    children settled on opposite sides of a mountain.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Taape is identified as a rising ground where a party dispersed after a visit
    to the heavens; the party consisted of five Atua men and four Aana men.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the skies, the people of the god Tangaloa plotted to kill the visitors
    by serving poisoned 'ava, but no one was seriously affected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Tangaloans proposed sitting in the rain to test endurance; Mosofaofulu
    covered the visitors with feathers, so the rain did not affect them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Tangaloans proposed floating down a stream toward an unseen cataract;
    Fulufuluitolo stood near the fall and pulled the visitors out of danger one by
    one.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When a selected group of Tangaloans floated down the stream, Fulufuluitolo
    did not help them, and they went over the fall and were killed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Tangaloans planned to attack during a meal, but the visitors ate the food,
    baskets, and carrying sticks, leaving the Tangaloans amazed and unable to strike.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In a club fight, Tuimulifanua struck livers from Tangaloaatevalu until Tangaloaatevalu
