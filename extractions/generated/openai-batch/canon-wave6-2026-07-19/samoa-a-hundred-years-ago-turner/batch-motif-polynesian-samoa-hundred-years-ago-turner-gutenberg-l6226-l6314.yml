candidate_motifs:
- id: motif:1
  label: etiological place naming through ancestral object division
  taxonomy_refs: []
  basis: Fasitootai and Fasitoouta are explained by Tapuaau dividing his walking-stick
    into two pieces and giving one to each son, whose settlements take names from
    the pieces and directions.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The available taxonomy list has no exact place-name etiology category;
    no broader taxonomy assignment is made.
- id: motif:2
  label: miraculous sea migration on a small object
  taxonomy_refs: []
  basis: Tapuaau is said to have swum from Fiji to Samoa on a walking-stick before
    settling and founding a lineage connected with village names.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explain the mechanics of the journey beyond the reported
    swimming on a stick.
- id: motif:3
  label: ascent or visit to the heavens followed by return
  taxonomy_refs:
  - ascent
  - return
  basis: A party is said to have visited the heavens or skies and later returned,
    coming down at Lefanga before dispersing.
  evidence_refs:
  - ev:5
  - ev:12
  confidence: high
  cautions: The passage gives little detail about how the party reached the heavens.
- id: motif:4
  label: hostile hosts impose successive deadly trials
  taxonomy_refs: []
  basis: The Tangaloans try to kill the visitors through poisoned 'ava, rain exposure,
    a cataract game, a meal ambush, and club exercise.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames the episodes as games or entertainment with hidden
    lethal intent; no initiation category is explicitly stated.
- id: motif:5
  label: helpers protect a traveling party from environmental ordeals
  taxonomy_refs: []
  basis: Mosofaofulu shields the party from rain with feathers, and Fulufuluitolo
    rescues the party from the stream before the cataract.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The helpers are members of the party rather than external supernatural
    helpers.
- id: motif:6
  label: deadly trial reversed upon the plotters
  taxonomy_refs: []
  basis: After the visitors survive the cataract game through Fulufuluitolo’s rescue,
    selected Tangaloans undergo the same float without help and are killed over the
    fall.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only the cataract episode clearly shows reversal onto the plotters.
- id: motif:7
  label: chiefly title or regalia acquired through victory and ransom
  taxonomy_refs:
  - royal_legitimacy
  basis: Tangaloaatevalu gives the fine mat cloth Lavasii after defeat; it is brought
    to earth and its name becomes a title of chief ruler retained in a particular
    family.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage reports the title’s continuity but does not elaborate a full
    legitimating ritual.
- id: motif:8
  label: birth circumstance used to name a person and place
  taxonomy_refs: []
  basis: Latai’s name is tied to birth under a specific part of a large tree, and
