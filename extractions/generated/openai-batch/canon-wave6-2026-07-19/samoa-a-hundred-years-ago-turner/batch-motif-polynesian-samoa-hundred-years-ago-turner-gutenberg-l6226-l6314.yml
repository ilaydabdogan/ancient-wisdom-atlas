    as “Sacred-on-the-right-side” from a Tongan king’s canoe made sacred on one side
    because of an ill lady on board.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:3
  type: summary
  locator: lines 6245-6249
  quote_or_summary: Poila, a hero leading the Aana troops, kills Pepe, a Tuamasanga
    hero, in single combat; Pepe’s death becomes the signal for retreat.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:4
  type: summary
  locator: lines 6249-6257
  quote_or_summary: 'Falelatai and Faleaseela are traced to children of a Fijian couple:
    Latai is named from being born under the sea-side branch of a large tree, while
    Seela is named from another birth incident; they settle on opposite sides of a
    mountain.'
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:5
  type: summary
  locator: lines 6253-6258
  quote_or_summary: At Lefanga a rising ground called Taape, “Dispersion,” is said
    to be where a party broke up after a visit to the heavens; the party included
    five Atua men and four Aana men.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:6
  type: summary
  locator: lines 6259-6264
  quote_or_summary: In the skies, the people of the god Tangaloa plot to kill the
    visitors by serving a bowl of poisoned 'ava, but no one is seriously affected.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:7
  type: summary
  locator: lines 6264-6269
  quote_or_summary: The Tangaloans propose sitting in the rain to test endurance;
    Mosofaofulu covers the visitors with feathers so the rain has no effect.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:8
  type: summary
  locator: lines 6271-6280
  quote_or_summary: The Tangaloans propose floating down a stream that runs over a
    hidden cataract. Fulufuluitolo rescues the visitors one by one, giving rise to
    the proverb “Saved by Fulufuluitolo”; selected Tangaloans then float, receive
    no help, and are killed over the fall.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:9
  type: summary
  locator: lines 6282-6289
  quote_or_summary: The Tangaloans bring food while planning to attack the visitors
    during the meal, but the visitors eat not only the food but also the baskets and
    sticks, leaving the Tangaloans amazed and unable to attack.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:10
  type: summary
  locator: lines 6291-6303
  quote_or_summary: The Tangaloans propose club exercise; Tangaloaatevalu fights Tuimulifanua,
    loses seven livers to well-aimed blows, yields, and asks to give something for
    his life.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:11
  type: summary
  locator: lines 6303-6310
  quote_or_summary: Tangaloaatevalu brings a fine mat cloth; Tuimulifanua tries it
    on, gives it to Tuimuaiava, and Tuimuaiava brings it to earth. Its name, Lavasii,
    becomes a title of chief ruler retained in a family, with a later historical note
    about the title.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source metadata; full text use allowed.
- id: ev:12
  type: summary
  locator: lines 6312-6314
  quote_or_summary: When the party returns from the heavens, they come down on the
    rising ground at Lefanga, disperse there, and the place is thereafter called Taape,
    “Dispersion.”
