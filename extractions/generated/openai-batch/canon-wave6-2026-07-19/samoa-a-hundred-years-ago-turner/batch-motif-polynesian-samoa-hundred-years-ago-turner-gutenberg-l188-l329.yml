canonical_text:
  quote: There was first of all Leai, _nothing_.
  summary: 'The passage frames Samoa geographically and historically, then gives Samoan
    traditionary material on cosmogony and man: one sequence begins with nothing and
    proceeds through fragrance, dust, earth, rocks, stones, and mountains; another
    is a cosmical genealogy of married natural and heavenly pairs culminating in Tangaloa,
    Pili, Sina, and later descendants.'
  language: English
  quote_policy: quoted
