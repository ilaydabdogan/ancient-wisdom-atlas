  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: quote
  locator: lines 900-912
  quote_or_summary: 'Before battle a priest prays: “O Fe''e! ... give us your red
    flaming rage with which to fight this battle.”'
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; short quotation.
- id: ev:5
  type: summary
  locator: lines 914-916
  quote_or_summary: If the priest stuttered in even one word of the battle prayer,
    this was considered a bad omen.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 918-924
  quote_or_summary: Fe'e was thought present in white Cypræa ovula shells; shell strings
    in the priest's house were believed to murmur or cry when war was decided, and
    clear white or dark dingy color gave good or bad omens.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 926-928
  quote_or_summary: 'Cuttle-fish movements at sea were observed during war: near the
    shore during mustering was good, far off was bad.'
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 930-936
  quote_or_summary: In one place Fe'e was a general village god; May was sacred, road
    and lagoon passage were restricted, and there were feasts, games, club exercise,
    spear-throwing, and wrestling.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 938-945
  quote_or_summary: A new temple was built with contributions from every person; some
    built while the rest fought in earnest to settle old grudges, and the person with
    the most wounds was marked for special favors from the god.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 945-949
  quote_or_summary: Temple completion ended the fighting for the year, and quarrels
    rising to blows at other times were said to be frowned upon by Fe'e.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 951-954
  quote_or_summary: In another district, three months were sacred to Fe'e; anyone
    passing along the road or lagoon could be beaten or killed for insulting the god.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 954-961
  quote_or_summary: During the first month, torches and lights were forbidden because
    the god was about and did not wish to be seen; white turbans were confined to
    war, and projecting burdens were forbidden as mockery of the god's tentacles.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 963-969
  quote_or_summary: The priest had a large wooden bowl called lipi, or sudden death,
    as another representative of Fe'e; injured parties brought gifts to have the priest
    curse thieves and make them ill.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 969-978
  quote_or_summary: The priest and selected family members prayed around the bowl
    for vengeance; ill thieves were brought with restitution and gifts so the priest
    might pray over the death-bowl and reverse the sentence.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 980-986
  quote_or_summary: A story says an Upolu hero chased Savaii cuttle-fish gods, caught
    them in a net, killed them, and they became stones in the north Upolu lagoon,
    a place Savaii travelers long avoided passing through.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 988-994
  quote_or_summary: Another fragment says a Savaii Fe'e married a chief's daughter
    on Upolu, made a hole in the reef associated with Apia harbour, went upriver,
    and built an inland stone house still called the house of the Fe'e.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 994-997
  quote_or_summary: In war-time this Fe'e sent a branch drifting downriver as a good
    omen and sign that the people could continue the war and drive the enemy.
  source_text_path: texts/public-domain/samoan/project-gutenberg/samoa-a-hundred-years-ago-turner.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 999-1007
  quote_or_summary: In household worship, if a visitor cooked a cuttle-fish or a family
    member was where cuttle-fish was eaten, a man or woman was selected to lie in
