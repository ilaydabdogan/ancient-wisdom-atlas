canonical_text:
  quote: ''
  summary: 'The passage describes worship of a Samoan deity called O le Fe''e, identified
    with the cuttle-fish or octopus, in several local contexts: as a war-god with
    white cloth, shell, and sea-movement omens; as a village god with sacred months,
    temple-building, ritual fighting, restrictions, and a death-bowl used for cursing
    thieves; as a figure in stories explaining stones, a reef opening, a harbour,
    and a stone house; and as a household god whose wrath was averted by a mock burnt-offering
    after cuttle-fish taboo violations. A preceding short note mentions an unnamed
    war-god whose worshippers prayed for courage before fighting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A preceding note says the people of a district worshipping an unnamed war-god
    met before fighting and prayed to be strong-hearted and free from cowardice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: O le Fe'e is glossed as the cuttle-fish or octopus and is described first
    as a war-god brought by a chief named Tapuaau, who swam from Fiji with his cuttle-fish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the cuttle-fish was taken into a house, it showed fondness for white
    native cloth, which became an emblem of the god; worshippers wore white turbans
    in battle as pleasing to the god and protective against enemies.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before battle, the people assembled in the public place and a priest prayed
    to Fe'e for red flaming rage with which to fight; stuttering in the prayer was
    treated as a bad omen.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: Fe'e was believed present in a white Cypræa ovula shell; strings of these
    shells in the priest's house were believed to murmur or cry when war was decided,
    and their clear or dingy color served as an omen.
  category: object
  evidence_refs:
  - ev:6
- id: obs:6
  text: Movements of the cuttle-fish at sea during war-times were watched; nearness
    to shore during mustering was a good sign, and distance was the reverse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: In one place Fe'e was a general village god, not only a war deity; May was
    sacred to his worship, with travel and lagoon restrictions, feasting, games, and
    martial exercises.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: During the May observance, a new temple was built with contributions from
    every man, woman, and child; some built the house while others fought seriously
    to settle old grudges, and the most wounded person was expected to receive special
    divine favors.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: When the temple was complete, fighting ended for the year; ordinary fights
    at other times were said to be frowned upon by Fe'e.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:10
  text: In another district, three months were sacred to Fe'e; anyone passing by road
    or lagoon could be beaten or killed for insulting the god.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:11
  text: During the first sacred month, torches and lights were forbidden because the
    god was abroad and did not wish to be seen; white turbans were also forbidden
    outside war, and projecting burdens were forbidden as possible mockery of the
    god's tentacles.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: A priest possessed a large wooden bowl called lipi, or sudden death, as another
    representative of Fe'e; gifts could be brought to the priest to curse a thief
    and make him ill.
  category: object
  evidence_refs:
  - ev:13
- id: obs:13
  text: The priest and selected family members prayed around the death-bowl for speedy
    vengeance; thieves who became ill were brought to the priest with replacement
    goods and further presents so that the sentence might be reversed.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: One story says cuttle-fish gods of Savaii were chased by an Upolu hero, caught
    in a great net, killed, and changed into stones standing in a rocky lagoon on
    northern Upolu.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:15
  text: Another fragment says a Savaii Fe'e married the daughter of a chief on Upolu,
    made a hole in the reef for travel, thereby accounting for the harbour at Apia,
    and built a stone house inland.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:16
  text: In war-time the Savaii Fe'e sent a branch drifting down the river as a good
    omen and sign that the people might proceed with war and drive the enemy.
  category: action
  evidence_refs:
  - ev:17
- id: obs:17
  text: In some cases Fe'e was a household god; if a visitor caught and cooked a cuttle-fish,
    or a family member had been where cuttle-fish was eaten, the family selected a
    man or woman to lie in a cold oven covered with leaves as a mock burnt-offering.
  category: action
  evidence_refs:
  - ev:18
- id: obs:18
  text: During the mock offering, the family prayed to the bald-headed Fe'e for forgiveness,
    saying the act was the work of a stranger.
  category: speech
  evidence_refs:
  - ev:19
- id: obs:19
  text: If respect and humility were not shown, Fe'e was believed able to cause a
    cuttle-fish to grow internally and kill a family member.
  category: action
  evidence_refs:
  - ev:20
