candidate_motifs:
- id: motif:1
  label: pre-battle divine empowerment and courage prayer
  taxonomy_refs: []
  basis: The passage describes prayers to war-gods before battle for courage or for
    Fe'e's red flaming rage to fight.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage gives local ritual descriptions rather than a narrative myth
    cycle.
- id: motif:2
  label: animal-form deity embodied in emblems and omens
  taxonomy_refs: []
  basis: Fe'e is identified with the cuttle-fish or octopus and represented or indicated
    through white cloth, shells, shell color, shell sounds, and cuttle-fish movements
    at sea.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The text does not explicitly state whether Fe'e is always identical with
    every physical cuttle-fish, only that the god is associated with or present in
    these forms.
- id: motif:3
  label: ritual color emblem for divine protection in war
  taxonomy_refs: []
  basis: White cloth becomes Fe'e's emblem, and worshippers wear white turbans in
    battle believing they please the god and defend against the enemy.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The protective function is reported as the worshippers' belief.
- id: motif:4
  label: bad omen from flawed ritual speech
  taxonomy_refs: []
  basis: The priest's stutter in any word of the battle prayer was considered a bad
    omen.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Only one example of speech defect as omen is given.
- id: motif:5
  label: sacred season with travel taboo, temple renewal, and regulated fighting
  taxonomy_refs:
  - seasonal_cycle
  basis: May, and elsewhere three months, are sacred to Fe'e; the observance includes
    restrictions on roads and lagoon, feasting, exercises, new temple construction,
    and a limited period of fighting.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage gives two district variants with different durations and rules.
- id: motif:6
  label: divine favor through ritual wounds
  taxonomy_refs:
  - sacrifice
  basis: During the temple-building fighting, the person with the most wounds was
    set down for special favors from Fe'e.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text does not call the wounding a sacrifice; the sacrifice taxonomy
    is only a cautious fit because wounds are ritually valued.
- id: motif:7
  label: sacred visibility taboo and forbidden light
  taxonomy_refs:
  - fire
  basis: During the first sacred month, torches and all other lights were forbidden
    because the god was about and did not wish to be seen.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The taxonomy reference points to literal light/fire restriction, not a
    broader fire myth.
- id: motif:8
  label: curse object as divine representative with reversible punishment
  taxonomy_refs: []
  basis: The death-bowl represents Fe'e in cursing thieves; illness following the
    curse can be addressed through restitution, gifts, and a second prayer over the
    bowl.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage reports social and ritual practice rather than a fully narrated
    myth.
- id: motif:9
  label: defeated gods transformed into stones
  taxonomy_refs: []
  basis: The cuttle-fish gods of Savaii are caught, killed, and changed into stones
    standing in the lagoon.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: No available taxonomy reference directly names petrification or etiological
    stone transformation.
- id: motif:10
  label: divine-human marriage linked to landscape origin
  taxonomy_refs:
  - sacred_marriage
  basis: A Savaii Fe'e marries a chief's daughter on Upolu and makes a reef opening
    associated with Apia harbour.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The text calls it a marriage but gives limited ritual or cosmological
    detail; the sacred-marriage taxonomy fit is tentative.
- id: motif:11
  label: drifting plant as favorable war omen
  taxonomy_refs:
  - tree
  - water
  basis: Fe'e sends a branch drifting down the river as a good omen and sign to continue
