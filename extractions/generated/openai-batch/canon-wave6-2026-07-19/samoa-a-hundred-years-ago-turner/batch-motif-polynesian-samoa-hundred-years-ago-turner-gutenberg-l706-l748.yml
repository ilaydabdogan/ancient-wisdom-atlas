  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The self-injury before the dead owl is thought pleasing to the deity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The dead bird is wrapped and buried carefully and ceremonially as if it were
    a human body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The death of the owl is not considered the death of the god; the god is considered
