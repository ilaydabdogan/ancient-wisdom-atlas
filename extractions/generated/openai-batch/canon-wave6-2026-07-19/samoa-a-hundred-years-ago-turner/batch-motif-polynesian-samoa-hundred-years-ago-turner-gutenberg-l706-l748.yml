canonical_text:
  quote: ''
  summary: The passage describes Samoan offerings of cooked food and a first cup to
    a god, annual and war-related feasts, restrictions on war-offering food, and disposal
    of leftovers. It then describes village gods as having particular incarnations
    in animals, birds, rainbow, and shooting star; rites for a dead owl incarnation;
    and the use of animal and celestial signs as war omens. The narrator closes by
    characterizing the system as demanding and as involving widespread zoolatry.
  language: English
  quote_policy: summarized
