canonical_text:
  quote: ''
  summary: The passage recounts a Falealupo story in which Tapuitea, daughter of Tapu
    and Tea, marries the king of Fiji, bears Toiva and Tasi, becomes a horned cannibal,
    pursues her sons to Samoa, and finally ascends to the heavens as Venus after confronting
    Toiva. It also gives place and title explanations connected with Tasi and Toiva,
    then describes Faatoafe's staff-borne exhortations to plant crops and avoid theft,
    followed by his son Tupai's deceptive acquisition of taro and land.
  language: English
  quote_policy: summarized
