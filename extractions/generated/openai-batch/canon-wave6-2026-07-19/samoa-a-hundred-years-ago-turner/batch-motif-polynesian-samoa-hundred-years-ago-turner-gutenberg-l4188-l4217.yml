  quote: '"common interest in each other''s property"'
  summary: The passage describes a Samoan system of shared property and mutual obligation
    within friends, tribe, or clan. Major needs are raised collectively; people may
    live with friends without charge and freely borrow goods. The author notes strong
    pressure not to appear stingy, criticizes the system as limiting individual accumulation,
    but also states that vulnerable people receive housing, food, and clothing, making
    European-style poverty difficult for Samoans in the passage to understand.
