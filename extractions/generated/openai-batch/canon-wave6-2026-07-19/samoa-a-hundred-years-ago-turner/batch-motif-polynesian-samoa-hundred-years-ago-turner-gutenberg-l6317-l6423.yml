canonical_text:
  quote: ''
  summary: The passage gives political and place-name traditions for Savaii, especially
    Faasaleleanga. It recounts cross-island marriage and voyages involving Tonga,
    Fiji, and Samoa; names children and districts from events, objects, and persons;
    describes a kin arrangement to prevent quarrels; narrates the seizure of a Tongan
    mooring-stick that becomes Malietoa's war club and commemorative district emblem;
    and records additional village etymologies and war roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Savaii is said to have three principal divisions; Faasaleleanga is also called
    Sa Lafai, meaning sacred to Lafai.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tupailelei, also called Tupai the good, married a daughter of the king of
    Tonga, and her father ordered her to go to Tonga some months after the marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the first attempted voyage to Tonga, the canoe was driven to Fiji, and
    a child was named Vaasiliifiti, explained as 'Canoe drifted to Fiji.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On a later voyage, the travellers again missed Tonga and reached Samoa; as
    Samoa appeared, a girl was born and named Samoauafotu, later abbreviated to Safotu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near Savaii, a fai or skate was caught, raised on the mast, and used as a
    sail; a son of Vaasiliifiti was called Laifai from this event.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A fish nibbling at the fune or core of a bread-fruit led to another son of
    Vaasiliifiti being called Fune, meaning 'core.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lafai and Fune were arranged to live in different districts, with their aunt
    Fotu between them to prevent quarrelling; if one began strife, the other and Fotu
    united to stop it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Lafai lived at the place later called Lefaasaleleanga and divided it into
    three parts among three children, with Fotulafai occupying the central and leading
    part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During a period of Tongan victory in Samoa, the invaders lived on the common
    at Safotu and received tribute brought to their chief, Talaaifeii.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tuna and Fata, sons of Malietoa Savea, took the iron-wood mooring-stick of
    the Tongan king's canoe, made it into a club, rallied people to battle, won a
    victory, and a peace treaty followed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Salafai district was called Lele'ale'a, and then Faasaleleanga, to commemorate
    the mooring-stick; when the district united for war, this was called the lifting
    of Malietoa's Le'ale'a club.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sapapalii is said to take its name from a family head called Papalii; the
    celebrated Le'ale'a club disappeared around his time.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Safotulafai is described as the political capital of Faasaleleanga and the
    place of representative parliamentary gatherings, especially in times of war.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Iva is a village south of the capital whose settlements take the advance or
    attacking role in battle; its name is linked to a tall man who built a house without
    scaffolding.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Amoa protects the capital on the northeast; alternative explanations trace
    its name either to a fort of Chief Moa during the Tongan invasion or to Lady Moa
    from Fiji, who came seeking a husband and found Nonu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The north side of Savaii was formerly called the side of Taoa after a chief
    of Fijian descent; tao means spear and was treated as an emblem of the people's
    heroism and name.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: When going to Manono to fight in revenge for Tamafainga's death, the people
    laid down a heap of spears as a token of alliance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Saleaula takes its name from Chief Aula, who distinguished himself in battle
    and was invited to lead in politics and war; his brother Tufunga acted as premier
    in Faasaleleanga.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:19
  text: Lealatele means 'the great road' and is named from a ten-mile level road;
    Matautu traces its name to Lautalatoa of Fiji and his son Utu.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
