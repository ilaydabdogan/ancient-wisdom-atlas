candidate_motifs:
- id: motif:1
  label: event-based naming after sea travel
  taxonomy_refs:
  - departure
  basis: The passage repeatedly explains personal and place names from attempted departures,
    diverted voyages, landfall, and observed objects during travel.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The available taxonomy term 'departure' fits only broadly; the passage
    is an etiological travel account rather than a formal quest narrative.
- id: motif:2
  label: genealogical charter for political divisions
  taxonomy_refs:
  - royal_legitimacy
  basis: Political divisions and leading places are explained through descent from
    Lafai, a marriage to a Tongan king's daughter, named descendants, and allocations
    among children.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage grounds political geography in ancestry, but it does not explicitly
    state a doctrine of kingship or divine right.
- id: motif:3
  label: mediating kin placed between rivals
  taxonomy_refs: []
  basis: Fotu is placed between Lafai and Fune to prevent quarrelling, and she joins
    with one party to suppress strife begun by the other.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a local political-kinship pattern; no supplied taxonomy reference
    directly matches it.
- id: motif:4
  label: enemy object seized and transformed into collective war emblem
  taxonomy_refs:
  - sacred_theft
  basis: Tuna and Fata take the Tongan king's mooring-stick, turn it into a club,
    use it to rally battle, and its memory becomes attached to the district's sacred
    name and war mobilization.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage presents the act as insult and declaration of war; 'sacred_theft'
    is a cautious taxonomy link because the object is later commemorated as sacred
    to the mooring-stick.
- id: motif:5
  label: weapon as emblem of identity and alliance
  taxonomy_refs: []
  basis: Tao is glossed as spear and treated as an emblem of heroism and name; a heap
    of spears is laid down as a token of alliance.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No supplied taxonomy motif directly matches weapon-emblem alliance tokens.
- id: motif:6
  label: foreign courtship as place-name origin
  taxonomy_refs: []
  basis: One account of Amoa's name tells of Lady Moa from Fiji coming to seek a husband
    and marrying Chief Nonu.
  evidence_refs:
  - ev:8
