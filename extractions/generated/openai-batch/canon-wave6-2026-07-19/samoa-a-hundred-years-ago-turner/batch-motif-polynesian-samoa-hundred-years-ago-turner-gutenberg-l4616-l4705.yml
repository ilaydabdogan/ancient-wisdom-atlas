canonical_text:
  quote: Unless all were pretty much agreed, nothing was done. They were afraid to
    thwart even a small minority.
  summary: The passage describes Samoan village punishments, local suppression of
    quarrels, the independence and federation of villages into districts, and the
    conduct of outdoor parliamentary assemblies marked by formal oratory, insignia,
    food exchange, and consensus-oriented decision-making.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Punishments for crimes included binding, naked public display, suspension
    from a prickly pole, exposure to sun, hanging by the heels, striking the head
    with stones, handling a prickly sea-urchin, and biting a pungent root.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shrinking from a punishment chosen by the village court was considered cowardly;
    a young man is described as boldly taking five bites of the pungent root before
    chiefs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When two families in a village wished to fight, other family heads and the
    chief forbade the fighting, and either party risked consequences if it continued
    against public opinion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Village communities of two to five hundred people were described as distinct,
    independent, and free to act in their own affairs on their own ground.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Eight or ten villages could unite by common consent into a district or state
    for mutual protection, with a capital village and sometimes a higher chief titled
    King.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When war was threatened by another district, the district assembled at its
    capital for a special parliament rather than leaving a single village to act alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Parliamentary meetings were held outdoors, with representatives seated under
    bread-fruit trees around the margin of an open space called the malæ or forum.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Heads of families served as orators and members of parliament, while kings
    and chiefs rarely spoke.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A speaker stood, placed a fly-flapper or badge of office over his shoulder,
    held a six-foot staff, leaned on it, and raised his voice toward the end of sentences.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first speaker was preceded by a formality in which several heads rose,
    passed on the right to speak, and eventually left one speaker to begin.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Formal speeches included detailed names, titles, and ancestral references
    before turning to the point of the meeting.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Food was carried by young men and women to their chief, then sent as a compliment
    to another chief, who would later return the compliment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The food exchange is described as producing a flow of friendship and giving
    parties at variance an opportunity to show kindness to each other.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Debates generally ended at sundown, but urgent matters could continue in darkness
    or moonlight until after midnight.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: No decision was made unless nearly all were agreed, because participants were
    afraid to thwart even a small minority.
  category: relationship
  evidence_refs:
  - ev:8
