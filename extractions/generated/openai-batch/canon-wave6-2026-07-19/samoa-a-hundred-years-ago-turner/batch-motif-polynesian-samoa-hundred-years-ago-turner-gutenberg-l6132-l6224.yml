canonical_text:
  quote: ''
  summary: 'The passage gives several Samoan place and origin narratives: Sina is
    pursued by an eel that is poisoned with ''ava and tells her to bury its head,
    from which a coconut tree grows; Safata and its lagoon are explained through named
    persons and the death of a great fish slain from inside by Alo of Palauli and
    helpers; and Leulumoenga is linked with the theft of a high-born infant who becomes
    king of Aana.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sina stops trying to escape, turns back toward home, and is seen passing through
    a village with an eel following her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A village chief invites Sina in after promising to deal with the eel, then
    instructs young men to gather poisonous things to mix into 'ava.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first cup of prepared 'ava is given to the eel outside, and the eel drinks
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After drinking, the eel tells Sina it is dying and asks her to take its head
    after it is cooked and bury it near the stone wall.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The eel says the buried head will grow into a coconut tree whose nuts show
    its eyes and mouth, and whose leaves will give shade and materials for mats and
    a fan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sina obtains the cooked eel's head, buries it near the stone wall, and a coconut
    tree grows there; the passage links this to Laloata and to the introduction of
    coconuts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Safata is said to have its name-origin in Sa from Fonaui in Fiji and Fata
    of Sangana, and is described as containing villages and a salt-water lagoon with
    a narrow sea entrance.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The circular lagoon is said to have been formed by the dying struggles of
    a great fish that had been feared by people crossing between Savaii and Upolu.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A man from Savaii prepares bamboo knives, travels in a canoe with his two
    sons, and is swallowed by the great fish along with the canoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inside the fish, the man gives instructions to cut right and left; in one
    version he also gives knives to surviving Samoans found inside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wounded fish rushes toward Upolu, tears a passage at Safata, wheels around,
    and dies; Alo of Palauli and his sons are released from inside and Alo is later
    called the Fish-enterer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fragments of black rock near the lagoon are said to be the petrified bones
    of the great sea monster.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Two men cut their hair short, disguise themselves as women, steal a newly
    born infant of rank at night, take him to Leulumoenga, and he later becomes king
    of Aana.
  category: sequence
  evidence_refs:
  - ev:8
