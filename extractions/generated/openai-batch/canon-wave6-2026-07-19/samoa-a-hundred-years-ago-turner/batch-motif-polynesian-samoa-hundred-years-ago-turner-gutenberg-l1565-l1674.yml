candidate_motifs:
- id: motif:1
  label: War divination through embodied divine signs
  taxonomy_refs: []
  basis: Multiple war contexts rely on signs from stones, a shell's sound, bird flight,
    shark-teeth weight, and bat flight to determine good or bad outcomes.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  confidence: high
  cautions: This is a passage-level pattern across several listed deities, not a single
    narrative episode.
- id: motif:2
  label: Deity present in animal, object, plant, place, or human medium
  taxonomy_refs: []
  basis: Divine presence is located in stones, a trumpet-shell, a kingfisher, shark
    teeth, bats, a shrub, a ti leaf banner, and human speakers.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage uses language of presence or incarnation rather than describing
    transformation.
- id: motif:3
  label: Sacred grove consultation
  taxonomy_refs: []
  basis: Tangaloa is consulted in a sacred grove of high trees where stones beneath
    the trees are treated as the god's location and as omens.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not describe the grove as a cosmic axis or world center.
- id: motif:4
  label: Culture-bringing deities introduce tattooing
  taxonomy_refs:
  - culture_hero
  basis: Taema and Tila fainga swim from Fiji to introduce tattooing to Samoa, and
    the altered song explains why men rather than women are tattooed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The motif is etiological and craft-focused; the passage does not call
    the figures heroes.
- id: motif:5
  label: Sacred twins joined and separated by water
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  basis: Taema and Titi are twins joined back to back, separated by a wave, and later
    treated as household guardian gods with taboos concerning doubleness.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The relationship is stated as twins; no broader genealogy is given.
- id: motif:6
  label: Taboo on double objects and mimicking divine form
