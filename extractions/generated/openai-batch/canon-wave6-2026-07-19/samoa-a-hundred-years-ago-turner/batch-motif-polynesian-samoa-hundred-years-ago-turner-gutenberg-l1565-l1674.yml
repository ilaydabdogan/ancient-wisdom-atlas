canonical_text:
  quote: ''
  summary: The passage describes Samoan district, family, war, household, and tattooing
    deities; their incarnations in objects, animals, plants, and human speakers; war
    omens gained from stones, shell sound, bird and bat flight, and a bundle of shark
    teeth; offerings and bloodletting to Taisumalie; an account of Taema and Tila
    introducing tattooing; and twin household gods whose separation by a wave grounds
    taboos on double objects and back-to-back posture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tangaloa is said to have come along the ocean in a canoe with a crew of seven
    and to have settled in inland bush near a village.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confused noises from the bush were regarded as murmurs of the gods and as
    a cause of death in the village.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: When war broke out, two chiefs went inland to consult Tangaloa at a sacred
    grove of high trees.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One consulting chief sat in front of the grove while another went behind it
    covered with leaves from head to foot, leaving only an opening for the eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: No creepers were allowed on the sacred trees and no leaves were allowed on
    the small stones beneath them, because the god was thought to be in the stones.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Separated stones were taken as a bad omen of disruption, death, or banishment;
    huddled stones were taken as a good omen of union, victory, and strength.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Tapaa'i was a family war god on Tutuila believed to be present in a trumpet-shell
    blown by a priest before war.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The sound of Tapaa''i''s shell was interpreted as an omen: rough and hollow
    was bad, while clear and euphonic was good.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: One Taema was a war god incarnate in a kingfisher bird whose straight flight
    ahead of troops was a good sign.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A Taema temple had one opening; old men addressed the god inside, and the
    reply was heard in a human voice without a visible body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Another Taema was a goddess found swimming between Tutuila and Upolu, covered
    with fine native cloth by fishermen, and conveyed to a bush place where a temple
    was built.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Food and fine mats were offered at Taema's temple and laid before two men
    who acted as priests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the change to Christianity, Taema's temple was destroyed, and fine mats
    from the temple treasures were exchanged for pigs used in a final feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In another place Taema was a war god present in a bundle of shark teeth wrapped
    in native cloth; the bundle's weight before battle was read as an omen.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: Taema and Tila fainga were goddesses of tattooers who swam from Fiji to introduce
    tattooing to Samoa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Taema and Tila fainga were commissioned to sing that women, not men, should
    be tattooed, but after the long journey they arrived singing the reverse, explaining
    tattooing of men rather than women.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Taema and Titi were twin household gods whose bodies were joined back to back
    until a wave separated them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: Members of Taema and Titi's family regarded them as guardians on journeys.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:19
  text: Double objects such as a double yam or two adhering bananas were sacred and
