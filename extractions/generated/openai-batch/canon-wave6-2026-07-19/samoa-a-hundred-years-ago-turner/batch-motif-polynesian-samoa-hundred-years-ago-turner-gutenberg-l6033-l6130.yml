candidate_motifs:
- id: motif:1
  label: Self-substitution saves an intended victim and ends human victims
  taxonomy_refs:
  - sacrifice
  - culture_hero
  basis: Polu-leuligana has himself wrapped and presented as the intended baked victim,
    saving the lad and causing Malietoa to replace human victims with pigs; Polu receives
    the name Downfall-of-Cannibalism.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents a local chiefly story; it does not describe Polu
