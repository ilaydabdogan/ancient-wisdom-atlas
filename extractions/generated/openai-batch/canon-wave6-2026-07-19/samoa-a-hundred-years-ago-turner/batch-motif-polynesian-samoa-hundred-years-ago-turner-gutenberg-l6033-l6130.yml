canonical_text:
  quote: ''
  summary: The passage gives local accounts attached to Upolu place names and political
    divisions. At Malie, Polu-leuligana saves a boy intended for Malietoa's cannibal
    meal by substituting himself in a ritual food wrapping, leading Malietoa to replace
    human victims with pigs. Another Malietoa story tells how the conjurer Vaapuu
    identifies animal thieves and saves bound priests. Faleata is linked to Ata and
    Too, whose grief creates Lake Lanutoo, and to a battle stratagem called a Faleata
    flight. Apia and Tanumamanono are explained through a battle with Manono canoes
    and burials. Laulii is explained through Lau and Lii transforming into rocks.
    Laloata begins a story of Sina and a sea eel that grows, bites her, is suspected
    of being a cruel god's incarnation, and pursues her as her parents try to block
    it by raising mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Malietoa is described as having his principal residence on Upolu at Malie,
    in the district of Sangana.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: After returning to Sangana, Polu-leuligana hears a lad from Savaii wailing
    because he is about to be killed for Malietoa's next meal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Polu-leuligana tells the lad to be quiet, promises to try to save him, and
    has himself wrapped in plaited green coconut leaves, slung on a pole, and laid
    before Malietoa as if he were the baked victim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Malietoa opens the wrapping, sees his son Polu-leuligana, spares the intended
    victim, declares that human victims are no longer to be killed for the oven, and
    orders pigs to be used instead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After food and fowls disappear, Malietoa summons twenty priests, orders them
    to divine the thief, and has them tied hand and foot in the blazing sun when they
    cannot answer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Vaapuu arrives from Savaii and identifies the owl, bat, and kingfisher as
    the takers of the fowls, bread-fruits, and bananas, after which the twenty priests
    are released.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Faleata is explained as the House of Ata; after Ata is killed in battle, his
    brother Too scoops out a hollow and fills it with tears, giving rise to Lake Lanutoo,
    the Lake of Too.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In a battle on Savaii, Faleata people pretend to flee, while others lie among
    the slain as if dead, then rise with clubs and defeat the Safune people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Apia is explained from Apitia, meaning straightened, in memory of a battle
    in which Tuamasanga forces suddenly attack Manono canoes and the fleeing canoes
    collide in the narrow harbor passage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tanumamanono is explained as The-burial-place-of-Manono, preserving the memory
    of slain Manono people buried there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: At Laulii, a couple named Lau and Lii wish to see a superior canoe called
