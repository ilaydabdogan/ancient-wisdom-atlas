- id: motif:2
  label: Clever divination identifies animal thieves and frees bound captives
  taxonomy_refs:
  - wisdom
  basis: Vaapuu's ready answer that the owl, bat, and kingfisher are the thieves leads
    to the liberation of the twenty priests tied in the sun.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage calls Vaapuu a conjurer but does not explain whether the answer
