canonical_text:
  quote: ''
  summary: The passage gives origin explanations for Samoan place names and settlements.
    It recounts royal privileges connected with Saluafata, the naming of Solosolo
    and its divisions, Queen Manu’s rescue of human victims from a cannibal feast
    in Tonga, the migration of her daughter Vaetoeifanga and people from the saved
    village to Samoa, the defeat of the cannibal god Maniloa by Polu-leuligana, and
    several Falealili place-name explanations involving graves, battle honor, trees,
    a house post, and a lagoon dried by hot water.
  language: English
  quote_policy: summarized
