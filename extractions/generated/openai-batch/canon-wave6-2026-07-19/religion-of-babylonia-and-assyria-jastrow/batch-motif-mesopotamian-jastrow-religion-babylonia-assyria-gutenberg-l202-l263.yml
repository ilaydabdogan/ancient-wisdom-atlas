canonical_text:
  quote: ''
  summary: In this preface passage, Morris Jastrow, Jr. explains that the book expanded
    because new Assyriological materials and publications required revision. He discusses
    the rapidly changing state of Assyriology, the unsettled Sumero-Akkadian controversy,
    and named scholars' positions. He then acknowledges work on the bibliography,
    addenda, index, and map, and gives special thanks to his wife for copying the
    manuscript, making suggestions, and encouraging the completion of the book.
  language: English
