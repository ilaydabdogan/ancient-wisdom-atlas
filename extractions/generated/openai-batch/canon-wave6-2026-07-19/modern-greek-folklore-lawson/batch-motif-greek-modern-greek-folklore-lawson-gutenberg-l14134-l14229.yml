  quote: ''
  summary: The passage surveys modern Greek and ancient Greek forms of divination
    from domestic accidents, fire and lamps, basil leaves on a coal for marriage omens,
    palmistry, involuntary bodily movements, hiccoughing, and sneezing. It presents
    these as continuities or parallels with ancient authorities and literary examples,
    including Suidas, Theocritus, Lucian, and a Homeric scene involving Penelope and
    Telemachos.
