canonical_text:
  quote: ''
  summary: The passage argues that the Callicantzari’s activity during the Twelve
    Days reflects a reduced survival of an older Dionysian season. It compares this
    seasonal restriction with modern Dryad lore, discusses offerings placed in chimneys
    for the Callicantzari, relates those offerings to Dionysus and Satyrs, and reconciles
    the Callicantzari’s identification with Satyrs with another view that they originated
    as men assuming beast form. The reconciliation is pursued through an etymological
    argument connecting κάντζαρος with ancient κένταυρος.
  language: English
  quote_policy: summarized
