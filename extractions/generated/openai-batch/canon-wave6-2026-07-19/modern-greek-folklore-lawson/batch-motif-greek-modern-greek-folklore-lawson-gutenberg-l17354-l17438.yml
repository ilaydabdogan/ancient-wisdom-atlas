canonical_text:
  quote: ''
  summary: The passage discusses modern Greek customs related to placing an object
    in the mouth of the dead, especially Chios and Rhodes variants using crosses,
    pottery, inscriptions, and a pentacle to prevent evil spirits from entering the
    corpse and making it a vrykolakas. It then explains an ecclesiastical theory in
    which excommunication delivers the body to Satan, so that postmortem diabolic
    possession could make a corpse into a revenant. The author distinguishes Christian
    and Slavonic additions from what he presents as an older Hellenic belief that
    some bodies do not decay but return from the grave, with lack of proper burial
    rites listed as one liable class.
  language: English
  quote_policy: summarized
