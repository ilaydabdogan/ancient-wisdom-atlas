  quote: ''
  summary: The passage discusses how Greek interpretations of ecclesiastical binding
    and loosing may have transformed excommunication into a doctrine of bodily non-dissolution
    after death. It links this to a pagan belief about cursed corpses, then describes
    traditions about incorrupt dead bodies rejected by the earth, appearing as revenants
    or vrykolakes, sometimes explained as hallucination and sometimes as the Devil's
    work. The passage also records rituals involving priests, prayers, exhumation,
    burning, and memorial services.
  language: English
  quote_policy: summarized
