canonical_text:
  quote: ''
  summary: The passage discusses Greek memorial customs, especially the fortieth day
    after death, regional practices for suspected vampires or undissolved corpses,
    and the comparative religious purposes of cremation and inhumation. It also describes
    the Greek idea that symbolic burial, such as sprinkling dust over a corpse, could
    fulfill burial when full interment was impossible.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'At Sinasos two commemorations are described: κανίσκια, with food distributed
    to the poor on the fortieth day, and μνημόσυνα, anniversary services involving
    an ornamental dish of boiled wheat at church.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes the fortieth-day commemoration as popular and later
    anniversary observances as ecclesiastical; it reports a belief that dissolution
    is normally complete by the fortieth day, while church exhumation is fixed after
    the third year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Sinasos and Patmos, priestly fees for memorial services are said to derive
    their name from the word for forty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Crete, a dead man suspected of becoming vrykolakas is to be dealt with
    before entering a second forty-day period, after which natural dissolution is
    considered hopeless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Scyros, corpses found whole at exhumation and suspected of vampire-like
    proclivities were formerly burned; the passage says this was replaced by carrying
    the body to forty churches and then reinterring it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Scyros practice is described as involving forty saints, visits to their
    sanctuaries, candles, and an expected share in loosing the dead, or alternatively
    forty funeral services in one day.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage contrasts earth as loosing dead bodies over days with fire as
    causing disintegration on a pyre within hours.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A burned body is said not to be able to wander as a revenant, while buried
    bodies may remain bound and indissoluble because of curse, crime, violent death,
    or deficient funeral rites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The author states that ancient and modern Greek cremation and inhumation are
    to be examined as having the same religious purpose, with cremation preferred
    as a means to that end.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Cremation is defined as consumption of the corpse by fire, and inhumation
    as laying the corpse out of sight in earth; the Greeks are said to judge by intention
    more than by the completed act.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sprinkling a handful of dust over a dead body is said to constitute burial
    in examples involving Antigone and Polynices, Attic Law, and Aelian’s account
    of an elephant sprinkling earth over a dead elephant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Burial is described as more than disposal of the dead: for Greeks it is a
    provision for the dead person’s welfare, and a suggestive ceremony may suffice
    when real burial cannot be given.'
  category: relationship
  evidence_refs:
  - ev:5
