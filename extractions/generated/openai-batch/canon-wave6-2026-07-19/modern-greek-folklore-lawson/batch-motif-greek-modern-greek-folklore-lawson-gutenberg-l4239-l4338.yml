canonical_text:
  quote: ''
  summary: The passage describes modern Greek representations of Charos as a soul-taker
    and soul-conveyor working alongside angels, especially Archangel Michael, and
    gives a folk-story in which Charos becomes a child’s godfather, shows a father
    life-candles in a mountain cave, teaches him death-prognosis at sickbeds, and
    finally takes his soul. It also notes folk-song laments of dying warriors who
    bid farewell to mountains, waters, trees, birds, sun, and moonlight, while Charos
    cannot grant respite.
  language: English with Greek quotations
  quote_policy: summarized
