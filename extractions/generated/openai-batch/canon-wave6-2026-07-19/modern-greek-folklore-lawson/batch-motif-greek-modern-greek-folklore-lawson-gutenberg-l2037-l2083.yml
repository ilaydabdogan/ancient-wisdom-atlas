  quote: ''
  summary: The passage describes modern Greek peasant belief in non-Christian supernatural
    beings, including gods, demons, fairies, dragons, nymphs, and older named divine
    figures. It reports that peasants treat such beings as real, pray or offer to
    some, defend against others, and sometimes report apparitions. It places these
    beings below Christian objects of worship while presenting them as survivals of
    older mythology.
