canonical_text:
  quote: "“Thus the hospitality of to-day, in its details no less than in its spirit,
    recalls the hospitality of the Homeric age.”"
  summary: 'The passage compares modern Greek rural practices with Homeric scenes:
    a traveller can stop attacking sheepdogs by sitting and dropping a weapon, as
    Odysseus does before Eumaeus’ dogs; a modern host drives dogs away, feeds a guest
    with bread, wine, and roasted meat before questioning him, like Homeric hospitality;
    and modern panegyria festivals combine religion, art, trade, athletics, and dance
    in ways the author compares to ancient Greek gatherings and games.'
  language: English
