canonical_text:
  quote: ''
  summary: The passage argues that Greek religion placed high value on obtaining divine
    counsel through divination. It describes omens, oracles, Socrates’ daemon and
    vision, the Greeks’ belief in accessible gods, a twofold model of communication
    between humans and gods, and a catalogue of divinatory methods from Aeschylus
    and Suidas, including dreams, chance words, road encounters, bird signs, sacrificial
    entrails, fire signs, domestic incidents, palmistry, bodily twitching, and direct
    inspiration.
  language: English
  quote_policy: summarized
