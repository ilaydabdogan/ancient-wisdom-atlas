  text: The passage says human sacrifice was tolerated in Athens and was apparently
    practiced in honour of Lycaean Zeus in the time of Pausanias, while reticence
    and horror limited open description of it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents, as a hypothetical explanation, the sating or propitiating
    of a wolf-like god with human flesh, and contrasts this with a later anthropomorphic
