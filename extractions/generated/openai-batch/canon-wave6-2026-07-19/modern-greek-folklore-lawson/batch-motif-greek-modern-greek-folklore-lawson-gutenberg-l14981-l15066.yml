canonical_text:
  quote: ''
  summary: The passage argues that one motive for human sacrifice in ancient Greece
    may have been the belief that a slain victim could carry a petition to the gods
    or the other world. It discusses the persistence of human sacrifice despite repugnance,
    possible propitiation of a wolf-like Lycaean Zeus, uncertainty over whether the
    messenger function was original or a later justification, and a Dahome example
    in which slain persons serve or carry messages to the dead king.
  language: English
  quote_policy: summarized
