canonical_text:
  quote: ''
  summary: The passage argues from archaeological examples that Greek funerary practice
    could combine cremation and inhumation. It describes child burials at Eleusis
    in earthenware coffin-jars with unburnt bones but traces of burning around them,
    historic graves where bodies were both burned and buried, and shared funerary
    details such as washing, anointing, lamentation, procession, and grave gifts.
    The author interprets the common purpose of both rites as securing speedy dissolution
    of the dead body.
  language: English
  quote_policy: summarized
