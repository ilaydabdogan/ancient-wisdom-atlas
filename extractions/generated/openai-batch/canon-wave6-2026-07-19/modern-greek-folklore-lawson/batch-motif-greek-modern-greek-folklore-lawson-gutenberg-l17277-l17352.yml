canonical_text:
  quote: ''
  summary: The passage discusses ecclesiastical explanations of revenants and vrykolakes.
    It cites S. Anastasius Sinaita on devils using false prophets to present a dead
    man as risen, by entering and moving the corpse and speaking through it, while
    also describing the event as imagination or hallucination. Lawson compares this
    with a nomocanon and argues that Church teaching wavered between treating revenants
    as hallucinations and treating them as real works of the Devil. The passage further
    notes that the devil-based explanation was accepted by educated writers and likely
    by common people in relation to vrykolakes.
  language: English
  quote_policy: summarized
