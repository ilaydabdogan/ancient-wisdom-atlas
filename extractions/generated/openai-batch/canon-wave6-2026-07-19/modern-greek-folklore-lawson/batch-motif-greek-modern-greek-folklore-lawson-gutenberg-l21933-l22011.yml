canonical_text:
  quote: The proper place for the ‘unsleeping lamp’ is the grave-side.
  summary: Lawson describes Greek mortuary customs surrounding an ‘unsleeping lamp’
    lit after death and kept burning either in the death chamber or, in what he identifies
    as the older form, at the grave-side. Local practice varies between forty days
    and three years, periods linked to beliefs about bodily dissolution. A quoted
    funeral-dirge has a dead man ask his beloved to light three torches; their quenching
    marks the end of his awareness of this world. Lawson interprets the grave-side
    flame as connected with dissolution and possibly as an act of ceremonial cremation.
  language: English
  quote_policy: quoted
