    miserable was not merely Homeric invention but a popular conception also reflected
    in modern Greek dirges. It then contrasts this with a Pindaric fragment describing
    a blessed underworld for the righteous, with sunlight, rose-filled meadows, fragrant
    offerings, golden fruits, and continued pleasures.
