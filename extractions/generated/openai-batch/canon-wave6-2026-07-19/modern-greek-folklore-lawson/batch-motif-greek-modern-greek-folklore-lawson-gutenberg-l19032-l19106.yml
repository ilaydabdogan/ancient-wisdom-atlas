canonical_text:
  quote: "“the dead man himself was believed to control and direct it”"
  summary: The passage argues that, in Greek ideas about homicide and neglect of burial,
    the injured dead person was thought to direct punishment through agents. It then
    distinguishes punishment owed to the dead from religious purification required
    for blood-pollution, illustrating the distinction through examples from the Oresteia,
    Plato’s homicide laws, Attic law, and Aeschylus’ account of Orestes.
  language: English
  quote_policy: quoted
