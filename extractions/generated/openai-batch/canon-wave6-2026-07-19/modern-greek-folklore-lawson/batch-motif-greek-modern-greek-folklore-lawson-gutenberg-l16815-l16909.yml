canonical_text:
  quote: ''
  summary: A translated Modern Greek ballad tells of a mother with nine sons and one
    daughter, Areté. Constantine urges that Areté be married far away and vows before
    the Saints and God to bring her back if needed. After pestilence kills the brothers,
    the mother adjures Constantine at his tomb. He rises, travels with clouds, stars,
    and moon, fetches Areté, and escorts her home while birds repeatedly identify
    him as dead. At the locked, cobwebbed house, the mother opens to Areté and Constantine
    and dies. The prose commentary notes many versions of the ballad and quotes variants
    in which the mother’s curse on Constantine is explicit.
  language: English with brief Greek quotations in commentary
  quote_policy: summarized
