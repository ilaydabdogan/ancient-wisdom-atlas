canonical_text:
  quote: ''
  summary: The passage presents modern Greek songs and commentary in which birds carry
    news between living people, Charos and the lower world, and heaven. One ballad
    makes a golden bird the guise of the dead warrior Tsamados, who returns from heaven
    to encourage the living. The author uses these examples to discuss bird augury
    as a survival of ancient Greek belief and then introduces sacrificial divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A folk-song says that a young bride boasted she did not fear Charos; an evil
    bird informed Charos, and Charos shot arrows that left her on her death-bed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author surmises that the bird in the bride song was “Charon’s bird,” the
    tawny owl, which he identifies as a messenger of evil.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another poem describes a little bird coming from the lower world with red
    claws and black feathers, marked by blood and soil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mothers, sisters, and wives approach the lower-world bird with sugar, scented
    wine, and amaranth, asking it to tell the truth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lower-world bird reports seeing Charos riding, dragging young men by the
    hair, old men by the hands, and carrying little children at his saddle-bow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a historical ballad, a speaker wishes he were a bird so that he could fly
    to Mesolonghi and observe the fighting.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A golden-plumaged bird tells George that Charos is standing over Turkish ships
    and that they will be turned to ashes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The golden bird says it only seems to be a bird, identifies itself as Tsamados,
    says it died fighting at Navarino, and says it now dwells in the heavens.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tsamados encourages George about future fighting in the Morea and before Mesolonghi;
    afterward the bird flies up to the heavens.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author states that identifying the winged messenger with a dead man’s
    soul is peculiar to this ballad, but that it shows the popular feeling that birds
    communicate between earth and heaven.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that the ancient belief in birds as instruments of divine
