canonical_text:
  quote: ''
  summary: The passage describes modern Greek beliefs about the evil eye, dangerous
    reflections, and stars as malign night-time gazers. Brides, women in child-bed,
    mothers after confinement, newborns, animals, leaven, salt, vinegar, and clothing
    are said to require precautions such as removing mirrors, using amulets, covering
    objects, returning indoors by sunset, closing doors and windows, making averting
    gestures, spitting, and deceptive naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some districts, looking at oneself in a mirror is regarded as dangerous,
    especially if prolonged; brides are advised to avoid seeing their reflection,
    and mirrors are removed from the room of a woman in child-bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The danger of mirrors or reflective gazing is said to be greatest at night,
    and the town of Sinasos in Cappadocia is named as a place where prudent people
    would avoid it then.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says a person’s reflected image may put the evil eye upon him
    by its steady gaze; Damoetas in Theocritus is described as spitting three times
    into his bosom after examining his reflection in a pool.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Stars are described as the eyes of night, and are said to overlook people
    and belongings in darkness as the human eye does by day.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman after confinement is said to avoid being seen by a star; if she goes
    out before the prescribed period, she should return by sunset and then open neither
    door nor window.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Chios, leaven carried from one house to another is covered by day against
    a strange eye and by night against the stars; if overlooked, bread made from it
    is said not to rise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the same Greek phrases denote the operation of human
    eye and stars, and that both have the same blighting effect.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In some districts newborn infants before baptism are said to be immune because
    they are children of darkness, though the passage says people are generally never
    wholly secure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Amulets are said to give reasonable safety in ordinary times, with more elaborate
    precautions especially at marriage and childbirth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Horses and mules are protected by amulets or blue beads; shepherds may attribute
    lamb losses to a jealous eye, and silkworms are also said to be vulnerable to
    the evil eye.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Leaven, salt, and vinegar are named as inanimate things easily damaged by
    the evil eye or stars because of their quickening or preservative properties.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A malicious neighbour may enter while a woman kneads bread and put the evil
    eye on the leaven; a special gesture can avert disaster by turning the influence
    against the intruder.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Borrowing or giving salt or vinegar at night is described as unwise; vinegar
    may be called syrup when requested as a device to deceive the stars.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Objects exposed to stars may carry the infection to later users; for this
    reason, linen and clothes of a mother and newborn infant must not be left outdoors
    at night.
  category: relationship
  evidence_refs:
  - ev:9
