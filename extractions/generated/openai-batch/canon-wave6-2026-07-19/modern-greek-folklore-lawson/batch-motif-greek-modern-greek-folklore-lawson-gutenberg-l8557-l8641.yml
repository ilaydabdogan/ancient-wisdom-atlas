canonical_text:
  quote: ''
  summary: The passage describes ecclesiastical prohibitions against cross-dressing
    and masks, reports Byzantine and later examples of masked winter or carnival mumming,
    and gives regional modern Greek examples involving Callicantzari, ‘Arab’ disguises,
    bride-abduction play, bells, animal skins, masks, and goat-skin bell-dancers in
    Scyros.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seventh-century church canon forbids men from wearing feminine dress, women
    from wearing male dress, and anyone from wearing comic, satyric, or tragic masks;
    excommunication is named as the penalty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Martyrdom of S. Dasius is cited as saying that at the Kalends of January
    some Christians held a procession, changed appearance and character, wore goat-skins,
    and disguised their faces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Balsamon is cited as saying that some clergy wore masks and various dresses
    in the church nave, appearing as soldiers, monks, or quadrupeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that in modern examples strange disguises remain a constant
    feature, and the occasions are winter festivals, either the Twelve Days or the
    carnival before Lent.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that there is some relation between the mummers who celebrate
    these festivals and the Callicantzari.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Crete the New Year mummers are called καμπουχέροι, while in Achaia κατσιμπουχέροι
    is given as a by-name of the Callicantzari.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Portariá on Mount Pelion, during the Twelve Days a man dressed as an ‘Arab’
    wears an old cloak, has bells on his clothes, carries a lantern through the streets,
    and is said by villagers to do this because of the Callicantzari.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Pharsala an Epiphany play includes mummers representing bride, bridegroom,
    and ‘Arab’; the ‘Arab’ tries to carry off the bride, and the bridegroom defends
    her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In parts of Macedonia New Year mummers are called ‘Arabs’ or ῥουκατζιάρια;
    a cited nineteenth-century report says boys during the Twelve Days carried bells,
    sang at houses, and included masked companions with bells and foxes’ brushes to
    look weird and monstrous.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Scyros at the carnival before Lent, young men wear goat-skin capes, sometimes
    with hoods or masks made from the skin of a small animal such as a weasel.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Scyros capes are belted with many large bronze goat-bells, arranged so
    that the bells hang away from the body and jangle with each motion of the dancer.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Scyros, small boys who cannot fully equip themselves attach a goat-bell
    as a tail, or use a branch from a nearby tree as a substitute tail.
  category: action
  evidence_refs:
  - ev:10
