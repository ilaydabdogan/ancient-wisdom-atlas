  quote: ''
  summary: The passage interprets the pharmakos ritual as originally a purified human
    messenger sent on behalf of the people to petition a god for deliverance from
    calamity, later misunderstood as an outcast whose expulsion removed communal pollution.
    It discusses public maintenance, pure foods, purgative beating with plants, sexual
    purity, comparison with a Marseilles pestilence custom, Menippus’ purification
    before consulting the dead, and examples of pure sacrificial victims.
  language: English
