  quote: ''
  summary: The passage argues that Greek literary presentations of murdered and unburied
    dead preserve, in modified form, a popular belief in revenants. Murdered persons
    are described as instigating curses or chthonic avengers against their killers,
    while unburied dead are described as causing divine or underworld wrath until
    proper burial is performed.
  language: English
