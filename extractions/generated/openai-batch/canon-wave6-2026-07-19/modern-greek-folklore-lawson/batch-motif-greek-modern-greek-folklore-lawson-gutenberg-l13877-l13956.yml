canonical_text:
  quote: "“the shoulder-blade of a young lamb is ... a veritable Sibylline book”"
  summary: The passage describes modern Greek practices of divining from sheep or
    lamb shoulder-blades, first among Klephts seeking war omens and then among shepherds
    seeking pastoral and weather omens. It relates the practice to an older shoulder-blade
    divination described by Michael Psellus and describes festival sacrifices in Zagorion
    and Boeotia where animals are blessed, killed, roasted, feasted on, and used for
    divination.
  language: English
  quote_policy: quoted
