- id: obs:3
  text: A Thessalian Klepht captain is described as divining by shoulder-blade in
    his fastness, warning that Turks had caught them alive, and breaking through surrounding
    Turkish forces with his troop.
  category: sequence
  evidence_refs:
  - ev:1
