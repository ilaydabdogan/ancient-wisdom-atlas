  summary: The passage surveys several Greek tragic passages in which Lawson argues
    that Alastor may be understood as a revenant avenger rather than as a god. He
    discusses Medea’s oath by underworld Avengers before killing her children, Jason’s
    accusation that Medea’s Avenger is her dead brother Absyrtus, and Heracles’ fear
    that his blood-guilt will contaminate Theseus after he has killed his children,
    followed by Theseus’ reply that no avenger of blood proceeds from loving friends
    against loving friends.
