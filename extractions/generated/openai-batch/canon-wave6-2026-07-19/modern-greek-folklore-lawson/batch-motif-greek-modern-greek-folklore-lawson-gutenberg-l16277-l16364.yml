canonical_text:
  quote: _Vrykolakes_ are not ghosts.
  summary: The passage distinguishes modern Greek vrykolakes from ghosts, describes
    them as resuscitated corpses whose animation is generally credited to the Devil,
    and argues that the modern superstition combines Slavic, ecclesiastical, and Hellenic
    elements. It then discusses the Slavic origin of the word vrykolakas and argues
    that Greek borrowed it from a non-Serbian Slavic usage meaning were-wolf rather
    than from Serbian vampire usage.
