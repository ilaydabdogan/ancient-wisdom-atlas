  summary: Lawson discusses passages from Sophocles and Aeschylus in which Agamemnon's
    children pray at his tomb or grave, reading them as evidence for a belief that
    a murdered dead man could return bodily and avenge himself. The passage then contrasts
    this bodily revenant pattern with literary representations in which the dead man
    becomes a ghost who works indirectly through kin, curses, or demonic agents, and
    it notes agreement between ancient and modern Greek lore about kin-assisted vengeance.
  language: English, with Greek quotations
