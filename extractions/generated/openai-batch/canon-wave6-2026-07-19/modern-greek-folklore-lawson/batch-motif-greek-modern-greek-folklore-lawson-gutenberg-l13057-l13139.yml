    gods, contrasting philosophical classifications with popular practice. It describes
    multiple divinatory media, the persistence of ancient methods into modern Greek
    folk life, respect for madness as possible inspiration, an anecdotal wandering
    mad prophet, and dreams as a widespread channel of divine revelation reinforced
    by Christianity and the Greek Church.
