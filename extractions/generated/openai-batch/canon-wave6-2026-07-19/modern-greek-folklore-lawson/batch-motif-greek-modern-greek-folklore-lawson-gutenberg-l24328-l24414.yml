canonical_text:
  quote: ''
  summary: The passage argues that Demeter’s rites became secret mysteries on the
    Greek mainland after the arrival of Achaean outsiders, while remaining open in
    Crete. It identifies initiation, purification, and pure Greek speech as ritual
    boundaries, then proposes that the mysteries developed popular Greek hopes of
    bodily survival after death and close postmortem communion with gods, expressed
    as marriage between humans and gods. It also describes early Christian criticism
    of these doctrines and of pagan terminology.
  language: English; includes Greek terms
  quote_policy: summarized
