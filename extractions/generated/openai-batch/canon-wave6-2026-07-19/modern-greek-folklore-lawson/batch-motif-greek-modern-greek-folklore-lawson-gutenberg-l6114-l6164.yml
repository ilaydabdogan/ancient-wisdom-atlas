    three days of August.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ἀλουστίναι are said not to be harmful to humans; they may be captured
    by magical ceremonies, employed as household servants for a period, and later
    return home when the spell is broken.
  category: sequence
  evidence_refs:
  - ev:3
