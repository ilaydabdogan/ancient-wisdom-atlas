canonical_text:
  quote: ''
  summary: The passage discusses modern Greek beliefs and observances around δρύμαις/drymes
    and related nymphs. It describes hostile water-dwelling female deities at Stenimachos,
    the Syme Ἀλουστίναι who inhabit torrents and trees and may be magically captured,
    early-August taboos on tree-cutting and water use, and tree-haunting Nereids whose
    lives are bound to their trees. The author compares these figures and customs
    with ancient Dryads and Naiads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says confusion between two classes of nymphs produced twofold
    injunctions for the observance of days called δρύμαις.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The word δρύμαις is said to have originally denoted a class of nymphs rather
    than, as generally in the author's time, their August festival.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Stenimachos in Thrace, δρύμιαις are described as female deities who live
    in water, are always hostile to humans, and are especially dangerous during the
    first six days of August.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author states that the name δρύμιαις points toward identification with
    ancient Dryads, while their watery habitations point rather toward Naiads.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Syme, Ἀλουστίναι are described as nymphs living in mountain-torrents, trees,
