canonical_text:
  quote: ''
  summary: The passage first states that the modern conception of Gorgons, though
    fused in popular imagination with Scylla and the Sirens, retains sea association
    and terror. It then introduces the Callicantzari under a section on Centaurs,
    describes them as widely known Greek folkloric monsters associated with New Year
    storytelling and persistent peasant fear, notes many dialect names, and summarizes
    large variations in accounts. The author distinguishes larger and smaller classes,
    describes the larger as black, shaggy, disproportionate, bestial, swift, strong,
    sometimes lame, and capable of appearing in forms ranging from human to animal
    or quadruped. The passage also states that the author will explain these divergences
    through identity with ancient Centaurs.
  language: English
  quote_policy: summarized
