  quote: ''
  summary: The passage argues that ancient Greek human sacrifice may have been motivated
    by the idea that the victim became a messenger to the gods. It then compares this
    proposed motive with modern Greek funeral dirges in which the dead carry messages
    or goods to Hades or the world below, and with ancient literary examples involving
    Polyxena and Priam as death-bound messengers.
  language: English
  quote_policy: summarized
