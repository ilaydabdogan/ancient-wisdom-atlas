  cautions: The passage summarizes a belief rather than presenting a specific narrative
    episode.
- id: motif:3
  label: Seasonal sea spirits threatening mariners
  taxonomy_refs:
  - seasonal_cycle
  basis: Sea Telonia are active from Christmas until the blessing of the waters at
    Twelfth-night, and ships are kept secure from their attacks during that period.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The seasonal activity is a local Athenian usage and is not described as
    the general Telonia belief.
- id: motif:4
  label: Human life bound to a serpent genius
  taxonomy_refs:
  - serpent
  basis: A story says an old wizard's life is bound up with a ten-headed snake beneath
    a threshing-floor.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The cited example concerns a wizard and may not represent ordinary persons
    in the same form.
- id: motif:5
  label: Death delayed by household serpent and released by ritual prayer
  taxonomy_refs:
  - serpent
  basis: The passage says prolonged death can be attributed to a genius unwilling
    to permit death; a priest's prayer causes house-snakes to burst and frees the
    dying person's soul.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The practice is described as occurring in extreme cases and before the
    author's time, not as universal.
- id: motif:6
  label: Paired moral guardian spirits
  taxonomy_refs:
  - duality
  basis: Each person is allotted two angels, one good and one bad, who respectively
    guide toward righteousness and vice.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage states that peasants do not actually number these Christian
    angels among genii, though their functions are said to match.
- id: motif:7
  label: Deathbed angel vision or angel struggle
  taxonomy_refs: []
  basis: The dying may see their guardian angel as a warning of death, and expressions
