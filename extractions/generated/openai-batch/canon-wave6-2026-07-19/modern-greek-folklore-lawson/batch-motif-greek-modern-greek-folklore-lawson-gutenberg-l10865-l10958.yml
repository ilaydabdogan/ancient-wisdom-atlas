  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage notes uncertainty about which angel is meant in some expressions.
- id: motif:8
  label: Personified shadow as luck or illness agent
  taxonomy_refs: []
  basis: A good shadow denotes luck, while being trampled by one's shadow denotes
