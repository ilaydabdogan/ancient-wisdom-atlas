canonical_text:
  quote: ''
  summary: 'The passage surveys local beliefs about Telonia as non-Christian or aerial
    spirits, including spring and sea spirits, unbaptised children detained at celestial
    customs, collectors of dues from souls, and assailants of mariners. It then describes
    personal genii and analogous guardian spirits: a wizard whose life is bound to
    a ten-headed snake, house-snakes whose destruction releases a dying person''s
    soul, paired good and bad angels assigned to each person, deathbed visions or
    struggles with angels, the personified shadow as a source of luck or illness,
    and the individual Fate as a possible personal genius.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Telonia are reported in some local usages as a synonym for non-Christian deities,
    as genii of springs, and as sea-beings active from Christmas until the blessing
    of the waters at Twelfth-night.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: During the period when Telonia of the sea were believed to be abroad, ships
    were kept at anchor to avoid their attacks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One belief says that children who die unbaptised become Telonia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains the belief about unbaptised children by saying they could
    not pass the celestial customs and were detained on the road to the other world
    to obstruct other souls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In general description, Telonia are called a species of aerial genius whose
    activities are collecting dues from departed souls and assaulting mariners.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A story tells of an old wizard whose life was bound up with a ten-headed snake
    living beneath a threshing-floor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: House-snakes are said in many cases to act as the genius of the head or another
    member of a household.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A prolonged death-struggle may be attributed to a genius that is unwilling
    to permit the person's death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In extreme cases a priest may enter the sick person's room alone and read
    a special prayer for release, causing the house-snakes to burst and the dying
    person's soul to be set free.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each person is said to have two angels, one good and one bad, who guide the
    person respectively toward righteousness or vice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Angels are described as constantly present but seldom visible, though the
    good angel may appear in stories to reward a virtuous old age.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: People born on Saturday are reputed to have special powers of seeing and dealing
    with the supernatural.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ability to see the guardian angel is most commonly granted to the dying,
    and the vision is treated as a warning that the end is near.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Different expressions connect peaceful, protracted, or sudden death with being
    borne by, fighting with, or being stricken by an angel.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The personified shadow is associated with good fortune when described as a
