canonical_text:
  quote: ''
  summary: The passage describes divination by marks on a sheep or lamb shoulder-blade
    among modern Aetolian and Acarnanian peasants, compares it with an ancient method
    described by Michael Psellus, and then describes pig-spleen divination in the
    same region for weather, crops, journeys, enterprises, marriage, and other concerns.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spots and blurs on the shoulder-blade are described as adverse prognostications,
    while a clean white surface is described as reassuring.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Different parts of the shoulder-blade are inspected for different questions:
    the ridge for lambing prospects, the flat surfaces for weather, right-side marks
    as favorable, left-side marks as ill-omened, and a depression as a sign of pestilence.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practice is described as complex, with the best exponents said to be mountain
    shepherds who are difficult to encounter because they shift grazing grounds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Psellus’s account, a sheep or lamb is chosen, a question is formed or spoken,
    the animal is slain, the shoulder-blade is removed, baked on hot embers, stripped
    of flesh, and inspected for tokens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Psellus assigns life-or-death questions to the ridge, where a clean white
    appearance promises life and blurring signifies death; weather questions are read
    from the middle surfaces, where clean white surfaces indicate calm weather and
    spotting indicates the reverse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author notes that Psellus does not mention right-left discrimination,
    but says the modern information otherwise closely matches Psellus’s account and
    the practice of ancient augurs.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: 'Pig-spleen divination is described for the same district: the spleen is removed
    from a fresh carcass before the rest is cut or cooked, and omens are read from
    roughness or discoloration.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Questions addressed by pig-spleen divination include weather, crops, vineyards,
    journeys, enterprises, and contemplated marriage.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A smooth spleen surface is a good omen; roughnesses portend obstacles or difficulties;
    abnormal color blotches warn of blight and mildew on crops and vines.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Pig-spleen divination is associated with low-lying cultivated or wooded districts
    where swine are kept, while sheep shoulder-blade divination among mountain shepherds
    chiefly concerns flock prospects.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The author states that either divination method can, in expert hands, answer
    almost any questions.
  category: attribute
  evidence_refs:
  - ev:11
