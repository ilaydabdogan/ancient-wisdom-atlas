canonical_text:
  quote: ''
  summary: The passage distinguishes the Gelloudes or Agieloudes from sea nymphs,
    describing them as female demons who carry off and devour children. It traces
    the figure from the named spectre Gello to a broader class associated with Striges,
    witches, blood-sucking, infant death, and wasting sickness. It then summarizes
    a legend in which Saints Sisynios and Synidoros capture the shapeshifting Gello
    and force her to reveal twelve and a half names whose knowledge protects against
    her assaults.
  language: English
