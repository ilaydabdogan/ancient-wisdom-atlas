canonical_text:
  quote: ''
  summary: The passage surveys beliefs about children born during the Christmas-to-Epiphany
    period becoming Callicantzari. It describes fire or oven treatments intended to
    neutralize them, their alleged attacks on siblings and wayfarers, competing traditions
    that identify them as either demons or humans afflicted with madness, and Lawson’s
    argument from Leo Allatius that the human-origin belief is old in Chios.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the madness associated with this form of the superstition
    is considered congenital.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children born on Christmas Day, or in some accounts between Christmas and
    Epiphany, are deemed likely to become Callicantzari.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The explanation given is that such children are punished for a mother’s conception
    and birth-giving during seasons sacred to the Mother of God; the children are
    called ἑορτοπιάσματα, translated as “feast-stricken.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In seventeenth-century Chios, children in this category were taken to a fire
    in the market-place and the soles of their feet were heated until their nails
    were singed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A modern modified treatment places the child in an oven, lights a fire outside,
    asks “Bread or meat?”, and continues if the child answers “meat,” which is taken
    to indicate a craving for human flesh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Infant Callicantzari are said to be especially prone to attack and kill their
    own brothers and sisters, giving rise to the by-name ἀδερφοφᾶδες, “brother-eaters.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Polites interprets κάηδες as a plural of Cain meaning “brother-slayers,” but
    Lawson hesitates because a longer related form appears in Carpathos and because
    in Syme the beings named κάηδες are held harmless.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Oenoë tradition calls the Callicantzari evil demons, while the Tenos tradition
    says they are not demons but men who become mad near New Year’s Day and wander
    away from home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lawson reports that on the mainland Callicantzari are most commonly considered
    demons, while in the Aegean islands they are more usually considered human.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Leo Allatius’s account, children born in the octave of Christmas are seized
    with madness, move rapidly, grow sharp nails like talons, question wayfarers with
    “Tow or lead?”, and attack those who answer “lead.”
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lawson argues that scorching the soles of the feet is not a logical way to
    prevent talons, but could be understood as preventing hoofs, which Callicantzari
    are elsewhere believed to have.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lawson concludes that the foot-scorching custom was already old in the first
    half of the seventeenth century and that the belief in children turning into Callicantzari
    was ancient in Chios.
  category: other
  evidence_refs:
  - ev:7
