canonical_text:
  quote: ''
  summary: The passage describes Greek Church doctrine about saints as intermediaries,
    popular treatment of saints as objects of worship, and a Church policy of replacing
    older Greek deities with Christian saints of similar names or functions. Examples
    include S. Dionysius and a story of the first vine and wine, S. Demetrius in relation
    to Demeter, S. Artemidos as a healer of weak children said to be struck by Nereids,
    and S. Elias as successor to Helios with hilltop chapels and a chariot associated
    with thunder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Greek Church doctrine distinguishes worship of God from honor given to angels
    and saints, who are described as intermediaries rather than independent grantors
    of petitions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says uninstructed common people accepted saints as objects of
    worship, comparable to lesser deities or heroes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Church is described as using saint worship diplomatically to supplant
    paganism by substituting Christian saints with similar names and functions for
    older gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the S. Dionysius story, the saint travels to Naxos, finds a small plant,
    digs it up, and shelters it first in a bird leg-bone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the plant grows, S. Dionysius places the bird leg-bone and plant inside
    a lion leg-bone, and later places them inside an ass leg-bone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The plant is identified as the first vine; it is planted with the bones, bears
    grapes, and wine made from it causes drinkers first to sing like birds, then become
    strong as lions, and finally foolish as asses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that S. Dionysius is treated as god of the vine and retains
    a connection with Naxos.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: S. Demetrius has an October festival celebrated with special enthusiasm among
    agricultural classes, and marriages are frequent on that day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Weakly or wasting children are said in Greek belief to have been struck by
    the Nereids, understood here as nymphs of terrestrial or marine kinds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Keos, a mother brings a wasting child to the church of S. Artemidos on
    the hill-slopes, removes the child's old clothes, puts on new clothes blessed
    by the priest, leaves the old clothes to the Church, and thanks the saint if the
    child becomes strong.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: S. Elias is associated with chapels on hilltops and with a chariot whose rolling
    wheels are sometimes said to produce thunder.
  category: setting
  evidence_refs:
  - ev:8
