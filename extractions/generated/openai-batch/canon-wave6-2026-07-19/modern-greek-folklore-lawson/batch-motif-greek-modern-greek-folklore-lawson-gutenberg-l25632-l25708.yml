  summary: The passage discusses Plato’s and Plutarch’s accounts of postmortem transformation,
    especially the transmigration of morally marked souls and the possible deification
    of purified souls. It then links an Orphic tablet’s language of death as a wedding
    and becoming a god with Platonic ideas of the soul’s deification. Finally, it
    interprets speeches on Love in Plato’s Symposium as drawing on popular religion
    and mystery hopes of blessedness, fellowship with gods, sacramental union, and
    afterlife wedded bliss.
