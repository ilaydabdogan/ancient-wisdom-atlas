canonical_text:
  quote: beings originally human have been elevated to the standing of demons
  summary: The passage argues that Greek folklore and ancient Greek religion show
    a tendency for human beings to be elevated to demon, genius, hero, or god status,
    rather than for demons to be reduced to human status. Examples given include Gello
    and the Gelloudes, Striges, and ‘Arabs’ as genii. On this basis the author concludes
    that Callicantzari were originally men who voluntarily or under madness assumed
    beast-like shape and character. The passage then turns to the origin of the name
    Callicantzaros, describing its many dialect forms, identifying the common form
    as central, and cataloguing phonetic and plural variations.
  language: English
