  text: A mock epitaph by Ausonius is presented as a parody of such funerary conceptions
    and names Persephone, Adonis, and Elysian Jupiter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain Orphic tablets are described as having been buried with the dead and
    as speaking more openly about mystic doctrines than public epitaphs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sybaris tablet speaker addresses underworld deities, claims pure origin
    and blessed race, mentions death by Fate, leaving a weary Wheel, passing to a
    desired Circle, entering under Despoina's bosom, becoming god instead of mortal,
    and the formula about a kid and milk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage summarizes the Orphic document as a claim that the dead person
    was originally pure and of the same race as the gods, became mortal, and performed
    ritual acts entitling re-admission to divine fellowship after death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The phrase about entering beneath Despoina's bosom is rendered by the author
    as admission to the embrace of Despoina, Queen of the under-world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explicitly compares the Orphic phrase with formulas from Cybele's
    rites, Sabazian mysteries, and Lucian's account of Alexander's mock-mysteries.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Villa Borghese sarcophagus relief, the god of the dead carries Kore
    down to the lower world in a chariot, while Eros flies above the horses as guide.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the same relief, the bride appears compelled, the bridegroom appears stern,
