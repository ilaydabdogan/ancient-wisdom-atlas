  quote: ''
  summary: 'The passage discusses Greek funerary epitaphs, Orphic tablets, and sepulchral
    monuments in which death is represented through bridal or initiatory imagery:
    a dead unmarried man enters Persephone''s chamber; an Orphic dead speaker claims
    purity, ritual qualification, and transformation from mortal to god; and sarcophagus
    scenes show Kore carried to the lower world, with signs of return and renewal.'
  language: English, with quoted Greek and Latin phrases
