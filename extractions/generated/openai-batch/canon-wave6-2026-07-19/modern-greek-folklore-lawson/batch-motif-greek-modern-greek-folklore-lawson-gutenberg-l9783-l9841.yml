  summary: The passage discusses the Greek term στοιχεῖον and related words as referring
    to genii or spirits attached to particular places, objects, or natural domains.
    It describes medieval uses involving magical settlement or restraint of such spirits,
    examples involving Apollonius of Tyana, talismanic objects and city-protective
    devices in Constantinople, and modern Greek remnants of the terminology for objects
    haunted by genii.
  language: English
