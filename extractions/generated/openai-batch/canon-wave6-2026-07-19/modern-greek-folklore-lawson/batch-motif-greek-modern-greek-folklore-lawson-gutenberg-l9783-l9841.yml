  text: The passage says ancient Greek deities could be understood as local occupants
    of prescribed domains, giving Poseidon as connected with the sea and Demeter with
    corn-land; lesser deities are described as tied to particular spots.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The verb στοιχειοῦν is described as properly meaning to settle a genius in
    a particular place, either as a beneficent tutelary deity or as an evil genius
    whose range is confined.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The adjective στοιχειωματικός is described as applying to people dealing with
    genii or familiar spirits, and more vaguely to wizards; Apollonius of Tyana is
    cited as such a figure.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Apollonius is said to have been summoned to Byzantium and to have charmed
