canonical_text:
  quote: ''
  summary: The passage argues that Euripides’ personified Death in the Alcestis resembles
    modern Greek folk-song Charos in speech, function, and warrior presentation; that
    Greek Anthology epigrams also present Charon as an active seizer of the dead;
    and that Etruscan depictions of Charun support an older conception of Charon/Charos
    as an armed god or lord of death rather than merely a ferryman.
  language: English
  quote_policy: summarized
