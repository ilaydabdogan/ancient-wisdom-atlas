  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that in the Greek Anthology Charon sometimes acts beyond
    the role of ferryman by seizing men and carrying them to the nether world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Anthology epigram addresses Charon as insatiable and asks why he snatched
    Attalus away in youth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
