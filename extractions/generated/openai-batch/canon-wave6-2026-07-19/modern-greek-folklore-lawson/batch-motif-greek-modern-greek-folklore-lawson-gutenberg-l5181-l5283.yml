canonical_text:
  quote: the Fates invariably visit each child that is born in order to decree its
    lot
  summary: 'The passage describes modern Greek beliefs in the three great Fates and
    in lesser personal Fates attached to individual lives. It cites songs and incantations
    that address Fate, summon the Fates from Olympus or heavenly heights, and distinguish
    the supreme Fates from an individual’s own Fate. Lawson argues for continuity
    with ancient Greek conceptions: a triad of old female Fates assigns good and ill
    at birth, bears attributes such as book, spindle, and cutting instrument, and
    retains the functions associated with Clotho, Lachesis, and Atropos.'
  language: English with Greek quotations
