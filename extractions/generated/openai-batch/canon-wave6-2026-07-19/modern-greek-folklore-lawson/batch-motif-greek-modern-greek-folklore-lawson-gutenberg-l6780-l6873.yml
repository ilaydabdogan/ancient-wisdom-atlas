canonical_text:
  quote: ''
  summary: The passage describes the Lamiae as a class of female monsters in modern
    Greek folklore, often confused with Empusa and Mormo because all prey upon children.
    It gives their monstrous features, habits, dwellings, links with dragons and treasure,
    a local story of the rich Lamia Mora, their use as child-frightening figures,
    and an asserted continuity with classical traditions of Lamia, Empusae, and related
    child- or flesh-eating beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three classes of female monsters are said to have been repeatedly confused
    since the early Middle Ages because they share a propensity to prey upon young
    children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lamiae are described as hideous, gigantic, coarse-looking female monsters
    with strange deformities of the lower limbs, including dissimilar or extra feet
    and bronze or animal-like feet.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tradition from Koropíon says that a Lamia shot by a peasant measured three
    fathoms, and that no grass grew where her blood dripped after her body was cast
    into a desert plain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lamiae are characterized as bloodthirsty, unclean, gluttonous, and stupid.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Folk-tales present Lamiae as usually mated with dragons and dwelling in caverns
    and desert places.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Examples of Lamiae's stupidity include poor sweeping, wrong bread-making,
    and feeding hay to dogs and bones to horses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lamiae are also said sometimes to show gratitude to people who help them out
    of difficulties caused by their ignorance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Athenian tradition describes a rich Lamia called Mora who walked at night,
    seized and crushed men, but would promise life and wealth if a victim snatched
    her head-dress and she wanted it returned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that many peasants chiefly know Lamiae as eaters of human
    flesh who especially prey on newborn infants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A popular phrase for a child who died suddenly is translated as 'the Child
    has been strangled by the Lamia.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author says that fear of Lamiae has mostly declined, though one cave near
    Kephalóvryso in Aetolia was still somewhat dreaded and avoided.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: In many places the Lamia survives as a figure in folk-story adventures, as
    a threat used by mothers against naughty children, or as a term of abuse among
    women.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The word Lamia is said to have survived nearly unchanged, with local by-forms,
    from ancient to modern usage.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: Classical tradition is summarized as making Lamia a queen of Libya loved by
    Zeus; Hera then robbed her of all her children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After losing her children, the queen Lamia is said to have lived in a grim
    lonely cavern, changed into a malicious greedy monster, and stolen and killed
    other mothers' children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Philostratus is cited as saying that Empusae were commonly called Lamiae and
    Mormolykiae, and that they desired love but desired human flesh even more, using
    love to decoy victims.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Apuleius is cited for a story in which two Lamiae, avenging a slight to one
