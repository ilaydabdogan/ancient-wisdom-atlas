  summary: The passage discusses the semantic development of Greek ἀλάστωρ / Alastor
    from a term meaning “wanderer” to a designation for a revenant and then for an
    avenging revenant. It cites Homeric usage as a proper name, tragic usage in Aeschylus
    and Euripides, Clytemnestra’s ghost-like appeal for vengeance, the post-mortem
    wandering of murderers and victims, and the wandering misery of the unburied dead.
  language: English
