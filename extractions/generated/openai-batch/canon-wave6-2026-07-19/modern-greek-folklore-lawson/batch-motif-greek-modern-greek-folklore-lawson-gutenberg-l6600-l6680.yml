canonical_text:
  quote: ''
  summary: The passage quotes and analyzes a Chian belief about three white-clad female
    figures near a tower who lure passers-by toward a river with visible gold and
    silver cups, exposing them to drowning in a whirlpool. It then discusses a feared
    mountain goddess called “good,” for whom women mark doors with crosses on May
    1, and whom the author identifies with the beautiful lady or queen of the mountains.
    The author distinguishes this nymph-escorted mountain goddess, interpreted as
    a modern Artemis figure, from a solitary mountain goddess linked to Demeter and
    Kore traditions. The passage closes with accounts of reverence, punishment, gifts,
    and offerings to appease the goddess and her train, including crossroads offerings
    compared to Hecate’s banquets.
  language: English
  quote_policy: summarized
