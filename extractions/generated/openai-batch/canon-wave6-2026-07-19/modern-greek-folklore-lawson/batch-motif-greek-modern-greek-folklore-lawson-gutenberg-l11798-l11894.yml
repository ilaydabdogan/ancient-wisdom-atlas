  quote: ''
  summary: The passage discusses two Greek lines about lofty trees called precincts
    of immortals and not cut by mortals. Lawson argues that the lines do not call
    each tree the precinct of an immortal nymph; rather, groups of trees, each inhabited
    by a nymph, may collectively form the precinct of an immortal god. A sanctuary
    of Artemis surrounded by trees harboring attendant nymphs is given as an example.
    A footnote adds that some districts hold a Nereid to be safer when seen first
    than when seeing first, comparing this with an ancient belief about wolves.
