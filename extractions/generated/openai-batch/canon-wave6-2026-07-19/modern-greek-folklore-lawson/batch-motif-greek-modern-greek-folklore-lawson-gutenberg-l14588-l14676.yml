canonical_text:
  quote: "‘We thought things over and decided to send a man to St Nicolas to ask him
    that our ships might prosper in the war.’"
  summary: Lawson discusses a peasant story in which a man was allegedly sacrificed
    as a messenger to St Nicolas for wartime success at sea. The passage identifies
    the victim as a messenger, notes uncertainties about a buried hall and an appearance
    of God with a torch, argues that the conception derives from native oral tradition,
    situates it among Greek practices of divine-human communication, and compares
    it with the sacrifice at Aulis.
  language: English
  quote_policy: quoted
