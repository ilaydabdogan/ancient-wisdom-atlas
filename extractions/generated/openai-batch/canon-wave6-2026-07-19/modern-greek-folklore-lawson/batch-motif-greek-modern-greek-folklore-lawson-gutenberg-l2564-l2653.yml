canonical_text:
  quote: ''
  summary: The passage gives examples of healing by sleeping in churches, including
    a sailor cured at Tenos after hearing a voice and seeing a radiant woman, and
    a woman cured at Scyros after a vision of S. George. It then generalizes the practice
    as a survival or continuation of older healing-sanctuary customs, and discusses
    broader blending of Greek Christian worship with pagan institutions, deities,
    funeral conceptions, vows, offerings, priests, and witches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Tenos, some patients are said to have stayed in the church for months;
    one sailor with a paralytic seizure was there for four months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sailor fell asleep around midday at Easter and heard a voice bidding him
    to rise; when he asked who had called, those nearby said no one had.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the third occurrence, the sailor saw a woman described as beautiful and
    brilliant entering the church; he rose, walked, and joined the festival procession
    that day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Scyros, a man from Euboea had brought his wife to the church of S. George
    for seven consecutive years to sleep in for forty days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband and wife both saw a vision of S. George laying his hand on her
    head; in the morning she woke sane.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author says that in some districts a mother passing the night with a sick
    child in the village church is among the common remedies for childish ailments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the cited churches have succeeded to the reputation
    once possessed by Epidaurus and are scenes of faith-cures.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author lists other pagan institutions harboured by the Greek Church, including
    an oracle in a Christian chapel, sacrifice and omen-reading at a church festival,
    and ancient mysteries surviving in Good Friday and Easter celebrations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In funeral dirges, the lower world is described as ruled by Charon rather
    than by God or the Devil, and as the destination of all people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author says the Church used older holy sanctuaries, permitted or adopted
    older methods of approaching gods, appropriated shrines of gods to saints, and
    did not suppress the ejected deities altogether.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author describes peasants as making prayer, vow, and offering to both
    Christian and pagan deities, either to avert wrath or to win kindness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Priests and witches are described as professed prophets of different sorts
    and as endowed with kindred powers.
  category: relationship
  evidence_refs:
  - ev:7
