  quote: The maiden was to be sacrificed to the _genii_ of Mount Ithome to ensure
    the stability of the new fortifications.
  summary: The passage argues that ancient and modern Greek beliefs connect local
    genii, foundation rites, serpent or dragon guardian forms, and human sacrifice.
