canonical_text:
  quote: ''
  summary: 'The passage collects hostile Christian-era statements by Eusebius, Clement
    of Alexandria, and Synesius about pagan mysteries, emphasizing accusations of
    sexual impurity, incest, divine marriages, divine procreation, death-laments,
    drunkenness, and secret nocturnal acts. The author then rejects two explanations
    for these accusations: that Christian writers merely confused public and private
    mysteries, or that they blamed the rites for later misconduct by participants.
    The passage concludes that the accusations must have attached to doctrines taught
    in the mysteries or to dramatic representations used to teach them.'
  language: English
  quote_policy: summarized
