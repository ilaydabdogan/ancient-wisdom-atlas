    mountain tribe defeated or expelled by Lapithae and related heroes, while later
    tradition and modern folklore raise questions about their status as beasts, demons,
    or transformed humans. It also cites Ridgeway’s ethnological explanation of Centaurs
    as an older mountain people associated with Chiron, fosterage, wizardry, and raids.
