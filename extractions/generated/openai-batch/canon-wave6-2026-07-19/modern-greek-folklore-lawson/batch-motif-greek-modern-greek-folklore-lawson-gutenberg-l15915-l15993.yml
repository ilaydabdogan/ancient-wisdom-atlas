canonical_text:
  quote: ''
  summary: 'The passage reports Allatius''s and Father François Richard''s statements
    about incorrupt corpses or vrykolakes: their physical condition, alleged diabolical
    animation, harmful activity among the living, and clerical or communal responses
    such as exorcism, heart removal, and burning. It also summarizes island examples
    from Chios, Santorini, Astypalaea, Ios, Siphanto, and Amorgos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Allatius states that incorrupt bodies are sometimes found in graves and that
    the Devil may use them, if God permits, to harm human beings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Allatius advocates burning such bodies, with prayers accompanying the burning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Allatius cites witnesses for non-decomposition and says he himself saw an
    opened tomb at the church of St Antony in Chios containing a whole corpse above
    other bones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Chios corpse is described as unusually tall, naked because its clothes
    had perished, with distended hard livid swollen skin, dark curly facial hair,
    outstretched arms, open hands, closed eyelids, gaping mouth, and white teeth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Father François Richard reports that the Devil works by dead bodies as well
    as living sorcerers, animates and preserves dead bodies, and appears with the
    face of the dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Richard's account, the animated dead traverse streets and open country,
    enter houses, and cause horror, speechlessness, death, violence, loss, and terror.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Richard says priests, with the bishop's permission, employ exorcism and assemble
    on Saturday because vrykolakes rest in the grave that day and cannot move abroad.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A suspected body found whole, fresh, and full of blood is taken as serving
    as an instrument of the Devil; exorcisms continue until the body decomposes and
    loses its color and fullness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When exorcisms fail, the heart is torn out and cut to pieces, and the whole
    body is burned to ashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Richard reports bodies burned at Astypalaea, Ios, and Siphanto after post-burial
    appearances or harmful activity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Santorini, the shoemaker Alexander of Pyrgos is said to have become a vrykolakas,
    frequented his house, mended his children's shoes, drew water, cut wood for his
    family, and then disappeared after exhumation and burning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Amorgos, vrykolakes are said to have been seen by night and in daylight,
    five or six together in a field, apparently feeding on green beans.
  category: action
  evidence_refs:
  - ev:8
