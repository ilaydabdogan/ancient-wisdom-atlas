canonical_text:
  quote: There are they burning dead men’s bones, the bones of valiant warriors
  summary: A ballad about the exile of Parga describes lamentation, departure from
    homeland, and the burning of dead warriors’ bones to prevent desecration by enemies.
    Lawson interprets this act as a loving and respectful cremation meant to secure
    dissolution and repose for the dead, and compares it with cremation of suspected
    vrykolakes as a merciful alternative to impalement.
  language: English
  quote_policy: quoted
