canonical_text:
  quote: "“Christianity, as understood by the masses, became polytheistic on its own
    account.”"
  summary: The passage argues that Christianity changed Greek ethical life more than
    it illuminated ancient Greek moral conduct, but in matters of religion it met
    a more complex competition with pagan polytheism. Pagans were portrayed as willing
    to include Christ among their gods, while Christians sought to discredit the old
    gods as demons. The author compares this possible demotion of gods to the earlier
    defeat of the Titans by Olympian Zeus, but says a complete demonization of Greek
    gods did not occur because Greek religious tolerance and the lack of Christian
    replacements encouraged continued propitiation of the old gods. The passage ends
    by stating that popular Christianity itself became polytheistic.
  language: English
  quote_policy: quoted
