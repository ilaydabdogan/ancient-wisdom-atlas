canonical_text:
  quote: ''
  summary: The passage discusses Greek beliefs and practices concerning burial when
    a corpse is unavailable, the ritual purpose of bodily dissolution or 'loosing,'
    the distinction between natural decay and religiously effected dissolution, the
    danger of an unburied corpse being eaten by animals, and the author's hypothesis
    that cremation and inhumation could both serve the same religious end, sometimes
    in ceremonial reduced form. It also summarizes an argument that inhumation was
    associated with Pelasgian practice and cremation with Achaean practice, while
    both rites continued in Greece with convergent religious meaning.
