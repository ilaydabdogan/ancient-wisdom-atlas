canonical_text:
  quote: ''
  summary: The passage discusses funeral lamentation in ancient and modern Greek usage,
    especially mourners using a current funeral to mourn their own dead. It argues
    that a living funeral custom helps reconstruct an older belief that the newly
    dead can carry messages to those already in the world below. It then introduces
    Herodotus’ account of the Getae, who periodically kill a chosen messenger to carry
    requests to the god Zalmoxis, while noting that certainty about a causal link
    between messenger-belief and human sacrifice is not possible from the ancient
    evidence.
  language: English
  quote_policy: summarized
