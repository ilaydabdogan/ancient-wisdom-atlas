literal_observations:
- id: obs:1
  text: Near friends and relatives assemble in the evening after the funeral, or on
    several evenings thereafter, for another funeral-feast called the παρηγορία or
    'comforting,' held in the house of the nearest relative.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The evening funeral-feast is described as chiefly consoling the bereaved;
    guests bring food and wine, while the host provides accommodation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before the guests arrive, a special portion of food is often sent to the grave;
    the passage says two meals are provided for the dead on the first day beneath
    the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Food offerings may include bread, cheese, olives, inferior caviare, pilaf,
    and other non-meat foods, but the most generally approved item is a flat cake
    spread with honey, called ψυχόπηττα or 'soul-cake.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage cites ancient comparanda: jars of honey on the pyre of Patroclus
    and Aristophanes'' mention of a funeral honey-cake.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Where fully observed, food is provided for the dead on the third, sixth, ninth,
    and fortieth days; at later monthly intervals; and on three anniversaries, with
    the third anniversary often being the exhumation day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In less extended village practice, observance may be limited to the third,
    ninth, and fortieth days and the first anniversary; the passage says this minimum
    corresponds to the days recommended by St Anastasius.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Church is said to be responsible for the name μνημόσυνα or 'memorial-feasts,'
    while the passage says the older purpose included securing forgiveness or revocation
    of curses and ministering to the dead person's bodily needs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Food not consumed by the company or priests, but actually left on the grave,
    is described as intended as nourishment for the interred dead body.
  category: action
  evidence_refs:
  - ev:4
