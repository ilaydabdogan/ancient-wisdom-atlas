canonical_text:
  quote: ''
  summary: The passage argues that Callicantzari were once imagined as human-shaped
    beings able to transform into complete human or animal forms, and that later hybrid
    depictions may preserve a lost belief in metamorphosis. It applies this proposed
    principle cautiously to Athene as possibly once owl-faced because she formerly
    manifested as an owl, with an analogy to the Holy Ghost as dove. It then summarizes
    conflicting evidence about whether Callicantzari are demons from the lower world
    or men afflicted by recurrent Christmas bestial madness.
  language: English
  quote_policy: summarized
