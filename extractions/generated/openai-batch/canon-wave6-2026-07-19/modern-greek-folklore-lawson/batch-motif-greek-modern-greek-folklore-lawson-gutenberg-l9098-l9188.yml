canonical_text:
  quote: ''
  summary: The passage discusses ass-centaurs, Satyrs, Sileni, Centaurs, Callicantzari,
    and Lycocantzaroi. It argues that ancient half-human, half-animal monsters contributed
    to modern Greek ideas of the Callicantzari, and explains Lycocantzaros as a werewolf
    or lycanthrope. It also describes lycanthropy as both a persistent belief and
    a form of madness involving imagined transformation into a wolf or wild animal
    and craving for human flesh.
  language: English, with Greek terms
  quote_policy: summarized
