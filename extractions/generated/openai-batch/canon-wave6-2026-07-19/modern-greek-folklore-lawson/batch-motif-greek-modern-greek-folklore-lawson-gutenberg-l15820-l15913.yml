canonical_text:
  quote: "“The vrykolakas ... is the body of a man of evil and immoral life.”"
  summary: The passage introduces Greek vrykolakas lore through seventeenth-century
    accounts and later survivals, notes Santorini’s reputation for treating vampire
    bodies, distinguishes the Greek term from the broader word “vampire,” and quotes
    accounts in which an incorrupt dead body is animated by the Devil, harms the living
    by calling, appearing, or throttling them, and is destroyed by burning with priestly
    rites.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Seventeenth-century writers are said to provide the best accounts of the superstition
    and the violent practices connected with it; in the author’s present day the superstition
    persists but violent outbreaks are comparatively rare.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Santorini is described as having an enduring reputation concerning vampires,
    and two recent stories end with a vampire’s body being sent there for effective
    treatment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Greek name βρυκόλακας is transliterated as vrykólakas, and the author
    treats “vampire” as a near but inexact equivalent while distinguishing the Greek
    form from the Slavonic form.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Allatius describes the vrykolakas as the body of an evil or immoral man, often
    excommunicated, which does not decompose but becomes swollen, tough-skinned, and
    drumlike.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Allatius’ account, the Devil enters such a body, which issues from the
    tomb chiefly at night, knocks at doors, and calls a member of the household.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the person called answers, that person dies the next day; because the vrykolakas
    never calls twice, inhabitants of Chios wait for a second call before replying
    at night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The monster is also said to appear in daytime, even at noon, and to kill people
    by its mere aspect without speech or touch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When unexplained sudden deaths occur, tombs are opened; if such a body is
    found, it is removed, priests recite prayers, and the body is burned to ashes
    on a pyre.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The cited church ordinance says the Devil causes portents in which the known
    dead seem to come and speak, appear in dreams, stand or walk in the road, and
    even throttle men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the ordinance’s account, people dig up the grave, see a long-buried body
    with flesh, blood, nails, and hair, collect wood, burn the body, and are told
    to summon priests for invocations and memorial services.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
