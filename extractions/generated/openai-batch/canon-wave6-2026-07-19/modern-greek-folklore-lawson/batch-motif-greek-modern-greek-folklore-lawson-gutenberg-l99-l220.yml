literal_observations:
- id: obs:1
  text: 'The passage identifies the work as Modern Greek Folklore and Ancient Greek
    Religion: A Study in Survivals by John Cuthbert Lawson, published at Cambridge
    in 1910 and dedicated to R. A. Neil.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lawson states that the book resulted from work undertaken in Greece during
    his Craven Studentship from 1898 to 1900.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The originally proposed research scheme was to investigate customs and superstitions
    of modern Greece in their possible bearing on ancient Greek life and thought.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lawson says that successful research first required readiness in speaking
    and understanding the popular language; he practiced in cafés and later followed
    conversations not intended for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lawson names books by Bernhard Schmidt and Professor Polites as works that
    supplied him with a working knowledge of the subject and suggested research directions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lawson rejects a formal questionnaire method and says a peasant who believes
    and observes local superstitions and customs may be silenced by the sight of a
    notebook.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lawson describes weddings, funerals, local fêtes, village-church visits, and
    dedicated offerings as occasions that may prompt explanations of customs or stories
    of supernatural seizure and miraculous cure.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lawson gives the example of a cave observed in a mountain-side; a desire to
    visit it may lead to dissuasion and an account of fearful beings haunting it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Lawson gives the example of a guide crossing himself or spitting before fording
    a stream, after which the researcher may ask about the danger at that spot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Lawson says that if a mule rolls with baggage in a stream, the muleteer’s
    imprecations may suggest conceptions of the future life.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Lawson says local patriotism, pride, or hinted gifts may elicit stories or
    corroboration; he adds that witches and professional reciters of folk-tales and
