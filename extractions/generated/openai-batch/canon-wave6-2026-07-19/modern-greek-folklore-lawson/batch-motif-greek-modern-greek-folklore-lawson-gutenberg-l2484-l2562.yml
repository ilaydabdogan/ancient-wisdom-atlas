literal_observations:
- id: obs:1
  text: A church near Volo in Thessaly is described as the site of an annual miracle
    performed by priests on the Friday after Easter, drawing people from all Thessaly.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the east end of the church, an exterior tank fills with water that the
    passage says derives from a hole in the church foundations and can be supplied
    from cisterns under the church floor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The crowd seeks a cupful of muddy liquid regarded as miraculously fertilizing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women drink the water, while men carry it home and sprinkle drops on cornfields
    or vineyards.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Tenos, an official account of the wonder-working icon of the Annunciation
    is said to claim forty-four miracles by 1898, including cases of mental derangement,
    blindness, paralysis, and a fish bone coughed up at first sight of the icon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pilgrims come in thousands to healing centers, bringing the maimed, halt,
    blind, and deformed for possible healing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sick are laid to sleep in the church or precincts, carried where the icon's
    shadow may fall during procession, and sprinkled with water from the holy spring.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Most pilgrims depart uncured, though the author states that a few cures occurred
    and specifically accepts the restoration of a boy's sight at Tenos in 1899.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The dead are reported to have been brought from neighbouring islands, but
    the icon is said not to have raised them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The practice of sleeping in the sanctuary for healing is named ἐγκοίμησις
    and identified as an old pagan practice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the night before the Tenos festival, the church floor and much of the courtyard
