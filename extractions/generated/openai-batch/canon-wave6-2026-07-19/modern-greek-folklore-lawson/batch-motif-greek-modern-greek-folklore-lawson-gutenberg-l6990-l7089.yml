  quote: ''
  summary: The passage distinguishes Striges from Lamiae and Gelloudes, describing
    them as women or old women with the power to become birds, winged things, or other
    animals, especially in nocturnal attacks on infants. It surveys Latin, Byzantine,
    early modern, and modern Greek accounts of Striges as blood-sucking or organ-devouring
    child attackers, notes protective practices against them, and discusses possible
    Italian origins and parallels in Albanian and Corsican terminology.
  language: English
