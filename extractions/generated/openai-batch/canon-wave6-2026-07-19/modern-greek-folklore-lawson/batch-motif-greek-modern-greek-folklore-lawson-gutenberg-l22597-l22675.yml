canonical_text:
  quote: ''
  summary: The passage contrasts Achaean and Pelasgian conceptions of afterlife, arguing
    that Greek eagerness for bodily dissolution in funeral rites is intelligible only
    where dissolution leads to hoped-for bliss. It interprets Pindar’s depiction of
    the righteous dead enjoying horses, games, music, flowers, fruits, and sweet odors
    as implying some continued bodily existence. It further compares ideals of postmortem
    condition with conceptions of deity in Buddhist, Christian, Socratic, and ordinary
    Greek examples, concluding that Greek hopes of bliss would require survival of
    both body and soul.
  language: English
  quote_policy: summarized
