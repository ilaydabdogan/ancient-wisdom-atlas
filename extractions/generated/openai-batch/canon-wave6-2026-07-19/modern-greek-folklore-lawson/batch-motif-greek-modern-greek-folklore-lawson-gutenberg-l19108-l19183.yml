canonical_text:
  quote: ''
  summary: The passage distinguishes religious pollution from personal injury in homicide,
    then discusses the murdered dead as an avenger who may keep the murderer polluted
    and isolated. It uses Aeschylus’ Choephori to describe penalties threatened against
    Orestes and already due to Clytemnestra, interpreting them as popular beliefs
    about a murdered person rising bodily from the grave to punish an enemy. The direct
    punishment is represented as leprous blains, but the author argues this literary
    form substitutes for a cruder popular image of a revenant attacking, biting, and
    drinking the life-blood of the murderer, with an explicit comparison to a Slavonic
    vampire.
  language: English
  quote_policy: summarized
