canonical_text:
  quote: ''
  summary: 'The passage interprets Aeschylus'' punishments for the blood-guilty murderer
    as talionic vengeance grounded in popular belief: mental terror, wandering as
    an outcast, death, and postmortem deprivation of funeral rites with incorruptibility.
    It links the dead victim as a revenant, Plato''s account of an old tradition,
    and the Furies'' pursuit of Orestes, including Clytemnestra''s ghost urging them
    to dry or shrivel the murderer and their binding spell at Athene''s altar.'
