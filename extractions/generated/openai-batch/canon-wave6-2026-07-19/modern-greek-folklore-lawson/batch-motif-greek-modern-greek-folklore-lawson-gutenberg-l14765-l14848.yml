  quote: "“he is collecting letters for the dead”"
  summary: The passage describes modern Greek funeral customs in which mourners treat
    funerals as occasions for communicating with the dead. Messages may be included
    in dirges or whispered to the newly deceased, who is treated as able to carry
    them to other departed persons. The passage also describes ritual lamentation,
    self-laceration, professional mourners, ordered seating around the corpse, and
    the idea that mourning and burial are both necessary rites for the dead.
