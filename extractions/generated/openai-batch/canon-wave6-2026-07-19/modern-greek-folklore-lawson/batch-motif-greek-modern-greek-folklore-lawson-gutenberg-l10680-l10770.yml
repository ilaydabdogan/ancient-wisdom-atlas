  evidence_refs:
  - ev:8
  confidence: high
  cautions: The class is explicitly described as vague and difficult to delimit.
- id: motif:6
  label: Post-mortem ascent through aerial customs-houses
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: The soul after death is believed to voyage upward from earth to God and encounter
    the scrutiny of aerial customs-officers or custom-houses.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage describes scrutiny but does not elaborate the stages, criteria,
    or outcome of the afterlife journey.
- id: motif:7
  label: Dead golden-age humans become air-clothed guardian daemons
  taxonomy_refs: []
  basis: The passage reports Hesiod’s account that the first race of humans became,
    after death, daemons clothed in air and guardians of mortals.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is presented as Hesiodic theology used for comparison, not necessarily
    as the modern popular form.
comparison_claims:
- id: claim:1
  claim: The Tenos stories of Jack obtaining immortal water or fruit from dragon-guarded
    places share a story pattern with Heracles’ journey to the Hesperides for golden
    apples and his victory over the guardian-dragon Ladon.
  claim_level: same_motif
  target: Ancient fable of Heracles, the Hesperides, the golden apples, and Ladon
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage itself cautions that direct lineage between the modern
    stories and the ancient fable is less certain.
- id: claim:2
  claim: The author proposes that both the Heracles version and the modern Jack versions
    may derive from an older fairy-tale form in which wonderful fruit is carried off
    from a dragon’s custody.
  claim_level: common_inheritance
  target: Hypothesized older Greek fairy-tale form preceding both Heracles and modern
    Jack versions
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: This is explicitly presented as the author’s probability judgment,
    not as demonstrated historical proof in the passage.
- id: claim:3
  claim: Modern aerika are compared with Hesiodic daemons clothed in air, but the
    passage stresses that modern aerial genii are not necessarily beneficent and may
    possess people.
  claim_level: same_function
  target: Hesiodic daemons of the air who were spirits of golden-age humans and guardians
    of mortals
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is broad; the passage notes significant difference in
    moral character and behavior between Hesiod’s good guardians and modern popular
    belief.
- id: claim:4
  claim: Telonia are characterized as a Christian by-product with an accretion of
    pagan superstition, linked to the belief in post-mortem aerial scrutiny of the
    soul.
  claim_level: historical_contact
  target: Christian popular theology with pagan superstition concerning the soul’s
    afterlife passage
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives a characterization of origin but does not detail
    specific Christian or pagan source texts for the belief.
