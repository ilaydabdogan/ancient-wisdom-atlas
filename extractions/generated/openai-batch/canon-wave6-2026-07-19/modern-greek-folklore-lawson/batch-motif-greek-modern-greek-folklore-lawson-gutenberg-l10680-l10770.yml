canonical_text:
  quote: ''
  summary: The passage summarizes a Tenos fairy-tale in which Jack, after fleeing
    danger with his mother, defeats dragons in a castle, is later betrayed by his
    mother and a surviving dragon, and is sent to obtain immortal water and then immortal
    fruit or herb from dragon-guarded places. The author compares this pattern with
    Heracles’ quest for the golden apples of the Hesperides and the dragon Ladon.
    The passage then discusses aerial genii, including broad modern beliefs about
    aerika and the more specific Telonia, imagined as aerial customs-houses or customs-officers
    encountered by the soul after death.
  language: English
  quote_policy: summarized
