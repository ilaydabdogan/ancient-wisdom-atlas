candidate_motifs:
- id: motif:1
  label: Dragon-guarded immortal water and fruit
  taxonomy_refs: []
  basis: The passage explicitly states that dragons guard gardens containing immortal
    waters or immortal fruit and narrates quests to obtain these substances.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not specify whether the dragon guardians are serpentine
    dragons, ogres, or another type beyond the word dragons.
- id: motif:2
  label: Hero sent on perilous quest by treacherous mother and supernatural lover
  taxonomy_refs:
  - mystical_quest
  basis: The queen and surviving dragon conspire to kill the prince by feigning illness
    and sending him to procure supernatural substances from dragon-guarded places.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is broad; the passage frames the quests as fairy-tale
    episodes rather than a formally named mystical quest.
- id: motif:3
  label: Supernatural guide instructs hero how to overcome guardians
  taxonomy_refs: []
  basis: A witch or personified Fortune tells the prince where to go and how to deal
    with the dragons guarding the immortal water.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The guide appears only briefly and only in relation to the water episode
    in this passage.
- id: motif:4
  label: Heroic taking of wonderful fruit from a dragon’s custody
  taxonomy_refs:
  - sacred_theft
  basis: The author describes the Heracles version as the exploit of bearing off wonderful
    fruit from the custody of a dragon and relates it to the Tenos stories of immortal
    fruit guarded by dragons.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The Tenos summary emphasizes obtaining or circumventing guardians rather
    than explicitly describing theft; the taxonomy reference is therefore cautious.
- id: motif:5
  label: Vague aerial spirits that possess humans
  taxonomy_refs: []
  basis: Aerika are described as vague apparitions, and genii of the air are said
