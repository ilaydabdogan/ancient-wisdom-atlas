canonical_text:
  quote: ''
  summary: 'The passage describes Maniote beliefs underlying vendetta: a murdered
    man cannot rest until avenged, may arise as a vrykolakas, and places a duty of
    vengeance on his nearest kin. It then compares this doctrine with the motives
    attributed to Orestes in Euripides and Aeschylus, including fear of a dead father’s
    wrath, and discusses Agamemnon’s mutilated corpse as a reason the dead man cannot
    execute vengeance himself. The passage concludes that this conception also informed
    Attic and Platonic law concerning blood-guilt.'
  language: English
  quote_policy: summarized
