canonical_text:
  quote: ''
  summary: The passage argues that the Greek term vrykolakas retains, in some local
    usages, an older sense of were-wolf applied to living persons, while in common
    modern usage it more often denotes a resuscitated corpse resembling the Slavonic
    vampire. It cites reports from Mytilene, Thessaly and Epirus, Cyprus, and Aetolia-Acarnania,
    including stories where night watchers wound a vrykolakas and the next day a villager
    bears the corresponding wound, and cases where children are accused of being vrykolakes
    responsible for sibling deaths. The author concludes that Greek vampire-like belief
    was likely native in part and modified by Slavonic influence.
  language: English
  quote_policy: summarized
