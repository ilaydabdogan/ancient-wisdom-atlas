canonical_text:
  quote: ''
  summary: The passage discusses modern Greek beliefs about building-site genii and
    foundation victims, including cases where the victim is understood to become the
    guardian spirit. It links this interpretation to the verb στοιχειόνω, cites examples
    involving the Bridge of Arta, church guardians, and a Suidas notice about a dragon
    and sacrificed maidens at St Mamas, then compares the belief with Balkan and Slavonic
    practices while arguing for continuity with Homeric material about the Achaean
    wall destroyed after sacrifice was omitted.
  language: English with Greek terms and quotations
  quote_policy: summarized
