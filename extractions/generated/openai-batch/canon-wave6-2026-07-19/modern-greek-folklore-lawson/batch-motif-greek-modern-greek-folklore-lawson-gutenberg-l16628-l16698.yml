  text: The word vrykolakes is described as first meaning were-wolves and later denoting
    vampires and revenants, displacing older Greek names for more harmless revenants.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the Greek element in the superstition is belief in
    the incorruptibility and reappearance of dead persons under special conditions,
    while the imported Slavonic element is belief that resuscitated dead persons are
    necessarily predatory vampires.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Slavonic vampire is said to direct violence first against nearest kin;
    the same trait is said to be pronounced in the modern Greek vrykolakas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A proverb says that the vrykolakas begins with his own beard; the passage
