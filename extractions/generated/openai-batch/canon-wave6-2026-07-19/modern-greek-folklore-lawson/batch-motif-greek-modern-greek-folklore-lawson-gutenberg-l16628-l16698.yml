    appears bald and beardless.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dead man who became vrykolakas is described as returning to devour his own
    kinsfolk first, then acquaintances and fellow-villagers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Popular curses pray that a person may be withheld from corruption after death
