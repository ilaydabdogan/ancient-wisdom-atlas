canonical_text:
  quote: The man whose body does not decompose is necessarily a revenant.
  summary: The passage explains a shift in Greek revenant nomenclature toward vrykolakas,
    distinguishes a Greek belief in incorrupt dead persons who reappear from an imported
    Slavonic predatory-vampire element, describes the vrykolakas as attacking kin
    first, and lists popular and ecclesiastical curses wishing postmortem incorruptibility,
    rejection by the earth, and return from the grave.
  language: English with Greek terms and curse formulas
  quote_policy: quoted
