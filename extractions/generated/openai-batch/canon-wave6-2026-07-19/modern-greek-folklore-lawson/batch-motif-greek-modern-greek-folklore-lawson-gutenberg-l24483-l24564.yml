  summary: 'The passage argues that the mysteries may have promised initiated humans
    future divine wedlock and that Christian critics such as Clement could misrepresent
    this as sexual immorality. It then compares modern Greek Holy Week and Easter
    with the Eleusinian or related pagan mysteries: both are spring festivals connected
    with death and reawakening, fasting, dramatic rites, nocturnal services, torch
    processions, and agricultural hopes for crop growth.'
