canonical_text:
  quote: ''
  summary: The passage argues against a purely degrading interpretation of the Greek
    pharmakos rite. It reports a vulgar Athenian view in which expelling a pharmakos
    purifies the city, but proposes that the ritual originally sanctified the victim
    as a purified messenger from humans to the gods. It discusses ash-scattering,
    burning, and mutilation as precautions against vengeance by the dead, compares
    a modern Santorini story with ancient maschalismos, and frames sacrifice and divination
    as forms of communion between gods and humans.
  language: English
  quote_policy: summarized
