  summary: The passage contrasts popular Greek belief that an undecayed corpse is
    a revenant with Orthodox Church doctrine that incorruptibility may result from
    curse or excommunication. It describes absolution as loosing the body into decay
    and freeing the soul, and explains this through ecclesiastical authority, Greek
    binding/loosing vocabulary, and a nomocanon on excommunicated persons.
