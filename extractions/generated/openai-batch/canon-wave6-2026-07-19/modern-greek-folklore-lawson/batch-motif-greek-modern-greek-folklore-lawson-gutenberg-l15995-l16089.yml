canonical_text:
  quote: ''
  summary: 'The passage reports several Greek revenant and incorrupt-corpse cases:
    a Patmos merchant whose intact body was transported home and later appeared violently
    until burned; a Roman priest apostate in Santorini who appeared after death and
    was also burned; Iannetis Anapliotis, whose post-mortem disturbances ceased after
    debts were repaid and his body was ritually treated; and classifications of inflated
    or undecomposed corpses associated with excommunication, curses, and bodily signs.
    It closes by distinguishing quiescent drum-like corpses from active vrykolakes,
    while noting that popular speech often blurred the distinction.'
  language: English with Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A merchant of Patmos died abroad, and his widow sent a boat to bring his body
    home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sailor sat on the coffin, felt the body move, and the opened coffin revealed
    an intact body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After burial, the dead man appeared at night in houses and was described as
    violent and turbulent, causing deaths by fright or injury.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Priestly and monastic exorcisms were said to be useless in the Patmos case;
    sailors later burned the body on a desert island, after which it was no longer
    seen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Abbé interpreted the case as proof of Greek religious truth and claimed
    that no Mohammedan or Roman Catholic became a vrykolakas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator counters the Abbé’s claim with a Santorini case of a Roman priest
    who apostatized, became Mohammedan, appeared after death, and was disposed of
    by burning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Iannetis Anapliotis, an usurer, repented before death and left instructions
    that remaining just claims against him should be paid; his wife did not pay his
    debts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Six weeks after Iannetis’ death, after his wife refused repayment of a just
    claim, he began to appear in the streets and especially molest his wife and relatives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The reported disturbances by Iannetis included waking priests, pulling off
    coverlets, shaking beds, leaving wine-barrel taps open, frightening one woman
    into temporary loss of speech, and causing another to miscarry when her bed was
    shaken.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the widow paid her husband’s debts and made restitution, the body was
    exhumed and exorcised again; the priests cut the body to pieces and buried it
    in a new grave, and the vrykolakas did not reappear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some bodies found after many years in Greek cemeteries are described as inflated,
    drum-sounding, and called ντουπί; common opinion connected this condition with
    excommunication.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A manuscript from St Sophia at Thessalonica classifies bodily preservation
