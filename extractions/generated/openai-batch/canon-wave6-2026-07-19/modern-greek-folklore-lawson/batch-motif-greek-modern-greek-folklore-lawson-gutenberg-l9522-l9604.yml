canonical_text:
  quote: ''
  summary: The passage discusses beliefs that witches, sorcerers, and related beings
    can transform into beasts. It compares Greek Striges, Tylor’s account of widespread
    were-beast beliefs, Vergil’s Moeris, Centaurs/Pheres, and modern Callicantzari,
    arguing that composite centaur forms may derive from older beliefs in complete
    human-to-animal metamorphosis.
