  quote: ''
  summary: The passage interprets ancient Greek tragic imprecations as threats of
    bodily non-corruption after death. It argues that such a fate excludes the victim
    from both the living and the dead, connects Aeschylean passages about the dead
    not being set free with Death personified as an avenger, and compares these ideas
    with modern Greek curses, ecclesiastical language, and the vrykolakas belief-complex.
  language: English with Greek terms
  quote_policy: summarized
