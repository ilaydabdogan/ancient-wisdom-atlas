canonical_text:
  quote: ''
  summary: 'The passage describes modern Greek Gorgon traditions: a sea-dwelling Gorgon
    questions sailors about King Alexander, rewards the correct answer by becoming
    beautiful and calming the sea, and punishes the wrong answer by wrecking the ship
    or raising a fatal storm. It also records metaphorical local uses of the name
    Gorgon, quotes a medieval Physiologus description of a seductive and deadly Gorgon,
    and compares modern Gorgon traits with ancient Gorgons, Medusa, Sirens, and the
    Lamia of the Sea.'
  language: English
  quote_policy: summarized
