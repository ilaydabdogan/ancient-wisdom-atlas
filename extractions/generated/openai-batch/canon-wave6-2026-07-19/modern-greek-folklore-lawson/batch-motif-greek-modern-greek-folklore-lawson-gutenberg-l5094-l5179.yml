canonical_text:
  quote: ''
  summary: The passage describes modern Greek beliefs and rituals surrounding the
    Fates’ visit on the third or fifth night after a child’s birth. The household
    prepares a clear path, open door, light, low table, cushions, food, honey, water,
    and gifts, while keeping silence. The Fates may be unseen, or a mother may see
    them writing decrees on the infant’s brow or hear them consulting over the child’s
    future. The passage then gives a poem in which a man’s miserable fate is explained
    by a Fate’s anger at obstacles, a well, and unchained dogs during her visit at
    his birth. It closes by discussing the threefold number and possible functions
    of the Fates, including spinning life’s thread and apportioning good and bad fortune.
  language: English
  quote_policy: summarized
