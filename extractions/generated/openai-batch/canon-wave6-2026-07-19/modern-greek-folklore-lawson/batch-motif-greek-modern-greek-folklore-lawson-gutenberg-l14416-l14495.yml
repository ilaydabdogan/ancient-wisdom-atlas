canonical_text:
  quote: ''
  summary: 'The passage argues that Greek offerings, from ancient sacrifices to modern
    candles and votive objects, function as a commercialized form of religious exchange:
    humans present food, candles, animals, models, cakes, or pork to gods, saints,
    Fates, Nereids, a site genius, or Callicantzari in order to gain favor, avert
    anger, obtain protection, secure children, heal a child, or give thanks. The author
    concludes that such bargaining is still a form of communion between worshipper
    and worshipped.'
  language: English
  quote_policy: summarized
