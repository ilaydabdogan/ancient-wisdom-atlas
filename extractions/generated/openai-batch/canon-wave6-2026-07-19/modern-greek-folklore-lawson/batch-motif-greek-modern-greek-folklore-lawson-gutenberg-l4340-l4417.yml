canonical_text:
  quote: ''
  summary: The passage describes modern Greek songs and conceptions of Charos. In
    one strand, Charos is sent by God to take a person’s soul and refuses respite
    or hospitality; mortals may challenge him to athletic contests for the soul. Digenes
    the Cyprian wrestles Charos for three days and nights until a divine rebuke leads
    Charos to become an eagle and pluck out his soul. In a more pagan presentation,
    Charos is a merciless ruler of Hades, a hunter, builder, gardener, vintager, harvester,
    archer, wrestler, and horseman who takes human souls. A quoted song portrays him
    riding a black horse with the dead and refusing to halt at a hamlet or fountain
    lest families recognize and reunite.
  language: English with Greek excerpts
  quote_policy: summarized
