  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The old woman says she is making rain after two rainless years, and she is
    said to have a reputation as a witch who had procured rain in earlier droughts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Islanders concerned for their vineyards approach and prepay the old woman
    for rainmaking.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When her spells failed on one occasion, disappointed clients tried to burn
    her house over her while she slept.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Her incantations include repeated invocation of the Virgin and words about
