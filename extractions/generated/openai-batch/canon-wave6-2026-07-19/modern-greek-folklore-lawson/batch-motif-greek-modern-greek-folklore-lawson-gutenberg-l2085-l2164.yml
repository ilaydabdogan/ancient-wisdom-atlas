  evidence_refs:
  - ev:6
- id: obs:9
  text: The old woman keeps the exact rainmaking formula secret, saying disclosure
    would spoil its efficacy, and attributes the rain not to her own virtue but to
    knowing the god above and the god below.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: She says the lower god no longer waters the land, has caused shakings of the
    earth, and has turned the sea-water red; she says the upper god generally gives
    rain but once sent ashes when she asked for water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: She asks who causes thunder; the narrator later describes the god of thunder
    as making his voice heard more threateningly as she leaves.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author reports that Santorini has only three springs of little use, depends
