canonical_text:
  quote: through knowing ‘the god above and the god below’
  summary: The passage collects modern Greek examples of polytheistic language and
    belief, then narrates a Santorini rainmaking encounter with an old woman who uses
    secret incantations, invokes the Virgin, and explains her power through knowledge
    of an upper god, a lower god, and an unknown thunder god. The author interprets
    the lower god as connected with subterranean waters and earthquakes and explicitly
    compares this function with ancient Poseidon.
  language: English with Greek phrases
  quote_policy: quoted
