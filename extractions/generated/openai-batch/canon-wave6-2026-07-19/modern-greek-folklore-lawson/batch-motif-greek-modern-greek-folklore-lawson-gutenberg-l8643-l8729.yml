canonical_text:
  quote: "“The mummers then represent Callicantzari;”"
  summary: The passage describes goat-like and animal-costumed mummers, bells, masks,
    blackening, noisy dancing, and related Carnival or Twelve Days customs in several
    Greek regions. It reports an Athenian bear-costume rite with noisy youths and
    a procession of wooden xoana, then argues that allied modern mumming customs are
    substantially connected and that the mummers represent Callicantzari. It also
    summarizes Polites’ theory that riotous mummers helped generate the belief in
    Callicantzari as demons, while noting separate traditions about human transformation
    into Callicantzari.
  language: English
  quote_policy: quoted
