canonical_text:
  quote: ''
  summary: 'The passage argues that two opposed conceptions of the hereafter coexist
    as survivals from ancient Greek religion: a Homeric/Achaean conception in which
    all dead share a gloomy existence, and a Pindaric/Pelasgian conception that distinguishes
    the future fortunes of the righteous and unrighteous. It associates Pelasgian
    mystery religion, especially Demeter at Eleusis, with future rewards, punishments,
    and hope of bliss for initiates.'
