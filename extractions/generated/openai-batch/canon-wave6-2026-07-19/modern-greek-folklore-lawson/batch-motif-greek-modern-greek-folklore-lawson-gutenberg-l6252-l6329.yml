canonical_text:
  quote: ''
  summary: The passage describes modern Greek beliefs about Nereids inhabiting trees
    and water. Woodcutters take ritual precautions when felling suspected haunted
    trees, fearing that the Nereid escapes alive and may punish anyone who sees, speaks
    to, or contacts her. Lawson compares this with an ancient story in Apollonius
    Rhodius about a Hamadryad whose oak is felled and who curses the offender’s family.
    The passage then describes Naiads as feared water-nymphs associated with rivers,
    springs, wells, reservoirs, and stream-side caves, with protective practices used
    by people approaching fresh water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Known Nereid-haunted trees are not to be hewn, and suspected trees are treated
    as risky because they may harbour a Nereid.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A North Arcadian woodcutter makes muttered appeals to the Panagia or a patron-saint
    and crosses himself while hewing a suspected tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As a suspected tree begins to fall, the woodcutter runs back, lies face down,
    and remains silent to avoid being heard, seen, and punished by the Nereid leaving
    the tree.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that a person who speaks within a Nereid’s hearing loses
    the power of speech, and that Nereids are prone to injure those who make contact
    by look, word, or touch.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage explicitly summarizes the belief that a felled tree’s death does
    not cause the death of the Nereid inside it; she escapes alive and vengeful.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Apollonius Rhodius example, a Hamadryad begs a man not to fell her
    coeval oak; he fells it, and she imposes fruitless toil on him and his children.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Modern peasants are said to call water-nymphs ‘Nereids of the river’ or ‘of
    the spring,’ and the passage says they are widely feared.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fresh water places such as torrents, reservoirs, rivers, village wells, and
    springs are described as perilous; protective practices include avoiding noontide
    or dusk, spitting three times before drawing water, and crossing oneself before
    fording.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The water-nymphs’ dwelling-place may be the depths of the water or a cave
    beside a stream; the passage also notes Homeric Naiads inhabiting a grotto with
    everflowing waters.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some springs and caves become especially famous or notorious when incidents
    generate stories that are transmitted from generation to generation.
  category: sequence
  evidence_refs:
  - ev:7
