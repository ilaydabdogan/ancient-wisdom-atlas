canonical_text:
  quote: ''
  summary: The author rejects an explanation that the Callicantzari acquired their
    transformation motif from the term Lycocantzari. He argues that Callicantzari
    and werewolves were amalgamated because both were believed to be men transformed
    into animals. He then compares modern Callicantzari origin traditions with ancient
    Centaur traditions in Pindar, contrasting divine Chiron with the nondivine Ixion-cloud-Centauros
    genealogy.
  language: English
  quote_policy: summarized
