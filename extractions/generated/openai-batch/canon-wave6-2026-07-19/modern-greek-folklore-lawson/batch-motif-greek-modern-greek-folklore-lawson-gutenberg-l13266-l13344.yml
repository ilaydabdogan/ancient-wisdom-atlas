canonical_text:
  quote: ''
  summary: The passage describes the modern Greek custom called kledonas, practiced
    by girls for love and marriage divination, involving speechless water, personal
    tokens, and chance words or first-heard names. It then compares this with ancient
    Greek observation of kledones in the Odyssey and with classical oracular practices
    associated with Hermes and Apollo, concluding that divination from chance words
    was an ancient religious institution whose character persists in rarer modern
    forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The custom is described as practiced only by girls and called ὁ κλήδονας,
    preserving the older word κληδών; its purpose is to obtain a presage drawn from
    chance words.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the eve of the feast of St John the Baptist, a boy, preferably the first-born
    of living parents, is sent to fetch fresh water from a spring or well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The water is called ἀμίλητο νερό, “speechless water,” because the boy bringing
    it is forbidden to speak to anyone on his way.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Each girl drops a token, such as a coin, ring, or most often an apple, into
    the vessel of water; the vessel is then closed and left overnight on a roof or
    open place where the stars may see it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One reported next-morning variant has each girl retrieve her apple, draw off
    some water into a smaller vessel, and observe whether the vessel turns right or
    left while supported on four thumbs; the direction predicts whether she will marry
    as she wishes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same reported variant includes washing hands with the water, going into
    the road, and taking the first spoken name heard as the future husband’s name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that taking the first spoken name is a genuine instance
    of divination from chance words.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The usual procedure is for the boy or the girls in turn to draw out the first
    object touched while reciting or improvising a couplet favorable or adverse to
    the token-owner’s love or matrimonial prospects.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author distinguishes prepared couplets as a less pure form of divination
    because chance or divine guidance is confined to the drawing of the token.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage presents Odysseus as hearing the suitors’ threat about Irus and
    treating the chance words as a divine ratification of his hope for the suitors’
    destruction.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Pherae ritual of Hermes Agoraeus, the enquirer comes before the god’s
    statue, burns incense, lights bronze lamps, places a bronze coin on the altar,
    whispers a question into the statue’s ear, covers his ears while leaving the agora,
    and accepts the first words heard outside as the god’s response.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage also names a statue of Hermes Kledonios at Pitane, a sanctuary
    of chance utterances associated with Smyrna, and Apollo Spodios at Thebes as examples
    of similar oracular practice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author concludes that divination from chance words was well established
    in antiquity and that, although rarer in the present day, its character is unchanged.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The religious nature of the two described customs is attributed to their association
    with the festivals of St Catharine and St John the Baptist.
  category: relationship
  evidence_refs:
  - ev:10
