canonical_text:
  quote: ''
  summary: Lawson introduces Phlegon’s ancient story as a rare full account of a revenant
    and as relevant to modern Greek vrykolakes belief. The surviving narrative tells
    of Philinnion, dead and buried for less than six months, appearing alive in the
    guest-chamber with Machates, leaving and exchanging tokens, being confronted by
    her parents, declaring that her three days with Machates occurred by divine consent,
    and then becoming a corpse again. A public investigation finds her grave shelf
    empty except for Machates’ gifts. A seer advises removal of her body outside the
    town, cremation, and chthonic propitiatory rites and purification; the advice
    is accepted, and Machates dies by suicide.
  language: English
  quote_policy: summarized
