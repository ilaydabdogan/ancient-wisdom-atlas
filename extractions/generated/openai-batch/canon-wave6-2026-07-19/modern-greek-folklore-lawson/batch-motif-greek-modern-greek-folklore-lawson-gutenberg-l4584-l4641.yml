canonical_text:
  quote: ''
  summary: The passage argues that the coin placed in a dead person’s mouth in Greek
    custom should be understood primarily as an apotropaic charm blocking the mouth,
    conceived as the passage by which the soul exits and spirits may enter. It compares
    Macedonian Koran-inscribed coins, Zacynthian keys, Eucharistic bread, and cross-inscribed
    pottery as related protective objects, and notes Chian and Rhodian explanations
    that the charm prevents a devil from entering and resuscitating the corpse.
  language: English
  quote_policy: summarized
