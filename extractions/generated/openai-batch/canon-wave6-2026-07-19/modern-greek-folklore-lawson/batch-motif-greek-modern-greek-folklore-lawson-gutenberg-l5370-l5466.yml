canonical_text:
  quote: ''
  summary: 'The passage describes modern Greek beliefs and sayings about Nereids:
    their beauty, voices, dancing, clothing colors, occasional animal feet, domestic
    and textile skills, and relations with humans and animals. It presents stories
    of Nereid marriages, ancestry claims, a goat enamored of a cave-haunting Nereid,
    Nereid wives who leave mortal families but return to bless children, and a reported
    cave-dwelling Nereid lover who benefits a man’s land and flocks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nereids are described as beautiful, sweet-voiced, graceful, and lithe; local
    compliments compare women or brides to Nereids in beauty, bodily features, singing,
    and dancing.
  category: attribute
  evidence_refs:
  - ev:1
