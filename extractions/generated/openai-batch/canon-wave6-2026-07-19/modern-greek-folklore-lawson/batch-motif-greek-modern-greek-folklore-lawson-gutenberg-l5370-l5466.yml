    in dress.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In some localities Nereids are said to have goat or ass feet; three Nereids
    are believed to dance together without pause on the heights of Taÿgetus.
  category: attribute
  evidence_refs:
  - ev:2
