canonical_text:
  quote: ''
  summary: 'The passage analyzes modern Greek belief about vrykolakes/revenants, isolating
    three conditions treated as Hellenic: lack of burial, sudden or violent death,
    and curse or accursed sin. It contrasts Greek burning of the body with Slavonic
    staking of vampires, interpreting cremation as an older Greek practice that dissolved
    the body and released the unquiet dead. The author distinguishes an earlier motive
    of pity from a later motive of fear, summarizes the Hellenic residue of the belief,
    and notes that the Christian Devil cannot explain the older agency of resuscitation.'
  language: English
  quote_policy: summarized
