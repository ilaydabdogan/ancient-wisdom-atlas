  quote: ''
  summary: The passage interprets Herodotus’ account of a Getic custom in which a
    human victim is sent as a messenger to a god, arguing that Herodotus contrasts
    it with a Greek rite of similar motive but different execution. It then summarizes
    the story that Zalmoxis, associated with immortality, was linked by Greek tradition
    to Pythagoras and demonstrated his doctrine by hiding underground for three years
    before reappearing to people who thought him dead.
