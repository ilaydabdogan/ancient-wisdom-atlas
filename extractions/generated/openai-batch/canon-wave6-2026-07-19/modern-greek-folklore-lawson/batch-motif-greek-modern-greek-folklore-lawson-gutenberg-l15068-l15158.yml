canonical_text:
  quote: ''
  summary: The passage discusses possible explanations of Greek human sacrifice, especially
    the idea that a slain human victim could act as a messenger to a god because the
    soul remains active after death. It treats the Lycaean Zeus sacrifice, the Athenian
    pharmakos rite, Miss Harrison’s interpretation of the pharmakos as physical expulsion
    of pollution, and an alternative possibility that the pharmakos was dispatched
    to the other world to petition a deity. It cautiously compares the pharmakos with
    Herodotus’ account of Getic human sacrifice.
  language: English
  quote_policy: summarized
