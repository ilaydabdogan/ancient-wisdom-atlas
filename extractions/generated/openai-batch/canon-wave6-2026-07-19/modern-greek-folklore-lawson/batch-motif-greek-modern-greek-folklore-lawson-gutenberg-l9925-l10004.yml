canonical_text:
  quote: ''
  summary: 'The passage surveys ancient and modern Greek beliefs about guardian spirits
    in animal or monstrous forms: domestic house-snakes and the Athenian acropolis
    snake, church genii appearing chiefly as bulls or other beings, a St George legend
    in which a dangerous monster is sealed in its hole, church genii that cry at midnight
    as death omens, and bridge or river genii depicted as monsters that demand a toll
    or sacrifice during bridge-building.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Theophrastus describes a superstitious man setting
    up a shrine at the spot where he sees a snake in the house, and that observation
    of such snakes was treated as a department of domestic divination.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: House snakes are identified as probable οἰκουροί, “guardians of the house,”
    and Hesychius is said to use the same designation for the great snake of the Athenian
    acropolis.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Athenian acropolis snake was fed a honey-cake every month; when it left
    the cake untouched before the second Persian invasion, this was taken to show
    that the tutelary deity had departed, and the Athenians evacuated the city.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The genii of churches are said most commonly to be seen or heard as oxen,
    chiefly bulls, and to appear most frequently at night; one source describes them
    as adorned with precious stones that illuminate the church.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some harmful church genii are said not to live inside churches, but to have
    lairs close by in order to harm church-goers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near Calamata, a genius or monster was said to come out of a hole near a chapel
    of St George at the annual festival and devour one attendee; later St George appeared
    in a shared dream, promised safety, and the hole was found closed by a stone bearing
    a horse’s hoof-mark.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Harmless church genii are described as wardens of churches who take an interest
    in parishioners.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Marousi a church genius in the form of a bull is believed to lurk in the
    foundations and to bellow three times at midnight when a parishioner is about
    to die; other Athenian church genii in the forms of a snake, black cock, and woman
    are said to cry three times at midnight as similar presages.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: A river genius is said to manifest as a bull, and ancient river-gods are described
    as having been portrayed in the form of bulls.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The genii of bridges are described as dragons or other formidable monsters
    that exact a cruel toll when a bridge is being built; the author explains this
    as a river-god demanding sacrifice, even human life, for encroachment on his domain.
  category: action
  evidence_refs:
  - ev:8
