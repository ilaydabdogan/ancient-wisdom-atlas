canonical_text:
  quote: ''
  summary: The passage retells a story in which two women identified as Striges plan
    to eat one of two sleeping men, dismember the host, cook his organs, are tricked
    into eating dung, and are later killed after the host is restored by eating the
    recovered flesh. The narrator then summarizes Striges as female, nocturnal, sometimes
    old, bird-form beings with a taste for human flesh; discusses beliefs about infant
    Striges and a Tenos story of an infant princess who kills horses and consumes
    townspeople; states that fear of Striges continues from Graeco-Roman antiquity;
    and begins a section on modern Gorgons as sea-dwelling demons represented as half
    woman and half fish.
  language: English
  quote_policy: summarized
