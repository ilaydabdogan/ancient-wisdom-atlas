  confidence: medium
  cautions: The passage presents the objects as wonder-working and given by a divine-associated
    woman, but it does not itself call the objects sacred.
- id: motif:2
  label: Miraculous object loses power in unworthy hands
  taxonomy_refs: []
  basis: Both the cloth and the hen perform for the old man but not for the king,
    and both turn to dust when the king throws them out.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
