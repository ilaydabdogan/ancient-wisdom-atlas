  quote: ''
  summary: The passage gives the close of a folktale in which a king seizes miraculous
    gifts from an old man, the gifts fail and turn to dust, the king executes the
    old man, and the Mistress of the Earth and of the Sea punishes the king while
    the old man enters Paradise. The author then interprets the Mistress as Demeter
    and discusses modern Greek saint-cults as local and functional continuations or
    analogues of older pagan cult patterns.
