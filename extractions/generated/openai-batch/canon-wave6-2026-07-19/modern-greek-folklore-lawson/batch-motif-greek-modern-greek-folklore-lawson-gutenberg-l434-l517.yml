  quote: ''
  summary: The passage contrasts Greek popular religion with Hebrew/Jewish religion.
    It argues that Greek religion remained polytheistic and anthropomorphic, while
    Judaism concentrated divine qualities in one unique deity. It describes Greek
    polytheism as cumulative and internally inconsistent, giving examples from Zeus,
    Dionysus, Demeter, Orpheus, and Aphrodite, and explains why Greek popular religion
    was not formulated as an authoritative creed.
  language: English
