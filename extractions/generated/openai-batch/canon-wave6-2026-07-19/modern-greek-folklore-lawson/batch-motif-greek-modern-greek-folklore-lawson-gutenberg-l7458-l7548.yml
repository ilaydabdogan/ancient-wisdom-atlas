canonical_text:
  quote: ''
  summary: The passage describes Callicantzari as mixed human-animal beings, often
    goat-like, with a smaller child-sized deformed type in some regions. It states
    that they appear during the twelve days between Christmas and Epiphany, otherwise
    live in the lower world and try to cut or gnaw through the tree or columns supporting
    the world. During their brief visit they hide by day, emerge by night, raid homes
    and shops, harm or frighten humans, force wayfarers to dance, abduct women as
    wives, and in some accounts eat human prey. Their night activity is linked with
    names referring to the hour before cockcrow.
  language: English
  quote_policy: summarized
