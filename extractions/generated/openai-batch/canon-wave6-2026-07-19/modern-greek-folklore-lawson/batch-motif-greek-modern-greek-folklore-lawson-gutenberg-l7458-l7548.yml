- id: obs:2
  text: The passage reports goat-like features for Callicantzari, including goat legs,
    ears, sometimes horns, and in one Chios village a name associated with half-goat
    and half-man form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Peasants or local guides identified certain bestial clay statuettes, a Satyr,
    and a Centaur as Callicantzari.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The smaller sort of Callicantzari are described as child-sized, usually black,
    smooth, hairless, and commonly deformed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The smaller Callicantzari are described as riding a cock, a dog-sized horse,
    an enormous donkey, and other deformed or unknown beasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The smaller type is said usually to be harmless to men, playing boisterous
    pranks and provoking merriment more than fear.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Callicantzari are said to appear only during the twelve-day period between
    Christmas and Epiphany.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For the rest of the year they are said to live in the lower world and try
    to gnaw through or cut down the tree or columns on which the world rests; during
    their absence in the upper world, the supports become whole again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the daytime of their visit, they hide in dark, dank places such as
    caves or beneath mills and eat worms, snakes, frogs, tortoises, and other unclean
    things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At night they are said to run about wildly and rend or crush people who cross
    their path.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: They are described as breaking into mills, houses, and wine shops, coercing
    or binding occupants, destroying furniture and supplies, eating or drinking food
    and wine, and befouling what remains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: They are said sometimes to make a belated wayfarer dance all night until cockcrow,
    and more often to tear or batter men, carry women off as wives, or in some accounts
    eat humans.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Their activity is described as limited to nighttime, especially before cockcrow,
    and this is linked with the names Παρωρίταις and Νυχτοπαρωρίταις.
  category: attribute
  evidence_refs:
  - ev:9
