canonical_text:
  quote: ''
  summary: A Santorini tale describes a fishing boy descending under a river to an
    ox-headed river genius who waits for a princess; the princess recognizes him as
    her lover, marries him, and lives with him in an under-river palace. The author
    comments on the story as a river-god marriage motif and compares it with Achelous
    and Deianira. The passage then surveys terrestrial genii as dragons, their variable
    forms and functions, and the belief that dragons guard buried treasure revealed
    in dreams and requiring secrecy and propitiatory sacrifice.
  language: English
  quote_policy: summarized
