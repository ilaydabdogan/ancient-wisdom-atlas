  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thyestes, after banishment by his brother Atreus, returns toward the hearth
    of his father’s home as a suppliant, and his life is spared out of respect for
    the place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says the active sense of προστρόπαιος was applied to a murdered
    man who turns wrath against the murderer or against a next of kin who fails to
    bring the murderer to justice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the cited Platonic tradition, if nearest kin do not seek vengeance, pollution
    devolves upon them, and the dead sufferer turns suffering upon them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Photius is cited as saying that Zeus was invoked as προστρόπαιος, turning
    pollution against murderers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author states that προστρόπαιος was used of the dead man and of demons
    avenging his cause, but not of the next of kin as avenger.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Antiphon example, a dead man will not become an avenger against dutiful
    kinsmen, but will direct anger toward a jury that wrongfully acquits and shares
    the blood-guilt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Aeschylus example, madness and vain terror threaten Orestes if he fails
    his task; the punishment is imaged as an arrow flying in darkness from powers
    of hell at the behest of fallen kindred.
  category: sequence
  evidence_refs:
  - ev:7
