  summary: The passage analyzes the Greek term προστρόπαιος in relation to supplication,
    blood-guilt, avenging dead, divine avengers, and religious pollution. It argues
    that a murdered person as revenant is the primary avenger of blood, while gods
    or demonic powers may act as agents of that dead person’s vengeance.
