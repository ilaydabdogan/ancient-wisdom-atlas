canonical_text:
  quote: ''
  summary: The passage describes Greek popular practices in which dreams convey divine
    instructions for healing, especially through travel to a holy church or icon and
    sleeping in its precincts. It then describes girls inducing dreams about future
    husbands through salty cakes and wine, and a modified form of matrimonial divination
    using cake portions tied with colored ribbons, chance lots, and overheard words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some dreams are described as giving divine communications about healing the
    sick.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Peasants from distant villages bring a wife or child to a reputed miraculous
    sanctuary after being bidden in a dream to remain for a specified number of days
    in a church.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The travelers may beg their way, remain for weeks or months in a strange village,
    and sleep nightly in the holy precincts, if possible at the foot of the icon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The travelers hope either that the place will heal the sufferer or that a
    further dream will tell them what to do next.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: If no cure occurs, the travelers return home with diminished hope but unchanged
    belief, ready to obey another dream message if granted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage states that such healing dreams are regarded as spontaneous revelations
    of divine will, possibly in response to prayer, not as dreams controlled by the
    dreamer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Girls in Greece deliberately induce dreams to learn their matrimonial destinies,
    especially on the eve of St Catharine’s day and sometimes on the first day of
    Lent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girls knead and bake salt-cakes, consume excessive quantities of them,
    and often drink excessive wine, producing conditions for troubled sleep and dreams
    of future husbands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The author states that the tolerance of girls’ intoxication on this occasion
    indicates that the custom was, and sometimes still is, a religious rite and acknowledged
    means of divination.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: A modified custom uses salt-cakes but requires only a morsel to be eaten;
    the rest is divided into three portions tied with red, black, and blue ribbons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Each girl places the three cake portions under her pillow for the night and
    draws one by chance in the morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The red ribbon denotes a bachelor, the black ribbon denotes a widower, and
    the blue ribbon denotes a stranger, meaning someone other than a fellow-villager.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: After drawing the lot, the girl stands in the cottage doorway and listens
    to casual conversation; the first name, trade, occupation, or similar detail she
    hears is taken as information about her future husband.
  category: action
  evidence_refs:
  - ev:4
