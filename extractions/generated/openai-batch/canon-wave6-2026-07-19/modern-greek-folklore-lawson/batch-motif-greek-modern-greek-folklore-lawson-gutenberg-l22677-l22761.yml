canonical_text:
  quote: Death was only a temporary severance of the two entities
  summary: The passage proposes that bodily dissolution after death, whether by inhumation
    or cremation, was understood in Pelasgian or Greek popular religion as enabling
    the body to leave the visible world and reunite with the soul in the unseen world.
    It also describes the danger of a revenant if the soul re-enters an indissoluble
    body, and it cautions that this reconstruction is a general trend rather than
    a fixed doctrine held by all Greeks.
  language: English
  quote_policy: quoted
