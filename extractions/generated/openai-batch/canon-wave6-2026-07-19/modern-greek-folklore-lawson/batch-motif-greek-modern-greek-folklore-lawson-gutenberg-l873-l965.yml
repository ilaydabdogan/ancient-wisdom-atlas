canonical_text:
  quote: ''
  summary: 'The passage describes modern Greek beliefs and practices concerning magic:
    village wise women, overlap between priestly and magical functions, baptismal
    exorcism and spitting, specialists in curing or undoing spells, and several forms
    of sympathetic magic. It gives examples of harmful image magic using wax, lead,
    clay, pins, nails, personal traces, fire, water, and a case of a bride allegedly
    cursed by a rival. It concludes by comparing image-wasting magic with Simaetha’s
    rite in Theocritus, where wax and a cloak-fringe are used in a love-charm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Magic is presented as widespread in Greece, with many villages said to possess
    a wise woman or witch, though inhabitants may deny her existence until illness
    or trouble arises.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are described as the main keepers of charms, incantations, rites, and
    formularies, with knowledge handed down from mother to daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men are also said to practice magic; priestly functions are described as not
    clearly distinguished from those of an unconsecrated magician.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a baptism in the birth-house, the priest exorcises evil spirits from the
    room’s four corners with a censer, while a midwife or god-parent may spit in suspected
    nooks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: An evil or unfrocked priest is said to receive a double portion of magical
    power from the devil; other male practitioners are described as specialists in
    popular medicine, undoing spells, or laying the restless dead.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: 'The passage states that many practices are based on sympathetic magic: what
    one related object does or suffers is also done or suffered by the other.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: To injure or kill an enemy, a practitioner may make an image of him from wax,
    lead, or clay and attach hair, nail parings, shreds of clothing, or expose it
    to his shadow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pins or nails driven into an image are said to cause acute pain to the represented
    person; the device is called κάρφωμα, ‘pinning’ or ‘nailing.’
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the reported case, a priest’s wife suffered from her wedding day; a witch
    directed digging in the courtyard, where a tin containing a nailed bridal shoe,
    pinned soap, tangled hair, and a padlock was found.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Removing the nail and pins and disentangling the hair is said to have freed
    the woman from pains, while the unopened padlock was thrown into the sea and the
    woman remained childless.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: An image may be melted, seared, burned, scraped, or put in a stream so that
    the represented person wastes away and dies as the image is wasted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says this image-wasting method is the same system as Simaetha’s
    rite in Theocritus, where wax is melted and a fringe from Delphis’ cloak is cast
    into flame to make a love-charm.
  category: relationship
  evidence_refs:
  - ev:6
