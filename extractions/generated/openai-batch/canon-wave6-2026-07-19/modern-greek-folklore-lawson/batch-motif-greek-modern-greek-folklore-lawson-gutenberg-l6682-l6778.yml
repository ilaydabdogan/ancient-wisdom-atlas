candidate_motifs:
- id: motif:1
  label: Euphemistic naming of female supernatural recipients
  taxonomy_refs: []
  basis: Offerings to the ‘good ladies’ are treated as ambiguous because the title
    may designate Nereids or Fates.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage discusses nomenclature and dedication practice rather than
    a narrative episode.
- id: motif:2
  label: Survival of an older goddess under local honorific titles
  taxonomy_refs: []
  basis: Artemis is said to remain worshipped in some parts of Greece under titles
    such as ‘the great lady’ and ‘Queen of the mountains.’
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is the author’s folklore-survival interpretation, not a narrated
    myth.
- id: motif:3
  label: Beautiful sea-woman lures men toward death or drowning
  taxonomy_refs:
  - divine_beloved
  basis: The Lamia or Queen of the Shore entices unwary men with beauty, sweet voice,
    marriage promises, and entry into the sea; refusal brings death and consent is
    said by the author to imply drowning.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage emphasizes danger more
    than mutual beloved status.
- id: motif:4
  label: Musical contest or endurance wager with a supernatural woman
  taxonomy_refs: []
  basis: The Lamia wagers that she can dance longer than the shepherd can play; after
    three days and nights he fails and loses his flocks.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only one poem is summarized in the passage.
- id: motif:5
  label: Supernatural seizure of livelihood after failed contest
  taxonomy_refs: []
  basis: The Lamia’s prize in the wager is the shepherd’s flocks, and after his strength
    fails she takes his sheep and goats.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is tied to the contest episode and may not be general to all Lamia
    traditions in the passage.
- id: motif:6
  label: Sea demon or sea queen as waterspout and ship-destroying force
  taxonomy_refs: []
  basis: The Lamia of the Sea is credited with waterspouts and whirlwinds that engulf
    ships, and sailors identify passing waterspouts with her.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives regional reports but limited detail about the Lamia’s
    character in the Cyclades.
- id: motif:7
  label: Protective apotropaic object used against a sea-being
  taxonomy_refs: []
  basis: Cycladic sailors may stick a black-handled knife into the mast as a charm
    against the Lamia when seeing a waterspout.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage records the charm but does not explain its ritual logic.
- id: motif:8
  label: Queen of local nymphs by domain
  taxonomy_refs: []
  basis: The Lamia is called queen of the sea Nereids, parallel to Artemis as queen
    of the mountain or land Nereids.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is an interpretive organization of beings by domain rather than a
    full narrative motif.
- id: motif:9
  label: Marine Lamia as possible mother of a sea monster
  taxonomy_refs: []
  basis: A classical fragment calls Scylla the daughter of Lamia, and the author suggests
