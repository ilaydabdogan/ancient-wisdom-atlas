comparison_claims:
- id: claim:1
  claim: The euphemistic title ‘good ladies’ is applied in the passage to both Nereids
    and Fates, making dedications under that title difficult to assign.
  claim_level: linguistic_similarity
  target: Nereids and Fates under the title καλαὶς κυρᾶδες
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This is a shared title, not proof that the beings were otherwise identical.
- id: claim:2
  claim: The Lamia of the Sea is presented as functionally close to sea Nereids because
    she is beautiful, seeks young men, dances, moves in waterspouts or whirlwinds,
    and is named queen of the Nereids in Elis.
  claim_level: same_function
  target: Nereid / sea-nymph tradition
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage treats her as queen of sea-nymphs, but does not say all
    Lamia traditions are Nereid traditions.
- id: claim:3
  claim: The title ‘queen of the shore’ is compared with Artemis as ‘queen of the
    mountains,’ suggesting a domain-based parallel between rulers of sea Nereids and
    land or mountain Nereids.
  claim_level: same_function
  target: Artemis as queen of the mountains and leader of land Nereids
  evidence_refs:
  - ev:2
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is the author’s structural inference from titles and
    domains.
- id: claim:4
  claim: A Stesichorus fragment in which Scylla is daughter of Lamia provides a possible
    classical analogue for a marine Lamia, but the passage says the agreement with
    classical tradition cannot be decided.
  claim_level: same_motif
  target: Classical Lamia-Scylla lineage in Stesichorus
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:9
  confidence: low
  limitations: Only one fragment is cited, and the passage cautions that several modern
    traits are unlikely to belong to the ancient figure by direct inheritance.
- id: claim:5
  claim: The modern Lamia’s seductive death-bringing love-songs are cautiously compared
    with the Sirens as a possible borrowed attribute.
  claim_level: historical_contact
  target: Siren song tradition
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The passage uses ‘perhaps’ and offers no direct transmission evidence
