canonical_text:
  quote: ''
  summary: 'The passage discusses ambiguous offerings to supernatural female beings
    called the ‘good ladies,’ continued local reverence for Artemis under titles such
    as Queen of the mountains, and traditions about the Lamia of the Sea or Shore:
    a beautiful shore-being who entices young men, contests with a shepherd, threatens
    singers or flute-players, endangers sailors through waterspouts and whirlwinds,
    and is compared with Nereids, Scylla, and Sirens.'
  language: English
  quote_policy: summarized
