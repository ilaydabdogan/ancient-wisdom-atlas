canonical_text:
  quote: ''
  summary: The passage discusses modern and ancient Greek funeral customs involving
    lamps, candles, fire, burial, cremation, and the dissolution of the corpse. It
    argues that small ritual flames could function as ceremonial substitutes for cremation,
    that cremation and inhumation were both directed toward dissolution and severance
    from the world, and that the living generally sought this outcome as a benefit
    to the dead, with fear of malignant resuscitated dead treated as an exception.
  language: English
  quote_policy: summarized
