canonical_text:
  quote: ''
  summary: 'The passage introduces Lawson''s chapter on the survival of pagan deities.
    It argues that ancient Greek popular religion valued immortality and power rather
    than moral perfection or omnipotence, and that worshippers tended to add new immortals
    without abandoning old ones. It then states that modern Greek common-folk still
    recognize and worship many superhuman, mostly immortal beings outside formal Christian
    theology, and discusses collective names for such beings: ξωτικά, τὰ παγανά, and
    possibly τσίνια. It notes regional use of τὰ παγανά for callicantzari in Cephalonia.'
  language: English
  quote_policy: summarized
