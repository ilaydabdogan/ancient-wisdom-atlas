canonical_text:
  quote: "“on the third night after the birth the Fates came to ordain the child’s
    lot.”"
  summary: The passage explains prayers and offerings to the Fates as attempts to
    obtain favorable supplements to an unaltered decree. It recounts a folktale in
    which three Fates visit a newborn girl, receive prepared sweetmeats, grant long
    life, beauty, and chastity, but after one trips at the threshold adds that the
    girl will be idle. On the eve of the girl’s wedding to a prince, the Fates pity
    her and spin, weave, and embroider a magnificent bridal dress overnight, causing
    the prince to grant that she need do no work. The author then describes general
    beliefs about the Fates as three old women connected with spinning, writing decrees,
    cutting the thread of life, and popular expressions about death. A reported trio
    of plague women is compared cautiously and then distinguished from the Fates.
    The passage closes by emphasizing the Fates’ kindness when properly revered and
    their name as “the good ladies.”
  language: English
  quote_policy: quoted
