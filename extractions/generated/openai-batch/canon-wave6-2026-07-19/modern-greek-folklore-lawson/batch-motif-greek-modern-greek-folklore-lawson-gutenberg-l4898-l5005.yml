  quote: "“Kind Fates, ordain my fate, for I bring you good fare.”"
  summary: The passage describes modern Greek practices in which women bring food
    offerings, especially honey-cakes, to caves or rock chambers associated with the
    Fates in order to ask about marriage or maternity. Lawson compares these practices
    with older cults of Aphrodite and with ancient ideas about the Fates, noting both
    prayers for a favorable or revised fate and a popular belief that the Fates’ decrees
    cannot be undone.
