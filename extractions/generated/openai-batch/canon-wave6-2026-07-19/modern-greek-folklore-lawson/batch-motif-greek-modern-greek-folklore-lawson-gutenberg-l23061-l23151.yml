canonical_text:
  quote: ''
  summary: The passage argues that Greek customs of grave provisioning imply belief
    in the departed as continuing to have bodily needs. It treats dissolution of the
    corpse not as annihilation but as a transition to bodily existence in another
    world and reunion of body and soul. It further argues that, once dissolution is
    complete, obligatory care for the dead may cease; the forty-day period is presented
    as the old popular limit, with water offerings stopping after that time.
  language: English
