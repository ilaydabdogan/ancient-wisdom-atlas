  quote: ''
  summary: The passage argues that bodily dissolution was desired for the benefit
    of the dead, asks whether that benefit belongs to body, soul, or both, rejects
    a purely philosophical explanation of soul-liberation, and examines Patroclus'
    desire for rites and entrance to Hades despite the Homeric underworld being joyless.
    It ends by noting a recurring Greek pattern of the dead's eagerness for dissolution
    from Homeric examples to later custom.
  language: English
