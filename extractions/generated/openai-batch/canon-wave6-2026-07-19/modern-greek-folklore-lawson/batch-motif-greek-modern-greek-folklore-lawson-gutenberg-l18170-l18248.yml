canonical_text:
  quote: "“lack of burial and violent death” caused “the return of the dead man’s
    spirit--of his spirit only ... and not of his body.”"
  summary: The passage contrasts ancient literary accounts, where lack of burial or
    violent death causes the dead to reappear as ghosts or souls, with modern Greek
    popular belief, where the same causes are associated with bodily incorruption
    and resuscitation. It cites examples from Homer, Euripides, Aeschylus, Lucian,
    and modern Greek peasant belief, then argues that ancient literary convention
    may have replaced a popular belief in walking corpses with ghostly appearances.
  language: English
  quote_policy: quoted
