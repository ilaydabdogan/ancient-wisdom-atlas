  summary: 'The passage distinguishes two traits of ancient Lamiae: lasciviousness,
    now mainly attributed to the Lamia of the Sea who rules sea-nymphs, and craving
    human flesh, now especially associated with terrestrial Lamiae. It states that
    terrestrial Lamiae are the truest descendants of ancient Lamia and compares their
    place in popular belief to hers, noting ancient testimony that Lamia had become
    a child-frightening bogey more than two thousand years earlier.'
