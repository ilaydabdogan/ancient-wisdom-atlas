    traits are compared with Sirens and Scylla. It cites Siren mermaid descriptions,
    ancient Gorgon sea genealogies and vase imagery with dolphins, then gives a folk-story
    in which a strong lad encounters a beautiful golden-haired Gorgon in a strait;
