  summary: The passage discusses cursed death and refusal of afterlife reception in
    Greek tragedy. Polynices asks Antigone and Ismene to bury him despite his father's
    curse, while Lawson argues that the curse implies postmortem exclusion from Tartarus
    unless funeral rites grant access. The passage then turns to Aeschylus' Choephori,
    where Apollo commands Orestes to avenge his father and threatens physical, mental,
    social, and postmortem penalties, including death without corruption.
