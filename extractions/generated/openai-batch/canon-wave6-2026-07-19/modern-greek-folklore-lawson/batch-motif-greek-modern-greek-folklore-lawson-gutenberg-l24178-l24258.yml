- id: obs:1
  text: Isocrates is quoted as saying that Demeter gave fruits of the earth and a
    rite that made participants' hopes happier concerning the end of life and their
    whole existence; the city then shared those blessings with all men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author notes that references to the mysteries specifically mention happier
    hopes concerning the end of life, and he connects this to after-death hopes.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aristides is quoted as saying that the Eleusinian festival gives present cheerfulness
    and respite, as well as happier hopes about life hereafter, while the uninitiated
    are believed to face darkness and filth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Diogenes anecdote, initiation is described skeptically as if it could
    let publicans share the gods' good things in Hades while Agesilaus and Epaminondas
    lie in filth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Crinagoras advises a friend to set foot on Cecropian soil and behold Demeter's
    mystery nights, which are said to free one from care among the living and lighten
    the heart after death.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cicero is reported as excepting the Eleusinian mysteries from a ban on nocturnal
    rites because they humanise and cheer life and furnish better hopes in death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author's summary states that the initiated receive hope, pledge, or foretaste
    of future bliss; the profane lie in filth and outer darkness; and the blessed
