  quote: ''
  summary: 'The passage assembles ancient testimony and Lawson''s synthesis about
    the Eleusinian mysteries: Demeter''s gifts of agriculture and rites, the initiated''s
    happier hopes for death and the hereafter, the uninitiated''s darkness and filth,
    and the blessed dead''s meadow-like, sunlit communion with gods. Lawson connects
    these promises with broader Hellenic afterlife imagery and hopes for intercourse
    with the gods.'
  language: English
