canonical_text:
  quote: ''
  summary: 'Footnotes report folklore details concerning Greek supernatural beings:
    the name Erinyes used for consumption-causing spirits; a Fate visiting at birth;
    Nereid name variants; a kalokyra who marries and enchants a prince before vanishing
    in a whirlwind; Nereids whose power is in their clothes; cockcrow causing Nereids
    and similar beings to depart; transformations into dog, snake, camel, and fire;
    a chain-dance kerchief; and a Scopelos festal robe.'
  language: English with Greek terms and brief German/French bibliographic matter
  quote_policy: summarized
