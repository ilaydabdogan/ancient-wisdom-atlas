  quote: ''
  summary: The passage describes variant conclusions to a Callicantzaros story involving
    a midwife and supernatural gold; discusses the rare female Callicantzari or Callicantzaros
    wife; and lists Christian, magical, and pagan precautions against Callicantzari,
    including crosses, incense, prayers, fire, herbs, silence, malodorous combustibles,
    and food offerings placed in chimneys during the Twelve Days, New Year, or Epiphany
    period.
