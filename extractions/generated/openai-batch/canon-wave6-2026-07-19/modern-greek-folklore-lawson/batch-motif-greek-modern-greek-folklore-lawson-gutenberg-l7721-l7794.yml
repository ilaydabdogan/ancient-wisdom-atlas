literal_observations:
- id: obs:1
  text: In one version of the story, the Callicantzaros curses the gold he gave the
    midwife and she later finds only ashes; in another, she reaches home with the
    gold, breaks his power over it by magic, and prevents his entrance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife of the Callicantzaros is described in some stories as the same monstrous
    species and in others as an ordinary woman seized and carried off by him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says female Callicantzari are rare and local, with their existence
    assumed as complementary to their mates.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Christian precautions include marking a black cross on the house door, vessels,
    and sometimes infants, as well as burning incense, invoking the Trinity, or reciting
    three Paternosters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other precautions include keeping a fire burning through the Twelve Days,
    placing a large log up the chimney, keeping a night fire near the door, and suspending
    herbs at the door or chimney-place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: People are advised to keep strict silence and not answer questions from outside
    the door because Callicantzari are believed to be able to deprive of speech those
