canonical_text:
  quote: ''
  summary: 'The passage argues that ancient Greek accounts and laws treated the murdered
    dead as active avengers: a murdered revenant could desiccate or drain the murderer,
    vengeance could extend beyond death, refusal of burial could condemn the murderer
    to resuscitation, and modern vrykolakas stories preserve similar acts of rending,
    blood-drinking, killing, and creating further vrykolakes, though with a less discriminating
    fury.'
  language: English
  quote_policy: summarized
