canonical_text:
  quote: ''
  summary: The passage describes secrecy surrounding magical rites, a headache cure
    in which a witch measures a patient’s head and exorcises an indwelling demon,
    a related Macedonian written formula against megrim, and a rain-making Perpería
    procession in northern Greece involving a vegetation-covered child, songs for
    rain, and water poured over the child at doorways, springs, and wells. It also
    discusses regional variants and an etymology of the word περπερία.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Details of rites and full incantations are described as difficult to obtain
    because witches are reticent, and one witch said that magic’s virtue lessens as
    knowledge of it spreads.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headache cure is said to assume that a demon inside the skull causes the
    painful tense feeling and that the aching head is temporarily distended.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the cure, the witch measures the patient’s head with a handkerchief, folds
    back the surplus length, places three cloves of garlic, three grains of salt,
    or another magical article in the fold, and ties a knot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The witch waves the handkerchief around the patient’s head and recites an
    exorcism in a low, mumbling voice that bystanders usually cannot hear clearly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the exorcism, the witch measures the head again; the knot now overlaps
    the other end of the handkerchief, which is taken as proof that the demon has
    been expelled and the head has returned to normal size.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Macedonian formula addresses the God of Abraham, Isaac, and Jacob and
    commands the unclean spirit or demon of megrim to leave the head of the named
    servant of God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage suggests that the written paper bearing the formula may be placed
    under the pillow or burned, with its ashes taken as a sedative powder, though
    this associated rite was not obtained directly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: External nature is described as responsive to spells; witches are rumored
    to draw down the moon, and a ceremony to draw down clouds for parched land is
    said to be still observable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Perpería rite, a boy, or sometimes reportedly a girl, is stripped naked,
    dressed in wreaths and festoons of leafage, grass, and flowers, and escorted around
    the neighborhood by children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The escorting children sing that Perpería goes along and prays to God for
    gentle rain and showers so fields may produce grain and vines may flower.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At doorways, and especially at springs and wells, people may pour a vessel
    of water over the Perpería child, who usually receives sweetmeats or coins as
    compensation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage records by-forms of the word περπερία and notes a Zagorion variant
    in which a form meaning garden-poppy has affected the rite so that the flower
    is considered necessary in dressing the chief actor.
  category: other
  evidence_refs:
  - ev:8
