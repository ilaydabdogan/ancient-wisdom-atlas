canonical_text:
  quote: ''
  summary: The passage discusses Greek divine wedding legends as ritual and funerary
    patterns. Hera’s marriage to Zeus is connected with ordinary weddings, Persephone’s
    marriage with the god of death is connected with funerary and Eleusinian contexts,
    and funerary art is described as using mythic marriage, abduction, and love scenes
    to express a hope of post-mortem wedlock between mortals and deities. The author
    cautions that such identifications concern destiny rather than the absorption
    of personal identity.
  language: English
  quote_policy: summarized
