  quote: identity of attributes or functions suggested the substitution of saint for
    pagan deity
  summary: The passage argues that Christian saints, churches, and symbols in Greece
    often replaced pagan deities, sanctuaries, and cult objects while preserving earlier
    functions, associations, places, and popular practices. Examples include Hermes
    and Michael as soul-escort figures, Christian use of pagan temple sites, a healing
    spring at Tenos, and continued practices such as exorcism, sacrifice, auspices,
    and oracle consultation.
