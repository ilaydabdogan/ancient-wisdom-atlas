canonical_text:
  quote: ''
  summary: 'The author summarizes types of ancient Greek sacrifice, then recounts
    a Santorini peasant’s story of a wartime killing in a buried columned hall: a
    man was sent to St Nicolas for naval success, beheaded and mutilated, and a divine
    apparition with a bright torch caused the participants to flee. The author then
    discusses the uncertain historicity of the account.'
  language: English
  quote_policy: summarized
