canonical_text:
  quote: ''
  summary: The passage argues that ecstatic religious experience, especially in Bacchic
    and related rites, was pursued through intoxication, vapours, and licentious dancing
    in order to visualize and commune with the object of worship. It contrasts Bacchic
    practices with Orphic ethical and ascetic standards, while noting that both sought
    spiritual exaltation and communion with gods. It states that initiation into mysteries
    was believed to ensure blessedness in Hades regardless of ordinary moral conduct,
    and contrasts this separation of religion and morality with Christianity's elevation
    of ethics.
  language: English
  quote_policy: summarized
