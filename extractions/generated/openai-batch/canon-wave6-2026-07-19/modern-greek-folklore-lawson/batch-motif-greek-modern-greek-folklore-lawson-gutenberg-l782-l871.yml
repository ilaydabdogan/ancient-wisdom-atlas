canonical_text:
  quote: ''
  summary: 'The passage describes modern Greek precautions and cures for the evil
    eye: amulets such as garlic, blue beads, salt, charcoal, coins, snake skin, and
    religious remnants; wedding safeguards using cutting implements; emergency countermeasures
    such as spitting, spoken formulas, and a hand gesture; and cures by church prayer,
    incense, healing waters, witchcraft incantations, fumigation, burning objects
    connected with an offender, and divination by burning plants while naming suspects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amulets are presented as the most commonly adopted precaution, with garlic,
    blue stone or glass beads, old coins, salt, charcoal, religious remnants, bat
    bones, and snake skin named among efficacious articles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A midwife is said to carry garlic, and cloves of garlic are fastened about
    a baby's neck at birth or soon after baptism.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blue beads are used for women, children, and animals; mothers value them because
    their colour is associated with ensuring an abundant supply of milk protected
    from the evil eye.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Salt and charcoal may be carried in little neck-bags, sometimes with an old
    coin and other small materials such as pebbles, pomegranate seeds, soap, basil
    leaves, and other plant matter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At weddings, a bridegroom commonly carries a black-handled knife and a bride
    carries open scissors so that evil influence may be cut off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who suspects he is being overlooked may spit on himself, preferably
    three times, or utter short formulas against the evil eye.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A named hand gesture, the φάσκελον, is described as returning evil upon the
    offender's own head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Church treatment for a victim of the evil eye includes special prayers, priestly
    attendance when needed, fumigation with incense, and drinking from a sacred spring
    or well if one is nearby.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A witch's exorcistic treatment may invoke Christian sacred figures, complain
    of the illness, curse the responsible person, and command the evil eye to depart
    from the sufferer's body to hills and mountains.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: During witchcraft treatment, the patient may be fumigated with incense or
    with smoke from burning something belonging to the suspected offender; if the
    offender is unknown, leaves or petals are burned while names are spoken, and a
    loud pop or crackling identifies the offender's name.
  category: sequence
  evidence_refs:
  - ev:8
