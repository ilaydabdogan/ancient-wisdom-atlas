canonical_text:
  quote: ''
  summary: The passage discusses reported survivals of Demeter and Persephone/Kore
    traditions in modern Greek folklore, especially at Eleusis, Arcadia, Pheneos/Phonia,
    and Phigalia. It describes subterranean water channels understood as routes to
    the lower world, a lake-level mortality omen, an etiological devil-and-king fable,
    and a Phigalia story of a wicked magician brother pursuing his sister into a cave,
    mutual transformations, and destruction by earthquake caused by the Panagia.
  language: English
  quote_policy: summarized
