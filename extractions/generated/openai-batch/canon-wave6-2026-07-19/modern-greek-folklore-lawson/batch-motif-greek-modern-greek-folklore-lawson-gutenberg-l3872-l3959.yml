canonical_text:
  quote: "“the Mistress of the earth and of the sea”"
  summary: A Zacynthian tale describes a prince who seeks and marries the Mistress
    of earth and sea after receiving magical advice and completing two tasks, including
    obtaining the skin of a three-headed dragon. After marital discord, the Mistress
    floods the land, drowns mankind, then creates new men by sowing stones and resumes
    world rule. The author then argues that this modern Mistress should be identified
    with Demeter, citing her title, mountain-cave dwelling, benevolence with one destructive
    outburst, flood motifs in Greek folktales, and agricultural functions.
