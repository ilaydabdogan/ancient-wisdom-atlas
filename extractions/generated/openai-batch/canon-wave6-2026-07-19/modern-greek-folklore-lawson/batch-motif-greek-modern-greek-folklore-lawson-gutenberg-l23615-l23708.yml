canonical_text:
  quote: ''
  summary: The passage surveys modern Greek dirges and folk-songs in which death is
    represented as a form of marriage or wedding in Hades. Examples include a dead
    girl’s consoling reply, a dying Klepht who tells his mother to think of him as
    wedded to the black earth, a Macedonian song about a youth trapped in a haunted
    well who uses similar wedding language, and a dirge in which a dead grandmother
    prepares a boy’s wedding in Hades. The author contrasts this consolatory image
    with the usual bleak depiction of the lower world.
  language: English, with quoted Greek proverb and Greek term
  quote_policy: summarized
