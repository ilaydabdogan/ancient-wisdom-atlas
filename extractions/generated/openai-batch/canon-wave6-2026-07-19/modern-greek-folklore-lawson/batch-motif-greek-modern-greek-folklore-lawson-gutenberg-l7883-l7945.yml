canonical_text:
  quote: ''
  summary: The passage presents regional and linguistic evidence that Callicantzari,
    and Cypriot Planetari identified with them in some areas, were believed to assume
    many monstrous, human, animal, and object forms. It describes a Cypriot encounter
    in which a bobbin-like form changes into a donkey or camel, deceives a man into
    mounting it, grows enormously, and throws him down. The passage then argues that
    the beings' variable animal traits are assumed disguises, while their natural
    form is anthropomorphic.
  language: English
  quote_policy: summarized
