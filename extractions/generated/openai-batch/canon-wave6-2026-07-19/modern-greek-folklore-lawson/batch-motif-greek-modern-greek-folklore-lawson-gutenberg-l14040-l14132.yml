  summary: The passage describes modern Greek divinatory practices involving pig spleen
    and sacrificial victims, wedding sacrifices of a ram or cock, and household omens
    from animals and domestic incidents. It also notes ancient Greek parallels cited
    by the author, including entrail inspection, domestic divination, and literary
    examples of portents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that divination from a pig’s spleen is regarded by the
    author as an ancient survival of inspection of entrails.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that the pig was not ordinarily counted among animals with
    prophetic entrails, but that Pausanias reports Cypriot recognition of its value
    and that Paphos used it for oracular responses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before a wedding in many districts, the bridegroom kills the first feast animal
    himself, ideally a young ram.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In some districts the sacrificial animal is blessed by a priest, made to face
    east, and the bridegroom attempts to kill it with one axe blow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Marriage omens are taken from the blood’s manner and direction of spurting,
    and sometimes from whether the tongue is bitten or the mouth is foaming.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Where a cock substitutes for the ram, it is commonly killed after the wedding
    service on the bridegroom’s threshold while the best man holds it down.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says observers attend especially to the cock’s blood and convulsions
    to determine matters such as the bride’s chastity, household supremacy, and future
    children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Aetolia and Acarnania the fowl’s breast-bone is treated as a poor man’s
    substitute for an ovine shoulder-blade because both have surfaces suitable for
    divine inscriptions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that divination from sacrifices is evidence for a belief
    that powers above can hold close communion with humans.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Suidas’s domestic divination includes signs such as a weasel on the roof,
    a snake, spilled oil, honey, wine, water, or ashes, and crackling logs on the
    fire.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A weasel seen about the house is described as an evil omen, especially when
    a girl in the household is about to marry; the explanation given is that the weasel
    was once a maiden transformed into an animal.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: A snake seen in the house is described as a good omen because it is the guardian
