comparison_claims:
- id: claim:1
  claim: The passage presents modern Acarnanian divination from the pig’s spleen as
    the same broad divinatory motif as ancient Greek inspection of entrails, with
    specific ancient Cypriot and Paphian parallels noted.
  claim_level: same_motif
  target: Ancient Greek σπλαγχνοσκοπία and pig-entrail divination in Cyprus and the
    oracle of Paphos
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The author explicitly says he cannot solve how a custom peculiar to
    ancient Cyprus came to be preserved in modern Acarnania.
- id: claim:2
  claim: 'The wedding sacrifice omens have the same ritual function as ancient sacrificial
    omen-taking from the victim’s behavior: to indicate acceptance or rejection of
    the offering and petitions.'
  claim_level: same_function
  target: Ancient Greek sacrificial omens from the animal’s demeanor before and during
    sacrifice
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage distinguishes modern local readings about marriage details
    from the less detailed ancient indication of acceptance or rejection.
- id: claim:3
  claim: The passage compares modern household omens with Suidas’s category of οἰκοσκοπικόν,
    or domestic divination.
  claim_level: same_motif
  target: Suidas’s domestic divination, including weasel, snake, spilled substances,
    ashes, and crackling fire logs
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage notes that the ancient material may have been a heterogeneous
    compilation rather than a scientific system.
- id: claim:4
  claim: The mouse nibbling a flour bag in Zagorion is presented as comparable to
    a portent known from Theophrastus’s superstitious man.
  claim_level: same_motif
  target: Theophrastus’s superstitious man and the mouse/flour portent
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: Only the shared portent is stated; no broader ritual setting is given.
- id: claim:5
  claim: The dog’s night howling as a death omen is compared to Theocritus’s scene
    of dogs barking in connection with Hecate at the cross-ways.
  claim_level: same_motif
  target: Theocritus, Simaetha’s dogs barking and Hecate at the cross-ways
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The modern response differs from the literary scene: modern speech-formulae
    addressed to the dog replace the brazen cymbals mentioned in the quotation.'
