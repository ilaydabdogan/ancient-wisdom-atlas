canonical_text:
  quote: ''
  summary: The passage compares ancient Greek accounts of Avengers, Furies/Erinyes,
    and earth-sent destructive monsters with modern Greek beliefs about vrykolakes.
    It cites threats of land-wide punishment for blood-guilt, Apis cleansing Argos
    of monsters sent up by Earth, and Aeschylus' portrayal of the Erinyes as loathsome
    blood-seeking agents of vengeance. The author argues that these ancient figures
    reflect popular beliefs about violent death, revenants, pollution, and communal
    devastation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Antiphon threatened an Athenian jury with punishment
    by a dead man if they wrongfully acquitted the dead man's murderer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Aeschylus presents the Furies as agents of the dead Clytemnestra
    who menace Attica with a curse that would harm humans, animals, and plants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage quotes Euripides' Creon urging the blood-guilty Oedipus to leave
    because of fear that Oedipus' Avengers might harm the land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the account from Aeschylus' Supplices, Apis, son of Apollo, comes from
    Naupactus to Argos as healer and seer and cleanses the land of destructive monsters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The destructive monsters in the Supplices account are said to be sent up by
    Earth in wrath because of old blood-pollution, and are described as fearsome like
    a dragon-brood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that modern Greek peasants believe violent death is a chief
    cause of resuscitation and that Earth sends up the dead man raging to cause destruction.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the raging dead consort with others of their kind in
    dragon-bands and that gifted seers and healers are summoned to frightened hamlets
    to allay the pest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The passage says that Aeschylus substituted the Erinyes for a revenant: Clytemnestra
    would have been the bodily Avenger, but appears only as a ghost who instigates
    the Erinyes.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Erinyes are described as black, loathsome, deadly-breathed, pleased by
    the smell of blood, hound-like pursuers, tormentors of body and soul, blood-feeders
    on living limbs, and bringers of plague-like devastation when their victim is
    harboured.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author concludes that Aeschylus transferred to demonic agents the attributes
    popularly associated with human Avengers and prototypes of the modern vrykolakas.
  category: relationship
  evidence_refs:
  - ev:6
