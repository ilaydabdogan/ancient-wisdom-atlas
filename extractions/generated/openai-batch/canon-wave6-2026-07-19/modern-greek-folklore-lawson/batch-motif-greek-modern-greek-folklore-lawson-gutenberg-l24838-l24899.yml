canonical_text:
  quote: ''
  summary: Lawson discusses mysteries and rites associated with Aphrodite, Adonis,
    Persephone, and Dionysus as evidence for doctrines of divine-human marriage or
    union and continued life after death. Adonis is described as loved by Aphrodite
    after death and allowed to return from the lower world for half of each year;
    another version has Persephone and Aphrodite share him for alternate halves of
    the year. The passage then describes an Athenian rite in which Dionysus is annually
    married to the chief magistrate’s wife, with fourteen chaste priestesses attending,
    and Lawson conjectures that this may preserve a mitigated form of earlier human
    sacrifice.
  language: English
