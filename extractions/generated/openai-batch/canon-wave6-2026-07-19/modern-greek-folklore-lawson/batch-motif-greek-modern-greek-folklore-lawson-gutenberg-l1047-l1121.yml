canonical_text:
  quote: ''
  summary: 'The passage describes magical and quasi-religious practices in modern
    Greek folklore: a sea-shore charm to undo a marital magic bond, wedding precautions
    using salt, blades, and fishing-net, popular explanations of illness as caused
    by demons or named supernatural beings, and exorcistic healing shared by Church
    and folk practitioners.'
