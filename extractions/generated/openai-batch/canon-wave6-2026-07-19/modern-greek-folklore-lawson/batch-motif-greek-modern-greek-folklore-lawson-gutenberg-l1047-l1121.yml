literal_observations:
- id: obs:1
  text: Pure magic is said to be able to loosen a harmful bond even without finding
    the knotted thread identified as the source of the mischief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A consulted witch took a distressed couple to the sea-shore, had them undress,
    bound them together with a vine-shoot, and made them stand embracing in the water
    until forty waves struck them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the vine-shoot, like the olive-shoot, is known as
    an instrument of purification and may be laid beside the dead during lying-in-state.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Salt is described as having magical power to avert evil influences, and the
    sea is described as more efficacious than a river for mystic purposes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Forty is identified as a number of purification, with churching of women occurring
    on the fortieth day after birth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: At weddings, salt may be thrown into a vessel of water with the saying that
    as the salt dissolves, enemies may dissolve.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A black-handled knife worn by the bridegroom and scissors placed with the
    bride are said to guard against the evil eye and to cut the magic bond of impotence.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: Scissors and fishing-net may be placed in the bridal bed, and in Acarnania
    and Aetolia bride and bridegroom may wear pieces of old fishing-net around the
    loins; these pieces later become amulets for children of the marriage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:9
  text: Popular medicine is described as based on charms and incantations, with ordinary
    illnesses attributed to supernatural causes and responsible demons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: A nightmare and its bodily oppression are attributed to Βραχνᾶς, a malicious
    being who sits on a sleeper’s chest at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among poorer Athenians, a cleft on the Hill of the Nymphs is said to house
    a sisterhood or trinity of she-devils named Cholera, Smallpox, and Plague.
  category: setting
  evidence_refs:
  - ev:5
