literal_observations:
- id: obs:1
  text: In Chios the word vrykolakas is said to be in general use; in Pyrgi, a local
    name of callicantzari is also applied to vrykolakes because of a confusion between
    the two.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The words τυμπανιαῖα and ἄλυτα are given as equivalents of vrykolakas, and
    the form βουρδούλακκας is also reported.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: One interpretation glosses a word as a being who sits upon and crushes victims;
    the habit is said to be sometimes ascribed to vrykolakes and more often to callicantzari.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Popular stories are said to describe the exhumation of a vrykolakas in which
    he is found sitting up in his tomb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note cites the appearance formula “Os hians, dentes candidi,” referring
    to an open mouth and white teeth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In certain districts the word λυκάνθρωπος is said to have been superseded
    by λυκοκάντζαρος, while vrykolakas is said to have had wider currency.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A translated version of the folk song of the dead brother is identified, and
    seventeen versions are said to have been collected by Politis.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The power of excommunication is described as belonging to priests as well
    as bishops, with priests requiring episcopal sanction; reversal by the same person
    who pronounced it is said to have been preferred.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A cited story says that an excommunicated bishop’s body remained bound like
    iron for a hundred years, and that after a later council pronounced absolution
    the body immediately turned to dust.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The word μνημόσυνα is rendered as memorial services and is said to correspond
    to a mass for the repose of the dead.
  category: other
  evidence_refs:
  - ev:9
