canonical_text:
  quote: ''
  summary: Lawson discusses a modern Greek mortuary charm involving pottery stamped
    with a pentagram/pentalpha, its possible relation to Pythagorean and older magical
    uses, and a corpse-mouth prophylaxis later associated with Charon through the
    use of coins. He then contrasts the literary image of Charon as ferryman of the
    dead with broader popular associations of Charon with death, execution thresholds,
    ghosts, and forbidding caverns.
  language: English
  quote_policy: summarized
