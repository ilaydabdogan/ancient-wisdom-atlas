canonical_text:
  quote: As the salt dissolves, so may my curses dissolve.
  summary: The passage describes Greek folk belief in curses as effective utterances,
    a deathbed rite in which a dying man dissolves salt in water and sprinkles those
    present to annul his curses, reciprocal forgiveness needed for an easy death,
    fumigation with remains of a dead injured person when forgiveness is needed, and
    the idea that some serious curses aim to make the cursed person a revenant after
    death.
  language: English
  quote_policy: quoted
