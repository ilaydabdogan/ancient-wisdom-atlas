canonical_text:
  quote: "“An ye devote not human life, no wall hath sure foundation;”"
  summary: A translated folk-song tells of the bridge of Arta, which collapses nightly
    until a demon demands a human life, specifically the master-craftsman's wife,
    who is lured into the foundations and immured. She first curses the bridge, then
    changes her presage to make it firm because her brother may cross it. The prose
    commentary then describes modern Greek building-site sacrifices to a resident
    genius, usually using animal victims whose blood is applied to the foundation-stone
    and whose bodies may be buried beneath it.
  language: English
  quote_policy: quoted
