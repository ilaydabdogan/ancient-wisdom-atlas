  text: A brown owl perched inertly on a house roof forebodes a death in the household;
    if it stays only briefly, alertly, and then flies away, it betokens the visit
    of an acquaintance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird called χαροποῦλι, or “Charon’s bird,” is described as a messenger
    of evil whether it is heard hooting, seen sitting still, or seen flitting in the
    dusk.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Poultry are said to foretell rain, fine weather, or a change of wind by pluming
    themselves, scratching a dusting hole, or roosting on one leg or with heads turned
    in a particular direction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The observer’s position relative to the bird modifies auspices: the right-hand
    side is good, left-to-right crossing is desired, and right-to-left flight indicates
    declining good fortune.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists ancient and present Greek examples in which motion or passing
    toward the right is auspicious or customary.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An eagle’s scream forebodes fighting; if heard on the right, the hearer will
    come out well, while if heard on the left, the hearer is likely to be worsted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woodpecker’s laugh on the right permits confidence in cheating a neighbor,
    while the sound from the left warns the hearer to guard against intrigues.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a hawk pursues prey on the right or crosses left to right, the observer
