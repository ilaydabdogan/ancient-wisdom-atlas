    side or direction, an enemy is represented as the hawk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The number of bird cries affects interpretation; in Cephallenia, one or two
    raven croaks over a house signify security or plenty, but three warn of imminent
    death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that the number three, formerly lucky, is now treated as
