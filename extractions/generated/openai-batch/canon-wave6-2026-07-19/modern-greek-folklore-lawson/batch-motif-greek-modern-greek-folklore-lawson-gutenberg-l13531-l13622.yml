canonical_text:
  quote: ''
  summary: 'The passage describes modern Greek bird auspices: owl postures and species
    as death or evil omens, poultry behavior as weather signs, right-side and left-to-right
    bird movements as auspicious, numerical interpretation of bird cries, especially
    raven croaks, and a poetic example in which closely gathered birds signify the
    heroine’s coming death and union in Hades. The author compares several principles
    with ancient Greek examples, including Homeric rightward movement, Psellus on
    crow cries, and Aristotle on birds settling apart or together.'
  language: English
  quote_policy: summarized
literal_observations:
