canonical_text:
  quote: ''
  summary: The passage describes modern Greek funerary and memorial practices of supplying
    the dead with food, drink, water, and clothing, and compares these practices with
    ancient Greek, Roman, Sardinian, and other Mediterranean evidence. It notes kollyva
    as boiled grain used after funerals, red wine poured on graves, water taken to
    graves up to the fortieth day, ancient and modern practices of burying or offering
    clothing, and folk-song references to gifts sent by a recently dead person to
    earlier dead.
  language: English
  quote_policy: summarized
