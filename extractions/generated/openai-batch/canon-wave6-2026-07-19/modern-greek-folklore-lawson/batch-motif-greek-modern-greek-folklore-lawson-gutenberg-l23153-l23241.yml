canonical_text:
  quote: ''
  summary: The passage describes modern Greek practices surrounding exhumation, bodily
    dissolution, continued care for the dead until only white bones remain, anxiety
    over partial decomposition and possible vrykolakes, an observed case at Leonídi
    in which remains were manually cleaned and probably secretly burned, and the later
    neglect of white bones in open pits. It contrasts popular treatment of bones with
    monastic ossuary practices and concludes that dissolution marks the dead person's
    release from dependence on surviving relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food presents to the dead are said to continue generally until the third anniversary,
    when exhumation takes place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If exhumation shows that the body is gone and only white bones remain, no
    further provision is made for the dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the corpse has not fully disintegrated, relatives remain under obligations
    to the dead.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:4
  text: At Leonídi, two opened graves contained only partially decomposed remains,
    and villagers feared that one or both dead persons had become vrykolakes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The remains were removed to a chapel attached to the burial-ground, where
    people debated how to effect dissolution.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prayer had been tried without effect; burning the remains was urged by some
    villagers but rejected by local authorities as unlawful; the priest proposed re-interment,
    which relatives opposed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The relatives cited their previous duties and expenses, including keeping
    the unsleeping lamp at the grave and providing memorial feasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the chapel, remains lay in two large baskets; men worked beside them with
    knives, and women scrubbed bones with soap and soda in wash-tubs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After two days, the bones were white and clean, all else had disappeared,
    and dissolution was accepted as complete.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The passage states that care for the dead is obligatory only up to dissolution;
    while flesh remains in the world, food must be provided, but when only bones remain,
    the departed are no longer dependent on relatives.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage contrasts popular practice with monastic ossuaries, where skulls
    and bones may be arranged and preserved.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says common folk throw white or whitened bones away, giving examples
    of open pits at Leonídi and Sciathos where bones lie neglected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage concludes that once every trace of the body except white bones
    has disappeared, care turns to unconcern because the dead body is understood to
    have gone to another land and regained activity and independence with the soul.
  category: relationship
  evidence_refs:
  - ev:7
