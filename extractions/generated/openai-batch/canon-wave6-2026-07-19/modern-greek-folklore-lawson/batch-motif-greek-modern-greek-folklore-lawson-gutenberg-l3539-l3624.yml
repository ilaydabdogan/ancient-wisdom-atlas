canonical_text:
  quote: "“At once the pieces of his body came together again and he revived.”"
  summary: A strong young man reaches a mountain forest fire guarded by forty dragons,
    is pressed into rescuing a maiden shut in a high tower by a magician, kills the
    dragons by using a nail-ladder trick, and finds S. Demetra’s daughter. He battles
    the shapeshifting magician for three days, is killed and quartered, but is revived
    by a stork using a magic herb. After invoking the Panagia and vowing to become
    a monk, he defeats the magician when the stork blinds him and removes the white
    hair on which his life depends. The girl is returned to Lepsína in spring, the
    hero enters a monastery, and the fields remain fertile through S. Demetra’s blessing.
    The author then explicitly compares the legend with the rape of Persephone and
    identifies its principal actors with Demeter, Core, Pluto, and Triptolemus, also
    linking the abduction locale with underworld geography in Epirus.
  language: English
  quote_policy: quoted
