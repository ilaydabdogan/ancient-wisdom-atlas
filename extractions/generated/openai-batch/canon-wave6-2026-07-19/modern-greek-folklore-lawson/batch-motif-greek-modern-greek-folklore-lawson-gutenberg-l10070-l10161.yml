  summary: The passage describes modern Greek foundation and launching rites in which
    animal victims, human proxies, or shadows are offered to local genii for the stability
    of buildings, opening of quarries, or launching of ships. It links these practices
    to ballads such as the Bridge of Arta and distinguishes victims from the genii
    who receive or demand them.
