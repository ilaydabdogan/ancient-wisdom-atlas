canonical_text:
  quote: ''
  summary: The passage distinguishes solitary surviving pagan deities from generic
    divine groups, gives Gello as an example of a single figure becoming a plural
    child-preying class, and then discusses Zeus in modern Greek popular religion.
    It argues that Zeus's functions were transferred to the Christian God, especially
    control of ordinary weather and lightning. It treats the modern Greek term for
    thunderbolt as a 'lightning-axe' possibly related to ancient Zeus symbolism, and
    describes ancient and modern awe toward beings and objects struck by lightning.
  language: English
  quote_policy: summarized
