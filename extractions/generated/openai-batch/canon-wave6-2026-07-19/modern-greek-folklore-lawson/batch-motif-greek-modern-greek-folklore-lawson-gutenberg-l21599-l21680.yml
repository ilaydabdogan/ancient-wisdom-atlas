  summary: The passage surveys late antique cremation and inhumation, polemics between
    pagans and Christians over burial and resurrection, the decline of cremation,
    a later revival of burning suspected vrykolakes as protection for the living,
    and the introduction of the evacuation of Parga as a later case said to involve
    care for the dead rather than fear of revenants.
  language: English
