canonical_text:
  quote: "‘the unsleeping lamp’ (τὸ ἀκοίμητο καντῆλι)"
  summary: The passage describes a Modern Greek funerary custom in which a lamp or
    light is kept continuously burning after a funeral, usually at the grave, with
    local variations in duration, structure, and interpretation. It also describes
    a Chios variant in which a lamp is kept in the death-room for forty nights because
    the soul is thought to wander before descending to Hades.
  language: English with a Greek term
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A custom called the ‘unsleeping lamp’ consists of keeping a light continuously
    burning after a funeral, either in the room where death occurred or at the grave,
    for either forty days or three years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author treats the place and duration of the light as variable details
    requiring examination, distinguishing the chamber of death from the grave-side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Aegina an ordinary lantern is placed at the head of the grave and tended
    for forty days so that the flame is not extinguished.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Aráchova and in the Thriasian plain, graves have small structures to shelter
    a naked light; these include doll-house-like structures, boxes, and tile or stone
    shelters.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Aráchova the lamps are tended in the evening and morning, and the obligation
    to keep them burning for three years until exhumation is strongly observed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Leonídi, some tombs have a recess at the head of the grave, under the slab
    or below ground level, where the unsleeping lamp is placed; the lights are kept
    until exhumation and trimmed every evening.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: At Gytheion the author noticed old graves with iron vessels sunk at the head
    of the grave, which he says presumably served to shelter a light.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fire for lighting the unsleeping lamp is not kindled beside the grave
    but is conveyed from the house of the deceased.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the house, candles or lamps are lit when death takes place or when the
    body is laid out, and are placed at the head and foot of the couch on which the
    body rests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The lights, or other tapers and candles lit from them, are carried with the
    funeral procession to the grave, where the same fire is transmitted to the unsleeping
    lamp.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Chios variant, people keep a lamp burning for forty nights in the room
    where death occurred.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Chios explanation states that the soul wanders for forty nights before
