canonical_text:
  quote: ''
  summary: A legend recited to Lenormant tells of Saint Demetra, an aged charitable
    woman whose extraordinarily beautiful daughter is abducted by a wicked Turkish
    lord skilled in magic. Demetra searches for her daughter, receives information
    and help from a grateful stork, collapses near Lepsina, identified as Eleusis,
    and is aided by Marigo and Nicolas. Demetra rewards their hospitality by blessing
    their fields with fertility. Nicolas's brave son then sets out with the stork
    to recover the daughter in exchange for her hand.
  language: English
  quote_policy: summarized
