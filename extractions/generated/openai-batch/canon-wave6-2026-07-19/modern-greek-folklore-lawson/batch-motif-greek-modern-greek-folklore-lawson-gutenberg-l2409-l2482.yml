canonical_text:
  quote: ''
  summary: The passage describes Greek church votive practices, distinguishing thank-offerings
    from propitiatory offerings. It gives examples including costly gifts at Tenos,
    infected clothing and rags dedicated for healing, cheap silver-foil models of
    body parts and other possessions entrusted to the Virgin or saints, candles, incense,
    vows, chapels, a boy dressed as a priest after recovery, and a girl’s promised
    silver girdle. The author interprets these practices as pagan survivals under
    Christian forms and notes popular expectations that saints perform miracles in
    return for human service.
  language: English
  quote_policy: summarized
