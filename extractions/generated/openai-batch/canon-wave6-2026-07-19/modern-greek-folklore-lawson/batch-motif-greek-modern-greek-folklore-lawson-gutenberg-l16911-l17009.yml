  summary: The passage discusses a ballad variant in which a curse on Constantine
    is revoked and he decays into earth. It interprets Constantine as an oath-bound,
    pitiable revenant rather than a destructive vrykolakas, contrasts this Greek conception
    with a Slavonic vampire type, and gives examples of harmless or domestic vrykolakes
    in Santorini, Amorgos, Maina, and Samos.
  language: English with quoted Greek
  quote_policy: summarized
