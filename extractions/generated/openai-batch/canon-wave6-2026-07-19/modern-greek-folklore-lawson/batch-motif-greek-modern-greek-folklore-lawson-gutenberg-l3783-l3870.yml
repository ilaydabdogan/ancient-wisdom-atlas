canonical_text:
  quote: They speak only of ‘the Mistress.’
  summary: The passage reports modern Greek peasant beliefs in a deathless mountain-dwelling
    female deity called the Mistress or Mistress of the world. She is described as
    a real divine person who grants boons, especially fertility of flocks and crops,
    helps the good, and punishes the wicked. The author compares reports from Aetolia,
    North Arcadia, Messenia, Zacynthos, and stories collected by Bernhard Schmidt,
    including a tale where the Mistress of earth and sea rewards a poor man and punishes
    an envious king.
  language: English with embedded Greek phrases
  quote_policy: quoted
