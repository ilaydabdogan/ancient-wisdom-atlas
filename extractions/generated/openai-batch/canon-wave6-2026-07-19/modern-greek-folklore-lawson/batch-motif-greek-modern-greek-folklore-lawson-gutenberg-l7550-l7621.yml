canonical_text:
  quote: ''
  summary: The passage describes Callicantzari as foolish, quarrelsome nocturnal demons
    led by a lame chieftain, and says they vanish at cock-crow. It then gives a Scyros
    tale explaining a place-name, in which a man hides among sacks on his mule, his
    wife delays the Callicantzari by making them count sieve-holes, and priests chase
    them away; one lagging Callicantzaros loses a foot when struck with a sprinkling
    vessel.
  language: English
  quote_policy: summarized
