canonical_text:
  quote: Death... was not a final separation of body and soul; in certain cases the
    body remained incorrupt and the soul re-animated it.
  summary: The passage argues that Greek popular belief treated some dead bodies as
    remaining incorrupt and capable of re-animation by the soul, producing revenants.
    It interprets Charon’s obol as a charm against spirit or soul entry into the corpse,
    summarizes causes of revenance, and discusses murdered victims and murderers as
    sharing a revenant fate, with corpse mutilation intended to prevent the victim’s
    bodily revenge.
  language: English
  quote_policy: quoted
