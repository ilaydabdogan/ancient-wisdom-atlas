canonical_text:
  quote: ''
  summary: The passage reports ecclesiastical and narrative examples in which excommunication
    leaves dead bodies incorrupt or “bound,” while absolution read by clergy causes
    them to dissolve into dust. It recounts cases involving Metropolitans, a priest
    turned Mohammedan, a Sultan testing Christian claims, and an excommunicated priest’s
    widow whose body decomposes after absolution. The author then argues that the
    Church sanctioned and used this popular belief, discusses the terms τυμπανιαῖος/τυμπανίτης
    and vrykolakas, and contrasts an earlier Greek conception of reasonable revenants
    with later vampire-like traits attributed to Slavonic influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Leo Allatius is said to have treated the physical effects of excommunication
    and absolution as indisputable and to have cited cases where absolution over incorrupt
    bodies led to dissolution into dust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One reported case describes a priest who had excommunicated someone, later
    became Mohammedan, and then read absolution over the dead Christian’s body; the
    body’s swelling subsided and it turned to dust.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Malaxus story, the Sultan orders that an excommunicated body be found
    and absolved after hearing that such bodies do not dissolve until absolution is
    read over them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A priest’s widow is described as having accused Patriarch Gennadius of attempted
    seduction after he rebuked her for prostitution.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gennadius publicly prays that, if the widow’s charge is false, she should
    be severed from the communion of the faithful and remain unpardoned and incorruptible.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The widow dies forty days later of dysentery and remains incorrupt after burial.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: When exhumed, the widow’s body is described as sound and whole, dark in colour,
    with skin stretched like the parchment of a drum.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The body is kept under the Sultan’s seal before absolution, and during the
    reading a crackling from within the coffin is heard as the body breaks up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After a few days the coffin is opened and the body is found dissolved and
    decomposed, described as having obtained mercy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Sultan is reported to have been impressed by the event and to have declared
    the Christian religion true beyond question.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The author states that the Church sanctioned and used the belief in incorruptibility
    of certain dead bodies as an article of faith and an instrument of discipline.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ecclesiastical writers used the terms τυμπανιαῖος or τυμπανίτης for a person
    whose body was “bound” by excommunication, explaining the term as swollen with
    skin tight as a drum.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The author states that the word vrykolakas became more common than τυμπανιαῖος
    and that the Church likely borrowed both the term and the belief in bound dead
    bodies from popular speech and superstition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The author states that the Greek revenant later acquired baneful characteristics
    of the Slavonic vampire, whereas earlier incorrupt dead were conceived as τυμπανιαῖοι
    and reasonable revenants.
  category: relationship
  evidence_refs:
  - ev:7
