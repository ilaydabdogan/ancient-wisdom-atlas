canonical_text:
  quote: ''
  summary: The passage summarizes Lawson's discussion of ancient Greek beliefs about
    homicide, blood-guilt, and the personal activity of the dead. Plato is said to
    recognize that a slain person remains active after death, though accidental killing
    brings only temporary anger and withdrawal of the slayer, while deliberate murder
    brings implacable vengeance. The dead victim is described as terrifying the slayer,
    using the slayer's conscience, compelling the next of kin to seek satisfaction,
    and punishing negligent kin. The passage then discusses the literary treatment
    of this vengeance as a curse or manifestation of wrath, which may afflict a family
    across generations, work spontaneously, or be executed by nether powers. Examples
    from Plato, Euripides, and Aeschylus are used to frame blood-guilt, the house
    of Atreus, the father's wrath as an unseen barrier before divine altars, and the
    possibility that a dying victim may remit the curse.
