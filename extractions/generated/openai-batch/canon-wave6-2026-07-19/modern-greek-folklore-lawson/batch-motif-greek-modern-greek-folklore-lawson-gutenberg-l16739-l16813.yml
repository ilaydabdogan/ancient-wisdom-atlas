canonical_text:
  quote: The Greeks had believed in reasonable human revenants; the Slavs taught them
    to believe in brutish inhuman vampires.
  summary: The passage argues that Greek curse formulas involving incorruptibility,
    resuscitation, or rejection by the earth preserve an older belief in comparatively
    harmless revenants. It contrasts this with the blood-thirsty modern vrykolakas,
    which the author attributes to later Slavonic influence, and introduces a ballad
    in which a mother's curse recalls her son from the grave.
  language: English with Greek terms and phrases
  quote_policy: quoted
