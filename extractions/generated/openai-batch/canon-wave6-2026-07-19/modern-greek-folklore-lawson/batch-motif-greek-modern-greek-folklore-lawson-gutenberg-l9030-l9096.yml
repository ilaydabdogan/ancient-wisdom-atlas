  summary: The passage argues that the ancient category of Centaur included several
    half-human, half-animal beings, especially Satyrs and Sileni. It cites Macedonian
    coin imagery, Zeuxis, Nonnus, Greco-Roman Dionysiac art, and later popular terminology
    to connect ancient Centaur, Satyr, and Silenus types with modern Greek Callicantzari,
    especially through hybrid form and shaggy hair.
