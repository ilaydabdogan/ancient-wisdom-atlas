canonical_text:
  quote: ''
  summary: 'The passage describes Nereids as beautiful but dangerous beings: supernatural
    wives may recover a stolen kerchief and leave mortal husbands; men who intrude
    on their revels or bathing places may be punished; brides, mothers, and children
    require protection from their envy, raids, and substitutions; protective and appeasing
    practices include amulets, garlic, a cross, silence, honey offerings, forty-day
    postpartum precautions, iron, and local chapels with saints.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nereid wife may discover the hiding place of her stolen kerchief, or her
    husband may restore it; once it is recovered, she leaves despite an oath to remain
    with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men who trespass upon the Nereids’ midday carnival or cross their nightly
    path may suffer dumbness, blindness, epilepsy, or mutilation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Melian peasant who encountered the Nereids at night was taken to a nearby
    cave, feasted and entertained, and sent home in the morning shattered and impotent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Intruding on Nereid revels in a secluded glen, sleeping beneath their tree,
    or playing the pipe beside the river where they bathe can bring blindness, dumbness,
    or madness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Peasant women are said to be especially at risk from Nereids at marriage and
    childbirth; Nereids may injure a bride or mother while sparing or blessing the
    child.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Common protections for women include wearing amulets, fastening garlic over
    the house door, painting a black cross on the lintel, and keeping silence if strange
    visitants are heard at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nereids may be appeased with food offerings in which honey is essential; in
    former Athens a bride also added two chemises from her trousseau.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After childbirth, precautions continue for forty days; a mother avoids crossing
    thresholds without stepping on a door-key, identified as an available piece of
    iron.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Children need protection from being stolen by Nereids, who may fascinate a
    child fatally, seize one violently, or place a weak Nereid changeling in a cradle
    and carry away the human infant to woods and hills.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Pholegandros, many small chapels are explained as attempts to keep a saint
    near each property to defend against raids by Nereids and kindred beings.
  category: setting
  evidence_refs:
  - ev:10
