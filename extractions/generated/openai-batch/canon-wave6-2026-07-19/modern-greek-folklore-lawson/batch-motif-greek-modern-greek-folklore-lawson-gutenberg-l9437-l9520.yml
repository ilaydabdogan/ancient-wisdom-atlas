canonical_text:
  quote: ''
  summary: The passage argues that early Greek artistic representations of Centaurs
    as semi-animal beings should be considered alongside their name Pheres, meaning
    Beasts. It rejects explanations based on violence or lust, especially because
    Chiron shares the same equine adjunct in art yet is virtuous. It proposes that
    a trait common to all Centaurs is needed, then turns to their reputation for magic,
    prophecy, healing, and divination, ending with the question whether the name Beasts
    may relate to a belief that they could transform themselves into animals.
  language: English
  quote_policy: summarized
