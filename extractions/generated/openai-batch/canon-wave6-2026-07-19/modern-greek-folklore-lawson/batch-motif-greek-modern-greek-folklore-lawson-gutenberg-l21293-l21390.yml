canonical_text:
  quote: Cremation and inhumation were practised both severally side by side and also
    conjointly as a single rite.
  summary: The passage argues that cremation and inhumation in Greek funerary practice
    could be used side by side or fused into a combined rite. It discusses Homeric,
    Mycenaean, Achaean, Pelasgian, and Dipylon-period evidence, including burned gifts,
    ashes or bones placed in urns, and a Dipylon case in which a cremation urn was
    buried in a full-sized grave with grave goods.
  language: English
  quote_policy: quoted
