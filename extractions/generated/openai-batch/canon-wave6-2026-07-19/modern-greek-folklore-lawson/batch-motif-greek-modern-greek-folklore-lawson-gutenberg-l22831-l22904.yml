canonical_text:
  quote: "“the dead needed food as living men need it, and their friends supplied
    it, not in fear, but in love.”"
  summary: The passage describes ancient Greek libations and food-gifts brought to
    graves for the dead, distinguishes them from sacrifices to gods, lists recurring
    post-funeral meals and commemorations, and explains that food might be burnt or
    deposited at the grave for the dead. It then describes Christian opposition and
    later Christian adaptation, especially by St Anastasius Sinaites, and presents
    present-day Greek graveside distributions of food and wine, with a share given
    to the dead, as continuing the practice of meals for the dead.
  language: English with Greek terms
