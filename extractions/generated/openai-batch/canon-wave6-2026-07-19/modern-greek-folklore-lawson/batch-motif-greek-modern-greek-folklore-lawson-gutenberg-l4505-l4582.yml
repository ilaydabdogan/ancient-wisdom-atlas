  text: In parts of Macedonia, Thrace, and Asia Minor, a custom is reported of placing
    a small coin in the mouth, or more rarely on the breast, of the dead; near Smyrna
    the coin is called “passage-money.”
  category: action
  evidence_refs:
  - ev:1
