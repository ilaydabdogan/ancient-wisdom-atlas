- id: obs:3
  text: A Zacynthos song has a poor soul complain that no farthing was placed in its
    mouth for Charos, who awaits it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old woman from Zacynthos remembered both placing a copper coin in the mouth
    of the dead and laying a key on the corpse’s breast; she did not know the coin’s
    purpose but believed the key opened the gates of Paradise.
  category: action
  evidence_refs:
  - ev:4
