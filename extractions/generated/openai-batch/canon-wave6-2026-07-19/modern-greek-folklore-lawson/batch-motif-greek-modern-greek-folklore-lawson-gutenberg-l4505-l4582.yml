canonical_text:
  quote: ''
  summary: The passage discusses modern and recent Greek funerary customs involving
    placing a coin in or on the dead, sometimes explained as passage-money for Charos/Charon
    as ferryman, and compares these explanations with ancient literary accounts. It
    also reports a remembered key laid on the corpse for opening Paradise and an uncertain
    Cycladic explanation that the coin is useful because of the “aërial ones,” possibly
    as a fee or charm.
  language: English with Greek phrases
