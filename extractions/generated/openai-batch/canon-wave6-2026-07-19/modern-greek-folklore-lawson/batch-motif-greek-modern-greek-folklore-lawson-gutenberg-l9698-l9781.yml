canonical_text:
  quote: ''
  summary: The passage summarizes Lawson’s proposed historical layers in modern Greek
    traditions about the Callicantzari, connecting different regional forms with Centaurs,
    Dionysiac masquerade, Satyrs or Sileni, and werewolves. It then introduces στοιχειά/genii
    as local or elemental spirits, tracing the term from physical elements through
    Platonist demonology and Christian interpretation into modern peasant belief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In some districts, the Callicantzari are said to be human in their normal
    form and capable of transforming themselves into beasts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says this form of tradition dates to an age when Achaean invaders
    credited a Pelasgian tribe of Centauri with magical powers and surnamed them Pheres.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In other districts, the Callicantzari are represented as demoniacal rather
    than human and as monsters of mixed rather than variable shape.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that, in some common-folk conceptions, composite monsters
    took the place of old human wonder-working Centaurs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In some districts, Christmas mummers in the guise of Callicantzari are described
    as modern representatives of Dionysus-worshippers who dressed as Satyrs or Sileni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that half-human, half-animal comrades of Dionysus lost their
    distinctive names and were enrolled in the Centaurs’ ranks in a post-classical
    age.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a few districts, language is said to testify that werewolves have also
    been numbered among the Callicantzari.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that the superstition originated in the reputation for sorcery
    enjoyed by a Pelasgian tribe inhabiting Mount Pelion.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage introduces στοιχειά, anciently στοιχεῖα, or Latin genii, as miscellaneous
    beings identical or comparable with creations of ancient superstition.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that physical elements were commonly supposed to be haunted
    by peculiar spirits and that every component of the visible universe was credited
    with an invisible genius bound to its abode.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage proposes that common folk identified Pauline στοιχεῖα with lesser
    deities and local genii and continued to serve or propitiate them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The στοιχεῖα are described as remaining part of the peasant’s demoniacal entourage,
    with some hostile, some benevolent, and all wild and uncontrollable.
  category: attribute
  evidence_refs:
  - ev:9
