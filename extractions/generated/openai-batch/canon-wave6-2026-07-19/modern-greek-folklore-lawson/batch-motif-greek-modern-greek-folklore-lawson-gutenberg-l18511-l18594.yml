    victim's head and hands were cut off, interprets the mutilation as an attempt
    to prevent the victim becoming an avenging vrykolakas, and compares this popular
    belief in bodily revenant vengeance with modified ghostly vengeance motifs in
    ancient Greek tragedy, especially the house of Atreus in Aeschylus.
