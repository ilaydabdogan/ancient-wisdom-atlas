canonical_text:
  quote: ''
  summary: 'The passage surveys categories of persons believed liable to become vrykolakes
    or restless revenants: those deprived of proper funeral rites, those dying violently
    or suddenly, certain children, the cursed and excommunicate, the unbaptised or
    apostate, sinners and sorcerers, eaters of wolf-killed sheep flesh, and corpses
    crossed by animals. It also distinguishes Hellenic, ecclesiastical, and Slavonic
    elements in these beliefs.'
  language: English
  quote_policy: summarized
