canonical_text:
  quote: ''
  summary: The passage describes the importance of dream interpretation in ancient
    and modern Greece, including modern dream-interpreter books kept as valued household
    possessions. It states that dreams often reveal buried treasure and require secrecy
    and a cock sacrifice before excavation. Lawson then says the Greek Church used
    this dream-discovery pattern for finding buried miracle-working icons, including
    the icon of Tenos, and notes repeated stories of icons unearthed in obedience
    to dreams, sometimes attributed to St Luke if they depict the Panagia. It also
    describes gold or silver foil coverings transferred from pagan statue thank-offerings
    to icons, and reports a schoolmaster seeking leave to excavate an icon revealed
    in a dream and build a chapel for it.
  language: English
  quote_policy: summarized
