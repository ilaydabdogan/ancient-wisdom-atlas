canonical_text:
  quote: ''
  summary: 'The passage opens a discussion of the relation of soul and body. It argues
    that experiences such as sleep, trance, and especially death suggest a division
    between body and an impalpable element, and that death raises questions about
    whether either part continues or is reunited. It then explains Lawson’s method:
    use modern Greek beliefs and customs about death as evidence for older Greek popular
    beliefs. The passage introduces an abnormal condition of the dead identified as
    a kind of vampirism, in which a corpse does not decay, is reanimated, and revisits
    the scenes of its former life, often harmfully. It also notes that the current
    superstition has been modified by Slavonic and ecclesiastical influences.'
