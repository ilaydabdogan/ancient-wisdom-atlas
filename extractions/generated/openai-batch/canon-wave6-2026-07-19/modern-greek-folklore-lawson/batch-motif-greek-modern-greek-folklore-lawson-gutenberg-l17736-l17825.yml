- id: obs:3
  text: Modern reports describe a vrykolakas revisiting his widow, doing violence
    to women while husbands are absent, marrying again where unknown, and fathering
    children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Roman priest is quoted as saying that devils can take bodies of dead men
