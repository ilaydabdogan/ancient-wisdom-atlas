canonical_text:
  quote: ''
  summary: 'The passage presents reports and explanations of the Greek belief in vrykolakes:
    returning or reanimated dead who terrify the living, resist decomposition, may
    be created from sinners or excommunicated persons by an evil spirit entering the
    corpse, attack sleepers, and can be countered by exhumation, dismemberment, burning,
    relocation beyond salt water, church circuits, or gunfire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Paul Lucas's report, dead persons return, show themselves in open day,
    enter houses, and terrify those who see them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When such an apparition is seen, people go to the cemetery, exhume the corpse,
    cut it in pieces, and burn it by sentence of governors and magistrates; afterward
    the quasi-dead are said not to return.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Older scenes are described in which a suspected body was dragged from the
    grave and dismembered; sometimes the heart was torn out and boiled in vinegar,
    or the remains were burnt on a public bonfire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Greek Church maintained a belief in the non-decomposition
    of excommunicated persons and notorious sinners and hesitated over the idea that
    such persons were liable to re-animation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'In some places burning non-decomposed corpses was replaced by milder practices:
    in Scyros the body is carried around forty churches and re-interred, while in
    parts of Crete, Cythnos, and other Aegean islands the body is moved to an uninhabited
    islet where salt water bars its return.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Sphakia account says that many dead persons, especially those who lived
    bad lives or were excommunicated, become vrykolakes after the soul separates from
    the body and an evil spirit enters the body, takes the soul's place, and assumes
    the dead person's shape.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The vrykolakas is said to keep the body as its dwelling-place, preserve it
    from corruption, move swiftly, cause alarms at night, and strike people with panic.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The vrykolakas is said not to remain solitary, but to make everyone who dies
    while it is about like itself, gathering a dangerous train of followers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The common practice of vrykolakes is described as sitting on sleepers and
    causing agonizing oppression by their enormous weight; the sufferer may die and
    become a vrykolakas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If someone perceives the sleeper's torment and fires a gun, the report of
    firearms frightens the vrykolakas away before it completes its purpose.
  category: sequence
  evidence_refs:
  - ev:7
