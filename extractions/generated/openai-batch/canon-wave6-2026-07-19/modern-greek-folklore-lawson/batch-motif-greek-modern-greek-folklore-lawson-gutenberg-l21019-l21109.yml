canonical_text:
  quote: ''
  summary: Lawson argues that Greek funerary practice, whether cremation or inhumation,
    has chiefly aimed at dissolving the dead body for the benefit of the dead. He
    contrasts fire as quicker and surer than soil, cites a Zacynthian lament describing
    bodily dissolution within forty days, and connects the fortieth-day memorial feast
    with forgiveness or release from curses that might delay dissolution.
  language: English, with quoted Greek lament lines
  quote_policy: summarized
