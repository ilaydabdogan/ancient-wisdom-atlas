canonical_text:
  quote: ''
  summary: 'The passage surveys recurring Modern Greek Callicantzari story patterns:
    a mule-driver’s sack-like disguise, a wife’s sieve-counting delay, Epiphany hallowing
    and blessed water driving Callicantzari away, a mill story in which a clever stepdaughter
    escapes monsters and a less shrewd half-sister is punished, and a midwife story
    in which a Callicantzaros demands a male child and is deceived by a wax alteration.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mule driver outwits Callicantzari by lying flat on the mule’s back and making
    himself look like a sack of meal; in many tellings the cock crows when he reaches
    home and the Callicantzari flee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wife delays Callicantzari by bargaining that they count the holes in a sieve;
    in other versions they avoid saying “three” and keep counting “one, two” until
    cock-crow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Epiphany hallowing is described as a signal for the final departure of
    the Callicantzari throughout Greece.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hallowing ceremony involves blessing waters with a cross and, in many
    districts, sprinkling people, houses, cornfields, and vineyards with blessed water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Callicantzari are represented as fearing the priest’s censer and sprinkling-vessel
    and as saying that purified streams have polluted them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In current tales, priestly intervention is less common than rescue by neighbours
    with firebrands or an ending marked by the crowing of the black cock.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A wicked stepmother sends a girl to a mill during the dangerous Twelve Days,
    intending that she fall prey to the Callicantzari.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the mill the girl finds the miller bound to his chair or dead with fright
    and the Callicantzari standing around him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Callicantzari seize the girl and quarrel over which one will have her;
    she says she will be wife to the one who brings the best bridal array.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: While the Callicantzari search for clothing and jewels, the girl grinds the
    corn and sends each returning Callicantzaros on another errand.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The girl loads the mule, dresses in the gold and jewels, lies flat on the
    saddle under a sack, eludes pursuing Callicantzari, and reaches home safely.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The wicked stepmother sends her own daughter to the mill the next evening;
    because she is less shrewd, she is sexually victimized, killed and eaten, or in
    one version clothed in mule skin with a necklace of entrails.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A midwife is summoned at night during the Twelve Days and is carried away
    by, or accompanies, a figure who proves to be a Callicantzaros.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Callicantzaros tells the midwife that she will be rewarded if his wife
