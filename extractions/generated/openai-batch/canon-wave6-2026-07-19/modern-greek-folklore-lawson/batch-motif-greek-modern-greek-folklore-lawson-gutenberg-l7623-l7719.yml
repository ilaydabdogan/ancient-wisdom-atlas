  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the Callicantzaros’ cave or house, his wife gives birth to a female child.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The midwife warms candle wax, forms a model of male organs, fastens it to
