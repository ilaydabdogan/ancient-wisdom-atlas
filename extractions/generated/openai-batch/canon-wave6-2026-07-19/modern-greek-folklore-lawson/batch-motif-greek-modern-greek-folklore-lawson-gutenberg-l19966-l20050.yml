  summary: Lawson discusses how the term Alastores may have shifted from a general
    name for revenants to a name for avenging revenants, aided by association with
    ἄλαστος. He treats Alastor and Miastor as terms connected with avenging dead,
    pollution, and torment, and cites uses involving Orestes, Ajax’s enemies, Philip
    of Macedon, the Nemean lion, and supernatural foes in tragedy.
