  summary: 'The passage discusses a modern Greek folk-story while cautioning that
    its sea-god and trident allusion may be a learned interpolation. It identifies
    parallels with Aristomenes, Scylla and Nisus, and Icarus, then reflects on how
    ancient mythic motifs may recur in modern folk-tales. It then summarizes a story
    placed under Pan: a priest’s goatherd son receives a gold-skinned kid from Panos,
