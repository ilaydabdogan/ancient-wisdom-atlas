- id: claim:6
  claim: The passage claims that the protective functions of the older sea god have
    more generally been transferred to St Nicolas among seamen.
  claim_level: same_function
  target: Older Greek sea deity and St Nicolas as mariners' helper
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
