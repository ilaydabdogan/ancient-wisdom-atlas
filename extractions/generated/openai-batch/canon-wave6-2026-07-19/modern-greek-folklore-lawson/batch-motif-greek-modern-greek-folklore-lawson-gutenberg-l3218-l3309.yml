- id: motif:7
  label: Sea god transforms a man into a dolphin until maiden marriage
  taxonomy_refs:
  - shapeshifter
  basis: The sea god strikes the king with a three-pronged fork and changes him into
    a dolphin until he finds a maiden willing to become his wife; the princess's marriage
