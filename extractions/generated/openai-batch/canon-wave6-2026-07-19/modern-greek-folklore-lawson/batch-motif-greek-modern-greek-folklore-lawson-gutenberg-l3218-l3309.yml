  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage itself notes reliance on Bernhard Schmidt for this material.
- id: motif:9
  label: Marine divine functions transferred to a Christian saint
  taxonomy_refs: []
  basis: The passage says the functions of the older sea god have more generally been
