candidate_motifs:
- id: motif:1
  label: Thunderbolt as divine vengeance
  taxonomy_refs:
  - divine_judgment
  basis: The passage explicitly describes the thunderbolt as an instrument of divine
    vengeance and gives a local lightning saying in which God burns a devil.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is extracted from Lawson's report of modern Greek belief, not from
    a directly transcribed oral performance.
- id: motif:2
  label: Rebels assaulting heaven or deity from a mountain
  taxonomy_refs:
  - ascent
  basis: The giants climb a mountain, hurl rocks at God, and one rebel attempts to
    reach heaven with tied reeds.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The purpose of the reed ascent is said not to appear in the story.
- id: motif:3
  label: Divine lightning defeat and confinement of giant rebels beneath a mountain
  taxonomy_refs:
  - divine_judgment
  basis: God's thunderbolts kill many giants, burn one rebel to ashes, and the remaining
    rebels are condemned to live beneath a mountain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The account is a summarized folktale rather than a full narrative transcript.
- id: motif:4
  label: Survival of an older deity through Christian substitution and local names
  taxonomy_refs: []
  basis: The passage says Zeus has been superseded by the Christian God while retaining
    mythic attributes, and cites local expressions invoking the god of Crete or Zeus.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The author notes that users of the expressions no longer know their original
    force.
- id: motif:5
  label: Strength located in three body hairs and lost through spousal betrayal
  taxonomy_refs: []
  basis: The strong king's strength lies in three hairs on his breast, and his wife
    is bribed to cut them off, enabling his capture.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No available taxonomy reference directly names this body-strength motif.
- id: motif:6
  label: Escape from burial pit by attaching bird wings
  taxonomy_refs:
  - ascent
  basis: The imprisoned king fastens a dead bird's wings to his hands and flies up
    out of the pit, carrying away the mound.
  evidence_refs:
