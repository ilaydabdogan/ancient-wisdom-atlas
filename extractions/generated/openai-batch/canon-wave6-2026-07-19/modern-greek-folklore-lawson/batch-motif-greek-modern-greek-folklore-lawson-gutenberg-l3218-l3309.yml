canonical_text:
  quote: ''
  summary: The passage discusses lightning and thunderbolts as divine punishment in
    modern Greek belief, recounts a Zacynthos story of giants rebelling against God
    and being defeated by thunderbolts, and comments on the survival of Zeus's name
    and attributes. It then presents, with caveats, a Zacynthos folktale involving
    a strong king, betrayal through the cutting of three hairs, escape from a pit
    by bird wings, transformation into a dolphin by a trident-bearing sea god, and
    release through marriage to a princess. The passage closes by describing attributes
    of the sea god and the transfer of marine protective functions to St Nicolas.
  language: English
  quote_policy: summarized
