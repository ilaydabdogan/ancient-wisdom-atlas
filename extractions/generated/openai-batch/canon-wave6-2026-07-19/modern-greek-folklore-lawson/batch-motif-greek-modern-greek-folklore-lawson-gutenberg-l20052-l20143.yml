canonical_text:
  quote: ''
  summary: The passage argues philologically that Miastor should be understood actively
    as an avenger, tormentor, fiend, or destroyer rather than as a polluted person.
    It then discusses προστρόπαιος as a term connected with avenging blood, blood-guilt,
    purification, and the turning of divine anger or punishment upon someone, using
    examples from tragedy and oratory.
  language: English with Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reported lexical theory treats Miastor as denoting a polluted and blood-guilty
    person because pollution was believed to be contagious.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aegisthus and Clytemnestra are cited as persons called Miastores in passages
    from Aeschylus and Euripides; the passage notes that they were authors of Agamemnon's
    death and were polluted, while questioning whether Miastores means 'polluted.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Orestes is said to call Helen the Miastor of Greece; the passage interprets
    this as an active designation, a tormentor or fiend who harmed ships, men, and
    cities, not as a polluted person or polluter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peleus is said to apply Miastor to Menelaus in connection with Achilles' death,
    treating Menelaus as a murderer or fiend-like destroyer rather than as a polluter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author concludes that Miastor developed from the active meaning 'Avenger'
    to broader meanings such as 'Tormentor' or 'Fiendish Destroyer.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lexicons are reported as explaining προστρόπαιος as the god or daimon to whom
    a murdered person turns for vengeance, hence as an avenger, and also as applied
    to the manes of murdered persons visiting vengeance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author objects that this passive explanation of προστρόπαιος would awkwardly
    imply that a murdered person turns for vengeance toward himself when the term
    is extended to the murdered person's manes.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The author proposes two senses of προστρόπαιος: an active sense of turning
    something toward or against someone, and a middle sense of turning oneself toward
    someone.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In an example from Aeschines, Demosthenes is accused of wilful perjury and
    described as having turned the anger of the gods invoked in his oath upon his
    own head rather than upon the city.
  category: action
  evidence_refs:
  - ev:7
