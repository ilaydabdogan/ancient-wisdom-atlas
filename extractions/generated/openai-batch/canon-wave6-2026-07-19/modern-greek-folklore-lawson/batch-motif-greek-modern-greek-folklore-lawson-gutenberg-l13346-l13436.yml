  quote: ''
  summary: Lawson describes modern Greek divination from roadside encounters, including
    unlucky and lucky persons or animals and averting gestures, then compares some
    beliefs with classical evidence. He separately discusses bird augury, presenting
    birds as especially suited to serve as messengers between gods and men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A branch of divination reads omens of success or failure from objects or beings
    a traveller meets on the road; the passage identifies this as ‘meeting’ (ἀπάντημα).
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Meeting a priest is described as unlucky; for men it is said to threaten virility
    unless precautions are taken, and the omen is worse if the priest is riding a
    donkey.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Meeting a witch is described as unfortunate, and because any old woman may
    be a witch, the sign of the cross is advised before passing her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cripple is described as ominous of failure in an enterprise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: An insane person is usually counted as a good omen in the modern belief described,
    because insanity is said to imply close communion with powers above.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A pregnant woman is described as a fortunate encounter indicating that the
    journey will bear fruit; the peasant acknowledges her by bowing, baring his head,
    or wishing her a good confinement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The hare, rat, stoat, weasel, and any kind of snake are listed among animals
    that most commonly forebode ill.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Aetolia the sight of one of these animals, or the trail of a snake across
    the path, may send a peasant home; others proceed after crossing themselves or
    spitting three times.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage cites classical evidence for similar ominous road encounters involving
    the ass, the weasel crossing a path, and the snake; it also notes that the ancient
    interpretation of meeting an insane person differed from the modern one.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bird observation is treated as closely allied to roadside encounter divination
    but also as a separate branch of augury.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The modern folk theory reported in the passage holds that birds are better
    suited than other animate beings to be messengers between gods and men because
    of rapid flight and keen, extended vision.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The branch of bird divination is said to concern chiefly large and predatory
    birds, associated with the term οἰωνός and described as large, strong, intelligent,
    and solitary.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Plutarch is quoted as saying that God can prompt birds’ movements, cries,
    songs, pauses, and flights so as to signal whether men should check or pursue
    their actions.
  category: speech
  evidence_refs:
  - ev:7
