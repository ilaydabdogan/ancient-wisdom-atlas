canonical_text:
  quote: "“Receive thou, Scamander, my virginity.”"
  summary: The passage discusses Greek wedding customs as rites with initiatory and
    sacramental significance. Newlyweds may view a representation of the sacred marriage
    of Zeus and Hera; Hera’s maiden and bride cult titles are interpreted as reflecting
    women’s life-stages. Wedding preliminaries include sacrifice to Zeus Teleios and
    Hera Teleia, ablution, and a first night called the mystic night. A Troad custom
    is cited in which maidens bathe in the Scamander and address the river-god before
    marriage.
  language: English with Greek terms
  quote_policy: quoted
