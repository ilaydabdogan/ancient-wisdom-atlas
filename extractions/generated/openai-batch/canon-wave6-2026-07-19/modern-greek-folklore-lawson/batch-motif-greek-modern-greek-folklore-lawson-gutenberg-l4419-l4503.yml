canonical_text:
  quote: ''
  summary: The passage discusses modern Greek Charos in relation to ancient Charon,
    arguing that the ferryman image was likely only one ancient popular guise. It
    summarizes Zacynthos songs and dirges in which Charos appears as ferryman, as
    master of a black boat, or as a corsair-like carrier of the dead, and it contrasts
    the river of death as an impassable ferry-crossing with a Lethe-like stream whose
    water causes forgetfulness.
  language: English
  quote_policy: summarized
