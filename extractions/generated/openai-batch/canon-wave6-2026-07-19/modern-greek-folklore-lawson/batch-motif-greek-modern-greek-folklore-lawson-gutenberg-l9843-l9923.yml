canonical_text:
  quote: ''
  summary: The passage explains the Greek demonological term for genii, compares Greek
    and Roman beliefs in localized spirits, and describes genii attached to caves,
    straits, trees, buildings, and especially houses. It emphasizes house genii appearing
    as snakes or reptiles, living in foundations, receiving bread and milk offerings,
    being greeted quietly, and bringing disaster if harmed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the term στοιχεῖα became useful in Greek demonological
    classification but did not represent a new popular superstition.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scene from the Aeneid is summarized in which a snake appears during Aeneas'
    memorial feast for Anchises, tastes offerings, and is honored with fresh sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Servius is cited as saying that every place has a genius and that such a genius
    usually manifests as a snake.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage identifies Lamia as a genius of a dark cave, the Gorgon as a genius
    of straits, and Dryads as genii of the trees they inhabit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The life of each Dryad is described as bound to the life of her tree, so that
    when the tree decays her life also ends.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A modern woodman is said to call trees inhabited by Nereids στοιχειωμένα δέντρα,
    meaning trees haunted by genii.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that a genius and its haunted object are closely united,
    but that a genius may migrate to another abode if the first dissolves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Genii are divided according to habitation into those of buildings, water,
    mountains, caves and desert places, air, and human beings.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Building genii are described as widely acknowledged in Greece, appearing in
    various forms and serving as guardians of buildings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The genius of a house is said to appear almost always as a snake, lizard,
    or other reptile and to dwell permanently in the foundations.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Holes or crevices in cottage floors may be regarded as entrances to the house
    genius' home, and peasants have sprinkled bread-crumbs around such holes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A householder may combine observances to a Christian saint and a pagan tutelary
    power, including a milk libation around the aperture leading to the genius' subterranean
    home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: If the milk causes a snake to emerge, its appearance is greeted with quiet
    delight or a few quiet words of welcome, and it must not be frightened.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Physical harm to the guardian snake is said to bring swift and terrible consequences:
    the house may fall, or the offender may die in the same way the snake was killed.'
  category: sequence
  evidence_refs:
  - ev:9
