  summary: The passage describes modern Greek folk practices in which saints' names
    are linked to their powers, saint-days carry taboos and cures, and many saints
    are assigned specialized functions. It then characterizes worship as often reciprocal
    or bargaining-oriented, with gifts promised for divine help, and quotes a Cretan
    monastic account comparing popular expectations of God, Our Lady, and the saints
    to Homeric gods who intervene in human affairs.
  language: English with Greek terms and phrases
