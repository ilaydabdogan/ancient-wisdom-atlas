canonical_text:
  quote: ''
  summary: 'The Shee an Gannon seeks the king of Erin''s daughter and is given a lethal
    task: discover why the Gruagach Gaire stopped laughing. He takes service with
    the Gruagach as a cowherd, deliberately drives golden cattle into a giant''s land,
    kills a five-headed giant, keeps the giant''s tongues, and returns with the cattle.
    A rival takes the severed heads and claims credit. The Shee an Gannon then forces
    the Gruagach to begin explaining the loss of his laughter, starting with the appearance
    of a slender brown hare in his household.'
  language: English
  quote_policy: summarized
