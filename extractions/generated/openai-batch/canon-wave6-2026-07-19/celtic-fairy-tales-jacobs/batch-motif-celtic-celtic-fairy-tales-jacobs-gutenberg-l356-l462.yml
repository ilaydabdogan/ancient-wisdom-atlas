canonical_text:
  quote: '"My horse, and bridle, and saddle!"'
  summary: Guleesh, a boy in County Mayo, wishes he could leave his place like the
    freely moving moon. He follows a noisy fairy host into a nearby rath, imitates
    their cry for a horse, bridle, and saddle, and receives a gold-bridled, silver-saddled
    horse. He rides with the little people across the sea by a spoken command and
    reaches France. A fairy spokesman says they intend to carry off the French king's
    daughter from her wedding and need Guleesh because he is flesh and blood and can
    carry her behind him. The group enters the palace invisibly, where the wedding
    feast, altar, bishops, and assembly are present.
  language: English
  quote_policy: quoted
