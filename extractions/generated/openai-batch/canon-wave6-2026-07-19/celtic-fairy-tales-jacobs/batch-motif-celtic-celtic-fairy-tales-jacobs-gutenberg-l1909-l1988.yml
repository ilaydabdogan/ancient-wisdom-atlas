canonical_text:
  quote: ''
  summary: Macdonald promises a reward to a tailor who will make a pair of trews by
    night in a reputedly haunted ruined church. The tailor works there by candlelight
    on a gravestone while a great humanlike apparition rises progressively through
    the pavement and challenges him with repeated questions. The tailor keeps sewing,
    finishes before the apparition fully emerges, flees with the trews to Saddell
    Castle, and shuts the gate. The apparition strikes the wall and leaves five finger-marks.
    Macdonald pays the tailor, though some stitches are long.
  language: English
  quote_policy: summarized
