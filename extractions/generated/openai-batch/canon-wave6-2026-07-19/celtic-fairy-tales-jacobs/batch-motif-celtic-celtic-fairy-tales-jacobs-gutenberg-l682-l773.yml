canonical_text:
  quote: ''
  summary: Guleesh and the priest conceal a speechless royal girl at the priest's
    house under a false identity. Guleesh repeatedly visits her, learns to communicate
    with her by signs, grows attached to her, and eventually returns on November night
    to the old rath hoping to encounter the sheehogues again and recover her speech.
    After a long vigil in a frosty night landscape, a whirlwind enters the rath with
    the sheehogues in it, and Guleesh listens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guleesh and the priest agree to say the girl is the priest's brother's daughter
    visiting from another county, to describe her as dumb, and to keep others away
    from her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl is told the plan and indicates gratitude with her eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Guleesh tells his people that he had been asleep at the foot of a ditch and
    had spent the night there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The priest's neighbors wonder about the girl's sudden arrival and about Guleesh's
    changed behavior and frequent visits to the priest's house.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The girl remains dumb and silent, but communicates with Guleesh through hand
    and finger movements, eye winks, mouth movements, laughter, smiles, and other
    signs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Guleesh wants to send the girl back to her father, but neither he nor the
    priest knows the route; the priest sends letters to the king of France through
    traveling traders, but none arrives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Over many months Guleesh falls deeper in love with the girl, believes she
    likes him, fears the king may take her back, and asks the priest to stop writing
    letters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a year, on November night, Guleesh remembers the earlier night when
    the whirlwind and sheehogues came, and decides to stand in the same place to see
    or hear something that may restore Mary's speech.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the old rath, Guleesh waits by a grey old flag in a calm night with moonlight,
    fog, insect sounds, wild geese, plover calls, stars, and frost.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: After several hours, Guleesh hears an approaching sound compared successively
    to waves, a waterfall, and a storm in treetops; then a whirlwind bursts into the
    rath with the sheehogues in it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The whirlwind passes suddenly; Guleesh recovers himself and listens for what
    the sheehogues will say.
  category: action
  evidence_refs:
  - ev:9
