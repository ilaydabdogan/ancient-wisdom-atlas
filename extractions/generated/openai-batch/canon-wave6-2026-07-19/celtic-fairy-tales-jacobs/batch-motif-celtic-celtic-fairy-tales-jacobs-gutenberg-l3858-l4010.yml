canonical_text:
  quote: ''
  summary: A Leinster king requires his favorite story-teller to tell a new story
    every night. One morning the story-teller cannot devise a new tale. He and his
    wife encounter a lame old beggar with dice and gold. The story-teller gambles
    repeatedly, losing his money, possessions, wife, and finally himself. The old
    man uses a cord and wand to turn him into a hare; the wife sets hounds on him
    within a walled field until the old man restores him to human form. The passage
    ends with the story-teller asking the old man who he is and why he torments him.
  language: English
  quote_policy: summarized
