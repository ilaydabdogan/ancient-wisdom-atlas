canonical_text:
  quote: ''
  summary: Conall recounts being carried by a boat to an island, finding a woman forced
    to cook her child for a one-eyed giant, hiding in the giant's caldron, escaping
    after being scalded, killing the sleeping giant with the giant's own spear through
    the eye, and bringing the woman and child back to dry land. The king's mother
    recognizes herself as the woman and the king as the rescued child; Conall is rewarded
    with a brown horse and treasure and returns home.
  language: English
  quote_policy: summarized
