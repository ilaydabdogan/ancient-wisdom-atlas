canonical_text:
  quote: "“You will never see the raven again, for I am that raven.”"
  summary: In “The Battle of the Birds,” a wren and a mouse provoke a wider contest
    among birds and creatures. A king’s son witnesses the last combat, saves a black
    raven from a snake, and is carried by the raven through remote landscapes to houses
    of hospitality. The raven later appears as a handsome lad freed from druidic spells
    and gives the king’s son a bundle, warning him not to open it until he reaches
    the place where he most wishes to live. The king’s son opens it too early, releasing
    a castle and orchard; a giant restores them to the bundle in exchange for the
    king’s son’s future son at seven years of age. At the desired place the bundle
    produces the castle again, with a maiden whom the king’s son marries. After seven
    years the giant returns to claim the child.
  language: English
  quote_policy: quoted
