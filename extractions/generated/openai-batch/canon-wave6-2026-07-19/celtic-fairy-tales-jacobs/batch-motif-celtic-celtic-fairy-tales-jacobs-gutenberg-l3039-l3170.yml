canonical_text:
  quote: ''
  summary: Olwen appears at the house, and Kilhuch declares his love. Olwen says he
    may win her if he grants whatever her father asks. At Yspathaden Penkawr's castle,
    the father attacks the visitors with three poisoned darts, each caught and returned
    against him. He then sets a chain of difficult requirements involving Turch Truith's
    comb and scissors, the hound Drudwyn, Mabon son of Modron, and Eidoel son of Aer.
    Arthur and the warriors of Britain set out to find Eidoel, who is imprisoned by
    Glivi, and Glivi agrees to release him and give aid.
  language: English
  quote_policy: summarized
