canonical_text:
  quote: ''
  summary: The king's son, aided by Auburn Mary, climbs an extraordinary tree by using
    her disjointed bones as steps, obtains eggs, restores her with spring water but
    leaves her missing a little finger, then identifies and marries her. They flee
    from her giant father on a blue grey filly while she uses speaking apple pieces
    and obstacle-making objects from the filly's ear to delay the pursuit.
  language: English
  quote_policy: summarized
