canonical_text:
  quote: ''
  summary: Naois leaves Erin with Deirdre and his brothers for Alba, where they live
    happily in a tower near a loch. Connachar, King of Ulster, resolves to take Deirdre
    by force and uses a feast invitation carried by Ferchar Mac Ro to draw Naois and
    his brothers back. Deirdre resists the return and recounts a troubling dream of
    doves and hawks crossing the sea, but Naois agrees to go. Ferchar and his three
    sons swear protection. The party crosses by coracle to Erin, where Connachar delays
    receiving them, lodges them in a strangers' house, and sends Gelban Grednach to
    inspect Deirdre's appearance before deciding whether to seize her.
  language: English
  quote_policy: summarized
