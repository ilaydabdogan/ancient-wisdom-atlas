  quote: ''
  summary: The young lady thanks Guleesh for preparing and giving her a drink and
    for his kindness since her arrival in Ireland. She eats and speaks with the priest.
    Guleesh sleeps for another day and night under the remaining force of the herb,
    then returns to find the lady also asleep. He and the priest watch until she wakes
    with her speech restored. Guleesh continues visiting, their friendship grows,
    she prefers him, and they marry. The tale closes by reporting a life without care,
    sickness, sorrow, mishap, or misfortune until death, followed by a blessing.
