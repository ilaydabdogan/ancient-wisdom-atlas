canonical_text:
  quote: ''
  summary: Hudden and Dudden seize Donald O'Neary, tie him in a meal-sack, and carry
    him toward the Brown Lake of the Bog. While they stop at an inn, Donald tricks
    a farmer into believing the sack is connected with marriage to a jeweled princess;
    the farmer changes places with him and gives Donald his cattle. Hudden and Dudden
    throw the sack, now containing the farmer, into the Brown Lake. Donald later appears
    with the cattle and tells Hudden and Dudden that the lake leads to the Land of
    Promise, rich in cattle and grass. He points to reflected clouds in the lake;
    Hudden and Dudden jump in and never return, while Donald prospers with cattle
    and sheep.
  language: English
  quote_policy: summarized
