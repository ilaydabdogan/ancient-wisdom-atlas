canonical_text:
  quote: ''
  summary: 'In “The Tale of Ivan,” Ivan leaves home for work, serves a master for
    three years, and receives three counsels instead of wages. On his return he follows
    the counsels: he stays on the old road, avoids lodging where an old host has a
    young wife, exposes a murder plot through a token cut from a monk’s robe, and
    returns a found purse of gold to its owner. His honesty leads the lord to employ
    him in place of a dishonest gate servant.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ivan leaves his wife because work is scarce, travels east, and agrees to serve
    a farmer for three pounds for a year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'At the end of three successive years, Ivan receives advice from his master
    instead of wages: keep to the old road, avoid lodging where an old man is married
    to a young woman, and act honestly.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before Ivan leaves, his master gives him a cake for his wife and tells him
    to break it only when he and his wife are most joyous together.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: On the way home Ivan meets three merchants; when they take a new road, he
    keeps the old one, and his shouting helps drive off robbers who attack the merchants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At a lodging place, Ivan asks to see the host, finds him to be a weak old
    man, and refuses to lodge there because the hostess is young.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hostess and a monk have plotted to kill the old host and blame the lodgers.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: From next door Ivan sees and hears through a hole in the wall, observes the
    murder circumstances, and cuts a round piece from the monk’s robe through the
    hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the merchants are accused and imprisoned, Ivan produces the robe-cloth
    evidence; the merchants are released, and the hostess and monk are hanged.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After parting from the merchants, Ivan goes straight home to his wife.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ivan’s wife has found a nameless purse of gold that she thinks belongs to
    the great lord; Ivan says they should give it to the lord, and they leave it with
    the castle gate servant.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the great lord later stops at their house for water, the missing purse
    is discussed, the gate servant is exposed, and Ivan is made the lord’s servant
    in the thief’s place.
  category: sequence
  evidence_refs:
  - ev:10
