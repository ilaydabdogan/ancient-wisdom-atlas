canonical_text:
  quote: ''
  summary: 'A giant demands the king''s true son and detects false substitutes by
    testing what each boy says his father would do with a rod. After killing the cook''s
    son and the butler''s son, the giant recognizes the king''s son by his royal answer,
    takes him home, and raises him. The king''s son secretly meets Auburn Mary, the
    giant''s youngest daughter, who tells him to choose her as bride instead of her
    elder sisters. The angry giant imposes three tasks before the marriage: cleaning
    a long-neglected byre, thatching it with varicolored birds'' down, and fetching
    unbroken magpie eggs from a fir tree beside a loch. Auburn Mary aids the first
    two tasks while the king''s son sleeps.'
  language: English
  quote_policy: summarized
