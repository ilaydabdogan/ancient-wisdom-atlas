canonical_text:
  quote: There is a great beast with three heads in the loch
  summary: A herdsman defeats a magical crone and finds treasure. Later he learns
    that a three-headed beast in a loch receives a yearly victim and that the lot
    has fallen on the king's daughter. A General who is expected to rescue her flees
    when the beast appears. The herdsman, mounted on a black horse and accompanied
    by a black dog, cuts off one head on the first day and another on the second.
    The princess gives him tokens, but the General threatens her and takes credit
    for the severed heads.
  language: English
  quote_policy: quoted
