canonical_text:
  quote: ''
  summary: 'The passage first concludes Ivan’s episode: Ivan rejoices and opens his
    old master’s cake, finding his three years’ wages inside. The passage then begins
    “Andrew Coffey”: Andrew, a local man who knows the barony well, becomes lost in
    an unfamiliar part of the demesne during cold rain, finds an unexplained cabin
    with a fire and chair, hears an unseen voice demanding a story, and discovers
    his horse missing. A man emerges from a cupboard; Andrew recognizes him as Patrick
    Rooney, believed to have gone overboard years before. Andrew flees, hides in a
    tree, sees four men bring Patrick in a long box, set up a fire and a spit, and
    sling Patrick over it. Patrick names Andrew as the one to tend him; Andrew keeps
    the fire even and turns the spit while Patrick warns and threatens him. At the
    end of the passage Patrick begins unslinging himself, with glaring eyes and glistening
    teeth.'
