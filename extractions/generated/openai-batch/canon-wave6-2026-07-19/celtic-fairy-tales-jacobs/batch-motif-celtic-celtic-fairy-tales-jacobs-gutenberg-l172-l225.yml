    large Gaelic oral tradition about national and mythical heroes, compares its extent
    to Russian hero-songs, notes the long attestation of Irish tales and examples
    such as Deirdre, Finn, and Cuchulain, describes selecting and adapting tales with
    collaborators, and frames the volume as a vehicle of Celtic imaginative influence
    for English, Celtic, and Saxon children.
