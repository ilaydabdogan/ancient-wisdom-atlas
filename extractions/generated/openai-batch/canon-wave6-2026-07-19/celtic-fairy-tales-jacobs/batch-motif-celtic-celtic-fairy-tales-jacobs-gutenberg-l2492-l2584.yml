canonical_text:
  quote: ''
  summary: In the tale opening of “Munachar and Manachar,” Munachar and Manachar pick
    raspberries, but Manachar eats the berries Munachar gathers. Munachar sets out
    to obtain a rod to make a gad for hanging Manachar. Each object, animal, or person
    he approaches demands that he first obtain another prerequisite, forming a cumulative
    chain that leads to a miller’s demand that he bring a sieve full of river water.
    Munachar cannot fill the sieve because the water runs out, and a passing crow
    says, “Daub! daub!”
  language: English
