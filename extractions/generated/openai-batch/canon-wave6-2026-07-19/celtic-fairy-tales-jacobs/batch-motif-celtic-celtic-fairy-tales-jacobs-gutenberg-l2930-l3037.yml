canonical_text:
  quote: ''
  summary: After Kilhuch’s mother dies, a briar with two blossoms on her grave marks
    the time when his father may remarry. His stepmother foretells that Kilhuch must
    marry Olwen or no one. Kilhuch asks King Arthur for Olwen and the aid of Arthur’s
    court. Arthur’s search fails, and Kay and other specially gifted companions join
    a quest. The party reaches a distant castle and receives a warning that earlier
    seekers did not return alive; Kay prevents a dangerous embrace by placing a log
    in the woman’s hands, which she crushes.
  language: English
  quote_policy: summarized
