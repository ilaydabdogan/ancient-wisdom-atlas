canonical_text:
  quote: ''
  summary: Guleesh joins a noisy company in a rath, hears them mock him, and overhears
    a voice saying that an herb by his own door, if boiled and given to the young
    woman, would make her well. After the company rises into the air and leaves, Guleesh
    searches at sunrise, finds a strange seven-branched herb with white sap, boils
    it, tests it on himself, and then gives it to the king’s daughter at the priest’s
    house. She sleeps heavily and later wakes able to speak.
  language: English
  quote_policy: summarized
