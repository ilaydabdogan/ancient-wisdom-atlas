    blessing and provisions. On the road he helps an ass trapped in a bog, protects
    a dog from boys, feeds a starving cat, and rescues a black cock from a fox; each
    animal joins his party. At night the group sleeps in a wood, wakes after the cock
    sees a light, and discovers six armed robbers feasting in a house. Jack quietly
    orders his companions to close ranks.
