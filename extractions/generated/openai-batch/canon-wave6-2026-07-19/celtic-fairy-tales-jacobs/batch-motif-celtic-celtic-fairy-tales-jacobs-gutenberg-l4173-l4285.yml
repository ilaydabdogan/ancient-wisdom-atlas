canonical_text:
  quote: '"I am Angus of the Bruff"'
  summary: A tattered harper-beggar enters a king's hall, mocks the royal harpers,
    and magically redirects violence and attempted executions. He later restores the
    story-teller to his wife, carriage, horses, and money, reveals himself as Angus
    of the Bruff, explains that magic caused the trouble, advises forgiveness, and
    leaves the story-teller with a tale that delights the King of Leinster.
  language: English
  quote_policy: quoted
literal_observations:
