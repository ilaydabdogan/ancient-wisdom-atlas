- id: obs:6
  text: The king ordered the beggarman hanged after the disorder among the harpers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the guards hanged the beggarman, they found him in the hall drinking
    ale, while the king's favourite brother was hanging at the gallows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A second attempted hanging resulted in the king's chief harper being found
    at the gallows instead of the beggarman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The captain of the guard gave up trying to hang the beggarman a third time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The beggarman said the people at the gallows would be found unharmed, vanished,
    and the story-teller found himself back where he had first met him, with his wife,
    carriage, and horses present.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The beggarman returned the story-teller's carriage, horses, money, and wife,
    but the story-teller did not want his wife or money back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The beggarman said the wife could not help her earlier behavior, revealed
