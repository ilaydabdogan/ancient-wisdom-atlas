  text: The doorkeeper saw a lank grey beggarman with a partly bared sword, wet old
    shoes, torn clothing, and a three-stringed harp.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The beggarman said he could play and told the story-teller that the story-teller
    would see everything while no man saw him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king admitted the harper and ordered his own harpers to play.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The beggarman judged the king's harpers' music less melodious than purring,
    beetle-buzzing, or scolding.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the harpers attacked the beggarman, their blows fell on one another instead.
  category: action
  evidence_refs:
