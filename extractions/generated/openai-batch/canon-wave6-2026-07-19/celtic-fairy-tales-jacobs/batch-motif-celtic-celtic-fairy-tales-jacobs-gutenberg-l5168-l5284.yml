canonical_text:
  quote: ''
  summary: A woman recognized as the true bride is awarded to the son of the king
    of Emania after rival princes abandon their claims in combat. After marriage and
    childbirth, her eldest sister Fair pushes her into the sea, where a whale swallows
    her and repeatedly casts her ashore under enchantment. A cowboy witnesses the
    act, overcomes a forgetfulness drink, and tells the husband how to kill the whale
    with a silver bullet at its single vulnerable spot. The rescued wife returns,
    Fair is set adrift in a barrel, and the cowboy is later fostered and married to
    the couple's daughter.
  language: English
  quote_policy: summarized
