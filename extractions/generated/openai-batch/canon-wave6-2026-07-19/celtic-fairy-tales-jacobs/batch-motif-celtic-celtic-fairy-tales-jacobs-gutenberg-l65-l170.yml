canonical_text:
  quote: ''
  summary: Front matter names Joseph Jacobs as selector and editor, gives a short
    Gaelic utterance to be said three times with closed eyes, and opens the preface.
    Jacobs explains his selection of Celtic fairy tales, names collection traditions
    in Ireland, Scotland, Wales, and Cornwall, describes rules and exceptions in choosing
    Gaelic and English-language tale sources, notes his use of translators and alterations,
    compares his editorial aim to Grimm and Asbjoernsen, and argues for recording
    Celtic storytelling while it remains vigorous.
