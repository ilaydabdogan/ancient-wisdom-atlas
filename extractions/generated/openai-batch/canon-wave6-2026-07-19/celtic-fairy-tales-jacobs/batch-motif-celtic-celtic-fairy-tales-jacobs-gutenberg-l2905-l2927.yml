  summary: The king realizes he has been speaking to Saint Kavin, makes the sign of
    the cross, kneels, and addresses him as a saint. Saint Kavin confirms his identity.
    The king's goose is restored and remains with him, while the saint supports the
    king until his death. Later, the goose mistakes a horse-eel for a trout and is
    killed by it; the eel does not eat the goose because Saint Kavin had touched it
    with blessed hands.
