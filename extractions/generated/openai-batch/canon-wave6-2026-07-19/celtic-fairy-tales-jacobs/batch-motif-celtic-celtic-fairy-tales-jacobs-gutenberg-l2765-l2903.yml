canonical_text:
  quote: ''
  summary: An aged King O'Toole can no longer hunt and is entertained by his goose,
    which also grows old. By a lake he meets a young man later identified as Saint
    Kavin in disguise. The saint offers to make the old goose as good as new in exchange
    for all the ground the goose first flies over. The king gives and keeps his word.
    The saint blesses the goose, restores her flight, receives the promised ground,
    and reveals he came to test the king.
