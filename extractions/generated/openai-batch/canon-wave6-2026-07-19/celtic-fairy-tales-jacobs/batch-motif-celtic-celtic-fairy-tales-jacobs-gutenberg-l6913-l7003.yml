  summary: The passage is a scholarly notes-and-references survey of Celtic folk-tale
    collection in Scotland, Wales, Cornwall, and Man. It emphasizes the importance
    of J. F. Campbell’s West Highland collections, later Scottish Gaelic collection
    efforts, the relative scarcity of Welsh, Cornish, and Manx materials, the close
    similarity between Scottish and Irish folk-tales, and the possible relation between
    anonymous folk-tales and named Celtic hero-tales such as those of Finn and Cuchulain.
  language: English
