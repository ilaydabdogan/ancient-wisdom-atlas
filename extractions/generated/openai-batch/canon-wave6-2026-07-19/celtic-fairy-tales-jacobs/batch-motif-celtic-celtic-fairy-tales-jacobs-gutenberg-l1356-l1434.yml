canonical_text:
  quote: ''
  summary: Conall recounts that, as a young hunter by a rocky shore, he fell into
    a cave-like place where a one-eyed giant kept goats. Threatened with being eaten,
    Conall deceived the giant by pretending to heal his blind eye, blinded him fully,
    hid through the night, escaped under the flayed skin of the giant's buck, survived
    a speaking ring by cutting off his own finger and throwing it into deep water,
    watched the giant drown after the ring, took the giant's gold and silver, and
    returned home. The king acknowledges Conall's missing finger and wisdom, but demands
    another harder tale to secure the eldest son's soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Conall says he was a young lad hunting on his father's seaside land, which
    was rough with rocks, caves, and rifts, and he saw smoke between two rocks.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: While looking at the smoke, Conall fell into a heather-filled place and did
    not know how to get out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A great giant arrived with two dozen goats and a buck at their head, and the
    giant tied the goats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The giant addressed Conall by name and said his knife had long been waiting
    for Conall's tender flesh.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Conall told the giant that he saw the giant was one-eyed, claimed to be a
    good leech, and offered to give sight to the other eye.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The giant drew a great caldron to the fire, heated water under Conall's direction,
    and Conall used heather while pretending to restore sight, leaving the good eye
    as bad as the other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After losing his sight, the giant stood in the mouth of the cave seeking revenge,
    while Conall stayed crouched through the night holding his breath.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the morning, the giant told Conall to let out the goats; Conall killed
    the buck and denied doing so when the giant suspected it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Conall let the goats out one by one, flayed the buck bag-wise, put his own
    limbs and head into the buck skin with the horns over his head, and went out while
    the giant mistook him for the buck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The giant offered Conall a ring; after Conall put it on, the ring answered
    the giant's call and revealed its location.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Conall cut off the finger wearing the ring, threw it into deep water, and
    the giant jumped into the sea after the speaking ring and drowned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the giant drowned, Conall took the giant's gold and silver, went home,
    and showed his missing finger as a sign.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The king called Conall wordy and wise, acknowledged the missing finger, said
