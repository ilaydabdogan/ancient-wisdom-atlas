canonical_text:
  quote: ''
  summary: 'Tom with the Goat-skin defeats armed opponents without killing them and
    wins the princess''s laughter. Redhead then directs him toward further dangers:
    first a man-eating wolf, which Tom controls by flute-playing and banishes, and
    then a flail hanging in hell, said to be useful against the Danes. Tom travels
    to hell after applying a greenish ointment, is received by imps and the big devil,
    and receives a red-hot iron flail that does not burn him.'
