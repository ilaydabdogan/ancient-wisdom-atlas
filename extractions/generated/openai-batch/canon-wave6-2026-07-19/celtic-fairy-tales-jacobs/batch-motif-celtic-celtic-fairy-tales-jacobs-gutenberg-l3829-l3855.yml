  quote: ''
  summary: A cowboy identifies himself as the true winner of the king of Erin's daughter
    and calls the Gruagach Gaire as witness. The Gruagach recounts the Shee an Gannon's
    feats, including guarding golden cattle, killing a giant and a wizard hare, reviving
    twelve sons, and receiving private secrets. The king verifies the giant's tongues,
    marries the Shee an Gannon to his daughter, imprisons and burns the deceiver,
    and the wedding lasts nine days.
