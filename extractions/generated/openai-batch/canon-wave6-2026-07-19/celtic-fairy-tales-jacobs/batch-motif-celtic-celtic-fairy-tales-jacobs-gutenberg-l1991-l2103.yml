canonical_text:
  quote: ''
  summary: Malcolm Harper asks a soothsayer to tell his future. The soothsayer reports
    a second-sight prophecy that Malcolm's daughter will be the cause of great bloodshed
    in Erin and the deaths of three famous heroes. After Deirdre is born, Malcolm
    has her hidden with a foster-mother in a covered hill dwelling in a distant mountain
    region. At sixteen, Deirdre admits a lost, cold, hungry hunter despite her guardian's
    reluctance; the hunter warns that others would not leave Deirdre hidden and names
    Naois, Allen, and Arden, describing their appearance and prowess.
  language: English
  quote_policy: summarized
