canonical_text:
  quote: ''
  summary: Arthur and his hosts pursue the Boar Truith and its seven young pigs from
    Ireland through Wales and Cornwall, obtaining a razor, scissors, and comb from
    the boar before driving it into the deep sea. Kilhuch and his allies bring the
    marvels to Yspathaden Penkawr; Kaw shaves Yspathaden violently, Yspathaden concedes
    Olwen to Kilhuch while saying that the loss of his daughter means his death, and
    Goreu beheads him. The hosts disperse, and Kilhuch wins Olwen as wife.
  language: English
  quote_policy: summarized
