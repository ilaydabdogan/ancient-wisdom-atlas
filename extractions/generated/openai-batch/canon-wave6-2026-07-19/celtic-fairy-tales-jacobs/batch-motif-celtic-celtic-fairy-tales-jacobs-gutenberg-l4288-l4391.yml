canonical_text:
  quote: ''
  summary: A poor fisherman bargains with a sea-maiden for future fish in exchange
    for his first son when the son reaches twenty. The son later leaves home with
    a tested sword and black horse, helps a dog, otter, and falcon by dividing a carcass,
    receives their promises of aid, enters service as a king's herd, encounters and
    kills giants on rich grazing land, and is greeted at a castle by a carlin.
  language: English
  quote_policy: summarized
