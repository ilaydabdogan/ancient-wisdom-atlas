canonical_text:
  quote: With the love that Connachar had for her, he wanted to marry Deirdre right
    off there and then, will she nill she marry him.
  summary: A hunter reports Deirdre's beauty to King Connachar and guides him to her
    secluded dwelling. Connachar brings Deirdre and her foster-mother to court, seeks
    to marry her despite her will, and grants her a year's delay. Later Deirdre sees
    the three sons of Uisnech, follows Naois, calls to him, and they meet and fall
    in love.
  language: English
  quote_policy: quoted
