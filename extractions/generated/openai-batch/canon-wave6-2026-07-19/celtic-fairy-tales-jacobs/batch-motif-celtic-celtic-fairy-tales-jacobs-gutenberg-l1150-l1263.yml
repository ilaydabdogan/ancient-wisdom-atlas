canonical_text:
  quote: ''
  summary: Conall Yellowclaw’s sons kill the son of a nearby king in Erin. The king
    offers to forgo revenge if Conall and his sons obtain the brown horse of the king
    of Lochlann. Conall accepts, departs with his sons, crosses the ocean to Lochlann,
    and seeks help from the king’s miller. The miller says the horse can only be obtained
    by theft and agrees to keep the attempt secret. Conall and his sons hide in five
    sacks of bran, are carried into the stable, make hiding holes, and repeatedly
    try to seize the horse. The horse’s noise prompts searches; eventually the king
    of Lochlann comes, tracks them, finds them, and Conall confesses that necessity
    drove him to attempt the theft.
  language: English
  quote_policy: summarized
