  text: The king asks whether Conall has ever been in a place as hard as seeing his
    sons hanged, and offers the soul of the youngest son if Conall can tell such a
    case.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Conall says that as a young lad his father sent him to bring home a cow that
    had calved; during snow he took the cow and calf into a herd's bothy.
  category: sequence
  evidence_refs:
  - ev:2
