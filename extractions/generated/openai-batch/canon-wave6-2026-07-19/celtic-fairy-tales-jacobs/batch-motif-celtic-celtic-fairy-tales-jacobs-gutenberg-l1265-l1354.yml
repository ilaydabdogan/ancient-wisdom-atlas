canonical_text:
  quote: tearing by the cats were harder than hanging to-morrow by the king of Lochlann
  summary: In a royal frame, the king challenges Conall to tell a perilous case as
    hard as the threatened hanging of his sons, offering release of a son in return.
    Conall recounts a youthful ordeal in which a band of cats led by a one-eyed fox-coloured
    head bard sing to him, demand rewards, consume a calf and cow, pursue him into
    a tree, and are finally driven off by a priest and men with spades. The king accepts
    the tale as freeing one son and asks for a harder tale to win another.
  language: English
  quote_policy: quoted
literal_observations:
