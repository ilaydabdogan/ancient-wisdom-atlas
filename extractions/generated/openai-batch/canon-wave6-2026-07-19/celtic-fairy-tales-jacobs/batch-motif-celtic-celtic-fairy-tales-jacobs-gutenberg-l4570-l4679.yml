canonical_text:
  quote: ''
  summary: The passage introduces Fin M'Coul as a renowned giant hero working on the
    Giant's Causeway as a bridge to Scotland. He returns to his wife Oonagh on Knockmany
    Hill because he fears Cucullin, a mighty rival giant seeking a trial of strength.
    Fin uses a thumb-in-mouth prophetic gesture to learn that Cucullin is approaching.
    Oonagh promises to help and sends a smoke-and-whistle invitation signal that Cucullin
    recognizes as a welcome to Cullamore.
  language: English
  quote_policy: summarized
