canonical_text:
  quote: ''
  summary: Cucullin creates a deep cleft later called Lumford's Glen, then enters
    Oonagh's household. Oonagh serves food that breaks Cucullin's teeth and claims
    only Fin and the child in the cradle can eat it. Fin, disguised as a child, eats
    a safe cake, stages a strength test with a stone and curds, and frightens Cucullin
    into leaving before Fin's supposed return. Cucullin admits he is no match for
    Fin and asks to feel the child's teeth before departing.
  language: English
