canonical_text:
  quote: ''
  summary: On a harvest holiday, Tom Fitzpatrick encounters a tiny old Lepracaun working
    by a hedge with a pitcher of heath beer. Tom captures him to force him to reveal
    hidden money. The Lepracaun points out a boliaun plant under which a crock of
    gold is said to be buried. Tom marks the plant with a red garter and releases
    him, but returns to find every boliaun in the large field marked with an identical
    garter.
  language: English
  quote_policy: summarized
