canonical_text:
  quote: ''
  summary: A little man among the sheehogues strikes the young woman and renders her
    unable to speak, then he and the others disappear into a rath. Guleesh tries to
    help the silent royal maiden, decides not to bring her to his father's house,
    and takes her instead to a friendly priest. The priest first mistakes the visit
    for a request for marriage, then hears Guleesh's account, agrees to lodge the
    young woman, and notes that they have no way to send her back to her father.
  language: English
  quote_policy: summarized
