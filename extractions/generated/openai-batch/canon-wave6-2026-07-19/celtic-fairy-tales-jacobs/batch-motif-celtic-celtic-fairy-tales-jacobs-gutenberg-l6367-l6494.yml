canonical_text:
  quote: ''
  summary: A giant pursues his daughter and the king's son; a bladder of water from
    the filly's ear becomes a large loch and drowns the giant. The daughter warns
    the king's son that any kiss will make him forget her, but an old greyhound jumps
    to his mouth and he forgets. She waits by a well, hides in an oak tree, and is
    later sheltered by a shoemaker. At the king's son's wedding, a flame rises from
    a wine glass and golden and silver pigeons appear; the golden pigeon recalls earlier
    shared deeds, restoring the king's son's memory. He chooses the giant's daughter,
    named Auburn Mary, as his bride.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The giant says his daughter's tricks are difficult, says his lever and mighty
    mattock would let him pass through rock, makes a road through the rock, and leaves
    the tools behind while a hoodie says they will steal them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The giant's daughter says she feels her father's breath burning her back and
    tells the king's son to look in the filly's ear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king's son finds a bladder of water in the filly's ear, throws it behind
    him, and a fresh-water loch twenty miles long and broad appears behind them; the
    giant enters it, sinks, and does not rise again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The giant's daughter tells the king's son to go to his father's house but
    not to let any man or creature kiss him, because a kiss would make him forget
    he had seen her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old greyhound in the house recognizes the king's son, jumps up to his mouth,
    and after that he does not remember the giant's daughter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The giant's daughter remains by the well where he left her, then climbs into
    an oak tree beside the well and lies in its fork overnight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shoemaker's wife goes to the well for water, sees the maiden's shadow
    in the well, mistakes it for her own, breaks the dish, and returns without water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shoemaker's daughter goes to the well and, in the same way, thinks herself
    lovable and returns home without bringing the drink.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shoemaker goes to the well, sees the maiden's shadow, looks up into the
    tree, sees her, invites her down, and takes her to his house with an offer to
    share what he has.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the day the king's son is to be married, the shoemaker goes to the castle
    with shoes, and the girl asks to see the king's son before the marriage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the wedding-room, the girl is given wine; when she is about to drink, a
    flame rises from the glass and a golden pigeon and a silver pigeon come out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Three grains of barley fall repeatedly; the silver pigeon eats them, and the
    golden pigeon tells him that if he remembered earlier tasks, he would share.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The golden pigeon names the deeds of clearing the byre, thatching the byre,
    and harrying the magpie's nest, and says a little finger was lost bringing the
    nest down.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The king's son remembers and knows who is before him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The king's son asks the wedding guests whether a person who finds an old key
