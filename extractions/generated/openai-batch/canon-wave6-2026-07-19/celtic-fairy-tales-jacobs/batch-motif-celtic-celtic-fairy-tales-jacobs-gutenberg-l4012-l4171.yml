canonical_text:
  quote: ''
  summary: A stranger invites the story-teller to accompany him, draws a man from
    a wallet, and then the story-teller finds himself invisibly observing Red Hugh
    O'Donnell's court. A lank grey beggarman who calls himself a juggler performs
    paid tricks with straws, his ear, and a silk thread that becomes a ladder into
    the heavens. O'Donnell's lads suffer injuries or death when imitating or failing
    in the tricks, but the juggler restores severed heads after payment. The beggarman
    then vanishes and moves swiftly to the court of Leinster's king, who is troubled
    because the story-teller is missing.
  language: English
  quote_policy: summarized
