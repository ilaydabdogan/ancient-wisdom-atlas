canonical_text:
  quote: ''
  summary: After Allen and Naois die, Duanan Gacha Druid reports the deaths of the
    sons of Uisnech to Connachar and dries the flood from the plain. Deirdre laments
    over the dead brothers, especially Naois. Connachar orders the three brothers
    buried side by side. Deirdre lies down beside Naois in the grave and dies. Connachar
    has her body moved to the other side of the loch, but fir shoots grow from the
    graves of Deirdre and Naois and unite above the loch; the king has them cut down
    twice before his wife stops him.
  language: English
  quote_policy: summarized
