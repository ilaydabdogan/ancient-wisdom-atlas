  quote: brought the summer along with him to the poor mother and the disabled brothers
  summary: Jack justifies retaliating against his master by recalling the harm done
    to his brothers. The community supports Jack, who threatens the master with a
    carving knife and demands double wages plus money for the brothers. After a small
    cut, the master agrees to pay. Jack later reveals he is not truly cruel, receives
    public approval, brings the money home to his mother and disabled brothers, and
    gains the name “Skin Churl Jack.”
