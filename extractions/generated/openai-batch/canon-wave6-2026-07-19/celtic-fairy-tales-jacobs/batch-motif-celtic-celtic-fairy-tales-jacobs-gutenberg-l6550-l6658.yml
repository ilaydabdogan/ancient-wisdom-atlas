canonical_text:
  quote: ''
  summary: 'The passage begins the tale of Tom, a poor widow''s son clothed in a goat-skin.
    Sent to gather firewood, he defeats three giants and receives magical gifts: a
    battle-winning club, a fife that compels dancing, and green ointment that prevents
    burning, scalding, or wounding. A proclamation announces that the King of Dublin
    will marry his melancholy daughter to whoever can make her laugh three times.
    Tom leaves for Dublin, overcomes mocking guards at the city gate, and arrives
    at the palace, where a red-headed rival challenges his claim before the king orders
    a test of his strength.'
  language: English
