  quote: ''
  summary: Editorial source, parallel, and remark notes for two tales. The notes identify
    sources for “Jack and His Comrades” and “Shee an Gannon and Gruagach Gaire,” compare
    the former to Grimm’s “Town Musicians of Bremen,” compare parts of the latter
    to “The Sea-Maiden,” “Fionn’s Enchantment,” and “The King of Albainn,” and discuss
    possible relations among Celtic folk-tale material, Finn hero-tale material, the
    Conte du Graal, and the Holy Grail legend.
  language: English
  quote_policy: summarized
