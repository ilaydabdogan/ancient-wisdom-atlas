  summary: After two elder brothers are harmed in service to the Gray Churl under
    a harsh bargain, the youngest son Jack takes the same service, adds protective
    clauses, and repeatedly exploits exact wording about food, sleep, blame, regret,
    and ploughing orders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor woman has three sons; the two elder sons are described as cunning and
    clever, while the youngest is called Jack the Fool by others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest son serves the Gray Churl of the Townland of Mischance and reports
    a bargain in which the first party to say he is sorry loses under the terms; the
    servant may lose wages and a strip of skin from his back.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eldest son says he was given little food, made to work hard, said he was
    sorry for the bargain, and returned disabled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The second eldest son goes to take the same service in order to punish the
    Gray Churl, but returns after a year miserable and helpless like his brother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jack takes service with the Gray Churl for one year and twenty pounds under
    the same terms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Jack adds terms that the master must pay additional wages if he stops Jack
    from doing an assigned task or blames him for obeying orders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: On his first day, Jack is poorly fed and heavily worked.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At dinner, Jack cuts and eats part of a goose being prepared for the parlour,
    then asks whether the master is sorry for the agreement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The master begins to object but stops himself and says he is not sorry for
    the agreement.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before going to the bog, Jack asks the mistress for his dinner and later supper
    in advance, and eats the bread, butter, milk, and supper immediately.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Jack asks the master what servants do after eating supper; when told they
    go to bed, he lies down in the stable-loft.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the master blames Jack for lying down, Jack invokes the wage clause and
    asks whether the master is sorry for the bargain; the master avoids saying so
    and promises payment later.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Jack is ordered to hold the plough; he literally pulls against the horses
    while a boy drives them and the plough skims the sod.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the master explains that holding the plough meant reddening the ground,
    Jack asks whether he is being blamed; the master remains silent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The master then orders Jack to redden the ground, says he is not sorry for
    the agreement, and Jack ploughs well for the rest of the day.
  category: sequence
  evidence_refs:
  - ev:8
