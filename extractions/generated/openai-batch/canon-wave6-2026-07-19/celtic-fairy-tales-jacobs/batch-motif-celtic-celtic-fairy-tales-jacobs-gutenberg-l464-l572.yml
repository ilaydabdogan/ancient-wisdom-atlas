canonical_text:
  quote: ''
  summary: Guleesh sees a richly adorned young woman weeping at a forced wedding.
    A little sheehogue explains that she does not love the intended husband and later
    makes her invisible at the altar, carries her away with Guleesh, and flees with
    the good people on magically summoned horses. After the flight over the sea to
    Erin and to Guleesh's house and rath, Guleesh invokes God and crosses the girl
    to himself; the horse is revealed as a plough-beam and the good people lose power
    to carry her off, though they threaten Guleesh.
  language: English
  quote_policy: summarized
