canonical_text:
  quote: the soul of the sea-maiden is in the egg
  summary: A herd-hero is recognized by the king's daughter after removing beast heads
    from a knot and producing her tokens, and he marries her. Later the sea-maiden
    seizes him into the loch. His wife uses harp-playing to make the sea-maiden bring
    him partly, then wholly, out of the water; he escapes by becoming a falcon, but
    the sea-maiden takes the wife. A soothsayer reveals that the sea-maiden can be
    killed only by reaching an island, pursuing a hind, a hoodie, and a trout, and
    breaking the egg that contains her soul. With the black horse and animal helpers,
    the hero obtains the egg, compels the sea-maiden to restore his wife, breaks the
    egg, and the sea-maiden dies.
  language: English
  quote_policy: quoted
