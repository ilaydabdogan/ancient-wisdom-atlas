canonical_text:
  quote: ''
  summary: 'Opening of “Fair, Brown, and Trembling”: King Hugh Curucha has three daughters.
    Fair and Brown attend church while Trembling is kept at home because of her beauty.
    An old henwife repeatedly gives Trembling fine clothing, adornments, and a mare
    so she can appear at the church door, while instructing her not to enter and to
    flee before she can be stopped or identified.'
  language: English
