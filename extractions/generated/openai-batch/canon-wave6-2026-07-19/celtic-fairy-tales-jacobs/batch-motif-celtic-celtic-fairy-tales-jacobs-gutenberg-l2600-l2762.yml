canonical_text:
  quote: '"She took the stab out, and Gold-tree rose alive, as beautiful as she was
    ever."'
  summary: In the tale, Queen Silver-tree asks a trout in a well who is the most beautiful
    queen and is told that her daughter Gold-tree is more beautiful. Silver-tree repeatedly
    seeks Gold-tree's death, first demanding her heart and liver, then using a poisoned
    stab, and finally bringing a lethal drink. Gold-tree is married abroad, apparently
    killed and revived when a second wife removes the poisoned stab, and Silver-tree
    dies when the drink she brings is forced on her.
  language: English
  quote_policy: quoted
