canonical_text:
  quote: And to this day the place is called Beth Gellert, or the Grave of Gellert.
  summary: Prince Llewelyn leaves his favorite greyhound Gellert behind during a hunt.
    Returning, he finds Gellert bloodied and the child's nursery in disorder, concludes
    that the hound killed his infant son, and stabs Gellert. A child's cry reveals
    the son safe beneath the cradle and a slain wolf nearby; Gellert had guarded the
    child and killed the wolf. Llewelyn buries Gellert outside the castle under a
    cairn, giving the place its name.
  language: English
  quote_policy: quoted
