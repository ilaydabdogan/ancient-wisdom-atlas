canonical_text:
  quote: ''
  summary: A woman working late at night is visited by a sequence of horned witches
    who enter her house, work wool, and place her under a spell. Ordered to make a
    cake, she goes to the well with a sieve and is aided by a voice later identified
    as the Spirit of the Well. Following its instructions, she tricks the witches
    into fleeing, then prepares counter-enchantments with feet-water, a blood-mixed
    cake, a woven cloth, and a barred door. When the witches return, the prepared
    objects refuse their demand for entry, and the household remains in peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rich woman stays awake late at night carding and preparing wool while the
    rest of the household sleeps.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A knock and a command to open the door are followed by a voice identifying
    itself as the Witch of one Horn; the mistress opens the door because she thinks
    a neighbor needs help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first witch enters with wool-carders, has one horn on her forehead, sits
    by the fire, and begins carding wool rapidly in silence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: More witches enter after repeated knocks until twelve horned women sit around
    the fire, the first with one horn and the last with twelve horns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The horned women card, spin, wind, and weave while singing an ancient rhyme;
    the mistress cannot move or cry out because their spell is upon her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: One witch addresses the mistress in Irish and orders her to rise and make
    a cake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mistress is told to carry water in a sieve; at the well she cannot retain
    the water and weeps until a voice tells her to plaster the sieve with yellow clay
    and moss.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The voice tells her to cry three times at the north angle of the house that
    the mountain of the Fenian women and the sky over it are on fire; after she does
    this, the witches flee to Slievenamon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Spirit of the Well tells the mistress to prepare the house against the
    witches’ enchantments; she sprinkles water used to wash her child's feet outside
    the door on the threshold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A cake made by the witches from meal mixed with blood drawn from the sleeping
    family is broken into pieces and placed in each sleeper’s mouth, after which the
    sleepers are restored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The mistress places the witches’ woven cloth half inside and half outside
    a locked chest and secures the door with a crossbeam fixed in the jambs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the witches return, they call on the feet-water, the door and beam, and
    the blood-mixed cake to open; each answers that it cannot, and the witches flee
    back to Slievenamon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A mantle dropped by one of the fleeing witches is kept by the family in memory
    of the night for five hundred years.
  category: object
  evidence_refs:
  - ev:6
