canonical_text:
  quote: ''
  summary: The henwife equips Trembling with extraordinary adornments and a white
    spotted mare. Trembling appears at church as a beautiful unknown lady, flees,
    and the prince of Emania obtains one of her shoes. The princes search Erin for
    the woman the shoe fits. Fair and Brown hide Trembling in a closet, but she speaks,
    tries the shoe, and it fits. The prince recognizes her, and Trembling returns
    with the henwife's aid in the same splendid form.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The henwife puts on the cloak of darkness, wishes for requested things, dresses
    Trembling, places the honey-bird and honey-finger on her shoulders, uses a hat
    and scissors, and golden hair flows over Trembling's shoulders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trembling chooses a white mare with blue and gold diamond-shaped spots, a
    gold saddle, and a golden bridle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mare appears before the door with a bird between her ears, and the bird
    sings from Trembling's mounting until her return home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fame of the beautiful strange lady brings princes and great men to church,
    each hoping to take her home after Mass.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The son of the king of Emania waits outside the church to catch the strange
    lady, while the crowd is so great that Trembling only comes inside the gate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the end of Mass, Trembling slips out and rides away, but the prince of
    Emania seizes her foot and keeps hold until the shoe is pulled from her foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Trembling returns home distressed about losing the shoe; the henwife says
