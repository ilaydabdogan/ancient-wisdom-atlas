    old clothes and works in the kitchen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fair and Brown report seeing the strange lady in grander array, with fine
    colors on herself and her horse, and a bird between the horse's ears that never
    stopped singing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The prince of Emania declares he will have the lady, while the other kings'
    sons say he must win her by the sword before calling her his own.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The prince of Emania and the other princes travel throughout Erin and search
    every house and every woman to find the one whom the shoe fits, without regard
    to wealth or rank.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some women try to make the shoe fit by cutting the great toe or padding the
