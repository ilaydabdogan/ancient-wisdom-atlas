canonical_text:
  quote: ''
  summary: Connla, son of Conn, encounters a Fairy Maiden visible only to him. She
    says she comes from deathless pleasure lands and calls him away. Conn summons
    the Druid Coran, whose spells drive her off temporarily, but she leaves Connla
    an inexhaustible apple that sustains him and increases his longing. After a month
    she returns, invites him into a crystal canoe, and Connla departs with her over
    the sea toward the setting sun; he is not seen again.
  language: English
  quote_policy: summarized
