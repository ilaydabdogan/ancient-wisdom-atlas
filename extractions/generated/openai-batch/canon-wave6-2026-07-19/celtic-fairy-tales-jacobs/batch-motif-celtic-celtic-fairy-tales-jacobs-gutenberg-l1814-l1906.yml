canonical_text:
  quote: ''
  summary: A shepherd at Lyn y Van Vach sees three maidens rise from the lake. After
    failed offerings of hard-baked and unbaked bread, a third bread pleases one maiden,
    who agrees to marry him if he can identify her among her sisters. She becomes
    his wife with lake cattle as her marriage portion, on condition that he not strike
    her three times without cause. After three such touches or blows at a christening,
    wedding, and funeral, she ends the marriage, recalls her cattle, returns with
    them into the lake, and later gives healing gifts to her grown sons.
  language: English
  quote_policy: summarized
