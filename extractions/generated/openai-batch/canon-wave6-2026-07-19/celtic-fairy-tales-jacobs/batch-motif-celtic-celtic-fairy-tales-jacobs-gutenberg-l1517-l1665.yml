canonical_text:
  quote: ''
  summary: Two prosperous farmers, Hudden and Dudden, envy their poor neighbor Donald
    O'Neary and kill his cow Daisy to drive him away. Donald sells Daisy's hide by
    making it appear to produce coins, returns with gold, and lets Hudden and Dudden
    believe hides are worth their weight in gold. They slaughter their own cattle
    and take hides to the fair, where traders and townspeople punish them for demanding
    gold.
  language: English
  quote_policy: summarized
