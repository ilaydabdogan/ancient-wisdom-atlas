canonical_text:
  quote: ''
  summary: 'Gelban spies on Deirdre through a door opening and is wounded by Naois,
    who throws a die through the hole and knocks out Gelban''s eye. Connachar orders
    armed men to seize Deirdre and kill the others. Three young defenders fight off
    the company and refuse Connachar''s offer to change sides. Naois, Deirdre, Allan,
    and Arden flee toward Alba, while Connachar enlists Duanan Gacha Druid to stop
    them with successive magical barriers: an impassable wood, a grey sea, and a frozen,
    sharp, poisonous sea. Naois carries Deirdre, then Arden, who dies, and calls on
    the fainting Allen to hold on so he can bring him to land.'
  language: English
  quote_policy: summarized
