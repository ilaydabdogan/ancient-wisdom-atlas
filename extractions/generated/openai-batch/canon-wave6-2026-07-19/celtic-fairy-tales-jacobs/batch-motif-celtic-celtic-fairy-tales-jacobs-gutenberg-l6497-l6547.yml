canonical_text:
  quote: ''
  summary: A woman leaves her twin infants in a solitary cottage associated with nearby
    good folk. After seeing blue-clad elves on her return, she later finds that the
    children do not grow. A Wise Man tells her to boil food in a hen's eggshell and
    listen for the children's reaction. One child speaks with impossible age and knowledge.
    The woman throws the children into the lake; goblins rescue their dwarfs, and
    the woman's own children are restored.
  language: English
  quote_policy: summarized
