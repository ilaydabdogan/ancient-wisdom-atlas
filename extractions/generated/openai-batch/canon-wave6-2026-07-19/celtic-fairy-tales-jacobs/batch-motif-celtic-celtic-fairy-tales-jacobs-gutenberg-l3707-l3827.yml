canonical_text:
  quote: ''
  summary: A Gruagach tells how he and his twelve sons followed a disruptive hare
    to Yellow Face's house, where deceptive choices involving wooden and iron pikes
    and loops led to the sons' decapitation and the Gruagach's mutilation with a black
    sheepskin. The cowboy later pursues and kills the hare, reverses Yellow Face's
    tests, compels him to restore the Gruagach's sons to life, and causes the Gruagach
    to laugh. The cowboy, the Gruagach, and the restored sons then hurry to the king
    of Erin's castle and interrupt an imminent marriage.
  language: English
  quote_policy: summarized
