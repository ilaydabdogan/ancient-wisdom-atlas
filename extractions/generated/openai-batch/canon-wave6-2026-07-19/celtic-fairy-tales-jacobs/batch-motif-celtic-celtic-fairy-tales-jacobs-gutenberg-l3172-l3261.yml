canonical_text:
  quote: ''
  summary: 'Arthur sends selected companions to continue a quest for Mabon, son of
    Modron, who was taken as an infant. Gwrhyr questions a sequence of increasingly
    ancient animals: the Ousel, Stag, Owl, Eagle, and Salmon. Each earlier animal,
    except the Salmon, denies knowledge and guides the party to an older or more knowledgeable
    animal. The Salmon carries Kay and Gwrhyr to the prison at Gloucester, where they
    hear Mabon lamenting. Arthur attacks the castle, and Kay and Bedwyr enter the
    dungeon on the fish''s shoulders and rescue Mabon.'
  language: English
  quote_policy: summarized
