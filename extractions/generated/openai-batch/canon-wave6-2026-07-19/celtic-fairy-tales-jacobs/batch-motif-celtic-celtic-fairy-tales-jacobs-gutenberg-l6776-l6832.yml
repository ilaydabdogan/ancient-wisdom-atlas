canonical_text:
  quote: ''
  summary: Tom asks to be let out through Ould Nick's gates. When Ould Nick's clawed
    fellows try to take the flail, Tom uses it to beat them until Ould Nick orders
    him released. Tom returns to the palace, lays the flail on the stone steps, and
    forbids anyone to touch it. Redhead touches it in an attempt to harm Tom and suffers
    burning pain until Tom rubs his hands and cures him. The princess places her hands
    in Tom's hands, and marriage is implied. The flail later burns clefts downward
    through the stone, and the Danes flee after hearing it has come to Dublin. A final
    all-caps line announces that anyone who reads what follows three times will sleep
    for a hundred years.
  language: English
  quote_policy: summarized
