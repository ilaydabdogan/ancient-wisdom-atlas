comparison_claims:
- id: claim:1
  claim: The passage explicitly applies to Agesias a kind of praise previously spoken
    by Adrastos for Amphiaraos, creating a cautious functional comparison between
    praise of a Syracusan victor and praise of a Greek seer-warrior.
  claim_level: same_function
  target: Adrastos' praise of Amphiaraos in Greek heroic tradition
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is rhetorical and encomiastic; it does not establish
    that Agesias and Amphiaraos share the same mythic narrative or historical cult
    role.
