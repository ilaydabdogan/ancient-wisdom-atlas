canonical_text:
  quote: ''
  summary: 'The passage praises Agesias of Syracuse, connects him with the Iamid priestly
    lineage, and recounts the ancestry and birth of Iamos: Pitane bears Euadne to
    Poseidon; Euadne conceives Iamos by Apollo, gives birth with divine attendants,
    abandons him, and serpents nurse him. Iamos later prays at Alpheos, follows Apollo''s
    voice to Kronion, and receives prophetic authority connected with the future Olympic
    games and the Iamid oracle. The closing links Agesias'' success with ancestral
    prayer and sacrifice to Hermes.'
  language: English
  quote_policy: summarized
