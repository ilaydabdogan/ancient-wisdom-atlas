candidate_motifs:
- id: motif:1
  label: Olympic victory as ruler praise
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage joins Hieron's horse-race victory, his just rule in Sicily, and
    the glory of Olympic praise.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage is encomiastic poetry rather than a formal enthronement or
    dynastic legitimacy myth.
- id: motif:2
  label: Divine beloved carried away
  taxonomy_refs:
  - divine_beloved
  - stolen_beloved
  basis: Poseidon is said to love Pelops and to snatch him away behind golden steeds
    to Zeus' house; Ganymede is named as a later similar case.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The account is compressed and presented as the poet's preferred version
    over earlier tales.
- id: motif:3
  label: Rejected dismemberment and cannibal banquet
  taxonomy_refs:
  - sacrifice
  - death_rebirth
  basis: The passage reports a version in which Pelops is cut apart, boiled, distributed,
    and eaten, but the speaker explicitly rejects this as an impious tale about the
    gods.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The motif is present as a rejected report, not as the speaker's endorsed
    narrative.
- id: motif:4
  label: Sacred theft of divine food
  taxonomy_refs:
  - sacred_theft
  basis: Tantalos steals nectar and ambrosia from the immortals and gives them to
    human companions at a feast.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not give extended details about how the theft was performed.
- id: motif:5
  label: Divine punishment for transgression
  taxonomy_refs:
  - divine_judgment
  basis: 'Tantalos'' excess and theft are followed by punishment from the Father:
    a stone hangs above his head and he endures endless misery.'
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The exact relationship between the excess of fortune and the theft is
    summarized poetically.
- id: motif:6
  label: Return from divine realm to mortal life
  taxonomy_refs:
  - return
  basis: After the account of Pelops' removal to Zeus' house, the immortals send him
    back again to be counted among mortal humans.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The passage gives no journey details beyond removal and return.
- id: motif:7
  label: Bride-winning contest with divine aid
  taxonomy_refs: []
  basis: Pelops seeks Hippodameia, faces Oinomaos' lethal resistance, asks Poseidon
    for aid, receives a golden car and winged steeds, defeats Oinomaos, and wins the
    bride.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: No available taxonomy reference precisely names the bride-race contest
    pattern.
- id: motif:8
  label: Founder hero with tomb cult at games
  taxonomy_refs:
  - culture_hero
  basis: Pelops is identified with the founding story of the Olympic games, receives
    blood-offerings at a grave beside Alpheos, and is linked to courses called by
    his name.
  evidence_refs:
  - ev:1
  - ev:14
  confidence: high
  cautions: The passage emphasizes cult honor and athletic fame more than civilizing
    invention.
comparison_claims:
- id: claim:1
  claim: The passage explicitly likens Pelops' conveyance to Zeus' house to Ganymede's
    later arrival there on a similar errand.
  claim_level: same_function
  target: Ganymede's conveyance to Zeus' house
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is brief and does not recount the full Ganymede story.
- id: claim:2
  claim: The passage contrasts the speaker's Poseidon-abduction account with an earlier
    or rival Pelops tradition involving dismemberment, boiling, and cannibal consumption
    at a divine feast.
  claim_level: same_motif
  target: Alternative Pelops cannibal-feast tradition
  evidence_refs:
  - ev:5
  - ev:7
  counter_evidence_refs:
  - ev:6
  confidence: high
  limitations: The rival version is reported polemically and rejected by the poetic
    speaker, not narrated as accepted truth.
