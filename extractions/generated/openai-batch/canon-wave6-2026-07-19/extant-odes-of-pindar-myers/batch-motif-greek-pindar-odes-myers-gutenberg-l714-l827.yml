canonical_text:
  quote: Best is Water of all, and Gold as a flaming fire in the night shineth eminent
    amid lordly wealth
  summary: The passage introduces Pindar's first Olympian ode for Hieron of Syracuse,
    praises the Olympic games and Hieron's victory, recounts and revises the myth
    of Pelops, describes Tantalos' offense and punishment, and narrates Pelops' appeal
    to Poseidon for help in winning Hippodameia and founding lasting Olympic honor.
  language: English
  quote_policy: quoted
