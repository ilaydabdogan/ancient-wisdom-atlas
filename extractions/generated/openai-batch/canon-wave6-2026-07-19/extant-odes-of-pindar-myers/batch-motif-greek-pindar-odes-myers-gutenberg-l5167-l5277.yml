candidate_motifs:
- id: motif:1
  label: Divine pursuit and disguised begetting of a heroic child
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - shapeshifter
  basis: Zeus follows Alkmene and Danaë and enters Amphitryon's hall in Amphitryon's
    likeness while bearing the seed of Herakles.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage compresses the story and does not narrate the birth itself
    or Alkmene's response.
- id: motif:2
  label: Mortal hero made divine
  taxonomy_refs:
  - ascent
  basis: Diomedes is said to have been made incorruptible and a god by the grey-eyed
    goddess.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states deification but gives no ascent journey or ritual process.
- id: motif:3
  label: Sacrifice joined to athletic contest and civic cult
  taxonomy_refs:
  - sacrifice
  basis: The games include a contest for a bronze shield and sacrifice of oxen to
    Hera.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage emphasizes cultic context but does not narrate the sacrifice
    in detail.
- id: motif:4
  label: Divine guardians grant fair fortune in games to righteous persons
  taxonomy_refs:
  - sacred_exchange
  basis: Kastor and Polydeukes, with Hermes and Herakles, guard Spartan plains, mete
    out fair fortune in games, and have regard for righteous men.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The reciprocal or exchange element is implied by divine favor and righteousness,
    not described as a formal bargain.
- id: motif:5
  label: Sibling pair bound by shared fate
  taxonomy_refs:
  - sibling_pair
  basis: Kastor and Polydeukes are brothers whose fates are linked; Polydeukes chooses
    alternating life rather than continuous divine existence and later asks to die
    with Kastor.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage calls them brothers but does not explicitly call them twins.
- id: motif:6
  label: Alternating life between heaven and under-earth places
  taxonomy_refs:
  - dying_and_returning
  basis: The brothers dwell alternately one day with Zeus and the next in secret places
    under the earth, fulfilling equal fate.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This is an alternating fate rather than a full narrative of death and
    rebirth.
- id: motif:7
  label: Divine vengeance through thunderbolt and consuming fire
  taxonomy_refs:
  - divine_judgment
  basis: By the devising of Zeus, the sons of Aphareus suffer vengeance, and Zeus
    hurls a thunderbolt of consuming fire against Idas.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage frames the act as vengeance but gives limited legal or moral
    explanation beyond conflict with stronger powers.
- id: motif:8
  label: Extreme companionship expressed as a wish to die with the beloved companion
  taxonomy_refs:
  - sibling_pair
  basis: Polydeukes weeps over the dying Kastor and asks Kronion to bid him die with
    him, saying glory departs from a man bereaved of friends.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage presents this in sibling and companion language; no broader
    ritual context is supplied.
