canonical_text:
  quote: ''
  summary: 'The passage praises Argos and Theaios'' wrestling victories by recalling
    Argive mythic figures, divine favor, athletic contests, and the story of Kastor
    and Polydeukes: their patronage of games, their alternating life with Zeus and
    under the earth, the attack by Idas after Lynkeus'' sighting, Zeus'' fiery vengeance,
    and Polydeukes'' grief-stricken appeal to die with Kastor.'
  language: English
  quote_policy: summarized
