  summary: The passage consists of translator footnotes. One note discusses an interpretation
    in which Herakles contends with gods and is helped by other gods, while an alternative
    reading rejects that story because valour is divine in source. Another note proposes
    that a story of stones arose from the similar sounds of Greek words. Further notes
    gloss the names Protogeneia, Lokros, and Patroklos, identify the Isthmus as a
    gate between two seas, identify a cloak as the prize, and mark the section with
    the numeral X.
