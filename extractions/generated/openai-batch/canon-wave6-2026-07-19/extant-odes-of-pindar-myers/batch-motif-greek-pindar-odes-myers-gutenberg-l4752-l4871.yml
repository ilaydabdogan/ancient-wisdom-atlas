canonical_text:
  quote: ''
  summary: The passage is an ode for Sogenes of Aigina. It invokes Eileithuia as birth-bringer,
    reflects on fate and different lots of life, celebrates Sogenes' athletic victory,
    explains how song and memory preserve heroic deeds, discusses Homeric fame, Aias,
    death, and posthumous honor, recounts Neoptolemos' death and cultic presence at
    Pytho, and closes with praise of Aigina, Thearion, Zeus, Aiakos, Herakles, and
    the Muse's wreath.
  language: English
  quote_policy: summarized
