canonical_text:
  quote: ''
  summary: The passage introduces and praises Phylakidas of Aigina, pankration victor
    and brother of Pytheas. It invokes Theia, links gold and athletic honor to divine
    favor, warns mortals not to seek equality with Zeus, and celebrates Phylakidas’
    victories. The ode connects Aigina and Lampon’s sons with the Aiakid heroic tradition,
    lists older heroes honored through song and cult, recalls Trojan-war exploits
    and Aiginetan seamen at Salamis, and ends by praising Pytheas’ guidance and calling
    for crown, fillet, and hymn.
  language: English
  quote_policy: summarized
literal_observations:
