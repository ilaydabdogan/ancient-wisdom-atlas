- id: motif:3
  label: Athletic victory made enduring through crown and song
  taxonomy_refs: []
  basis: Victories are marked by wreaths, crowns, and praise-song; Phylakidas’ pankration
    glory is preserved by the ode and ritualized honors.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:10
  confidence: high
  cautions: This is a praise-poetry pattern rather than a narrative myth motif.
- id: motif:4
  label: Heroic commemoration through song and sacrificial worship
  taxonomy_refs:
  - sacrifice
  basis: Old warriors are said to gain long-lasting glory through tale, lute, pipe,
