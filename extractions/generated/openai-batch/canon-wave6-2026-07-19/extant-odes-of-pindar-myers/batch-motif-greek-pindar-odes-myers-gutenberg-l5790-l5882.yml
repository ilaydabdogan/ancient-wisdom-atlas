- id: motif:2
  label: Divine sanction and mortal boundary
  taxonomy_refs: []
  basis: The ode says human might is approved through God, warns not to seek to be
    as Zeus, and states that Zeus orders events as lord of all.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: No available taxonomy ref exactly matches divine sanction plus mortal
