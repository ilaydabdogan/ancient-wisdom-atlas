- id: motif:5
  label: Civic valor grounded in heroic ancestors
  taxonomy_refs: []
  basis: The ode links Phylakidas, Aigina, and recent Aiginetan seamen with the sons
    of Aiakos and their heroic exploits around Troy.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
