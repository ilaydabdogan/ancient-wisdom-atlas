  confidence: medium
  cautions: The passage asserts association and praise-continuity, but does not give
    a genealogical explanation for every present figure.
- id: motif:6
  label: Heroic slaying of formidable named opponents
  taxonomy_refs: []
  basis: The poet asks who slew Kyknos, Hektor, Memnon, and Telephos and ties the
