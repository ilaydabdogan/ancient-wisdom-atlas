    Pytheas, and says the ode was probably composed shortly after Salamis to be sung
    at Aigina, perhaps at a festival of Theia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Theia is described as mother of the Sun, the Moon, and the Morning, and as
    associated by name with gold and wealth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ode invokes Theia as mother of the Sun and says that through her men prize
    gold, ships on the sea, and chariot horses in contest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says an athlete wins desired glory in games when wreaths bind
    his hair for strength of hand or speed of foot, and that human might is approved
    through God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that success and fair fame are the two things that make
