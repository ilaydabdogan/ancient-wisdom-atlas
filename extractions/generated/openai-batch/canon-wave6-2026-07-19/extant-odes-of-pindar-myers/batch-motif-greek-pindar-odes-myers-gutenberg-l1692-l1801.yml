candidate_motifs:
- id: motif:1
  label: Flood recedes and a people is renewed
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage says a mighty water swept over the earth, Zeus caused an ebb,
    and Pyrrha and Deukalion made a new people from stones.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The flood story is brief and genealogical; details of vessel, survival
    mechanism, or wider destruction are not included in this passage.
- id: motif:2
  label: Survivor pair generates a new people
  taxonomy_refs:
  - survivor_pair
  basis: Pyrrha and Deukalion act as a pair after descending from Parnassos and make
    a race to be one folk from stones.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly narrate how the pair survived the flood;
    it presents them after the event.
- id: motif:3
  label: People made from stones
  taxonomy_refs: []
  basis: The text states that Pyrrha and Deukalion, without marriage-bed, made a race
    out of stones.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy reference directly names this lithic origin motif.
- id: motif:4
  label: Divine father and heroic child
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Zeus lies with the daughter of Opoeis; she bears the seed of the Mightiest,
    and the resulting child is described as preeminent.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage uses heroic-genealogical praise language and does not narrate
    pregnancy or birth in detail beyond the essential lineage.
- id: motif:5
  label: Divine lineage legitimates rule over city and people
  taxonomy_refs:
  - royal_legitimacy
  basis: The child of Zeus and the daughter of Opoeis is given a city and people to
    rule.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not specify formal kingship rites; legitimacy is implied
    through divine paternity and paternal grant.
- id: motif:6
  label: Childlessness resolved through transferred divine offspring
  taxonomy_refs: []
  basis: Zeus brings the pregnant daughter of Opoeis to Lokros so that age will not
    burden him with childlessness; Lokros rejoices at the child.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text does not fully define adoption, fosterage, or legal status beyond
    Lokros naming and rejoicing over the child.
- id: motif:7
  label: Impious divine combat tale rejected by poet
  taxonomy_refs: []
  basis: A tale of Herakles opposed by Poseidon, Phoibos, and Hades is immediately
    rejected as hateful speech about gods, and wars of immortals are set aside.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: This is a rhetorical treatment of myth within praise poetry rather than
    a full narrative motif.
- id: motif:8
  label: Heroic friend remains beside the warrior's spear
  taxonomy_refs: []
  basis: Patroklos stands beside Achilles and is urged never to take his post far
    from his friend's conquering spear.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage only briefly recalls the martial friendship and does not narrate
    the wider heroic cycle.
comparison_claims:
- id: claim:1
  claim: 'The Pyrrha and Deukalion episode matches a flood-and-renewal pattern: flood
    covers the earth, divine agency removes the waters, and a renewed people follows.'
  claim_level: same_motif
  target: flood_and_renewal motif family
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is an allusive genealogical summary and omits many narrative
    details commonly found in fuller flood accounts.
- id: claim:2
  claim: Pyrrha and Deukalion function as a survivor pair associated with renewed
    human origins after the flood.
  claim_level: same_function
  target: survivor_pair motif family
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: Their survival is implied by their post-flood action, but the passage
    does not explicitly describe the mechanics of survival.
- id: claim:3
  claim: The birth of the ruler from Zeus and the daughter of Opoeis performs the
    same legitimating function as a divine parent-child lineage motif.
  claim_level: same_function
  target: divine_parent_child and royal_legitimacy motif families
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage links lineage and rule but does not present a separate
    enthronement or succession narrative.
