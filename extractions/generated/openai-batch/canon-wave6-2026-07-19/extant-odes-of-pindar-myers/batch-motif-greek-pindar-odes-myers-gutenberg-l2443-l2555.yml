candidate_motifs:
- id: motif:1
  label: Benefaction repaid by praise and reward
  taxonomy_refs:
  - sacred_exchange
  basis: The passage explicitly links praise to gratitude for friendly acts, the Lokrian
    maiden's song to Hieron's deliverance, and Ixion's proclaimed maxim that service
    should receive fair reward.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The exchange is framed as moral and political praise rather than as a
    formal ritual transaction.
- id: motif:2
  label: Divine punishment for hubris and transgression
  taxonomy_refs:
  - divine_judgment
  basis: Ixion's kin-slaying and attempted violation of Zeus's marriage lead to a
    Zeus-made snare, inescapable chains, and punishment on a wheel; the poem generalizes
    that God brings low the proud.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The ode gives a compressed exemplum, not a complete narrative of Ixion's
    myth.
- id: motif:3
  label: Royal and athletic legitimacy through divine favor
  taxonomy_refs:
  - royal_legitimacy
  basis: Hieron's chariot victory is praised with Artemis, Hermes, and the trident-wielder
    involved, and the poem presents him as protector, sovereign chief, and recipient
    of exceptional honor.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:11
  - ev:12
  confidence: high
  cautions: The legitimacy is epinician and civic, centered on victory and praise,
    not on enthronement or dynastic origin.
- id: motif:4
  label: Deceptive divine substitute and monstrous offspring
  taxonomy_refs: []
  basis: Zeus makes a cloud in Hera's form to snare Ixion; the cloud bears Kentauros,
