canonical_text:
  quote: ''
  summary: The passage introduces and performs an ode for Chromios of Aitna after
    a chariot victory at Sikyon. It invokes Apollo, the Muses, Leto and her twin children,
    praises public song for noble deeds, recounts Adrastos, Amphiaraos, Eriphyle,
    the doomed expedition against Thebes, Zeus's lightning and the earth-burial of
    Amphiaraos, then turns to prayer for Aitna, Chromios's martial excellence, banquet
    celebration, wine, goblets, crowns, and the poet's claim to have honored the victory
    with divine aid.
  language: English
  quote_policy: summarized
