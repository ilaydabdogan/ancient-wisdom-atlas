candidate_motifs:
- id: motif:1
  label: Divinely impelled heroic departure by ship
  taxonomy_refs:
  - departure
  basis: Jason announces a sailing, Hera inspires the sons of gods to desire the ship
    Argo, and the crew boards after prophetic preparation.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage begins after an earlier covenant not included in the supplied
    excerpt, so the full departure context is partial.
- id: motif:2
  label: Favorable divine omen answering departure prayer
  taxonomy_refs: []
  basis: Jason prays to Zeus and sea powers for safe speed and return; thunder and
    lightning answer, and the heroes take courage from the signs.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No specific taxonomy family from the supplied list exactly names this
    omen pattern.
- id: motif:3
  label: Ritual foundation during a perilous voyage
  taxonomy_refs: []
  basis: The crew founds a shrine and sacred close of Poseidon with bulls and a stone
    altar before facing the clashing rocks.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage reports the foundation but does not explicitly state an exchange
    or vow linked to safe passage.
- id: motif:4
  label: Passage through living clashing rocks
  taxonomy_refs:
  - initiation
  basis: The voyagers pray to avoid two living rocks that crash together, and their
    passage ends the danger.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The initiation classification is interpretive; the passage itself emphasizes
    peril and successful passage rather than formal initiation.
- id: motif:5
  label: Love charm compelling a maiden’s aid and departure from parents
  taxonomy_refs:
  - stolen_beloved
  basis: Aphrodite’s wry-neck charm and teachings are used so Medea will neglect her
    parents and long for Hellas; Jason later takes Medea away by her aid.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: The passage attributes Medea’s attachment to divine magic and persuasion,
    so a simple human romance label would be inadequate.
- id: motif:6
  label: Magical or pharmaceutical aid for an impossible heroic task
  taxonomy_refs:
  - wisdom
  basis: Medea knows how Jason can accomplish Aietes’s tasks and gives him protective
    drugs mixed with oil, allowing him to withstand the fire-breathing oxen.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The available taxonomy term 'wisdom' only broadly fits Medea’s skill in
    pharmacy and task knowledge.
- id: motif:7
  label: Heroic ordeal with fire-breathing animals
  taxonomy_refs:
  - initiation
  basis: Aietes requires Jason to yoke and plough with oxen breathing blazing fire
    and striking the earth with bronze hoofs.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents this as a task for winning the fleece; initiation
    is a broader comparative classification.
