canonical_text:
  quote: ''
  summary: Jason announces the voyage of the Argo and gathers a divinely connected
    crew. After prophetic omens, prayer, and favorable thunder and lightning from
    Zeus, the heroes sail, found a shrine to Poseidon, pass the clashing rocks, reach
    Colchis, and face Aietes. Aphrodite’s charm and Medea’s drugs help Jason complete
    the fire-ox ploughing task. Aietes reveals the golden fleece guarded by a dragon;
    Jason slays the dragon by subtlety, leaves with Medea, and the narrative links
    the Lemnian episode and Euphemos’s descendants to Arkesilas’s rule at Kyrene through
    Apollo’s grant.
  language: English
  quote_policy: summarized
