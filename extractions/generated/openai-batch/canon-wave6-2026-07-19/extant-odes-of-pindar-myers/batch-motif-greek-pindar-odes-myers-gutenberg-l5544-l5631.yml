  quote: ''
  summary: The passage addresses Thrasyboulos in a praise-song for Xenokrates of Akragas.
    It contrasts older unbought song with the power of money, honors Xenokrates' chariot
    victories, attributes victory and glory to Poseidon and Apollo, places his success
    within Olympic and Hellenic festival contexts, praises his character, worship,
    and hospitality, and sends Nikesippos to urge Thrasyboulos not to be silent about
    his father's prowess or the hymns.
  language: English
  quote_policy: summarized
