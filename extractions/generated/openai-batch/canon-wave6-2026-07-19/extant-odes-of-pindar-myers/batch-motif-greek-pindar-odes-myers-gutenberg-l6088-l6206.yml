candidate_motifs:
- id: motif:1
  label: Choral praise as recompense for athletic toil
  taxonomy_refs: []
  basis: The ode frames song, Muse-invocation, and garlanding as recompense and public
    honor for Kleandros' victories.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:11
  confidence: high
  cautions: This is a formal epinician praise pattern rather than a mythic narrative
    motif.
- id: motif:2
  label: Averted hanging doom over a community
  taxonomy_refs: []
  basis: The Tantalos-stone is described as a curse hanging over Hellas and then removed
    by a god after recent troubles.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage uses the Tantalos-stone as a poetic image for political terror;
    it does not narrate the Tantalos myth itself.
- id: motif:3
  label: Divine beloved bears heroic civic ancestor
  taxonomy_refs:
  - divine_beloved
  - divine_parent_child
  - sacred_birth
  basis: Aigina, daughter of Asopos and favored by Zeus, bears Aiakos, who becomes
    an exemplary heroic ancestor.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents this genealogically and civically, not as a detailed
    birth narrative.
- id: motif:4
  label: Sibling female figures link cities and lineages
  taxonomy_refs:
  - sibling_pair
  basis: Two daughters of Asopos, Thebe and Aigina, are paired to connect Thebes and
    Aigina through Zeus' favor.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The sibling relation is explicit, but the symbolic city-linking function
    is inferred from the ode's pairing of Thebes and Aigina.
- id: motif:5
  label: Prophetic counsel redirects dangerous divine marriage to mortal marriage
  taxonomy_refs:
  - sacred_marriage
  - divine_judgment
  - wisdom
  - divine_parent_child
  basis: Themis' oracle warns that Thetis' child by Zeus or Poseidon would surpass
    his father; her counsel assigns Thetis to Peleus instead.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy labels are broad; the passage emphasizes oracle, counsel,
    and divine assent more than ritual marriage details.
- id: motif:6
  label: Heroic warrior sends foes to the house of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: Achilles is said to point defeated enemies toward the house of Persephone
    during battle.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The expression is a martial death image, not a literal itinerary or full
    afterlife journey narrative.
- id: motif:7
  label: Divine song preserves the dead hero's honor
  taxonomy_refs: []
  basis: The Helikonian maiden-choir sings at Achilles' pyre and tomb, and immortals
    will songs of goddesses for him even in death.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No resurrection or return from death is stated; the motif concerns posthumous
    song and honor.
- id: motif:8
  label: Athletic victor assimilated to heroic warrior exemplar
  taxonomy_refs: []
  basis: Nikokles' boxing success is praised in language comparing him to Achilles
    overcoming men in battle; the praise then turns to Kleandros' wreath.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The comparison is rhetorical and encomiastic, not a claim that the athletes
    share Achilles' mythic deeds.
comparison_claims:
