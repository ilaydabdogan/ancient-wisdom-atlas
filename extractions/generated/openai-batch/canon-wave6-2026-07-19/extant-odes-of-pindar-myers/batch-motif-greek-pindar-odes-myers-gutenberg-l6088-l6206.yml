canonical_text:
  quote: ''
  summary: The ode calls young men to praise Kleandros of Aigina for athletic victories,
    reflects on recent deliverance from public terror, links Thebes and Aigina through
    daughters of Asopos favored by Zeus, recounts Aiakos and the divine decision to
    marry Thetis to Peleus after Themis' prophecy, praises Achilles' deeds and funerary
    song, and returns to praise Nikokles and Kleandros with victory garlands.
  language: English
  quote_policy: summarized
