candidate_motifs:
- id: motif:1
  label: Sacrificial consultation of Zeus for victory and relief from toil
  taxonomy_refs:
  - sacred_exchange
  - divine_judgment
  basis: Diviners observe burnt offerings and seek a word from Zeus concerning men
    pursuing prowess and a breathing-space from toil; the passage says this is given
