- id: motif:3
  label: Dragon omen predicting the fall of a city through a hero's descendants
  taxonomy_refs:
  - serpent
  basis: Three fiery-eyed dragons appear at Ilion's rampart, and Apollo interprets
    the sign as foretelling that Pergamos will be taken where Aiakos worked and by
    Aiakos' seed.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy reference uses the available serpent category for dragons;
