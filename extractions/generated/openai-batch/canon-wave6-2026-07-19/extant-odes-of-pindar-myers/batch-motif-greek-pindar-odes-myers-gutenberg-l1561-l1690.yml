- id: motif:2
  label: Divine justice protecting strangers in a sea-defended land
  taxonomy_refs:
  - divine_judgment
  basis: Themis is said to sit in judgment by Zeus as the stranger's succour, and
    Aigina is described as a land established as a God-built pillar for strangers.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a civic-religious praise motif rather than a standalone mythic
