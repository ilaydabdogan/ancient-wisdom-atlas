- id: motif:4
  label: Ancestral dead sharing in living descendants' honor
  taxonomy_refs: []
  basis: The passage states that the dead have a share when due rites are paid and
    that kinsmen's honor is not concealed by dust; Fame carries the house's Olympic
    glory to Iphion and Kallimachos.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The text does not describe an underworld journey, only reception of honor
    and fame by the dead.
- id: motif:5
  label: Athletic victory transferring shameful return to defeated opponents
  taxonomy_refs: []
  basis: Alkimedon is said to put the loathed return ungreeted and the obscure path
    onto the bodies of four opponents, thereby avoiding those consequences himself.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: This is expressed as poetic praise of athletic defeat and victory, not
    as a supernatural transformation.
