canonical_text:
  quote: three dragons fiery-eyed leapt at the rampart
  summary: The ode praises Olympia, Zeus, Aigina, Alkimedon's Olympic wrestling victory,
    and his family line. It recounts how Apollo and Poseidon called Aiakos to help
    build the wall of Ilion, how three fiery-eyed dragons appeared at the new rampart,
    and how Apollo interpreted the sign as a prophecy about the capture of Pergamos
    by Aiakos' descendants. It also honors the trainer Melesias, the Blepsiad clan,
    and the dead kin who share in the family's glory through rites and fame.
  language: English
  quote_policy: quoted
