  summary: The ode praises Arkesilas of Kyrene for a Pythian chariot victory, honors
    the charioteer Karrhotos, connects the victory with Apollo, recalls Battos and
    other founding or ancestral traditions of Kyrene, and ends with prayers for the
    continuing renown of the seed of Battos.
  language: English
  quote_policy: summarized
