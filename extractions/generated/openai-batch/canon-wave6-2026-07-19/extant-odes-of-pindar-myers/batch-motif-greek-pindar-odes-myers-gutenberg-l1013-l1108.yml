canonical_text:
  quote: ''
  summary: The ode celebrates Theron of Akragas for an Olympian chariot-race victory.
    It frames the celebration within the Theoxenia and the worship of the Dioskouroi,
    invokes Tyndareus' sons, Helen, and the Muse, and recounts Herakles' role in bringing
    the olive tree from the Ister/Hyperborean region for Zeus's precinct at Olympia,
    instituting games, and assigning divine oversight. The passage closes by praising
    Theron's glory and marking the pillars of Herakles as a limit beyond which the
    speaker will not search.
  language: English
  quote_policy: summarized
