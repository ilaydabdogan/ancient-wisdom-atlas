canonical_text:
  quote: ''
  summary: A Pindaric ode invokes the Muse to Aigina for the Nemean festival, praises
    Aristokleides' pankration victory, recalls the heroic Aiakid lineage through Herakles,
    Peleus, Telamon, Achilles, and Cheiron, and closes by offering the late-arriving
    song as a mingled drink of honey and milk while contrasting eagle and daws.
  language: English
  quote_policy: summarized
