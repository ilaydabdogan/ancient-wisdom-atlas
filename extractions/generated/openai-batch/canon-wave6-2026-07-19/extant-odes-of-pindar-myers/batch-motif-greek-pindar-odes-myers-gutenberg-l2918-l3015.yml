canonical_text:
  quote: ''
  summary: A wondrous spear-bearing stranger, later named Jason, appears in the marketplace
    and is questioned by Pelias after Pelias notices a single sandal. Jason explains
    that he was secretly sent as an infant to Cheiron after a false funeral, returns
    as son of Aison to reclaim ancestral rule, is recognized by his father and welcomed
    by kin, and then asks Pelias to yield the sceptre and throne. Pelias replies that
    Jason should appease Phrixos' ghost by sailing to Aietes for the ram's fleece,
    a mission supported by dream and oracle, and swears by ancestral Zeus to surrender
    the rule if Jason performs it.
  language: English
  quote_policy: summarized
