canonical_text:
  quote: ''
  summary: The passage recalls the son of Alkmene, Herakles, coming from Kadmean Thebes
    to Libya to wrestle Antaios and stop the use of strangers' skulls on Poseidon's
    temple. It then describes Herakles' ascent to Olympus, his making sea travel safe,
    his honored life among immortals with Hebe as wife, and a civic feast, altar,
    burnt sacrifice, night flame, and yearly games for his eight dead sons by Megara.
    The passage closes by praising the present athletic victor, crowned with myrtle,
    and naming Orseas as trainer.
  language: English
  quote_policy: summarized
