canonical_text:
  quote: ''
  summary: 'Editorial footnotes explain an uncertain legend about Amphiaraos: either
    he foresaw the later battle of the Epigonoi during the first attack against Thebes,
    or he spoke an oracle after death when that later battle was underway. Other notes
    identify Abas as an ancient king of Argos, describe a probable shrine of Alkmaion
    near Pindar’s house at Thebes, mention a probable vision seen by Pindar on a journey
    to Delphi, and gloss Aristomenes’ father, his wrestling competitors, and an island-protecting
    nymph.'
  language: English
  quote_policy: summarized
