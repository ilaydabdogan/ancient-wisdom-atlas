canonical_text:
  quote: ''
  summary: The ode for Deinis of Aigina invokes the spirit of youth and Aphrodite,
    recalls the union of Zeus and Aigina and the birth and sovereignty of Aiakos,
    praises Deinis and his father Meges through song, reflects on divine favor, envy,
    slander, the death of Aias after the award of the arms to Odysseus, prays to Zeus
    for simplicity and a good name, and presents song as a memorial that can honor
    the dead though it cannot restore them to earth.
  language: English
  quote_policy: summarized
