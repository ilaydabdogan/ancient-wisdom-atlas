canonical_text:
  quote: ''
  summary: 'The ode invokes Theban and divine-associated women to gather at the Ismenian
    shrine and honor Thebes and the Kirrha games where Thrasydaios won. It recalls
    the house of Atreus: Orestes was rescued after Agamemnon''s murder, Kassandra
    and Agamemnon were sent to Acheron, and Orestes later killed his mother and Aigisthos.
    The poet then redirects himself to praise Thrasydaios and his father, reflects
    on moderation and public virtue, and ends by naming Iolaos and the Dioscuri, Kastor
    and Polydeukes, who dwell alternately in Therapnai and Olympus.'
  language: English
  quote_policy: summarized
