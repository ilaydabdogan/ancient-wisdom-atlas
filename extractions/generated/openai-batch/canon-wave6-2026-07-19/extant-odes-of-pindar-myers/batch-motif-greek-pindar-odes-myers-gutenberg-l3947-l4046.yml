candidate_motifs:
- id: motif:1
  label: Sacred assembly at prophetic shrine
  taxonomy_refs: []
  basis: The passage calls divine-associated Theban women and the children of Harmonia
    to gather at a holy shrine, a seat of seers, and sing in honor of sacred places
    and Thebes.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is a choral invocation within an ode, not a full narrative
    of ritual action.
- id: motif:2
  label: Divine parent and heroic child
  taxonomy_refs:
  - divine_parent_child
  basis: Alkmene is invoked as mother of Herakles, and Kastor and Polydeukes are called
    sons of gods.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:11
  confidence: medium
  cautions: The parent-child motif is mentioned allusively rather than narrated in
    detail.
- id: motif:3
  label: Rescued endangered royal child or youth
  taxonomy_refs: []
  basis: Orestes is saved by his nurse from Klytaimnestra after his father's murder
    and later hosted by Strophios in youth.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage gives a compressed version of the episode.
- id: motif:4
  label: Kin-murder and revenge cycle
  taxonomy_refs: []
  basis: The passage recounts Agamemnon's murder, questions Klytaimnestra's motives,
    and states that Orestes later kills his mother and Aigisthos.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: No taxonomy reference is assigned because the available list has no direct
    kin-revenge category.
- id: motif:5
  label: Death journey to Acheron
  taxonomy_refs:
  - afterlife_journey_map
  basis: Agamemnon's soul, with Kassandra, is said to be sped to the shadowy shore
    of Acheron.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage mentions the destination of the dead but does not narrate
    an extended afterlife journey.
- id: motif:6
  label: Sacrificial death provoking vengeance
  taxonomy_refs:
  - sacrifice
  basis: The speaker asks whether the slaughter of Iphigenia on Euripos' shore stirred
    her mother to a grievous act.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: Iphigenia's death is presented as a possible motive in a rhetorical question,
    not as a narrated sacrifice with ritual detail.
- id: motif:7
  label: Fire destruction of an enemy city
  taxonomy_refs: []
  basis: Agamemnon is said to have consumed Trojan dwellings with fire before returning
    to death.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The fire image is brief and attached to the aftermath of Troy, without
    a full city-destruction narrative.
- id: motif:8
  label: Poetic wandering and return to praise
  taxonomy_refs:
  - return
  basis: The poet says he has wound about by triple roads and been blown off course
    like a boat, then redirects the Muse to the promised praise of Thrasydaios or
    his father.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is a metapoetic pattern rather than a mythic journey episode.
- id: motif:9
  label: Moderation as civic wisdom
  taxonomy_refs:
  - wisdom
  basis: The speaker explicitly endorses honorable desire, possible aims, the middle
    course, public good, modest excellence, and a good name after death.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The motif is gnomic and ethical rather than narrative.
- id: motif:10
  label: Sacred twins with alternating dwellings
