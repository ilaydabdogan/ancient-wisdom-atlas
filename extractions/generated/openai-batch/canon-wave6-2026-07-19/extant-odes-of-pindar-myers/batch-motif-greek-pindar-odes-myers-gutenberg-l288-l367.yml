canonical_text:
  quote: ''
  summary: The passage describes Myers's view of Pindar as a Panhellenic poet whose
    victory odes were connected with sacred games, common deities, and festival truce.
    It presents Pindar's era as a moment of Greek unity after the Persian danger and
    before later civil strife, discusses his noble Aigeidai background and non-partisan
    political stance, outlines an ethical aristocratic ideal grounded in divine descent
    only when joined to arete and public duty, and notes his delight in splendour,
    temples, cities, games, chariots, horses, and athletes.
  language: English
  quote_policy: summarized
