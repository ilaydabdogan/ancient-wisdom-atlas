  text: The speaker describes the ode as mingling a second time the bowls of Muses’
    melody in honor of Lampon’s athlete progeny.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says a first song was for Zeus at Nemea, the present second song
    is for the lord of Isthmos and the fifty daughters of Nereus because Phylakidas
    won, and a hoped-for third will be for the Saviour Olympian.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a person who bears cost and toil and gains god-built excellence
    has reached the farthest bounds of bliss, and it says Lampon prays to fulfill
