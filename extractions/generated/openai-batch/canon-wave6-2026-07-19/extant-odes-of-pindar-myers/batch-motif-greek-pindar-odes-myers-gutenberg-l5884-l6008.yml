canonical_text:
  quote: ''
  summary: The ode celebrates Phylakidas of Aigina and his athletic family, invokes
    Zeus, Poseidon, the Nereids, the Fates, and Aiakid heroes, recalls Herakles’ alliance
    with Telamon and prayer for the birth of Aias, describes Zeus’ eagle omen and
    Aias’ naming, and closes with praise of Lampon and an image of the holy water
    of Dirke made to spring by Mnemosyne’s daughters.
  language: English
  quote_policy: summarized
literal_observations:
