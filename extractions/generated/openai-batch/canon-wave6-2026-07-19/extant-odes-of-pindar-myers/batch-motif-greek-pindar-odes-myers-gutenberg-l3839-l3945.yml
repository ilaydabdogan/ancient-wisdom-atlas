canonical_text:
  quote: ''
  summary: The passage introduces and presents an ode for Hippokleas of Thessaly,
    winner of a boys' two-stadion foot-race. It links Thessalian and Spartan prestige
    to descent from Herakles, praises Hippokleas, his father, Thorax, and Thessalian
    leaders, and includes a mythic digression in which Perseus reaches the blessed
    Hyperboreans, who sacrifice to Apollo and live without disease, old age, toil,
    or war. Perseus is then said to have been led by Athene, slain the Gorgon, and
    brought home her serpent-tressed head, which brings stony death.
  language: English
