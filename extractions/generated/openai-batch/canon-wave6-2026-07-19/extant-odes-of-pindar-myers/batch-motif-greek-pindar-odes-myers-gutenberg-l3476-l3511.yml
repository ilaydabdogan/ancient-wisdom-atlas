  summary: A headnote identifies Megakles of Athens as a four-horse chariot-race victor
    in 490 B.C. and as connected with the Alkmaionidai. The ode praises Athens and
    the Alkmaionidai, recalls the fame of the citizens of Erechtheus for building
    Apollo a house at Pytho, lists victories at Isthmos, Olympia, and Kirrha won by
    Megakles and his father, and ends with a reflection that good fortune brings grief
    through envy and mixes bad with good.
