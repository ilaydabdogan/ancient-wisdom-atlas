canonical_text:
  quote: ''
  summary: The passage opens Pindar's Pythian Ode for Hieron of Aitna. It invokes
    the golden Lyre of Apollo and the Muses, whose music calms Zeus's lightning and
    eagle and makes Ares rest. It contrasts this harmony with Typhon, foe of the gods,
    bound beneath Etna and causing volcanic fire. The ode then prays to Zeus and Phoibos
    for Aitna and Hieron, interprets his chariot victory and military success as divinely
    favored, compares his usefulness in war to Philoktetes, and praises the founding
    of Aitna under Dorian laws with a final prayer for civic concord.
  language: English
  quote_policy: summarized
