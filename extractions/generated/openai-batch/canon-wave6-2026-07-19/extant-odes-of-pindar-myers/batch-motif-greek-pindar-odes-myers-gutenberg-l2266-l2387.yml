comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Hieron's recent military usefulness to the
    heroic example of Philoktetes, the wounded archer whose return from Lemnos was
    necessary for the success of the Greek war effort against Troy.
  claim_level: same_function
  target: Philoktetes exemplum in Greek Trojan War tradition
  evidence_refs:
  - ev:13
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is an encomiastic allusion, not a full retelling of
    the Philoktetes myth; it supports functional analogy, not identity between Hieron
    and Philoktetes.
