canonical_text:
  quote: He who has drunk deeply of that divine well and gazed long at the fair vision
  summary: The passage defends the study of Greek literature, especially the literature
    and history of Hellas, against objections about educational relevance and historical
    remoteness. It personifies Physical Science as helping modern readers view humanity
    on a long scale and sympathize with the Hellenic past. It warns that the renewed
    influence of antiquity can be misused for selfish aestheticism, but presents the
    Hellenic prime as an exemplar of duty and human sympathy. It ends with an image
    of drinking from a divine well, beholding a fair vision of the past, and returning
    without bitterness to the modern world.
  language: English
  quote_policy: quoted
