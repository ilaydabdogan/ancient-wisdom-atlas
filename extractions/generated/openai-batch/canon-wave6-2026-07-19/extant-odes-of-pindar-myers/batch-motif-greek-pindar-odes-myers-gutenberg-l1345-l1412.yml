canonical_text:
  quote: ''
  summary: The speaker describes song as sharpened speech and invokes ancestral and
    civic connections through Metope, Thebe, Stymphalos, Syracuse, and Ortygia. Aineas
    is asked to proclaim maiden Hera and to act as messenger of the Muses. Hieron
    is praised as righteous ruler who honors Demeter, her daughter, and Aetnaean Zeus.
    The song is imagined travelling from home to home, and the speaker prays that
    friendly gods and the sea-god, husband of Amphitrite, grant safety, good fortune,
    and blessing to the song.
  language: English
  quote_policy: summarized
