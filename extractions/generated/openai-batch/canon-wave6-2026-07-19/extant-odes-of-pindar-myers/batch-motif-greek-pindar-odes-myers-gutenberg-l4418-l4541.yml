canonical_text:
  quote: ''
  summary: The passage is an ode for Timasarchos of Aigina, a boys' wrestling victor.
    It praises song as comfort and enduring memorial, dedicates the hymn to Zeus,
    Nemea, and Timasarchos' wrestling, recalls Timasarchos' victories and family,
    alludes to deeds of Aiakid heroes, especially Telamon and Peleus, and ends with
    praise for the Theandrid clan, Kallikles, and Melesias.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ode identifies Timasarchos of Aigina as winner in the boys' wrestling-match
    and notes that the ode may have been sung on his return home.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says festive joy and songs associated with the Muses comfort accomplished
    toil, and that praise joined to lyre-music is more effective than warm water for
    soothing limbs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker dedicates the hymn to Zeus son of Kronos, to Nemea, and to the
    wrestling of Timasarchos, and asks that it be welcomed in the Aiakids' stronghold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says Timasarchos' father Timokritos, if alive, would have sung
    of Timasarchos' victories and wreaths from Kleonai, Athens, and Thebes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Thebes, the sons of Kadmos sprinkled the Aiginetan victor with flowers
    beside Amphitryon's sepulchre, and he lodged in the hall of Herakles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Herakles and Telamon once destroyed Troy, the Meropes, and
    Alkyoneus; Alkyoneus was overcome only after stones had subdued twelve four-horse
    chariots and twice as many heroes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says custom and the hours prevent a full telling of the tale,
    and that a love-spell draws him toward the feast of the new moon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker addresses someone as being held waist-deep by sea-brine, urges
    endurance against conspiracies, and contrasts sailing home in open day with an
    envious enemy turning in darkness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker asks the lute to weave a Lydian strain dear to Oinone and Cyprus,
    where Teukros son of Telamon rules in a new land.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'The passage lists Aiakid territories: Aias has Salamis, Achilles has a shining
    isle in the Euxine Sea, Thetis has power at Phthia, and Neoptolemos has wide Epeiros.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Peleus set himself against Iolkos and made it subject to the Haimones after
    experiencing the guileful counsels of Hippolyte, Akastos' wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Akastos prepared an ambush for Peleus by stealing his crafted sword, but Cheiron
    delivered Peleus from Akastos' hand.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Peleus is said to have fulfilled a destiny ordained by Zeus, escaped fire
    and terrible beasts, married one of the Nereids, and seen the kings of heaven
    and sea reveal gifts and a kingdom for him and his descendants.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The speaker says no one may pass westward beyond Gadeira and turns the metaphorical
    ship back because he cannot finish the whole tale of the sons of Aiakos.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The speaker presents himself as a herald for the Theandrid clan at Olympia,
    Isthmos, and Nemea, where the clan returns home with wreaths and renown.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The speaker offers to set up a song like a white Parian pillar for Kallikles,
    who is imagined beside Acheron and whose brows were green with parsley at the
    Isthmian games.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Melesias, Timasarchos' wrestling trainer according to the footnote, is praised
    through wrestling imagery applied to speech.
  category: speech
  evidence_refs:
  - ev:14
