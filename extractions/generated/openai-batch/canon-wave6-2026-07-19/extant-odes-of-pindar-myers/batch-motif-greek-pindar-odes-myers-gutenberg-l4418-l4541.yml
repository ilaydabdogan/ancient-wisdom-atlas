candidate_motifs:
- id: motif:1
  label: Praise-song as enduring memorial for athletic victory
  taxonomy_refs: []
  basis: The passage explicitly says speech and praise-song outlast action, and later
    compares a song for Kallikles to a white pillar and to refined gold that reveals
    splendor.
  evidence_refs:
  - ev:2
  - ev:13
  confidence: high
  cautions: This is a poetic praise pattern rather than one of the supplied mythological
    motif-family taxonomy entries.
- id: motif:2
  label: Victory return crowned with wreaths
  taxonomy_refs: []
  basis: Timasarchos and the Theandrid clan are repeatedly associated with homecoming,
    wreaths, flowers, parsley crowns, and renown from games.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage treats this as epinician celebration; no broader myth-family
    taxonomy ref is asserted.
- id: motif:3
  label: Heroic companion conquest
  taxonomy_refs:
  - culture_hero
  basis: Herakles and Telamon act together in a heroic episode of destroying cities
    and defeating Alkyoneus.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy ref is broad; the passage emphasizes martial exploits more
    than culture-founding acts.
- id: motif:4
  label: Ambushed hero rescued by wise helper
  taxonomy_refs: []
  basis: Akastos steals Peleus' sword and prepares death in ambush, but Cheiron delivers
    Peleus from his hand.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: Cheiron's wisdom is not described in this passage; only his rescue action
    is explicit.
- id: motif:5
  label: Shapeshifting divine beloved and sacred marriage after ordeal
  taxonomy_refs:
  - shapeshifter
  - divine_beloved
  - sacred_marriage
  basis: Peleus survives fire and beast dangers, marries one of the Nereids, and the
    footnote explains that Thetis resisted Peleus by changing into fire and wild beasts.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The main ode is allusive; the explicit identification of Thetis' transformations
    is supplied in the passage footnote.
- id: motif:6
  label: Divine marriage conferring gifts and dynastic kingdom
  taxonomy_refs:
  - royal_legitimacy
