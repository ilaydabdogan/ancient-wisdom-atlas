canonical_text:
  quote: ''
  summary: An ode for Alkimidas of Aigina praises his wrestling victory, reflects
    on the shared origin and unequal strength of gods and humans, compares the alternating
    fame of his kin to fields that yield and rest, recounts victories of Bassid and
    Aiakid figures, invokes the Muse to preserve noble acts, alludes to Achilles killing
    Memnon, and praises the trainer Melesias.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is presented as an ode for Alkimidas of Aigina, winner in the
    boys' wrestling-match, and the introductory note says it may have been sung at
    Aigina for the Bassid clan after the victory.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that men and gods are one race from one mother, identified
    in the footnote as Earth, while their strength is wholly different.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says humans have something like the immortals in bodily shape
    or mighty mind, but do not know the course Destiny has marked for them by day
    or night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Alkimidas' kindred are compared to fruitful fields that at one time yield
    yearly bread and at another time pause and gather back strength.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Alkimidas returns from Nemea after following the ordinance of Zeus and is
    described as no baffled hunter in his wrestling quest, following the footprints
    of his ancestor Praxidamas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Praxidamas is said to have won an Olympic olive-wreath for the Aiakidai and
    multiple crowns at Isthmos and Nemea, removing the obscurity of Sokleides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker asks the Muse to direct a gale of song upon the house and says
    the minstrel's story takes up noble acts after men have vanished.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kallias, a scion of the same stock, is said to have overcome at sacred Pytho
    with a boxer's thong on his hand, pleasing the children of Leto, while his name
    burned bright beside Kastaly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kreontidas is honored at the Isthmos, the holy place of Poseidon, and the
    parsley associated with the Nemean lion shadows his brows for a victory near Phlious.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The fame of the children of Aiakos is said to have flown over land and sea
    to the Ethiopians because Memnon did not return home after Achilles descended
    from his chariot and slew him with a spear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The speaker says he bears a double load as messenger to proclaim the twenty-fifth
    holy-games victory of Alkimidas' house, while two Olympic wreaths were denied
    to Alkimidas and Polytimidas by lot.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Melesias is compared to a dolphin through brine and to a charioteer guiding
    a chariot, because he guided Alkimidas' hands and strength.
  category: relationship
  evidence_refs:
  - ev:11
