candidate_motifs:
- id: motif:1
  label: Shared Earth mother of gods and humans
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: The passage says men and gods are one race from one mother, identified by
    the footnote as Earth, while also emphasizing their differing strength.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is a gnomic reflection within an ode, not a full narrative of divine
    birth or cosmogony.
- id: motif:2
  label: Human-divine duality with uncertain destiny
  taxonomy_refs:
  - duality
  basis: Humans are described as partly like immortals in form or mind, yet radically
    weaker and ignorant of Destiny's course.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The motif is expressed as theological reflection rather than as a mythic
    episode.
- id: motif:3
  label: Alternating fertility as image of alternating generations
  taxonomy_refs:
  - seasonal_cycle
  basis: The Bassid kindred are likened to fields that alternately yield bread and
    pause to regain strength, explaining alternating generations of athletic distinction.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The seasonal or agricultural pattern is metaphorical and applied to a
    family line.
- id: motif:4
  label: Ancestral glory preserved by inspired song
  taxonomy_refs: []
  basis: The Muse is invoked to send song upon the house, and the speaker says the
    minstrel's story preserves noble acts after men vanish.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No supplied taxonomy reference directly corresponds to poetic commemoration.
- id: motif:5
  label: Sacred athletic victory and divine favor
  taxonomy_refs:
  - sacred_exchange
  basis: Victories occur at sacred game sites, are associated with Zeus, Apollo's
    family, Poseidon, wreaths, sacrifice, and the poet's public proclamation of honor.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage presents honor, song, and divine favor together, but does
    not describe a formal reciprocal bargain.
- id: motif:6
  label: Hero slays divine-born opponent
  taxonomy_refs:
  - divine_parent_child
  basis: Achilles kills Memnon, who is explicitly called the son of the bright Morn.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The allusion is brief and subordinate to praise of Aiakid fame.
comparison_claims:
- id: claim:1
  claim: The passage's statement that men and gods share Earth as one mother can be
    compared functionally to mother-goddess and divine-parent/child motif families.
  claim_level: same_function
  target: mother_goddess; divine_parent_child
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not narrate a birth myth; it uses the shared mother
    as a reflective statement about similarity and difference between mortals and
    immortals.
- id: claim:2
  claim: The image of a family alternating between distinguished and undistinguished
    generations can be compared, at a metaphorical level, to seasonal-cycle patterns
    of fertility, rest, and renewed strength.
  claim_level: same_function
  target: seasonal_cycle
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The seasonal-cycle comparison is based on an agricultural simile, not
    on an explicit myth of seasonal divine return.
- id: claim:3
  claim: The Achilles-Memnon allusion belongs to the same motif of Greek heroic combat
    in which Achilles kills Memnon, a son of Dawn.
  claim_level: same_motif
  target: Greek heroic tradition of Achilles slaying Memnon
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the short allusion in this passage is used; no external epic details
    are assumed.
