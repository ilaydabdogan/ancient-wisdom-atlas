canonical_text:
  quote: I pray thee, son of Kronos, grant that the Phenician and the Tuscan war-cry
    be hushed at home...
  summary: The speaker prays to the son of Kronos that Phoenician and Tuscan war-cries
    cease after their defeat at Cumae by the Syracusan captain. The speaker links
    this victory with Greek victories at Salamis, Plataea, and Himera, then advises
    the ruler to speak truthfully, govern justly, spend generously, and seek enduring
    good report. Croesus is remembered for loving-kindness, while Phalaris is remembered
    with hatred for burning people in a brazen bull. The passage concludes that happiness
    is the highest prize and glory the next, together forming the supreme crown.
  language: English
