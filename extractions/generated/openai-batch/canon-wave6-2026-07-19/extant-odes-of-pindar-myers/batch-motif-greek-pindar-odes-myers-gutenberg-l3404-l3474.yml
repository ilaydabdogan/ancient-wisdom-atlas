  summary: The passage introduces Xenokrates of Akragas as a chariot-race victor and
    presents an ode connected with Delphi. The ode describes a poetic pilgrimage to
    the earth's centre-stone, builds a durable treasure of song for Xenokrates and
    his kin, recalls a mountain charge by the son of Philyra to the son of Peleas
    about reverence for god and parent, narrates Antilochos' death while saving Nestor
    from Memnon, and praises Thrasyboulos for wisdom, piety, and hospitality.
  language: English
