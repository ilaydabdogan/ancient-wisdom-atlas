    in the boys' boxing-match, said to have been sung at Olympia after the victory
    with a longer home celebration promised. The poem opens with general images of
    need for winds and rain, states that successful labor deserves song, names divine
    help as the source of enduring wisdom, promises sweet strains upon Agesidamos'
    olive crown, invokes the Muses for the Lokrians, and ends this excerpt with an
    animal proverb about unchanging native temper.
