canonical_text:
  quote: ''
  summary: The ode praises Theron of Akragas for a chariot-race victory, invokes Zeus,
    recalls the fortunes of heroic lineages, describes Semele and Ino as receiving
    immortal life after calamity, recounts the cursed Theban ancestry leading to Thersander,
    and gives an afterlife account in which guilty souls are judged under earth while
    the righteous receive a tearless life and some travel the road of Zeus to the
    tower of Kronos and the islands of the blessed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks what god, hero, or man should be celebrated and answers by
    naming Zeus, Herakles, and Theron’s four-horse victory.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Theron is described as a righteous and god-fearing host, the stay of Akragas,
    the flower of famous sires, and a saviour of the state.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Theron’s ancestors are said to have taken a sacred dwelling place by a river
    and to have become the eye of Sicily, accompanied by wealth and honour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker prays to Zeus, son of Kronos and Rhea, lord of Olympus, the games,
    and Alpheos’ ford, to guard the native fields for future sons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Time is said to be unable to undo deeds already accomplished, whether right
    or wrong, though happy fortune may bring forgetfulness.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Semele is said to live among the Olympians although she perished in the thunder’s
    roar, and she is cherished by Pallas, Zeus, and her ivy-bearing son.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ino is said to have incorruptible life forever among the sea-maids of Nereus.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says mortals cannot know the certain day of death, and that changing
    currents bring joys or toils to men.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The lineage’s destiny is traced to the day Laïos was slain by his destined
    son, fulfilling an oracle spoken at Pytho.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Swift Erinys, seeing the deed, caused Laïos’ warlike sons to die by each other’s
