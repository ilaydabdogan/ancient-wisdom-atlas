  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage says Theron’s race begins from Thersander and that Ainesidamos
    should receive the triumph hymn on the lyre.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Victory is said to free the contestant from the griefs of struggle.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: The guilty souls of all who die are said to pay penalty for sins committed
