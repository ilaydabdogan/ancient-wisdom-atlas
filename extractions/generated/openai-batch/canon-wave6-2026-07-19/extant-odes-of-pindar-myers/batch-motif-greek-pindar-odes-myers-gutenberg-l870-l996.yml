candidate_motifs:
- id: motif:1
  label: Afterlife judgment with penalties and rewards
  taxonomy_refs:
  - divine_judgment
  - afterlife_journey_map
  basis: The passage distinguishes guilty souls who pay penalties and are sentenced
    under earth from the good and oath-keepers who receive a tearless, sunlit life.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The identity of the under-earth judge is not specified in the passage.
- id: motif:2
  label: Journey of purified souls to the islands of the blessed
  taxonomy_refs:
  - afterlife_journey_map
  basis: The steadfast and pure travel the road of Zeus to the tower of Kronos and
    the islands of the blessed, where Rhadamanthos’ decree, Ocean-breezes, golden
    flowers, and wreaths define the blessed setting.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives a destination and conditions but not a detailed itinerary
    beyond the road and tower.
- id: motif:3
  label: Immortal life after catastrophic death or mortal danger
  taxonomy_refs:
  - death_rebirth
  basis: Semele lives among the Olympians after perishing in thunder, Ino receives
    incorruptible life in the sea, and Achilles is brought to the blessed company
    after his mother’s prayer.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: medium
  cautions: The passage states continued or incorruptible life, but it does not narrate
    a full resurrection sequence.
- id: motif:4
  label: Fated kin-slaying and inherited family calamity
  taxonomy_refs: []
  basis: Laïos is killed by his destined son in fulfillment of an oracle, and Erinys
    then brings about the mutual killing of Laïos’ sons, followed by the survival
    of Thersander.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is embedded as an ancestral exemplum for Theron’s lineage rather
    than narrated as an independent myth.
- id: motif:5
  label: Saviour scion after lineage disaster
  taxonomy_refs:
  - royal_legitimacy
  basis: After the fall of Polyneikes and the mutual death of Laïos’ sons, Thersander
    survives, wins honour in war, and becomes the ancestor from whom the praised race
    begins.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage supports lineage restoration and praise, but the taxonomy
    link to royal legitimacy is indirect.
- id: motif:6
  label: Poetic speech as arrows requiring wisdom to interpret
  taxonomy_refs:
  - wisdom
  basis: The speaker says his arrows have a voice for the wise but need interpreters
    for the multitude, and contrasts true natural art with chattering crows.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a poetic self-description and not a narrative myth episode.
