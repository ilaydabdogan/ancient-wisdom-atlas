canonical_text:
  quote: ''
  summary: The ode praises Pytheas of Aigina for a boys' pankration victory at Nemea,
    links his success to Aiginetan heroic ancestry, recalls prayers of the Aiakidai
    to Zeus Hellenios, briefly suppresses an unjust ancestral deed, and recounts a
    mythic episode in which Hippolyte falsely accuses Peleus after he rejects her
    advances. Zeus, guardian of guest-friendship, is aware of Peleus' conduct and
    promises him a Nereid sea-bride, Thetis. The poem also names other athletic victors
    and closes with praise of Themistios' double prize and wreaths.
  language: English
  quote_policy: summarized
