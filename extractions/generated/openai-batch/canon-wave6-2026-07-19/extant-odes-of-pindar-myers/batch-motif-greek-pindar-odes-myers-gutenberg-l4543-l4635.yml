candidate_motifs:
- id: motif:1
  label: Praise-song as mobile carrier of fame
  taxonomy_refs: []
  basis: The speaker explicitly sends the song by ships and boats from Aigina to broadcast
    Pytheas' victory rather than leaving a fixed statue.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a poetic self-presentation motif rather than a mythic narrative
    episode.
- id: motif:2
  label: Ancestral altar prayer for civic flourishing and ships
  taxonomy_refs: []
  basis: The Aiakidai stand by Zeus Hellenios' altar and pray with uplifted hands
    for good men and maritime fame for Aigina.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports the prayer but does not describe a bargain or covenantal
    exchange.
- id: motif:3
  label: Suppressed ancestral crime followed by departure
  taxonomy_refs:
  - departure
  basis: The poet refuses to narrate an unjust deed and mentions the heroes leaving
    the island and being driven from Oinone; the footnote identifies the killing of
    Phokos.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The main text deliberately withholds details, so the crime and departure
    are only partially represented in the passage.
- id: motif:4
  label: Divine choral praise of heroic lineage
  taxonomy_refs: []
  basis: The Muses and Apollo perform in Pelion for the Aiakidai and sing of Zeus,
    Thetis, and Peleus.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a praise-performance scene, not a full independent mythic
    plot.
- id: motif:5
  label: Rejected seduction followed by false accusation
  taxonomy_refs: []
  basis: Hippolyte solicits Peleus, he refuses, and she forges a lying tale to her
    husband that Peleus approached her bed.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No external parallel is named in the passage; the motif label is based
    only on the described action sequence.
- id: motif:6
  label: Hospitality-piety rewarded by divine sea-bride
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: Peleus refuses Hippolyte out of fear of the divine guardian of host and guest;
    Zeus knows this and promises him a bride from among the Nereids.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage states the promise of a sea-bride but does not narrate the
    marriage ceremony itself.
- id: motif:7
  label: Fated athletic succession within kinship line
  taxonomy_refs: []
  basis: The poem states that inborn fate governs acts and presents Pytheas as kinsman
    of Euthymenes who follows in his footsteps, while also naming family-linked victors.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: This is an encomiastic pattern in the ode rather than a separate mythic
    episode.
