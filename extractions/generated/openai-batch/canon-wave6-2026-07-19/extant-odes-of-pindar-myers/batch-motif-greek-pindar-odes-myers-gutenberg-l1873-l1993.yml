canonical_text:
  quote: ''
  summary: 'The passage introduces and performs a delayed victory ode for Agesidamos
    of Epizephyrian Lokris, winner in boys'' boxing at Olympia. The speaker asks the
    Muse and Truth to avert blame for a broken promise and repays the debt with song.
    The poem praises Lokris, Agesidamos, and his trainer Ilas, then recounts Herakles''
    punitive conflict with Augeas and his founding of the Olympic games at Pisa: marking
    the Altis, honoring Alpheios and the twelve gods, naming the Hill of Kronos, sacrificing
    spoils, and establishing the fifth-year feast. It lists first victors, evokes
    moonlit celebration and Zeus''s thunderbolt, and closes by asserting that song
    preserves honorable deeds from oblivion after death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note states that Pindar apparently remembered only long afterwards
    a promise made to Agesidamos in an earlier ode.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he had forgotten that he owed Agesidamos a sweet strain and
    asks to read the Olympic winner's name, identified as Archestratos' son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker invokes the Muse and Truth, daughter of Zeus, to keep him from
    the reproach of wronging a friend by breaking a pledged word.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says he will be delivered from reproach by payment with usury
    and will render a tribute to the friend and his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Truth inhabits the city of the western Lokrians, and that
    Kalliope and mailed Ares are honored there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Agesidamos is identified as winner in boxing at Olympia and is told to render
    thanks to Ilas as Patroklos did to Achilles.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says the ordinances of Zeus move him to sing of the Olympic games
    founded by Herakles near the ancient tomb of Pelops.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Herakles is said to have slain Kleatos and Eurytos in order to obtain from
    Augeas a reward for service done.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Herakles is said to have ambushed and overcome Kleatos and Eurytos beneath
    Kleonai because they had previously harmed his Tirynthian people in Elis.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Augeas' land and city are described as sinking into calamity under fierce
    fire and iron blows, and Augeas falls captive and dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Herakles gathers his host and booty at Pisa, measures a sacred grove for Zeus,
    fences the Altis, marks its bounds, ordains the surrounding plain for rest and
    feasting, honors Alpheios and the twelve greatest gods, and names the Hill of
    Kronos.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the first rite, the Fates and Time are present, and Time is said to tell
    how the founder set apart the choicest spoil as offering, sacrificed, and ordained
    the fifth-year feast with victories of the first Olympiad.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage lists first Olympic victors in foot-race, wrestling, boxing, four-horse
