  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: At evening the moon shines and the precinct sounds with songs of festal glee
    after the manner still used for triumph.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:15
  text: The speaker says the present song will celebrate Zeus's thunder, flaming bolt,
    and fiery lightning that goes with victory.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: The passage says that a man who has done honorable deeds but goes unsung to
    Hades has spent vain breath and gained only brief gladness for his toil.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:17
  text: The lyre, pipe, and Pierian daughters of Zeus are said to foster Agesidamos'
    widespread fame.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: The speaker says he saw Archestratos' son victorious by the might of his hand
