canonical_text:
  quote: ''
  summary: 'The ode addresses Hieron of Syracuse and turns to the myth of Koronis,
    Apollo, and Asklepios: Cheiron once trained Asklepios as a healer; Koronis, pregnant
    with Apollo''s child, is killed after taking Ischys as lover; Apollo rescues the
    child from her funeral pyre; Asklepios becomes a healer but is destroyed by Zeus
    after accepting gold to bring a dead man back. The speaker reflects on mortal
    limits, wishes for healing aid for Hieron, imagines sailing to Syracuse with health
    and victory song, and prays to the Mother and Pan.'
  language: English
  quote_policy: summarized
