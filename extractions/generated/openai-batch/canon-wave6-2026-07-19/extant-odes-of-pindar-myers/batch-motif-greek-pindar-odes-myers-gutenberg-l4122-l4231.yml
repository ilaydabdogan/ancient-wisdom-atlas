canonical_text:
  quote: ''
  summary: 'The ode praises Chromios of Aitna and Sicily, then turns to an ancient
    tale of Herakles: Hera sends two snakes against the newborn Herakles and his twin
    brother; the infant Herakles strangles them. Teiresias prophesies Herakles'' future
    destruction of monsters and hostile men, his role in battle against the giants,
    and his eventual rest, marriage to Hebe, and dwelling beside Zeus.'
  language: English
  quote_policy: summarized
