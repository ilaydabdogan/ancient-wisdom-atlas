canonical_text:
  quote: ''
  summary: The passage introduces Diagoras of Rhodes and his lineage, praises him
    through a banquet-gift simile, names Rhodes as child of Aphrodite and bride of
    Helios, recounts Tlepolemos' killing of Likymnios and consultation of Apollo's
    oracle, describes golden snow falling on Rhodes at Athena's birth, tells of Helios'
    sons forgetting to kindle fire in rites for Athena yet receiving gold and artistic
    skill, and relates the story that Rhodes rose from the sea and became Helios'
    allotted land.
  language: English
  quote_policy: summarized
