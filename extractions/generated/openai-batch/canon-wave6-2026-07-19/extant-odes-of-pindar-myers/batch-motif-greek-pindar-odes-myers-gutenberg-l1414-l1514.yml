candidate_motifs:
- id: motif:1
  label: Divine lineage legitimating a human victor and family
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: The ode links Diagoras' family to Tlepolemos, Herakles, Zeus, and Astydameia
    while praising his victory and family standing.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage is epinician praise rather than a dynastic charter; the royal-legitimacy
    taxonomy is applied cautiously to lineage prestige.
- id: motif:2
  label: Exile or departure after kin-slaying guided by oracle
  taxonomy_refs:
  - departure
  basis: Tlepolemos kills Likymnios, then seeks an oracle that speaks of ships sailing
    from Lerna to a sea-ringed land.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The excerpt implies relocation through the oracle but does not narrate
    the full voyage or settlement in detail.
- id: motif:3
  label: Miraculous birth of Athena from Zeus' head
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Athena leaps into light from her father's head under Hephaistos' axe, with
    cosmic trembling at her arrival.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage recounts a familiar divine birth briefly and allusively.
- id: motif:4
  label: Faulty or incomplete rite followed by divine favor
  taxonomy_refs:
  - sacred_exchange
  basis: Helios' sons are instructed to offer to Athena but forget to kindle the ritual
    fire; nonetheless Zeus rains gold and Athena grants craft excellence.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The rite is defective rather than explicitly punished; the exchange category
    is based on offering and divine response.
- id: motif:5
  label: Island emerging from the sea as a god's allotted domain
  taxonomy_refs:
  - water
  basis: Rhodes is hidden in the briny depths during the divine allotment of land,
    then is seen growing from the sea and sent up to the light as Helios' possession.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: Available taxonomy does not include a dedicated land-emergence motif;
    the water symbol reference is used because the scene centers on the sea.
- id: motif:6
  label: Island as bride of a solar god
  taxonomy_refs:
  - sacred_marriage
  basis: Rhodes is explicitly called the bride of Helios and child of Aphrodite in
    the praise of the island.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The excerpt names the bridal relationship but does not narrate a marriage
    ritual or union.
- id: motif:7
  label: Divine bestowal of craft knowledge
  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: Athena gives the people excellence in every art of handicraft, resulting
    in lifelike images of beasts and creeping things.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage attributes skill directly to Athena; it does not present a
    human culture hero teaching the crafts.
