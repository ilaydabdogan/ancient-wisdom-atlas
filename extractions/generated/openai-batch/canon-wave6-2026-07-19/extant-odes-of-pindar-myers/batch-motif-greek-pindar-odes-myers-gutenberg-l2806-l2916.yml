canonical_text:
  quote: ''
  summary: The passage introduces Pindar's ode for Arkesilas of Kyrene and recounts
    oracles and prophecies linking Kyrene's foundation to Medea, the Argonauts, Euphemos,
    Battos, and Apollo. Medea foretells Libyan settlement from Thera after Euphemos
    receives and loses a divine clod of earth. The poem then connects Battos and Arkesilas
    to Delphic sanction and begins the tale of the Argonaut quest for the golden fleece,
    ending with Pelias' oracle about a man of one sandal.
  language: English
  quote_policy: summarized
