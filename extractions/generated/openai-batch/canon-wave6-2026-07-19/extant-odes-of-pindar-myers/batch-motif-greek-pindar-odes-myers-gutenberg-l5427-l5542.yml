canonical_text:
  quote: ''
  summary: The ode opens by giving priority to Thebes over a promised Delian-Apollonian
    commission, praises Herodotos of Thebes for a chariot victory at the Isthmian
    games, links his achievement with heroic charioteers Kastor and Iolaos, invokes
    Poseidon and other sacred places, recalls Asopodoros' shipwreck and reception
    at Orchomenos, argues that valour deserves praise, and contrasts public honour
    with hidden wealth that ends without good report.
