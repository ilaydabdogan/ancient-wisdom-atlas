canonical_text:
  quote: ''
  summary: Bharat returns the realm to Ráma and requests the old consecration rite.
    Ráma assents, is groomed and dressed, and enters Ayodhyá in a royal procession
    with Sítá, his brothers, Vibhishaṇ, Sugríva, Vánar chiefs, Bráhmans, cattle, maidens,
    and cheering crowds. For the rite, Vánar envoys bring water in golden urns from
    the four seas and many streams. Vaśishṭha and other sages place Ráma and Sítá
    on a jeweled throne and sprinkle Ráma with sacred drops; divine and human participants
    acclaim him, royal insignia are displayed, and the land shows abundance. Ráma
    distributes gifts, and Sítá, with Ráma’s consent, gives a pearl chain to Hanúmán
    as a faithful ally.
  language: English
  quote_policy: summarized
