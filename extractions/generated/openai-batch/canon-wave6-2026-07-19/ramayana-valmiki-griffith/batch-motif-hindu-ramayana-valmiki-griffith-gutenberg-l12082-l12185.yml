canonical_text:
  quote: ''
  summary: 'The passage describes the morning preparations for Ráma’s royal consecration:
    priests, civic leaders, ritual objects, sacred waters, performers, regalia, animals,
    and auspicious celestial signs are assembled. The waiting crowd notices the king’s
    absence. Sumantra enters the inner bower, blesses and awakens the king, and the
    king orders him to bring Ráma as previously commanded by the queen.'
  language: English
  quote_policy: summarized
