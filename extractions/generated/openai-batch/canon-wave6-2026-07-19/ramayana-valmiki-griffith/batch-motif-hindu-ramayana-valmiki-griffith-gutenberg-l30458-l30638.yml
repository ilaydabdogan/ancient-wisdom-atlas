canonical_text:
  quote: ''
  summary: Akampan reports Rāma’s destruction of Janasthān and warns Rāvaṇa that Rāma
    cannot be defeated openly. He advises guile through the theft of Sītā. Rāvaṇa
    accepts the plan and travels by aerial car to Mārīcha, who warns him that abducting
    Sītā would provoke Rāma’s deadly vengeance. Rāvaṇa temporarily abandons the plan
    and returns to Lankā.
  language: English
  quote_policy: summarized
