canonical_text:
  quote: ''
  summary: In this Latin appendix passage, a priest prepares a rite for King Dasaratha
    to obtain sons. Gods assembled at the sacrifice grant the request for four sons.
    The gods then complain to Brahman that Ravana, protected by a boon, oppresses
    gods, sages, celestial beings, mortals, and the three worlds. Brahman explains
    that Ravana omitted humans from the boon and can be killed by a man. Vishnu arrives
    with divine emblems, is asked to be born through Dasaratha’s three wives by dividing
    himself fourfold, and promises to kill Ravana and reign among mortals.
  language: Latin
  quote_policy: summarized
