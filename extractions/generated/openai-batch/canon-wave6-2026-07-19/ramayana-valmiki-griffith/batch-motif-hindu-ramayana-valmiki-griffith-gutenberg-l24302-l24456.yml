canonical_text:
  quote: ''
  summary: Vaśishṭha leads the royal widows toward Ráma. Kauśalyá sees the stream,
    the forest bank, and Ráma’s simple funeral offering for his father. The queens
    meet Ráma, Lakshmaṇ, and Sítá at the hermitage with gestures of reverence and
    grief. Ráma honors Vaśishṭha; Bharat sits humbly with the assembly and then yields
    the government to Ráma, urging him to return and rule.
  language: English
  quote_policy: summarized
