canonical_text:
  quote: ''
  summary: Rāma announces that he renounces wealth, lordship, retinue, and royal comforts
    for fourteen years of forest banishment. Kaikeyī gives bark garments; Rāma and
    Lakṣmaṇ put them on, while Sītā struggles with the unfamiliar bark dress until
    Rāma fastens it over her silks. Palace women weep and ask that Sītā remain. Vaśiṣṭha
    rebukes Kaikeyī, argues that Sītā shares Rāma’s self and throne, and declares
    that the people, brothers, and even animals would follow Rāma into the woods rather
    than accept a kingdom without him.
  language: English
  quote_policy: summarized
