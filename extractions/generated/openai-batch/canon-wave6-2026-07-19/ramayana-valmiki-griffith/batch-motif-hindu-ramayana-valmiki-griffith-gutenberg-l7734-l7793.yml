canonical_text:
  quote: ''
  summary: Triśanku falls from the sky and calls to Viśvámitra for rescue. Viśvámitra
    stops him, creates new stars in the southern sky, threatens to create another
    Indra or new gods, and insists that his promise to bring Triśanku bodily to heaven
    must stand. The gods object that Triśanku is still marked by his master's curse,
    but finally agree that Viśvámitra's stars will remain and that Triśanku will hang
    head downward among them as one divine. The assembly disperses after Viśvámitra
    assents.
  language: English
  quote_policy: summarized
