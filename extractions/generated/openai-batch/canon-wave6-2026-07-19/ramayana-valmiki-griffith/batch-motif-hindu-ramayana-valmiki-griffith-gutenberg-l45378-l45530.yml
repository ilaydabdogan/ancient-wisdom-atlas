  summary: The Wind-God’s son beholds an ornate aerial car attributed to Viśvakarmá,
    capable of flying, sinking, and rising at its master’s will and drawn by night-roving
    goblins. He then enters Rávaṇ’s palace, where armed guards, jeweled halls, heavenly
    luxury, abducted royal women, and sleeping women after revelry are described through
    celestial and floral imagery.
