  quote: "“For none / Is to the mother like her son.”"
  summary: Indra hears Surabhí explain that she weeps for two suffering children forced
    to labor. The passage then applies this maternal grief to Kauśalyá, bereft of
    Ráma, and an unnamed royal speaker condemns the Queen, vows to perform rites for
    kin, restore the rightful king, go to the forest, and finally falls in rage with
    animal similes.
