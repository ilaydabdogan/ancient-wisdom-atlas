canonical_text:
  quote: ''
  summary: Lakshmaṇ announces Rāma, Sítā, and himself at Agastya’s hermitage. Agastya
    joyfully receives the royal visitors, Rāma passes through a sacred grove with
    deer and many divine shrines, and Agastya performs guest hospitality. The sage
    then gives Rāma a divine bow, shaft, quiver, arrows, and sword associated with
    Vishṇu and Mahendra, saying the weapons will bring conquest.
  language: English
