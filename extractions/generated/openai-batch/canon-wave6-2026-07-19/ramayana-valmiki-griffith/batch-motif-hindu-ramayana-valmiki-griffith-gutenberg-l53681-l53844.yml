canonical_text:
  quote: ''
  summary: The Vánar army first flees from Kumbhakarṇa, then is rallied by Angad.
    The battle resumes with Vánars using rocks, trees, and mountain fragments as weapons.
    Kumbhakarṇa withstands attacks, kills many Vánars with mace, spear, hands, and
    body, devours captives, and fights named champions including Dwivid, Hanumán,
    Níla, Angad, and Sugríva.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After hearing a voice, the fleeing Vánars stop and again stand arrayed for
    war, throwing mountain peaks and flowering trees at the foe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kumbhakarṇa remains unmoved while missiles strike him and rocks break against
    his body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kumbhakarṇa charges with fury, and Vánars fall beneath his feet; some flee
    toward the shore and bridge, while others climb trees or seek mountain, cave,
    or dell.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Angad calls the fleeing Vánar chiefs back to battle, says there is no hidden
    place on earth for safety, and warns them against disgrace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Vánars answer that they have fought in vain, have seen their strongest
    slain, fear the giant's force, and flee because they value their lives.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Angad dispels the Vánars' dread; they turn back, form ranks, and wait according
    to his will.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Vánars resume battle, determined either to die on the spot or gain a warrior's
    reward on high, and seize rocks and fallen trees as weapons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kumbhakarṇa raises and whirls a huge mace, killing large numbers of Vánars;
    the fallen are described as devoured like snakes overpowered by Garuḍ.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dwivid throws an uprooted mountain; it passes over Kumbhakarṇa and crushes
    members of his host, horses, and cars.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hanumán hurls rocks and trees, but Kumbhakarṇa's spear stops the missiles;
    Hanumán then strikes him with a wooded hill, and Kumbhakarṇa wounds Hanumán in
    the breast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Níla throws a mountain fragment, but Kumbhakarṇa smashes it to powder with
    his fist.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Five Vánar chieftains attack Kumbhakarṇa face to face with rocks, trees, hands,
    and feet; he throws down or overthrows several named chiefs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Kumbhakarṇa draws captives in with his arms and eats them; some Vánars escape
    through his nostrils and ears from the gloomy cave of his jaws or body.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Kumbhakarṇa seizes a ponderous spear and charges; the Vánars fall before him
    and flee to Raghu's son.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Angad attacks Kumbhakarṇa with a mountain peak, avoids the giant's spear,
    strikes his chest and throat, but is caught by the wrist, whirled, and dashed
    senseless to the ground.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: Kumbhakarṇa next rushes at King Sugríva, who stands waiting, lifts a shattered
    hill, and challenges Kumbhakarṇa to face him rather than lesser foes.
  category: sequence
  evidence_refs:
  - ev:14
