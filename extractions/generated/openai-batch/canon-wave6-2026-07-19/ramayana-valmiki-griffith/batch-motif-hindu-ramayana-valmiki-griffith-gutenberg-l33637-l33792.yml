canonical_text:
  quote: ''
  summary: Rávaṇ carries the Maithil lady, Ráma's wife, through the air after abducting
    her. She rebukes him, says a magic deer lured her husband away, recalls the vulture
    king who died defending her, predicts Rávaṇ's death and hellish punishment, and
    threatens Ráma's vengeance. While being carried toward Lanká, she drops ornaments
    to five monkeys as signs of her path. Rávaṇ crosses Pampa and the sea, and celestial
    voices warn that his guilty deed will bring his end.
  language: English
  quote_policy: summarized
