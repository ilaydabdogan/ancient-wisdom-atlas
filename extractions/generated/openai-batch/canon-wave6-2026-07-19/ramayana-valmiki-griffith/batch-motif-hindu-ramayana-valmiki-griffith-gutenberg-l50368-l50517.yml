canonical_text:
  quote: ''
  summary: After Rāma's host has crossed the sea, Rāvaṇ sends Śuka and Sāraṇ to reconnoiter
    the Vānar army, its bridge, and its leaders. Vibhishaṇ detects the spies, but
    Rāma releases them as envoys and sends a warning to Rāvaṇ. The spies report Rāma's
    strength and advise restoring Sītā; Rāvaṇ refuses and surveys the opposing host
    from his palace roof.
  language: English
  quote_policy: summarized
