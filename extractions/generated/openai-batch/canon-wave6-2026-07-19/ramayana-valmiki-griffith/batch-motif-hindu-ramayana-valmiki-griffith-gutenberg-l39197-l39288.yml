canonical_text:
  quote: ''
  summary: Sugríva stands near Báli’s stronghold with Ráma and companions, asks Ráma
    to remember his promise that Báli will fall, and is reassured by Ráma. Ráma points
    to the flowery twine placed on Sugríva by Lakshmaṇ as a sign, promises that one
    arrow will end Sugríva’s fear, recalls the feat of shooting through seven trees,
    affirms his oath, and tells Sugríva to challenge Báli at the gate. Sugríva then
    raises a fierce battle-shout that terrifies nearby animals.
  language: English
  quote_policy: summarized
