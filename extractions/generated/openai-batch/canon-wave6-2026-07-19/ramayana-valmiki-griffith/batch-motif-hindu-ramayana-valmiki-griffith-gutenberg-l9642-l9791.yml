canonical_text:
  quote: ''
  summary: Bharat goes to his grandsire with Śatrughna and remains under King Aśvapati’s
    care, while the aged king left behind continues to think of his absent sons. The
    passage then praises Ráma as the eldest and most beloved son, listing his moral,
    intellectual, religious, civil, and martial qualities. The aged monarch wishes
    to install Ráma over the kingdom and see him anointed before he dies and reaches
    heaven. Omens in earth and sky and his own weakness prompt urgency. He summons
    people, princes, peers, and rulers, honors them with residences and gifts, omits
    Kekaya’s king and Janak because of haste, and sits among the assembled rulers
    before beginning a public address.
  language: English
  quote_policy: summarized
