canonical_text:
  quote: ''
  summary: The passage summarizes Lakshmaṇ’s interruption of Ráma’s interview with
    Time, his abandonment and bodily conveyance to heaven, and Ráma’s subsequent great
    departure. Ráma proceeds with brothers, subjects, ritual objects, personified
    powers, gods, and attendants to the Sarayú, enters its waters, is addressed by
    Brahmá as Vishṇu, enters Vishṇu’s glory with his followers, and has a celestial
    abode appointed for them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lakshmaṇ interrupts Ráma’s interview with Time to report the rishi’s message,
    while knowing death will follow from the interruption.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ráma comes out; Durvásas receives the food he wanted and departs; Ráma is
    distressed because Time’s words require Lakshmaṇ to die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lakshmaṇ tells Ráma not to grieve, to abandon him, and not to break his promise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the counsellors agree with Lakshmaṇ’s advice, Ráma abandons Lakshmaṇ.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lakshmaṇ goes to the river Sarayú, suppresses all his senses, and is conveyed
    bodily by Indra to heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The gods are delighted by the arrival of the fourth part of Vishṇu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Ráma resolves to install Bharata as successor and retire to the forest to
