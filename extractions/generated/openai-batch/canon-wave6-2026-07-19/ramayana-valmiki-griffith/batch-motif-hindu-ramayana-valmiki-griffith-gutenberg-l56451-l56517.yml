canonical_text:
  quote: ''
  summary: After the car is declared ready, Rāma orders rewards of pearls, gems, and
    gold for the allies who helped win Vibhishaṇ's throne. Rāma boards the radiant
    car with his dame and Lakshmaṇ, bids farewell to Vibhishaṇ, Sugríva, and the Vánar
    chiefs, and prepares to leave Lanka. The allies ask to accompany him to Ayodhya
    to witness his coronation and pay homage to Kauśalyá. Rāma welcomes them aboard,
    and the wondrous car rises through the air and clouds.
  language: English
  quote_policy: summarized
