canonical_text:
  quote: ''
  summary: Women of Ayodhyá, grieving Ráma’s exile, address their husbands. They say
    Ráma would guide them and Sítá provide for them, condemn Kaikeyí, refuse to remain
    under her rule, predict the king’s death and the kingdom’s ruin, and describe
    themselves as handed over to Bharat. Night falls on a mournful city where worship,
    recitation, festivity, music, commerce, and joy have ceased.
  language: English
  quote_policy: summarized
