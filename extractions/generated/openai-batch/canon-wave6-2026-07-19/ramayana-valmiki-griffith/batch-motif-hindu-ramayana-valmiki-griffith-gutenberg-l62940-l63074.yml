canonical_text:
  quote: ''
  summary: 'A sequence of explanatory footnotes identifies mythic and cosmological
    details: earth-supporting elephants, Devas and Asuras fighting in the directions,
    Kapil as a fiery or volcanic force, divine genealogies, cosmic rivers and seas,
    ocean-associated beings and treasures, Lakshmí as daughter of the Milky Sea, and
    Indra’s thunderbolt episode involving Diti and the Maruts. Several notes also
    make cautious Greco-Roman comparisons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ancient Indian belief is described in which elephants support the earth
    on their backs, and a tired elephant’s head-shaking makes the earth tremble with
    woods and hills.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Devas and Asuras fight in the east, south, west, and north, where the
    Devas are defeated, and then in the north-east, where the Devas are not defeated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The north-eastern direction is called aparájitá, meaning unconquerable, and
    the note connects it with the performance of work and the clearing of religious
    debts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note reports Gorresio’s interpretation that Kapil may represent a hidden
    fiery force that bursts forth in volcanic effects, and says Kapil is also a name
    of Agni, God of Fire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Garuḍ is identified as the son of Kaśyap and Vinatá.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Diti and Aditi are identified as wives of Kaśyap and as mothers respectively
    of Titans and Gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The lake Vindu is said not to exist, and seven named rivers are discussed,
    of which only the Ganges and Sindhu or Indus are known to geographers in the note.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: One sea is described as one of seven seas surrounding seven worlds in concentric
    rings.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Apsaras are explained through water-based etymologies as inhabitants of water,
    nymphs of the stream, or personifications of vapours forming mist or clouds.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Surá is described as a feminine term for intoxicating liquors, and the note
