  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The high-eared horse of Indra is mentioned, with a comparison to a horse produced
    from the sea by Neptune.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kaustubha is described as a gem that burns with living light on Lord Vishṇu’s
