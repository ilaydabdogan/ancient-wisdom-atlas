  quote: ''
  summary: Khara sees that Ráma has slain key giants and much of his force, attacks
    Ráma with a storm of arrows, and wounds him. Ráma answers with fiery arrows, strings
    the bow of Vishṇu given by Agastya, strikes down Khara’s flag, wounds Khara, destroys
    his chariot, kills his horses and driver, and leaves Khara standing on foot with
    a mace while gods and saints watch, praise, and bless Ráma.
