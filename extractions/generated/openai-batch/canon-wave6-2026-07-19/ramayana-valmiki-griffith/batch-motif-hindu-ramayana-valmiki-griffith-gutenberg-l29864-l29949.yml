canonical_text:
  quote: ''
  summary: Triśirás asks Khara to let him fight Ráma, vows by his sword to kill Ráma
    or fall, and advances in a chariot. Ráma answers Triśirás’s arrows with his own
    shafts, destroys the chariot team and driver, cuts off the giant’s three heads,
    and leaves the surviving fiends to flee back to Khara, who rallies them and charges
    Ráma.
  language: English
  quote_policy: summarized
