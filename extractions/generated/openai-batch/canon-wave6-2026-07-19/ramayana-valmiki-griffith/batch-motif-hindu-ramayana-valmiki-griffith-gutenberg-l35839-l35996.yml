canonical_text:
  quote: ''
  summary: After rites are completed, Ráma and Lakshman continue searching for Sítá
    through dark and tangled forests. They encounter the giantess Ayomukhi near a
    mountain cave; she seizes and woos Lakshman, who wounds and drives her away. Lakshman
    then reads bad omens, including an ominous bird cry. The brothers hear a destructive
    sound and confront a huge headless fiend, identified by the canto title as Kabandha,
    who has a mouth below the waist, one eye in his chest, flame-like brilliance,
    and very long arms. The fiend blocks their path, seizes them, and holds them helpless.
  language: English
  quote_policy: summarized
