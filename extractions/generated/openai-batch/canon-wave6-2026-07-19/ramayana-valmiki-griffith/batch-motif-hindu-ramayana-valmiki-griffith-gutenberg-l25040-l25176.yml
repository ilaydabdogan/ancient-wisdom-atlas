canonical_text:
  quote: ''
  summary: Vaśishṭha addresses Ráma, explains that Jáváli spoke only to change Ráma’s
    resolve, then recounts a cosmogony beginning with water and Brahmá, a long genealogy
    of the Ikshváku/Raghu line, the story of Sagar’s threatened birth, and the rule
    that the eldest son inherits the throne. He concludes that Ráma, as Daśaratha’s
    eldest son, should accept the kingdom.
  language: English
  quote_policy: summarized
