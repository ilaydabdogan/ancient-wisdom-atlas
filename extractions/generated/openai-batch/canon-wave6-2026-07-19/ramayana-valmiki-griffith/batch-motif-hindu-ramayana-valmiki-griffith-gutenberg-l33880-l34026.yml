canonical_text:
  quote: ''
  summary: Rávaṇ commands giant subordinates, visits the grieving captive Sítá under
    fiendish guard, shows her his wealthy palace and gardens, and urges her to become
    his wife. He boasts of his armies, island fortress, power, gifts, and seized chariot,
    disparages Ráma, and claims no one can rescue her. Sítá weeps silently while Rávaṇ
    renews his plea; the narrator closes with a foreboding note that Rávaṇ thinks
    she is his while he is already caught in Death’s coils.
  language: English
  quote_policy: summarized
