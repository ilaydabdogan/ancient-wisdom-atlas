  quote: "“Should to the distant wilds be sent / For fourteen years of banishment?”"
  summary: Kaikeyí presses a harsh request. The monarch, overwhelmed by anguish, falls
    to the ground, faints, denounces her plan as ruinous, pleads that Ráma has done
    no wrong, praises Ráma’s virtues and filial conduct, questions the proposed fourteen-year
    banishment, offers the riches of the sea-girt land if she will withdraw her words,
    and collapses in grief while begging her to save Ráma.
