canonical_text:
  quote: ''
  summary: The daughter of Videha’s king, Ráma’s wife, answers Ráma while he tries
    to soothe her. She reproaches him for proposing to go to the wood without her,
    declares exclusive devotion to him, compares herself to Sávitrí’s devotion to
    Satyaván, insists she will share the forest journey, imagines hardship becoming
    pleasant in his presence, renounces grief for home and family, and says she would
    choose poison or death rather than endure long separation from him.
  language: English
  quote_policy: summarized
