canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes in which Rávaṇ is defeated and released,
    allies with Báli, invades the realm of departed spirits, descends to Pátála, subdues
    serpents, fights several divine or royal opponents, seizes women, and is connected
    to Indrajít''s capture and release of Indra for a boon involving sacrifice. It
    then recounts an explanation of Hanumán''s hidden strength and turns to Ráma and
    pregnant Sítá: Sítá wishes to visit Ganges hermitages, but public slander leads
    Ráma to send Lakshmaṇ to abandon her there, where she grieves and sends back a
    submissive message.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rávaṇ attacks Arjuna or Kárttavírya, is defeated, captured, imprisoned, and
    then released after Pulastya intercedes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rávaṇ visits Kishkindhá and enters an alliance with Báli, king of the Vánars,
    proposing that they share possessions and pleasures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rávaṇ invades the kingdom of departed spirits and battles Yáma; the region
    is described with a bloody river, lamentations, thirst, devouring worms, punishments
    of the guilty, and pleasures of the just.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yáma is said to be defeated because, at Brahmá's request, he refrains from
    using a deadly weapon against Rávaṇ, who had received a preserving promise from
    Brahmá.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rávaṇ goes under the earth into Pátála, a water-treasure realm inhabited by
    serpents and Daityas and defended by Varuṇ.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rávaṇ subdues Bhogavatí, the city ruled by Vásuki, reduces the Nágas to subjection,
    reaches Varuṇ's imperial seat, defeats Varuṇ's sons, and departs triumphant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Rávaṇ and Mándhátá fight with supernatural weapons until Mándhátá prepares
    a weapon obtained through Rudra's favor; Pulastya and Gálava then part the combatants.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rávaṇ returns home in Pushpak carrying virgin daughters of kings, Rishis,
    Daityas, and Gandharvas whom he has seized.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Meghanáda, also called Indrajít in the continuation, captures Indra with magic
    art, carries him to Lanká, and releases him after Brahmá intercedes and a boon
    is obtained that sacrifice to the Lord of Fire will make him invincible in battle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Agastya explains Hanumán's strength by saying that Hanumán had been under
    a Rishi's curse and was therefore not conscious of his own might.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Rishis return to their celestial seats, Vánars, Rákshases, and bears depart,
    and Pushpak is restored to Kuvera.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After winter, Ráma and pregnant Sítá sit happily in the shade of Aśoka trees,
    and Sítá asks to visit pure hermitages on the banks of the Ganges.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: People in Ayodhyá slander Ráma for taking back Sítá after her captivity in
    Rávaṇ's palace; although Ráma knows her purity and love, he resolves to abandon
    her and orders Lakshmaṇ to leave her at the hermitage.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: At the hermitage, Lakshmaṇ tells Sítá what has been ordered; she faints, grieves,
    resolves to live for Ráma and her unborn son, and sends a message accepting her
    husband's authority.
  category: sequence
  evidence_refs:
  - ev:12
