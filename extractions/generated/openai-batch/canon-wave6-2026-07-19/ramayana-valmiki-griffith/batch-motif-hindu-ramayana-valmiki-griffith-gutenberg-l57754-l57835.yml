- id: motif:2
  label: Descent to an under-earth serpent and water realm
  taxonomy_refs:
  - hero_descent
  - serpent
  basis: Rávaṇ goes under the earth into Pátála, a treasure-house of waters inhabited
    by serpents and Daityas, and subdues Vásuki's city and the Nágas.
  evidence_refs:
