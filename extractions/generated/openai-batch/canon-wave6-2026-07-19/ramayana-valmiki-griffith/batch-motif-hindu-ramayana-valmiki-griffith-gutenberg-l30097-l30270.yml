canonical_text:
  quote: ''
  summary: Ráma confronts Khara, denounces him for violence against hermit saints,
    and declares that sinners must reap punishment. Khara replies with accusations
    of boasting and threatens to kill Ráma with his mace. Khara hurls a fiery gold-ringed
    mace, but Ráma cuts it apart with arrows. Ráma then predicts Khara’s death and
    the restoration of Daṇḍak forest as a safe refuge for devotees once the giants
    are expelled.
  language: English
  quote_policy: summarized
