canonical_text:
  quote: ''
  summary: Báli dies from Ráma’s shaft. The Vánars lament their dead lord, and Tárá
    embraces and laments her husband’s body, speaks of widowhood and loss, asks Angad
    to salute his father, and interprets the battle in sacrificial language. Níla
    draws out the fatal shaft; the passage describes fire, serpent, blood, tree, and
    mountain imagery around the death scene.
