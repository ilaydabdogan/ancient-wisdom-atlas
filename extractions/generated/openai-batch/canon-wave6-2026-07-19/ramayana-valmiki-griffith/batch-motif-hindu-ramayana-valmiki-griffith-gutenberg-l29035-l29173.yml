canonical_text:
  quote: ''
  summary: Khara finds his mutilated sister lying in grief. She reports that Ráma
    killed the fourteen giants sent to avenge her injury, appeals to Khara’s pity
    and kinship, and taunts him as weak unless he attacks. Khara’s anger rises; he
    vows that Ráma and Lakshmaṇ will go to Yama’s realm, promises his sister blood
    vengeance, and orders Dúshaṇ to assemble fourteen thousand giants, a chariot,
    bows, swords, shafts, and lances for battle.
  language: English
  quote_policy: summarized
