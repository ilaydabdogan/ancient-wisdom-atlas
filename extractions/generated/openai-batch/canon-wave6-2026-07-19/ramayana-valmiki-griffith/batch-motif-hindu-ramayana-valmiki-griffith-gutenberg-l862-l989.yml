  quote: ''
  summary: The passage summarizes Ráma’s movement from Chitrakúṭa into Daṇḍaká forest,
    his battles with fiends, the abduction of Sítá by Rávaṇ with Márícha’s aid, Ráma’s
    grief and renewed quest, alliances with Hanumán and Sugríva, the slaying of Báli
    and installation of Sugríva, and Hanumán’s leap to Lanká, discovery of Sítá, destruction
    in the city, and return with news.
  language: English
