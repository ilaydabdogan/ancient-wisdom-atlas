canonical_text:
  quote: ''
  summary: Royal women and the people of Ayodhyá lament Ráma’s banishment to the forest.
    Ritual, animal, celestial, and civic disorders accompany his departure. Daśaratha
    watches Ráma’s chariot depart, faints, rejects Kaikeyí, renounces their marital
    bond, and laments the hardships awaiting Ráma and Janak’s daughter in the forest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The royal women lament that their lord, protector of the poor and weak, has
    been banished to the forest through his father’s command and Kaikeyí’s guile.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monarch hears the women’s lament, is overcome by grief for his son, bows
    his head, and loses sense and memory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Ráma’s departure, worship fires are not fed, darkness covers the sun,
    animals refuse normal nurture or food, and ominous planetary and meteor signs
    appear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ayodhyá and its inhabitants are described as shaken and grieving; people neglect
    pastime, food, family ties, and sleep because their attention is fixed on Ráma.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Daśaratha keeps looking at the dust of Ráma’s car until it vanishes, then
    faints; Kauśalyá and Bharat’s mother try to support him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Daśaratha tells Kaikeyí not to touch him, rejects her as wife and friend,
    renounces the marriage bond formed around the flame, and rejects funeral offerings
    from Bharat if Bharat rejoices in the rule won by her art.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Daśaratha clings to Kauśalyá, returns toward the palace in grief, and suffers
    at the sight of the chariot traces on the road.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Daśaratha sees the hoofprints left by the horses and laments that Ráma, once
    accustomed to royal comforts, will sleep on log, stone, and earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Daśaratha imagines forest dwellers seeing the hero roam like a friendless
    thrall and fears that Janak’s daughter will be terrified by wild beasts; he says
    he has no will to live without his son.
  category: speech
  evidence_refs:
  - ev:9
