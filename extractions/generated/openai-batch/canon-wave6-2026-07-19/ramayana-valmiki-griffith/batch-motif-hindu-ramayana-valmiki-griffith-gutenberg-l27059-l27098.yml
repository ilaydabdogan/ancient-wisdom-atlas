  quote: ''
  summary: A holy hermit praises a blessed forest retreat and invites Ráma to rest
    there. Ráma, armed with bow and darts, fears that staying among the forest animals
    could bring harm and dishonour the hermit, so he plans only a brief stay. He performs
    evening rites, lodges with Sítá and his brother beneath the grove, and Sutíkshṇa
    hospitably feeds the princely guests with hermit fare.
