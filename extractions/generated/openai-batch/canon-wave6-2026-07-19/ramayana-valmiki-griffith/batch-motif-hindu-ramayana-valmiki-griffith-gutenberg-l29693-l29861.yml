canonical_text:
  quote: ''
  summary: In the battle, Dúshaṇ summons five thousand fiends against Ráma. Ráma withstands
    their missiles, disables Dúshaṇ’s chariot, cuts off Dúshaṇ’s arms, and kills him.
    Spirits praise Ráma. Three other chiefs attack and are slain, and Ráma destroys
    the remaining fiends. Khara then orders a renewed assault; Ráma kills the remnant
    of the demon host. The battlefield is described with altar and hell imagery. Khara
    and a triple-headed monster remain alive, and Khara drives against Ráma.
  language: English
  quote_policy: summarized
