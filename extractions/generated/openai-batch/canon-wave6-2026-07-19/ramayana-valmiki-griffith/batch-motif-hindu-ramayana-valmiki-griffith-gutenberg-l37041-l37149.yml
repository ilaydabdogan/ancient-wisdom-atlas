canonical_text:
  quote: ''
  summary: A separated speaker addresses Lakshman while viewing spring blossoms, birds,
    winds, flowering trees, forest glades, and the waters of Pampa. The beauty of
    spring intensifies his grief over Sita, whom he describes as imprisoned in a distant
    land, and he imagines her sharing or suffering from the same seasonal pain. A
    dark-winged bird is imagined as a possible helper or guide to her side. The scene
    includes bees, birds, Kinnars with their loves, crimson lilies, lotuses, swans,
    mallards, roedeer, and elephants; all former delights have lost their pleasure
    without the absent beloved.
  language: English
  quote_policy: summarized
