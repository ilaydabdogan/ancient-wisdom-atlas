canonical_text:
  quote: ''
  summary: Ráma demonstrates his strength by shooting an arrow through seven palm
    trees, a hill, and subterranean realms, after which Sugríva praises him and asks
    him to kill Báli. Sugríva challenges Báli at Kishkindhá, but Ráma withholds his
    arrow because the two combatants look alike. After Sugríva is defeated and complains,
    Ráma explains the danger of striking the wrong warrior and orders a visible token.
    Lakshmaṇ ties a flowering creeper garland around Sugríva’s neck before the return
    to Kishkindhá.
  language: English
  quote_policy: summarized
