canonical_text:
  quote: |-
    He drew that sword which none could stay,
    And cleft her nose and ears away.
  summary: In Canto XVIII, Rāma responds to the passion-struck Śūrpaṇakhā by pointing
    to Sītā as his wife and redirecting her to Lakshmaṇ. Lakshmaṇ mockingly redirects
    her back to Rāma. Śūrpaṇakhā threatens to devour Sītā and rushes at her. Rāma
    stops the attack and orders Lakshmaṇ to mark and deform her. Lakshmaṇ cuts off
    her nose and ears. Bleeding and shrieking, she flees to Janasthān and reports
    the episode to Khara.
  language: English
  quote_policy: quoted
