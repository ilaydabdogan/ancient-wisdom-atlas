canonical_text:
  quote: |-
    One brings again
    The breath of life to warm the slain;
  summary: At night Hanúmán and Vibhishaṇ search a battlefield filled with wounded
    and dead Vánars and find the wounded bear-chief Jámbaván. Jámbaván asks whether
    Hanúmán lives, declares him the army’s hope, and sends him to the Himalaya for
    four radiant medicinal herbs. Hanúmán flies across the sea to the sacred mountain,
    cannot see the herbs because they hide, tears off the mountain summit, carries
    it back, and the scent of the herbs revives and heals Raghu’s sons and the Vánar
    host.
  language: English
  quote_policy: quoted
