canonical_text:
  quote: ''
  summary: Risyasringa tells King Dasaratha that he will perform another holy rite
    so the king may obtain offspring. Gods and other beings attend the royal sacrifice.
    Risyasringa petitions them for four celebrated sons for Dasaratha, and the gods
    agree. The gods then report to Brahma that Ravana, empowered by Brahma’s boon,
    oppresses gods, sages, humans, and the worlds, and cannot be killed by gods or
    several other classes of beings. Brahma notes that Ravana omitted humans from
    the boon, so he can be killed by a man. Vishnu appears, and the gods ask him to
    become Dasaratha’s son in four parts, assuming human nature, in order to destroy
    Ravana.
  language: Italian
  quote_policy: summarized
