candidate_motifs:
- id: motif:1
  label: Stolen beloved sought by heroic allies
  taxonomy_refs:
  - stolen_beloved
  basis: Sítá, Ráma’s beloved, is stolen by a giant/Rávaṇ, and Sugríva commands a
    Vānara host to search for her from coast to coast.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage summarizes the abduction and search rather than depicting
    the abduction directly.
- id: motif:2
  label: Self-sacrificial defense of the abducted queen
  taxonomy_refs:
  - sacrifice
  basis: Jatáyus fights Rávaṇ, delays him, and dies while trying to save Sítá; Angad
    praises him as blessed for giving his life.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage presents the death in retrospective speech.
- id: motif:3
  label: Covenant of mutual aid between hero and king
  taxonomy_refs:
  - covenant
  basis: Angad states that Ráma and Sugríva made a covenant for mutual aid, after
    which Sugríva became king and ordered the search for Sítá.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The terms of the covenant are only briefly summarized in this excerpt.
- id: motif:4
  label: Dark underground maze causing loss of allotted time
  taxonomy_refs:
  - labyrinth_initiation
  basis: The Vānaras enter a spacious underground cavern made by Maya, wander through
    its dark maze for a month, and thereby lose the time set for their mission.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage supports a labyrinthine cave pattern, but it does not explicitly
    frame the episode as initiation.
- id: motif:5
  label: Ascent toward the sun followed by burning and fall
  taxonomy_refs:
  - ascent
  basis: Sampáti and Jatáyus fly ambitiously toward the Day-God; Sampáti shields his
    brother, his feathers are burned away, and he falls on Vindhya’s hill.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is narrated as a remembered event rather than the present action
    of the scene.
- id: motif:6
  label: Feared divine punishment for failed duty
  taxonomy_refs:
  - divine_judgment
  basis: Angad says Yáma has come in wrath to take the Vānaras’ guilty lives because
    the king’s decree has been left undone.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is Angad’s fearful interpretation of the bird, not confirmed by the
    subsequent narration.
- id: motif:7
  label: Failed quest leading to voluntary fast unto death
  taxonomy_refs:
  - mystical_quest
  basis: After failing to find Sítá and losing their allotted time, the Vānaras see
    no hope of safety and resolve to fast and die.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage clearly gives a quest failure and death vow, but the broader
    taxonomy label is approximate.
