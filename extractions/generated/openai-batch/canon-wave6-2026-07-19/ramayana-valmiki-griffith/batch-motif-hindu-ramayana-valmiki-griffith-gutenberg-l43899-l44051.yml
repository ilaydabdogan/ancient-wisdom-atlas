canonical_text:
  quote: ''
  summary: Angad laments the Vānaras’ failed mission and recalls Jatáyus dying while
    trying to save Sítá from Rávaṇ. The vulture Sampáti hears of his brother Jatáyus,
    asks to be helped down from a peak because his wings were burned by the sun, and
    listens as Angad recounts Ráma’s exile, Sítá’s abduction, Ráma’s covenant with
    Sugríva, the search party’s delay in a magical underground cavern, and their resolve
    to fast to death. Sampáti then tells how he lost his wings while shielding his
    brother during a flight toward the Day-God, and Angad asks him to reveal Rávaṇ’s
    dwelling.
  language: English
  quote_policy: summarized
