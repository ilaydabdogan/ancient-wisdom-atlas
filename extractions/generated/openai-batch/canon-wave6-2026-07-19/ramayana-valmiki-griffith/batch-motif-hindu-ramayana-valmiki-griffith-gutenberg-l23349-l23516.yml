canonical_text:
  quote: ''
  summary: 'Ráma and Sítá spend time together in the forest: he adorns her with mineral
    dye and flowers, protects her from a monkey, and accompanies her to an Aśoka grove
    where they make flower ornaments. They return to their retreat, where Lakshmaṇ
    has prepared deer meat. Sítá serves food and is later troubled by a crow while
    guarding venison. Ráma launches a charmed arrow at the crow; the bird flees through
    the three worlds, returns as a suppliant, and gives up one eye so that the arrow
    will not be spent in vain while its life is spared.'
  language: English
  quote_policy: summarized
