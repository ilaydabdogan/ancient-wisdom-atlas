canonical_text:
  quote: ''
  summary: After the period of funeral impurity, the prince gives gifts for his father’s
    obsequies, mourns at the pyre, and is urged by elders to gather the remaining
    bones. Bharat and Śatrughna lament the dead king and Ráma’s exile. In the following
    scene Śatrughna blames Manthará and Kaikeyí for the calamity, seizes the adorned
    hump-backed maid, and the women flee toward Kauśalyá for protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After ten days the prince is said to be free from legal stain, and on the
    twelfth day he orders the remaining honour for the dead king to be celebrated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince gives gold, gems, food, white goats, cattle, slaves, cars, and
    dwellings to Bráhmans for his father’s obsequies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the thirteenth morning the grieving hero approaches the bottom of the pyre
    to clear the last remaining debt to his royal sire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince addresses his father, saying he has been left friendless while
    the one charged to protect him has been driven to the wood, and he asks why the
    queen is left uncomforted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He looks at the half-burnt bones and grey ashes on the pile, moans, and falls
    prostrate to the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Śatrughna thinks of the dead king, falls to the ground, and laments that a
    sea of woe has drowned them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In his lament, Śatrughna names Manthará as the source, Kaikeyí as a shark,
    and the king’s boons as waves that strengthen the calamity.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Śatrughna says Ráma is far away, his father is among the Blessed, and he cannot
    live deserted; he speaks of entering the fire and dwelling in the wood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The mournful train sees the brothers’ misery, and the brothers lie rolling
    in despair.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vaśishṭha raises Bharat and tells him that twelve days have passed since flames
    consumed his father’s body and that he must gather the remaining bones without
    delay.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Vaśishṭha also states that three constant pairs hem all mortal creatures and
    that none can shun them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sumantra raises Śatrughna and teaches him that all things exist and come to
    nothing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: After counsel, the royal pair rise, wipe their red and weeping eyes, and perform
    the rites that require their care.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Śatrughna tells Bharat that Ráma, true and pure in heart, has been banished
    by a woman’s art, and he asks why Lakshmaṇ did not prevent the wrong.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The hump-backed maid comes to the fronting door wearing glittering robes,
    sandal-oil, gems, ornaments, a broidered zone, and many chains.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: A sentinel seizes the maid and tells Śatrughna that she is the wicked pest
    through whom the king died and Ráma went to the wood.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Śatrughna calls the servants, says the maid slew his sire and brought misery
    on his brothers, and lays his hand on her while she cries out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The gathered women flee, fearing Śatrughna’s rage, and say they should go
    to Kauśalyá as their hope and defence.
  category: action
  evidence_refs:
  - ev:10
