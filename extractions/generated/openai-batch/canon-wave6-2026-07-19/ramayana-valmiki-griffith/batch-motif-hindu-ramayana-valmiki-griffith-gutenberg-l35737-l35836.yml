canonical_text:
  quote: ''
  summary: 'A dying royal vulture identifies the giant connected with Sítá’s abduction
    and then dies. Ráma laments the bird as a noble ally who fought to free Sítá,
    compares his honor to Daśaratha’s, and performs funeral rites with Lakshmaṇ: cremation,
    offerings, death texts, libations at the Godávarí, and bathing. The passage closes
    by saying the vulture soars to a blissful seat while the brothers resume their
    search for the captor.'
  language: English
  quote_policy: summarized
