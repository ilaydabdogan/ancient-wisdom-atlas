  quote: ''
  summary: Daśaratha denounces Kaikeyí for demanding Ráma’s banishment, laments that
    he cannot live without his son, and repeatedly begs her for mercy and for Ráma
    to rule. Kaikeyí remains unmoved, insists that the king honor his promised boons,
    cites exempla of truth-keeping and self-giving, and thrice repeats that Ráma must
    be sent to the forest or she will die before Daśaratha.
