canonical_text:
  quote: ''
  summary: 'Sumantra recounts a plan made by priest and ministers for King Lomapád:
    women in hermit dress are sent by decorated ships to lure the secluded ascetic
    Rishyaśring from his forest hermitage. The women perform music and games, question
    him, receive his hospitality, give him deceptive sweets and drink, embrace him,
    then leave him longing and distressed. His father Vibháṇdak returns and questions
    his altered behavior.'
  language: English
  quote_policy: summarized
