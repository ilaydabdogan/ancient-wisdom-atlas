canonical_text:
  quote: ''
  summary: Kauśalyá, weeping after Ráma has gone from sight, addresses the king. She
    grieves over Ráma, Sítá, and Lakshmaṇ in forest exile; fears that Bharat may not
    yield the kingdom after fourteen years; argues that Ráma would reject kingship
    already held by another through analogies to refused leavings and one-use sacrificial
    materials; reproaches the king for driving out a dutiful son; and says her supports
    as wife and mother are gone.
  language: English
  quote_policy: summarized
