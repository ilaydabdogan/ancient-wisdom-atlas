canonical_text:
  quote: ''
  summary: Rāma asks Viśvāmitra how to cross the Śona and later asks to hear the tale
    of the three-pathed Gangā. The group reaches the holy river Jahnavī/Gangā, performs
    bathing and offerings, and sits by rank around the sage. Viśvāmitra recounts that
    Himālaya and Menā are parents of Gangā and Umā; the gods obtain Gangā from Himālaya
    for the welfare of the three worlds, and Umā becomes Rudra’s bride after austerities.
    The passage ends with an editorial note about omitted cantos.
  language: English
  quote_policy: summarized
