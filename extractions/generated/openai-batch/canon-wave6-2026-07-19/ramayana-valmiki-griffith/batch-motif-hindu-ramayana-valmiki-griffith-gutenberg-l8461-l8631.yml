canonical_text:
  quote: ''
  summary: King Janak has an adorned heavenly bow brought before Viśvámitra, Ráma,
    Lakshmaṇ, and the court. Janak explains that no king or divine being has been
    able to lift, string, or draw it. At Viśvámitra’s prompt, Ráma lifts and strings
    the bow, breaking it with a thunderous sound that shakes the earth and fells the
    assembly. Janak declares that Ráma has fulfilled the heroic condition for marrying
    Sítá and sends envoys to Ayodhyá to invite Daśaratha, who rejoices and prepares
    to travel.
  language: English
  quote_policy: summarized
