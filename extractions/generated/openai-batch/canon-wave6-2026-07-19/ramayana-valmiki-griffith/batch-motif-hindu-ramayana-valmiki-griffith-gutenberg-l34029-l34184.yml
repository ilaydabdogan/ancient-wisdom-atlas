canonical_text:
  quote: ''
  summary: Sítá answers Rávaṇ with scorn, praises Ráma and Lakshmaṇ, predicts Rávaṇ’s
    destruction, and refuses dishonor. Rávaṇ threatens to have her killed and eaten
    if she refuses him after twelve months, orders Rákshas women to guard and subdue
    her, and has her taken to the Aśoka garden, where she grieves under guard. The
    next canto opens with Indra rejoicing and the Eternal Sire addressing him.
  language: English
  quote_policy: summarized
