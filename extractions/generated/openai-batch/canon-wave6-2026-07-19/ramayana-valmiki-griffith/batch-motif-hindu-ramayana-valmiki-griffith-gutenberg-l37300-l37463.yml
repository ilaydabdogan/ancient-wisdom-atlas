canonical_text:
  quote: ''
  summary: Lakshmaṇ counsels the grieving Ráma to master sorrow, begin the search,
    and recover Sítá from Rávaṇ. Ráma rises resolved, and the brothers continue toward
    Rishyamúka through a wooded landscape. Sugríva and the Vánars see the armed brothers,
    fear they may be Báli’s disguised spies, and flee to higher refuge. Hanumán then
    advises Sugríva to dismiss fear, noting that Báli has no power on Malaya hill,
    and urges prudent judgment.
  language: English
  quote_policy: summarized
