canonical_text:
  quote: ''
  summary: Ráma answers Bharat and the assembled people by teaching that mortals are
    subject to fate, time, death, aging, and separation. He says their father, the
    king, gained heaven through righteous rule, generosity, and rites. He urges Bharat
    to restrain grief, return to the city, obey their father’s decree, and leave Ráma
    to fulfill their father’s command in the forest.
