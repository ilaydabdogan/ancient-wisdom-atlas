  quote: Forth from his side young pinions grew,
  summary: A first-person speaker recalls being sustained by a sage’s words, watching
    from a mountain for a foretold time, and being kept alive for Ráma’s sake. Before
    the Vánars, his pinions are restored; he says his youth and strength return, urges
    them to continue and find the dame alive, then springs from a crag into the sky,
    giving the chieftains courage.
