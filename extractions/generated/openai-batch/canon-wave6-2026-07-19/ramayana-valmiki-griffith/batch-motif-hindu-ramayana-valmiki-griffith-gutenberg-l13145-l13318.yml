  quote: ''
  summary: Kauśalyá urges Ráma not to go into forest exile, claiming a mother's authority
    alongside a father's and threatening to renounce food if he leaves. Ráma replies
    that he must obey his father's command, cites earlier examples of severe filial
    obedience, counsels Lakshmaṇ to set aside wrath, asks for his mother's consent
    and blessing, promises to return after the appointed years, and embraces her reverently.
