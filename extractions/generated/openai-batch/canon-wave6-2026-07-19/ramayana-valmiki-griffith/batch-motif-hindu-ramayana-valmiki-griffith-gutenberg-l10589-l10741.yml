canonical_text:
  quote: 'I joy that Ráma gains the throne: Kauśalyá’s son is as mine own.'
  summary: Manthará warns Kaikeyí that Daśaratha will appoint Ráma heir and argues
    that this threatens Kaikeyí and Bharat. Kaikeyí first rejoices and rewards Manthará,
    then after further rebuke defends Ráma as virtuous and rightful while expecting
    Bharat to inherit or share power.
  language: English
