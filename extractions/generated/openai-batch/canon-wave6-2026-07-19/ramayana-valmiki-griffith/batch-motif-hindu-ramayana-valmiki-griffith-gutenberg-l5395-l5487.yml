canonical_text:
  quote: ''
  summary: A holy man narrates to Ráma a legend of King Sagar of Ayodhyá. Childless,
    Sagar goes with his queens Keśini and Sumati to Himálaya and performs long penance.
    The saint Bhrigu grants that one queen will bear one heir and the other sixty
    thousand sons. Keśini chooses the single heir and bears Asamanj; Sumati chooses
    the multitude and gives birth to a gourd that splits open to reveal sixty thousand
    infants, who are kept in jars of oil until they grow. Asamanj becomes a cruel
    heir and is banished by Sagar; Asamanj’s son Anśumán is praised. Sagar later prepares
    to perform a sacrificial horse rite.
  language: English
  quote_policy: summarized
