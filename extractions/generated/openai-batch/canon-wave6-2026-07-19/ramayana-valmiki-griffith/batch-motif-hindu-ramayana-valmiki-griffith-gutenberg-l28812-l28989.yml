canonical_text:
  quote: ''
  summary: Khara finds his sister Śúrpaṇakhá wounded and asks who mutilated her. She
    names Ráma and Lakshmaṇ, describes Sítá, and demands revenge and blood. Khara
    sends fourteen giants with Śúrpaṇakhá to kill the two men and the woman. The giants
    reach Ráma’s dwelling; Ráma tells Lakshmaṇ to guard Sítá, strings his bow, identifies
    himself, warns the giants to leave, and is threatened by them as agents of Khara.
  language: English
  quote_policy: summarized
