canonical_text:
  quote: ''
  summary: Ráma lifts and soothes the fainting Kauśalyá. Kauśalyá laments that Ráma's
    banishment leaves her vulnerable to rivals and Kaikeyí, and says her vows, fasts,
    and rites now seem fruitless. Lakshmaṇ then denounces the king's submission to
    Kaikeyí's will, asserts Ráma's faultlessness and royal right, urges him to secure
    the throne by force, and swears to go before him into forest or fire.
  language: English
  quote_policy: summarized
