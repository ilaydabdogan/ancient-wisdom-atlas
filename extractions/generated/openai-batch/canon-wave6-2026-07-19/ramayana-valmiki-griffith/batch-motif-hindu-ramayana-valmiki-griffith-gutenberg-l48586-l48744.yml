  quote: ''
  summary: Rávan surveys Lanká after Hanumán’s destructive incursion and asks his
    lords for counsel about Ráma’s approaching army. His counsellors dismiss the danger,
    praise Rávan’s former victories over gods, serpents, Yama, Varuṇ’s sons, Kuvera,
    and others, and propose that Indrajít or Rákshas champions should destroy the
    Vánars and secure the city.
  language: English
