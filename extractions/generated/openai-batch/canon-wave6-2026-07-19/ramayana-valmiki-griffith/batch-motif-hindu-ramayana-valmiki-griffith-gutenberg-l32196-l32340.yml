canonical_text:
  quote: ''
  summary: Ráma arms himself and pursues the wondrous deer, which is Márícha in disguise.
    The deer repeatedly appears and vanishes, drawing Ráma far from his dwelling.
    Ráma shoots it with a powerful arrow; Márícha resumes his giant form and, before
    dying, cries out in Ráma’s voice to Sítá and Lakshmaṇ so that Sítá will send her
    guard away and Rávaṇ may seize her. Ráma realizes the deception and fears for
    Sítá. Sítá hears the cry, urges Lakshmaṇ to go to Ráma, and bitterly accuses Lakshmaṇ
    when he hesitates.
  language: English
  quote_policy: summarized
