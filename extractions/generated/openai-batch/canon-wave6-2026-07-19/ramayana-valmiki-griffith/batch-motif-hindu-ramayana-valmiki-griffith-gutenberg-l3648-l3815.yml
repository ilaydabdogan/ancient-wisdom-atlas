canonical_text:
  quote: ''
  summary: A great sage is received by the king with formal honor. The king welcomes
    him with extravagant comparisons and grants his wish before hearing it. The sage
    explains that two shape-changing fiends repeatedly defile and interrupt his holy
    rite with flesh and blood, and because anger or curses are improper within the
    rite he asks the king to send his eldest son Ráma as champion. The sage promises
    protection, power, and fame for Ráma, says only Ráma can defeat the two fiends,
    and specifies that the sacrifice will last ten nights. The king is overcome and
    faints at the request.
  language: English
  quote_policy: summarized
