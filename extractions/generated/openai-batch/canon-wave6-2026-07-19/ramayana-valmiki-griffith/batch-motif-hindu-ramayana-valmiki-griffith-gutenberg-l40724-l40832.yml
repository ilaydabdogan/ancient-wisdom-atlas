canonical_text:
  quote: "“Let Báli on the bier be placed / And with all funeral service graced.”"
  summary: An ornate funeral litter is brought for Báli. Ráma orders that Báli be
    placed on the bier; Sugríva and Angad lay the body there and Sugríva commands
    royal obsequies. A procession with mourners and widowed women follows to a sandy
    island by a stream, where Tárá laments over Báli. Angad, aided by Sugríva, places
    the body on the pyre, lights the flame, circumambulates the dead, and the mourners
    offer water libations to the departed shade.
  language: English
  quote_policy: quoted
