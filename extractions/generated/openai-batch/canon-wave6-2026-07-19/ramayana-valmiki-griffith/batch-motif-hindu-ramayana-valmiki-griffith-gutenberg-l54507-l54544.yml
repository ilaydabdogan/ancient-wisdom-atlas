canonical_text:
  quote: ''
  summary: In a fierce battle, an unnamed giant warrior and his followers press the
    attack with chariot, maces, missiles, and arrows. Many Vánars are slain or wounded.
    Ráma tells his brother that the warrior’s power comes from Brahmá’s grace and
    that mortal strength cannot prevail against him. The sons of Raghu are bound and
    overpowered by arrows and spell, fall senseless, and the Rákshas returns to Lanká
    and Rávaṇ’s hall to report their defeat.
