canonical_text:
  quote: ''
  summary: After an unnamed speaker vanishes, Ráma reverently praises the Day-God
    and arms himself again. The giant chief Rávaṇ advances into battle; the Rákshas
    and Vánar hosts watch in fear. Rávaṇ’s darts fail against Ráma’s heavenly chariot,
    Ráma cuts down Rávaṇ’s banner with a blazing serpent-like arrow, Rávaṇ’s fiery
    arrows fail to move Ráma’s heavenly steeds, and a magical storm of trees, mountain
    peaks, and weapons misses Ráma but crushes many Vánars.
  language: English
  quote_policy: summarized
