canonical_text:
  quote: ''
  summary: Báli confronts Sugríva and the two exchange threats and fight fiercely.
    Sugríva is weakened despite striking Báli with an uprooted Sál tree. Ráma sees
    Sugríva failing and shoots an arrow that pierces Báli. The fallen Báli is described
    with radiant imagery; his divine golden chain preserves his life and beauty, and
    Ráma’s shaft is said to light the way to Brahmá’s worlds. Ráma and Lakshmaṇ approach
    as the wounded Báli prepares to speak.
