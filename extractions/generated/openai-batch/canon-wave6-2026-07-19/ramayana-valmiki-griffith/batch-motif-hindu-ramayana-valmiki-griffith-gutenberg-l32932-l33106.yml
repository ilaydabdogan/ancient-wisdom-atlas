canonical_text:
  quote: ''
  summary: Sítá warns Rávaṇ that wronging Ráma’s wife will bring ruin. Rávaṇ reveals
    his giant, many-armed, many-faced form after casting aside a saintly disguise,
    boasts of supernatural powers and shapeshifting, and urges Sítá to become his
    bride. He seizes her, places her in a gold magic car drawn by asses, and carries
    her through the sky while she cries out to Ráma and Lakshmaṇ. Sítá predicts Rávaṇ’s
    death by Ráma and appeals to the forest, the Godávarí, gods, birds, and deer to
    tell Ráma that she has been stolen.
  language: English
  quote_policy: summarized
