canonical_text:
  quote: ''
  summary: Kumbhakarṇa rebukes Rávaṇ for rashly taking Sítá but promises to fight
    Ráma. Mahápárśva urges Rávaṇ to compel Sítá and rely on Kumbhakarṇa and Indrajít.
    Rávaṇ explains that a curse from Brahmá, imposed after his assault on Punjikasthalá,
    prevents him from forcing Sítá. Vibhishaṇ repeatedly warns that Sítá endangers
    Rávaṇ and urges her restoration to Ráma before Ráma’s allies attack the city.
    Prahasta rejects the warning, and Indrajít is introduced as beginning a reply.
  language: English
  quote_policy: summarized
