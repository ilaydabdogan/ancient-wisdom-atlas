canonical_text:
  quote: ''
  summary: 'With Rávaṇ faint, bleeding, and raging apart, Agastya comes for Ráma’s
    sake and instructs him to hear an everlasting truth: Ráma should adore the rising
    Sun, the Lord of Light. The hymn describes the Sun as universal king, source and
    sire, identified with many gods and cosmic powers, maker of day, governor of seasons,
    clouds, rains, rivers, stars, planets, and constellations. Agastya says proper
    worship of the Lord of Light protects from ill, brings comfort, and will make
    Ráma victorious over his giant foe. A bracketed editorial note states that this
    canto is absent from the Bengal recension and may be an interpolation.'
  language: English
  quote_policy: summarized
