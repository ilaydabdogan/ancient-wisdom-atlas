canonical_text:
  quote: ''
  summary: Viśvámitra promises the transformed King Triśanku that he will arrange
    a rite enabling him to reach heaven bodily. After Vaśishṭha’s sons and Mahodaya
    refuse the invitation and disparage the rite, Viśvámitra curses them. He then
    has the rite performed, but the gods refuse the offering; in anger he commands
    Triśanku to ascend by the power of his austerities. Triśanku rises toward heaven,
    but Indra rejects him and orders him to fall earthward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Viśvámitra promises the transformed king relief and says he will transport
    him, in his present body, to the desired heavenly destination.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Viśvámitra orders preparation for the rite and sends pupils to summon Vaśishṭha’s
    sons and other holy men, instructing the pupils to report all replies accurately.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pupils report that the holy men generally obeyed, Mahodaya alone refused,
    and Vaśishṭha’s hundred sons rejected the rite while criticizing the outcast king
    and Viśvámitra’s role.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: On hearing the rejection, Viśvámitra becomes angry and curses the objectors
    with destruction, descent to Yama’s kingdom, repeated low births, and disgraceful
    forms of life; he also curses Mahodaya to become a fowler.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Viśvámitra presents Triśanku to the gathered saints as a virtuous king seeking
    refuge and asks them to join the rite so that he may rise bodily to the skies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gathered holy men agree to perform the rite because they fear Viśvámitra’s
    anger and possible curse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sacrificial rite is performed with requisites, priestly order, hymns,
    and a solemn offering calling the gods, but the Immortals refuse to respond.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Viśvámitra, enraged by the gods’ refusal, raises the sacred ladle and commands
    Triśanku to ascend to heaven through the power won by his austerities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Triśanku rises while standing and mounts swiftly toward the skies before the
    watching hermits.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Indra sees Triśanku entering the blissful regions and tells him that no home
    is prepared for him there, ordering him to fall headlong back toward earth.
  category: speech
  evidence_refs:
  - ev:10
