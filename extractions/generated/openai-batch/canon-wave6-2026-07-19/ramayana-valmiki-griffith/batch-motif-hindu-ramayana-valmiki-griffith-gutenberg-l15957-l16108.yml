canonical_text:
  quote: Forth for his dreary banishment
  summary: Sítá, Ráma, and Lakshmaṇ board Sumantra’s gold-adorned chariot with clothing,
    ornaments, weapons, and forest gear. As Ráma departs for banishment, Ayodhyá is
    filled with lament; citizens follow the car, plead with Sumantra to slow, and
    praise Sítá and Lakshmaṇ for accompanying Ráma. Daśaratha and Ráma’s mother try
    to see him again; Ráma, constrained by duty and unable to bear their grief, orders
    the chariot onward despite calls to stop. The king collapses, and the people,
    king, and queen continue watching as the horses carry Ráma away.
  language: English
  quote_policy: quoted
