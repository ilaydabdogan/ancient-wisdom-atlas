canonical_text:
  quote: ''
  summary: Daśaratha tells the assembled people and nobles that old age has weakened
    him and asks approval to install his eldest son Rāma as heir and co-ruler. The
    assembly rejoices, unanimously requests Rāma’s anointing, and praises his truthfulness,
    justice, self-control, religious learning, martial success, and care for the people.
    Daśaratha accepts their request and orders Vaśishṭha and Vāmadeva to prepare the
    rites in the auspicious month of Chaitra.
  language: English
  quote_policy: summarized
