canonical_text:
  quote: ''
  summary: Anasúyá praises Sítá’s tale, describes the evening hermitage, asks Sítá
    to wear heavenly raiment, and sends her to Ráma. Sítá returns adorned with divine
    robes, garland, and ornaments given by Anasúyá, pleasing Ráma and Lakshmaṇ. After
    a night in the hermitage, the princes depart at dawn. The hermits warn them of
    flesh-eating, form-changing monsters and savage beasts in the distant forest,
    ask Ráma to chase or destroy them, and direct him along the forest path. Blessed
    by the saints, Ráma enters the mighty wood with Sítá and Lakshmaṇ.
  language: English
  quote_policy: summarized
