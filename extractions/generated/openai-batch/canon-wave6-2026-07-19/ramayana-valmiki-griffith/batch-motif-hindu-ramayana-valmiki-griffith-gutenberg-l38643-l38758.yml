canonical_text:
  quote: ''
  summary: A raging demon seeks a worthy opponent. Himálaya directs him to the Vánar
    king Báli at Kishkindhá. The demon arrives in bull-like form, bellows at the city
    gate, and challenges Báli. Báli confronts him, lays aside a golden chain given
    by his divine sire, fights the monster, kills him, and hurls the corpse away.
    Blood from the corpse falls near Saint Matanga’s hermitage, and Matanga becomes
    angry at the defilement of his grove.
  language: English
  quote_policy: summarized
