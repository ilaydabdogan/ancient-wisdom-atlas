canonical_text:
  quote: ''
  summary: After Kumbhakarṇa's death, heavenly beings rejoice and messengers report
    to Rávaṇ that his brother was slain by Ráma and lies blocking Lanká's gate. Rávaṇ
    faints, laments his brother, longs for revenge, and acknowledges that he rejected
    Vibhishaṇ's counsel. Triśirás exhorts him to stop grieving and either fight or
    let him fight. Rávaṇ's courage returns, and his sons and warriors go to battle.
    Narántak charges through the Vánar host on horseback, killing many, until Sugríva
    sends Angad against him. Angad, armed only with nails and teeth, withstands Narántak's
    dart, kills his horse, recovers from a blow, and crushes Narántak to death.
  language: English
  quote_policy: summarized
