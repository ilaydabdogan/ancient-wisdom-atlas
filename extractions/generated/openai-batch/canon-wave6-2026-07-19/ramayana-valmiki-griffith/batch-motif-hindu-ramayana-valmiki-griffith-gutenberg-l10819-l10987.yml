canonical_text:
  quote: ''
  summary: Kaikeyí asks how Bharat may gain the throne and Ráma be sent to the woods.
    Manthará recounts how Kaikeyí once saved Daśaratha in battle and received two
    deferred boons, then instructs her to use staged grief and binding oaths to demand
    Bharat's consecration and Ráma's long exile. Kaikeyí accepts the counsel, praises
    Manthará's wiles, promises rewards, and is urged to act at once.
  language: English
  quote_policy: summarized
