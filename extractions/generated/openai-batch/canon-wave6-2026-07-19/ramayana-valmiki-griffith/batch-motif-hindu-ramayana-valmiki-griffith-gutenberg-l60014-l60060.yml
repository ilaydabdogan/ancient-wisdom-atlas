canonical_text:
  quote: ''
  summary: 'A scholarly note discusses the Rákshases as represented in the Rámáyan:
    a hostile race named with a term of hatred, mythically transformed into monstrous
    giants and shapeshifters, described with physical traits and ornaments, and opposed
    to Aryan rites. It frames Ráma’s war as the epic’s subject, mentions an earlier
    Pauranic story of Kárttavírya capturing Rávaṇ, and quotes Weber’s allegorical
    interpretation of Sítá, Ráma, agriculture, and the Rákshases.'
  language: English
  quote_policy: summarized
