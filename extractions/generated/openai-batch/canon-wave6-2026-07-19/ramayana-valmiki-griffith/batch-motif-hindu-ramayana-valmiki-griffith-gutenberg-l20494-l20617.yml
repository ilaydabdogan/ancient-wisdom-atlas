canonical_text:
  quote: ''
  summary: Bharata mourns his father, questions Kaikeyi about Dasaratha's death and
    Rama's absence, learns that Rama, Sita, and Lakshman have gone to the Dandak wilderness
    in exile, and hears Kaikeyi explain that she secured Rama's banishment and Bharata's
    succession. Kaikeyi urges Bharata to perform the king's funeral rites and accept
    the throne.
  language: English
  quote_policy: summarized
