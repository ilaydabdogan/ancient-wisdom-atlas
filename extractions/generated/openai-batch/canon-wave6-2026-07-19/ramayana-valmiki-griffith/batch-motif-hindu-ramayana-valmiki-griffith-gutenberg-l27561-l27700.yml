canonical_text:
  quote: ''
  summary: Sutíkshṇa directs Ráma, Sítá, and Lakshmaṇ southward toward the hermitages
    of Agastya’s brother and Agastya. Ráma follows the marked forest path and recognizes
    signs of a sacred hermitage. He recounts how Agastya once destroyed the demon
    brothers Vátápi and Ilval, who used disguise, ritual invitation, and a ram-form
    deception to kill Bráhmans.
  language: English
  quote_policy: summarized
