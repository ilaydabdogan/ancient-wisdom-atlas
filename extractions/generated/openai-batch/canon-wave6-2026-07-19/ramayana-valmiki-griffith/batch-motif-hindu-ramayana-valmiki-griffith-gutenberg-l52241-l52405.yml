canonical_text:
  quote: "“Thy husband lives, and all is well.”"
  summary: Sítá laments that omens and prophecies of her happy queenly destiny appear
    false because she believes Ráma and Lakshmaṇ have been slain. Trijaṭá consoles
    her, arguing from the Vánars’ steady hope and the heroes’ remaining beauty that
    the brothers still live. Sítá is returned to the garden in Lanká. Ráma then wakes
    from a trance, sees Lakshmaṇ senseless and bloodied, laments him as dead, declares
    life and Sítá’s rescue worthless without him, vows to follow him in death, and
    dismisses Sugríva and the Vánars.
  language: English
  quote_policy: quoted
