canonical_text:
  quote: O see me in the giant’s hold.
  summary: Lakshman and Rama are seized by the long-armed giant Kabandha in a dark
    forest. Kabandha threatens to eat them, but Lakshman urges Rama to cut off the
    monster’s arms. The brothers sever Kabandha’s arms with swords. Kabandha then
    asks their names and, after learning Rama’s identity and quest for his stolen
    wife, begins explaining that his monstrous form resulted from a curse.
  language: English
  quote_policy: quoted
