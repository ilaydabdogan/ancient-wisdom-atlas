canonical_text:
  quote: ''
  summary: During the first night of the forest journey, Ráma speaks with Lakshmaṇ
    about the grief of Ayodhyá, his parents, Bharat's likely care for them, and Lakshmaṇ's
    loyalty. He resolves to take only water. Sumantra tends the horses, evening rites
    are performed, and Ráma sleeps beside Sítá on a leafy bed while Lakshmaṇ and Sumantra
    keep watch. At dawn, Ráma sees the citizens sleeping under trees after following
    him out of devotion. To spare them further hardship, he leaves while they sleep,
    crosses the Tamasá, and orders Sumantra to disguise the chariot route before driving
    on toward the hermit-haunted forest.
  language: English
  quote_policy: summarized
