canonical_text:
  quote: ''
  summary: Ráma's wife, called the lady and the Videhan, answers him with distress
    and pleads to accompany him into the forest exile. She says love makes the forest's
    dangers bearable, cites commands, omens, Brahmans' forecasts, and an ancient scriptural
    teaching on marriage, and declares that separation from him would be unbearable.
    She threatens death by fire, water, or poison if he refuses. The narrator states
    that she cannot persuade Ráma and weeps after his answer.
  language: English
  quote_policy: summarized
