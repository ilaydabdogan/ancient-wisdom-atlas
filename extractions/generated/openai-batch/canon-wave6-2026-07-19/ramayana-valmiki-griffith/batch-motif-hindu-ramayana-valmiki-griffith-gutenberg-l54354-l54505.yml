canonical_text:
  quote: ''
  summary: Lakshman answers a giant foe’s taunts, receives advice from the Wind-God
    to use a Brahma-named weapon, and kills the giant later identified as Atikaya.
    Rāvaṇ laments fallen Rākshas champions, orders city defenses and special guard
    over the lady in the Aśoka garden, and withdraws in grief. Indrajit consoles his
    father, promises to slay the sons of Raghu, then performs a fire rite with offerings
    and receives auspicious signs and consecrated weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sumitrá’s son, identified in the passage as Lakshman, springs forward, strains
    his bow, and the clang makes giants tremble.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The giant foe taunts Sumitrá’s son as youthful and untrained, tells him to
    flee, and warns him against waking death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lakshman replies that valor is shown by deeds rather than words and challenges
    the giant to fight.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The giant shoots at Lakshman’s breast, and Lakshman cuts the arrow with a
    crescent-headed shaft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lakshman’s shower of shafts strikes the foe but does not harm the giant’s
    iron coat or impenetrable mail.
  category: attribute
  evidence_refs:
  - ev:5
