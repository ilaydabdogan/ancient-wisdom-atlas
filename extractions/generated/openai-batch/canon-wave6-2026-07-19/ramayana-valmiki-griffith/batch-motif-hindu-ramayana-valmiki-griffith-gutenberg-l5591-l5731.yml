canonical_text:
  quote: "“Then by his might that proud array / All scorcht to heaps of ashes lay.”"
  summary: The Gods are reassured that Vásudeva, in Kapil’s form, guards Earth and
    will destroy Sagar’s sons. Sagar’s sons dig through the earth seeking the stolen
    sacrificial horse, encounter and honor world-bearing elephants, then find Kapil
    with the horse and rush at him. Kapil scorches them to ashes. Sagar later sends
    Anśumán underground to continue the search; Anśumán honors a warder elephant and
    is told he will return with the rescued steed.
  language: English
  quote_policy: quoted
