candidate_motifs:
- id: motif:1
  label: Fatal exception in protective boon
  taxonomy_refs: []
  basis: Rávaṇ’s divine protection covers gods, demons, and serpents but leaves him
    vulnerable to man; he identifies Ráma as the foretold human threat.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames this through Rávaṇ’s own recollection and recognition
    rather than a narrated granting scene.
- id: motif:2
  label: Foretold retribution through accumulated prophecies
  taxonomy_refs:
  - divine_judgment
  basis: Rávaṇ lists Brahmá’s words and several earlier pronouncements or offenses
    that converge on his approaching fate.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The divine-judgment taxonomy is supported by the presence of Brahmá and
    fate language, but some named figures are only briefly mentioned.
- id: motif:3
  label: War for a stolen queen
  taxonomy_refs:
  - stolen_beloved
  basis: Yúpáksha says Ráma vows to slay the foe who stole his queen and leads a Vánar
    host against Lanká.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage states the cause of the assault but does not narrate the abduction
    itself.
- id: motif:4
  label: Rousing the cursed sleeping giant champion
  taxonomy_refs: []
  basis: Kumbhakarṇa has slept for months by Brahmá’s curse and must be violently
    awakened to defend Lanká.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: No available taxonomy reference exactly matches the sleeping giant awakening
    pattern.
- id: motif:5
  label: Giant warrior’s blood-feast vow
  taxonomy_refs: []
  basis: After consuming flesh and blood, Kumbhakarṇa promises that giants will eat
    slain Vánars and that he will drink the princes’ blood.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: This is a localized battle threat within the passage rather than a fully
    developed independent motif.
