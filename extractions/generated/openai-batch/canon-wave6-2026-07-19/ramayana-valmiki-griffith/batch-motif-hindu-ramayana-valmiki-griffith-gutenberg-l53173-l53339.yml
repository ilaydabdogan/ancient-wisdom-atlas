canonical_text:
  quote: "“Against their power thy life is charmed, / But against man is still unarmed.”"
  summary: Rávaṇ, shaken by Ráma’s attack, recalls prophecies and a boon that leaves
    him vulnerable to a human enemy. He orders Lanká defended and commands that Kumbhakarṇa,
    who has slept for months under Brahmá’s curse, be awakened. Giant attendants assault
    the sleeper with noise, blows, animals, and water until he wakes, feasts on flesh
    and blood, hears from Yúpáksha that Ráma and the Vánars threaten Lanká because
    Rávaṇ stole Ráma’s queen, and vows violent retaliation.
  language: English
  quote_policy: quoted
