canonical_text:
  quote: ''
  summary: An unnamed Brāhman hermit, son of Jamadagni, confronts Rāma after hearing
    of Rāma’s breaking of a bow. He brings another divine bow, associated with Viṣṇu
    and inherited through his father, and challenges Rāma to draw it and then fight
    him. King Daśaratha pleads fearfully for safety, recalling the challenger’s ascetic
    vows and renunciation. The challenger recounts the history of two celestial bows,
    a contest between Śiva and Viṣṇu, the transmission of the bows through sages,
    the killing of Jamadagni by Arjun, his own vengeance against warriors, his conquest
    and ritual gift of the earth to Kaśyap, and his retreat to Mahendra. He renews
    the challenge to Rāma to take the bow and set a town-destroying arrow on it.
  language: English
  quote_policy: summarized
