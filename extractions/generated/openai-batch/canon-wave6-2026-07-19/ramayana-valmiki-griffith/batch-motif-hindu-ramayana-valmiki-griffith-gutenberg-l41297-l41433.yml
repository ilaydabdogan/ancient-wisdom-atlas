  summary: A counsellor urges Sugríva to repay Ráma’s aid by renewing the search for
    Sítá. Sugríva orders Níla to summon Vánar hosts and threatens punishment for delay.
    Ráma, grieving on a moonlit autumn mountain, laments Sítá’s absence amid birds,
    trees, water, and hills. Lakshmaṇ returns to the cavern, finds Ráma overwhelmed
    with sorrow, and speaks to him.
