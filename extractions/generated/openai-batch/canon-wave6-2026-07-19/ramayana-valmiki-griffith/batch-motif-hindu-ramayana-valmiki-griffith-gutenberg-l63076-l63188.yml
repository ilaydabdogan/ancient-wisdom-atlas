canonical_text:
  quote: ''
  summary: 'A set of editorial footnotes explains allegorical, ritual, social, ethnic,
    and comparative details: Indra and Ahalyá are interpreted as sun and night; repeated
    epic lines are compared with Homeric repetition; minute divine beings are said
    to arise from Brahmá’s hair; ritual duties and sacrificial materials are described;
    foreign and outcaste groups are identified; a miraculous cow creates armies; Śiva
    and Nandi are glossed; and a conflict between royal/military and Bráhmanical/priestly
    authority is summarized.'
  language: English
  quote_policy: summarized
