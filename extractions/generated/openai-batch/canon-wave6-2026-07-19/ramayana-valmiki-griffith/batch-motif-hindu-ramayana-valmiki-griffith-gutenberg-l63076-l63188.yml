comparison_claims:
- id: claim:1
  claim: The passage records an allegorical reading in which the Indra-Ahalyá episode
    functions as a sun-and-night explanation rather than a literal divine adultery
    story.
  claim_level: archetypal_reading
  target: solar allegory of dawn overcoming night
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The claim reports Kumárila’s interpretation as quoted in the footnote;
    it does not establish that this is the only or original meaning of the episode.
- id: claim:2
  claim: Schlegel compares the repetition of sixteen lines in the poem to a Homeric
    custom of repeating several lines.
  claim_level: same_function
  target: Homeric multi-line formulaic repetition
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: medium
  limitations: The same note says this practice is strange to this poet and is the
    only instance Schlegel remembers, limiting the comparison.
- id: claim:3
  claim: The tiny divine personages from Brahmá’s hair are tentatively connected by
    the note to a pattern of small infantry warred on by cranes.
  claim_level: same_motif
  target: small warriors or infantry attacked by cranes
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The footnote says 'probably' and gives only a brief comparison without
    developing the tradition.
- id: claim:4
  claim: Schlegel compares the struggle between regal or military order and Bráhmanical
    or priestly authority with medieval European conflicts in which priesthood could
    gain victory without warlike weapons.
  claim_level: same_function
  target: medieval European priesthood versus secular or military authority
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial analogy, not evidence of historical contact or
    common inheritance.
