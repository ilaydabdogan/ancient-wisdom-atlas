canonical_text:
  quote: ''
  summary: Indrajit rejects Vibhishan's counsel and boasts of defeating celestial
    beings. Vibhishan rebukes him and urges Ravana to restore Sita to Rama. Ravana
    angrily denounces Vibhishan as a false friend. Vibhishan answers that true counsel
    is rare, warns Ravana of Rama's arrows, and leaves with four companions for the
    sons of Raghu. Sugriva and the Vanar leaders see the armed Rakshasas in the air
    and prepare to attack if ordered.
  language: English
  quote_policy: summarized
