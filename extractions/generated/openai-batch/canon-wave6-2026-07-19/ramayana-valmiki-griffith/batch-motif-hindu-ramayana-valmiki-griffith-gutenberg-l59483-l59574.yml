canonical_text:
  quote: ''
  summary: 'The passage is an additional-notes section collecting scholarly remarks
    and omitted translated verses: it compares the Râmâyaṇam''s epic monkeys with
    Vedic descriptions of the Marutas; recounts Hanumant''s binding, tail-burning,
    and burning of the monsters'' city; notes a Jaitwa descent tradition from Hanuman;
    lists omitted peoples and regions from ślokas; and discusses the Northern Kurus/Uttara
    Kurus as a remote region associated with primitive customs and golden-age blessedness.'
  language: English
  quote_policy: summarized
