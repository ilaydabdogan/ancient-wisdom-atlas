  text: The epic monkeys of the Râmâyaṇam are described as swift as wind, able to
    change shape, cloud- and thunder-like in sound, battling, hurling mountain-peaks,
    uprooting trees, stirring waters, crushing the earth, and making clouds fall.
  category: attribute
