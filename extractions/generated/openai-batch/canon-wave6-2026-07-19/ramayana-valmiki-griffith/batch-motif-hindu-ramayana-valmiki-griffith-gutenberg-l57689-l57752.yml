candidate_motifs:
- id: motif:1
  label: Self-immolation followed by rebirth for an enemy’s destruction
  taxonomy_refs:
  - death_rebirth
  - sacred_birth
  basis: Vedavatī enters blazing fire after declaring she will be born again, not
    from a womb, for Rāvaṇa’s destruction; the passage identifies that rebirth as
    Sītā.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage frames this as a summarized episode and commentary; it should
    be checked against the underlying Sanskrit section.
- id: motif:2
  label: Ascetic bride vowed to a deity
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: Vedavatī says she has wed Nārāyaṇa in her heart and practices austerity to
    obtain him as husband.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The marriage is described as an inner vow rather than a performed public
    rite in this passage.
- id: motif:3
  label: Insulted ascetic woman as cause of tyrant’s fall
  taxonomy_refs:
  - divine_judgment
  basis: Rāvaṇa insults Vedavatī by touching her hair; she declares future birth for
    his destruction, and commentary calls Sītā the principal cause of Rāvaṇa’s death.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage avoids saying Vedavatī directly curses Rāvaṇa; it explicitly
    says she does not launch a curse because that would lose the merit of her austerity.
- id: motif:4
  label: Divine consort recurring across incarnations
  taxonomy_refs:
  - divine_beloved
  - sacred_marriage
  basis: The passage identifies Sītā with Lakshmī and cites the pattern that in Rāma’s
    life she became Sītā and in Krishṇa’s birth she became Rukminī.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: This motif is based on commentary and cited authority within the passage,
    not on a narrated scene in the immediate excerpt.
- id: motif:5
  label: Gods assume animal forms to escape danger
  taxonomy_refs:
  - shapeshifter
  basis: When Rāvaṇa interrupts Marutta’s sacrifice, the assembled gods assume different
    animal shapes in terror.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The transformation is summarized briefly; the passage does not describe
    the mechanics of shape-changing.
- id: motif:6
  label: Etiological boons explaining animal traits and ritual role
  taxonomy_refs: []
  basis: The gods grant boons to their chosen animal forms, explaining the peacock’s
    tail, the swan’s whiteness, the lizard’s golden colour, and the crow’s relation
    to death and funeral oblations.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: No external parallels are cited; this is identified only as a candidate
    pattern within the passage.
- id: motif:7
  label: Violent interruption of a royal sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Rāvaṇa is described as violently interrupting a sacrifice performed by king
    Marutta.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage gives only a summary of the ritual interruption.
comparison_claims:
- id: claim:1
  claim: The passage explicitly connects Vedavatī’s fire-entry episode with Sītā’s
    later role in Rāvaṇa’s destruction, treating them as the same being across ages.
  claim_level: same_motif
  target: Vedavatī episode and Sītā’s role in Rāvaṇa’s death within the Rāma narrative
  evidence_refs:
  - ev:9
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage identification, not evidence of external historical
    comparison.
- id: claim:2
  claim: The passage supports a same-function comparison among Sītā, Lakshmī, and
    Rukminī as forms of the divine consort associated with Vishṇu’s manifestations
