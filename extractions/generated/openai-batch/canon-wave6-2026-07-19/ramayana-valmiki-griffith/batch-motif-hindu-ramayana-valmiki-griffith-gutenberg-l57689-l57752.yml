canonical_text:
  quote: ''
  summary: 'The passage summarizes several Rāvaṇa episodes: Kuvera yields Laṅkā and
    later loses a magic self-moving chariot; Rāvaṇa marries Mandodarī and fathers
    Meghanāda/Indrajit; Rāvaṇa encounters the ascetic Vedavatī in the Himalayan forest,
    insults her, and she enters fire while declaring a future non-womb birth for his
    destruction; the passage identifies her later birth as Sītā and links Sītā with
    Lakṣmī and Rukmiṇī; finally, Rāvaṇa interrupts Marutta’s sacrifice, causing gods
    to assume animal forms and grant etiological boons to those animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Sarasvatī leaves him and he recovers consciousness, Kuvera perceives
    he has been deluded and, on his father’s advice, gives Laṅkā to Rāvaṇa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rāvaṇa marries Mandodarī, daughter of the Asura Maya, and she bears Meghanāda,
    later called Indrajit after victory over the sovereign of the skies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage refers to Rāvaṇa’s conquest of Kuvera and acquisition of a magic
    self-moving chariot.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rāvaṇa, traveling through the world, comes to a forest on the Himālaya and
    sees a brilliantly beautiful damsel in ascetic garb.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rāvaṇa becomes enamoured of the ascetic damsel and asks who she is and why
    she practices austerity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The damsel identifies herself as Vedavatī, the vocal daughter of Kuśadhwaja,
    son of Vṛihaspati, sprung from him during constant study of the Veda.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vedavatī says her father intended her for Vishṇu/Nārāyaṇa and that she has
    wed him in her heart, practicing austerity to obtain him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rāvaṇa urges Vedavatī to become his bride and boasts that he is superior to
    Vishṇu; she replies that no one but he would contemn that deity.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rāvaṇa touches the hair of Vedavatī’s head with the tip of his finger; she
    becomes incensed and cuts off her hair.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Vedavatī says she cannot continue living after the insult and will enter fire
    before Rāvaṇa’s eyes.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Vedavatī declares that she will be born again for Rāvaṇa’s destruction and
    prays to be born as the virtuous daughter, not produced from the womb, of a righteous
    man.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Vedavatī enters the blazing fire, and a shower of celestial flowers falls
    from the sky.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage identifies Vedavatī in the Krita age as Sītā in the Treta age,
    daughter of the Janakas and bride of Rāma.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage says the mountain-like enemy, already virtually destroyed by Vedavatī’s
    wrath, is now slain through her recourse to Rāma’s superhuman energy.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: A commentator states that Sītā was the principal cause of Rāvaṇa’s death,
    while the act of destroying him is ascribed to Rāma.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: The same commentary says Sītā was Lakshmī, and cites a statement that in the
    god’s life as Rāma she became Sītā and in his birth as Krishṇa she became Rukminī.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:17
  text: Rāvaṇa violently interrupts a sacrifice performed by king Marutta.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: 'The assembled gods, in terror, assume animal shapes: Indra becomes a peacock,
    Yāma a crow, Kuvera a lizard, and Varuṇa a swan.'
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: 'Each deity bestows a boon on the animal form chosen: the peacock’s tail recalls
    Indra’s thousand eyes, the swan becomes white like ocean foam, the lizard gains
