canonical_text:
  quote: ''
  summary: Ráma hears Hanumán’s report and praises his crossing of the sea and discovery
    of Sítá, but grieves over how the army can cross to Lanká. Sugríva encourages
    him to plan a bridge across the sea and trust the Vánar forces. Ráma asks Hanumán
    to describe Lanká’s fortifications, and Hanumán recounts its gates, ramparts,
    moats, garrisons, weapons, and his own destruction of parts of the city, then
    urges the army to advance.
  language: English
  quote_policy: summarized
