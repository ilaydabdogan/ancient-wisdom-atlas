canonical_text:
  quote: ''
  summary: A wounded female speaker describes Ráma’s appearance, weapons, and victory
    over the giants Khara, Dúshaṇ, and their host. She describes Lakshmaṇ as Ráma’s
    devoted brother and Sítá as Ráma’s beautiful beloved spouse. She urges her brother,
    addressed as a giant king, to desire and seize Sítá and avenge the slain giants.
  language: English
