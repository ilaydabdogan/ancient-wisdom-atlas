canonical_text:
  quote: ''
  summary: Brahma sends Indra, accompanied by Sleep, to sustain Sita in sea-girt Lanka
    with heavenly food. Sita verifies Indra’s divine signs, accepts the food, thinks
    of Rama and Lakshman, and is relieved of hunger, thirst, and weariness. The passage
    then shifts to Rama returning after striking Maricha in the form of a deer; he
    hears ominous animal cries, recalls the deceptive cry that drew Lakshman away,
    meets Lakshman, and begins to reproach him for leaving Sita.
  language: English
  quote_policy: summarized
