canonical_text:
  quote: ''
  summary: 'The passage completes a sequence of royal sacrificial rites and priestly
    rewards, records Daśaratha’s request for sons and Rishyaśring’s promise of four
    royal sons, then shows the gods gathering at a further rite. The gods complain
    to Brahmā that Rāvaṇ, protected by a boon, oppresses gods, saints, and cosmic
    powers. Brahmā identifies a loophole: Rāvaṇ can be slain only by a human. Vishṇu
    then arrives at the divine council and is asked to help the suffering worlds.'
  language: English
  quote_policy: summarized
