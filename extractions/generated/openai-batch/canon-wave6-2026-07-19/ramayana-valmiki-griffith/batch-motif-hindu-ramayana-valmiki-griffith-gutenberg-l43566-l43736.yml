canonical_text:
  quote: ''
  summary: Hanumán recounts how Ráma’s wife was stolen by Rávaṇ and how Sugríva sent
    the Vānars to search for her. Exhausted in the southern region, the Vānars entered
    a dark cave, were fed by an ascetic lady, and begged for release after their appointed
    time had expired. The ascetic uses her holy power to lead them out after they
    close their eyes, and they emerge near Vindhya and the sea. Seeing that the search
    has failed, Angad proposes death by fasting at the ocean’s edge; the Vānars agree
    in fear of Sugríva, while Tárā suggests taking refuge in the magical cave.
  language: English
  quote_policy: summarized
