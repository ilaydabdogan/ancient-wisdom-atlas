canonical_text:
  quote: ''
  summary: Ráma, Sítá, and Lakshmaṇ enter the Daṇḍak forest and are received at a
    sanctified hermitage. The hermits honor Ráma, offer hospitality, and ask him as
    king and protector to guard them. After departing in the morning, the three travel
    deeper into the forest and encounter the giant Virádha, who seizes Sítá and threatens
    the men.
  language: English
  quote_policy: summarized
