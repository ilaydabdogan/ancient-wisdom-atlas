  evidence_refs:
  - ev:1
- id: obs:2
  text: Hanumán describes Ráma as Daśaratha’s son of the Ikshváku race, obedient to
    his father’s will, dwelling in the forest, and seeking aid after Rávaṇ stole his
    wife.
  category: speech
  evidence_refs:
  - ev:1
