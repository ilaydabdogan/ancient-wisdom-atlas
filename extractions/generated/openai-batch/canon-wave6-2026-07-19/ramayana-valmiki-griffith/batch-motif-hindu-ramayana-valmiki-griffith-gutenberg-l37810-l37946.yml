canonical_text:
  quote: ''
  summary: Hanumán presents Ráma and Lakshmaṇ to Sugríva, explaining Ráma’s lineage,
    exile, and the theft of his wife by Rávaṇ. Sugríva and Ráma pledge friendship
    by handclasp and by a worshipped fire, then Sugríva asks help against his brother
    Báli, who has wronged him and taken his wife. Ráma promises to slay Báli. The
    passage ends with left-eye throbbing omens for Sítá, Báli, and the demons.
  language: English
  quote_policy: summarized
