canonical_text:
  quote: ''
  summary: Hanuman travels as Rama's messenger to find captive Sita. A terrifying
    sea-rising figure with a Brahma-given boon requires him to enter her mouth; he
    fulfills the condition by changing size, then receives her blessing. He later
    defeats Sinhika, a shadow-seizing demon, by entering her mouth and tearing her
    from within, before reaching Lamba's peak and seeing Lanka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A godlike dame emerges from the middle of the sea in a terrifying form and
    tells the Vānar that he is to be her food by heaven's decree and by a boon from
    Brahma.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hanuman says that Ravana stole Sita from Rama and that he is going as Rama's
    willing messenger to see captive Sita.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sea-rising figure refuses to let Hanuman go unless he enters her mouth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hanuman enlarges his body, the figure widens her jaws, and Hanuman then shrinks
    smaller than a thumb and leaps through her mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Hanuman has passed through her mouth, the figure returns to her former
    shape and blesses his mission to bring the rescued lady to her lord.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hosts of spirits praise Hanuman as he passes through the fields of ether and
