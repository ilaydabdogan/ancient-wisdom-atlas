canonical_text:
  quote: ''
  summary: Bharat meets Guha, asks the way to Bharadvāja’s retreat, and answers Guha’s
    fear that his large host may threaten Ráma. Bharat states that he seeks to bring
    Ráma back from the forest, and Guha praises him for renouncing the kingdom. At
    night Bharat grieves. Guha then recounts Lakshmaṇ’s earlier vigil beside the sleeping
    Ráma and Sítá, Lakshmaṇ’s refusal to sleep, his lament for Daśaratha and the queens,
    and the morning crossing after which the exiles proceed in ascetic dress with
    bows.
  language: English
  quote_policy: summarized
