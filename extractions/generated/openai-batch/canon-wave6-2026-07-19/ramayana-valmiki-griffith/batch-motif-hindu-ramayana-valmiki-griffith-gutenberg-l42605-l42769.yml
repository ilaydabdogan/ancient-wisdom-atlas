canonical_text:
  quote: "“No farther eastward can ye stray. / Beyond no sun, no moon gives light”"
  summary: Sugríva commands a powerful Vánar leader to take ten thousand Vánars and
    search the eastern region for Sítá and Rávaṇ. The route passes rivers, woods,
    mountains, caves, islands, seas, monstrous beings, Garuḍ’s dwelling, the Milky
    Sea, Ananta on a golden mountain, Vishṇu’s cosmic footstep, the eastern mountain
    where the sun rises, and finally the limit beyond which there is no sun or moon.
    The searchers are ordered to return within a month.
  language: English
  quote_policy: quoted
