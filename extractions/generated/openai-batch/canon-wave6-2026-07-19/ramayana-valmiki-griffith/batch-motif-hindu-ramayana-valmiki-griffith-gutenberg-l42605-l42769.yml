candidate_motifs:
- id: motif:1
  label: Search for the stolen beloved across the world
  taxonomy_refs:
  - stolen_beloved
  - mystical_quest
  basis: The search party is sent to find captive Sítá and identify where Rávaṇ hides
    her, and the route extends across lands, seas, mountains, caves, and cosmic boundaries.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:11
  confidence: high
  cautions: The passage gives one regional search itinerary rather than the entire
    abduction narrative.
- id: motif:2
  label: Cosmic eastern mountain as boundary of light
  taxonomy_refs:
  - cosmic_mountain
  basis: The eastern mountain is golden, sky-piercing, associated with the sun’s beginning,
    morning light, life-bestowing sight and strength, and a limit beyond which no
    sun or moon shines.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage emphasizes the eastern limit and sunrise rather than explicitly
    naming a universal world-center.
- id: motif:3
  label: Earth-supporting cosmic serpent
  taxonomy_refs:
  - serpent
  basis: Ananta is described as a monstrous thousand-headed serpent, the supporter
    of the earth, resting on Mount Játarúpa while gods bow before him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The extract does not narrate Ananta’s origin or a separate serpent episode.
- id: motif:4
  label: Cosmic stride of Vishṇu
  taxonomy_refs:
  - ascent
  basis: The passage states that Vishṇu placed one step on Saumanas when pacing through
    the universe and another on Meru’s crest.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The available taxonomy does not include a dedicated cosmic-stride motif;
    the ascent reference is approximate because the passage describes cosmic stepping
    rather than a human ascent.
- id: motif:5
  label: World-edge darkness beyond the sun
  taxonomy_refs: []
  basis: Sugríva identifies the eastern mountain as the end of the search route and
    says that beyond it no sun or moon gives light and all is endless night.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: No supplied taxonomy family directly matches world-edge darkness.
- id: motif:6
  label: Fire hidden in the ocean
  taxonomy_refs: []
  basis: The route includes a fearful sea where a wrath-born horse’s head flames in
    the ocean bed and terrifies nearby sea creatures.
  evidence_refs:
  - ev:7
