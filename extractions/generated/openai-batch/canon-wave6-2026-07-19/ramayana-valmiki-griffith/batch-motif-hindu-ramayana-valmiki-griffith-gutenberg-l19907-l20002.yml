canonical_text:
  quote: ''
  summary: Vaśishṭha orders named envoys to travel quickly to Rājagriha and bring
    Bharat and Śatrughna back, while concealing Rāma’s departure and the death of
    Bharat’s father. The envoys take gifts, provisions, and swift horses, pass through
    a sequence of rivers, towns, sacred sites, and wilderness, and arrive at Girivraja
    by night to serve their master and protect the royal line.
  language: English
  quote_policy: summarized
