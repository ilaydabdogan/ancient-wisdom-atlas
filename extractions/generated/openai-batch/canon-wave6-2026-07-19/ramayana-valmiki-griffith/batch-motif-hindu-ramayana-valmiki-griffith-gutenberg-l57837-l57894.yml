canonical_text:
  quote: ''
  summary: 'The passage summarizes the later Uttarakāṇḍa narrative: Sítá is sheltered
    by Válmíki, gives birth to Kuśa and Lava, and the boys are taught to recite the
    Rāmāyaṇ before Ráma, who recognizes them as his sons. Sítá is summoned to affirm
    her innocence; after an oath to the Earth goddess, the earth opens, a divine throne
    borne by dragons rises, the goddess receives Sítá, and they descend while flowers
    fall from heaven. The passage then comments comparatively on sorrowful heroic
    endings in the Hindu epics and the later Homeric cycle. It also summarizes Ráma’s
    final earthly summons: Time, as an ascetic messenger of Brahmá, tells Ráma that
    his earthly mission is ending and that he may remain or ascend; Ráma chooses to
    return to his divine place, after which Durvásas demands to see him under threat
    of a curse.'
  language: English
  quote_policy: summarized
