canonical_text:
  quote: ''
  summary: In Rávaṇ's court, Hanumán identifies himself as a Vánar messenger of Ráma
    and Sugríva, explains that he crossed the sea to find and free the Maithil queen,
    and says he accepted apparent bonds only to gain an audience. He counsels Rávaṇ
    to restore the queen and warns that Ráma will destroy him and burn Lanká. Rávaṇ
    orders Hanumán killed, but Vibhishaṇ argues that envoys must not be executed under
    ancient law and should only be chastised.
  language: English
  quote_policy: summarized
