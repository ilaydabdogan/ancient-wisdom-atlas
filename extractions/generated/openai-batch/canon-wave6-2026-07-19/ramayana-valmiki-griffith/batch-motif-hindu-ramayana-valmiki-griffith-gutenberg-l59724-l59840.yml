canonical_text:
  quote: ''
  summary: This passage of notes compares Indra’s sending of his chariot, charioteer,
    and arms to Ráma with Venus bringing celestial arms to Æneas in the Æneid. It
    then explains Agastya’s legendary role in southern India and gives a prose translation
    of the episode in which Agastya approaches weary Ráma before battle with Rávaṇ,
    teaches him the Ádityahridaya hymn to the Sun, praises the Sun as containing or
    being many gods and cosmic powers, and instructs Ráma to worship and recite the
    hymn three times for victory.
  language: English with embedded Latin and Sanskrit names
  quote_policy: summarized
