canonical_text:
  quote: ''
  summary: Sampáti performs rites for his brother and tells Báli’s son how, after
    being burned by the sun and falling on Mount Vindhya, he reached the hermit Niśakar.
    The hermit recalls Sampáti and Jaṭáyus as former vulture kings able to assume
    forms at will. Sampáti recounts how the brothers vowed to chase the sun, how Jaṭáyus
    fell, and how Sampáti shielded him at the cost of his own wings. Niśakar prophesies
    that Sampáti’s wings and sight will return after he tells Ráma’s Vánar envoys
    the fate of the stolen wife.
  language: English
  quote_policy: summarized
