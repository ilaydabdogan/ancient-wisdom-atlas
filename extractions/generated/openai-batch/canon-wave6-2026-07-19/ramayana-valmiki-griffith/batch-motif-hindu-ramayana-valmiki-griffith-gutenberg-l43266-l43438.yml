canonical_text:
  quote: ''
  summary: Sugríva’s Vánar forces search widely for Sítá. Several parties return despairing
    after a month, while Hanumán, Tára, Angad, and others continue through Vindhya,
    a cursed wasteland, caves, forests, hills, pools, rivers, and cascades. They encounter
    and kill an Asur. Angad and Gandhamádan urge the party to renew the search, but
    Sítá is still not found in this passage.
  language: English
  quote_policy: summarized
