canonical_text:
  quote: ''
  summary: Sampáti, an aged wingless vulture, tells the Vánars that he has seen Rávaṇ
    carrying Sítá through the air to Lanká across the southern ocean. He gives directions,
    describes aerial realms and vulture powers of sight, asks for help making funeral
    libations for his brother, and recounts how his son Supárśva also saw the abduction
    from Mahendra’s height while holy spirits identified Sítá.
  language: English
  quote_policy: summarized
