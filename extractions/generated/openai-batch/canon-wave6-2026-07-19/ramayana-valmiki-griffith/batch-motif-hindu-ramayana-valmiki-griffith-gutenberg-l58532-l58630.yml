canonical_text:
  quote: ''
  summary: A note introduces the poem as a free version of an ancient story said to
    occur more than once in the Mahábhárat. A weary dove chased by a hawk seeks refuge
    with Káśí's king. The hawk argues that the dove is its rightful prey; the king
    refuses to betray his guest and offers other animals, then his own flesh, weighed
    against the dove. When the flesh does not balance the scale, the king places himself
    in it. Cosmic signs occur, gods led by Indra arrive, heavenly beings praise the
    king, Amrit is poured on him, and he is borne away in a golden car. The poem concludes
    by saying he won heaven and deathless fame and by urging protection of the weak.
  language: English
  quote_policy: summarized
