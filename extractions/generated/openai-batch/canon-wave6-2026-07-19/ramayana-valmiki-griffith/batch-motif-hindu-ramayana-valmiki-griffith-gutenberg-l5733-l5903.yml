canonical_text:
  quote: ''
  summary: Anśumán finds the ashes of Sagar’s sons and the sacrificial horse. Garuḍ
    tells him that only Gangā’s holy flood can purify the ashes and raise the dead
    to heaven. Sagar completes his rite but cannot bring Gangā down. Anśumán and Dilīpa
    also fail to accomplish the task. Bhagīrath undertakes severe austerities; Brahmā
    grants his request but instructs him to win Śiva’s aid because only Śiva can bear
    Gangā’s descent.
  language: English
  quote_policy: summarized
