canonical_text:
  quote: "“Rávaṇ the Rákshas king am I.”"
  summary: Sítá, addressing a disguised mendicant as a guest, recounts her lineage,
    marriage to Ráma, the planned consecration, Kaikeyí’s demand for Ráma’s exile
    and Bharat’s rule, Ráma’s obedient acceptance, and Lakshmaṇ’s decision to accompany
    them into the forest. She then offers hospitality and asks the stranger’s identity.
    The stranger reveals himself as Rávaṇ, king of the Rákshases, praises Sítá’s beauty,
    says he has taken many women from other lands, describes Lanká, and asks Sítá
    to become his queen.
  language: English
  quote_policy: quoted
