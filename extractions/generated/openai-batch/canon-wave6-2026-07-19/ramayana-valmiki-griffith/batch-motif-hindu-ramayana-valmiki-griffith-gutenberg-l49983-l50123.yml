canonical_text:
  quote: ''
  summary: Ráma threatens the Sea with a fiery Brahmá weapon so that the Vánar host
    may cross. The weapon’s preparation causes terror through heaven, earth, mountains,
    winds, and waters. Ocean appears in person with aquatic attendants, explains that
    he cannot cease to be unfordable by nature, but promises a passable road and directs
    the weapon northward against Drumakulya. Ráma releases the arrow, wounds the earth,
    creates the famed well of Vraṇa, dries waters in the region, and grants fertility
    to the wilderness. Ocean then appoints Nala, son of Viśvakarmá, to build a bridge;
    Nala accepts and asks that the Vánars lay the foundations.
  language: English
  quote_policy: summarized
