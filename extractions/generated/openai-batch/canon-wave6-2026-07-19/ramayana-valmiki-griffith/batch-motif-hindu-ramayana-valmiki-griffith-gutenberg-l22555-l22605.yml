  summary: A hermit tells Bharat to bring his whole host, then performs ritual purification
    at a chapel where a sacred fire burns. He prays to Viśvakarmá and summons deities,
    streams, celestial musicians, Apsarases, Kuvera’s garden, and Soma to provide
    music, drink, food, wreaths, wine, and meats for a great banquet.
