canonical_text:
  quote: ''
  summary: Ráma, speaking to his brother on Mályavat, describes the rainy season through
    images of clouds, rain, mountains, trees, lightning, and halted travel. The monsoon
    renews his grief for Sítá and delays action against Rávan. He says he will wait
    for Sugríva to rest after regaining his queen and kingdom, trusting that Sugríva
    will repay his aid. In the following canto opening, the rains have cleared, but
    Sugríva remains absorbed in pleasure with Rumá and Tárá and neglects his obligation
    until Hanúmán prepares prudent counsel.
  language: English
  quote_policy: summarized
