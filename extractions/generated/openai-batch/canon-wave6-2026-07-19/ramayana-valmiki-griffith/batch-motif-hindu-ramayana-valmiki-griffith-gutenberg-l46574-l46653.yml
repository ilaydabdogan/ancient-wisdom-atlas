canonical_text:
  quote: ''
  summary: A Vánar speaks to Sítá, recounting Daśaratha, Ráma’s righteousness and
    exile, Sítá’s abduction by a giant king, Ráma’s alliance with Sugríva, the Vánar
    search, and the speaker’s leap across the deep to find the Maithil queen. Sítá
    hides herself from the stranger, looks toward the tree, fears the monkey speaker
    may be a dream or illusion, reflects on her constant longing for Ráma, and invokes
    deities to make the message true.
  language: English
  quote_policy: summarized
