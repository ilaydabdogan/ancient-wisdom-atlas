canonical_text:
  quote: |-
    But none of all the host was found
    To clear the sea with desperate bound,
  summary: In a Vánar council at the sea, none of the host is found able to cross
    it. Jámbaván, aged and weakened, recalls his former power and says he can still
    leap ninety leagues. Angad volunteers to leap to Lanká but doubts his power to
    return; Jámbaván refuses to send him because Angad is the protected hope of the
    enterprise, and promises to incite another sufficiently mighty chieftain.
  language: English
  quote_policy: quoted
