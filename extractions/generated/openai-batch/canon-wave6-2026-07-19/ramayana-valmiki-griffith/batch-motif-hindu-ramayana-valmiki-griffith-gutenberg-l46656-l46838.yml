canonical_text:
  quote: "“The giant Rávaṇ came with guile / And bore me thence to Lanká’s isle.”"
  summary: Hanumán descends from a tree and respectfully addresses Sítá. He questions
    her identity, infers that she is a royal woman and Ráma’s queen, and Sítá confirms
    that she is Ráma’s wife, abducted by Rávaṇ to Lanká and threatened with death
    after two months. Hanumán declares himself Ráma’s messenger, conveys greetings
    from Ráma and Lakshmaṇ, praises Ráma, promises the coming rescue with Sugríva
    and the Vánar hosts, and recounts the alliance between Ráma and Sugríva that led
    to the search.
  language: English
  quote_policy: quoted
