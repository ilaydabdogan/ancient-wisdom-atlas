canonical_text:
  quote: "“The suppliant will I ne’er forsake”"
  summary: Vibhishaṇ arrives above the ocean shore with four companions, declares
    that he has fled his brother Rávaṇ, and asks to be announced to Ráma as a suppliant.
    Sugríva warns Ráma that the newcomer may be a hostile spy in friendly guise. Ráma
    asks the Vánar chiefs for counsel. Several advisers urge suspicion, testing, spying,
    or careful questioning, while Hanúmán argues that Vibhishaṇ is sincere. Ráma states
    that he will not abandon one who seeks protection in friendship, after which Sugríva
    again questions the loyalty of one who deserts his brother in danger.
  language: English
  quote_policy: quoted
