canonical_text:
  quote: ''
  summary: Before fortified Lanká, Ráma’s allies discuss how to enter the guarded
    city. Vibhishaṇ reports the enemy deployments at the four gates, and Ráma assigns
    allied commanders to attack each gate and the city center. He orders the shape-changing
    Vánars to keep their own form so allies can distinguish men from Vánars, then
    looks toward Suvela’s mountain height and wishes to climb it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Allied chieftains stand with Vibhishaṇ in enemy land and examine Lanká’s towers,
    walls, barred portals, and guards with anxiety.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vibhishaṇ says his lords entered Lanká, learned the enemy’s plan and order,
    and returned to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vibhishaṇ reports that Prahasta guards the eastern gate, Mahodar with Mahápárśva
    guards the southern portal, Indrajít guards the western gate, and Rávaṇ stands
    at the northern approach with trained giants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The enemy gate forces are described as having weapons including swords, maces,
    battle-axes, and lances, and as being accompanied by elephants, cars, and steeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ráma assigns Níla to the eastern gate, Angad to the southern gate, Hanúmán
    to the western gate, himself and Lakshmaṇ to the northern gate, and Jámbaván with
    the King of Vánars to force a way to the center.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ráma says he has sworn to kill Rávaṇ, whom he calls a tyrant who delights
    in ill.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rávaṇ is said to be armed with a boon from Brahmá and to oppress the just
    and wise through the worlds.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ráma orders that no Vánar should disguise himself in human form during the
    battle, and that the shape-changing chiefs should keep their Vánar appearance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Ráma states that only seven will appear in human form: himself, Lakshmaṇ,
    Vibhishaṇ, and the four companions Vibhishaṇ led from Lanká.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After addressing the chiefs, Ráma looks at Suvela’s crest, is delighted by
    the sight, and longs to climb the mountain height.
  category: action
