  quote: ''
  summary: Sumantra reports Ráma’s messages to his father, mother, and Bharat; Lakshmaṇ
    angrily condemns the king’s role in the exile; Sítá grieves silently; Sumantra
    later describes the exiles’ ascetic dress, their crossing to the farther shore
    of the Gangá and movement toward Prayág, and Ayodhyá’s citywide and even natural
    mourning over Ráma’s absence.
