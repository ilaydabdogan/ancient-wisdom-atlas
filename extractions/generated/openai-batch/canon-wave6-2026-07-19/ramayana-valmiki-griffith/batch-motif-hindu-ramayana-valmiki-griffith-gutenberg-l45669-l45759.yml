canonical_text:
  quote: ''
  summary: Hanumán leaves Rávaṇ’s halls after a fruitless search for Sítá. In despair
    he imagines possible deaths for her, foresees disastrous grief if he reports failure,
    vows not to return without finding her, considers ascetic seclusion or self-destruction,
    then notices an unsearched Aśoka grove, invokes celestial powers, and renews the
    search.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Vánar comes rapidly from Rávaṇ’s halls with hope gone and says his long
    search for Raghu’s son has found no trace of the ravished queen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: He imagines that while the giant carried his captive through the air, the
    Maithil lady may have slipped from the robber’s hold and fallen into the sea.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'He imagines other possible deaths for Sítá: fear in the monster’s arm, being
    crushed, being torn after rejecting him, or being slaughtered for the giant’s
    food.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: He debates whether to tell Raghu’s son the mournful story or conceal it, and
    fears the tale itself would kill him with despair.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: He imagines a chain of grief deaths and despair affecting Lakshmaṇ, Bharat,
