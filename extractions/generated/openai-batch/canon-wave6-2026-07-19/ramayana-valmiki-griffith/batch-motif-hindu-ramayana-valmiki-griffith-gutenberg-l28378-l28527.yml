canonical_text:
  quote: The glowing autumn passed, and then / Came winter so beloved of men.
  summary: During Ráma’s forest residence, autumn passes into winter. At daybreak
    Ráma goes to bathe, with Sítá and Lakshmaṇ following. Lakshmaṇ describes winter’s
    cold, frost, mist, altered waters, crops, animals, ritual offerings, and the sun’s
    southward course. He then speaks of Bharat’s grief, austerity, loyalty to Ráma,
    and criticizes Kaikeyí, which grieves Ráma.
  language: English
  quote_policy: quoted
