canonical_text:
  quote: ''
  summary: Ráma halts at Bharadvája’s hermitage, asks about Ayodhyá and his family,
    and receives assurance of Bharat’s loyalty. Bharadvája offers a boon; Ráma asks
    that the road to Ayodhyá be lined with fruiting and flowering trees for the Vánars,
    and the boon is fulfilled. Near Ayodhyá, Ráma sends Hanumán ahead to inform Guha
    and Bharat of his victorious return with Sítá, Lakshmaṇ, and allies, and to observe
    Bharat’s response to the prospect of Ráma’s return. Hanumán flies ahead, visits
    Śringavera, reaches Nandigráma, finds Bharat living austerely and revering Ráma’s
    shoes, and announces Ráma’s return. Bharat is overwhelmed with joy, embraces Hanumán,
    and offers him rich gifts.
  language: English
  quote_policy: summarized
