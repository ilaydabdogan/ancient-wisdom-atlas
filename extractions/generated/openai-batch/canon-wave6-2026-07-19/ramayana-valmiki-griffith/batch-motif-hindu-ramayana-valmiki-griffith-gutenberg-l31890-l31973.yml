canonical_text:
  quote: ''
  summary: Rávaṇ speaks and Márícha obeys, throwing off his giant form and assuming
    a magically beautiful deer shape near Ráma's cottage. The gem-bright deer moves
    through the grove and near the cottage to catch Sítá's attention. Other deer are
    first drawn to him, then flee after sensing something tainted. Márícha restrains
    his predatory impulse in order to preserve the disguise. Sítá, returning from
    gathering flowers, sees the wondrous deer and gazes at it with delight.
  language: English
  quote_policy: summarized
