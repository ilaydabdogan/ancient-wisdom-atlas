canonical_text:
  quote: ''
  summary: The son of Raghu describes Chitrakuta to his Videhan spouse as a beautiful
    mountain refuge filled with birds, colored rocks, trees, animals, cascades, caves,
    celestial beings, luminous herbs, and lovers' resting places. He says the woodland
    dwelling eases grief, fulfills his father's bond, gratifies Bharat, follows ancestral
    royal saints, and will allow him to keep his appointed oath with Lakshman near.
  language: English
  quote_policy: summarized
