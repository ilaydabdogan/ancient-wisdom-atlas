canonical_text:
  quote: "“Where is the Maithil dame?”"
  summary: Ráma returns to the empty leafy dwelling, laments Sítá’s absence, and wonders
    whether she has been carried away, devoured, or is hiding in play. Lakshmaṇ urges
    him not to despair and helps search hills, woods, caves, pools, streams, and waterfalls.
    When they find no trace, Ráma’s grief intensifies, and he imagines Sítá hidden
    among Aśoka boughs, plantains, and flowering trees.
  language: English
  quote_policy: quoted
