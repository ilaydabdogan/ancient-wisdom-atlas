canonical_text:
  quote: ''
  summary: Ráma answers Jamadagni’s son, strings a mighty bow, and declares that he
    will not kill him but will use Vishṇu’s dart to remove either his freedom to wander
    or the worlds won by penance. Celestial beings gather to watch. Jamadagni’s son
    concedes, asks to keep his power of movement, acknowledges Ráma’s divine superiority,
    and accepts the loss of his heavenly worlds. Ráma shoots the arrow, barring those
    worlds; Jamadagni’s son honors him and departs to Mahendra. Ráma returns the bow
    to Varuṇ, the royal party proceeds to Ayodhyá, the city celebrates, the brides
    are welcomed into the palace, and Bharat later departs with Śatrughna and Yudhájit.
  language: English
  quote_policy: summarized
