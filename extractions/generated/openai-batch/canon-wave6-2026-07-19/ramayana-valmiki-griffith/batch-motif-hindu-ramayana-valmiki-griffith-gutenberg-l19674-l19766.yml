canonical_text:
  quote: ''
  summary: Kauśalyá weeps over the dead king, blames Kaikeyí for his death and Ráma’s
    exile, imagines grief and hardship for Janak, Sítá, and Ráma, and declares that
    she will die with her husband in the fire. Attendants remove her from the corpse.
    The king’s body is placed in oil, rites for the departed are performed, and cremation
    is delayed until his son returns. The royal women lament, condemn Kaikeyí, and
    Ayodhyá is described as dark, widowed, and bereaved as night falls.
  language: English
  quote_policy: summarized
