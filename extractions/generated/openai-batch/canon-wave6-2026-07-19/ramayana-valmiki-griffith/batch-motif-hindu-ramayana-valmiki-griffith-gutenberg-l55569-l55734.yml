canonical_text:
  quote: ''
  summary: Rávaṇ’s wives and Mandodarí mourn his slain body, blaming his refusal to
    return Sítá, his rejection of counsel, and fate. Mandodarí says Ráma’s victory
    must be the work of Death or Vishṇu in human form. Ráma orders Vibhishaṇ to perform
    funeral rites despite Rávaṇ’s wrongdoing. Vibhishaṇ leads the obsequies, including
    fire, offerings, and sacrifice. After bathing and returning to Lanká, Ráma lays
    aside his weapons and armour.
  language: English
  quote_policy: summarized
