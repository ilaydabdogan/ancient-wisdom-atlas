canonical_text:
  quote: |-
    “O, let not, for the sin of one,
    The triple world be all undone.”
  summary: Ráma, grieving for his abducted wife, threatens world-destroying vengeance.
    Lakshmaṇ counsels him not to punish all beings for one offender, points to signs
    of a limited combat, urges a search for Sítá and the guilty foe, consoles Ráma
    with examples of grief and fate, and finally brings him to restrain his anger
    and ask for a plan of search.
  language: English
