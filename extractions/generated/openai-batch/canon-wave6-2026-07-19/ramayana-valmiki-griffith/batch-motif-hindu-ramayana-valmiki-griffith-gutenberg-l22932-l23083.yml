canonical_text:
  quote: ''
  summary: Bharadvāja counsels the distressed Bharat, who respectfully departs with
    a large royal host. The host travels south through the forest toward Chitrakūṭa
    and the Mandākinī. Bharat describes the mountain, river, trees, animals, and hermitage
    landscape, then orders a search for Rāma and Lakṣmaṇ. Searchers see smoke and
    infer habitation; Bharat halts the army and proceeds with selected companions
    while the host waits joyfully.
  language: English
  quote_policy: summarized
