canonical_text:
  quote: ''
  summary: Rāma, Lakṣmaṇa, and Viśvāmitra arrive at Janak's sacrificial ground. Janak
    honors Viśvāmitra and the assembled hermits, explains that twelve days remain
    before the gods come to claim their dues, and asks about the two princely youths.
    Viśvāmitra recounts their lineage and recent deeds, including the protection of
    the hermitage, Ahalyā's release from taint, and their coming to see the famous
    bow. Śatānanda questions Viśvāmitra about his mother Ahalyā's restoration and
    welcomes Rāma, praising Viśvāmitra as an extraordinary guide.
  language: English
  quote_policy: summarized
