  summary: The passage is a sequence of translator's footnotes explaining names, variant
    recensions, mythic backstories, weapons, divine titles, curses, and omitted material
    in the Ramayana translation. It includes notes on Maya and Máyá, Indra, Vibhishaṇ's
    desertion in the Bengal recension, Rávaṇ's refusal to give up Sítá, a serpent-arrow
    weapon, Nīla's shape-changing power, Vedavatī's fire-death and rebirth as Sítá,
    and several curses connected with Rávaṇ.
  language: English
  quote_policy: summarized
