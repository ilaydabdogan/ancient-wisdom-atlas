canonical_text:
  quote: ''
  summary: Ráma and Lakshmaṇ are sent with rites and blessings to Viśvámitra. Divine
    omens accompany their departure. On the southern shore of the Sarjú, Viśvámitra
    instructs Ráma to touch lustral water and invests him with two powerful spells
    that grant endurance, protection, wisdom, rank, and radiance. Ráma receives the
    spells with reverent gestures, and the youths serve the hermit and spend the night
    on the river bank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The monarch calls Ráma and Lakshmaṇ near; the mother and sire send their son
    with rite and prayer; Vaśishṭha blesses him; the father bends over his head and
    resigns Ráma, with Lakshmaṇ behind, to Kuśik’s son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the youthful hero stands by Viśvámitra, the Wind-God sends a breeze that
    waves the trees; flowers fall from heaven and music, song, and dance accompany
    the departure.
