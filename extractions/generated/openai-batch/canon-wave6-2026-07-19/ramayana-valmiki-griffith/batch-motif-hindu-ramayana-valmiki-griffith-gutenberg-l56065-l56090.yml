  quote: ''
  summary: Ráma shows no mercy toward the weeping queen. A pyre is prepared, and Sítá,
    called Janak’s child, circumambulates her lord, worships the gods, prays to the
    Lord of Flame as universal witness to protect her if she has remained faithful
    to Raghu’s son, and then enters the fire. Onlookers cry out as she falls beneath
    the flames.
