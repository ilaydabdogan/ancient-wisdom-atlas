canonical_text:
  quote: ''
  summary: Saramá consoles the captive Sítá by reporting the warlike sounds of Lanká
    and predicting Ráma’s victory. Sítá asks Saramá to learn Rávaṇ’s plans. Saramá
    spies unseen on Rávaṇ’s council and reports that his mother and elders urged him
    to restore Sítá, but he refused and would release her only in death. Battle sounds
    from Ráma’s approaching forces terrify Lanká, and Rávaṇ begins to address his
    fearful counsellors.
  language: English
  quote_policy: summarized
