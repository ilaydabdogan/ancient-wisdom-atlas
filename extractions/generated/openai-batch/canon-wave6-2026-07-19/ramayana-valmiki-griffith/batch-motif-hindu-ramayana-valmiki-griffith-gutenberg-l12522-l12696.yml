canonical_text:
  quote: "“It shall be done: let this suffice; / Ráma ne’er makes a promise twice.”"
  summary: 'Ráma finds Daśaratha overcome with grief and asks Kaikeyí the cause. Kaikeyí
    says the king must honor two former boons: Bharata is to be installed on the throne,
    and Ráma is to go to Daṇḍak forest in bark and matted hair for fourteen years.
    Ráma affirms that he will obey his father’s command.'
  language: English
  quote_policy: quoted
