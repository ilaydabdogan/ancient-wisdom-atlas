canonical_text:
  quote: ''
  summary: The passage recounts the royal line of Kuśa, the founding of cities by
    his sons, the landscape of Vasu's Magadhan domain, and the story of Kuśanábha's
    hundred daughters. The Wind-God woos the daughters and offers immortal youth;
    they refuse without their father's consent. In anger he bends their bodies. Their
    father praises their patience and fidelity, plans their marriages, and the town
    receives the name Kanyákubja because of the bending of the maidens.
  language: English
  quote_policy: summarized
