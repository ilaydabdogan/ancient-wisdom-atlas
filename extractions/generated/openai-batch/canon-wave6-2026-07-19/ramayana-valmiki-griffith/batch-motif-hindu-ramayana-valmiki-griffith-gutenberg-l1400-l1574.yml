canonical_text:
  quote: ''
  summary: After completing the tale, Válmíki chooses the twin youths Kuśá and Lava
    to learn and spread the Rámáyan. They recite it among sages, receive gifts and
    blessings, and later sing it in a royal assembly before Ráma. The recitation then
    opens with the Ikshváku lineage, Sagar, Manu, and a description of Kośal and Ayodhyá.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the tale is brought to an end, the sage wonders who will go through
    the earth and tell it so all may know.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuśá and Lava come to their master in hermit clothing, greet him, and embrace
    his feet; they are identified as twins, a princely pair, sweet-voiced, and skilled
    in Holy Writ.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Válmíki teaches the great Rámáyan to Kuśá and Lava; the poem is said to contain
    divine lore and to tell of Sítá’s noble life and Rávaṇ’s fall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The poem is described as a recitable and singable lay with seven musical notes,
    triple measure, melody, tone, time, and varied emotional flavours.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the youths store the poem in their hearts, Válmíki kisses them on the
    head and tells them to recite it among sages, the good, lowly homes, and royal
    courts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pair are likened to heavenly minstrels and are said to resemble Ráma,
    their sire, like two identical images from sculptured stone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The twins sing before gathered anchorites; the listeners are moved to tears,
    delight, praise, and wonder at both the singers’ skill and the bard’s verses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pleased sages give the youths ascetic and ritual objects, fruits, fuel, a
    stool, benedictions, promises of health, long life, and other boons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The twins sing in royal settings; Ráma hears their lay while he is to slay
    a votive steed and sends messengers to bring them before him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ráma is enthroned in gold with his brothers, ministers, and nobles nearby,
    views the youthful pair, and asks Lakshmaṇ and the rest to listen to the godlike
    singers.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The pair sing loudly and clearly in the assembly; the performance causes universal
    rapture, and Ráma says that his deeds will be told in Saint Válmíki’s lay.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The recitation begins with the old bravery and holy works of Ikshváku’s sons,
