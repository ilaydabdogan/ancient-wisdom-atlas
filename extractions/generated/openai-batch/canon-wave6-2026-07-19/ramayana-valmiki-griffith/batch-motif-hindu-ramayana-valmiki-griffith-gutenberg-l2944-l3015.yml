canonical_text:
  quote: ''
  summary: The gods petition Náráyaṇ/Vishṇu to be born as Daśaratha's offspring through
    his three queens, divided into four, in order to take human form and slay Rávaṇ.
    They explain that Rávaṇ's boon protects him from other beings but leaves man as
    the exception. Vishṇu promises to kill Rávaṇ and his allies, reign as a human
    king, and guard the earth; heavenly beings then sing a hymn of triumph.
  language: English
  quote_policy: summarized
