canonical_text:
  quote: ''
  summary: Sítá grieves intensely and collapses at the prospect of separation. Ráma
    consoles her, accepts that she may accompany him into the forest, explains that
    his journey is required by his father’s command and by filial duty, and instructs
    her to distribute wealth before beginning hermit life. Lakshmaṇ then pleads to
    accompany Ráma and Sítá with his bow, but Ráma asks him to remain and protect
    Kauśalyá and Sumitrá amid the consequences of Kaikeyí’s political success for
    Bharat.
  language: English
  quote_policy: summarized
