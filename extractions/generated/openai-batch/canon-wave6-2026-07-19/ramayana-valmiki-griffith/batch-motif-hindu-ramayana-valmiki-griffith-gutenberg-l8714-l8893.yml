canonical_text:
  quote: ''
  summary: In Mithilā, King Janak summons his younger brother Kuśadhwaj to share in
    the expected joy of the rite. After Kuśadhwaj arrives, the brothers summon Daśaratha
    with his sons, sages, ministers, and peers. Daśaratha asks that Vaśiṣṭha speak
    for the Ikṣvāku line if the assembled sages allow. Vaśiṣṭha recites the royal
    genealogy from Brahmā and Manu through Ikṣvāku to Daśaratha, including the embedded
    tale of Sagar’s birth after an attempted poisoning of his mother’s pregnancy.
    He concludes by claiming Janak’s daughters as wives for Rāma and Lakṣmaṇa.
  language: English
  quote_policy: summarized
