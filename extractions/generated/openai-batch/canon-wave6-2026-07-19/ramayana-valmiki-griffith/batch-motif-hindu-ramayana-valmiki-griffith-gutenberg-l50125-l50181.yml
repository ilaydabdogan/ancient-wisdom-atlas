  quote: ''
  summary: At Ráma’s command the Vánars gather timber, stones, and hills and build
    a vast bridge across the sea. The army crosses toward Lanká; Sugríva arranges
    for Ráma and Lakshmaṇ to be borne through the air by Hanumán and Angad, while
    the Vánar hosts travel by bridge, wave, and air and then rest on Lanká’s shore.
  language: English
