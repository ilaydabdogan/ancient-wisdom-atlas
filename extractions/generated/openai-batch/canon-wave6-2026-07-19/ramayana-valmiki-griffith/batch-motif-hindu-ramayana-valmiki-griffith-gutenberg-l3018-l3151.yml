canonical_text:
  quote: ''
  summary: Vishṇu resolves to take birth on earth, divides his being into four, and
    chooses Daśaratha as sire. During Daśaratha’s heir-winning sacrifice, a splendid
    envoy emerges from the sacrificial flame with a golden vessel of heavenly nectar.
    The envoy says the gods accept the rite and instructs the king to give the nectar
    to his queens so they will bear sons. Daśaratha distributes the nectar among Kauśalyá,
    Sumitrá, and Kaikeyí, and the queens conceive. The next canto opens with the self-existent
    Lord commanding the gods to create shape-changing monkey-form helpers for Vishṇu,
    and mentions a mouth-born lord of bears.
  language: English
  quote_policy: summarized
