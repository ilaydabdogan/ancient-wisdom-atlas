canonical_text:
  quote: ''
  summary: A Vánar hidden in the boughs watches Ráma’s spouse in the Aśoka grove.
    Rávan wakes, thinks of her, and comes to the grove with a royal female retinue
    and ritual splendor. Sítá is terrified, guarded by she-demons, weeps, lies on
    the earth, and thinks of Ráma. Rávan addresses her with desire, urges her to accept
    him, claims giants may seize women by force while promising not to touch her rudely,
    offers ornaments, food, pleasures, jewels, kingdom, and conquest, boasts of his
    power, belittles Ráma, and asks her to become queen over his household.
  language: English
  quote_policy: summarized
