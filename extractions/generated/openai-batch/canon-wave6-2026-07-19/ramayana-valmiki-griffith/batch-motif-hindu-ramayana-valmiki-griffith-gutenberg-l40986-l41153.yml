canonical_text:
  quote: ''
  summary: After Sugríva is restored to rule, Ráma and Lakshmaṇ take shelter in a
    cave on Praśravaṇ hill for the rainy season. Ráma praises the mountain, cave,
    brook, trees, flowers, birds, and nearby Kishkindhá, but remains overcome by grief
    for his stolen wife. Lakshmaṇ counsels him to cast off sorrow, wait until autumn,
    and then defeat the demon foe. Ráma accepts the counsel and affirms that one who
    has received aid should repay it.
  language: English
  quote_policy: summarized
