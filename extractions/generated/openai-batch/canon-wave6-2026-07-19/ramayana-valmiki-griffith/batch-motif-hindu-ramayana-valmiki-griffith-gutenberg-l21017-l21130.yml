canonical_text:
  quote: ''
  summary: Bharat is overcome by grief. Vaśishṭha urges him to perform the final rites
    for the dead monarch. Bharat has the king's body removed from oil, placed on a
    jeweled bed, and borne in procession. He laments his father, the people's loss,
    and Ráma's exile. Priests bring sacred fires, prepare the pyre, recite funeral
    texts, and sing the Śaman. Royal women and Queen Kauśalyá attend in mourning.
    The mourners go to the Sarjú, purify their lips with water, return to the city,
    and mourn for ten days on the ground.
  language: English
  quote_policy: summarized
