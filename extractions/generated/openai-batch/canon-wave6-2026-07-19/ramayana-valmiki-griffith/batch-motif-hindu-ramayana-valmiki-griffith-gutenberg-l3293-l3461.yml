canonical_text:
  quote: "“Those rites are o’er, the steed is slain;”"
  summary: Rishyaśring and Śántá are escorted toward the forest with royal honours
    and gifts. Śántá accepts life in the hermitage as her husband wishes. Daśaratha
    and his queens grieve at parting, bless Śántá, and instruct her in duties to husband
    and father-in-law. Daśaratha reverently honours Rishyaśring, receives his blessing,
    returns to his city, and awaits the promised sons of his queens. Rishyaśring returns
    to Champā, where the king welcomes him. A Brahman messenger is sent to Rishyaśring’s
    father, Kaśyap’s son, reporting that the rites are completed and the sacrificial
    steed is slain; the father sets out to bring his son home and is honoured by villagers
    under royal order.
  language: English
  quote_policy: quoted
