canonical_text:
  quote: ''
  summary: Additional notes describe a Lakshmî/Saraswatî festival honoring learning
    and writing implements; list attributes, titles, family, realm, and vehicles of
    Indra; and summarize Vishnu as preserver, his cosmic sleep on waters, and several
    avatars including fish, tortoise, boar, man-lion, dwarf, Buddha, and future Kalki.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lakshmî is described as honored on a festival day when she is identified with
    Saraswatî, the consort of Brahmá and goddess of learning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The festival worship includes flowers, perfumes, rice, and water, with honor
    paid to inkstand and writing-reed and no writing performed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pens, inkstands, and books are cleaned, wrapped or arranged, strewn with flowers
    and young barley, and treated as having a holiday while family members prostrate.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indra is described as chief of secondary deities, presider over paradise,
    god of atmosphere and winds, and regent of the eastern quarter of the sky.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indra is associated with named titles, wife, son, pleasure garden, city, palace,
    horse, elephant, and charioteer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vishnu is described as the preserving power who becomes incarnate in multiple
    forms for the preservation of mankind in emergencies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before creation and after temporary annihilation, Vishnu is said to sleep
    on the waters while floating on the serpent Śesha; Brahmá springs from a lotus
    growing from Vishnu's navel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the fish avatar, Vishnu saves Satyavrata, the seven Rishis, and their wives,
    who have taken refuge in an ark to escape a deluge destroying the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the tortoise avatar, Vishnu supports Mount Mandara at the bottom of the
    ocean while gods and demons use the serpent Vásuki as a rope to churn the waters
    for amrita and other sacred things.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the boar avatar, Vishnu rescues the earth from the demon Hiraṇyáksha, who
    carried it into the ocean depths; Vishnu dives into the abyss, contests the demon,
    and kills him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the man-lion avatar, Vishnu delivers the earth from the tyranny of Hiraṇyakaśipu.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the dwarf avatar, Vishnu asks Bali for as much land as he can pace in three
    steps, expands until he fills the world, and deprives Bali of heaven and earth
    while leaving him Pátála.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Buddha avatar is described as a sage-form descent to reform Brahmin religion
    and reclaim people from animal sacrifice, though some Hindus reject it as Vishnu's
    incarnation.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: The future Kalki avatar is described as mounted on a white horse with a drawn
    scimitar blazing like a comet; he will end the current age by destroying the world
    and renovating creation with an age of purity.
  category: sequence
  evidence_refs:
  - ev:13
