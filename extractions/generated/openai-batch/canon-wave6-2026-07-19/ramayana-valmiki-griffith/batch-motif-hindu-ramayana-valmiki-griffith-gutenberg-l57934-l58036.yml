  claim: The Matsya episode in the passage fits a flood-and-ark motif pattern because
    a deluge destroys the earth while selected survivors take refuge in an ark and
    are saved by the fish avatar.
  claim_level: same_motif
  target: flood_and_renewal and ark_vessel motif families
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a compressed summary and does not provide a full flood
