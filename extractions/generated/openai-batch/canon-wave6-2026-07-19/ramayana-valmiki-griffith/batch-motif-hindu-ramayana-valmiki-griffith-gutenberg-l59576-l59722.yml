comparison_claims:
- id: claim:1
  claim: The note reports Lassen's view that Megasthenes's Hyperboreans correspond
    to the Uttara Kurus, linking both to a far-northern ideal people with extraordinary
    longevity.
  claim_level: same_motif
  target: Greek Hyperboreans as reported through Megasthenes
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a reported scholarly identification within a note; the passage
    itself does not present the full Greek source context.
- id: claim:2
  claim: The note explicitly says the Homeric expression of dancing a war-dance before
    Ares is similar to the Rámáyaṇa battle image of the Gandharva dance.
  claim_level: linguistic_similarity
  target: Homeric war-dance before Ares
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The similarity is at the level of phrasing and martial dance imagery;
    no historical connection is argued.
- id: claim:3
  claim: The note compares Indrajit's magic image of Sítá with Greek and Roman epic
    episodes where Apollo or Juno forms an image or fictitious Aeneas to save a hero.
  claim_level: same_motif
  target: Homer's Iliad and Virgil's Aeneid image/double episodes involving Aeneas
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is explicitly made, but the passage provides only a
    brief summary rather than the full classical passages.
- id: claim:4
  claim: The note compares signs of Sítá's future queenship with Josephus's anecdote
    in which Caesar recognizes an impostor because his hand lacks marks of royalty.
  claim_level: same_function
  target: Josephus anecdote of Caesar using hand marks to judge royal status
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to bodily signs of royal status; the passage
    does not claim shared origin or direct influence.
