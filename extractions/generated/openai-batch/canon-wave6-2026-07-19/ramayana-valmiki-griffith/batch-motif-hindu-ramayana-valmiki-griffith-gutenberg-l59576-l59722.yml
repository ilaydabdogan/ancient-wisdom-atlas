canonical_text:
  quote: ''
  summary: A set of additional notes discusses Uttara Kuru/Ottorakorra as a far-northern
    land and ideal paradise; the Vánars as monkey-form forest or mountain combatants;
    Rávaṇa's exploits against Serpent-Gods; Brahmanical sacred fires and funeral rites;
    Punjikasthalá and a curse by Brahmá; Sítá's imagined funeral lament for Ráma;
    royal signs on the hand; the Gandharva dance as a battle image; Anaraṇya's prophecy
    of Rávaṇa's death by Ráma; and the magic image of Sítá with Greek epic parallels.
  language: English
  quote_policy: summarized
