  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bengal recension is reported to call the Vánars silvans in the forms of
    monkeys; Gorresio interprets them as wild-looking inhabitants of mountainous and
    southern regions.
  category: attribute
  evidence_refs:
  - ev:3
