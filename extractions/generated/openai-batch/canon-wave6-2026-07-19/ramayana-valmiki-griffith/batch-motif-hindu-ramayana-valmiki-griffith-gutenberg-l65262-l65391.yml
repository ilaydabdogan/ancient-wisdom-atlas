  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: Ráma is identified as de jure king of Kośal, whose capital was Ayodhyá.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:17
  text: Chaityaprásáda is explained as the place where the gods of the Rákshases were
