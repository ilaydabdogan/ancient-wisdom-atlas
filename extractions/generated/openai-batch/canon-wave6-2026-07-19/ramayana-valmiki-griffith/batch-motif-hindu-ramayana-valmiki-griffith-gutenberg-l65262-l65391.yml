candidate_motifs:
- id: motif:1
  label: fixed number of gods with expanded pantheon
  taxonomy_refs: []
  basis: The commentary describes the Rig-vedic thirty-three gods and the later retention
    of that name despite proliferation of deities.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is a theological-number pattern in a footnote, not a narrative motif
    in the episode itself.
- id: motif:2
  label: serpent deities beneath the earth
  taxonomy_refs:
  - serpent
  basis: The passage explicitly defines serpent-gods as dwelling under the earth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives only a brief glossary, not a developed serpent narrative.
- id: motif:3
  label: southern realm of death
  taxonomy_refs:
  - afterlife_journey_map
  basis: The south is identified as Yama’s region and the place of departed spirits.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage maps an afterlife region but does not describe a journey through
    it.
- id: motif:4
  label: divine beings marked by non-human bodily signs
  taxonomy_refs: []
  basis: The gods are said not to shed tears and not to touch the ground when walking
    or standing.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is an attribute motif recorded in commentary, not an enacted scene.
- id: motif:5
  label: abducted beloved awaiting news from the hero
  taxonomy_refs:
  - stolen_beloved
  basis: Sítá is said to know nothing of Ráma’s events since being carried away by
    Rávaṇ.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage is a footnote summarizing context from the broader epic.
- id: motif:6
  label: recognition token sent to abducted beloved
  taxonomy_refs: []
  basis: The note reports a ring sent by Ráma to Sítá and the interpretive claim that
    it symbolizes the sun’s disc.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not give the full exchange scene, only commentary on
    the ring.
- id: motif:7
  label: size-reducing infiltrator
  taxonomy_refs:
  - shapeshifter
  basis: Hanumán is said to have condensed himself to the size of a cat in order to
    enter the city without observation.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The transformation is specifically size-reduction rather than a full change
    of species or identity.
- id: motif:8
  label: punitive destruction after failed diplomacy
  taxonomy_refs: []
  basis: Hanumán considers conciliation, gifts, and disunion useless and resolves
    on punishment by destroying Rávaṇ’s pleasure-grounds.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage states the strategic reasoning but not the full destructive
    episode.
- id: motif:9
