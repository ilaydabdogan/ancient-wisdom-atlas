canonical_text:
  quote: ''
  summary: 'A sequence of translator’s footnotes explains divine classifications,
    mythic beings, places, symbols, and narrative context: the thirty-three Vedic
    gods, serpent-gods beneath the earth, Gandharvas as heavenly musicians, Yama’s
    southern realm of the dead, Sítá in the grove, Sanskrit speech conventions, divine
    figures such as Brahmá, Vṛihaspati, Rudras, Maruts, Rohiṇí, Arundhatí, Kuvera,
    Indra, Airávat, and Hanumán’s mission. The notes also mention the ring sent by
    Ráma to Sítá, Hanumán’s size-reduction, Ráma’s kingship, a Rákshasa sacred building,
    and Indra’s bow as the rainbow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note states that Rig-vedic hymns invoke the Aśvins with the thrice eleven
    gods and Agni with the thirty-three gods, and that later Brahmanism retained the
    name while the pantheon expanded.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Serpent-gods are described as dwelling in regions under the earth.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gandharvas are described as heavenly singers or musicians who play at divine
    banquets and share in the battles of the gods.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The south is identified as the region of Yama, the God of Death, and as the
    place of departed spirits.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sítá is in a grove while guards are asleep, and she has moved to a tree some
    distance from them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note says Sítá is not addressed in Sanskrit because it would alarm her
    and be unsuitable to the speaker, not because she would fail to understand it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Svayambhu is glossed as the Self-existent Brahmá.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Vṛihaspati or Váchaspati is identified as Lord of Speech and preceptor of
    the gods.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Asurs are described as fierce enemies of the gods; Rudras as manifestations
    of Śiva; and Maruts as Storm Gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Rohiṇí is described as an asterism and favorite wife of the Moon, while Arundhatí
    is described as the wife of Vaśishṭha, a model of conjugal excellence, and raised
    to the heavens as one of the Pleiades.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The note states that gods do not shed tears and do not touch the ground when
    they walk or stand.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sítá is said to know nothing of what has happened to Ráma since she was carried
    away by Rávaṇ; the poet therefore repeats the story of Ráma’s meeting with Sugríva,
    Bálí’s defeat, and later events.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: A scholarly note reports the view that the ring sent by Ráma to Sítá symbolizes
    the sun’s disc.
  category: object
  evidence_refs:
