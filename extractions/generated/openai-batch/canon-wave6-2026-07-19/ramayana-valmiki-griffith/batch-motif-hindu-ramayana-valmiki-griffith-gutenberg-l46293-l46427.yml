canonical_text:
  quote: ''
  summary: Demon guards press Sítá to accept Rávaṇ and enjoy royal luxury. Sítá refuses,
    declaring loyalty to Ráma even if her body is eaten. The demons threaten to kill,
    dismember, and feast on her. Sítá collapses, weeps beneath a shady tree, calls
    on Ráma, his brother, Kauśalyá, and Sumitrá, and laments separation. She recounts
    being carried away by Rávaṇ, who can assume forms, insists she will never consent
    to him, and imagines that Ráma would cross land and sea and destroy Lanká if he
    knew where she was.
  language: English
  quote_policy: summarized
