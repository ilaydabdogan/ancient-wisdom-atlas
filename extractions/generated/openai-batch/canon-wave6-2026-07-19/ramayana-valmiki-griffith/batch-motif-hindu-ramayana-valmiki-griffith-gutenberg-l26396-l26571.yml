canonical_text:
  quote: ''
  summary: Virádha seizes Sítá, prompting Ráma’s grief and Lakshmaṇ’s vow of vengeance.
    Virádha identifies himself as a giant protected by a boon from Brahmá that prevents
    weapons from piercing or tearing him, demands that the brothers leave Sítá with
    him, and fights them. Ráma’s arrows strike him but do not kill him; Virádha releases
    Sítá, attacks with a spear, and then carries Ráma and Lakshmaṇ away through the
    forest. Sítá, terrified, begs Virádha to take her instead and free the brothers.
  language: English
  quote_policy: summarized
