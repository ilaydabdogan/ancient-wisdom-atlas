canonical_text:
  quote: ''
  summary: An unnamed speaker praises the Prince's arrows but asks him first to hear
    of Báli's might. Báli is described as crossing from sea to sea before dawn, tossing
    mountain peaks, and throwing down trees. The bull-shaped monster Dundubhi, proud
    of his strength, seeks battle with Ocean, who refuses and directs him to Himálaya.
    Dundubhi attacks the snowy mountain, and the Lord of Mountains appears and says
    the mountain is a hermits' retreat unfit for war.
