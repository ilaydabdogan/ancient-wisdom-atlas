canonical_text:
  quote: ''
  summary: After resting in Lanka, Ráma is greeted by Vibhishaṇ, who offers bathing
    preparations, adornments, hospitality, and the wondrous chariot Pushpak. Ráma
    refuses delay because Bharat is waiting under a vow and he longs to return to
    Ayodhyá. Vibhishaṇ explains that Pushpak can carry him through the air in one
    day; the car is then brought, shining and said to have been made by Viśvakarmá.
  language: English
