canonical_text:
  quote: ''
  summary: Rávaṇ hears advice, dismisses his nobles, weighs risk and gain, and resolves
    on a deed. He orders and mounts a wondrous chariot drawn by goblin-headed asses
    and travels toward the ocean shore in royal splendor. From the air he sees a rich
    sacred coastal landscape inhabited by hermits, celestials, gods, Dánavs, birds,
    and heavenly chariots. The passage recalls a vast fig-tree under which ascetics
    dwelt, where Garuḍ once saved the hermits from a falling branch while carrying
    an elephant and tortoise, and later gained resolve to steal the Amrit from Indra’s
    palace. Rávaṇ then reaches Márícha’s secluded hermitage; Márícha, dressed as an
    ascetic, receives him as a guest and asks why he has come so urgently.
  language: English
  quote_policy: summarized
