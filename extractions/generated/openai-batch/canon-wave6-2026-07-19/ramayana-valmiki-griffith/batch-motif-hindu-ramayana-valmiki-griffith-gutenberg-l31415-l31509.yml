  quote: ''
  summary: In a speech attributed by the passage heading to Márícha, the speaker recalls
    how the young Ráma guarded Viśvámitra’s rites in Daṇḍak wood, defeated him with
    an arrow, spared his life, and slew his band. The speaker then warns the king
    of Lanká that fighting Ráma and taking Ráma’s Maithil wife will bring defeat,
    the destruction and burning of Lanká, the death or flight of the giants, and the
    end of the king’s life and empire.
