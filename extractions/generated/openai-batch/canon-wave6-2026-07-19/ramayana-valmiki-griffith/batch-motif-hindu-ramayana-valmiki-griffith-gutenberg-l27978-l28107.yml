canonical_text:
  quote: ''
  summary: A holy hermit praises Sítá's fidelity and welcomes Ráma, Lakshmaṇ, and
    Sítá. Ráma respectfully asks for a place to build a hermit cell. Agastya directs
    him to Panchavaṭí, describes its groves, fruit, water, and proximity to the Godávarí,
    and says Ráma will protect nearby ascetics. The princes bow, depart with Sítá,
    and on the road encounter a mighty vulture who identifies himself as an old friend
    of their father.
  language: English
  quote_policy: summarized
