canonical_text:
  quote: ''
  summary: 'Trijaṭá, an old and compassionate Rákshas matron, rebukes the demon women
    who threaten Sítá and recounts an ominous dream: Ráma and Lakshmaṇ appear in a
    splendid aerial chariot; Sítá appears in white on a sea-beaten snowy hill and
    is reunited with Ráma; Rávaṇ and his kin are shown in humiliating southward movement;
    and Lanká is destroyed by the sea. Trijaṭá urges the demons to stop taunting Sítá
    and seek her forgiveness. An editorial note says two cantos are omitted as interpolation.
    Hanumán, concealed nearby, deliberates how to console Sítá without frightening
    her, deciding to speak in common language and first utter Ráma’s name.'
  language: English
  quote_policy: summarized
