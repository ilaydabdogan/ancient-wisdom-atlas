canonical_text:
  quote: ''
  summary: Bharat recounts that Ráma refused to return before completing fourteen
    years of obedience to his father's command. On Vaśishṭha's counsel, Ráma gave
    Bharat his gold-decked sandals to carry to Ayodhyá as guardians of the land. A
    hermit praises Bharat's virtue, and Bharat returns with his retinue, crossing
    the Yamuná and Gangá. He finds Ayodhyá dark, silent, and joyless because Ráma
    is absent. After weeping in his father's palace, Bharat announces that he will
    go to Nandigrám and wait there until Ráma returns to rule as rightful lord; Vaśishṭha
    and the other leaders approve his brotherly fidelity.
  language: English
  quote_policy: summarized
