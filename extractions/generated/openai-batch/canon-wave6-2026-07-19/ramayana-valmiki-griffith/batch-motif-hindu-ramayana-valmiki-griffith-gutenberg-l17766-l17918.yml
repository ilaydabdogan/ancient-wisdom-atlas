canonical_text:
  quote: "“The forest life today I choose, / And kingly state and power refuse.”"
  summary: Ráma, lying on leaf-strewn ground with Lakshmaṇ, laments Daśaratha’s distress,
    Kaikeyí’s success, and the danger to his mothers. He asks Lakshmaṇ to protect
    Kauśalyá but declares that he will go to Daṇḍak forest with Sítá and refuse kingship
    rather than break duty. Lakshmaṇ consoles him, saying he and Sítá cannot live
    without him. The brothers rest beneath a fig tree, then travel through dense woods
    toward the Yamuná-Gangá confluence near Prayág, where Ráma sees smoke indicating
    a saint’s dwelling, hears the rivers’ roar, and identifies the area near Bharadvája’s
    home.
  language: English
  quote_policy: quoted
