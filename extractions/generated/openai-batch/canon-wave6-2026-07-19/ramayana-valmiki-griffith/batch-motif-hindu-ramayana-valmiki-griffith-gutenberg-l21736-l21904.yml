canonical_text:
  quote: ''
  summary: Bharat begins an early-morning journey to see Ráma, accompanied by priests,
    lords, a large army, royal women, and many townspeople. The procession reaches
    the Gangā near Śringavera, where Bharat orders a halt before crossing and plans
    a funerary water offering for his father. Guha, Ráma’s Nishāda ally, sees the
    host, fears hostile intentions toward Ráma, prepares a river defense, and then
    approaches Bharat with a gift for an interview.
  language: English
  quote_policy: summarized
