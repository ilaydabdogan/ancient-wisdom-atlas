canonical_text:
  quote: "“Gather each boat upon the shore / And ferry all the army o’er.”"
  summary: Guha orders boats to be gathered to ferry Bharat’s army. Hundreds of boats
    are prepared, royal and priestly figures board, and the army crosses the Ganga
    by boats, swimming elephants, barges, rafts, pitchers, and their own arms. The
    force reaches Prayaga, rests, and Bharat goes with priestly attendants to Bharadvaja’s
    dwelling.
