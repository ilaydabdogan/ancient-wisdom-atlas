  quote: ''
  summary: Sumitrá consoles Kauśalyá by presenting Ráma’s forest exile as filial duty,
    affirming Lakshmaṇ’s and Sítá’s loyalty, describing auspicious protection for
    Ráma, and predicting his return and coronation. In the Tamasá canto, the people
    of Ayodhyá follow Ráma’s chariot toward banishment; Ráma asks them to transfer
    their loyalty to Bharat and to comfort the king, while elders appeal to the horses
    to return with Ráma.
  language: English
