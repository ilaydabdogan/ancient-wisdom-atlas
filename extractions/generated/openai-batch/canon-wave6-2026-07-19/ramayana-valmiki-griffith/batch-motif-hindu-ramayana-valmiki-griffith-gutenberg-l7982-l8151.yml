canonical_text:
  quote: ''
  summary: Śunahśepha is declared fit for sacrifice, clothed in red, tied as a victim,
    and while bound praises the Fire-God, Indra, and Upendra/Vishṇu; Vishṇu grants
    him long life and the king gains the sacrifice’s fruit through Indra. Viśvámitra
    continues severe austerities at Pushkar. Brahmá grants him the title of Saint,
    but Viśvámitra seeks greater attainment. Menaká descends to bathe in Pushkar’s
    water, and Viśvámitra, overcome by love, invites her to stay; ten years pass as
    his vows are interrupted. He repents, dismisses Menaká gently, goes north to the
    snowy hills near Kauśikí, and resumes penance. The gods fear his austerity and
    Brahmá grants him the rank of Mighty Saint, but not yet Brahman Saint. Viśvámitra
    undertakes harsher practices involving standing on one foot, living on air, five
    fires, rain, and a stream. Śakra/Indra fears his growing merit and summons Rambhá,
    ordering her to seduce the ascetic with Kandarpa’s aid and Indra’s own help in
    koil form.
  language: English
  quote_policy: summarized
