canonical_text:
  quote: ''
  summary: In English verse, a first-person speaker at Pampá addresses Lakshmaṇ. The
    spring landscape, scented breezes, flowering trees, water, bees, birds, and paired
    animals intensify his grief for absent Sítá. He recalls that Sítá followed him
    into exile, fears questions from Sítá's father and Queen Kauśalyá, says Sítá is
    imprisoned far away, and tells Lakshmaṇ to go to Bharat because life without Sítá
    is unbearable.
