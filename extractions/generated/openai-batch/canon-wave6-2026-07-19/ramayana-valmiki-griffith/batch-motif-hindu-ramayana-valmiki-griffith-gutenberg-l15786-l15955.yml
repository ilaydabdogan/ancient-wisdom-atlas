canonical_text:
  quote: "“The fourteen years thou hast to stay / Far in the wilds, begin to-day”"
  summary: Before Ráma’s departure for exile, Daśaratha orders treasure given to Sítá.
    Kauśalyá instructs Sítá on wifely duty, Sítá affirms devotion to her husband,
    Ráma consoles and bids farewell to the royal women, and Sumitrá instructs Lakshmaṇ
    to serve Ráma and regard Sítá as his mother. Sumantra then invites Ráma to mount
    the chariot, saying the fourteen-year forest exile begins that day.
  language: English
  quote_policy: quoted
