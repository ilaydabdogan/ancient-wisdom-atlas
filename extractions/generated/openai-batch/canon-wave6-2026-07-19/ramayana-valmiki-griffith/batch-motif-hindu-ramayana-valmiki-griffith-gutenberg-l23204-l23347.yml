canonical_text:
  quote: ''
  summary: Ráma shows Sítá the Mandákiní stream, Chitrakúṭa hill, hermits, animals,
    trees, flowers, and bathing places. He says this forest setting is sweeter than
    city life, imagines the hill as Ayodhyá and the waters as Sarjú, and expresses
    contentment with Sítá and Lakshmaṇ in exile. Later he points out a cave and resting
    stone, and he and Sítá speak tenderly amid forest sights and bird calls.
  language: English
  quote_policy: summarized
