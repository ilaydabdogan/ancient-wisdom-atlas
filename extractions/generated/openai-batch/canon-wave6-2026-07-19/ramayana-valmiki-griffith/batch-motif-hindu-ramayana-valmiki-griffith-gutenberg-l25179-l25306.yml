canonical_text:
  quote: ''
  summary: Vaśishṭha counsels Ráma to honor father, mother, and holy guide and to
    consider Bharat’s request. Ráma answers that he will not break Daśaratha’s word.
    Bharat attempts a fasting supplication on sacred grass before Ráma’s forest dwelling,
    but Ráma rejects the tactic as unsuitable for a consecrated prince. The people
    acknowledge Ráma’s fidelity to his father’s decree. Bharat purifies himself with
    water, denies seeking the kingdom, and offers to take the exile himself. Ráma
    refuses to transfer the exile, affirms his father’s promise and Kaikeyí’s boon,
    praises Bharat, and anticipates reigning with Bharat’s aid after his return from
    the woods.
  language: English
  quote_policy: summarized
