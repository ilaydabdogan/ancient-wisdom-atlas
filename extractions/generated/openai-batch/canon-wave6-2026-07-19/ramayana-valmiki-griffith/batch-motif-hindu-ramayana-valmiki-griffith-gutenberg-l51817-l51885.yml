canonical_text:
  quote: ''
  summary: Rāvaṇ sees the Vānar army besieging Lankā with Rāma foremost. Rāma looks
    at Lankā, thinks sorrowfully of Sītā, and orders an assault. The Vānars fill the
    moat with stones, trees, rocks, and mountains, scale the walls, and break gates
    and structures. Rāvaṇ orders his giants to charge from the gates, and the two
    armies meet in a loud and violent battle compared to gods fighting rebel fiends.
  language: English
  quote_policy: summarized
