canonical_text:
  quote: ''
  summary: Bharat hears Guha’s account and collapses in grief. Śatrughna and the royal
    mothers mourn around him, and Kauśalyá anxiously asks whether bad news of Ráma,
    Lakshmaṇ, or Sítá has caused his distress. Bharat recovers and asks Guha where
    Ráma, Lakshmaṇ, and Sítá lodged, what bed they used, and what food they ate. Guha
    recounts that he offered food and fruit, but Ráma refused gifts according to his
    warrior rule, drank water brought by Lakshmaṇ, fasted with Sítá, and performed
    evening worship. Lakshmaṇ prepared a sacred grass bed under a tree for Ráma and
    Sítá, bathed their feet, and kept armed watch through the night with Guha and
    his followers.
  language: English
  quote_policy: summarized
