canonical_text:
  quote: ''
  summary: A chieftain rouses Hanumán by recalling his divine birth from Anjaná and
    the Wind-God, his childhood leap toward the sun, his wounding by Indra, and the
    protective boons granted by the gods. The chieftain urges him to leap over the
    ocean to find the Maithil lady. Hanumán expands in size and declares his windlike
    power, his ability to cross sky, mountain, sea, and sunward path, and his intent
    to find the lady and ruin Lanká.
  language: English
  quote_policy: summarized
