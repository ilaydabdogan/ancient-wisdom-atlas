canonical_text:
  quote: ''
  summary: Válmíki asks Nárad to identify a man of supreme virtue, wisdom, strength,
    and royal excellence. Nárad names Ráma of Ikshváku’s line and describes his virtues,
    bodily marks, learning, martial ability, compassion, justice, and divine or cosmic
    comparisons. The passage then summarizes Daśaratha’s plan to make Ráma heir, Kaikeyí’s
    demand that Ráma be exiled and her son made heir, Ráma’s obedient departure with
    Lakshmaṇ and Sítá, their journey through Śringavera, across the Gangá, and to
    Chitrakúṭa, and Bharat’s later refusal to rule except through Ráma’s sandals as
    a pledge while awaiting Ráma’s return.
  language: English
  quote_policy: summarized
