  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kumbhakarṇa is described as having an appetite large enough to consume six
    months’ provisions in one day; Brahmá decreed that he should sleep six months
    at a time and wake for only one day.
  category: sequence
  evidence_refs:
  - ev:5
