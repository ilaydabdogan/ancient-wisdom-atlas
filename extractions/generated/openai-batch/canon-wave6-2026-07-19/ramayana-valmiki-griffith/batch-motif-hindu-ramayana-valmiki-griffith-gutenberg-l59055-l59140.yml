- id: obs:1
  text: Ráma is said to have spent more than thirteen years of exile wandering among
    Brahmanical settlements between the Ganges and the Godáveri, extending from Chitra-kúṭa
    to Nasik near the Godáveri source.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hermitages are said to belong to particular sages famous in Brahmanical
    tradition, including Viśvámitra, Atri, Agastya, and Válmíki, but the note questions
    whether these sages could have been contemporaries of Ráma.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atri is described in a Mahá Bhárata genealogical list as progenitor of the
    Moon and first ancestor of the Lunar race; Budha is described as marrying Ilá,
    daughter of Ikhsváku, ancestor of the Solar race of Ayodhyá.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says some Pundits reconciled chronological contradictions by representing
    the sages as living thousands of years and reappearing on earth in widely separated
    ages.
  category: other
  evidence_refs:
  - ev:3
