canonical_text:
  quote: ''
  summary: Ráma, Lakshmaṇ, and Sítá come before the grieving king. The king faints,
    laments, says he granted Kaikeyí's boons while misled, and offers Ráma the throne
    instead. Ráma asks leave to depart for Daṇḍak wood with Lakshmaṇ and Sítá, refuses
    kingship and even a one-night delay, resigns the realm to Bharat, vows to dwell
    in the woods for fourteen years, and insists on preserving his father's spoken
    word.
  language: English
  quote_policy: summarized
