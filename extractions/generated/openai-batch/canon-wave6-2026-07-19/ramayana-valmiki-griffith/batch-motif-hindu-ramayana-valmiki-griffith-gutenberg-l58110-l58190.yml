canonical_text:
  quote: ''
  summary: A scholarly note defines avatár as a descent or visible manifestation of
    Vishṇu, identifies Ráma as Vishṇu's seventh avatár, explains the Trimúrti and
    Brahma, and contrasts Indian avatárs and the Trimúrti with the Christian Incarnation
    and Trinity. It lists examples of Vishṇu's avatárs, including tortoise, fish,
    and boar forms, and describes the fish as raising the lost Veda from the sea and
    saving mankind from waters.
  language: English
  quote_policy: summarized
