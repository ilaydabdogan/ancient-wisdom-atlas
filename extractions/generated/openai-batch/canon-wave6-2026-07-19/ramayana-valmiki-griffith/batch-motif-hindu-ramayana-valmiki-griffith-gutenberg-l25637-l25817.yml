canonical_text:
  quote: ''
  summary: Bharat travels with Śatrughna, priests, lords, citizens, and an army to
    Nandigrám, carrying Ráma’s sandals on his head. He declares that Ráma entrusted
    the land to him through the sandals, installs them with royal honors, and administers
    the kingdom as their servant while living austerely. The passage then shifts to
    Ráma in the forest, where fearful hermits explain that Khara, Rávaṇ’s brother,
    and other demons are harassing the hermitage, disrupting rites, extinguishing
    fires, and forcing the ascetics to leave. The hermits depart after advising Ráma,
    while Ráma remains in the grove.
  language: English
  quote_policy: summarized
