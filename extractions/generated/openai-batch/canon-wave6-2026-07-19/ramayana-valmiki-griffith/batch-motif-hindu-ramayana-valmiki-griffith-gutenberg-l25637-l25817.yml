candidate_motifs:
- id: motif:1
  label: Proxy kingship through royal object
  taxonomy_refs:
  - royal_legitimacy
  basis: The sandals are treated as Ráma’s feet, given a kingly canopy, installed
    on the royal seat, and used as the authority under which Bharat administers the
    state.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage supports the motif within this episode; it does not provide
    a broader theory of kingship beyond the sandal-regency scene.
- id: motif:2
  label: Entrusted sacred pledge to be restored
  taxonomy_refs:
  - sacred_exchange
  - return
  basis: Bharat describes the sandals as a sacred trust consigned by Ráma, guarded
    until Ráma returns, and to be restored to Ráma’s feet when his wanderings end.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The exchange involves a royal devotional token rather than a commercial
    or reciprocal bargain.
- id: motif:3
  label: Renunciant regent
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: Bharat rules only as caretaker of Ráma’s authority while living in hermit’s
    dress and matted hair and expressing a desire to restore the burden of rule.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy term sacrifice is only loosely applicable as self-denial
    or renunciation; the passage does not describe a formal sacrificial rite by Bharat.
- id: motif:4
  label: Demonic disruption of ascetic rites
  taxonomy_refs:
  - chaos
  basis: Khara and the demons frighten ascetics, obstruct holy rites, crowd altars,
    throw away implements, extinguish fires, and trample water-urns.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage presents localized disruption of a hermitage, not cosmic chaos
