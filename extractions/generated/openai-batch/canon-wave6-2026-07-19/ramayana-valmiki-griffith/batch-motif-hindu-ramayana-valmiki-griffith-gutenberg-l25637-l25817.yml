  locator: lines 25637-25817; decision to leave
  quote_or_summary: The troubled saints intend to leave the sacred wood for another
    forest rich in roots and fruit, and the sage advises Ráma to flee before Khara
    injures him.
  source_text_path: texts/public-domain/hindu/project-gutenberg/ramayana-valmiki-griffith.md
  rights_note: Public domain; supplied Project Gutenberg translation.
