canonical_text:
  quote: ''
  summary: Hanumán prepares on a mountain to seek the captive lady, prays to deities,
    declares his intent to go to Rávaṇ’s city, and leaps across the ocean. The Sea
    asks Maináka mountain to rise and offer him rest; Maináka explains old obligations
    involving Ráma’s line and the Wind, but Hanumán respectfully declines to pause.
    Heavenly beings then ask Surasá, mother of the Nágas, to take a terrifying Rákshas
    form and test or impede Hanumán.
  language: English
  quote_policy: summarized
