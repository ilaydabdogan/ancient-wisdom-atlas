canonical_text:
  quote: ''
  summary: The passage is a sequence of notes explaining ethnonyms, textual variants,
    and many divine epithets, especially those associated with the Ádityahridaya hymn.
    It identifies Yavanas with Greeks/Ionians, Śakas with Sacæ/Indo-Scythians, notes
    a Bengal recension variant involving Daradas, and glosses solar names as creator,
    nourisher, light-giver, rain-causer, world-mover, destroyer of darkness, teacher
    of Vedic knowledge, embodiment of the Hindu triad, lord of sky, source of water,
    identical with the twelve months, and giver of victory to faithful devotees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that the term Yavanas was later applied to Mohammedans but formerly
    designated Greeks; it also connects Yavan with Ion and says Macedonian or Bactrian
    Greeks are probably intended in several Sanskrit corpora.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note identifies the Śakas with the Sakai and Sacæ of classical writers and
    with Ptolemy's Indo-Scythians, locating them along western India from the Hindu
    Kosh to the mouths of the Indus around the beginning of the common era.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note says the Bengal recension has Daradas, the Dards of modern Dardistan
    along the upper Indus, instead of Varadas in the corresponding passage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note infers from the word 'yonder' that a prayer is to be repeated at the
    rising of the Sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Three notes define the first three members of the Hindu triad as creator of
    the world, pervader or preserver of the world, and bestower of blessings or destroyer
    of the world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Several notes gloss names as the War-God, lord of creatures or God of sacrifices,
    King of Gods, God of riches, God of the regions of the dead, departed ancestors,
    divine classes, the God of wind, and the God of fire.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note says the hymn called Ádityahridaya begins at the referenced verse,
    and later notes gloss the addressed figure as the son of Aditi and lord of the
    solar disk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Solar epithets are glossed as creating the world by giving life or soul, causing
    rain by rays and thereby producing corn, urging the world to action, walking through
    the sky, nourishing the world, and possessing rays or Lakshmí.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Solar epithets are glossed as giving light, causing day, having tawny horses
    or pervading space, having thousand rays, having a chariot drawn by seven horses,
    destroying darkness or ignorance, bestowing blessings or enjoyments of Paradise,
    and giving life to the lifeless world.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Solar epithets are glossed as pervading internal and external worlds, being
    identified with the Hindu triad, allaying pain, being lord of all, teaching the
    Vedas to Brahmá and others, being the source from whom Rudra springs, and being
    knowable through Aditi or eternal Brahmavidyá.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Solar epithets are glossed as destroyer of cold or stupidity, lord of the
    sky, knowable through the Upanishads, cause of heavy rain, friend to the good
    or cause of water, mover in the solar orbit, determiner of creation or possessor
    of heat, mass of rays or precious-stone ornament, and urger of all to action or
    yellow in colour.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Further solar epithets are glossed as destroyer of all, omniscient or poet,
    identified with the whole world, huge in form, giver of nourishment or red in
    colour, cause and protector of the whole world, most glorious, identical with
    the twelve months, and giver of victory over all worlds to faithful devotees.
  category: attribute
  evidence_refs:
  - ev:11
