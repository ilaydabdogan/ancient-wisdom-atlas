  quote: "“The steel to warriors is the same / As fuel to the smouldering flame.”"
  summary: Sítá warns Ráma that unprovoked killing is a desire-born sin and uses the
    tale of a hermit corrupted by keeping Indra’s sword as a caution against carrying
    weapons in the forest. Ráma begins his reply by praising her counsel and explaining
    that distressed ascetics of Daṇḍak wood asked him for protection from man-eating
    fiends.
