canonical_text:
  quote: ''
  summary: Anasúyá gives Sítá divine garments, gems, balsam, and garlands, then asks
    her to recount how Ráma won her hand. Sítá tells how King Janak found her when
    ploughing sacred ground, accepted her as his daughter after a confirming voice
    from the sky, and later arranged a Bride’s Election using a heavenly bow given
    by Varuṇ. Suitors fail to handle the bow, but Ráma strings and breaks it; after
    paternal consent is obtained, Janak gives Sítá to Ráma and Urmilá to Lakshmaṇ.
  language: English
  quote_policy: summarized
