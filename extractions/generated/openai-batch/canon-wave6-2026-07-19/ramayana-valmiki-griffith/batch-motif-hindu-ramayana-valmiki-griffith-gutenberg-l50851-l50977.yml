canonical_text:
  quote: "“A head like Ráma’s own prepare.”"
  summary: Rávaṇ, fearing coming disaster, has the magic-skilled Vidyujjihva create
    a likeness of Ráma’s severed head with bow and arrows. He presents these to Sítá
    in the grove while falsely claiming Ráma and the Vánar army have been destroyed,
    then urges her to become his. Sítá looks on the apparent head and bow, believes
    she recognizes Ráma’s features, and begins a lament blaming Kaikeyí for the exile
    and supposed death.
  language: English
  quote_policy: quoted
