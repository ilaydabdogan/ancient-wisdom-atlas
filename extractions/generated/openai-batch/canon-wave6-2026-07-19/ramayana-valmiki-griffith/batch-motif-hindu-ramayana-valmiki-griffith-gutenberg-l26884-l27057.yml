canonical_text:
  quote: ''
  summary: Ascetic hermits gather around Rāma in Śarabhanga’s hermitage, describe
    attacks by Rākṣasas, and ask him to protect them. Rāma promises to defend them
    while fulfilling his father’s command in the forest. He then travels with Sītā,
    Lakṣmaṇa, and sages to Sutīkṣṇa’s hermitage. Sutīkṣṇa welcomes Rāma, says he waited
    for him before rising to heavenly spheres, reports Indra’s visit, offers Rāma
    heavenly worlds earned by vows, and Rāma declines the gift for now while asking
    where he may dwell in the wood.
  language: English
  quote_policy: summarized
