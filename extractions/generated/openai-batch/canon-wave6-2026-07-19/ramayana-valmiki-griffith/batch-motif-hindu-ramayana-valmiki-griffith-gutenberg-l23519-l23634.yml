canonical_text:
  quote: ''
  summary: Ráma rests with Sítá on a mountain after showing her a stream. Bharat’s
    army approaches with noise and dust, frightening forest animals. Ráma asks Lakshmaṇ
    to discover the cause. Lakshmaṇ climbs a Sál tree, sees an armed force with banners,
    urges defensive preparations, identifies Bharat, and angrily interprets the approach
    as hostile usurpation, vowing to kill Bharat, Kaikeyí, and the army.
  language: English
  quote_policy: summarized
