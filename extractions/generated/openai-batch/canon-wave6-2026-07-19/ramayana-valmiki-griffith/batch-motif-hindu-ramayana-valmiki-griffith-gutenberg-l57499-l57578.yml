canonical_text:
  quote: C’est donc par la main d’ un homme, qu’il faut immoler ce méchant.
  summary: After a sacrifice, the gods led by Indra petition Brahma about Ravana,
    who oppresses divine and ascetic beings because of a boon that protects him from
    many classes of beings. Brahma identifies that humans were omitted from Ravana’s
    request. Vishnu appears, and the gods ask him to be born as the son of Dasaratha,
    divided into four portions among the king’s three wives, so that he may take human
    form and kill Ravana.
  language: French
  quote_policy: quoted
