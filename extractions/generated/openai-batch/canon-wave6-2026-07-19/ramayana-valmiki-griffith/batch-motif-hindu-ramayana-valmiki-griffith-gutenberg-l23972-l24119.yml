canonical_text:
  quote: ''
  summary: Ráma meets Bharata in the forest and questions why he has come from the
    kingdom in ascetic dress. Bharata reports King Daśaratha's death, blames Kaikeyí,
    and begs Ráma to accept the kingdom. Ráma refuses, grounding his answer in obedience
    to father and mother and in the king's command that he remain in forest exile
    while Bharata rules Ayodhyá. Bharata renews the plea by invoking elder-son succession
    and asks Ráma to perform water rites for their dead father.
  language: English
  quote_policy: summarized
