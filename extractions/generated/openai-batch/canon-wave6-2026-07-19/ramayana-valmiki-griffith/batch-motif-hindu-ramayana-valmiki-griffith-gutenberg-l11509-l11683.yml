  summary: A royal speaker addresses Kaikeyí, condemning her demand that Bharat rule
    while Ráma goes to the woods. He anticipates public disgrace, grief among the
    queens and Sítá, Ráma's obedient acceptance of exile, his own death, and the ruin
    of the royal house.
  language: English
  quote_policy: summarized
