canonical_text:
  quote: ''
  summary: The passage is an appended scholarly note discussing explanations for Rāma's
    alliance with monkeys, proposing that the Rāmāyana's monkeys may reflect both
    real monkeys and aboriginal peoples of southern India. It then comments on the
    Fall of Báli as a possible tribal kingship conflict and gives a mythological-solar
    interpretation of the Vánar host, Báli, Sugríva, and Hanuman in relation to Indra,
    Vishnu, the Sun, clouds, and the recovery of Sítá.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage discusses the possibility of Rāma concluding an alliance with
    monkeys.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Monkeys in southern India are described as numerous, intelligent, physically
    capable, organized, attached to localities, and able to travel in groups over
    mountains and across rivers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that the Hindu came to regard the monkey as a being half
    human and half divine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Rāmāyana's monkeys have been confounded with aboriginal
    people of southern India, and conjectures that aboriginal armies may have been
    accompanied by bands of monkeys.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Fall of Báli is described as involving a quarrel between an elder and
    younger brother over possession of a Rāj and Rāma's alliance with the younger
    brother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Rāma killed Báli by means contrary to fair fighting and sanctioned
    the transfer of Tárá from Báli to Sugríva.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Vánar host is described as red-haired monkeys and bears forming Rāma's
    army, while the Marutas form Indra's army.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bâlin is identified as an ancient king of the monkeys and son of Indra; Sugríva
    is identified as his younger brother, a shape-changer, and a child of the Sun
    who was helped by Rāma to take the throne.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sugríva is said to promise to find the ravished Sítá.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hanumant is described as a great monkey of reddish-golden color whose jaw
    was broken by Indra's thunderbolt after he leapt from a mountain toward the Sun
    as a child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The passage gives variant statements about Hanumant''s father: the wind,
    the elephant of the monkeys, or Keśarin.'
  category: relationship
  evidence_refs:
  - ev:6
