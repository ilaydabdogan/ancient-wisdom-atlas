comparison_claims:
- id: claim:1
  claim: The passage cautiously proposes that the Rāmāyana's monkey army may reflect
    a confusion between monkeys and aboriginal peoples of southern India, including
    the Marawars.
  claim_level: historical_contact
  target: aboriginal peoples or Marawars of southern India as possible referents for
    the Vánars
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: This is a speculative nineteenth-century ethnographic explanation reported
    in the passage; it is not established by narrative evidence alone.
- id: claim:2
  claim: 'The passage suggests that the Fall of Báli may refer to a real event among
    aboriginal tribes: a quarrel between elder and younger brothers for kingship and
    Rāma''s alliance with the younger.'
  claim_level: historical_contact
  target: possible tribal kingship conflict behind the Báli-Sugríva episode
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself uses cautious language and offers an interpretive
    historical reconstruction.
- id: claim:3
  claim: The passage compares Indra's Marutas and Rāma's red-haired monkeys and bears
    as corresponding armies attached to divine or heroic figures.
  claim_level: same_function
  target: Marutas as Indra's army compared with Vánars and bears as Rāma's army
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The functional similarity is stated by the note, but the passage does
    not provide a full argument beyond the comparison.
- id: claim:4
  claim: The passage claims that the Vedic antagonism between Indra and Vishnu is
    reproduced in the zoological form of the Bâlin-Sugríva-Rāma monkey narrative.
  claim_level: same_motif
  target: Vedic Indra-Vishnu antagonism mapped onto Bâlin, Sugríva, and Rāma
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an asserted comparative-mythological interpretation within
