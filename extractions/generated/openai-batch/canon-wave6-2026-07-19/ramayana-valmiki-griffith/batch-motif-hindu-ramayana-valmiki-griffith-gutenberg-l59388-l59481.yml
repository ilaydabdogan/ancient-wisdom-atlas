- id: claim:5
  claim: The passage compares Rāma's killing of Bâlin with Vishnu displacing Indra,
    and Sugríva's promise to find Sítá with Vishnu recovering the lost Vedas.
  claim_level: same_function
  target: Vishnu's displacement of Indra and recovery of lost Vedas
