    And dwell with Gods within the skies.
  summary: Viśvámitra undergoes long penance, receives from Brahmā the rank of royal
    saint, rejects this as insufficient, and renews his vows. The king Triśanku, desiring
    to reach heaven alive through great offerings, is refused by his priest Vaśishṭha
    and then petitions Vaśishṭha’s sons to assist his rite.
