candidate_motifs:
- id: motif:1
  label: Ominous portents before battle
  taxonomy_refs:
  - chaos
  basis: The passage lists disturbed winds, earth, hills, trees, red rain, fiery sky
    signs, animal cries, a red moon, carrion birds, and a sky like the wreck of worlds
    before the assault on Lanká.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy reference to chaos is broad; the passage presents battle
    omens rather than a full cosmogonic chaos episode.
- id: motif:2
  label: Stolen or imprisoned beloved
  taxonomy_refs:
  - stolen_beloved
  basis: Sítá is described as Ráma’s lady imprisoned by the giant, as the queen Ráma
    tracks to Lanká, and as the Maithil lady whom Rávaṇ refuses to yield.
  evidence_refs:
  - ev:5
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage assumes earlier narrative context for Sítá’s capture; within
    this excerpt she is explicitly imprisoned and withheld.
- id: motif:3
  label: Army crosses the sea by a bridge to reach the enemy island
  taxonomy_refs: []
  basis: Śuka reports that a bridge was cast across the sea and that Ráma’s legions
    passed over it before filling the giants’ island.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage reports the completed crossing but does not narrate the bridge’s
