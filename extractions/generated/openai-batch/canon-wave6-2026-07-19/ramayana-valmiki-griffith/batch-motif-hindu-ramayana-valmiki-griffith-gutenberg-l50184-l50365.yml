canonical_text:
  quote: ''
  summary: Ráma observes ominous signs before battle, orders Lakshmaṇ and the allied
    host into position, marches from the sea toward Lanká, views the city and thinks
    of the imprisoned Sítá, arrays the Vánar army, releases Śuka the spy, and Śuka
    reports to Rávaṇ that Ráma’s army has crossed the sea by bridge. Rávaṇ refuses
    to return the Maithil queen and boasts of his strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ráma embraces Lakshmaṇ and tells him to divide the host by the water’s side
    in fruitful groves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ráma describes many ominous signs, including dust-stained wind, shaken earth,
    rocking hills, falling trees, red rain, a fiery fall from the sun, animal cries,
    a hot red moon, circling birds of prey, and a fearful sky.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ráma says weapons will cover the plain with the slain and that the Vánar troops
    will close around the enemy city that day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ráma’s army marches from the sea in war array, with the earth shaken by many
    feet and with drums, horns, tambours, shouts, and battle cries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ráma looks at Lanká and thinks of Sítá, whom he says lies imprisoned by the
    giant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ráma describes Lanká as a hilltop city built by Viśvakarmá, with towers, domes,
    palaces, shrines, gardens, woods, trees, birds, bees, and Koïls.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ráma assigns battlefield positions to Angad and Níla in the centre, Rishabh
    on the right, Gandhamádan on the farther flank, himself and Lakshmaṇ as leaders,
    and Jámbaván, Susheṇ, and Vegadarśí at the rear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Vánar hosts obey the arrangement, carry uprooted trees and mountain stones
    as weapons, and press onward resolved either to die in battle or break Lanká’s
    walls and towers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ráma asks King Sugríva to free Śuka, Rávaṇ’s spy; Sugríva agrees, and Śuka
    returns to Rávaṇ trembling and afraid.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Śuka reports that the Vánars struck him, tore his plumage, bound his pinions,
    and would not listen or inquire.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Śuka reports that Ráma and Sugríva are marshalling the Vánar bands, that Ráma
