  quote: ''
  summary: Editorial notes describe the royal consecration rite, especially the intended
    and later inauguration of Ráma; summarize Ráma and Sítá’s preliminary fast, libation,
    and vigil; list ritual implements and participants for the inauguration; explain
    the need for a royal house-priest; identify the Sáras crane; note Ráma’s reference
    to his father’s wives as mothers; and explain Vritra as both Indra’s demon enemy
    and, in older Vedic interpretation, a dark cloud withholding rain.
  language: English
  quote_policy: summarized
