canonical_text:
  quote: ''
  summary: In battle before Lanka, Kumbhakarna withstands attacks, captures Sugriva,
    and continues slaughtering the Vānars. Sugriva escapes. Lakshmana fights Kumbhakarna
    and directs him toward Rama. Rama and Kumbhakarna exchange challenges; Rama then
    uses powerful named missiles to sever Kumbhakarna’s arms, legs, and head. The
    fallen head and body destroy structures and disturb the sea.
  language: English
  quote_policy: summarized
