canonical_text:
  quote: ''
  summary: Sumantra recounts an old prophecy that Daśaratha will give his daughter
    Śántá to Lomapád, that Śántá will marry Rishyaśring, and that Rishyaśring will
    perform a sacrifice by which Daśaratha will obtain sons. Daśaratha, with Vaśishṭha’s
    consent, visits Lomapád, requests Śántá and Rishyaśring for the rite, and returns
    to Ayodhyá with them amid public celebration.
  language: English
  quote_policy: summarized
