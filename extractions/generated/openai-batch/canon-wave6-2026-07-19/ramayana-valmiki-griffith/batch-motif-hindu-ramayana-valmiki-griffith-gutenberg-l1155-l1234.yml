canonical_text:
  quote: ''
  summary: Brahmá visits Válmíki’s hermitage. Válmíki receives him reverently with
    water, offerings, and a seat, yet remains absorbed in grief over a curlew slain
    by a fowler. Brahmá declares Válmíki’s spontaneous grief-utterance to be verse,
    commands him to compose the truthful life and deeds of Ráma as told by Nárad,
    promises the Rámáyan’s endurance and Válmíki’s ascent to higher spheres, then
    vanishes. Válmíki’s pupils repeat the verse as a śloke, and Válmíki uses that
    meter to tell Ráma’s deeds.
  language: English
  quote_policy: summarized
