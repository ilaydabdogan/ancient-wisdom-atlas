canonical_text:
  quote: ''
  summary: Hanumán counsels Tárá about former deeds, mortality, funeral duties, and
    Angad’s future. Tárá declines rule and chooses to remain by Bāli. The dying Bāli
    addresses Sugríva, attributes their conflict to Fate, yields the realm, asks protection
    for Angad, praises Tárá’s omen-reading, urges fidelity to the son of Raghu, gives
    Sugríva a celestial golden chain, and instructs Angad in conduct toward Sugríva.
  language: English
  quote_policy: summarized
