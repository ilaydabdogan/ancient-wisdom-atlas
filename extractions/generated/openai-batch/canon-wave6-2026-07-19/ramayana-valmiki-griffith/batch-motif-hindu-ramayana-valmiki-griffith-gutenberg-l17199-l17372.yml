canonical_text:
  quote: ''
  summary: Ráma declines Guha’s gifts, asking only that the horses be fed, and states
    that grass, bark, hide, roots, and fruit are appropriate to his forest life. At
    night Ráma performs evening rites, drinks water brought by Lakshmaṇ, and rests
    with Sítá beside the river while Lakshmaṇ, Guha, and the charioteer keep watch.
    Guha offers to guard Ráma so Lakshmaṇ may sleep, but Lakshmaṇ refuses, lamenting
    Ráma’s hardship, Daśaratha’s likely grief and death, and the sorrow of Ayodhyá.
    At dawn Ráma calls for crossing the Gangá/Jáhnaví, and Guha orders a manned boat
    prepared for the pilgrims.
  language: English
  quote_policy: summarized
