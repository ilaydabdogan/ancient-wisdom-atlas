canonical_text:
  quote: ''
  summary: Hanumán and the Vánar chiefs return to Praśravaṇ’s hill, bow before Ráma
    and the Vánar king, and Hanumán gives Ráma the gem from Sítá’s brow. Hanumán reports
    that he crossed the sea, found Sítá guarded and distressed on the giants’ island,
    consoled her, and received tokens and messages from her, including a warning that
    she can live only one more month. Ráma presses the jewel to his breast, weeps,
    recalls its wedding and divine associations, and asks Hanumán to guide him to
    Sítá and repeat her words.
  language: English
  quote_policy: summarized
