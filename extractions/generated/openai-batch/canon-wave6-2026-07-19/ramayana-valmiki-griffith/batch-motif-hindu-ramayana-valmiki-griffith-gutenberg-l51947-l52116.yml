canonical_text:
  quote: "“He bound them with the serpent noose, / The magic bond which none might
    loose.”"
  summary: At night the battle continues in confusion. Rákshasas and Vánaras fight
    violently; Rāma kills six attacking giants and many chieftains with arrows. Angad
    defeats Indrajit’s chariot force, after which Indrajit vanishes. Concealed by
    magic mist, Indrajit attacks Rāma and Lakṣmaṇa, binds them with a serpent noose,
    and boasts that they are slain. Vānara leaders lament while Vibhishaṇ perceives
    the hidden Indrajit.
  language: English
  quote_policy: quoted
