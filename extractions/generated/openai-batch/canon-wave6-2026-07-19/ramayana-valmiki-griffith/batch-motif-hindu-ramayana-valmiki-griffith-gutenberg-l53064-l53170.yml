canonical_text:
  quote: ''
  summary: Rávaṇ and Lakshmaṇ exchange arrows; Rávaṇ uses a Brahmá-bestowed weapon,
    but Lakshmaṇ recovers, breaks Rávaṇ’s bow, and wounds him. Rávaṇ cannot lift Lakshmaṇ,
    and Hanumán strikes Rávaṇ down and carries Lakshmaṇ to Ráma. Hanumán then bears
    Ráma into battle. Ráma destroys Rávaṇ’s chariot, wounds him, breaks his crown,
    and spares him for the night, instructing him to return armed the next day.
  language: English
  quote_policy: summarized
