canonical_text:
  quote: ''
  summary: Bharadvāja blesses Rāma, Lakṣmaṇ, and Sītā and directs them toward the
    meeting of the Yamunā/Kālindī and Gangā, across the river, to the holy Śyāma fig-tree,
    and onward toward Chitrakūṭa. The travelers build a raft, cross the Kālindī, and
    Sītā prays to the river goddess with promised offerings. After landing, Sītā venerates
    the Śyāma tree. The party proceeds through forest, gathers plants and food, rests
    by the river, and sets out again at dawn.
  language: English
  quote_policy: summarized
