canonical_text:
  quote: ''
  summary: 'A self-restrained hermit invokes deities, after which Bharata’s troops
    witness a miraculous reception: celestial sounds and flowers, leveled ground,
    groves, streams, mansions, a jewel-bright palace, enchanted rivers of milk and
    curds, celestial performers, animated trees, abundant food and drink, clean garments,
    and inexhaustible supplies. Bharata honors Ráma at the royal throne and sits as
    a councillor. The army revels in delight and calls the place heaven.'
  language: English
  quote_policy: summarized
