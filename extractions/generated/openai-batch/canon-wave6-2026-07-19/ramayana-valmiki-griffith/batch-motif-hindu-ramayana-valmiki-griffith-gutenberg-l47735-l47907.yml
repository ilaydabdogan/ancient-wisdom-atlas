canonical_text:
  quote: ''
  summary: Rávaṇ rejects killing an envoy but orders Hanumán's tail burned as punishment.
    Demons bind, oil, ignite, and parade him through Lanká. Sítá prays to fire to
    spare him, and the fire becomes harmless to him. Hanumán shrinks, escapes, kills
    guards, then uses his burning tail to set Lanká's palaces aflame while sparing
    Vibhishaṇ's house. Afterward he fears Sítá may have died in the fire, reasons
    that her virtue and the fire's mercy protect her, and heavenly voices confirm
    that she is unharmed.
  language: English
  quote_policy: summarized
