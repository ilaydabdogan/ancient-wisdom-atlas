canonical_text:
  quote: ''
  summary: Sugriva, informed by Hanuman, tells Rama that Sita was abducted by Ravana
    and that she dropped her robe and anklets while being carried through the sky.
    Sugriva retrieves the tokens from a mountain cavern and gives them to Rama, who
    grieves over them. Lakshmana recognizes the anklets. Rama asks where Ravana went
    and vows vengeance. Sugriva says he does not know Ravana's dwelling but promises
    help, counsels Rama against despair, and soothes him until he regains composure.
  language: English
  quote_policy: summarized
