canonical_text:
  quote: ''
  summary: A saintly hermit blesses the king, ministers, and town. The king receives
    the saint with a guest-gift, bows, and asks pardon for having taken the saint's
    son away. The Brahman reassures the king of his favor. The saint is honored in
    a public procession, Śántá is presented as the son's bride, the saint embraces
    her, she bows with joined palms, and the saint performs a rite for his son before
    departing with him to the wood.
  language: English
  quote_policy: summarized
