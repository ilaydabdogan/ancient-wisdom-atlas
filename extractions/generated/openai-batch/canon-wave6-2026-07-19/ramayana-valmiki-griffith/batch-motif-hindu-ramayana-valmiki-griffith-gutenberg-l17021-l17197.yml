canonical_text:
  quote: ''
  summary: Ráma travels through Kośala, hearing villagers condemn the king and Kaikeyí
    for his banishment. He crosses several rivers, looks back to Ayodhyá, bids farewell
    to the city and its gods, and urges the mourning people to return. Passing beyond
    Kośala, he halts near the Gangá beneath an Ingudí tree. Guha, the Nisháda chief
    and Ráma’s friend, comes to greet him, embraces and reveres him, and offers him
    kingdom, food, lodging, and provisions.
  language: English
  quote_policy: summarized
