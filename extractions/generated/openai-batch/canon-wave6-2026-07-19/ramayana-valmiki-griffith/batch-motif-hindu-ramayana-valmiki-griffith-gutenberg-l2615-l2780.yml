canonical_text:
  quote: ''
  summary: After the wandering horse returns at the end of a year, Daśaratha’s rite
    begins on the northern bank of the Sarjú under Rishyaśring and Brāhman priests.
    The passage describes scripturally ordered offerings, bathings, hymns to Indra
    and the gods, public feeding and largesse, debate among learned Brāhmans, erection
    of gilded sacrificial posts and an eagle-shaped altar, binding of victims, ritual
    slaying of the steed by Queen Kauśalyā for the gaining of a son, and the offering
    of the horse’s parts into the sacred flame.
  language: English
  quote_policy: summarized
