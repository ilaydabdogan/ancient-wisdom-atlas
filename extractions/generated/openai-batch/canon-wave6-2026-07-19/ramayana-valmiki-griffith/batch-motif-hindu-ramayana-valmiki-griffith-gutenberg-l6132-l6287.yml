- id: motif:5
  label: Treasures and beings emerge from churned waters
  taxonomy_refs:
  - sacred_birth
  basis: A healing sage, Apsarases born of foam and water, Surā, a steed, a gem, and
    Soma rise or are freed from the sea during the churning.
  evidence_refs:
