canonical_text:
  quote: ''
  summary: Rāma, Lakṣmaṇ, and the sage cross the river and reach Viśālā, where Rāma
    asks for the city’s ancient tale. The sage recounts how the rival children of
    Diti and Aditi, sons of Kaśyap, sought immortality by churning the milky sea for
    Amrit. They used the serpent king Vāsuki as the rope and Mount Mandar as the churning
    pole. Poison arose and Śiva drank it after the gods sought help. When Mandar sank,
    Viṣṇu became a tortoise to support it and joined the churning. After prolonged
    churning, beings and treasures emerged from the ocean, including a healing sage,
    Apsarases, Surā, Uchchaihśravas, Kaustubha, and Soma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rāma and Lakṣmaṇ listen to the sage after hearing the story of heavenly Gangā,
    and Rāma says the night passed like a moment while he reflected on the tale.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After morning rites, Rāma asks to cross the three-pathed river in a boat prepared
    on the shore for the hermits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage approves, places the hermit band in the boat, crosses to the further
    strand, and proceeds with the princes to Viśālā.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rāma asks his holy guide what royal race rules Viśālā, and the sage begins
    an ancient account described as Indra’s wondrous deed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The children of Diti and Aditi are described as rival broods, sons of Kaśyap,
    born of sister mothers and competing in jealous pride.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rival bands plan to become immortal and youthful by churning the milky
    sea to release the life-bestowing drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: They seize Vāsuki, the serpent king, as the churning string and Mount Mandar
    as the pole.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: As the serpent is drawn back and forth for a thousand seasons, venom issues
    from its tortured heads and becomes a poison compared to a mighty flame.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The frightened gods go to Śankar/Rudra and pray for rescue from the poison.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Viṣṇu appears and tells Śiva that the first treasure brought up from the troubled
    ocean should be his first fruits; Śiva drinks the poisoned flood.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When Mount Mandar whirls and pierces down into the depths, gods and bards
    appeal to Viṣṇu for help.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Viṣṇu takes the form of a tortoise, lies in the ocean bed, supports the mountain
    on his back, grasps its summit, and joins the churning.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: After a thousand years, a gentle healing sage with staff and can rises from
    the ocean.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sixty million Apsarases arise from the foaming waters and are described as
    born of foam and water.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Surā, Varuṇ’s maiden child, rises from the sea; Diti’s sons reject her, while
