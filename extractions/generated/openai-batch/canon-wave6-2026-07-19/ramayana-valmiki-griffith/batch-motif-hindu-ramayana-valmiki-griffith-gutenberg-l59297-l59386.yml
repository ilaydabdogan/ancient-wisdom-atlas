  summary: Additional notes discuss Urvasî as a dawn figure and her conditional union
    with Purûravas; explain the term Vánar as monkeys or woodland fighters in Ráma’s
    army; compare a description of faultless speech with Chaucer; and summarize a
    Hindu literal interpretation of Ráma as Vishnu incarnate, aided by divine-progeny
    monkeys against Rávana.
  language: English
  quote_policy: summarized
