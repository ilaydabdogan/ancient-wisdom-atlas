canonical_text:
  quote: ''
  summary: Sugríva and Lakshmaṇ leave Kishkindhá in a royal Vánar procession and come
    to Ráma’s mountain dwelling. Sugríva bows to Ráma, who embraces him, counsels
    him on proper kingship, and asks him to deliberate with his nobles in support
    of Ráma’s enterprise. Sugríva replies that Ráma and Lakshmaṇ restored his lost
    power and that Vánar chiefs have summoned vast armies of monkeys, apes, and bears,
    including shape-changing beings of divine or Gandharva descent, to fight the Rákshasas
    and restore Ráma’s consort.
  language: English
  quote_policy: summarized
