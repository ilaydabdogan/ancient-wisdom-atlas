canonical_text:
  quote: ''
  summary: A note argues against treating the Rámáyan as purely allegorical. It mentions
    Sítá's birth from a furrow opened by King Janak, compares such epic origins with
    Helen and Æneas, reports and rejects a solar allegory proposed by Father Paolino,
    describes the poem's broad performance tradition, and concludes that Ráma's war
    against the Rákshases should be treated as historical in substance with mythic
    elements intermingled.
  language: English
  quote_policy: summarized
