canonical_text:
  quote: ''
  summary: Sítá and the princes give wealth to Bráhmans, take adorned weapons, and
    go toward the aged king. A grieving city crowd watches Ráma walking without royal
    shade, with Lakshmaṇ and Sítá beside him, praises his virtue, laments Sítá’s exposure,
    condemns the banishment, and vows to follow him to the forest. Ráma remains firm
    and approaches the palace, where he sends Sumantra to announce him. Sumantra finds
    the grieving king, reports Ráma’s readiness to depart for the wilds, and the king
    orders his wives and ladies to gather before Ráma is brought in.
  language: English
  quote_policy: summarized
