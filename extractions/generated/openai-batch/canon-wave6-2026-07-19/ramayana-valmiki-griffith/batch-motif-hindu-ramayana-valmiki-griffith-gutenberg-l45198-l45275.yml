canonical_text:
  quote: ''
  summary: After the guardian goddess has been subdued, the Vánar chief Hanumán moves
    through a richly ornamented city, hearing music, praise, prayers, and seeing religious
    figures, envoys, armed warriors, and monstrous guards. He reaches Rávaṇ’s guarded
    gate and palace on a mountain crest, with ramparts and lotus-covered moats, and
    passes through unhindered. A bracketed translator note omits Canto V as likely
    later interpolation and gives a short sample describing moonlight over the sea
    seen by the Vánar chieftain.
  language: English
  quote_policy: summarized
