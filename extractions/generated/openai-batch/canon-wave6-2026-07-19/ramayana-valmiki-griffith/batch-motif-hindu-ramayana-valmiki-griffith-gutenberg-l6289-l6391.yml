canonical_text:
  quote: ''
  summary: A lotus-borne maiden identified with beauty and fortune emerges and joins
    Vishṇu during the churning of the main. The Amrit appears, causing war between
    gods and Titans; Vishṇu removes it by illusion, the Titans are defeated, and Indra
    gains rule over the three worlds. Diti, grieving her slain sons, asks Kaśyap for
    a son who can kill Indra; Kaśyap grants this conditionally upon a thousand years
    of purity. Diti begins vows, and Indra ministers to her as only ten years remain.
  language: English
  quote_policy: summarized
