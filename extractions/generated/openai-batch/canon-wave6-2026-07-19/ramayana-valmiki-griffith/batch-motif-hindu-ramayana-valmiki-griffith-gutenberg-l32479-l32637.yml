canonical_text:
  quote: ''
  summary: Lakshmaṇ leaves Sītā and goes toward Rāma. Rāvaṇ, seeing the opportunity,
    approaches Sītā in the guise of a mendicant or Brāhman. Nature reacts ominously
    as he nears. He praises and questions Sītā, urges that she should not dwell in
    the dangerous forest, and presents himself as a holy guest. Deceived by his appearance,
    Sītā offers hospitality. Rāvaṇ secretly longs to steal her away, while Sītā watches
    anxiously for Rāma and Lakshmaṇ to return.
  language: English
  quote_policy: summarized
