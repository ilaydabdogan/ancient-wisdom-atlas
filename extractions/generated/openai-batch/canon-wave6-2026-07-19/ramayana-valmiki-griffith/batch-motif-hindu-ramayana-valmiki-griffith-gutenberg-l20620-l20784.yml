canonical_text:
  quote: ''
  summary: Bharat rebukes his mother Kaikeyi after learning of Daśaratha’s death and
    Rāma’s exile. He blames her for destroying the royal house, rejects the throne,
    cites the Ikshvāku custom that the eldest son is anointed king, and vows to go
    to the forest to bring Rāma back and serve him. He further condemns Kaikeyi, predicts
    disgrace and hell for her act, and introduces an ancient legend of Surabhī, the
    god-loved cow, weeping over her suffering children while Indra asks the cause
    of her grief.
  language: English
  quote_policy: summarized
