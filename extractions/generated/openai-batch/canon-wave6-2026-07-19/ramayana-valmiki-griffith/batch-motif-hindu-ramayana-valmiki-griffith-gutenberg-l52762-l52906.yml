canonical_text:
  quote: ''
  summary: A Vánar champion, Angad, fights and kills a giant leader after an escalating
    duel involving arrows, trees, rocks, mace, fists, swords, and shields. A bracketed
    editorial summary notes similar sorties by Akampan and Prahasta and their deaths
    at the hands of Vánar champions. Rávaṇ then reacts to the death of a chief, resolves
    to take the field himself, marches out with his army, and Vibhishaṇ identifies
    prominent Rākshasa warriors to Ráma.
  language: English
  quote_policy: summarized
