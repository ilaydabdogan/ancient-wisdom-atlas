canonical_text:
  quote: ''
  summary: Ráma and Rávaṇ continue a chariot battle whose missiles disturb the cosmos.
    Ráma repeatedly severs Rávaṇ's heads, but new heads appear. Mátali tells Ráma
    to use a divine arrow associated with Agastya, Brahmá, Indra, wind, sun, fire,
    ether, and mountains. Ráma shoots it into Rávaṇ's chest and heart, killing him.
    The Rákshasas flee, the Vánars and celestial beings acclaim Ráma, and blossoms
    fall. Vibhishaṇ laments his brother Rávaṇ with royal, cosmic, fiery, and tree
    imagery. Ráma instructs him to perform funeral rites and says enmity ends with
    death.
  language: English
  quote_policy: summarized
