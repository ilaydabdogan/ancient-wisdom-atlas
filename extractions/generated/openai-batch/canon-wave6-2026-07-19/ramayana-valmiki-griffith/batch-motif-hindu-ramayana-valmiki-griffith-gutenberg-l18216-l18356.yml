canonical_text:
  quote: ''
  summary: Ráma, Lakshmaṇ, and Sítá rise, draw water, perform morning rites, and continue
    toward Chitrakúṭa. Ráma praises the flowering, fruiting, and animal-filled woodland.
    The three ask Válmíki for leave to stay, and he welcomes them. Ráma directs Lakshmaṇ
    to build a leafy hut near the mountain and water, then to hunt and prepare an
    antelope for a required sacrifice. Ráma performs rites and offerings to deities
    and shades, consecrates the new dwelling, and the three enter the cottage; Ráma’s
    grief over exile is eased in the forest setting.
  language: English
  quote_policy: summarized
