canonical_text:
  quote: ''
  summary: 'Ráma explains to Bharata that their father was bound by promises to Queen
    Kaikeyí: Ráma must live in the forest for fourteen years and Bharata must rule.
    Ráma urges Bharata to preserve their father''s word, return to Ayodhyá, rule under
    the royal umbrella, and release their father from postmortem suffering through
    filial duty and ancestral rites. Ráma accepts the forest and Daṇḍak wood with
    Lakshmaṇ and Sítá. Jáváli then argues against Ráma''s renunciation, denying lasting
    kinship bonds, the efficacy of funeral offerings, and future life, and urging
    Ráma to take the throne and enjoy present royal bliss.'
  language: English
  quote_policy: summarized
