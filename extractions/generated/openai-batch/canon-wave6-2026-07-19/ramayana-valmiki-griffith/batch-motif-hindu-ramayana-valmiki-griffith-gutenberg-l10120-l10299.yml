canonical_text:
  quote: ''
  summary: The monarch dismisses the crowd, consults his advisers, summons Ráma, and
    tells him he will be consecrated as Regent Heir the next day under Pushya. He
    cites age, fulfilled duties, popular choice, and ominous portents as reasons for
    haste. He instructs Ráma and Sítá to fast, keep ritual restraint, lie on holy
    grass, and be guarded. Ráma reports the decree to Kauśalyá, who is praying, receives
    her blessing, and then tells Lakshmaṇ to share rule as his second self.
  language: English
  quote_policy: summarized
