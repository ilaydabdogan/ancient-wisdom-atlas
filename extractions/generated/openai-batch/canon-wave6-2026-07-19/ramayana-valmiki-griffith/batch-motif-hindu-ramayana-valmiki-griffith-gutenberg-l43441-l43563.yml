canonical_text:
  quote: "“At length a mighty cave they spied / That opened in a mountain’s side.”"
  summary: A Vánar search party led by Hanumán, with Angad and Tára present, searches
    the mountains and enters a dark cave to relieve thirst. After wandering hungry
    and exhausted, they discover a radiant inner grove with golden trees, waters,
    precious dwellings, and a holy woman. Hanumán asks who she is and who owns the
    place. The woman, Svayamprabhá, explains that the Dánava artificer Maya created
    the magical golden wood after receiving knowledge from Brahmá, that Indra killed
    Maya because of Hemá, and that she guards the abode for Hemá. She asks why the
    strangers entered and offers fruit and water.
  language: English
  quote_policy: quoted
