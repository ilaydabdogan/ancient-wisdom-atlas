canonical_text:
  quote: ''
  summary: The passage narrates a sequence of battlefield combats. Angad is attacked
    by Devántak, Triśirás, and Mahodar and fights with trees, stones, and a tusk.
    Hanúmán and Níla intervene, killing Devántak, Mahodar, Triśirás, and Mahápárśva.
    Atikáya then appears in a splendid chariot, the Vánars flee to Ráma, Vibhishaṇ
    identifies him as Rávaṇ’s son, and Atikáya challenges the bravest opponent to
    fight him.
  language: English
  quote_policy: summarized
