canonical_text:
  quote: ''
  summary: In a war council at Lanká, a younger warrior boasts that he will kill Ráma,
    Lakshmaṇ, Sugríva, and Hanúmán. Mahodar rebukes the boast, warns of Ráma’s strength,
    and proposes a deceitful plan to convince the captive lady that Ráma and his brother
    are dead so that Rávaṇ may win her submission. Kumbhakarṇa rejects this counsel
    and offers to fight openly. Rávaṇ praises and commissions him; Kumbhakarṇa arms
    himself, leaves the city with a giant retinue, terrifies the Vánars, and Angad
    tries to rally the fleeing forces.
  language: English
  quote_policy: summarized
