  quote: ''
  summary: A sorrowing king reacts to earlier advice with despair. Sumantra observes
    the king’s tears and shows reverence. Kaikeyi, described as skilled in plotting,
    tells Sumantra that the king is sleepless from joyful thoughts of Rama and orders
    him to bring Rama quickly. Sumantra asks for the king’s own command; the king
    confirms that Rama should be brought. Sumantra assumes a consecration is intended
    and leaves the chamber, passing guards and a gathered crowd.
