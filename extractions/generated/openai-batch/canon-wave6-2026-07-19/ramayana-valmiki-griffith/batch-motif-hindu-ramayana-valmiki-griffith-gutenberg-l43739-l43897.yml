canonical_text:
  quote: ''
  summary: Hanumán observes Angad’s growing royal capacity and counsels him not to
    remain in the cave but to return submissively to Sugríva. Angad rejects Sugríva
    as unjust, fears imprisonment or death, and chooses to fast to death. The Vánar
    chiefs sit on holy Darbha grass and vow to die with him. Sampáti, the vulture
    king and brother of Jaṭáyus, arrives on Vindhya’s slope and sees the doomed Vánars
    as a feast brought by Fate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hanumán notices Angad’s royal and martial qualities, his growing maturity,
    and his tendency to heed Tárá rather than Sugríva’s command.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hanumán tells Angad that the Vánars will remain faithful to Sugríva and will
    not abandon their wives and children for Angad’s new claim.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hanumán warns that if Angad dwells in the cave, Lakshmaṇ’s arrows can rend
    the cave walls, cleave the mountain, and pierce Angad’s heart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hanumán urges Angad to seek Sugríva’s court, saying Sugríva will share the
    kingdom with the royal heir and will not harm him; he appeals to Angad as his
    mother’s only child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Angad accuses Sugríva of taking his living brother’s wife, barring the portal
    during his brother’s fight, and neglecting his obligation to Ráma until Lakshmaṇ
    threatened him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Angad fears that Sugríva will treat him as a household foe, kill him, or confine
    him in prison, so he says it is better to fast and die in place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Angad instructs the Vánars to go home, bow to Sugríva, greet the sons of Raghu
    and Rumá, and comfort his mother Tárá.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Angad lies on sacred Darbha grass and weeps; the Vánar chiefs weep, sit on
    holy grass laid southward while facing east, and vow to die with him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sampáti arrives where the sorrowing Vánars sit on the slope of Vindhya’s hill
    and, delighted, says Fate has brought him a feast of Vánars doomed to die.
  category: action
  evidence_refs:
  - ev:9
