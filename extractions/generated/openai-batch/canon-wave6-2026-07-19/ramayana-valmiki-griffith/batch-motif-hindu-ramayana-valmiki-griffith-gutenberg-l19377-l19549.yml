canonical_text:
  quote: ''
  summary: An aged blind hermit father laments his slain son, describes dependence
    on him, invokes Yama and heavenly destinations, and performs funerary rites with
    his wife. The son's spirit appears in celestial form, speaks of a heavenly home
    won by filial merit, and ascends in a bright car with Indra. The bereaved father
    curses the king who unwittingly killed the son, saying the king will likewise
    die grieving for a son. The king later recognizes the curse as fulfilled as he
    grieves Ráma's absence, loses his senses, and feels Death's messengers near.
  language: English
  quote_policy: summarized
