canonical_text:
  quote: ''
  summary: Márícha counsels Rávaṇ not to seize Sítá, warning that Ráma is virtuous,
    powerful, and capable of destroying the giants and Lanká. He urges deliberation
    with counselors, recalls Ráma’s dutiful departure to Daṇḍak wood, and recounts
    his own former marauding and the earlier request of the sage Viśvámitra that Daśaratha
    send Ráma to defeat him.
  language: English
  quote_policy: summarized
