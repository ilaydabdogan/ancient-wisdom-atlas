canonical_text:
  quote: ''
  summary: Ráma and Lakshmaṇ inspect signs of Sítá’s disappearance, including footprints,
    dropped ornaments, broken weapons, a ruined chariot, and a dead driver. Ráma fears
    that shapeshifting fiends have seized, killed, eaten, or stolen Sítá. In grief
    and rage he vows to destroy fiends and even devastate the triple world unless
    the gods restore her. He arms himself with his bow and is compared to Rudra preparing
    to destroy Tripur.
  language: English
