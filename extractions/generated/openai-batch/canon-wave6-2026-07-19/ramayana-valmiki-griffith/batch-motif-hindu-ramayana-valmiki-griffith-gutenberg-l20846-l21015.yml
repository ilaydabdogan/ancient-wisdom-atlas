canonical_text:
  quote: ''
  summary: Bharat rejects any desire for the throne, denies prior knowledge of Ráma’s
    exile, and is reproached by the grieving Kauśalyá. To prove his innocence he falls
    at her feet and swears severe oaths calling down social, ritual, and afterlife
    punishments upon whoever consented to Ráma’s banishment. Kauśalyá accepts that
    Bharat and Lakshmaṇ remain true to virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bharat rises after lying down, looks tearfully and angrily at Kaikeyí, and
    reproaches her before lords and ministers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bharat says he has no desire for kingly power, no longer obeys his mother,
    and knew nothing of Daśaratha’s intended consecration, Ráma’s exile, or Sítá and
    Lakshmaṇ going into banishment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kauśalyá hears Bharat, tells Sumitrá she wishes to see him, and comes to his
    presence in distressed condition.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bharat and Śatrughna approach Kauśalyá; when she is fallen senseless on the
    ground, they embrace her and weep.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Kauśalyá says the realm is now Bharat’s and accuses Kaikeyí’s ruthless hand
    of winning the empire and making Ráma flee dressed like a lonely devotee.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kauśalyá says she would go to the distant wood, with sacred fire as guide
    and Sumitrá by her side, to seek the son of Raghu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kauśalyá describes the land as rich in rice, golden corn, wealth, cars, elephants,
    steeds, and gems, and says Kaikeyí has made Bharat lord of these.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kauśalyá’s taunts wound Bharat; he falls prone at her feet, laments, regains
    sense and strength, and joins his hands supplicantly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bharat tells Kauśalyá that he knew nothing, is free from blame, and loved
    Ráma.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bharat invokes curses on whoever consented to Ráma’s exile, including corruption
    of scriptural understanding, striking a sleeping cow, wronging a good king, neglecting
    royal protection, and denying a promised ritual gift.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bharat’s oaths also include battle cowardice, perverting the Veda, betraying
    confidential speech, lacking spouse and child, and wandering in rags with a skull
    while begging bread.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Further curses include neglecting holy rites, desiring a master’s wife, kindling
    destructive flame, betraying a friend, failing to revere God, ancestors, and parents,
    deceiving the weak and suppliants, neglecting a lawful wife, and poisoning flowing
    water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Bharat’s words undeceive Kauśalyá; she says his oaths increase her grief,
    but affirms that Bharat’s soul and Lakshmaṇ’s remain true to virtue and that Bharat
    will gain the mansions of the good.
  category: sequence
  evidence_refs:
  - ev:8
