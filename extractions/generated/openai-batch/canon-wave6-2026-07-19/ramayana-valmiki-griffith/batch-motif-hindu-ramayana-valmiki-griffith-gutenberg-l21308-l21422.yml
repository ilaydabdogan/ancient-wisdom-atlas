canonical_text:
  quote: ''
  summary: Śatrughna, enraged, drags a hump-backed maid until Bharat restrains him
    by invoking the rule against killing a woman and Ráma’s expected disapproval.
    The maid is released and comforted by Kaikeyí. Later, after the king’s death and
    while Ráma and Lakshmaṇ are in the forest, the peers ask Bharat to accept the
    hereditary throne. Bharat refuses, declares that the eldest son Ráma is the rightful
    king, and orders preparations to go to the forest with consecration objects to
    bring Ráma back and anoint him.
  language: English
  quote_policy: summarized
