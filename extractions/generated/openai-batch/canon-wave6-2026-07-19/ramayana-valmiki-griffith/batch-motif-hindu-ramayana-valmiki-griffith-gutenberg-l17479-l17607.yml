canonical_text:
  quote: ''
  summary: Sumantra laments that he must return to Ayodhyá without Ráma and asks to
    share the exile, even threatening to burn himself and his chariot if abandoned.
    Ráma insists that Sumantra return so Kaikeyí will know the banishment is real
    and so Bharata may reign without suspicion. Ráma then tells Guha that he must
    live as a recluse according to ascetic rule. Guha brings fig-tree juice, and Ráma
    and Lakshmaṇ tie their hair in matted coils, wearing bark garments like forest
    hermits. Ráma counsels Guha on the difficulty of royal guardianship.
  language: English
  quote_policy: summarized
