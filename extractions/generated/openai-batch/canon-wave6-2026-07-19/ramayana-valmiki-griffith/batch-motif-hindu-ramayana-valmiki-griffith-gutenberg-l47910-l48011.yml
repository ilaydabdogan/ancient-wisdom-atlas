canonical_text:
  quote: ''
  summary: Hanuman sees the burned waste, consoles the queen, prepares to depart,
    ascends Mount Arishta, leaps from its peak, and flies back through the sky. His
    leap shakes the mountain and frightens creatures and supernatural beings. The
    waiting Vānara host recognizes his triumphant shout; Jambavan announces his successful
    return. Hanuman is welcomed, reports that he has seen and addressed the Maithil
    queen, and is praised by Angad.
  language: English
  quote_policy: summarized
