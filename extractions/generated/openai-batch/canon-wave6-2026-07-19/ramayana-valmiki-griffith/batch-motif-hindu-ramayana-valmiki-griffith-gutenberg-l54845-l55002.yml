canonical_text:
  quote: ''
  summary: Rávaṇ, enraged by grief, recalls the boon and weapons granted through Brahmā
    after long penance and vows vengeance. He goes to the captive Sītā in the grove
    and raises his sword, but an unnamed Rākshas lord restrains him by warning against
    the guilt of killing a woman. Later, amid the lamentation of Lankā, Rávaṇ orders
    his chariot, bow, and host prepared for battle. He rides out with warriors, but
    ominous signs appear at the gate. Ignoring them, he enters the field, kills many
    Vānars, and then turns toward Rāma, describing Rāma as a tree whose fruit is Sītā
    and whose branches are the Vānar lords.
  language: English
  quote_policy: summarized
