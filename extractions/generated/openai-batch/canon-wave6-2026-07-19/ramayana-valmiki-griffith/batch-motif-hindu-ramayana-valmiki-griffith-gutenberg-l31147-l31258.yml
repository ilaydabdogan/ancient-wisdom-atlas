canonical_text:
  quote: "“In semblance of a golden deer / Adorned with silver spots appear.”"
  summary: Rávaṇ tells Márícha that Rāma has killed the Janasthān giant host and its
    commanders. He blames Rāma for mutilating his sister and declares his plan to
    abduct Sītā. He asks Márícha to appear as a golden deer so that Sītā will send
    Rāma and Lakṣmaṇ away, leaving her undefended. Márícha reacts with terror and
    begins to advise Rávaṇ against the plan.
  language: English
