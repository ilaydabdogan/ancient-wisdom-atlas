canonical_text:
  quote: ''
  summary: Sáraṇ points out to Rávaṇ the leaders of the Vánar and allied host assembled
    near Lanká. He identifies chiefs including Níla, Angad, Nala, Śweta, Kumud, Chaṇḍa,
    Rambha, Śarabha, Panas, Vinata, Krathan, Gavaya, Hara, Dhúmra, Jámbaván, Pramáthí,
    Gaja, Gaváksha, and others, describing their strength, origins, retinues, battle-readiness,
    and intent to fight for Ráma. Nala is noted as the builder of the bridge across
    the sea, Angad as Sugríva’s anointed heir, and Jámbaván as one who aided Indra
    and received boons.
  language: English
  quote_policy: summarized
