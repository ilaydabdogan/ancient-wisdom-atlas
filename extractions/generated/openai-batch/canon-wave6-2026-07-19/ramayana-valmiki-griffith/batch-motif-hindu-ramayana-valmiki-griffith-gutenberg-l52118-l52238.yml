canonical_text:
  quote: |-
    This is not death: each prince will break
    The spell that holds him, and awake;
  summary: Ráma and Lakshmaṇ lie motionless on the battlefield as if dead, but Vibhishaṇ
    tells Sugríva they are spell-bound and will revive. Indrajít reports their fall
    to Rávaṇ, who rejoices and orders Sítá taken by aerial car to see the fallen brothers,
    hoping her heart will turn toward him. Sítá sees the bloody battlefield and begins
    to lament.
  language: English
  quote_policy: quoted
