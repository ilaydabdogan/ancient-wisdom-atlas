canonical_text:
  quote: When kings a daughter’s hand bestow, / ’Tis right their line and fame to
    show.
  summary: King Janak explains that a royal lineage should be declared before a daughter
    is given in marriage. He recites his ancestry from Nimi to his father Hraśvaromá,
    describes his own accession and care for his younger brother Kuśadhwaj, recounts
    defeating Sudhanvá after a demand for Śiva’s bow and Sítá, and arranges the marriages
    of Sítá with Ráma and Urmilá with Lakshmaṇ. The passage also names cows as dowry,
    offerings to spirits, and an auspicious lunar date for the nuptials.
  language: English
  quote_policy: quoted
