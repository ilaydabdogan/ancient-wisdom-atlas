canonical_text:
  quote: ''
  summary: The passage describes divine and semi-divine beings producing numerous
    sylvan-form sons, including named Vánar chiefs with divine fathers. These monkey,
    bear, and ape champions are powerful, shape-changing, and associated with Ráma.
    The passage then shifts to the completion of Daśaratha’s Aśvamedha, the departure
    of gods, saints, and kings, Daśaratha’s advice to other rulers, and his return
    to his city with his household and retinue.
  language: English
  quote_policy: summarized
