canonical_text:
  quote: ''
  summary: Kuśik’s son praises the lineages of Ikshváku and Videha and proposes that
    Janak’s brother’s two daughters marry Bharat and Śatrughna. Janak accepts, fixes
    the same auspicious day for four royal marriages, and offers honor to the sages
    and Daśaratha. Daśaratha returns to perform ancestral offerings and then donates
    four hundred thousand gold-adorned cows with calves and pails to Bráhmans, after
    which he is compared with the Lord of Life surrounded by guardians.
  language: English
  quote_policy: summarized
