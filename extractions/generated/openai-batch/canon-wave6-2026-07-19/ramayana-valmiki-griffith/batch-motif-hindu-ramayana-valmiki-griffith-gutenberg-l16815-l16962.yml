canonical_text:
  quote: ''
  summary: The people who had followed Ráma wake and find him gone. Grieving sages
    lament his departure to the woods, consider dying on a pyre, follow his chariot
    marks until they vanish, and return despondently to Ayodhyá. The city and households
    are depicted as joyless. Women lament, praise Lakshmaṇ for following Ráma and
    Sítá, describe the forest landscape as holy and welcoming wherever Ráma goes,
    and urge renewed service to Ráma and Sítá.
  language: English
  quote_policy: summarized
