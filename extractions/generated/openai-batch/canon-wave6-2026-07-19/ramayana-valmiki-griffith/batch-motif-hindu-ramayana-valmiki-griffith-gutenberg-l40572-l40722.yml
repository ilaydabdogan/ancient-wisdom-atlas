canonical_text:
  quote: ''
  summary: Sugríva, seeing grief over the fallen Báli, approaches Ráma and says the
    vow has been fulfilled but that he cannot rejoice in rule because of his brother’s
    death. He confesses hatred, guilt, and unworthiness, comparing his sin to Indra’s
    killing of Viśvarúpa. Ráma consoles the mourners by saying that grief cannot restore
    the dead, that Fate governs events, and that Báli has won heaven as a brave warrior.
    Lakshmaṇ instructs Sugríva to perform Báli’s funeral rites with Tárá and Angad
    and to prepare the pyre and litter.
  language: English
  quote_policy: summarized
