canonical_text:
  quote: ''
  summary: In Canto LIV, King Viśvámitra attempts to carry off Vaśishṭha’s cow of
    plenty by force. The cow escapes back to Vaśishṭha, complains that she has been
    abandoned, and is reassured. She asserts that Bráhman power is greater than warrior
    power, receives Vaśishṭha’s command to create a matching force, and brings forth
    successive warrior hosts who fight the king’s army.
