canonical_text:
  quote: ''
  summary: Kaikeyí confronts the king about his promise and reputation for truth,
    invokes examples of promise-keeping and self-sacrifice, and demands Ráma’s banishment
    while threatening to poison herself if Ráma is anointed. The king, overwhelmed
    by grief, falls senseless and is compared to a felled tree and a wounded snake
    before speaking faintly to the queen.
  language: English
  quote_policy: summarized
