    cattle, horses, serpents, and snakes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Manu is described as giving life to the human race, including Bráhmans, Kshatriyas,
    Vaiśyas, and Śúdras, each associated with a part of her body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Analá is said to be the source from whom fruit-bearing trees sprang.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Vinatá gives birth to Aruṇ and Garuḍ; Aruṇ’s sons include Sampati and the
