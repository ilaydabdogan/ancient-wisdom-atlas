  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Jaṭāyus offers to be Ráma’s helper and to guard his house by staying beside
    Sítá when Ráma and Lakshmaṇ go hunting.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ráma thanks Jaṭāyus, bows, embraces him, recalls his father’s friendship with
