canonical_text:
  quote: ''
  summary: Jaṭāyus recounts a long genealogy of first-born progenitors, Daksha’s daughters,
    Kaśyap’s wives, and the births of gods, demons, birds, animals, serpents, humans,
    trees, and his own bird lineage. He offers to aid Ráma by guarding Sítá. Ráma
    accepts him with honor and proceeds toward Panchavaṭí. At Panchavaṭí, Ráma asks
    Lakshmaṇ to help establish a forest dwelling in a pleasant place with water, trees,
    flowers, sacred grass, and springs; Lakshmaṇ pledges obedience and offers to build
    the cot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker introduces a genealogy of first-born Fathers or Lords of Life
    from whom beings in earth and heaven derive birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Daksha is said to have sixty daughters, and Kaśyap weds eight of them: Aditi,
    Diti, Kálaká, Támrá, Danú, Analá, Krodhavasá, and Manu.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kaśyap tells his brides they will bear sons to rule the three worlds; Aditi,
    Diti, Danú, and Kálaká obey, while the rest refuse his command.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aditi gives birth to thirty-three gods, including Vasus, Ádityas, Rudras,
    and the Aśvins; Diti gives birth to the Daityas; Danú and Kálaká also produce
    named offspring.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Támrá’s daughters are linked to the births of cranes, owls, waterfowl, vultures,
    hawks, swans, geese, and ducks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Krodhavaśá’s daughters are linked to the births of deer, bears, yaks, mountain
