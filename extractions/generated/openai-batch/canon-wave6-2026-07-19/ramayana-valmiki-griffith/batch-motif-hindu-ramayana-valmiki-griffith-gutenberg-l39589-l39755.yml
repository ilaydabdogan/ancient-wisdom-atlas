canonical_text:
  quote: ''
  summary: A wounded speaker, identified within the passage as Sugríva’s foeman, reproaches
    Ráma for striking him unseen while he was fighting Sugríva. He contrasts Ráma’s
    reputed royal virtues with the alleged treachery of the act, argues that he lived
    harmlessly in the woods and had not wronged Ráma, lists sinners destined for hell,
    and says his body is not lawful or useful prey. He recalls ignoring Tárá’s warning,
    denounces Ráma as abandoning duty, and says Ráma should instead have confronted
    the robber of his wife. He claims he could have restored the Maithil lady and
    bound Rávaṇ, even pursuing her into hell or the ocean, as Hayagríva once rescued
    the white Aśvatarí from hell. He concludes that Sugríva’s reign after his death
    is fitting, but his own killing by hidden means is unjust, and attributes the
    outcome to Fate.
  language: English
  quote_policy: summarized
