canonical_text:
  quote: ''
  summary: Bharat, with companions and his mothers, inspects the grass bed under a
    tree where Ráma and Sítá had slept. He laments Ráma’s exile, notices traces of
    Sítá’s ornaments and garment, praises Sítá and Lakshmaṇ for staying with Ráma,
    and describes Ayodhyá as vulnerable without its rightful ruler. Bharat vows to
    live in forest hardship for Ráma’s term of banishment, with Śatrughna sharing
    his exile, while Ráma returns to reign. The passage then shifts to Gangá’s bank
    at dawn, where Bharat tells Śatrughna to call the lord of Śringavera; Guha arrives
    and Bharat asks that boats be prepared to ferry the army across the stream.
  language: English
  quote_policy: summarized
