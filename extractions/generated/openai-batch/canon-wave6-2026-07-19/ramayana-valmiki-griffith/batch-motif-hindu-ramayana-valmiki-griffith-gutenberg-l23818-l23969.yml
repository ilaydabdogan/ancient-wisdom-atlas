canonical_text:
  quote: ''
  summary: Bharat approaches Rāma’s forest hermitage with Śatrughna and others, identifies
    signs of the dwelling near Mandākinī and Chitrakūṭa, laments that Rāma lives as
    a hermit because of him, and resolves to seek pardon. He sees the leafy bower,
    weapons, altar fire, and Rāma seated in deerskin with matted hair beside Lakshmaṇ
    and Sītā. Bharat collapses in grief before reaching Rāma’s feet; Śatrughna bows,
    Rāma embraces his brothers, and the attendants and forest dwellers weep.
  language: English
  quote_policy: summarized
