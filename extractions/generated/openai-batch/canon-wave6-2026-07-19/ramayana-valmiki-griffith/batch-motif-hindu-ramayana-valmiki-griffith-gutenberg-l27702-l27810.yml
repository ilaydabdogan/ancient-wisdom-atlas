canonical_text:
  quote: ''
  summary: 'Rāma and Lakṣmaṇa perform evening rites, receive hermit hospitality, and
    at dawn continue toward Agastya’s hermitage. Rāma observes a flourishing forest
    and tells Lakṣmaṇa that the tame creatures and peaceful signs show that Agastya’s
    home is near. He recounts Agastya’s power: the saint killed a fiend, made the
    southern realm a refuge, repelled giants, and caused Vindhya to bow when it sought
    to obstruct the sun. Rāma describes the hermitage as a pure place served by gods
    and celestial beings, inhabited by ascetics and serpent-lords, and associated
    with saints who cast off mortal bodies and ascend heavenward. He sends Lakṣmaṇa
    ahead to announce that he and Sītā are near.'
  language: English
  quote_policy: summarized
