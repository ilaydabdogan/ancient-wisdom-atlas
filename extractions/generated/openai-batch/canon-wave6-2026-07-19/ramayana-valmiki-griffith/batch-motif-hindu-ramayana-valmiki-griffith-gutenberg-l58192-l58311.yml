canonical_text:
  quote: ''
  summary: The passage opens with a scholarly quotation rejecting earlier false parallels
    between Christianity and Brahmanical religion. It then introduces the story of
    Sítá’s banishment and the later birth of Kuśa and Lava in Válmíki’s hermitage.
    In the excerpt, Sítá asks Ráma to let her revisit sacred groves by the Gangá.
    Ráma later hears from Bhadra that the people praise him except for receiving back
    his abducted wife. Distressed by public reproach, he resolves to banish the spotless
    Sítá and orders Lakshmaṇ to take her to Válmíki’s forest. Sítá departs trustingly
    by car with Sumantra holding the reins, sees ominous signs, and prays that no
    harm come to Ráma or his brothers.
  language: English
  quote_policy: summarized
