canonical_text:
  quote: ''
  summary: In spring, King Daśaratha resolves to fulfill his vow and have the rite
    prepared in order to win sons. Vaśiṣṭha accepts the charge, organizes priests,
    workers, lodging, provisions, and invitations to rulers and guests. Sumantra sends
    envoys, kings arrive with gifts, the preparations are declared complete, Rishyaśring
    confirms this, auspicious stars appear, and the horse-sacrifice rites begin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spring returns, completing the year, and the king resolves to pay his vow
    in order to win sons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks Vaśiṣṭha to prepare the rite according to holy writ and to keep
    away anything that might mar its sacred forms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vaśiṣṭha agrees to do what the king desires.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vaśiṣṭha instructs trained priests to station trustworthy religious guards
    and summon workmen, star-readers, spade-workers, performers, and women trained
    to dance and sing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Learned men are told to oversee each rite according to the king’s decree,
    call Brāhman visitors, build decorated pavilions and booths, provide stables and
    chambers, and prepare food and drink.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vaśiṣṭha instructs that guests from all around and all castes be honored in
    due degree, that no guest be slighted, and that the rite be performed without
    omission, slip, or flaw.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Vaśiṣṭha commands Sumantra to invite princes, lords, priests, warriors, merchants,
    lowly thralls, Janak, the lord of Kāśi, the Kekaya king and his son, Lomapād,
    and allied rulers from several regions.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sumantra obeys, sends envoys in the four directions, and personally urges
    nobles, chiefs, lords, and kings to attend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Craftsmen who worked with stone and wood show Vaśiṣṭha the work they have
    completed for the rite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vaśiṣṭha warns the craftsmen that no gift should be given in scorn and says
