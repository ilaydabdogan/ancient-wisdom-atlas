canonical_text:
  quote: ''
  summary: Viśvámitra moves to Pushkar for austerities. King Ambarísha’s sacrificial
    horse is stolen by Indra, and a priest says a horse or a man must be supplied.
    Ambarísha buys Śunahśepha, the middle son of Richíka, as the sacrificial victim
    after the father refuses to sell the eldest and the mother refuses to give the
    youngest. During the journey, Śunahśepha appeals to his uncle Viśvámitra for rescue.
    Viśvámitra asks his own sons to die in Śunahśepha’s place; they refuse, and he
    curses them. He then teaches Śunahśepha hymns to use when bound at Vishṇu’s post
    so that he may be preserved and free.
  language: English
  quote_policy: summarized
