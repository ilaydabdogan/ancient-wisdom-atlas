canonical_text:
  quote: ''
  summary: Sugríva recounts to Ráma how he waited outside a cave while Báli pursued
    the demon Máyáví, saw blood flow from the cave, blocked the entrance, returned
    to Kishkindhá, and was made king against his will. Báli later emerged, accused
    Sugríva of betrayal, banished him, and took his wife. Sugríva asks Ráma for help,
    and Ráma promises to kill Báli, free Sugríva's wife, and restore his kingdom.
  language: English
  quote_policy: summarized
