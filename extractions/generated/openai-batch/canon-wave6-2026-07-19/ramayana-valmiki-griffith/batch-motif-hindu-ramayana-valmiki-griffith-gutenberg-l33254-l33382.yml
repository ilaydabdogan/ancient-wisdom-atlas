canonical_text:
  quote: ''
  summary: Rávaṇ fights the vulture king while carrying Sítá. The vulture withstands
    arrows, wounds Rávaṇ, breaks his bows, harness, chariot, team, royal emblems,
    and driver. Rávaṇ takes Sítá and tries again to carry her through the air. Though
    weakened by age, the vulture rises to block him and rebukes him for stealing Ráma’s
    wife, warning of ruin, death, and the consequences of guilty deeds.
  language: English
  quote_policy: summarized
