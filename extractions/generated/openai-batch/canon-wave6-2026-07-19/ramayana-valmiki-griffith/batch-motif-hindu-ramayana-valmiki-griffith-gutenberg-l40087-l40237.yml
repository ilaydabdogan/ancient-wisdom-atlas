canonical_text:
  quote: ''
  summary: Tárá runs in grief to the battlefield, finds her husband Báli fallen, sees
    Ráma, Sugríva, and Lakshmaṇ nearby, and collapses beside the dying king. She embraces
    Báli and laments his death, speaks of widowhood, Angad’s uncertain future, Sugríva’s
    restored wife and rule, Ráma’s promise to Sugríva, and Fate as the true conqueror.
    Other women mourn and ask forgiveness at Báli’s feet. Hanumán then approaches
    to console Tárá.
  language: English
  quote_policy: summarized
