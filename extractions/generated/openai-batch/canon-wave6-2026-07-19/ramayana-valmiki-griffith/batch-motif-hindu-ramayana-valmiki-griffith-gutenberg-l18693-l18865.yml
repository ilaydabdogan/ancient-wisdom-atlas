canonical_text:
  quote: "“Hard, hard to pass, my Queen, this sea / Of sorrow raging over me”"
  summary: The king laments Ráma's absence, asks that Ráma be brought back, and describes
    his grief as a vast sea. Queen Kauśalyá then asks Sumantra to take her to Ráma,
    Sítá, and Lakshmaṇ in the forest. Sumantra consoles her by describing their composure,
    Sítá's devotion, Lakshmaṇ's guardianship, and their righteous forest journey to
    uphold the king's oath.
  language: English
  quote_policy: quoted
