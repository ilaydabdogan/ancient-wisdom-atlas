canonical_text:
  quote: ''
  summary: The passage consists of explanatory notes identifying mythological beings,
    deities, places, etymologies, and natural imagery. It describes horse-headed beings
    and Kinnaras, supernatural hermit classes, Vibhishana’s austerities and boon from
    Brahma, serpent-gods, Rudras born from Brahma’s forehead, Maruts attending Indra,
    Mandara mountain used in the Churning of the Ocean, the heaven-and-return cycle
    of good spirits, Pampa lake and Rishyamuka hill, Bharata’s ascetic regency for
    Rama, a crow omen concerning Rama and Sita’s separation and restoration, and seasonal/floral
    observations.
  language: English
  quote_policy: summarized
