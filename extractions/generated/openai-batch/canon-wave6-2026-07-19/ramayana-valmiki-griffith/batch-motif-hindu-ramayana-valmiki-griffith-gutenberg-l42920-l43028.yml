canonical_text:
  quote: ''
  summary: Sugríva appoints Susheṇ to lead a large Vánar force westward in search
    of Rávaṇ and the Maithil queen. The instructions map a western sacred geography
    of plains, brooks, seas, mountains, caves, supernatural beings, guarded fruit,
    divine weapons, Meru, Asta, Varuṇ's palace, a silver palm, and the hermit Sávarṇi,
    ending at the unknown sunless sea beyond the setting sun's path.
  language: English
  quote_policy: summarized
