canonical_text:
  quote: ''
  summary: Ráma praises Sugríva as a true friend, asks him to help trace the Maithil
    lady and Rávaṇ, and offers reciprocal aid. Sugríva rejoices, speaks of their friendship
    won near a witness fire, and describes the constancy of friends. On the mountain,
    Sugríva and Hanúmán prepare leafy seats. Sugríva tells Ráma that his brother Báli
    has oppressed and expelled him and asks for deliverance. Ráma promises to kill
    Báli with his arrows. Sugríva then reaffirms the fire-witnessed friendship and
    tearfully begins to tell his grief.
  language: English
  quote_policy: summarized
