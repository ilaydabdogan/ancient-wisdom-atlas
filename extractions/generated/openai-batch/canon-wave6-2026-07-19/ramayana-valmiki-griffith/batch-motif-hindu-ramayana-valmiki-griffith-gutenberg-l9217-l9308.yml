canonical_text:
  quote: ''
  summary: After the wedding-related departure from Mithilā, Viśvāmitra withdraws
    and Janak gives his daughters rich dowers before Daśaratha proceeds with his sons,
    seers, and army. Ominous birds and frightened beasts disturb the journey; Vaśiṣṭha
    interprets the signs as peril partly allayed. A violent tempest darkens the sun
    and covers the army in dust and ashes. Jamadagni’s son, also called Bhrigu’s son,
    appears with axe, bow, and arrows, described through mountain, doom-fire, lightning,
    and Śiva-Tripura imagery. The saints wonder whether he will again destroy warriors,
    then approach him with a gift; he accepts silently and prepares to speak to Rāma.
  language: English
  quote_policy: summarized
