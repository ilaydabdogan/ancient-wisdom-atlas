canonical_text:
  quote: ''
  summary: Maheśvar praises Ráma, tells him to restore peace to his family, receive
    the kingdom, perform the horse offering, and salute his father Daśaratha, who
    has come from heaven. Daśaratha appears in radiance, embraces his sons, recognizes
    Ráma’s divine nature, asks him to return and reign, recalls the exile caused by
    Kaikeyí, and at Ráma’s request revokes his curse against her. He blesses Lakshmaṇ
    and Sítá, refers to Sítá’s proof by fire, and returns to heaven. Indra then offers
    Ráma a boon; Ráma asks that the slain Vánars be restored to life and provided
    with fruits and water. Indra grants the boon, the Vánars rise alive and healed,
    the gods urge Ráma’s return to Ayodhyá, and depart in radiant cars.
  language: English
  quote_policy: summarized
