canonical_text:
  quote: "“Yea, dig her up with might and main / Until you see the horse again.”"
  summary: Raghu’s son asks the hermit to continue the tale of Sagar. Sagar prepares
    a sacrifice, Indra steals the victim horse in demon disguise, and Sagar orders
    his sixty thousand sons to recover it by digging through the earth. The sons cleave
    the earth, kill many subterranean beings, reach hell, and alarm gods and other
    beings, who appeal to the Sire Omnipotent.
  language: English
  quote_policy: quoted
