canonical_text:
  quote: ''
  summary: Daśaratha recounts how he accidentally shot a hermit’s son after mistaking
    the sound of water for an animal. The dying youth explains his parentage, asks
    that the arrow be removed, and dies. Daśaratha takes water to the blind aged parents,
    confesses the death, hears the father describe the gravity of killing a hermit,
    and leads the parents to touch and mourn their son’s body.
  language: English
  quote_policy: summarized
