canonical_text:
  quote: "“The realm and I are Ráma’s”"
  summary: In an assembly, Vaśishṭha urges Bharat to accept kingship after Daśaratha’s
    death. Bharat grieves, refuses the throne, asserts Rāma’s rightful claim as elder
    and nobler brother, and resolves to go to the forest to bring Rāma back or share
    his exile. He orders Sumantra to mobilize the army and the people prepare vehicles
    and animals for the journey.
  language: English
  quote_policy: quoted
