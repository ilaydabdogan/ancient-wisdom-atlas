canonical_text:
  quote: ''
  summary: The passage recounts Chúli’s granting of a son, Brahmadatta, to Somadá
    through holy penance; Brahmadatta’s marriage to Kuśanábha’s hundred daughters
    and their restoration from deformity; Kuśanábha’s sacrifice for an heir and the
    birth of Gádhi after Kuśa’s promise; Viśvámitra’s account of his lineage and of
    his sister Satyavatí becoming the sacred river Kauśikí; and the night and dawn
    surrounding the travellers’ rest and departure.
  language: English
  quote_policy: summarized
