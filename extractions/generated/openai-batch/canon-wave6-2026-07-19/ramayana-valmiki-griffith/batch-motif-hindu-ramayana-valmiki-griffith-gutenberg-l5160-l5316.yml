candidate_motifs:
- id: motif:1
  label: child obtained through ascetic boon
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Somadá asks an ascetic for a son through holy penance and Chúli grants Brahmadatta,
    described as a spiritual child.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage emphasizes penance and a spiritual child, but gives few details
    about birth mechanics.
- id: motif:2
  label: marriage restores afflicted maidens
  taxonomy_refs:
  - sacred_marriage
  basis: Kuśanábha’s daughters are given to Brahmadatta; when each hand is placed
    in his palm, their deformity and cares depart and they are freed from the Wind-God’s
    might.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents a restorative marriage rite, but does not explicitly
    call the marriage sacred.
- id: motif:3
  label: sacrifice to obtain an heir
  taxonomy_refs:
  - sacrifice
  - sacred_birth
  basis: The sonless Kuśanábha prepares a sacrifice to gain an heir, after which Kuśa
    promises the birth of Gádhi and Gádhi is born.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The causal connection is narrated through Kuśa’s promise; ritual specifics
    are not described.
- id: motif:4
  label: faithful woman transformed into sacred river
  taxonomy_refs:
  - death_rebirth
  - water
  basis: Satyavatí follows her dead husband, is raised to heaven in human frame, becomes
    a pure celestial stream, and her waters purify the world.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The available motif taxonomy includes water as a symbol rather than a
    motif family; the motif combines transformation and sacred river imagery.
- id: motif:5
  label: lineage legitimated by divine descent and holy ancestry
  taxonomy_refs:
  - divine_parent_child
  - royal_legitimacy
  basis: The narrator traces his line from Kuśa, son of Brahmá; Kuśa promises Gádhi’s
    birth, and the holy men praise the righteousness and glory of Kuśa’s line.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  - ev:14
  confidence: medium
  cautions: The passage states lineage and praise but does not frame the account as
