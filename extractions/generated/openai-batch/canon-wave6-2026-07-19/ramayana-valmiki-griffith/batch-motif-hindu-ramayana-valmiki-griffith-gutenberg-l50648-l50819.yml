canonical_text:
  quote: |-
    “Whose queen, the darling of his soul,
    Thy magic art deceived and stole”
  summary: Śuka identifies the leading allies in Rāma’s army for Rāvaṇ, including
    divine-descended Vānar chiefs, Hanumān, Rāma, Lakṣmaṇ, Vibhīṣaṇ, and Sugrīva.
    Rāvaṇ rebukes earlier spies, sends new spies under Śārdūla, and they are detected
    and bound near Suvela before Rāma releases them. The spies return to Laṅkā, where
    Rāvaṇ questions Śārdūla.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Śuka points out Vānar chiefs to Rāvaṇ and says they dwell in Kiṣkindhā, serve
    Sugrīva, are descended from gods and Gandharvas, and can take forms suited to
    their needs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dwivid and Mainda are named as a conspicuous pair; the passage says they have
    known the drink of heaven and that Brahmā claims them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hanumān is identified as the Wind-God’s son, a peerless Vānar who had come
    to Laṅkā for the Maithil lady and whom Rāvaṇ had seen before.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rāma is described as truthful, dutiful, learned in the Vedas, skilled with
    mystic shafts, and seeking battle because his queen was deceived and stolen.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lakṣmaṇ stands at Rāma’s right and is described as a faithful brotherly companion
    who shares Rāma’s joys and cares and would die for him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vibhīṣaṇ stands on Rāma’s left with a retinue of giants and is said to have
    been anointed monarch in Rāvaṇ’s stead.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sugrīva is described as the monarch of the Vānar race, wearing a flower-decked
    golden chain, and owing his chain and kingly place to Rāma’s grace and Tārā.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Rāvaṇ reproves the earlier spies for praising his foes and banishes them from
    his presence, sparing their lives because of long service.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rāvaṇ orders Mahodar to bring more faithful spies, then instructs the new
    messengers to learn Rāma’s plans, advisers, habits, and intentions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The spies under Śārdūla reach Suvela, observe Rāma’s side, and are recognized
    by Vibhīṣaṇ, who orders them bound.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Rāma saves the captive spies from the Vānars’ fury, releases them, and tells
    them to go.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The spies return to Laṅkā and report that Rāma is waiting by Suvela hill;
    Rāvaṇ questions Śārdūla about his sadness and fear.
  category: sequence
  evidence_refs:
  - ev:11
