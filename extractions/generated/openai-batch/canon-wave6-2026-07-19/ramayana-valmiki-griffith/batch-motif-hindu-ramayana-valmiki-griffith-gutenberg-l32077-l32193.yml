canonical_text:
  quote: ''
  summary: An unnamed speaker addresses Lakshmaṇ, observes Sítá’s longing for a wondrous
    radiant deer, describes the deer’s golden and jewel-like beauty, and says he will
    hunt it for its hide. He allows that the creature may be the fiend Márícha in
    disguise and vows to kill him if so, comparing this to Agastya’s defeat of Vatápi.
    He then orders Lakshmaṇ, with Jaṭáyus’s help, to guard Sítá while he goes after
    the deer.
  language: English
