canonical_text:
  quote: ''
  summary: Kaikeyí fears that Bharat may receive an empty kingdom and argues that
    Ráma should go into exile by citing Sagar’s expulsion of Asamanj. Daśaratha rebukes
    her, and the councillor Siddhárth answers that Asamanj was expelled for murdering
    children, while Ráma is faultless; he warns that driving the guiltless Ráma to
    the wild would defy right and bring disgrace.
  language: English
