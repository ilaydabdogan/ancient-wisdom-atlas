canonical_text:
  quote: ''
  summary: Daśaratha prepares a richly supplied royal expedition led by sages and
    travels to Videha. Janak greets him, celebrates alliance with Raghu’s sons, announces
    the completion of his rite and the marriage of Rāma, and receives Daśaratha’s
    assent. Sages meet in friendship, Rāma and Lakṣmaṇ greet their father, and Janak
    advances the rite after attending to his daughters’ needs.
  language: English
