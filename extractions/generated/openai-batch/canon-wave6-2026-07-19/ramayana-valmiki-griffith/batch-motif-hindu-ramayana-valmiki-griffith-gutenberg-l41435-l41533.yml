canonical_text:
  quote: ''
  summary: A brother urges the grieving son of Raghu to rise to action. The speaker
    replies that the rains have ended, autumn signs have appeared, and kings now go
    to war, but Sugriva remains sunk in pleasure despite his promise to help after
    the rainy season. Remembering Sita's separation and loyalty in exile, the speaker
    sends Lakshman to rebuke Sugriva for forgetting his oath and warns that the path
    taken by Bali remains open if Sugriva proves false.
  language: English
  quote_policy: summarized
