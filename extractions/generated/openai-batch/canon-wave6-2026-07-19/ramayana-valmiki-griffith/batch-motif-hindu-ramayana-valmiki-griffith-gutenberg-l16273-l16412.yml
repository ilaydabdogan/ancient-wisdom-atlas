canonical_text:
  quote: ''
  summary: Daśaratha returns through a sorrowing and emptied Ayodhyá after the banishment
    of Ráma, Sítá, and Lakshmaṇ. He asks to be taken to Kauśalyá, laments Ráma’s absence,
    and says his sight has gone with his son. Kauśalyá laments Ráma’s exile, blames
    Kaikeyí, imagines the future return and welcome of the exiles, and describes her
    grief as consuming flame.
  language: English
  quote_policy: summarized
