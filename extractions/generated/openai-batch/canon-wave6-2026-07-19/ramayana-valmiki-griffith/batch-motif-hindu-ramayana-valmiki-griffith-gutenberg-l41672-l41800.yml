canonical_text:
  quote: ''
  summary: Sugríva is roused from wine-lulled repose when the Vánars panic at Lakshmaṇ’s
    arrival as Ráma’s envoy. Ministers and Angad respond to the crisis. Sugríva addresses
    his lords, worries over friendship, slander, and unrepayable favors from Ráma.
    Hanumán counsels him that autumn has begun, the time for action has arrived, and
    he must humbly meet the envoy, keep his pledge, and avoid Ráma’s anger.
  language: English
  quote_policy: summarized
