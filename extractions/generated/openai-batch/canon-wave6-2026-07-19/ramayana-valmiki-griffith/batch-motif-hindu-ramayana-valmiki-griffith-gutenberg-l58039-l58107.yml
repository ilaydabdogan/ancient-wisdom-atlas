canonical_text:
  quote: ''
  summary: The passage gives lexicographic notes on Śiva and the Apsarases. Śiva is
    described as destroyer, regenerator, generator, time, justice, fire, water, sun,
    creator, and destroyer, with iconographic signs including the Linga, white bull,
    three eyes, trident, tiger skin, crescent, serpents, and skull necklace. The Apsarases
    are described as originally associated with vapours, mist, clouds, sunbeams, plants,
    constellations, waters, and Gandharvas, and later as heavenly wives, rewards for
    fallen heroes, assistants of Soma, and disturbers of ascetic sages.
  language: English
  quote_policy: summarized
