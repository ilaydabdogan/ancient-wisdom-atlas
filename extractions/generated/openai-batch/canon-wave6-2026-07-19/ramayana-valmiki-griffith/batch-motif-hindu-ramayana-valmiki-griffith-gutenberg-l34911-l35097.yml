canonical_text:
  quote: ''
  summary: Ráma, believing Sítá has been seized, killed, or devoured by giants, laments
    to Lakshmaṇ. He imagines shame if he returns without her, asks Lakshmaṇ to go
    back to Ayodhyá with messages for Bharat and the mothers, reflects on accumulated
    sorrows, recalls places Sítá loved, appeals to the Sun and Wind as witnesses,
    and is urged by Lakshmaṇ to renew the search. Ráma then asks Lakshmaṇ to check
    the Godávarí for signs of Sítá.
  language: English
  quote_policy: summarized
