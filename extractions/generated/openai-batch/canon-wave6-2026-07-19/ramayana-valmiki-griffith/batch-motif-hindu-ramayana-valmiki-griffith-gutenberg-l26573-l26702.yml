canonical_text:
  quote: "“Their bodies laid in earth, they rise / To homes eternal in the skies.”"
  summary: Ráma and Lakshmaṇ hear the lady’s cry, overpower the giant Virádha, learn
    that weapons cannot kill him, and bury him in a pit. Virádha reveals that he was
    Tumburu, cursed by Kuvera, and that Ráma’s defeat of him restores him to heaven.
    He directs Ráma to the hermit Śarabhanga before his body is placed under earth
    and his spirit departs heavenward.
  language: English
  quote_policy: quoted
