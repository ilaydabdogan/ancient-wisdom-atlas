literal_observations:
- id: obs:1
  text: Śálmalí is described as a fabulous thorny cotton-tree rod used to torture
    the wicked in hell; the name is also given to a dvīpa and to a hell where the
    wicked are tormented with the tree's prickles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mandehas are described as terrific fiends who attempt to devour the sun;
    under Brahmá's curse they die every day, revive by night, and engage in a daily
    contest with the sun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aurva's wrath produced a flame that threatened to destroy the world until
    he cast it into the ocean, where it remained concealed with the face of a horse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Śesha, also called Ananta, is described as a mythological serpent king bearing
    the earth on one of his thousand heads.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jambudwípa is described as the central one of seven continents, with the golden
    mountain Meru at its center, crowned by the city of Brahmá.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Vaikhánases are described as a race of hermit saints sprung from the nails
    of Prajápati.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Válakhilyas are described as sixty thousand pigmy sages born from Samnati,
    no bigger than a thumb-joint, chaste, pious, and radiant like sun-rays.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhogavatí is described as the capital of serpent gods or demons and is usually
    placed under the earth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Vásuki is described as, according to some accounts, king of the Nāgas or serpent
    gods.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The distant south beyond the confines of the earth is described as the home
    of departed spirits and the city of Yáma, the God of Death.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Viśvakarmá is described through Greco-Roman analogies as the Mulciber of the
    Indian heaven and the Indian Hephaistos or Vulcan.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kinnars are described as beings with equine heads and human bodies, compared
    to centaurs reversed.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Yakshas are described as demi-gods attendant on Kuvera, the god of wealth.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Panchajan is described as a sea-dwelling demon in the form of a conch shell.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: At the dissolution of the universe caused by Brahmá's sleep, Hayagríva seized
    and carried off the Vedas; Vishṇu slew him and recovered them.
  category: sequence
  evidence_refs:
  - ev:15
