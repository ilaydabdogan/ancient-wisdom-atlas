canonical_text:
  quote: ''
  summary: Hanuman gives Sita Rama's engraved ring as a token. Sita recognizes the
    sign, praises the messenger, asks after Rama and Lakshmana, and questions why
    rescue has not come. Hanuman reports Rama's grief and promises that Rama will
    come with the monkey hosts, bridge the way to the island, and destroy the city.
    Sita speaks of fate, her captivity under Ravana, the remaining time before she
    is to be killed, and counsel given to Ravana by Vibhishana and others. Hanuman
    offers to carry Sita away over the sea and reveals his great size, but Sita refuses,
    citing fear of the flight and her vow not to touch any man but Rama by free choice.
    Hanuman accepts her reasoning and asks for a gem as a token for Rama.
  language: English
  quote_policy: summarized
