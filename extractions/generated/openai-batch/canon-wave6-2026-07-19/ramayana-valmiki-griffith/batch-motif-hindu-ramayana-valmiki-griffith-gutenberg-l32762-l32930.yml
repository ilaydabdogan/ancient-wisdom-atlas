canonical_text:
  quote: ''
  summary: Sítá rejects the advances of the stranger by declaring herself Ráma’s wife,
    praising Ráma’s strength and virtue, warning that any attempt to touch or win
    her would be deadly, and predicting Ráma’s retaliation. The stranger then reveals
    himself as Rávaṇ, boasts of his power, his victory over Vaiśravaṇ, his possession
    of the flying car Pushpak, and the splendor of Lanká, and urges Sítá to abandon
    Ráma and live with him while warning her against refusal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sítá identifies herself as the wife of Ráma and praises Ráma as strong, princely,
    truthful, self-controlled, and lion-like.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sítá rejects the stranger’s wooing and compares his hope of touching Ráma’s
    wife to a jackal wooing a lioness and to stealing glory from the sun.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sítá lists dangerous or impossible acts, including taking a snake’s fang,
    shaking Mount Mandar, drinking poison, plucking sun and moon from the sky, and
    pressing kindled flame to the breast, as comparisons for the stranger’s attempt
    to win her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sítá contrasts Ráma and the stranger through paired comparisons such as ocean
    and spring, lion and fox, gold and lead, Amrit and rice-drainings, swan and owl,
    peacock and waterfowl, and eagle and bat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sítá predicts that when Ráma sees his armed foe with bow and arrows, the stranger
    will lose his prey.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Sítá’s speech, she grows pale, her limbs fail, and she trembles with
    fright while the stranger watches her fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stranger prepares to terrify Sítá further by recounting his triumphs,
    titles, pedigree, and name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stranger identifies himself as Rávaṇ, the brother of the King of Gold
    and the Lord of Ten Necks, and says gods, Gandharvas, snakes, spirits, and birds
    fear him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rávaṇ says that Vaiśravaṇ fought him, yielded to his superior might, fled
    from his home, and now dwells on Kailása’s hill.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rávaṇ says he made the vanquished king give up the glorious car Pushpak, which
    now belongs to him and flies will-guided through the sky.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Rávaṇ claims that celestial hosts led by Indra flee from him and that wind,
