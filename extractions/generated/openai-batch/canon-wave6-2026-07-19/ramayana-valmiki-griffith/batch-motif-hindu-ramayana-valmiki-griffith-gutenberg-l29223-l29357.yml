canonical_text:
  quote: ''
  summary: As Khara’s giant army sets out, many ominous disturbances appear in sky,
    weather, animals, waters, plants, earth, and Khara’s own body. Khara notices the
    signs but boasts that he can defeat Ráma and Lakshmaṇ and even oppose the king
    of gods. His army rejoices, while gods, Gandharvas, sages, and saints gather in
    the air hoping Raghu’s offspring will slay the night-roaming sons of Pulastya.
    Khara and his giant warriors advance toward the dwelling of the two princes.
  language: English
  quote_policy: summarized
