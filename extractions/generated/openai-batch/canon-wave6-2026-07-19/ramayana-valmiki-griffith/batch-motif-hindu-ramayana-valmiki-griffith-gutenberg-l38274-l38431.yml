canonical_text:
  quote: ''
  summary: Sugríva tells Ráma that Báli dispossessed him, seized his consort, imprisoned
    his friends, and seeks his death. Ráma asks to hear the cause of the brothers'
    enmity and promises to restore Sugríva's former state. Sugríva recounts that Báli,
    his elder brother and rightful king, pursued the demon Máyáví into a grass-covered
    cave. After waiting at the cave mouth for a year, hearing demon roars, and seeing
    a stream of blood and froth, Sugríva believed Báli dead, sealed the cave with
    a rock, performed rites, and returned to Kishkindhá. The Vánar lords enthroned
    Sugríva, but Báli later returned after killing the demon, became enraged, killed
    the lords who had made Sugríva king, and rejected Sugríva's humble submission.
  language: English
  quote_policy: summarized
