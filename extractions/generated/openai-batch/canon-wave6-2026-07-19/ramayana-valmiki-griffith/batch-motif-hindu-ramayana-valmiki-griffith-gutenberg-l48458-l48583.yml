canonical_text:
  quote: ''
  summary: The passage describes Ráma and the Vánar-bear host reaching the ocean,
    recognizing the sea as an obstacle to crossing to the giant’s island, encamping
    under guard, and viewing the turbulent monster-filled sea. Ráma then laments to
    Lakshmaṇ for his captive queen, longs for contact through the wind, contrasts
    his inward fire with the cooling sea, and hopes to defeat the foe and free King
    Janak’s child.
  language: English
  quote_policy: summarized
