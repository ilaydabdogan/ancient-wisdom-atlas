canonical_text:
  quote: ''
  summary: After completing their prior task, Ráma and Lakshmaṇ perform morning rites
    and ask Viśvámitra for instruction. The sages announce Janak's sacrifice in Mithilá
    and tell Ráma he will see a divine bow that none can string. Viśvámitra leaves
    the hermitage for the north with pupils, servants, and even the grove's birds
    and deer following. The group halts on the Śona, performs bathing and fire oblations,
    and Ráma asks about the country.
  language: English
  quote_policy: summarized
