canonical_text:
  quote: ''
  summary: The king finds Queen Kaikeyí lying in distress and tries to comfort her,
    promising that her wish will be fulfilled. She first requires an oath, then invokes
    gods, celestial bodies, spirits, and all beings as witnesses. She recalls that
    she once saved the king in a battle of gods and demons and that he promised her
    two boons; she now demands that the rites intended for Ráma be transferred to
    her son and that Ráma be sent to Daṇḍak forest for nine years and five as a hermit
    in deerskin and matted hair.
  language: English
  quote_policy: summarized
