canonical_text:
  quote: ''
  summary: A divine assembly arrives and questions Ráma about allowing Sítá to enter
    the fire. Ráma says he is a mortal descendant of Ikshváku and Daśaratha, but Brahmá
    declares him to be Náráyaṇ/Vishṇu and Sítá to be Lakshmí, his celestial spouse,
    saying he took his present form to free the worlds from Rávaṇ. The Lord of Fire
    then brings Sítá unharmed from the pyre and publicly declares her pure and faithful.
    Ráma explains that the public fire-ordeal was needed to clear her before the world,
    affirms he never doubted her, and embraces her.
  language: English
  quote_policy: summarized
