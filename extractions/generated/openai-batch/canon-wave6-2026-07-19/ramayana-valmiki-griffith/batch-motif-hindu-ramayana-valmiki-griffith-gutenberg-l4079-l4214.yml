canonical_text:
  quote: ''
  summary: At dawn Viśvámitra wakes Ráma and the princes perform bathing, prayer,
    and worship. They visit a sacred hermitage near the confluence of the Sarjú and
    Gangá. Viśvámitra explains that Kandarpa/Káma once challenged Stháṇu and lost
    his bodily form to the god's destructive gaze, after which the land was called
    Anga and Káma was called Ananga. The ascetics receive the party with ritual hospitality,
    and the visitors spend the night. The next morning they cross the river by barge;
    when Ráma asks about the roaring waters, Viśvámitra explains the divine origin
    of the Sarjú from Lake Mánas on Kailása and its meeting with the Gangá, and tells
    Ráma to bow in adoration.
  language: English
  quote_policy: summarized
