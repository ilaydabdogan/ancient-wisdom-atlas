canonical_text:
  quote: ''
  summary: Ráma recognizes Rávaṇ and defies him. Rávaṇ orders guards to remain at
    the gates of Lanká, charges through the opposing host, wounds Sugríva, and repels
    other Vánar attackers. Lakshmaṇ asks Ráma for leave to fight. Hanúmán challenges
    Rávaṇ, referring to Brahmá’s boon and a Vánar exception. Rávaṇ and Hanúmán exchange
    blows, and Rávaṇ then attacks Níla. Níla throws mountain and tree missiles, condenses
    his form, and leaps onto Rávaṇ’s standard, bow, and crown before being struck
    by a fiery dart but surviving. Rávaṇ then turns toward Lakshmaṇ and threatens
    him with death.
  language: English
  quote_policy: summarized
