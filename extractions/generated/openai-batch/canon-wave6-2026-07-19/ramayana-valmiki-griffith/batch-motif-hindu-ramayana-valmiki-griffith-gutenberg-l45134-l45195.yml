canonical_text:
  quote: ''
  summary: A Vánar reaches the city of Lanká, views its splendid gates and buildings,
    and is confronted at the gate by the city’s guardian Goddess in Rákshas form.
    She bars his entry in Rávaṇ’s name, strikes him, and is felled by him. After he
    repents of striking a defeated woman, she asks for mercy and recalls Brahmá’s
    prophecy that a Vánar’s overpowering her would signal fear and defeat for the
    giants and ruin for Rávaṇ and his city for Sítá’s sake.
  language: English
  quote_policy: summarized
