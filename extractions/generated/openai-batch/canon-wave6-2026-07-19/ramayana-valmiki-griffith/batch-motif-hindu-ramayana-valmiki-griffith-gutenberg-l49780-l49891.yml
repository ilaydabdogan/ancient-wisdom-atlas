canonical_text:
  quote: ''
  summary: Rávaṇ’s spy Śárdúla reports the advancing forces of Ráma, Lakshmaṇ, and
    the Vánars on the seashore and counsels diplomatic stratagems. Rávaṇ sends Śuka
    in bird-like form to carry a message urging Sugríva to abandon Ráma. Śuka is attacked,
    spared by Ráma as a herald, then challenged by Sugríva with threats against Rávaṇ.
    Angad identifies Śuka as a spy who surveyed the army; the Vánars bind him, and
    Ráma again orders his release.
  language: English
  quote_policy: summarized
