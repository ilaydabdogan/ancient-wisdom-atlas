canonical_text:
  quote: ''
  summary: Ráma tells Sítá that his father’s earlier boons to Kaikeyí require him
    to spend fourteen years in Daṇḍak forest while Bharat receives the kingdom. He
    instructs Sítá to remain in Ayodhyá, honor the royal household, and obey Bharat.
    Sítá rejects separation, arguing that a wife shares her husband’s fate, and vows
    to accompany Ráma into the forest; Ráma does not yet consent and describes the
    hardships of the wild.
  language: English
  quote_policy: summarized
