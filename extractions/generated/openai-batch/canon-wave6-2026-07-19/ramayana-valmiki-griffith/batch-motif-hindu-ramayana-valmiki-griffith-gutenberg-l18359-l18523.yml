canonical_text:
  quote: ''
  summary: Sumantra returns alone to Ayodhyá after leaving Ráma at the Gangá shore.
    The city, citizens, palace women, and royal family mourn Ráma’s exile. Sumantra
    delivers Ráma’s message to Daśaratha, who faints from grief. Kauśalyá urges the
    king to speak and seek news. When Daśaratha regains awareness, he asks Sumantra
    about Ráma’s forest dwelling, food, bed, companions, and words, imagining the
    prince exchanging royal comfort for life beneath trees in the wilderness.
  language: English
  quote_policy: summarized
