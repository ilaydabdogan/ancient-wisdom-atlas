canonical_text:
  quote: ''
  summary: The Vánar commanders depart in assigned directions to search for Ráma’s
    captive wife and boast that they will defeat Rávaṇ and overcome mountains, seas,
    and hell itself. Ráma then asks Sugríva how he learned the lands and waters of
    the world. Sugríva recounts earlier flight from Báli, wide wandering through eastern,
    southern, western, and northern regions, and final refuge at Rishyamúka because
    Matanga’s curse barred Báli from entering that place.
  language: English
  quote_policy: summarized
