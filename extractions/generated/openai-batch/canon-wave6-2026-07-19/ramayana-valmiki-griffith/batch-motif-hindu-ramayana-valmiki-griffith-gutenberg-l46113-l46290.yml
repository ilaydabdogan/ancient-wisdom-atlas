canonical_text:
  quote: ''
  summary: Sítá rejects Rávaṇ’s attempt to woo her, affirms fidelity to Ráma, urges
    Rávaṇ to return her, and warns that his conduct will destroy him and Lanká. Rávaṇ
    threatens her with death if she does not yield. Celestial witnesses comfort Sítá.
    Rávaṇ orders Rákshas guards to coerce her, and demons surround her, praising Rávaṇ’s
    lineage and power while threatening her if she refuses him.
  language: English
  quote_policy: summarized
