canonical_text:
  quote: "“Go forth, my child, my Ráma, go.”"
  summary: Kauśalyá blesses Ráma before his departure, invoking gods, saints, cosmic
    time, heavenly bodies, sacred places, natural forces, forest beings, and ritual
    protections. She worships the gods with offerings, has a Bráhman perform a fire
    rite for Ráma’s welfare and safe return, and then compares the desired blessing
    to auspicious blessings associated with Indra, Suparṇa, Aditi, and Vishṇu.
  language: English
  quote_policy: quoted
