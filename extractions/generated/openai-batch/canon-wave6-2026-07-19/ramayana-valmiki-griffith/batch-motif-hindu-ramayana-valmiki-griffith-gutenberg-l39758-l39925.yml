canonical_text:
  quote: ''
  summary: Ráma answers the wounded Báli’s reproaches. He argues that the land belongs
    under Ikshváku and Bharat’s righteous rule; that kings must repress sin; that
    Báli wronged his brother by taking Rumá; that Ráma is bound by oath to restore
    Sugríva’s wife and kingdom; that Manu and earlier kings support punishment as
    purification; and that Báli’s death by arrow can be compared to royal hunting
    of forest creatures.
  language: English
  quote_policy: summarized
