  summary: Footnotes explain Vedic ritual terms and practices, including Pravargya,
    Upasad, Soma, sacrificial post woods, Agni-related sacrifices, classes of priests,
    Brāhmanical disputation, the Seven Rishis as Ursa Major, and the Maruts as deified
    winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pravargya ceremony is described as lasting three days, being performed
    twice daily, preceding animal and Soma sacrifices, and serving as a prerequisite
    for participation in the solemn Soma feast for the gods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Upasads are described as burnt offerings called “besieging,” by which
    the gods conquer a large fortified town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Soma plant is identified as Asclepias Acida; its fermented juice is drunk
    by priests in sacrifice and offered to the gods, who enjoy the intoxicating draught.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: During ceremonial intervals, Bráhmans are described as holding public disputations
    on the nature of things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Angas are described as appendices of the Vedas covering pronunciation,
    prosody, grammar, ritual, astronomy, and explanation of obscurities.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Different woods are prescribed for the Yúpa or sacrificial post according
    to desired results: Bilva for food and fatness, Khádira for heaven, and Paláśa
    for beauty and sacred knowledge.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A kind of pine is said to have a name meaning literally “the tree of the Gods,”
    and the note compares this phrase with a Hebrew phrase translated “trees of the
    Lord.”
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Hindus are said to call the constellation Ursa Major the Seven Rishis
    or Saints.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ágnishṭoma is described as a five-day series of offerings to fire and as the
    first and principal part of the Jyotishṭoma, in which Soma is offered to obtain
    heaven.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Ágnishṭoma is identified with Agni; the gods praise Agni with Stomas,
    and Jyotishṭoma is explained through Agni rising to the sky in the form of light.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Several sacrificial divisions or subdivisions are listed, including Atirátra,
    Abhijit, Viśvajit, Áyus, Aptoryám, and Ukthya; Aptoryám is described as a voluntary
    sacrifice for attaining a desired object.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'Four classes of priests are described for solemn sacrifices: officiating
