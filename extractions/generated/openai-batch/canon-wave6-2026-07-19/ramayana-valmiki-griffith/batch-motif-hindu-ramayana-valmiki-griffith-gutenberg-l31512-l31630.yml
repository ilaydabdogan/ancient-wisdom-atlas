canonical_text:
  quote: ''
  summary: Márícha tells Rávaṇ how he and two fiends once took deer form, attacked
    hermits and rites in Daṇḍak wood, then met Ráma with his wife and Lakshmaṇ. Márícha
    charged Ráma but escaped when Ráma shot three arrows; the other two fiends were
    killed. He now lives in fear, seeing Ráma everywhere, and warns Rávaṇ that Ráma
    is too strong, that Khara died by Ráma’s hand, and that Rávaṇ and his kin will
    die if the warning is ignored. Rávaṇ rejects the counsel and prepares to answer
    reproachfully.
  language: English
  quote_policy: summarized
