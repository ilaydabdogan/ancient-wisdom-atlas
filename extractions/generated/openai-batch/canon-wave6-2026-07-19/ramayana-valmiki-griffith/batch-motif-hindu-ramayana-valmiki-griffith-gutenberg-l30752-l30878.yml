canonical_text:
  quote: ''
  summary: Śúrpaṇakhá rebukes the demon king for pleasure, negligence, weak counsel,
    ignorance of affairs, and failure to use spies. She warns that such a ruler will
    lose followers, realm, and rank, contrasts him with a disciplined and watchful
    king, and reports that Ráma has slain many giants including Khara and Dúshaṇ and
    made Daṇḍak safe for saints. The demon king then questions her about Ráma, his
    deeds, weapons, purpose in Daṇḍak, and who maimed her.
  language: English
  quote_policy: summarized
