canonical_text:
  quote: ''
  summary: After the return of spring, childless King Daśaratha asks Rishyaśring to
    assist a vowed sacrifice for heirs. Sumantra summons learned priests, who approve
    the king’s plan to perform a horse sacrifice and promise that sons will be born
    to him. The king orders preparations, including the release and guarding of the
    sacrificial horse, the preparation of the sacrificial ground, and protective rites
    against hostile beings who might spoil the ritual. He then tells his wives to
    begin lustral rites because the offering is intended to bear the fruit of sons.
  language: English
  quote_policy: summarized
