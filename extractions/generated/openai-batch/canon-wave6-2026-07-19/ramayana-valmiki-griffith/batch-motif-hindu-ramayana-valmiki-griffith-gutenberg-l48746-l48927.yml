canonical_text:
  quote: ''
  summary: In Rávaṇ's council, Rākshasa warriors propose deception and battle against
    Ráma's forces. Vibhishaṇ counsels restraint, names Sítá's abduction as the cause
    of danger, urges her restoration, and later reports ominous ritual and animal
    signs in Laṅkā since Ráma's queen became captive. Rávaṇ first ends the council
    silently and later responds to Vibhishaṇ with anger.
  language: English
  quote_policy: summarized
