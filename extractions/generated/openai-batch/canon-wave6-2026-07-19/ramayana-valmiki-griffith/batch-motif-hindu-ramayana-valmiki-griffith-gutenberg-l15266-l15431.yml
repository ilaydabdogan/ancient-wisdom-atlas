canonical_text:
  quote: ''
  summary: Sumantra angrily rebukes Kaikeyi for pressing Dasaratha toward Rama's banishment
    and Bharata's accession, invokes birthright succession and public rejection of
    her rule, and tells an exemplum about Kaikeyi's mother demanding forbidden disclosure
    from her husband after he had received a boon to understand animal speech. Sumantra
    urges Kaikeyi to obey the king and let Rama be anointed, but she remains unmoved.
    In the following canto, the anguished king orders Sumantra to prepare a large
    retinue, wealth, and provisions to accompany Rama into the forest exile.
  language: English
  quote_policy: summarized
