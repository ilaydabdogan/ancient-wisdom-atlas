canonical_text:
  quote: ''
  summary: After Ráma has slain Virádha, he consoles Sítá and leads Lakshmaṇ toward
    Śarabhanga’s hermitage. Near the hermitage, Ráma sees Indra in a radiant aerial
    car with divine attendants, but Indra departs before speaking with him, saying
    Ráma has a future task and will see him later. Ráma, Lakshmaṇ, and Sítá meet Śarabhanga
    by the sacred fire. Śarabhanga explains that Indra came to take him to Brahmá’s
    sphere, won by penance, but he waited to see Ráma. He directs Ráma toward Sutíkshṇa’s
    hermitage by the Mandákiní, then enters the fire, emerges transformed as a radiant
    youth, ascends beyond heavenly realms, and is welcomed by Brahmá.
  language: English
  quote_policy: summarized
