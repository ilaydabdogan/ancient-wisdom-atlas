canonical_text:
  quote: ''
  summary: 'A sequence of footnotes explains mythic names and episodes: Vritra as
    a drought-darkness demon opposed by Indra, Vishnu’s three solar steps, Garuḍa,
    personified mountains, Surasá’s many-headed serpent children, Daksha’s cosmogonic
    descendants, Ráhu as eclipse agent, Hanumán in a solar-cloud interpretation, Rávaṇ’s
    austerity-won power over trees, and priests using ritual implements as weapons.
    Several notes also make explicit literary or mythological comparisons.'
  language: English
  quote_policy: summarized
literal_observations:
