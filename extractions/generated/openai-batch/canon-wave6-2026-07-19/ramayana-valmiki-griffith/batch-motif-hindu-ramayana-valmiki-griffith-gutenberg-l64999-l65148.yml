  text: Vritra is described as a Vedic personification of a malignant influence or
    demon of darkness and drought that obstructs clouds, sky-clearness, and waters.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indra is represented as battling Vritra; clouds are represented as mountains
    or castles, shattered by Indra’s thunderbolt so that their receptacles open.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three steps of Vishṇu are explained as typifying the sun’s rising, culmination,
    and setting.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Náráyaṇ is identified with Vishnu and glossed as one who moved upon the waters,
    with an allusion to the three steps.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prahláda is described as a pious Daitya devoted to Vishṇu and persecuted by
