candidate_motifs:
- id: motif:1
  label: Storm-god combat releases withheld waters
  taxonomy_refs:
  - chaos
  basis: The passage describes Vritra as withholding waters and Indra as battling
    and opening the cloud-receptacles with a thunderbolt.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is an explanatory footnote; it summarizes the mythic pattern
    rather than narrating a full episode.
- id: motif:2
  label: Solar deity’s three-step course
  taxonomy_refs:
  - ascent
  basis: Vishṇu’s three steps are explicitly glossed as the sun’s rising, culmination,
    and setting.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The available taxonomy has no exact daily solar-course motif; 'ascent'
    covers only part of the stated cycle.
- id: motif:3
  label: Devotee persecuted by hostile father
  taxonomy_refs:
  - divine_beloved
  - divine_parent_child
  basis: Prahláda is devoted to Vishṇu and persecuted by his father Hiraṇyakaśipu.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The footnote gives only a compressed biographical note and does not narrate
    the persecution.
- id: motif:4
  label: Personified or animate mountain
  taxonomy_refs:
  - cosmic_mountain
  - shapeshifter
  basis: The notes identify mountain figures genealogically and state that mountain
    spirit can appear apart from the mountain, with Himalaya in human form.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage describes an interpretive or explanatory tradition, not a
    full scene of transformation.
- id: motif:5
  label: Mountains as mythic substitutes for clouds
  taxonomy_refs:
  - cosmic_mountain
  - chaos
  basis: The note says Parvata means mountain and cloud and that later mythology makes
    mountains take the place of clouds as objects of Indra’s attacks.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is philological and mythological explanation rather than narrative
    action in the passage.
- id: motif:6
  label: Many-headed serpents in the sky
  taxonomy_refs:
  - serpent
  basis: Surasá’s children are described as a thousand many-headed serpents traversing
    the sky.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage quotes a Purāṇic note and does not describe their actions
    beyond traversing the sky.
- id: motif:7
  label: Supernatural expansion and compression of the body
  taxonomy_refs:
  - shapeshifter
  basis: The note states that Válmíki’s supernatural beings have powers of self-extension
    and compression.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: No specific being is named in this footnote; the claim is general.
- id: motif:8
  label: Cosmogonic daughters produce all beings
  taxonomy_refs:
  - sacred_birth
  basis: Twenty-seven daughters of Daksha marry Kaśyapa and, according to one cosmogony,
    produce all mundane beings.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The note reports one cosmogony and questions the exact force of the epithet
    'Descendant of Daksha'.
- id: motif:9
  label: Eclipse caused by dragon’s head
  taxonomy_refs:
  - serpent
  basis: Ráhu is called the dragon’s head or ascending node and chief agent in eclipses.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage identifies the agent but does not narrate an eclipse episode.
- id: motif:10
  label: Sun enters and escapes cloud
  taxonomy_refs:
  - death_rebirth
  - return
  basis: De Gubernatis is reported as interpreting Hanumán as the sun entering into
    and escaping from a cloud.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: This is a later comparative interpretation noted by the translator, not
    a literal statement of the epic episode in this passage.
- id: motif:11
  label: Ascetic power disrupts natural fertility cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: Rávaṇ’s mortifications are said to make his trees bear flowers and fruit
    simultaneously.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The note attributes the effect to Rávaṇ’s mortifications but gives no
    fuller ritual or seasonal context.
- id: motif:12
  label: Ritual implements as weapons
  taxonomy_refs:
  - sacrifice
  basis: Priests fight with sacred grass and consecrated fire, implements associated
    with sacred rites and ghee offerings.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage is explanatory and does not narrate the combat itself.
comparison_claims:
- id: claim:1
  claim: The note states that an Indian story appears to be a form of the stories
    of Phaethon, Daedalus, and Icarus.
  claim_level: same_motif
  target: Greek stories of Phaethon, Daedalus, and Icarus
  evidence_refs:
  - ev:18
  counter_evidence_refs: []
  confidence: low
  limitations: The footnote gives only the comparison and no details of the underlying
    Indian episode in this passage.
- id: claim:2
  claim: The note compares self-moving hills in the Rámáyanic material with self-moving
    hills in Milton.
  claim_level: same_function
  target: Miltonic self-moving hills in Paradise Lost
  evidence_refs:
  - ev:19
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a literary analogy supplied by the translator, not evidence
    of historical relationship.
- id: claim:3
  claim: The note reports De Gubernatis’s comparison of Hanumán entering and escaping
    a cloud with Jonah in the fish’s mouth as a similar solar phenomenon.
  claim_level: archetypal_reading
  target: Biblical Jonah and solar entry into a fish or cloud
  evidence_refs:
  - ev:12
