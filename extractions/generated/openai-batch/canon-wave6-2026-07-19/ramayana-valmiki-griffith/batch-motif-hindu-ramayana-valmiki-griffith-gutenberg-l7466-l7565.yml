canonical_text:
  quote: ''
  summary: Vasiṣṭha’s sons refuse Triśanku’s request for ritual aid after Vasiṣṭha
    has denied it. When Triśanku says he will seek other assistance, they curse him
    to become a Chaṇḍāla. Overnight his appearance changes into that of an outcast,
    and his attendants flee. He goes alone to Viśvāmitra, who receives him compassionately.
    Triśanku explains that he seeks a heavenly mansion while still in his body, has
    planned many rites, has been refused by his priest and the priest’s sons, and
    now begs Viśvāmitra to help him overcome Fate.
  language: English
  quote_policy: summarized
