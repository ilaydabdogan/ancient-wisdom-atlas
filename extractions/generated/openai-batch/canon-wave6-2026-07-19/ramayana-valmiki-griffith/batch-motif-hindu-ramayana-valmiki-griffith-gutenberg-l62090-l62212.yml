  claim: The passage compares Indian princely instruction in archery with that of
    ancient Persians and Scythians.
  claim_level: same_function
  target: Persian and Scythian elite military instruction
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the shared training function of archery
    as stated in the note.
