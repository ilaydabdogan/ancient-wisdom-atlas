canonical_text:
  quote: ''
  summary: Khara and his demon host approach Ráma’s hermitage. Ráma reads ominous
    signs of battle and sends Lakshmaṇ with Sítá to a mountain cave for shelter. Ráma
    arms himself and stands alone as gods, saints, and heavenly beings gather to watch
    and pray for his victory. The giant host advances with drums, flags, shields,
    and war cries, while forest creatures flee. Ráma faces the army in wrath, described
    through comparisons to fire, Rudra, and Śiva.
  language: English
  quote_policy: summarized
