canonical_text:
  quote: ''
  summary: After the war, an unnamed Vánar tells Ráma that Sítá waits in grief to
    meet him. Ráma orders Vibhishaṇ to have Sítá bathed, adorned, and brought before
    him. Sítá is conveyed in a screened litter, but Ráma orders the litter set down
    and permits the assembled Vánars to see her. Sítá approaches Ráma with shame,
    fear, and joy. Ráma then publicly declares that he fought for honor rather than
    love and rejects her because Rávaṇ had abducted and held her. Sítá replies that
    her heart remained true, recalls her birth from the earth and her marriage, and
    asks Lakshmaṇ to prepare a fire-pile as refuge from her disgrace.
  language: English
  quote_policy: summarized
