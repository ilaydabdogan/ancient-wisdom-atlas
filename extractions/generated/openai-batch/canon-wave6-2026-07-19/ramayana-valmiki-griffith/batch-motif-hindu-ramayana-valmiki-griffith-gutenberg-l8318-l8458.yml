canonical_text:
  quote: "“An infant springing from the earth, / Named Sítá from her secret birth.”"
  summary: Janak honors Viśvámitra and the visiting princes. The next morning Viśvámitra
    asks Janak to show Daśaratha’s sons the treasured bow. Janak explains that the
    bow belonged to Rudra at Daksha’s sacrifice, was preserved by Janak’s ancestors,
    and became the test for Sítá’s marriage after Janak found her as an infant while
    ploughing. Many suitors failed to lift the bow and besieged Mithilá; divine aid
    came after Janak’s penance. Janak declares that if Ráma can string the bow, Sítá
    will be given to him.
  language: English
  quote_policy: quoted
