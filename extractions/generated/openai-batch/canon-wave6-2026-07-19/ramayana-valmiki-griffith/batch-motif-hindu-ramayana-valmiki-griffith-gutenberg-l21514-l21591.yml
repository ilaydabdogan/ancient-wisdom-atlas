canonical_text:
  quote: ''
  summary: At dawn, heralds and bards praise Bharat with auspicious voices and instruments.
    Bharat, distressed, stops the sounds and states that he is not king, then laments
    Kaikeyí’s deed, Daśaratha’s death, and the absent lord expelled to the forest.
    Vaśishṭha enters the assembly, sits on a golden seat, and orders messengers to
    gather social, military, royal, and court figures. The people arrive with vehicles
    and acclaim Bharat as they would greet a king; the assembly is compared to Daśaratha’s
    presence and to an unruffled lake with snakes, monsters, shells, gems, and gold.
  language: English
  quote_policy: summarized
