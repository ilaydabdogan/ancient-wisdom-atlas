canonical_text:
  quote: ''
  summary: Ráma leaves Guha and boards a boat on the Gangá with Lakshmaṇ and Sítá.
    After ritual actions and farewells, the party crosses the river. In midstream
    Sítá prays to Gangá for Ráma’s protection, his fulfillment of Daśaratha’s command,
    and their eventual return, promising offerings and sacrifice. After landing, Ráma
    arranges the walking order to protect Sítá as they enter the forest. They rest
    beneath a fig tree, see a lotus lake, drink water, hunt and cook a deer, choose
    the tree as shelter, perform evening rites, and prepare to keep vigil through
    their first night away.
  language: English
  quote_policy: summarized
