  quote: "“The borrowed form was cast away, / Before mine eye a giant lay”"
  summary: Rama rebukes Lakshman for leaving Sita undefended and notes her absence
    and an ominous bodily throbbing. Lakshman explains that Sita heard a cry that
    seemed to be Rama’s voice, demanded he go to Rama, and accused him when he resisted.
    Rama then says he killed a treacherous giant that had lured him away in a borrowed
    quarry-form; after being shot, the giant appeared in its own form and cried out
    in Rama’s voice, causing Lakshman to leave Sita alone.
