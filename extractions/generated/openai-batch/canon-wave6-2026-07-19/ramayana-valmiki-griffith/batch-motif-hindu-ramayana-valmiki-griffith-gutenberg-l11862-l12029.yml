canonical_text:
  quote: ''
  summary: A distressed king confronts Queen Kaikeyí over her demand that Ráma’s consecration
    be stopped, that her own son receive rule, and that Ráma be sent to the woods.
    At dawn the sage Vaśishṭha arrives with ritual materials and royal insignia for
    Ráma’s installation. Sumantra enters the king’s chamber and praises him, urging
    him to rise and authorize the consecration.
  language: English
