canonical_text:
  quote: "“Let Ráma cleave thine arms away / And on the pyre thy body lay”"
  summary: Danu explains that Indra’s curse gave him a monstrous form and that release
    will come when Ráma and Lakshmaṇ sever his arms and burn his corpse. Ráma asks
    for help finding his abducted spouse, and Danu promises, after funeral rites,
    to direct him to a future ally who knows the giant robber.
