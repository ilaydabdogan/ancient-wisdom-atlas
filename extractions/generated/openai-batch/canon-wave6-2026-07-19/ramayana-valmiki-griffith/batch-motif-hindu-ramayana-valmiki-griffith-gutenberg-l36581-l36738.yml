canonical_text:
  quote: ''
  summary: Kabandha regains a radiant form, departs heavenward, and directs Ráma toward
    Sugríva. Ráma and Lakshmaṇ travel to Pampá and are received by the aged devotee
    Śavarí, who honors them with water and stored fruits. Śavarí recounts her masters'
    prophecy that Ráma would visit and that she would then pass to undecaying worlds.
    She shows the brothers Matanga's sacred grove, its altar, lakes, wet bark garments,
    and unfading flowers preserved by ascetic power. With Ráma's consent she gives
    up her body to flame, rises in heavenly form, and attains a holy sphere.
  language: English
  quote_policy: summarized
