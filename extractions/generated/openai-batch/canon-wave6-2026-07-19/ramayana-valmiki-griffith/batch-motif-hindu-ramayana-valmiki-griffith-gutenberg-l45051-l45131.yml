canonical_text:
  quote: ''
  summary: The Vánar approaches Lanká through fragrant groves and sees its splendid
    gardens, waters, walls, gates, mansions, and armed defenses. At the northern gate
    he reflects that the city is nearly impossible to conquer by force or policy,
    and that his task is to find the captive Maithil queen. He resolves to enter secretly
    by night in a form that will evade the demons’ sight, reduces his body to the
    size of a cat, and enters the city in moonlight.
  language: English
  quote_policy: summarized
