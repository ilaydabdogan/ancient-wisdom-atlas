canonical_text:
  quote: ''
  summary: After Rávaṇ’s death, heaven celebrates Ráma’s victory and the deeds of
    his allies. Ráma orders Lakshmaṇ to consecrate Vibhishaṇ as ruler of Lanká using
    sea water in a golden urn. Ráma then sends Hanúmán to tell Sítá that Rávaṇ is
    dead, Lakshmaṇ and Sugríva live, and all is well. Hanúmán finds Sítá guarded in
    a garden, delivers Ráma’s message, offers to punish her guards, and receives Sítá’s
    refusal and her wish to see Ráma. Hanúmán promises the reunion will come soon
    and returns with her message.
  language: English
  quote_policy: summarized
