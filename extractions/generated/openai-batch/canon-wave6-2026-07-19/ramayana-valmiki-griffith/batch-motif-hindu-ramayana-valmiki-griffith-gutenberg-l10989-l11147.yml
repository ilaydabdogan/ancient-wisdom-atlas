canonical_text:
  quote: ''
  summary: Kaikeyí, following the counsel of her hump-backed maid, stages herself
    in the mourner’s room by casting off ornaments, lying on the floor, and declaring
    that she will die unless Ráma is banished and Bharata made king. Daśaratha, having
    arranged Ráma’s installation and come to Kaikeyí’s palace to share the news, finds
    her absent from her bower. A warder reports that she is in the mourner’s cell,
    and the king discovers her lying on the ground in distress.
  language: English
