canonical_text:
  quote: "“Ráma’s shoes are here regarded as the emblems of royalty or possession.”"
  summary: The passage first presents a divine address to Ráma, identifying him with
    Vishṇu, Krishṇa, Prajápati, and the Vámana incarnation, saying that Sítá is Lakshmí
    and that Ráma assumed human form to kill Rávaṇa. It then describes the Bharat-Miláp
    festival scene of Ráma’s triumphant return and meeting with Bharat, including
    processions, spectators, flowers, music, and public joy. A note interprets Ráma’s
    shoes, borne by Bharat, as emblems of royalty or possession and compares this
    with Hebrew and Greenlandic shoe imagery. The passage ends by introducing Gorresio’s
    note about peoples in Lanká/Ceylon hostile to Aryan worship.
  language: English
  quote_policy: quoted
