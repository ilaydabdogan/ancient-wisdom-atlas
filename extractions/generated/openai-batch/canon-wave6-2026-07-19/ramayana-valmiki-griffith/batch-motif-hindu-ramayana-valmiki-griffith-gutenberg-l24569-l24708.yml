canonical_text:
  quote: ''
  summary: Bharat, speaking beside the river, praises Ráma’s wisdom and steadiness,
    asks him to pardon Kaikeyí and Daśaratha, argues that royal consecration and rule
    are Ráma’s proper duties, and pleads for him to return to Ayodhyá as rightful
    king. Bharat says he will live in the forest too if Ráma refuses. Ráma remains
    firm in keeping his father’s decree, while the people weep, approve his steadfastness,
    and support Bharat’s plea.
  language: English
  quote_policy: summarized
