canonical_text:
  quote: Like the Gods’ heavenly pathway showed / That mighty host’s imperial road.
  summary: Skilled workers, guides, guilds, and star readers prepare an imperial road
    and royal camps for Bharat by clearing and leveling ground, managing water, placing
    wells, tanks, and altars, and adorning the route and encampments with trees, banners,
    flowers, sandal-water, and palace-like structures compared to heavenly and royal-celestial
    settings.
  language: English
  quote_policy: quoted
