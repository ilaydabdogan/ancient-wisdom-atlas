canonical_text:
  quote: ''
  summary: Ráma leaves a former hermitage because it recalls Bharat, his mother, and
    Bharat’s encampment. With Sítá and Lakshmaṇ he visits Atri’s retreat, where Atri
    welcomes them and presents Anasúyá as a venerable ascetic benefactress. Anasúyá
    receives Sítá, teaches her about wifely devotion and its heavenly reward, and
    Sítá replies by affirming her devotion to Ráma, recalling marriage counsel and
    citing faithful wives such as Sávitrí and Rohiṇí. Pleased, Anasúyá offers Sítá
    a boon from her ascetic merit, but Sítá says nothing remains to be wished.
  language: English
  quote_policy: summarized
