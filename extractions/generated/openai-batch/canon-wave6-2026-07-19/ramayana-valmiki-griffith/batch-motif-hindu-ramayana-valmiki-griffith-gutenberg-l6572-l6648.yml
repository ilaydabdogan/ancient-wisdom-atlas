canonical_text:
  quote: ''
  summary: Gautam curses his wife to long solitary penance, declaring that Ráma’s
    future arrival and her proper hospitality to him will cleanse and restore her.
    Gautam departs to Himálaya for austerities. Ráma and Lakshman enter the grove,
    behold the hidden penitent Ahalyá, receive her hospitality, and the gods celebrate
    her purification. Gautam returns, honors Ráma, takes Ahalyá back to his side,
    and Ráma continues toward Mithilá.
  language: English
  quote_policy: summarized
