  summary: The passage is a set of translator/editorial notes comparing Manu with
    Minos and Mannus; defining mythological beings, places, weapons, castes, animals,
    seasons, and rites; and explaining names such as Amarávatí, Pátála, Bhogavatí,
    Ayodhyá, Kaśyap/Kashmír, Sindhu/Hind, and several regions. It includes notes on
    Nāgas as serpent-bodied demigods, Indra’s city and attendants, sons and paradise,
    the six-season year, and the wandering sacrificial horse before immolation.
