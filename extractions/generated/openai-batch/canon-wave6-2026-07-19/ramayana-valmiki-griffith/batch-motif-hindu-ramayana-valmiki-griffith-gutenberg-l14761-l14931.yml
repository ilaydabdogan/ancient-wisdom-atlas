candidate_motifs:
- id: motif:1
  label: Departure gifts before exile or forest departure
  taxonomy_refs:
  - departure
  basis: The passage frames the gifts as occurring before Sita goes to live in the
    wood and before Rama tells the people to guard the houses until his return.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The broader exile context is only partly present in this passage; the
    passage explicitly mentions departure to the wood and later return.
- id: motif:2
  label: Sacred exchange through gifts to Brahmans and ritual specialists
  taxonomy_refs:
  - sacred_exchange
  basis: Rama honors Suyajña with ritual deference and gifts, Suyajña blesses Rama,
    Lakshman, and Sita, and Rama orders extensive gifts to Brahmans and religious
    attendants.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage shows gift, honor, and blessing; it does not explicitly theorize
    the exchange beyond the narrated acts.
- id: motif:3
  label: Just ruler’s redistribution of treasure
  taxonomy_refs:
  - royal_legitimacy
  basis: Rama publicly brings out stored wealth and distributes gems and gold to the
    poor, young, old, and twice-born, while also caring for his mother’s Brahmans
    and household dependents.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text depicts royal largesse and care for dependents; a political legitimacy
    reading is a cautious motif assignment rather than an explicit statement.
- id: motif:4
  label: Royal support for sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Trijaṭ asks for means to aid his sacrifice, and Rama gives wealth to speed
    the offering.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: Only the provision for sacrifice is narrated; the sacrifice itself is
    not described.
- id: motif:5
  label: Staff throw determines the extent of a gift
  taxonomy_refs: []
  basis: Rama says Trijaṭ will receive cows as far as he can throw his staff; Trijaṭ
    throws it to the far bank of the Sarju, and the cows within that range are driven
    to his cottage.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage presents the action as Rama’s jest or sport; no taxonomy reference
    is supplied for this motif.
