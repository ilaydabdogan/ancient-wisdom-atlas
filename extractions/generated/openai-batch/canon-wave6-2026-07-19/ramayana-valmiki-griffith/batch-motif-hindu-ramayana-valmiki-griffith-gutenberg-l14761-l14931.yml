canonical_text:
  quote: ''
  summary: In Canto XXXII, Rama, preparing to depart for the wood, receives the Brahman
    Suyajña and gives him ornaments, a bed, an elephant, and gold, including gifts
    requested by Sita for Suyajña’s wife. Rama then instructs Lakshman to distribute
    cattle, wealth, vehicles, robes, and coins to Brahmans, sages, attendants of Kausalya,
    Chitraratha, grammarians, and others. Rama addresses the grieving people, asks
    them to guard his and Lakshman’s houses until his return, and distributes treasure
    to the poor, young, old, and twice-born. A poor Brahman named Trijaṭ, urged by
    his wife, petitions Rama; Rama jokingly promises him cows as far as he can throw
    his staff. Trijaṭ throws the staff to the far bank of the Sarju, and Rama gives
    him the cows, herdsmen, and further wealth for sacrifice.
  language: English
  quote_policy: summarized
