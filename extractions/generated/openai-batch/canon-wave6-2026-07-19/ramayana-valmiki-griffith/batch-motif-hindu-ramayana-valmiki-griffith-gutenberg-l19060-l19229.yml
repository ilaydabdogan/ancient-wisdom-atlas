canonical_text:
  quote: ''
  summary: Daśaratha, grieving after Rāma has been sent to the woods, speaks to Kauśalyá
    at midnight and recounts an old crime from his youth. He says that actions bear
    consequences, recalls the rainy season and a night hunt along the Sarjú, and describes
    shooting by sound at what he thought was an elephant. The arrow instead strikes
    a hermit youth who had come to fill a jar with water for his blind, aged parents.
    The dying youth laments his parents, says the same shaft has doomed all three,
    and instructs the king to tell his father, seek pardon, and remove the dart.
  language: English
  quote_policy: summarized
