canonical_text:
  quote: ''
  summary: Bharat approaches the hermitage of Bharadvája with humility, leaving his
    army and war gear behind and following Vaśishṭha. Bharadvája receives the visitors
    with ritual hospitality, questions Bharat’s intentions toward the exiled Ráma,
    and hears Bharat deny any wish to usurp or harm his elder brother. Bharat states
    that he seeks Ráma in order to bow at his feet and lead him back to the royal
    seat. Bharadvája praises Bharat, directs him to Ráma’s dwelling at Chitrakúṭa,
    and invites him to stay. In the next canto, Bharadvája wishes to entertain Bharat’s
    whole army, while Bharat explains that he kept the troops away out of reverence
    and to avoid damaging the hermitage, trees, springs, and huts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bharat sees the hermitage from a distance, leaves his warrior multitude and
    warlike gear behind, wears linen robes, goes on foot, and follows Vaśishṭha reverently.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bharadvája rises to greet Vaśishṭha and Bharat, gives a grace-gift, water
    for their feet, and fruit, and asks in order about conditions in Ayodhyá.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vaśishṭha and Bharat ask about the hermit’s welfare, including holy fires,
    pupils, trees, birds, and deer; Bharadvája answers that all is well in the holy
    shade.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bharadvája asks why Bharat has come, recalls Ráma’s banishment with his wife
    and brother for fourteen years, and voices suspicion that Bharat might wish to
    harm Ráma or enjoy his elder brother’s realm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bharat replies tearfully that he does not approve his mother’s words and has
    come to win Ráma’s grace, bow at his brother’s feet, and lead him to the royal
    seat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bharadvāja says Bharat’s deed is worthy, states that his earlier words were
    spoken to increase Bharat’s fame, and identifies Ráma’s dwelling at Chitrakúṭa
    with his brother and wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bharadvāja asks Bharat to remain for the night and later expresses a wish
    to entertain and banquet Bharat’s entire armed train.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Bharat explains that he brought no troops to the hermitage out of awe for
    the sage and concern that men, elephants, and horses might harm the holy ground,
    trees, springs, and huts.
  category: speech
  evidence_refs:
  - ev:8
