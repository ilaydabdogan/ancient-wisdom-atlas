canonical_text:
  quote: ''
  summary: After a night of sorrow, Brahman counsellors meet and address Vaśishṭha.
    They say the king has died, Ráma and Lakshmaṇ are in the forest, and Bharat and
    Śatrughna are away in Kekaya. They urge that a scion of Ikshváku be consecrated,
    arguing through a long catalogue that a kingless land loses rain, agriculture,
    domestic order, sacrifice, festivals, security, trade, learning, law, and moral
    boundaries. The monarch is praised as protector of truth and right, parent and
    friend of the people, and the speakers pledge obedience to Vaśishṭha’s decree.
  language: English
  quote_policy: summarized
