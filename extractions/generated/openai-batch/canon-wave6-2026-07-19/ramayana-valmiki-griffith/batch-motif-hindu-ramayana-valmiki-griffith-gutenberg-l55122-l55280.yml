canonical_text:
  quote: ''
  summary: Rama mourns the apparently dead Lakshman, but Sushena declares that Lakshman
    still lives and sends Hanuman to fetch healing herbs from Mahodaya. Hanuman brings
    the whole mountain, Sushena prepares the fragrant herb, and Lakshman rises healed.
    Rama returns to battle. Seeing an unequal fight between chariot-borne Ravana and
    Rama on foot, Indra sends Matali with a divine chariot and weapons. Ravana’s arrows
    become fiery serpents, which Rama counters with the Feathered King’s weapon. After
    ominous disturbances, Rama uses Indra’s spear and arrows to crush Ravana’s lance,
    kill his horses, and wound him.
  language: English
  quote_policy: summarized
