canonical_text:
  quote: "“therefore this wicked one shall be destroyed by man.”"
  summary: In the appendix section “Rávan Doomed,” Rishyaśring performs a sacrifice
    so King Daśaratha may obtain sons. The gods grant the request for four sons, then
    complain to Brahmá that Rávaṇa oppresses the universe under a boon of invulnerability.
    Brahmá identifies that Rávaṇa did not ask protection against man. Vishṇu arrives,
    is asked to become Daśaratha’s son in four parts through the king’s three consorts,
    and promises to incarnate among men, destroy Rávaṇa, and protect the earth.
  language: English
  quote_policy: quoted
