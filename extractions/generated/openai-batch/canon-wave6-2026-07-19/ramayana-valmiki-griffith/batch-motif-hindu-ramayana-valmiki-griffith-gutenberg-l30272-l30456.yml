canonical_text:
  quote: ''
  summary: Khara makes a final assault on Ráma, uprooting and hurling a Sál-tree.
    Ráma stops the attack, wounds Khara with many arrows, and kills him with a fiery
    arrow named Brahmá’s staff, given by Indra. The gods and celestial hosts praise
    Ráma and rain flowers on him. Saints led by Agastya state that Ráma’s victory
    has freed the ascetics of Daṇḍaka from the giants. Lakshmaṇ and Sítá emerge from
    a mountain cavern, and Sítá joyfully embraces Ráma. Akampan, a surviving giant,
    flees to Lanká and reports the destruction of Janasthán’s demons to Rávaṇ, who
    angrily boasts of his power and asks whether Ráma had divine aid.
  language: English
  quote_policy: summarized
