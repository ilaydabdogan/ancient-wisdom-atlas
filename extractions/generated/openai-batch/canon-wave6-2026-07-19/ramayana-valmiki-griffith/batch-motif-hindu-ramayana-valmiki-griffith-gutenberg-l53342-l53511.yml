canonical_text:
  quote: ''
  summary: Rāma sees Kumbhakarṇa approaching and asks Vibhīṣaṇa who he is. Vibhīṣaṇa
    recounts Kumbhakarṇa’s immense strength, his violent birth, his conflict with
    Indra, and Brahmā’s curse that he sleep for six months and wake for one day. Rāma
    orders the Vānars to block the approaches. Kumbhakarṇa enters Laṅkā, meets Rāvaṇa,
    and learns that Rāma has crossed the sea and besieged the city. Kumbhakarṇa rebukes
    Rāvaṇa for ignoring earlier counsel and urges him to return Sītā to her lord,
    but Rāvaṇa asks him to repair the king’s errors in battle.
  language: English
  quote_policy: summarized
