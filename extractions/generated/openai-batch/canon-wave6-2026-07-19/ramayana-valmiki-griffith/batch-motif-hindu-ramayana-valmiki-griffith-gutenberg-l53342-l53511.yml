- id: motif:2
  label: divine curse restraining a world-threatening being
  taxonomy_refs:
  - divine_judgment
  - chaos
  basis: Kumbhakarṇa’s appetite threatens to desolate the world, so Brahmā imposes
    a curse that renders him senseless and asleep for long periods.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the restraint as Brahmā’s curse; broader cosmological
    interpretation should be reviewed.
- id: motif:3
  label: awakened giant defender in time of siege
  taxonomy_refs: []
  basis: Rāvaṇa awakens Kumbhakarṇa in fear after Rāma crosses the sea, surrounds
