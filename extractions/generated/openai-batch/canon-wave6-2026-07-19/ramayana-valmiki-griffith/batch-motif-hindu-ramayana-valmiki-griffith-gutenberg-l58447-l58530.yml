canonical_text:
  quote: ''
  summary: The passage is a set of additional notes. It recounts Paraśurāma’s destruction
    of the Kshatriyas, blood libations, sacrificial gifting of the earth, and retirement
    to Mahendra mountain; discusses a suspected interpolation making Rāma an incarnation
    of Vishṇu; compares Yama with Iranian Jima/Jamshid; contrasts Indian and Greek
    ideas of fate; describes Viśvámitra’s attainment of Brahman status and rivalry
    with Vaśishtha; and explains household gods, domestic cult objects, snake guardians,
    offerings, and a comparison with genii locorum.
  language: English
  quote_policy: summarized
