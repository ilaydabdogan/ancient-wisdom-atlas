canonical_text:
  quote: ''
  summary: Śūrpaṇakhā sees the battlefield where Rāma has slain fourteen thousand
    warriors and their leaders, then flees to Laṅkā. The passage describes Rāvaṇ enthroned
    among counsellors, his monstrous body and battle scars, his powers, thefts, desecrations,
    austerities, partial invulnerability, and hostility to sacrifice and Brahmans.
    Śūrpaṇakhā approaches him, still bearing marks on her face, and begins to speak
    in anger.
  language: English
  quote_policy: summarized
