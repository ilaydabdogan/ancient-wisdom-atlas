canonical_text:
  quote: ''
  summary: The passage recounts Ráma’s arrival at the sea, the bridge to Lanká, the
    defeat of Rávaṇ, Sítá’s trial by fire and vindication, divine approval, the revival
    of slain chieftains, and Ráma’s return to reign in Ayodhyá in a renewed Golden
    Age. It then states benefits for those who read or hear the poem. The next canto
    begins with Válmíki honoring the departing seer, going with Bharadvája to the
    Tamasá, performing bathing and libations, witnessing a fowler kill one of a pair
    of curlews, uttering a curse in measured verse, naming that form a śloke, and
    returning home absorbed in thought.
  language: English
  quote_policy: summarized
