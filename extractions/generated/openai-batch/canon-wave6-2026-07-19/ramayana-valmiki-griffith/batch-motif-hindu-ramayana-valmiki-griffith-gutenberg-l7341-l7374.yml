canonical_text:
  quote: ''
  summary: A saint empowered by divine lore uses a Brāhman wand or staff to devour
    the dart of Brahmā; sparks and smoke issue from him and the staff glows with world-threatening
    imagery. Awed hermits praise him and ask him to restrain his might so the worlds
    may rest, saying Viśvámitra has been defeated. The saint calms his wrath. The
    overpowered king acknowledges the superiority of Brāhman power over warrior strength
    and resolves to undertake austerity to win Brāhmanhood.
