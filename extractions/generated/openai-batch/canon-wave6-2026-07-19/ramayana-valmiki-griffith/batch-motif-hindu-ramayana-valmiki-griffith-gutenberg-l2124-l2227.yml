canonical_text:
  quote: ''
  summary: Rishyaśring tells his father Vibháṇdak about alluring visitors who embraced,
    sang, and danced before him. Vibháṇdak warns him against them, but after his father
    leaves, Rishyaśring follows the damsels. Rain falls as he is led away and again
    as he reaches the royal town. Vibháṇdak searches for him, then learns that King
    Lomapád of Anga has bestowed villages, cattle, and riches on Rishyaśring. Lomapád
    honors Rishyaśring as a high guest, seeks his grace, and gives him his daughter
    Śántá as wife.
  language: English
  quote_policy: summarized
