canonical_text:
  quote: ''
  summary: Báli hears Sugríva’s challenge while resting with Tárá and becomes enraged.
    Tárá embraces him, warns him that Sugríva’s return after defeat implies powerful
    help, reports that Ráma and Lakshmaṇ have allied with Sugríva, and urges peace,
    shared rule, and friendship. Báli rejects the warning, says he must answer dishonor,
    intends to subdue Sugríva, and departs after Tárá circles him, blesses him, and
    withdraws in grief.
  language: English
  quote_policy: summarized
