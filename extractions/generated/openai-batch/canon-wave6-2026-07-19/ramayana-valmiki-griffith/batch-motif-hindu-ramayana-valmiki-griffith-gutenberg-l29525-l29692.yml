canonical_text:
  quote: ''
  summary: Khara advances with his demon host against Ráma at the leafy shed. The
    demons attack with darts, arrows, and many weapons, while Ráma, alone and wounded,
    withstands the assault and answers with countless arrows. Many demons, animals,
    chariots, and warriors are cut down. Survivors flee to Khara; Dúshaṇ rallies them
    for a renewed assault with rocks, trees, and weapons. Surrounded from all directions,
    Ráma shouts, releases his Gandharva arrow, darkens the air with arrows, and leaves
    the field covered with slain and mangled foes and broken battle gear.
  language: English
  quote_policy: summarized
