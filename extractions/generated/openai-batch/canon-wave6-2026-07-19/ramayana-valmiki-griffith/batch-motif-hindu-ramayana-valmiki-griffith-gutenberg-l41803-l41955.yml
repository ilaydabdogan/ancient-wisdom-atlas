canonical_text:
  quote: ''
  summary: Lakshmaṇ enters Sugríva’s splendid Vánar city and royal residence, observes
    the pleasure-filled court, and angrily sounds his bowstring. Sugríva, afraid,
    asks Tárá to appease him. Tárá approaches; Lakshmaṇ bows and calms. When she asks
    the cause of his fury, Lakshmaṇ condemns Sugríva for neglecting duty, state affairs,
    friendship, and the agreed time to aid Ráma.
  language: English
  quote_policy: summarized
