canonical_text:
  quote: ''
  summary: Bhagírath performs severe austerity until Śiva agrees to receive Gangá
    on his head. Gangá descends from the sky in anger, is confined in Śiva’s hair,
    and later released into earthly channels. She follows Bhagírath, purifies beings
    who touch her, is briefly swallowed and released by Jahnu, and finally reaches
    the ocean and nether caves where her waters and Bhagírath’s libation bring beatitude
    to Sagar’s sons.
  language: English
  quote_policy: summarized
