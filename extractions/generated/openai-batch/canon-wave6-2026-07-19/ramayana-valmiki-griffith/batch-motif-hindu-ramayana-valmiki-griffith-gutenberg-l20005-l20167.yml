canonical_text:
  quote: ''
  summary: Bharat is troubled by a dream in which his father the king appears amid
    degrading and catastrophic signs, including mire, oil, cosmic disorder, ominous
    women, a southward ass-drawn chariot, and a monstrous touch. Bharat interprets
    the dream as foretelling the death of the king, Ráma, Lakshmaṇ, or himself. Royal
    envoys then arrive with gifts and a summons from the household priest and peers
    for Bharat to come quickly to his father’s house. Bharat asks after his family,
    receives reassuring answers, agrees to depart, and is blessed by his maternal
    grandfather.
  language: English
  quote_policy: summarized
