canonical_text:
  quote: ''
  summary: A band of Vánars flies to Sugríva’s fenced honey grove, guarded by Dadhimukh.
    They ask Angad for permission to eat the honey; after he consents, they consume
    the honey and fruit, become drunk with sweetness, revel noisily, and damage the
    trees. Dadhimukh tries to stop them, but they reject his warnings and beat him.
    A summary note says Dadhimukh reports the misconduct to Sugríva, who infers that
    Hanumán and his band have succeeded in their search and treats the disorder as
    an expression of joy.
  language: English
