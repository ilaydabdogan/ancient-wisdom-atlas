canonical_text:
  quote: ''
  summary: Ráma calms Lakshmaṇ’s anger by rejecting suspicion of Bharat and renouncing
    any kingship gained through harm to kin. Lakshmaṇ is ashamed. Ráma observes the
    approaching host and royal signs. Bharat restrains the army, organizes a search,
    expresses longing to see Ráma and restore him to hereditary rule, praises Sítá
    and the forest dwelling, then recognizes Ráma’s cot by smoke and proceeds with
    Guha.
  language: English
  quote_policy: summarized
