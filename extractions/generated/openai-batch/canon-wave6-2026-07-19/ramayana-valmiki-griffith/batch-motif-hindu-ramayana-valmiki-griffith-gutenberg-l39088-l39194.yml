canonical_text:
  quote: ''
  summary: Ráma travels with Sugríva and companions toward Kishkindhá to confront
    Báli. On the way, Ráma asks about a beautiful grove. Sugríva explains that the
    sacred Seven practiced severe vows there, later went to heaven, and left the grove
    charged with sanctity. He instructs Ráma and Lakshmaṇ to revere the saints; they
    bow and continue to Kishkindhá’s gate, armed for battle.
  language: English
  quote_policy: summarized
