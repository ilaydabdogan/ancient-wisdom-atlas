canonical_text:
  quote: ''
  summary: After the western legions depart, Sugríva commands Śatabal and a large
    Vánar force to search the northern regions for Janak’s daughter and the fiend
    or robber. The itinerary moves through snow mountains, sacred grounds, a desolate
    waste, Kailása with Kuvera/Vaiśravaṇ’s palace, Krauncha’s pass, the blessed North
    Kurus, and finally the northern deep and Mount Somagiri, where Brahmá dwells.
    Sugríva orders the Vánars to turn back at the sunless, boundless shore.
  language: English
  quote_policy: summarized
