canonical_text:
  quote: ''
  summary: Lakshmaṇ asks to accompany Ráma into the forest, promising armed protection,
    path-clearing, food-gathering, and watchful service. Ráma accepts and tells him
    to fetch celestial weapons once given by Varuṇ to Janak and kept in the preceptor's
    hall. Lakshmaṇ retrieves the arms. Before departing to the wood, Ráma plans gifts
    and provision for Brahmans and household servants and summons Suyajǹa.
  language: English
  quote_policy: summarized
