- id: obs:1
  text: Lakshmaṇ is described as faithful and answers Ráma in eloquent speech after
    being addressed in gentle, loving words.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lakshmaṇ says that if Bharat, raised as king, fails to care for the queens
    through pride or bad counsel, Lakshmaṇ will kill the bad counsellor, helpers,
    and even oppose the three worlds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lakshmaṇ says Kauśalyá has support from a thousand champions and a thousand
    grain-rich hamlets, and that she and his own mother can live on ample revenue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lakshmaṇ asks to follow Ráma and says that doing so contains nothing resembling
    sin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Lakshmaṇ lists the services he will perform: carry bow and quiver, bear spade
    and basket, prepare the way, bring roots, berries, and hermit fare, and watch
    over Ráma waking or asleep.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ráma tells Lakshmaṇ to bid farewell to friends and retinue and to bring celestial
    weapons and armor preserved in the preceptor's hall.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The requested arms include two celestial bows, sword-proof mail, unfailing
    quivers, and golden-hilted swords; the bows are said to have been given by Lord
    Varuṇ to Janak at a famed rite.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lakshmaṇ retrieves the heavenly arms from Ráma's teacher and shows Ráma weapons
    that gleam and are adorned with flowers on case, hilt, and sheath.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ráma says that before leaving he will bestow gold, wealth, and livelihood
