canonical_text:
  quote: "“All heavenly arms on thee bestow.”"
  summary: A saint, pleased with Rāma, bestows a catalogue of celestial weapons and
    teaches the spells that summon and control them. The weapons manifest in visible
    form and declare themselves Rāma’s servants. Rāma then asks for powers able to
    restrain the weapons, and the sage grants a further set of mysterious charms,
    which also manifest and agree to aid him when called.
