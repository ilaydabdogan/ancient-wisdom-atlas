  quote: ''
  summary: The Vánar, called the Wind-God’s son, reasons that force is the remaining
    expedient against the Rákshasas. He decides to destroy Rávaṇ’s beloved grove in
    order to provoke him into sending armies. He then devastates the grove, tearing
    up trees, shattering fountains, and destroying pleasure structures until the place
    appears as though blasted or burned.
