canonical_text:
  quote: ''
  summary: Bharat receives gifts, animals, wealth, and counselors from King Aśvapati,
    but remains anxious and departs with Śatrughna, envoys, servants, vehicles, and
    animals. He travels eastward through many rivers, forests, towns, and resting
    places, reaching Ayodhyā after seven nights. Seeing the city silent and joyless,
    he tells his driver that its streets, gardens, birds, scents, music, and public
    movement seem lifeless, and he fears ominous consequences for his people.
  language: English
  quote_policy: summarized
