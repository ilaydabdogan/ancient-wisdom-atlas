canonical_text:
  quote: ''
  summary: Yudhájit, Bharat’s uncle, arrives with greetings from the lord of Kekaya.
    At the auspicious hour, Daśaratha, his sons, and the sages come to the prepared
    sacrificial ground for the weddings. Janak and Vaśishṭha arrange the rites, the
    altar and offerings are prepared, and Janak gives Sítá to Ráma before the fire.
    Janak also gives Urmilá to Lakshmaṇ, Mándavi to Bharat, and Srutakírti to Śatrughna.
    The princes take the brides’ hands, circle the fire and sacred ground, and celestial
    flowers, music, voices, and dancing mark the weddings before the couples return
    to the palace.
  language: English
  quote_policy: summarized
