canonical_text:
  quote: ''
  summary: Ráma proposes that he, Lakshmaṇ, Sugríva, and Vibhishaṇ ascend Suvela to
    rest and view the enemy city of Lanká, whose ruler stole his beloved. The party
    and the Vánar chiefs climb the height, see Lanká’s gates, ramparts, hosts, gardens,
    Trikúṭa peak, golden walls, and Rávaṇ’s palace. From Suvela, Ráma and Sugríva
    see Rávaṇ standing in royal state on a tower. Sugríva leaps to the tower, challenges
    Rávaṇ as Ráma’s ally, knocks down his crown, wrestles with him, and escapes through
    the air when Rávaṇ turns to magic.
  language: English
  quote_policy: summarized
