canonical_text:
  quote: ''
  summary: The passage traces Viśvámitra’s royal lineage, describes his arrival with
    an army at Vaśishṭha’s sacred ascetic retreat, and narrates Vaśishṭha’s hospitality.
    After initial courtesies and questions about royal welfare, Vaśishṭha insists
    on feeding the king and his retinue. He summons the heavenly cow Dapple-skin,
    who produces abundant foods and drinks. After the feast, Viśvámitra asks to buy
    the cow for a hundred thousand kine, calling her a wondrous jewel fit for a monarch.
  language: English
  quote_policy: summarized
