canonical_text:
  quote: ''
  summary: Sítā, seeing an apparent severed head of Rāma and his bow, faints and laments
    as if her husband has been killed. Rāvaṇ is called away to council, after which
    the head and bow disappear; he orders his forces assembled. Saramā, a Rākshas-born
    watcher who pities Sítā, privately consoles her, explains that the head and bow
    were an illusion made by a magician, and reports that Rāma is alive with his Vánar
    army on Lankā’s shore after bridging the sea.
  language: English
  quote_policy: summarized
