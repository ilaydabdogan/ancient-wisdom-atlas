canonical_text:
  quote: ''
  summary: Hermits petition Ráma for protection from shape-changing forest fiends
    who disrupt their rites and kill ascetics. The hermits say they could use ascetic
    power against the attackers but refrain in order not to waste the merit of their
    penance. Ráma tells his wife that he has promised aid and must keep his oath to
    the Bráhmans, even above life and family, then leads the way toward the holy groves
    with his bow.
  language: English
  quote_policy: summarized
