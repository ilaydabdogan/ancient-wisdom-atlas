canonical_text:
  quote: ''
  summary: The Wind-God’s son scales and ruins a temple in Lanka, kills defending
    giants, and proclaims allegiance to Kośal’s King while foretelling Sugríva’s sea-crossing
    and Rávaṇ’s fall. Jambumáli, son of Prahasta, attacks with bow and arrows but
    is finally crushed by the Vánar using a shattered tree trunk; Rávaṇ reacts by
    sending further warriors.
  language: English
  quote_policy: summarized
