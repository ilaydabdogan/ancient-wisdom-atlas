canonical_text:
  quote: "“Though none was seen to wake the song”"
  summary: Ráma, Sítá, and Lakshmaṇ travel through woodland and reach a lake from
    which unseen music is heard. The sage Dharmabhrit explains that the lake Panchápsaras
    was made by the ascetic Máṇḍakarṇi, whose severe austerities frightened the gods;
    they sent five nymphs to draw him from his vows, and he made them wives and built
    a palace under the lake. Ráma later stays among hermits for years and asks Sutíkshṇa
    how to find the hermit Agastya.
  language: English
  quote_policy: quoted
