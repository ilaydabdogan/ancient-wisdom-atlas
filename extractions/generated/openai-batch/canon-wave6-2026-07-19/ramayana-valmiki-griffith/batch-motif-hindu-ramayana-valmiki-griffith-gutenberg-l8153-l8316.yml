canonical_text:
  quote: ''
  summary: Indra sends a heavenly nymph, accompanied by alluring song, to disturb
    the hermit Viśvámitra. The hermit detects the plot and curses the nymph to become
    stone until a powerful Brahman releases her. Grieving that anger has spoiled his
    austerity, he vows silence, fasting, breath-control, and further penance to obtain
    Brahman rank. After a thousand years, Indra approaches in Brahman disguise and
    asks for food; Viśvámitra gives him all his meal and remains silent and fasting.
    His checked breath produces smoke and cosmic dread, and gods and other beings
    petition Brahmā to appease him before he destroys the worlds. Brahmā grants him
    Brahman-saint status and long life. Viśvámitra asks that the Vedas, sacrificial
    formulas, and Vasiṣṭha confirm the boon; Vasiṣṭha does so, and Viśvámitra is enrolled
    among Brahman saints.
  language: English
  quote_policy: summarized
