canonical_text:
  quote: "“Father, this be thine,”"
  summary: Ráma learns from Bharat that his father, the king, has died. He faints,
    laments his father, consoles Sítá, directs Lakshmaṇ to prepare ritual materials,
    and goes with Sítá, Lakshmaṇ, Sumantra, and his brothers to the river. There they
    offer funeral water and a food cake of jujube and Ingudí seed to the departed
    father’s shade.
  language: English
  quote_policy: quoted
