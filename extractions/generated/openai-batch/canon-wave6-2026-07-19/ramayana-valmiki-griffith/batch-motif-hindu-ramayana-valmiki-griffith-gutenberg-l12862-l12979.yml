canonical_text:
  quote: ''
  summary: Palace women lament Ráma’s impending exile and reproach the king, who faints
    from grief. Ráma goes with Lakshmaṇ to Queen Kauśalyá, who is performing vows
    and fire offerings for her son’s welfare. She greets and blesses Ráma, expecting
    his regency, but he tells her he must go to Daṇḍak wood for twice seven years
    as a hermit while Bharat receives the regent power. Kauśalyá collapses in grief.
  language: English
  quote_policy: summarized
