canonical_text:
  quote: ''
  summary: 'A footnote passage explains names, beings, ritual objects, seasonal references,
    and comparative remarks connected with the Rámáyan: Hayagríva as a form of Vishṇu;
    Aśvatara and Aśvatarí in relation to Nāgas, Gandharvas, the sun, moon, ocean,
    infernal regions, and the recovery of Sítā; Manu on punishment and heaven; Garuḍa,
    Rāhu, the Moon, Viśvarūpa, Indra, coronation rites, ablution, ascetic dress, mountains,
    rivers, birds, and rainy-season timing.'
  language: English
  quote_policy: summarized
