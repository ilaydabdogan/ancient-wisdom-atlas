  quote: ''
  summary: Sumantra leaves the king, travels through a decorated and celebratory royal
    street to Ráma’s palace, passes through guarded inner chambers, and announces
    the king’s summons. Ráma, attended by Sítá, receives him and hears that the king
    and Queen Kaikeyí seek an interview. Ráma interprets the summons as part of his
    impending consecration and prepares to obey his father’s order.
  language: English
