  summary: 'The passage gives scholarly notes: Schlegel argues that verses referring
    to followers of Buddha are spurious later additions on textual, metrical, and
    recensional grounds. A following English note states that the narrative of Ráma’s
    jungle exile is obscure, shows little clear original tradition or actual manners
    beyond ascetic self-denial associated with old Brahman sages, and nevertheless
    illuminates the poem’s intended representation of Ráma.'
