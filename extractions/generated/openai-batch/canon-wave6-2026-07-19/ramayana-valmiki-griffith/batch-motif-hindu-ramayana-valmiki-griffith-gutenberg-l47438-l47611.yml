canonical_text:
  quote: ''
  summary: Aksha attacks Hanuman from a splendid aerial chariot and is killed after
    an intense combat. Ravana then sends Indrajit, whose ordinary arrows fail but
    whose Brahma-charmed magic shaft binds Hanuman. Rakshasas tie, beat, and drag
    Hanuman to Ravana. Hanuman sees Ravana enthroned in royal splendor and judges
    that such power could have upheld the world if not opposed to right and law. Ravana
    and Prahasta question Hanuman’s identity and purpose, wondering whether he is
    Nandi, an Asur, Bali’s son, or a spy sent by major deities.
  language: English
  quote_policy: summarized
