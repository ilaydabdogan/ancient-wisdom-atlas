  summary: Rāma reproaches Lakshmaṇ for leaving Sītā alone, recounts being lured by
    a golden deer that proved to be a giant, and notes ominous signs. Seeing Lakshmaṇ
    without Sītā, he fears she has been seized or killed, explains how a deceptive
    voice drew Lakshmaṇ away, and returns with him to Janasthān, where he finds the
    cottage empty and collapses in grief.
