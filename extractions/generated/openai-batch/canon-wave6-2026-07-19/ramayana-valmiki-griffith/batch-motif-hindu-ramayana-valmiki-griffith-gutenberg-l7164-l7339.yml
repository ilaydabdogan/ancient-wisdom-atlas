canonical_text:
  quote: "“Create with all thy vigour now.”"
  summary: Vaśishṭha commands the cow to create forces, and troops spring from her
    body to defeat Viśvámitra’s army. Vaśishṭha burns the attacking royal sons. Viśvámitra
    relinquishes rule, performs penance in the Himalaya, receives weapons from Śiva,
    burns Vaśishṭha’s hermitage, and then attacks Vaśishṭha, whose Brahman staff quenches
    and absorbs the weapons. The passage ends as Viśvámitra launches Brahmá’s dart,
    terrifying gods and the three worlds.
  language: English
  quote_policy: quoted
