canonical_text:
  quote: ''
  summary: Ráma warns the wounded Sugríva against reckless danger, orders Lakshmaṇ
    to marshal the Vánar armies for the assault on Lanká, and assigns commanders to
    the city gates. The Vánar host surrounds Lanká. Ráma sends Angad as envoy to Rávaṇ
    with a final warning to restore the Maithil lady and seek pardon. Angad delivers
    the message in Rávaṇ’s court, is seized by four Rákshasas at Rávaṇ’s command,
    overpowers them, damages the palace roof, and returns through the sky to Ráma.
  language: English
  quote_policy: summarized
