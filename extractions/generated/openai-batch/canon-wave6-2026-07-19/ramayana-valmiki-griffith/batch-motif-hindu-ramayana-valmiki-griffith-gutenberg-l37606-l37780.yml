canonical_text:
  quote: ''
  summary: Ráma praises the speech, learning, and trustworthiness of Sugríva’s envoy
    Hanumán. Lakshmaṇ answers Hanumán, recounting Daśaratha’s righteous rule, Ráma’s
    exile, Sítá’s faithful departure with him, her abduction by an unnamed giant,
    and the advice to seek Sugríva’s help. Lakshmaṇ asks for Sugríva’s aid, and Hanumán
    replies that Sugríva, himself dispossessed and separated from his wife, will grant
    audience and send the Vánara hosts to search for Sítá.
  language: English
  quote_policy: summarized
