canonical_text:
  quote: ''
  summary: Ráma returns up the mountain to his cottage, embraces his brothers, and
    weeps with them and Sítá. Bharat’s army hears the cries, understands that Ráma
    and Bharat have met and are mourning their father the king, and rushes toward
    them. The tumult frightens elephants, forest animals, and birds. Ráma is found
    on his sacrificial ground; the tearful crowd curses the hump-back and the queen,
    runs to him, and receives embraces, reverence, and kind words as the heroes’ crying
    fills the landscape.
  language: English
  quote_policy: summarized
