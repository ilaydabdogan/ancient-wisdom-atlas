canonical_text:
  quote: ''
  summary: Lakshmaṇ counsels Ráma to search Janasthān again. Ráma finds the wounded
    vulture Jaṭáyus, first suspects him, then hears from him that Rávaṇ abducted Sítá,
    fought Jaṭáyus, cut his wings, and carried Sítá away through the air toward the
    south. Ráma and Lakshmaṇ mourn Jaṭáyus. Jaṭáyus gives further details, including
    Rávaṇ’s magic, an omen about recovery of stolen goods, and a prediction that Ráma
    will slay Rávaṇ and regain Sítá.
  language: English
  quote_policy: summarized
