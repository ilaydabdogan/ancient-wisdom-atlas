canonical_text:
  quote: ''
  summary: Márícha warns his giant king that the proposed seizure of Ráma's lady will
    destroy the king, his realm, Lanká, and the giant race. Though fearful and opposed,
    Márícha agrees to assist. The giant king embraces him, orders him to use a shape
    to lure the lady away, and travels with him in a jewelled flying car to Ráma's
    hermitage in Daṇḍak wood.
  language: English
  quote_policy: summarized
