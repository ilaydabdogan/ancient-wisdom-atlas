canonical_text:
  quote: ''
  summary: The passage describes a southern search expedition. A speaker gathers a
    Vánar band under Angad, names several leading members, and orders them to seek
    the Maithil queen across southern rivers, forests, caves, mountains, an island
    ruled by Rávaṇ, a shadow-grasping sea monster, sacred mountains, Agastya's sites,
    Bhogavatī of the serpent race under Vásuki, guarded sandal trees, and the boundary
    before Yama's realm. The speaker commands them to return once the lady is traced
    and promises a reward to whoever has seen her.
  language: English
  quote_policy: summarized
