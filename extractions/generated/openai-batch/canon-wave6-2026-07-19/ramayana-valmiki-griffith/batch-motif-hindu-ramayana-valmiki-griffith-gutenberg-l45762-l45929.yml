canonical_text:
  quote: ''
  summary: Hanumán enters the Aśoka grove while searching for the Maithil queen, climbs
    a tree to watch for her, sees Sítá pale and weeping under guard, identifies her
    as Ráma’s wife and Rávan’s captive, laments her suffering, recalls her furrow-birth
    and loyalty to Ráma, and observes the monstrous demon guards surrounding her beneath
    a spreading tree.
  language: English
  quote_policy: summarized
