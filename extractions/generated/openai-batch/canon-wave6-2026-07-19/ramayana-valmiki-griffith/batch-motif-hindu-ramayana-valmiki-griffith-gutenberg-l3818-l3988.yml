canonical_text:
  quote: ''
  summary: A king pleads with Viśvámitra not to take the young Ráma to defend a sacrifice
    against demons. Viśvámitra identifies Rávaṇ and his agents Márícha and Suváhu
    as threats. When the king resists, Viśvámitra rebukes him for breaking his promise,
    and his anger shakes the earth. Vaśishṭha counsels the king to keep his word,
    trust Viśvámitra, and let Ráma go, because the sage possesses celestial weapons
    that he will give to Ráma.
  language: English
  quote_policy: summarized
