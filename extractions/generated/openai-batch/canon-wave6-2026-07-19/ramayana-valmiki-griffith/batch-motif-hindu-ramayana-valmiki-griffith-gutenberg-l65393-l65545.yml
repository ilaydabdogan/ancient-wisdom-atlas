comparison_claims:
- id: claim:1
  claim: The editor compares Rávaṇ’s ten heads with multi-headed giants in Spenser
    and multi-faced cherubic beings in Milton as analogous literary images of multiple
    heads or faces.
  claim_level: visual_similarity
  target: European literary multi-headed or multi-faced beings in Spenser and Milton
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is defensive and visual; it does not establish shared
    origin, historical contact, or identical mythic function.
- id: claim:2
  claim: Gorresio’s note frames the omitted stanza as a systematic visual comparison
    between a lake and the sky, mapping aquatic features onto celestial ones.
  claim_level: visual_similarity
  target: sky-as-lake and celestial-as-aquatic imagery
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal poetic analogy, not evidence for a cross-cultural
    mythic motif by itself.
- id: claim:3
  claim: The footnote explicitly says that Antenor’s Homeric counsel to restore Helen
    is similar to the surrounding Ramayana passage’s counsel pattern.
  claim_level: same_function
  target: Pope’s Homer, Iliad Book VII, Antenor urging restoration of Helen
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The Ramayana verse to which the footnote refers is outside the supplied
    passage, so only the editor’s stated comparison can be recorded.
