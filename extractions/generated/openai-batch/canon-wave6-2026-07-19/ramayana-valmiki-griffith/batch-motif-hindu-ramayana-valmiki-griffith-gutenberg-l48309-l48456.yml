canonical_text:
  quote: ''
  summary: Ráma orders the Vánar host to march south toward the coast, declares that
    the demon lord who stole his queen will be slain, and assigns leaders to the vanguard,
    flanks, center, and rear. The Vánar army assembles from wild terrain, advances
    noisily under Sugríva’s sway, feeds on forest produce, and avoids settlements.
    Lakshmaṇ encourages Ráma by foretelling the recovery of the queen and return to
    Ayodhyá, while listing favorable earthly, animal, and celestial omens.
  language: English
  quote_policy: summarized
