  quote: "“Rávaṇ the spoiler bears me hence / The helpless prey of violence.”"
  summary: Sítá, carried away through the air by Rávaṇ, sees the vulture Jaṭáyus and
    asks him to report her abduction to Ráma and Lakshmaṇ. Jaṭáyus wakes, identifies
    himself, admonishes Rávaṇ to release Ráma’s wife, warns of Ráma’s vengeance, and
    challenges Rávaṇ despite his own old age.
