canonical_text:
  quote: ''
  summary: Sítá sees a wondrous gold-and-jewel-like deer in the forest and calls Ráma
    and Lakshmaṇ to view it. Lakshmaṇ warns that the deer may be the fiend Márícha
    in magical animal form. Sítá dismisses the warning and asks Ráma to capture the
    deer alive for her delight, or kill it for its skin if it cannot be taken. Ráma
    is moved by her request and turns to speak to Lakshmaṇ.
