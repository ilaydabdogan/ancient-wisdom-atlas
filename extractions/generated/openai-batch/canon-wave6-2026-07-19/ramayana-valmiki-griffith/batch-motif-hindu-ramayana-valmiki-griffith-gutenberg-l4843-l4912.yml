canonical_text:
  quote: "“bursting from the altar came / The sudden glory of the flame”"
  summary: As a sacred rite resumes at an altar, the fiends Márícha and Suváhu with
    their train rush in from the sky and rain blood. Ráma tells Lakshmaṇ that his
    weapons will repel them, strikes Márícha senseless and hurls him into the ocean,
    kills Suváhu with a flaming shaft, and overthrows the remaining demons with the
    Wind-God’s dart. The saints honor Ráma, the rite succeeds, and Viśvámitra says
    the retreat is now more perfect.
  language: English
