canonical_text:
  quote: ''
  summary: Sages praise the meeting of Ráma and Bharat and advise Bharat to accept
    Ráma’s righteous counsel. Bharat begs Ráma to rule, but Ráma insists on keeping
    his father’s word and counsels filial reverence toward Kaikeyí. Bharat asks Ráma
    to place gold-decorated sandals on his feet and accepts them as protectors of
    the realm. Bharat vows to live ascetically for fourteen years, delegate rule to
    the shoes, and burn himself if Ráma does not return. Ráma bids farewell; Bharat
    honors the sandals and departs with Śatrughna and the royal party, later greeting
    Bharadvája.
  language: English
  quote_policy: summarized
