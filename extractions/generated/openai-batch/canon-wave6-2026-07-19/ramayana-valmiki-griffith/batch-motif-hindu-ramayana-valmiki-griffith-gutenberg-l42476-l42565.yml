canonical_text:
  quote: ''
  summary: Ráma praises Sugríva as a truthful friend and champion, says the Rákshas
    who stole his queen has brought destruction on himself, and likens the coming
    slaying to Indra's slaying in an older queen-related episode. After Ráma speaks,
    dust, darkness, and shaking earth accompany the arrival of vast warrior hosts
    and many named chiefs from many regions. The hosts cover the plain, bow before
    Sugríva, and Sugríva reports to Ráma that all chiefs and armies are present.
  language: English
  quote_policy: summarized
