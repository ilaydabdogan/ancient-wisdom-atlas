canonical_text:
  quote: ''
  summary: Lakshmaṇ urges punishment for Sugríva if he has broken faith, but Ráma
    restrains him and sends him to speak gently. Lakshmaṇ goes armed and enraged to
    Kishkindhá, frightening the Vánaras. At the city gates he sends Angad to request
    an audience and ask whether Sugríva will aid Ráma. Angad reports the danger to
    Sugríva, Rumá, and Tárá with reverent gestures.
  language: English
  quote_policy: summarized
