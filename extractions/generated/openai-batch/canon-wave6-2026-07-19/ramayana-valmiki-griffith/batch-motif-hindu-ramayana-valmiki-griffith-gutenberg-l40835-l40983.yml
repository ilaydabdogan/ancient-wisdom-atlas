canonical_text:
  quote: ''
  summary: Hanumán asks Ráma to enter Kishkindhá and install Sugríva. Ráma declines
    because of his father’s fourteen-year mandate, directs Sugríva to be anointed
    king, and tells him to appoint Angad as partner of his rule. Because the rainy
    season is beginning, Ráma and Lakshmaṇ will remain on a hill until Kártik. Sugríva
    enters the city, is welcomed by Vānara chiefs and people, receives coronation
    substances, priestly rites, sacred water, regalia, and public acclamation, and
    then ordains Angad as partner in sovereignty.
  language: English
  quote_policy: summarized
