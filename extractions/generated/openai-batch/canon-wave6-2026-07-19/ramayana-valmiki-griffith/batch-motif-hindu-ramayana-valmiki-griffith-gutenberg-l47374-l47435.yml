canonical_text:
  quote: ''
  summary: King Rávaṇ summons five leading captains and orders them to seize the Vánar
    foe, warning that he may be no ordinary monkey and may have been sent by Indra.
    The captains go out with chariots and weapons. Durdhar shoots the Vánar, but the
    Vánar crushes Durdhar and his car. Yúpáksha and Virúpáksha attack and are killed
    with an uprooted tree. Bhásakama and Praghas attack next, and the wounded Vánar
    hurls a mountain peak on them, crushing them.
  language: English
  quote_policy: summarized
