canonical_text:
  quote: ''
  summary: Lakshmaṇ, acting under the king’s command, leaves the pregnant Sítá in
    a distant wood. Sítá collapses, laments without cursing Ráma, and asks Lakshmaṇ
    to carry a final message. The sage Válmíki hears her cries, shelters her in his
    holy grove, and promises safety for her offspring. That night Sítá bears two royal
    children, later named Kuśa and Lava, whom Válmíki teaches the Vedas and the Rámáyan.
    The boys sing the poem before Ráma; the people see Ráma’s likeness in them, and
    Válmíki identifies them as Ráma’s children and calls Sítá pure. Ráma asks that
    public doubts be removed so Sítá and her sons may be restored.
  language: English
  quote_policy: summarized
