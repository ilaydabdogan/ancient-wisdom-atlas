canonical_text:
  quote: ''
  summary: Viśvámitra explains the sanctity of the Perfect Grove through the former
    presence of Vishṇu, who as a dwarf obtained three steps of land from Bali, expanded
    to stride across the worlds, and restored rule to Indra. Viśvámitra then enters
    the hermitage with Ráma and Lakshmaṇ, receives hospitality from the hermits, begins
    initiatory sacrificial rites, and the two princes keep watch for demons who threaten
    the rite.
  language: English
  quote_policy: summarized
