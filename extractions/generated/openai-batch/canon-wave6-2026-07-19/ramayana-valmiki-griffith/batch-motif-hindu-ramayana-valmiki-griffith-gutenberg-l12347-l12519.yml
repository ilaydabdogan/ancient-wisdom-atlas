canonical_text:
  quote: ''
  summary: Sítá blesses Ráma before his expected royal consecration, invoking divine
    guardians of the four directions. Ráma departs in a radiant royal chariot with
    Lakshmaṇ attending him, receives public acclamation and women’s praise, traverses
    a decorated royal street, circumambulates sacred sites, and enters his father’s
    palace alone while the crowd waits outside.
  language: English
  quote_policy: summarized
