canonical_text:
  quote: ''
  summary: Ráma replies to Jáváli by rejecting a doctrine he calls false and impious.
    He praises truth as the basis of duty, justice, royal order, sacrificial rites,
    and heavenly reward; insists he will keep his promise to his father and remain
    in the forest; and censures Jáváli. Jáváli then says he had only used an atheist
    argument to persuade Ráma and now disavows it.
  language: English
  quote_policy: summarized
