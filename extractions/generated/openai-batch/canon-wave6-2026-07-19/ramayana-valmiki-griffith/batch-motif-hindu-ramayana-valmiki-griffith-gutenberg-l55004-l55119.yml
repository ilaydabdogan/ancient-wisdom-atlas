canonical_text:
  quote: ''
  summary: Rávaṇ advances in his chariot and drives back the Vánars. Ráma and Lakshmaṇ
    engage him with bows, but Rávaṇ checks Lakshmaṇ’s arrows and fights Ráma in a
    storm of missiles. Ráma counters Rávaṇ’s magical and animal-headed darts with
    a fire weapon sacred to the Lord of Flame. In the next phase, Vibhishaṇ kills
    Rávaṇ’s chariot horses, and Lakshmaṇ protects Vibhishaṇ from Rávaṇ’s spear. Rávaṇ
    then hurls a magic spear forged by Maya at Lakshmaṇ; Lakshmaṇ falls. Ráma grieves
    briefly, renews his attack, and Rávaṇ flees.
  language: English
  quote_policy: summarized
