canonical_text:
  quote: ''
  summary: Ráma waits reverently beside the ocean for three days, seeking passage
    for his host. When the lord of Ocean gives no answer, Ráma angrily declares that
    force is more effective than gentleness, threatens to dry or conquer the sea,
    and shoots flaming arrows into the waters. Sea creatures, serpents, and Dánavs
    in the depths are terrified. Lakshmaṇ restrains Ráma and counsels control of passion;
    voices from the air call on Ráma to spare.
  language: English
  quote_policy: summarized
