canonical_text:
  quote: ''
  summary: Ráma performs ritual preparations with his wife before his consecration.
    Ayodhyá is decorated for the rite, and citizens and countryfolk gather joyfully,
    praising Daśaratha and Ráma. Manthará views the decorated city, learns from Ráma’s
    nurse that Ráma will be consecrated, becomes angry, and goes to awaken Queen Kaikeyí
    with a warning.
  language: English
  quote_policy: summarized
