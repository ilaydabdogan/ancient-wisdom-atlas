canonical_text:
  quote: ''
  summary: Tárá urges the angry prince Lakshmaṇ to pardon Sugríva, explaining that
    love and pleasure delayed him but that he has now summoned forces to aid Ráma.
    Lakshmaṇ enters, sees Sugríva enthroned with Rumá, and then reproves Sugríva for
    ingratitude, broken promise, and failure to repay Ráma’s help, threatening that
    Ráma’s arrows may send him along Báli’s path to Yáma’s hall.
  language: English
  quote_policy: summarized
