canonical_text:
  quote: ''
  summary: Brahmá praises King Bhagírath for bringing Gangá to earth, declares that
    Sagar’s sons have gained heaven, names Gangá as Bhágirathí and Tripathagá because
    her waters pass through heaven, earth, and hell, instructs Bhagírath to bathe
    and pour libations for his kin, then ascends. Bhagírath performs the libations,
    returns purified, and rules a prosperous kingdom. The narrator tells Ráma that
    the story of Gangá’s descent grants blessings to hearers.
