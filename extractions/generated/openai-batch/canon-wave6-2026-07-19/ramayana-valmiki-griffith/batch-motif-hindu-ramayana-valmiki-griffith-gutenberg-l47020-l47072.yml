canonical_text:
  quote: ''
  summary: Sítá, the Maithil lady, gives Hanumán a message for Ráma. She recalls a
    private scene at Chitrakúṭa where a crow wounded her and Ráma launched a magically
    empowered shaft that pursued the bird until it submitted. She uses the memory
    to urge Ráma to rescue her from the Rákshas foe, and gives Hanumán a gem from
    her diadem as a token Ráma will recognize.
  language: English
  quote_policy: summarized
