canonical_text:
  quote: ''
  summary: Lakshmaṇ searches by the river and cannot find Sítá. Ráma questions the
    Godávarí, laments Sítá’s absence, and recalls her loyalty in exile. Deer silently
    indicate the southern direction in which Rávaṇ took his captive, and Lakshmaṇ
    urges Ráma to follow their signs. The brothers go south, find fallen flowers from
    Sítá’s garland, and Ráma questions and threatens a mountain and the stream for
    not revealing Sítá’s whereabouts.
  language: English
  quote_policy: summarized
