canonical_text:
  quote: ''
  summary: Bharat and Śatrughna prepare a public royal welcome for Rāma. A procession
    goes out with queens, priests, warriors, music, banners, and Rāma’s shoes. The
    Wind-God’s son identifies signs of Rāma’s approach and the aerial car carrying
    Rāma, his brothers, the rescued queen, and allies. Bharat bows to Rāma, is embraced,
    greets allies, and returns the shoes as the pledge of rule. Rāma greets the royal
    mothers and priest, then the wondrous car departs north to the Lord of Gold.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bharat orders Śatrughna to decorate shrines, burn incense, play music, summon
    royal matrons, nobles, Brāhmans, and warriors, and bring the king home in triumph.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Śatrughna orders a road prepared for Kośal’s king, with water sprinkled, garlands
    strewn, and banners and blossoms placed on towers, temples, porches, gates, roofs,
    and terraces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The welcoming procession includes nobles on elephants, chiefs on steeds and
    cars, hosts on foot, queens in litters, Brāhmans in white robes, songs, shouts,
    shells, tambours, and drums.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bharat joins the crowd with Rāma’s shoes on his head; a moon-white canopy
    and jewelled cheuries are also present for Rāma.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Rāma is not yet visible near Nandigrāma, Bharat asks the Vānara chief
    whether he has used deceptive guile and asks where Rāma is.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Wind-God’s son points to laden trees with bees and says a saint has made
    untimely fruits and shade for Rāma’s sake.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Wind-God’s son says he sees a radiant car made by Brahmā’s mind, moving
    by Brahmā’s boon, formerly Rāvan’s pride, and now bearing Raghu’s sons, the rescued
    queen, Vibhishaṇ, Sugrīva, and his retinue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The crowd cries that Rāma has arrived, descends from animals and vehicles,
    and looks toward Rāma’s face.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bharat raises reverential hands, climbs the car, bows at Rāma’s feet, and
    Rāma raises him and embraces him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bharat greets Lakshmaṇ, the Maithil dame, Sugrīva, Jāmbavān, Bāli’s son, chiefs,
    and Vibhishaṇ; he calls Sugrīva a fifth brother and praises Vibhishaṇ for fighting
    for Rāma.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Śatrughna venerates his brothers and the lady’s feet; Rāma greets Kausalyā,
    Sumitrā, Kaikeyī, other women of the household, and the household priest.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Bharat places Rāma’s shoes on Rāma’s feet and identifies them as the pledge
    that preserved the rule and lordship entrusted to Bharat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the return of the shoes, the Vānara chiefs shed tears, Rāma embraces
    Bharat, and Rāma goes to the grove where Bharat’s hermit days were spent.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Rāma’s command, the car rises high, sails through the northern sky, and
    returns to the Lord of Gold.
  category: action
  evidence_refs:
  - ev:11
