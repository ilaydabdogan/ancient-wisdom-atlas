candidate_motifs:
- id: motif:1
  label: Triumphal return of the rightful king
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: The passage centers on a prepared public reception for Rāma as king, the
    crowd’s recognition of him, and Bharat’s return of the symbols of delegated rule.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage is a reunion and restoration scene; it does not narrate the
    whole exile or preceding victory except by brief reference.
- id: motif:2
  label: Delegated rule restored through royal footwear
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: Bharat carries Rāma’s shoes, places them on Rāma’s feet, and calls them the
    preserved pledge of rule and lordship entrusted to him.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: The royal-legitimacy reading is direct; the sacred-exchange classification
    is broader because the scene presents restitution of a pledge rather than a negotiated
    exchange.
- id: motif:3
  label: Fraternal reunion after separation
  taxonomy_refs:
  - sibling_pair
  - return
  basis: Bharat bows at Rāma’s feet and Rāma raises and embraces him; Śatrughna also
    shows reverential love to his brothers.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage emphasizes loyalty and reunion, not rivalry or conflict resolution
    between the brothers.
- id: motif:4
  label: Miraculous natural signs accompanying a hero’s return
  taxonomy_refs:
  - return
  basis: The Wind-God’s son cites trees with untimely fruit and unusual shade made
    for Rāma’s sake as signs of the approaching return.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The text attributes the phenomenon to a saint’s power and Indra’s boon;
    it is not explicitly framed as an omen.
- id: motif:5
  label: Aerial vehicle of return and upward departure
  taxonomy_refs:
  - return
  - ascent
  basis: Rāma’s party arrives in a radiant car that moves at will by Brahmā’s boon,
    and the car later rises and sails north to the Lord of Gold.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: medium
  cautions: The ascent applies to the car’s departure rather than to a human apotheosis
    or spiritual ascent.
