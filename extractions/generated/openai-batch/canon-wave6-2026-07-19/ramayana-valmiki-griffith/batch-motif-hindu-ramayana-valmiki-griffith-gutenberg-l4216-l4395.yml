candidate_motifs:
- id: motif:1
  label: boon-born powerful child
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Suketu’s austerities lead Brahmá to grant him Táḍaká as a daughter endowed
    with the strength of a thousand elephants.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes divine bestowal and power, but does not narrate
    the physical birth process in detail.
- id: motif:2
  label: ritual purification after violent transgression
  taxonomy_refs: []
  basis: After Indra slays Namuchi and is soiled with stain, gods and saints purify
    him by bathing him with holy streams.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No matching motif-family taxonomy reference was supplied for purification,
    so taxonomy_refs is left empty.
- id: motif:3
  label: curse transformation into man-eating monster
  taxonomy_refs:
  - shapeshifter
  basis: Táḍaká is already described as wearing shapes at will, and Agastya’s curse
    changes her form into a fearful being that feeds on man.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage combines voluntary shape-wearing language with curse-imposed
    transformation.
- id: motif:4
  label: hero tasked to slay a road-blocking monster
  taxonomy_refs:
  - initiation
  - departure
  basis: During the journey, Táḍaká blocks the road and Viśvámitra commands Ráma to
    rely on his own right arm and kill her; Ráma accepts.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly call this an initiation, though it functions
    as an early commanded martial task.
- id: motif:5
  label: royal duty above personal compassion
  taxonomy_refs:
  - royal_legitimacy
  basis: Viśvámitra tells Ráma that a monarch’s son must prioritize the people’s welfare
    even when the deed involves pain, guilt, life, or bloodshed.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is ethical and political rather than a concrete object-symbol.
- id: motif:6
  label: fertile land made desolate by a malevolent being
  taxonomy_refs:
  - chaos
  basis: The formerly happy lands Malaja and Karúsha become a dark, dangerous forest
    because Táḍaká has long distressed them and left the country desolate.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage attributes desolation to Táḍaká but does not describe a cosmic-scale
    chaos event.
- id: motif:7
  label: divine precedent for slaying a dangerous woman
  taxonomy_refs:
  - divine_judgment
  basis: Viśvámitra justifies Ráma’s killing of Táḍaká by citing Manthará slain by
    Indra and Kávya’s mother slain by Vishṇu.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The examples are framed as legal-ethical precedents in speech; the passage
    gives only brief summaries of those cases.
comparison_claims:
- id: claim:1
  claim: Viśvámitra explicitly compares the proposed killing of Táḍaká to earlier
    cases in which Manthará was slain by Indra and Kávya’s mother was slain by Vishṇu,
    presenting them as precedents for eliminating women portrayed as dangerous or
    lawless.
  claim_level: same_function
  target: Manthará slain by Indra; Kávya’s mother slain by Vishṇu
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to Viśvámitra’s argument in this passage;
    it does not by itself establish historical contact, broader typology, or independent
    recurrence.
