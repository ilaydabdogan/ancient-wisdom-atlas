canonical_text:
  quote: ''
  summary: Ráma and another prince cross a river and encounter a dark forest. Viśvámitra
    explains that the place was once the fertile lands Malaja and Karúsha, connected
    with Indra’s purification after slaying Namuchi, but now desolated by Táḍaká.
    He recounts Táḍaká’s boon-born strength, marriage, son, and curse by Agastya,
    then commands Ráma to kill her. Ráma accepts the command.
  language: English
  quote_policy: summarized
