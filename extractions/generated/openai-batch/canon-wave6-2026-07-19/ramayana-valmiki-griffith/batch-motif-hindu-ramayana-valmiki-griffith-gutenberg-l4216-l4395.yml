  text: The two princes obey, pay reverence to each river, reach the southern shore,
    and continue their journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ráma sees a gloomy, pathless forest with birds, insects, wild animals, shrubs,
    thorns, and many trees, and asks the holy man what it is called.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Viśvámitra says that two broad, fertile lands named Malaja and Karúsha formerly
    lay where the forest now stands.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
