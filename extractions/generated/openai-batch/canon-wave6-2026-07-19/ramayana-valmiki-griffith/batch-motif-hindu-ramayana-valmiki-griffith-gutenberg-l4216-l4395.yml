    gods and saints bring golden pitchers of holy streams and bathe him pure again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Indra blesses the lands and connects their names with the washing away of
    his stain; the Immortals ratify the names.
  category: speech
  evidence_refs:
  - ev:2
