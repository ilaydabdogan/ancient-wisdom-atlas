canonical_text:
  quote: ''
  summary: Ráma, still journeying toward the wood with Sítá and Lakshmaṇ, leaves his
    chariot to walk beside aged Bráhmans. The Bráhmans lament, say their worship fires,
    sacrificial canopies, hearts, and Vedic lore go with him, and plead for him to
    return. They describe unfinished rites, trees, rooted life, and birds as affected
    by love for Ráma. As they lament, the Tamasá seems to check his progress, and
    Sumantra tends the chariot horses by the river.
  language: English
  quote_policy: summarized
