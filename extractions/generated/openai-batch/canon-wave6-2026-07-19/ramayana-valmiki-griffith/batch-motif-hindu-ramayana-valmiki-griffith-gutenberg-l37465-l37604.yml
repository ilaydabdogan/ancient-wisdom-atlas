canonical_text:
  quote: ''
  summary: Sugríva fears that two armed stranger princes may be agents of Báli and
    instructs an envoy to test their purpose by observing their speech, form, and
    temper. Hanumán, the Wind-God’s son, sets aside his Vánar form, assumes a wandering
    mendicant’s disguise, approaches the princes near Pampá and Rishyamúka, praises
    and questions them, then reveals that Sugríva seeks alliance with them. The son
    of Raghu is pleased by Hanumán’s speech and turns to Lakshmaṇ.
  language: English
  quote_policy: summarized
