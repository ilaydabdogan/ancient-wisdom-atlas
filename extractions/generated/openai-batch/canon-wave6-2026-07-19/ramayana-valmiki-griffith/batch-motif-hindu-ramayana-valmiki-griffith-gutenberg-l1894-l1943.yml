canonical_text:
  quote: ''
  summary: A king is anxious about bringing the young hermit Rishyaśring and seeks
    counsel. His attendants fear going, devise plans, and agree to send damsels disguised
    as hermits to entice the recluse away from his father’s cell. When Rishyaśring
    comes to the city, rain will fall and the king’s troubles will end. Rishyaśring
    will be joined by marriage to Śāntā and later perform the horse offering for Daśaratha,
    gaining him sons. The reporting speaker attributes the words to Sanatkumār, and
    Daśaratha asks how the hermit boy was brought.
  language: English
  quote_policy: summarized
