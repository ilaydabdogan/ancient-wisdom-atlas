canonical_text:
  quote: ''
  summary: In the devastated grove, the awakened Rákshas warders see Hanúmán, who
    enlarges himself to frighten them. They question Sítá, who says she cannot identify
    a being among form-changing fiends. Some guards report to Rávaṇ that a powerful
    monkey-form creature spoke with Sítá and ruined the grove while sparing her tree.
    Rávaṇ sends the Kinkar warriors to seize Hanúmán. Hanúmán roars, declares himself
    Ráma’s servant and the Wind-God’s son, and vows to punish the city and king before
    departing. He kills the first attackers with a club; the survivors flee, and Rávaṇ
    sends Prahasta’s son.
  language: English
  quote_policy: summarized
