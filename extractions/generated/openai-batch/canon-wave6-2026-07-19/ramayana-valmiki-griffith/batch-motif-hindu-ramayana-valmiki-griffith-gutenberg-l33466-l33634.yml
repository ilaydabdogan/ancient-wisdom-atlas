  quote: |-
    Then Rávaṇ raised her up, and bare
    His captive through the fields of air
  summary: Rávaṇ seizes Sítá, carries her away through the air, and she calls on Ráma
    and Lakshmaṇ. The world, gods, saints, animals, trees, waters, hills, and spirits
    react with fear or grief; ornaments and flowers fall from Sítá as she is borne
    away, and she finally looks in vain for help and swoons.
  language: English
