candidate_motifs:
- id: motif:1
  label: Cleft or blighted birth transformed into seven storm deities
  taxonomy_refs:
  - death_rebirth
  - divine_parent_child
  - miraculous_child
  basis: A blighted bud cleft into seven becomes the basis for Diti’s request that
    seven heavenly Maruts arise; Indra grants their divine forms and privileges.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage uses poetic language of a bud and spirits; the exact biological
    status of the bud is not further explained in this excerpt.
- id: motif:2
  label: Divine compact over offspring and status
  taxonomy_refs:
  - covenant
  - sacred_exchange
  - divine_parent_child
  basis: The passage explicitly states that mother and son made a compact after Diti’s
    petition and Indra’s grant concerning her children’s names, forms, and privileges.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The compact is stated but its formal ritual details are not described
    beyond the exchange of request and grant.
- id: motif:3
  label: Royal genealogy legitimating a city and its present ruler
  taxonomy_refs:
  - royal_legitimacy
  basis: The narrative traces Viśálá’s founding from Ikshváku’s line through named
    descendants to Sumati and says Viśálá’s kings are blessed through Ikshváku’s grace.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a lineage and blessings but does not present a contested
    succession.
- id: motif:4
  label: Honored sage and heroic youths received by a king
  taxonomy_refs:
  - culture_hero
  basis: Sumati honors Viśvámitra and asks about the armed heroic youths, who are
    reported to have stayed with the sage and slain demons.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The scene supports a heroic-guest pattern, but the broader heroic function
    of the youths lies partly outside this passage.
- id: motif:5
  label: Sacred place revealed through a hero’s question
  taxonomy_refs:
  - mystical_quest
  basis: Ráma notices a deserted holy wood near Mithilá and asks Viśvámitra to explain
    its former inhabitant and history.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The scene initiates a sacred-site narrative, but the passage excerpt ends
    before any later consequences for Ráma are shown.
- id: motif:6
  label: Deity assumes another’s form to approach a woman
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Indra assumes Gautam’s form, appears in hermit’s garb, and woos Ahalyá while
    Gautam is absent.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The transformation is limited to assumed form or disguise in the passage;
    it is not described as a broader sequence of shapeshifting.
- id: motif:7
  label: Ascetic curse as punishment for violated identity and conduct
  taxonomy_refs:
  - divine_judgment
  basis: Gautam, a powerful ascetic, recognizes Indra in his form and curses him;
    the curse immediately mars Indra’s body and drains his vigor.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The judgment is delivered by a saint rather than explicitly by a deity,
    though it affects the lord of gods and has supernatural force.
- id: motif:8
  label: Cursed or abandoned holy grove
  taxonomy_refs: []
  basis: The grove is described as once lovely and honored by gods, later aged, overgrown,
