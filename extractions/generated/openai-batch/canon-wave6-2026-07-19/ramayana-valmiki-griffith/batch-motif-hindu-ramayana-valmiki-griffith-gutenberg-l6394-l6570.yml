canonical_text:
  quote: ''
  summary: Diti asks Indra that the bud he has cleft into seven become seven heavenly
    Maruts. Indra grants that they will bear the names she devised, drink Amrit, attend
    him, and range through the three worlds. The narrator identifies the place, gives
    the founding and royal line of Viśálá down to Sumati, and recounts Sumati’s reception
    of Viśvámitra and the two princes. As the party travels toward Mithilá, Ráma notices
    an aged deserted holy wood. Viśvámitra explains that it was Gautam’s grove, where
    Indra assumed the sage’s form to approach Ahalyá; Gautam returned from ritual
    bathing, recognized Indra, cursed him, and the curse took effect.
  language: English
  quote_policy: summarized
