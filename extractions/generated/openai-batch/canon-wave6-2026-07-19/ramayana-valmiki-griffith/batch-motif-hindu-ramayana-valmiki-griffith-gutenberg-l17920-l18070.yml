canonical_text:
  quote: ''
  summary: Ráma, Sítá, and Lakshmaṇ reach Bharadvája’s hermitage near a meeting of
    waters. Ráma explains his banishment and desire for a hermit dwelling. Bharadvája
    offers hospitality and invites them to stay, but Ráma asks for a more secluded
    home; the sage directs them to the holy mountain Chitrakúṭa and describes its
    sacred peaks, animals, rivers, cave, and suitability for hermit life.
  language: English
  quote_policy: summarized
