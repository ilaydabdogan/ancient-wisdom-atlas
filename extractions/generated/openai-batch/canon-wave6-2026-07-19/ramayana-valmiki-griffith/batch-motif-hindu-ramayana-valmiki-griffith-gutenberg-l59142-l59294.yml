canonical_text:
  quote: ''
  summary: Daksha holds a great sacrifice and feast at the gates of Gangá, inviting
    the gods but excluding Umá and Shiva. Nárad comes to Umá and Shiva on Kailása
    and speaks of their absence. Umá goes to Daksha’s rite, where Daksha welcomes
    her alone and insults Shiva. In fury Umá hurls herself into the holy fire; a flame-faced
    vision identified as Umá’s Wrath emerges, and destructive beings disrupt the sacrifice.
    The sacrifice flees in the semblance of a deer, is pursued and beheaded by the
    Rudras, and Shiva later grants Daksha’s plea that the oblations not be vain; the
    Deer’s Head is said to blaze in the sky.
  language: English
  quote_policy: summarized
