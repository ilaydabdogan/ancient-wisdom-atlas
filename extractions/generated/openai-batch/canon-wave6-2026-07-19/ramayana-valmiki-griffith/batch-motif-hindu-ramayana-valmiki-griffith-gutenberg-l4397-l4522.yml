canonical_text:
  quote: ''
  summary: Ráma draws his bow to summon Táḍaká, confronts her with Lakshmaṇ and Viśvámitra
    present, first resolves to restrain and mutilate her rather than kill her, then
    kills her after she attacks with dust, stones, magic disguises, and invisibility.
    Indra and the gods praise Ráma and ask Viśvámitra to bestow heavenly weapons on
    him for future deeds. Viśvámitra blesses Ráma, and the party spends the night
    in the now curse-freed grove.
  language: English
  quote_policy: summarized
