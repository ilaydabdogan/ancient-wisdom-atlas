canonical_text:
  quote: ''
  summary: Ráma, Sumitrá’s son, and Sítá rise in the morning at Sutíkshṇa’s hermitage,
    perform purification and reverence to the gods and sacred flame, request permission
    to journey through Daṇḍak forest and visit ascetic dwellings, receive Sutíkshṇa’s
    affectionate dismissal and route-description, circumambulate him, are armed by
    Sítá with quivers, bows, and swords, and depart with Sítá beside them.
  language: English
  quote_policy: summarized
