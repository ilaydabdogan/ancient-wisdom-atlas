  quote: ''
  summary: After Ráma speaks, Lakshmaṇ reacts with visible anger and replies at length.
    He rejects Ráma’s acceptance of duty and Fate, accuses Kaikeyí and Ráma’s father
    of a deceitful succession plot favoring Bharat, vows to overcome Fate and opposition
    by force, offers to guard Ráma’s realm, and declares readiness to fight anyone
    who blocks Ráma’s royal position.
