canonical_text:
  quote: ''
  summary: Matanga curses the Vánar who polluted his holy grove with the demon bull's
    corpse and orders nearby Vánars away, threatening death or petrification. Báli
    tries unsuccessfully to appease the sage and thereafter avoids Rishyamúka. Sugríva
    explains Báli's strength to Ráma, asks for proof of Ráma's power, and proposes
    tests involving the demon's bones and the Sál trees. Ráma lightly kicks Dundubhi's
    dried frame far away, but Sugríva asks for the further test of piercing a tree
    with an arrow.
  language: English
  quote_policy: summarized
