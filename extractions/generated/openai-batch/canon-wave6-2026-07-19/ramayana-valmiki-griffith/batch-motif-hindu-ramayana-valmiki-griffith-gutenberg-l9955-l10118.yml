canonical_text:
  quote: ''
  summary: The people acclaim the king's decision. Daśaratha orders the priest Vaśishṭha
    to prepare for the consecration of his eldest son Rāma. Vaśishṭha commands servants
    to gather sacrificial materials, royal insignia, decorations, food, gifts, performers,
    and soldiers. Sumantra brings Rāma by chariot while rulers from all directions
    attend the king. Rāma bows before his father, who raises, embraces, and seats
    him on a golden throne. Daśaratha announces that Rāma will share royal power in
    Pushya's hour and gives him moral and political counsel. Rāma's friends tell Kauśalyā,
    who rewards them with jewels, gold, and cattle.
  language: English
  quote_policy: summarized
