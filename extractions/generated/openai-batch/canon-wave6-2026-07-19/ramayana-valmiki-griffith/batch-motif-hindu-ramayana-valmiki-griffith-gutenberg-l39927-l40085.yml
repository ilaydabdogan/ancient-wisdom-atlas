canonical_text:
  quote: ''
  summary: The wounded Vánar king Báli acknowledges Ráma's judgment, asks forgiveness,
    and entrusts his son Angad and wife Tárá to protection. Ráma answers that duty
    and law have been satisfied and promises care for Angad. Báli lies dying. Tárá
    hears of her husband's fall, comes with Angad toward the battlefield, confronts
    fleeing Vánars, hears their account of Ráma's arrow and their fear of succession
    crisis, and resolves to meet the victor prostrate at his feet.
  language: English
  quote_policy: summarized
