canonical_text:
  quote: ''
  summary: Ráma speaks tenderly of Bharat and Śatrughna, then Ráma, Lakshmaṇ, and
    Sítá bathe in the Godávarí and offer libations and hymns. They return to their
    leafy hermitage, where Ráma sits with Sítá and Lakshmaṇ. The giantess Śúrpaṇakhá
    arrives, sees Ráma, and desires him. She asks why he is in the giant-haunted wilderness
    in hermit dress. Ráma identifies himself as Daśaratha’s eldest son, Lakshmaṇ’s
    brother, and Sítá’s husband, explaining that he came to the woods to obey his
    father and keep the law. Śúrpaṇakhá names herself, says she can take any form,
    names her giant kin, declares Ráma her chosen lord, and urges him to leave Sítá
    and take her instead, threatening to eat Sítá and Lakshmaṇ.
  language: English
  quote_policy: summarized
