canonical_text:
  quote: ''
  summary: Ráma and Lakshmaṇ cremate Kabandha in a mountain cave. Kabandha rises transformed
    from the pyre, appears in celestial adornment on a swan-drawn chariot, and instructs
    Ráma to ally with Sugríva, the exiled Vánar prince. Kabandha says Sugríva will
    help in the quest to recover Sítá and can direct a search across the world, even
    to Rávaṇ's halls, Meru, or hell.
  language: English
  quote_policy: summarized
