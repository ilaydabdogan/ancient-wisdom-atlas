canonical_text:
  quote: ''
  summary: Footnotes define ritual and divine terms, note variant recension material
    about Sítá, Vánar matrons, and Kuvera’s chariot, summarize blessings attached
    to hearing or reading the tale of Ráma, and quote a scholarly comparison of the
    Uttarakáṇḍa’s supplementary function to the Greek Cyclic poems in relation to
    the Iliad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Swayamvara is defined as a princess’s or Kshatriya daughter’s self-choice
    or election of a husband at a public assembly of suitors.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes define the Pitris or Manes as spirits of the dead, Kuvera as God
    of Wealth, Varuṇ as God of the sea, and Mahádeva or Śiva as having a bull for
    his ensign.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A North-west recension note says Sítá wishes Tárá and the wives of Vánar chiefs
    to accompany her to Ayodhyá; the car descends and the Vánar matrons join the party,
    while the Bengal recension omits this interruption.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The arghya is defined as a respectful offering to gods and venerable men,
    consisting of rice, dúivá grass, flowers, and other items with water.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Bengal-recension addition says Vaiśravaṇ or Kuvera tells his chariot to
    go and carry Ráma and to return when summoned by his thought; the chariot returns
    to Ráma and is honored.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The omitted blessing section says hearing the tale of Ráma absolves sins and
    grants desired sons, riches, a suitable husband, reunion with distant kin, and
    fulfillment of desires and prayers.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A quoted review states that the Uttarakáṇḍa bears the same relation to the
    Rámáyaṇa as the Cyclic poems bear to the Iliad, completing the story and adding
    events before and after it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The quoted review says the Uttarakáṇḍa gives Rávaṇa’s early history, wars
    with the gods, and conquest of Lanká, then continues Ráma’s story after his triumphant
    return and closes with the deaths of Ráma and his brothers and the founding of
    kingdoms by their descendants.
  category: sequence
  evidence_refs:
  - ev:8
