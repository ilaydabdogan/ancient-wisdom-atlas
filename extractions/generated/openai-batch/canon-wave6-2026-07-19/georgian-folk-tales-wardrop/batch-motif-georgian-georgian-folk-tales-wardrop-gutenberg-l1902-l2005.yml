canonical_text:
  quote: ''
  summary: A prince reaches a fire where devi brothers are sleeping, eats from their
    pot, and is later sent to seize a handkerchief from a dangerous maiden at a crossroads.
    He defeats her and obtains a golden slipper. Attempts by the devis to exchange
    the slipper lead to their imprisonment by a merchant, so the prince seeks the
    matching slipper. He next defeats a maiden ruler by the sea who has been drowning
    wheat sellers, restoring plenty to the kingdom, but refuses the offered kingship
    because he is still seeking the slipper. The passage ends with news of another
    maiden who repeatedly revives and kills a dead king's son with twigs.
  language: English
  quote_policy: summarized
