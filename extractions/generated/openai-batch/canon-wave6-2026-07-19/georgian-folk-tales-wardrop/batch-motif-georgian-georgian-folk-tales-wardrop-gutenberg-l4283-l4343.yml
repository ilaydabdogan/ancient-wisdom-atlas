canonical_text:
  quote: "“Since a mule never bore offspring and never will...”"
  summary: A shepherd impresses a king by revising the decree of four viziers. He
    accepts appointment as judge only after being blinded, then becomes renowned for
    upright judgments. In a dispute over a calf, he rejects a bribe, hears both parties,
    and rules that the calf belongs to the woman because a mule cannot give birth
    to a calf. A kerchief belonging to the woman restores his sight; he continues
    judging uprightly and after death goes to heaven.
  language: English
  quote_policy: quoted
