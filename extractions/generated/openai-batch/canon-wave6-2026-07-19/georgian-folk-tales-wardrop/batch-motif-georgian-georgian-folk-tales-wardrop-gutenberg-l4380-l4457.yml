  confidence: high
  cautions: The two sayings share a similar practical pattern, but the passage does
    not state an explicit link between them.
- id: motif:5
  label: Outsider replacing insider
  taxonomy_refs:
  - wisdom
  basis: The rat from outside drives out the house-born rat.
