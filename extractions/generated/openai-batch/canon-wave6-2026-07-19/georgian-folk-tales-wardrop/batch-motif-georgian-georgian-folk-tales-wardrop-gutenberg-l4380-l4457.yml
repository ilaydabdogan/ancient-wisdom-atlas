  cautions: This is a form-level motif family rather than a single narrative episode.
- id: motif:2
  label: Reciprocal blessing or delayed return of good
  taxonomy_refs:
  - wisdom
  - sacred_exchange
  basis: One proverb says that wishing a neighbor to have an ox results in God sending
    it to the speaker; another says a good deed left by the way will be found again
    after many days.
  evidence_refs:
  - ev:5
  - ev:14
  confidence: medium
  cautions: The passage gives proverbial statements, not a developed exchange narrative.
- id: motif:3
  label: Self-made instrument of destruction
  taxonomy_refs:
  - wisdom
  basis: The hen scratches up the knife with which its own throat is later cut.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The image is proverbial and does not identify a fuller tale context.
- id: motif:4
  label: Misdirected blame or fear
  taxonomy_refs:
  - wisdom
  basis: The wolf is blamed while the jackal eats the flock, and the dog frightened
    by a wolf barks afterward at a stump.
  evidence_refs:
