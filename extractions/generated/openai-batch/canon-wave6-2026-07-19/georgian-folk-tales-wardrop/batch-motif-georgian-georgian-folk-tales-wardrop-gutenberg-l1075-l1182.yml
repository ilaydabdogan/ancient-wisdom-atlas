canonical_text:
  quote: ''
  summary: Ghvthisavari kills a ten-headed devi, but the devi survives because one
    soul-bearing head remains. The devi hides under a tree, wins the secrecy and love
    of Ghvthisavari's mother, and persuades her to feign illness and send her son
    on lethal quests for animal-derived cures. A stag and a boar each warn Ghvthisavari
    of his mother's deception and give him both the requested item and a hair to summon
    future help. The passage ends as the mother sends him to fetch flesh from a griffin's
    young.
  language: English
  quote_policy: summarized
