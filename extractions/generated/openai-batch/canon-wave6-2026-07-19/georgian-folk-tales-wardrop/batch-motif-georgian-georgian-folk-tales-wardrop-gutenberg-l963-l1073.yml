canonical_text:
  quote: ''
  summary: A king confines his beautiful daughter with an attendant in a sea tower.
    A large apple floats to them; the princess eats the inside and the attendant eats
    the peel, after which both become pregnant. The king orders a huntsman to kill
    them, but the huntsman spares them and substitutes hare organs as proof of death.
    In the wild wood the princess bears Ghvthisavari and the attendant bears eight
    dogs. Ghvthisavari grows with exceptional speed, hunts with the dogs, obtains
    an iron bow and arrows, and follows an arrow to a house of multi-headed devis.
    He kills the devis' mother and then several returning devi brothers.
  language: English
  quote_policy: summarized
