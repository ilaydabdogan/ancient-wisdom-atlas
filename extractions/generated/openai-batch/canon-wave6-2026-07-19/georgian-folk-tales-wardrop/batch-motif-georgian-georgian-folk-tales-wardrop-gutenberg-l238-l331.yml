canonical_text:
  quote: ''
  summary: A poor peasant takes his son to find a trade-master. At a rivulet, a devil
    named Vakhraca appears and offers to teach the son for one year, with the condition
    that the father must recognize him afterward or lose him. The son helps his father
    identify him during a dove-transformation test and leaves the devil. The son then
    repeatedly changes into valuable hunting animals and escapes after being sold,
    but when he becomes a horse, the father ignores his warning and sells him with
    the bridle to a variegated-eyed man, who regains power over the pupil and locks
    him in a dark room.
  language: English
  quote_policy: summarized
