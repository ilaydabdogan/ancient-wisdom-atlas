canonical_text:
  quote: The dwarf cunningly replaced the stone by a sponge of the same appearance,
    and squeezed still more moisture out of it.
  summary: The passage begins Part III, Gurian Folk Tales. In “The Strong Man and
    the Dwarf,” a foreign strong man challenges a kingdom, but a small dwarf uses
    substitutions, excuses, and threats to make the giant believe he is extraordinarily
    strong. They become sworn brothers, cross a stream, and eat at the giant’s house,
    where the dwarf repeatedly conceals his physical weakness by verbal trickery.
    The passage then begins “The Grasshopper and the Ant,” in which a grasshopper
    and ant enter brotherhood, set out together, and the ant is swept away while fording
    a brook; the grasshopper seeks a sow’s bristle to rescue her, but the sow demands
    acorns first.
  language: English
  quote_policy: quoted
