canonical_text:
  quote: ''
  summary: Ghvthisavari and his brother separate at a fork marked by a stone pillar
    warning that the right road is a no-return path. They agree that water turning
    to blood will signal danger. Ghvthisavari wins a king's daughter by leaping over
    a vast sea, then ignores another no-return warning and is swallowed by a toothless
    old woman who petrifies his weapons and dogs. His brother follows the danger sign,
    crosses the sea, preserves chastity with Ghvthisavari's wife by placing a sword
    between them, tracks his brother's path, kills the old woman, and restores Ghvthisavari
    and the dogs with her blood. Later the brother dies after an oath-arrow test concerning
    the wife, and Ghvthisavari revives him with immortal water.
  language: English
  quote_policy: summarized
