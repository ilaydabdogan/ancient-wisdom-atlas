canonical_text:
  quote: ''
  summary: A poor countryman frees a speaking pheasant that promises birds will honor
    his funeral. His wife proposes that he feign death to summon the birds, and the
    couple kill many of them for food. A merchant sees the abundance and is repeatedly
    deceived by the countryman, who sells him a supposedly game-fetching cat, a supposedly
    self-filling pot, and finally a hare made to appear as a food-summoning messenger
    through substitution with an identical hare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A countryman caught a pheasant and was taking it home to cook for himself
    and his wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pheasant spoke like a man, asked to be released, and promised repayment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pheasant said that after the old man's death it would gather all the birds
    of the air to follow him to the grave, giving him funeral honor beyond that of
    kings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The countryman released the pheasant, and birds later came every morning to
    ask after his health.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wife proposed that the husband pretend to be dead so that she could lure
    the birds indoors, shut the openings, and the couple could kill them for food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The countryman lay under a sheet while his wife went outside and wept loudly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hoopoe asked after the husband's health, flew away when told of his death,
    and many kinds of birds then came into the yard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The birds occupied the cottage, barn, stable, yard, and the air above when
    there was no more room.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wife shut the doors, and she and her husband killed the birds inside;
    only the birds outside escaped.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A merchant saw abundant game at supper, and the countryman claimed that a
    special cat fetched whatever birds he requested.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The merchant bought the cat, but at his home the cat brought no birds and
    stole existing food.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: When the merchant returned, the countryman staged a demonstration with a pot
    of millet over the fire, one grain of millet, an incantation, and stirring until
    the pot appeared full.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The countryman explained the cat's failure as improper feeding, sold the pot
    to the merchant, and the pot later proved useless at the merchant's home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Anticipating another visit, the countryman prepared two identical hares with
    matching ribbons, kept one at home, took the other to the field, and instructed
    his wife to bring a specified meal later.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the field the countryman released a hare as if sending it to request food,
    and his wife arrived with the matching hare and the requested meal.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:16
  text: The merchant said the countryman had cheated him about the cat and the pot,
    but agreed to forgive him if he sold the hare; the countryman sold it for a large
    sum.
  category: speech
  evidence_refs:
  - ev:12
