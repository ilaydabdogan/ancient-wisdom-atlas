canonical_text:
  quote: ''
  summary: A dying king instructs his three sons to watch his tomb and marry their
    sisters to suitors. The elder sons fail to guard the grave against a noisy being,
    while the youngest obeys the will, confronts the tomb monster, seeks fire beyond
    a vast river, kills demis, claims three hidden maidens with rings, leaves his
    sword in a stone, and later proves himself by drawing it out. After the youngest
    prince marries, his wife receives a flying carpet but is carried off by a monster,
    prompting him to set out after her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dying king tells his sons to watch his tomb for one week each and to give
    his daughters to suitors who ask for them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest brother is driven away from the tomb enclosure by a noisy strong
    being, which digs up the corpse, weeps over it until morning, and reburies it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While the elder brothers are away hunting, the youngest brother gives the
    three sisters to three suitors according to the father's will.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The middle brother experiences the same failed grave watch as the eldest and
    remains silent about it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The youngest brother insists on watching the grave despite his brothers' anger.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the tomb, the youngest brother lights a candle, faces an uproar and earthquake,
    and cuts the approaching monster in two; the monster's blood puts out the candle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The youth sees a distant fire, orders the cock not to crow until he returns,
    swims a vast river, and reaches demis sitting around the fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youth jumps among the demis, seizes a burning brand, and runs away, but
    the brand goes out while he crosses the river back.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When the youth returns to the fire, the demis catch him and demand that he
    bring them three maidens unseen by the sun from a castle.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The youth leads the demis to the castle ladder and kills them one by one as
    each reaches the top.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Inside the castle the youth greets the maidens, gives each a ring, assigns
    the youngest to himself and the others to his brothers, leaves his sword in a
    stone, takes fire, and returns to the grave before dawn.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A king proclaims that whoever can draw the sword from the stone will receive
    his daughter; many fail, but the youngest brother draws it out and claims the
    three daughters for himself and his brothers.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The king gives the youngest prince's wife a flying carpet; during the journey
    a monster swoops down and carries her off.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The young prince says farewell to his brothers, declares that he must perish
    with his wife, and goes away.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: At a spring in a field, the prince meets a boy with a water jug who says the
    nearby village belongs to three brother demis married to daughters of one king.
  category: sequence
  evidence_refs:
  - ev:12
