canonical_text:
  quote: ''
  summary: A blind king sends his three sons to obtain a rare fish that can cure him.
    The elder sons fail, while the youngest feeds sea fish with flour, catches the
    rare fish, then releases it when it speaks and asks for mercy. Betrayed by his
    companion, the youngest son is condemned but spared by executioners and leaves
    home. In a forest he saves a deer, an eagle, and a jackal, each of whom promises
    future help. He reaches a crystal castle where a maiden queen kills suitors who
    cannot hide from her. For his first hiding attempt, a fish swallows him and hides
    him in the Red Sea, but the maiden finds him with her mirror and forgives him
    once.
  language: English
  quote_policy: summarized
