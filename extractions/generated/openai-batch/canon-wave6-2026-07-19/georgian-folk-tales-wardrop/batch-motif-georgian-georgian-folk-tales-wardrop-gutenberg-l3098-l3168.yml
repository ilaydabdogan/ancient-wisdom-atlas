canonical_text:
  quote: ''
  summary: A clever thief who has become a king's son-in-law answers a neighboring
    monarch's insults. He disguises himself as a figure sent from God, deceives the
    neighboring king and queen into entering coffins for a supposed journey to Paradise,
    transports them to a royal feast, exposes them naked to public laughter, and later
    inherits his father-in-law's kingdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king becomes enraged, consults counsellors about trapping the thief, and
    the viziers say the thief is too brave and clever to entrap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king offers safety and marriage to his daughter; the Little Thief comes
    forward, identifies himself, and receives the daughter in marriage because the
    king cannot break his word.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A neighboring monarch repeatedly sends insulting letters about the king's
    connection to a low thief, and the reproaches make the king ill.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king's son-in-law asks for a few days' leave and tells his father-in-law
    to prepare a grand festival on an appointed day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the mocking monarch's kingdom, the thief hires a tailor to make a robe
    from different-colored pieces of skin with little bells attached.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The thief puts on the robe, carries a glittering naked sword, and tells the
    palace porters that he is Michael Gabriel, sent from God to take the souls of
    the king and queen to Paradise; he threatens the porters with hell if they interfere.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the bells ring as the thief moves toward a porter, the porters become
    afraid and hide.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The thief tells the neighboring king to settle his affairs in three days,
    appoint a successor, strip, enter coffins, and place the keys on top so he can
    later lock and take the coffins away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: On the third day, the king and queen are stripped and waiting in coffins;
    the thief locks both coffins, carries them away, and loads them on an ass.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The thief arrives at his father-in-law's court during the appointed feast,
    and beautiful music is heard as he lifts the coffins from the ass.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the thief opens the coffins, the neighboring king and queen jump out
    naked and begin to dance while the people laugh.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The father-in-law king clothes the exposed rulers in royal robes, sends them
    home with a warning not to mock him, later loves his son-in-law, and leaves him
    the kingdom at death.
  category: sequence
  evidence_refs:
  - ev:11
