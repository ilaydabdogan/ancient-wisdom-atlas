canonical_text:
  quote: ''
  summary: Two thieves meet, become partners, test one another’s skill, and rob the
    king’s treasury. After the king’s council sets a pitch-barrel trap, the Big Thief
    is caught and the Little Thief cuts off his head to prevent identification. The
    king uses the headless body to expose mourners; the Big Thief’s wife, coached
    by the Little Thief, breaks a water jar and pretends to mourn it while actually
    mourning her husband. The king then sends the corpse outside the town as further
    bait.
  language: English
  quote_policy: summarized
