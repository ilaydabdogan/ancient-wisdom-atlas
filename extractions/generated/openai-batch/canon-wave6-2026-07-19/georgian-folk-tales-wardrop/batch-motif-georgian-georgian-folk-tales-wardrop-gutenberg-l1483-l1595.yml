canonical_text:
  quote: ''
  summary: A blind king is told that the blood of a crimson fish may restore his sight.
    His son frees the captured fish and is banished. The prince meets a boy emerging
    from water, becomes his adopted brother, and reaches a dangerous town. There he
    encounters a tower displaying severed heads and a sunlike maiden whose suitors
    must answer the question of Gulambara and Sulambara or be beheaded. The adopted
    brother directs him to a grandmother, who accepts gum and a candle and carries
    him in flight down into the depths.
  language: English
  quote_policy: summarized
