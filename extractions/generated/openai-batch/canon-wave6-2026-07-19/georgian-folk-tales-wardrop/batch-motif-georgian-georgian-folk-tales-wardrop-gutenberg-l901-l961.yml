canonical_text:
  quote: O God! Thy decrees are not vain and futile!
  summary: 'A prince is hosted by a poor weaver, hears of the weaver''s long-invalid
    daughter, and tries to escape his fated future by stabbing her in the night. Later
    he finds a palace and marries a beautiful maiden, then learns from a wart-like
    mark and her own account that she is the same weaver''s daughter: the wound, her
    mother''s plaster, and the money he left brought her cure and the family''s prosperity.'
  language: English
  quote_policy: quoted
