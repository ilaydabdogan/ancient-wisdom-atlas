canonical_text:
  quote: ''
  summary: 'The passage first recounts the end of Conkiajgharuna''s tale: after appearing
    in fine clothing, she loses a slipper in a stream; the king finds the golden slipper,
    seeks its owner, uncovers Conkiajgharuna hidden beneath a basket, verifies the
    fit, and marries her. The passage then begins the tale of Asphurtzela: a widow
    sends her three sons to work their patrimony and uses onion and garlic peelings
    as trail signs for their sister to bring food; a hundred-headed devi''s mother
    redirects the trail to her own house, hides the maiden, and gives her to the devi
    as a wife rather than food; the brothers learn their sister is missing and set
    out to deliver her.'
  language: English
  quote_policy: summarized
