  quote: ''
  summary: A queen wants a palace made from the bones of every kind of bird. The king
    orders birds caught and the construction begins, but a hedge-sparrow is missing.
    When the hedge-sparrow is brought before the king, it claims to have counted the
    kingdom's men and women and says women are twice as numerous. Threatened with
    punishment, it explains that it counted men ruled by women as old women, thereby
    rebuking the king for obeying his wife's foolish whim.
