canonical_text:
  quote: ''
  summary: A dying priest asks his three sons to read the psalter over him after death.
    The elder sons neglect the command, but the youngest performs the vigil and receives
    three horses from his dead father. The youngest son uses the horses in a three-day
    attempt to leap up to a castle and kiss a princess, succeeding with the third
    horse and marrying her. Later, his ill mother-in-law asks for milk from a doe
    feeding between the white sea and the black sea; he obtains the milk and heals
    her.
