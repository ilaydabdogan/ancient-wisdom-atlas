canonical_text:
  quote: ''
  summary: A peasant's hostile second wife pressures him to get rid of his three daughters.
    He lures them to an apple-tree in the forest, where they fall into a concealed
    deep hole, and leaves them with apples. After hunger drives them toward a plan
    to eat the sister whose blood tastes sweetest, the youngest prays to God; her
    hands become a pickaxe and shovel, and she digs passages to food and finally to
    an old woman's hut. The old woman discovers the sisters, hears their story, protects
    them, and hides them under baskets when she goes out.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A peasant has three daughters; after his first wife dies, he remarries, and
    the stepmother hates the daughters and urges their father to get rid of them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stepmother pretends to suffer bodily distress by cracking flat bread in
    bed and blaming the stepdaughters as the cause.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father finds a fruit-bearing apple-tree in the forest, digs a deep hole
    beneath it, and uses apples to entice his daughters to go there with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father covers the hole, shakes apples from the tree, calls the girls to
    gather them, and the covering collapses so that all three fall into the hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the girls fall in, their father throws many apples into the hole, leaves
    them, and goes away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sisters weep in the hole until their faces are pale and until the apples
    are finished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sisters decide to let blood from their little fingers and eat the one
    whose blood tastes sweetest; the youngest sister's blood is agreed to be sweetest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youngest sister asks not to be eaten, reveals that she has hidden three
    apples, and says that perhaps God will help them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The youngest sister kneels and prays that one hand become a pickaxe and the
    other a shovel; God hears, and her hands change accordingly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Using her changed hands, the youngest sister digs, first reaching a mouse's
    hole containing nuts and then breaking into the wall of the king's stable, where
    almonds and raisins are present.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sisters go to the stable, steal almonds and raisins, and eat them, while
    the grooms wonder who is stealing the horses' food.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The youngest sister later breaks the window of an old woman's hut; the sisters
    enter while the woman is at mass, clean and tidy the hut, cook beans, take bread
    for themselves, and leave.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The old woman hides herself in a mat near the door to find out who is entering
    her hut.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The old woman sees three exceptionally beautiful maidens enter, seizes one,
    asks whether she is human or an angel, and hears that they are three human sisters.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: After hearing their story, the old woman is delighted, guards the three sisters
    carefully, and hides them under baskets when she goes out.
  category: action
  evidence_refs:
  - ev:12
