canonical_text:
  quote: ''
  summary: A prince rescues a king's son from repeated death and revival by taking
    life-giving twigs from a flying maiden. He refuses a throne and continues seeking
    a golden slipper. In a beautiful house he overcomes an Arab servant, finds golden
    slippers beneath a throne, and hides there. Three flying sisters and the Arab
    feast; their toasts identify the prince as the youth who took their objects in
    earlier episodes. The prince reveals himself, returns the objects, arranges marriages
    between the sisters and himself and his brothers, obtains golden slippers, exposes
    a lying merchant before the imprisoned devis, marries the youngest sister, and
    returns home. A planted tree becomes a great plane tree with a stream beneath
    it; the prince reveals himself to his mourning royal parents, and a wedding is
    celebrated.
  language: English
  quote_policy: summarized
