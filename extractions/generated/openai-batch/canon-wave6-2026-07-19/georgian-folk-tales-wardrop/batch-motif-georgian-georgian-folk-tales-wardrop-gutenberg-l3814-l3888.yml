canonical_text:
  quote: ''
  summary: Geria defeats the king's army but is killed by Qvamuritz Khami, whose soul
    is hidden elsewhere. Qvamuritz Khami abducts Geria's wife, who obtains a three-month
    mourning respite. Geria's dog guards his severed body. Geria's parents learn of
    reviving water from snakes and restore him to life. Geria then finds a nested
    sequence of boar, goat, box, and swallows; the remaining swallow is Qvamuritz
    Khami's soul, and killing it kills him. Geria rescues his wife and returns home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king sends almost all his army against Geria; Geria, after a warning from
    his horse, attacks and kills all but one messenger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king summons Qvamuritz Khami, described as his devoted and loyal slave,
    and sends him with the remaining army.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Geria's horse identifies Qvamuritz Khami as the one previously warned about;
    Geria prays, says farewell to his wife, kills the army, and begins single combat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qvamuritz Khami is not killed in combat because his soul is safe elsewhere,
    and he kills Geria.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Geria's death, Qvamuritz Khami slaughters the demis, places Geria's
    wife on Geria's horse, and carries her to his master.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Geria's wife refuses the king, asks either for combat or for three months
    to mourn, and the king grants the respite because he fears fighting someone of
    the demi race.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Geria's head and body are separated; his dog Mathicochi puts the pieces together
    and lies down to guard them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Geria's parents see snakes die after fighting, then see two great snakes enter
    the river and restore the dead snakes by crawling over them; the parents collect
    a thimbleful of the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Geria's parents sprinkle him with the wonderful water, and he comes to life,
    describing his death as a long sleep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Geria goes toward the land of the Black King, enters a great forest, meets
    a forest-destroying boar, wrestles it for three days, and tears it in two.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A wild goat leaps from the torn boar; when the goat is killed a little box
    falls out, and when the box is broken three swallows fly out.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Geria kills two swallows, keeps the third, and that swallow is identified
    as Qvamuritz Khami's soul; when Geria kills it, Qvamuritz Khami dies.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Geria enters the king's palace, kills everyone there except his wife, takes
    her to his parents, and they all go home together.
  category: action
  evidence_refs:
  - ev:10
