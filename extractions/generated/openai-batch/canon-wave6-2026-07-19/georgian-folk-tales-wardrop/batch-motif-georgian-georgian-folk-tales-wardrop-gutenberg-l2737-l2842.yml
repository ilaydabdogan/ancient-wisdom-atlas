canonical_text:
  quote: ''
  summary: A wealthy but childless couple make church offerings and have their shepherd
    watch. In the fifth chapel the shepherd hears five angels decide to give the couple
    a son endowed with immortal youth and answered prayers. The shepherd reports only
    part of the decree, arranges to attend the birth, steals the newborn by substituting
    a goat, and later uses the boy's wishes to obtain food, water, a furnished house,
    a village, rulership, and a princess wife. The boy overhears the truth after magically
    protecting his foot from a heated spit, returns to his parents, and wishes the
    shepherd's household and town into his parents' courtyard.
  language: English
  quote_policy: summarized
