    report the full content of the angelic discussion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a year, the shepherd places the woman's child in his pocket, wraps a
    little goat in the bedclothes, and leaves; after one or two weeks the child asks
    to be put down and walks by himself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the shepherd and boy are hungry and thirsty, the boy wishes for bread
    and then water; bread is provided and a spring appears beside them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shepherd directs the boy to wish for a furnished house, a village over
    which the shepherd may rule, and a princess as the shepherd's wife; the wished-for
    things occur.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The princess asks why she, an illustrious princess, has married a simple shepherd;
    the shepherd tells her to test whether the boy is asleep by placing a heated spit
    on the sole of his foot.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The boy hears the plan, wishes that his foot be hardened so he cannot feel
    anything, remains still during the test, and listens as the shepherd tells his
    wife the full story of the boy's origin.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next morning the boy goes to seek his parents, comes to his father's house
    as a guest, asks whether anything has been lost, and hears that the householder
    lost a shepherd and still owes him wages.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At night the boy wishes that the shepherd, with his house, family, and town,
    be in the courtyard; the next morning the master and wife see a town in their
    courtyard, while the boy pretends to be asleep.
  category: action
