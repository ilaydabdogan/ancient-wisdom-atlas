  text: A wealthy husband and wife have no child; the wife proposes placing young
    bullocks in churches and having someone watch at night in hope that God will give
    them a child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The shepherd receives bullock flesh to distribute to the poor and watches
    in churches; after the first four chapels he reports hearing nothing relevant
    to his master's childlessness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the fifth chapel, five angels of the churches descend and discuss giving
    the man a son; proposed fates include several forms of death or worthlessness,
    while the fifth angel proposes immortal youth and that whatever the child asks
    of God should happen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shepherd tells the couple that five angels said they would have a son
