canonical_text:
  quote: "“Thou art mine and I am thine!”"
  summary: A youth repeatedly tries to hide from a maiden who can locate him with
    her mirror and by looking across different realms. An eagle hides him in the sky
    and a deer hides him in a mountain lair, but she finds him. A gigantic jackal
    arrives amid earthquake and thunder, digs underground to the maiden’s dwelling,
    and instructs the youth to emerge only after she fails to find him and breaks
    her mirror. The plan succeeds; the youth emerges, claims mutual union with the
    maiden, and a feast follows.
  language: English
