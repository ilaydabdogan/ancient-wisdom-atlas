canonical_text:
  quote: ''
  summary: Ghvthisavari saves griffin fledglings from a predatory bird, receives a
    feather and a live fledgling from their mother, survives a plot by his mother
    and the devi to seal him in a tub and cast him into the sea, is rescued by animal
    allies, returns in disguise, kills the devi, his mother, and a companion, then
    recognizes an unknown challenger as his brother and later sets out with him to
    seek fortune.
  language: English
  quote_policy: summarized
