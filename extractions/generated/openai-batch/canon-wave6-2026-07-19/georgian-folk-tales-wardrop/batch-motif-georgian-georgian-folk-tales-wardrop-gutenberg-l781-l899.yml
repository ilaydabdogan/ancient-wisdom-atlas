- id: motif:4
  label: Safe passage through hellfire
  taxonomy_refs:
  - hero_descent
  - return
  basis: The ram warns that they must pass through fire in hell, leaps, and the man
    and ram escape unhurt.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not specify a ritual or protective formula beyond holding
    fast to the ram.
- id: motif:5
  label: Sealed casket releases punitive fire against the oppressor
  taxonomy_refs:
  - divine_judgment
  basis: The woman on the throne gives the man a casket intended for the lord and
    warns him not to open it; when the lord opens it, fire emerges and swallows him.
  evidence_refs:
