canonical_text:
  quote: ''
  summary: 'A lord gives a man an impossible task: go to the other world for a ring
    or lose his wife. With his wife''s advice, the man summons a fiery ram from a
    lake and rides through the earth into the lower regions. He encounters figures
    in emblematic afterlife conditions, crosses hellfire, receives a sealed casket
    from a woman on a golden throne, returns, hears explanations of the figures''
    conditions, and gives the casket to the lord; fire from it consumes the lord.
    The passage then begins a tale called “Fate,” in which a prince rejects an arranged
    marriage, leaves to learn his fate, is directed by an angel in human form to a
    palace of fates, and reads that he will marry an ill weaver''s daughter; he resolves
    to change this fate and takes the letter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lord orders the man to go to the other world and bring back the ring of
    the lord's dead mother, threatening to take the man's wife if he fails.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife tells her husband to go to the lake and ask for the ram; a ram with
    twisted horns comes out of the lake with flame issuing from its mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man mounts the ram, and the ram carries him downward toward the lower
    regions and through the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The traveler sees a man and woman sitting on a bullock's skin that is not
    large enough for them; they say they will answer his question if he returns.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The traveler sees a man and woman sitting on an axe-handle without fear of
    falling; they also defer their answer until his return.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The traveler sees a priest with a very long beard spread on the ground, and
    cattle feed on the beard instead of grass; the priest defers his explanation until
    the traveler's return.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ram and rider come to hell, described as boiling pitch with flame coming
    from it, and pass through the fire without injury.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A melancholy woman seated on a golden throne hears the man's story, says she
    must punish her wicked child, gives the man a casket, and warns him not to open
    it but to give it to his lord and run away.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the return journey, the priest explains that his condition is a penalty
    for caring only for himself and feeding his flocks on others' pastures while neighboring
    cattle starved.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The axe-handle couple explain that they loved each other too well on earth
    and are the same in the other place; the bullock-skin couple explain that they
    despised each other in life and still despise each other.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The man returns to earth, gives the casket to the lord, and runs away; the
    lord opens it and fire comes out and swallows him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A king's son refuses the princess chosen by his father, saying it is not his
    fate to marry her, and later leaves with three bags of money to seek his fortune.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: A stranger, identified in the passage as an angel in the form of a man, asks
    the prince what he seeks and shows him a palace where he can learn his fate.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: At the palace, the prince searches among notes; another man says those outside
    are poor people's fates and that kings' fortunes are written inside.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Inside, the prince's fate is read as marriage to a weaver's daughter who has
    been ill for nine years; the prince says to himself that he will change his fate
    and takes the letter.
  category: sequence
  evidence_refs:
  - ev:15
