canonical_text:
  quote: ''
  summary: Three brothers reach their sister at the house of a hundred-headed devi,
    are received by the devi's mother, and are later swallowed or captured by the
    devi. Their grieving mother receives an apple from a passing man, bears Asphurtzela,
    and the child grows rapidly. After a broken water vessel leads a woman to reveal
    the existence of his endangered siblings, Asphurtzela compels his mother to tell
    the story, arms himself with iron shoes and a bow and arrow made from a plough,
    reaches the devi's house, recognizes his sister, refuses to hide, and waits for
    the devi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The three brothers arrive at the devi's house, encounter water they cannot
    cross directly, and cross by throwing stones into it and stepping over them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl recognizes the three brothers as her brothers, embraces them, and
    the devi's mother feeds and hides them while warning that her son will eat them
    if he sees them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hundred-headed devi returns carrying firewood on one shoulder and dead
    game on the other, and he detects the presence of a man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The devi's mother makes the devi promise not to eat his wife's brothers before
    revealing the three brothers to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: During supper preparation, the devi skins sixty stags while the three brothers
    skin one stag, and he throws all of the meat into the pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At supper, the devi asks whether the brothers eat bone or flesh; they answer
    that bones are enough, and he eats the flesh and throws bones to them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The devi asks whether the brothers will drink from a doki or a qantsi; he
    pours a doki of wine for himself and fills the qantsi for them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The devi asks whether the brothers want a bed or the stable; they choose the
    stable, and the next morning his mother directs him there with coded language
    about three badly cooked loaves in the bread-box.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The devi goes to the stable, swallows one brother in the doorway, places the
    other two in his pocket, and goes into the wood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The brothers' mother waits for them, concludes that the devi must have eaten
    them, weeps until her tears reach heaven, and tells a passing man why she is crying.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passing man gives the mother an apple and instructs her to cut it into
    a hundred pieces and eat three pieces each day until she will have a son named
    Asphurtzela.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After following the apple instructions, the woman gives birth to Asphurtzela,
    who grows in a day as much as other children grow in a year.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: While playing, Asphurtzela throws his codchi, breaks a woman's water-filled
    coca, and the angry woman says his brothers and sister may never be delivered
    from the devi's claws.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Asphurtzela asks his mother to suckle him, bites her breast, and thereby compels
    her to tell him about his brothers and sister.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Asphurtzela decides to leave despite his mother's pleas, warns ploughmen that
    a hundred-headed devi is coming, takes their plough to a smith, and has it made
    into iron shoes and a bow and arrow.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:16
  text: Asphurtzela reaches the devi's house, leaps over the stream, recognizes the
    girl as his sister, refuses the devi's mother's offer to hide him, and waits for
    the devi's return.
  category: sequence
  evidence_refs:
  - ev:12
