canonical_text:
  quote: ''
  summary: The end of one tale describes a fox and animal companions abducting a princess
    for the fox's master, losing her through an old woman's water-filled jar, recovering
    her, defeating the princess's father's army, reconciling the father and son-in-law,
    and then being destroyed after the prince breaks a burial promise to the fox.
    The next tale begins with a dying king giving his son a coffer to open only in
    dire distress; after the king's death, the son hunts eastward, sees a tower, and
    sends a vizier to investigate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fox says he must find a good wife for his master, asks for a fortnight's
    absence, makes a sledge, harnesses the wolf and bear to it, and instructs the
    eagle to watch for and seize a beautiful princess.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox, wolf, and bear use music and dancing to draw crowds, and the eagle
    seizes a fair maiden from a window in the capital before the party escapes pursuit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The princess's father offers half his kingdom to whoever finds and returns
    his daughter, and an old woman says she will find her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman gains service in the prince's household despite objections from
    the fox, wolf, bear, and princess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the fountains, the old woman presses a water-filled litra to the princess's
    lips; the jar swallows the princess, then the old woman, and rolls away while
    the fox pursues and loses sight of it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fox repeats the sledge-and-performance plan, and the eagle breaks a small
    window, seizes the princess again, and brings her back to the master.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king sends an army with the old woman; the fox has the eagle drop stones
    from the air, and the fox, bear, and wolf attack the army, leaving only one injured
    man to report back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king comes with chief priests on bended knees; the prince raises them,
    receives them into his house, and the father and son-in-law are reconciled.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fox asks the prince to promise burial in a fowl-house, then feigns death
    to test him; the prince orders the apparent corpse thrown into the earth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The fox rebukes the prince, threatens a curse after his own death, and after
    the fox dies the curse comes to pass: the prince''s group is destroyed, while
    the wolf, bear, and eagle remain masters of the field.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the next tale, a dying king tells his son to take a coffer when hunting
    in the east and to open it only in dire distress.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the king dies and is buried, the son mourns until ministers propose
    a hunt; while returning from an eastward hunt, he sees a tower and sends a vizier
    to investigate.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
