canonical_text:
  quote: Know, then, that kindness of heart is never lost.
  summary: An old woman directs the prince to serve a butcher in order to learn the
    story of Gulambara and Sulambara. The butcher leads him through nine walls, reveals
    that he punished his wife Gulambara and her lover Sulambara until their bodies
    crumbled away, then threatens to behead the prince for hearing the secret. The
    prince summons the old woman by whistling and escapes. He tells the story to a
    beautiful maiden, marries her, and returns toward his father’s kingdom. At a brook,
    his adopted brother demands a share of all he has, binds the maiden to a tree,
    threatens her with a sword until a green stream flows from her mouth three times,
    and explains that her venom has been expelled. The adopted brother gives the prince
    a handkerchief that restores his father’s sight, reveals that he is the fish the
    prince once freed, and disappears.
  language: English
  quote_policy: quoted
