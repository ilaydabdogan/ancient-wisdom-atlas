canonical_text:
  quote: ''
  summary: A lazy old man is turned out of his household after asking for a jar of
    flour, an egg, and an awl. At a stream he meets a demi and repeatedly survives
    by making the demi believe he has great strength or appetite. Wolves and jackals
    reveal one fraud to the demi, but the old man redirects them against the demi,
    who is destroyed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man is described as lazy, sits by the fire while his children go to
    the fields, is turned out by his daughters-in-law, and receives a jar of flour,
    an egg, and an awl from his eldest daughter-in-law.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a stream the old man asks a demi to carry him across; the demi refuses,
    demands to be carried instead, and threatens to turn the old man into dust.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The demi turns a stone into powder; the old man strikes his jar of flour on
    the rock so that dust arises, and the demi wonders how the old man has turned
    a stone into powder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The demi squeezes a stone and threatens to crush the old man; the old man
    squeezes the egg, moisture oozes out, and the demi becomes alarmed and carries
    him across the stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In midstream the old man says he is holding on to the sky; when the demi asks
    him to let go, the old man sticks the awl in the demi's neck, and the demi asks
    him to hold the sky again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the demi drives in game, the old man hides in the forest, finds a dead
    red-breast, and claims that no earth-walking beast could escape him if he could
    catch the bird on the wing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The demi prepares meat, millet, and wine; the old man asks for a bridge over
    the river, sits there, and throws his food into the river while the demi thinks
    he is eating everything.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wolves catch and eat the meat thrown downstream, and a wolf and jackal later
    tell the demi that the old man ate nothing.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: When wolves and jackals come with the demi to give evidence against him, the
    old man asks the demi whether he owes him more than ten wolves and jackals; the
    animals think the demi betrayed them and turn him into dust.
  category: sequence
  evidence_refs:
  - ev:8
