canonical_text:
  quote: ''
  summary: Three sisters are brought before a king after being caught stealing raisins.
    Each claims an extraordinary ability; the youngest says she can bear golden-haired
    boys, and the king marries her. Her two sisters steal her newborn sons in successive
    births, substitute animals, and place each child in a box in a river, where a
    childless miller finds and raises them. The king punishes the mother, but later
    sees the boys, recognizes their resemblance to him, and invites them to a banquet.
    The elder boy tells the hidden story and the mother is released when the bullock's
    skin bursts; the younger boy confirms the truth when a roast pheasant regains
    feathers and flies away. The king punishes the jealous sisters and restores his
    wife and sons.
  language: English
  quote_policy: summarized
