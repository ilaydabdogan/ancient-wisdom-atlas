canonical_text:
  quote: ''
  summary: A mistreated king's son leaves his father's palace, lives in a mud hut
    in a wood, and hunts daily. A fox first steals his leftover meat, then reveals
    himself and promises to help his fortune. The fox recruits a wolf, bear, and eagle,
    assigning each useful tasks. The animals later build a beautiful house or palace
    and steal furnishings from a town bazaar. After two weeks they bring the prince
    to a walled glade with a garden, fountains, and palace, and he thanks the fox.
  language: English
  quote_policy: summarized
