canonical_text:
  quote: ''
  summary: In the tale segment titled “The Frog’s Skin,” three brothers choose wives
    by shooting arrows. The youngest brother’s arrow falls in a lake, from which a
    frog emerges and is taken home as his wife. The frog is later revealed to be a
    beautiful maiden who removes a frog skin to perform household work. The husband
    burns the skin despite her warning. A lord then tries to take the wife by imposing
    impossible wheat tasks, which are completed with help from lake-born bullocks
    and jackdaws summoned through the wife’s instructions.
  language: English
  quote_policy: summarized
