canonical_text:
  quote: ''
  summary: Two brothers set out to seek fortune. One consumes the other's bread and
    then abandons him. The abandoned brother spends a dangerous night hidden in a
    forest mill, overhears a bear, wolf, and jackal reveal secrets about treasure,
    hidden water, and a cure for a princess, then uses the knowledge to gain wealth,
    reward, marriage to the princess, and heirship. The other brother later imitates
    the night vigil, is discovered by the animals, and is killed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers each possess ten loaves and decide to go seek their fortune.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One brother proposes that they eat the other's bread first; after those loaves
    are finished, he refuses to share his own bread and leaves the other brother alone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The abandoned brother reaches a mill in a thick forest, asks to stay overnight,
    receives a warning from the miller about wild beasts, and hides inside the hopper.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bear, a wolf, and a jackal enter the mill at night, make noise, leap about,
    and agree to tell what each has seen or heard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bear says that a mouse on a hill has a heap of money, spreads it out in
    sunshine, and can be killed with a twig by someone who knows its hole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wolf says a waterless town has pure water hidden under a stone in the
    center of town.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The jackal says a king's only daughter has been ill for three years and would
    be healed by bathing in beech leaves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At dawn the animals leave, and the hidden brother comes out of the hopper,
    gives thanks to God, and goes to test the reported secrets.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The brother kills the mouse and takes the money, rolls away the town stone
    so streams of water flow, receives a reward, cures the princess, marries her,
    and is appointed heir.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The other brother hears of the fortunate brother's success, is told the details,
    and decides to spend time at the same mill despite warnings.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The returning bear, wolf, and jackal realize the earlier secrets have been
    acted on, suspect a listener, search the mill, find the trembling imitator in
    the hopper, and the bear tears him to pieces.
  category: sequence
  evidence_refs:
  - ev:8
