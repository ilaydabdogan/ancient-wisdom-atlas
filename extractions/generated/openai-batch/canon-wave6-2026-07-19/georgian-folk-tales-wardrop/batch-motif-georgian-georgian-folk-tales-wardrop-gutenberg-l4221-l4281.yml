canonical_text:
  quote: ''
  summary: A demi repeatedly visits and sucks a maiden's breast. Sanartia captures
    and binds the demi, threatens to kill him, and spares him only after the demi
    restores Sanartia's severed leg and heals Sanartia's one-handed friend. Sanartia
    then returns unrecognized, finds a prince reduced to tending swine, and forces
    the princess and her family to restore the prince's proper status.
  language: English
  quote_policy: summarized
