canonical_text:
  quote: ''
  summary: A childless king receives a magic apple from an old woman in exchange for
    the future surrender of his youngest son. The queen bears three sons, and the
    youngest is hidden but found and taken by the old woman, who is later identified
    as a witch. Warned by another old woman, the prince leaves a cup of water by the
    fire as a sign of his life. At the witch's cave, her daughters help him escape
    by giving him a comb, scissors, and salt that create obstacles during pursuit.
    The final sea created from the salt drowns the witch, and the prince continues
    on alone and hungry.
  language: English
  quote_policy: summarized
