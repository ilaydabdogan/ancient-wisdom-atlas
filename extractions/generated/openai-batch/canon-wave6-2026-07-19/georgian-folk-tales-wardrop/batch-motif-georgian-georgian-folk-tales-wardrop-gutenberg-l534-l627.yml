canonical_text:
  quote: ''
  summary: A poor man called a good-for-nothing is sent away by his wife. After crossing
    nine mountains he stays with devis, sees their wishing-stone, tricks a warning
    door into being destroyed, and steals the stone. On the road he trades the stone
    for a magic stick, sword, and healing felt, using the stick to recover the stone
    after each exchange.
