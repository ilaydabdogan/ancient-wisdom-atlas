canonical_text:
  quote: blew the soul back into the pieces, and raised the youth to life
  summary: A youth reaches his sisters and is welcomed by three demis. At the hearth
    the demis report that Kazha-Ndii-Kerkun carried away a golden-haired woman and
    show a lock of her hair, causing the youth to faint and depart with a horse and
    little dog. He tries to carry off the princess from Kazha-Ndii's house, but a
    creaking gate and speaking door alert Kazha-Ndii, who overtakes him, cuts him
    into pieces, and takes the woman back. The little dog brings the fragments to
    the demis, whose youngest brother restores the youth to life and gives him a three-legged
    horse. On a second attempt the special horse stops Kazha-Ndii's horse, and the
    youth kills Kazha-Ndii, rescues the princess, visits the demis, and returns home.
  language: English
  quote_policy: quoted
