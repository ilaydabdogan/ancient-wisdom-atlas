canonical_text:
  quote: ''
  summary: 'A poor girl, Conkiajgharuna, is mistreated by her stepmother and contrasted
    with the stepmother''s favored daughter. A speaking cow feeds and later aids her.
    Conkiajgharuna treats a supernatural old woman respectfully and is directed to
    a yellow spring that makes her golden, while the rude stepsister is directed to
    a black spring and disfigured. After the cow is killed, its buried bones become
    a source of magical aid: a steed and royal clothing appear so Conkiajgharuna can
    go to church.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poor peasant has a wife and little daughter named Conkiajgharuna; after
    the wife dies, he marries a second wife who brings her own daughter.
  category: sequence
  evidence_refs:
  - ev:1
