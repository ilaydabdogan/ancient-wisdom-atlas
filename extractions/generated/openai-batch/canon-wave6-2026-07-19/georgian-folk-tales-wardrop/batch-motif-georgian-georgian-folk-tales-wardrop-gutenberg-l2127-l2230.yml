  text: The second wife favors her own daughter, scolds Conkiajgharuna, gives her
    harsh tasks, and tries to get rid of her.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
- id: obs:3
  text: While Conkiajgharuna tends the cow and weeps, the cow speaks and says one
    horn contains honey and the other butter, which she may take.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cow runs onto a roof; Conkiajgharuna follows, drops her spindle, and encounters
    an old woman identified as a devi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Conkiajgharuna examines the old woman's worm-covered head, strokes it, removes
    some worms, and speaks politely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old woman directs Conkiajgharuna to pass the white and black springs and
    wash her head in the yellow spring.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After washing in the yellow spring, Conkiajgharuna's hair becomes golden and
    her hands shine like gold.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stepsister repeats the roof and spindle encounter but insults the old
    woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old woman directs the stepsister to wash in the black spring; afterward
    she becomes black and has a horn that grows larger when cut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The cow knows it is to be killed and instructs Conkiajgharuna to bury its
    bones and later call at its grave for a steed and royal robes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before going to church, the stepmother orders Conkiajgharuna to fill a trough
    with tears and gather scattered millet before the family returns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A neighbor uses hens and chickens to gather the millet and makes salt water
