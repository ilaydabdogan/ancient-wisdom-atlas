canonical_text:
  quote: ''
  summary: Dervish recounts how his unfaithful wife used a whip to change him into
    a dog. In dog form he befriends a priest, protects shepherds' flocks from wolves,
    and is brought to guard a king's sick daughter from nocturnal swan attackers.
    After sparing an eleventh swan, he is later changed into a duck by his wife, restored
    to human form by the eleventh sister, and instructed to use the whip against his
    wife and her neighbour, whom he transforms into asses. The hunter who hears the
    tale flees the enchanted mountain realm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dervish says his wife deceived him with the next-door neighbour, and when
    he questioned her she struck him with a whip and he became a dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As a dog, Dervish can only bark and howl when trying to speak and cannot walk
    like a human on his hind legs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A village priest befriends the dog, feeds him, and tells him to watch while
    the priest rests under a tree.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a shepherds' camp, the dog drinks wine from a plate and later kills three
    wolves that attack the sheep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shepherds buy the dog from the priest, and the dog's fame for killing
    wolves reaches the king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king's daughter is described as sick and tormented at night by brownies;
    Dervish sees swans enter through closed doors and choke and trample the sleeping
    princess.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After being unchained for the second night watch, Dervish kills ten swans
    and spares an eleventh swan that promises help with his wife and neighbour.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The princess wakes healthy the next morning, and the king rewards the dog
    with a heavy gold chain and royal feeding.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Dervish returns home, his wife removes the gold chain, strikes him with
    the whip, and changes him into a duck; he is then caught in nets in a millet field
    by a peasant.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The peasant's wife strikes the duck with a whip, restores Dervish to human
    form, identifies herself as the eleventh of twelve sisters, and says Dervish's
    wife is the twelfth sister.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dervish strikes his sleeping wife and the neighbour with the whip and turns
    his wife into an ass and the man into a she-ass; the hunter who hears the story
    flees the enchanted mountain realm.
  category: sequence
  evidence_refs:
  - ev:8
