canonical_text:
  quote: ''
  summary: Geria, a poor man's handsome and strong son, is challenged after breaking
    a woman's water jar to fetch the only sister of twelve demis beyond twelve mountains.
    He leaves his parents with provisions and his dog, crosses two dangerous mountain
    regions ruled by Rokapis, receives warnings and a three-legged horse, reaches
    the demis' land, performs a feat with a huge kettle, wins the maiden's promise
    and the demis' consent, and defeats a black-clad host sent by the Black King.
  language: English
  quote_policy: summarized
