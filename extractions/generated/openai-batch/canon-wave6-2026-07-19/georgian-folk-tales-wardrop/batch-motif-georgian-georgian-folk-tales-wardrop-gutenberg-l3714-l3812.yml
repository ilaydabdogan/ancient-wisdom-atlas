    of the twelve demis who dwell beyond the twelve mountains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Geria asks his parents to prepare food for a year and tells them to seek him
    if he does not return in that time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Geria's parents resist his departure, weep, bless him, and let him go.
  category: sequence
  evidence_refs:
