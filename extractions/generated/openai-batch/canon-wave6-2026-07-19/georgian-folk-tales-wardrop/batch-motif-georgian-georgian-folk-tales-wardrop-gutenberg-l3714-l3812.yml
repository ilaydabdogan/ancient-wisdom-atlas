  - ev:5
- id: obs:12
  text: Geria uproots an oak, plants it with its branches downward, and ties the horse
    to it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The horse says it would have fled home if Geria had not tied it so, then instructs
    him to overturn a kettle in the meadow and go to the damsel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Geria kicks and overturns the kettle three times, leaves it upside down, breaks
