canonical_text:
  quote: ''
  summary: Asphurtzela confronts a devi, survives an attempted night murder by using
    a log decoy, defeats and interrogates the devi, retrieves a coffer and reviving
    handkerchief from the devi's breast, restores his dead brothers, and kills the
    hundred-headed devi. The revived brothers later envy him, bind him to a great
    tree, and abandon him; after a prayer to God, he uproots the tree, returns home
    carrying it, is freed, and decides to leave his family.
  language: English
  quote_policy: summarized
