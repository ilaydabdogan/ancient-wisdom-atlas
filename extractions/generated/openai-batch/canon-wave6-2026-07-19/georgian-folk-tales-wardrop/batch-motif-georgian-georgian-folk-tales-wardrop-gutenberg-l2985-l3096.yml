canonical_text:
  quote: ''
  summary: The Little Thief tricks sentinels with food and wine, recovers his dead
    companion’s body, and profits from the guards’ fear. The king sets further traps
    using scattered money, a truth-revealing hind, and an old woman investigator,
    but the Little Thief evades each trap, kills the hind, and kills the old woman
    after she obtains evidence from the Big Thief’s wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Little Thief brings an ass loaded with cakes, roasted birds, and wine
    to the sentinels and asks to stay for the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sentinels eat and drink while the Little Thief does not drink; he pretends
    to sleep, and the sentinels fall into a deep sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Little Thief places his dead companion’s body on the ass, sends it home,
    and the Big Thief’s wife removes the body, mourns, and buries it under the couch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the morning, the Little Thief claims his ass has been lost, frightens the
    sentinels, receives money from them, and the king later orders the sentinels beheaded.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king has a street strewn with money and orders sentinels to seize any
    passer-by who gathers it up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Little Thief wears newly tarred boots so that money sticks to them, repeatedly
    removes and buries the money, and gathers almost half of it by evening.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king’s counselors advise releasing a hind that will kneel before the house
    of the person guilty against the king; the hind kneels before the Little Thief’s
    house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Little Thief recognizes the meaning of the kneeling hind, brings it inside,
    kills and skins it, hides the skin, and keeps the flesh in the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old woman offers to find the lost hind for the king in exchange for freedom
    and rank, then obtains a piece of hind flesh from the Big Thief’s wife by saying
    it will cure illness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Little Thief meets the old woman, sees through her purpose, lures her
    back with the promise of more hind flesh, kills her, and buries her body under
    the couch.
  category: sequence
  evidence_refs:
  - ev:8
