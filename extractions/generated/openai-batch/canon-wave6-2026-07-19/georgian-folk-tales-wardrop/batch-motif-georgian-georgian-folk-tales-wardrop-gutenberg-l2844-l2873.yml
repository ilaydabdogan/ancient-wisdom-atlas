canonical_text:
  quote: I am in truth your son, but this man is also your child.
  summary: A boy found sleeping in a transformed household identifies himself as the
    son of the man and woman. The shepherd, mysteriously transported with his possessions,
    confesses wrongdoing. The boy asks his parents to forgive and compensate the shepherd,
    including return of the goat left in exchange for him. The father gives the shepherd
    his hire, the goat, half his flocks, and household acceptance; the boy remains
    with his parents.
  language: English
