candidate_motifs:
- id: motif:1
  label: Long-awaited royal child with exceptional perception
  taxonomy_refs:
  - miraculous_child
  - wisdom
  basis: Sanartia is born after the king has reached old age without a son, is named
    as longed-for, and is described as understanding everything among earthly beings.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not state a divine conception or explicitly miraculous
    birth; the classification rests on delayed birth and extraordinary knowledge.
- id: motif:2
  label: Rejected son cast into the sea
  taxonomy_refs:
  - departure
  basis: Sanartia’s mother demands that he be thrown into the sea, and his father
    later casts him into the sea.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an imposed departure rather than a voluntary quest departure.
- id: motif:3
  label: Hero enclosed in fish and returning to land
  taxonomy_refs:
  - hero_descent
  - death_rebirth
  basis: A fish swallows Sanartia; he survives inside it for thirty years and then
    cuts his way out after the fish lands ashore.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: Sanartia does not literally die, and the fish is not identified as an
    underworld being; death-rebirth is a broad functional resemblance only.
- id: motif:4
  label: Tools and fire enable survival inside a creature
  taxonomy_refs:
  - wisdom
  basis: Sanartia’s purchased tools, flint, and tinder allow him to make fire and
    survive inside the fish.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents practical cleverness rather than a formal teaching
    scene.
- id: motif:5
  label: Bride-winning ordeal performed by a substitute helper
  taxonomy_refs:
  - royal_legitimacy
  basis: The suitor must perform the lead-throwing feat but cannot; Sanartia performs
    it for him, and the suitor later receives the bride.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The marriage outcome is achieved through concealment, so the royal-legitimacy
    relation is unstable in the narrative.
- id: motif:6
  label: Monster in castle subdued and made watchman
  taxonomy_refs:
  - initiation
  basis: Sanartia spends the night in Ocho-Kochi’s castle, defeats the hostile inhabitant,
    and commands him to stand guard.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The initiation taxonomy is broad; the passage frames the event as a marriage
    exploit rather than a named initiation.
- id: motif:7
  label: Clothing substitution creates a false bridegroom
  taxonomy_refs:
  - trickster_boundary
  - royal_legitimacy
  basis: Sanartia dresses his companion in his own clothes and sends him to the king,
    resulting in the companion’s marriage to the princess.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: Sanartia is not called a trickster in the passage; the motif label is
    based on the deception by role exchange.
- id: motif:8
  label: Maimed survivor joins a similarly disabled companion
  taxonomy_refs: []
  basis: After his leg is cut off and he survives, Sanartia goes to another land and
    becomes friendly with a one-handed man.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The supplied passage ends before the later function of the one-handed
    companion is shown.
