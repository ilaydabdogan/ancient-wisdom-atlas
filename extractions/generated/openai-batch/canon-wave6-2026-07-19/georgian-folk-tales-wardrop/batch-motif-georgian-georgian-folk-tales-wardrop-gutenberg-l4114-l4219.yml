canonical_text:
  quote: ''
  summary: A king’s long-desired son Sanartia is cast into the sea at his mother’s
    request, swallowed by a fish, survives for thirty years inside it, and emerges
    on land. He accompanies a bride-seeking prince, performs the required lead-throwing
    feat and subdues Ocho-Kochi in a castle, but secretly lets his companion marry
    the princess in his place. After the secret is revealed, the princess cuts off
    Sanartia’s leg; he survives, leaves for another land, and befriends a one-handed
    man.
  language: English
  quote_policy: summarized
