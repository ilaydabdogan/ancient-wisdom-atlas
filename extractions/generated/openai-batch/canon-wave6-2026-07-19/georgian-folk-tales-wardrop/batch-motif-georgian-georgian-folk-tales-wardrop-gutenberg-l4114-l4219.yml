  text: Before going with his father, Sanartia asks for money and buys a little axe,
    knives, needle, thread, flint, and tinder.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Near the sea, Sanartia pulls up an oak tree and carries it; his father casts
