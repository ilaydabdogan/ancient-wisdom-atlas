canonical_text:
  quote: ''
  summary: The passage contains two brief tales. In the first, a solitary wise man
    criticizes the apparent disproportion between a large walnut tree with small fruit
    and small plants bearing large pumpkins and melons; after walnuts fall on his
    face, he concludes that the natural arrangement is provident. In the second, an
    Arabian king's counsellor stages the theft of the king's goat to test his wife,
    friends, and royal favor; his wife betrays him, his friends save him by bribery,
    and years later he is restored after the king recognizes his need for the counsellor.
  language: English
  quote_policy: summarized
