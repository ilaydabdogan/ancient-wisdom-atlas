canonical_text:
  quote: Every day the snake laid him a precious stone.
  summary: A poor orphan leaves home to seek a livelihood, serves a clever man for
    three years in exchange for three precepts, gains wealth from a red snake that
    lays precious stones, loses the benefit after revealing the secret to his wife,
    and is later ruined after lending a knife that is used in a murder and theft.
  language: English
  quote_policy: quoted
