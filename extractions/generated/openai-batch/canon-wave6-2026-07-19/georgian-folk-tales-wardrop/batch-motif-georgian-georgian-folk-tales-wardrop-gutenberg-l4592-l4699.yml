canonical_text:
  quote: ''
  summary: A grasshopper tries to save a drowning friend by obtaining a sow's bristle,
    but each being or object in the chain requires another service first. The grasshopper
    eventually obtains the bristle after the earth gives grass, but the ant is dead
    when pulled out. The passage ends with an explicit lesson about timely help, the
    earth's generosity, and reciprocal services.
