canonical_text:
  quote: ''
  summary: After his companions abandon him by blocking the hole, Asphurtzela enters
    the lower regions through a black spring. There he learns that a dragon withholds
    the water unless given human victims, and the king's daughter is next to be offered.
    Asphurtzela kills the dragon and refuses the king's rewards, asking only to return
    to the land of light. He then saves griffin fledglings from another dragon, and
    the grateful mother griffin carries him upward; when food runs out, he cuts flesh
    from his leg to feed her, and she later restores it. Back in the land of light,
    he finds his companions preparing to marry the maidens, asks who was to blame,
    kills the companions after the youngest sister answers, marries the youngest,
    and gives the elder sisters to his brothers.
  language: English
  quote_policy: summarized
