canonical_text:
  quote: Enter and thou wilt repent; enter not and thou wilt repent.
  summary: After several viziers fail to return, the king enters a dangerous chamber,
    finds a silent boy on a golden couch, and must obtain three answers or lose his
    head. A speaking apple from a coffer tells three embedded riddles about resurrection
    and identity, the making of an ensouled man, and the credit for curing a sick
    prince. The boy answers all three, can speak, and restores the king's viziers
    to life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After three days, the first vizier does not return; the king sends several
    more, and none comes back, so the king goes himself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The door bears an inscription saying that both entering and not entering will
    bring repentance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inside, twelve men with drawn swords lead the king through twelve rooms to
    a golden couch where a boy of eight or nine lies silent with closed eyes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king is told he may ask the boy three questions, but if the boy does not
    understand and answer them all, the king must lose his head.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king opens a coffer given by his father; an apple falls out, rolls toward
    the couch, and begins speaking to the boy.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the first tale, brigands behead a man and his brother; a woman sees a mouse
    restored to life by an herb, uses the herb on the two men, and revives them after
    putting the heads on the wrong bodies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy opens his eyes and answers that the woman's husband is the one with
    the right head.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the second tale, a joiner fashions a wooden man from a tree, a tailor clothes
    it, and a priest prays that God give it a soul.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When asked who made the man, the boy answers that it was the one who gave
    him the soul.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the third tale, a diviner identifies a prince's illness, a physician prepares
    medicine, and a swift runner carries it; the boy says the physician cured the
    prince.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: After the three answers, the apple returns to the casket, the boy rises and
    speaks freely, and the king asks for his viziers to be restored to life.
  category: sequence
  evidence_refs:
  - ev:9
