canonical_text:
  quote: ''
  summary: A merchant is deceived by a countryman's supposed marvels. After a hare
    fails as a messenger, the countryman stages his wife's apparent death and revival
    with a blood-filled calf intestine and a knife. The merchant buys the knife, kills
    his own wife, and fails to revive her. Seeking revenge, he ties the countryman
    in the forest, but the countryman tricks a shepherd into taking his place by claiming
    that the bound man will be made king. The merchant drowns the shepherd, thinking
    he is the countryman. Later the countryman appears with the shepherd's flock and
    claims that the sea bottom contains abundant cattle. The merchant asks to be drowned
    with a stick so he can gather them, and the countryman drowns him.
  language: English
  quote_policy: summarized
