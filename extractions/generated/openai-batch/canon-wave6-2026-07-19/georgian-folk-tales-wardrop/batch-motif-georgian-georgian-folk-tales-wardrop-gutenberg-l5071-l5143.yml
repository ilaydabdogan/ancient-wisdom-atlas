canonical_text:
  quote: ''
  summary: A man dies leaving three sons, one of whom is described as a fool. The
    two more clever brothers cheat him during the division of cattle, leaving him
    only one young bull. The bull uproots a tree and exposes a jar of old gold coins.
    The fool tries to give the jar to the king, but wayfarers steal the gold and replace
    it with stones and wood, leading to his beating at court. He then repeatedly uses
    phrases learned in one situation in the next inappropriate situation and is beaten
    again. After monks beat him, he steals a monastery bell, hangs it in a tree, and
    rings it in the forest. Robbers mistake the bell-ringing figure for a possible
    supernatural being. The fool tricks the scout robber into putting out his tongue,
    cuts it off, and frightens the robbers away. He takes their booty, becomes richer
    than his brothers, and the tale ends with a formulaic invitation to merrymaking
    in his palace.
  language: English
  quote_policy: summarized
