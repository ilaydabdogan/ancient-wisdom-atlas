canonical_text:
  quote: ''
  summary: Asphurtzela meets two men with extraordinary abilities, accepts them as
    brothers, and travels with them. Arrow-shooting leads the three companions to
    a house of devis where weddings to three maidens are interrupted. A hidden lame
    devi consumes the food prepared by two companions but is killed by Asphurtzela.
    The severed head leads them to a hole containing three maidens. The two companions
    fail to descend; Asphurtzela descends, sends up the elder maidens for his companions,
    and is warned by the youngest maiden that the companions will betray him and that
    only the white of three streams is safe.
  language: English
  quote_policy: summarized
