canonical_text:
  quote: ''
  summary: 'A king repeatedly dreams of objects or animals hanging from the roof.
    A poor peasant obtains interpretations from a speaking serpent in exchange for
    a promised share of royal rewards. The peasant first breaks the bargain, later
    attacks and injures the serpent, and finally repents and shares the gifts. The
    serpent explains that the peasant’s conduct mirrored the condition of the kingdom
    at each time: deceit, war, and then peace.'
  language: English
  quote_policy: summarized
