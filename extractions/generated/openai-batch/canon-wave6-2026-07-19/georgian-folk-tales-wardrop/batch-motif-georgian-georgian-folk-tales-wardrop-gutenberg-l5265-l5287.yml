  quote: ''
  summary: 'A father repeatedly tells his son he will never come to good. The son
    runs away, becomes a pasha after ten years, and has his sick old father seized
    and brought before him to prove his success. The father recognizes him but says
    the prophecy was correct: rank has not made him a good man.'
