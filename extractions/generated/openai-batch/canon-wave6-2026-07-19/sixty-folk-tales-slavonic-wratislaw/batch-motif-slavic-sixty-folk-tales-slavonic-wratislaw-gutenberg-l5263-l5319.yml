canonical_text:
  quote: ''
  summary: A village wizard named Avstriyat is said to be able to make rain or hail
    pass away. During harvest storms he remains calm, smokes, and refuses permission
    to a black rider and then to a white rider who ask to release the weather. He
    finally permits the white rider to go only into a glen beyond the plain, where
    hail falls so heavily that it fills the glen. The passage then includes editorial
    notes comparing other numbered tales with Grimm and Russian heroic material.
