canonical_text:
  quote: right always remained right
  summary: The huntsman reaches Sarahawsky, learns that the princess is incurably
    ill and that the king has promised her in marriage to whoever cures her. He gives
    her sweet comfits as medicine while secretly finding and removing a silver nail
    from her bed's head; she recovers and the wedding is arranged. The huntsman later
    tells the stranger that he learned useful things under the gallows, found water,
    recovered his sight, and proved that right remains right. The stranger imitates
    the gallows visit hoping for a similar reward, but three arrivals discover him,
    tear him into three pieces, and hang them on the gallows. After the old king dies,
    the huntsman becomes king and continues to believe that right remains right.
  language: English
  quote_policy: quoted
