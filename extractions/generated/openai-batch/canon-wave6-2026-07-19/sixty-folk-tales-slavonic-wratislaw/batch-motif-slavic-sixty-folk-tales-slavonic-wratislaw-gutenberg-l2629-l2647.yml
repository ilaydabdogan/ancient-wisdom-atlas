  quote: ''
  summary: A melancholy young king encounters a white dove in the garden. He finds
    and removes a pin from the dove's head, whereupon the dove becomes his wife again.
    She reports that the gipsy deluded her and stuck the pin into her head. The king
    has the gipsy and an old woman apprehended and burnt, and thereafter lives and
    reigns happily with his wife.
