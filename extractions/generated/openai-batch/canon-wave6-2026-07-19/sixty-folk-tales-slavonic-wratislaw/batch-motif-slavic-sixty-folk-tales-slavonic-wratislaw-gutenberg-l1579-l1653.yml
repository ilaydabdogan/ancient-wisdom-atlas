canonical_text:
  quote: ''
  summary: 'The passage ends a Jezinka episode by saying the Jezinka no longer appeared
    on that hill. It then begins “The Wood-Lady”: Betty, a cheerful poor girl, tends
    two goats in a birch-wood while spinning flax and singing. At midday she dances.
    One day a beautiful maiden in white, with golden hair and a garland of woodland
    flowers, appears and invites Betty to dance. Bird musicians sing from the birches
    at the maiden’s beck. Betty dances from noon until evening, forgets her goats
    and spinning, and the maiden disappears. Betty returns home silently, hides the
    incident from her mother, and intends to make up the neglected work later.'
  language: English
  quote_policy: summarized
