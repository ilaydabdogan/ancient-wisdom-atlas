canonical_text:
  quote: ''
  summary: 'A young man seeks the king''s daughter in marriage. The king imposes impossible
    tasks under threat of beheading: transforming hills into wheat and cake, clearing
    woods into vineyards with grapes and new wine, and producing a castle, cattle,
    covered way, and garden superior to the king''s. The young man knocks on a magic
    lock, summoning twelve young men who fulfill the tasks. After the marriage and
    long wedding festivities, the king of the sea steals the lock, moves the castle
    and lady to the Black Sea, and leaves the young man and his mother in a cottage.
    The young man searches with his dog and cat. The animals cooperate to enter the
    sea-king''s castle and recover the lock, but on the return they quarrel, the lock
    falls into the sea, and a fish swallows it; the passage breaks off as the cat
    seizes the fish.'
  language: English
  quote_policy: summarized
