canonical_text:
  quote: ''
  summary: At dawn in the castle, the anxious prince is threatened by the returning
    wizard. Sharpsight sees the danger and tells Long, who throws the gold ring through
    the window; the princess reappears, the wizard's third iron hoop breaks, and he
    turns into a raven and flees. The princess thanks the prince, the castle and surrounding
    nature revive, the liberated people thank him, and he returns home with his bride.
    After a wedding, Long, Broad, and Sharpsight leave to seek work. An appended editorial
    note interprets the tale as an allegory of drought, rain, and seasonal renewal,
    and compares it with Sleeping Beauty.
  language: English
  quote_policy: summarized
