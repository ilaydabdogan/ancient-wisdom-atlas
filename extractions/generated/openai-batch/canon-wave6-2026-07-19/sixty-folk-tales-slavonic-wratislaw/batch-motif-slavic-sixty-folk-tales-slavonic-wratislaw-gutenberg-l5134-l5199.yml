canonical_text:
  quote: ''
  summary: A sick emperor needs water. A snake refuses water to the elder daughters
    unless they marry him; the youngest agrees, receives cold fresh water, and her
    father recovers. A carriage later comes for her, the snake is placed on a plate,
    and she is taken to the snake's abode. She and the snake have a daughter; the
    child and then the princess die. A wicked godmother cuts off the buried princess's
    hands and removes gold rings after scalding the hands. The dead princess comes
    for the hands, accusing the godmother in repeated speech. The godmother is later
    found dead under the stove and is thrown into a hole without proper burial.
  language: English
  quote_policy: summarized
