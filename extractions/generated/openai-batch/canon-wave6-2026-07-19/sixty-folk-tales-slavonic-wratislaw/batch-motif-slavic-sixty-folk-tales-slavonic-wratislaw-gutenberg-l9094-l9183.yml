canonical_text:
  quote: ''
  summary: 'An imprisoned young man, secretly fed by a count''s daughter, gives solutions
    to tests sent by a hostile king: finding the opening side of a staff, identifying
    the ages of three identical horses, and returning a massive war-mace. After being
    dug out of the vault, he strengthens himself through a secluded soup regimen made
    from an exact nine-year-old cow, returns the mace to the king, and begins arranging
    indistinguishable doubles when the king demands that he be sent to him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king threatens to attack the count unless the count can tell on which side
    a sent staff opens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The damsel brings food at night to the lad in the vault and tells him that
    her family may perish under the open sky while he remains in the vault.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The lad instructs the damsel to present his advice as a dream: place the
    staff in a tub of water, where it will turn with its opening side upward; this
    succeeds.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hostile king says the count did not solve the task with his own head and
    sends three identical horses whose ages must be identified.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lad advises preparing three heaps of oats of different ages; the three
    horses each go to the heap matching their own age, and the count answers correctly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king sends a war-mace weighing three hundredweight; it knocks the spoon
    from the count's hand, flies into the cellar, and becomes too firmly stuck for
    soldiers or gathered people to move.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The damsel says the lad has freed them twice; the lad tells her to say she
    dreamed that only he can perform the third task, and the count has him dug out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young man requests a cow exactly nine years old from a king with registered
    cows and warns that paying less than the named price would make him lighter; the
    cow is bought and slaughtered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For three months the young man remains alone and consumes soup rather than
    flesh; he demonstrates to the count that soup sticks to the wall while flesh falls
    down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After further periods of eating, the young man becomes strong enough to move
    and then throw the mace, finally sending it back so that it knocks the other king's
    spoon away at dinner.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hostile king demands that the walled-up helper be sent to him and intends
    to kill him; the young man asks the count to summon people so that lookalikes
    can be selected and dressed alike.
  category: sequence
  evidence_refs:
  - ev:6
