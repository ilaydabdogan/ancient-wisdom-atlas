canonical_text:
  quote: ''
  summary: George must identify Goldenhair among twelve veiled maidens. A fly he had
    restored to life helps him choose correctly. Goldenhair is revealed by radiant
    golden hair. George brings her to his old king, who has George beheaded despite
    his service. Goldenhair uses water of death and water of life to restore George.
    The old king attempts to gain youth by imitation, but dies when the waters are
    used in the wrong order and the water of life is exhausted. George becomes king
    and Goldenhair queen. An editorial note compares the tale to Grimm's 'White Snake'
    and comments on the two kinds of water.
  language: English
  quote_policy: summarized
