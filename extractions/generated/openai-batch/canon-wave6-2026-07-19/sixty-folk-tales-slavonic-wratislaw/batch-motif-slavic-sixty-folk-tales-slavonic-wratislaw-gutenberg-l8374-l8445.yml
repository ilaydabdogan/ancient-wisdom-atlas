canonical_text:
  quote: "“I am a hero, but I have not what a hero requires.”"
  summary: Kraljevitch Marko seeks weapons suitable for a hero, tests swords and maces
    made by several smiths, and violently pays two smiths by cutting off their hands
    so they cannot make such weapons for other heroes. After his mother tells him
    to plough, he instead ploughs the emperor’s highroads. When three hundred Turks
    attack him and he has neither sword nor mace, he uses his plough to fell them
    all, takes their gold, releases his oxen, and leaves home to go into the world.
  language: English
  quote_policy: quoted
