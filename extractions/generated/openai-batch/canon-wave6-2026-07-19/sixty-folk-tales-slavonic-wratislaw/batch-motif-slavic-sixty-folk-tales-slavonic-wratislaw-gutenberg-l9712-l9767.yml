canonical_text:
  quote: ''
  summary: In Osojani, a plague of snakes afflicts homes, churches, dairies, beds,
    meals, and cattle. An unknown man uses a burning pile around a tall fir and a
    bone pipe to draw snakes, lizards, and salamanders into the fire. A great white
    snake arrives from Ososcica, pushes the man into the fire, and itself dies in
    the flames. The community is freed and continues an annual gift of corn to the
    poor in memory of the promise made on the man’s behalf.
  language: English
  quote_policy: summarized
