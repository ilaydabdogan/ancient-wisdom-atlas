canonical_text:
  quote: ''
  summary: Ilya Murometz, only child of a peasant in Karatcharof near Murom, becomes
    able to walk after thirty years, gains great strength, equips himself as a warrior,
    and leaves with his parents' blessing for Kiev. On the road he frightens robbers
    into surrender, saves Chernigof from a besieging heathen army, then travels the
    long-blocked road guarded by Nightingale the robber, whose whistling kills travelers.
    Ilya shoots Nightingale from his nest on twelve oaks, binds him to his stirrup,
    and survives a later ambush at Nightingale's mansion by killing the eldest daughter
    who tries to crush him with an iron slab.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilya Murometz is the only child of Ivan Timofeewitch and is said to have sat
    for thirty years before he began to walk firmly and became conscious of vast strength.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilya makes warrior equipment and a steel spear, saddles a heroic horse, asks
    his father and mother for a blessing, and sets out toward Kiev.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ilya's parents bless him and instruct him to ride toward Kiev by way of Chernigof
    and not to injure anyone or shed Christian blood causelessly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Robbers in a gloomy forest desire Ilya's horse and gather to attack him by
    tens and twenties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ilya shoots a guelder-rosewood arrow along the ground; the robbers become
    terrified, kneel, offer goods and horses, and Ilya tells them not to venture further
    if they wish to live.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Armies described as heathen stand under Chernigof, besieging it with the intent
    to destroy the city, ravage the churches, and capture its prince and duke.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ilya commits himself to God, determines to risk his life for the Christian
    faith, defeats the besieging forces with his steel spear, and captures the heathen
    prince.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The citizens and ruler of Chernigof receive Ilya with honor, give thanks to
    God for deliverance, feast him, and let him continue his journey.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The direct road from Chernigof to Kiev has been beset for thirty years by
    Nightingale the robber, who lets no horseman or foot-traveler pass and kills by
    robber whistling rather than by weapon.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ilya passes through landmarks including the Branskian forest, muddy swamps,
    guelder-rosewood bridges, and the river Smorodinka.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Nightingale whistles from a distance; Ilya is not terrified, but the horse
    totters under him when the whistling grows stronger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Nightingale's nest is constructed upon twelve oaks, and from it he whistles
    with all his might in an attempt to kill Ilya.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: Ilya shoots a guelder-rosewood arrow at Nightingale's nest, strikes Nightingale's
    right eye, knocks him down, binds him to his steel stirrup, and rides toward Kiev.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At Nightingale's mansion, three daughters look out of the windows; the youngest
    at first thinks their father is bringing booty, while the eldest recognizes that
    an unknown man is leading their father captive.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The daughters call their husbands to take their father back; the sons-in-law
    ride against Ilya, but Nightingale tells them not to provoke the mighty hero and
    to invite him humbly to drink wine instead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The eldest daughter raises an iron slab on chains above the door to crush
    Ilya; Ilya sees her and kills her with his spear.
  category: action
  evidence_refs:
  - ev:7
