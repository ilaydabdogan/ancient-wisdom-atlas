canonical_text:
  quote: ''
  summary: The man and Kurent contend for the earth, reshaping its surface through
    their struggle. Dobrin briefly binds them and rules, but they overpower him and
    hand him to a fiery dragon. Kurent describes the hundred-leaved rose, a mysterious
    plant whose roots imprison living fire and whose top contains lightning and thunder.
    Its petals sing, regrow, and are used as an arbiter for alternating rulership.
    The first consultation grants rule to neither; the second grants rule to the man,
    who sleeps through his term. Kurent then wakes him and begins his own rule as
    the passage breaks off.
  language: English
  quote_policy: summarized
