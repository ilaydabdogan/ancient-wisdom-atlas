canonical_text:
  quote: ''
  summary: A childless man meets a traveller at a spring and receives an apple with
    instructions that make his wife, hound, and mare productive and cause two apple-trees
    to grow from his house. His two sons later leave home with matched horses and
    hounds, make spears from the apple-trees, separate at a marked fork, and one brother
    takes a lower road through another world. After crossing a warned lake, he, his
    horse, and his hound become gilded. He reaches a royal tower, marries the king's
    daughter, then goes hunting alone and pursues a golden-horned stag to another
    tower, where a damsel asks him not to kill it.
  language: English
  quote_policy: summarized
