canonical_text:
  quote: ''
  summary: A hunter is cheated in a wagered game of draughts and imprisoned. His similar-looking
    brother, made golden after crossing a lake, is mistaken for him at the king's
    tower, then searches for him. The second brother follows the same stag to the
    draught-playing damsel's tower, resists her distractions, wins back the lost animals
    and the damsel herself, and frees his brother. The freed brother suspects him
    over his wife, but the misunderstanding is resolved; the brothers reconcile and
    each obtains a wife and kingdom.
  language: English
  quote_policy: summarized
