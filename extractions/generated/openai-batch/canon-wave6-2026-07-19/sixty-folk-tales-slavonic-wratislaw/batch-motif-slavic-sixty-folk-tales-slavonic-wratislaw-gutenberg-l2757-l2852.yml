- id: obs:1
  text: At evening near the bridge, the eldest king's horse stumbled over a log that
    the seer had put across the bridge; after the king spoke angrily, the seer attacked
    and killed him with a sword.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seer bound the dead eldest king on his horse, lashed the horse so it would
    carry its master home, and waited under the bridge until the next evening.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The middle king saw blood near the bridge, spoke about a killing in his kingdom,
    and was then attacked and killed by the seer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The seer fastened the middle king's corpse to his horse, sent it home, and
    waited until the third evening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youngest king arrived at sunset on the sun-horse, saw blood before the
    bridge, accused an unknown murderer, and fought the seer with swords.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sword fight between the seer and youngest king lasted a long time, broke
    their swords, and did not decide the victory.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The seer proposed that they turn into wheels and roll down a hill; the cart-wheel
    broke and smashed the lighter wheel, but the youngest king said only his fingers
    had been broken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The youngest king proposed that they become flames; after the seer reversed
    the proposed colors, they became a red flame and a bluish flame and burned each
    other without a result.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old beggar appeared; the bluish flame offered him a penny to quench the
    red flame, while the red flame offered him a shilling to quench the bluish flame.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old beggar chose the larger payment, brought water, and quenched the bluish
    flame; the passage states that this ended the king.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The red flame turned back into a man; the seer took the sun-horse, called
    the servant, thanked the beggar, and left.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the royal palaces, people mourned the two kings, and the old witch planned
    vengeance because of the deaths of her sons-in-law.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The old witch sat on an iron rake, took her three daughters under her arms,
