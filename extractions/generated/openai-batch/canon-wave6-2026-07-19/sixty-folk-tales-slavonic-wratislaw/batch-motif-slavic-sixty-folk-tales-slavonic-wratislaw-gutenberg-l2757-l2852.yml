canonical_text:
  quote: ''
  summary: At a bridge, the seer kills the eldest and middle kings and sends their
    bodies home on their horses. The youngest king arrives on the sun-horse and fights
    the seer first with swords, then by changing into wheels, and finally by changing
    into flames. An old beggar accepts the red flame's larger payment and quenches
    the bluish flame, ending the youngest king's life. The seer takes the sun-horse
    and continues with his servant. In the palaces, the old witch mourns her sons-in-law
    and flies away with her three daughters on an iron rake to seek vengeance. In
    desert mountains, the servant is tempted by apples on a tree; the seer stabs the
    tree, blood comes out, and he says it was the eldest queen placed there by her
    mother to kill them.
  language: English
  quote_policy: summarized
