  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The seer and servant crossed desert mountains and a treeless waste, where
    hunger seized the servant.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: They came to an apple-tree whose apples were abundant, fragrant, ruddy, and
    tempting to the hungry servant.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: The seer forbade the servant to gather apples, stabbed the apple-tree with
