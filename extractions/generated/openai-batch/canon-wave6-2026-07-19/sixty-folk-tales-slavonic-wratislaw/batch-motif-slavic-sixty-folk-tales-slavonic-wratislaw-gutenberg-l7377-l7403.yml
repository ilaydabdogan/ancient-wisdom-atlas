canonical_text:
  quote: ''
  summary: A man traveling to ask Fate questions receives requests from others and
    from a stream to ask Fate about their misfortunes. A hermit directs him to Fate's
    abode and tells him to remain silent and imitate Fate until questioned. The man
    reaches a palace-like dwelling, sups and sleeps as Fate does, hears a midnight
    voice announce newborn souls, and sees Fate assign their life-lot by throwing
    ducats from a chest. By dawn the palace has become a moderate house with enough
    in it.
  language: English
  quote_policy: summarized
