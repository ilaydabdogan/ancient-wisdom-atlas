canonical_text:
  quote: ''
  summary: After marriage, the empress leaves on a journey and gives the prince keys
    to twelve cellars, warning him about the twelfth. He opens it, gives water to
    a voice in an iron-hooped cask, and thereby releases a dragon, who carries off
    the empress. The prince seeks her, rescues a fish, fox, and crow, receiving tokens
    from each, then reaches the dragon emperor's palace with help from a man. He and
    the empress attempt to flee, but the dragon's speaking horse helps the dragon
    overtake them; the dragon spares the prince once because of the water given in
    the cellar. The prince returns, and the empress learns from the dragon that a
    hill-dwelling old woman has twelve horses, including a skinny but best horse able
    to fly to the sky, obtainable only by successfully watching a mare for three days
    and nights under penalty of death. The prince sets out for the old woman's hill
    as the passage ends.
  language: English
  quote_policy: summarized
