canonical_text:
  quote: when she weeps, pearls roll down; and when she smiles, all manner of flowers
    bloom.
  summary: A childless couple receives a daughter after a pilgrimage. The girl has
    miraculous tears and smiles, and her embroidery wins royal approval for marriage
    to a prince. On the journey, an old woman blinds the damsel, hides her in a cavern,
    and substitutes her own daughter as the bride. An old man rescues the blinded
    damsel, sells her tear-born pearls back to the old woman in exchange for her eyes,
    and later appears at the emperor's dinner wearing the damsel's embroidery. The
    prince recognizes the work and sends the false bride to tend swine.
  language: English
  quote_policy: quoted
