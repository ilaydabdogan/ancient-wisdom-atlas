canonical_text:
  quote: ''
  summary: A poor father with many children receives a dream visit from a child who
    instructs him to take three objects, travel by a stream to a fountain-head, avoid
    speaking to a dangerous luminous damsel or she-dragon, pull out one blood-red
    hair, and escape by throwing the objects behind him. He follows the instructions,
    steals the hair, distracts the pursuer with embroidered cloths and a mirror, sells
    the hair to the emperor, and becomes rich. The emperor splits the hair and finds
    writing in it about ancient events from the beginning of the world. The dream
    child is finally identified as an angel sent by Lord God to aid the man and reveal
    hidden secrets.
  language: English
  quote_policy: summarized
