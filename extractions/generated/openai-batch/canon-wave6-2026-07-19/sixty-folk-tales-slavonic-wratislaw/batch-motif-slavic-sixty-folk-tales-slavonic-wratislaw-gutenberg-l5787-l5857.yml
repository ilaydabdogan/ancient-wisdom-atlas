canonical_text:
  quote: ''
  summary: 'The opening of a Cinderella tale: a girl drops a spindle into a chasm
    after a warning, and her mother is transformed into a cow. After the girl''s father
    remarries, the stepmother persecutes her with textile labor and household work.
    The cow-mother helps her spin tow into yarn, is discovered by the stepsister,
    and is killed. Before death, the cow instructs the girl not to eat the flesh but
    to bury the bones behind the cottage for future help. The girl, named Mary, becomes
    known as Cinderella because of her ash- and cinder-covered work at the fireplace.'
  language: English
  quote_policy: summarized
