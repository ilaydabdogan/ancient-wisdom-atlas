canonical_text:
  quote: ''
  summary: 'A huntsman''s four sons leave home to gain experience. At a beech-tree
    between four roads on a mountain, they agree to separate, set knives in the tree
    as life-tokens, and return after a year and a day. Each learns a trade with extraordinary
    power: mending by command, summoning objects, locating anything by looking at
    the sky, and shooting game by command. On returning home, their abilities are
    demonstrated separately and then together on a hare.'
  language: English
  quote_policy: summarized
