canonical_text:
  quote: ''
  summary: A poor son repeatedly exchanges bread to save a puppy, a kitten, and a
    snake from shepherds. He feeds the animals, and when the snake grows large he
    carries it home. The snake instructs him to refuse gold and silver from its parents
    and ask instead for a lock hanging behind the door. The parents eventually give
    him the lock, which summons twelve young men when knocked upon. The young men
    transport him home and provide food and drink for his household.
  language: English
  quote_policy: summarized
