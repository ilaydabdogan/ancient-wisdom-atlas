canonical_text:
  quote: ''
  summary: A persecuted stepdaughter named Maritza is set impossible tasks by her
    stepmother. A fair damsel helps her wash black wool white at the water. Later,
    in winter, twelve young men on the mountain help Maritza obtain strawberries after
    she courteously praises all months and especially March. The stepmother's own
    daughter imitates the journey, insults the months, and is struck by a storm. The
    twelve young men are identified as the twelve months. A rich lord then arranges
    to betroth Maritza, while the stepmother plans to substitute her own daughter.
  language: English
  quote_policy: summarized
