canonical_text:
  quote: ''
  summary: A young man of Veprim finds a sleeping beautiful maiden in white on the
    hill Uczka and shades her from the sun with a branch. She reveals that she is
    a Vila, agrees to marry him, and forbids him to utter her name. They live prosperously
    and have a daughter. During a hailstorm she protects their wheat, but when her
    husband exclaims that she is a Vila, she vanishes. She later returns at times,
    visible only to her daughter, helping her until the daughter marries and becomes
    ancestress of the Polharski family.
  language: English
  quote_policy: summarized
