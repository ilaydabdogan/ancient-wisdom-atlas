    the oven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old man later sniffs and tells the servant lad to look at the baked meat
    because it smells as if it may be cooked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the servant opens the oven, the oven and house shine with the child's
    brightness; the frying-pan and child have become gold, and the child is alive
    and well.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The transformed child sits in the frying-pan like a big boy, with a crown,
    a sword, a book of blessing, and a wheatsheaf full of ears.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man is no longer inside; outside the house he blesses the household
    with good from field and cattle, peace, descendants, and reception in the heavenly
