canonical_text:
  quote: ''
  summary: In the Bulgarian tale, the Lord descends from heaven in the form of a white-bearded
    old man and visits a village house. A poor man and his wife receive him hospitably.
    The old man refuses ordinary food and asks the husband to kill and bake his little
    son. The husband complies secretly. When the servant looks in the oven, the child
    and frying-pan have become gold; the child is alive, radiant, crowned, armed with
    a sword, and holding a book of blessing and a wheatsheaf. The old man, now outside,
    blesses the household with prosperity, peace, descendants, and future reception
    in heaven, then departs at night.
  language: English
  quote_policy: summarized
