canonical_text:
  quote: ''
  summary: The emperor threatens the birdcatcher unless he finds the mistress of the
    birds. The crow advises a plan using a boat of wares and identifies the woman
    by perching on her; the birdcatcher carries her to the emperor, who makes her
    a favored sultana. Resenting her captivity, the sultana asks the emperor to send
    the birdcatcher to retrieve a broken ring-half from the sea. With the crow’s counsel,
    the birdcatcher obtains oil, pours it into the sea, and the crow recovers the
    missing fragment.
  language: English
  quote_policy: summarized
