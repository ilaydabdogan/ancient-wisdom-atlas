canonical_text:
  quote: ''
  summary: A boy is born under a bridge after his mother leaves church. Three fate-decreeing
    hags settle that he will die unless he marries the daughter of the king of the
    Vilas. When grown, he learns this fate and sets out. An old smith gives him three
    pairs of iron shoes and directs him to the moon's mother. The moon's mother hides
    him from the dangerous moon, who then sends him toward the sun's mother. The sun's
    mother repeats the hiding procedure; the sun sends him toward the storm-mare,
    explaining how to find and seize her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant mother leaves church after mass, hides under a bridge, and gives
    birth to a son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three Royenitzes arrive; the passage describes them as hags who determine
    by what death every child is to leave the world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first Royenitz proposes killing the child at once, the second proposes
    killing him when grown, and the third proposes killing him only if he does not
    take the daughter of the king of the Vilas as wife; this last condition is settled.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When grown, the son says he wants to marry; his mother tells him that the
    Suyenitzes pronounced that he will die unless he takes the daughter of the king
    of the Vilas as wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The son decides to search for the daughter and first consult an old smith
    about where she is.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The old smith says the search will be difficult, sends him to the mother of
    the moon, gives him three pairs of iron shoes, and instructs him to take her by
    the arm and state his request promptly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After nearly wearing out the first shoes, the son reaches the moon's mother
    and takes her by the arm.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The moon's mother says her son may know, warns that the moon would tear the
    visitor to pieces, hides him under a trough, and tells him to answer on the moon's
    third question.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The moon asks about a Christian soul; when the son answers on the third question,
    the moon can no longer harm him and directs him toward the sun's mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After nearly wearing out the second pair of shoes, the son reaches the sun's
    mother, who also hides him under a trough before her son arrives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The sun cannot harm the son after the third announcement, hears his request,
    and says the storm-mare, identified parenthetically as storm or wind, may know
    where the Vilas' castles are.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sun instructs the son to find the storm-mare in a meadow, hide behind
    a tree or in a hole, and seize her by the bridle when she comes.
  category: speech
  evidence_refs:
  - ev:5
