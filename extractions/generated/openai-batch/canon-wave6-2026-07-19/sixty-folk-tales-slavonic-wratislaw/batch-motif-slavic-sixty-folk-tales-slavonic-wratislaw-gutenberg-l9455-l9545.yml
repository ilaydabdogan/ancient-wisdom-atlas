canonical_text:
  quote: "“As soon as he had kissed it, the snake turned into a beautiful maiden”"
  summary: A young man enters an enchanted town through the water, survives by catching
    fish, and undergoes three midnight encounters with increasingly terrible snakes
    that ask him for a kiss. On the third night he kisses the three-headed snake,
    which becomes an enchanted lord’s daughter, and the castle and town are disenchanted.
    The daughter gives him a ring that can transport him between her and his parents
    by the Danube, warning him not to show or lose it.
  language: English
  quote_policy: quoted
