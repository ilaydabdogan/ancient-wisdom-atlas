canonical_text:
  quote: ''
  summary: In the opening of “The Golden Spinster,” a young lord seeks a wife and
    marries Hanka after her mother claims that Hanka can spin unlimited materials
    into golden thread. At the lord’s castle, Hanka is shut in a room full of spinning
    materials and threatened with death unless she spins them into golden threads
    by morning. A little mannikin appears through an opening wall with a golden hand-cart
    and offers help on the condition that, one year later, Hanka must guess his name
    or become his wife and be carried away.
  language: English
  quote_policy: summarized
