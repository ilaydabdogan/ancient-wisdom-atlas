canonical_text:
  quote: "“Skin down! skin down! skin down!”"
  summary: An enchanted mill is haunted by a she-wolf. A soldier hides above the parlour,
    watches the she-wolf remove her skin and become a damsel, then nails the skin
    to the mill-wheel. He marries her and they have two children. Their elder son
    learns where the skin is and tells his mother; she thanks him for rescuing her,
    leaves, and is never heard from again.
  language: English
