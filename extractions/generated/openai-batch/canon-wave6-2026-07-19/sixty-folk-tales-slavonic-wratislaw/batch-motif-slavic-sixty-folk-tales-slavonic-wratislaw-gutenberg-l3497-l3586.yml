canonical_text:
  quote: ''
  summary: A poor cobbler gives the proceeds from his cottage and goods to the church
    after hearing that God will recompense such gifts. When no recompense appears
    and hunger presses him, he goes in beggar's dress to seek the Lord God. An old
    shepherd gives him first a lamb that scatters ducats when commanded and then,
    after the lamb is lost through the cobbler's disobedience, a tablecloth that produces
    food and drink when commanded. Each gift is given with the condition that he not
    enter his old gossip's house. In both cases he stops at her tavern, reveals the
    command in the form of a warning, is made drunk, and the woman substitutes an
    ordinary object for the magical one.
  language: English
  quote_policy: summarized
