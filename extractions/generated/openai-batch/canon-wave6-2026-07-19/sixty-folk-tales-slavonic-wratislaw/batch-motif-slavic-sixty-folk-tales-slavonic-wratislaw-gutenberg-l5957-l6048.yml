canonical_text:
  quote: ''
  summary: An emperor's golden apple-tree ripens nightly but is robbed. The two elder
    sons fail to watch it because they fall asleep. The youngest prince stays awake,
    sees nine peahens arrive, and meets the ninth peahen as a radiant damsel; she
    gives him apples. His envious brothers use an old witch to spy on him, and the
    witch cuts the damsel's hair, causing the peahens to flee and stop coming. The
    prince grieves and leaves with a servant to seek the peahen. At a lake-palace,
    an aged empress tells him the peahens bathe there, but she bribes his servant
    with a whistle that makes the prince sleep when the peahens arrive; the ninth
    peahen tries unsuccessfully to wake him.
  language: English
  quote_policy: summarized
