canonical_text:
  quote: "“That moment his memory was darkened, and he utterly forgot the princess,
    Bony's daughter.”"
  summary: Prince Unexpected enters a town despite his betrothed's warning, kisses
    a boy, and forgets her. The princess, Bony's daughter, changes from a white stone
    into a cornflower, is taken in by an old man, performs hidden household marvels,
    is restored to human form when covered with a cloth, and later sends a message
    through pigeons emerging from a wedding cake. The prince remembers her, they flee
    together, return to his father's realm, and are married.
  language: English
  quote_policy: quoted
