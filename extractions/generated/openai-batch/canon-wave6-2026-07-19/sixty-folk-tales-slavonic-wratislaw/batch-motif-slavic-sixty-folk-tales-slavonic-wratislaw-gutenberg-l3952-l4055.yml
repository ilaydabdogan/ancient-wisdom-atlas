- id: motif:1
  label: Beloved warns against an action that will cause forgetfulness
  taxonomy_refs: []
  basis: The princess explicitly warns the prince not to kiss the little boy because
    doing so will make him forget her; he kisses the boy and forgets her.
  evidence_refs:
