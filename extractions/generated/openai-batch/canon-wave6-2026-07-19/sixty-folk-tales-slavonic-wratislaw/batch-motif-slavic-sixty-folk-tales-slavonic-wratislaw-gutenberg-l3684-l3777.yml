canonical_text:
  quote: ''
  summary: A childless king and queen unexpectedly have a son while the king is away.
    During the king’s return journey, a sudden well and evasive cup lead him into
    the power of the subterranean king Bony, who makes him promise the unknown thing
    left at home. The promised thing proves to be the newborn prince. Years later
    Bony reminds the prince of the debt, and the prince departs armed to confront
    him.
  language: English
  quote_policy: summarized
