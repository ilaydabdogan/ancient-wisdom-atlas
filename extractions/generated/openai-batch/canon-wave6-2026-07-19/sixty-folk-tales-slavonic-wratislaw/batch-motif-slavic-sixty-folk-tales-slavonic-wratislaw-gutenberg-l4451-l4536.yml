canonical_text:
  quote: ''
  summary: 'At midnight by a guelder-rose bridge and river of fire, Little Rolling-pea
    and his companions fight and behead seven- and nine-headed dragons, keeping their
    tongues as proof and throwing the trunks into the fiery river. The dragon wives
    then plot revenge: two transform into roadside traps, a seat and an apple-tree,
    but Little Rolling-pea exposes them by stabbing them and drawing blood. A third
    she-dragon pursues with jaws reaching from earth to sky; Little Rolling-pea delays
    her by throwing horses, falcons, hounds, and then his two comrades into her mouth,
    causing her repeatedly to go to the blue sea for water. He flees into a smithy,
    where smiths trap the she-dragon’s tongue with red-hot pincers after she licks
    through the iron door; Little Rolling-pea then beats her and buries her seven
    fathoms deep. The passage ends with a conventional tale-closing formula.'
  language: English
  quote_policy: summarized
