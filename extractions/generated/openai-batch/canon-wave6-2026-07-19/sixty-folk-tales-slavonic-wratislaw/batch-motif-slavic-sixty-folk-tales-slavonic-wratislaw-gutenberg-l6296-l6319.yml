  quote: ''
  summary: A groomed horse becomes gold-like and flies to the dragon's palace. The
    prince and empress flee together on it. The dragon pursues on his own talking
    horse, but the fleeing horse persuades the pursuing horse to throw the dragon
    off. The dragon is smashed against a stone, the empress mounts the dragon's horse,
    and the prince and empress return to her dominions and reign.
