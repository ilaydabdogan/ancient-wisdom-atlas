canonical_text:
  quote: ''
  summary: Kraljevitch Marko wanders seeking heroic combats. Black Arapin builds a
    tower by the sea and demands the daughter of emperor Soliman, threatening single
    combat if refused. Soliman, his empress, and his daughter repeatedly send for
    Marko with escalating rewards, including money and wondrous golden objects. Marko
    initially gives no answer. Arapin gathers three hundred armored heroes, and Marko
    then speaks with his piebald horse and rides toward Soliman's city.
  language: English
  quote_policy: summarized
