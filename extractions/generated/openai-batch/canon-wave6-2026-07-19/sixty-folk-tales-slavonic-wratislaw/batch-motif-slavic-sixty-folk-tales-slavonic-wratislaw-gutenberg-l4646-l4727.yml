canonical_text:
  quote: ''
  summary: The passage opens with an editorial note characterizing Slavonic folklore
    devils as unintelligent supernatural beings. The tale that follows concerns a
    very wealthy proprietor whose boastful confidence is followed by the burning of
    his buildings, the loss of money hidden in a willow-tree carried away by floodwater,
    and poverty. As a travelling letter-carrier, he lodges with a rich kindly host
    and the host's wife, who realize that his lost money came to them in the washed-up
    willow. They try to return it secretly by hiding it in a loaf, but he unknowingly
    sells the loaf to drovers, who later bring it back to the same household; the
    wife swaps it for another loaf.
  language: English
  quote_policy: summarized
