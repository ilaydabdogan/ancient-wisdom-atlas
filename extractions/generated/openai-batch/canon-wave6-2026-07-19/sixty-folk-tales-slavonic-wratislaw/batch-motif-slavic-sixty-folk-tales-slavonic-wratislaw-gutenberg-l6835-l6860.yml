canonical_text:
  quote: ''
  summary: A father sends his sons to fetch rye as a sign of the season. At a well,
    the elder brothers trick the simpleton brother into leaning over for water, push
    him in, and he drowns. Signs at home become mournful or cease their joyful activity.
    A lame fox rescues and revives him, then becomes a beautiful damsel and explains
    that a curse had bound her in fox form until she rescued her benefactor from a
    watery death. When the simpleton returns, the joyful signs resume; the father
    banishes the guilty brothers and marries the simpleton to the golden damsel.
  language: English
  quote_policy: summarized
