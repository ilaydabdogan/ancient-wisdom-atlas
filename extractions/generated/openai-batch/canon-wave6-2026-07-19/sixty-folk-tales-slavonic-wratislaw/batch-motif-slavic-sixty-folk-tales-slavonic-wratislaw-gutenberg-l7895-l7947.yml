  summary: The passage is an editorial mythological note on Kurent. It reports Professor
    Krek’s view that Kurent is a difficult and corrupt Slovinish tradition, possibly
    with a non-indigenous name, mixing heathen-Slavonic and Christian elements. Krek
    interprets Kurent and the related figure Pust as Dionysiac, especially because
    of associations with vine-stock, wine, orgiastic festivity, seasonal regeneration,
    and comparison to Greek Dionysos. The passage also notes lexical uses of Kurent
    as a tune or air.
