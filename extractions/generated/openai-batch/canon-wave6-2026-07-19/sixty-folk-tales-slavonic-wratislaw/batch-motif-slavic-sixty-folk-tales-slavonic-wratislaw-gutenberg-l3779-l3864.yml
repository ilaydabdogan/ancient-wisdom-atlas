canonical_text:
  quote: ''
  summary: 'Prince Unexpected reaches the sea and finds twelve white dresses near
    twelve white geese. He takes one dress and later returns it to the twelfth goose,
    who becomes a beautiful damsel and identifies herself as the youngest daughter
    of immortal King Bony, ruler of the subterranean realm. She opens the ground and
    brings the prince to Bony''s underground palace. Bony requires the prince to perform
    three commands under threat of death: build a marvelous palace overnight, identify
    the youngest princess among twelve alike daughters, and stitch boots before a
    lit straw burns out. The youngest princess appears as a bee and helps him with
    the first two commands in this passage.'
  language: English
  quote_policy: summarized
