canonical_text:
  quote: he dreamed every night what eventually happened to him
  summary: In the opening of “Milutin,” a father requires his son and daughter to
    tell their dreams each morning. The daughter complies, but the boy refuses because
    his recurring dream foretells that he will kill a king, marry a count's daughter,
    and become king. His father beats and expels him; a passing count takes him home.
    The count repeats the dream-telling custom, and when the boy again refuses, the
    count has him sealed in a dark garden vault. The count's daughter bribes the masons
    so she can feed the boy at night, and he remains confined for seven years.
  language: English
  quote_policy: quoted
