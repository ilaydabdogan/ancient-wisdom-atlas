canonical_text:
  quote: ''
  summary: A godmother meets her godson in church, promises him a livelihood, anoints
    his ears with salve, and takes him to a physician for instruction. When the physician
    and pupil gather herbs, the herbs tell the pupil their healing powers, while the
    physician does not know them. The pupil cures diseases successfully, receives
    the physician’s diploma and partnership, and continues doctoring until his taper
    burns out in limbo.
