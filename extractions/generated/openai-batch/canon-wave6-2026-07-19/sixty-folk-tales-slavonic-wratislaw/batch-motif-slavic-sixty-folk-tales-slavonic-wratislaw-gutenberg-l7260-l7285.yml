canonical_text:
  quote: ''
  summary: After obtaining the dragon's head, the shepherd-prince returns with animals,
    bagpipes, sheep, and a frightened damsel. The emperor, who witnessed his heroism
    from a hill, gives him his daughter in marriage. The prince reveals his identity,
    receives an escort, opens an iron door near a water-mill with three wands and
    a root, releases a multitude from a vault including his brothers, and returns
    to his father's house with his bride and brothers to reign.
  language: English
  quote_policy: summarized
