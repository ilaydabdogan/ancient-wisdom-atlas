canonical_text:
  quote: Reel, and grumble not--remember my words, "Reel, and grumble not!"
  summary: Betty takes the goats to the birch-wood and tries to avoid dancing so she
    can finish her spinning. A beautiful maiden appears, persuades Betty to dance
    with music from the birch branches, then completes Betty's spinning before sunset
    and gives her a command about reeling the yarn without grumbling. Betty returns
    home, answers her mother's reproach, and decides to keep the encounter secret
    unless the maiden returns.
  language: English
  quote_policy: quoted
