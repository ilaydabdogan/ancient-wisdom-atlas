canonical_text:
  quote: ''
  summary: A traveller loses a ring when two daughters deceive him under a tree. After
    five more years he leaves for Perdonkorten, lodges near a house of thieves, impersonates
    their lost brother using knowledge from the black school, and escapes with magical
    shoes, mantle, and hat. He then flies to the place where the sun rises, hides
    underground from the sun's heat, and asks the sun for the road to Perdonkorten;
    the sun sends him toward the moon.
  language: English
  quote_policy: summarized
