  text: The traveller walks with two daughters, shows them a ring, and tells them
    how he returned to that country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two daughters think that if they take the ring from him, he will be glad
    to stay with them.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Under a tree, one daughter examines and strokes his head until he falls asleep,
    while the other takes the ring from his pocket.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The daughters help him search for the ring, though one of them has it in her
