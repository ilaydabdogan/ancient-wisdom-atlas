  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: After five years he decides he must leave for Perdonkorten and, while benighted
    in thickets, goes toward a light on another hill.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A woman warns him that her three brothers are thieves who may kill him, but
    he asks for wine and waits at the table.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the three brothers return, he uses knowledge from the black school to
    give their surname and the name of their lost brother, and they accept him as
    that brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The thieves describe three acquired objects: shoes that let the wearer fly
    two hundred miles in half an hour, a mantle that makes the wearer unseen, and
    a hat that opens hills when thrown before the wearer.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The traveller puts on the shoes, mantle, and hat, becomes unseen, jumps so
    that the earth quakes, and escapes the brothers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: He flies to the place where the sun rises because he thinks the sun, which
    gives light in all regions, will know the road to Perdonkorten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the sun's house, the servant warns that the returning sun's heat will be
    dangerous; the traveller buries himself deep in the ground until called.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sun says he does not know the road to Perdonkorten and tells the traveller
