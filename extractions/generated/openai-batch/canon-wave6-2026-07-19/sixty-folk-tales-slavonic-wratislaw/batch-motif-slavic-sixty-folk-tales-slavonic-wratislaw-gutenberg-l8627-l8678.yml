canonical_text:
  quote: ''
  summary: Kraljevitch Marko fights Musa Urbanusa for three nights and three days,
    uses a secret knife after distracting him, and discovers that Musa has three hearts
    with a speaking snake on the third. Marko rejects the snake's offer to enter him
    and give him strength. Later, after firearms are invented, a shepherd shoots through
    Marko's hand; Marko decides the world is no longer worth living in and goes into
    a cavern, where he still lives. A man lowered into the cavern encounters the Vila
    and Marko; Marko tests worldly strength through a red-hot iron substituted by
    the Vila, sends a sealed letter to the lords, and the lords suppress it out of
    fear that Marko may return. The footprints of his horse are still recognized.
  language: English
  quote_policy: summarized
