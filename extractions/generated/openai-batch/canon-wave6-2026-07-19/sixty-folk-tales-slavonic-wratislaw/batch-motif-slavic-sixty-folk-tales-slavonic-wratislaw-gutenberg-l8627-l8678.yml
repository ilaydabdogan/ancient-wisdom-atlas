  text: Marko asked Musa to look whether the sun was rising or setting, then drew
    his knife and ripped Musa open.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Inside Musa, Marko saw three hearts: one beating, one beginning to beat a
