canonical_text:
  quote: ''
  summary: In the opening of “The Lame Fox,” a father with one laughing eye and one
    weeping eye tests his three sons when they ask the reason. The fearless youngest
    learns that a wine-producing vine was stolen. The brothers set out, separate at
    a three-way crossroad, and the elder brothers mistreat a lame fox, while the youngest
    shares food with the same fox, which then speaks to him about his journey.
  language: English
  quote_policy: summarized
