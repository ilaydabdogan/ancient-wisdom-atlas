  summary: Travelers encounter a clear spring and a fragrant rose-bush that the servant
    wants to use for relief, but the seer forbids him and reveals each by sword-stroke
    to be a blood-filled danger identified as a queen placed there by a hostile mother
    or witch. After crossing the frontier of the dark realm, flashes from the horse's
    forehead revive the land into spring bloom. The king offers the seer half the
    kingdom, but the seer refuses and returns to his cottage.
