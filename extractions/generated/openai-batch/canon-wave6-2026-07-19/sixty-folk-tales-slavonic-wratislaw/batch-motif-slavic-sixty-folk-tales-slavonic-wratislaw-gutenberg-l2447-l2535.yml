canonical_text:
  quote: '"on the top of the hill stands a tree, and on the tree hang three lemons"'
  summary: A prince receives counsel and food from Jezibaba's monstrous son, reaches
    a smooth glass hill, and uses dumplings as steps to climb to a tree bearing three
    lemons. The lemons fall into his hands when he kneels beneath the tree, after
    which the tree and hill vanish. On his return, he cuts two lemons; each releases
    a beautiful damsel who asks for food, drink, and dresses, then vanishes when the
    prince cannot provide them.
  language: English
  quote_policy: quoted
