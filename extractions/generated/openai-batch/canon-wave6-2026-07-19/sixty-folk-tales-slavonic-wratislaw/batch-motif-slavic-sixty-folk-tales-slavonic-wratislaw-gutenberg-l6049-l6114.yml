canonical_text:
  quote: '"Arise, my birdie! arise, my lamb! arise, my dove!"'
  summary: A servant repeatedly uses a whistle to make the prince sleep when nine
    peahens arrive at a lake. The ninth peahen tries to wake the prince and later
    leaves a cryptic instruction for finding her. The servant reverses the instruction,
    and the prince kills him. The prince then travels alone, receives directions from
    a hermit, reaches the town and palace of the nine peahens, meets the empress in
    the form of a damsel, and marries her.
  language: English
  quote_policy: quoted
