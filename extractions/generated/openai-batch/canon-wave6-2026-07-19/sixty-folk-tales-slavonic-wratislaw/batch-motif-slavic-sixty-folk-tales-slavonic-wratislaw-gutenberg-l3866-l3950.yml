canonical_text:
  quote: ''
  summary: 'Prince Unexpected and Bony''s daughter flee from King Bony''s subterranean
    realm. The princess creates a frozen-spittle decoy, leads an ascent to the surface,
    and repeatedly transforms herself, the prince, and the horse to evade pursuers:
    first into river, bridge, and raven; then into a forest illusion; finally into
    church, priest, and bell at the boundary of Bony''s dominion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince says he cannot stitch the required boots and is not afraid of death;
    the princess promises to rescue him and says they must flee together.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess spits on a window pane, the spittle freezes, she leaves with
    the prince, locks the door, and throws away the key.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince and princess take each other by the hands, ascend to the place
    from which they had descended into the subterranean realm, find the prince's horse,
    mount it, and ride away rapidly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Servants sent by Bony hear the spittle answer from inside the locked room
    in the prince's voice; after they break in, no person is present and the spittle
    laughs at them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bony orders pursuit and threatens the servants with death if they return without
    the fugitives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the first pursuit, the princess transforms herself into a river, the
    prince into a bridge, the horse into a raven, and the road beyond the bridge into
    three roads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first pursuers lose the track at the bridge and return empty-handed; Bony
    says the bridge and river were the fugitives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the second pursuit, the princess, prince, and horse become a gloomy
    forest with many roads, by-roads, and footpaths, including an appearance of two
    riders on a horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The second pursuers chase the apparent fugitives through the forest, but the
    forest and fugitives vanish and the pursuers find themselves back where they started.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The princess says Bony himself is pursuing them and that the first church
    is the boundary of his dominion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The prince gives the princess his golden cross, described as a gift from his
    mother.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The princess becomes a church, the prince becomes the priest, and the horse
    becomes the bell; Bony questions the priest and then returns empty-handed.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: After Bony returns, Prince Unexpected rides on with Bony's daughter without
    further fear of pursuit.
  category: sequence
  evidence_refs:
  - ev:7
