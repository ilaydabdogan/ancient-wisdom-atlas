canonical_text:
  quote: ''
  summary: A poor scholar pays to bury an unburied dead man. After being robbed and
    thrown into a river by ferrymen, he is saved by the dead man's spirit, who teaches
    him spells for transforming into a crow, hare, and deer. The scholar later undertakes
    a royal quest to retrieve a victorious sword from a princess on an inaccessible
    island. The princess falls in love with him and secretly gathers fur and feathers
    from his transformed bodies as identifying traces. On his return, a treacherous
    archer kills him while he is in hare form, steals the sword and letter, and claims
    the promised marriage and throne. The king uses the sword to defeat his enemies,
    while the princess recognizes that the false claimant is not the man she met.
  language: English
  quote_policy: summarized
