canonical_text:
  quote: ''
  summary: A man returns with two oxen and tells others that the cattle belong to
    his niece Militza. He asks his brother to give him Militza as a daughter because
    he has no one, and the brother agrees. The man then prospers while saying everything
    is Militza's. When he calls a beautiful rye field his own, it catches fire; after
    he corrects the statement and says it belongs to Militza, the fire goes out and
    he remains lucky with her. The passage also includes brief footnotes and an editorial
    transition to Bosnian Serbian stories.
