canonical_text:
  quote: ''
  summary: A king obtains a snake said to grant understanding of animal speech when
    eaten. His servant George secretly tastes it and gains the same ability. After
    animal speech causes George to betray his knowledge, the king sends him on a life-saving
    quest to bring back a golden-haired maiden. On the journey, George rescues ants
    from fire and feeds young ravens by killing his horse; both groups promise future
    help.
  language: English
  quote_policy: summarized
