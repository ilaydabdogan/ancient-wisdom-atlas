canonical_text:
  quote: ''
  summary: 'The youngest brother visits his sister and her husband, follows instructions
    to ride a horse and cut grass only where it paws, and passes a series of strange
    sights: a damaged silver bridge, a boiling caldron of heads under the bridge,
    a sorrowful village, fighting pigs, a cheerful village, and a beautiful meadow.
    At supper the sister''s husband interprets these sights as moral and otherworldly
    signs, praises the youngest brother''s obedience, and rewards him.'
  language: English
  quote_policy: summarized
