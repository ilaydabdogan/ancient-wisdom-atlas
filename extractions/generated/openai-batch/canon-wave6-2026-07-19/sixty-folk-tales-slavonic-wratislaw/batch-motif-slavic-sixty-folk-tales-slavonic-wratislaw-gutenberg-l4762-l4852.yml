canonical_text:
  quote: '"we will die, but we will not give you up"'
  summary: God’s anger is followed by a worldwide three-year famine and drought. A
    young emperor, advised by young men, orders old people drowned to save bread for
    the young. Three brothers hide and feed their aged father. When no seed remains,
    the father advises sowing chaff threshed from the old roof; God blesses it, and
    abundant grain grows for the brothers while the rest of the world has no corn.
    News of the crop reaches the emperor, who summons the brothers.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Lord is described as angered at mankind, and a great famine covers the
    world for three years, with no grain produced and no rain or dew.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: People sow old seed and ask for God’s forgiveness and fertility, but the seed
    disappears, germinates weakly, or withers close to the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the following spring the drought continues with wind and little snow; the
    earth dries, people die, and cattle perish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A powerful emperor associates only with young men, and no old man has access
    to council, office, or army.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the young council advises him, the emperor proclaims that all old people
    are to be drowned and that no one may maintain or harbour an old man on pain of
    death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heralds publish the emperor’s command throughout the country, and brigands
    seize and drown old people without mercy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Three brothers tell their aged father about the edict; he offers to be taken
    away so that they may live, but they refuse and promise to nourish him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers hide their father under the raised portion of the floor in their
    cottage and clandestinely bring him what food they have.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When spring comes there is rain and warm earth, but no seed-corn; the father
    tells his sons to strip the old roof, thresh the bundles, and sow the chaff.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sons strip the house and barn, thresh the bundles, sow the chaff, and
    God gives a blessing so that green growth and abundant grain appear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers’ field has corn like a forest while elsewhere there is no corn,
    and the news reaches the emperor, who orders the brothers to appear before him.
  category: sequence
  evidence_refs:
  - ev:8
