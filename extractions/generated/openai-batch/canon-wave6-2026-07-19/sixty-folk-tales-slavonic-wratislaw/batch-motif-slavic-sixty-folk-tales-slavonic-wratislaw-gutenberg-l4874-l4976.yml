canonical_text:
  quote: ''
  summary: In the supplied tale passage, an old gipsy enters service with a devil,
    repeatedly avoids or redirects assigned labor through exaggerated claims, survives
    an attempted killing by using a fur-coat as a decoy, receives a bag of ducats,
    and then keeps the money by outmaneuvering the devil in a series of contests involving
    a stone, a club, a hare, and a bear in a cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old gipsy goes to serve a devil, who assigns him to bring fire-wood and
    water and put fire under a kettle.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the well, the gipsy cannot lift the filled pail and pours the water out
    to avoid losing the pail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gipsy grubs around the well as if digging and says he wants to bring the
    whole well to the devil.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The devil draws and carries the water himself after finding the gipsy at the
    well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the wood, rain and cold prevent the old gipsy from stooping after sticks,
    so he ties trees together with bast and says he is making the whole forest into
    one bundle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The devil takes up the fire-wood and goes home after seeing the gipsy tying
    the forest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The devil consults an older devil, who advises killing the gipsy while he
    sleeps.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gipsy places his fur-coat where he usually sleeps and hides under the
    bench; the devil beats the fur-coat with an iron club.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the beating, the gipsy makes a sound from the corner and says that a
    flea bit him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The older devil advises paying the gipsy, and the gipsy chooses a bag with
    ducats and leaves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In a stone-kicking contest, the devil kicks a stone loudly, while the gipsy
    pours water on it and says that water spurts out when he kicks a dry stone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In a club-throwing contest, the gipsy says that two brothers in heaven who
    are smiths could use the club, and the devil prevents him from throwing it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: For a running contest, the gipsy identifies a hare as his three-day-old son,
