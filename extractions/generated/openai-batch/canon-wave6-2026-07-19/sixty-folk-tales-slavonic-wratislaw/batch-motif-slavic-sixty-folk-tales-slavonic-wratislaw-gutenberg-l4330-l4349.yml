canonical_text:
  quote: ''
  summary: A man traveling alone meets the Sun, the Frost, and the Wind and gives
    a Christian salutation. The three personified forces argue over which of them
    was greeted. When they ask the man, he says the greeting was for the Wind. The
    Sun threatens to burn him and the Frost threatens to freeze him, but the Wind
    says he can protect the man by cooling him from the Sun and by withholding wind
    so the Frost cannot harm him.
