canonical_text:
  quote: "“Become a bear, and your wife a she-bear!”"
  summary: 'A grandfather tells Vanyusha a fable explaining bear paws: a poor cottager
    repeatedly petitions an enchanted lime-tree for wealth, a beautiful wife, and
    increasing offices. When he insists on becoming emperor despite warning, the tree
    transforms him and his wife into bears. The grandfather states the moral: do not
    desire the impossible; be content with little.'
  language: English
  quote_policy: quoted
