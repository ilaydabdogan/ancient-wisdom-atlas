literal_observations:
- id: obs:1
  text: The man reaches a meadow, hides under a bridge, and seizes the storm-mare
    by the bridle when she comes to drink water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man says he wants to find the daughter of the king of the Vilas, and the
    storm-mare tells him to mount and not fall off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The storm-mare rears three times; the man nearly falls, and when they pass
    splitting steps a piece of the mare's tail is torn off.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the Vilas' castles, the man is received and entertained, asks for the king's
    daughter, and is promised her while feasting begins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the first night, the man hides in the storm-mare's tail; searchers almost
    find him at dawn, but a cock crows and they can do nothing to him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the second night, the man hides in the mare's mane; an old witch reveals
    the place at dawn, but cocks crow before he can be killed, and afterward the village
    cocks are killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the third night, the mare hides the man under her foot in her shoe, and
    cockerels hatched in her throat crow before he can be taken out.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king refuses to give his daughter because the man did not sleep in the
    prepared bed; the man asks that she be brought so he may kiss her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Before the kiss, the mare instructs the man to seize the daughter, pull her
    onto the mare, and take a brush, a comb, and a glass of water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the daughter comes for the kiss, she stands on the man's foot in the
    stirrup, the mare bolts through the gate, and the king pursues on horseback.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the pursuit, the man throws the brush, and a forest with thorn bushes
    appears behind the fugitives, delaying the king.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The man throws the comb, and a great chain of mountains appears behind the
    fugitives, delaying the king again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The man throws the glass with water, and a great flood of water arises, making
