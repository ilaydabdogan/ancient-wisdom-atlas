canonical_text:
  quote: "“He threw the brush, and a forest placed itself behind them”"
  summary: An unnamed man uses a storm-mare to reach the Vilas' castles, repeatedly
    hides from searchers through the night, and escapes with the king's daughter while
    the pursuing king is delayed by a forest, mountains, and a flood made from thrown
    objects.
  language: English
