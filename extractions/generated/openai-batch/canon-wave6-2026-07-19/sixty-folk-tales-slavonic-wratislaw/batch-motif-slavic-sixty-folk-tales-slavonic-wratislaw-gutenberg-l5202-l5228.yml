canonical_text:
  quote: ''
  summary: A damsel marries a snake whose crystal dwelling is underground. She bears
    twin human children, a boy and a girl, and sets out in a golden carriage to have
    them christened among human beings. An old woman pursues with a sickle; the mother,
    facing death, tells the children to fly away as birds, the son as a nightingale
    and the daughter as a cuckoo. The birds fly out of opposite windows, the carriage
    disappears from knowledge, and only a dead nettle appears by the roadside where
    the mistress had been.
  language: English
  quote_policy: summarized
