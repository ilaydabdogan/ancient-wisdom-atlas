canonical_text:
  quote: ''
  summary: 'A young huntsman argues with a stranger over whether wrong can be made
    right by money. After three advocates support the stranger''s view, the huntsman
    is blinded with a red-hot iron and abandoned near a gallows. At night he overhears
    three evil spirits disclose hidden causes and remedies for several harms: a stopped
    city water supply, a princess''s wasting illness, and his own blindness. He later
    regains sight by washing in nearby water and restores the water of Ramul by removing
    a huge toad from the spring.'
  language: English
  quote_policy: summarized
