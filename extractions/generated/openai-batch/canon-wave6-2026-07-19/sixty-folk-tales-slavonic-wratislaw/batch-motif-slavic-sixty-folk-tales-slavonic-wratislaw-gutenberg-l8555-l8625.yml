canonical_text:
  quote: ''
  summary: Marko learns the route of black Arapin, compels an innkeeper to serve wine,
    and shares it with his piebald horse. In a garden by a brook he finds Soliman's
    daughter grieving because Arapin will take her away. She describes treasures offered
    to a reluctant rescuer, including a golden shirt, a serpent with a tray, a golden
    casket, and a precious stone. Marko identifies himself and sends her to her father.
    Arapin arrives, obtains the damsel and the goods, and leaves. Marko and his speaking
    horse pursue him; a dark fog is seen behind Arapin's party. Marko attacks the
    rearguard, duels Arapin with maces, fells him, beheads him with a sword, gives
    the head to the damsel, returns home, and receives his promised reward at an imperial
    feast.
  language: English
  quote_policy: summarized
