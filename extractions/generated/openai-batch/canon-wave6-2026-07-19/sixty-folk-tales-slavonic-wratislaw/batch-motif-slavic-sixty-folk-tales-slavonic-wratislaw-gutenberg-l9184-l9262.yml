canonical_text:
  quote: ''
  summary: Milutin warns his ten companions that the king intends to identify and
    kill him, and instructs them to copy every command simultaneously. The king cannot
    distinguish him, has a servant secretly mark the wisest speaker by cutting his
    boot-heel, but Milutin makes all the boots match. After the king later recognizes
    Milutin by his horse, the two fight; both emit fire from their mouths, and Milutin
    kills the king, marries the count's daughter, and takes the slain king's realm.
    The passage then turns to editorial comments on Illyrian-Slovenish stories, mentioning
    Vilas, a Vila-human marriage ending in separation, a Cinderella variant, wonderland
    tales, and a white snake legend.
  language: English
  quote_policy: summarized
