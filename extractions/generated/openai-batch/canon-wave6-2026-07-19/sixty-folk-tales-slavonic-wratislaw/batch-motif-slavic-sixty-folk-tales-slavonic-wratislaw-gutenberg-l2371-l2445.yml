canonical_text:
  quote: the glass hill and the three lemons
  summary: A prince searching for the glass hill and the three lemons reaches a silver
    castle, where Jezibaba warns him about her ogre son, hides him, and mediates a
    safe meeting. The ogre spares the prince because of greetings from his brother
    in the leaden castle, gives him silver dumplings, and sends him toward a brother
    in a golden castle. After three days in wooded mountains, ravens reveal the direction,
    and the prince reaches the golden castle, where another Jezibaba repeats the warning
    and hides him until her son arrives.
  language: English
  quote_policy: quoted
