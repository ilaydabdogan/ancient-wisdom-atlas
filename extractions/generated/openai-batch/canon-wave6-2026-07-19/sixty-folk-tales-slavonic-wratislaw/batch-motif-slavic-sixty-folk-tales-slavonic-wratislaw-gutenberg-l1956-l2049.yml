  text: The father sees that his own taper is tiny and close to the ground, asks for
    more life, and is refused.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: While Death is not looking, the father lights a large new taper for himself
    and places it where his tiny taper had been.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Death says the father ought not to have done it, but acknowledges that he
    now possesses the additional lifetime.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Death visits the mother, places the boy on the mother's bed, asks about her
    condition, and shares a feast with the family.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Death says she will make respectable people ill, tell the father all remedies,
    and allow him to cure them for recompense.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: 'Death gives a rule: if she stands at a patient''s feet the father may help,
    but if she stands at the head he should not try.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The father goes from patient to patient, benefits people whom Death has made
    ill, and becomes a distinguished physician.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The physician restores a dying prince to health using salves and powders and
    is well paid.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: When a count is dying, Death stands at the head of the bed; the physician
    orders the bed turned so the patient's feet face Death, treats him, and the count
    recovers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Death warns the physician not to play that trick again and says she must still
    take the count eventually.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: After some years the father is very old and asks Death to take him, but she
    cannot because his long additional taper has not burned out.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: Death later reveals herself, rides in his carriage, tickles and taps him under
