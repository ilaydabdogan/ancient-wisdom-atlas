canonical_text:
  quote: ''
  summary: A poor father asks the first person he meets to sponsor his newborn son;
    the person is Death, appearing as a handsome woman. Death acts as godmother, shows
    the father under-world vaults containing life-duration tapers, and he secretly
    gives himself a longer taper. Death later teaches him remedies and makes him a
    physician, with the rule that patients can be helped only when she stands at their
    feet. He saves a count by turning the bed so that the count's feet face Death,
    is warned, grows old, and finally dies when Death touches him with a green twig
    in his carriage.
  language: English
  quote_policy: summarized
