canonical_text:
  quote: It was everywhere as if life had been lost in a single moment.
  summary: In the wizard's castle, the prince and his three companions repeatedly
    recover the princess from concealed object-forms. The wizard removes her again
    and loses iron hoops when she is recovered. The prince observes a petrified and
    desolate castle. Sharpsight locates the princess at great distances, Long carries
    the helpers and reaches remote places, and Broad drinks down the black sea so
    the hidden ring can be obtained.
  language: English
  quote_policy: quoted
