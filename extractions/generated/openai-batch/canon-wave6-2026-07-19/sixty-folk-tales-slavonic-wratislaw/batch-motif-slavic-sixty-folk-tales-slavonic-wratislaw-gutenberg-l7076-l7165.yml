canonical_text:
  quote: "“in that lake is a dragon, and in the dragon a boar, and in the boar a pigeon,
    and in that is my strength.”"
  summary: An emperor’s two elder sons chase a hare into a water-mill, where it proves
    to be a dragon and devours them. The third son avoids the trap, learns from a
    captive old woman that the hare is a dragon, and arranges for her to discover
    where the dragon’s strength is kept. The dragon gives false answers, then says
    its strength is far away in a lake beneath another emperor’s city, inside a dragon,
    a boar, and a pigeon. The prince disguises himself as a shepherd, enters that
    other empire, takes service with its emperor, goes to the dangerous lake with
    hounds, a falcon, and bagpipes, and challenges the lake dragon to single combat.
    The passage ends while the dragon and prince are wrestling.
  language: English
  quote_policy: quoted
