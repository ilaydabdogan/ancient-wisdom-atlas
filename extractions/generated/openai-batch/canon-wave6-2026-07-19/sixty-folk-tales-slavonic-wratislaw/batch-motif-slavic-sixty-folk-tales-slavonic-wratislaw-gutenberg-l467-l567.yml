canonical_text:
  quote: "“This one will I have, and no other.”"
  summary: An aging king urges his only son to marry and gives him a golden key to
    an unused tower chamber. The prince enters a starry circular room with twelve
    window-images of crowned damsels, uncovers the curtained image of a pale damsel
    in white, and chooses her. His father warns that she is captive to a wicked wizard
    in an iron castle and that past rescuers have not returned. The prince departs
    to seek her, becomes lost in a forest, and recruits Long, who can extend himself,
    and Broad, who can widen himself enormously.
  language: English
  quote_policy: quoted
