canonical_text:
  quote: ''
  summary: The passage opens with a formulaic preface. A woman eats a rolling pea
    and later bears Little Rolling-pea, a rapidly growing and unusually capable boy.
    He obtains and tests a seven-pood mace, departs on a journey, gathers two mighty
    companions, and helps slay a six-headed dragon threatening a city. The heroes
    bring the dragon's tongues as proof and receive public reward from the emperor.
  language: English
  quote_policy: summarized
