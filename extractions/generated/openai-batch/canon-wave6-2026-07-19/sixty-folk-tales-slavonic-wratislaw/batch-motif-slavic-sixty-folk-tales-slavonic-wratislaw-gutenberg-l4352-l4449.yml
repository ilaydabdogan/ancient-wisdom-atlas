  text: The wife goes to draw water, sees a rolling pea, calls it a gift of God, eats
    it, and later becomes the mother of a boy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy grows rapidly and learns in one year what others learn in several
    years.
  category: attribute
  evidence_refs:
