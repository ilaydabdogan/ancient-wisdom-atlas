- id: obs:4
  text: Little Rolling-pea finds a pin and asks his father to have it made into a
    seven-pood mace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: His father instead buys seven poods of iron and has smiths make a mace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Little Rolling-pea throws the mace into storm clouds, blocks its falling return
