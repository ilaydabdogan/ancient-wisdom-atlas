canonical_text:
  quote: ''
  summary: A slain poor scholar lies under an oak for a year until the spirit of a
    buried man restores him to life and sends him to the castle on the eve of the
    princess's wedding. The princess and the assassin-archer recognize him. He proves
    the archer's treachery by transforming into a deer, a hare, and a crow, while
    fur and feathers kept by the princess grow back into place. The king orders the
    archer executed by wild horses, and the young man marries the princess.
  language: English
  quote_policy: summarized
