  quote: ''
  summary: During a pursuit, a mare passes through steps that open with a gust of
    wind and close again, preventing the king from following. The king calls to his
    son-in-law and throws a wish-granting girdle over the steps as a gift for his
    daughter. The king returns; the others remain happy. A male figure thanks the
    storm-mare, commands the girdle to place them at his house, and a banquet follows.
