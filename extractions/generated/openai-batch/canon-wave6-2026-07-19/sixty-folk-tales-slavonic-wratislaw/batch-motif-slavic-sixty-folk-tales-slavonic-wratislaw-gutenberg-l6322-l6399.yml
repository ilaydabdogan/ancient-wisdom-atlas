canonical_text:
  quote: ''
  summary: A faithful shepherd rescues a serpent from a fire. The serpent, revealed
    as the child of the emperor of serpents, directs him to ask for the ability to
    understand animals. The emperor grants this ability through a reciprocal spitting
    ritual but warns that disclosure will bring death. The shepherd returns, understands
    crows who reveal a buried vault of silver and gold, receives the treasure from
    his master, prospers, marries, and later sends provisions to his herdsmen through
    his wife at New Year.
  language: English
  quote_policy: summarized
