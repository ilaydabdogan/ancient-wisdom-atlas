  - ev:1
- id: obs:4
  text: Sharpsight reports that the iron castle is far for the prince alone but reachable
    that day with the companions, and he describes the prince's bride as sitting in
    a high tower behind an iron lattice under a wizard's guard.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prince asks for help freeing the bride, and the three comrades guide him
    through rocks, mountains, and forests while removing obstacles from the road.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At sunset the prince and companions enter the iron castle by an iron bridge;
    the bridge rises and the gate closes by itself, making them captives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inside the castle they see richly dressed people, gentlemen, and servants
    who do not move because they have been turned to stone; they also find a supper
    table prepared for four.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wizard enters with the princess, and he tells the prince he may take her
    if he keeps her in sight for three nights; if she vanishes, the prince and his
    three servants will be turned to stone like previous arrivals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The princess is described as beautiful, dressed in white with a silver girdle
    and pearl crown, pale and sad, and later silent and unresponsive like marble.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The prince tries to stay awake; Long winds himself around the room, Broad
    blocks the doorway by swelling, and Sharpsight watches from a pillar, but all
    of them fall asleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At dawn the princess is gone; Sharpsight looks out and says she is a hundred
    miles away as an acorn on top of an old oak in a forest, and Long carries Sharpsight
    away in pursuit.
  category: sequence
  evidence_refs:
