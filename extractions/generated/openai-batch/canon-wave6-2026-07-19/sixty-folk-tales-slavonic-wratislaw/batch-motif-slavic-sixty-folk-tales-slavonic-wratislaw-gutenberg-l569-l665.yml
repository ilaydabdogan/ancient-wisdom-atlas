canonical_text:
  quote: ''
  summary: The prince and his companions meet Sharpsight, whose bandaged eyes can
    see at great distance and destroy objects when uncovered. With Long, Broad, and
    Sharpsight, the prince reaches an iron castle where his bride, a princess, is
    held under a wizard's guard. The castle contains petrified people. The wizard
    permits the prince to take the princess only if he can keep her in sight for three
    nights, warning that failure will turn the prince and his servants to stone. During
    the first night the guards fall asleep; at dawn the princess has vanished, and
    Sharpsight sees her far away as an acorn on an old oak.
  language: English
  quote_policy: summarized
