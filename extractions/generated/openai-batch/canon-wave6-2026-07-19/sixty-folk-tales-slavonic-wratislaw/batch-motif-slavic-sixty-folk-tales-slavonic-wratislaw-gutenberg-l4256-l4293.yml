  quote: At every step the frightful company kept increasing; for on the road almost
    everything was transformed into a spectre.
  summary: A Ruthenian/Podolian man, bereaved by plague, flees into the forest. At
    night he hears music and sees a spectral swarm surrounding a black carriage in
    which the Plague sits. Nearby objects and natural beings become spectral participants.
    In the morning his belongings are ruined, but he is alive and moves on to seek
    shelter and food.
