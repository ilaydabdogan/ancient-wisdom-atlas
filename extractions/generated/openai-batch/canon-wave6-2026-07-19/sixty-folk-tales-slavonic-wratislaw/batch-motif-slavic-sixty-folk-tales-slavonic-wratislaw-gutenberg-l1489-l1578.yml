canonical_text:
  quote: '"These, these are my eyes! Praise be to God! now I see well again!"'
  summary: A poor orphan named Johnny enters service with a blind old goatherd, is
    warned not to pasture goats on a forest hill where the Jezinkas put people to
    sleep and tear out their eyes, resists three Jezinkas' temptations, binds them
    with bramble shoots, forces them to reveal the old man's eyes from a cavern heap,
    rejects false eyes, punishes two by water, and restores the master's proper sight.
  language: English
  quote_policy: quoted
