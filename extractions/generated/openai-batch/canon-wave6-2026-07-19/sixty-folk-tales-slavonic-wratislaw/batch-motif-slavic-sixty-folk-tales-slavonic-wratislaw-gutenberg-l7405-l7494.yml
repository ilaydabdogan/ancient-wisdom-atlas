canonical_text:
  quote: "“As to me to-day, so to them for life.”"
  summary: 'A man stays with personified Fate and witnesses Fate assign the life-fortunes
    of newly born souls according to Fate’s own condition that night. Fate explains
    the man’s poverty, advises him to adopt his lucky niece Militza, and answers questions
    about an insatiable household, unproductive cattle, and a stream without offspring.
    On the return journey, the man relays the answers: the stream tries to drown him
    after learning the cause, a cattle owner restores fertility by slaughtering his
    best ox on his name-day, and another householder honors his neglected parents,
    after which household consumption decreases and the parents die.'
  language: English
  quote_policy: quoted
