canonical_text:
  quote: ''
  summary: 'George travels through a forest to a sea, resolves a quarrel between fishermen
    by buying and releasing a golden fish, and learns where Goldenhair lives. At the
    Crystal Palace, Goldenhair''s father requires George to complete three tasks in
    three days: gather scattered pearls, recover a ring from the sea, and bring waters
    of death and life. Ants collect the pearls, the released golden fish retrieves
    the ring from a pike, and young ravens bring the two waters. George tests the
    waters by killing a spider and reviving a fly, which then says it will help him
    identify Goldenhair among the twelve maidens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: George walks through a forest to a long, broad sea where two fishermen are
    quarrelling over a large golden fish caught in their net.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: George gives the fishermen all the money supplied for his journey, asks them
    to divide it equally, and releases the golden fish back into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The released fish speaks to George and says that when he wants it, he should
    think of it and it will requite him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fishermen tell George that Goldenhair is the king's daughter in the Crystal
    Palace on an island, that she combs golden hair at dawn, and that she is one of
    twelve maidens.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The island king says George may obtain Goldenhair only by performing three
    tasks in three days, one task each day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: For the first task, George must collect all the pearls from Goldenhair's broken
    necklace after they have scattered in long grass; ants gather them, and a lame
    ant brings the final pearl.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the second task, George must recover a gold ring lost in the deep sea;
    the golden fish returns from the deep with a pike carrying the ring.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For the third task, George must bring waters of death and of life; two young
    ravens bring him two bottle-gourds, one containing each water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the edge of the forest, George sprinkles a spider with the water of death
    and the spider dies; he sprinkles a fly with the water of life and the fly revives
    and escapes the cobweb.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The revived fly tells George that without it he would scarcely guess correctly
    which of the twelve maidens is Goldenhair.
  category: speech
  evidence_refs:
  - ev:8
