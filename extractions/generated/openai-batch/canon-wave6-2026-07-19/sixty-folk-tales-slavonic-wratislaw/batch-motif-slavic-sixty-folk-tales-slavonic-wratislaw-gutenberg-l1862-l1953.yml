canonical_text:
  quote: ''
  summary: 'George is ordered to complete one more task: kill a destructive unicorn-like
    wild beast in order to receive the damsel. He and his companions trick the beast
    into fighting another beast, then kill it when its horn is stuck in a tree. The
    castle authorities still try to avoid giving him the king''s daughter because
    of his low birth and arrange for soldiers to shoot him, but a companion with a
    thumb-stoppered bottle blinds them by sprinkling liquid. George is then given
    a royal robe and the damsel, and the tale ends with a wedding and a formulaic
    nonsense close. Editorial notes compare the tale to Grimm''s ''Golden Goose,''
    interpret some helper figures allegorically, comment on Slavonic nonsense endings,
    and introduce Moravian tale variants including ''Godmother Death.'''
  language: English
  quote_policy: summarized
