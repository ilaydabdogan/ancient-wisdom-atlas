canonical_text:
  quote: ''
  summary: The hag obtains three golden hairs from the sleeping Grandfather Allknow
    by pulling them one at a time and presenting three dream-questions. He explains
    how to restore a spring of living water, a youth-giving apple-tree, and how a
    bound ferryman can be freed. In the morning he appears as the golden-haired divine
    Sun and departs eastward. Floatling receives the hairs and answers, restores the
    spring and tree for rewards, instructs the ferryman, returns to the king and his
    wife, and the king leaves seeking the life-giving gifts and may become the ferryman.
    An editorial note compares the story to Grimm's tale and identifies the hairs
    as sunbeams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After supper the golden-headed old man sleeps on the hag's lap; she pulls
    out a golden hair and throws it down, where it rings like a harp-string.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hag says she dreamed of a city whose spring of living water healed the
    sick and revived the dead, but had stopped flowing for twenty years.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man answers that a toad is sitting on the spring in the well and that
    killing it and cleaning the well will make the water flow again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the second golden hair is pulled, the hag asks about an apple-tree that
    once bore youth-restoring apples but has been fruitless for twenty years.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old man answers that a snake under the tree exhausts its powers; killing
    the snake and transplanting the apple-tree will restore its fruiting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the third golden hair is pulled, the hag asks about a ferryman on a
    black sea who has been ferrying for twenty years without release.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old man says the ferryman should give the oar into another person's hand
    and jump ashore, so the other person becomes ferryman in his place.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old man says he must rise early to dry the tears of the king's daughter
