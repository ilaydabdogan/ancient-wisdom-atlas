canonical_text:
  quote: ''
  summary: A king offers his lost daughter and kingdom to whoever finds her. Four
    brothers go despite their father’s refusal. The astrologer locates the princess
    by reading the sky and says a dragon holds her on an island beyond the Red Sea.
    The brothers travel by carriage and boat; the thief brings the princess into the
    boat, the huntsman shoots the pursuing dragon, and the cobbler repairs the boat
    after the dragon damages it. The brothers dispute who deserves the princess and
    kingdom. The king awards them to the astrologer as the finder, while giving each
    brother a district to rule. Their father later lives with each son in a seasonal
    sequence. The passage then gives editorial commentary connecting the tale with
    the Ceres and Proserpine cycle, reading the brothers as the four seasons and the
    princess as earth or fertility, and comparing the tale with Grimm’s “Four Accomplished
    Brothers.” The excerpt ends with the beginning of a new section on Hungarian-Slovenish
    stories.
  language: English
  quote_policy: summarized
