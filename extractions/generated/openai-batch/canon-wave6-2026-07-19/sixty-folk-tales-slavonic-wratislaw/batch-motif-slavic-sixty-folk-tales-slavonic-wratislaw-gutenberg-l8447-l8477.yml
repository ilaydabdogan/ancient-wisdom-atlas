canonical_text:
  quote: ''
  summary: Kraljevitch Marko comes armed to an inn, hears Turks speak of his fame
    and of Andro, and meets Andro as an adopted brother. Andro sings despite fear
    of the Vila of the cloud; a spear strikes him down, Marko knocks the Vila down,
    and she revives Andro with grasses and gives Marko a wondrous flying horse. Later,
    a wicked woman at an inn becomes enamoured of Andro, puts honey in his wine, murders
    him, and is killed by Marko in revenge.
  language: English
  quote_policy: summarized
