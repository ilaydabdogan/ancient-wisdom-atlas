canonical_text:
  quote: ''
  summary: A fox helps a simpleton keep the golden damsel, golden horse, and golden
    apple-tree by transforming into substitutes for each exchange. Each false form
    retains a fox-like mark, and those who name the mark are killed by the deceived
    hosts after the fox escapes. The simpleton returns with the golden damsel, golden
    horse, golden apple-tree, and vine, ransoms his condemned brothers, plants the
    vine, and his father's weeping eye is restored while the household flourishes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fox says the simpleton cannot otherwise acquire the golden horse because
    of an oath by his father's eyesight, and offers to try to become the golden damsel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox bounds about and transforms into a golden damsel; everything is damsel-like
    except that her eyes are shaped like a fox's eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The simpleton puts the fox-damsel in the golden cradle, leaves the real damsel
    under a tree with the golden horse, and exchanges the fox-damsel for the golden
    horse.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a banquet, a guest notices the fox-like eyes; the fox springs up and runs
    away, and the lord and guests put the speaker to death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fox offers to become the golden horse, transforms into a golden horse
    with a fox's tail, and is delivered in exchange for the golden apple-tree.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: At another feast, a guest says the horse has a fox's tail; the fox jumps up
    and runs away, and the speaker is put to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fox offers to become the golden apple-tree, transforms into a golden apple-tree,
    and is given to the lord of the vine so the simpleton can obtain the vine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the display of the golden apple-tree, a guest says the fruit is shaped
    like a fox's head; the fox jumps up and runs away, and the speaker is slain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The simpleton takes leave of the fox and goes home with the golden damsel,
    golden horse, golden apple-tree, and vine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the cross-road, the simpleton finds his two brothers condemned to be hanged
    and ransoms them with treasure supplied by the damsel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers are called malefactors who had intended to acquire the vine by
    slaying, burning, and plundering; they envy the simpleton after being ransomed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the simpleton plants the vine in the garden, it pours forth wine, his
    father's left eye stops weeping and begins to laugh, the apple-tree blossoms,
    the golden horse neighs, and the damsel sings.
  category: sequence
  evidence_refs:
  - ev:7
