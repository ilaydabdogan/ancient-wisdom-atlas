    cap, and lies in her bed behind the curtains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Red Hood arrives, finds the door open and the room strange, greets the supposed
    grandmother, receives no answer, and notices unusual ears, eyes, hands, and mouth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After answering Red Hood's questions about his enlarged features, the wolf
    springs from the bed and eats her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A huntsman hears the wolf snoring, enters, recognizes the wolf, decides not
    to shoot in case the grandmother can still be released, and cuts open the sleeping
    wolf's maw with a knife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Red Hood emerges from the wolf's maw, saying it was dark inside, and the grandmother
    also comes out alive but short of breath.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Red Hood fetches large stones to fill the wolf's maw; when the wolf wakes,
    the stones make him fall and beat himself to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the wolf's death, the huntsman takes the wolf's skin, the grandmother
    eats the cake and drinks the wine and becomes strong again, and Red Hood resolves
    not to go out of the road into the forest when her mother has forbidden it.
  category: sequence
  evidence_refs:
  - ev:7
