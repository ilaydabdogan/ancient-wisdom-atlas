canonical_text:
  quote: ''
  summary: A beloved girl called Red Hood is sent by her mother with cake and wine
    to her ill grandmother in the forest and is told not to leave the road. A wolf
    learns the grandmother's location, distracts Red Hood with flowers, eats the grandmother,
    disguises himself in her clothes and bed, and then eats Red Hood. A huntsman discovers
    the sleeping wolf, cuts open his maw, and releases Red Hood and the grandmother
    alive. Red Hood fills the wolf's maw with stones, causing his death, and resolves
    not to leave the road when forbidden.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The girl is loved by those who see her, especially by her grandmother, who
    gives her a red samite hood; people then call her Red Hood.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red Hood's mother sends her to her ill grandmother with cake and wine and
    instructs her to behave properly, greet her grandmother, walk carefully, and not
    leave the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grandmother lives in the forest, away from the village.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the forest Red Hood meets a wolf, does not fear him, and tells him her
    errand, what she carries, and where her grandmother lives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf thinks that Red Hood will taste better than the old woman and plans
    to trick her so he can catch both.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wolf draws Red Hood's attention to the flowers, birds, and cheerful forest;
    Red Hood leaves her way to gather flowers and goes deeper into the forest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wolf goes by the straight road to the grandmother's house, gains entry
