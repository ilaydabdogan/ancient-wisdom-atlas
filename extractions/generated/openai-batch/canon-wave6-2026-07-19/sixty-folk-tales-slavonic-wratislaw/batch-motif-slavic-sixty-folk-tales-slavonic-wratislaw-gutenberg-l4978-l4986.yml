  quote: ''
  summary: An elder devil proposes that whoever whistles best and can be heard three
    miles away should receive the money. The devil whistles loudly. The gipsy tells
    him that the next whistle will blind and deafen him, persuading him to bind his
    eyes and ears. The gipsy then strikes the devil near the ears with a log-splitting
    mallet. The devil begs him to stop and tells him to go away with the money.
