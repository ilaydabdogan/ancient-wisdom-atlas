canonical_text:
  quote: ''
  summary: The narrative portion concludes a tale in which a cobbler receives a richly
    mounted cudgel from an old man. The cudgel is activated by a spoken command and
    summons two men who beat whoever has invoked it until ordered to stop. The cobbler
    uses it to force a woman who had his earlier gifts to return a lamb and tablecloth,
    then returns to his family with all three gifts and shares abundance with the
    poor. The passage then shifts into editorial notes introducing Polish stories,
    including comments on Polish language and literary history, and a comparative
    note on Kostchey the Deathless in Polish and Russian story traditions.
  language: English
  quote_policy: summarized
