canonical_text:
  quote: ''
  summary: A diligent brother separates from an idle brother and becomes poor while
    the idle brother prospers through entrusted caretakers. The poor brother encounters
    personified forms of his brother's luck and his own luck, then sets out to find
    Fate. On the way he lodges with a prosperous householder whose people cannot be
    satisfied and whose dead parents appear as ghostlike figures sucking bones behind
    the stove; the host asks him to question Fate about these troubles. The excerpt
    ends as the traveller reaches another village lodging.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers live together; one does all the work while the other idles, eats,
    and drinks, and God gives them prosperity in their livestock, bees, and other
    possessions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The working brother insists on separating the property despite the idle brother's
    attempt to dissuade him, and the idle brother allows him to make the division.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the division, the idle brother hires animal and bee keepers, leaves
    his property in their hands and God's, and continues living at home as before.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The working brother personally tends and watches his property, but it declines
    until he becomes so poor that he lacks shoes and goes barefoot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The poor brother finds sheep in a meadow with no shepherd, where a beautiful
    damsel sits spinning golden thread and says she is his brother's luck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The damsel tells the poor brother that his own luck is far from him but can
    be found if he goes to seek it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The prosperous brother has compassion on the poor brother and gives him boots
    and money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The poor brother returns home, takes a wallet with bread and a staff, and
    goes into the world to look for his luck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a wood, the traveller finds a gray-haired old maid asleep under a bush;
    she identifies herself as his luck, says Fate gave her to him, tells him to look
    for Fate, and disappears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The traveller enters a village farmhouse containing a large fire and a large
    caldron of supper cooking before the master of the house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The householder says he has enough of everything but cannot satisfy his people,
    describing them as if a dragon were in their stomachs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: At supper, the household snatches and grabs food from one another, and the
    large caldron is quickly emptied.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A maidservant puts the bones in a heap and throws them behind the stove, where
