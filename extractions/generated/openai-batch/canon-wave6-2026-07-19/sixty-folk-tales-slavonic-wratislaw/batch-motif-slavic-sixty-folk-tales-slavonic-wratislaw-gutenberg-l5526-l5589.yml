canonical_text:
  quote: ''
  summary: Ilya Murometz arrives at the Prince of Kief’s white-stone palace, identifies
    himself, reports victories at Chernigof and over Nightingale the robber, proves
    the captive is real, shields the prince and princess from Nightingale’s destructive
    whistle, and kills the robber. Ilya forms brotherhood with Dobrynya, rides out
    seeking adventures, learns from a wandering beggar that the monstrous Idolishtcha
    has come to Kief, disguises himself as a beggar, enters the palace, observes Idolishtcha’s
    excessive eating and drinking, taunts him, reveals himself, kills himExited, and
    is honored by the prince among the mighty heroes.
  language: English
  quote_policy: summarized
