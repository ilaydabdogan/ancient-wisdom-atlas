  summary: A woman finds that food left in her stove is repeatedly eaten while only
    a baby remains in the house. A wise woman hides and sees the baby become a dwarfish
    old man, eat the food, and turn back into a baby. After the wise woman places
    him on a block and chops beneath his feet, he becomes an old man again and says
    he has transformed through fish, bird, ant, quadruped, and human forms.
