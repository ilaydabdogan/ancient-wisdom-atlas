canonical_text:
  quote: ''
  summary: An unnamed traveller seeks the road to the city of Perdonkorten. At the
    moon's house he survives the moon's freezing return by hiding in ashes, then the
    moon directs him to the wind. The wind knows the route and leads him through abysses
    and a terrible rock, which the traveller passes by throwing a hat that opens the
    rock. In Perdonkorten the traveller enters a church unseen under a mantle, interrupts
    a wedding by knocking down the chaplain's books, and hears that the bride had
    promised to wait seven years for her earlier deliverer. After the wedding is delayed,
    he later removes the mantle, is recognized as the deliverer, embraces the bride,
    and marries her.
  language: English
  quote_policy: summarized
