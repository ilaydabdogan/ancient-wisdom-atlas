canonical_text:
  quote: ''
  summary: A traveller with a letter stays again at a proprietor's house. The hosts
    try to return money by hiding it in his knapsack. The traveller hangs the knapsack
    on a tree while reaching for apples, then flees when he sees the proprietor. The
    proprietor places the knapsack with the money on a bridge, but the traveller closes
    his eyes to test crossing as if blind and unknowingly steps over it. The proprietor
    concludes that the traveller has angered God.
