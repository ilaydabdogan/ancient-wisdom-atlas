canonical_text:
  quote: Once upon a time there was nothing; there was only the heaven above, and
    water beneath.
  summary: The tale describes God and the devil on primordial waters, the devil’s
    diving for sand, the formation and expansion of land, the devil’s later creation
    of a multitude of devils in heaven by sprinkling wash water, and God’s ordering
    St. Ilya to drive the devils from heaven with thunder, lightning, and rain. The
    passage then shifts to editorial notes on South Russian stories.
  language: English
  quote_policy: quoted
