canonical_text:
  quote: The birch-leaves were turned into gold!
  summary: Betty takes goats to a birch-wood and, at midday, dances with a beautiful
    maiden later identified as a wood-lady. The maiden gives Betty a basket and tells
    her to look only at home; Betty looks early, sees birch leaves, throws some away,
    and later finds the remaining leaves turned to gold. Betty's mother explains wood-ladies'
    dances and dangers, and Betty later returns to the birch-wood but never sees the
    maiden again.
  language: English
  quote_policy: quoted
