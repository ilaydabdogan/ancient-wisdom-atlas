canonical_text:
  quote: ''
  summary: A prince returns to his father's castle with the last of three lemons.
    When he cuts it open after preparing food, drink, and clothing, a beautiful lady
    appears and becomes his wife. After succeeding his father, the young king goes
    to war and places his wife on an inaccessible throne in a garden beside a lake,
    reachable only by a silken cord. A resentful old woman sends her maidservant to
    gain access, comb the queen's hair, and insert a pin in her head. The queen disappears
    as a white dove, and the maidservant puts on the queen's clothes and sits in her
    place. The king returns, finds the impostor, and mourns the loss of his wife's
    beauty.
  language: English
  quote_policy: summarized
