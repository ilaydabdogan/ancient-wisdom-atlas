canonical_text:
  quote: ''
  summary: 'The Lord God travels on earth in the form of an old man. He teaches a
    ploughman and a woman how to plough and weave properly, later blessing the truthful
    ploughman and imposing a harder condition on the woman who claims the skill as
    her own. The passage also says humans once commanded animals and inanimate things
    until wickedness altered this; a woman who tries to ride self-moving logs is made
    to carry them. The Lord tests a herdsman and a shepherd by asking for water: the
    herdsman refuses and his herd runs off, while the shepherd goes for water and
    receives blessed, quiet sheep, two dogs made from stones, and instruction in driving
    sheep with a trumpet. The wolf’s weak loins are also explained etiologically.'
  language: English
  quote_policy: summarized
