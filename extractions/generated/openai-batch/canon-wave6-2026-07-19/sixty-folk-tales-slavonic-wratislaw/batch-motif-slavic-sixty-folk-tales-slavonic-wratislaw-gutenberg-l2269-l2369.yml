canonical_text:
  quote: ''
  summary: 'Opening portion of “The Three Lemons”: an aging king urges his only son
    to marry; an old woman tells the prince to seek the glass hill and pluck three
    lemons to gain a wife. The prince departs, follows ravens to a lead castle, is
    hidden by Jezibaba from her giant son, receives directions toward a brother in
    a silver castle, and then follows another group of ravens deeper into the mountains.'
  language: English
  quote_policy: summarized
