canonical_text:
  quote: "“made them promise under oath to give their sister to the first who came
    to ask for her”"
  summary: A dying father binds his three sons by oath to give their sister to the
    first suitor. An old poor man asks for her and marries her after the youngest
    brother insists on keeping the oath. Later the two elder brothers visit her in
    turn, are given a horse-related grass-cutting task by the husband, become covetous
    at a silver bridge, disobey the instructions, lie, and are sent home supperless.
    The passage ends with the youngest brother being invited to visit.
  language: English
  quote_policy: quoted
