canonical_text:
  quote: ''
  summary: A reduced farmer refuses to give his daughter to an old knightly village
    proprietor and leaves the village under oppression. On moving day a thin pale
    maiden emerges from behind the stove and identifies herself as the family's Poverty,
    saying she must go with them. The farmer tricks her into putting her fingers into
    a cleft block of wood and traps her there, then leaves. In a new village the family
    prospers. The old proprietor later frees Poverty from the block; after this she
    stays with him, and he spends away his possessions.
  language: English
  quote_policy: summarized
