canonical_text:
  quote: ''
  summary: After a royal wedding has been arranged from a letter, the returning king
    grudgingly accepts Floatling as son-in-law but sends him to obtain three golden
    hairs from Grandfather Allknow. On the journey Floatling crosses a black sea with
    a ferryman who asks for an answer about his release, visits two distressed cities
    seeking remedies for a fruitless youth-giving apple-tree and a stopped living-water
    well, and reaches Grandfather Allknow's golden palace. His godmother, an old hag
    and mother of the Sun, hides him under a tub and promises to obtain the hairs
    and answers. Grandfather Allknow returns in the evening as an old grandfather
    with a golden head and smells human flesh.
  language: English
  quote_policy: summarized
