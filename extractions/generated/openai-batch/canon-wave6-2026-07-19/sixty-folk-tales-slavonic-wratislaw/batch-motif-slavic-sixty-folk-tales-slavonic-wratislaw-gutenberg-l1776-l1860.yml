canonical_text:
  quote: ''
  summary: 'A shepherd''s son named George sets out with a goat that can hold fast
    anyone her master wishes. Along the way he hires three unusual servants: one who
    can leap a hundred miles, one who can see a hundred miles, and one who can squirt
    liquid a hundred miles. At an inn, three daughters become stuck to the goat after
    trying to take its ribbon; a judge and a bull later join the stuck procession.
    The procession makes the king''s daughter, who had never laughed, laugh. Because
    George is low-born, he is given an additional task: fetch water from a spring
    a hundred miles away within a minute. The three servants coordinate their powers
    so the water is brought back in time.'
  language: English
  quote_policy: summarized
