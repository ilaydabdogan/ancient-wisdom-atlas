canonical_text:
  quote: ''
  summary: The emperor is persuaded by a young lady to destroy the birdcatcher by
    fire. The birdcatcher consults a crow, follows instructions involving his wife
    and a horse, enters a public fire, and emerges rejuvenated. The emperor imitates
    the procedure and burns to death. The birdcatcher is invested with the emperor's
    sword and becomes emperor, while the damsel becomes sultana and the crow receives
    a court position.
  language: English
  quote_policy: summarized
