canonical_text:
  quote: ''
  summary: Cinderella is repeatedly left with millet-sorting and dinner-making tasks
    under threat from her stepmother. Following the earlier instruction of the cow,
    she goes to the cow's grave, where an open box of rich clothes and two white pigeons
    provide aid. She attends church in increasingly splendid clothing, attracting
    the emperor's son. On the third visit she loses a shoe, which the emperor's son
    uses to identify her after the cock reveals that she has been hidden under a trough.
    The emperor's son marries her and punishes the stepmother.
