canonical_text:
  quote: ''
  summary: A father has three sons. Two elder sons enter service under a master on
    the condition that whoever becomes angry first will have his nose cut off; each
    is starved, becomes angry, and loses his nose. The youngest son Adam enters the
    same service, repeatedly damages or destroys the master's property while asking
    whether the master is angry. The master refuses to admit anger until Adam has
    ruined his property and family situation; Adam then cuts off the master's nose
    and returns home claiming success.
  language: English
  quote_policy: summarized
