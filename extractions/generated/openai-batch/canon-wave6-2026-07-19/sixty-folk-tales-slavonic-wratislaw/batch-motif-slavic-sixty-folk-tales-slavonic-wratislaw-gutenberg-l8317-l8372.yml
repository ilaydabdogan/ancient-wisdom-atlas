canonical_text:
  quote: ''
  summary: Kraljevitch Marko, first weak and bullied while tending swine, shades a
    Vila's baby from the sun. The Vila rewards him by having him suck her breast repeatedly
    and test his strength on a heavy stone until he becomes powerful. He overpowers
    the herdsmen who attack him, is rebuked by his mother for bringing shame, and
    agrees to go into the world.
  language: English
  quote_policy: summarized
