canonical_text:
  quote: "“Promise me that which you don't know that you have”"
  summary: 'A fisherman on the Danube, unable to meet his lord''s demand for fish,
    accepts a bargain from a green-clad gentleman in a striped boat: abundant fish
    in exchange for what he does not know he has. The unknown thing is revealed to
    be his unborn son, to be delivered after twenty years. The son grows, studies,
    and when the time comes instructs his father how to deliver him with a Trinitarian
    commendation. At the water, the son boards the gentleman''s boat, and the boat,
    gentleman, and son sink; the father laments that his son has gone down to hell.'
  language: English
  quote_policy: quoted
