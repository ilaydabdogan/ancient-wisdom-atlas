canonical_text:
  quote: ''
  summary: A king promises his silent daughter in marriage to whoever can make her
    speak. Vanek indirectly provokes her answer by addressing her dog with a tale
    about a wooden damsel made by three companions. The princess judges that the one
    who gave life and speech has the best claim, and Vanek applies that judgment to
    himself. After court resistance and a death sentence, personified Luck replaces
    Intelligence, the execution is interrupted, and the king honors his word by making
    Vanek a prince and marrying him to the princess.
  language: English
  quote_policy: summarized
