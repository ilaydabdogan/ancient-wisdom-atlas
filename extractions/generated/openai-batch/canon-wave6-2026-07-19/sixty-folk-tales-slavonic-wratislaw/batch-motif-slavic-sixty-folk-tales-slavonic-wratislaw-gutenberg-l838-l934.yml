canonical_text:
  quote: ''
  summary: A king lost while hunting stays at a charcoal-burner's cottage and overhears
    three Fates assign a newborn boy danger, escape, long life, and marriage to the
    king's newborn daughter. The king tries to prevent the foretold marriage by having
    the boy drowned in a basket, but the child floats to a fisherman's cottage, is
    adopted and named Floatling, and grows to youth. When the king later recognizes
    him, he sends him to the queen with a sealed death order. Floatling loses his
    way in a forest, lodges with an old hag who calls herself his godmother, and while
    he sleeps she replaces the death order with an order for his marriage to the king's
    daughter.
  language: English
  quote_policy: summarized
