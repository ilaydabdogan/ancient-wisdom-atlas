canonical_text:
  quote: ''
  summary: A fox guides a simpleton to recover a marvelous vine from a guarded garden,
    warning him how to pass sleeping warders and avoid a golden shovel. He disobeys,
    is captured, and is told to bring a golden apple-tree in exchange. The fox then
    guides him to a second guarded garden and warns him to use a wooden pole rather
    than a golden one. He again disobeys, is captured, and is told to bring a golden
    horse in exchange for the apple-tree.
  language: English
  quote_policy: summarized
