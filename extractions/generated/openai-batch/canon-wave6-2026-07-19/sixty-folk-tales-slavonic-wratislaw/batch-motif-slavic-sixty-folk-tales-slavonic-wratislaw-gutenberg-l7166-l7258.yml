canonical_text:
  quote: "“Dragon! dragon! Come out to single combat with me”"
  summary: 'A prince who is also described as a shepherd repeatedly goes to a lake
    where no previous shepherd has returned, challenges a dragon, and wrestles with
    it. The emperor sends grooms to observe, then orders his daughter to accompany
    the shepherd and kiss him. During the final combat, the daughter kisses him, he
    throws the dragon so that it bursts, and animal forms emerge: first a boar, then
    a pigeon. His dogs and falcon capture these forms. The pigeon reveals where the
    prince''s brothers and many other captives are hidden, after which the prince
    kills it.'
  language: English
  quote_policy: quoted
