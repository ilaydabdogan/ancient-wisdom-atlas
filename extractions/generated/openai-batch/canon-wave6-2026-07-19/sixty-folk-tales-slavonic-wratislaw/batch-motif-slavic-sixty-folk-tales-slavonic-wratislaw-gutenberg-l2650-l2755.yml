canonical_text:
  quote: ''
  summary: A dark country depends on a horse bearing a sun on its forehead for light.
    When the horse disappears and the realm falls into misery, the king sets out to
    recover it. At the frontier he meets a seer reading in a book, who offers to find
    the horse and asks for one servant. The seer and servant travel to a seventh country
    ruled by three brother-kings married to three sisters whose mother is a witch.
    The seer learns, by transforming into a green bird and entering each queen's chamber,
    that the youngest brother rides the sun-horse and when each king will return.
    Each time the witch attempts to have the bird killed, and the seer escapes by
    changing back into a man. The seer then goes with the servant toward a bridge
    where the kings must pass.
  language: English
  quote_policy: summarized
