canonical_text:
  quote: Thus Kurent ruled the world and man, and mankind have been weak and dwarfed
    from that time forth.
  summary: Kurent repeatedly offers wine to a man who moves through cosmic regions.
    After pure wine is rejected, Kurent adulterates wine first with hellebore and
    then with black blood. The man finally drinks repeatedly while eating at God's
    table on a high mountain. God returns, strikes him down the mountain, and the
    man loses his former strength; the passage ends by explaining the weakness of
    mankind and Kurent's rule over the world and man.
  language: English
  quote_policy: quoted
