canonical_text:
  quote: ''
  summary: A prince takes service with an old woman, agreeing to watch her mare and
    foal for three days in exchange for a horse, with beheading as the penalty for
    failure. Each night he falls asleep and the mare escapes by transforming with
    her foal into another creature. A fish, a fox, and a crow, each addressed as an
    adopted brother, reveal the mare's hiding place and tell him how to summon her
    with a halter and a call. After three successful recoveries, he claims his reward
    and chooses a skinny horse in the corner despite the old woman's objections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The old woman offers the prince a bargain: if he watches her mare and foal
    successfully for three days, he may choose one of twelve horses; if he fails,
    she will take off his head.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yard contains posts with human heads stuck on them, and one vacant post
    cries for a head; the old woman says the heads belonged to those who failed to
    watch the mare and foal.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the first night the prince falls asleep, wakes at dawn with his arms around
    a stump and the halter still in his hand, and seeks the mare at a sheet of water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the prince rubs a fish scale from a handkerchief, a little fish appears,
    calls him adopted brother, says the mare and foal have become fish, and instructs
    him to flap the halter on the water and call the mare.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mare returns to mare form at the water's edge after the prince uses the
    halter and call; the old woman later scolds the mare for being among the fish
    and tells her to go among the foxes.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: On the second day the same loss recurs; after rubbing fox hairs from the handkerchief,
    the prince receives help from a fox, who says the mare is a fox and the foal a
    fox-cub and instructs him to summon her by flapping the ground with the halter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the second recovery, the old woman scolds the mare for being among the
    foxes and tells her to be among the crows.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the third day the prince again loses the mare, rubs crow feathers from
    the handkerchief, and a crow says the mare is a crow and the foal a young crow
    and instructs him to flap the halter in the air and call her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the third recovery, the prince asks for the agreed reward; the old woman
    presents twelve horses, and he insists on the skinny horse in the corner, which
    she gives him.
  category: sequence
  evidence_refs:
  - ev:8
