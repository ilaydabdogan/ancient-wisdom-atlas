canonical_text:
  quote: ''
  summary: A birdcatcher near Constantinople spares a crow that promises to serve
    him. The crow brings him two nightingales, whose song attracts the grand vizier
    and emperor. The emperor orders the birdcatcher to find the nightingales' mother
    under threat of death. The crow devises a plan using a feast of wheat, the caged
    young birds, and a snare, enabling the birdcatcher to catch the mother bird and
    receive a reward. The crow then takes satisfaction in persuading the birdcatcher
    to beat his wife, who had wanted the crow killed.
  language: English
  quote_policy: summarized
