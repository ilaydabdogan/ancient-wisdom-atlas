canonical_text:
  quote: ''
  summary: A fox reproaches the simpleton for disobedience, then guides him to steal
    a golden horse from a guarded stable. The simpleton ignores the fox's warning
    to use a tow bridle rather than a golden one; the horse neighs, the guards wake,
    and he is captured. He explains a chain of tasks involving his father's weeping
    eye, a stolen wine-producing vine, a golden apple-tree, and the golden horse.
    The horse's lord agrees to give him the horse if he brings a golden damsel in
    a cradle who has never seen sun or moon. The fox leads him to a cavern deep in
    the earth, instructs him how to pass guards and ignore a spectre, and says the
    damsel awaits release from her mother's cruelty. The simpleton retrieves the damsel
    in her golden cradle, closes the doors behind him, and emerges on the horse to
    the waiting fox.
  language: English
  quote_policy: summarized
