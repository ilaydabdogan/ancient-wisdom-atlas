canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Vasudeva counsels the Vrishni heroes not to
    treat Arjuna's forceful taking of Subhadra as an insult, but as a proper alliance.
    The Vrishnis conciliate Arjuna, who returns to Dwaraka and marries Subhadra. After
    completing his exile, Arjuna returns to Khandavaprastha, appeases a jealous Draupadi,
    and arranges for Subhadra to enter humbly. Subhadra worships Kunti and Draupadi,
    receives blessings, and the Pandava household becomes happy.
  language: English
  quote_policy: summarized
