canonical_text:
  quote: ''
  summary: Duryodhana orders Kshatta to bring Draupadi, wife of the Pandavas, and
    force her into servile work. Vidura rebukes Duryodhana, argues that Draupadi/Krishna
    is not a slave because she was staked after the king had lost himself, condemns
    harsh speech and dishonest dice-play, and warns that ignored wisdom will bring
    destruction upon the Kurus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duryodhana commands Kshatta to bring Draupadi, describes her as the dear and
    loved wife of the Pandavas, and orders that she be forced to sweep and stay with
    serving-women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vidura addresses Duryodhana with a rebuke and says that by uttering harsh
    words he is binding himself and hanging on the edge of a precipice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vidura says Duryodhana is like a deer provoking many tigers and that snakes
    of deadly venom are on his head.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vidura warns Duryodhana not to provoke them further lest he go to the region
    of Yama.
  category: speech
  evidence_refs:
