canonical_text:
  quote: I shall act so that thou mayst be made light.
  summary: Lomasa narrates that, when death ceased while births continued, beings
    multiplied and Earth sank under the burden. Earth appealed to Narayana/Vishnu,
    who became an effulgent one-tusked boar and raised her. The act disturbed heaven,
    earth, oceans, celestials, and sages; Brahma explained the commotion as Vishnu’s
    lifting of the Earth. The celestials then went to see the boar-form Supreme Being
    in Nandana and returned.
  language: English
  quote_policy: quoted
