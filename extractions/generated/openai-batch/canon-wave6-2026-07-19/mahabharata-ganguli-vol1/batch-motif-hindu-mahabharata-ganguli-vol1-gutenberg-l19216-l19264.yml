canonical_text:
  quote: ''
  summary: 'Dhritarashtra says he concealed his thoughts from Vidura and, once Vidura
    has departed, asks Duryodhana and Karna for their proposals. Duryodhana lists
    possible strategies against the Pandavas: using Brahmanas or spies to create dissension,
    bribing Drupada''s circle, separating the Pandavas from Hastinapura, turning Draupadi
    and the Pandavas against one another, secretly killing Bhima, repressing the Pandavas
    if they return obediently, tempting them with women, or bringing them to be killed
    by agents. He urges haste before the Pandavas'' confidence in Drupada is established.'
  language: English
  quote_policy: summarized
