canonical_text:
  quote: ''
  summary: Dhrishtadyumna reports to Drupada that a deer-skin-clad youth shot the
    high mark and won Krishna, another hero defended him with an uprooted tree, and
    the group withdrew to a potter's house. He describes their mother, companions,
    alms distribution, sleeping arrangements, and martial conversation, and infers
    that they are the sons of Pritha in disguise. Drupada sends his priest to ascertain
    their identity and express his wish that Arjuna wed his daughter.
  language: English
  quote_policy: summarized
