canonical_text:
  quote: ''
  summary: Lomasa recounts that Siva agrees to receive and sustain Ganga when she
    descends from heaven. Bhagiratha prays to Ganga, who falls from the sky, divides
    into three streams, and asks him to show her path. Bhagiratha leads her to the
    bodies of Sagara's sons so that her holy water may flood them; he reaches the
    sea with Ganga, fills it, adopts Ganga as his daughter, and offers water libations
    to his forefathers.
  language: English
  quote_policy: summarized
