canonical_text:
  quote: ''
  summary: Kali and Dwapara meet the returning gods after Damayanti has chosen Nala.
    Kali, angered that Damayanti chose a mortal in the presence of celestials, threatens
    doom. The gods defend Nala's virtues and warn that anyone cursing him destroys
    himself and falls into hell. After the gods depart, Kali tells Dwapara that he
    will possess Nala, deprive him of his kingdom, and that Dwapara should enter the
    dice to help him.
  language: English
  quote_policy: summarized
