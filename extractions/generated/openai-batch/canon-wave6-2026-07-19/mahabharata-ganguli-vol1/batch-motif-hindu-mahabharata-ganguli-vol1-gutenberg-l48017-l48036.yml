  quote: ''
  summary: 'The passage concludes the account of Dhundhu: gods and Rishis bless an
    unnamed recipient and depart; Kuvalaswa is said to have three surviving sons from
    whom the Ikshvaku royal line descends; Dhundhu is identified as slain by Kuvalaswa,
    who thereby receives the name Dhundhumara; the speaker states that hearing this
    holy history connected with Vishnu’s glory brings virtue, offspring, long life,
    fortune, freedom from anxiety, and freedom from fear of disease.'
