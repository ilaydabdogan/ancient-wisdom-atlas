canonical_text:
  quote: ''
  summary: Krishna offers Yudhishthira the military service of allied tribes and urges
    action against Duryodhana, while Yudhishthira affirms that the sons of Pandu have
    kept their exile vow and regard Krishna as their protector. The ancient deathless
    sage Markandeya arrives and is honored; Krishna asks him to recount holy stories
    and rules of righteous conduct. Narada also arrives, is ritually honored, and
    assents to Markandeya's speaking. Yudhishthira then asks Markandeya about divine
    agency, human action, the fruits of good and evil deeds, subsequent existence,
    and the fate of deeds after death.
  language: English
  quote_policy: summarized
