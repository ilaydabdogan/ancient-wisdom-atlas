canonical_text:
  quote: ''
  summary: At Saryati's sacrifice, Chyavana prepares a Soma offering for the Aswins.
    Indra forbids the offering, arguing that their role as celestial physicians disqualifies
    them. Chyavana defends the Aswins because they restored his youth, proceeds with
    the offering, paralyzes Indra's thunderbolt-bearing arm, performs a fire offering
    with hymns, and through ascetic power brings forth the enormous demon Mada, who
    rushes to devour Indra.
  language: English
  quote_policy: summarized
