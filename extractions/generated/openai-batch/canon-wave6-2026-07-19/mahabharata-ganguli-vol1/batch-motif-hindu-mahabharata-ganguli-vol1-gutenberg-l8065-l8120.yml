canonical_text:
  quote: ''
  summary: Vaisampayana announces a sacred royal genealogy. The passage recounts Prachetas'
    ascetic sons burning obstructive vegetation, Daksha's role as progenitor, Daksha's
    sons and daughters, the lines through Kasyapa, Vivaswat, Yama, and Manu, the origin
    of human beings as Manavas, Ila's dual parental relation to Pururavas, and Pururavas'
    destruction by the curse of great Rishis after robbing Brahmanas and rejecting
    Sanatkumara's counsel.
  language: English
  quote_policy: summarized
