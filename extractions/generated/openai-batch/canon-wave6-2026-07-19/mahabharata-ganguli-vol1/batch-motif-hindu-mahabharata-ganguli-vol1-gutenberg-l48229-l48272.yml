canonical_text:
  quote: ''
  summary: Markandeya narrates that Kausika, accepting the chaste woman's instruction,
    resolves to go to Mithila to seek instruction in virtue from a fowler. After travelling
    through forests, villages, and towns, he reaches Mithila, asks for the fowler,
    and finds him selling venison and buffalo meat in a butcher's yard. The fowler
    greets him, says he knows the woman's words and Kausika's purpose, and invites
    him away from the butcher's yard to his home.
  language: English
  quote_policy: summarized
