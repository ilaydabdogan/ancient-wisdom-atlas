canonical_text:
  quote: ''
  summary: Janamejaya asks how the Pandavas lived after receiving Indraprastha and
    how Draupadi, also called Krishna, related to all of them without dissension.
    Vaisampayana describes the Pandavas ruling happily at Khandavaprastha, Yudhishthira
    receiving the celestial Rishi Narada with hospitality, and Draupadi respectfully
    worshipping Narada. After Draupadi retires, Narada privately warns the Pandavas
    to establish a rule to prevent disunion, citing the brothers Sunda and Upasunda,
    who had shared everything but killed each other for Tilottama. Yudhishthira asks
    for the detailed story of those brothers and Tilottama.
  language: English
  quote_policy: summarized
