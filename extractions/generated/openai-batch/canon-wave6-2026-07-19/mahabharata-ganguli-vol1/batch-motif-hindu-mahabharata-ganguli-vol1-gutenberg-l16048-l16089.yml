canonical_text:
  quote: ''
  summary: Kunti asks a Brahmana the cause of his grief and offers help. The Brahmana
    explains that a nearby cannibal Rakshasa named Vaka rules and protects the country
    but demands a recurring fee of food, livestock, and a human being from householders.
    Those who avoid the obligation are killed with their families. The Brahmana says
    the weak territorial king has failed to secure the land, and that the deadly turn
    has now come to his own family.
  language: English
  quote_policy: summarized
