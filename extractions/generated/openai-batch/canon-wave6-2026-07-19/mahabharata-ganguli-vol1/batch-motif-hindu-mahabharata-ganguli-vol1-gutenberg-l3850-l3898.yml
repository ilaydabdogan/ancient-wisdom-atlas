  summary: Omens frighten the gods. Vrihaspati tells Indra that, because of Indra's
    fault and the Valakhilyas' ascetic penance, the powerful sky-ranging son of Kasyapa
    and Vinata is approaching to take Soma. Indra warns the amrita guards, and the
    gods arm themselves and surround the amrita.
