canonical_text:
  quote: ''
  summary: The passage summarizes the Svarga Parva episode in which Yudhishthira refuses
    a celestial car without his dog, Dharma reveals himself from canine form, Yudhishthira
    is shown hell and sinner-regions, and he reaches his merited heavenly region after
    a plunge in the celestial Ganges. Sauti then praises the Bharata as supreme wisdom,
    a source for poets and sacred histories, a destroyer of sin through reading or
    listening, and a vast history made navigable by the Parva-sangraha.
  language: English
  quote_policy: summarized
