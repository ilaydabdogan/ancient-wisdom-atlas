canonical_text:
  quote: ''
  summary: After the king sits weeping on the ground, the learned Brahmana Saunaka
    addresses him with a discourse on grief, bodily and mental suffering, knowledge,
    affection, desire, wealth, renunciation, and contentment. Saunaka invokes older
    verses attributed to Janaka on self-control and uses images of fire, water, a
    tree hollow, a lotus leaf, and exposed meat to explain how attachment and wealth
    bring misery, while knowledge and contentment bring ease.
  language: English
  quote_policy: summarized
