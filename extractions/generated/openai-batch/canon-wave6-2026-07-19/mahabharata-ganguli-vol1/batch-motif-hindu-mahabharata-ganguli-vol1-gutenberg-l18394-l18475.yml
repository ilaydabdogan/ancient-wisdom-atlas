canonical_text:
  quote: The auspicious Draupadi shall be the common wife of us all.
  summary: The Pandavas return with Draupadi to Kunti, who unknowingly tells them
    to share what they have obtained. Concerned that her words should not become false
    or sinful, Kunti consults Yudhishthira. Yudhishthira first directs Arjuna to marry
    Draupadi, but Arjuna defers to the eldest brother and the proper order among brothers.
    Seeing that all the brothers desire Draupadi and fearing division among them,
    Yudhishthira declares that Draupadi will be the wife of them all. Krishna and
    Valadeva then visit the disguised Pandavas at the potter's house; Krishna says
    their might has revealed them like covered fire and blesses them before departing.
  language: English
  quote_policy: quoted
