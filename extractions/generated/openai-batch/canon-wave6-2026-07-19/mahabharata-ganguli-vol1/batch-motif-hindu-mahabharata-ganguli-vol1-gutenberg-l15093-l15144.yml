canonical_text:
  quote: ''
  summary: Yudhishthira decides that the Pandavas should escape the lac house by setting
    it on fire and leaving unnoticed. During a night feast hosted by Kunti, a Nishada
    woman and her five sons become intoxicated and sleep inside the mansion. Bhima
    sets fire to the house while Purochana sleeps, and the Pandavas and Kunti escape
    through a subterranean passage. The citizens of Varanavata lament, believing the
    Pandavas have burned; meanwhile Bhima carries his mother and brothers through
    the darkness.
  language: English
  quote_policy: summarized
