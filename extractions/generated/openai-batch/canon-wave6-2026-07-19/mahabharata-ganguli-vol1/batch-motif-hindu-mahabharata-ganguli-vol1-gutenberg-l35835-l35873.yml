canonical_text:
  quote: ''
  summary: Vrihadaswa narrates that Nala, ornamented and accompanied by Damayanti,
    appears before Bhima, salutes him, and is joyfully received. The citizens celebrate
    by adorning the city. Rituparna learns that Vahuka/Nala has been reunited with
    Damayanti, asks Nala's forgiveness for any wrong done while Nala lived with him
    in disguise, and receives Nala's forgiving reply. Nala gives Rituparna the science
    of horse-lore with rites, while Rituparna gives Nala the mysteries of dice and
    departs for his own city.
  language: English
  quote_policy: summarized
