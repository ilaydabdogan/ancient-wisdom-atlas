canonical_text:
  quote: ''
  summary: Bhima sends Brahmanas with promised rewards to locate Nala and Damayanti.
    The Brahmana Sudeva eventually sees Damayanti in the Chedi palace with Sunanda,
    recognizes her despite her soiled and emaciated condition, and reflects on her
    beauty and sorrow through a series of similes. He approaches her, identifies himself
    as a friend of her brother sent by Bhima, reports that her family and children
    are alive, and says many Brahmanas search for her. Damayanti recognizes him and
    weeps. Sunanda informs the Chedi queen-mother, who questions Sudeva about Damayanti’s
    identity and circumstances; Sudeva begins to tell her history.
  language: English
  quote_policy: summarized
