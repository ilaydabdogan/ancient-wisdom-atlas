canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Yudhishthira and companions, anxious at Bhima's
    absence, arm themselves and ascend a mountain summit. They find Bhima among slain
    or unconscious Rakshasas. Yudhishthira rebukes Bhima for violent excess. Surviving
    Rakshasas flee to Kuvera and report that a mortal has slain Kuvera's hosts and
    Maniman. Kuvera angrily sets out in a splendid car with Yaksha attendants, reaches
    Gandhamadana, is pleased on seeing the Pandavas, and is received by them with
    bows and joined hands. Kuvera sits on the Pushpaka seat while supernatural hosts
    attend him and Bhima stands gazing without dejection.
  language: English
  quote_policy: summarized
