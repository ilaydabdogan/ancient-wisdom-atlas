canonical_text:
  quote: a mighty unearthly city, moving at will
  summary: Arjuna describes seeing a radiant aerial city inhabited by armed Asuras.
    Matali explains that Pulama and Kalaka received boons from Brahma after long austerities,
    including protected offspring and an invincible gem-filled aerial city. Matali
    identifies the city as Hiranyapura and says Brahma had destined its inhabitants'
    destruction by mortals, instructing Arjuna to destroy the Kalakanjas with the
    thunderbolt.
  language: English
  quote_policy: quoted
