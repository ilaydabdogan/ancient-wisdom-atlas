canonical_text:
  quote: I invoked thee from curiosity alone. Pardon me, O worshipful one!
  summary: Kunti, while unmarried, tests mantras bestowed on her by a Brahmana and
    invokes the rising Sun. Surya appears in divine form, says the mantras have compelled
    him, and insists that an invoked celestial cannot depart in vain. He promises
    a son like himself, marked with mail and ear-rings, threatens curses if refused,
    shows that the celestials are watching, and continues pressing his demand while
    Kunti protests on grounds of maidenhood and virtue.
  language: English
  quote_policy: quoted
