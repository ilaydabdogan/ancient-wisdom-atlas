canonical_text:
  quote: "“Rama, therefore, should be invested by me and my ministers as prince-regent”"
  summary: Yudhishthira asks Markandeya why Rama and Lakshmana went to the forest
    with the princess of Mithila. Markandeya recounts that Dasaratha, pleased with
    his sons and especially with Rama, consulted ministers and a spiritual adviser
    about installing Rama as regent. Dasaratha orders preparations under the Pushya
    constellation. Manthara hears this and warns Kaikeyi that Kausalya is fortunate
    because her son will be installed while Kaikeyi's son will not obtain the kingdom.
  language: English
  quote_policy: quoted
