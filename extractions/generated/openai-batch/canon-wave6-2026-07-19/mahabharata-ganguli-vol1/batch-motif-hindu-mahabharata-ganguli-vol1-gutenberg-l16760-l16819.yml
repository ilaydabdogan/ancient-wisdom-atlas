canonical_text:
  quote: ''
  summary: A defeated Gandharva tells Arjuna that his chariot was burned by Arjuna's
    fire weapon, offers to transmit the Chakshushi science of illusion and spiritual
    sight, and offers celestial Gandharva horses. He explains the lineage and power
    of the science, recounts the shattered thunderbolt made for slaying Vritra, and
    describes the horses' supernatural qualities. Arjuna refuses a one-sided gift
    based only on gratitude for sparing life; the Gandharva proposes receiving Arjuna's
    fire weapon in exchange, and Arjuna accepts the horse exchange and asks why humans
    should fear Gandharvas at night.
  language: English
  quote_policy: summarized
