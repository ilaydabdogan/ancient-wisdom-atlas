  summary: Takshaka, the king of snakes, coils around and poisons the king; the royal
    attendants flee, and the king dies. The royal priest and councillors perform the
    king's last rites. The citizens enthrone the deceased monarch's minor son Janamejaya,
    who rules with councillors and priest, marries Vapushtama of Kasi with rites,
    and enjoys conjugal pleasure compared to Pururavas with Urvasi.
