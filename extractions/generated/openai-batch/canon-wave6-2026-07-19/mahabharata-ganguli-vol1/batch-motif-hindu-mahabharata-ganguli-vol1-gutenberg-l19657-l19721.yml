canonical_text:
  quote: beautified the place and made it a second heaven.
  summary: The Pandavas, after accepting half the kingdom and moving from Hastinapura
    to the desert region of Khandavaprastha, ritually select and measure a site, build
    a fortified and splendid city called Indraprastha, attract Brahmanas, merchants,
    and artisans, surround it with gardens and waters, and then remain there while
    Krishna returns to Dwaravati with Rama.
  language: English
  quote_policy: quoted
