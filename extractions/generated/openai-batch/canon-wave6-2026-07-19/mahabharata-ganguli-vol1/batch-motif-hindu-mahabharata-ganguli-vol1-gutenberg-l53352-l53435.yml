canonical_text:
  quote: ''
  summary: 'The passage describes Narayana/Vishnu resting on the cosmic waters with
    Sesha, awakening to a blank universe, and bringing forth Brahma from a navel-lotus
    to begin creation. It then recounts Vishnu’s functions as creator, preserver,
    and destroyer through Brahma, Vishnu, and Rudra, and narrates several divine forms
    or incarnations: the boar who raises the submerged Earth from the waters, the
    half-lion half-man who kills Hiranya-Kasipu, and the dwarf who obtains three paces
    of ground from Vali and covers the world. The passage closes by identifying Vishnu
    as Krishna, protector of Arjuna.'
  language: English
  quote_policy: summarized
