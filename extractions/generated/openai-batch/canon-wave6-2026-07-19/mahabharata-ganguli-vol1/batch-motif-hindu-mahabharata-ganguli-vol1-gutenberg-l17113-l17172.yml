canonical_text:
  quote: ''
  summary: A speaker advises Arjuna that a king should have a learned Brahmana priest.
    Arjuna then asks a Gandharva about the hostility between Viswamitra and Vasishtha.
    The Gandharva introduces a Vasishtha legend and names Gadhi and Viswamitra. The
    passage then recounts Samvarana taking Tapati, daughter of Vivaswat, as wife on
    a celestial mountain, appointing Vasishtha regent, and spending twelve years in
    seclusion with Tapati. During that period no rain or dew falls, crops fail, people
    and animals suffer, and the capital resembles a city of the dead. Vasishtha brings
    Samvarana and Tapati back; rain and crops return. Samvarana and Tapati perform
    sacrifices for twelve years, and their son Kuru explains Arjuna’s epithet Tapatya.
  language: English
  quote_policy: summarized
