canonical_text:
  quote: ''
  summary: Markandeya narrates how Swaha, assuming the form of Siva, wife of Angiras,
    approaches Agni and unites with him. She carries Agni's semen away in bird form
    to the White Mountain and deposits it in a golden lake, later repeating the act
    while assuming other Rishi-wives' forms, except Arundhati's. From six deposits
    Skanda is born, rapidly develops a six-faced body, takes up weapons and emblems,
    terrifies beings with roars, gains followers seeking protection, and rends mountains
    with arrows and a mace before the mountains bow to him and creatures worship him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Swaha first assumes the disguise of Siva, wife of Angiras, and approaches
    Agni declaring desire for him and threatening self-destruction if refused.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Swaha tells Agni that the other Rishi-wives read his mind by signs and sent
    her, while her sisters-in-law await her return.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Agni marries and cohabits with Swaha while she is in Siva's guise, and Swaha
    holds his semen in her hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Swaha fears that witnesses would blame the Brahmana ladies, so she assumes
    a bird form to leave the forest more easily.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In bird form Swaha reaches the White Mountain, a place described with plants,
    trees, seven-headed serpents, Rakshasas, Pisachas, spirits, birds, and animals.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Swaha ascends a mountain peak and throws Agni's semen into a golden lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Swaha successively assumes the forms of the wives of the seven Rishis, but
    cannot assume Arundhati's form because of Arundhati's ascetic merit and devotion
    to Vasishtha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the first lunar day Swaha deposits Agni's semen into the lake six times,
    and a powerful male child is produced therefrom and named Skanda because the Rishis
    regard it as cast off.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The child has six faces, twelve ears, twelve eyes, twelve hands, twelve feet,
    one neck, and one stomach, and develops from first form to child-size and limbs
    over successive lunar days.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Skanda shines amid red clouds and lightning like the Sun, takes up a great
    bow, roars terribly, and frightens the three worlds and the great Nagas Chitra
    and Airavata.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Skanda holds the shaken Nagas, carries a dart, a red-crested cock, and a conch-shell,
    blows the conch, strikes the air, and plays on the hilltop.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Creatures frightened by Skanda's roars seek protection from him, become known
    as his powerful Brahmana followers, and have their fears allayed by him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Skanda shoots arrows toward the White Mountain and rends the Krauncha hill,
    son of Himavat; the passage links this to swans and vultures migrating to the
    Sumeru mountains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Skanda hurls his mace and splits a peak of the White Mountain; the White Mountain
    flees with other mountains, the earth is distressed, and the mountains later bow
    to Skanda and return to the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: All creatures celebrate the worship of Skanda on the fifth lunar day.
  category: action
  evidence_refs:
  - ev:8
