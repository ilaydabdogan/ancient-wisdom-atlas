canonical_text:
  quote: ''
  summary: The Gandharva tells Partha of King Kalmashapada. While hunting in the woods,
    the hungry and thirsty king meets Saktri, son of Vasishtha, on a path. They quarrel
    over who should yield the way; the king strikes Saktri with a whip, and Saktri
    curses him to become a human-flesh-eating Rakshasa. Viswamitra, concealed and
    involved in a discipleship dispute over the king, commands the Rakshasa Kinkara
    to enter Kalmashapada. Possessed, the king later promises food to a hungry Brahmana,
    orders his cook to feed him, and when no meat is found orders human flesh. The
    Brahmana perceives the food as unholy and adds a second curse, strengthening the
    king's fondness for such food and his wandering, harmful condition.
  language: English
  quote_policy: summarized
