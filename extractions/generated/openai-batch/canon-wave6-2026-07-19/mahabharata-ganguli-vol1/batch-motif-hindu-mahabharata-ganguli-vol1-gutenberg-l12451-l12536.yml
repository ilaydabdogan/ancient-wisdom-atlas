canonical_text:
  quote: ''
  summary: Kunti summons the god of justice and bears Yudhishthira, whose virtues
    and future kingship are proclaimed by an incorporeal voice. Pandu then asks Kunti
    to obtain a strong son; she invokes Vayu and bears Bhima, whose strength is confirmed
    by prophecy and by shattering a mountain rock in infancy. Pandu later seeks a
    still more superior son from Indra through vows and austerities; Indra appears
    and promises such a son.
  language: English
  quote_policy: summarized
