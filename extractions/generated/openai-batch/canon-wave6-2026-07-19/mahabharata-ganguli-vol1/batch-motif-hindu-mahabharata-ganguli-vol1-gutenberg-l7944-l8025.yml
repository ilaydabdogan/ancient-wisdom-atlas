canonical_text:
  quote: ''
  summary: Sakuntala rebukes Dushmanta, invokes celestial birth, moral analogies,
    duties toward sons, and the superiority of truth. After she leaves, an unseen
    voice from the sky publicly affirms that Dushmanta is the boy's father, declares
    Sakuntala truthful, commands the king to cherish the child, and gives the child
    the name Bharata. Dushmanta then says the celestial testimony secures public recognition
    of the son.
  language: English
  quote_policy: summarized
