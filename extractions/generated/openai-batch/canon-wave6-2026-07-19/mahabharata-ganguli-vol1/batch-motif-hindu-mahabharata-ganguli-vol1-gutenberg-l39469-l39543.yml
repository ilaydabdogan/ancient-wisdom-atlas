canonical_text:
  quote: ''
  summary: Vibhandaka warns his son against alluring beings, drinks, and garlands
    as obstacles to penance. While Vibhandaka is away, courtesans bring Rishyasringa
    by bark to King Lomapada of Anga. Rain falls, Lomapada gives Santa to Rishyasringa
    in marriage, and arranges cattle, fields, cowherds, and hospitality to appease
    Vibhandaka. Vibhandaka's anger subsides; he instructs Rishyasringa to return to
    the forest after fulfilling obligations. Santa serves Rishyasringa devotedly,
    and the narrator identifies the holy hermitage and lake as a place for ablution
    and fulfilled desire.
  language: English
  quote_policy: summarized
