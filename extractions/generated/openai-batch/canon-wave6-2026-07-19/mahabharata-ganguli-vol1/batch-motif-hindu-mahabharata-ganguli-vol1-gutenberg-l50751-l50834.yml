canonical_text:
  quote: ''
  summary: The Pandavas dwell in a remote wilderness near a lake. A Brahmana visits
    them and later reports their hardship to the old Kuru king, who grieves, admits
    fault, laments their loss of royal comfort, fears Bhima's restrained wrath, condemns
    the deceitful dice game, reflects on destiny and the fruits of action, and recalls
    Arjuna's ascent to Indra's abode, his mastery of celestial weapons, and his return
    to the world.
  language: English
  quote_policy: summarized
