canonical_text:
  quote: ''
  summary: Janamejaya asks about the god of justice being cursed and born in the Sudra
    caste. Vaisampayana narrates that the Brahmana ascetic Mandavya, while silently
    practicing austerities under a tree at his hermitage, is falsely implicated when
    robbers hide stolen goods there. Guards seize him with the thieves, a king sentences
    him to execution, and officers impale him. Mandavya survives without food through
    ascetic power and summons other Rishis, who come at night in bird forms and ask
    what sin caused his suffering.
  language: English
  quote_policy: summarized
