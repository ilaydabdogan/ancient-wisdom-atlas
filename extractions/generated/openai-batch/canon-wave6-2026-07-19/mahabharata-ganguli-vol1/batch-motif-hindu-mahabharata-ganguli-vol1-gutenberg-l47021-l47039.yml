canonical_text:
  quote: ''
  summary: Markandeya introduces a story in which King Yayati, son of Nahusha, sits
    on his throne among citizens. A Brahmana comes requesting wealth for his preceptor
    according to a covenant. The Brahmana asks what disposition the king will have
    in giving. Yayati says he gives what can be given, is happy to give, does not
    boast, and is not angry or sorry toward petitioners. He grants the Brahmana a
    thousand kine, and the Brahmana departs with them.
