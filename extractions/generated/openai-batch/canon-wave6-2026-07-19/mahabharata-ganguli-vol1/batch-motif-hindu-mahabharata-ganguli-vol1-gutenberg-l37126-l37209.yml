  quote: ''
  summary: A prescriptive pilgrimage itinerary names a sequence of tirthas, deities,
    waters, mountains, wells, tanks, rivers, confluences, and asylums. Bathing, touching
    waters, fasting, worshipping deities and ancestors, making gifts, or residing
    at these places is said to remove sins, avert misfortune, grant merit equal to
    major sacrifices, revive memory of former lives, and lead to divine regions or
    heaven.
  language: English
