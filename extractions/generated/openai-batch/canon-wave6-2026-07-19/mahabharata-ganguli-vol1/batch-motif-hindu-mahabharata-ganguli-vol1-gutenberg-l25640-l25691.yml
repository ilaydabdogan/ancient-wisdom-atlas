canonical_text:
  quote: ''
  summary: Bhishma recounts that Sisupala was born in the Chedi royal line with three
    eyes and four hands. His parents feared the omens, but an incorporeal voice foretold
    that he would live and that his future slayer had already been born. The voice
    says the slayer will be known when the child’s extra arms fall away and the third
    eye disappears upon being placed on that person’s lap. Many kings fail this test.
    When the queen places the child on Krishna’s lap, the signs vanish. Alarmed, she
    asks Krishna to pardon Sisupala’s offences; Krishna promises to forgive one hundred.
    Bhishma concludes that Sisupala, relying on this boon, challenges Bhima.
  language: English
  quote_policy: summarized
