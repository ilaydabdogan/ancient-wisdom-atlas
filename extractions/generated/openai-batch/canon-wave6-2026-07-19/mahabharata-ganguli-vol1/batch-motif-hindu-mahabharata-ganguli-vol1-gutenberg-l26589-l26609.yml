  quote: ''
  summary: An unnamed speaker reports grief at seeing kings offer valuable presents
    to his foes, then describes Yudhishthira's immense household and forces, the measuring,
    cooking, and distribution of food, universal provision of food, drink, and ornaments,
    support for Brahmanas and ascetics, Yajnaseni's daily check that everyone has
    eaten before she eats, and the tribute exemptions of the Panchalas, Andhakas,
    and Vrishnis because of marriage or friendship ties.
