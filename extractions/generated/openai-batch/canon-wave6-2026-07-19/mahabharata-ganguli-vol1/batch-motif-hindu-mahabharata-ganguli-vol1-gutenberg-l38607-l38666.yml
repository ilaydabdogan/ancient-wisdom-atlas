canonical_text:
  quote: ''
  summary: Lomasa recounts that the Kalakeyas hide in the sea by day and attack ascetics
    at night, killing Brahmanas in several forest asylums. The attacks leave bodies,
    bones, broken sacrificial vessels, scattered sacred fires, and a world deprived
    of Vedic study and rites. Survivors flee or search unsuccessfully because the
    Asuras remain in the sea. The gods, with Indra among them, seek refuge with Narayana
    and recall his earlier acts in boar, half-man half-lion, and dwarf forms before
    asking him to protect the worlds.
  language: English
  quote_policy: summarized
