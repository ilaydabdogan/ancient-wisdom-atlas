  summary: Rishyasringa tells his father that a beautiful, ornamented religious student
    visited him, spoke pleasantly, played with a globular fruit, embraced him, touched
    mouth to mouth, declined his offered water and fruits, and gave him sweet fruits
    and fine-flavoured water. After the visitor leaves behind fragrant garlands and
    returns to his hermitage, Rishyasringa feels sadness, burning longing, and asks
    to go to him and follow the same observances.
