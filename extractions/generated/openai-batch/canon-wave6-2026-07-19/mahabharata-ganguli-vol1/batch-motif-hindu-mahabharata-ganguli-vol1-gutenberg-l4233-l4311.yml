canonical_text:
  quote: ''
  summary: Saunaka asks what the serpents did after hearing of the curse. Sauti recounts
    that Sesha left his mother and practiced severe penances in sacred places because
    he wished to avoid his wicked and jealous serpent brothers. Brahma saw Sesha’s
    austerities, offered a boon, and Sesha asked that his heart remain set on virtue
    and ascetic practice. Brahma then commanded Sesha to go beneath the Earth and
    support the unsteady Earth with its mountains, forests, seas, towns, and retreats.
    Sesha agreed, entered a hole beneath the Earth, supported the Earth on his head,
    was identified by Brahma as Dharma, and thereafter lived beneath the Earth as
    Ananta supporting the world, with the son of Vinata given as his helper.
  language: English
  quote_policy: summarized
