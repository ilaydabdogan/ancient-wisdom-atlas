canonical_text:
  quote: ''
  summary: Mudgala rejects heaven because of its defects and asks the celestial messenger
    to describe a faultless region. The messenger describes the supreme seat of Vishnu,
    Para Brahma, above Brahma's abode, accessible only to those free from attachment
    and disciplined in contemplation and Yoga. Mudgala adopts contentment and equanimity,
    meditates, gains knowledge, and attains eternal emancipation. Vyasa then counsels
    Kunti's son not to grieve over his lost kingdom, saying fortune changes like a
    wheel and that the kingdom will be regained after the thirteenth year. Vyasa returns
    to his hermitage for austerities.
  language: English
  quote_policy: summarized
