canonical_text:
  quote: ''
  summary: Pritha/Kunti conceals her conception and gives birth to a divine-looking
    son born with mail and earrings. Fearing discovery, she places the infant in a
    prepared wicker box, prays for divine protection over him, and with her nurse
    sets him on the waters of the Aswa at night. The basket travels through several
    rivers to Champa, and the child's innate mail, earrings, and destiny preserve
    him.
  language: English
  quote_policy: summarized
