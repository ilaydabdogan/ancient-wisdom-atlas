canonical_text:
  quote: I am Ganga, the daughter of Jahnu.
  summary: Ganga, in human form, marries King Santanu under a condition that he must
    not interfere with her acts or speak unkindly. She bears eight children, casts
    the first newborns into the river, and is stopped by Santanu when she is about
    to cast away the eighth. She reveals herself as Ganga, explains that the eight
    Vasus were cursed to human birth and that she agreed to free them at birth, then
    leaves Santanu and instructs him to rear the surviving child, named Gangadatta.
  language: English
  quote_policy: quoted
