canonical_text:
  quote: thy virtues have suffered diminution and thou must fall from heaven
  summary: Indra questions Yayati about his ascetic austerities. Yayati claims to
    have no equal, and Indra says this disregard of others' merits has diminished
    his virtue, so he must fall from heaven. Yayati asks to fall among the virtuous;
    Indra grants this. Yayati falls from the celestial region and is seen by Ashtaka,
    who questions the radiant falling figure and reassures him that he is among the
    virtuous and wise, where the guest has authority.
  language: English
  quote_policy: quoted
