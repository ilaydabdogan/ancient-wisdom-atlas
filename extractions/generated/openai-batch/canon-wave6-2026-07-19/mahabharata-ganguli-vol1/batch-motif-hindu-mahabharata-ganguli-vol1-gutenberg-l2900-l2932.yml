canonical_text:
  quote: ''
  summary: Sauti recounts that the mother of the snakes had cursed the snakes to be
    burned by Agni in Janamejaya's sacrifice. To neutralize the curse, the chief of
    the snakes married his sister to a high-souled Rishi, and Astika was born from
    that union. Later, during the Snake-sacrifice of a Pandava-line king, Astika delivered
    the Nagas and other snakes from fiery death. The passage also describes the fulfillment
    of religious and ancestral debts through austerities, vows, Vedic study, sacrifice,
    Brahmacharya, and offspring, after which Jaratkaru's sires and Jaratkaru go to
    heaven.
  language: English
  quote_policy: summarized
