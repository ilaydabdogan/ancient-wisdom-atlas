canonical_text:
  quote: ''
  summary: Damayanti arranges to meet Vahuka, whom she suspects to be Nala. In her
    apartments she confronts him over Nala's abandonment of her in the forest and
    recalls his marriage vow before fire and celestials. Nala says Kali caused his
    actions and has now left him. Damayanti explains that the second-swayamvara report
    was a scheme to bring Nala back and swears by cosmic witnesses that she has not
    sinned. The Wind-god declares her innocent; celestial signs appear. Nala casts
    off doubt, remembers the king of serpents, wears a pure garment, regains his native
    form, and is reunited with Damayanti and their children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Damayanti sends Kesini to ask her mother for permission either to bring Vahuka
    into the palace or to allow Damayanti to go to him; Bhima gives consent, and Nala
    is brought to Damayanti's apartments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Nala and Damayanti see each other, both are overcome with grief and tears;
    Damayanti is described as wearing red cloth, matted locks, and being covered with
    dirt and dust.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Damayanti addresses Vahuka and questions whether a dutiful person would abandon
    a sleeping wife in the forest; she also recalls Nala's vow after taking her hand
    before fire and celestials.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nala says that the loss of his kingdom and his desertion of Damayanti were
    caused by Kali, who dwelt in his body and burned from Damayanti's curse until
    Nala overcame him through observances and austerities.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nala says that he came for Damayanti's sake, but asks whether any woman would
    forsake a devoted husband and choose a second lord after messengers announced
    that Bhima's daughter would choose another husband.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Damayanti denies fault, says she chose Nala over the celestials, explains
    that Brahmanas carried her words as ballads, and says Parnada found Nala in Kosala
    at Rituparna's palace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Damayanti says she devised the scheme because only Nala could travel a hundred
    yojanas in one day with horses; touching his feet, she swears that she has committed
    no sin and invokes Air, Sun, Moon, and three gods as witnesses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Wind-god speaks from the sky and declares that Damayanti has done no wrong,
    that she guarded Nala's family honour, and that the divine witnesses had protected
    her for three years.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the Wind-god's declaration, a floral shower falls, a celestial kettle-drum
    plays, auspicious breezes blow, and Nala casts away his doubts about Damayanti.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nala remembers the king of serpents, wears a pure garment, regains his native
    form, and is embraced by Damayanti; he also embraces Damayanti and their children.
  category: sequence
  evidence_refs:
  - ev:10
