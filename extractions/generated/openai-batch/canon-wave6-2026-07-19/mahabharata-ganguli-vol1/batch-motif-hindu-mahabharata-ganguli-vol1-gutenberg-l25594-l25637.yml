canonical_text:
  quote: ''
  summary: Sisupala denounces Krishna, Bhima, and Arjuna for their conduct in Jarasandha's
    death, especially entering in disguise and refusing hospitality. Bhima becomes
    enraged, but Bhishma restrains and counsels him. Sisupala remains fearless, mocks
    Bhima, and challenges Bhishma to release him.
