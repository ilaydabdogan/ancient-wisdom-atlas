canonical_text:
  quote: ''
  summary: Vidura recounts how Yudhishthira refuses and rebukes the Rakshasa Kirmira.
    Bhima prevents Arjuna from intervening, arms himself with an uprooted tree, and
    fights Kirmira with trees, a fiery brand, a crag, and hand-to-hand grappling.
    Bhima overpowers and kills Kirmira, after which the Pandavas praise Bhima and
    enter a peaceful forest freed from the Rakshasa. Vaisampayana reports that the
    king hears the account and becomes sorrowful and thoughtful.
  language: English
  quote_policy: summarized
