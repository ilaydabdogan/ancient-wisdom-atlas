canonical_text:
  quote: ''
  summary: 'Dhritarashtra installs Yudhishthira as heir-apparent because of his virtues.
    The Pandava brothers advance in training and prowess. Drona addresses Arjuna about
    the Brahmasira weapon, its lineage, power, and restriction against use on humans,
    then asks for a preceptorial fee: Arjuna must fight him when Drona fights him.
    Arjuna pledges, is acclaimed as unrivaled with the bow, and the Pandavas later
    extend the kingdom through conquest. Dhritarashtra becomes anxious and hostile
    toward them.'
  language: English
  quote_policy: summarized
