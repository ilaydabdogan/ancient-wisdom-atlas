canonical_text:
  quote: ''
  summary: 'Kanika gives a ruler sustained counsel in ruthless statecraft: kill or
    punish foes by any available means, conceal anger behind soft words and smiles,
    employ spies everywhere including deceivers in ascetic garb, balance virtue, wealth,
    and pleasure pragmatically, consult Brahmanas, use exemplary histories to console
    sorrow, keep royal counsel secret, and destroy enemy forces decisively.'
  language: English
  quote_policy: summarized
