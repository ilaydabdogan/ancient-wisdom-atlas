  summary: Yudhishthira receives Narada respectfully, affirms his intention to follow
    virtuous royal precedents, and asks whether Narada has seen any assembly room
    like his. Narada replies that he has not seen such a gem-built hall among men
    and offers to describe the celestial assembly rooms of Yama, Varuna, Indra, Kuvera,
    and Brahma, including their designs, materials, dimensions, and attendants.
