canonical_text:
  quote: ''
  summary: Lomasa narrates how Indra, disguised as an aged infirm ascetic Brahmana,
    tries to dam the Ganga with sand in order to show Yavakri the impracticability
    of seeking Vedic knowledge through penance alone. Yavakri asks for practicable
    boons, and Indra grants that the Vedas will become manifest to Yavakri and his
    father. Yavakri tells Bharadwaja, who warns him against pride by recounting the
    story of Valadhi's son Medhavi, whose life was tied to mountains and who died
    when a sage shattered the relevant mountain with buffaloes. Bharadwaja applies
    the tale as a warning about pride after boons and cautions Yavakri to avoid Raivya,
    but Yavakri later offends other munis.
  language: English
  quote_policy: summarized
