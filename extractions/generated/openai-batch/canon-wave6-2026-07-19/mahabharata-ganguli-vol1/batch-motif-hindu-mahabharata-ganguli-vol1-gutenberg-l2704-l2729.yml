canonical_text:
  quote: ''
  summary: Ruru tells a Dundubha snake that after his wife was bitten by a snake he
    vowed to kill every snake he encountered. The Dundubha argues that biting snakes
    are different from Dundubhas, who are serpents only in name and should not be
    slain under a misconception. Ruru spares it, asks who it is in its transformed
    state, and the Dundubha says it was formerly the Rishi Sahasrapat and became a
    snake through a Brahmana's curse.
