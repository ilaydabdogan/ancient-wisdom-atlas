canonical_text:
  quote: ''
  summary: A host of Gandharvas attacks the four Pandava warriors. Arjuna, Bhima,
    and the sons of Madri kill many of them with arrows and celestial weapons. The
    Gandharvas rise into the sky with the sons of Dhritarashtra, but Arjuna confines
    them with an arrow-net and counters their weapons. Chitrasena, king of the Gandharvas,
    duels with Arjuna, uses concealment and illusion, and is forced to reveal himself
    by Arjuna's mantra-powered weapon. Recognizing Chitrasena as his friend, Arjuna
    and the other Pandavas stop fighting.
  language: English
  quote_policy: summarized
