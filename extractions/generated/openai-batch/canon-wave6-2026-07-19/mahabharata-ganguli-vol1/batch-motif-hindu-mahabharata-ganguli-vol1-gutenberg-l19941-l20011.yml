canonical_text:
  quote: ''
  summary: Celestial Rishis and Siddhas, distressed by the slaughter caused by Sunda
    and Upasunda, petition Brahman. Brahman resolves to destroy the Asura brothers
    and orders Viswakarman to create a captivating celestial maiden. The maiden, formed
    from beautiful features and gem-like portions, is named Tilottama and sent to
    tempt the brothers into quarreling. When she walks around the divine assembly,
    even the gods and Rishis gaze at her; Mahadeva gains additional faces and Indra
    gains a thousand eyes. After she leaves, the assembly considers the task effectively
    accomplished.
  language: English
  quote_policy: summarized
