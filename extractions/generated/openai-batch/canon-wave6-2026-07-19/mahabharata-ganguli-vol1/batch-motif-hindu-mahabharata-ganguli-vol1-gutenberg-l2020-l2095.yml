canonical_text:
  quote: ''
  summary: Utanka serves in the house of his preceptor Veda, refuses a request he
    regards as improper during Veda's absence, and is rewarded with permission to
    depart. Utanka insists on offering a preceptor's honorarium; Veda sends him to
    his preceptress, who asks him to obtain the earrings of King Paushya's queen by
    a sacred deadline. On the road Utanka encounters an extraordinary bull and a large
    man, obeys the man's command to eat the bull's dung and drink its urine, then
    goes to Paushya's palace. When Utanka cannot see the queen, Paushya explains that
    the queen cannot be seen by someone defiled by contact with remnants of a repast.
  language: English
  quote_policy: summarized
