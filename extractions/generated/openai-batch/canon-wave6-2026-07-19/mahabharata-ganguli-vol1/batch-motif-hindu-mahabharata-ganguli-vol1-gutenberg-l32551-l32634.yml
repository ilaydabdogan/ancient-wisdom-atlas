canonical_text:
  quote: ''
  summary: 'Janamejaya asks Vaisampayana to recount Arjuna''s acquisition of weapons,
    his solitary forest austerities, and his extraordinary encounter with Bhava. Vaisampayana
    begins the account: at Yudhishthira''s command, Arjuna goes north toward Himavat
    to see Sakra and Sankara, enters a humanless forest amid heavenly omens, reaches
    a sacred mountain landscape, and performs severe ascetic disciplines. Distressed
    rishis report to Mahadeva that Arjuna''s austerities heat the earth, and Mahadeva
    reassures them that he knows Arjuna''s desire and will fulfill it.'
  language: English
  quote_policy: summarized
