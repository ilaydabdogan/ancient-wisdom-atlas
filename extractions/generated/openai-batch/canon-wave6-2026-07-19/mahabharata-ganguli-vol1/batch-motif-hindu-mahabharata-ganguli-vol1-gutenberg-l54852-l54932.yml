canonical_text:
  quote: ''
  summary: Markandeya recounts that Indrajit binds Rama and Lakshmana with a boon-granted
    net of arrows. Vibhishana and Sugriva help revive and heal them, and Kuvera's
    water gives Rama, Lakshmana, and their allies sight of invisible beings. Guided
    by Vibhishana, Lakshmana attacks Indrajit before the latter completes his daily
    sacrifice and kills him with three arrows. Ravana grieves and tries to kill the
    captive Princess of Mithila, but Avindhya restrains him and redirects him toward
    battle.
  language: English
  quote_policy: summarized
