canonical_text:
  quote: Having escaped from that fire, we are now resting in the shade of this tree.
  summary: Bhima leads the Pandavas and Kunti through a dangerous forest after escaping
    danger from Dhritarashtra's sons. In a barren night forest, Kunti suffers thirst,
    and Bhima leaves his family under a banyan tree to find water. He returns with
    water and laments seeing his mother and brothers, of royal and divine lineage,
    sleeping on the bare ground. He reflects on kinship through tree images, recalls
    exile and escape from fire, and says he would kill their enemies if Yudhishthira
    commanded him.
  language: English
  quote_policy: quoted
