  quote: ''
  summary: The passage recounts dynastic succession from Santanu, Ganga, Satyavati,
    Dwaipayana, Dhritarashtra, Pandu, and Vidura; Pandu’s curse after killing a Rishi
    in deer form; the supernatural begetting of the Pandavas; Pandu’s death and Madri’s
    ascent of the funeral pyre; the Pandavas’ arrival at Hastinapura, persecution,
    escape from a burning plot, later marriages and sons; and Vasudeva’s revival and
    naming of Parikshit, leading to Janamejaya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Santanu marries Ganga, who bears Devavrata, later called Bhishma; Bhishma
    arranges Santanu’s marriage to Satyavati for his father’s good.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Satyavati, also called Gandhakali, had Dwaipayana by Parasara before marriage;
    with Santanu she had Chitrangada and Vichitravirya; Chitrangada was slain by Gandharvas,
    and Vichitravirya died childless after marrying Amvika and Amvalika.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Satyavati recalls the Rishi Dwaipayana and asks him to beget virtuous children
    for childless Vichitravirya; Dwaipayana consents and begets Dhritarashtra, Pandu,
    and Vidura.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dhritarashtra has a hundred sons by Gandhari because of a boon granted by
    Dwaipayana; Duryodhana, Duhsasana, Vikarna, and Chitrasena are named among them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: While hunting, Pandu sees a deer mating with its mate; the deer is actually
    a Rishi in deer form, and Pandu kills it with arrows before its desire is fulfilled.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: After being struck, the deer changes form into a Rishi and curses Pandu to
    die when similarly engaged before gratification.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the curse, Pandu becomes pale, avoids his wives, and tells them he has
    heard that the childless have no regions hereafter; he asks Kunti to raise offspring
    for him.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Kunti bears Yudhishthira by Dharma, Bhima by Maruta, and Arjuna by Sakra;
    she gives Madri the mantra of invocation, and Madri bears the twins Nakula and
    Sahadeva by the twin Aswins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pandu dies as soon as he touches ornamented Madri; Madri ascends the funeral
    pyre with him and asks Kunti to raise her twins affectionately.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ascetics bring the five Pandavas to Hastinapura and introduce them to Bhishma
    and Vidura; the ascetics disappear, flowers shower down, and celestial drums are
    beaten in the skies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Duryodhana becomes jealous of the Pandavas and tries various means to drive
    them away; Dhritarashtra sends them deceptively to Varanavata, where an attempt
