candidate_motifs:
- id: motif:1
  label: dynastic continuation through appointed or substitute begetting
  taxonomy_refs:
  - royal_legitimacy
  - sacred_birth
  basis: Satyavati asks Dwaipayana to beget children for childless Vichitravirya,
    producing Dhritarashtra, Pandu, and Vidura; Pandu later seeks offspring through
    Kunti because of his childlessness.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage does not provide ritual terminology; the motif is inferred
    from the literal dynastic function of the begetting.
- id: motif:2
  label: boon-enabled extraordinary fertility
  taxonomy_refs:
  - miraculous_child
  basis: Dhritarashtra has a hundred sons by Gandhari because of Dwaipayana’s boon.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage summarizes the boon but does not narrate its granting in detail.
- id: motif:3
  label: heroes born from divine or supernatural fathers
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Kunti bears three sons by Dharma, Maruta, and Sakra; Madri bears twins by
    the twin Aswins after receiving Kunti’s mantra of invocation.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage uses compressed genealogical narration rather than a full
    birth episode.
- id: motif:4
  label: sacred or heroic twins born through twin deities
  taxonomy_refs:
  - sacred_twins
  - divine_parent_child
  - sacred_birth
  basis: Madri bears the twins Nakula and Sahadeva by the twin Aswins.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The twins’ later shared functions are not described in this passage.
- id: motif:5
  label: shapeshifted ascetic in animal form curses the hunter
  taxonomy_refs:
  - shapeshifter
  - divine_judgment
  basis: A Rishi in deer form is killed by Pandu while mating, changes back into Rishi
    form, and curses Pandu to die in a parallel condition.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage identifies the being as a Rishi rather than a deity; divine_judgment
    is used only for the curse-as-retribution pattern.
- id: motif:6
  label: fatal erotic contact caused by a curse
  taxonomy_refs: []
  basis: The Rishi curses Pandu to die when similarly engaged before gratification,
    and Pandu later dies as soon as he touches Madri after desire is kindled.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No supplied taxonomy ref precisely names this motif.
- id: motif:7
  label: wife ascends husband’s funeral pyre
  taxonomy_refs:
  - sacrifice
  basis: Madri ascends the funeral pyre with Pandu and asks Kunti to raise her twins.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage records the act but does not explicitly frame it as sacrifice;
