canonical_text:
  quote: ''
  summary: Indra, appearing in the guise of a Brahmana, asks Karna for his body-born
    coat of mail and earrings. Karna explains that these make him unslayable, recognizes
    Indra, and negotiates their exchange for Indra's dart. Indra grants the dart under
    one-use conditions and warns Karna against improper use; Karna vows to use it
    only in imminent peril.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king of the celestials presents himself in the guise of a Brahmana, and
    Karna welcomes him without knowing his intention.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana asks not for gold, damsels, villages, kine, or other agreeable
    objects, but for Karna's coat of mail born with his body and his earrings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Karna says his mail was born with his body, his earrings arose from Amrita,
    and these make him unslayable in the worlds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Karna says that if deprived of the earrings and mail born with his body he
    will be liable to be vanquished by foes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Karna recognizes the requester as Sakra, states that he would face destruction
    if he gave the mail and earrings away without return, and asks for something in
    exchange.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Indra says Surya had known his purpose and unfolded it to Karna, then permits
    Karna to ask for a boon except the thunderbolt.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Karna asks for a dart incapable of being baffled and competent to destroy
    hosts of enemies arrayed in battle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Indra says the dart destroys enemies by hundreds in his own hand and returns
    to him, but in Karna's hand it will slay only one powerful enemy before returning
    to Indra.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Karna says he desires to slay one fierce, roaring, fire-hot enemy of whom
    he is afraid; Indra replies that the desired target is protected by Krishna, called
    Narayana and the invincible Boar.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Karna agrees to cut the mail and earrings from his person and asks that his
    wounded body not be unsightly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Indra grants that Karna's body will not be unsightly and will bear no scar,
    and says Karna will have the complexion and energy of his father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Indra warns that if Karna hurls the dart in wrath when he has other weapons
    and his life is not in imminent peril, it will fall on Karna himself; Karna vows
    to use it only in imminent peril.
  category: sequence
  evidence_refs:
  - ev:6
