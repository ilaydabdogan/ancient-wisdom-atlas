canonical_text:
  quote: "“Do not witness the annihilation of thy race, in thy old age.”"
  summary: After the royal funerary rites, Vyasa warns Satyavati of increasing wrongdoing
    and impending dynastic destruction. Satyavati and her daughters-in-law depart
    to the forest for contemplation and later ascend to heaven. The Pandavas grow
    up with the sons of Dhritarashtra; Bhima repeatedly overpowers them in play. Duryodhana,
    fearing Bhima’s strength and desiring sole rule, prepares a water-sport palace
    on the Ganga and invites the Pandavas there.
  language: English
  quote_policy: quoted
