canonical_text:
  quote: ''
  summary: Arjuna exhausts his arrows in combat with a Kirata who is identified as
    the god Hara/Bhava in Kirata form. After his bow is seized and his sword breaks,
    Arjuna fights with trees, stones, and fists, is overpowered and falls as if dead,
    then recovers. He worships a clay image of Bhava with garlands and sees the offered
    garland on the Kirata's crown. Hara, pleased, praises Arjuna and promises him
    true sight and an irresistible weapon.
  language: English
  quote_policy: summarized
