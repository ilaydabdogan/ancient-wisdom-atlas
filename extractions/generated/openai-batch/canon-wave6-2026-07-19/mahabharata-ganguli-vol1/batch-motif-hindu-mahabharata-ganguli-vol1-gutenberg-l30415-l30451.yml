  quote: Women, dice, hunting and drinking ... have been regarded as the four evils
    that deprive a man of prosperity.
  summary: Vasudeva tells the king that, had he been present, he would have prevented
    the gambling match by counsel, support from elders, or force. He describes dice
    as destructive, cites a former kingly loss through dice, names four addictive
    evils, and says he came after learning of the calamity from Yuyudhana at Dwarka.
