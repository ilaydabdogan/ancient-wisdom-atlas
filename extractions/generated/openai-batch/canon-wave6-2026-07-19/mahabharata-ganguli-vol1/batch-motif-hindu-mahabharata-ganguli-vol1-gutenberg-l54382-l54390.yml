  quote: ''
  summary: 'The speaker reports that Sita used a jewel as a credential or support
    and sent a token involving a remembered episode: the addressee once used a mantra-empowered
    blade of grass as a weapon against a crow on Chitrakuta. The speaker says this
    proved he had met Sita, then recounts being seized by Ravana''s soldiers and setting
    Lanka on fire.'
