canonical_text:
  quote: ''
  summary: At a swayamvara assembly, after many monarchs fail to string the bow, Arjuna
    rises from among the Brahmanas. The Brahmanas debate whether he should attempt
    the task, with some fearing ridicule and others praising his strength and Brahmana
    energy. Arjuna reverently approaches the bow, bows to Isana, remembers Krishna,
    strings the bow, and shoots the mark with five arrows through the machine. Gods
    and spectators celebrate, unsuccessful monarchs grieve, Drupada rejoices, Yudhishthira
    and the twins leave, and Arjuna wins Draupadi, who follows him as his wife.
  language: English
  quote_policy: summarized
