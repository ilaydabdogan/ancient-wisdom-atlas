canonical_text:
  quote: ''
  summary: Yudhishthira asks why Vindhya began to grow in wrath. Lomasa explains that
    the Sun circled Meru according to an assigned cosmic path; Vindhya demanded the
    same honour, was refused, and grew to obstruct the paths of the Sun, Moon, and
    stars. The gods appealed to Agastya, who obtained from Vindhya a promise to wait
    while he went south and then never returned. The gods then asked Agastya to drink
    the ocean so they could slay the Kalakeyas; he agreed and proceeded to the sea
    with gods, sages, and many beings as witnesses.
  language: English
  quote_policy: summarized
