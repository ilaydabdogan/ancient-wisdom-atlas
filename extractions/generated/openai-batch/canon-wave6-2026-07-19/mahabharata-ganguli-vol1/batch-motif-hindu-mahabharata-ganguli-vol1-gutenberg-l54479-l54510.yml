  summary: The passage describes the Ocean genius promising to support materials placed
    in his waters so that a bridge can be made, Rama ordering Nala to build the sea
    bridge, Vibhishana joining Rama and being installed over the Rakshasas, Rama's
    army crossing to Lanka, disguised spies being captured and released, and Angada
    being sent as envoy to Ravana.
