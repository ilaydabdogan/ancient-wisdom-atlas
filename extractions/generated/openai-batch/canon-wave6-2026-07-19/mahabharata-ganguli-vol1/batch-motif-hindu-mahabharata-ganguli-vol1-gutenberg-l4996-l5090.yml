canonical_text:
  quote: ''
  summary: Vasuki offers his sister Jaratkaru to the Rishi Jaratkaru and promises
    to maintain and protect her. The Rishi accepts under the condition that she must
    not displease him, or he will leave. They marry by prescribed rites in the snake
    king's house. After ritual purification she conceives an embryo described with
    fiery and lunar imagery. Later, when the Rishi sleeps at sunset, she wakes him
    so that he will not miss his evening rites. He takes this as an insult and declares
    he will leave according to their agreement. She pleads that she is faultless and
    that the desired offspring needed for the welfare of her relatives under a mother's
    curse has not yet appeared.
  language: English
  quote_policy: summarized
