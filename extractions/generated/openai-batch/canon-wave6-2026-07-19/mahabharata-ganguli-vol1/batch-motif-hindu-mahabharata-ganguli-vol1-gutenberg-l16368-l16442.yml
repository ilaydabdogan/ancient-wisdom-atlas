canonical_text:
  quote: ''
  summary: A Brahmana recounts Drona's birth from Bharadwaja's preserved vital fluid
    in a pot, Drona's childhood association with Drupada, his acquisition of weapons
    from Rama, Drupada's rejection of Drona's friendship, Drona's training of Kuru/Pandava
    pupils, and the capture and division of Drupada's kingdom as a preceptorial fee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bharadwaja is described as a wise Rishi of rigid vows who lived where the
    Ganga entered the plains and came to the river for ablutions.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bharadwaja saw the Apsara Ghritachi on the Ganga bank after a wind disrobed
    her, felt desire, and his vital fluid came out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bharadwaja placed the fluid in a pot, and a son named Drona was born from
    it; Drona later studied the Vedas and their branches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prishata, king of the Panchalas and friend of Bharadwaja, had a son named
    Drupada; Drupada played and studied with Drona at Bharadwaja's asylum and later
    succeeded to the throne.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Drona went to Rama seeking wealth, and Rama offered either his body or his
    weapons; Drona requested the weapons together with knowledge of their use and
    withdrawal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rama gave Drona all his weapons, including the Brahma weapon, and Drona became
    glad and superior over all men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Drona approached Drupada as a friend, but Drupada rejected the friendship
    on grounds of lineage, warrior status, and kingship.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Drona was mortified, planned to humiliate Drupada, went to the Kuru capital,
    and received Bhishma's grandsons as pupils along with wealth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Drona asked his disciples for a preceptorial fee, and after they became skilled
    in arms he demanded that they take Drupada's kingdom and give it to him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Pandavas defeated Drupada, captured him with his ministers, and offered
    him to Drona; Drona then proposed friendship and divided the kingdom north and
    south of the Ganga.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Drupada accepted a bond of eternal friendship, but the humiliation remained
    in his mind and he began to waste away.
  category: sequence
  evidence_refs:
  - ev:11
