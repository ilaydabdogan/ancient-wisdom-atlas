canonical_text:
  quote: ''
  summary: After the Pandavas are defeated at dice and sent into exile, Dhritarashtra
    grieves anxiously. Sanjaya says the hostility and coming destruction arise from
    Duryodhana's action in summoning and insulting Draupadi in the court. Dhritarashtra
    recalls omens, public lamentation, ritual interruption, Vidura's counsel, Draupadi's
    request for the Pandavas' liberation, and his own refusal to make peace because
    of affection for his son.
  language: English
  quote_policy: summarized
