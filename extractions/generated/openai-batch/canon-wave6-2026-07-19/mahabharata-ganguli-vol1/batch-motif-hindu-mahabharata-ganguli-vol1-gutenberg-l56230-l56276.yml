canonical_text:
  quote: ''
  summary: Kunti promises Kuntibhoja that she will attentively serve the visiting
    Brahmana at all times and avoid giving him cause for anger. She states that virtuous
    Brahmanas, when pleased, bestow salvation, and when displeased, can bring destruction,
    citing Chyavana and Sukanya as a precedent. Kuntibhoja instructs and encourages
    her, entrusts Pritha/Kunti to the Brahmana, asks the Brahmana to forgive any youthful
    transgressions, and provides white apartments, a seat in the sacrificial-fire
    room, and excellent offerings. Kunti humbly serves the Brahmana as if he were
    a god and gratifies him.
  language: English
  quote_policy: summarized
