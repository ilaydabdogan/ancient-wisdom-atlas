canonical_text:
  quote: ''
  summary: Karna and Sakuni, using a cowherd’s report about cattle-stations, ask Dhritarashtra
    to permit Duryodhana to go hunting and supervise cattle near Dwaitavana. Dhritarashtra
    warns that the Pandavas are nearby in forest exile and may be provoked. Sakuni
    assures him that they will avoid the Pandavas. Dhritarashtra reluctantly grants
    permission, and Duryodhana departs with a large retinue and camps near Lake Dwaitavana.
  language: English
  quote_policy: summarized
