canonical_text:
  quote: ''
  summary: After Pushkara wins Nala's kingdom and wealth by play, Nala and Damayanti
    leave the city in deprivation. Pushkara forbids citizens to aid Nala. In the wilderness,
    golden birds that identify themselves as the dice take Nala's remaining cloth.
    Nala points out roads and landmarks toward southern regions and Vidarbhas. Damayanti
    refuses to leave him and proposes that they both go to Vidarbhas, where her father
    will honor him.
  language: English
  quote_policy: summarized
