canonical_text:
  quote: ''
  summary: Janamejaya asks how Dhritarashtra's sons reacted after the Pandavas left
    Hastinapore with wealth and jewels. Vaisampayana narrates that Dussasana, Duryodhana,
    Karna, and Sakuni privately persuade Dhritarashtra to recall the Pandavas for
    another dice game. Duryodhana invokes Vrihaspati's counsel to Sakra, depicts the
    armed Pandavas as dangerous and unforgiving, proposes exile terms for the loser,
    and relies on Sakuni's expertise in dice. Dhritarashtra orders the Pandavas recalled
    despite the opposition of wise relatives and counselors who urge peace.
  language: English
  quote_policy: summarized
