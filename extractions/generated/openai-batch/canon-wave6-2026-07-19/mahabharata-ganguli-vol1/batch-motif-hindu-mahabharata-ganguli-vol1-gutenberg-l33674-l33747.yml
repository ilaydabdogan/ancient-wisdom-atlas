canonical_text:
  quote: ''
  summary: Sanjaya reports that Krishna and allied warriors visited the Pandavas in
    the Kamyaka woods after their defeat at dice. Krishna agreed to be Arjuna's charioteer
    and vowed to restore Yudhishthira's lost prosperity by slaying the foes. Yudhishthira
    asked that this vengeance wait until the completion of the thirteen-year forest
    pledge. Allies reassured Draupadi that those who humiliated her would die violently.
    Dhritarashtra recalls Vidura's warning that the dice game would lead to bloodshed
    and the destruction of the Kurus.
  language: English
  quote_policy: summarized
