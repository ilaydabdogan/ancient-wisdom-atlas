canonical_text:
  quote: ''
  summary: Arjuna travels among sacred waters and holy places near the western ocean,
    reaches Prabhasa, and is met by Krishna. The two friends, identified with Nara
    and Narayana of old, spend time at Prabhasa and Raivataka mountain, where Krishna
    has made preparations. Arjuna recounts his travels, rests, and then travels by
    golden car to Dwaraka, where the city and its people welcome him. He stays in
    Krishna's mansion for many days.
  language: English
