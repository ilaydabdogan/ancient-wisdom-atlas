canonical_text:
  quote: ''
  summary: Arjuna prepares for departure with bathing, prayers, and water oblations
    to the Pitris; he addresses and bids farewell to Mount Mandara; he ascends a celestial
    car driven by Matali and travels through the firmament. He sees self-luminous
    heavenly regions and their inhabitants, learns from Matali that these are the
    virtuous persons seen from earth as stars, and then passes by Airavata at the
    gates of Indra's region toward Amaravati.
  language: English
  quote_policy: summarized
