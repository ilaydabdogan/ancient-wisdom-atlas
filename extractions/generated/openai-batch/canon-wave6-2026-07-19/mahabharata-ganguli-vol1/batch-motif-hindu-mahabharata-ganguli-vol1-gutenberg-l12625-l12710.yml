canonical_text:
  quote: ''
  summary: Madri, childless while Kunti has sons, asks Pandu to request Kunti’s aid.
    Pandu petitions Kunti for offspring to continue the race and secure ancestral
    rites. Kunti allows Madri to invoke a celestial; Madri thinks of the twin Aswins,
    who beget twin sons, Nakula and Sahadeva. A disembodied voice praises the twins’
    future beauty and energy. Rishis on the mountain of a hundred peaks bless and
    name the children. Kunti later refuses to give Madri another use of the formula,
    fearing Madri will surpass her in number of children. The five sons of Pandu,
    born by celestials, grow in strength and auspicious qualities alongside Dhritarashtra’s
    hundred sons.
  language: English
  quote_policy: summarized
