canonical_text:
  quote: ''
  summary: Janamejaya asks about a secret not revealed to Karna by a radiant deity
    and about Karna’s ear-rings and coat of mail. Vaisampayana begins explaining by
    recounting how a powerful Brahmana came to Kuntibhoja as a guest, set conditions
    for his stay, and was entrusted to the service of Pritha. Kuntibhoja instructs
    Pritha to honor the Brahmana, praises her birth and adoption, and warns that offending
    such a Brahmana could bring ruin on his race.
  language: English
  quote_policy: summarized
