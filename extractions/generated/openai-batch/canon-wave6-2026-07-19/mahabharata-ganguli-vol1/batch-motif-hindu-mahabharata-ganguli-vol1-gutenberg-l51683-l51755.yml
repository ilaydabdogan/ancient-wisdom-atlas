canonical_text:
  quote: ''
  summary: Sakuni counsels Duryodhana not to die by fasting and urges him to restore
    the Pandavas' kingdom. Duryodhana refuses, prepares a vow of starvation with Kusa
    grass, water purification, rags, silence, and inward worship. Daityas and Danavas
    in the nether regions, fearing the loss of their party if he dies, perform a fire
    sacrifice with mantras and libations. A strange goddess arises from the sacrificial
    fire, is commanded to bring Duryodhana, and transports him to the nether regions
    where the Danavas rejoice and address him.
  language: English
  quote_policy: summarized
