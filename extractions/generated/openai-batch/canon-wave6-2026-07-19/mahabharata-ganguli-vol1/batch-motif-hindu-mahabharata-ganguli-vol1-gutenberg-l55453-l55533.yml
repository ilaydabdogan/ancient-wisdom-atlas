canonical_text:
  quote: ''
  summary: Savitri, remembering Narada's prediction of Satyavan's death, completes
    a severe three-night fast and ritual observances. On the appointed day she receives
    blessings, postpones eating, obtains permission from her in-laws to accompany
    Satyavan, and follows him into the forest while inwardly grieving and awaiting
    the foretold hour.
  language: English
  quote_policy: summarized
