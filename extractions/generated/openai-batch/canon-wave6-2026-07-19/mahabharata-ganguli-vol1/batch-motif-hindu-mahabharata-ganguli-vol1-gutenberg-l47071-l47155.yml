canonical_text:
  quote: ''
  summary: Markandeya narrates that the gods, through Agni and Indra, descend to earth
    in animal forms to test King Sivi. Agni appears as a pigeon seeking protection,
    while Indra appears as a hawk claiming the pigeon as ordained food. Sivi refuses
    to surrender the protected creature and offers his own flesh by weight; when the
    pigeon remains heavier, he mounts the scale himself. The deities reveal the test
    and promise auspicious marks, fame, long rule, and a son.
  language: English
  quote_policy: summarized
