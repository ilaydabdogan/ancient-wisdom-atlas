canonical_text:
  quote: ''
  summary: Narada tells Yudhishthira how Aditya/Surya described Brahma's celestial
    assembly-house, instructed Narada to undertake a thousand-year Brahma vow, and
    then took him to the heavenly Sabha. Narada describes the Sabha as indescribable,
    mutable, bliss-conferring, self-effulgent, eternal, and filled with Brahma and
    many deities, sages, cosmic principles, sciences, time-units, and goddesses in
    personified forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada announces that he will tell Yudhishthira about the assembly-house of
    the Grandsire, which he says cannot be described as having a fixed form.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aditya came down from heaven to the world of men in human form after seeing
    Brahma's assembly-house and later spoke to Narada about that celestial Sabha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Narada desired to see the sacred, sin-cleaning Sabha and asked Aditya what
    penances, acts, charms, or rites would enable him to behold it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aditya instructed Narada to observe the Brahma vow for one thousand years
    with his mind rapt in meditation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Narada went to the breast of Himavat, completed the vow, and Surya took him
    to the Sabha of the Grandsire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sabha is said to be impossible to describe; it changes form within a moment,
    and its dimensions or shape cannot be indicated.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those within the Sabha experience happiness; its atmosphere is neither cold
