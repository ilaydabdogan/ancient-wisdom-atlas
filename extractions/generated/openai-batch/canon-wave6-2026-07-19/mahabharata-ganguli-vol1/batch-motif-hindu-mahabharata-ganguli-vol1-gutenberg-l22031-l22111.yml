canonical_text:
  quote: ''
  summary: Vaisampayana narrates Krishna's departure from Khandavaprastha to see his
    father. Krishna exchanges respectful farewells with Kunti, Subhadra, Draupadi,
    Dhaumya, and the Pandavas; performs rites and makes offerings to Brahmanas before
    travel; departs in a golden chariot with Garuda banner, weapons, horses, and attendants;
    persuades the Pandavas to stop following him; reaches Dwaraka; and there honors
    his parents, brother, relatives, and enters Rukmini's apartments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krishna, after living happily at Khandavaprastha, becomes desirous of leaving
    to behold his father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna salutes Yudhishthira and Pritha/Kunti; Kunti smells his head and embraces
    him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Krishna speaks farewell to Subhadra, and Subhadra salutes and worships him
    while giving messages for her paternal relatives.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krishna makes obeisance to Dhaumya, consoles Draupadi, and obtains leave from
    her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before departing, Krishna bathes, adorns himself, and worships gods and Brahmanas
    with wreaths, mantras, bows, and perfumes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Krishna gives Brahmanas vessels of curd, fruits, parched grain, and wealth,
    and has them pronounce benedictions on him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Krishna ascends a golden chariot with a Garuda/Tarkhya banner, weapons, and
    the horses Saivya and Sugriva at an auspicious lunar and stellar moment.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yudhishthira ascends the chariot, has Daruka stand aside, and takes the reins;
    Arjuna fans Krishna with a white chamara; Bhima, Nakula, Sahadeva, priests, and
    citizens follow behind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After about half a Yojana, Krishna asks Yudhishthira to stop following; he
    salutes Yudhishthira and takes his feet, and Yudhishthira raises him, smells his
    head, and says goodbye.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Pandavas gaze after Krishna until he is out of sight, then return unwillingly
    to their city.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Krishna reaches Dwaraka with Satyaki and Daruka, is worshipped by principal
