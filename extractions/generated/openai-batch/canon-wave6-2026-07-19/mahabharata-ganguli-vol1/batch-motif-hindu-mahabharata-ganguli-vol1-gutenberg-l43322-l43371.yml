canonical_text:
  quote: ''
  summary: Janamejaya asks about the Pandavas' stay on Gandhamadana and Bhima's deeds.
    Vaisampayana narrates that the Pandavas follow Arshtishena's advice, dwell on
    Himavan, live on ascetic food, fruit, deer, and honey, hear Lomasa's stories,
    and witness marvels. Suparna carries off a mighty Naga from a lake, shaking the
    mountain and breaking trees. Wind brings five-hued blossoms from the mountain
    brow, and Krishna asks Bhima to drive away Rakshasas so the party may safely behold
    the flowered summit.
  language: English
  quote_policy: summarized
