canonical_text:
  quote: ''
  summary: Yudhishthira becomes melancholy amid concern for Dhananjaya. The celestial
    sage Narada arrives and is worshipped by Yudhishthira and his brothers. Yudhishthira
    asks Narada about the merit of traveling through the worlds to see sacred waters
    and shrines. Narada begins his answer by recounting what Bhishma once heard from
    Pulastya while dwelling under vow near the source of the Ganga, performing oblations,
    and receiving Pulastya with ritual reverence.
  language: English
