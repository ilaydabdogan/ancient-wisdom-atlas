canonical_text:
  quote: ''
  summary: Janamejaya asks Vaisampayana to describe Duryodhana's shameful return after
    defeat, capture, and liberation by the sons of Pandu. Vaisampayana narrates that
    Duryodhana, dismissed by Yudhishthira, departs slowly with head bowed, marches
    toward his city with his forces, encamps, and is visited before dawn by Karna,
    who praises him and admits his own flight from the Gandharvas. Duryodhana begins
    to answer with tears.
  language: English
  quote_policy: summarized
