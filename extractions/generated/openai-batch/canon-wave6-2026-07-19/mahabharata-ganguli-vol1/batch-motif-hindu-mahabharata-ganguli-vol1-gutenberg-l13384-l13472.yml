canonical_text:
  quote: ''
  summary: Drona lives privately at Kripa's house in Hastinapura while Aswatthaman
    teaches the sons of Kunti arms. The princes lose a ball in a dry well and cannot
    retrieve it. Drona demonstrates extraordinary skill by using mantra-invested grass
    to raise the ball and an arrow to raise his ring, after which the princes report
    him to Bhishma. Bhishma recognizes Drona as a suitable preceptor and asks his
    reason for coming. Drona recounts his training under Agnivesa, his boyhood friendship
    with Yajnasena of Panchala, Yajnasena's promise to share dominion, Drona's marriage
    to Kripi, and the birth of Aswatthaman.
  language: English
  quote_policy: summarized
