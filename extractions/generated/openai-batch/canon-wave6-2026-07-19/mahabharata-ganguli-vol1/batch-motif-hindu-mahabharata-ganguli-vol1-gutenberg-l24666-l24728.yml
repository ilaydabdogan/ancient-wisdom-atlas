canonical_text:
  quote: ''
  summary: Vaisampayana narrates Sahadeva’s southward military expedition on behalf
    of Yudhishthira. Sahadeva subdues numerous rulers and peoples, receives tribute
    and wealth, encounters the monkey-kings Mainda and Dwivida at the caves of Kishkindhya,
    and later fights King Nila at Mahishmati. In that battle Agni assists Nila, causing
    Sahadeva’s forces to appear aflame. Janamejaya asks why Agni opposed Sahadeva
    when Sahadeva’s campaign served the accomplishment of a sacrifice.
  language: English
