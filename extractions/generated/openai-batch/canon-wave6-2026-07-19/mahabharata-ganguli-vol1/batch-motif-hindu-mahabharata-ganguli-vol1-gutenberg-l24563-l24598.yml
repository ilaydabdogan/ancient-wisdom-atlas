canonical_text:
  quote: ''
  summary: Bhimasena, with Yudhishthira's assent and later command, marches with a
    large army through eastern and southern regions, conciliating, defeating, or subjugating
    rulers and peoples. Sudharman fights him fiercely and is appointed to command.
    Bhima then approaches Sisupala of Chedi, who receives and entertains him, offers
    his kingdom, asks his purpose, and hears Yudhishthira's intentions before Bhima
    departs.
