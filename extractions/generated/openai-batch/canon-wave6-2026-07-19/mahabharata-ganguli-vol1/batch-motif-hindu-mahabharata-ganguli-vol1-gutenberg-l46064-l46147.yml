canonical_text:
  quote: ''
  summary: Markandeya describes a universe dissolved into water after all beings and
    realms have disappeared. Wandering alone and exhausted, he sees a banyan tree
    with a radiant boy seated on a conch and celestial bed attached to a branch. The
    boy invites Markandeya to rest inside his body. Markandeya enters the boy's mouth
    and sees within his stomach the whole earth, rivers, ocean, sky, social orders,
    mountains, animals, gods, and other beings. After wandering inside for centuries
    without finding the body's limits, Markandeya seeks the protection of the deity
    and is expelled by a gust of wind, seeing again the same boy on the banyan branch,
    described as having swallowed the whole universe.
  language: English
  quote_policy: summarized
