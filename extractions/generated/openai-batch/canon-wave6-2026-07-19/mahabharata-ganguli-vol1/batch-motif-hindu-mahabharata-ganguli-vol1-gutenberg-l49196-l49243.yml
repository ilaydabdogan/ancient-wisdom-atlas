canonical_text:
  quote: There is but one fire, but according to the nature of its action, it is seen
    to divide itself into many.
  summary: Yudhishthira asks Markandeya about the fire-god hiding in water, Angiras
    acting as fire, the division of one fire into many forms, and Kumara's birth.
    Markandeya answers by recounting an old story in which Agni seeks the waters of
    the sea for penance, Angiras' ascetic splendour rivals fire, Agni's divine office
    is restored through dialogue, Angiras becomes Agni's first child, and Vrihaspati
    is born and explained to the gods.
  language: English
  quote_policy: quoted
