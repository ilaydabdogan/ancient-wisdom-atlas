  quote: "“O king, a child shall be born unto thee, endued, as thou desirest, with
    great prowess, great energy, and great strength.”"
  summary: King Drupada, seeking revenge against Drona and desiring a son capable
    of killing him, searches for Brahmana ritual specialists. He petitions Upayaja,
    who refuses but directs him to his elder brother Yaja. Drupada then persuades
    Yaja to perform a sacrifice, with Upayaja assisting, so that a powerful child
    may be born to him.
