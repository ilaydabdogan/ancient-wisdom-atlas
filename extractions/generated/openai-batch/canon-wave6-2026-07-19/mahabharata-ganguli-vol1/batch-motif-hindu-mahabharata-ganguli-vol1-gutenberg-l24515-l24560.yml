canonical_text:
  quote: ''
  summary: Vaisampayana narrates Arjuna's northern expedition. Arjuna subdues several
    regions, reaches sacred lakes including Manasa, receives tribute, and comes to
    North Harivarsha. Frontier guards warn that the land of the Northern Kurus cannot
    be conquered or seen by human eyes and that humans who enter perish. Arjuna declines
    to enter, asks tribute for Yudhishthira's imperial dignity, receives celestial
    goods, returns to Sakraprastha, and offers the wealth and animals to Yudhishthira.
  language: English
