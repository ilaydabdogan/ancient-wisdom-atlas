canonical_text:
  quote: '"For the good of the three worlds, give us thy bones."'
  summary: Yudhishthira asks Lomasa to recount Agastya's achievements. Lomasa begins
    a tale in which fierce Kalakeya Danavas under Vritra pursue the gods. The gods
    consult Brahma, who instructs them to ask the sage Dadhicha for his bones. The
    gods visit Dadhicha's forest asylum, petition him, and he willingly renounces
    his life. The gods take his bones to Twashtri, who fashions the Vajra and gives
    it to Indra to defeat the foe and rule heaven.
  language: English
  quote_policy: quoted
