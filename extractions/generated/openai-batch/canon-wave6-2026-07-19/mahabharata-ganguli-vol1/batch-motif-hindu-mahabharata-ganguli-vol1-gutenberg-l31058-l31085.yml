canonical_text:
  quote: It is difficult to confine the waters after the dam is broken!
  summary: Krishna says he could have prevented Suyodhana's survival or the dice match
    had he come earlier, then takes formal leave of the Pandavas. He departs for Dwaraka
    with Subhadra and Abhimanyu in a golden car. Other allied figures also leave,
    while Brahmanas, Vaisyas, and dwellers of Yudhishthira's kingdom refuse to abandon
    the Pandavas in the Kamyaka forest. Yudhishthira orders a car to be made ready.
  language: English
  quote_policy: quoted
