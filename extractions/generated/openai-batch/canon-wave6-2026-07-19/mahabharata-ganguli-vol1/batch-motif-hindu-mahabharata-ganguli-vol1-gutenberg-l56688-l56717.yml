canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Karna takes a blazing dart and cuts the natural
    mail and ear-rings from his own body without visible distress, giving them to
    Vasava/Indra while celestial beings acclaim him. Sakra is said to have beguiled
    Karna and ascends to heaven, causing distress among Dhritarashtra's sons and joy
    among Pritha's sons. Janamejaya asks about the sons of Pandu, and Vaisampayana
    answers that after defeating the Saindhava chief, rescuing Krishna, completing
    their forest exile, and hearing Markandeya's ancient stories, the heroes returned
    from Kamyaka to sacred Dwaitavana with their retinue.
  language: English
  quote_policy: summarized
