canonical_text:
  quote: At the end of that period, an exalted individual will drag you all from water
    to the land.
  summary: Varga recounts how she and her companions, cursed after attempting to tempt
    an ascetic Brahmana, begged forgiveness. The Brahmana limited the curse to a hundred
    years as crocodiles in sacred waters and foretold that an exalted individual would
    draw them from water to land and restore their forms. Narada later directed them
    to five holy waters near the southern ocean and predicted that Dhananjaya would
    free them. Arjuna delivers Varga's four remaining companions, the Apsaras regain
    their forms, the waters are freed from danger, and Arjuna proceeds to Manipura
    and then toward Gokarna.
  language: English
  quote_policy: quoted
