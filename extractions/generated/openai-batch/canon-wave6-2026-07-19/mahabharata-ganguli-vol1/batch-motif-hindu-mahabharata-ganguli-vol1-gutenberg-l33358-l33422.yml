canonical_text:
  quote: ''
  summary: Arjuna tells Urvasi that he gazed at her because he regards her as the
    ancestral mother of his race and therefore as worthy of reverence. Urvasi replies
    that Apsaras are free in their choice and asks him to accept her. Arjuna refuses,
    invokes witnesses, prostrates himself, and asks her to protect him as a son. In
    anger Urvasi curses him to live among women as a dancer without manhood. Arjuna
    reports the matter through Chitrasena to Sakra, who consoles him and says the
    curse will help during the thirteenth year of exile, after which Arjuna will regain
    his power. The passage ends by saying that listeners to this account become free
    of lustful and other faults and ascend to heaven.
  language: English
  quote_policy: summarized
