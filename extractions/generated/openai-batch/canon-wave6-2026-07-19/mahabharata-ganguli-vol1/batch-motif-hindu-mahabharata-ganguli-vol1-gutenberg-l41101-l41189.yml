canonical_text:
  quote: ''
  summary: A king admits Ashtavakra to the assembly after praising his speech and
    directs him toward Vandin. In Janaka's assembly and sacrificial setting, Ashtavakra
    challenges Vandin, using forceful images of fire, river, tiger, serpent, and mountain.
    Lomasa narrates to Yudhishthira that Ashtavakra and Vandin enter a numbered contest
    of sacred and cosmological knowledge. Vandin stops during the thirteenth item;
    Ashtavakra completes it. Vandin falls silent, the assembly erupts, and Brahmanas
    honor Ashtavakra with joined hands.
  language: English
  quote_policy: summarized
