canonical_text:
  quote: ''
  summary: After completing his vow, Kacha prepares to return to the celestials. Devayani
    asks him to marry her, citing her affection and his qualities. Kacha refuses because
    she is his preceptor's daughter and, by his stated reasoning, like a sister to
    him. Devayani curses his knowledge not to bear fruit; Kacha counters that no Rishi's
    son will marry her, while the knowledge will benefit those to whom he teaches
    it. Kacha returns to the celestials, who worship him and grant him a share in
    sacrificial offerings.
  language: English
  quote_policy: summarized
