canonical_text:
  quote: ''
  summary: Vaisampayana recounts that Yayati dwelt in heaven and was honored by celestial
    beings. Indra asks Yayati what he told Puru when Puru took on Yayati's decrepitude
    and received the kingdom. Yayati answers that he assigned Puru the central country
    between the Ganga and Yamuna and the outlying regions to Puru's brothers, then
    recounts ethical teachings on anger, forgiveness, non-retaliation, gentle speech,
    honoring the virtuous, kindness, charity, and giving without begging.
  language: English
