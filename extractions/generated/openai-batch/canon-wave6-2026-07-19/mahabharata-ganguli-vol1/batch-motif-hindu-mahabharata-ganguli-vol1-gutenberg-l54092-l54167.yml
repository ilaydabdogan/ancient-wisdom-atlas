canonical_text:
  quote: ''
  summary: Rama spends four months on the Malyavat hill while Sugriva honors him.
    Ravana confines Sita in an Asoka forest in Lanka under armed Rakshasa women. Sita
    lives austerely, grieves for Rama, and refuses any protector other than him. Trijata
    consoles Sita with Avindhya's message that Rama is well, allied with Sugriva,
    and that Ravana is restrained by Nalakuvera's curse. Trijata then recounts a dream
    foretelling Ravana's destruction, Vibhishana's survival, Rama and Lakshmana's
    martial dominance, and Sita's reunion with Rama.
  language: English
  quote_policy: summarized
