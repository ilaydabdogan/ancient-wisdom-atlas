  quote: she placed the nuptial garland about Pandu's neck
  summary: Kuntibhoja invites rulers so that his daughter Pritha/Kunti may choose
    a husband. In the royal assembly she sees Pandu, is moved, and places a nuptial
    garland on his neck. The other rulers depart, nuptial rites are performed, gifts
    are given, and Pandu returns with Kunti to his capital, where he establishes her
    in his palace.
