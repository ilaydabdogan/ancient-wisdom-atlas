canonical_text:
  quote: ''
  summary: Vrihadaswa concludes the Nala narrative by describing Nala's restored household,
    kingdom, rule, sacrifices, and recovery after dice-caused distress. He applies
    the story as consolation to Yudhishthira, says the history destroys evil and the
    influence of Kali, promises benefits to hearers and reciters, and offers Yudhishthira
    the science of dice. Yudhishthira receives the dice-lore, Vrihadaswa departs to
    bathe at sacred waters, and Yudhishthira then hears reports of Arjuna's severe
    ascetic penance and grieves for him in the forest.
  language: English
  quote_policy: summarized
