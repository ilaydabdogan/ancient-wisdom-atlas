canonical_text:
  quote: ''
  summary: Arjuna asks a Gandharva to identify a Veda-knowing Brahmana fit to serve
    as priest. The Gandharva recommends Dhaumya, an ascetic at the shrine of Utkochaka.
    Arjuna ceremonially gives the Gandharva a weapon of fire and leaves the offered
    horses with him until needed. The Gandharva and the Pandavas part respectfully
    at the banks of the Bhagirathi. The Pandavas go to Utkochaka, install Dhaumya
    as priest, are received with wild fruits and roots, and gain his consent. With
    their mother accompanying them, they regard their sovereignty and the Panchala
    princess as effectively obtained. Dhaumya becomes their spiritual preceptor, makes
    them his Yajamanas, blesses them, and accompanies their intended journey to the
    Swayamvara of the Princess of Panchala.
  language: English
  quote_policy: summarized
