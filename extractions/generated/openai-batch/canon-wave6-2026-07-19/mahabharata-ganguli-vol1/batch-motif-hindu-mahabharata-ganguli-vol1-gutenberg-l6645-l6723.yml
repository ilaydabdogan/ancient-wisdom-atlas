canonical_text:
  quote: ''
  summary: Vaisampayana recounts that Indra consulted Narayana about heavenly descent
    and that celestials became incarnate on earth to destroy Asuras and benefit the
    three worlds. Janamejaya asks to hear the births of gods and other beings. Vaisampayana
    then gives a genealogical catalogue beginning with Brahman, Kasyapa, Daksha's
    daughters, and the descendants of Aditi, Diti, Danu, Sinhika, Krodha, Danayu,
    Kala, and Sukra, closing by saying the progeny are countless and the account is
    heard in the Purana.
  language: English
  quote_policy: summarized
