canonical_text:
  quote: ''
  summary: 'Krishna narrates Jara''s explanation to the king: she is a Rakshasa woman
    and household goddess worshipped in the king''s house. Because of that worship,
    she united the fragmentary bodies of the king''s son, forming a living child.
    Jara disappears; the king performs infant rites, institutes a festival for her,
    names the child Jarasandha because he was united by Jara, and the child grows
    strong.'
  language: English
  quote_policy: summarized
