canonical_text:
  quote: ''
  summary: Janamejaya asks to hear about Bharata, Sakuntala, and Dushmanta. Vaisampayana
    begins by describing king Dushmanta’s march into the forest with a large fourfold
    army, public praise, blessings, and a swift chariot. The forest is described as
    tree-filled, rocky, waterless, uninhabited, and full of animals. Dushmanta and
    his warriors kill many animals; the disturbed animals flee, fall from thirst at
    dry river-beds, are eaten or roasted by warriors, and wounded wild elephants trample
    warriors before the forest is left bereft of major beasts.
  language: English
  quote_policy: summarized
