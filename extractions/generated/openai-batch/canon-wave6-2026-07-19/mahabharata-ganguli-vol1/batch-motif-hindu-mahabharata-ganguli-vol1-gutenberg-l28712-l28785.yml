canonical_text:
  quote: ''
  summary: 'Dhritarashtra asks Vidura how the Pandavas, Draupadi, and Dhaumya are
    leaving Hastinapore. Vidura describes each person''s outward sign: Yudhishthira
    covers his face, Bhima looks at his arms, Arjuna scatters sand, Sahadeva and Nakula
    conceal or soil their beauty, Draupadi weeps with dishevelled hair, and Dhaumya
    carries kusa grass while chanting mantras to Yama. Vidura interprets these signs
    as vows, restraint, future battle, and funeral rites. Citizens lament the departure,
    and ominous portents appear, indicating the destruction of the Bharatas.'
  language: English
  quote_policy: summarized
