canonical_text:
  quote: ''
  summary: Satyavati arranges for Vyasa to beget heirs on Vichitravirya's widows.
    Amvika closes her eyes in fear and bears the blind Dhritarashtra. Ambalika grows
    pale in fear and bears the pale Pandu. When asked to approach Vyasa again, Amvika
    sends an adorned maid, who respectfully receives him and bears Vidura, described
    as virtuous, intelligent, and the god of justice born on earth under Mandavya's
    curse. The sons are presented as propagators of the Kuru race.
  language: English
  quote_policy: summarized
