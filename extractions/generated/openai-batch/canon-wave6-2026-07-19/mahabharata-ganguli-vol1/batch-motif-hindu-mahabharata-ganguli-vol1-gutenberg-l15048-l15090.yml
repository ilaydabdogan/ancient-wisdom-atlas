canonical_text:
  quote: ''
  summary: A skilled miner sent by Vidura secretly comes to the Pandavas, reports
    the plan to burn them and their mother in an inflammable house, and offers aid.
    Yudhishthira recognizes him as Vidura's trusted friend, describes the danger,
    and asks him to save them without Purochana's knowledge. The miner excavates a
    concealed subterranean passage from the center of the house. The Pandavas remain
    armed and guarded while outwardly appearing trusting and content, and the citizens
    remain unaware of the plan.
  language: English
