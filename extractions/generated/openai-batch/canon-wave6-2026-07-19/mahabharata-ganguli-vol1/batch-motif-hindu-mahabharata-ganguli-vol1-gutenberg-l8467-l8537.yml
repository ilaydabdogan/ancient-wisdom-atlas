canonical_text:
  quote: ''
  summary: Kacha is welcomed in heaven after mastering a wonderful science, and the
    celestials learn it from him. They urge Purandara/Maghavat to attack their foes.
    On the way, Maghavat sees maidens bathing in a lake in Chitraratha's gardens,
    changes himself into wind, and mixes their garments. Sarmishtha unknowingly takes
    Devayani's attire, causing a quarrel marked by status insults. Sarmishtha throws
    Devayani into a dry well and leaves, believing her dead. King Yayati, thirsty
    from hunting, finds Devayani in the well, learns she is Sukra's daughter, and
    raises her by her right hand. Devayani then sends her maid Ghurnika to report
    the matter to her father and refuses to enter Vrishaparvan's city.
  language: English
  quote_policy: summarized
