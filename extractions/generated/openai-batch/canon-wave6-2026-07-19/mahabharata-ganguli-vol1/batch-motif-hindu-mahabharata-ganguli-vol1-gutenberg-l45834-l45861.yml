canonical_text:
  quote: ''
  summary: The flooded world is traversed by Manu, the seven Rishis, and a fish drawing
    their boat to the highest peak of Himavat. The fish reveals itself as Brahma,
    says it has saved them from the cataclysm, foretells Manu's renewed creation of
    beings through austerity, and the passage concludes with Manu creating again and
    with a stated benefit for hearing the story.
  language: English
  quote_policy: summarized
