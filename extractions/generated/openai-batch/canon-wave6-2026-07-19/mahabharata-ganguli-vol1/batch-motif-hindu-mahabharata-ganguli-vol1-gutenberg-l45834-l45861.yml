- id: obs:4
  text: The fish tells those on the vessel to tie it to the peak; they tie the boat
    there, and the peak is called Naubandhana, meaning the harbour.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fish tells the associated Rishis that it is Brahma, Lord of all creatures,
    and that it assumed the shape of a fish to save them from the cataclysm.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Brahma says Manu will create again all beings, including gods, Asuras, men,
