  summary: After Sakra departs, Vibhatsu/Arjuna, with his brothers and Krishna, pays
    homage to Yudhishthira, the son of Dharma. Yudhishthira smells Arjuna's head and
    asks in detail about Arjuna's time in heaven, the obtaining of weapons, his vision
    and worship of Sakra and Rudra/Mahadeva, and the service by which he pleased the
    celestial lord.
