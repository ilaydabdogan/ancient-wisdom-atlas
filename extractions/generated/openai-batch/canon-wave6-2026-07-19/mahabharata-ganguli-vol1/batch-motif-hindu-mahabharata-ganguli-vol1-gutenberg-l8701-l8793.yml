canonical_text:
  quote: ''
  summary: In a forest scene, Devayani appears with Sarmishtha and many maidens. King
    Yayati arrives tired and thirsty while hunting. Devayani identifies herself as
    Sukra's daughter and Sarmishtha as her waiting-maid, then chooses Yayati as friend
    and lord. Yayati hesitates over status and Brahmana authority, but says he will
    accept her if her father bestows her. Devayani summons Sukra, who bestows her
    on Yayati, absolves Yayati from the feared sin of a mixed union, and forbids him
    to summon Sarmishtha to his bed.
  language: English
  quote_policy: summarized
