canonical_text:
  quote: ''
  summary: At the close of Yudhishthira's sacrifice, Brahmana Rishis and invited kings
    gather in the sacrificial enclosure. Narada contemplates the assembly as connected
    with divine incarnations and Narayana's command that celestials be born on earth,
    fight, and return to heaven. Bhishma instructs Yudhishthira about offering Arghya
    to worthy persons and names Krishna as the foremost recipient. Sahadeva presents
    the first Arghya to Krishna, who accepts it; Sisupala objects and censures Bhishma,
    Yudhishthira, and Vasudeva.
  language: English
  quote_policy: summarized
