canonical_text:
  quote: ''
  summary: Footnotes explain answers attributed to Yudhishthira and interpretations
    by Nilakantha. The notes describe a spiritual reading in which an unpurified soul
    is raised by Brahma understood as Veda or self-knowledge, accompanied by self-restraint
    and divine qualities, led by Dharma to rest, and established in Truth or pure
    knowledge. Other notes discuss steady intelligence as a companion, objective and
    subjective sacrifice, Vedic cosmogony involving air, space as water, the cow-milk-butter-Homa-cloud-rain-seed-food
    sequence, the way of the good, timing of Sraddha, ascetic virtues, and mortal
    afflictions.
  language: English
