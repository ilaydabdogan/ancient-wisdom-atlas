canonical_text:
  quote: ''
  summary: Markandeya describes Mahadeva/Rudra traveling with Parvati/Uma in a radiant
    lion-drawn chariot at the head of a celestial military procession. Gods, Yakshas,
    Rakshasas, weapons, royal insignia, waters, celestial beings, serpents, planets,
    clouds, and attendants follow. Skanda/Mahasena, recently anointed leader of the
    celestial army, is ordered by Mahadeva to command the seventh army corps; Rudra
    promises his presence and welfare through devotion, embraces Skanda, dismisses
    him, and prodigies then occur.
  language: English
  quote_policy: summarized
