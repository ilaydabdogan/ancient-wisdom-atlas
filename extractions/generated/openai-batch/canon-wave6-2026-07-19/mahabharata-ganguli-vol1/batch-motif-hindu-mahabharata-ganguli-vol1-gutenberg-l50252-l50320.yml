candidate_motifs:
- id: motif:1
  label: Divine martial investiture
  taxonomy_refs:
  - royal_legitimacy
  - initiation
  basis: Skanda is described as anointed leader of the celestial army and is formally
    assigned command of the seventh army corps by Mahadeva, followed by an embrace
    and dismissal.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:12
  confidence: medium
  cautions: The passage concerns military command rather than kingship; royal-legitimacy
    terminology is approximate and needs review.
- id: motif:2
  label: Aerial procession of a deity with cosmic retinue
  taxonomy_refs:
  - ascent
  basis: Mahadeva's radiant chariot passes through blank space, and gods, waters,
    celestial beings, serpents, stars, planets, clouds, and attendants follow his
    train.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage describes airborne travel and procession, not an explicit
    upward ascent to heaven.
- id: motif:3
  label: Divine sovereignty marked by weapons and royal insignia
  taxonomy_refs:
  - royal_legitimacy
  basis: The procession includes Rudra's trident, Pattisa, Pinaka bow, white umbrella,
    royal fans, praise-singing, and bull emblem around Mahadeva.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:9
  confidence: medium
  cautions: The evidence is iconographic and ceremonial; it does not narrate a separate
    enthronement of Mahadeva.
- id: motif:4
  label: Devotion to a deity as source of welfare
  taxonomy_refs:
  - sacred_exchange
  basis: Rudra tells Skanda that by looking up to him and by devotion to him Skanda
    will attain great welfare.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives a brief assurance rather than an extended exchange ritual.
- id: motif:5
  label: Cosmic army including death, waters, celestial beings, and ominous prodigies
  taxonomy_refs:
  - chaos
  basis: The army includes Yama, Death, diseases, waters, serpents, stars, planets,
    and other beings; after Skanda is dismissed, prodigies disturb the gods.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:12
  confidence: low
  cautions: The procession is ordered and ceremonial; the chaos motif is suggested
    mainly by terrifying elements and later prodigies.
