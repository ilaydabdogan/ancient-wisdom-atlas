canonical_text:
  quote: ''
  summary: Panchali approaches Krishna in an assembly of angry kings and praises him
    as creator, Vishnu, sacrifice, cosmic lord, and refuge. She then recounts her
    humiliation in the Kuru assembly, criticizes the Pandavas for failing to protect
    her, invokes the duty linking husband, wife, and offspring, names her five sons,
    and recounts Duryodhana’s earlier offenses against the Pandavas, including exile,
    poisoning Bhima, casting him bound into the Ganges, setting cobras upon him, and
    burning the house at Varanavata.
  language: English
  quote_policy: summarized
