canonical_text:
  quote: ''
  summary: Aurva tells the Pitris that his anger-vow to destroy the worlds cannot
    be futile, explaining that he heard the cries of Bhrigu women while unborn during
    Kshatriya violence against the Bhrigus. The Pitris advise him to cast the fire
    born of his wrath into the waters so his vow remains true without destroying the
    worlds. Aurva casts the fire into Varuna's abode, where it becomes the Vadavamukha,
    a horse-headed oceanic fire that consumes the waters of the great ocean.
  language: English
  quote_policy: summarized
