  summary: Ruru asks why King Janamejaya intended to destroy the serpents and how
    the wise Astika saved them. A Rishi tells him he will learn Astika's history from
    Brahmanas and then vanishes. Ruru searches unsuccessfully, collapses from fatigue,
    regains consciousness, returns home, and asks his father to relate the history;
    his father does so.
