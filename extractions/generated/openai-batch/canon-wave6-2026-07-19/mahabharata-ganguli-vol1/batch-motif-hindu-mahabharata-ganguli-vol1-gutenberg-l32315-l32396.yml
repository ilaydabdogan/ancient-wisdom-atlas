canonical_text:
  quote: ''
  summary: Vaisampayana narrates Yudhishthira’s reply to Bhima. Yudhishthira argues
    against rash battle and lists powerful Kaurava-aligned warriors. Bhima falls silent.
    Vyasa arrives, is honored by the Pandavas, and privately tells Yudhishthira that
    fear can be dispelled through an ordained act. Vyasa imparts Pratismriti knowledge
    and instructs that Arjuna should go to named gods to obtain weapons. He also advises
    moving to another forest to avoid burdening ascetics and exhausting forest resources.
  language: English
  quote_policy: summarized
