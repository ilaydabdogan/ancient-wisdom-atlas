  quote: ''
  summary: Vaka answers Maghavan with teachings on household happiness, self-earned
    food, the disgrace of eating contemptuously given food in another's house, the
    merit of feeding guests and servants and offering to the manes before eating,
    and the purifying effect of honoring a Brahmana with food and a gift. After this
    conversation, the chief of the gods goes away to heaven.
