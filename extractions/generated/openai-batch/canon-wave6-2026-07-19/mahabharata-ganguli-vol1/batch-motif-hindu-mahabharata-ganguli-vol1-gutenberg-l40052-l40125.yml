canonical_text:
  quote: ''
  summary: Satyaki tells Rama that the occasion calls for action rather than lamentation.
    He argues that Yudhishthira and the sons of Pritha have powerful patrons, and
    urges the Dasarha, Vrishni, Bhoja, Andhaka, Satwata, and Sura forces and named
    warriors to destroy Dhritarashtra's sons and their allies. He imagines battlefield
    slaughter through comparisons with Indra killing Vritra, fire at the end of time,
    the clutches of death, and a sacrificial altar covered with sacred grass. He proposes
    that Abhimanyu rule while Yudhishthira fulfills his vow from the dice game, after
    which Yudhishthira will protect the earth.
  language: English
  quote_policy: summarized
