canonical_text:
  quote: Indeed, I shall fetch it today for emancipating my mother from her bondage.
  summary: Garuda releases a Brahmana and his Nishada wife from his throat, then meets
    his father Kasyapa and asks for food strong enough to help him seize amrita for
    his mother's emancipation. Kasyapa directs him to a sacred lake where two former
    rishi brothers, cursed into elephant and tortoise forms after a wealth dispute,
    continue their hostility; he tells Garuda to eat them and blesses him for combat
    with the gods.
  language: English
  quote_policy: quoted
