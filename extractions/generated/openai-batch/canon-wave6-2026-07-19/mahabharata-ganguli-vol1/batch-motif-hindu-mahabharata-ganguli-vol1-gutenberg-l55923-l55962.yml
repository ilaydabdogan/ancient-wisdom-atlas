canonical_text:
  quote: ''
  summary: At the close of the Savitri narrative, messengers from Salwa come to the
    hermitage and report that Dyumatsena’s usurping enemy has been killed and that
    the subjects want Dyumatsena restored as king. Dyumatsena returns to the city
    with Saivya and Savitri and is installed on the throne, with his son as prince-regent.
    Savitri later bears a hundred sons, and Aswapati and Malavi have a hundred sons.
    The narrator states that Savitri raised her own and her husband’s families from
    misfortune to prosperity, compares her saving role to that of Drupada’s daughter,
    and adds that reverent hearing of Savitri’s story brings happiness and success.
  language: English
  quote_policy: summarized
