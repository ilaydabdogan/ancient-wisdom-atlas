canonical_text:
  quote: ''
  summary: Draupadi cites an ancient conversation in which Vali asks Prahlada whether
    forgiveness or might is more meritorious. Prahlada answers that neither constant
    forgiveness nor constant severity is always meritorious, describes the harms of
    each excess, and lists occasions for forgiveness or punishment. Draupadi then
    applies the teaching to the present situation, urging the addressed king to use
    might against the sons of Dhritarashtra rather than continue forgiving them.
