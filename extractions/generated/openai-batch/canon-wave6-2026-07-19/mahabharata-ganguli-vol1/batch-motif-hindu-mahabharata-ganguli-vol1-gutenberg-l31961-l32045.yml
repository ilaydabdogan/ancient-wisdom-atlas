  summary: Vaisampayana narrates that Bhimasena, angered after Yajnaseni's words,
    addresses the king. Bhimasena argues that their kingdom was taken by Duryodhana
    through unfair dice, criticizes the king's forest exile and excessive adherence
    to vows, urges battle as preferable to dishonor, and expounds on the proper relation
    among virtue, wealth, and pleasure.
