  quote: a person of such control over the elements I have never before seen or heard
    of.
  summary: Damayanti suspects that Vahuka is Nala and sends Kesini to observe him.
    Kesini reports Vahuka's extraordinary command over passages, water, fire, and
    flowers. Damayanti then tests his identity through food he has cooked and by sending
    her children to him; Vahuka recognizes and embraces the children, weeps, and conceals
    his emotion by saying they resemble his own children.
  language: English
