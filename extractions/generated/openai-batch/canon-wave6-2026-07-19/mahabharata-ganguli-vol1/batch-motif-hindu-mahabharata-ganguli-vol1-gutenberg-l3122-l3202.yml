canonical_text:
  quote: ''
  summary: In SECTION XIX of the Astika Parva, Vishnu in an enchantress form, accompanied
    by Nara, deceives the Danavas and obtains the Amrita for the gods. Rahu drinks
    among the gods in disguise, is recognized by Surya and Soma, and is decapitated
    by Narayana, leading to an ongoing enmity expressed in eclipses. A violent battle
    follows between gods and Asuras/Danavas at the shore of the salt-water sea. Narayana
    summons and hurls the fiery Sudarsana discus, while Nara uses arrows against mountains
    hurled by the Danavas. The Danavas are defeated, some entering the earth and others
    the sea; the gods honor Mandara and entrust the vessel of Amrita to Narayana.
  language: English
  quote_policy: summarized
