canonical_text:
  quote: ''
  summary: Duryodhana recounts how Arjuna asked Chitrasena to release the captive
    brothers, how Chitrasena revealed the Kauravas' humiliating purpose, and how the
    bound captives were handed to Yudhishthira. Duryodhana laments being released
    by his foes, declares that he will not return home and will starve, and instructs
    Dussasana to accept royal installation in his place. Dussasana refuses, supplicates
    his elder brother, and vows that he will never rule without him.
  language: English
  quote_policy: summarized
