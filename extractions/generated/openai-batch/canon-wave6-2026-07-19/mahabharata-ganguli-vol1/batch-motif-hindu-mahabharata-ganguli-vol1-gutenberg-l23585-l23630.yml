  quote: Both Bhima and Arjuna, I regard as my eyes, and thee, O Janardana as my mind.
  summary: Yudhishthira hesitates to send Krishna, Bhima, and Arjuna against Jarasandha,
    fearing the danger and the difficulty of the Rajasuya. Arjuna answers by emphasizing
    prowess, disciplined effort, and the duty to defeat Jarasandha, rescue captive
    kings, and thereby win imperial dignity.
