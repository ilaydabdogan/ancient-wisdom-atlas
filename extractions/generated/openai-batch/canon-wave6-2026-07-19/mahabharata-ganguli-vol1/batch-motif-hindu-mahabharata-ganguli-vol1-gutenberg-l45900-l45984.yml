canonical_text:
  quote: ''
  summary: 'Markandeya praises Janardana as the self-existent primordial creator and
    lord, explains the durations and recurrence of the four Yugas, defines Universal
    Destruction as the withdrawal of the universe into the Creator, and lists signs
    of the Kali age approaching destruction: false speech, ritual and social inversion,
    foreign or Mleccha rule, bodily and moral decline, increase of animals, famine,
    reduced milk and fruitfulness, and religious hypocrisy.'
  language: English
  quote_policy: summarized
