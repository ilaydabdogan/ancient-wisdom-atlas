canonical_text:
  quote: ''
  summary: Janamejaya asks why Dhritarashtra allowed Duryodhana to anger the exiled
    sons of Pandu and asks what food they ate in the woods. Vaisampayana replies that
    the Pandavas gathered wild produce, hunted clean forest animals, dedicated food
    to Brahmanas, supported many Brahmanas in the woods, and lived in Kamyaka for
    five years while studying, praying, sacrificing, and feeling anxiety over Arjuna's
    absence.
  language: English
  quote_policy: summarized
