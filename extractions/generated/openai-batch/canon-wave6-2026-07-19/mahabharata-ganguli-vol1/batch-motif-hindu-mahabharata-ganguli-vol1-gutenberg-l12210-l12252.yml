canonical_text:
  quote: ''
  summary: Pandu, unable to beget children because of a deer’s curse, privately urges
    Kunti to obtain offspring through an equal or superior man. He argues that sons
    confer religious merit, cites recognized classes of sons and Manu’s sanction for
    begetting by others in cases of childlessness, and offers the precedent of Saradandayana’s
    daughter, who bore three sons by an ascetically successful Brahmana after a Punsavana
    rite.
  language: English
  quote_policy: summarized
