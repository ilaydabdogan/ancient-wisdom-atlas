canonical_text:
  quote: The son that may be born of this maiden shall be our king.
  summary: Santanu grieves over his desire for the fisherman's daughter and over the
    vulnerability of the Bharata dynasty with only Devavrata as heir. Devavrata learns
    from a minister that the fisher chief has required a boon regarding his daughter,
    goes to negotiate, and vows that the maiden's future son shall be king. The fisher
    chief praises Devavrata's promise but raises further concern about Devavrata's
    future children.
  language: English
  quote_policy: quoted
