canonical_text:
  quote: ''
  summary: Markandeya recounts how the Asura Dhundhu gained a boon from Brahma after
    severe austerities, oppressed celestial beings, and lay beneath the sands near
    Utanka's asylum intending to destroy the triple world. King Kuvalaswa, empowered
    by Vishnu and accompanied by Utanka and his twenty-one thousand sons, excavated
    the desert and confronted Dhundhu. Dhundhu burned the king's sons with flames
    from his mouth, but Kuvalaswa emitted water from his body to quench the fire and
    then destroyed Dhundhu with the Brahma weapon. The king received the name Dhundhumara
    and asked boons from the gods and Rishis.
  language: English
  quote_policy: summarized
