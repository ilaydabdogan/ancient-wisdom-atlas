canonical_text:
  quote: ''
  summary: A Brahmana asks how the soul becomes eternal and later asks about the senses.
    The fowler teaches that the spirit does not die but changes frames, that beings
    reap their own karma, and that actions determine rebirth among gods, humans, animals,
    or infernal regions. He describes repeated births and suffering as bondage by
    karmic fetters, then teaches that purification, austerities, virtue, renunciation,
    spiritual wisdom, truthfulness, forbearance, and subduing the senses lead to blissful
    regions, salvation, and the supreme asylum of Brahma.
  language: English
  quote_policy: summarized
