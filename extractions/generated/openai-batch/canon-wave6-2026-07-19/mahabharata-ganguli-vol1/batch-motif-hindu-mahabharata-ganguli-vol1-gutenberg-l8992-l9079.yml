canonical_text:
  quote: ''
  summary: Yayati, aged by the curse of Kavya/Usanas, asks his sons to take his decrepitude
    and give him their youth for a thousand years. Yadu, Turvasu, Drahyu, and Anu
    refuse and receive curses affecting kingship, descendants, territory, or ritual
    capacity. The youngest son, Puru, accepts; Yayati blesses Puru's kingdom and transfers
    his decrepitude to Puru's body.
  language: English
  quote_policy: summarized
