canonical_text:
  quote: ''
  summary: Kaikeyi invokes an earlier promise from king Dasaratha and asks that Bharata
    receive the investiture intended for Rama while Rama is exiled to Dandaka for
    fourteen years as an ascetic. Rama obeys to preserve his father's truth, accompanied
    by Lakshmana and Sita; Dasaratha dies afterward. Bharata rejects Kaikeyi's act,
    seeks Rama, and later rules at Nandigrama with Rama's wooden sandals before him.
    Rama moves through forest hermitages, dwells near the Godavari, and kills Khara,
    Dushana, and many Rakshasas for the protection of ascetics. The mutilated Surpanakha
    goes to Ravana in Lanka; Ravana becomes wrathful, hears of Rama's prowess, and
    travels by air across mountains and ocean to meet Maricha, who lives ascetically
    out of fear of Rama.
  language: English
  quote_policy: summarized
