canonical_text:
  quote: The lineage of heroes, like the sources of a lordly river, is ever unknown.
  summary: Adhiratha enters the arena and Karna honors him as father after Karna's
    installation as king of Anga. Bhima mocks Karna as a charioteer's son and unworthy
    of kingship. Karna silently reacts and looks toward the sun. Duryodhana angrily
    defends Karna, arguing that martial might and heroic signs outweigh disputed lineage,
    citing several examples of obscure or extraordinary origins. After sunset Duryodhana
    leads Karna away by the hand; Kunti recognizes Karna as her son by his marks and
    is pleased at his kingship, while Duryodhana gains confidence against Arjuna through
    Karna's alliance.
  language: English
  quote_policy: quoted
