canonical_text:
  quote: ''
  summary: Dhritarashtra, distressed after hearing of the Pandavas' extraordinary
    way of life, tells Sanjaya that he has no peace because of his sons' conduct in
    gambling and because of the Pandavas' heroism, mutual loyalty, and allies. He
    describes Nakula and Sahadeva as celestial-origin warriors, foresees Bhima, Arjuna,
    the Vrishnis, Panchalas, and Vasudeva overwhelming his forces, recalls the insult
    to Draupadi as a cause of rage, and anticipates regretting his obedience to Duryodhana
    rather than to his friends' counsel.
  language: English
  quote_policy: summarized
