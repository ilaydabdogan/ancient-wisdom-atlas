canonical_text:
  quote: The object of a translator should ever be to hold the mirror upto his author.
  summary: The passage is the translator's preface. It states a principle of close,
    literal translation, cites Pickford and Tawney in support of fidelity to Indian
    texts despite possible ridicule from English readers, and recounts how Pratapa
    Chandra Roy and collaborators engaged the translator, arranged the project, reviewed
    a specimen, and began the English translation of the Mahabharata.
  language: English
  quote_policy: quoted
