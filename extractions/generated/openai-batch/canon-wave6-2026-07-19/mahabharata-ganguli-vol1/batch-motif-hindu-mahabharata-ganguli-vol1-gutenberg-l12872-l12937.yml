canonical_text:
  quote: '"For the good of their souls, distribute cattle, cloths, gems and diverse
    kinds of wealth"'
  summary: Dhritarashtra orders royal funeral rites for Pandu and Madri, with gifts
    distributed for their souls and Madri's body carefully wrapped. Vidura and Bhishma
    arrange the rites; priests carry sacred fire, the bodies are decorated and processed
    with royal insignia to the bank of the Ganga, washed and dressed, and then cremated.
    The assembled family and citizens lament, perform a watery ceremony, console Pandu's
    sons, and observe twelve days of mourning.
  language: English
  quote_policy: quoted
