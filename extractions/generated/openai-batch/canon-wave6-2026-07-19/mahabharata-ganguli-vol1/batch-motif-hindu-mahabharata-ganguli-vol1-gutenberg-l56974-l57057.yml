canonical_text:
  quote: "“first answer my questions, and then take away as much as thou likest!”"
  summary: Yudhishthira approaches a Yaksha guarding a lake. The Yaksha says Yudhishthira’s
    brothers were slain for trying to take water despite his prohibition, and requires
    Yudhishthira to answer questions before drinking. Yudhishthira agrees, and the
    Yaksha asks a sequence of riddling questions about the sun, learning, social duties,
    sacrifice, agriculture, offerings, kinship, natural phenomena, friends, fire,
    milk, the universe, and virtue. Yudhishthira answers each in moral, cosmological,
    and ritual terms. The supplied passage breaks off during the final answer.
  language: English
  quote_policy: quoted
