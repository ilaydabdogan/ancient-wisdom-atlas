canonical_text:
  quote: ''
  summary: The deity speaking to Markandeya declares himself Narayana and the Universal
    Soul, explains that Markandeya saw the universe within his stomach after the destruction
    of creatures and a vast expanse of water, says he will create the world when Brahma
    wakes, and then vanishes. Markandeya reports that creation began again and identifies
    the deity with Janardana/Krishna/Hari/Govinda/Madhava. The sons of Pritha, the
    twins, and Draupadi bow to Janardana, who consoles them.
  language: English
  quote_policy: summarized
