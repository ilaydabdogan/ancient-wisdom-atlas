canonical_text:
  quote: ''
  summary: The Pandavas wander with Kunti in ascetic dress and disguise, studying
    sacred and practical knowledge. They meet their grandfather Vyasa, who explains
    that he knows of their deceitful exile, comforts them, guides them to Ekachakra,
    and instructs them to remain there in disguise. Vyasa consoles Kunti with a prophecy
    that Yudhishthira will rule the earth, aided by Bhima and Arjuna, and that her
    sons will perform royal sacrifices and regain ancestral rule.
  language: English
  quote_policy: summarized
