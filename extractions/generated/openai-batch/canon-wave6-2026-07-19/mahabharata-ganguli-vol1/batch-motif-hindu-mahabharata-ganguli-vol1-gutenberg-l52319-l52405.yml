canonical_text:
  quote: ''
  summary: Yudhishthira asks about a virtuous person who gave away a drona of corn.
    Vyasa recounts Mudgala of Kurukshetra, who lived by austere gleaning, fed deities
    and guests, and whose food increased when guests appeared. Durvasa repeatedly
    arrives as a hungry and disruptive ascetic guest, consumes all the food, and finds
    Mudgala undisturbed by hunger or anger. Durvasa praises Mudgala's charity and
    self-control and says he will go bodily to heaven. A celestial messenger then
    appears with a swan-and-crane-yoked car and invites Mudgala to ascend; Mudgala
    asks first for a truthful account of heaven's qualities, happiness, and disadvantages.
  language: English
  quote_policy: summarized
