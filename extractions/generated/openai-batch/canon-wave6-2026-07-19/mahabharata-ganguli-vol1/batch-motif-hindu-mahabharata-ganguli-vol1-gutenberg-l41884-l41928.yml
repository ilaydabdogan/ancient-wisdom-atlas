  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A violent wind with a heavy shower raises dust and dry leaves that cover earth,
    air, and firmament, producing darkness and preventing mutual perception and speech.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wind causes trees to break and fall, and the travelers think that the
    heavens may be falling or that the earth and mountains may be splitting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Afraid of the wind, the travelers feel about with their hands and take shelter
    under wayside trees, ant-hills, and in caverns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bhimasena holds his bow and supports Krishna under a tree.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yudhishthira and Dhaumya go into deep wood; Sahadeva carries the sacred fire
