  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the wind abates and dust subsides, torrents of rain, thunder-like noise,
    lightning, and foaming muddy rivers appear; the rivers roar and uproot trees.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the violent sounds cease, the travelers come out from their shelters,
    meet together, and start again for Gandhamadana.
  category: sequence
  evidence_refs:
