canonical_text:
  quote: ''
  summary: Vaisampayana narrates that armed heroes travel with Panchali and Brahmanas
    toward Gandhamadana, pass through a sacred mountain landscape, undergo a violent
    storm with dust, darkness, rain, lightning, and rushing rivers, take shelter in
    natural places, regroup, and continue toward the mountain.
  language: English
  quote_policy: summarized
