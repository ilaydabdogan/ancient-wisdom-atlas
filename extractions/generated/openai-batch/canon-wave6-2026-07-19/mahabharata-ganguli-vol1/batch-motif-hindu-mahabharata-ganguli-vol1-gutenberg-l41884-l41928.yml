  text: Armed bowmen equipped with bows, quivers, arrows, guana-skin finger-caps,
    and swords proceed with Panchali and Brahmanas toward Gandhamadana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the way they see lakes, rivers, mountains, forests, shady trees, and places
    with flowers and fruit in all seasons, frequented by celestials and sages.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heroes restrain their senses, subsist on fruits and roots, and pass through
    rugged, craggy, difficult regions where they see many beasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: They enter a mountain described as inhabited by sages, Siddhas, and celestials
