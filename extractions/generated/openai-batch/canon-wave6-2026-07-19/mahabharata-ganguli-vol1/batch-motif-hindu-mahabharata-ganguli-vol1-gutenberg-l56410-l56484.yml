  quote: "“Thou shalt bring forth a son who will become the foremost of all wielders
    of weapons. At the same time thou shalt remain a virgin.”"
  summary: Surya continues to press Kunti despite her objections. Fearing both a curse
    and social reproach, Kunti asks that she remain chaste and that any son be powerful
    and marked by celestial armor and earrings. Surya promises an illustrious son
    with Amrita-made earrings and invulnerable mail, enters Kunti by Yoga while touching
    her navel, places himself in her womb without deflowering her, departs, and Kunti
    regains consciousness.
