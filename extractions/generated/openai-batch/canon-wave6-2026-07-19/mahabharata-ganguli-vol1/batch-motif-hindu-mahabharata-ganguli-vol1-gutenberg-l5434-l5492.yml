  quote: ''
  summary: Saunaka asks Sauti to identify the ritual specialists at Janamejaya's snake-sacrifice.
    Sauti names the officiants and assessors. When the priests pour clarified butter
    into the fire, snakes fall into it and burn. Takshaka seeks refuge with Indra
    and is assured safety. Vasuki, grieving over the destruction of the snake race,
    asks his sister to solicit her son Astika, whom he says will end the sacrifice.
