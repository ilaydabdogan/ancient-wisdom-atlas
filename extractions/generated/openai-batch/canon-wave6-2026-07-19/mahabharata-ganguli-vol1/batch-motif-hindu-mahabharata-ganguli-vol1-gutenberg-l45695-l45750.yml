canonical_text:
  quote: ''
  summary: Markandeya recounts that the Muni Tarkshya questioned Saraswati about the
    conduct, worship, oblations, and maintenance of sacred fire needed to remain on
    the path of virtue. Saraswati answers with teachings on Vedic study, celestial
    ascent, sacred lakes, rewards for gifts of cows, bullocks, clothes, gold, land,
    and other offerings, salvation of generations, descent to lower regions by one's
    own acts, and the sanctifying effect of seven years of fire oblations.
  language: English
  quote_policy: summarized
