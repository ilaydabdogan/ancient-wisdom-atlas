canonical_text:
  quote: ''
  summary: The passage first states that complete emancipation is attained only by
    knowledge, while asceticism, charity, and ablutions yield more limited results.
    Yudhishthira asks about meritorious charity. Markandeya then describes charitable
    acts, auspicious places and times for giving, the guest as Indra, gifts to Brahmanas,
    the rebirth-results of gifts, and the divine origins of gold, land, and cows.
  language: English
  quote_policy: summarized
