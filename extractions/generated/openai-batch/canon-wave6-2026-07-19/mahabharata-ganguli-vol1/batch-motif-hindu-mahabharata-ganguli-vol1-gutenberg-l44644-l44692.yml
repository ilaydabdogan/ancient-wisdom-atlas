canonical_text:
  quote: ''
  summary: Yudhishthira asks Arjuna to show the celestial weapons with which he defeated
    the Danavas. Arjuna purifies himself and begins to display the weapons, causing
    cosmic and earthly disturbance. Many beings, sages, gods, and other classes of
    creatures appear. Narada arrives and forbids Arjuna to discharge the weapons without
    a fit object or pressing need, warning that improper keeping of them could destroy
    the three worlds. The assembled immortals depart, and the Pandavas dwell in the
    forest with Krishna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After night passed, Yudhishthira and his brothers performed necessary duties,
    and Yudhishthira asked Arjuna to show the weapons used against the Danavas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arjuna, called Dhananjaya and son of Pandu, practiced extreme purity and showed
    weapons given to him by the celestials.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Arjuna sat on the earth as his chariot, wore celestial armor, took Gandiva
    and a conch-shell given by the gods, and began to exhibit the celestial weapons
    in order.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the celestial weapons were set, the earth trembled with its trees, rivers
    and the sea were disturbed, rocks split, air was hushed, the sun did not shine,
    fire did not flame, and the Vedas did not shine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Creatures from the interior of the earth, afflicted and burnt by the weapons,
    surrounded Arjuna trembling with joined hands and begged him for their lives.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brahmarshis, Siddhas, Maharshis, mobile beings, Devarshis, celestials, Yakshas,
    Rakshasas, Gandharvas, feathered tribes, and other sky-ranging beings appeared.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Great-sire, the Lokapalas, and Mahadeva came with their followers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Vayu scattered unearthly variegated blossoms around Arjuna; Gandharvas chanted
    ballads; Apsaras danced.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Narada arrived and told Arjuna not to discharge the celestial weapons when
    no fit object was present or when he was not sore pressed.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Narada said proper keeping of the weapons would conduce to Arjuna's strength
    and happiness, while improper keeping would make them instruments for the destruction
    of the three worlds.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Narada said Yudhishthira would see those weapons when Arjuna used them against
