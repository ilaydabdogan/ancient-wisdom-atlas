canonical_text:
  quote: ''
  summary: The Pandavas travel from the Ganges through sacred river regions to the
    Kamyaka woods on the Saraswati and dwell there with Munis. Vidura visits them
    after being dismissed by Dhritarashtra, recounts that Dhritarashtra rejected his
    counsel, warns of destruction for the Kuru race, and advises Yudhishthira to endure
    wrongs, build resources, share with adherents, and act truthfully. Yudhishthira
    agrees to follow the counsel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pandavas, with followers, leave the banks of the Ganges, perform ablutions
    in several rivers, travel westward through forests, and begin dwelling in Kamyaka
    woods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamyaka is described as a favorite haunt of Munis, on the banks of the Saraswati,
    and abounding in birds and deer.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vidura goes in a single car drawn by swift steeds to the Kamyaka woods because
    he longs to see the Pandavas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vidura sees Yudhishthira sitting with Draupadi in a retired spot, surrounded
    by his brothers and Brahmanas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yudhishthira asks Bhimasena whether Vidura has been sent by Sakuni to invite
