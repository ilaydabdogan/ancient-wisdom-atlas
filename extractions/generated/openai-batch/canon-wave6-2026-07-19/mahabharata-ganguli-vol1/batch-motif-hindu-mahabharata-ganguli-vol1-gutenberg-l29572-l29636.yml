  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vidura says Dhritarashtra dismissed him and told him to go where he liked,
    after which Vidura came to Yudhishthira to offer good counsel.
  category: sequence
  evidence_refs:
  - ev:5
