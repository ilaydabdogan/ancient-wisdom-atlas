canonical_text:
  quote: ''
  summary: At daybreak, mendicant Brahmanas stand before the Pandavas as they prepare
    to enter the forest. Yudhishthira, having lost prosperity and kingdom, urges the
    Brahmanas not to follow because of the forest's dangers and privations. The Brahmanas
    insist on accompanying him and promise to sustain themselves while supporting
    him through prayers, meditation, and conversation. Yudhishthira remains troubled
    by their hardship and reproaches the sons of Dhritarashtra.
  language: English
