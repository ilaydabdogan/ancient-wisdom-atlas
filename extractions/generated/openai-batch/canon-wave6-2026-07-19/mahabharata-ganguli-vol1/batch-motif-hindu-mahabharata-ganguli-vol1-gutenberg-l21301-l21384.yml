canonical_text:
  quote: ''
  summary: During the burning of Khandava forest, Arjuna blocks Indra's rain and traps
    escaping creatures with arrows. Aswasena, son of the Naga chief Takshaka, escapes
    after his mother attempts to save him and is killed by Arjuna, while Indra momentarily
    disables Arjuna. Arjuna, Agni, and Krishna curse the escaping snake. Indra sends
    clouds, rain, lightning, and later the thunderbolt; Arjuna counters with weapons.
    Agni blazes through the forest. Birds, Nagas, Asuras, Gandharvas, Yakshas, Rakshasas,
    and celestials attack Krishna and Arjuna, who slaughter many attackers. The passage
    ends with divine forces rushing against the two heroes and portents appearing.
  language: English
  quote_policy: summarized
