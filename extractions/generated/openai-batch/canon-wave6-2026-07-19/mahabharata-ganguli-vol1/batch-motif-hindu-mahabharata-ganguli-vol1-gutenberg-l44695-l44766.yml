canonical_text:
  quote: ''
  summary: Janamejaya asks what the sons of Pritha did after Arjuna returned from
    Indra's abode. Vaisampayana narrates that the Pandavas lived peacefully for years
    in Vaisravana's mountain pleasure-gardens. Bhima urges Yudhishthira to leave the
    heaven-like region, complete the exile terms, regain the kingdom, and destroy
    Suyodhana. Yudhishthira bids farewell to Vaisravana's abode and the mountain,
    asks to see it again after completing his task, and departs with his brothers
    and companions while Ghatotkacha carries them over cascades and sages advise them.
  language: English
  quote_policy: summarized
