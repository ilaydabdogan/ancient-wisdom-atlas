canonical_text:
  quote: ''
  summary: Markandeya narrates that Satyavan, while gathering fruit and cutting branches
    with Savitri, becomes weak with a severe headache and lies with his head in her
    lap. Savitri recalls Narada’s prediction and measures the appointed time. She
    sees a dreadful, radiant, dark-hued divine person with red attire, red eyes, a
    diadem, and a noose standing beside Satyavan. When she asks who he is, he identifies
    himself as Yama and says Satyavan’s life has ended and he has come to take him
    away bound in the noose. Savitri asks why Yama has come in person rather than
    sending emissaries.
  language: English
