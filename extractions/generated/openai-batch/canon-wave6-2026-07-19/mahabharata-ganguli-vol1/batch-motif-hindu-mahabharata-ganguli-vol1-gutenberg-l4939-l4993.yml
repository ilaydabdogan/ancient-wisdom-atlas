canonical_text:
  quote: ''
  summary: 'Jaratkaru addresses his Pitris, learns that they require him to marry,
    and agrees to seek a wife only under strict conditions: she must share his name,
    be given to him as alms, and not require his maintenance. He searches unsuccessfully,
    then calls aloud in the forest for such a bride. Snakes tracking him inform Vasuki,
    who brings an ornamented maiden and offers her to the Rishi, who hesitates and
    asks her name while restating that he will not maintain her.'
  language: English
  quote_policy: summarized
