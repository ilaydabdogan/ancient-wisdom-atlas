  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nala saw Damayanti surrounded by handmaids and described as radiant, beautiful,
    slender-waisted, fair-eyed, and surpassing the light of the moon.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nala's love increased when he saw Damayanti, but he suppressed his passion
    because he wished to keep his truth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Damayanti's attendants rose in amazement at Nala, praised him mentally, and
