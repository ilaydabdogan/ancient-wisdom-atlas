canonical_text:
  quote: ''
  summary: Nala, after pledging to the gods, is instructed by Indra to carry a message
    to Damayanti that Indra, Agni, Varuna, and Yama desire her to choose one of them
    at the swayamvara. Though Nala is himself in love with Damayanti, the gods hold
    him to his promise. Enabled by divine power, he enters Damayanti's guarded palace
    unseen; Damayanti and her attendants marvel at him, and he identifies himself
    as the gods' messenger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nala pledged to the celestials that he would do the requested task, then asked
    who they were, who wanted him as messenger, and what he was to do.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maghavat identified the visitors as immortals who had come for Damayanti,
    naming Indra, Agni, the lord of waters, and Yama.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indra instructed Nala to tell Damayanti that the guardians of the world were
    coming to the swayamvara assembly and desired her to choose one of them as lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nala objected that he had come with the same aim and was himself under the
    influence of love, so he should not speak for others to Damayanti.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods reminded Nala that he had first promised to act and asked why he
    would not do so now.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nala said Damayanti's mansions were well guarded; Indra replied that he would
