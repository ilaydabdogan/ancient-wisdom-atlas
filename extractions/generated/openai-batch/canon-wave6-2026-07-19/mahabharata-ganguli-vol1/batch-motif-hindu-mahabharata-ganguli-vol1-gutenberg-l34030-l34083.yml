  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Damayanti asked Nala who he was, why he had come, and how he had avoided discovery
    in her well-guarded apartments.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nala answered that he was Nala and had come as messenger of the gods; he said
    the celestials desired Damayanti and that divine power had let him enter unseen.
  category: speech
  evidence_refs:
  - ev:8
