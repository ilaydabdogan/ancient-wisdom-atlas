canonical_text:
  quote: ''
  summary: Kanwa recounts that Sakra commanded the wind god to accompany Menaka when
    she came before the ascetic Viswamitra. Menaka entered the retreat, Marut removed
    her garments, and Viswamitra desired her. Viswamitra and Menaka lived together
    for a long time and begot Sakuntala. Menaka gave birth on the bank of the river
    Malini near Himavat, left the newborn there, and departed. Vultures or Sakunta
    birds protected the infant until Kanwa found her during ablution, adopted her,
    and named her Sakuntala because of the birds. Sakuntala says she regards Kanwa
    as her father.
  language: English
  quote_policy: summarized
