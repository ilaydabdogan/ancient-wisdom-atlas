canonical_text:
  quote: ''
  summary: The sons of Pandu ask Markandeya to tell of the greatness of royal Kshatriyas.
    Markandeya recounts how King Suhotra of the Kuru race and King Sivi, son of Usinara,
    met on the road and each refused to yield, claiming equality. Narada appeared,
    questioned them, and recited moral verses declaring Sivi's goodness greater and
    advising conquest of meanness, falsehood, wickedness, and dishonesty through charity,
    truth, forgiveness, and honesty. Suhotra then walked around Sivi, praised him,
    gave him the way, and continued.
  language: English
  quote_policy: summarized
