canonical_text:
  quote: ''
  summary: Arjuna recounts that after beholding Mahadeva he met a Brahmana who foretold
    his contact with the Lokapalas and Indra's granting of weapons. At the Himalayan
    base celestial signs and divine hosts appear. The Lokapalas grant weapons and
    recognize Arjuna; Indra tests his restraint, promises instruction in divine weapons,
    and sends Matali with a celestial car to bring Arjuna to heaven in his living
    body. Arjuna ascends the car and remains unshaken, astonishing Matali.
  language: English
  quote_policy: summarized
