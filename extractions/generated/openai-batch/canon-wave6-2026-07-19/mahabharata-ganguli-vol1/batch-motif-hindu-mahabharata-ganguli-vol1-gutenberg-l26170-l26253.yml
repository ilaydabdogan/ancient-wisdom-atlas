- id: obs:3
  text: Duryodhana says he lives in fierce jealousy and that Yudhishthira's prosperity
    makes him pale and unable to enjoy what he possesses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Duryodhana says Yudhishthira supports eighty-eight thousand Snataka Brahmanas
    and feeds many Brahmanas daily at his palace on golden plates.
  category: action
  evidence_refs:
  - ev:4
