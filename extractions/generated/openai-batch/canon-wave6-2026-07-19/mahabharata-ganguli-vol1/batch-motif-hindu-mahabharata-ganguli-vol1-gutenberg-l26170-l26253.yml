canonical_text:
  quote: ''
  summary: Sakuni tells Dhritarashtra that Duryodhana is pale, emaciated, and anxious.
    Dhritarashtra asks Duryodhana why he grieves despite royal luxuries. Duryodhana
    answers that jealousy over Yudhishthira's Rajasuya prosperity consumes him, then
    enumerates Yudhishthira's support of Brahmanas, daily feedings, tributes from
    kings, oceanic gifts, ritual sea-water bathing with a conch, Arjuna's northern
    tribute, repeated conch signals, and the attendance of many monarchs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sakuni, son of Suvala, approaches Dhritarashtra and reports that Duryodhana
    has become pale, emaciated, depressed, and anxious.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dhritarashtra asks Duryodhana the reason for his affliction and says wealth,
    apparel, food, horses, beds, women, mansions, and sports are at his command.
  category: speech
  evidence_refs:
