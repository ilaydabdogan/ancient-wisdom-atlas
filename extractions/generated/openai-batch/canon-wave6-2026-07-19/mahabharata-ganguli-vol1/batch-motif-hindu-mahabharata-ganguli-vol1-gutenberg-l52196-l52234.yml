canonical_text:
  quote: We few--the remnants,--O mighty-minded one, remain like seed.
  summary: Janamejaya asks what the Pandavas did in the forest after Duryodhana's
    deliverance. Vaisampayana recounts that Yudhishthira dreamed of surviving deer
    who begged him to change residence so they would not be exterminated. Moved by
    pity, Yudhishthira agreed, told his brothers, and the Pandavas departed from the
    Dwaita woods with their companions to Kamyaka forest near lake Trinavindu.
  language: English
  quote_policy: quoted
