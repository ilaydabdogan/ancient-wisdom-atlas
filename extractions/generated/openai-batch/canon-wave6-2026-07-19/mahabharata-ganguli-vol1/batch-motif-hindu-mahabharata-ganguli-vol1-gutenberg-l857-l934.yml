canonical_text:
  quote: Time createth all things and Time destroyeth all creatures.
  summary: A speaker comforts the grieving Dhritarashtra by listing many renowned
    former kings who died despite virtue, power, sacrifice, and fame. He teaches that
    fate and Time cannot be overcome. Sauti then reports that Dhritarashtra was pacified
    and that Dwaipayana composed a holy teaching. The passage praises study of the
    Bharata, names divine and semi-divine beings contained in it, and describes Vasudeva,
    cosmic generation, birth, death, re-birth, Adhyatma, Purusha, and contemplative
    inner vision.
  language: English
  quote_policy: quoted
