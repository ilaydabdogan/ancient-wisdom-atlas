canonical_text:
  quote: ''
  summary: 'Vaisampayana narrates that Yudhishthira asks Markandeya why Kuvalaswa
    of Ikshvaku''s race came to be called Dhundhumara. Markandeya begins the moral
    story: the Rishi Utanka performs severe austerities for Vishnu in a wilderness
    hermitage. Vishnu appears; Utanka praises him as creator, cosmic being, protector,
    and destroyer of Asuras. Vishnu offers a boon; Utanka asks only for virtue, truth,
    self-content, and devotion. Vishnu grants this, gives him yoga power, and foretells
    that Dhundhu, an Asura seeking to destroy the triple world, will be slain by the
    future Ikshvaku king Kuvalaswa, son of Vrihadaswa, empowered by Vishnu and urged
    by Utanka. Vishnu then disappears.'
  language: English
  quote_policy: summarized
