canonical_text:
  quote: ''
  summary: Parnada reports to Damayanti that he sought Nala at Ayodhya, received no
    reply from Rituparna, but was addressed by Vahuka, Rituparna's charioteer and
    cook, who spoke about the conduct of a chaste wife toward a ruined and absent
    husband. Damayanti privately asks her mother to keep Bhima uninformed, honors
    Parnada, and sends Sudeva to Rituparna with an announcement of an imminent second
    Swayamvara.
  language: English
  quote_policy: summarized
