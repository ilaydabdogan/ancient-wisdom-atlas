  text: Visrava was pleased with the women and granted boons, giving princely children
    according to their desires.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pushpotkata bore Ravana and Kumbhakarna; Malini bore Vibhishana; Raka bore
