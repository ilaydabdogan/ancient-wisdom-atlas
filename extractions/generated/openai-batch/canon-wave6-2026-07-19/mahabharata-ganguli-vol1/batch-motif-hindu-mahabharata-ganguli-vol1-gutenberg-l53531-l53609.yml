candidate_motifs:
- id: motif:1
  label: Austerity rewarded by divine boon
  taxonomy_refs:
  - sacred_exchange
  basis: Severe penances by Ravana, Kumbhakarna, and Vibhishana gratify Brahma, who
    appears and grants boons.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage frames this as ascetic practice and boon-granting; broader
    ritual or doctrinal meaning is not inferred.
- id: motif:2
  label: Self-sacrificial offering into sacred fire
  taxonomy_refs:
  - sacrifice
  basis: Ravana cuts off his own heads and offers them to the sacred fire, pleasing
    Brahma and leading to boon restoration.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The extraction is limited to the literal act of head-offering described
    in the passage.
- id: motif:3
  label: Invulnerability boon with overlooked human exception
  taxonomy_refs: []
  basis: Ravana requests safety from many classes of beings; Brahma grants protection
    from those named but excepts men, and Markandeya says Ravana slighted human beings.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No external outcome is used beyond the passage’s own statement of the
    exception.
- id: motif:4
  label: Shape-changing power granted by boon
  taxonomy_refs:
  - shapeshifter
  basis: Brahma grants Ravana the ability to assume any form according to desire.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage states the capacity but does not narrate Ravana using it here.
- id: motif:5
  label: Misdirected boon of long sleep
  taxonomy_refs: []
  basis: Kumbhakarna’s reason is said to be clouded by darkness, and he asks for long-lasting
    sleep, which Brahma grants.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The cause of the clouded reason is not explained in this passage.
- id: motif:6
  label: Righteousness and divine knowledge rewarded
  taxonomy_refs:
  - wisdom
  basis: Vibhishana asks not to swerve from righteousness and to receive divine knowledge;
    Brahma praises his inclination away from unrighteousness and grants immortality.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The wisdom motif is based on explicit divine knowledge language, not on
    a narrated teaching episode.
- id: motif:7
  label: Cursed celestial vehicle as sign of future defeat
  taxonomy_refs:
  - divine_judgment
  basis: After Ravana seizes Pushpaka, Vaisravana curses that the chariot will not
    carry Ravana but will carry the one who slays him, and says Ravana will soon die.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The curse is spoken by Vaisravana/Kuvera; the passage does not explicitly
    call it divine judgment.
- id: motif:8
  label: Forcible taking of a celestial object
  taxonomy_refs:
  - sacred_theft
  basis: Ravana forcibly takes the celestial chariot Pushpaka from Vaisravana after
    defeating him.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage says Ravana took the chariot forcibly, not secretly; the taxonomy
    reference is approximate.
- id: motif:9
  label: Jealous kin-rivalry leading to austerity and conquest
  taxonomy_refs: []
  basis: The siblings see Vaisravana’s wealth, become jealous, undertake penances,
    and Ravana later defeats Kuvera and takes Lanka.
  evidence_refs:
  - ev:4
  - ev:12
  confidence: medium
  cautions: The passage connects jealousy, penance, and later conquest, but does not
    fully analyze motive beyond jealousy.
