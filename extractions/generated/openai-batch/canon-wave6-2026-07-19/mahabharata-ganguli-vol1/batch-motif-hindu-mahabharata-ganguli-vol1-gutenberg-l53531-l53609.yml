canonical_text:
  quote: ''
  summary: Markandeya recounts how Visrava is served by Rakshasa women sent by Kuvera,
    grants them children, and becomes the father of Ravana, Kumbhakarna, Vibhishana,
    Khara, and Surpanakha. Seeing Kuvera’s wealth, the siblings undertake austerities.
    Ravana offers his heads into fire and receives boons from Brahma, including restored
    heads, power to assume forms, and immunity from many beings except men. Kumbhakarna
    receives long sleep, and Vibhishana receives steadfast righteousness, divine knowledge,
    and immortality. Ravana later defeats Kuvera, takes Lanka and the Pushpaka chariot,
    and is cursed by Kuvera.
  language: English
  quote_policy: summarized
