canonical_text:
  quote: ''
  summary: The passage recounts the paired deaths of Hansa and Dimvaka at the Yamuna
    after reports of one another's death, Jarasandha's grief and his daughter's appeal
    for vengeance, the Yadava flight from Mathura to a fortified western refuge, and
    the advice that a Kuru king cannot complete the Rajasuya sacrifice until Jarasandha
    is killed and the kings imprisoned for Jarasandha's intended sacrifice are released.
  language: English
  quote_policy: summarized
