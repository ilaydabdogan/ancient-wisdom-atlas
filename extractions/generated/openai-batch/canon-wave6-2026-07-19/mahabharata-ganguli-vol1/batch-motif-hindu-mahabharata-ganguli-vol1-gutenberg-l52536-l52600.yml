canonical_text:
  quote: ''
  summary: Janamejaya asks how Duryodhana and his allies dealt with the Pandavas while
    they lived in the woods, fed visitors from sun-obtained food, and associated with
    Munis. Vaisampayana narrates that Duryodhana served the irascible ascetic Durvasa
    until granted a boon, then asked Durvasa to visit Yudhishthira after the princess
    of Panchala had fed everyone and gone to rest. Durvasa agrees, and Duryodhana,
    Karna, and others rejoice over the anticipated danger to the sons of Pandu.
  language: English
  quote_policy: summarized
