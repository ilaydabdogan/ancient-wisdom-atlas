canonical_text:
  quote: ''
  summary: Arjuna attacks the Panchala forces, defeats Satyajit, captures Drupada,
    restrains further slaughter by Bhima, and delivers the captive king to Drona as
    the preceptor's fee. Drona spares Drupada, recalls their earlier relationship,
    divides the kingdom at the Bhagirathi, and asks for renewed friendship; Drupada
    accepts.
  language: English
  quote_policy: summarized
