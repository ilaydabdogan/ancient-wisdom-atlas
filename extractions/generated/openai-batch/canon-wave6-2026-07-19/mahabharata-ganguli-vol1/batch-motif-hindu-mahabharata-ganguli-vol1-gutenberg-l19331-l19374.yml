  quote: ''
  summary: Bhishma, asked by Dhritarashtra for counsel, rejects a quarrel with the
    Pandavas, argues that they have an equal ancestral claim to the kingdom, urges
    a treaty and division of half the land, warns Duryodhana about dishonor and loss
    of fame, and recalls the Pandavas' survival from the conflagration associated
    with Purochana.
