canonical_text:
  quote: Brahmana prowess is true prowess! In judging of strength and weakness, I
    see that asceticism is true strength.
  summary: The Gandharva recounts how Vasishtha's cow Nandini becomes wrathful, produces
    armed hosts from parts of her body, and routs Viswamitra's army without killing
    them. Viswamitra concludes that Brahmana and ascetic power exceed Kshatriya power,
    renounces royal life, practices asceticism, becomes a Brahmana, and drinks Soma
    with Indra in Heaven.
  language: English
  quote_policy: quoted
