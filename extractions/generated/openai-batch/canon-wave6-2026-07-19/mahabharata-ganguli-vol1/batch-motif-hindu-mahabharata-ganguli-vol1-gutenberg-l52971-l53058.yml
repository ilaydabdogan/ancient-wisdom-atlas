canonical_text:
  quote: Jayadratha hath carried away Krishna by force.
  summary: The Pandava brothers abandon a hunt after ominous animal signs, return
    to their hermitage, learn from Dhatreyika that Jayadratha has carried Draupadi
    away by force, and pursue him until they see Draupadi seated on his car among
    his forces.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The foremost bowmen wander separately, hunt deer and buffaloes, and later
    meet together in a great forest full of deer, wild beasts, birds, and wilderness
    cries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira observes birds and wild beasts flying toward the sunlit direction,
    crying dissonantly, and says this shows that hostile intruders have entered the
    forest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yudhishthira orders the chase to be abandoned and says his heart aches and
    burns; he compares the forest of Kamyaka to a lake without its snake, an emptied
    pot, and a kingdom deprived of king and prosperity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The brothers drive back toward their abode in swift chariots and see a jackal
    yelling hideously on the left side of the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yudhishthira interprets the left-side jackal as indicating that sinful Kurus
    have begun to oppress them by violence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the grove containing their hermitage, they find Dhatreyika, the maid of
    their beloved one, sobbing and weeping on the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Indrasena alights from the chariot, asks Dhatreyika why she weeps, and asks
    whether cruel people have harmed Draupadi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Indrasena says Draupadi is dear to the sons of Pandu as their own lives and
    says they will pursue her even into the earth, heaven, or ocean if necessary.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Dhatreyika says Jayadratha has carried Krishna away by force, and that his
    track remains visible because the broken branches have not yet faded.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dhatreyika urges the warriors to take up bows and quivers and follow quickly
    so that Draupadi is not overpowered by threats or violence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Dhatreyika uses repeated images of misused sacred or precious things, including
    a sanctified oblation poured on ashes, clarified butter put into an unigniting
    fire, Soma licked by a dog, a lily torn by a jackal, and clarified butter licked
    from a sacrificial pot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Yudhishthira tells Dhatreyika to retire, control her tongue, and not speak
    that way before them; he adds that kings or princes infatuated with power are
    sure to come to grief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Pandavas follow the track, breathe deep sighs like hissing snakes, and
    twang the strings of their large bows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: They see dust raised by the hoofs of Jayadratha's steeds and see Dhaumya among
    the ravisher's infantry, exhorting Bhima to quicken his steps.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The princes rush toward the host like hawks swooping on prey; at the sight
    of Jayadratha and Draupadi seated on his car, they call out for Jayadratha to
    stop, and the enemy becomes bewildered.
  category: sequence
  evidence_refs:
  - ev:6
