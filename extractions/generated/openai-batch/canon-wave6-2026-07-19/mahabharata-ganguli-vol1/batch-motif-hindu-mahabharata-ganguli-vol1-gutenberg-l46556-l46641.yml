canonical_text:
  quote: ''
  summary: 'Markandeya describes Kalki exterminating thieves and robbers, performing
    a great Horse-sacrifice, giving the earth to Brahmanas, restoring rectitude, and
    entering a forest. The passage then describes the renewed Krita age: religious
    sites and sacrifices reappear, truth and ascetic practice flourish, crops grow
    in every season, and social orders resume their duties. Markandeya summarizes
    the courses of the yugas, attributes the account to a Purana associated with Vayu,
    warns Yudhishthira against humiliating Brahmanas, and gives Yudhishthira counsel
    on virtuous rule, humility, truth, charity, and endurance under Time. Yudhishthira
    promises to follow the instruction.'
  language: English
  quote_policy: summarized
