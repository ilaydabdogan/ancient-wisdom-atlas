canonical_text:
  quote: ''
  summary: Sakuni proposes to seize Yudhishthira's prosperity through dice. Duryodhana
    urges Dhritarashtra to allow the plan and to build an assembly house. Dhritarashtra
    initially invokes Vidura's counsel and warns that hostility against strong rivals
    will bring war and future repentance, but he yields under the pressure of his
    son and fate. He orders a splendid crystal-arched palace constructed, then sends
    Vidura to summon Yudhishthira and his brothers for a friendly dice match.
  language: English
