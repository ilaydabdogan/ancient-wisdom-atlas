canonical_text:
  quote: ''
  summary: In a grieving Brahmana household threatened by a human-eating Rakshasa,
    the daughter urges her father to abandon her instead, arguing that her sacrifice
    can save her parents, brother, family line, and ancestors. The parents and daughter
    weep together. The young son cheerfully says he will kill the Rakshasa with a
    blade of grass. Kunti then approaches and speaks, reviving their spirits.
  language: English
  quote_policy: summarized
