canonical_text:
  quote: Fate alone must be our refuge in this.
  summary: Elapatra tells the snakes that Janamejaya's sacrifice cannot be prevented
    by ordinary means and that the fear has its root in fate. He recounts how the
    gods questioned Brahman about Kadru's curse on the snakes. Brahman explains that
    harmful serpents will be destroyed, while harmless and virtuous ones may escape
    through the future birth of Astika, son of the Rishi Jaratkaru and Vasuki's sister
    Jaratkaru. Elapatra advises Vasuki to give his sister as a bride to the Rishi
    in order to relieve the snakes from fear.
  language: English
  quote_policy: quoted
