canonical_text:
  quote: ''
  summary: Sahadeva defends the worship and Arghya offered to Krishna, challenges
    any dissenting king, and receives silent acquiescence from the assembled monarchs
    along with a shower of flowers and an incorporeal approval. Narada declares that
    those who will not worship Krishna should be treated as dead though moving. After
    Sahadeva completes the ceremony, Sisupala/Sunitha angrily urges the kings to oppose
    the Vrishnis and Pandavas and to obstruct Yudhishthira's sacrifice; the angered
    kings prepare for conflict while Krishna perceives their movement.
  language: English
  quote_policy: summarized
