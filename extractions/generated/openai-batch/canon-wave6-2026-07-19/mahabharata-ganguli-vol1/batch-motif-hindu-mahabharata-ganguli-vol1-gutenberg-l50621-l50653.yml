  quote: ''
  summary: The speaker tells Satyabhama that she knew and managed the royal household,
    attendants, income, expenditure, food obligations, and treasury of Yudhishthira
    and the Pandavas. She says she endured hunger and thirst, served the Kuru princes,
    rose first and slept last, and that this conduct—not wicked charms—was her means
    of making her husbands obedient. Satyabhama reverences her and asks forgiveness,
    saying their conversation arose in jest among friends.
