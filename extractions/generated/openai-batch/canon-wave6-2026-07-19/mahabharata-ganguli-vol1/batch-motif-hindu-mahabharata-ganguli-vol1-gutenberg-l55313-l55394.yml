canonical_text:
  quote: |-
    The death can fall but once;
    a daughter can be given away but one
  summary: Markandeya narrates Savitri’s return from visiting sacred regions. In Aswapati’s
    court, Narada asks about her marriage. Savitri reports that she has chosen Satyavan,
    son of the blind and dispossessed king Dyumatsena, who now lives ascetically in
    the forest. Narada praises Satyavan’s virtues but foretells that he will die within
    a year. Aswapati urges Savitri to choose another husband, but she refuses, declaring
    her choice irrevocable. Narada approves the bestowal, departs to heaven, and Aswapati
    begins wedding preparations.
  language: English
  quote_policy: quoted
