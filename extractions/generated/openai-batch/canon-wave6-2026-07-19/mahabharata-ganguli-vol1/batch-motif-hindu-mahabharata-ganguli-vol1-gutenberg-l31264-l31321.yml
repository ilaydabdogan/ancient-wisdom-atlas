canonical_text:
  quote: "“a union of the Brahmana and Kshatriya customs”"
  summary: In the Dwaita woods, Brahmanas gather around Yudhishthira; Vedic recitation
    and the Pandavas’ bows are described as harmoniously joined. At evening homa time,
    Rishi Vaka counsels Yudhishthira that Brahmana spiritual power and Kshatriya might
    must combine for royal strength, counsel, prosperity, and sovereignty. He cites
    King Vali as an example of success through Brahmanas and destruction after wronging
    them. The Brahmanas then honor Vaka and Yudhishthira.
  language: English
  quote_policy: quoted
