canonical_text:
  quote: ''
  summary: Damayanti witnesses a vanished ascetic hermitage, laments to an Asoka tree
    for relief from grief and news of Nala, wanders through a dangerous forest, and
    encounters a merchant caravan. The caravan fears she may be supernatural, but
    she identifies herself as a human royal woman seeking her husband. The caravan
    leader Suchi says he has not seen Nala and states the caravan is bound for the
    Chedi city of Suvahu.
  language: English
  quote_policy: summarized
