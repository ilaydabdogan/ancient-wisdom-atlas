  summary: Vaisampayana narrates that Vyasa imparts a foremost science to purified
    Yudhishthira, bids him farewell, and disappears. Yudhishthira retains and recites
    the knowledge, then moves from Dwaitavana to Kamyaka on the Saraswati. Brahmanas
    follow him; the Bharata heroes reside there, practice archery, hear Vedic chanting,
    hunt deer, and perform rites for the Pitris, celestials, and Brahmanas.
