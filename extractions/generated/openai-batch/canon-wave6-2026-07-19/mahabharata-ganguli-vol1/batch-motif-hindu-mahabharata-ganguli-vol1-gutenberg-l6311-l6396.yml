canonical_text:
  quote: ''
  summary: 'King Vasu, separated from his wife Girika during her fertile season, sends
    his semen to her by a hawk. A second hawk attacks, and the semen falls into the
    Yamuna, where Adrika, an Apsara transformed by a curse into a fish, swallows it.
    Fishermen later catch the fish, and male and female human twins emerge from its
    stomach. The male is taken by Uparichara and becomes Matsya; the female is given
    to fishermen and becomes Satyavati. Adrika is released from her fish form and
    ascends in celestial shape. Satyavati, who smells of fish and ferries a boat on
    the Yamuna, is later approached by the sage Parasara. To conceal them he creates
    a fog, and after Satyavati raises concerns about visibility, her father, and her
    virginity, he promises that she will remain a virgin and grants her chosen boon:
    a sweet bodily scent in place of the fish odor.'
  language: English
  quote_policy: summarized
