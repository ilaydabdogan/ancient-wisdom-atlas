  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ayoda-Dhaumya has three disciples named Upamanyu, Aruni, and Veda, and orders
    Aruni of Panchala to stop a breach in a field's water-course.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Aruni cannot stop the breach by ordinary means, enters the breach himself,
