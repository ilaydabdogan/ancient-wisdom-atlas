- id: obs:1
  text: Janamejaya, son of Parikshit, attends a long sacrifice on the plains of Kurukshetra
    with his three brothers, Srutasena, Ugrasena, and Bhimasena.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: An offspring of Sarama arrives at the sacrifice, is beaten by Janamejaya's
    brothers, and runs to his mother crying in pain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The offspring tells Sarama that he has committed no fault, has not touched
    the sacrificial butter with his tongue, and has not even looked at it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sarama goes to Janamejaya's sacrifice, says her son is faultless, and declares
    that evil will come upon them when least expected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Janamejaya becomes alarmed and dejected, returns to Hastinapura after the
    sacrifice, and searches for a Purohita to obtain absolution and neutralize the
    curse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: While hunting, Janamejaya finds the hermitage of the Rishi Srutasrava and
    asks to appoint Srutasrava's son Somasrava as his Purohita.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Srutasrava says Somasrava is devoted to ascetic practice, learned in the Vedas,
    born from the womb of a she-snake that drank Srutasrava's vital fluid, and able
    to absolve offences except those committed against Mahadeva.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Srutasrava states that Somasrava habitually grants whatever any Brahmana asks
    of him; Janamejaya accepts this condition and appoints him Purohita.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Janamejaya instructs his brothers to comply without examination with whatever
