canonical_text:
  quote: ''
  summary: At Janamejaya's sacrifice, his brothers beat the innocent offspring of
    Sarama, who curses them. Janamejaya seeks a Purohita able to neutralize the curse
    and appoints the serpent-born Somasrava. The passage then tells of Ayoda-Dhaumya's
    disciple Aruni, who obeys his teacher by lying in a breach of a water-course until
    called out, after which he is renamed Uddalaka and blessed with sacred learning.
  language: English
  quote_policy: summarized
