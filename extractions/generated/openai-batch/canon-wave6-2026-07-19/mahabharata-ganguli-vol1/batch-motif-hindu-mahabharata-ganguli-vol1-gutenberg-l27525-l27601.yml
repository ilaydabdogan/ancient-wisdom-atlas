canonical_text:
  quote: ''
  summary: Duryodhana orders the Suta messenger Pratikamin to bring Draupadi to the
    assembly after Yudhishthira has lost her in dice. Draupadi challenges the validity
    of the wager by asking whether Yudhishthira lost himself before losing her. The
    assembly and Yudhishthira fail to answer. Draupadi appeals to morality and to
    the elders, while Duryodhana renews the command to bring her before the Kauravas.
  language: English
  quote_policy: summarized
