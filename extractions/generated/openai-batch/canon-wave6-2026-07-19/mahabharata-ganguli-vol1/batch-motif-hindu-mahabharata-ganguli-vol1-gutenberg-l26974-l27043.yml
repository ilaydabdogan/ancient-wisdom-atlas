canonical_text:
  quote: ''
  summary: In a royal assembly, the sons of Pritha enter with Yudhishthira, honor
    the assembled kings, and sit. Sakuni urges Yudhishthira to begin a dice game.
    Yudhishthira repeatedly objects that deceitful gambling is sinful and contrary
    to honorable conduct, citing Devala and contrasting such play with open battle.
    Sakuni argues that all contests seek victory and presses him to play. Yudhishthira
    says that when summoned he does not withdraw and invokes Fate and Destiny. Duryodhana
    offers to provide the stakes while Sakuni plays for him; Yudhishthira objects
    that proxy gambling is contrary to rule but lets the game begin.
  language: English
  quote_policy: summarized
