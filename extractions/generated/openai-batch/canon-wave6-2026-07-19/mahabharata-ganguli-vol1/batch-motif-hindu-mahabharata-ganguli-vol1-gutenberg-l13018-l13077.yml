canonical_text:
  quote: ''
  summary: Duryodhana secretly poisons food and feeds it to Bhima during a princely
    outing. After water sport, Bhima loses consciousness; Duryodhana binds him with
    shrub-cords and throws him into the water. Bhima sinks to the Naga kingdom, where
    serpent bites neutralize the earlier poison. He revives, breaks his bonds, and
    is recognized through serpent kinship. Vasuki and Aryaka arrange for him to drink
    nectar-vessels that grant immense strength.
  language: English
  quote_policy: summarized
