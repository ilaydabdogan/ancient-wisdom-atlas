canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Krishna asks Jarasandha which of three opponents
    he wishes to fight. Jarasandha chooses Bhima. Priestly preparations, auspicious
    articles, medicines, and benedictions accompany Jarasandha’s battle readiness.
    Jarasandha removes his crown, binds his hair, and enters a prolonged bare-handed
    wrestling duel with Bhima. The struggle is watched by a dense public crowd, described
    with thunder, animal, and mythic-combat similes. The fight continues day and night
    without food from the first lunar day of Kartic until the thirteenth day; on the
    fourteenth night Jarasandha tires, and Krishna advises Bhima not to press a fatigued
    foe. The supplied passage ends mid-sentence.
  language: English
  quote_policy: summarized
