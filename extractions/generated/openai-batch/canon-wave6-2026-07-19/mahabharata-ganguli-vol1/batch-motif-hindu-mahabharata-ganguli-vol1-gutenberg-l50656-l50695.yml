canonical_text:
  quote: ''
  summary: 'Draupadi instructs Satyabhama in a deceit-free way to attract and retain
    her husband''s affection: treat the husband as unequalled, serve him attentively
    with offerings and hospitality, keep his words confidential, favor his friends,
    avoid hostile or deceitful persons, maintain modest restraint, associate with
    virtuous women, and worship him while adorned with garlands, ornaments, unguents,
    and perfumes. Such conduct is described as reputable, prosperous, and leading
    to heaven.'
  language: English
  quote_policy: summarized
