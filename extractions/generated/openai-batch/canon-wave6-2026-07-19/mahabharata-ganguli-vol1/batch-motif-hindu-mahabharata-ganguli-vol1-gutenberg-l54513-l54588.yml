canonical_text:
  quote: ''
  summary: 'Markandeya narrates preparations and combat at Lanka: Rama''s forces camp
    outside the city while Ravana fortifies it; Angada enters Lanka as Rama''s envoy
    and demands Sita''s release; Ravana''s servants seize Angada, who escapes by leaping
    away; Rama''s monkey and bear forces breach and assault Lanka, causing the Rakshasa
    defenders to flee.'
  language: English
  quote_policy: summarized
