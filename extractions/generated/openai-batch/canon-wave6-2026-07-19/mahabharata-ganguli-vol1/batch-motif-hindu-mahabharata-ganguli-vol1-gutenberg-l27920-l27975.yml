canonical_text:
  quote: ''
  summary: Draupadi, dragged into the Kuru assembly by Dussasana, asks to salute the
    seniors, laments her public exposure, reproaches the Kauravas and Pandavas, and
    asks whether she is won or unwon. Bhishma answers that morality is subtle, says
    the Kurus are enslaved by covetousness and folly and near destruction, praises
    Draupadi's concern for virtue, notes the elders' silence, and says Yudhishthira
    should decide.
  language: English
  quote_policy: summarized
