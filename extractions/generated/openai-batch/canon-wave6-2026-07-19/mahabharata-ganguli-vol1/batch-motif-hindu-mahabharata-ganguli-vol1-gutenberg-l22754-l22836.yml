  quote: Such, O monarch, is the Sabha, of the illustrious king of the Pitris!
  summary: 'Narada describes to Yudhisthira the assembly house of Yama, built by Viswakarma:
    a vast, radiant, desire-fulfilling mansion without grief, hunger, thirst, or evil
    feeling, attended by royal sages, Brahmana sages, ancestors, ascetics, celestial
    performers, Yama''s officers, and many virtuous beings.'
