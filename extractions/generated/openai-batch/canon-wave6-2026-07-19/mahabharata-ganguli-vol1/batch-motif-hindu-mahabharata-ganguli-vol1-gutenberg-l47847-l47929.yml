canonical_text:
  quote: ''
  summary: Markandeya narrates that Vrihadaswa commissions his son Kuvalaswa to carry
    out Utanka's request and retires to the forest. Yudhishthira asks about a mighty
    Daitya. Markandeya then describes a cosmic dissolution in which the world becomes
    water, Vishnu sleeps on Sesha, a lotus arises from Vishnu's navel and produces
    Brahma, Madhu and Kaitabha alarm Brahma, Vishnu negotiates a boon by which they
    agree to be slain, and he kills them on his uncovered thighs with a discus.
  language: English
  quote_policy: summarized
