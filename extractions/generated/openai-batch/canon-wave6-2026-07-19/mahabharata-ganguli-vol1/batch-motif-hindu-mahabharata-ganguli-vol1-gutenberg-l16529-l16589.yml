canonical_text:
  quote: ''
  summary: King Drupada arranges a sacrifice to obtain a son who will slay Drona.
    The priest Yaja pours a sanctified libation into the fire, and a fully armed male
    child emerges, followed by a daughter from the sacrificial platform. Disembodied
    voices prophesy that the son will destroy Drona and that the daughter will cause
    the destruction of many Kshatriyas and bring danger to the Kauravas. The queen
    asks that the children know only her as mother. Brahmanas name the son Dhrishtadyumna
    and the daughter Krishna. Later Drona teaches the Panchala prince all weapons,
    treating destiny as inevitable.
  language: English
  quote_policy: summarized
