canonical_text:
  quote: Thou must ascend to heaven.
  summary: After Varuna and Yama have given celestial weapons, Kuvera praises Arjuna,
    grants him celestial vision, and gives him the weapon Antarddhana. Arjuna receives
    it. The chief of the celestials then declares Arjuna an ancient god, says he must
    fulfill divine purposes, and announces that a celestial car with Matali will take
    him to heaven for further weapons. Arjuna worships the assembled world-protectors
    on Himavat with words, water, and fruits; the gods depart, and Arjuna is pleased
    and considers his aims fulfilled.
  language: English
  quote_policy: quoted
