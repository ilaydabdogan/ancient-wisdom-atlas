canonical_text:
  quote: ''
  summary: Agni, called Hutasana or Pavaka, summons Varuna and asks for the Gandiva
    bow, inexhaustible quivers, an ape-bannered car, and weapons so Arjuna and Krishna
    can help him. Varuna gives the celestial bow, quivers, chariot, and Krishna's
    mace; Agni gives Krishna a returning fiery discus. Arjuna mounts the chariot,
    strings Gandiva, and he and Krishna declare themselves ready to oppose even gods
    and Asuras. Agni then surrounds Khandava forest with seven flames and begins consuming
    it in an all-consuming form compared to the end of a Yuga.
  language: English
  quote_policy: summarized
