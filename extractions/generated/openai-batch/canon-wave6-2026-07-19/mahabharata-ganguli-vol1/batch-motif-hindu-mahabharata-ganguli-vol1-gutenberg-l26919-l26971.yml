canonical_text:
  quote: ''
  summary: Yudhishthira orders preparations for a journey to the Kuru capital after
    speaking with Vidura. He departs with his brothers, relatives, attendants, and
    the household women including Draupadi, while the narration frames the departure
    as compelled by Fate, Providence, and Kala. At Hastinapura he greets Dhritarashtra,
    Gandhari, elders, kings, and Kurus; the Pandavas are lodged in jeweled chambers.
    Dhritarashtra's household women visit, and some become jealous of Draupadi's beauty
    and prosperity. The Pandavas perform rites, receive benedictions through gifts
    to Brahmanas, spend the night in music and pleasure, and at dawn enter the assembly
    house where people are ready for gambling.
  language: English
  quote_policy: summarized
