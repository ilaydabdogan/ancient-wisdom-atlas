  quote: ''
  summary: The passage gives a pilgrimage itinerary through multiple tirthas and sacred
    regions. It describes acts such as circumambulation, oblations, bathing, fasting,
    residence, worship, and Sraddha, and states the merits or destinations obtained
    from them. Sannihati is described as a place where all other tirthas and waters
    unite, and Kurukshetra is described as beneficial across the three worlds and
    as a sacrificial altar of divine beings.
