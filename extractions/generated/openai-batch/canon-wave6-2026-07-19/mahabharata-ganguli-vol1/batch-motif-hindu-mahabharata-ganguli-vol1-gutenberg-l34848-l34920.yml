canonical_text:
  quote: Damayanti of faultless limbs proceeded with that caravan itself anxious to
    behold her lord.
  summary: Damayanti travels with a caravan through a dense forest. The caravan halts
    beside a lotus lake. At midnight, wild elephants attack the sleeping caravan,
    killing people and animals. Survivors interpret the disaster as the result of
    failed worship, adverse omens, or the presence of Damayanti, whom some accuse
    of being a dangerous supernatural female. Hearing this, Damayanti flees into the
    woods and laments that the calamities may be consequences of sins from a former
    life.
  language: English
  quote_policy: quoted
