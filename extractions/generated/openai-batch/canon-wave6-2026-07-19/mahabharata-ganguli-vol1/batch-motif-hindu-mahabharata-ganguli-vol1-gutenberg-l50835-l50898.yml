canonical_text:
  quote: ''
  summary: A fragment praises the Gandiva bow and celestial weapons. Sakuni, after
    hearing Dhritarashtra, privately reports to Duryodhana and Karna, then with Karna
    encourages Duryodhana to enjoy rule over the earth, describing royal Prosperity
    as taken from Yudhishthira and the Pandavas. The speech proposes that Duryodhana
    visit the exiled Pandavas at Dwaitavana in full prosperity so that they, including
    Dhananjaya and Krishna daughter of Drupada, will suffer by contrast with his wealth
    and his wife's ornaments.
  language: English
  quote_policy: summarized
