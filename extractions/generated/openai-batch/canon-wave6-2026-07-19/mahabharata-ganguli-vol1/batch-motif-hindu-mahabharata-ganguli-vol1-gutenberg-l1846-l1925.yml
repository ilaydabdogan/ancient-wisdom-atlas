canonical_text:
  quote: '"Here I am at the bottom of a well."'
  summary: Ayoda-Dhaumya orders his disciple Upamanyu to tend cattle and repeatedly
    forbids him to support himself by alms, second begging, cow's milk, or calf-froth.
    Hungry in the forest, Upamanyu eats Arka leaves, becomes blind, and falls into
    a well. Dhaumya searches for him, learns what happened, and instructs him to praise
    the twin Aswins, divine physicians, for restoration of sight; Upamanyu begins
    a Rig Vedic hymn to them.
  language: English
  quote_policy: quoted
