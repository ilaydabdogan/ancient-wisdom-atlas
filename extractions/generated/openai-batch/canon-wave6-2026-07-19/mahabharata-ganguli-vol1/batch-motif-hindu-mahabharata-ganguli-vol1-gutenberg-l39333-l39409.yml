canonical_text:
  quote: ''
  summary: Lomasa narrates how an unnamed woman, acting for a king, prepares a floating
    hermitage and sends her courtesan daughter to approach Rishyasringa. The courtesan
    greets the ascetic, redirects ritual hospitality into physical embrace, gives
    him attractive foods, garlands, garments, and drinks, plays and touches him, then
    leaves under a ritual pretext. Rishyasringa becomes lovesick and distressed; his
    father Vibhandaka arrives and questions him about neglected ascetic and sacrificial
    duties and about who visited.
  language: English
  quote_policy: summarized
