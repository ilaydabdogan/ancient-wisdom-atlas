canonical_text:
  quote: ''
  summary: At the opening of Sabha Parva, Vaisampayana narrates that Maya Danava,
    saved by Arjuna from Krishna and Pavaka, asks how he may repay Arjuna. Arjuna
    declines personal reward and asks that Maya do something for Krishna. Krishna
    commissions Maya to build an unparalleled meeting hall for Yudhishthira, combining
    godly, asuric, and human designs. Maya is received by Yudhishthira and, after
    rites and gifts to Brahmanas, measures out an auspicious plot for the palace.
  language: English
  quote_policy: summarized
