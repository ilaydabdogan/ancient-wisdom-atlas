canonical_text:
  quote: ''
  summary: Bhimasena, feeling censured by Draupadi, arms himself and climbs a dangerous
    mountain path to Vaisravana's splendid gem-adorned abode. He sounds a shell and
    challenges the beings there. Yakshas and Rakshasas attack, but Bhima cuts down
    their weapons and bodies until many flee. Maniman, a Rakshasa friend of Vaisravana,
    rebukes the fugitives and engages Bhima; the duel begins and Bhima is wounded
    in the right arm by a flaming iron club before taking up his mace.
  language: English
  quote_policy: summarized
