canonical_text:
  quote: ''
  summary: In a royal council, Drona advises Dhritarashtra to give the Pandavas a
    share of the kingdom, send gifts and conciliatory messages to Drupada and his
    family, bring the Pandavas back to Hastinapura, and install them on their paternal
    throne. Karna objects, accusing Bhishma and Drona of bad counsel and arguing that
    destiny determines sovereignty, illustrated by an old story about King Amvuvicha
    and his minister Mahakarni. Drona replies that Karna speaks from wicked intent
    and warns that the Kurus may be exterminated if his advice is not followed.
  language: English
  quote_policy: summarized
