canonical_text:
  quote: ''
  summary: Rama grieves by the lake Pampa over Sita's abduction. Lakshmana urges him
    to act and approach Sugriva. Rama and Lakshmana perform water rites, meet Hanuman
    and Sugriva at Rishyamuka, and form an alliance. Sugriva shows a cloth dropped
    by Sita, and Rama installs him as sovereign and promises to kill Vali. At Kiskindhya,
    Sugriva challenges Vali. Tara warns Vali that Sugriva has gained Rama's support,
    but Vali ignores her and fights Sugriva. Because the brothers look alike in combat,
    Hanuman marks Sugriva with a flower garland. Rama recognizes Sugriva and shoots
    Vali, who falls; Tara sees Vali prostrate, and Sugriva regains Kishkindhya and
    Tara as the passage breaks off.
  language: English
  quote_policy: summarized
