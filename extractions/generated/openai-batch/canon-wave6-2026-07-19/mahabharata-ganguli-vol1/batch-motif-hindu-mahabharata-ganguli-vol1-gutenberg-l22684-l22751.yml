canonical_text:
  quote: ''
  summary: 'Narada describes Sakra/Indra''s celestial assembly house: its luminosity,
    dimensions, beneficent qualities, ornaments, trees, and name. Indra sits there
    with Sachi while gods, Marutas, rishis, ritual powers, natural forces, Apsaras,
    Gandharvas, and other visitors attend, worship, and entertain him. Narada closes
    by identifying the hall as Pushkaramalini and turning toward Yama''s assembly
    house.'
