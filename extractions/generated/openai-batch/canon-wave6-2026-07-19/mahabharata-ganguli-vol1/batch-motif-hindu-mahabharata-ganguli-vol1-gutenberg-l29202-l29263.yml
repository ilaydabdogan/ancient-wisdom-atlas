canonical_text:
  quote: ''
  summary: A speaker counsels Yudhishthira against coveting wealth and desiring worldly
    possessions. Yudhishthira replies that he seeks wealth only to support Brahmanas
    and dependents, then describes household duties of feeding renouncers, guests,
    dependents, gods, pitris, dogs, Chandalas, and birds. He presents guest-feeding
    as equivalent to sacrifice and as producing merit. Saunaka answers with a critique
    of actions driven by ignorance, passion, senses, and desire, describing desire
    as leading to temptation and repeated births through a circle of existences.
  language: English
  quote_policy: summarized
