canonical_text:
  quote: Lo, I have won!
  summary: In a dice game, Yudhishthira accuses Sakuni of winning unfairly but continues
    to wager. He successively stakes treasury wealth, a royal car, serving women,
    serving men, elephants, chariots, horses, warriors, vehicles, and valuable jewels.
    After each stake, Sakuni, described as using unfair or foul means, declares that
    he has won.
  language: English
  quote_policy: quoted
