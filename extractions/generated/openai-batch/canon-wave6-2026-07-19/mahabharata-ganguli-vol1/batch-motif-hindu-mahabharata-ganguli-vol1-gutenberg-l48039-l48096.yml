  quote: By serving their husbands only they can win heaven.
  summary: Vaisampayana narrates that Yudhisthira asks Markandeya to explain difficult
    moral duties, especially the virtue of chaste wives, filial duties toward parents,
    and the moral difficulty of Kshatriya obligations involving cruelty. Markandeya
    begins an answer by discussing the difficulty borne by mothers and fathers in
    obtaining, bearing, rearing, and hoping for children, the virtue of sons who fulfill
    parental hopes, and the claim that women win heaven through service to their husbands.
  language: English
