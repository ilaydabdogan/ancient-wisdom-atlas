canonical_text:
  quote: ''
  summary: At Draupadi's swayamvara, proud armed princes gather to win her. Celestial
    and semi-divine beings attend, and Krishna recognizes the five Pandavas. Many
    kings fail to string the stiff bow. Karna strings it, but Draupadi refuses to
    choose a Suta as husband, and he throws the bow aside. Sisupala, Jarasandha, and
    Salya also fail, after which Arjuna desires to string the bow and places arrows
    on the string.
  language: English
  quote_policy: summarized
