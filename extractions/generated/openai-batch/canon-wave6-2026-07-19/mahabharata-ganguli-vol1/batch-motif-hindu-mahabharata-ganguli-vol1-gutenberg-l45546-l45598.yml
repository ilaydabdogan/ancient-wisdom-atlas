canonical_text:
  quote: Death, O lords of men, hath no power over us!
  summary: The sons of Pandu ask Markandeya to describe the greatness of Brahmanas.
    Markandeya tells of a Haihaya prince who, while hunting, mistakes a Muni for a
    deer and kills him. The prince and Haihaya chiefs confess the killing at a hermitage.
    The body later disappears, and Muni Tarkshya presents the Brahmana alive as his
    son. Tarkshya explains that death has no power over them because of sacred duty,
    reverence for Brahmanas, hospitality, austerity, charity, forbearance, and residence
    in sacred places.
  language: English
  quote_policy: quoted
