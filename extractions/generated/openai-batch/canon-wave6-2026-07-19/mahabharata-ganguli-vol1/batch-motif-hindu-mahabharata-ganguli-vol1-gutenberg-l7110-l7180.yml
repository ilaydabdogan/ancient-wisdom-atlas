candidate_motifs:
- id: motif:1
  label: Human heroes as divine or celestial portions
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Multiple human figures are explicitly identified as portions of deities or
    celestials, including the Pandavas, Dhrishtadyumna, and Draupadi's sons.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage uses the language of 'portion' and incarnation; it does not
    narrate each birth episode in detail.
- id: motif:2
  label: Celestial father grants beloved son for a limited earthly mission
  taxonomy_refs:
  - divine_parent_child
  - sacred_exchange
  basis: Soma declares he cannot part with his son, but makes a compact allowing Varchas
    to go to earth for a limited term to aid celestial purposes.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The exchange is framed as a compact in Soma's speech; specific reciprocal
    compensation is not stated.
- id: motif:3
  label: Temporary descent to earth followed by return to celestial parent
  taxonomy_refs:
  - departure
  - return
  basis: Varchas is allowed to go to earth, stay sixteen years as Abhimanyu, and then
    reappear before Soma after the foretold battle.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage implies a return after battle but does not describe the mechanics
    of death or transition.
- id: motif:4
  label: Young warrior penetrates impenetrable battle array
  taxonomy_refs:
  - hero_descent
  basis: Soma foretells that Abhimanyu, a boy and mighty car-warrior, will enter the
    impenetrable Chakra-vyuha and fight within it fearlessly.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage describes martial penetration
    of an array, not an underworld descent.
- id: motif:5
  label: Continuation of an almost extinct royal lineage by a heroic son
  taxonomy_refs:
  - royal_legitimacy
  basis: Soma says Abhimanyu will beget a heroic son who will continue the almost
    extinct Bharata race.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The son is unnamed in this passage.
- id: motif:6
  label: Fire deity's portion embodied as warrior
  taxonomy_refs:
  - sacred_birth
  basis: Dhrishtadyumna is identified as a mighty car-warrior and a portion of Agni.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage provides identification only, not the full birth narrative.
- id: motif:7
  label: Formerly female figure identified with nonhuman incarnation
  taxonomy_refs:
  - shapeshifter
  basis: Sikhandin is said to have been at first female and to be the incarnation
    of a Rakshasa.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: The passage does not narrate a transformation process; the shapeshifter
    taxonomy is only loosely applicable.
