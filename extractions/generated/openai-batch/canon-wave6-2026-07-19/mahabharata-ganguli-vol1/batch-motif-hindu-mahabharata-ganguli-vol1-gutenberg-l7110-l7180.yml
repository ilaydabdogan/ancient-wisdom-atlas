canonical_text:
  quote: ''
  summary: Vaisampayana recites the names and qualities of Dhritarashtra's sons and
    daughter, notes Duhsala's marriage, and describes several epic heroes as portions
    or incarnations of deities and celestial beings. Soma negotiates a compact for
    his son Varchas to be born as Abhimanyu for a limited earthly span, to fight in
    the Chakra-vyuha battle, return to Soma, and leave a son to continue the Bharata
    line. The passage also identifies Dhrishtadyumna, Sikhandin, and Draupadi's sons
    with divine or nonhuman sources.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaisampayana recites a long sequence of names identified as the hundred sons
    of Dhritarashtra, along with a daughter named Duhsala and Yuyutsu, who was born
    to a Vaisya wife and was over and above the hundred.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listed sons are described as heroes, great car-warriors, skilled in warfare,
    versed in the Vedas and scriptures, mighty in attack and defence, learned, and
    married to suitable wives.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kaurava monarch gives Duhsala in marriage to Jayadratha, king of the Sindhus,
    in accordance with Sakuni's counsel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yudhishthira is identified as a portion of Dharma; Bhimasena as of the deity
    of wind; Arjuna as of Indra; and Nakula and Sahadeva as portions of the twin Aswins.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Varchas, the son of Soma, becomes Abhimanyu, the son of Arjuna.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Soma says he cannot part with his son, but establishes a compact that Varchas
    may go to earth without remaining there long, because the destruction of Asuras
    on earth is the work of the celestials.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Soma states that Varchas will become a mighty car-warrior in boyhood and remain
    on earth for sixteen years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Soma says that in Varchas's sixteenth year a battle will occur in which those
    born of celestial portions will destroy mighty warriors.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Soma describes a battle encounter without Nara and Narayana, in which the
    celestial portions form the disposition of forces known as the Chakra-vyuha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Soma says his son will penetrate the impenetrable array, fight fearlessly
    within it, send a fourth part of the hostile force to the regions of the king
    of the dead, and then reappear before Soma near the close of the day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Soma says his son will beget one heroic son who will continue the almost extinct
    Bharata race.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The dwellers in heaven accept Soma's words, then applaud and worship Soma,
    the king of stars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Dhrishtadyumna is identified as a portion of Agni; Sikhandin, who was at first
    female, is identified as an incarnation of a Rakshasa; and Draupadi's sons are
    identified with the celestial Viswas.
  category: relationship
  evidence_refs:
  - ev:6
