canonical_text:
  quote: This race is doomed
  summary: After the Pandavas have gone to the forest, Dhritarashtra asks Vidura what
    should be done. Vidura advises that rule rests on virtue, urges restitution to
    the Pandavas and the setting aside of Duryodhana, and warns of destruction if
    the counsel is ignored. Dhritarashtra rejects the counsel as hostile to him and
    refuses to abandon his own son. Vidura declares the race doomed and leaves for
    the sons of Pritha.
  language: English
  quote_policy: quoted
