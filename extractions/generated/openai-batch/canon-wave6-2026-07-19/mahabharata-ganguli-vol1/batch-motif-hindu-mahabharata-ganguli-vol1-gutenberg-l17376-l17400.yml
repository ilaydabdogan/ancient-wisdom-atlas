canonical_text:
  quote: ''
  summary: A king possessed by a Rakshasa responds to Saktri's curse by killing and
    eating him. Viswamitra urges the Rakshasa against Vasishtha's other sons, who
    are also devoured. Vasishtha bears his grief, chooses not to destroy the Kusika
    race, and repeatedly attempts to kill himself by falling from Meru, entering fire,
    and entering the sea with a stone weight; each attempt fails, and he returns to
    his asylum.
