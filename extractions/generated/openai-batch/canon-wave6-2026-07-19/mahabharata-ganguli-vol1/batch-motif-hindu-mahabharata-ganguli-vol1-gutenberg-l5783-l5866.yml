  quote: the recitation of this history dispelleth all fear of snakes
  summary: Sauti narrates that Astika halts Takshaka in mid-air, receives Janamejaya's
    boon ending the snake-sacrifice, returns to his kin, and obtains from the snakes
    a promise that those who recite or remember Astika's saving act will have no fear
    of snakes. The passage concludes by saying Astika later ascended to heaven and
    that recounting this history dispels fear of snakes.
