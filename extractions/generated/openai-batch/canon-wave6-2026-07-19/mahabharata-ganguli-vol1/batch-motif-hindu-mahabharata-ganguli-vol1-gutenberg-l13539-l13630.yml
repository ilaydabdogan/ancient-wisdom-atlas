canonical_text:
  quote: ''
  summary: Drona is installed among the Kurus and receives the Kuru princes as pupils.
    He asks them to promise future service for a purpose in his heart; Arjuna alone
    vows to fulfill it, becoming Drona's favored pupil. Drona teaches weapons to the
    princes and other students, including Karna, while Arjuna excels through devotion
    and practice. Drona attempts to give his son Aswatthaman extra training by means
    of a water-fetching arrangement, but Arjuna uses the Varuna weapon to return as
    quickly. Arjuna later learns from eating in the dark that habit can guide action
    and practices archery at night, after which Drona promises to make him unequalled.
    Ekalavya, a Nishada prince whom Drona refuses to accept, goes to the forest, makes
    a clay image of Drona, worships it as preceptor, and practices weapons until highly
    skilled. During a hunting excursion, the princes' dog encounters Ekalavya and
    barks at him.
  language: English
  quote_policy: summarized
