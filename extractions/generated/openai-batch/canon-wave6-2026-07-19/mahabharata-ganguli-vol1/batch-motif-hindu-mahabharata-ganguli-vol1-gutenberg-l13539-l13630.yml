candidate_motifs:
- id: motif:1
  label: pupil's vow to fulfill the teacher's hidden purpose
  taxonomy_refs:
  - sacred_exchange
  - initiation
  basis: Drona asks pupils for a promise tied to future martial skill; Arjuna alone
    vows to accomplish the unstated purpose and is thereafter specially favored.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not yet reveal Drona's purpose, so the exchange and initiation
    readings remain provisional.
- id: motif:2
  label: exceptional disciple surpassing peers through devotion and practice
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Arjuna stays by the preceptor, devotes himself to the science of arms, excels
    over all fellow pupils, overcomes the water-vessel disadvantage, and practices
    at night after learning from habit.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a martial-training motif rather than a fully explicit religious
    initiation in the passage.
- id: motif:3
  label: unequal instruction and compensating ingenuity
  taxonomy_refs:
  - wisdom
  basis: Drona structures water-fetching to give Aswatthaman extra instruction, but
    Arjuna uses the Varuna weapon to return at the same time and avoid inferiority.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The taxonomy reference is broad; the episode is specifically about skill,
    resourcefulness, and access to instruction.
- id: motif:4
  label: skill learned through habitual bodily practice in darkness
  taxonomy_refs:
  - wisdom
  - initiation
  basis: When the lamp goes out, Arjuna observes that his hand still finds his mouth
    by habit and applies the insight to night archery practice, leading Drona to promise
    unmatched archery.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the insight practically; any symbolic reading of darkness
    would require external interpretation.
- id: motif:5
  label: rejected aspirant trains before an image of the absent teacher
  taxonomy_refs:
  - initiation
  - wisdom
  basis: After Drona refuses him, Ekalavya makes a clay image of Drona in the forest,
    worships it as his real preceptor, and practices with exceptional reverence and
    regularity until archery processes become easy.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage supports devotion and self-training but does not yet narrate
    the later consequences of Ekalavya's skill.
- id: motif:6
  label: forest encounter revealing hidden practitioner
  taxonomy_refs:
  - departure
  basis: Ekalavya departs to the forest for practice, and later the hunting party's
    dog discovers him there and barks.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The excerpt ends before the full encounter unfolds, so the motif's function
    is only partly visible.
