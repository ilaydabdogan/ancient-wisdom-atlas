canonical_text:
  quote: ''
  summary: Markandeya narrates that Jatayu, king of the vultures and friend of Dasaratha,
    sees Ravana carrying Sita and challenges him. Jatayu attacks Ravana, but Ravana
    cuts off Jatayu's wings, slays him, and continues through the air with Sita. Sita
    drops ornaments and a costly yellow cloth, including among five monkeys on a mountain,
    before Ravana enters Lanka with her.
  language: English
  quote_policy: summarized
