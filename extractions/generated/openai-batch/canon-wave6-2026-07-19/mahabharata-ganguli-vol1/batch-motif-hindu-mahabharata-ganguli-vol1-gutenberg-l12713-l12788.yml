canonical_text:
  quote: ''
  summary: In spring, Pandu roams a flowering mountain forest with Madri. The scene
    and Madri's appearance arouse his desire; he seizes her against her will, disregards
    the Rishi's curse, and dies during intercourse. Madri mourns over his body. Kunti
    arrives with the children and speaks with Madri about the curse, responsibility,
    child-rearing, and which wife should follow Pandu to the dead. Madri asks that
    Kunti raise the children and then ascends Pandu's funeral pyre.
  language: English
