canonical_text:
  quote: ''
  summary: A Gandharva recounts that Vasishtha agrees to the monarch's request, accompanies
    him to Ayodhya, and is joyfully received with the returning king. The city is
    decorated and compared to a celestial city. At the king's command the queen approaches
    Vasishtha; Vasishtha makes a covenant with her, unites with her according to ordinance,
    and she conceives. After a prolonged gestation she opens her womb with a stone,
    and in the twelfth year Asmaka is born, later described as a royal sage and founder
    of Paudanya.
  language: English
  quote_policy: summarized
