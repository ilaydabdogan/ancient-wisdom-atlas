canonical_text:
  quote: ''
  summary: 'Markandeya narrates a genealogy and history of sacred fires: Swaha begets
    Adbhuta/Advanta through Mudita; fire carries sacrificial oblations, hides in the
    sea, curses the finny tribe for revealing him, gives up his body, generates metals
    and other substances from that body, is restored by Atharvan, and continues to
    carry offerings. Rivers are named as mothers of the fires, and the race of fires
    is linked to Brahma, Atri, Angiras, Vedic sacrifices, and the unity of all fires.'
  language: English
  quote_policy: summarized
