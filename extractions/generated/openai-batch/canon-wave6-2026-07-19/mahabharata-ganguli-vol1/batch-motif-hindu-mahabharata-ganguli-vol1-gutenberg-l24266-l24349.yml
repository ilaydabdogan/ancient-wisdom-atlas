canonical_text:
  quote: ''
  summary: Krishna urges Bhima to use the strength derived from Maruta. Bhima kills
    Jarasandha by whirling him and breaking his body on his knee. The citizens of
    Magadha are terrified. Krishna releases imprisoned kings and relatives, receives
    gifts and praise, and departs Girivraja with Bhima and Arjuna in Jarasandha's
    celestial car, whose divine history, flag-staff, horses, and association with
    Garuda are described.
  language: English
  quote_policy: summarized
