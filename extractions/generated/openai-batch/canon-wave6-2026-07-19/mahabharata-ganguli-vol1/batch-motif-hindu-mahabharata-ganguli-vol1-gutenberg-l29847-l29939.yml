canonical_text:
  quote: ''
  summary: Dhritarashtra asks Vyasa to admonish Duryodhana. Vyasa says the sage Maitreya
    will come and warn Duryodhana. Maitreya arrives, reports seeing Yudhishthira in
    the Kamyaka woods, rebukes the Kuru king, urges Duryodhana to make peace with
    the Pandavas, and cites their strength and Bhima’s victories. Duryodhana silently
    insults the sage by slapping his thigh and scratching the ground. Maitreya curses
    him, saying Bhima will smash that thigh with a mace in the great war unless Duryodhana
    makes peace.
  language: English
  quote_policy: summarized
