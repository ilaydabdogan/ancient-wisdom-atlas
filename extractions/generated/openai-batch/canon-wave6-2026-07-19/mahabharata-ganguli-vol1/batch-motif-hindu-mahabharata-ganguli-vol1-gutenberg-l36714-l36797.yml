  quote: ''
  summary: A pilgrimage itinerary lists a series of tirthas associated with Saraswati,
    Agni, Vishwamitra, Brahma, Kartikeya, Darbhi, Renuka, Varuna, Sthanu, Brahma,
    Narayana, Rudra's wife, Visweswara, and others. Bathing, fasting, worship, and
