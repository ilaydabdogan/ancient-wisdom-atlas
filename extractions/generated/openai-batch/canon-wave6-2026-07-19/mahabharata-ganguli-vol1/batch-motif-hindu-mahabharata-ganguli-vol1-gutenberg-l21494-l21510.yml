  summary: Maya, an Asura fleeing from Takshaka's abode, is pursued by Agni and threatened
    by Vasudeva. Maya appeals to Arjuna, who assures him safety; Krishna and Agni
    then spare him. Agni later burns the forest for fifteen days while protected from
    Indra by Krishna and Partha, sparing only six dwellers.
