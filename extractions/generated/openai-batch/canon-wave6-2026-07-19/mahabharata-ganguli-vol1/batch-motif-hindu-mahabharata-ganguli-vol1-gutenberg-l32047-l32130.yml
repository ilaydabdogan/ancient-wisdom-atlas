canonical_text:
  quote: Behold, O bull among kings, the Asuras, though elder brothers in possession
    of power and affluence, were all vanquished by the gods through stratagem.
  summary: A counsellor urges a king to balance virtue, wealth, and pleasure, to decide
    firmly between possession and renunciation, and to pursue the Kshatriya duty of
    sovereignty through wealth, might, courage, and stratagem. The speech invokes
    the gods' defeat of the Asuras as precedent, compares royal action to the sun's
    sustaining and destructive rays, and describes protection of subjects and fair
    fight as a path to blessed regions.
  language: English
  quote_policy: quoted
