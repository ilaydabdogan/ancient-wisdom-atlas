canonical_text:
  quote: ''
  summary: Janamejaya asks why Yudhishthira silently feared Karna. Vaisampayana explains
    that, after twelve years of exile, Sakra intended to beg Karna for his ear-rings.
    Surya, Karna's father, appeared to Karna in a dream in the form of a Brahmana
    and warned him that Sakra would come disguised as a Brahmana to ask for his ear-rings
    and coat of mail. Surya advised Karna not to give them away, because they were
    born with him, sprang from Amrita, and preserved his life and invulnerability
    in battle.
  language: English
  quote_policy: summarized
