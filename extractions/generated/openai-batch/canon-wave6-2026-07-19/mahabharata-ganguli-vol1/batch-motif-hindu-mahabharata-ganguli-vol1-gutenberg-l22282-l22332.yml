canonical_text:
  quote: ''
  summary: The Pandavas sit in their Sabha with Gandharvas when the celestial Rishi
    Narada arrives with companions. Narada is described as highly learned in sacred
    texts, philosophy, logic, polity, warfare, music, and many branches of knowledge,
    and as one who has wandered through different worlds. He blesses Yudhishthira.
    Yudhishthira and his brothers rise, bow, seat him, and make ritual offerings including
    kine, Arghya with honey, gems, and jewels. Gratified by the worship, Narada addresses
    Yudhishthira on religion, wealth, pleasures, and salvation.
