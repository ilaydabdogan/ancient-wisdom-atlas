canonical_text:
  quote: ''
  summary: 'Markandeya introduces the story of Rama: Ravana abducted Sita from Rama''s
    woodland asylum by deceit after overpowering Jatayu; Rama recovered her with Sugriva''s
    help, bridged the sea, and destroyed Lanka. Yudhishthira asks about Rama''s and
    Ravana''s origins. Markandeya then recounts Rama''s royal lineage, Sita''s creation
    as Rama''s beloved wife, and Ravana''s divine-descended family background, including
    Vaisravana''s boons, Lanka, and the Pushpaka chariot.'
  language: English
  quote_policy: summarized
