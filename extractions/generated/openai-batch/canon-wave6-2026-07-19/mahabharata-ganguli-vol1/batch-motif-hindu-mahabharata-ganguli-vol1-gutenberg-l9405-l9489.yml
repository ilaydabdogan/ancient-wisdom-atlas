canonical_text:
  quote: ''
  summary: In a dialogue, Ashtaka questions Yayati about why he left the heavenly
    gardens of Nandana, how virtue is lost, what happens after death, and how beings
    return to embodied life. Yayati explains that loss of righteousness leads to abandonment
    by celestials, that self-praise leads to an Earth-hell called Bhauma, and that
    after death beings enter cycles of subtle existence, water, seed, womb, embryo,
    birth, sensory embodiment, and rebirth into higher or lower forms according to
    acts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashtaka says Yayati was capable of assuming any form at will, had lived for
    a million years in the gardens of Nandana, and asks why he had to leave that region.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yayati answers that, as worldly associates forsake one whose wealth disappears,
    celestials headed by Indra forsake one who has lost righteousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yayati says those who speak of their own merits are doomed to the hell called
    Bhauma, and describes bodies or descendants as becoming food for vultures, dogs,
    and jackals.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ashtaka asks where a person resides after the aged body is destroyed and eaten,
    and how that person comes back to life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yayati says that after bodily dissolution a person, according to acts, re-enters
    the mother's womb in an indistinct form, becomes distinct, and reappears in the
    world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yayati identifies this return to earth as Bhauma or Earth-hell, because the
    being does not see the end of existence and does not act for emancipation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yayati says some dwell in heaven for sixty thousand or eighty thousand years
    and then fall.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yayati says falling beings are attacked by Rakshasas in the forms of sons,
    grandsons, and other relatives who withdraw their hearts from acting for emancipation.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Yayati says that after falling from heaven the being becomes a subtle substance
    living in water; the water becomes semen and the seed of vitality, enters the
    womb, and develops into embryo and visible life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yayati says the same watery seed of life, entering trees, plants, vegetable
    substances, water, air, earth, and space, assumes quadrupedal or bipedal form.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yayati says a subtle being co-inheres in seed dropped into the womb, is attracted
    for rebirth, develops into embryo and physical organism, is born, and becomes
    conscious through senses and mind.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Yayati says that after death and destruction of the body, the person assumes
    a subtle form, retains consciousness of acts as in a dream, and enters another
    form faster than air.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Yayati says virtuous persons attain a superior form of existence and vicious
    persons an inferior form, including worms and insects.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ashtaka asks how men attain superior regions from which there is no return
    to earthly life, and whether this is by asceticism or knowledge.
  category: speech
  evidence_refs:
  - ev:10
