  text: The lord of treasures says that a Kshatriya who understands patience, place,
    time, and regulations can govern for a long time and gain fame and a good state
    after death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sakra with the Vasus is given as an example of one who obtained heavenly dominion
    by displaying prowess at the proper place and time.
  category: speech
  evidence_refs:
  - ev:1
