canonical_text:
  quote: patience, ability, (appropriate) time and place and prowess--these five lead
    to success in human affairs.
  summary: Kuvera counsels Yudhishthira on proper conduct, warns him to restrain Bhima,
    promises supernatural protection and provision for the Pandavas, speaks of Arjuna’s
    heavenly weapon-training and Santanu’s welfare, blesses the group, departs with
    his retinue, and has the Rakshasa bodies removed as Agastya’s curse expires and
    the slain Rakshasas are freed.
  language: English
  quote_policy: quoted
