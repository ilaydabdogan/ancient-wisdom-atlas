  text: Vaisampayana announces that he will recite Nakula's deeds and triumphs in
    the western direction, which had earlier been subdued by Vasudeva.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nakula sets out from Khandavaprastha toward the west with a large host whose
    warriors and chariots make loud martial sounds.
  category: action
  evidence_refs:
