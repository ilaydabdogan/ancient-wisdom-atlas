canonical_text:
  quote: ''
  summary: Vaisampayana recounts Nakula's western campaign. Nakula leaves Khandavaprastha
    with a large army, subdues many western regions, tribes, kings, coastal and mountain
    peoples, gains the acceptance of Vasudeva and the Yadavas, receives hospitality
    and wealth from his uncle Salya, collects tribute, returns to Indraprastha, and
    presents the wealth to Yudhishthira. The west is described as Varuna's direction
    and as a direction previously subdued by Vasudeva.
  language: English
  quote_policy: summarized
