- id: obs:3
  text: Nakula first attacks the mountainous country of Rohitaka, described as dear
    to Kartikeya, prosperous, rich in cattle, wealth, and produce; he has a fierce
    encounter with the Mattamyurakas there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nakula subjugates desert country, Sairishaka, Mahetta, Akrosa, and multiple
