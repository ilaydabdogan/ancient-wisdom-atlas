canonical_text:
  quote: ''
  summary: The Pandavas depart for Varanavata after formal farewells. Citizens lament
    the departure as unjust exile and criticize Dhritarashtra. Yudhishthira asks them
    to return, affirming duty toward the king. Vidura then gives Yudhishthira a coded
    warning in Mlechchha speech about enemy schemes, an inflammable dwelling, fire,
    escape routes, direction-finding, and control of the senses. Yudhishthira later
    explains the warning to Kunti. The Pandavas set out on an astrologically marked
    day and arrive at Varanavata.
  language: English
  quote_policy: summarized
