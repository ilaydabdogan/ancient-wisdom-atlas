canonical_text:
  quote: ''
  summary: A Gandharva addresses the sons of Pandu, explaining that he censured them
    because they were without wives, without a defined life-stage, and without a Brahmana
    leading them. He acknowledges their Kuru lineage, teachers, divine and human progenitors,
    and virtues. He explains that Arjuna defeated him because Arjuna was in Brahmacharya,
    despite the Gandharva's increased power at night and anger in the presence of
    his wife. He then gives didactic counsel on the necessity of learned Brahmana
    priests for Kshatriyas and kings, linking priestly guidance with victory, prosperity,
    land, heaven, and enduring kingdom.
  language: English
  quote_policy: summarized
