canonical_text:
  quote: ''
  summary: A king hunting with his retinue becomes fatigued, crosses a desert, and
    enters a beautiful forest containing ascetic retreats. The forest and hermitage
    are described as abundant, flower-filled, inhabited by ascetics, animals, and
    celestial or semi-celestial beings, with sacred fires and the sacred Malini river
    nearby. The king approaches the asylum associated with Kasyapa and Kanwa, halts
    his army at the forest entrance, and says he will go to see the ascetic while
    the others wait.
  language: English
