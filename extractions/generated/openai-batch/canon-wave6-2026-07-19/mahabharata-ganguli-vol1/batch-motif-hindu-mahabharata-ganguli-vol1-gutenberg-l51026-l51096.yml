canonical_text:
  quote: ''
  summary: Duryodhana travels through forests to cattle-stations, inspects herds,
    enjoys music, food, sport, and hunting, and reaches the sacred lake of Dwaitavana.
    Yudhishthira and Draupadi are nearby performing the Rajarshi sacrifice. Duryodhana
    orders pleasure-houses built at the lake, but Gandharvas occupying the place with
    Apsaras and celestial sons forbid entry. Duryodhana sends warriors to drive them
    away; the Gandharvas rebuke the demand and threaten the messengers with death
    before the vanguard retreats.
  language: English
  quote_policy: summarized
