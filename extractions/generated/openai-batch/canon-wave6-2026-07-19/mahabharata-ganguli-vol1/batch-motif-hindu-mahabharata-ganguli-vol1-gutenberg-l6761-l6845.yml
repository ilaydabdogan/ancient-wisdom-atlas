  evidence_refs:
  - ev:3
- id: obs:6
  text: Soma’s twenty-seven wives are identified as Nakshatras and Yoginis employed
    in indicating time and assisting the courses of the worlds.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eight Vasus are named, and one descendant, Kala or Time, is described
    as the destroyer of the worlds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kumara, also called Kartikeya, is said to be the son of Agni, born in a forest
    of reeds, and reared by Krittika and others.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Viswakarman is born to Prabhasa’s wife and is described as founder of all
    arts, engineer of the immortals, maker of ornaments, constructor of celestial
    cars, and source of human livelihood through inventions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dharma comes out through Brahman’s right breast and has three sons, Sama,
    Kama, and Harsha, who support the worlds by their energy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kasyapa’s offspring are gods and Asuras, and Kasyapa is therefore called Father
