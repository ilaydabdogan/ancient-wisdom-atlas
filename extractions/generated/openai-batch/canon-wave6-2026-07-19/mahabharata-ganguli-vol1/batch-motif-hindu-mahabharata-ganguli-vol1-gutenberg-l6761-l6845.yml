canonical_text:
  quote: ''
  summary: 'Vaisampayana gives a genealogical account of divine and semi-divine beings:
    Brahman’s sons and bodily emanations, the Rudras, Rishis and their offspring,
    Daksha’s daughters and their marriages, the Nakshatras as wives of Soma, the Vasus
    and their descendants, Kartikeya, Viswakarman, Dharma and his sons, Kasyapa as
    father of gods and Asuras, the mare-form Tvashtri giving birth to the Aswin twins,
    and Aditi’s sons including Indra and Vishnu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sthanu is named as another son in the divine genealogy, and his eleven sons
    are identified as the eleven Rudras.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marichi, Angiras, Atri, Pulastya, Pulaha, and Kratu are identified as six
    great Rishis and sons of Brahman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The offspring of Pulastya include Rakshasas, Monkeys, Kinnaras, and Yakshas;
    the offspring of Pulaha include insects, lions, Kimpurushas, tigers, bears, and
    wolves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daksha is said to spring from Brahman’s right toe, and Daksha’s wife from
    Brahman’s left toe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Daksha begets fifty daughters, makes them Putrikas, and gives them to Dharma,
