  text: Markandeya reports to Yudhishthira that the virtuous fowler again addresses
    the foremost Brahmana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fowler says that the ways of righteousness are subtle, diverse, and infinite.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fowler says that untruth may be proper when life is at stake or in the
    matter of marriage, and that what conduces most to the good of all creatures is
    considered truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fowler says that human actions are good or bad and that a person reaps
    their fruits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fowler says an ignorant person in an abject state abuses the gods without
    knowing that the state results from his own evil karma.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fowler gives examples in which able and diligent persons fail, injurious
    or deceptive persons live happily, some prosper without effort, and others fail
    despite great exertion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fowler describes people who seek sons through worship and austerities,
    yet the resulting sons may become infamous; others born under similar circumstances
    live in inherited wealth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fowler attributes diseases to karma and compares sufferers to small deer
    in the hands of hunters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fowler says skilled physicians with collections of drugs check the progress
    of diseases as hunters intercept game.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fowler says every person is helpless, overcome by misery and illusion,
    and repeatedly tossed by the powerful current of his own actions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The fowler says that if there were absolute freedom of action, no creature
    would die, decay, await evil doom, or fail to attain desire.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fowler says that persons born under the same star and auspices still show
    great diversity in the maturity of their actions.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The fowler says no person can dispense his own lot, and actions from a previous
    existence fructify in the present life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The fowler says the soul is eternal, the corporeal frame is destructible,
