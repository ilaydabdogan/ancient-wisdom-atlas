canonical_text:
  quote: ''
  summary: Markandeya tells Yudhishthira that the virtuous fowler resumes instructing
    a Brahmana. The fowler teaches that righteousness is subtle, that truth and untruth
    may be judged by their effect on creatures, that actions bear karmic fruits, that
    effort alone does not determine outcomes, that disease and fortune are linked
    to karma, and that the body is destroyed while the spirit, joined to its actions,
    travels elsewhere.
  language: English
  quote_policy: summarized
