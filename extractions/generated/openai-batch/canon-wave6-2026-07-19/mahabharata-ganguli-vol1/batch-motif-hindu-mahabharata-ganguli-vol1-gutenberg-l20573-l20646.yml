canonical_text:
  quote: ''
  summary: Arjuna, after obtaining assent from Yudhishthira and Krishna, rides armed
    in a golden chariot. Subhadra completes worship and circumambulation at Raivataka
    hill, after which Arjuna forcibly seizes her and drives toward Indraprastha. Her
    attendants report the abduction at the Sudharma court in Dwaraka. The Yadava groups
    assemble for arms, and Balarama first orders them to wait for Krishna’s will,
    then denounces Arjuna as ungrateful and threatens retaliation.
  language: English
  quote_policy: summarized
