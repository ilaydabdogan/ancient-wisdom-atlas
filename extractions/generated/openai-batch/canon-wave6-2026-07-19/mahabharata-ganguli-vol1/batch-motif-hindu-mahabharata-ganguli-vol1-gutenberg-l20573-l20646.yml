  evidence_refs:
  - ev:1
- id: obs:2
  text: Arjuna sets out armed, mailed, and equipped with sword and gloves in a well-built
    golden chariot with bells, weapons, loud wheels, and the steeds Saivya and Sugriva.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Subhadra pays homage to Raivataka hill, worships deities, receives Brahmanas’
    benedictions, circumambulates the hill, and begins returning toward Dwaravati.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arjuna, described as afflicted by desire, rushes toward Subhadra, forcibly
    takes her into his chariot, and proceeds toward Indraprastha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Subhadra’s armed attendants see her seized and taken away, run toward Dwaraka,
