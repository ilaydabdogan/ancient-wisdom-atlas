canonical_text:
  quote: ''
  summary: Indra/Sakra advances with a celestial army against Mahasena/Skanda. Skanda
    answers the gods' war-cries with a terrifying roar and emits fire from his mouth,
    burning the celestial forces. The gods seek Skanda's protection, but Indra hurls
    his thunderbolt, piercing Skanda's side. From Skanda's body arises a youth with
    a club and celestial amulet, named Visakha because he was born from the thunderbolt-piercing.
    Indra then seeks Skanda's protection, and Skanda reassures him.
  language: English
  quote_policy: summarized
