canonical_text:
  quote: ''
  summary: 'Dhritarashtra, anxious and jealous because the sons of Pandu have become
    powerful, asks the minister Kanika whether to make peace or war. Kanika gives
    counsel on kingship and enmity: a king should be ready to punish, conceal his
    own weaknesses and plans, watch for the faults and disasters of foes, destroy
    enemies and their allies thoroughly, and use conciliation, money, disunion, force,
    or even religious guise and deception to gain advantage.'
  language: English
  quote_policy: summarized
