canonical_text:
  quote: ''
  summary: After the sons of Kunti are distressed by a Brahmana's words, Kunti observes
    their state and advises Yudhishthira that they should leave their current Brahmana
    host and town for Panchala, where alms are said to be obtainable and King Yajnasena
    is devoted to Brahmanas. Yudhishthira answers that it is his duty to obey her
    command but he does not know whether his younger brothers wish to go.
