canonical_text:
  quote: ''
  summary: At Damayanti's swayamvara, assembled kings and gods appear before her.
    Seeing five identical figures and unable to distinguish Nala, she prays to the
    gods on the strength of her truth and vow. The gods reveal their celestial signs,
    while Nala is recognizable by human marks. Damayanti garlands Nala as her husband,
    the gods and Rishis approve, Nala and Damayanti exchange vows, and the Lokapalas
    grant Nala boons before the wedding is celebrated.
  language: English
  quote_policy: summarized
