canonical_text:
  quote: ''
  summary: A cosmic disturbance accompanies a battle between celestials and Danavas/Daityas.
    Indra rallies the gods after they are hard-pressed. The Danava Mahisha crushes
    many celestial warriors with a great rock and seizes Rudra's chariot. Rudra does
    not kill him, remembering that Skanda will do so. Mahasena/Skanda appears in red
    and gold, hurls a bright Sakti, cuts off Mahisha's head, and the fallen head blocks
    the entrance to the Northern Kurus.
  language: English
