canonical_text:
  quote: ''
  summary: The passage recounts the Rishi Jaratkaru confirming that his wife has conceived
    a virtuous child, then departing for penance. His wife reports this to her brother
    Vasuki, king of the snakes, who explains that the union was intended to produce
    a son who would save the snakes from a snake-sacrifice. Reassured by her report
    of the Rishi's words, Vasuki rejoices. The child Astika is then born, grows up
    among the snakes, studies the Vedas, and becomes their delight.
  language: English
