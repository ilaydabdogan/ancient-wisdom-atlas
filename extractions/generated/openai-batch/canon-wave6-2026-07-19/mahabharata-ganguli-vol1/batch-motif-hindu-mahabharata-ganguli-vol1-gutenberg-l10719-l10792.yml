canonical_text:
  quote: Therefore, ye monarchs, I bear away these maidens hence by force.
  summary: After Chitrangada's death, Bhishma rules while Vichitravirya is a minor.
    When Vichitravirya comes of age, Bhishma goes to the self-choice ceremony of the
    three daughters of the king of Kasi, takes them onto his chariot for Vichitravirya,
    declares that he is carrying them away by force, challenges the assembled kings,
    defeats them in battle, and continues toward the Bharata capital with the maidens.
  language: English
  quote_policy: quoted
