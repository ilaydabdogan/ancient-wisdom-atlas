canonical_text:
  quote: ''
  summary: Duryodhana's sacrifice is prepared with a golden plough, begun with mantra-sanctified
    rites, and announced to princes and Brahmanas. A messenger invites the Pandavas
    in Dwaita forest. Yudhishthira declines because the vow of the thirteenth year
    remains unfinished, while Bhima responds with a martial image of battle as sacrifice.
    Kings and Brahmanas are then received, fed, entertained, given gifts, and dismissed.
  language: English
  quote_policy: summarized
