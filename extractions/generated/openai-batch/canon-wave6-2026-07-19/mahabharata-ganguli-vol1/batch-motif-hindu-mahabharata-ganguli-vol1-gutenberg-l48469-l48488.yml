canonical_text:
  quote: ''
  summary: 'The passage describes virtues such as truthfulness, non-injury, restraint,
    patience, kindness, and absence of malice and lust. It presents three core rules
    of the virtuous way: do no wrong, give alms, and speak truth. Those who maintain
    virtuous conduct, compassion, and knowledge depart contentedly from the world,
    distinguish virtuous from non-virtuous conduct, and escape a great danger. The
    speaker concludes by saying he has described virtuous conduct to a great Brahmana
    according to what he knows and has heard.'
