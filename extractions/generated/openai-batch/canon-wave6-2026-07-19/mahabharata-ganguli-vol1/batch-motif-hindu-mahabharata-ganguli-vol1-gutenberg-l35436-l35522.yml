canonical_text:
  quote: ''
  summary: Vrihadaswa narrates that Nala, serving as Vahuka the charioteer, drives
    Rituparna swiftly toward Vidarbha. Rituparna demonstrates extraordinary calculation
    by estimating the leaves and fruits of a Vibhitaka tree. Vahuka verifies the count,
    then exchanges his horse-lore for Rituparna's science of dice. When Nala learns
    the dice science, Kali exits his body while vomiting Karkotaka's poison. Kali
    pleads for protection, recalls Damayanti's curse, promises safety to those who
    recite Nala's story, and enters the Vibhitaka tree. Nala resumes the journey,
    freed from calamity though not restored to his native form.
  language: English
  quote_policy: summarized
