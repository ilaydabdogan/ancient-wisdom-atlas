canonical_text:
  quote: ''
  summary: Sisupala denounces the first worship offered to Krishna in a royal assembly.
    He argues that Krishna is not a king, priest, or preceptor, lists other present
    figures whom he considers more worthy, accuses Yudhishthira and Bhishma of moral
    failure, insults Krishna’s acceptance of the Arghya, recalls Krishna’s slaying
    of Jarasandha, and then leaves the assembly accompanied by kings.
  language: English
  quote_policy: summarized
