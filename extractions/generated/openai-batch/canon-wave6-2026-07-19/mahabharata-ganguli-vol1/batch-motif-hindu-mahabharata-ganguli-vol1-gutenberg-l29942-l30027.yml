canonical_text:
  quote: ''
  summary: Dhritarashtra asks Vidura to recount Kirmira's destruction. Vidura narrates
    how, after losing at dice, the Pandavas entered the Kamyaka woods at midnight.
    A terrifying Rakshasa, Kirmira, blocked their path, created an illusion, and frightened
    the forest and Krishna. Dhaumya dispelled the illusion with mantras. Yudhishthira
    questioned the Rakshasa, who identified himself as Vaka's brother and declared
    his intent to eat the Pandavas, especially Bhima, in revenge for the deaths of
    Vaka and Hidimva.
  language: English
  quote_policy: summarized
