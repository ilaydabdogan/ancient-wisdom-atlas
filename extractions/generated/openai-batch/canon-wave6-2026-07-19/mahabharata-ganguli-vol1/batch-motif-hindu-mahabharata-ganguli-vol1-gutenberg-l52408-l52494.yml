canonical_text:
  quote: ''
  summary: 'A messenger of the gods describes heaven to Mudgala as a high celestial
    realm reached by virtuous acts, containing many worlds, Meru, sacred gardens,
    celestial beings, and higher regions of Brahma and the Ribhus. He also describes
    drawbacks: one only consumes prior merit there, cannot perform new acts, and falls
    when merit is exhausted, with rebirth determined by remaining merit and knowledge.'
  language: English
  quote_policy: summarized
