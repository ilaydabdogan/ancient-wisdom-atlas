canonical_text:
  quote: ''
  summary: Sahadeva addresses Agni concerning an obstructed sacrifice, sits on kusa
    grass before the approaching fire, and is reassured by Agni, who says he was testing
    him and promises protection for king Nila's town and favor to Sahadeva. King Nila
    then worships Sahadeva and pays tribute. Sahadeva continues south, subduing numerous
    kings, peoples, towns, islands, and regions by war, conciliation, messengers,
    and tribute arrangements. Rukmin and Vibhishana accept his sway and send wealth.
    Sahadeva returns and presents the collected wealth to Yudhisthira.
  language: English
  quote_policy: summarized
