  quote: ''
  summary: Sanjaya tells Dhritarashtra that the Pandavas are enraged by Draupadi's
    humiliation and recounts Arjuna's divine testing and weapon-receiving episode.
    He reports Bhima's vow to smash Duryodhana's thighs after thirteen years. Dhritarashtra
    laments Karna's words, his sons' conduct, and the danger posed by Arjuna, Bhima,
    and Vasudeva, recalling Arjuna's divine weapons, Mahadeva's embrace, Hari's protection,
    and the Khandava conflagration involving Agni.
