canonical_text:
  quote: ''
  summary: Markandeya recounts that a Divine Being addressed him after he had dwelt
    within the Being's body. Markandeya gains new sight and true knowledge, worships
    the Being's feet, and asks about the Being's identity and illusion. He says he
    entered through the Being's mouth and saw the whole universe, including gods and
    other beings, inside the Being's stomach and body. He asks why the Being remains
    in the form of a boy after swallowing the universe. The deity of deities then
    begins to reply.
  language: English
  quote_policy: summarized
