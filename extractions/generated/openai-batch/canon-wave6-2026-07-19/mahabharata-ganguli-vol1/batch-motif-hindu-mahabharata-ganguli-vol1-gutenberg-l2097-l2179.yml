canonical_text:
  quote: ''
  summary: Utanka corrects an improper purification rite, obtains the queen’s earrings
    as a present for his preceptor, and is warned that Takshaka, king of serpents,
    seeks them. After a dispute with King Paushya over unclean food and reciprocal
    curses, Utanka departs with the earrings. On the road Takshaka appears in beggar
    form, steals the earrings, reveals his serpent form, and enters a hole leading
    to the serpent region. Indra sends his thunderbolt to enlarge the opening, allowing
    Utanka to enter the serpent realm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paushya identifies Utanka’s prior standing ablution as a transgression, and
    Utanka repeats purification while seated facing east, washing, sipping water three
    times, and touching his organs with water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After completing the corrected purification, Utanka enters the women’s apartments
    again and sees the Queen, who respectfully greets him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Utanka asks the Queen for her earrings as a present for his preceptor; she
    removes them and gives them to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Queen warns Utanka that the earrings are sought by Takshaka, the King
    of the serpents, and tells him to carry them carefully.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paushya offers to perform a sraddha for Utanka as a qualified guest, and Utanka
    agrees to tarry for clean provisions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Utanka finds hair in the food, sees that it is cold, calls it unclean, and
    curses Paushya with loss of sight; Paushya replies with a curse that Utanka be
    without issue.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Paushya confirms that the food is cold and mixed with hair, asks pardon, and
    says he cannot revoke his own curse because his wrath remains unappeased.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Utanka departs with the earrings after arguing that Paushya’s curse cannot
    affect him because the food was truly unclean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the road Utanka sees a naked idle beggar who appears and disappears; while
    Utanka puts down the earrings and goes for water, the beggar takes the earrings
    and runs away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After completing ablutions and reverently bowing to gods and spiritual masters,
    Utanka pursues and seizes the thief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The seized thief leaves the beggar form, assumes the real form of Takshaka,
    and enters a large hole in the ground leading to the region of serpents.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Utanka pursues the Serpent and tries to dig open the hole with a stick, but
    cannot make much progress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Indra sees Utanka’s distress and sends the thunderbolt, which enters the stick
