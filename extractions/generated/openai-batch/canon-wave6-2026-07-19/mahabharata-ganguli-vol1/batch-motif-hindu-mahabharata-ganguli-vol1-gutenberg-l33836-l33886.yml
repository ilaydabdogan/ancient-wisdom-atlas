canonical_text:
  quote: ''
  summary: Vrihadaswa arrives before Yudhishthira, is received with ritual hospitality,
    and hears Yudhishthira lament his deceitful defeat at dice, loss of kingdom, public
    humiliation of his wife, forest exile, sleepless grief, and separation from Vibhatsu.
    Vrihadaswa replies that he can tell of a more miserable king, Nala, son of Virasena,
    who was deceitfully defeated by Pushkara and lived in the forest with his spouse
    and without retinue or companions. Yudhishthira asks to hear Nala's story in detail.
  language: English
  quote_policy: summarized
