canonical_text:
  quote: ''
  summary: 'Rishi Lomasa arrives while Dhaumya is speaking and is received by Yudhishthira
    and his company. Lomasa reports that he travelled to Sakra''s abode, saw Arjuna
    seated with Sakra, and came at the request of Indra and Arjuna. He says Arjuna
    has obtained the Brahma-sira weapon from Rudra, other celestial weapons from Yama,
    Kuvera, Varuna, and Indra, and training in music, dance, and Saman recitation.
    Lomasa then conveys Indra''s message: Arjuna will return after acquiring arms
    and completing a deed for the celestials; Yudhishthira and his brothers should
    practice austerities; Indra will remove Yudhishthira''s fear of Karna; and Lomasa
    will speak about pilgrimage to tirthas and the merits of asceticism.'
  language: English
  quote_policy: summarized
