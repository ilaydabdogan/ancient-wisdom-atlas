- id: obs:1
  text: Lomasa introduces the account as an explanation of how Mandhata’s name became
    celebrated throughout the worlds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yuvanaswa is described as an Ikshvaku-line ruler who performed many sacrifices,
    including a thousand horse sacrifices, but had no son and retired to the woods
    after handing state duties to ministers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Bhrigu’s hermitage, a large jar of water consecrated with sacred hymns
    had been placed on an altar for the purpose of enabling Saudyumni’s wife to bear
    a god-like son.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The thirsty king entered the hermitage, called for water without being heard,
    saw the jar, drank its water, and put the jar down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the saints awoke and found the jar empty, Yuvanaswa admitted he had
    drunk the water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son of Bhrigu stated that the water had occult virtue from austerities
    and sacred rites, that the accident could not be reversed, and that the king must
    bring forth the intended son from his own body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ritual speaker promises a further sacrifice so that the king will bring
    forth a son equal to Indra and will not suffer labor pains.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After one hundred years, a son shining like the sun pierced the king’s left
    side and came forth, and Yuvanaswa did not die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Indra visited; the deities asked what the boy would suck; Indra placed his
    forefinger in the boy’s mouth and the boy was named Mandhata from Indra’s words,
    “He will suck me.”
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After tasting Indra’s forefinger, the boy gained great strength, grew thirteen
    cubits, acquired sacred learning and martial science by thought, and received
    the bow Ajagava, horn shafts, and an impenetrable coat of mail.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Indra placed Mandhata on the throne; Mandhata conquered the three worlds righteously,
