canonical_text:
  quote: ''
  summary: 'Lomasa recounts the origin of Mandhata’s fame: the childless king Yuvanaswa,
    after many sacrifices and a forest retirement, accidentally drinks hymn-consecrated
    water intended to produce a son. The ritual result cannot be reversed, and after
    one hundred years the king gives birth from his left side without dying. Indra
    feeds the boy with his forefinger, names him Mandhata, and later enthrones him;
    Mandhata grows miraculously, gains knowledge and weapons, conquers the three worlds,
    performs sacrifices, and attains a place beside Indra.'
  language: English
  quote_policy: summarized
