canonical_text:
  quote: ''
  summary: 'Markandeya describes Skanda''s terrible followers and children: male child-stealing
    beings and strong female children arise around the thunderbolt strike; the children
    adopt Visakha as father; goat-faced Bhadrasakha guards sons and daughters; Skanda
    is called father of the Kumaras. Son-seekers worship Rudra as Fire-god and Uma
    as Swaha. Daughters of Fire-god Tapa ask Skanda to become respected mothers of
    the world, and he grants this, dividing them into Siva and Asiva. Seven named
    mothers have a fierce son, Sisu, by Skanda''s blessing. Skanda''s sixth face is
    goat-like, and the events are placed on the fifth and sixth lunar days.'
  language: English
  quote_policy: summarized
