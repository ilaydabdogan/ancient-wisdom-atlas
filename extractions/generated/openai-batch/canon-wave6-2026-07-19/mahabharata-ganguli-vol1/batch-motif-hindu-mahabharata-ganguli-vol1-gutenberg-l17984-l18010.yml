canonical_text:
  quote: "“Shoot the mark through the orifice of the machine with these five sharpened
    arrows.”"
  summary: 'In a royal amphitheatre at Panchala, the Pandavas sit among Brahmanas
    while a large festival gathering grows. On the sixteenth day Drupada’s daughter
    Krishna enters ceremonially with offerings and a flower garland. A priest performs
    a fire rite to Agni, the music stops, and Dhrishtadyumna announces an archery
    test: the eligible man who shoots the mark through a machine’s aperture with five
    arrows will obtain Krishna as wife. He then begins reciting the assembled rulers’
    names, lineages, and achievements to her.'
  language: English
  quote_policy: quoted
