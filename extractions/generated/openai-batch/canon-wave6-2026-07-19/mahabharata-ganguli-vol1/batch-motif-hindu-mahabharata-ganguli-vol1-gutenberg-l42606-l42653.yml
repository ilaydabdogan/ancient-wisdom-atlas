canonical_text:
  quote: ''
  summary: A fragmentary dharma statement assigns afterlife rewards to Vaisyas, Kshatriyas,
    and just kings. In Section CL, Hanuman contracts his self-assumed huge body, embraces
    his brother Bhima, and restores Bhima’s strength. Hanuman asks Bhima to return
    home, remember him, and keep his presence secret; he recalls Rama, Sita, and Ravana;
    then he offers Bhima a boon, including the destruction of Dhritarashtra’s sons
    or the capture of Duryodhana. Bhima accepts Hanuman as protector of the Pandavas.
    Hanuman promises future battlefield aid by joining Bhima’s roars and shouting
    from Arjuna’s flagstaff, then points out the way and vanishes.
  language: English
  quote_policy: summarized
