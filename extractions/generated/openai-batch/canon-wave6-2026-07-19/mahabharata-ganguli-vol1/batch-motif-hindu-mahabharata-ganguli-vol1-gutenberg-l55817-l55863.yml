  summary: Dyumatsena regains his sight. He and his wife Saivya search anxiously through
    nearby asylums, rivers, woods, and floods for Satyavan and Savitri, then are comforted
    by hermitage Brahmanas and ascetics. Several named Brahmanas and Rishis assert
    that Satyavan lives, citing Savitri's austerities and marks, Gautama's ascetic
    knowledge, Dyumatsena's restored sight, animal voices, and signs of long life.
