canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Arjuna, during his forest exile and vow of Brahmacharya,
    travels with Brahmanas and other holy followers to the source of the Ganges. After
    ritual activity on the riverbank, Arjuna bathes in the Ganges and is drawn underwater
    by Ulupi, daughter of the Naga king Kauravya. In Kauravya's mansion Arjuna performs
    fire rites, then questions Ulupi. Ulupi identifies herself, declares that desire
    for Arjuna has afflicted her, and asks him to yield to her. Arjuna cites his vow,
    and Ulupi argues that helping her will not breach his duty because the exile vow
    concerns Draupadi and because protecting the distressed is meritorious.
  language: English
  quote_policy: summarized
