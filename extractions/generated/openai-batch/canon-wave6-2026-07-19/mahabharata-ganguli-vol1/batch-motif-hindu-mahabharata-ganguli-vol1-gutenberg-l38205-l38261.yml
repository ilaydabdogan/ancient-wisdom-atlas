canonical_text:
  quote: ''
  summary: Agastya asks the king of Vidharbhas for Lopamudra in marriage. The king
    and queen grieve, fearing Agastya's curse, but Lopamudra tells her father to give
    her away and save himself. After marriage, she gives up royal clothing for ascetic
    dress, accompanies Agastya to Gangadwara, and serves him during penance. Later,
    Agastya seeks marital intercourse for offspring, but Lopamudra asks for royal-style
    bedding and ornaments without diminishing his ascetic merit. Agastya decides to
    go in quest of wealth.
  language: English
  quote_policy: summarized
