canonical_text:
  quote: I see the bird only, but nor the tree, or thyself.
  summary: Drona tests Arjuna’s concentration in shooting a bird or vulture target
    on a tree; Arjuna succeeds. Later, at the Ganga, an alligator seizes Drona, and
    Arjuna rescues him with arrows. Drona rewards Arjuna with the Brahmasira weapon,
    warns him never to use it against a human foe because it might burn the whole
    universe, and proclaims him unmatched as a bowman.
  language: English
  quote_policy: quoted
