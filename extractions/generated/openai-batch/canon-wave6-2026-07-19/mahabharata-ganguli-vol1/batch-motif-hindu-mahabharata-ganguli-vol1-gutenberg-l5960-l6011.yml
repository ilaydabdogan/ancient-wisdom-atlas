canonical_text:
  quote: ''
  summary: Vaisampayana reverently introduces his recitation of the Bharata from what
    he heard from Vyasa. He frames the narration as explaining the disunion of the
    Kurus and Pandavas, the dice-linked exile, and the struggle for rule. After their
    father's death the Pandavas return home, become skilled in archery, and arouse
    jealousy among the Kurus. Duryodhana, with Karna and Sakuni, persecutes them for
    sovereignty, including attempts on Bhima by poison, drowning in the Ganges, and
    serpent bites. Bhima survives. Vidura counters the plots and warns the Pandavas
    when Duryodhana arranges a house of lac and Dhritarashtra sends them to Varanavata
    with their mother.
  language: English
  quote_policy: summarized
