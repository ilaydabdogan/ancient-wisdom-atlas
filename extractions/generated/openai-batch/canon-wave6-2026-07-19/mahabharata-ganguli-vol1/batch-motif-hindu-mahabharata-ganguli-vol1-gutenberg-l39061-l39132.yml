canonical_text:
  quote: ''
  summary: Lomasa narrates that King Bhagiratha, learning that his forefathers had
    perished through Kapila and had not attained heaven, delegates his royal duties
    and goes to the Himalaya for austerities. After a thousand divine years, Ganga
    appears and asks his wish. He asks her to sprinkle the bodies of Sagara’s sons
    with her water and carry them to heaven. Ganga agrees but says that only Siva
    can sustain the force of her descent from the sky; Bhagiratha then performs penances
    at Kailasa and obtains Siva’s aid.
  language: English
  quote_policy: summarized
