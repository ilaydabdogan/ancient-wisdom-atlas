canonical_text:
  quote: ''
  summary: Janamejaya asks to hear about the Pandavas. Vaisampayana narrates how Pandu,
    hunting on the southern slopes of the Himavat, shoots a mating deer pair with
    five arrows. The male deer is revealed as the ascetic Kindama in deer form. Kindama
    rebukes Pandu, rejects the adequacy of his hunting and sacrificial precedents,
    curses him to die when moved by sexual desire and to be followed by the wife involved,
    then dies while Pandu grieves.
  language: English
  quote_policy: summarized
