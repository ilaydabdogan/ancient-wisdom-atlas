canonical_text:
  quote: ''
  summary: Mandapala, anxious for his flightless children during the Khandava forest
    fire, speaks with Lapita, who responds jealously and refers to Agni's promise
    to protect the children. Jarita returns after the fire has passed and finds the
    children alive, weeps, and embraces them. Mandapala arrives but is met with silence
    by Jarita and the children. Jarita rebukes him for leaving her for Lapita. Mandapala
    replies with a speech about jealousy, comparing Jarita to Arundhati's jealousy
    toward Vasishtha and describing Arundhati as a small smoky star. The children
    then come forward to worship Mandapala, who reassures them.
  language: English
  quote_policy: summarized
