canonical_text:
  quote: ''
  summary: Draupadi, called Krishna and Yajnaseni, is shown weeping and humiliated
    after being staked in a dice game. Bhima condemns Yudhishthira for staking her
    and threatens to burn his hands, while Arjuna restrains him by invoking morality
    and Kshatriya custom. Vikarna appeals to the assembled kings and elders to answer
    Draupadi's question, notes their silence, lists gambling among royal vices, and
    argues that Draupadi was not validly won because Yudhishthira had already lost
    himself and was urged on by Suvala.
  language: English
  quote_policy: summarized
