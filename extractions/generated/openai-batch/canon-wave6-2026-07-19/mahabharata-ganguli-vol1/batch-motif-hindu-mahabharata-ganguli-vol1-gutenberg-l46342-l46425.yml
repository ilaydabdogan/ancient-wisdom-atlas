    and Homa, and follow false reasoning toward mean things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fathers and sons enjoy each other's property; sons slay fathers and fathers
    slay sons without incurring reproach, and they may glory in such deeds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The whole world is described as filled with mleccha behavior, notions, and
