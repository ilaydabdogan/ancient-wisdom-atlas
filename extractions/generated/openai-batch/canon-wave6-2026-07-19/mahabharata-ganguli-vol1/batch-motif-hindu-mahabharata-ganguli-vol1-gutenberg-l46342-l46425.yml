canonical_text:
  quote: morality like a bull was among men, with all the four legs complete.
  summary: Markandeya resumes his discourse to the Pandavas and their companion, saying
    that by divine grace and intuition he will narrate the future condition of the
    world in the sinful age. He describes the four yugas as a progressive reduction
    of morality, then lists the social, ritual, economic, familial, and political
    disorders expected at the end of the age of Kali.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Markandeya says he has seen, heard, and known by intuition through the grace
    of the God of gods, and he begins to narrate the future history of the world during
    the sinful age.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes morality in the four ages as a bull whose legs or portions
    are progressively reduced from four to three, two, and one-fourth; it also says
    life, energy, intellect, and physical strength decrease in each yuga.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Kali age, the four social groups are said to practice morality deceitfully,
    while men use a net of virtue to deceive others, and false learning conceals Truth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says short life limits knowledge, lack of knowledge prevents wisdom,
    and covetousness, avarice, wrath, ignorance, and lust lead people into mutual
    animosity and desire to kill.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage says Brahmanas, Kshatriyas, and Vaisyas become reduced to equality
    with Sudras, while lower and intermediate social positions rise or fall relative
    to one another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage lists material and food conditions of the end of the age: flax
    robes are preferred, Paspalum frumentacea is valued as grain, wives are treated
    as the only friends, people live on fish, milk, goats, and sheep, and cows are
    extinct.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: People dig stream banks with spades and sow grain there, but those places
    prove barren.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ritual observers become covetous; people appropriate what belongs to others,
