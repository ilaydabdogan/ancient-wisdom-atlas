canonical_text:
  quote: ''
  summary: Yudhishthira warns Bhima that the place contains invisible spirits and
    discusses how the party might cross the difficult Himalayan region toward Kailasa
    and Gandhamadana. Bhima refuses to leave Yudhishthira, says Draupadi and the brothers
    wish to continue toward Arjuna, and offers to carry Draupadi and the twins over
    impassable terrain. Draupadi says she can proceed. Lomasa states that access to
    Gandhamadana is obtained only through asceticism. The party reaches Suvahu's Himalayan
    domain, is honorably received, leaves servants and equipment in his care, and
    then sets out cautiously with Draupadi, eager to see Arjuna.
  language: English
  quote_policy: summarized
