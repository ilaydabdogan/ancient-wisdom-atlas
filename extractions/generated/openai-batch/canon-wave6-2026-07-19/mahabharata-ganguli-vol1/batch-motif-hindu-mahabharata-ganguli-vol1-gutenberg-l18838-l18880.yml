canonical_text:
  quote: ''
  summary: Vyasa recounts an ancient divine sacrifice in Naimisha where Yama, occupied
    with slaying sacrificial animals, stops killing humans, causing death to be suspended
    and the human population to increase. The celestials appeal to Prajapati, who
    explains that human death will resume when Yama's sacrificial work ends. Afterward,
    Indra traces a golden lotus upstream along the Bhagirathi to the source of Ganga
    and finds a fiery-splendored woman whose tears become golden lotuses in the stream.
  language: English
  quote_policy: summarized
