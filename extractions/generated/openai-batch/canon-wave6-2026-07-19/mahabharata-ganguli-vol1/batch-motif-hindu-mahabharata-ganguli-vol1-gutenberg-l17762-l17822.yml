canonical_text:
  quote: ''
  summary: Arjuna asks why Kalmashapada sent his queen to Vasishtha and whether Vasishtha
    sinned. The Gandharva explains that Kalmashapada, under Saktri's curse, wandered
    hungry in the forest, seized and devoured a Brahmana despite the Brahmana's wife's
    plea, was cursed by her, and later appointed Vasishtha to beget an heir on Queen
    Madayanati because approaching his wife would bring his own death.
  language: English
  quote_policy: summarized
