canonical_text:
  quote: ''
  summary: Bhima addresses a king, son of Kunti/Pritha, arguing that mortal life and
    the passage of time make delay dangerous. He urges immediate recovery of the kingdom
    by force, describes suppressed wrath among himself and allies, rebukes the king’s
    pledge-bound restraint, argues that the group’s fame makes concealment impossible,
    warns of hostile kings and disguised spies, and proposes interpretive or ritual
    means to treat the exile term as fulfilled before concluding that fighting is
    the highest virtue for a Kshatriya.
  language: English
  quote_policy: summarized
