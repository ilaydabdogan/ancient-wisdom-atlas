canonical_text:
  quote: Vidhatri hath created Arjuna as an all-consuming Destroyer.
  summary: Janamejaya asks what Dhritarashtra said after hearing of Arjuna's feats.
    Vaisampayana reports that Dhritarashtra, after hearing from Dwaipayana of Arjuna's
    stay at Indra's abode, tells Sanjaya that his own sons are doomed before Arjuna,
    whose bow and arrows no warrior can withstand. Dhritarashtra recalls Arjuna's
    past deeds at Khandava and the Rajasuya, and imagines Arjuna's shafts scorching
    his sons and breaking the Bharata armies.
  language: English
  quote_policy: quoted
