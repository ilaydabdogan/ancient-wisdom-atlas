canonical_text:
  quote: ''
  summary: After Vaka is killed by Bhima, Bhima warns the other Rakshasas to stop
    killing humans, leaves Vaka’s body at a town gate, and returns unseen. The townspeople
    discover the corpse, learn whose turn it had been to carry food to Vaka, question
    the Brahmana, and hear a cover story meant to conceal the Pandavas. The community
    rejoices and establishes a festival centered on worship of Brahmanas.
  language: English
  quote_policy: summarized
