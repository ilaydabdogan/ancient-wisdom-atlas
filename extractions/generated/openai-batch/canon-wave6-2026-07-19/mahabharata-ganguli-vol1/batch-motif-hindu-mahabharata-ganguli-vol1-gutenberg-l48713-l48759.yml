canonical_text:
  quote: ''
  summary: Markandeya reports to Yudhishthira the virtuous fowler's reply to a Brahmana.
    The fowler describes a sequence of moral decline from knowledge into desire, attachment,
    envy, avarice, hypocrisy, and threefold sin, contrasted with the spiritually discerning
    virtuous person. The Brahmana praises the fowler's exposition. The fowler then
    speaks of honoring Brahmanas and presents a brief Brahmanic cosmology in which
    the universe is Brahma and includes the great elements, sense properties, mind,
    intelligence, egoism, senses, soul, and the three moral qualities.
  language: English
  quote_policy: summarized
