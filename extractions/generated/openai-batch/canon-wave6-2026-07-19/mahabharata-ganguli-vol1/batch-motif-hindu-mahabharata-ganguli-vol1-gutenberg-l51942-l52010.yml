canonical_text:
  quote: ''
  summary: Karna conducts a wide military campaign, subduing Drupada and many rulers
    across north, east, south, and west, including mountain regions and foreign peoples,
    and gains tribute and wealth. He returns to Hastinapura, where Duryodhana honors
    and praises him as his refuge. Karna then visits Dhritarashtra and Gandhari, taking
    Dhritarashtra's feet like a son; afterward Duryodhana and Sakuni believe the Pandavas
    have already been defeated through Karna.
  language: English
