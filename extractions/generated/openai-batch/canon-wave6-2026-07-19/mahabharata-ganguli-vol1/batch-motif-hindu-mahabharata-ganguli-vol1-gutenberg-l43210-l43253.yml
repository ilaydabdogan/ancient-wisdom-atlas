canonical_text:
  quote: ''
  summary: A speaker describes the slopes and summits of Gandhamadana as a richly
    flowering, mineral-filled, water-filled mountain inhabited or visited by birds,
    elephants, snakes, sages, Kinnaras, Gandharvas, Kimpurushas, and Apsaras. The
    party with Draupadi and Brahmanas rejoices in the place, then sees and approaches
    the hermitage of the austere royal sage Arshtishena.
  language: English
