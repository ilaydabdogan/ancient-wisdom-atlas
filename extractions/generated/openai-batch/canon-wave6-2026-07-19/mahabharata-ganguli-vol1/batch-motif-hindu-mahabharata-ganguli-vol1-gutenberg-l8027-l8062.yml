  summary: After a celestial messenger establishes the son's purity, King Dushmanta
    accepts his son and wife, explains his concern for public recognition of the private
    union, names the child Bharata, and installs him as heir apparent. Bharata becomes
    a universal ruler, subdues kings, performs major sacrifices with Kanwa as priest,
    and becomes the eponymous ancestor of the Bharata race.
