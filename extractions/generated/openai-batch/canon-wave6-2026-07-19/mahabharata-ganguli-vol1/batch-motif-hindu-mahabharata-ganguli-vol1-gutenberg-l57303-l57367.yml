canonical_text:
  quote: ''
  summary: The Pandavas, ordered to spend a thirteenth year undiscovered, ask the
    ascetics with them in the forest for permission to depart into concealment. Yudhishthira
    grieves and swoons, but Dhaumya consoles him by citing gods and high-souled beings
    who used disguise or concealment to overcome enemies. Bhimasena pledges obedience
    to Yudhishthira, the Brahmanas bless the Pandavas, and the heroes set out with
    Krishna and Dhaumya to plan their life of non-recognition.
  language: English
  quote_policy: summarized
