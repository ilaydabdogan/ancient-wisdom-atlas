canonical_text:
  quote: '"Because the Vasus have stolen my cow ... therefore, shall they certainly
    be born on earth!"'
  summary: Santanu asks Ganga why the Vasus were cursed to human birth and why their
    child must live among men. Ganga explains that Dyu, aided by other Vasus, stole
    the cow of plenty Nandini from the ascetic Apava/Vasishtha after Dyu's wife desired
    the cow's youth-preserving milk for her friend. Apava cursed the Vasus to be born
    on earth, later mitigating the curse so all but Dyu would be quickly freed. The
    Vasus asked Ganga to throw them into water at birth; Dyu remained as the child
    later named Gangeya and Devavrata.
  language: English
  quote_policy: quoted
