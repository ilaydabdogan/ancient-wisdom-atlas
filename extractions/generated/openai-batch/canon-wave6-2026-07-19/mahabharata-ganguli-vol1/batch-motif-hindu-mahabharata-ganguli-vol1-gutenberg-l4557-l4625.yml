canonical_text:
  quote: ''
  summary: Sringin hears that King Parikshit placed a dead snake on his silent ascetic
    father. In anger, Sringin curses Parikshit to be taken to Yama within seven nights
    by Takshaka, king of serpents. Sringin then tells his father, who rebukes him,
    arguing that ascetics should forgive kings, that Parikshit acted from fatigue
    and ignorance, and that righteous kings protect subjects, sacrifices, social order,
    rain-producing rites, and religion.
  language: English
  quote_policy: summarized
