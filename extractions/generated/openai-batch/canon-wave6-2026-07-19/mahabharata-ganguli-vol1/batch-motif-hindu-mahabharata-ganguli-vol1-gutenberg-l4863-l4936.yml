canonical_text:
  quote: The rat that thou beholdest is Time of infinite strength.
  summary: The ascetic Jaratkaru, wandering in severe austerity, sees his ancestral
    Pitris hanging head-down in a hole by a nearly severed cord of virana roots. They
    explain that loss of descendants has caused their fall from a sacred region, that
    the cord represents their lineage, that the rat gnawing it is Time, and that only
    Jaratkaru taking a wife and begetting children can save them.
  language: English
  quote_policy: quoted
