canonical_text:
  quote: ''
  summary: Kunti and her sons wake and question Hidimva. Hidimva identifies herself
    as the sister of the Rakshasa who rules the forest, says she was sent to kill
    them, but chose Bhima as her husband after seeing him. The brothers observe Bhima
    fighting the Rakshasa; Arjuna offers help and warns that Rakshasas grow stronger
    and deceptive at twilight. Bhima invokes the strength of Vayu, kills and breaks
    the cannibal Rakshasa, and the party departs with Kunti, followed by Hidimva.
  language: English
  quote_policy: summarized
