canonical_text:
  quote: These my parents, worshipful sir, are the idols that I worship; whatever
    is due to the gods, I do unto them.
  summary: Markandeya narrates how a fowler, after explaining religious and salvific
    doctrine to a Brahmana, brings him into an inner apartment to see his aged parents.
    The fowler prostrates before them, receives their blessings, introduces the Brahmana,
    and explains that he worships and serves his parents as his supreme gods, comparing
    them to sacred fires, sacrifices, and the Vedas. He says service to parents, sacred
    fire, the soul, and the spiritual preceptor is a householder’s duty.
  language: English
  quote_policy: quoted
