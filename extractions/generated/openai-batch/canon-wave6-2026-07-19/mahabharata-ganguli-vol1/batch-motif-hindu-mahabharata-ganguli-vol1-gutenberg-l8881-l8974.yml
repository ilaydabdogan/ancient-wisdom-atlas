canonical_text:
  quote: ''
  summary: Devayani becomes jealous after hearing of Sarmishtha's child. Sarmishtha
    first explains the child through a virtuous Rishi, but later Devayani sees Sarmishtha's
    sons with Yayati and the children identify Yayati as their father. Devayani accuses
    Sarmishtha and Yayati, leaves for her father Sukra/Usanas, and complains that
    Yayati has deviated from rectitude. Sukra curses Yayati with decrepitude; Yayati
    defends his action as a duty toward a woman in season, but Sukra rejects the defense
    and calls the act a theft against his command.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Devayani hears of Sarmishtha's child, becomes jealous, and asks Sarmishtha
    what sin she has committed by yielding to lust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sarmishtha says that a virtuous, Veda-knowing Rishi capable of granting boons
    fulfilled her wish, and Devayani says she has no anger if the account is true.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yayati has two sons by Devayani, named Yadu and Turvasu, and Sarmishtha has
    three sons by the royal sage, named Drahyu, Anu, and Puru.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Devayani and Yayati go into a solitary part of the woods in the king's park
    and see three very beautiful children playing.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Devayani asks the children about their lineage and father, they point
    to the king and name Sarmishtha as their mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The children approach the king to clasp his knees, but the king does not caress
    them in Devayani's presence; the children leave toward their mother while weeping.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Devayani learns the secret from the children's affection for the king and
    accuses Sarmishtha of injuring her and returning to an Asura custom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sarmishtha says she acted rightly, saying that when Devayani chose the king
    as husband she also chose him, and that a friend's husband is, by usage, one's
    own husband as well.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Devayani tells Yayati he has wronged her, leaves with tears for her father,
    and Yayati follows while trying to appease her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Devayani tells her father that Sarmishtha has three sons by Yayati while she
    has only two, and says Yayati has deviated from rectitude.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sukra curses Yayati with invincible decrepitude; Yayati answers that he acted
    to avoid sin by responding to Sarmishtha's request in her season.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sukra replies that Yayati was dependent on him, should have awaited his command,
    acted falsely in duty, and was guilty of theft.
  category: speech
  evidence_refs:
  - ev:8
