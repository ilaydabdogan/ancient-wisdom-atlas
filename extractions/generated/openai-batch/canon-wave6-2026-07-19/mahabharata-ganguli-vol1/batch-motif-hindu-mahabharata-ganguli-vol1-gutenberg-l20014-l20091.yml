canonical_text:
  quote: ''
  summary: Narada recounts how the Asura brothers Sunda and Upasunda, after conquering
    and enjoying the three worlds, both desire Tilottama when she appears before them.
    Their rivalry over her turns to rage, and they kill each other with maces. The
    Grandsire rewards Tilottama and restores the worlds to Indra. Narada then warns
    the Pandavas to prevent quarrels over Draupadi, and they institute a rule requiring
    twelve years of forest celibacy for any brother who intrudes on another while
    with her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Asura brothers subjugate the earth and three worlds and gather treasures
    from gods, Gandharvas, Yakshas, Nagas, Rakshasas, and earthly kings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After becoming unrivaled, the brothers give up exertion and devote themselves
    to pleasure, including women, perfumes, wreaths, food, drink, houses, woods, gardens,
    hills, and forests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers go to a level stony tableland of the Vindhya range, overgrown
    with blossoming trees, where women dance, play music, and sing praises to them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tilottama approaches slowly, wearing a single piece of red silk and plucking
    wild flowers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers, described as intoxicated by wine, boons, strength, wealth, and
    desire, see Tilottama and each seeks her for himself.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sunda seizes Tilottama by her right hand, and the brothers verbally dispute
    possession of her, each claiming her as wife.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The brothers become enraged, forget their mutual affection, take up maces,
    and strike each other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Both Asuras fall to the ground with bloodied bodies, and the attending women
    and other Asuras flee in grief and fear to the nether regions.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The Grandsire arrives with celestials and Rishis, praises Tilottama, grants
    her a boon of roaming in the Adityas' region with a splendour others cannot long
    behold, restores the worlds to Indra, and departs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Narada states that the united Asuras killed each other in wrath for Tilottama
    and advises the Bharata princes to make arrangements so they do not quarrel over
    Draupadi.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Pandavas establish a rule in Narada's presence concerning access to Draupadi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The rule requires any brother who sees another sitting with Draupadi to retire
    to the forest for twelve years as a Brahmacharin, and the narrator says no dispute
    arose afterward.
  category: sequence
  evidence_refs:
  - ev:10
