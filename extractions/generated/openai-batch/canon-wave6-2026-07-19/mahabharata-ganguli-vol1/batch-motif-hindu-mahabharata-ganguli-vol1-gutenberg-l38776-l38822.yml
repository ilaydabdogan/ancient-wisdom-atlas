canonical_text:
  quote: '"began to drink up the sea"'
  summary: Lomasa recounts how a blessed saint, offspring of Mitra and Varuna, drinks
    up the ocean before the assembled gods and saints. The gods praise him as protector
    and creator, rejoice when the ocean is made waterless, and use celestial weapons
    to slaughter the demons. A remnant of the Kalakeyas flees through Earth to the
    nether regions. When the gods ask the saint to refill the sea, he says the water
    has been digested, so the gods go with Vishnu to Brahma to consult about replenishing
    it.
  language: English
  quote_policy: quoted
