canonical_text:
  quote: ''
  summary: After defeat, the sons of Pritha prepare to leave for forest exile, exchange
    royal clothing for deer-skins, and are mocked by Dussasana and Duryodhana. Bhima
    restrains immediate action but vows future vengeance, including killing Duryodhana
    and Dussasana and drinking Dussasana's blood. Arjuna remarks that the fourteenth
    year will reveal the resolutions of superior men.
  language: English
  quote_policy: summarized
