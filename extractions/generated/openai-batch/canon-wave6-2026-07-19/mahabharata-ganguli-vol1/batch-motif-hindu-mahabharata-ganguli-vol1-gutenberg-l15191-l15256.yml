canonical_text:
  quote: ''
  summary: After the lac house burns, townspeople find Purochana and the bodies of
    a Nishada woman with her five sons, assume the Pandavas and Kunti have died, accuse
    Duryodhana, and send word to Dhritarashtra. Dhritarashtra orders funeral rites
    and offers water oblations while Vidura, knowing the truth, does not grieve much.
    Meanwhile the Pandavas and Kunti escape from Varanavata, cross the Ganga by boat,
    enter a dense forest, and Bhima carries Kunti and his brothers onward.
  language: English
  quote_policy: summarized
