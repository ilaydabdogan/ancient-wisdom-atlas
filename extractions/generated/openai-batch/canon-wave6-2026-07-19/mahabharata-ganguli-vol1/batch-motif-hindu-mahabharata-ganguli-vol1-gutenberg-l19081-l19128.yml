canonical_text:
  quote: ''
  summary: After Drupada's alliance with the Pandavas, women of his household honor
    Kunti. The female Krishna, newly married and dressed in red silk with an auspicious
    wrist-thread, salutes Kunti, who blesses her as an ideal wife, future mother,
    queen, and participant in royal prosperity and sacrifice. After the marriage,
    the male Krishna sends the Pandavas lavish gifts, which Yudhishthira accepts joyfully.
  language: English
