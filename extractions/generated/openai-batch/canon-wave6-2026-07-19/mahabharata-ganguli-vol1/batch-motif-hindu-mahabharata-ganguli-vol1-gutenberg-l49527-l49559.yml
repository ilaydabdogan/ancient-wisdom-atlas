canonical_text:
  quote: Listen now to the story of the birth of the intelligent Kartikeya.
  summary: Markandeya introduces the birth of Kartikeya, recalls conflict between
    gods and Asuras, and narrates how Indra, seeking a leader for the celestial army,
    goes to the Manasa mountains. There he hears a woman cry for rescue, confronts
    the Asura Kesin who holds her, defeats Kesin's attacks with his thunderbolt, and
    asks the woman who she is.
  language: English
  quote_policy: quoted
