canonical_text:
  quote: ''
  summary: Vasudeva returns to Dwaraka after the Rajasuya sacrifice, learns of Salwa's
    invasion, vows not to return until Salwa and his metal car are destroyed, receives
    blessings, and departs with army and conch. He pursues Salwa to the ocean, where
    Salwa's aerial car fights from above the sea. A battle follows with arrows, mantras,
    demons falling into the ocean, the Panchajanya conch, Salwa's illusions, counter-illusions,
    mountain peaks, alternating light and darkness, showers of coals, ash, and weapons,
    and a bewildering sky filled with many suns, moons, and stars before Vasudeva
    uses the Pragnastra and resumes the fight.
  language: English
  quote_policy: summarized
