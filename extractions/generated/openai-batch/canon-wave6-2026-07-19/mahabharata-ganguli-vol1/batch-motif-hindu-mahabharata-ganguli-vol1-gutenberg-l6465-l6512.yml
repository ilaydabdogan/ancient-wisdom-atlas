canonical_text:
  quote: ''
  summary: 'A genealogical passage recounts notable births and lineages: Drona from
    Bharadwaja''s seed in a pot; Kripi and Kripa as twins from Gautama''s seed on
    reeds; Dhrishtadyumna from sacrificial fire with bow in hand to destroy Drona;
    Draupadi from the sacrificial altar; Sakuni as a cursed foe of virtue; Dhritarashtra,
    Pandu, and Vidura from Krishna Dwaipayana; the Pandavas from named deities; Dhritarashtra''s
    many sons; later descendants of the Pandavas; Sikhandin''s transformation into
    a male by Yaksha Sthuna; and the vast assembly of monarchs for the Kuru battle.'
  language: English
  quote_policy: summarized
