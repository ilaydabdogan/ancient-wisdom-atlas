canonical_text:
  quote: ''
  summary: 'Ashtaka asks Yayati how followers of the four modes of life should conduct
    themselves to gain religious merit. Yayati gives rules for the Brahmacharin, Grihastha,
    Muni, Bhikshu, and Vanaprastha, then explains the character of the Muni: withdrawal
    from worldly objects, silence, non-injury, austerity, yoga meditation, communion
    with Brahma, identification with the universe, and salvation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashtaka asks about the conduct required of Grihasthas, Bhikshus, Brahmacharins,
    and Vanaprashthas in order to acquire religious merit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yayati says a Brahmacharin should live in the preceptor's abode, receive lessons
    when summoned, serve the preceptor, rise before and sleep after the preceptor,
    be humble, control passions, be patient and vigilant, and remain devoted to studies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yayati says a Grihastha should gain wealth honestly, perform sacrifices, give
    charity, practice hospitality, and not use anything without first giving a portion
    to others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yayati says a Muni should avoid vicious acts, give charity, and never inflict
    pain on any creature.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yayati describes a true Bhikshu as one who does not support himself by manual
    arts, controls passions, avoids worldly concerns, does not sleep under a householder's
    roof, has no wife, and travels gradually across the country.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yayati says a learned man should adopt the Vanaprastha mode after necessary
    rites and after controlling appetites and desire for possessions; dying in the
    woods in this mode affects ten generations including himself.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yayati defines a Muni paradoxically as one who may dwell in the woods with
    an inhabited place near, or in an inhabited place with the woods near.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yayati says a Muni withdraws from worldly objects; such a person may live
    in woods or a hamlet, lack pride of family, birth, or learning, wear scant robes
    while regarding himself as richly clothed, and remain content with minimal food.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yayati says a person with controlled passions who adopts silence, refrains
    from action, has no desire, eats clean food, avoids injury, and is pure in heart
    achieves success and conquers this world and the highest world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yayati says that when the Muni sits in yoga meditation and is indifferent
    to happiness and misery, honour and insult, he leaves the world, enjoys communion
    with Brahma, becomes identified with the whole universe, and attains salvation.
  category: sequence
  evidence_refs:
  - ev:8
