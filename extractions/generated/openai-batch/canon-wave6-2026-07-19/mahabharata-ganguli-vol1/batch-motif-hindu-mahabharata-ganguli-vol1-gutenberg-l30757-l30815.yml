canonical_text:
  quote: ''
  summary: Vasudeva narrates how Daruka's son, Pradyumna's charioteer, explains that
    he withdrew from battle to protect the wounded and unconscious warrior. He then
    drives the horses back with extraordinary skill. Salwa attacks with shafts, weapons,
    and Asura illusion; Pradyumna counters with the Brahma weapon and wounds Salwa.
    When Pradyumna prepares a universally fatal arrow, celestial messengers forbid
    him to kill Salwa, saying the Creator has ordained Salwa's death at Krishna's
    hands. Pradyumna withdraws the arrow, and Salwa retreats through the sky in his
    precious-metal car.
  language: English
  quote_policy: summarized
