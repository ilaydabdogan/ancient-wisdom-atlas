canonical_text:
  quote: ''
  summary: Sauti recounts that Kadru and Vinata wager over the colour of Uchchaihsravas,
    with slavery as the penalty. Kadru attempts to arrange deception by ordering her
    snake sons to become black hair on the horse's tail; when they refuse, she curses
    them to be consumed by Agni in Janamejaya's snake-sacrifice. Brahman and the gods
    sanction the curse because of the snakes' dangerousness, and Brahman consoles
    Kasyapa and gives him knowledge for neutralising poison.
  language: English
  quote_policy: summarized
