canonical_text:
  quote: ''
  summary: Yudhishthira questions a serpent about salvation, the relative merits of
    truth, alms-giving, kind speech, and non-injury, the postmortem course of beings,
    transmigration, Atman and sense-perception, and the distinction between mind and
    intellect. The serpent answers with ethical and metaphysical teaching involving
    karma, heaven, animal rebirth, the Supreme Spirit, the senses, mind, and intellect.
  language: English
  quote_policy: summarized
