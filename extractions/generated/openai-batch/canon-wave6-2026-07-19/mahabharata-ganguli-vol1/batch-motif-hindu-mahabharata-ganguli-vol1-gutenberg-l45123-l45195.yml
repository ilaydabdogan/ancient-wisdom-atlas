  evidence_refs:
  - ev:3
- id: obs:8
  text: Yudhishthira asks how the dissociated spirit becomes cognizant of sound, touch,
    form, flavor, and taste, and asks whether these are perceived simultaneously by
    the senses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The serpent says Atman enters a bodily dwelling and becomes cognizant of objects
