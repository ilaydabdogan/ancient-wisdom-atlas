canonical_text:
  quote: belonging unto the sons of Pandu, and brought one after another by the kings
    of the earth
  summary: Duryodhana describes to the addressed king the immense wealth and tribute
    brought by many kings, Brahmanas, tribes, and peoples to Yudhishthira and the
    sons of Pandu. The gifts include animals, textiles, skins, gold, jewels, weapons,
    attendants, clarified butter in golden vessels, and royal equipment. Many groups
    wait at the palace gate and are refused entry, while some presenters obtain admission
    into Yudhishthira's sacrificial palace.
  language: English
  quote_policy: quoted
