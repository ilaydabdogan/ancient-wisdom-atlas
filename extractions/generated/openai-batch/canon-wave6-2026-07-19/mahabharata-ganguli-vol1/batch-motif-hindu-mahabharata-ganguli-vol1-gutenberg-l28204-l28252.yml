canonical_text:
  quote: ''
  summary: Yudhishthira asks Dhritarashtra for instruction and promises obedience.
    Dhritarashtra blesses him, commands him to rule his own kingdom, counsels peace,
    forbearance, and remembrance of good rather than hostility, explains his permitting
    of the dice match as policy, praises Yudhishthira, Vidura, and the Pandava brothers,
    and tells Yudhishthira to return with brotherly love toward his cousins. Yudhishthira
    then departs with his brothers and Draupadi in cloud-colored cars for Indraprastha.
  language: English
  quote_policy: summarized
