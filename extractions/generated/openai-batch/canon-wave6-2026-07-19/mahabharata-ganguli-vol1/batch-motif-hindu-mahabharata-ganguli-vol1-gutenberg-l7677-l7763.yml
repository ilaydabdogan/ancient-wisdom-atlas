canonical_text:
  quote: ''
  summary: Dushmanta asks Sakuntala to marry him by the Gandharva form and argues
    that this form is permitted for Kshatriyas. Sakuntala agrees only if their future
    son becomes heir-apparent. Dushmanta accepts, marries her, promises to bring her
    to his capital, and departs. Kanwa returns, knows by spiritual insight what has
    happened, approves the Gandharva union, prophesies a mighty son, and grants Sakuntala
    a boon; she asks that the Paurava monarchs remain virtuous and secure on their
    thrones.
  language: English
  quote_policy: summarized
