canonical_text:
  quote: the Brahmanas construct a Vedic boat wherewith they save both others and
    themselves
  summary: Markandeya instructs Yudhishthira on the merit of honoring Brahmanas, feeding
    guests, giving cows, bulls, land, food, water, shelter, and other gifts. He links
    food with Prajapati, the Year, and sacrifice, and says certain givers avoid Yama’s
    admonitions or attain heaven. Yudhishthira then asks about the distance and passage
    to Yama’s region.
  language: English
