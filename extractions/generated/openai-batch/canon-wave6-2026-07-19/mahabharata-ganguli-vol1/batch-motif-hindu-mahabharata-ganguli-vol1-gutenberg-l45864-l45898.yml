canonical_text:
  quote: ''
  summary: Yudhishthira humbly addresses Markandeya as an exceptionally long-lived
    seer who has witnessed repeated cosmic dissolution and creation. He describes
    Brahma asleep on a lotus during an ocean-like destruction of the world, Brahma's
    later re-creation of beings, Markandeya's meditative vision of the deity, and
    asks Markandeya to explain the causes of things.
  language: English
  quote_policy: summarized
