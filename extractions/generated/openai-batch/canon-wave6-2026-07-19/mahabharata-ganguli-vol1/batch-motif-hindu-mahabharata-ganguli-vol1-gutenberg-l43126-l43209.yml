canonical_text:
  quote: ''
  summary: Yudhishthira, his brothers, and their companions travel on foot through
    mountain terrain, following a route directed by Vrishaparva, passing rocks and
    caves, reaching Sweta and Gandhamadana. Gandhamadana is described as a sacred
    mountain and forest inhabited or frequented by supernatural beings, animals, birds,
    flowering and fruiting trees, lakes, lotuses, bees, and peacocks. The Pandavas
    enter the forest with wonder, and Yudhishthira praises its beauty to Bhima.
  language: English
