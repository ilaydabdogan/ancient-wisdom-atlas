  summary: After being addressed by a Yaksha, Bhima drinks water without answering
    the Yaksha's questions and falls dead. Yudhishthira waits for his brothers, worries
    over their delay, considers whether the forest, beasts, lack of water, or disregard
    of a mighty being may be responsible, and then enters a silent forest where he
    sees a beautiful lake or tank adorned with flowers, lotuses, and trees.
