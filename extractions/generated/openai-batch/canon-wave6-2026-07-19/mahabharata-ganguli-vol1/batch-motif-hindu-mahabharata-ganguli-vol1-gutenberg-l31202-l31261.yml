canonical_text:
  quote: ''
  summary: The Pandavas live in a forest dwelling by the Saraswati after losing their
    kingdom. Yudhishthira honors ascetics, Dhaumya performs rites, and the sage Markandeya
    visits. Seeing the exiled royal figures, Markandeya remembers Rama’s forest exile
    and teaches that even the mighty should not act unrighteously. He praises Yudhishthira’s
    truth and virtue, predicts his recovery of prosperity from the Kauravas after
    exile, and departs northward.
  language: English
  quote_policy: summarized
