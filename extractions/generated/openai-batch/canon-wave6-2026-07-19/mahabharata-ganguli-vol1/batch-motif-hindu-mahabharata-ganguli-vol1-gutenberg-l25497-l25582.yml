canonical_text:
  quote: ''
  summary: Sisupala rebukes Bhishma for praising Krishna, dismisses several deeds
    attributed to Krishna, argues that moral rules forbid harming women, kine, Brahmanas,
    and those whose food or shelter has been accepted, attacks Bhishma's conduct regarding
    Amva and celibacy, and then tells a fable of an old swan who preached virtue while
    eating entrusted eggs until the other birds discovered and killed him.
  language: English
  quote_policy: summarized
