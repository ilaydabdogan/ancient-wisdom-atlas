canonical_text:
  quote: ''
  summary: 'Yama explains that he has personally come for Satyavan because of Satyavan''s
    virtues, extracts Satyavan''s thumb-sized vital essence with a noose, and proceeds
    south. Savitri follows him, insists that she will go where her husband goes, and
    repeatedly addresses Yama with arguments about duty, friendship, virtue, and mercy.
    Pleased by her words, Yama grants successive boons excepting Satyavan''s life:
    restored sight and strength for her father-in-law, restoration of that king''s
    kingdom and duties, and a hundred sons for Savitri''s father. The passage ends
    while Savitri continues speaking and identifies Yama as Vaivaswata, son of Vivaswat.'
  language: English
  quote_policy: summarized
