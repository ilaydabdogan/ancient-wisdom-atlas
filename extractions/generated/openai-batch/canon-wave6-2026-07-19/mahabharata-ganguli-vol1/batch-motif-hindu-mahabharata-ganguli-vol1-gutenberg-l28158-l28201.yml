canonical_text:
  quote: Draupadi became unto the sons of Pandu as their salvation.
  summary: Karna says Draupadi saved the sons of Pandu like a boat in an ocean of
    distress. Bhima laments the insult to their wife, cites a saying about three lights
    in a person, threatens violent revenge, and manifests fiery wrath. Arjuna counsels
    restraint, and Yudhishthira pacifies Bhima before approaching Dhritarashtra with
    joined hands.
  language: English
  quote_policy: quoted
