canonical_text:
  quote: ''
  summary: Arjuna narrates how Matali drove him to Hiranyapura, where Danavas attacked
    him. The demons took refuge in a mobile aerial city that moved through sky, earth,
    and water. Arjuna attacked the city and enemy hosts, then invoked and discharged
    the Raudra weapon after bowing to Raudra/Sarva. A fierce multiform manifestation
    appeared, the universe filled with varied beings and forms, and the Danavas were
    destroyed; Arjuna then bowed to the Destroyer of Tripura while Matali rejoiced.
  language: English
  quote_policy: summarized
