- id: obs:1
  text: Arjuna says he asked Matali to go to the city and declared that he would annihilate
    the enemies of the lord of the celestials with weapons.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Matali brought Arjuna near Hiranyapura on a celestial chariot yoked with steeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sons of Diti, described as armored and ornamented, attacked Arjuna with
    arrows, bhallas, clubs, two-edged swords, and tomaras.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Arjuna resisted the incoming weapons with shafts, confused the Danavas in
    battle, and cut off many heads with flaming arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Danavas took shelter in their city, and the city rose into the firmament
    through Danava illusion.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:6
  text: The Daityas were supported on an unearthly aerial city that moved at will,
    was compared to the sun, entered the earth, rose upward, moved crookedly, and
    submerged into water.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Arjuna attacked the mobile city with shafts and celestial weapons, and the
    city, battered by iron shafts, fell to the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Sixty thousand enemy cars surrounded Arjuna, and he destroyed them with feathered
    sharpened shafts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: During the extended conflict, Arjuna could not injure the enemy hosts with
    showers of shafts, and he became pained and fearful.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Arjuna collected himself, bowed to Raudra, wished welfare for all beings,
    fixed the weapon called Raudra, bowed to the three-eyed Sarva, and released the
    weapon from the Gandiva.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Arjuna beheld a male person with three heads, nine eyes, three faces, six
    arms, flaming hair, and a dress of mighty serpents.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:12
  text: When the Raudra weapon was hurled, thousands of forms appeared, including
    animals, serpents, mountains, seas, celestials, sages, Gandharvas, ghosts, Yakshas,
