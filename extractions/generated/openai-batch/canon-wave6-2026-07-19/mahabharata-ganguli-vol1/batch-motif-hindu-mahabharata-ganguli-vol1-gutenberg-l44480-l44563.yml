  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The universe became filled with the varied forms produced after the weapon
    was hurled.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:14
  text: The Danavas were wounded by beings of various appearances and were destroyed;
