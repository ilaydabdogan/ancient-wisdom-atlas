canonical_text:
  quote: regarded him as the one single hero on earth even as the celestials regard
    Indra in heaven
  summary: King Pandu marries Madri, spends time with his two wives, then departs
    from his capital for a campaign after saluting elders and receiving blessings.
    He defeats multiple peoples and rulers, including Dhirga of Magadha, makes kings
    vassals of the Kurus, receives tribute, and returns to Hastinapura with great
    wealth. Citizens praise him for reviving dynastic fame, Bhishma receives him joyfully,
    and Pandu enters the capital amid ceremonial instruments.
  language: English
  quote_policy: quoted
