canonical_text:
  quote: '"the genealogy of all the principal creatures"'
  summary: The passage enumerates divine groups and then narrates genealogies of gods,
    sages, personified powers, birds, animals, trees, serpents, and notable beings
    such as Sukra, Rama, Garuda, and Aruna. It also states that reciting or hearing
    this genealogy removes sins, gives knowledge, and leads to a high after-life state.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage lists the thirty-three gods as the eight Vasus, eleven Rudras,
    twelve Adityas, Prajapati, and Vashatkara, and groups divine beings into Pakshas,
    Kulas, and Ganas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The recitation of the Ganas of the gods is said to wash men of all sins.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhrigu emerges by ripping open the breast of Brahman; Sukra is identified
    as Bhrigu's learned son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sukra becomes a planet, traverses the skies, pours and withholds rain, dispenses
    and remits calamities, and sustains creatures in the three worlds by command of
    the Self-existent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sukra divides himself in two through ascetic power and becomes spiritual guide
    of both the Daityas and the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bhrigu line continues through Chyavana, Arushi, Aurva, Richika, Jamadagni,
    and Rama; Rama is described as skilled in weapons and as slayer of the Kshatriyas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Brahman has two other sons, Dhatri and Vidhatri, and a sister Lakshmi whose
    abode is among lotuses and whose spiritual sons are sky-ranging horses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Divi, daughter of Sukra, becomes Varuna's eldest wife and bears Vala and Sura.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Adharma is born when creatures begin devouring one another; Adharma's wife
    is Niriti, and their offspring include Rakshasas, Bhaya, Mahabhaya, and Mrityu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Tamra's daughters are named as mothers of crows, hawks, fowl, vultures, ducks,
    swans, Chakravakas, and parrots.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Krodha's wrathful daughters are named as progenitors of deer, bears, elephants,
    simians, horses, lions, tigers, leopards, and other animals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Surabhi gives birth to daughters including Rohini, Gandharvi, Vimala, and
    Anala; Rohini produces kine, Gandharvi produces horses, and Anala produces seven
    kinds of pulpy-fruit trees.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Syeni, wife of Aruna, bears Sampati and Jatayu; Surasa bears the Nagas, Kadru
    bears Punnagas or snakes, and Vinata bears Garuda and Aruna.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The speaker concludes that hearing the genealogy fully cleanses a person of
    sins, gives great knowledge, and leads to the first of states in after-life.
  category: speech
  evidence_refs:
  - ev:7
