- id: motif:7
  label: sacred genealogy as purifying knowledge
  taxonomy_refs:
  - wisdom
  basis: The speaker says that reciting or listening to the genealogy cleanses sins,
    gives great knowledge, and leads to the first of states in after-life.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: The precise ritual context of the recitation is not specified in this
