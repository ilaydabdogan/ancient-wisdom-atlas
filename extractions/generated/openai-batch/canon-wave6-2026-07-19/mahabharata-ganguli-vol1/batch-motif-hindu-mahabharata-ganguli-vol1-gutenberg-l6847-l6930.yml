candidate_motifs:
- id: motif:1
  label: cosmic genealogy of divine and creature classes
  taxonomy_refs:
  - divine_parent_child
  basis: The passage arranges gods, sages, personified powers, animals, trees, serpents,
    and birds through parent-child genealogies.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage is primarily genealogical and classificatory; it does not
    present a single narrative quest or conflict arc.
- id: motif:2
  label: extraordinary birth from a body part
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Bhrigu emerges from Brahman's breast and Aurva emerges from Arushi's thigh;
    Chyavana is also described as emerging from the womb in anger.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the ritual or symbolic meaning of these body-births.
- id: motif:3
  label: ascetic self-division into dual guidance
  taxonomy_refs:
  - duality
  - wisdom
  basis: Sukra divides himself in two by ascetic power and becomes spiritual guide
    of both Daityas and gods.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The text gives the action and role but little narrative detail about how
    the dual guidance operates.
- id: motif:4
  label: planetary being regulating rain and calamity
  taxonomy_refs:
  - divine_judgment
  basis: Sukra becomes a planet and is tasked with pouring and withholding rain and
    dispensing or remitting calamities for the life of creatures in the three worlds.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The taxonomy reference is broad; the passage mentions calamity and regulation
    but does not explicitly describe moral judgment.
- id: motif:5
  label: maternal origins of animal species
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: Tamra, Krodha, Surabhi, Syeni, Surasa, Kadru, and Vinata or their daughters
    are credited with producing classes of birds, animals, serpents, and sky-associated
    beings.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: Not every maternal figure is explicitly called a goddess in this passage.
- id: motif:6
  label: serpent lineage from named mothers
  taxonomy_refs:
  - serpent
  - divine_parent_child
  basis: Surasa bears the Nagas, and Kadru bears the Punnagas, glossed as snakes.
  evidence_refs:
