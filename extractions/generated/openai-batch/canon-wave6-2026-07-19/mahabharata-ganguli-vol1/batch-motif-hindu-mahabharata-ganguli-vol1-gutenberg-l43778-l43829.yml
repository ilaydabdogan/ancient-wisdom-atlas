canonical_text:
  quote: ''
  summary: The Pandavas dwell on an excellent mountain while awaiting Arjuna. The
    mountain is described as beautiful, luminous, filled with trees, flowers, lakes,
    birds, gems, and views of the Sun’s rising and setting. While grieving Arjuna’s
    absence, they recite the Vedas, perform rituals, keep vows, practice Yoga, and
    think constantly of him. Arjuna, who had gone to Vasava’s abode to learn arms,
    obtains celestial weapons after five years with Indra and returns to Gandhamadana.
  language: English
  quote_policy: summarized
