canonical_text:
  quote: ''
  summary: Damayanti wakes alone in a desolate forest after Nala has gone away. She
    laments his absence, searches for him, is seized by a hungry serpent, and continues
    grieving for Nala. A huntsman kills the serpent, frees and aids her, then becomes
    desirous and attempts force. Damayanti invokes her fidelity to Nala in a curse,
    and the hunter falls dead.
  language: English
