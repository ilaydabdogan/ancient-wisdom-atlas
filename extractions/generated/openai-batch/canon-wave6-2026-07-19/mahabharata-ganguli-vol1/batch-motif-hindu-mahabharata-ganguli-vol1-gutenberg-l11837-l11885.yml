canonical_text:
  quote: ''
  summary: Janamejaya asks how Gandhari could have a daughter, Duhsala, if Vyasa divided
    the flesh into only one hundred portions for one hundred sons. Vaisampayana explains
    that Vyasa sprinkled water on the flesh and divided it while a nurse placed portions
    in clarified-butter pots. Gandhari inwardly desired a daughter in addition to
    her sons and invoked her past austerities, charity, homa, and service. Vyasa counted
    one hundred parts, then identified an excess part that would become the desired
    daughter and placed it in another pot of clarified butter.
  language: English
  quote_policy: summarized
