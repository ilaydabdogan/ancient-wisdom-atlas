canonical_text:
  quote: ''
  summary: 'Yudhishthira reaches Agastya''s asylum and asks Lomasa why Agastya killed
    Vatapi. Lomasa recounts how the Daitya Ilwala, angered when a Brahmana refused
    to grant him a son equal to Indra, used his brother Vatapi as a ram-shaped meal
    to kill Brahmanas: after they ate, Ilwala summoned Vatapi, who returned embodied
    and tore his way out. The account then turns to Agastya seeing his ancestors hanging
    head-down in a pit because they need offspring. He promises to beget a son, creates
    a woman from the beautiful parts of creatures, gives her to the Vidarbha king,
    and she is born and named Lopamudra. Lopamudra grows to puberty in royal splendor
    while her father wonders to whom he should give her.'
  language: English
  quote_policy: summarized
