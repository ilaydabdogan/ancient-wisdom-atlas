canonical_text:
  quote: ''
  summary: Arjuna recounts leaving for forest austerities, receiving advice from a
    Brahmana, ascending Himavan, and undertaking severe penances. A boar-form being
    appears, followed by a hunter with weapons and female companions. Arjuna and the
    hunter both strike the animal, then quarrel and fight. The hunter resists and
    swallows Arjuna's weapons, multiplies and changes form, and defeats Arjuna in
    wrestling. The hunter then reveals himself as Siva/Mahadeva with Uma, declares
    himself pleased, returns Arjuna's weapons, offers a boon except immortality, and
    grants Arjuna the Raudra/Pasupata weapon.
  language: English
  quote_policy: summarized
