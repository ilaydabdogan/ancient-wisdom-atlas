canonical_text:
  quote: ''
  summary: The passage recounts the birth of Sala, Dala, and Vala, the succession
    of Sala, and Sala's dispute with the Rishi Vamadeva after borrowing Vamadeva's
    swift Vami horses to catch a deer and refusing to return them. Vamadeva sends
    a disciple, then confronts Sala directly, warning him with Varuna's noose and
    invoking Rakshasas as punishment, while Sala claims the horses belong with Kshatriyas
    and threatens the Rishi in return.
  language: English
  quote_policy: summarized
