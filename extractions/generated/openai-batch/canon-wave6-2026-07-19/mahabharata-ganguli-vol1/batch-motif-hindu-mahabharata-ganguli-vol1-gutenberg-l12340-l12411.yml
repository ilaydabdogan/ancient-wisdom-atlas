canonical_text:
  quote: I may go the way that is reserved for those that are blessed with children.
  summary: Vaisampayana reports Pandu's reply to Kunti. Pandu recounts older practices
    concerning women, the later establishment of a stricter marital rule by Swetaketu,
    precedents for a wife bearing offspring at her husband's command through a Rishi
    or Brahmana, and then asks Kunti to raise offspring for him because he lacks procreative
    power and desires the post-mortem benefit associated with having children.
  language: English
  quote_policy: quoted
