canonical_text:
  quote: ''
  summary: After Bhima is missing, Yudhishthira and Kunti fear for him while Vidura
    advises caution. Bhima awakens on the eighth day in the realm of the Nagas, strengthened
    by nectar, is honored and returned from under the waters to the gardens. He reunites
    with his family, reports Duryodhana's treachery, and Yudhishthira urges secrecy
    and mutual protection. Duryodhana later attempts another poisoning, which fails,
    and further plots follow before the Kuru princes are sent to Gautama/Kripa for
    martial instruction.
  language: English
  quote_policy: summarized
