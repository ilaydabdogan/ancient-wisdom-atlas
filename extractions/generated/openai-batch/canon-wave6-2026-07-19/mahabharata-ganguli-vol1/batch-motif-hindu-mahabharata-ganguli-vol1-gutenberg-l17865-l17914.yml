canonical_text:
  quote: ''
  summary: The five Pandavas travel with their mother from Ekachakra toward Panchala
    to see Draupadi and the marriage festivities. On the way they meet Brahmanas,
    who invite them to Drupada's Swayamvara. The Brahmanas describe Draupadi as born
    from the sacrificial altar and Dhrishtadyumna as born armed from blazing fire,
    and they describe the kings, gifts, entertainers, and public festivities expected
    at the event. Yudhishthira agrees that they will go.
  language: English
  quote_policy: summarized
