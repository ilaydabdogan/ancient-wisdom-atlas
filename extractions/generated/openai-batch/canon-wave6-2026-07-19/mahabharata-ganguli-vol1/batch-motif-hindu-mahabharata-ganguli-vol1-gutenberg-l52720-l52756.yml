canonical_text:
  quote: was seized with an evil intention.
  summary: In Section CCLXII, Vaisampayana narrates that the Pandavas sojourn in Kamyaka
    forest and leave Draupadi alone at the hermitage while they hunt game for the
    Brahmanas. Jayadratha, king of Sindhu, traveling toward Salwa for marriage with
    a retinue of princes, halts in the same forest, sees Draupadi at the hermitage
    threshold, is struck by her beauty, forms a desire to secure and take her, and
    sends Kotika to ask who her husband is.
  language: English
  quote_policy: quoted
