canonical_text:
  quote: ''
  summary: Upamanyu praises the twin Aswins with cosmological images of day and night,
    the year, the wheel of Time, creation, parenthood, and knowledge, asking them
    to restore his sight. The Aswins appear and offer him a cake, but he refuses to
    eat it before offering it to his preceptor. Pleased by his devotion, they restore
    his sight and promise gold teeth and good fortune; his preceptor then blesses
    him with Vedic and Dharma-sastra knowledge. A second disciple, Veda, serves his
    preceptor through hardship, gains good fortune and universal knowledge, and later
    treats his own pupils without severity.
  language: English
  quote_policy: summarized
