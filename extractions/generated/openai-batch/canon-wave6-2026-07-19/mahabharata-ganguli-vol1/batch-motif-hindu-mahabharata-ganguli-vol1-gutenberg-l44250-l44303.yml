  summary: Arjuna narrates a battle in which the Nivata-Kavachas surround his chariot
    and attack with arrows and many weapons. Arjuna counters with Gandiva arrows,
    mantra-inspired weapons, and a fiery weapon of Maghavan, while Matali skillfully
    drives the celestial steeds. Many Danavas are slain or driven back, and the Nivata-Kavachas
    eventually fight by illusion.
