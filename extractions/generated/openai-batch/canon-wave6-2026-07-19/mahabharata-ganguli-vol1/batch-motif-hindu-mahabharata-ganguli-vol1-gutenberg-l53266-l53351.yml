canonical_text:
  quote: ''
  summary: Jayadratha flees from Bhima and Arjuna. Bhima captures, beats, humiliates,
    shaves, chains, and presents him before Yudhishthira. Yudhishthira and Draupadi
    order Jayadratha's release after his disfigurement and declared subjection. Jayadratha,
    ashamed, goes to the Ganga, performs severe penance to the three-eyed god Maheswara,
    and asks for power to defeat the Pandavas. Maheswara refuses the full request
    but grants that he may check them once, except Arjuna. The god explains Arjuna's
    divine identity and weapons, then describes Vishnu/Narayana as Supreme Being and
    recounts end-of-cycle cosmic destruction by fire, followed by clouds, rain, and
    flood.
  language: English
  quote_policy: summarized
