canonical_text:
  quote: ''
  summary: Radha and Adhiratha find a drifting box in the Ganga containing an infant
    with golden mail and ear-rings. They adopt and raise him as Vasusena/Karna. The
    passage states his hidden divine parentage from the Sun and Kunti, his martial
    training and rivalry with Arjuna, his worship of Surya, his generosity to Brahmanas,
    and Indra's arrival in Brahmana disguise to request a gift.
  language: English
  quote_policy: summarized
