  quote: ''
  summary: Yudhishthira is advised that he is worthy to perform the Rajasuya sacrifice,
    but he deliberates further and decides to seek Krishna’s judgment. A messenger
    summons Krishna from Dwaravati to Indraprastha. After Krishna is received by Yudhishthira
    and his kin, Yudhishthira explains his wish to perform the sacrifice and asks
    Krishna for impartial guidance about what will benefit the world.
