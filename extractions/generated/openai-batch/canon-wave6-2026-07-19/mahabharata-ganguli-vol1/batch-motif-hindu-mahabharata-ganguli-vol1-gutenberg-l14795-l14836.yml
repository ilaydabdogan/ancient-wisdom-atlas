canonical_text:
  quote: The Pandavas, having performed propitiatory rites for obtaining (their share
    of) the kingdom, and finishing their preparations, set out for Varanavata.
  summary: Duryodhana gains popular support through gifts and honours. Dhritarashtra
    has councillors praise Varanavata and its Pasupati festival, prompting the Pandavas
    to wish to go there. Dhritarashtra tells them to travel there with companions,
    enjoy the festival, make gifts, and return. Yudhishthira understands Dhritarashtra's
    motives but agrees, seeks blessings from elders and religious and civic figures,
    receives blessings, and the Pandavas perform rites and depart for Varanavata.
  language: English
  quote_policy: quoted
