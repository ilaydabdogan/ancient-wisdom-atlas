canonical_text:
  quote: ''
  summary: Arjuna recounts a battle in which crags, fire, water, wind, weapons, and
    darkness are produced against him, often as illusions. He counters with celestial
    weapons and other means. Matali, his charioteer, becomes terrified and compares
    this battle to earlier divine-demonic conflicts, saying it seems aimed at the
    destruction of the universe. Arjuna reassures Matali, creates his own bewildering
    illusion of arms, and continues fighting Nivata-Kavachas and Danavas concealed
    by illusion.
  language: English
  quote_policy: summarized
