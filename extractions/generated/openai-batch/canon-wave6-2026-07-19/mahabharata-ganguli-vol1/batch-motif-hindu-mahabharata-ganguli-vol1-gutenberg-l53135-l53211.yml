canonical_text:
  quote: ''
  summary: Vaisampayana narrates a battle in which the Pandava brothers confront Jayadratha's
    forces. Bhima, Arjuna, Yudhishthira, Nakula, and Sahadeva kill many opposing warriors,
    charioteers, and elephants. The battlefield becomes filled with bodies and carrion
    animals. Jayadratha becomes frightened, leaves Draupadi/Krishna behind, and flees
    by the forest path. Yudhishthira has Sahadeva take Draupadi onto a chariot, while
    Arjuna urges Bhima to stop killing fleeing soldiers and to seek Jayadratha instead.
  language: English
  quote_policy: summarized
