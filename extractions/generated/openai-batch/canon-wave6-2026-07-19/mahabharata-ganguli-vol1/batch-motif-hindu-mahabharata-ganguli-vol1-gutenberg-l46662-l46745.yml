canonical_text:
  quote: ''
  summary: King Parikshit of Ayodhya, while hunting, enters a forest and meets a beautiful
    maiden who marries him only after he pledges never to make her look upon water.
    A minister later creates an artificial forest with a hidden tank; when Parikshit
    asks his wife to enter the water, she disappears. Parikshit orders frogs slaughtered
    until the frog king Ayu appears in ascetic garb, reveals the woman as his daughter
    Susobhana, grants her again to Parikshit, and pronounces a consequence for her
    future offspring.
  language: English
  quote_policy: summarized
