canonical_text:
  quote: ''
  summary: 'The passage describes a late-age decline in rain, agriculture, virtue,
    commerce, lifespan, social conduct, and bodily order. It then narrates the end
    of the four Yugas: a many-year drought, seven suns drying the waters, the Samvartaka
    fire consuming earth and the supernatural realms, storm clouds flooding the earth
    and quenching the fire, the ocean overrunning continents, mountains breaking apart,
    the earth sinking, and the Self-create Lord drinking the winds and sleeping.'
  language: English
  quote_policy: summarized
