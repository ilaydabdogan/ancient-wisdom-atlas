canonical_text:
  quote: Although I know that it will prove destructive to me, yet I cannot refuse.
  summary: 'Dhritarashtra''s messenger summons Yudhishthira back to the prepared assembly
    to cast dice. Yudhishthira says the outcome is ordained and that he cannot refuse
    the old king''s command, though he expects destruction. The narrator compares
    his action to Rama being tempted by a golden deer under impending calamity. Yudhishthira
    returns with his brothers despite Sakuni''s deception. Sakuni proposes a single
    stake: the defeated side must wear deer skins, live twelve years in the forest,
    spend a thirteenth year unrecognized, and repeat exile if recognized. The assembly
    protests anxiously. Yudhishthira accepts the summons as a kingly obligation, Sakuni
    casts the dice, and declares that he has won.'
  language: English
  quote_policy: quoted
