  quote: ''
  summary: An unnamed speaker tells Yudhishthira that Kurus, Brahmanas, and the people
    praise his truthfulness and disparage Duryodhana’s sovereignty. The speaker says
    kingly sin can be purified by sacrifices and gifts, urges Yudhishthira to march
    on Hastinapura with Brahmanas’ blessings and armed allies, and compares the proposed
    campaign to Indra’s victories over Vritra and the Asuras.
