canonical_text:
  quote: ''
  summary: After defeating Vandin in debate, Ashtavakra demands that Vandin be drowned
    as Vandin had previously sent Brahmanas into the waters. Vandin explains that
    he is King Varuna's son and that the Brahmanas were sent to Varuna's twelve-year
    sacrifice and are now returning. Janaka recognizes Ashtavakra's victory and places
    Vandin at his disposal. The Brahmanas and Kahoda return after Varuna's worship.
    Vandin enters the sea. Kahoda later instructs Ashtavakra to enter the river Samanga;
    after plunging in, Ashtavakra's crooked limbs become straight. The river is named
    Samanga and described as purifying sins, and Yudhishthira is instructed to bathe
    there with his family.
  language: English
  quote_policy: summarized
