canonical_text:
  quote: ''
  summary: Pulastya describes a pilgrimage sequence through named tirthas, rivers,
    confluences, lakes, and mountains. Ritual actions such as touching waters, bathing,
    fasting for three nights, worshipping, and offering water oblations produce knowledge,
    cleansing from sin, sanctification or rescue of one's lineage, long life, heaven,
    highest success, and merit equivalent to sacrifices or generous gifts. Several
    sites are linked with Rama, Jamadagnya, Matanga, Mahadeva with the goddess, Brahma,
    gods, and Pitris.
  language: English
  quote_policy: summarized
