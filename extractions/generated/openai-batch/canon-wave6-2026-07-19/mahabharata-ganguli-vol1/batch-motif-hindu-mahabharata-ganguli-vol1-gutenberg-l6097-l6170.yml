canonical_text:
  quote: ''
  summary: 'Janamejaya asks Vaisampayana to recite the Mahabharata fully and raises
    questions about the suffering, restraint, and actions of the Pandavas and related
    figures. Vaisampayana replies that the work is extensive, composed by Vyasa, and
    describes its sacred status and benefits: hearing, reading, reciting, and studying
    it grant merit, purification from sin, victory, royal offspring, fame, and spiritual
    benefit.'
  language: English
  quote_policy: summarized
