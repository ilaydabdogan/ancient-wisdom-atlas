canonical_text:
  quote: ''
  summary: The passage describes Brahma’s celestial Sabha, where classes of Pitris,
    deities, sages, demons, Nagas, birds, animals, and all mobile and immobile beings
    gather, worship the Grandsire, and are received by him. Heavenly dwellers bow
    and return to their places. Brahma honors guests with speech and gifts, and the
    narrator compares Brahma’s unrivalled Sabha in all worlds with the king’s foremost
    Sabha among men.
