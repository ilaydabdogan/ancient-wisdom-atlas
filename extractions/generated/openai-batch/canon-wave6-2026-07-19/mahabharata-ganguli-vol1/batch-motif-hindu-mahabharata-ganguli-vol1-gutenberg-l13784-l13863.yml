canonical_text:
  quote: ''
  summary: Drona declares that the Kuru princes have completed their martial education
    and requests a public trial. Dhritarashtra authorizes the event, while lamenting
    his blindness, and Vidura carries out the arrangements. Drona selects and ritually
    consecrates an arena; stages, halls, platforms, and tents are built. The royal
    household, citizens, and the four orders gather. Drona enters in white with his
    son and performs worship. The princes display archery, horsemanship, chariot skills,
    sword-and-buckler work, and finally Vrikodara and Suyodhana enter with maces while
    Vidura describes the feats to Dhritarashtra, Kunti, and Gandhari.
  language: English
  quote_policy: summarized
