canonical_text:
  quote: ''
  summary: The passage opens Book 3 with an invocation and a framing question from
    Janamejaya about the Pandavas after their deceitful dice defeat and forest exile.
    Vaisampayana narrates their departure from Hastinapura with Draupadi, weapons,
    and a small retinue. The citizens grieve, criticize Duryodhana and his supporters,
    follow the Pandavas, and plead to live with them, arguing that association with
    the righteous produces virtue while association with the wicked corrupts.
  language: English
  quote_policy: summarized
