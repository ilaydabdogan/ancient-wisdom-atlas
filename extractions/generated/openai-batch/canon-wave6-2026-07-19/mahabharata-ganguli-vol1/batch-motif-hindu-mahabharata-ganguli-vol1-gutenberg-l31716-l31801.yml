canonical_text:
  quote: religion is the only raft for those desirous of going to heaven, like a ship
    to merchants desirous of crossing the ocean.
  summary: Yudhishthira answers Yajnaseni/Draupadi by defending virtue, Vedic authority,
    and action performed from duty rather than desire for reward. He warns against
    religious doubt, cites ascetics and Rishis as proofs of virtue, describes hell
    and eternal bliss as consequences, compares religion to a raft or ship to heaven,
    and invokes divine giving of the fruits of action and notable births as proof.
  language: English
  quote_policy: quoted
