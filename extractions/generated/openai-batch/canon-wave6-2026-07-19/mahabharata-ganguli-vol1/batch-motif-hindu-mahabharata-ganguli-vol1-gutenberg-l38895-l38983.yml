canonical_text:
  quote: ''
  summary: Lomasa recounts how Sagara, following a sky-borne instruction, prepares
    gourd divisions in clarified-butter vessels from which sixty thousand sons are
    born by Rudra's favour. The sons become violent and harass beings. Brahma foretells
    their destruction. During Sagara's horse-sacrifice, the horse vanishes at the
    sea; the sons search the world, dig into the ocean and lower world, find the horse
    near the radiant saint Kapila, rush toward it, and are burned to ashes by Kapila's
    flames. Narada reports this to Sagara, who summons Ansuman. Yudhishthira then
    asks why Sagara abandoned Asamanjas.
  language: English
  quote_policy: summarized
