canonical_text:
  quote: ''
  summary: Pritha/Kunti is given by her father Sura to the childless Kuntibhoja and
    serves guests in her adoptive home. After she pleases Durvasa, he gives her a
    mantra for summoning celestials to obtain children. Kunti tests it by summoning
    the Sun, who insists the summoning must bear fruit. Karna is born with natural
    armour and earrings; the Sun restores Kunti's maidenhood and ascends. Fearing
    her relatives, Kunti casts the child into water, where Radha's Suta husband finds
    him and raises him with Radha as their son Vasusena. Karna grows into a skilled
    and generous warrior devoted to the Sun. Indra, disguised as a Brahmana, asks
    for Karna's natural armour; Karna gives it, and Indra grants him a one-use dart.
    Karna receives his name because he cut off his natural armour.
  language: English
  quote_policy: summarized
