canonical_text:
  quote: ''
  summary: Arjuna tells Yudhisthira that he has obtained major weapons, resources,
    and allies, and proposes a campaign to enlarge the treasury by compelling kings
    to pay tribute, especially through conquest of the North. Yudhisthira authorizes
    him after Brahmanical benedictions. Arjuna, Bhima, Sahadeva, and Nakula depart
    with armies and subjugate the four directions, while Yudhisthira remains in Khandavaprastha
    in affluence. Bhagadatta then pledges to do what is asked.
  language: English
  quote_policy: summarized
