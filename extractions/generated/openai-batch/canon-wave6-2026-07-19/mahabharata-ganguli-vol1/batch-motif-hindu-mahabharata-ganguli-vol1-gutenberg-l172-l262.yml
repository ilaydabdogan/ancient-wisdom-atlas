  quote: ''
  summary: The translator describes the initial decision to publish anonymously, a
    public accusation against the publisher and its correction, the completion of
    the translation, limited assistance from collaborators, methods for checking text
    and readings, reliance on Nilakantha and other scholars, and encouragement from
    patrons and friends.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the first fasciculus was issued, the narrator and Babu Pratapa Chandra
    Roy disagreed over whether the translator's authorship should be publicly owned;
    the narrator favored anonymity because the work was large and might require years
    or multiple hands.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A compromise was adopted: the translator''s name was withheld, and the first
    fasciculus was issued with a publisher''s preface and a separate heading for the
    translator''s preface.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An influential Indian journal accused Pratapa Chandra Roy of posing as translator
    while being only the publisher; Roy explained the anonymity and the two prefaces,
    after which the editor apologized.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After completion, the narrator states there is no longer reason to withhold
    the translator's name and that the translation is practically the work of one
    hand, with limited assistance from named and unnamed contributors.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says he compared every sentence supplied by assistants with the
    original and altered it where needed for uniform style.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator reports deriving little aid from three Bengali versions and criticizes
    them for inaccuracies and blunders, especially in the Santi Parva.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator does not claim infallibility, notes that some Mahabharata verses
    are difficult to construe, and says he derived much aid from the commentator Nilakantha.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nilakantha's interpretations are described as having come down from preceptors
    of olden days, making him a guide not to be rejected without consideration.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: For readings, the narrator generally followed Bengal texts in the first half,
    the printed Bombay edition in the latter half, and Bengal editions where he judged
    the sequence of ideas better preserved.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator names Ram Nath Tarkaratna, Shyama Charan Kaviratna, and Aghore
    Nath Banerjee as referees or helpers on points of difficulty.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The narrator says the work would have been very difficult to continue without
    encouragement from named patrons, Oriental scholars, and Pratapa Chandra Roy.
  category: speech
  evidence_refs:
  - ev:8
