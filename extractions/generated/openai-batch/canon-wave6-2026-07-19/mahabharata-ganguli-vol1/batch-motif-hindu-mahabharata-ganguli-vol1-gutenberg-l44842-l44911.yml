canonical_text:
  quote: ''
  summary: Janamejaya asks why the immensely strong Bhima was afraid at the sight
    of a snake. Vaisampayana narrates that Bhima roamed and hunted in a Himalayan
    forest, terrifying animals and pursuing snakes into caves. He then encountered
    a colossal cave-dwelling serpent in a mountain fastness. The serpent seized him,
    and because of the serpent's boon Bhima lost consciousness and strength and could
    not free himself.
  language: English
