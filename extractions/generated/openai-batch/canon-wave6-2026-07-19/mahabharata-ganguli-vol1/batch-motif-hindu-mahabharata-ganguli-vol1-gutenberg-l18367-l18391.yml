canonical_text:
  quote: This maiden hath been justly acquired (by the Brahmana)
  summary: Krishna recognizes Bhima and Dhananjaya as Kunti's sons and persuades assembled
    monarchs to stop fighting over the maiden, who is said to have been won by a Brahmana.
    The kings depart; Bhima and Dhananjaya leave the crowd with Brahmanas, followed
    by Krishna, and are compared to the moon and sun emerging from clouds. Kunti worries
    because her sons are late, imagining dangers from Dhritarashtra's sons, deceptive
    Rakshasas, or possibly misguided counsel from Vyasa. In the late afternoon, Jishnu
    enters the potter's abode with Brahmanas.
  language: English
  quote_policy: quoted
