canonical_text:
  quote: ''
  summary: Utanka praises serpent chiefs while seeking the ear-rings. After failing
    to obtain them, he sees women weaving black and white threads, a wheel turned
    by six boys, and a man with a horse. The man directs him to blow into the horse,
    whose flames threaten the Naga region and compel Takshaka to return the ear-rings.
    Utanka rides the horse back in time to give them to his preceptress, and his preceptor
    later explains the visionary figures as cosmic and divine realities.
  language: English
  quote_policy: summarized
