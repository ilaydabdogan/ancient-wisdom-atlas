canonical_text:
  quote: ''
  summary: The Nagas decide to obey their mother, fearing loss of her affection and
    burning by her, and hoping she may free them from her curse. They agree to make
    a horse's tail black and become hairs in that tail. Kadru and Vinata, co-wives
    and sisters, having made a wager, travel through the sky toward the far side of
    the Ocean. The Ocean is described as vast, agitated, monster-filled, deep, jewel-bearing,
    associated with Varuna, Nagas, subterranean fire, Asuras, amrita, holy waters,
    many rivers, waves, and flames; the sisters quickly pass over it.
  language: English
  quote_policy: summarized
