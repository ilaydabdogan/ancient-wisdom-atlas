canonical_text:
  quote: ''
  summary: Markandeya narrates a dialogue in which a virtuous fowler instructs a Brahmana
    to return home and honor his grieving parents, whom he had left without permission
    to study the Vedas. The Brahmana accepts the instruction, says the fowler has
    saved him from a fall into hell, and asks about the fowler’s apparent Sudra status.
    The fowler recounts a previous existence as a learned Brahmana who joined a royal
    hunt, accidentally wounded a rishi with an arrow after mistaking him for a deer,
    begged forgiveness, and was cursed to be born as a cruel fowler in the Sudra class.
  language: English
  quote_policy: summarized
