canonical_text:
  quote: ''
  summary: Vaisampayana narrates Krishna's farewell from the Pandavas and accompanying
    Brahmanas. Satyabhama embraces and comforts Draupadi, predicting restoration of
    rule, vengeance on enemies, and the welfare of Draupadi's sons in Dwaravati under
    Yadava care. Satyabhama then walks round Draupadi, mounts Krishna's car, and Krishna
    departs for his own city.
