canonical_text:
  quote: ''
  summary: Garuda and Indra form friendship and negotiate over the Soma/Amrita. Garuda
    agrees that he will place it down without giving it to anyone to drink, allowing
    Indra to recover it. Garuda asks as a boon that the mighty snakes become his food,
    remembering his mother's bondage. He presents the Amrita to the snakes on kusa
    grass and instructs them to perform rites before drinking; while they are away
    Indra carries it back to heaven. The snakes lick the kusa grass, their tongues
    split, and the grass becomes sacred. Garuda later delights his mother by devouring
    snakes, and the narrator states that hearing or reciting the story grants heaven
    and merit.
  language: English
  quote_policy: summarized
