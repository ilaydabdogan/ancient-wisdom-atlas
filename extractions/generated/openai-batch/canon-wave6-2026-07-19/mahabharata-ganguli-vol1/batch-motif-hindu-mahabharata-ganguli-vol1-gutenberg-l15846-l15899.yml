canonical_text:
  quote: The sacrifice of any of these would be cruel and censurable.
  summary: Kunti hears another cry of sorrow from a Brahmana household and enters
    the inner apartments, where the Brahmana, his wife, son, and daughter sit in grief.
    The Brahmana laments the misery of earthly life, wealth, and attachment, recalls
    a failed attempt to leave the ancestral homestead, and says he cannot abandon
    or sacrifice his wife, son, daughter, or himself without bringing ruin or guilt
    upon the family.
  language: English
  quote_policy: quoted
