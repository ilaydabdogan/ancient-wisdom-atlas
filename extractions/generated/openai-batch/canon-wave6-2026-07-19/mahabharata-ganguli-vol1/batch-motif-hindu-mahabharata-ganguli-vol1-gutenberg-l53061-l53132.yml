canonical_text:
  quote: ''
  summary: Jayadratha, with Draupadi in his car, sees the standards of the approaching
    Pandavas and asks her to identify her five husbands. Draupadi warns him that his
    violent deed has brought him near death and describes Yudhishthira, Bhima, Arjuna,
    Nakula, and Sahadeva by emblems, virtues, appearance, kinship, and fighting traits.
    The five sons of Pritha then spare panic-stricken infantry begging for mercy and
    attack the charioteers with arrows.
