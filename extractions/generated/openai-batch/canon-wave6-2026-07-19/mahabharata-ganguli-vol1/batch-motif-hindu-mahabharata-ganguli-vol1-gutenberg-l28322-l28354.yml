canonical_text:
  quote: He cried repeatedly and dissonantly like a jackal.
  summary: Gandhari, grieving for her sons, addresses King Dhritarashtra and recalls
    Vidura's warning at Duryodhana's birth that the child would destroy the race.
    She urges the king not to approve wicked counsel, not to provoke the sons of Pritha,
    and to abandon Duryodhana for the sake of peace and the lineage. Dhritarashtra
    replies that if destruction has come, he cannot prevent it, and he allows his
    sons' wish that the Pandavas return and gamble again.
