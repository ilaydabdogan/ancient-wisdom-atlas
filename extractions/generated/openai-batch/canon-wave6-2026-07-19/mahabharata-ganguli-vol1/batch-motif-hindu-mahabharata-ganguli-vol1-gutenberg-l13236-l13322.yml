canonical_text:
  quote: ''
  summary: Vaisampayana recounts how Bhishma appointed Drona as teacher of the Kuru
    princes, then narrates Drona's origin from Bharadwaja's preserved vital fluid,
    Drona's education and weapon lineage, his connection with Drupada, his marriage
    to Kripi and the birth and naming of Aswatthaman, and his journey to Rama at Mahendra
    to seek wealth, weapons, and knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma sought a superior arms teacher for his grandsons and placed the Pandavas
    and Kauravas under Drona's tuition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drona accepted the Kuru princes as pupils, taught them the science of arms,
    and they became proficient in all kinds of arms in a short time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Janamejaya asks Vaisampayana about Drona's birth, his acquisition of arms,
    his coming to the Kurus, his parentage, and the birth of Aswatthaman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bharadwaja dwelt at the source of the Ganga, observed rigid vows, and went
    to the Ganga with other Rishis for ablutions before an Agnihotra sacrifice.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the river bank Bharadwaja saw the Apsara Ghritachi rising from the water
