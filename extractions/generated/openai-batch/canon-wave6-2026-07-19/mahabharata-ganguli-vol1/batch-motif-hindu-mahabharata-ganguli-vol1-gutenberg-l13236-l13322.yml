  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Drona studied the Vedas and their branches and received knowledge of the Agneya
    weapon from Agnivesa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Drupada, son of Prishata, came daily to Bharadwaja's hermitage to play and
    study with Drona, and later became king of the northern Panchalas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Drona remained in his father's hermitage, practiced ascetic austerities, married
    Kripi for offspring, and obtained a son named Aswatthaman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At birth Aswatthaman neighed like the celestial steed Ucchaihsravas, and an
    invisible being in the sky declared the reason for his name.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Drona heard that Rama intended to give away his wealth, desired Rama's weapons
