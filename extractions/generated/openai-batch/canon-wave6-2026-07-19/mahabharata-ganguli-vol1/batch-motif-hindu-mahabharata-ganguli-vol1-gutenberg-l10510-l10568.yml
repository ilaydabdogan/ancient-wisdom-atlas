  quote: ''
  summary: Ganga presents Santanu with the eighth son born from their union, describes
    the youth's sacred and martial education, and Santanu installs him as heir-apparent.
    Four years later Santanu encounters a fragrant fisherman’s daughter ferrying passengers
    on the Yamuna, desires her as wife, and seeks her father’s consent. The father
    requires a pledge that the maiden’s son will inherit Santanu’s throne and no other
    will be successor.
