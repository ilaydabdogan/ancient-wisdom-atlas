canonical_text:
  quote: ''
  summary: Yudhishthira finds Arjuna, Bhimasena, and the twins lying dead near a lake.
    After lamenting their deaths and considering possible causes, he observes that
    their bodies show no weapon marks or corpse-like pallor. As he descends into the
    lake, a voice from the sky claims possession of the lake, says the brothers have
    been brought under the lord of departed spirits, and warns Yudhishthira to answer
    questions before drinking. Yudhishthira questions the speaker's identity, and
    the speaker identifies himself as a Yaksha, not a bird.
  language: English
  quote_policy: summarized
