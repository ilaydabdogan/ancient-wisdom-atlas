candidate_motifs:
- id: motif:1
  label: Divine weapon granted after encounter with disguised deity
  taxonomy_refs:
  - initiation
  - sacred_exchange
  - shapeshifter
  basis: Arjuna pleases Tryambaka, who is disguised as a hunter, and receives the
    Pasupata weapon.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage says 'disguise' rather than explicitly describing transformation;
    taxonomy link to shapeshifter is therefore cautious.
- id: motif:2
  label: Hero travels to celestial regions, gains weapons, defeats nonhuman enemies,
    and returns
  taxonomy_refs:
  - ascent
  - mystical_quest
  - return
  basis: Arjuna goes to celestial regions, receives weapons from Indra, defeats invulnerable
    Kalakeyas and Paulomas, goes to Indra's regions to destroy Asuras, and returns
    successful.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage summarizes prior events rather than narrating the journey
    in full detail.
- id: motif:3
  label: Divine questioner tests a ruler or hero
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: Dharma, the god of justice, comes in Yaksha form and proposes questions to
    Yudhishthira.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The content and outcome of the questions are not included in this passage.
- id: motif:4
  label: Hidden heroes evade discovery while in disguise
