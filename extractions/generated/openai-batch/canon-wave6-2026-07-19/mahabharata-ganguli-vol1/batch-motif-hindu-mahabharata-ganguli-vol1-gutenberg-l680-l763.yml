  quote: ''
  summary: A first-person speaker addresses Sanjaya and lists a sequence of reported
    events, each followed by the refrain that he had no hope of success. The reports
    concern the Pandavas' exile, Arjuna's divine weapons and victories, Krishna's
    support and cosmic manifestations, failed peace-making, counsel and blessings,
    Bhishma's fall, divine allies, omens, Drona's fighting, Arjuna's victories, and
    Abhimanyu's death.
  language: English
  quote_policy: summarized
