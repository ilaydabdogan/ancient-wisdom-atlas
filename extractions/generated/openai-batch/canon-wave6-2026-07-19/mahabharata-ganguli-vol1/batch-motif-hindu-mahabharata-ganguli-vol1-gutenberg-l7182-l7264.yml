canonical_text:
  quote: ''
  summary: The passage recounts Pritha/Kunti's adoption by Kuntibhoja, her service
    to Durvasa, her receipt of a mantra for summoning celestials and obtaining children,
    her summoning of Surya and the secret birth of Karna/Vasusena with natural armor
    and earrings, Karna's abandonment in water and adoption by Radha's household,
    and his later gift of his armor and earrings to Indra in Brahmana disguise in
    exchange for a dart. It then lists several incarnations of divine or celestial
    portions on earth and concludes with the stated benefits of hearing this account
    of incarnations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sura promised in the presence of fire to give his firstborn child to the childless
    Kuntibhoja and gave Pritha to him; Kuntibhoja made her his daughter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pritha attended Brahmanas and guests in her adoptive father's house and carefully
    served the wrathful ascetic Durvasa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Durvasa, pleased with Pritha, gave her a mantra by which she could summon
    celestials and obtain children by their grace.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pritha, out of curiosity during her maidenhood, summoned Surya, conceived,
    and bore a son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The child was born with earrings and a coat of mail and is described as splendid
    like the maker of day.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kunti secretly brought forth the child and, from fear of relatives, cast him
    into the water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The child cast into the water was taken up by the husband of Radha and given
    to Radha to adopt as her son; the couple named him Vasusena.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vasusena grew strong, excelled in weapons, mastered sciences, and gave freely
    to Brahmanas when reciting the Vedas.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Indra, wishing to benefit his son Arjuna, assumed the guise of a Brahmana
    and asked Karna for his earrings and natural armor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Karna removed and gave his earrings and armor to the disguised Brahmana, and
    Sakra gave him a dart whose target would certainly be slain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the son of Surya was first known as Vasusena and later called
    Karna; it also says he grew up in the Suta caste and was friend and counsellor
    of Duryodhana.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage identifies Vasudeva as a portion of Narayana, Valadeva as a portion
    of the Naga Sesha, and Pradyumna as Sanatkumara.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that portions of Apsaras became the wives of Vasudeva,
    Sri became incarnate as Rukmini, and Draupadi was born of a portion of Sachi.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that Siddhi and Dhriti became the mothers called Kunti
    and Madri, and Mati became Gandhari.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The narrator describes the account as an account of incarnation of superior
    beings according to their portions and says hearing it grants benefits and wisdom.
  category: speech
  evidence_refs:
  - ev:12
