  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not fully explain the ritual mechanics of transferred
    or vicarious expiation.
- id: motif:4
  label: False accusation by the guilty brother
  taxonomy_refs: []
  basis: Paravasu, after his own killing of Raivya, maliciously identifies Arvavasu
