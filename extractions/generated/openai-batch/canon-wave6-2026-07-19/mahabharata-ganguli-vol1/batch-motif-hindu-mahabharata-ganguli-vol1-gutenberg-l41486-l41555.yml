canonical_text:
  quote: ''
  summary: Lomasa recounts how Paravasu unintentionally kills his father Raivya in
    a dark wood after mistaking him for a deer, asks his brother Arvavasu to perform
    the vow for Brahmana-slaying, and later maliciously accuses Arvavasu before King
    Vrihadyumna. Arvavasu withdraws to severe penance, receives a solar revelation
    and divine manifestation, is vindicated by the gods, and obtains boons restoring
    the dead, absolving his brother, and making the solar revelation famous. The gods
    also explain to Yavakri that Vedic knowledge gained without exertion and without
    a preceptor is inferior to knowledge won through discipline under a teacher. Lomasa
    identifies the hermitage as sacred and sin-removing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Vrihadyumna begins a sacrifice and engages Raivya's two sons, Arvavasu
    and Paravasu, to assist in the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arvavasu and Paravasu leave for the sacrifice with their father's permission,
    while Raivya remains in the hermitage with Paravasu's wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Paravasu returns home alone because he desires to see his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a dark, late night wood, Paravasu sees Raivya wrapped in the skin of a
    black antelope and mistakes him for a deer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paravasu unintentionally kills his father and then performs funeral rites
    for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Paravasu tells Arvavasu that he killed their father and asks Arvavasu to observe
    the vow prescribed for killing a Brahmana; Arvavasu agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Arvavasu completes the vow and returns, Paravasu accuses him before
    Vrihadyumna of being a Brahmana-slayer, and the king's attendants drive Arvavasu
    away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arvavasu protests that he did not kill a Brahmana and says his brother committed
    the sin, then retires silently into the woods after being reprimanded.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the woods, Arvavasu performs severe penances, seeks the protection of the
    Sun, receives the manifestation of a solar mantra revelation, and sees a deity
    appear in embodied form.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The celestials become pleased with Arvavasu, make him chief priest at Vrihadyumna's
    sacrifice, dismiss Paravasu, and bestow boons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boon requests include restoration of Raivya, absolution of Paravasu's
    sin, removal of Raivya's memory of being slain, restoration of Bharadwaja and
    Yavakri, and fame for the solar revelation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The gods grant the requests; the named dead regain life; Yavakri asks why
    Raivya could kill him despite his Vedic knowledge and penances.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The gods answer that Yavakri learned the Vedas without exertion and without
    a preceptor, while Raivya obtained them over a long time through conduct, troubles,
    and satisfaction of his preceptor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The celestials led by Indra ascend to heaven, and Lomasa identifies the hermitage
    as sacred, fertile in all seasons, and able to deliver Yudhishthira from sins
    if he dwells there.
  category: setting
  evidence_refs:
  - ev:8
