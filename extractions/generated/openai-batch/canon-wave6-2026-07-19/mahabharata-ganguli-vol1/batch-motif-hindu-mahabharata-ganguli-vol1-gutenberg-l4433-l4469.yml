canonical_text:
  quote: ''
  summary: Sauti narrates that the serpents approve Elapatra's words, and Vasuki carefully
    raises his sister Jaratkaru. Later, gods and Asuras churn the abode of Varuna,
    using Vasuki as the churning-cord. The gods intercede with the Grandsire on Vasuki's
    behalf because he suffers from fear of his mother's curse. Brahman tells them
    that Elapatra's counsel is true, that only wicked serpents will be destroyed,
    and that Vasuki should give his sister to the ascetic Jaratkaru at the proper
    time. Vasuki then orders serpents to watch the Rishi Jaratkaru and report when
    he asks for a wife, since the welfare of their race depends on it.
  language: English
  quote_policy: summarized
