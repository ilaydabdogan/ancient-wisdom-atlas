canonical_text:
  quote: ''
  summary: Rama mourns his father, who has been killed with arrows by the sons of
    Kartavirya while aged, penitent, and unresisting. After funeral rites and cremation,
    Rama vows to destroy the military caste, kills Kartavirya's sons, repeatedly exterminates
    military tribes, and creates five lakes of blood at Samantapanchaka. He offers
    libations to the Bhrigu forefathers, receives counsel from Richika, performs sacrifice,
    gives the earth and a golden altar to priestly recipients, and withdraws to severe
    penance on Mahendra hill. Later he appears to Yudhishthira, his brothers, and
    Brahmanas; they worship him, spend the night on Mahendra, and continue southward.
  language: English
  quote_policy: summarized
