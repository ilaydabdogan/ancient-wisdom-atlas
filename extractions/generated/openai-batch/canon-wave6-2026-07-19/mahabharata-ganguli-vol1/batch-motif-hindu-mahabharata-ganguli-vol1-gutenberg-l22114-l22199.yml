canonical_text:
  quote: ''
  summary: Maya Danava tells Arjuna that he will go north of Kailasa near Mainaka
    and Vindu lake to recover gem materials, a fierce club, and the conch Devadatta.
    The passage describes Vindu lake and the nearby jeweled peak as a place associated
    with Bhagiratha, Ganga, Indra, Mahadeva, and other divine sacrifices. Maya retrieves
    the guarded wealth, builds a splendid jeweled palace for the Pandavas, gives the
    club to Bhima and the conch to Arjuna, and completes the hall with guards, tanks,
    gardens, and deceptive transparent water.
  language: English
  quote_policy: summarized
