canonical_text:
  quote: ''
  summary: Janamejaya asks why great warriors were born on earth. Vaisampayana recounts
    how, after Parasurama repeatedly destroyed Kshatriyas, Brahmanas fathered offspring
    with Kshatriya women in season, restoring the Kshatriya race and the four orders.
    A period of virtuous rule, timely fertility, social duty, and Indra's rains follows.
    Then Asuras, Daityas, and Danavas defeated in heaven are born on earth in royal,
    animal, and other forms, burdening the earth and oppressing beings and sages.
  language: English
  quote_policy: summarized
