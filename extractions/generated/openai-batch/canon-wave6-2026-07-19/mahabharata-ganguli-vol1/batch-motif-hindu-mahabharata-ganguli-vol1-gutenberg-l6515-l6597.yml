    times and then went to Mount Mahendra for ascetic penances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kshatriya women seeking offspring came to Brahmanas, and the Brahmanas had
    connection with them only during the proper season and not lustfully or out of
    season.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many Kshatriya boys and girls were born from Kshatriya women by Brahmanas,
    and the Kshatriya race and the four orders were re-established.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
