  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Indra, described as having performed a hundred sacrifices and possessing a
    thousand eyes, pours vivifying showers at proper times and places after seeing
    virtuous Kshatriya rule.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Brahmanas study the Vedas and Upanishads, Vaisyas till the earth with bullocks,
    merchants avoid false scales, and the orders attend to their respective duties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Cows, women, and trees produce offspring, flowers, and fruit at the proper
    time or season, and the Krita age is said to have set in.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Asuras, including sons of Diti and Danu, defeated by the sons of Aditi and
