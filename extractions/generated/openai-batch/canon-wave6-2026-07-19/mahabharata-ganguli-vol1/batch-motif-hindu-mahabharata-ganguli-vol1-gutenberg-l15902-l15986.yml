canonical_text:
  quote: ''
  summary: A Brahmana's wife urges him not to grieve and offers to go herself to the
    Rakshasa, arguing that sacrificing her life for her husband's good is a woman's
    highest duty and may protect him, their children, and their family line. She reasons
    that widowhood would leave her and the children vulnerable, that the Rakshasa
    may be less likely to kill a woman, and that the Brahmana can remarry. The Brahmana
    embraces her, and both weep silently.
  language: English
