canonical_text:
  quote: ''
  summary: In a forest, King Samvarana addresses a maiden who remains silent and disappears.
    He searches for her, laments, and collapses under the force of desire. The maiden
    reappears, tells him to rise and not lose reason, and he pleads for her love and
    proposes Gandharva marriage, describing Kama's affliction with images of arrows,
    a viper bite, fire, and water. She identifies herself as Tapati, daughter of Aditya/Sun
    and younger sister of Savitri, says she is under her father's authority, admits
    reciprocal attraction, and tells him to seek her father's consent through worship,
    ascetic penances, and vows.
  language: English
  quote_policy: summarized
