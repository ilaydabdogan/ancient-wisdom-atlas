canonical_text:
  quote: ''
  summary: A pilgrimage itinerary lists numerous tirthas, rivers, wells, lakes, and
    groves where bathing, worship, regulated conduct, or offerings produce sacrificial
    merit, purification, release from debts, social or spiritual elevation, or access
    to divine regions. It also recounts Vyasa mixing all tirthas at Misraka, Vyasa’s
    grief at Vyasasthali, and the beginning of the story of the Rishi Mankanaka, whose
    wound yields vegetable juice and whose dance causes all creatures to dance until
    gods and Rishis appeal to Mahadeva.
  language: English
  quote_policy: summarized
