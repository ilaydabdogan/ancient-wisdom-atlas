canonical_text:
  quote: ''
  summary: Yudhishthira asks Narada why Harishchandra is singled out among kings in
    Indra's Sabha and asks about his father Pandu in the region of the Pitris. Narada
    recounts Harishchandra's universal conquest, Rajasuya sacrifice, lavish gifts
    to Brahmanas, and resulting residence in Indra's region. Narada also reports Pandu's
    message urging Yudhishthira to subjugate the earth and perform the Rajasuya so
    Pandu may attain Indra's region like Harishchandra. Narada warns that this sacrifice
    has grave obstacles, including Brahma Rakshasas and the possibility of war and
    ruin, then departs; Yudhishthira deliberates with his brothers.
  language: English
  quote_policy: summarized
