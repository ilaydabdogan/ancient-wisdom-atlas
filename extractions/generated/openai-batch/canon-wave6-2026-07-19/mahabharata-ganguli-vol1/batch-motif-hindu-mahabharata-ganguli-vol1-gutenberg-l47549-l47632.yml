  quote: ''
  summary: Markandeya answers a royal addressee by describing three forms of purity,
    the sanctity and protective force of Brahmanas, the sanctifying power of sacred
    places and holy company, the insufficiency of external austerities without inner
    purity and kindness, and the salvific value of knowledge of the soul's identity
    with the Supreme Soul.
  language: English
