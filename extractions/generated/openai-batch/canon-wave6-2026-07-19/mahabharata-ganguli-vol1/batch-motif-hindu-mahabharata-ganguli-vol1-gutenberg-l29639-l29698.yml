canonical_text:
  quote: ''
  summary: After Vidura has gone to the Pandavas, Dhritarashtra repents of having
    expelled him, collapses in grief, and sends Sanjaya to bring him back. Sanjaya
    finds Vidura with Yudhishthira and the Pandavas in the Kamyaka woods and asks
    him to return. With Yudhishthira's permission Vidura returns to Dhritarashtra,
    who asks forgiveness. Vidura forgives him, explains his sympathy for the distressed
    Pandavas, and the two brothers are reconciled.
  language: English
  quote_policy: summarized
