canonical_text:
  quote: ''
  summary: Vasudeva narrates that Pradyumna, struck senseless by Salwa's arrows, is
    carried away from the battlefield by his charioteer, the son of Daruka. When Pradyumna
    revives, he rebukes the retreat. The charioteer explains that he acted from duty
    to protect an incapacitated warrior and because Salwa and the Danavas seemed too
    strong. Pradyumna orders the chariot turned back, invokes Vrishni battle customs,
    refuses dishonorable flight, and says public ridicule would be worse than death.
  language: English
  quote_policy: summarized
