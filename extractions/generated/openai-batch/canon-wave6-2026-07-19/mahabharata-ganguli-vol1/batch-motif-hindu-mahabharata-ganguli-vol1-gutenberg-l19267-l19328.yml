canonical_text:
  quote: ''
  summary: Karna rejects Duryodhana's subtle schemes against the Pandavas, arguing
    that earlier plots failed, that the Pandavas are now grown, fated, united by a
    common wife, supported by Draupadi, Drupada, and Krishna, and intent on regaining
    their ancestral kingdom. He advises immediate military attack before their allies
    gather. Dhritarashtra praises Karna's counsel and orders consultation with Bhishma,
    Drona, Vidura, and others.
