canonical_text:
  quote: The destruction of Khandava hath been ordained by Fate!
  summary: During the burning of Khandava forest, forest beings flee but are slain
    by Krishna with his discus and by Arjuna with arrows. The celestials withdraw
    after an incorporeal voice tells Indra that Takshaka is absent, that Vasudeva
    and Arjuna are Nara and Narayana, and that the destruction is fated. Agni is gratified
    by the consumption of flesh, blood, and fat.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The inhabitants of Khandava, including Danavas, Rakshasas, Nagas, wild animals,
    birds, and other creatures, flee in all directions because of falling stones and
    the burning forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fleeing creatures see Krishna and Arjuna ready with weapons, lose their
    power of movement, and make a frightful roar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Krishna, also called Kesava, hurls a large fierce discus that cuts forest-dwellers,
    Asuras, Pisachas, Nagas, birds, and other creatures, and the discus returns to
    his hand after slaughtering them.
  category: action
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: The celestials cannot protect the forest from Krishna and Arjuna or extinguish
    the conflagration, and they retreat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An incorporeal voice tells Indra that Takshaka, chief of snakes and Indra's
    friend, has not been killed because he went to Kurukshetra before the conflagration.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The incorporeal voice declares that Vasudeva and Arjuna are Nara and Narayana,
    invincible old gods or Rishis, and that the destruction of Khandava has been ordained
    by Fate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Indra abandons wrath and jealousy and returns to heaven; the other dwellers
    in heaven follow him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Indra leaves, Vasudeva and Arjuna roar, assist the conflagration, and
    Arjuna slays numberless creatures with showers of arrows.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Creatures seeking relief at riverbanks, uneven plains, and crematoriums find
    no ease; their cries frighten fishes of the Ganges and the sea and Vidyadharas
    in the forest.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Agni or Hutasana is described with blazing coppery eyes, a flaming tongue,
    a large mouth, fiery hair, and joy while drinking a stream of animal fat with
    the help of Krishna and Arjuna.
  category: attribute
  evidence_refs:
  - ev:7
