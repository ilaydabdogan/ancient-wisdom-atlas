canonical_text:
  quote: ''
  summary: The Pandavas travel north toward Panchala with their mother and reach the
    Ganga. At twilight Angaraparna, king of the Gandharvas, claims the riverbank and
    bars their approach. Arjuna rejects the restriction by praising the sacred, purifying,
    trans-cosmic Ganga. Angaraparna attacks, and Arjuna defeats him with a fiery celestial
    weapon. Angaraparna's wife Kumbhinasi seeks Yudhishthira's protection, and Yudhishthira
    orders mercy; Arjuna releases the defeated Gandharva.
  language: English
  quote_policy: summarized
