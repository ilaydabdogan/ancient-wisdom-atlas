canonical_text:
  quote: ''
  summary: Vrihadaswa narrates that Damayanti, seeing Nala ruined and heedless at
    dice, first summons councillors through her nurse Vrihatsena and then summons
    the charioteer Varshneya. She explains that Nala is losing to Pushkara and may
    come to grief, and instructs Varshneya to take their twin children by chariot
    to Kundina/Vidarbha. Varshneya consults the king's officers, takes the children
    away, leaves them with the car and horses in Vidarbha, and later enters the service
    of King Rituparna in Ayodhya.
  language: English
  quote_policy: summarized
