canonical_text:
  quote: he formed at Samanta-panchaka five lakes of blood
  summary: The Rishis ask Sauti to explain Samanta-panchaka. Sauti recounts Rama son
    of Jamadagni destroying Kshatriyas, forming five blood lakes, offering blood oblations
    to his ancestors, and receiving a boon that absolves him and makes the lakes holy
    shrines. He then connects the same region with the later Kaurava-Pandava war,
    defines the military unit Akshauhini, summarizes the destruction of the armies,
    and praises the Bharata as a sacred history of wisdom.
  language: English
  quote_policy: quoted
