  summary: Draupadi asks Dhritarashtra for boons that free Yudhishthira and then her
    other husbands from slavery and bondage. Dhritarashtra grants the requests and
    offers a third boon, but Draupadi refuses it, citing the danger of covetousness,
    rules about how many boons different persons may ask, and confidence that her
    freed husbands can regain prosperity through virtuous acts.
