canonical_text:
  quote: ''
  summary: In the forest at evening, Vaisampayana narrates that the sons of Pritha
    and Krishna sit in grief. Krishna addresses Yudhishthira, laments the exile, contrasts
    his former royal wealth and ritual generosity with present forest hardship, recalls
    the strength of Bhima, Arjuna, Nakula, and Sahadeva, and urges Yudhishthira to
    show appropriate Kshatriya anger while also acknowledging the need for timely
    forgiveness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sons of Pritha and Krishna are in the woods in the evening, seated together
    and afflicted with sorrow and grief.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna speaks to Yudhishthira and says that the son of Dhritarashtra sent
    Yudhishthira and herself into the woods dressed in deer-skin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Krishna names Duryodhana, Karna, Sakuni, and Dussasana as the four who did
    not shed tears when Yudhishthira set out for the woods, while other Kurus did
    shed tears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krishna contrasts Yudhishthira's former jeweled ivory seat, sandal-smeared
    body, and white silk clothing with his present kusa-grass seat, mud and dirt,
    and rags.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krishna recalls that Yudhishthira formerly gave abundant food on golden plates
    to Brahmanas and ascetics, while his brothers now live in the woods on what the
    woods yield.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bhimasena is described as sorrowful in the woods, capable of slaying the Kurus,
    but enduring the sorrow while waiting for the fulfillment of Yudhishthira's promise.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Arjuna is described as exceptionally skilled with weapons, honored by celestials
    and Danavas, and as one who had vanquished celestials, men, and serpents.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Nakula and Sahadeva are described as young, handsome, brave, undeserving of
    distress, and overwhelmed with grief in exile.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Krishna describes herself as born in the race of Drupada, sister of Dhrishtadyumna,
    daughter-in-law of Pandu, devoted wife of heroes, and also in exile.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Krishna argues that a Kshatriya should display energy when the opportunity
    comes and should not extend forgiveness to the foe at the wrong time, while also
    saying that a Kshatriya who is not appeased when forgiveness is timely meets destruction.
  category: speech
  evidence_refs:
  - ev:9
