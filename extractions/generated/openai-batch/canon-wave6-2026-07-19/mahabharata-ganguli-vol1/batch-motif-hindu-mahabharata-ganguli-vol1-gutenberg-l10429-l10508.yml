  quote: ''
  summary: Santanu returns sorrowfully after his wife's disappearance. The passage
    then praises Santanu as a truthful, virtuous, merciful king whose rule brings
    peace, social order, sacrifice, and protection for creatures. His son Devavrata,
    a Vasu born of Ganga, is described as learned, strong, and warrior-like. While
    hunting by the Ganges, Santanu sees the river checked by a comely youth using
    a celestial weapon; the youth is Devavrata, who recognizes his father, hides his
    identity through illusion, and disappears.
