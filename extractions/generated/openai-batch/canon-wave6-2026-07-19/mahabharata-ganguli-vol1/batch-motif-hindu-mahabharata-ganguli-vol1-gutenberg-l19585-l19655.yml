canonical_text:
  quote: ''
  summary: Drupada, Yudhishthira, and Vasudeva agree that the Pandavas should leave
    Drupada's court and return toward their ancestral kingdom. The Pandavas travel
    with Krishna/Vasudeva, Vidura, Draupadi, and Kunti to Hastinapura, where Dhritarashtra
    sends a reception party and the citizens welcome them. After honoring Dhritarashtra,
    Bhishma, and others, the Pandavas are summoned and directed by Dhritarashtra to
    reside at Khandavaprastha with half the kingdom in order to avoid renewed conflict.
  language: English
  quote_policy: summarized
