canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Dhrishtadyumna secretly follows the Kuru princes
    to the potter's house and observes them. Kunti instructs Krishna, daughter of
    Drupada, to distribute food first to gods, Brahmanas, guests, and then among the
    household. The heroes sleep on kusa grass and deer-skins while Dhrishtadyumna
    overhears their martial conversation. In the morning he reports to Drupada, who
    anxiously asks who has taken his daughter and whether Arjuna won her.
  language: English
  quote_policy: summarized
