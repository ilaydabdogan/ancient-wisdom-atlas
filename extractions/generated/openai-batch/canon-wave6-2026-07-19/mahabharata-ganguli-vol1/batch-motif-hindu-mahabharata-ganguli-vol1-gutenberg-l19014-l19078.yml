  summary: Drupada accepts Vyasa's explanation that Krishna's marriage to multiple
    husbands is divinely ordained. Vyasa sets an auspicious time for Yudhishthira
    to marry first. Royal wedding preparations follow; Dhaumya officiates with sacred
    fire and mantras. Yudhishthira and then the other Pandava/Kuru princes marry Krishna
    in succession. The passage reports her daily restoration of virginity after each
    marriage, followed by Drupada's gifts and the Pandavas' joyful residence in Panchala.
