  quote: ''
  summary: Markandeya consoles a grieving Bharata king by citing Rama's forest exile,
    Indra's victories with the Maruts, the king's own warrior allies, the recovery
    of Krishna daughter of Drupada from Saindhava/Jayadratha, and Rama's rescue of
    the princess of Videha from the Ten-necked Rakshasa. Vaisampayana then says the
    king is comforted and casts off sorrow.
