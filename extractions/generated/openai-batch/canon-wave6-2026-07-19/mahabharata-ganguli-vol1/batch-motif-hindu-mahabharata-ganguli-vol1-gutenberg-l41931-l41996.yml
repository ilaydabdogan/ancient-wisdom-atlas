canonical_text:
  quote: ''
  summary: During the Pandavas' journey, Draupadi becomes exhausted after a short
    distance and collapses. Nakula supports her and calls Yudhishthira, who laments
    her hardship and blames his dice-playing. Dhaumya and other Brahmanas console
    him, recite protective mantras, and perform rites. Draupadi is soothed, regains
    her senses, rests on deer-skin, and has her feet tended by the twins. Yudhishthira
    worries about the snowy mountains ahead; Bhima offers to carry the party or summon
    his son Ghatotkacha. When Bhima thinks of him, Ghatotkacha appears, salutes the
    Pandavas and Brahmanas, offers service, and is embraced by Bhima.
  language: English
  quote_policy: summarized
