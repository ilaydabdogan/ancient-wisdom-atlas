canonical_text:
  quote: Our desires, however, are never gratified by indulgence.
  summary: Yayati enjoys Puru's borrowed youth for a thousand years while maintaining
    royal and religious duties. When the term is complete, he teaches Puru that desire
    grows through indulgence, returns Puru's youth, takes back decrepitude, and gives
    him the kingdom. The social orders question bypassing the elder sons, but Yayati
    justifies Puru's succession by obedience, filial service, and Sukra's command.
    Puru is installed, Yayati retires to the woods, and several descendant peoples
    are named from Yayati's sons.
  language: English
  quote_policy: quoted
