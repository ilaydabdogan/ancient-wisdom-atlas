canonical_text:
  quote: I would renounce three worlds, the empire of heaven, anything that may be
    greater than that, but truth I would never renounce.
  summary: After her son dies childless, Satyavati asks Bhishma to preserve Santanu's
    line by begetting offspring on the widows, ruling the Bharatas, and preventing
    harm to the ancestors. Bhishma refuses to break his vow of truth and says an established
    Kshatriya practice should be considered in consultation with learned priests for
    the emergency.
  language: English
  quote_policy: quoted
