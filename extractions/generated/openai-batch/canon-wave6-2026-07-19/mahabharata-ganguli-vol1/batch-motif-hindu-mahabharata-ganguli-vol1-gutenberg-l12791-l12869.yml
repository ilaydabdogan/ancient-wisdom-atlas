- id: obs:1
  text: The Rishis consult after seeing Pandu's death and say Pandu had abandoned
    sovereignty and kingdom to practice ascetic austerities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rishis describe Pandu's wife and infant sons as a trust left in their
    hands and decide to take them to Pandu's kingdom.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ascetics set out for Hastinapura with Pandu's children, Kunti, and two
    dead bodies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kunti, though unused to toil, performs the long journey and presents herself
