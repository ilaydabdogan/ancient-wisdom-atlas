  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The oldest ascetic states that Pandu had abandoned worldly pleasures and lived
    on the mountain of a hundred peaks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ascetic identifies Yudhishthira as begotten by Dharma, Bhima by Vayu,
    Dhananjaya by Indra, and Madri's twin children by the twin Aswins.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The ascetic says Pandu revived the almost extinct line of his grandfather
    and had died seventeen days earlier.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Madri is described as ascending Pandu's funeral pyre, sacrificing her life,
