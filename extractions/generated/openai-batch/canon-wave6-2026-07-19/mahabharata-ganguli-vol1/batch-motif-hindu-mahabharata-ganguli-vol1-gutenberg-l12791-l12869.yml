canonical_text:
  quote: ''
  summary: After Pandu's death, ascetics decide to bring Kunti, Pandu's children,
    and the bodies of Pandu and Madri to Hastinapura. The Kuru elders and citizens
    receive the ascetics. An elder ascetic recounts Pandu's renunciation, the divine
    paternity of his sons, Madri's death on Pandu's pyre, and the required funerary
    rites. The ascetics and associated beings then vanish before the assembled people.
  language: English
  quote_policy: summarized
