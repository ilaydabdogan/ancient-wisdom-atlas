canonical_text:
  quote: "“regulating our fare, and restraining our senses, we shall go to the Gandhamadana,
    desirous of seeing Dhananjaya.”"
  summary: Yudhishthira addresses Bhima, Panchali, and the twins. He frames their
    wilderness wandering as the result of former acts, laments Arjuna/Dhananjaya’s
    absence and the remembered insult to Yajnaseni, praises Arjuna’s heroic qualities,
    recalls possessions won by Arjuna and now usurped by Syodhana, and proposes an
    ascetic journey on foot to Gandhamadana, the hermitage of Nara and Narayana, and
    Kuvera’s guarded lake in order to see Arjuna.
