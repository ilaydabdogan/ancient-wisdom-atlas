canonical_text:
  quote: ''
  summary: Lomasa guides Yudhishthira through a holy mountain region with seven Gangas,
    uninterrupted Agni, divine footprints, Mandara, Kailasa, Kuvera's realm, and many
    supernatural beings. He warns that the region is difficult and guarded, invokes
    divine and riverine protection, and addresses Ganga. Yudhishthira then orders
    careful protection of Krishna, assigns Bhima special responsibility, and reassures
    Nakula and Sahadeva.
  language: English
  quote_policy: summarized
