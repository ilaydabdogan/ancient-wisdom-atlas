canonical_text:
  quote: ''
  summary: Yudhishthira, preparing for forest exile and unable to feed the Brahmanas
    following him, asks his priest Dhaumya what to do. Dhaumya explains the sun’s
    role in drawing up water, producing rain through the moon, generating plants,
    and sustaining creatures, then advises Yudhishthira to take refuge in the sun
    through austerity. Dhaumya recites the sun’s 108 names and the benefits of the
    hymn. Yudhishthira worships the sun with offerings, ablutions, restraint, pranayama,
    and praise while standing in the Ganges stream.
  language: English
  quote_policy: summarized
