canonical_text:
  quote: It hath been built by Viswakarma (the celestial architect) within the waters.
  summary: Narada tells Yudhishthira about Varuna’s splendid white assembly hall,
    built within the waters by Viswakarma. The hall is surrounded by jewel-made celestial
    trees, flowering bowers, birds, and pleasant air. Varuna sits there with his queen
    while Adityas, Nagas, Daityas and Danavas, personified oceans and rivers, sacred
    waters, directions, Earth, mountains, aquatic animals, Gandharvas, Apsaras, and
    Sunabha attend and worship him.
  language: English
