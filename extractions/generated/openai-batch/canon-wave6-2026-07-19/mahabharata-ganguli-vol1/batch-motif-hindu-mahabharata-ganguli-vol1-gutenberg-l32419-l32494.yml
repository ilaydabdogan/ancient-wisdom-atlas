canonical_text:
  quote: Taking the bow set thou out this very day in order to behold Purandara.
  summary: Yudhishthira privately instructs Arjuna, transmits a science received from
    Vyasa, and sends him northward in ascetic discipline to obtain celestial weapons
    from Indra. Arjuna arms himself, performs ritual offerings and gifts, receives
    blessings from Brahmanas, Siddhas, invisible spirits, and Krishna, and sets out
    from Kamyaka.
  language: English
  quote_policy: quoted
