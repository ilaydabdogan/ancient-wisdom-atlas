canonical_text:
  quote: Departing and still departing, king Nala returned again and again to that
    shed, dragged away by Kali but drawn back by love.
  summary: Nala refuses to go to Damayanti's father's kingdom in his misery. He and
    Damayanti wander hungry and thirsty, wearing one cloth, and sleep in a travellers'
    shed. While Damayanti sleeps, Nala deliberates over whether to abandon her, is
    described as influenced by Kali, cuts half of their garment with a sword, leaves
    and returns in grief, invokes divine protection for her, and finally departs,
    leaving her asleep in the forest.
  language: English
  quote_policy: quoted
