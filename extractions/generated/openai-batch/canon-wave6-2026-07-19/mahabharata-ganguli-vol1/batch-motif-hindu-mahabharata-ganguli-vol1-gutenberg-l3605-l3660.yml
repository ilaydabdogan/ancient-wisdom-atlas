canonical_text:
  quote: ''
  summary: Garuda tells his mother Vinata that he will bring amrita and asks what
    he may eat on the way. Vinata directs him to the Nishadas in an ocean region but
    repeatedly warns him not to kill a Brahmana and describes signs by which one may
    be recognized. She invokes deities to protect Garuda’s body. Garuda ascends, attacks
    the Nishadas, uses dust, water, trees, mountains, and his enlarged mouth to drive
    them into his maw, and kills innumerable fishermen.
  language: English
  quote_policy: summarized
