canonical_text:
  quote: ''
  summary: Ani-Mandavya, still living after being fixed on a stake, accepts the king's
    apology but retains part of the stake in his body. He practices severe penances
    and later confronts the god of justice about his punishment. The god says the
    punishment followed from Mandavya having pierced a small insect with a blade of
    grass as a child. Mandavya declares the punishment disproportionate, establishes
    an age boundary for moral culpability, and curses the god of justice to be born
    among men in the Sudra order. The god is then born as Vidura, who is described
    as wise, calm, and devoted to the Kurus' welfare.
  language: English
  quote_policy: summarized
