canonical_text:
  quote: ''
  summary: Kadru and Vinata cross the Ocean and inspect the horse; after black hairs
    are seen in its tail, Kadru enslaves Vinata because Vinata has lost the wager.
    Garuda then bursts from his egg without his mother's help, shines like fire, grows
    rapidly, and ascends into the sky. The gods mistake his radiance for Agni's expanding
    flames and seek Agni's protection. Agni identifies the blazing being as Garuda,
    son of Kasyapa, destroyer of the Nagas, benefactor of the gods, and foe of Daityas
    and Rakshasas. The gods and Rishis praise Garuda in cosmic and divine terms and
    ask him to protect them, pacify his anger, and diminish his fiery body. Garuda
    reduces his energy and splendour.
  language: English
  quote_policy: summarized
