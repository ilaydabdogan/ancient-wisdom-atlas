canonical_text:
  quote: ''
  summary: 'Savitri and Satyavan return to the hermitage at night, where ascetics
    greet Dyumatsena''s reunion with his son and restoration of sight. Satyavan explains
    only that he suffered pain while cutting wood and fell into deep sleep. Gautama
    asks Savitri to reveal the true cause. Savitri recounts Narada''s prophecy of
    Satyavan''s death, Yama''s attempt to take him toward the realm of the Pitris,
    her praise of Yama, and the five boons she obtained: Dyumatsena''s sight and kingdom,
    sons for her father, sons for herself, and long life for Satyavan. The Rishis
    praise Savitri for rescuing the king''s race from calamity and depart peacefully.'
  language: English
  quote_policy: summarized
