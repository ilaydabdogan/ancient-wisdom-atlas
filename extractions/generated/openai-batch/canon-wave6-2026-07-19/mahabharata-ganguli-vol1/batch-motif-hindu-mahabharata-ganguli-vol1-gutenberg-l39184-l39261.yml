canonical_text:
  quote: ''
  summary: Yudhishthira travels to the rivers Nanda and Aparananda and to Hemakuta,
    where speech triggers clouds, stones, winds, and other strange conditions. Lomasa
    explains that the wrathful saint Rishava imposed this speech-taboo on the hill
    and that gods led by Indra once made the place inaccessible to avoid being seen.
    The site still bears signs of divine sacrifice, sacred fire, and sacred water.
    After bathing, the party proceeds to the Kausiki, where Lomasa identifies hermitages
    of Viswamitra and Kasyapa and recounts that Rishyasringa, born of a hind, compelled
    Indra to rain during drought and later married Santa, daughter of Lomapada. Yudhishthira
    asks for the full story of Rishyasringa.
  language: English
  quote_policy: summarized
