canonical_text:
  quote: ''
  summary: During the dice game, Vidura warns Dhritarashtra that Duryodhana, marked
    by an ominous jackal-like cry at birth, will destroy the Bharata race. Vidura
    uses maxims and examples about honey collectors, Kansa, Jambha, a greedy king
    who killed gold-producing birds, and garden cultivation to urge Dhritarashtra
    to abandon or slay Duryodhana rather than harm the Pandavas. He warns that fighting
    the sons of Pritha will lead Dhritarashtra, his sons, and troops toward Yama's
    realm.
  language: English
  quote_policy: summarized
