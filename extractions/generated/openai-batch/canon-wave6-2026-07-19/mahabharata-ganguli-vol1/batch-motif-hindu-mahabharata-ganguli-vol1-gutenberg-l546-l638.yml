canonical_text:
  quote: ''
  summary: The passage recounts Pandu's forest misfortune after killing a mating stag,
    the divine begetting and ascetic upbringing of the Pandavas, their presentation
    to Dhritarashtra amid public and supernatural acclaim, their education and virtues,
    Arjuna's winning of Krishna by archery, Yudhishthira's Rajasuya sacrifice, Duryodhana's
    envy and humiliation in Maya's hall, and the consent to an unfair dice game that
    leads toward destructive war.
  language: English
  quote_policy: summarized
