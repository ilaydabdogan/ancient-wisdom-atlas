candidate_motifs:
- id: motif:1
  label: Offense against a mating animal brings misfortune
  taxonomy_refs: []
  basis: Pandu kills a stag coupling with its mate, after which he brings a severe
    misfortune upon himself and the event serves as a warning.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes the misfortune but does not narrate its full mechanism
    or consequences here.
- id: motif:2
  label: Divine substitute begetting of heirs
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: The mothers accept Dharma, Vayu, Sakra, and the twin Aswins as substitutes
    so that lawful ordinances may be fulfilled, producing the Pandava offspring.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage names the gods and the legal purpose but gives few details
    of each child's birth.
- id: motif:3
  label: Royal children raised among ascetics before court recognition
  taxonomy_refs: []
  basis: The offspring grow up with two mothers among ascetics and are then conducted
    by Rishis to Dhritarashtra as Brahmachari pupils and Pandavas.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a passage-level pattern; no broader comparative claim is made.
- id: motif:4
  label: Auspicious supernatural acclaim at the arrival of royal youths
  taxonomy_refs:
  - royal_legitimacy
  basis: Citizens welcome the Pandavas through divine Providence, while invisible
    spirits applaud and flowers, shells, and drums accompany their arrival.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The signs support welcome and public recognition, but the passage does
    not explicitly state a coronation or formal legitimation rite.
- id: motif:5
  label: Bride won through a difficult contest of skill
  taxonomy_refs: []
  basis: Arjuna obtains the virgin Krishna at a swayamvara by performing a difficult
    archery feat before assembled Rajas.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not elaborate the full contest conditions or subsequent
    marriage arrangements.
- id: motif:6
  label: Royal sacrifice enabled by conquest and counsel
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: Arjuna's victories and the slaying of Jarasandha and Chaidya through Vasudeva's
    counsel and Pandava valor allow Yudhishthira to perform the Rajasuya.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The royal-legitimacy classification is based on the stated acquisition
    of the right to perform the Rajasuya.
- id: motif:7
  label: Rival's envy at royal splendor leads to destructive plotting
  taxonomy_refs: []
  basis: Duryodhana sees the Pandavas' wealth and Maya's hall, becomes envious and
    enraged, is humiliated, and is later connected to the unfair dice game.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage gives a causal sequence in summary form rather than a full
    narrative of Duryodhana's plotting.
- id: motif:8
  label: Unfair dice game precipitates kin-war
  taxonomy_refs: []
  basis: Dhritarashtra consents to dice; the gaming and unjust transactions lead to
    Kshatriyas killing each other, and Dhritarashtra identifies the game as unfair.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage does not provide the detailed terms of the dice game.
- id: motif:9
  label: Paternal affection enables a destructive son
  taxonomy_refs: []
  basis: Dhritarashtra says his blindness, age, miserable plight, and paternal affection
    caused him to endure Duryodhana's wilfulness and consent to events leading toward
    war.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: This motif is inferred from Dhritarashtra's retrospective explanation
    and should be reviewed against the fuller narrative.
