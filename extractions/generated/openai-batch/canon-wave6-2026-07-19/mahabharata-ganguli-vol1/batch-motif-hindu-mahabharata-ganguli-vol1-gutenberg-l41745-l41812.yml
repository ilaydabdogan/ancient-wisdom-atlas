canonical_text:
  quote: ''
  summary: Lomasa directs the sons of Pandu toward the celestial mountain Mandara
    and the sacred river Alakananda/Ganga, where gods, sages, luminaries, and Mahadeva
    are associated with the river. The Pandavas worship the river and continue. Lomasa
    then explains a vast white mountain-like object as the gathered bones of the Daitya
    Naraka, whom Vishnu slew after Naraka’s austerities threatened Indra’s position.
    Lomasa also alludes to Vishnu’s deed of lifting the sunken Earth from the nether
    regions in the form of a single-tusked boar, prompting Yudhishthira to ask for
    details.
  language: English
  quote_policy: summarized
