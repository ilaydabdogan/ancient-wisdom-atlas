canonical_text:
  quote: '"To ease the Earth of her burden, go ye and have your births in her according
    to your respective parts"'
  summary: The Earth, burdened by powerful Asuras and Danavas, seeks protection from
    Brahman. Brahman says he will appoint the dwellers in heaven, then commands gods,
    Gandharvas, and Apsaras to be born on earth in partial forms and contend with
    the Asuras. The gods accept, go to Narayana at Vaikunth, and Indra asks him to
    be incarnate; Hari agrees.
