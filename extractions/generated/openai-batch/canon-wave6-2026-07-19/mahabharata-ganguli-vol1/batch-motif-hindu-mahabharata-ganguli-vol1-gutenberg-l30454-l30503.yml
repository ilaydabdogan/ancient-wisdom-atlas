  quote: ''
  summary: Yudhishthira asks Krishna why he was absent. Krishna explains that Salwa
    attacked Dwaraka in revenge for Sisupala's death while Krishna was away; Krishna
    then pursued Salwa, found him on an ocean island, challenged him with the Panchajanya
    conch, subdued Danavas, and came after hearing of the unfair dice game at Hastinapur.
  language: English
