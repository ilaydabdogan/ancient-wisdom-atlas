canonical_text:
  quote: the Brahmana born of her will relieve the snakes
  summary: 'Jaratkaru tells her son Astika that the time has come for the purpose
    of her marriage: the relief of the snakes from Kadru''s curse. She recounts the
    curse, Brahman''s prophecy of a rescuer born from the two Jaratkarus, and asks
    Astika to protect Vasuki and the snakes from the sacrificial fire. Astika vows
    to go to Janamejaya''s sacrifice, calm Vasuki''s fear, and use speech and blessings
    to make the sacrifice stop; he then reaches the sacrificial compound, gains entry
    after being refused by gatekeepers, and begins to honor the king, priests, assembly,
    and sacred fire.'
  language: English
  quote_policy: quoted
