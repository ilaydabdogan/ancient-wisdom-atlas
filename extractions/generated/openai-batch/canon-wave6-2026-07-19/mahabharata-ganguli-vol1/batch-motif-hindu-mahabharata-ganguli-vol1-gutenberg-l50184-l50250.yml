canonical_text:
  quote: ''
  summary: Swaha asks Skanda to grant her lasting association as wife of the Fire-god.
    Skanda establishes that oblations through Agni will be coupled with Swaha’s name.
    Brahma explains Mahasena’s divine parentage and the origin of fierce followers,
    twins, spirits, bells, and standards. The passage closes with Skanda/Mahasena
    splendidly seated on the Golden/White Mountain amid gods, Pisachas, celestial
    beings, music, dance, and universal rejoicing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Swaha appears before Skanda, calls him her natural son, and asks him to grant
    her happiness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Swaha identifies herself as Daksha’s daughter and says she has loved Hutasana,
    the Fire-god, since youth and wants to live forever with him as his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Skanda says that virtuous people’s oblations to gods or ancestors, offered
    through Agni with purifying hymns, will be coupled with Swaha’s name, thereby
    associating her with Agni.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Swaha is pleased and, associated with Pavaka as her husband, honors Skanda
    in return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahma tells Mahasena to visit his father Mahadeva and says Rudra with Agni
    and Uma with Swaha combined to make Mahasena invincible for the welfare of creatures.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brahma says Rudra’s semen, cast into Uma’s reproductive organ, was thrown
    back on a hill, producing the twins Mujika and Minjika; other portions fell into
    the Blood Sea, the rays of the sun, and the earth, and fierce followers were produced
    from the semen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Markandeya says five classes of spirits should be worshiped with sunflower
    for wealth and disease relief; Mujika and Minjika should be respected for children’s
    welfare; and tree-produced, human-flesh-eating female spirits should be worshiped
    by those desiring children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Airavata’s two bells called Vaijayanti are brought by Sakra and given to Guha;
    Visakha takes one bell and Skanda the other, and both have red standards.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mahasena is surrounded by gods and Pisachas and seated on the Golden Mountain,
    which is described as forested and compared with Mandara hill and its caves.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The White Mountain is described with flowering trees, celestial deer and birds,
    clouds sounding like instruments, Gandharvas and Apsaras dancing, and all creatures
    rejoicing while people gaze on Skanda.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
