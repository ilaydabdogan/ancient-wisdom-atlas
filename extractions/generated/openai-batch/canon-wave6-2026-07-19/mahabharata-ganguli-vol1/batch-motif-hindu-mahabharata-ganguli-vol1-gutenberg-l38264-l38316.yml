  quote: Give me a portion according to thy ability and without doing injury to others.
  summary: Agastya seeks wealth from several kings, but each reports that income and
    expenditure are equal. Agastya declines to take wealth when doing so would injure
    creatures. The kings then suggest approaching the wealthy Danava Ilwala, and all
    go together to him.
