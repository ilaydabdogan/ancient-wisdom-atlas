canonical_text:
  quote: ''
  summary: Kotikakhya reports his encounter with Krishna/Draupadi and identifies her
    to Jayadratha as Drupada's daughter and the wife of the five sons of Pandu. Jayadratha,
    already captivated by her, enters the solitary hermitage, greets her, and hears
    her offer hospitality. He urges her to ride in his chariot, abandon the exiled
    Pandavas, become his wife, and share his kingdoms. Draupadi rejects and reproves
    him while awaiting her husbands' return.
