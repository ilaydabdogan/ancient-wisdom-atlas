  quote: he gave unto that Brahmana the entire proceeds of that day
  summary: Markandeya tells of kings Vrishadarbha and Seduka. A Brahmana seeking wealth
    for his preceptor asks Seduka for a thousand steeds. Seduka sends him to Vrishadarbha,
    citing that king's unuttered vow. Vrishadarbha whips the Brahmana, debates the
    threatened curse, then gives him the day's proceeds, exceeding the value of the
    requested horses.
