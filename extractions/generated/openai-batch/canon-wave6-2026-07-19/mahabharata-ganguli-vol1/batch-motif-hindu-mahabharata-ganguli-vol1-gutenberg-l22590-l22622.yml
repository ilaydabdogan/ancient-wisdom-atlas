canonical_text:
  quote: ''
  summary: 'Narada questions a king about righteous governance: listening to elders,
    making gifts, paying and honoring artisans, studying military and technical knowledge,
    protecting the realm from dangers, caring for vulnerable people, and avoiding
    faults. The king bows to Narada, accepts the instruction, follows it, gains the
    Earth bounded by seas, and is told that a ruler who protects the four orders lives
    happily and reaches Sakra''s region.'
