  quote: "“If we could be of any help to him, we should then be requiting his services.”"
  summary: After the Pandavas arrive at Ekachakra and live as mendicants in a Brahmana's
    house, Kunti hears lamentation from the host's apartments. She tells Bhima that
    they should repay the Brahmana's hospitality by helping him, and Bhima asks her
    to learn the cause of the distress, saying he will relieve it however difficult
    it is.
