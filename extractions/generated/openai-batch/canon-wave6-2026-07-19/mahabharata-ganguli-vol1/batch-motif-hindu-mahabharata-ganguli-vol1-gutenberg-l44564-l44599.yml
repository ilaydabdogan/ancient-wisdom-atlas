canonical_text:
  quote: ''
  summary: 'The speaker recounts praise for an extraordinary martial feat: the destruction
    of the aerial Danava city Hiranyapura and the slaying of Asura enemies. The wives
    of the defeated Danavas mourn, the city loses its beauty and vanishes, and Matali
    conveys the speaker back to Indra. Indra and the celestials praise the deed, declare
    that the speaker has paid the preceptor''s fee by slaying Indra''s enemies, promise
    future martial success, and foretell Yudhishthira''s rule over the earth.'
  language: English
  quote_policy: summarized
