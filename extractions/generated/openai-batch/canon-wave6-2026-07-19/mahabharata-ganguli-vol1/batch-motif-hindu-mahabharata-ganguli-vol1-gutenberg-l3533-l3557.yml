canonical_text:
  quote: ''
  summary: Sauti narrates that Indra, adored by Kadru, commands blue clouds to pour
    vivifying rain. The clouds thunder, flash with lightning, and pour abundant water
    until the sky appears like the end of a Yuga; the sun and moon vanish behind the
    downpour. The Nagas rejoice, the earth is filled with water, and the snakes with
    their mother reach the island called Ramaniyaka in safety.
