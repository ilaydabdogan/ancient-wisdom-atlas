candidate_motifs:
- id: motif:1
  label: Conditional divine scribal collaboration
  taxonomy_refs: []
  basis: Ganesa, called a divinity, agrees to be the writer under a condition, while
    Vyasa sets a comprehension condition and composes difficult passages.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage supports a divine writing collaboration but does not provide
    an external comparison or a named motif family.
- id: motif:2
  label: Wisdom text dispelling ignorance
  taxonomy_refs:
  - wisdom
  basis: The work's wisdom is described as opening the eyes of the world and dispelling
    ignorance through images of collyrium, sun, moon, and lamp.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The motif is based on explicit praise imagery rather than a narrative
    episode.
- id: motif:3
  label: Text as tree
  taxonomy_refs: []
  basis: The Bharata is mapped to a tree with textual sections as seed, roots, trunk,
    branches, leaves, flowers, fruit, sap, shade, and other parts.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage supports a tree metaphor; it does not explicitly present the
    tree as a world axis or world center.
- id: motif:4
  label: Royal lineage continuation through sage paternity
  taxonomy_refs:
  - royal_legitimacy
  basis: Vyasa fathers Dhritarashtra, Pandu, and Vidura by the two wives of Vichitra-virya,
    and the passage later frames the Bharata as representing the house of Kuru.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage gives a lineage foundation, but it does not explicitly argue
    a theory of legitimacy in this excerpt.
- id: motif:5
  label: Sacred recitation within sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Vaisampayana recites the Bharata during intervals of sacrificial ceremonies
    after being instructed by Vyasa and urged to proceed.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The sacrifice is a recitation setting; the passage does not narrate sacrificial
    action in detail.
- id: motif:6
  label: Transmission of sacred knowledge across worlds
