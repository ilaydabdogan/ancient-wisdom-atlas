  summary: The passage describes Ganesa agreeing to write Vyasa's work under a condition,
    Vyasa composing difficult verses, Sauti praising the Bharata as a wisdom-dispelling
    work and as a tree, Vyasa's role in the Kuru lineage, the publication and recitation
    of the Bharata at a sacrifice, its contents, its different compilations and reciters
    across worlds, and a final tree analogy centered on Yudhishthira and his kin.
  language: English
