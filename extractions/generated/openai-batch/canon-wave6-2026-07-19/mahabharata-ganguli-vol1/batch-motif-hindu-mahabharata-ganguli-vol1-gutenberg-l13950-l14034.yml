canonical_text:
  quote: ''
  summary: Karna enters the public arena with natural mail and earrings and is identified
    as born of Pritha in maidenhood and begotten by the Sun. He challenges Arjuna,
    wins Duryodhana's immediate friendship and patronage, and prepares for a duel.
    Celestial signs align Indra with Arjuna and the Sun with Karna. Kunti faints on
    seeing the two armored sons ready to fight. Kripa demands Karna's lineage before
    a royal duel, and Duryodhana responds by promising to install Karna as king of
    Anga.
  language: English
  quote_policy: summarized
