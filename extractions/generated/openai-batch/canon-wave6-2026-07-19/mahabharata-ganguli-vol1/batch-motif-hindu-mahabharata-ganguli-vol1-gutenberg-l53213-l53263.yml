canonical_text:
  quote: ''
  summary: After Draupadi has been recovered from Jayadratha, Bhima vows to kill the
    Sindhu king, while Yudhishthira urges restraint for the sake of Dussala and Gandhari.
    Draupadi demands that the abductor be slain. Yudhishthira returns with Draupadi
    to the hermitage, while Bhima and Arjuna pursue Jayadratha; Arjuna disables him
    by killing his horse with mantra-inspired arrows, rebukes his flight, and later
    restrains Bhima from killing him.
