canonical_text:
  quote: ''
  summary: A hawk demands a pigeon that has sought a king's protection, arguing that
    the bird is its divinely appointed food and that denying it will harm the hawk's
    family. The king refuses to surrender the pigeon, offers substitutes, and then
    agrees to weigh his own flesh against it. After the king mounts the scale himself,
    the hawk reveals himself as Indra and the pigeon as Agni, declaring that they
    came to test the king's merit. Indra ascends to heaven, and King Usinara later
    ascends in radiant form.
  language: English
  quote_policy: summarized
