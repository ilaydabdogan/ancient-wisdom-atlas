canonical_text:
  quote: ''
  summary: Yudhishthira asks the people and Brahmanas who have followed the Pandavas
    out of affection to return to Hastinapura and care for Bhishma, Dhritarashtra,
    Vidura, his mother, and other well-wishers. The people wail and reluctantly go
    back. The Pandavas travel by car to the Pramana banian tree on the Ganges, purify
    themselves with sacred water, and spend the night taking only water. Brahmanas
    with disciples and relatives remain with them, light sacred fires, chant the Vedas,
    converse, and comfort the king.
  language: English
  quote_policy: summarized
