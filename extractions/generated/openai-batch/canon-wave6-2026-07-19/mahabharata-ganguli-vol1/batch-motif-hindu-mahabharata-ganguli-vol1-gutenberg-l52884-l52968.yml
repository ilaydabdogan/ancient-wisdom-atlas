canonical_text:
  quote: "“Defile me not by your touch!”"
  summary: Draupadi angrily rebukes Jayadratha for insulting the Pandavas and warns
    him that her warrior protectors will punish him. Jayadratha dismisses her threats
    and attempts to force her onto a vehicle. She resists, calls Dhaumya, is seized
    and dragged by Jayadratha, and finally ascends his chariot after worshipping Dhaumya's
    feet. Dhaumya warns Jayadratha that he violates Kshatriya custom by carrying her
    away without first defeating the Pandavas, then follows her through Jayadratha's
    infantry.
  language: English
  quote_policy: quoted
