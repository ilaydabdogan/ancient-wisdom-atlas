canonical_text:
  quote: ''
  summary: The Pandavas arrive at Varanavata and are joyfully welcomed by the citizens.
    Purochana lodges them and later directs them into a mansion called the Blessed
    Home, which Yudhishthira identifies as a secretly inflammable house built to burn
    them. Yudhishthira explains that Vidura had warned him, rejects immediate flight,
    and proposes remaining outwardly unsuspecting while secretly preparing disguises,
    wandering routes, and a subterranean escape passage.
  language: English
  quote_policy: summarized
