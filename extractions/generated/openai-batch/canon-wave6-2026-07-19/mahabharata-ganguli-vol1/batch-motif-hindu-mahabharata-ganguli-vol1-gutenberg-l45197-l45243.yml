canonical_text:
  quote: ''
  summary: Yudhishthira asks the snake how illusion could overpower one who possessed
    knowledge and had lived in heaven. The snake, identified later as King Nahusha,
    explains that prosperity and pride caused his fall. In heaven, he rode a celestial
    chariot, exacted tribute from many beings, and caused creatures to lose power
    by his gaze. When Agastya was drawing his conveyance, Nahusha's feet touched Agastya's
    body, and Agastya cursed him to become a snake. As Nahusha fell from the heavenly
    car, he turned into a snake and begged for the curse to end. Agastya foretold
    that Yudhishthira would save him when pride was extinguished. Nahusha states that
    virtues, not family or race, secure salvation; he blesses Bhima and says he must
    return to Heaven. He then leaves his serpentine form, assumes a celestial shape,
    and returns to Heaven. Yudhishthira returns to the hermitage with Dhaumya and
    Bhima, narrates the event, and the Brahmanas admonish Bhima for foolhardiness.
  language: English
  quote_policy: summarized
