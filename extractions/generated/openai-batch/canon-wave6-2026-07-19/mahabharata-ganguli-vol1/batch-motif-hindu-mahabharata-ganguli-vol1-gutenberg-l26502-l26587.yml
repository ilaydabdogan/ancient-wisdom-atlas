    orders, and Mlechchas. Tribute includes gold, gems, elephants, horses, perfumes,
    sandal, servants, and even a kingdom. Many groups wait at the gate and some are
    refused or admitted after giving tribute. The passage also states the exceptionally
    close bond between Krishna and Arjuna.
