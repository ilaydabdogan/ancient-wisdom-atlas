canonical_text:
  quote: ''
  summary: In Section LVI, Janamejaya is inclined to grant the Brahmana boy Astika
    a boon, while the priests delay until Takshaka arrives at the snake sacrifice.
    The priests and Lohitaksha report that Takshaka is hidden with Indra under a boon
    protecting him from Agni. Through mantras and libations, Indra appears and Takshaka
    is forced into view; Indra abandons him, and Takshaka is drawn toward the sacrificial
    fire. Astika asks as his boon that the sacrifice end and no more snakes fall into
    the fire, refusing material wealth. The Sadasyas urge the king to grant the Brahmana
    his boon.
  language: English
  quote_policy: summarized
