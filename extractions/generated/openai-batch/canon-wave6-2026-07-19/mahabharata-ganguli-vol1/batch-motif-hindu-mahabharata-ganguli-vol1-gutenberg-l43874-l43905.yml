canonical_text:
  quote: ''
  summary: Vaisampayana narrates that after night had passed, Dhananjaya and his brothers
    paid homage to Yudhishthira. Celestial sounds, cries of animals and birds, and
    a retinue of Gandharvas and Apsaras accompanied the arrival of Purandara, the
    king of the celestials, in a golden car. Yudhishthira and his brothers worshipped
    him properly. Dhananjaya bowed humbly before him, and Yudhishthira rejoiced. Purandara
    blessed Yudhishthira, saying that he would rule the earth and should return to
    Kamyaka. The passage ends with a statement that one who observes vows and reads
    this meeting of Sakra with the Pandavas gains long, undisturbed, happy life.
  language: English
  quote_policy: summarized
