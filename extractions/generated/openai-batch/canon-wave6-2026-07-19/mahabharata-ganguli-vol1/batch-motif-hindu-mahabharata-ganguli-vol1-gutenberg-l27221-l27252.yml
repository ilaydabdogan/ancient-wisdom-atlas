canonical_text:
  quote: '"Gambling is the root of dissensions. It bringeth about disunion."'
  summary: Vidura warns the king and the Kaurava assembly that gambling with the Pandavas
    will create enmity, disunion, wrath, and war. He urges them not to follow Duryodhana's
    course, not to enter the destructive fire of conflict, to value the Pandavas above
    their wealth, and to send Sakuni away.
  language: English
  quote_policy: quoted
