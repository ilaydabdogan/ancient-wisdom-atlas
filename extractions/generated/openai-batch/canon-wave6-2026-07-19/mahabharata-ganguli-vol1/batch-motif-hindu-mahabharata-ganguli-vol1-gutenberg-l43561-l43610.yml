  quote: ''
  summary: Kuvera reassures Yudhishthira and Bhima after Bhima's destruction of Yakshas
    and Rakshasas, saying the deaths were fated and foreseen by the gods. Kuvera explains
    that Bhima's act has freed him from a curse imposed by Agastya after Kuvera's
    friend Maniman insulted the ascetic during his austerities on the Yamuna bank.
  language: English
