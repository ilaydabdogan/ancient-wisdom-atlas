canonical_text:
  quote: '"he was revived with the tree by the power of the Brahmana"'
  summary: Ministers tell Janamejaya of a man who climbed a dry-branched tree for
    sacrificial fuel, was burned to ashes with the tree, and was revived with it by
    a Brahmana. Janamejaya hears this report, grieves for his father, performs a water-touching
    rite, and declares his resolve to avenge his father's death upon Takshaka, who
    he says prevented Kasyapa from reviving the king.
  language: English
  quote_policy: quoted
