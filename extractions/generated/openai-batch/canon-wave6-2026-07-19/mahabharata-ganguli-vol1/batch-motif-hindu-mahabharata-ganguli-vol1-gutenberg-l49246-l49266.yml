  quote: ''
  summary: Markandeya addresses a Kuru king and recounts the family of Angiras, identified
    as the third son of Brahma. Angiras's wife is Subha. Their children include the
    son Vrihaspati and seven daughters, each described with names and attributes connected
    with beauty, love, visibility, refulgence, oblations, piety, sacrifice, and the
    name Kuhu.
  language: English
