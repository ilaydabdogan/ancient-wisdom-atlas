canonical_text:
  quote: ''
  summary: Lomasa narrates that Yavakri entered Raivya's hermitage, saw Raivya's daughter-in-law,
    and addressed her with desire. She, fearing curse and Raivya's power, agreed outwardly
    and detained him. Raivya returned, learned of Yavakri's misconduct, became angry,
    and sacrificed two matted locks of hair into the sacred fire with mantras. A female
    resembling his daughter-in-law and a fierce demon emerged. Raivya ordered them
    to kill Yavakri. The created female took Yavakri's sacred water-pot; the demon
    pursued him with a spear. Yavakri found water sources dry and was barred from
    his father's Agnihotra room by a blind Sudra warder. The demon pierced him in
    the heart and returned to Raivya.
  language: English
  quote_policy: summarized
