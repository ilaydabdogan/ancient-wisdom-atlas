canonical_text:
  quote: ''
  summary: Nala, after leaving Damayanti, enters a forest conflagration to answer
    a cry and finds the Naga Karkotaka. Karkotaka explains that Narada cursed him
    to remain immobile until Nala carried him away. Nala rescues him; at the tenth
    step Karkotaka bites Nala, changing his form. Karkotaka says the altered appearance
    will conceal Nala, while his venom will torment the deceiver dwelling in him.
    He grants protections, directs Nala to Rituparna of Ayodhya under the name Vahuka,
    promises exchange of skills, reunion with wife and children, recovery of kingdom
    and true form, gives celestial cloth, and disappears.
  language: English
  quote_policy: summarized
