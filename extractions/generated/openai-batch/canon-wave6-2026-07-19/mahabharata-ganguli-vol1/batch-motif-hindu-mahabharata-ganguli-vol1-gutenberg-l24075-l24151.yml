canonical_text:
  quote: ''
  summary: Jarasandha denies having injured Krishna and his companions and appeals
    to Kshatriya practice. Krishna replies that Jarasandha has captured many Kshatriya
    kings and intends to sacrifice them to Rudra/Sankara, identifies himself and the
    two sons of Pandu as challengers, and demands that Jarasandha release the captive
    monarchs or fight. Jarasandha defends his captivity of defeated kings as Kshatriya
    duty, refuses to release them from fear, and offers combat against one, two, or
    three opponents.
  language: English
  quote_policy: summarized
