  quote: ''
  summary: Jaratkaru, a Brahmana/Rishi of vows and austerities, searches for a wife
    and prays in the forest for a bride after remembering his ancestors’ words. Vasuki
    offers his younger sister, but Jaratkaru hesitates because he will only marry
    a woman with the same name as himself. Vasuki states that his sister is also named
    Jaratkaru and gives her to him; Jaratkaru marries her with ordained rites.
