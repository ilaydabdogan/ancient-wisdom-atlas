canonical_text:
  quote: ''
  summary: Markandeya recounts a royal genealogy from Ikshvaku through Vrihadaswa
    and Kuvalaswa. Vrihadaswa installs Kuvalaswa on the throne and prepares to retire
    to the woods. The Brahmana Utanka urges him not to abandon royal protection, describing
    the waterless sandy region Ujjalaka near his asylum, where the underground Danava
    Dhundhu dwells. Dhundhu, son of Madhu and Kaitabha, has a boon of invulnerability
    against several classes of beings, performs austerity seeking sovereignty over
    the celestials and the three worlds, and yearly causes earth-tremors, sand-clouds,
    darkness, fire, and smoke by waking and breathing. Utanka asks that the Asura
    be slain for the good of the world, saying Vishnu will add his invincible energy
    to the king who kills Dhundhu.
  language: English
  quote_policy: summarized
