canonical_text:
  quote: ''
  summary: Lomasa recounts the birth and early seclusion of Rishyasringa, son of the
    ascetic Vibhandaka and a hind who had been a daughter of the gods. In Anga, King
    Lomapada's offense against a Brahmana is followed by priestly estrangement and
    Indra's withholding of rain. Advisers tell Lomapada that Rishyasringa's presence
    will bring rain, and the king arranges for courtesans to lure the forest ascetic
    into his territory.
  language: English
  quote_policy: summarized
