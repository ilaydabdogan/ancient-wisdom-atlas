canonical_text:
  quote: thou art competent to transfer this thy decrepitude to another
  summary: Yayati, cursed by the angry Usanas, loses his youth and is overcome by
    decrepitude. He asks Sukra for relief because he has not been satiated with youth
    or Devayani. Sukra says the condition is real but permits Yayati to transfer his
    decrepitude to another. Yayati asks that the son who gives him youth inherit the
    kingdom and gain virtue and fame; Sukra confirms that such a son will become successor
    and receive long life, wide fame, and numerous progeny.
  language: English
