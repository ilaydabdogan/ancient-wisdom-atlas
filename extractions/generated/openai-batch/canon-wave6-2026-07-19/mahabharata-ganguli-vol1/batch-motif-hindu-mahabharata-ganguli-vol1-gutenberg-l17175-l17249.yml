canonical_text:
  quote: ''
  summary: In a narrated episode, King Viswamitra reaches Vasishtha's asylum after
    hunting and is hospitably received. Vasishtha's cow Nandini produces desired foods,
    drink, gems, and robes. Viswamitra asks to obtain her in exchange for ten thousand
    cows or his kingdom, but Vasishtha refuses because she is kept for gods, guests,
    Pitris, and sacrifices. Viswamitra threatens force, seizes and persecutes Nandini,
    and Nandini appeals to Vasishtha, who maintains Brahmanical forgiveness and says
    he does not cast her off.
  language: English
  quote_policy: summarized
