canonical_text:
  quote: '"together went into the forest"'
  summary: Yudhishthira, his brothers, Krishna/Yajnaseni, their priest, attendants,
    and household retainers depart toward the forest after giving gifts to Brahmanas.
    Citizens and Brahmanas of Kurujangala surround and salute Yudhishthira, lament
    his departure, condemn his enemies, and recall Indraprastha and the palace built
    by Maya. Arjuna answers that the king will live in the forest and asks the people
    and Brahmanas to seek what may serve their good. After farewell, the citizens
    return home with heavy hearts.
  language: English
  quote_policy: quoted
