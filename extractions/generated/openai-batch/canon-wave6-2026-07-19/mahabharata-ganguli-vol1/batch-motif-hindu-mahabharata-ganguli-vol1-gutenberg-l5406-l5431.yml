  quote: ''
  summary: Sauti narrates the beginning of the snake-sacrifice. Priests in black garments
    pour clarified butter into the blazing fire and into Agni's mouth while uttering
    mantras and snake names. Snakes of many colors, ages, sizes, and strengths tremble,
    lose bodily control, fall into the fire, and perish, described as afflicted by
    their mother's curse.
