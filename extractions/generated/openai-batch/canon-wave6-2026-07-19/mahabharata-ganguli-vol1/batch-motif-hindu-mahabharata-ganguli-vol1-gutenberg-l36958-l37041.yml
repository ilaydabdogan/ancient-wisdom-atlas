canonical_text:
  quote: ''
  summary: The passage gives an itinerary of sacred tirthas and rivers, prescribing
    bathing, fasting, vows, worship of gods and Pitris, offerings, regulated diet,
    and residence at specified places. These actions are said to yield sacrificial
    merit, cleansing from sin, heavenly worship, ascent to divine regions, knowledge,
    beauty, lineage sanctification, and deliverance. Naimisha is described as containing
    all earthly tirthas and as the dwelling place of Brahma with the gods; Gopratra
    is linked to Rama's ascent to heaven; Varanasi and Avimukta are linked to worship
    or sight of a bull-marked deity and deliverance.
  language: English
  quote_policy: summarized
