- id: obs:3
  text: In Chitraratha forest, some inhabitants attribute the misery to Agni cohabiting
    with six wives of the seven Rishis, while others who saw the goddess in bird disguise
    attribute it to a bird.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: No one suspects Swaha at first; after hearing that the male child is hers,
    she goes to Skanda and gradually reveals that she is his mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seven Rishis divorce their six wives, except Arundhati, after hearing
