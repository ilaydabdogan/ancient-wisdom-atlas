canonical_text:
  quote: ''
  summary: At Skanda/Mahasena's birth, fearful cosmic phenomena occur, including reversals
    of paired contraries. Forest dwellers blame Agni's union with the six wives of
    the seven Rishis, or a bird, while Swaha reveals herself as the child's mother.
    The seven Rishis abandon their six wives except Arundhati despite Viswamitra's
    later explanation of their innocence. Viswamitra performs childhood rites for
    Skanda. The gods fear Skanda's power and urge Sakra to kill him; Sakra refuses,
    and the Great Mothers sent against Skanda instead become his adoptive nursing
    mothers. Agni comes to tend his son, and later transforms into a goat-mouthed
    trader who delights the child with toys in a mountain abode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'When the powerful being is born, fearful phenomena occur: paired contraries
    such as male and female and heat and cold are reversed, celestial regions shine,
    and the earth rumbles.'
