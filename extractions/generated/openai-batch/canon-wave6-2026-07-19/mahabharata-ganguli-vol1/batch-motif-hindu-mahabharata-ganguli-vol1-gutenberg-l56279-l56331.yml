canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Pritha/Kunti serves a Brahmana ascetic with
    unwavering care for a full year despite unpredictable arrivals, demands, reproaches,
    and harsh words. Pleased, the Brahmana offers her difficult-to-obtain boons. When
    she declines, he gives her a mantra by which any invoked celestial will appear
    and come under her power. Because she fears a curse, she does not refuse again.
    The Brahmana imparts mantras associated in the passage with the beginning of the
    Atharvan Veda, announces to Kuntibhoja that he has been gratified by Pritha, departs,
    and vanishes; Kuntibhoja then honors his daughter.
  language: English
  quote_policy: summarized
