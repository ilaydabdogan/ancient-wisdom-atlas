canonical_text:
  quote: ''
  summary: After returning to Narayana's hermitage, Yudhishthira recalls Arjuna's
    appointed return to the sacred mountain-cliff Sweta after five years of military
    training. He gathers his brothers, Draupadi, Brahmanas, and attendants, receives
    the assent and blessing of ascetics, and travels north through dangerous mountain
    country toward the Himalayas. The party stays at Vrishaparva's hermitage, entrusts
    people and valuables there, receives instructions and blessings, and continues
    north.
  language: English
  quote_policy: summarized
