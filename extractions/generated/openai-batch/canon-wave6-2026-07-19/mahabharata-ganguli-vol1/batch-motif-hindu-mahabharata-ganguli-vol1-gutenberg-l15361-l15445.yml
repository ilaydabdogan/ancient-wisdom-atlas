canonical_text:
  quote: ''
  summary: A cannibal Rakshasa named Hidimva sees and smells the sleeping Pandavas
    and sends his sister to kill them for food. The sister sees Bhima awake, falls
    in love with him, assumes a human form, warns him of her brother, asks him to
    become her husband, and offers rescue and life in inaccessible mountain regions.
    Bhima refuses to abandon his sleeping mother and brothers and declares that he
    does not fear the Rakshasa.
  language: English
