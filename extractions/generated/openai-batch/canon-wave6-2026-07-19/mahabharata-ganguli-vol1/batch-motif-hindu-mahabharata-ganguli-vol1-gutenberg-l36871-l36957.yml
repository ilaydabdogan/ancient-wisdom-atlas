  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Jnanapavana, sojourning grants the merit of the Agnishtoma sacrifice and
    access to the region of the Munis; Saugandhika-vana is inhabited by celestial
    and semi-divine beings, and entering it cleanses sins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Saraswati is known there as the goddess Plaksha; bathing in water issuing
    from an ant-hill and worshipping the Pitris and gods gives horse-sacrifice merit.
    A nearby tirtha, Isanadhyushita, is described as Puranically attested and ritually
    meritorious.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Visits to Sugandha, Satakumbha, and Panchayaksha lead to being adored in heaven;
    bathing and worship at Trisulakhata lead after death to Ganapatya status.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Goddess Sakamvari subsisted on herbs for a thousand celestial years, hosted
    ascetic Rishis with herbs, and grants merit to a pilgrim who observes purity,
    Brahmacharya, and three nights of herb-subsistence there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Suvarna, Vishnu worshipped Rudra for grace and received difficult-to-obtain
    boons; Rudra declared Krishna beloved and foremost. A pilgrim worshipping the
    bull-marked deity there gains horse-sacrifice merit and Ganapatya status.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Fasting at Dhumavati grants cherished wishes; disciplined approach to Rathavarta
    grants an exalted state through Mahadeva's grace; bathing at Dhara removes sins
    and sorrow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After bowing to Himavat, the pilgrim goes to the source of the Ganges, described
    as like the gate of heaven; bathing at Koti, residing there, and offering water
    oblations at nearby places grant sacrificial merit, cattle-gift merit, family
    deliverance, and honor in virtuous regions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Fasting at Kanakhala grants horse-sacrifice merit and heaven. At Kapilavata
