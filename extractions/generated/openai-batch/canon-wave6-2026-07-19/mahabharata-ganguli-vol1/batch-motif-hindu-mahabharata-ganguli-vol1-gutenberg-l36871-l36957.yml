canonical_text:
  quote: ''
  summary: Pulastya instructs a king on a sequence of sacred tirthas. The passage
    describes bathing, fasting, vows, worship of gods and Pitris, water oblations,
    and visits to named places as producing purification, sacrificial merit, heavenly
    ascent, rescue of family lines, fulfilled wishes, and exalted statuses. It also
    recounts the herb-austerity and hospitality of the goddess Sakamvari, Vishnu's
    worship of Rudra at Suvarna and the resulting boon, the source of the Ganges near
    Himavat as a gate of heaven, and a Naga-associated tirtha of Kapila.
  language: English
  quote_policy: summarized
