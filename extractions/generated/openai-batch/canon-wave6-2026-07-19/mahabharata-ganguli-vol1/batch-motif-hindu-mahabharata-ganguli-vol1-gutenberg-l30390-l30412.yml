canonical_text:
  quote: my words shall never be futile!
  summary: Vaisampayana narrates a scene in an assembly of heroes. Vasudeva addresses
    the weeping Draupadi, promises vengeance on those who wronged her, pledges effort
    for the sons of Pandu, and promises she will again be queen of kings. Draupadi
    looks toward Arjuna, who reassures her. Dhrishtadyumna then declares which warriors
    will slay named enemies and says that with Rama and Krishna as allies they are
    invincible. The heroes then turn toward Vasudeva as he begins to speak again.
  language: English
  quote_policy: quoted
