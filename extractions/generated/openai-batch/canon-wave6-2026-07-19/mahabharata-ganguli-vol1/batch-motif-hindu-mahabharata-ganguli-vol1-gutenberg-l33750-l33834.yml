canonical_text:
  quote: When the high-souled Partha went to Indra's region for obtaining weapons
  summary: Janamejaya asks what Yudhishthira and the other sons of Pandu did after
    Arjuna went to Indra's region for weapons. Vaisampayana says they remained in
    the Kamyaka woods with Krishna, grieving over Arjuna's absence and the loss of
    their kingdom. Bhima urges Yudhishthira to summon Arjuna and Janardana, attack
    Duryodhana and the Dhartarashtras before the exile period ends, justify deceit
    against the deceitful, and treat a shortened period as equivalent to thirteen
    years by Vedic reasoning. Yudhishthira pacifies Bhima, refuses to speak untruth,
    and says Bhima will kill Duryodhana after the thirteenth year without fraud, aided
    by the wielder of Gandiva.
  language: English
  quote_policy: quoted
