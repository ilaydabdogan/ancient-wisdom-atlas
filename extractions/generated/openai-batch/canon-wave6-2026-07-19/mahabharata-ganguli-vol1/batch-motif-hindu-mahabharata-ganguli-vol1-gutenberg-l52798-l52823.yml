  quote: ''
  summary: Vaisampayana narrates Draupadi's reply to a prince identified as Kotika,
    son of Suratha. Alone in the forest, she explains the propriety concerns of speaking
    with him, states her royal lineage and her five husbands, says the husbands have
    gone hunting in the four directions, invites the visitors to receive proper hospitality,
    and then enters her cottage.
