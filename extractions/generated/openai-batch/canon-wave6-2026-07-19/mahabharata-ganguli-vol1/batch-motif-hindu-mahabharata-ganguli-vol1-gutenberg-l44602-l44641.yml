canonical_text:
  quote: ''
  summary: Arjuna recounts Indra's assurance that he possesses celestial weapons,
    Indra's gift of divine equipment, his stay in Indra's sacred abode, his departure
    after five years, and his return to his brothers on Gandhamadana. Yudhishthira
    praises Arjuna's divine encounters and return, anticipates victory over Dhritarashtra's
    sons, and asks to see the weapons used against the Nivata-Kavachas; Arjuna promises
    to show them the next morning.
  language: English
