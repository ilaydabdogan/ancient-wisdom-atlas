canonical_text:
  quote: ''
  summary: A Muni receives a mango while meditating, consecrates it with mantras,
    and gives it to King Vrihadratha so he may have offspring. The king divides the
    fruit between his two wives; both conceive and each gives birth to a living half-body.
    The fragments are abandoned, found by the Rakshasa woman Jara, and joined into
    one strong infant. Jara chooses not to kill the child, assumes human form, and
    returns him to the king and queens, who nurse him.
  language: English
  quote_policy: summarized
