canonical_text:
  quote: ''
  summary: The supplied passage begins with an incomplete fragment foretelling Kapataroman's
    emergence from an addressed person's body and future renown. In Section CLXLVII,
    the son of Pandu asks Markandeya about the good fortune of kings. Markandeya narrates
    that at Ashtaka's horse-sacrifice, Ashtaka and his brothers Pratardana, Vasumanas,
    and Sivi meet Narada and ask which of them will fall from heaven first. Narada
    says Ashtaka will fall for self-praise after giving cattle, Pratardana for giving
    away his car-horses while speaking disparagingly, and Vasumanas for failing to
    give Narada a praised flowery car.
  language: English
