canonical_text:
  quote: ''
  summary: Kama asks a Brahmana who has shown him kindness to reveal his identity.
    The Brahmana identifies himself as the one of a thousand rays and advises Kama
    for his good. Kama recognizes the divine address but refuses to abandon his vow
    of generosity. He says that if Sakra or Indra comes disguised as a Brahmana to
    ask for his ear-rings and mail for the benefit of the sons of Pandu, he will give
    them, even at the cost of life, because fame is preferable to survival with infamy.
    He cites an ancient saying about fame and describes gaining renown through gift-giving,
    war, protection of the frightened, and sacrifice of his own life.
  language: English
  quote_policy: summarized
