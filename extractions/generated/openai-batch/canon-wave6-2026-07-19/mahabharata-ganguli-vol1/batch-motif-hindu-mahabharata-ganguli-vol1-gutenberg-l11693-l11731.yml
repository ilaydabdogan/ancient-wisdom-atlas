canonical_text:
  quote: ''
  summary: Vaisampayana recounts that Pandu distributes wealth won by his prowess
    to royal elders and kin. Dhritarashtra uses that wealth to perform great sacrifices.
    Later Pandu leaves palace life with Kunti and Madri and lives in the wooded southern
    slope of the Himavat, armed and hunting. People continue supplying him at Dhritarashtra's
    command. Bhishma arranges the marriage of Devaka's unnamed daughter to Vidura,
    who has many children by her.
  language: English
  quote_policy: summarized
