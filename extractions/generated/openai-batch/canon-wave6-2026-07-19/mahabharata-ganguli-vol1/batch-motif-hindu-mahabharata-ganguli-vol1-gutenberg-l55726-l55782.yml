canonical_text:
  quote: ''
  summary: After Satyavan regains consciousness in the night forest, he recounts head
    pain, sleep-like loss of senses, and a vision of darkness with an effulgent person.
    Savitri postpones explanation, notes the dangerous darkness and forest sounds,
    and proposes using fire or remaining until morning. Satyavan says he has recovered
    and insists on returning because his aged blind parents depend on him and will
    be distressed by his absence.
  language: English
  quote_policy: summarized
