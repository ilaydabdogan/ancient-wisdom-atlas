canonical_text:
  quote: ''
  summary: Kacha receives a reviving science from his preceptor, emerges from the
    preceptor's body, and revives him. Kacha praises the preceptor as a father and
    mother because he gives knowledge, and condemns injuring one's teacher. Sukra/Usanas
    reflects on having drunk Kacha while unconscious from wine and establishes a prohibition
    against Brahmanas drinking wine. He then tells the Danavas that Kacha has obtained
    the reviving knowledge. The Danavas depart, and Kacha later prepares to return
    to the abode of the celestials with his preceptor's permission.
  language: English
  quote_policy: summarized
