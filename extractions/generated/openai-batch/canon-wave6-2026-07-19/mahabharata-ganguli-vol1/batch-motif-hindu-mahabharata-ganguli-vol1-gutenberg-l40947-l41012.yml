canonical_text:
  quote: ''
  summary: Lomasa points out Swetaketu's sacred hermitage and recounts Swetaketu's
    encounter with Saraswati, Ashtavakra's kinship with Swetaketu, and their defeat
    of Vandin. Yudhishthira asks why Ashtavakra was born crooked. Lomasa explains
    Kahoda's marriage to Sujata, the unborn child's correction of Kahoda's recitation,
    Kahoda's curse causing the child's eightfold crookedness, Kahoda's defeat and
    immersion by Vandin, the concealment of this from Ashtavakra, and Ashtavakra's
    later departure with Swetaketu toward Janaka's sacrifice.
  language: English
  quote_policy: summarized
