  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Near the tenth month of pregnancy, Sujata asks Kahoda how she will manage
    because he has no wealth; Kahoda goes to king Janaka for riches.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Janaka's court, Kahoda is defeated in controversy by Vandin and is immersed
