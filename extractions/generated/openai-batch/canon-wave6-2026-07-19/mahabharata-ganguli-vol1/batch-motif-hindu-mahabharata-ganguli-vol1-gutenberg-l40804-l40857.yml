canonical_text:
  quote: ''
  summary: Lomasa describes a sequence of sacred places, rivers, lakes, hermitages,
    and peaks to a Bharata king. He recounts blessings, disappearances and reappearances
    of rivers, purification by sacred waters, divine manifestations, sages attaining
    tranquillity, and a divine test in which Indra and Agni take bird forms before
    king Usinara.
  language: English
  quote_policy: summarized
