  quote: ''
  summary: Vasudeva narrates Salwa’s armed advance on Dwaraka, the enemy encampment
    and blocked approaches, the sally of Yadava/Vrishni defenders, successive combats
    involving Samva, Charudeshna, Kshemavriddhi, Vegavat, and Vivindhya, and Pradyumna’s
    rallying speech after Salwa appears on a fearsome all-going car.
  language: English
  quote_policy: summarized
