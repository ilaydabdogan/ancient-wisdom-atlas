canonical_text:
  quote: I must avenge myself on the wretch Takshaka who killed my father.
  summary: King Janamejaya resolves to perform a snake-sacrifice to avenge his father
    Parikshit by burning Takshaka and his relatives. His priest identifies the snake-sacrifice
    as a rite devised by the gods and known from the Puranas. Ritual specialists prepare
    and consecrate the sacrificial platform, but a learned Suta builder predicts that
    the sacrifice will not be completed because of a Brahmana. The king orders that
    no one be admitted without his knowledge.
  language: English
  quote_policy: quoted
