  evidence_refs:
  - ev:1
- id: obs:2
  text: Atri gives up the desire for wealth from religious scruples, calls his wife
    and sons together, and proposes going quickly to the forest for a meritorious
    life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Atri’s wife advises him to beg wealth from Vainya, distribute it among sons
    and servants, and then go wherever he wishes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atri reports that Gautama has told him Vainya is pious, but that jealous Brahmanas
    near Vainya might contradict him; Atri nevertheless agrees to go and expects kine
    and riches.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Atri reaches the sacrificial altar, bows to the king, and praises Vainya as
    foremost of sovereigns and versed in religious lore.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gautama rebukes Atri, says Mahendra alone is foremost among sovereigns, and
    accuses Atri of flattering the king and lacking knowledge of highest virtue.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kasyapa asks about the dispute, and the Munis go to Sanatkumara to resolve
    their doubt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sanatkumara states that the joined energy of Brahmana and Kshatriya destroys
    enemies, using the image of fire assisted by wind burning forests.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sanatkumara describes the sovereign as lawgiver and protector, compares him
    to Indra, Sukra, and Vrihaspati, and calls him ruler of men’s destinies.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sanatkumara says the Rishis entrusted temporal power to the Kshatriyas and
    compares the king’s removal of sin to the Sun dispelling darkness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Vainya, pleased with the side that praised him, gives Atri gold; Atri accepts,
    gives wealth to his sons, subdues himself, and goes to the forest for penance.
  category: sequence
  evidence_refs:
  - ev:9
