canonical_text:
  quote: ''
  summary: Markandeya narrates that the Rishi Atri, intending to enter forest life,
    is advised by his wife to seek wealth from King Vainya at his horse-sacrifice,
    distribute it to dependents, and then depart. At the sacrifice Atri praises Vainya
    as foremost among sovereigns; Gautama disputes him, and the assembly seeks judgment
    from Sanatkumara. Sanatkumara affirms the king’s lawful and protective status,
    using divine and cosmic comparisons. Vainya rewards Atri with gold, and Atri distributes
    the wealth before going to the forest for penance.
  language: English
  quote_policy: summarized
