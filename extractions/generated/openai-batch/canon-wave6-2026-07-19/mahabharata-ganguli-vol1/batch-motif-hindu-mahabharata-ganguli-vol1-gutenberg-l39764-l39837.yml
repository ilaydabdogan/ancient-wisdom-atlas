canonical_text:
  quote: ''
  summary: Akritavrana recounts how Jamadagni, a Veda-studying ascetic, marries Renuka
    and has sons, including the youngest Rama. Renuka sees Chitraratha sporting in
    water and is overcome by desire. Jamadagni detects this and orders his sons to
    kill her; the elder sons refuse and are cursed, while Rama beheads her with an
    axe. Pleased, Jamadagni grants Rama boons, including Renuka’s restoration to life,
    Rama’s freedom from sin and memory of the deed, his brothers’ restoration, martial
    supremacy, and long life. Later Kartavirya’s son seizes the chief cow that supplies
    milk for sacred butter and damages the hermitage trees. Rama retaliates in battle,
    cutting off Arjuna’s thousand arms. Arjuna’s kin later kill Jamadagni while Rama
    is absent, and Rama returns to find and mourn his dead father.
  language: English
  quote_policy: summarized
