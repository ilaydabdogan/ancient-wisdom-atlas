canonical_text:
  quote: ''
  summary: Duryodhana rebukes Vidura for praising enemies, compares him to dangerous
    animals and unfaithful dependents, invokes a single Controller directing action,
    and tells Vidura to leave. Vidura replies before Dhritarashtra, defends the duty
    of a true ally to speak necessary unpleasant counsel, urges humility as bitter
    medicine, bows, and warns against angering venomous adders.
  language: English
  quote_policy: summarized
