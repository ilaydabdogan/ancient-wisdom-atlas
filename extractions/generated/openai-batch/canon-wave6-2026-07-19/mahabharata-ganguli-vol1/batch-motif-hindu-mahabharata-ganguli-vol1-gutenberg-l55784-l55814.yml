canonical_text:
  quote: ''
  summary: Markandeya narrates that Satyavan laments in grief over his parents. Savitri
    wipes his tears and invokes her austerities, charity, sacrifice, and truthfulness
    for the safety and life of her parents-in-law and husband. Satyavan urges an immediate
    return to the hermitage, saying he longs to see his father and mother and will
    not live if evil has befallen them. Savitri supports him physically, takes his
    axe, leaves the wallet on a tree, and they proceed along the moonlit forest path
    toward the hermitage.
  language: English
  quote_policy: summarized
