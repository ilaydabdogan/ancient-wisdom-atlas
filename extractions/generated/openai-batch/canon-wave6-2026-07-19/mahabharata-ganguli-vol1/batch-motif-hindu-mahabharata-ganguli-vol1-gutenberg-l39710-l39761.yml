canonical_text:
  quote: ''
  summary: Akritavrana narrates how Richika obtains a thousand distinctive horses
    from Varuna as dowry and marries Satyavati, daughter of Gadhi, with gods attending.
    Bhrigu later grants Satyavati a boon for sons for herself and her mother, prescribes
    baths, tree-embraces, and rice-and-milk preparations, but the women interchange
    the ritual items. Bhrigu announces altered destinies for the sons, adjusts the
    result at Satyavati's request, and Satyavati bears Jamadagni, who excels in Vedic
    lore and gains military knowledge spontaneously.
  language: English
  quote_policy: summarized
