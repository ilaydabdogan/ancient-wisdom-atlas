  quote: ''
  summary: Sauti describes Krishna-Dwaipayana Vyasa's birth, extraordinary knowledge,
    and role in continuing the Santanu line. Vyasa arrives at Janamejaya's snake-sacrifice,
    is ritually honored by the king, and is asked to recount the history and fatal
    discord of the Kurus and Pandavas. Vyasa instructs his disciple Vaisampayana to
    narrate the history to the assembled king, priests, and chiefs.
