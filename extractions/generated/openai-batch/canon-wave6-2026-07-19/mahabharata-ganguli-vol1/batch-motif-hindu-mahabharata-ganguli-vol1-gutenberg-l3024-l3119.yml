canonical_text:
  quote: '"we have come to churn thy waters for obtaining nectar"'
  summary: The passage narrates the gods' and Asuras' churning of the Ocean with Mandara
    as churning staff and Vasuki as cord, supported by a tortoise. The churning produces
    destruction, life-giving mixtures, divine beings and treasures, nectar, a world-threatening
    poison swallowed by Siva, and Narayana's deceptive female form through which the
    Asuras hand over the Amrita.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mandara is described as an exceptional mountain with cloud-like peaks, herbs,
    birds, beasts, divine visitors, and great upward and downward extent.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods want to use Mandara as a churning rod and, after failing to dislodge
    it, ask Vishnu and Brahman to devise a plan.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Vishnu and Brahman direct Ananta, and Ananta tears up Mandara with its woods
    and woodland denizens.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods ask the Ocean to allow its waters to be churned for nectar; the Ocean
    consents on condition of receiving a share, and the Tortoise-king agrees to carry
    the mountain on his back.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods and Asuras use Mandara as a churning staff and Vasuki as a cord;
    the Asuras hold Vasuki's hood and the gods hold his tail, while Ananta raises
    and lowers the hood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vapours with flames issue from Vasuki's mouth, become lightning-bearing clouds,
    and pour showers; flowers from trees on Mandara fall around the celestials.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The churning causes a great roar, crushes aquatic and lower-region beings,
    uproots trees with birds, produces fires by tree friction, and Indra extinguishes
    the fire with heavy showers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Exudations of trees and herbs mingle with Ocean water; the celestials drink
    the mixed water and attain immortality, and the milky water turns into clarified
    butter, but nectar has not yet appeared.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The exhausted gods appeal to Brahman, Brahman asks Narayana for help, and
    Narayana grants strength and instructs them to reset the mountain and churn again.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After renewed churning, the Moon, Lakshmi, Soma, the White Steed, the Kaustubha
    gem, and Dhanwantari with a white vessel of nectar emerge from the Ocean, and
    the Asuras claim the nectar.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Airavata emerges and is taken by Indra; Kalakuta poison then appears, blazes,
    stupefies the three worlds, and is swallowed and held in Siva's throat for the
    safety of creation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Asuras prepare for conflict over Lakshmi and Amrita; Narayana uses Maya,
    assumes an enticing female form, charms the Danavas and Daityas, and they place
    the Amrita in her hands.
  category: sequence
  evidence_refs:
  - ev:10
