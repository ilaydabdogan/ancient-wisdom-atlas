  summary: Yudhishthira attempts to conciliate Sisupala after Sisupala objects to
    the worship offered to Krishna. Bhishma then defends Krishna’s first worship by
    citing Krishna’s victories, virtues, sacred and social roles, and cosmic status
    as origin, support, and dissolution of the universe.
