canonical_text:
  quote: ''
  summary: Agni, still unable to consume Khandava forest, returns to Brahman for counsel.
    Brahman says that the old deities Nara and Narayana are incarnate as Arjuna and
    Vasudeva and can aid Agni by preventing escape from the forest and thwarting Indra.
    Agni approaches Krishna and Arjuna. Arjuna states that he has celestial weapons
    but needs a suitable bow, inexhaustible arrows, a powerful chariot with white
    wind-swift steeds, and a weapon suited to Krishna, so that they may oppose Indra's
    showers and help Agni burn the forest.
  language: English
  quote_policy: summarized
