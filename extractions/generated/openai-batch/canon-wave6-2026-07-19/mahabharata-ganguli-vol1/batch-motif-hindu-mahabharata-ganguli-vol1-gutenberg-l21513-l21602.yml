canonical_text:
  quote: ''
  summary: Janamejaya asks why Agni did not burn the Sarngaka birds during the burning
    of Khandava. Vaisampayana explains that the ascetic Mandapala, denied the expected
    afterlife fruits because he had no offspring, took Sarngaka form, begot four sons
    with Jarita, and later praised Agni to spare those unfledged children from the
    forest fire. Agni granted the request.
  language: English
  quote_policy: summarized
