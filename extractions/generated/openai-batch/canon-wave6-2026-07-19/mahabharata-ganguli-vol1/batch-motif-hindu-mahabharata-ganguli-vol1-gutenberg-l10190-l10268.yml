canonical_text:
  quote: assuming the form of a beautiful female, and rising from the waters
  summary: At the source of the Ganga, King Pratipa practices ascetic penances. Ganga
    appears as a beautiful celestial woman, sits on his right thigh, and asks him
    to be her husband. Pratipa refuses on grounds of vow and kinship symbolism, assigning
    her instead as daughter-in-law for his future son. She agrees, with the condition
    that the son must not judge or question her acts. Pratipa later has a son, Santanu,
    instructs him to accept the celestial woman if she appears, installs him as king,
    and retires. Santanu later encounters a beautiful maiden by the Ganges and asks
    her to become his wife.
  language: English
  quote_policy: quoted
