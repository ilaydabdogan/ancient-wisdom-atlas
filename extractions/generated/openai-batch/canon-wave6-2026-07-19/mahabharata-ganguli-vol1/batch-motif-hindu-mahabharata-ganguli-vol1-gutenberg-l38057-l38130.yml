  quote: ''
  summary: Vaisampayana narrates the Pandavas' pilgrimage through sacred tirthas,
    including ritual bathing, gifts, water offerings, ascetic penances, Chaturmasya
    observance at Brahmasara, and fasting near the Eternal banian. Learned Brahmanas
    gather and Shamatha recounts the royal sage Gaya's many vast sacrifices, marked
    by immeasurable food, gifts, Vedic chanting, and divine satisfaction.
  language: English
