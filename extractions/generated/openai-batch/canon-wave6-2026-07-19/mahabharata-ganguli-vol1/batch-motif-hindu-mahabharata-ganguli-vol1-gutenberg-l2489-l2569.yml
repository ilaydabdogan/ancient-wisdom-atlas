canonical_text:
  quote: I am therefore called the mouth of the Devas and the Pitris.
  summary: Agni, angered by Bhrigu's curse, defends his truthful testimony and explains
    his role in sacrifices as the receiver of offerings for gods and ancestors. Agni
    then withdraws from ritual places, causing sacrificial rites and the three regions
    to be disturbed. Rishis and gods appeal to Brahma, who limits how the curse will
    apply and instructs Agni to resume receiving offerings. Agni accepts, rites resume,
    and gods, creatures, and Agni rejoice.
  language: English
  quote_policy: quoted
