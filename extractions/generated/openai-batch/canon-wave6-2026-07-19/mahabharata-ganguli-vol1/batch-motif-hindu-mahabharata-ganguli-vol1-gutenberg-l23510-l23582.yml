canonical_text:
  quote: ''
  summary: Yudhishthira discusses the difficulty of gaining imperial dignity, doubts
    whether a sacrifice should be undertaken, and expresses fear of Jarasandha. Bhima
    argues that policy and vigilance can defeat superior force and aligns Krishna,
    himself, and Arjuna as complementary powers. Krishna explains qualities of emperorship,
    describes Jarasandha's domination of many kings, and says captive kings are being
    held in Shiva's temple for sacrifice until a total of one hundred is reached.
  language: English
  quote_policy: summarized
