canonical_text:
  quote: ''
  summary: Kacha is repeatedly slain by the Asuras/Danavas and revived by Sukra's
    science at Devayani's urging. After the third killing, Kacha's ashes are mixed
    with Sukra's wine, placing him inside Sukra's stomach. Sukra says Kacha can emerge
    only by ripping open his stomach, so he prepares to impart the reviving science
    to Kacha and tells him to come to life as his son and act properly after emerging.
  language: English
  quote_policy: summarized
