canonical_text:
  quote: ''
  summary: 'Hanuman recounts Rama’s search for Sita after she was carried away: Rama
    allies with Sugriva, monkey search parties are sent, Sampati reports Sita’s location
    in Ravana’s abode, Hanuman crosses the ocean to Lanka, sees and speaks with Sita,
    burns Lanka, and returns. Rama then builds a bridge for his army, crosses with
    the monkeys, defeats Ravana and the Rakshasas, installs Vibhishana in Lanka, recovers
    Sita, returns to Ayodhya, and reigns. Hanuman also recounts receiving a boon tied
    to the endurance of Rama’s story, Rama’s later ascent, celestial singers at Hanuman’s
    dwelling, and Hanuman’s obstruction of Bhima from a path to heaven that mortals
    cannot pass.'
  language: English
  quote_policy: summarized
