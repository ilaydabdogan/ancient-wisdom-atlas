canonical_text:
  quote: ''
  summary: 'Markandeya narrates the aftermath of Rama''s victory: Dasaratha tells
    Rama that his fourteen years of exile are complete and that he should return to
    Ayodhya to rule. Rama receives boons from Brahma and the celestials, including
    the restoration to life of monkeys slain in battle, and Sita grants Hanuman long
    life and celestial food and drink. Matali praises Rama''s deed and departs. Rama
    returns from Lanka with Sita, Lakshmana, Vibhishana, Sugriva, and the monkey allies,
    crossing the ocean by the bridge and travelling in the Pushpaka chariot. He honors
    and dismisses the allies, installs Angada as prince-regent in Kishkindhya, sends
    Hanuman to Bharata, reunites with his brothers, receives back the kingdom held
    in trust by Bharata, is installed as sovereign by Vasishtha and Vamadeva, returns
    the Pushpaka chariot to Vaisravana, and performs ten horse-sacrifices on the Gomati.'
  language: English
  quote_policy: summarized
