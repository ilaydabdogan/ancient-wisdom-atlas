canonical_text:
  quote: ''
  summary: Vyasa is received with reverence by the Pandavas, Drupada, and others.
    Drupada asks how one woman can become the wife of many men without sin. Drupada
    and Dhrishtadyumna object to the proposed arrangement, while Yudhishthira argues
    that it is virtuous, citing ancient precedents and Kunti's command. Kunti fears
    that her speech may become untrue. Vyasa affirms that Yudhishthira's view conforms
    to virtue and leads Drupada to a private apartment to explain why the practice
    should not be regarded as sinful.
  language: English
  quote_policy: summarized
