canonical_text:
  quote: ''
  summary: Yudhishthira rebukes Bhima for speaking harshly toward frightened Kuru
    kinsmen who have sought protection. He says blood relatives may quarrel, but family
    honor must be defended against a stranger, especially after the Gandharva king
    has seized Duryodhana and insulted the household women. He orders Bhima, Arjuna,
    and the twins to arm themselves, take the available chariots, and rescue Duryodhana,
    first through conciliation and then, if necessary, by force. Arjuna pledges to
    liberate the Kauravas and threatens the Gandharva king if peaceful release fails;
    the Kauravas regain courage.
  language: English
  quote_policy: summarized
