canonical_text:
  quote: ''
  summary: 'Vasudeva recounts battle with King Salwa: Salwa ascends into the sky and
    attacks with many weapons, wounding Daruka the charioteer. A sorrowful messenger
    from Dwaraka reports that Vasudeva''s father has been killed and urges him to
    abandon the battle. The speaker grieves, sees an apparent vision of his father
    falling from a precious metal car and being struck, swoons, then regains consciousness,
    sees that the father, car, and Salwa have vanished, concludes it was an illusion,
    and resumes shooting arrows.'
  language: English
  quote_policy: summarized
