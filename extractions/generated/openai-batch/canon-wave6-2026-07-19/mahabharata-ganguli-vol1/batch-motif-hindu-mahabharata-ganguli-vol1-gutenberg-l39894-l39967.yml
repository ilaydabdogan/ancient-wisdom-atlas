canonical_text:
  quote: ''
  summary: Yudhishthira continues a pilgrimage along sea coasts, rivers, forests,
    altars, shrines, and Prabhasa, bathing, giving gifts, offering libations, fasting,
    and performing severe austerities. Vrishni leaders including Valarama/Rama and
    Krishna come to him, grieve at the Pandavas' ascetic condition, exchange honors,
    and hear Yudhishthira recount his hardships and Arjuna's journey to Indra's abode
    to learn arms.
  language: English
  quote_policy: summarized
