canonical_text:
  quote: ''
  summary: Arjuna recounts fighting the Nivata-Kavacha/Daitya forces, who use invisibility,
    illusion, falling crags, and subterranean attacks. Prompted by Matali, Arjuna
    deploys Indra's thunderbolt weapon through the Gandiva and destroys the demons.
    He enters their city, whose women flee, and Matali explains that it was once Indra's
    city, lost to demons who had gained boons against the gods. Arjuna then subdues
    the city and returns with Matali to the celestial abode.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Daityas fight invisibly with the help of illusion, while Arjuna fights
    with visible weapons and the Gandiva; when their illusion is withdrawn, Arjuna
    sees large numbers of slain enemies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The battlefield contains shattered weapons, ornaments, limbs, and mail, and
    the horses cannot find room to move before coursing in the sky.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Nivata-Kavachas cover the sky with crags, while other Danavas enter the
    earth and seize the horses' legs and chariot wheels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fallen and falling crags make Arjuna's location seem like a mountain cavern,
    and Arjuna becomes distressed as the horses are pressed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Matali notices Arjuna's fear and tells him not to be afraid, instructing him
    to send the thunderbolt weapon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arjuna discharges the favorite weapon of the king of the celestials, inspires
    the Gandiva with mantras, and shoots iron, adamantine arrows into the illusions
    and the Nivata-Kavachas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The thunderbolt weapon slaughters Danavas, including those underground, and
    sends them to the mansion of Yama; afterward Arjuna, Matali, the horses, and the
    car appear unharmed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Matali praises Arjuna's prowess as greater than what is seen among the celestials.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the Danava hosts are destroyed, their women bewail, flee at the sight
    and sound of Arjuna's chariot and horses, drop ornaments, and enter jeweled golden
    places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Arjuna sees the city as excellent and superior to Purandara's city; Matali
    says it was formerly the city of the lord of the celestials before the Nivata-Kavachas
    drove the celestials out.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Matali says the Nivata-Kavachas had obtained boons from the Grand-father to
