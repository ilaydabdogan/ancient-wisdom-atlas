canonical_text:
  quote: ''
  summary: Drona, seeing his pupils accomplished in arms, demands as his preceptorial
    fee that they seize Drupada, king of Panchala, and bring him to him. Kuru and
    Kaurava princes first attack Panchala but are repelled by Drupada and the Panchalas.
    The Pandavas then advance after saluting Drona; Arjuna directs the formation,
    while Bhima enters with mace and devastates the elephant ranks as the Pandavas
    overthrow many troops.
  language: English
  quote_policy: summarized
