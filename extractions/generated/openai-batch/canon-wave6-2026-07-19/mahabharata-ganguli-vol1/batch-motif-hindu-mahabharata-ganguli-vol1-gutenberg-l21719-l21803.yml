canonical_text:
  quote: ''
  summary: The four sons of Mandapala, threatened by the Khandava forest fire, discuss
    wisdom, danger, and elder-brother protection, then address hymns to Agni. They
    praise Agni as cosmic fire, heat, digestive power, creator and destroyer, and
    ask him to protect them by passing another way. Agni, pleased and remembering
    Mandapala’s prior request, agrees to spare them. Drona asks Agni to burn the cats
    that trouble them, and Agni does so while continuing to consume the Khandava forest.
  language: English
  quote_policy: summarized
