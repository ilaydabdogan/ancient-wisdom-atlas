canonical_text:
  quote: ''
  summary: Drona recounts that poverty left his son Aswatthaman without milk; after
    failing to obtain a cow and enduring mockery, he sought help from his former friend
    Drupada, now king of the Somakas. Drupada rejected the friendship as unequal and
    offered only one night's food and shelter. Drona left angry and came to the Kurus
    seeking pupils; Bhishma accepted him and directed him to train the Kuru princes
    in arms, promising him Kuru support and wealth.
  language: English
  quote_policy: summarized
