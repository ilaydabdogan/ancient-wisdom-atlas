canonical_text:
  quote: after one was taken off, another of the same kind, appeared covering her.
  summary: In a royal assembly, the son of Radha argues that Draupadi was won in the
    wager and orders Dussasana to remove the robes of the Pandavas and Draupadi. Dussasana
    begins to drag off Draupadi's attire before everyone. Draupadi invokes Krishna
    and other divine names for rescue. Krishna is moved, and unseen Dharma covers
    her with many garments so that each removed garment is replaced. The assembly
    reacts with uproar, praises Draupadi, and censures the son of Dhritarashtra. Bhima
    then swears a violent blood oath.
  language: English
  quote_policy: quoted
