  summary: The passage summarizes the Pandavas' escape from the palace of lac, forest
    flight with Kunti, Bhima's encounters with Rakshasas, the acquisition of Draupadi,
    settlement and rise at Khandavaprastha, Arjuna's forest exile and marriage to
    Subhadra, the burning of Khandava forest with Agni, the gift of divine weapons,
    Maya's palace, Duryodhana's envy and dice deceit, the Pandavas' exile, return,
    war, and recovery of their kingdom.
  language: English
  quote_policy: summarized
