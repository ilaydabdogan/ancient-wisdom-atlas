candidate_motifs:
- id: motif:1
  label: escape from a deadly house by a hidden passage
  taxonomy_refs:
  - departure
  basis: The Pandavas escape a dangerous lac palace by constructing a subterranean
    passage, setting the house on fire, and fleeing.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes flight and escape
    rather than a formal departure ritual.
- id: motif:2
  label: fire as destruction and divine empowerment
  taxonomy_refs:
  - sacred_exchange
  basis: Fire destroys the lac house and later Agni is gratified in Khandava forest,
    after which he gives Arjuna divine weapons and a chariot.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: medium
  cautions: The first fire is tactical and destructive, while the Khandava fire involves
    Agni and reciprocal gift-giving; they are related by literal fire but have different
    narrative functions.
- id: motif:3
  label: hero slays man-eating monster and protects a community
  taxonomy_refs:
  - culture_hero
  basis: Bhima kills the man-eating Rakshasa Vaka at Ekachakra and makes the citizens
    safe and free from fear.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only a compressed summary of the episode.
- id: motif:4
  label: marriage alliance after heroic wandering
  taxonomy_refs:
  - sacred_marriage
  basis: Bhima gains Hidimva as wife in the forest, the Pandavas obtain Draupadi at
    Panchala, and Arjuna obtains Subhadra while living in the woods.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: medium
  cautions: The marriages are important narrative unions, but the passage does not
    explicitly call them sacred except through a divine simile for Subhadra and Arjuna.
- id: motif:5
  label: dispossession, exile, return, and restoration of rule
  taxonomy_refs:
  - departure
  - return
  - royal_legitimacy
  basis: Duryodhana's dice deceit sends the Pandavas into thirteen years of exile;
    after return and war they regain their kingdom.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames the restoration through war rather than through a separate
    enthronement scene.
- id: motif:6
  label: divine gift of heroic weapons after service to a deity
  taxonomy_refs:
  - sacred_exchange
  basis: Arjuna and Vasudeva gratify Agni, and Agni gives Arjuna Gandiva, an inexhaustible
    quiver, and a Garuda-standard chariot.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage summarizes the exchange and does not detail ritual procedure.
- id: motif:7
  label: coveted marvelous palace leading to downfall by dice
  taxonomy_refs:
  - trickster_boundary
  basis: Duryodhana covets Maya's jeweled celestial palace and uses dice, through
    the son of Suvala, to deceive Yudhishthira and exile the Pandavas.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is tentative because the passage names deceit by
    dice but does not characterize the dice-player as a trickster.
