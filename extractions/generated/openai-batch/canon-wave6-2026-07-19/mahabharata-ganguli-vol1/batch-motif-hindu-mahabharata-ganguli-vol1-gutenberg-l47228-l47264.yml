canonical_text:
  quote: Thou hast conquered wrath. There is nothing that thou canst not give unto
    the Brahmanas.
  summary: Narada explains that Sivi surpasses him by recounting how a Brahmana asked
    Sivi for food and ordered him to kill and cook his son Vrihadgarbha. Sivi complied,
    remained unmoved when told the Brahmana was burning his royal properties, offered
    the prepared food, and agreed even to eat it himself when commanded. The Brahmana
    stopped him, praised his conquest of wrath and generosity, restored the son in
    divine-like form, and was revealed as Vidhatri testing the royal sage. Sivi says
    he acted not for fame, wealth, or pleasure, but because his heart inclines toward
    the virtuous path.
  language: English
  quote_policy: quoted
