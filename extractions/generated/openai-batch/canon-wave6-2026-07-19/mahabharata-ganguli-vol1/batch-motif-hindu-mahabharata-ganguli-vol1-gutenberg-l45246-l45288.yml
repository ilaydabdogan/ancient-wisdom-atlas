  summary: Vaisampayana narrates that while the Pandavas dwell in a place, the rainy
    season begins, covers the landscape with water, stirs rivers and animals, and
    then passes into autumn. The Pandavas rejoice by the Saraswati River, spend the
    full-moon night of Kartika with ascetic saints, and after the dark fortnight begins
    enter Kamyaka forest with companions.
