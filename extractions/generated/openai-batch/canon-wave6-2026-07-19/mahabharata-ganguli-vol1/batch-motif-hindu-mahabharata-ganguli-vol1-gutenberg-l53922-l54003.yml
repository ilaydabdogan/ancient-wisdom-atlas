canonical_text:
  quote: ''
  summary: Rama returns after killing the deer and reproaches Lakshmana for leaving
    Sita alone. The brothers find a dying wingless vulture, who identifies himself
    as a friend of Dasaratha, reports his defeat by Ravana for Sita’s sake, indicates
    the southern direction, and dies; Rama performs his obsequies. Rama and Lakshmana
    travel south through the Dandaka woods, encounter a headless Rakshasa who seizes
    Lakshmana, and kill him by cutting off his arms. A celestial being emerges, identifies
    himself as the Gandharva Viswavasu cursed into Rakshasa form, confirms that Ravana
    carried Sita to Lanka, and directs Rama to seek Sugriva near Pampa and Rishyamuka
    for assistance.
  language: English
  quote_policy: summarized
