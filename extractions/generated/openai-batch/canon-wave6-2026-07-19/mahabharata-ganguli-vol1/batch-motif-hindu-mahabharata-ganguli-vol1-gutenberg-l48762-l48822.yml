canonical_text:
  quote: Man's corporeal self has been compared to a chariot, his soul to a charioteer
    and his senses to horses.
  summary: In a dialogue reported by Markandeya, a Brahmana asks a virtuous fowler
    about the five elements. The fowler teaches the elements and their sensory qualities,
    distinguishes perceptible from imperceptible reality, and explains that self-discipline
    through subduing the senses leads to spiritual light, salvation, and freedom from
    evil. He uses chariot-driving and storm-tossed ship images for disciplined and
    undisciplined relations to the senses.
  language: English
  quote_policy: quoted
