canonical_text:
  quote: ''
  summary: 'Ruru mourns the dead Pramadvara in a forest. A heavenly messenger explains
    that the gods have provided a way for her to be restored: Ruru must give half
    of his own life to her. The king of the Gandharvas and the messenger petition
    Dharma, who allows Pramadvara to rise with Ruru''s half-life. The couple marries,
    and Ruru later vows to destroy serpents, killing them whenever he sees them. He
    encounters an old Dundubha serpent, raises his staff to kill it, and the serpent
    protests that it has done him no harm.'
  language: English
  quote_policy: summarized
