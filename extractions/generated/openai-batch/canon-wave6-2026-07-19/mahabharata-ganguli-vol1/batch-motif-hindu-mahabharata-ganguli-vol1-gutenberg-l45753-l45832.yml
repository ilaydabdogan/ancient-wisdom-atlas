canonical_text:
  quote: ''
  summary: Yudhishthira asks Markandeya to narrate the history of Vaivaswata Manu.
    Markandeya describes Manu’s severe austerities, his rescue and care of a small
    fish that grows too large for successive containers and waters, and the fish’s
    warning that a world-dissolving flood is near. The fish instructs Manu to build
    a strong ark, preserve seeds, take the seven Rishis aboard, and fasten the ark
    to the horned fish when it returns. Manu follows the instructions, and the fish
    tows the vessel through the stormy sea where land and directions can no longer
    be seen.
  language: English
  quote_policy: summarized
