canonical_text:
  quote: ''
  summary: The passage lists a pilgrimage sequence of named tirthas. At each site,
    ritual actions such as bathing, worshipping the Pitris and gods, fasting, offering
    grain, feeding Brahmanas, casting off hair, practicing self-restraint, and beholding
    deities produce stated results including purification, prosperity, sacrificial
    merit, progeny, freedom from disease and sin, access to divine or ancestral regions,
    and heaven. One site, Manusha, is said to have transformed wounded black antelopes
    into human beings when they plunged into its waters.
  language: English
  quote_policy: summarized
