canonical_text:
  quote: Peace is the highest virtue.
  summary: Parasara, remembering the death of his father Saktri, undertakes a Rakshasa
    sacrifice that destroys Rakshasas. Sages come to stop the rite; Pulastya rebukes
    the slaughter, urges peace, and explains Saktri's death as caused by Saktri's
    own curse. Parasara ends the sacrifice and casts its fire into woods north of
    Himavat, where it continues consuming Rakshasas, trees, and stones.
  language: English
  quote_policy: quoted
