canonical_text:
  quote: I feel greater compassion for one that is weak and innocent!
  summary: Dhritarashtra tells Vyasa that he disliked the gambling but was drawn by
    fate and cannot cast off Duryodhana because of paternal affection. Vyasa replies
    by narrating how Suravi, mother of cows, wept for a weak son beaten under a plough;
    Indra heard her, learned the special force of parental love, and sent rain to
    obstruct the husbandman's work. Vyasa applies the story to Dhritarashtra and urges
    that Duryodhana make peace with the distressed Pandavas.
  language: English
  quote_policy: quoted
