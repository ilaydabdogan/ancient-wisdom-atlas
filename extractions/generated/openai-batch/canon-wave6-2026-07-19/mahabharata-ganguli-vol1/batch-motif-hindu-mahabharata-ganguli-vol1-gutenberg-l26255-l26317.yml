canonical_text:
  quote: ''
  summary: Sakuni proposes to win Yudhishthira’s wealth at dice through superior skill
    and deception. Duryodhana asks Dhritarashtra for permission and threatens self-destruction
    if Vidura’s counsel prevents the plan. Dhritarashtra orders a richly built palace,
    summons Vidura, hears Vidura’s warning against gambling, but permits the dice
    challenge while invoking fate. Vidura concludes that the race is doomed and goes
    sorrowfully to Bhishma.
