canonical_text:
  quote: ''
  summary: 'The passage praises the Mahabharata as a sacred, comprehensive work containing
    accounts of divine and royal figures, including Kartikeya’s birth from Mahadeva
    and Parvati. It describes the ritual and salvific benefits of reciting, hearing,
    and gifting the text: sin-cleansing, ancestral gratification in Sraddha, union
    with Brahma, merit equivalent to major sacrifices, and possession of all knowledge
    concerning virtue, wealth, pleasure, and salvation.'
  language: English
  quote_policy: summarized
