canonical_text:
  quote: ''
  summary: Lomasa visits Indra's abode and sees Arjuna sharing Indra's seat. Indra
    explains that Arjuna is his son, not merely mortal, and is linked with the ancient
    Nara-Narayana pair. Indra describes hostile Asuras in the nether regions, Arjuna's
    acquisition of celestial weapons, and sends Lomasa to reassure and protect Yudhishthira,
    who is to undertake pilgrimage to sacred waters and shrines. Lomasa accepts and
    reaches Yudhishthira in the Kamyaka woods.
  language: English
  quote_policy: summarized
