canonical_text:
  quote: Death itself is not fraught with such terrors for me as untruth!
  summary: Karna tells Surya that truth and his vow of charity matter more to him
    than life or safety. Surya advises him that if Indra comes to take his protective
    ear-rings, Karna should give them only on condition of receiving an infallible
    dart. Surya explains that the ear-rings make Karna unslayable and that Indra seeks
    them so Arjuna may kill him. After the vision, Karna confirms it with the Sun
    and waits for Vasava.
  language: English
  quote_policy: quoted
