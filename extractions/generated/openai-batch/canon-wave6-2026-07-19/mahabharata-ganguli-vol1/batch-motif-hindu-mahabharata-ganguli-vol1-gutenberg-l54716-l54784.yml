canonical_text:
  quote: ''
  summary: Markandeya narrates a battle in which Kumbhakarna enters the field, is
    attacked by monkey warriors, devours named monkeys, seizes Sugriva, and is then
    confronted by Lakshmana. Lakshmana pierces him, cuts off his arms as more arms
    appear, and finally kills him with a Brahma weapon after Kumbhakarna assumes an
    enormous many-headed and many-limbed form. After Kumbhakarna's death, Vajravega
    and Promathin attack Lakshmana but are killed by Hanumana and Nala, while the
    wider battle between Rama's and Ravana's forces continues with heavier Rakshasa
    losses.
  language: English
  quote_policy: summarized
