  summary: Bhima moves through the forest on Gandhamadana with immense noise and strength,
    frightening and killing animals, breaking plantain trees, entering a lotus-filled
    lake, and then sounding his shell and striking his arms so that the mountain caves
    echo. Hanuman, recognizing Bhima as his brother, blocks a narrow heavenward path
    among plantain trees in order to protect him.
