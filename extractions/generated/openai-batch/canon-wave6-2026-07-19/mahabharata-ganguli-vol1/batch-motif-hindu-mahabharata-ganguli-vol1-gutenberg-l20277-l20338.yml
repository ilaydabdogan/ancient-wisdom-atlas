canonical_text:
  quote: ''
  summary: Arjuna continues his wandering pilgrimage through mountains, sacred waters,
    and holy regions, performing ablutions and giving gifts to Brahmanas. After traveling
    along the sea-shore to Manipura, he sees Chitrangada, daughter of King Chitravahana,
    and asks to marry her. Chitravahana recounts a divine boon from Mahadeva that
    each descendant of his line should have only one child, explains that he has made
    Chitrangada a Putrika, and requires that one son born from her by Arjuna perpetuate
    his race. Arjuna accepts, marries her, remains three years, and leaves after the
    birth of a son.
  language: English
  quote_policy: summarized
