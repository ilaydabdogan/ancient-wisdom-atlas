  quote: ''
  summary: The passage gives a pilgrimage itinerary through many tirthas. It describes
    ritual actions such as bathing, offering oblations, giving sesame and cattle,
    circumambulating a sacrificial pillar, touching images, eating tirtha-related
    food, and observing Brahmacharya. These acts are said to cleanse sins, rescue
    or sanctify one’s lineage, confer merits equivalent to major sacrifices, grant
    prosperity, protect against snake venom, exempt one from the pain of rebirth,
    or lead to heavenly/divine regions. The passage also mentions sacred traces, deities,
    sages, a Yakshini, Kapila the cow and calf, and a tortoise-shaped Asura from whom
    Vishnu recovered a tirtha.
