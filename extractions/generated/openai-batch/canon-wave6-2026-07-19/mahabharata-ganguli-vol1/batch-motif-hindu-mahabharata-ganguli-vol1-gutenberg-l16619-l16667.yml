canonical_text:
  quote: ''
  summary: Kunti and her sons prepare to travel to Panchala and leave the Brahmana
    host. While the Pandavas are living disguised, Vyasa visits, is reverently received,
    questions them about virtue, and tells an account of a Rishi's daughter who performed
    asceticism for a husband. Sankara grants that, because she asked five times, she
    will have five husbands in another life. Vyasa identifies her present birth as
    Krishna of Prishata's line, appointed to be wife of all the Pandavas, and urges
    them to go to Panchala.
  language: English
  quote_policy: summarized
