canonical_text:
  quote: ''
  summary: Rituparna arrives at Kundina with a chariot sound like Nala's. Nala's horses,
    Damayanti, Bhima, and palace animals react to the sound. Damayanti longs for Nala
    and threatens death if he does not appear. She ascends a terrace and sees Rituparna
    with Varshneya and Vahuka. Bhima receives Rituparna, who finds no signs of a Swayamvara
    and gives a polite reason for his visit. Vahuka tends the horses in the stable,
    while Damayanti reflects on the Nala-like chariot sound and sends a female messenger
    in search of Nishada.
  language: English
  quote_policy: summarized
