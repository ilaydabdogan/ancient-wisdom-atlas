canonical_text:
  quote: ''
  summary: Arjuna describes reaching the ocean, seeing marvels on and in it, and approaching
    a demon city. Matali drives the chariot beneath the earth, frightening the Danavas.
    Arjuna blows the Devadatta shell; the Nivata-Kavachas emerge armed. The demons
    make battle sounds, discharge shafts, and a dreadful conflict begins while sages
    and Siddhas arrive and Munis praise Arjuna as they had praised Indra in the war
    for Tara.
  language: English
