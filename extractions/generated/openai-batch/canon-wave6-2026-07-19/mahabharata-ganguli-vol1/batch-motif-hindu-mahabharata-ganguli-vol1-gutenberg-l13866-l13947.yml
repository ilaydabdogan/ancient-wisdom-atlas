canonical_text:
  quote: ''
  summary: In a public arena, Bhima and Duryodhana excite rival spectators until Drona
    orders Aswatthaman to restrain them. Drona then presents Arjuna, described as
    beloved pupil, master of arms, and son of Indra. The crowd praises Arjuna; Kunti
    reacts with tears and milk, while Vidura explains the uproar to Dhritarashtra.
    Arjuna displays supernatural and technical weapon skill by creating and dismissing
    elements and terrain, changing apparent height and position, and striking difficult
    targets. A thunderous sound at the gate draws attention, after which Drona stands
    with the five sons of Pritha and Duryodhana stands armed with his hundred brothers
    and Aswatthaman.
  language: English
  quote_policy: summarized
