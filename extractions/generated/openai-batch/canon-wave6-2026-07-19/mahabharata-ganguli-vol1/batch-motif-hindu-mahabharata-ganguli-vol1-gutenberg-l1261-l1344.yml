canonical_text:
  quote: ''
  summary: 'A synoptic catalogue of episodes in the Aranyaka Parva: the Pandavas go
    to the forest; Yudhishthira obtains food through the Sun''s grace; sages, gods,
    and allies intervene; Arjuna seeks celestial weapons and ascends to Indra''s regions;
    the Pandavas undertake pilgrimages; embedded stories include Nala, Agastya, Rishyasringa,
    Rama, Chyavana, Somaka and Jantu, Sivi, and Ashtavakra; Bhima undertakes a flower
    quest, battles powerful beings on mountains, and is later seized by a great serpent
    before Yudhishthira''s answers secure his release.'
  language: English
  quote_policy: summarized
