canonical_text:
  quote: ''
  summary: Duryodhana hears of Vidura's return and fears that the Pandavas may be
    recalled. He summons Sakuni, Karna, and Dussasana; the counselors discuss the
    Pandavas' vow, covert watching, renewed defeat at dice, and finally an armed attack
    on the Pandavas in the forest. The group sets out, but Krishna-Dwaipayana perceives
    this by spiritual vision, commands them to desist, sends them away, and goes to
    Dhritarashtra.
  language: English
  quote_policy: summarized
