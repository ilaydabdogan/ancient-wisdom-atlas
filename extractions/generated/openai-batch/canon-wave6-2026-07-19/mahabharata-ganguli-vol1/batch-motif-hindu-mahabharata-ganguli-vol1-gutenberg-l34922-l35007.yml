canonical_text:
  quote: ''
  summary: After a caravan is destroyed by elephants, Damayanti laments the deaths,
    her own survival, Destiny, and possible divine hostility from the Lokapalas. She
    travels with surviving Brahmanas to the Chedi city of Suvahu, where her distressed
    appearance draws a crowd. The queen-mother brings her into the palace through
    a nurse. Damayanti gives a guarded account of being a devoted wife whose husband
    lost at dice, went into the forest, cut away half her garment while she slept,
    and abandoned her. The queen-mother offers refuge and assistance in searching
    for the husband. Damayanti accepts only under strict conditions protecting her
    chastity and status. The queen-mother accepts the vow and places her with Sunanda
    as a companion or Sairindhri.
  language: English
  quote_policy: summarized
