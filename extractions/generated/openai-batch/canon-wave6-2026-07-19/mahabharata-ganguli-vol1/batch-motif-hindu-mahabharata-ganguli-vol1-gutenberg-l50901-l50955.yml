canonical_text:
  quote: ''
  summary: Duryodhana worries that Dhritarashtra will not permit him to visit the
    Pandavas in Dwaitavana, while admitting that his desire is to see them humiliated
    or to destroy them in exile. He asks Karna, Sakuni, and Dussasana to devise a
    pretext. Karna proposes that they go under the pretext of supervising royal cattle
    stations in Dwaitavana; Sakuni agrees, and the conspirators laugh, clasp hands,
    and go to see the chief of the Kurus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duryodhana is first pleased by Karna's words, then becomes melancholy and
    says he does not expect to obtain permission to go where the Pandavas reside.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Duryodhana says Dhritarashtra grieves for the sons of Pandu and regards them
    as strengthened by ascetic austerities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duryodhana says that if the king understands their motives, he will not grant
    permission, and that they have no business in Dwaitavana except the destruction
    of the exiled Pandavas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Duryodhana says he would be pleased to see Bhima and Phalguna living painfully
    with Krishna in the woods, the sons of Pandu wearing bark and deer-skins, and
    the daughter of Drupada in red rags.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Duryodhana asks Karna, Suvala's son, and Dussasana to devise a skillful plan
    by which they may go to the woods, and says Karna and Sakuni should propose a
    pretext in the presence of Bhishma and the king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Karna proposes that they go to Dwaitavana under the pretext of supervising
    cattle stations, saying the herds are waiting there and that kings should frequently
    visit such stations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sakuni approves the same plan and says the king will either grant permission
    or send them there himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Duryodhana, Karna, and Sakuni laugh together, give their hands to one another,
