  quote: ''
  summary: Vidura counsels the monarch to heed Bhishma and Drona, to treat the Pandavas
    as his own sons, to recognize their strength and alliances, and to choose reconciliation
    over war. He urges the king to remove the calumny connected with Purochana by
    acting kindly toward the Pandavas, notes the people's joy that they are alive,
    and warns against the counsel of Duryodhana, Karna, and Sakuni.
  language: English
  quote_policy: summarized
