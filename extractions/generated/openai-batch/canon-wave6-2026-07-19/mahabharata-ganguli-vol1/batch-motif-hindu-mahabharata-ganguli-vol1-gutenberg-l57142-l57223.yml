canonical_text:
  quote: ''
  summary: In a question-and-answer exchange, the Yaksha asks Yudhishthira about virtue,
    social status, moral consequences, happiness, mortality, religious path, and wealth.
    Yudhishthira gives ethical and cosmological answers. The Yaksha then offers the
    revival of one dead brother; Yudhishthira chooses Nakula to preserve fairness
    between Kunti and Madri. Because Yudhishthira values virtue and non-injury above
    profit and pleasure, the Yaksha grants life to all his brothers.
  language: English
  quote_policy: summarized
