canonical_text:
  quote: '"Escape by it with thy children from the net that death hath spread around
    you."'
  summary: The passage recounts a plot by Duryodhana, Sakuni, Duhsasana, Karna, and
    Dhritarashtra to burn Kunti and the Pandavas; Vidura detects the plan, prepares
    a boat, and warns Kunti. Kunti and her sons cross the Ganges, enter the woods,
    and are believed dead when the house of lac burns with other occupants inside.
    The narrative then frames Janamejaya's request to hear the full story and explains
    the political jealousy and public support for Yudhishthira that preceded the plot.
  language: English
