  - ev:1
- id: obs:2
  text: Yudhishthira thinks of the glory of earlier monarchs, the felicity gained
    by performers of sacrifices, and especially Harischandra, who had performed a
    great sacrifice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yudhishthira worships his counsellors, is worshipped by them in return, and
    discusses the sacrifice with them while also reflecting on the good of all his
    people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Yudhishthira is described as kind to subjects, free from anger and arrogance,
    and known for saying that each should receive what is due; people voice blessings
    upon Dharma, and no one in the kingdom is hostile to him.
  category: attribute
  evidence_refs:
