canonical_text:
  quote: ''
  summary: Yudhishthira, moved by Narada’s account and by the precedent of earlier
    royal sacrificers such as Harischandra, considers performing the Rajasuya. The
    passage describes his just rule, the prosperity and security of his kingdom, the
    support of his brothers and ministers, and the counsellors’ explanation that Rajasuya
    confers imperial sovereignty and the fruits of sacrifices. Yudhishthira then consults
    further with brothers, priests, and sages and asks how his wish may bear fruit.
  language: English
  quote_policy: summarized
