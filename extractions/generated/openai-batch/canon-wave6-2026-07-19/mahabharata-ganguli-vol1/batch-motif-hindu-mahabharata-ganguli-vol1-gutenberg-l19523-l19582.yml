  quote: as my sons are entitled to this kingdom, so are the sons of Pandu certainly
    entitled to it.
  summary: Dhritarashtra accepts the advice of Bhishma, Drona, and Vidura, recognizes
    the Pandavas as kin and co-heirs, and commands Vidura to bring them, Kunti, and
    Draupadi back with affection. Vidura goes to Drupada and the Pandavas with jewels
    and wealth, exchanges formal greetings, distributes gifts from the Kauravas, and
    asks Drupada to permit the Pandavas to return to their ancestral kingdom with
    Kunti and Draupadi.
