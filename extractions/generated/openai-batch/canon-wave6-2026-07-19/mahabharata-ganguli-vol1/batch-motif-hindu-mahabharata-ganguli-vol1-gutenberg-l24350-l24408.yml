canonical_text:
  quote: ''
  summary: Krishna secures the released monarchs' support for Yudhishthira's intended
    Rajasuya sacrifice, accepts tribute, installs Jarasandha's son Sahadeva as ruler
    of Magadha, returns to Indraprastha with Bhima and Arjuna, reports Jarasandha's
    death and the freeing of the confined kings, and later departs for Dwarka while
    the Pandavas honor him. The passage ends by noting the growth of the Pandavas'
    fame and Yudhishthira's proper rule.
  language: English
  quote_policy: summarized
