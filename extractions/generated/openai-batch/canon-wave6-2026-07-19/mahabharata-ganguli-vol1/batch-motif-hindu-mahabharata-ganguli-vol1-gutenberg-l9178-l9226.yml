canonical_text:
  quote: ''
  summary: Vaisampayana recounts that King Yayati installs Puru on the throne, retires
    to the forest as a hermit, performs sacrifices and austerities, ascends to heaven,
    is hurled down by Indra but remains in the firmament, and later re-enters the
    celestial region with named companions. Janamejaya asks to hear the reasons for
    Yayati's fall and readmission, and Vaisampayana frames the story as sacred and
    sin-destroying for hearers.
  language: English
  quote_policy: summarized
