  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The fowler says animals ought to be sacrificed for fourmonthly rites and that
    the sacred fire is fond of animal food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The fowler says regenerate Brahmanas kill animals at sacrifices, purge them
    of sin through hymns, and those animals go to heaven.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The fowler reports a rule that one who eats animal food after first offering
    it respectfully to gods and manes is not polluted by the act.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The fowler mentions king Saudasa, who under a curse used to prey upon men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fowler says he gains his livelihood from his profession, that forsaking
    one's occupation is a sin, and that sticking to one's profession is meritorious.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The fowler says karma from a former existence does not forsake creatures,
    the Creator accounts for consequences of karma, and evil karma may be expiated
    in various ways.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The fowler describes himself as charitable, truthful, attentive to superiors,
