  text: The fowler calls his deeds cruel, attributes his condition to destiny, past
    actions, and sin from a former life, and says he tries to eradicate the evil.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fowler says the Deity takes away life and the executioner is only a secondary
    agent with regard to karma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fowler says animals slain by him and meat sold by him are used to feed
    gods, guests, and servants, and to propitiate the manes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fowler states that herbs, vegetables, deer, birds, and wild animals constitute
    food for creatures.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fowler cites king Sivi, son of Usinara, as attaining heaven after giving
    away his own flesh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fowler cites king Rantideva, in whose kitchen animals and cows were killed
