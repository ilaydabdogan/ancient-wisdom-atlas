  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The fowler says the whole creation is full of animal life sustained by food
    derived from living organisms, and that fish and other animals prey on one another.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The fowler says men kill creatures by walking, and even wise people destroy
