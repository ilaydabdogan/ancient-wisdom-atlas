canonical_text:
  quote: '"a particle of rice and vegetable sticking at its rim"'
  summary: Durvasa arrives with ten thousand disciples and is welcomed by Yudhishthira.
    While the ascetics go to bathe, Draupadi anxiously prays to Krishna for help because
    no food is available. Krishna arrives, asks for food, finds and eats a tiny remnant
    in the sun-given vessel, and the bathing ascetics feel full and flee out of fear
    of offending the Pandavas.
  language: English
  quote_policy: quoted
