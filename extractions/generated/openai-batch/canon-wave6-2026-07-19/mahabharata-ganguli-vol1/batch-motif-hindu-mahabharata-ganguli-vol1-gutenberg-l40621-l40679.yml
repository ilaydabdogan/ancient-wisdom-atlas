canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Lomasa about King Somaka. Lomasa recounts that Somaka,
    though husband to one hundred wives, long remained sonless until Jantu was born
    in his old age. The mothers dote on Jantu, and an ant sting causes distress in
    the women''s quarters. Somaka laments the vulnerability of having only one son
    and asks his family priest for a rite to obtain one hundred sons. The priest prescribes
    sacrificing Jantu: his fat is to be offered in fire, the mothers are to smell
    the smoke, and they will bear many sons; Jantu too will be reborn to the same
    mother with a gold mark on his back.'
  language: English
  quote_policy: summarized
