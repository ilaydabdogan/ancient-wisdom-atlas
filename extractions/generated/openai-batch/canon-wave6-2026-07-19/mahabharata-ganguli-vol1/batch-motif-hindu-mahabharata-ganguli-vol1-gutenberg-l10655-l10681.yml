canonical_text:
  quote: O fisherman, from this day I adopt the vow of Brahmacharya (study and meditation
    in celibacy).
  summary: Devavrata, the son of Ganga, renounces succession and progeny through a
    vow of Brahmacharya to satisfy the fisherman's concern and benefit his father.
    The fisherman gives his daughter, celestial beings acclaim Devavrata as Bhishma,
    Bhishma brings the maiden to Hastinapura, and Santanu grants him the boon of death
    at will.
