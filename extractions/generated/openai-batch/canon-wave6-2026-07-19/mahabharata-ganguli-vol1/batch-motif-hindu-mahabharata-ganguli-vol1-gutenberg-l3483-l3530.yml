  quote: ''
  summary: Sauti narrates that Garuda returns to Vinata, who is enslaved after losing
    a wager. Kadru orders Vinata to carry her to an ocean region inhabited by Nagas,
    while Garuda carries the snakes. Garuda ascends toward the Sun, the snakes are
    scorched and swoon, and Kadru prays to Indra for protective showers, praising
    him through many cosmic and sacrificial attributes.
