canonical_text:
  quote: ''
  summary: Vaisampayana summarizes the births of Dhritarashtra's and Pandu's sons,
    then answers Janamejaya's question about Gandhari's hundred sons. Gandhari receives
    from Dwaipayana a boon for one hundred sons, undergoes a two-year pregnancy, strikes
    her womb in grief after hearing of Kunti's son, and produces a hard mass of flesh.
    Dwaipayana directs that the mass be cooled with water, divided, and placed in
    pots of clarified butter. After a further period, Duryodhana is born from the
    pot-held pieces, while Yudhishthira is said to be oldest by birth order and Bhima
    is born on the same day as Duryodhana.
  language: English
  quote_policy: summarized
