  summary: 'The passage describes signs of the end of a Yuga: social orders vanish
    or invert, family and marital duties fail, religious offerings and instruction
    are neglected or reversed, famine and predatory conduct spread, Brahmanas flee
    oppression, tombs and relics displace temples in sacred spaces, natural anomalies
    occur, and ominous celestial and atmospheric disturbances appear.'
