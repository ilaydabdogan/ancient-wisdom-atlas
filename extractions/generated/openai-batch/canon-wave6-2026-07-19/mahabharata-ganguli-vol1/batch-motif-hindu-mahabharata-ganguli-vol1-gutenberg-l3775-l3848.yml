canonical_text:
  quote: ''
  summary: Garuda breaks a tree branch while carrying an elephant and a tortoise,
    sees Valakhilya Rishis hanging from it in ascetic practice, and lifts the branch
    in his beak to avoid killing them. The Rishis name him Garuda because he bears
    a heavy weight. Garuda flies through the sky to Gandhamadana, where his father
    Kasyapa warns him not to anger the Valakhilyas. Kasyapa persuades the ascetics
    to leave the bough, and they depart for Himavat. Garuda asks where to cast the
    branch down; Kasyapa directs him to a remote mountain without humans. Garuda drops
    the enormous bough there, shaking the mountain and felling trees, then eats the
    elephant and tortoise and rises again.
  language: English
  quote_policy: summarized
