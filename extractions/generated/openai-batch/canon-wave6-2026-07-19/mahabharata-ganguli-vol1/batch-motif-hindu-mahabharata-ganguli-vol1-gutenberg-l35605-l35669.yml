canonical_text:
  quote: Nala's self only knoweth Nala.
  summary: Damayanti suspects that the charioteer Vahuka may be Nala and sends Kesini
    to question him. Vahuka explains the arrival of king Rituparna and speaks of Nala
    as wandering in disguise. Kesini repeats a lament about a wife abandoned in the
    woods after her husband cut away half her garment. Hearing this, Nala is moved
    to tears and replies that a chaste wife should not be angry with a calamity-stricken
    husband.
  language: English
  quote_policy: quoted
