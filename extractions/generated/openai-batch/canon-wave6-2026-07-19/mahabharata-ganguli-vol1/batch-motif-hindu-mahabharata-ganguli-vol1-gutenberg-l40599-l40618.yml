canonical_text:
  quote: ''
  summary: 'The passage recounts deeds attributed to Mandhata: giving cattle to Brahmanas,
    bringing rain during a twelve-year drought while Indra watched, slaying a ruler
    of Gandhara, protecting the four orders and the worlds through righteous austerity,
    and sacrificing at a holy spot in the field of the Kurus. Lomasa says he has narrated
    Mandhata’s life and extraordinary birth; Vaisampayana then reports that Kunti’s
    son asks Lomasa about Somaka.'
  language: English
  quote_policy: summarized
