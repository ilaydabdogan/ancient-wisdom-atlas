canonical_text:
  quote: ''
  summary: Vaisampayana introduces the story of Khandava's conflagration and recounts
    how King Swetaki's incessant sacrifices exhausted his priests. After the priests
    refused to assist further and told him to seek Rudra, Swetaki performed severe
    austerities on Mount Kailasa. Rudra appeared, set a condition involving twelve
    years of uninterrupted clarified-butter libations into fire, and later directed
    Swetaki to the Brahmana Durvasa, described as a portion of Rudra, to assist with
    the sacrifice.
  language: English
  quote_policy: summarized
