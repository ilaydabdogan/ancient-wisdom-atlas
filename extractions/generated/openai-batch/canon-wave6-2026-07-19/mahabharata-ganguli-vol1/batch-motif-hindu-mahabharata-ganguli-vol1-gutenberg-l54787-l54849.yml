canonical_text:
  quote: ''
  summary: Ravana, after learning of major Rakshasa losses, commands his son Indrajit
    to kill Rama, Lakshmana, Sugriva, and their followers, praising his previous victory
    over Vasava and his boon-given celestial arrows. Indrajit challenges Lakshmana,
    fights him with celestial weapons, and is aided by powers of illusion. Angada
    strikes Indrajit with trees and destroys his chariot, after which Indrajit vanishes
    and attacks Rama, Lakshmana, and the monkey host while invisible, causing the
    brothers to fall to the ground pierced with arrows.
  language: English
  quote_policy: summarized
