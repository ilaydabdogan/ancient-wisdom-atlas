canonical_text:
  quote: ''
  summary: Kavya/Sukra rebukes the Asura king Vrishaparvan for the slaying of Kacha
    and the mistreatment of Devayani, threatens to leave the Asuras, and says sins
    inevitably bear fruit. Vrishaparvan pleads with him and offers all Asura wealth
    and himself. Sukra requires Devayani to be gratified. Devayani demands that Sarmishtha,
    with a thousand maids, become her attendant and follow her when she is given away
    in marriage. Sarmishtha accepts for the welfare of her relatives. Devayani is
    satisfied, Sukra enters the Asura capital, and the Danavas worship him.
  language: English
  quote_policy: summarized
