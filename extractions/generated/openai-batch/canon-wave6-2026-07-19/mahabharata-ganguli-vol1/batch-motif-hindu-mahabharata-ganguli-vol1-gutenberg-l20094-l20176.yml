canonical_text:
  quote: ''
  summary: After the Pandavas establish a household rule and prosper at Khandavaprastha,
    a grieving Brahmana reports that robbers have stolen his cattle and reproaches
    the Pandavas for failing to protect him. Arjuna faces a conflict because the weapons
    are in a chamber occupied by Yudhishthira with Draupadi, and entering it would
    violate the brothers' rule and entail forest exile. Arjuna enters, takes his bow,
    recovers the cattle from the thieves, and returns. Although Yudhishthira argues
    that Arjuna has not committed a fault, Arjuna refuses to quibble about duty and
    departs to live in the forest for twelve years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pandavas, after establishing a rule, continue to reside together, bring
    many kings under their sway, and the Kuru race prospers while Draupadi delights
    in her five husbands and they in her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Robbers steal the cattle of a Brahmana, who goes to Khandavaprastha in anger
    and grief and asks the Pandavas to pursue the thieves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmana says that a king who takes a sixth part of produce without protecting
    subjects is considered deeply sinful, and he describes his loss with images of
    sacrificial butter taken by crows and a jackal entering an empty lion's cave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arjuna assures the Brahmana that there is no fear, but the weapons chamber
    is occupied by Yudhishthira with Draupadi, making entry a violation of the established
    rule.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arjuna deliberates that failing to protect the Brahmana would bring sin and
    public blame, while entering the chamber would violate the king and incur exile
    in the woods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Arjuna decides that virtue is superior to the body, enters the chamber, speaks
    with Yudhishthira, comes out with the bow, and tells the Brahmana to proceed quickly
    so the thieves do not get far ahead.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Arjuna arms himself with bow, mail, and chariot, pursues the thieves, pierces
    them with arrows, compels them to give up the booty, and returns the cattle to
    the Brahmana.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After returning and being congratulated, Arjuna asks Yudhishthira for permission
    to observe the vow, saying that he has violated their rule by seeing Yudhishthira
    sitting with Draupadi and must go into the woods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yudhishthira grieves and tells Arjuna that the younger brother may enter where
    the elder brother sits with his wife without fault, and that Arjuna's virtue has
    not diminished.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Arjuna replies that quibbling is not permitted in duty, says that truth is
    his weapon, receives the king's permission, and goes to the forest for twelve
    years.
  category: sequence
  evidence_refs:
