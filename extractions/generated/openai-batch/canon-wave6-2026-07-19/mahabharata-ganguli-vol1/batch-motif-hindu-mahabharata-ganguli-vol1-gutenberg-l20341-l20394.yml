canonical_text:
  quote: ''
  summary: Arjuna visits five sacred waters near the southern ocean that ascetics
    avoid because crocodiles carry away bathers. Despite warnings, he enters Saubhadra,
    is seized by a crocodile, drags it ashore, and the crocodile becomes the Apsara
    Varga. Varga explains that she and four companions tried to disturb a Veda-studying
    Brahmana ascetic, who resisted them and cursed them to become crocodiles in the
    waters for a hundred years.
  language: English
  quote_policy: summarized
