canonical_text:
  quote: ''
  summary: After Santanu marries Satyavati, she bears Chitrangada and Vichitravirya.
    Santanu dies before Vichitravirya reaches majority. Bhishma, acting under Satyavati's
    command, installs Chitrangada, who becomes proud of his prowess. A Gandharva king
    of the same name challenges him; they fight for three years at Kurukshetra on
    the banks of the Saraswati, and the Gandharva kills the Kuru prince. Bhishma performs
    Chitrangada's obsequies and installs the minor Vichitravirya, who rules under
    Bhishma's protection.
  language: English
  quote_policy: summarized
