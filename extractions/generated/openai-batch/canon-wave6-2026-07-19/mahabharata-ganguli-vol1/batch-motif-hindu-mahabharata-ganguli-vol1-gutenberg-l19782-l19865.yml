canonical_text:
  quote: '"one individual divided into two parts"'
  summary: Narada recounts to Yudhishthira an old story of the Daitya brothers Sunda
    and Upasunda. The inseparable brothers undertake severe ascetic austerities on
    the Vindhya mountains to gain power over the three worlds. The gods try unsuccessfully
    to interrupt their vows with temptations and illusions. Brahman appears and grants
    them weapons, powers of illusion, strength, shapeshifting, and near-invulnerability,
    but refuses immortality. The brothers choose to fear no created thing except each
    other, return home, and celebrate with their kin.
  language: English
  quote_policy: quoted
