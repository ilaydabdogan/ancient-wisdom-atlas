canonical_text:
  quote: ''
  summary: 'Pulastya, pleased by Bhishma''s humility, self-control, truthfulness,
    and regard for ancestors, offers to grant him a request. Bhishma asks about the
    religious merits of tirthas and of visiting shrines across the earth. Pulastya
    explains the moral qualifications for gaining the fruits of tirthas, contrasts
    costly sacrifices with pilgrimage accessible to the poor, and presents Pushkara
    as the foremost tirtha: a place of divine presence, purification, merit equivalent
    or superior to sacrifices, release from rebirth, special Karttika observance,
    sacred topography of hillocks and springs, and difficult austerity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pulastya says Bhishma has gratified him through humility, self-control, truth,
    and regard for ancestors, and offers to grant whatever Bhishma asks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma asks Pulastya to dispel his religious doubts concerning tirthas and
    the merit of visiting shrines around the earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pulastya says the fruits of tirthas are enjoyed by persons whose hands, feet,
    mind, knowledge, asceticism, and acts are controlled, and by those free from pride,
    anger, and sin who adhere to truth and firm vows.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pulastya states that Vedic sacrifices require many materials and are usually
    performed by kings or wealthy persons, while the tirtha rite he will describe
    can be accomplished by poor, single, or destitute persons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pulastya states that sojourns in tirthas are superior to sacrifices and that
    a person gains merit by fasting, giving gold, distributing kine, and sojourning
    at a tirtha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pushkara is described as the tirtha of the God of gods, celebrated in the
    three worlds, and a sojourner there is said to become equal to that deity.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the two twilights and midday, innumerable tirthas and groups of divine
    or semi-divine beings are said to be present in Pushkara.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gods, Daityas, and Brahmarshis are said to have performed ascetic devotions
    at Pushkara, obtained great merit, and finally attained godhood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Thinking mentally of Pushkara is said to cleanse the self-controlled from
    sins; the lotus-seated grandsire dwelt there, and gods with Rishis are said to
    have gained highest success there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A person who worships the gods and Pitris and bathes at Pushkara is said to
    obtain merit ten times that of a horse-sacrifice; feeding even one Brahmana in
    the Pushkara woods brings happiness here and hereafter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A gift of vegetables, roots, and fruits to a Brahmana at Pushkara is said
    to acquire the merit of a horse-sacrifice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Brahmanas, Kshatriyas, Vaisyas, and Sudras who bathe in Pushkara are said
    to be freed from rebirth, and sins committed since birth are said to be destroyed
    by bathing there.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Visiting Pushkara on the full moon of Karttika is said to win everlasting
    regions in Brahma's abode, and thinking of Pushkara with joined hands morning
    and evening is said to be practically equivalent to bathing in every tirtha.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Pushkara is compared to the Slayer of Madhu among celestials as the foremost
