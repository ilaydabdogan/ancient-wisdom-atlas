canonical_text:
  quote: ''
  summary: Vaisampayana describes Nakula inviting Bhishma and Dhritarashtra to Yudhishthira's
    Rajasuya sacrifice. Numerous rulers, Kuru figures, regional kings, Vrishnis, Brahmanas,
    priests, and Rishis assemble with jewels and are received with hospitality. Yudhishthira
    assigns richly adorned mansions to the monarchs, worships them, and continues
    sacrifices with gifts to Brahmanas. The guest mansions are compared to Kailasa
    and Himavat, and the sacrificial mansion is compared to heaven crowded with gods.
  language: English
  quote_policy: summarized
