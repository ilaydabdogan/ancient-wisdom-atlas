canonical_text:
  quote: ''
  summary: Vrihadaswa recounts that Kali, after making a compact with Dwapara, waited
    in the Nishadha country for an opening. When Nala performed twilight prayers after
    touching water but without first washing his feet, Kali entered and possessed
    him. Kali then encouraged Pushkara to challenge Nala at dice, while Dwapara became
    the chief die. Nala accepted the challenge, lost wealth repeatedly, ignored attempts
    by friends, citizens, councillors, and Damayanti to stop him, and continued gambling
    with Pushkara for many months while being repeatedly defeated.
  language: English
  quote_policy: summarized
