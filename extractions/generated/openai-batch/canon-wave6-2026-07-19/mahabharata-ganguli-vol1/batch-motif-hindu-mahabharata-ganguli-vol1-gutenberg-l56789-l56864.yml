canonical_text:
  quote: ''
  summary: Yudhishthira sends his thirsty brothers one by one to find and bring water.
    At a crystal lake, an unseen possessor of the lake demands that each first answer
    questions before drinking. Nakula, Sahadeva, and Arjuna disregard the warning
    and fall dead after drinking. Bhima arrives, sees his brothers dead, suspects
    a Yaksha or Rakshasa, and is warned by the Yaksha before drinking.
  language: English
  quote_policy: summarized
