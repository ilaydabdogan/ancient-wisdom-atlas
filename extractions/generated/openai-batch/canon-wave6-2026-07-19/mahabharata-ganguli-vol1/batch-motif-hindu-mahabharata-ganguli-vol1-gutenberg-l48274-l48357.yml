canonical_text:
  quote: ''
  summary: Markandeya narrates that a Brahmana accompanies a fowler to the fowler's
    home, where the fowler offers hospitality. The Brahmana criticizes the fowler's
    cruel profession. The fowler replies that his trade is inherited and bound to
    birth-duty, then gives extended instruction on personal discipline, social duties,
    kingship, King Janaka's righteous rule, the effects of sinful kings, and ethical
    conduct such as truthfulness, generosity, restraint, and non-retaliation.
  language: English
  quote_policy: summarized
