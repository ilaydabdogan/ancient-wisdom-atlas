canonical_text:
  quote: ''
  summary: Duryodhana explains to Radheya that the Gandharvas defeated and captured
    him by fighting from the skies through illusion. His soldiers petitioned the sons
    of Pandu for help. The Pandavas first requested release peacefully, then fought
    when refused. Arjuna's arrows and celestial weapons checked the Gandharvas, after
    which Chitrasena revealed himself, greeted Arjuna and the Pandavas, and the conflict
    ended in friendly exchange.
  language: English
  quote_policy: summarized
