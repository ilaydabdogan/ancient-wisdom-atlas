canonical_text:
  quote: ''
  summary: Narada recounts how the Asura brothers Sunda and Upasunda set out with
    an armed Daitya force to conquer the three worlds. After subjugating celestial,
    nether, oceanic, and earthly beings, they order the slaughter of Brahmanas and
    royal sages because sacrifices strengthen the gods. They destroy sacrifices and
    asylums, kill ascetics despite curses, assume animal forms to hunt Rishis hidden
    in caves, and cause ritual, social, agricultural, and cosmic disorder before taking
    residence in Kurukshetra.
  language: English
  quote_policy: summarized
