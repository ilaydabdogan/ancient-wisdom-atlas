canonical_text:
  quote: ''
  summary: The passage praises the recitation and hearing of the description of tirthas
    as restricted, holy, purifying, merit-producing, and heaven-giving. It describes
    access to tirthas, including imaginative visitation, bathing by celestial beings
    and Rishis, and qualifications for pilgrims. Pulastya's instruction to Bhishma
    concludes with Bhishma's pilgrimage ending at Prayaga. Narada then instructs Yudhishthira
    to lead ascetics to Rakshasa-infested tirthas with Lomasa as guide, predicts merit,
    fame, victory, and rule for him, departs, and Yudhishthira begins reciting the
    merit of tirthas to the ascetics.
  language: English
  quote_policy: summarized
