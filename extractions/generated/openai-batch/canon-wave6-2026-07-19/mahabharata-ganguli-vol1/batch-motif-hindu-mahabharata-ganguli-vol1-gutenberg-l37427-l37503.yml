    sin-destroying, heaven-giving, and intellect-sharpening.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Reading or hearing the narrative is said to yield worldly and spiritual results,
    including sons, riches, conquest, wealth, fulfilled desires, recollection of previous
    births, heaven, and release from sins.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some tirthas are said to be easier to access than others, and a person desiring
    to behold all tirthas is instructed to visit them even in imagination.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Vasus, Sadhyas, Adityas, Maruts, Aswins, and Rishis equal to celestials
