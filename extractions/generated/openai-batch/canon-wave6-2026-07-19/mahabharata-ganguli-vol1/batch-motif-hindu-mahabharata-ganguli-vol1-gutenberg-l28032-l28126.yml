canonical_text:
  quote: ''
  summary: In the Kuru assembly, Karna argues that Draupadi and the Pandavas are slaves
    after the dice losses. Bhima reacts with anger but acknowledges the declared servitude.
    Duryodhana taunts Draupadi by uncovering his thigh, and Bhima vows to break it.
    Vidura warns that the assembly is morally polluted and that calamity threatens
    the Bharatas. Animal cries in Dhritarashtra's palace are treated as a frightful
    omen; Dhritarashtra rebukes Duryodhana, consoles Draupadi, and offers her a boon.
  language: English
  quote_policy: summarized
