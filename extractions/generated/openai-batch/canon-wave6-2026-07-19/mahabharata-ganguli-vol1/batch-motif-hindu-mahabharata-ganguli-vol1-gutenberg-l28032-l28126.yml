  text: Karna says that Bhishma, Vidura, and Drona appear independent because they
    censure their master and do not wish for his prosperity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karna says that a slave, son, and wife are dependent, calls Draupadi the wife
    of a slave, and tells her to serve Dhritarashtra's relatives because the sons
    of Dhritarashtra are now her masters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Karna tells Draupadi to choose another husband and says that Nakula, Bhima,
    Yudhishthira, Sahadeva, and Arjuna have been won and are slaves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
