canonical_text:
  quote: ''
  summary: Vaisampayana narrates that after Brahmanas and the sons of Pandu are seated,
    Draupadi and Satyabhama enter a hermitage, rejoice at meeting after a long time,
    and converse. Satyabhama privately asks Draupadi what behavior or practice makes
    the sons of Pandu obedient to her, listing possible vows, austerities, incantations,
    drugs, ritual acts, cosmetics, or other means by which Krishna might likewise
    be obedient to Satyabhama.
  language: English
