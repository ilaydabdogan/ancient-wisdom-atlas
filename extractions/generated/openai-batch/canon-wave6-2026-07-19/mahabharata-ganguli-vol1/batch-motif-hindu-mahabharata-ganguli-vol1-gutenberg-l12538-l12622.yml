canonical_text:
  quote: |-
    invoked Sakra (the king of the gods) who thereupon came unto her
    and begat him that was afterwards called Arjuna.
  summary: Kunti invokes Sakra/Indra, who begets Arjuna. At Arjuna's birth a disembodied
    voice prophesies his greatness, victories, sacrifices, acquisition of divine weapons,
    and restoration of his race. Celestial beings, rishis, Gandharvas, Apsaras, Nagas,
    and others assemble in joy with drums, flowers, song, and dance. Only accomplished
    rishis see the celestial gathering on the mountain. Pandu then wants more children,
    but Kunti refuses by citing a rule against a fourth delivery through another man.
  language: English
  quote_policy: quoted
