canonical_text:
  quote: ''
  summary: The Pandavas live miserably in the woods during exile. Yudhishthira is
    sleepless with remorse over the sufferings caused by gambling. Vyasa visits, is
    received by Yudhishthira, and teaches about enduring alternating happiness and
    misery, the power of asceticism, ethical restraint, karma, rebirth, and the special
    difficulty and merit of charity. He introduces the old story of Mudgala, who gained
    fruit from giving away a drona of corn.
