canonical_text:
  quote: ''
  summary: The passage catalogs beings of Asura, Danava, celestial, divine, and semi-divine
    origin who are born on earth as kings, warriors, teachers, and members of the
    Kuru line. It identifies Drona as not born of a woman and as sprung from a portion
    of Vrihaspati, Aswatthaman as born from united portions of several divine powers,
    the eight Vasus as born from Ganga and Santanu because of a curse and Indra's
    command, and Duryodhana as born from a portion of Kali. It closes with Janamejaya
    asking for the names of Dhritarashtra's sons in birth order.
  language: English
