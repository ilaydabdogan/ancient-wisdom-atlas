canonical_text:
  quote: '"the corpse of her husband begat upon her seven children viz., three Salwas
    and four Madras"'
  summary: 'Kunti replies to Pandu by affirming her exclusive fidelity and urging
    him to beget children upon her. She narrates the Pauranic story of King Vyushitaswa
    and Queen Bhadra: Vyushitaswa was a virtuous sacrificial king who conquered widely,
    loved Bhadra deeply, died of phthisis, and left her sonless. Bhadra lamented over
    him and clasped his corpse. An incorporeal voice granted that he would beget offspring
    upon her if she lay with him at the prescribed time after her catamenial bath.
    She obeyed, and the corpse begot seven children. Kunti then asks Pandu to beget
    offspring on her in like manner through his ascetic power.'
  language: English
  quote_policy: quoted
