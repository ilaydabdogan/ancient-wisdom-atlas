canonical_text:
  quote: ''
  summary: After the death of a deer, Pandu grieves with Kunti and Madri, condemns
    his own passions, and declares his intention to seek salvation through ascetic
    life. He states vows of renunciation, equanimity, non-harm, begging, and childlessness.
    When he tells his wives to inform the family and court that he has retired to
    the woods, Kunti and Madri ask to undergo austerities with him and say they will
    die if abandoned. Pandu accepts their resolve and describes a Vanaprastha life
    of forest dwelling, ritual bathing, homa, offerings to ancestors and gods, simple
    food, ascetic dress, solitude, contemplation, and non-harm.
  language: English
  quote_policy: summarized
