canonical_text:
  quote: The sons of Pandu are as thy arms. Do not lop off those arms of thine.
  summary: Dhritrashtra counsels his eldest son not to be jealous of the Pandavas
    or covet his brother's property. He says Yudhishthira is not deceptive or jealous
    and has equal wealth and friends. Dhritrashtra advises that if his son desires
    sacrificial dignity, priests can arrange the Saptatantu sacrifice, after which
    kings will bring wealth and ornaments. He praises contentment, diligence, and
    preserving one's own possessions, warns against internal dissension and quarrelling
    with friends, and urges peaceful enjoyment and charity.
  language: English
