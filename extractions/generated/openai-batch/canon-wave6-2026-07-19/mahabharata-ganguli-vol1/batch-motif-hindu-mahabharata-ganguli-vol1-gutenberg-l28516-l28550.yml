canonical_text:
  quote: '"The mountains of Himavat might be removed from where they are... but this
    vow of mine will ever be cherished."'
  summary: Arjuna vows to kill Karna and hostile kings if Duryodhana does not return
    the kingdom after the fourteenth year. Sahadeva vows to kill Sakuni and his followers.
    Nakula vows to send the sons of Dhritarashtra to Yama's abode in remembrance of
    the insults to Draupadi. The brothers then approach Dhritarashtra after making
    their pledges.
  language: English
