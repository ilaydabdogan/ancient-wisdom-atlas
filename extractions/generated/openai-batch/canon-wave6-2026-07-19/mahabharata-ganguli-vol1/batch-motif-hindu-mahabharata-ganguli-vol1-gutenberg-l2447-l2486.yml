canonical_text:
  quote: ''
  summary: A Rakshasa, after hearing Agni, takes boar form and abducts Pauloma. The
    child in her womb drops forth, is named Chyavana, shines like the sun, and the
    Rakshasa releases Pauloma, falls, and becomes ashes. Pauloma weeps while carrying
    the child; Brahma comforts her, and her tears become the river Vadhusara. Bhrigu
    later asks who revealed Pauloma to the Rakshasa; when Pauloma says Agni identified
    her, Bhrigu curses Agni to eat all things.
  language: English
  quote_policy: summarized
