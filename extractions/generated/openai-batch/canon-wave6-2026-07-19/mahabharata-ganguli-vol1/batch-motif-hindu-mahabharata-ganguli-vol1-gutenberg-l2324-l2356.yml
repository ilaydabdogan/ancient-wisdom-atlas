canonical_text:
  quote: ''
  summary: Ugrasrava Sauti, versed in the Puranas, stands before Rishis at Saunaka's
    twelve-year sacrifice in the forest of Naimisha. After saying he has described
    Utanka's history as a cause of King Janamejaya's Snake-sacrifice, he asks what
    to narrate next. The holy men defer until Saunaka, their learned sacrificial chief,
    returns from attending the holy fire. Saunaka later completes ritual duties, propitiates
    gods and manes, returns to the sacrifice, sits among the ritual assembly, and
    speaks.
  language: English
  quote_policy: summarized
