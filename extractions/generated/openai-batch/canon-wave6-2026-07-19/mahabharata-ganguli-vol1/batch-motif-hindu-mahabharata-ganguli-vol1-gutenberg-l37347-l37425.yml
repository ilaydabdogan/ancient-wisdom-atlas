  quote: ''
  summary: The passage gives pilgrimage instructions for a sequence of tirthas and
    describes the ritual benefits of visiting, bathing, worshipping, giving, praising,
    dying, or leaving bodily remains at sacred places. It especially praises Prayaga,
    the Ganga-Yamuna confluence, and the Ganga as purifying sites associated with
    gods, ancestors, rishis, serpents, sacrifices, generational sanctification, and
    heavenly reward.
  language: English
  quote_policy: summarized
