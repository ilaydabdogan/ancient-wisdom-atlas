canonical_text:
  quote: "“Draupadi crying piteously in affliction like a female osprey”"
  summary: In an assembly, Draupadi cries and appeals while the kings remain silent.
    Duryodhana challenges her husbands to answer whether Yudhishthira is their lord
    and connects that answer to her condition of slavery. The assembly reacts with
    applause, signs, distress, and expectation. Bhima declares that Yudhishthira’s
    lordship binds the brothers, threatens vengeance for the touching of Draupadi’s
    locks, but says he is restrained by virtue, reverence for his elder brother, and
    Arjuna’s urging. Bhishma, Drona, and Vidura tell Bhima to forbear.
  language: English
  quote_policy: quoted
