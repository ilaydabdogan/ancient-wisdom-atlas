canonical_text:
  quote: ''
  summary: Saunaka asks why Garuda was born and why Indra was at fault. Sauti recounts
    that, during Kasyapa's sacrifice for offspring, Indra mocked the tiny Valakhilya
    ascetics. Angered, they began a sacrifice to create another Indra. Kasyapa redirected
    the result so that an Indra of winged creatures would be born as Vinata's son.
    Vinata bore Aruna and Garuda; Aruna became the forerunner of the Sun, and Garuda
    became lord of birds.
  language: English
  quote_policy: summarized
