canonical_text:
  quote: ''
  summary: Mahadeva reveals Arjuna's former identity as Nara, praises his cosmic might,
    restores Gandiva and inexhaustible quivers, and offers a boon. Arjuna asks for
    a terrible celestial weapon for future battles. Bhava gives the Pasuputa weapon
    instead, warns that it must not be used without adequate cause, and teaches Arjuna
    its mysteries. The weapon appears in embodied form with cosmic portents; Mahadeva
    commands Arjuna to go to heaven, gives him Gandiva, and ascends with Uma from
    the snowy mountain.
  language: English
  quote_policy: summarized
