canonical_text:
  quote: ''
  summary: The celestials petition Vishnu because Brahmanas are being killed at night
    and the destruction of Brahmanas would imperil earth and heaven. Vishnu explains
    that the Kalakeyas, once led by Vritra, have hidden in the ocean after Vritra
    was slain by Indra and are killing saints at night. He says the demons cannot
    be attacked unless the ocean is dried, and that Agastya can do this. The gods,
    with Brahma's permission, go to Agastya's hermitage and praise him as their refuge
    in former perils involving Nahusha, Vindhya, and world-covering darkness.
  language: English
  quote_policy: summarized
