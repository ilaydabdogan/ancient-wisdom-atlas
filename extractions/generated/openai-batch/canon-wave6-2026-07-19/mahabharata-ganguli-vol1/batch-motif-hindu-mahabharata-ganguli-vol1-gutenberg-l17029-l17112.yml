canonical_text:
  quote: Tapati of faultless features, ascended the skies.
  summary: A Gandharva narrates that Tapati goes skyward and King Samvarana collapses
    in the forest. His minister finds and revives him with cold lotus-scented water.
    Samvarana dismisses his attendants, sits on a mountain, purifies himself, worships
    Surya, and thinks of Vasishtha. After twelve days Vasishtha comes, understands
    the king’s condition by ascetic power, ascends to Surya, and asks for Tapati as
    Samvarana’s wife. Surya grants his daughter to Vasishtha, who brings her down
    to Samvarana. The passage then praises Vasishtha’s lineage, ascetic power, restraint,
    and priestly role for kings, and the Gandharva advises appointing a qualified
    Brahmana priest before conquest.
  language: English
  quote_policy: quoted
