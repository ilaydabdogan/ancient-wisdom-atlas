canonical_text:
  quote: the two kings caused the union to take place with due rites
  summary: Aswapati takes Savitri to Dyumatsena's forest hermitage, proposes her marriage
    to Satyavan, answers Dyumatsena's concern about hardship and lost kingdom, and
    secures the alliance. The marriage is performed with rites; Aswapati departs.
    Savitri adopts forest ascetic dress, serves her new family, pleases her husband,
    and remains sorrowfully mindful of Narada's words.
  language: English
