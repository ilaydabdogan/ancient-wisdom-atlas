canonical_text:
  quote: Know that I am Agni!
  summary: Near Khandava, a Brahmana asks Arjuna and Krishna for food, reveals himself
    as Agni, explains that Indra protects Khandava for Takshaka and quenches Agni
    with rain, and asks the two heroes to prevent rain and creatures' escape while
    he consumes the forest. Janamejaya then asks why Agni desired to burn the creature-filled
    forest.
  language: English
