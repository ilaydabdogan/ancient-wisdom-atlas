canonical_text:
  quote: ''
  summary: Dhaumya describes western sacred places in Anartta, especially the Narmada
    and associated rivers, tanks, mountains, asylums, woods, and retreats. The passage
    links these places with divine bathing, ascetic residence, Kuvera's birth, Yayati's
    fall and restoration to righteous regions, and the purifying power of even mentally
    intending pilgrimage to Pushkara.
  language: English
  quote_policy: summarized
