canonical_text:
  quote: ''
  summary: Lomasa narrates that Bharadwaja returns to his hermitage and notices the
    sacrificial fires no longer welcome him. A blind Sudra warder reports that Bharadwaja's
    son went to Raivya's hermitage and was slain by a spear-bearing Rakshasa. Bharadwaja
    laments over his dead son, recalls the son's penances and his own warning against
    visiting Raivya, blames Raivya, curses that Raivya will be killed by his eldest
    son, then cremates his son and enters a blazing fire.
  language: English
  quote_policy: summarized
