canonical_text:
  quote: ''
  summary: Lomasa recounts how Indra, frightened by the demon Mada created through
    Chyavana's power, grants the two Aswins the right to Soma. Chyavana releases Indra,
    apportions Mada into several human activities, completes worship with King Saryati
    and the Aswins, and lives with Sukanya. Lomasa then guides Yudhishthira through
    sacred lakes, waters, Archika hill, springs, Yamuna, and Indra's spring, describing
    rites, ablutions, austerities, and earlier sacrifices performed there.
  language: English
  quote_policy: summarized
