canonical_text:
  quote: ''
  summary: Urvasi, an Apsara, prepares herself with bathing, ornaments, garlands,
    and perfumes, and goes at night to Arjuna's mansion out of desire for him. Arjuna
    receives her reverentially and asks for her command. Urvasi explains that at Mahendra's
    celestial assembly Arjuna had gazed at her, and that Chitrasena, sent by Sakra,
    told her to please Arjuna. She says she has come under that command and because
    she desires him. Arjuna bashfully rejects this address, treating her as equal
    to a superior's wife.
  language: English
  quote_policy: summarized
