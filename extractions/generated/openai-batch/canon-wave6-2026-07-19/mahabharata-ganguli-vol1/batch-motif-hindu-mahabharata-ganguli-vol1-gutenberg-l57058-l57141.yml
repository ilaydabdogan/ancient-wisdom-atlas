  summary: A Yaksha questions Yudhishthira in a sequence of ethical, social, ritual,
    and cosmological riddles. Yudhishthira answers with concise definitions concerning
    family, gifts, knowledge, duty, renunciation, darkness, ritual death, water, food,
    asceticism, restraint, mercy, anger, ignorance, charity, and related virtues.
    In one question, the Yaksha links an answer to permission to drink and take away
    as much as desired. The excerpt stops before the final answer is complete.
  language: English
