candidate_motifs:
- id: motif:1
  label: Instruction in duties and wisdom
  taxonomy_refs:
  - wisdom
  basis: Bhishma’s exposition of duties reconciles Yudhishthira, and the parva is
    described as detailing Dharma, Artha, charity, conduct, truth, and duties in relation
    to time and place.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is a summary of contents rather than the full discourse.
- id: motif:2
  label: Ascension to Heaven
  taxonomy_refs:
  - ascent
  basis: The passage explicitly says that Bhishma’s ascension to Heaven is described
    in the Anusasana Parva.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No details of the ascent are given in this passage.
- id: motif:3
  label: Revived newborn after celestial destruction
  taxonomy_refs:
  - resurrection
  - miraculous_child
  basis: Parikshit is born and revived by Krishna after being burnt by Aswatthaman’s
    celestial weapon.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives only a condensed notice of the event.
- id: motif:4
  label: Horse-sacrifice and contested sacrificial horse
  taxonomy_refs:
  - sacrifice
  basis: The Aswamedhika Parva includes a sacrificial horse let loose, princes seizing
    it, Arjuna’s battles while following it, and a mongoose story during the horse-sacrifice.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain the ritual meaning beyond naming the horse-sacrifice.
- id: motif:5
  label: Abdication and departure into renunciatory life
  taxonomy_refs:
  - departure
  basis: Dhritarashtra abdicates and goes to the woods; Arjuna seeks permission for
    Sannyasa; the Pandavas abdicate and undertake the great journey.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage groups several departures in summary form.
- id: motif:6
  label: Meeting with the dead returned from the other world
  taxonomy_refs:
  - afterlife_journey_map
  basis: Vyasa enables Dhritarashtra to meet spirits of his slain children, grandchildren,
    and other princes returned from the other world.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage supports an afterlife-contact motif, but it does not provide
    an actual journey map or geography of the other world.
- id: motif:7
  label: Curse-driven self-destruction of a heroic race
  taxonomy_refs: []
  basis: The Vrishni heroes, oppressed by a Brahmana’s curse and deprived of reason
    from drink, slay one another with Eraka grass made fatal like thunder.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No specific taxonomy reference is assigned because the passage frames
    the event through curse, drink, fate, and Time without a single listed motif family
    fully matching it.
- id: motif:8
  label: Return of a celestial weapon to a divine recipient
  taxonomy_refs:
  - sacred_exchange
  basis: At Agni’s request, Arjuna worships him and returns the celestial bow Gandiva.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage states return and worship, but does not narrate the original
    acquisition or terms of exchange.
