  summary: 'The passage catalogs several later parvas of the Mahabharata: instruction
    in duties and Bhishma’s ascent; the Aswamedhika events including Parikshit’s revival
    and the sacrificial horse; forest retirement and meetings with the dead; the curse-driven
    destruction of the Vrishnis/Yadus and Arjuna’s despondency; and the Pandavas’
    final great journey with the return of Gandiva to Agni.'
  language: English
  quote_policy: summarized
