canonical_text:
  quote: ''
  summary: Vasudeva points out the capital of Magadha/Girivraja to Partha, describing
    its abundance, inexhaustible water, mansions, freedom from calamity, and protection
    by five wooded hills. He recalls Gautama, Ausinari, their sons, visiting monarchs,
    and named Nagas who formerly dwelt near Gautama's abode. Manu is said to have
    ordered Magadha never to suffer drought, and Kaushika and Manimat are said to
    have favored the country. Vasudeva concludes that Jarasandha owns this impregnable
    city but will be slain that day to humble his pride.
  language: English
  quote_policy: summarized
