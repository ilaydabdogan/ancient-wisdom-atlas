canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Bhishma seeks a second wife for Pandu and travels
    with a large entourage to the Madra king's capital. The king of Madra receives
    him with formal hospitality. Bhishma requests Madri, the king's sister, as wife
    for Pandu. The king explains that his family custom does not allow him simply
    to bestow his sister, and Bhishma accepts the custom as virtuous. Bhishma then
    gives Salya many precious gifts, after which Salya gives Madri to him, and Bhishma
    returns with her to the Kuru capital.
  language: English
  quote_policy: summarized
