canonical_text:
  quote: ''
  summary: Bhima seeks and gathers Saugandhika lotuses connected with Kuvera's lake.
    Violent omens lead Yudhishthira to suspect battle and search for Bhima. The party
    reaches the lotus lake, finds slain Yakshas and Bhima standing angrily with his
    mace, and Yudhishthira admonishes him against rashly offending the gods. Garden
    warders arrive, bow, and the group later dwells on Gandhamadana with Kuvera's
    knowledge.
  language: English
  quote_policy: summarized
