canonical_text:
  quote: ''
  summary: Yudhishthira asks Lomasa why immoral enemies prosper while he suffers.
    Lomasa answers that sinful prosperity is temporary and cites the downfall of Daityas,
    Danavas, and Asuras, contrasting them with gods who practiced virtue, sacrifices,
    penances, gifts, and visits to sacred waters. He instructs Yudhishthira and his
    brothers to bathe in tirthas to regain prosperity and predicts that the sons of
    Dhritarashtra will be destroyed like the Daityas.
  language: English
  quote_policy: summarized
