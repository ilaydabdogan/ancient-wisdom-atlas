  summary: Markandeya describes Skanda’s adornment, the allegiance of the goddess
    of fortune, worship by Brahmanas and rishis, a proposal that Skanda become Indra,
    Skanda’s refusal of sovereignty, his appointment as leader of the celestial forces,
    and explanations for his reputation as son of Rudra through Rudra, the Fire-god,
    Swaha, and the Krittikas.
