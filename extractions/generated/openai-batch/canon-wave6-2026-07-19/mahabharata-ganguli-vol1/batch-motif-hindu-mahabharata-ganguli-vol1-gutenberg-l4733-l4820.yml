canonical_text:
  quote: ''
  summary: Takshaka tests Kasyapa by burning a banian tree with serpent poison; Kasyapa
    revives the tree from ashes. Takshaka then gives Kasyapa wealth so that he will
    not go to the protected king. Takshaka sends snakes disguised as ascetics with
    offerings, enters a fruit in insect form, and bites the king after the king places
    the insect on his neck.
