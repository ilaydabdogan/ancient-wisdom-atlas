canonical_text:
  quote: ''
  summary: 'Arjuna asks the Gandharva why he has been called Tapatya. The Gandharva
    begins an ancestral explanation: Tapati, daughter of the solar deity Vivaswat/Surya,
    is described as unmatched in beauty and virtue; her father chooses King Samvarana,
    a devoted worshipper of Surya, as a fitting husband. During a solitary mountain
    hunt after his horse dies, Samvarana sees Tapati, is overwhelmed by her radiance
    and by desire, and asks who she is.'
  language: English
  quote_policy: summarized
