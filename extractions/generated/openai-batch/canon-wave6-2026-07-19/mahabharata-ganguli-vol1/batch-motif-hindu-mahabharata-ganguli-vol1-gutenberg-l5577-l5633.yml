canonical_text:
  quote: ''
  summary: Astika praises King Janamejaya's sacrifice by comparing it with ancient
    divine and royal sacrifices, blesses those dear to him, praises the officiants
    and Dwaipayana, describes Agni carrying clarified-butter libations to the gods,
    and extols Janamejaya through divine, royal, and sage-like comparisons. Sauti
    then reports that Astika's praise gratified the king, the officiants, and the
    sacrificial fire, after which Janamejaya sees signs around him and addresses them.
  language: English
