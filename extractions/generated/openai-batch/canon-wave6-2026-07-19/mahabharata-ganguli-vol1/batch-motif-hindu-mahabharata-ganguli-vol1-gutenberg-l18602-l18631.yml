canonical_text:
  quote: ''
  summary: 'Yudhishthira receives Drupada''s priest with ritual hospitality, ordering
    Bhima to offer water for foot-washing and Arghya. He then argues that Drupada''s
    conditions for giving his daughter have been satisfied: the hero won Krishna by
    stringing the bow and shooting the mark before assembled monarchs, so Drupada
    should not grieve. A second messenger arrives to announce that the nuptial feast
    is ready.'
