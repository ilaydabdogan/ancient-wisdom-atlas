canonical_text:
  quote: ''
  summary: Nala, using the name Vahuka, enters Rituparna's city after a preceding
    mention of a snake. He offers his skills in horse management, counsel, difficult
    arts, and cooking. Rituparna appoints him superintendent of the stables, with
    Varshneya and Jivala under him. Nala lives there unknown, remembers Damayanti
    each evening, and explains to Jivala in veiled terms that a foolish man deserted
    his wife in a dangerous forest, leaving her in peril from hunger, thirst, and
    beasts of prey.
  language: English
  quote_policy: summarized
