canonical_text:
  quote: ''
  summary: In a framed narration, Yudhishthira and others ask Markandeya about the
    long-lived sage Vaka and his meeting with Indra. Markandeya describes Indra ruling
    a prosperous world after the gods’ conflict with the Asuras, surveying the earth
    from Airavata, and visiting Vaka’s eastern seaside asylum. Vaka receives Indra
    with ritual hospitality. Indra asks about the sorrows of immortality, and Vaka
    lists separation, loss, dependence, social reversal, insult, and the sight of
    worldly contradictions; Indra then asks about the joys of deathless life.
  language: English
  quote_policy: summarized
