  quote: ''
  summary: The passage describes sacred bathing and worship that confer ritual merit
    and benefit ancestors. At Rudrakoti, ten million Munis seek first sight of Mahadeva;
    Mahadeva multiplies himself into ten million forms so each can see him first and
    grants them a boon. The passage then describes the sacred place where the Saraswati
    meets the sea, where gods, Brahma, and Rishis adore Kesava, and where bathing
    purifies sin, grants merit, and leads to Brahma's region.
