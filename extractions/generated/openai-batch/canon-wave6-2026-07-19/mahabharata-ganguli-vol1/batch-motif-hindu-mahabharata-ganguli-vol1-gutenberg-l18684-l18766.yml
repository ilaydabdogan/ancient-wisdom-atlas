canonical_text:
  quote: ''
  summary: Drupada asks Yudhishthira to reveal whether the visitors are Kshatriyas,
    Brahmanas, or celestials in disguise so that his daughter’s wedding may be arranged
    properly. Yudhishthira identifies himself and his brothers as Kshatriya sons of
    Pandu and says Krishna was won by Arjuna. Drupada rejoices, hears of their escape
    from the burning lac palace, censures Dhritarashtra, and vows to restore Yudhishthira
    to his paternal throne. Drupada proposes Arjuna as bridegroom, but Yudhishthira
    states that Krishna should become the common wife of all the brothers, citing
    Kunti’s command and asking that she take their hands before the fire. Drupada
    objects on grounds of usage and the Vedas; Yudhishthira replies that morality
    is subtle and that his mother’s order accords with virtue. Drupada calls for deliberation
    with Kunti and Dhrishtadyumna, and Vyasa arrives.
  language: English
  quote_policy: summarized
