canonical_text:
  quote: ''
  summary: Saunaka asks Sauti to narrate the history of Astika as he heard it from
    his father. Sauti recounts that in the golden age Prajapati's daughters Kadru
    and Vinata became wives of Kasyapa. Kasyapa granted Kadru a boon of a thousand
    snake sons and Vinata a boon of two sons surpassing them. Kadru produced a thousand
    eggs and Vinata two; after long incubation Kadru's eggs hatched. Vinata impatiently
    broke one egg, revealing a half-developed child who cursed her to slavery and
    foretold that the child in the other egg would free her if she waited. The first
    child rose to the sky as Surya's charioteer, and later Garuda emerged from the
    other egg, left his mother, and flew off in search of his assigned food.
  language: English
  quote_policy: summarized
