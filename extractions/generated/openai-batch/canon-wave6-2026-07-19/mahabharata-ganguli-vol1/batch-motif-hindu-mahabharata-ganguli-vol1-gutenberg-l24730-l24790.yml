canonical_text:
  quote: ''
  summary: Vaisampayana recounts that Agni desired and was accepted by King Nila's
    daughter in Mahishmati. After the king discovered Agni in Brahmana form and ordered
    punishment, Agni flamed in wrath; the king bowed, gave his daughter to Agni, and
    received a boon protecting his troops from panic. Agni thereafter consumes hostile
    monarchs who attack the city and grants sexual liberty to Mahishmati's women.
    Sahadeva, seeing his troops afraid and surrounded by flames, purifies himself
    with water and praises Agni as purifier, sacrificial mouth of the gods, and recipient
    of clarified butter offerings. The passage concludes that reciting the mantras
    while pouring clarified butter into Agni brings prosperity and cleansing from
    sins.
  language: English
  quote_policy: summarized
