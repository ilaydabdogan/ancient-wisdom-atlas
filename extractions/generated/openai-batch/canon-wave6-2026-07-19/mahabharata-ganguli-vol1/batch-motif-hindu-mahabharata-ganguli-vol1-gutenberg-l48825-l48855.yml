canonical_text:
  quote: ''
  summary: Markandeya reports that, after the fowler has expounded subtle matters,
    the Brahmana asks him to describe the qualities of sattwa, rajas, and tamas. The
    fowler defines tamas as marked by spiritual illusion, rajas as inciting action,
    and sattwa as greatest. He describes the human dispositions associated with each
    quality, explains the sattwa-influenced person's movement away from worldliness,
    and states that good qualities and rectitude can raise a person born in the Sudra
    caste through higher states up to Brahmana status.
  language: English
  quote_policy: summarized
