canonical_text:
  quote: ''
  summary: Vaisampayana describes Arjuna entering Indra's celestial city, seeing its
    gardens, sacred trees, vehicles, music, and divine residents. The region is described
    as visible only to the virtuous and ritually qualified. Arjuna proceeds along
    the starry way Suravithi, salutes Indra, and is affectionately received by Indra
    as his son, seated beside him, and honored amid songs and dances by Gandharvas
    and Apsaras.
  language: English
  quote_policy: summarized
