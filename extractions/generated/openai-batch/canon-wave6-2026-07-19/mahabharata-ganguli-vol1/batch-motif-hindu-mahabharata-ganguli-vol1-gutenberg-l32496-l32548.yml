canonical_text:
  quote: ''
  summary: After Krishna gives benedictions, Arjuna departs with his bow to behold
    Indra. He crosses sacred mountains and reaches Indrakila, where a heavenly voice
    stops him. He sees an ascetic under a tree, who questions his weapons and says
    they are useless in an abode of peaceful Brahmanas. Arjuna is unmoved. The ascetic
    reveals himself as Sakra and offers a boon. Arjuna asks to learn all weapons,
    refuses heavenly bliss because his brothers remain in the forest and his foe is
    unavenged, and is told that he must first behold three-eyed Siva. Sakra disappears,
    and Arjuna remains there practicing asceticism.
  language: English
  quote_policy: summarized
