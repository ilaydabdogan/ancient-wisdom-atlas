canonical_text:
  quote: ''
  summary: 'In a dialogue, the daughter of Drupada answers Satyabhama by rejecting
    incantations, drugs, and poison as wicked means for a wife to control or harm
    a husband. She then describes her own conduct toward the sons of Pandu: devoted
    service, restraint, household order, ritual duties, care for Kunti, and support
    of Brahmanas and ascetics in Yudhishthira''s household.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Satyabhama has asked about the practices of women, and the daughter of Drupada
    answers her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that a husband who learns that his wife uses incantations
    and drugs begins to dread her like a serpent in his sleeping chamber.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says enemies send poison in the form of customary gifts and that
    powders taken by tongue or skin can kill quickly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says some wicked women have caused diseases or injuries in men
    and husbands, but that a wife should not injure her lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says she controls vanity, desire, wrath, and jealousy while serving
    the sons of Pandu and their wives with devotion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker describes the sons of Pritha as mighty warriors, blazing like
    the sun or fire, handsome as the moon, and able to slay foes by a glance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says her heart likes no celestial, man, or Gandharva other than
    her husbands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaker says she does not bathe, eat, or sleep before her husband and
    attendants have done so, and that she greets a returning husband with water and
    a seat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker says she keeps the house, household articles, rice, and food clean
    and orderly, serves food at the proper time, and avoids anger, idleness, loud
    laughter, and conduct that gives offence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says that when her husband leaves home for a relative, she gives
    up flowers, fragrant paste, foods, drinks, and enjoyments that he does not take,
    and undertakes penances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The speaker says she performs duties taught by her mother-in-law, including
    alms-giving, worship of gods, oblations, and food offerings for ancestors, guests,
    and worthy persons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker states that husbands are the wife's god and refuge, and she regards
    service based on regard for the husband as eternal virtue for women.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The speaker says she personally waits on Kunti with food, drink, and clothes
    and does not prefer herself over Kunti in food or attire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says Yudhishthira formerly fed or entertained large numbers of
    Brahmanas, Snatakas, and yatis, and that the speaker worshipped Brahmanas with
