canonical_text:
  quote: ''
  summary: Salya challenges Bhishma over the maidens, and Bhishma defeats him with
    weapons while sparing his life. Bhishma brings the daughters of the king of Kasi
    to Hastinapura for Vichitravirya. Amba states that she had already chosen the
    king of Saubha and is permitted to act as she wishes; Ambika and Ambalika are
    given to Vichitravirya. Vichitravirya lives with his wives for seven years, contracts
    phthisis, dies, and Bhishma with Satyavati arranges the obsequial rites.
  language: English
  quote_policy: summarized
