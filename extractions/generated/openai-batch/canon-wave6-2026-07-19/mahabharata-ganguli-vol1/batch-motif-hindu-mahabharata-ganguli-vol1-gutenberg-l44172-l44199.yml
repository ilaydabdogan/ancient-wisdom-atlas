canonical_text:
  quote: ''
  summary: The first-person speaker receives a celestial chariot, ornaments, armor,
    and a bowstring, then mounts the chariot formerly associated with the lord of
    the celestials. Celestials approach, ask his purpose, and hear that he intends
    to slay the Nivata-Kavachas. The gods praise him, compare his mission to Maghavan's
    former victories, give him the deep-born shell Devadatta for victory, and he proceeds
    armed toward the abode of the Danavas.
  language: English
  quote_policy: summarized
