canonical_text:
  quote: ''
  summary: Saunaka asks why King Janamejaya undertook a snake-sacrifice and why Astika
    rescued the snakes. Sauti introduces the story of Astika and its line of transmission.
    Astika's father Jaratkaru is described as an austere ascetic who wanders sacred
    places. He sees his ancestors, the Yayavara Rishis, hanging head-down in a hole
    from a rope of virana fibres being eaten by a rat. They explain that they are
    sinking because their line lacks offspring, since Jaratkaru has chosen austerity
    instead of marriage. Jaratkaru identifies himself as their descendant. They command
    him to beget a son; he agrees to marry only for their welfare, under specific
    conditions, and to raise offspring for their redemption.
  language: English
  quote_policy: summarized
