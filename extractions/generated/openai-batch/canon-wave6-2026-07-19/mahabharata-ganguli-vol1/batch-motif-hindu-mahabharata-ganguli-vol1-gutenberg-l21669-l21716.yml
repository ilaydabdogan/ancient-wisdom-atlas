canonical_text:
  quote: ''
  summary: Jarita urges her young birds to enter a hole after seeing a hawk carry
    away the mouse that had lived there. The young birds reject the refuge as still
    potentially dangerous, argue that uncertain death from fire is preferable to certain
    death in the hole, and urge their mother to save herself. Jarita leaves for safety.
    Agni’s flames then approach the young birds, and the eldest, Jaritari, begins
    to speak.
  language: English
