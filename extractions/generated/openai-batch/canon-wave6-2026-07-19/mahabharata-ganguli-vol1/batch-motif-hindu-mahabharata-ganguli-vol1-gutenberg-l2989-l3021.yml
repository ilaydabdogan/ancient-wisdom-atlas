canonical_text:
  quote: ''
  summary: Sauti says that two sisters saw the divine steed Uchchaihsravas, which
    had arisen during the churning of the Ocean for nectar. Saunaka asks why the gods
    churned the Ocean and how the horse sprang forth. Sauti then describes Mount Meru
    as a radiant golden mountain inhabited by divine beings and inaccessible to ordinary
    sinful people. On Meru's gemmed peak the celestials gather, eager for amrita;
    Nara-yana tells Brahman to churn the Ocean with the gods and Asuras so that amrita,
    drugs, and gems may be obtained.
  language: English
  quote_policy: summarized
