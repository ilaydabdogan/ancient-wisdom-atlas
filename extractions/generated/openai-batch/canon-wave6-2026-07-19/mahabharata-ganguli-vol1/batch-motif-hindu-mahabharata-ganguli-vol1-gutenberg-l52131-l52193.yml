canonical_text:
  quote: ''
  summary: After Duryodhana completes a sacrifice and enters the city, public voices
    praise him while some compare his rite unfavorably with Yudhishthira's. His friends
    praise the sacrifice by invoking ancient kings said to have reached heaven through
    such rites. Karna and Duryodhana connect a future Rajasuya sacrifice with the
    killing of the Pandavas. Karna vows abstinence, an Asura vow, and unconditional
    generosity until he kills Arjuna. News of the vow makes the Pandavas, especially
    Yudhishthira, anxious, and Yudhishthira resolves to leave Dwaitavana. Duryodhana
    then rules with allies and continues sacrifices and gifts.
  language: English
  quote_policy: summarized
