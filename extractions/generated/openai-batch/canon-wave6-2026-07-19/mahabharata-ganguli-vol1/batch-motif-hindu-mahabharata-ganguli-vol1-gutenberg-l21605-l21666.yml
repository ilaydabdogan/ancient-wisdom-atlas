canonical_text:
  quote: ''
  summary: During the burning of the Khandava forest, Jarita laments that her unfledged
    infant bird-sons cannot escape the approaching fire. She recalls their absent
    father's predictions about each son's future and asks what duty requires. The
    infant birds urge her to save herself for the sake of the race. Jarita proposes
    hiding them in a mouse hole near a tree and covering it with dust, but the infants
    reject the plan because the mouse may eat them, concluding that death by fire
    is preferable to being devoured.
  language: English
  quote_policy: summarized
