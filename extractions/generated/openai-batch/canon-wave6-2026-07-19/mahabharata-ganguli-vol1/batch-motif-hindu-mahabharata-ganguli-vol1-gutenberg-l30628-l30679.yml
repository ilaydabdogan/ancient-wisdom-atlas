  quote: ''
  summary: Vasudeva narrates Pradyumna’s chariot advance against Salwa and the warriors
    of Saubha. Pradyumna fights from a golden car with a Makara standard, slays Danavas,
    challenges Salwa, and wounds him so that he swoons. Salwa recovers, strikes Pradyumna
    about the throat, and leaves him senseless and motionless on the battlefield.
