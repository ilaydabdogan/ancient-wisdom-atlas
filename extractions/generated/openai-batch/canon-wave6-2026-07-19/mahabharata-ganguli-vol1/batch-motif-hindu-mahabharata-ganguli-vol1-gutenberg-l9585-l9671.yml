canonical_text:
  quote: ''
  summary: Ashtaka asks Yayati whether the ascetic or the person of knowledge first
    attains communion with Brahma. Yayati teaches that knowledge brings immediate
    realization, while yoga practice may require time and may continue across lives.
    Ashtaka notices Yayati’s celestial appearance and asks where he is going. Yayati
    says he has fallen from heaven after losing religious merit and must enter Earth-hell,
    though Indra granted that he fall among the wise and virtuous. Ashtaka and then
    Pratardana offer their heavenly worlds to prevent his fall, but Yayati refuses
    to accept another king’s religious merit as a gift, citing dharma and the proper
    recipients of gifts.
  language: English
  quote_policy: summarized
