canonical_text:
  quote: "“Dice soweth dissensions. And dissensions are the ruin of the kingdom.”"
  summary: Janamejaya asks about the dice game that brought sorrow and destruction.
    Vaisampayana recounts Dhritarashtra privately warning Duryodhana against dice,
    citing Vidura’s wisdom. Duryodhana answers that Yudhishthira’s prosperity and
    his own humiliations in the Maya-built palace have filled him with jealousy and
    pain.
  language: English
  quote_policy: quoted
