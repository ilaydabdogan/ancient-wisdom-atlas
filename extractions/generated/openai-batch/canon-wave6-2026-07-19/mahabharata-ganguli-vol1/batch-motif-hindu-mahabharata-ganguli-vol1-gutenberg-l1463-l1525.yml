- id: claim:1
  claim: 'The passage appears to connect two indexed references to the same triple-city
    destruction pattern: Rudra''s burning of the three cities and the fall of the
    Asura Tripura.'
  claim_level: same_motif
  target: Drona Parva reference to the burning of three cities and Karna Parva reference
    to the fall of Asura Tripura
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is a summary index and does not explicitly state that the
    two references are identical episodes, though the wording strongly suggests a
    shared Tripura/three-cities pattern.
- id: claim:2
  claim: Drona's vow to seize Yudhishthira and Bhima's fulfilled vow against Dussasana
    share the narrative function of binding later battlefield action to an earlier
    martial promise.
  claim_level: same_function
  target: vow-driven battlefield action within the Drona and Karna Parva summaries
  evidence_refs:
  - ev:1
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The vows differ in aim and outcome; the passage only names Drona's
    vow and Bhima's fulfillment without recounting their full contexts.
- id: claim:3
  claim: Duryodhana's concealment in lake waters followed by emergence for combat
    forms a withdrawal-and-return pattern within the battle summary.
  claim_level: same_function
  target: watery concealment followed by re-entry into battle
  evidence_refs:
