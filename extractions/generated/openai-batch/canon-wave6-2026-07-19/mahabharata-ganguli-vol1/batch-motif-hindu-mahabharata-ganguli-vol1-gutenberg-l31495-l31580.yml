canonical_text:
  quote: ''
  summary: Yudhishthira instructs Draupadi that anger causes sin, destruction, social
    disorder, and harm in this world and the next. He argues that both weak and strong
    persons should restrain wrath, that forgiveness preserves peace and the continuation
    of creatures, and that Kashyapa praised forgiveness as virtue, sacrifice, sacred
    knowledge, Brahma, and truth.
  language: English
