canonical_text:
  quote: ''
  summary: Vasishtha recounts that a Brahmana woman tells blinded princes that a Bhrigu
    child hidden in her thigh for a hundred years, filled with the Vedas in the womb,
    scorched their eyes through wrath over the slaughter of his race. The princes
    propitiate the child, regain sight, and he becomes known as Aurva because of his
    thigh-birth. Aurva then undertakes severe asceticism intending to destroy the
    world, until the Pitris of his race explain that the Bhrigus had deliberately
    allowed the Kshatriyas to kill them and command him to restrain his wrath.
  language: English
  quote_policy: summarized
