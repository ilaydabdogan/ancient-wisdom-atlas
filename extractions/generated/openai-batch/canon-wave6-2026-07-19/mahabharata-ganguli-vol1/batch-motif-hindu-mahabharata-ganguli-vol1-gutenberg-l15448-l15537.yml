canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the Rakshasa chief Hidimva descends from a tree
    to find his sister with the Pandavas. Alarmed, she offers to carry Bhima, his
    brothers, and his mother through the skies, but Bhima refuses to flee and promises
    to slay the cannibal. The Rakshasa sees his sister in an adorned human form, accuses
    her of desire and betrayal, and rushes to kill her. Bhima stops him, argues that
    a woman should not be slain, attributes her desire to the deity of desire, and
    challenges Hidimva to single combat. Hidimva replies by challenging Bhima and
    threatening to drink his blood, then kill the others and his sister.
  language: English
  quote_policy: summarized
