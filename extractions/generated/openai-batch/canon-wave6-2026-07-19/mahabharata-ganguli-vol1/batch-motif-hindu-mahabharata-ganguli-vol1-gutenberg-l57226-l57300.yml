canonical_text:
  quote: ''
  summary: The Pandavas rise refreshed after the Yaksha's words. Yudhishthira questions
    the being's identity, and the Yaksha reveals himself as Yudhishthira's father,
    the Lord of justice, who came to test him. Yudhishthira asks boons concerning
    the Brahmana's fire-sticks, the Pandavas' unrecognized thirteenth year, and victory
    over inner faults. The Lord grants the boons, reveals he had taken the fire-sticks
    in deer form, vanishes, and the Pandavas return the fire-sticks. The narrator
    states benefits for those who attend to the story of the Pandavas' revival and
    the father-son meeting.
  language: English
  quote_policy: summarized
