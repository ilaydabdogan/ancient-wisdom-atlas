canonical_text:
  quote: ''
  summary: Vyasa narrates that Indra follows a weeping woman to a Himavat peak, where
    a youth later revealed as Mahadeva is playing dice. Indra boasts of universal
    rule, is paralyzed, made to reveal a cave containing other Indra-like beings,
    and is ordered into a fate of human birth. The former Indras request divine progenitors
    and eventual return to Indra's region. Isana grants their desire and appoints
    Sri as their common wife in human life. Narayana approves the arrangement and
    sends black and white hairs into Devaki and Rohini, becoming Krishna and Valadeva.
    Vyasa identifies the former Indras with the Pandavas, Arjuna as a portion of Sakra,
    and Sri as Draupadi, then grants the king spiritual sight.
  language: English
  quote_policy: summarized
