canonical_text:
  quote: ''
  summary: Damayanti becomes distressed after hearing the swan's words about Nala.
    Her attendants inform her father Bhima, who announces her Swayamvara and invites
    rulers. Kings gather at Vidarbha. Narada and Parvata visit Indra, and Narada explains
    that earthly kings are absent from Indra's region because they are going to Damayanti's
    Swayamvara. The Lokapalas, including Agni, decide to go there. Nala also sets
    out in love for Damayanti. The gods see Nala, are astonished by his beauty, abandon
    their intention, descend from the sky, and ask him to act as their messenger.
  language: English
  quote_policy: summarized
