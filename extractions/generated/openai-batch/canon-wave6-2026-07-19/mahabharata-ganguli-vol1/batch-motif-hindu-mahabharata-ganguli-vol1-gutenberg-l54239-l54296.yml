canonical_text:
  quote: ''
  summary: Markandeya narrates that Rama and Lakshmana remain on Malyavat hill under
    Sugriva's hospitality. Rama, distressed by remembering Sita's captivity, sends
    Lakshmana to Kishkindhya to confront Sugriva for delay in fulfilling his pledge.
    Sugriva receives Lakshmana humbly and explains that monkeys have already been
    dispatched in all directions to search for Sita. Lakshmana is appeased and returns
    with Sugriva to Rama. Search parties from the north, east, and west return without
    finding Sita or Ravana, while the southern party has not yet returned, leaving
    Rama's hopes fixed there.
  language: English
  quote_policy: summarized
