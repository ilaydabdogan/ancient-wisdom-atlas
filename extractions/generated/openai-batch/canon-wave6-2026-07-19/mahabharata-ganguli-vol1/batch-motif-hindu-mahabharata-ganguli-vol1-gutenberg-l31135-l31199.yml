  quote: '"Let us go that sacred and celebrated and large lake called Dwaitavana!"'
  summary: Yudhishthira tells his brothers that they must dwell in the forest for
    twelve years and asks them to find a suitable place. Arjuna proposes the sacred
    lake Dwaitavana, and Yudhishthira agrees. The Pandavas, accompanied by Brahmanas,
    ascetics, and followers, enter the Dwaita woods, encounter forest ascetics, Charanas,
    and Siddhas, exchange salutations, and rest at the foot of a flowering tree.
