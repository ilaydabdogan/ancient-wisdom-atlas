canonical_text:
  quote: ''
  summary: At a grand festival on Raivataka mountain attended by the Vrishnis, Andhakas,
    Bhojas, citizens, rulers, wives, musicians, dancers, and singers, Krishna and
    Arjuna see Bhadra, daughter of Vasudeva and sister of Krishna. Arjuna is overcome
    by desire and asks Krishna how he may obtain her as wife. Krishna says self-choice
    is ordained for Kshatriya marriage but uncertain, and advises Arjuna to carry
    Bhadra away by force. Krishna and Arjuna send messengers to Yudhishthira, who
    assents.
  language: English
  quote_policy: summarized
