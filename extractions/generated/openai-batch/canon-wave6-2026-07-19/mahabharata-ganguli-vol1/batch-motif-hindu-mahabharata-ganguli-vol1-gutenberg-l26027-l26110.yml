canonical_text:
  quote: ''
  summary: Duryodhana remains in the Pandavas' assembly house with Sakuni and is repeatedly
    deceived by crystal surfaces, water, and doors, provoking laughter from Bhima,
    Arjuna, the twins, and palace attendants. After leaving for Hastinapore, he broods
    over Yudhishthira's Rajasuya prosperity, universal homage, and wealth, tells Sakuni
    that jealousy burns him, speaks of self-destruction, and asks that his grief and
    jealousy be reported to Dhritarashtra.
  language: English
  quote_policy: summarized
