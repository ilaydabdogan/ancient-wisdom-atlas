canonical_text:
  quote: "“he saw that it was surrounded on all sides by fire.”"
  summary: Sauti narrates Garuda’s attack on the gods guarding Soma/amrita. Garuda
    defeats and blinds celestial opponents with dust, wings, talons, and beak; divine
    groups retreat, and Yakshas are overcome. Reaching the amrita, Garuda finds it
    encircled by sky-filling fire, assumes many mouths to drink waters from many rivers,
    extinguishes the fire, and then assumes a very small form to enter.
  language: English
  quote_policy: quoted
