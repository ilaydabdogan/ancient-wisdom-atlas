canonical_text:
  quote: ''
  summary: Janamejaya asks what the Pandavas did after Krishna was rescued. Vaisampayana
    narrates that Yudhishthira and his brothers returned with Krishna to Dwaitavana
    and lived frugally under vows. A Brahmana's fire-making sticks and churning staff
    became caught in a deer's antlers and were carried away, threatening his Agnihotra.
    At the Brahmana's request the Pandavas armed themselves and pursued the deer,
    but their weapons could not pierce it and it became invisible. Exhausted, hungry,
    and thirsty, they sat beneath a banian tree, where Nakula lamented their unexpected
    disaster.
  language: English
  quote_policy: summarized
