canonical_text:
  quote: taking the Amrita but without drinking it himself
  summary: Garuda enters the guarded region of Soma, passes a razor-edged revolving
    wheel, defeats two fiery serpent guardians, and carries away the Amrita without
    drinking it. Vishnu grants him boons for this self-denial and asks him to become
    his carrier and banner-emblem. Indra strikes Garuda with the thunderbolt; Garuda
    is unharmed, casts off a feather, receives the name Suparna, and Indra seeks friendship
    with him.
  language: English
  quote_policy: quoted
