canonical_text:
  quote: ''
  summary: Danavas counsel Duryodhana against his vow of starvation, reveal that he
    has a celestial origin and a body made by Maheswara and the goddess, and foretell
    demonic possession and war against the Pandavas. They identify Karna with the
    soul of Naraka, mention a disguised thunderbolt-wielder taking Karna's earrings
    and armor, and appoint Samsaptakas against Arjuna. A goddess returns Duryodhana
    to the place of his suicide vow; he treats the event as dreamlike, resolves to
    defeat the Pandavas, and keeps it secret.
  language: English
  quote_policy: summarized
