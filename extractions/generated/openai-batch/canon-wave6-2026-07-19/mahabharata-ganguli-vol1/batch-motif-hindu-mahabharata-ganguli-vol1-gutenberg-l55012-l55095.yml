canonical_text:
  quote: ''
  summary: After Rama slays Ravana, celestials honor him. Rama grants Lanka to Vibhishana,
    and Avindhya presents Sita to Rama. Rama rejects Sita on grounds of honor after
    her captivity. Sita collapses, then invokes elemental witnesses to attest her
    innocence. Divine beings appear and testify that Sita is sinless; Brahma explains
    that Ravana's own actions and a curse led to his destruction and protected Sita.
    Dasaratha commands Rama to take back Sita and rule, and Rama agrees to return
    to Ayodhya.
  language: English
  quote_policy: summarized
