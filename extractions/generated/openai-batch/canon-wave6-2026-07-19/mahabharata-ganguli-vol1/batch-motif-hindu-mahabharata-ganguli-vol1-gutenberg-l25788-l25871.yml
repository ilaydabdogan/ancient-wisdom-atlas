canonical_text:
  quote: ''
  summary: In an assembly of kings, Sisupala challenges and insults Krishna and threatens
    Krishna and the Pandavas. Krishna recounts Sisupala's prior hostile deeds, states
    that a promised limit of one hundred pardoned offences has been reached, summons
    his discus, and beheads Sisupala. A fierce energy leaves Sisupala's body, adores
    Krishna, and enters Krishna. The sky rains though cloudless, thunder is hurled,
    and the earth trembles. The assembly reacts in different ways; sages, Brahmanas,
    and kings praise Krishna. Yudhishthira orders Sisupala's funeral rites and installs
    Sisupala's son as ruler of Chedi.
  language: English
  quote_policy: summarized
