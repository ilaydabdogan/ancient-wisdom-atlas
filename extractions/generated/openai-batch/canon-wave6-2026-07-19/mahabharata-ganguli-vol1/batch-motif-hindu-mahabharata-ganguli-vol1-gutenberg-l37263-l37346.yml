- id: motif:2
  label: sacred waters cleanse sin and confer spiritual results
  taxonomy_refs:
  - sacred_exchange
  basis: Rivers, tanks, confluences, and tirtha waters are repeatedly used through
    bathing, touching, or oblations to cleanse sin and confer merit, memory, ascent,
    or exalted state.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:10
  - ev:11
  confidence: high
