canonical_text:
  quote: ''
  summary: The passage gives a sequential pilgrimage itinerary through mountains,
    rivers, tanks, forests, and tirthas. It prescribes bathing, fasting, worship,
    residence, Brahmacharya, regulated diet, and oblations to gods and Pitris, with
    rewards such as sacrificial merit, cleansing from sin, prosperity, memory, ascent
    to heavenly or divine regions, and benefit to one's race. It also recounts sacred
    events at Tungaka involving the recovery of forgotten Vedas through the syllable
    Om and a sacrifice officiated by Bhrigu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The itinerary begins with Rishabha mountain, the Kaveri river, and the Kanya
    tirtha, where visiting, bathing, or touching waters is said to confer sacrificial
    merit, merit of giving kine, rejoicing in heaven, or cleansing from sin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gokarna is described as celebrated over the three worlds, situated in the
    deep, reverenced by all worlds, and a place where many classes of beings worship
    the lord of Uma; the pilgrim is instructed to worship Isana and fast there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Gayatri tirtha, a Brahmana's recitation of the Gayatri becomes rhythmic
    and musical, while a non-Brahmana cannot adequately hymn it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Vena, offering water oblations to the gods and Pitris is said to result
    in obtaining a car drawn by peacocks and cranes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Godavari, the Venna confluence, the Varada confluence, Brahmasthuna, and
    Kusaplavana are associated with bathing, staying, or disciplined conduct that
    yields sacrificial merit, gifts of kine, ascent to heaven, or the region of Vasuki.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bathing in Deva-hrada and Jatismara-hrada is said to give memory of a former
    life; the chief of the celestials is said to have performed a hundred sacrifices
    there and ascended to heaven.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bathing or offering water oblations at Sarvadeva-hrada, Payoshni, and Dandaka
    yields merit of giving a thousand kine.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Visiting the asylums of Sarabhanga and Suka gives immunity from misfortune
    and sanctifies the pilgrim's race; bathing at Rama's tirtha at Surparaka yields
    the merit of abundant gifts of gold.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Tungaka, Muni Saraswata taught the Vedas to ascetics; when the Vedas had
    been forgotten, Angirasa's son pronounced Om and the ascetics recollected what
    they had learned.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Tungaka, Rishis and several gods appointed Bhrigu to officiate at a sacrifice,
    and Bhrigu gratified Agni with clarified butter libations and performed the Agnyadhana
    sacrifice for the Rishis.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Entering and residing in the forest of Tungaka with subdued senses and regulated
    diet is said to cleanse sin, lead to the region of Brahma, and deliver one's race.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At Medhavika and Kalanjara, offering water oblations and bathing in the celestial
    lake are said to confer sacrificial merit, memory and intellect, merit of giving
    a thousand kine, and heavenly regard.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Mandakini river on Chitrakuta is described as capable of destroying all
    sins; bathing there and worshiping the gods and Pitris yields horse-sacrifice
    merit and an exalted state.
  category: setting
  evidence_refs:
  - ev:11
