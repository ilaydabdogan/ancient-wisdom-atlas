- id: motif:3
  label: ritual ascent to heaven or divine regions
  taxonomy_refs:
  - ascent
  basis: The passage states that pilgrims or exemplary figures rejoice in heaven,
    ascend to heaven, reach celestial or Vasuki regions, ascend to Brahma's region,
    or attain an exalted state after ritual acts at sacred places.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  - ev:11
  confidence: high
  cautions: The ascent is described as a reward of tirtha practice, not as a detailed
    journey narrative.
- id: motif:4
  label: sacred utterance restores forgotten wisdom
  taxonomy_refs:
  - wisdom
  basis: At Tungaka, after the Vedas are forgotten, Angirasa's son pronounces Om and
    the ascetics recollect their previous learning; Muni Saraswata had taught the
    Vedas there.
  evidence_refs:
