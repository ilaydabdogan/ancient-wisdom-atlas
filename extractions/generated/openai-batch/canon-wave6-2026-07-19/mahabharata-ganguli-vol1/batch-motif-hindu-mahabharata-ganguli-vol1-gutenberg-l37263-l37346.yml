  cautions: The passage gives a brief promised result without narrating a remembered
    past life.
- id: motif:6
  label: world-revered sacred place where many beings worship
  taxonomy_refs:
  - world_center
  basis: Gokarna is celebrated over the three worlds, reverenced by all worlds, and
    populated by gods, Rishis, spirits, Nagas, Siddhas, humans, rivers, seas, mountains,
    and others worshiping the lord of Uma.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage indicates universal reverence and assembly, but does not explicitly
