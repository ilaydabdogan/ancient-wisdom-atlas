canonical_text:
  quote: ''
  summary: Rudra appoints Durvasa to assist King Swetaki's sacrifice. The sacrifice
    is properly completed, with gifts to Brahmanas, and Swetaki later ascends to heaven.
    Agni, having consumed clarified butter continuously for twelve years at that sacrifice,
    becomes afflicted by surfeit and asks Brahman for restoration. Brahman directs
    Agni to consume the living population of Khandava forest as a cure. Agni burns
    Khandava with Vayu's assistance, but the forest dwellers, including elephants
    and many-hooded snakes, repeatedly extinguish the fire with water and other efforts.
  language: English
  quote_policy: summarized
