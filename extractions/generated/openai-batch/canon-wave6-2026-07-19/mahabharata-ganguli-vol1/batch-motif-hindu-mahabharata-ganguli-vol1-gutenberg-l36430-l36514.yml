  quote: ''
  summary: Pulastya instructs a king about pilgrimage through Kurukshetra and numerous
    tirthas, describing their purifying effects, ritual rewards, divine associations,
    and afterlife destinations. The passage culminates in the account of Rama, son
    of Jamadagni, who exterminated Kshatriyas, filled five lakes with their blood,
    offered blood oblations to the Pitris, and received boons making the lakes sacred
    tirthas where later bathers and offerers gain merit, desires, and heaven.
  language: English
  quote_policy: summarized
