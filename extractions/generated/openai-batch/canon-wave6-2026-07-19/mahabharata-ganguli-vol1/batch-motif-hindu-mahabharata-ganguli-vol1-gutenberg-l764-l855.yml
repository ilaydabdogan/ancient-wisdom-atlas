canonical_text:
  quote: ''
  summary: 'Dhritarashtra recounts to Sanjaya a sequence of battlefield reports that
    made him lose hope for Kaurava success: Arjuna''s fulfilled vow, Krishna''s guidance
    and stratagems, deaths of leading warriors, breaches of battle rules, supernatural
    weapons, Duryodhana''s refuge in lake waters and death, Aswatthaman''s attack
    on the unborn child, and the near-annihilation of the armies. He then laments
    Gandhari''s bereavement, the recovery of the kingdom by the Pandavas, the tiny
    number of survivors, his own darkness and swoon, and his wish to die; Sauti frames
    the exchange and Sanjaya prepares to address him.'
  language: English
  quote_policy: summarized
