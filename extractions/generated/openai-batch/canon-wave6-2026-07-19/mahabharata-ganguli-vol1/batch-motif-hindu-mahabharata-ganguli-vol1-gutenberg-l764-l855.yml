candidate_motifs:
- id: motif:1
  label: Refrain of lost hope after adverse omens of war
  taxonomy_refs: []
  basis: The speaker repeats that each report left him with no hope of success, creating
    a patterned catalogue of defeat.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: This is a passage-level narrative pattern rather than a named traditional
    motif in the supplied taxonomy.
- id: motif:2
  label: Vow of vengeance fulfilled before enemies
  taxonomy_refs: []
  basis: Arjuna vows Saindhava's death and fulfills the vow in the presence of enemies
    after Abhimanyu's death is reported.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes the event and does not narrate the full vow episode.
- id: motif:3
  label: Fatal divine weapon redirected from hero to substitute victim
  taxonomy_refs: []
  basis: Karna's Indra-given Sakti, expected to kill Arjuna, is caused by Madhava's
    machinations to be hurled at Ghatotkacha.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not state that Ghatotkacha is a willing substitute or
    sacrificial victim.
- id: motif:4
  label: Breach of warrior code at decisive deaths
  taxonomy_refs: []
  basis: Drona is slain in a way described as transgressing battle laws, and Duryodhana
    is slain unfairly in a club encounter according to Krishna's counsel.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The ethical evaluation is drawn from this passage's wording only.
- id: motif:5
  label: Blood-drinking battlefield vengeance
  taxonomy_refs: []
  basis: Bhimasena drinks Duhsasana's blood in battle while no one can prevent him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not give the earlier cause or vow connected with the
    act.
- id: motif:6
  label: Refuge in water before final defeat
  taxonomy_refs: []
  basis: Duryodhana, exhausted and alone, hides within lake waters before being confronted
    and killed.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents the water refuge literally; symbolic meaning is not
    stated.
- id: motif:7
  label: Weapon against the unborn heir and sacred curse
  taxonomy_refs:
  - divine_judgment
  basis: Aswatthaman's weapon wounds the embryo in Uttara's womb, after which Dwaipayana
    and Krishna curse him.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not narrate the unborn child's later fate, so birth or
    resurrection motifs are not asserted.
- id: motif:8
  label: Royal recovery after near-total war destruction
  taxonomy_refs:
  - royal_legitimacy
  basis: The Pandavas are said to have recovered a kingdom without a rival after the
    war leaves only ten alive.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage states recovery of the kingdom but does not provide a coronation
    or formal legitimation scene.
- id: motif:9
  label: Bereaved royal lament and wish for death
  taxonomy_refs: []
  basis: Dhritarashtra laments the destruction, experiences darkness and swoon, and
    says he wishes to end his life.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a grief pattern grounded in the passage rather than a supplied
    taxonomy motif.
- id: motif:10
  label: Wise counselor addresses despairing ruler
  taxonomy_refs:
  - wisdom
