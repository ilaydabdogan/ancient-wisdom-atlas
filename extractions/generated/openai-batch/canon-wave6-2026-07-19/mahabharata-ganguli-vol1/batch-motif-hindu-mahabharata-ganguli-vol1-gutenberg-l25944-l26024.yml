candidate_motifs:
- id: motif:1
  label: Imperial sacrifice as royal legitimation
  taxonomy_refs:
  - sacrifice
  - royal_legitimacy
  basis: The completed Rajasuya is called a foremost sacrifice, and Vyasa tells Yudhishthira
    he has obtained imperial sway.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the post-sacrifice result rather than detailed ritual
    procedure.
- id: motif:2
  label: Sacred hospitality to a sage
  taxonomy_refs:
  - sacred_exchange
  basis: Yudhishthira receives Vyasa by rising, offering water for his feet, and giving
    him a seat before seeking counsel.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents worshipful reception, but does not explicitly frame
    it as an exchange beyond honor and instruction.
- id: motif:3
  label: Threefold portents before collective destruction
  taxonomy_refs:
  - divine_judgment
  basis: Narada's three kinds of portents are said by Vyasa to bear consequences for
    thirteen years and end in destruction connected to Duryodhana's sins.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage mentions sins, portents, and destruction, but does not describe
    a formal scene of divine judgment.
- id: motif:4
  label: Foretold ominous divine dream
  taxonomy_refs: []
  basis: Vyasa predicts that Yudhishthira will dream of Siva/Bhava with fierce attributes,
    weapons, skull, bull, and a gaze toward the direction of the Pitris.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The dream is foretold in this passage; the passage does not narrate Yudhishthira
    actually experiencing it.
- id: motif:5
  label: Inescapable Time or fate
  taxonomy_refs: []
  basis: Vyasa says none can rise above Time, and Yudhishthira concludes the Rishi's
    words must come to pass.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage states the inevitability of Time, but does not personify Time
    as a character in the action.
- id: motif:6
  label: Preventive vow to avoid discord and war
  taxonomy_refs: []
  basis: Yudhishthira vows for thirteen years not to speak harshly and says disagreement
    causes war, so he will keep war away by agreeable conduct.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The vow is unilateral; no reciprocal covenant partner is stated.
