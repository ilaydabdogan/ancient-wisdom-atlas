canonical_text:
  quote: ''
  summary: After the Rajasuya sacrifice, Vyasa visits Yudhishthira and is worshipped.
    Yudhishthira asks whether the portents associated with the Rajasuya have ended.
    Vyasa foretells thirteen years of consequences ending in the destruction of the
    Kshatriyas, describes an ominous dream of Siva, and says none can overcome Time.
    After Vyasa departs for Kailasa, Yudhishthira grieves, considers his role in the
    coming destruction, receives Arjuna's counsel, and vows for thirteen years to
    avoid harsh words and disagreement in order to keep war away.
  language: English
  quote_policy: summarized
