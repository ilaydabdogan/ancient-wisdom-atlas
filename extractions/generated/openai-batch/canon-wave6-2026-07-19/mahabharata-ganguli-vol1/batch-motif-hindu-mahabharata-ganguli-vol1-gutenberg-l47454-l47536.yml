canonical_text:
  quote: ''
  summary: Markandeya answers Yudhishthira on sacred duties by describing the terrible
    road to Yama's region, where beings are led by Yama's messengers and where gifts
    made on earth become food, water, conveyance, clothing, light, or other aids.
    He then teaches that honoring Brahmana guests, washing their feet, giving cows,
    re-gifting to the virtuous, and making ritual offerings bring merit and gratify
    deities and ancestors.
  language: English
  quote_policy: summarized
