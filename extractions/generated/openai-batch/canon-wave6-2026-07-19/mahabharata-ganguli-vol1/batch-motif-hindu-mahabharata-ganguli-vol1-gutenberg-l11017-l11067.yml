canonical_text:
  quote: ''
  summary: Dirghatamas quarrels with his wife Pradweshi and declares a rule requiring
    a woman to adhere to one husband. Pradweshi orders her sons to cast him into the
    Ganga; they tie the blind old Rishi to a raft and set him adrift. King Vali finds
    and saves him during ablutions, then asks him to beget virtuous sons on Queen
    Sudeshna. Sudeshna first sends her nurse, by whom the Rishi begets eleven learned
    sons. After Vali sends Sudeshna herself, the Rishi touches her and foretells five
    sons—Anga, Vanga, Kalinga, Pundra, and Suhma—whose names become the names of countries.
    The passage concludes that Vali’s line was perpetuated by a great Rishi and that
    Kshatriya warriors arose from Brahmana seed.
  language: English
  quote_policy: summarized
