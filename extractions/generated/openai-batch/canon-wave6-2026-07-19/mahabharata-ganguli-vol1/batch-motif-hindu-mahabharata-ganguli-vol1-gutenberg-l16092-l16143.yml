canonical_text:
  quote: ''
  summary: Kunti offers to send one of her sons with the tribute owed to a Rakshasa
    in place of the Brahmana's family. The Brahmana refuses to preserve himself by
    allowing a Brahmana or guest to die, explaining the sin of abandoning one under
    protection. Kunti assures him that her son, Bhima, has the power and mantra-skill
    to survive and has killed Rakshasas before, but asks that this not be disclosed.
    The Brahmana and his wife assent, and Bhima agrees to undertake the task.
  language: English
  quote_policy: summarized
