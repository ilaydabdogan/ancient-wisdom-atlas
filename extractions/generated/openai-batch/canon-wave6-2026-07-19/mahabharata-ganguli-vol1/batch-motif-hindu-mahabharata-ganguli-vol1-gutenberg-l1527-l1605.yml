  summary: 'The passage summarizes events in the Sauptika, Stri, and Santi Parvas:
    Aswatthaman''s night vengeance after Duryodhana''s fall, the slaughter of sleeping
    Panchalas, Draupadi''s grief, the release and neutralization of a celestial weapon,
    mourning and funerary rites after the war, Kunti''s acknowledgment of Karna, and
    Bhishma''s teachings from his bed of arrows.'
