candidate_motifs:
- id: motif:1
  label: Nocturnal predation as model for human attack
  taxonomy_refs: []
  basis: The passage explicitly sequences the owl killing crows at night before Aswatthaman
    resolves to slay sleeping Panchalas.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is an intra-passage pattern; no external comparative claim is made.
- id: motif:2
  label: Oath-driven vengeance before battle
  taxonomy_refs: []
  basis: Aswatthaman vows to keep his armor on until he kills named enemies and then
    acts on that vengeance.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage summarizes rather than narrates the full episode.
- id: motif:3
  label: Massacre of sleeping unsuspecting enemies at night
  taxonomy_refs: []
  basis: The victims are described as slumbering unsuspectingly in the night when
    Aswatthaman and his companions kill them.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No specific taxonomy family in the supplied list directly matches this
    motif.
- id: motif:4
  label: Threshold guardian overcome through divine worship
  taxonomy_refs: []
  basis: A giant Rakshasa blocks the camp entrance and obstructs weapons; Aswatthaman
    then pacifies three-eyed Rudra by worship before the assault.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exact causal mechanics between the worship and passage through the
    guarded gate are compressed in this summary.
- id: motif:5
  label: Destructive celestial weapon neutralized by counter-force
  taxonomy_refs: []
  basis: Aswatthaman releases a celestial weapon for the destruction of all Pandavas;
    Krishna negates the declaration and Arjuna neutralizes the weapon with his own.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not describe the weapon's form or cosmological scope
    beyond its declared target.
- id: motif:6
  label: Protective substitute effigy receives intended violence
  taxonomy_refs: []
  basis: Krishna places a hard iron statue as a substitute for Bhima, and Dhritarashtra
    breaks the statue instead.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives the event in summary form and does not detail the deception
    mechanics.
- id: motif:7
  label: Battlefield lamentation and funerary rites for the slain
  taxonomy_refs: []
  basis: Women lament dead kin on the field, the bodies of deceased kings are cremated
    with rites, and water is presented to the manes of the deceased princes.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage names rites but does not explain their ritual procedure.
- id: motif:8
  label: Secret kinship disclosed during rites for the dead
  taxonomy_refs: []
  basis: During the water-offering sequence, Kunti acknowledges Karna as her son born
    in secret.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage states the acknowledgment but does not narrate the earlier
    birth story.
- id: motif:9
  label: Wisdom instruction from a wounded elder
