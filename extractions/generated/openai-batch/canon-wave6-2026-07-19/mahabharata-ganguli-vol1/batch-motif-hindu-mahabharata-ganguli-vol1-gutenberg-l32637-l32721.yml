canonical_text:
  quote: ''
  summary: Hara, disguised as a Kirata and accompanied by Uma in Kirata guise and
    a retinue, descends on Himavat. A Danava named Muka approaches Arjuna in boar
    form. Arjuna and the disguised Hara both shoot the boar at the same instant; Muka
    dies and resumes Rakshasa form. Arjuna and the Kirata dispute the kill and then
    fight. The Kirata, identified by the narrator as Sankara, remains unwounded by
    Arjuna's arrows, causing Arjuna to wonder whether his opponent is Rudra or another
    superhuman being.
  language: English
  quote_policy: summarized
