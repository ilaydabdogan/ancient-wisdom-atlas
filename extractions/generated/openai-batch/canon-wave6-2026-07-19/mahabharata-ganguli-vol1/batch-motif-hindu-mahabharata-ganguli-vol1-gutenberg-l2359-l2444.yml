canonical_text:
  quote: ''
  summary: Saunaka asks Sauti to recount the history of the Bhrigu race from ancient
    records. Sauti gives his credentials, introduces Bhrigu’s lineage, and narrates
    how Bhrigu was produced from sacrificial fire by Brahma. He then recounts that
    Bhrigu’s pregnant wife Puloma was seized by a Rakshasa named Puloma, who questioned
    Agni about her rightful husband. Agni, fearing falsehood and Bhrigu’s curse, answers
    that she had first been chosen by the Rakshasa but was ritually given to Bhrigu
    and made his wife with Vedic rites.
  language: English
  quote_policy: summarized
