canonical_text:
  quote: ''
  summary: During the continuation of the Swayamvara episode, Brahmanas offer to fight,
    but Arjuna tells them to stand aside. Arjuna and Bhima confront the attacking
    kings. Arjuna battles Karna with arrows; Karna, impressed, questions whether his
    opponent is a disguised divine or heroic figure. Arjuna answers that he is a Brahmana
    warrior trained by his preceptor, and Karna withdraws, considering Brahma energy
    invincible. Elsewhere Bhima wrestles Salya and throws him without seriously harming
    him. Alarmed, the kings propose to desist and first discover who the Brahmanas
    really are.
  language: English
  quote_policy: summarized
