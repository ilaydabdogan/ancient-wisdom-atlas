canonical_text:
  quote: ''
  summary: A speaker urges Yudhishthira to act rather than remain idle, presenting
    maxims on effort, success, adversity, self-confidence, and strategy. The speaker
    uses a farmer’s ploughing and dependence on clouds as an analogy for human exertion
    and contingent causes. The passage ends by tracing these teachings to a learned
    Brahmana, to Vrihaspati, and to the speaker’s family setting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that a person should act and that idleness leads to succumbing,
    adversity, and lack of success, while active and skillful persons are associated
    with success and prosperity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that hard work cancels a debt to the gods whether or not
    success is achieved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker tells Yudhishthira that present misery has overtaken the group
    and that action may remove it; failure would show Yudhishthira, Vrikodara, Vivatsu,
    and the twins that they cannot snatch the kingdom from the foe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker describes a tiller who ploughs soil, sows seeds, and then waits
    for clouds to help the seeds grow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the agricultural example, if clouds do not favor the tiller, the tiller
    is said to be free from blame and not to reproach himself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker states that success depends on the union of many circumstances
    and that exertion alone is not the only cause, but without exertion there can
    be no success.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says intelligent persons seek prosperity by using place, time,
    means, auspicious rites, carefulness, vigilance, and prowess, with prowess described
    as chief among qualities needed for success.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker advises that when an enemy is superior, one should seek one's
    purpose through conciliation and proper appliances and also wish for the foe's
    harm and banishment.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker extends the enemy example hypothetically to an enemy that might
    be the ocean or the hills.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker says that searching for the weaknesses of enemies discharges a
    debt to oneself and to friends, and that self-disparagement prevents high prosperity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker reports that the teachings came from a learned Brahmana kept by
    the speaker's father, were said to have been uttered by Vrihaspati, were first
    taught to the speaker's brothers, and were later heard by the speaker in the father's
    house.
  category: sequence
  evidence_refs:
  - ev:7
