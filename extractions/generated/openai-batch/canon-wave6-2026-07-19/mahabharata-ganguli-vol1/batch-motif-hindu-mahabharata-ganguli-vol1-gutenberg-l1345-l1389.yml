  summary: 'The passage summarizes contents of the Aranyaka and Virata Parvas: Pandava
    movements through forest settings, visits and recitations by sages and divine
    figures, abduction and rescue episodes involving Draupadi, exchanges between Karna
    and Indra, Dharma’s counsel to Yudhishthira, the Pandavas’ disguised stay in Virata’s
    city after hiding weapons in a shami tree, cattle raids and recoveries, and a
    royal marriage arrangement involving Uttara and Abhimanyu.'
  language: English
  quote_policy: summarized
