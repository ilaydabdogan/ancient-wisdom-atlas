canonical_text:
  quote: ''
  summary: The Gandharva recounts Parasara's birth, naming, mistaken address of Vasishtha
    as father, Adrisyanti's revelation that Saktri was devoured by a Rakshasa, and
    Parasara's consequent resolve to destroy creation. Vasishtha begins to dissuade
    him by narrating the destruction of the Bhrigus by Kshatriyas, the hiding of an
    embryo in a woman's thigh, the child's radiant birth from the thigh, and the blinding
    and supplication of the attackers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adrisyanti, residing in Vasishtha's asylum, gives birth to a son described
    as the perpetuator of Saktri's race.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vasishtha performs the after-birth ceremonies for the child, who is named
    Parasara because Vasishtha abandoned self-destruction after learning of the child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child Parasara treats Vasishtha as his father and addresses him as father
    in Adrisyanti's presence.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Adrisyanti tells Parasara that Vasishtha is his grandfather and that his father
    was devoured by a Rakshasa in another forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After hearing of his father's death, Parasara grieves and resolves to destroy
    the whole creation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Vasishtha addresses Parasara in order to remove the destructive resolution
    from his mind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Vasishtha's account, Kritavirya had given wealth to the Bhrigus, and after
    his death his descendants approached the Bhrigus when they wanted wealth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some Bhrigus hide wealth under the earth, some give wealth to other Brahmanas,
    and some give the Kshatriyas what they ask for.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kshatriyas discover a large treasure at a Bhargava house, become enraged,
    and begin slaughtering Bhrigus and embryos in Bhrigu women's wombs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bhrigu women flee to the inaccessible mountains of Himavat, and one woman
    keeps an embryo in her thigh in order to perpetuate her husband's race.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Brahmana woman reports the hidden embryo to the Kshatriyas, who then come
    to destroy it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: The mother blazes with inborn energy, and the child emerges by tearing open
