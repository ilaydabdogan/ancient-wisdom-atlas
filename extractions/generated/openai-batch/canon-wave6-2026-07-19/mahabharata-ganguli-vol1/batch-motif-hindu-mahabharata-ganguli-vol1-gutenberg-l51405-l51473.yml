canonical_text:
  quote: ''
  summary: Arjuna asks Chitrasena why Duryodhana and the Kauravas have been punished.
    Chitrasena explains that Duryodhana and Karna came to mock the exiled Pandavas
    and the daughter of Drupada, and that the lord of the celestials commanded him
    to capture Duryodhana and protect Arjuna and his brothers. Arjuna requests Duryodhana's
    release on Yudhishthira's authority. After the matter is reported, Yudhishthira
    releases the Kauravas, praises the Gandharvas, and later admonishes Duryodhana.
    The lord of the celestials revives slain Gandharvas with celestial Amrita. Duryodhana
    departs in shame, and Yudhishthira remains in the woods of Dwaita, honored by
    Brahmanas.
  language: English
  quote_policy: summarized
