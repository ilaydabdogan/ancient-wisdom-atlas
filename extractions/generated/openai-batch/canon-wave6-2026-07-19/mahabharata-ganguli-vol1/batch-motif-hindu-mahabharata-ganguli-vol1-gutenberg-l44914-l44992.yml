canonical_text:
  quote: ''
  summary: Bhimasena, overpowered and bound by a serpent, asks how his great strength
    has been defeated. The serpent identifies himself as Nahusha, a former royal sage
    and ancestor, now in snake form because of Agastya's curse after affronting Brahmanas.
    Nahusha says beings he catches lose their strength and that he will be freed when
    someone who knows the relation between the soul and the Supreme Being answers
    his questions. Bhima reflects that destiny has overcome his strength and laments
    the effect of his death on his brothers, mother, and the twins Nakula and Sahadeva.
  language: English
  quote_policy: summarized
