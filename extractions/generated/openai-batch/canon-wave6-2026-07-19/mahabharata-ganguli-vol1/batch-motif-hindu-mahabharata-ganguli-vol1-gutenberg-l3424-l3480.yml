canonical_text:
  quote: ''
  summary: 'Sauti narrates that Garuda diminishes his frightening form, carries Aruna
    across the great ocean, and places him in the eastern regions. Saunaka asks why
    Surya resolved to burn the worlds. Sauti explains Rahu''s enmity after the churning
    of the ocean, Rahu''s attempt to devour Surya, Surya''s wrathful resolve to destroy
    the worlds with heat, and the Grandsire''s remedy: Aruna stands before Surya as
    charioteer, veiling him and taking away his energy.'
  language: English
  quote_policy: summarized
