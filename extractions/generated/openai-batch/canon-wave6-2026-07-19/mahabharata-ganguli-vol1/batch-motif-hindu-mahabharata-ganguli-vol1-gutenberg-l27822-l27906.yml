canonical_text:
  quote: ''
  summary: 'In the Kuru assembly, after the attempted stripping of Draupadi, the gathered
    people censure the son of Dhritarashtra while Draupadi''s moral question remains
    unanswered. Vidura rebukes the assembly for failing to answer an afflicted petitioner
    and teaches that silence or falsehood in response to a moral question incurs sin.
    He supports this with the old story of Prahlada, Virochana, and Sudhanwan: Virochana
    and Sudhanwan wager their lives over superiority for a bride, make Prahlada arbitrator,
    and demand a truthful answer. Prahlada seeks Kasyapa''s counsel, learns the penalties
    for silence and false witness, judges Sudhanwan superior despite Virochana being
    his son, and Sudhanwan spares Virochana because Prahlada adhered to virtue.'
  language: English
  quote_policy: summarized
