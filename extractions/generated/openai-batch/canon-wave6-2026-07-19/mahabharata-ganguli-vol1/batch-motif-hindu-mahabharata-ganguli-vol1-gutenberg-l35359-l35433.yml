canonical_text:
  quote: ''
  summary: King Rituparna asks Vahuka, who is identified by the narrator as Nala,
    to drive him to Damayanti's Swayamvara in Vidarbha within a single day. Vahuka
    grieves, reflects on Damayanti's possible motives, accepts, selects apparently
    lean but auspicious and capable horses, yokes them to the car, soothes them when
    they fall, and drives them upward with wind-like speed. Rituparna and Varshneya
    marvel at Vahuka's horse-skill; Varshneya compares him in thought to Matali, Salihotra,
    and Nala, and reasons that an illustrious person may walk the earth in disguise
    or with altered appearance.
  language: English
  quote_policy: summarized
