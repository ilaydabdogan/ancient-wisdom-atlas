canonical_text:
  quote: ''
  summary: Kanika tells a monarch an animal fable about a politically skilled jackal.
    The jackal and four animal companions cooperate to kill a swift deer, but the
    jackal then uses deception, fear, pride, and intimidation to send each companion
    away and eat the deer alone. Kanika concludes that kings should use different
    methods to bring different types of people under control.
  language: English
  quote_policy: summarized
