  quote: ''
  summary: Kotika addresses a beautiful woman standing alone at a forest hermitage
    beside a Kadamva tree. He wonders whether she is a divine or nonhuman female in
    human form, asks for her father, husband, relatives, race, and purpose there,
    and then introduces himself and a royal martial party including Kshemankara, other
    princes, Jayadratha, his standard-bearers, brothers, and followers.
