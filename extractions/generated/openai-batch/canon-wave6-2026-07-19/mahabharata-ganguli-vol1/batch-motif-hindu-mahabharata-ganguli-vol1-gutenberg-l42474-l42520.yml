canonical_text:
  quote: ''
  summary: A prior speaker concludes remarks on yugas and tells the listener to return.
    In Section CXLIX, Bhima asks to see Hanuman's former or own shape. Hanuman smiles
    and reveals the immense form with which he had crossed the sea, expanding until
    he covers the plantain grove and reaches mountain-like height. Bhima is awed,
    closes his eyes, asks Hanuman to shrink, and says Hanuman could have destroyed
    Lanka and Ravana's forces by himself.
