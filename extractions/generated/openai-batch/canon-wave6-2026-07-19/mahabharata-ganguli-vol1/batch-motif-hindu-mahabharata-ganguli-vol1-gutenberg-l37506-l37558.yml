canonical_text:
  quote: ''
  summary: Yudhishthira addresses Dhaumya after consulting his brothers and Narada.
    He says Arjuna has been sent to obtain arms from Indra, identifies Krishna and
    Arjuna with Vishnu and with Nara and Narayana, assesses opposing warriors including
    Karna, and uses a fire-and-storm image in which Arjuna with Krishna can extinguish
    Karna’s destructive force. He then asks Dhaumya to name another sacred woodland
    where they may wait for Arjuna because Kamyaka is intolerable without him.
  language: English
  quote_policy: summarized
