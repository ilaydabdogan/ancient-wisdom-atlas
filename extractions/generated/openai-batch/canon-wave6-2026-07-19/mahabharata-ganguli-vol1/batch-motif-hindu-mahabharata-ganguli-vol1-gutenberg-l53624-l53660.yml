canonical_text:
  quote: ''
  summary: Markandeya recounts that sages and celestial seers, with Agni as spokesman,
    ask Brahma for protection from the Ten-headed son of Visrava, who cannot be slain
    because of Brahma's boon and oppresses earthly creatures. Brahma says the enemy
    cannot be conquered by gods or Asuras, but his death is near and Vishnu will accomplish
    the needed act. Brahma commands Sakra and the celestials to be born on earth and
    to beget powerful, form-changing sons on monkeys and bears as Vishnu's allies.
    Dundubhi is sent and born among humans as the hunchbacked Manthara. Celestial
    offspring are born among monkey and bear wives and are described as very strong
    warriors using stones and trees as weapons. Brahma then instructs Manthara, who
    goes about fomenting quarrels.
  language: English
  quote_policy: summarized
