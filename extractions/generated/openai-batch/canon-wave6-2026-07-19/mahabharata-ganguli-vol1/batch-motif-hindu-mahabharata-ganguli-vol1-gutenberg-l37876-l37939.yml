canonical_text:
  quote: ''
  summary: Lomasa reports Arjuna's request that Yudhishthira undertake a journey to
    sacred tirthas, give away cattle, and travel under Lomasa's protection from Rakshasas.
    Lomasa praises the merit and fear-dispelling power of tirtha journeys, cites earlier
    royal exemplars, and urges Yudhishthira to go. Yudhishthira agrees, reduces his
    retinue to those able to endure hardship, sends others to Hastinapura for support,
    and remains briefly at Kamyaka with a small group of Brahmanas under Lomasa's
    encouragement.
  language: English
  quote_policy: summarized
