canonical_text:
  quote: ''
  summary: In a dice game, Sakuni repeatedly asks Yudhishthira what wealth remains
    and, using unfair or foul means with the dice, declares each stake won. Yudhishthira
    successively stakes immense wealth, livestock, city and country, subjects except
    Brahmanas, ornamented princes, his brothers Nakula, Sahadeva, Falguna/Dhananjaya,
    Bhimasena, and finally himself. Sakuni then says that Krishna, princess of Panchala,
    remains unwon and urges Yudhishthira to stake her to win himself back.
  language: English
  quote_policy: summarized
