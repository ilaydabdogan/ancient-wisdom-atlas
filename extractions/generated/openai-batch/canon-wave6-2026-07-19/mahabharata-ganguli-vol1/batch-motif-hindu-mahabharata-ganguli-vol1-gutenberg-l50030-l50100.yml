candidate_motifs:
- id: motif:1
  label: Multiple maternal claimants adopt or claim a divine son
  taxonomy_refs:
  - divine_parent_child
  basis: The six Rishi wives, Vinata, and the great mothers each claim or request
    maternal relation to Skanda, and Skanda accepts such mother-son language.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage emphasizes adoption, claim, or ritual sonship; the reported
    birth by the six ladies is presented as a rumour, not as confirmed biological
    birth.
- id: motif:2
  label: Maternal goddesses as mothers of creatures and recipients of worship
  taxonomy_refs:
  - mother_goddess
  basis: The great mothers are described as mothers of all creatures, they seek the
    dignity of mothers of the world, and Skanda says they will be worshipped by all.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  confidence: high
  cautions: The passage includes competing groups of mothers, so the motif should
    not be reduced to a single goddess figure.
- id: motif:3
  label: Shape-changing child afflictors and protectors
  taxonomy_refs:
  - shapeshifter
  basis: The mothers ask to assume different shapes, agree to protect, and are granted
    various forms by which they afflict children before the sixteenth year.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage combines affliction and protection; it does not describe individual
    transformations in detail.
- id: motif:4
  label: Celestial vacancy filled by installing a substitute star
  taxonomy_refs: []
  basis: Abhijit is described as a fallen or absent star after going to the woods,
    and Krittika is assigned a place in the heavens as the substitute asterism.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy family directly names constellation installation
    or asterism substitution.
- id: motif:5
  label: Ritual sonship and funeral-cake obligation
  taxonomy_refs:
  - sacred_exchange
  basis: Vinata claims Skanda as a son specifically in relation to his entitlement
    to offer funeral cakes at her obsequies and asks to live with him; Skanda grants
    her request.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The exchange element is ritual and relational rather than a negotiated
    material bargain.
- id: motif:6
  label: Grant of fierce spirit, worship, and social role
  taxonomy_refs:
  - sacred_exchange
  basis: Skanda directs the mothers to protect, grants them fierce inexhaustible spirit
