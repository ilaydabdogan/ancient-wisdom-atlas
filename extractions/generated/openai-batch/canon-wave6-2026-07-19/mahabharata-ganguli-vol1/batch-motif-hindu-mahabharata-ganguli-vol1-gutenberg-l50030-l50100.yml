canonical_text:
  quote: '"Ye are all as mothers to me, and I am your son."'
  summary: Several female or maternal figures petition Skanda/Mahasena after his appointment
    as leader of the celestial forces. He accepts multiple maternal relationships,
    is asked about a missing asterism, agrees to Vinata's residence with him, and
    grants the great mothers a role involving protection, affliction of children before
    the sixteenth year, fierce spirit, and worship.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After Mahasena had been made leader of the celestial forces, six ladies, described
    as wives of the seven Rishis, went to his camp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The six ladies said their husbands had cast them out because of a rumour that
    they had given birth to Skanda, and they asked Skanda to save them from infamy
    by allowing them to adopt him as their son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Skanda replied that the six ladies should become his mothers and that he was
    their son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sakra/Vasava told Skanda that Abhijit, younger sister of Rohini, had gone
    to the woods to perform austerities, creating the need for a substitute for a
    fallen star.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Krittika was assigned a place in the heavens, and the star is described as
    presided over by Agni and shining as if with seven heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vinata told Skanda that he was as a son to her, was entitled to offer funeral
    cakes at her obsequies, and was desired as a permanent companion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Skanda accepted Vinata's request and told her to guide him with a mother's
    affection and live with him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The great mothers said that learned people described them as mothers of all
    creatures, but they desired to be Skanda's mothers and to be honoured by him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mothers asked that Brahmi, Maheswari, and other ladies appointed as mothers
    of the world be dispossessed of that dignity, and that the petitioning mothers
    be worshipped by the world instead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Skanda said the mothers could not recover progeny that had once been given
    away, but he could give them other offspring.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The mothers asked to live with Skanda, assume different shapes, and eat up
    the progeny of the other mothers and their guardians.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Skanda asked the mothers to provide protecting care, and they agreed while
    also asking to live with him always.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Skanda declared that until human children reached youth in their sixteenth
    year, the mothers would afflict them in various forms; he also conferred on the
    mothers a fierce inexhaustible spirit and said they would be worshipped by all.
  category: speech
  evidence_refs:
  - ev:12
