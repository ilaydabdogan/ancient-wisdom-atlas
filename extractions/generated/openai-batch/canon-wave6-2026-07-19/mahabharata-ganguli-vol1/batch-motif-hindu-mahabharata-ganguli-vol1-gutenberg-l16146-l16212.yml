canonical_text:
  quote: ''
  summary: Bhima pledges to undertake a dangerous task. Yudhishthira privately questions
    Kunti and rebukes her for sending her own son into a near-suicidal deed. Kunti
    replies that Bhima will act for the Brahmana who sheltered them and for the town’s
    liberation. She cites Bhima’s extraordinary strength, including a childhood incident
    in which his fall broke mountain stone, and explains that Kshatriya protection
    of others brings religious merit, a teaching she attributes to Vyasa.
  language: English
