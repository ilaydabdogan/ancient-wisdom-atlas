canonical_text:
  quote: ''
  summary: Markandeya narrates that after Vamadeva's words, four Rakshasas kill a
    king who refuses to yield the Vami steeds. The Ikshvakus install Dala as king.
    Vamadeva asks Dala for the steeds, citing the duty to give to Brahmanas. Dala
    tries to have Vamadeva shot with a poisoned arrow, but the arrow kills Dala's
    son Senajita. A second arrow cannot be aimed at Vamadeva. Vamadeva directs Dala
    to touch the queen with the arrow to purge his sin. The queen asks to instruct
    her husband, serve Brahmanas, and later asks that her husband be freed from sin
    and that Vamadeva seek the welfare of his son and kinsmen. Vamadeva grants this,
    and Dala gives him the Vami steeds with reverence.
  language: English
  quote_policy: summarized
