candidate_motifs:
- id: motif:1
  label: transformed demon served as food and defeated by digestion
  taxonomy_refs:
  - shapeshifter
  basis: Vatapi is transformed into a ram, cooked and served as meat; Agastya eats
    him and declares him already digested when Ilwala summons him.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage shows transformation and defeat by digestion, but this excerpt
    does not fully describe any previous uses of the device.
- id: motif:2
  label: dangerous hospitality reversed by ascetic power
  taxonomy_refs:
  - trickster_boundary
  basis: Ilwala receives the guests hospitably while serving his transformed brother
    as meat; Agastya neutralizes the danger by eating and digesting Vatapi.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The text presents hospitality, transformation, summoning, and defeat,
    but does not explicitly label Ilwala’s act as a trick within this passage.
- id: motif:3
  label: ascetic knowledge reveals hidden intention and obtains wealth
  taxonomy_refs:
  - wisdom
  - sacred_exchange
  basis: Agastya asks for wealth and accurately states what Ilwala has intended to
    give, including the golden car, which Ilwala confirms before giving the gifts.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage reports Agastya’s accurate knowledge of Ilwala’s intention
    but does not explain the mechanism of that knowledge.
- id: motif:4
  label: one virtuous learned son preferred to many inferior sons
  taxonomy_refs:
  - wisdom
  - sacred_birth
  basis: Lopamudra is offered different numbers and qualities of sons and chooses
    one good and learned son equal to a thousand.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The moral contrast between one good son and many evil ones is stated by
    Lopamudra, not expanded into a general doctrine in this passage.
- id: motif:5
  label: miraculous learned child after prolonged gestation
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The foetus grows for seven years, and Dridhasyu is born blazing in splendour
    and as if repeating sacred learning.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The birth is extraordinary in duration and attributes; the passage does
    not call the child divine.
- id: motif:6
  label: offspring secures desired ancestral regions
