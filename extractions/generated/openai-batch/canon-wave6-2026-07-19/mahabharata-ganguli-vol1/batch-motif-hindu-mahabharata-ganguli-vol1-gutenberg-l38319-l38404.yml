canonical_text:
  quote: ''
  summary: Lomasa recounts how Ilwala hospitably serves the transformed Asura Vatapi
    as ram-meat to Agastya and accompanying kings. Agastya eats and digests Vatapi,
    preventing Ilwala from calling him back. Ilwala then gives wealth, a golden car,
    and swift horses. Agastya uses the wealth to satisfy Lopamudra’s wishes; she asks
    for one excellent learned son rather than many lesser sons. Their son Dridhasyu
    is born after seven years, blazing and learned, and becomes known as Idhmavaha
    because he carries sacrificial fuel. The passage then describes Agastya’s asylum,
    the sacred Bhagirathi flowing near it, and Bhrigu’s tirtha, where bathing restored
    Rama’s might and is said to restore Yudhishthira’s lost energy.
  language: English
  quote_policy: summarized
