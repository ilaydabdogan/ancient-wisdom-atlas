canonical_text:
  quote: ''
  summary: Krishna, Bhima, and Dhananjaya enter Magadha and Girivraja, break the worshipped
    Chaityaka peak, proceed in the guise of Brahmanas, and approach Jarasandha. Omens
    are reported to Jarasandha, who undertakes ritual countermeasures. Jarasandha
    receives the disguised guests with formal honors and later, at midnight, questions
    their strange attire, warrior marks, improper entry, and motive.
  language: English
  quote_policy: summarized
