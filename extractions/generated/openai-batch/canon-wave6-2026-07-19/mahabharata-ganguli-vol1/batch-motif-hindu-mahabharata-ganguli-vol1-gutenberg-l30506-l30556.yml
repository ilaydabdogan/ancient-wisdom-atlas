canonical_text:
  quote: besieged that city around and above
  summary: Yudhishthira asks Vasudeva for details about the death of the lord of Saubha.
    Vasudeva recounts that Salwa came to Dwaravati after hearing that Sisupala had
    been slain, attacked the city from around and above, and met a highly organized
    defense involving fortifications, weapons, watchfulness, restrictions on drinking
    and movement, destroyed bridges, spiked trenches, hidden combustibles, entry signs,
    paid combatants, elephants, horses, and command by Ahuka/Ugrasena.
  language: English
  quote_policy: quoted
