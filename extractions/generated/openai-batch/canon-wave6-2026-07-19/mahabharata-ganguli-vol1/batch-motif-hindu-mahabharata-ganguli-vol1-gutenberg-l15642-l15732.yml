canonical_text:
  quote: ''
  summary: After Bhima threatens Hidimva, Yudhishthira restrains him from killing
    a woman and places virtue above life-preservation. Hidimva petitions Kunti and
    Yudhishthira to unite her with Bhima, promising to return him and aid the Pandavas.
    Yudhishthira permits a daytime union if Bhima returns nightly, and Bhima agrees
    to remain until she bears a son. Hidimva carries Bhima through many sacred and
    natural regions, assumes a beautiful form, conceives, and bears Ghatotkacha, a
    mighty nonhuman-looking child who immediately matures, learns weapons, honors
    his parents, receives a name based on his pot-like bald head, and becomes devoted
    to the Pandavas.
  language: English
  quote_policy: summarized
