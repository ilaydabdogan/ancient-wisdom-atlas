  quote: ''
  summary: The passage narrates Ekalavya's extraordinary archery, the Pandavas' discovery
    of him, Arjuna's complaint to Drona, Drona's demand for Ekalavya's right thumb
    as a teacher's fee, Ekalavya's willing self-mutilation and loss of skill, the
    ranking of Drona's pupils, and Drona's preparation of an archery test using an
    artificial bird on a tree.
