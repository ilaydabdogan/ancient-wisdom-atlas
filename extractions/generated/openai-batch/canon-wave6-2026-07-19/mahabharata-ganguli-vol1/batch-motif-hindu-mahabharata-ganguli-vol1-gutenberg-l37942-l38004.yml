canonical_text:
  quote: ''
  summary: Brahmanas dwelling with Yudhishthira in the woods ask to accompany him,
    his brothers, and Lomasa on a pilgrimage to dangerous sacred tirthas so that they
    may gain merit and purification. Yudhishthira agrees. Vyasa, Parvata, and Narada
    arrive and instruct the Pandavas to purify their minds as well as observe bodily
    vows before visiting the tirthas. After propitiatory ceremonies and worship of
    sages, the Pandavas, Krishna, Dhaumya, the ascetics, attendants, cars, and servants
    set out eastward on an auspicious date, dressed ascetically but armed and armored.
  language: English
  quote_policy: summarized
