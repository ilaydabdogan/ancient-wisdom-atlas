canonical_text:
  quote: ''
  summary: Bhishma urges that the Kuru dynasty be preserved and expanded through suitable
    high-born marriages. Vidura defers to Bhishma's judgment. Bhishma learns that
    Gandhari has received from Hara/Siva a boon of one hundred sons, and arranges
    her marriage to the blind Dhritarashtra. Suvala consents because of Kuru lineage
    and reputation. Gandhari blindfolds herself out of respect for her future husband,
    and Sakuni formally gives her to Dhritarashtra. Gandhari is then praised for devoted
    and chaste conduct among the Kurus.
  language: English
  quote_policy: summarized
