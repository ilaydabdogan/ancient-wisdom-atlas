canonical_text:
  quote: ''
  summary: Vasuki hears his mother's curse against the snakes and convenes the offspring
    of Kadru to seek a way to avert destruction by Janamejaya's snake-sacrifice. The
    serpents propose various strategies, including disguise as Brahmanas, political
    counsel, killing ritual specialists, extinguishing the sacrificial fire with rain,
    stealing the Soma vessel, terrorizing or defiling the rite, demanding sacrificial
    fees as Ritwiks, abducting the king, or biting him. Some serpents object that
    killing Brahmanas is unrighteous. Vasuki rejects the proposed final determination
    and says only the grace of their father Kasyapa seems able to help.
  language: English
  quote_policy: summarized
