canonical_text:
  quote: ''
  summary: Vaisampayana recounts how King Uparichara, also called Vasu, conquered
    Chedi under Indra's instruction, later undertook austerities, and was persuaded
    by the gods to return to righteous kingship. Indra grants him divine friendship,
    knowledge, a crystal aerial car, an unwounding lotus garland, and a bamboo pole
    that becomes the basis of an Indra festival. Vasu rules virtuously, installs five
    sons as rulers and founders of dynasties, travels through the sky in Indra's car,
    and frees the river Suktimati from the life-endued mountain Kolahala. The mountain
    and river have twin children, whom the river gives to Vasu; the son becomes his
    general and the daughter Girika becomes his wife.
  language: English
  quote_policy: summarized
