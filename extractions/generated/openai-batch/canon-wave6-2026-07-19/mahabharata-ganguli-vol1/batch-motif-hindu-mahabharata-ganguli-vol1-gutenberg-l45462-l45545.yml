canonical_text:
  quote: The destiny of every creature after death is determined by his acts in this
    world.
  summary: Markandeya answers Yudhishthira on happiness and misery in this world and
    the next. He describes primordial pure humans, their moral decline, post-mortem
    consequences determined by acts, rebirth, hellish suffering, ascetic insight,
    celestial return, four types of worldly and next-world happiness, and the otherworldly
    birth and future supreme region of the addressees.
  language: English
  quote_policy: quoted
