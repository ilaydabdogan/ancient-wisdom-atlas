canonical_text:
  quote: ''
  summary: Markandeya narrates that Uktha undertook severe penance for a pious son.
    Through hymns and five sacred fires, a bright five-coloured celestial being arose,
    associated with five men and five tribes. The being called Tapa performs further
    penance, produces an ancestral fire, creates day and night, deities, elements,
    hymns, mind, senses, creatures, sons of the Pitris, and other beings. Tapa also
    creates fifteen gods who obstruct sacrifices unless given offerings outside the
    altar or appeased by hymns. The passage closes with notes on Vrihaduktha, Rathantara,
    Mitravinda, Agnihotra worship, and Tapa's happiness with his sons.
  language: English
  quote_policy: summarized
