canonical_text:
  quote: ''
  summary: Lomasa describes a sacred landscape marked by former sacrifices, royal
    gifts, holy rivers, lakes, trees, altars, and bathing-places. He recalls sacrifices
    by divine, royal, and saintly figures; a goblin-woman's reported speech; the field
    of the Kurus; Plakshavatarana on the Yamuna; Bharata's horse-sacrifice; and a
    bath that grants purification and vision of all worlds. The Pandu son bathes with
    his brothers, reports seeing the worlds and Arjuna, and Lomasa points to the Saraswati,
    the altar of the lord of beings, and the sacrificial field of the Kurus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lomasa says the lord of born beings formerly performed the thousand-year Ishtikrita
    sacrifice at the place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Amvarisha, son of Nabhaga, sacrificed near the Yamuna, gave ten Padmas of
    gold coins to attendant priests, and obtained high success through sacrifices
    and austerities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yayati, son of Nahusha, is said to have performed sacrificial rites there,
    competed with Indra, and left the ground studded with places for sacrificial fires.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Lomasa points out a Sami tree with a single leaf, an excellent lake, lakes
    of Parasurama, Narayana's hermitage, and the path of Richika's son.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Pisacha woman decked with pestles as ornaments is reported to have spoken
    to a Brahmana woman about curd, residence, bathing, sons, and a warning that a
    second night there would differ from the day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The place is called the threshold of the field of the Kurus; Yayati is again
    said to have sacrificed there and made abundant gem-gifts, pleasing Indra.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Plakshavatarana is identified as an excellent holy bathing-place on the Yamuna
    and is called by cultured men the entrance to the region of heaven.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Saints are said to have used a sacrificial stake as their pestle and to have
    performed a holy plunge after a sacred ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: King Bharata performed sacrificial rites there, released the intended horse-victim
    for a horse-sacrifice, and is said to have won sovereignty of the earth by righteousness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marutta, sheltered by Samvartta, is said to have succeeded in performing excellent
    sacrifices at the spot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Lomasa says bathing at the spot allows one to behold all worlds and be purified
    from evil deeds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Pandu son bathes there with his brothers while saints praise him, then
    says that by the pious act he beholds all worlds and sees Arjuna, rider of the
    white steed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lomasa says high saints behold all regions, points to the Saraswati as a refuge,
    says bathing there frees sins, and identifies a five-yojana altar of the lord
    of beings in the sacrificial field of the Kurus.
  category: speech
  evidence_refs:
  - ev:9
