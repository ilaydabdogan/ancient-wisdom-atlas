candidate_motifs:
- id: motif:1
  label: Accumulated sacrificial sanctity of a landscape
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage repeatedly identifies the same region through sacrifices, gifts,
    fire-places, altars, priests, and royal or saintly ritual acts.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage presents a catalogue of rites rather than a single narrative
    episode.
- id: motif:2
  label: Royal sacrifice legitimating sovereignty
  taxonomy_refs:
  - royal_legitimacy
  - sacrifice
  basis: Yayati is described as sovereign and sacrificer; Bharata performs rites,
    releases the horse for horse-sacrifice, and wins sovereignty by righteousness;
    Marutta succeeds in excellent sacrifices.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not narrate the full political consequences beyond brief
    statements of sovereignty and ritual success.
- id: motif:3
  label: Holy bathing grants purification and vision of worlds
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: Lomasa says bathing allows one to behold all worlds and removes evil deeds;
    the Pandu son bathes and reports seeing all worlds; the Saraswati bath is said
    to free sins; Plakshavatarana is called an entrance to heaven.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text describes vision and access-language, not an actual narrated
    ascent or afterlife journey.
- id: motif:4
  label: Tree-marked access to a sacred or heavenly threshold
  taxonomy_refs:
  - sacred_tree_axis
  - world_center
  basis: Lomasa points out a single-leaf Sami tree and identifies Plakshavatarana,
    the descent of the banian tree, as a Yamuna bathing-place called the entrance
    to the region of heaven.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The function of the Sami tree is not explained, and the tree-axis reading
    rests chiefly on the name and heavenly-threshold language of Plakshavatarana.
- id: motif:5
  label: Supernatural warning at a liminal sacred site
  taxonomy_refs:
  - trickster_boundary
  basis: A Pisacha woman speaks at the sacred place and warns that spending a second
    night will bring events different from those of the day.
  evidence_refs:
  - ev:3
  confidence: low
  cautions: The passage gives the speech without explaining its outcome, intent, or
    relation to a broader narrative pattern.
