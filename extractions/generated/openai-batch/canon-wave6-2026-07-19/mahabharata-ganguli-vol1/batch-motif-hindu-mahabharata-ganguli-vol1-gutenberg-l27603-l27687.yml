canonical_text:
  quote: Morality, however, is subtle.
  summary: Duryodhana orders Dussasana to bring Draupadi to the Kuru assembly after
    the dice game. Dussasana seizes and drags her by the hair despite her protests
    about her condition and clothing. Draupadi appeals to the learned elders and challenges
    the legitimacy of Yudhishthira staking her after being defeated. The Pandavas
    are enraged, some Kuru figures approve the humiliation, most onlookers grieve,
    and Bhishma declares the moral/legal question too subtle for him to decide.
  language: English
  quote_policy: quoted
