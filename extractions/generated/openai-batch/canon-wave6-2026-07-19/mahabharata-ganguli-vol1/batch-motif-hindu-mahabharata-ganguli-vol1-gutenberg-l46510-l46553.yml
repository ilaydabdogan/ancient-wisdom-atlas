canonical_text:
  quote: And when those terrible times will be over, the creation will begin anew.
  summary: 'The passage describes signs of the end of a Yuga: fires, an obscured Sun,
    unseasonable rain, crop failure, social and familial violence, hunger, frightening
    animal cries, abandonment of settlements, and wandering people. After the terrible
    time, creation begins again, humanity is re-formed in four orders, celestial conditions
    mark the return of the Krita age, prosperity returns, and Kalki is born in Sambhala.
    Kalki is said to possess power, command martial resources by thought, restore
    order and peace, destroy all things, inaugurate a new Yuga, and exterminate the
    mlecchas.'
  language: English
  quote_policy: quoted
