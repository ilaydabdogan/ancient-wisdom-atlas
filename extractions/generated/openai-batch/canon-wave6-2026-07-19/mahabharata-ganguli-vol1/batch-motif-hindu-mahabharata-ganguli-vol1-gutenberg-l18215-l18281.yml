canonical_text:
  quote: ''
  summary: At Drupada's Swayamvara, the invited kings become angry when Drupada intends
    to give his daughter to the Brahmana who shot the mark. They argue that a Kshatriya
    bride-choice belongs to Kshatriyas, threaten violence against Drupada and his
    daughter, and rush armed toward him. Drupada seeks protection from the Brahmanas.
    Bhima and Arjuna oppose the kings; Bhima uproots a tree as a weapon and Arjuna
    stands ready with his bow. Krishna recognizes the disguised Pandavas and tells
    Valadeva that Pritha and the sons of Pandu survived the house of lac conflagration.
  language: English
  quote_policy: summarized
