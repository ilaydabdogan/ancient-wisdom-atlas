canonical_text:
  quote: ''
  summary: 'Kanika gives Dhritarashtra advice on prudent royal policy: maintain dependence,
    seek allies, conceal motives, face danger with courage, plan ahead, consider time
    and place, do not despise weak enemies, defer promises to foes, and destroy enemies
    like a concealed sharp razor. He specifically warns that the Pandavas are stronger
    than Dhritarashtra''s sons and urges protective policy. Kanika then departs, and
    Dhritarashtra becomes pensive and melancholy.'
  language: English
  quote_policy: summarized
