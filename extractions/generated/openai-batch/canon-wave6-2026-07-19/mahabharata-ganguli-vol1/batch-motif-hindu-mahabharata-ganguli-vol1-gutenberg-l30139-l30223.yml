  summary: Arjuna praises Krishna by recounting his ascetic practices, sacrifices,
    cosmic identities, demon-slaying deeds, future submergence of Dwarka, and role
    in creation and dissolution. Krishna answers by declaring his inseparable identity
    with Arjuna as Narayana with Nara.
