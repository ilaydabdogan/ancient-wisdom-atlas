canonical_text:
  quote: ''
  summary: A celestial Rishi appears in the Kaurava assembly and foretells that, in
    the fourteenth year, the Kauravas will be destroyed because of Duryodhana's fault
    by the might of Bhima and Arjuna. Duryodhana, Karna, and Sakuni seek Drona as
    refuge. Drona says the Pandavas are of celestial origin, will go into exile after
    the dice defeat, and will later return in anger. He recalls that Drupada performed
    a sacrifice to obtain a son to kill him, producing Dhrishtadyumna and Krishna
    from the sacrificial fire/platform, and he warns Duryodhana of coming calamity.
    Dhritarashtra then asks Vidura to bring back the Pandavas or, if they will not
    return, to let them depart honorably with arms and goods.
  language: English
  quote_policy: summarized
