canonical_text:
  quote: ''
  summary: 'Vaisampayana narrates the Pandavas'' travel through sacred mountain and
    forest regions: after leaving a happy mountain home, they behold Kailasa, visit
    Vrishaparba''s hermitage and places associated with Narayana and Kuvera, return
    through Himalayan regions to Suvahu, dwell and hunt for a year in Visakhayupa
    forest, survive Bhima''s seizure by a huge snake through Yudhishthira''s intervention,
    and then settle happily near the Saraswati at Dwaitabana among ascetics and sacred
    trees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traveling heroes leave a happy mountain home; happiness leaves them, but
    they become delighted when they see Kailasa, described as Kuvera's favorite mountain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their route includes elevations, defiles, lion dens, craggy causeways, waterfalls,
    lowlands, forests, rivers, lakes, caves, and mountain caverns.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: They cross Kailasa, reach the hermitage of Vrishaparba, are received by the
    king, stay one night in a sacred abode, then proceed toward the jujube tree called
    Visala and the place of Narayana.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: At Kuvera's favorite lake, which is frequented by gods and Siddhas, the sons
    of Pandu renounce grief and live without sorrow for a time at Badari.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: They return by the same track toward Suvahu's realm, cross Himalayan and other
    regions, meet Suvahu, rejoin charioteers and attendants, and dismiss Ghatotkacha
    with his followers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near the Yamuna, they find the forest of Visakhayupa, described as like Chitraratha
    and inhabited by wild boars, deer, and birds; they make it their home and hunt
    there for one year.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a mountain cavern, Vrikodara, also called Bhima in the passage, encounters
    a huge, hungry, fierce snake and is gripped by its folds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yudhishthira becomes Vrikodara/Bhima's protector and extricates him from the
    snake's grip.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the twelfth year of their forest sojourn, the Kuru scions proceed toward
    the desert border, the Saraswati, and Dwaitabana; local ascetic dwellers advance
    to meet them with grass-mats and water-vessels.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Named trees grow on the banks of the Saraswati, and the area is described
