canonical_text:
  quote: ''
  summary: Vasishtha, grieving the loss of his children, tries to destroy himself
    in rivers but is cast back to land. He later hears that Adrisyanti bears Saktri's
    child, who has remained in her womb for twelve years and recites the Vedas. Rejoicing
    in the survival of his line, Vasishtha refrains from self-destruction. He then
    encounters King Kalmashapada possessed by a Rakshasa, restrains and purifies him
    with sacred sound and sanctified water, and the restored king asks him for a son
    to perpetuate the Ikshvaku line.
  language: English
  quote_policy: summarized
