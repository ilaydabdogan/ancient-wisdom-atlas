canonical_text:
  quote: ''
  summary: Saunaka asks about the etymology of the name Jaratkaru and then asks how
    Astika was born. Sauti explains the name as connected with wasting away a huge
    body through ascetic penance and begins the account of Vasuki's wish to give his
    sister to the ascetic Jaratkaru. The narrative turns to King Parikshit, who wounds
    a deer while hunting, follows it deep into the forest, encounters a silent Muni,
    and angrily places a dead snake on the Muni's shoulder. The Muni does not protest
    or curse him. The Muni's son Sringin is later told of the insult by Krisa and
    becomes enraged.
  language: English
  quote_policy: summarized
