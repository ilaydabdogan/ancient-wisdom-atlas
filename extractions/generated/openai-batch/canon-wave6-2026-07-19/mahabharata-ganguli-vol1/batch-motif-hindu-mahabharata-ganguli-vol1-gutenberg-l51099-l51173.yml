canonical_text:
  quote: ''
  summary: Duryodhana orders his forces to punish the Gandharvas who oppose him. The
    Kuru soldiers enter the forest despite warnings. Chitrasena, king of the Gandharvas,
    commands his followers to punish the Kuru forces. Karna resists the Gandharvas
    when many Kuru soldiers flee, and Duryodhana and other Kuru princes return to
    battle. Chitrasena then uses weapons of illusion, causing panic and disorientation
    in the Kuru army. Gandharvas surround Karna, destroy his chariot, and Karna escapes
    onto Vikarna's chariot.
  language: English
  quote_policy: summarized
