canonical_text:
  quote: ''
  summary: Krishna and Arjuna block the escape of Khandava forest creatures while
    Agni burns the forest. Animals die in the fire and boiling waters; birds trying
    to fly away are shot down by Arjuna. The noise and flames alarm the celestials,
    who ask Indra whether the destruction of the world has begun. Indra sends clouds
    and rain to protect Khandava, but the heat dries the showers before they reach
    the fire, and fire and rain contend amid smoke and lightning.
  language: English
  quote_policy: summarized
