canonical_text:
  quote: ''
  summary: Damayanti is recognized by a mole after Sunanda washes away dust from it.
    Her maternal aunt identifies her as her sister's daughter and permits her to return
    to Vidarbha, where her relatives and children receive her. Damayanti asks her
    mother and father to seek Nala. King Bhima sends Brahmanas in all directions,
    and Damayanti gives them a message intended to identify Nala without revealing
    that she sent it.
  language: English
  quote_policy: summarized
