  summary: Markandeya narrates the final battle in which Ravana advances against Rama,
    uses magical illusion to create armies and doubles, is opposed by Rama and the
    monkey allies, and is finally killed when Rama rides Indra's chariot and releases
    a Brahma weapon that burns Ravana and consumes his body completely.
  language: English
