canonical_text:
  quote: ''
  summary: Yudhishthira bathes at a tirtha, offers water oblations, and gains brighter
    effulgence and invisibility to foes. He asks Lomasa why Rama of Bhrigu’s line
    lost and regained energy. Lomasa narrates that Vishnu was born as Rama, son of
    Dasaratha, to destroy Ravana. Bhargava Rama comes to Ayodhya with a celestial
    bow to test Dasaratha’s son. Dasaratha’s Rama strings the bow and is given a celestial
    arrow; he then reveals his native divine form, displaying many cosmic beings and
    sacred entities within his body. Vishnu shoots the shaft, causing cosmic disturbances
    and confounding Bhargava Rama, who bows and later dwells on Mount Mahendra in
    shame. The Pitris instruct him to bathe in the Vadhusara river and its tirthas,
    including Diptoda, where Bhrigu had practiced austerities; by doing so he regains
    his lost energy.
  language: English
  quote_policy: summarized
