  summary: Saunaka asks Sauti to recount Janamejaya’s inquiry into his father Parikshit’s
    death. Janamejaya asks his ministers for the details. The ministers praise Parikshit
    as a virtuous, impartial ruler, explain his lineage and Janamejaya’s succession,
    and then recount how Parikshit, while hunting a deer in the forest, encountered
    a silent Rishi, grew angry at receiving no answer, and placed a dead snake on
    the Rishi’s shoulders. The Rishi remains silent and without anger.
