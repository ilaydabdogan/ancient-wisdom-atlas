canonical_text:
  quote: ''
  summary: Markandeya tells the sons of Pandu and accompanying Rishis how the royal
    sage Indradyumna, after falling from heaven, sought someone old enough to remember
    him. An owl and a crane do not recognize him, but the tortoise Akupara recalls
    his sacrifices and gifts of cows. A celestial car and aerial voice then summon
    Indradyumna back to the heavenly place he deserves. Markandeya adds a comparison
    to Krishna restoring the royal sage Nriga from hell to heaven.
  language: English
  quote_policy: summarized
