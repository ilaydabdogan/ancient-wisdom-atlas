canonical_text:
  quote: ''
  summary: Devasena identifies herself as a daughter of Prajapati and tells Indra
    that her sister Daityasena was carried away by the Asura Kesin, while Indra rescued
    her. She asks Indra to choose an invincible husband for her, specifying that he
    must be able to conquer many classes of beings and subdue the worlds with Indra.
    Indra observes a fearful conjunction of Sun, Moon, and Agni with ominous signs,
    and reasons that a son born from Soma and Agni could be her husband. He takes
    Devasena to Brahma, who confirms that the issue of that union will be mighty,
    become her husband, and lead Indra's forces jointly. The gods then attend sacrifices
    of celestial Rishis; Agni carries offerings to heaven and, on returning, sees
    the sleeping wives of the Rishis, desires them, restrains himself, and resolves
    to become their household fire so he may look at them daily.
  language: English
  quote_policy: summarized
