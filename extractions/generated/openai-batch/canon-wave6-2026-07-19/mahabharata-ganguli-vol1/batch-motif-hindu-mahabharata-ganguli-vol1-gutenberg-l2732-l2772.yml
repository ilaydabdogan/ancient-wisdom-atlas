canonical_text:
  quote: ''
  summary: 'Dundubha recounts how, while his ascetic friend Khagama was performing
    the Agni-hotra, he frightened him with a mock snake made of grass and was cursed
    to become a venomless serpent. Khagama later set a condition for release: Dundubha
    would be freed when Ruru, son of Pramati, appeared. Dundubha leaves his snake-body,
    regains his original form, and instructs Ruru on sparing life, Brahmana duties,
    and the distinct duties of Kshatriyas. He then points ahead to the destruction
    of snakes at Janamejaya''s sacrifice and their deliverance by Astika.'
  language: English
  quote_policy: summarized
