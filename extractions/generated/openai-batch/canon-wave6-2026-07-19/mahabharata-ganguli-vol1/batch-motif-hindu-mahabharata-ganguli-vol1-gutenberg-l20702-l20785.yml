canonical_text:
  quote: ''
  summary: Kesava/Krishna comes to Indraprastha with Rama and many Vrishni, Andhaka,
    Bhoja, and Yadava warriors, bringing nuptial gifts. Yudhishthira and the city
    receive the visitors with ceremony and honors. Krishna and Rama give abundant
    wealth, animals, attendants, gold, and elephants as nuptial presents and dower
    connected with Subhadra. The allied heroes feast and make merry; most return to
    Dwaravati while Vasudeva remains with Arjuna. Vasudeva and Arjuna hunt near the
    Yamuna. Subhadra gives birth to an illustrious son, compared to Puloma's daughter
    bringing forth Jayanta.
  language: English
  quote_policy: summarized
