canonical_text:
  quote: ''
  summary: Bhima encounters Hanuman in monkey form blocking his way. Bhima identifies
    his lineage and kinship with the wind-god, demands passage, and boasts of Hanuman’s
    ocean-leap for Rama’s queen. Hanuman asks Bhima to move his tail; Bhima cannot
    move it, becomes humbled, apologizes, and asks Hanuman’s identity. Hanuman reveals
    his wind-god parentage and recounts connections to Sugriva, Rama, Ravana, and
    Maricha’s deer-form deception in the abduction of Rama’s queen.
  language: English
  quote_policy: summarized
