canonical_text:
  quote: ''
  summary: Janamejaya asks what the sons of Pandu and the Vrishnis did and said at
    Prabhasa. Vaisampayana narrates that the Vrishnis reached the sacred sea-side
    landing-place and waited upon the sons of Pandu. Valarama addresses Krishna and
    laments that righteous Yudhishthira and the other sons of Pandu live in forest
    hardship while Duryodhana prospers, condemns the elders and aged king involved
    in their banishment, invokes departed forefathers and a strange cremation-ground
    image, recalls the martial achievements of Bhima, Sahadeva, and Nakula, mentions
    a royal woman born from beneath the sacrificial altar, and anticipates future
    vengeance by Bhima.
  language: English
  quote_policy: summarized
