canonical_text:
  quote: ''
  summary: The passage praises the Bharata/Introduction as purifying, protective,
    truthful, nectarean, and supreme among histories. It states that recitation, hearing,
    and knowledge of the work free a person from sin, benefit ancestral offerings
    at a Sradha, grant long life, renown, and ascent to heaven, and make the Bharata
    superior in weight and import to the four Vedas. It closes with a maxim that asceticism,
    study, Vedic ordinances, and wealth acquired by exertion are harmless unless abused.
  language: English
  quote_policy: summarized
