  text: A man of faith devoted to piety and virtue is said to be freed from sin by
    reading the section.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A believer who constantly hears the Introduction recited from the beginning
    is said not to fall into difficulties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Repeating any part of the Introduction at the two twilights is said to free
    a person during that act from sins contracted during the day or night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The section is called the body of the Bharata, truth, and nectar, and is praised
    as preeminent among histories through a series of comparisons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: If even a single foot of the work is recited to Brahmanas during a Sradha,
    the food and drink offerings to the manes of ancestors are said to become inexhaustible.
