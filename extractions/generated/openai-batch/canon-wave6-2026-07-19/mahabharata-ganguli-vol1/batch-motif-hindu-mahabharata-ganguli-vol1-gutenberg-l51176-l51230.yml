canonical_text:
  quote: ''
  summary: After Karna is routed and the Kuru army flees, Duryodhana refuses to run
    and attacks the Gandharvas. They destroy his chariot, kill his charioteer and
    horses, and Chitrasena seizes him. Other Kuru men and the royal household women
    are also taken captive. Duryodhana’s followers ask the nearby Pandavas to rescue
    the captives. Bhima answers sarcastically that the Gandharvas have done the Pandavas’
    work and frames the event as a consequence of Duryodhana’s wrongdoing; Yudhishthira
    stops him, saying it is not a time for cruel words.
  language: English
  quote_policy: summarized
