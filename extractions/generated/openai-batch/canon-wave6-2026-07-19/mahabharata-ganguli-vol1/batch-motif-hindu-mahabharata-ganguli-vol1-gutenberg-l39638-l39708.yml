canonical_text:
  quote: ''
  summary: Yudhishthira visits and honors ascetics, asks Akritavrana when Parasurama
    will appear, and requests the story of how Rama vanquished the military caste.
    Akritavrana says Rama will be seen on the fourteenth lunar day and begins recounting
    the story of Rama, the Haihaya ruler Arjuna with a thousand arms and a golden
    celestial car, Arjuna’s oppression of beings, the appeal to Vishnu, and the beginning
    of the marriage episode involving Gadhi’s daughter and Richika.
  language: English
  quote_policy: summarized
