canonical_text:
  quote: ''
  summary: Vyasa grants Drupada celestial sight, allowing him to see the Pandavas
    in radiant divine forms and to recognize Draupadi as a fitting wife for them.
    Vyasa then recounts that in a former life a rishi's daughter won a boon from Sankara
    after ascetic penance; because she asked five times for a virtuous husband, she
    was destined to have five husbands in a future birth. Vyasa identifies Drupada's
    daughter Krishna as that maiden and as celestial Sri, born through Drupada's sacrifice
    for the sake of the Pandavas.
  language: English
  quote_policy: summarized
