canonical_text:
  quote: ''
  summary: Yayati, fallen from celestial regions after the diminution of his religious
    merit, explains his identity and moral views to Ashtaka. He teaches humility,
    the danger of vanity, the supremacy of Destiny, equanimity toward pleasure and
    pain, and union with the Supreme Soul after release from acts. At Ashtaka's request,
    he recounts his post-earthly residence in successive heavenly regions, including
    Indra's abode, the Creator's region, Vishnu's region, and Nandana. A grim celestial
    messenger announces his ruin, celestial voices lament his fall, and he is guided
    toward Ashtaka's sacrificial region by smoke and the scent of clarified butter
    poured on fire.
  language: English
  quote_policy: summarized
