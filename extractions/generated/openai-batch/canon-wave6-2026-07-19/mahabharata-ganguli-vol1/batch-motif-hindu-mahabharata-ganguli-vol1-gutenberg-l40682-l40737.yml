canonical_text:
  quote: ''
  summary: Somaka seeks many sons and accepts the priest's prescription. The priest
    sacrifices Jantu, despite the mothers' grief, and offers his fat. The mothers
    become pregnant and later bear a hundred sons; Jantu is reborn as eldest to his
    former mother with a golden mark. After death, Somaka sees the priest suffering
    in hell for officiating in the sacrifice. Somaka asks to share the punishment
    rather than go to blessed regions without the priest. Dharmaraja allows this;
    after the sin is worked off, both are freed and share blessings. Lomasa identifies
    the hermitage and prescribes six nights of self-controlled residence there.
  language: English
  quote_policy: summarized
