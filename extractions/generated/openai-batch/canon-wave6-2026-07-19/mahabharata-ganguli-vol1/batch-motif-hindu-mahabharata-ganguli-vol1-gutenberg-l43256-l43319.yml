canonical_text:
  quote: There is no access thither for mortals.
  summary: Yudhishthira and his companions approach and honor the sage Arshtishena,
    who receives them and questions Yudhishthira about truth, virtue, filial duty,
    respect for elders, and ancestral customs. Yudhishthira affirms his observance
    of these duties. Arshtishena describes the mountain summits as frequented by aerial
    sages, celestial and semi-divine beings, music, Vaisravana, and Tumburu, but warns
    the Pandavas not to go beyond the permitted place because the summit and celestial
    path are inaccessible to mortals and guarded by Rakshasas. He tells them to remain
    there until they meet Arjuna and foretells Yudhishthira's future rule over the
    earth.
  language: English
  quote_policy: quoted
