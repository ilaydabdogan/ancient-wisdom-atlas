canonical_text:
  quote: ''
  summary: In an enraged assembly of kings, Yudhishthira asks Bhishma how to prevent
    obstruction of his sacrifice and harm to his subjects. Bhishma reassures him,
    compares the kings to dogs barking before a sleeping lion, identifies Achyuta
    as the sleeping lion, and says Sisupala and the kings are being drawn toward Yama
    through the agency of the universal soul. He states that Vishnu seeks to take
    back the energy present in Sisupala and calls Madhava the progenitor and destroyer
    of beings. Sisupala then addresses Bhishma harshly.
  language: English
