canonical_text:
  quote: ''
  summary: A Rishi explains that he dances because vegetable juice flows from a wound
    in his hand. Mahadeva shows a greater marvel by wounding himself and producing
    snow-white ashes. The Rishi becomes ashamed, falls at the god's feet, praises
    Rudra/Mahadeva as cosmic refuge, creator, and end-time devourer, and asks that
    his asceticism not diminish. Mahadeva grants that it increase a thousandfold,
    says he will dwell in the asylum, promises benefits to those who bathe in Saptasaraswata
    and worship him, and disappears.
  language: English
  quote_policy: summarized
