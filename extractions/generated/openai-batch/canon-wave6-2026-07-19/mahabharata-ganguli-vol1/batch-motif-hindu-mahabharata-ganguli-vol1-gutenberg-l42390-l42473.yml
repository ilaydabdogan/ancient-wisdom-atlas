canonical_text:
  quote: ''
  summary: Bhimasena bows to Hanuman as his elder brother and asks to see Hanuman's
    former ocean-crossing form. Hanuman refuses, explaining that forms and beings
    conform to Time and to the changing yugas. At Bhima's request, Hanuman describes
    the Krita, Treta, Dwapara, and Kali ages as a sequence of diminishing virtue,
    changing religious practice, divided knowledge, disease, calamity, and degeneration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaisampayana introduces Bhimasena bowing cheerfully and affectionately to
    Hanuman, whom Bhima calls his elder brother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhimasena asks to behold Hanuman's incomparable former form, associated with
    bounding over the sea described as an abode of sharks and crocodiles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hanuman replies that neither Bhima nor anyone else can behold that form, because
    conditions differ between ages and diminution is occurring in the present age.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hanuman states that ground, rivers, plants, rocks, siddhas, gods, and celestial
    sages conform to Time in the different yugas, and says that Time is irresistible.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bhimasena asks Hanuman to tell him about the duration, customs, virtue, pleasure,
    profit, acts, energy, life, and death in the different yugas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hanuman describes Krita Yuga as an age of one eternal religion, religious
    perfection, no deterioration of virtue, effortless obtaining of necessities by
    thought, absence of disease and vices, Brahma as refuge, Narayana with a white
    hue, one mantra, one Veda, and emancipation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hanuman describes Treta Yuga as an age in which sacrifices and rites are introduced,
    virtue decreases by a quarter, Narayana assumes a red colour, and people practice
    truth, religion, asceticism, acts, and gifts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hanuman describes Dwapara Yuga as an age in which religion decreases by half,
    Narayana wears a yellow hue, the Veda is divided, knowledge is fragmented, acts
    multiply, truth declines, and disease, lust, calamity, penance, and desire for
    heaven appear.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hanuman describes Kali Yuga as an iron age in which only a quarter of virtue
    remains, Narayana wears a black hue, Vedas and observances fall into disuse, and
    disease, anger, calamities, anguish, scarcity, and degeneration prevail.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Across the yugas as described by Hanuman, virtue dwindles and creatures degenerate
    as the ages wane.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
