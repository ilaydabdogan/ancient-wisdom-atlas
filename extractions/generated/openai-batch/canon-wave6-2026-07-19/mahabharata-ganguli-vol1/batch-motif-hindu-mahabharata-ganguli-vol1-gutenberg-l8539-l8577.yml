canonical_text:
  quote: I tell thee truly that it is I who pour rain for the good of creatures
  summary: Ghurnika reports to Kavya that Devayani has been ill-used in the forest
    by Sarmishtha. Kavya finds and consoles Devayani, who recounts Sarmishtha's insults
    about her father's social status. Sukra replies that he is not a hired adorer
    but one adored by all, invokes Brahma as his strength, claims lordship over things
    on Earth and in Heaven, and says he pours rain and nourishes plants. The narrator
    closes by saying the father tried to pacify his grieving, angry daughter.
  language: English
  quote_policy: quoted
