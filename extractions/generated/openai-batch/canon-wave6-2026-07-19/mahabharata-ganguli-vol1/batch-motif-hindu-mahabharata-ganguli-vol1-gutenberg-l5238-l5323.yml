canonical_text:
  quote: "“Takshaka shall burn thee with his poison!”"
  summary: Ministers recount that Parikshit insulted an ascetic by placing a dead
    snake on him. The ascetic’s son Sringin cursed Parikshit to be killed by Takshaka
    within seven nights. Kasyapa attempted to go cure the king, but Takshaka demonstrated
    his poison, bribed Kasyapa to turn back, and later killed Parikshit in disguise.
    Janamejaya then questioned the ministers and considered punishment against the
    snake race.
  language: English
  quote_policy: quoted
