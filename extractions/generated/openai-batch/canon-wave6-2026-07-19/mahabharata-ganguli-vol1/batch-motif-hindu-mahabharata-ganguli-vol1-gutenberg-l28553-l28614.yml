canonical_text:
  quote: ''
  summary: Yudhishthira bids farewell to the Bharatas and says he will return. The
    assembly remains silent from shame but inwardly wishes him well. Vidura advises
    that Pritha should remain in his house rather than go to the woods, and the Pandavas
    accept his authority. Vidura counsels Yudhishthira, reminds him of past and future
    spiritual instructors, urges him to cultivate virtues associated with gods and
    natural powers, blesses his safe and successful return, and Yudhishthira bows
    to Bhishma and Drona before leaving.
  language: English
  quote_policy: summarized
