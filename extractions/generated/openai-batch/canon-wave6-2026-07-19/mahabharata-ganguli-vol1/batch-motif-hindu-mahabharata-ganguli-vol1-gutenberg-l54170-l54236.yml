canonical_text:
  quote: '"I am the wife of another, ever devoted to my husband, and, therefore, incapable
    of being possessed by thee!"'
  summary: Markandeya narrates Sita grieving in the Asoka woods while surrounded by
    Rakshasa women. Ravana approaches in rich adornment, makes a desire-driven proposal,
    boasts of lineage, rank, wealth, and beings under his command, and asks Sita to
    accept him as lord and queen. Sita rejects him, declares fidelity to her husband,
    challenges the morality of violence toward an unwilling woman, and urges Ravana
    to observe virtue. Ravana says he will not approach her unwillingly, disparages
    Rama, becomes invisible, and leaves. Sita remains grieving, surrounded by Rakshasa
    women and treated tenderly by Trijata.
  language: English
  quote_policy: quoted
