  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: The army marches through healthy tracts and valleys with fruits, roots, water,
    honey, and meat, and finally reaches the briny sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rama asks Sugriva what plan is suitable for crossing the difficult ocean with
    the large army.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some monkeys claim they can cross the sea, while others propose boats or rafts;
    Rama rejects these plans because the sea is a hundred yojanas wide, boats are
    insufficient, merchants would be obstructed, and the army would be vulnerable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Rama says he will pray to the Ocean while fasting and lying on the shore,
    and will chastise the Ocean with blazing, unfailing weapons if the Ocean does
    not appear.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Rama and Lakshmana touch water and lie down on a bed of kusa grass at the
    seashore.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The divine Ocean appears to Rama in a vision, surrounded by aquatic animals
    and mines of gems, and speaks sweetly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Ocean states that he too has sprung from the race of Ikshwaku and is therefore
    Rama's relative.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Rama asks the Ocean to grant a way for his troops so that he may slay the
