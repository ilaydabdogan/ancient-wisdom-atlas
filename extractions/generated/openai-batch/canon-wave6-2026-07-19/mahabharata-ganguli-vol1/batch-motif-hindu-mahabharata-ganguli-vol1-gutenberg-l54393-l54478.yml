canonical_text:
  quote: ''
  summary: Markandeya narrates the assembling of monkey and bear allies for Rama,
    their auspicious departure under Sugriva, and their march to the ocean. At the
    shore, Rama rejects proposals to cross by individual feats, boats, or rafts, resolves
    to petition the Ocean while fasting on kusa grass, threatens to dry the Ocean
    with celestial weapons if refused, and receives a visionary response from the
    personified Ocean, who names Nala as a skilled mechanic and son of Tashtri.
  language: English
  quote_policy: summarized
