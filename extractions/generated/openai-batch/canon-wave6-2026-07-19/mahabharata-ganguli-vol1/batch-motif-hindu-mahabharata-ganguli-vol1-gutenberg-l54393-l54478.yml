- id: obs:5
  text: Rama, with Sugriva beside him, sets out at an auspicious moment under a lucky
    constellation with the host ordered for battle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hanuman is placed in the van of the host, and Lakshmana protects the rear.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The host is armed with stones and Sala and Tala trees, and is protected by
