  quote: '"Know me for thy friend."'
  summary: Drona comes before King Drupada and claims friendship. Drupada rejects
    the claim, arguing that friendship cannot endure between people of unequal status,
    wealth, birth, learning, or martial rank. Drona becomes angry, resolves on a course
    of action, and leaves the Panchala capital for the Kuru capital.
