canonical_text:
  quote: ''
  summary: 'Lomasa identifies sacred rivers, mountains, bathing places, and hermitages,
    including places where Indra was freed from sin and where Aditi performed a rite
    for sons. He urges Yudhishthira to touch or bathe in holy waters. Yudhishthira
    asks how Yavakri gained Vedic knowledge and perished. Lomasa begins the story:
    Bharadwaja and Raivya were friends; Raivya and his sons were respected for Vedic
    learning, while Bharadwaja was slighted. Yavakri, aggrieved, performs severe austerities
    and seeks Vedic knowledge without long study under teachers. Indra warns him that
    this is not the proper way, but Yavakri resumes austerities and threatens self-offering
    into fire if his desire is not granted.'
  language: English
  quote_policy: summarized
