canonical_text:
  quote: ''
  summary: Brahmanas flee after being advised by their ascetic preceptor. Bhimasena
    searches for them and reports their flight to Yudhishthira. The Pandavas wait
    anxiously, fearing deception by the Rishis at night. Krishna appears, saying Draupadi
    implored him to come because of the danger from Durvasa; he reassures them that
    Durvasa has fled and asks leave to return home. The Pandavas and Draupadi are
    relieved and compare Krishna’s aid to a boat bringing drowning persons to shore.
    Krishna returns to his capital, and the Pandavas continue wandering in the forest
    with Draupadi; the narrator states that the sons of Dhritarashtra’s schemes were
    frustrated.
  language: English
  quote_policy: summarized
