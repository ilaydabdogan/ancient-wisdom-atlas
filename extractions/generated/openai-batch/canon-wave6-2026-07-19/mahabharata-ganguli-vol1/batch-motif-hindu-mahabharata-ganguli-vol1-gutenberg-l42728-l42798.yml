canonical_text:
  quote: ''
  summary: Bhima tells Rakshasas that he has come to obtain Saugandhika lotuses for
    Panchali/Krishna. The Rakshasas warn that the lake is Kuvera's cherished sporting
    place and requires permission. Bhima refuses to ask permission, enters the lake,
    defeats the Krodhavasas who oppose him, gathers the lotuses, and later receives
    Kuvera's permission through the returning Rakshasas.
  language: English
