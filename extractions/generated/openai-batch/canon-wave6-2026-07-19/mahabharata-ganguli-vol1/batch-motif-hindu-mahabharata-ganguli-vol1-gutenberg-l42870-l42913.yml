canonical_text:
  quote: ''
  summary: Yudhishthira recounts a pilgrimage through sacred tirthas, rivers, mountains,
    lakes, hermitages, and ritual acts performed with Brahmanas. He asks Bhima how
    they may enter the sacred abode of Vaisravana/Kuvera. An aerial voice says the
    spot is inaccessible by that way and directs a route through named hermitages.
    A fragrant cool breeze and shower of blossoms follow the voice. Dhaumya advises
    that the voice should not be contradicted, and Yudhishthira obeys by returning
    to the hermitage of Nara and Narayana with his companions.
  language: English
  quote_policy: summarized
