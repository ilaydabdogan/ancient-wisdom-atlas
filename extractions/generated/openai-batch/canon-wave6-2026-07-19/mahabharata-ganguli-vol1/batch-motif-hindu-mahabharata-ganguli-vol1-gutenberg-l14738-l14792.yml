canonical_text:
  quote: ''
  summary: Duryodhana, with Karna, Sakuni, and Duhsasana, urges Dhritarashtra to send
    the Pandavas to Varanavata by contrivance. Dhritarashtra objects that Pandu and
    Yudhishthira are virtuous, popular, and tied to the ancestral kingdom, and that
    respected elders would not sanction such exile. Duryodhana argues that wealth,
    state control, and expected alliances can neutralize opposition, and describes
    his grief as a consuming fire and piercing dart.
  language: English
