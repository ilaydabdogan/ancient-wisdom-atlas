canonical_text:
  quote: for the sonless there is no admittance into heaven
  summary: Pandu practices asceticism and gains ascetic merit. On a new moon, Rishis
    prepare to go to Brahman's abode. Pandu wishes to accompany them northward with
    his two wives, but the Rishis warn that the mountain regions ahead are inaccessible
    to ordinary mortals and too harsh for the princesses. Pandu laments being sonless,
    explains ritual debts owed to ancestors, gods, Rishis, and other people, and asks
    whether children may be begotten upon his wives as he himself was begotten by
    an eminent Rishi. The Rishis answer that sinless, fortunate, godlike progeny is
    destined for him and urge him to act.
  language: English
  quote_policy: quoted
