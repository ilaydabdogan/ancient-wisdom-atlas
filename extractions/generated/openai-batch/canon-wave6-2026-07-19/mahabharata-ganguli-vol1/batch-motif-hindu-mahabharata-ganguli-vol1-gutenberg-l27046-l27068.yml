  quote: the friendly match at dice then commenced.
  summary: In a royal assembly, kings led by Dhritarashtra take their seats while
    Bhishma, Drona, Kripa, and Vidura sit behind with cheerless hearts. The mansion
    is compared to heaven filled with celestials. A friendly dice match begins; Yudhishthira
    stakes pearl-and-gold wealth associated with the old churning of the ocean, Duryodhana
    replies concerning his own wealth, and Sakuni casts the dice and declares that
    he has won.
