canonical_text:
  quote: ''
  summary: Sringin tells his father Samika that his curse cannot fail. Samika acknowledges
    the power of truthful speech but counsels his son against anger, saying wrath
    destroys ascetic merit and forgiveness brings blessed worlds. Samika sends his
    disciple Gaurmukha to warn King Parikshit that Takshaka will cause his death within
    seven nights because of the king's disrespectful act toward Samika. Parikshit
    repents more for insulting the Rishi than for his impending death, then has a
    guarded mansion erected on one solitary column with physicians, medicines, and
    Brahmanas skilled in mantras. On the seventh day Kasyapa goes to cure the king
    after the snake-bite, but Takshaka, in the form of an old Brahmana, encounters
    him on the road.
  language: English
  quote_policy: summarized
