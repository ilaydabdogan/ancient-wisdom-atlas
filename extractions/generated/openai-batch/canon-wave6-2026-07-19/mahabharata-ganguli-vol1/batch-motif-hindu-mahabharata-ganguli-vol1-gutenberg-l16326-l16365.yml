canonical_text:
  quote: ''
  summary: After the slaying of Vaka, the Pandavas remain at Ekachakra in a Brahmana
    host's dwelling and study the Vedas. A vow-observing Brahmana guest arrives, is
    received with hospitality, and is asked by the Pandavas and Kunti to recount his
    experiences. He tells of countries, shrines, rivers, kings, cities, the self-choice
    of Yajnasena's daughter, Panchala princes, and extraordinary births connected
    with Drupada's sacrifice. The Pandavas ask for details about Dhrishtadyumna's
    birth from sacrificial fire, Draupadi/Krishna's birth from the center of the sacrificial
    platform, Dhrishtadyumna's weapons training under Drona, and the broken friendship
    between Drona and Drupada.
  language: English
  quote_policy: summarized
