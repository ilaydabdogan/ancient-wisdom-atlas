canonical_text:
  quote: ''
  summary: Lomasa recounts that Chyavana, son of Bhrigu, practices long austerities
    beside a lake until ants and creepers cover him like an anthill. King Saryati
    visits the lake with his wives, troops, and daughter Sukanya. Sukanya sees a bright
    substance in the anthill and pierces it with thorns, injuring Chyavana's eyes.
    Angered, Chyavana afflicts Saryati's forces by obstructing their calls of nature.
    After Sukanya confesses and Saryati asks forgiveness, Chyavana agrees to forgive
    only if Sukanya is given to him as bride. Saryati gives her to Chyavana, who is
    pleased, and Sukanya tends her ascetic husband, guests, and the sacred fire.
  language: English
  quote_policy: summarized
