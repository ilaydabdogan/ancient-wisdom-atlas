canonical_text:
  quote: ''
  summary: In the pilgrimage narrative, Yudhishthira and the Pandavas travel from
    Kausiki through sacred waters, reach the Ganga-sea confluence, and go toward Kalinga
    and the Vaitarani. Lomasa describes the Vaitarani as a holy site linked with divine
    rites, Rudra's claim to a sacrificial beast, and a visible path to the gods for
    those who bathe there while reciting the story. The Pandavas and Draupadi bathe
    and make libations. Yudhishthira experiences expanded perception, and Lomasa explains
    a distant divine forest where the Self-existent One gave Earth to Kasyapa; Earth
    objected, descended, was appeased, and rose from the waters as a sacred altar.
    Lomasa instructs Yudhishthira in an evil-averting rite and a truth formula before
    entering the sea, after which Yudhishthira proceeds to Mahendra hill.
  language: English
  quote_policy: summarized
