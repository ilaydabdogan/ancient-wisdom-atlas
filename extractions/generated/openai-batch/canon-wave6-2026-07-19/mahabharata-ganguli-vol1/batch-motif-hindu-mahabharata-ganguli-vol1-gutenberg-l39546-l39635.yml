  - ev:1
- id: obs:2
  text: The Vaitarani in Kalinga is described as a holy river whose northern bank
    is inhabited by saints, suited to rites, beautified by a hill, and compared in
    holiness to a path to the gods.
  category: setting
  evidence_refs:
