canonical_text:
  quote: ''
  summary: After Hara disappears before Arjuna, Arjuna reflects that he has seen and
    touched the boon-giving god. Varuna, Kuvera, Yama, Sakra, and their retinues arrive
    at the mountain where Arjuna is practicing austerities. Yama grants Arjuna spiritual
    vision, identifies him as the former Rishi Nara born among men, prophesies his
    victories, and gives him an irresistible mace with rites and mantras. Varuna then
    offers Arjuna his noose-weapons and their mysteries of use.
  language: English
  quote_policy: summarized
