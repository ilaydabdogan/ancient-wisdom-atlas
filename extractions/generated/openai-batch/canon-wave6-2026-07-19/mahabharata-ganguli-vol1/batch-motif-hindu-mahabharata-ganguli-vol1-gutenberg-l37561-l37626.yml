  text: Dhaumya tells Yudhishthira that hearing of sacred places gives merit, visiting
    them gives a hundred times greater merit, and the Pandavas will be relieved from
    grief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eastern region is described as containing Naimisha, sacred tirthas of
    the gods, the Gomati, the sacrificial region of the gods, the sacrificial stake
    of Surya, Gaya, and Brahmasara lake.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Gaya, acts such as visiting, horse-sacrifice, or giving a nila bull are
    said to deliver ten generations of one's lineage, and food offered at the Eternal
    banian to the Pitris is said to become eternal.
  category: action
  evidence_refs:
