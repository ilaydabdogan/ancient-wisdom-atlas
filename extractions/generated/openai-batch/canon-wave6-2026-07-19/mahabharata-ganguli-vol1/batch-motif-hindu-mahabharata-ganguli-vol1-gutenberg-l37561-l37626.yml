canonical_text:
  quote: ''
  summary: Dhaumya comforts the anxious Pandavas by listing sacred eastern tirthas,
    rivers, asylums, forests, and mountains. He says that hearing of these places
    gives merit and visiting them gives greater merit and relief from grief. The catalogue
    includes Gaya, Prayaga, sacred rivers and confluences, sites of sacrifice, ascetic
    achievements, ancestral offerings, and places associated with figures such as
    Viswamitra, Bhagiratha, Agastya, Rama, Matanga, and Nala.
  language: English
  quote_policy: summarized
