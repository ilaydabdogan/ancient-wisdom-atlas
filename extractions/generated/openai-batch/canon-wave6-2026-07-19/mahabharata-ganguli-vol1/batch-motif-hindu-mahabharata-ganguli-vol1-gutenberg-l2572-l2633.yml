canonical_text:
  quote: ''
  summary: Sauti introduces Ruru's genealogy, then recounts Pramadvara's birth from
    Menaka after her intimacy with Viswavasu, her abandonment by a river near Sthulakesa's
    hermitage, her rescue and upbringing by Sthulakesa, Ruru's love and betrothal
    to her, and her death from a serpent bite shortly before the wedding while ascetics,
    Brahmanas, companions, and Ruru mourn.
  language: English
  quote_policy: summarized
