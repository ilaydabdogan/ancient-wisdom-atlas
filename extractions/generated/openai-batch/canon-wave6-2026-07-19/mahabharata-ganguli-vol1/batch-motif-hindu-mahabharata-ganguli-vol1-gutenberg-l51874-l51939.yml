canonical_text:
  quote: ''
  summary: Janamejaya asks what the Kaurava side did while the Pandavas lived in the
    forest. Vaisampayana recounts that after Duryodhana returned to Hastinapura, Bhishma
    rebuked him for his failed expedition and urged peace with the Pandavas. Duryodhana
    laughed and left; Karna then denounced Bhishma’s praise of the Pandavas, vowed
    to conquer the earth for Duryodhana, and departed after auspicious rites and preparations.
  language: English
  quote_policy: summarized
