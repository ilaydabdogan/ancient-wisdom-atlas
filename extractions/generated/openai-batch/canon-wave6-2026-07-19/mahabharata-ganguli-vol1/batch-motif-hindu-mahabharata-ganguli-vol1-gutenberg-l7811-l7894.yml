canonical_text:
  quote: ''
  summary: The king denies remembering any lawful, amorous, or material connection
    with the woman. The woman, distressed and angered, suppresses her ascetic wrath
    and rebukes him for falsehood, invoking the heart, Narayana, cosmic witnesses,
    and Yama as observers of human acts. She asserts her status as wife, threatens
    that the king's head will burst if he refuses her plea, and delivers a discourse
    on the religious, social, and afterlife value of wife, marriage, son, and paternal
    recognition. She asks the king to support and embrace the child who has approached
    him.
  language: English
  quote_policy: summarized
