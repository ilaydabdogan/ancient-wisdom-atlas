canonical_text:
  quote: ''
  summary: Yudhishthira asks Markandeya when and under what conditions charity should
    be practiced to gain Indra's regions. Markandeya answers by listing futile lives
    and futile gifts, identifying improper recipients and wrongly earned wealth, and
    stating that gifts to Brahmanas can lead toward heaven. Yudhishthira then asks
    how Brahmanas who accept gifts from all four orders save both others and themselves.
  language: English
