canonical_text:
  quote: ''
  summary: Utanka, angered by Takshaka, goes to Hastinapura and urges King Janamejaya
    to avenge his father's death by ordering a snake-sacrifice. He says Takshaka killed
    the king's father, obstructed Kasyapa's attempt to help him, and also once obstructed
    Utanka's own business. Janamejaya becomes enraged and sorrowful and asks his ministers
    for details of his father's death.
  language: English
  quote_policy: summarized
