canonical_text:
  quote: His vital fluid, however, having fallen upon a clump of heath, was divided
    into two parts, whence sprang two children that were twins.
  summary: Janamejaya asks about Kripa's birth and weapons. Vaisampayana narrates
    that Saradwat, son of Gautama, was born with arrows and devoted himself to the
    science of weapons through austerities. Indra, fearing him, sends the Apsara Janapadi
    to disturb his austerities. Saradwat resists the temptation but suffers an unconscious
    emission; the fluid falls on a clump of heath, divides, and produces twins. A
    soldier finds the children with Saradwat's bow, arrows, and deer-skin and brings
    them to King Santanu, who raises and names them Kripa and Kripi. Saradwat later
    identifies their lineage and teaches Kripa, who becomes a renowned teacher of
    arms.
  language: English
  quote_policy: quoted
