canonical_text:
  quote: ''
  summary: Vrihadaswa introduces Nala, king of the Nishadhas, and Bhima, king of the
    Vidarbhas. Childless Bhima and his queen honor the Brahmarshi Damana, who grants
    them a daughter, Damayanti, and three sons. Damayanti becomes famous for extraordinary
    beauty, and Nala is likewise described as peerless. Heralds praise each to the
    other, causing mutual attachment before they meet. Nala catches a golden-winged
    swan, which promises to speak for him to Damayanti. The swans travel to Vidarbha;
    one leads Damayanti aside, praises Nala, urges their union, and returns with Damayanti’s
    request that it speak similarly to Nala.
  language: English
  quote_policy: summarized
