  summary: The passage describes Skanda, son of the Fire-god, adorned in red, bearing
    a red cock ensign, accompanied by divine power, virtues, hymns, music, and celestial
    beings. The gods anoint him, celestial forces accept him as leader, and he then
    marries Devasena, a bride said to have been destined for him by Brahma before
    his birth. Vrihaspati performs the rites, Devasena is identified by several names,
