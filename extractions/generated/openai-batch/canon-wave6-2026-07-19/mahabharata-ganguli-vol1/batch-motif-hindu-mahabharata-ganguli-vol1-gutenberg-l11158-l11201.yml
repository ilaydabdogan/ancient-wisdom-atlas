canonical_text:
  quote: ''
  summary: Vyasa agrees, at Satyavati's command, to beget children for his brother
    in accordance with virtue, but first prescribes a vow and purification for the
    women. Satyavati urges immediate conception because a kingless realm falls into
    disorder. Vyasa says the woman must endure his severe appearance and smell as
    penance. He instructs that the princess of Kosala wait for him in clean attire
    and ornaments. Satyavati privately persuades her daughter-in-law to restore the
    Bharata line, and after gaining assent she feeds Brahmanas, Rishis, and guests.
  language: English
  quote_policy: summarized
