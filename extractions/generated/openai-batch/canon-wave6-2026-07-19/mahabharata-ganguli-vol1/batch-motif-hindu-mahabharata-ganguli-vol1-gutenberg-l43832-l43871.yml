  - ev:1
- id: obs:2
  text: Matali drives a blazing car that illuminates the sky and is compared to fire
    and a meteor in clouds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arjuna, called Kiriti and Dhananjaya, appears seated in the car wearing garlands
    and ornaments, then alights on a mountain.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Arjuna bows at the feet of Dhaumya and Ajatasatru, pays homage to Vrikodara's
    feet, receives bows from the twins, cheers Krishna, and stands humbly before his
    elder brother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The meeting brings mutual delight, and Arjuna eulogises the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Parthas go round the car, offer worship to Matali, inquire after the gods,
