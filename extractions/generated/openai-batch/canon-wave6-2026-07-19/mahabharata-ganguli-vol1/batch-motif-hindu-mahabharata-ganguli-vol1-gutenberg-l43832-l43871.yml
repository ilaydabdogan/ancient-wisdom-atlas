canonical_text:
  quote: ''
  summary: Arjuna returns from a heavenly sojourn in Mahendra's blazing car driven
    by Matali, alights on a mountain, greets and honors his companions and elders,
    and is joyfully received. The Parthas honor the divine car and Matali, who instructs
    them and returns to the lord of the celestials. Arjuna gives divine ornaments
    from Sakra to his beloved, recounts learning weapons from Sakra, Vayu, and Siva,
    and briefly narrates his stay in heaven.
  language: English
  quote_policy: summarized
