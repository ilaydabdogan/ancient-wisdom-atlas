  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Matali's departure, Arjuna gives precious gems and ornaments, said to
    have been presented by Sakra, to his beloved, the mother of Sutasoma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arjuna reports that he has learned weapons from Sakra, Vayu, and the manifest
    Siva, and that the celestials with Indra are pleased with him because of his good
    behavior and concentration.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After briefly narrating his sojourn in heaven, Arjuna sleeps that night with
