canonical_text:
  quote: ''
  summary: Markandeya reports that Rakshasas and Pisachas under Ravana enter the resting
    monkey host in invisible forms. Vibhishana, knowing of them, breaks their invisibility,
    and the monkeys kill them. Ravana then leads his army and deploys it in an array
    named after Usanas; Rama answers with a counter-array recommended by Vrihaspati.
    Named warriors pair off in battle, exchange showers of weapons, and the encounter
    is likened to the ancient conflict between gods and Asuras, with celestial weapons
    distressing the three worlds.
  language: English
  quote_policy: summarized
