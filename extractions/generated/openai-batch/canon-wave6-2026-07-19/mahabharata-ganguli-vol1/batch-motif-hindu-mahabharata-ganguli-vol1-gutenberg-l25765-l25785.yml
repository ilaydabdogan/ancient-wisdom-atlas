  summary: Vaisampayana narrates that Bhishma responds defiantly to harsh words from
    the ruler of Chedi. The assembled kings become angry and some threaten to kill
    or burn Bhishma. Bhishma says he places his foot on all their heads and points
    to Govinda/Madhava, whom they have worshipped, declaring that anyone desiring
    quick death should challenge the dark-hued wielder of the discus and mace and
    then fall into and mingle with the god's body.
