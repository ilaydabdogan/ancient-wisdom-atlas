canonical_text:
  quote: My husband is my supreme god.
  summary: A chaste woman conciles an angry Brahmana by explaining that she delayed
    him while serving her hungry husband. She acknowledges Brahmanical power but teaches
    that true Brahmanahood rests on truth, self-control, forgiveness, and mastery
    over anger. She directs the Brahmana Kausika to seek instruction on virtue from
    a truthful fowler in Mithila. The Brahmana accepts her reproof, his anger subsides,
    and he leaves reproaching himself.
  language: English
  quote_policy: quoted
