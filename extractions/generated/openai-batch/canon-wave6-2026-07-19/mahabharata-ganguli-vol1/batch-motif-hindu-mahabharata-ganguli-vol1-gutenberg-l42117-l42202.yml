canonical_text:
  quote: ''
  summary: While the Pandavas wait in expectation of Dhananjaya, a north-east wind
    brings a celestial thousand-petaled lotus. Draupadi asks Bhima to fetch more of
    the same flower. Bhima sets out with bow and arrows, follows the wind toward Gandhamadana,
    ascends and ranges the supernatural mountain landscape, reflects on his brothers
    and Duryodhana, and advances with great force through trees, animals, and creepers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group described as tigers among men dwelt for six nights observing cleanliness
    and expecting to behold Dhananjaya.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A north-east wind brought a celestial lotus with a thousand petals, sun-like
    brightness, and unearthly fragrance; Panchali saw it on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Panchali obtained the lotus, said it gladdened her heart, intended it for
    Yudhishthira, and asked Bhima to procure more flowers of the same species for
    the Kamyaka hermitage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhima, knowing Draupadi's desire, set out to gratify her, facing the wind
    and carrying a gold-inlaid bow and arrows likened to venomous snakes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhima is described as the son of Pritha and offspring of Vayu, not overcome
    by exhaustion, fear, confusion, or languor, and he ascended a peak by the strength
    of his arms.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Gandhamadana peak is described as tree-covered, rocky, flowered in every
    season, frequented by Kinnaras, and varied with minerals, plants, beasts, and
    birds.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Perfumed breeze from Gandhamadana cooled Bhima like a father's touch, removed
    his fatigue, and made the hair on his body stand on end.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mountain is said to be inhabited by Yakshas, Gandharvas, celestials, and
    Brahmarshis, and to contain springs, rivers, cascades, caves, caverns, groves,
    peacocks, Apsaras, and elephants associated with the cardinal points.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bhima pushed away intertwined creepers; stags gazed at him without fleeing,
    and invisible wives of Yakshas and Gandharvas stared at him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: While seeking to gratify Draupadi, Bhima remembered woes caused by Duryodhana
    and thought about Arjuna in heaven, Yudhishthira, Nakula, Sahadeva, and how to
    obtain the flowers quickly.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bhima proceeded swiftly with wind-like strength, making the earth tremble,
    frightening elephants, uprooting and smashing trees, tearing plants and creepers,
    and roaring like a thundercloud.
  category: action
  evidence_refs:
  - ev:10
