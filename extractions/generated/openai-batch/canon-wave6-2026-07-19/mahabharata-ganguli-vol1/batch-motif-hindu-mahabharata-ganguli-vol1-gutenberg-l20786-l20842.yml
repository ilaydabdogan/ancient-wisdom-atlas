  quote: ''
  summary: The passage recounts the birth, naming, rites, education, and heroic qualities
    of Abhimanyu, son of Subhadra and Dhananjaya/Arjuna. It then lists the five sons
    born to Panchali/Draupadi by her five husbands, explains their names, notes their
    rites and training in Vedas and weapons, and concludes with the Pandavas rejoicing
    in their heroic sons.
