canonical_text:
  quote: ''
  summary: Markandeya enumerates child- and fetus-afflicting spirits associated with
    Skanda and various named female beings, describes tree-linked and child-protective
    figures, explains ritual propitiation of the spirits of Skanda, and then lists
    spirits and conditions said to cause madness or affliction in adults.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fiery powerful being comes out of Skanda's body, falls senseless and hungry,
    assumes a terrific form when bidden by Skanda, and is named Skandapasmara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several named grahas or evil spirits are identified with female figures and
    are said to afflict children, cause abortion, or desire the flesh of little children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Male and female children said to have been begotten by Skanda are described
    as evil spirits that destroy the fetus and seize children unawares.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Surabhi and Sarama are linked to harm against children or human beings in
    the womb, while the mother of all trees dwells in a karanja tree and is approached
    by people desiring children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Eighteen spirits fond of meat and wine are said to dwell in the lying-in-room
    for ten days.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kadru enters a pregnant woman in subtle form, destroys the fetus, and causes
    the mother to give birth to a Naga.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mothers of the Gandharvas and Apsaras are said to remove the fetus from
    the womb, producing abortive or stationary conceptions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lohitayani is described as a nurse of Skanda and is worshipped on Kadamva
    trees; Arya is described as the mother of all children and is worshipped for their
    welfare.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The spirits preside over children until the sixteenth year, first exercising
    harmful influence and later beneficial influence; collectively they are called
    spirits of Skanda.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The spirits of Skanda are propitiated with burnt offerings, ablutions, unguents,
    sacrifices, other offerings, and worship of Skanda, and when honored they bestow
    good, valor, and long life.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Adult-afflicting celestial, ancestral, Siddha, Rakshasa, Gandharva, Paisacha,
    and Yaksha spirits are said to cause visions, sensory perceptions, possession,
    torment, loss of reason, or madness.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Madness is also attributed to vices, perplexity, fear, and hideous sights;
    remedies include prescribed methods, quieting the mind, disciplined conduct, cleanliness,
    devotion, and self-restraint.
  category: sequence
  evidence_refs:
  - ev:11
