canonical_text:
  quote: ''
  summary: 'Mandapala reassures his children that he had secured Agni''s promise for
    their safety, then departs with his wife and sons. Agni completes the burning
    of Khandava with the help of Krishna and Arjuna, is gratified by consuming flesh,
    fat, marrow, and blood, and ceases burning after fifteen days. Indra descends
    with the Maruts, praises Krishna and Arjuna, and grants boons: Arjuna asks for
    Indra''s weapons, and Krishna asks for eternal friendship with Arjuna. Agni also
    grants the heroes freedom to go where they choose, after which Arjuna, Vasudeva,
    and Maya sit by a river.'
  language: English
  quote_policy: summarized
