canonical_text:
  quote: "“Leave ye my brother king Suyodhana.”"
  summary: After Yudhishthira speaks, the Pandavas arm themselves and set out to free
    Duryodhana. In the forest they confront victorious Gandharvas. Arjuna first requests
    the release of Suyodhana and the other captives, then censures the Gandharvas’
    conduct and threatens force. When release is not granted, he shoots arrows at
    the sky-ranging Gandharvas, who answer with arrows, and the battle becomes fierce.
  language: English
  quote_policy: quoted
