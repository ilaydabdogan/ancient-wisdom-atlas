canonical_text:
  quote: forgiveness is sacrifice; forgiveness is quiet of mind.
  summary: The passage praises forgiveness as ascetic merit, holiness, sacrifice,
    cosmic support, and the highest virtue. Forgiving persons are said to attain honored
    regions, blessedness, higher regions, and Brahma. The speaker tells Draupadi to
    restrain wrath, expects named elders and allies to advocate peace, predicts that
    Dhritarashtra may return the kingdom if guided by peace, and contrasts Suyodhana's
    lack of forgiveness with the speaker's claim to deserving sovereignty through
    forgiveness and gentleness.
  language: English
  quote_policy: quoted
