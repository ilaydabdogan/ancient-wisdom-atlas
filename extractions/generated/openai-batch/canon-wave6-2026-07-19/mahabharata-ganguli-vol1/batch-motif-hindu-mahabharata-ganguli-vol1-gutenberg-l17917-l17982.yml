canonical_text:
  quote: ''
  summary: The Pandavas travel toward Drupada's Panchala capital, meet Dwaipayana,
    and live there unrecognized in a potter's house while adopting a Brahmanical and
    alms-supported way of life. Drupada/Yajnasena prepares a Swayamvara for his daughter
    by setting an archery test involving a stiff bow, arrows, a sky-mounted machine,
    and a target. Kings, Rishis, Brahmanas, Duryodhana with the Kurus and Kama, and
    citizens gather in a richly decorated amphitheatre and surrounding mansions.
  language: English
  quote_policy: summarized
