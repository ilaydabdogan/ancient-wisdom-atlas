canonical_text:
  quote: ''
  summary: Lomasa tells a king that the twin Aswins see Sukanya in the wood after
    bathing, ask her identity, and urge her to leave her aged husband Chyavana for
    one of them. Sukanya affirms her devotion. The Aswins offer to make Chyavana young
    and graceful if she will choose among the two of them and her husband. With Chyavana's
    permission, he and the Aswins enter water and emerge young, beautiful, and identical
    in appearance. Sukanya identifies and chooses Chyavana. Chyavana promises the
    Aswins access to Soma juice in the presence of the lord of celestials, after which
    the Aswins ascend to heaven and the couple live happily.
  language: English
  quote_policy: summarized
