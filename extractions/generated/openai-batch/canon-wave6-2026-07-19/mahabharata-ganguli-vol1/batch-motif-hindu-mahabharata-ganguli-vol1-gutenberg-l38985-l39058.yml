canonical_text:
  quote: ''
  summary: Lomasa recounts how Sagara banished his son Asamanjas for harming townspeople's
    children. Sagara then sends his grandson Ansuman to recover the sacrificial horse
    and relieve the obstruction to the rite. Ansuman reaches Kapila through the excavated
    earth and sea, obtains the horse, and receives a boon and prophecy that Sagara's
    sons will be purified when a later descendant brings the three-streamed Ganga
    through Siva's favor. Ansuman returns, Sagara completes the sacrifice, and successive
    kings rule, install heirs, pursue the descent of Ganga, retire, and ascend or
    depart to heaven.
  language: English
  quote_policy: summarized
