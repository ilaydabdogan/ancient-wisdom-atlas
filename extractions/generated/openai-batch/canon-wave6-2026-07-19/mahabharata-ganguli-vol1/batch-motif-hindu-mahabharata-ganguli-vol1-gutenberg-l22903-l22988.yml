canonical_text:
  quote: ''
  summary: 'Narada describes the celestial assembly house of Vaisravana/Kuvera: its
    vast size, jewel-filled and gold architecture, attachment to the firmament, Kuvera
    seated within it, the attendance of wives, deities, Apsaras, Gandharvas, Yakshas,
    Rishis, Rakshasas, Siva with Parvati and spirits, personified mountains, and personified
    jewels. Narada ends by saying he has seen this moving heavenly assembly and will
    next describe Brahma''s Sabha.'
  language: English
  quote_policy: summarized
