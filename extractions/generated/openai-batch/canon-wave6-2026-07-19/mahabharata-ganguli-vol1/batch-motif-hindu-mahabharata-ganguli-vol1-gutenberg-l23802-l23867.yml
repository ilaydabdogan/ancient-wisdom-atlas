canonical_text:
  quote: ''
  summary: Krishna recounts that the ascetic Chandakausika came to Magadha, was ritually
    received by King Vrihadratha, and foretold the future greatness, invulnerability,
    dominion, and divine vision of Vrihadratha's son Jarasandha. Vrihadratha installed
    Jarasandha as king and retired with his wives to an ascetic life, later ascending
    to heaven. Jarasandha subdued kings, later became hostile to Krishna after Kansa's
    death, hurled a mace toward Mathura, and was supported by the weapon-invulnerable
    counselors Hansa and Dimvaka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ascetic Chandakausika came again into Magadha, and King Vrihadratha went
    out with his ministers, priest, wives, and son to receive him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vrihadratha worshipped the Rishi with water for washing feet and face and
    with Arghya offerings, then offered his whole kingdom and son for the Rishi's
    acceptance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Rishi said that he knew the matter by spiritual insight and described
    the future beauty, excellence, strength, valour, prosperity, and prowess of Vrihadratha's
    son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Rishi foretold that other kings would not equal the son in energy, that
    those standing in his way would be destroyed, and that weapons hurled by celestials
    would not cause him pain.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Rishi predicted that the prince would dominate other monarchs, support
    all four orders of men, command the kings of the earth, and behold Rudra or Hara
    with physical eyes.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Vrihadratha installed Jarasandha on the throne, lost taste for worldly pleasures,
    and retired with his two wives to an ascetic asylum in the woods.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: After his parents retired, Jarasandha brought numerous kings under his sway
    and ruled his kingdom like a father.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Vrihadratha lived in the woods, practiced ascetic penances, and ascended to
    heaven with his wives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Kansa was slain by Vasudeva, enmity arose between Jarasandha and Krishna.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: From Girivraja, Jarasandha whirled a mace ninety-nine times and hurled it
    toward Mathura; it fell near Mathura at a distance of ninety-nine yojanas from
    Girivraja, and the place was called Gadavasan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hansa and Dimvaka were supporters of Jarasandha, were described as incapable
