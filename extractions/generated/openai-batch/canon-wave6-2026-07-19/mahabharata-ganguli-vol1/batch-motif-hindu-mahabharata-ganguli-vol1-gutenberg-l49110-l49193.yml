canonical_text:
  quote: ''
  summary: The fowler recounts how a rishi cursed him for an unwitting wicked deed
    but softened the curse with promises of piety, filial honor, memory of a former
    life, heaven, and eventual restoration as a Brahmana. The Brahmana interlocutor
    affirms that character and virtue, not birth alone, determine true moral status.
    The fowler teaches that spiritual wisdom cures mental suffering and that the wise
    should avoid grief and discontent. The Brahmana honors the fowler, departs, and
    returns home to care for his old parents. Markandeya frames the narrative for
    Yudhishthira as moral instruction concerning devotion and filial piety.
  language: English
  quote_policy: summarized
