canonical_text:
  quote: ''
  summary: King Dushmanta enters Kanwa's hermitage alone, finds the sage absent, and
    is welcomed by Sakuntala with ritual hospitality. Dushmanta asks where Kanwa has
    gone, then questions Sakuntala about her identity and birth after being struck
    by her beauty. Sakuntala says Kanwa is away gathering fruit and identifies herself
    as his daughter. Dushmanta doubts how a celibate ascetic could have a daughter,
    and Sakuntala begins to recount what Kanwa previously told a visiting rishi about
    her birth.
  language: English
  quote_policy: summarized
