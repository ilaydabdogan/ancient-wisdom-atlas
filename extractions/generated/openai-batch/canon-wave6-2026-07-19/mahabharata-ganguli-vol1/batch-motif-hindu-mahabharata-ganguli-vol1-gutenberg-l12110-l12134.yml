canonical_text:
  quote: ''
  summary: Pandu gives away royal ornaments and valuables to Brahmanas, sends his
    attendants back to Hastinapura to announce that he and his wives have gone to
    the woods renouncing worldly pleasures, and the attendants return weeping. Dhritarashtra
    grieves on hearing the news. Pandu, accompanied by his two wives, lives on fruits
    and roots, travels through named mountain regions, is protected by Mahabhutas,
    Siddhas, and great Rishis, and practices ascetic austerities at Sata-sringa.
  language: English
