canonical_text:
  quote: ''
  summary: Krishna proposes a secret mission against Jarasandha as a prerequisite
    for Yudhishthira's Rajasuya. He assigns policy to himself, strength to Bhima,
    and triumph to Arjuna, expecting Jarasandha to choose a bare-arm contest with
    Bhima. Yudhishthira accepts Krishna's leadership, links the mission with freeing
    confined kings, and sends Krishna, Arjuna, and Bhima toward Magadha in Brahmana
    garb. The three travel east through named regions, rivers, and hills until they
    reach Magadha and see its wealthy, water-rich city.
  language: English
  quote_policy: summarized
