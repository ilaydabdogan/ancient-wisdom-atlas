canonical_text:
  quote: "“finding his brothers and Draupadi being carried off, Bhima of mighty strength
    was fired with wrath”"
  summary: Bhima arrives while Jatasura the Rakshasa is carrying off Draupadi and
    some of the Pandava brothers. Bhima rebukes the Rakshasa for abusing his former
    status as a disguised Brahmana guest, declares that fate has brought the demon
    to his appointed death, and fights him. The fight proceeds through wrestling,
    uprooted trees, rocks, grappling, and blows until Bhima kills Jatasura by smashing
    his limbs and severing his head. Bhima then returns to Yudhishthira and is praised
    by Brahmanas.
  language: English
  quote_policy: quoted
