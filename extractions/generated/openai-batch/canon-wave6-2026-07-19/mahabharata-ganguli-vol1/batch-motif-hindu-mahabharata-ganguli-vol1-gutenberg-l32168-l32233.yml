canonical_text:
  quote: ''
  summary: Vaisampayana narrates Ajatasatru's reply to Bhimasena. Ajatasatru accepts
    responsibility for the dice-game calamity, attributes the defeat to Sakuni's artful
    gambling on Suyodhana's behalf, recalls the agreed terms of twelve years in the
    forest and a thirteenth year in secrecy, and refuses to violate the pledge despite
    the loss of kingdom. He regrets Draupadi's persecution, counsels patience until
    revenge can properly ripen, and declares truth and virtue superior to life, heaven,
    kingdom, sons, fame, and wealth.
  language: English
  quote_policy: summarized
