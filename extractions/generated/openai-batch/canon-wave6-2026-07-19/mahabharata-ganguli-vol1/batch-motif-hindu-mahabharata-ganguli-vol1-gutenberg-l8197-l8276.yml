canonical_text:
  quote: ''
  summary: Janamejaya asks how Yayati obtained Devayani, Sukra's daughter, and asks
    about dynastic founders. Vaisampayana introduces a conflict between gods and Asuras
    in which each side has a priest. Sukra revives slain Danavas through Sanjivani,
    while Vrihaspati cannot revive slain gods. The gods send Kacha, Vrihaspati's son,
    to become Sukra's disciple and obtain that knowledge. Kacha serves Sukra and Devayani
    for centuries, but the Danavas discover his purpose, kill him while he tends cattle
    in the woods, dismember his body, and feed it to animals. At twilight Devayani
    notices the cattle have returned without Kacha and tells Sukra she will not live
    without him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Janamejaya asks to hear how Yayati, called his ancestor and tenth from Prajapati,
    obtained Devayani, the daughter of Sukra, as a wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaisampayana says Yayati was like Indra in splendour and that Sukra and Vrishaparvan
    bestowed their daughters on him with rites, with special attention to Yayati's
    union with Devayani.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The celestials and the Asuras repeatedly fought for sovereignty over the three
    worlds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods installed Vrihaspati as their priest for sacrifices, while the Asuras
    installed Usanas, also called Sukra, as their priest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sukra revived Danavas slain by the gods through his knowledge, while Vrihaspati
    could not revive slain celestials because he did not know Sanjivani.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods ask Kacha, Vrihaspati's eldest son, to acquire the knowledge residing
    in Sukra and advise him to propitiate both Sukra and Devayani.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kacha goes to the Asura capital, identifies himself to Sukra as Angiras's
    grandson and Vrihaspati's son, and asks to be accepted as a disciple practicing
    Brahmacharya for a thousand years.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Sukra welcomes Kacha and accepts his request, saying that by honoring Kacha
    he honors Vrihaspati.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kacha conciliates Sukra and Devayani; he pleases Devayani with singing, dancing,
    instruments, flowers, fruits, and prompt services, and Devayani attends him while
    they are alone.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After five hundred years of Kacha's vow, the Danavas learn his intention,
    become angry, kill him while he is tending his preceptor's cattle in a solitary
    wood, cut his body into pieces, and give the pieces to jackals and wolves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: At twilight the cattle return without Kacha; Devayani tells Sukra the evening
    fire has been kindled, the sun has set, Kacha is missing or dead, and she will
    not live without him.
  category: speech
  evidence_refs:
  - ev:8
