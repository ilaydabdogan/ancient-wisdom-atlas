canonical_text:
  quote: ''
  summary: King Mahabhisha, after attaining heaven through many royal sacrifices,
    attends an assembly worshipping Brahman. Ganga arrives, her garment is displaced
    by wind, the celestials avert their heads, and Mahabhisha stares. Brahman curses
    Mahabhisha to be reborn on earth and says Ganga will also be born among humans
    and injure him until his wrath releases him from the curse. Ganga later meets
    the dejected Vasus, who have been cursed by Vasishtha to be born among men. They
    ask Ganga to become a human female and bear them as her children. The Vasus identify
    Santanu, son of Pratipa, as their father. They ask Ganga to throw the children
    into water after birth so they may be quickly rescued from earthly life. Ganga
    agrees, asking that one son survive; the Vasus agree to contribute portions of
    their energies to one son, who will be powerful and childless.
  language: English
  quote_policy: summarized
