canonical_text:
  quote: ''
  summary: Lomasa narrates that Indra, armed with the Vajra and supported by celestials,
    approaches Vritra, who occupies earth and heaven and is guarded by Kalakeyas.
    A terrible battle follows; the gods flee, Indra seeks Narayana's refuge, and Vishnu,
    the gods, and Brahmarshis impart energy to him. Vritra roars, shaking cosmic regions,
    and Indra hurls the Vajra, killing him. The celestials praise Indra and attack
    the Danavas, who flee into the sea. There they resolve to destroy ascetic and
    knowledgeable persons because asceticism supports the worlds, and they make the
    ocean their fort.
  language: English
  quote_policy: summarized
