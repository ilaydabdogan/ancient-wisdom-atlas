  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The goddess Savitri appears in embodied form from the Agnihotra fire, says
    she is pleased, and invites Aswapati to ask a boon while not disregarding virtue.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Aswapati asks for many sons, but the goddess announces that, by the favor
    of the Grandsire or Self-create, a daughter of great energy will be born to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aswapati's eldest queen, the princess of Malava, conceives and bears a daughter
