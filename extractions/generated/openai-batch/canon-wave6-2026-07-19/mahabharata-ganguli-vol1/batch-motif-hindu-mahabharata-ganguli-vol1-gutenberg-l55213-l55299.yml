  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira says Draupadi delivered them during the dice-game affliction
    and was forcibly carried from the forest by Jayadratha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yudhishthira asks whether Markandeya has seen or heard of any chaste and exalted
    lady resembling Draupadi.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Markandeya introduces a princess named Savitri as one who completely obtained
    the exalted merit of chaste ladies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aswapati is described as a virtuous, pious king of the Madras who serves Brahmanas,
    performs sacrifices, gives gifts, is beloved by his people, and is without issue
    in old age.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: With the aim of offspring, Aswapati practices vows, frugal eating, Brahmacharya,
