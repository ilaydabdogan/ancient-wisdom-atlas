canonical_text:
  quote: ''
  summary: In a frame dialogue, Yudhishthira asks Markandeya for an example of a chaste
    and exalted woman like Draupadi. Markandeya begins the story of Aswapati, childless
    king of the Madras, whose eighteen years of vows and fire oblations to Savitri
    bring the goddess Savitri to appear from the Agnihotra fire and announce a daughter.
    The daughter, named Savitri, grows radiant and unsought, performs ritual observances
    at a festival, and is instructed by her father to choose a worthy husband.
  language: English
  quote_policy: summarized
