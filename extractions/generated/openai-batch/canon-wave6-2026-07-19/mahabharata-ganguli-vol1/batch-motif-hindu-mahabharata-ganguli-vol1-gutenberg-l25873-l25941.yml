canonical_text:
  quote: ''
  summary: Yudhishthira completes the Rajasuya sacrifice under Krishna's protection.
    The assembled monarchs recognize his imperial dignity and depart with honors and
    escorts. Krishna asks leave to return to Dwaraka, receives farewells and ritual
    benedictions, departs in a Garuda-bannered car, and counsels Yudhishthira to support
    his subjects and relatives. After Krishna departs, Duryodhana and Sakuni remain
    in the celestial assembly house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Rajasuya sacrifice of Yudhishthira is described as auspicious, prosperous,
    free of impediments, supplied with food and wealth, and completed in due time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kesava/Janarddana guards the sacrifice until completion, bearing the bow Saranga,
    a discus, and a mace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kshatriya monarchs address Yudhishthira after his concluding bath, saying
    that he has succeeded, obtained imperial dignity, increased his race's fame, gained
    religious merit, and satisfied them with worship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The monarchs ask Yudhishthira for permission to return to their kingdoms,
    and Yudhishthira honors them and orders his brothers to escort them to the borders
    of his dominions.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Pandava princes and allied sons escort various kings and elders; thousands
    of Brahmanas also depart after being duly worshipped.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the kings and Brahmanas depart, Vasudeva asks Yudhishthira for leave
    to go to Dwaraka, and Yudhishthira attributes the sacrifice's success and the
    Kshatriyas' acceptance of his sway to Govinda's grace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Krishna speaks to Pritha, bids farewell to Draupadi and Subhadra, performs
    ablutions and daily worship, and has Brahmanas utter benedictions before departing.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Daruka arrives with a cloud-like, Garuda-bannered car; Krishna respectfully
    walks around it, ascends it, and sets out for Dwaravati while Yudhishthira and
    his brothers follow on foot.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Krishna tells Yudhishthira to cherish his subjects with vigilance and patience
    and to be the refuge and support of his relatives, using comparisons to clouds,
    a large spreading tree, and the thousand-eyed one among immortals.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the chief of the Satwata race goes to Dwaravati, Duryodhana and Sakuni
