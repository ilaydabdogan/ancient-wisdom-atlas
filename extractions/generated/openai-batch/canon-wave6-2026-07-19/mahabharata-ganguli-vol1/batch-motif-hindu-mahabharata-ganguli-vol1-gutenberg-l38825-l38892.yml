canonical_text:
  quote: ''
  summary: 'Brahma tells the gods that the ocean will only later resume its usual
    state through an occasion connected with Bhagiratha''s agnates. Yudhishthira asks
    for the details, and Lomasa begins narrating the account of Sagara: the sonless
    Ikshaku king goes with his two wives to Kailasa for austerities, obtains a vision
    of Shiva, receives a prophecy of sixty thousand sons from one wife and one line-continuing
    son from the other, and later receives an aerial instruction to preserve seeds
    from a gourd in clarified-butter vessels so that the sixty thousand sons may be
    born.'
  language: English
  quote_policy: summarized
