canonical_text:
  quote: ''
  summary: Sakuntala appeals to Dushmanta to recognize a child she says is his son,
    citing a long pregnancy, a sky-borne prophecy, ritual language about sonship,
    and images of paternal self-continuation. She recounts Dushmanta approaching her
    while hunting and describes her own birth from Menaka and Viswamitra, followed
    by abandonment in Himavat. Dushmanta denies knowing her or begetting the child
    and rejects her claims while disparaging her parentage and noting the child's
    unusual strength and growth.
  language: English
  quote_policy: summarized
