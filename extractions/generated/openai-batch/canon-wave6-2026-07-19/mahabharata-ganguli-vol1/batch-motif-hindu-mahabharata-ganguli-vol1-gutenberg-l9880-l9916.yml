  summary: The passage recounts a royal genealogy from Samvarana and Tapati through
    Kuru and later descendants. Kuru is installed as king, gives his name to Kuru-jangala,
    and makes Kurukshetra sacred by ascetic practice. The passage then lists successive
    descendants, kings, warriors, and ascetics, including Devapi’s adoption of ascetic
    life for his brothers’ benefit and the accession of Santanu and Valhika.
