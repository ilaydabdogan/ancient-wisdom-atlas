canonical_text:
  quote: ''
  summary: Lakshmana leaves to follow Rama. Ravana appears in a hermit disguise intending
    to abduct Sita, and Sita receives him with hospitality. Ravana reveals himself
    as the Rakshasa king of Lanka and asks Sita to abandon Rama and become his wife.
    Sita refuses. After she retreats into the cottage, Ravana blocks her, scolds her,
    and she swoons; he seizes her by the hair and rises into the air carrying her
    away. Jatayu, a huge vulture living on a mountain peak, sees Sita weeping and
    calling upon Rama.
  language: English
  quote_policy: summarized
