canonical_text:
  quote: The name of that sacrifice worthy of virtuous persons, is Vaishnava.
  summary: Karna urges Duryodhana to rule after the earth has been subdued. Duryodhana,
    wishing to perform the Rajasuya after seeing the Pandavas perform it, asks Karna
    to fulfill that desire. Karna advises proper ritual preparation. A priest says
    Duryodhana cannot perform the Rajasuya while Yudhishthira and Dhritarashtra are
    alive, and proposes a related Vaishnava sacrifice involving tribute gold made
    into a sacrificial plough. Duryodhana accepts the Brahmanas' advice, gains assent
    from his companions, assigns tasks, and has artisans construct the plough.
  language: English
  quote_policy: quoted
