canonical_text:
  quote: ''
  summary: While the Pandavas dwell with Brahmanas on a mountain awaiting Arjuna,
    Bhima and other protectors are away. Jatasura, a Rakshasa who had lived among
    them disguised as a Brahmana, reveals a gigantic monstrous form, seizes the Pandavas'
    weapons, abducts Draupadi and three Pandavas, and flees. Sahadeva frees himself,
    takes the sword Kausika, and calls for Bhima. Yudhishthira rebukes Jatasura for
    violating virtue and hospitality, makes himself heavy to slow him, and predicts
    Bhima's arrival. Sahadeva then declares Kshatriya duty and challenges the Rakshasa.
  language: English
  quote_policy: summarized
