  quote: ''
  summary: Vaisampayana narrates that Jarasandha, preparing to fight powerful heroes,
    orders his son Sahadeva installed on the throne. On the eve of battle he thinks
    of his generals Kausika and Chitrasena, formerly called Hansa and Dimvaka. Sauri,
    mindful of Brahma's command and of the destiny that Jarasandha is to be killed
    by Bhima rather than by the Yadavas, chooses not to kill Jarasandha himself.
  language: English
