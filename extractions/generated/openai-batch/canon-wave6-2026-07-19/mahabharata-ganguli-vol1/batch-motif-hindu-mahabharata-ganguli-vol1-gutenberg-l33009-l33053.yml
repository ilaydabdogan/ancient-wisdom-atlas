  summary: Arjuna thinks of Indra's car; Matali arrives with the radiant celestial
    car and invites Arjuna, as Indra's son, to ascend to the celestial region where
    gods and other beings await him. Arjuna replies that Matali should mount first
    and says the car requires ascetic merit even to see or touch.
