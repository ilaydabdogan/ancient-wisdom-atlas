    the Pandavas from woe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kunti addresses Pandu and asks why he suffers his children to be sent into
    exile after defeat at dice; she then asks Sahadeva not to go and to wait upon
    her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Pandavas console their weeping mother and set out for the woods; Vidura
