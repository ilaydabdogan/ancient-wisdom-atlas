  quote: ''
  summary: Vaisampayana narrates Draupadi taking leave before exile, Kunti blessing
    and lamenting over Draupadi and the Pandavas, the Pandavas departing for the woods,
    Vidura consoling Kunti, the royal women grieving and censuring the Kauravas, and
    Dhritarashtra anxiously summoning Vidura to ask how the Pandavas left Hastinapore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Draupadi seeks leave from Pritha and the other household women before setting
    out, salutes and embraces them, and a loud wail arises in the inner apartments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kunti tells Draupadi not to grieve, praises her conduct and chastity, blesses
    her, and asks her to keep watch over Sahadeva in the woods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Draupadi leaves her mother-in-law weeping, wearing one blood-stained piece
    of cloth, with dishevelled hair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kunti follows Draupadi and sees her sons without ornaments and robes, wearing
    deerskins, with their heads lowered in shame, surrounded by rejoicing foes and
    pitying friends.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kunti says her sons are virtuous and asks why calamity and a reverse of fortune
    have overtaken them; she worries about how they will live poor in the pathless
    woods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kunti refers to Pandu's death, the mountains of Satasringa, Hastinapore, Pandu's
