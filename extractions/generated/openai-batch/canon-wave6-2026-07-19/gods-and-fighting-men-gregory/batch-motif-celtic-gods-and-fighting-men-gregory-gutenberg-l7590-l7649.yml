canonical_text:
  quote: ''
  summary: The King of the World orders another attack on the Fianna. The sons of
    Garb and their people fight the sons of Baiscne through the night until only Oisin
    and one son of Garb remain able to fight. The surviving opponent draws Oisin into
    the sea, where they wrestle underwater until Oisin, encouraged by Fergus at Finn's
    request, drowns him, brings the body ashore, and cuts off the head. Dolar Durba,
    the eldest son of Garb, swears vengeance for his brothers, vows to kill a hundred
    men daily, kills the hundred led by Dubhan, performs hurling feats on the strand,
    boasts, and continues killing a hundred men each day.
  language: English
  quote_policy: summarized
