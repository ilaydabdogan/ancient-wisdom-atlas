canonical_text:
  quote: ''
  summary: 'Laegaire declares his preference for the Sidhe kingdom and returns there.
    The passage then begins the fate of the children of Lir: after Bodb Dearg is chosen
    king of the Tuatha de Danaan, Lir refuses submission. Bodb avoids violent retaliation
    and later offers reconciliation through marriage. Lir marries Aobh, who bears
    four children and dies at the second birth. Bodb then gives Lir Aobh''s sister
    Aoife as wife. Aoife first shows affection to the children, but later becomes
    jealous, feigns sickness, and takes the children away in a chariot while Fionnuala
    foresees treachery against them.'
  language: English
  quote_policy: summarized
literal_observations:
