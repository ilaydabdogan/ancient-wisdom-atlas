candidate_motifs:
- id: motif:1
  label: Permanent return to the Sidhe realm
  taxonomy_refs:
  - return
  basis: Laegaire rejects the value of an earthly kingdom compared with the Sidhe,
    returns to that kingdom, and does not come out again in the passage.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents the Sidhe as a kingdom but does not explicitly frame
    the episode as an afterlife journey.
- id: motif:2
  label: Contested kingship resolved through restraint and alliance
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: Bodb is chosen king, Lir refuses submission, Bodb rejects violent reprisal,
    and reconciliation is attempted through lordship acknowledgement and marriage
    to a foster-daughter.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The marriage is political and kinship-based in the passage; the taxonomy
    term 'sacred_exchange' is only approximate.
- id: motif:3
  label: Sister-bride substitution after the death of a wife
  taxonomy_refs:
  - sacred_marriage
  - sacred_exchange
  basis: After Aobh dies, Bodb gives her sister Aoife to Lir so that friendship between
    houses will not be broken.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not use the term sacred marriage; the participants are
    divine or Sidhe figures, but the act is narrated as maintaining friendship.
- id: motif:4
  label: Beloved divine children in sibling group
  taxonomy_refs:
  - divine_parent_child
  - sacred_twins
  basis: Aobh bears two children and then two more; the four children are deeply loved
    by Lir, Bodb, Aoife at first, and the Men of Dea.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The text gives two paired births, but it does not explicitly call the
    children twins or describe a ritual function for the pairs.
- id: motif:5
  label: Jealous second wife plots against first wife's children
  taxonomy_refs: []
  basis: Aoife, Aobh's sister and Lir's second wife, develops jealousy, dislike, and
    hatred toward Aobh's children, feigns sickness, and acts treacherously against
    them.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage stops before the full consequence of the treachery is narrated.
- id: motif:6
  label: Warning dream of treachery
  taxonomy_refs: []
  basis: Fionnuala does not want to accompany Aoife because she has dreamed that treachery
    is in Aoife's mind.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain the dream's source or whether it is divine,
    prophetic, or intuitive.
- id: motif:7
  label: Children carried away in a chariot toward danger
  taxonomy_refs:
  - departure
  basis: Aoife yokes a chariot and takes the four children toward Bodb Dearg's house,
    while Fionnuala senses death or destruction planned against them.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage narrates a dangerous departure but does not yet narrate the
    destination's outcome.
