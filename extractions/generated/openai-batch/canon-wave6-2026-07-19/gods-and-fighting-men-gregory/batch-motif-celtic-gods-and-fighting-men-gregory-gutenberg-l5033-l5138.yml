  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the battle of Tailltin, the Tuatha de Danaan choose Bodb Dearg as king;
    Lir leaves the gathering without permission because he believes he has a right
    to the kingship.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
