  quote: ''
  summary: Ailne laments the deaths of her husband and two sons and lists many omens
    that foretold their defeat, including Sidhe battles in the air, blood, birds,
    howling hounds, visions, and a withered tree. Grania denies Ailne's charge that
    Finn and the Fianna used treachery. Ailne refuses hospitality, demands satisfaction,
    and a hard battle follows; Ailne is defeated and the battlefield is named Cnoc-an-Air,
    the Hill of Slaughter.
