canonical_text:
  quote: ''
  summary: Finn and the Fianna encounter three young men from Iruath and their extraordinary
    hound. The strangers offer service, protection, provisioning, and magical aid
    under strict night-time conditions, including secrecy around a recurring death
    among them. They later pay poets with treasure produced by the hound and provide
    beer in drinking-horns when the Fianna lack water. A second trio, poisonous red
    sons of Uar of the Tuatha de Danaan, arrives with red hounds and spears, demands
    blood-fine from Caoilte for a battle death, threatens the Fianna when refused,
    and harms them while they remain encamped near Slieve Mis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Magh Femen, the Fianna see three young men with a hound that has every
    colour in the world and is larger than any other hound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men say they come from the greater Iruath in the east, give their
    names as Dubh, Agh, and Ilar, and ask to enter Finn's service and friendship.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The three young men state that one will watch for the Fianna, one will take
    the weight of battles, and one will meet trouble and satisfy wants; one also has
    a pipe that can make all men sleep, while the hound and the speaker will provide
    food on alternating nights.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The young men ask three conditions: no one is to come near their lodging
    after nightfall, nothing is to be given out to them, and the worst places in the
    hunting are to be assigned to them.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young men explain that every third night one of the three is dead and
    the other two watch him, and they do not want anyone looking at them then.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Finn promises their conditions; some of the Fianna dislike the three men's
    separate way of living and their wall of fire, but Finn protects them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Seven poets ask for a fee of gold and silver, and the hound throws the required
    gold and silver out of its mouth before the three young men give it to the poets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Finn says the Fianna have no water, one of the Iruath men takes three
    hundred and twelve drinking-horns and fills them with beer three times; after
    the third filling the drinkers become talkative and confused, and the place is
    named the Little Rath of Wonders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Three bald red clowns arrive with three red hounds and three deadly spears;
    poison is on their clothes, hands, feet, and everything they touch, and they identify
    themselves as sons of Uar of the Tuatha de Danaan seeking blood-fine for their
    father, whom they say Caoilte killed in battle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Finn refuses to pay a blood-fine for a man killed in battle, and Aincel, Digbail,
    and Espaid threaten revenge, robbery, mutilation, loss of hounds, servants, fighting
    men, people, hands, and eyes.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Fianna make small raths around Slieve Mis and remain there for a month,
    a quarter, and a year, while the three red bald-headed men do many kinds of hurt
    and harm to them.
  category: sequence
  evidence_refs:
  - ev:10
