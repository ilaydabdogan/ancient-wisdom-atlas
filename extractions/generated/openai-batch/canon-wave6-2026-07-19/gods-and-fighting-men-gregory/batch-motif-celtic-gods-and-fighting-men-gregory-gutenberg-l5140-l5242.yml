canonical_text:
  quote: she struck them with a Druid rod, and put on them the shape of four swans,
    white and beautiful.
  summary: Aoife tries to have the four children of Lir killed, then transforms them
    into swans at Loch Dairbhreach. Fionnuala speaks against her and asks that the
    enchantment be bounded. Aoife sets a nine-hundred-year term in three water locations,
    with release tied to the coming together of a Woman from the South and a Man from
    the North, but allows the children to keep speech, sense, nobility, and Sidhe
    music. Aoife then deceives Bodb Dearg about the children. Lir learns something
    is wrong, comes to the lake, hears the swans speak, and grieves when Fionnuala
    identifies them as his children.
  language: English
  quote_policy: quoted
