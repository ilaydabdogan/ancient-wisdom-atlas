canonical_text:
  quote: ''
  summary: Grania summons her four sons, tells them Finn killed their father Diarmuid
    against a peace agreement, distributes Diarmuid's arms among them, and orders
    them to train for vengeance. Finn later secretly visits Grania and persuades her
    to go with him; the Fianna mock their arrival together, and the passage gives
    alternate explanations for her change. After seven years of martial training abroad,
    the sons return, attack Finn's forces at Almhuin, and are eventually reconciled
    through Grania's peace agreement, receiving their father's place among the Fianna
    before dying in the battle of Gabhra.
  language: English
  quote_policy: summarized
