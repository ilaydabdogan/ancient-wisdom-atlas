canonical_text:
  quote: ''
  summary: 'A strange big man leaves Finn''s company after accusing them of mocking
    him. His horse carries Conan and other Fianna away, and Liagan is also dragged
    after it over the sea. Finn resolves to follow and recover his people. He recalls
    a Tuatha de Danaan gift by which a ship can be found at Beinn Edair. Two armed
    sons of the King of the Eastern World arrive seeking service: Feradach can produce
    ships by striking three blows with an axe, and the other can track over land or
    sea. Feradach fills the bay and harbour with ships, and Caoilte gives three shouts
    heard by the Fianna of Ireland.'
  language: English
  quote_policy: summarized
