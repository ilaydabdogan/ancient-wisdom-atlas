- id: motif:5
  label: Cattle seizure as compensation for a prior wrong
  taxonomy_refs: []
  basis: The Connacht party takes the Munster hag's hornless bull and two speckled
    cows to satisfy the Connacht hag for her basket.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The preceding offence involving the basket is only referenced, not narrated
