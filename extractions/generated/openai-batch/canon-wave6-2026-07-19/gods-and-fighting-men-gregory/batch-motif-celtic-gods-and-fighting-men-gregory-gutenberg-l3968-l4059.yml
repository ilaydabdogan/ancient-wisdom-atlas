canonical_text:
  quote: ''
  summary: A recurring stranger visits several Irish households and groups under different
    names. He receives hospitality, is tested in reading and harp-playing, shows sudden
    skill after mockery, vanishes, joins a Connacht cattle raid as the Gilla Decair,
    holds back Munster pursuers with bow and arrows, leaves after an honor slight,
    and later performs comic and magical tricks before Tadg O'Cealaigh, ending with
    a silk thread fastened to a cloud and an aerial hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man comes toward Seaghan, Son of the Earl, with water splashing in his shoes
    and gives the name Duartane O'Duartane, describing a route through named places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seaghan's household brings the stranger inside, gives him wine, water for
    washing his feet, and a place to sleep until morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Seaghan asks the stranger to demonstrate learning from a book and skill on
    a harp; the stranger first cannot read or play, and Seaghan mocks him in a verse.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being mocked, the stranger reads the page well in a sweet-sounding voice,
    then plays and sings on the harp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stranger says, "One day I am sweet, another day I am sour."
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: While walking with Seaghan on Cnoc Aine, the stranger suddenly disappears
    and Seaghan cannot see where he went.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stranger reaches Sligach, gives himself the name Gilla Decair, joins O'Conchubar
    and the men of Connacht, and goes west into Munster with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Connacht party drives animals together and obtains the hornless bull of
    the Munster hag and her two speckled cows as satisfaction for the Connacht hag's
    basket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When Munster men attack the returning party, the Gilla Decair uses a bow and
    twenty-four arrows to keep them back until O'Conchubar and his people are safe
    in Connacht.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Gilla Decair takes offence because O'Conchubar takes the first drink himself
    instead of giving it to him, and he immediately leaves.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Tadg O'Cealaigh's place, the stranger appears in old striped clothes and
    old shoes, says he is good at tricks, and asks five marks to show one.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stranger demonstrates a rush trick by pressing the two outside rushes
    with his fingertips and blowing away the middle rush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: When one of Tadg's men tries to imitate the rush trick, his fingertips go
    through the palm of his hand; the stranger says he will heal him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The stranger performs an ear trick by taking hold of one ear and wagging it
    while the other remains still.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The stranger casts a thread of silk into the air so that it is fastened to
    a cloud, then sends a hare, a little dog, a serving-boy, and a well-dressed young
    woman up the thread.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Tadg O'Cealaigh delights in watching the figures ascend and listening to the
    sound of the hunt in the air.
  category: action
  evidence_refs:
  - ev:9
