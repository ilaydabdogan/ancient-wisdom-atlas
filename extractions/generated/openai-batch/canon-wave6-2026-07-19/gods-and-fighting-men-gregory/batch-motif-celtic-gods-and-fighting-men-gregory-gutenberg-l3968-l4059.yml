candidate_motifs:
- id: motif:1
  label: Disguised travelling trickster under shifting names
  taxonomy_refs:
  - trickster_boundary
  basis: The same stranger appears in several settings, gives different names, alternates
    apparent incompetence with sudden mastery, disappears suddenly, and performs comic
    tricks.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not explicitly name the stranger's divine identity within
    the supplied excerpt.
- id: motif:2
  label: Magical ascent by a thread to the sky
  taxonomy_refs:
  - ascent
  basis: The stranger casts a silk thread into the air so it is fastened to a cloud,
    and figures climb or run up it.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage presents the ascent as part of a trick performance rather
    than as a journey to a named otherworld.
- id: motif:3
  label: Comic trick that punishes imitation and is followed by healing
  taxonomy_refs:
  - trickster_boundary
  basis: After the stranger's rush trick, a challenger attempts to copy it, injures
    his hand, and the stranger says he will heal him.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The actual healing is announced but not narrated in detail in the excerpt.
- id: motif:4
  label: Helper leaves after denial of honor or precedence
  taxonomy_refs: []
  basis: The Gilla Decair, after defending O'Conchubar's party, takes offence when
