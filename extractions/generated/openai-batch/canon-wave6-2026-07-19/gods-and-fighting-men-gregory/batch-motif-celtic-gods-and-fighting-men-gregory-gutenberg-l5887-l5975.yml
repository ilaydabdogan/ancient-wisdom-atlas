canonical_text:
  quote: ''
  summary: At Samhain, Aillen of the Tuatha de Danaan repeatedly comes from Sidhe
    Finnachaidh, lulls Teamhair to sleep with Sidhe music, and burns it with fire
    from his mouth. The king offers a reward to anyone who can guard Teamhair until
    daybreak. Finn accepts after securing sureties. Fiacha secretly gives Finn a spear
    whose uncovered head, held to the forehead, prevents sleep. Finn resists the enchantment,
    diverts Aillen's flame with his cloak, follows Aillen to Sidhe Finnachaidh, kills
    and beheads him, and returns with the head and musical instruments as proof. Finn
    is then granted the headship of the Fianna, and Goll and the chiefs place their
    hands in his hand.
  language: English
  quote_policy: summarized
