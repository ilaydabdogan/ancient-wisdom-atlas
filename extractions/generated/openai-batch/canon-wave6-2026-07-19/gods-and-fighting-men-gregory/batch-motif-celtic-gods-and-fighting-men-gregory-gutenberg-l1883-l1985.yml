  summary: Brian and his brothers continue an imposed fine by killing a king and taking
    his spear, infiltrating the court of the King of Siogair as paid soldiers to get
    access to two horses and a chariot, seizing that chariot after killing its driver
    and king, and then approaching Easal, King of the Golden Pillars, to demand seven
    pigs either willingly or by battle.
