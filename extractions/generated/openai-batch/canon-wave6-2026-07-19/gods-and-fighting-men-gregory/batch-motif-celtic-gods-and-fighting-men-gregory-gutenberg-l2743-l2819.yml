canonical_text:
  quote: ''
  summary: The Sons of the Gael withdraw by ship to the distance of nine waves from
    shore. The Men of Dea raise an enchanted wind that scatters the ships and causes
    several deaths. Donn accuses the learned men of failing to still the wind, and
    Amergin answers by performing an enchantment over the wind and sea. His speech
    asks that the Gaels reach Ireland, gain places in its landscapes, hold assemblies,
    have kingship at Teamhair, and come to Eriu. The wind and sea become calm, the
    survivors land at Inver Sceine, and Amergin is first to set foot on shore, where
    he recites a poem of self-identification with natural, animal, martial, and cosmic
    powers.
  language: English
  quote_policy: summarized
