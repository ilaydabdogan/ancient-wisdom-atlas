canonical_text:
  quote: ''
  summary: Derg ends a battle by killing Dubh and Donn with one spear-cast, and Ilbrec
    rewards Caoilte with spoils. Later Caoilte, wounded by a poisoned spear in battle,
    travels with Cascorach and Fermaise to the Sidhe hill at Ess Ruadh to seek healing
    from Bebind, who possesses a healing drink and remaining ale of Goibniu. After
    being welcomed and hosted, the visitors help the Tuatha de Danaan against a Lochlann
    force led by a woman-warrior, the King of Lochlann, and Eolus. Cascorach kills
    the woman-warrior, Caoilte kills the king with a spear named Ben-badb, and Fermaise
    kills Eolus; the Lochlann men depart by ship.
  language: English
  quote_policy: summarized
