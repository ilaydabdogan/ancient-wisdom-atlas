- id: ev:8
  type: summary
  locator: lines 9243-9252
  quote_or_summary: Cascorach and Fermaise explain their willingness to help; Caoilte
    tells the cause of his journey; the hosts promise to heal him, and all enter the
    hill for three days and three nights of drinking and pleasure.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 9253-9260
  quote_or_summary: A woman-warrior comes every year with Lochlann ships to attack
    the Tuatha de Danaan; she was reared by a woman who knew all enchantments, knows
    the precious things in the Sidhe hills, and would carry them away.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 9260-9263
  quote_or_summary: A messenger comes to the hill door reporting that the harbour
    is full of ships and that a great army has landed with the woman-warrior.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 9264-9269
  quote_or_summary: Cascorach goes out against the woman-warrior using a shield borrowed
    from Donn son of Midhir; despite her taunts, he kills her and leaves her on the
    strand with sea foam washing up to her.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 9270-9274
  quote_or_summary: Caoilte goes out in a chariot belonging to Midhir of the Yellow
