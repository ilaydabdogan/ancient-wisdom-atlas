  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 9274-9278
  quote_or_summary: Fermaise looks for Eolus, recognizes him by a gold head-band,
    green armour, and red shield, and kills him with a cast of a five-pronged spear.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
