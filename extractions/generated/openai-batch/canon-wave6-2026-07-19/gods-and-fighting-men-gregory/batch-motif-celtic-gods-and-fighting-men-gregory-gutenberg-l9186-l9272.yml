candidate_motifs:
- id: motif:1
  label: single weapon-cast kills two champions
  taxonomy_refs: []
  basis: Derg throws one spear-cast that kills both Dubh and Donn and ends the battle.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Limited to this passage; no broader comparative identification is asserted.
- id: motif:2
  label: rewarding a helper with enchanted arms and ninefold wealth
  taxonomy_refs:
  - sacred_exchange
  basis: After the battle, Ilbrec gives Caoilte an enchanted spear and sets of nine
    cloaks, swords, and hounds.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The exchange is explicit, but the taxonomy link to sacred_exchange is
    a broad functional classification.
- id: motif:3
  label: poisoned wound prompts journey to otherworld healing place
  taxonomy_refs:
  - mystical_quest
  basis: Caoilte receives a poisoned spear wound and goes to the Sidhe hill at Ess
    Ruadh to seek Bebind's healing drink.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the journey as a search for healing, not as an initiation
    or descent.
- id: motif:4
  label: healing drink kept among the Tuatha de Danaan
  taxonomy_refs: []
  basis: Bebind has the drink of healing of the Tuatha de Danaan and what remains
    of the ale of Goibniu.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No effect of the drink is narrated within this line range beyond the promise
    of healing.
- id: motif:5
  label: hospitality in a Sidhe hill before renewed conflict
  taxonomy_refs:
  - sacred_exchange
  basis: The travelers are welcomed, enter the hill, and spend three days and nights
    at drinking and pleasure before helping against the attackers.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The hospitality-help relationship is present, but the exact obligation
    is stated generally rather than as a formal bargain.
- id: motif:6
  label: woman-warrior with enchantment knowledge attacking sacred or otherworld holdings
  taxonomy_refs:
  - wisdom
  basis: The woman-warrior is reared by a woman who knows all enchantments, knows
    precious things in the Sidhe hills, and comes with Lochlann ships to attack the
    Tuatha de Danaan.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The taxonomy link to wisdom refers only to knowledge of enchantments;
    the passage does not present her as a wisdom figure in a moral or teaching role.
- id: motif:7
  label: defeat of invading army by killing three leaders
  taxonomy_refs: []
  basis: Cascorach, Caoilte, and Fermaise kill the woman-warrior, the King of Lochlann,
    and Eolus; after the three leaders are gone, the army withdraws.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The woman-warrior is one of the three leaders implied by the withdrawal
    notice, but the passage identifies the three leaders collectively only after the
    killings.
- id: motif:8
  label: musician proves capable in combat
  taxonomy_refs: []
  basis: Cascorach is introduced as a musician with a harp and later goes alone against
    the woman-warrior and kills her.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage does not say that music itself contributes to the combat.
