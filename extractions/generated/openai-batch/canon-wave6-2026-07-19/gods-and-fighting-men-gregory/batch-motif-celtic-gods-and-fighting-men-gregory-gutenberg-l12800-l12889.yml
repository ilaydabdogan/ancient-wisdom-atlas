canonical_text:
  quote: ''
  summary: Grania arranges a year-long feast for the High King and Finn. On the last
    night, Diarmuid repeatedly hears hounds, is urged by Grania not to go and to take
    stronger weapons, but chooses lesser weapons and a hound. He goes to Beinn Gulbain,
    meets Finn, hears of the earless Green Boar and bonds against hunting pigs, and
    refuses to leave. His hound and weapons fail against the boar; he clings to it
    as it runs to Ess Ruadh and back. The boar fatally rips him open, and Diarmuid
    kills it with the hilt of his broken sword, giving the place the name Rath na
    h-Amhrann.
  language: English
  quote_policy: summarized
