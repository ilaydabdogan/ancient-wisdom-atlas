canonical_text:
  quote: ''
  summary: Bran son of Febal hears enchanting music, finds a silver branch with white
    blossoms, and receives a song from a strange woman describing Emhain and urging
    him to voyage over the sea to the Land of Women. Bran departs with companions,
    encounters Manannan riding in a chariot over the sea and describing the sea as
    a flowered plain, and later reaches the Island of Joy, where one of his men joins
    the laughing inhabitants and is left behind.
  language: English
  quote_policy: summarized
