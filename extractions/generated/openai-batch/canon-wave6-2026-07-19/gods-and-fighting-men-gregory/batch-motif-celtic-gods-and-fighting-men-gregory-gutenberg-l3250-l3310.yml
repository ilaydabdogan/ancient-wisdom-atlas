canonical_text:
  quote: ''
  summary: The passage describes the Morrigu, her dwelling at Teamhair before the
    Gael, a marvelous cooking-spit, a nine-ribbed spit used by outlaws, the killing
    of her son Mechi whose three hearts held serpent shapes, and several episodes
    in which the Morrigu intervenes in war, cattle-taking, transformation, and battle
    in bird or crow form. It also briefly notes Badb and Brigit appearing in battle
    contexts.
  language: English
  quote_policy: summarized
