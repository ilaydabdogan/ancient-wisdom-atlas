canonical_text:
  quote: ''
  summary: Diarmuid asks the Surly One for berries from the quicken-tree because Grania
    desires them. The Surly One refuses, fights Diarmuid, and is killed. Diarmuid
    has the body hidden, plucks berries for Grania and the sons of Morna, and sends
    berries to Finn with instructions that the young men claim the killing. Finn recognizes
    Diarmuid’s hand-smell on the berries, leads the Fianna to Dubhros, and surrounds
    the quicken-tree where Diarmuid and Grania are in the tree-top bed. Finn and others
    play chess below while Diarmuid, hidden above, sees a winning move but is heard
    only by Grania.
  language: English
  quote_policy: summarized
