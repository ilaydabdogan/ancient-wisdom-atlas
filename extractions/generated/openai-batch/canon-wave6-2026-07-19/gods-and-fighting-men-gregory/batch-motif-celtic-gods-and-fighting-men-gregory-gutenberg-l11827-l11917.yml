canonical_text:
  quote: ''
  summary: Diarmuid returns to Grania while Muadhan catches salmon and keeps watch.
    Diarmuid meets strangers or Green Champions seeking news of the grandson of Duibhne,
    performs dangerous spear and sword feats that challengers imitate with fatal results,
    later arms himself, refuses to betray the protected man, defeats many Green Champions,
    and finally wrestles and binds Dubh-chosach, Fionn-chosach, and Treun-chosach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diarmuid returns to Grania, and Muadhan catches three salmon for a meal and
    keeps watch through the night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diarmuid goes early to a hill, where three strangers approach and ask for
    news of the grandson of Duibhne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Diarmuid removes his arms and most clothing, plants the Crann Buidhe spear
    point-up in the earth, leaps onto its point, and comes down unwounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A young man of the Green Champions dismisses the feat, imitates it, lands
    heavily on the spear point, and is killed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Diarmuid sets the Mor-alltach sword edge-up between two forked poles and walks
    on it three times; an opposing man tries the feat and is cut in two.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Diarmuid puts on battle clothes, takes the sword of Angus and two named spears,
    wakes Grania, and tells her he is armed from fear of enemies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Green Champions ask where the grandson of Duibhne is so they can bring
    his head to Finn, and Diarmuid refuses to betray him, saying the man's life and
    body are under the protection of his valour.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When threatened, Diarmuid draws the Mor-alltach, kills the nearest opponent,
    attacks the host of Green Champions, and leaves only the three kings and a few
    others able to escape to the ships.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Diarmuid returns unwounded to Grania and Muadhan, who welcome him, and the
    group eats and spends the night there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The next morning Diarmuid strikes his shield with a blow that makes the strand
    shake with sound, and Dubh-chosach comes ashore to fight him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Diarmuid and Dubh-chosach throw aside their weapons and wrestle until Diarmuid
    throws him down and binds him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fionn-chosach and Treun-chosach come one after another to fight Diarmuid,
    and he binds them in the same way, saying the bonds are a worse punishment than
