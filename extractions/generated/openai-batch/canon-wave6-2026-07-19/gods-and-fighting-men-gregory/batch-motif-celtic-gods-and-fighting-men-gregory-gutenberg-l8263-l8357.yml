canonical_text:
  quote: ''
  summary: After a great battle, the Fianna search for their dead and wounded. Credhe,
    wife of Cael, looks for him and observes animal scenes of threatened young and
    grieving mates that she connects to her own love and grief. Fergus tells her that
    Cael and Finnachta Fiaclach drowned one another. Cael's body is brought ashore;
    Credhe keens over him in a lament filled with waves, birds, and deer imagery.
    She lies beside Cael and dies of grief; they are buried together under a stone
    raised by Caoilte. The battle's aftermath leaves broken weapons and bodies, and
    the Fianna gain spoils, renown, and charge of Ireland until their last battle
    at Gabhra.
  language: English
  quote_policy: summarized
