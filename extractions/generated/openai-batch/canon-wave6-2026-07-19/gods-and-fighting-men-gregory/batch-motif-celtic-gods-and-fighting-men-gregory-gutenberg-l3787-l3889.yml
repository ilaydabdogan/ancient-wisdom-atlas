canonical_text:
  quote: ''
  summary: 'The passage recounts traditions about Manannan son of Lir: his reported
    death and burial that causes a lake to rise; his later interventions in Irish
    stories; his possible role in the deaths of the sons of Usnach; his possible identity
    with Culain the Smith; Conchubar’s encounter with the sea-queen Tiabhal and the
    making of a victorious shield; the loss of Manannan’s hounds while hunting a destructive
    pig; the abduction and drowning of Tuag; and the emergence of three cows from
    the sea whose paths create roads in Ireland.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manannan is said to have made dwelling places for the Tuatha de Danaan and
    then gone out of Ireland; some reported that he died in battle and was buried
    standing on his feet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Manannan’s standing burial, a lake is said to have burst up beneath
    his feet in a place formerly described as a red bog, and the lake received one
    of his names.
  category: setting
  evidence_refs:
