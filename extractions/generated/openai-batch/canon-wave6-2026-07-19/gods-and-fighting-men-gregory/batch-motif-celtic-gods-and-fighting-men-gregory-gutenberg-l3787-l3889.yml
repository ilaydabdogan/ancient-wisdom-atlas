candidate_motifs:
- id: motif:1
  label: Burial that generates a lake and place-name
  taxonomy_refs: []
  basis: Manannan’s standing burial is followed by a lake bursting up beneath his
    feet and being named from one of his names.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as one reported tradition and does not generalize
    it into a wider motif family.
- id: motif:2
  label: Shape-changing supernatural agent
  taxonomy_refs:
  - shapeshifter
  basis: The passage says Manannan had many shapes, describes his hare appearance,
    identifies Culain as possibly Manannan, and describes Fer Ferdiad taking a woman’s
    shape at Manannan’s direction.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: high
  cautions: The Culain-Manannan identity is explicitly uncertain in the passage.
- id: motif:3
  label: Magical battle aid received through a sea-woman
  taxonomy_refs:
  - sacred_exchange
  basis: After Conchubar binds and then releases Tiabhal, she tells him to mark his
    shield with her likeness and name, promising that it will weaken enemies and strengthen
    his people; the shield then brings victory.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not use formal exchange terminology; the exchange pattern
    is inferred from release followed by instruction and benefit.
- id: motif:4
  label: Enchanted incapacitation causing warriors to destroy one another
  taxonomy_refs: []
  basis: The sons of Usnach are blinded in one account and strike one another instead
    of their enemies, falling by one another’s hands.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: An alternative account in the same passage attributes their deaths to
    Cathbad’s sea-enchantment rather than Manannan’s blindness.
- id: motif:5
  label: Abduction of a guarded young woman under sleep-spell
  taxonomy_refs: []
  basis: Tuag is guarded by daughters of kings, but Fer Ferdiad enters in woman’s
    shape, sings a sleep-spell, and carries her away while she sleeps.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not present Tuag as a beloved, so the available stolen-beloved
    taxonomy is not applied.
- id: motif:6
  label: Otherworld journey attempt interrupted by fatal wave
  taxonomy_refs: []
  basis: Fer Ferdiad intends to take Tuag by boat to the Land of the Ever-Living Women,
    but a flood-tide wave drowns her before departure.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The destination is named, but the journey is not completed.
- id: motif:7
  label: Animal pursuit explaining place names
  taxonomy_refs: []
  basis: Manannan’s hounds pursue a destructive pig; their encounter at the lake explains
    the names Muc-inis, the Pig’s Island, and Loch Conn, the Lake of the Hounds.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an etiological pattern within the passage; no supplied taxonomy
    family directly matches it.
- id: motif:8
  label: Sea-emerging animals creating roads
  taxonomy_refs: []
  basis: Manannan’s red, white, and black cows come out of the sea, and roads open
    before them where the passage says there had been no roads in Ireland.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not state a broader cosmological meaning for the cows
    or their colors.
- id: motif:9
  label: Transmission of martial knowledge by an otherworld figure
  taxonomy_refs:
  - wisdom
  basis: Manannan teaches Diarmuid the use of weapons and Cuchulain the use of the
    Gae Bulg; Culain, possibly Manannan, is also linked with Cuchulain’s training.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage gives brief notices rather than a full instruction narrative.
comparison_claims:
- id: claim:1
  claim: 'The passage itself preserves two functional variants for the deaths of the
    sons of Usnach: Manannan’s temporary blindness and Cathbad’s sea-enchantment both
    remove the warriors’ ability to fight normally and lead to their deaths.'
  claim_level: same_function
  target: 'In-passage variant attribution: Manannan’s blindness versus Cathbad the
    Druid’s sea-enchantment'
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison of variants reported inside the passage, not a
    claim about historical relationship or external sources.
- id: claim:2
  claim: 'Several episodes in the passage share a shapeshifting pattern: Manannan’s
    hare appearance, the report that Culain may be Manannan because Manannan has many
    shapes, and Fer Ferdiad’s woman-shape disguise.'
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The Culain identification is hedged by the passage, and Fer Ferdiad
    rather than Manannan performs the woman-shape disguise.
- id: claim:3
  claim: 'The passage repeatedly uses water settings or events as thresholds or causes
    of transformation: a lake rises from Manannan’s burial, a sea-enchantment surrounds
    warriors, a sea-woman grants shield power, Tuag is drowned by a wave before an
    intended otherworld journey, and cows emerge from the sea to open roads.'
  claim_level: same_function
  target: water as boundary or transformative medium within the passage
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies repeated water imagery, but it does not explicitly
    state a single symbolic interpretation connecting all instances.
