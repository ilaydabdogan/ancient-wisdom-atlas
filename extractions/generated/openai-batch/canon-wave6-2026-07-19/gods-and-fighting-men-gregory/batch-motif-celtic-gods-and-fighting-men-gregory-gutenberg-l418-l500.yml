canonical_text:
  quote: ''
  summary: The preface argues that Gaelic-speaking Ireland has inherited a popular
    literature made over generations; stories of Finn, Cuchulain, the Fianna, and
    other heroes have shaped communal ideals, aristocratic self-presentation, and
    Irish political memory. It gives examples of public heroic conduct, including
    O'Connell, Alexander, and the dying Osgar. It then describes a boy near the Hill
    of Allen who does not yet know Finn and Oisin stories but is learning Irish, and
    anticipates renewed transmission of those stories to children and renewed attachment
    to storied Irish places.
  language: English
  quote_policy: summarized
