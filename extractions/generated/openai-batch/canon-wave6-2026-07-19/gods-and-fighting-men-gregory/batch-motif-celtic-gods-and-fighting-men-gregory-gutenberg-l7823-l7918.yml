canonical_text:
  quote: ''
  summary: 'In an ongoing battle, Finn sends Fergus to count the remaining Fianna
    and summon the King of the World. The King of the World lists his surviving forces
    and chief fighters, including the King of Lochlann and his three sons. The sons
    of the King of Lochlann enter combat in sequence: Forne is killed by Oisin after
    Fergus exhorts him; Tocha seeks vengeance and is killed by Lugaidh''s Son; Mongach
    of the Sea advances with a many-chained iron flail, and Fidach asks Fergus to
    praise him before he fights.'
  language: English
  quote_policy: summarized
