    spits, and pots, turns quickly, and alternates between lying with cinders and
    rising with flame.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Dagda made a vat for his daughter Ainge; it dripped during the flood tide
    but not during the ebb tide.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gaible stole Ainge's bundle of twigs, hurled it away, and a beautiful wood
    grew where it fell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Len Linfiaclach, smith of the Brugh, lived in the lake and made bright vessels
