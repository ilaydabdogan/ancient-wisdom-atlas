- id: obs:1
  text: The Dagda is said to have his house at Brugh na Boinne, with named interior
    and nearby features including halls, a bed, a birthplace, a prison, hills, and
    a valley associated with a sea-turtle.
  category: setting
  evidence_refs:
  - ev:1
