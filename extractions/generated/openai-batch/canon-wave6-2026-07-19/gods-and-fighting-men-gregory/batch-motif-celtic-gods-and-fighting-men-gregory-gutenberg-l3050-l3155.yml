canonical_text:
  quote: ''
  summary: The passage describes the Dagda's dwelling and household at Brugh na Boinne,
    wondrous objects and feats associated with his people, Angus's acquisition of
    the Brugh through Manannan's aid and a day-and-night wordplay, and the later killing
    of the Dagda's son Aedh by Corrgenn followed by a corpse-bearing punishment ending
    in Corrgenn's death.
  language: English
  quote_policy: summarized
