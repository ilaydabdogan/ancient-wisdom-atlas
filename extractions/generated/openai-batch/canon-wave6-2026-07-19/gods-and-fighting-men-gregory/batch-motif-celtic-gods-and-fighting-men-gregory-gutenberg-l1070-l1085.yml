  quote: ''
  summary: 'Bres''s father asks why Bres was driven from the country he ruled. Bres
    says his own injustice and hardness caused it: he took the people''s treasures,
    jewels, food, and imposed unprecedented taxes. His father says a ruler should
    value the people''s prosperity and goodwill over kingship, rejects Bres''s wish
    to take Ireland by force, and sends him to Balor of the Evil Eye for advice and
    help.'
