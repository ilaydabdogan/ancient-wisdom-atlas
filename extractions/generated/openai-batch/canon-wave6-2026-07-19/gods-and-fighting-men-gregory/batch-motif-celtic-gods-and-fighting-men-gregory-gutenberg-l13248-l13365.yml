canonical_text:
  quote: ''
  summary: While the Fianna are gathered on a hill after Tailc's defeat, Meargach
    of the Green Spears arrives with an army and demands Finn. Finn says Tailc was
    killed by Osgar, and Meargach chooses combat for satisfaction. Osgar kills Meargach
    after a three-day fight. Meargach's sons then seek vengeance; Goll kills Ciardan,
    and Conan beheads Liagan before a fair fight begins. As the armies prepare to
    attack, Ailne of the Bright Face arrives crying. Finn tells her that her husband
    and sons have fallen. She keens over their bodies and laments them as her shelter,
    strength, wealth, kin, and 'three Candles of Valour,' while accusing the Fianna
    of treachery.
  language: English
  quote_policy: summarized
