- id: obs:1
  text: Donn lists many named leaders and households of the Tuatha de Danaan and says
    they come every year to destroy the hill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finn tells his people that the sons of Midhir are in great need and oppression
    and that the Fianna themselves have come into danger.
  category: speech
  evidence_refs:
