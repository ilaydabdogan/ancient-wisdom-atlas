canonical_text:
  quote: ''
  summary: Donn names the Tuatha de Danaan leaders who come yearly against the hill.
    Finn and the Fianna join the sons of Midhir, keep watch, and fight an all-night
    battle. After heavy losses, Lir advises the Men of Dea to remove their dead and
    set walls of fire and water. The Fianna remain in the hill for a year through
    repeated attacks, suffer severe wounds, and seek a Tuatha physician who gathers
    dew-wet healing herbs at dawn. Aedh and Flann guide Caoilte to the physician.
  language: English
  quote_policy: summarized
