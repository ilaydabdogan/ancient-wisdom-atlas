canonical_text:
  quote: ''
  summary: 'In this preface passage, Yeats describes heroic creativity and fellowship:
    Adam is cited as creating by imagination, unnamed heroes can make a ship from
    a shaving, the Fianna are characterized by joy, courtesy, fellowship, hunting,
    music, enchantment, and battle, and they are compared with the Arthurian Table
    Round. Oisin and Bran are described as riding or sailing in an enchanted ship
    to a divine country for companionship or unfading love. The passage also recalls
    Osgar''s dying answer to a fellow Fianna member and Goll''s voluntary death by
    hunger in a cave while speaking to his wife.'
  language: English
  quote_policy: summarized
