canonical_text:
  quote: ''
  summary: A man of tricks suspects disorder above, draws in a thread, and finds a
    boy courting a girl while a hound has eaten a hare. In anger he beheads the boy,
    then restores him, first with his face backward and then correctly. The man vanishes.
    The passage identifies this as the way Manannan travelled around Ireland doing
    tricks and wonders, escaping confinement or execution, reviving those he killed
    with an herb from his bag, living on sour milk and crab-apples, and playing surpassingly
    sweet music.
  language: English
  quote_policy: summarized
