canonical_text:
  quote: ''
  summary: Laegaire, son of the king of Connacht, encounters Fiachna of the Sidhe
    near a lake. Fiachna asks for warriors to help recover his wife, who has been
    taken and is now with Goll, king of a people of Magh Mell. Laegaire follows Fiachna
    down into the lake with fifty men, defeats Goll, releases the woman, and returns
    her to Fiachna. Laegaire and his men receive wives and remain there for a year.
    On a mounted return to Ireland, they find the men of Connacht mourning them; Laegaire
    refuses his father's offer to stay and praises the Sidhe realm's music, drinking,
    beloved companionship, and abundance.
  language: English
  quote_policy: summarized
