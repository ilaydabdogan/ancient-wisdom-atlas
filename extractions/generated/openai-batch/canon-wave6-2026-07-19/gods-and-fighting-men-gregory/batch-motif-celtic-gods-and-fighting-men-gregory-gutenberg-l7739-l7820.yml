canonical_text:
  quote: ''
  summary: Finn permits Caoilte to issue a challenge; allies arrive by ship and help
    defeat an opponent. The nine Garbhs keep night watch and fall in battle with the
    King of the Men of Dregan. As losses mount, Fergus reports to the High King, who
    is hostile to Finn and prefers the foreigners to prevail. Fergus shames the High
    King's son away from ball play; the youth gathers young men, goes to Finntraigh,
    insists on battle service despite Finn's caution, and defeats Sligech, King of
    the Men of Cepda.
  language: English
  quote_policy: summarized
