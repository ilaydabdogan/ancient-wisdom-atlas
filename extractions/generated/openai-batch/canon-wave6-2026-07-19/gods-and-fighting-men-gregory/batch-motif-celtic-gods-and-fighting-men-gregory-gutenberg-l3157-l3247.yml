canonical_text:
  quote: ''
  summary: 'The passage first describes the Dagda having builders make a stone rath
    around his son''s grave at the Hill of Aileac. It then presents episodes about
    Angus Og: his appearance to King Cormac with a harp, birds, and prophecy; his
    kiss-birds and frightening presence; his and Midhir''s removal of settlers from
    their plains by lending horses; Enghi''s search for Angus and abduction at a Samhain
    gathering; the spell that turns Derbrenn''s fosterlings into swine, their pursuit
    and quest tasks, and their deaths in a hunt; and Angus bringing Caer Ormaith to
    Brugh na Boinn.'
  language: English
  quote_policy: summarized
