candidate_motifs:
- id: motif:1
  label: divine father mourning a dead child with a grave monument
  taxonomy_refs:
  - divine_parent_child
  basis: The Dagda has a rath built around his son's grave and sheds tears of blood
    because of the son's death.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives only a brief etiological account of the grave and place-name;
    it does not narrate the son's death.
- id: motif:2
  label: epiphany of an otherworld youth to a king with music and prophecy
  taxonomy_refs:
  - wisdom
  basis: Angus appears to Cormac in the Hall of Judgment, plays harp music, and foretells
    future events.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The wisdom taxonomy fit is based on prophecy and royal instruction; the
    passage does not explicitly call the encounter a teaching.
- id: motif:3
  label: kisses transformed into compelling birds
  taxonomy_refs:
  - shapeshifter
  basis: The birds with Angus are described as four of his kisses that turned into
    birds and call after young men.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The transformation concerns kisses becoming birds rather than a human
    figure changing bodily form.
- id: motif:4
  label: frightening divine presence causing domestic animals to flee
  taxonomy_refs: []
  basis: Angus is called the Frightener or Disturber, and plough teams and cattle
    flee before him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly matches this motif.
- id: motif:5
  label: territorial boundary enforcement through disguise and magical transport
  taxonomy_refs:
  - trickster_boundary
  basis: Angus appears in the shape of a land-holder, tells settlers not to stay on
    his plain, and gives a horse to move their goods; Midhir repeats the pattern at
    Magh Find.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports boundary enforcement and altered appearance, but
    does not present elaborate trickery.
- id: motif:6
  label: Samhain gathering abduction and lamenting place-name
  taxonomy_refs:
  - stolen_beloved
  basis: Enghi, who loves Angus, goes to a Samhain gathering and is brought away by
    the sons of Derc; lamentation over the abduction explains the name Cnoguba.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Enghi is a beloved or lover in relation to Angus, not to the abductors;
    the passage does not describe the abductors' motives.
- id: motif:7
  label: spell-made animal transformation through nuts
  taxonomy_refs:
  - shapeshifter
  basis: Dalb Garb makes a spell from nuts of Caill Ochuid that turns Derbrenn's six
    fosterlings into swine.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The transformation is caused by a spell rather than voluntary shapeshifting.
- id: motif:8
  label: enchanted victims sent on conditional quest tasks
  taxonomy_refs:
  - mystical_quest
  basis: The transformed fosterlings ask Angus for help, but he says he cannot help
    until they have shaken the Tree of Tarbga and eaten the salmon of Inver Umaill.
