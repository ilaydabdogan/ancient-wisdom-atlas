canonical_text:
  quote: ''
  summary: The Fianna see blood-colored clouds and prepare for danger. A night watch
    at the cave of Liath Ard is followed by Finn's troubling dream and the approach
    of an army. A woman in a crimson cloak seeks Finn's protection from Tailc, son
    of Treon, whom she says she hates and is fleeing. Tailc arrives and demands battle
    for his wife. After many Fianna are defeated, Osgar fights Tailc for five days
    and nights and beheads him. The woman, seeing the slaughter done on her account,
    dies from shame, deeply grieving the Fianna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fianna are gathered doing feats and casting stones when the Druid of Teamhair
    sees dark clouds of blood overhead and fears nearby trouble and destruction for
    the Fianna.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finn sees the blood-cloud, and the Druid tells him to gather and divide the
    battalions so they can watch for the enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Finn sounds the Dord Fiann, the Fianna answer, and watch duties are assigned;
    Conan is ordered to the darkness of the cave of Liath Ard but refuses to go alone,
    so Aodh Beag and Finn's hounds go with him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: While Conan, Aodh Beag, and the hounds are at Liath Ard, Finn dreams of Aodh
