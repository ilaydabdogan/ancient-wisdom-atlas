    times seeking help from kings and great men, and Finn promises her protection
    even if the seven battalions of the Fianna fall for her sake.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tailc, son of Treon, comes toward the Fianna, gives Finn no greeting, and
    calls for battle on account of his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two large groups of the Fianna are defeated by Tailc and his people before
