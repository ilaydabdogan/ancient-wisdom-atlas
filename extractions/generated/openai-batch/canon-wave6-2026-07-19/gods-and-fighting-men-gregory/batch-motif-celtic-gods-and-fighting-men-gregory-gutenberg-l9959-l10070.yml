canonical_text:
  quote: there was nothing to be seen of the house or of the people of the house,
    but they had all vanished
  summary: Finn receives rich gifts at a gathering, then travels with Caoilte and
    Oisin. At night they find an unknown house with a fire, fierce occupants, disjointed
    and malformed figures, harsh music, and a grey host who prepares raw horse flesh.
    Finn refuses the food, the occupants attack, and the three heroes fight through
    the night until a mist causes them to collapse at dawn. When they recover, the
    house and occupants have vanished and their horses are present. The narrator identifies
    the attackers as Shapes from the Valley of the Yew Tree avenging Cuillen of the
    Wide Mouth. A backstory explains Cuillen's son Fear Og, his excellence, death
    after envy from the Fianna, his burial, Cuillen's grief and death, and Finn's
    reputation as a killer of serpents and Shadow-Shapes.
  language: English
  quote_policy: quoted
