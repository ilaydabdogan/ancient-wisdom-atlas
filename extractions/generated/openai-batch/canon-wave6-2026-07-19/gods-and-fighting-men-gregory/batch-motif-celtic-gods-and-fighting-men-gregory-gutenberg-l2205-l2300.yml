canonical_text:
  quote: ''
  summary: The Fomor land for battle with their leaders. Lugh sends the Dagda to spy
    on and delay them. The Fomor mock the Dagda with an enormous meal and threaten
    him if he leaves any, but he eats it all. On his way back he meets the Morrigu
    washing in a river, and she promises the blood of Indech to the men of Ireland.
    Lugh then gathers Irish specialists, who declare battle powers involving mountains,
    waters, fire, illness, enchantment of terrain, and poetic satire against the Fomor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fomor land at Scetne with their full host and named leaders, including
    Balor, Bres, Indech, and others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lugh sends the Dagda to spy on the Fomor and delay them until the men of Ireland
    can come to battle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Dagda goes to the Fomor camp, asks for a delay, and is granted it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Fomor prepare an enormous broth for the Dagda using new milk, meal, fat,
    and animals, then pour it into a large hole in the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Fomor present the meal as hospitality and Indech threatens to kill the
    Dagda if he leaves any part of it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Dagda uses an oversized ladle to eat the meal and empties the hole, scraping
    up what remains from the earth and gravel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the meal the Dagda sleeps while the Fomor laugh; he later travels home
    with an enlarged belly, rough clothing, and a wheeled fork that leaves a deep
    track.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the way home, the Dagda sees the Morrigu washing herself in the river Unius,
    with her feet at two named places and her hair in nine loosened locks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Morrigu says she will bring the heart's blood of Indech to the men of
    Ireland.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: While the Dagda is away, Lugh gathers Druids, smiths, physicians, law-makers,
    and chariot-drivers of Ireland to plan the battle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mathgen says he can throw down all the mountains of Ireland on the Fomor and
    that twelve chief mountains will fight for Lugh's side.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The cup-bearers say they will put strong thirst on the Fomor, hide water from
    twelve lochs and twelve rivers, and provide drink for the men of Ireland even
    through seven years of battle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Figol says he will send three showers of fire on the Fomor, reduce their bravery
    and strength, put sickness on them and their horses, and increase the strength
    and bravery of the men of Ireland.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Bechulle and Dianan say they will enchant trees, stones, and sods of earth
    so that they become an armed host against the Fomor.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Carpre says he will make a satire at sunrise from a hill-top, with the north
    wind, his back to a thorn-tree, and a stone and thorn in his hand, bringing shame
    and enchantment on the Fomor.
  category: speech
  evidence_refs:
  - ev:12
