canonical_text:
  quote: ''
  summary: 'Lugh comes to Nuada''s feast at Teamhair and is admitted only after showing
    that he can perform all the arts represented in the king''s household. He wins
    at chess, answers Ogma''s stone challenge, plays a harp that controls the listeners''
    emotions and sleep, and is temporarily placed on Nuada''s throne as adviser against
    Fomor oppression. The passage then turns to Lugh''s birth story: Balor of the
    Evil Eye lives in the Tower of Glass on a sea island, where the Fomor seize ships.
    An earlier attack by the sons of Nemed fails when a wave destroys their ships.
    Balor''s deadly eye is explained as the result of poisonous spell-smoke. A Druid
    foretells that Balor will be killed by his grandson, so Balor confines his daughter
    Ethlinn in the tower with twelve women and forbids her any knowledge of men, while
    he continues raiding.'
  language: English
  quote_policy: summarized
