canonical_text:
  quote: "“And in the minute all the years came on me”"
  summary: Oisin tells Patrick how he left the Country of the Young to return to Ireland.
    Niamh warns him not to dismount from the white horse or touch the ground, saying
    he will become old and will never return. In Ireland, Oisin learns that Finn and
    the Fianna belong to the past, finds Finn’s hall at Almhuin gone, disputes with
    Patrick over the Fianna’s fate, then dismounts beside a stone trough full of water
    and is immediately overcome by age as the horse leaves him.
  language: English
  quote_policy: quoted
