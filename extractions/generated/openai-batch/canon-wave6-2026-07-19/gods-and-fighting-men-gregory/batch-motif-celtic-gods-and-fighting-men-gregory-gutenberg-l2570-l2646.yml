canonical_text:
  quote: ''
  summary: After Lugh's long kingship, the Dagda replaces him. Lugh departs from Ireland,
    is associated with Uisnech and a first fire, and is later seen in episodes connected
    with Cuchulain. Conn of the Hundred Battles goes to Teamhair with druids and poets,
    where the Lia Fail screams under his feet and is interpreted as foretelling future
    kings of his race. A mist and darkness come over the company; a rider throws spears,
    then welcomes Conn to a royal house on a beautiful plain. There Conn sees a golden
    tree, a bronze-roofed house, and a young woman with royal drinking vessels. The
    host instructs her to serve Conn and future kings, names Conn's successors, and
    identifies the woman as the Kingship of Ireland and himself as Lugh of the Long
    Hand.
  language: English
  quote_policy: summarized
