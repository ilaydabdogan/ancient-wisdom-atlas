  summary: A young man tells a hound to notice treachery done to it by Finn. The hound
    turns toward the King of Ulster's sons; a dark Druid wind strips their shields
    and swords into a wall of fire. Three men then kill them, and the dog breathes
    on them so that they become ashes with no remains found. The Fianna search Ireland
    for the two sons and return to Finn without news. The three sons of the King of
    Iruath and the hound are not seen again by Finn and the Fianna.
