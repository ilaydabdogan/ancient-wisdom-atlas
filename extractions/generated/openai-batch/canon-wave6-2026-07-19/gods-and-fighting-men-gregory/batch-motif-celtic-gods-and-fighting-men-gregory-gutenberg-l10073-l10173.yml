canonical_text:
  quote: ''
  summary: Angus Og hosts Finn and the Fianna at Brugh na Boinne. A quarrel over hunting
    leads Angus to send a supernatural herd of pigs against Finn’s hounds. The hunt
    causes heavy losses on both sides. Finn orders the pigs burned and their ashes
    thrown into the sea to prevent their revival; Bran obtains unknown logs that make
    the burning possible. Angus later reveals the black pig was his own son and curses
    Bran.
  language: English
