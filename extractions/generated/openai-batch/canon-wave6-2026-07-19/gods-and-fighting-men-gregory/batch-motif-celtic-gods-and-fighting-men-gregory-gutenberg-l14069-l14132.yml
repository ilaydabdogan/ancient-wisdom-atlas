canonical_text:
  quote: There can no healing be done for me now for ever
  summary: Oisin and Caoilte find Osgar mortally wounded after the battle. Osgar speaks
    with them and with Finn, naming the King of Ireland's spear as the fatal wound.
    The Fianna keen him; Osgar dies; graves are made at Gabhra, and Finn is left without
    peace or pleasure.
  language: English
  quote_policy: quoted
