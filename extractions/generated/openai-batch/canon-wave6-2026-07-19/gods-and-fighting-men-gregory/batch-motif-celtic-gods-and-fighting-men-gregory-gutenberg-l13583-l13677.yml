canonical_text:
  quote: ''
  summary: The Grey Man asks to hear Daire's music and temporarily weakens his spells
    on Daire and Finn so Daire can play. The Fianna hear the music, attack Ailne's
    dun, and are overcome by renewed spells, sleep, and captivity. Daire later plays
    music of sweetness, grief, and lamentation while the captives remain imprisoned.
    Conan avoids execution by pleading to be healed, receives a sheepskin covering,
    gains access to Ailne's enchanted cup, hides it, and gives its drink to Finn,
    Osgar, and the Fianna, restoring their appearance and strength.
  language: English
  quote_policy: summarized
