canonical_text:
  quote: ''
  summary: Conn Crither, set as a watchman at the White Strand, falls asleep while
    enemy ships arrive and attack. Ashamed, he arms himself and runs toward the strand.
    Three battle-dressed sisters from Tir nan Og stop him from attacking them and
    promise love, magical armies, a concealing mist, and healing waters. Conn then
    attacks the raiders with the Druid army, routs them, duels the King of the Great
    Plain, and cuts off his head.
  language: English
  quote_policy: summarized
