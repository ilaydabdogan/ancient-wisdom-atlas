canonical_text:
  quote: '"You told no lie indeed," said Patrick.'
  summary: Oisin, living in Patrick's house, is accused of lying about the enormous
    food of the earlier Fianna age. He selects and raises a hound, recovers hidden
    Fianna objects, summons great birds with a horn, and proves his claim by showing
    Patrick a huge bird quarter, rowan berry, and ivy leaf. In a later episode, blind
    Oisin is deceived by servants about the weather and discovers the deception when
    one servant imitates rain with water and a birch broom.
  language: English
  quote_policy: quoted
