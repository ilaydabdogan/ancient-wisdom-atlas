canonical_text:
  quote: ''
  summary: During a hunt, Finn and members of the Fianna pursue a fawn to Slieve-nam-Ban,
    where it vanishes into the earth. A snowstorm drives them toward shelter, and
    Caoilte finds a lighted Sidhe house. Finn and his men are welcomed, fed, and told
    by Donn son of Midhir that Donn and his brothers are exiled sons of Midhir, under
    attack by the Men of Dea. Donn explains that the fawn was a girl sent in animal
    shape to lure Finn to them before an expected battle.
  language: English
  quote_policy: summarized
