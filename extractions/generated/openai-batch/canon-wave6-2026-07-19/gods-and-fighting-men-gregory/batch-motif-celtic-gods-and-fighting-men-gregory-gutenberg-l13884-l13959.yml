canonical_text:
  quote: ''
  summary: Goll kills Cairell, Finn's son, in a fight by the sea. Goll withdraws to
    a sea-cave, mistakes Osgar's visit for an attack, and brings Finn's renewed anger
    on himself. Finn sets guards around the cave. Goll refuses to escape and remains
    without food or drink while sand blinds him. His wife pleads with him to come
    to her and offers healing, but he refuses and tells her to go to Aodh. After twelve
    days he dies on the rocks, and his wife keens him. Conan, Goll's brother, vows
    revenge, while Garraidh refuses to join him. Conan's own end is said to be unknown,
    with rival local claims about his burial in Burren.
  language: English
  quote_policy: summarized
