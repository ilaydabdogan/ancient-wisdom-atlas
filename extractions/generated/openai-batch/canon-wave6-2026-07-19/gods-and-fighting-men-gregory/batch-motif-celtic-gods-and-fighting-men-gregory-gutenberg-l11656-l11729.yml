canonical_text:
  quote: ''
  summary: 'Diarmuid arms himself after Angus and Grania leave, tests the occupants
    of seven doors, refuses help from friendly groups, identifies Finn''s guarded
    door, and escapes past Finn by a high leap using his spear-staves. He reunites
    with Angus and Grania at Ros-da-Shoileach in a cabin with fire and food. In the
    morning Angus gives Diarmuid advice for flight: avoid single-access places and
    do not cook, eat, sleep, and rise in the same place.'
  language: English
  quote_policy: summarized
