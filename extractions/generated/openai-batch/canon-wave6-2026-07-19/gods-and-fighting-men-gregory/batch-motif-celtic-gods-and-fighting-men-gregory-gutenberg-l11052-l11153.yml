canonical_text:
  quote: ''
  summary: Finn and a chosen party pursue the track of the Hard Servant by sea, reach
    a cliff and slippery rock, and Diarmuid climbs it with Manannan's staves of power.
    Alone beyond the rock, Diarmuid enters a wooded place, finds a tree, horn, and
    enchanted well, and fights a Man of Enchantments who claims the thickets and water.
    After repeated combats, Diarmuid falls into the well while trying to stop the
    Enchanter and follows him to a flowery plain with a royal city, where an army
    attacks him.
  language: English
  quote_policy: summarized
literal_observations:
