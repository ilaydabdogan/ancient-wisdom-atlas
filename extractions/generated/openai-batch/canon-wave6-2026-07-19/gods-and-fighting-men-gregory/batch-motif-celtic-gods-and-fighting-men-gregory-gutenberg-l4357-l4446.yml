canonical_text:
  quote: ''
  summary: In Manannan's house, a pig in a cauldron cooks only as true stories are
    told. The stories describe inexhaustible or renewing treasures. Cormac recounts
    the taking of his wife, son, and daughter and his pursuit of them. The host sings
    him to sleep; he wakes reunited with his family. A gold cup is shown to break
    at lies and mend at truths, and Manannan gives Cormac the cup and a music-giving
    branch until Cormac's death. Manannan reveals himself as king of the Land of Promise,
    explains earlier wonders including the Well of Knowledge and its five streams,
    and Cormac returns to Teamhair with family and gifts.
  language: English
  quote_policy: summarized
