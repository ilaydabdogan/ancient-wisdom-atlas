canonical_text:
  quote: ''
  summary: Finn leads the Fianna from Almhuin on a misty morning to hunt. They encounter
    a strange luminous beast pursued by a Red Woman, who says her life and her sons'
    lives depend on following it until it falls. After Finn defies her warning, she
    turns into a great water-worm and attacks him, but Bran and Finn overcome her.
    The Fianna pursue the beast through the night by the light of the moons on its
    sides until it enters the foot of Cnoc-na-righ. The Red Woman opens a door in
    the hill with a Druid rod, summons attendants to wash and clothe the Fianna, and
    brings them into a bright hall with a king, musicians, and a laden table.
  language: English
  quote_policy: summarized
