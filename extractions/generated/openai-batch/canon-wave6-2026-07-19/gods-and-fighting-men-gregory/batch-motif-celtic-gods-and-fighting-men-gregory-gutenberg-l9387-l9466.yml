canonical_text:
  quote: ''
  summary: At Cruachan, Caoilte and Cascorach meet Bairnech, who reports annual Samhain
    cattle theft by a woman from the hill of the Sidhe. Cascorach kills the armed
    woman. Bairnech then reports three she-wolves from the Cave of Cruachan that destroy
    sheep; Cascorach identifies them as daughters of Airetach and uses harp music
    to draw them near. After they cast off their wolf-like coverings and appear as
    women, Caoilte kills all three with one spear-cast, and the place receives the
    name Valley of the Shapes of the Wolves.
  language: English
  quote_policy: summarized
