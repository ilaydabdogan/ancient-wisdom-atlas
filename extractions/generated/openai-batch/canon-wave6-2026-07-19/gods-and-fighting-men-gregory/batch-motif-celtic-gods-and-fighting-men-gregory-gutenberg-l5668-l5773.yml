  quote: ''
  summary: The passage recounts Finn’s birth after Cumhal’s death, his secret fostering
    by Bodhmall and Liath Luachra, his childhood hunting and physical training, his
    movements among protectors and employers, public recognition through prowess and
    chess, the avenging of a slain woman’s son and recovery of Cumhal’s treasure-bag,
    the bag’s supernatural origin and contents, and Finn’s delivery of it to Crimall.
  language: English
