  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:11
  type: summary
  locator: 5743-5749
  quote_or_summary: While seeking Crimall in Connacht, Finn hears a lone woman crying
