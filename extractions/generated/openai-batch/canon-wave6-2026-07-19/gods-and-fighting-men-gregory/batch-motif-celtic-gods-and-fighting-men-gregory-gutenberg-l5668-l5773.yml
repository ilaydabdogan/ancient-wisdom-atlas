- id: ev:3
  type: summary
  locator: 5683-5689
  quote_or_summary: After six years, Muirne visits the wood, finds Finn asleep in
    a hunting cabin, lifts and kisses him, sings to him, says farewell to the women,
    and leaves.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:4
  type: summary
  locator: 5690-5694
  quote_or_summary: Finn sees a wild duck on a lake with her clutch, makes a cast
    that cuts her wings, brings her back, and this is called his first hunt.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:5
  type: summary
  locator: 5695-5702
  quote_or_summary: The women train Finn in running, leaping, swimming, switch-play
    around a tree, keeping hares in a field, and swimming by being thrown into water.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:6
  type: summary
  locator: 5703-5711
  quote_or_summary: Finn hides with poets; Fiacuil kills the poets, spares Finn, brings
    him to a house in a cold marsh, and later returns him to Bodhmall and Liath Luachra.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:7
  type: summary
  locator: 5712-5721
  quote_or_summary: Finn grows straight, strong, fair-haired, and beautiful; he catches
    two stags from a herd of mountain deer, hunts daily, and is told to leave because
    the sons of Morna are watching to kill him.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:8
  type: summary
  locator: 5722-5729
  quote_or_summary: At Magh Lifé, young lads challenge Finn to swim; he beats them,
    they call him fair and well shaped, and the passage says he gained the name Finn,
    meaning Fair.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:9
  type: summary
  locator: 5730-5733
  quote_or_summary: At Loch Lein, Finn serves the King of Finntraigh; no hunter is
    like him, and the king says he would be Cumhal’s son if Cumhal had left one.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary from supplied passage.
- id: ev:10
  type: summary
  locator: 5734-5742
  quote_or_summary: In Carraighe, Finn serves the king who married Muirne; after Finn
