candidate_motifs:
- id: motif:1
  label: Endangered heroic child hidden and fostered in the wilderness
  taxonomy_refs:
  - departure
  basis: Finn is removed from his mother and raised secretly in the woods because
    his father’s enemies threaten him.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives no miraculous conception or birth event; the motif is
    based on concealment and fosterage rather than explicit miracle.
- id: motif:2
  label: Childhood initiation through hunting, pursuit, and swimming trials
  taxonomy_refs:
  - initiation
  basis: Finn’s fosterers train him through physical challenges, and his early hunting
    successes mark increasing competence.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage presents practical training rather than a formal ritual initiation.
- id: motif:3
  label: Name gained through public display of excellence and appearance
  taxonomy_refs: []
  basis: Finn wins a swimming contest; onlookers remark that he is fair and well-shaped,
    and the passage says this is when he received the name Finn, meaning Fair.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No broader taxonomy reference is assigned because the available list has
    no specific naming motif.
- id: motif:4
  label: Concealed identity recognized by prowess and lineage clues
  taxonomy_refs:
  - royal_legitimacy
  basis: Kings identify or suspect Finn’s connection to Cumhal and Muirne after seeing
    his exceptional hunting and chess skill.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: 'The taxonomy reference is approximate: Finn’s legitimacy is heroic and
    lineage-based, not explicitly royal in this passage.'
- id: motif:5
  label: Avenging combat leads to recovery of paternal treasure
  taxonomy_refs:
  - return
  basis: Finn kills the champion who had slain the woman’s son and who had previously
    wounded Cumhal and carried off Cumhal’s treasure-bag.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:16
  confidence: medium
  cautions: The passage does not explicitly call the act vengeance for Cumhal; it
    presents both the woman’s complaint and the champion’s earlier role in Cumhal’s
    battle.
- id: motif:6
  label: Woman transformed into crane and materialized as talismanic skin
  taxonomy_refs:
  - shapeshifter
  basis: The treasure-bag is made from crane skin that had once been Aoife’s skin
    after she was put into the shape of a crane.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage says Aoife was transformed into crane shape; it does not say
    she voluntarily shape-shifted.
- id: motif:7
  label: Tide-governed magical container
  taxonomy_refs:
  - ark_vessel
  basis: The crane-skin bag contains treasures at full tide and is empty at ebb tide.
  evidence_refs:
