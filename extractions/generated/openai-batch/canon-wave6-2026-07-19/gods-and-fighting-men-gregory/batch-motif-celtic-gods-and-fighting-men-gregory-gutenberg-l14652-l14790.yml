canonical_text:
  quote: ''
  summary: Patrick tries to convert Oisin and bring him to baptism. In a poetic argument,
    Patrick urges Oisin toward psalms, God, and Christian judgment, while Oisin answers
    by praising Finn, the Fianna, their music, hounds, battles, generosity, and hunting
    life. Patrick says Finn is bound in Hell because he gave no heed to God; Oisin
    rejects or laments this and imagines the Fianna freeing Finn from the house of
    pain.
  language: English
  quote_policy: summarized
