    but Oisin answers everything Patrick says.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Patrick tells Oisin to rise and listen to the Psalm and says Oisin's old strength
    is gone; Oisin replies that his strength is gone because Finn has no armies living
    and that clerical music is not sweet to him after Finn's music.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Oisin names sounds he prefers to clerical music: blackbird, Dord Fiann, thrush,
    boats striking the strand, hounds, Little Nut''s tunes, and Finn''s twelve hounds.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oisin recounts victories and expeditions involving small Fianna forces, foreign
