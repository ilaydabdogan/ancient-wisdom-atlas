canonical_text:
  quote: ''
  summary: Etain encounters a man who first appears like Ailell and later identifies
    himself as Midhir of Bri Leith, claiming to have been her first husband and to
    have caused and ended Ailell's sickness of desire. Later, at Teamhair, Midhir
    alone is visible and audible to Etain as he invites her to his wonderful country.
    Etain says she will go only if Eochaid permits it. Midhir then comes as a strange
    armed man to Eochaid, brings a jeweled chessboard, plays for stakes, loses twice,
    and is assigned horses and difficult landscape tasks.
  language: English
  quote_policy: summarized
