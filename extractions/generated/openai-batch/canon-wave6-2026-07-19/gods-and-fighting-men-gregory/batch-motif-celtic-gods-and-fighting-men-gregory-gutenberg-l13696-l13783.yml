canonical_text:
  quote: ''
  summary: Finn questions Black Garraidh about the killing of Finn's father Cumhal,
    and Garraidh admits that he and the sons of Morna took part in Cumhal's death
    after years of exile. Later, at a feast at Almhuin, a crier orders silence, Fergus
    recites praise-poems and is rewarded, and Goll receives gold tribute from Lochlann.
    Finn challenges Goll's rent on Lochlann, and Goll recounts foreign wars, Cumhal's
    death, and the difference between his own rent and Finn's protection tribute.
  language: English
  quote_policy: summarized
