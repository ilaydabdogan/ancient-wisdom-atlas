canonical_text:
  quote: '"And it is she that changes herself into all shapes"'
  summary: Finn and the Fianna encounter a richly dressed woman who claims to be Etain
    and challenges them to race. After she leads them to the hill of the Sidhe at
    Beinn Edair, Aedh reveals that the racer was Be-mannair, a shapeshifting messenger
    of the Tuatha de Danaan, acting in Etain's shape. Etain chooses Osgar rather than
    a rich royal suitor, secures an oath and sureties, marries him, and later dies
    of grief when she sees him grievously wounded, though he does not die then.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Slieve Crot, Finn and his men see a woman waiting, richly dressed with
    a crimson fringed cloak, gold brooch, and yellow gold forehead band.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says her name is Etain of the Fair Hair, daughter of Aedh of the
    White Breast from the hill of the Sidhe at Beinn Edair, and says she has come
    to ask a man of the Fianna to race her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman says long or short ground is the same under her feet, and all the
    Fianna present run with her from Slieve Crot by way of Badhamair and Ath Cliath
    to Beinn Edair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Beinn Edair the Fianna receive hospitality, including meat, wine, and water
    for washing their feet; a fair-haired girl with a white silver cup serves drink
    by the vats.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Finn thinks the girl serving drink is the racing girl, but Aedh says she is
    not and calls the serving girl the slowest woman among them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aedh identifies the racer as Be-mannair, daughter of Ainceol, a woman-messenger
    of the Tuatha de Danaan who changes into all shapes, including a fly and a true
    lover.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Aedh says the actual Etain of the Fair Hair is his daughter, a darling of
    the Tuatha de Danaan, that her lover is Osgar, and that she sent Be-mannair in
    her own shape.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The son of the High King of Ireland offered a large bride-price for Etain,
    including lands and his own weight in gold, but the offer was not accepted because
    Etain did not wish it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Etain asks Osgar to promise never to leave her except through her own fault;
    Osgar agrees, and sureties are given by Goll for the sons of Morna and by Finn
    for the Fianna of Ireland.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A wedding-feast is held; they remain at Beinn Edair for twenty nights, and
    Finn tells Osgar to bring his wife to Almhuin for the first seven years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After a battle at Beinn Edair, Osgar is badly wounded; Etain sees his altered
