canonical_text:
  quote: ''
  summary: After a battle in which the armies of the World and the Fianna of Ireland
    have fallen together, Finnachta of the Teeth carries the dead King of the World
    toward a ship and says he will return east to report the outcome. Finn, lying
    wounded, asks who remains alive; Fergus reports that only Finnachta and Cael still
    remain apart from the fallen. Cael, mortally wounded, asks Fergus to carry him
    to the sea so he can swim after Finnachta. Cael reaches the ship, seizes Finnachta
    by the wrist, pulls him overboard, and both go down into the sea locked together.
  language: English
