  summary: A champion guides the wounded Diarmuid to a city in Land-Under-Wave, where
    he is healed and feasted. Finn and his people search for Diarmuid, are led by
    the King of Sorcha to his fortified dwelling, and are also feasted. A messenger
    reports an invasion by the High King of Greece; Finn pledges protection to Sorcha
    and helps defeat the invading forces. Diarmuid later arrives at the head of a
    troop of champions, and news is exchanged.
