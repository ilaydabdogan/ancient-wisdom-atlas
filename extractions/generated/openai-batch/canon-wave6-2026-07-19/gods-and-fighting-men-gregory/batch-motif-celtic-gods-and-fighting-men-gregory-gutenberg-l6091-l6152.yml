canonical_text:
  quote: This, now, is the story of the birth of Bran.
  summary: Muirne brings her sister Tuiren to Almhuin. Iollan Eachtach marries Tuiren
    under a pledge to Finn, with Fianna sureties. Uchtdealb, Iollan's jealous Sidhe
    sweetheart, disguises herself as Finn's messenger, lures Tuiren away, and changes
    her into a hound with a dark Druid rod. The hound is left with Fergus Fionnliath,
    proves an excellent hunter, and gives birth to two whelps. When Finn demands the
    pledged return of Tuiren, Iollan obtains Uchtdealb's help by promising to keep
    her as his sweetheart. Uchtdealb restores Tuiren, and the two whelps remain with
    Finn as Bran and Sceolan.
  language: English
  quote_policy: quoted
