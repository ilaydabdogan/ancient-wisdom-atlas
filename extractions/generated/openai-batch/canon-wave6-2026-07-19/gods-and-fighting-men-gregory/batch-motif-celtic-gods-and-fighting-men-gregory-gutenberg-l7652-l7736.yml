canonical_text:
  quote: ''
  summary: News of a battle reaches the King of Ulster. His twelve-year-old son asks
    to aid Finn, is confined by his father, persuades his twelve foster-brothers to
    escape with him, and travels armed to the White Strand. After Dolar Durba kills
    the twelve foster-brothers, the king's son rushes against him. The boy and Dolar
    Durba fight until their weapons break, grapple in the tide, and both drown. At
    ebb-tide their bodies are found locked together, with Dolar Durba beneath the
    boy; the boy is judged victorious, buried, and keened.
  language: English
  quote_policy: summarized
