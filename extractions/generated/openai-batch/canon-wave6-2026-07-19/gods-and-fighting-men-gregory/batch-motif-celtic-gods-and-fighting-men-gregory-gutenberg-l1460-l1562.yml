canonical_text:
  quote: ''
  summary: Bres and his Druids perceive an unusual light and identify it as the shining
    face of Lugh. Lugh comes to the opposing side, claims kinship with both peoples,
    demands the return of Ireland's milch cows, waits for allies, and then battle
    is joined. Lugh attacks Bres, who surrenders and wins protection by promising
    an oath-bound future battle. Afterward Lugh searches for the manner of his father
    Cian's death, hears the earth testify that Cian changed into a pig before being
    killed by the sons of Tuireann, exhumes and mourns the wounded body, reburies
    Cian with keening, a stone, and Ogham, and then at Teamhair asks the assembly
    what vengeance is due for a father's killer.
  language: English
  quote_policy: summarized
