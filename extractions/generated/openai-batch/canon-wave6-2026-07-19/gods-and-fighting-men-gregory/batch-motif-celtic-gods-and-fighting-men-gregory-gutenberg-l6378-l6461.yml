canonical_text:
  quote: ''
  summary: 'The passage recounts several Fianna episodes: Caoilte gathers and contains
    unruly creatures in order to free Finn; Caoilte and his son Colla perform extraordinary
    running feats; Caoilte identifies a distant hunt by hearing alone; Caoilte uses
    Druid herbs in bath water to restore two husbands'' love; and Lugaidh''s Son is
    fostered, armed, joins Finn''s service, and becomes the subject of a complaint
    by the Fianna.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caoilte brings ten hounds of the Fianna and a horse and mare from the horses
    of Manannan, along with other gathered creatures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gathered creatures scatter; Caoilte pursues and recaptures a raven and
    a wild duck, enduring the labor because he wants to set Finn free.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: At Teamhair, the King of Ireland delays Caoilte until morning and gives him
    a house with nine doors for the creatures; they screech and try to escape through
    openings while Caoilte watches outside until sunrise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The collected creatures are called Caoilte's Rabble, and after Finn gains
    freedom they scatter so completely that no two leave Teamhair by the same road.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Caoilte is said to have run from the wave of Cliodna in the south to the wave
    of Rudraige in the north; Colla runs a backward race against three battalions
    of the Fianna for a chessboard and wins, but goes backward into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Caoilte hears a hunt associated with the King of the Luigne of Connacht and
    identifies multiple packs, prey, and following people before Blathmec goes out
    and verifies the description.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Caoilte gives Druid herbs to two unhappy women whose husbands have left them;
    the women put the herbs in bath water, wash in it, and their husbands' love returns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lugaidh's Son, of Finn's blood, is put in Finn's arms as a child, fostered
    by Duban's daughter until his twelfth year, given arms and armour, and then goes
    to Finn and the Fianna.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Finn welcomes Lugaidh's Son; Lugaidh's Son clasps hands with Finn to make
    an agreement of service, stays a year, but is described as sluggish, with few
    hunting kills under his leading, and as beating his servants and hounds.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The three battalions of the Fianna complain to Finn about Lugaidh's Son and
    demand that Finn choose between them and him; when questioned, Lugaidh's Son says
    he does not know the reason except perhaps dislike of his feats and spear-casting
    among them.
  category: speech
  evidence_refs:
  - ev:10
