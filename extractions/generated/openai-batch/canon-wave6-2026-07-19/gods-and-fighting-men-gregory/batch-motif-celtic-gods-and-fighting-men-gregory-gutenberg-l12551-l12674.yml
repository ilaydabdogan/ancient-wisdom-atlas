canonical_text:
  quote: ''
  summary: Diarmuid and Grania wander through Ireland while hiding from Finn, who
    follows them by divination. Grania watches Diarmuid as he sleeps and sings both
    a sleep song and a rousing song. In the cave of Beinn Edair an old woman helps
    them keep watch, but Finn deceives her into revealing Diarmuid's hiding place.
    The old woman returns with a sea-wet cloak and claims terrible weather to keep
    Diarmuid in the cave; Grania tastes the cloak, detects salt water, recognizes
    betrayal, and urges Diarmuid to arm himself.
  language: English
  quote_policy: summarized
