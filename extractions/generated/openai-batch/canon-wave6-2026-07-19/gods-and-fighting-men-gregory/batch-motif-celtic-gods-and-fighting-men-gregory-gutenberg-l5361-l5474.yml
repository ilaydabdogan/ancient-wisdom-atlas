  quote: |-
    "It is bad our stepmother was to us the time she played enchantments on
    us, sending us out like swans upon the sea."
  summary: A storm scatters the enchanted swan-children of Lir on Sruth na Maoile.
    Fionnuala laments, reunites with her brothers, shelters them, and later describes
