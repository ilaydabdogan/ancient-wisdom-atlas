candidate_motifs:
- id: motif:1
  label: messenger summons supernatural allies to battle
  taxonomy_refs: []
  basis: Conn's request is carried through Taistellach, Bran, Dolb, and Bodb Dearg
    until the Tuatha de Danaan gather and arrive as military allies.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage identifies the Tuatha de Danaan as Men of Dea and hidden people,
    but the exact theological status of the group is not interpreted beyond the passage
    wording.
- id: motif:2
  label: reciprocal aid through kinship and love ties
  taxonomy_refs:
  - sacred_exchange
  basis: Dolb argues that the Tuatha de Danaan should help because Irish leaders have
    wives, mothers, foster-mothers, or sweethearts among them, and because the Irish
    have helped the Tuatha de Danaan when they were in need.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents social and kinship obligation rather than a formal
    ritual exchange.
- id: motif:3
  label: hidden under-earth people join surface warfare
  taxonomy_refs: []
  basis: Glas says the arriving force is not the Fianna but men of Ireland who live
    in hidden houses under the earth and have come to give warning of battle.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not describe an entry from the under-earth houses, only
    their identity and dwelling place.
- id: motif:4
  label: warrior refuses departure before taking enemy blood
  taxonomy_refs: []
  basis: Taistellach will not return to Finn until he has wet his sword in the blood
    of an enemy of Ireland, and he then kills Coimhleathan.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The action is martial and vow-like, but no explicit vow formula or ritual
    context is given.
- id: motif:5
  label: champion duel turns a battle
  taxonomy_refs: []
  basis: The matches against the Dog-Head and Cat-Head kings dominate the battle sequence;
    Abarthach's killing of both enemy kings is followed by the flight and destruction
    of their people.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The wider battle is only summarized after the champions' deaths.
- id: motif:6
  label: animal-headed foreign enemy kings
  taxonomy_refs: []
  basis: Two hostile kings are named as rulers of the Men of the Dog-Heads and the
    Men of the Cat-Heads, and their forces oppose the Men of Dea.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage names the groups but does not describe the bodies or appearance
    of individual warriors beyond the group labels.
- id: motif:7
  label: severed head as battle trophy
  taxonomy_refs: []
  basis: Taistellach cuts off Coimhleathan's head in the sea and brings it back to
    land after the duel.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage states the action but does not explain the head's ritual or
    symbolic meaning.
comparison_claims:
- id: claim:1
  claim: The passage supports comparison with a sacred-exchange pattern in which aid
    from otherworld or divine-associated allies is justified by kinship, love, fosterage,
    and prior reciprocal help.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives a social argument for obligation, not a formal exchange
    rite or covenant.
- id: claim:2
  claim: The passage supports comparison with a recurring pattern of hidden under-earth
    allies emerging as a military force on behalf of human or Irish defenders.
  claim_level: same_motif
  target: hidden under-earth helper army pattern
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the internal pattern in this passage;
    no external parallel is supplied in the request.
- id: claim:3
  claim: The passage supports comparison with a champion-combat battle pattern in
    which named duels between representative fighters determine or decisively alter
    the outcome of a larger conflict.
  claim_level: same_function
  target: champion duel as battle-turning pattern
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The final destruction of the opposing force follows the champions'
    deaths, but the passage does not state that the whole war is ended by these duels
    alone.
