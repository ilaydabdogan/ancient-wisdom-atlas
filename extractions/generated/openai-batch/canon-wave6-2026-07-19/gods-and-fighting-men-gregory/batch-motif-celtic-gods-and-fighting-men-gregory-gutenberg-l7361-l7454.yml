canonical_text:
  quote: ''
  summary: Taistellach wins a combat at the White Strand and is sent by Conn Crither
    to summon Bran and the Tuatha de Danaan. Through Bran, Sesnan, Dolb, and Bodb
    Dearg, the Men of Dea gather. Dolb argues that kinship, love, fosterage, and past
    aid bind them to help Ireland. The Tuatha arm themselves, march to the White Strand,
    announce battle to the King of the World, and fight animal-headed enemy kings
    and their red-armed battalions. Abarthach kills the Cat-Head and Dog-Head kings,
    and the Men of Dea rout the enemy, though with losses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taistellach comes to the White Strand as one of Finn's messengers, and Conn
    Crither tells him to return to Finn with news of the situation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taistellach refuses to leave until he has bloodied his sword against an enemy
    of Ireland; he challenges the ships, fights Coimhleathan, cuts off his head in
    the sea, and brings it back to land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Conn Crither sends Taistellach to Bran, son of Febal, at Teamhair Luachra,
    asking him to gather the Tuatha de Danaan for help, and then to go to the Fianna
    of Ireland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bran goes to gather the Tuatha de Danaan, finds Ilbrec, Nemanach, and Sigmall
    at Dun Sesnain, and tells them Conn Crither's situation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sesnan sends his son Dolb to Bodb Dearg at Sidhe Bean Finn to ask him to gather
    the Tuatha de Danaan.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bodb Dearg first says the Tuatha de Danaan are not bound to help the men of
    Ireland, but Dolb replies that Irish kings, princes, and Fianna leaders have wives,
    mothers, foster-mothers, or sweethearts among the Tuatha de Danaan, and that the
    Irish have helped them when needed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bodb Dearg accepts Dolb's argument, sends word throughout the Tuatha de Danaan,
    and they gather to him.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The Tuatha de Danaan spend the night at Dun Sesnain, rise in the morning,
    dress in silk shirts and embroidered coats, and take green shields, swords, and
    spears.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bodb Dearg, Midhir, Lir, Abarthach, Ilbrec, Fionnbhar, Argat Lamh, and the
    Man of Sweet Speech are named among the leaders of the Tuatha de Danaan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The army of the Tuatha de Danaan travels through Ciarraighe Luachra and Slieve
    Mis to the harbour of the White Strand, where Abarthach exhorts them to courage
    and lasting fame.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bodb Dearg sends Glas, son of Dremen, to announce battle to the King of the
    World.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Glas tells the King of the World that the arriving forces are not the Fianna
    but another part of the men of Ireland who live in hidden houses under the earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Comur Cromchenn, king of the Men of the Dog-Heads, and Caitchenn, king of
    the Men of the Cat-Heads, answer the Tuatha de Danaan with five red-armed battalions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Bodb Dearg seeks champions against the Dog-Head and Cat-Head kings; Lir accepts
    the Dog-Head match and Abarthach accepts the Cat-Head match.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Lir fights the Dog-Head king but begins to lose; Ilbrec, Sigmall, the five
    sons of Finnaistucan, and other Men of Dea try to help and are driven off.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After killing the Cat-Head king, Abarthach intervenes between Lir and the
    Dog-Head king, wounds the Dog-Head king with a spear, cuts off both his legs at
    the knees, and then cuts off his head.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the two enemy kings are dead, their people flee; the Men of Dea pursue
    and destroy them, while losing many of their own men.
  category: sequence
  evidence_refs:
  - ev:10
