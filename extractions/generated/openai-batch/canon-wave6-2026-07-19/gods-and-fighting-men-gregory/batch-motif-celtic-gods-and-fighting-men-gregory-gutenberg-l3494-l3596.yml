canonical_text:
  quote: ''
  summary: Etain is described in radiant beauty, identifies herself as daughter of
    Etar of the Sidhe, and becomes Eochaid's wife at Teamhair. At a Samhain-season
    feast, Eochaid's brother Ailell falls in love with her, later wasting away from
    concealed desire. Eochaid and his physician seek the cause; Etain tends Ailell,
    learns that his sickness is love for her, promises a dawn meeting to cure him,
    and Ailell sleeps through the appointed time.
  language: English
  quote_policy: summarized
