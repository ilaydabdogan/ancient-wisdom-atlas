canonical_text:
  quote: ''
  summary: Ciabhan, a beautiful king's son associated with the Fianna, leaves Ireland
    by curragh, is endangered by great waves, and is rescued by an unnamed rider who
    brings him to Manannan's country. In Manannan's city he succeeds at a difficult
    rod-catching feat, and Cliodna, daughter of the Druid Gebann, falls in love with
    him and leaves with him. At Teite's Strand, Manannan's people pursue them; Iuchnu
    betrays Cliodna by playing music until she sleeps, and a wave sweeps her away,
    giving the wave its name.
  language: English
  quote_policy: summarized
