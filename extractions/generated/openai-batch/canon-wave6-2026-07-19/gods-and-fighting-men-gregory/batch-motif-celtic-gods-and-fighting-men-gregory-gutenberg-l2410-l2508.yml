candidate_motifs:
- id: motif:1
  label: hero averts destructive eye-fire
  taxonomy_refs:
  - world_destroying_fire
  - culture_hero
  basis: Lugh disables Balor's eye, which kills those who look at it and is said to
    have been capable of burning all Ireland in one flash, then kills Balor.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage specifies Ireland rather than the whole world; the taxonomy
    reference to world-destroying fire is functional rather than exact.
- id: motif:2
  label: leader rallies people from bondage into battle
  taxonomy_refs:
  - culture_hero
  basis: Lugh breaks away from guardians, goes to the front, and urges the men of
    Ireland to fight rather than remain under bonds and tribute.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents battlefield exhortation and liberation language,
    but does not explicitly label Lugh as a culture hero.
- id: motif:3
  label: life spared in exchange for agricultural knowledge
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  basis: Bres bargains for his life with offers of animal and crop abundance and is
    finally spared after giving instructions on ploughing, sowing, and reaping.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The exchange is explicit, but the passage does not call it sacred.
- id: motif:4
  label: speaking weapon recounts its deeds
  taxonomy_refs:
  - wisdom
  basis: Orna, the sword of Tethra, tells all the deeds done by it when drawn from
    its sheath.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The wisdom taxonomy is broad; the passage gives an enchanted speaking-object
    motif rather than a formal teaching scene.
- id: motif:5
  label: stolen magical instrument returns when summoned
  taxonomy_refs:
  - sacred_theft
  - return
  basis: The Fomor have carried away the Dagda's harp; the Dagda finds it, calls it,
    and the harp springs from the wall back to him.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage says the Fomor brought the harp away, but does not describe
    the original taking in detail.
- id: motif:6
  label: battlefield blood carried to named ford
  taxonomy_refs: []
  basis: The Morrigu takes Indech's blood to armies at the ford of Unius, which is
    named the Ford of Destruction after the event.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage supports a blood-at-ford naming pattern, but does not explicitly
    frame the act as sacrifice or ritual.
- id: motif:7
  label: repeated number nine in battle episodes
  taxonomy_refs: []
  basis: The passage repeats nine in Lugh's nine comrades, the three times nine Fomor
    killed by Balor's eye, and the nine men killed by the returning harp.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:12
  confidence: medium
  cautions: The repetition is literal, but the passage does not explain its significance.
comparison_claims:
- id: claim:1
  claim: 'The Balor episode has the same function as a destructive-fire-averted motif:
    a dangerous power that could burn Ireland is neutralized by Lugh before wider
    destruction occurs.'
  claim_level: same_function
  target: world_destroying_fire motif family
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The text limits the threatened destruction to Ireland and centers the
    danger in an eye rather than in an autonomous cosmic fire.
- id: claim:2
  claim: 'Bres''s reprieve functions as an exchange of life for useful knowledge:
    Lugh spares him after receiving agricultural timing instructions.'
  claim_level: same_function
  target: sacred_exchange and wisdom motif families
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The exchange is practical and political in the passage; its sacred
    status is not stated.
- id: claim:3
  claim: The Dagda's harp episode fits a stolen-and-returning sacred object pattern
    at the level of narrative function.
  claim_level: same_function
  target: sacred_theft and return motif families
  evidence_refs:
  - ev:11
  - ev:12
