canonical_text:
  quote: ''
  summary: The Fomor and the Tuatha de Danaan meet in battle. Lugh breaks away from
    those guarding him, rallies the Irish forces, defeats Balor by putting out his
    destructive eye, and the Fomor are routed. The Morrigu takes Indech's blood to
    a ford. Bres bargains for his life and is spared after giving agricultural advice.
    Ogma finds a speaking sword, and the Dagda recovers his harp, which returns to
    him when summoned and kills nine men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fomor come from their camp in strong ranks, fully armed with armour, helmets,
    spears, swords, and shields.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Men of Dea go into battle while Lugh remains with nine comrades keeping
    him; Midhir, Bodb Dearg, Diancecht, Badb, Macha, and the Morrigu are named among
    those connected with the force.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the early battle the Tuatha de Danaan are hard pressed; Nuada and Macha
    fall by Balor, Cass-mail falls by Octriallach, and the Dagda is wounded by a casting
    spear from Ceithlenn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lugh breaks away from those keeping him, goes to the front, exhorts the men
    of Ireland to fight rather than live under bonds and tribute, and sings a song
    of courage.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The battle is described with slaughter, blood underfoot, loud weapon-noises,
    and a river carrying away bodies of friends and enemies together.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Balor orders his eyelid lifted so he can see Lugh; Lugh casts a red spear
    that drives Balor's eye out through the back of his head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Balor's displaced eye falls toward his own army, killing three times nine
    Fomor who look at it; the passage says Ireland would have burned in one flash
    if Lugh had not put out the eye, and Lugh then beheads Balor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Indech is crushed in battle and calls for Leat Glas; the Morrigu takes both
    hands full of Indech's blood and gives it to armies waiting at the ford of Unius,
    after which the place is called the Ford of Destruction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the battle becomes a rout and the Fomor are driven to the sea, Bres
    is found without a guard and asks Lugh to spare him, promising that Ireland's
    cows will never go dry.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bres next promises harvests of corn every quarter; Maeltine rejects this by
    setting out the normal seasons, and Bres finally gives Lugh advice to plough,
    sow, and reap on Tuesday, after which Lugh lets him go free.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ogma finds Orna, the sword of Tethra, draws and cleans it, and the sword tells
    all the deeds that had been done by it.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Lugh, the Dagda, and Ogma follow the Fomor because they have taken the Dagda's
    harp, Uaitne, and they find it hanging in a feasting-house with Bres and Elathan
    present.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Dagda speaks a summons to the harp; it springs from the wall, comes to
    him, and kills nine men on its way.
  category: action
  evidence_refs:
  - ev:12
