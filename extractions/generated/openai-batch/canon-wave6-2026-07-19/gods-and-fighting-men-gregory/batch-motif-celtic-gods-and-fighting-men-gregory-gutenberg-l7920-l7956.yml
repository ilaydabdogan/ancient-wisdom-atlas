canonical_text:
  quote: ''
  summary: A duel ends with both Mongach of the Sea and Fidach dead. Caisel of the
    Feathers, King of Lochlann, enters battle with a shield made by a Fomor smith,
    sending unquenchable flames through the Irish ranks. Finn calls on the Fianna
    to bless whoever will stop him. Druimderg sees Caisel's open mouth as the only
    unarmoured place, casts the Croderg spear into it, kills him, and the shield's
    flame goes out.
  language: English
