canonical_text:
  quote: two swans high up in the air, linked together by a chain of gold
  summary: Midhir and Eochaid play a wagered game; Midhir wins and claims Etain, then
    carries her away after an agreed embrace and kiss. Eochaid searches for her, uses
    a diviner to locate her with Midhir in Bri Leith, besieges and digs into the Sidhe
    hill, and finally recovers her after Midhir presents many women resembling her.
    The passage also explains place-names and links the insult to Midhir’s hill with
    later revenge against Conaire.
