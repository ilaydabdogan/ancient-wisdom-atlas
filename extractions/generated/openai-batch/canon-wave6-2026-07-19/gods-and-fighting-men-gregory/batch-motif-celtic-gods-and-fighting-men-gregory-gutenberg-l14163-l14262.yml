canonical_text:
  quote: ''
  summary: The remaining Fianna are sorrowful after losses and go hunting near Loch
    Lein. Niamh of the Golden Head arrives from the west on a richly adorned white
    horse, identifies herself as daughter of the King of the Country of the Young,
    and declares her love for Oisin. She calls Oisin to come with her to the Country
    of the Young, promising abundance, freedom from death and wasting, royal gifts,
    battle equipment, attendants, and herself as wife. Oisin accepts, bids farewell
    to Finn and the Fianna, mounts the horse with Niamh, and rides toward the sea
    while Finn laments that he may never see him return.
  language: English
  quote_policy: summarized
