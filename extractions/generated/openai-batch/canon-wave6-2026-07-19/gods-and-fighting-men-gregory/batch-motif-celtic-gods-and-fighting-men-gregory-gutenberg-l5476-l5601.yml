canonical_text:
  quote: ''
  summary: The four Children of Lir, living as birds, lament their cold life on the
    sea and remember former royal comforts. After the appointed time at Maoil, they
    go to Irrus Domnann, suffer further hardship, return to a deserted Sidhe Fionnachaidh,
    sing Sidhe music at Inis Gluaire, and later hear Saint Mochaomhog's bell, which
    Fionnuala says will free them from pain and misery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening song contrasts the children's present cold dwelling-place with
    earlier royal comforts such as purple clothing, mead, ale, wine, and drinking
    cups.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children are described with feathers and wings; their present food and
    drink are white sand and bitter sea water, and their beds are bare rocks.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Fionnuala says Fiachra and Conn sleep under her wings, Aodh under the feathers
    of her breast, and all four stay side by side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Riders report the birds' condition to Lir's house and to the chief men of
    the Tuatha de Danaan; the chiefs say they have no power over the children but
    are glad they are still living and will get help in the end of time.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After three hundred years at Maoil, Fionnuala says the time has come to leave
    for Irrus Domnann, where there will be no rest, standing ground, or shelter from
    storms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Irrus Domnann the children lead a cold, miserable life, and once the sea
    freezes around them so they cannot move.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The brothers lament at Irrus Domnann, and Fionnuala comforts them because
    she knows help will come.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the children return to Sidhe Fionnachaidh, they find it empty, with green
    hillocks and nettles, and without a house, fire, or hearthstone.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fionnuala laments the absence of dogs, hounds, women, kings, horns, cups,
    drinking, young men, riders, music, play, and gathered people from the former
    household.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The children stay one night at their father's and grandfather's place, sing
    sweet music of the Sidhe, then go to Inis Gluaire, where birds gather near them
    on Loch na-n Ean.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Aibric, a young man of good race, takes notice of the birds, loves their singing,
    is loved by them, and tells their whole story in order.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the coming of the faith of Christ and Patrick to Ireland, Saint Mochaomhog
    comes to Inis Gluaire; the children hear his bell, the brothers are frightened,
    and Fionnuala says the bell will set them free from pain and misery.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The children listen to Mochaomhog's bell until matins are done, and then they
    sing low, sweet music of the Sidhe.
  category: action
  evidence_refs:
  - ev:10
