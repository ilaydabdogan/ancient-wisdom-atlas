canonical_text:
  quote: ''
  summary: Lugh learns that the Fomor have landed and raided Bodb Dearg's country,
    seeks help from Nuada, then sends Cian, Cu, and Ceithen to gather the Riders of
    the Sidhe. Cian encounters the hostile sons of Tuireann, transforms into a pig
    to hide, is detected by Brian, and is hunted by Brian's brothers transformed into
    hounds. Brian wounds Cian, refuses protection or mercy, allows him to resume human
    form, and the sons of Tuireann kill him with stones. The earth rejects Cian's
    body six times before keeping it on the seventh burial. The sons of Tuireann then
    go to join Lugh, while Lugh travels toward the Fomor and their spoils.
  language: English
  quote_policy: summarized
