  summary: In an apologetic note, the editor explains her translation and redaction
    methods, defends Irish literature against a hostile academic judgment, describes
    hearing legends in thatched houses, and states her hope that readers will pursue
    fuller texts and manuscripts. She characterizes the stories as including Finn,
    Oisin, Patrick, the Ever-Living Ones, the Country of the Young, Cuchulain, Lugh,
    and Etain, and as preserving belief in an invisible world and immortal life behind
    visible mortal life.
