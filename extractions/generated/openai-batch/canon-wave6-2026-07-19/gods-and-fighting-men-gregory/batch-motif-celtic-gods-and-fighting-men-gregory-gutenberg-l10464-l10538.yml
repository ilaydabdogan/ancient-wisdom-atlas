canonical_text:
  quote: ''
  summary: The passage recounts Diarmuid's birth and fosterage by Angus Og at Brugh
    na Boinne, the killing of the Steward's son by Donn during a hound fight, Finn's
    compelled discovery of the killer by Druidic means, and the Steward's transformation
    of his dead son into the Boar of Slieve Guillion, destined to bring Diarmuid to
    death. It closes by noting Diarmuid's later place among the Fianna and a seven-day
    combat with a wild ox on the Mountain of Happiness.
  language: English
  quote_policy: summarized
