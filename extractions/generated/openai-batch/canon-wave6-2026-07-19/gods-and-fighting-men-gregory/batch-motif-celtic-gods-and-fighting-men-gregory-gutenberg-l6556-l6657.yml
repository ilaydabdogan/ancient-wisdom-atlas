canonical_text:
  quote: ''
  summary: A young man called the Lad of the Skins enters Finn's service, proves an
    exceptional hunter, is sent to obtain an inexhaustible cauldron from the King
    of the Floods, makes a ship from two sticks, seizes the cauldron, returns it to
    Finn, and later goes with Finn to face the King of the Floods again after a voice
    from the water demands restitution or battle.
  language: English
  quote_policy: summarized
