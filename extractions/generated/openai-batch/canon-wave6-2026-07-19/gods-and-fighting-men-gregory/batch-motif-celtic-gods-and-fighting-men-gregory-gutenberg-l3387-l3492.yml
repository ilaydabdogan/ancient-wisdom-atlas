canonical_text:
  quote: ''
  summary: The passage recounts Midhir at his hill, the frustrated love of Bri and
    Leith, and the naming of Bri Leith. It then tells how Fuamach, jealous of Midhir's
    wife Etain, uses Druidic help and later spells of her own to drive Etain away,
    transform her into a fly, and expose her to the wind. Angus shelters Etain, later
    kills Fuamach, and Etain wanders until she is swallowed in wine by Etar's wife
    and reborn as Etar's daughter. Midhir appears in disguise to Etain and her companions
    at the shore and foretells future conflict. Later Eochaid sees Etain by a well
    in radiant clothing with ornate objects.
  language: English
  quote_policy: summarized
