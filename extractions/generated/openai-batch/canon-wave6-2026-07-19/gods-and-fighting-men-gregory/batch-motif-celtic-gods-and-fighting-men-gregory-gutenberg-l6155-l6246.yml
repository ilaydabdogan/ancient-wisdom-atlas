canonical_text:
  quote: ''
  summary: Finn encounters a fawn that is unharmed by Bran and Sceolan. The fawn follows
    him to Almhuin and appears as Sadbh, a woman transformed by the Dark Druid Fear
    Doirche after refusing his love. Finn marries her, but while he is away at war
    a false likeness lures her from the dun, changes her back into a fawn with a hazel
    rod, and takes her away. Finn searches for seven years. Later, his hounds find
    and protect a wild young boy on Beinn Gulbain, and Finn's people take the boy
    in.
  language: English
  quote_policy: summarized
