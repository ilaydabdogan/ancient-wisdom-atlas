  quote: ''
  summary: Caoilte hunts near Ess Ruadh and meets Derg by a Sidhe hill. Derg welcomes
    him into the hill, where Ilbrec’s house is troubled by a destructive bird linked
    to war with Lir. Caoilte knocks down the bird with a copper rod, receives the
    Spear of Fiacha, and later fights Lir during the battle around the hill, killing
    him.
  language: English
  quote_policy: summarized
