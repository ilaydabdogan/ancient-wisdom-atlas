canonical_text:
  quote: ''
  summary: Finn sails to Alban to seek military help against Diarmuid, and the King
    of Alban sends his sons and men. Diarmuid and Osgar meet the attack near Brugh
    na Boinne and defeat it. Finn then goes to the Land of Promise to ask his nurse
    for magical aid; she hides Finn and the Fianna in a Druid mist and attacks Diarmuid
    from the air with spears through a perforated leaf, but Diarmuid kills her with
    the Red Spear. Angus negotiates peace among Diarmuid, Finn, and the King of Ireland;
    Diarmuid receives lands and forgiveness, then settles with Grania and their children
    at Rath Grania.
  language: English
  quote_policy: summarized
