canonical_text:
  quote: ''
  summary: Lugh asks the craftsmen and healer what aid they will give in the coming
    battle. Goibniu, Credne, Luchta, and Diancecht promise weapons, fittings, shafts,
    and healing. The battle at Magh Tuireadh begins, with the Tuatha de Danaan repeatedly
    restored by renewed weapons and by the healing well of Slaine. The Fomor send
    Ruadan to spy and then to attack Goibniu; Goibniu is wounded but kills Ruadan
    and is healed in the well. The Fomor fill the well with stones. A later notice
    describes Goibniu enchanting a spear-shaft named Nes so that it burns those it
    strikes like fire.
  language: English
  quote_policy: summarized
