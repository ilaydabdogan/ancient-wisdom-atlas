- id: ev:5
  type: summary
  locator: lines 2335-2345
  quote_or_summary: The Fomor and the men of Ireland meet at the northern Magh Tuireadh
    near Ess Dara; Bres and Indech threaten the men of Ireland with destruction and
    tribute.
