candidate_motifs:
- id: motif:1
  label: Healing well restores slain or mortally wounded warriors
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Dead or mortally wounded men are placed in the well of Slaine and come out
    whole and sound, empowered for renewed fighting.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage describes restoration for battle rather than a full theological
    doctrine of resurrection.
- id: motif:2
  label: Divine or expert craftsmen renew an army's weapons each day
  taxonomy_refs:
  - culture_hero
  basis: Goibniu, Luchta, and Credne continually make and reassemble weapons so that
    the Tuatha de Danaan arms are restored by the next day.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the passage emphasizes battle craft rather
    than a culture-founding act.
- id: motif:3
  label: Enemy spy discovers the source of supernatural military advantage
  taxonomy_refs:
  - trickster_boundary
  basis: The Fomor send Ruadan, whose descent links him to the Tuatha de Danaan, to
    spy out how the Tuatha restorations are done.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: Ruadan acts as spy and attacker, but the passage does not frame him as
    a trickster in explicit terms.
- id: motif:4
  label: Life-giving water is blocked or neutralized by enemy action
  taxonomy_refs:
  - water
  basis: After Goibniu uses the well for healing, Octriallach directs the Fomor to
    fill it with stones until it is dried up and covered by a cairn.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The available taxonomy supplies a symbol reference for water, not a specific
    motif-family identifier for blocked healing water.
- id: motif:5
  label: Enchanted weapon burns those it strikes
  taxonomy_refs:
  - fire
  basis: Goibniu sings spells over the spear-shaft Nes, and anyone later struck by
    that spear will burn like fire.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The passage gives a brief notice and does not narrate a later use of the
    weapon.
- id: motif:6
  label: Battle leader empowers warriors before combat
  taxonomy_refs:
  - royal_legitimacy
  basis: Lugh speaks to the army and puts strength in them so that each has the spirit
    of a king or great lord.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The royal imagery is explicit, but the scene is martial encouragement
    rather than a formal accession or legitimation rite.
