  rights_note: Public domain source; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: lines 2365-2375
  quote_or_summary: The well of Slaine lies west of Magh Tuireadh and east of Loch
    Arboch; Diancecht, Octruil, and Airmed sing spells over it and add herbs, and
    dead or mortally wounded men placed in it come out whole and fiercer in battle.
  source_text_path: texts/public-domain/celtic/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: lines 2376-2387
  quote_or_summary: Goibniu makes spear-heads in the forge by three turns; Luchta
