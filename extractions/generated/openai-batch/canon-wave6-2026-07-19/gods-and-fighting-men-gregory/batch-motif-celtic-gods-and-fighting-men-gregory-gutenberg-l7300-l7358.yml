canonical_text:
  quote: ''
  summary: Glas, serving the King of the World, discovers that Conn Crither is his
    kinsman and decides to fight beside him. Glas arranges single combats rather than
    a full landing of the foreign army. Glas and Conn kill multiple opponents; Conn
    is healed by three women from the Country of the Young in a healing well. Glas
    then challenges Madan of the Bent Neck, kills him in combat, and is praised by
    Conn.
