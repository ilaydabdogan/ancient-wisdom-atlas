canonical_text:
  quote: ''
  summary: Ethne laments the departure of the sons of Tuireann. Brian searches the
    sea for the Island of the Fair-Haired Women, obtains a cooking-spit from women
    there, and returns to his brothers. The brothers go to the Hill of Miochaoin,
    where Brian kills the guardian and the sons of Tuireann fight Miochaoin's three
    sons, leaving all mortally wounded. They return to Ireland and ask Tuireann to
    seek from Lugh a healing skin in exchange for the spit. Lugh refuses to give the
    skin unless their deaths satisfy the earlier deed. Brian and his two brothers
    die together; Tuireann laments them, dies, and they are buried in one grave.
  language: English
  quote_policy: summarized
