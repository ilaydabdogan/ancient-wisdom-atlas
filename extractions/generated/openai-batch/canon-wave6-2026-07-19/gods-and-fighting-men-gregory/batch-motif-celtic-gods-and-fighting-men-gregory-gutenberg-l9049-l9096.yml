canonical_text:
  quote: ''
  summary: Finn has a wife of the Luigne and a household fool named Lomna. While Finn
    hunts with the Fianna, Lomna sees Coirpre secretly visit Finn's wife. She asks
    Lomna to conceal it; he agrees but writes an Ogham message on a rod. Finn understands,
    and the wife sends Coirpre to kill Lomna. Coirpre beheads Lomna and takes the
    head. Finn returns, identifies Lomna and the circumstances through divination
    of rhymes, and follows hounds to Coirpre's house. There Coirpre and his men are
    cooking fish while Lomna's head is on a spike by the fire. Coirpre twice divides
    fish without giving the head a share, violating Fianna law. The head speaks, condemns
    the division, and foretells revenge and fires in Luigne. Finn arrives and kills
    Coirpre and his men.
  language: English
  quote_policy: summarized
