canonical_text:
  quote: ''
  summary: Diarmuid and Grania continue their flight. In a sea-cave during a storm,
    the Fomor Ciach arrives by currach, plays chess with Diarmuid, wins, and claims
    Grania as wife. Diarmuid moves to kill him; Grania wounds Diarmuid with a knife,
    and Diarmuid kills Ciach and flees into the storm. Grania follows and asks forgiveness.
    Diarmuid reproaches her for causing his exile from Finn, the Fianna, kin, country,
    honor, and wealth. Grania declares her love and asks him not to leave her. Later,
    at another cave with water nearby, she discovers the knife still in his thigh
    and removes it. The next day Diarmuid leaves broken bread rather than the unbroken
    bread he had previously left as a sign to Finn that he had kept faith.
  language: English
  quote_policy: summarized
