canonical_text:
  quote: ''
  summary: At a feast, Grania asks a Druid to identify warriors of the Fianna and
    notices Diarmuid. When Diarmuid's cap falls and exposes a love-spot on his forehead,
    Grania falls in love with him. She sends an enchanted cup of wine that puts Finn
    and much of the company to sleep, then asks Diarmuid to take her away. Diarmuid
    refuses because she is promised to Finn, but Grania places him under Druid bonds
    to bring her from the house before Finn and the King of Ireland awake. They discuss
    escape from Teamhair by a side door or by crossing the walls on spear shafts.
  language: English
  quote_policy: summarized
