canonical_text:
  quote: ''
  summary: Cormac, King of Teamhair, encounters an armed stranger carrying a shining
    branch with nine red-gold apples whose sound removes care and induces sleep. The
    stranger says he comes from a country without age, sadness, jealousy, or falsehood,
    and gives Cormac the branch in exchange for three future gifts. On later visits
    he takes Cormac's daughter Aille, son Carpre Lifecar, and wife Ethne. Cormac pursues
    him, is separated by mist, and comes upon supernatural duns, repeated impossible
    labors, a shining well with streams, hazels, salmon, and music, and a palace where
    tall hosts receive him with a self-heating bath and inexhaustibly renewing pigs.
  language: English
  quote_policy: summarized
