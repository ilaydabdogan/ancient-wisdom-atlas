canonical_text:
  quote: ''
  summary: Finn sees a likeness of Sadbh in a boy and keeps him near. Once the boy
    learns to speak with the Fianna, he recalls living with a beloved deer who sheltered
    him in an enclosed wild place. A dark-looking man repeatedly came to speak to
    the deer; she feared him. On the last occasion he struck her with a hazel rod
    and she was forced to follow him while crying back toward the child. The child
    was unable to move, lost consciousness, later awoke on the hillside where the
    hounds had found him, and could not find his former home again. The Fianna name
    him Oisin, and he later becomes their poet and fighter.
  language: English
  quote_policy: summarized
