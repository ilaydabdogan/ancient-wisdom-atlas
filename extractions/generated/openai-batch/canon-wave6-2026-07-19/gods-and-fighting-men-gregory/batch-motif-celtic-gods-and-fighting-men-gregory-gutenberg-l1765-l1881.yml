canonical_text:
  quote: ''
  summary: The sons of Tuireann agree to go to Greece for the pig-skin and enter the
    Greek king's court disguised as poets. Brian composes a poem that asks for the
    pig-skin as reward and explains that he will quarrel for it if refused. The king
    refuses to give it, offers gold instead, and has the skin brought out for measuring.
    Brian seizes the skin, kills nearby armed men and the King of Greece, and the
    brothers leave with it. They then travel toward Persia to seek a spear from Pisear
    and again use the appearance of poets at court, where Brian begins a poem about
    the spear.
  language: English
  quote_policy: summarized
