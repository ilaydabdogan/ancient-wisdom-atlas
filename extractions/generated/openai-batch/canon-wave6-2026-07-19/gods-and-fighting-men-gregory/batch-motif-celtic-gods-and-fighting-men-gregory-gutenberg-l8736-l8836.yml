canonical_text:
  quote: ''
  summary: Caoilte and the sons of Midhir move under a Druid mist, observe sorrowing
    Fianna who believe Finn has been absent for over a year, and return into the hill.
    Luibra the physician heals two wounded comrades under threat. At the Feast of
    Teamhair the High King and the Fianna discuss Finn’s absence, safeguard Finn’s
    queens, examine Finn’s spear and hound collar, and hear from the Druid Cithruadh
    that Finn is alive and will return before the feast ends. Finn and his men, after
    staying in the House of the Two Birds and taking hostages for Donn from the Tuatha
    de Danaan, return to their people on the last day of the feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caoilte and the two sons of Midhir take the young man to the ford of the Slaine,
    where many of the Fianna are, while a Druid mist hides them from sight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From a hill above the ford, they see four young men with crimson fringed cloaks,
    gold-hilted swords, and four hunting hounds; the young man cannot see them because
    of the mist, but Caoilte recognizes two as his sons Colla and Faolan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four young men speak of Finn’s year-long absence and the uncertainty of
    what the Fianna should do without their lord and leader.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Caoilte and the sons of Midhir return by the Lake of the Two Birds to Slieve-nam
    Ban and go into the hill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Finn and Donn welcome Luibra the physician and show him two wounded comrades,
    whom Donn calls brothers to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Luibra says the wounded men can be cured in nine days for a good reward; Caoilte
    promises Luibra his life if he succeeds and threatens beheading if he fails.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Within nine days Luibra cures the wounded men, and they become as well as
    before.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The High King summons the Fianna to the Feast of Teamhair, where Finn’s loss
    is publicly discussed.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The High King gives Goll the right of hunting over Ireland until Finn’s loss
    is known to be lasting, but Goll refuses to take Finn’s place until Finn has been
    absent three years and all hope of his return is gone.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The High King orders that Finn’s seventeen queens each be given a safe, secret,
    sunny house with provisions until there is knowledge whether Finn is alive or
    dead.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The High King asks if anyone can get news of Finn in hills, secret places,
    rivers, invers, or any house of the Sidhe in Ireland or Alban.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Berngal reports that Finn gave him a shining-headed spear and a hound’s collar
    to keep until they met again, and he shows them to the king and Goll.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Berngal names the hounds that were with Finn, Caoilte, and Lugaidh’s Son.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Fergus of the True Lips states that Finn and the men with him have been absent
    for a month and a quarter and a year.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Cithruadh the Druid says Finn is living but refuses to reveal where he is,
    and foretells that the Leader of the Fianna will be seen drinking at the Feast
    of Teamhair before it ends.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Finn and his men stay in the House of the Two Birds until they take hostages
    for Donn, son of Midhir, from the Tuatha de Danaan, then return to their people
    on the last day of the Feast of Teamhair.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: After these events, the Fianna have no more dealings with people living in
    houses than with the People of the Gods of Dana.
  category: relationship
  evidence_refs:
  - ev:17
