candidate_motifs:
- id: motif:1
  label: Hidden movement under supernatural concealment
  taxonomy_refs: []
  basis: The party travels among the Fianna while hidden by a Druid mist, allowing
    Caoilte to see and hear others without being seen.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage names the concealment as a Druid mist but does not explain
    its origin beyond that.
- id: motif:2
  label: Absent leader mourned by followers
  taxonomy_refs: []
  basis: The Fianna lament the loss of Finn as lord and leader, and the king compares
    the loss to a great loss in Ireland.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:14
  confidence: high
  cautions: This is a social and narrative pattern in the passage rather than a taxonomy-listed
    motif family.
- id: motif:3
  label: Refusal to usurp the missing leader
  taxonomy_refs:
  - royal_legitimacy
  basis: Goll is offered wide hunting authority but refuses to take Finn’s place until
    Finn has been absent three years and all hope of his return is gone.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage concerns leadership of the Fianna rather than kingship directly;
    the royal_legitimacy taxonomy reference is approximate.
- id: motif:4
  label: Healing completed in a fixed sacred time
  taxonomy_refs: []
  basis: Luibra says the cure will take nine days, and within nine days the wounded
    men are restored to health.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly call the number nine sacred; only the
    fixed nine-day duration is literal.
- id: motif:5
  label: Tokens of the missing hero preserved for recognition
  taxonomy_refs: []
  basis: Berngal keeps Finn’s shining-headed spear and hound collar until Finn should
    meet him again and presents them as evidence during the search for news.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not show the tokens causing recognition of Finn’s person;
    they function as identifying possessions.
- id: motif:6
  label: Druidic divination of the absent hero’s survival and return
  taxonomy_refs:
  - return
  basis: Cithruadh declares that Finn is alive and foretells that the Leader of the
    Fianna will be seen drinking at the feast before it ends; Finn returns on the
    feast’s last day.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: The prophecy is fulfilled within the passage, but the passage gives no
    mechanics for the divination.
- id: motif:7
  label: Sojourn in an otherworld-associated house before return
  taxonomy_refs:
  - mystical_quest
  - return
  basis: Finn and his men stay in the House of the Two Birds until hostages are taken
    from the Tuatha de Danaan, then return to their people.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage associates the episode with the Tuatha de Danaan and hidden/Sidhe
    places, but it does not fully describe the House of the Two Birds or the journey’s
    purpose here.
