canonical_text:
  quote: ''
  summary: Fionnbhar and the Tuatha de Danaan use Druid mist to approach Conan's house.
    Ethne the woman-Druid lures Finn outside by heroic bonds while fiery-beaked blackbirds
    attack the household. Ethne challenges Finn to a race, and Caoilte kills her.
    Finn and Caoilte are then attacked by the Tuatha de Danaan until Goll and the
    Fianna come to help. Goll kills Fionnbhar in a severe battle. When more Fianna
    arrive, the Tuatha de Danaan conceal themselves in Druid mist and depart, leaving
    many wounded and dead.
  language: English
  quote_policy: summarized
