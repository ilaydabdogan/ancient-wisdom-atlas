canonical_text:
  quote: ''
  summary: The three sons of the King of Iruath lend Finn a protective hound under
    restrictions. The hound circles and touches Finn daily, while the Iruath sons
    heal harms caused by the sons of Uar. At the High King’s request, Dubh uses a
    spell against the sons of Uar, and the hound’s wind drives them into the sea,
    where they strike one another and disappear. Later, destructive flocks of birds
    come from the western sea and are driven back into the sea by Caoilte’s spell.
    The passage then describes the Iruath sons living apart behind a wall of fire,
    where Donn and Dubhan secretly see the hound in a small form producing drinks
    into a silver vessel.
  language: English
  quote_policy: summarized
