canonical_text:
  quote: ''
  summary: The passage opens the story of the Battle of the White Strand. It says
    foreign enemies gather under Daire Donn, High King of the Great World, to take
    Ireland and make it tributary. A large roster of kings, lords, and Ogarmach the
    woman-warrior is named. The King of the World asks who can guide him to Irish
    harbours; Glas, an exile from Ireland because of treachery against Finn, offers
    to guide him. The armies sail, endure wind, waves, sea-women, birds, and damaged
    ropes and sails, then reach Green Rock. The king asks instead for a white sandy
    harbour suitable for mustering, and Glas names the Harbour of the White Strand
    in Corca Duibhne; the armies sail on toward Ireland.
  language: English
  quote_policy: summarized
