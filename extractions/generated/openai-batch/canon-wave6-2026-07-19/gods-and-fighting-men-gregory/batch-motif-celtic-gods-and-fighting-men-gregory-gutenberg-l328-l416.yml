canonical_text:
  quote: ''
  summary: The passage describes Irish gods and invisible people as perfected versions
    of ordinary life, links the Men of Dea, Fomor, Finn, and other figures to battles,
    hill dwellings, and the country Under-Wave, quotes Midhir's description of an
    ageless sorrowless land, recalls Oisin's lament for Finn and the Fianna, and then
    develops a symbolic contrast and union of lunar communal folk creativity and solar
    individual discipline in poetry.
  language: English
  quote_policy: summarized
