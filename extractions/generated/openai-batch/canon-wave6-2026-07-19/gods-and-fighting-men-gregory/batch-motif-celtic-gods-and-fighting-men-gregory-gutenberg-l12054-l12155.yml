canonical_text:
  quote: there was a wonderful quicken-tree in that wood
  summary: Diarmuid, Grania, and Muadhan travel until Muadhan leaves them. Diarmuid
    and Grania reach the wood of Dubhros, where a Druid quicken-tree has grown from
    an otherworldly rowan berry dropped by one of the Men of Dea after a hurling match
    with the Fianna. Its berries prevent illness, give exhilaration, restore age to
    youth, and increase beauty. A musician of the Men of Dea recruits Searbhan Lochlannach
    to guard the tree. Searbhan is a one-eyed, iron-collared guardian with a death
    prophecy tied to his iron club. Diarmuid makes an agreement with him to hunt in
    the wood without touching the berries and builds a cabin for himself and Grania.
  language: English
  quote_policy: quoted
