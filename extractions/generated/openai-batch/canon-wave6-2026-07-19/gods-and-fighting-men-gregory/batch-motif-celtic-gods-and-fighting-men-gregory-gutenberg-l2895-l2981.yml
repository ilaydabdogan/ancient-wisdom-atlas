canonical_text:
  quote: ''
  summary: After their defeat, the Tuatha de Danaan refuse submission to the sons
    of Miled and withdraw to hidden dwellings chosen and protected by Manannan. Manannan
    provides them with an age-defying feast, including Goibniu's ale and swine that
    revive after being eaten. The Tuatha choose Bodb Dearg as king. Further notices
    describe Bodb's enchanted dwelling, a harper suitor kept outside until a mountain
    lake appears, an omen-bearing swineherd connected with Conaire's death, Bodb's
    three sons living among men, and three landless sons of Lugaidh Menn fasting at
    Brugh na Boinn until Bodb receives them and the Men of Dea propose wives for them.
  language: English
  quote_policy: summarized
