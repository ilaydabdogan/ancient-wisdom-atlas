canonical_text:
  quote: ''
  summary: Tadg and his companions lose their way on a boundless ocean, survive a
    violent storm, and reach a richly described island. They pass through fragrant
    woods, fruit gardens, strange birdsong, and a honey-dewed plain with three fortified
    hills. A white-bodied woman welcomes Tadg and identifies the land as Inislocha,
    ruled by two sons of Bodb, and describes one dun as belonging to the royal line
    of Ireland. At the middle dun, Cesair identifies herself as the first to reach
    Ireland and says she and her company live forever there; she identifies another
    dun as holding ancient Irish rulers and peoples, and calls the island the fourth
    paradise of the world.
  language: English
  quote_policy: summarized
