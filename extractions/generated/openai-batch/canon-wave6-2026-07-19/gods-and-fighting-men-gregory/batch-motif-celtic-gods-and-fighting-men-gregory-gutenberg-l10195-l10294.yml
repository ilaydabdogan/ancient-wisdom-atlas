canonical_text:
  quote: '"Finn... was but a grey old man, weak and withered."'
  summary: Finn pursues a grey fawn to Slieve Cuilinn, where it vanishes. At a lake
    a beautiful young woman binds him to recover her red-gold ring from the water.
    After he returns it, she vanishes and Finn becomes a grey, withered old man. The
    Fianna find him, name the lake Loch Doghra, and later carry him to the hill of
    the Sidhe, where Cuilinn gives him a red-gold vessel whose drink restores his
    form, though not his hair colour.
  language: English
  quote_policy: quoted
