canonical_text:
  quote: ''
  summary: Finn discovers that Diarmuid and Grania have left Teamhair, sends trackers
    after them, and pursues them to Doire-da-Bhoth. Allies attempt to warn Diarmuid
    through Bran the hound and through Fearghoin's far-carrying shouts, but Diarmuid
    refuses to flee. Finn surrounds the wooded shelter. Angus Og learns of Diarmuid's
    danger, arrives unseen, and carries Grania away under the border of his cloak
    while Diarmuid remains behind.
  language: English
  quote_policy: summarized
