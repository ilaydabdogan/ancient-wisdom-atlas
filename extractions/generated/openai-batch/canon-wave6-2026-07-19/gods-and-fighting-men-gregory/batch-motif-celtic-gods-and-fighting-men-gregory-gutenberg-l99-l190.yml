  summary: The preface describes the Hill of Allen and Tara, contrasts different Irish
    heroic landscapes, discusses medieval mixing of Finn and Fianna traditions with
    Tara kings, contrasts Finn’s woodland hunting world with Cuchulain’s chariot-centered
    world, and retells Credhe’s comparison of her grief to a crane defending nestlings
    from a fox.
