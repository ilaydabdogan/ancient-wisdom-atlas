canonical_text:
  quote: ''
  summary: Finn, widowed and without a companion, sends Oisin and Diorraing to ask
    the High King of Ireland for Grania as his wife. The king refers the answer to
    Grania, who gives conditional acceptance. Finn later comes to Teamhair with the
    Fianna; Grania sees that he is grey-haired and older than her father, says Oisin
    would be more fitting, answers Finn's questions with quick verbal judgments, and
    sits at the prepared wedding-feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Finn rises early alone at Almhuin and says he lacks quiet sleep because he
    is without a fitting wife after Maighneis died.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oisin says the Fianna could bring Finn any woman in Ireland, willing or unwilling,
    and Diorraing names Grania, daughter of the High King of Ireland, as a fitting
    wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Finn says there has long been strife between himself and the High King, and
    he sends Oisin and Diorraing to ask for Grania so that any refusal will be given
    to them rather than to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Teamhair, the High King welcomes Oisin and Diorraing, postpones his gathering,
    and tells them to get Grania's own answer because she has refused many kings'
    sons, princes' sons, and champions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Grania answers that if Finn is a fitting son-in-law for her father, he would
    be a fitting husband for her; a feast is then made for the emissaries, and a later
    meeting with Finn is arranged.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Finn gathers the seven battalions of the Fianna and travels in great bands
    and troops to Teamhair, where the king and the men of Ireland welcome them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Grania sees grey-haired Finn, she says it is a wonder he did not ask
    for her on behalf of Oisin, who would be more fitting than a man older than her
    father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Finn questions Grania with a sequence of comparative questions, and she answers
    with maxims about truth, childhood, hospitality, reproach, champion conduct, a
    knife, woman's wit, and a woman's mind.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After their talk, Grania has no liking for Finn and feels her heart rising
    against him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wedding-feast is prepared in the king's feasting-house, and the king,
    his wife, Grania, Finn, Oisin, and the others sit according to rank and birth.
  category: setting
  evidence_refs:
  - ev:6
