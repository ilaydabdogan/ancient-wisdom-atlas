canonical_text:
  quote: ''
  summary: The passage first recalls Manannan in the form of the Gilla Decair taking
    Finn and the Fianna to Land-under-Wave and helping them at Cnoc Aine. It then
    tells how Manannan, as O'Donnell's Kern, appears at Aodh Dubh O'Donnell's feast
    as a ragged clown, enters without the gatekeeper's knowledge, mocks the musicians,
    plays surpassingly sweet harp music, refuses honor and gifts, evades armed guards,
    causes the gate guards to wound one another, and gives an herb by which the gatekeeper
    restores them to life in exchange for cattle and land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manannan is said to have gone to Finn and the Fianna in the form of the Gilla
    Decair and brought them to Land-under-Wave; he also hunted with them on Cnoc Aine
    and sometimes helped them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Manannan later goes through Ireland playing tricks under the name O'Donnell's
    Kern during a feast held by Aodh Dubh O'Donnell at Bel-atha Senaig.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A clown-like stranger approaches in old striped clothes, with puddle water
    in his shoes, a naked sword behind him, his ears through an old cloak, and three
    scorched blackened holly-wood spears in his hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stranger gives a rapid wandering itinerary across several named places
    and says he is now with O'Donnell.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The gatekeeper denies having admitted the stranger; the stranger says entering
    and leaving are easy for him, and those present wonder that he entered the house
    without passing the gate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The country musicians play sweet harp tunes, but the stranger says their music
    sounds worse than hammering iron in a bad place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stranger takes a harp and plays music said to put women in labor and wounded
    men after battle into sweet sleep; O'Donnell compares it favorably to music of
    the Sidhe in hills and under the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The stranger refuses to sit near O'Donnell and refuses the clothes sent to
    him, saying he would rather remain an ugly clown and does not want high-up people
    boasting of gifts to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: O'Donnell sets armed horsemen and footmen inside and more men outside the
    gate to keep the stranger from leaving, because they know him not to be a man
    of this world.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The stranger says he will not eat supper with O'Donnell the next day but at
    Cnoc Aine in Desmumain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: While playing the harp again, the stranger calls to the men outside to watch
    him; when they raise axes to strike him, they strike one another and lie in blood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The stranger tells the gatekeeper to ask O'Donnell for twenty cows and a hundred
    of free land as a fee, gives him an herb to rub in each man's mouth, and says
    each man will rise whole and well; the gatekeeper does this and brings the people
    to life again.
  category: action
  evidence_refs:
  - ev:10
