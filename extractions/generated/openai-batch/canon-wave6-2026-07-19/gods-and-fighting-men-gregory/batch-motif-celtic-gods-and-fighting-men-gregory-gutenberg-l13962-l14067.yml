  text: The High King of Ireland becomes bitter against Finn and the Fianna, speaks
    against their harm, pride, and tribute, and says he would rather die fighting
    them if he could bring them down.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The High King's people agree to attack the Fianna and make an end of them,
    and the High King gathers support and invites Osgar to a feast at Teamhair.
  category: action
  evidence_refs:
  - ev:1
