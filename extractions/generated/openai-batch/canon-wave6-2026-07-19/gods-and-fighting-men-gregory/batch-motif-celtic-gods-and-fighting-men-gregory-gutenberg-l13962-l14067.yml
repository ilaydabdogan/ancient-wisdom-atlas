canonical_text:
  quote: ''
  summary: The High King of Ireland turns against Finn and the Fianna, summons Osgar
    to Teamhair, and disputes with him over tribute and an exchange of spears. Before
    battle, a woman of the Sidhe washing bloody clothes at a river foretells Osgar's
    death and the High King's death-wound. The armies meet at Gabhra; Osgar kills
    many, is mortally wounded by the High King, kills the High King in return, breaks
    a helmet decoy with a stone, and dies. The Fianna suffer heavy losses and mourn
    their dead.
  language: English
  quote_policy: summarized
