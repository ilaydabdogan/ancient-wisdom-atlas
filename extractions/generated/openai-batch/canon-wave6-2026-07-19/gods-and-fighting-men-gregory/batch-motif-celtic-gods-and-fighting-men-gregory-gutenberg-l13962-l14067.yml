  text: Osgar travels toward Teamhair with three hundred men and sees a woman of the
    Sidhe washing clothes at a river where the water has the colour of blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman says ravens will soon croak over Osgar after the battle, that nine
