canonical_text:
  quote: ''
  summary: The preface contrasts Cuchulain's relation to the gods with Finn's closer
    equality among them, describes the Fianna's kinship with the Tuatha de Danaan,
    Finn's uncertain death and return in another shape, Oisin's kingship in a divine
    country, and birds and beasts in the woods as former humans or enchanters able
    to change shape. It then characterizes Fenian stories as episodic, wonder-filled,
    childlike, and set in a fluctuating dream-like world.
