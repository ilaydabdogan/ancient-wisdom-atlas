canonical_text:
  quote: ''
  summary: Finn and the Fianna confront foreign armies by arranging successive combats
    between champions or rulers. Cuban's son fights the King of Greece and both die;
    Finn designates Follamain to receive his father's name and place. Goll Garb defeats
    the forces of three eastern kings. Oisin fights the King of France, who says he
    came because Finn took his wife; the king flees to Gleann na-n Gealt, which is
    linked to mad people thereafter. Finn then orders a night watch over the harbour,
    and Oisin volunteers.
  language: English
  quote_policy: summarized
