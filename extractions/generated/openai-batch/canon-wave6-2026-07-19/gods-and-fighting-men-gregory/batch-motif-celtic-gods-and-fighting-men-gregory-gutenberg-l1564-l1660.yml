canonical_text:
  quote: ''
  summary: 'Lugh confronts the sons of Tuireann before the king and chief men, saying
    they killed his father and demanding a fine while respecting the protection of
    the king''s house. The sons debate how to answer, offer to pay the fine, and bind
    themselves by named authorities. Lugh then explains that the apparently small
    fine consists of difficult-to-obtain marvels: golden healing apples, a healing
    pig skin, the spear Luin, sea-crossing horses and chariot, reviving pigs, and
    the whelp Fail-Inis, along with a cooking-spit and three shouts on a hill listed
    but not explained in this passage.'
  language: English
  quote_policy: summarized
