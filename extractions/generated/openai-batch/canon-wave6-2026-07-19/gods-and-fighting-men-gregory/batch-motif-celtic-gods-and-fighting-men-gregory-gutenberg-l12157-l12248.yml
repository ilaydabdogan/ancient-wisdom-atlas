canonical_text:
  quote: ''
  summary: Finn receives Aonghus and Aodh of the children of Morna, who seek peace
    and a place among the Fianna. Finn demands as satisfaction either Diarmuid's head
    or a fistful of berries from the guarded quicken-tree of Dubhros. Oisin warns
    them against the demand, but they go to Dubhros, find Diarmuid and Grania, and
    explain Finn's terms. Diarmuid describes the danger of the guarded berries, defeats
    and binds the two young men in hand-to-hand combat, and is then pressed by Grania
    to obtain the berries. The young men offer to accompany him, but Diarmuid warns
    that seeing the guardian may kill them; he loosens them so they may witness the
    fight.
  language: English
  quote_policy: summarized
