canonical_text:
  quote: ''
  summary: Diarmuid asks his companions how to respond to bonds laid on him, and they
    advise him to follow Grania despite danger from Finn. He arms himself, leaves
    the fort, and warns Grania that the journey is dangerous and that he will keep
    faith with Finn. Grania refuses to return. They flee, first using horses and then
    abandoning them because tracks would help Finn, cross by the Sionnan, leave unbroken
    bread as a sign that Diarmuid has kept faith with Finn, and make a fenced shelter
    in the Wood of the Two Huts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diarmuid asks Oisin, Osgar, Caoilte, and Diorraing what he should do about
    the bonds laid on him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oisin, Osgar, and Diorraing advise Diarmuid to follow Grania; Oisin adds that
    he should keep out of Finn's hands, and Diorraing says the course will bring Diarmuid's
    death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Diarmuid takes his weapons, says farewell, reaches the wall of the dun, and
    uses the shafts of his two spears to leap outside, where Grania meets him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Diarmuid tells Grania the journey is bad, says Finn would be a better lover
    for her, says he knows no place in Ireland that will hide her, and says he will
    not bring her as a wife but will keep faith with Finn; Grania refuses to turn
    back and says she will not part from him until death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After going some distance, Grania says she is tired; Diarmuid refuses to carry
    her, and Grania tells him to fetch two of her father's horses from a grass field.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the ford on the Sionnan, Diarmuid says the horses make it easier for Finn
    to follow their track; Grania tells him to leave the horses, and the two continue
    on foot after crossing and moving westward with the stream.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wherever they go, Diarmuid leaves unbroken bread behind him as a sign to Finn
    that he has kept his faith.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Doire-da-Bhoth, the Wood of the Two Huts, Diarmuid cuts wood around them,
    makes a fence with seven doors of woven twigs, and sets a bed of soft rushes and
    birch-tree tops for Grania in the middle of the wood.
  category: action
  evidence_refs:
  - ev:7
