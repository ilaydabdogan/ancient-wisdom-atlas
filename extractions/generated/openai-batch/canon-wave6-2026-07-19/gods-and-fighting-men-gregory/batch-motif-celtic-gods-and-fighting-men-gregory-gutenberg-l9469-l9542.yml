canonical_text:
  quote: ''
  summary: Finn and the Fianna hunt across hills, woods, and plains. Finn falls asleep
    while Diorraing keeps watch, and the rest of the Fianna abandon the hunt. At evening
    Diorraing finds a well-lit house of the Sidhe belonging to Conan of Ceann Slieve.
    Finn and Diorraing are admitted, identified by their hounds Bran and Sceolan,
    and feasted. Finn asks Conan for his daughter Finndealbh as wife, but Conan says
    she is promised to Fatha, son of the King of Ess Ruadh. Diorraing angrily defends
    Finn, Finn insists he came to ask a wife, and Conan places Finn under heroic bonds
    to answer his questions.
  language: English
  quote_policy: summarized
