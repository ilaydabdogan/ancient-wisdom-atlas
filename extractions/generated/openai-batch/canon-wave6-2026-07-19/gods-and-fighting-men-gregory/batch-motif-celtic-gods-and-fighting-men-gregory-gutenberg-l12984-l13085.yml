  text: Grania sees Finn and the Fianna approaching the Rath with Mac an Chuill and
    says Diarmuid would not be alive if the hound is being led home by Finn.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grania is heavy with child, loses her strength, and falls from the wall.
