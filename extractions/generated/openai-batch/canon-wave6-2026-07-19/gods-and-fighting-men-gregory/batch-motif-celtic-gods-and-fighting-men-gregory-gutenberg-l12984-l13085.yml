- id: obs:4
  text: When Grania is certain of Diarmuid's death, she gives a loud pitiful cry and
    tells her people he died by the Boar of Beinn Gulbain during Finn's hunt.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Grania says she grieves that she cannot fight Finn and would not have let
    him leave safely.
  category: speech
  evidence_refs:
