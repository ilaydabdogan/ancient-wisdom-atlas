canonical_text:
  quote: ''
  summary: Grania sees Finn returning with Diarmuid's hound and understands Diarmuid
    is dead. She mourns, orders her household to retrieve Diarmuid's body, and laments
    over him as husband, king, and champion. Angus learns of Diarmuid's death, meets
    the body-bearers, mourns, blames the boar and Finn's treachery, and takes the
    body to Brugh na Boinne, saying he will try to restore life or make Diarmuid able
    to speak with him.
  language: English
  quote_policy: summarized
literal_observations:
