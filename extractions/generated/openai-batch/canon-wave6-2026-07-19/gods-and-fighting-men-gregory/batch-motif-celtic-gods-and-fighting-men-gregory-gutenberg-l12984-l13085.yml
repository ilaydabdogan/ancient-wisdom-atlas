candidate_motifs:
- id: motif:1
  label: Death inferred from the return of the hero's hound
  taxonomy_refs: []
  basis: Grania says Diarmuid would not be alive if Mac an Chuill were coming home
    led by Finn, making the hound's return a sign of Diarmuid's fate.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents Grania's inference; the hound does not speak or independently
    announce the death.
- id: motif:2
  label: Hero killed by a boar during a hunt
  taxonomy_refs: []
  basis: Diarmuid is repeatedly said to have died by the Boar of Beinn Gulbain in
    a hunt made by Finn.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: This excerpt reports the death but does not narrate the hunt itself.
- id: motif:3
  label: Widow's lament over the dead beloved hero
  taxonomy_refs: []
  basis: Grania laments beside Diarmuid's body, identifies herself as his wife, praises
    his heroic qualities, and speaks of burial and grief.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage is a literary lament; no broader ritual classification is
    asserted beyond the text.
- id: motif:4
  label: Triple cry of communal mourning
  taxonomy_refs: []
  basis: Grania's people give three heavy cries after hearing of Diarmuid's death,
    and Angus with his people later gives three terrible cries over the body.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage repeats the pattern twice but does not explain the number
    three.
- id: motif:5
  label: Protector absent for one night before the hero's death
  taxonomy_refs: []
  basis: Angus says he had kept watch and protection over Diarmuid since infancy but
    had kept no watch the night before the death.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage does not state why Angus failed to keep watch that night.
- id: motif:6
  label: Attempted restoration or animation of the dead hero
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Angus says he will try to bring Diarmuid back to life, and if he cannot,
    will put life into him so he can talk with him every day.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The excerpt records Angus's stated intention but not whether restoration
    or animation succeeds.
- id: motif:7
  label: Peace sign made with reversed shields
  taxonomy_refs: []
  basis: Grania's people hold out the wrong sides of their shields as a sign of peace
    when they meet Angus.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives the sign's function but no further explanation of its
    customary background.
- id: motif:8
  label: Funerary transport with weapons over the body
  taxonomy_refs: []
  basis: Diarmuid's body is placed on a golden bier with spears over it pointing upward
    before being taken to Brugh na Boinne.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage describes the arrangement but does not explain its ritual
    meaning.
