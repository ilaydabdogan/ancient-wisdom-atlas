canonical_text:
  quote: ''
  summary: Caoilte and his companions help the people of the Sidhe by driving away
    yearly red birds and killing three ravens that abduct boys during hurling. In
    return, Ilbrec has Bebind, daughter of Elcmar, treat Caoilte’s spear-poison and
    wounds with a healing bed, water, herbs, milk, and a named washing. During his
    recovery, Caoilte hears music from Uaine and the birds of the Land of Promise,
    and later, when restored, swims with the people of the hill and attends a feast.
  language: English
  quote_policy: summarized
